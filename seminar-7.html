/* =====================================================================
   s0_figs_dna.js — детали схем семинара 7 (ДНК и репликация). Общие для практикума и «Объяснений».
   Условности (как в колоде занятия): тёмно-синяя цепь — старая (матрица), светло-синяя — новая,
   оранжевая — РНК-затравка; красный — дефект или убранная деталь. Это схемы, не химические формулы.
   Белки вилки: хеликаза — зелёное кольцо; ДНК-полимераза — фиолетовая; зажим PCNA — бирюзовое кольцо;
   погрузчик зажима — коричневый; SSB/RPA — жёлтые овалы; праймаза — оранжево-коричневая; лигаза — розовая;
   нуклеазы удаления затравки — серо-синие; топоизомераза — тёмно-фиолетовая.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t() в сценах).
   Группы data-g — для справки по детали (термины словаря: gn_<g>, g_<g>).
   ===================================================================== */
const DN = (function () {
  const C = { old: '#1F3B73', neu: '#8DB4E2', neuD: '#4F86C6', rna: '#E8912A', rung: '#B9C4D2', red: '#C0392B',
    hel: '#2E9B57', pol: '#7C4DBE', pcna: '#1F8A8A', rfc: '#8A5A12', ssb: '#F2C230', prim: '#C96A1E',
    lig: '#D9579B', nuc: '#5E6E80', topo: '#3B2F63', grey: '#7A8899', ink: '#1E2733', ori: '#2E9B57', light: '#9DB0C8' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* наконечник 3′-конца растущей цепи: dir = +1 вправо, −1 влево */
  function head(x, y, dir, col, s = 7) {
    return `<path d="M${f(x + dir * s)},${f(y)} L${f(x - dir * s * .6)},${f(y - s)} L${f(x - dir * s * .6)},${f(y + s)} Z" fill="${col}"/>`;
  }
  /* концевая подпись 5′ / 3′ */
  function end(x, y, txt, anchor = 'middle', col = C.ink) {
    return `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="12" font-weight="600" fill="${col}" style="text-anchor:${anchor}">${txt}</text>`;
  }
  /* поперечные «ступеньки» пар оснований */
  function rungs(x1, x2, ya, yb, step = 14, col = C.rung) {
    let s = ''; for (let x = x1; x <= x2 + .01; x += step) s += line(x, ya, x, yb, col, 2.6, 'stroke-linecap="butt"');
    return s;
  }
  /* цепь: отрезок с необязательным наконечником на 3′-конце */
  function strand(x1, x2, y, col, o = {}) {
    let s = line(x1, y, x2, y, col, o.w || 6, o.dash ? `stroke-dasharray="${o.dash}"` : '');
    if (o.grow === 1) s += head(x2 + 4, y, 1, col);
    if (o.grow === -1) s += head(x1 - 4, y, -1, col);
    return s;
  }
  /* основание в рамке с буквой (вкладка 1) */
  function base(x, y, L, col, o = {}) {
    const fill = o.fill || '#fff', st = o.stroke || col;
    return `<rect x="${f(x - 13)}" y="${f(y - 13)}" width="26" height="26" rx="5" fill="${fill}" stroke="${st}" stroke-width="${o.sw || 2}"/>` +
      `<text class="lbl" x="${f(x)}" y="${f(y + 5)}" font-size="15" font-weight="700" fill="${o.ink || C.ink}">${L}</text>`;
  }
  /* белки вилки */
  const helicase = (x, y, r = 17, op = 1) => G('helicase', `<g opacity="${op}">` + Array.from({ length: 6 }, (_, i) => {
      const a = i / 6 * 2 * Math.PI; return `<circle cx="${f(x + Math.cos(a) * r * .62)}" cy="${f(y + Math.sin(a) * r * .62)}" r="${f(r * .42)}" fill="${C.hel}" stroke="#1d6b3c" stroke-width="1"/>`;
    }).join('') + `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r * .28)}" fill="#fff"/></g>`);
  const polymerase = (x, y, w = 40, h = 26, g = 'polymerase', col = C.pol) => G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${w}" height="${h}" rx="${h / 2}" fill="${col}" stroke="#4b2d80" stroke-width="1.2" opacity=".92"/>`);
  /* аудит Codex A22 (v1.4): кольцо зажима охватывает дуплекс «новая цепь — матрица»; yT — уровень матрицы (без него — прежний рисунок) */
  const clamp = (x, y, op = 1, yT) => yT == null ? G('pcna', `<ellipse cx="${f(x)}" cy="${f(y)}" rx="7" ry="15" fill="none" stroke="${C.pcna}" stroke-width="5" opacity="${op}"/>`)
    : G('pcna', `<ellipse cx="${f(x)}" cy="${f((y + yT) / 2)}" rx="8" ry="${f(Math.abs(yT - y) / 2 + 10)}" fill="none" stroke="${C.pcna}" stroke-width="5" opacity="${op}"/>`);
  const loader = (x, y) => G('rfc', `<path d="M${f(x - 14)},${f(y + 10)} L${f(x - 9)},${f(y - 10)} L${f(x + 9)},${f(y - 10)} L${f(x + 14)},${f(y + 10)} Z" fill="${C.rfc}" stroke="#5a3a0b" stroke-width="1"/>`);
  const ssb = (x1, x2, y, step = 22) => { let s = ''; for (let x = x1; x <= x2 + .01; x += step) s += `<ellipse cx="${f(x)}" cy="${f(y)}" rx="8" ry="5.5" fill="${C.ssb}" stroke="#8a6d00" stroke-width=".9"/>`; return G('ssb', s); };
  const primase = (x, y) => G('primase', `<path d="M${f(x)},${f(y - 13)} L${f(x + 14)},${f(y)} L${f(x)},${f(y + 13)} L${f(x - 14)},${f(y)} Z" fill="${C.prim}" stroke="#7a3f0e" stroke-width="1"/>`);
  const ligase = (x, y) => G('ligase', `<circle cx="${f(x)}" cy="${f(y)}" r="10" fill="${C.lig}" stroke="#8b2d5f" stroke-width="1.2"/>`);
  const nuclease = (x, y) => G('fen1', `<path d="M${f(x - 11)},${f(y + 8)} Q${f(x)},${f(y - 16)} ${f(x + 11)},${f(y + 8)} Z" fill="${C.nuc}" stroke="#36404b" stroke-width="1"/>`);
  const topo = (x, y) => G('topo', `<rect x="${f(x - 12)}" y="${f(y - 18)}" width="24" height="36" rx="9" fill="${C.topo}" opacity=".9"/>`);
  /* зачёркивание убранной детали */
  const cross = (x, y, r = 12) => `<path d="M${f(x - r)},${f(y - r)} L${f(x + r)},${f(y + r)} M${f(x + r)},${f(y - r)} L${f(x - r)},${f(y + r)}" stroke="${C.red}" stroke-width="3" stroke-linecap="round"/>`;
  /* шпилька одноцепочечной ДНК (без SSB) */
  /* аудит Codex A29 (v1.4): шпилька — участок одноцепочечной матрицы выходит из линии, два комплементарных отрезка спарены (стебель
     с парами оснований), на вершине — неспаренная петля. up = 1 — вверх от линии, −1 — вниз. Линия матрицы под шпилькой стирается. */
  const hairpin = (x, y, up = 1, col = C.old) => { const w = 12, h = 22, yy = y - up * h;
    return `<rect x="${f(x - 3)}" y="${f(y - 4)}" width="${w + 6}" height="8" fill="var(--surface)"/>` +
      line(x + 2, y - up * 7, x + w - 2, y - up * 7, C.rung, 2) + line(x + 2, y - up * 15, x + w - 2, y - up * 15, C.rung, 2) +
      `<path d="M${f(x - 3)},${f(y)} L${f(x)},${f(y)} L${f(x)},${f(yy)} A${f(w / 2 + 3)},${f(w / 2 + 3)} 0 1 ${up > 0 ? 1 : 0} ${f(x + w)},${f(yy)} L${f(x + w)},${f(y)} L${f(x + w + 3)},${f(y)}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`; };
  /* точка начала репликации — зелёный треугольник под ДНК */
  const origin = (x, y, on = true) => G('origin', `<path d="M${f(x)},${f(y)} l-7,12 l14,0 z" fill="${on ? C.ori : '#fff'}" stroke="${C.ori}" stroke-width="1.6"/>`);
  /* затравка РНК на цепи (отрезок) */
  const primer = (x1, x2, y) => G('primer', line(x1, y, x2, y, C.rna, 6));
  /* разрыв (одноцепочечный) — маленькая щель с меткой */
  const nick = (x, y) => G('nick', `<rect x="${f(x - 2.5)}" y="${f(y - 6)}" width="5" height="12" fill="#fff"/>` + `<path d="M${f(x)},${f(y - 13)} l0,-7" stroke="${C.red}" stroke-width="1.6"/>`);
  return { C, f, G, line, head, end, rungs, strand, base, helicase, polymerase, clamp, loader, ssb, primase, ligase, nuclease, topo, cross, hairpin, origin, primer, nick };
})();

/* =====================================================================
   s0_figs_dna_adv.js — продвинутый уровень семинара 7 (v1.3, архитектура MAZUNIN_EDU_BIO v2.0, ТЗ семинара 7 v1.0):
   четыре системных исследования. Модели — чистые функции условий; рисунок только отображает состояние модели.
     a1 — ограничивающий ресурс: доступность dNTP при исправной полимеразе;
     a2 — резервные (подготовленные, в норме неактивные) точки начала;
     a3 — завершённость: продвижение вилок ≠ готовность дочерних молекул (два соседних участка);
     a4 — молекула → клетка → ткань: S-фаза, 2c/4c, 46 хромосом, условные популяции;
     amap — итоговая карта зависимостей (не пятая вкладка).
   Все модели — учебные схемы: дискретные правила, условные единицы; числа не измерены (см. «Научный паспорт»).
   Русского текста здесь нет: подписи — через t().
   ===================================================================== */

/* ---------- a1: ограничивающий ресурс ---------- */
DN.a1 = (function(){
  const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
  const TPL = 'TACGTGCATCGA';                       /* та же матрица, что в базовой модели 1б (цепь 1, слева 3′) */
  const NEW = TPL.split('').map(c => PAIR[c]).join('');   /* ATGCACGTAGCT; затравка — первые 3 */
  const NP = 3, NAME = { A: 'dATP', T: 'dTTP', G: 'dGTP', C: 'dCTP' };
  /* av: all — все четыре dNTP в достатке; absent — выбранного dNTP нет; low — выбранного мало.
     x — выбранный dNTP (A/T/G/C); rest: 'yes' — отсутствовавший dNTP снова добавлен (остальные условия те же). */
  function model(av, x, rest){
    const o = { av, x, rest, tpl: TPL, full: NEW, n: 12, state: 'done', next: null, pauseAt: null, slow: [] };
    if (av === 'absent'){
      let i = NP; while (i < 12 && NEW[i] !== x) i++;
      if (i < 12){
        if (rest === 'yes'){ o.state = 'resumed'; o.pauseAt = i; }
        else { o.n = i; o.state = 'stop'; o.next = x; }
      }
    }
    if (av === 'low'){ o.state = 'slow'; for (let i = NP; i < 12; i++) if (NEW[i] === x) o.slow.push(i); }
    o.added = o.n - NP;
    return o;
  }
  const X = i => 50 + 40 * i, YT = 86, YTB = 116, YNB = 170, YN = 200;
  function draw(o, t, mask){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s1a_lbl_head')}</text>`;
    s += DN.G('template', DN.strand(X(0) - 14, X(11) + 14, YT, C.old) + TPL.split('').map((L, i) => DN.line(X(i), YT, X(i), YTB - 13, C.old, 3) + DN.base(X(i), YTB, L, C.old)).join(''));
    s += DN.end(X(0) - 28, YT + 4, '3′') + DN.end(X(11) + 28, YT + 4, '5′');
    /* затравка + новая цепь до позиции n */
    s += DN.G('primer', DN.strand(X(0) - 14, X(NP - 1) + 10, YN, C.neuD));
    if (o.n > NP) s += DN.G('newstrand', DN.strand(X(NP - 1) + 10, X(o.n - 1) + 10, YN, C.neu, { grow: o.n < 12 ? 1 : 0 }));
    for (let i = 0; i < o.n; i++){
      const L = NEW[i], slow = !mask && o.slow.includes(i);
      s += DN.line(X(i), YN, X(i), YNB + 13, i < NP ? C.neuD : C.neu, 3) + DN.G(i < NP ? 'primer' : 'newstrand', DN.base(X(i), YNB, L, i < NP ? '#5E6E80' : C.neuD, slow ? { stroke: '#B7791F', sw: 3 } : {}));
    }
    s += DN.end(X(0) - 28, YN + 4, '5′') + (o.n < 12 ? '' : DN.end(X(11) + 24, YN + 4, '3′'));

      let g = `<rect x="${x - w / 2}" y="${y0}" width="${w}" height="${h}" rx="6" fill="#fff" stroke="${C.neuD}" stroke-width="2"/>`;

      else {
        if (lvl > 0) g += `<rect x="${x - w / 2 + 3}" y="${(y0 + h - 3 - (h - 6) * lvl).toFixed(1)}" width="${w - 6}" height="${((h - 6) * lvl).toFixed(1)}" rx="4" fill="${C.neu}" opacity=".85"/>`;

  /* v1.4, шкала этапов: кадр в момент T (этапы 1 — затравка, 2 — первый нуклеотид, 3 — рост цепи, 4 — исход; при «снова добавлен»:
     4 — остановка, 5 — продолжение). Конечный кадр совпадает со статичной схемой; скорость синтеза модель не рассчитывает. */
  function frame(o, T){
    const nf = o.state === 'resumed' ? o.pauseAt : o.n, k = Math.ceil(T - 1e-9);
    const g = n => Object.assign({}, o, { n, state: 'grow', added: n - NP });

    if (k === 2) return g(Math.min(NP + 1, nf));
    if (k === 3) return g(Math.min(nf, NP + 1 + Math.round((nf - NP - 1) * Math.min(1, T - 2))));
    if (o.state === 'resumed'){
      if (k === 4) return Object.assign({}, o, { n: o.pauseAt, state: 'stop', next: o.x, added: o.pauseAt - NP });
      if (T < 5 - 1e-9) return Object.assign(g(o.pauseAt + Math.round((12 - o.pauseAt) * (T - 4))), { state: 'grow' });

})();

/* ---------- a2: резервные точки начала ---------- */
DN.a2 = (function(){
  /* v1.4 (решение автора 11.11.2026): подготовка (лицензирование) и запуск — разные события; статус «запущенная» или «резервная»
     точке не закреплён — в каждой клетке он решается заново, во многом случайно. Модель показывает одну клетку с заданным исходом.
     Участок между точками A (x = 0) и Б (x = L), которые в этой клетке запустились в начале S-фазы: L = 8 («близко») или 16 («далеко»),
     условные единицы. Подготовленные, но не запущенные в начале S-фазы точки: В (x = 4) и при L = 16 ещё Г (x = 12) (v1.4: нейтральные имена вместо «Р1/Р2» — «резервная» не вид точки, а исход в клетке).
     Скорость вилки — 1 ед. за условный шаг (правило модели, не измерение); окно S-фазы — 10 шагов.
     Задержка: вилка A→ останавливается при x = 2 (шаг 2); при двух задержках ещё вилка ←Б при x = L − 2.
     Исход «в этой клетке резервная точка запустилась» (fire = yes): на шаге 3 у остановленной вилки запускается ближайшая подготовленная,
     ещё не скопированная точка в нескопированном промежутке. fire = no — та же точка в этой клетке не запустилась (в клетке запуск
     вероятностный, обязательным он не бывает). Скопированная точка не запускается. Остановленная вилка в модели не возобновляется. */
  const T_END = 10, DT = .5;
  function model(geom, stall, prep, fire){
    const L = geom === 'far' ? 16 : 8, dorm = geom === 'far' ? [4, 12] : [4];
    if (prep !== 'yes') fire = 'no';
    const N = L / DT, cov = new Array(N).fill(-1);   /* cov[i] — шаг, когда ячейка [i·DT, (i+1)·DT) скопирована; −1 — нет */
    const stops = { A: stall !== 'none' ? 2 : null, B: stall === 'two' ? L - 2 : null };
    const forks = [{ id: 'A', x: 0, dir: 1, stop: stops.A, alive: true }, { id: 'B', x: L, dir: -1, stop: stops.B, alive: true }];
    const ds = dorm.map(x => ({ x, st: prep === 'yes' ? 'wait' : 'none', t: null }));
    const snap = tm => ({ tm, f: forks.map(f => ({ x: f.x, dir: f.dir, alive: f.alive, stopped: !!f.stopped, born: f.born })) });
    const hist = [snap(0)];   /* положения вилок после каждого полушага — для пошагового хода и анимации */
    let done = null;
    const cellAt = x => Math.floor(x / DT + 1e-9);
    for (let step = 1; step <= T_END / DT; step++){
      const tm = step * DT;
      /* запуск резерва (шаг 3) — исход «в этой клетке запустилась» */
      if (Math.abs(tm - 3) < 1e-9 && fire === 'yes'){
        forks.filter(f => f.stopped).forEach(f => {
          const cand = ds.filter(d => d.st === 'wait' && cov[cellAt(d.x)] < 0 && cov[cellAt(d.x - DT)] < 0)
            .filter(d => { /* в промежутке по ходу остановленной вилки до первой скопированной ячейки */
              const a = Math.min(f.x, d.x), b = Math.max(f.x, d.x);
              for (let i = cellAt(a + 1e-6); i < cellAt(b - 1e-6); i++) if (cov[i] >= 0) return false; return (d.x - f.x) * f.dir > 0; })
            .sort((p, q) => Math.abs(p.x - f.x) - Math.abs(q.x - f.x));
          if (cand.length){ const d = cand[0]; d.st = 'fired'; d.t = tm;
            forks.push({ id: 'R' + d.x, x: d.x, dir: -1, alive: true, born: tm }, { id: 'R' + d.x, x: d.x, dir: 1, alive: true, born: tm }); }
        });
      }
      forks.forEach(f => {
        if (!f.alive || f.born === tm) return;   /* новые вилки резервной точки начинают движение со следующего шага */
        if (f.stop != null && Math.abs(f.x - f.stop) < 1e-9){ f.alive = false; f.stopped = true; return; }
        const i = f.dir > 0 ? cellAt(f.x) : cellAt(f.x) - 1;
        if (i < 0 || i >= N || cov[i] >= 0){ f.alive = false; return; }   /* край участка или встреча со скопированной ДНК */
        cov[i] = tm; f.x += f.dir * DT;
      });
      ds.forEach(d => { if (d.st === 'wait' && cov[cellAt(d.x)] >= 0 && cov[cellAt(d.x - DT)] >= 0) { d.st = 'passive'; d.t = tm; } });
      if (done == null && cov.every(c => c >= 0)) done = tm;

    }
    /* промежутки, не скопированные к концу S-фазы */
    const gaps = []; let g0 = null;
    for (let i = 0; i <= N; i++){ const un = i < N && cov[i] < 0; if (un && g0 == null) g0 = i * DT; if (!un && g0 != null){ gaps.push([g0, i * DT]); g0 = null; } }
    const copied = cov.filter(c => c >= 0).length / N;
    /* чем закрыт промежуток у остановленной вилки A→ (x от 2 до первой резервной/встречной) */
    let closer = 'none';
    if (stall !== 'none' && done != null) closer = ds.some(d => d.st === 'fired') ? 'reserve' : 'opposite';
    if (stall === 'none') closer = 'normal';
    return { geom, stall, prep, fire, L, dorm: ds, gaps, copied, done, closer, stops, T_END, cov, hist };
  }
  /* событие шага k (1…10) для шкалы пошагового хода: одна подпись на шаг, по приоритету */
  function stepEvent(o, k){
    const at = x => x != null && x > k - 1 + 1e-9 && x <= k + 1e-9;
    if (k === 1) return 'start';
    if (o.done != null && at(o.done)) return 'done';
    if (k === 2 && o.stall !== 'none') return o.stall === 'two' ? 'stall2' : 'stall';
    if (k === 3 && o.stall !== 'none') return o.dorm.some(d => d.st === 'fired') ? 'fire' : o.prep !== 'yes' ? 'noprep' : 'nofire';
    if (o.dorm.some(d => d.st === 'passive' && at(d.t))) return 'passive';

     m == null — конечный кадр (статичная схема): исходы, подписи и показания совпадают со статичной версией */
  function draw(o, t, mask, m){
    const C = DN.C, sx = x => X0 + x / 16 * W, fin = m == null || m >= o.T_END - 1e-9, g1 = !fin && m <= 1e-9;
    const cov = fin ? o.cov : o.cov.map(c => c >= 0 && c <= m + 1e-9 ? c : -1);
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${fin ? t('s2a_lbl_head', { T: o.T_END }) : g1 ? t('s2a_lbl_head_g1') : t('s2a_lbl_head_t', { k: Math.ceil(m - 1e-9), T: o.T_END })}</text>`;
    /* участок: родительская ДНК (две тёмные линии); скопированное — с новыми цепями */
    s += DN.G('template', DN.line(sx(0), Y - 8, sx(o.L), Y - 8, C.old, 5) + DN.line(sx(0), Y + 8, sx(o.L), Y + 8, C.old, 5));
    /* скопированные ячейки — светло-синие новые цепи снаружи («пузырьки») */
    let run = null; const segs = [];
    for (let i = 0; i <= cov.length; i++){ const c = i < cov.length && cov[i] >= 0; if (c && run == null) run = i; if (!c && run != null){ segs.push([run * .5, i * .5]); run = null; } }
    /* пошаговый ход: вилки между полушагами — продолжение отрезка до текущего положения вилки */
    const fx = [];
    if (!fin && !g1){
      const i0 = Math.min(o.hist.length - 1, Math.floor(m / DT + 1e-9)), h0 = o.hist[i0], h1 = o.hist[Math.min(o.hist.length - 1, i0 + 1)];
      h0.f.forEach((f, j) => { if (f.born != null && f.born > m + 1e-9) return;
        const nx = h1.f[j], moving = f.alive && nx && (nx.x !== f.x), x = moving ? f.x + f.dir * Math.min(DT, m - h0.tm) : f.x;
        if (moving && Math.abs(x - f.x) > 1e-6) segs.push([Math.min(f.x, x), Math.max(f.x, x)]);
        if (f.alive || (nx && nx.alive)) fx.push([x, f.dir]); });

    segs.forEach(([a, b]) => { s += DN.G('newstrand', DN.line(sx(a), Y - 22, sx(b), Y - 22, C.neu, 5) + DN.line(sx(a), Y + 22, sx(b), Y + 22, C.neu, 5)); });
    /* движущиеся вилки (только в пошаговом ходе): клин по направлению движения */
    fx.forEach(([x, d]) => { const X = sx(x); s += DN.G('fork', `<path d="M${(X - d * 4).toFixed(1)},${Y - 30} L${(X + d * 9).toFixed(1)},${Y} L${(X - d * 4).toFixed(1)},${Y + 30}" fill="none" stroke="${C.old}" stroke-width="2.6" stroke-linejoin="round"/>`); });
    /* нескопированные промежутки к концу S-фазы — красная штриховая рамка */

    /* точки A и Б: до S-фазы — подготовлены (контур), в S-фазе — запущены в этой клетке */
    s += DN.origin(sx(0), Y + 30, !g1) + `<text class="lbl" x="${sx(0)}" y="${Y + 56}" font-size="13" font-weight="700">A</text>`;
    s += DN.origin(sx(o.L), Y + 30, !g1) + `<text class="lbl" x="${sx(o.L)}" y="${Y + 56}" font-size="13" font-weight="700">${t('s2a_lbl_B')}</text>`;
    /* резервные точки (подготовлены, в начале S-фазы не запущены) */

      const x = sx(d.x), nm = ['В', 'Г'][i], st = fin ? d.st : (d.t != null && d.t <= m + 1e-9) ? d.st : (o.prep === 'yes' ? 'wait' : 'none');
      if (mask) s += DN.G('dormant', `<path d="M${x},${Y + 30} l-7,12 l14,0 z" fill="#fff" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="2 2"/>`);
      else if (st === 'none') s += DN.G('dormant', `<path d="M${x - 6},${Y + 32} l12,12 M${x + 6},${Y + 32} l-12,12" stroke="${C.grey}" stroke-width="2"/>`);
      else s += DN.G('dormant', `<path d="M${x},${Y + 30} l-7,12 l14,0 z" fill="${st === 'fired' ? C.ori : '#fff'}" stroke="${C.ori}" stroke-width="1.6" ${st === 'passive' ? 'stroke-dasharray="3 2"' : ''}/>`);
      s += `<text class="lbl" x="${x}" y="${Y + 56}" font-size="12.5">${nm}</text>`;
      if (!mask) s += `<text class="lbl" x="${x}" y="${Y + 72}" font-size="11">${t('s2a_d_' + st)}</text>`;
    });

    /* рецензия v1.3, Н-04: в обратной задаче (mask) места остановки не показываются — их выводят из наблюдения */
    const stallNow = fin || m >= 2 - 1e-9;

    /* обозначения */
    ['s2a_lbl_key1', 's2a_lbl_key2', 's2a_lbl_key3'].forEach((k, i) => { s += `<text class="lbl-l" x="14" y="${54 + i * 19}" font-size="12">${t(k)}</text>`; });

  }
  /* «Разные клетки»: одни и те же подготовленные точки — разный набор запущенных. Наборы условные (пример, не измерение):

  const CELLS_NARROW = { W: 360, H: 450 };

      o.pts.forEach(([x], j) => { const fired = on && on[j];
        r += on == null ? DN.origin(sx(x), y + 8, false)
