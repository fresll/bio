 не копируется второй раз в той же S-фазе: точку, через которую прошла вилка, уже нельзя запустить.", "p2a_1_e": "Резервная точка остаётся неактивной, пока вилки идут без задержек: вилка проходит через неё, и вместе с участком точка теряет способность к запуску до следующего клеточного цикла.", "p2a_1_h1": "Успеет ли вилка дойти до отметки 4, пока точка В не запущена? Что происходит с точкой, через которую прошла вилка?", "p2a_1_h2": "Может ли скопированный участок быть скопирован ещё раз в той же S-фазе?", "p2a_2_q": "Вилка от A остановилась на отметке 2. Точка В подготовлена, и в этой клетке она запускается; точка Б близко (8 ед.). Что изменит запуск точки В по сравнению с ходом без него?", "p2a_2_o1": "Точка В даст две вилки и закроет промежуток раньше, чем одна вилка от Б", "p2a_2_o2": "Точка В возобновит движение остановленной вилки от A, и та дойдёт до вилки от Б", "p2a_2_o3": "Ничего: резервная точка запускается, только если остановились обе встречные вилки", "p2a_2_w2": "Резервная точка не чинит остановленную вилку, а образует две новые вилки рядом с ней.", "p2a_2_w3": "По простой расчётной модели задержка соседних вилок повышает вероятность запуска подготовленных точек и при одной остановленной вилке; в клетке запуск дополнительно регулируется. В этих условиях точка В запустилась; в другой клетке она могла бы и не запуститься.", "p2a_2_e": "Без резерва промежуток 2–8 копирует одна вилка от Б, к шагу 6. С резервом его копируют сразу две вилки, и участок готов к шагу 5. В клетке запуск резервной точки случаен: в одних клетках она запускается, в других нет; переключатель модели задаёт исход для одной клетки.", "p2a_2_h1": "Сколько вилок даёт запущенная точка начала?", "p2a_3_q": "Та же остановка вилки от A, точка Б близко, но резервные точки не подготовлены до S-фазы. Будет ли участок скопирован к концу S-фазы (шаг 10)?", "p2a_3_o1": "Да: встречная вилка от Б дойдёт до остановленной, хотя и позже", "p2a_3_o2": "Нет: без резерва промежуток у остановленной вилки не закроется", "p2a_3_o3": "Да: в S-фазе будет подготовлена новая точка начала", "p2a_3_w2": "Промежуток может закрыть встречная вилка: от отметки 8 до отметки 2 она дойдёт к шагу 6 — до конца S-фазы.", "p2a_3_w3": "Точки начала подготавливаются только до S-фазы; в S-фазе новых точек не появляется — это и предотвращает повторное копирование.", "p2a_3_e": "Из отсутствия резерва ещё не следует незавершённое копирование: нужно проверить, может ли дойти встречная вилка и успеет ли она.", "p2a_3_h1": "Откуда ещё может прийти вилка к месту остановки вилки от A?", "p2a_4_q": "Теперь точка Б вдвое дальше (16 ед.); резерва нет, вилка от A остановилась на отметке 2. Хватит ли S-фазы (10 шагов), чтобы скопировать участок?", "p2a_4_o1": "Нет: вилка от Б дойдёт до отметки 2 лишь к шагу 14; часть участка не скопируется", "p2a_4_o2": "Да: встречная вилка всегда успевает закрыть промежуток до конца S-фазы", "p2a_4_o3": "Нет, и нескопированным останется весь участок между точками начала A и Б", "p2a_4_w2": "Встречной вилке нужно время: при скорости 1 ед. за шаг путь от 16 до 2 займёт 14 шагов, а S-фаза в модели — 10.", "p2a_4_w3": "Большую часть участка вилка от Б скопирует: к концу S-фазы она дойдёт до отметки 6. Не скопирован только промежуток 2–6.", "p2a_4_e": "Это контрпример к выводу шага 3: встречная вилка закрывает промежуток, только если успевает до конца S-фазы. Время копирования зависит от расстояния до соседней точки начала.", "p2a_4_h1": "За сколько шагов вилка от Б пройдёт от отметки 16 до отметки 2?", "p2a_5_q": "Точка Б близко. Обе встречные вилки остановились (отметки 2 и 6), резерва нет — промежуток 2–6 не скопирован. Что изменится, если точка В подготовлена и в этой клетке запустится?", "p2a_5_o1": "Вилки точки В скопируют промежуток 2–6, и участок будет готов до конца S-фазы", "p2a_5_o2": "Ничего: резерв помогает, только если одна из встречных вилок продолжает двигаться", "p2a_5_o3": "Точка В скопирует промежуток, после чего остановленные вилки пройдут его второй раз", "p2a_5_w2": "Именно при двух остановленных вилках резерв незаменим: в модели остановленные вилки не возобновляются, и кроме подготовленной точки между ними копировать этот промежуток некому.", "p2a_5_w3": "Встретив скопированную ДНК, вилки в этой модели заканчивают работу: повторного копирования нет.", "p2a_5_e": "Если остановленные вилки не возобновятся, промежуток в той же S-фазе может скопировать только точка начала, подготовленная внутри него заранее: новые точки в S-фазе не подготавливаются. Поэтому важна плотность подготовленных точек. В клетке остановленные вилки иногда возобновляют движение — модель этого не учитывает; а подготовленная точка может и не запуститься (переключатель исхода).", "p2a_5_h1": "Может ли вилка прийти в промежуток 2–6 снаружи, если обе встречные вилки стоят?", "p2a_6_q": "Условия: один и тот же участок в четырёх клетках; до S-фазы в каждой подготовлены точки A, В, Г и Б. В клетке 1 в начале S-фазы запустились A и Б, а точка В осталась резервной — её скопировала проходящая вилка. Что можно сказать о точке В в клетке 2?", "p2a_6_o1": "Точка В может как запуститься, так и остаться резервной: какие из подготовленных точек запустятся, в каждой клетке решается заново", "p2a_6_o2": "Точка В и в клетке 2 останется резервной: резервные точки — особый, постоянный вид точек начала", "p2a_6_o3": "Точка В в клетке 2 обязательно запустится, потому что в клетке 1 она не работала", "p2a_6_w2": "Резервной точка бывает в конкретной клетке и конкретной S-фазе. Подготовлены все четыре точки одинаково, а запуск — во многом случайный выбор из подготовленных.", "p2a_6_w3": "Запуск в разных клетках независим: то, что произошло в клетке 1, не определяет выбор в клетке 2, и точка В может снова остаться резервной.", "p2a_6_e": "Подготовка (лицензирование) и запуск — разные события. До S-фазы подготовлено больше точек, чем запустится; в S-фазе запускается часть из них, и в разных клетках — разная. Поэтому деления на «постоянно основные» и «постоянно резервные» точки нет. Наборы на схеме условные.", "p2a_6_h1": "Чем различаются клетки на схеме до S-фазы? А в S-фазе?", "p2a_6_h2": "Определяет ли то, что произошло в клетке 1, судьбу точки В в клетке 2?", "p2a_7_q": "Наблюдение к концу S-фазы: между отметками 2 и 6 осталась нескопированная ДНК; точка Б близко. Состояние резервной точки не показано. Какие причины совместимы с наблюдением?", "p2a_7_o1": "Обе встречные вилки остановились, а резерв не сработал — не подготовлен или не запустился", "p2a_7_o2": "Остановилась только вилка от A, а встречная вилка от Б не успела до конца S-фазы", "p2a_7_o3": "Резервная точка не была подготовлена до S-фазы — другой причины быть не может", "p2a_7_w2": "При близкой точке Б встречная вилка закрыла бы промежуток к шагу 6 — задолго до конца S-фазы. Промежуток с обеих сторон означает, что остановились обе вилки.", "p2a_7_w3": "Та же картина получится, если точка подготовлена, но не запустилась. Чтобы различить варианты, нужно знать, была ли точка подготовлена до S-фазы.", "p2a_7_e": "Одно наблюдение совместимо с двумя причинами. Различить их помогло бы независимое наблюдение — состояние резервной точки до начала S-фазы.", "p2a_7_h1": "Какая вилка могла бы прийти с другой стороны промежутка?", "p2a_7_h2": "Резерв не сработал — это одна причина или две разные?", "p2a_7_h3": "Сравните с шагом 3: к какому шагу дошла бы встречная вилка от близкой точки Б?", "s3a_dA": "Участок A: не выполнено", "s3a_dB": "Участок Б: не выполнено", "s3a_d_none": "всё выполнено", "s3a_d_fork": "продвижение вилки", "s3a_d_rem": "удаление затравок", "s3a_d_fill": "заполнение брешей", "s3a_d_lig": "сшивание", "s3a_ctrl_note": "В модели операции разведены и идут по порядку: продвижение вилки → удаление РНК-затравок → заполнение брешей → сшивание лигазой; задержанная операция не отменяет сделанного раньше, а следующие за ней в модели не выполняются. В клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут происходить сопряжённо; на схеме они разведены, чтобы различать РНК, брешь и разрыв. Обязательный конечный результат — РНК-затравок нет, цепь ДНК непрерывна.", "s3a_lbl_head": "учебная схема · два соседних участка · одна новая цепь из фрагментов", "s3a_lbl_A": "Участок A", "s3a_lbl_B": "Участок Б", "s3a_lbl_junc": "стык участков", "s3a_lbl_blur": "состояние новой цепи не показано", "s3a_k_rna": "РНК-затравка", "s3a_k_dna": "новая ДНК", "s3a_k_old": "матрица", "s3a_k_nick": "разрыв (не сшито)", "s3a_k_gap": "брешь (нет нуклеотидов)", "s3a_lbl_ready": "Новая цепь на этом отрезке готова", "s3a_lbl_notready": "Ещё не готово", "s3a_lbl_obs": "Наблюдение", "s3a_lbl_foot": "Вторая новая цепь не показана; длины условные.", "s3a_r_A": "Участок A", "s3a_r_B": "Участок Б", "s3a_v_cov_full": "вилка прошла весь участок", "s3a_v_cov_part": "вилка прошла не весь участок", "s3a_v_rna": "РНК-затравки остались", "s3a_v_gaps": "есть бреши", "s3a_v_nicks": "есть разрывы", "s3a_v_cont": "новая цепь непрерывна", "s3a_v_blur": "вилка прошла весь участок; новая цепь не стала непрерывной; подробности не показаны", "s3a_r_all": "Обе дочерние молекулы готовы", "s3a_r_all_s": "правило: вилки прошли оба участка, а новые цепи стали непрерывной ДНК — без РНК, брешей и разрывов, стык сшит", "s3a_v_all_yes": "да", "s3a_v_all_no": "нет", "s3a_v_all_mask": "определите по схеме", "s3a_r_block": "Что не выполнено", "s3a_v_block": "{ops}", "s3a_op_fork": "продвижение вилки по участку", "s3a_op_rem": "удаление РНК-затравок", "s3a_op_fill": "заполнение брешей", "s3a_op_lig": "сшивание разрывов лигазой", "s3a_and": "и", "s3a_cap_ready": "На обоих участках вилка прошла, затравки удалены, бреши заполнены ДНК, разрывы сшиты; сшит и стык участков. Новые цепи обеих дочерних молекул на этом отрезке — непрерывная ДНК.", "s3a_cap_ready_z": "Готовность — свойство всего отрезка: её проверяют по всем участкам и стыкам.", "s3a_cap_one": "Один участок готов, на другом не выполнено: {ops}. Отрезок в целом ещё не готов, а стык участков не сшит.", "s3a_cap_one_z": "Завершённость одного участка не означает готовности всей молекулы.", "s3a_cap_both": "Ни один участок не готов: не выполнено {ops}.", "s3a_cap_both_same": "Ни один участок не готов: на обоих не выполнено {ops}.", "s3a_cap_both_z": "Узких мест может быть несколько; каждое нужно найти отдельно.", "s3a_cap_mask": "Наблюдение — на схеме. Какая операция не выполнена, пока не показано.", "s3a_cap_mask_z": "Определите это по промежуточному продукту.", "s3a_tl_note": "Порядок операций — учебная модель: в клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут идти сопряжённо. Время шкалы условное.", "s3a_tl_1": "Вилка проходит участок; на матрице — фрагменты отстающей новой цепи, их 5′-концы ещё представлены РНК-затравками.", "s3a_tl_2": "РНК-затравки удалены; на их месте бреши.", "s3a_tl_3": "Бреши заполнены ДНК; между фрагментами остались разрывы.", "s3a_tl_4": "Лигаза сшивает разрывы; новая цепь участка непрерывна. Участок с задержанной операцией дальше не продвигается.", "s3a_tl_5": "Стык сшит, только когда готовы оба соседних участка.", "s3a_take": "Прохождение вилки, покрытие матрицы продуктами синтеза — фрагментами ДНК с РНК-затравками — и зрелая непрерывная цепь ДНК — разные характеристики. Вилка может пройти весь участок, а новая цепь ещё будет содержать РНК-затравки, бреши или разрывы. Отрезок хромосомы удвоен только тогда, когда все участки и стыки между ними доведены до непрерывной ДНК без РНК. Узкое место определяют по промежуточному продукту: оранжевая РНК — не удалены затравки, пустая брешь — не заполнены бреши, узкий разрыв — не выполнено сшивание. Раздельные этапы — условность модели: в клетке эти операции могут идти сопряжённо.", "p3a_1_q": "Условия: два соседних участка одной хромосомы. Участок A полностью готов; на участке Б вилка ещё не дошла до конца. Можно ли сказать, что ДНК этого отрезка удвоена?", "p3a_1_o1": "Нет: на Б часть матрицы не скопирована, стык участков не сшит", "p3a_1_o2": "Да: если готов один участок, остальные завершатся сами собой", "p3a_1_o3": "Да: удвоение означает, что хотя бы одна вилка дошла до конца", "p3a_1_w2": "Каждый участок завершается своей работой; готовность одного не переносится на другой.", "p3a_1_w3": "Удвоение — свойство всей молекулы: скопированы должны быть все участки, а новые цепи соединены.", "p3a_1_e": "Отрезок готов, только когда готовы оба участка и стык между ними. Продвижение одной вилки — лишь одна из необходимых операций.", "p3a_1_h1": "Посмотрите на правило готовности в показаниях.", "p3a_2_q": "На обоих участках вилка прошла весь участок: на матрице уже сформированы фрагменты новой цепи. На участке Б их 5′-концы всё ещё представлены РНК-затравками. Готова ли новая цепь участка Б?", "p3a_2_o1": "Нет: в ней ещё есть РНК; нужны удаление, заполнение и сшивание", "p3a_2_o2": "Да: вилка прошла весь участок, и матрица занята фрагментами — это и есть готовность", "p3a_2_o3": "Да: достаточно сшить фрагменты вместе с оставшимися затравками", "p3a_2_w2": "Прохождение вилки и покрытие матрицы фрагментами — необходимые, но не достаточные условия: часть новой цепи ещё представлена РНК, а не ДНК.", "p3a_2_w3": "Обязательный итог созревания — цепь без РНК: затравки заменяются ДНК, и только тогда лигаза сшивает разрывы между соседними участками ДНК.", "p3a_2_e": "Прохождение вилки, покрытие матрицы продуктами синтеза (ДНК и РНК-затравками) и непрерывная цепь ДНК — разные состояния. В модели после удаления затравок остаются бреши, после их заполнения — разрывы; цепь становится непрерывной ДНК только после сшивания.", "p3a_2_h1": "Чем «вилка прошла участок» отличается от «новая цепь стала непрерывной ДНК»?", "p3a_3_q": "На участке Б затравки удалены, бреши заполнены. Какая операция осталась последней?", "p3a_3_o1": "Сшивание: остались разрывы между участками ДНК", "p3a_3_o2": "Заполнение брешей: между фрагментами остались промежутки", "p3a_3_o3": "Продвижение вилки: часть матрицы ещё не скопирована", "p3a_3_w2": "Бреши уже заполнены — по условию. Остались разрывы: соседние нуклеотиды стоят рядом, но не соединены.", "p3a_3_w3": "Вилка участок уже прошла: иначе на нём не было бы фрагментов, с которых удалили затравки.", "p3a_3_e": "Последняя операция — сшивание лигазой: она соединяет 3′-OH одного участка ДНК с 5′-фосфатом соседнего. Одиночный разрыв одной цепи — не двуцепочечный разрыв ДНК.", "p3a_3_h1": "Что остаётся между соседними участками ДНК после заполнения брешей?", "p3a_4_q": "Участок A готов. На участке Б — см. схему: затравок нет, а между фрагментами пустые бреши. Какую операцию нужно выполнить на Б следующей и будет ли её одной достаточно?", "p3a_4_o1": "Заполнение брешей; после него понадобится ещё сшивание", "p3a_4_o2": "Сшивание: лигаза соединит фрагменты через бреши", "p3a_4_o3": "Удаление затравок: на концах фрагментов осталась РНК", "p3a_4_w2": "Лигаза соединяет соседние нуклеотиды, между которыми нет промежутка; брешь сначала заполняет ДНК-полимераза.", "p3a_4_w3": "Оранжевых участков РНК на схеме нет: затравки уже удалены.", "p3a_4_e": "Узкое место участка Б — незаполненные бреши. Одной операции мало: после заполнения нужно ещё сшивание. Общий результат зависит от всей цепочки операций, а не от последней выполненной.", "p3a_4_h1": "Есть ли на схеме оранжевые участки? А пустые промежутки?", "p3a_4_h2": "Что умеет лигаза и чего не умеет?", "p3a_5_q": "Наблюдение: вилка прошла участок Б, вилок на нём нет, но новая цепь не стала непрерывной; подробностей нет. Что можно сказать о причине?", "p3a_5_o1": "Причин несколько: РНК-затравки, бреши или разрывы; различит их вид продукта", "p3a_5_o2": "Не выполнено сшивание — других причин прерывистой новой цепи не бывает", "p3a_5_o3": "Вилка остановилась раньше конца участка, и часть матрицы осталась нескопированной", "p3a_5_w2": "Прерывистой цепь остаётся и при незаполненных брешах, и при оставшейся РНК; разрывы — лишь один из вариантов.", "p3a_5_w3": "По условию вилка участок прошла: дело не в остановке вилки, а в незавершённом созревании новой цепи.", "p3a_5_e": "Наблюдение «цепь не непрерывна» совместимо с тремя незавершёнными операциями. После ответа схема показывает истинное состояние: на участке Б остались РНК-затравки.", "p3a_5_h1": "Какие операции идут после продвижения вилки?", "p3a_5_h2": "Каждая незавершённая операция оставляет свой промежуточный продукт. Какой?", "s4a_ctx": "Клетки", "s4a_ctx_blood": "предшественники крови", "s4a_ctx_crypt": "кишка: крипта", "s4a_ctx_villus": "кишка: ворсинка", "s4a_ctx_neuron": "зрелые нейроны", "s4a_view": "Показать", "s4a_view_cell": "одну клетку", "s4a_view_pop": "набор клеток", "s4a_ph": "Состояние клетки", "s4a_ph_G0": "G0", "s4a_ph_G1": "G1", "s4a_ph_S": "S", "s4a_ph_G2": "G2", "s4a_ph_M": "митоз до расхождения хроматид", "s4a_ph_D": "после деления", "s4a_pnote_pop": "В наборе клеток состояние не выбирается: клетки находятся в разных фазах.", "s4a_pnote_pop_nodiv": "В наборе клеток состояние не выбирается: все клетки набора вне цикла (G0).", "s4a_pnote_nodiv": "Эти клетки в модели не делятся и находятся вне цикла (G0); другие состояния недоступны.", "s4a_lbl_ctx_blood": "предшественники клеток крови (большинство делится) · учебная схема", "s4a_lbl_ctx_crypt": "кишка: клетки крипты (большинство делится) · учебная схема", "s4a_lbl_ctx_villus": "кишка: клетки ворсинки (не делятся) · учебная схема", "s4a_lbl_ctx_neuron": "зрелые нейроны · учебная схема", "s4a_lbl_ctx_mask": "тип ткани не указан · учебная схема", "s4a_lbl_cyc": "клеточный цикл", "s4a_lbl_two": "в ядре 46 хромосом; показаны две", "s4a_lbl_two_cells": "две дочерние клетки, в каждой 46 хромосом", "s4a_lbl_s_mid": "пунктир — часть хроматиды, ещё не скопированная", "s4a_lbl_dna": "количество ядерной ДНК", "s4a_lbl_between": "между 2c и 4c", "s4a_lbl_nodiv": "клетка вне цикла: ядерный геном не копируется", "s4a_lbl_foot": "Диплоидная соматическая клетка человека; c — ДНК гаплоидного набора.", "s4a_pop_2c": "2c: {n}", "s4a_pop_mid": "между 2c и 4c (S-фаза): {n}", "s4a_pop_4c": "4c (G2 и митоз): {n}", "s4a_lbl_hist": "число клеток по количеству ДНК", "s4a_lbl_foot_pop": "Условный набор из 12 клеток — не измерение ткани.", "s4a_r_dna": "Ядерная ДНК", "s4a_r_dna_s": "c — количество ДНК гаплоидного набора", "s4a_v_dna_2c": "2c", "s4a_v_dna_mid": "между 2c и 4c", "s4a_v_dna_4c": "4c", "s4a_r_chr": "Хромосом", "s4a_v_chr_one": "46", "s4a_v_chr_D": "по 46 в каждой из двух клеток", "s4a_r_cht": "Хроматид в каждой хромосоме", "s4a_v_cht_1": "одна", "s4a_v_cht_1to2": "одна → две (на скопированных участках уже две молекулы ДНК)", "s4a_v_cht_2": "две сестринские", "s4a_r_repl": "Копируется ли сейчас весь ядерный геном", "s4a_r_repl_s": "репликация ядерной ДНК идёт только в S-фазе", "s4a_v_repl_yes": "да", "s4a_v_repl_no": "нет", "s4a_r_next": "Что дальше", "s4a_v_next_G0": "клетка вне цикла; к делению не готовится", "s4a_v_next_G1": "если клетка продолжит цикл — S-фаза; может выйти в G0", "s4a_v_next_S": "G2, затем митоз", "s4a_v_next_G2": "митоз", "s4a_v_next_M": "расхождение сестринских хроматид", "s4a_v_next_D": "две клетки в G1: каждая может пройти следующий цикл или выйти в G0", "s4a_r_pop": "Клеток по количеству ДНК", "s4a_r_pop_s": "условный набор из 12 клеток", "s4a_v_pop": "2c: {a} · между: {b} · 4c: {c}", "s4a_r_inS": "Копируют ядерную ДНК сейчас", "s4a_v_inS": "{b} из 12", "s4a_r_rate": "Можно ли по снимку рассчитать скорость обновления ткани", "s4a_v_rate": "нет: нужны длительности фаз и данные о клетках во времени", "s4a_r_g0": "Можно ли по 2c отличить G0 от G1", "s4a_v_g0": "нет: количество ДНК одинаково", "s4a_v_self": "определите сами", "s4a_cap_G0": "G0: клетка вне цикла; ядерной ДНК 2c, 46 хромосом по одной хроматиде. Ядерный геном не копируется.", "s4a_cap_G0_z": "Из G0 клетки многих типов могут вернуться в цикл, если получат сигнал к делению.", "s4a_cap_G1": "G1: 2c, 46 хромосом, в каждой одна хроматида — одна двухцепочечная молекула ДНК.", "s4a_cap_G1_z": "По количеству ДНК G1 не отличить от G0.", "s4a_cap_S": "S-фаза: идёт репликация ядерной ДНК; количество ДНК между 2c и 4c. Число хромосом — по-прежнему 46.", "s4a_cap_S_z": "Копируются молекулы ДНК, а не «добавляются хромосомы»: на скопированных участках каждая хромосома уже содержит две молекулы.", "s4a_cap_G2": "G2: 4c; 46 хромосом, в каждой две сестринские хроматиды — две одинаковые молекулы ДНК.", "s4a_cap_G2_z": "Удвоилось количество ДНК, а не число хромосом.", "s4a_cap_M": "Митоз до расхождения хроматид: 4c; 46 хромосом из двух сестринских хроматид.", "s4a_cap_M_z": "Разделить можно только то, что уже скопировано.", "s4a_cap_D": "После деления: две клетки, в каждой 2c и 46 хромосом по одной хроматиде.", "s4a_cap_D_z": "Сестринские хроматиды разошлись, и каждая дочерняя клетка получила полный геном.", "s4a_cap_nodiv_villus": "Клетки ворсинки не делятся: ядерной ДНК 2c, ядерный геном не копируется. Новые клетки ворсинки приходят из крипты.", "s4a_cap_nodiv_villus_z": "Обновление ткани обеспечивают делящиеся клетки крипты, а не клетки ворсинки.", "s4a_cap_nodiv_neuron": "Зрелые нейроны не делятся: ядерной ДНК 2c, ядерный геном не копируется. При этом идут транскрипция, синтез белка и репарация ДНК.", "s4a_cap_nodiv_neuron_z": "Отсутствие репликации не означает, что клетка не синтезирует ДНК совсем: при репарации небольшие участки синтезируются заново.", "s4a_cap_pop_blood": "Условный набор делящихся предшественников крови: {b} из 12 клеток копируют ядерную ДНК.", "s4a_cap_pop_blood_z": "Делящихся клеток много — этим поддерживается образование клеток крови.", "s4a_cap_pop_crypt": "Условный набор клеток крипты: {b} из 12 клеток копируют ядерную ДНК.", "s4a_cap_pop_crypt_z": "Деление клеток в криптах обновляет эпителий кишки.", "s4a_cap_pop_villus": "Условный набор клеток ворсинки: все 12 клеток 2c, ни одна не копирует ядерную ДНК.", "s4a_cap_pop_villus_z": "Клетки ворсинки — дифференцированные, неделящиеся; они обновляются за счёт крипты.", "s4a_cap_pop_neuron": "Условный набор зрелых нейронов: все 12 клеток 2c, ни одна не копирует ядерную ДНК.", "s4a_cap_pop_neuron_z": "По одному этому снимку не отличить неделящиеся клетки от делящихся, которые сейчас в G1.", "s4a_cap_mask": "Наблюдение: распределение 12 клеток по количеству ДНК. Тип ткани не указан.", "s4a_cap_mask_z": "Решите, что можно заключить из одного этого распределения, а что нельзя.", "s4a_tl_note": "Время шкалы условное: реальные длительности фаз не показаны.", "s4a_tl_G1": "G1: 46 хромосом, каждая из одной хроматиды; количество ДНК 2c.", "s4a_tl_S": "S: ядерная ДНК копируется; количество ДНК между 2c и 4c, хромосом по-прежнему 46.", "s4a_tl_G2": "G2: копирование завершено; 46 хромосом по две хроматиды, 4c.", "s4a_tl_M": "Митоз: 46 хромосом по две хроматиды; затем сестринские хроматиды расходятся в дочерние клетки.", "s4a_tl_D": "Две клетки: в каждой 46 хромосом и 2c.", "s4a_tl_G0": "G0: клетка вышла из цикла; 2c, ядерный геном не копируется.", "s4a_tl_pop": "Набор клеток в один момент: распределение по количеству ДНК.", "s4a_take": "Репликация ядерной ДНК — событие клеточного цикла: в S-фазе количество ДНК растёт от 2c до 4c, а число хромосом остаётся 46 до расхождения сестринских хроматид. Одним клеткам организма репликация нужна сейчас — делящимся предшественникам крови и клеткам крипт, которые обновляют ткань; другим — нет: клетки ворсинки и зрелые нейроны не делятся. Неделящаяся клетка при этом не «выключена»: в ней идут транскрипция, синтез белка и репарация ДНК. По одному распределению клеток по количеству ДНК нельзя рассчитать скорость обновления ткани и нельзя отличить G0 от G1. Как клетка переходит из фазы в фазу — семинар 6.", "p4a_1_q": "Условия: делящаяся клетка-предшественник крови человека в G1: ядерной ДНК 2c, 46 хромосом. Что будет в G2 того же цикла?", "p4a_1_o1": "4c и 46 хромосом, в каждой две сестринские хроматиды", "p4a_1_o2": "4c и 92 хромосомы: каждая хроматида стала отдельной хромосомой", "p4a_1_o3": "2c: ДНК копируется, но её количество не меняется", "p4a_1_w2": "Копируются молекулы ДНК: каждая хромосома теперь состоит из двух хроматид, но хромосом по-прежнему 46.", "p4a_1_w3": "После S-фазы каждая молекула ДНК представлена дважды — количество ДНК удвоено.", "p4a_1_e": "В S-фазе каждая из 46 молекул ядерной ДНК копируется полуконсервативно. В G2 — 4c и 46 хромосом по две сестринские хроматиды.", "p4a_1_h1": "Что удваивается в S-фазе — молекулы ДНК или хромосомы?", "p4a_2_q": "Студент пишет: «После S-фазы в клетке стало 92 хромосомы». Где ошибка?", "p4a_2_o1": "Удвоились молекулы ДНК (хроматиды), а хромосом по-прежнему 46", "p4a_2_o2": "Ошибки нет: каждая хроматида после S-фазы уже отдельная хромосома", "p4a_2_o3": "Ошибка в другом: после S-фазы количество ДНК остаётся 2c", "p4a_2_w2": "Сестринские хроматиды соединены в одной хромосоме до их расхождения в митозе.", "p4a_2_w3": "После S-фазы — 4c: удвоено количество ДНК.", "p4a_2_e": "По 46 хромосом окажется и в каждой дочерней клетке. Путаются два уровня: молекулы ДНК и хромосомы. В G2 — 46 хромосом, 92 молекулы ДНК (хроматиды), 4c. После деления в каждой клетке 46 хромосом по одной хроматиде, 2c.", "p4a_2_h1": "Сколько центромер у хромосомы из двух сестринских хроматид?", "p4a_3_q": "В условном наборе клеток крипты 3 из 12 клеток копируют ядерную ДНК. Что будет в условном наборе клеток ворсинки той же кишки?", "p4a_3_o1": "Клеток, копирующих ядерную ДНК, не будет: клетки ворсинки не делятся", "p4a_3_o2": "Столько же: эпителий обновляется целиком, значит, делятся все его клетки", "p4a_3_o3": "Больше: клетки ворсинки старше, и им чаще нужно копировать ДНК", "p4a_3_w2": "Эпителий обновляется за счёт деления клеток крипт; клетки ворсинки — дифференцированные и не делятся.", "p4a_3_w3": "Возраст клетки не требует репликации: в норме ядерная ДНК копируется перед делением.", "p4a_3_e": "В одном органе есть делящиеся и неделящиеся клетки. Делящиеся клетки крипт — источник новых клеток, которые затем перемещаются на ворсинку и там уже не делятся.", "p4a_3_h1": "В какой части кишки находятся делящиеся клетки?", "p4a_4_q": "По тому же снимку клеток крипты (3 из 12 в S-фазе) можно ли рассчитать, за сколько дней обновляется эпителий?", "p4a_4_o1": "Нет: снимок показывает доли клеток в один момент, а не время", "p4a_4_o2": "Да: доля клеток в S-фазе равна доле эпителия, обновляемой за сутки", "p4a_4_o3": "Да, если взять для подсчёта не 12, а несколько тысяч клеток", "p4a_4_w2": "Доля клеток в S-фазе зависит и от длительности S-фазы, и от доли делящихся клеток; она не равна доле обновления за сутки.", "p4a_4_w3": "Больше клеток уточнит доли, но не добавит сведений о времени: снимок по-прежнему один.", "p4a_4_e": "Распределение по количеству ДНК — снимок одного момента. Сколько клеток копирует ДНК сейчас, ещё не говорит, как быстро обновляется ткань.", "p4a_4_h1": "Есть ли в снимке одного момента сведения о времени?", "p4a_5_q": "Зрелый нейрон не копирует ядерный геном. Какое утверждение верно?", "p4a_5_o1": "В нейроне идут транскрипция, синтез белка и репарация ДНК", "p4a_5_o2": "Раз репликации нет, ДНК-полимеразы и нуклеотиды нейрону не нужны", "p4a_5_o3": "В нейроне нет ни транскрипции, ни обмена веществ: клетка в G0 неактивна", "p4a_5_w2": "При репарации повреждённый участок удаляется, и ДНК-полимераза достраивает его по второй цепи — для этого нужны и фермент, и dNTP.", "p4a_5_w3": "G0 — состояние вне клеточного цикла, а не отсутствие жизнедеятельности: нейрон постоянно синтезирует РНК и белки.", "p4a_5_e": "Отсутствие репликации всего ядерного генома не означает отсутствия других процессов с ДНК. В нейронах, полученных из стволовых клеток человека и больше не делящихся, новые нуклеотиды встраиваются в ДНК в местах репарации. Как устроена репарация — семинар 8.", "p4a_5_h1": "Какие процессы с ДНК идут в клетке, которая не делится?", "p4a_6_q": "Дано распределение 12 клеток: у всех ядерной ДНК 2c; тип ткани не указан. Что можно заключить?", "p4a_6_o1": "Нет клеток с ДНК между 2c и 4c (S-фаза); G0 от G1 по 2c не отличить", "p4a_6_o2": "Это неделящиеся клетки, все они находятся в состоянии G0", "p4a_6_o3": "Это делящиеся клетки в G1, которые скоро вступят в S-фазу", "p4a_6_w2": "G1 тоже даёт 2c: по одному количеству ДНК неделящуюся клетку не отличить от делящейся в G1.", "p4a_6_w3": "Это возможно, но не следует из распределения: так же выглядят и клетки в G0.", "p4a_6_e": "Распределение позволяет сказать, что сейчас ни у одной клетки нет промежуточного между 2c и 4c количества ДНК, характерного для S-фазы. Но по нему нельзя отличить G0 от G1 и определить, какие клетки вступят в S-фазу и будут делиться позднее: для этого нужны другие признаки или наблюдение во времени. Здесь показан набор зрелых нейронов.", "p4a_6_h1": "Какое количество ДНК в G0 и в G1?", "p4a_6_h2": "Есть ли среди 12 клеток клетки с количеством ДНК между 2c и 4c?", "p4a_6_h3": "Отличается ли по количеству ДНК клетка, вышедшая из цикла, от клетки перед S-фазой?", "amap_t": "Как клетка завершает копирование ДНК", "amap_hit": "здесь действует выбранное нарушение", "amap_lead": "Карта связывает четыре продвинутые модели. Стрелки показывают зависимости, а не последовательность реакций: ресурсы и вилки работают одновременно, точки начала подготавливаются до S-фазы, созревание фрагментов идёт вслед за вилкой.", "amap_f": "Нарушение", "amap_f_none": "нет", "amap_f_dntp": "нет dNTP (модель 1)", "amap_f_reserve": "вилки остановились, резерва нет (модель 2)", "amap_f_mature": "созревание не завершено (модель 3)", "amap_f_g0": "клетка вне цикла (модель 4)", "amap_head": "карта зависимостей · учебная схема", "amap_n_res": "Ресурсы|dNTP", "amap_n_ori": "Точки начала,|подготовленные|до S-фазы", "amap_n_fork": "Работа вилок", "amap_n_mat": "Синтез и созревание|новых цепей", "amap_n_done": "Готовые дочерние|молекулы ДНК", "amap_n_cyc": "Клеточный цикл,|обновление ткани", "amap_out_ok": "Копирование завершено: в норме клетка может переходить к митозу", "amap_out_incomplete": "Копирование не завершено", "amap_out_none": "Копирование не начинается — для неделящейся клетки это норма", "amap_alt_none": "Нарушений нет: dNTP в достатке, вилки движутся, при задержке есть подготовленные точки, фрагменты созревают — дочерние молекулы готовы, в норме клетка может перейти к митозу.", "amap_alt_dntp": "Нет одного dNTP: ферменты исправны, но вилки не могут продолжить синтез там, где нужен этот нуклеотид. Итог: копирование не завершено.", "amap_alt_reserve": "Две встречные вилки остановились и в модели не возобновляются, а подготовленной точки между ними нет или она в этой клетке не запустилась: промежуток скопировать некому. Итог: копирование не завершено.", "amap_alt_mature": "Вилки прошли весь участок, но в новых цепях остались РНК, бреши или разрывы. Итог: дочерние молекулы не готовы.", "amap_alt_g0": "Клетка вне цикла (зрелый нейрон, клетка ворсинки): репликация ядерной ДНК не начинается. Это не нарушение, а состояние клетки.", "amap_note": "Схема условная: она не показывает скорости и вероятности, только зависимости между условиями из четырёх моделей.", "amap_q": "В двух моделях наблюдается незавершённое копирование ДНК. Почему по одному этому наблюдению нельзя сразу назвать единственную причину?", "amap_hint_t": "Подсказка", "qa1": "Продвинутый уровень: хватит ли исправной полимеразы, если в среде мало или нет одного из четырёх dNTP?", "qa2": "Продвинутый уровень: будет ли участок скопирован до конца S-фазы, если вилка остановилась?", "qa3": "Продвинутый уровень: вилка прошла участок — готова ли новая цепь?", "qa4": "Продвинутый уровень: в какой момент клеточного цикла клетка копирует ДНК и почему в обновляющейся ткани не каждая клетка копирует её прямо сейчас?", "amap_h1": "Сравните модели 1 и 2: что в каждой из них показывает, почему копирование не завершилось?", "amap_o1": "Один итог дают разные ограничения; их различает второе наблюдение — место остановки, промежуток или состав цепи", "amap_o2": "Причина всегда одна — неисправный фермент вилки; нехватка dNTP или резерва к такому итогу не приводит", "amap_o3": "Незавершённое копирование всегда означает, что клетка вышла из цикла и больше не будет делиться", "amap_w2": "В моделях 1–3 все ферменты исправны, а копирование всё равно не завершается: ограничением служат субстрат, геометрия вилок и незавершённые операции.", "amap_w3": "Клетка вне цикла не начинает репликацию вовсе — это другое наблюдение, а не незавершённое копирование.", "amap_e": "Незавершённое копирование — общий итог нескольких разных ограничений. Чтобы назвать причину, нужно второе, различающее наблюдение: где остановился синтез и какой нуклеотид там нужен; где остался нескопированный промежуток и были ли рядом подготовленные точки; что осталось в новой цепи — РНК, бреши или разрывы.", "tl_slider": "Ход процесса: положение на шкале этапов", "tl_chips": "Этапы процесса", "tl_step": "Этап {i} из {n}", "svg_aria": "Учебная схема. Детали схемы — кнопки: Enter открывает справку.", "rd_final": "Итог выбранных условий — как на последнем этапе шкалы.", "predict_note": "Условие изменено. Предскажите, что произойдёт, и нажмите «▶ Запустить» или выберите этап на шкале — подпись появится после запуска.", "predict_reads": "Показания появятся после запуска.", "tl_play": "▶ Запустить", "tl_pause": "❚❚ Пауза", "tl_again": "↺ Ещё раз", "tl_note": "Порядок этапов — учебная модель. Длительность этапов и число молекул условные, не измерены.", "k_on": "на месте", "k_empty": "пусто", "k_fixed": "на месте", "k_hint": "Уберите деталь и предскажите, на каком этапе остановится процесс; затем посмотрите анимацию. Нажатие на гнездо вынимает деталь, нажатие на деталь под гнёздами возвращает её на место.", "k_first": "Вынуто несколько деталей: показан исход первой недостающей детали по ходу этапов.", "s1t_note": "Порядок этапов — учебная модель. Этапы 2 и 3 показаны для первого присоединённого нуклеотида, этап 4 — для остальных; длительность этапов условная, не измерена.", "s1t_1": "Затравка спарена с матрицей, у её последнего нуклеотида свободна 3′-OH-группа. ДНК-полимераза удлиняет только спаренный 3′-OH-конец затравки.", "s1t_2": "Напротив следующего основания матрицы встаёт комплементарный dNTP: напротив A — T, напротив G — C.", "s1t_3": "Полимераза присоединяет нуклеотид к 3′-OH, образуя фосфодиэфирную связь; отщепляется пирофосфат.", "s1t_4": "Цепь растёт в направлении 5′→3′, пока не кончится матрица.", "s1t_4_dda": "Цепь растёт 5′→3′ до первого T матрицы за затравкой: напротив него полимераза присоединяет аналог без 3′-OH.", "s1t_4_nog": "Цепь растёт 5′→3′ до первого C матрицы за затравкой: напротив него нужен G.", "s1t_1_par": "Затравка уложена параллельно матрице: её 3′-конец не спарен с матрицей.", "s1t_1_notpl": "Матрицы нет: затравке не с чем спариться.", "s1t_1_nopr": "Затравки нет: на матрице нет спаренного 3′-OH-конца.", "s1t_stop_dda": "Синтез оборвался: полимераза присоединила аналог напротив T матрицы, а к аналогу следующий нуклеотид присоединить нельзя — у него нет 3′-OH.", "s1t_stop_nog": "Синтез остановился на этапе 2 очередного цикла: напротив C матрицы нужен dGTP, а его в среде нет. В модели полимераза присоединяет только комплементарный нуклеотид.", "s1t_stop_par": "Синтез не начался: 3′-конец затравки не спарен с матрицей, удлинять нечего.", "s1t_stop_notpl": "Синтез не начался: без матрицы нет ни спаренной затравки, ни основания, которое задаёт следующий нуклеотид.", "s1t_stop_nopr": "Синтез не начался: ДНК-полимераза присоединяет нуклеотиды только к спаренному 3′-OH-концу, а затравки нет.", "s1t_stop_nopol": "Синтез не начался: затравка спарена, нуклеотиды есть, но без ДНК-полимеразы они не присоединяются.", "s1t_lbl_ppi": "пирофосфат", "s1k_title": "Детали реакции", "s1k_tpl": "Матрица", "s1k_pr": "Затравка", "s1k_pol": "ДНК-полимераза", "s1_lbl_notpl": "матрицы нет", "s1_lbl_notpl_pr": "матрицы нет: затравке не с чем спариться", "s1_lbl_nopr": "затравки нет: полимеразе нечего удлинять", "s1_lbl_nopol": "ДНК-полимеразы нет: нуклеотиды не присоединяются", "s1_cap_notpl": "Матрицы нет. Затравке не с чем спариться, и нет основания, которое задало бы следующий нуклеотид: синтез не начинается.", "s1_cap_notpl_z": "Последовательность новой цепи задаёт матрица; без матрицы копировать нечего.", "s1_cap_nopr": "Затравки нет. ДНК-полимераза удлиняет только спаренный 3′-OH-конец и не начинает цепь сама, поэтому синтез не начинается.", "s1_cap_nopr_z": "Поэтому синтез новой цепи ДНК начинается с короткой затравки: к её 3′-OH-концу полимераза присоединяет первый нуклеотид.", "s1_cap_nopol": "Затравка спарена с матрицей, нуклеотиды в среде есть, но ДНК-полимеразы нет: фосфодиэфирные связи не образуются, цепь не удлиняется.", "s1_cap_nopol_z": "Комплементарность определяет, какой нуклеотид подходит; присоединяет его фермент — ДНК-полимераза.", "s2t_note": "Порядок этапов — учебная модель; этапы 1–2 показывают движение вилок до выбранного хода. Длины и время условные.", "s2t_0": "Точки начала ещё не активированы: пузырьков нет.", "s2t_1": "В точке начала активируются две хеликазы, загруженные ещё до S-фазы, и расплетают ДНК в обе стороны — образуется пузырёк репликации.", "s2t_1_one": "В точке начала ДНК расплетается — образуется пузырёк репликации; в мысленном эксперименте расплетание идёт только в одну сторону.", "s2t_2": "Две вилки расходятся в противоположные стороны, копируя обе цепи.", "s2t_2_one": "Мысленный эксперимент: вилка идёт только в одну сторону; другая сторона от точки начала не копируется.", "s2t_3": "Каждая цепь служит матрицей: дочерние молекулы содержат по одной старой и одной новой цепи.", "s2t_4": "Вилки соседних репликонов встречаются, новые цепи соединяются; участок скопирован один раз.", "s2_ori_own": "расставить самому", "s2_pos": "Места точек начала (нажмите, чтобы поставить или убрать точку)", "s2_pos_n": "{i}", "s2_r_full": "Время полного копирования участка", "s2_r_full_s": "расчёт модели, в условных шагах: вилка проходит 90 условных единиц за шаг", "s2_v_full": "{n}", "s2_v_full_inf": "участок не скопируется полностью", "s2_cap_own": "Точек начала: {k}, от каждой — две вилки. Скопировано {n} % участка; полное копирование в этой модели занимает {s} (в условных шагах).", "s2_cap_own_z": "Время копирования задаёт самый длинный путь одной вилки: чем больше точек начала и чем ровнее они расставлены, тем быстрее скопирован весь участок (в модели скорость вилок одинакова).", "s2_cap_own1": "Мысленный эксперимент: по одной вилке от каждой точки начала. Скопировано {n} %; участок левее первой точки начала не копируется.", "s2_cap_own1_z": "Одна вилка копирует ДНК только в одну сторону от точки начала, поэтому участок левее первой точки начала остаётся нескопированным; две вилки копируют ДНК по обе стороны от точки начала.", "s2_v_full_more": "{n} — больше трёх ходов переключателя «Время»", "s3t_note": "Порядок этапов — учебная модель; этапы идут до выбранного состояния отстающей цепи. Этапы 2–3 показаны для самого нового фрагмента; длины и число фрагментов условные.", "s3t_1": "Хеликаза расплетает ДНК, вилка движется; на одной матрице рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно.", "s3t_2": "На другой матрице праймаза у вилки синтезирует РНК-затравку; у эукариот около 10 нуклеотидов через каждые 100–200 нуклеотидов.", "s3t_3": "Полимераза δ с зажимом удлиняет фрагмент от вилки к предыдущему фрагменту; закончив фрагмент, освобождается.", "s3t_4": "Нуклеазы удаляют затравку, полимераза заполняет брешь.", "s3t_4_rem": "Нуклеазы удаляют РНК-затравку; на её месте остаётся брешь.", "s3t_5": "ДНК-лигаза сшивает разрыв: 3′-OH одного фрагмента с 5′-фосфатом соседнего, у эукариот — с затратой АТФ.", "s4t_note": "Порядок этапов — учебная модель; длины и число фрагментов условные. Хеликаза, топоизомераза, праймаза и лигаза в модели есть всегда.", "s4t_1": "Хеликаза расплетает ДНК, топоизомераза впереди вилки снимает напряжение.", "s4t_2": "Белки, связывающие одноцепочечную ДНК (SSB), кооперативно покрывают и выпрямляют одноцепочечную матрицу.", "s4t_2_ssb": "Белков, связывающих одноцепочечную ДНК (SSB), нет: на одноцепочечной матрице отстающей цепи образуются шпильки.", "s4t_3": "Праймаза синтезирует затравку; погрузчик надевает зажим с затратой АТФ; полимераза удлиняет фрагмент.", "s4t_3_rfc": "Праймаза синтезирует затравку, но погрузчика зажима нет: зажим не надет на ДНК.", "s4t_4": "Нуклеазы удаляют затравку, полимераза заполняет брешь, лигаза сшивает разрыв.", "s4t_4_nuc": "Нуклеаз нет: фрагменты доходят до РНК-затравки предыдущего, затравки не удалены.", "s4t_stop_ssb": "Модель остановилась на этапе 2: шпильки на матрице отстающей цепи мешают полимеразе, и новый фрагмент не синтезируется. В модели SSB убраны у уже работающей вилки: фрагменты, синтезированные раньше, созрели и сшиты.", "s4t_stop_rfc": "Модель остановилась на этапе 3: без зажима полимераза синтезирует короткий отрезок и отходит — на отстающей цепи короткие отрезки с брешами, ведущая цепь отстаёт от вилки.", "s4t_stop_nuc": "Модель остановилась на этапе 4: затравки не удалены — фрагменты полной длины с РНК на 5′-концах не сшиты.", "s4k_title": "Белки вилки", "s4k_hint": "Уберите один белок и предскажите, на каком этапе остановится вилка и какой продукт останется; затем посмотрите анимацию. Нажмите на гнездо SSB, погрузчика зажима или нуклеаз, чтобы убрать белок; нажмите на белок под гнёздами, чтобы вернуть его. Хеликаза, топоизомераза, праймаза и лигаза в этой модели стоят всегда.", "s4k_hel": "Хеликаза", "s4k_topo": "Топоизомераза", "s4k_ssb": "SSB", "s4k_prim": "Праймаза", "s4k_rfc": "Погрузчик зажима", "s4k_nuc": "Нуклеазы удаления затравок", "s4k_lig": "ДНК-лигаза", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Метод", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а получено «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Какое измерение их разделит?", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Какое измерение их разделит?", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Чтобы из предложенных объяснений осталось одно, достаточно, например, измерений: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Новый образец", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента. Список причин здесь задан заранее, в реальной работе его нет.", "c1_title": "Синтез остановился раньше конца матрицы", "c1_obs": "Условия: реакция in vitro — матрица (цепь 1, 12 нуклеотидов), затравка из 3 нуклеотидов, ДНК-полимераза и нуклеотиды. Наблюдение: в контроле новая цепь достроена до конца матрицы, в образце она короче. Причина одна из трёх; какая — определите по измерениям.", "c1_c_nog": "В смеси нет dGTP", "c1_c_dda": "В смеси вместо dATP аналог без 3′-OH", "c1_c_par": "Затравка уложена параллельно матрице", "c1_m_next": "Какое основание матрицы стоит следующим за 3′-концом продукта", "c1_m_oh": "Есть ли 3′-OH-группа у нуклеотида на 3′-конце продукта", "c1_m_pair": "Спарен ли 3′-конец затравки с матрицей", "c1_v_next_end": "матрица кончилась", "c1_v_next_C": "C", "c1_v_next_G": "G", "c1_v_next_na": "не определяется: продукт не спарен с матрицей", "c1_v_oh_yes": "есть", "c1_v_oh_no": "нет", "c1_v_pair_yes": "спарен", "c1_v_pair_no": "не спарен", "c1_k_next": "Что измеряется: длина продукта — электрофорезом в денатурирующем геле, как в методе обрыва цепей; по известной последовательности матрицы находят основание, следующее за 3′-концом продукта. Уровень: смесь молекул в пробирке. Контроль: реакция с полным набором dNTP. Типичный артефакт: продукты разной длины дают несколько полос, и нужно выбрать основную. Чего не доказывает: почему синтез остановился; показывает только, где.", "c1_k_oh": "Что измеряется: строение нуклеотида на 3′-конце продукта — есть ли у него 3′-OH-группа. Метод в учебной модели не задан: значение — предсказание модели. Уровень: смесь молекул в пробирке. Контроль: продукт контрольной реакции. Чего не доказывает: почему нуклеотид без 3′-OH оказался в цепи.", "c1_k_pair": "Что измеряется: как уложена затравка относительно матрицы — по последовательностям затравки и матрицы сравнивают направление 5′→3′ двух цепей. Уровень: последовательность молекул. Контроль: затравка контрольной реакции. Типичный артефакт: перепутанные 5′- и 3′-концы при записи последовательности. Чего не доказывает: что в смеси нет других нарушений.", "c1_w_nog": "Затравка спарена, 3′-OH у продукта есть, а следующее основание матрицы — C: напротив него должен встать G. Значит, в смеси нет dGTP; в модели полимераза присоединяет только комплементарный нуклеотид.", "c1_w_dda": "Затравка спарена, но у последнего нуклеотида продукта нет 3′-OH: в цепь встроен аналог, и к нему следующий нуклеотид не присоединяется.", "c1_w_par": "3′-конец затравки не спарен с матрицей: затравка уложена параллельно. ДНК-полимераза удлиняет только спаренный 3′-OH-конец, поэтому синтез не начался.", "c1_src": "Правила модели — по учебнику (см. «Источники» внизу страницы), с. 256–259 и 513. Значения таблицы выведены из модели.", "c1_link_h": "seminar-7-route.html#polymerase-rule", "c1_link_t": "Подробнее: шаг «Что нужно ДНК-полимеразе: матрица, затравка с 3′-OH и нуклеотиды» в «Объяснениях»", "c2_title": "Отстающая цепь не достроена", "c2_obs": "Условия: модельная реплисома у одной вилки (учебная модель). Наблюдение: в контроле отстающая цепь за вилкой непрерывна, а у вилки начат новый фрагмент; в образце синтез или созревание отстающей цепи нарушены. Причина одна из четырёх; какая — определите по измерениям.", "c2_c_rfc": "Нет погрузчика зажима", "c2_c_nuc": "Нет нуклеаз удаления затравок", "c2_c_lig": "Нет ДНК-лигазы", "c2_c_ssb": "Нет белков, связывающих одноцепочечную ДНК (SSB)", "c2_m_len": "Длина фрагментов отстающей цепи", "c2_m_rna": "РНК на 5′-концах фрагментов", "c2_m_join": "Что между соседними фрагментами", "c2_m_tmpl": "Одноцепочечная матрица у вилки", "c2_m_new": "Начат ли у вилки новый фрагмент", "c2_v_len_full": "полной длины", "c2_v_len_short": "короткие", "c2_v_rna_yes": "есть", "c2_v_rna_no": "нет", "c2_v_join_none": "фрагменты сшиты", "c2_v_join_gaps": "бреши", "c2_v_join_rna": "фрагмент упирается в РНК-затравку соседнего, не сшит", "c2_v_join_nicks": "разрывы: все нуклеотиды на месте, не хватает одной связи", "c2_v_tmpl_ssb": "прямая, покрыта SSB", "c2_v_tmpl_hairpin": "шпильки", "c2_v_new_yes": "начат", "c2_v_new_no": "не начат", "c2_k_len": "Что измеряется: длина новых цепей отстающей матрицы — электрофорезом в денатурирующем геле. Уровень: смесь молекул. Контроль: полная реакция. Типичный артефакт: сшитая отстающая цепь и длинные фрагменты дают близкие полосы, если гель не разделяет крупные молекулы. Чего не доказывает: почему фрагменты такой длины.", "c2_k_rna": "Что измеряется: есть ли РНК на 5′-концах фрагментов — по действию нуклеазы, которая расщепляет РНК в гибриде РНК–ДНК (такие нуклеазы удаляют затравки): фрагменты с РНК после обработки укорачиваются. Уровень: смесь молекул. Контроль: полная реакция. Типичный артефакт: неполное расщепление занижает долю фрагментов с РНК. Чего не доказывает: какой белок должен был удалить РНК.", "c2_k_join": "Что измеряется: что разделяет соседние фрагменты — брешь (недостаёт нуклеотидов), разрыв (недостаёт одной связи) или РНК-затравка; например, по тому, заполняет ли брешь добавленная полимераза и сшивает ли разрыв добавленная лигаза. Уровень: смесь молекул. Контроль: полная реакция. Типичный артефакт: неполная реакция с добавленным ферментом занижает долю сшитых молекул. Чего не доказывает: почему соединения нет.", "c2_k_tmpl": "Что измеряется: форма одноцепочечной матрицы у вилки — прямая, покрытая SSB, или со шпильками. Метод в учебной модели не задан: значение — предсказание модели. Уровень: отдельные молекулы. Контроль: полная реакция. Чего не доказывает: почему не начат новый фрагмент.", "c2_k_new": "Что измеряется: есть ли у вилки новый, только что начатый фрагмент с затравкой. Метод в учебной модели не задан: значение — предсказание модели. Уровень: отдельные молекулы. Контроль: полная реакция. Чего не доказывает: почему фрагмент не начат.", "c2_w_rfc": "Фрагменты короткие, между ними бреши, а матрица у вилки прямая под SSB. Без погрузчика зажим не надет: полимераза синтезирует короткий отрезок и отходит.", "c2_w_nuc": "Фрагменты полной длины, но на их 5′-концах осталась РНК, и каждый упирается в затравку соседнего. Затравки не удалены: нет нуклеаз, поэтому фрагменты не сшиты.", "c2_w_ssb": "У вилки новый фрагмент не начат, а на матрице шпильки; уже синтезированные фрагменты в порядке. Без белков, связывающих одноцепочечную ДНК (SSB), матрица не выпрямлена, и шпильки мешают полимеразе.", "c2_after": "Объяснение «нет ДНК-лигазы» предсказывает фрагменты полной длины без РНК с разрывами между ними; в этих образцах такого продукта нет.", "c2_src": "Правила модели — по учебнику (см. «Источники» внизу страницы), с. 260–263. Значения таблицы выведены из модели.", "c2_link_h": "seminar-7-route.html#missing-component", "c2_link_t": "Подробнее: шаг «По промежуточному продукту определить, какого белка нет» в «Объяснениях»", "gn_template": "Матрица", "g_template": "Цепь ДНК, по которой строится новая цепь: напротив каждого её основания встаёт комплементарный нуклеотид. При репликации матрицей служит каждая из двух родительских цепей.", "gn_newstrand": "Новая (дочерняя) цепь ДНК", "g_newstrand": "Цепь, которую ДНК-полимераза строит по матрице в направлении 5′→3′; она комплементарна и антипараллельна матрице.", "gn_primer": "Затравка (праймер)", "g_primer": "Короткий участок нуклеиновой кислоты, спаренный с матрицей, со свободным 3′-OH, к которому ДНК-полимераза присоединяет первый нуклеотид. При репликации затравки — короткие молекулы РНК, их синтезирует праймаза.", "gn_analog": "Аналог нуклеотида без 3′-OH", "g_analog": "Нуклеотид, у которого в сахаре нет 3′-гидроксильной группы (например, дидезоксинуклеотид). Он встаёт напротив комплементарного основания, но следующий нуклеотид присоединить нельзя, и цепь обрывается.", "gn_dntp": "Дезоксирибонуклеозидтрифосфаты (dNTP)", "g_dntp": "dATP, dTTP, dGTP и dCTP — субстраты ДНК-полимеразы. При присоединении нуклеотида к цепи отщепляется пирофосфат, и в цепи остаётся один фосфат.", "gn_hbond": "Водородные связи пар оснований", "g_hbond": "Связи между основаниями двух цепей: в паре A–T две, в паре G–C три. Они определяют, какие основания образуют пару (комплементарность).", "gn_polymerase": "ДНК-полимераза", "g_polymerase": "Фермент, который присоединяет дезоксирибонуклеотиды к 3′-OH растущей цепи по матрице; синтезирует цепь только в направлении 5′→3′ и не начинает её без затравки.", "gn_gel": "Электрофорез в полиакриламидном геле", "g_gel": "Разделение молекул ДНК по длине в электрическом поле: короткие молекулы движутся быстрее; в тонком геле различаются молекулы, отличающиеся на один нуклеотид.", "gn_band": "Полоса в геле", "g_band": "Место, где собрались молекулы ДНК одной длины.", "gn_daughter": "Дочерняя молекула ДНК", "g_daughter": "Двойная спираль, образовавшаяся при репликации; при полуконсервативном копировании в ней одна родительская и одна новая цепь.", "gn_replisome": "Реплисома", "g_replisome": "Комплекс белков, работающий в репликационной вилке: хеликаза, ДНК-полимеразы, праймаза, зажим и его погрузчик, белки, связывающие одноцепочечную ДНК, и другие белки, которые к ним присоединяются.", "gn_rpa": "RPA (репликационный белок A)", "g_rpa": "Белок, связывающий одноцепочечную ДНК у эукариот (эукариотический аналог SSB).", "gn_duplex": "Двойная спираль (дуплекс)", "g_duplex": "Две антипараллельные комплементарные цепи ДНК, закрученные вокруг общей оси; основания внутри, сахаро-фосфатный остов снаружи.", "gn_origin": "Точка начала репликации (ориджин)", "g_origin": "Участок ДНК, где начинается репликация: здесь собираются белки инициации и образуются две репликационные вилки. У эукариот точки начала узнаёт комплекс ORC.", "gn_bubble": "Пузырёк репликации", "g_bubble": "Участок между двумя вилками, расходящимися от одной точки начала: внутри него ДНК уже скопирована, снаружи — родительская двойная спираль.", "gn_fork": "Репликационная вилка", "g_fork": "Y-образная область, где родительская двойная спираль расплетается и обе цепи копируются; движется вдоль ДНК вместе с комплексом белков — реплисомой.", "gn_replicon": "Репликон", "g_replicon": "Участок ДНК, который копируется от одной точки начала репликации.", "gn_helicase": "ДНК-хеликаза", "g_helicase": "Фермент, который движется по ДНК и разделяет цепи двойной спирали за счёт гидролиза АТФ. У эукариот репликативная хеликаза — комплекс CMG (Cdc45–MCM–GINS).", "gn_ssb": "Белки, связывающие одноцепочечную ДНК (SSB; у эукариот RPA)", "g_ssb": "Белки, которые кооперативно связываются с одноцепочечной ДНК, выпрямляют её и не дают образовываться шпилькам и восстанавливаться двойной спирали.", "gn_primase": "Праймаза", "g_primase": "РНК-полимераза, которая синтезирует короткие РНК-затравки на матрице и начинает синтез без готовой затравки (ей не нужен готовый 3′-конец). У эукариот работает в комплексе с ДНК-полимеразой α, которая удлиняет затравку короткой ДНК.", "gn_pcna": "Скользящий зажим (PCNA)", "g_pcna": "PCNA — ядерный антиген пролиферирующих клеток. Белковое кольцо, охватывающее ДНК и удерживающее полимеразу на матрице при движении; освобождает полимеразу, когда та заканчивает фрагмент и доходит до предыдущего.", "gn_rfc": "Погрузчик зажима (RFC)", "g_rfc": "RFC — репликационный фактор C. Белковый комплекс, который размыкает кольцо зажима и надевает его на ДНК у конца затравки, гидролизуя АТФ.", "gn_fen1": "Нуклеазы удаления затравки", "g_fen1": "Ферменты, которые удаляют РНК-затравки фрагментов Оказаки. У бактерий затравку удаляют нуклеазы, узнающие РНК в гибриде РНК–ДНК; у эукариот полимераза δ, достраивая следующий фрагмент, отгибает затравку в одноцепочечный лоскут, и его срезает флэп-эндонуклеаза FEN1.", "gn_ligase": "ДНК-лигаза", "g_ligase": "Фермент, который соединяет 3′-OH одного фрагмента с 5′-фосфатом соседнего фосфодиэфирной связью; у эукариот использует энергию АТФ.", "gn_topo": "ДНК-топоизомераза", "g_topo": "Фермент, который снимает напряжение витков двойной спирали впереди вилки, временно разрывая и снова соединяя одну (тип I) или обе (тип II) цепи.", "gn_nick": "Разрыв цепи", "g_nick": "Отсутствие одной фосфодиэфирной связи между соседними нуклеотидами одной цепи; все нуклеотиды на месте. Разрыв сшивает ДНК-лигаза.", "gn_okazaki": "Фрагмент Оказаки", "g_okazaki": "Короткий отрезок новой ДНК отстающей цепи с РНК-затравкой на 5′-конце; у эукариот 100–200 нуклеотидов, у бактерий 1000–2000.", "gn_leading": "Ведущая цепь", "g_leading": "Новая цепь, которая растёт в направлении движения вилки и синтезируется непрерывно.", "gn_lagging": "Отстающая цепь", "g_lagging": "Новая цепь, которая растёт против направления движения вилки и синтезируется короткими фрагментами Оказаки.", "gn_polalpha": "ДНК-полимераза α", "g_polalpha": "Полимераза, связанная с праймазой: удлиняет РНК-затравку коротким участком ДНК (около 20 нуклеотидов); корректирующей активности у неё нет.", "gn_poldelta": "ДНК-полимераза δ", "g_poldelta": "Основная полимераза отстающей цепи у эукариот: удлиняет затравки вместе с зажимом PCNA и при подходе к предыдущему фрагменту вытесняет его 5′-конец.", "gn_polepsilon": "ДНК-полимераза ε", "g_polepsilon": "Основная полимераза ведущей цепи у эукариот, связанная с хеликазой CMG.", "gn_hairpin": "Шпилька", "g_hairpin": "Участок одноцепочечной ДНК, сложившийся сам на себя за счёт коротких комплементарных отрезков; мешает полимеразе.", "gn_ppi": "Пирофосфат", "g_ppi": "Два связанных остатка фосфата, которые отщепляются от dNTP, когда ДНК-полимераза присоединяет нуклеотид к 3′-OH растущей цепи и образует фосфодиэфирную связь.", "gn_pool": "Запас dNTP", "g_pool": "Свободные dATP, dTTP, dGTP и dCTP в клетке, из которых ДНК-полимераза строит новую цепь. Для синтеза нужен каждый из четырёх: недостающий нуклеотид другим не заменяется без ошибки. Нехватка dNTP замедляет движение репликационных вилок.", "gn_dormant": "Резервная точка начала репликации", "g_dormant": "Точка начала, подготовленная к запуску до S-фазы, которая в данной клетке в начале S-фазы не запустилась. Если её скопирует проходящая вилка, в этой S-фазе она уже не запустится. Если соседняя вилка задержалась, а точка ещё не скопирована, она может запуститься и дать две новые вилки, но не обязательно. Резервной точка бывает не навсегда: какие из подготовленных точек запустятся, во многом случайно, и в другой клетке та же точка может работать. В S-фазе новые точки начала не подготавливаются.", "gn_stalled": "Остановленная репликационная вилка", "g_stalled": "Вилка, которая перестала продвигаться — например, при нехватке dNTP или встрече с препятствием на матрице. Нескопированный участок за ней может закрыть встречная вилка или вилки резервной точки начала.", "gn_gapreg": "Нескопированный участок", "g_gapreg": "Участок ДНК, до которого к концу S-фазы не дошла ни одна вилка; молекула ДНК на нём не удвоена.", "gn_gap": "Брешь в новой цепи", "g_gap": "Промежуток в новой цепи, где нет нуклеотидов, — например, после удаления РНК-затравки. Брешь заполняет ДНК-полимераза; лигаза соединяет только соседние нуклеотиды, между которыми промежутка нет.", "gn_cellcycle": "Клеточный цикл", "g_cellcycle": "Последовательность событий от одного деления клетки до следующего: G1 (рост), S (репликация ядерной ДНК), G2 (подготовка к делению), M (митоз).", "gn_g0": "Состояние G0", "g_g0": "Состояние клетки вне клеточного цикла: клетка не готовится к делению, ядерная ДНК не копируется (2c). Многие клетки могут вернуться из G0 в цикл; зрелые нейроны и клетки ворсинки кишки не делятся.", "gn_chromatid": "Хроматида", "g_chromatid": "Одна двухцепочечная молекула ДНК хромосомы вместе с белками. После S-фазы хромосома состоит из двух сестринских хроматид — двух одинаковых молекул ДНК, полученных при репликации.", "gn_centromere": "Центромера", "g_centromere": "Участок хромосомы, где соединены сестринские хроматиды и где в митозе прикрепляются нити веретена деления.", "gn_nucleus": "Ядро", "g_nucleus": "Органелла, в которой находятся 46 хромосом клетки человека; здесь идут репликация ядерной ДНК и транскрипция.", "gn_dnacontent": "Количество ядерной ДНК (c)", "g_dnacontent": "c — количество ДНК гаплоидного набора хромосом. В диплоидной соматической клетке человека в G1 и G0 — 2c, после S-фазы (G2, митоз до расхождения хроматид) — 4c, в S-фазе — между 2c и 4c.", "gn_cell": "Клетка набора", "g_cell": "Одна клетка условного набора; цвет ядра обозначает количество ядерной ДНК: 2c, между 2c и 4c или 4c.", "gn_dnahist": "Распределение клеток по количеству ДНК", "g_dnahist": "Число клеток набора с 2c, с промежуточным количеством и с 4c в один момент. По нему видно, сколько клеток сейчас в S-фазе и в G2 или митозе, но нельзя отличить G0 от G1 и нельзя рассчитать скорость обновления ткани.", "src_01": "Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»", "src_02": "Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314. doi:10.1016/j.molcel.2022.05.004", "src_03": "Blow J. J., Ge X. Q., Jackson D. A. How dormant origins promote complete genome replication. Trends Biochem Sci. 2011;36:405–414. doi:10.1016/j.tibs.2011.05.002", "src_04": "Alver R. C., Chadha G. S., Blow J. J. The contribution of dormant origins to genome stability: from cell biology to human genetics. DNA Repair (Amst). 2014;19:182–189. doi:10.1016/j.dnarep.2014.03.012", "src_05": "Reid D. A., Reed P. J., Schlachetzki J. C. M., Nitulescu I. I., Chou G., Tsui E. C., Jones J. R., Chandran S., Lu A. T., McClain C. A., Ooi J. H., Wang T.-W., Lana A. J., Linker S. B., Ricciardulli A. S., Lau S., Schafer S. T., Horvath S., Dixon J. R., Hah N., Glass C. K., Gage F. H. Incorporation of a nucleoside analog maps genome repair sites in postmitotic human neurons. Science. 2021;372:91–94. doi:10.1126/science.abb9032", "src_06": "Carrington J. T., Wilson R. H. C., de La Vega E., Thiyagarajan S., Barker T., Catchpole L., Durrant A., Knitlhoffer V., Watkins C., Gharbi K., Nieduszynski C. A. Most human DNA replication initiation is dispersed throughout the genome with only a minority within previously identified initiation zones. Genome Biol. 2025;26:122. doi:10.1186/s13059-025-03591-w"};
function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');

function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}

</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }

function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }

function XX(id, x1, y1, x2, y2){ return `<g class="cross fade" id="${id}" opacity="0"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x2}" y1="${y1}" x2="${x1}" y2="${y2}"/></g>`; }

function blotHTML(rows, lanes){
  if (!lanes.length) return `<p class="small">${t('blot_empty')}</p>`;
  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;
  h += `<div class="lanes">` + lanes.map(L => `<div class="head">${L.h1}<br>${L.h2 || '&nbsp;'}</div>`).join('') + `</div>`;
  h += `<div class="film"><div class="lanes">` + lanes.map(L => `<div>` + L.v.map(v => `<div class="cell"><div class="band" style="opacity:${(0.04 + 0.96 * clamp(v)).toFixed(2)}"></div></div>`).join('') + `</div>`).join('') + `</div></div>`;
  return h + `</div></div></div>`;
}

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

const SCENES = {};
/* Перерисовка схемы заменяет все узлы SVG. Фокус, стоявший на детали или на кнопке «Метод», возвращается на новый узел
   с тем же data-g, чтобы клавиатура не терялась во время воспроизведения (технический аудит v1.6, ТА-05). */
function keepFocus(svg){
  const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(svg, 'innerHTML', { configurable: true, get(){ return d.get.call(this); }, set(v){
    const a = document.activeElement, g = a && a !== svg && svg.contains(a) ? a.getAttribute('data-g') : null;
    d.set.call(this, v);
    if (g){ const n = svg.querySelector('[data-g="' + g + '"]'); if (n){ if (!n.hasAttribute('tabindex')) n.setAttribute('tabindex', '0'); try { n.focus({ preventScroll: true }); } catch (e) {} } }
  } });
}

    const h = a.getAttribute('href'), i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);

    if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';
    a.setAttribute('href', b + hash);
  }
  revLevelLinks();
  revTakeSoon(); revLater();
}
/* уровень сложности передаётся в ссылки на соседние семинары и в общий вход «Объяснения» (аудит 06.11.2026, NAV-LEVEL) */
function revWithLevel(h){
  const i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);
  let b = (i < 0 ? h : h.slice(0, i)).replace(/([?&])level=adv(?=&|$)/, '$1').replace(/\?&/, '?').replace(/[?&]+$/, '');
  if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';

function revLevelLinks(){

/* справки молекул с клавиатуры: фокус, роль кнопки, доступное имя, Enter/Space (в семинарах, где этого не было);
   невидимые на схеме элементы (неприменённый препарат и т. п.) исключаются из порядка Tab */
function revVisible(e, stop){ for (let x = e; x && x !== stop; x = x.parentElement){ const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return false; } return true; }
function revA11y(){
  const sc = document.querySelector('#scenes .scene:not([hidden])'); if (!sc) return;
  const seen = new Set();   /* с клавиатуры — одна кнопка на каждую структуру, мышью и пальцем — любая деталь */
  sc.querySelectorAll('[data-g]').forEach(e => {
    if (!e.dataset.g) return;
    if (!e.hasAttribute('aria-label')){ const n = TEXTS['gn_' + e.dataset.g] || (e.textContent || '').trim(); if (n) e.setAttribute('aria-label', n); }
    if (e.hasAttribute('tabindex') && !e.dataset.rev) return;   /* фокус задан разметкой страницы — не трогаем */
    if (!e.dataset.rev){ e.dataset.rev = '1'; if (!e.hasAttribute('role')) e.setAttribute('role', 'button'); }
    const vis = revVisible(e, sc) && !seen.has(e.dataset.g), ti = vis ? '0' : '-1'; if (vis) seen.add(e.dataset.g);
    if (e.getAttribute('tabindex') !== ti) e.setAttribute('tabindex', ti);
    if (vis) e.removeAttribute('aria-hidden'); else e.setAttribute('aria-hidden', 'true');
  });
}
let revA11yT = 0;
function revLater(){ if (!revA11yT) revA11yT = setTimeout(() => { revA11yT = 0; revA11y(); revTake(); }, 250); }
/* «↓ К выводу»: на компьютере правая колонка прокручивается отдельно; кнопка видна, пока вывод ниже видимой части */
let revTakeT = 0;
function revTakeSoon(){ if (revTakeT) return; revTakeT = requestAnimationFrame(() => { revTakeT = 0; revTake(); }); }
function revTake(){
  const desk = !window.matchMedia || matchMedia('(min-width:1001px)').matches;
  document.querySelectorAll('#scenes .scene:not([hidden]) .side').forEach(sd => {
    const b = sd.querySelector('.totake'), tk = sd.querySelector('.take'); if (!b || !tk) return;
    const on = desk && !tk.hidden && sd.scrollHeight > sd.clientHeight + 8
      && tk.getBoundingClientRect().top > sd.getBoundingClientRect().bottom - 2;   /* кнопка не ложится на начало вывода (рецензия v1.0, R37) */
    if (b.hidden === on) b.hidden = !on;
  });
}
function revInit(){
  /* кнопка «К выводу» в каждой правой колонке */
  document.querySelectorAll('#scenes .side').forEach(sd => {
    const tk = sd.querySelector('.take'); if (!tk || sd.querySelector('.totake')) return;
    tk.setAttribute('tabindex', '-1');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost totake'; b.hidden = true; b.textContent = t('to_take');
    b.onclick = () => { sd.scrollTo({ top: sd.scrollTop + tk.getBoundingClientRect().top - sd.getBoundingClientRect().top - 8, behavior: 'smooth' }); tk.focus({ preventScroll: true }); };
    sd.appendChild(b);
    sd.addEventListener('scroll', revTakeSoon, { passive: true });
  });
  window.addEventListener('resize', revTakeSoon);
  /* подсказка над увеличенной схемой; на телефоне схема по умолчанию увеличена — подписи читаются без ручного увеличения */
  document.querySelectorAll('#scenes .stage').forEach(st => {

  /* клавиатура: Enter/Space на молекуле открывает справку (если у страницы нет собственного обработчика) */

  $('scenes').addEventListener('keydown', e => {

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    if (TEXTS.sn_sec_href && !TEXTS.sn_next_n) h += `<a class="sn-sec" href="${abs}${TEXTS.sn_sec_href}"><span class="sn-k">${esc(TEXTS.sn_sec_k)}</span><span class="sn-t">${esc(TEXTS.sn_sec_t)}</span></a>`;
