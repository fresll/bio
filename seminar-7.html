  /* конструктор (паспорт, 1.5): матрица, затравка, ДНК-полимераза; набор dNTP и ориентация затравки — переключатели.
     Цикл останавливается на первой недостающей детали: матрица → затравка (её ориентация) → полимераза. */
  const parts = { tpl: true, pr: true, pol: true };
  const kit = kitMake(K, { parts, title: 's1k_title', hint: 'k_hint', changed: () => { hold = true; SCENES[K].update(); },
    slots: [{ id: 'tpl', k: 's1k_tpl' }, { id: 'pr', k: 's1k_pr' }, { id: 'pol', k: 's1k_pol' }] });
  window.PARTS1B = parts;
  $('ctrl' + K).innerHTML =
    segHTML('s1b_mat', 's1_mat', [['1', 's1_mat_1'], ['2', 's1_mat_2']], '1') +
    segHTML('s1b_nuc', 's1_nuc', [['all', 's1_nuc_all'], ['dda', 's1_nuc_dda'], ['nog', 's1_nuc_nog']], 'all') +
    segHTML('s1b_ori', 's1_ori', [['anti', 's1_ori_anti'], ['par', 's1_ori_par']], 'anti') + `<div id="kit${K}"></div>`;
  $('take' + K).textContent = t('s1b_take');

  /* исход: v1.1 (all / dda / nog / par) или вынутая деталь конструктора (notpl / nopr / nopol) */
  const effOf = ori => !parts.tpl ? 'notpl' : !parts.pr ? 'nopr' : ori === 'par' ? 'par' : !parts.pol ? 'nopol' : null;
  window.EFF1B = () => effOf(segVal('s1b_ori'));
  function cur1(){
    const o = model1b(segVal('s1b_mat'), segVal('s1b_nuc'), segVal('s1b_ori')), e = effOf(o.ori);
    if (e === 'notpl') Object.assign(o, { noTpl: true, ori: 'anti', paired: false, stop: 'nostart', n: 3, seq: F.comp(o.tpl).slice(0, 3), same: null, analog: false });   /* без матрицы ориентация затравки не определена: рисуется свободная затравка */
    if (e === 'nopr') Object.assign(o, { noPr: true, paired: false, stop: 'nostart', n: 0, seq: '', same: null, analog: false });
    if (e === 'nopol') Object.assign(o, { noPol: true, stop: 'nostart', n: 3, seq: o.seq.slice(0, 3), same: null, analog: false });
    o.eff = e || o.nuc;
    return o;
  }
  /* этапы (паспорт, 1.2): 1 — затравка спарена; 2 — напротив основания встаёт dNTP; 3 — присоединение, пирофосфат; 4 — рост 5′→3′ */
  const PLAN = {
    all:   [['s1t_1', 's1t_2', 's1t_3', 's1t_4'], 4, null],
    dda:   [['s1t_1', 's1t_2', 's1t_3', 's1t_4_dda'], 4, 's1t_stop_dda', true],   /* рецензия интерактива, И-03: этап 4 — до обрыва */
    nog:   [['s1t_1', 's1t_2', 's1t_3', 's1t_4_nog'], 4, 's1t_stop_nog', true],
    par:   [['s1t_1_par', 's1t_2', 's1t_3', 's1t_4'], 1, 's1t_stop_par'],
    notpl: [['s1t_1_notpl', 's1t_2', 's1t_3', 's1t_4'], 1, 's1t_stop_notpl'],
    nopr:  [['s1t_1_nopr', 's1t_2', 's1t_3', 's1t_4'], 1, 's1t_stop_nopr'],
    nopol: [['s1t_1', 's1t_2', 's1t_3', 's1t_4'], 1, 's1t_stop_nopol'],
  };
  const POOL = { A: 0, T: 1, G: 2, C: 3 }, NP = F.NP, ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  /* кадр — чистая функция T; в конце (T = остановка) — тот же рисунок, что без анимации */
  function frame(o, T){
    const [, stop] = PLAN[o.eff];
    if (T >= stop - 1e-6) return F.draw(o, t);
    const part = (n) => Object.assign({}, o, { n, seq: o.seq.slice(0, n), stop: 'none', analog: false, same: null });
    if (T < 1){   /* этап 1: затравка подходит к матрице и спаривается */
      if (o.noPr) return F.draw(o, t);
      const q = Object.assign(part(o.ori === 'anti' ? NP : 0), { seq: o.ori === 'anti' ? o.seq.slice(0, NP) : '' });
      if (o.ori !== 'anti') return F.draw(Object.assign({}, o, { prY: 26 * (1 - ease(T)) || undefined }), t);
      const dy = 26 * (1 - ease(T)); if (dy > .05) q.prY = dy;
      return F.draw(q, t);

    const L = o.seq[NP], src = { x0: 80 + POOL[L] * 70, y0: 336 };

    if (T < 3) return F.draw(Object.assign(part(NP + 1), { ppi: { x: F.X(NP) + 14, u: ease(T - 2) } }), t);

      readRow(t('s1_r_len'), t('s1_r_len_s'), p('s1_v_len', { n: o.paired ? o.n : 0 }, o.n < 12 || !o.paired ? 'p' : 'np')) +
      readRow(t('s1_r_seq'), t('s1_r_seq_s'), o.paired ? `<span class="pill np">5′-${seq}-3′</span>` : p('s1_v_none')) +
      readRow(t('s1_r_stop'), '', p('s1_v_stop_' + o.stop, null, o.stop === 'none' ? 'np' : 'p')) +
      (o.same ? readRow(t('s1_r_same'), '', p('s1_v_same', { m: o.same })) : '');
    setCap(K, o.eff === 'notpl' || o.eff === 'nopr' || o.eff === 'nopol' ? 's1_cap_' + o.eff : o.ori === 'par' ? 's1_cap_par' : 's1_cap_' + o.nuc, { m: o.mat, n: o.n });

  const set = (m, n, r) => { kit.full(); segSet('s1b_mat', m); segSet('s1b_nuc', n); segSet('s1b_ori', r); };
  const run = (m, n, r) => { set(m, n, r); armed = true; };
  /* «Найти причину», случай Б: образец — цепь 1; причина — нет dGTP, аналог без 3′-OH или параллельная затравка */
  let saved = null;
  const caseShow = c => {
    if (c) { if (!saved) saved = [segVal('s1b_mat'), segVal('s1b_nuc'), segVal('s1b_ori'), Object.assign({}, parts)]; run('1', c === 'par' ? 'all' : c, c === 'par' ? 'par' : 'anti'); }
    else if (saved) { segSet('s1b_mat', saved[0]); segSet('s1b_nuc', saved[1]); segSet('s1b_ori', saved[2]); Object.assign(parts, saved[3]); saved = null; }
    update(); };

  /* конструктор (паспорт, 2.5): «расставить самому» — точки начала на шести возможных местах участка (кратны 45 условным единицам) */
  const SITES = [45, 135, 225, 315, 405, 495], own = new Set([135, 405]);

    segHTML('s2b_ori', 's2_ori', [['1', 's2_ori_1'], ['3', 's2_ori_3'], ['own', 's2_ori_own']], '1') +

  $('take' + K).textContent = t('s2b_take');

  /* время полного копирования в условных шагах (расчёт модели; вилка — 90 единиц за шаг): самый длинный путь одной вилки */
  function tFull(oris, nf){ oris = oris.slice().sort((a, b) => a - b); if (nf === '1' && oris[0] > 0) return Infinity;
    const L = M.LEN, S = M.STEP, gaps = oris.slice(1).map((u, i) => (u - oris[i]) / (nf === '2' ? 2 : 1));

  window.TFULL2B = tFull;

  const keysOf = o => o.step === 0 ? ['s2t_0'] : [o.nfork === '1' ? 's2t_1_one' : 's2t_1', o.nfork === '1' ? 's2t_2_one' : 's2t_2', 's2t_3'].concat(o.met ? ['s2t_4'] : []);
  const ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  function frame(T){

    const gaps = o.oris.slice(1).map((u, i) => (u - o.oris[i]) / (o.nfork === '2' ? 2 : 1) / M.STEP), meet = o.met && gaps.length ? Math.min(...gaps) - .06 : Infinity;
    const top = Math.min(o.step, meet), s1 = Math.min(top, .25);
    const st = T < 1 ? s1 * ease(T) : T < 2 ? s1 + (top - s1) * ease(T - 1) : T < 3 ? top : top + (o.step - top) * ease(T - 3);
    const q = M.model(nori(), segVal('s2b_fork'), st, st < 1e-6 ? 'hel' : undefined);
    if (st >= 1e-6 && T < 2) q.helForks = true;

(function(){

  /* конструктор (паспорт, 4.7): реплисома из деталей. Вынимаются только SSB, погрузчик зажима и нуклеазы; хеликаза, топоизомераза,
     праймаза и лигаза стоят всегда (граница с занятием, R49). Исход — первая недостающая деталь по этапам: SSB (этап 2) → погрузчик (этап 3) → нуклеазы (этап 4). */
  const parts = {};
  const kit = kitMake(K, { parts, title: 's4k_title', hint: 's4k_hint', changed: () => { hold = true; SCENES[K].update(); },
    slots: [{ id: 'hel', k: 's4k_hel', lock: true }, { id: 'topo', k: 's4k_topo', lock: true }, { id: 'ssb', k: 's4k_ssb' }, { id: 'prim', k: 's4k_prim', lock: true },

  kit.full(); window.PARTS4B = parts; window.KIT4B = kit;
  const offOf = () => parts.ssb === false ? 'ssb' : parts.rfc === false ? 'rfc' : parts.nuc === false ? 'nuc' : 'none';
  window.OFF4B = offOf;

  const PLAN = {
    none: [['s4t_1', 's4t_2', 's4t_3', 's4t_4'], 4, null],
    ssb:  [['s4t_1', 's4t_2_ssb', 's4t_3', 's4t_4'], 2, 's4t_stop_ssb'],
    rfc:  [['s4t_1', 's4t_2', 's4t_3_rfc', 's4t_4'], 3, 's4t_stop_rfc'],

/* =====================================================================
   s5_adv.js — продвинутый уровень семинара 7: четыре системных исследования (ТЗ семинара 7 v1.0, паспорт BIO-S07).
   1a — ограничивающий ресурс (DN.a1); 2a — резервные точки начала (DN.a2); 3a — завершённость (DN.a3); 4a — клетка и ткань (DN.a4).
   v1.3 (Desktop): переключатели, «предскажите → проверьте → объясните», обратные задачи (флаг mask), подсказки.
   v1.4 (Code): шкала этапов под каждой схемой — анимация и пошаговый ход через DN.aK.view(args, t, время); конечный кадр шкалы
   совпадает со статичной схемой, а показания и подпись — итог выбранных условий (они не меняются от кадра к кадру, аудит A20).
   Порядок, как в базовых сценах после аудита A19: смена условия → кадр «до начала процесса» и пауза для прогноза → явный запуск.
   В шаге сценария до «Показать на схеме» схема показывает только исходные условия (pre); в шагах mask и hide шкала выключена
   (poeHide), схема — конечный кадр наблюдения. После «Показать на схеме» анимация новых условий запускается сама.
   Флаг шага mask: схема видна (это наблюдение обратной задачи), переключатели скрыты; рисунок, подпись и показания
   рисуются без признаков причины (masked()).
   ===================================================================== */
const ADV = {};
function advMasked(K){ const st = (typeof poeMasked === 'function') ? poeMasked(K) : null; return !!(st && st.mask); }
/* недоступное положение переключателя: кнопка выключена, причина — строкой под переключателем */
function segOff(id, vals, noteId, noteKey){
  $(id).querySelectorAll('button').forEach(b => { const off = vals.includes(b.dataset.v); b.disabled = off; b.setAttribute('aria-disabled', String(off)); b.classList.toggle('na', off); });
  const n = $(noteId); if (n){ n.textContent = noteKey ? t(noteKey) : ''; n.hidden = !noteKey; }
}
const advPill = (k, v, cls = 'np') => `<span class="pill ${cls}">${t(k, v)}</span>`;
/* шкала этапов продвинутой сцены: frame(T) — SVG кадра; sig — подпись набора этапов (новые условия → новая шкала).
   mode: 'end' — конечный кадр (загрузка страницы, программная установка условий, шаг сценария до показа);
   'hold' — пользователь сменил условие: кадр «до начала», ждём «Запустить»; 'play' — после «Показать на схеме». */
function advStrip(K, note){
  const view = stageView(K);
  let frame = () => '', mode = 'end', sig = null;
  const tl = timeStrip(K, { note, steps: true, render(T){ const s = $('svg' + K); if (s) s.innerHTML = defs(K) + frame(T); predictDone(K, T); }, onEnd: view.back });
  window['TL' + K.toUpperCase()] = tl;
  const z = $('tl' + K + 'z'); if (z) z.addEventListener('click', () => predictHold(K));   /* рецензия v1.4, п. 17: «Сначала» — снова пауза для прогноза */
  return {
    tl,
    hold(){ mode = 'hold'; }, go(){ mode = 'play'; }, K,
    /* keys — подписи этапов; f(T) — кадр; masked — шаг обратной задачи: всегда конечный кадр наблюдения */
    show(keys, f, opt = {}, masked = false){
      frame = masked ? () => f(null) : T => f(T >= tl.end - 1e-6 ? null : T);
      const s2 = JSON.stringify([keys, opt.key || '']);
      const changed = s2 !== sig;

/* =====================================================================
   s9z_case.js — режим «Найти причину» (движок из образца семинара 3; случаи семинара 7 — паспорт, 4.5).
   Образец со скрытой причиной; студент выбирает измерения. Задача решена, только если данные

  '1b': { id: 'c1', causes: ['nog', 'dda', 'par'], meth: {
    next: { ctrl: 'end', nog: 'C',   dda: 'G',  par: 'na' },
    oh:   { ctrl: 'yes', nog: 'yes', dda: 'no', par: 'yes' },
    pair: { ctrl: 'yes', nog: 'yes', dda: 'yes', par: 'no' },
  } },
  /* случай А, вкладка 4: отстающая цепь не созревает */
  '4b': { id: 'c2', causes: ['rfc', 'nuc', 'lig', 'ssb'], truths: ['rfc', 'nuc', 'ssb'], meth: {
    len:  { ctrl: 'full', rfc: 'short', nuc: 'full', lig: 'full',  ssb: 'full' },
    rna:  { ctrl: 'no',   rfc: 'yes',   nuc: 'yes',  lig: 'no',    ssb: 'no' },
    join: { ctrl: 'none', rfc: 'gaps',  nuc: 'rna',  lig: 'nicks', ssb: 'none' },
    tmpl: { ctrl: 'ssb',  rfc: 'ssb',   nuc: 'ssb',  lig: 'ssb',   ssb: 'hairpin' },
    new:  { ctrl: 'yes',  rfc: 'yes',   nuc: 'yes',  lig: 'yes',   ssb: 'no' },   /* рецензия интерактива, И-06: прямой признак дефекта без SSB */
  } },

/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (caseFits(spec, set, truth).length !== 1) continue;
    if (set.length < any.length) any = set;
    if (set.every(m => spec.meth[m][truth] !== spec.meth[m].ctrl) && (!best || set.length < best.length)) best = set;
  }
  return best || any;
}

(function(){

  });

  function settle(K, S){

      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      const TR = S.truths || S.causes;
      if (!url.has('fixed')) do { seed = Math.floor(Math.random() * 9973); } while (TR[seed % TR.length] === CASE.truth);
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur] || !SCENES[cur].caseShow; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
