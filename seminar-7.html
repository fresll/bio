      o.cells.forEach((on, i) => { s += row(156 + i * 50, t('s2a_c_cell', { i: i + 1 }), g1 ? null : on); });
      let y = 350;
      ['s2a_c_key1', 's2a_c_key2'].forEach(k => t(k).split('; ').flatMap((part, i, a) => wrapT(part + (i < a.length - 1 ? ';' : ''), 46)).forEach(l => { s += `<text class="lbl-l" x="${LX}" y="${y}" font-size="12">${l}</text>`; y += 16; }));
      y += 6; wrapT(t('s2a_lbl_foot_cells'), 42).forEach(l => { s += `<text class="area" x="${LX}" y="${y}">${l}</text>`; y += 17; });
      return s;
    }
    o.pts.forEach(([x, nm]) => { s += `<text class="lbl" x="${sx(x)}" y="58" font-size="12.5" font-weight="700">${nm}</text>`; });
    s += row(82, t('s2a_c_g1'), null);
    s += `<path d="M14,118 L586,118" stroke="#C8D2DE" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    o.cells.forEach((on, i) => { s += row(150 + i * 52, t('s2a_c_cell', { i: i + 1 }), g1 ? null : on); });
    s += `<text class="lbl-l" x="14" y="364" font-size="12">${t('s2a_c_key1')}</text>`;
    s += `<text class="lbl-l" x="14" y="384" font-size="12">${t('s2a_c_key2')}</text>`;
    s += `<text class="area" x="14" y="406">${t('s2a_lbl_foot_cells')}</text>`;
    return s;
  }
  return { model, draw, stepEvent, cellsModel, drawCells, DT, CELLS_NARROW,
    view: (a, t, m) => a[0] === 'cells' ? drawCells(cellsModel(), t, m, a[1] === 'narrow') : draw(model(a[0], a[1], a[2], a[3]), t, a[4] === 'mask', m) };
})();

/* ---------- a3: завершённость двух соседних участков ---------- */
DN.a3 = (function(){
  /* Операции созревания (учебная модель; в клетке удаление затравки и заполнение бреши сопряжены):
     0 — продвижение вилок (покрытие матрицы), 1 — удаление РНК-затравок, 2 — заполнение брешей, 3 — лигирование.
     d — не выполненная (задержанная) операция участка: none / fork / rem / fill / lig.
     Операции выполняются по порядку: задержка одной не отменяет сделанного раньше и не даёт выполнить следующие. */
  const ORD = ['fork', 'rem', 'fill', 'lig'];
  const stageOf = d => d === 'none' ? 4 : ORD.indexOf(d);
  function region(d){
    const k = stageOf(d);
    return { d, stage: k, covered: k >= 1, primers: k <= 1, gaps: k === 2, nicks: k === 3, ready: k === 4 };
  }
  function model(dA, dB){
    const A = region(dA), B = region(dB);
    const junction = A.ready && B.ready ? 'sealed' : (A.covered && B.covered ? 'open' : 'apart');
    return { A, B, junction, ready: A.ready && B.ready, block: [A, B].filter(r => !r.ready).map(r => r.d) };
  }
  const YP = 150, YN = 176;
  function strandOf(r, x0, x1, t){
    const C = DN.C, n = 3, w = (x1 - x0) / n, pl = 16;   /* три фрагмента; затравка 16 px у 5′-конца (слева) */
    let s = '';
    if (r.hidden)   /* обратная задача: состояние новой цепи не показано, дано только описание наблюдения */
      return s + `<path d="M${x0},${YN} L${x1},${YN}" stroke="${C.grey}" stroke-width="5" stroke-dasharray="10 8"/>` +
        `<text class="lbl" x="${(x0 + x1) / 2}" y="${YN + 26}" font-size="12" fill="${C.grey}">${t('s3a_lbl_blur')}</text>`;
    for (let i = 0; i < n; i++){
      const a = x0 + i * w, b = a + w;
      if (r.stage === 0 && i === 0) continue;   /* левая часть ещё не скопирована: вилка идёт влево, фрагменты растут 5′→3′ вправо — от вилки */
      if (r.ready){ if (i === 0) s += DN.G('newstrand', DN.line(x0, YN, x1, YN, C.neu, 6)); continue; }
      const dna0 = (r.stage <= 1) ? a + pl : (r.stage === 2 ? a + pl : a);   /* после заполнения бреши ДНК начинается от стыка */
      if (r.stage <= 1) s += DN.primer(a + 1.5, a + pl, YN);
      s += DN.G(i === 0 ? 'newstrand' : 'okazaki', DN.line(dna0 + (r.stage === 2 ? 0 : 1.5), YN, b - 1.5, YN, C.neu, 6));
      if (r.stage === 2) s += DN.G('gap', `<rect x="${a + 1}" y="${YN - 7}" width="${pl - 1}" height="14" fill="none" stroke="${C.red}" stroke-width="1.6" stroke-dasharray="3 2"/>`);
      if (r.stage === 3 && i > 0) s += DN.nick(a, YN);
      if (r.stage === 1 && i > 0) s += DN.nick(a, YN);
    }
    if (r.stage === 0) s += DN.helicase(x0 + w - 8, (YP + YN) / 2, 14);
    return s;
  }
  function draw(o, t, mask){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s3a_lbl_head')}</text>`;
    s += `<text class="lbl" x="164" y="${YP - 34}" font-size="14" font-weight="700">${t('s3a_lbl_A')}</text>`;
    s += `<text class="lbl" x="436" y="${YP - 34}" font-size="14" font-weight="700">${t('s3a_lbl_B')}</text>`;
    s += `<path d="M300,${YP - 44} L300,${YN + 14}" stroke="#C8D2DE" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    s += DN.G('template', DN.line(40, YP, 560, YP, C.old, 5));
    s += strandOf(o.A, 40, 288, t) + strandOf(o.B, 312, 560, t);
    /* стык участков A и Б */
    if (o.junction === 'sealed') s += DN.G('newstrand', DN.line(286, YN, 314, YN, C.neu, 6));
    else if (o.junction === 'open') s += DN.G('newstrand', DN.line(286, YN, 298, YN, C.neu, 6) + DN.line(302, YN, 314, YN, C.neu, 6)) + DN.nick(300, YN);
    if (!o.B.hidden) s += `<text class="lbl" x="300" y="${YN + 30}" font-size="11.5" fill="${C.grey}">${t('s3a_lbl_junc')}</text>`;
    s += DN.end(28, YP + 4, '3′') + DN.end(572, YP + 4, '5′');
    s += DN.end(28, YN + 4, '5′') + DN.end(572, YN + 4, '3′');
    /* обозначения */
    const key = [['s3a_k_rna', C.rna], ['s3a_k_dna', C.neu], ['s3a_k_old', C.old]];
    key.forEach(([k, col], i) => { s += DN.line(44 + i * 180, 292, 74 + i * 180, 292, col, 6) + `<text class="lbl-l" x="${82 + i * 180}" y="${292}" font-size="12">${t(k)}</text>`; });
    s += DN.line(40, 326, 76, 326, C.neu, 6) + DN.nick(58, 326) + `<text class="lbl-l" x="${82}" y="${326}" font-size="12">${t('s3a_k_nick')}</text>`;
    s += `<rect x="${44 + 180}" y="319" width="15" height="14" fill="none" stroke="${C.red}" stroke-width="1.6" stroke-dasharray="3 2"/><text class="lbl-l" x="${262}" y="326" font-size="12">${t('s3a_k_gap')}</text>`;
    /* общий статус под схемой (в обратной задаче — без называния невыполненной операции) */
    const st = mask ? t('s3a_lbl_obs') : o.ready ? t('s3a_lbl_ready') : t('s3a_lbl_notready');
    s += `<text class="lbl" x="300" y="372" font-size="13.5" font-weight="700" fill="${o.ready || mask ? C.ink : C.red}">${st}</text>`;
    s += `<text class="area" x="14" y="406">${t('s3a_lbl_foot')}</text>`;
    return s;
  }
  /* v1.4, шкала этапов: кадр этапа s (0 — вилка ещё идёт; 1–4 — операции по порядку; 5 — стык). Участок не уходит дальше
     своей задержанной операции; конечный кадр (s = 5) совпадает со статичной схемой. */
  const regionK = (r, k) => { const s = Math.min(r.stage, k); return Object.assign({}, r, { stage: s, covered: s >= 1, primers: s <= 1, gaps: s === 2, nicks: s === 3, ready: s === 4 }); };
  function frame(o, s){
    if (s >= 5) return o;
    const k = Math.max(0, s), A = regionK(o.A, k), B = regionK(o.B, k);
    return Object.assign({}, o, { A, B, junction: A.covered && B.covered ? 'open' : 'apart', ready: false });
  }
  return { model, draw, frame, view: (a, t, s) => draw(s == null ? model(a[0], a[1]) : frame(model(a[0], a[1]), s), t, a[2] === 'mask') };
})();

/* ---------- a4: молекула → клетка → ткань ---------- */
DN.a4 = (function(){
  /* Нормальная диплоидная соматическая клетка человека: G1 — 2c, 46 хромосом по одной хроматиде; S — от 2c к 4c;
     G2 и митоз до расхождения хроматид — 4c, 46 хромосом по две хроматиды; после деления — две клетки по 2c.
     G0 — вне цикла, 2c (по одному количеству ДНК от G1 не отличить). Наборы клеток популяций — условные (12 клеток). */
  const DIV = { blood: true, crypt: true, villus: false, neuron: false };
  const POP = { blood: [6, 4, 2], crypt: [7, 3, 2], villus: [12, 0, 0], neuron: [12, 0, 0] };   /* 2c / между / 4c — условно */
  function model(ctx, view, ph){
    if (!DIV[ctx]) ph = 'G0';
    const dna = ph === 'S' ? 'mid' : (ph === 'G2' || ph === 'M') ? '4c' : '2c';
    const chrom = ph === 'D' ? '46+46' : '46', cht = ph === 'S' ? '1to2' : (ph === 'G2' || ph === 'M') ? '2' : '1';
    return { ctx, view, ph, div: DIV[ctx], dna, chrom, cht, repl: ph === 'S', pop: POP[ctx] };
  }
  const PH = [['G1', 0], ['S', 1], ['G2', 2], ['M', 3]];
  function cycle(o, t, cx, cy, r){
    const C = DN.C;
    let s = '';
    PH.forEach(([p, i]) => {
      const a0 = -Math.PI / 2 + i * Math.PI / 2 + .08, a1 = a0 + Math.PI / 2 - .16, on = o.ph === p || (o.ph === 'D' && p === 'M');
      const P = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      const [x0, y0] = P(a0), [x1, y1] = P(a1);
      s += DN.G('cellcycle', `<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${on ? (p === 'S' ? C.neuD : C.old) : '#C8D2DE'}" stroke-width="${on ? 14 : 10}"/>`);
      const am = (a0 + a1) / 2, [lx, ly] = [cx + (r + 26) * Math.cos(am), cy + (r + 26) * Math.sin(am)];
      s += `<text class="lbl" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" font-weight="700">${p}</text>`;
    });
    /* G0 — ответвление от G1 */
    const g0on = o.ph === 'G0';
    const gx = cx + r * Math.cos(-Math.PI / 3), gy = cy + r * Math.sin(-Math.PI / 3), ox = cx + 34, oy = cy - r - 52;
    s += DN.G('g0', `<path d="M${gx.toFixed(1)},${(gy - 6).toFixed(1)} L${ox},${oy + 15}" stroke="${g0on ? C.old : '#C8D2DE'}" stroke-width="${g0on ? 6 : 4}"/><circle cx="${ox}" cy="${oy}" r="16" fill="${g0on ? C.old : '#fff'}" stroke="${C.old}" stroke-width="1.6"/>`);
    s += `<text class="lbl" x="${ox}" y="${oy}" font-size="12" font-weight="700" fill="${g0on ? '#fff' : C.ink}">G0</text>`;
    s += `<text class="lbl" x="${cx}" y="${cy}" font-size="12">${t('s4a_lbl_cyc')}</text>`;
    return s;
  }
  /* хромосома-пример: одна хроматида (палочка) или две сестринские хроматиды, соединённые в центромере */
  function chromo(x, y, k, col){
    const C = DN.C;
    if (k === '1') return DN.G('chromatid', `<rect x="${x - 4}" y="${y - 26}" width="8" height="52" rx="4" fill="${col}"/>`);
    return DN.G('chromatid', `<rect x="${x - 11}" y="${y - 26}" width="8" height="52" rx="4" fill="${col}"/><rect x="${x + 3}" y="${y - 26}" width="8" height="52" rx="4" fill="${col}"/>`) +
      DN.G('centromere', `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="${C.old}" stroke-width="2"/>`);
  }
  function draw(o, t, mask){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    /* рецензия v1.3, Н-03: при скрытии (mask) тип ткани не называется — и в практикуме, и в «Объяснениях» */
    s += `<text class="area" x="14" y="24">${t('s4a_lbl_ctx_' + (mask ? 'mask' : o.ctx))}</text>`;
    if (o.view === 'pop'){
      /* условный набор из 12 клеток: кружки окрашены по количеству ядерной ДНК; справа — счёт по группам */
      const cats = [['2c', '#C8D2DE'], ['mid', C.neu], ['4c', C.neuD]], cells = [];
      o.pop.forEach((n, ci) => { for (let i = 0; i < n; i++) cells.push(ci); });
      cells.forEach((ci, i) => { const x = 70 + (i % 6) * 52, y = 118 + Math.floor(i / 6) * 60;
        s += DN.G('cell', `<circle cx="${x}" cy="${y}" r="21" fill="#fff" stroke="${C.old}" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="11" fill="${cats[ci][1]}" stroke="${C.old}" stroke-width="1"/>`); });
      {
        const lab = ['s4a_pop_2c', 's4a_pop_mid', 's4a_pop_4c'];
        o.pop.forEach((n, ci) => { const y = 270 + ci * 28;
          s += `<circle cx="70" cy="${y}" r="9" fill="${cats[ci][1]}" stroke="${C.old}" stroke-width="1"/><text class="lbl-l" x="88" y="${y}" font-size="12.5">${t(lab[ci], { n })}</text>`; });
      }
      /* гистограмма: условные столбики по трём группам */
      const bx = 410, by = 250, bw = 40;
      ['2c', '2c–4c', '4c'].forEach((lbl, ci) => { const n = o.pop[ci], h = n / 12 * 150;
        s += DN.G('dnahist', `<rect x="${bx + ci * 56}" y="${(by - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" fill="${cats[ci][1]}" stroke="${C.old}" stroke-width="1"/>`) +
          `<text class="lbl" x="${bx + ci * 56 + bw / 2}" y="${by + 14}" font-size="12">${lbl}</text>`; });
      s += `<path d="M${bx - 6},${by} L${bx + 3 * 56},${by}" stroke="${C.grey}" stroke-width="1.2"/>`;
      s += `<text class="lbl" x="${bx + 80}" y="${by + 34}" font-size="11.5" fill="${C.grey}">${t('s4a_lbl_hist')}</text>`;
      s += `<text class="area" x="14" y="406">${t('s4a_lbl_foot_pop')}</text>`;
      return s;
    }
    s += cycle(o, t, 150, 226, 78);
    /* ядро с двумя хромосомами-примерами из 46 (одинаковый цвет: это хромосомы, а не старая и новая цепи) и шкала количества ДНК */
    const CH = '#3E5274';
    if (o.ph === 'D'){
      s += DN.G('nucleus', `<ellipse cx="360" cy="170" rx="56" ry="62" fill="#F3F6FA" stroke="${C.old}" stroke-width="1.8"/><ellipse cx="482" cy="170" rx="56" ry="62" fill="#F3F6FA" stroke="${C.old}" stroke-width="1.8"/>`);
      s += chromo(346, 170, '1', CH) + chromo(374, 170, '1', CH) + chromo(468, 170, '1', CH) + chromo(496, 170, '1', CH);
      s += `<text class="lbl" x="421" y="252" font-size="11.5" fill="${C.grey}">${t('s4a_lbl_two_cells')}</text>`;
    } else {
      s += DN.G('nucleus', `<ellipse cx="420" cy="170" rx="118" ry="86" fill="#F3F6FA" stroke="${C.old}" stroke-width="1.8"/>`);
      if (o.ph === 'S'){   /* S-фаза: вторая хроматида есть только на уже скопированной части */
        [390, 450].forEach(x => { s += DN.G('chromatid', `<rect x="${x - 11}" y="142" width="8" height="52" rx="4" fill="${CH}"/><rect x="${x + 3}" y="142" width="8" height="26" rx="4" fill="${CH}" opacity=".7"/><rect x="${x + 3}" y="170" width="8" height="24" rx="4" fill="none" stroke="${CH}" stroke-width="1.2" stroke-dasharray="3 2"/>`); });
      } else {
        const k = o.cht === '2' ? '2' : '1';
        s += chromo(390, 168, k, CH) + chromo(450, 168, k, CH);
      }
    }
    s += `<text class="lbl" x="420" y="74" font-size="11.5" fill="${C.grey}">${t('s4a_lbl_two')}</text>`;
    /* шкала 2c–4c */
    const v = o.dna === '2c' ? 0 : o.dna === '4c' ? 1 : .5, x0 = 330, x1 = 510, y = 300;
    s += DN.G('dnacontent', `<rect x="${x0}" y="${y - 9}" width="${x1 - x0}" height="18" rx="9" fill="#EEF2F7" stroke="${C.old}" stroke-width="1"/>` +
      (o.dna === 'mid' ? `<rect x="${x0 + 4}" y="${y - 5}" width="${(x1 - x0) - 8}" height="10" rx="5" fill="${C.neu}" opacity=".45"/>` : '') +
      `<circle cx="${(x0 + (x1 - x0) * v).toFixed(1)}" cy="${y}" r="${o.dna === 'mid' ? 0 : 10}" fill="${C.neuD}" stroke="${C.old}" stroke-width="1.4"/>`);
    s += `<text class="lbl" x="${x0}" y="${y + 24}" font-size="12">2c</text><text class="lbl" x="${x1}" y="${y + 24}" font-size="12">4c</text>`;
    s += `<text class="lbl" x="${(x0 + x1) / 2}" y="${y - 22}" font-size="12">${t('s4a_lbl_dna')}</text>`;
    if (o.dna === 'mid') s += `<text class="lbl" x="${(x0 + x1) / 2}" y="${y + 24}" font-size="11.5">${t('s4a_lbl_between')}</text>` + `<text class="lbl" x="${(x0 + x1) / 2}" y="${y + 46}" font-size="11.5">${t('s4a_lbl_s_mid')}</text>`;
    if (!o.div) s += `<text class="lbl" x="160" y="346" font-size="12" fill="${C.grey}">${t('s4a_lbl_nodiv')}</text>`;
    s += `<text class="area" x="14" y="406">${t('s4a_lbl_foot')}</text>`;
    return s;
  }
  /* v1.4, шкала этапов: кадр фазы ph (для делящихся клеток — путь G1 → S → G2 → M → две клетки до выбранного состояния) */
  const PATH = ['G1', 'S', 'G2', 'M', 'D'];
  return { model, draw, DIV, POP, PATH, view: (a, t, ph) => draw(model(a[0], a[1], ph || a[2]), t, a[3] === 'mask') };
})();

/* ---------- итоговая карта: зависимости, а не линейная последовательность реакций ---------- */
DN.amap = (function(){
  const NODES = [   /* [id, x, y, w] */
    ['res', 110, 70, 180], ['ori', 110, 200, 190], ['fork', 300, 135, 150], ['mat', 300, 255, 150], ['done', 495, 255, 160], ['cyc', 495, 352, 160]];
  const EDGES = [['res', 'fork'], ['ori', 'fork'], ['fork', 'mat'], ['mat', 'done'], ['done', 'cyc']];
  /* f: none / dntp / reserve / mature / g0 — какая неисправность включена; где она действует и что видно на выходе */
  const HIT = { dntp: ['res', 'fork'], reserve: ['ori', 'fork'], mature: ['mat'], g0: ['cyc'] };
  function model(f){ return { f, hit: HIT[f] || [], out: f === 'none' ? 'ok' : f === 'g0' ? 'none' : 'incomplete' }; }
  /* узкий экран (рецензия v1.3, Н-33): та же карта столбиком, viewBox 360×600, крупные подписи */
  const NODES_N = [['res', 92, 78, 160], ['ori', 268, 78, 160], ['fork', 180, 190, 200], ['mat', 180, 296, 200], ['done', 180, 402, 200], ['cyc', 180, 508, 200]];
  function draw(o, t, narrow){
    const C = DN.C, NN = narrow ? NODES_N : NODES, N = Object.fromEntries(NN.map(n => [n[0], n]));
    const W = narrow ? 360 : 600, H = narrow ? 600 : 420, H2 = narrow ? 32 : 26, FS = narrow ? 15.5 : 12.5, LH = narrow ? 18 : 15;
    let s = `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="22">${t('amap_head')}</text>`;
    EDGES.forEach(([a, b]) => { const A = N[a], B = N[b];
      const red = o.hit.includes(a) && o.hit.includes(b);
      let x1, y1, x2, y2;
      if (narrow) { x1 = A[1]; y1 = A[2] + H2; x2 = B[1] + (A[1] - B[1]) * 0.35; y2 = B[2] - H2; }
      else { x1 = A[1] + (B[1] > A[1] ? A[3] / 2 : 0); y1 = A[2] + (B[1] > A[1] ? 0 : H2); x2 = B[1] - (B[1] > A[1] ? B[3] / 2 : 0); y2 = B[2] - (B[1] > A[1] ? 0 : H2); }
      s += `<path d="M${x1},${y1} L${x2},${y2}" stroke="${red ? C.red : C.grey}" stroke-width="${red ? 3 : 1.8}" fill="none" marker-end="url(#a_amap)"/>`; });
    NN.forEach(([id, x, y, w]) => { const hit = o.hit.includes(id);
      /* v1.4 (паспорт v1.3-5): у каждого узла — доступное имя; при включённом нарушении — пометка «нарушено» */
      s += `<g role="img" aria-label="${t('amap_n_' + id).split('|').join(' ')}${hit ? ' — ' + t('amap_hit') : ''}">`;
      s += `<rect x="${x - w / 2}" y="${y - H2}" width="${w}" height="${2 * H2}" rx="10" fill="${hit ? '#FBECEA' : '#fff'}" stroke="${hit ? C.red : C.old}" stroke-width="${hit ? 2.4 : 1.6}"/>`;
      const lines = t('amap_n_' + id).split('|');
      lines.forEach((ln, i) => { s += `<text class="lbl" x="${x}" y="${y + (i - (lines.length - 1) / 2) * LH}" font-size="${FS}" aria-hidden="true">${ln}</text>`; }); s += '</g>'; });
    { const col = o.out === 'ok' ? C.ink : o.out === 'none' ? C.old : C.red, txt = t('amap_out_' + o.out);
      /* на узком экране итог — в две строки: по двоеточию или тире */
      const k = txt.search(/: | — /), parts = narrow && k > 0 ? [txt.slice(0, k + (txt[k] === ':' ? 1 : 2)), txt.slice(k + (txt[k] === ':' ? 2 : 3))] : [txt];
      parts.forEach((ln, i) => { s += `<text class="lbl" x="${W / 2}" y="${H - 22 - (parts.length - 1 - i) * 19}" font-size="${narrow ? 15 : 13}" font-weight="700" fill="${col}">${ln}</text>`; }); }
    return `<defs><marker id="a_amap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${C.grey}"/></marker></defs>` + s;
  }
  return { model, draw, view: (a, t) => draw(model(a[0]), t) };
})();

/* Модели и рисунки вкладки 1 (общие для практикума и «Объяснений»); подписи — через функцию t, переданную вызывающим. */
/* ---- вкладка 1, базовый уровень: модель и рисунок (общие для практикума и «Объяснений») ---- */
DN.s1b = (function(){
  /* цепь 1 читается слева направо 3′→5′; цепь 2 — её комплемент (тоже 3′→5′ слева направо) */
  const S1 = 'TACGTGCATCGA', PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
  const comp = s => s.split('').map(c => PAIR[c]).join('');
  const S2 = comp(S1).split('').reverse().join('');   /* цепь 2, записанная 3′→5′ */
  const NP = 3;                                       /* длина затравки (нуклеотидов) */
  function model1b(mat, nuc, ori){
    const tpl = mat === '2' ? S2 : S1, full = comp(tpl);
    const o = { tpl, mat, nuc, ori, paired: ori === 'anti', n: NP, stop: 'none', seq: '', analog: false };
    if (ori !== 'anti') { o.stop = 'nostart'; o.n = NP; o.seq = ''; return o; }
    let n = NP;
    for (let i = NP; i < tpl.length; i++){
      const need = full[i];
      if (nuc === 'nog' && need === 'G') { o.stop = 'noG'; break; }
      n = i + 1;
      if (nuc === 'dda' && need === 'A') { o.stop = 'dda'; o.analog = true; break; }
    }
    o.n = n; o.seq = full.slice(0, n);
    o.same = n === tpl.length ? (mat === '2' ? '1' : '2') : null;   /* новая цепь целиком = другая цепь исходной молекулы */
    return o;
  }
  

  const X = i => 66 + 42 * i, YT = 92, YTB = 122, YNB = 178, YN = 208;
  function hb(x, L, on){ if (!on) return '';
    const n = (L === 'G' || L === 'C') ? 3 : 2, d = n === 3 ? [-6, 0, 6] : [-4, 4];
    return DN.G('hbond', d.map(dx => DN.line(x + dx, YTB + 15, x + dx, YNB - 15, DN.C.grey, 1.6, 'stroke-dasharray="3 2"')).join('')); }
  function draw(o, t){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    /* необязательные поля кадра (только практикум, конструктор и анимация; без них рисунок как в v1.1):
       noTpl / noPr / noPol — деталь вынута в конструкторе; prY — затравка ещё не подошла (сдвиг вниз, px);
       come — входящий dNTP {L, x0, y0, u}; ppi — отщеплённый пирофосфат {x, u} */
    s += `<text class="area" x="14" y="24">${t(o.noTpl ? 's1_lbl_notpl' : 's1_lbl_tpl', { m: o.mat })}</text>`;
    /* матрица */
    if (!o.noTpl) s += DN.G('template', DN.strand(X(0) - 14, X(11) + 14, YT, C.old) + o.tpl.split('').map((L, i) => DN.line(X(i), YT, X(i), YTB - 13, C.old, 3) + DN.base(X(i), YTB, L, C.old)).join(''));
    if (!o.noTpl) s += DN.end(X(0) - 28, YT + 4, '3′') + DN.end(X(11) + 28, YT + 4, '5′');
    if (o.noPr){
      /* затравки нет: полимеразе нечего удлинять */
      s += DN.polymerase(X(1), YNB + 6, 44, 30) + `<text class="lbl-l" x="${X(1) + 28}" y="${YNB + 11}" font-size="12">${t('s1_lbl_pol')}</text>`;
      s += `<text class="lbl" x="300" y="${YN + 50}" font-size="12.5" fill="${C.red}">${t('s1_lbl_nopr')}</text>`;
    } else if (o.ori === 'anti'){
      const s0 = s; s = '';
      /* затравка и новая цепь: 5′ слева, растут вправо (5′→3′) */
      const pr = DN.G('primer', DN.strand(X(0) - 14, X(NP - 1) + 10, YN, C.neuD));
      const nw = o.n > NP ? DN.G('newstrand', DN.strand(X(NP - 1) + 10, X(o.n - 1) + 10, YN, C.neu, { grow: o.stop === 'dda' ? 0 : 1 })) : '';
      s += pr + nw;
      for (let i = 0; i < o.n; i++){
        const L = o.seq[i], an = o.analog && i === o.n - 1, col = i < NP ? '#5E6E80' : C.neuD;
        s += DN.line(X(i), YN, X(i), YNB + 13, i < NP ? C.neuD : C.neu, 3) + DN.G(an ? 'analog' : (i < NP ? 'primer' : 'newstrand'), DN.base(X(i), YNB, L, col, an ? { stroke: C.red, sw: 3 } : {}));
        s += hb(X(i), L, !o.noTpl && o.prY == null);
      }
      s += DN.end(X(0) - 28, YN + 4, '5′');
      if (o.stop === 'dda') s += `<text class="lbl-l" x="${X(o.n) + 66}" y="${YNB + 44}" font-size="12" fill="${C.red}">${t('s1_lbl_no3oh')}</text>`;
      else s += DN.end(X(o.n - 1) + 30, YN + 4, '3′');
      if (!o.noPol && o.stop !== 'dda' && o.n < 12) s += DN.polymerase(X(o.n) - 8, YNB + 6, 44, 30) + (X(o.n) + 20 <= 470 ? `<text class="lbl-l" x="${X(o.n) + 20}" y="${YNB + 11}" font-size="12">${t('s1_lbl_pol')}</text>` : '');   /* у правого края (только кадры анимации) — без подписи */
      if (o.stop === 'dda') s += DN.polymerase(X(o.n) + 6, YNB + 6, 44, 30) + `<text class="lbl-l" x="${X(o.n) + 34}" y="${YNB + 11}" font-size="12">${t('s1_lbl_pol')}</text>`;
      if (o.stop === 'noG') s += `<text class="lbl-l" x="${X(o.n) + 56}" y="${YNB + 44}" font-size="12" fill="${C.red}">${t('s1_lbl_needG')}</text>`;
      s += `<text class="lbl-l" x="${X(0) - 14}" y="${YN + 28}" font-size="12">${t('s1_lbl_primer')}</text>`;
      if (o.n > NP + 1) s += `<text class="lbl" x="${(X(NP) + X(o.n - 1)) / 2}" y="${YN + 46}" font-size="12">${t('s1_lbl_new')}</text>`;
      s = s0 + (o.prY ? `<g transform="translate(0,${o.prY.toFixed(1)})">${s}</g>` : s);
      if (o.noPol) s += `<text class="lbl" x="300" y="${YN + 68}" font-size="12.5" fill="${C.red}">${t('s1_lbl_nopol')}</text>`;
      if (o.noTpl) s += `<text class="lbl" x="300" y="${YT}" font-size="12.5" fill="${C.red}">${t('s1_lbl_notpl_pr')}</text>`;
    } else {
      const s0 = s; s = '';
      /* параллельная затравка: 3′ слева, 5′ справа — спаривания и синтеза нет */
      s += DN.G('primer', DN.strand(X(0) - 14, X(NP - 1) + 10, YN + 10, C.neuD));
      comp(o.tpl.slice(0, NP)).split('').reverse().forEach((L, i) => {   /* та же затравка (5′→3′), уложенная в обратной ориентации (рецензия v1.0, Р-05) */ s += DN.line(X(i), YN + 10, X(i), YNB + 23, C.neuD, 3) + DN.G('primer', DN.base(X(i), YNB + 10, L, '#5E6E80')); });
      s += DN.end(X(0) - 28, YN + 14, '3′') + DN.end(X(NP - 1) + 30, YN + 14, '5′');
      s += `<text class="lbl" x="300" y="${YN + 50}" font-size="12.5" fill="${C.red}">${t('s1_lbl_par')}</text>`;
      s = s0 + (o.prY ? `<g transform="translate(0,${o.prY.toFixed(1)})">${s}</g>` : s);
    }
    /* набор нуклеотидов в среде */
    const pool = [['A', o.nuc === 'dda'], ['T', false], ['G', false], ['C', false]];
    s += `<text class="lbl-l" x="40" y="300" font-size="12.5">${t('s1_lbl_pool')}</text>`;
    pool.forEach(([L, an], i) => {
      const x = 80 + i * 70, y = 336, miss = o.nuc === 'nog' && L === 'G';
      s += DN.G(an ? 'analog' : 'dntp', `<circle cx="${x}" cy="${y}" r="17" fill="#fff" stroke="${an ? C.red : C.neuD}" stroke-width="${an ? 3 : 2}" ${miss ? 'opacity=".35"' : ''}/><text class="lbl" x="${x}" y="${y + 5}" font-size="14" font-weight="700" ${miss ? 'opacity=".35"' : ''}>${L}</text>`);
      if (miss) s += DN.cross(x, y, 15);
    });
    if (o.nuc === 'dda') s += `<text class="lbl-l" x="380" y="330" font-size="12" fill="${C.red}">${t('s1_lbl_pool_dda')}</text>`;
    if (o.nuc === 'nog') s += `<text class="lbl-l" x="380" y="330" font-size="12" fill="${C.red}">${t('s1_lbl_pool_nog')}</text>`;
    if (o.come){   /* входящий dNTP: из среды к месту напротив следующего основания матрицы */
      /* путь между цепями (над подписями): справа к месту напротив основания матрицы, затем вниз — на место */
      const c = o.come, u = c.u, a = Math.min(1, u / .7), x = X(c.i) + 110 * (1 - a), y = YNB - 30 + 30 * Math.max(0, (u - .7) / .3), op = Math.min(1, .3 + u * 3.5);
      s += DN.G('dntp', `<g opacity="${op.toFixed(2)}"><circle cx="${DN.f(x)}" cy="${DN.f(y)}" r="13" fill="#fff" stroke="${C.neuD}" stroke-width="2.5"/><text class="lbl" x="${DN.f(x)}" y="${DN.f(y + 5)}" font-size="13" font-weight="700">${c.L}</text></g>`);
    }
    if (o.ppi){   /* пирофосфат отщепляется и уходит */
      const u = o.ppi.u, x = o.ppi.x + 40 * u, y = YN + 56 + 18 * u;   /* ниже подписи затравки, выше подписи среды */
      s += `<g opacity="${(1 - u * .8).toFixed(2)}">` + DN.G('ppi', `<circle cx="${DN.f(x)}" cy="${DN.f(y)}" r="5" fill="${C.grey}"/><circle cx="${DN.f(x + 11)}" cy="${DN.f(y)}" r="5" fill="${C.grey}"/>`) +
        `<text class="lbl-l" x="${DN.f(x + 22)}" y="${DN.f(y + 4)}" font-size="11.5">${t('s1t_lbl_ppi')}</text></g>`;   /* справка и нейтральный цвет (И-14) */
    }
    s += `<text class="area" x="14" y="406">${t('s1_lbl_hb')}</text>`;
    return s;
  }

  return { model: model1b, draw, X, YNB, NP, comp };
})();
/* вид для «Объяснений»: аргументы модели → SVG */
DN.s1b.view = (a, t) => DN.s1b.draw(DN.s1b.model(...a), t);

/* Модели и рисунки вкладки 2 (общие для практикума и «Объяснений»). Подписи — через функцию t вызывающего. */
/* ---- 2b: точки начала, пузырьки и вилки. Отрезок хромосомной ДНК 0…540 условных единиц; вилка проходит 90 единиц за шаг времени ---- */
DN.s2b = (function(){
  const X0 = 30, LEN = 540, STEP = 90, YT = 120, YB = 150;
  function model(nori, nfork, step, hel){
    /* nori: '1', '3' или массив положений (конструктор практикума, v1.2) */
    const oris = Array.isArray(nori) ? nori.slice().sort((a, b) => a - b) : nori === '3' ? [90, 270, 450] : [270];
    const d = step * STEP, segs = [];
    oris.forEach(o => { segs.push([nfork === '2' ? Math.max(0, o - d) : o, Math.min(LEN, o + d)]); });
    /* слияние перекрывающихся пузырьков: встречные вилки соседних точек начала */
    segs.sort((a, b) => a[0] - b[0]); const m = [];
    segs.forEach(s => { if (m.length && s[0] <= m[m.length - 1][1]) m[m.length - 1][1] = Math.max(m[m.length - 1][1], s[1]); else m.push(s.slice()); });
    const copied = m.reduce((a, s) => a + s[1] - s[0], 0) / LEN;
    let met = 0; const meetAt = [];   /* число и места встреч вилок соседних точек начала */
    if (nfork === '2') for (let i = 0; i < oris.length - 1; i++) if (oris[i] + d >= oris[i + 1] - d) { met++; meetAt.push((oris[i] + oris[i + 1]) / 2); }
    if (nfork === '1') for (let i = 0; i < oris.length - 1; i++) if (oris[i] + d >= oris[i + 1]) { met++; meetAt.push(oris[i + 1]); }
    const live = [];
    if (step > 0) m.forEach(([a, b]) => { if (nfork === '2' && a > 0) live.push([a, -1]); if (b < LEN) live.push([b, 1]); });
    return { nori, nfork, step, oris, segs: m, copied, met, meetAt, forks: live, done: copied > .999, hel: hel === 'hel' };
  }
  function draw(o, t){
    const C = DN.C, x = u => X0 + u;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s2_lbl_seg')}</text>`;
    /* родительская ДНК вне пузырьков */
    let pos = 0; const gaps = [];
    o.segs.forEach(sg => { if (sg[0] > pos) gaps.push([pos, sg[0]]); pos = sg[1]; }); if (pos < LEN) gaps.push([pos, LEN]);
    gaps.forEach(([a, b]) => { s += DN.G('template', DN.line(x(a), YT, x(b), YT, C.old, 6) + DN.line(x(a), YB, x(b), YB, C.old, 6)) + DN.rungs(x(a) + 6, x(b) - 6, YT + 4, YB - 4, 14); });
    /* пузырьки: старые цепи расходятся, к каждой — новая цепь */
    o.segs.forEach(([a, b]) => {
      if (b - a < 1) return;   /* пузырька ещё нет (рецензия v1.0, Р-10) */
      const up = YT - 40, dn = YB + 40, ax = x(a), bx = x(b), k = Math.min(18, (bx - ax) / 3);
      s += DN.G('bubble', `<path d="M${ax},${YT} Q${ax + k},${up} ${ax + k * 2},${up} L${bx - k * 2},${up} Q${bx - k},${up} ${bx},${YT}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>` +
        `<path d="M${ax},${YB} Q${ax + k},${dn} ${ax + k * 2},${dn} L${bx - k * 2},${dn} Q${bx - k},${dn} ${bx},${YB}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>`);
      if (bx - ax > 4 * k) s += DN.G('newstrand', DN.line(ax + k * 2, up + 14, bx - k * 2, up + 14, C.neu, 6) + DN.line(ax + k * 2, dn - 14, bx - k * 2, dn - 14, C.neu, 6)) +
        DN.rungs(ax + k * 2 + 6, bx - k * 2 - 6, up + 3, up + 11, 14) + DN.rungs(ax + k * 2 + 6, bx - k * 2 - 6, dn - 11, dn - 3, 14);
    });
    /* точки начала */
    o.oris.forEach(u => { s += DN.origin(x(u), YB + 50); });
    /* только «Объяснения»: две неактивные хеликазы, загруженные на точку начала до S-фазы */
    if (o.hel && o.step === 0) o.oris.forEach(u => { s += DN.helicase(x(u) - 13, (YT + YB) / 2, 12) + DN.helicase(x(u) + 13, (YT + YB) / 2, 12); });
    /* кадры анимации (только практикум): хеликазы у движущихся вилок; кольца на местах встречи вилок */
    if (o.helForks) o.forks.forEach(([u, dir]) => { s += DN.helicase(x(u) - dir * 4, (YT + YB) / 2, 11); });
    if (o.ring) o.meetAt.forEach(u => { s += DN.G('fork', `<circle cx="${x(u)}" cy="${(YT + YB) / 2}" r="${(24 + 6 * o.ring).toFixed(1)}" fill="none" stroke="${C.neuD}" stroke-width="2.5" stroke-dasharray="5 4" opacity="${(1 - .6 * o.ring).toFixed(2)}"/>`); });   /* место встречи вилок; не цвет белков (И-15) */
    if (o.oris.length) s += `<text class="lbl" x="${Math.max(110, Math.min(490, x(o.oris[0])))}" y="${YB + 76}" font-size="12">${t('s2_lbl_ori')}</text>`;   /* у края участка подпись не выходит за схему */
    /* вилки: стрелка направления движения */
    o.forks.forEach(([u, dir]) => { s += DN.G('fork', `<path d="M${x(u)},${YT - 56} l${dir * 16},0" stroke="${C.hel}" stroke-width="3"/><path d="M${x(u) + dir * 22},${YT - 56} l${-dir * 8},-6 l0,12 z" fill="${C.hel}"/>`); });
    if (o.forks.length) s += `<text class="lbl" x="${x(o.forks[o.forks.length - 1][0])}" y="${YT - 70}" font-size="12">${t('s2_lbl_fork')}</text>`;
    /* репликоны при трёх точках начала */
    if (o.nori === '3') [[0, 180], [180, 360], [360, 540]].forEach(([a, b], i) => { s += DN.G('replicon', DN.line(x(a) + 4, YB + 104, x(b) - 4, YB + 104, C.grey, 1.6) + DN.line(x(a) + 4, YB + 98, x(a) + 4, YB + 110, C.grey, 1.6) + DN.line(x(b) - 4, YB + 98, x(b) - 4, YB + 110, C.grey, 1.6)); });
    /* свои точки начала (конструктор): границы репликонов — посередине между соседними точками */
    if (Array.isArray(o.nori) && o.oris.length > 1) { const bd = [0].concat(o.oris.slice(1).map((u, i) => (u + o.oris[i]) / 2), [540]);
      bd.slice(1).forEach((b2, i) => { const a = bd[i]; s += DN.G('replicon', DN.line(x(a) + 4, YB + 104, x(b2) - 4, YB + 104, C.grey, 1.6) + DN.line(x(a) + 4, YB + 98, x(a) + 4, YB + 110, C.grey, 1.6) + DN.line(x(b2) - 4, YB + 98, x(b2) - 4, YB + 110, C.grey, 1.6)); }); }
    if (o.nori === '3' || (Array.isArray(o.nori) && o.oris.length > 1)) s += `<text class="lbl" x="300" y="${YB + 124}" font-size="12" fill="var(--muted)">${t('s2_lbl_replicons')}</text>`;
    if (o.nfork === '1' && o.step > 0) s += `<text class="lbl" x="300" y="${YB + 146}" font-size="12.5" fill="${C.red}">${t(o.oris.length > 1 ? 's2_lbl_onefork3' : 's2_lbl_onefork')}</text>`;
    /* состав дочерних молекул скопированного участка */
    if (o.step > 0 && !o.noDaughters) {
      const yy = 352;
      s += `<text class="lbl-l" x="40" y="${yy - 30}" font-size="12.5">${t('s2_lbl_daughters')}</text>`;
      [[60, C.old, C.neu], [330, C.neu, C.old]].forEach(([x0, a, b], i) => {
        s += DN.G('daughter', DN.line(x0, yy, x0 + 210, yy, a, 6) + DN.line(x0, yy + 24, x0 + 210, yy + 24, b, 6) + DN.rungs(x0 + 8, x0 + 202, yy + 4, yy + 20, 14));
      });
      s += `<text class="lbl" x="300" y="${yy + 50}" font-size="12">${t('s2_lbl_semi')}</text>`;
    }
    return s;
  }
  return { model, draw, view: (a, t) => draw(model(...a), t), STEP, LEN };
})();


/* Модели и рисунки вкладки 3 (общие для практикума и «Объяснений»). */
/* ---- 3b: одна вилка. Цепь 1 (вверху) записана 3′→5′ слева направо, цепь 2 (внизу) — 5′→3′.
   Новая цепь на цепи 1 растёт 5′→3′ слева направо, на цепи 2 — справа налево. Правая вилка движется вправо: на цепи 1 рост совпадает
   с ходом вилки — ведущая, на цепи 2 — отстающая. Левая вилка — зеркально: на цепи 1 отстающая. Ход вилки — 1…3 шага; созревание отстающей цепи — 4 состояния. ---- */
DN.s3b = (function(){
  const FL = 140;   /* длина фрагмента Оказаки на схеме, px (условно) */
  function model(side, step, mat){
    step = +step;
    const nFrag = step + 1;                        /* фрагменты отстающей цепи: по одному на шаг + первый */
    const o = { side, step, mat, nFrag, leadOn: side === 'right' ? '1' : '2', lagOn: side === 'right' ? '2' : '1' };
    o.primers = mat === 'syn' ? nFrag : 0;         /* РНК-затравки на 5′-концах фрагментов */
    o.flaps = mat === 'rem' ? nFrag - 1 : 0;       /* при удалении: лоскут с затравкой срезает нуклеаза (на схеме — бреши) */
    o.gaps = mat === 'rem' ? nFrag - 1 : 0;
    o.nicks = mat === 'fill' ? nFrag - 1 : 0;
    o.joined = mat === 'lig';
    o.leadPrimers = 1;                             /* у ведущей цепи — одна затравка в начале (у точки начала, за пределами схемы) */
    return o;
  }
  function draw(o, t){
    const C = DN.C, R = o.side === 'right', X = u => R ? u : 600 - u;   /* u — координата для правой вилки */
    const FX = 400 + (o.step - 1) * 40;           /* вилка сдвигается с каждым шагом */
    const yT = 100, yB = 300, yNT = 128, yNB = 272, yD1 = 188, yD2 = 212;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s3_lbl_head')}</text>`;
    /* родительская двойная спираль впереди вилки */
    s += DN.G('template', DN.line(X(FX + 24), yD1, X(590), yD1, C.old, 6) + DN.line(X(FX + 24), yD2, X(590), yD2, C.old, 6)) + DN.rungs(Math.min(X(FX + 30), X(584)), Math.max(X(FX + 30), X(584)), yD1 + 4, yD2 - 4, 14);
    /* расходящиеся матрицы */
    s += DN.G('template', `<path d="M${X(FX + 24)},${yD1} Q${X(FX)},${yD1} ${X(FX - 30)},${yT} L${X(20)},${yT}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/><path d="M${X(FX + 24)},${yD2} Q${X(FX)},${yD2} ${X(FX - 30)},${yB} L${X(20)},${yB}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>`);
    /* подписи концов: цепь 1 всегда 3′ слева, 5′ справа */
    /* концы: слева у правой вилки — плечи, у левой — двойная спираль; справа — наоборот */
    const yL1 = R ? yT - 12 : yD1 - 12, yL2 = R ? yB + 18 : yD2 + 18, yR1 = R ? yD1 - 12 : yT - 12, yR2 = R ? yD2 + 18 : yB + 18;
    s += DN.end(10, yL1, '3′', 'start') + `<text class="lbl-l" x="30" y="${yL1}" font-size="12">${t('s3_lbl_s1')}</text>` + DN.end(10, yL2, '5′', 'start') + `<text class="lbl-l" x="30" y="${yL2}" font-size="12">${t('s3_lbl_s2')}</text>`;
    s += DN.end(592, yR1, '5′', 'end') + DN.end(592, yR2, '3′', 'end');
    /* хеликаза в точке расхождения */
    s += DN.helicase(X(FX + 4), (yD1 + yD2) / 2, 16);
    s += `<path d="M${X(FX + 46)},${(yD1 + yD2) / 2 - 34} l${R ? 30 : -30},0" stroke="${C.hel}" stroke-width="3"/><path d="M${X(FX + 82)},${(yD1 + yD2) / 2 - 34} l${R ? -9 : 9},-6 l0,12 z" fill="${C.hel}"/><text class="lbl" x="${X(FX + 64)}" y="${(yD1 + yD2) / 2 - 50}" font-size="12">${t('s3_lbl_move')}</text>`;
    /* ведущая цепь: непрерывная, растёт к вилке; лежит на матрице цепи 2 у правой вилки (внизу), на цепи 1 у левой (вверху) */
    const leadY = R ? yNT : yNB, lagY = R ? yNB : yNT;
    /* необязательные поля кадра (только практикум, анимация; без них рисунок как в v1.1): leadU — доля длины ведущей цепи;
       newU — самый новый фрагмент отстающей цепи: < 0 — ещё нет, 0 — только затравка, 0…1 — достраивается */
    const leadEnd = o.leadU == null ? FX - 44 : 20 + Math.max(.04, o.leadU) * (FX - 64);
    s += DN.G('leading', DN.line(X(20), leadY, X(leadEnd), leadY, C.neu, 6) + DN.head(X(leadEnd + 4), leadY, R ? 1 : -1, C.neu));
    s += DN.polymerase(X(leadEnd - 14), leadY + (leadY === yNT ? 14 : -14), 40, 24, 'polepsilon');
    s += `<text class="lbl" x="${X(190)}" y="${leadY === yNT ? 172 : 228}" font-size="12.5" font-weight="600">${t('s3_lbl_lead')}</text>`;
    /* отстающая цепь: фрагменты, каждый растёт от вилки назад; самый новый — у вилки */
    const last = FX - 50;   /* 5′-конец самого нового фрагмента (ближе к вилке) */
    let fr = '';
    for (let i = 0; i < o.nFrag; i++) {
      const a = last - i * FL, b = a - FL;                /* фрагмент от a (5′, у вилки) к b (3′); законченный фрагмент доходит до 5′-конца более старого (аудит Codex A21, v1.4) */
      if (a < 30) break;
      const bb = Math.max(24, b), isNew = i === 0;
      const prL = 18;
      if (o.mat === 'syn' && isNew && o.newU != null && o.newU < 1) {
        if (o.newU >= 0) { const e3 = (a - prL) - ((a - prL) - (bb + 30)) * o.newU; fr += DN.primer(X(a), X(a - prL), lagY) + (o.newU > .02 ? DN.G('okazaki', DN.line(X(a - prL), lagY, X(e3), lagY, C.neu, 6) + DN.head(X(e3 - 4), lagY, R ? -1 : 1, C.neu)) : ''); }
      } else if (o.mat === 'syn') {
        fr += DN.primer(X(a), X(a - prL), lagY) + DN.G('okazaki', DN.line(X(a - prL), lagY, X(bb + (isNew ? 30 : 0)), lagY, C.neu, 6) + (isNew ? DN.head(X(bb + 26), lagY, R ? -1 : 1, C.neu) : ''));
      } else if (o.mat === 'rem') {
        fr += DN.G('okazaki', DN.line(X(a - prL), lagY, X(bb), lagY, C.neu, 6));
        if (i < o.nFrag - 1 || bb > 30) { /* брешь на месте затравки следующего (более старого) фрагмента не показываем у края */ }
      } else {
        if (o.mat !== 'lig') fr += DN.G('okazaki', DN.line(X(a), lagY, X(bb), lagY, C.neu, 6));   /* после сшивания — одна непрерывная линия ниже (И-16, A21) */
      }
      if (o.mat === 'fill' && i > 0) fr += DN.nick(X(a), lagY);   /* разрыв — на стыке фрагментов, без промежутка */
      if (o.mat === 'rem' && i > 0) fr += DN.nuclease(X(a + 4), lagY + (lagY === yNT ? 18 : -18));
    }
    if (o.mat === 'fill') fr += DN.ligase(X(last - FL + 8), lagY + (lagY === yNT ? 20 : -20));
    if (o.mat === 'lig') fr = DN.G('lagging', DN.line(X(last), lagY, X(Math.max(24, last - o.nFrag * FL)), lagY, C.neu, 6)) + fr;
    s += fr;
    /* полимераза δ с зажимом на самом новом фрагменте и праймаза у вилки (только в синтезе) */
    if (o.mat === 'syn') {
      const inw = lagY === yNT ? 1 : -1;   /* сторона «внутрь вилки» */
      /* полимераза δ с зажимом — у растущего 3′-конца самого нового фрагмента; до начала его синтеза — не на матрице */
      const pd = o.newU == null || o.newU >= 1 ? last - FL + 36 : o.newU > 0 ? (last - 18) - ((last - 18) - (last - FL + 46)) * o.newU - 10 : null;
      if (pd != null) s += DN.polymerase(X(pd), lagY + inw * 14, 40, 24, 'poldelta') + DN.clamp(X(pd + 28), lagY, 1, lagY === yNT ? yT : yB);
      s += DN.primase(X(FX - 36), lagY + inw * 20);
    }
    s += `<text class="lbl" x="${X(190)}" y="${lagY === yNT ? 172 : 228}" font-size="12.5" font-weight="600">${t('s3_lbl_lag')}</text>`;
    /* подпись состояния отстающей цепи */
    s += `<text class="lbl" x="300" y="372" font-size="12.5">${t('s3_lbl_mat_' + o.mat)}</text>`;
    s += `<text class="area" x="14" y="406">${t('s3_lbl_status')}</text>`;
    return s;
  }
  return { model, draw, view: (a, t) => draw(model(...a), t) };
})();


/* Модели и рисунки вкладки 4 (общие для практикума и «Объяснений»). */
/* ---- 4b: реплисома у правой вилки (как во вкладке 3: цепь 1 вверху — матрица ведущей цепи, цепь 2 внизу — матрица отстающей).
   Переключатель — какой компонент убран: none / ssb / rfc (погрузчик зажима; без него зажим не надет) / nuc (нуклеазы удаления затравок).
   Хеликаза, праймаза, лигаза и топоизомераза на схеме есть всегда.
   Исходы — качественная учебная модель по MBoC7 (с. 258–268); длины условные. ---- */
DN.s4b = (function(){
  const ssEnd = FX => FX - 38;
  function model(off){
    const o = { off };
    o.FX = 440;
    o.lead = off === 'rfc' ? 'slow' : 'ok';
    o.lag = { none: 'mature', ssb: 'blocked', rfc: 'short', nuc: 'primers' }[off];
    o.ss = off === 'ssb' ? 'hairpin' : 'short';
    return o;
  }
  function draw(o, t){
    const C = DN.C, FX = o.FX;
    const yT = 100, yB = 300, yNT = 128, yNB = 272, yD1 = 188, yD2 = 212, yM = (yD1 + yD2) / 2;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s4_lbl_head')}</text>`;
    /* родительская двойная спираль и матрицы */
    s += DN.G('template', DN.line(FX + 24, yD1, 590, yD1, C.old, 6) + DN.line(FX + 24, yD2, 590, yD2, C.old, 6)) + DN.rungs(FX + 30, 584, yD1 + 4, yD2 - 4, 14);
    s += DN.G('template', `<path d="M${FX + 24},${yD1} Q${FX},${yD1} ${FX - 30},${yT} L20,${yT}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/><path d="M${FX + 24},${yD2} Q${FX},${yD2} ${FX - 30},${yB} L20,${yB}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>`);
    s += DN.end(10, yT - 12, '3′', 'start') + `<text class="lbl-l" x="30" y="${yT - 12}" font-size="12">${t('s3_lbl_s1')}</text>` + DN.end(10, yB + 18, '5′', 'start') + `<text class="lbl-l" x="30" y="${yB + 18}" font-size="12">${t('s3_lbl_s2')}</text>`;
    s += DN.end(592, yD1 - 12, '5′', 'end') + DN.end(592, yD2 + 18, '3′', 'end');
    /* топоизомераза впереди вилки, хеликаза в точке расхождения */
    s += DN.topo(FX + 70, yM) + DN.helicase(FX + 4, yM, 16);
    s += `<path d="M${FX + 84},${yM - 40} l30,0" stroke="${C.hel}" stroke-width="3"/><path d="M${FX + 120},${yM - 40} l-9,-6 l0,12 z" fill="${C.hel}"/><text class="lbl" x="${FX + 100}" y="${yM - 54}" font-size="12">${t('s3_lbl_move')}</text>`;
    /* необязательное поле кадра upTo (только практикум, анимация по этапам паспорта 4.2; без него рисунок как в v1.1):
       1 — расплетание; 2 — + SSB (или шпильки без SSB); 3 — + синтез обеих цепей до созревания; 4 — всё */
    const U = o.upTo == null ? 9 : o.upTo;
    const yL = yNB, up = -1, pr = (x5) => DN.primer(x5, x5 - 18, yL), dna = (x5, x3, g = 'okazaki') => DN.G(g, DN.line(x5, yL, x3, yL, C.neu, 6));
    const tip = x => DN.head(x - 4, yL, -1, C.neu);
    if (U <= 2) {
      if (U === 2 && o.off === 'ssb') s += DN.G('hairpin', DN.hairpin(300, yB, 1) + DN.hairpin(352, yB, 1)) + `<text class="lbl" x="${340}" y="${yB + 22}" font-size="11.5" fill="${C.red}">${t('s4_lbl_hp')}</text>`;
      else if (U === 2) s += DN.ssb(40, ssEnd(FX), yB - 12, 18);
    } else {
    /* ведущая цепь */
    const lag = U === 3 && (o.lag === 'mature' || o.lag === 'primers') ? 'primers3' : o.lag;
    const leadEnd = o.lead === 'ok' ? FX - 44 : FX - 170;
    s += DN.G('leading', DN.line(20, yNT, leadEnd, yNT, C.neu, 6) + DN.head(leadEnd + 4, yNT, 1, C.neu));
    s += DN.polymerase(leadEnd - 14, yNT + 14, 40, 24, 'polepsilon');
    if (o.lead === 'ok') s += DN.clamp(leadEnd + 14, yNT, 1, yT);
    /* отстающая цепь (растёт справа налево, от вилки): слева направо — старые фрагменты, справа — самый новый у вилки.
       Полный набор: сшитый участок | разрыв (лигаза) | фрагмент X | лоскут с затравкой X срезает нуклеаза | фрагмент Y с затравкой |
       одноцепочечная матрица, которую копирует полимераза δ (фрагмент Z) | затравка Z | одноцепочечная матрица под SSB у вилки. */
    if (lag === 'mature') {
      s += dna(100, 20, 'lagging') + DN.ligase(104, yL - 22);
      s += dna(190, 108) + DN.G('primer', `<path d="M190,${yL} q8,-4 14,-16" fill="none" stroke="${C.rna}" stroke-width="5" stroke-linecap="round"/>`) + DN.nuclease(206, yL + up * 30);
      s += dna(262, 194) + pr(280);
      s += DN.ssb(296, 312, yB - 12, 16);
      s += dna(360, 322) + tip(322) + pr(378) + DN.polymerase(340, yL + up * 16, 40, 24, 'poldelta') + DN.clamp(318, yL, 1, yB);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
    } else if (lag === 'blocked') {
      /* аудит Codex A06 (v1.4): SSB нет у работающей вилки — фрагменты, синтезированные раньше, созрели и сшиты (как в CASE_SPEC:
         полной длины, без РНК, сшиты); у вилки на матрице шпильки, новый фрагмент не начат */
      s += dna(262, 20, 'lagging');
      s += DN.G('hairpin', DN.hairpin(300, yB, 1) + DN.hairpin(352, yB, 1));
      s += DN.polymerase(300, yL + up * 18, 40, 24, 'poldelta');
    } else if (lag === 'short') {
      for (const x5 of [100, 190, 280, 378]) s += pr(x5) + dna(x5 - 18, x5 - 52);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
      s += DN.polymerase(300, yL + up * 30, 40, 24, 'poldelta');
      s += `<text class="lbl" x="150" y="${yL - 18}" font-size="11.5" fill="${C.red}">${t('s4_lbl_gap')}</text>`;
    } else if (lag === 'primers') {
      for (const [x5, x3] of [[100, 20], [190, 104], [280, 194], [378, 284]]) s += pr(x5) + dna(x5 - 18, x3);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
      s += DN.ligase(102, yL - 22);   /* лигаза есть, но сшить фрагменты не может (Р-33) */
    } else if (lag === 'primers3') {   /* кадр этапа 3: фрагменты синтезированы, затравки ещё не удалены; полимераза δ с зажимом — на самом новом (И-02) */
      for (const [x5, x3] of [[100, 20], [190, 104], [280, 194]]) s += pr(x5) + dna(x5 - 18, x3);
      s += dna(360, 322) + tip(322) + pr(378) + DN.polymerase(340, yL + up * 16, 40, 24, 'poldelta') + DN.clamp(318, yL, 1, yB);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
    }
    s += DN.primase(FX - 44, yL + up * 24);
    if (o.off === 'rfc') s += DN.loader(360, yL + up * 52) + DN.cross(360, yL + up * 52, 12);
    else s += DN.loader(360, yL + up * 52);
    if (o.off === 'nuc' && !o.masked) s += DN.nuclease(240, yL + up * 30) + DN.cross(240, yL + up * 26, 10);
    if (o.off === 'ssb') s += `<text class="lbl" x="${340}" y="${yB + 22}" font-size="11.5" fill="${C.red}">${t('s4_lbl_hp')}</text>`;
    }
    if (U === 9) s += `<text class="lbl" x="300" y="368" font-size="12.5">${t(o.masked ? 's4_lbl_off_q' : 's4_lbl_off_' + o.off)}</text>`;   /* подпись исхода — только в конечном кадре (И-04) */
    s += `<text class="area" x="14" y="406">${t('s4_lbl_status')}</text>`;
    return s;
  }
  return { model, draw, view: (a, t) => draw(model(...a), t) };
})();


/* =====================================================================
   s0_figs_dna_struct.js — структурные вставки «Объяснений» (v1.4, аудит Codex A24).
   DN.sst  — строение: нуклеотид (сахар с нумерацией атомов углерода, фосфат, основание), участок цепи (фосфодиэфирная связь,
             5′- и 3′-концы), двойная спираль (два антипараллельных остова, пары оснований). Схемы условные: это не химические
             формулы — названия веществ подписаны, формул рядом нет.
   DN.srfc — работа погрузчика зажима: раскрывает кольцо → надевает его на дуплекс затравка–матрица у 3′-конца затравки →
             кольцо замкнуто, погрузчик уходит, полимераза δ связывается с зажимом.
   Русского текста здесь нет: подписи — через t().
   ===================================================================== */
DN.sst = (function(){
  const f = DN.f;
  /* сахар-пентагон: вершины — O (вверху), C1′ (справа), C2′, C3′ (внизу), C4′ (слева); C5′ — над C4′ снаружи кольца */
  const ANG = { O: -90, c1: -18, c2: 54, c3: 126, c4: 198 };
  const P = (cx, cy, r, a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  function sugar(cx, cy, t, num){
    const C = DN.C, r = 26, v = ['O', 'c1', 'c2', 'c3', 'c4'].map(k => P(cx, cy, r, ANG[k]));
    let s = `<path d="M${v.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="#FFF4E0" stroke="#B7791F" stroke-width="2.2"/>`;
    s += `<text class="lbl" x="${f(v[0][0])}" y="${f(v[0][1] - 9)}" font-size="11" fill="#8a5a12">O</text>`;
    if (num){ [['c1', '1′', 12, -2], ['c2', '2′', 10, 10], ['c3', '3′', 8, 14], ['c4', '4′', -13, -2]].forEach(([k, l, dx, dy]) => {
      const p = P(cx, cy, r, ANG[k]); s += `<text class="lbl" x="${f(p[0] + dx)}" y="${f(p[1] + dy)}" font-size="11" fill="#8a5a12">${l}</text>`; }); }
    return { s, v };
  }
  /* нуклеотид: фосфат (кружок P) — C5′ — сахар — основание (прямоугольник у C1′); 3′-OH у C3′ */
  function nucleotide(cx, cy, t, o = {}){
    const C = DN.C, { s: sg, v } = sugar(cx, cy, t, o.num), c4 = v[4], c5 = [c4[0] - 8, c4[1] - 30], c1 = v[1], c3 = v[3];
    let s = '';
    s += DN.line(c4[0], c4[1], c5[0], c5[1], '#B7791F', 2.2);
    if (o.num) s += `<text class="lbl" x="${f(c5[0] + 12)}" y="${f(c5[1] + 2)}" font-size="11" fill="#8a5a12">5′</text>`;
    if (o.phos !== false){ const px = c5[0] - 30, py = c5[1] - 14;
      s += DN.line(c5[0], c5[1], px, py, C.old, 2.2) + `<circle cx="${f(px)}" cy="${f(py)}" r="12" fill="#E7ECF5" stroke="${C.old}" stroke-width="2"/><text class="lbl" x="${f(px)}" y="${f(py)}" font-size="12" font-weight="700" fill="${C.old}">P</text>`; }
    s += sg;
    s += DN.line(c1[0], c1[1], c1[0] + 30, c1[1], '#7A8899', 2.2) + `<rect x="${f(c1[0] + 30)}" y="${f(c1[1] - 14)}" width="40" height="28" rx="5" fill="#EEF3FA" stroke="${C.neuD}" stroke-width="2"/><text class="lbl" x="${f(c1[0] + 50)}" y="${f(c1[1])}" font-size="13" font-weight="700" fill="${C.neuD}">${o.base || 'A'}</text>`;
    if (o.oh) s += DN.line(c3[0], c3[1], c3[0] - 14, c3[1] + 18, '#B7791F', 2.2) + `<text class="lbl-l" x="${f(c3[0] - 42)}" y="${f(c3[1] + 28)}" font-size="12" font-weight="700" fill="#8a5a12">3′-OH</text>`;
    return { s, c3, c5 };
  }
  function draw(mode, t){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('st_head_' + mode)}</text>`;
    if (mode === 'nt'){
      const n = nucleotide(250, 200, t, { num: true, oh: true, base: 'A' });
      s += n.s;
      s += `<text class="lbl-l" x="318" y="150" font-size="12.5">${t('st_base')}</text>`;
      s += `<text class="lbl-l" x="285" y="252" font-size="12.5">${t('st_sugar')}</text>`;
      s += `<text class="lbl-l" x="70" y="118" font-size="12.5">${t('st_phos')}</text>`;
      s += `<text class="lbl-l" x="40" y="330" font-size="12">${t('st_nt_note')}</text>`;
    } else if (mode === 'chain'){
      /* два нуклеотида: фосфат соединяет 3′-углерод сахара верхнего с 5′-углеродом сахара нижнего */
      const a = nucleotide(250, 120, t, { num: true, base: 'G' }), b = nucleotide(258, 290, t, { num: true, oh: true, base: 'C', phos: false });
      s += a.s + b.s;
      const px = 196, py = 205;
      s += DN.line(a.c3[0], a.c3[1], px, py, C.old, 2.4) + DN.line(px, py, b.c5[0], b.c5[1], C.old, 2.4) +
        `<circle cx="${px}" cy="${py}" r="12" fill="#E7ECF5" stroke="${C.old}" stroke-width="2"/><text class="lbl" x="${px}" y="${py}" font-size="12" font-weight="700" fill="${C.old}">P</text>`;
      s += `<path d="M150,${py} L180,${py}" stroke="${C.grey}" stroke-width="1.2"/><text class="lbl-l" x="20" y="${py - 9}" font-size="12">${t('st_bond1')}</text><text class="lbl-l" x="20" y="${py + 9}" font-size="12">${t('st_bond2')}</text>`;
      s += `<text class="lbl-l" x="300" y="52" font-size="12.5" font-weight="700">${t('st_end5')}</text><path d="M296,56 L232,76" stroke="${C.grey}" stroke-width="1.2"/>`;
      s += `<text class="lbl-l" x="300" y="372" font-size="12.5" font-weight="700">${t('st_end3')}</text><path d="M296,368 L262,346" stroke="${C.grey}" stroke-width="1.2"/>`;
      s += `<path d="M560,70 L560,330" stroke="${C.neuD}" stroke-width="2"/><path d="M560,336 l-6,-12 l12,0 z" fill="${C.neuD}"/><text class="lbl" x="530" y="200" font-size="12" fill="${C.neuD}">5′→3′</text>`;
    } else {
      /* двойная спираль: два остова — синусоиды со сдвигом на половину периода; между ними пары оснований */
      const x0 = 70, x1 = 530, yc = 205, A = 62, per = 230, Y = (x, ph) => yc + A * Math.sin(2 * Math.PI * (x - x0) / per + ph + Math.PI / 2);   /* концы цепей — в верхней и нижней точках: подписи 5′/3′ не совпадают */
      const path = ph => { let d = ''; for (let x = x0; x <= x1; x += 4) d += (x === x0 ? 'M' : ' L') + f(x) + ',' + f(Y(x, ph)); return d; };
      let rungs = '';
      for (let x = x0 + 10; x < x1; x += 18){ const y1 = Y(x, 0), y2 = Y(x, Math.PI); if (Math.abs(y1 - y2) < 18) continue;
        const front = Math.cos(2 * Math.PI * (x - x0) / per + Math.PI / 2) > 0;
        rungs += DN.line(x, Math.min(y1, y2) + 5, x, Math.max(y1, y2) - 5, front ? '#7A8899' : C.rung, front ? 2.6 : 2); }
      s += DN.G('pair', rungs);
      s += DN.G('strand', `<path d="${path(0)}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>`);
      s += DN.G('strand', `<path d="${path(Math.PI)}" fill="none" stroke="${C.neuD}" stroke-width="6" stroke-linecap="round"/>`);
      s += DN.end(x0 - 18, Y(x0, 0) + 4, '5′') + DN.end(x1 + 18, Y(x1, 0) + 4, '3′');
      s += DN.end(x0 - 18, Y(x0, Math.PI) + 4, '3′') + DN.end(x1 + 18, Y(x1, Math.PI) + 4, '5′');
      s += `<text class="lbl" x="300" y="${yc + A + 40}" font-size="12.5">${t('st_helix_bb')}</text>`;
      s += `<text class="lbl" x="300" y="${yc + A + 60}" font-size="12.5">${t('st_helix_pairs')}</text>`;
      s += `<text class="lbl" x="300" y="${yc - A - 30}" font-size="12.5">${t('st_helix_anti')}</text>`;
    }
    s += `<text class="area" x="14" y="406">${t(mode === 'helix' ? 'st_foot_helix' : 'st_foot')}</text>`;
    return s;
  }
  return { draw, view: (a, t) => draw(a[0], t) };
})();

DN.srfc = (function(){
  const f = DN.f;
  /* кольцо зажима: замкнутое — эллипс вокруг дуплекса; раскрытое — эллипс с разрывом снизу */
  const ring = (x, y, ry, open) => { const C = DN.C, rx = 9;
    if (!open) return DN.G('pcna', `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${rx}" ry="${f(ry)}" fill="none" stroke="${C.pcna}" stroke-width="6"/>`);
    return DN.G('pcna', `<path d="M${f(x - 5)},${f(y + ry - 2)} A${rx},${f(ry)} 0 1 1 ${f(x + 7)},${f(y + ry - 5)}" fill="none" stroke="${C.pcna}" stroke-width="6" stroke-linecap="round"/>`); };
  function draw(mode, t){
    const C = DN.C, yN = 222, yT = 250, X3 = 300;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('rfc_head')}</text>`;
    /* матрица и новая цепь: затравка (РНК) + ДНК до 3′-конца; дальше — одноцепочечная матрица */
    s += DN.G('template', DN.line(40, yT, 560, yT, C.old, 6)) + DN.end(28, yT + 4, '3′') + DN.end(572, yT + 4, '5′');
    s += DN.rungs(110, X3 - 6, yN + 5, yT - 5, 16);
    s += DN.primer(110, 150, yN) + DN.G('newstrand', DN.line(150, yN, X3, yN, C.neu, 6) + DN.head(X3 + 4, yN, 1, C.neu)) + DN.end(98, yN + 4, '5′');
    if (mode === 'open') s += `<text class="lbl" x="${X3 + 10}" y="${yN - 18}" font-size="11.5">${t('rfc_lbl_3end')}</text>`;
    const ry = (yT - yN) / 2 + 13, ym = (yN + yT) / 2;
    if (mode === 'open'){
      s += DN.loader(X3 + 40, 104) + ring(X3 + 40, 150, ry, true);
      s += `<text class="lbl-l" x="${X3 + 70}" y="100" font-size="12">${t('rfc_lbl_rfc')}</text><text class="lbl-l" x="${X3 + 70}" y="150" font-size="12">${t('rfc_lbl_open')}</text>`;
      s += `<text class="lbl-l" x="${X3 + 70}" y="118" font-size="11.5" fill="${C.grey}">${t('rfc_lbl_atp')}</text>`;
    } else if (mode === 'load'){
      s += DN.loader(X3 - 10, ym - ry - 22) + ring(X3 - 10, ym, ry, true);
      s += `<text class="lbl-l" x="${X3 + 26}" y="${ym - ry - 22}" font-size="12">${t('rfc_lbl_rfc')}</text><text class="lbl-l" x="${X3 + 26}" y="${ym + ry + 22}" font-size="12">${t('rfc_lbl_load')}</text>`;
    } else {
      s += ring(X3 - 10, ym, ry, false) + DN.polymerase(X3 + 18, yN - 26, 44, 26, 'poldelta');
      s += `<g opacity=".45">${DN.loader(480, 104)}</g><text class="lbl-l" x="500" y="100" font-size="11.5" fill="${C.grey}">${t('rfc_lbl_left')}</text>`;
      s += `<text class="lbl-l" x="${X3 - 40}" y="${ym + ry + 22}" font-size="12">${t('rfc_lbl_closed')}</text>`;
    }
    s += `<text class="lbl" x="300" y="350" font-size="12.5">${t('rfc_cap_' + mode)}</text>`;
    s += `<text class="area" x="14" y="406">${t('rfc_foot')}</text>`;
    return s;
  }
  return { draw, view: (a, t) => draw(a[0], t) };
})();

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   stageView — возврат схемы на экран при запуске (телефон).
   Семинар 7: формы мембраны MF не нужны и не перенесены; справка по деталям — группы data-g (DN.G), она включена всегда
   в практикуме, а в «Объяснениях» разметка снимается (W.dna).
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */
const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));
    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */
    chips.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));
      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    o.render(T);
  }
  const api = {
    get T() { return st.T; }, get playing() { return st.on; }, get end() { return st.stop; },
    config(keys, stop, stopKey, opt = {}) {
      st.speed = opt.speed || 1.5; st.halt = !!opt.halt; st.keys = keys; st.n = keys.length; st.stop = stop; st.stopKey = stopKey; st.on = false; st.text = '';
      st.stepKey = opt.stepKey || 'tl_step'; st.off = opt.off || 0;
      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');
      chips.querySelectorAll('button').forEach((b, i) => b.onclick = () => { st.on = false; api.seek(i + 1); });
    },
    seek(T) { st.until = null; st.T = Math.max(0, Math.min(st.stop, T)); paint(); },
    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
    play(fromStart, until) {
      if (fromStart || st.T >= st.stop - 1e-6) st.T = 0;
      st.until = until != null && until < st.stop ? until : null;
      if (calm.matches) {   /* без движения: ответ показывается сразу, кнопка идёт по одному этапу */
        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => CASE.on ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —
   сначала прогноз, потом явный запуск («▶ Запустить», шаг или кнопка этапа). Как только шкала ушла с нуля, итог виден. */
function predictHold(K){ const sc = $('sc' + K); if (!sc) return; sc.classList.add('predict');
  /* рецензия v1.4, п. 8: кнопки этапов без исхода в доступном имени, пока прогноз не сделан */
  sc.querySelectorAll('.tlc').forEach(b => { if (!b.dataset.al) b.dataset.al = b.getAttribute('aria-label') || ''; b.setAttribute('aria-label', (b.dataset.al.split(':')[0] || '').trim()); });
  const c = $('capbox' + K), r = $('reads' + K); if (c) c.dataset.predict = t('predict_note'); if (r) r.dataset.predict = t('predict_reads'); }
function predictDone(K, T){ if (T > 1e-6) { const sc = $('sc' + K); if (sc && sc.classList.contains('predict')) { sc.classList.remove('predict');
  sc.querySelectorAll('.tlc').forEach(b => { if (b.dataset.al != null) { b.setAttribute('aria-label', b.dataset.al); delete b.dataset.al; } }); } } }

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typeof fitStage === 'function') fitStage(); });

/* =====================================================================
   s0_range.js — бегунок величины (общий компонент курса «Биология», v1.6 семинара 3).
   По образцу бегунков «Молекулярной биологии» (rangeHTML: подпись — величина, вывод — значение с единицами;
   засечки измеренных значений как в сцене s2b семинара 1 МБ).
   Возможности: засечки измеренных значений с подписями под шкалой; прилипание к засечке в пределах 3 % шкалы;
   ступенчатый режим (только измеренные положения); логарифмическая или своя шкала; штриховка участков
   «интерполяция модели / не измерено» между засечками. Блокировку в шаге «предскажите» даёт poeLock
   (s9_wip.js): бегунок — элемент input внутри панели переключателей.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
const RX = (function () {
  const SP = {}, N = 1000;
  const lg = Math.log10;
  /* положение на шкале p ∈ [0, 1] ↔ значение величины */
  function toP(sp, v) {
    if (sp.map) return clamp(sp.map[0](v));
    if (sp.log) return clamp((lg(v) - lg(sp.min)) / (lg(sp.max) - lg(sp.min)));
    return clamp((v - sp.min) / (sp.max - sp.min));
  }
  function toV(sp, p) {
    if (sp.map) return sp.map[1](p);
    if (sp.log) return Math.pow(10, lg(sp.min) + p * (lg(sp.max) - lg(sp.min)));
    return sp.min + p * (sp.max - sp.min);
  }
  const num = (v, d) => (d == null ? String(v) : v.toFixed(d)).replace('.', ',').replace('-', '−');
  function fmtV(sp, v) { return sp.fmt ? sp.fmt(v) : num(v, sp.dec != null ? sp.dec : 0); }
  function round(sp, v) { if (!sp.round) return v; const r = sp.round(v); return r; }
  /* место на дорожке: центр бегунка ходит от 11 px до (ширина − 11 px) */
  const at = p => `calc(11px + ${(p * 100).toFixed(2)}% - ${(p * 22).toFixed(2)}px)`;

  function html(id, sp) {
    SP[id] = sp; sp.id = id;
    const steps = !!sp.stepped, marks = sp.marks || [];
    const v0 = sp.val != null ? sp.val : steps ? marks[0][0] : sp.min, sep = sp.glue ? '' : ' ';
    sp.v = v0;
    const iv = steps ? marks.findIndex(m => m[0] === v0) : Math.round(toP(sp, v0) * N);
    let h = `<div class="rx${steps ? ' rxstep' : ''}" id="${id}W"><div class="row"><label for="${id}">${t(sp.k)}</label><output id="${id}O">${fmtV(sp, v0)}${sep}${t(sp.unit)}</output></div>`;
    h += `<div class="rxtrack">`;
    if (!steps) (sp.hatch || []).forEach(([a, b]) => { const pa = toP(sp, a), pb = toP(sp, b), l = Math.min(pa, pb), r = Math.max(pa, pb);
      h += `<i class="rxh" style="left:${at(l)};width:calc(${((r - l) * 100).toFixed(2)}% - ${((r - l) * 22).toFixed(2)}px)"></i>`; });
    h += `<input type="range" id="${id}" min="0" max="${steps ? marks.length - 1 : N}" step="1" value="${iv}" aria-valuetext="${fmtV(sp, v0)}${sep}${t(sp.unit)}">`;
    const pm = (v, i) => steps ? (marks.length > 1 ? i / (marks.length - 1) : 0) : toP(sp, v);
    const two = marks.some(m => m[3]);   /* близкие засечки: подпись во втором ряду */
    h += `</div><div class="rxticks${two ? ' two' : ''}" aria-hidden="true">` + marks.map(([v, , short, row], i) => { const p = pm(v, i);
      return `<span class="rxt${row ? ' r1' : ''}" style="left:${at(p)}" data-p="${p.toFixed(3)}"><i></i>${short ? t(short) : fmtV(sp, v)}</span>`; }).join('') + `</div>`;
    const leg = marks.filter(m => m[1]).map(([v, k]) => `<li><b>${fmtV(sp, v)}${sep}${t(sp.unit)}</b> — ${t(k)}</li>`).join('') +
      (sp.hatchKey ? `<li class="rxhl"><i class="rxsw"></i>${t(sp.hatchKey)}</li>` : '');
    if (leg) h += `<ul class="rxleg">${leg}</ul>`;
    return h + `</div>`;
  }
  /* обработчик: прилипание, вывод значения; fn вызывается после пересчёта */
  function bind(id, fn) {
    const sp = SP[id], e = $(id);
    /* клавиатура: стрелка переходит к следующей засечке или на 2 % шкалы (без прилипания, иначе из засечки не уйти) */
    if (!sp.stepped) e.addEventListener('keydown', ev => {
      const dir = ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? 1 : ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -1 : 0;
      if (!dir) return;
      ev.preventDefault();
      const p = +e.value / N, stp = 0.02;
      let q = clamp(p + dir * stp);
      (sp.marks || []).forEach(([mv]) => { const pm = toP(sp, mv); if (dir > 0 ? pm > p + 1e-4 && pm < q : pm < p - 1e-4 && pm > q) q = pm; });
      e.value = Math.round(q * N); sp._kb = true; e.dispatchEvent(new Event('input', { bubbles: true })); sp._kb = false;
    });
    e.addEventListener('input', () => {
      if (e.disabled) { set(id, sp.v); return; }   /* шаг сценария «предскажите»: заблокированный бегунок состояние не меняет (семинар 7, v1.2) */
      if (sp.stepped) { sp.v = sp.marks[+e.value][0]; }
      else {
        let p = +e.value / N, v = round(sp, toV(sp, p));
        const snap = sp.snap != null ? sp.snap : 0.03;
        let best = null; if (!sp._kb) (sp.marks || []).forEach(([mv]) => { const d = Math.abs(toP(sp, mv) - p); if (d <= snap && (!best || d < best.d)) best = { d, mv }; });
        if (best) { v = best.mv; e.value = Math.round(toP(sp, v) * N); }
        else if (sp._kb) { const m = (sp.marks || []).find(([mv]) => Math.abs(toP(sp, mv) - p) < 1e-3); if (m) v = m[0]; }
        sp.v = v;
      }
      out(sp); if (fn) fn(sp.v);
    });
    out(sp);
  }
  function out(sp) {
    const s = fmtV(sp, sp.v) + (sp.glue ? '' : ' ') + t(sp.unit), o = $(sp.id + 'O'), e = $(sp.id);
    if (o) o.textContent = s; if (e) e.setAttribute('aria-valuetext', s);
    const W = $(sp.id + 'W'); if (W) W.querySelectorAll('.rxt').forEach((x, i) => x.classList.toggle('on', (sp.marks[i] || [])[0] === sp.v));
  }
  /* поставить значение (из сценария или из анимации); ступенчатый бегунок — ближайшее измеренное положение */
  function set(id, v) {
    const sp = SP[id], e = $(id);
    if (sp.stepped) { let bi = 0; sp.marks.forEach(([mv], i) => { if (Math.abs(mv - v) < Math.abs(sp.marks[bi][0] - v)) bi = i; }); sp.v = sp.marks[bi][0]; if (e) e.value = bi; }
    else { (sp.marks || []).forEach(([mv]) => { if (Math.abs(toP(sp, mv) - toP(sp, v)) < 1e-4) v = mv; });   /* ошибка округления при пересчёте время ↔ значение */
      if (sp.round && !(sp.marks || []).some(([mv]) => mv === v)) v = sp.round(v);
      sp.v = v; if (e) e.value = Math.round(toP(sp, v) * N); }
    out(sp); return sp.v;
  }
  const get = id => SP[id].v;
  const spec = id => SP[id];
  /* значение на засечке? (для показаний «измерено» и для тестов) */
  const onMark = id => (SP[id].marks || []).some(([mv]) => mv === SP[id].v);
  return { html, bind, set, get, spec, onMark, toP, toV, fmtV, num };
})();
window.RX = RX;

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (граница с занятием, R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   Вкладка 1. Комплементарность: почему копирование ДНК воспроизводимо
   1b — базовый: матрица (цепь 1 или 2) × набор нуклеотидов (обычный; вместо dATP — аналог без 3′-OH; нет dGTP) ×
        ориентация затравки (антипараллельно / параллельно). Правила модели — MBoC7, с. 186–187, 258–261.
   1a — продвинутый (v1.3): системное исследование — src/s5_adv.js; прежние сцены «Эксперимент» и «Модель по данным» — в архиве v1.2.

(function(){
