<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.srcbox{margin-top:14px}
details.srcbox summary{cursor:pointer;font-weight:600}
details.srcbox p,details.srcbox li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
  /* v1.5 (аудит S7-14-05): модель 2a «разные клетки» в узкой рамке помещается в экран целиком — без увеличения и прокрутки */
  .stage.zcells .zoombtn,.stage.zcells .zhint{display:none!important}
  .stage.zcells .zwrap{overflow:visible;max-height:none}
  .stage.zcells svg,.stage.zoomed.zcells svg{width:100%!important;max-width:100%;max-height:none!important}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tlrow{display:flex;gap:10px;align-items:center}
.tlplay{white-space:nowrap;min-width:116px;padding-top:7px;padding-bottom:7px}
.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */

.veil b{font:600 22px var(--f-display);color:var(--ink)}

.ct{margin:2px 0 6px;font-size:19px}

.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}
.kh{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */
:root{--nucbg:#F3EEF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}

.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}

.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (граница с занятием, R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}

.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}

.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}

/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}

.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}

m_t": "Чего модель не показывает", "m_pA": "А", "m_pB": "Б", "m_hidden": "Показания откроются после ответа", "poe_hidden": "Схема откроется после ответа: сначала выберите вариант и нажмите «Показать на схеме».", "s1_mat": "Матрица", "s1_mat_1": "цепь 1", "s1_mat_2": "цепь 2", "s1_nuc": "Нуклеотиды в среде", "s1_nuc_all": "все четыре dNTP", "s1_nuc_dda": "вместо dATP — аналог без 3′-OH", "s1_nuc_nog": "нет dGTP", "s1_ori": "Затравка", "s1_ori_anti": "антипараллельна матрице", "s1_ori_par": "параллельна матрице", "s1_lbl_tpl": "матрица — цепь {m} (записана 3′→5′ слева направо)", "s1_lbl_primer": "затравка (короткая ДНК; в клетке затравка — РНК)", "s1_lbl_new": "новая цепь", "s1_lbl_pol": "ДНК-полимераза", "s1_lbl_no3oh": "аналог: нет 3′-OH", "s1_lbl_needG": "напротив C нужен G — dGTP нет", "s1_lbl_par": "затравка параллельна матрице: пары не образуются", "s1_lbl_pool": "Нуклеотиды в среде (dNTP):", "s1_lbl_pool_dda": "A — аналог без 3′-OH", "s1_lbl_pool_nog": "dGTP нет", "s1_lbl_hb": "пунктир — водородные связи: в паре A–T две, в паре G–C три (схема, не масштаб)", "s1_r_pairs": "Пары оснований с матрицей", "s1_v_pairs": "A–T и G–C", "s1_v_nopairs": "не образуются", "s1_r_len": "Длина новой цепи", "s1_r_len_s": "из 12 нуклеотидов, считая 3 нуклеотида затравки", "s1_v_len": "{n}", "s1_r_seq": "Последовательность новой цепи", "s1_r_seq_s": "звёздочка — аналог без 3′-OH", "s1_v_none": "нет", "s1_r_stop": "Синтез", "s1_v_stop_none": "дошёл до конца матрицы", "s1_v_stop_dda": "оборвался после аналога напротив первого T матрицы за затравкой", "s1_v_stop_noG": "остановился перед первым C матрицы за затравкой", "s1_v_stop_nostart": "не начался", "s1_r_same": "Новая цепь совпадает", "s1_v_same": "с цепью {m} исходной молекулы", "s1_cap_all": "Матрица — цепь {m}. Напротив каждого основания матрицы ДНК-полимераза присоединяет комплементарный нуклеотид: напротив A — T, напротив T — A, напротив G — C, напротив C — G. Новая цепь растёт от 3′-OH затравки в направлении 5′→3′ и антипараллельна матрице.", "s1_cap_all_z": "Последовательность новой цепи однозначно задана матрицей: новая цепь совпадает с другой цепью исходной молекулы, поэтому каждая из двух цепей может служить матрицей, и копия воспроизводит исходную информацию.", "s1_cap_dda": "Вместо dATP в среде аналог без 3′-OH. Он встаёт напротив первого T матрицы за затравкой, но к нему нельзя присоединить следующий нуклеотид: у аналога нет 3′-OH. Цепь обрывается — {n} нуклеотидов, считая затравку.", "s1_cap_dda_z": "Обрыв происходит точно напротив определённого основания матрицы, поэтому по длине продукта можно определить, где в матрице стоит T. На этом основан метод определения последовательности ДНК обрывом цепей.", "s1_cap_nog": "В среде нет dGTP. Напротив первого C матрицы за затравкой нужен G; в этой модели полимераза присоединяет только комплементарный нуклеотид, поэтому синтез останавливается перед этим положением — {n} нуклеотидов, считая затравку.", "s1_cap_nog_z": "Комплементарность ограничивает выбор: напротив C подходит только G. Полимераза изредка всё же присоединяет некомплементарный нуклеотид; как такие ошибки исправляются — семинар 8.", "s1_cap_par": "Затравка уложена параллельно матрице: напротив 3′-конца матрицы оказался её 3′-конец. В двойной спирали цепи антипараллельны, поэтому такая затравка в модели не образует пар с матрицей, и у полимеразы нет спаренного с матрицей 3′-OH — синтез не начинается.", "s1_cap_par_z": "Для копирования нужны оба свойства молекулы: комплементарность оснований и антипараллельность цепей.", "s1b_take": "Комплементарность делает возможным точное копирование: основание матрицы определяет, какой нуклеотид встанет напротив, поэтому каждая цепь служит матрицей для другой, а копия повторяет исходную последовательность. Синтез идёт только от 3′-OH цепи, спаренной с антипараллельной матрицей, в направлении 5′→3′. В этой модели отсутствие нужного нуклеотида или 3′-OH останавливает синтез; в эксперименте такой результат поддерживает необходимость компонента, если воздействие специфично, а остальные условия сохранены.", "p1b_1_q": "Условия: матрица — цепь 1, затравка из 3 нуклеотидов, ДНК-полимераза в пробирке. В смесь вместо обычного dATP добавлен аналог без 3′-OH. Где остановится синтез новой цепи?", "p1b_1_o1": "Сразу после того, как аналог встанет напротив первого T матрицы за затравкой", "p1b_1_o2": "Перед первым T матрицы: аналог не спаривается с T", "p1b_1_o3": "Нигде: аналог встраивается, и цепь растёт дальше", "p1b_1_e": "Основание аналога комплементарно T, поэтому аналог встаёт напротив первого T матрицы за затравкой. Но следующий нуклеотид присоединяется к 3′-OH, а у аналога его нет, — и цепь обрывается. Длина продукта — 5 нуклеотидов, считая затравку.", "p1b_1_w2": "У аналога то же основание, что у dATP, — аденин, он спаривается с T. Отличие — в сахаре: нет 3′-OH, к которому присоединяется следующий нуклеотид.", "p1b_1_w3": "Цепь удлиняется только с 3′-OH последнего нуклеотида; включив нуклеотид без 3′-OH, полимераза не может присоединить следующий.", "p1b_2_q": "Условия те же, но в смеси нет dGTP; остальные три dNTP есть. Где остановится синтез, если в модели полимераза присоединяет только комплементарный нуклеотид?", "p1b_2_o1": "Перед первым C матрицы за затравкой", "p1b_2_o2": "Перед первым G матрицы", "p1b_2_o3": "Нигде: напротив C встанет другой нуклеотид, и синтез продолжится", "p1b_2_e": "G комплементарен C, поэтому dGTP нужен напротив C матрицы. Первый C за затравкой стоит в 7-м положении: продукт достигнет длины 6 нуклеотидов, считая затравку из 3, а седьмой нуклеотид не присоединится. Комплементарность здесь задаёт, где продукт обрывается.", "p1b_2_w2": "Напротив G матрицы ставится C, а dCTP в смеси есть. Не хватает G, а G нужен напротив C.", "p1b_2_w3": "В этой модели полимераза присоединяет только комплементарный нуклеотид. Включение неверного нуклеотида — редкая ошибка, а не обычный путь синтеза; её исправление — тема семинара 8.", "p1b_3_q": "Новая цепь, синтезированная на цепи 1, стала матрицей — это цепь 2 исходной молекулы. Какой окажется цепь, синтезированная на ней?", "p1b_3_o1": "Такой же, как цепь 1", "p1b_3_o2": "Такой же, как цепь 2", "p1b_3_o3": "Новой последовательностью: каждое копирование меняет порядок нуклеотидов", "p1b_3_e": "Цепь 2 комплементарна цепи 1, поэтому цепь, построенная по цепи 2, повторяет цепь 1 (5′-AGCTACGTGCAT-3′). Так каждая цепь служит матрицей для другой, и последовательность воспроизводится при каждом копировании.", "p1b_3_w2": "Копия комплементарна матрице, а не совпадает с ней: на цепи 2 строится цепь, совпадающая с цепью 1.", "p1b_3_w3": "Порядок нуклеотидов новой цепи задан матрицей правилами спаривания A–T и G–C; без ошибок копирование не меняет последовательность.", "p1b_4_q": "Затравку той же последовательности уложили параллельно матрице: её 3′-конец стоит напротив 3′-конца матрицы. Начнётся ли синтез?", "p1b_4_o1": "Нет: цепи двойной спирали антипараллельны, такая затравка не спарится с матрицей", "p1b_4_o2": "Да: основания затравки те же, ориентация значения не имеет", "p1b_4_o3": "Да, но новая цепь будет расти в направлении 3′→5′", "p1b_4_e": "Комплементарные пары образуются, только когда цепи антипараллельны: напротив 5′-конца одной цепи — 3′-конец другой. У параллельной затравки нет спаренного с матрицей 3′-OH, и полимеразе не к чему присоединять нуклеотиды.", "p1b_4_w2": "Ориентация важна: правильность комплементарной цепи проверяют по двум признакам — по парам оснований и по концам 5′ и 3′.", "p1b_4_w3": "ДНК-полимераза присоединяет нуклеотиды только к 3′-OH, поэтому любая новая цепь растёт 5′→3′; синтеза в направлении 3′→5′ нет.", "st_head_nt": "схема строения нуклеотида · не химическая формула", "st_head_chain": "схема участка цепи из двух нуклеотидов · не химическая формула", "st_head_helix": "схема двойной спирали · пропорции условные", "st_base": "азотистое основание (здесь — аденин)", "st_sugar": "дезоксирибоза: атомы углерода 1′–5′", "st_phos": "фосфатная группа (P)", "st_nt_note": "Основание присоединено к 1′-углероду, фосфат — к 5′-углероду; у 3′-углерода — группа OH.", "st_bond1": "фосфодиэфирная связь:", "st_bond2": "3′-C — P — 5′-C", "st_end5": "5′-конец (у 5′-углерода — фосфат)", "st_end3": "3′-конец (свободная группа 3′-OH)", "st_helix_bb": "линии — сахаро-фосфатные остовы двух цепей", "st_helix_pairs": "поперечные отрезки — пары оснований A–T и G–C внутри спирали", "st_helix_anti": "цепи антипараллельны: напротив 5′-конца одной — 3′-конец другой", "st_foot": "Условная схема: размеры и углы не в масштабе; атомы водорода не показаны.", "st_foot_helix": "Условная схема: размеры, углы и число пар на виток не в масштабе.", "s2_ori": "Точки начала на участке", "s2_ori_1": "одна", "s2_ori_3": "три", "s2_fork": "Вилок от точки начала", "s2_fork_2": "две", "s2_fork_1": "одна (мысленный эксперимент)", "s2_t": "Время (условные шаги)", "s2_t_0": "до начала", "s2_t_1": "1", "s2_t_2": "2", "s2_t_3": "3", "s2_lbl_seg": "участок хромосомной ДНК; длина и время условные", "s2_lbl_ori": "точка начала репликации", "s2_lbl_fork": "вилка", "s2_lbl_replicons": "репликоны: участки, копируемые от одной точки начала", "s2_lbl_onefork": "одна вилка: ДНК по другую сторону от точки начала не копируется", "s2_lbl_onefork3": "по одной вилке от каждой точки начала: участок левее первой точки начала не копируется", "s2_lbl_daughters": "дочерние молекулы скопированного участка:", "s2_lbl_semi": "в каждой — одна старая (тёмная) и одна новая (светлая) цепь", "s2_r_forks": "Работающих вилок", "s2_v_forks": "{n}", "s2_r_copied": "Скопировано", "s2_r_copied_s": "доля участка; условные единицы", "s2_v_pct": "{n} %", "s2_r_met": "Встречи вилок соседних точек начала", "s2_v_met": "{n}", "s2_v_nomet": "нет", "s2_r_daughter": "Дочерняя молекула", "s2_v_semi": "старая + новая цепь", "s2_v_none": "ещё нет", "s2_cap_0": "До начала репликации участок — родительская двойная спираль. Репликация начнётся в точке начала (ориджине): здесь собираются белки инициации и расплетают ДНК.", "s2_cap_0_z": "Репликация начинается не в любом месте, а в точках начала; у эукариот их узнаёт комплекс узнавания точки начала (ORC).", "s2_cap_1": "От точки начала в противоположные стороны расходятся две репликационные вилки; между ними — пузырёк репликации. Внутри пузырька каждая старая цепь уже спарена с новой; снаружи — родительская двойная спираль. Скопировано {n} % участка.", "s2_cap_1_z": "Матрицей служит каждая из двух цепей, поэтому каждая дочерняя молекула получает одну старую и одну новую цепь: так строение двойной спирали предсказывает полуконсервативность.", "s2_cap_1done": "Две вилки прошли весь участок: получились две дочерние молекулы, в каждой — одна старая и одна новая цепь.", "s2_cap_1done_z": "Две вилки от одной точки начала одновременно копируют ДНК по обе стороны от неё; каждая проходит только свою часть участка.", "s2_cap_one": "Мысленный эксперимент: от точки начала идёт только одна вилка. Скопировано {n} %: участок по другую сторону от точки начала в этой модели не копируется.", "s2_cap_one_z": "Две вилки, расходящиеся в обе стороны, копируют ДНК по обе стороны от точки начала; одна вилка копирует только одну сторону.", "s2_cap_3": "Три точки начала, от каждой — две вилки. Скопировано {n} % участка.", "s2_cap_3_z": "Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.", "s2_cap_3done": "Вилки соседних точек начала встретились, пузырьки слились, и весь участок скопирован за один шаг — втрое быстрее, чем от одной точки начала.", "s2_cap_3done_z": "Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.", "s2b_take": "Каждая цепь служит матрицей, поэтому дочерние молекулы полуконсервативны: в каждой одна старая и одна новая цепь. Репликация начинается в точках начала; от каждой расходятся две вилки, и участок от одной точки начала — репликон. В этой модели одна вилка с прежней скоростью копирует только одну сторону от точки начала, а другая сторона остаётся нескопированной; несколько точек начала сокращают время копирования; длины и время на схеме условные.", "p2b_1_q": "Условия: участок хромосомной ДНК с одной точкой начала; вилки только что разошлись. Какой состав будет у каждой из двух двойных спиралей внутри пузырька?", "p2b_1_o1": "Одна старая и одна новая цепь в каждой", "p2b_1_o2": "Одна спираль из двух старых цепей, другая — из двух новых", "p2b_1_o3": "Обе цепи каждой спирали — смесь старых и новых участков", "p2b_1_e": "Вилка разделяет две старые цепи, и к каждой достраивается новая по правилам комплементарности. Поэтому каждая двойная спираль в пузырьке — старая цепь плюс новая: строение молекулы предсказывает полуконсервативный механизм, а какой из возможных механизмов верен, различает эксперимент.", "p2b_1_w2": "Старые цепи в вилке расходятся, и ни одна не остаётся без пары: новая цепь строится напротив каждой старой, а не две новые вместе.", "p2b_1_w3": "Каждая старая цепь копируется целиком как матрица и в дочерней молекуле остаётся непрерывной; новая цепь строится заново напротив неё.", "p2b_2_q": "Мысленный эксперимент: представьте, что от точки начала уходит только одна вилка, а не две. Что изменится для участка за то же время?", "p2b_2_o1": "ДНК по другую сторону от точки начала не скопируется, а на свою половину вилке нужно столько же времени", "p2b_2_o2": "Ничего: одна вилка движется вдвое быстрее и успевает скопировать весь участок", "p2b_2_o3": "Дочерние молекулы станут консервативными", "p2b_2_e": "Две вилки копируют ДНК по обе стороны от точки начала одновременно. Если вилка одна, её скорость прежняя: за то же время она скопирует одну сторону от точки начала, а другая сторона в этой модели останется нескопированной. В этой модели скорость вилки от числа вилок не зависит.", "p2b_2_w2": "Скорость вилки в модели постоянна и от числа вилок не зависит; одна вилка проходит тот же путь за то же время.", "p2b_2_w3": "Состав дочерних молекул от числа вилок не зависит: матрицей по-прежнему служит каждая старая цепь, поэтому молекулы остаются полуконсервативными.", "p2b_3_q": "На том же участке три точки начала, от каждой расходятся две вилки. Что произойдёт, когда вилки соседних точек начала встретятся?", "p2b_3_o1": "Пузырьки сольются, и скопированные участки станут одной непрерывной дочерней молекулой", "p2b_3_o2": "Вилки пройдут друг сквозь друга и скопируют участок повторно", "p2b_3_o3": "Между репликонами останутся несоединённые молекулы ДНК", "p2b_3_e": "Встречные вилки завершают копирование своих репликонов, пузырьки сливаются, и новые цепи соседних репликонов соединяются в непрерывные цепи дочерних молекул. Каждый участок копируется один раз.", "p2b_3_w2": "Скопированный участок повторно не копируется: каждая точка начала используется не более одного раза за S-фазу, а встретившиеся вилки завершают синтез.", "p2b_3_w3": "Все репликоны — части одной молекулы ДНК; после встречи вилок новые цепи соседних репликонов соединяются, и дочерние молекулы непрерывны.", "s3_side": "Вилка", "s3_side_r": "правая (движется вправо)", "s3_side_l": "левая (движется влево)", "s3_step": "Ход вилки (условные шаги)", "s3_step_1": "1", "s3_step_2": "2", "s3_step_3": "3", "s3_mat": "Отстающая цепь", "s3_mat_syn": "синтез фрагментов", "s3_mat_rem": "затравки удалены", "s3_mat_fill": "бреши заполнены", "s3_mat_lig": "фрагменты сшиты", "s3_lbl_head": "репликационная вилка; длины фрагментов и шаги условные", "s3_lbl_s1": "цепь 1", "s3_lbl_s2": "цепь 2", "s3_lbl_move": "движение вилки", "s3_lbl_lead": "ведущая цепь — непрерывно, к вилке", "s3_lbl_lag": "отстающая цепь — фрагментами, от вилки", "s3_lbl_mat_syn": "у каждого фрагмента — своя РНК-затравка на 5′-конце", "s3_lbl_mat_rem": "затравки удалены нуклеазами: на их месте бреши", "s3_lbl_mat_fill": "бреши заполнены ДНК; между фрагментами остались разрывы", "s3_lbl_mat_lig": "лигаза сшила разрывы: отстающая цепь непрерывна", "s3_lbl_status": "схема качественная; фрагменты на схеме короче и меньше их числа в клетке", "s3_r_lead": "Ведущая цепь строится на", "s3_r_lag": "Отстающая цепь строится на", "s3_v_on": "цепи {m}", "s3_r_frag": "Отдельных фрагментов Оказаки", "s3_r_frag_s": "на схеме; число условное", "s3_v_n": "{n}", "s3_r_rna": "РНК-затравок на отстающей цепи", "s3_r_nick": "Между фрагментами", "s3_r_nick_s": "брешь — не хватает нуклеотидов; разрыв — не хватает одной связи", "s3_v_frags": "фрагменты с затравками", "s3_v_gaps": "бреши: {n}", "s3_v_nicks": "разрывы: {n}", "s3_v_cont": "цепь непрерывна", "s3_cap_syn": "Вилка: {side}. Новая цепь растёт только 5′→3′, а матрицы антипараллельны. На цепи {l} рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно. На цепи {m} рост направлен против хода вилки: каждый фрагмент начинается с новой РНК-затравки у вилки и растёт к предыдущему.", "s3_cap_syn_z": "Асимметрия неизбежна: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′, а не из особенностей какого-то организма.", "s3_cap_rem": "Созревание отстающей цепи начинается с удаления затравок: нуклеазы удаляют РНК-затравки фрагментов; на их месте остаются бреши. У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего в лоскут, его срезает флэп-эндонуклеаза FEN1, и сразу остаётся разрыв.", "s3_cap_rem_z": "РНК не может оставаться в ДНК: затравки удаляются, а их место заполняется ДНК.", "s3_cap_fill": "Затем ДНК-полимераза заполнила бреши, наращивая 3′-конец соседнего фрагмента. Все нуклеотиды на месте, но между фрагментами не хватает одной фосфодиэфирной связи — разрывы.", "s3_cap_fill_z": "Последнюю связь между соседними фрагментами полимераза образовать не может; это делает ДНК-лигаза.", "s3_cap_lig": "В конце ДНК-лигаза соединила 3′-OH одного фрагмента с 5′-фосфатом соседнего; у эукариот она использует энергию АТФ. Отстающая цепь стала непрерывной.", "s3_cap_lig_z": "Удалить РНК, достроить ДНК и сшить остов — три этапа созревания фрагментов Оказаки.", "s3b_take": "Одна новая цепь строится непрерывно, а другая — фрагментами, потому что цепи матрицы антипараллельны, а ДНК-полимераза наращивает цепь только 5′→3′. Какая цепь ведущая, зависит от направления движения вилки: у двух вилок одной точки начала одна и та же матрица служит ведущей у одной вилки и отстающей у другой. Фрагменты Оказаки созревают в три этапа: удаление РНК-затравок, достройка ДНК, сшивание лигазой. Схема — учебная модель; длины и число фрагментов условные.", "p3b_1_q": "У правой вилки новая цепь на цепи 2 строится фрагментами. Какой будет новая цепь на той же цепи 2 у левой вилки, которая отходит от той же точки начала в другую сторону?", "p3b_1_o1": "Непрерывной — ведущей", "p3b_1_o2": "Тоже фрагментами: цепь 2 всегда отстающая", "p3b_1_o3": "Цепь 2 у левой вилки не копируется", "p3b_1_e": "Направление роста новой цепи на цепи 2 то же (5′→3′), но левая вилка движется в обратную сторону. Поэтому у левой вилки рост совпадает с ходом вилки, и новая цепь на цепи 2 — ведущая. В пузырьке каждая матрица служит ведущей у одной вилки и отстающей у другой.", "p3b_1_w2": "«Ведущая» и «отстающая» — свойства новой цепи относительно хода вилки, а не самой матрицы: у вилки, идущей в другую сторону, роли меняются.", "p3b_1_w3": "Каждая вилка копирует обе матрицы; от точки начала обе цепи копируются в обе стороны.", "p3b_2_q": "Вилка продвинулась ещё на один шаг. Что происходит на отстающей стороне?", "p3b_2_o1": "У вилки синтезируется новая РНК-затравка и начинается новый фрагмент", "p3b_2_o2": "Последний фрагмент удлиняется вслед за вилкой", "p3b_2_o3": "Ничего: отстающая цепь достраивается только после окончания репликации", "p3b_2_e": "Освободившийся у вилки участок матрицы можно копировать только в направлении от вилки, а полимераза не начинает цепь без затравки. Поэтому каждый новый фрагмент начинается с новой затравки; полимераза переходит на новый зажим, который надевает погрузчик.", "p3b_2_w2": "Фрагмент растёт 5′→3′ — от вилки к предыдущему фрагменту; удлиниться в сторону вилки он не может.", "p3b_2_w3": "Отстающая цепь синтезируется одновременно с ведущей, просто короткими фрагментами по мере расхождения матриц.", "p3b_3_q": "РНК-затравки удалены, бреши заполнены ДНК. Чего ещё не хватает отстающей цепи?", "p3b_3_o1": "Одной фосфодиэфирной связи между соседними фрагментами", "p3b_3_o2": "Нескольких нуклеотидов на месте каждой затравки", "p3b_3_o3": "Ничего: цепь уже непрерывна", "p3b_3_e": "После заполнения бреши все нуклеотиды на месте, но последняя связь между фрагментами не образована — это разрыв. Его сшивает ДНК-лигаза.", "p3b_3_w2": "Бреши уже заполнены ДНК-полимеразой; нуклеотидов не хватает в бреши, а здесь — разрыв.", "p3b_3_w3": "Полимераза не образует последнюю связь между соседними фрагментами; пока лигаза не сработала, цепь прерывается разрывами.", "rfc_head": "схема загрузки зажима · по учебнику · условная", "rfc_lbl_3end": "3′-конец новой цепи", "rfc_lbl_rfc": "погрузчик зажима (RFC)", "rfc_lbl_open": "раскрытое кольцо зажима (PCNA)", "rfc_lbl_atp": "расходует АТФ", "rfc_lbl_load": "кольцо надевается на дуплекс у 3′-конца", "rfc_lbl_closed": "кольцо замкнуто вокруг ДНК", "rfc_lbl_left": "погрузчик ушёл", "rfc_cap_open": "1. Погрузчик связывает зажим и раскрывает кольцо.", "rfc_cap_load": "2. Раскрытое кольцо надевается на ДНК там, где затравка спарена с матрицей.", "rfc_cap_closed": "3. Кольцо замыкается, погрузчик уходит; полимераза δ связывается с зажимом.", "rfc_foot": "Условная схема: форма и размер белков не в масштабе.", "s4_off": "Какой компонент убран", "s4_off_none": "ничего (полный набор)", "s4_off_ssb": "белки SSB", "s4_off_rfc": "погрузчик зажима", "s4_off_nuc": "нуклеазы удаления затравок", "s4_lbl_head": "реплисома у правой вилки; длины условные", "s4_lbl_gap": "бреши", "s4_lbl_hp": "шпильки в одноцепочечной матрице", "s4_lbl_off_none": "полный набор: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются", "s4_lbl_off_ssb": "без SSB: на матрице отстающей цепи шпильки, новый фрагмент не начат", "s4_lbl_off_rfc": "без погрузчика зажима: зажим не надет, полимеразы синтезируют короткие отрезки", "s4_lbl_off_nuc": "без нуклеаз: РНК-затравки остаются, фрагменты не сшиты", "s4_lbl_off_q": "какой компонент убран? — определите по продукту", "s4_lbl_status": "учебная модель: исход отсутствия одного компонента", "s4_r_lead": "Ведущая цепь", "s4_v_lead_ok": "растёт непрерывно вслед за вилкой", "s4_v_lead_slow": "отстаёт от вилки: полимераза часто отходит от матрицы", "s4_r_lag": "Отстающая цепь", "s4_v_lag_mature": "фрагменты созревают и сшиваются", "s4_v_lag_blocked": "новый фрагмент не синтезируется", "s4_v_lag_short": "короткие отрезки, между ними бреши", "s4_v_lag_primers": "фрагменты полной длины с РНК-затравками, не сшиты", "s4_r_ss": "Одноцепочечная матрица у вилки", "s4_r_ss_s": "участок, ещё не скопированный", "s4_v_ss_short": "покрыта SSB, выпрямлена", "s4_v_ss_hairpin": "образует шпильки", "s4_cap_none": "Полный набор. Хеликаза расплетает ДНК, топоизомераза впереди вилки снимает напряжение, SSB покрывают одноцепочечную матрицу. Ведущая цепь растёт непрерывно; на отстающей праймаза синтезирует затравки, полимераза δ с зажимом удлиняет фрагмент, нуклеазы удаляют затравки, лигаза сшивает фрагменты.", "s4_cap_none_z": "У каждого белка вилки своя операция; если одного не хватает, вилка оставляет характерный промежуточный продукт — по нему и определяют, чего не хватает.", "s4_cap_ssb": "Без SSB одноцепочечная матрица отстающей цепи не выпрямлена: случайно комплементарные короткие участки спариваются и образуют шпильки. Шпильки мешают ДНК-полимеразе, и новый фрагмент Оказаки не синтезируется.", "s4_cap_ssb_z": "SSB не синтезируют и не расплетают ДНК: они кооперативно связываются с одноцепочечной ДНК, которую образовала хеликаза, и держат её в форме, удобной для полимеразы.", "s4_cap_rfc": "Без погрузчика зажим не надевается на ДНК. Полимераза без зажима синтезирует лишь короткий отрезок и отходит от матрицы: ведущая цепь отстаёт от вилки, фрагменты отстающей цепи короткие и не доходят до предыдущих — между ними бреши.", "s4_cap_rfc_z": "Зажим не синтезирует ДНК; он удерживает полимеразу на матрице, а надевает его погрузчик с затратой АТФ.", "s4_cap_nuc": "Без нуклеаз удаления затравок фрагменты Оказаки синтезированы полностью: каждый доходит до РНК-затравки на 5′-конце предыдущего. Но затравка остаётся в цепи. При нормальном созревании РНК-затравку удаляют, её место заполняют ДНК, и только затем лигаза сшивает разрыв между двумя участками ДНК; здесь фрагменты остаются несшитыми.", "s4_cap_nuc_z": "Лигаза в норме сшивает разрыв между 3′-OH одного участка ДНК и 5′-фосфатом соседнего; РНК-затравку перед этим удаляют, а её место заполняют ДНК.", "s4b_take": "Каждый компонент вилки выполняет свою операцию, и без него остаётся свой промежуточный продукт: без SSB — шпильки на одноцепочечной матрице и задержка синтеза отстающей цепи; без погрузчика зажима — короткие отрезки и бреши; без нуклеаз — фрагменты с РНК-затравками, которые не сшиваются. Это учебная модель: показан исход отсутствия одного компонента, числа и длины условные.", "p4b_1_q": "Из полного набора убрали погрузчик зажима; остальные белки на месте. Какой продукт окажется на отстающей цепи?", "p4b_1_o1": "Короткие отрезки ДНК с брешами между ними", "p4b_1_o2": "Фрагменты полной длины с РНК-затравками", "p4b_1_o3": "Ничего не изменится: зажим надевается сам", "p4b_1_e": "Без погрузчика зажим не надевается на ДНК. Полимераза без зажима синтезирует лишь короткий отрезок и отходит от матрицы, поэтому фрагменты не доходят до предыдущих — между ними бреши. Ведущая цепь тоже отстаёт от вилки.", "p4b_1_w2": "Фрагменты полной длины с затравками остаются без нуклеаз удаления затравок; затравки здесь удаляются.", "p4b_1_w3": "Зажим — замкнутое кольцо вокруг ДНК; раскрыть его и надеть на ДНК может только погрузчик с затратой АТФ.", "p4b_2_q": "На схеме — отстающая цепь из фрагментов полной длины; на 5′-конце каждого фрагмента осталась РНК, фрагменты не сшиты. Какой компонент убран?", "p4b_2_o1": "Нуклеазы удаления затравок", "p4b_2_o2": "Погрузчик зажима", "p4b_2_o3": "Белки SSB", "p4b_2_e": "Фрагменты синтезированы полностью — значит, полимераза с зажимом работала. Но на 5′-концах осталась РНК: её не удалили нуклеазы. Каждый фрагмент упирается в РНК-затравку предыдущего: пока затравки не удалены и их место не заполнено ДНК, фрагменты не сшиваются.", "p4b_2_w2": "Без погрузчика зажима фрагменты получаются короткими, с брешами; здесь фрагменты полной длины.", "p4b_2_w3": "Без SSB на матрице образуются шпильки и задерживается синтез; затравки при этом удалялись бы как обычно.", "p4b_3_q": "Из полного набора убрали белки SSB. Что произойдёт с одноцепочечной матрицей отстающей цепи у вилки?", "p4b_3_o1": "Образуются шпильки, которые мешают полимеразе синтезировать новый фрагмент", "p4b_3_o2": "Хеликаза перестанет расплетать ДНК", "p4b_3_o3": "Ничего: SSB нужны только ведущей цепи", "p4b_3_e": "SSB кооперативно связываются с одноцепочечной ДНК и выпрямляют её. Без них случайно комплементарные короткие участки спариваются и образуют шпильки; такие участки особенно часты на матрице отстающей цепи и мешают ДНК-полимеразе.", "p4b_3_w2": "Расплетает ДНК хеликаза; SSB связываются с уже расплетённой одноцепочечной ДНК.", "p4b_3_w3": "Одноцепочечная матрица дольше всего остаётся у отстающей цепи — там SSB особенно нужны.", "hint_btn": "Подсказка {i} из {n}", "hint_n": "Подсказка {i}.", "tl_back": "◀ Шаг", "tl_fwd": "Шаг ▶", "tl_reset": "Сначала", "s1a_av": "Запас dNTP", "s1a_av_all": "все четыре в достатке", "s1a_av_absent": "одного нет", "s1a_av_low": "одного мало", "s1a_x": "Какого dNTP", "s1a_x_A": "dATP", "s1a_x_T": "dTTP", "s1a_x_G": "dGTP", "s1a_x_C": "dCTP", "s1a_xnote": "Все четыре dNTP в достатке — выбирать недостающий нечего.", "s1a_rest": "Отсутствовавший dNTP снова добавлен", "s1a_rest_no": "нет", "s1a_rest_yes": "да", "s1a_rnote": "Восстанавливать нечего: этот переключатель работает, когда одного dNTP нет.", "s1a_lbl_head": "учебная схема · полимераза исправна · запас dNTP показан качественно", "s1a_lbl_primer": "затравка (3 нуклеотида)", "s1a_lbl_pol": "ДНК-полимераза", "s1a_lbl_need": "нужен {N}", "s1a_lbl_paused": "здесь синтез был остановлен", "s1a_lbl_slow": "жёлтая рамка — позиции, где нужен dNTP, которого мало", "s1a_lbl_pool": "Запас dNTP в среде (уровень качественный, не концентрация)", "s1a_lbl_foot": "Скорость синтеза и длительность ожидания модель не рассчитывает.", "s1a_r_pos": "Положение полимеразы", "s1a_r_pos_s": "длина цепи вместе с затравкой", "s1a_v_pos": "{n} из 12 нуклеотидов", "s1a_r_next": "Следующий нужный нуклеотид", "s1a_v_next": "{L} — {N}", "s1a_v_next_none": "нет: цепь достроена до конца матрицы", "s1a_r_len": "Присоединено после затравки", "s1a_r_len_s": "из 9 возможных", "s1a_v_len": "{k} из 9", "s1a_r_state": "Синтез в этой модели", "s1a_v_done": "дошёл до конца матрицы", "s1a_v_stop": "остановлен: нужного dNTP нет", "s1a_v_stop_m": "остановлен", "s1a_v_resumed": "продолжился и дошёл до конца", "s1a_v_slow": "дошёл до конца; задержки возможны", "s1a_cap_done": "Все четыре dNTP в достатке: полимераза присоединяет нуклеотид за нуклеотидом к 3′-OH и доходит до конца матрицы — добавлено 9 нуклеотидов.", "s1a_cap_done_z": "Это исходное состояние: фермент исправен, матрица и затравка на месте, субстрат есть.", "s1a_cap_stop": "Нет {N}: синтез остановился перед позицией {p} — напротив этого основания матрицы встаёт только нуклеотид, который присоединяется из {N}. 3′-OH последнего нуклеотида цепи сохранён.", "s1a_cap_stop_z": "Фермент исправен, но для продолжения нужен конкретный субстрат; место остановки задаёт последовательность матрицы.", "s1a_cap_resumed": "{N} снова в среде: синтез продолжился от того же 3′-OH, на котором остановился перед позицией {q}, и дошёл до конца матрицы.", "s1a_cap_resumed_z": "Нехватка субстрата в этой модели обратима — в отличие от обрыва цепи аналогом без 3′-OH.", "s1a_cap_slow": "{N} мало, но он есть: в этой модели цепь достраивается до конца; на позициях, где нужен {N}, возможна задержка.", "s1a_cap_slow_z": "Снижение запаса не равно отсутствию: насколько замедлится синтез, зависит от кинетики реакции, и модель этого не рассчитывает.", "s1a_cap_mask": "Наблюдение: синтез остановился. Какой запас dNTP был в среде, пока не показано.", "s1a_cap_mask_z": "Определите по матрице, какие варианты запаса совместимы с этим наблюдением.", "s1a_tl_note": "Порядок этапов — учебная модель; время шкалы условное, скорость синтеза модель не рассчитывает.", "s1a_tl_1": "Затравка спарена с матрицей; её 3′-OH доступен полимеразе.", "s1a_tl_2": "Полимераза присоединяет к 3′-OH dNTP, комплементарный основанию матрицы.", "s1a_tl_3": "Цепь растёт 5′→3′, пока в среде есть нужный dNTP.", "s1a_tl_done": "Все четыре dNTP есть: цепь достроена до конца матрицы.", "s1a_tl_stop": "Нужного dNTP нет: полимераза стоит перед этой позицией, 3′-OH цепи сохранён.", "s1a_tl_res": "dNTP вернули: синтез продолжается с того же 3′-OH.", "s1a_tl_low": "dNTP мало: цепь достраивается, но на позициях, где он нужен, возможна задержка.", "s1a_take": "Исправный фермент — необходимое, но не достаточное условие синтеза: нужен и субстрат. Без одного dNTP цепь в модели останавливается на первой позиции, где он нужен, и это место задаёт матрица. Если субстрат вернуть, синтез продолжается от того же 3′-OH; аналог без 3′-OH, напротив, обрывает цепь. Снижение запаса означает лишь возможное замедление, а не мгновенную остановку. Ошибки при копировании — тема следующего семинара.", "p1a_1_q": "Условия: матрица из 12 нуклеотидов, спаренная с ней затравка из 3 нуклеотидов, исправная ДНК-полимераза; все четыре dNTP в достатке. Дойдёт ли синтез до конца матрицы?", "p1a_1_o1": "Да: полимераза присоединит все 9 недостающих нуклеотидов", "p1a_1_o2": "Нет: без отдельного источника энергии синтез прекратится через несколько нуклеотидов", "p1a_1_o3": "Да, но новая цепь повторит последовательность матрицы", "p1a_1_w2": "Энергия для каждой связи заключена в самом dNTP: при присоединении отщепляется пирофосфат. Отдельный источник энергии полимеразе не нужен.", "p1a_1_w3": "Новая цепь комплементарна матрице, а не повторяет её: напротив T встаёт A, напротив C — G.", "p1a_1_e": "Все необходимые условия выполнены: матрица, затравка с 3′-OH, исправный фермент и все четыре субстрата. Это контроль для следующих шагов: дальше меняется только запас dNTP.", "p1a_1_h1": "Перечислите, что нужно ДНК-полимеразе, и проверьте каждое условие на схеме.", "p1a_1_h2": "Энергия для связи — в трифосфате самого нуклеотида.", "p1a_2_q": "Те же условия, но из среды убрали dGTP; dATP, dTTP и dCTP в достатке, полимераза исправна. Новая цепь растёт так: A T G | C A C G T A G C T (до черты — затравка). На какой позиции остановится синтез?", "p1a_2_o1": "Перед позицией 7 — первым местом после затравки, где нужен G", "p1a_2_o2": "Сразу после затравки: без одного из четырёх dNTP полимераза не начинает синтез", "p1a_2_o3": "Синтез дойдёт до конца: напротив C встанет другой нуклеотид", "p1a_2_w2": "Полимераза присоединяет те нуклеотиды, которые есть: на позициях 4–6 нужны C, A и C — они в среде, поэтому цепь удлиняется до позиции 7.", "p1a_2_w3": "В этой модели напротив C встаёт только G; встраивание неправильного нуклеотида и его исправление — тема семинара 8. Здесь изучается только ограничение субстратом.", "p1a_2_e": "Синтез идёт, пока есть нужный субстрат. Первое после затравки место, где матрица требует G, — позиция 7; перед ней полимераза и останавливается. 3′-OH шестого нуклеотида не повреждён — недостаёт только субстрата.", "p1a_2_h1": "Найдите в строке новой цепи первую букву G после черты.", "p1a_2_h2": "Может ли другой dNTP заменить dGTP без ошибки? В этой модели — нет.", "p1a_2_h3": "C, A, C присоединяются; на седьмой позиции нужен G — его нет.", "p1a_3_q": "Теперь dGTP есть, а dTTP нет; остальное не изменилось. Где остановится синтез?", "p1a_3_o1": "Перед позицией 8: это первое место после затравки, где нужен T", "p1a_3_o2": "Там же, перед позицией 7: место остановки не зависит от того, какого dNTP нет", "p1a_3_o3": "Перед позицией 4: без любого из dNTP синтез останавливается на первом же шаге", "p1a_3_w2": "Место остановки задаёт матрица: синтез останавливается там, где нужен именно отсутствующий нуклеотид. Для T это позиция 8, а не 7.", "p1a_3_w3": "На позиции 4 нужен C — он есть. Синтез останавливается только там, где требуется отсутствующий dNTP.", "p1a_3_e": "При отсутствии dTTP цепь удлиняется до позиции 7 включительно и останавливается перед позицией 8. Сравнение двух шагов показывает: положение остановки определяется последовательностью матрицы, а не произвольной «длиной задержки».", "p1a_3_h1": "Найдите первую букву T после черты в строке A T G | C A C G T A G C T.", "p1a_4_q": "Синтез остановился перед позицией 7, потому что не было dGTP. В среду снова добавили dGTP; полимераза, матрица и остальные dNTP те же. Что произойдёт?", "p1a_4_o1": "Синтез продолжится от того же 3′-OH и дойдёт до конца матрицы", "p1a_4_o2": "Цепь больше не удлинится: остановка из-за нехватки субстрата необратима, как обрыв аналогом без 3′-OH", "p1a_4_o3": "Начнётся новая цепь с новой затравки, а остановившаяся останется короткой", "p1a_4_w2": "Аналог без 3′-OH обрывает цепь, потому что у последнего нуклеотида нет группы для следующей связи. Здесь последний нуклеотид обычный, его 3′-OH цел — не хватало только dGTP.", "p1a_4_w3": "Новая затравка не нужна: у остановившейся цепи уже есть свободный 3′-OH, к которому присоединится G.", "p1a_4_e": "В этой идеализированной модели нехватка субстрата обратима: когда dGTP вернули, полимераза присоединяет G к тому же 3′-OH и достраивает цепь. Чем отличаются две причины остановки: при нехватке dNTP 3′-OH сохраняется, при встраивании аналога без 3′-OH — нет.", "p1a_4_h1": "Есть ли 3′-OH у последнего встроенного нуклеотида?", "p1a_5_q": "dCTP в среде мало, но он есть; остальные dNTP в достатке. Что предсказывает модель?", "p1a_5_o1": "Цепь дойдёт до конца, но на позициях, где нужен C, возможна задержка", "p1a_5_o2": "Синтез остановится перед позицией 4, как при полном отсутствии dCTP", "p1a_5_o3": "Синтез замедлится ровно во столько раз, во сколько уменьшился запас dCTP", "p1a_5_w2": "Мало — не то же, что нет: пока dCTP поступает к полимеразе, цепь удлиняется. Полную остановку модель предсказывает только при отсутствии нуклеотида.", "p1a_5_w3": "В модели такой зависимости нет: связь скорости с количеством субстрата определяется кинетикой реакции и не обязательно пропорциональна.", "p1a_5_e": "Насколько замедлится синтез, модель не рассчитывает: это определяет кинетика реакции. Снижение запаса одного dNTP делает места, где он нужен, возможными точками задержки. В клетках при недостатке dNTP вилки замедляются, а промежуточная нехватка сильнее сказывается на отдельных, трудно копируемых участках генома, чем на всём геноме сразу.", "p1a_5_h1": "Чем «мало» отличается от «нет»?", "p1a_6_q": "Наблюдение: синтез остановился перед позицией 7, где нужен G (схема). Полимераза исправна, затравка на месте, аналогов нуклеотидов в среде нет. Какой запас dNTP мог быть в среде?", "p1a_6_o1": "dGTP не было; dCTP и dATP были; о dTTP сказать нельзя", "p1a_6_o2": "Не было dGTP, а все остальные dNTP точно были", "p1a_6_o3": "Какого-то dNTP не было, но какого — по наблюдению сказать нельзя", "p1a_6_w2": "T впервые нужен на позиции 8 — после места остановки. Если бы dTTP тоже не было, картина до позиции 7 была бы той же.", "p1a_6_w3": "Матрица позволяет сказать больше: перед остановкой встроены C и A, значит, dCTP и dATP были; остановка перед G указывает на отсутствие dGTP.", "p1a_6_e": "Наблюдение однозначно говорит только о dGTP: его нет. dCTP и dATP были — иначе синтез остановился бы раньше. О dTTP (в достатке, мало или нет) сказать нельзя: T нужен только с позиции 8, за местом остановки. Чтобы это выяснить, нужно дополнительное наблюдение: например, добавить dGTP и посмотреть, остановится ли синтез перед позицией 8.", "p1a_6_h1": "Какие нуклеотиды уже встроены после затравки?", "p1a_6_h2": "Нуклеотид, который нужен только после места остановки, на наблюдение не влияет.", "p1a_6_h3": "Позиция 8 (нужен T) лежит за местом остановки: что наблюдение говорит о dTTP?", "s2a_view": "Что показать", "s2a_view_one": "одна клетка", "s2a_view_cells": "разные клетки", "s2a_vnote": "«Разные клетки»: задержек нет — сравниваются только наборы точек, запущенных в начале S-фазы. Остальные переключатели относятся к одной клетке.", "s2a_geom": "Соседняя точка начала Б", "s2a_geom_near": "близко (8 ед.)", "s2a_geom_far": "далеко (16 ед.)", "s2a_stall": "Ход вилок", "s2a_stall_none": "без задержек", "s2a_stall_one": "остановилась вилка от A", "s2a_stall_two": "остановились обе встречные", "s2a_prep": "Точки В (и Г) подготовлены до S-фазы", "s2a_prep_yes": "да", "s2a_prep_no": "нет", "s2a_fire": "Резервная точка у остановленной вилки — в этой клетке", "s2a_fire_yes": "запустилась", "s2a_fire_no": "не запустилась", "s2a_fnote2": "Вилки не останавливались — исход запуска у остановленной вилки здесь не нужен: точки, через которые прошла вилка, в этой S-фазе уже не запустятся.", "s2a_fnote": "Резервные точки не подготовлены до S-фазы — запускать нечего; в S-фазе новые точки начала не подготавливаются.", "s2a_lbl_head": "учебная схема · к концу S-фазы (шаг {T}) · единицы условные", "s2a_lbl_B": "Б", "s2a_lbl_head_g1": "учебная схема · до S-фазы: точки подготовлены, ни одна не запущена", "s2a_lbl_head_t": "учебная схема · шаг {k} из {T} · единицы условные", "s2a_lbl_head_cells": "учебная схема · одни и те же точки в четырёх клетках · S-фаза", "s2a_lbl_head_cells_g1": "учебная схема · одни и те же точки в четырёх клетках · до S-фазы", "s2a_c_g1": "до S-фазы, все клетки", "s2a_c_cell": "S-фаза, клетка {i}", "s2a_c_key1": "▲ — запущена в этой клетке; △ — подготовлена до S-фазы", "s2a_c_key2": "△ пунктиром — в этой клетке не запущена: её скопировала проходящая вилка", "s2a_lbl_foot_cells": "Наборы условные; одинаковая подготовка во всех клетках — упрощение.", "s2a_lbl_stall": "вилка остановилась", "s2a_lbl_out": "за точкой Б — соседний участок", "s2a_lbl_len": "моделируемый участок между A и Б: {L} условных единиц", "s2a_lbl_key1": "▲ — запущенная в этой клетке; △ — подготовленная, не запущенная", "s2a_lbl_key2": "△ пунктиром — скопирована проходящей вилкой; ✕ — не подготовлена", "s2a_lbl_key3": "светло-синие линии — скопированная ДНК; красная рамка — не скопировано", "s2a_lbl_foot": "Учебная модель, не карта хромосомы: места и время запуска заданы её правилами.", "s2a_d_none": "не подготовлена", "s2a_d_wait": "подготовлена, не запущена", "s2a_d_passive": "скопирована проходящей вилкой", "s2a_d_fired": "запущена", "s2a_d_mask": "не показано", "s2a_r_done": "Участок скопирован к концу S-фазы", "s2a_r_done_s": "окно S-фазы в модели — {T} условных шагов", "s2a_v_done": "полностью, к шагу {t}", "s2a_v_gap": "нет: не скопировано {g} из {L} ед.", "s2a_r_close": "Чем закрыт промежуток у остановленной вилки", "s2a_v_close_normal": "задержек нет — вилки встретились", "s2a_v_close_opposite": "встречной вилкой точки Б", "s2a_v_close_reserve": "вилками резервной точки", "s2a_v_close_none": "не закрыт", "s2a_v_close_mask": "не показано", "s2a_r_res": "Точки В и Г", "s2a_r_res_s": "В — отметка 4; Г (отметка 12) — только при дальней точке Б", "s2a_r_lic": "Подготовлено до S-фазы", "s2a_v_lic": "в каждой клетке — A, В, Г, Б", "s2a_r_fired": "Запущено в начале S-фазы", "s2a_r_fired_s": "наборы условные", "s2a_v_fired": "клетка {i}: {list}", "s2a_r_fixed": "Есть ли точка, резервная во всех клетках", "s2a_v_fixed_no": "в этом условном наборе — нет: каждая запущена хотя бы в одной клетке", "s2a_cap_cells": "До S-фазы во всех четырёх клетках подготовлены одни и те же точки. В S-фазе в каждой клетке запустилась только часть из них, и в разных клетках — разная; остальные скопировали проходящие вилки.", "s2a_cap_cells_z": "Подготовка (лицензирование) и запуск — разные события. Резервной точка бывает в конкретной клетке, а не навсегда: какие из подготовленных точек запустятся, во многом случайно; в клетке точки различаются вероятностью запуска.", "s2a_cap_norm": "Вилки от A и Б встретились, участок скопирован к шагу {t}. Резервные точки, через которые прошла вилка, скопированы вместе с участком и в этой S-фазе уже не запустятся.", "s2a_cap_norm_np": "Вилки от A и Б встретились, участок скопирован к шагу {t}. Точки В и Г в этой клетке не были подготовлены, но в обычном ходе они и не понадобились.", "s2a_cap_norm_np_z": "Без задержек участок копируют вилки точек, запущенных в начале S-фазы.", "s2a_cap_norm_z": "Подготовленных точек больше, чем запускается. Какие из них запустятся, а какие останутся резервными, в каждой клетке решается заново (режим «разные клетки»).", "s2a_cap_one_opp": "Вилка от A остановилась, но встречная вилка от Б дошла до неё: участок скопирован к шагу {t}, позже, чем без задержки.", "s2a_cap_one_opp_z": "Отсутствие резерва ещё не означает недокопированный участок: встречная вилка может закрыть промежуток, если успевает.", "s2a_cap_one_res": "Вилка от A остановилась; в этой клетке ближайшая подготовленная точка запустилась и дала две вилки: одна дошла до остановленной, другая встретила вилку от Б. Участок скопирован к шагу {t}.", "s2a_cap_one_res_z": "Резервная точка даёт новые вилки рядом с задержкой, но в клетке её запуск случаен и не обязателен. В этой модели остановленная вилка не возобновляется; в клетке остановленная вилка иногда может продолжить движение.", "s2a_cap_one_fail": "Вилка от A остановилась, резервная точка не запустилась или не была подготовлена, а точка Б далеко: встречная вилка не успевает до конца S-фазы, часть участка остаётся нескопированной.", "s2a_cap_one_fail_z": "Встречной вилки достаточно не всегда: важны расстояние и время.", "s2a_cap_two_fail": "Обе встречные вилки остановились, резерв не сработал: промежуток между ними скопировать некому.", "s2a_cap_two_fail_z": "Новую точку начала в S-фазе подготовить нельзя. Если остановленные вилки не возобновятся, скопировать промежуток в этой S-фазе может только точка, подготовленная заранее.", "s2a_cap_two_res": "Обе встречные вилки остановились; в промежутке запустилась подготовленная точка {res}, её вилки скопировали промежуток к шагу {t}.", "s2a_cap_two_res2": "Обе встречные вилки остановились; в промежутке запустились подготовленные точки {res}, их вилки скопировали промежуток к шагу {t}.", "s2a_cap_two_res_z": "Помощь возможна, только если подготовленная точка лежит в нескопированном промежутке; в клетке это вероятно, но не гарантировано.", "s2a_cap_mask": "Наблюдение к концу S-фазы — на схеме. Состояние резервных точек и переключатели пока не показаны.", "s2a_cap_mask_z": "Сначала решите, какие причины совместимы с наблюдением.", "s2a_tl_note": "Шкала — условные шаги модели, а не минуты; шаг 0 — до S-фазы. Последний этап шкалы совпадает со статичной схемой.", "s2a_tl_step": "Шаг {k} из {m}", "s2a_tl_g1": "До S-фазы точки A, Б и резервные точки подготовлены; ни одна ещё не запущена.", "s2a_tl_g1_no": "До S-фазы подготовлены только A и Б; на месте В (Г) точка не подготовлена.", "s2a_tl_start": "Начало S-фазы: в этой клетке запустились A и Б, от каждой расходятся две вилки.", "s2a_tl_move": "Вилки продолжают движение; новые точки в S-фазе не подготавливаются.", "s2a_tl_stall": "Вилка от A остановилась; участок за ней пока не скопирован (в модели вилка не возобновляется).", "s2a_tl_stall2": "Остановились обе встречные вилки; промежуток между ними не скопирован (в модели вилки не возобновляются).", "s2a_tl_fire": "Подготовленная точка в нескопированном промежутке запустилась и дала две вилки. В клетке это случайное, а не обязательное событие.", "s2a_tl_nofire": "Подготовленная точка в промежутке в этой клетке не запустилась: запуск возможен, но не обязателен.", "s2a_tl_noprep": "Подготовленной точки в промежутке нет, а новые точки в S-фазе не подготавливаются.", "s2a_tl_passive": "Вилка прошла через резервную точку: точка скопирована и в этой S-фазе уже не запустится.", "s2a_tl_done": "Вилки встретились: участок скопирован полностью.", "s2a_tl_after": "Участок уже скопирован; S-фаза продолжается на других участках хромосомы.", "s2a_tl_wait": "К промежутку не идёт ни одна вилка: скопировать его некому.", "s2a_tl_gap": "Конец S-фазы: часть участка осталась нескопированной.", "s2a_tl_c1": "До S-фазы в каждой клетке подготовлены одни и те же точки — A, В, Г и Б.", "s2a_tl_c2": "S-фаза: в каждой клетке запустилась часть подготовленных точек, в разных клетках — разная.", "s2a_take": "Точки начала подготавливаются до S-фазы, и их больше, чем запускается; какие из них запустятся, в каждой клетке во многом случайно. Подготовленные, но не запущенные точки копируются проходящими вилками и в той же S-фазе уже не запускаются. Если вилка остановилась, промежуток может закрыть встречная вилка — если успевает — или вилки резервной точки, если та в этой клетке запустится. Когда остановились обе встречные вилки и они не возобновляются, помочь может только подготовленная точка между ними. Резерв повышает вероятность полного копирования, но не гарантирует его. Что происходит с остановленной вилкой и какие сигналы при этом возникают, рассматривает курс «Молекулярная биология».", "p2a_1_q": "Условия: участок между точками начала A и Б (8 ед.), на отметке 4 — точка В, подготовленная до S-фазы. Вилки идут без задержек и встречаются на отметке 4. Что произойдёт с точкой В в этой S-фазе?", "p2a_1_o1": "Её скопирует проходящая вилка, и в этой S-фазе она уже не запустится", "p2a_1_o2": "Она обязательно запустится: подготовленная точка всегда используется", "p2a_1_o3": "Она запустится позже, когда участок уже скопирован", "p2a_1_w2": "Подготовленных точек больше, чем запускается; многие копируются проходящими вилками и остаются неиспользованными.", "p2a_1_w3": "Скопированный участок
