<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры">
<title>Семинар 2 · Цитоскелет: полярность, динамика и сила</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.qcol{color:var(--muted);font-size:13.5px;margin:2px 0 0;max-width:90ch;flex-basis:100%;order:9}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий «предскажите и проверьте» */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
/* v1.1.6: варианты итогового вопроса (блок .intbox) — тот же вид, что у вариантов шагов (прежде были кнопки браузера без стиля) */
.poe .opts,.intbox .opts{display:grid;gap:6px}
.poe .opt,.intbox .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L,.intbox .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked,.intbox .opt.picked{border-color:var(--ink)}
.poe .opt.right,.intbox .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick,.intbox .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex,.intbox .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled,.intbox .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tlrow{display:flex;gap:10px;align-items:center}
.tlplay{white-space:nowrap;min-width:116px;padding-top:7px;padding-bottom:7px}
.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */
.veil{display:none}
.casemode .side>.panel:not(.case),.casemode .totake{display:none!important}
/* v1.1.6: шкала этапов скрыта во всём режиме «Найти причину»: после решения схема показывает образец, а шкала — план контрольной сцены (подпись «Этап 4 из 4…» противоречила образцу) */
.casemode .stage .tl,.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}
.case .k{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}
.co{margin:0 0 10px;font-size:15px;line-height:1.4}
.ch{margin:12px 0 6px;font-weight:700;font-size:14px}
.cm,.cc{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.cq{font:600 12.5px var(--f-body);padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}
.kh{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */
:root{--nucbg:#F3EEF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}
.rxtrack input{position:relative;z-index:1;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}
.mcond p{margin:0;font-size:14.5px}
.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (ограничение 07, разд. 4; R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.poe .hint{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface)}
.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.amapgrid svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.amapq{margin-top:12px}.amapq .opts{display:grid;gap:6px}.amapq .opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.amapq .opt.right{border-color:#2E9B57;background:#EEF8F1}.amapq .opt.wrongpick{border-color:#C0392B;background:#FBECEA}.amapq .opt .L{font-weight:700}
@media (max-width:700px){.amapgrid{grid-template-columns:minmax(0,1fr)}}

/* ---- семинар 8, интерактив (Claude Code, 12.11.2026): из семинара 7 v1.5 ---- */
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}
.tlrow:has(.tlstep) .tlchips{flex-wrap:wrap}
.tlrow:has(.tlstep) .tlplay{min-width:0}
@media (max-width:1000px){.tlrow:has(.tlstep) .tlchips{flex-basis:100%}}   /* рецензия v1.4, п. 9: на компьютере ряд шкалы в одну строку — схема крупнее */
.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}
.scene.predict .panel.cap::before,.scene.predict .panel.reads::before{content:attr(data-predict);display:block;font-weight:600;color:var(--ink)}
.scene.predict .panel.cap,.scene.predict .panel.reads{position:relative}
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
/* рецензия v1.4, п. 7: до запуска шкала не показывает, где остановится процесс */
.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}
.scene.predict .tlr{--stop:100% !important}
.scene.predict .tlc.no{cursor:pointer}   /* v1.2 (рецензия И-15) */

/* v1.2.1 (аудит S9-06, рецензия И-03): телефон — ключевые числа 2а/3а текущего кадра строкой под схемой, без прокрутки увеличенной схемы.
   Скрыта до ответа в сценарии (poehide), в «Найти причину» до решения и до запуска шкалы (predict); на широком экране не нужна. */
.mstrip{display:none}
@media (max-width:700px){ .mstrip{display:flex;flex-wrap:wrap;gap:2px 12px;margin:8px 2px 2px;font-size:14px;line-height:1.35;color:var(--ink,#15202B)}
  .mstrip b{font-variant-numeric:tabular-nums} .mstrip .mh{width:100%;font-size:12.5px;color:var(--muted,#5B6B7F)} }
.poehide .mstrip,.predict .mstrip,.casemode:not(.casedone) .mstrip{visibility:hidden}
/* v1.2.1 (аудит S10-07): подпись перехода над схемой после ответа */
.psw{margin:0 0 8px;padding:7px 12px;background:#FFF5E8;border-left:3px solid #E8912A;border-radius:0 8px 8px 0;font-size:14px;line-height:1.4;color:var(--ink,#15202B)}
.psw[hidden]{display:none}
/* ===== семинар 11 (Code, B0): подзаголовок, показания и условия в шаге сценария, правила модели, ссылка «К объяснению» ===== */
header .ttl{min-width:0}
header .psub{margin:2px 0 0;font-size:16px;color:var(--muted);font-weight:500}
.poe .pobs{margin:6px 0 8px;padding:8px 10px;border-left:3px solid var(--on);background:var(--surface-2);font-size:15px}

.advx .rules li{margin:3px 0;font-size:14.5px}
.routeln{margin:10px 2px 2px}
.routeln a{font-weight:600}
.aprob p{margin:6px 0 0}
.take.none{display:none!important}
.scene .fewrap{grid-column:1/-1;margin-top:10px}
.fepanels{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fepanels svg{flex:1 1 280px;max-width:420px;background:var(--surface);border-radius:10px}
.fecap{font-size:15.5px;border-left:4px solid var(--mtor);padding-left:10px}
.feq{margin:10px 0}
.intbox{margin-top:12px}
.intbox h3{margin:0 0 6px}
.intcase{border-top:1px solid var(--line);padding:10px 0}

/* семинар 1: до ответа показания скрыты (02, разд. 0) */
.reads.s1wait > *{visibility:hidden}
.reads.s1wait{position:relative;min-height:44px}
.reads.s1wait::after{content:attr(data-wait);position:absolute;left:14px;top:12px;color:var(--muted);font-size:14px;visibility:visible}
.intro{max-width:96ch;margin:4px 0 10px}
details.allx{margin-top:8px}details.allx summary{cursor:pointer;color:var(--mtor);font-weight:600}
details.allx li{margin:4px 0}details.allx li.okx b{color:var(--good)}
.exstep{border-left:3px solid var(--mtor);padding-left:8px}
/* семинар 1: итоговая задача */
.intbox h2{margin:0 0 6px;font-size:20px}
.intgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.intgrid{grid-template-columns:1fr}}
.intstage svg{width:100%;height:auto;display:block}
.intsteps{padding-left:20px}.intsteps li{margin:8px 0}
.intc{display:flex;gap:6px;align-items:flex-start;margin:3px 0;font-size:14px}
.intfb.ok{color:var(--good);font-weight:600}.intfb.bad{color:var(--bad);font-weight:600}
.inttab{border-collapse:collapse;margin:6px 0;font-size:14px}.inttab td,.inttab th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.intnote{width:100%;font:inherit}
#intBox select{max-width:100%}
.panel.pre p{margin:6px 0}.panel.pre ul.rules,.panel.pre ol.rules{margin:6px 0}
#intBox .grp > span{margin-right:10px}   /* v1.2 (Н-25): метка «Ситуация» не вплотную к списку */

/* С2: схемы карточек методов в блоке «Как это установили» (11, разд. Г) */
.advx svg.mfig{display:block;width:100%;max-width:600px;height:auto;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:8px}

/* пакет 4 финального аудита (20.11.2026): окно «О модели» — общий компонент patches/p4_model_dialog.md */
#modelDlg{max-height:85vh;overflow:auto}
.model-body .model-status::first-letter{text-transform:uppercase}
.model-body{font-size:15px;line-height:1.5}
.model-body .model-status{color:var(--muted);margin:0 0 6px}
.model-body h4{margin:14px 0 6px;font-size:15px}
.model-body p{margin:0 0 8px}
.model-body ul{margin:0 0 8px;padding-left:20px}
@media (max-width:600px){#modelDlg{max-width:calc(100vw - 24px);padding:14px}}
/* пакет 4: нумерованные правила модели и схемы методов в окне; строка статуса модели под схемой (одна строка, как в семинарах 3 и 7);
   условия вкладки в случае «Найти причину»; «Правила модели» панели Б вкладки 1 (#rule1b) — только в окне */
.model-body ol{margin:0 0 8px;padding-left:20px}
.model-body svg{max-width:100%;height:auto}
.p4stat{margin:0;padding:4px 12px 6px;font-size:12px;line-height:1.35;color:var(--muted);border-top:1px solid var(--line)}
.p4pa + .p4stat{border-top:0;padding-top:0}
.stage:has(.tl):has(.p4stat):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 172px)}
.stage:has(.p4stat):not(:has(.tl)):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 28px)}
.stage:has(.p4pa:not([hidden])):not(:has(.tl)):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 48px)}
.casemode:not(.casedone) .stage .p4stat{display:none}
.case .ccond{margin:4px 0 6px}
#sc1b #rule1b{display:none}

/* сведение пакета 4 (20.11.2026): длинная плашка показания переносится внутри строки, а не уходит за край колонки и не закрывает подпись */
@media (min-width:701px){.read:has(> .pill){grid-template-columns:max-content minmax(0,1fr)}.read > .pill{white-space:normal;justify-self:end;text-align:right}}

/* пакет 7 (20.11.2026): ссылка на раздел — отдельной строкой под переходом между семинарами */
.semnav .sn-sec{grid-column:1/-1;text-align:center}

/* пакет 5 (20.11.2026): телефон — подписи < 7 px скрыты до увеличения; ширина увеличенной схемы — по самой мелкой подписи (≥ 11 px) */
@media (max-width:700px), (max-height:500px){
  .stage.zoomed svg{width:var(--p5w,760px)!important}
}

/* 3.0.2 (21.11.2026): телефон — как в «Молекулярной биологии»: подписи не скрываются; схема открывается увеличенной;
   «Показать схему целиком» вписывает её во всю ширину экрана (ограничение высотой окна — только для компьютера и проектора) */
@media (max-width:700px){#scenes .stage:not(.zoomed) svg{max-height:none!important}}
</style>

т предсказания учебной модели, а не результат эксперимента. Длины, уровни и числа на схемах условные: они показывают направление и соотношение величин, а не измеренные значения. Измеренные значения, если они приводятся, даны в тексте вместе с условиями измерения", "s2_anim_note": "Порядок этапов на анимации — учебная модель; в клетке этапы могут перекрываться", "s2_lvl_basic": "Базовый", "s2_lvl_adv": "Продвинутый", "s2_btn_check": "Проверить", "s2_btn_all": "Показать разбор всех вариантов", "s2_btn_hint": "Подсказка", "s2_btn_next": "Следующий шаг", "s2_btn_reset": "Вернуть исходное состояние", "s2_adv_note": "Продвинутый уровень не нужен для коллоквиума. Модели здесь сложнее: в них несколько изменяемых условий, и один результат может иметь разные причины", "s2_subtitle": "Актиновые филаменты, микротрубочки и промежуточные филаменты: строение, динамика, моторные белки и генерация силы", "s2_t1_s1_cond": "Панель А. Три полимера показаны крупным планом. Строки таблицы «полярность» и «моторные белки» скрыты", "s2_t1_s1_q": "По какому из трёх полимеров моторный белок не может перемещаться в определённом направлении — и почему?", "s2_t1_s1_o1": "По промежуточному: два димера тетрамера обращены в противоположные стороны", "s2_t1_s1_x1": "Верно. Моторный белок шагает в сторону, заданную ориентацией субъединиц. У промежуточного филамента два димера тетрамера обращены в противоположные стороны, и в филаменте нет ни плюс-, ни минус-конца. Направленного моторного транспорта по нему нет", "s2_t1_s1_o2": "По актиновому: он самый тонкий, мотору не на что опереться", "s2_t1_s1_x2": "Толщина здесь не главное. По актиновым филаментам шагают миозины; тонкий филамент полярен, у него есть плюс- и минус-конец, и миозин движется в определённую сторону", "s2_t1_s1_o3": "По микротрубочке: она полая, и мотор не может удержаться на её стенке", "s2_t1_s1_x3": "Полость не мешает движению: моторы кинезин и динеин шагают по наружной поверхности протофиламентов. Микротрубочка полярна, и именно по ней груз переносится на большие расстояния", "s2_t1_s1_o4": "Ни по одному: моторные белки перемещаются только вместе с цитоплазмой", "s2_t1_s1_x4": "Моторные белки движутся по филаментам сами, используя энергию АТФ: направление задаёт полярность филамента. Без полярного пути направленного движения нет", "s2_t1_s1_h1": "Чтобы шагать в одну сторону, мотору нужно отличать «перед» от «зада» пути. Где такое отличие есть?", "s2_t1_s1_h2": "Посмотрите на лупу у промежуточного филамента: как ориентированы два димера в тетрамере?", "s2_t1_s1_h3": "Если субъединицы уложены навстречу друг другу, концы полимера одинаковы", "s2_t1_s1_e": "Полярность актинового филамента и микротрубочки возникает потому, что все субъединицы присоединяются к полимеру в одной ориентации. У промежуточного филамента ориентация субъединиц взаимно гасится. Поэтому моторы, которые возят груз, есть у актина (миозины) и у микротрубочек (кинезины и динеины), но не у промежуточных филаментов", "s2_t1_s1_bio": "4", "s2_t1_s2_cond": "Панель А. На препарате виден пучок, в котором десять актиновых филаментов сшиты белками бок о бок. Общий диаметр пучка больше 25 нм — не меньше, чем у микротрубочки", "s2_t1_s2_q": "Какое наблюдение позволит отличить такой пучок от микротрубочки?", "s2_t1_s2_o1": "Из какого белка он собран и есть ли у него полая стенка", "s2_t1_s2_x1": "Верно. Субъединица и устройство стенки однозначно различают два полимера; диаметр пучка зависит от числа сшитых филаментов и потому не различает", "s2_t1_s2_o2": "Различаются ли у полимера плюс- и минус-конец", "s2_t1_s2_x2": "Полярны оба: и актиновые филаменты в пучке, и микротрубочка. По этому признаку их не различить", "s2_t1_s2_o3": "Перемещаются ли по нему моторные белки с затратой АТФ", "s2_t1_s2_x3": "По обоим перемещаются моторы: по актину — миозины, по микротрубочке — кинезины и динеины. Сам факт движения не различает полимеры; различает тип мотора", "s2_t1_s2_o4": "Разбирается ли полимер в живой клетке за несколько минут", "s2_t1_s2_x4": "И актиновые филаменты, и микротрубочки собираются и разбираются за секунды — минуты. Признак динамичности их не различает", "s2_t1_s2_h1": "Какой признак у пучка и у микротрубочки разный, а какой одинаковый?", "s2_t1_s2_h2": "Сравните строки таблицы «субъединица» и «полярность»", "s2_t1_s2_h3": "Подумайте, какой признак не зависит от того, сколько филаментов сшито вместе", "s2_t1_s2_e": "Различать системы цитоскелета нужно по нескольким признакам: субъединица, нуклеотид, полярность, моторные белки, характер перестройки. Диаметр отдельного филамента полезен, но толщина пучка или сети зависит от того, сколько филаментов сшито вместе", "s2_t1_s2_bio": "1", "s2_t1_s3_cond": "Панель А. У субъединиц некоторых полимеров есть связанный нуклеотид, который расщепляется после встраивания субъединицы в полимер. Строка таблицы «нуклеотид у субъединицы» скрыта до ответа", "s2_t1_s3_q": "Субъединицы каких полимеров несут нуклеотид, который гидролизуется после встраивания?", "s2_t1_s3_o1": "Актина (АТФ) и тубулина (ГТФ)", "s2_t1_s3_x1": "Верно. Гидролиз после встраивания делает старые участки филамента менее прочно связанными, чем свежие, и это основа быстрой перестройки актина и микротрубочек. Промежуточные филаменты собираются без гидролиза нуклеотида", "s2_t1_s3_o2": "Всех трёх: без нуклеотида полимер не собрать", "s2_t1_s3_x2": "Промежуточные филаменты собираются из тетрамеров без гидролиза АТФ или ГТФ. Нуклеотид нужен не для самой сборки, а для её быстрой обратимости", "s2_t1_s3_o3": "Актина и промежуточных филаментов; тубулин нуклеотида не несёт", "s2_t1_s3_x3": "Тубулин несёт ГТФ: в β-тубулине он гидролизуется после встраивания, в α-тубулине остаётся негидролизованным. У белков промежуточных филаментов нуклеотида нет", "s2_t1_s3_o4": "Только тубулина (ГТФ): актин нуклеотида не несёт", "s2_t1_s3_x4": "Актин тоже несёт нуклеотид — АТФ; после встраивания субъединицы в филамент АТФ гидролизуется до АДФ", "s2_t1_s3_h1": "Какие полимеры перестраиваются за минуты?", "s2_t1_s3_h2": "Сравните строку «перестройка» в таблице", "s2_t1_s3_h3": "Нуклеотид — у двух динамичных полимеров", "s2_t1_s3_e": "Гидролиз нуклеотида внутри полимера означает, что на конце, где субъединицы только что присоединились, они другие, чем в глубине. Это различие обеспечивает быструю разборку там, где нуклеотид уже гидролизован. Промежуточные филаменты перестраиваются иначе: их субъединицы обмениваются медленнее, а быстрая разборка (например, во время деления клетки) запускается фосфорилированием белков филамента", "s2_t1_s3_bio": "2 3", "s2_t1_s4_cond": "Панель Б. Функция промежуточных филаментов сильно снижена; актиновые филаменты и микротрубочки в норме. Клетку растягивают за два противоположных края", "s2_t1_s4_q": "Какой результат даст модель?", "s2_t1_s4_o1": "Устойчивость к растяжению нарушена; перенос груза и выпячивание поверхности сохранены", "s2_t1_s4_x1": "Верно. Промежуточные филаменты прочны и сильно растягиваются без разрыва; через межклеточные контакты они распределяют нагрузку по клетке и ткани. Транспорт и выпячивания обеспечивают другие системы", "s2_t1_s4_o2": "Устойчивость к растяжению сохранена, потому что её полностью обеспечивает актиновый кортекс", "s2_t1_s4_x2": "Кортекс участвует в механике клетки, но при сильном растяжении основную нагрузку принимает сеть промежуточных филаментов, связанная с контактами. В модели кортекс — вспомогательная система", "s2_t1_s4_o3": "Нарушены все три функции: промежуточные филаменты — общая опора для остальных систем", "s2_t1_s4_x3": "Системы связаны между собой, но перенос груза по микротрубочкам и выпячивание за счёт актина при этом не требуют промежуточных филаментов", "s2_t1_s4_o4": "Нарушен перенос груза: груз переносят по промежуточным филаментам", "s2_t1_s4_x4": "По промежуточным филаментам моторы не движутся: у них нет полярности (шаг 1). Груз переносят по микротрубочкам", "s2_t1_s4_h1": "Какая из трёх систем лучше всего сопротивляется растяжению?", "s2_t1_s4_h2": "Посмотрите, к каким структурам на краю клетки прикреплена коричневая сеть", "s2_t1_s4_h3": "Главная система для растяжения — промежуточные филаменты", "s2_t1_s4_e": "Сопротивление растяжению — главная механическая функция промежуточных филаментов. У человека дефектный кератин в базальных клетках эпидермиса приводит к тому, что кожа покрывается пузырями даже при слабом механическом воздействии: клетки разрываются. Этот пример иллюстрирует механизм, а не правило диагностики", "s2_t1_s4_bio": "6", "s2_t1_s5_cond": "Панель Б. Функция микротрубочек сильно снижена; остальные системы в норме. Наблюдают перенос лизосом от области у ядра к периферии клетки и образование выпячиваний на краю", "s2_t1_s5_q": "Что покажет модель?", "s2_t1_s5_o1": "Перенос нарушен, выпячивание ослаблено, растяжение сохранено", "s2_t1_s5_x1": "Верно. Микротрубочки — длинные полярные пути, по которым моторы переносят груз от центра к периферии. Выпячивание создаёт актин, а микротрубочки помогают удерживать его направление", "s2_t1_s5_o2": "Перенос сохранён: груз доставит актиновый кортекс", "s2_t1_s5_x2": "Актиновые филаменты сосредоточены у мембраны и не образуют длинных путей от ядра к краю клетки. Без микротрубочек груз от центра до периферии не доходит", "s2_t1_s5_o3": "Выпячивания исчезнут: их создают микротрубочки", "s2_t1_s5_x3": "Выпячивание края создаёт полимеризация актина. Микротрубочки влияют на направленность, а не на сам механизм выпячивания", "s2_t1_s5_o4": "Растяжение нарушено: микротрубочки — главная опора", "s2_t1_s5_x4": "Микротрубочки жёсткие и хорошо сопротивляются изгибу и сжатию; главная система для растяжения — промежуточные филаменты", "s2_t1_s5_h1": "По какой системе груз проходит большие расстояния?", "s2_t1_s5_h2": "Что изображено на краю клетки — какая сеть стоит за выпячиванием?", "s2_t1_s5_h3": "Найдите в правиле модели, для какой нагрузки микротрубочки главная система, а для какой — вспомогательная", "s2_t1_s5_e": "Микротрубочки отходят от центросомы к периферии и служат путями для моторных белков. Если их мало, лизосомы, эндосомы и другие органеллы не распределяются по клетке. При этом клетка сохраняет актиновый механизм изменения формы поверхности", "s2_t1_s5_bio": "6 18", "s2_t1_s6_cond": "Панель Б. Функция актиновых филаментов сильно снижена; остальные системы в норме. Наблюдают край клетки и её устойчивость к умеренному растяжению", "s2_t1_s6_q": "Что покажет модель?", "s2_t1_s6_o1": "Выпячивание нарушено, растяжение ослаблено, перенос сохранён", "s2_t1_s6_x1": "Верно. Выпячивание создаёт полимеризация актина у мембраны. Актиновый кортекс — вспомогательная механическая система: без него клетка хуже держит форму, но основную нагрузку при растяжении принимают промежуточные филаменты", "s2_t1_s6_o2": "Выпячивание нарушено, растяжение и перенос сохранены", "s2_t1_s6_x2": "Механику клетки не обеспечивает одна система. Кортикальный слой актина под мембраной поддерживает форму и натяжение поверхности; в модели его снижение ослабляет устойчивость", "s2_t1_s6_o3": "Выпячивания сохранятся за счёт роста микротрубочек", "s2_t1_s6_x3": "Растущие микротрубочки могут упираться в мембрану, но выпячивания края клетки — ламеллиподии — образует сеть актина", "s2_t1_s6_o4": "Перенос нарушится: моторам нужен актин как источник энергии", "s2_t1_s6_x4": "Моторы микротрубочек используют энергию АТФ; актин им для этого не нужен", "s2_t1_s6_h1": "Какая сеть лежит прямо под мембраной по всему краю клетки?", "s2_t1_s6_h2": "Какая система для растяжения главная, а какая вспомогательная?", "s2_t1_s6_h3": "Найдите в правиле модели нагрузки, где актиновые филаменты — главная система и где вспомогательная", "s2_t1_s6_e": "Кортекс — сеть актиновых филаментов, связанная с мембраной белками-адаптерами (<a href=\"seminar-1-route.html#bio-1-6\" target=\"_blank\" rel=\"noopener\">семинар 1</a>). Он задаёт форму поверхности и вместе с миозином создаёт натяжение. Поэтому утверждение «механическую прочность обеспечивают только промежуточные филаменты» неверно: растяжение держат прежде всего промежуточные филаменты и кортекс", "s2_t1_s6_bio": "6 25", "s2_t1_s7_cond": "Панель В. У культивируемой клетки разрушили обе центриоли; белки перицентриолярного материала и γ-тубулинового комплекса в клетке остаются. Через несколько часов смотрят на сеть микротрубочек. Схема скрыта до ответа", "s2_t1_s7_q": "Что увидят?", "s2_t1_s7_o1": "Микротрубочки есть, но сеть хуже сфокусирована", "s2_t1_s7_x1": "Верно. Минус-концы микротрубочек нуклеирует γ-тубулиновый кольцевой комплекс; центриоли — не единственное место, где он работает. Центросома лишь собирает много таких комплексов в одном месте", "s2_t1_s7_o2": "Микротрубочек нет: они растут из центриолей", "s2_t1_s7_x2": "Микротрубочки растут не из самих центриолей, а из колец γ-тубулина в материале вокруг них и в других центрах организации. У высших растений центриолей нет вовсе, а микротрубочки есть", "s2_t1_s7_o3": "Микротрубочки есть, но без полярности", "s2_t1_s7_x3": "Полярность задаёт ориентация тубулина в самой микротрубочке, а не место, где она начинается. Любая микротрубочка имеет плюс- и минус-конец", "s2_t1_s7_o4": "Микротрубочки будут расти только от аппарата Гольджи", "s2_t1_s7_x4": "Без центриолей кольца γ-TuRC остаются и в цитоплазме, и на аппарате Гольджи: микротрубочки растут не только от аппарата Гольджи", "s2_t1_s7_h1": "Где именно начинается микротрубочка — в стенке центриоли или в кольце γ-тубулина?", "s2_t1_s7_h2": "Вспомните схему центросомы до удаления центриолей: где на ней лежали кольца γ-тубулина?", "s2_t1_s7_h3": "Нуклеация идёт на γ-TuRC, а центриоли собирают его вокруг себя", "s2_t1_s7_e": "Центр организации микротрубочек (ЦОМТ) — место, где закреплены минус-концы и нуклеируются новые микротрубочки. В большинстве животных клеток главный ЦОМТ — центросома: две центриоли под прямым углом и перицентриолярный материал с кольцами γ-тубулина. Но ЦОМТ бывают и без центриолей: аппарат Гольджи, апикальная поверхность эпителиальной клетки, оболочка ядра в мышечных клетках. Центриоли нужны также для образования базального тельца реснички", "s2_t1_s7_bio": "5", "s2_t1_rev_q": "В условной клетке нарушен перенос груза к периферии, а выпячивания края ослаблены; устойчивость к растяжению сохранена. Функция какой системы снижена в модели?", "s2_t1_rev_o1": "Микротрубочек", "s2_t1_rev_x1": "Да: только эта строка таблицы даёт сочетание «перенос — нарушен, выпячивание — ослаблено, растяжение — сохранено»", "s2_t1_rev_o2": "Актиновых филаментов", "s2_t1_rev_x2": "Тогда выпячивания были бы нарушены, а перенос сохранён", "s2_t1_rev_o3": "Промежуточных филаментов", "s2_t1_rev_x3": "Тогда была бы нарушена устойчивость к растяжению, а транспорт и выпячивания сохранены", "s2_t1_rev_o4": "По этим данным определить нельзя", "s2_t1_rev_x4": "В этой модели можно: сочетание из трёх исходов указывает на одну строку таблицы. В реальной клетке такое сочетание может иметь и другие причины — их разбирает итоговая задача", "s2_t1_cond": "Объект — условная клетка на краю слоя эпителиальных клеток в культуре, прикреплённая к подложке: с одной стороны у неё соседи, с другой — свободный край. Панель А: три полимера цитоскелета крупным планом. Панель Б: та же клетка целиком; можно сильно снизить функцию одной системы и приложить нагрузку. Панель В: центр организации микротрубочек. Время наблюдения на панели Б — минуты после приложения нагрузки", "s2_t1_expl": "Три системы цитоскелета построены из разных белков и поэтому выполняют разную работу. Актиновые филаменты (около 8 нм) полярны, быстро собираются и разбираются у мембраны и вместе с миозином создают натяжение; они задают форму поверхности и образуют выпячивания. Микротрубочки (25 нм) — жёсткие полярные трубки; их минус-концы обычно закреплены в центре организации, а плюс-концы растут к периферии; по ним кинезины и динеины переносят груз. Промежуточные филаменты (около 10 нм) неполярны и прочны на растяжение; через межклеточные контакты они распределяют нагрузку по ткани. Системы связаны друг с другом и с мембраной, поэтому ни одна механическая функция не принадлежит только одной из них", "s2_t1_limits": "Модель описывает три системы по отдельности и с тремя уровнями исхода. В клетке системы соединены белками-сшивателями и влияют друг на друга: например, микротрубочки регулируют сборку актина у переднего края, а сеть промежуточных филаментов связана с микротрубочками и актином. Модель не показывает силы в числах: шкалы прочности, общей для всех клеток, нет. Снижение функции в модели не означает полного отсутствия белка. Не показаны другие полимеры (например, септины) и различия между типами клеток", "s2_t1_how": "Три системы различили с помощью электронного микроскопа: в клетке видны нити трёх разных толщин. Затем к каждому белку получили антитела с флуоресцентной меткой и увидели, где в клетке лежит каждая сеть. Роль каждой системы проверяли веществами, которые разбирают или стабилизируют полимер (например, колхицин разбирает микротрубочки), и клетками с изменённым белком", "s2_t1_title": "1. Три системы цитоскелета", "s2_t1b_rule": "У каждой нагрузки есть главная и вспомогательная система. Если функция главной системы сильно снижена — функция клетки нарушена; если сильно снижена функция вспомогательной — ослаблена. Растяжение: главная — промежуточные филаменты, вспомогательная — актиновый кортекс. Перенос груза от центра к периферии: главная — микротрубочки. Выпячивание поверхности: главная — актиновые филаменты, вспомогательная — микротрубочки (они поддерживают направленность выпячивания)", "s2_t2_s1_cond": "Панель А, средний тубулин. С 0 до 6 у.е.в. длина растёт с 0 до 6 у.е.д., затем за 2 у.е.в. падает до нуля", "s2_t2_s1_q": "Какой переход произошёл в момент t = 6?", "s2_t2_s1_o1": "Катастрофа: рост сменился быстрым укорочением", "s2_t2_s1_x1": "Верно. Катастрофа — переход от роста к укорочению. Наклон линии после t = 6 отрицательный и круче, чем при росте", "s2_t2_s1_o2": "Спасение: микротрубочка перестала расти и стабилизировалась", "s2_t2_s1_x2": "Спасение — обратный переход, от укорочения к росту. После t = 6 длина не постоянна, а быстро уменьшается", "s2_t2_s1_o3": "Тредмиллинг: субъединицы стали присоединяться к одному концу и уходить с другого", "s2_t2_s1_x3": "При тредмиллинге длина остаётся почти постоянной. Здесь длина падает до нуля", "s2_t2_s1_o4": "Нуклеация: на конце началась сборка новой микротрубочки", "s2_t2_s1_x4": "Нуклеация — начало сборки с нуля; на графике она видна при t = 10, когда длина снова начинает расти от нуля", "s2_t2_s1_h1": "Что значит отрицательный наклон линии?", "s2_t2_s1_h2": "Сравните, что было до t = 6 и после", "s2_t2_s1_h3": "Найдите на графике момент, где подъём сменился крутым спуском, и вспомните, как называют этот переход", "s2_t2_s1_e": "Динамическая нестабильность — чередование периодов роста и укорочения одной микротрубочки при постоянной концентрации свободного тубулина. Переход от роста к укорочению называют катастрофой, от укорочения к росту — спасением", "s2_t2_s1_bio": "9 11", "s2_t2_s2_cond": "Тот же график. Рост: 6 у.е.д. за 6 у.е.в.; укорочение: 6 у.е.д. за 2 у.е.в. Панель Б показывает конец в состоянии «рост»", "s2_t2_s2_q": "Почему укорочение быстрее роста?", "s2_t2_s2_o1": "ГДФ-протофиламенты на конце изгибаются и быстро распадаются", "s2_t2_s2_x1": "Верно. ГДФ-тубулин в составе стенки удерживается прямым только боковыми связями с соседями. Когда ГТФ-участок на конце утрачен, протофиламенты изгибаются и распадаются; в пробирке субъединицы уходят от такого конца примерно в 100 раз быстрее, чем от конца с ГТФ-тубулином", "s2_t2_s2_o2": "Укорочение идёт с обоих концов, а рост — с одного", "s2_t2_s2_x2": "В модели минус-конец закреплён в центре нуклеации, и укорочение идёт с плюс-конца, как и рост", "s2_t2_s2_o3": "При укорочении расходуется больше АТФ, и оно ускоряется", "s2_t2_s2_x3": "Разборка не требует затрат энергии в момент самой разборки: энергия гидролиза ГТФ уже запасена в напряжённой стенке. АТФ здесь не участвует", "s2_t2_s2_o4": "Скорости одинаковы, а различие создаёт масштаб осей", "s2_t2_s2_x4": "Обе оси одинаковы для роста и для укорочения: наклоны действительно различаются в три раза", "s2_t2_s2_h1": "Чем отличается конец растущей микротрубочки от конца укорачивающейся?", "s2_t2_s2_h2": "Какую форму принимает ГДФ-тубулин, если его не удерживают соседи по стенке?", "s2_t2_s2_h3": "Сравните форму протофиламентов у растущего конца и у конца, где ГТФ-участка уже нет", "s2_t2_s2_e": "Энергия гидролиза ГТФ, произошедшего после встраивания, запасается в напряжённой стенке: ГДФ-тубулин в свободном состоянии изогнут, а в стенке его удерживают прямым соседи. Освободившись на конце, стенка быстро распадается. Что конкретно на уровне структуры запускает катастрофу, до конца не установлено; ГТФ-шапочка — функциональная модель состояния конца", "s2_t2_s2_bio": "10", "s2_t2_s3_cond": "Панель Б. Схема скрыта до ответа", "s2_t2_s3_q": "Что в модели называется ГТФ-шапочкой?", "s2_t2_s3_o1": "Участок ещё не гидролизовавших ГТФ субъединиц у конца", "s2_t2_s3_x1": "Верно. Свежие субъединицы присоединяются с ГТФ, а гидролиз отстаёт от присоединения. Пока присоединение опережает гидролиз, у конца остаётся участок ГТФ-тубулина — он и защищает конец от разборки", "s2_t2_s3_o2": "Особый белок, защищающий плюс-конец от разборки", "s2_t2_s3_x2": "Белки плюс-конца существуют и влияют на динамику, но ГТФ-шапочка — не белок, а состояние субъединиц самой микротрубочки", "s2_t2_s3_o3": "Колпачок постоянной длины на всё время роста", "s2_t2_s3_x3": "Размер ГТФ-участка не постоянен: он зависит от соотношения скоростей присоединения и гидролиза и может сокращаться до нуля", "s2_t2_s3_o4": "Место, где ГТФ связывается с уже встроенным тубулином", "s2_t2_s3_x4": "ГТФ связан с тубулином ещё до встраивания; в стенке β-тубулин не обменивает ГДФ на ГТФ", "s2_t2_s3_h1": "Когда тубулин получает ГТФ — до или после встраивания?", "s2_t2_s3_h2": "Что быстрее у растущего конца: присоединение или гидролиз?", "s2_t2_s3_h3": "Шапочка — запаздывание гидролиза, а не отдельная структура", "s2_t2_s3_e": "ГТФ-шапочка — удобная модель: она объясняет, почему быстрый рост защищает конец, а замедление роста повышает вероятность катастрофы. Точный размер и форма шапочки в клетке различаются и предметом исследований остаются", "s2_t2_s3_bio": "10", "s2_t2_s4_cond": "Панель А. Свободного тубулина больше: уровень «высокий». Остальные условия прежние", "s2_t2_s4_q": "Как изменится график за 24 у.е.в. по сравнению со средним уровнем?", "s2_t2_s4_o1": "Рост быстрее, катастроф меньше, наибольшая и средняя длина больше", "s2_t2_s4_x1": "Верно: 1 катастрофа вместо 2, наибольшая длина 13,5 вместо 9,0, средняя 6,06 вместо 3,18 у.е.д. Быстрее присоединяются ГТФ-субъединицы — дольше сохраняется ГТФ-участок у конца", "s2_t2_s4_o2": "Рост быстрее, но катастроф больше: длинная микротрубочка менее устойчива", "s2_t2_s4_x2": "В модели длина сама по себе катастрофу не вызывает: её вызывает потеря ГТФ-участка на конце, а при быстром росте он теряется реже", "s2_t2_s4_o3": "График не изменится: динамическая нестабильность не зависит от концентрации тубулина", "s2_t2_s4_x3": "От концентрации свободного тубулина зависит скорость присоединения субъединиц, а значит и то, успевает ли гидролиз догнать конец", "s2_t2_s4_o4": "Катастроф не будет вовсе: при избытке тубулина гидролиз прекращается", "s2_t2_s4_x4": "Гидролиз продолжается; он лишь реже догоняет быстро растущий конец. В модели одна катастрофа всё же есть (t = 9)", "s2_t2_s4_h1": "Что происходит со скоростью присоединения при большей концентрации субъединиц?", "s2_t2_s4_h2": "Что быстрее догонит конец — гидролиз или присоединение, если субъединиц больше?", "s2_t2_s4_h3": "Подумайте, что быстрый рост делает с ГТФ-участком у конца и как это скажется на катастрофах и длине", "s2_t2_s4_e": "Концентрация свободного тубулина меняет и скорость роста, и частоту катастроф. В клетке её дополнительно регулируют белки, связывающие свободный тубулин или конец микротрубочки", "s2_t2_s4_bio": "10", "s2_t2_s5_cond": "Панель А. Средний тубулин; добавлен фактор катастроф — белок, который связывается с концом микротрубочки и облегчает отгибание протофиламентов на конце и тем повышает частоту катастроф (в клетке такую роль выполняют, например, кинезины семейства 13)", "s2_t2_s5_q": "Что покажет график?", "s2_t2_s5_o1": "Катастроф больше, средняя длина меньше, а новых нуклеаций больше", "s2_t2_s5_x1": "Верно: 4 катастрофы вместо 2, средняя длина 1,10 вместо 3,18 у.е.д., и каждая полная разборка сопровождается новой нуклеацией. Сеть перестраивается чаще", "s2_t2_s5_o2": "Микротрубочка разберётся один раз и больше не появится", "s2_t2_s5_x2": "Центр нуклеации остаётся, свободного тубулина достаточно: через 2 у.е.в. начинается новая микротрубочка", "s2_t2_s5_o3": "Укорочение станет медленнее, потому что фактор связывается с концом", "s2_t2_s5_x3": "Фактор катастроф влияет на переход от роста к укорочению, а не на скорость укорочения: в модели она прежняя", "s2_t2_s5_o4": "Ничего не изменится: катастрофы определяются только тубулином", "s2_t2_s5_x4": "Переходы регулируют и белки, связывающиеся с концами; фактор катастроф делает периоды роста короче", "s2_t2_s5_h1": "Чем фактор катастроф отличается от снижения концентрации тубулина?", "s2_t2_s5_h2": "Что происходит после полной разборки, если центр нуклеации на месте?", "s2_t2_s5_h3": "Подумайте, как фактор катастроф меняет число переходов и что происходит у центра нуклеации после полной разборки", "s2_t2_s5_e": "Частые катастрофы делают сеть короче, но не разрушают её: микротрубочки постоянно возникают заново и растут в новых направлениях. Это свойство используется, когда сеть нужно быстро перестроить, например при делении клетки (<a href=\"seminar-6-route.html#spindle\" target=\"_blank\" rel=\"noopener\">семинар 6</a>)", "s2_t2_s5_bio": "12", "s2_t2_s6_cond": "Панель А. Средний тубулин; фактора катастроф нет; добавлен белок, способствующий спасению", "s2_t2_s6_q": "Что покажет график?", "s2_t2_s6_o1": "Укорочения прерываются, полных разборок нет", "s2_t2_s6_x1": "Верно: 3 спасения, 0 полных разборок, средняя длина 7,22 вместо 3,18 у.е.д., наибольшая — 12,0", "s2_t2_s6_o2": "Катастроф не будет: белок защищает растущий конец", "s2_t2_s6_x2": "Белок спасения действует на укорачивающуюся микротрубочку: катастрофы происходят (их 3), но укорочение прерывается", "s2_t2_s6_o3": "Укорочения удлинятся: спасение — после полной разборки", "s2_t2_s6_x3": "После полной разборки спасать нечего — начинается новая нуклеация. Спасение — возобновление роста недоразобранной микротрубочки", "s2_t2_s6_o4": "Длина микротрубочки станет постоянной во времени", "s2_t2_s6_x4": "Длина продолжает меняться: рост чередуется с короткими укорочениями", "s2_t2_s6_h1": "Чем спасение отличается от новой нуклеации?", "s2_t2_s6_h2": "Что прерывает белок спасения — рост или укорочение?", "s2_t2_s6_h3": "Подумайте, на каком этапе действует белок спасения и до чего тогда не доходит укорочение", "s2_t2_s6_e": "Спасение и катастрофа — два независимо регулируемых перехода. Сочетание частых катастроф с частыми спасениями даёт сеть, которая постоянно перестраивается, но не исчезает", "s2_t2_s6_bio": "9 12", "s2_t2_s7_cond": "Панель А. Средний тубулин; субъединицы несут аналог ГТФ, который присоединяется, как ГТФ, но не гидролизуется. В модели запас свободного тубулина за время наблюдения не исчерпывается", "s2_t2_s7_q": "Что покажет график?", "s2_t2_s7_o1": "Катастроф нет: микротрубочка растёт всё время наблюдения", "s2_t2_s7_x1": "Верно: длина 24 у.е.д. к концу наблюдения, катастроф 0. Без гидролиза стенка не накапливает ГДФ-тубулин, и конец не теряет защиту. Гидролиз необходим для динамической нестабильности", "s2_t2_s7_o2": "Катастрофы станут чаще: без гидролиза не хватает энергии для роста", "s2_t2_s7_x2": "Для присоединения субъединицы гидролиз не нужен: энергия гидролиза запасается в стенке и освобождается при разборке. Без гидролиза микротрубочки почти не разбираются", "s2_t2_s7_o3": "Микротрубочка не вырастет: ГТФ нужен только в гидролизованной форме", "s2_t2_s7_x3": "Присоединяются субъединицы с негидролизованным нуклеотидом; аналог ГТФ это не меняет", "s2_t2_s7_o4": "Ничего не изменится: катастрофа наступает от каждого акта гидролиза", "s2_t2_s7_x4": "Если бы каждый гидролиз вызывал катастрофу, микротрубочка не могла бы расти. Катастрофа наступает, когда гидролиз догоняет растущий конец и ГТФ-участок исчезает", "s2_t2_s7_h1": "Откуда берётся неустойчивость стенки?", "s2_t2_s7_h2": "Что станет с ГДФ-тубулином в стенке, если гидролиза нет?", "s2_t2_s7_h3": "Подумайте, откуда в стенке берётся ГДФ-тубулин и что будет, если он не появится", "s2_t2_s7_e": "Гидролиз ГТФ необходим для динамической нестабильности, но катастрофа не следует автоматически за каждым гидролизом: важно соотношение скоростей присоединения и гидролиза у конца. Микротрубочки из тубулина с негидролизуемым аналогом ГТФ в эксперименте почти не разбираются", "s2_t2_s7_bio": "10", "s2_t2_s8_cond": "Панель В. Справа — другой полимер. Его длина за 10 у.е.в. остаётся около 10 у.е.д., а помеченная субъединица смещается от плюс-конца к минус-концу и выходит из полимера", "s2_t2_s8_q": "Как называется поведение полимера справа?", "s2_t2_s8_o1": "Тредмиллинг: поток субъединиц при постоянной длине", "s2_t2_s8_x1": "Верно. Длина постоянна, а субъединицы проходят через полимер. Такое поведение характерно для актиновых филаментов", "s2_t2_s8_o2": "Динамическая нестабильность в момент равновесия", "s2_t2_s8_x2": "При динамической нестабильности длина резко меняется: периоды роста и укорочения сменяют друг друга. Постоянная длина с потоком субъединиц — признак тредмиллинга", "s2_t2_s8_o3": "Стабильный полимер без обмена субъединиц", "s2_t2_s8_x3": "Смещение помеченной субъединицы показывает, что полимер постоянно обновляется, хотя длина не меняется", "s2_t2_s8_o4": "Скольжение всего полимера по моторному белку", "s2_t2_s8_x4": "Полимер не смещается как целое: меняется положение субъединицы внутри него, потому что спереди добавляются новые, а сзади уходят старые", "s2_t2_s8_h1": "Меняется ли длина полимера справа?", "s2_t2_s8_h2": "Что происходит с помеченной субъединицей?", "s2_t2_s8_h3": "Сравните на панели В, что происходит с длиной полимера и с помеченной субъединицей", "s2_t2_s8_e": "Динамическая нестабильность и тредмиллинг — разные формы поведения, хотя оба связаны с гидролизом нуклеотида. Первая — резкие переходы между ростом и укорочением одного конца; вторая — поток субъединиц от одного конца к другому при постоянной длине. В клетке тредмиллинг особенно важен для актина", "s2_t2_s8_bio": "13", "s2_t2_rev_q": "На графике другой клетки скорость роста такая же, как при среднем тубулине, но после первой катастрофы линия ни разу не опускается до нуля: каждое укорочение прерывается, и наибольшая длина больше, чем при среднем тубулине. Какое изменение условий вероятнее всего объясняет график?", "s2_t2_rev_o1": "Появился белок спасения", "s2_t2_rev_x1": "Да: только спасение прерывает укорочение до полной разборки", "s2_t2_rev_o2": "Стало больше свободного тубулина", "s2_t2_rev_x2": "Тогда реже стали бы катастрофы и выросла бы наибольшая длина, но каждое укорочение по-прежнему шло бы до нуля", "s2_t2_rev_o3": "Появился фактор катастроф", "s2_t2_rev_x3": "Он укоротил бы периоды роста, но не прервал бы укорочение", "s2_t2_rev_o4": "ГТФ перестал гидролизоваться в стенке", "s2_t2_rev_x4": "Тогда не было бы укорочений вовсе", "s2_t2_cond": "Объект — одна микротрубочка, растущая от закреплённого минус-конца (центр нуклеации); концентрация свободного тубулина вокруг неё постоянна в течение наблюдения. Панель А: график длины от времени за 24 условные единицы времени (у.е.в.); длина — в условных единицах (у.е.д.). Панель Б: плюс-конец крупным планом. Панель В: сравнение с другим полимером", "s2_t2_expl": "Свободный тубулин присоединяется к плюс-концу в форме ГТФ-тубулина; после встраивания ГТФ в β-тубулине гидролизуется. Пока присоединение опережает гидролиз, у конца остаётся участок ГТФ-тубулина, и микротрубочка растёт. Если гидролиз догоняет конец, протофиламенты из ГДФ-тубулина изгибаются, и наступает быстрое укорочение — катастрофа. Возобновление роста — спасение. Частоту переходов меняют концентрация свободного тубулина и белки, связывающиеся с концом. Поэтому после полной разборки на том же центре может начаться микротрубочка в другом направлении, а сеть в целом быстро перестраивается", "s2_t2_limits": "Длительности периодов роста в модели заданы списком, чтобы график был воспроизводимым; в клетке момент катастрофы случаен, и две микротрубочки в одних условиях ведут себя по-разному. Скорости и длины условные. Модель не показывает минус-конец в динамике (он закреплён), белки плюс-конца и то, как отдельные протофиламенты укорачиваются неодновременно. Слово «катастрофа» здесь означает переход отдельной микротрубочки к укорочению; это не «митотическая катастрофа» — гибель клетки при сбое деления", "s2_t2_how": "Динамическую нестабильность увидели, наблюдая под микроскопом отдельные микротрубочки из очищенного тубулина и в живых клетках с флуоресцентным тубулином: длина каждой менялась резкими переходами. Роль гидролиза показали с аналогом ГТФ, который не гидролизуется: такие микротрубочки почти не разбирались", "s2_t2_title": "2. Динамическая нестабильность микротрубочек", "s2_t2a_rule": "Скорость роста растёт с концентрацией свободного тубулина (0,5 / 1,0 / 1,5 у.е.д. за у.е.в.). Укорочение в модели всегда быстрее роста (3 у.е.д. за у.е.в.). Катастрофа наступает, когда на конце не остаётся ГТФ-тубулина; в модели это задано длительностью периодов роста (в среднем 4 / 6 / 9 у.е.в. при низком / среднем / высоком тубулине, с фактором катастроф — 2 / 3 / 4), а сами периоды разной длины. Белок спасения прерывает укорочение через 1 у.е.в. Без спасения микротрубочка укорачивается до нуля, и через 2 у.е.в. на том же центре нуклеируется новая. Если ГТФ не гидролизуется, катастроф нет", "s2_t3_s1_cond": "Панель А. Кинезин-1 с грузом связан с микротрубочкой, у которой плюс-конец справа. АТФ есть", "s2_t3_s1_q": "Куда переместится груз?", "s2_t3_s1_o1": "Вправо, к плюс-концу", "s2_t3_s1_x1": "Верно. Кинезин-1 — плюс-направленный мотор: каждая его головка связывает АТФ и, гидролизуя его, делает шаг в сторону плюс-конца", "s2_t3_s1_o2": "Влево, к минус-концу", "s2_t3_s1_x2": "К минус-концу движется динеин. Кинезин-1 движется к плюс-концу", "s2_t3_s1_o3": "Будет перемещаться попеременно в обе стороны", "s2_t3_s1_x3": "Отдельная молекула кинезина-1 шагает в одну сторону; смена направления груза в клетке возможна, если на нём несколько разных моторов", "s2_t3_s1_o4": "Останется на месте: для движения нужен ещё и груз определённого типа", "s2_t3_s1_x4": "Груз уже присоединён, а для движения нужны микротрубочка и АТФ", "s2_t3_s1_h1": "Какой мотор движется к плюс-концу?", "s2_t3_s1_h2": "Найдите знак «+» на микротрубочке", "s2_t3_s1_h3": "Свяжите две вещи: к какому концу шагает этот мотор и с какой стороны схемы находится этот конец", "s2_t3_s1_e": "Моторный белок превращает энергию гидролиза АТФ в направленное движение: головки поочерёдно связываются с микротрубочкой и меняют форму. Направление задаётся полярностью микротрубочки", "s2_t3_s1_bio": "16 17", "s2_t3_s2_cond": "Панель А. Ту же микротрубочку повернули: теперь плюс-конец слева. Мотор — тот же кинезин-1", "s2_t3_s2_q": "Куда переместится груз?", "s2_t3_s2_o1": "Влево: мотор по-прежнему идёт к плюс-концу, а плюс-конец теперь слева", "s2_t3_s2_x1": "Верно. Поворот микротрубочки поменял пространственное направление, но не направление мотора относительно микротрубочки", "s2_t3_s2_o2": "Вправо: кинезин всегда движется в ту же сторону, что и раньше", "s2_t3_s2_x2": "Направление шага задаёт ориентация тубулина, а не стороны рисунка. Поворот микротрубочки поворачивает и путь мотора", "s2_t3_s2_o3": "Остановится: после поворота мотор не может связаться с микротрубочкой", "s2_t3_s2_x3": "Связывание не зависит от поворота всей микротрубочки: стенка та же", "s2_t3_s2_o4": "Кинезин станет двигаться к минус-концу", "s2_t3_s2_x4": "Направление относительно микротрубочки — свойство самого мотора; у кинезина-1 оно не меняется", "s2_t3_s2_h1": "Что изменилось — мотор или микротрубочка?", "s2_t3_s2_h2": "Где теперь знак «+»?", "s2_t3_s2_h3": "Мотор тот же — значит, его направление относительно микротрубочки прежнее; найдите, где теперь этот конец", "s2_t3_s2_e": "Три величины нельзя смешивать: полярность микротрубочки (где её плюс- и минус-конец), направление мотора относительно микротрубочки (к плюсу или к минусу) и пространственное направление движения в клетке (к ядру, к мембране)", "s2_t3_s2_bio": "19", "s2_t3_s3_cond": "Панель Б, клетка соединительной ткани в культуре. Груз (эндосома) находится у края клетки; на нём активен цитоплазматический динеин", "s2_t3_s3_q": "Куда переместится груз?", "s2_t3_s3_o1": "К центросоме: там минус-концы", "s2_t3_s3_x1": "Верно. В этой клетке микротрубочки отходят от центросомы плюс-концами к периферии, поэтому минус-направленный динеин везёт груз к центру", "s2_t3_s3_o2": "К краю клетки: динеин везёт к мембране", "s2_t3_s3_x2": "К краю груз повёз бы кинезин-1. Динеин движется к минус-концам, а они в этой клетке в центре", "s2_t3_s3_o3": "В любую сторону, случайно", "s2_t3_s3_x3": "Направление задано ориентацией микротрубочек и типом мотора", "s2_t3_s3_o4": "Груз останется: динеин работает лишь в митозе", "s2_t3_s3_x4": "Цитоплазматический динеин работает и в интерфазе: он переносит эндосомы, лизосомы и другие грузы к центру клетки", "s2_t3_s3_h1": "Где в этой клетке минус-концы?", "s2_t3_s3_h2": "Найдите на схеме центросому", "s2_t3_s3_h3": "Определите, к какому концу шагает динеин, и найдите этот конец у микротрубочек этой клетки", "s2_t3_s3_e": "В клетках, где микротрубочки расходятся от центросомы, кинезины обычно везут груз к периферии, а динеин — к центру. Это следствие ориентации сети, а не свойство «периферии» или «центра»", "s2_t3_s3_bio": "18", "s2_t3_s4_cond": "Панель Б, нейрон. Белки, синтезированные в теле нейрона, переносятся в везикулах к окончанию аксона. Все
