      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------

const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));
    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */
    chips.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));
      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */
    const Td = T > 1e-9 && T < stop - 1e-9 && Math.abs(T - Math.round(T)) < 1e-9 ? T - 1e-6 : T;
    o.render(Td);
  }
  const api = {
    get T() { return st.T; }, get playing() { return st.on; }, get end() { return st.stop; },
    config(keys, stop, stopKey, opt = {}) {
      st.speed = opt.speed || 1.5; st.halt = !!opt.halt; st.keys = keys; st.n = keys.length; st.stop = stop; st.stopKey = stopKey; st.on = false; st.text = '';
      st.stepKey = opt.stepKey || 'tl_step'; st.off = opt.off || 0;
      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');
      chips.querySelectorAll('button').forEach((b, i) => b.onclick = () => { st.on = false; api.seek(i + 1); });
    },
    seek(T) { st.until = null; st.T = Math.max(0, Math.min(st.stop, T)); paint(); },
    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
    play(fromStart, until) {
      if (fromStart || st.T >= st.stop - 1e-6) st.T = 0;
      st.until = until != null && until < st.stop ? until : null;
      if (calm.matches) {   /* без движения: ответ показывается сразу, кнопка идёт по одному этапу */
        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => (typeof CASE !== 'undefined' && CASE.on) ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —
   сначала прогноз, потом явный запуск («▶ Запустить», шаг или кнопка этапа). Как только шкала ушла с нуля, итог виден. */
function predictHold(K){ const sc = $('sc' + K); if (!sc) return; sc.classList.add('predict');
  /* рецензия v1.4, п. 8: кнопки этапов без исхода в доступном имени, пока прогноз не сделан */
  sc.querySelectorAll('.tlc').forEach(b => { if (!b.dataset.al) b.dataset.al = b.getAttribute('aria-label') || ''; b.setAttribute('aria-label', (b.dataset.al.split(':')[0] || '').trim());
    if (b.disabled) { b.dataset.no = '1'; b.disabled = false; } });   /* семинар 8, v1.2 (рецензия И-15): до запуска кружки одинаковы — недоступные не выдают место остановки */
  const c = $('capbox' + K), r = $('reads' + K); if (c) c.dataset.predict = t('predict_note'); if (r) r.dataset.predict = t('predict_reads'); }
function predictDone(K, T){ if (T > 1e-6) { const sc = $('sc' + K); if (sc && sc.classList.contains('predict')) { sc.classList.remove('predict');
  sc.querySelectorAll('.tlc').forEach(b => { if (b.dataset.al != null) { b.setAttribute('aria-label', b.dataset.al); delete b.dataset.al; } if (b.dataset.no) { b.disabled = true; delete b.dataset.no; } }); } } }

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typeof fitStage === 'function') fitStage(); });

/* =====================================================================
   s0_oc_m.js — учебные модели семинара 2 «Цитоскелет: полярность, динамика и сила» (07, разд. 2): чистые функции OC.*,
   перенос scripts/models_check.py (v1.1) без изменения правил и чисел. Эталон — неизменяемые ожидаемые значения
   scripts/test_models.py (175 проверок); JS-проверка тех же значений — tests2/models.mjs; полная сверка выходов с Python —
   tests2/models_vs_py.mjs. Все величины условные (допущения D-1…D-8, 05). Русский текст — только имена причин OC.int
   (дословно models_check.py; на странице подписи берутся из таблицы текстов).
   И2 (OC.a2): генератор Мерсенна — порт random.Random Python (seed 2): P и t совпадают с эталоном точно (07, разд. 2).
   ===================================================================== */
const OC = (function () {
  /* Python round(x, n): половины — к чётному (как в эталоне) */
  function pyRound(x, n = 0) {
    /* toFixed работает с точным двоичным значением числа, как round() Python; различие — только точная половина
       (toFixed — вверх, Python — к чётному). Точную половину распознаём по точной десятичной записи числа. */
    const ex = Math.abs(x).toFixed(Math.min(100, n + 60)), tail = ex.slice(ex.indexOf('.') + 1 + n);
    if (/^50*$/.test(tail)) {
      const m = Math.pow(10, n), f = Math.floor(Math.abs(x) * m), v = (f % 2 === 0) ? f : f + 1;
      return Math.sign(x) * v / m;
    }
    return Number(x.toFixed(n));
  }
  const r2 = x => pyRound(x, 2), r3 = x => pyRound(x, 3);

  /* ---------- OC.s1 / OC.a1 — три системы и нагрузки (02, 1.9; 03, И1) ---------- */
  const LOADS = {
    stretch: { main: 'I', aux: 'A' },
    cargo: { main: 'M', aux: null },
    protrude: { main: 'A', aux: 'M' },
  };
  const LOAD_KEYS = ['stretch', 'cargo', 'protrude'];
  const LEVELS = [1.0, 0.5, 0.2];
  function load_outcome(load, f) {
    const L = LOADS[load];
    if (f[L.main] <= 0.2) return 0;
    if (f[L.main] <= 0.5 || (L.aux && f[L.aux] <= 0.2)) return 1;
    return 2;
  }
  function a1(f, loads = LOAD_KEYS) { const o = {}; loads.forEach(ld => { o[ld] = load_outcome(ld, f); }); return o; }
  function a1_inverse(obs) {
    const res = [];
    for (const a of LEVELS) for (const m of LEVELS) for (const i of LEVELS) {
      const f = { A: a, M: m, I: i };
      if (Object.keys(obs).every(ld => load_outcome(ld, f) === obs[ld])) res.push(f);
    }
    return res;
  }
  function s1(reduced) { const f = { A: 1.0, M: 1.0, I: 1.0 }; if (reduced) f[reduced] = 0.2; return a1(f); }

  /* ---------- OC.s2 — длина одной микротрубочки (02, 2.8) ---------- */
  const TUB = { low: 0.5, mid: 1.0, high: 1.5 };
  const G_INTERVAL = { low: 4, mid: 6, high: 9 }, G_INTERVAL_CATF = { low: 2, mid: 3, high: 4 };
  const P2 = { VS: 3.0, R_TIME: 1.0, N0: 2.0, T_END: 24.0, DT: 0.5 };
  const Q = [1.0, 1.5, 0.5, 1.0, 1.5, 0.5, 1.0, 1.5];
  function s2(tub = 'mid', catf = false, rescue = false, nohydro = false, T = P2.T_END) {
    const vg = TUB[tub], G = (catf ? G_INTERVAL_CATF : G_INTERVAL)[tub], { VS, R_TIME, N0, DT } = P2;
    let t = 0, L = 0, phase = 'grow', tin = 0, k = 0;
    const pts = [[0, 0]], events = [];
    while (t < T - 1e-9) {
      const t2 = pyRound(t + DT, 6);
      if (phase === 'grow') {
        L = L + vg * DT; tin += DT;
        if (!nohydro && tin >= G * Q[k % Q.length] - 1e-9) { phase = 'shrink'; tin = 0; k += 1; events.push(['catastrophe', t2, r3(L)]); }
      } else if (phase === 'shrink') {
        L = Math.max(0, L - VS * DT); tin += DT;
        if (L <= 1e-9) { L = 0; phase = 'wait'; tin = 0; events.push(['full_loss', t2, 0]); }
        else if (rescue && tin >= R_TIME - 1e-9) { phase = 'grow'; tin = 0; events.push(['rescue', t2, r3(L)]); }
      } else if (phase === 'wait') {
        tin += DT;
        if (tin >= N0 - 1e-9) { phase = 'grow'; tin = 0; events.push(['renucleation', t2, 0]); }
      }
      t = t2; pts.push([t, r3(L)]);
    }
    const Ls = pts.map(p => p[1]);
    return { points: pts, events,
      n_cat: events.filter(e => e[0] === 'catastrophe').length, n_res: events.filter(e => e[0] === 'rescue').length,
      n_loss: events.filter(e => e[0] === 'full_loss').length,
      L_max: Math.max(...Ls), L_mean: r2(Ls.reduce((a, b) => a + b, 0) / Ls.length), L_end: Ls[Ls.length - 1] };
  }
  /* фаза в момент t (для анимации и подписи конца): grow | shrink | wait */
  function s2_phase(o, t) {
    let ph = 'grow';
    for (const e of o.events) { if (e[1] > t + 1e-9) break; ph = e[0] === 'catastrophe' ? 'shrink' : e[0] === 'full_loss' ? 'wait' : 'grow'; }
    return ph;
  }
  function s2_len(o, t) { const i = Math.max(0, Math.min(o.points.length - 1, Math.round(t / P2.DT))); return o.points[i][1]; }

  /* тредмиллинг (02, 2.8; панель В): длина постоянна, метка смещается от плюс-конца к минус-концу */
  function treadmill(L0 = 10, rate = 1.0, T = 12) {
    const pos = []; for (let t = 0; t <= T; t++) pos.push(rate * t);
    return { L: pos.map(() => L0), label_pos_from_plus: pos.map(p => (p <= L0 ? p : null)), t_exit: L0 / rate };
  }

  /* ---------- OC.s3 / OC.a3 — мотор, ориентация, направление (02, 3.8; 03, И3.7) ---------- */
  const MOTOR_DIR = { kinesin1: '+', dynein: '-' };
  const OPP = { periphery: 'center', center: 'periphery', basal: 'apical', apical: 'basal', terminal: 'soma', soma: 'terminal', dtip: 'soma_d', soma_d: 'dtip' };
  function s3(motor, plus_toward) { const d = MOTOR_DIR[motor]; return [d, d === '+' ? plus_toward : OPP[plus_toward]]; }
  function a3_drift(motor, frac_plus_out, v = 1.0) { const s = MOTOR_DIR[motor] === '+' ? 1 : -1; return r3(s * v * (2 * frac_plus_out - 1)) || 0; }

  /* ---------- OC.s4 / OC.a4 — замкнутый пул актина у переднего края (02, 4.8; 03, И4.8) ---------- */
  function s4(kp = 0.3, kd = 0.1, G0 = 80.0, N = 100.0, e = 1.0, T = 20, a = 0.1, barrier = false) {
    if (barrier) { kp = kp / 2; e = 0.0; }
    let G = G0, F = N - G0, X = 0;
    const rows = [{ t: 0, G: r2(G), F: r2(F), Jpol: r2(kp * G), X: 0 }];
    for (let t = 1; t <= T; t++) {
      const Jp = kp * G, Jd = kd * F;
      G = G - Jp + Jd; F = F + Jp - Jd;
      if (!(G >= -1e-9 && F >= -1e-9 && Math.abs(G + F - N) < 1e-6)) throw new Error('OC.s4: нарушен закон сохранения');
      X += e * Jp * a;
      rows.push({ t, G: r2(G), F: r2(F), Jpol: r2(kp * G), X: r2(X) });
    }
    return rows;
  }
  /* то же с именованными параметрами (сцены и «Объяснения»: {kp, kd, G0, e, T, barrier}) */
  const s4o = (o = {}) => s4(o.kp ?? 0.3, o.kd ?? 0.1, o.G0 ?? 80, 100, o.e ?? 1, o.T ?? 20, 0.1, !!o.barrier);
  function steady(kp, kd, N = 100.0) { if (kp + kd === 0) return null; const G = kd * N / (kp + kd); return [r2(G), r2(N - G), r2(kp * G)]; }

  function actomyosin(myosin = true, atp = true, L0 = 10.0, step = 0.5, T = 8) {
    let L = L0; const out = [L];
    for (let i = 0; i < T; i++) { if (myosin && atp) L = Math.max(6.0, L - step); out.push(L); }
    return out;
  }
  function autoreg(protein, free_change) { return free_change === '+' ? '-' : '+'; }

  /* ---------- OC.a2 — достижение мишени (03, И2) ---------- */
  /* порт random.Random Python: MT19937, seed(int) → init_by_array([seed]), random() — 53 бита, randrange(n) — getrandbits */
  function MT(seed) {
    const mt = new Uint32Array(624); let mti = 625;
    const mul = (a, b) => (Math.imul(a, b) >>> 0);
    function init_genrand(s) { mt[0] = s >>> 0; for (mti = 1; mti < 624; mti++) { const p = mt[mti - 1] ^ (mt[mti - 1] >>> 30); mt[mti] = (mul(1812433253, p) + mti) >>> 0; } }
    function init_by_array(key) {
      init_genrand(19650218); let i = 1, j = 0; const n = key.length;
      for (let k = Math.max(624, n); k; k--) {
        const p = mt[i - 1] ^ (mt[i - 1] >>> 30);
        mt[i] = ((mt[i] ^ mul(p, 1664525)) + key[j] + j) >>> 0; i++; j++;
        if (i >= 624) { mt[0] = mt[623]; i = 1; } if (j >= n) j = 0;
      }
      for (let k = 623; k; k--) {
        const p = mt[i - 1] ^ (mt[i - 1] >>> 30);
        mt[i] = ((mt[i] ^ mul(p, 1566083941)) - i) >>> 0; i++;
        if (i >= 624) { mt[0] = mt[623]; i = 1; }
      }
      mt[0] = 0x80000000;
    }
    function u32() {
      let y;
      if (mti >= 624) {
        for (let kk = 0; kk < 624; kk++) {
          y = (mt[kk] & 0x80000000) | (mt[(kk + 1) % 624] & 0x7fffffff);
          mt[kk] = mt[(kk + 397) % 624] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
        }
        mti = 0;
      }
      y = mt[mti++];
      y ^= (y >>> 11); y ^= (y << 7) & 0x9d2c5680; y ^= (y << 15) & 0xefc60000; y ^= (y >>> 18);

    return G(g, `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${C.nuc}"/>` +
      mem(BF.ellipsePts(cx, cy, rx, ry, 64), { closed: true }, k) + mem(BF.ellipsePts(cx, cy, rx - 17 * k * 1.15, ry - 17 * k * 1.15, 60), { closed: true }, k));
  }

  /* ---------- полимеры ---------- */
  /* точки вдоль отрезка */
  const along = (x0, y0, x1, y1, n) => Array.from({ length: n }, (_, i) => { const u = (i + .5) / n; return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u]; });
  /* актиновый филамент крупно: две закрученные цепочки глобул; o.n — число глобул в цепочке; o.nuc(i, n) → 'Т' | 'Д' | 'Д·Pi' | '' (i от плюс-конца);
     o.plus — 'r' | 'l' (где плюс-конец); o.signs — рисовать знаки концов; o.r — радиус глобулы */
  function actinFil(x0, y0, x1, y1, o = {}) {
    const n = o.n || 14, r = o.r || 8, L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = -uy, ny = ux, plusR = (o.plus || 'r') === 'r';
    let s = '';
    for (let ch = 0; ch < 2; ch++) for (let i = 0; i < n; i++) {

      const off = Math.sin(ph + ch * Math.PI) * r * .55, x = x0 + ux * L * u + nx * (off + (ch ? r * .5 : -r * .5)), y = y0 + uy * L * u + ny * (off + (ch ? r * .5 : -r * .5));
      const idx = plusR ? (n - 1 - i) : i, lab = o.nuc ? o.nuc(idx, n, ch) : '';
      const fill = lab === 'Т' ? C.actin : lab === 'Д·Pi' ? '#D9675B' : lab === 'Д' ? C.actinL : C.actin;
      s += `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${fill}" stroke="#fff" stroke-width="1.2"/>` +
        (lab ? `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(lab.length > 1 ? r * .62 : r * 1.15)}" font-weight="700" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">${esc(lab)}</text>` : '');
    }
    s = G(o.g || 'actin', s);
    if (o.signs !== false) { const pe = plusR ? [x1, y1] : [x0, y0], me = plusR ? [x0, y0] : [x1, y1]; s += endSign(pe[0] + ux * (plusR ? 16 : -16), pe[1] + uy * (plusR ? 16 : -16), '+', C.actinD) + endSign(me[0] - ux * (plusR ? 16 : -16), me[1] - uy * (plusR ? 16 : -16), '-', C.actinD); }
    return s;
  }
  /* микротрубочка сбоку: стенка из протофиламентов (полосы), гантели αβ: α — тёмная, β — светлая; o.plus — 'r' | 'l';
     o.cap — длина ГТФ-участка у плюс-конца (в субъединицах; буквы «Т»), o.letters — подписывать ГТФ/ГДФ; o.flare — изгиб концов (0…1) */
  function mtSide(x0, y, x1, o = {}) {
    const h = o.h || 34, rows = 5, d = h / rows, n = Math.max(2, Math.round((x1 - x0) / (d * 2))), w = (x1 - x0) / n, plusR = (o.plus || 'r') === 'r';
    let s = `<rect x="${f(x0)}" y="${f(y - h / 2)}" width="${f(x1 - x0)}" height="${f(h)}" rx="3" fill="${C.mtB}" opacity=".25"/>`;
    for (let r = 0; r < rows; r++) for (let i = 0; i < n; i++) {

           `<rect x="${f(xb + .6)}" y="${f(yy + .6)}" width="${f(w / 2 - 1.2)}" height="${f(d - 1.2)}" rx="${f(d / 3)}" fill="${isT ? '#55B97B' : C.mtB}"/>` +
           (o.letters && r === 2 ? `<text x="${f(xb + w / 4)}" y="${f(yy + d / 2)}" font-size="${f(d * .8)}" font-weight="700" fill="#14432A" style="text-anchor:middle;dominant-baseline:central;fill:#14432A">${isT ? 'Т' : 'Д'}</text>` : '');

    let s = P.map(([x, y], i) => `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 2.6}" fill="${i % 2 ? C.actin : C.actinD}"/>`).join('');
    s = G(o.g || 'actin', s);
    if (o.signs) { const ux = (x1 - x0) / L, uy = (y1 - y0) / L, k = o.sr || 6.5; s += endSign(x1 + ux * (k + 3), y1 + uy * (k + 3), '+', C.actinD, k) + endSign(x0 - ux * (k + 3), y0 - uy * (k + 3), '-', C.actinD, k); }

    const L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = -uy, ny = ux, w = o.w || 10, n = Math.max(3, Math.round(L / (w * 1.4)));

  const turc = (x, y, r = 6, g = 'turc') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="none" stroke="${C.turc}" stroke-width="3"/>`);
  /* центриоль в разрезе: девять групп по три кружка (триплеты) */

  function centrosome(cx, cy, o = {}) {

            `<ellipse cx="${f(x + dir * hx)}" cy="${f(y - 7 * sc)}" rx="${f(8 * sc)}" ry="${f(6.5 * sc)}" fill="${C.motorL}"/>` +

    (ys.ticks || []).forEach(v => { s += line(x - 4, Y(v), x, Y(v), C.muted, 1) + line(x, Y(v), x + w, Y(v), '#EEF1F4', 1) + T(x - 7, Y(v), ys.fmt ? ys.fmt(v) : String(v).replace('.', ','), { size: 10.5, col: C.muted, a: 'r' }); });
    if (xl) s += T(x + w / 2, y + h + 28, xl, { size: 11.5, col: C.muted });

GN.s2_a1 = (function () {

GN.s2_a3 = (function () {

     свой груз; он связывается со своей микротрубочкой и проходит по ней один пробег одинаковой длины — к плюс-концу (кинезин-1) или
     к минус-концу (динеин). Регулярных поперечных переходов одного груза между микротрубочками нет. Средний сдвиг на один груз

  const LANES = 10, X0 = 74, X1 = 500, Y0 = 145, DY = 18, XC = 287, RUN = 150, FR = 3;   /* RUN — длина одного пробега на схеме, px */
  const ORDER = [0, 5, 2, 7, 4, 9, 1, 6, 3, 8];                                 /* какие дорожки направлены «наружу»: первые 10·f по этому порядку */
  const laneY = i => Y0 + i * DY;
  const fmtD = v => v > 0 ? '+' + num(v, 1) : v < 0 ? num(v, 1) : '0';
  const outSet = f => new Set(ORDER.slice(0, Math.round(LANES * f)));

  function events(motor, f) {

    return Array.from({ length: LANES }, (_, lane) => ({ lane, out: out.has(lane), dir: s * (out.has(lane) ? 1 : -1) }));
  }
  const meanShift = ev => ev.reduce((a, e) => a + e.dir, 0) / ev.length;
  function motorGlyph(x, y, motor) {
    if (motor === 'kinesin1') return G('kinesin', `<ellipse cx="${f(x - 3.4)}" cy="${f(y - 2)}" rx="3.4" ry="2.8" fill="${C.motor}"/><ellipse cx="${f(x + 3.4)}" cy="${f(y - 2)}" rx="3.4" ry="2.8" fill="${C.motorL}"/>`);
    let s = ''; for (let i = 0; i < 6; i++) { const a = i / 6 * 2 * Math.PI; s += `<circle cx="${f(x + Math.cos(a) * 3.6)}" cy="${f(y - 3 + Math.sin(a) * 3.6)}" r="1.9" fill="${i % 2 ? C.motor : C.motorL}"/>`; }

    for (let i = 0; i <= 16; i++) { const a = -Math.PI / 2 + i / 16 * Math.PI; pts.push([xe + rc * .55 * Math.cos(a), top + rc + rc * Math.sin(a)]); }
    for (let x = xe; x >= -30; x -= 12) pts.push([x, bot]);

    s += T(14, top - 16, t('s2_a3g_body'), { a: 'l', size: 11.5, w: 600, col: C.muted }) + T(586, top - 16, t('s2_a3g_end'), { a: 'r', size: 11.5, w: 600, col: C.muted });

      if (!wait && !fin && o.k > 0) {

})();
