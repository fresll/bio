 микротрубочки аксона обращены плюс-концом к окончанию", "s2_t3_s4_q": "Какой мотор переносит такой груз?", "s2_t3_s4_o1": "Плюс-направленный мотор, например кинезин-1", "s2_t3_s4_x1": "Верно. В аксоне плюс-концы обращены к окончанию, поэтому перенос от тела нейрона к окончанию идёт к плюс-концу", "s2_t3_s4_o2": "Цитоплазматический динеин", "s2_t3_s4_x2": "Динеин движется к минус-концам, то есть в аксоне — к телу нейрона. Он обеспечивает обратный перенос", "s2_t3_s4_o3": "Любой: в аксоне оба мотора движутся к окончанию", "s2_t3_s4_x3": "В аксоне ориентация микротрубочек одна, поэтому два мотора движутся в противоположные стороны", "s2_t3_s4_o4": "Ни один: в аксоне груз перемещается вместе с растущими микротрубочками", "s2_t3_s4_x4": "Рост микротрубочек не переносит везикулы; груз переносят моторы, шагая по стенке", "s2_t3_s4_h1": "Куда обращены плюс-концы в аксоне?", "s2_t3_s4_h2": "Груз движется от тела нейрона — к плюсу или к минусу?", "s2_t3_s4_h3": "Свяжите направление груза с концом микротрубочки, к которому он идёт, и вспомните, какие моторы шагают к этому концу", "s2_t3_s4_e": "Если ориентация пути известна, направление движения груза позволяет определить, мотор какого направления его везёт: к плюс-концу — кинезин-1 (или другой плюс-направленный кинезин), к минус-концу — динеин. Аксоны длиной до метра показывают, насколько важен этот перенос", "s2_t3_s4_bio": "18", "s2_t3_s5_cond": "Панель Б, эпителиальная клетка кишки. Минус-концы микротрубочек закреплены у апикальной стороны (обращённой в просвет кишки), плюс-концы — у базальной стороны. Груз на кинезине-1", "s2_t3_s5_q": "Куда переместится груз?", "s2_t3_s5_o1": "К базальной стороне клетки", "s2_t3_s5_x1": "Верно. Плюс-концы здесь у базальной стороны, и плюс-направленный кинезин-1 везёт туда", "s2_t3_s5_o2": "К периферии, как в клетке соединительной ткани", "s2_t3_s5_x2": "В эпителиальной клетке сеть не радиальная: «периферия» есть со всех сторон, но плюс-концы — только у базальной стороны", "s2_t3_s5_o3": "К апикальной стороне: кинезин везёт груз к мембране, обращённой наружу", "s2_t3_s5_x3": "Кинезин-1 везёт к плюс-концам, а у апикальной стороны — минус-концы. Туда груз доставит динеин", "s2_t3_s5_o4": "К центросоме у ядра", "s2_t3_s5_x4": "Кинезин-1 движется к плюс-концам, а у центросомы — минус-концы. Кроме того, в эпителии главный центр организации расположен у апикальной стороны, а не у ядра", "s2_t3_s5_h1": "Где в этой клетке плюс-концы?", "s2_t3_s5_h2": "Посмотрите на знаки «+» и «−» на вертикальных микротрубочках", "s2_t3_s5_h3": "Свяжите две вещи: к какому концу шагает кинезин-1 и у какой стороны этой клетки находится этот конец", "s2_t3_s5_e": "Один и тот же мотор в разных клетках переносит груз в разные стороны, потому что микротрубочки ориентированы по-разному. Фраза «кинезин везёт к мембране» верна только для клеток с радиальной сетью", "s2_t3_s5_bio": "18 19", "s2_t3_s6_cond": "Панель В. В клетке соединительной ткани истощили АТФ. Микротрубочки за время наблюдения (минуты) сохраняются", "s2_t3_s6_q": "Что произойдёт с двумя грузами?", "s2_t3_s6_o1": "Оба остановятся: и кинезину-1, и динеину для шагов нужен гидролиз АТФ", "s2_t3_s6_x1": "Верно. Без АТФ моторы не могут совершать циклы шагов; микротрубочки при этом остаются на месте", "s2_t3_s6_o2": "Остановится только груз кинезина: динеин использует ГТФ", "s2_t3_s6_x2": "Оба мотора используют АТФ. ГТФ связан с тубулином, а не с моторами", "s2_t3_s6_o3": "Оба продолжат движение: энергия для движения запасена в микротрубочке", "s2_t3_s6_x3": "Энергия гидролиза ГТФ в стенке микротрубочки идёт на её разборку, а не на движение моторов", "s2_t3_s6_o4": "Грузы поменяют направление на противоположное", "s2_t3_s6_x4": "Нехватка АТФ не меняет направление моторов; они просто перестают шагать", "s2_t3_s6_h1": "Какой нуклеотид расходуют моторы?", "s2_t3_s6_h2": "Нужен ли АТФ обоим моторам?", "s2_t3_s6_h3": "Подумайте, что станет с каждым шагом мотора, если источника энергии для шага нет", "s2_t3_s6_e": "Моторы — АТФазы: каждый шаг сопряжён с гидролизом АТФ. Остановка транспорта при нехватке АТФ не означает разрушения путей", "s2_t3_s6_bio": "16", "s2_t3_rev_q": "В эпителиальной клетке груз движется к апикальной стороне. Ориентация показана на схеме: минус-концы у апикальной стороны. Какой мотор вероятнее всего везёт груз?", "s2_t3_rev_o1": "Цитоплазматический динеин", "s2_t3_rev_x1": "Да: движение к минус-концам", "s2_t3_rev_o2": "Кинезин-1", "s2_t3_rev_x2": "Кинезин-1 вёз бы к плюс-концам, то есть к базальной стороне", "s2_t3_rev_o3": "Любой из двух моторов", "s2_t3_rev_x3": "При известной ориентации пути два мотора движутся в противоположные стороны", "s2_t3_rev_o4": "Миозин, связанный с грузом", "s2_t3_rev_x4": "Миозины движутся по актиновым филаментам; здесь путь — микротрубочка", "s2_t3_cond": "Моторы модели: кинезин-1 — движется к плюс-концу микротрубочки; цитоплазматический динеин — движется к минус-концу. Другие кинезины здесь не рассматриваются: есть кинезины, движущиеся к минус-концу. Панель А: одна микротрубочка в пробирке. Панель Б: три типа клеток. Панель В: уровень АТФ", "s2_t3_expl": "Кинезины и цитоплазматический динеин — моторные белки, которые, гидролизуя АТФ, шагают по микротрубочке в определённую сторону: кинезин-1 — к плюс-концу, динеин — к минус-концу. Куда в клетке попадёт груз, зависит от того, как ориентированы микротрубочки: в клетках с радиальной сетью плюс-концы на периферии, в аксоне — у окончания, в эпителиальной клетке — у базальной стороны, а в дендритах ориентации смешанные. Поэтому направление мотора и направление груза в клетке — разные величины", "s2_t3_limits": "На одной везикуле часто находятся и кинезины, и динеины; какой из них активен, регулируют белки-адаптеры, и груз может менять направление. В модели на грузе один мотор. Кинезинов у человека 45; некоторые движутся к минус-концу, некоторые разбирают микротрубочки. Скорость движения условная. Ориентация микротрубочек в дендритах смешанная — это разбирает продвинутый уровень", "s2_t3_how": "Направление мотора определили в пробирке: очищенный мотор, прикреплённый к стеклу, перемещал микротрубочки с помеченным концом, а микротрубочки, прикреплённые к стеклу, перемещали бусины с мотором. Ориентацию микротрубочек в отростках нейронов определяют по тому, в какую сторону растут их концы: растут в основном плюс-концы, а белки, связывающиеся только с растущими концами, светятся именно у них", "s2_t3_title": "3. Моторные белки и направление транспорта", "s2_t4_s1_cond": "Панель А, лупа на сеть у мембраны. Схема скрыта до ответа", "s2_t4_s1_q": "Как ориентированы филаменты сети у переднего края и где присоединяются новые субъединицы?", "s2_t4_s1_o1": "Плюс-концы обращены к мембране; АТФ-актин присоединяется к ним у самой мембраны", "s2_t4_s1_x1": "Верно. Быстрорастущие плюс-концы упираются в мембрану, и сборка идёт именно там. Минус-концы обращены вглубь, где сеть разбирается", "s2_t4_s1_o2": "Минус-концы обращены к мембране; сборка идёт с них, потому что они ближе к краю", "s2_t4_s1_x2": "Минус-конец растёт медленно. У переднего края к мембране обращены плюс-концы", "s2_t4_s1_o3": "Филаменты лежат вдоль мембраны; субъединицы присоединяются по всей их длине", "s2_t4_s1_x3": "Субъединицы присоединяются только к концам филамента. Новые ветви начинаются на боковой поверхности, но растут тоже концом", "s2_t4_s1_o4": "Ориентация случайна; сборка идёт по всей сети одинаково", "s2_t4_s1_x4": "Сеть у края ориентирована: плюс-концы обращены вперёд, иначе сборка не толкала бы мембрану в одну сторону", "s2_t4_s1_h1": "Какой конец актинового филамента растёт быстро?", "s2_t4_s1_h2": "Где сеть должна расти, чтобы толкать мембрану?", "s2_t4_s1_h3": "Вспомните, к какому концу субъединицы присоединяются быстрее, и найдите этот конец у края клетки", "s2_t4_s1_e": "Ламеллиподия — плоский выступ края, заполненный ветвящейся сетью актина. Новые филаменты начинаются как ветви на боковой поверхности старых (их нуклеирует комплекс Arp2/3), и все растут плюс-концом к мембране", "s2_t4_s1_bio": "22 23", "s2_t4_s2_cond": "Панель А, вставка «броуновский храповик». Мембрана у конца филамента колеблется из-за теплового движения молекул", "s2_t4_s2_q": "Как сборка актина создаёт силу, толкающую мембрану?", "s2_t4_s2_o1": "Субъединица встраивается в открывшийся зазор и не даёт мембране вернуться", "s2_t4_s2_x1": "Верно. Сила возникает при присоединении субъединиц к концам, упирающимся в мембрану. Энергию даёт само присоединение; её запас поддерживает высокая концентрация АТФ-актина, которую клетка создаёт, расходуя АТФ", "s2_t4_s2_o2": "Миозин тянет филаменты к мембране и выдавливает её наружу", "s2_t4_s2_x2": "Выпячивание при сборке актина происходит и без миозина: его сила — другая, сокращение (панель Б)", "s2_t4_s2_o3": "Гидролиз АТФ на самом конце филамента отталкивает мембрану", "s2_t4_s2_x3": "АТФ в субъединице гидролизуется после встраивания, уже в глубине филамента; толкающее действие создаёт само присоединение у мембраны", "s2_t4_s2_o4": "Мембрана выпячивается сама, а филаменты лишь заполняют место", "s2_t4_s2_x4": "Без сборки актина мембрана, натянутая кортексом, возвращается назад. Филаменты не просто заполняют место: они удерживают каждый новый шаг", "s2_t4_s2_h1": "Что не даёт мембране вернуться после колебания?", "s2_t4_s2_h2": "Посмотрите, что появляется в зазоре", "s2_t4_s2_h3": "Встроенная субъединица работает как «храповик»", "s2_t4_s2_e": "Механизм называют броуновским храповиком: случайные колебания мембраны становятся направленным движением, потому что встраивание субъединицы делает каждый шаг необратимым. Сила зависит от скорости сборки, числа филаментов, их угла к мембране и сцепления сети", "s2_t4_s2_bio": "23", "s2_t4_s3_cond": "Панель А. Разборка позади края остановлена (кофилин неактивен); сборка у мембраны продолжается; общее количество актина 100", "s2_t4_s3_q": "Что произойдёт за 20 шагов?", "s2_t4_s3_o1": "Свободный пул почти исчерпается, сборка замедлится, и край остановится", "s2_t4_s3_x1": "Верно: G падает с 80 до 2,26 к t = 10 и до 0,06 к t = 20; край продвигается на 7,99 у.е.д. вместо 19,12 и после t ≈ 10 почти стоит. Без разборки субъединицы не возвращаются в пул", "s2_t4_s3_o2": "Край будет двигаться быстрее: вся энергия идёт на сборку, а не на разборку", "s2_t4_s3_x2": "Разборка не отнимает энергию у сборки, а возвращает субъединицы в пул. Без неё пул пустеет", "s2_t4_s3_o3": "Ничего не изменится: свободного актина в клетке неограниченно много", "s2_t4_s3_x3": "В модели общее количество актина постоянно. Каждая субъединица в сети — это субъединица, которой нет в пуле", "s2_t4_s3_o4": "Сеть сразу развалится и край втянется", "s2_t4_s3_x4": "Без разборки сеть, наоборот, сохраняется и накапливает актин (F → 100); просто ей не из чего расти дальше", "s2_t4_s3_h1": "Откуда берутся субъединицы для сборки у мембраны?", "s2_t4_s3_h2": "Куда уходят субъединицы, если их не возвращает разборка?", "s2_t4_s3_h3": "Проследите, откуда сборка у мембраны получает субъединицы, если они не возвращаются из сети", "s2_t4_s3_e": "Устойчивое выпячивание требует непрерывного обновления сети: сборки впереди и разборки позади. Сеть у края напоминает тредмиллинг отдельного филамента, но это свойство всей сети. В большинстве немышечных клеток позвоночных около половины актина находится в свободной форме: его удерживают белки, связывающие мономер", "s2_t4_s3_bio": "24", "s2_t4_s4_cond": "Панель А. Разборка идёт; сеть не сцеплена с подложкой (клетка на поверхности, к которой не прикрепляется)", "s2_t4_s4_q": "Что покажет модель за 20 шагов?", "s2_t4_s4_o1": "Сборка та же, но край продвигается намного меньше", "s2_t4_s4_x1": "Верно: J = 7,5 за шаг, как в норме, но X = 3,82 вместо 19,12. Чтобы толкать мембрану вперёд, сеть должна опираться на подложку", "s2_t4_s4_o2": "Сборка остановится: без сцепления субъединицы не нужны", "s2_t4_s4_x2": "Сборка у мембраны от сцепления не зависит: G и F меняются так же, как в норме", "s2_t4_s4_o3": "Край будет двигаться так же: сила приложена к мембране", "s2_t4_s4_x3": "Сила действует в обе стороны: на мембрану вперёд и на сеть назад. Без опоры сеть сдвигается назад, и выдвижение края уменьшается", "s2_t4_s4_o4": "Вся клетка начнёт смещаться назад", "s2_t4_s4_x4": "Край продолжает выдвигаться, но медленнее; движения клетки назад модель не предсказывает", "s2_t4_s4_h1": "На что опирается сеть, толкая мембрану?", "s2_t4_s4_h2": "Зависит ли присоединение субъединиц у мембраны от сцепления сети с подложкой?", "s2_t4_s4_h3": "Сравните, меняется ли присоединение субъединиц у мембраны и куда при этом смещается сеть", "s2_t4_s4_e": "Полимеризация создаёт силу, но выдвижение края требует, чтобы сеть была сцеплена с подложкой через белки адгезии. Без сцепления значительная часть сборки уходит на движение сети назад — ретроградный поток", "s2_t4_s4_bio": "26", "s2_t4_s5_cond": "Панель Б и панель А одновременно. Миозин II подавлен; АТФ есть", "s2_t4_s5_q": "Что изменится?", "s2_t4_s5_o1": "Пучок не сокращается, а край выдвигается", "s2_t4_s5_x1": "Верно. Сокращение создаёт миозин II, стягивая антипараллельные филаменты; выпячивание края создаёт сборка актина. Это две разные силы", "s2_t4_s5_o2": "Остановятся и сокращение, и выпячивание", "s2_t4_s5_x2": "Выпячивание в модели не зависит от миозина: сила возникает при присоединении субъединиц к плюс-концам у мембраны", "s2_t4_s5_o3": "Пучок сократится сильнее: филаменты сблизятся сами", "s2_t4_s5_x3": "Без миозина нет силы, сдвигающей филаменты относительно друг друга: длина пучка остаётся 10", "s2_t4_s5_o4": "Край втянется: миозин удерживает сеть у мембраны", "s2_t4_s5_x4": "Миозин не удерживает сеть у мембраны; в модели ламеллиподия выдвигается так же, как раньше", "s2_t4_s5_h1": "Какой белок создаёт сокращение?", "s2_t4_s5_h2": "Нужен ли миозин для встраивания субъединиц у мембраны?", "s2_t4_s5_h3": "Разделите две силы: какой из них нужен миозин, а какой — только сборка актина", "s2_t4_s5_e": "Актомиозиновое сокращение: головки миозина II, гидролизуя АТФ, тянут антипараллельные филаменты навстречу друг другу. Так работают сократительное кольцо при делении клетки, стрессовые волокна и натяжение кортекса, а в мышце — саркомеры. Полимеризационная сила — толчок; актомиозиновая — стягивание", "s2_t4_s5_bio": "25", "s2_t4_s6_cond": "Панель В, левая часть. Клетку обработали веществом, которое переводит большую часть актина в филаменты. Наблюдают синтез актина в следующие часы", "s2_t4_s6_q": "Как изменится синтез актина?", "s2_t4_s6_o1": "Возрастёт: свободного актина стало меньше", "s2_t4_s6_x1": "Верно. Количество свободного G-актина служит сигналом: когда его мало, клетка синтезирует больше актина", "s2_t4_s6_o2": "Снизится: актина и так много в филаментах", "s2_t4_s6_x2": "Сигналом служит не общее количество актина, а количество свободного G-актина, а его стало меньше", "s2_t4_s6_o3": "Не изменится: синтез не зависит от состояния актина", "s2_t4_s6_x3": "Синтез актина зависит от количества свободного мономера: это авторегуляция", "s2_t4_s6_o4": "Прекратится: синтезировать не из чего", "s2_t4_s6_x4": "Актин синтезируется из аминокислот на рибосомах, а не из свободного актина", "s2_t4_s6_h1": "Что служит сигналом — свободный или полимерный актин?", "s2_t4_s6_h2": "Свободного актина стало больше или меньше?", "s2_t4_s6_h3": "Определите, как изменилось количество свободного актина, и примените правило авторегуляции", "s2_t4_s6_e": "Клетка связывает количество свободной субъединицы с синтезом этого белка. Это поддерживает запас мономера, без которого невозможна сборка (шаг 3)", "s2_t4_s6_bio": "27", "s2_t4_s7_cond": "Панель В. В одной и той же клетке одновременно действуют два вещества: одно переводит большую часть актина в филаменты, другое разбирает микротрубочки, так что свободного тубулина становится много. Наблюдают синтез актина и тубулина в следующие часы", "s2_t4_s7_q": "Как изменится синтез двух белков?", "s2_t4_s7_o1": "Актина — возрастёт, тубулина — снизится", "s2_t4_s7_x1": "Верно. Сигнал для каждого белка — количество его свободной формы: свободного актина стало меньше, свободного тубулина — больше. Принцип один (отрицательная обратная связь), а пути разные: у актина — через белок, который переходит в ядро, у тубулина — через разрушение мРНК во время синтеза", "s2_t4_s7_o2": "Обоих — возрастёт: клетке нужно восстановить цитоскелет", "s2_t4_s7_x2": "Синтез не «восстанавливает» цитоскелет по потребности: он следует за количеством свободной субъединицы. Свободного тубулина стало больше — его синтез снижается", "s2_t4_s7_o3": "Обоих — снизится: полимеров в клетке стало меньше", "s2_t4_s7_x3": "Актиновых филаментов стало больше, а не меньше; и сигнал — не количество полимера, а свободная форма каждого белка", "s2_t4_s7_o4": "Актина — снизится, тубулина — возрастёт", "s2_t4_s7_x4": "Направления перепутаны: меньше свободного актина — синтез актина выше; больше свободного тубулина — синтез тубулина ниже", "s2_t4_s7_h1": "Что служит сигналом для синтеза каждого белка?", "s2_t4_s7_h2": "Как изменилось количество свободного актина и свободного тубулина?", "s2_t4_s7_h3": "Для каждого белка отдельно определите, свободной формы стало больше или меньше, и примените правило авторегуляции", "s2_t4_s7_e": "Актин и тубулин поддерживают запас свободных субъединиц одним принципом — отрицательной обратной связью, — но разными путями: у актина свободный G-актин удерживает в цитоплазме белок MRTF, который в ядре усиливает работу генов цитоскелета; у тубулина избыток свободного белка запускает разрушение его мРНК во время синтеза. Названия белков для коллоквиума не требуются", "s2_t4_s7_bio": "27", "s2_t4_rev_q": "В двух клетках край почти перестал выдвигаться. В клетке 1 свободный G-актин почти исчез, сеть у края плотная. В клетке 2 свободного G-актина столько же, сколько в норме, а сеть у края быстро смещается назад. Какие причины вероятны?", "s2_t4_rev_o1": "1 — нет разборки; 2 — нет сцепления", "s2_t4_rev_x1": "Да: исчезновение пула указывает на нарушенный возврат субъединиц, а нормальный пул с движением сети назад — на отсутствие опоры", "s2_t4_rev_o2": "1 — нет сцепления; 2 — нет разборки", "s2_t4_rev_x2": "Наоборот: без сцепления пул в норме, а при остановке разборки он исчезает", "s2_t4_rev_o3": "В обеих подавлен миозин II", "s2_t4_rev_x3": "Выпячивание края от миозина не зависит, и пул актина миозин не меняет", "s2_t4_rev_o4": "В обеих не хватает актина в клетке", "s2_t4_rev_x4": "В клетке 2 свободного актина столько же, сколько в норме", "s2_t4_cond": "Объект — край ползущей клетки соединительной ткани на подложке (ламеллиподия) за 20 условных шагов времени. Общее количество актина в модели постоянно: 100 условных единиц субъединиц (G + F = 100). Панель А: сеть у края. Панель Б: актомиозиновый пучок. Панель В: свободный пул и синтез", "s2_t4_expl": "Актин присоединяется к плюс-концам в форме АТФ-актина; у переднего края плюс-концы ветвящейся сети упираются в мембрану, и каждое встраивание субъединицы в зазор, открытый тепловым колебанием, отодвигает мембрану. Позади края кофилин разбирает старые участки АДФ-актина, и субъединицы возвращаются в свободный пул. Поскольку общее количество актина ограничено, выпячивание продолжается, только пока сборка и разборка уравновешены. Чтобы край выдвигался, сеть должна опираться на подложку; чтобы перемещалась вся клетка, нужны ещё сокращение актомиозина и открепление заднего края. Миозин II создаёт другую силу — стягивание антипараллельных филаментов", "s2_t4_limits": "Скорости сборки и разборки в модели пропорциональны пулу и количеству филаментов; в клетке их регулируют многие белки (профилин, кэпирующий белок, кофилин, Arp2/3, формины), и механизм различается в разных клетках. Модель не показывает силу в пиконьютонах и натяжение мембраны; влияние препятствия показано только замедлением присоединения, а уплотнение сети под нагрузкой не изображено. Смещение края — не перемещение всей клетки: для этого нужны новые контакты впереди, сокращение актомиозина и открепление сзади; центр клетки в модели не движется. Авторегуляция показана только направлением изменения, без времени и величины", "s2_t4_how": "Сборку у края увидели, помечая актин флуоресцентной меткой в живых клетках: метка появлялась у мембраны и смещалась вглубь, где исчезала. Силу полимеризации показали без миозина: в пробирке актин и ещё три очищенных белка, собираясь на поверхности бактерии, толкали её вперёд", "s2_t4_title": "4. Актин: сборка, сила и обновление сети", "s2_t4a_rule": "За шаг присоединяется 0,3 × G субъединиц, отделяется 0,1 × F; G + F = 100 всегда; отрицательных значений нет. Край смещается на 0,1 у.е.д. на каждую присоединённую субъединицу, если сеть сцеплена с подложкой; без сцепления сеть отъезжает назад, и край смещается в 5 раз меньше; при препятствии край не смещается, а присоединение замедляется вдвое. Центр клетки в модели не смещается: нет отрыва и подтягивания заднего края. В начале пул больше стационарного, поэтому первые шаги — переходный период. Доля свободного актина в модели (25 %) условная; в клетке около половины актина удерживают в свободной форме белки, связывающие мономер", "s2_int_cell": "Условная эпителиальная клетка в культуре. Наблюдение в течение часа", "s2_int_obs": "(1) клетка округлилась, выпячиваний края нет; (2) лизосомы не доходят до периферии клетки: перенос к периферии нарушен; (3) при растяжении клеточного слоя клетки разрываются", "s2_int_limits": "Признаки в модели либо есть, либо нет; в клетке они бывают частичными и развиваются во времени. Список причин ограничен шестью; в клетке причин больше, и системы влияют друг на друга. Модель не говорит, какая причина чаще встречается", "s2_intro": "На этой странице четыре учебные модели цитоскелета — системы белковых полимеров, которые придают клетке форму и прочность, перемещают внутри неё груз и создают механическую силу. В каждой вкладке сначала прочитайте условия и сделайте прогноз, затем измените условия модели и сравните наблюдение с прогнозом, затем объясните результат. Для работы нужны школьные знания о белках и о том, что АТФ — источник энергии в клетке, а также строение мембраны из семинара 1. Новые понятия вводятся в тексте перед задачей; их определения — в словаре на странице «Объяснения»", "s2_int_rule": "Каждая причина вызывает свой набор признаков (таблица ниже). Наблюдаемая картина — сумма признаков всех причин. Принимаются минимальные наборы причин (не более трёх): ни одну причину из набора нельзя убрать без потери признака", "s2_int_p1": "Выпишите наблюдения — без толкования", "s2_int_p2": "Отметьте все наборы причин, совместимые с наблюдениями", "s2_int_p3": "Выберите не более трёх измерений, которые различат все отмеченные гипотезы", "s2_int_p4": "Назовите ограничения вывода", "s2_a1_s1_cond": "Функция актиновых филаментов снижена до 0,5, остальные — норма. Нагрузка — выпячивание поверхности", "s2_a1_s1_q": "Какой будет исход?", "s2_a1_s1_o1": "Ослаблено", "s2_a1_s1_x1": "Верно. Главная система на уровне 0,5: выпячивания образуются, но слабее", "s2_a1_s1_o2": "Нарушено", "s2_a1_s1_x2": "Нарушение в модели — при уровне главной системы 0,2; на 0,5 функция частично сохраняется", "s2_a1_s1_o3": "Сохранено: микротрубочки заменят актин", "s2_a1_s1_x3": "Микротрубочки — вспомогательная система: они влияют на направленность, но выпячивание не создают", "s2_a1_s1_o4": "Без чисел силы не определить", "s2_a1_s1_x4": "Модель качественная: исход задаёт правило главной и вспомогательной системы", "s2_a1_s1_h1": "Какая система главная для выпячивания?", "s2_a1_s1_h2": "Уровень 0,5 — это сильное или умеренное снижение?", "s2_a1_s1_h3": "Сравните уровень главной системы с порогами правила: 0,2 и 0,5", "s2_a1_s1_e": "Частичное снижение функции даёт частичный эффект: модель не делит исходы на «есть» и «нет»", "s2_a1_s1_bio": "6", "s2_a1_s2_cond": "Промежуточные филаменты — 1,0, актиновые филаменты — 0,2. Нагрузка — растяжение", "s2_a1_s2_q": "Какой будет исход?", "s2_a1_s2_o1": "Ослаблено", "s2_a1_s2_x1": "Верно. Даже при нормальной сети промежуточных филаментов клетка без кортекса хуже держит форму — кортекс вспомогательная система", "s2_a1_s2_o2": "Сохранено", "s2_a1_s2_x2": "Механика клетки — общая работа; кортекс участвует в сопротивлении деформации", "s2_a1_s2_o3": "Нарушено", "s2_a1_s2_x3": "Главная система для растяжения — промежуточные филаменты — в норме; нарушения нет", "s2_a1_s2_o4": "Нарушен только перенос груза", "s2_a1_s2_x4": "Перенос по микротрубочкам от актина в модели не зависит", "s2_a1_s2_h1": "Какая система главная для растяжения, а какая вспомогательная?", "s2_a1_s2_h2": "На каком уровне вспомогательная система?", "s2_a1_s2_h3": "Найдите в правиле, что происходит, когда сильно снижена вспомогательная система", "s2_a1_s2_e": "Ни одну механическую функцию нельзя приписать только одной системе", "s2_a1_s2_bio": "6", "s2_a1_s3_cond": "Нагрузка — растяжение и перенос груза одновременно. Микротрубочки — 0,5, промежуточные филаменты — 0,5, актиновые — 1,0", "s2_a1_s3_q": "Какими будут исходы?", "s2_a1_s3_o1": "Обе функции ослаблены", "s2_a1_s3_x1": "Верно. Главные системы обеих нагрузок на 0,5", "s2_a1_s3_o2": "Растяжение нарушено, перенос сохранён", "s2_a1_s3_x2": "Нарушение — только при 0,2 главной системы; перенос зависит от микротрубочек, а они снижены", "s2_a1_s3_o3": "Обе нарушены: два снижения усиливают друг друга", "s2_a1_s3_x3": "В модели исходы по нагрузкам независимы; взаимного усиления правило не задаёт — это ограничение модели", "s2_a1_s3_o4": "Обе сохранены: актин компенсирует", "s2_a1_s3_x4": "Актин не главная система ни для растяжения, ни для переноса", "s2_a1_s3_h1": "Какая система главная для каждой нагрузки?", "s2_a1_s3_h2": "На каком уровне эти две системы?", "s2_a1_s3_h3": "Обе главные — на 0,5", "s2_a1_s3_e": "Сочетание нагрузок выявляет сразу две ослабленные системы. В клетке взаимодействие систем может давать и неаддитивные эффекты — модель их не показывает", "s2_a1_s3_bio": "6", "s2_a1_rev_q": "У условной клетки нарушены и устойчивость к растяжению, и перенос груза; выпячивание не проверяли. Какие сочетания уровней A / M / I совместимы с наблюдением? Отметьте все", "s2_a1_rev_o1": "1,0 / 0,2 / 0,2", "s2_a1_rev_x1": "Совместимо: главные системы растяжения и переноса на 0,2", "s2_a1_rev_o2": "0,5 / 0,2 / 0,2", "s2_a1_rev_x2": "Совместимо: уровень актина на эти две нагрузки не влияет так, чтобы изменить «нарушено»", "s2_a1_rev_o3": "0,2 / 0,2 / 0,2", "s2_a1_rev_x3": "Совместимо", "s2_a1_rev_o4": "1,0 / 0,5 / 0,2", "s2_a1_rev_x4": "Перенос был бы ослаблен, а не нарушен", "s2_a1_rev_o5": "0,2 / 1,0 / 0,2", "s2_a1_rev_x5": "Перенос был бы сохранён", "s2_a1_rev_o6": "1,0 / 0,2 / 0,5", "s2_a1_rev_x6": "Растяжение было бы ослаблено, а не нарушено", "s2_a1_rev_o7": "0,2 / 0,2 / 1,0", "s2_a1_rev_x7": "Растяжение было бы ослаблено (из-за актина), а не нарушено", "s2_a1_rev_e": "Нарушение в модели требует уровня 0,2 главной системы. Уровень актина по этим двум нагрузкам не определяется", "s2_a1_rev2_q": "Какое дополнительное наблюдение различит три совместимых сочетания?", "s2_a1_rev2_o1": "Скорость выдвижения края", "s2_a1_rev2_x1": "Верно. Она равна уровню функции актина (1,0 / 0,5 / 0,2) и различает все три сочетания. Выпячивание само по себе различит только 0,2 («нарушено») от 1,0 и 0,5 (оба «ослаблено», потому что микротрубочки — вспомогательная система — на 0,2)", "s2_a1_rev2_o2": "Исход выпячивания", "s2_a1_rev2_x2": "Он отделит уровень 0,2, но 1,0 и 0,5 даст одинаково — «ослаблено»", "s2_a1_rev2_o3": "Повторное растяжение", "s2_a1_rev2_x3": "Повтор даст тот же исход: растяжение от актина здесь не различает уровни", "s2_a1_rev2_o4": "Ничего не поможет", "s2_a1_rev2_x4": "Скорость выдвижения края различает все три уровня", "s2_a1_rev2_h1": "Какая нагрузка зависит от актина как от главной системы?", "s2_a1_rev2_h2": "Что мешает выпячиванию различить 1,0 и 0,5?", "s2_a1_rev2_h3": "Нужна величина, пропорциональная функции актина", "s2_a1_new": "Механическую устойчивость клетки обеспечивают три системы вместе: актиновый кортекс и сокращение актомиозина, жёсткие микротрубочки и прочная сеть промежуточных филаментов. Если ослаблена одна система, другие частично берут нагрузку на себя, но не полностью: у каждой нагрузки есть главная система", "s2_a1_cond": "Условная клетка на краю слоя эпителиальных клеток (как во вкладке 1). Функцию каждой системы можно задать на уровне 1,0 (норма), 0,5 (снижена) или 0,2 (сильно снижена) — это доля функции, а не количество белка. Нагрузки: растяжение, перенос груза от центра к периферии, выпячивание поверхности, сочетание двух нагрузок. Дополнительное измерение — скорость выдвижения края (показывает работу актина при выпячивании). Наблюдение — минуты", "s2_a1_rules": "Растяжение: главная — промежуточные филаменты, вспомогательная — актиновые филаменты. Перенос груза от центра к периферии: главная — микротрубочки. Выпячивание: главная — актиновые филаменты, вспомогательная — микротрубочки. Исход «нарушено» — главная система на уровне 0,2; «ослаблено» — главная на уровне 0,5 или вспомогательная на уровне 0,2; иначе «сохранено». Шкалы прочности в модели нет: исходы качественные", "s2_a1_expl": "Каждая система цитоскелета лучше справляется со своей нагрузкой, потому что у неё свои свойства: промежуточные филаменты прочны и растяжимы, микротрубочки жёсткие и полярные, актиновые филаменты быстро собираются у мембраны и работают с миозином. Поэтому одну систему нельзя «усилить» вместо другой: прочная, но неполярная сеть не даст направленного транспорта, а динамичная сеть актина не заменит прочности при сильном растяжении", "s2_a1_data": "Клетки иммунной системы и опухолевые клетки протискиваются сквозь промежутки в тканях диаметром от 1 до 20 мкм. Ядро — самая крупная и жёсткая органелла клетки, и ему приходится сильно деформироваться. Обзор последних лет собрал данные о том, как в этом участвуют все системы цитоскелета: актин и миозин сдавливают и проталкивают ядро, микротрубочки и центросома тянут его вперёд, а способность ядра вернуть форму после снятия нагрузки требует ламинов A/C (белков промежуточных филаментов ядра), белков, связывающих ядерную оболочку с цитоскелетом, и виментина (белка промежуточных филаментов цитоплазмы). Сильная деформация может приводить к временным разрывам ядерной оболочки и повреждению ДНК. Это пример задачи, для которой нужна совместная работа всех трёх систем", "s2_a1_how": "Ядро в живой клетке деформировали и после снятия нагрузки следили, возвращается ли оно к прежней форме: без ламинов A/C, белков, связывающих оболочку ядра с цитоскелетом, или виментина возврат был хуже", "s2_a1_limits": "Модель не измеряет силы и не сравнивает прочность систем в числах: такой общей шкалы нет. Правило «главная — вспомогательная» — учебное упрощение. Системы в клетке связаны белками-сшивателями, поэтому снижение одной меняет организацию других; модель этого не показывает. Ядро в модели не изображено", "s2_a1_title": "Почему одна система филаментов не может заменить весь цитоскелет?", "s2_a2_s1_cond": "Сравните стабильную сеть и сеть средней динамики при D = 10 и росте 1,0", "s2_a2_s1_q": "В какой сети мишень будет достигнута в большей доле клеток?", "s2_a2_s1_o1": "В сети средней динамики", "s2_a2_s1_x1": "Верно. 0,832 против 0,653. Стабильная сеть достигает мишени, только если в начале одна из микротрубочек уже направлена к ней; динамичная сеть со временем проходит другие направления", "s2_a2_s1_o2": "В стабильной: её микротрубочки не разбираются", "s2_a2_s1_x2": "Стабильные микротрубочки дорастают быстро, но только в начальных направлениях; если мишени там нет, она не будет достигнута", "s2_a2_s1_o3": "Одинаково: число микротрубочек одно и то же", "s2_a2_s1_x3": "Число одно, но набор направлений у динамичной сети со временем меняется", "s2_a2_s1_o4": "Стабильная сеть не достигнет мишени ни в одной клетке", "s2_a2_s1_x4": "Если в начале хотя бы одна микротрубочка направлена к мишени, она её достигает: так примерно в двух третях клеток", "s2_a2_s1_h1": "Что происходит с направлением после полной разборки?", "s2_a2_s1_h2": "Сколько направлений проходит стабильная сеть за всё время?", "s2_a2_s1_h3": "Динамика позволяет пройти новые направления", "s2_a2_s1_e": "Высокая динамика не означает низкой эффективности: разборка позволяет начать микротрубочку в новом направлении", "s2_a2_s1_bio": "15", "s2_a2_s2_cond": "Если повысить динамику до «высокой» и «очень высокой» при той же мишени (D = 10)", "s2_a2_s2_q": "Что произойдёт с долей клеток, достигших мишени?", "s2_a2_s2_o1": "Снизится", "s2_a2_s2_x1": "Верно. 0,685 и 0,231 вместо 0,832: при очень частых катастрофах микротрубочки разбираются раньше, чем дорастают до расстояния 10", "s2_a2_s2_o2": "Будет расти: больше динамики — больше направлений", "s2_a2_s2_x2": "Направлений больше, но после некоторого уровня катастрофы не дают микротрубочке дорасти", "s2_a2_s2_o3": "Не изменится: направления проходятся при любой динамике", "s2_a2_s2_x3": "Доля снижается: важна не только смена направлений, но и длина", "s2_a2_s2_o4": "Мишень будут достигать все клетки", "s2_a2_s2_x4": "Направления проходятся, но каждая микротрубочка остаётся короткой", "s2_a2_s2_h1": "Сколько в среднем растёт микротрубочка до катастрофы при высокой частоте катастроф?", "s2_a2_s2_h2": "Хватит ли такой длины до мишени на расстоянии 10?", "s2_a2_s2_h3": "Слишком частые катастрофы — слишком короткие микротрубочки", "s2_a2_s2_e": "Максимальная динамика не оптимальна: есть промежуточный уровень, при котором доля достижений наибольшая", "s2_a2_s2_bio": "15", "s2_a2_s3_cond": "Мишень перенесли дальше: D = 20, рост 1,0", "s2_a2_s3_q": "Какая из сетей с катастрофами — низкая, средняя или высокая динамика — теперь достигает мишени в наибольшей доле клеток?", "s2_a2_s3_o1": "Низкая", "s2_a2_s3_x1": "Верно. 0,654 против 0,528 у средней и 0,099 у высокой: чем дальше мишень, тем дольше микротрубочка должна расти без катастрофы. Стабильная сеть даёт ту же долю, что и низкая (0,659): при далёкой мишени преимущество смены направлений исчезает", "s2_a2_s3_o2": "Средняя, как при D = 10", "s2_a2_s3_x2": "Наилучший уровень сместился: средняя теперь достигает мишени реже низкой", "s2_a2_s3_o3": "Высокая", "s2_a2_s3_x3": "При частых катастрофах микротрубочки до расстояния 20 почти не дорастают", "s2_a2_s3_o4": "Все три одинаково", "s2_a2_s3_x4": "Различия большие: от 0,1 до 0,65", "s2_a2_s3_h1": "Что важнее для далёкой мишени — смена направлений или длина?", "s2_a2_s3_h2": "Сколько времени растёт микротрубочка до катастрофы при разной динамике?", "s2_a2_s3_h3": "Далеко — нужен долгий рост без катастрофы", "s2_a2_s3_e": "Наилучшая динамика зависит от геометрии: расстояния до мишени и скорости роста. Поэтому нельзя сказать, какая частота катастроф «правильна» вообще", "s2_a2_s3_bio": "15", "s2_a2_s4_cond": "D = 10, рост 1,0. Среднее время достижения у стабильной сети меньше, чем у сети средней динамики", "s2_a2_s4_q": "Значит ли это, что стабильная сеть эффективнее?", "s2_a2_s4_o1": "Нет: время считают только у достигших", "s2_a2_s4_x1": "Верно. 10,0 против 19,6, но доля достигших у стабильной сети меньше (0,653 против 0,832). Вероятность и время — разные показатели; сравнивать нужно по обоим", "s2_a2_s4_o2": "Да: важнее всего быстрота достижения", "s2_a2_s4_x2": "Если мишень не достигнута в трети клеток, короткое время в остальных этого не возмещает", "s2_a2_s4_o3": "Нет: у стабильной сети время на самом деле больше", "s2_a2_s4_x3": "Время у стабильной сети меньше; дело не во времени, а в доле", "s2_a2_s4_o4": "Нельзя сравнить: время и доля всегда меняются вместе", "s2_a2_s4_x4": "Здесь они меняются в разные стороны", "s2_a2_s4_h1": "По каким клеткам считается среднее время?", "s2_a2_s4_h2": "Какая доля клеток вообще достигла мишени?", "s2_a2_s4_h3": "Время среди достигших ≠ эффективность", "s2_a2_s4_e": "Различайте вероятность достижения мишени, время достижения и устойчивость контакта после достижения — это три разных показателя", "s2_a2_s4_bio": "15", "s2_a2_rev_q": "В двух клетках мишень достигается одинаково редко — примерно в половине клеток. Можно ли считать, что частота катастроф у них одинаковая?", "s2_a2_rev_o1": "Нет: близкая доля получается и при разной частоте катастроф", "s2_a2_rev_x1": "Верно. В модели 0,53 даёт средняя динамика при мишени на расстоянии 20, а 0,54 — низкая динамика при той же мишени и медленном росте. Нужно проверить расстояние до мишени, скорость роста и частоту спасений", "s2_a2_rev_o2": "Да: доля определяется только частотой катастроф", "s2_a2_rev_x2": "На долю влияют также расстояние до мишени, скорость роста и спасения", "s2_a2_rev_o3": "Да, если число микротрубочек одинаково", "s2_a2_rev_x3": "Число микротрубочек в модели всегда 8, а доли при разных частотах катастроф близки", "s2_a2_rev_o4": "Нет: частоты обязательно разные", "s2_a2_rev_x4": "Одинаковая доля может получиться и при одинаковой частоте, если одинаковы остальные условия; вывод требует проверки остальных параметров", "s2_a2_rev_h1": "Какие ещё условия модели меняют долю?", "s2_a2_rev_h2": "Найдите в таблице две близкие доли при разной динамике", "s2_a2_rev_h3": "Если две разные сети дают близкую долю, что одна доля говорит о частоте катастроф?", "s2_a2_rev2_q": "Какие ещё параметры проверить?", "s2_a2_rev2_o1": "Расстояние до мишени", "s2_a2_rev2_x1": "Да: при D = 20 доли совсем другие", "s2_a2_rev2_o2": "Скорость роста", "s2_a2_rev2_x2": "Да: при медленном росте доли ниже", "s2_a2_rev2_o3": "Частоту спасений", "s2_a2_rev2_x3": "Да: спасения удлиняют микротрубочки", "s2_a2_rev2_o4": "Удерживается ли конец у мишени после контакта", "s2_a2_rev2_x4": "Да: от этого зависит устойчивость контакта", "s2_a2_rev2_o5": "Цвет флуоресцентной метки микротрубочек", "s2_a2_rev2_x5": "Метка не влияет на динамику в модели", "s2_a2_new": "Микротрубочки, отходящие от центра, растут в разных направлениях. После катастрофы и полной разборки новая микротрубочка может начаться в другом направлении. Поэтому сеть с катастрофами со временем проходит разные направления, а стабильная сеть остаётся с теми направлениями, которые были в начале", "s2_a2_cond": "Условная клетка: центр нуклеации с 8 микротрубочками и 8 возможными направлениями. Каждая микротрубочка получает случайное направление: на одном направлении могут оказаться несколько микротрубочек, другие направления остаются пустыми. Мишень (например, участок мембраны) лежит в одном направлении на расстоянии D = 10 или 20 условных единиц длины. Время наблюдения — 60 единиц времени. Мишень считается достигнутой, когда микротрубочка нужного направления доросла до неё. Сети различаются только динамикой: число микротрубочек, запас тубулина (не ограничен) и положение мишени одинаковы", "s2_a2_rules": "За каждую единицу времени: растущая микротрубочка удлиняется на 1 (на 0,5 при медленном росте) и с вероятностью pc переходит к укорочению; укорачивающаяся теряет 3 и с вероятностью pr снова начинает расти; при длине 0 начинается новая микротрубочка в случайном из 8 направлений. В начале направления 8 микротрубочек случайны. Стабильная сеть: pc = 0. Наборы: низкая динамика pc = 0,02, pr = 0,3; средняя — 0,08 и 0,1; высокая — 0,2 и 0,05; очень высокая — 0,35 и 0. Вероятности — учебные, а не измеренные. Результаты — по 4000 повторам с фиксированным начальным числом генератора, равным 2, поэтому они воспроизводимы", "s2_a2_expl": "Сеть динамичных микротрубочек со временем проходит разные направления: каждая микротрубочка растёт, может разобраться и начаться снова в другом направлении. Поэтому динамика повышает вероятность того, что хотя бы одна микротрубочка дорастёт до мишени, — но лишь до определённого уровня: при слишком частых катастрофах микротрубочки остаются короткими, а при далёкой мишени преимущество динамики исчезает. Если мишень связывает достигший её конец и защищает его от разборки, сеть перестраивается в сторону мишени. Такое представление — модель; в клетке направление роста задают и другие факторы", "s2_a2_data": "Частоту переходов между ростом и укорочением регулируют белки, собирающиеся на растущем конце. Один из главных — EB1 (белок, связывающийся с концом микротрубочки): он узнаёт участок стенки у самого конца и привлекает к нему другие белки. Было известно, что EB1 ускоряет рост микротрубочек и повышает частоту катастроф, то есть делает конец динамичнее. Эксперименты с очищенными белками в пробирке и с клетками человека в культуре показали, что для этого EB1 должен образовать у конца конденсат — скопление без мембраны, в котором концентрируются тубулин и белки плюс-конца. Мутантный EB1, не способный образовывать конденсат, хуже следовал за концом и не регулировал его динамику; в делящихся клетках с таким белком хромосомы перемещались с нарушениями. Значит, динамичность конца регулируется, а не просто «случается»", "s2_a2_how": "Сравнивали обычный белок EB1 и белок с заменёнными аминокислотами, который не образует конденсата, — с очищенными белками (EB1 и тубулином) в пробирке и в клетках человека в культуре (линия HeLa)", "s2_a2_limits": "Модель плоская; направления заданы восемью лучами; граница клетки не учитывается. Вероятности катастроф и спасений — учебные. Не показано, что мишень может удерживать конец (устойчивость контакта), что клетка может направлять рост, и что у веретена деления свои особенности (<a href=\"seminar-6-route.html#spindle\" target=\"_blank\" rel=\"noopener\">семинар 6</a>)", "s2_a2_title": "Динамическая нестабильность и достижение внутриклеточной мишени", "s2_a3_s1_cond": "f = 1,0, кинезин-1", "s2_a3_s1_q": "Куда сдвигаются грузы?", "s2_a3_s1_o1": "К концу отростка", "s2_a3_s1_x1": "Все плюс-концы наружу: каждый груз сдвигается к концу отростка, средний сдвиг +1,0", "s2_a3_s1_o2": "К телу клетки", "s2_a3_s1_x2": "К телу клетки при такой ориентации переносил бы динеин", "s2_a3_s1_o3": "Поровну наружу и внутрь", "s2_a3_s1_x3": "Так бывает при смешанной ориентации, а здесь все плюс-концы наружу", "s2_a3_s1_o4": "Остаются на месте", "s2_a3_s1_x4": "АТФ есть, путь есть: мотор шагает", "s2_a3_s1_h1": "Куда обращены плюс-концы?", "s2_a3_s1_h2": "К какому концу шагает кинезин-1?", "s2_a3_s1_h3": "Свяжите направление мотора с тем, куда обращены плюс-концы всех микротрубочек пучка", "s2_a3_s1_e": "Параллельная сеть превращает направление мотора в одно пространственное направление", "s2_a3_s1_bio": "20", "s2_a3_s2_cond": "f = 0,5, кинезин-1", "s2_a3_s2_q": "Что покажет модель?", "s2_a3_s2_o1": "Грузы идут в обе стороны, средний сдвиг — ноль", "s2_a3_s2_x1": "Средний сдвиг 0: мотор всегда шагает к плюс-концу, но плюс-концы направлены в обе стороны поровну", "s2_a3_s2_o2": "Грузы в среднем сдвигаются к концу отростка, как при f = 1,0", "s2_a3_s2_x2": "Половина грузов движется по микротрубочкам, обращённым плюс-концом внутрь", "s2_a3_s2_o3": "Мотор начинает шагать к минус-концу", "s2_a3_s2_x3": "Направление мотора не меняется; меняется ориентация микротрубочки, с которой он связан", "s2_a3_s2_o4": "Грузы перестают двигаться вовсе", "s2_a3_s2_x4": "Каждый груз движется; равен нулю только средний сдвиг", "s2_a3_s2_h1": "Меняется ли направление мотора относительно микротрубочки?", "s2_a3_s2_h2": "Сколько микротрубочек ведут наружу, сколько внутрь?", "s2_a3_s2_h3": "Сравните, сколько грузов движется наружу и сколько — внутрь", "s2_a3_s2_e": "Смешанная сеть не делает мотор «ненаправленным»: она делает ненаправленным средний перенос грузов", "s2_a3_s2_bio": "20", "s2_a3_s3_cond": "f = 0,3; кинезин-1 и динеин переносят разные грузы (по 10 каждого)", "s2_a3_s3_q": "Куда в среднем сдвигаются грузы?", "s2_a3_s3_o1": "Грузы кинезина — к телу клетки, грузы динеина — к концу отростка", "s2_a3_s3_x1": "−0,4 и +0,4: плюс-концов, обращённых внутрь, больше, и плюс-направленный мотор в среднем уходит внутрь", "s2_a3_s3_o2": "Грузы кинезина — к концу отростка, грузы динеина — к телу клетки", "s2_a3_s3_x2": "Так было бы при f > 0,5", "s2_a3_s3_o3": "Все грузы — к концу отростка, как в аксоне", "s2_a3_s3_x3": "Моторы противоположного направления на одной и той же сети в среднем сдвигаются в противоположные стороны", "s2_a3_s3_o4": "Грузы обоих моторов в среднем остаются на месте", "s2_a3_s3_x4": "На месте — только при f = 0,5", "s2_a3_s3_h1": "Каких микротрубочек больше — с плюс-концом наружу или внутрь?", "s2_a3_s3_h2": "К какому концу шагает каждый мотор?", "s2_a3_s3_h3": "Пространственное направление = направление мотора × ориентация пути", "s2_a3_s3_e": "Пространственное направление определяется направлением мотора и ориентацией пути вместе", "s2_a3_s3_bio": "20", "s2_a3_rev_q": "Грузы в отростке в среднем сдвигаются от тела клетки к концу. Ориентация микротрубочек скрыта. Можно ли только по этому наблюдению установить тип мотора?", "s2_a3_rev_o1": "Нет: нужна ориентация пути", "s2_a3_rev_x1": "Такой сдвиг даёт кинезин-1 при f > 0,5 и динеин при f < 0,5", "s2_a3_rev_o2": "Да: к концу отростка всегда переносит кинезин", "s2_a3_rev_x2": "Только если большинство плюс-концов обращено наружу", "s2_a3_rev_o3": "Да: к концу отростка всегда переносит динеин", "s2_a3_rev_x3": "Только если большинство минус-концов обращено наружу", "s2_a3_rev_o4": "Нет: тип мотора по движению не определить никогда", "s2_a3_rev_x4": "Определить можно, если известна ориентация пути (вкладка 3, шаг 4)", "s2_a3_rev_h1": "Что ещё, кроме направления груза, нужно знать?", "s2_a3_rev_h2": "Какой сдвиг дают два мотора при f = 0,3 и при f = 0,7?", "s2_a3_rev_h3": "Проверьте, может ли одно и то же направление груза получиться при разных моторах", "s2_a3_rev2_q": "Какие наблюдения позволят установить мотор?", "s2_a3_rev2_o1": "Ориентация микротрубочек на этом участке", "s2_a3_rev2_x1": "Да: по ней и направлению груза определяется направление мотора", "s2_a3_rev2_o2": "Какой мотор связан с грузом", "s2_a3_rev2_x2": "Да: это прямое наблюдение", "s2_a3_rev2_o3": "Ориентация конкретной микротрубочки, по которой груз движется в данный момент", "s2_a3_rev2_x3": "Да: направление шага относительно неё и есть направление мотора", "s2_a3_rev2_o4": "Скорость движения груза", "s2_a3_rev2_x4": "В модели скорости моторов одинаковы; по скорости мотор не определить", "s2_a3_new": "В разных клетках микротрубочки ориентированы по-разному: в аксоне все плюс-концы обращены к окончанию, в эпителиальной клетке плюс-концы обращены к базальной стороне, а в дендритах нейронов млекопитающих микротрубочки лежат в обеих ориентациях", "s2_a3_cond": "Участок отростка клетки; в пучке из 10 микротрубочек доля f направлена плюс-концом «наружу» (к концу отростка), остальные — плюс-концом «внутрь» (к телу клетки). Мотор: кинезин-1 (к плюс-концу) или цитоплазматический динеин (к минус-концу). Модель рассматривает 10 независимых транспортных событий: на каждой микротрубочке свой груз; он связывается с ней и проходит по ней один пробег одинаковой длины. Поэтому доля грузов, идущих по микротрубочкам каждой ориентации, равна доле этих микротрубочек", "s2_a3_expl": "Направление шагов мотора задаёт полярность микротрубочки, а не положение в клетке. Смена ориентации микротрубочки меняет пространственный вектор движения груза, но не направление мотора относительно микротрубочки. Поэтому для предсказания пути груза нужно знать три вещи: какой мотор активен, как ориентированы микротрубочки на этом участке и где находится груз", "s2_a3_data": "Обзор последних лет сводит данные о том, как организованы микротрубочки в специализированных клетках животных. В аксонах нейронов млекопитающих все микротрубочки обращены плюс-концом к окончанию, а в дендритах встречаются обе ориентации; микротрубочки, обращённые минус-концом наружу, устойчивее. В эпителиальных клетках микротрубочки идут вертикально: минус-концы закреплены у апикальной поверхности или у межклеточных контактов, плюс-концы обращены к базальной стороне. Центрами организации служат не только центросома, но и аппарат Гольджи, оболочка ядра в мышечных клетках, апикальная поверхность эпителия. Как именно поддерживается смешанная ориентация в дендритах, пока до конца не понятно", "s2_a3_data2": "У человека 45 генов кинезинов. Многие изученные кинезины, в том числе кинезин-1, без груза складываются: хвост прижимается к моторной части, выключает её и мешает связыванию с микротрубочкой. Белок, связанный с микротрубочкой, присоединяется к средней части молекулы, а белок-адаптер груза — к хвосту; вместе они раскладывают мотор и включают его. Поэтому мотор не расходует АТФ впустую и не занимает пути без груза", "s2_a3_how": "Ориентацию микротрубочек в отростках нейронов определяют по тому, в какую сторону растут их концы: растут в основном плюс-концы, а белки, связывающиеся только с растущими концами, светятся именно у них", "s2_a3_limits": "Модель — совокупность независимых транспортных событий: каждый груз движется по одной выбранной микротрубочке, а средний сдвиг относится ко всем грузам вместе, а не к пути одного груза. В клетке выбор микротрубочки зависит от её устойчивости, химических меток тубулина и связанных белков, и некоторые моторы чаще связываются с определёнными микротрубочками; поэтому доля грузов на микротрубочках каждой ориентации может не совпадать с долей самих микротрубочек. В настоящих отростках микротрубочки одной ориентации часто собраны в пучки. Переключение груза между микротрубочками в клетке возможно, но требует подходящей пространственной организации путей (пересекающиеся или близко лежащие микротрубочки) и взаимодействия моторного комплекса с соседней микротрубочкой; это отдельный механизм, и модель его не воспроизводит. На грузе в модели один мотор; в клетке часто несколько разных. Подробное изучение белков-адаптеров не обязательно", "s2_a3_title": "Одинаковый мотор — различное пространственное направление транспорта", "s2_a4_s1_cond": "Разборка остановлена (kd = 0). Сравните kp = 0,3 и kp = 0,6 за 40 шагов", "s2_a4_s1_q": "Как будут различаться итоговые смещения края?", "s2_a4_s1_o1": "Одинаковы: различается только время", "s2_a4_s1_x1": "В обоих случаях 8,0: без разборки каждая субъединица пула встраивается один раз (0,1 × 80). Быстрая сборка лишь быстрее исчерпывает пул — к t = 10 при kp = 0,6 G = 0,01", "s2_a4_s1_o2": "При kp = 0,6 край продвинется вдвое дальше", "s2_a4_s1_x2": "Ресурс тот же — 80 субъединиц; быстрее не значит дальше", "s2_a4_s1_o3": "При kp = 0,6 край продвинется меньше", "s2_a4_s1_x3": "Итог одинаков; различается только время", "s2_a4_s1_o4": "Край будет двигаться без ограничения", "s2_a4_s1_x4": "Пул конечен, а без разборки он не пополняется", "s2_a4_s1_h1": "Сколько субъединиц может встроиться без разборки?", "s2_a4_s1_h2": "Что ограничивает итог — скорость или количество?", "s2_a4_s1_h3": "Сравните, сколько субъединиц вообще может встроиться в сеть, если они не возвращаются в пул", "s2_a4_s1_e": "Высокая начальная скорость сборки может быстро исчерпать доступный пул", "s2_a4_s1_bio": "28", "s2_a4_s2_cond": "Разборка идёт (kd = 0,1). Сравните kp = 0,3 и kp = 0,6 за 40 шагов", "s2_a4_s2_q": "Что будет с выдвижением края?", "s2_a4_s2_o1": "При быстрой сборке — дальше, но не вдвое", "s2_a4_s2_x1": "39,92 против 34,12: быстрая сборка уменьшает стационарный пул (14,29 вместо 25), и присоединение растёт мало — 8,57 вместо 7,5 за шаг. Скорость ограничивает разборка, возвращающая субъединицы", "s2_a4_s2_o2": "При быстрой сборке — вдвое дальше", "s2_a4_s2_x2": "Присоединение пропорционально пулу, а пул при быстрой сборке меньше", "s2_a4_s2_o3": "Одинаково: всё определяет пул", "s2_a4_s2_x3": "Различие есть, но небольшое", "s2_a4_s2_o4": "При быстрой сборке — меньше: пул истощится", "s2_a4_s2_x4": "При идущей разборке пул не истощается, а устанавливается на новом уровне", "s2_a4_s2_h1": "Что возвращает субъединицы в пул?", "s2_a4_s2_h2": "Каким станет стационарный пул при быстрой сборке?", "s2_a4_s2_h3": "Пул меньше — присоединение растёт мало", "s2_a4_s2_e": "При продолжающейся разборке устанавливается баланс: сколько встраивается впереди, столько отделяется позади", "s2_a4_s2_bio": "28", "s2_a4_s3_cond": "Норма; можно удвоить либо скорость сборки (kp 0,6), либо скорость разборки (kd 0,2)", "s2_a4_s3_q": "Какое изменение сильнее ускорит выдвижение края за 40 шагов?", "s2_a4_s3_o1": "Удвоение скорости разборки", "s2_a4_s3_x1": "50,40 против 39,92: разборка повышает стационарный пул (G* = 40), и присоединение возрастает до 12 за шаг", "s2_a4_s3_o2": "Удвоение скорости сборки", "s2_a4_s3_x2": "Сравните итоговые X: ускорение разборки даёт больше", "s2_a4_s3_o3": "Оба одинаково", "s2_a4_s3_x3": "Итоги различаются заметно", "s2_a4_s3_o4": "Ни одно не ускорит", "s2_a4_s3_x4": "Оба ускоряют, но в разной степени", "s2_a4_s3_h1": "Что ограничивает присоединение при идущей разборке?", "s2_a4_s3_h2": "Как каждое изменение меняет стационарный пул?", "s2_a4_s3_h3": "Больше пул — быстрее присоединение", "s2_a4_s3_e": "В этой модели выдвижение ограничено возвратом субъединиц. Это согласуется с тем, что в клетке быстрый оборот сети обеспечивают белки, ускоряющие разборку", "s2_a4_s3_bio": "28", "s2_a4_s4_cond": "Норма, но без сцепления с подложкой; T = 40", "s2_a4_s4_q": "Что будет с обновлением сети и с краем?", "s2_a4_s4_o1": "Обновление прежнее, край продвигается намного меньше", "s2_a4_s4_x1": "J = 7,5 за шаг, как в норме, но X = 6,82 вместо 34,12 — край продвигается примерно в 5 раз меньше. Обновление сети не гарантирует выдвижения края", "s2_a4_s4_o2": "Обновление сети прекратится совсем", "s2_a4_s4_x2": "G и F меняются так же, как в норме", "s2_a4_s4_o3": "Край будет продвигаться как в норме", "s2_a4_s4_x3": "Без опоры сеть отъезжает назад", "s2_a4_s4_o4": "Клетка будет перемещаться целиком", "s2_a4_s4_x4": "Центр клетки в модели не смещается ни в каком режиме", "s2_a4_s4_h1": "Зависит ли присоединение от сцепления?", "s2_a4_s4_h2": "Куда сдвигается сеть без опоры?", "s2_a4_s4_h3": "Сравните, меняется ли присоединение у мембраны и какая его доля сдвигает край, когда сеть не держится за подложку", "s2_a4_s4_e": "Тредмиллинг сети — не перемещение клетки. Смещение края и смещение центра клетки — разные величины: для второго нужны сокращение актомиозина и открепление заднего края", "s2_a4_s4_bio": "26 28", "s2_a4_rev_q": "В двух клетках край почти перестал выдвигаться. В одной нарушено обновление пула мономеров, в другой — передача силы на подложку. Какие наблюдения различат эти случаи?", "s2_a4_rev_o1": "Размер свободного пула и скорость присоединения", "s2_a4_rev_x1": "При нарушенном обновлении оба близки к нулю, при нарушенной передаче силы — как в норме", "s2_a4_rev_o2": "Движение сети назад относительно подложки", "s2_a4_rev_x2": "При нарушенной передаче силы сеть быстро отъезжает назад", "s2_a4_rev_o3": "Длина отдельных филаментов", "s2_a4_rev_x3": "В модели её нет, а в клетке она не различает эти случаи однозначно", "s2_a4_rev_o4": "Активность миозина II", "s2_a4_rev_x4": "Выпячивание края от миозина в модели не зависит", "s2_a4_rev_h1": "Что происходит с пулом при нарушенном обновлении?", "s2_a4_rev_h2": "Что происходит с сетью без опоры?", "s2_a4_rev_h3": "Какое показание зависит от того, возвращаются ли субъединицы в пул, а какое — от того, держится ли сеть за подложку?", "s2_a4_new": "Сеть у края обновляется: её субъединицы проходят путь от мембраны вглубь и возвращаются в свободный пул. Скорость этого оборота задают белки, ускоряющие разборку", "s2_a4_cond": "Замкнутая учебная модель: общее количество актина 100 условных единиц постоянно (G + F = 100), отрицательных значений нет. Изменяемые параметры: скорость присоединения kp (0,3 или 0,6 за шаг на единицу G), скорость разборки kd (0; 0,05; 0,1; 0,2), начальный пул G₀ (80 или 40), сцепление с подложкой (есть / нет), длительность наблюдения T (10, 20 или 40 шагов)", "s2_a4_expl": "В замкнутой системе количество актина постоянно, и каждая субъединица в сети отсутствует в пуле. Поэтому ускорение сборки без ускорения разборки лишь быстрее опустошает пул. Продолжительное выдвижение возможно, когда сборка у мембраны уравновешена разборкой позади; скорость тогда определяется прежде всего скоростью возврата субъединиц. Но и непрерывное обновление сети не перемещает клетку, если сила не передаётся на подложку", "s2_a4_data": "Обзор последних лет обобщает, как регулируется оборот актиновых сетей. Ветвящаяся сеть у переднего края мигрирующей клетки меланомы мыши в культуре обновляется полностью менее чем за минуту, а сети в местах эндоцитоза — за несколько секунд. Очищенный актин сам по себе разбирается слишком медленно, чтобы обеспечить такую скорость: её создают белки, разрезающие и разбирающие филаменты (белки семейства ADF/кофилина и их партнёры). Кроме того, сеть реагирует на механическую нагрузку: когда растущая сеть упирается в препятствие, филаменты удлиняются медленнее, а сети, собранные из очищенных белков, под нагрузкой становились плотнее и толкали эффективнее; растягивающая сила облегчает отделение ветвей. Одиночный актиновый филамент выдерживает растяжение более 100 пН без разрыва", "s2_a4_how": "Скорость оборота оценивали, следя в живых клетках за тем, как быстро обновляется помеченный актин в сети; влияние нагрузки изучали на сетях, собранных из очищенных белков", "s2_a4_limits": "Скорости пропорциональны пулу и количеству филаментов — это упрощение; в клетке их регулируют профилин, кэпирующий белок, кофилин, Arp2/3 и другие белки, а механизм обновления различается в разных типах клеток. Нет натяжения мембраны и силы в пиконьютонах. Смещение края ≠ перемещение центра клетки. Модель не учитывает синтез и распад актина (авторегуляция — вкладка 4, панель В)", "s2_a4_title": "Почему увеличение скорости полимеризации не гарантирует устойчивого движения?", "s2_m1": "Флуоресцентное окрашивание антителами", "s2_m1_items": "Что измеряется — где в клетке находится белок\nУровень — клетка\nКонтроль — клетки без первичного антитела\nТипичный артефакт — фиксация может разрушить тонкие динамичные структуры\nЧего не доказывает — функции белка и того, движется ли структура (снимок неподвижен)", "s2_m2": "Наблюдение отдельных микротрубочек в реальном времени", "s2_m2_items": "Что измеряется — длина одной микротрубочки во времени\nУровень — молекулярный (пробирка) или клеточный\nКонтроль — микротрубочки в тех же условиях без добавленного белка\nТипичный артефакт — свет и флуоресцентная метка могут повреждать тубулин и менять динамику\nЧего не доказывает — структуру конца в момент катастрофы", "s2_m3": "Подвижность моторов в пробирке", "s2_m3_items": "Что измеряется — направление и скорость перемещения\nУровень — молекулярный\nКонтроль — без АТФ движения нет\nТипичный артефакт — прикрепление к стеклу может мешать работе мотора\nЧего не доказывает — какой мотор работает на данном грузе в клетке", "s2_m4": "Флуоресцентный актин в живой клетке", "s2_m4_items": "Что измеряется — где и с какой скоростью актин встраивается в сеть и покидает её\nУровень — клетка\nКонтроль — клетка без воздействия\nТипичный артефакт — избыток меченого актина меняет динамику\nЧего не доказывает — какой белок отвечает за сборку", "s2_int_title": "Почему клетка изменила форму и нарушила внутриклеточный транспорт?", "src_01": "Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 16 «The Cytoskeleton».", "src_02": "Akhmanova A., Kapitein L. C. Mechanisms of microtubule organization in differentiated animal cells. Nat. Rev. Mol. Cell Biol. 2022; 23: 541–558. doi:10.1038/s41580-022-00473-y.", "src_03": "Lappalainen P., Kotila T., Jégou A., Romet-Lemonne G. Biochemical and mechanical regulation of actin dynamics. Nat. Rev. Mol. Cell Biol. 2022; 23: 836–852. doi:10.1038/s41580-022-00508-4.", "src_04": "Song X., Yang F., Yang T. et al. Phase separation of EB1 guides microtubule plus-end dynamics. Nat. Cell Biol. 2023; 25: 79–91. doi:10.1038/s41556-022-01033-4.", "src_05": "Yildiz A. Mechanism and regulation of kinesin motors. Nat. Rev. Mol. Cell Biol. 2025; 26: 86–103. doi:10.1038/s41580-024-00780-6.", "src_06": "Kalukula Y., Stephens A. D., Lammerding J., Gabriele S. Mechanics and functional consequences of nuclear deformations. Nat. Rev. Mol. Cell Biol. 2022; 23: 583–602. doi:10.1038/s41580-022-00480-z.", "src_07": "Cho Y., Kim Y. K. Multilayered regulation of cytoskeletal protein abundance: autoregulatory mechanisms of actin and tubulin. Exp. Mol. Med. 2026; 58: 59–72. doi:10.1038/s12276-025-01615-w.", "mb_t": "Дальше в курсе «Молекулярная биология»", "mb_1": "Как трек задаёт направление движения груза в клетке — «Молекулярная биология», семинар 2|https://edu.mazunin.science/seminar-2-route.html#tracks", "mb_2": "Чем различаются кинезины, динеин и миозины — «Молекулярная биология», семинар 2|https://edu.mazunin.science/seminar-2-route.html#motors", "mb_3": "Как мотор связывается со своим грузом и почему без груза он неактивен — «Молекулярная биология», семинар 2|https://edu.mazunin.science/seminar-2-route.html#adaptors", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Как читать результат", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а в образце — «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Выберите измерение, которое их различит.", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Выберите измерение, которое их различит.", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Чтобы из предложенных объяснений осталось одно, достаточно, например, измерений: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Начать заново", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента.", "gn_mt": "Микротрубочка", "g_mt": "Полый полярный цилиндр наружным диаметр   const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;

  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();

}

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 700 px или низкий экран) во всех практикумах.
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 760 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:700px), (max-height:500px)') : null;
  let queued = false;
  function fitStage(st) {
    const sv = st.querySelector('svg'), zw = st.querySelector('.zwrap'); if (!sv || !zw) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); st.style.removeProperty('--p5w'); return; }
    const cur = sv.getBoundingClientRect().width, flatW = zw.clientWidth; if (!cur || !flatW) return;
    const k = Math.min(1, flatW / cur); let min = Infinity;
    ts.forEach(t => {
      const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
      const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
      if (px > 0 && px < min) min = px;
      t.classList.toggle('p5-small', px < 7);
    });
    if (min < Infinity) st.style.setProperty('--p5w', Math.ceil(Math.min(1800, Math.max(760, flatW * 11.2 / min))) + 'px');
  }
  function fitAll() { queued = false; document.querySelectorAll('#scenes .stage').forEach(st => { if (st.offsetParent) fitStage(st); }); }
  const later = () => { if (queued) return; queued = true; requestAnimationFrame(fitAll); };
  function arm() {
    const sc = document.getElementById('scenes') || document.body;
    new MutationObserver(later).observe(sc, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
    document.addEventListener('click', later, true);
    window.addEventListener('resize', later);
    later();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
})();

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;

  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  function compartment(cx, cy, rx, ry, fill) {

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {

    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;

  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */

      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +

  /* актиновые нити под участком мембраны */

      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }

  function snare(x, y1, y2, zipped) {

      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;

      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */

    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);

        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }

  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → аппарат Гольджи (COP-II), 'gerr' — аппарат Гольджи → ЭПР (COP-I), 'intra' — между цистернами аппарата Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).

  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
