    /* край: положение X (сдвиг вправо); центр клетки не смещается (03, И4.6) */
    const ex0 = 70, ek = 8.2;
    s += line(40, 50, 560, 50, C.line, 1) + T(130, 66, t('s2_a4g_edge_axis'), { a: 'l', size: 10.5, col: C.muted });
    s += `<circle cx="${ex0 - 34}" cy="50" r="5" fill="${C.ink}"/>` + T(ex0 - 34, 34, t('s2_a4g_center'), { size: 10.5, col: C.ink, w: 600 });
    runs.forEach((rows, i) => {
      if (wait && i > 0) return;
      const X = rows[Math.min(tEnd, T_)].X, x = ex0 + X * ek;
      s += G('a4_edge', `<line x1="${f(x)}" y1="${f(40 + i * 3)}" x2="${f(x)}" y2="${f(60 - i * 3)}" stroke="${C.actin}" stroke-width="3" ${DASH[i] ? `stroke-dasharray="${DASH[i] === '7 4' ? '3 2' : '1.5 2'}"` : ''}/>`);
    });
    s += T(ex0, 66, t('s2_a4g_edge0'), { size: 10.5, col: C.muted });
    /* сцепление с подложкой; без него сеть отъезжает назад (ретроградный поток; 03, И4.10, шаг 4; 11, ·26) */
    s += G('a4_adh', T(560, 34, t('s2_a4g_adh') + ': ' + t(e < 1 ? 's2_a4g_adh_no' : 's2_a4g_adh_yes'), { a: 'r', size: 10.5, w: 600, col: e < 1 ? C.warn : C.ok }));
    if (e < 1 && !wait) s += G('a4_retro', S2F.arrow(560, 74, 470, 74, C.warn, 2) + T(470, 88, t('s2_a4g_retro'), { a: 'l', size: 10, col: C.warn, it: true }));
    /* три графика от времени */
    const ts = T_ <= 10 ? [0, 5, 10] : T_ <= 20 ? [0, 10, 20] : [0, 20, 40];
    const xs = { min: 0, max: T_, ticks: ts };
    const gy = 110, gh = 200;
    const A1 = axes(52, gy, 150, gh, xs, { min: 0, max: 100, ticks: [0, 50, 100] }, t('s2_a4g_t_axis'));
    const jmax = Math.max(10, ...runs.map(r => r[0].Jpol)); const jm = jmax <= 10 ? 10 : jmax <= 25 ? 25 : 50;
    const A2 = axes(250, gy, 140, gh, xs, { min: 0, max: jm, ticks: [0, jm / 2, jm] }, t('s2_a4g_t_axis'));
    const xmax = Math.max(10, ...runs.map(r => r[T_].X)); const xm = xmax <= 10 ? 10 : xmax <= 20 ? 20 : xmax <= 40 ? 40 : 60;
    const A3 = axes(440, gy, 140, gh, xs, { min: 0, max: xm, ticks: [0, xm / 2, xm] }, t('s2_a4g_t_axis'));
    s += A1.s + A2.s + A3.s + T(52, gy - 10, t('s2_a4g_gf'), { a: 'l', size: 10.5, col: C.muted }) + T(250, gy - 10, t('s2_a4g_j'), { a: 'l', size: 10.5, col: C.muted }) + T(440, gy - 10, t('s2_a4g_x'), { a: 'l', size: 10.5, col: C.muted });
    s += line(A1.X(0), A1.Y(100), A1.X(T_), A1.Y(100), C.grey, 1.2, 'stroke-dasharray="4 3"') + T(A1.X(T_) - 2, A1.Y(100) - 8, t('s2_a4g_sum'), { a: 'r', size: 9.5, col: C.muted });
    runs.forEach((rows, i) => {
      if (wait && i > 0) return;
      const R = rows.slice(0, tEnd + 1), d = DASH[i] || '';
      s += G('pool', poly(R.map(r => [A1.X(r.t), A1.Y(r.G)]), COL.G, 2.2, d)) + G('a4_fil', poly(R.map(r => [A1.X(r.t), A1.Y(r.F)]), COL.F, 2.2, d));
      s += G('a4_j', poly(R.map(r => [A2.X(r.t), A2.Y(r.Jpol)]), COL.J, 2.2, d));
      s += G('a4_edge', poly(R.map(r => [A3.X(r.t), A3.Y(r.X)]), COL.X, 2.4, d));
      if (R.length === 1) s += `<circle cx="${f(A1.X(0))}" cy="${f(A1.Y(R[0].G))}" r="3" fill="${COL.G}"/><circle cx="${f(A1.X(0))}" cy="${f(A1.Y(R[0].F))}" r="3" fill="${COL.F}"/><circle cx="${f(A2.X(0))}" cy="${f(A2.Y(R[0].Jpol))}" r="3" fill="${COL.J}"/><circle cx="${f(A3.X(0))}" cy="${f(A3.Y(0))}" r="3" fill="${COL.X}"/>`;
    });
    s += T(60, gy + 14, 'G', { a: 'l', size: 11, w: 700, col: COL.G }) + T(76, gy + 14, 'F', { a: 'l', size: 11, w: 700, col: COL.F });
    /* показания: значения при t = T для каждого ряда; до ответа скрыты */
    const by = 358;
    if (wait) s += waitBox(40, by - 12, 520, 40, t('s2_a4g_wait'));
    else runs.forEach((rows, i) => {
      if (o.t != null && o.t < T_) return;
      const p = sets[i], r = rows[T_], st = OC.steady(p.kp, p.kd);
      const lbl = (sets.length > 1 ? t('s2_a4g_series', { kp: num(p.kp, 1), kd: String(p.kd).replace('.', ','), g0: p.G0, e: t(p.e < 1 ? 's2_a4g_adh_no' : 's2_a4g_adh_yes') }) + ' — ' : '') +
        t('s2_a4g_read', { T: T_, G: num(r.G, 2), F: num(r.F, 2), J: num(r.Jpol, 2), X: num(r.X, 2) }) + (st ? ' · ' + t('s2_a4g_gstar', { g: fG(st[0]) }) : '');
      s += (sets.length > 1 ? line(40, by + i * 19, 60, by + i * 19, C.ink, 2, DASH[i] ? `stroke-dasharray="${DASH[i]}"` : '') : '') + T(sets.length > 1 ? 66 : 40, by + i * 19, lbl, { a: 'l', size: 10.5, w: 600 });
    });
    s += T(300, 410, t('s2_a4g_center_note'), { size: 10.5, col: C.muted, it: true });
    return s;
  }
  return { view, fG };
})();

/* =====================================================================
   s3_gn_int.js — сцена итоговой задачи GN.s2_int (02, разд. 5; 07, 4.5; 11, ·29). Модель — OC.int (s0_oc_m.js); здесь только рисунок.
   view([режим, …]):
     ['obs'] — условная эпителиальная клетка в слое: (1) клетка округлилась, выпячиваний нет; (2) лизосомы только в центральной
              части клетки, у периферии их нет — подпись «перенос к периферии нарушен» (ПЕРЕДАЧА, разд. 3, п. 4); (3) разрыв слоя
              при растяжении. Три признака подписаны номерами (02, 5.4).
     ['hyp', o] — таблица: 6 гипотез OC.int_hypotheses() × 3 признака; в ячейке — какая причина набора даёт признак (02, 5.5).
     ['meas', [измерения], o] — таблица: 6 гипотез × выбранные измерения (OC.measure); o.sample — номер загаданной гипотезы
              (строка «загаданный случай» с её результатами, без названия); o.same — группы гипотез с одинаковыми результатами
              (подсвечиваются, OC.int_distinguish).
   Мембраны — бислой BF (S2F.mem, уменьшенный рисунок); лизосомы — замкнутый бислой (S2F.vesicle).
   ===================================================================== */
GN.s2_int = (function () {
  const { C, f, G, T, title, line, arrow, mem, roundRectPts, vesicle, nucleus, mtLine, ifRope } = S2F;
  const hypName = (t, h) => h.map(c => t('s2_int_cs_' + c)).join(' + ');
  function obs(t) {
    let s = title(t('s2_int_pA'));
    /* слой: две соседние клетки и условная клетка; разрыв между условной и правой соседней */
    s += G('nbr', mem(roundRectPts(26, 96, 150, 178, 30), { closed: true }, .5));
    s += G('nbr', mem(roundRectPts(430, 96, 150, 178, 30), { closed: true }, .5));
    const cx = 300, cy = 186, r = 86;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F7FAFC"/>` + G('pm', mem(BF.circlePts(cx, cy, r, 64), { closed: true }, .5));
    /* микротрубочки от центра к периферии; лизосомы только у ядра */
    [[0, -1], [.87, -.5], [.87, .5], [0, 1], [-.87, .5], [-.87, -.5]].forEach(([dx, dy]) => { s += mtLine(cx + dx * 22, cy + dy * 22, cx + dx * (r - 14), cy + dy * (r - 14), { w: 3 }); });
    s += nucleus(cx, cy, 30, 24, .32);
    [[-48, -10], [-38, 32], [46, -26], [50, 18], [8, -48], [-12, 48]].forEach(([dx, dy]) => { s += vesicle(cx + dx, cy + dy, 7.5, 'lyso', .32); });
    /* ПФ к контакту слева — сохранён; справа — разрыв */
    s += ifRope(cx - r + 6, cy - 4, 176, cy - 4, { w: 6 });
    s += G('tear', `<path d="M392,108 l14,18 l-12,16 l14,20 l-12,18 l14,20 l-12,18 l14,22 l-12,18 l12,16" fill="none" stroke="${C.bad}" stroke-width="2.6" stroke-linejoin="round"/>`);
    s += arrow(22, 300, -2, 300, C.ink, 2.4) + arrow(578, 300, 600, 300, C.ink, 2.4) + T(300, 300, t('s2_int_stretch'), { size: 11.5, w: 600, bg: true });
    /* подписи трёх признаков */
    const lab = (n, x, y, k, a, nw = 28) => `<circle cx="${f(x)}" cy="${f(y)}" r="10" fill="${C.ink}"/>` + T(x, y + .5, String(n), { size: 12, w: 700, col: '#fff' }) + T(x + (a === 'r' ? -16 : 16), y, t(k), { a: a || 'l', size: 11.5, w: 600, n: nw });
    s += lab(1, 212, 56, 's2_int_f1s') + line(220, 64, 258, 106, C.muted, 1.2);   /* v1.2, И-30: подпись не на мембране */
    s += lab(2, 300, 340, 's2_int_f2s') + line(300, 330, 300, 238, C.muted, 1.2);
    s += lab(3, 446, 52, 's2_int_f3s', 'l', 15) + line(440, 62, 404, 118, C.muted, 1.2);
    s += T(300, 400, t('s2_int_obs_note'), { size: 11, col: C.muted, it: true, n: 90 });
    return s;
  }
  function grid(t, head, rows, o = {}) {
    const x0 = 12, W = 576, c0 = 222, cw = (W - c0) / head.length, rh = Math.min(44, 352 / (rows.length + 1)), Y0 = 34, nc = Math.max(12, Math.floor((cw - 10) / 6));   /* v1.2, И-29: поля между колонками */
    const nlines = (s0, n) => Math.min(3, S2F.wrap(String(s0), n).split('\n').length);   /* v1.2, И-29: число строк — по фактическому переносу */
    let s = `<rect x="${x0}" y="${Y0}" width="${W}" height="${f(rh * (rows.length + 1))}" rx="8" fill="#fff" stroke="${C.line}"/>`;
    head.forEach((h, i) => { const nl = nlines(h, nc); s += T(x0 + c0 + cw * i + cw / 2, Y0 + rh / 2 - (nl - 1) * 6, h, { size: 10, w: 700, col: C.muted, n: nc }); });
    rows.forEach((r, j) => {
      const y = Y0 + rh * (j + 1);
      if (r.hl) s += `<rect x="${x0 + 2}" y="${f(y + 1)}" width="${W - 4}" height="${f(rh - 2)}" rx="6" fill="${r.hl}"/>`;
      s += line(x0 + 4, y, x0 + W - 4, y, C.line, 1);
      const nn = nlines(r.name, 37); s += T(x0 + 8, y + rh / 2 - (nn - 1) * 6.1, r.name, { a: 'l', size: 9.6, w: r.bold ? 700 : 600, n: 37 });
      r.cells.forEach((c, i) => { const nl = nlines(c, nc); s += T(x0 + c0 + cw * i + cw / 2, y + rh / 2 - (nl - 1) * 6.1, c, { size: 10, n: nc, col: r.col || C.ink }); });
    });
    return s;
  }
  function hyp(t) {
    const H = OC.int_hypotheses(), F = ['O1', 'O2', 'O4'];
    return title(t('s2_int_pB')) + grid(t, [t('s2_int_f1'), t('s2_int_f2'), t('s2_int_f3')],
      H.map((h, i) => ({ name: (i + 1) + '. ' + hypName(t, h), cells: F.map(o => h.filter(c => OC.EFFECT[c][o]).map(c => t('s2_int_cs_' + c)).join(', ')) })));
  }
  function meas(t, ms, o) {
    const H = OC.int_hypotheses(), same = o.same || [], tint = ['#FFF3C4', '#E3F1FF', '#F6E1F2'];
    const rows = H.map((h, i) => { const g = same.findIndex(gr => gr.includes(i)); return { name: (i + 1) + '. ' + hypName(t, h), cells: ms.map(m => t('s2_int_v_' + OC.measure(m, h))), hl: g >= 0 ? tint[g % 3] : null }; });
    if (o.sample != null) rows.push({ name: t('s2_int_sample'), bold: true, col: C.ctr, cells: ms.map(m => t('s2_int_v_' + OC.measure(m, H[o.sample]))), hl: '#E6F4F1' });
    return title(t('s2_int_pC')) + grid(t, ms.map(m => t('s2_int_meas_' + m)), rows) +
      (same.length ? T(300, 404, t('s2_int_same_note'), { size: 11, col: C.warn, w: 600, n: 90 }) : (ms.length ? T(300, 404, t('s2_int_all_note'), { size: 11, col: C.ok, w: 600, n: 90 }) : ''));
  }
  return { view(args, t) {
    const [mode, a1, a2] = args || [];
    if (mode === 'hyp') return hyp(t);
    if (mode === 'meas') { const ms = a1 || [], o = a2 || {}; return meas(t, ms, Object.assign({ same: ms.length ? OC.int_distinguish(ms).same : [] }, o)); }
    return obs(t);
  } };
})();

/* =====================================================================
   s3_gn_m.js — схемы карточек методов «Как это установили» (07, разд. 7; 11, разд. Г): что измеряется, контроль.
   GN.s2_m1 (['ab'|'ctrl']) — окрашивание антителами; GN.s2_m2 (['grow'|'cat'|'ctrl']) — наблюдение отдельной микротрубочки;
   GN.s2_m3 (['atp'|'noatp']) — подвижность моторов в пробирке; GN.s2_m4 (['t0'|'t30']) — флуоресцентный актин в ламеллиподии.
   Вызов (практикум, блок «Как это установили»): `<svg viewBox="0 0 600 260">${GN.s2_m1.view(['ab'], t)}</svg>` — кадр 600 × 260.
   Подписи — ключи s2_mK_… (texts_ui_r.py). Мембрана (·m4) — бислой BF. Схемы простые, без чисел измерений.
   ===================================================================== */
(function () {
  const { C, f, T, title, line, arrow, larrow, endSign, cross, mem, mtSide, mtLine, kinesin, axes, poly, roundRectPts } = S2F;
  const glass = (y, lab) => `<rect x="20" y="${y}" width="560" height="14" rx="3" fill="#DCE8F2" stroke="#9FB8D6"/>` + T(30, y + 7, lab, { size: 10.5, a: 'l', col: C.muted, it: true });
  GN.s2_m1 = { view(args, t) {
    const on = args[0] !== 'ctrl';
    let s = title(t('s2_m1_t')) + glass(220, t('s2_m1_glass'));
    const P = roundRectPts(60, 50, 260, 160, 60, 10);
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${on ? '#0E1A12' : '#EEF1F4'}"/>` + mem(P, { closed: true }, .45);
    if (on) [-60, -20, 20, 60, 110, 160, 200, 250, 300].forEach(d => { const a = d * Math.PI / 180; s += line(190, 130, 190 + 100 * Math.cos(a), 130 + 55 * Math.sin(a), '#6CF08F', 2.4); });
    s += T(190, 40, t('s2_m1_fix'), { size: 11, col: C.muted, it: true });
    /* лупа: Y-образное антитело с меткой на белке микротрубочки */
    s += `<circle cx="460" cy="120" r="72" fill="#fff" stroke="${C.line}"/>` + mtSide(400, 150, 520, { h: 18, signs: false });
    if (on) s += line(460, 140, 460, 112, C.motor, 3) + line(460, 112, 446, 92, C.motor, 3) + line(460, 112, 474, 92, C.motor, 3) + `<path d="M474,80 l4,8 9,1 -7,6 2,9 -8,-5 -8,5 2,-9 -7,-6 9,-1z" fill="#6CF08F" stroke="#2E7D32"/>`;
    s += T(460, 208, t(on ? 's2_m1_ab' : 's2_m1_ctrl'), { size: 11, w: 600, n: 30 });
    return s + T(190, 250, t('s2_m1_meas'), { size: 11, col: C.muted });
  } };
  GN.s2_m2 = { view(args, t) {
    const m = args[0];
    let s = title(t('s2_m2_t')) + glass(200, t('s2_m2_glass'));
    const len = m === 'cat' ? 70 : 180;
    s += `<rect x="40" y="186" width="60" height="12" rx="3" fill="${C.mtA}"/>` + T(70, 176, t('s2_m2_seed'), { size: 10.5, col: C.mtA, w: 600 });
    s += `<rect x="100" y="186" width="${len}" height="12" rx="3" fill="${m === 'cat' ? C.mtD : '#6CF08F'}"/>` + endSign(100 + len + 14, 192, '+', C.mtA, 7);
    const A = axes(380, 50, 190, 110, { min: 0, max: 10, ticks: [] }, { min: 0, max: 10, ticks: [] }, t('s2_m2_xl'), t('s2_m2_yl'));
    s += A.s + poly(m === 'cat' ? [[A.X(0), A.Y(1)], [A.X(6), A.Y(8)], [A.X(8), A.Y(2)]] : [[A.X(0), A.Y(1)], [A.X(8), A.Y(9)]], m === 'cat' ? C.mtD : C.mt, 2.4);
    s += T(200, 240, t(m === 'ctrl' ? 's2_m2_ctrl' : m === 'cat' ? 's2_m2_cat' : 's2_m2_grow'), { size: 11.5, w: 600 });
    return s;
  } };
  GN.s2_m3 = { view(args, t) {
    const on = args[0] !== 'noatp';
    let s = title(t('s2_m3_t')) + glass(214, t('s2_m3_glass'));
    /* моторы прикреплены к стеклу головками вверх; микротрубочка лежит на головках, минус-конец помечен ярко */
    [150, 230, 310, 390, 470].forEach(x => { s += kinesin(x, 168, { s: .9, stalk: -50 }); });
    s += mtSide(110, 150, 510, { h: 18 }) + `<rect x="110" y="141" width="40" height="18" rx="3" fill="#FFE066" opacity=".85"/>` + T(130, 120, t('s2_m3_bright'), { size: 10.5, w: 600 });
    if (on) s += larrow(330, 70, 170, 70, t('s2_m3_move'), C.mtA, { dy: -14 }) + T(450, 250, t('s2_m3_motor'), { size: 10.5, col: C.motor, w: 600 });
    else s += cross(310, 80, 9) + T(310, 106, t('s2_m3_noatp'), { size: 11.5, w: 700, col: C.bad });
    return s;
  } };
  GN.s2_m4 = { view(args, t) {
    const late = args[0] === 't30';
    let s = title(t('s2_m4_t'));
    /* край ламеллиподии: мембрана — бислой, снаружи — среда, внутри — сеть с метками */
    s += `<rect x="20" y="60" width="440" height="160" fill="${C.cyto}"/>` + mem([[460, 50], [460, 230]], {}, .5);
    s += T(520, 140, t('s2_m4_out'), { size: 10.5, col: C.muted, it: true }) + T(60, 236, t('s2_m4_cyt'), { size: 10.5, col: C.muted, it: true, a: 'l' });
    for (let k = 0; k < 22; k++) { const x = 60 + (k * 41) % 380, y = 72 + (k * 37) % 140; s += line(x, y, x + 12, y + 8, C.actinL, 2); }
    const spots = late ? [[330, 100], [340, 170], [440, 120], [442, 190]] : [[440, 100], [442, 170]];
    spots.forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="8" fill="#FFE066" stroke="${C.actin}" stroke-width="1.5"/>`; });
    if (late) s += arrow(420, 100, 346, 100, C.actin, 1.8) + T(330, 76, t('s2_m4_deep'), { size: 10.5, w: 600, col: C.actin }) + T(420, 214, t('s2_m4_new'), { size: 10.5, w: 600, col: C.actin, a: 'r' });
    s += T(80, 40, t(late ? 's2_m4_t30' : 's2_m4_t0'), { size: 12, w: 700, a: 'l' });
    return s;
  } };
})();

/* =====================================================================
   s3_gn_r.js — сцены «Объяснений» семинара 2, которых нет в практикуме (11, разд. А: 11 сцен s2_r_*; паспорта разд. Б).
   Контракт — как у сцен практикума (s2_figs.js): GN.<имя>.view(args, t) → SVG 600 × 420, подписи только через t(ключ)
   (ключи s2_r_<сцена>_… — texts_ui_r.py; в «Объяснениях» t берёт их из S.L шага). Библиотеки: S2F (детали, цвета систем
   07, 1.4), BF — для любой мембраны (клетка, ядерная оболочка — две мембраны, везикулы); конденсат EB1 — без бислоя.
   Рисунок — только то, что в паспорте 11 и тексте шага 04; научных фактов не добавлено. Решения — tools_s2/решения_r.md.
   ===================================================================== */
(function () {
  const { C, f, T, title, line, arrow, larrow, endSign, cross, mem, roundRectPts, vesicle, nucleus,
    actinFil, mtSide, mtLine, actinLine, ifRope, turc, centrosome, kinesin, dynein, myosinII, axes, poly } = S2F;
  const L = (sc, t) => (k, v) => t('s2_r_' + sc + '_' + k, v);
  /* точка внутри многоугольника */
  function inside(P, x, y) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
  /* луч из (x, y) под углом a до границы многоугольника; back — отступ внутрь от мембраны */
  function rayEnd(P, x, y, a, back = 14) { let r = 4; while (r < 700 && inside(P, x + r * Math.cos(a), y + r * Math.sin(a))) r += 2; r -= back; return [x + r * Math.cos(a), y + r * Math.sin(a), r]; }
  /* точки многоугольника, сдвинутые к центру на d (кортекс под мембраной) */
  function inset(P, d) { const cx = P.reduce((a, p) => a + p[0], 0) / P.length, cy = P.reduce((a, p) => a + p[1], 0) / P.length;
    return P.map(([x, y]) => { const n = Math.hypot(cx - x, cy - y) || 1; return [x + (cx - x) / n * d, y + (cy - y) / n * d]; }); }
  const path = (pts, col, w = 2, extra = '') => `<path d="M${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const qpath = (x0, y0, cx, cy, x1, y1, col, w, extra = '') => `<path d="M${f(x0)},${f(y0)} Q${f(cx)},${f(cy)} ${f(x1)},${f(y1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  const box = (x, y, w, h, fill, stroke) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="7" fill="${fill}" stroke="${stroke || 'none'}"/>`;
  /* тубулиновый димер (α тёмная, β светлая) — для отделяющихся и свободных субъединиц */
  const dimer = (x, y, a = 0, s = 1) => `<g transform="rotate(${f(a)} ${f(x)} ${f(y)})"><rect x="${f(x - 9 * s)}" y="${f(y - 4 * s)}" width="${f(9 * s)}" height="${f(8 * s)}" rx="${f(3 * s)}" fill="${C.mtA}"/><rect x="${f(x)}" y="${f(y - 4 * s)}" width="${f(9 * s)}" height="${f(8 * s)}" rx="${f(3 * s)}" fill="${C.mtB}"/></g>`;
  const gact = (x, y, r = 6, col = C.actin) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}" stroke="#fff" stroke-width="1"/>`;
  /* сеть промежуточных филаментов вокруг ядра (тонкие верёвки) */
  function ifCage(cx, cy, rx, ry, n = 10, w = 4) { let s = ''; for (let i = 0; i < n; i++) { const a0 = i / n * 2 * Math.PI, a1 = (i + 1.3) / n * 2 * Math.PI;
    s += ifRope(cx + rx * Math.cos(a0), cy + ry * Math.sin(a0), cx + rx * Math.cos(a1), cy + ry * Math.sin(a1), { w, g: 'vimentin' }); } return s; }

  /* ---------- ·1, режим 1: клетка в плане — три сети (11, ·1; 04, ·1) ---------- */
  GN.s2_r_overview = { view(args, t) {
    const l = L('overview', t);
    let s = title(l('t'));
    /* клетка: слева — плоский контакт с соседями, справа — свободный край с ламеллиподией (суперэллипс + выступ) */
    const cx0 = 352, cy0 = 214, P = [];
    for (let i = 0; i < 120; i++) { const a = i / 120 * 2 * Math.PI, c = Math.cos(a), sn = Math.sin(a);
      const rx = 142 + (c > 0 ? 78 * Math.exp(-Math.pow(sn / .42, 2)) * c : 0), ry = 132;
      P.push([cx0 + rx * Math.sign(c) * Math.pow(Math.abs(c), .5), cy0 + ry * Math.sign(sn) * Math.pow(Math.abs(sn), .5)]); }
    s += `<rect x="18" y="66" width="164" height="140" rx="30" fill="${C.cyto}"/>` + mem(roundRectPts(18, 66, 164, 140, 30, 8), { closed: true }, .5);
    s += `<rect x="18" y="222" width="164" height="140" rx="30" fill="${C.cyto}"/>` + mem(roundRectPts(18, 222, 164, 140, 30, 8), { closed: true }, .5);
    s += T(96, 136, l('nb'), { size: 11.5, col: C.muted, it: true }) + T(96, 292, l('nb'), { size: 11.5, col: C.muted, it: true });
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>`;
    [[196, 150], [196, 280]].forEach(([x, y]) => { s += S2F.G('desmosome', box(x - 14, y - 13, 8, 26, '#4A3A28') + box(x + 2, y - 13, 8, 26, '#4A3A28')); });
    s += mem(P, { closed: true }, .5);
    /* кортекс: актин под мембраной по всему краю; ламеллиподия — густая сеть у свободного края */
    const In = inset(P, 11);
    for (let i = 0; i < In.length; i += 2) { const a = In[i], b = In[(i + 1) % In.length]; s += S2F.G('cortex', line(a[0], a[1], b[0], b[1], C.actin, 2.6)); }
    for (let k = 0; k < 60; k++) { const y = 168 + (k * 37) % 94, x = 492 + (k * 53) % 74, a = (k % 2 ? 35 : -35) * Math.PI / 180, dx = 8 * Math.cos(a), dy = 8 * Math.sin(a);
      if (inside(P, x + dx * 1.8, y + dy * 1.8) && inside(P, x - dx * 1.8, y - dy * 1.8)) s += S2F.G('lamellipodium', line(x - dx, y - dy, x + dx, y + dy, C.actin, 2)); }
    /* ядро и промежуточные филаменты от ядра к десмосомам */
    const nx = 300, ny = 226;
    s += ifRope(nx - 46, ny - 18, 206, 150, { w: 5 }) + ifRope(nx - 46, ny + 22, 206, 280, { w: 5 }) + ifRope(nx - 28, ny - 40, 236, 104, { w: 4 }) + ifRope(nx - 26, ny + 44, 238, 330, { w: 4 });
    s += nucleus(nx, ny, 54, 46, .3);
    /* центросома у ядра; микротрубочки радиально, плюс-концы у периферии; к левой стороне — в обход ядра */
    const cx = 376, cy = 176;
    [-95, -60, -28, 4, 34, 62, 92].forEach(d => { const [ex, ey] = rayEnd(P, cx, cy, d * Math.PI / 180, 22); s += mtLine(cx, cy, ex, ey, { w: 3.4, signs: true, minus: false, sr: 6 }); });
    [[300, 132, 236, 118], [266, 160, 226, 196], [430, 330, 300, 320]].forEach(([qx, qy, ex, ey]) => { s += S2F.G('mt', qpath(cx, cy, qx, qy, ex, ey, C.mt, 3.4)) + endSign(ex - 9, ey + (ey > cy ? 4 : -2), '+', C.mtA, 6); });
    s += centrosome(cx, cy, { R: 12 });
    s += endSign(cx + 20, cy + 26, '-', C.mtA, 6.5);   /* v1.2, И-33: минус-концы — у центросомы (T-UI-2) */
    s += T(nx, ny, l('nuc'), { size: 12, w: 600 });
    s += line(cx + 6, cy - 8, 400, 52, C.muted, 1) + T(404, 46, l('cent'), { size: 11.5, a: 'l', w: 600, col: C.turc });
    s += T(590, 60, l('mt'), { size: 11.5, a: 'r', w: 600, col: C.mtA }) + T(590, 76, l('mt2'), { size: 11, a: 'r', col: C.mtA });
    s += line(540, 250, 560, 372, C.muted, 1) + T(590, 384, l('lam'), { size: 11.5, a: 'r', w: 600, col: C.actin });
    s += line(330, 343, 330, 388, C.muted, 1) + T(330, 400, l('cortex'), { size: 11.5, w: 600, col: C.actin });
    s += line(236, 104, 200, 42, C.muted, 1) + T(16, 36, l('if'), { size: 11.5, a: 'l', w: 600, col: C.if });
    s += line(196, 293, 160, 380, C.muted, 1) + T(16, 392, l('desm'), { size: 11.5, a: 'l', w: 600, col: '#4A3A28', n: 30 });
    return s;
  } };

  /* ---------- ·4: промежуточные филаменты — сборка, белки в разных клетках, разборка (11, ·4; 04, ·4) ---------- */
  GN.s2_r_if_assembly = { view(args, t) {
    const l = L('if_assembly', t), mode = args[0];
    let s = '';
    /* мономер: головка — стержень — хвост; стрелка ориентации */
    const mono = (x, y, dir = 1, col = C.if) => { const a = dir > 0 ? x : x + 70, b = dir > 0 ? x + 70 : x;
      return `<circle cx="${f(a)}" cy="${f(y)}" r="5" fill="${C.ifL}"/>` + line(x + 6, y, x + 64, y, col, 5) + `<circle cx="${f(b)}" cy="${f(y)}" r="4" fill="${C.ifL}"/>`; };
    const orient = (x, y, dir) => arrow(dir > 0 ? x + 18 : x + 52, y, dir > 0 ? x + 52 : x + 18, y, C.if, 1.8);
    if (mode === 'assembly') {
      s += title(l('t'));
      /* ряд 1: мономер → параллельный димер */
      s += S2F.G('ifmono', mono(46, 92)) + orient(46, 76, 1) + T(81, 120, l('mono'), { size: 11.5, w: 600 }) + T(81, 136, l('mono2'), { size: 10.5, col: C.muted });
      s += arrow(126, 92, 162, 92, C.muted, 1.8);
      s += S2F.G('ifdimer', mono(176, 86) + mono(176, 98, 1, C.ifL)) + orient(176, 72, 1) + T(211, 120, l('dimer'), { size: 11.5, w: 600 });
      s += arrow(262, 92, 302, 92, C.muted, 1.8);
      /* антипараллельный тетрамер: два димера навстречу друг другу, со смещением */
      s += S2F.G('tetramer', mono(320, 84) + mono(320, 92, 1, C.ifL) + mono(344, 108, -1) + mono(344, 116, -1, C.ifL)) + orient(320, 70, 1) + orient(344, 130, -1);
      s += T(368, 150, l('tetra'), { size: 11.5, w: 600 }) + T(368, 166, l('tetra2'), { size: 10.5, col: C.muted });
      s += arrow(430, 100, 468, 100, C.muted, 1.8);
      /* единичный филамент: тетрамеры бок о бок */
      let u = ''; for (let i = 0; i < 4; i++) u += line(484, 78 + i * 7, 560, 78 + i * 7, i % 2 ? C.ifL : C.if, 4.4);
      s += S2F.G('tetramer', u) + T(522, 120, l('ulf'), { size: 11.5, w: 600 });
      s += arrow(522, 176, 522, 222, C.muted, 1.8) + T(512, 200, l('endtoend'), { size: 10.5, col: C.muted, a: 'r' });
      /* филамент около 10 нм: концы одинаковы, знаков «+»/«−» нет */
      s += ifRope(80, 262, 500, 262, { w: 14 });
      s += T(80, 238, l('same'), { size: 11.5, col: C.if, w: 700, a: 'l' }) + T(500, 238, l('same'), { size: 11.5, col: C.if, w: 700, a: 'r' });
      s += T(290, 296, l('fil'), { size: 12, w: 600 });
      s += T(300, 352, l('note'), { size: 12, col: C.muted, it: true, n: 80 });
      return s;
    }
    if (mode === 'classes') {
      s += title(l('t2'));
      /* эпителиальная клетка, соседняя клетка, внеклеточный матрикс снизу */
      const ex = 40, ey = 60, ew = 200, eh = 230;
      s += `<rect x="${ex}" y="${ey}" width="${ew}" height="${eh}" rx="22" fill="${C.cyto}"/>` + mem(roundRectPts(ex, ey, ew, eh, 22, 8), { closed: true }, .5);
      s += `<rect x="${ex + ew + 22}" y="${ey}" width="90" height="${eh}" rx="22" fill="${C.cyto}"/>` + mem(roundRectPts(ex + ew + 22, ey, 90, eh, 22, 8), { closed: true }, .5);
      s += `<rect x="20" y="${ey + eh + 20}" width="330" height="22" rx="4" fill="#E6E1D6"/>` + T(185, ey + eh + 31, l('ecm'), { size: 10.5, col: C.muted, it: true });
      const dx = ex + ew + 11, D = [[dx, 120], [dx, 230]], H = [[90, ey + eh + 10], [190, ey + eh + 10]];
      D.forEach(([x, y]) => { s += S2F.G('desmosome', box(x - 12, y - 12, 8, 24, '#4A3A28') + box(x + 4, y - 12, 8, 24, '#4A3A28')); });
      H.forEach(([x, y]) => { s += S2F.G('hemidesmosome', box(x - 14, y - 4, 28, 9, '#4A3A28')); });
      /* ядро с ламиной (под внутренней мембраной ядра) */
      const nx = 130, ny = 168;
      s += nucleus(nx, ny, 50, 42, .35) + S2F.G('lamin', `<ellipse cx="${nx}" cy="${ny}" rx="38" ry="30" fill="none" stroke="${C.if}" stroke-width="2.4" stroke-dasharray="5 2"/>`);
      /* кератиновые филаменты от ядра к десмосомам и гемидесмосомам */
      s += ifRope(nx + 48, ny - 20, dx - 12, 120, { w: 5, g: 'keratin' }) + ifRope(nx + 48, ny + 22, dx - 12, 230, { w: 5, g: 'keratin' }) + ifRope(nx - 18, ny + 40, 90, ey + eh + 6, { w: 5, g: 'keratin' }) + ifRope(nx + 20, ny + 40, 190, ey + eh + 6, { w: 5, g: 'keratin' });
      s += T(nx, ny, l('lamina'), { size: 10.5, col: C.if, w: 600 });
      s += T(ex + 6, ey - 16, l('epi'), { size: 11.5, w: 700, a: 'l' }) + line(dx, 106, dx + 16, 46, C.muted, 1) + T(dx + 18, 42, l('desm'), { size: 10.5, col: '#4A3A28', w: 600, a: 'l' }) + T(140, ey + eh + 58, l('hemi'), { size: 10.5, col: '#4A3A28', w: 600 });
      s += T(160, 92, l('ker'), { size: 11, col: C.if, w: 700, a: 'l' });
      /* перечень классов (04, ·4) */
      const rows = ['r1', 'r2', 'r3', 'r4', 'r5'];
      s += box(372, 42, 220, 288, '#fff', C.line);
      rows.forEach((r, i) => { const y = 62 + i * 56; s += S2F.G('ifclass', line(386, y, 410, y, i % 2 ? C.ifL : C.if, 5)) + T(418, y - 7, l(r + 'a'), { size: 11.5, w: 700, a: 'l', col: C.if }) + T(418, y + 9, l(r + 'b'), { size: 10, a: 'l', col: C.muted, n: 29 }); });
      s += T(300, 392, l('note2'), { size: 12, col: C.muted, it: true, n: 80 });
      return s;
    }
    /* mitosis: сеть → фосфорилирование («Ф») → тетрамеры */
    s += title(l('t3'));
    let net = ''; [[40, 110, 230, 150], [40, 170, 230, 130], [60, 90, 200, 250], [50, 230, 240, 230], [70, 270, 220, 90], [40, 200, 240, 200]].forEach(([a, b, c, d]) => { net += ifRope(a, b, c, d, { w: 6 }); });
    s += net + T(140, 300, l('net'), { size: 12, w: 600 });
    s += larrow(262, 180, 338, 180, '', C.ink) + T(300, 160, l('phos'), { size: 11.5, w: 700 });
    s += `<circle cx="300" cy="208" r="11" fill="${C.pi}"/>` + T(300, 208, l('F'), { size: 12, w: 700, col: '#fff' });
    [[380, 100], [470, 130], [540, 92], [400, 200], [500, 220], [430, 270], [540, 280], [380, 300]].forEach(([x, y], i) => {
      s += S2F.G('tetramer', mono(x - 30, y - 4, 1) + mono(x - 22, y + 6, -1)) + `<circle cx="${x + 46}" cy="${y - 10}" r="8" fill="${C.pi}"/>` + T(x + 46, y - 10, l('F'), { size: 10, w: 700, col: '#fff' }); });
    s += T(460, 340, l('tetras'), { size: 12, w: 600 });
    s += T(300, 386, l('note3'), { size: 12, col: C.muted, it: true, n: 84 });
    return s;
  } };

  /* ---------- ·7: ядро в узком промежутке (11, ·7; 04, ·7) — качественно, без сил в числах ---------- */
  GN.s2_r_nucleus = { view(args, t) {
    const l = L('nucleus', t), mode = args[0];
    let s = title(l('t'));
    /* стенки промежутка */
    const gx0 = 250, gx1 = 430, gy0 = 156, gy1 = 264;
    s += `<rect x="${gx0}" y="${gy0 - 24}" width="${gx1 - gx0}" height="24" fill="#C9CFD6"/><rect x="${gx0}" y="${gy1}" width="${gx1 - gx0}" height="24" fill="#C9CFD6"/>`;
    s += T((gx0 + gx1) / 2, gy1 + 40, l('gap'), { size: 11, col: C.muted, w: 600 });
    if (mode === 'before' || mode === 'inside') s += T((gx0 + gx1) / 2, gy0 - 34, l('wall'), { size: 10.5, col: C.muted, it: true });
    const lam = (cx, cy, rx, ry) => S2F.G('lamin', `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx - 7)}" ry="${f(ry - 7)}" fill="none" stroke="${C.if}" stroke-width="2.6"/>`);
    const amy = (x0, x1, y) => actinLine(x0, y, x1, y, { r: 2.2, g: 'actomyosin' }) + myosinII((x0 + x1) / 2, y, 30, 'myosin2');
    if (mode === 'before') {
      const P = roundRectPts(40, 120, 200, 180, 70, 10);
      s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
      s += ifCage(130, 210, 64, 56) + nucleus(130, 210, 56, 48, .32) + lam(130, 210, 56, 48);
      s += amy(70, 190, 140) + amy(70, 190, 282);
      s += centrosome(214, 210, { R: 9 }); [[-40], [0], [40]].forEach(([d]) => { const a = d * Math.PI / 180; s += mtLine(214, 210, 214 + 22 * Math.cos(a), 210 + 22 * Math.sin(a), { w: 2.6, signs: false }); });
      s += T(130, 210, l('nuc'), { size: 11.5, w: 700 });
      s += larrow(80, 352, 220, 352, l('dir'), C.ink);
      s += T(480, 360, l('n1'), { size: 12, w: 600, n: 30 });
      return s;
    }
    if (mode === 'inside') {
      /* клетка вошла в промежуток: ядро вытянуто; актомиозин по бокам сжимает, микротрубочки от центросомы впереди тянут */
      const P = [];
      roundRectPts(150, gy0 + 6, 330, gy1 - gy0 - 12, 40, 10).forEach(p => P.push(p));
      s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
      const nx = 300, ny = 210;
      s += ifCage(nx, ny, 84, 36, 12, 3.4) + nucleus(nx, ny, 78, 30, .3) + lam(nx, ny, 78, 30);
      s += amy(220, 380, gy0 + 22) + amy(220, 380, gy1 - 22);
      s += arrow(300, gy0 + 30, 300, ny - 26, C.actin, 2.4) + arrow(300, gy1 - 30, 300, ny + 26, C.actin, 2.4);
      s += arrow(176, ny, 214, ny, C.actin, 2.6);
      const cx = 420, cy = 210; s += centrosome(cx, cy, { R: 9 });
      [[cx, cy, 384, 200], [cx, cy, 384, 220], [cx, cy, 464, 192], [cx, cy, 468, 210], [cx, cy, 464, 228]].forEach(([a, b, c, d]) => { s += mtLine(a, b, c, d, { w: 2.6, signs: false }); });
      s += arrow(500, 210, 560, 210, C.mtA, 2.6);
      /* подписи */
      s += T(130, 90, l('am'), { size: 11.5, w: 700, col: C.actin, a: 'l' }) + line(200, 98, 250, gy0 + 20, C.muted, 1);
      s += T(130, 106, l('squeeze'), { size: 11, col: C.actin, a: 'l' });
      s += T(130, 330, l('push'), { size: 11, col: C.actin, a: 'l' }) + line(175, 320, 195, ny + 6, C.muted, 1);
      s += T(452, 74, l('mtc'), { size: 11.5, w: 700, col: C.mtA, a: 'l', n: 20 }) + T(452, 106, l('pull'), { size: 11, col: C.mtA, a: 'l' }) + line(470, 112, 432, 196, C.muted, 1);
      s += T(470, 330, l('ifn'), { size: 11.5, w: 700, col: C.if, a: 'l', n: 20 }) + line(468, 322, 360, ny + 26, C.muted, 1);
      s += T(nx, ny, l('nuc'), { size: 11, w: 700 });
      s += T(300, 396, l('debate'), { size: 10.5, col: C.muted, it: true, n: 90 });   /* v1.2, И-19: механизм зависит от типа клеток и обсуждается (Kalukula 2022) */
      return s;
    }
    /* после выхода: с ламинами A/C и виментином форма восстановлена; без них — нет, возможен разрыв оболочки */
    const ok = mode === 'after';
    const P = roundRectPts(420, 120, 160, 180, 60, 10);
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
    if (ok) s += ifCage(500, 210, 60, 52) + nucleus(500, 210, 52, 44, .3) + lam(500, 210, 52, 44) + T(500, 210, l('nuc'), { size: 11, w: 700 });
    else {
      /* ядро осталось вытянутым и неровным; разрыв оболочки — красный значок */
      s += `<ellipse cx="500" cy="210" rx="62" ry="28" fill="${C.nuc}"/>` + mem(BF.ellipsePts(500, 210, 62, 28, 56).map(([x, y], i) => [x, y + Math.sin(i * 1.3) * 3]), { closed: true }, .3);
      s += mem(BF.ellipsePts(500, 210, 55, 21, 52), { closed: true }, .3);
      s += `<rect x="538" y="184" width="18" height="16" fill="${C.nuc}"/>` + cross(547, 178, 7) + T(500, 210, l('nuc'), { size: 11, w: 700 });
    }
    s += larrow(80, 352, 220, 352, l('dir'), C.ink);
    s += T(200, 64, l(ok ? 'ok' : 'nolam'), { size: 12, w: 700, col: ok ? C.ok : C.bad, n: 34 });
    s += T(200, 96, l(ok ? 'ok2' : 'nolam2'), { size: 11.5, col: C.muted, n: 44 });
    return s;
  } };

  /* ---------- ·8: полимеризация и нуклеация — скорости от концентрации, Cc, затравка (11, ·8; 04, ·8) ---------- */
  GN.s2_r_kinetics = { view(args, t) {
    const l = L('kinetics', t), m = args[0];
    let s = title(l('t'));
    if (m === 'seed') {
      /* две пробирки: без затравки субъединицы порознь; с кольцом γ-TuRC растёт микротрубочка */
      const tube = (x, lab) => `<path d="M${x},70 L${x},300 Q${x},340 ${x + 50},340 Q${x + 100},340 ${x + 100},300 L${x + 100},70" fill="#F4F8FB" stroke="${C.muted}" stroke-width="2"/>` + T(x + 50, 360, lab, { size: 12, w: 700 });
      s += tube(90, l('tube1')) + tube(380, l('tube2'));
      [[110, 120], [150, 160], [120, 220], [170, 260], [130, 300], [160, 100], [175, 200], [112, 270]].forEach(([x, y], i) => { s += dimer(x, y, i * 40); });
      [[400, 120], [470, 110], [405, 300], [468, 296], [395, 220]].forEach(([x, y], i) => { s += dimer(x, y, i * 50); });
      s += turc(430, 300, 8);
      s += S2F.G('mt', `<rect x="423" y="160" width="14" height="132" rx="3" fill="${C.mtB}" stroke="${C.mtA}"/>`) + endSign(430, 146, '+', C.mtA, 7) + T(452, 318, l('turc'), { size: 11, col: C.turc, w: 700, a: 'l' });
      s += T(140, 390, l('noseed'), { size: 11.5, col: C.bad, w: 600, n: 30 }) + T(430, 390, l('seed'), { size: 11.5, col: C.ok, w: 600, n: 30 });
      return s;
    }
    /* график: присоединение ∝ C, отделение не зависит от C; пересечение — критическая концентрация Cc */
    const A = axes(70, 66, 300, 250, { min: 0, max: 2.5, ticks: [] }, { min: 0, max: 2.5, ticks: [] }, l('xl'), l('yl'));
    s += A.s + poly([[A.X(0), A.Y(0)], [A.X(2.5), A.Y(2.5)]], C.ok, 2.6) + poly([[A.X(0), A.Y(1)], [A.X(2.5), A.Y(1)]], C.bad, 2.6);
    s += T(A.X(2.05), A.Y(2.3), l('on'), { size: 11.5, col: C.ok, w: 700, a: 'r' }) + (m < 1 ? T(A.X(2.45), A.Y(1) - 12, l('off'), { size: 11.5, col: C.bad, w: 700, a: 'r' }) : T(A.X(0.08), A.Y(1) - 12, l('off'), { size: 11.5, col: C.bad, w: 700, a: 'l' }))   /* v1.2, И-30: подпись — на стороне графика без стрелки режима */;
    s += `<circle cx="${f(A.X(1))}" cy="${f(A.Y(1))}" r="5" fill="${C.ink}"/>`; const ccl = T(A.X(1) + 10, A.Y(1) + 18, l('cc'), { size: 11, a: 'l', w: 600, bg: true }) + line(A.X(1), A.Y(0), A.X(1), A.Y(0) + 5, C.ink, 1.4) + T(A.X(1), A.Y(0) + 13, 'Cc', { size: 10.5, w: 700 });
    const c = m;
    s += line(A.X(c), A.Y(0), A.X(c), A.Y(Math.max(c, 1)) - 6, C.ink, 1.4, 'stroke-dasharray="4 3"') + T(A.X(c), A.Y(0) - 10 - (c < 1 ? 0 : 0), l(c < 1 ? 'cl' : 'ch'), { size: 11, w: 700, bg: true });
    s += arrow(A.X(c), A.Y(Math.min(c, 1)), A.X(c), A.Y(Math.max(c, 1)), c < 1 ? C.bad : C.ok, 2) + ccl;
    /* миниатюра полимера: при C < Cc укорачивается, при C > Cc растёт */
    const px = 416, py = 190, n = c < 1 ? 3 : 6;
    s += box(400, 96, 186, 230, '#fff', C.line) + T(493, 116, l('mini'), { size: 11.5, w: 700 });
    for (let i = 0; i < n; i++) s += S2F.G('polymer', dimer(px + 14 + i * 18, py, 0, 1));
    const pe = px + 14 + n * 18 - 9;
    s += endSign(px - 2, py, '-', C.mtA, 7) + endSign(pe + 14, py, '+', C.mtA, 7);
    if (c < 1) { s += dimer(pe + 40, py - 40, 30) + dimer(pe + 54, py - 14, -20) + arrow(pe + 16, py - 14, pe + 34, py - 32, C.bad, 1.6) + T(493, 270, l('shrink'), { size: 12, w: 700, col: C.bad }); }
    else { s += dimer(pe + 44, py - 38, 0) + arrow(pe + 40, py - 28, pe + 22, py - 14, C.ok, 1.6) + T(493, 270, l('grow'), { size: 12, w: 700, col: C.ok }); }
    s += T(493, 300, l(c < 1 ? 'shrink2' : 'grow2'), { size: 10.5, col: C.muted, n: 28 });
    s += T(220, 392, l('lim'), { size: 11, col: C.muted, it: true, n: 70 });
    return s;
  } };

  /* ---------- ·12: зачем разборка — захват конца и таксол (11, ·12; 04, ·12) ---------- */
  GN.s2_r_capture = { view(args, t) {
    const l = L('capture', t), mode = args[0];
    let s = title(l('t'));
    const P = roundRectPts(60, 50, 400, 290, 90, 12);
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .5);
    /* стабилизирующая структура у мембраны справа (синий прямоугольник) */
    s += S2F.G('capstruct', box(430, 172, 18, 46, C.motor));
    const cx = 250, cy = 195;
    /* 8 направлений; длины в режимах; оранжевая — укорачивается */
    const LEN = { dyn: [120, 70, 140, 50, 110, 90, 60, 130], capture: [168, 100, 60, 120, 40, 130, 90, 70], taxol: null };
    const SHR = { dyn: [0, 1, 0, 1, 0, 0, 1, 0], capture: [0, 0, 1, 0, 1, 0, 0, 1], taxol: [0, 0, 0, 0, 0, 0, 0, 0] };
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * 2 * Math.PI, end = rayEnd(P, cx, cy, a, 30);
      let r = mode === 'taxol' ? end[2] : Math.min(LEN[mode][k], end[2]);
      if (mode === 'capture' && k === 0) r = 430 - 4 - cx;   /* плюс-конец связан со стабилизирующей структурой */
      const ex = cx + r * Math.cos(a), ey = cy + r * Math.sin(a), cap = mode === 'capture' && k === 0;
      s += mtLine(cx, cy, ex, ey, { w: cap ? 5.5 : 3.6, col: cap ? C.mtA : SHR[mode][k] ? C.mtD : C.mt, signs: true, minus: false, sr: 6 });
    }
    s += centrosome(cx, cy, { R: 13 });
    s += endSign(cx - 31, cy - 13, '-', C.mtA, 7);   /* v1.2, И-33: минус-концы — у центросомы (T-UI-2) */
    s += line(cx + 6, cy - 8, 470, 84, C.muted, 1) + T(472, 74, l('minus'), { size: 10.5, col: C.muted, a: 'l', n: 18 });
    s += T(470, 160, l('struct'), { size: 11, w: 700, col: C.motor, a: 'l', n: 15 });
    if (mode === 'capture') s += T(350, 170, l('cap'), { size: 11, w: 700, col: C.mtA, bg: true });
    if (mode === 'taxol') s += T(250, 360, l('nore'), { size: 12, w: 700, col: C.bad });
    /* обозначения: растёт / укорачивается */
    if (mode !== 'taxol') s += line(80, 360, 104, 360, C.mt, 4) + T(110, 360, l('grow'), { size: 11, a: 'l' }) + line(200, 360, 224, 360, C.mtD, 4) + T(230, 360, l('shrink'), { size: 11, a: 'l' });
    /* таблица веществ (04, ·12) */
    s += box(14, 380, 572, 34, '#fff', C.line) + T(24, 397, l('tab'), { size: 11, a: 'l', w: 600 });
    return s;
  } };

  /* ---------- ·14: конденсат EB1 на плюс-конце (11, ·14; 04, ·14) — без чисел; конденсат без мембраны ---------- */
  GN.s2_r_eb1 = { view(args, t) {
    const l = L('eb1', t), mode = args[0];
    let s = title(l('t'));
    s += mtSide(60, 200, 330, { h: 40, cap: 0 });
    if (mode === 'eb1') {
      /* облако конденсата: полупрозрачное, без бислоя; внутри EB1, тубулин, другие белки плюс-конца */
      s += S2F.G('condensate', `<ellipse cx="345" cy="200" rx="70" ry="58" fill="${C.eb1}" opacity=".22"/>`);
      [[320, 168], [352, 160], [380, 180], [372, 222], [340, 236], [312, 230], [396, 204], [330, 200]].forEach(([x, y]) => { s += S2F.G('eb1', `<circle cx="${x}" cy="${y}" r="5" fill="${C.eb1}" stroke="#A86410" stroke-width="1"/>`); });
      s += dimer(362, 196, 20) + dimer(386, 236, -30) + dimer(318, 152, 10);
      [[300, 246], [392, 160]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${C.grey}"/>`; });
      s += T(345, 120, l('cond'), { size: 11.5, w: 700, col: '#A86410' });
      s += larrow(428, 150, 472, 150, '', C.ok) + T(480, 150, l('vg'), { size: 12, w: 700, a: 'l', col: C.ok, n: 11 });   /* v1.2, И-26: подписи целиком в рамке */
      s += larrow(428, 250, 472, 250, '', C.warn) + T(480, 250, l('cat'), { size: 12, w: 700, a: 'l', col: C.warn, n: 11 });
      s += T(345, 290, l('inside'), { size: 11, col: C.muted, n: 40 });
    } else if (mode === 'mut') {
      /* EB1 без конденсата: точки рассеяны вдоль стенки и в стороне, скопления у конца нет */
      [[100, 136], [170, 236], [250, 128], [290, 240], [380, 130], [420, 260], [460, 190], [200, 120], [140, 280]].forEach(([x, y]) => { s += S2F.G('eb1', `<circle cx="${x}" cy="${y}" r="5" fill="${C.eb1}" stroke="#A86410" stroke-width="1"/>`); });
      s += T(345, 320, l('mut'), { size: 12, w: 700, col: C.bad, n: 44 });
    } else s += T(345, 300, l('bare'), { size: 12, w: 600, col: C.muted, n: 40 });
    s += T(195, 160, l('mt'), { size: 11.5, w: 700, col: C.mtA });
    s += T(300, 390, l('note'), { size: 11, col: C.muted, it: true, n: 84 });
    return s;
  } };

  /* ---------- ·16: шаг кинезина-1 и динеин (11, ·16; 04, ·16; MBoC7 рис. 16–53) — схема цикла упрощена ---------- */
  GN.s2_r_kinesin_step = { view(args, t) {
    const l = L('kinesin_step', t), mode = args[0];
    let s = title(l('t'));
    const head = (x, y, col, lab, up = 0) => S2F.G('kinesin', `<ellipse cx="${f(x)}" cy="${f(y - 8 - up)}" rx="13" ry="10" fill="${col}"/>`) + (lab ? T(x, y - 8 - up, lab, { size: 8.5, w: 700, col: '#fff' }) : '');
    /* мотор на микротрубочке: rear, front — x головок; rearUp — задняя головка поднята; cargo наверху */
    function kin(cx, y, rearX, frontX, rearLab, frontLab, rearUp, swing, swap) {
      let q = '';
      const top = y - 100;
      q += line(rearX, y - 18 - rearUp, cx, y - 44, C.motor, 3) + line(frontX, y - 18, cx, y - 44, C.motor, 3) + line(cx, y - 44, cx, top + 18, C.motor, 3.4);
      q += head(rearX, y, swap ? C.motor : C.motorL, rearLab, rearUp) + head(frontX, y, swap ? C.motorL : C.motor, frontLab);
      if (swing) q += `<path d="M${f(rearX)},${f(y - 40)} Q${f((rearX + swing) / 2)},${f(y - 84)} ${f(swing)},${f(y - 40)}" fill="none" stroke="${C.ink}" stroke-width="1.8" stroke-dasharray="5 3"/>` + arrow(swing - 8, y - 48, swing, y - 38, C.ink, 1.6);
      return q + vesicle(cx, top, 16, 'cargo', .5);
    }
    if (mode === 'p12' || mode === 'p34') {
      const panes = mode === 'p12' ? [1, 2] : [3, 4];
      panes.forEach((ph, i) => {
        const x0 = 20 + i * 290, y = 300;
        s += box(x0, 46, 270, 330, '#fff', C.line) + T(x0 + 12, 64, l('ph' + ph), { size: 11.5, w: 700, a: 'l', n: 40 });
        s += mtSide(x0 + 26, y + 14, x0 + 244, { h: 22 });
        const cx = x0 + 135;
        /* v1.2 (рецензия И-01; Yildiz 2025: передняя головка не связывает АТФ, пока задняя не отделилась; MBoC7, рис. 16–53):
           1 — задняя головка после гидролиза АТФ и ухода фосфата отделилась (АДФ); 2 — передняя, связанная с микротрубочкой, связывает АТФ;
           3 — изменение формы передней головки переносит заднюю вперёд; 4 — головка связалась впереди и отдала АДФ */
        if (ph === 1) s += kin(cx, y, cx - 26, cx + 26, l('adp'), '', 26, 0) + T(cx - 72, y - 84, l('rear'), { size: 10.5, col: C.motor, w: 600 }) + T(cx + 58, y - 70, l('front'), { size: 10.5, col: C.motor, w: 600 });
        if (ph === 2) s += kin(cx, y, cx - 26, cx + 26, l('adp'), l('atp'), 26, 0) + T(cx + 58, y - 70, l('front'), { size: 10.5, col: C.motor, w: 600 });
        if (ph === 3) s += kin(cx, y, cx - 26, cx + 26, l('adp'), l('atp'), 26, cx + 78);
        if (ph === 4) s += kin(cx + 26, y, cx + 26, cx + 78, '', '', 0, 0, true) + larrow(x0 + 60, y + 50, x0 + 210, y + 50, l('toplus'), C.motor, { dy: 16 });
      });
      return s;
    }
    if (mode === 'dynein') {
      s += mtSide(70, 300, 530, { h: 24 });
      s += dynein(300, 288, { s: 1.6, stalk: 60 }) + vesicle(296, 182, 18, 'cargo', .5);
      s += T(380, 236, l('ring'), { size: 11, w: 600, col: C.motor, a: 'l' }) + T(330, 280, l('stalk'), { size: 10.5, col: C.motor, a: 'l' });
      s += larrow(400, 360, 200, 360, l('tominus'), C.motor, { dy: 18 });
      return s;
    }
    /* нет АТФ (v1.2, И-01; Yildiz 2025: «kinesin 1 waits for ATP binding»): мотор связан с микротрубочкой одной головкой, вторая (с АДФ) отделена, шагов нет */
    s += mtSide(70, 300, 530, { h: 24 }) + kin(300, 286, 274, 326, l('adp'), '', 26, 0);
    s += cross(300, 364, 9) + T(300, 392, l('noatp'), { size: 12, w: 700, col: C.bad });
    return s;
  } };

  /* ---------- ·17: направление моторов (11, ·17; 04, ·17) — направление к концу не зависит от поворота пути ---------- */
  GN.s2_r_motor_families = { view(args, t) {
    const l = L('motor_families', t), mode = args[0];
    let s = title(l('t'));
    const y = 240;
    if (mode === 'actin') {
      s += actinFil(70, y, 530, y, { n: 26, r: 7 });
      /* миозин II — к плюс-концу; миозин VI — к минус-концу */
      const myo = (x, lab) => S2F.G('myosin', `<ellipse cx="${x}" cy="${y - 22}" rx="12" ry="9" fill="${C.motor}"/>` + line(x, y - 30, x - 8, y - 64, C.motor, 3)) + T(x, y - 78, lab, { size: 11.5, w: 700, col: C.motor });
      s += myo(200, l('m2')) + larrow(170, y - 104, 250, y - 104, l('toplus'), C.motor, { dy: -14 });
      s += myo(420, l('m6')) + larrow(450, y + 64, 370, y + 64, l('tominus'), C.motor, { dy: 16 });
      s += T(300, 380, l('n2'), { size: 11.5, col: C.muted, n: 80 });
      return s;
    }
    const flip = mode === 'flip';
    s += mtSide(70, y, 530, { h: 24, plus: flip ? 'l' : 'r' });
    const toPlus = flip ? -1 : 1;   /* знак направления к плюс-концу на экране */
    /* кинезин-1 → к плюс-концу; кинезин-14 → к минус-концу; динеин → к минус-концу; кинезин-13 у плюс-конца разбирает его */
    const kx = flip ? 400 : 160, k14 = flip ? 260 : 300, dx = flip ? 200 : 380, k13 = flip ? 96 : 504;
    s += kinesin(kx, y - 12, { s: 1, stalk: 30 }) + T(kx, y - 60, l('k1'), { size: 11.5, w: 700, col: C.motor }) + larrow(kx - 36 * toPlus, y - 86, kx + 36 * toPlus, y - 86, l('toplus'), C.motor, { dy: -14 });
    s += `<g transform="rotate(180 ${k14} ${y + 3})">${kinesin(k14, y - 6, { s: 1, stalk: 30 })}</g>` + T(k14, y + 58, l('k14'), { size: 11.5, w: 700, col: C.motor }) + larrow(k14 + 36 * toPlus, y + 80, k14 - 36 * toPlus, y + 80, l('tominus'), C.motor, { dy: 16 });
    s += dynein(dx, y - 12, { s: 1, stalk: 34 }) + T(dx, y - 62, l('dyn'), { size: 11.5, w: 700, col: C.motor }) + larrow(dx + 36 * toPlus, y - 86, dx - 36 * toPlus, y - 86, l('tominus'), C.motor, { dy: -14 });
    s += `<g transform="rotate(180 ${k13 - 14 * toPlus} ${y + 3})">${kinesin(k13 - 14 * toPlus, y - 6, { s: .9, stalk: 26 })}</g>` + dimer(k13 + 18 * toPlus, y + 30, 30) + dimer(k13 + 30 * toPlus, y + 48, -20);
    s += T(k13 - 20 * toPlus, y + 70, l('k13'), { size: 11.5, w: 700, col: C.motor }) + T(k13 - 20 * toPlus, y + 86, l('k13b'), { size: 10.5, col: C.muted });
    s += T(300, 392, l(flip ? 'n3' : 'n1'), { size: 11.5, col: C.muted, n: 84 });
    return s;
  } };

  /* ---------- ·21: аутоингибирование кинезина-1 (11, ·21; 04, ·21; двухэтапная активация) ---------- */
  GN.s2_r_autoinh = { view(args, t) {
    const l = L('autoinh', t), mode = args[0];
    let s = title(l('t'));
    const y = 320;
    s += mtSide(60, y, 540, { h: 24 });
    const heads = (x, yy) => S2F.G('kinesin', `<ellipse cx="${x - 12}" cy="${yy}" rx="12" ry="9" fill="${C.motor}"/><ellipse cx="${x + 12}" cy="${yy}" rx="12" ry="9" fill="${C.motorL}"/>`);
    if (mode === 'off') {
      /* сложен: хвост прижат к головкам; с микротрубочкой не связан; стрелки движения нет */
      const x = 300, yy = 200;
      s += heads(x, yy) + S2F.G('kinesin', `<path d="M${x},${yy - 8} C${x},${yy - 80} ${x + 70},${yy - 80} ${x + 50},${yy - 30} C${x + 40},${yy - 10} ${x + 20},${yy - 6} ${x + 14},${yy - 6}" fill="none" stroke="${C.motor}" stroke-width="3.4"/>`);
      s += `<circle cx="${x + 16}" cy="${yy - 6}" r="5" fill="${C.motor}"/>` + T(x + 90, yy - 70, l('tail'), { size: 11, col: C.motor, w: 600, a: 'l' }) + line(x + 88, yy - 66, x + 22, yy - 10, C.muted, 1);
      s += T(x, yy + 40, l('off'), { size: 13, w: 700, col: C.bad }) + T(300, 380, l('n1'), { size: 11.5, col: C.muted, n: 80 });
      return s;
    }
    const x = mode === 'walk' ? 320 : 260;
    /* разложенный кинезин на микротрубочке: головки — шейка — средняя спиральная часть — хвост */
    s += heads(x, y - 20) + S2F.G('kinesin', line(x, y - 28, x, y - 150, C.motor, 3.4));
    /* MAP7 связан с микротрубочкой и со средней спиральной частью */
    s += S2F.G('map7', `<rect x="${x + 32}" y="${y - 96}" width="12" height="84" rx="5" fill="${C.map7}"/><rect x="${x + 2}" y="${y - 96}" width="34" height="8" rx="4" fill="${C.map7}"/>`) + T(x + 52, y - 64, l('map7'), { size: 11, w: 700, col: '#2A86AC', a: 'l', n: 22 });
    /* адаптер груза на хвосте, груз — везикула */
    s += S2F.G('adapter', `<rect x="${x - 14}" y="${y - 170}" width="28" height="18" rx="6" fill="${C.adapter}"/>`) + vesicle(x, y - 200, 18, 'cargo', .5);
    s += T(x - 26, y - 162, l('adapter'), { size: 11, w: 700, col: '#8A6A00', a: 'r' });
    if (mode === 'activate') s += T(440, 120, l('n2'), { size: 12, w: 600, n: 26 });
    else s += larrow(x + 60, y - 110, x + 170, y - 110, l('toplus'), C.motor, { dy: -14 }) + T(140, 120, l('n3'), { size: 12, w: 600, n: 24 });
    return s;
  } };

  /* ---------- ·22: цикл субъединицы актина (11, ·22; 04, ·22) — скорости не показаны ---------- */
  GN.s2_r_actin_cycle = { view(args, t) {
    const l = L('actin_cycle', t), mode = args[0];
    let s = title(l('t'));
    const y = 200, x0 = 150, x1 = mode === 'nocofilin' ? 470 : 430;
    s += actinFil(x0, y, x1, y, { n: mode === 'nocofilin' ? 14 : 12, r: 12, nuc: i => (i < 2 ? 'Т' : i < 5 ? 'Д·Pi' : 'Д') });   /* v1.2, И-30: крупнее субъединицы — «Д·Pi» читается */
    /* узлы цикла */
    const node = (x, yy, lab, col = C.ink, w = 150, tx = 0) => box(x - w / 2, yy - 16, w, 32, '#fff', col) + T(x + tx, yy, lab, { size: 11, w: 600, col, n: 34 });
    const capped = mode === 'capped', nocof = mode === 'nocofilin';

/* =====================================================================

     'mt' — микротрубочка: o.view 'side' | 'cross' | 'pf' (·3: трубка, разрез из 13 протофиламентов, один протофиламент).

GN.s2_t1a = (function () {
  const { C, f, G, T, title, line, endSign, waitBox, actinFil, mtSide, ifRope, arrow } = S2F;
  const ROWS = ['sub', 'nuc', 'pol', 'mot', 'dyn', 'mech'], SYS = ['actin', 'mt', 'if'];
  /* таблица признаков (02, 1.5: s2_t1a_tab; значения — 02, 1.12; 04, ·1–·4; 05, C-01…C-08) */
  function table(t, hide, y0) {

    let s = `<rect x="${x0}" y="${y0}" width="${W}" height="${f(rh * 7)}" rx="8" fill="#fff" stroke="${C.line}"/>`;

    const cell = (cx, cy, s0, o) => { const two = String(s0).length > o.n; return T(cx, two ? cy - 6.2 : cy, s0, Object.assign({ size: 10.5 }, o)); };
    let x = x0; head.forEach((h, i) => { if (h) s += cell(x + cw[i] / 2, y0 + rh / 2, h, { size: 10.5, w: 700, col: hc[i], n: 20 }); x += cw[i]; });

      s += cell(x0 + 7, y + rh / 2, t('s2_t1a_tab_' + r), { a: 'l', size: 10.5, w: 600, col: C.muted, n: 20 });   /* v1.2: длинные названия строк — в две строки (не заходят на плашку «откроется после ответа») */

    let s = G('tetramer', `<circle cx="${cx}" cy="${cy}" r="34" fill="#fff" stroke="${C.if}" stroke-width="1.6"/>`);
    const dimer = (y, dir, dx) => { const xa = cx - 22 + dx, xb = cx + 22 + dx; return line(xa, y - 2.5, xb, y - 2.5, C.if, 3.6) + line(xa, y + 2.5, xb, y + 2.5, C.ifL, 3.6) + arrow(cx + dx - dir * 11, y - 11, cx + dx + dir * 13, y - 11, C.if, 1.4); };

    return s + (label ? T(cx + 42, cy - 22, t('s2_t1a_lens'), { a: 'l', size: 10.5, col: C.if, w: 600, n: 15 }) : '');   /* v1.2, И-02: до ответа шага 1 подписи нет (совпадает с верным вариантом) */
  }

  function ring(cx, cy, R, r = R * .2, n = 13) {
    let s = '';

  const freeActin = (x, y, nucH) => `<circle cx="${f(x)}" cy="${f(y)}" r="7" fill="${C.actin}" stroke="#fff" stroke-width="1.2"/>` + (nucH ? '' : `<text x="${f(x)}" y="${f(y + .5)}" font-size="8" font-weight="700" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">Т</text>`);
  const freeTub = (x, y) => `<rect x="${f(x - 10)}" y="${f(y - 4)}" width="10" height="8" rx="3" fill="${C.mtA}"/><rect x="${f(x)}" y="${f(y - 4)}" width="10" height="8" rx="3" fill="${C.mtB}"/>`;
  function three(t, o) {
    const hide = o.hide || [], nucH = hide.includes('nuc'), sameH = hide.includes('pol'), stg = o.stg || 9;
    let s = title(t('s2_t1a_pA'));

    /* актиновый филамент: две закрученные цепочки, «Т»/«Д» (АТФ у свежего плюс-конца, глубже — АДФ) */
    s += lab(56, 's2_t1a_actin', 's2_t1a_d_actin', C.actin);
    const xa1 = stg === 1 ? x0 + (x1 - x0) * .62 : x1;

    if (stg === 1) s += G('gactin', freeActin(xa1 + 36, 44, nucH) + freeActin(xa1 + 58, 66, nucH) + freeActin(xa1 + 80, 50, nucH));
    /* микротрубочка: стенка из протофиламентов, α тёмная, β светлая; «+» у конца с β-тубулином; разрез — 13 кружков */
    if (stg >= 2) {
      s += lab(124, 's2_t1a_mt', 's2_t1a_d_mt', C.mtA);
      const xm1 = stg === 2 ? x0 + (x1 - x0) * .6 : x1;
      s += mtSide(x0, 124, xm1, { h: 60, letters: !nucH, cap: 2, signs: !sameH }) + ring(462, 124, 21, 4.6, stg === 2 ? 9 : 13);

    const y0 = 110;

    for (let k = 0; k < 9; k++) for (let i = 0; i < 9; i++) s += G('crosslink', line(88 + k * 24, y0 + i * 12 + 3, 88 + k * 24, y0 + i * 12 + 9, '#7A8899', 1.4));
    s += endSign(306, y0 + 54, '+', C.actinD) + endSign(60, y0 + 54, '-', C.actinD);

    s += line(326, y0 - 6, 326, y0 + 114, C.muted, 1) + line(322, y0 - 6, 330, y0 - 6, C.muted, 1) + line(322, y0 + 114, 330, y0 + 114, C.muted, 1);

    s += T(474, y0 - 30, t('s2_t1a_mt'), { size: 12.5, w: 700, col: C.mtA });
    if (o.wait) return s + waitBox(70, 300, 480, 60, t('s2_t1a_hidden'));
    s += T(184, y0 + 160, t('s2_t1a_sub_actin'), { size: 12, w: 600 }) + T(474, y0 + 160, t('s2_t1a_sub_mt'), { size: 12, w: 600, n: 24 });

  function actin(t, o) {

/* =====================================================================
   s3_gn_t2.js — сцены вкладки 2 «Динамическая нестабильность микротрубочек» (02, 2.5; 07, разд. 2–4.2; 10, Б1–Б2;
   11, ·9, ·10, ·11, ·13). Общие для практикума и «Объяснений»; рисуют только модель (OC.s2, OC.treadmill), чисел не придумывают.
   GN.s2_t2a — график длины одной микротрубочки: args [tub, catf, rescue, nohydro, annot, opts]
       tub 'low'|'mid'|'high'; catf, rescue, nohydro — 0/1; annot — 1: разметка для чтения графика (·11: наклоны, моменты
       катастроф, наибольшая и средняя длина); opts.wait — до ответа: линия без подписей переходов, кружков и показаний (07, 4.0);
       opts.upto — курсор времени (линия до курсора; миниатюра микротрубочки — длина в момент курсора).
   GN.s2_t2b — плюс-конец крупным планом: args [state, opts]; state 'grow'|'shrink'|'rescue'|'nohydro';
       opts.stage — кадр анимации Б1 (1…6, подписи — 10, Б1); вставка — график OC.s2 (средний тубулин, белок спасения) с курсором.
   GN.s2_t2c — два типа поведения: args [mode, opts]; mode 'both' (панель В) | 'mt' | 'tread' (·13); opts.tt — время тредмиллинга
       (0…12; метка выходит при t_exit = 10 и далее не рисуется); opts.wait — правая часть (другой полимер) закрыта.
   Знаки «+»/«−» на каждой микротрубочке и филаменте; растущая микротрубочка — зелёная, укорачивающаяся — оранжевая.
   ===================================================================== */
(function () {
  const { C, f, G, T, title, line, arrow, endSign, waitBox, axes, poly, num, turc } = S2F;
  const EV = { catastrophe: { col: C.bad, k: 's2_t2a_ev_cat', g: 'cat' }, rescue: { col: C.ok, k: 's2_t2a_ev_res', g: 'res' },
    full_loss: { col: '#37474F', k: 's2_t2a_ev_loss', g: 'loss' }, renucleation: { col: C.ctr, k: 's2_t2a_ev_renuc', g: 'renuc' } };
  const fmtL = x => num(x, Number.isInteger(x * 10) && !Number.isInteger(x * 100 / 10) ? 1 : (Number.isInteger(x) ? 1 : 2));
  const n1 = x => num(x, 1), n2 = x => num(x, 2);
  /* фаза в момент t и длина */
  const phaseAt = (o, tt) => OC.s2_phase(o, tt), lenAt = (o, tt) => OC.s2_len(o, tt);

  /* ---------- график длины ---------- */
  function lengthGraph(o, box, t, op) {
    const { x, y, w, h } = box, upto = op.upto == null ? 24 : op.upto, small = !!op.small;
    const A = axes(x, y, w, h, { min: 0, max: 24, ticks: small ? [0, 12, 24] : [0, 4, 8, 12, 16, 20, 24] }, { min: 0, max: 25, ticks: small ? [0, 10, 20] : [0, 5, 10, 15, 20, 25] });
    let s = G('graph', A.s);
    /* подписи осей: y — двумя строками слева от делений; x — справа от последнего деления (под графиком — полоса подписей событий)
       или под делениями по центру, если подписей событий нет (op.xt === 'below') */
    if (!small) { const yl = String(t('s2_t2a_y')).split(', ');
      s += T(x - 62, y + h / 2 - 8, yl[0] + (yl[1] ? ',' : ''), { a: 'l', size: 11, col: C.muted }) + (yl[1] ? T(x - 62, y + h / 2 + 7, yl[1], { a: 'l', size: 11, col: C.muted }) : '');

    /* линия длины: участки роста — зелёные, укорочения — оранжевые */
    /* линия обрезается у верхнего края шкалы (25 у.е.д.; 02, 2.5): выше — пометка «длина больше 25» */

      const sh = l1 < l0 - 1e-9;

      s += G(sh && !op.wait ? 'shrinkseg' : 'graph', line(A.X(t0), A.Y(l0), A.X(t1), A.Y(l1), sh ? C.mtD : C.mt, small ? 2 : 3));
    }
    if (over != null && !small) s += arrow(A.X(over), A.Y(YM) + 12, A.X(over), A.Y(YM) - 2, C.mt, 1.6) + T(A.X(over) + 8, A.Y(YM) + 10, t('s2_t2a_over'), { a: 'l', size: 10.5, col: C.mtA, bg: true });
    if (op.upto != null && op.upto < 24) s += line(A.X(upto), y, A.X(upto), y + h, C.muted, 1.2, 'stroke-dasharray="4 3"');
    if (op.wait || small) return { s, A };

/* =====================================================================
   s5_a0.js — общие помощники продвинутого уровня семинара 2 (03, вводная часть; 07, разд. 5) для исследований И1–И4.
   API (описание — tools_s2/решения_a12.md, разд. «API s5_a0.js»):
     advBase(K, P)        — блок «Новая опора» (P_new) над «Задачей» и заметка s2_adv_note под переключателями (03, вводная часть);
     advMore(P, card)     — блоки под показаниями для ocTab({ more }): «Правила модели» (P_rules), «Научное объяснение» (P_expl; заголовок — a_expl_t),
                            «Новые данные» (P_data[, P_data2]), «Как это установили» (P_how [+ карточка метода card: ключи card, card_items]),
                            «Чего модель не показывает» (P_limits); блок без текста не выводится;
     advWait(K)           — true, пока в шаге сценария на сцене K ответ не дан (07, 4.0: показания и таблицы исходов скрыты);
     advHalt(K)           — остановить идущую анимацию сцены K (смена шага; иначе мелькает кадр результата);
     advStep(K, key, pre, apply) — шаг сценария сцены K с метаданными документа (ocStep) и остановкой анимации перед pre;
                            ключ шага-ссылки 03 («Шаг 4 — обратная задача») переводится через OCALIAS;
     advSeg(id, label, pairs, v) — переключатель segHTML, pairs — [[значение, ключ подписи], …].
   В практикуме нет пометки «сверх программы», фамилий и годов (03, вводная часть).
   ===================================================================== */
function advBase(K, P){
  const tk = $('task' + K), paras = String(t(P + '_new')).split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');
  tk.insertAdjacentHTML('beforebegin', `<div class="panel aprob anew" id="new${K}"><b class="k">${t('a_base_t')}</b>${paras}</div>`);
  $('ctrl' + K).insertAdjacentHTML('beforeend', `<p class="small">${t('s2_adv_note')}</p>`);
}
function advMore(P, card){
  const has = k => k in TEXTS && TEXTS[k];
  const M = [['b_rules_t', P + '_rules'], ['a_expl_t', P + '_expl'], ['b_new_t', () => [P + '_data', P + '_data2'].filter(has).map(k => `<p>${t(k)}</p>`).join('')]];
  M.push(['b_how_t', () => (has(P + '_how') ? `<p>${t(P + '_how')}</p>` : '') + (card && has(card) ? `<p><b>${t(card)}</b></p>` + listHTML(t(card + '_items')) : '')]);
  M.push(['b_lim_t', P + '_limits']);
  return M;
}
const advWait = K => typeof POE !== 'undefined' && POE.on && cur === K && !POE.shown;
function advHalt(K){ if (typeof TLS !== 'undefined' && TLS[K]) TLS[K].halt(); }
function advStep(K, key, pre, apply){
  const k = (typeof OCALIAS !== 'undefined' && OCALIAS[key]) || key;
  return ocStep(k, { pre(S){ advHalt(K); S.after = null; if (pre) pre(S); }, apply(S){ S.after = null; if (apply) apply(S); } });
}
const advSeg = (id, label, pairs, v) => segHTML(id, label, pairs, v);

(function(){

(function(){

        model,

          if (m.cmp) return m.cmp.map(c => { const r = OC.a2(c.pc, c.pr, c.vg, c.D); return [t('s2_a2_set_' + c.k) + (c.D !== 10 || c.vg !== 1 ? ' · ' + t('s2_a2_cond_s', { d: c.D, v: S2F.num(c.vg, 1) }) : ''), t('s2_a2_pv', { p: S2F.num(r.P, 3), t: r.t_mean == null ? '—' : S2F.num(r.t_mean, 1) }), true]; });

      advStep(K, P + '_s3', S => cmp(S, 'low', [item('stable'), item('low'), item('mid'), item('high')], 10), S => cmp(S, 'low', [item('stable', 20), item('low', 20), item('mid', 20), item('high', 20)], 20)),
      advStep(K, P + '_s4', S => cmp(S, 'stable', [item('stable'), item('mid')]), S => cmp(S, 'stable', [item('stable'), item('mid')])),
      advStep(K, P + '_rev', S => cmp(S, 'mid', REV, 20), S => cmp(S, 'mid', REV, 20)),

   «Объяснениях» (·29): наблюдения → гипотезы → измерения. Порядок работы — 02, 5.7:
     1) выписать наблюдения (запись не сохраняется), затем сравнить с перечнем (02, 5.4);
     2) отметить все совместимые наборы причин — множественный выбор из 10 наборов (6 верных, 4 неверных с разборами 02, 5.7–5.8);
     3) выбрать не более трёх измерений; модель показывает результаты для шести гипотез и сообщает, все ли гипотезы различены;
        если нет — называет пары с одинаковыми результатами (OC.int_distinguish) и измерение, которое их различит (07, 4.5);
        «Найти причину»: загаданный случай case1…case6 (02, 5.9; случайно или учебный) — строка «загаданный случай» с результатами
        выбранных измерений; студент называет набор причин;
     4) назвать ограничения вывода (02, 5.7: два верных варианта из четырёх).

(function(){

  const H = OC.int_hypotheses(), MEAS = OC.MEAS, KEYH = h => [...h].sort().join('+');

  const SETS = [['if', 'atp'], ['atp'], ['mt', 'if', 'actin'], ['mt', 'if'], ['link', 'atp'], ['if', 'atp', 'actin'], ['mt', 'link', 'actin'], ['kin', 'link'], ['if', 'actin', 'kin'], ['link', 'actin', 'kin']];

  function scene(){

  function p3msg(){

/* Семинар 2: случаи «Найти причину» вкладок (02, разд. 6; 07, разд. 4.1–4.4) регистрируют сцены вкладок в CASE_REG

const CASE_SPEC = CASE_REG;

/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
