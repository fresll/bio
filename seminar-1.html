 момент", "s1_a3_s6_x2": "Повтор даст 20 в обеих клетках: по одному показателю причины не различить", "s1_a3_s6_o3": "Количество X снаружи", "s1_a3_s6_x3": "В обеих клетках X снаружи исходное. Этот показатель различил бы третью причину — нехватку X", "s1_a3_s6_o4": "Различить нельзя: результат одинаков", "s1_a3_s6_x4": "Одинаков только поток X. Остальные показатели различаются", "s1_a3_s6_h1": "Что ещё, кроме потока X, отличается в двух клетках?", "s1_a3_s6_h2": "Какой показатель реагирует на градиент, но не на переносчик X?", "s1_a3_s6_h3": "Градиент, поток Y, расход АТФ", "s1_a3_s6_e": "Одинаковый конечный результат может возникать из-за нарушения разных звеньев и сопровождаться разной динамикой. Поэтому по одному показателю нельзя назвать причину: нужно наблюдение, которое различает гипотезы", "s1_a3_s6_bio": "21 31", "s1_a3_rev_cond": "В двух клетках одинаково низкий перенос вещества X. Известно, что у одной из них нарушено поддержание градиента Na⁺, у другой — функция переносчика X. Какая клетка какая — неизвестно", "s1_a3_rev_q": "Какие дополнительные наблюдения позволят различить причины?", "s1_a3_rev_o1": "Измерить концентрацию Na⁺ в цитоплазме (градиент)", "s1_a3_rev_x1": "Да: при нарушении поддержания градиента Na⁺ в цитоплазме повышен", "s1_a3_rev_o2": "Измерить поток другого Na⁺-зависимого вещества", "s1_a3_rev_x2": "Да: он снижен только при нарушении градиента", "s1_a3_rev_o3": "Проследить поток X во времени сразу после появления нарушения", "s1_a3_rev_x3": "Да: при развивающемся нарушении градиента поток продолжает меняться, при нарушении переносчика он сразу устанавливается на новом уровне. Если наблюдение начато поздно, когда градиент уже стабилизировался, динамика причин не различит", "s1_a3_rev_o4": "Определить количество переносчика X в мембране и его работу при искусственно созданном Na⁺-градиенте", "s1_a3_rev_x4": "Да: прямая проверка звена переносчика", "s1_a3_rev_o5": "Измерить проницаемость мембраны для O₂", "s1_a3_rev_x5": "Она отражает свойства бислоя и не связана ни с градиентом Na⁺, ни с переносчиком X", "s1_a3_rev_h1": "Какие показатели зависят от градиента, но не от переносчика X?", "s1_a3_rev_h2": "Как проверить переносчик напрямую?", "s1_a3_rev_h3": "Свидетель градиента и прямая проверка переносчика", "s1_a3_new": "Градиент Na⁺ в клетке — результат двух противоположных процессов. Na⁺ постоянно входит в клетку по электрохимическому градиенту через пути <b>утечки</b> (каналы, вторичные переносчики), а насос выводит его. Когда скорости входа и выведения равны, концентрация Na⁺ в цитоплазме не меняется, хотя Na⁺ всё время переходит через мембрану. Такое состояние называют <b>стационарным</b>. Оно неравновесное: градиент существует, потому что насос непрерывно расходует АТФ. Это отличает его от равновесия (исследование 2), при котором электрохимический градиент иона равен нулю и энергия не нужна.\nЕсли утечка увеличилась, насос может компенсировать её, работая быстрее, — тогда градиент сохраняется, но расход АТФ растёт. Если мощности насоса не хватает, устанавливается новое стационарное состояние с меньшим градиентом. Если насос остановлен, градиент снижается тем быстрее, чем больше утечка.\nПоток X через Na⁺-зависимый переносчик зависит от трёх условий: есть ли градиент Na⁺, работает ли переносчик и есть ли X.", "s1_a3_cond": "Условная клетка. До момента t = 0 насос работает, утечка обычная, градиент исходный (100 %), поток X — 100 условных единиц. В момент t = 0 меняют одно или несколько условий. Время — условные минуты (0–60). Наблюдаются: Na⁺-градиент (% исходного), поток X, поток Y через другой Na⁺-зависимый переносчик (он исправен), расход АТФ насосом (условные единицы; 100 — исходный)", "s1_a3_rules": "1. Пока насос работает: градиент G = min(1; мощность насоса / (100 × утечка)); расход АТФ A = min(100 × утечка; мощность). Мощность: достаточный запас — 400, недостаточный — 150.\n2. После остановки насоса в t = 0: A = 0; G(t) = G(0) × e^(−утечка × t / 30). При обычной утечке градиент снижается в e раз (до 37 %) за 30 условных минут, при утроенной — за 10.\n3. Поток X = 100 × (доля работы переносчика) × (доля X) × G.\n4. Поток Y = 100 × G (переносчик Y исправен, Y в избытке).\n5. Na⁺, вошедший через переносчики X и Y, учтён в «обычной утечке»; мембранный потенциал в модели отдельно не рассчитывается.", "s1_a3_expl": "Na⁺-градиент — стационарное неравновесное состояние: его поддерживает насос, непрерывно компенсируя вход Na⁺ по путям утечки. После остановки насоса градиент рассеивается постепенно, тем быстрее, чем больше утечка, и вместе с ним снижается вторичный транспорт. При работающем насосе увеличение утечки либо компенсируется ценой расхода АТФ, либо, если мощности не хватает, приводит к новому стационарному состоянию с меньшим градиентом. Снижение потока X может быть вызвано разными звеньями — градиентом, переносчиком, доступностью X. Различить их можно по показателям, которые зависят от одного звена и не зависят от другого: градиент, поток через другой Na⁺-зависимый переносчик, расход АТФ, динамика во времени", "s1_a3_data": "Структуры Na⁺-глюкозных симпортеров человека SGLT1 и SGLT2, полученные в последние годы, показали, как переносчик сопрягает перенос Na⁺ и глюкозы. Переносчик последовательно переходит между состояниями: открыт наружу — закрыт с обеих сторон — открыт внутрь. Первым связывается Na⁺; это стабилизирует состояние «открыт наружу» и подготавливает участок связывания глюкозы; после связывания глюкозы переносчик переходит в закрытое состояние. SGLT1 переносит два иона Na⁺ на одну молекулу глюкозы, SGLT2 — один. В почках SGLT2 возвращает в кровь большую часть глюкозы, профильтрованной из крови в мочу. Вещества, блокирующие SGLT2, связываются с переносчиком в состоянии «открыт наружу» в его центральной полости; перенос глюкозы снижается, и она выводится с мочой. Вещество действует на сам переносчик, а не на Na⁺-градиент. Мутации в гене SGLT2 вызывают наследственную почечную глюкозурию — выведение глюкозы с мочой при нормальной её концентрации в крови. Это примеры нарушения звена переносчика при сохранённом градиенте — того, что в модели показано в шаге 5", "s1_a3_how": "Пространственное строение переносчиков в разных состояниях определяют методом криоэлектронной микроскопии: очищенный белок быстро замораживают в тонком слое льда, получают множество изображений отдельных молекул и по ним восстанавливают трёхмерную структуру. Состояния «открыт наружу» и «открыт внутрь» удаётся получить, связывая белок с разными веществами (например, с ингибиторами), которые стабилизируют одно из состояний", "s1_a3_limits": "Все времена и единицы условные. Модель не рассчитывает мембранный потенциал и концентрацию K⁺, не учитывает изменение объёма клетки при накоплении Na⁺, обратимость переносчиков, реальную регуляцию насоса (в модели он ускоряется без изменения градиента; в клетке ускорение связано с небольшим ростом концентрации Na⁺ в цитоплазме). Переходы к новому стационарному состоянию при работающем насосе показаны мгновенными. Экспонента — простейшее описание рассеивания; в клетке скорость рассеивания меняется по мере изменения потенциала", "s1_a3_title": "И3. Перенос X снизился. Что нарушено: насос, утечка или переносчик?", "s1_a3_pump": "Насос после t = 0", "s1_a3_leak": "Утечка Na⁺ после t = 0", "s1_a3_res": "Запас мощности насоса", "s1_a3_T": "Переносчик X", "s1_a3_S": "Вещество X снаружи", "s1_a3_note_ss": "В модели новое стационарное состояние устанавливается сразу; в клетке переход занимает время", "s1_a4_s1_cond": "Начальное состояние: лиганд действует 5 единиц времени; посредник существует 5 единиц. График скрыт до ответа", "s1_a4_s1_q": "Как будут различаться ответы двух систем?", "s1_a4_s1_o1": "Амплитуда одинакова, но ответ 2 длится заметно дольше", "s1_a4_s1_x1": "Верно. Канал закрывается почти сразу после удаления лиганда. В системе 2 посредника образовалось с большим запасом (10 при пороге 1), и ответ остаётся максимальным, пока посредник не разрушится ниже порога", "s1_a4_s1_o2": "Ответ системы 2 слабее: в нём больше звеньев, и сигнал теряется", "s1_a4_s1_x2": "Усиление на ферменте даёт посредника больше, чем нужно для полного ответа. Максимальная амплитуда одинакова", "s1_a4_s1_o3": "Обе системы отвечают одинаково: лиганд один и тот же", "s1_a4_s1_x3": "Лиганд один, но цепи разные. Различаются начало и особенно продолжительность ответа", "s1_a4_s1_o4": "Ответ системы 2 заканчивается одновременно с удалением лиганда", "s1_a4_s1_x4": "После удаления лиганда посредник ещё некоторое время существует и поддерживает ответ", "s1_a4_s1_h1": "Что остаётся в клетке системы 2 после удаления лиганда?", "s1_a4_s1_h2": "Сколько посредника образуется и сколько нужно для полного ответа?", "s1_a4_s1_h3": "Пока посредник выше порога, ответ максимален", "s1_a4_s1_e": "По одной максимальной амплитуде системы неразличимы. Различаются момент начала и особенно время, в течение которого ответ сохраняется после прекращения сигнала", "s1_a4_s1_bio": "29", "s1_a4_s2_cond": "Время существования посредника меняют: 1, 5, 20. В модели при любом времени существования стационарное количество посредника одинаково (10 условных единиц). Лиганд действует 5 единиц", "s1_a4_s2_q": "Как время существования посредника влияет на ответ системы 2?", "s1_a4_s2_o1": "Дольше живёт — дольше длится и позже начинается", "s1_a4_s2_x1": "Верно. В этой модели медленно разрушаемый посредник медленнее накапливается до нового уровня и медленнее исчезает. Время существования влияет и на включение, и на выключение", "s1_a4_s2_o2": "Время существования влияет только на продолжительность, начало не меняется", "s1_a4_s2_x2": "В модели посредник при большом времени существования образуется медленнее (скорость образования 10/τm), поэтому и порог достигается позже", "s1_a4_s2_o3": "Чем дольше существует посредник, тем больше амплитуда", "s1_a4_s2_x3": "Амплитуда ограничена: ответ не может быть больше 100. Количество посредника в стационарном состоянии в модели одинаково при любом времени существования", "s1_a4_s2_o4": "Время существования посредника не важно: ответ определяется рецептором", "s1_a4_s2_x4": "Рецептор выключается вместе с удалением лиганда, а посредник — нет. Именно его время существования задаёт продолжительность ответа после удаления лиганда", "s1_a4_s2_h1": "Что происходит с посредником после удаления лиганда?", "s1_a4_s2_h2": "Переключите время существования 1 → 5 → 20 и сравните значения в таблице показаний", "s1_a4_s2_h3": "Медленно разрушаемая молекула — долгий след сигнала", "s1_a4_s2_e": "Скорость ответа на появление и исчезновение сигнала зависит от времени существования молекул, которые сигнал изменяет. Молекулы, которые быстро образуются и быстро разрушаются, позволяют ответу быстро следовать за сигналом; медленно разрушаемые продлевают ответ", "s1_a4_s2_bio": "29", "s1_a4_s3_cond": "Лиганд действует только 1 единицу времени; посредник существует 5 единиц", "s1_a4_s3_q": "Что покажет модель?", "s1_a4_s3_o1": "Ответ 1 — около 1 единицы, ответ 2 — около 7", "s1_a4_s3_x1": "Верно. Система 2 сохраняет ответ на время существования посредника, хотя сигнал был коротким. Система 1 точно повторяет продолжительность сигнала", "s1_a4_s3_o2": "Ответ системы 2 не возникнет: за 1 единицу времени цепь не успеет включиться", "s1_a4_s3_x2": "Ответ начинается через 0,16 единицы, а полного уровня посредник достигает примерно через 0,7 — ещё до удаления лиганда, поэтому ответ возникает, хотя лиганд действует недолго", "s1_a4_s3_o3": "Оба ответа длятся 1 единицу", "s1_a4_s3_x3": "Это верно для системы 1. В системе 2 ответ сохраняется, пока посредник не разрушится", "s1_a4_s3_o4": "Ответ системы 1 длится дольше", "s1_a4_s3_x4": "Канал закрывается сразу после удаления лиганда: быстрые переходы канала — 0,2 единицы", "s1_a4_s3_h1": "Успевает ли посредник превысить порог за 1 единицу?", "s1_a4_s3_h2": "Сколько времени после этого он разрушается?", "s1_a4_s3_h3": "Короткий сигнал — долгий ответ, если посредник долговечен", "s1_a4_s3_e": "Ответ точно следует за сигналом, если все звенья цепи быстро включаются и выключаются; долговечные звенья продлевают ответ после прекращения сигнала", "s1_a4_s3_bio": "29", "s1_a4_s4_cond": "Лиганд действует 20 единиц времени; посредник существует 5 единиц. Десенситизацию рецептора меняют: нет — медленная — быстрая", "s1_a4_s4_q": "Что происходит при быстрой десенситизации?", "s1_a4_s4_o1": "Ответ 1 короткий и ниже 100; ответ 2 короче, но 100", "s1_a4_s4_x1": "Верно. Десенситизация выключает рецептор при сохранившемся лиганде. Система 1 следует за активностью рецептора сразу; в системе 2 запас посредника продлевает ответ", "s1_a4_s4_o2": "Ничего не меняется: лиганд всё ещё связан", "s1_a4_s4_x2": "Связанный лиганд не гарантирует активного рецептора: при десенситизации рецептор теряет активность", "s1_a4_s4_o3": "Обе системы перестают отвечать сразу", "s1_a4_s4_x3": "Система 2 продолжает отвечать, пока посредник выше порога", "s1_a4_s4_o4": "Амплитуда системы 2 снижается до 83", "s1_a4_s4_x4": "Снижение амплитуды до 83 — у системы 1. В системе 2 посредника образуется больше порога, и амплитуда остаётся 100", "s1_a4_s4_h1": "Что десенситизация делает с рецептором?", "s1_a4_s4_h2": "Какая система быстрее следует за активностью рецептора?", "s1_a4_s4_h3": "Канал — сразу, цепь — через посредника", "s1_a4_s4_e": "Продолжительность ответа определяется не только продолжительностью действия лиганда: её ограничивают механизмы выключения рецептора и разрушения посредников", "s1_a4_s4_bio": "29", "s1_a4_s5_cond": "Лиганд действует 5 единиц; посредник существует 1 единицу. Переходы канала медленные (время 2 вместо 0,2)", "s1_a4_s5_q": "Какая система начинает отвечать раньше?", "s1_a4_s5_o1": "Система 2: 0,07 против 0,22", "s1_a4_s5_x1": "Верно. При медленных переходах канала и быстро образующемся посреднике опосредованный ответ начинается раньше прямого. Скорость определяется параметрами звеньев, а не их числом", "s1_a4_s5_o2": "Система 1: у неё нет промежуточных звеньев", "s1_a4_s5_x2": "Меньше звеньев — не обязательно быстрее. Здесь единственное звено системы 1 медленнее всей цепи системы 2", "s1_a4_s5_o3": "Одновременно", "s1_a4_s5_x3": "Сравните моменты начала в таблице: 0,22 и 0,07", "s1_a4_s5_o4": "Система 2 не ответит: посредник живёт слишком мало", "s1_a4_s5_x4": "Посредник короткоживущий, но образуется быстро и превышает порог", "s1_a4_s5_h1": "Чем определяется скорость каждого звена?", "s1_a4_s5_h2": "Какое звено самое медленное в каждой системе?", "s1_a4_s5_h3": "Одно медленное звено может быть медленнее нескольких быстрых", "s1_a4_s5_e": "Утверждение «чем больше промежуточных стадий, тем медленнее ответ» — не закон. В реальных клетках ответ рецептора — ионного канала действительно обычно самый быстрый (миллисекунды), а ответы через изменение синтеза белков — самые медленные (минуты и часы); но при сравнении конкретных систем решают скорости звеньев", "s1_a4_s5_bio": "27 29", "s1_a4_rev1_cond": "Два ответа клеток на один и тот же лиганд имеют одинаковую максимальную амплитуду, но один сохраняется в несколько раз дольше другого", "s1_a4_rev1_q": "Можно ли установить механизм исключительно по амплитуде?", "s1_a4_rev1_o1": "Нет: при насыщении амплитуда одинакова у обоих", "s1_a4_rev1_x1": "Верно: и прямой, и опосредованный механизм могут давать максимальный ответ; амплитуда не говорит ни о числе звеньев, ни об их скорости", "s1_a4_rev1_o2": "Да: одинаковая амплитуда означает одинаковый механизм", "s1_a4_rev1_x2": "Модель показывает обратное: системы 1 и 2 достигают 100", "s1_a4_rev1_o3": "Да: больше амплитуда — больше звеньев", "s1_a4_rev1_x3": "Амплитуда ограничена насыщением ответа и не отражает числа звеньев", "s1_a4_rev2_cond": "Два ответа клеток на один и тот же лиганд имеют одинаковую максимальную амплитуду, но один сохраняется в несколько раз дольше другого", "s1_a4_rev2_q": "Какие дополнительные измерения необходимы?", "s1_a4_rev2_o1": "Время начала ответа и форма нарастания", "s1_a4_rev2_x1": "Помогает: опосредованный ответ часто имеет задержку, хотя не всегда", "s1_a4_rev2_o2": "Ход ответа после удаления лиганда (отмывания)", "s1_a4_rev2_x2": "Ключевое: длительный ответ после удаления лиганда указывает на долговечное звено — посредник или рецептор, остающийся активным", "s1_a4_rev2_o3": "Измерение посредника (например, цАМФ) во времени", "s1_a4_rev2_x3": "Да: прямо показывает, участвует ли посредник и сколько он существует", "s1_a4_rev2_o4": "Блокада отдельных звеньев (G-белка, фермента) или ускорение разрушения посредника", "s1_a4_rev2_x4": "Да: если ответ исчезает или укорачивается, звено участвует в нём", "s1_a4_rev2_o5": "Повторное измерение амплитуды при большей концентрации лиганда", "s1_a4_rev2_x5": "При насыщенном ответе амплитуда не изменится и механизм не раскроет", "s1_a4_new": "Концентрация любой молекулы в клетке определяется скоростью её образования и скоростью её удаления. Если образование прекратилось, концентрация снижается, и скорость снижения определяется <b>временем существования</b> молекулы: чем быстрее её разрушают ферменты, тем быстрее исчезает след сигнала. Поэтому продолжительность ответа после удаления лиганда зависит от того, как быстро выключаются все активные звенья цепи: рецептор, G-белок, посредник, фосфорилированные белки.\nОтвет может <b>насыщаться</b>: если для полного эффекта достаточно небольшой доли посредника, а образуется его много (усиление), ответ остаётся максимальным, пока концентрация посредника не опустится ниже этой доли. Поэтому два ответа с одинаковой максимальной амплитудой могут длиться разное время.\nМногие рецепторы при длительном действии лиганда <b>десенситизируются</b> — становятся менее активными, хотя лиганд ещё связан.", "s1_a4_cond": "Две условные системы в одинаковых клетках. Система 1: рецептор — ионный канал; ответ — доля открытых каналов (0–100). Система 2: рецептор, сопряжённый с G-белком, → фермент → посредник → ответ; ответ максимален (100), когда посредника не меньше порогового количества, и пропорционален посреднику ниже порога. Лиганд добавляют в момент 0 и удаляют через заданное время. Время — условные единицы (0–60). Параметры: продолжительность действия лиганда, время существования посредника, скорость десенситизации рецептора (общая для обеих систем), скорость переходов канала между закрытым и открытым состояниями", "s1_a4_rules": "1. Лиганд действует от 0 до Tl. Десенситизация уменьшает активность рецептора, пока лиганд связан: множитель e^(−t/τd), τd: нет — бесконечно, медленная — 20, быстрая — 3.\n2. Система 1: доля открытых каналов приближается к активности рецептора со временем переходов τc (быстрые — 0,2; медленные — 2). Ответ = 100 × доля.\n3. Система 2: активность рецептора и G-белка приближается к активности рецептора со временем 0,2; посредник образуется со скоростью (10/τm) × активность и разрушается со скоростью (количество)/τm, где τm — время существования посредника. При постоянной активности посредника становится 10 условных единиц при любом τm. Ответ = 100 × min(1; посредник / 1) — порог 1 условная единица.\n4. Расчёт — шаг 0,01 условной единицы времени (a4_run).", "s1_a4_expl": "Временной профиль ответа определяется скоростями включения и выключения всех звеньев цепи. Рецептор — ионный канал отвечает и выключается вместе с лигандом, если переходы канала быстрые. В цепи с посредником ответ может пережить сигнал: он сохраняется, пока посредник не разрушится ниже порога. Чем дольше существует посредник, тем дольше ответ. Десенситизация рецептора укорачивает ответ при сохранившемся лиганде. Поскольку ответ может насыщаться, две системы с одинаковой максимальной амплитудой могут различаться по продолжительности в несколько раз. Механизм нельзя установить по амплитуде: нужны время начала, профиль после удаления лиганда и эксперименты с изменением отдельных звеньев", "s1_a4_data": "Долгое время считалось, что рецепторы, сопряжённые с G-белками, передают сигнал только с плазматической мембраны, а после переноса внутрь клетки выключаются. Измерения в живых клетках с флуоресцентными датчиками показали, что некоторые рецепторы продолжают активировать G-белок и после этого. Рецепторы тиреотропного гормона в клетках щитовидной железы после переноса внутрь клетки поддерживают длительное образование цАМФ; сходное наблюдение сделано для рецептора паратиреоидного гормона. Рецепторы тиреотропного гормона вместе с гормоном доставляются к аппарату Гольджи и вызывают там позднюю фазу образования цАМФ, которая нужна для фосфорилирования белка — регулятора транскрипции и включения генов. Это ещё одна причина длительного ответа: продолжительность определяет не только время существования посредника, но и то, где и как долго остаётся активным рецептор. В модели этой вкладки такой механизм не учитывается", "s1_a4_limits": "Все параметры и времена условные. Модель не учитывает: перемещение рецепторов внутрь клетки и их сигнал оттуда; ветвление цепи; обратные связи, которые ускоряют выключение; различие клеток по числу рецепторов. Порог ответа — допущение. Числа не переводятся в миллисекунды или минуты", "s1_a4_title": "И4. Одинаковая амплитуда, разная продолжительность: что определяет время ответа?", "s1_a4_tab": "Начало ответа (время достижения 10)", "s1_a4_Tl": "Продолжительность действия лиганда", "s1_a4_tm": "Время существования посредника", "s1_a4_des": "Десенситизация рецептора", "s1_a4_tc": "Переходы канала", "s1_m1": "Восстановление флуоресценции после фотообесцвечивания", "s1_m2": "Локальная фиксация потенциала", "s1_m3": "Рентгеноструктурный анализ белка", "s1_m4": "Флуоресцентный датчик цАМФ", "s1_m1_items": "что измеряется: скорость возвращения свечения на обесцвеченный участок\nна каком уровне: множество молекул на участке мембраны живой клетки или искусственного бислоя\nконтроль: необесцвеченный участок той же мембраны — по нему учитывают обесцвечивание метки во время самой регистрации\nтипичный артефакт: метод следит за множеством молекул сразу; если свечение восстанавливается не полностью, нельзя сказать, неподвижна ли часть молекул или их движение ограничено небольшим участком мембраны\nчего не доказывает: не показывает, почему молекулы движутся медленно — из-за плотной упаковки липидов или из-за связи с другими белками\nсхема: участок мембраны → вспышка → тёмное пятно → пятно постепенно светлеет", "s1_m2_items": "что измеряется: электрический ток через мембрану при заданном потенциале; в маленьком участке — ток через один канал (ступеньки открытия и закрытия)\nуровень: одна молекула канала или вся клетка\nконтроль: блокатор канала или замена иона на непроходящий — ток должен исчезнуть\nтипичный артефакт: неплотный контакт пипетки с мембраной даёт ток утечки, не связанный с каналами\nчего не доказывает: ток показывает перенос заряда, но не говорит, какой именно ион его переносит, если каналы пропускают несколько ионов; это определяют отдельными экспериментами с заменой ионов\nсхема: пипетка → участок мембраны → усилитель → запись тока во времени", "s1_m3_items": "что измеряется: рассеяние рентгеновских лучей кристаллом белка, по которому рассчитывают расположение атомов\nуровень: множество одинаковых молекул в кристалле\nконтроль: функциональные измерения того же белка (расщепление АТФ, перенос ионов) и сравнение структур, полученных с разными веществами, фиксирующими разные состояния цикла\nтипичный артефакт: кристалл удерживает белок в одной конформации; вещества, использованные для этого, могут создавать состояния, редкие в работающем насосе\nчего не доказывает: отдельная структура — «снимок»; порядок состояний устанавливают, сопоставляя структуры с ферментативными данными\nсхема: белок → кристалл → рентгеновские лучи → картина рассеяния → модель белка в нескольких состояниях", "s1_m4_items": "что измеряется: относительное изменение концентрации цАМФ во времени (по соотношению свечения двух флуоресцентных белков)\nуровень: одна живая клетка или её участок\nконтроль: вещество, повышающее цАМФ в обход рецептора (максимальный ответ датчика), и клетки без датчика (фоновое свечение)\nтипичный артефакт: датчик сам связывает цАМФ и может немного менять его концентрацию и скорость распространения в клетке\nчего не доказывает: рост цАМФ не доказывает, что именно он вызывает ответ клетки; для этого нужны эксперименты с блокадой звеньев цепи\nсхема: датчик без цАМФ → датчик с цАМФ → изменение соотношения свечения → кривая во времени", "s1_m5": "Изменение объёма пузырьков при быстром смешивании", "s1_m6": "Метка белков поверхности", "s1_m7": "Криоэлектронная микроскопия белка", "s1_m5_items": "что измеряется: скорость изменения объёма пузырьков (по свечению красителя внутри)\nуровень: популяция одинаковых пузырьков\nконтроль: смешивание с тем же раствором без изменения концентрации — свечение не меняется\nтипичный артефакт: пузырьки разного размера и с несколькими слоями мембраны дают смесь скоростей\nчего не доказывает: не показывает, как молекула проходит через бислой; механизм обсуждают на основе расчётных моделей движения молекул\nсхема: пузырёк → смешивание → сжатие → (для проникающего вещества) набухание → кривая свечения", "s1_m6_items": "что измеряется: доля белка, находящаяся на поверхности клетки\nуровень: популяция клеток\nконтроль: общее количество того же белка в клетке (чтобы отличить перемещение от синтеза нового белка)\nтипичный артефакт: если метка частично проникает в клетку, в «поверхностную» долю попадают внутренние белки\nчего не доказывает: не показывает, работает ли белок на поверхности; это проверяют функциональным измерением (здесь — водной проницаемости)\nсхема: клетка → метка на поверхности → выделение меченых белков → сравнение с общим количеством", "s1_m7_items": "что измеряется: пространственное расположение атомов белка (структура)\nуровень: множество одинаковых молекул, усреднённых в одну структуру\nконтроль: функциональная проверка того же белка (перенос вещества в клетках или пузырьках) и проверка мутациями участков, видных на структуре\nтипичный артефакт: связанный ингибитор или стабилизирующий белок может удерживать состояние, которое в работающем переносчике вс    Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку

function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}

    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };

  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {

      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */

      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);
    /* носитель возврата к поверхности */
    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = G('nucleus', `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`);
    segs.forEach(([a, b]) => { const P = stadium(a, b, Yc, H); q += G('envelope', `<path d="M${P.map(([x, y]) => f(x) + ',' + f(y)).join(' L')} Z" fill="${C.lumen}"/>` + bilayerPts(P, { closed: true })); });
    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { let w = `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) w += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; q += G('npc', w); });
    const big = nucBig;
    const imp = o.noImp ? () => '' : nucImp;
    const exp = nucExp;
    const sm = nucSm;
    const top = [[110, 70], [300, 110], [480, 80]], bot = [[110, 320], [300, 290], [480, 330]];
    const q0 = q;
    let res = {};
    if (cargo === 'small') { q += sm([[70, 60], [150, 100], [260, 70], [340, 120], [450, 60], [540, 110], [80, 300], [170, 340], [270, 300], [350, 350], [460, 290], [540, 340], [206, 196], [394, 206]]); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'big' || cargo === 'mut') { q += top.map(([x, y]) => big(x, y, cargo === 'mut' ? 'mut' : '')).join(''); res = { mode: 'none', where: cargo === 'big' ? 'cytoslow' : 'cyto' }; }
    else if (cargo === 'm27' || cargo === 'm67') { const r = cargo === 'm27' ? 6 : 9.5, g = (x, y) => G('gfpprot', `<circle cx="${x}" cy="${y}" r="${r}" fill="#7FBF7F" stroke="#3d7a3d" stroke-width="1"/>`);
      q += [[90, 70], [230, 110], [380, 70], [520, 105], [206, 200], [100, 310], [250, 340], [400, 300], [530, 345]].map(([x, y]) => g(x, y)).join(''); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'nls') {
      if (rm === 'imp') { q += top.map(([x, y]) => big(x, y, 'nls')).join(''); res = { mode: 'norec', where: 'cyto' }; }
      else if (rm === 'ran') { q += big(110, 70, 'nls') + imp(110, 70) + big(394, Yc, 'nls') + imp(394, Yc) + big(300, 300, 'nls') + imp(300, 300); res = { mode: 'stuck', where: 'both' }; }
      else { q += big(110, 70, 'nls') + imp(110, 70) + big(206, Yc, 'nls') + imp(206, Yc) + bot.map(([x, y]) => big(x, y, 'nls')).join('') + imp(560, 360); res = { mode: 'imp', where: 'nuc' }; }
    } else {
      if (rm === 'exp' || rm === 'ran') { q += bot.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: rm === 'ran' ? 'noran' : 'norec', where: 'nuc' }; }
      else { q += big(300, 300, 'nes') + exp(300, 300) + big(394, Yc, 'nes') + exp(394, Yc) + top.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: 'exp', where: 'cyto' }; }
    }
    const a = { cyto: [14, 24], nuc: [14, 392], env: [530, Yc - 44], npc: [300, Yc + 62] };
    if (o.ran) {
      const g = (x, y, gtp) => G('ran', `<circle cx="${x}" cy="${y}" r="6" fill="${gtp ? '#1E7B4A' : '#fff'}" stroke="#1E7B4A" stroke-width="2"/>`);
      q += [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      const rd = [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      a.ranC = [300, 50]; a.ranN = [240, 380]; a.gtpN = rm !== 'ran'; a.rd = rd;
    }
    return { s: o.bg ? q0 + (a.rd || '') : q, res, a };

  /* ---------- рецептор груза по нормали к мембране (рецензия v0.1, R27) ----------

    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */

    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };

/* =====================================================================
   s1a_a2.js — схемы исследования 2 (03, И2.6; 07, разд. 1.3, 2.6, 3, 5). Модель — OC.a2_transitions, OC.a2_water, направления
   вкладов — OC.s2_ion (s0_oc_m.js); здесь только рисунок.
   Панель А «Ион»: бислой BF, сверху внеклеточная среда, снизу цитоплазма; значки иона ∝ концентрации; каналы в бислое
   (P = 0 — нет, 1 — один, 3 — три); стрелки вкладов слева, в отдельной рамке (синяя — концентрационный, красная — электрический);
   через каналы — две встречные дорожки точек (1 точка = 10 переходов); счётчики справа; строка состояния (03, И2.6).
   Панель Б «Вода»: клетка (замкнутый бислой BF), осмолиты, аквапорины; встречные дорожки воды через бислой и аквапорины.
   Ион через бислой не проходит ни в каком кадре: его дорожки — только в поре канала. До ответа счётчики, дорожки, стрелки
   вкладов и строка состояния не рисуются (S1F.waiting). o.stg — кадр анимации: 1 — концентрации и вклады; 2…4 — переходы.
   ===================================================================== */
const A2 = (function () {
  const { C, f, G, T, esc, arrow, ion, water, channel, aquaporin, waiting } = S1F;
  const Y = 210;
  const posAbove = [[180, 80], [240, 104], [300, 76], [360, 108], [420, 82], [210, 150], [330, 156], [400, 148]];
  const posBelow = [[180, 262], [250, 300], [310, 268], [380, 302], [420, 262], [200, 326], [300, 330], [390, 326]];
  const chX = P => P === 3 ? [235, 300, 365] : P === 1 ? [300] : [];
  const zz = z => z > 0 ? 'K' : 'Cl';
  /* стрелки вкладов в рамке слева (как на вкладке 2): вверх — наружу, вниз — внутрь */
  function contrib(c, e) {
    let s = `<rect x="16" y="138" width="112" height="144" rx="10" fill="var(--surface-2)" stroke="var(--line)"/>` + T(72, 156, t('s1_a2_contrib'), { size: 10.5, col: 'var(--muted)' });
    const ar = (x, d, col, g) => d ? G(g, d === 'in' ? arrow(x, 176, x, 262, col, 3) : arrow(x, 262, x, 176, col, 3)) : G(g, T(x, 224, t('s1_v_no'), { size: 10, col: 'var(--muted)' }));
    return s + ar(48, c, C.head, 'cgrad') + ar(96, e, C.red, 'ecgrad') + T(48, 276, t('s1_a2_c_conc'), { size: 9.5, col: C.head }) + T(96, 276, t('s1_a2_c_el'), { size: 9.5, col: C.red });
  }
  /* встречные дорожки точек через поры каналов; nIn, nOut — точки (1 точка = 10 переходов) */
  function lanes(xs, nIn, nOut, kind, frac) {
    if (!xs.length) return '';
    let s = '';
    const per = (n, i) => Math.floor(n / xs.length) + (i < n % xs.length ? 1 : 0);
    xs.forEach((x, i) => {
      const a = Math.round(per(nIn, i) * frac), b = Math.round(per(nOut, i) * frac), col = kind === 'M' ? C.grey : (kind === 'K' ? 'var(--tfeb)' : 'var(--aa)');
      for (let k = 0; k < a; k++) s += `<circle cx="${f(x - 2)}" cy="${f(Y - 30 + (k + .5) * 60 / Math.max(a, 1))}" r="1.9" fill="${col}"/>`;
      for (let k = 0; k < b; k++) s += `<circle cx="${f(x + 2)}" cy="${f(Y + 30 - (k + .5) * 60 / Math.max(b, 1))}" r="1.9" fill="${col}"/>`;
      if (a) s += arrow(x - 14, Y - 36, x - 14, Y + 36, 'var(--muted)', 1.3, { head: 5 });

      T(x + 10, y + 20, (lab ? lab[0] : t('s1_a2_cnt_in')) + ': ' + tin, { a: 'l', size: 11 }) +
      T(x + 10, y + 42, (lab ? lab[1] : t('s1_a2_cnt_out')) + ': ' + tout, { a: 'l', size: 11 }) +
      T(x + 10, y + 70, (lab ? lab[2] : t('s1_a2_cnt_net_s')) + ': ' + sg(net), { a: 'l', size: 11.5, w: 700 }));

  function drawIon(o) {
    let s = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface)"/><rect class="cyto" x="0" y="${Y}" width="600" height="${420 - Y}"/>` +
      G('out', `<text class="area" x="14" y="22">${esc(t('lbl_out'))}</text>`) + G('cyto', `<text class="area" x="14" y="406">${esc(t('lbl_cytosol'))}</text>`);

    s += posAbove.slice(0, o.rev ? 4 : o.Co).map(([x, y]) => ionAt(x, y)).join('') + posBelow.slice(0, o.rev ? 4 : o.Ci).map(([x, y]) => ionAt(x, y)).join('');
    if (o.rev) {
      s += counters(440, 52, '?', '?', 0);

    }
    const stg = o.stg == null ? 9 : o.stg;
    if (waiting()) return s;
    const [tin, tout, net] = OC.a2_transitions(o.z, o.Co, o.Ci, o.pot, o.P);
    const conc = o.Co > o.Ci ? 'out' : o.Ci > o.Co ? 'in' : 'eq', [c, e] = OC.s2_ion(o.z, conc, o.pot, true);

    if (stg === 1) return s;

    s += lanes(xs, Math.round(tin / 10), Math.round(tout / 10), kind, frac);
    s += counters(440, 52, tin, tout, net);
    s += T(515, 154, t('s1_a2_dot'), { size: 9.5, col: 'var(--muted)', n: 22 });
    s += G(o.P === 0 ? 'chan' : net === 0 ? 'dyneq' : 'ecgrad', T(340, 370, t(status(o.P, net)), { size: 12, w: 700, n: 58 }));

  }
  const status = (P, net) => P === 0 ? 's1_a2_st_nopath' : net === 0 ? 's1_a2_st_eq' : 's1_a2_st_force';
  /* панель Б: клетка с аквапоринами или без; встречные дорожки воды через бислой и аквапорины */
  function cell(cx, cy, R, aqp, ton, frac, showCnt) {
    let s = `<circle cx="${cx}" cy="${cy}" r="${R - 9}" class="cyto"/>` + G('cell', BF.bilayerPts(BF.circlePts(cx, cy, R, Math.max(48, Math.round(R * .7))), { closed: true }));
    const ins = [[-.4, -.3], [.2, -.45], [.45, .1], [-.1, .35], [-.5, .25], [.15, .05]], outs = [[-1.45, -.9], [1.4, -1], [1.5, .8], [-1.4, .95], [0, -1.45], [.05, 1.45]];
    s += ins.map(([a, b]) => G('osm', `<circle cx="${f(cx + a * R)}" cy="${f(cy + b * R)}" r="3.4" fill="${C.grey}"/>`)).join('');
    s += outs.slice(0, ton === 'hypo' ? 4 : 6).map(([a, b]) => G('osm', `<circle cx="${f(cx + a * R * .82)}" cy="${f(cy + b * R * .82)}" r="3.4" fill="${C.grey}"/>`)).join('');
    if (aqp) [-50, 180, 50].forEach(a => { const r = a * Math.PI / 180, x = cx + R * Math.cos(r), y = cy + R * Math.sin(r);
      s += `<g transform="rotate(${a + 90} ${f(x)} ${f(y)})">${aquaporin(x, y)}</g>`; });
    if (frac > 0) {
      const [win, wout] = OC.a2_water(ton, aqp), nIn = Math.max(1, Math.round(win / 10 * frac)), nOut = Math.max(1, Math.round(wout / 10 * frac));
      /* дорожки: верх клетки — через бислой; при аквапоринах — ещё через поры (по направлениям белков) */
      const lane = (ang, n, dir) => { const r = ang * Math.PI / 180, ux = Math.cos(r), uy = Math.sin(r), side = dir === 'in' ? -7 : 7, tx = -uy * side, ty = ux * side;
        const o1 = dir === 'in' ? R + 30 : R - 30, o2 = dir === 'in' ? R - 30 : R + 30;
        let q = arrow(cx + ux * o1 + tx, cy + uy * o1 + ty, cx + ux * o2 + tx, cy + uy * o2 + ty, 'var(--muted)', 1.2, { head: 5 });
        for (let k = 0; k < Math.min(n, 6); k++) { const d = R - 24 + (k + .5) * 48 / Math.min(n, 6); q += `<circle cx="${f(cx + ux * d + tx * 1.8)}" cy="${f(cy + uy * d + ty * 1.8)}" r="2.3" fill="var(--muted)"/>`; }
        return G('water', q); };
      const angs = aqp ? [-90, -50, 180, 50] : [-90];   /* −90° — через бислой; остальные — через аквапорины */

/* =====================================================================
   s1a_a3.js — схема и графики исследования 3 (03, И3.6; 07, разд. 2.7, 3, 5). Модель — OC.a3_* (s0_oc_m.js), здесь только рисунок.
   Слева — участок плазматической мембраны (бислой BF; сверху внеклеточная среда, снизу цитоплазма): насос (стрелки выведения
   Na⁺ — по числу ∝ расходу АТФ A), канал утечки Na⁺ (толщина стрелки входа Na⁺ ∝ утечке), переносчики X и Y (толщина стрелок
   переноса ∝ потокам). Вторичные переносчики с АТФ не связаны. Справа — четыре графика во времени (G, X, Y, A; t 0–60,
   единицы условные) с вертикальной линией текущего момента. До ответа в шаге сценария (S1F.waiting) кривые и значения не
   рисуются. Насос не «обнуляет» градиент мгновенно: кривая G после остановки — экспонента правила 2.
   ===================================================================== */
const A3 = (function () {
  const { C, f, G, T, arrow, sides, pump, channel, carrier, ion, subX, subY, waiting } = S1F;
  /* сценарий модели из переключателей: pump 'on'|'stop', leak 1|3, res 400|150, tr 1|0.2|0, x 1|0.2 */
  const scen = o => ({ L: o.leak, Pmax: o.res, pump_stop_at: o.pump === 'stop' ? 0 : null, T: o.tr, S: o.x });
  const vals = (sc, t) => ({ G: OC.a3_G(t, sc), X: OC.a3_JX(t, sc), Y: OC.a3_JY(t, sc), A: OC.a3_A(t, sc) });
  const r0 = v => String(OC.pyRound(v));
  const GR = [['G', 's1_a3_plot_G', 'var(--akt)', 1], ['X', 's1_a3_plot_X', C.cargo, 100], ['Y', 's1_a3_plot_Y', C.copii, 100], ['A', 's1_a3_plot_A', C.dyn, 400]];
  /* участок мембраны с белками; th — толщины стрелок по модели в момент t */
  function membrane(o, v, sc) {
    const Y = 236; let s = sides(Y, { out: t('lbl_out'), in: t('lbl_cytosol') }, { top: 0, bot: 420 }).replace(/width="600"/g, 'width="290"');
    s += G('pm', BF.line(8, 282, Y));
    const stop = o.pump === 'stop';
    /* насос: при работе — стрелки выведения Na⁺ наружу (их число ∝ A / 100), при остановке — без стрелок */
    s += pump(46, Y, { col: stop ? 'var(--line)' : C.dyn, w: 22 }) + T(46, Y + 48, t('s1_a3_d_pump'), { size: 10.5 });
    const nOut = stop ? 0 : Math.max(1, Math.round(v.A / 100));
    for (let i = 0; i < Math.min(4, nOut); i++) s += G('na', arrow(34 + i * 8, Y - 26, 34 + i * 8, Y - 58, 'var(--akt)', 1.6, { head: 6 }));
    if (!stop) s += ion(22, Y - 68, 'Na', { g: 'na' });
    /* канал утечки Na⁺: толщина стрелки входа ∝ утечке (L) */
    s += channel(114, Y, { g: 'leakch' }) + T(114, Y + 48, t('s1_a3_d_leak'), { size: 10.5, n: 10 });
    s += G('leak', arrow(114, Y - 64, 114, Y + 30, 'var(--akt)', 1.4 * sc.L + .6, { head: 7 + sc.L })) + ion(130, Y - 62, 'Na', { g: 'na' });
    /* переносчики X и Y: Na⁺ и вещество внутрь (симпорт); толщина ∝ потоку; АТФ не участвует */
    const wX = v.X / 100, wY = v.Y / 100;

    if (wX > .005) s += G('x', arrow(184, Y - 44, 184, Y + 30, C.cargo, Math.max(.8, 4 * wX), { head: 7 }));
    s += carrier(252, Y, { g: 'carrier' }) + T(252, Y + 48, t('s1_a3_d_cy'), { size: 10.5, n: 10 });
    s += subY(240, Y - 58) + ion(262, Y - 58, 'Na', { g: 'na' });

  }
  /* четыре графика: кривые по модели t = 0…60 (шаг 1), линия текущего момента; two — сравнение двух клеток (шаг 6) */
  function plots(o, scs, hide) {
    let s = `<rect x="292" y="0" width="308" height="420" fill="var(--surface)"/>` + G('steady', T(446, 18, t('s1_a3_d_plots'), { size: 12.5, w: 700, col: 'var(--muted)' }));
    const x0 = 334, w = 250, h = 54;
    GR.forEach(([k, lab, col, ymax], i) => {
      const y0 = 40 + i * 94, X = tt => x0 + tt / 60 * w, Yv = v => y0 + 22 + h - Math.min(1.05, v / ymax) * h;
      s += T(x0 - 2, y0 + 10, t(lab), { a: 'l', size: 11.5, w: 600 });
      s += `<line x1="${x0}" y1="${y0 + 22 + h}" x2="${x0 + w}" y2="${y0 + 22 + h}" stroke="var(--edge)"/><line x1="${x0}" y1="${y0 + 22}" x2="${x0}" y2="${y0 + 22 + h}" stroke="var(--edge)"/>`;
      s += `<line x1="${x0}" y1="${f(Yv(k === 'A' ? 100 : ymax))}" x2="${x0 + w}" y2="${f(Yv(k === 'A' ? 100 : ymax))}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
      if (hide) return;

      });
      const v = vals(scs[0], o.t)[k];
      s += T(x0 + w, y0 + 10, scs.length > 1 ? scs.map((sc, j) => (j + 1) + ': ' + r0(k === 'G' ? 100 * vals(sc, o.t).G : vals(sc, o.t)[k])).join(' · ') : r0(k === 'G' ? 100 * v : v) + (k === 'G' ? ' %' : ''), { a: 'r', size: 11.5, w: 700 });
    });
    const xc = x0 + o.t / 60 * w;
    if (!hide) GR.forEach((_, i) => { const y0 = 40 + i * 94; s += `<line x1="${f(xc)}" y1="${y0 + 20}" x2="${f(xc)}" y2="${y0 + 22 + h}" stroke="var(--on, #1F3B73)" stroke-width="1.6"/>`; });
    s += T(x0 + w / 2, 410, t('s1_a3_d_axis'), { size: 11, col: 'var(--muted)', it: true });
    return s;
  }
  function draw(o) {

    if (o.two) {   /* шаг 6: клетка 1 — переносчик X на 20 %, клетка 2 — насос остановлен; момент 48 */
      const s1 = OC.A3_SCEN.carrier20, s2 = OC.A3_SCEN.stop;
      return membrane(o, vals(s1, o.t), s1) + plots(o, [s1, s2], hide) + (hide ? '' : T(146, 330, t('s1_a3_d_two'), { size: 10.5, n: 44, col: 'var(--muted)' }));
    }
    return membrane(o, vals(sc, o.t), sc) + plots(o, [sc], hide);
  }
  /* анимация (07, разд. 5): время модели от 0 до текущего t, кадр этапа — та же функция draw */
  function plan(o) {
    if (!o.t || o.two) return null;
