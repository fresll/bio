го больше, мембранный потенциал, есть ли в мембране открытый канал, через который этот ион проходит. Показания — направление концентрационного вклада, направление электрического вклада и результирующее направление пассивного переноса. Панель Б — клетка в растворе: концентрация эффективных осмолитов снаружи по сравнению с цитоплазмой и наличие аквапоринов. Показания — направление переноса воды, скорость, что происходит с объёмом клетки. Модель качественная: величины вкладов не заданы, если об этом не сказано в условии шага", "s1_t2_a_undet": "Направление зависит от соотношения величин вкладов; по этим данным его определить нельзя", "s1_t2_a_eq": "Результирующего переноса нет; ионы проходят через канал в обе стороны с одинаковой частотой", "s1_t2_a_none": "Движущей силы нет; ионы проходят через канал в обе стороны с одинаковой частотой", "s1_t2_a_nopath": "Движущая сила есть, пути нет: перенос через мембрану практически не идёт", "s1_t2_a_ion": "Ион", "s1_t2_a_ion_Ca": "Ca²⁺ (катион, заряд +2)", "s1_t2_a_ion_Na": "Na⁺ (катион, +1)", "s1_t2_a_ion_K": "K⁺ (катион, +1)", "s1_t2_a_ion_Cl": "Cl⁻ (анион, −1)", "s1_t2_a_conc_sel": "Где ион в большей концентрации", "s1_t2_a_conc_sel_out": "снаружи", "s1_t2_a_conc_sel_eq": "одинаково", "s1_t2_a_conc_sel_in": "внутри", "s1_t2_a_pot": "Мембранный потенциал", "s1_t2_a_pot_neg": "внутри отрицательнее", "s1_t2_a_pot_zero": "0", "s1_t2_a_pot_pos": "внутри положительнее", "s1_t2_a_pot_eqm": "равновесный для этого иона", "s1_t2_a_ch": "Открытый канал для этого иона", "s1_t2_b_ton": "Снаружи концентрация эффективных осмолитов", "s1_t2_b_ton_hypo": "ниже, чем в цитоплазме", "s1_t2_b_ton_iso": "такая же", "s1_t2_b_ton_hyper": "выше", "s1_t2_b_aqp": "Аквапорины в мембране", "s1_t2_b_dir": "Результирующий перенос воды", "s1_t2_b_rate": "Скорость", "s1_t2_b_vol": "Объём клетки", "s1_t2_a_z": "Для иона с зарядом +2 электрический вклад при том же потенциале больше, чем для иона с зарядом +1", "s1_t2_how_text": "Электрический ток через ионные каналы измеряют методом локальной фиксации потенциала. Тонкую стеклянную микропипетку плотно прижимают к мембране и регистрируют ток через небольшой участок мембраны или через всю мембрану клетки при заданном мембранном потенциале. Если поменять потенциал и найти значение, при котором ток через каналы данного иона равен нулю, получают равновесный потенциал этого иона. Водную проницаемость измеряют по скорости изменения объёма клеток или липидных пузырьков после смены раствора", "s1_t3_s1_cond": "Панель А, полный набор. Насос совершил 10 циклов", "s1_t3_s1_q": "Сколько ионов перенесено и сколько АТФ израсходовано?", "s1_t3_s1_o1": "30 Na⁺ выведено, 20 K⁺ введено, израсходовано 10 молекул АТФ", "s1_t3_s1_x1": "Верно: 3 : 2 : 1 на цикл. За 10 циклов из клетки вынесено на 10 положительных зарядов больше, чем внесено", "s1_t3_s1_o2": "10 Na⁺ выведено, 10 K⁺ введено, 10 АТФ", "s1_t3_s1_x2": "Насос не обменивает ионы один на один. За цикл он выносит 3 Na⁺ и вносит 2 K⁺", "s1_t3_s1_o3": "30 Na⁺ и 20 K⁺, израсходовано 50 АТФ — по одной молекуле на ион", "s1_t3_s1_x3": "Энергия одной молекулы АТФ обеспечивает весь цикл: перенос трёх Na⁺ и двух K⁺", "s1_t3_s1_o4": "20 Na⁺ выведено, 30 K⁺ введено, 10 АТФ", "s1_t3_s1_x4": "Направления перепутаны: Na⁺ выводится наружу (его больше снаружи), K⁺ вводится внутрь (его больше внутри). Насос переносит оба иона против их градиентов", "s1_t3_s1_h1": "Что переносится за один цикл?", "s1_t3_s1_h2": "Умножьте каждое число цикла на 10", "s1_t3_s1_h3": "3 : 2 : 1", "s1_t3_s1_e": "Стехиометрия 3 Na⁺ : 2 K⁺ : 1 АТФ делает насос электрогенным: он создаёт результирующий ток положительных зарядов наружу. Но прямой вклад этого тока в мембранный потенциал обычно не превышает 10 %. Основная часть потенциала покоя создаётся иначе: K⁺, накопленный насосом, выходит через каналы утечки K⁺ и оставляет внутри избыток отрицательных зарядов. От насоса эта часть зависит косвенно — через градиент K⁺", "s1_t3_s1_bio": "17 18", "s1_t3_s2_cond": "Панель А. Во внеклеточной среде нет K⁺; АТФ и Na⁺ в цитоплазме есть. Схема скрыта до ответа", "s1_t3_s2_q": "Где остановится цикл насоса?", "s1_t3_s2_o1": "После выхода Na⁺: без K⁺ не идёт дефосфорилирование", "s1_t3_s2_x1": "Верно. Этапы цикла сопряжены: фосфорилирование запускается связыванием Na⁺, дефосфорилирование — связыванием K⁺. Без K⁺ снаружи насос не возвращается в исходную конформацию, и следующий цикл не начинается", "s1_t3_s2_o2": "Цикл не начнётся: насосу нужны оба иона одновременно", "s1_t3_s2_x2": "Na⁺ связывается изнутри, K⁺ — снаружи, и на разных этапах. Без K⁺ первая половина цикла проходит", "s1_t3_s2_o3": "Насос будет выносить Na⁺, но не вводить K⁺, и расходовать АТФ без остановки", "s1_t3_s2_x3": "В модели каждый цикл требует дефосфорилирования, которое запускается связыванием K⁺; без K⁺ цикл останавливается после этапа 3, и новая молекула АТФ не используется", "s1_t3_s2_o4": "Насос будет переносить Na⁺ в обе стороны", "s1_t3_s2_x4": "В модели насос не возвращается к исходной конформации без связывания K⁺; направленность цикла обеспечивает строгий порядок этапов", "s1_t3_s2_h1": "Какое событие запускает дефосфорилирование?", "s1_t3_s2_h2": "Найдите на схеме этап, для которого нужен K⁺", "s1_t3_s2_h3": "Всё, что идёт до связывания K⁺, проходит", "s1_t3_s2_e": "Насос — не просто «отверстие с мотором». Его циклу задаёт направление строгий порядок этапов: связывание Na⁺ → фосфорилирование → открытие наружу → связывание K⁺ → дефосфорилирование → открытие внутрь. Уберите в конструкторе АТФ — цикл остановится после связывания Na⁺; уберите Na⁺ — не начнётся", "s1_t3_s2_bio": "17", "s1_t3_s3_cond": "Панель Б. Симпорт Na⁺ и X; Na⁺-градиент исходный; поток X — 100 %", "s1_t3_s3_q": "Откуда переносчик X получает энергию для переноса X против градиента?", "s1_t3_s3_o1": "Из входа Na⁺ по его электрохимическому градиенту", "s1_t3_s3_x1": "Верно. Переносчик сопрягает «спуск» Na⁺ с «подъёмом» X. АТФ расходует насос, а переносчик использует уже созданный градиент. Это вторичный активный транспорт", "s1_t3_s3_o2": "Из гидролиза АТФ, который переносчик проводит сам", "s1_t3_s3_x2": "Переносчик X АТФ не расщепляет — счётчик на панели показывает 0. АТФ расходуется насосом на поддержание Na⁺-градиента", "s1_t3_s3_o3": "Энергия не нужна: X идёт по своему градиенту", "s1_t3_s3_x3": "В симпорте X накапливается внутри клетки, где его уже больше, — это перенос против градиента, и без источника энергии он невозможен", "s1_t3_s3_o4": "Из мембранного потенциала, независимо от Na⁺", "s1_t3_s3_x4": "Мембранный потенциал действительно входит в электрохимический градиент Na⁺, но переносчик использует его только вместе с переходом Na⁺. Без Na⁺ перенос X не идёт", "s1_t3_s3_h1": "Что ещё переносит этот белок, кроме X?", "s1_t3_s3_h2": "Куда направлен электрохимический градиент Na⁺?", "s1_t3_s3_h3": "Один перенос «под горку» оплачивает другой «в горку»", "s1_t3_s3_e": "Различие первичного и вторичного активного транспорта — в источнике энергии: насос расходует АТФ сам, вторичный переносчик использует градиент иона. Энергия градиента Na⁺ складывается из двух вкладов: концентрационного (снаружи Na⁺ больше) и электрического (внутри отрицательнее). Поэтому её нельзя оценивать по одной разности концентраций", "s1_t3_s3_bio": "19 20", "s1_t3_s4_cond": "Панель Б. Антипорт: переносчик переносит Na⁺ внутрь и X наружу, против градиента X. Насос работает, но Na⁺-градиент уменьшен: в цитоплазме Na⁺ стало больше. Переносчик X цел, АТФ в клетке достаточно", "s1_t3_s4_q": "Что произойдёт с выведением X?", "s1_t3_s4_o1": "Уменьшится: энергии входящего Na⁺ стало меньше", "s1_t3_s4_x1": "Верно. Поток X зависит от величины Na⁺-градиента. При уменьшенном градиенте в модели он составляет 40 % исходного", "s1_t3_s4_o2": "Не изменится: АТФ в клетке достаточно", "s1_t3_s4_x2": "Переносчик X АТФ не использует. Для него важен Na⁺-градиент, а не количество АТФ в клетке", "s1_t3_s4_o3": "Увеличится: Na⁺ в клетке стало больше, значит больше Na⁺ доступно для переноса", "s1_t3_s4_x3": "Переносчик использует не количество Na⁺, а разность его электрохимических потенциалов по сторонам мембраны. Чем больше Na⁺ внутри, тем эта разность меньше", "s1_t3_s4_o4": "X пойдёт в обратном направлении — внутрь", "s1_t3_s4_x4": "Направление может измениться, только если градиент Na⁺ станет недостаточным для переноса X против его градиента, а не просто уменьшится. Многие переносчики обратимы, но в модели градиент уменьшен, а не обращён", "s1_t3_s4_h1": "Что служит источником энергии для антипортера?", "s1_t3_s4_h2": "Как изменилась разность концентраций Na⁺?", "s1_t3_s4_h3": "Меньше градиент — меньше энергии для «подъёма» X", "s1_t3_s4_e": "Вторичный транспорт чувствителен к величине градиента иона, а не к количеству АТФ в данный момент. Пример антипорта в клетках — Na⁺/Ca²⁺-обменник: вход Na⁺ по градиенту выводит Ca²⁺ из цитоплазмы. При уменьшении Na⁺-градиента выведение Ca²⁺ ослабевает", "s1_t3_s4_bio": "19 20", "s1_t3_s5_cond": "Панель В. В цитоплазму этой условной клетки постоянно поступает небольшой поток Ca²⁺ из внеклеточной среды. Выводит Ca²⁺ из цитоплазмы только Na⁺/Ca²⁺-обменник (антипорт: Na⁺ входит, Ca²⁺ выходит); до начала эксперимента выведение уравновешивает поступление, и концентрация Ca²⁺ постоянна. Na⁺/K⁺-АТФазу остановили (например, заблокировали). Сравниваются два момента: через 1 минуту и через 60 минут после остановки насоса (времена условные). Показания скрыты до ответа", "s1_t3_s5_q": "Что будет с концентрацией Ca²⁺ в цитоплазме в эти два момента?", "s1_t3_s5_o1": "Через 1 минуту почти исходная, через 60 минут заметно выше", "s1_t3_s5_x1": "Верно. Сразу после остановки насоса Na⁺-градиент почти исходный, и обменник выводит Ca²⁺ так же быстро, как он поступает. По мере того как Na⁺ входит в клетку по путям утечки, градиент снижается, обменник выводит Ca²⁺ всё слабее, поступление начинает преобладать над выведением, и Ca²⁺ в цитоплазме накапливается", "s1_t3_s5_o2": "Сразу резко повысится: без насоса обменник перестаёт работать в ту же секунду", "s1_t3_s5_x2": "Обменник работает за счёт градиента Na⁺, а градиент после остановки насоса исчезает не сразу, а постепенно", "s1_t3_s5_o3": "Не изменится: обменник АТФ не использует, значит насос ему не нужен", "s1_t3_s5_x3": "Обменнику не нужен насос сам по себе, но нужен градиент Na⁺, который насос поддерживает. Без насоса градиент со временем снижается", "s1_t3_s5_o4": "Снизится: освободившаяся от насоса энергия АТФ ускорит обменник", "s1_t3_s5_x4": "Обменник АТФ не использует; остановка насоса энергии ему не передаёт. Он зависит только от градиента Na⁺", "s1_t3_s5_h1": "Что использует обменник как источник энергии?", "s1_t3_s5_h2": "Исчезает ли градиент Na⁺ сразу, если перестать его поддерживать?", "s1_t3_s5_h3": "Запас расходуется постепенно — и выведение Ca²⁺ ослабевает постепенно", "s1_t3_s5_e": "Остановка насоса не обнуляет градиенты мгновенно: они рассеиваются по мере утечки ионов, часто в течение многих минут. Вместе с градиентом постепенно ослабевают все процессы, которые его используют, — и симпорт, и антипорт. Сразу исчезает только небольшой прямой электрогенный вклад насоса в мембранный потенциал. Ca²⁺ накапливается потому, что его поступление в цитоплазму продолжается, а выведение отстаёт; если бы Ca²⁺ не поступал, ослабление обменника само по себе не повысило бы его концентрацию. Как скорость снижения градиента зависит от утечки и запаса мощности насоса, разбирается на продвинутом уровне вкладки. Времена на схеме условные", "s1_t3_s5_bio": "18 21", "s1_t3_rev_q": "В клетке перестал идти Na⁺-зависимый перенос глюкозы внутрь. Мембранный потенциал и концентрации Na⁺ и K⁺ остались исходными, АТФ достаточно. Какое объяснение совместимо с этими данными?", "s1_t3_rev_o1": "Нарушен сам переносчик глюкозы", "s1_t3_rev_x1": "Верно. Градиент и источник энергии сохранены, значит причина в звене, которое этот градиент использует", "s1_t3_rev_o2": "Остановился насос", "s1_t3_rev_x2": "Пока градиент исходный, переносчик работает и без насоса. Перенос глюкозы остановился бы только после того, как градиент рассеялся бы, а по условию он исходный", "s1_t3_rev_o3": "В клетке не хватает АТФ", "s1_t3_rev_x3": "По условию АТФ достаточно; к тому же переносчик глюкозы АТФ не использует", "s1_t3_rev_o4": "Мембрана стала проницаемой для Na⁺", "s1_t3_rev_x4": "Если насос компенсирует такую утечку, градиент сохраняется, и перенос глюкозы продолжался бы; если не компенсирует — Na⁺ в клетке был бы повышен. По условию концентрации исходные, и в обоих случаях эта причина не объясняет остановку переноса", "s1_t3_rev_e": "Чтобы найти нарушенное звено, проверяют каждое по отдельности: есть ли энергия (АТФ), есть ли градиент (Na⁺ внутри и снаружи, потенциал), есть ли переносчик и работает ли он. Если первые два в порядке, остаётся третье. На продвинутом уровне эта логика проверяется на модели во времени", "s1_t3_expl": "Na⁺/K⁺-АТФаза — насос P-типа: за цикл она расходует одну молекулу АТФ, выводит 3 Na⁺ и вводит 2 K⁺. Порядок этапов задают связывание ионов: Na⁺ запускает фосфорилирование насоса, K⁺ — дефосфорилирование. Насос поддерживает неравновесное состояние клетки: низкий Na⁺ и высокий K⁺ в цитоплазме. Неравное число зарядов делает его электрогенным, но прямо он создаёт лишь небольшую часть мембранного потенциала; основная часть возникает из-за выхода K⁺ через каналы утечки и зависит от насоса косвенно. Градиент Na⁺ — запас энергии, который расходуют вторичные переносчики: в симпорте Na⁺ и переносимое вещество движутся в одну сторону, в антипорте — в противоположные. Сами вторичные переносчики АТФ не расщепляют. Остановка насоса не отменяет градиент сразу: он уменьшается постепенно, и вместе с ним ослабевает вторичный транспорт. На поддержание работы этого насоса типичная клетка животного расходует почти треть своей энергии", "s1_t3_limits": "Модель не показывает строение насоса и переносчика и все промежуточные состояния цикла; изменение мембранного потенциала при работе насоса; утечку ионов через другие пути, кроме оговорённой; обратимость переносчиков (при обращении градиентов многие из них переносят вещества в обратном направлении); регуляцию числа насосов и переносчиков в мембране. Не показано и изменение объёма клетки: в клетке после остановки насоса Na⁺ постепенно накапливается в цитоплазме, вслед за ним входит вода, и клетка набухает. В панели В Ca²⁺ выводит только Na⁺/Ca²⁺-обменник; в клетках его выводит и Ca²⁺-насос плазматической мембраны (P-типа), а часть Ca²⁺ накапливается во внутриклеточных депо. Поток X — условная доля исходного уровня, времена после остановки насоса условные", "s1_t3_title": "3. Первично-активный и вторично-активный мембранный транспорт", "s1_t3_pre": "<b>Активный транспорт</b> — перенос вещества против его электрохимического градиента; он идёт только при сопряжении с источником энергии. <b>Первичный активный транспорт</b> использует энергию гидролиза АТФ непосредственно: белок-<b>насос</b> (АТФаза) сам расщепляет АТФ, и это меняет его конформацию. <b>Вторичный активный транспорт</b> использует энергию уже существующего градиента другого вещества — обычно иона Na⁺: белок-переносчик переносит Na⁺ по его электрохимическому градиенту и одновременно переносит другое вещество против градиента этого вещества. Если оба вещества переносятся в одном направлении, это <b>симпорт</b>, если в противоположных — <b>антипорт</b>. Градиент иона, созданный насосом, можно рассматривать как форму запасённой энергии: её расходуют вторичные переносчики, пока градиент существует.\n<b>Na⁺/K⁺-АТФаза</b> (натрий-калиевый насос) есть в плазматической мембране почти всех клеток животных. За один цикл она расходует одну молекулу АТФ, выводит из клетки 3 иона Na⁺ и вводит 2 иона K⁺. Насос <b>электрогенный</b>: за цикл из клетки выходит на один положительный заряд больше, чем входит.", "s1_t3_cond": "Объект — плазматическая мембрана условной клетки животного. Панель А: Na⁺/K⁺-АТФаза; можно убрать АТФ, Na⁺ в цитоплазме или K⁺ во внеклеточной среде и посмотреть, до какого этапа дойдёт цикл. Счётчики — сколько ионов перенесено и сколько АТФ израсходовано за заданное число циклов. Панель Б: Na⁺-зависимый переносчик условного вещества X; переключатели — величина Na⁺-градиента, тип переносчика, наличие переносчика и вещества X. Показание — относительный поток X (100 — исходный уровень). Числа ионов в счётчиках точные для стехиометрии насоса; потоки X условные", "s1_t3_a_atp": "АТФ в цитоплазме", "s1_t3_a_na": "Na⁺ в цитоплазме", "s1_t3_a_k": "K⁺ во внеклеточной среде", "s1_t3_a_stop": "Цикл остановился после этапа N: для следующего этапа не хватает …", "s1_t3_a_n": "Na⁺ выведено", "s1_t3_b_kind": "Тип переносчика", "s1_t3_b_kind_sym": "симпорт: Na⁺ и X — внутрь", "s1_t3_b_kind_anti": "антипорт: Na⁺ — внутрь, X — наружу", "s1_t3_b_grad": "Na⁺-градиент", "s1_t3_b_grad_full": "исходный", "s1_t3_b_grad_reduced": "уменьшен", "s1_t3_b_grad_none": "отсутствует", "s1_t3_b_car": "Переносчик X", "s1_t3_b_x": "Вещество X на стороне, откуда его переносят", "s1_t3_b_flux": "Поток X, % исходного", "s1_t3_b_atp": "АТФ, расходуемая самим переносчиком X", "s1_t3_c_t": "через 1 минуту", "s1_t3_how_text": "Механизм насосов P-типа установили, изучая их ферментативные реакции и пространственные структуры в разных промежуточных состояниях цикла. Первым так подробно изучили Ca²⁺-насос мембран саркоплазматического ретикулума: структуры, полученные рентгеноструктурным анализом кристаллов белка, показали, как связывание ионов запускает перенос фосфатной группы АТФ на остаток аспарагиновой кислоты насоса и как фосфорилирование и дефосфорилирование меняют конформацию. Все насосы P-типа, включая Na⁺/K⁺-АТФазу, устроены сходно", "s1_t4_s1_cond": "Панель А. Мысленный эксперимент модели: из всех трёх клеток удалили содержимое цитоплазмы и белки, связанные с внутренней поверхностью мембраны (в том числе G-белок); остались мембрана и встроенные в неё белки. Лиганды есть. Схема скрыта до ответа", "s1_t4_s1_q": "В какой колонке связывание лиганда по-прежнему изменит ионный поток через мембрану?", "s1_t4_s1_o1": "А1: канал находится в самом рецепторе", "s1_t4_s1_x1": "Верно. В колонке А1 узнавание лиганда и путь для ионов — один белок: изменение его конформации открывает канал. Остальным двум колонкам для ответа нужны белки цитоплазмы", "s1_t4_s1_o2": "А2: G-белок встроен в мембрану как канал", "s1_t4_s1_x2": "G-белок находится на внутренней стороне мембраны и каналом не является; к тому же в этом эксперименте его удалили вместе с другими белками, связанными с внутренней поверхностью мембраны", "s1_t4_s1_o3": "А3: после взаимного фосфорилирования рецептор открывается как канал", "s1_t4_s1_x3": "Рецепторная тирозинкиназа — фермент, а не канал. Её ответ — фосфорилирование белков, которые в этом эксперименте удалены", "s1_t4_s1_o4": "Ни в одной: без цитоплазмы рецепторы не связывают лиганд", "s1_t4_s1_x4": "Связывание лиганда происходит на наружной части рецептора и от белков цитоплазмы не зависит. Ответ рецептора-канала сохранится", "s1_t4_s1_h1": "Где на схеме пора, через которую проходят ионы?", "s1_t4_s1_h2": "Каким колонкам нужны белки цитоплазмы, чтобы появился ответ?", "s1_t4_s1_h3": "Ответ без белков цитоплазмы возможен там, где рецептор сам пропускает ионы", "s1_t4_s1_e": "Рецептор — ионный канал объединяет в одной молекуле узнавание лиганда и путь для ионов. Поэтому его ответ — изменение мембранного потенциала — обычно развивается за миллисекунды: его скорость ограничена изменением конформации белка и движением ионов", "s1_t4_s1_bio": "25", "s1_t4_s2_cond": "Колонка А2. Лиганд есть. G-белок удалён из клетки (конструктор). Схема скрыта до ответа", "s1_t4_s2_q": "Что произойдёт?", "s1_t4_s2_o1": "Лиганд свяжется, но ответа не будет", "s1_t4_s2_x1": "Верно. Связывание лиганда — только первое событие цепи. Без G-белка активированный рецептор не может передать сигнал ферменту", "s1_t4_s2_o2": "Лиганд не свяжется с рецептором", "s1_t4_s2_x2": "Рецептор на месте, его участок связывания не изменился. Лиганд связывается, но дальше сигнал не идёт", "s1_t4_s2_o3": "Ответ будет, только слабее", "s1_t4_s2_x3": "В этой цепи G-белок — единственная связь рецептора с ферментом. В модели без него ответа нет совсем", "s1_t4_s2_o4": "Рецептор сам начнёт образовывать цАМФ", "s1_t4_s2_x4": "Рецептор, сопряжённый с G-белком, не имеет ферментативной активности; цАМФ образует фермент, который активируется G-белком", "s1_t4_s2_h1": "Какие события стоят в цепи после связывания лиганда?", "s1_t4_s2_h2": "Что связывает рецептор с ферментом?", "s1_t4_s2_h3": "Связался — ещё не значит ответил", "s1_t4_s2_e": "Ответ требует всей цепи. Поэтому одного измерения связывания лиганда недостаточно, чтобы судить об ответе клетки", "s1_t4_s2_bio": "26", "s1_t4_s3_cond": "Колонка А2, все звенья есть. Числа молекул на схеме условные", "s1_t4_s3_q": "Где в этой цепи впервые растёт число молекул, передающих сигнал?", "s1_t4_s3_o1": "На ферменте, образующем цАМФ: одна его молекула — 10 молекул цАМФ", "s1_t4_s3_x1": "Верно. Фермент не расходуется, пока активен, и успевает провести много реакций. Следующая ферментативная ступень — протеинкиназа — умножает сигнал ещё раз. Это и называют усилением сигнала", "s1_t4_s3_o2": "На рецепторе: одна молекула лиганда активирует 10 рецепторов", "s1_t4_s3_x2": "Обычно одна молекула лиганда связывается с одним участком связывания одного рецептора. Число молекул растёт дальше, на ферментах", "s1_t4_s3_o3": "На G-белке: он связывает 10 молекул ГТФ одновременно", "s1_t4_s3_x3": "G-белок связывает одну молекулу ГТФ. Он передаёт сигнал ферменту, а число молекул растёт при работе фермента", "s1_t4_s3_o4": "Нигде: каждое звено передаёт сигнал одной молекуле следующего", "s1_t4_s3_x4": "Это верно для колонки А1, где ферментов нет. В колонке А2 ферменты образуют или изменяют много молекул", "s1_t4_s3_h1": "Какое звено цепи — фермент?", "s1_t4_s3_h2": "Сколько значков цАМФ на схеме приходится на одну молекулу фермента?", "s1_t4_s3_h3": "Один фермент — много молекул продукта", "s1_t4_s3_e": "Усиление — свойство цепей с ферментативными ступенями; оно не обязательно для каждого рецептора. У рецептора — ионного канала ферментативной ступени нет, хотя один открытый канал может пропускать до 100 миллионов ионов в секунду. Сила ответа зависит и от того, как быстро сигнал выключается: цАМФ разрушается ферментами, фосфатные группы снимаются с белков", "s1_t4_s3_bio": "27", "s1_t4_s4_cond": "Панель Б. Ацетилхолин действует на клетку скелетной мышцы и на клетку водителя ритма сердца", "s1_t4_s4_q": "Почему одна и та же молекула вызывает в этих клетках противоположные изменения мембранного потенциала?", "s1_t4_s4_o1": "Рецепторы разные: в мышце — канал (вход Na⁺), в сердце — G-белок и выход K⁺", "s1_t4_s4_x1": "Верно. Ответ определяется не лигандом самим по себе, а тем, какой рецептор и какая цепь событий есть в клетке. В мышечной клетке вход катионов делает внутреннюю сторону менее отрицательной, в клетке сердца выход K⁺ — более отрицательной", "s1_t4_s4_o2": "Ацетилхолин в клетках сердца превращается в другое вещество", "s1_t4_s4_x2": "Ацетилхолин действует на обе клетки, не превращаясь в другое вещество: он связывается с рецепторами на поверхности", "s1_t4_s4_o3": "В клетке сердца меньше ацетилхолина, поэтому эффект противоположный", "s1_t4_s4_x3": "Изменение концентрации лиганда меняет силу ответа, но не превращает деполяризацию в гиперполяризацию. Знак эффекта задан тем, какие ионы и в какую сторону проходят через открывшиеся каналы", "s1_t4_s4_o4": "Тормозящий ответ возникает потому, что клетке сердца нужен медленный ритм", "s1_t4_s4_x4": "Это объяснение через цель, а не через механизм. Знак эффекта следует из того, какой рецептор есть в мембране и какие каналы открываются в результате", "s1_t4_s4_h1": "Одинаковы ли рецепторы ацетилхолина в двух клетках?", "s1_t4_s4_h2": "Какой ион и в какую сторону проходит в каждой клетке?", "s1_t4_s4_h3": "Вход катиона и выход катиона сдвигают потенциал в разные стороны", "s1_t4_s4_e": "Одинаковый лиганд и даже одинаковый рецептор не гарантируют одинакового ответа: в разных клетках рецептор может быть связан с разными внутриклеточными цепями. С тем же мускариновым рецептором, что в клетках сердца, ацетилхолин в клетках слюнной железы вызывает секрецию. Для ответа важен весь набор белков клетки", "s1_t4_s4_bio": "28", "s1_t4_s5_cond": "Панель А. Сравниваются колонки А1 и А2. В А1 нет промежуточных звеньев, в А2 — четыре", "s1_t4_s5_q": "Какое утверждение о скорости ответа следует из модели?", "s1_t4_s5_o1": "А1 — за миллисекунды; время А2 зависит от скорости каждого звена", "s1_t4_s5_x1": "Верно. Каждое звено вносит своё время. Ответы, основанные на фосфорилировании уже имеющихся белков, развиваются за секунды и минуты; ответы, требующие синтеза новых белков, — за минуты и часы", "s1_t4_s5_o2": "Скорость ответа определяется только числом звеньев: каждое следующее звено добавляет одинаковое время", "s1_t4_s5_x2": "Звенья работают с разной скоростью. Время ответа зависит от скорости каждого звена, а не от простого счёта звеньев", "s1_t4_s5_o3": "А2 быстрее, потому что в нём есть усиление", "s1_t4_s5_x3": "Усиление увеличивает силу ответа, а не уменьшает время. Ответ рецептора-канала обычно развивается за миллисекунды, ответ А2 — дольше", "s1_t4_s5_o4": "Скорость одинакова: все ответы начинаются после связывания лиганда", "s1_t4_s5_x4": "Начинаются после связывания, но достигают изменения в клетке за разное время", "s1_t4_s5_h1": "Что должно произойти в А2, прежде чем изменится активность белков-мишеней?", "s1_t4_s5_h2": "Все ли звенья работают одинаково быстро?", "s1_t4_s5_h3": "Время зависит не от счёта звеньев, а от скорости каждого из них", "s1_t4_s5_e": "Утверждение «чем больше звеньев, тем медленнее ответ» часто выполняется, но это не закон: решающее значение имеет скорость каждого звена. Кроме того, важно не только, как быстро ответ возникает, но и как долго он длится после удаления лиганда. Это определяется временем существования активных звеньев цепи — продвинутый уровень этой вкладки показывает это на модели", "s1_t4_s5_bio": "27 29", "s1_t4_rev_q": "Лиганд Z вызывает ответ в клетке типа 1 и не вызывает в клетке типа 2. Измерение показало, что Z одинаково связывается с одним и тем же рецептором в обеих клетках (установлено по специфическому связыванию). Какие объяснения совместимы с этими данными?", "s1_t4_rev_o1": "В клетке типа 2 отсутствует или не работает одно из звеньев цепи после рецептора", "s1_t4_rev_x1": "Совместимо: связывание есть, но сигнал не проходит дальше", "s1_t4_rev_o2": "В клетке типа 2 рецептор связан с другой цепью, ответ которой мы не измеряли", "s1_t4_rev_x2": "Совместимо: ответ может быть, но иного рода. Нужно знать, что именно измеряли", "s1_t4_rev_o3": "В клетке типа 2 нет рецептора для Z", "s1_t4_rev_x3": "Несовместимо: по условию Z связывается с тем же рецептором в обеих клетках", "s1_t4_rev_o4": "Лиганд Z разрушается на поверхности клетки 2 до связывания", "s1_t4_rev_x4": "Несовместимо: по условию Z связывается с клеткой 2", "s1_t4_rev_e": "Чтобы различить объяснения, проверяют звенья по порядку: активируется ли G-белок или фермент рецептора, образуется ли посредник, меняется ли активность белков-мишеней. И отдельно — какие ответы клетки вообще измерялись", "s1_t4_expl": "Рецепторы клеточной поверхности преобразуют связывание внеклеточного лиганда во внутриклеточное событие. Рецептор — ионный канал меняет ионный поток и мембранный потенциал за миллисекунды. Рецептор, сопряжённый с G-белком, активирует G-белок (обмен ГДФ на ГТФ), тот — фермент или канал; фермент может образовать много молекул вторичного посредника, и сигнал усиливается. Рецептор с ферментативной активностью фосфорилирует себя и внутриклеточные белки, запуская каскад киназ. Связывание лиганда не гарантирует ответа: нужен каждый элемент цепи. Ответ на один и тот же лиганд определяется набором рецепторов и внутриклеточных белков данной клетки. Скорость и продолжительность ответа зависят от скоростей включения и выключения звеньев, а не только от их числа", "s1_t4_limits": "Модель не показывает время: на продвинутом уровне эта вкладка показывает временные профили. Цепи упрощены: в клетках звеньев больше, цепи ветвятся и влияют друг на друга. Не показаны рецепторы внутри клетки (например, для стероидных гормонов, которые проходят через бислой), механизмы выключения рецепторов, перемещение рецепторов внутрь клетки, а также то, что в разных клетках число рецепторов различно. В модели каждый активный рецептор активирует один G-белок — это упрощение: усиление возможно и на этой ступени, если одна активная молекула активирует много копий следующего белка. Число молекул цАМФ на схеме условное", "s1_t4_title": "4. Лиганд-рецепторные взаимодействия и клеточная сигнализация", "s1_t4_pre": "<b>Рецептор</b> — белок, который специфически связывает сигнальную молекулу и в ответ меняет свою конформацию и активность. Сигнальную молекулу, которая связывается с рецептором, называют <b>лигандом</b>. <b>Специфичность</b> — способность рецептора связывать определённый лиганд (или группу сходных молекул) и не связывать другие.\nРецепторы клеточной поверхности делят на три класса по способу передачи сигнала через мембрану. <b>Рецептор — ионный канал</b> (ионотропный рецептор): связывание лиганда открывает канал в самом рецепторе, ионы проходят через него по своему электрохимическому градиенту, и мембранный потенциал меняется. <b>Рецептор, сопряжённый с G-белком</b>: активированный рецептор вызывает обмен ГДФ на ГТФ в G-белке — белке на внутренней стороне мембраны; G-белок с ГТФ активирует фермент или канал; когда G-белок гидролизует ГТФ до ГДФ, он выключается. Фермент может образовывать <b>вторичный посредник</b> — малую молекулу, которая передаёт сигнал дальше внутри клетки, например циклический АМФ (цАМФ). <b>Рецептор с ферментативной активностью</b> (или связанный с ферментом): связывание лиганда активирует ферментативную часть рецептора; у рецепторных тирозинкиназ рецепторы сближаются и фосфорилируют друг друга, а затем — внутриклеточные белки.\n<b>Усиление сигнала</b> возникает там, где одна активированная молекула фермента образует много молекул продукта: например, много молекул вторичного посредника.", "s1_t4_cond": "Объект — плазматические мембраны условных клеток. Панель А: три рецептора и цепи событий от связывания лиганда до ответа; можно убрать любое звено цепи. Показания — есть ли ответ, через сколько промежуточных звеньев он возникает и есть ли звено усиления. Панель Б: одна сигнальная молекула — ацетилхолин — и две клетки: клетка скелетной мышцы и клетка водителя ритма сердца. Число молекул на схеме условное: оно показывает, где количество молекул растёт", "s1_t4_a_lig": "Лиганд", "s1_t4_a_g": "G-белок", "s1_t4_a_ac": "Фермент, образующий цАМФ", "s1_t4_a_pka": "Протеинкиназа A", "s1_t4_a_dim": "Второй рецептор рядом", "s1_t4_a_resp": "Ответ", "s1_t4_a_steps": "Промежуточных звеньев между рецептором и ответом", "s1_t4_a_amp": "Звено усиления", "s1_t4_a_cut": "Лиганд связан, рецептор активен, но сигнал не проходит дальше звена N", "s1_t4_a_note": "Цепи упрощены: в клетках звеньев больше, и цепи ветвятся", "s1_t4_b_swap": "Поменять рецепторы местами", "s1_t4_b_swap_note": "Мысленный эксперимент модели: ответ определяют рецептор и цепь в клетке, а не сам лиганд", "s1_t4_how_text": "Концентрацию цАМФ в живой клетке измеряют с помощью генетически кодируемых флуоресцентных датчиков. Датчик — белок, состоящий из участка, связывающего цАМФ, и двух флуоресцентных белков. При связывании цАМФ конформация датчика меняется, расстояние между флуоресцентными белками изменяется, и соотношение их свечения сдвигается. По этому соотношению следят, как цАМФ растёт после добавления лиганда и снижается после его удаления, в отдельных клетках и даже в отдельных участках клетки", "s1_int_cell": "Условная клетка эпителия. В её плазматической мембране: Na⁺/K⁺-АТФаза; обычные пути утечки Na⁺ в клетку; Na⁺-зависимый симпортер вещества X; другой Na⁺-зависимый переносчик — для вещества Y; аквапорины; рецептор гормона H, сопряжённый с G-белком. Цепь гормона: H → рецептор → G-белок → фермент → цАМФ → протеинкиназа → повышение активности переносчика X. X — крупная полярная молекула: через бислой без белков она практически не проходит, и её перенос в клетку идёт только через переносчик X. Запас мощности насоса покрывает небольшой дополнительный вход Na⁺, но не многократное увеличение утечки. В норме поток X внутрь — 100 условных единиц; после добавления гормона H он растёт", "s1_int_limits": "Это учебная клетка с заданными связями. В реальной клетке одно нарушение вызывает цепь последствий: например, при недостатке АТФ меняются и мембранный потенциал, и объём клетки, и многие другие процессы. Таблица показаний упрощена до «норма / изменено». Связь протеинкиназы с переносчиком X — допущение модели", "s1_intro": "На этой странице четыре учебные модели мембраны. В каждой вкладке сначала прочитайте условия и сделайте прогноз, затем измените условия модели и сравните наблюдение с прогнозом, затем объясните результат. Для работы нужны школьные знания: что такое молекула и ион, электрический заряд, концентрация раствора, липиды и белки. Новые понятия вводятся в тексте перед задачей, а их определения есть в словаре на странице «Объяснения»", "s1_int_title": "Итоговая задача. Почему изменился поток вещества через мембрану?", "s1_int_assume": "В этой учебной клетке протеинкиназа повышает активность переносчика X. Такая связь задана условием задачи; в клетках регуляция переносчиков устроена по-разному", "s1_int_obsA_t": "Наблюдение А.", "s1_int_obsA": "В покое поток X внутрь клетки снизился примерно до четверти исходного", "s1_int_obsB_t": "Наблюдение Б.", "s1_int_obsB": "В покое поток X исходный, но после добавления гормона H он не увеличивается", "s1_int_cause_barrier": "Бислой стал менее плотно упакован (изменился липидный состав)", "s1_int_cause_no_carrier": "Переносчика X в мембране мало или нет", "s1_int_cause_gradient": "Уменьшилась электрохимическая движущая сила для Na⁺: увеличилась утечка Na⁺ в клетку, а мощности насоса не хватает", "s1_int_cause_atp": "Нарушено энергоснабжение: в клетке мало АТФ, насос работает медленнее", "s1_int_cause_uncoupled": "Нарушено сопряжение: переносчик X пропускает Na⁺, но X не переносит", "s1_int_cause_receptor": "Нарушена передача сигнала гормона H до образования цАМФ (например, нет функционального G-белка)", "s1_int_cause_pka_link": "Протеинкиназа A не действует на переносчик X (например, изменён участок переносчика, который она фосфорилирует)", "s1_int_meas_Na_in": "Na⁺ в цитоплазме", "s1_int_meas_ATP": "АТФ в клетке", "s1_int_meas_carrier_amount": "Количество переносчика X в мембране", "s1_int_meas_Y_flux": "Поток Y через другой Na⁺-зависимый переносчик", "s1_int_meas_Na_via_X": "Поток Na⁺ через переносчик X", "s1_int_meas_O2_flux": "Поток O₂ через мембрану", "s1_int_meas_cAMP_after_hormone": "цАМФ после гормона H", "s1_int_meas_X_after_hormone": "Поток X после гормона H", "s1_int_maxmeas": "Можно выбрать не больше трёх измерений: в реальном исследовании каждое измерение требует времени и материала", "s1_int_p1": "Отметьте причины, которые могли бы вызвать наблюдение. Не отбрасывайте причину, если не можете объяснить, почему она несовместима с наблюдением", "s1_int_p1_barrier": "Изменение упаковки липидов меняет перенос воды и неполярных веществ, но X — полярное вещество, которое и в норме проходит через бислой лишь в ничтожной степени. Его поток идёт через переносчик и упаковкой бислоя в этой модели не определяется. Для наблюдения А эта причина несовместима", "s1_int_p1_receptor": "Нарушение передачи сигнала гормона (до цАМФ или после него) не меняет поток X в покое, пока гормон не добавлен. Эти причины совместимы с наблюдением Б, но не с наблюдением А", "s1_int_p2": "Что уже известно из условия? Запишите для себя: какое звено точно работает, а про какое ничего не известно", "s1_int_p3": "Выберите измерения. Подумайте заранее: какой результат исключит какую причину?", "s1_int_p4": "Исключите причины, несовместимые с показаниями", "s1_int_p5": "Можно ли назвать одну причину?", "s1_int_more": "Какое измерение различило бы оставшиеся причины?", "s1_int_e_Na_in": "Na⁺ в цитоплазме повышен — значит, градиент Na⁺ уменьшен. Это совместимо с недостатком АТФ и с увеличенной утечкой; нормальный Na⁺ исключает обе эти причины", "s1_int_e_ATP": "АТФ снижен — совместимо только с нарушением энергоснабжения. Нормальный АТФ при повышенном Na⁺ указывает на утечку, а не на энергоснабжение", "s1_int_e_carrier": "Количество переносчика снижено — совместимо только с его отсутствием. Нормальное количество не исключает того, что переносчик есть, но работает неправильно", "s1_int_e_Y": "Поток Y через другой Na⁺-зависимый переносчик тоже снижен — значит, нарушено общее для них звено: градиент Na⁺. Если поток Y в норме, градиент в порядке, и причина — в самом переносчике X", "s1_int_e_NaX": "Na⁺ через переносчик X идёт, а X — нет: сопряжение нарушено. Если и Na⁺ через переносчик X не идёт, переносчика нет или нет движущей силы", "s1_int_e_O2": "Поток O₂ отражает свойства бислоя. Его изменение не объясняет снижения потока X, а норма не говорит ничего о переносчиках", "s1_int_e_cAMP": "Если цАМФ после гормона не растёт, нарушено звено до фермента включительно: рецептор, G-белок или фермент. Если цАМФ растёт, а поток X нет, нарушено звено после цАМФ — действие протеинкиназы на переносчик — или сам переносчик", "s1_int_e_insuff": "Выбранные измерения согласуются с несколькими причинами. Это не ошибка рассуждения: так бывает и в исследовании. Вывод — «данных недостаточно», а следующий шаг — измерение, которое различает оставшиеся причины", "s1_c2_cond": "В мембране клетки должен идти поток иона Y через каналы, но результирующего потока Y нет", "s1_c2_e_single": "Ток при сдвиге потенциала означает, что каналы открыты и до сдвига ионы шли в обе стороны поровну", "s1_c2_e_grad": "Нулевой градиент объясняет отсутствие потока при открытых каналах; ненулевой — указывает на отсутствие пути", "s1_c2_e_tracer": "Метка проходит при равновесии и не проходит, если пути нет", "s1_c2_end": "Любое из трёх измерений различает причины: нулевой результирующий поток бывает и при равновесии, и при отсутствии пути", "s1_c3_cond": "Na⁺-зависимый перенос вещества X в клетку снижен до 20 % исходного. Насос не останавливали", "s1_c3_e_grad": "Сниженный градиент указывает на утечку; исходный — на переносчик или нехватку X", "s1_c3_e_Y": "Поток Y — свидетель градиента: он снижается только при нарушении градиента", "s1_c3_e_X": "Количество X различает нехватку вещества и нарушение переносчика", "s1_c3_e_A": "Расход АТФ одинаков во всех трёх случаях и причин не различает", "s1_c3_end": "Чтобы различить три причины, нужны два измерения: одно — свидетель градиента (градиент или поток Y), другое — количество X снаружи", "s1_c4_cond": "Лиганд связывается с рецептором, сопряжённым с G-белком, но ответа клетки нет", "s1_c4_e_g": "Если G-белок не активируется, нарушение — в нём (рецептор связывает лиганд по условию)", "s1_c4_e_camp": "Рост цАМФ показывает, что G-белок и фермент работают; нарушение — после цАМФ", "s1_c4_e_p": "Отсутствие фосфорилирования мишеней ожидается при любой из трёх причин и их не различает", "s1_c4_end": "Нужны два измерения — активация G-белка и цАМФ: вместе они однозначно указывают на нарушенное звено. Одно измерение цАМФ оставляет неразличимыми G-белок и фермент", "s1_a1_s1_cond": "А — ненасыщенные хвосты, без холестерина. Б — насыщенные хвосты, без холестерина (гель). Вещество — вода", "s1_a1_s1_q": "Как различаются мембраны по упорядоченности хвостов и проницаемости для воды?", "s1_a1_s1_o1": "Б упорядоченнее и пропускает воду медленнее", "s1_a1_s1_x1": "Верно. В геле хвосты прямые и плотно упакованы: бислой менее текуч, и воде труднее пройти через его середину. Здесь оба свойства меняются в одну сторону, потому что у них общая причина — упаковка хвостов. Это ещё не значит, что они всегда меняются вместе: смотрите следующие шаги", "s1_a1_s1_o2": "Б упорядоченнее, но воду пропускает так же: вода проходит через любой бислой", "s1_a1_s1_x2": "Вода проходит через любой бислой, но скорость зависит от упаковки. В экспериментах проницаемость для воды бислоя в состоянии геля была в сотни раз меньше, чем у жидкого", "s1_a1_s1_o3": "Б пропускает воду медленнее, а упорядоченность хвостов в мембранах одинакова", "s1_a1_s1_x3": "Гель — самое упорядоченное состояние бислоя: хвосты прямые и плотно упакованы", "s1_a1_s1_o4": "Мембраны одинаковы: число липидов в них равно", "s1_a1_s1_x4": "Одинаковое число липидов не означает одинаковой упаковки: она зависит от строения хвостов и температуры", "s1_a1_s1_h1": "Чем отличаются хвосты в мембранах?", "s1_a1_s1_h2": "В каком состоянии мембрана Б?", "s1_a1_s1_h3": "Плотная упаковка — и меньше текучесть, и труднее проход воды", "s1_a1_s1_e": "Совпадение направлений не доказывает, что одно свойство вызывает другое: оба зависят от упаковки. Различить их помогают условия, при которых они расходятся (шаги 2–3)", "s1_a1_s1_bio": "7", "s1_a1_s2_cond": "Обе мембраны в жидком неупорядоченном состоянии: ненасыщенные хвосты, без холестерина. В мембране А хвосты короче, в мембране Б — длиннее. Показания скрыты до ответа", "s1_a1_s2_q": "Что покажет модель?", "s1_a1_s2_o1": "Упорядоченность одинакова, а вода через Б проходит медленнее", "s1_a1_s2_x1": "Верно. В модели длина хвостов не меняет упорядоченности жидкого бислоя (это допущение модели), а для проницаемости толщина неполярной середины важна: путь через неё длиннее. В экспериментах проницаемость жидких бислоёв снижалась при увеличении длины хвостов. Здесь свойства расходятся", "s1_a1_s2_o2": "Б упорядоченнее и пропускает воду медленнее: длинные хвосты всегда уплотняют упаковку", "s1_a1_s2_x2": "Длинные хвосты сильнее взаимодействуют и могут снижать текучесть, но в модели обе мембраны жидкие, и упорядоченность от длины не зависит. Проницаемость же зависит от толщины и в жидком бислое", "s1_a1_s2_o3": "Обе мембраны одинаковы по обоим показателям", "s1_a1_s2_x3": "В жидком бислое толщина неполярной середины — главный фактор проницаемости. Мембраны различаются толщиной, значит различаются и проницаемостью", "s1_a1_s2_o4": "Вода через Б проходит быстрее: в толстом бислое больше места", "s1_a1_s2_x4": "Середина бислоя неполярна, и чем она толще, тем дальше молекуле воды идти через невыгодную для неё среду", "s1_a1_s2_h1": "Обе мембраны жидкие. Что тогда различается?", "s1_a1_s2_h2": "От чего зависит путь молекулы воды поперёк бислоя?", "s1_a1_s2_h3": "Толщина влияет на проницаемость, а в модели — не на упорядоченность", "s1_a1_s2_e": "Это первый случай, когда проницаемость меняется, а упорядоченность — нет. Он показывает, что проницаемость определяется не только текучестью", "s1_a1_s2_bio": "7", "s1_a1_s3_cond": "В обе мембраны добавили холестерин — около 15 % молекул. А — ненасыщенные хвосты (жидкий бислой). Б — насыщенные хвосты (без холестерина — гель). Вещество — вода. Показания скрыты до ответа", "s1_a1_s3_q": "Как изменится проницаемость для воды каждой мембраны?", "s1_a1_s3_o1": "В А немного снизится, в Б повысится", "s1_a1_s3_x1": "Верно. В жидком бислое холестерин уплотняет упаковку, и проницаемость немного снижается. В геле он мешает хвостам кристаллизоваться: часть бислоя переходит в жидкое упорядоченное состояние, и вода проходит легче, чем через гель. Направление эффекта зависит от исходного состояния", "s1_a1_s3_o2": "В обеих снизится: холестерин делает мембрану менее проницаемой", "s1_a1_s3_x2": "Это верно для жидкого бислоя. Для геля — наоборот: в экспериментах добавление холестерина к бислою в состоянии геля повышало проницаемость", "s1_a1_s3_o3": "В обеих повысится: холестерин разрыхляет упаковку", "s1_a1_s3_x3": "В жидком бислое холестерин упаковку уплотняет. Разрыхляющее действие проявляется только по сравнению с гелем", "s1_a1_s3_o4": "Не изменится: холестерин влияет на упорядоченность, а не на проницаемость", "s1_a1_s3_x4": "Холестерин влияет на оба свойства, потому что меняет упаковку хвостов", "s1_a1_s3_h1": "В каком состоянии каждая мембрана до добавления холестерина?", "s1_a1_s3_h2": "Что холестерин делает с жидким бислоем, а что — с гелем?", "s1_a1_s3_h3": "Один и тот же компонент, разные исходные состояния — разные направления", "s1_a1_s3_e": "Утверждение «холестерин снижает проницаемость мембраны» верно для жидких бислоёв, похожих на плазматическую мембрану животной клетки, но неверно как общее правило. Описывая эффект холестерина, всегда указывают состав мембраны и температуру. В модели при 30 % холестерина бислой Б становится жидким упорядоченным, и проницаемость растёт дальше; в экспериментах при 30 % гель и жидкое упорядоченное состояние ещё сосуществуют, а проницаемость примерно на порядок выше, чем у геля, получена при 45 % холестерина", "s1_a1_s3_bio": "4 7", "s1_a1_s4_cond": "Те же мембраны (А — жидкий бислой с холестерином, Б — гель и жидкий упорядоченный бислой). Вещество заменили на Na⁺. Белкового пути нет", "s1_a1_s4_q": "Чем различаются мембраны по проницаемости для Na⁺?", "s1_a1_s4_o1": "Ничем: обе его практически не пропускают", "s1_a1_s4_x1": "Верно. Упаковка меняет условия для небольших незаряженных молекул, а для иона барьер — сама неполярная середина, которая есть в любом состоянии бислоя. Поэтому изменения упаковки, заметные для воды, на ионы практически не влияют", "s1_a1_s4_o2": "Б пропускает Na⁺ лучше, потому что воду она теперь пропускает лучше", "s1_a1_s4_x2": "Вода и ион проходят через бислой по-разному: вода — небольшая незаряженная молекула, а ион несёт заряд и гидратную оболочку. Для иона ни одно состояние бислоя не открывает пути", "s1_a1_s4_o3": "А пропускает Na⁺ лучше, потому что она текучее", "s1_a1_s4_x3": "Текучесть не создаёт водного пути через середину бислоя. Барьер для иона сохраняется", "s1_a1_s4_o4": "Нельзя сказать, не измерив", "s1_a1_s4_x4": "Для иона ответ следует из свойств бислоя: неполярная середина практически непроницаема для заряженных частиц при любой упаковке", "s1_a1_s4_h1": "Чем ион отличается от молекулы воды?", "s1_a1_s4_h2": "Есть ли у иона путь через бислой в каком-либо из состояний?", "s1_a1_s4_h3": "Для иона барьер — сама неполярная середина", "s1_a1_s4_e": "Изменение организации бислоя может существенно менять поведение одних веществ (воды, неполярных молекул), не устраняя барьера для других (ионов). Поэтому текучесть и проницаемость — разные свойства, и проницаемость к тому же разная для разных веществ", "s1_a1_s4_bio": "7", "s1_a1_s5_cond": "В обе мембраны встроили открытые каналы для Na⁺ в одинаковом числе", "s1_a1_s5_q": "Как различаются теперь мембраны по переносу Na⁺?", "s1_a1_s5_o1": "В модели не различаются: число каналов одинаково", "s1_a1_s5_x1": "Верно для этой модели: Na⁺ идёт через каналы, и по правилам модели состояние бислоя на работу канала не влияет. В клетках липидное окружение может влиять на работу белков (<a href=\"seminar-1-route.html#bio-1-8\" target=\"_blank\" rel=\"noopener\">«Как липидное окружение влияет на работу мембранных белков»</a>), но это отдельный механизм — влияние на белок, а не на проницаемость самого бислоя", "s1_a1_s5_o2": "В А перенос больше, потому что жидкий бислой проницаемее", "s1_a1_s5_x2": "Na⁺ проходит через канал, а не через бислой. Проницаемость бислоя для ионов в обеих мембранах практически нулевая", "s1_a1_s5_o3": "В Б перенос меньше: упорядоченный бислой сжимает каналы", "s1_a1_s5_x3": "В модели такого правила нет. Влияние липидов на белки существует, но без данных о конкретном канале утверждать его нельзя", "s1_a1_s5_o4": "Переноса нет в обеих: бислой непроницаем для ионов", "s1_a1_s5_x4": "Каналы создают белковый путь в обход неполярной середины", "s1_a1_s5_h1": "Через что теперь идёт Na⁺?", "s1_a1_s5_h2": "Зависит ли в модели перенос через белок от состояния бислоя?", "s1_a1_s5_h3": "Одинаковое число каналов — одинаковый перенос по правилам модели", "s1_a1_s5_e": "Ионный поток через мембрану клетки определяется прежде всего белками и электрохимическим градиентом. Липидный состав может косвенно менять его, влияя на конформацию и работу каналов, — в этой модели такой механизм не рассматривается", "s1_a1_s5_bio": "8", "s1_a1_rev1_cond": "В двух мембранах без аквапоринов измерили водную проницаемость: в мембране 2 она в несколько раз меньше, чем в мембране 1. Поток Na⁺ в обеих мембранах практически одинаков", "s1_a1_rev1_q": "Какие причины совместимы с наблюдением?", "s1_a1_rev1_o1": "Мембрана 2 упакована плотнее (насыщенные хвосты, больше холестерина в жидком бислое) или находится в другом фазовом состоянии", "s1_a1_rev1_x1": "Совместимо: упаковка меняет прохождение воды через бислой и не меняет перенос иона", "s1_a1_rev1_o2": "Неполярная середина мембраны 2 толще", "s1_a1_rev1_x2": "Совместимо: в жидком бислое толщина неполярной середины влияет на водную проницаемость", "s1_a1_rev1_o3": "Поток Na⁺ в обеих мембранах определяется белковыми путями и градиентом (или в обеих практически отсутствует)", "s1_a1_rev1_x3": "Совместимо: поток ионов определяется белками и градиентом, а не упаковкой бислоя", "s1_a1_rev1_o4": "Мембрана 2 стала пропускать ионы через бислой", "s1_a1_rev1_x4": "Несовместимо: тогда поток Na⁺ различался бы", "s1_a1_rev1_o5": "В мембране 2 хвосты обязательно упорядоченнее", "s1_a1_rev1_x5": "Не обязательно: проницаемость может различаться при одинаковой упорядоченности, если различается толщина середины (шаг 2)", "s1_a1_rev1_h1": "Какие свойства бислоя влияют на прохождение воды, а какие — на ион?", "s1_a1_rev1_h2": "Может ли проницаемость различаться при одинаковой упорядоченности?", "s1_a1_rev1_h3": "Ион идёт через белок — его поток отвечает за белки, а не за упаковку", "s1_a1_rev2_cond": "В двух мембранах без аквапоринов измерили водную проницаемость: в мембране 2 она в несколько раз меньше, чем в мембране 1. Поток Na⁺ в обеих мембранах практически одинаков", "s1_a1_rev2_q": "Какие дополнительные сведения позволят различить гипотезы?", "s1_a1_rev2_o1": "Липидный состав и доля холестерина каждой мембраны", "s1_a1_rev2_x1": "Да: это прямо проверяет гипотезы об упаковке", "s1_a1_rev2_o2": "Измерение упорядоченности хвостов в обеих мембранах", "s1_a1_rev2_x2": "Да: если упорядоченность одинакова, различие скорее связано с толщиной середины (в модели это так по допущению); если разная — с упаковкой или фазовым состоянием", "s1_a1_rev2_o3": "Есть ли в мембранах каналы для Na⁺ и одинаково ли их число", "s1_a1_rev2_x3": "Да: так объясняется одинаковый поток ионов", "s1_a1_rev2_o4": "Поток Na⁺ при другой температуре", "s1_a1_rev2_x4": "Он мало что скажет о различии бислоёв: через бислой ионы практически не проходят при любой температуре, а через каналы — по своим правилам", "s1_a1_rev2_h1": "Какие свойства бислоя влияют на прохождение воды, а какие — на ион?", "s1_a1_rev2_h2": "Может ли проницаемость различаться при одинаковой упорядоченности?", "s1_a1_rev2_h3": "Ион идёт через белок — его поток отвечает за белки, а не за упаковку", "s1_a1_new": "Бислой может находиться в разных <b>фазовых состояниях</b>. В <b>жидком неупорядоченном</b> состоянии хвосты липидов изогнуты и подвижны. В <b>геле</b> хвосты прямые, плотно упакованы и почти не перемещаются. Холестерин вместе с насыщенными липидами создаёт <b>жидкое упорядоченное</b> состояние: хвосты выпрямлены и упакованы плотно, но липиды продолжают перемещаться в плоскости слоя.\nСкорость, с которой небольшая незаряженная молекула проходит через бислой, зависит от того, насколько ей трудно войти в его неполярную середину и пройти её. В плотно упакованном бислое это труднее. Чем толще неполярная середина, тем длиннее путь. Наибольшие изменения проницаемости наблюдаются при переходе бислоя из одного фазового состояния в другое.\nИон не входит в неполярную середину ни в каком её состоянии: этому мешают его заряд и гидратная оболочка. Поэтому изменение упаковки липидов меняет перенос воды и неполярных молекул, а барьер для ионов — нет.\nВ этом исследовании текучесть бислоя оценивают по <b>упорядоченности хвостов</b>: чем хвосты упорядоченнее, тем бислой менее текуч в этом смысле (так её и измеряют в экспериментах с искусственными бислоями). Упорядоченность хвостов — не то же, что латеральная подвижность липидов: холестерин в жидком бислое повышает упорядоченность, почти не меняя подвижности (вкладка 1, шаг 3).", "s1_a1_cond": "Две условные мембраны — А и Б — из фосфолипидов, без белков, если белковый путь не добавлен. Температура одинаковая и постоянная (условно «комнатная», около 20 °C). Для каждой мембраны задаются состав и длина хвостов (толщина неполярной середины); для обеих — переносимое вещество и наличие белкового пути. Показания: состояние бислоя, упорядоченность хвостов (условная шкала 0–5), проницаемость для воды (условная шкала 1–5), для Na⁺ — отдельная надпись, и перенос через белковый путь, если он есть", "s1_a1_rules": "1. Состояние: ненасыщенные хвосты без холестерина или с 15 % — «жидкий неупорядоченный»; ненасыщенные с 30 % — «жидкий упорядоченный»; насыщенные без холестерина — «гель»; насыщенные с 15 % — «гель и жидкий упорядоченный сосуществуют»; насыщенные с 30 % — «жидкий упорядоченный». Для насыщенных хвостов с 30 % это упрощение модели: в экспериментах при 15 и 30 % холестерина гель и жидкое упорядоченное состояние сосуществуют, а полностью жидкое упорядоченное состояние при 30 % получено только в расчётной модели.\n2. Упорядоченность хвостов (0–5): жидкий неупорядоченный — 1 (с 15 % холестерина — 2); жидкий упорядоченный — 4; сосуществование — 4; гель — 5. Длина хвостов на упорядоченность в модели не влияет (допущение).\n3. Проницаемость бислоя для воды (1–5): жидкий неупорядоченный — 5 при коротких хвостах, 4 при длинных, с 15 % холестерина — на 1 меньше; жидкий упорядоченный — 3 (при длинных — 2); сосуществование — 2 (при длинных — 1); гель — 1. Каждый переход «жидкий неупорядоченный → жидкий упорядоченный → гель» в экспериментах менял проницаемость для воды примерно на порядок; шкала модели — условная и это соотношение не воспроизводит.\n4. Na⁺ через бислой — «практически не проходит» при любом состоянии.\n5. Белковый путь: перенос через белок одинаков в обеих мембранах, независимо от состояния бислоя (допущение).", "s1_a1_expl": "Текучесть бислоя и его проницаемость зависят от упаковки хвостов, поэтому часто меняются в одну сторону. Но это разные свойства. Проницаемость для небольших незаряженных молекул зависит ещё и от толщины неполярной середины. Холестерин уплотняет жидкий бислой и немного снижает его проницаемость, но в геле нарушает кристаллическую упаковку и повышает её. Для ионов барьер создаёт сама неполярная середина, и никакое изменение упаковки этого барьера не устраняет: ионы проходят через белки. Количественной зависимости проницаемости от текучести, одинаковой для всех веществ и мембран, нет: в модели уровни условные", "s1_a1_data": "Проницаемость искусственных липидных пузырьков для воды и небольших молекул (муравьиная и молочная кислоты, глицерин) измерили при 20 °C для бислоёв разного состава. В жидких бислоях проницаемость снижалась с увеличением длины хвостов — то есть толщины неполярной середины. Самые большие различия возникали при смене фазового состояния: в ряду «жидкий неупорядоченный → жидкий упорядоченный → гель» каждый переход снижал проницаемость для воды и слабых кислот примерно на порядок, а бислой из насыщенных липидов в состоянии геля пропускал воду примерно в 200 раз медленнее, чем жидкий бислой из ненасыщенных липидов. Холестерин, добавленный к жидкому бислою, немного снижал проницаемость. К бислою в состоянии геля — повышал её: уже около 15 % холестерина ускоряли проход муравьиной кислоты примерно в 15 раз (при этом в бислое сосуществуют гель и жидкое упорядоченное состояние), при 30 % гель и жидкое упорядоченное состояние по-прежнему сосуществовали, а при 45 % холестерина проницаемость была примерно на порядок выше, чем у бислоя без холестерина. Проницаемость упорядоченных бислоёв из насыщенных липидов со стеролами оказалась сравнима с проницаемостью плазматической мембраны дрожжей, липиды которой, по данным авторов, сильно упорядочены. Эти данные получены на искусственных бислоях; в клетках бислой содержит много разных липидов и белков", "s1_a1_how": "Пузырьки из липидов заполняют флуоресцентным красителем, свечение которого гасится тем сильнее, чем выше его концентрация. Пузырьки быстро смешивают с концентрированным раствором: вода выходит, пузырёк сжимается, концентрация красителя растёт, и свечение падает. Скорость падения свечения в первые доли секунды даёт проницаемость для воды. Если раствор содержит проникающее вещество, пузырёк сначала сжимается, а затем снова набухает по мере того, как вещество входит внутрь, — по скорости набухания определяют проницаемость для этого вещества", "s1_a1_limits": "Уровни 0–5 условные и не переводятся в измеренные коэффициенты проницаемости. Модель не учитывает разные виды липидов в одной мембране, белки и их влияние на упаковку, асимметрию двух слоёв, участки с разной упорядоченностью в одной мембране, температурные переходы. Допущение «белок работает одинаково в любом бислое» — упрощение: работа многих мембранных белков зависит от липидного окружения", "s1_a1_title": "И1. Две мембраны: упорядоченность хвостов и проницаемость меняются не вместе", "s1_a1_state": "Состояние", "s1_a1_ord": "Упорядоченность хвостов", "s1_a1_perm": "Проницаемость для воды через бислой", "s1_a1_na": "практически не проходит при любом состоянии бислоя", "s1_a1_protein": "перенос идёт через белок; в модели он одинаков в обеих мембранах", "s1_a1_lip": "Фосфолипиды", "s1_a1_lip_unsat": "ненасыщенные хвосты", "s1_a1_lip_sat": "насыщенные хвосты", "s1_a1_chol": "Холестерин", "s1_a1_chol_0": "нет", "s1_a1_chol_15": "немного (около 15 % молекул)", "s1_a1_chol_30": "много (около 30 %)", "s1_a1_len": "Длина хвостов", "s1_a1_len_short": "короче", "s1_a1_len_long": "длиннее", "s1_a1_subst": "Вещество", "s1_a1_subst_H2O": "вода", "s1_a1_subst_Na": "Na⁺", "s1_a1_path": "Белковый путь", "s1_a1_path_none": "нет", "s1_a1_path_prot": "есть", "s1_a2_s1_cond": "K⁺: снаружи 2, внутри 8; потенциал 0; P = 1", "s1_a2_s1_q": "Сколько переходов в каждую сторону и каков результирующий поток?", "s1_a2_s1_o1": "Внутрь 20, наружу 80, итог −60", "s1_a2_s1_x1": "Верно: 10 × 1 × 2 × 1 = 20 и 10 × 1 × 8 × 1 = 80. При нулевом потенциале действует только концентрационный вклад, и он направлен наружу", "s1_a2_s1_o2": "Внутрь 0, наружу 60", "s1_a2_s1_x2": "Ионы попадают в канал с обеих сторон: снаружи их меньше, но они есть. Результирующий поток −60 складывается из двух однонаправленных: 20 внутрь и 80 наружу", "s1_a2_s1_o3": "Внутрь 80, наружу 20", "s1_a2_s1_x3": "Направления перепутаны: внутри K⁺ больше, поэтому переходов наружу больше", "s1_a2_s1_o4": "Внутрь 40, наружу 40", "s1_a2_s1_x4": "Это было бы равновесие. При нулевом потенциале электрический множитель равен 1, и переходы определяются только концентрациями", "s1_a2_s1_h1": "Подставьте числа в правило модели", "s1_a2_s1_h2": "Чему равен электрический множитель при потенциале 0?", "s1_a2_s1_h3": "10 × 1 × 2 и 10 × 1 × 8", "s1_a2_s1_e": "Однонаправленные потоки есть всегда, когда открыт путь и по обе стороны есть ионы. Результирующий поток — их разность", "s1_a2_s1_bio": "13", "s1_a2_s2_cond": "Те же концентрации; потенциал «внутри отрицательнее». В этой модели такой потенциал как раз равновесный для K⁺ при отношении концентраций 1 : 4", "s1_a2_s2_q": "Что изменится?", "s1_a2_s2_o1": "40 и 40; итог 0, переходы идут", "s1_a2_s2_x1": "Верно: 10 × 1 × 2 × 2 = 40 и 10 × 1 × 8 × 0,5 = 40. Отрицательный потенциал облегчил вход катиона и затруднил выход ровно настолько, чтобы потоки сравнялись. Это динамическое равновесие", "s1_a2_s2_o2": "Переходов нет: равновесие означает, что ионы стоят", "s1_a2_s2_x2": "Счётчики показывают 40 и 40. При равновесии исчезает результирующий поток, а не переходы", "s1_a2_s2_o3": "Внутрь 80, наружу 20", "s1_a2_s2_x3": "Это расчёт для одинаковых концентраций 4 и 4. Здесь снаружи 2, внутри 8", "s1_a2_s2_o4": "Внутрь 40, наружу 80; поток −40", "s1_a2_s2_x4": "Электрический множитель действует на оба направления: облегчает вход (×2) и затрудняет выход (×0,5)", "s1_a2_s2_h1": "Как отрицательный потенциал меняет множители для катиона?", "s1_a2_s2_h2": "Вход ×2, выход ×1/2", "s1_a2_s2_h3": "2 × 2 = 4 и 8 × 0,5 = 4", "s1_a2_s2_e": "Нулевой результирующий поток при открытом канале означает нулевой электрохимический градиент, а не остановку ионов. В покое многих клеток K⁺ находится близко к такому состоянию", "s1_a2_s2_bio": "12 13", "s1_a2_s3_cond": "Те же условия, но P увеличили с 1 до 3 — открылось втрое больше каналов. Счётчики скрыты до ответа", "s1_a2_s3_q": "Что покажут счётчики?", "s1_a2_s3_o1": "Внутрь 120, наружу 120, результирующий 0", "s1_a2_s3_x1": "Верно. Проницаемость увеличила оба однонаправленных потока втрое, но не создала результирующего: движущая сила по-прежнему нулевая. Проницаемость меняет скорость обмена, но не направление переноса", "s1_a2_s3_o2": "Внутрь 120, наружу 40: каналов стало больше, и ионы пошли внутрь", "s1_a2_s3_x2": "Каналов стало больше для обоих направлений одинаково. Направление задаёт градиент, а он не изменился", "s1_a2_s3_o3": "Внутрь 40, наружу 40: число каналов при равновесии не важно", "s1_a2_s3_x3": "Число переходов зависит от числа каналов. Не зависит только результирующий поток, пока движущая сила нулевая", "s1_a2_s3_o4": "Равновесие нарушится, и K⁺ начнёт выходить", "s1_a2_s3_x4": "Для выхода K⁺ нужна движущая сила, а потенциал и концентрации не изменились", "s1_a2_s3_h1": "Множитель P входит в оба выражения", "s1_a2_s3_h2": "Как изменится разность, если оба потока умножить на 3?", "s1_a2_s3_h3": "3 × 0 = 0", "s1_a2_s3_e": "Отсюда принципиальное различие: измерив только результирующий поток, нельзя отличить равновесие с интенсивным обменом от равновесия с редким обменом", "s1_a2_s3_bio": "13", "s1_a2_s4_cond": "Те же условия, но каналы удалили (P = 0)", "s1_a2_s4_q": "Чем это состояние отличается от состояния шага 3, если результирующий поток в обоих случаях 0?", "s1_a2_s4_o1": "При P = 0 переходов нет совсем, в шаге 3 они шли", "s1_a2_s4_x1": "Верно. Нулевой результирующий поток может означать и динамическое равновесие, и отсутствие пути. Различить их можно только по однонаправленным потокам", "s1_a2_s4_o2": "Ничем: результирующий поток одинаков", "s1_a2_s4_x2": "Одинаков только результирующий поток. Число переходов — 240 против 0", "s1_a2_s4_o3": "При P = 0 ионы накапливаются у мембраны и создают новый потенциал", "s1_a2_s4_x3": "Без пути ионы через мембрану не переходят, и разделения зарядов не возникает: потенциал задан условием", "s1_a2_s4_o4": "При P = 0 движущая сила исчезает", "s1_a2_s4_x4": "Движущая сила определяется концентрациями и потенциалом, они не изменились. Здесь она к тому же нулевая и в шаге 3", "s1_a2_s4_h1": "Сколько переходов показывают счётчики?", "s1_a2_s4_h2": "Какое из четырёх понятий описывает каждое состояние?", "s1_a2_s4_h3": "Равновесие — переходы есть и равны; нет пути — переходов нет", "s1_a2_s4_e": "Четыре понятия, которые нельзя смешивать: нулевая движущая сила (шаги 2–4), отсутствие пути (шаг 4), динамическое равновесие (шаги 2–3) и отсутствие переходов (шаг 4). «Нулевой поток» без уточнения ничего не говорит о том, какое из них имеет место", "s1_a2_s4_bio": "13", "s1_a2_s5_cond": "Cl⁻: снаружи 8, внутри 2; потенциал «внутри отрицательнее»; P = 1", "s1_a2_s5_q": "Каков результирующий поток Cl⁻?", "s1_a2_s5_o1": "0: по 40 переходов в каждую сторону", "s1_a2_s5_x1": "Верно: 10 × 8 × 0,5 = 40 и 10 × 2 × 2 = 40. Для аниона отрицательный потенциал затрудняет вход и облегчает выход", "s1_a2_s5_o2": "+150 внутрь: снаружи Cl⁻ в 4 раза больше", "s1_a2_s5_x2": "Это был бы ответ для катиона. Для аниона отрицательная внутренняя сторона отталкивает ион, и множители меняются местами", "s1_a2_s5_o3": "−60 наружу", "s1_a2_s5_x3": "Это расчёт для одинаковых концентраций 4 и 4. Здесь снаружи 8, внутри 2", "s1_a2_s5_o4": "Нельзя рассчитать: вклады противоположны", "s1_a2_s5_x4": "На базовом уровне без величин действительно нельзя. Здесь модель задаёт величины, и расчёт возможен", "s1_a2_s5_h1": "Для аниона множители при отрицательном потенциале — какие?", "s1_a2_s5_h2": "Eвн = 1/2, Eнар = 2", "s1_a2_s5_h3": "8 × 0,5 и 2 × 2", "s1_a2_s5_e": "Если величины вкладов заданы, итог определяется расчётом; если не заданы, его нельзя угадывать. Модель показывает расчёт по условным множителям; в физиологии ту же задачу решают с равновесным потенциалом иона", "s1_a2_s5_bio": "13", "s1_a2_s6_cond": "Клетка в изотоническом растворе: концентрация эффективных осмолитов снаружи и внутри одинакова. Сравнивают клетку без аквапоринов и с аквапоринами", "s1_a2_s6_q": "Что происходит с водой?", "s1_a2_s6_o1": "В обеих встречные потоки равны; с аквапоринами их больше", "s1_a2_s6_x1": "Верно. Осмотическое равновесие — тоже динамическое. Аквапорины увеличивают оба встречных потока, но не создают результирующего", "s1_a2_s6_o2": "Вода через мембрану не проходит: нет осмотического градиента", "s1_a2_s6_x2": "Нет результирующего потока, но молекулы воды, двигаясь беспорядочно, переходят через мембрану в обе стороны", "s1_a2_s6_o3": "В клетке с аквапоринами вода выходит наружу", "s1_a2_s6_x3": "Аквапорин не задаёт направления. Без осмотического градиента встречные потоки равны", "s1_a2_s6_o4": "С аквапоринами вода проходит в обе стороны, без них — не проходит", "s1_a2_s6_x4": "Вода проходит и через бислой, только медленнее: 10 и 10 против 100 и 100 в условных единицах модели", "s1_a2_s6_h1": "Есть ли разность концентраций эффективных осмолитов?", "s1_a2_s6_h2": "Что меняют аквапорины — направление или число переходов?", "s1_a2_s6_h3": "Равновесие — равные встречные потоки, аквапорины увеличивают оба", "s1_a2_s6_e": "И для ионов, и для воды нулевой результирующий поток при наличии пути — признак равновесия, а не остановки. Если же снаружи эффективных осмолитов меньше (гипотонический раствор), поток в клетку становится больше обратного, и клетка набухает; аквапорины ускоряют это набухание, но не меняют его направления", "s1_a2_s6_bio": "14 16", "s1_a2_rev1_cond": "В мембране есть каналы для иона M. Результирующий поток M равен нулю", "s1_a2_rev1_q": "Можно ли утверждать, что ионы M перестали перемещаться через каналы?", "s1_a2_rev1_o1": "Нет: так бывает и при равновесии", "s1_a2_rev1_x1": "Верно. Нулевой результирующий поток бывает и при равновесии (переходы идут в обе стороны поровну), и при закрытых каналах (переходов нет); по нему одному эти состояния неразличимы", "s1_a2_rev1_o2": "Да: поток нулевой — значит, движения нет", "s1_a2_rev1_x2": "Результирующий поток — разность. Её нулевое значение не говорит о величине слагаемых", "s1_a2_rev1_o3": "Да, если каналы открыты", "s1_a2_rev1_x3": "Именно при открытых каналах нулевой поток означает равновесие с продолжающимися переходами", "s1_a2_rev1_h1": "Из чего складывается результирующий поток?", "s1_a2_rev1_h2": "Как увидеть однонаправленный поток?", "s1_a2_rev1_h3": "Метка, проходящая через мембрану, — прямой показатель переходов", "s1_a2_rev2_cond": "В мембране есть каналы для иона M. Результирующий поток M равен нулю", "s1_a2_rev2_q": "Какие наблюдения различат состояния?", "s1_a2_rev2_o1": "Добавить меченые ионы M с одной стороны и проверить, появляется ли метка с другой", "s1_a2_rev2_x1": "Да: так измеряют однонаправленный поток. При равновесии метка переходит, при закрытых каналах — нет", "s1_a2_rev2_o2": "Зарегистрировать токи через одиночные каналы при небольшом сдвиге потенциала", "s1_a2_rev2_x2": "Да: если каналы открыты, при сдвиге потенциала от равновесного появится ток; если закрыты — нет", "s1_a2_rev2_o3": "Измерить концентрации M по обе стороны и мембранный потенциал и сравнить с равновесным потенциалом M", "s1_a2_rev2_x3": "Да: так проверяют, равен ли нулю электрохимический градиент. Если он не нулевой, а потока нет, значит пути нет", "s1_a2_rev2_o4": "Повторить измерение результирующего потока", "s1_a2_rev2_x4": "Повтор даст тот же ноль и не различит состояния", "s1_a2_rev2_h1": "Из чего складывается результирующий поток?", "s1_a2_rev2_h2": "Как увидеть однонаправленный поток?", "s1_a2_rev2_h3": "Метка, проходящая через мембрану, — прямой показатель переходов", "s1_a2_new": "Ион в растворе движется беспорядочно. Если канал открыт, ионы попадают в него с обеих сторон мембраны. Поток в одну сторону называют <b>однонаправленным</b>. <b>Результирующий поток</b> — разность двух однонаправленных потоков. Он равен нулю, если однонаправленные потоки равны, — это <b>динамическое равновесие</b>: ионы переходят, но различий не прибавляется. Он равен нулю и тогда, когда пути нет: тогда нулевые и оба однонаправленных потока.\n<b>Учебная модель встречных переходов</b> (допущение, а не физический закон в точном виде): число переходов внутрь за условную единицу времени = 10 × P × (концентрация снаружи) × Eвн; наружу = 10 × P × (концентрация внутри) × Eнар. Здесь P — проницаемость (0 — канала нет, 1 — мало открытых каналов, 3 — много); E — «электрический множитель». Если мембранный потенциал равен нулю, E = 1 для обоих направлений. Если внутри отрицательнее, для катиона Eвн = 2 и Eнар = 1/2 (поле облегчает вход и затрудняет выход), для аниона — наоборот; если внутри положительнее — всё обратное. Потенциал, при котором переходы уравновешены, — <b>равновесный потенциал</b> иона; в модели для него Eвн и Eнар подобраны так, что 10 × P × Cнар × Eвн = 10 × P × Cвн × Eнар.", "s1_a2_nernst": "В физиологии равновесный потенциал рассчитывают по уравнению Нернста: V = (61,5 мВ / z) × log₁₀(Cнар / Cвн) для 37 °C; V — потенциал внутренней стороны относительно наружной, z — заряд иона (+1 для K⁺, −1 для Cl⁻). Например, для K⁺ при концентрациях 5 мМ снаружи и 140 мМ внутри V ≈ −89 мВ. Знать уравнение для этой задачи не нужно.", "s1_a2_cond": "Участок мембраны с каналом, проницаемым только для выбранного иона. Задаются: ион (K⁺ — заряд +1, или Cl⁻ — заряд −1), концентрации снаружи и внутри (условные единицы 2, 4 или 8), мембранный потенциал (0; внутри отрицательнее; внутри положительнее; равновесный для этого иона) и проницаемость P (0, 1 или 3). Концентрации и потенциал в течение наблюдения не меняются: число ионов, переходящих за это время, ничтожно по сравнению с числом ионов в растворе. Отдельный блок — вода и аквапорины. Температура постоянная; множители модели от температуры не зависят.", "s1_a2_expl": "Молекулы и ионы движутся беспорядочно, и через открытый путь они переходят в обе стороны. Результирующий поток — разность однонаправленных потоков. Он равен нулю, когда движущая сила (электрохимический градиент) нулевая — тогда однонаправленные потоки равны, это динамическое равновесие. Он равен нулю и тогда, когда пути нет, — но тогда нет и однонаправленных потоков. Проницаемость меняет интенсивность обмена, а направление и величину результирующего потока при заданной проницаемости определяет градиент. То же верно для воды: при осмотическом равновесии вода продолжает переходить через мембрану, а аквапорины увеличивают оба встречных потока", "s1_a2_data": "Водная проницаемость мембраны клетки может меняться за минуты и часы без изменения осмотического градиента — за счёт числа аквапоринов в плазматической мембране. В астроцитах (клетках нервной ткани) при недостатке кислорода и при набухании клетки аквапорин-4 перемещается из внутриклеточных мембран в плазматическую мембрану; общее количество белка при этом не увеличивается. Вместе с этим растёт водная проницаемость мембраны. После возвращения нормальных условий аквапорин-4 уходит с поверхности, и проницаемость снижается. Перемещение зависит от кальмодулина — белка, связывающего ионы Ca²⁺, — и протеинкиназы A; кальмодулин связывается с концевым участком аквапорина-4. То, что общее количество белка не растёт, показано на культуре астроцитов. У крыс с травмой спинного мозга вещество, подавляющее кальмодулин, препятствовало перемещению аквапорина-4 и уменьшало отёк ткани. Эти данные показывают тот же принцип, что модель: путь меняет скорость переноса воды; направление задаёт осмотический градиент.", "s1_a2_how": "Количество аквапорина-4 на поверхности клеток определяли, присоединяя к белкам поверхности метку, которая не проходит через мембрану, и затем выделяя меченые белки. Водную проницаемость измеряли по скорости сжатия клеток после добавления концентрированного раствора: в клетки загружали флуоресцентный краситель, свечение которого гасится при росте его концентрации", "s1_a2_limits": "Множители 2 и 1/2 и числа переходов условные. Модель не учитывает, что сам перенос ионов меняет потенциал (в ней концентрации и потенциал заданы постоянными), и что одновременно работают каналы для других ионов и насосы. Модель не описывает строение канала и то, как ионы проходят через него друг за другом. Различие «в 10 раз» для воды с аквапоринами и без них — допущение модели", "s1_a2_title": "И2. Нулевой поток: равновесие, отсутствие пути или отсутствие движения?", "s1_a2_cnt_in": "Переходов внутрь", "s1_a2_w_eq": "При одинаковой концентрации эффективных осмолитов молекулы воды проходят через мембрану в обе стороны с одинаковой частотой; аквапорины увеличивают оба встречных потока, а результирующий остаётся нулевым", "s1_a3_s1_cond": "В t = 0 насос остановили. Остальное — исходное. Графики скрыты до ответа", "s1_a3_s1_q": "Каким будет поток X через 10, 30 и 60 условных минут?", "s1_a3_s1_o1": "Около 72, 37 и 14: поток снижается постепенно вместе с градиентом", "s1_a3_s1_x1": "Верно. По правилу модели градиент снижается в e раз за 30 условных минут. Поток X пропорционален градиенту", "s1_a3_s1_o2": "0 во все три момента: без насоса перенос X прекращается", "s1_a3_s1_x2": "Переносчик X использует градиент, а не насос. Градиент после остановки насоса снижается постепенно", "s1_a3_s1_o3": "100 во все три момента: X переносится без участия насоса", "s1_a3_s1_x3": "Без насоса Na⁺, входящий по путям утечки, не выводится, и градиент со временем уменьшается", "s1_a3_s1_o4": "Около 37, 5 и 0", "s1_a3_s1_x4": "Такая скорость снижения — при утроенной утечке. Здесь утечка обычная", "s1_a3_s1_h1": "Что расходует переносчик X?", "s1_a3_s1_h2": "Найдите в правилах, как меняется G после остановки насоса", "s1_a3_s1_h3": "e^(−10/30), e^(−1), e^(−2)", "s1_a3_s1_e": "Запасённая энергия градиента расходуется постепенно; скорость расходования задаёт утечка", "s1_a3_s1_bio": "21", "s1_a3_s2_cond": "В t = 0 насос остановили и одновременно увеличили утечку Na⁺ в 3 раза", "s1_a3_s2_q": "Как изменится картина по сравнению с шагом 1?", "s1_a3_s2_o1": "Втрое быстрее: X = 20 через 16 мин, а не 48", "s1_a3_s2_x1": "Верно. Без насоса скорость рассеивания градиента определяется утечкой: втрое большая утечка — втрое быстрее снижение", "s1_a3_s2_o2": "Так же, как в шаге 1: без насоса утечка уже не важна", "s1_a3_s2_x2": "Без насоса утечка — единственный процесс, меняющий градиент. Чем она больше, тем быстрее он рассеивается", "s1_a3_s2_o3": "Поток X сразу станет нулевым", "s1_a3_s2_x3": "Даже при большой утечке градиент снижается постепенно: через 10 условных минут остаётся 37 %", "s1_a3_s2_o4": "Поток X возрастёт: больше Na⁺ входит в клетку", "s1_a3_s2_x4": "Na⁺, входящий через канал утечки, не проходит через переносчик X и не переносит X. Он только уменьшает градиент", "s1_a3_s2_h1": "Что в модели делает утечка, когда насос остановлен?", "s1_a3_s2_h2": "Сравните показатель экспоненты в двух сценариях", "s1_a3_s2_h3": "Утечка ×3 — время снижения /3", "s1_a3_s2_e": "Остановка источника градиента и открытие пути утечки — разные воздействия. При остановленном насосе они складываются: утечка ускоряет рассеивание. Но так бывает не всегда — смотрите шаг 3", "s1_a3_s2_bio": "21", "s1_a3_s3_cond": "Насос работает, запас мощности достаточный. В t = 0 утечку Na⁺ увеличили в 3 раза. Графики скрыты до ответа", "s1_a3_s3_q": "Что произойдёт с градиентом, потоком X и расходом АТФ?", "s1_a3_s3_o1": "Градиент и X прежние, расход АТФ втрое больше", "s1_a3_s3_x1": "Верно. Насос компенсирует увеличенную утечку, работая быстрее. Цена сохранения градиента — расход АТФ", "s1_a3_s3_o2": "Градиент снижается так же быстро, как при остановленном насосе", "s1_a3_s3_x2": "Насос работает, и его мощности хватает, чтобы выводить втрое больше Na⁺. Градиент сохраняется", "s1_a3_s3_o3": "Градиент снижается вдвое, расход АТФ не меняется", "s1_a3_s3_x3": "Это возможно, только если насос не может работать быстрее. В этом сценарии запас мощности достаточный", "s1_a3_s3_o4": "Поток X возрастает втрое", "s1_a3_s3_x4": "Поток X определяется градиентом, переносчиком и X; ни одно из них не изменилось", "s1_a3_s3_h1": "Может ли насос работать быстрее, если Na⁺ входит быстрее?", "s1_a3_s3_h2": "Посмотрите правило 1: какой будет G при утечке 3 и мощности 400?", "s1_a3_s3_h3": "400 / 300 > 1", "s1_a3_s3_e": "Открытие пути утечки не всегда приводит к быстрому истощению градиента: результат зависит от того, может ли насос компенсировать утечку. Поэтому утверждение «утечка разряжает градиент» неполно без сведений о насосе и запасе АТФ", "s1_a3_s3_bio": "21", "s1_a3_s4_cond": "То же, но запас мощности насоса недостаточный (до 1,5-кратной нагрузки)", "s1_a3_s4_q": "Что покажет модель?", "s1_a3_s4_o1": "Новое стационарное: градиент 50 %, X 50, АТФ 150", "s1_a3_s4_x1": "Верно: G = 150 / 300 = 0,5; A = min(300; 150) = 150. Градиент снижен, но поддерживается — он не исчезает, как при остановке насоса", "s1_a3_s4_o2": "Градиент снижается до нуля, как при остановке насоса", "s1_a3_s4_x2": "Насос работает на пределе и продолжает выводить Na⁺. Градиент снижается до уровня, при котором вход Na⁺ равен выведению", "s1_a3_s4_o3": "Градиент 100 %, расход АТФ 300", "s1_a3_s4_x3": "Насос не может работать быстрее 1,5-кратной нагрузки, то есть больше 150 условных единиц", "s1_a3_s4_o4": "Поток X остаётся 100: переносчик исправен", "s1_a3_s4_x4": "Переносчик исправен, но градиент, от которого зависит поток, уменьшился вдвое", "s1_a3_s4_h1": "Какую нагрузку может выдержать насос?", "s1_a3_s4_h2": "Правило 1: G = мощность / (100 × утечка)", "s1_a3_s4_h3": "150 / 300", "s1_a3_s4_e": "Стационарное состояние с пониженным градиентом — третий исход, отличный и от полного сохранения градиента (шаг 3), и от его постепенного исчезновения (шаги 1–2)", "s1_a3_s4_bio": "21", "s1_a3_s5_cond": "Насос работает, утечка обычная. В t = 0 переносчик X стал работать на 20 % (например, часть переносчиков заблокировало вещество, связавшееся с ними)", "s1_a3_s5_q": "Что покажут четыре графика?", "s1_a3_s5_o1": "Поток X — 20; градиент, поток Y и расход АТФ — исходные", "s1_a3_s5_x1": "Верно. Нарушено только звено переносчика X: градиент и другие использующие его процессы не затронуты", "s1_a3_s5_o2": "Все показатели снизятся до 20 %", "s1_a3_s5_x2": "Переносчик X не влияет на насос и на переносчик Y. Снижается только поток X", "s1_a3_s5_o3": "Поток X — 20, градиент растёт: Na⁺ меньше входит через переносчик X", "s1_a3_s5_x3": "В модели вход Na⁺ через переносчик X входит в обычную утечку и отдельно не учитывается; в клетке эффект был бы небольшим и компенсировался бы насосом", "s1_a3_s5_o4": "Поток X — 20, расход АТФ падает до 20", "s1_a3_s5_x4": "Насос поддерживает градиент для всех Na⁺-зависимых процессов и утечки; его работа почти не меняется", "s1_a3_s5_h1": "Какое звено нарушено?", "s1_a3_s5_h2": "Зависят ли градиент и поток Y от переносчика X?", "s1_a3_s5_h3": "Нарушение одного переносчика — локальное", "s1_a3_s5_e": "Поток Y через другой Na⁺-зависимый переносчик — удобный «свидетель»: он реагирует на нарушение градиента, но не на нарушение переносчика X", "s1_a3_s5_bio": "21", "s1_a3_s6_cond": "Две клетки. Клетка 1: переносчик X на 20 %, остальное исходное. Клетка 2: насос остановлен в t = 0, наблюдение в t = 48 условных минут. В обеих поток X — 20", "s1_a3_s6_q": "Какое измерение различит эти клетки?", "s1_a3_s6_o1": "Градиент, поток Y или расход АТФ", "s1_a3_s6_x1": "Верно: градиент 100 % против 20 %, поток Y 100 против 20, расход АТФ 100 против 0. Одинаковый результат по X сопровождается разным состоянием других звеньев. Кроме того, в клетке 2 поток X продолжает снижаться, а в клетке 1 — постоянен", "s1_a3_s6_o2": "Повторное измерение потока X в тот же
