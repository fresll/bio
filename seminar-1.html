<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры">
<title>Семинар 1 · Мембранная организация клетки и транспорт веществ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.qcol{color:var(--muted);font-size:13.5px;margin:2px 0 0;max-width:90ch;flex-basis:100%;order:9}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий «предскажите и проверьте» */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
/* v1.1.6: варианты итогового вопроса (блок .intbox) — тот же вид, что у вариантов шагов (прежде были кнопки браузера без стиля) */
.poe .opts,.intbox .opts{display:grid;gap:6px}
.poe .opt,.intbox .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L,.intbox .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked,.intbox .opt.picked{border-color:var(--ink)}
.poe .opt.right,.intbox .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick,.intbox .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex,.intbox .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled,.intbox .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{grid-column:1/-1;text-align:center}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}

#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}

.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */
.veil{display:none}
.casemode .side>.panel:not(.case),.casemode .totake{display:none!important}
/* v1.1.6: шкала этапов скрыта во всём режиме «Найти причину»: после решения схема показывает образец, а шкала — план контрольной сцены (подпись «Этап 4 из 4…» противоречила образцу) */
.casemode .stage .tl,.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}
.case .k{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}
.co{margin:0 0 10px;font-size:15px;line-height:1.4}
.ch{margin:12px 0 6px;font-weight:700;font-size:14px}
.cm,.cc{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.cq{font:600 12.5px var(--f-body);padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}

.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}
.rxtrack input{position:relative;z-index:1;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}
.mcond p{margin:0;font-size:14.5px}
.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (ограничение 07, разд. 4; R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.poe .hint{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface)}
.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.amapgrid svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.amapq{margin-top:12px}.amapq .opts{display:grid;gap:6px}.amapq .opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.amapq .opt.right{border-color:#2E9B57;background:#EEF8F1}.amapq .opt.wrongpick{border-color:#C0392B;background:#FBECEA}.amapq .opt .L{font-weight:700}
@media (max-width:700px){.amapgrid{grid-template-columns:minmax(0,1fr)}}

/* ---- семинар 8, интерактив (Claude Code, 12.11.2026): из семинара 7 v1.5 ---- */
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}
.tlrow:has(.tlstep) .tlchips{flex-wrap:wrap}
.tlrow:has(.tlstep) .tlplay{min-width:0}
@media (max-width:1000px){.tlrow:has(.tlstep) .tlchips{flex-basis:100%}}   /* рецензия v1.4, п. 9: на компьютере ряд шкалы в одну строку — схема крупнее */
.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}
.scene.predict .panel.cap::before,.scene.predict .panel.reads::before{content:attr(data-predict);display:block;font-weight:600;color:var(--ink)}
.scene.predict .panel.cap,.scene.predict .panel.reads{position:relative}
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
/* рецензия v1.4, п. 7: до запуска шкала не показывает, где остановится процесс */
.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}
.scene.predict .tlr{--stop:100% !important}
.scene.predict .tlc.no{cursor:pointer}   /* v1.2 (рецензия И-15) */

/* v1.2.1 (аудит S9-06, рецензия И-03): телефон — ключевые числа 2а/3а текущего кадра строкой под схемой, без прокрутки увеличенной схемы.
   Скрыта до ответа в сценарии (poehide), в «Найти причину» до решения и до запуска шкалы (predict); на широком экране не нужна. */
.mstrip{display:none}
@media (max-width:700px){ .mstrip{display:flex;flex-wrap:wrap;gap:2px 12px;margin:8px 2px 2px;font-size:14px;line-height:1.35;color:var(--ink,#15202B)}
  .mstrip b{font-variant-numeric:tabular-nums} .mstrip .mh{width:100%;font-size:12.5px;color:var(--muted,#5B6B7F)} }
.poehide .mstrip,.predict .mstrip,.casemode:not(.casedone) .mstrip{visibility:hidden}
/* v1.2.1 (аудит S10-07): подпись перехода над схемой после ответа */
.psw{margin:0 0 8px;padding:7px 12px;background:#FFF5E8;border-left:3px solid #E8912A;border-radius:0 8px 8px 0;font-size:14px;line-height:1.4;color:var(--ink,#15202B)}
.psw[hidden]{display:none}

header .ttl{min-width:0}

.routeln{margin:10px 2px 2px}
.routeln a{font-weight:600}
.aprob p{margin:6px 0 0}
.take.none{display:none!important}
.scene .fewrap{grid-column:1/-1;margin-top:10px}
.fepanels{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fepanels svg{flex:1 1 280px;max-width:420px;background:var(--surface);border-radius:10px}
.fecap{font-size:15.5px;border-left:4px solid var(--mtor);padding-left:10px}
.feq{margin:10px 0}
.intbox{margin-top:12px}

.reads.s1wait > *{visibility:hidden}
.reads.s1wait{position:relative;min-height:44px}
.reads.s1wait::after{content:attr(data-wait);position:absolute;left:14px;top:12px;color:var(--muted);font-size:14px;visibility:visible}

details.allx{margin-top:8px}details.allx summary{cursor:pointer;color:var(--mtor);font-weight:600}
details.allx li{margin:4px 0}details.allx li.okx b{color:var(--good)}
.exstep{border-left:3px solid var(--mtor);padding-left:8px}
/* семинар 1: итоговая задача */
.intbox h2{margin:0 0 6px;font-size:20px}
.intgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.intgrid{grid-template-columns:1fr}}
.intstage svg{width:100%;height:auto;display:block}
.intsteps{padding-left:20px}.intsteps li{margin:8px 0}
.intc{display:flex;gap:6px;align-items:flex-start;margin:3px 0;font-size:14px}
.intfb.ok{color:var(--good);font-weight:600}.intfb.bad{color:var(--bad);font-weight:600}
.inttab{border-collapse:collapse;margin:6px 0;font-size:14px}.inttab td,.inttab th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.intnote{width:100%;font:inherit}
#intBox select{max-width:100%}
.panel.pre p{margin:6px 0}.panel.pre ul.rules,.panel.pre ol.rules{margin:6px 0}
#intBox .grp > span{margin-right:10px}   /* v1.2 (Н-25): метка «Ситуация» не вплотную к списку */

/* пакет 4 финального аудита (20.11.2026): окно «О модели» — общий компонент patches/p4_model_dialog.md */
#modelDlg{max-height:85vh;overflow:auto}
.model-body .model-status::first-letter{text-transform:uppercase}
.model-body{font-size:15px;line-height:1.5}
.model-body .model-status{color:var(--muted);margin:0 0 6px}
.model-body h4{margin:14px 0 6px;font-size:15px}
.model-body p{margin:0 0 8px}
.model-body ul{margin:0 0 8px;padding-left:20px}
@media (max-width:600px){#modelDlg{max-width:calc(100vw - 24px);padding:14px}}
/* пакет 4: нумерованные правила модели в окне; строка статуса модели под схемой (одна строка, как в семинарах 3 и 7);
   условия вкладки в сценарии и в случае «Найти причину» */
.model-body ol{margin:0 0 8px;padding-left:20px}
.p4stat{margin:0;padding:4px 12px 6px;font-size:12px;line-height:1.35;color:var(--muted);border-top:1px solid var(--line)}
.stage:has(.tl):has(.p4stat):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 172px)}
.stage:has(.p4stat):not(:has(.tl)):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 28px)}
.casemode:not(.casedone) .stage .p4stat{display:none}
.case .ccond{margin:4px 0 6px}

/* сведение пакета 4 (20.11.2026): длинная плашка показания переносится внутри строки, а не уходит за край колонки и не закрывает подпись */
@media (min-width:701px){.read:has(> .pill){grid-template-columns:max-content minmax(0,1fr)}.read > .pill{white-space:normal;justify-self:end;text-align:right}}

/* пакет 7 (20.11.2026): ссылка на раздел — отдельной строкой под переходом между семинарами */
.semnav .sn-sec{grid-column:1/-1;text-align:center}

/* пакет 5 (20.11.2026): телефон — подписи < 7 px скрыты до увеличения; ширина увеличенной схемы — по самой мелкой подписи (≥ 11 px) */
@media (max-width:700px), (max-height:500px){
  .stage.zoomed svg{width:var(--p5w,760px)!important}
}

/* 3.0.2 (21.11.2026): телефон — как в «Молекулярной биологии»: подписи не скрываются; схема открывается увеличенной;
   «Показать схему целиком» вписывает её во всю ширину экрана (ограничение высотой окна — только для компьютера и проектора) */
@media (max-width:700px){#scenes .stage:not(.zoomed) svg{max-height:none!important}}
</style>

улу, ион, белок или участок мембраны", "lg_model": "Переключатели показывают предсказания учебной модели, а не результат эксперимента. Уровни и числа на схемах условные.", "teacher_t": "Источники", "src_t_st": "Источники", "teacher_1": "", "teacher_2": "", "teacher_3": "", "b_task_t": "Задача", "b_cond_t": "Условия:", "b_rules_t": "Правила модели", "b_lim_t": "Чего модель не показывает", "b_how_t": "Как это установили", "b_new_t": "Новые данные", "b_newhow_t": "Новые данные и как это установили", "b_howq_t": "Как это установили?", "b_eq_t": "Переменные, уравнения, единицы", "b_route": "{t}", "k_title": "Конструктор: нажмите на деталь, чтобы убрать её; нажмите на неё в лотке, чтобы вернуть", "k_on": "на месте", "k_empty": "нет", "k_fixed": "закреплена", "k_first": "Убраны несколько деталей.", "k_hint": "Исход определяется правилами модели (окно «О модели», раздел «Правила модели»).", "hint_btn": "Подсказка {i} из {n}", "hint_n": "Подсказка {i}.", "rd_t": "Показания модели", "poe_hidden": "Схема откроется после ответа: сначала выберите вариант и нажмите «Показать на схеме».", "m_hidden": "Показания откроются после ответа", "a_prob_t": "Исследование", "a_base_t": "Новая опора", "a_concl_t": "Допустимые выводы", "a_pred_t": "Прогноз до наблюдения", "a_pred_btn": "Проверить прогноз", "a_scen_t": "Контрастные сценарии", "a_mh_t": "Подсказки к модели", "a_lim_t": "Чего модель не показывает", "a_new_t": "Новые данные и как это установили", "a_how_t": "Как это установили:", "rd_model": "Показания учебной модели; числа условные.", "ms_head": "Показания", "amode_t": "Режим", "amode_e": "Исследование", "amode_m": "Модель", "amk_t": "Сцена", "amk_1": "Модель 1", "amode_note": "Переключатели показывают предсказания учебной модели, а не доказательство.", "b_pre_t": "Перед задачей", "s1_ctrl_note": "Переключатели показывают предсказания учебной модели, а не результат эксперимента. Полосы, уровни и числа на схемах условные: они показывают направление и соотношение величин, а не измеренные значения. Измеренные значения, если они приводятся, даны в тексте вместе с условиями измерения", "s1_anim_note": "Порядок этапов на анимации — учебная модель; в клетке этапы могут перекрываться", "s1_lvl_basic": "Базовый", "s1_lvl_adv": "Продвинутый", "s1_btn_check": "Проверить", "s1_btn_all": "Показать разбор всех вариантов", "s1_btn_hint": "Подсказка", "s1_btn_next": "Следующий шаг", "s1_btn_reset": "Вернуть исходное состояние", "s1_adv_note": "Модели продвинутого уровня — учебные: их правила заданы явно. Числа — условные единицы модели, если рядом не указаны условия измерения. Модель показывает, какие выводы следуют из её правил, а не доказывает, что клетка устроена именно так", "s1_t1_s1_cond": "Панель А. Фосфолипиды поместили в воду и перемешали. Схема скрыта до ответа", "s1_t1_s1_q": "Какая структура образуется?", "s1_t1_s1_o1": "Замкнутый бислой: хвосты внутри, головки обращены к воде", "s1_t1_s1_x1": "Верно. У фосфолипида есть и гидрофильная, и гидрофобная части. В бислое контакт хвостов с водой минимален, а головки остаются в воде. Края плоского слоя открывали бы хвосты воде, поэтому слой замыкается в пузырёк", "s1_t1_s1_o2": "Один слой: головки к воде, хвосты в воздух или к стенкам сосуда", "s1_t1_s1_x2": "Монослой образуется на границе вода — воздух, где хвостам есть куда выйти из воды. В толще воды такой границы нет, и хвосты одного слоя закрываются хвостами второго слоя", "s1_t1_s1_o3": "Шарики-мицеллы: хвосты внутри, головки снаружи обращены к воде", "s1_t1_s1_x3": "Мицеллы образуют амфифильные молекулы конической формы — например, с одним хвостом: такие молекулы плотно укладываются в шарик. У фосфолипида два хвоста, и форма молекулы близка к цилиндру: в шарике хвостам не хватило бы места, поэтому фосфолипиды образуют бислой", "s1_t1_s1_o4": "Молекулы равномерно растворятся в воде", "s1_t1_s1_x4": "Так ведут себя молекулы без гидрофобной части. Два углеводородных хвоста фосфолипида не взаимодействуют с водой, и гидрофобный эффект собирает их вместе", "s1_t1_s1_h1": "Что происходит с неполярными молекулами в воде — например, с каплями масла?", "s1_t1_s1_h2": "У фосфолипида две части. Какая из них взаимодействует с водой, а какая — нет?", "s1_t1_s1_h3": "В бислое хвосты не контактируют с водой, а головки обращены к воде с обеих сторон", "s1_t1_s1_e": "Самосборка бислоя не требует ни ферментов, ни затрат АТФ: это следствие свойств самих молекул и воды. На панели А уберите у молекулы хвосты или головку — слоя не будет. Для образования бислоя нужны обе части молекулы. Поэтому бислой и восстанавливается после небольших повреждений: липиды снова собираются так, чтобы хвосты не контактировали с водой", "s1_t1_s1_bio": "1", "s1_t1_s2_cond": "Панель Б. Бислой из ненасыщенных фосфолипидов без холестерина при умеренной температуре. Хвосты заменили на насыщенные той же длины; температура прежняя", "s1_t1_s2_q": "Как изменится латеральная подвижность липидов?", "s1_t1_s2_o1": "Снизится: прямые хвосты упаковываются плотнее", "s1_t1_s2_x1": "Верно. Излом цис-двойной связи мешает хвостам лечь плотно. Без изломов хвосты сближаются, взаимодействия между ними усиливаются, и молекулам труднее перемещаться", "s1_t1_s2_o2": "Повысится: без двойных связей хвосты становятся гибче", "s1_t1_s2_x2": "Насыщенная цепь действительно может вращаться вокруг одинарных связей, но для подвижности бислоя важнее, насколько плотно цепи соседей прилегают друг к другу. Прямые цепи прилегают плотнее, поэтому подвижность ниже", "s1_t1_s2_o3": "Не изменится: подвижность зависит только от температуры", "s1_t1_s2_x3": "Температура важна, но не единственный фактор. Сравните на панели Б две строки при одной температуре: при насыщенных хвостах подвижность ниже", "s1_t1_s2_o4": "Липиды перестанут перемещаться совсем", "s1_t1_s2_x4": "При умеренной температуре бислой из насыщенных липидов остаётся жидким, подвижность лишь снижается. Почти полная остановка перемещений — состояние геля; в модели оно наступает при низкой температуре", "s1_t1_s2_h1": "Чем отличается форма насыщенного и ненасыщенного хвоста?", "s1_t1_s2_h2": "Посмотрите на рисунок упаковки: где промежутки между хвостами больше?", "s1_t1_s2_h3": "Плотная упаковка — сильнее взаимодействия между соседями — меньше подвижность", "s1_t1_s2_e": "Насыщенность хвостов и их длина задают плотность упаковки: короткие и ненасыщенные хвосты повышают текучесть, длинные и насыщенные — снижают. Организмы, температура тела которых меняется вместе со средой (бактерии, дрожжи), при охлаждении синтезируют больше ненасыщенных жирных кислот и сохраняют текучесть мембран", "s1_t1_s2_bio": "4", "s1_t1_s3_cond": "Панель Б. Две мембраны. Мембрана 1: ненасыщенные хвосты, высокая температура (жидкий бислой). Мембрана 2: насыщенные хвосты, низкая температура (без холестерина — гель). В обе мембраны добавили холестерин. Показания скрыты до ответа", "s1_t1_s3_q": "Что произойдёт с латеральной подвижностью липидов?", "s1_t1_s3_o1": "В мембране 1 почти не изменится, в мембране 2 — повысится", "s1_t1_s3_x1": "Верно. В жидком бислое холестерин делает упорядоченнее участки хвостов у головок и немного снижает проницаемость для воды, но, по правилам модели, подвижность липидов в плоскости слоя не меняет. В мембране 2 он мешает хвостам кристаллизоваться, и гель не образуется: подвижность выше, чем у геля. Действие холестерина зависит от состава мембраны и температуры", "s1_t1_s3_o2": "В обеих снизится: холестерин всегда делает мембрану менее текучей", "s1_t1_s3_x2": "Холестерин уплотняет упаковку у головок, но одновременно мешает хвостам выстроиться в кристаллическую решётку геля. Поэтому в мембране, которая без него была бы гелем, текучесть с холестерином выше. Правило «холестерин всегда снижает текучесть» неверно без указания условий", "s1_t1_s3_o3": "В обеих заметно повысится: холестерин разжижает любую мембрану", "s1_t1_s3_x3": "В жидком бислое холестерин не повышает подвижность: его жёсткие кольца, наоборот, ограничивают движение участков хвостов у головок. Повышение подвижности — только там, где без холестерина был бы гель", "s1_t1_s3_o4": "Не изменится: холестерин в бислой не встраивается", "s1_t1_s3_x4": "Холестерин встраивается между фосфолипидами: гидроксильная группа — у головок, плоская жёсткая часть — среди хвостов. В плазматической мембране животных клеток его может быть почти столько же, сколько фосфолипидов", "s1_t1_s3_h1": "В каком состоянии каждая мембрана находилась до добавления холестерина?", "s1_t1_s3_h2": "Холестерин и упорядочивает хвосты у головок, и мешает им выстроиться в решётку геля. Какое из двух действий меняет подвижность в каждой мембране?", "s1_t1_s3_h3": "Гелю холестерин не даёт образоваться; в жидком бислое меняется упорядоченность, а не подвижность", "s1_t1_s3_e": "Шкала «упорядоченность у головок» показывает, что холестерин действует и на жидкий бислой: хвосты у головок становятся упорядоченнее, и вода проходит немного медленнее. Но сделать жидкую мембрану менее текучей и превратить её в гель холестерин не может, а гелю, наоборот, не даёт образоваться. Величина эффекта зависит от количества холестерина, состава фосфолипидов и температуры; на продвинутом уровне видно, что от состояния бислоя зависит и направление влияния холестерина на проницаемость", "s1_t1_s3_bio": "4 7", "s1_t1_s4_cond": "Панель В. Две одинаковые липосомы из жидкого бислоя без белков. Липосому 1 перенесли в раствор с большей концентрацией вещества, которое через бислой не проходит, — вода может выходить из неё. Липосому 2, внутри которой раствор сахарозы, а NaCl нет, поместили в раствор NaCl (ионы Na⁺ и Cl⁻) с той же суммарной концентрацией растворённых частиц, что внутри. Время наблюдения — минуты. Схема показывает обе липосомы", "s1_t1_s4_q": "Что произойдёт за время наблюдения?", "s1_t1_s4_o1": "Вода выйдет, а Na⁺ практически не войдёт", "s1_t1_s4_x1": "Верно. Небольшие незаряженные полярные молекулы, такие как вода, проходят через бислой, хотя намного медленнее неполярных. Заряженную частицу удерживает в воде её гидратная оболочка, и войти в гидрофобную середину бислоя ей энергетически крайне невыгодно, каким бы маленьким ни был ион", "s1_t1_s4_o2": "Ничего: ни вода, ни ионы через бислой не проходят", "s1_t1_s4_x2": "Вода проходит через бислой без белков, только медленно. Это измеряют на искусственных липидных пузырьках: в растворе с большей концентрацией частиц, которые не проходят через бислой, пузырёк теряет воду и сжимается. Аквапорины ускоряют перенос воды, но не создают его возможность", "s1_t1_s4_o3": "Вода выйдет, и Na⁺ войдёт: ион Na⁺ мал", "s1_t1_s4_x3": "Размер имеет значение для незаряженных молекул, но для иона решающее свойство — заряд. Ион Na⁺ окружён молекулами воды, и снять эту оболочку внутри неполярной середины бислоя нечем компенсировать", "s1_t1_s4_o4": "Na⁺ войдёт, а вода не выйдет", "s1_t1_s4_x4": "Наоборот: бислой практически непроницаем для ионов, а вода через него проходит медленно", "s1_t1_s4_h1": "Что окружает ион в воде?", "s1_t1_s4_h2": "Середина бислоя неполярная. Каково там заряженной частице?", "s1_t1_s4_h3": "Для незаряженной молекулы важны размер и полярность, для иона — заряд", "s1_t1_s4_e": "Бислой проницаем для веществ в зависимости прежде всего от их гидрофобности и размера: малые неполярные молекулы (O₂, CO₂) проходят быстро, малые незаряженные полярные (вода, мочевина) — медленно, крупные полярные (глюкоза) — очень медленно, ионы — практически нет. Поэтому по разные стороны мембраны могут поддерживаться разные концентрации ионов", "s1_t1_s4_bio": "5", "s1_t1_s5_cond": "Панели Б и В вместе. Бислой сделали максимально подвижным: ненасыщенные хвосты, без холестерина, высокая температура. Вещество — Na⁺", "s1_t1_s5_q": "Станет ли ион Na⁺ проходить через бислой?", "s1_t1_s5_o1": "Нет: неполярная середина бислоя осталась на пути иона", "s1_t1_s5_x1": "Верно. Текучесть описывает перемещения липидов вдоль мембраны, а барьер для иона создаёт неполярная середина бислоя. Она остаётся неполярной при любой подвижности липидов", "s1_t1_s5_o2": "Да: в жидкой мембране между липидами появляются промежутки, через которые проходят ионы", "s1_t1_s5_x2": "Промежутки между хвостами в жидком бислое заполнены такими же неполярными хвостами, а не водой. Водного пути для иона в них нет. Ион проходит через мембрану по белковому пути — каналу или переносчику", "s1_t1_s5_o3": "Да, но только при высокой температуре", "s1_t1_s5_x3": "Повышение температуры ускоряет движение молекул, но не делает середину бислоя полярной. В модели ион практически не проходит при всех температурах", "s1_t1_s5_o4": "Нельзя сказать без числа липидов в мембране", "s1_t1_s5_x4": "Число липидов не меняет главного: на пути иона остаётся неполярный слой. Для ответа достаточно свойств иона и устройства бислоя", "s1_t1_s5_h1": "Где именно находится барьер для иона — на поверхности или в середине бислоя?", "s1_t1_s5_h2": "Меняется ли полярность середины бислоя, когда растёт подвижность липидов?", "s1_t1_s5_h3": "Подвижность — это перемещения вдоль мембраны, проницаемость — перенос поперёк", "s1_t1_s5_e": "Текучесть и проницаемость — разные свойства. Изменение упаковки липидов заметно меняет перенос воды и неполярных молекул (продвинутый уровень этой вкладки показывает данные), но не создаёт пути для ионов. Ионы и крупные полярные молекулы проходят через мембраны клеток благодаря белкам — им посвящены вкладки 2 и 3", "s1_t1_s5_bio": "5 7", "s1_t1_s6_cond": "Панель В. Жидкий бислой. Снаружи — раствор глюкозы. Внутри липосомы глюкозы нет. Время наблюдения — минуты", "s1_t1_s6_q": "Сколько глюкозы окажется внутри липосомы?", "s1_t1_s6_o1": "Очень мало: глюкоза — крупная полярная молекула, и через бислой без белков она проходит очень медленно", "s1_t1_s6_x1": "Верно. Глюкоза не заряжена, но содержит несколько гидроксильных групп, образующих водородные связи с водой, и заметно крупнее молекулы воды. Через бислой она проходит намного медленнее воды, и за минуты внутрь попадает очень мало глюкозы. В клетке её переносят белки-переносчики", "s1_t1_s6_o2": "Столько же, сколько снаружи: глюкоза не заряжена, значит проходит свободно", "s1_t1_s6_x2": "Отсутствие заряда не делает молекулу неполярной. Глюкоза полярна и достаточно крупна, поэтому бислой для неё — серьёзный барьер", "s1_t1_s6_o3": "Нисколько: глюкоза не может пройти через бислой ни при каком времени наблюдения", "s1_t1_s6_x3": "Через бислой без белков глюкоза всё же проходит, но очень медленно. Отличие от иона — количественное, а не принципиальное: для клетки такая скорость недостаточна", "s1_t1_s6_o4": "Больше, чем снаружи: глюкоза накапливается внутри", "s1_t1_s6_x4": "Пассивный перенос через бислой идёт только из области большей концентрации в область меньшей. Накопление против градиента концентрации требует источника энергии и белка — это тема вкладки 3", "s1_t1_s6_h1": "Глюкоза заряжена? А полярна?", "s1_t1_s6_h2": "Сравните глюкозу с водой по размеру и числу групп, взаимодействующих с водой", "s1_t1_s6_h3": "Незаряженная, но крупная полярная молекула проходит, но очень медленно", "s1_t1_s6_e": "Для каждого вещества у бислоя своя проницаемость, и она зависит от свойств вещества: заряда, полярности, размера. Мембрана клетки — бислой с белками, и избирательность мембраны создают оба компонента: бислой задаёт общий барьер, белки — пути для конкретных веществ", "s1_t1_s6_bio": "5 9", "s1_t1_rev_q": "Две липосомы из разных фосфолипидов поместили в одинаковые условия. В липосоме 1 вода выходит в концентрированный раствор заметно быстрее, чем в липосоме 2; из липосомы 2 вода тоже выходит, но медленнее. Ионы Na⁺ не проходят ни в одну из них. Какое объяснение совместимо с этими наблюдениями?", "s1_t1_rev_o1": "Бислой 2 упакован плотнее; барьер для ионов есть в обоих", "s1_t1_rev_x1": "Верно. Упаковка липидов влияет на проницаемость для воды, а для ионов барьер создаёт неполярная середина, которая есть в любом бислое", "s1_t1_rev_o2": "В липосоме 1 есть каналы для воды, а в липосоме 2 их нет", "s1_t1_rev_x2": "В условии сказано, что липосомы состоят из фосфолипидов, без белков. Каналов в них нет, разницу объясняет состояние бислоя", "s1_t1_rev_o3": "Липосома 2 непроницаема для воды", "s1_t1_rev_x3": "Вода выходит и из липосомы 2, только медленнее. Бислой без белков проницаем для воды при любом его состоянии", "s1_t1_rev_o4": "Липосома 1 пропускает ионы, но мы этого не заметили", "s1_t1_rev_x4": "Наблюдение прямо говорит, что ионы не проходят. Объяснение не должно противоречить данным", "s1_t1_rev_h1": "Какое свойство бислоя меняется при разном составе липидов, а какое остаётся?", "s1_t1_rev_h2": "Что измеряли — скорость выхода воды. От чего она зависит в бислое без белков?", "s1_t1_rev_h3": "Плотная упаковка замедляет перенос воды, но барьер для ионов есть в обоих бислоях", "s1_t1_expl": "Плазматическая мембрана построена на основе липидного бислоя. Фосфолипиды амфифильны, и в воде гидрофобный эффект собирает их в бислой, головки которого обращены к воде, а хвосты образуют неполярную середину; толщина бислоя около 5 нм. Бислой жидкий: соседние липиды в одном слое меняются местами очень часто, и за секунду липид может сместиться на расстояние порядка микрометра. Текучесть зависит от длины и насыщенности хвостов и температуры. Холестерин делает упорядоченнее участки хвостов у головок и немного снижает проницаемость жидкого бислоя для воды, а в бислое, который без него стал бы гелем, сохраняет текучесть. Неполярная середина бислоя пропускает малые неполярные молекулы быстро, воду — медленно, глюкозу — очень медленно, а ионы — практически не пропускает. Это и делает мембрану границей, по разные стороны которой концентрации ионов могут различаться. Повышение текучести не устраняет барьера для ионов: путь для них создают белки", "s1_t1_limits": "Модель не показывает: белки мембраны и их влияние на упаковку липидов; асимметрию состава двух слоёв мембраны; разную длину хвостов; сосуществование участков с разной упорядоченностью в одной мембране; мембраны клеток, состав которых намного сложнее одного вида фосфолипида. Уровни подвижности и прохождения условные: модель сравнивает состояния, а не сообщает измеренные величины. Температура обозначена условно, относительно перехода в гель", "s1_t1_title": "1. Структура и избирательная проницаемость липидного бислоя", "s1_t1_pre": "<b>Амфифильная молекула</b> имеет две части с разными свойствами: полярную, которая образует водородные связи и взаимодействует с водой (гидрофильную), и неполярную, которая с водой не взаимодействует (гидрофобную). <b>Фосфолипид</b> — амфифильная молекула: гидрофильная головка с фосфатной группой и два гидрофобных углеводородных хвоста.\nВ воде неполярные участки собираются вместе, а полярные остаются в контакте с водой. Это называют <b>гидрофобным эффектом</b>: молекулы воды вокруг неполярного участка образуют более упорядоченную сеть, поэтому система с наименьшей поверхностью контакта «вода — неполярная часть» энергетически выгоднее.\n<b>Латеральная подвижность</b> — перемещение молекул в плоскости своего слоя. <b>Текучесть мембраны</b> — свойство бислоя, при котором липиды и белки быстро перемещаются в нём, как в жидкости. <b>Проницаемость</b> — скорость, с которой вещество проходит через мембрану при заданной разности его концентраций. Текучесть и проницаемость — разные свойства; эта вкладка показывает, почему.", "s1_t1_cond": "Объект — искусственный бислой из одного вида фосфолипидов в водном растворе, без белков; так устроены липосомы, которые получают в лаборатории. Панель А: из каких молекул собирается бислой. Панель Б: состав и температура бислоя; показание — относительная латеральная подвижность липидов. Панель В: вещество по одну сторону бислоя; показание — проходит ли оно через бислой без белков за время наблюдения (минуты). Температуры условные: «низкая» — ниже температуры, при которой бислой из насыщенных липидов переходит в упорядоченное состояние геля; «умеренная» и «высокая» — выше неё", "s1_t1_a_part": "Что оставить у молекулы", "s1_t1_a_res_both": "Бислой: головки обращены к воде с обеих сторон, хвосты — внутрь", "s1_t1_a_res_head": "Слоя нет: молекулы растворяются в воде", "s1_t1_a_res_tail": "Слоя нет: неполярные молекулы собираются в капли", "s1_t1_a_note": "Молекулы без хвостов или без головки — условные детали для сравнения", "s1_t1_b_tails": "Хвосты фосфолипидов", "s1_t1_b_tails_sat": "насыщенные (без двойных связей)", "s1_t1_b_tails_unsat": "ненасыщенные (с цис-двойной связью)", "s1_t1_b_chol": "Холестерин", "s1_t1_b_chol_no": "нет", "s1_t1_b_chol_yes": "есть", "s1_t1_b_temp": "Температура (условно)", "s1_t1_b_temp_low": "низкая", "s1_t1_b_temp_mid": "умеренная", "s1_t1_b_temp_high": "высокая", "s1_t1_b_mob": "Латеральная подвижность липидов", "s1_t1_b_order": "Упорядоченность хвостов у головок", "s1_t1_b_state": "гель", "s1_t1_c_subst": "Вещество", "s1_t1_c_subst_O2": "кислород O₂", "s1_t1_c_subst_H2O": "вода H₂O", "s1_t1_c_subst_glc": "глюкоза", "s1_t1_c_subst_Na": "ион натрия Na⁺", "s1_t1_c_pass": "Проходит через бислой без белков", "s1_t1_c_slower": "медленнее, чем в жидком бислое", "s1_t1_c_slower_chol": "немного медленнее, чем без холестерина", "s1_t1_rules": "1) Изломы ненасыщенных хвостов мешают плотной упаковке, поэтому при той же температуре бислой из ненасыщенных липидов подвижнее. 2) При понижении температуры подвижность снижается; бислой из насыщенных липидов при низкой температуре переходит в гель. 3) Холестерин встраивается между фосфолипидами и делает упорядоченнее участки хвостов рядом с головками; в жидком бислое это немного снижает проницаемость для воды, но, по правилам модели, не меняет латеральной подвижности липидов. В бислое, который без холестерина перешёл бы в гель, холестерин мешает хвостам кристаллизоваться и сохраняет подвижность. 4) Заряженные частицы и крупные полярные молекулы проходят через бислой без белков медленно или практически не проходят при любом его состоянии: их прохождение почти не зависит от упаковки липидов", "s1_t1_how_text": "Подвижность липидов и белков в мембране живой клетки измеряют по восстановлению флуоресценции после фотообесцвечивания. Часть молекул на небольшом участке мембраны метят флуоресцентной меткой, затем короткой яркой вспышкой лазера обесцвечивают метку на этом участке. Если молекулы подвижны, меченые соседи заходят на участок, и его свечение восстанавливается; по скорости восстановления рассчитывают, насколько быстро молекулы перемещаются в плоскости мембраны", "s1_t2_s1_cond": "Панель А. Ион Ca²⁺. Снаружи его концентрация во много раз больше, чем в цитоплазме. Мембранный потенциал: внутри отрицательнее. В мембране открыт канал, пропускающий Ca²⁺", "s1_t2_s1_q": "Куда направлен пассивный перенос Ca²⁺ через канал?", "s1_t2_s1_o1": "Внутрь клетки: концентрационный и электрический вклады направлены внутрь", "s1_t2_s1_x1": "Верно. Ca²⁺ больше снаружи — концентрационный вклад направлен внутрь. Катион притягивается к отрицательной внутренней стороне — электрический вклад тоже направлен внутрь. Вклады однонаправлены, и результирующее направление определяется без чисел", "s1_t2_s1_o2": "Наружу: ион с зарядом +2 отталкивается от мембраны", "s1_t2_s1_x2": "Катион отталкивается от положительно заряженной стороны и притягивается к отрицательной. Внутренняя сторона отрицательнее, поэтому электрический вклад направлен внутрь", "s1_t2_s1_o3": "Внутрь, но только за счёт концентрационного вклада; электрический вклад для катионов не важен", "s1_t2_s1_x3": "Электрический вклад действует на любую заряженную частицу. Для Ca²⁺ он даже больше, чем для однозарядного иона при том же потенциале", "s1_t2_s1_o4": "Нельзя определить без значения мембранного потенциала", "s1_t2_s1_x4": "Числа нужны, когда вклады противоположны. Здесь оба вклада направлены внутрь, и итог определяется по направлениям", "s1_t2_s1_h1": "Где ионов больше? Куда направлен концентрационный вклад?", "s1_t2_s1_h2": "Внутренняя сторона отрицательнее. Куда тянет поле катион?", "s1_t2_s1_h3": "Если оба вклада смотрят в одну сторону, итог смотрит туда же", "s1_t2_s1_e": "Для иона всегда два вопроса: где его больше и куда его тянет электрическое поле мембраны. Если ответы совпадают, направление пассивного переноса известно без расчёта. Концентрация Ca²⁺ в цитоплазме очень низкая, и электрохимический градиент Ca²⁺ на плазматической мембране направлен внутрь; открытие Ca²⁺-каналов вызывает быстрый вход Ca²⁺, который служит внутриклеточным сигналом (вторичным посредником, <a href=\"seminar-1-route.html#bio-1-27\" target=\"_blank\" rel=\"noopener\">«Вторичные посредники и усиление сигнала»</a>)", "s1_t2_s1_bio": "11", "s1_t2_s2_cond": "Те же условия, но в мембране нет канала, пропускающего Ca²⁺", "s1_t2_s2_q": "Что произойдёт с Ca²⁺?", "s1_t2_s2_o1": "Перенос через мембрану практически не идёт: движущая сила есть, но нет пути", "s1_t2_s2_x1": "Верно. Электрохимический градиент — причина, по которой ион пошёл бы внутрь, а белковый путь — условие, без которого он пройти не может. Бислой для ионов практически непроницаем", "s1_t2_s2_o2": "Ca²⁺ войдёт через бислой, потому что оба вклада направлены внутрь", "s1_t2_s2_x2": "Направление движущей силы не создаёт пути. Заряженная частица не входит в неполярную середину бислоя независимо от того, насколько велика движущая сила", "s1_t2_s2_o3": "Движущая сила исчезнет, раз ион не может пройти", "s1_t2_s2_x3": "Движущая сила определяется концентрациями и потенциалом, и они не изменились. Если открыть канал, перенос начнётся сразу — именно потому, что сила сохранилась", "s1_t2_s2_o4": "Ca²⁺ пройдёт через аквапорины", "s1_t2_s2_x4": "Аквапорин пропускает воду, но не ионы: его пора слишком узка для иона с гидратной оболочкой", "s1_t2_s2_h1": "Что нужно иону, кроме причины двигаться?", "s1_t2_s2_h2": "Через какую часть мембраны может пройти ион?", "s1_t2_s2_h3": "Сила и путь — разные условия; для потока нужны оба", "s1_t2_s2_e": "Поток иона через мембрану требует двух условий: движущей силы (электрохимического градиента) и проницаемости (открытого канала или работающего переносчика). Изменение проницаемости меняет скорость переноса, но не его направление: направление задаёт градиент", "s1_t2_s2_bio": "10 11", "s1_t2_s3_cond": "Панель А. Ион K⁺. Концентрации снаружи и внутри одинаковы. Мембранный потенциал: внутри положительнее (такое бывает кратковременно при возбуждении клетки). Канал для K⁺ открыт", "s1_t2_s3_q": "Будет ли пассивный перенос K⁺, и если да, то куда?", "s1_t2_s3_o1": "Да, наружу: остаётся электрический вклад", "s1_t2_s3_x1": "Верно. Концентрационного вклада нет, но катион отталкивается от положительной внутренней стороны. Для заряженной частицы равенство концентраций ещё не означает отсутствия движущей силы", "s1_t2_s3_o2": "Нет: концентрации одинаковы, значит градиента нет", "s1_t2_s3_x2": "Нет концентрационного градиента, но есть электрохимический: его электрический вклад направлен наружу", "s1_t2_s3_o3": "Да, внутрь: катион всегда притягивается в клетку", "s1_t2_s3_x3": "Катион притягивается к отрицательной стороне. Здесь отрицательна наружная сторона, и поле выталкивает K⁺ из клетки", "s1_t2_s3_o4": "Да, в обе стороны поровну", "s1_t2_s3_x4": "Встречные переходы поровну — это равновесие, когда вклады уравновешены. Здесь есть только один вклад, и он направлен наружу", "s1_t2_s3_h1": "Какой вклад исчез, когда концентрации сравнялись?", "s1_t2_s3_h2": "Какая сторона мембраны положительна? Куда поле толкает катион?", "s1_t2_s3_h3": "Одинаковые концентрации — ещё не равновесие для иона", "s1_t2_s3_e": "Для незаряженной молекулы равенство концентраций означает отсутствие движущей силы. Для иона — нет: если мембрана заряжена, электрический вклад остаётся. Поэтому для иона нельзя заменить вопрос «куда он пойдёт пассивно?» вопросом «где его больше?»", "s1_t2_s3_bio": "11", "s1_t2_s4_cond": "Панель А. Ион Na⁺. Снаружи его больше, чем внутри. Мембранный потенциал: внутри положительнее (кратковременно, при возбуждении клетки). Канал для Na⁺ открыт. Величины концентраций и потенциала не указаны", "s1_t2_s4_q": "Куда пойдёт Na⁺?", "s1_t2_s4_o1": "Нельзя определить: вклады противоположны, величины неизвестны", "s1_t2_s4_x1": "Верно. Концентрационный вклад направлен внутрь, электрический — наружу. При противоположных вкладах результат зависит от того, какой из них больше; без значений концентраций и потенциала (или прямого измерения переноса) итог назвать нельзя", "s1_t2_s4_o2": "Внутрь: снаружи Na⁺ больше", "s1_t2_s4_x2": "Это верно только для концентрационного вклада. Электрический вклад для катиона при положительной внутренней стороне направлен наружу и может быть равен концентрационному или больше его", "s1_t2_s4_o3": "Наружу: внутренняя сторона положительна, катион выталкивается", "s1_t2_s4_x3": "Это только электрический вклад. Концентрационный направлен навстречу ему, и без величин нельзя сказать, какой больше", "s1_t2_s4_o4": "Никуда: противоположные вклады всегда уравновешивают друг друга", "s1_t2_s4_x4": "Противоположные вклады уравновешиваются только при определённом потенциале — равновесном для этого иона. При других значениях один из вкладов больше", "s1_t2_s4_h1": "Куда направлен каждый вклад по отдельности?", "s1_t2_s4_h2": "Если вклады противоположны, что нужно знать, чтобы назвать итог?", "s1_t2_s4_h3": "Сравнить нельзя то, что не измерено", "s1_t2_s4_e": "Правило «нельзя угадывать знак» важно для любой задачи: если вклады противоположны, нужны величины. Как их сравнивают численно, показывает продвинутый уровень этой вкладки (учебная модель встречных переходов); в физиологии для этого используют равновесный потенциал иона — значение мембранного потенциала, при котором электрический вклад точно уравновешивает концентрационный", "s1_t2_s4_bio": "11 13", "s1_t2_s5_cond": "Панель А. Ион K⁺, внутри его больше. Мембранный потенциал равен равновесному для K⁺: электрический вклад (внутрь) равен по величине концентрационному (наружу). Канал для K⁺ открыт. Схема скрыта до ответа", "s1_t2_s5_q": "Что происходит с ионами K⁺ в канале?", "s1_t2_s5_o1": "Проходят в обе стороны поровну; итог — ноль", "s1_t2_s5_x1": "Верно. Равенство вкладов не останавливает движение отдельных ионов: они по-прежнему случайно попадают в канал с обеих сторон. Нулевым становится только результирующий поток — разность встречных потоков", "s1_t2_s5_o2": "Ионы перестают проходить через канал", "s1_t2_s5_x2": "Канал открыт, и ионы продолжают в него попадать. Подробно эта разница — нулевой результирующий поток и отсутствие движения — разбирается на продвинутом уровне", "s1_t2_s5_o3": "K⁺ выходит, потому что внутри его больше", "s1_t2_s5_x3": "Концентрационный вклад действительно направлен наружу, но электрический вклад той же величины направлен внутрь. Итог — ноль", "s1_t2_s5_o4": "K⁺ входит, потому что внутри отрицательно", "s1_t2_s5_x4": "Электрический вклад направлен внутрь, но он уравновешен концентрационным. Итог — ноль", "s1_t2_s5_h1": "Что значит «вклады равны и противоположны»?", "s1_t2_s5_h2": "Канал открыт — могут ли ионы в него попадать?", "s1_t2_s5_h3": "Нулевой итог — это равенство встречных потоков", "s1_t2_s5_e": "Такое состояние называют электрохимическим равновесием иона. Оно динамическое: переходы через канал продолжаются в обе стороны, но уравновешены. В покое многих клеток K⁺ находится близко к равновесию, потому что мембрана хорошо проницаема для него через каналы утечки K⁺; это и создаёт основную часть мембранного потенциала покоя (вкладка 3)", "s1_t2_s5_bio": "12 13", "s1_t2_s6_cond": "Панель Б. Клетку перенесли в раствор, где концентрация эффективных осмолитов ниже, чем в цитоплазме. Сравнивают две клетки: без аквапоринов и с аквапоринами в мембране. Всё остальное одинаково", "s1_t2_s6_q": "Чем будет различаться перенос воды в двух клетках?", "s1_t2_s6_o1": "В обеих вода идёт в клетку, клетки набухают; с аквапоринами — быстрее", "s1_t2_s6_x1": "Верно. Направление переноса воды задаёт осмотический градиент, одинаковый в обеих клетках. Аквапорины увеличивают водную проницаемость мембраны, и вода переходит быстрее; конечное состояние в модели одинаково, различается время его достижения", "s1_t2_s6_o2": "Вода идёт только в клетку с аквапоринами", "s1_t2_s6_x2": "Вода проходит и через бислой без белков, только медленнее. Клетка без аквапоринов тоже набухает", "s1_t2_s6_o3": "В клетке с аквапоринами вода идёт наружу, потому что канал выпускает воду", "s1_t2_s6_x3": "Канал не задаёт направления: вода идёт через него туда, куда направлен осмотический градиент, — в раствор с большей концентрацией эффективных осмолитов, то есть в цитоплазму", "s1_t2_s6_o4": "Различий нет: аквапорины работают только в почках", "s1_t2_s6_x4": "Аквапорины есть во многих клетках; в модели они встроены в мембрану одной из клеток, и это меняет скорость переноса воды", "s1_t2_s6_h1": "Где эффективных осмолитов больше — снаружи или внутри?", "s1_t2_s6_h2": "Что меняет аквапорин — направление или скорость?", "s1_t2_s6_h3": "Путь меняет скорость, градиент — направление", "s1_t2_s6_e": "Аквапорин увеличивает проницаемость мембраны для воды, не меняя движущей силы. Поэтому при одинаковом осмотическом градиенте клетка с аквапоринами меняет объём быстрее. В организме это важно для клеток, переносящих много воды: например, в почках количество аквапоринов в плазматической мембране меняется под действием антидиуретического гормона (вазопрессина)", "s1_t2_s6_bio": "14 15", "s1_t2_s7_cond": "Панель Б. Клетка с аквапоринами в растворе, где снаружи больше NaCl, чем в цитоплазме (раствор гипертонический). Вода выходит из клетки через бислой и аквапорины", "s1_t2_s7_q": "Проходят ли ионы Na⁺ через аквапорины вместе с водой?", "s1_t2_s7_o1": "Нет: гидратированный ион не помещается в пору", "s1_t2_s7_x1": "Верно. Аквапорины избирательно проницаемы для воды. Ионы Na⁺, K⁺, Ca²⁺, Cl⁻ и даже протоны через них не проходят", "s1_t2_s7_o2": "Да: Na⁺ меньше молекулы воды", "s1_t2_s7_x2": "Голый ион Na⁺ мал, но в воде он окружён гидратной оболочкой, которая в узкую пору не помещается, а сбросить её внутри поры энергетически крайне невыгодно", "s1_t2_s7_o3": "Да: где проходит вода, там проходят и растворённые в ней вещества", "s1_t2_s7_x3": "Аквапорин — не отверстие, через которое течёт раствор. Его пора пропускает молекулы воды цепочкой по одной и не пропускает растворённые ионы", "s1_t2_s7_o4": "Да, но только наружу, вместе с выходящей водой", "s1_t2_s7_x4": "Направление тут ни при чём: ион не проходит через пору аквапорина ни в одну сторону", "s1_t2_s7_h1": "Чем окружён ион в воде?", "s1_t2_s7_h2": "Насколько узкая пора аквапорина?", "s1_t2_s7_h3": "Вода — по одной молекуле; гидратированный ион не помещается", "s1_t2_s7_e": "Аквапорины пропускают воду быстро, но, в отличие от ионных каналов, не пропускают ионы, в том числе протоны: ни Na⁺, ни другие неорганические ионы через их поры не входят в клетку и не выходят из неё. Однако при выходе воды объём клетки уменьшается, и концентрации ионов в цитоплазме при неизменном их количестве немного возрастают; поэтому мембранный потенциал может измениться косвенно. Модель показывает избирательность поры, а не весь ответ клетки на перенос в гипертонический раствор", "s1_t2_s7_bio": "14 15", "s1_t2_rev_q": "В мембране открыли каналы для иона Y. Результирующего переноса Y через мембрану не наблюдается. Какие объяснения совместимы с наблюдением?", "s1_t2_rev_o1": "Электрохимический градиент Y равен нулю: например, его концентрационный и электрический вклады уравновешены", "s1_t2_rev_x1": "Совместимо: при равновесии встречные потоки равны", "s1_t2_rev_o2": "Концентрации Y по сторонам одинаковы, и мембранный потенциал равен нулю", "s1_t2_rev_x2": "Совместимо: нет ни одного вклада, движущей силы нет", "s1_t2_rev_o3": "Каналы открыты, но ион Y через бислой не проходит", "s1_t2_rev_x3": "Это верно, но не объясняет отсутствия потока: ион идёт через каналы, а не через бислой", "s1_t2_rev_o4": "Каналы пропускают воду, поэтому ион не идёт", "s1_t2_rev_x4": "Перенос воды не мешает переносу иона через его собственный канал. Водные и ионные каналы — разные белки", "s1_t2_rev_e": "Отсутствие результирующего потока при открытых каналах означает, что электрохимический градиент иона равен нулю. Различить два совместимых объяснения можно, измерив концентрации иона по обе стороны и мембранный потенциал", "s1_t2_expl": "Пассивный перенос веществ через мембрану идёт по градиенту: для незаряженной молекулы — по концентрационному, для иона — по электрохимическому, который складывается из концентрационного и электрического вкладов. Мембранный потенциал создаётся очень небольшим числом ионов, прошедших через мембрану, и почти не меняет их концентраций, но сильно влияет на перенос любого иона. Если вклады однонаправлены, итог ясен по направлениям; если противоположны — нужны величины; при равновесии результирующего переноса нет, хотя ионы продолжают переходить через канал в обе стороны. Белки — каналы и переносчики — создают путь, но не меняют направления пассивного переноса. Вода проходит через бислой медленно и через аквапорины быстро; направление её переноса задаёт осмотический градиент, а аквапорины ионы не пропускают", "s1_t2_limits": "Модель не показывает величины вкладов и не рассчитывает их: стрелки показывают только направления. Не показаны другие ионы и их каналы, насосы и переносчики, которые одновременно работают в мембране; то, как открываются и закрываются каналы; насыщение переносчиков. В панели «Вода» клетка не регулирует свой объём, цитоплазма не сопротивляется изменению объёма, а концентрации ионов в цитоплазме при изменении объёма не пересчитываются; в клетках животных изменение объёма меняет эти концентрации, а его величина зависит и от состояния цитоплазмы, и от переноса ионов, которым клетка частично восстанавливает объём. Работа Na⁺/K⁺-АТФазы, поддерживающая объём при постоянной внешней осмолярности, в панели не показана. Конечный объём в модели одинаков с аквапоринами и без них — так задано допущением модели", "s1_t2_title": "2. Пассивный транспорт ионов и осмотическое движение воды", "s1_t2_pre": "<b>Пассивный транспорт</b> идёт без прямых затрат энергии клетки и только «под горку» — в направлении, в котором выравниваются различия. <b>Простая диффузия</b> — перенос через бислой без белков (вкладка 1). <b>Облегчённая диффузия</b> — пассивный перенос с участием мембранного белка. Белки бывают двух классов. <b>Канал</b> образует в мембране сквозную заполненную водой пору; когда канал открыт, через неё одна за другой проходят частицы подходящего размера и заряда. <b>Переносчик</b> связывает переносимую молекулу и меняет конформацию так, что участок связывания открывается то на одну, то на другую сторону мембраны; поэтому переносчик работает медленнее канала, и при высокой концентрации вещества все переносчики заняты — скорость переноса перестаёт расти (<b>насыщение</b>).\nДля незаряженной молекулы направление пассивного переноса задаёт <b>концентрационный градиент</b> — разность концентраций по сторонам мембраны: вещество переходит туда, где его меньше. Для иона важно ещё и то, что мембрана заряжена: по разные её стороны есть небольшой избыток зарядов разного знака. Эту разность электрических потенциалов называют <b>мембранным потенциалом</b>; его указывают для внутренней стороны относительно внешней, и у плазматической мембраны в покое внутренняя сторона отрицательнее (обычно от −20 до −120 мВ в зависимости от типа клетки). Электрическое поле мембраны притягивает катион к отрицательной стороне и отталкивает от неё анион. Совместное действие концентрационного и электрического вкладов называют <b>электрохимическим градиентом</b> иона; пассивный перенос иона идёт по нему, а не только по концентрационному градиенту.\n<b>Осмос</b> — перенос воды через мембрану из раствора с меньшей концентрацией частиц, которые через мембрану не проходят, в раствор с большей их концентрацией. Такие частицы называют <b>эффективными осмолитами</b>. <b>Осмотическое давление</b> раствора — давление, которое нужно приложить к нему, чтобы остановить поступление в него воды через мембрану из чистой воды. <b>Аквапорин</b> — белок-канал для воды.", "s1_t2_cond": "Объект — участок плазматической мембраны условной клетки животного. Панель А — один вид иона: где е
