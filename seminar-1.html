    const key = o.pump === 'stop' ? 's1_tl3a_stop' : 's1_tl3a_run';
    return { init: Object.assign({}, o, { t: 0 }), keys: ts.map(() => key), stop: n, stopKey: null, st: ts.map((tt, i) => i === n - 1 ? o : Object.assign({}, o, { t: tt })) };
  }
  const mask = () => `<rect width="600" height="420" fill="var(--surface)"/>`;
  return { scen, vals, draw, plan, mask, r0 };
})();

/* =====================================================================
   s1a_a4.js — схемы и график исследования 4 (03, И4.6; 07, разд. 2.8, 3, 5). Модель — OC.a4_run / OC.a4_metrics (шаг 0,01),
   здесь только рисунок. Слева две цепочки на участках бислоя BF (сверху внеклеточная среда, снизу цитоплазма):
   система 1 — лиганд → рецептор — ионный канал → ответ; система 2 — лиганд → рецептор (7 трансмембранных участков) →
   G-белок → фермент → посредник → ответ. Справа — график ответа 0–100 во времени 0–60 (система 1 — сплошная, система 2 —
   пунктир), серая полоса — время действия лиганда, пунктиры на уровнях 10 и 50. Кадр момента t: лиганд есть при t < Tl,
   канал открыт по доле O(t), значков посредника — по его количеству M(t). До ответа в шаге (S1F.waiting) кривые не рисуются.
   ===================================================================== */
const A4 = (function () {
  const { C, f, G, T, arrow, sides, channel, recChannel, gpcr, gprot, lig, waiting } = S1F;
  const CACHE = {};
  const TC = { fast: 0.2, slow: 2.0 };
  /* ряд модели: [t, ответ канала, ответ цепи], а также посредник M(t) для кадра (тот же расчёт, что OC.a4_run) */
  function run(o) {
    const key = [o.Tl, o.tm, o.des, o.tc].join('|');
    if (!CACHE[key]) { const s = OC.a4_run(o.Tl, o.tm, o.des, TC[o.tc]); CACHE[key] = { s, m1: OC.a4_metrics(s, 0), m2: OC.a4_metrics(s, 1), M: mess(o) }; }
    return CACHE[key];
  }
  function mess(o) {   /* количество посредника M(t) — тот же интегратор, что OC.a4_run (07, 2.8; правило 3) */
    const td = { none: Infinity, slow: 20, fast: 3 }[o.des], dt = 0.01, out = []; let A = 0, M = 0;
    for (let i = 0; i <= 6000; i++) { const tt = i * dt; out.push(M); const d = (tt < o.Tl ? 1 : 0) * (td !== Infinity ? Math.exp(-tt / td) : 1); A += dt * (d - A) / 0.2; M += dt * ((10 / o.tm) * A - M / o.tm); }
    return out;
  }
  const at = (arr, tt) => arr[Math.max(0, Math.min(arr.length - 1, Math.round(tt / 0.01)))];
  const x0 = 334, w = 250, y0 = 70, h = 250, X = tt => x0 + tt / 60 * w, Yv = v => y0 + h - v / 100 * h;
  function chains(o, R) {
    const tt = o.t == null ? 60 : o.t, ligOn = tt < o.Tl, O = at(R.s, tt)[1] / 100, M = at(R.M, tt);
    let s = sides(210, { out: t('lbl_out'), in: t('lbl_cytosol') }).replace(/width="600"/g, 'width="300"');
    /* система 1 */
    s += T(14, 44, t('s1_a4_d_sys1'), { a: 'l', size: 11, w: 700, n: 16 }) + G('pm', BF.line(10, 120, 210));
    s += recChannel(64, 210, { open: O > .5 }) + (ligOn ? lig(56, 178) + lig(72, 178) : '');
    if (O > .05) s += G('na', arrow(64, 168, 64, 246, 'var(--akt)', 1 + 3 * O, { head: 7 }));
    s += T(64, 270, t('s1_a4_d_resp') + ': ' + (waiting() ? '…' : String(Math.round(at(R.s, tt)[1]))), { size: 11 });
    /* система 2 */
    s += T(146, 44, t('s1_a4_d_sys2'), { a: 'l', size: 11, w: 700, n: 22 }) + G('pm', BF.line(140, 296, 210));
    s += gpcr(172, 210) + (ligOn ? lig(172, 178) : '');
    s += gprot(198, 236, { off: !ligOn }) + G('enz', `<rect x="236" y="194" width="34" height="32" rx="8" fill="${ligOn ? C.adapt : 'var(--line)'}"/>`) + T(253, 188, t('s1_a4_d_enz'), { size: 10.5 });
    /* посредник: значков ∝ M (порог 1 у. е.; 10 — стационарный уровень) */
    const n = Math.min(10, Math.round(M));
    for (let i = 0; i < n; i++) s += G('second', `<circle cx="${f(214 + (i % 5) * 14)}" cy="${f(262 + Math.floor(i / 5) * 14)}" r="4" fill="${C.copi}"/>`);
    s += T(242, 304, t('s1_a4_d_mess'), { size: 10.5 }) + T(222, 330, t('s1_a4_d_resp') + ': ' + (waiting() ? '…' : String(Math.round(at(R.s, tt)[2]))), { size: 11 });
    return s;
  }
  function plot(o, R, extra) {
    let s = `<rect x="302" y="0" width="298" height="420" fill="var(--surface)"/>` + T(450, 18, t('s1_a4_plot'), { size: 12.5, w: 700, col: 'var(--muted)' });
    s += `<rect x="${f(X(0))}" y="${y0}" width="${f(X(Math.min(60, o.Tl)) - X(0))}" height="${h}" fill="var(--line)" opacity=".55"/>`;
    s += `<rect x="${x0}" y="${y0 - 22}" width="12" height="9" fill="var(--line)"/>` + T(x0 + 16, y0 - 13, t('s1_a4_d_lig'), { a: 'l', size: 10.5, col: 'var(--muted)' });
    s += `<line x1="${x0}" y1="${y0 + h}" x2="${x0 + w}" y2="${y0 + h}" stroke="var(--edge)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 + h}" stroke="var(--edge)"/>`;
    [10, 50, 100].forEach(v => { s += `<line x1="${x0}" y1="${f(Yv(v))}" x2="${x0 + w}" y2="${f(Yv(v))}" stroke="var(--muted)" stroke-dasharray="${v === 100 ? '1 0' : '4 3'}" opacity="${v === 100 ? .25 : .7}"/>` + T(x0 - 4, Yv(v) + 4, String(v), { a: 'r', size: 10.5, col: 'var(--muted)' }); });
    [0, 20, 40, 60].forEach(v => { s += T(X(v), y0 + h + 16, String(v), { size: 10.5, col: 'var(--muted)' }); });
    s += T(x0 + w / 2, y0 + h + 34, t('s1_a4_d_axis'), { size: 11, col: 'var(--muted)', it: true });
    if (!waiting()) {
      const tmax = o.t == null ? 60 : o.t;
      const line = (idx, dash, col) => { const pts = []; for (let i = 0; i <= Math.round(tmax / 0.1); i++) { const tt = i * 0.1, r = at(R.s, tt); pts.push(f(X(tt)) + ',' + f(Yv(r[idx]))); } return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.6"${dash ? ' stroke-dasharray="7 4"' : ''}/>`; };
      s += G('recch', line(1, false, C.actin)) + G('gpcr', line(2, true, C.rec));
      if (extra) extra.forEach(([o2, lab], j) => { const R2 = run(o2), pts = []; for (let i = 0; i <= 600; i++) { const tt = i * 0.1; pts.push(f(X(tt)) + ',' + f(Yv(at(R2.s, tt)[2]))); }
        s += G('second', `<polyline points="${pts.join(' ')}" fill="none" stroke="${C.rec}" stroke-width="1.6" stroke-dasharray="3 3" opacity=".75"/>`) + T(X(Math.min(52, R2.m2[3] || 1)) + 3, Yv(100) + 26 + 13 * j, lab, { a: 'l', size: 10, col: C.rec }); });
        if (extra) s += T(X(Math.min(52, R.m2[3] || 1)) + 3, Yv(100) + 52, t('s1_a4_d_tm', { v: o.tm }), { a: 'l', size: 10, w: 700, col: C.rec });
    }
    /* легенда кривых — под графиком, не на кривых */
    s += `<line x1="320" y1="372" x2="344" y2="372" stroke="${C.actin}" stroke-width="2.6"/>` + T(350, 376, t('s1_a4_d_leg1'), { a: 'l', size: 11 }) +
      `<line x1="320" y1="392" x2="344" y2="392" stroke="${C.rec}" stroke-width="2.6" stroke-dasharray="7 4"/>` + T(350, 396, t('s1_a4_d_leg2'), { a: 'l', size: 11 });
    if (o.des !== 'none') s += G('desens', T(584, 36, t('s1_a4_des') + ': ' + t('s1_a4_des_' + o.des), { a: 'r', size: 10.5, col: 'var(--muted)' }));
    return s;
  }
  function draw(o) {
    const R = run(o);
    const extra = o.cmpTm ? [1, 5, 20].filter(v => v !== o.tm).map(v => [Object.assign({}, o, { tm: v }), t('s1_a4_d_tm', { v })]) : null;
    return chains(o, R) + plot(o, R, extra);
  }
  /* анимация (07, разд. 5): моменты времени до 30 условных единиц — лиганд, открытие канала, накопление и исчезновение посредника */
  function plan(o) {
    if (o.cmpTm) return null;
    const ts = [0.5, Math.min(o.Tl, 30), Math.min(o.Tl + 2, 40), Math.min(o.Tl + 8, 50), 60].filter((v, i, a) => i === 0 || v > a[i - 1]);
    const keys = ts.map(tt => tt < o.Tl ? 's1_tl4a_lig' : 's1_tl4a_after');
    return { init: Object.assign({}, o, { t: 0 }), keys, stop: ts.length, stopKey: null, st: ts.map((tt, i) => i === ts.length - 1 ? o : Object.assign({}, o, { t: tt })) };
  }
  const fmt2 = v => v == null ? '—' : v.toFixed(2).replace('.', ','), fmt1 = v => v == null ? '—' : v.toFixed(1).replace('.', ',');
  const mask = () => `<rect width="600" height="420" fill="var(--surface)"/>`;
  return { run, draw, plan, mask, fmt2, fmt1 };
})();

/* =====================================================================
   s1a_t1.js — схемы вкладки 1 (02, 1.5; 07, разд. 1.3, 3, 4.1). Модель — OC.s1 (s0_oc_m.js); здесь только рисунок.
   Панель А «Сборка в воде» (конструктор): both — замкнутая липосома (бислой BF), head — головки рассеяны, tail — капли.
   Панель Б «Состояние бислоя»: бислой s1_bilayer (хвосты прямые / изогнутые / с изломом; шаг 7,0 у геля и жидкого
   упорядоченного; холестерин) и увеличенный участок; шкалы подвижности (5 делений) и упорядоченности (3 деления).
   Панель В «Прямой путь через бислой»: вещество сверху (снаружи липосомы), под бислоем — прошедшее за время наблюдения.
   Липосомы — искусственный бислой: подписи «снаружи липосомы» / «внутри липосомы» (AT-13). Структурных формул нет.
   ===================================================================== */
const T1 = (function () {
  const { C, f, G, T, arrow, s1_bilayer, sline, lipoSides, ion, water, o2, glc, levelBar, waiting } = S1F;
  const Lp = () => ({ out: t('lbl_lipo_out'), in: t('lbl_lipo_in') });
  /* вид бислоя по состоянию модели (02, 1.5: гель — хвосты прямые, плотно; жидкий — изогнуты; с холестерином — промежутки заполнены) */
  function look(tails, chol, temp) {
    const st = OC.s1_state(tails, chol, temp);
    const shape = st === 'gel' || st === 'lo' ? 'straight' : tails === 'unsat' ? 'kinked' : 'wavy';
    return { st, tails: shape, pitch: st === 'gel' || st === 'lo' ? 7 : 8.5, chol: !!chol };
  }
  const title = (k, x = 12, y = 18) => T(x, y, t(k), { a: 'l', size: 14.5, w: 700, col: 'var(--muted)' });
  /* одна молекула фосфолипида (значок набора деталей) */
  function lipid(x, y, part = 'both', s = 1.6) {
    let q = '';
    if (part !== 'tail') q += G('head', `<circle cx="${f(x)}" cy="${f(y)}" r="${f(3.4 * s)}" fill="${C.head}"/>`);
    if (part !== 'head') q += G('tail', [-1.6, 1.6].map(dx => { const pts = []; for (let i = 0; i <= 8; i++) { const u = i / 8; pts.push(f(x + dx * s + Math.sin(u * Math.PI * 2) * 1.6 * s) + ',' + f(y + 3.4 * s + u * 9 * s)); } return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="${f(1.5 * s * .8)}"/>`; }).join(''));
    return q;
  }

  /* ---------- панель А ---------- */
  function drawA(o) {
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>` + title('s1_t1_pA');
    /* набор деталей: молекула с выбранными частями */
    s += `<rect x="16" y="44" width="118" height="96" rx="10" fill="var(--surface-2)" stroke="var(--line)"/>` + T(75, 62, t('s1_t1_kit'), { size: 11, col: 'var(--muted)' }) +
      G('pl', lipid(75, 82, o.part, 2.2));
    const wat = [[180, 70], [585, 140], [520, 360], [200, 380], [90, 300], [570, 250], [150, 200]];
    s += wat.map(([x, y]) => water(x, y)).join('');
    if (o.part === 'both') {
      const cx = 340, cy = 225, R = 112, stage = o.stg == null ? 9 : o.stg;
      if (stage >= 4) {
        s += `<circle cx="${cx}" cy="${cy}" r="${R - 12}" fill="${C.lumen}"/>` + G('lipo', BF.bilayerPts(BF.circlePts(cx, cy, R), { closed: true }));
        s += G('lipo', `<text class="area" x="${cx}" y="${cy + 4}" text-anchor="middle">${S1F.esc(t('lbl_lipo_in'))}</text><text class="area" x="${cx + 96}" y="${cy - R - 10}">${S1F.esc(t('lbl_lipo_out'))}</text>`);
        s += [[cx - 30, cy - 40], [cx + 36, cy + 30], [cx - 10, cy + 52]].map(([x, y]) => water(x, y)).join('');
      } else if (stage === 3) s += G('bilayer', sline(200, 480, cy)) + G('bilayer', `<text class="area" x="200" y="${cy - 26}">${S1F.esc(t('lbl_lipo_out'))}</text>`);
      else if (stage === 2) s += [[260, 200], [340, 230], [420, 205]].map(([x, y]) => G('drop', lipidCluster(x, y))).join('');
      else s += scattered('both');
    } else if (o.part === 'head') s += scattered('head');
    else if (o.stg === 1) s += scattered('tail');   /* первый кадр анимации «только хвосты»: хвосты рассеяны в воде */
    else s += [[250, 170, 30], [400, 240, 36], [300, 320, 24]].map(([x, y, r]) => G('drop', drop(x, y, r))).join('');
    s += T(300, 408, t('s1_t1_a_note'), { size: 11.5, col: 'var(--muted)', it: true });
    return s;
  }
  function scattered(part) { const P = [[200, 120], [280, 160], [360, 110], [450, 150], [230, 250], [330, 280], [430, 260], [520, 200], [270, 350], [390, 340], [480, 320]];
    return P.map(([x, y], i) => G(part === 'head' ? 'head' : 'pl', `<g transform="rotate(${(i * 47) % 360} ${x} ${y})">${lipid(x, y, part, 1.4)}</g>`)).join(''); }
  function lipidCluster(x, y) { let q = ''; for (let i = 0; i < 8; i++) { const a = i / 8 * 2 * Math.PI; q += `<g transform="rotate(${f(a * 180 / Math.PI - 90)} ${f(x + Math.cos(a) * 22)} ${f(y + Math.sin(a) * 22)})">${lipid(x + Math.cos(a) * 22, y + Math.sin(a) * 22, 'both', 1.2)}</g>`; } return q; }
  /* капля неполярных молекул: только хвосты, отделены от воды */
  function drop(x, y, r) { let q = `<circle cx="${x}" cy="${y}" r="${r}" fill="#FCEBD6" stroke="${C.tail}" stroke-width=".8"/>`;
    for (let i = 0; i < 9; i++) { const a = i * 2.4, rr = (i % 3 + 1) * r / 4; const px = x + Math.cos(a) * rr * .8, py = y + Math.sin(a) * rr * .8;
      q += `<path d="M${f(px - 5)},${f(py)} q2.5,-3 5,0 t5,0" fill="none" stroke="${C.tail}" stroke-width="1.4"/>`; }
    return q; }

  /* ---------- панель Б ---------- */
  function membraneB(y, L, x0 = 40, x1 = 560) { return G(L.st === 'gel' ? 'gel' : L.st === 'lo' ? 'lo' : 'ld', s1_bilayer([[x0, y], [x1, y]], { tails: L.tails, pitch: L.pitch, chol: L.chol })); }
  function zoomB(x, y, w, L) {   /* увеличенный участок: тот же рисунок s1_bilayer, масштаб ×2,6 (вид бислоя не меняется) */
    const k = 2.6, ww = w / k;
    return `<rect x="${x}" y="${y}" width="${w}" height="104" rx="10" fill="var(--surface)" stroke="var(--line)"/>` +
      `<g transform="translate(${f(x)},${f(y + 52)}) scale(${k})"><clipPath id="zc1b_${x}"><rect x="2" y="-19" width="${f(ww - 4)}" height="38"/></clipPath><g clip-path="url(#zc1b_${x})">` +
      membraneB(0, L, -6, ww + 6) + `</g></g>` + T(x + w / 2, y + 120, t('s1_t1_zoom'), { size: 10.5, col: 'var(--muted)' });
  }
  function scales(x, y, o) {
    return G('mob', T(x, y, t('s1_t1_b_mob'), { a: 'l', size: 12, w: 600 }) + levelBar(x, y + 8, 140, o.mob + 1, 5, 'var(--mtor)') + T(x + 146, y + 17, t('s1_t1_b_mob_' + o.mob), { a: 'l', size: 11.5 })) +
      G('order', T(x, y + 44, t('s1_t1_b_order'), { a: 'l', size: 12, w: 600 }) + levelBar(x, y + 52, 120, o.ord + 1, 3, 'var(--tfeb)') + T(x + 126, y + 61, t('s1_t1_b_order_' + o.ord), { a: 'l', size: 11.5 }));
  }
  function drawB(o) {
    if (o.two) {   /* шаг 3: две мембраны с холестерином; v1.2 (Н-23): стороны подписаны у каждого фрагмента — «сторона 1 / сторона 2» (07, 1.3) */
      let s = `<rect width="600" height="420" fill="var(--surface)"/>` + title('s1_t1_pB', 200, 18);
      o.two.forEach((m, i) => { const y = 110 + i * 170, L = look(m.tails, true, m.temp);
        s += T(40, y - 42, t('s1_t1_mem' + (i + 1)), { a: 'l', size: 12.5, w: 700 }) + membraneB(y - 10, L, 40, 300) + zoomB(316, y - 62, 250, L) +
          G('lipo', `<text class="area" x="300" y="${y - 24}" text-anchor="end" style="font-size:11px">${S1F.esc(t('s1_t1_side1'))}</text><text class="area" x="300" y="${y + 17}" text-anchor="end" style="font-size:11px">${S1F.esc(t('s1_t1_side2'))}</text>`);
        if (!waiting()) s += T(40, y + 28, t('s1_t1_b_mob') + ': ' + t('s1_t1_b_mob_' + OC.s1_mobility(m.tails, true, m.temp)), { a: 'l', size: 11.5, n: 34 }); });
      return s;
    }
    let s = lipoSides(0, Lp()) + title('s1_t1_pB', 200, 18);
    const L = look(o.tails, o.chol, o.temp);
    s += membraneB(110, L) + zoomB(40, 152, 300, L);
    if (waiting()) return s;
    s += scales(340, 168, o) + G(L.st === 'gel' ? 'gel' : L.st === 'lo' ? 'lo' : 'ld', T(340, 262, t('s1_t1_b_state_' + L.st), { a: 'l', size: 13, w: 700, n: 30 }));
    return s;
  }

  /* ---------- панель В ---------- */
  const SUB = { O2: 'O2', H2O: 'H2O', glc: 'glucose', Na: 'Na+' };
  function particle(sub, x, y) { return sub === 'O2' ? o2(x, y) : sub === 'H2O' ? water(x, y, { r: 2.8 }) : sub === 'glc' ? glc(x, y) : ion(x, y, 'Na', { hyd: true, g: 'na' }); }
  const ABOVE = [[70, 70], [130, 105], [190, 65], [250, 110], [310, 70], [370, 105], [430, 68], [490, 108], [550, 72], [100, 145], [220, 150], [340, 150], [460, 150], [530, 145]];
  const BELOW = [[90, 290], [210, 320], [330, 285], [450, 318], [540, 290], [150, 360]];
  function drawV(o) {
    if (o.two) return drawTwo(o);
    const L = look(o.tails, o.chol, o.temp), [lvl, mark] = OC.s1_pass(SUB[o.sub], o.tails, o.chol, o.temp), Y = 210;
    let s = lipoSides(Y, Lp()) + title('s1_t1_pV', 300, 18);
    s += G(L.st === 'gel' ? 'gel' : L.st === 'lo' ? 'lo' : 'ld', s1_bilayer([[20, Y], [580, Y]], { tails: L.tails, pitch: L.pitch, chol: L.chol }));
    s += ABOVE.map(([x, y]) => particle(o.sub, x, y)).join('');
    if (o.sub === 'Na') s += [[160, Y - 28], [400, Y - 28]].map(([x, y]) => particle('Na', x, y) + arrow(x, y + 13, x, Y - 13, 'var(--muted)', 1.6, { head: 6 })).join('');
    const nb = [0, 1, 3, 6][lvl];
    s += BELOW.slice(0, nb).map(([x, y]) => particle(o.sub, x, y)).join('');
    if (!waiting()) s += G('perm', T(586, 372, t('s1_t1_c_pass') + ': ' + t('s1_t1_c_pass_' + lvl) + (mark ? ' (' + t('s1_t1_c_' + mark) + ')' : ''), { size: 12.5, w: 600, a: 'r', n: 46 }));
    return s;
  }
  /* шаг 4 и обратная задача: две липосомы. o.two = { mode: 's4' | 'rev', res: показывать ли результат, tails2 } */
  function drawTwo(o) {
    const m = o.two; let s = `<rect width="600" height="420" fill="var(--surface)"/>` + title('s1_t1_pV', 300, 18);
    const lip = (cx, cy, R, L) => `<circle cx="${cx}" cy="${cy}" r="${R - 10}" fill="${C.lumen}"/>` + G('lipo', s1_bilayer(BF.circlePts(cx, cy, R), { closed: true, tails: L ? L.tails : 'wavy', pitch: L ? L.pitch : 8.5 }));
    const conc = (x, y) => G('osm', `<rect x="${x - 3.2}" y="${y - 3.2}" width="6.4" height="6.4" rx="1" fill="${C.copi}"/>`);   /* v1.2 (Н-19): непроникающее вещество — как осмолиты вкладки 2 */   /* непроникающее вещество снаружи */
    if (m.mode === 's4') {
      const R1 = m.res ? 60 : 84;   /* v1.2 (Н-19): сжатие липосомы 1 заметно */
      s += lip(150, 210, R1) + T(150, 330, t('s1_t1_lipo1'), { size: 12, w: 700 }) + lip(450, 210, 84) + T(450, 330, t('s1_t1_lipo2'), { size: 12, w: 700 });
      s += [[60, 90], [90, 330], [240, 100], [250, 320], [40, 220], [260, 210]].map(([x, y]) => conc(x, y)).join('');
      s += [[150, 190], [130, 230], [170, 225]].map(([x, y]) => water(x, y)).join('');
      s += [[428, 182], [470, 186], [436, 236], [474, 240]].map(([x, y]) => conc(x, y)).join('');   /* v1.3 (автор, п. 5): сахароза внутри липосомы 2 — суммарная концентрация частиц внутри и снаружи одинакова */
      s += [[360, 100], [540, 110], [340, 300], [560, 300], [450, 96]].map(([x, y], i) => ion(x, y, i % 2 ? 'Cl' : 'Na', { hyd: true, g: i % 2 ? 'cl' : 'na' })).join('');
      if (m.res) s += [[150 - R1 - 6, 210, 150 - R1 - 34, 210], [150 + R1 + 6, 210, 150 + R1 + 34, 210], [150, 210 - R1 - 6, 150, 210 - R1 - 34]].map(a => G('water', arrow(...a, 'var(--muted)', 2))).join('');
      s += G('lipo', S1F.T(150, 206, t('lbl_lipo_in'), { cls: 'area', size: 12, n: 8 }) + `<text class="area" x="300" y="44" text-anchor="middle">${S1F.esc(t('lbl_lipo_out'))}</text>` + S1F.T(450, 206, t('lbl_lipo_in'), { cls: 'area', size: 12, n: 8 }));
      return s;
    }
    /* обратная задача: состав скрыт до ответа (одинаковый вид бислоя); после ответа — бислой 2 упакован плотнее */
    const L2 = m.res ? look('sat', false, 'low') : null, L1 = m.res ? look('unsat', false, 'mid') : null;
    s += lip(150, 210, 78, L1) + lip(450, 210, 78, L2) + T(150, 330, t('s1_t1_lipo1'), { size: 12, w: 700 }) + T(450, 330, t('s1_t1_lipo2'), { size: 12, w: 700 });
    s += [[150 - 84, 210, 150 - 120, 210], [150 + 84, 210, 150 + 120, 210], [150, 126, 150, 92]].map(a => G('water', arrow(...a, 'var(--muted)', 3))).join('');
    s += [[450 + 84, 210, 450 + 110, 210]].map(a => G('water', arrow(...a, 'var(--muted)', 1.6))).join('');
    s += [[40, 110], [270, 100], [330, 110], [560, 120]].map(([x, y]) => ion(x, y, 'Na', { hyd: true, g: 'na' })).join('');
    s += G('lipo', S1F.T(150, 206, t('lbl_lipo_in'), { cls: 'area', size: 12, n: 8 }) + `<text class="area" x="300" y="44" text-anchor="middle">${S1F.esc(t('lbl_lipo_out'))}</text>` + S1F.T(450, 206, t('lbl_lipo_in'), { cls: 'area', size: 12, n: 8 }));
    return s;
  }
  /* скрытая схема (hide / до решения) */
  const mask = () => `<rect width="600" height="420" fill="var(--surface)"/>`;
  return { look, drawA, drawB, drawV, mask, SUB };
})();

/* =====================================================================
   s1a_t2.js — схемы вкладки 2 (02, 2.5; 07, разд. 1.3, 2.2, 3, 4.2). Модели — OC.s2_ion, OC.s2_water, OC.s2_volume
   (s0_oc_m.js); здесь только рисунок.
   Панель А «Ион и мембрана»: горизонтальный бислой BF, сверху внеклеточная среда, снизу цитоплазма; значки иона 8/2 или 4/4;
   знаки «+»/«−» у поверхностей; канал внутри бислоя (без канала — сплошной бислой); справа у края — стрелки вкладов:
   синяя — концентрационный, красная — электрический, чёрная толстая — итог («?» — не определить; встречные серые —
   равновесие или нет движущей силы; перечёркнутая чёрная — пути нет). Ион через бислой не рисуется никогда.
   Панель Б «Вода»: замкнутая клетка (бислой BF по эллипсу; внутри --cyto, снаружи --surface), эффективные осмолиты,
   аквапорины в мембране (цепочка воды в поре; Na⁺ с гидратной оболочкой — у входа, снаружи поры), график объёма во
   времени без чисел на оси (V(t) — OC.s2_volume). Концентрации ионов при изменении объёма модель не пересчитывает
   (s1_t2_limits) — на схеме они и не показываются.
   Этапы анимаций: o.stg (Б1: 1 — концентрации, 2 — + конц. вклад, 3 — + электр. вклад, 4 и далее — итог;
   Б2: 1 — осмолиты, 2 — перенос воды, 3 — аквапорины, 4 — новый объём). o.stg == null — конечный кадр = статичная схема.
   ===================================================================== */
const T2 = (function () {
  const { C, f, G, T, arrow, cross, sline, ion, water, aquaporin, channel, waiting, esc } = S1F;
  const Y = 215, CH = 230;   /* средняя линия бислоя панели А, канал */
  const title = (k, x, y = 18) => T(x, y, t(k), { size: 14.5, w: 700, col: 'var(--muted)' });
  const halo = (x1, y1, x2, y2, col, w, o) => arrow(x1, y1, x2, y2, 'var(--surface)', w + 4, Object.assign({ head: Math.max(7, w * 3.2) + 2 }, o)) + arrow(x1, y1, x2, y2, col, w, o);
  const ZION = { Ca: 2, Na: 1, K: 1, Cl: -1 };

  /* ---------- панель А ---------- */
  const OUTP = [[50, 70], [110, 105], [170, 62], [300, 70], [360, 112], [410, 66], [70, 150], [330, 155]];
  const INP = [[60, 270], [130, 300], [190, 262], [300, 285], [360, 318], [410, 270], [90, 335], [250, 335]];
  /* знак мембранного потенциала: внутри отрицательнее / положительнее / 0 */
  function vmSign(o) {
    if (o.pot === 'neg' || o.pot === 'pos') return o.pot;
    if (o.pot === 'eqm') { const e = o.r[1]; if (!e) return 'zero'; return (ZION[o.ion] > 0) === (e === 'in') ? 'neg' : 'pos'; }
    return 'zero';
  }
  function signs(sg) {
    if (sg === 'zero') return '';
    const top = sg === 'neg' ? '+' : '−', bot = sg === 'neg' ? '−' : '+', col = s => s === '+' ? 'var(--bad)' : 'var(--tfeb)';
    let s = '';
    for (let x = 40; x <= 410; x += 41) { if (Math.abs(x - CH) < 22) continue;
      s += `<text x="${x}" y="${Y - 17}" text-anchor="middle" font-size="14" font-weight="700" fill="${col(top)}">${top}</text><text x="${x}" y="${Y + 28}" text-anchor="middle" font-size="14" font-weight="700" fill="${col(bot)}">${bot}</text>`; }
    return G('vm', s);
  }
  /* столбик стрелки вклада: dir 'in' (вниз, в цитоплазму) | 'out' (вверх) */
  function vArrow(x, dir, col, w, g) {
    if (!dir) return '';
    const a = dir === 'in' ? [x, Y - 46, x, Y + 46] : [x, Y + 46, x, Y - 46];
    return G(g, halo(...a, col, w));
  }
  function drawA(o) {
    const st = o.stg == null ? 9 : o.stg, wait = waiting(), r = o.r, [c, e, net, flux] = r;
    let s = S1F.sides(Y, { out: t('lbl_out'), in: t('lbl_cytosol') }) + title('s1_t2_pA', 300);
    s += G('pm', BF.line(20, 428, Y));   /* v1.2 (Н-20, Н-21): мембрана кончается до столбика стрелок вкладов — стрелки, «?» и «0» не лежат на бислое */
    if (o.ch) s += channel(CH, Y, { g: 'chan' });
    /* ионы: где больше — 8 значков, где меньше — 2; поровну — 4 и 4 */
    const nO = o.conc === 'out' ? 8 : o.conc === 'in' ? 2 : 4, nI = o.conc === 'in' ? 8 : o.conc === 'out' ? 2 : 4;
    const ik = o.icon || o.ion, io = o.icon ? { g: 'ion' } : {};   /* v1.3 (автор, п. 6): в обратной задаче — ион Y */
    s += OUTP.slice(0, nO).map(([x, y]) => ion(x, y, ik, io)).join('') + INP.slice(0, nI).map(([x, y]) => ion(x, y, ik, io)).join('');
    s += signs(vmSign(o));
    s += T(14, 382, t('s1_t2_a_vm_' + o.pot), { a: 'l', size: 12, col: 'var(--ink)' });
    if (wait) return s;
    /* стрелки вкладов у края панели (07, 1.3: синяя — концентрационный, красная — электрический, чёрная — итог) */
    const X1 = 466, X2 = 514, X3 = 562;
    s += `<rect x="442" y="${Y - 58}" width="148" height="116" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>`;
    if (st >= 2) s += c ? vArrow(X1, c, C.head, 2.6, 'cgrad') : G('cgrad', T(X1, Y - 62, t('s1_t2_v_none'), { size: 11, col: C.head }));
    if (st >= 3) s += e ? vArrow(X2, e, C.red, 2.6, 'vm') : G('vm', T(X2, Y - 62, t('s1_t2_v_none'), { size: 11, col: C.red }));
    if (st >= 4) {
      if (net === 'in' || net === 'out') {
        s += vArrow(X3, net, 'var(--ink)', 4.4, 'ecgrad');
        if (!o.ch) s += G('ecgrad', cross(X3, Y, 13));
        else s += G('ecgrad', halo(CH, net === 'in' ? Y - 30 : Y + 30, CH, net === 'in' ? Y + 30 : Y - 30, 'var(--ink)', 2.2, { head: 8 }));
      } else if (net === 'undetermined') {
        s += G('ecgrad', `<rect x="${X3 - 13}" y="${Y - 20}" width="26" height="36" rx="6" fill="var(--surface)" stroke="var(--line)"/><text x="${X3}" y="${Y + 9}" text-anchor="middle" font-size="28" font-weight="700" fill="var(--ink)">?</text>`);
        if (!o.ch) s += G('ecgrad', cross(X3, Y + 40, 9));
      } else {   /* zero_eq, zero_none: результирующего переноса нет; при открытом канале — встречные переходы через канал */
        const g = net === 'zero_eq' ? 'eqpot' : 'dyneq';
        s += G(g, `<rect x="${X3 - 12}" y="${Y - 14}" width="24" height="26" rx="6" fill="var(--surface)" stroke="var(--line)"/><text x="${X3}" y="${Y + 6}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">0</text>`);
        if (o.ch) s += G(g, halo(CH - 15, Y - 30, CH - 15, Y + 30, 'var(--muted)', 2, { head: 7 }) + halo(CH + 15, Y + 30, CH + 15, Y - 30, 'var(--muted)', 2, { head: 7 }));
      }
    }
    /* подписи стрелок — легенда под столбиком (07, 1.3: подписи не на стрелках) */
    s += [['s1_t2_a_conc_s', C.head, 2], ['s1_t2_a_el_s', C.red, 3], ['s1_t2_a_net_s', 'var(--ink)', 4]].map(([k, col, i], j) => st >= i ?
      `<rect x="426" y="${Y + 62 + j * 28}" width="12" height="4" fill="${col}"/>` + T(443, Y + 68 + j * 28, t(k), { a: 'l', size: 10.5, col, n: 16, lh: 12 }) : '').join('');
    return s;
  }

  /* ---------- панель Б ---------- */
  const CELL = { cx: 190, cy: 214, rx: 148, ry: 112 };
  function cell(cx, cy, rx, ry, k, o) {   /* k — линейный масштаб объёма */
    rx *= k; ry *= k;
    let s = G('cyto', `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="var(--cyto)"/>`) + G('cell', BF.bilayerPts(BF.ellipsePts(cx, cy, rx, ry), { closed: true }));
    if (o.aqp) s += aquaporin(cx, cy - ry) + aquaporin(cx, cy + ry);
    return { s, rx, ry };
  }
  const OSM_OUT = [[30, 70], [80, 40], [400, 60], [430, 120], [40, 360], [120, 395], [380, 380], [300, 400], [30, 240], [400, 165]];
  const osm = (x, y) => `<rect x="${f(x - 3.2)}" y="${f(y - 3.2)}" width="6.4" height="6.4" rx="1" fill="${C.copi}"/>`;   /* v1.2 (Н-19): осмолит — квадратик, не путать с водой */
  function inside(cx, cy, rx, ry) { const P = [[-.45, -.35], [.15, -.45], [.5, -.05], [-.3, .25], [.25, .4], [-.6, .05]]; return P.map(([a, b]) => osm(cx + a * rx, cy + b * ry)).join(''); }
  /* стрелки переноса воды: dir 'in' | 'out'; толщина — скорость */
  function wArrows(cx, cy, rx, ry, dir, fast) {
    if (dir === 'none') return '';
    const w = fast ? 3.6 : 1.8;
    return G('osmosis', [180, 0, 125].map(deg => { const a = deg * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
      const x0 = cx + c * (rx + 12), y0 = cy + sn * (ry + 12), x1 = cx + c * (rx + 44), y1 = cy + sn * (ry + 40);
      return dir === 'in' ? halo(x1, y1, x0, y0, 'var(--muted)', w) : halo(x0, y0, x1, y1, 'var(--muted)', w); }).join(''));
  }
  /* график объёма во времени: оси без чисел; текущая кривая — сплошная, другая (с аквапоринами / без) — пунктир */
  function plot(x, y, w, h, ton, aqp, cmp) {
    const vmin = .75, vmax = 1.25, X = tt => x + tt / 30 * w, Yv = v => y + h - (v - vmin) / (vmax - vmin) * h;
    const path = a => { let d = ''; for (let i = 0; i <= 60; i++) { const tt = i / 2; d += (i ? 'L' : 'M') + f(X(tt)) + ',' + f(Yv(OC.s2_volume(tt, ton, a))); } return d; };
    let s = `<rect x="${x - 8}" y="${y - 40}" width="${w + 16}" height="${h + (cmp ? 80 : 66)}" rx="8" fill="var(--surface)" stroke="var(--line)"/>` +
      `<path d="M${x},${y} V${y + h} H${x + w}" fill="none" stroke="var(--edge)" stroke-width="1.2"/>` +
      `<path d="M${x},${f(Yv(1))} H${x + w}" stroke="var(--line)" stroke-dasharray="3 3"/>` +
      T(x, y - 26, t('s1_t2_b_plot'), { a: 'l', size: 11, w: 600, n: cmp ? 60 : 24, lh: 13 }) + T(x + w, y + h + 16, t('s1_t2_b_time'), { a: 'r', size: 10.5, col: 'var(--muted)' });
    if (cmp) s += `<path d="${path(!aqp)}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    s += `<path d="${path(aqp)}" fill="none" stroke="var(--mtor)" stroke-width="2.6"/>`;
    if (cmp) s += T(x + 4, y + h + 32, t('s1_t2_b_leg1'), { a: 'l', size: 10, col: 'var(--mtor)' }) + T(x + w, y + h + 32, t('s1_t2_b_leg2'), { a: 'r', size: 10, col: 'var(--muted)' });
    return G('osmosis', s);
  }
  function drawB(o) {
    const st = o.stg == null ? 9 : o.stg, wait = waiting();
    if (o.two) return drawTwo(o, wait);
    const w = OC.s2_water(o.ton, o.aqp), V = st >= 4 && !wait ? OC.s2_volume(30, o.ton, o.aqp) : 1, k = Math.sqrt(V);
    let s = `<rect width="600" height="420" fill="var(--surface)"/>` + G('out', `<text class="area" x="14" y="22">${esc(t('lbl_out'))}</text>`) + title('s1_t2_pB', 300);
    const nOut = o.ton === 'hypo' ? 3 : o.ton === 'iso' ? 6 : 10;
    s += G('osm', OSM_OUT.slice(0, nOut).map(([x, y]) => o.nacl ? '' : osm(x, y)).join(''));
    if (o.nacl) s += OSM_OUT.slice(0, nOut).map(([x, y], i) => ion(x, y, i % 2 ? 'Cl' : 'Na', { hyd: i % 2 === 0 })).join('');
    const C0 = cell(CELL.cx, CELL.cy, CELL.rx, CELL.ry, k, o);
    s += C0.s + G('osm', inside(CELL.cx, CELL.cy, CELL.rx * k, CELL.ry * k)) + G('cyto', `<text class="area" x="${CELL.cx}" y="${CELL.cy + 6}" text-anchor="middle">${esc(t('lbl_cytosol'))}</text>`);
    /* Na⁺ с гидратной оболочкой у входа поры аквапорина — снаружи поры: с гидратной оболочкой ион в узкую пору не входит */
    if (o.aqp && (st >= 3 || o.nacl)) s += ion(CELL.cx + 44, CELL.cy - CELL.ry * k - 34, 'Na', { hyd: true });
    if (!wait && st >= 2) s += wArrows(CELL.cx, CELL.cy, C0.rx, C0.ry, w[0], o.aqp);
    if (!wait && st >= 3 && o.aqp && w[0] !== 'none') s += G('aqp', halo(CELL.cx - 34, w[0] === 'in' ? CELL.cy - C0.ry - 34 : CELL.cy - C0.ry + 2, CELL.cx - 34, w[0] === 'in' ? CELL.cy - C0.ry + 2 : CELL.cy - C0.ry - 34, 'var(--muted)', 1.8, { head: 7 }));
    if (!wait && st >= 4) s += plot(436, 252, 146, 108, o.ton, o.aqp, false);   /* v1.2: график — с этапа 4 Б2 («объём меняется до нового уровня»); конечный кадр не меняется */
    return s;
  }
  /* шаг 6: две клетки — без аквапоринов и с аквапоринами, одинаковый раствор */
  function drawTwo(o, wait) {
    let s = `<rect width="600" height="420" fill="var(--surface)"/>` + G('out', `<text class="area" x="14" y="22">${esc(t('lbl_out'))}</text>`) + title('s1_t2_pB', 300);
    const V = wait ? 1 : OC.s2_volume(30, o.ton, true), k = Math.sqrt(V);
    [[150, false], [450, true]].forEach(([cx, aqp]) => {
      const c0 = cell(cx, 140, 100, 70, k, { aqp });
      s += c0.s + G('osm', inside(cx, 140, 100 * k, 70 * k)) + G('cyto', `<text class="area" x="${cx}" y="${146}" text-anchor="middle">${esc(t('lbl_cytosol'))}</text>`);
      s += T(cx, 264, t(aqp ? 's1_t2_b_leg_aqp' : 's1_t2_b_leg_noaqp'), { size: 12, w: 700 });
      if (!wait) s += wArrows(cx, 140, c0.rx, c0.ry, OC.s2_water(o.ton, aqp)[0], aqp);
    });
    s += G('osm', [[30, 60], [290, 80], [570, 60], [300, 200]].map(([x, y]) => osm(x, y)).join(''));
    if (!wait) s += plot(150, 306, 300, 70, o.ton, true, true);
    return s;
  }
  const mask = () => `<rect width="600" height="420" fill="var(--surface)"/>`;
  return { drawA, drawB, mask, vmSign };
})();

/* =====================================================================
   s1a_t3.js — схемы вкладки 3 (02, 3.5; 07, разд. 1.3, 2.3, 3, 4.3). Модели — OC.s3_cycle, OC.s3_counts, OC.s3_coupled,
   OC.s3ca (s0_oc_m.js); здесь только рисунок. Мембрана — бислой BF (S1F.sides: внеклеточная среда сверху, цитоплазма снизу).
   Панель А «Цикл насоса» (конструктор): Na⁺/K⁺-АТФаза в двух конформациях (участок связывания открыт в цитоплазму или
   наружу), «Ф» на насосе — фосфатная группа, присоединённая к белку; АТФ и АДФ — значки-надписи без формул.
   Панель Б «Сопряжённый перенос»: насос — свёрнутый значок; переносчик X (симпорт / антипорт); переносчик АТФ не связан.
   Панель В «Антипорт во времени после остановки насоса»: постоянное поступление Ca²⁺ (стрелка через путь в мембране — видна
   во всех состояниях), Na⁺/Ca²⁺-обменник, четыре столбика без чисел для 1 и 60 минут (OC.s3ca; D-11).
   Ионы через бислой не проходят: каждая стрелка переноса идёт через белок.
   ===================================================================== */
const T3 = (function () {
  const { C, f, G, T, esc, arrow, cross, sides, ion, phos, pump, carrier, channel, subX, glc, waiting } = S1F;
  const L = () => ({ out: t('lbl_out'), in: t('lbl_cytosol') });
  /* ион, связанный с белком: кружок цвета иона без знака (знак не налегает на белок; ион узнаётся по цвету, как в окне обозначений) */
  const BCOL = { Na: 'var(--akt)', K: 'var(--tfeb)' };
  const bound = (x, y, kind) => G(kind.toLowerCase(), `<circle cx="${f(x)}" cy="${f(y)}" r="4" fill="${BCOL[kind]}" stroke="#fff" stroke-width=".8"/>`);
  const title = (k, x, y = 18, a = 'm') => T(x, y, t(k), { a, size: 14.5, w: 700, col: 'var(--muted)' });
  /* значок-надпись молекулы (АТФ, АДФ): без структурной формулы */
  const pill = (x, y, txt, g, col = C.copi) => G(g, `<rect x="${f(x - 19)}" y="${f(y - 10)}" width="38" height="20" rx="10" fill="#fff" stroke="${col}" stroke-width="1.6"/>` +
    `<text x="${f(x)}" y="${f(y + 4.5)}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${esc(txt)}</text>`);

  /* ---------- панель А: цикл насоса ----------
     o = { atp, na, k, n (циклов), stg (0…6 — последний выполненный этап; null — исход модели) }
     этапы: 1 связывание 3 Na⁺ изнутри; 2 фосфорилирование (АТФ → АДФ, «Ф» на насосе); 3 открытие наружу, выход 3 Na⁺;
            4 связывание 2 K⁺ снаружи; 5 дефосфорилирование («Ф» уходит в цитоплазму); 6 открытие внутрь, выход 2 K⁺ */
  function drawA(o) {
    const Y = 200, X = 300, [last, full] = OC.s3_cycle(o.atp, o.na, o.k), stg = o.stg == null ? last : o.stg;
    let s = sides(Y, L()) + title('s1_t3_pA', 300);
    s += G('pm', BF.line(20, X - 34, Y) + BF.line(X + 34, 580, Y));
    const open = stg >= 3 && stg <= 4 ? 'out' : stg === 2 || stg === 5 ? null : 'in';   /* 2 и 5 — закрыт с обеих сторон */
    s += pump(X, Y, { w: 34, h: 66, cleft: open });
    /* запасы ионов: Na⁺ в цитоплазме (слева внизу), K⁺ во внеклеточной среде (справа вверху) */
    /* v1.6 (аудит 19.11.2026): физиологические градиенты — Na⁺ больше снаружи, K⁺ больше внутри (фон, бледнее); насос переносит против них */
    s += `<g opacity=".55">` + [[385, 58], [405, 98], [380, 140], [425, 172], [560, 170], [590, 118], [590, 56], [545, 50]].map(([x, y]) => ion(x, y, 'Na')).join('') +
      [[380, 260], [430, 290], [520, 270], [560, 300], [400, 370], [540, 360], [470, 250], [350, 300]].map(([x, y]) => ion(x, y, 'K')).join('') + `</g>`;
    if (o.na) s += [[70, 300], [110, 330], [150, 300], [90, 365], [170, 350]].map(([x, y]) => ion(x, y, 'Na')).join('');
    if (o.k) s += [[440, 70], [480, 100], [520, 70], [460, 135], [530, 130]].map(([x, y]) => ion(x, y, 'K')).join('');
    else s += T(490, 112, t('s1_t3_lbl_nok'), { size: 11.5, col: 'var(--muted)', it: true });
    if (!o.atp && stg < 2) s += T(420, 360, t('s1_t3_lbl_noatp'), { size: 11.5, col: 'var(--muted)', it: true });
    if (!o.na) s += T(120, 330, t('s1_t3_lbl_nona'), { size: 11.5, col: 'var(--muted)', it: true });
    /* АТФ в цитоплазме; после этапа 2 — АДФ; «Ф» на насосе на этапах 2–4; на этапе 5–6 — свободная фосфатная группа в цитоплазме */
    if (o.atp && stg < 2) s += pill(420, 330, t('s1_t3_lbl_atp'), 'atp');
    if (stg >= 2) s += pill(420, 330, t('s1_t3_lbl_adp'), 'adp', C.grey);
    if (stg >= 2 && stg <= 4) s += G('phos', phos(X + 26, Y + 26));
    if (stg >= 5) s += G('pi', phos(380, 372)) + T(380, 396, t('s1_t3_lbl_pi'), { size: 10.5, col: 'var(--muted)' });
    /* ионы, связанные с насосом или высвобожденные */
    const naB = [[X - 8, Y + 22], [X + 6, Y + 14], [X - 4, Y + 6]];
    if (stg === 1 || stg === 2) s += naB.map(([x, y]) => bound(x, y, 'Na')).join('');
    if (stg >= 3) s += [[X - 30, Y - 64], [X - 6, Y - 78], [X + 20, Y - 62]].map(([x, y]) => ion(x, y, 'Na')).join('');
    if (stg === 4 || stg === 5) s += [[X - 5, Y - 18], [X + 7, Y - 8]].map(([x, y]) => bound(x, y, 'K')).join('');
    if (stg >= 6) s += [[X - 16, Y + 66], [X + 18, Y + 76]].map(([x, y]) => ion(x, y, 'K')).join('');
    if (stg >= 3) s += G('pump', arrow(X - 8, Y - 36, X - 22, Y - 56, 'var(--akt)', 2));
    if (stg >= 6) s += G('pump', arrow(X + 6, Y + 36, X + 12, Y + 58, 'var(--tfeb)', 2));
    if (waiting()) return s;
    /* исход: остановка (красный крест у недостающей детали) или счётчики полного цикла */
    if (!full && o.stg == null) {
      if (!o.na) s += cross(120, 300, 10); else if (!o.atp) s += cross(420, 332, 11); else if (!o.k) s += cross(490, 84, 11);
    }
    if (full && o.stg == null) {
      const c = OC.s3_counts(o.n);
      s += G('pump', `<rect x="14" y="34" width="232" height="112" rx="9" fill="var(--surface)" stroke="var(--line)"/>` +
        T(24, 52, t('s1_t3_cnt_t', { n: o.n }), { a: 'l', size: 11.5, w: 700 }) +
        [['s1_t3_cnt_na', c.Na_out], ['s1_t3_cnt_k', c.K_in], ['s1_t3_cnt_atp', c.ATP]].map(([k, v], i) => T(24, 70 + i * 15, t(k) + ': ' + v, { a: 'l', size: 11 })).join('') +
        T(24, 115, t('s1_t3_cnt_q') + ': ' + c.charge_out, { a: 'l', size: 11, n: 38, lh: 13 }));
    }
    return s;
  }

  /* ---------- панель Б: сопряжённый перенос ----------
     o = { kind: 'sym' | 'anti', grad: 'full' | 'reduced' | 'none', car, x, flux, stg (1…3 — этап В2; null — исход), rev: 'mask' | 'broken' } */
  const NA = { full: [8, 2], reduced: [5, 4], none: [4, 4] };
  function drawB(o) {
    const Y = 210, X = 330;
    let s = sides(Y, L()) + title('s1_t3_pB', 300);
    s += G('pm', BF.line(20, 64, Y) + BF.line(116, X - 24, Y) + (o.car ? BF.line(X + 24, 580, Y) : BF.line(X - 24, 580, Y)));
    s += pump(90, Y, { w: 26, h: 44 }) + T(90, Y + 46, t('s1_t3_lbl_pump'), { size: 10.5, col: 'var(--muted)' });
    /* Na⁺: снаружи и внутри — число значков по градиенту (условно) */
    const [no, ni] = NA[o.grad];
    const outP = [[160, 60], [200, 95], [240, 62], [280, 100], [420, 66], [460, 100], [500, 62], [540, 98]], inP = [[170, 330], [230, 360], [440, 340], [520, 360]];
    s += outP.slice(0, no).map(([x, y]) => ion(x, y, 'Na')).join('') + inP.slice(0, ni).map(([x, y]) => ion(x, y, 'Na')).join('');
    /* вещество X (в обратной задаче — глюкоза): при симпорте внутри больше, при антипорте снаружи больше */
    const ico = o.rev ? (x, y) => glc(x, y) : (x, y) => subX(x, y);
    const srcIn = o.kind === 'anti';   /* откуда переносят X */
    const xOut = [[180, 140], [250, 150], [440, 145]], xIn = [[200, 290], [260, 300], [400, 290], [470, 300], [530, 286], [300, 386]];
    const outN = o.kind === 'sym' ? (o.x ? 3 : 0) : 6, inN = o.kind === 'sym' ? 6 : (o.x ? 3 : 0);
    s += (o.kind === 'sym' ? xOut.slice(0, outN) : xOut.concat([[500, 150], [540, 140], [210, 115]]).slice(0, outN)).map(([x, y]) => ico(x, y)).join('');
    s += xIn.slice(0, inN).map(([x, y]) => ico(x, y)).join('');
    if (!o.car) { s += T(X, Y - 28, t('s1_t3_lbl_nocar'), { size: 11.5, col: 'var(--muted)', it: true }); return s + (waiting() ? '' : readB(o)); }
    /* переносчик: этап 1 — открыт наружу с Na⁺ и X; 2 — закрыт с обеих сторон; 3 — открыт внутрь, высвобождение (симпорт).
       Антипорт: 1 — Na⁺ снаружи в открытом наружу; 2 — открыт внутрь, Na⁺ уходит, X связывается изнутри; 3 — открыт наружу, X выходит. */
    const stg = o.stg == null ? 3 : o.stg, flowing = o.flux > 0 && !o.rev;
    let op = o.kind === 'sym' ? ['out', 'occ', 'in'][stg - 1] : ['out', 'in', 'out'][stg - 1];
    if (o.rev) op = 'occ';
    s += carrier(X, Y, { w: 22, h: 44, open: op, col: o.rev === 'mask' ? C.grey : undefined, g: o.kind === 'sym' ? 'sym' : 'anti' });
    if (o.rev === 'broken') s += cross(X, Y, 12);
    if (flowing && o.kind === 'sym') {
      if (stg === 1) s += bound(X - 6, Y - 12, 'Na') + subX(X + 7, Y - 10, 4.5);
      if (stg === 2) s += bound(X - 6, Y, 'Na') + subX(X + 7, Y + 2, 4.5);
    }
    if (flowing && o.kind === 'anti') {
      if (stg === 1) s += bound(X, Y - 12, 'Na');
      if (stg === 2) s += subX(X, Y + 12, 4.5);
    }
    /* стрелки переноса через переносчик (не через бислой): Na⁺ — внутрь по градиенту, X — против своего градиента; толщина ∝ потоку */
    if (flowing && stg === 3) {
      const w = 1.2 + 2.6 * o.flux / 100;
      s += G('sec', arrow(X - 10, Y - 70, X - 10, Y + 66, 'var(--akt)', w));
      s += G('x', o.kind === 'sym' ? arrow(X + 10, Y - 70, X + 10, Y + 66, C.copi, w) : arrow(X + 10, Y + 66, X + 10, Y - 70, C.copi, w));
      s += T(X - 18, Y - 76, t('s1_t3_lbl_na_in'), { a: 'r', size: 11, col: 'var(--akt)' }) + T(X + 18, Y - 76, t(o.kind === 'sym' ? 's1_t3_lbl_x_in' : 's1_t3_lbl_x_out'), { a: 'l', size: 11, col: C.copi });
    }
    if (o.flux === 0 && !o.rev && o.stg == null) s += cross(X, Y - 40, 9);
    return s + (waiting() || o.stg != null ? '' : readB(o));
  }
  function readB(o) {
    if (o.rev) return '';
    return G('carrier', `<rect x="318" y="370" width="270" height="42" rx="8" fill="var(--surface)" stroke="var(--line)"/>` +
      T(328, 387, t('s1_t3_b_flux') + ': ' + o.flux + ' ' + t('s1_t3_cond_u'), { a: 'l', size: 11 }) + T(328, 403, t('s1_t3_b_atp') + ': 0', { a: 'l', size: 11 }));
  }

  /* ---------- панель В: Ca²⁺ после остановки насоса ----------
     o = { tsel: '1' | '60' (60 — оба момента), stg (1 — только t = 1, 2 — оба; null — исход) } */
  function drawV(o) {
    const Y = 100, A = OC.s3ca(1), B = OC.s3ca(60);
    let s = sides(Y, L(), {}) + title('s1_t3_pV', 380);
    s += G('pm', BF.line(20, 96, Y) + BF.line(124, 406, Y) + BF.line(454, 580, Y));
    /* постоянное поступление Ca²⁺: путь в мембране и стрелка — во всех состояниях панели */
    s += channel(110, Y, { g: 'cainflow', gap: 6, w: 9 }) + G('cainflow', arrow(110, Y - 40, 110, Y + 40, 'var(--mtor)', 2.4)) + ion(126, Y - 40, 'Ca', { g: 'ca' });
    s += T(142, Y + 34, t('s1_t3_lbl_cain'), { a: 'l', size: 11, col: 'var(--mtor)', n: 24 });
    /* Na⁺/Ca²⁺-обменник: Na⁺ входит, Ca²⁺ выходит (через белок) */
    s += carrier(430, Y, { w: 20, h: 42, open: 'occ', g: 'ncx' }) + G('ncx', arrow(421, Y - 40, 421, Y + 36, 'var(--akt)', 2) + arrow(439, Y + 36, 439, Y - 40, 'var(--mtor)', 2));
    s += ion(392, Y - 40, 'Na') + ion(470, Y - 40, 'Ca', { g: 'ca' }) + T(482, Y + 34, t('s1_t3_lbl_ncx'), { a: 'l', size: 11, n: 16 });
    s += T(260, Y - 64, t('s1_t3_lbl_pumpoff'), { size: 11.5, col: 'var(--bad)', it: true });
    /* столбики: одна шкала для «поступления» и «выведения» (видно, что при t = 60 выведение ниже поступления); пунктир — исходный уровень */
    const H = 120, base = 330, both = o.tsel === '60' && (o.stg == null || o.stg >= 2) && !waiting();
    const grp = (x0, r, show, tk) => {
      let q = T(x0 + 136, 186, t(tk), { size: 12, w: 700 });
      if (!show) return q + `<rect x="${x0}" y="${base - H}" width="272" height="${H}" rx="8" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/>`;
      const bars = [['s1_t3_c_bar_g', r.G / 1, 1, 'var(--akt)', 'sec'], ['s1_t3_c_bar_in', r.inflow / OC.K_NCX, 1, 'var(--mtor)', 'cainflow'], ['s1_t3_c_bar_out', r.out / OC.K_NCX, 1, 'var(--good)', 'ncx'], ['s1_t3_c_bar_ca', r.ca / 6, 1 / 6, 'var(--tfeb)', 'ca']];
      bars.forEach(([k, v, ref, col, g], i) => { const x = x0 + 4 + i * 68, h = Math.max(2, Math.min(1, v) * H);
        q += G(g, `<rect x="${x + 3}" y="${f(base - h)}" width="34" height="${f(h)}" rx="3" fill="${col}"/>` +
          `<line x1="${x - 4}" y1="${f(base - ref * H)}" x2="${x + 44}" y2="${f(base - ref * H)}" stroke="var(--ink)" stroke-dasharray="3 3" stroke-width="1"/>` +
          T(x + 20, base + 16, t(k), { size: 9.4, n: 10, lh: 11 })); });
      return q;
    };
    s += grp(22, A, true, 's1_t3_c_t') + grp(310, B, both, 's1_t3_c_t60');
    s += T(330, 392, t('s1_t3_c_ref'), { size: 10.5, col: 'var(--muted)', it: true });
    return s;
  }
  const mask = () => `<rect width="600" height="420" fill="var(--surface)"/>`;
  return { drawA, drawB, drawV, mask };
})();

/* =====================================================================
   s1a_t4.js — схемы вкладки 4 (02, 4.5; 07, разд. 1.3, 2.4, 3, 4.4). Модель — OC.s4_chain, S4_CHAINS (s0_oc_m.js); здесь
   только рисунок. Мембрана — бислой BF (BF.line), сверху внеклеточная среда (--surface), снизу цитоплазма (.cyto).
   Панель А «Три рецептора» (конструктор): А1 рецептор — ионный канал; А2 рецептор, сопряжённый с G-белком → G-белок (α, β, γ)
   → аденилатциклаза (в мембране) → цАМФ (1 фермент → 10 значков, условно) → протеинкиназа A → белки-мишени с «Ф»;
   А3 рецепторная тирозинкиназа (два рецептора, взаимное фосфорилирование) → белки-адаптеры → киназа 1 → киназа 2.
   Удалённое звено — пустая пунктирная рамка с крестом; все звенья ниже — серые (07, 2.4).
   Панель Б «Один лиганд, две клетки»: клетка скелетной мышцы (никотиновый рецептор-канал, вход Na⁺, деполяризация) и клетка
   водителя ритма сердца (мускариновый рецептор → G-белок → βγ открывают K⁺-каналы → выход K⁺, гиперполяризация);
   swap — мысленный эксперимент: рецепторы с их цепями меняются местами.
   Кадры анимаций Г1 (А2), Г2 (А1), Г3 (Б) рисует та же функция (o.stg1, o.stg2, o.stg); null — конечный кадр = статика.
   ===================================================================== */
const T4 = (function () {
  const { C, f, G, T, arrow, cross, sides, ion, channel, recChannel, gpcr, gprot, rtk, lig, phos, waiting, esc } = S1F;
  const Y = 112;
  const Ls = () => ({ out: t('lbl_out'), in: t('lbl_cytosol') });
  const GREY = 'var(--line)';
  /* звено цепи: прямоугольник с подписью; st: 'on' | 'grey' | 'gone' */
  function box(g, cx, cy, w, h, key, st, o = {}) {
    if (st === 'gone') return G(g, `<rect x="${f(cx - w / 2)}" y="${f(cy - h / 2)}" width="${w}" height="${h}" rx="8" fill="none" stroke="var(--muted)" stroke-dasharray="5 4"/>` + cross(cx, cy, 8));
    const grey = st === 'grey';
    return G(g, `<rect x="${f(cx - w / 2)}" y="${f(cy - h / 2)}" width="${w}" height="${h}" rx="8" fill="${grey ? 'var(--surface-2)' : (o.fill || 'var(--surface)')}" stroke="${grey ? GREY : (o.stroke || 'var(--edge)')}" stroke-width="1.3"/>` +
      T(cx, cy + 4 - (o.lines ? (o.lines - 1) * 6 : 0), t(key), { size: o.size || 10.5, w: 600, n: o.n || 22, col: grey ? 'var(--muted)' : 'var(--ink)' }));
  }
  const ar = (x1, y1, x2, y2, on) => arrow(x1, y1, x2, y2, on ? 'var(--edge)' : GREY, 1.6, { head: 7 });
  /* ответ клетки: до ответа в сценарии рамка нейтральная (02, разд. 0: показания скрыты) */
  function resp(cx, w, key, ok, n) {
    const wait = waiting(), fill = wait ? 'var(--surface)' : ok ? 'var(--mtor-soft)' : 'var(--surface-2)', stroke = wait ? 'var(--edge)' : ok ? 'var(--mtor)' : GREY;
    return `<rect x="${f(cx - w / 2)}" y="322" width="${w}" height="36" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>` +
      T(cx, 336 - (n > 1 ? 0 : -4), t(key), { size: 10.5, w: 600, n: 30, col: wait || ok ? 'var(--ink)' : 'var(--muted)' });
  }
  /* модель панели А → состояние каждой колонки (OC.s4_chain) */
  function cols(o) {
    const rm2 = o.nocyto || !o.g ? 'G-белок' : !o.ac ? 'фермент' : !o.pka ? 'протеинкиназа A' : null;
    const rm3 = !o.dim ? 'второй рецептор' : o.nocyto ? 'белки-адаптеры' : null;
    const c1 = OC.s4_chain('A1', null, o.lig), c2 = OC.s4_chain('A2', rm2, o.lig), c3 = OC.s4_chain('A3', rm3, o.lig);
    return { A1: { ok: c1[0], at: c1[1] }, A2: { ok: c2[0], at: c2[1], rm: rm2 }, A3: { ok: c3[0], at: c3[1], rm: rm3 } };
  }
  /* состояние звена i цепи (0 — рецептор): звено удалено — 'gone', ниже удалённого или без лиганда — 'grey' */
  const st = (c, i, chainLen, removedIdx) => removedIdx === i ? 'gone' : (!c.ok && i > c.at) || (!c.ok && c.at === 0) ? 'grey' : 'on';

  /* ---------- панель А ---------- */
  function drawA(o) {
    const R = cols(o);
    let s = sides(Y, Ls(), { bot: 420 });
    s += BF.line(14, 186, Y) + BF.line(214, 386, Y) + BF.line(414, 586, Y);

(function(){
  const box = document.createElement('section'); box.className = 'panel intbox'; box.id = 'intBox'; box.hidden = true;

  const EXPL = { Na_in: 's1_int_e_Na_in', ATP: 's1_int_e_ATP', carrier_amount: 's1_int_e_carrier', Y_flux: 's1_int_e_Y', Na_via_X: 's1_int_e_NaX', O2_flux: 's1_int_e_O2', cAMP_after_hormone: 's1_int_e_cAMP' };
  const HL = { Na_in: [86, 150, 70, 40], ATP: [70, 112, 86, 34], carrier_amount: [244, 72, 54, 70], Y_flux: [324, 72, 54, 70], Na_via_X: [244, 72, 54, 70], O2_flux: [488, 226, 90, 62], cAMP_after_hormone: [428, 74, 120, 110], X_after_hormone: [244, 72, 54, 70] };
