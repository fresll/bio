    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {

/* =====================================================================
   Вопрос 1. Эндоцитоз: механизмы и признаки, по которым их различают
   1b — базовый: груз × убранная деталь (клатрин, перестройка актина)
   1a — продвинутый: два эксперимента — мутантный динамин (Damke 1994) и кавеолы при натяжении (Sinha 2011)
   Все подписи — через t(); геометрия мембран — BF (s0_figs.js).
   ===================================================================== */
(function(){
  const K = '1b', Y = 150;
  layout(K);

  /* ---- модель: что образуется при данном грузе и наборе деталей ---- */
  function model1b(cargo, rm){
    const clath = rm !== 'clath', actin = rm !== 'actin';
    const o = { micro: false, macro: false, rme: false, phago: false, ligSurface: false, partOut: false };
    if (cargo === 'fl' || cargo === 'gf') o.micro = true;                 /* мелкие пузырьки: в модели без клатрина и без перестройки актина (упрощение; Damke et al., 1994 — захват жидкости при блокаде клатринового пути сохраняется) */
    if (cargo === 'gf' && actin) o.macro = true;                          /* макропиноцитоз: регулируемый, нужен актин */
    if (cargo === 'lig') { o.rme = clath; o.ligSurface = !clath; }        /* рецептор-опосредованный: клатрин-зависимый */
    if (cargo === 'part') { o.phago = actin; o.partOut = !actin; }        /* фагоцитоз: актин-зависимый, клатрин не нужен */
    o.inside = o.micro || o.macro || o.rme || o.phago;
    o.clathCoat = o.rme; o.actinOn = o.macro || o.phago;
    return o;
  }
  window.MODEL1B = model1b;   /* для автотеста */

  const solute = (pts) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#7FA7D6"/>`).join('');
  const SOL = [[60,40],[110,70],[170,30],[230,64],[290,36],[350,72],[410,30],[470,58],[530,34],[570,80],[40,100],[520,110],[260,108]];

  /* ---- ход процесса: этапы каждого пути и этап, на котором модель останавливает путь ---- */
  const STAGES = { fl: 3, gf: 4, lig: 7, part: 4 };
  const stageKeys = c => Array.from({ length: STAGES[c] }, (_, i) => `s1t_${c}_${i + 1}`);
  let caseCause = null;   /* «Найти причину»: скрытая причина, показанная на схеме после решения */
  const CASE_STOP = { nosyn: 7, noer: 7, nobind: 7, noadapt: 7, dyn: 4 };
  const G = 's1t_case_other', B = 's1t_case_empty';
  const CASE_KEYS = { nosyn: ['s1t_case_norec_1', G, G, G, G, G, 's1t_case_norec_7'], noer: ['s1t_case_norec_1', G, G, G, G, G, 's1t_case_norec_7'],
    nobind: ['s1t_case_nobind_1', B, B, B, B, B, 's1t_case_nobind_7'], noadapt: ['s1t_case_noadapt_1', G, G, G, G, G, 's1t_case_noadapt_7'] };
  function stopOf(cargo, o){
    if (caseCause) return CASE_STOP[caseCause];
    if (cargo === 'lig' && !o.rme) return 2;      /* адаптеры связаны, ямки нет: рецепторы остаются рассеянными */
    if (cargo === 'gf' && !o.macro) return 1;     /* сигнал получен, складки нет */
    if (cargo === 'part' && !o.phago) return 1;   /* частица у мембраны, псевдоподий нет */
    return STAGES[cargo];
  }
  window.STOP1B = stopOf;   /* для автотеста */

  const { ease, lerp, cap, wrap, dome, dip, join, arcAt, turn } = MF;
  const f1 = x => (+x).toFixed(1);
  const part01 = (T, i) => Math.max(0, Math.min(1, T - i));

  /* мелкий пузырёк: mu от 0 до 1 — впячивание, шейка, отделение, уход в цитоплазму */
  function bud(c, mu, vx, vy){
    const R = 15, rr = 20, thN = 2.163, cut = .72, top = cap(c, Y, R, rr, thN);
    if (mu < cut){
      const th = thN * ease(mu / cut);
      if (th < .03) return { feat: null, s: '' };
      const m = cap(c, Y, R, rr, th);
      return { feat: m, s: th > 1.2 ? solute([[c - 3, m.cy - 1], [c + 4, m.cy + 3]]) : '' };
    }
    const v = ease((mu - cut) / (1 - cut)), x = lerp(c, vx, v), y = lerp(top.cy, vy, v);
    return { feat: v < .5 ? dip(c, Y, 18, 3 * (1 - v / .5)) : null,
      s: `<g class="clickable" data-g="micro">${BF.vesicle(+f1(x), +f1(y), R, null, 0)}${solute([[x - 4, y - 3], [x + 5, y + 4]])}</g>` };
  }

  /* рецептор-опосредованный эндоцитоз: 7 этапов */
  const LC = 300, LR = 30, LRR = 18, TH_NECK = 2.518, AR = [-42, -14, 14, 42], X0 = [90, 190, 380, 425], XG = [236, 272, 328, 364];
  function ligand(T, stop){
    /* случаи «Найти причину»: другие рецепторы продолжают работать, поэтому ямка образуется и при дефекте рецептора ЛПНП */
    const cc = caseCause, other = cc === 'nosyn' || cc === 'noer' || cc === 'noadapt', noBind = cc === 'nosyn' || cc === 'noer' || cc === 'nobind';
    const u0 = ease(part01(T, 0)) * (noBind ? .62 : 1), uA = part01(T, 1), uG = stop > 2 ? ease(part01(T, 2)) : 0;
    const th = stop <= 2 ? 0 : T < 3 ? .5 * uG : T < 4 ? lerp(.5, 1.7, ease(T - 3)) : lerp(1.7, TH_NECK, ease(T - 4));
    const adapter = uA > .35, out = { feat: null, s: '', labels: '' }, pitCargo = !other && cc !== 'nobind';
    const tint = q => other ? q.split(BF.C.rec).join('#8A96A6') : q, start = other ? XG : X0;
    let surf = '', free = '';
    X0.forEach((x, i) => {
      if (cc === 'noadapt') surf += BF.recAt(x, Y, 0, u0 >= 1, 15, false);
      if (u0 < 1) free += `<circle data-x="1" cx="${f1(lerp(x + 26 - 16 * i, x, u0))}" cy="${f1(lerp(36 + 14 * i, Y - 16, u0))}" r="4.4" fill="${BF.C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
    });
    out.s += (free ? `<g class="clickable" data-g="ligand">${free}</g>` : '') + (surf ? `<g class="clickable" data-g="receptor">${surf}</g>` : '');
    if (other && T >= 2.5 && T < 6) out.labels += `<text class="lbl-l" x="226" y="${Y + 74}" font-size="12" text-anchor="end">${t('s1t_lbl_other')}</text>`;
    if (T < 5){
      const m = th > .03 ? cap(LC, Y, LR, LRR, th) : { pts: [[LC, Y]], mid: 0, cy: Y };
      out.feat = th > .03 ? m : null;
      let rec = '';
      AR.forEach((a, i) => {
        const p = arcAt(m.pts, m.mid, lerp(start[i] - LC, a, uG));
        rec += BF.recAt(p.x, p.y, turn(p), pitCargo && u0 >= 1, 15, adapter);
      });
      /* клатрин: решётка растёт от центра ямки, снаружи от адаптеров */
      let coat = '';
      if (uG > 0){
        const ext = Math.max(46 * uG, th * LR - 4), step = 11 * LR / (LR + 26 * Math.min(1, th / 1.2));
        for (let a = -Math.floor(ext / step) * step; a <= ext + .01; a += step){
          const p = arcAt(m.pts, m.mid, a), x = p.x + p.nx * 26, y = p.y + p.ny * 26;
          if (y > Y + 22) coat += `<circle cx="${f1(x)}" cy="${f1(y)}" r="3.6" fill="${BF.C.clath}"/>`;
        }
      }
      out.s += `<g class="clickable" data-g="receptor">${tint(rec)}</g>` + (coat ? `<g class="clickable" data-g="clathrin">${coat}</g>` : '');
      /* динамин на шейке */
      if (T > 4){
        const w = m.neck + 9, op = ease((T - 4) / .5).toFixed(2);
        const r = (x, y) => `<rect x="${f1(x)}" y="${f1(y)}" width="18" height="7" rx="3" fill="${BF.C.dyn}"/>`;
        out.s += `<g class="clickable" data-g="dynamin" opacity="${op}">${r(LC - w - 18, m.yn - 8)}${r(LC - w - 18, m.yn + 2)}${r(LC + w, m.yn - 8)}${r(LC + w, m.yn + 2)}</g>`;
      }
      if (T >= 3.5) out.labels += `<text class="lbl-l" x="226" y="${Y + 56}" font-size="12" text-anchor="end">${t('s1_lbl_pit')}</text>`;
      return out;
    }
    /* везикула отделилась: клатрин только с цитоплазматической стороны, поэтому кольцо замыкается, когда везикула отошла от мембраны */
    const cy0 = cap(LC, Y, LR, LRR, TH_NECK).cy, v = ease(part01(T, 5)), y = +f1(lerp(cy0, 330, v)), u = part01(T, 6);
    if (v < .5) out.feat = dip(LC, Y, 24, 3 * (1 - v / .5));
    const phis = AR.map(a => 90 - a / LR * 180 / Math.PI), n = 32, r = LR + 26 + 26 * ease(u);
    let ring = '';
    for (let i = 0; i < n; i++){ const a = i / n * 2 * Math.PI, x = LC + Math.cos(a) * r, yy = y + Math.sin(a) * r;
      if (yy > Y + 24) ring += `<circle cx="${f1(x)}" cy="${f1(yy)}" r="3.6" fill="${BF.C.clath}"/>`; }
    const ves = `<circle cx="${LC}" cy="${y}" r="${LR}" fill="#fff"/>` + BF.bilayerPts(BF.circlePts(LC, y, LR), { closed: true }) + tint(BF.recRadial(LC, y, LR, phis, pitCargo, u < .35));
    out.s += `<g class="clickable" data-g="ccv">${ves}</g>` + (u < 1 ? `<g class="clickable" data-g="clathrin" opacity="${(1 - ease(u)).toFixed(2)}">${ring}</g>` : '');
    if (u <= 0 && v > .55) out.labels += `<text class="lbl-l" x="362" y="${y}" font-size="12">${t('s1_lbl_ccv')}</text>`;
    if (u >= .7) out.labels += `<text class="lbl-l" x="356" y="${y}" font-size="12">${t('s1t_lbl_uncoated')}</text>`;
    return out;
  }

  /* актин в выросте: штриховая дуга по средней линии выроста */
  function actinArc(c, cy, r, a, b, op = 1){
    const P = []; for (let s = a; s <= b + .001; s += .08) P.push(`${f1(c + r * Math.sin(s))},${f1(cy + r * Math.cos(s))}`);
    return P.length > 1 ? `<path d="M${P.join(' L')}" fill="none" stroke="${BF.C.actin}" stroke-width="2.4" stroke-dasharray="3 2" stroke-linecap="round" opacity="${op}"/>` : '';
  }
  const inner = (x, y) => solute([[x - 16, y - 12], [x + 8, y - 18], [x + 18, y + 10], [x - 10, y + 16], [x + 2, y]]);

  /* макропиноцитоз: одна складка растёт, перекрывает вакуоль и смыкается с мембраной */
  const GC = 175, GRi = 44, GTip = 12, GCy = Y - GRi + 1, GRo = GRi + 2 * GTip;
  function macro(T, stop){
    const out = { feat: null, s: '', labels: '' };
    const u0 = ease(part01(T, 0));
    out.s += `<g class="clickable" data-g="gf">${BF.receptor(76, Y - 6, -1, false)}<circle cx="${f1(lerp(36, 76, u0))}" cy="${f1(lerp(70, Y - 24, u0))}" r="6" fill="#C0392B"/></g>`;
    out.labels += `<text class="lbl" x="62" y="52" font-size="12">${t('s1_lbl_gf')}</text>`;
    if (stop <= 1 || T <= 1) return out;
    const th0 = MF.th0Of(GCy, Y, GRo), a0 = th0 + .12;
    if (T < 3){
      const u1 = ease(part01(T, 1)), u2 = ease(part01(T, 2));
      const thRe = th0 + .24, thL = lerp(lerp(a0, 2.6, u1), 2 * Math.PI - thRe - .5, u2), thR = lerp(a0, thRe, u1);
      out.feat = wrap(GC, GCy, Y, GRi, GTip, thL, thR, ease(Math.min(1, (T - 1) * 2.5)));
      out.s += `<g class="clickable" data-g="actin">${actinArc(GC, GCy, GRi + GTip, -thL + .12, -th0 + .08)}</g>` + inner(GC, GCy);
      out.labels += `<text class="lbl" x="${GC}" y="${Y + 62}" font-size="12">${t('s1t_lbl_fold')}</text>`;
      return out;
    }
    const v = ease(part01(T, 3)), y = +f1(lerp(GCy, 300, v)), k = 1 - v;
    if (k > .01) out.feat = dome(GC, GCy, Y, GRo, k);
    out.s += `<g class="clickable" data-g="macro">${BF.vesicle(GC, y, GRi, null, 0)}${inner(GC, y)}</g>`;
    if (T >= 3.6) out.labels += `<text class="lbl" x="${GC}" y="365" font-size="12">${t('s1_lbl_macro')}</text>`;
    return out;
  }

  /* фагоцитоз: псевдоподии с двух сторон охватывают частицу */
  const PC = 300, PRi = 49, PTip = 13, PCy = Y - PRi + 1, PRo = PRi + 2 * PTip, PR = 36;
  const particle = (y) => `<circle cx="${PC}" cy="${f1(y)}" r="${PR}" fill="#B9A58A" stroke="#7A6648" stroke-width="2"/>`;
  function phago(T, stop){
    const out = { feat: null, s: '', labels: '' };
    if (T <= 1 || stop <= 1){
      out.s += `<g class="clickable" data-g="receptor">${[268, 300, 332].map(x => BF.recAt(x, Y, 0, false, 15, false)).join('')}</g><g class="clickable" data-g="phago">${particle(lerp(58, PCy, ease(part01(T, 0))))}</g>`;
      out.labels += `<text class="lbl-l" x="${PC + 46}" y="${Y - 62}" font-size="12">${t('s1_lbl_particle')}</text>`;
      return out;
    }
    const th0 = MF.th0Of(PCy, Y, PRo), a0 = th0 + .12;
    if (T < 3){
      const th = lerp(lerp(a0, 1.95, ease(part01(T, 1))), 2.92, ease(part01(T, 2)));
      out.feat = wrap(PC, PCy, Y, PRi, PTip, th, th, ease(Math.min(1, (T - 1) * 2.5)));
      out.s += `<g class="clickable" data-g="receptor">${BF.recRadial(PC, PCy, PRi, [50, 90, 130], false, false)}</g><g class="clickable" data-g="phago">${particle(PCy)}</g><g class="clickable" data-g="actin">${actinArc(PC, PCy, PRi + PTip, -th + .12, -th0 + .08)}${actinArc(PC, PCy, PRi + PTip, th0 - .08, th - .12)}</g>`;
      out.labels += `<text class="lbl" x="${PC}" y="214" font-size="12">${t('s1_lbl_cup')}</text>`;
      return out;
    }
    const v = ease(part01(T, 3)), y = +f1(lerp(PCy, 300, v)), k = 1 - v;
    if (k > .01) out.feat = dome(PC, PCy, Y, PRo, k);
    out.s += `<g class="clickable" data-g="phago">${BF.vesicle(PC, y, PRi, null, 0)}${BF.recRadial(PC, y, PRi, [50, 90, 130], false, false)}${particle(y)}</g>`;
    if (T >= 3.6) out.labels += `<text class="lbl" x="${PC}" y="372" font-size="12">${t('s1_lbl_phagosome')}</text>`;
    return out;
  }

  /* кадр сцены: T — положение на шкале этапов */
  function frame(cargo, rm, T){
    const o = model1b(cargo, rm), stop = stopOf(cargo, o), done = T >= stop - 1e-6 && !caseCause;
    const main = cargo === 'lig' ? ligand(T, stop) : cargo === 'gf' ? macro(T, stop) : cargo === 'part' ? phago(T, stop) : { feat: null, s: '', labels: '' };
    /* мелкие пузырьки идут постоянно при любом грузе; в растворе показаны три, сдвинутые во времени */
    const mu = T / stop, buds = cargo === 'fl'
      ? [bud(170, Math.min(1, mu * 1.5), 140, 262), bud(320, Math.max(0, Math.min(1, mu * 1.5 - .25)), 290, 300), bud(470, Math.max(0, mu * 1.5 - .5), 430, 262)]
      : [bud(470, mu, 430, 262)];
    let s = defs(K) + `<rect class="cyto" x="0" y="${Y}" width="600" height="270"/><rect x="0" y="0" width="600" height="${Y}" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="22">${t('lbl_out')}</text><text class="area" x="14" y="406">${t('lbl_cytosol')}</text><text class="area" x="586" y="22" text-anchor="end">${t('s1t_lbl_status')}</text>`;
    if (cargo === 'fl') s += solute(SOL);
    if (cargo === 'gf') s += solute(SOL.filter(([x, y]) => Math.hypot(x - GC, y - GCy) > GRo + 8));
    s += `<g class="clickable" data-g="membrane">${BF.bilayerPts(join(Y, [main.feat].concat(buds.map(b => b.feat))))}</g>`;
    s += buds.map(b => b.s).join('') + main.s + main.labels;
    if (T >= stop * .85) s += `<text class="lbl" x="${cargo === 'fl' ? 300 : 470}" y="${cargo === 'fl' ? 345 : 300}" font-size="12">${t('s1_lbl_micro')}</text>`;
    if (done && cargo === 'lig' && !o.rme) s += `<text class="lbl" x="300" y="222" font-size="12.5" fill="${BF.C.red}">${t('s1_lbl_noclath')}</text>`;
    if (done && cargo === 'gf' && !o.macro) s += `<text class="lbl" x="175" y="226" font-size="12.5" fill="${BF.C.red}">${t('s1_lbl_noactin')}</text>`;
    if (done && cargo === 'part' && !o.phago) s += `<text class="lbl" x="300" y="214" font-size="12.5" fill="${BF.C.red}">${t('s1_lbl_noactin')}</text>`;
    return s;
  }

  $('ctrl' + K).innerHTML =
    segHTML('s1b_cargo', 's1_cargo', [['fl', 's1_c_fl'], ['gf', 's1_c_gf'], ['lig', 's1_c_lig'], ['part', 's1_c_part']], 'fl') +
    segHTML('s1b_rm', 's1_rm', [['none', 's1_rm_none'], ['clath', 's1_rm_clath'], ['actin', 's1_rm_actin']], 'none');
  $('take' + K).textContent = t('s1b_take');

  /* время: шкала этапов под схемой; модель model1b не меняется, кадр только показывает её результат */
  const focusX = { fl: 320, gf: 175, lig: 300, part: 300 }, view = stageView(K);
  const tl = timeStrip(K, {
    render(T){ $('svg' + K).innerHTML = frame(segVal('s1b_cargo'), segVal('s1b_rm'), T); },
    onEnd: view.back,
  });
  window.TL1B = tl;   /* для автотеста и снимков состояний */
  let lastKey = null, armed = false;

  function update(){
    const cargo = segVal('s1b_cargo'), rm = segVal('s1b_rm'), key = cargo + '|' + rm + '|' + caseCause;
    const o = model1b(cargo, rm);
    if (key !== lastKey){ lastKey = key; const keys = CASE_KEYS[caseCause] || stageKeys(cargo); tl.config(keys, stopOf(cargo, o), caseCause ? `s1t_stop_case_${caseCause}` : `s1t_stop_${cargo}_${rm}`); if (!armed) tl.seek(tl.end); }
    if (armed){ armed = false; tl.play(true); view.reveal(focusX[cargo]); } else if (!tl.playing) tl.redraw();
    const carrier = o.phago ? 's1_v_phago' : o.rme ? 's1_v_ccv' : o.macro ? 's1_v_micro_macro' : (o.micro || o.ligSurface) ? 's1_v_micro' : 's1_v_none';
    const yes = (on, a, b) => `<span class="pill ${on ? 'p' : 'np'}">${t(on ? a : b)}</span>`;
    $('reads' + K).innerHTML =
      readRow(t('s1_r_carrier'), t('s1_r_carrier_s'), `<span class="pill np">${t(carrier)}</span>`) +
      readRow(t('s1_r_inside'), '', o.ligSurface ? `<span class="pill np">${t('s1_v_nonspec')}</span>` : yes(o.inside, 'pill_yes', 'pill_no')) +
      readRow(t('s1_r_clath'), '', yes(o.clathCoat, 'pill_formed', 'pill_notformed')) +
      readRow(t('s1_r_actin'), '', yes(o.actinOn, 'pill_formed', 'pill_notformed'));
    setCap(K, `s1_${cargo}_${rm}`);
  }
  /* выбор на панели запускает процесс сначала; в сценарии — кнопка «Показать на схеме» */
  wire(['s1b_cargo', 's1b_rm'], () => { armed = true; update(); });
  const set = (c, r) => { segSet('s1b_cargo', c); segSet('s1b_rm', r); };
  const run = (c, r) => { set(c, r); armed = true; };
  let saved = null;
  const caseShow = c => { caseCause = c;
    if (c) { if (!saved) saved = [segVal('s1b_cargo'), segVal('s1b_rm')]; set('lig', 'none'); armed = true; }
    else if (saved) { set(saved[0], saved[1]); saved = null; }
    update(); };
  SCENES[K] = { update, caseShow, tick: tl.tick, poe: [
    { n: 3, ok: 0, pre(){ set('lig', 'none'); }, apply(){ run('lig', 'clath'); } },
    { n: 3, ok: 0, pre(){ set('gf', 'none'); }, apply(){ run('gf', 'actin'); } },
    { n: 3, ok: 0, pre(){ set('part', 'none'); }, apply(){ run('part', 'clath'); } },
  ] };
})();

(function(){
  const K = '1a', Y = 150;
  layout(K);
  /* ---- эксперимент 1: Damke et al. 1994 (клетки HeLa; динамин-1 K44A, не связывает и не гидролизует ГТФ) ----
     ---- эксперимент 2: Sinha et al. 2011 (эндотелий лёгких мыши, дикий тип и Cav1−/−; гипоосмотическая среда 150 мОсм) ---- */
  function model1a(exp, mut, cells, medium){
    if (exp === 'dyn') return { exp, mut, pitsBud: !mut, tfn: mut ? 'low' : 'ctrl', egf: mut ? 'low' : 'ctrl', curved: mut ? 'x2' : 'ctrl', fluid: 'same', recycle: 'same' };
    const ko = cells === 'ko', hypo = medium === 'hypo';
    return { exp, ko, hypo, caveolae: ko ? 'none' : hypo ? 'flat' : 'many', tension: hypo ? (ko ? 'up' : 'same') : 'base', ccp: 'same', rupture: hypo && ko };
  }

(function(){

/* =====================================================================
   Вопрос 3. Рецептор и лиганд после эндоцитоза
   3b — базовый: отделяется ли лиганд в ранней эндосоме × куда направлен рецептор

   Геометрия — BF.sortScene (s0_figs.js). Все подписи — через t().

(function(){
  const K = '3b', { ease, lerp, cap, join } = MF, { C } = BF;

    return { dis, back, route, lig: dis ? 'lyso' : back ? 'surface' : 'lyso_rec', rec: back ? 'surface' : 'lyso', cyc: back ? 'many' : 'once' };

  const keysOf = r => Array.from({ length: NST[r] }, (_, i) => `s3t_${r}_${i + 1}`);
  const Y = 64, dy = 20, LIG = '#C0392B', f1 = x => (+x).toFixed(1), part = (T, i) => Math.max(0, Math.min(1, T - i));
  const EE0 = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE0 = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
  const SITE = [-125, -55].map(d => d * Math.PI / 180), BOT = [125, 55].map(d => d * Math.PI / 180), PMX = [530, 410];   /* левый носитель уходит первым и дальше: пути не пересекаются */

  const RI = 16, RRI = 16, THI = 2.245, ILV = [[-26, 12], [28, 16]], FREE = [[0, -22], [2, 30]];   /* внутрипросветная везикула: почка в просвет */
  const mix = (a, b, u) => '#' + [1, 3, 5].map(i => Math.round(lerp(parseInt(a.substr(i, 2), 16), parseInt(b.substr(i, 2), 16), u)).toString(16).padStart(2, '0')).join('');

  /* точка стенки эллипса: сама точка, наружная нормаль и касательная */
  function wallA(e, a){
    const x = e.cx + e.rx * Math.cos(a), y = e.cy + e.ry * Math.sin(a); let nx = Math.cos(a) / e.rx, ny = Math.sin(a) / e.ry; const n = Math.hypot(nx, ny); nx /= n; ny /= n;

    for (let i = 0; i < n; i++){
      const a = 2 * Math.PI * i / n - Math.PI, x = e.cx + e.rx * Math.cos(a), y = e.cy + e.ry * Math.sin(a);
      const b = bs.find(q => Math.abs((x - q.w.x) * q.w.tx + (y - q.w.y) * q.w.ty) < q.hw && (x - q.w.x) * q.w.nx + (y - q.w.y) * q.w.ny > -30);
      if (!b){ P.push([x, y]); continue; }
      if (b.put) continue; b.put = true;
      b.m.pts.forEach(([u, v]) => P.push([b.w.x + u * b.w.tx + b.sg * v * b.w.nx, b.w.y + u * b.w.ty + b.sg * v * b.w.ny]));

  const wallDraw = (e, bumps) => { const P = wallPath(e, bumps); return `<path d="M${P.map(([x, y]) => f1(x) + ',' + f1(y)).join(' L')} Z" fill="${e.fill}"/>` + BF.bilayerPts(P, { closed: true }); };
  /* слияние поздней эндосомы с лизосомой: общий контур двух эллипсов (null — ещё не соприкоснулись) */

      const st = f.findIndex((v, i) => !v && f[(i + n - 1) % n]), R = []; for (let k = 0; k < n; k++){ const i = (st + k) % n; if (f[i]) break; R.push(P[i]); } return R; };

    return Q;
  }
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const lig = (x, y, op = 1) => G('ligand', ligRaw(x, y, op));
  const ligRaw = (x, y, op = 1) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="5" fill="${LIG}" stroke="#7a1f16" stroke-width=".8"${op < 1 ? ` opacity="${op.toFixed(2)}"` : ''}/>`;
  /* рецептор: (x, y) на средней линии, (nx, ny) — сторона цитоплазмы; чаша и лиганд — с другой стороны */
  function rec(x, y, nx, ny, withL, ub, op = 1){
    let q = G('receptor', BF.recAt(x, y, MF.turn({ nx, ny }), false, 15, false));
    if (withL) q += lig(x - nx * 16, y - ny * 16);
    if (ub > 0) q += `<g class="clickable" data-g="ub" opacity="${ub.toFixed(2)}"><circle cx="${f1(x + nx * 15)}" cy="${f1(y + ny * 15)}" r="7" fill="#6748B6"/><text x="${f1(x + nx * 15)}" y="${f1(y + ny * 15 + 3)}" font-size="8" font-weight="700" text-anchor="middle" fill="#fff">Ub</text></g>`;
    return op < 1 ? `<g opacity="${op.toFixed(2)}">${q}</g>` : q;
  }
  const halo = (x, y) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="26" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>`;

  /* кадр: только чистая функция от маршрута и времени */
  function frame(o, T){
    const r = o.route, Tm = MAT[r], m = Tm === undefined ? 0 : ease(part(T, Tm)), fu = Tm === undefined ? 0 : ease(part(T, Tm + 1)), deg = ease((fu - .5) / .5);
    const e = eeAt(m), bumps = [], pm = []; let mv = '', hl = null;

    const fused = fu > 0 ? unionPts(e, LY) : null;
    if (!o.back || r === 'r1'){   /* пустые внутрипросветные везикулы: на маршрутах, где рецептор их не занимает */
      if (r !== 'r3'){
        const t0 = r === 'r1' ? 4 : 2;
        (r === 'r1' ? SITE : BOT).forEach((a, k) => { const u = part(T, t0) * 1.9 - k * .5;   /* почки по очереди: стенка между ними не сходится в перемычку */
          if (u > 0 && u < 1){ bumps.push({ a, th: THI * ease(u), R: RI, rr: RRI, sg: -1 }); }
          else if (u >= 1 && deg < 1) mv += `<g opacity="${(1 - deg).toFixed(2)}">${G('ilv', BF.vesicle(+f1(e.cx + ILV[k][0]), +f1(e.cy + ILV[k][1] - 4), RI, null, 0))}</g>`; });
      }
    }
    for (let k = 1; k >= 0; k--){
      const lead = k === 0 ? ease(T / 2) : 0, tau = T + lead,   /* левый носитель уходит заметно раньше и не проходит сквозь почку правого */
        a = SITE[k], w = wallA(e, a), mid = (x, y) => { if (k === 1) hl = [x, y]; };
      const bound = !o.dis || tau < 1, u = ease(part(tau, 1));   /* u — отделение лиганда */
      const fr = FREE[k], lumen = [e.cx + fr[0], e.cy + fr[1]];
      if (o.dis){   /* отделившийся лиганд: в просвете, идёт с эндосомой */
        if (tau >= 1){
          const c = [w.x - w.nx * 16, w.y - w.ny * 16], fade = 1 - deg;
          if (fade > .01) mv += lig(lerp(c[0], lumen[0], u), lerp(c[1], lumen[1], u), fade);
        }
      }
      if (o.back){
        if (tau < 2){ mv += rec(w.x, w.y, w.nx, w.ny, bound, 0); mid(w.x, w.y); }
        else if (tau < 3){
          const th = THO * ease(tau - 2), b = cap(0, 0, RO, RRO, th); bumps.push({ a, th, R: RO, rr: RRO, sg: 1 });
          const c = [w.x + w.nx * b.cy, w.y + w.ny * b.cy], p = [c[0] + w.nx * RO, c[1] + w.ny * RO];
          mv += rec(p[0], p[1], w.nx, w.ny, !o.dis, 0); mid(p[0], p[1]);
        } else if (tau < 3.7){
          const v = ease((tau - 3) / .7), wb = wallA(EE0, a), b0 = [wb.x + wb.nx * DOCK, wb.y + wb.ny * DOCK], d = [PMX[k], Y + DOCK], x = lerp(b0[0], d[0], v), y = lerp(b0[1], d[1], v);
          /* рецептор смещается по мембране везикулы к стороне, обращённой от поверхности: при слиянии чаша окажется снаружи клетки */
          const a0 = Math.atan2(wb.ny, wb.nx), ang = lerp(a0, Math.PI / 2 * (k ? 1 : 1), v), nx = Math.cos(ang), ny = Math.sin(ang);
          mv += G('vesicle', BF.vesicle(+f1(x), +f1(y), RO, null, 0)) + rec(x + RO * nx, y + RO * ny, nx, ny, !o.dis, 0); mid(x, y);
        } else if (tau < 4){
          const th = THO * (1 - ease((tau - 3.7) / .3)), c = cap(PMX[k], Y, RO, RRO, th); if (th > .04) pm.push(c);
          const q = th > .04 ? MF.arcAt(c.pts, c.mid, 0) : { x: PMX[k], y: Y, nx: 0, ny: 1 };
          mv += rec(q.x, q.y, 0, 1, !o.dis, 0); mid(q.x, q.y);
        } else {
          const v = ease((tau - 4.15) / .7);   /* вернувшийся рецептор снова связывает лиганд из среды */
          mv += rec(PMX[k], Y, 0, 1, !o.dis, 0); mid(PMX[k], Y);
          if (o.dis && tau > 4.15) mv += lig(PMX[k] + 24 * (1 - v), lerp(14, Y - 16, v));
        }
      } else if (r === 'r3'){
        const ub = 1;   /* метка стоит раньше эндосомы: она и направляет рецептор в ямку */
        if (tau < 2){ mv += rec(w.x, w.y, w.nx, w.ny, true, ub); mid(w.x, w.y); }
        else if (tau < 3){
          const th = THI * ease(tau - 2), b = cap(0, 0, RI, RRI, th); bumps.push({ a, th, R: RI, rr: RRI, sg: -1 });
          const c = [w.x - w.nx * b.cy, w.y - w.ny * b.cy], p = [c[0] - w.nx * RI, c[1] - w.ny * RI];
          mv += rec(p[0], p[1], w.nx, w.ny, true, 1); mid(p[0], p[1]);
        } else {
          const wb = wallA(EE0, a), b = cap(0, 0, RI, RRI, THI), c0 = [wb.x - wb.nx * b.cy, wb.y - wb.ny * b.cy], v = ease((tau - 3) / .5), c1 = [e.cx + ILV[k][0], e.cy + ILV[k][1] - 4];
          const dx = (T >= 3 ? e.cx - EE0.cx : 0), dyy = (T >= 3 ? e.cy - EE0.cy : 0), c = [lerp(c0[0] + dx, c1[0], v), lerp(c0[1] + dyy, c1[1], v)], op = 1 - deg, p = [c[0] - wb.nx * RI, c[1] - wb.ny * RI];
          if (op > .01){ mv += `<g opacity="${op.toFixed(2)}">${G('ilv', BF.vesicle(+f1(c[0]), +f1(c[1]), RI, null, 0))}${rec(p[0], p[1], wb.nx, wb.ny, true, 1)}</g>`; mid(p[0], p[1]); }

      } else {   /* сочетание модели: рецептор остаётся в мембране эндосомы */
        const op = 1 - deg; if (op > .01){ mv += rec(w.x, w.y, w.nx, w.ny, bound, 0, op); mid(w.x, w.y); }
      }
    }
    /* расщепление в лизосоме: появляются осколки */
    let frag = '';
    if (deg > 0){
      if (o.lig !== 'surface') frag += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${LIG}" opacity="${(.7 * deg).toFixed(2)}"/>`).join('');
      if (!o.back) frag += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity="${(.8 * deg).toFixed(2)}"/>`).join('');
    }
    if (frag) frag = G('lysosome', frag);
    return { e, bumps, pm, mv: mv + frag + (hl ? halo(hl[0], hl[1]) : ''), m, fu, fused };
  }

  /* неподвижное рисуется один раз на выбор; стенки — только когда меняются; в кадре обновляются рецепторы и лиганды */
  let skel = null, kE = '', kP = '', kL = '', kY = '';
  function skeleton(o){
    let s = defs(K) + `<rect class="cyto" width="600" height="420"/><rect x="0" y="0" width="600" height="${dy}" fill="var(--surface)"/>`;
    s += `<g class="clickable" data-g="endosome" transform="translate(0,${dy})"><path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/><g class="clickable" data-g="membrane" id="pm${K}"></g>`;
    s += `<g class="clickable" data-g="lysosome" id="ly${K}"></g>`;
    /* покоящийся рецептор поверхности */
    s += G('receptor', BF.recAt(470, Y, 0, false, 15, false));
    s += `<g class="clickable" data-g="endosome" id="ee${K}"></g><g id="mv${K}"></g></g><g id="lb${K}"></g>`;
    s += `<text class="area" x="14" y="22">${t('lbl_out')}</text><text class="area" x="14" y="408">${t('lbl_cytosol')}</text><text class="area" x="170" y="22">${t('s3t_status')}</text>`;
    $('svg' + K).innerHTML = s; kE = kP = kL = kY = '';
  }
  function labels(o, T, e, m, fu){
    const end = T >= NST[o.route] - 1e-6, L = (x, y, key, extra = '', cls = 'lbl') => `<text class="${cls}" x="${x}" y="${y + dy}" font-size="13" ${extra}>${t(key)}</text>`;
    let s = (fu > .5 ? '' : m > .5 ? L(+f1(e.cx), +f1(e.cy - e.ry - 24), 's3_lbl_le', 'font-weight="600"') : L(+f1(e.cx), +f1(e.cy + e.ry + 28), 's3_lbl_ee', 'font-weight="600"')) + L(LY.cx - 4, LY.cy + LY.ry + 20, 's3_lbl_ly', 'font-weight="600"');

    if (T >= 1 && m === 0) s += L(EE0.cx, EE0.cy + EE0.ry + 48, o.dis ? 's3_lbl_dis' : 's3_lbl_nodis', 'font-size="12.5"');
    if (o.back && T >= 3 && T < 3.7) s += L(334, 150, 's3_lbl_back', 'font-size="12"', 'lbl-l');
    if (end && o.route === 'r2') s += L(440, 12, 's3_lbl_release', 'font-size="12"');

  function render(o, T){
    if (skel !== o.route || !$('mv' + K)){ skel = o.route; skeleton(o); }
    const r = frame(o, T), ke = JSON.stringify([r.e, r.bumps, !!r.fused]), kp = JSON.stringify(r.pm.map(c => c.pts.length + '|' + c.pts[0][0]));
    if (ke !== kE){ kE = ke; $('ee' + K).innerHTML = r.fused
      ? `<path d="M${r.fused.map(([x, y]) => f1(x) + ',' + f1(y)).join(' L')} Z" fill="${mix('#EFC3A0', C.lyso, r.fu)}"/>` + BF.bilayerPts(r.fused, { closed: true }) : wallDraw(r.e, r.bumps); }

    const ky = r.fused ? 'f' : 'l'; if (ky !== kY){ kY = ky; $('ly' + K).innerHTML = r.fused ? '' : BF.compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso); }

  }

  $('ctrl' + K).innerHTML =
    segHTML('s3b_dis', 's3_dis', [['y', 's3_dis_y'], ['n', 's3_dis_n']], 'y') +
    segHTML('s3b_rec', 's3_rec', [['back', 's3_rec_back'], ['lyso', 's3_rec_lyso']], 'back');

  SCENES[K] = { update, poe: [
    { n: 3, ok: 0, pre(){ setT('holo', '7'); }, apply(){ setT('holo', '5'); } },
    { n: 3, ok: 0, pre(){ setT('apo', '5'); }, apply(){ setT('apo', '7'); } },
    { n: 3, ok: 0, pre(){ setS('none', 'full'); }, apply(){ setS('snx27', 'full'); } },
    { n: 3, ok: 0, pre(){ setS('none', 'full'); }, apply(){ setS('none', 'dpdz'); } },
  ] };

   Вопрос 4. Ядерная пора и общий принцип адресации
   4b — базовый: груз × убранная деталь
   4a — продвинутый: сигнал ядерной локализации (Kalderon et al., 1984) и пассивная проницаемость поры (Timney et al., 2016)
   Геометрия — BF.nucScene (s0_figs.js). Все подписи — через t().
   ===================================================================== */
(function(){
  const K = '4b', { ease, lerp } = MF;
  layout(K);

  /* ---- ход процесса: этапы описаны для выделенной молекулы; модель BF.nucScene(...).res не меняется ---- */
  const STAGES = { small: 3, big: 2, nls: 4, nes: 4 };
  const stageKeys = c => Array.from({ length: STAGES[c] }, (_, i) => `s4t_${c}_${i + 1}`);
  let caseCause = null;   /* «Найти причину»: скрытая причина, показанная на схеме после решения */
  function stopOf(cargo, rm){
    if (caseCause === 'mut') return 1;
    if (cargo === 'nls' && rm === 'imp') return 1;   /* NLS не узнаётся */
    if (cargo === 'nls' && rm === 'ran') return 3;   /* комплекс проходит пору, груз не освобождается */
    if (cargo === 'nes' && (rm === 'exp' || rm === 'ran')) return 1;   /* комплекс не образуется */
    return STAGES[cargo];
  }
  window.STOP4B = stopOf;   /* для автотеста */
  const N = { small: 26, big: 10, nls: 10, nes: 10 };
  const secs = (cargo, stop) => stop === 1 ? 6 : cargo === 'big' ? 3.5 : cargo === 'small' ? 3 : 1.7;

  /* положение каждой частицы — чистая функция времени: ползунок перематывает, снимки воспроизводимы */
  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const CY = { x0: 34, x1: 566, y0: 94, y1: 150 }, NU = { x0: 34, x1: 566, y0: 298, y1: 362 };
  const PORES = [206, 394], MOUTH_T = 168, MOUTH_B = 252;
  function wander(i, box, tau, n){
    const xc = lerp(box.x0 + 22, box.x1 - 22, (i + .5) / n), yc = lerp(box.y0 + 8, box.y1 - 8, rnd(i, 2));
    const x = xc + 16 * Math.sin(1.1 * tau + 6.3 * rnd(i, 3)) + 8 * Math.sin(2.3 * tau + 6.3 * rnd(i, 4));
    const y = yc + 12 * Math.sin(1.4 * tau + 6.3 * rnd(i, 5)) + 5 * Math.sin(2.9 * tau + 6.3 * rnd(i, 6));
    return [Math.max(box.x0, Math.min(box.x1, x)), Math.max(box.y0, Math.min(box.y1, y))];
  }
  /* переход через пору: к устью, по каналу, от устья */
  function leg(p0, px, p1, u){
    const down = p1[1] > p0[1], a = [px, down ? MOUTH_T : MOUTH_B], b = [px, down ? MOUTH_B : MOUTH_T], P = [p0, a, b, p1];
    const L = [0]; for (let i = 1; i < 4; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));

    const ph = (T * rate + rnd(i, 7)) % 1, g = ph < .5 ? Math.sin(ph * 2 * Math.PI) : 0, px = PORES[(i >> 1) % 2] + (rnd(i, 8) - .5) * 16;
    return [lerp(p[0], px, ease(g)), lerp(p[1], top ? MOUTH_T - 2 : MOUTH_B + 2, ease(g))];
  }
  const f1 = x => (+x).toFixed(1);
  const halo = (p) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="24" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  const ranDot = (p, op = 1) => `<g class="clickable" data-g="ran"><circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="6" fill="#1E7B4A" stroke="#1E7B4A" stroke-width="2" opacity="${op}"/></g>`;
  const fade = (s, op) => op >= 1 ? s : `<g opacity="${(+op).toFixed(2)}">${s}</g>`;

  /* крупный белок с сигналом: рецептор связывает его на этапе 2, комплекс идёт через пору на этапе 3, груз освобождается на этапе 4 */
  function signal(cargo, rm, T, stop){
    const imp = cargo === 'nls', from = imp ? CY : NU, to = imp ? NU : CY, n = N[cargo];
    const blocked = stop === 1, hasRec = !(imp ? rm === 'imp' : rm === 'exp'), hasRan = rm !== 'ran', P = BF.nucPart;
    const arc = imp ? P.imp : P.exp, tag = caseCause === 'mut' ? 'mut' : imp ? 'nls' : 'nes';
    let s = '', top = 0, bot = 0, focus = null; const pts = [];
    for (let i = n - 1; i >= 0; i--){
      /* выделенная молекула (i = 0) идёт последней, остальные опережают её: к концу шкалы процесс завершён у всех */
      const tau = blocked ? T * 2.2 : T + .9 * i / (n - 1), px = PORES[i % 2];
      let c, rec = null, recOp = 1, ran = null, ranOp = 1;
      const a0 = wander(i, from, tau, n), a1 = wander(i, to, tau, n), off = [-44 + 10 * rnd(i, 9), imp ? -14 : 14];
      if (blocked){
        c = bounce(i, a0, T, 2.2, imp);
        if (hasRec) { rec = [a0[0] + off[0], a0[1] + off[1]]; recOp = .4; }
      } else if (tau < 2){
        c = a0;
        const b = ease((tau - 1) / .7);
        rec = [lerp(c[0] + off[0], c[0], b), lerp(c[1] + off[1], c[1], b)];
        if (!imp){ const r0 = [c[0] + 46, c[1] + 26]; ran = [lerp(r0[0], c[0] + 13, b), lerp(r0[1], c[1] + 15, b)]; ranOp = b; }
      } else if (!hasRan && imp){
        /* без Ran-ГТФ груз не освобождается: комплекс ходит через поры туда и обратно, направленного накопления нет */
        const c0 = i === 0 ? 2.1 : 2 + .5 * rnd(i, 13), per = .75, dur = i === 0 ? .7 : .5, j = Math.floor((tau - c0) / per), ph = tau - c0 - j * per;

        rec = c;
      } else if (tau < 3){

        if (!imp) ran = [c[0] + 13, c[1] + 15];
      } else {
        c = a1;
        const m = hasRan ? ease((tau - 3) / .5) : 0, u = hasRan ? ease((tau - 3.45) / .45) : 0;
        rec = [lerp(c[0], c[0] + off[0], u), lerp(c[1], c[1] - off[1], u)]; recOp = lerp(1, .4, u);
        if (imp && hasRan){ const r0 = [c[0] + 44, c[1] + 26], r1 = [rec[0] - 22, rec[1]]; ran = [lerp(r0[0], r1[0], m), lerp(r0[1], r1[1], m)]; ranOp = lerp(m, .4, u); }
        if (!imp){ ran = [c[0] + 13, c[1] + 15]; ranOp = 1 - u; }

  }

  /* крупный белок без сигнала: подходит к порам и не проходит за время наблюдения */
  function plain(T){
    let s = '', focus = null; const n = N.big, P = BF.nucPart, pts = [];
    for (let i = n - 1; i >= 0; i--){ const c = bounce(i, wander(i, CY, T * 1.6, n), T, .9, true); s += P.big(+f1(c[0]), +f1(c[1]), ''); pts.push(c); if (i === 0) focus = c; }
    return { s: s + halo(focus), top: n, bot: 0, pts };
  }

  /* малая молекула: проходит пору в обе стороны простой диффузией */
  function small(T){
    let s = '', top = 0, bot = 0, focus = null; const n = N.small, P = BF.nucPart, pts = [];
    for (let i = 0; i < n; i++){
      const t0 = .75 + 1.25 * rnd(i, 11), d = .32, px = PORES[i % 2] + (rnd(i, 12) - .5) * 26, cross = i % 2 === 0 || i === 0, back = i % 6 === 2, more = i % 6 === 3;
      const inC = t => wander(i, CY, t * 1.6, n), inN = t => wander(i, NU, t * 1.6, n);
      let c = inC(T);

        if (T >= t0 && T < t1) c = leg(inC(t0), px, inN(t1), (T - t0) / d);

        if (back && T >= b0 && T < b0 + d) c = leg(inN(b0), px, inC(b0 + d), (T - b0) / d);
        else if (back && T >= b0 + d) c = inC(T);
      }
      s += P.sm([[+f1(c[0]), +f1(c[1])]]);
      if (c[1] < MOUTH_T + 2) top++; else if (c[1] > MOUTH_B - 2) bot++;
      pts.push(c); if (i === 0) focus = c;
    }

  }

  /* неподвижная часть схемы рисуется один раз на выбор: в кадре обновляются только частицы и счётчики */
  function draw(cargo, rm){
    const sc = BF.nucScene(cargo, rm, { ran: true, bg: true }), A = sc.a;
    let s = defs(K) + `<rect width="600" height="420" fill="var(--surface)"/>` + `<g class="clickable" data-g="npc" transform="translate(0,10)">${sc.s.split('#F3EEF8').join('var(--nucbg)')}</g><g class="clickable" data-g="npc" id="ag${K}"></g>`;
    s += `<text class="area" x="${A.cyto[0]}" y="${A.cyto[1] + 4}">${t('s4_lbl_cyto')}</text><text class="area" x="${A.nuc[0]}" y="${A.nuc[1] + 14}">${t('s4_lbl_nuc')}</text>`;
    /* частицы выходят из пор сквозь эту подпись: она лежит поверх них со светлой обводкой */
    s += `<text class="lbl" x="${A.npc[0]}" y="${A.npc[1] + 10}" font-size="12.5" stroke="var(--nucbg)" stroke-width="4" paint-order="stroke">${t('s4_lbl_npc')}</text>`;
    if (rm !== 'none' && !(cargo === 'small' || cargo === 'big') && !(cargo === 'nls' && rm === 'exp') && !(cargo === 'nes' && rm === 'imp'))
      s += `<text class="lbl" x="300" y="30" font-size="13" fill="${BF.C.red}">${t('s4_warn_' + rm + (rm === 'ran' ? '_' + cargo : ''))}</text>`;
    if (caseCause === 'mut') s += `<text class="lbl" x="300" y="30" font-size="13" fill="${BF.C.red}">${t('s4t_warn_mut')}</text>`;
    s += `<text class="lbl-l" x="${A.ranC[0]}" y="${A.ranC[1] + 14}" font-size="12">${t('s4_lbl_rgdp')}</text><text class="lbl-l" x="${A.ranN[0]}" y="${A.ranN[1] + 14}" font-size="12">${t(A.gtpN ? 's4_lbl_rgtp' : 's4_lbl_rgdp')}</text>`;
    s += `<text id="cntT${K}" class="lbl" x="592" y="30" font-size="13" font-weight="600" style="text-anchor:end"></text><text id="cntB${K}" class="lbl" x="592" y="408" font-size="13" font-weight="600" style="text-anchor:end"></text>`;
    s += `<text class="area" x="300" y="14" text-anchor="middle" style="font-size:12px">${t('s4t_status')}</text>`;
    $('svg' + K).innerHTML = s;
  }
  function frame(cargo, rm, T, stop){
    const r = cargo === 'small' ? small(T) : cargo === 'big' ? plain(T) : signal(cargo, rm, T, stop);
    $('ag' + K).innerHTML = r.s;
    $('cntT' + K).textContent = t('s4t_cnt_cyto', { n: r.top }); $('cntB' + K).textContent = t('s4t_cnt_nuc', { n: r.bot });
    /* на телефоне счётчики на схеме могут быть вне увеличенной рамки: дублируются строкой под шкалой */
    const mx = $('tl' + K + 'x'); if (mx) mx.textContent = t('s4t_cnt_cyto', { n: r.top }) + ' · ' + t('s4t_cnt_nuc', { n: r.bot });
    return r;
  }
  $('ctrl' + K).innerHTML =
    segHTML('s4b_cargo', 's4_cargo', [['small', 's4_c_small'], ['big', 's4_c_big'], ['nls', 's4_c_nls'], ['nes', 's4_c_nes']], 'nls') +
    segHTML('s4b_rm', 's4_rm', [['none', 's4_rm_none'], ['imp', 's4_rm_imp'], ['exp', 's4_rm_exp'], ['ran', 's4_rm_ran']], 'none');
  $('take' + K).textContent = t('s4b_take');
  const view = stageView(K);
  const tl = timeStrip(K, { note: 's4t_note', meter: true, render(T){ if ($('ag' + K)) window.FRAME4B = frame(segVal('s4b_cargo'), segVal('s4b_rm'), T, stopOf(segVal('s4b_cargo'), segVal('s4b_rm'))); }, onEnd: view.back });
  window.TL4B = tl;   /* для автотеста и снимков состояний */
  let lastKey = null, armed = false;
  function update(){
    const cargo = segVal('s4b_cargo'), rm = segVal('s4b_rm'), key = cargo + '|' + rm + '|' + caseCause, r = BF.nucScene(cargo, rm).res;
    if (key !== lastKey){ lastKey = key; const stop = stopOf(cargo, rm); draw(cargo, rm); const keys = stageKeys(cargo); if (caseCause === 'mut') keys[0] = 's4t_case_mut_1'; tl.config(keys, stop, caseCause === 'mut' ? 's4t_stop_case_mut' : `s4t_stop_${cargo}_${rm}`, { speed: secs(cargo, stop) }); if (!armed) tl.seek(tl.end); }
    if (armed){ armed = false; tl.play(true); view.reveal(cargo === 'small' ? 300 : 206); } else if (!tl.playing) { if (!$('ag' + K)) draw(cargo, rm); tl.redraw(); }
    const p = (bad, k) => `<span class="pill ${bad ? 'p' : 'np'}">${t(k)}</span>`;
    $('reads' + K).innerHTML =
      readRow(t('s4_r_mode'), '', p(r.mode === 'norec' || r.mode === 'stuck' || r.mode === 'noran', 's4_v_mode_' + r.mode)) +
      readRow(t('s4_r_where'), '', p(false, 's4_v_where_' + r.where)) +
      readRow(t('s4_r_tag'), '', p(false, cargo === 'small' ? 's4_v_tag_no' : 's4_v_tag_yes'));

  }
  window.MODEL4B = (c, r) => BF.nucScene(c, r).res;
  wire(['s4b_cargo', 's4b_rm'], () => { armed = true; update(); });
  const set = (c, r) => { segSet('s4b_cargo', c); segSet('s4b_rm', r); };

    { n: 3, ok: 0, pre(){ set('nls', 'none'); }, apply(){ run('nls', 'ran'); } },
    { n: 3, ok: 0, pre(){ set('nes', 'none'); }, apply(){ run('nes', 'exp'); } },
  ] };
})();

(function(){
  const K = '4a';
  layout(K);
  /* ---- Kalderon et al., 1984: микроинъекция плазмид в клетки Vero, непрямая иммунофлуоресценция через 18 ч.
     ---- Timney et al., 2016: живые дрожжи, белки GFP–PrA 27–67 кДа; постоянная времени выравнивания после обесцвечивания цитоплазмы. ---- */
  const NLS = { t: 'nls', tk: 'mut', pk: 'big', pkn: 'nls', pkt: 'mut' };
  function model4a(exp, prot, mass){
    if (exp === 'nls') return { exp, prot, loc: (prot === 't' || prot === 'pkn') ? 'nuc' : 'cyto' };
    return { exp, mass, tau: mass === '27' ? '15' : '413' };
  }
  window.MODEL4A = model4a;
  $('ctrl' + K).innerHTML =
    segHTML('s4a_exp', 's4a_exp', [['nls', 's4a_exp_nls'], ['size', 's4a_exp_size']], 'nls') +
    `<div id="s4a_nlsCtl">${segHTML('s4a_prot', 's4a_prot', [['t', 's4a_p_t'], ['tk', 's4a_p_tk'], ['pk', 's4a_p_pk'], ['pkn', 's4a_p_pkn'], ['pkt', 's4a_p_pkt']], 'pk')}</div>` +
    `<div id="s4a_sizeCtl">${segHTML('s4a_mass', 's4a_mass', [['27', 's4a_m_27'], ['67', 's4a_m_67']], '27')}</div>`;
  $('take' + K).textContent = t('s4a_take');
  function update(){
    const exp = segVal('s4a_exp'), prot = segVal('s4a_prot'), mass = segVal('s4a_mass');
    $('s4a_nlsCtl').hidden = exp !== 'nls'; $('s4a_sizeCtl').hidden = exp !== 'size';
    const o = model4a(exp, prot, mass);
    const sc = exp === 'nls' ? BF.nucScene(NLS[prot], 'none', { noImp: true }) : BF.nucScene('m' + mass, 'none');
    let s = defs(K) + `<rect width="600" height="420" fill="#fff"/><g class="clickable" data-g="npc" transform="translate(0,10)">${sc.s}</g>`;
    s += `<text class="area" x="14" y="28">${t('s4_lbl_cyto')}</text><text class="area" x="14" y="416">${t('s4_lbl_nuc')}</text>`;
    s += `<text class="lbl" x="300" y="150" font-size="13" font-weight="600">${t(exp === 'nls' ? 's4a_lbl_' + prot : 's4a_lbl_m' + mass)}</text>`;
    $('svg' + K).innerHTML = s;
    const p = (bad, k) => `<span class="pill ${bad ? 'p' : 'np'}">${t(k)}</span>`;
    if (exp === 'nls') {
      $('reads' + K).innerHTML = readRow(t('s4a_r_loc'), t('s4a_r_loc_s'), p(o.loc === 'cyto' && (prot === 'tk' || prot === 'pkt'), 's4a_v_loc_' + prot)) +
        readRow(t('s4a_r_sig'), '', p(false, 's4a_v_sig_' + prot));
      setCap(K, 's4a_nls_' + prot);
    } else {
      $('reads' + K).innerHTML = readRow(t('s4a_r_tau'), t('s4a_r_tau_s'), p(mass === '67', 's4a_v_tau_' + mass)) +
        readRow(t('s4a_r_thr'), '', p(false, 's4a_v_thr'));
      setCap(K, 's4a_size_' + mass);
    }
  }
  wire(['s4a_exp', 's4a_prot', 's4a_mass'], update);
  const setN = pr => { segSet('s4a_exp', 'nls'); segSet('s4a_prot', pr); };
  const setS = m => { segSet('s4a_exp', 'size'); segSet('s4a_mass', m); };
  SCENES[K] = { update, poe: [
    { n: 3, ok: 0, pre(){ setN('pk'); }, apply(){ setN('pkn'); } },
    { n: 3, ok: 0, pre(){ setN('t'); }, apply(){ setN('tk'); } },
    { n: 3, ok: 0, pre(){ setS('27'); }, apply(){ setS('67'); } },
  ] };
})();

['1b', '1a', '2b', '2a', '3b', '3a', '4b', '4a'].forEach(K => { const u = SCENES[K].update; SCENES[K].update = function(){ u(); poeLock(K); }; });
/* выход из сценария до «Показать на схеме» снимает блокировку переключателей (аудит А1, А1-20):
   после каждой перерисовки панели сценария состояние блокировки пересчитывается и для текущей сцены */
(function(){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments); poeLock(cur); return r; }; })();
/* телефон: увеличенная схема открывается по центру (объекты конструктора в середине схемы) (R22) */
window.addEventListener('load', () => setTimeout(() => document.querySelectorAll('#scenes .stage.zoomed .zwrap').forEach(zw => { zw.scrollLeft = Math.max(0, (zw.scrollWidth - zw.clientWidth) / 2); zw.scrollTop = Math.max(0, (zw.scrollHeight - zw.clientHeight) / 2); }), 120));
/* телефон: при переключении вкладки и уровня увеличенная схема тоже открывается по центру */
(function(){ if (typeof show !== 'function') return; const _show = show;
  show = function(){ const r = _show.apply(this, arguments); setTimeout(() => document.querySelectorAll('#scenes .stage.zoomed .zwrap').forEach(zw => { zw.scrollLeft = Math.max(0, (zw.scrollWidth - zw.clientWidth) / 2); zw.scrollTop = Math.max(0, (zw.scrollHeight - zw.clientHeight) / 2); }), 80); return r; }; })();
/* кнопка «Метод» на схемах продвинутого уровня: карточка метода в справке (рецензия v0.1, R19) */
(function(){
  const which = { '1a': () => segVal('s1a_exp') === 'dyn' ? 'dyn' : 'cav', '2a': () => 'nsf', '3a': () => segVal('s3a_exp') === 'tf' ? 'tf' : 'snx', '4a': () => segVal('s4a_exp') === 'nls' ? 'nls' : 'size' };
  Object.keys(which).forEach(K => { const u = SCENES[K].update; SCENES[K].update = function(){ u();
    const m = which[K](), svg = $('svg' + K); if (!svg) return;
    svg.insertAdjacentHTML('beforeend', `<g class="clickable" data-g="meth_${m}" role="button" tabindex="0" aria-label="${t('gn_meth_' + m)}"><rect x="482" y="6" width="112" height="28" rx="8" fill="#fff" stroke="#1F3B73" stroke-width="1.5"/><text class="lbl" x="538" y="20" font-size="13" font-weight="600">${t('meth_btn')}</text></g>`); }; });
})();
/* блок «Дальше в курсе «Молекулярная биология»» (правило курса; рецензия v0.1, R42): ключи mb_1…mb_9 — «текст|адрес» */
(function(){
  const box = $('mbNext'), ul = $('mbList'); if (!box || !ul) return;
  const items = []; for (let i = 1; i <= 9; i++) { const v = TEXTS['mb_' + i]; if (v) items.push(v.split('|')); }
  if (!items.length) return;
  ul.innerHTML = items.map(([txt, href]) => `<li><a href="${href}">${txt}</a></li>`).join('');
  box.hidden = false;
})();

/* =====================================================================
   s9z_case.js — режим «Найти причину» (прототип). Идея — из интерактивной клетки курса «Молекулярная биология».
   Образец со скрытой причиной; студент выбирает измерения. Задача решена, только если данные
   оставляют одно объяснение: верная догадка без данных не засчитывается.
   Логика (caseFits, caseMinimal) — чистые функции; все подписи — через t().
   ===================================================================== */
const CASE_SPEC = {
  '1b': { id: 'c1', causes: ['nosyn', 'noer', 'nobind', 'noadapt', 'dyn'], meth: {
    tot:  { ctrl: 'yes',  nosyn: 'no',   noer: 'yes',  nobind: 'yes',  noadapt: 'yes',  dyn: 'yes' },
    rec:  { ctrl: 'yes',  nosyn: 'no',   noer: 'no',   nobind: 'yes',  noadapt: 'yes',  dyn: 'yes' },
    bind: { ctrl: 'yes',  nosyn: 'no',   noer: 'no',   nobind: 'no',   noadapt: 'yes',  dyn: 'yes' },
    pit:  { ctrl: 'in',   nosyn: 'none', noer: 'none', nobind: 'in',   noadapt: 'out',  dyn: 'in' },
    em:   { ctrl: 'norm', nosyn: 'norm', noer: 'norm', nobind: 'norm', noadapt: 'norm', dyn: 'stalled' },
    tf:   { ctrl: 'norm', nosyn: 'norm', noer: 'norm', nobind: 'norm', noadapt: 'norm', dyn: 'low' },
    fl:   { ctrl: 'norm', nosyn: 'norm', noer: 'norm', nobind: 'norm', noadapt: 'norm', dyn: 'norm' },
  } },
  '4b': { id: 'c4', causes: ['mut', 'exp', 'ran'], meth: {
    ctl:  { ctrl: 'cyto', mut: 'cyto', exp: 'nuc',  ran: 'nuc' },
    nls:  { ctrl: 'nuc',  mut: 'nuc',  exp: 'nuc',  ran: 'both' },
    bind: { ctrl: 'yes',  mut: 'no',   exp: 'no',   ran: 'no' },
  } },
};
/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (set.length < best.length && caseFits(spec, set, truth).length === 1) best = set;
  }
  return best;
}
window.CASE_LOGIC = { CASE_SPEC, caseFits, caseMinimal };

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };
(function(){
  const url = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`);
  Object.keys(CASE_SPEC).forEach(K => {
    const sec = $('sc' + K);
    sec.querySelector('.side').insertAdjacentHTML('afterbegin', `<div class="panel case" id="case${K}" hidden></div>`);
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', `<div class="veil" aria-hidden="true"><b>${t('case_veil')}</b><span>${t('case_veil_s')}</span></div>`);
  });
  const val = (S, m, v) => t(`${S.id}_v_${m}_${v}`);
  /* решение проверяется и после выбора объяснения, и после каждого измерения */
  function settle(K, S){
    if (!CASE.solved && CASE.done.length && CASE.guess === CASE.truth && caseFits(S, CASE.done, CASE.truth).length === 1){
      CASE.solved = true; $('sc' + K).classList.add('casedone'); SCENES[K].caseShow(CASE.truth);
    }
  }
  const ctl = (S, m) => { const k = `${S.id}_v_${m}_${S.meth[m].ctrl}`; return t(TEXTS[k + '_c'] ? k + '_c' : k); };   /* в строке контроля «как в контроле» не годится */
  function start(K, seed){
    const S = CASE_SPEC[K];
    /* порядок измерений и объяснений перемешивается, как в сценариях; ?fixed — постоянный порядок */
    const mix = a => { a = a.slice(); if (!url.has('fixed')) for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    Object.assign(CASE, { on: true, K, seed, truth: S.causes[seed % S.causes.length], done: [], guess: null, solved: false, open: null, mo: mix(Object.keys(S.meth)), co: mix(S.causes) });
    POE.on = false; poeRender();
    const sec = $('sc' + K); sec.classList.add('casemode'); sec.classList.remove('casedone');
    SCENES[K].caseShow(null); render(); sync();
    if (window.matchMedia && matchMedia('(max-width:1000px)').matches) $('case' + K).scrollIntoView({ block: 'start' });
  }
  function exit(){
    if (!CASE.on) return;
    const K = CASE.K, sec = $('sc' + K); CASE.on = false;
    sec.classList.remove('casemode', 'casedone'); $('case' + K).hidden = true; $('case' + K).innerHTML = '';
    SCENES[K].caseShow(null); SCENES[K].update(); sync();
  }
  function verdict(S){
    const g = CASE.guess; if (!g) return '';
    if (CASE.solved) return '';
    const fits = caseFits(S, CASE.done, CASE.truth);
    if (!CASE.done.length) return `<p class="cv warn">${t('case_need')}</p>`;
    if (!fits.includes(g)){
      const m = CASE.done.find(x => S.meth[x][g] !== S.meth[x][CASE.truth]);
      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
    }
    return `<p class="cv warn">${t(fits.length === 2 ? 'case_more1' : 'case_more', { n: fits.length - 1 })}</p>`;
  }
  function render(){
    const K = CASE.K, S = CASE_SPEC[K], box = $('case' + K); box.hidden = false;
    let h = `<div class="k">${t('case_k')}</div><h3 class="ct">${t(S.id + '_title')}</h3>${TEXTS[S.id + '_tag'] ? `<p class="ctag">${t(S.id + '_tag')}</p>` : ''}<p class="co">${t(S.id + '_obs')}</p><p class="cnote">${t('case_note')}</p>`;
    h += `<div class="ch">${t('case_meas')}</div><div class="cm">`;
    CASE.mo.forEach(m => {
      const on = CASE.done.includes(m), open = CASE.open === m;
      h += `<div class="crow${on ? ' on' : ''}"><button type="button" class="cmb" data-m="${m}"${on ? ' aria-pressed="true"' : ''}${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_m_${m}`)}</button>` +
        `<button type="button" class="cq" data-q="${m}" aria-expanded="${open}" aria-label="${t('case_meth')}: ${esc(t(`${S.id}_m_${m}`))}">${t('case_meth')}</button>` +
        (on ? `<div class="cres"><span>${t('case_ctrl')}: ${ctl(S, m)}</span><b>${t('case_sample')}: ${val(S, m, S.meth[m][CASE.truth])}</b></div>` : '') +
        (open ? `<p class="cmeth">${t(`${S.id}_k_${m}`)}</p>` : '') + `</div>`;
    });
    h += `</div><div class="ch">${t('case_why')}</div><div class="cc">`;
    CASE.co.forEach(c => {
      const right = CASE.solved && c === CASE.truth;
      h += `<button type="button" class="ccb${CASE.guess === c ? ' picked' : ''}${right ? ' right' : ''}" data-c="${c}"${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_c_${c}`)}</button>`;
    });
    h += `</div><div role="status">${verdict(S)}</div>`;
    if (CASE.solved){
      const min = caseMinimal(S, CASE.truth);
      const flat = Object.keys(S.meth).filter(m => new Set(S.causes.map(c => S.meth[m][c])).size === 1);
      h += `<div class="cdone" role="status"><b>${t('case_ok')}</b><p>${t(`${S.id}_w_${CASE.truth}`)}</p>` +
        (TEXTS[S.id + '_after'] ? `<p class="cmin">${t(S.id + '_after')}</p>` : '') +
        `<p class="cmin">${t('case_used', { n: CASE.done.length, k: min.length })} ${t('case_enough', { m: min.map(x => '«' + t(`${S.id}_m_${x}`) + '»').join(', ') })}</p>` +
        flat.map(m => `<p class="cmin">${t('case_flat', { m: t(`${S.id}_m_${m}`) })}</p>`).join('') +
        `<p class="cmin"><a href="${t(S.id + '_link_h')}">${t(S.id + '_link_t')}</a></p></div>`;
    }
    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;
    box.innerHTML = h;
    const keep = sel => { const e = $('case' + K).querySelector(sel); if (e && !e.disabled) e.focus({ preventScroll: true }); };   /* панель перестраивается: фокус не теряется */
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      if (!url.has('fixed')) do { seed = Math.floor(Math.random() * 9973); } while (S.causes[seed % S.causes.length] === CASE.truth);
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur]; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
if (!TEXTS.route_url) document.querySelector('.routes').hidden = true;
/* «← Раздел …: семинары»: адрес берётся из ключа home_href (например, section-2.html#seminars; без ключа — index.html рядом);
   на сайте ссылка относительная, в сохранённом файле — на адрес сайта (аудит 06.11.2026, LINK-001) */
(function(){
  const a = $('homeLink'); if (!a) return;
  if (TEXTS.home_href) a.setAttribute('href', TEXTS.home_href);
  if (!/^(fresll\.github\.io|edu\.mazunin\.science)$/.test(location.hostname)) a.href = 'https://fresll.github.io/bio/' + (a.getAttribute('href') || '').replace(/^\.\//, '');
})();
window.addEventListener('hashchange', fromHash);
initNav(); fromHash(); show(); revInit();

</script>
