рансферрином в кислой среде ослабевает, и в присутствии хелатора железо отделяется за минуты.", "p3a_2_q": "Апотрансферрин связан с рецептором при pH 5. Комплекс перенесли в среду с нейтральным pH, как на поверхности клетки. Что произойдёт?", "p3a_2_o1": "Апотрансферрин быстро отделится от рецептора", "p3a_2_o2": "Апотрансферрин останется на рецепторе, пока не свяжет новое железо", "p3a_2_o3": "Апотрансферрин отделится так же медленно, как трансферрин с железом", "p3a_2_e": "При нейтральном pH апотрансферрин отделяется от рецептора с полупериодом 16 с при 37 °C, а трансферрин с железом — 7,5 мин, то есть примерно в 28 раз медленнее; по сводной оценке авторов для двух температур — в 30–40 раз. Рецептор освобождается для нового трансферрина с железом.", "p3a_2_w2": "При нейтральном pH апотрансферрин удерживается на рецепторе слабо и отделяется за секунды; новое железо он связывает уже в среде.", "p3a_2_w3": "Скорости отделения сильно различаются: при 37 °C полупериод для трансферрина с железом — 7,5 мин, для апотрансферрина — 16 с (примерно в 28 раз).", "p3a_3_q": "В клетках HeLa подавили синтез SNX27. Где окажется переносчик глюкозы GLUT1 и что будет с захватом глюкозы?", "p3a_3_o1": "GLUT1 уйдёт в лизосомы, захват глюкозы снизится более чем на 60 %", "p3a_3_o2": "GLUT1 останется на мембране, захват глюкозы не изменится", "p3a_3_o3": "GLUT1 накопится в ранних эндосомах, но не будет расщепляться", "p3a_3_e": "Без SNX27 GLUT1 не возвращается из ранней эндосомы: он оказывается в LAMP1-положительных лизосомах и расщепляется быстрее, а захват глюкозы снижается более чем на 60 %.", "p3a_3_w2": "GLUT1 постоянно проходит эндоцитоз; его присутствие на мембране зависит от возврата из эндосомы, который обеспечивает SNX27.", "p3a_3_w3": "В ранних эндосомах (EEA1) GLUT1 не накапливается: при подавлении SNX27 он оказывается в лизосомах (LAMP1) и расщепляется быстрее.", "p3a_4_q": "В обычных клетках синтезируется GLUT1 без трёх концевых аминокислот — без PDZ-лиганда. Где окажется этот белок?", "p3a_4_o1": "В лизосомах, как полный GLUT1 при подавлении SNX27", "p3a_4_o2": "На плазматической мембране, как полный GLUT1", "p3a_4_o3": "В комплексе Гольджи: без концевого участка белок не покидает его", "p3a_4_e": "GLUT1 без PDZ-лиганда оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на мембране. Удаление сигнала на грузе даёт тот же результат, что и подавление белка, который этот сигнал узнаёт.", "p3a_4_w2": "Удаление PDZ-лиганда нарушает удержание GLUT1 на поверхности: мутант обнаруживается в лизосомах. Собственная транспортная активность мутанта в этом эксперименте не определялась.", "p3a_4_w3": "В показанном эксперименте мутант обнаруживается в LAMP1-положительных компартментах, а не задерживается преимущественно в комплексе Гольджи. Это согласуется с нарушением сортировки в эндосомах; полный маршрут мутанта одним этим наблюдением не установлен.", "s4_cargo": "Груз", "s4_c_small": "малая молекула", "s4_c_big": "крупный белок без сигнала", "s4_c_nls": "крупный белок с NLS (в цитоплазме)", "s4_c_nes": "крупный белок с NES (в ядре)", "s4_rm": "Убрать деталь", "s4_rm_none": "ничего", "s4_rm_imp": "импортин", "s4_rm_exp": "экспортин", "s4_rm_ran": "Ran-ГТФ", "s4_lbl_cyto": "цитоплазма", "s4_lbl_nuc": "ядро", "s4_lbl_npc": "комплексы ядерных пор в двойной ядерной оболочке", "s4_warn_imp": "нет импортина — NLS не узнаётся", "s4_warn_exp": "нет экспортина — NES не узнаётся", "s4_warn_ran_nls": "нет Ran-ГТФ — груз не освобождается в ядре", "s4_warn_ran_nes": "нет Ran-ГТФ — экспортин не связывает груз", "s4_lbl_rgtp": "Ran-ГТФ", "s4_lbl_rgdp": "Ran-ГДФ", "s4t_note": "Этапы описаны для выделенной молекулы. Число молекул, скорость и соотношение по обе стороны оболочки условные, не измерены. Возврат импортина и экспортина здесь не показан.", "s4t_status": "размеры и время условные", "s4t_cnt_cyto": "в цитоплазме: {n}", "s4t_cnt_nuc": "в ядре: {n}", "s4t_small_1": "В начальный момент модели малые молекулы находятся только в цитоплазме.", "s4t_small_2": "Малые молекулы проходят каналы поры простой диффузией в обе стороны; сигнал и рецепторы не нужны.", "s4t_small_3": "Малые молекулы распределяются по обе стороны оболочки.", "s4t_big_1": "Крупный белок без сигнала находится в цитоплазме.", "s4t_big_2": "Белки с FG-повторами создают в поре селективный барьер: за время наблюдения заметного пассивного переноса нет.", "s4t_nls_1": "Крупный белок с сигналом ядерной локализации (NLS) находится в цитоплазме.", "s4t_nls_2": "Импортин связывает белок с NLS.", "s4t_nls_3": "Комплекс импортина с грузом проходит пору.", "s4t_nls_4": "В ядре Ran-ГТФ освобождает груз от импортина: груз накапливается в ядре.", "s4t_nes_1": "Крупный белок с последовательностью ядерного экспорта (NES) находится в ядре.", "s4t_nes_2": "В ядре экспортин связывает белок с NES; Ran-ГТФ стабилизирует этот комплекс.", "s4t_nes_3": "Комплекс экспортина с грузом проходит пору.", "s4t_nes_4": "В цитоплазме груз освобождается от экспортина и остаётся там.", "s4t_stop_nls_imp": "Путь остановился после этапа 1: без импортина сигнал ядерной локализации не узнаётся, и белок остаётся в цитоплазме.", "s4t_stop_nls_ran": "Путь остановился после этапа 3: без Ran-ГТФ груз не освобождается в ядре, и направленного накопления в ядре нет.", "s4t_stop_nes_exp": "Путь остановился после этапа 1: без экспортина последовательность ядерного экспорта не узнаётся, и белок остаётся в ядре.", "s4t_stop_nes_ran": "Путь остановился после этапа 1: без Ran-ГТФ экспортин не образует устойчивого комплекса с грузом, и белок остаётся в ядре.", "s4_r_mode": "Как груз проходит пору", "s4_v_mode_diff": "простой диффузией", "s4_v_mode_none": "проходит очень медленно", "s4_v_mode_imp": "импорт с импортином", "s4_v_mode_exp": "экспорт с экспортином", "s4_v_mode_norec": "сигнал не узнаётся — переноса нет", "s4_v_mode_stuck": "связывается с импортином, но не накапливается в ядре", "s4_v_mode_noran": "комплекс с экспортином не образуется", "s4_r_where": "Где находится груз", "s4_v_where_both": "по обе стороны оболочки", "s4_v_where_cyto": "в цитоплазме", "s4_v_where_cytoslow": "в цитоплазме; в ядре не накапливается", "s4_v_where_nuc": "в ядре", "s4_r_tag": "Нужен ли сигнал на грузе", "s4_v_tag_no": "нет", "s4_v_tag_yes": "да", "s4_small_any": "Ионы и небольшие молекулы (до ~5 кДа) проходят через заполненные водой каналы комплекса ядерной поры простой диффузией практически свободно; процесс неспецифичен и не требует сигналов ядерной локализации. Импортин, экспортин и градиент Ran на это не влияют.", "s4_small_any_z": "Малые молекулы распределяются по обе стороны оболочки без участия транспортных рецепторов.", "s4_big_any": "Крупный белок без сигнала ядерной локализации в модели остаётся в цитоплазме: чем крупнее молекула, тем медленнее она проходит пору пассивно; белки с FG-повторами создают в поре селективный барьер. Модель показывает короткое время наблюдения, за которое заметного пассивного переноса нет; насколько медленно крупный белок всё же проходит пору, показывает продвинутый уровень этой вкладки.", "s4_big_any_z": "Крупный белок без сигнала в ядре не накапливается: быстрый направленный перенос через пору идёт только с транспортным рецептором.", "s4_nls_none": "Белок с сигналом ядерной локализации (NLS) связывается с растворимым цитоплазматическим белком импортином, который переносит его в ядро; процесс энергозависим и идёт при участии ГТФ. Направление переноса задаёт градиент Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. На схеме закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ. В ядре Ran-ГТФ освобождает груз от импортина.", "s4_nls_none_z": "Так в ядро попадают белки, которые синтезируются в цитоплазме, — например, гистоны и ламины.", "s4_nls_imp": "Без импортина сигнал ядерной локализации не узнаётся: за время наблюдения крупный белок остаётся в цитоплазме, хотя сигнал на нём есть (ЗАКЛЮЧЕНИЕ).", "s4_nls_imp_z": "Сигнал на белке есть, но без импортина он не узнаётся, и активного переноса нет.", "s4_nls_exp": "Без экспортина, который переносит из ядра белки с NES, белок с NLS по-прежнему узнаётся импортином и поступает в ядро: эти рецепторы узнают разные сигналы (ЗАКЛЮЧЕНИЕ).", "s4_nls_exp_z": "Импорт и экспорт белков с NES обеспечивают разные транспортные рецепторы. Сверх программы: транспортные рецепторы тоже возвращаются для нового цикла — в классическом импорте импортин-α выносит из ядра экспортин CAS, а импортин-β выходит из ядра в комплексе с Ran-ГТФ (БИО-3·29).", "s4_nls_ran": "Без Ran-ГТФ (весь Ran связан с ГДФ) импортин связывает белок и проходит с ним через пору, но в ядре груз не освобождается, и направленного накопления в ядре нет (ЗАКЛЮЧЕНИЕ). Направление переноса задаёт градиент Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. На схеме закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ.", "s4_nls_ran_z": "При импорте связывание груза импортином от Ran-ГТФ не зависит, а освобождение груза в ядре зависит (ЗАКЛЮЧЕНИЕ).", "s4_nes_none": "Белок с последовательностью ядерного экспорта (NES) связывается в ядре с экспортином, который переносит его в цитоплазму; процесс идёт при участии ГТФ. Ran-ГТФ стабилизирует комплекс экспортина с грузом до выхода из ядра.", "s4_nes_none_z": "Экспорт позволяет белкам, которые работают в ядре лишь временно, покидать его.", "s4_nes_imp": "Без импортина белок с NES по-прежнему узнаётся экспортином и выходит из ядра: эти рецепторы узнают разные сигналы (ЗАКЛЮЧЕНИЕ).", "s4_nes_imp_z": "Импорт и экспорт обеспечивают разные транспортные рецепторы.", "s4_nes_exp": "Без экспортина последовательность ядерного экспорта не узнаётся: экспортин-зависимый перенос нарушен, и за время наблюдения крупный белок остаётся в ядре (ЗАКЛЮЧЕНИЕ).", "s4_nes_exp_z": "Экспортин-зависимый перенос этого груза нарушен: сигнал на белке есть, но его не узнаёт транспортный рецептор.", "s4_nes_ran": "Без Ran-ГТФ (весь Ran связан с ГДФ) экспортин не образует устойчивого комплекса с грузом в ядре: за время наблюдения крупный белок с NES в модели остаётся в ядре (ЗАКЛЮЧЕНИЕ). Направление переноса задаёт градиент Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. На схеме закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ.", "s4_nes_ran_z": "При экспорте Ran-ГТФ нужен уже для связывания груза экспортином в ядре: без него комплекс не образуется (ЗАКЛЮЧЕНИЕ).", "s4b_take": "Малые молекулы (до ~5 кДа) проходят через пору простой диффузией практически свободно; крупные белки пассивно проходят очень медленно, а быстро и направленно их переносят транспортные рецепторы: белок с сигналом ядерной локализации — импортин в ядро, белок с последовательностью ядерного экспорта — экспортин из ядра. Направление переноса задаёт градиент Ran. ЗАКЛЮЧЕНИЕ: без импортина белок с NLS остаётся в цитоплазме, без экспортина белок с NES — в ядре; без Ran-ГТФ импортин связывает груз, но не освобождает его в ядре, а экспортин не связывает груз.", "p4b_1_q": "Крупный белок с последовательностью ядерного экспорта (NES) находится в ядре; за время наблюдения он пассивно проходит пору пренебрежимо мало, других путей выхода в модели нет. Экспортин есть, но Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Выйдет ли белок из ядра за время наблюдения?", "p4b_1_o1": "Нет: без Ran-ГТФ экспортин не образует комплекса с грузом", "p4b_1_o2": "Да: экспортин узнаёт NES и без Ran-ГТФ", "p4b_1_o3": "Да, простой диффузией, как малая молекула", "p4b_1_e": "Ran-ГТФ стабилизирует комплекс экспортина с грузом до выхода из ядра. Без Ran-ГТФ комплекс не образуется: рецепторный экспорт нарушен, и заметного выхода белка за время наблюдения нет (ЗАКЛЮЧЕНИЕ).", "p4b_1_w2": "В отличие от импортина, который связывает NLS и без Ran-ГТФ, экспортин связывает груз только вместе с Ran-ГТФ.", "p4b_1_w3": "По условию белок крупный и за время наблюдения пассивно проходит пору пренебрежимо мало; быстро и направленно его выносит из ядра только экспортин.", "p4b_2_q": "Импортин есть, но Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Что произойдёт с белком, несущим NLS?", "p4b_2_o1": "Импортин свяжет белок, но белок не будет накапливаться в ядре", "p4b_2_o2": "Белок накопится в ядре, как обычно: импортин его узнал", "p4b_2_o3": "Импортин не свяжет белок: узнавание NLS зависит от Ran", "p4b_2_e": "Направление переноса задаёт градиент Ran: Ran-ГТФ в ядре освобождает груз от импортина. Без Ran-ГТФ белок связывается с импортином и проходит с ним пору, но не освобождается в ядре, поэтому не накапливается там (ЗАКЛЮЧЕНИЕ).", "p4b_2_w2": "Связывание с импортином — только первый этап: без Ran-ГТФ в ядре груз не освобождается и не накапливается там.", "p4b_2_w3": "Импортин связывает NLS в цитоплазме; Ran-ГТФ нужен для освобождения груза в ядре, а не для его узнавания.", "p4b_3_q": "Крупный белок с последовательностью ядерного экспорта (NES) находится в ядре; за время наблюдения он пассивно проходит пору пренебрежимо мало, других путей выхода в модели нет. Что с ним будет за это время, если в клетке нет экспортина?", "p4b_3_o1": "Он останется в ядре", "p4b_3_o2": "Он выйдет из ядра с импортином", "p4b_3_o3": "Он выйдет из ядра простой диффузией, как малая молекула", "p4b_3_e": "Белок с NES быстро выходит из ядра, только связавшись в ядре с экспортином. Без экспортина последовательность ядерного экспорта не узнаётся: рецепторный экспорт нарушен, и за время наблюдения белок остаётся в ядре (ЗАКЛЮЧЕНИЕ).", "p4b_3_w2": "Импортин узнаёт сигнал ядерной локализации и переносит белки в ядро; последовательность ядерного экспорта он не связывает.", "p4b_3_w3": "По условию белок крупный и за время наблюдения пассивно проходит пору пренебрежимо мало; практически свободно простой диффузией проходят лишь ионы и небольшие молекулы.", "s4a_exp": "Эксперимент", "s4a_exp_nls": "сигнал ядерной локализации", "s4a_exp_size": "размер и проницаемость поры", "s4a_prot": "Белок", "s4a_p_t": "большой Т-антиген", "s4a_p_tk": "Т-антиген, Lys128 → Thr", "s4a_p_pk": "пируваткиназа", "s4a_p_pkn": "пируваткиназа + PKKKRKV", "s4a_p_pkt": "пируваткиназа + участок 119–135 (Thr128)", "s4a_mass": "Масса белка", "s4a_m_27": "27 кДа (GFP)", "s4a_m_67": "67 кДа (GFP + 6 доменов PrA)", "s4a_lbl_t": "большой Т-антиген вируса SV40 — в ядре", "s4a_lbl_tk": "Lys128 → Thr: белок остаётся в цитоплазме", "s4a_lbl_pk": "пируваткиназа — цитоплазматический белок", "s4a_lbl_pkn": "пируваткиназа с PKKKRKV — в ядре", "s4a_lbl_pkt": "пируваткиназа с участком 119–135 (Thr128) — в цитоплазме", "s4a_lbl_m27": "27 кДа: выравнивается за секунды", "s4a_lbl_m67": "67 кДа: выравнивается за минуты", "s4a_r_loc": "Где белок", "s4a_r_loc_s": "клетки Vero, иммунофлуоресценция", "s4a_v_loc_t": "в ядре", "s4a_v_loc_tk": "в цитоплазме", "s4a_v_loc_pk": "в цитоплазме", "s4a_v_loc_pkn": "в ядре", "s4a_v_loc_pkt": "в цитоплазме", "s4a_r_sig": "Сигнал ядерной локализации", "s4a_v_sig_t": "свой, около Lys128", "s4a_v_sig_tk": "нарушен заменой одного лизина", "s4a_v_sig_pk": "нет", "s4a_v_sig_pkn": "присоединён к N-концу", "s4a_v_sig_pkt": "участок 119–135 с заменой Lys128 → Thr", "s4a_r_tau": "Характерная постоянная времени выравнивания τ", "s4a_r_tau_s": "живые дрожжи; обесцвечивание цитоплазмы", "s4a_v_tau_27": "15 ± 1,4 с", "s4a_v_tau_67": "413 ± 92 с", "s4a_r_thr": "Резкий порог размера", "s4a_v_thr": "не обнаружен", "s4a_nls_t": "Большой Т-антиген вируса SV40 после синтеза в цитоплазме накапливается в ядре; для этого нужен короткий участок вокруг остатка лизина 128.", "s4a_nls_t_z": "Белок вируса использует тот же путь импорта, что и белки клетки.", "s4a_nls_tk": "Замена одного остатка — лизина 128 на треонин — нарушает накопление большого Т-антигена в ядре: белок остаётся в цитоплазме, хотя его стабильность заметно не меняется.", "s4a_nls_tk_z": "Сигнал необходим: без одного ключевого лизина белок не попадает в ядро.", "s4a_nls_pk": "Пируваткиназа — фермент гликолиза, в норме цитоплазматический белок.", "s4a_nls_pk_z": "Контроль: без сигнала ядерной локализации крупный белок остаётся в цитоплазме.", "s4a_nls_pkn": "К N-концу пируваткиназы присоединили участок Т-антигена: с остатками 119–135 химерный белок накапливался в ядре полностью, а после укорочения до остатков 126–132 — семи аминокислот Pro-Lys-Lys-Lys-Arg-Lys-Val (PKKKRKV) — по-прежнему накапливался в ядре. Авторы оговаривают, что в действие такого короткого сигнала могут вносить вклад соседние остатки, закодированные линкером.", "s4a_nls_pkn_z": "Сигнал достаточен: семь аминокислот направляют в ядро чужой цитоплазматический белок.", "s4a_nls_pkt": "Участок 119–135 с заменой лизина 128 на треонин не влиял на локализацию пируваткиназы: белок оставался в цитоплазме.", "s4a_nls_pkt_z": "Контроль показывает, что ядерную локализацию даёт именно последовательность сигнала, а не сам факт присоединения пептида.", "s4a_size_27": "Живые дрожжи Saccharomyces cerevisiae: флуоресценцию белка GFP (27 кДа) в цитоплазме гасили лазером и следили, как убывает флуоресценция ядра. За время τ разница между текущей и равновесной флуоресценцией уменьшается примерно в 2,7 раза, за τ·ln 2 — вдвое. Для GFP τ, приведённая к клетке со средними объёмами ядра и цитоплазмы и средним числом пор, — 15 ± 1,4 с (± — 95%-й доверительный интервал).", "s4a_size_27_z": "Белки такого размера проходят пору пассивно и быстро, без транспортных рецепторов.", "s4a_size_67": "Белок 67 кДа (GFP с шестью доменами PrA): τ = 413 ± 92 с, то есть выравнивание идёт минуты. τ растёт с массой примерно в степени 3,8 (3,8 ± 1,0; 95%-й доверительный интервал), но резкого порога, выше которого пассивный проход невозможен, нет.", "s4a_size_67_z": "Пора — мягкий барьер: крупные белки проходят пассивно всё медленнее, поэтому для быстрого и направленного переноса им нужны сигнал и транспортный рецептор.", "s4a_take": "Два эксперимента уточняют базовую модель. Сигнал ядерной локализации необходим (замена одного лизина оставляет Т-антиген в цитоплазме), а его добавления достаточно в клетке с работающим транспортным аппаратом (семь аминокислот PKKKRKV переводят в ядро цитоплазматическую пируваткиназу). Резкого порога размера у поры нет: пассивный проход замедляется с массой белка постепенно, поэтому граница «до ~5 кДа» описывает практически свободную диффузию, а не запрет для более крупных белков.", "p4a_1_q": "К N-концу пируваткиназы — цитоплазматического белка — присоединили семь аминокислот PKKKRKV из Т-антигена вируса SV40. Где окажется химерный белок?", "p4a_1_o1": "В ядре", "p4a_1_o2": "В цитоплазме: короткий пептид не меняет адрес крупного белка", "p4a_1_o3": "Поровну в ядре и в цитоплазме, как малая молекула", "p4a_1_e": "Химерный белок накапливался в ядре: семи аминокислот PKKKRKV (остатки 126–132 Т-антигена) достаточно, чтобы направить в ядро цитоплазматический белок; авторы не исключают вклада соседних остатков, закодированных линкером.", "p4a_1_w2": "Адрес задаёт не размер белка, а сигнал: в исследованной химере присоединённый доступный NLS обеспечил накопление пируваткиназы в ядре, хотя это крупный белок. В других белках доступность сигнала может зависеть от их строения.", "p4a_1_w3": "Пируваткиназа — крупный белок, и пассивно она проходит пору медленно; с сигналом её переносит рецептор, и она накапливается в ядре, а не распределяется поровну.", "p4a_2_q": "В большом Т-антигене вируса SV40 лизин 128 заменили треонином. Где окажется белок?", "p4a_2_o1": "В цитоплазме: сигнал ядерной локализации нарушен", "p4a_2_o2": "В ядре: одна замена не может изменить локализацию крупного белка", "p4a_2_o3": "Нигде: белок станет нестабильным и разрушится", "p4a_2_e": "Замена лизина 128 на треонин нарушает накопление Т-антигена в ядре, хотя стабильность белка заметно не меняется. Сигнал необходим.", "p4a_2_w2": "Лизин 128 входит в сигнал ядерной локализации; без него рецептор не узнаёт сигнал, и белок остаётся в цитоплазме.", "p4a_2_w3": "Мутантный белок в клетках сохраняется, и его стабильность заметно не меняется; меняется только локализация.", "p4a_3_q": "В живых дрожжах сравнили белок 27 кДа и белок 67 кДа без сигналов ядерной локализации. Что показала постоянная времени выравнивания между ядром и цитоплазмой?", "p4a_3_o1": "Белок 67 кДа выравнивается в десятки раз медленнее, но всё же проходит", "p4a_3_o2": "Белок 67 кДа не проходит совсем: он выше порога пропускания поры", "p4a_3_o3": "Оба выравниваются одинаково быстро", "p4a_3_e": "Характерная постоянная времени τ — 15 с для 27 кДа и 413 с для 67 кДа: разница около 27 раз, при том что подвижность белков в растворе различается лишь в 1,6 раза. Резкого порога нет.", "p4a_3_w2": "Резкого порога в этом диапазоне масс не обнаружено: белок 67 кДа проходит пору пассивно, но за минуты.", "p4a_3_w3": "Пассивный проход сильно зависит от массы: постоянная времени растёт примерно как масса в степени 3,8.", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Метод", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а получено «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Какое измерение их разделит?", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Какое измерение их разделит?", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Среди предложенных объяснений достаточно, например: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Новый образец", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента. Список причин здесь задан заранее, в реальной работе его нет.", "c1_title": "Клетки плохо поглощают липопротеины низкой плотности", "c1_tag": "Сверх программы — на коллоквиуме и зачёте не требуется.", "c1_obs": "Условия: фибробласты кожи человека в культуре, меченые липопротеины низкой плотности (ЛПНП) в среде, 37 °C; контрольные клетки — в тех же условиях. Наблюдение: образец поглощает ЛПНП намного хуже контроля. Причина одна из пяти; какая — определите по измерениям.", "c1_c_nosyn": "Рецептор ЛПНП не синтезируется", "c1_c_noer": "Рецептор ЛПНП синтезируется, но не выходит из ЭПР", "c1_c_nobind": "Изменён внеклеточный участок рецептора, связывающий ЛПНП", "c1_c_noadapt": "Изменён внутриклеточный участок рецептора, связывающий адаптер AP2 — белковый комплекс, соединяющий рецептор с клатрином", "c1_c_dyn": "В клетке избыток мутантного динамина K44A (лизин 44 заменён аланином) с нарушенным связыванием и гидролизом ГТФ", "c1_m_tot": "Рецептор ЛПНП в клетке в целом", "c1_m_rec": "Рецепторы ЛПНП на поверхности клетки", "c1_m_bind": "Связывание ЛПНП с поверхностью при 4 °C, когда поглощения нет", "c1_m_pit": "Положение рецепторов относительно клатриновых ямок", "c1_m_em": "Форма клатриновых решёток на мембране", "c1_m_tf": "Захват трансферрина", "c1_m_fl": "Захват жидкости", "c1_v_tot_yes": "есть", "c1_v_tot_no": "нет", "c1_v_rec_yes": "есть", "c1_v_rec_no": "нет", "c1_v_bind_yes": "есть", "c1_v_bind_no": "нет", "c1_v_pit_in": "в ямках", "c1_v_pit_out": "вне ямок", "c1_v_pit_none": "рецепторов на поверхности нет", "c1_v_em_norm": "как в контроле", "c1_v_em_stalled": "изогнутых примерно вдвое больше, плоских меньше", "c1_v_tf_norm": "как в контроле", "c1_v_tf_low": "резко снижен", "c1_v_fl_norm": "начальная скорость как в контроле", "c1_v_em_norm_c": "плоские и изогнутые решётки", "c1_v_tf_norm_c": "обычный захват", "c1_v_fl_norm_c": "обычная начальная скорость", "c1_k_tot": "Что измеряется: количество белка рецептора во всей клетке — белки разделяют по размеру и выявляют антителами (иммуноблот). Уровень: популяция клеток. Контроль: контрольные клетки и белок, количество которого не меняется. Типичный артефакт: антитела могут не узнать изменённый белок. Чего не доказывает: где находится рецептор и работает ли он.", "c1_k_rec": "Что измеряется: рецепторы на поверхности неповреждённых клеток выявляют мечеными антителами к внеклеточной части рецептора. Уровень: поверхность клетки. Контроль: контрольные клетки и клетки без первичных антител. Типичный артефакт: антитела могут не узнать изменённый белок. Чего не доказывает: что рецептор связывает лиганд; метод качественный и не показывает, сколько рецепторов на поверхности.", "c1_k_bind": "Что измеряется: меченые ЛПНП на поверхности клеток при 4 °C: при этой температуре лиганд связывается, но не поглощается. Уровень: популяция клеток. Контроль: избыток немеченых ЛПНП показывает неспецифическое связывание. Типичный артефакт: часть метки прилипает к поверхности без рецептора. Чего не доказывает: что связанный лиганд затем поглощается.", "c1_k_pit": "Что измеряется: положение меченых рецепторов относительно клатриновых ямок в электронном микроскопе. Уровень: отдельная ямка. Контроль: контрольные клетки и другой рецептор тех же клеток. Типичный артефакт: метка занимает часть рецепторов и может их сближать. Чего не доказывает: что ямка затем отделится от мембраны.", "c1_k_em": "Что измеряется: число плоских и изогнутых клатриновых решёток на цитоплазматической стороне мембраны. Уровень: участок мембраны. Контроль: контрольные клетки. Типичный артефакт: подготовка препарата может деформировать мембрану. Чего не доказывает: какой белок отвечает за изменение; в этой задаче список причин задан, поэтому измерение может оказаться достаточным.", "c1_k_tf": "Что измеряется: поглощение меченого трансферрина — другого лиганда, который входит в клетку через клатриновые ямки. Уровень: популяция клеток. Контроль: контрольные клетки. Типичный артефакт: меченый лиганд на поверхности легко принять за поглощённый. Чего не доказывает: где именно нарушен общий путь.", "c1_k_fl": "Что измеряется: начальная скорость поглощения вещества, растворённого в среде и не связанного с рецептором, например пероксидазы хрена. Уровень: популяция клеток. Контроль: контрольные клетки. Типичный артефакт: вещество может прилипать к поверхности. Чего не доказывает: что рецепторный путь работает.", "c1_w_nosyn": "Рецептора нет ни на поверхности, ни в клетке, поэтому ЛПНП не с чем связаться (ЗАКЛЮЧЕНИЕ). По модели ямки и другие рецепторы при этом работают.", "c1_w_noer": "Рецептор есть в клетке, но не на поверхности: ЛПНП не с чем связаться (ЗАКЛЮЧЕНИЕ). По модели ямки и другие рецепторы при этом работают.", "c1_w_nobind": "Рецептор есть на поверхности, но ЛПНП с ним не связываются (ЗАКЛЮЧЕНИЕ). По модели пустые рецепторы по-прежнему попадают в ямки и входят в клетку.", "c1_w_noadapt": "ЛПНП связываются с поверхностью, но рецепторы не попадают в клатриновые ямки, и лиганд не поглощается. Для поглощения недостаточно связать лиганд: рецептор должен быть собран в ямке (ЗАКЛЮЧЕНИЕ).", "c1_w_dyn": "Нарушен общий этап — отделение везикул от мембраны (ЗАКЛЮЧЕНИЕ). По модели рецепторы при этом в ямках, захват трансферрина снижен, начальная скорость захвата жидкости сохранена. Для ЛПНП это перенос: у Damke et al. измерены трансферрин и EGF (эпидермальный фактор роста).", "c1_after": "Порядок этапов на шкале — общая схема: рецептор ЛПНП попадает в ямки и без лиганда.", "c1_src": "Прямые данные: дефекты рецептора ЛПНП — Brown, Goldstein, 1986; Alberts et al., 2022, с. 791–792; мутантный динамин — Damke et al., 1994 (клетки HeLa). Остальные значения выведены из модели.", "c1_link_h": "seminar-3-route.html#ldl-cycle", "c1_link_t": "Подробнее: шаг БИО-3·20 в «Объяснениях»", "c4_title": "Белок не выходит из ядра", "c4_tag": "Сверх программы — на коллоквиуме и зачёте не требуется.", "c4_obs": "Условия: клетки человека в культуре, 37 °C, крупный белок с последовательностью ядерного экспорта (NES), короткое время наблюдения: пассивно через пору белок за это время почти не проходит. В модели один экспортин. Наблюдение: в контрольных клетках белок накапливается в цитоплазме, в образце остаётся в ядре. Причина одна из трёх; какая — определите по измерениям.", "c4_c_mut": "Сигнал NES на белке изменён", "c4_c_exp": "В клетке нет экспортина, который узнаёт этот сигнал", "c4_c_ran": "В клетке нет Ran-ГТФ: весь Ran связан с ГДФ", "c4_m_ctl": "Где находится другой белок с таким же NES", "c4_m_nls": "Где находится белок с сигналом ядерной локализации (NLS)", "c4_m_bind": "Связывание исследуемого белка с экспортином", "c4_v_ctl_cyto": "в цитоплазме", "c4_v_ctl_nuc": "в ядре", "c4_v_nls_nuc": "в ядре", "c4_v_nls_both": "по обе стороны оболочки", "c4_v_bind_yes": "есть", "c4_v_bind_no": "нет", "c4_k_ctl": "Что измеряется: положение другого белка с таким же сигналом — иммунофлуоресценцией. Уровень: отдельная клетка. Контроль: контрольные клетки. Типичный артефакт: при фиксации растворимый белок может сместиться. Чего не доказывает: какая деталь механизма нарушена; показывает, общий это дефект или дефект этого груза.", "c4_k_nls": "Что измеряется: положение белка с сигналом ядерной локализации — иммунофлуоресценцией. Уровень: отдельная клетка. Контроль: контрольные клетки. Типичный артефакт: при фиксации растворимый белок может сместиться. Чего не доказывает: какая деталь механизма нарушена; показывает, затронут ли и импорт.", "c4_k_bind": "Что измеряется: экспортин осаждают антителами и проверяют, осаждается ли вместе с ним белок. Уровень: популяция клеток. Контроль: контрольные клетки и осаждение без антител. Типичный артефакт: комплексы могут образоваться и распасться уже после разрушения клеток. Чего не доказывает: почему комплекса нет.", "c4_w_mut": "Другой белок с таким же NES выходит из ядра: механизм экспорта работает, а сигнал на этом белке не узнаётся (ЗАКЛЮЧЕНИЕ).", "c4_w_exp": "Другой белок с таким же NES не выходит из ядра, а импорт не нарушен: Ran-ГТФ есть, не хватает экспортина (ЗАКЛЮЧЕНИЕ).", "c4_w_ran": "Нарушены и экспорт, и накопление белка с NLS в ядре: общая деталь двух путей — Ran-ГТФ (ЗАКЛЮЧЕНИЕ). Без него экспортин не образует устойчивого комплекса с грузом, а импортированный груз не освобождается.", "c4_src": "Перенос через пору — Alberts et al., 2022, с. 739–742. Значения таблицы выведены из модели.", "c4_link_h": "seminar-3-route.html#ran-direction", "c4_link_t": "Подробнее: шаг БИО-3·25 в «Объяснениях»", "s1t_case_norec_1": "ЛПНП находится в среде; рецепторов ЛПНП на поверхности нет.", "s1t_case_norec_7": "Другие рецепторы вошли в клетку; ЛПНП остаётся в среде.", "s1t_case_other": "Ямки образуются и отделяются с другими рецепторами.", "s1t_case_empty": "Рецепторы без лиганда собираются в ямке и входят в клетку.", "s1t_case_nobind_1": "ЛПНП находится в среде; рецепторы на поверхности его не связывают.", "s1t_case_nobind_7": "Пустые рецепторы вошли в клетку; ЛПНП остаётся в среде.", "s1t_case_noadapt_1": "ЛПНП связан с рецепторами, но рецепторы не связывают адаптер.", "s1t_case_noadapt_7": "Рецепторы с ЛПНП остаются вне ямок: лиганд не поглощается.", "s1t_lbl_other": "другие рецепторы", "s1t_stop_case_dyn": "Ямка впячена, но шейка не сужается и везикула не отделяется: путь остановился после этапа 4.", "s4t_case_mut_1": "Крупный белок с изменённым сигналом находится в ядре.", "s4t_stop_case_mut": "Сигнал изменён, экспортин его не узнаёт: путь остановился после этапа 1.", "s4t_warn_mut": "сигнал изменён — экспортин его не узнаёт", "meth_btn": "Метод", "gn_meth_dyn": "Метод · мутантный динамин", "g_meth_dyn": "Что измеряется: переход меченного биотином трансферрина в суженные ямки и пузырьки — по недоступности для авидина, добавленного снаружи; строение ямок — электронной микроскопией; захват жидкости — по пероксидазе хрена в среде. Уровень: культура клеток HeLa. Контроль: те же клетки до включения синтеза и клетки с динамином дикого типа в таком же количестве. Типичный артефакт: мутантный белок синтезируется в количестве, не менее чем в 50 раз превышающем собственный динамин клетки, и подавляет его работу. Чего не доказывает: как именно динамин сужает шейку — сам или вместе с другими белками.", "gn_meth_cav": "Метод · сила вытягивания мембранной нити", "g_meth_cav": "Что измеряется: сила, с которой оптический пинцет удерживает бусину, вытянувшую из мембраны тонкую нить; она пропорциональна квадратному корню эффективного натяжения мембраны. Уровень: отдельные клетки в культуре. Контроль: клетки дикого типа и без кавеолина-1 в изо- и гипоосмотической среде. Типичный артефакт: около 75 % эффективного натяжения даёт сцепление мембраны с цитоскелетом, поэтому сравнивают изменения силы в первые 5 мин, пока кортикальный актин не перестраивается. Чего не доказывает: натяжение самого липидного бислоя отдельно от сцепления с цитоскелетом.", "gn_meth_nsf": "Метод · бесклеточная система", "g_meth_nsf": "Что измеряется: перенос белка G вируса везикулярного стоматита между стопками комплекса Гольджи — по присоединению [3H]GlcNAc в акцепторных мембранах. Уровень: мембраны и цитозоль клеток CHO вне клетки. Контроль: необработанные мембраны с обычным цитозолем. Типичный артефакт: N-этилмалеимид модифицирует остатки цистеина многих белков, поэтому вывод о роли NSF опирается на восстановление переноса очищенным белком. Чего не доказывает: на каком этапе цикла носителя работает NSF.", "gn_meth_tf": "Метод · связывание лиганда при разном pH", "g_meth_tf": "Что измеряется: количество меченого трансферрина (125I) и железа (59Fe), оставшихся на клетках после смены pH среды. Уровень: поверхность клеток гепатомы HepG2. Контроль: трансферрин с железом при нейтральном pH; другие лиганды (асиалоорозомукоид, инсулин). Типичный артефакт: чтобы трансферрин не уходил в клетку при 37 °C, добавляют ингибиторы энергетического обмена; кислая среда снаружи лишь моделирует эндосому. Чего не доказывает: по какому пути комплекс выходит из эндосомы.", "gn_meth_snx": "Метод · белки поверхности и иммунофлуоресценция", "g_meth_snx": "Что измеряется: количество белков на поверхности (метка биотином и масс-спектрометрия) и положение GLUT1 относительно маркеров лизосом (LAMP1) и ранних эндосом (EEA1); захват меченой 2-дезоксиглюкозы. Уровень: клетки HeLa и RPE1. Контроль: контрольная РНК; по две разные РНК против каждого белка. Типичный артефакт: подавление белка бывает неполным и может затрагивать другие белки — поэтому используют разные РНК. Чего не доказывает: как SNX27–ретромер не пускает груз в лизосомный путь.", "gn_meth_nls": "Метод · химерные белки и иммунофлуоресценция", "g_meth_nls": "Что измеряется: положение белка в клетке — в ядре или в цитоплазме — через 18 ч после микроинъекции плазмиды. Уровень: клетки Vero. Контроль: исходная пируваткиназа и химера с участком 119–135, в котором лизин 128 заменён треонином. Типичный артефакт: оценка качественная, по микроскопии; соседние остатки, в том числе закодированные линкером, тоже влияют на накопление в ядре. Чего не доказывает: что сигнал ускоряет перенос — эксперимент показывает накопление в ядре, и удержание белка в ядре им не исключено (оговорка авторов); каким белком узнаётся сигнал — импортин тогда ещё не был известен.", "gn_meth_size": "Метод · фотообесцвечивание в живых клетках", "g_meth_size": "Что измеряется: флуоресценцию белка в цитоплазме гасят лазером и следят, как убывает флуоресценция ядра, пока меченые и обесцвеченные молекулы обмениваются через поры; постоянную времени приводят к клетке со средними объёмами ядра и цитоплазмы и средним числом пор. Уровень: живые дрожжи, около 236 клеток. Контроль: белки одинакового строения, различающиеся числом доменов по 7 кДа. Типичный артефакт: если белок связывается с чем-то в клетке, он движется медленнее, чем позволяет пора. Чего не доказывает: что те же числа верны для клеток человека.", "gn_gf": "Фактор роста", "g_gf": "Белок, который связывается со своим рецептором на поверхности клетки и запускает в ней ответ. Факторы роста, например эпидермальный фактор роста, усиливают макропиноцитоз. Белки-рецепторы — вопрос 4 коллоквиума.", "gn_phago": "Фагоцитоз", "g_phago": "Поглощение крупных частиц — бактерий, обломков клеток, пыли — специализированными клетками-фагоцитами: макрофагами, нейтрофилами, дендритными клетками. Псевдоподии, образованные за счёт перестройки актина, охватывают частицу, и образуется фагосома более 250 нм.", "gn_membrane": "Плазматическая мембрана", "g_membrane": "Липидный бислой с белками, отделяющий клетку от внеклеточной среды. На схеме синие кружки — гидрофильные головки липидов, оранжевые линии — их гидрофобные хвосты.", "gn_micro": "Микропиноцитоз", "g_micro": "Постоянное неспецифическое поглощение жидкости и небольших белковых молекул в мелких пузырьках (менее 150 нм). Такие пузырьки образуются разными путями — из покрытых клатрином ямок и без клатрина.", "gn_macro": "Макропиноцитоз", "g_macro": "Регулируемый захват внеклеточной жидкости: перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы более 0,2 мкм. Усиливается факторами роста; характерен для клеток иммунной системы.", "gn_receptor": "Рецептор груза", "g_receptor": "Трансмембранный белок, который снаружи связывает определённый груз (лиганд), а цитоплазматическим участком — белок-адаптер. Так рецепторы с грузом концентрируются в покрытой клатрином ямке.", "gn_clathrin": "Клатрин", "g_clathrin": "Белок оболочки, который собирается в решётку с цитоплазматической стороны мембраны и изгибает её в ямку. С рецепторами груза клатрин связывается не напрямую, а через белки-адаптеры.", "gn_ccv": "Покрытая клатрином везикула", "g_ccv": "Пузырёк, отделившийся от ямки вместе с клатриновой оболочкой. Затем оболочка быстро сбрасывается, и везикула может слиться с мембраной-мишенью.", "gn_actin": "Актиновый цитоскелет", "g_actin": "Сеть актиновых филаментов под плазматической мембраной. Её перестройка создаёт складки мембраны при макропиноцитозе и псевдоподии при фагоцитозе.", "gn_dynamin": "Динамин", "g_dynamin": "ГТФаза, которая опосредует отделение покрытой клатрином везикулы от мембраны; шейку ямки перерезает динамин. Сверх программы: в клетках с мутантным динамином K44A ямки собираются, но не сужаются и не отделяются.", "gn_cycle": "Цикл транспортного носителя", "g_cycle": "Последовательные этапы переноса груза между мембранами: белки оболочки отбирают груз и изгибают мембрану, носитель отделяется, сбрасывает оболочку, узнаёт мишень и сливается с ней. Оболочки разных маршрутов: COP-II — из ЭПР в комплекс Гольджи, COP-I — обратно и между цистернами, клатрин — от плазматической мембраны и транс-сети комплекса Гольджи.", "gn_golgi": "Комплекс Гольджи", "g_golgi": "Стопка уплощённых мембранных цистерн, в которой белки, пришедшие из грЭПР, модифицируются, сортируются и упаковываются в транспортные везикулы; цистерны, ближайшие к грЭПР, образуют цис-сеть, дальние — транс-сеть. На схеме продвинутого уровня — бесклеточная система из мембран комплекса Гольджи.", "gn_vesicle": "Транспортный носитель", "g_vesicle": "Мембранный пузырёк, который переносит груз из одного компартмента в другой: образуется почкованием от мембраны-донора и сливается с мембраной-мишенью.", "gn_snare": "SNARE-белки", "g_snare": "Белки слияния мембран: SNARE носителя (v-SNARE) и SNARE мембраны-мишени (t-SNARE) собираются в комплекс и обеспечивают слияние. По аминокислотному остатку в центре комплекса SNARE-белки делят на R-SNARE (остаток аргинина) и Q-SNARE (остаток глутамина). Сверх программы: это другая классификация, а не новое название v- и t-SNARE — у носителя из ЭПР есть и R-, и Q-SNARE; комплекс из четырёх спиралей собирается от N-концов к C-концам и стягивает мембраны.", "gn_nsf": "NSF", "g_nsf": "АТФаза, чувствительная к N-этилмалеимиду (англ. N-ethylmaleimide-sensitive factor). Вместе с α-SNAP разбирает SNARE-комплексы, оставшиеся собранными после слияния, и возвращает SNARE-белки в работу.", "gn_endosome": "Ранняя эндосома", "g_endosome": "Сортировочный компартмент: в него после снятия оболочки поступает содержимое эндоцитозных везикул; в самом частом варианте рецепторы отсюда возвращаются на поверхность, а лиганды остаются в эндосоме и попадают в лизосомы. Ранняя эндосома образуется при слиянии эндоцитозных везикул, обычно около 10 минут принимает новые везикулы, а затем созревает в позднюю. Сверх программы: при созревании Rab5 на эндосоме сменяется Rab7.", "gn_tfr": "Рецептор трансферрина", "g_tfr": "Рецептор белка-переносчика железа трансферрина. Трансферрин отдаёт железо в кислой эндосоме, но остаётся на рецепторе и вместе с ним возвращается на поверхность.", "gn_lysosome": "Лизосома", "g_lysosome": "Мембранная органелла с гидролитическими ферментами, в которой расщепляются макромолекулы, поступившие в клетку путём эндоцитоза. LAMP1 — белок мембраны лизосом и поздних эндосом; совпадение груза с LAMP1 в микроскопии согласуется с доставкой в лизосомные компартменты, а расщепление подтверждают отдельным измерением.", "gn_glut1": "GLUT1", "g_glut1": "Переносчик глюкозы плазматической мембраны. На его цитоплазматическом конце — короткий PDZ-лиганд, по которому SNX27–ретромер возвращает GLUT1 из ранней эндосомы.", "gn_retromer": "SNX27–ретромер", "g_retromer": "Белковый комплекс на ранней эндосоме: сортирующий нексин SNX27 связывает PDZ-лиганд груза, ретромер (VPS26–VPS29–VPS35) направляет груз назад, а не в лизосому.", "gn_npc": "Комплекс ядерной поры", "g_npc": "Белковый комплекс в поре двойной ядерной оболочки: построен примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; каркас имеет восьмикратную симметрию. Малые молекулы (до ~5 кДа) проходят его простой диффузией практически свободно; крупные белки пассивно проходят очень медленно, а быстро — с транспортными рецепторами.", "gn_caveola": "Кавеола", "g_caveola": "Небольшое колбовидное впячивание плазматической мембраны, стабилизированное кавеолинами и кавинами; при повышении натяжения кавеола распластывается и увеличивает площадь плоской мембраны. Размер 50–100 нм, мембрана кавеол обогащена холестерином и сфинголипидами.", "gn_er": "грЭПР", "g_er": "Гранулярная эндоплазматическая сеть: мембранный компартмент с рибосомами на цитоплазматической стороне. Белки, синтезированные здесь, покидают его в носителях с оболочкой COP-II.", "gn_ribo": "Рибосомы", "g_ribo": "Рибосомы на цитоплазматической стороне мембраны грЭПР: здесь синтезируются белки, которые сразу поступают в ЭПР.", "gn_tgn": "Транс-сеть комплекса Гольджи", "g_tgn": "Выход из комплекса Гольджи: отсюда часть белков направляется в поздние эндосомы прямым путём — в покрытых клатрином везикулах.", "gn_le": "Поздняя эндосома", "g_le": "Эндосома, в которую созревает ранняя: её среда кислее, она лежит глубже в цитоплазме; мембрана поздней эндосомы впячивается внутрь, образуя мультивезикулярное тельце.", "gn_copii": "COP-II", "g_copii": "Оболочка носителей, переносящих только что синтезированные белки из грЭПР в цис-сеть комплекса Гольджи (антероградный, прямой транспорт).", "gn_copi": "COP-I", "g_copi": "Оболочка носителей ретроградного (обратного) транспорта: из комплекса Гольджи в грЭПР и между цистернами комплекса Гольджи.", "gn_tether": "Rab-белки и белки удержания", "g_tether": "Белки первичного узнавания мишени: Rab в активной форме (связанный с ГТФ) отмечает мембрану и привлекает длинные белки удержания, которые держат подходящий носитель на расстоянии до сборки SNARE.", "gn_cargo": "Растворимый груз", "g_cargo": "Белок в просвете компартмента: переносится в просвете носителя.", "gn_memcargo": "Мембранный груз", "g_memcargo": "Белок, встроенный в мембрану: переносится в мембране носителя, один из доменов обращён в просвет.", "gn_ligand": "Лиганд", "g_ligand": "Молекула, которую рецептор связывает снаружи клетки или в просвете компартмента. После эндоцитоза лиганд и рецептор могут разойтись в ранней эндосоме.", "gn_mvb": "Мультивезикулярное тельце", "g_mvb": "Поздняя эндосома с внутрипросветными везикулами, образованными впячиванием её мембраны в просвет; мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется.", "gn_ilv": "Внутрипросветная везикула", "g_ilv": "Пузырёк в просвете поздней эндосомы, образованный впячиванием её мембраны. В его мембране — рецепторы, направленные на расщепление; связанный лиганд обращён в просвет эндосомы.", "gn_ub": "Убиквитин", "g_ub": "Небольшой белок, который присоединяется к другим белкам как метка; убиквитинированный рецептор включается в мембрану внутрипросветных везикул и расщепляется в лизосоме.", "gn_nucleus": "Ядро", "g_nucleus": "Компартмент, в котором находится геном; отделён от цитоплазмы ядерной оболочкой, вещества переходят через комплексы ядерных пор.", "gn_envelope": "Ядерная оболочка", "g_envelope": "Две мембраны с перинуклеарным пространством между ними; наружная мембрана продолжается в мембрану грЭПР. Обе мембраны прерываются в порах.", "gn_nlsprot": "Белок с сигналом ядерной локализации (NLS)", "g_nlsprot": "Крупный белок с участком NLS (красная метка), по которому его узнаёт импортин и переносит из цитоплазмы в ядро.", "gn_nesprot": "Белок с последовательностью ядерного экспорта (NES)", "g_nesprot": "Крупный белок с участком NES, по которому его в ядре узнаёт экспортин и переносит в цитоплазму.", "gn_mutprot": "Белок с изменённым сигналом", "g_mutprot": "Крупный белок, у которого сигнал изменён: транспортный рецептор его не узнаёт.", "gn_bigprot": "Крупный белок без сигнала", "g_bigprot": "За время наблюдения пассивно через пору почти не проходит: белки с FG-повторами создают в поре селективный барьер.", "gn_smallmol": "Малая молекула", "g_smallmol": "Ионы и небольшие молекулы (до ~5 кДа) проходят через каналы поры простой диффузией практически свободно.", "gn_importin": "Импортин", "g_importin": "Растворимый транспортный рецептор: связывает белки с NLS в цитоплазме и переносит их в ядро; в ядре Ran-ГТФ освобождает груз.", "gn_exportin": "Экспортин", "g_exportin": "Растворимый транспортный рецептор: в ядре вместе с Ran-ГТФ связывает белки с NES и переносит их в цитоплазму.", "gn_ran": "Ran-ГТФ и Ran-ГДФ", "g_ran": "Малая ГТФаза Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме; это различие задаёт направление переноса через пору. Закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ.", "gn_transferrin": "Трансферрин", "g_transferrin": "Белок плазмы крови, переносящий железо; отдаёт железо в кислой эндосоме, а сам вместе с рецептором возвращается на поверхность клетки.", "gn_iron": "Железо", "g_iron": "Ионы железа, которые переносит трансферрин; в кислой среде он их отдаёт.", "gn_asor": "Асиалоорозомукоид", "g_asor": "Лиганд другого рецептора, взятый для сравнения: при кислом pH отделяется от своего рецептора.", "gn_gfpprot": "Флуоресцентный белок", "g_gfpprot": "Белок с GFP одного строения, но разной массы — 27 или 67 кДа: по нему измеряют, как быстро пассивно проходит пора.", "src_01": "Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Гл. 12–13.", "src_02": "Kaksonen M., Roux A. Mechanisms of clathrin-mediated endocytosis. Nat Rev Mol Cell Biol. 2018;19:313–326. doi:10.1038/nrm.2017.132", "src_03": "Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934. doi:10.1083/jcb.127.4.915", "src_04": "Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413. doi:10.1016/j.cell.2010.12.031", "src_05": "Lamaze C., Blouin C. M., Sens P. Caveolae mechanics in cellular functions and disease. Nat Rev Mol Cell Biol. 2026;27:581–600. doi:10.1038/s41580-026-00964-2", "src_06": "Parton R. G., Kozlov M. M., Lundmark R. A lipid-centric view of endocytosis by caveolae. Nat Cell Biol. 2026;28:852–860. doi:10.1038/s41556-026-01945-5", "src_07": "Lennartz H. M. et al. Quantification of lipid sorting during clathrin-mediated endocytosis. Nat Cell Biol. 2026;28:2027–2035. doi:10.1038/s41556-026-02068-7", "src_08": "Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856. doi:10.1073/pnas.85.21.7852", "src_09": "Jahn R., Cafiso D. C., Tamm L. K. Mechanisms of SNARE proteins in membrane fusion. Nat Rev Mol Cell Biol. 2024;25:101–118. doi:10.1038/s41580-023-00668-x", "src_10": "Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262. doi:10.1073/pnas.80.8.2258", "src_11": "Kalderon D., Roberts B. L., Richardson W. D., Smith A. E. A short amino acid sequence able to specify nuclear location. Cell. 1984;39:499–509. doi:10.1016/0092-8674(84)90457-4", "src_12": "Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76. doi:10.1083/jcb.201601004", "src_13": "Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471. doi:10.1038/ncb2721"};
function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- SVG: заготовки ---------- */
function defs(s){ return `<defs>
  <marker id="a_${s}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
  <marker id="b_${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="10" orient="auto"><path d="M3.5 0 L6.5 0 L6.5 10 L3.5 10 z" class="mk"/></marker>
</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }
function setEdge(id, v){ const e = $(id); if (e) e.style.opacity = (typeof v === 'boolean' ? (v ? 1 : .16) : (.16 + .84 * clamp(v))).toFixed(2); }
function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }
function setOp(id, v){ const e = $(id); if (e) e.setAttribute('opacity', (+v).toFixed(2)); }
function setTxt(id, s){ const e = $(id); if (e) e.textContent = s; }
function move(id, dx, dy){ const e = $(id); if (e) e.style.transform = `translate(${dx}px,${dy}px)`; }
function PB(id, x, y){ return `<g class="pb fade" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="8.5"/><text x="${x}" y="${y + .5}">P</text></g>`; }
function XX(id, x1, y1, x2, y2){ return `<g class="cross fade" id="${id}" opacity="0"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x2}" y1="${y1}" x2="${x1}" y2="${y2}"/></g>`; }
/* узел-прямоугольник: id группы, подпись, справка */
function BX(id, x, y, w, h, label, g, fs = 13){
  return `<g id="${id}" class="clickable" data-g="${g || ''}"><rect class="box" id="${id}_r" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="lbl" x="${x + w / 2}" y="${y + h / 2}" font-size="${fs}" font-weight="700">${label}</text></g>`;
}
function setBoxState(id, st){ setCls(id + '_r', st); }
function missing(id, on){ const g = $(id); if (g) g.classList.toggle('missing', !!on); }

/* ---------- элементы управления ---------- */
function sliderHTML(id, k, val){ return `<div class="slider"><div class="row"><label for="${id}">${t(k)}</label><output id="${id}O">${val} %</output></div><input type="range" id="${id}" min="0" max="100" value="${val}"></div>`; }
function toggleHTML(id, k, on){ return `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span>${t(k)}</span></label>`; }
function segHTML(id, k, opts, val){ return `<div class="grp"><span>${t(k)}</span><div class="seg" id="${id}">` +
  opts.map(([v, kk]) => `<button data-v="${v}" aria-pressed="${v === val}">${t(kk)}</button>`).join('') + `</div></div>`; }
function segVal(id){ const b = $(id).querySelector('[aria-pressed="true"]'); return b ? b.dataset.v : null; }
function segSet(id, v){ $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
function wire(ids, fn){ ids.forEach(id => { const e = $(id); if (!e) return;
  if (e.classList.contains('seg')) e.querySelectorAll('button').forEach(b => b.onclick = () => { segSet(id, b.dataset.v); fn(); });
  else e.addEventListener(e.type === 'checkbox' ? 'change' : 'input', fn); }); }
function sv(id){ const e = $(id); const v = +e.value / 100; const o = $(id + 'O'); if (o) o.textContent = Math.round(v * 100) + ' %'; return v; }
function setSlider(id, v){ $(id).value = Math.round(v * 100); sv(id); }
function readRow(name, sub, right){ return `<div class="read"><div><b>${name}</b>${sub ? `<small>${sub}</small>` : ''}</div>${right}</div>`; }
function meterRow(name, v, text){ return `<div class="read" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;gap:8px"><small style="color:var(--ink);font-size:14.5px">${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i></div></div>`; }
function pill(on, kOn = 'pill_p', kOff = 'pill_np'){ return `<span class="pill ${on ? 'p' : 'np'}">${t(on ? kOn : kOff)}</span>`; }

/* ---------- вестерн-блот ---------- */
function blotHTML(rows, lanes){
  if (!lanes.length) return `<p class="small">${t('blot_empty')}</p>`;
  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;
  h += `<div class="lanes">` + lanes.map(L => `<div class="head">${L.h1}<br>${L.h2 || '&nbsp;'}</div>`).join('') + `</div>`;
  h += `<div class="film"><div class="lanes">` + lanes.map(L => `<div>` + L.v.map(v => `<div class="cell"><div class="band" style="opacity:${(0.04 + 0.96 * clamp(v)).toFixed(2)}"></div></div>`).join('') + `</div>`).join('') + `</div></div>`;
  return h + `</div></div></div>`;
}

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };

   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов

/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,

/* «↓ К выводу»: на компьютере правая колонка прокручивается отдельно; кнопка видна, пока вывод ниже видимой части */
let revTakeT = 0;

function revTake(){
  const desk = !window.matchMedia || matchMedia('(min-width:1001px)').matches;
  document.querySelectorAll('#scenes .scene:not([hidden]) .side').forEach(sd => {
    const b = sd.querySelector('.totake'), tk = sd.querySelector('.take'); if (!b || !tk) return;

      && tk.getBoundingClientRect().top > sd.getBoundingClientRect().bottom - 2;   /* кнопка не ложится на начало вывода (рецензия v1.0, R37) */
    if (b.hidden === on) b.hidden = !on;
  });
}
function revInit(){

  document.querySelectorAll('#scenes .side').forEach(sd => {

    tk.setAttribute('tabindex', '-1');

    sd.appendChild(b);

  window.addEventListener('resize', revTakeSoon);
  /* подсказка над увеличенной схемой; на телефоне схема по умолчанию увеличена — подписи читаются без ручного увеличения */

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;
    return `<path d="M${x - 2},${y1} Q${x - 7},${ym} ${x - 2},${y2}" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */
  function profile(y0, feats, x0 = 6, x1 = 594){
    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        const b0 = Math.atan2(yn - cyb, xl - f.c) + 2 * Math.PI, b1 = Math.atan2(yn - cyb, xr - f.c);
        for (let a = b0; a >= b1; a -= Math.PI / 48) P.push([f.c + R * Math.cos(a), cyb + R * Math.sin(a)]);
        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }
    flatTo(x1); return P;
  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → комплекс Гольджи (COP-II), 'gerr' — комплекс Гольджи → ЭПР (COP-I), 'intra' — между цистернами комплекса Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).
     rm: 'none' | 'coat' (нет белков оболочки) | 'uncoat' (оболочка не снимается) | 'snare' (нет SNARE на носителе).
     Возвращает { s: SVG, a: точки для подписей }. Русского текста нет. */
  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
