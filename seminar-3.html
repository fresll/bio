 (полупериод 16 с)", "s3a_v_bound_asor_7": "связан", "s3a_v_bound_asor_5": "отделяется", "s3a_r_iron": "Железо", "s3a_r_iron_s": "в присутствии хелатора железа", "s3a_v_iron_bound": "связано с трансферрином", "s3a_v_iron_released": "освобождается (полупериод 1,5 мин)", "s3a_v_iron_none": "—", "s3a_r_glut": "Где находится GLUT1", "s3a_r_glut_s": "переносчик глюкозы; иммунофлуоресценция", "s3a_v_glut_pm": "на плазматической мембране", "s3a_v_glut_lyso": "в лизосомах (LAMP1)", "s3a_r_glc": "Захват глюкозы", "s3a_r_glc_s": "меченая 2-дезоксиглюкоза, 10 мин", "s3a_v_glc_ctrl": "контроль", "s3a_v_glc_low": "ниже более чем на 60 %", "s3a_v_glc_nm": "не измеряли", "s3a_r_tfr": "Рецептор трансферрина на поверхности", "s3a_r_tfr_s": "протеомика поверхности", "s3a_v_tfr_same": "не изменился", "s3a_v_tfr_less": "в 1,5 раза меньше, не расщепляется", "s3a_tf_holo_7": "Трансферрин с железом связан с рецептором на поверхности (клетки гепатомы человека HepG2). При нейтральном pH и 37 °C он отделяется от рецептора медленно, с полупериодом 7,5 мин.", "s3a_tf_holo_7_z": "Так трансферрин доставляет железо: он связывается с рецептором снаружи и вместе с ним уходит в эндосому.", "s3a_tf_holo_5": "При кислом pH, как в эндосоме, трансферрин остаётся связанным с рецептором (при pH от 4,5 до 7,5; измерено при 4 °C, сходный результат — при 37 °C), а железо от него отделяется: при pH 5 и 37 °C в присутствии хелатора — с полупериодом около 1,5 мин.", "s3a_tf_holo_5_z": "Кислая среда отделяет от трансферрина не рецептор, а железо: железо остаётся в клетке, а белок — на рецепторе.", "s3a_tf_apo_5": "При pH 5,4 апотрансферрин (без железа) связывается с рецептором так же прочно и в том же количестве, как трансферрин с железом при pH 7,0.", "s3a_tf_apo_5_z": "В кислой эндосоме апотрансферрин остаётся на рецепторе и вместе с ним возвращается к поверхности.", "s3a_tf_apo_7": "При нейтральном pH апотрансферрин быстро отделяется от рецептора: при 37 °C с полупериодом 16 с, в 30–40 раз быстрее, чем трансферрин с железом.", "s3a_tf_apo_7_z": "Вернувшись на поверхность, рецептор отдаёт апотрансферрин в среду и освобождается для нового трансферрина с железом.", "s3a_tf_asor_7": "Асиалоорозомукоид (белок крови без концевых остатков сиаловой кислоты) при нейтральном pH связан со своим рецептором на клетках HepG2.", "s3a_tf_asor_7_z": "Для сравнения взят лиганд, который после эндоцитоза расщепляется в клетке.", "s3a_tf_asor_5": "При кислом pH асиалоорозомукоид, как и инсулин, отделяется от своего рецептора, а трансферрин в тех же условиях остаётся связанным.", "s3a_tf_asor_5_z": "Кислая среда эндосомы отделяет многие лиганды от рецепторов; трансферрин — исключение, и поэтому он возвращается на поверхность.", "s3a_snx_none_full": "Клетки HeLa, контроль: переносчик глюкозы GLUT1 находится на плазматической мембране. После эндоцитоза его возвращает из ранней эндосомы комплекс SNX27–ретромер, который связывает короткий концевой участок GLUT1 — PDZ-лиганд.", "s3a_snx_none_full_z": "Возврат из эндосомы удерживает GLUT1 на поверхности, и клетка поглощает глюкозу.", "s3a_snx_snx27_full": "Подавлен SNX27: GLUT1 почти полностью оказывается в LAMP1-положительных лизосомах и расщепляется быстрее; захват глюкозы снижается более чем на 60 %. Рецептор трансферрина при этом не меняется.", "s3a_snx_snx27_full_z": "Без SNX27 GLUT1 не возвращается из эндосомы и уходит на расщепление, хотя сам белок не изменён.", "s3a_snx_vps35_full": "Подавлен VPS35 — субъединица ретромера: GLUT1 уходит в лизосомы, захват глюкозы снижается более чем на 60 %. Рецептора трансферрина на поверхности в 1,5 раза меньше, но он не расщепляется.", "s3a_snx_vps35_full_z": "Ретромер нужен для возврата многих белков поверхности: при его подавлении с поверхности уходят 152 мембранных белка.", "s3a_snx_none_dpdz": "GLUT1 без трёх концевых аминокислот (без PDZ-лиганда) в контрольных клетках оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на плазматической мембране; захват глюкозы в этом эксперименте не измеряли.", "s3a_snx_none_dpdz_z": "Удаление сигнала возврата на самом грузе даёт тот же результат, что и подавление белка, который этот сигнал узнаёт.", "s3a_snx_snx27_dpdz": "Сочетание подавленного SNX27 и GLUT1 без PDZ-лиганда в работе не изучали. В модели GLUT1 попадает в лизосомы: возврат нарушен и со стороны груза, и со стороны белка, узнающего сигнал (ЗАКЛЮЧЕНИЕ модели).", "s3a_snx_snx27_dpdz_z": "Сочетание показано для сравнения; данных о нём нет.", "s3a_snx_vps35_dpdz": "Сочетание подавленного VPS35 и GLUT1 без PDZ-лиганда в работе не изучали. В модели GLUT1 попадает в лизосомы (ЗАКЛЮЧЕНИЕ модели).", "s3a_snx_vps35_dpdz_z": "Сочетание показано для сравнения; данных о нём нет.", "s3a_take": "Два эксперимента уточняют базовую модель. Трансферрин — пример лиганда, который не отделяется от рецептора в эндосоме: кислая среда отделяет от него железо, а апотрансферрин отделяется от рецептора только при нейтральном pH на поверхности. Возврат рецептора из ранней эндосомы требует сигнала на самом белке и белков, которые его узнают: без PDZ-лиганда или без SNX27–ретромера GLUT1 уходит в лизосомы.", "p3a_1_q": "Трансферрин с железом связан с рецептором. Среду подкислили до pH 5, как в эндосоме (в присутствии хелатора железа). Что произойдёт?", "p3a_1_o1": "Железо отделится от трансферрина, а трансферрин останется на рецепторе", "p3a_1_o2": "Трансферрин вместе с железом отделится от рецептора", "p3a_1_o3": "Ничего не изменится: и железо, и трансферрин останутся на месте", "p3a_1_e": "При pH 5 в присутствии хелатора железо отделяется от трансферрина, связанного с рецептором (полупериод около 1,5 мин при 37 °C), а сам белок — теперь апотрансферрин — остаётся на рецепторе. Трансферрин, связанный с рецептором при нейтральном pH, не отделялся при последующей обработке растворами с pH от 4,5 до 7,5 (4 °C, с хелатором железа; сходный результат — при 37 °C).", "p3a_1_w2": "Многие лиганды в кислой среде действительно отделяются от рецепторов (например, асиалоорозомукоид), но трансферрин остаётся связанным; отделяется только железо.", "p3a_1_w3": "Связь железа с трансферрином в кислой среде ослабевает, и в присутствии хелатора железо отделяется за минуты.", "p3a_2_q": "Апотрансферрин связан с рецептором при pH 5. Комплекс перенесли в среду с нейтральным pH, как на поверхности клетки. Что произойдёт?", "p3a_2_o1": "Апотрансферрин быстро отделится от рецептора", "p3a_2_o2": "Апотрансферрин останется на рецепторе, пока не свяжет новое железо", "p3a_2_o3": "Апотрансферрин отделится так же медленно, как трансферрин с железом", "p3a_2_e": "При нейтральном pH апотрансферрин отделяется от рецептора с полупериодом 16 с при 37 °C, а трансферрин с железом — 7,5 мин, то есть примерно в 28 раз медленнее; по сводной оценке авторов для двух температур — в 30–40 раз. Рецептор освобождается для нового трансферрина с железом.", "p3a_2_w2": "При нейтральном pH апотрансферрин удерживается на рецепторе слабо и отделяется за секунды; новое железо он связывает уже в среде.", "p3a_2_w3": "Скорости отделения сильно различаются: при 37 °C полупериод для трансферрина с железом — 7,5 мин, для апотрансферрина — 16 с (примерно в 28 раз).", "p3a_3_q": "В клетках HeLa подавили синтез SNX27. Где окажется переносчик глюкозы GLUT1 и что будет с захватом глюкозы?", "p3a_3_o1": "GLUT1 уйдёт в лизосомы, захват глюкозы снизится более чем на 60 %", "p3a_3_o2": "GLUT1 останется на мембране, захват глюкозы не изменится", "p3a_3_o3": "GLUT1 накопится в ранних эндосомах, но не будет расщепляться", "p3a_3_e": "Без SNX27 GLUT1 не возвращается из ранней эндосомы: он оказывается в LAMP1-положительных лизосомах и расщепляется быстрее, а захват глюкозы снижается более чем на 60 %.", "p3a_3_w2": "GLUT1 постоянно проходит эндоцитоз; его присутствие на мембране зависит от возврата из эндосомы, который обеспечивает SNX27.", "p3a_3_w3": "В ранних эндосомах (EEA1) GLUT1 не накапливается: при подавлении SNX27 он оказывается в лизосомах (LAMP1) и расщепляется быстрее.", "p3a_4_q": "В обычных клетках синтезируется GLUT1 без трёх концевых аминокислот — без PDZ-лиганда. Где окажется этот белок?", "p3a_4_o1": "В лизосомах, как полный GLUT1 при подавлении SNX27", "p3a_4_o2": "На плазматической мембране, как полный GLUT1", "p3a_4_o3": "В комплексе Гольджи: без концевого участка белок не покидает его", "p3a_4_e": "GLUT1 без PDZ-лиганда оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на мембране. Удаление сигнала на грузе даёт тот же результат, что и подавление белка, который этот сигнал узнаёт.", "p3a_4_w2": "Удаление PDZ-лиганда нарушает удержание GLUT1 на поверхности: мутант обнаруживается в лизосомах. Собственная транспортная активность мутанта в этом эксперименте не определялась.", "p3a_4_w3": "В показанном эксперименте мутант обнаруживается в LAMP1-положительных компартментах, а не задерживается преимущественно в комплексе Гольджи. Это согласуется с нарушением сортировки в эндосомах; полный маршрут мутанта одним этим наблюдением не установлен.", "s4_cargo": "Груз", "s4_c_small": "малая молекула", "s4_c_big": "крупный белок без сигнала", "s4_c_nls": "крупный белок с NLS (в цитоплазме)", "s4_c_nes": "крупный белок с NES (в ядре)", "s4_rm": "Убрать деталь", "s4_rm_none": "ничего", "s4_rm_imp": "импортин", "s4_rm_exp": "экспортин", "s4_rm_ran": "Ran-ГТФ", "s4_lbl_cyto": "цитоплазма", "s4_lbl_nuc": "ядро", "s4_lbl_npc": "комплексы ядерных пор в двойной ядерной оболочке", "s4_warn_imp": "нет импортина — NLS не узнаётся", "s4_warn_exp": "нет экспортина — NES не узнаётся", "s4_warn_ran_nls": "нет Ran-ГТФ — груз не освобождается в ядре", "s4_warn_ran_nes": "нет Ran-ГТФ — экспортин не связывает груз", "s4_lbl_rgtp": "Ran-ГТФ", "s4_lbl_rgdp": "Ran-ГДФ", "s4t_note": "Этапы описаны для выделенной молекулы. Число молекул, скорость и соотношение по обе стороны оболочки условные, не измерены. Возврат импортина и экспортина здесь не показан.", "s4t_status": "размеры и время условные", "s4t_cnt_cyto": "в цитоплазме: {n}", "s4t_cnt_nuc": "в ядре: {n}", "s4t_small_1": "В начальный момент модели малые молекулы находятся только в цитоплазме.", "s4t_small_2": "Малые молекулы проходят каналы поры простой диффузией в обе стороны; сигнал и рецепторы не нужны.", "s4t_small_3": "Малые молекулы распределяются по обе стороны оболочки.", "s4t_big_1": "Крупный белок без сигнала находится в цитоплазме.", "s4t_big_2": "Белки с FG-повторами создают в поре селективный барьер: за время наблюдения заметного пассивного переноса нет.", "s4t_nls_1": "Крупный белок с сигналом ядерной локализации (NLS) находится в цитоплазме.", "s4t_nls_2": "Импортин связывает белок с NLS.", "s4t_nls_3": "Комплекс импортина с грузом проходит пору.", "s4t_nls_4": "В ядре Ran-ГТФ освобождает груз от импортина: груз накапливается в ядре.", "s4t_nes_1": "Крупный белок с последовательностью ядерного экспорта (NES) находится в ядре.", "s4t_nes_2": "В ядре экспортин связывает белок с NES; Ran-ГТФ стабилизирует этот комплекс.", "s4t_nes_3": "Комплекс экспортина с грузом проходит пору.", "s4t_nes_4": "В цитоплазме груз освобождается от экспортина и остаётся там.", "s4t_stop_nls_imp": "Путь остановился после этапа 1: без импортина сигнал ядерной локализации не узнаётся, и белок остаётся в цитоплазме.", "s4t_stop_nls_ran": "Путь остановился после этапа 3: без Ran-ГТФ груз не освобождается в ядре, и направленного накопления в ядре нет.", "s4t_stop_nes_exp": "Путь остановился после этапа 1: без экспортина последовательность ядерного экспорта не узнаётся, и белок остаётся в ядре.", "s4t_stop_nes_ran": "Путь остановился после этапа 1: без Ran-ГТФ экспортин не образует устойчивого комплекса с грузом, и белок остаётся в ядре.", "s4_r_mode": "Как груз проходит пору", "s4_v_mode_diff": "простой диффузией", "s4_v_mode_none": "проходит очень медленно", "s4_v_mode_imp": "импорт с импортином", "s4_v_mode_exp": "экспорт с экспортином", "s4_v_mode_norec": "сигнал не узнаётся — переноса нет", "s4_v_mode_stuck": "связывается с импортином, но не накапливается в ядре", "s4_v_mode_noran": "комплекс с экспортином не образуется", "s4_r_where": "Где находится груз", "s4_v_where_both": "по обе стороны оболочки", "s4_v_where_cyto": "в цитоплазме", "s4_v_where_cytoslow": "в цитоплазме; в ядре не накапливается", "s4_v_where_nuc": "в ядре", "s4_r_tag": "Нужен ли сигнал на грузе", "s4_v_tag_no": "нет", "s4_v_tag_yes": "да", "s4_small_any": "Ионы и небольшие молекулы (до ~5 кДа) проходят через заполненные водой каналы комплекса ядерной поры простой диффузией практически свободно; процесс неспецифичен и не требует сигналов ядерной локализации. Импортин, экспортин и градиент Ran на это не влияют.", "s4_small_any_z": "Малые молекулы распределяются по обе стороны оболочки без участия транспортных рецепторов.", "s4_big_any": "Крупный белок без сигнала ядерной локализации в модели остаётся в цитоплазме: чем крупнее молекула, тем медленнее она проходит пору пассивно; белки с FG-повторами создают в поре селективный барьер. Модель показывает короткое время наблюдения, за которое заметного пассивного переноса нет; насколько медленно крупный белок всё же проходит пору, показывает продвинутый уровень этой вкладки.", "s4_big_any_z": "Крупный белок без сигнала в ядре не накапливается: быстрый направленный перенос через пору идёт только с транспортным рецептором.", "s4_nls_none": "Белок с сигналом ядерной локализации (NLS) связывается с растворимым цитоплазматическим белком импортином, который переносит его в ядро; процесс энергозависим и идёт при участии ГТФ. Направление переноса задаёт градиент Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. На схеме закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ. В ядре Ran-ГТФ освобождает груз от импортина.", "s4_nls_none_z": "Так в ядро попадают белки, которые синтезируются в цитоплазме, — например, гистоны и ламины.", "s4_nls_imp": "Без импортина сигнал ядерной локализации не узнаётся: за время наблюдения крупный белок остаётся в цитоплазме, хотя сигнал на нём есть (ЗАКЛЮЧЕНИЕ).", "s4_nls_imp_z": "Сигнал на белке есть, но без импортина он не узнаётся, и активного переноса нет.", "s4_nls_exp": "Без экспортина, который переносит из ядра белки с NES, белок с NLS по-прежнему узнаётся импортином и поступает в ядро: эти рецепторы узнают разные сигналы (ЗАКЛЮЧЕНИЕ).", "s4_nls_exp_z": "Импорт и экспорт белков с NES обеспечивают разные транспортные рецепторы. Сверх программы: транспортные рецепторы тоже возвращаются для нового цикла — в классическом импорте импортин-α выносит из ядра экспортин CAS, а импортин-β выходит из ядра в комплексе с Ran-ГТФ (БИО-3·29).", "s4_nls_ran": "Без Ran-ГТФ (весь Ran связан с ГДФ) импортин связывает белок и проходит с ним через пору, но в ядре груз не освобождается, и направленного накопления в ядре нет (ЗАКЛЮЧЕНИЕ). Направление переноса задаёт градиент Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. На схеме закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ.", "s4_nls_ran_z": "При импорте связывание груза импортином от Ran-ГТФ не зависит, а освобождение груза в ядре зависит (ЗАКЛЮЧЕНИЕ).", "s4_nes_none": "Белок с последовательностью ядерного экспорта (NES) связывается в ядре с экспортином, который переносит его в цитоплазму; процесс идёт при участии ГТФ. Ran-ГТФ стабилизирует комплекс экспортина с грузом до выхода из ядра.", "s4_nes_none_z": "Экспорт позволяет белкам, которые работают в ядре лишь временно, покидать его.", "s4_nes_imp": "Без импортина белок с NES по-прежнему узнаётся экспортином и выходит из ядра: эти рецепторы узнают разные сигналы (ЗАКЛЮЧЕНИЕ).", "s4_nes_imp_z": "Импорт и экспорт обеспечивают разные транспортные рецепторы.", "s4_nes_exp": "Без экспортина последовательность ядерного экспорта не узнаётся: экспортин-зависимый перенос нарушен, и за время наблюдения крупный белок остаётся в ядре (ЗАКЛЮЧЕНИЕ).", "s4_nes_exp_z": "Экспортин-зависимый перенос этого груза нарушен: сигнал на белке есть, но его не узнаёт транспортный рецептор.", "s4_nes_ran": "Без Ran-ГТФ (весь Ran связан с ГДФ) экспортин не образует устойчивого комплекса с грузом в ядре: за время наблюдения крупный белок с NES в модели остаётся в ядре (ЗАКЛЮЧЕНИЕ). Направление переноса задаёт градиент Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. На схеме закрашенные кружки — Ran-ГТФ, полые — Ran-ГДФ.", "s4_nes_ran_z": "При экспорте Ran-ГТФ нужен уже для связывания груза экспортином в ядре: без него комплекс не образуется (ЗАКЛЮЧЕНИЕ).", "s4b_take": "Малые молекулы (до ~5 кДа) проходят через пору простой диффузией практически свободно; крупные белки пассивно проходят очень медленно, а быстро и направленно их переносят транспортные рецепторы: белок с сигналом ядерной локализации — импортин в ядро, белок с последовательностью ядерного экспорта — экспортин из ядра. Направление переноса задаёт градиент Ran. ЗАКЛЮЧЕНИЕ: без импортина белок с NLS остаётся в цитоплазме, без экспортина белок с NES — в ядре; без Ran-ГТФ импортин связывает груз, но не освобождает его в ядре, а экспортин не связывает груз.", "p4b_1_q": "Крупный белок с последовательностью ядерного экспорта (NES) находится в ядре; за время наблюдения он пассивно проходит пору пренебрежимо мало, других путей выхода в модели нет. Экспортин есть, но Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Выйдет ли белок из ядра за время наблюдения?", "p4b_1_o1": "Нет: без Ran-ГТФ экспортин не образует комплекса с грузом", "p4b_1_o2": "Да: экспортин узнаёт NES и без Ran-ГТФ", "p4b_1_o3": "Да, простой диффузией, как малая молекула", "p4b_1_e": "Ran-ГТФ стабилизирует комплекс экспортина с грузом до выхода из ядра. Без Ran-ГТФ комплекс не образуется: рецепторный экспорт нарушен, и заметного выхода белка за время наблюдения нет (ЗАКЛЮЧЕНИЕ).", "p4b_1_w2": "В отличие от импортина, который связывает NLS и без Ran-ГТФ, экспортин связывает груз только вместе с Ran-ГТФ.", "p4b_1_w3": "По условию белок крупный и за время наблюдения пассивно проходит пору пренебрежимо мало; быстро и направленно его выносит из ядра только экспортин.", "p4b_2_q": "Импортин есть, но Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Что произойдёт с белком, несущим NLS?", "p4b_2_o1": "Импортин свяжет белок, но белок не будет накапливаться в ядре", "p4b_2_o2": "Белок накопится в ядре, как обычно: импортин его узнал", "p4b_2_o3": "Импортин не свяжет белок: узнавание NLS зависит от Ran", "p4b_2_e": "Направление переноса задаёт градиент Ran: Ran-ГТФ в ядре освобождает груз от импортина. Без Ran-ГТФ белок связывается с импортином и проходит с ним пору, но не освобождается в ядре, поэтому не накапливается там (ЗАКЛЮЧЕНИЕ).", "p4b_2_w2": "Связывание с импортином — только первый этап: без Ran-ГТФ в ядре груз не освобождается и не накапливается там.", "p4b_2_w3": "Импортин связывает NLS в цитоплазме; Ran-ГТФ нужен для освобождения груза в ядре, а не для его узнавания.", "p4b_3_q": "Крупный белок с последовательностью ядерного экспорта (NES) находится в ядре; за время наблюдения он пассивно проходит пору пренебрежимо мало, других путей выхода в модели нет. Что с ним будет за это время, если в клетке нет экспортина?", "p4b_3_o1": "Он останется в ядре", "p4b_3_o2": "Он выйдет из ядра с импортином", "p4b_3_o3": "Он выйдет из ядра простой диффузией, как малая молекула", "p4b_3_e": "Белок с NES быстро выходит из ядра, только связавшись в ядре с экспортином. Без экспортина последовательность ядерного экспорта не узнаётся: рецепторный экспорт нарушен, и за время наблюдения белок остаётся в ядре (ЗАКЛЮЧЕНИЕ).", "p4b_3_w2": "Импортин узнаёт сигнал ядерной локализации и переносит белки в ядро; последовательность ядерного экспорта он не связывает.", "p4b_3_w3": "По условию белок крупный и за время наблюдения пассивно проходит пору пренебрежимо мало; практически свободно простой диффузией проходят лишь ионы и небольшие молекулы.", "s4a_exp": "Эксперимент", "s4a_exp_nls": "сигнал ядерной локализации", "s4a_exp_size": "размер и проницаемость поры", "s4a_prot": "Белок", "s4a_p_t": "большой Т-антиген", "s4a_p_tk": "Т-антиген, Lys128 → Thr", "s4a_p_pk": "пируваткиназа", "s4a_p_pkn": "пируваткиназа + PKKKRKV", "s4a_p_pkt": "пируваткиназа + участок 119–135 (Thr128)", "s4a_mass": "Масса белка", "s4a_m_27": "27 кДа (GFP)", "s4a_m_67": "67 кДа (GFP + 6 доменов PrA)", "s4a_lbl_t": "большой Т-антиген вируса SV40 — в ядре", "s4a_lbl_tk": "Lys128 → Thr: белок остаётся в цитоплазме", "s4a_lbl_pk": "пируваткиназа — цитоплазматический белок", "s4a_lbl_pkn": "пируваткиназа с PKKKRKV — в ядре", "s4a_lbl_pkt": "пируваткиназа с участком 119–135 (Thr128) — в цитоплазме", "s4a_lbl_m27": "27 кДа: выравнивается за секунды", "s4a_lbl_m67": "67 кДа: выравнивается за минуты", "s4a_r_loc": "Где белок", "s4a_r_loc_s": "клетки Vero, иммунофлуоресценция", "s4a_v_loc_t": "в ядре", "s4a_v_loc_tk": "в цитоплазме", "s4a_v_loc_pk": "в цитоплазме", "s4a_v_loc_pkn": "в ядре", "s4a_v_loc_pkt": "в цитоплазме", "s4a_r_sig": "Сигнал ядерной локализации", "s4a_v_sig_t": "свой, около Lys128", "s4a_v_sig_tk": "нарушен заменой одного лизина", "s4a_v_sig_pk": "нет", "s4a_v_sig_pkn": "присоединён к N-концу", "s4a_v_sig_pkt": "участок 119–135 с заменой Lys128 → Thr", "s4a_r_tau": "Характерная постоянная времени выравнивания τ", "s4a_r_tau_s": "живые дрожжи; обесцвечивание цитоплазмы", "s4a_v_tau_27": "15 ± 1,4 с", "s4a_v_tau_67": "413 ± 92 с", "s4a_r_thr": "Резкий порог размера", "s4a_v_thr": "не обнаружен", "s4a_nls_t": "Большой Т-антиген вируса SV40 после синтеза в цитоплазме накапливается в ядре; для этого нужен короткий участок вокруг остатка лизина 128.", "s4a_nls_t_z": "Белок вируса использует тот же путь импорта, что и белки клетки.", "s4a_nls_tk": "Замена одного остатка — лизина 128 на треонин — нарушает накопление большого Т-антигена в ядре: белок остаётся в цитоплазме, хотя его стабильность заметно не меняется.", "s4a_nls_tk_z": "Сигнал необходим: без одного ключевого лизина белок не попадает в ядро.", "s4a_nls_pk": "Пируваткиназа — фермент гликолиза, в норме цитоплазматический белок.", "s4a_nls_pk_z": "Контроль: без сигнала ядерной локализации крупный белок остаётся в цитоплазме.", "s4a_nls_pkn": "К N-концу пируваткиназы присоединили участок Т-антигена: с остатками 119–135 химерный белок накапливался в ядре полностью, а после укорочения до остатков 126–132 — семи аминокислот Pro-Lys-Lys-Lys-Arg-Lys-Val (PKKKRKV) — по-прежнему накапливался в ядре. Авторы оговаривают, что в действие такого короткого сигнала могут вносить вклад соседние остатки, закодированные линкером.", "s4a_nls_pkn_z": "Сигнал достаточен: семь аминокислот направляют в ядро цитоплазматический белок.", "s4a_nls_pkt": "Участок 119–135 с заменой лизина 128 на треонин не влиял на локализацию пируваткиназы: белок оставался в цитоплазме.", "s4a_nls_pkt_z": "Контроль показывает, что ядерную локализацию даёт именно последовательность сигнала, а не сам факт присоединения пептида.", "s4a_size_27": "Живые дрожжи Saccharomyces cerevisiae: флуоресценцию белка GFP (27 кДа) в цитоплазме гасили лазером и следили, как убывает флуоресценция ядра. За время τ разница между текущей и равновесной флуоресценцией уменьшается примерно в 2,7 раза, за τ·ln 2 — вдвое. Для GFP τ, приведённая к клетке со средними объёмами ядра и цитоплазмы и средним числом пор, — 15 ± 1,4 с (± — 95%-й доверительный интервал).", "s4a_size_27_z": "Белки такого размера проходят пору пассивно и быстро, без транспортных рецепторов.", "s4a_size_67": "Белок 67 кДа (GFP с шестью доменами PrA): τ = 413 ± 92 с, то есть выравнивание идёт минуты. τ растёт с массой примерно в степени 3,8 (3,8 ± 1,0; 95%-й доверительный интервал), но резкого порога, выше которого пассивный проход невозможен, нет.", "s4a_size_67_z": "Пора — мягкий барьер: крупные белки проходят пассивно всё медленнее, поэтому для быстрого и направленного переноса им нужны сигнал и транспортный рецептор.", "s4a_take": "Два эксперимента уточняют базовую модель. Сигнал ядерной локализации необходим (замена одного лизина оставляет Т-антиген в цитоплазме), а его добавления достаточно в клетке с работающим транспортным аппаратом (семь аминокислот PKKKRKV переводят в ядро цитоплазматическую пируваткиназу). Резкого порога размера у поры нет: пассивный проход замедляется с массой белка постепенно, поэтому граница «до ~5 кДа» описывает практически свободную диффузию, а не запрет для более крупных белков.", "p4a_1_q": "К N-концу пируваткиназы — цитоплазматического белка — присоединили семь аминокислот PKKKRKV из Т-антигена вируса SV40. Где окажется химерный белок?", "p4a_1_o1": "В ядре", "p4a_1_o2": "В цитоплазме: короткий пептид не меняет адрес крупного белка", "p4a_1_o3": "Поровну в ядре и в цитоплазме, как малая молекула", "p4a_1_e": "Химерный белок накапливался в ядре: семи аминокислот PKKKRKV (остатки 126–132 Т-антигена) достаточно, чтобы направить в ядро цитоплазматический белок; авторы не исключают вклада соседних остатков, закодированных линкером.", "p4a_1_w2": "Адрес задаёт не размер белка, а сигнал: в исследованной химере присоединённый доступный NLS обеспечил накопление пируваткиназы в ядре, хотя это крупный белок. В других белках доступность сигнала может зависеть от их строения.", "p4a_1_w3": "Пируваткиназа — крупный белок, и пассивно она проходит пору медленно; с сигналом её переносит рецептор, и она накапливается в ядре, а не распределяется поровну.", "p4a_2_q": "В большом Т-антигене вируса SV40 лизин 128 заменили треонином. Где окажется белок?", "p4a_2_o1": "В цитоплазме: сигнал ядерной локализации нарушен", "p4a_2_o2": "В ядре: одна замена не может изменить локализацию крупного белка", "p4a_2_o3": "Нигде: белок станет нестабильным и разрушится", "p4a_2_e": "Замена лизина 128 на треонин нарушает накопление Т-антигена в ядре, хотя стабильность белка заметно не меняется. Сигнал необходим.", "p4a_2_w2": "Лизин 128 входит в сигнал ядерной локализации; без него рецептор не узнаёт сигнал, и белок остаётся в цитоплазме.", "p4a_2_w3": "Мутантный белок в клетках сохраняется, и его стабильность заметно не меняется; меняется только локализация.", "p4a_3_q": "В живых дрожжах сравнили белок 27 кДа и белок 67 кДа без сигналов ядерной локализации. Что показала постоянная времени выравнивания между ядром и цитоплазмой?", "p4a_3_o1": "Белок 67 кДа выравнивается в десятки раз медленнее, но всё же проходит", "p4a_3_o2": "Белок 67 кДа не проходит совсем: он выше порога пропускания поры", "p4a_3_o3": "Оба выравниваются одинаково быстро", "p4a_3_e": "Характерная постоянная времени τ — 15 с для 27 кДа и 413 с для 67 кДа: разница около 27 раз, при том что подвижность белков в растворе различается лишь в 1,6 раза. Резкого порога нет.", "p4a_3_w2": "Резкого порога в этом диапазоне масс не обнаружено: белок 67 кДа проходит пору пассивно, но за минуты.", "p4a_3_w3": "Пассивный проход сильно зависит от массы: постоянная времени растёт примерно как масса в степени 3,8.", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Метод", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а получено «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Какое измерение их разделит?", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Какое измерение их разделит?", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Среди предложенных объяснений достаточно, например: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Новый образец", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента. Список причин здесь задан заранее, в реальной работе его нет.", "c1_title": "Клетки плохо поглощают липопротеины низкой плотности", "c1_tag": "Сверх программы — на коллоквиуме и зачёте не требуется.", "c1_obs": "Условия: фибробласты кожи человека в культуре, меченые липопротеины низкой плотности (ЛПНП) в среде, 37 °C; контрольные клетки — в тех же условиях. Наблюдение: образец поглощает ЛПНП намного хуже контроля. Причина одна из пяти; какая — определите по измерениям.", "c1_c_nosyn": "Рецептор ЛПНП не синтезируется", "c1_c_noer": "Рецептор ЛПНП синтезируется, но не выходит из ЭПР", "c1_c_nobind": "Изменён внеклеточный участок рецептора, связывающий ЛПНП", "c1_c_noadapt": "Изменён внутриклеточный участок рецептора, связывающий адаптер AP2 — белковый комплекс, соединяющий рецептор с клатрином", "c1_c_dyn": "В клетке избыток мутантного динамина K44A (лизин 44 заменён аланином) с нарушенным связыванием и гидролизом ГТФ", "c1_m_tot": "Рецептор ЛПНП в клетке в целом", "c1_m_rec": "Рецепторы ЛПНП на поверхности клетки", "c1_m_bind": "Связывание ЛПНП с поверхностью при 4 °C, когда поглощения нет", "c1_m_pit": "Положение рецепторов относительно клатриновых ямок", "c1_m_em": "Форма клатриновых решёток на мембране", "c1_m_tf": "Захват трансферрина", "c1_m_fl": "Захват жидкости", "c1_v_tot_yes": "есть", "c1_v_tot_no": "нет", "c1_v_rec_yes": "есть", "c1_v_rec_no": "нет", "c1_v_bind_yes": "есть", "c1_v_bind_no": "нет", "c1_v_pit_in": "в ямках", "c1_v_pit_out": "вне ямок", "c1_v_pit_none": "рецепторов на поверхности нет", "c1_v_em_norm": "как в контроле", "c1_v_em_stalled": "изогнутых примерно вдвое больше, плоских меньше", "c1_v_tf_norm": "как в контроле", "c1_v_tf_low": "резко снижен", "c1_v_fl_norm": "начальная скорость как в контроле", "c1_v_em_norm_c": "плоские и изогнутые решётки", "c1_v_tf_norm_c": "обычный захват", "c1_v_fl_norm_c": "обычная начальная скорость", "c1_k_tot": "Что измеряется: количество белка рецептора во всей клетке — белки разделяют по размеру и выявляют антителами (иммуноблот). Уровень: популяция клеток. Контроль: контрольные клетки и белок, количество которого не меняется. Типичный артефакт: антитела могут не узнать изменённый белок. Чего не доказывает: где находится рецептор и работает ли он.", "c1_k_rec": "Что измеряется: рецепторы на поверхности неповреждённых клеток выявляют мечеными антителами к внеклеточной части рецептора. Уровень: поверхность клетки. Контроль: контрольные клетки и клетки без первичных антител. Типичный артефакт: антитела могут не узнать изменённый белок. Чего не доказывает: что рецептор связывает лиганд; метод качественный и не показывает, сколько рецепторов на поверхности.", "c1_k_bind": "Что измеряется: меченые ЛПНП на поверхности клеток при 4 °C: при этой температуре лиганд связывается, но не поглощается. Уровень: популяция клеток. Контроль: избыток немеченых ЛПНП показывает неспецифическое связывание. Типичный артефакт: часть метки прилипает к поверхности без рецептора. Чего не доказывает: что связанный лиганд затем поглощается.", "c1_k_pit": "Что измеряется: положение меченых рецепторов относительно клатриновых ямок в электронном микроскопе. Уровень: отдельная ямка. Контроль: контрольные клетки и другой рецептор тех же клеток. Типичный артефакт: метка занимает часть рецепторов и может их сближать. Чего не доказывает: что ямка затем отделится от мембраны.", "c1_k_em": "Что измеряется: число плоских и изогнутых клатриновых решёток на цитоплазматической стороне мембраны. Уровень: участок мембраны. Контроль: контрольные клетки. Типичный артефакт: подготовка препарата может деформировать мембрану. Чего не доказывает: какой белок отвечает за изменение; в этой задаче список причин задан, поэтому измерение может оказаться достаточным.", "c1_k_tf": "Что измеряется: поглощение меченого трансферрина — другого лиганда, который входит в клетку через клатриновые ямки. Уровень: популяция клеток. Контроль: контрольные клетки. Типичный артефакт: меченый лиганд на поверхности легко принять за поглощённый. Чего не доказывает: где именно нарушен общий путь.", "c1_k_fl": "Что измеряется: начальная скорость поглощения вещества, растворённого в среде и не связанного с рецептором, например пероксидазы хрена. Уровень: популяция клеток. Контроль: контрольные клетки. Типичный артефакт: вещество может прилипать к поверхности. Чего не доказывает: что рецепторный путь работает.", "c1_w_nosyn": "Рецептора нет ни на поверхности, ни в клетке, поэтому ЛПНП не с чем связаться (ЗАКЛЮЧЕНИЕ). По модели ямки и другие рецепторы при этом работают.", "c1_w_noer": "Рецептор есть в клетке, но не на поверхности: ЛПНП не с чем связаться (ЗАКЛЮЧЕНИЕ). По модели ямки и другие рецепторы при этом работают.", "c1_w_nobind": "Рецептор есть на поверхности, но ЛПНП с ним не связываются (ЗАКЛЮЧЕНИЕ). По модели пустые рецепторы по-прежнему попадают в ямки и входят в клетку.", "c1_w_noadapt": "ЛПНП связываются с поверхностью, но рецепторы не попадают в клатриновые ямки, и лиганд не поглощается. Для поглощения недостаточно связать лиганд: рецептор должен быть собран в ямке (ЗАКЛЮЧЕНИЕ).", "c1_w_dyn": "Нарушен общий этап — отделение везикул от мембраны (ЗАКЛЮЧЕНИЕ). По модели рецепторы при этом в ямках, захват трансферрина снижен, начальная скорость захвата жидкости сохранена. Для ЛПНП это перенос: у Damke et al. измерены трансферрин и EGF (эпидермальный фактор роста).", "c1_after": "Порядок этапов на шкале — общая схема: рецептор ЛПНП попадает в ямки и без лиганда.", "c1_src": "Прямые данные: дефекты рецептора ЛПНП — Brown, Goldstein, 1986; Alberts et al., 2022, с. 791–792; мутантный динамин — Damke et al., 1994 (клетки HeLa). Остальные значения выведены из модели.", "c1_link_h": "seminar-3-route.html#ldl-cycle", "c1_link_t": "Подробнее: шаг «Сколько раз рецептор ЛПНП проходит цикл и что нужно ему для захвата» в «Объяснениях»", "c4_title": "Белок не выходит из ядра", "c4_tag": "Сверх программы — на коллоквиуме и зачёте не требуется.", "c4_obs": "Условия: клетки человека в культуре, 37 °C, крупный белок с последовательностью ядерного экспорта (NES), короткое время наблюдения: пассивно через пору белок за это время почти не проходит. В модели один экспортин. Наблюдение: в контрольных клетках белок накапливается в цитоплазме, в образце остаётся в ядре. Причина одна из трёх; какая — определите по измерениям.", "c4_c_mut": "Сигнал NES на белке изменён", "c4_c_exp": "В клетке нет экспортина, который узнаёт этот сигнал", "c4_c_ran": "В клетке нет Ran-ГТФ: весь Ran связан с ГДФ", "c4_m_ctl": "Где находится другой белок с таким же NES", "c4_m_nls": "Где находится белок с сигналом ядерной локализации (NLS)", "c4_m_bind": "Связывание исследуемого белка с экспортином", "c4_v_ctl_cyto": "в цитоплазме", "c4_v_ctl_nuc": "в ядре", "c4_v_nls_nuc": "в ядре", "c4_v_nls_both": "по обе стороны оболочки", "c4_v_bind_yes": "есть", "c4_v_bind_no": "нет", "c4_k_ctl": "Что измеряется: положение другого белка с таким же сигналом — иммунофлуоресценцией. Уровень: отдельная клетка. Контроль: контрольные клетки. Типичный артефакт: при фиксации растворимый белок может сместиться. Чего не доказывает: какая деталь механизма нарушена; показывает, общий это дефект или дефект этого груза.", "c4_k_nls": "Что измеряется: положение белка с сигналом ядерной локализации — иммунофлуоресценцией. Уровень: отдельная клетка. Контроль: контрольные клетки. Типичный артефакт: при фиксации растворимый белок может сместиться. Чего не доказывает: какая деталь механизма нарушена; показывает, затронут ли и импорт.", "c4_k_bind": "Что измеряется: экспортин осаждают антителами и проверяют, осаждается ли вместе с ним белок. Уровень: популяция клеток. Контроль: контрольные клетки и осаждение без антител. Типичный артефакт: комплексы могут образоваться и распасться уже после разрушения клеток. Чего не доказывает: почему комплекса нет.", "c4_w_mut": "Другой белок с таким же NES выходит из ядра: механизм экспорта работает, а сигнал на этом белке не узнаётся (ЗАКЛЮЧЕНИЕ).", "c4_w_exp": "Другой белок с таким же NES не выходит из ядра, а импорт не нарушен: Ran-ГТФ есть, не хватает экспортина (ЗАКЛЮЧЕНИЕ).", "c4_w_ran": "Нарушены и экспорт, и накопление белка с NLS в ядре: общая деталь двух путей — Ran-ГТФ (ЗАКЛЮЧЕНИЕ). Без него экспортин не образует устойчивого комплекса с грузом, а импортированный груз не освобождается.", "c4_src": "Перенос через пору — Alberts et al., 2022, с. 739–742. Значения таблицы выведены из модели.", "c4_link_h": "seminar-3-route.html#ran-direction", "c4_link_t": "Подробнее: шаг «Чем задано направление переноса через пору» в «Объяснениях»", "s1t_case_norec_1": "ЛПНП находится в среде; рецепторов ЛПНП на поверхности нет.", "s1t_case_norec_7": "Другие рецепторы вошли в клетку; ЛПНП остаётся в среде.", "s1t_case_other": "Ямки образуются и отделяются с другими рецепторами.", "s1t_case_empty": "Рецепторы без лиганда собираются в ямке и входят в клетку.", "s1t_case_nobind_1": "ЛПНП находится в среде; рецепторы на поверхности его не связывают.", "s1t_case_nobind_7": "Пустые рецепторы вошли в клетку; ЛПНП остаётся в среде.", "s1t_case_noadapt_1": "ЛПНП связан с рецепторами, но рецепторы не связывают адаптер.", "s1t_case_noadapt_7": "Рецепторы с ЛПНП остаются вне ямок: лиганд не поглощается.", "s1t_lbl_other": "другие рецепторы", "s1t_stop_case_dyn": "Ямка впячена, но шейка не сужается и везикула не отделяется: путь остановился после этапа 4.", "s4t_case_mut_1": "Крупный белок с изменённым сигналом находится в ядре.", "s4t_stop_case_mut": "Сигнал изменён, экспортин его не узнаёт: путь остановился после этапа 1.", "s4t_warn_mut": "сигнал изменён — экспортин его не узнаёт", "meth_btn": "Метод", "gn_meth_dyn": "Метод · мутантный динамин", "g_meth_dyn": "Что измеряется: переход меченного биотином трансферрина в суженные ямки и пузырьки — по недоступности для авидина, добавленного снаружи; строение ямок — электронной микроскопией; захват жидкости — по пероксидазе хрена в среде. Уровень: культура клеток HeLa. Контроль: те же клетки до включения синтеза и клетки с динамином дикого типа в таком же количестве. Типичный артефакт: мутантный белок синтезируется в количестве, не менее чем в 50 раз превышающем собственный динамин клетки, и подавляет его работу. Чего не доказывает: как именно динамин сужает шейку — сам или вместе с другими белками.", "gn_meth_cav": "Метод · сила вытягивания мембранной нити", "g_meth_cav": "Что измеряется: сила, с которой оптический пинцет удерживает бусину, вытянувшую из мембраны тонкую нить; она пропорциональна квадратному корню эффективного натяжения мембраны. Уровень: отдельные клетки в культуре. Контроль: клетки дикого типа и без кавеолина-1 в изо- и гипоосмотической среде. Типичный артефакт: около 75 % эффективного натяжения даёт сцепление мембраны с цитоскелетом, поэтому сравнивают изменения силы в первые 5 мин, пока кортикальный актин не перестраивается. Чего не доказывает: натяжение самого липидного бислоя отдельно от сцепления с цитоскелетом.", "gn_meth_nsf": "Метод · бесклеточная система", "g_meth_nsf": "Что измеряется: перенос белка G вируса везикулярного стоматита между стопками комплекса Гольджи — по присоединению [3H]GlcNAc в акцепторных мембранах. Уровень: мембраны и цитозоль клеток CHO вне клетки. Контроль: необработанные мембраны с обычным цитозолем. Типичный артефакт: N-этилмалеимид модифицирует остатки цистеина многих белков, поэтому вывод о роли NSF опирается на восстановление переноса очищенным белком. Чего не доказывает: на каком этапе цикла носителя работает NSF.", "gn_meth_tf": "Метод · связывание лиганда при разном pH", "g_meth_tf": "Что измеряется: количество меченого трансферрина (125I) и железа (59Fe), оставшихся на клетках после смены pH среды. Уровень: поверхность клеток гепатомы HepG2. Контроль: трансферрин с железом при нейтральном pH; другие лиганды (асиалоорозомукоид, инсулин). Типичный артефакт: чтобы трансферрин не уходил в клетку при 37 °C, добавляют ингибиторы энергетического обмена; кислая среда снаружи лишь моделирует эндосому. Чего не доказывает: по какому пути комплекс выходит из эндосомы.", "gn_meth_snx": "Метод · белки поверхности и иммунофлуоресценция", "g_meth_snx": "Что измеряется: количество белков на поверхности (метка биотином и масс-спектрометрия) и положение GLUT1 относительно маркеров лизосом (LAMP1) и ранних эндосом (EEA1); захват меченой 2-дезоксиглюкозы. Уровень: клетки HeLa и RPE1. Контроль: контрольная РНК; по две разные РНК против каждого белка. Типичный артефакт: подавление белка бывает неполным и может затрагивать другие белки — поэтому используют разные РНК. Чего не доказывает: как SNX27–ретромер не пускает груз в лизосомный путь.", "gn_meth_nls": "Метод · химерные белки и иммунофлуоресценция", "g_meth_nls": "Что измеряется: положение белка в клетке — в ядре или в цитоплазме — через 18 ч после микроинъекции плазмиды. Уровень: клетки Vero. Контроль: исходная пируваткиназа и химера с участком 119–135, в котором лизин 128 заменён треонином. Типичный артефакт: оценка качественная, по микроскопии; соседние остатки, в том числе закодированные линкером, тоже влияют на накопление в ядре. Чего не доказывает: что сигнал ускоряет перенос — эксперимент показывает накопление в ядре, и удержание белка в ядре им не исключено (оговорка авторов); каким белком узнаётся сигнал — импортин тогда ещё не был известен.", "gn_meth_size": "Метод · фотообесцвечивание в живых клетках", "g_meth_size": "Что измеряется: флуоресценцию белка в цитоплазме гасят лазером и следят, как убывает флуоресценция ядра, пока меченые и обесцвеченные молекулы обмениваются через поры; постоянную времени приводят к клетке со средними объёмами ядра и цитоплазмы и средним числом пор. Уровень: живые дрожжи, около 236 клеток. Контроль: белки одинакового строения, различающиеся числом доменов по 7 кДа. Типичный артефакт: если белок связывается с чем-то в клетке, он движется медленнее, чем позволяет пора. Чего не доказывает: что те же числа верны для клеток человека.", "amode_t": "Режим", "amode_e": "Эксперимент", "amode_m": "Модель по данным", "amk_t": "Сцена", "amk_1": "Модель 1", "amk_2": "Модель 2", "amk_3": "Модель 3", "amode_note": "Бегунки и переключатели показывают предсказания учебной модели или данные одной работы, а не доказательство. Измеренные значения — засечки на шкале и кружки на графике.", "m_cond_t": "Условия", "m_lim_t": "Чего модель не показывает", "m_pA": "А", "m_pB": "Б", "m_hidden": "Кривые модели откроются после ответа", "m_hatch": "штриховка — положение не измерено (интерполяция модели)", "u_deg": "°", "u_nm": "нм", "u_ph": "", "u_ms": "мс", "u_mg": "мг в день", "u_pp": "п. п.", "s1m_cond": "Клетки меланомы человека SK-MEL-2 (1798 структур в 13 клетках, из них 1645 эндоцитозных ямок), для сравнения — клетки остеосаркомы человека U2OS (241 ямка, 3 клетки) и фибробласты мыши 3T3 (688 ямок, 7 клеток). Клетки фиксированы; клатрин помечен; форма каждой ямки определена трёхмерной локализационной микроскопией одиночных молекул (разрешение около 10 нм в плоскости мембраны и около 30 нм по глубине). Время не измерено: ямки упорядочены по степени замкнутости, и порядковый номер ямки служит «псевдовременем» от 0 до 1.", "s1m_status": "Модель по данным одной работы на фиксированных клетках: кривые — расчёт по параметрам авторов; измеренные значения вынесены отдельно, к оси угла они не привязаны; время на анимации условное", "s1m_sl_th": "Угол замыкания ямки θ", "s1m_mk0": "плоская", "s1m_mk90": "полусфера", "s1m_mk180": "замкнута", "s1m_model": "Модель", "s1m_m_ccm": "постоянная кривизна", "s1m_m_cam": "постоянная площадь", "s1m_m_coop": "по данным (кооперативная)", "s1m_cells": "Клетки", "s1m_c_sk": "SK-MEL-2", "s1m_c_u2": "U2OS", "s1m_c_t3": "3T3", "s1m_lbl_out": "внеклеточная среда", "s1m_lbl_cyto": "цитоплазма", "s1m_lbl_lattice": "решётка клатрина", "s1m_lbl_theta": "θ = {th}°, R = {r}", "s1m_lbl_theta_ccm0": "θ = 0°: площадь → 0; радиус модели R = {r}", "s1m_ax_th": "θ, °", "s1m_ax_R": "Радиус кривизны R, нм", "s1m_ax_A": "Площадь, тыс. нм²", "s1m_lg_A": "решётка A", "s1m_lg_Ap": "проекция Ap", "s1m_meas_R134": "134 нм — к 10 % псевдовремени", "s1m_meas_R87": "87 нм — медиана всех ямок", "s1m_meas_R83": "83 нм — к 60 % псевдовремени", "s1m_meas_Ap": "Ap: около 31 и 13 тыс. нм²", "s1m_meas_head": "Измерено, угол не определён:", "s1m_no_meas": "измеренные точки показаны для клеток SK-MEL-2", "s1m_r_theta": "Угол замыкания ямки", "s1m_r_R": "Радиус кривизны решётки", "s1m_r_A": "Площадь решётки", "s1m_r_Ap": "Площадь проекции (пятно, видимое снизу)", "s1m_r_rate": "Изменение кривизны на единицу угла (dH/dθ)", "s1m_r_rate_s": "ЗАКЛЮЧЕНИЕ: dH/dθ = γ(1 − H²/H0²)", "s1m_v_flat": "плоская", "s1m_v_R_ccm0": "{r} нм — заданный радиус модели; площадь стремится к нулю", "s1m_v_A": "{a} тыс. нм² ({p} % от конечной)", "s1m_v_Ap": "{a} тыс. нм²", "s1m_v_fast": "быстрый", "s1m_v_slow": "замедляется", "s1m_v_stop": "почти остановился", "s1m_st1": "Около половины решётки собирается на плоской мембране.", "s1m_st2": "Решётка начинает изгибаться: кривизна сначала растёт быстро.", "s1m_st3": "Изгиб замедляется: радиус приближается к собственному радиусу решётки, 72–89 нм в разных клетках.", "s1m_st4": "Ямка почти замкнута; шейку сужает динамин, и носитель отделяется.", "s1m_ccm1": "Постоянная кривизна: решётка с первого трискелиона изогнута (радиус условно принят равным R0), и площадь растёт от нуля.", "s1m_ccm2": "Ямка углубляется, радиус решётки не меняется.", "s1m_cam1": "Постоянная площадь: вся решётка собирается плоской.", "s1m_cam2": "Решётка сворачивается без роста площади: площадь пятна, видимого снизу, уменьшается в несколько раз.", "s1m_note": "Скорость анимации условная: в работе время задано псевдовременем. Бегунок угла движется вместе с анимацией.", "s1m_c_coop": "Модель по данным: до начала изгиба собрано {p0} % конечной площади решётки; к θ = 90° радиус {R90} нм; в конце — {Rend} нм.", "s1m_c_coop_z": "Скорость изгиба наибольшая в начале и падает по мере приближения к собственному радиусу решётки, поэтому на последних этапах кривизна почти не меняется.", "s1m_c_ccm": "Постоянная кривизна: решётка с первого трискелиона изогнута (радиус условно принят равным R0), и площадь растёт от нуля.", "s1m_c_ccm_z": "Тогда самые ранние ямки были бы маленькими и сильно изогнутыми; в данных работы самые ранние решётки уже содержат около половины конечной площади и почти плоские.", "s1m_c_cam": "Постоянная площадь: вся решётка собирается плоской и затем сворачивается.", "s1m_c_cam_z": "Тогда площадь решётки в конце не росла бы; в данных она растёт по мере изгиба — примерно с 32 000 до 50 000 нм² (медианы 5 % ямок с наименьшим и наибольшим θ). Измеренная проекция в SK-MEL-2 уменьшается постепенно, примерно в 2,4 раза (с 31 000 до 13 000 нм²); резкого падения в 3–4 раза, которое дало бы позднее сворачивание, в живых клетках не находят (шаг 2).", "s1m_take": "Около половины площади решётки клатрина собирается на плоской мембране, затем решётка изгибается — сначала быстро, потом всё медленнее. Доля площади до изгиба почти одна и та же в трёх линиях клеток; различается радиус готовой ямки.", "p1m_1_q": "В клетках SK-MEL-2 восстановили форму 1798 клатриновых структур, из них 1645 эндоцитозных ямок. Когда решётка начинает изгибаться?", "p1m_1_o1": "Когда собрано около половины её конечной площади.", "p1m_1_o2": "С первых трискелионов: решётка сразу растёт изогнутой.", "p1m_1_o3": "Только после сборки всей решётки.", "p1m_1_e": "Самые ранние решётки в данных уже содержат около половины конечной площади и почти плоские; дальше они изгибаются непрерывно, быстро в начале и медленно в конце. Оговорка авторов: начальная сборка либо идёт очень быстро, либо частично ниже предела обнаружения метода.", "p1m_1_w2": "Тогда самые ранние ямки были бы маленькими и сильно изогнутыми; в данных ранние решётки большие и почти плоские.", "p1m_1_w3": "Изгиб начинается задолго до конца сборки: площадь решётки продолжает расти, пока ямка изгибается.", "p1m_2_q": "Предположим, вся решётка собирается плоской и только потом сворачивается. Что увидит микроскоп, который снизу следит за пятном клатрина в живой клетке?", "p1m_2_o1": "Перед отделением площадь пятна резко уменьшится в несколько раз.", "p1m_2_o2": "Площадь пятна будет только расти до отделения.", "p1m_2_o3": "Пятно не изменится: сворачивание сверху не видно.", "p1m_2_e": "Свёртывание плоского диска в сферу сжимает его проекцию: по расчёту авторов — в 3–4 раза (если решётка сворачивается, собрав 70–100 % площади). В живых клетках и в эмбрионах дрозофилы площадь пятна росла и выходила на плато, без такого падения. Это согласуется с тем, что изгиб начинается раньше конца сборки.", "p1m_2_w2": "При позднем сворачивании проекция сначала росла бы, а затем резко падала; рост с выходом на плато без падения наблюдали в живых клетках, и это — довод против позднего сворачивания.", "p1m_2_w3": "Проекцию на плоскость мембраны видно снизу: при свёртывании диск становится колпачком меньшего поперечника.", "p1m_3_q": "В клетках 3T3 собственный радиус решётки больше, чем в SK-MEL-2 (около 89 против 72 нм). Какая доля площади будет собрана до изгиба?", "p1m_3_o1": "Тоже около половины: в разных клетках доля почти одна и та же.", "p1m_3_o2": "Меньше трети: чем крупнее ямка, тем раньше начинается изгиб.", "p1m_3_o3": "Вся площадь: крупные решётки сначала собираются целиком.", "p1m_3_e": "Параметры подгоняли для каждой линии отдельно; доля площади до изгиба — 0,51 в SK-MEL-2, 0,52 в U2OS и 0,45 в 3T3. Различается радиус готовой ямки, а не порядок событий.", "p1m_3_w2": "Данные этого не подтверждают: в 3T3 радиус готовой ямки больше, но доля площади до изгиба — 0,45, то есть около половины, а не меньше трети.", "p1m_3_w3": "Решётка собирается не вся до изгиба: её площадь продолжает расти, пока ямка изгибается (в SK-MEL-2 примерно с 32 000 до 50 000 нм²).", "s1m_lim1": "Время в секундах: в работе есть только псевдовремя.", "s1m_lim2": "Ямки, которые вообще не изгибаются или обрываются: в живых клетках такие есть (модель 2 этой вкладки).", "s1m_lim3": "Какой белок задаёт скорость изгиба.", "s1m_lim4": "Отличия в живых клетках: модель построена по фиксированным.", "s1m_lim6": "Другая работа по живым клеткам склоняется к модели постоянной кривизны; выводы двух работ расходятся.", "s1m_lim5": "Как считается. Обозначения: H — кривизна решётки (H = 1/R), γ и H0 — параметры модели, R0 = 1/H0 — собственный радиус решётки. Модель по данным: H(θ) = H0·tanh(γθ/H0), R = 1/H; площадь колпачка A = 2π(1 − cos θ)/H², при θ → 0 она стремится к π/γ²; проекция Ap = π(R·sin θ)² при θ ≤ 90° и πR² при θ > 90°. Параметры SK-MEL-2: γ = 9,4·10⁻³ нм⁻¹, H0 = 13,9·10⁻³ нм⁻¹ (R0 = 72 нм); U2OS: 7,9 и 11,8·10⁻³ нм⁻¹ (85 нм); 3T3: 8,2 и 11,3·10⁻³ нм⁻¹ (≈ 89 нм). Измеренная проекция в SK-MEL-2 падает примерно с 31 000 до 13 000 нм², расчёт по параметрам авторов — с 35 600 до 17 200 нм² (у авторов этих чисел нет): показаны обе линии, без подгонки.", "gn_meth_m1m": "Метод · трёхмерная локализационная микроскопия одиночных молекул", "g_meth_m1m": "Что измеряется: координаты отдельных флуоресцентных меток клатрина в трёх измерениях; по ним восстанавливают форму решётки — колпачок с радиусом и углом замыкания. Уровень: одна ямка; разрешение около 10 нм в плоскости мембраны и около 30 нм по глубине. Контроль: 8,5 % структур с особенно высокой кривизной образовали отдельную группу и исключены из подгонки; среди структур, совпавших с белком-адаптером AP2, в этой группе AP2 не нашли; возможно, это пузырьки из транс-сети Гольджи. Типичный артефакт: клетки фиксированы; метка на антителах удлиняет расстояние до белка; самые ранние этапы сборки либо очень коротки, либо частично ниже предела обнаружения. Чего не доказывает: длительность этапов в секундах (порядок восстановлен по псевдовремени; допущение — ямки собираются одинаково, и частота формы пропорциональна её длительности) и то, какой белок задаёт изгиб.", "gn_trisk": "Трискелион", "g_trisk": "Сверх программы: трёхлучевая единица клатриновой оболочки из трёх тяжёлых и трёх лёгких цепей клатрина; трискелионы собираются в решётку из шести- и пятиугольников.", "gn_lattice": "Решётка клатрина (плоская и изогнутая)", "g_lattice": "Сверх программы: слой трискелионов на цитоплазматической стороне мембраны; плоская решётка состоит в основном из шестиугольников, изогнутая содержит и пятиугольники; изгибаясь, решётка превращает участок мембраны в ямку.", "gn_adapter": "Белок-адаптер", "g_adapter": "Белок, связывающий цитоплазматический участок рецептора груза с клатрином, например адаптин.", "gn_theta": "Угол замыкания ямки", "g_theta": "Сверх программы: угол θ, которым описывают форму решётки как сферического колпачка: 0° — плоская решётка, 90° — полусфера, 180° — замкнутая сфера.", "gn_proj": "Площадь проекции", "g_proj": "Сверх программы: площадь пятна, которое решётка занимает на изображении, если смотреть на мембрану снизу; при изгибе решётки она меньше площади самой решётки.", "s1m2_cond": "Клетки рака молочной железы человека SUM159; в обоих аллелях субъединица адаптера AP2 помечена флуоресцентной меткой; собственный белок Eps15 удалён, вместо него синтезируется Eps15 с меткой (контроль) или Eps15, у которого собственный участок сцепления молекул (спиральный домен) заменён светочувствительным модулем Cry2. Синий свет каждые 3 с усиливает сцепление молекул Eps15-Cry2; мощность 0, 10 или 50 мкВт. Микроскопия полного внутреннего отражения, 37 °C, съёмка 11 мин. Ямки, живущие меньше 20 с, считают вероятно оборвавшимися; 20–180 с — продуктивными; дольше 180 с — застрявшими. Границы 20 и 180 с — условные, принятые в литературе.", "s1m2_status": "Доли — по данным одной работы; поток ямок на анимации условный; границы 20 и 180 с — принятые в литературе", "s1m2_sl": "Белки-инициаторы сборки", "s1m2_p1": "Eps15 с меткой (контроль)", "s1m2_ps1": "1", "s1m2_pv1": "положение 1 — контроль", "s1m2_p2": "Eps15 нет", "s1m2_ps2": "2", "s1m2_pv2": "положение 2 — нет Eps15", "s1m2_p3": "Eps15-Cry2, без света", "s1m2_ps3": "3", "s1m2_pv3": "положение 3 — без света", "s1m2_p4": "Eps15-Cry2, свет 10 мкВт", "s1m2_ps4": "4", "s1m2_pv4": "положение 4 — 10 мкВт", "s1m2_p5": "Eps15-Cry2, свет 50 мкВт", "s1m2_ps5": "5", "s1m2_pv5": "положение 5 — 50 мкВт", "s1m2_lbl_below": "вид снизу на участок мембраны (площадь условная)", "s1m2_lbl_zoom": "увеличенная ямка в разрезе", "s1m2_lbl_cond": "условно", "s1m2_lbl_stuck": "при слишком прочной сети ямка остаётся на мембране дольше 3 мин", "s1m2_ax": "Доля ямок, %", "s1m2_bin_ab": "короче 20 с", "s1m2_bin_pr": "20–180 с", "s1m2_bin_st": "дольше 180 с", "s1m2_t20": "20 с", "s1m2_t180": "180 с", "s1m2_na": "в тексте статьи не приведено", "s1m2_lg_ab": "оборвалась", "s1m2_lg_pr": "отделилась (вспышка динамина)", "s1m2_lg_st": "застряла", "s1m2_r_ab": "Доля оборвавшихся ямок (короче 20 с)", "s1m2_r_st": "Доля застрявших ямок (дольше 180 с)", "s1m2_r_pr": "Доля продуктивных ямок", "s1m2_v_pr": "{x} % (ЗАКЛЮЧЕНИЕ: 100 − {a} − {b})", "s1m2_r_mob": "Подвижность белков в сети начала сборки", "s1m2_r_mob_s": "в каплях белков вне клетки при 22 °C подвижная доля Eps15 — 23 ± 2 % и 49 ± 1 % при разном освещении; в клетках при сильном свете (50 мкВт) восстановление флуоресценции после обесцвечивания почти блокировано", "s1m2_v_mob_ok": "обычная", "s1m2_v_mob_low": "снижена (сеть застывает)", "s1m2_st1": "Белки-инициаторы сборки собираются на мембране и удерживают адаптеры.", "s1m2_st2": "Решётка клатрина растёт; при слабой сети белков сборка часто обрывается в первые 20 с.", "s1m2_st2n": "Решётка клатрина растёт; часть ямок обрывается в первые 20 с (доли — на гистограмме).", "s1m2_st3w": "Часть ямок созревает, и динамин отделяет носитель.", "s1m2_st3s": "Подвижность белков снижена: динамин отделяет носитель у меньшей доли ямок, чем в контроле.", "s1m2_st4n": "Каждая ямка заканчивается одним из трёх исходов; доли выбранного положения — на гистограмме.", "s1m2_st3": "При сети средней прочности ямка созревает, и динамин отделяет носитель.", "s1m2_st4": "При слишком прочной сети белки теряют подвижность, и ямка остаётся на мембране дольше 3 мин.", "s1m2_note": "Поток ямок на анимации условный; исход каждой ямки задан долями выбранного положения. Где доля застрявших в тексте статьи не приведена, застрявшие ямки рисуются с частотой контроля и пометкой «условно».", "s1m2_c_weak": "Без Eps15 или при слабом сцеплении Eps15-Cry2 оборвавшихся ямок заметно больше, чем в контроле ({x} против 22 %).", "s1m2_c_weak_z": "Слабая сеть белков начала сборки распадается раньше, чем решётка успевает вырасти.", "s1m2_c_ok": "Доля оборвавшихся ямок — около 22 %, как в контроле.", "s1m2_c_ok_z": "Умеренное сцепление восстанавливает сборку: светом заменили недостающее свойство белка.", "s1m2_c_strong": "Оборвавшихся ямок примерно столько же ({x}), но застрявших в 5 раз больше, чем в контроле (22 против 4 %).", "s1m2_c_strong_z": "Слишком прочная сеть теряет подвижность: ямка не обрывается, но и не созревает. Для сборки нужна сеть средней прочности.", "s1m2_take": "Не каждая начатая ямка становится носителем: часть обрывается, часть застревает. Для сборки нужна сеть белков начала сборки средней прочности: слабая распадается, слишком прочная застывает.", "p1m2_1_q": "В клетках без Eps15 оборвавшихся ямок 41 %, в контроле 22 %. Вместо Eps15 синтезировали Eps15-Cry2 и осветили клетки слабым светом (10 мкВт). Что будет с долей оборвавшихся ямок?", "p1m2_1_o1": "Снизится примерно до уровня контроля.", "p1m2_1_o2": "Останется около 40 %: модуль Cry2 не заменяет Eps15.", "p1m2_1_o3": "Упадёт почти до нуля.", "p1m2_1_e": "Без света Eps15-Cry2 работает плохо (37 % оборвавшихся), а при 10 мкВт доля снижается до 23 % — как в контроле. Слабое дополнительное сцепление восстанавливает сборку.", "p1m2_1_w2": "Без света так и есть (37 %), но слабый свет усиливает сцепление молекул, и доля снижается до 23 %.", "p1m2_1_w3": "В контрольных клетках оборвавшихся ямок тоже около пятой части; ниже этого уровня свет долю не опустил (20 % при 50 мкВт).", "p1m2_2_q": "Мощность света увеличили до 50 мкВт: сцепление молекул Eps15-Cry2 стало ещё прочнее. Станет ли эндоцитоз эффективнее?", "p1m2_2_o1": "Нет: оборвавшихся ямок примерно столько же, но застрявших в 5 раз больше.", "p1m2_2_o2": "Да: оборвавшихся ямок почти не останется, и почти все ямки отделятся.", "p1m2_2_o3": "Нет: почти все ямки будут обрываться.", "p1m2_2_e": "При 50 мкВт оборвавшихся ямок 20 % (почти как при 10 мкВт), а застрявших — 22 % против 4 % в контроле. Сеть, сцепленная слишком прочно, теряет подвижность; ямка не обрывается, но и не созревает.", "p1m2_2_w2": "Доля оборвавшихся почти не изменилась (20 против 23 %), а застрявших стало в 5 раз больше: продуктивных ямок меньше, чем в контроле.", "p1m2_2_w3": "Обрывов не прибавилось; изменилась доля застрявших ямок.", "p1m2_3_q": "Застрявшая ямка живёт дольше 3 мин. По какому признаку на записи её отличают от участка, где ямки возникают одна за другой на одном месте?", "p1m2_3_o1": "У продуктивной ямки в конце жизни часто бывает вспышка динамина; у застрявшей повторных вспышек почти нет.", "p1m2_3_o2": "Застрявшая ямка ярче.", "p1m2_3_o3": "Отличить нельзя.", "p1m2_3_e": "Авторы проверили это по динамину 2: у продуктивных ямок его количество максимально в конце, перед отделением; у долгоживущих структур повторные максимумы редки. Значит, большинство долгоживущих структур — не места повторного эндоцитоза, а ямки, остановившиеся в сборке.", "p1m2_3_w2": "Яркость зависит от размера решётки и не говорит, отделится ли ямка; критерий — время жизни и вспышка динамина.", "p1m2_3_w3": "Отличают по динамину: повторных максимумов, которые были бы у последовательных ямок, на одном месте почти нет.", "s1m2_lim1": "Доли застрявших ямок в положениях 2–4: в тексте статьи их нет.", "s1m2_lim2": "Совместное влияние натяжения мембраны и актина: это изучали в других работах.", "s1m2_lim3": "Что происходит в тканях.", "gn_meth_m1m2": "Метод · запись жизни отдельных ямок в живых клетках", "g_meth_m1m2": "Что измеряется: время от появления до исчезновения флуоресцентного пятна адаптера AP2 у отдельной ямки; распределение времён жизни. Уровень: тысячи отдельных ямок в нижней мембране клетки, в тонком освещённом слое у стекла. Контроль: клетки с Eps15 и меткой; свет той же мощности в клетках без модуля Cry2 динамику ямок не меняет. Типичный артефакт: границы 20 и 180 с условны, часть «застрявших» ямок может отделиться позже; ямка, ушедшая из тонкого слоя освещения, выглядит «исчезнувшей»; синтез белка с меткой выше собственного уровня. Чего не доказывает: что сеть в клетке именно «жидкая» (это выведено по экспериментам с каплями белков вне клетки); оптогенетическая система искусственная. Влияние прочности сети на исходы показано вмешательством — изменением освещения.", "gn_eps": "Белки-инициаторы сборки ямки", "g_eps": "Сверх программы: белки (Eps15, FCHO и другие), которые собираются на месте будущей клатриновой ямки раньше клатрина и образуют сеть, удерживающую адаптеры: в пробирке — жидкоподобные капли, в клетке подвижность оценивают по восстановлению флуоресценции после обесцвечивания; слишком слабая сеть распадается, слишком прочная теряет подвижность.", "gn_cry2": "Светочувствительный модуль Cry2", "g_cry2": "Сверх программы: белковый модуль растения, который на синем свету сцепляется с такими же модулями; соединённый с другим белком, позволяет светом усиливать сцепление его молекул.", "s2m_cond": "Эпителиальные клетки сетчатки человека RPE-1 без каких-либо воздействий (груз не накапливали и синхронно не выпускали); белок Sec23A (компонент оболочки COP-II) слит с белком-меткой HaloTag: метку встроили в клеточный ген SEC23A, поэтому меченый белок синтезируется с собственного гена клеток; участки выхода из эндоплазматической сети (ЭПР) найдены по флуоресценции и сняты криоэлектронной томографией тонкого среза замороженной клетки; 63 томограммы. Разрешение методов — по зарубежному учебнику: предел светового микроскопа около 200 нм; методы сверхвысокого разрешения — около 10 нм.", "s2m_status": "Модель по данным одной работы: размеры — измеренные; размытие — расчёт; трубка — контрольная фигура модели, а не наблюдение", "s2m_sl": "Предел разрешения, нм (меньше — лучше)", "s2m_mk1": "криоэлектронная томография в этой работе (информация до 1,5 нм)", "s2m_mk10": "методы сверхвысокого разрешения (лучший результат по справочным данным)", "s2m_mk100": "структурированное освещение (SIM), около 100 нм по справочным данным", "s2m_mk200": "обычный световой микроскоп (предел дифракции)", "s2m_fig": "Контрольная фигура", "s2m_fig_ves": "скопление пузырьков", "s2m_fig_tube": "трубка того же объёма", "s2m_coat": "Показать оболочки", "s2m_coat_on": "вкл", "s2m_coat_off": "выкл", "s2m_tA": "как есть (масштаб соблюдён)", "s2m_tB": "то же в приборе: разрешение {x} нм", "s2m_lbl_zone": "зона без рибосом", "s2m_lbl_er": "мембрана ЭПР с рибосомами", "s2m_lbl_ergic": "промежуточный компартмент (ERGIC)", "s2m_lbl_ctrl": "контрольная фигура модели", "s2m_lbl_v70": "COP-II ≈ 70 нм", "s2m_lbl_v64": "COP-I ≈ 64 нм", "s2m_lbl_v243": "скопление 243 нм", "s2m_lbl_v483": "483 нм", "s2m_lbl_hl1": "пузырьки COP-II — на мембране ЭПР", "s2m_lbl_hl2": "пузырьки COP-I — на ERGIC или комплексе Гольджи", "s2m_lbl_rod": "палочка проколлагена около 300 нм", "s2m_r_res": "Предел разрешения метода", "s2m_r_seen": "Что различимо", "s2m_r_seen_s": "ЗАКЛЮЧЕНИЕ (правило модели): два пузырька различимы, если ширина размытия меньше половины диаметра пузырька; пятно сливается, если она больше половины размера скопления", "s2m_v_seen_sep": "отдельные формирующиеся и отделившиеся пузырьки", "s2m_v_seen_merge": "пузырьки сливаются, видны лишь контуры скопления", "s2m_v_seen_spot": "одно пятно размером со скопление", "s2m_r_tube": "Можно отличить скопление пузырьков от трубки того же объёма", "s2m_v_tube_yes": "да", "s2m_v_tube_no": "нет", "s2m_v_tube_hard": "с трудом", "s2m_r_coat": "Можно определить тип оболочки", "s2m_v_coat_yes": "да — по виду оболочки и сравнению с образцами", "s2m_v_coat_no": "нет", "s2m_st1": "Обычный световой микроскоп: скопление пузырьков у ЭПР видно как одно размытое пятно.", "s2m_st2": "Сверхвысокое разрешение: пятно распадается; при разрешении около 100 нм (структурированное освещение) пузырьки ещё сливаются, при 10 нм по правилу модели видны по отдельности.", "s2m_st3": "Криоэлектронная томография: видны отдельные формирующиеся и отделившиеся пузырьки около 70 нм.", "s2m_st4": "В этой работе формирующиеся пузырьки с COP-II находились на мембране ЭПР, а с COP-I — на мембранах промежуточного компартмента или комплекса Гольджи.", "s2m_note": "Бегунок разрешения плавно идёт от 200 нм к 1,5 нм. Число пузырьков в скоплении на схеме условное (8): в работе обычно 1–3 мембраны с COP-II и 1–3 с COP-I на участок; авторы считают это недоучётом.", "s2m_c_light": "При разрешении {x} нм скопление пузырьков и трубка того же объёма дают одинаковое пятно.", "s2m_c_light_z": "Поэтому по световым изображениям участков выхода из ЭПР нельзя определить, пузырьки там или трубки; это позволяют определить методы с разрешением в нанометры.", "s2m_c_mid": "При разрешении {x} нм видна форма скопления, но отдельные пузырьки сливаются.", "s2m_c_mid_z": "Чтобы различить два пузырька около 70 нм, нужна ширина размытия меньше их радиуса.", "s2m_c_em": "При разрешении {x} нм видны отдельные формирующиеся и отделившиеся пузырьки; в клетках без воздействий это скопление пузырьков около 70 нм, а не трубка.", "s2m_c_em_z": "Тип оболочки определяют лишь при разрешении в единицы нанометров — по профилю плотности оболочки.", "s2m_take": "Форма носителя, видимая на изображении, зависит от разрешения метода. В световом микроскопе участок выхода из ЭПР — одно пятно; в клетках без воздействий криоэлектронная томография показала скопления пузырьков с COP-II около 70 нм. Формирующиеся пузырьки с COP-II находятся на ЭПР, с COP-I — на промежуточном компартменте или комплексе Гольджи.", "p2m_1_q": "Участок выхода из ЭПР в клетке RPE-1 рассматривают в обычный световой микроскоп. Что будет на изображении?", "p2m_1_o1": "Одно пятно, по которому нельзя сказать, пузырьки это или трубка.", "p2m_1_o2": "Отдельные пузырьки около 70 нм.", "p2m_1_o3": "Трубка, отходящая от ЭПР.", "p2m_1_e": "Предел разрешения светового микроскопа около 200 нм, а всё скопление покрытых мембран в этих клетках — около 240 нм (медиана). Поэтому скопление выглядит одним пятном. В этой работе отдельные пузырьки стали видны при криоэлектронной томографии.", "p2m_1_w2": "Пузырёк около 70 нм втрое меньше предела разрешения светового микроскопа: соседние пузырьки сливаются в одно пятно.", "p2m_1_w3": "По пятну форму не определить: трубка того же объёма дала бы такое же изображение. Форму определяет метод с разрешением в нанометры.", "p2m_2_q": "На томограммах нашли формирующиеся пузырьки с оболочкой COP-II и с оболочкой COP-I. Где окажутся пузырьки каждого типа?", "p2m_2_o1": "Пузырьки с COP-II — на мембране ЭПР, с COP-I — на мембранах промежуточного компартмента или комплекса Гольджи.", "p2m_2_o2": "Пузырьки обоих типов — на мембране ЭПР вперемешку.", "p2m_2_o3": "Пузырьки с COP-I — на ЭПР, с COP-II — на комплексе Гольджи.", "p2m_2_e": "Все формирующиеся пузырьки с COP-II находились на мембранах ЭПР, все с COP-I — на мембранах промежуточного компартмента или комплекса Гольджи. Непокрытых почек не встретили; авторы заключили, что оболочка разбирается после отделения пузырька, но до слияния, и находка формирующегося пузырька без оболочки поставила бы этот вывод под сомнение.", "p2m_2_w2": "Почки разделены: COP-II отпочковывает носители от ЭПР, COP-I — от следующих мембран секреторного пути.", "p2m_2_w3": "Наоборот: COP-II работает на выходе из ЭПР, COP-I — на промежуточном компартменте и комплексе Гольджи.", "p2m_3_q": "Проколлаген собирается в ЭПР в палочку длиной около 300 нм. Может ли он покинуть ЭПР в обычном пузырьке COP-II диаметром 60–80 нм?", "p2m_3_o1": "Нет: палочка не помещается в такой пузырёк; для такого груза нужны носители крупнее.", "p2m_3_o2": "Да: палочка сгибается и помещается.", "p2m_3_o3": "Да: проколлаген выходит из ЭПР без носителя, через мембрану.", "p2m_3_e": "Палочки проколлагена не помещаются в пузырьки COP-II диаметром 60–80 нм. Проколлаген связывается с трансмембранными белками упаковки, и они, как считают, перестраивают сборку оболочки в более крупные носители. Мутации генов этих белков у человека нарушают образование коллагена.", "p2m_3_w2": "Палочка проколлагена жёсткая; при длине около 300 нм она в несколько раз длиннее пузырька.", "p2m_3_w3": "Белки секреторного пути не проходят через мембрану ЭПР: они покидают ЭПР в мембранных носителях.", "s2m_lim1": "Одна линия клеток без добавления груза. Другие работы описывают трубчатые носители при прижизненной съёмке и объёмной электронной микроскопии; в клетках без воздействий их здесь не нашли, а возможность трубок и туннелей авторы не исключают.", "s2m_lim2": "Числа пузырьков в скоплении на схеме условные: в работе обычно 1–3 покрытые мембраны каждого типа на участок (авторы считают это недоучётом).", "s2m_lim3": "Правило различимости — упрощение (размытие гауссово, шум и контраст не учитываются).", "s2m_lim4": "Модель не показывает, как выходит крупный груз: для проколлагена механизм обсуждается.", "s2m_lim5": "Как считается. Пороги 35 и 120 нм — свойство модели: половина диаметра пузырька (около 35 нм) и половина медианного размера скопления (около 120 нм). Измерено: пузырёк COP-II — около 70 нм (пересчёт медианного объёма 180 760 нм³ на шар; размах 53–91 нм), пузырёк COP-I — около 64 нм (медиана), скопление покрытых мембран — медиана 243 нм (межквартильный размах 168–371 нм), зона без рибосом — 483 нм (453–522 нм); подсчитано 157 мембран с COP-II (95 отделившихся пузырьков, 62 формирующихся) и 187 с COP-I (39 отделившихся пузырьков, 148 формирующихся) на 63 томограммах.", "gn_meth_m2m": "Метод · криоэлектронная томография после флуоресцентной навигации", "g_meth_m2m": "Что измеряется: трёхмерная электронная плотность тонкого (150–350 нм) слоя быстро замороженной клетки; участок выбирают по флуоресценции меченого белка оболочки. Уровень: отдельные мембраны, формирующиеся пузырьки, белковые оболочки; нанометры. Контроль: отнесение оболочек подтверждали сопоставлением с шаблонами COP-I и COP-II (по структурам, известным вне клетки). Типичный артефакт: слой мал (доли кубического микрометра), а участки отбирали по скоплениям флуоресценции — выборка смещена к скоплениям пузырьков. Чего не доказывает: что трубчатых носителей нет в других клетках и при большом добавлении груза (авторы прямо пишут, что туннели не исключены).", "gn_eres": "Участок выхода из ЭПР", "g_eres": "Сверх программы: свободный от рибосом участок мембраны грЭПР, на котором собирается оболочка COP-II и отпочковываются носители к комплексу Гольджи.", "gn_ergic": "Промежуточный компартмент ЭПР–Гольджи", "g_ergic": "Сверх программы: мембраны между грЭПР и цис-сетью комплекса Гольджи; принимают носители с COP-II, от них отпочковываются носители с COP-I.", "gn_procol": "Проколлаген", "g_procol": "Сверх программы: предшественник коллагена — тройная спираль, собранная в ЭПР в жёсткую палочковидную молекулу длиной около 300 нм.", "gn_res": "Разрешение микроскопа", "g_res": "Наименьшее расстояние, на котором два объекта видны раздельно; у светового микроскопа около 200 нм, у электронного — единицы нанометров и меньше.", "gn_vesicle2": "Пузырёк COP-II", "g_vesicle2": "Носитель с белковой оболочкой COP-II, отпочковавшийся от мембраны грЭПР; в клетках RPE-1 — около 70 нм.", "gn_tube": "Трубка того же объёма", "g_tube": "Контрольная фигура модели, а не наблюдение этой работы: трубчатый носитель того же объёма, что и скопление пузырьков; нужна, чтобы проверить, различает ли метод эти две формы.", "s2m2_cond": "Культура нейронов гиппокампа крысы на золотых сетках; потенциал действия вызывают светом через каналродопсин ChIEF; через заданное время после потенциала действия образец быстро замораживают; затем криоэлектронная томография нервных окончаний. Время после потенциала действия — 4, 8, 30, 70, 100–300 мс; температура при замораживании: около 24 °C (4 мс), около 29 °C (8 мс), 34 °C (30, 70 и 100–300 мс). Для интервалов больше 100 мс свет подавали до падения сетки в камеру с температурой 34 °C. Все группы — в присутствии CNQX, блокатора возбуждающей передачи. Тетанотоксин (10 нМ, 8–10 ч) сравнивали в покое и через 8 мс; других моментов с ним нет. Поздняя выборка 100–300 мс — одна группа томограмм, а не два момента. Последовательность состояний восстановлена по снимкам разных синапсов, а не по наблюдению одного пузырька.", "s2m2_status": "Модель по данным одной работы: засечки — снимки синапсов в отдельные моменты; ход между ними не измерен; время выхода медиатора и время открытия поры — расчётные оценки авторов", "s2m2_sl": "Время после потенциала действия, мс", "s2m2_mk0": "контроль без стимуляции", "s2m2_mk4": "снимок, около 24 °C", "s2m2_mk8": "снимок, около 29 °C", "s2m2_mk30": "снимок, 34 °C", "s2m2_mk70": "снимок, 34 °C", "s2m2_mk100": "поздняя выборка 100–300 мс (одна группа томограмм)", "s2m2_mk300": "поздняя выборка 100–300 мс (одна группа томограмм)", "s2m2_tx": "Тетанотоксин", "s2m2_tx_off": "выкл", "s2m2_tx_on": "вкл", "s2m2_lbl_term": "нервное окончание", "s2m2_lbl_cleft": "синаптическая щель", "s2m2_lbl_post": "постсинаптическая мембрана", "s2m2_lbl_az": "активная зона", "s2m2_lbl_flat": "немногие распластываются", "s2m2_lbl_ufe": "эндоцитозная структура около 80 нм", "s2m2_lbl_tent": "тетанотоксин: синаптобревин расщеплён", "s2m2_lbl_note": "кружок — группа синапсов на снимке; между снимками ход не измерен", "s2m2_lbl_late": "поздняя выборка", "s2m2_lbl_tentna": "для тетанотоксина в этом положении сравнение не проводилось", "s2m2_lbl_popen": "пора открыта", "s2m2_lbl_pclosed": "пора закрыта", "s2m2_ax": "время, мс", "s2m2_row_0": "удерживается", "s2m2_row_4": "гемислияние", "s2m2_row_8": "открытая пора слияния", "s2m2_row_30": "сжат, пора", "s2m2_row_70": "отошёл", "s2m2_row_late": "эндоцитоз", "s2m2_small8": "По расчётам авторов, большая часть медиатора выходит примерно за 50 мкс; пора открыта не менее примерно 2 мс", "s2m2_small30": "На снимках 30 мс малые пузырьки находятся на двух стадиях: у одних пора ещё открыта, у других уже закрыта.", "s2m2_r_t": "Время после потенциала действия", "s2m2_v_between": "{t} мс — между снимками: ход не измерен, показано последнее измеренное состояние", "s2m2_v_t_late": "поздняя выборка, 100–300 мс", "s2m2_v_t_rest": "контроль без стимуляции", "s2m2_v_na": "не измерено: с тетанотоксином сравнение проведено только в покое и через 8 мс", "s2m2_v_na_s": "не измерено", "s2m2_r_state": "Состояние пузырьков, высвобождающих медиатор", "s2m2_v_state_0": "пузырьки около 41 нм удерживаются у мембраны; немногие уже в состоянии гемислияния", "s2m2_v_state_4": "число пузырьков в состоянии гемислияния максимально", "s2m2_v_state_8": "число пузырьков с открытой порой около 4 нм максимально", "s2m2_v_state_30": "малые пузырьки (около 29 нм) на двух стадиях: пора ещё открыта или уже закрыта; первые пузырьки начинают отходить от мембраны", "s2m2_v_state_70": "большинство сжатых пузырьков отошло от мембраны; распластались немногие", "s2m2_v_state_late": "на краю активной зоны — эндоцитозные структуры около 80 нм", "s2m2_v_state_tent": "на снимках в покое и через 8 мс — только удерживаемые у мембраны пузырьки, их больше, чем в контроле; гемислияния и пор нет", "s2m2_r_pore": "Диаметр поры слияния", "s2m2_v_pore_30": "у части малых пузырьков пора ещё открыта (около 4 нм), у других уже закрыта", "s2m2_v_pore_yes": "около 4 нм", "s2m2_v_pore_no": "поры нет", "s2m2_r_size": "Диаметр пузырька", "s2m2_v_size_big": "около 41 нм", "s2m2_v_size_small": "около 29 нм (сжат)", "s2m2_r_temp": "Температура эксперимента в этой точке", "s2m2_v_temp": "{c} °C", "s2m2_v_temp_na": "34 °C (температура камеры)", "s2m2_st0": "Пузырьки около 41 нм удерживаются у мембраны; немногие уже в состоянии гемислияния.", "s2m2_stT": "С тетанотоксином сравнение проведено в покое и через 8 мс: на этих снимках видны только удерживаемые у мембраны пузырьки; гемислияния и пор нет. Для остальных моментов данных с тетанотоксином нет.", "s2m2_st1": "Через 4 мс число пузырьков в состоянии гемислияния максимально.", "s2m2_st2": "Через 8 мс число пузырьков с открытой порой около 4 нм максимально.", "s2m2_st3": "Пузырёк с открытой порой быстро сжимается примерно до половины площади; затем пора закрывается, и пузырёк начинает отходить от мембраны.", "s2m2_st4": "К 70 мс большинство сжатых пузырьков отошло от мембраны; распластались немногие.", "s2m2_st5": "Через 100–300 мс на краю активной зоны появляются эндоцитозные структуры около 80 нм.", "s2m2_note": "Бегунок времени идёт по засечкам-снимкам; кадры между снимками — рисунок модели, ход событий между ними не измерен. Путь «сжатие и уход» — по оценке авторов больше 80 % событий выброса.", "s2m2_c_early": "Через {t} мс слияние ещё развивается: пузырёк проходит гемислияние, затем открывается пора около 4 нм.", "s2m2_c_early_z": "По последовательности пиков численности пора слияния, по выводу авторов, открывается после гемислияния; авторы называют это состояние частично слитым.", "s2m2_c_shrink": "Через {t} мс большинство выбросивших медиатор пузырьков сжато до примерно 29 нм и отходит от мембраны.", "s2m2_c_shrink_z": "Пузырёк отдаёт медиатор через узкую пору и уходит, не встраиваясь в мембрану целиком; распластывание — редкий исход.", "s2m2_c_late": "Через {t} мс на краю активной зоны появляются эндоцитозные структуры около 80 нм.", "s2m2_c_late_z": "По предположению авторов, мембрану, добавленную при сжатии и распластывании пузырьков, быстро забирает сверхбыстрый эндоцитоз.", "s2m2_c_tent": "С тетанотоксином в покое и через 8 мс пузырьки остаются удерживаемыми у мембраны: ни гемислияния, ни пор.", "s2m2_c_tent_z": "В этом сравнении гемислияния и пор нет: синаптобревин расщеплён, SNARE-комплекс не собирается, и слияние не начинается.", "s2m2_c_tent_na": "С тетанотоксином сравнение проведено только в покое и через 8 мс; в этом положении данных нет.", "s2m2_c_tent_na_z": "Другие моменты после потенциала действия с тетанотоксином в этой работе не сравнивали, поэтому кадр здесь не показывает результата.", "s2m2_take": "После потенциала действия синаптический пузырёк проходит гемислияние, открывает пору около 4 нм, сжимается и чаще всего уходит от мембраны, не встраиваясь в неё целиком; добавленную мембрану, по предположению авторов, через 100–300 мс забирает эндоцитоз.", "p2m2_1_q": "Через 8 мс после потенциала действия число пузырьков с открытой порой около 4 нм максимально. Что станет с большинством этих пузырьков к 70 мс?", "p2m2_1_o1": "Сожмутся примерно до половины площади и отойдут от мембраны; распластаются немногие.", "p2m2_1_o2": "Полностью распластаются и встроятся в мембрану.", "p2m2_1_o3": "Пора закроется, и пузырёк прежнего размера останется у мембраны.", "p2m2_1_e": "По снимкам разных синапсов авторы восстанавливают такую последовательность: пузырьки с открытой порой быстро сжимаются с 41 до 29 нм — примерно до половины площади поверхности ((29/41)² ≈ 0,50 при приближении сферой); затем пора закрывается, и с 30 мс пузырьки начинают отходить от мембраны. По оценке авторов, путь «сжатие и уход» — больше 80 % событий выброса. Распластываются немногие.", "p2m2_1_w2": "Распластывание наблюдали, но это меньшая часть событий: большинство пузырьков сжимается и уходит.", "p2m2_1_w3": "Пузырёк не сохраняет размер: после открытия поры он сжимается примерно до половины площади.", "p2m2_2_q": "Культуру обработали тетанотоксином, который расщепляет синаптобревин пузырьков. Что покажет томограмма через 8 мс после потенциала действия?", "p2m2_2_o1": "Только удерживаемые у мембраны пузырьки, без гемислияния и пор; удерживаемых пузырьков больше, чем в контроле.", "p2m2_2_o2": "Гемислияние будет, но поры не откроются.", "p2m2_2_o3": "То же, что в контроле: тетанотоксин действует позже.", "p2m2_2_e": "С тетанотоксином (сравнение в покое и через 8 мс) не образуются ни пузырьки в гемислиянии, ни пузырьки с порой, а удерживаемые у мембраны пузырьки накапливаются. Без синаптобревина SNARE-комплекс не собирается, и уже первый этап слияния не начинается.", "p
