<title>Семинар 3 · Адресация груза: метка, рецептор и механизм переноса — Кафедра биологии и генетики, Медицинский университет Петровского</title>

<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tlrow{display:flex;gap:10px;align-items:center}
.tlplay{white-space:nowrap;min-width:116px;padding-top:7px;padding-bottom:7px}
.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */
.veil{display:none}
.casemode .side>.panel:not(.case),.casemode .totake{display:none!important}
.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .tl,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}
.case .k{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}
.co{margin:0 0 10px;font-size:15px;line-height:1.4}
.ch{margin:12px 0 6px;font-weight:700;font-size:14px}
.cm,.cc{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.cq{font:600 12.5px var(--f-body);padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}
.kh{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */
:root{--nucbg:#F3EEF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}

</style>

_cup": "псевдоподии охватывают частицу", "s1_lbl_phagosome": "фагосома > 250 нм", "s1_lbl_noactin": "без перестройки актина выпячиваний нет", "s1_r_carrier": "Носитель", "s1_r_carrier_s": "размер приближённый", "s1_v_micro": "пузырьки < 150 нм", "s1_v_micro_macro": "пузырьки < 150 нм и макропиносомы > 0,2 мкм", "s1_v_ccv": "покрытые клатрином везикулы", "s1_v_phago": "фагосома > 250 нм", "s1_v_none": "не образуется", "s1_r_inside": "Выбранный груз попадает в клетку", "s1_v_nonspec": "лишь неспецифически, с жидкостью", "s1_r_clath": "Клатриновая оболочка", "s1_r_actin": "Выпячивания мембраны за счёт актина", "s1_fl_none": "Клетка постоянно захватывает внеклеточную жидкость вместе с растворёнными веществами в мелких пузырьках диаметром менее 150 нм — это микропиноцитоз. Такие пузырьки образуются разными путями: жидкость захватывают и покрытые клатрином везикулы, и носители, которые образуются без клатрина.", "s1_fl_none_z": "Захват жидкости неспецифичен: вещество попадает в клетку вместе с жидкостью, без связывания с рецептором.", "s1_fl_clath": "Без клатрина покрытые клатрином везикулы не образуются, но захват жидкости в модели продолжается: её переносят мелкие носители, которые образуются без клатрина. В эксперименте при блокаде образования клатриновых везикул в клетках HeLa начальная скорость захвата жидкости не изменилась (сверх программы; Damke et al., 1994).", "s1_fl_clath_z": "Клатрин нужен для избирательного захвата грузов, связанных с рецепторами; неспецифический захват жидкости продолжается и без него.", "s1_fl_actin": "Без перестройки актина мелкие пузырьки в модели продолжают образовываться: так задано условием модели. В клетке участие актина зависит от пути и механических условий: например, при повышенном натяжении мембраны образованию клатриновых пузырьков нужна полимеризация актина (сверх программы; Kaksonen, Roux, 2018).", "s1_fl_actin_z": "В модели мелкие пузырьки образуются без перестройки актина; это допущение модели, а не общее свойство мелких носителей.", "s1_gf_none": "Фактор роста запускает перестройку актина: мембрана образует складки, которые замыкаются в крупные макропиносомы (более 0,2 мкм). Мелкие пузырьки образуются и без этого сигнала.", "s1_gf_none_z": "Макропиноцитоз — регулируемый путь: в большинстве клеток его запускает сигнал, например фактор роста, и тогда клетка поглощает значительный объём внеклеточной жидкости; так макрофаг захватывает антигены.", "s1_gf_clath": "Без клатрина макропиносомы образуются: их создают складки мембраны, а не клатриновая оболочка. Мелкие носители, которые образуются без клатрина, тоже продолжают захватывать жидкость.", "s1_gf_clath_z": "Захват жидкости — и постоянный, и запущенный фактором роста — продолжается и без клатриновых ямок.", "s1_gf_actin": "Без перестройки актина складки мембраны не образуются, и макропиносом нет; мелкие пузырьки по условию модели сохраняются.", "s1_gf_actin_z": "Выпадает ответ на фактор роста — захват значительного объёма жидкости в макропиносомах; постоянный захват в мелких пузырьках продолжается.", "s1_lig_none": "Лиганд связывается со своими рецепторами. Цитоплазматические участки рецепторов связываются с белками-адаптерами, адаптеры — с клатрином; клатриновая решётка изгибает мембрану в ямку, и от мембраны отделяется покрытая клатрином везикула; её отделение опосредует белок динамин.", "s1_lig_none_z": "Рецептор-опосредованный эндоцитоз избирательно концентрирует груз: внутрь попадают прежде всего молекулы, для которых на поверхности клетки есть рецепторы.", "s1_lig_clath": "Без клатрина ямка не образуется: рецепторы с лигандом остаются рассеянными по поверхности клетки, и избирательный захват этого лиганда через клатриновые ямки не идёт (ЗАКЛЮЧЕНИЕ). Небольшая часть лиганда может попадать в клетку неспецифически, вместе с жидкостью в мелких пузырьках.", "s1_lig_clath_z": "В модели выпадает избирательный клатрин-зависимый захват выбранного лиганда; остаётся лишь неспецифическое поглощение вместе с жидкостью. Другие пути, которые начинаются с узнавания груза рецепторами, — например, фагоцитоз частиц, — для этого груза в модели не рассматриваются.", "s1_lig_actin": "В модели ямка образуется и без перестройки актина: главная деталь этого пути — клатриновая оболочка, собранная вокруг рецепторов с грузом. Модель упрощена: при повышенном натяжении мембраны образованию клатриновых пузырьков нужна и полимеризация актина (сверх программы; Kaksonen, Roux, 2018).", "s1_lig_actin_z": "Главный признак этого пути — клатриновая оболочка, собранная вокруг рецепторов с грузом.", "s1_part_none": "Клетка-фагоцит (например, макрофаг) образует псевдоподии за счёт перестройки актина; они охватывают частицу, и образуется фагосома — крупная везикула более 250 нм.", "s1_part_none_z": "Так фагоциты поглощают бактерии, обломки клеток и пылевые частицы; бактерии, покрытые антителами, узнаются рецепторами к Fc-фрагментам антител.", "s1_part_clath": "Без клатрина фагоцитоз продолжается: псевдоподии образуются за счёт перестройки актина, клатрин для этого не нужен.", "s1_part_clath_z": "Фагоциты очищают ткани от бактерий и обломков клеток без участия клатрина: охват частицы обеспечивает актиновый цитоскелет.", "s1_part_actin": "Без перестройки актина псевдоподии не образуются, и частица остаётся снаружи.", "s1_part_actin_z": "Фагоцитоз — актин-зависимый путь: без выпячиваний мембраны охватить крупную частицу нечем.", "s1_lbl_scale": "размеры не в масштабе", "tl_slider": "Ход процесса: положение на шкале этапов", "tl_chips": "Этапы процесса", "tl_step": "Этап {i} из {n}", "tl_play": "▶ Запустить", "tl_pause": "❚❚ Пауза", "tl_again": "↺ Ещё раз", "tl_note": "Порядок этапов — учебная модель. Длительность этапов и число молекул условные, не измерены.", "s1t_lbl_status": "размеры и время условные", "s1t_lbl_fold": "складка мембраны", "s1t_lbl_uncoated": "везикула без оболочки", "s1t_fl_1": "Мембрана впячивается и захватывает внеклеточную жидкость.", "s1t_fl_2": "Шейка впячивания сужается.", "s1t_fl_3": "Мелкий пузырёк с жидкостью отделяется и уходит в цитоплазму.", "s1t_gf_1": "Фактор роста связывается со своим рецептором.", "s1t_gf_2": "Сигнал запускает перестройку актина: мембрана образует складку.", "s1t_gf_3": "Складка смыкается и замыкает внеклеточную жидкость.", "s1t_gf_4": "Макропиносома с жидкостью уходит в цитоплазму.", "s1t_lig_1": "Лиганд связывается со своими рецепторами.", "s1t_lig_2": "Цитоплазматические участки рецепторов связываются с белками-адаптерами.", "s1t_lig_3": "Адаптеры связываются с клатрином: вокруг рецепторов с грузом собирается оболочка.", "s1t_lig_4": "Клатриновая решётка изгибает мембрану в ямку.", "s1t_lig_5": "Шейка ямки сужается; отделение везикулы опосредует динамин.", "s1t_lig_6": "Покрытая клатрином везикула уходит в цитоплазму.", "s1t_lig_7": "Оболочка сброшена, везикула осталась без клатрина.", "s1t_part_1": "Частица связывается с рецепторами на поверхности клетки-фагоцита.", "s1t_part_2": "За счёт перестройки актина растут псевдоподии.", "s1t_part_3": "Псевдоподии охватывают частицу.", "s1t_part_4": "Замкнутая фагосома уходит в цитоплазму.", "s1t_stop_lig_clath": "Путь остановился после этапа 2: без клатрина ямка не образуется, рецепторы с лигандом остаются рассеянными.", "s1t_stop_gf_actin": "Макропиноцитоз остановился после этапа 1: без перестройки актина складки мембраны не образуются. Мелкие пузырьки в модели сохраняются.", "s1t_stop_part_actin": "Фагоцитоз остановился после этапа 1: без перестройки актина псевдоподии не образуются, и частица остаётся снаружи.", "s1b_take": "Клетка поглощает вещества разными путями: жидкость с растворёнными веществами — постоянно в мелких пузырьках, а после сигнала фактора роста ещё и в макропиносомах; показанный рецепторный груз — избирательно, в покрытых клатрином везикулах; крупные частицы — в фагосомах. ЗАКЛЮЧЕНИЕ: в этой модели отсутствие указанного компонента блокирует соответствующий этап. В эксперименте такой результат поддерживает необходимость функции компонента, если воздействие специфично, а остальные процессы сохранены.", "p1b_1_q": "Лиганд связывается со своими рецепторами на поверхности клетки и поступает в неё через клатриновые ямки. Что произойдёт с его захватом, если в клетке нет клатрина?", "p1b_1_o1": "Ямка не образуется, лиганд остаётся на рецепторах на поверхности", "p1b_1_o2": "Захват не изменится: рецепторы сами изогнут мембрану в пузырёк", "p1b_1_o3": "Лиганд будет охвачен псевдоподиями, как частица при фагоцитозе", "p1b_1_e": "Рецепторы собираются в ямке потому, что через белки-адаптеры связываются с клатрином, а клатриновая решётка изгибает мембрану. Без клатрина ямка не образуется, и избирательный захват этого лиганда не идёт.", "p1b_1_w2": "Рецептор связывает груз, но в ямку мембрану изгибает клатриновая решётка, собранная через адаптеры; сам рецептор пузырёк не формирует.", "p1b_1_w3": "Псевдоподии образуют фагоциты, охватывая крупную частицу, и для этого нужна перестройка актина. В этом шаге груз — отдельные молекулы, связанные с рецепторами.", "p1b_2_q": "В этой модели клетка с фактором роста захватывает жидкость двумя путями: в мелких пузырьках, образование которых принято не зависящим от перестройки актина, и в макропиносомах. Как изменится захват жидкости, если перестройка актина невозможна?", "p1b_2_o1": "Макропиносом не будет, мелкие пузырьки сохранятся", "p1b_2_o2": "Захват жидкости прекратится полностью", "p1b_2_o3": "Мелких пузырьков не будет, макропиносомы сохранятся", "p1b_2_e": "Макропиносомы образуются из складок мембраны, которые создаёт перестройка актина, поэтому без неё они не образуются. Мелковезикулярный путь сохраняется по условию модели. Это условие нельзя переносить на все мелкие эндоцитозные носители: участие актина зависит от пути и механических условий (сверх программы).", "p1b_2_w2": "Захват жидкости прекращается не полностью: по условию модели мелкие пузырьки образуются без перестройки актина и продолжают поставлять жидкость в клетку.", "p1b_2_w3": "Зависимость обратная: актин нужен для складок мембраны, из которых образуются макропиносомы, а мелкие пузырьки по условию модели от перестройки актина не зависят.", "p1b_3_q": "Макрофаг встречает крупную частицу. Поглотит ли он её, если в клетке нет клатрина?", "p1b_3_o1": "Да: псевдоподии образуются за счёт актина, клатрин не нужен", "p1b_3_o2": "Нет: без клатрина не отделяется ни один эндоцитозный носитель", "p1b_3_o3": "Да, но частица попадёт в мелкие пузырьки менее 150 нм", "p1b_3_e": "Фагоцитоз не зависит от клатрина, но зависит от актина: псевдоподии охватывают частицу, и образуется фагосома более 250 нм.", "p1b_3_w2": "Клатрин нужен не всем путям эндоцитоза: макропиносомы, фагосомы и часть мелких пузырьков образуются без него.", "p1b_3_w3": "Крупная частица не помещается в пузырёк менее 150 нм: её охватывают псевдоподии, и образуется фагосома более 250 нм.", "s1a_exp": "Эксперимент", "s1a_exp_dyn": "динамин", "s1a_exp_cav": "кавеолы", "s1a_mut": "Мутантный динамин K44A (связывание и гидролиз ГТФ нарушены)", "s1a_cells": "Клетки", "s1a_cells_wt": "дикий тип", "s1a_cells_ko": "без кавеолина-1", "s1a_med": "Среда", "s1a_med_iso": "изоосмотическая", "s1a_med_hypo": "гипоосмотическая", "s1a_lbl_dyn_ok": "кольцо динамина на шейке ямки", "s1a_lbl_dyn_mut": "ямки впячены, но шейки не сужаются", "s1a_lbl_tube": "длинная трубка, связанная с поверхностью", "s1a_lbl_ccp": "клатриновая ямка", "s1a_lbl_cav": "кавеолы", "s1a_lbl_flat": "распластанная кавеола", "s1a_lbl_nocav": "кавеол нет", "s1a_lbl_hypo": "вода входит в клетку, клетка набухает", "s1a_lbl_rupture": "разрывы мембраны", "s1a_r_tfn": "Захват трансферрина", "s1a_r_tfn_s": "в суженные ямки и носители, начальная скорость", "s1a_r_egf": "Захват EGF", "s1a_r_egf_s": "эпидермальный фактор роста", "s1a_r_curved": "Впяченные клатриновые ямки", "s1a_r_curved_s": "число на 1 мкм² мембраны", "s1a_r_fluid": "Захват жидкости", "s1a_r_fluid_s": "пероксидаза хрена в среде, начальная скорость", "s1a_r_recyc": "Рециркуляция рецептора трансферрина", "s1a_r_recyc_s": "из эндосом на поверхность", "s1a_v_ctrl": "контроль", "s1a_v_tfn_low": "ниже более чем на 80 %", "s1a_v_egf_low": "ниже более чем на 60 %", "s1a_v_x2": "примерно вдвое больше", "s1a_v_same_m": "не изменён", "s1a_v_same_f": "не изменена", "s1a_r_cav": "Кавеолы на поверхности", "s1a_r_cav_s": "колбовидные впячивания 50–100 нм", "s1a_v_cav_many": "много", "s1a_v_cav_flat": "часть распластана", "s1a_v_cav_none": "нет", "s1a_r_tension": "Сила вытягивания мембранной нити", "s1a_r_tension_s": "показатель натяжения мембраны, относительно исходной", "s1a_v_ten_base": "исходное состояние", "s1a_v_ten_same": "почти не меняется", "s1a_v_ten_up": "выше на 200 %", "s1a_r_ccp": "Клатриновые ямки", "s1a_r_ccp_s": "число на поверхности", "s1a_v_ccp_same": "почти не меняется", "s1a_r_rupt": "Разрывы мембраны", "s1a_r_rupt_s": "при набухании", "s1a_v_rupt_base": "реже, чем без кавеол", "s1a_v_rupt_up": "чаще", "s1a_dyn_ctrl": "Контроль, клетки HeLa (линия клеток рака шейки матки человека): клатриновые ямки собираются вокруг рецепторов, на шейке ямки — кольцо динамина, и покрытые клатрином везикулы отделяются от мембраны.", "s1a_dyn_ctrl_z": "Динамин — ГТФаза; чтобы носитель отделился, динамину нужно связывать и гидролизовать ГТФ.", "s1a_dyn_mut": "У мутантного динамина K44A (замена лизина в положении 44 на аланин) нарушены связывание и гидролиз ГТФ. Ямки собираются, впячиваются и собирают рецепторы, но не сужаются, и покрытые носители не отделяются; в клетках накапливаются длинные мембранные трубки, многие из которых открыты на поверхность клетки. Захват трансферрина снижен более чем на 80 %, захват жидкости не изменён.", "s1a_dyn_mut_z": "Эксперимент указывает этап, на котором нужен динамин: после сборки ямки и до отделения носителя. Жидкость в этих клетках поступает и путями, на которые мутантный динамин не действует.", "s1a_dyn_mut_tfn": "У мутантного динамина K44A нарушены связывание и гидролиз ГТФ. Ямки собираются, впячиваются и собирают рецепторы, но не сужаются, и покрытые носители не отделяются; захват трансферрина снижен более чем на 80 %.", "s1a_dyn_mut_tfn_z": "Эксперимент указывает этап, на котором нужен динамин: после сборки ямки и до отделения носителя.", "s1a_dyn_mut_fluid": "В клетках с мутантным динамином K44A начальная скорость захвата жидкости (пероксидаза хрена в среде) не изменилась.", "s1a_dyn_mut_fluid_z": "Значит, в этих клетках жидкость поступала путями, на которые мутантный динамин не действует.", "s1a_cav_wt_iso": "Эндотелиальные клетки лёгких мыши дикого типа в изоосмотической среде (около 300 мОсм — миллиосмоль на литр): на поверхности много кавеол — колбовидных впячиваний с узкой шейкой, рядом клатриновые ямки.", "s1a_cav_wt_iso_z": "Кавеолы хранят запас мембраны в виде впячиваний.", "s1a_cav_wt_hypo": "Гипоосмотическая среда: вода входит в клетку, клетка набухает. За минуты часть кавеол распластывается и исчезает с поверхности; сила вытягивания мембранной нити у эндотелиальных клеток при 150 мОсм почти не меняется; клатриновые ямки почти не меняются.", "s1a_cav_wt_hypo_z": "Распластывание кавеол добавляет к плоской мембране запас площади и гасит скачок натяжения; для этого не нужны ни АТФ, ни перестройка актина.", "s1a_cav_ko_iso": "Эндотелиальные клетки лёгких мыши без кавеолина-1 (Cav1−/−) в изоосмотической среде: кавеол на поверхности нет, клатриновые ямки есть.", "s1a_cav_ko_iso_z": "Без кавеолина-1 кавеолы в этих клетках не образуются, и запаса мембраны во впячиваниях нет.", "s1a_cav_ko_hypo": "Эндотелиальные клетки лёгких мыши без кавеолина-1 в гипоосмотической среде (150 мОсм): сила вытягивания мембранной нити выросла на 200 % — натяжение мембраны резко увеличилось, и мембрана чаще разрывается. Клатриновые ямки скачок натяжения не гасят.", "s1a_cav_ko_hypo_z": "Резерв мембраны при набухании дают кавеолы, а не клатриновые ямки: в клетках с ямками, но без кавеол натяжение растёт.", "s1a_take": "Два эксперимента уточняют базовую модель. Динамин нужен после сборки клатриновой ямки — для её сужения и отделения носителя; захват жидкости в тех же клетках HeLa от мутантного динамина не зависел. Кавеолы при растяжении мембраны распластываются и служат её резервом; клатриновые ямки этой функции не выполняют.", "p1a_1_q": "В клетках HeLa включили синтез мутантного динамина K44A, у которого нарушены связывание и гидролиз ГТФ. Что произойдёт с клатриновыми ямками и с захватом трансферрина?", "p1a_1_o1": "Ямки соберутся и захватят рецепторы, но не отделятся; захват резко снизится", "p1a_1_o2": "Ямки не соберутся, рецепторы останутся рассеянными; захват резко снизится", "p1a_1_o3": "Ямки отделятся, но носители не сбросят оболочку; захват не изменится", "p1a_1_e": "В клетках с мутантным динамином сборка ямок, их впячивание и захват рецепторов не нарушены, но ямки не сужаются и носители не отделяются; захват трансферрина снижен более чем на 80 %.", "p1a_1_w2": "Сборка ямки и захват в неё рецепторов от динамина не зависят: впяченных ямок в этих клетках даже примерно вдвое больше, чем в контроле.", "p1a_1_w3": "Без активного динамина носители не отделяются от мембраны, поэтому до снятия оболочки дело не доходит, а захват трансферрина снижается.", "p1a_2_q": "В клетках HeLa с мутантным динамином K44A измерили захват жидкости с растворённой пероксидазой хрена. Каков результат по сравнению с контролем?", "p1a_2_o1": "Захват жидкости остался на уровне контроля", "p1a_2_o2": "Захват жидкости прекратился так же, как захват трансферрина", "p1a_2_o3": "Захват жидкости вырос в несколько раз и возместил потерю", "p1a_2_e": "Начальная скорость захвата жидкости не изменилась: жидкость поступает путями, которые не зависят от динамина. Клетки с мутантным динамином оставались жизнеспособными больше 4 суток.", "p1a_2_w2": "Захват трансферрина зависит от отделения клатриновых носителей, а захват жидкости — нет: его начальная скорость в этих клетках не изменилась.", "p1a_2_w3": "Усиления не наблюдали: начальная скорость захвата жидкости осталась на уровне контроля.", "p1a_3_q": "Клетки эндотелия дикого типа перенесли в гипоосмотическую среду, и клетки набухают. Что произойдёт с кавеолами за первые минуты?", "p1a_3_o1": "Часть кавеол распластается, натяжение мембраны почти не изменится", "p1a_3_o2": "Кавеолы отделятся и уйдут внутрь клетки, натяжение почти не изменится", "p1a_3_o3": "Кавеолы не изменятся, а натяжение мембраны резко вырастет", "p1a_3_e": "При набухании часть кавеол распластывается: запас мембраны из впячиваний переходит в плоскую мембрану, и сила вытягивания мембранной нити почти не меняется. Это не отделение кавеол внутрь клетки: ингибитор динамина динасор потерю кавеол не предотвращает, а электронная микроскопия показывает на поверхности распластанные кавеолы.", "p1a_3_w2": "Кавеолы исчезают с поверхности не потому, что уходят внутрь: при ингибиторе динамина динасоре их потеря та же, а на поверхности видны распластанные кавеолы. Натяжение почти не растёт именно потому, что мембрана из впячиваний переходит в плоскую мембрану.", "p1a_3_w3": "Кавеолы меняются: часть их распластывается и отдаёт мембрану, поэтому у клеток дикого типа натяжение почти не растёт.", "p1a_4_q": "Клетки без кавеолина-1 перенесли в гипоосмотическую среду (150 мОсм). Что покажет измерение силы вытягивания мембранной нити?", "p1a_4_o1": "Сила резко вырастет: запаса мембраны в кавеолах нет", "p1a_4_o2": "Сила почти не изменится: запас дадут клатриновые ямки", "p1a_4_o3": "Сила почти не изменится: натяжение удержит кортикальный актин", "p1a_4_e": "В клетках Cav1−/− сила вытягивания нити выросла на 200 %, а в клетках дикого типа почти не менялась. Клатриновые ямки при набухании почти не исчезали и скачок натяжения не гасили.", "p1a_4_w2": "Клатриновые ямки при набухании почти не распластываются: их исчезало не больше одной десятой от числа исчезнувших кавеол, и скачок натяжения они не гасят.", "p1a_4_w3": "Кортикальный актин в первые минуты не перестраивался, а при разрушенном актине кавеолы по-прежнему гасили скачок натяжения; без кавеол натяжение растёт.", "s2_route": "Маршрут", "s2_r_erg": "ЭПР → комплекс Гольджи", "s2_r_intra": "между цистернами комплекса Гольджи", "s2_r_tgn": "транс-сеть Гольджи → поздняя эндосома", "s2_rm": "Убрать деталь", "s2_rm_none": "ничего", "s2_rm_coat": "белки оболочки", "s2_rm_uncoat": "снятие оболочки", "s2_rm_snare": "SNARE на носителе", "s2k_title": "Детали носителя", "s2k_slot_coat": "Оболочка", "s2k_slot_uncoat": "Снятие оболочки", "s2k_slot_snare": "SNARE на носителе", "s2k_empty": "пусто", "s2k_on": "на месте", "s2k_hint": "Перетащите деталь в гнездо или нажмите на неё. Нажатие на гнездо вынимает деталь.", "s2k_bad": "Эта деталь в это гнездо не подходит.", "s2t_status": "размеры и время условные", "s2t_note": "Этапы описаны для выделенного носителя. Порядок этапов — учебная модель; длительность и число носителей условные, не измерены.", "s2t_1": "Оболочка отбирает груз и изгибает мембрану донора.", "s2t_nocoat_1": "Нужной оболочки нет: мембрана донора не изгибается.", "s2t_2": "Носитель отделяется от мембраны донора.", "s2t_3": "Носитель сбрасывает значительную часть оболочки.", "s2t_3_erg": "Носитель сбрасывает значительную часть оболочки; разборка COP-II завершается у мишени.", "s2t_4": "Rab-белки и белки удержания закрепляют носитель у мишени: первичное узнавание.", "s2t_5": "SNARE-белки носителя и мишени обеспечивают слияние: груз в мишени.", "s2t_stop_coat": "Цикл остановился на этапе 1: без оболочки носитель не образуется.", "s2t_stop_wrong_copii": "Цикл остановился на этапе 1: в модели COP-II работает только на выходе из ЭПР; другую оболочку она не заменяет.", "s2t_stop_wrong_copi": "Цикл остановился на этапе 1: в модели COP-I на этом участке не работает и другую оболочку не заменяет.", "s2t_stop_wrong_clath": "Цикл остановился на этапе 1: в модели клатрин на этом участке не работает и другую оболочку не заменяет.", "s2t_stop_uncoat": "Цикл остановился после этапа 2: в модели оболочка не снимается, поэтому носитель не сливается с мишенью.", "s2t_stop_snare": "Цикл остановился после этапа 4: носитель удержан у мишени, но без SNARE слияния нет.", "s2_lbl_erg_d": "грЭПР", "s2_lbl_erg_t": "комплекс Гольджи", "s2_lbl_intra_d": "более поздняя цистерна", "s2_lbl_intra_t": "более ранняя цистерна", "s2_lbl_tgn_d": "транс-сеть Гольджи", "s2_lbl_tgn_t": "поздняя эндосома", "s2_lbl_dir": "направление переноса", "s2_lbl_car_none": "стадии цикла; у мишени — слияние", "s2_lbl_car_uncoat": "носители с оболочкой", "s2_lbl_car_snare": "носители у мишени", "s2_warn_coat": "носитель не образуется", "s2_warn_uncoat": "оболочка не снимается", "s2_warn_snare": "нет SNARE — нет слияния", "s2_r_coat": "Оболочка носителя", "s2_r_coat_s": "белки оболочки отбирают груз и изгибают мембрану", "s2_v_coat_copii": "COP-II", "s2_v_coat_copi": "COP-I", "s2_v_coat_clath": "клатрин (через адаптеры)", "s2_v_coat_none": "не собирается", "s2_r_car": "Носители", "s2_v_car_fused": "образуются и сливаются с мишенью", "s2_v_car_none": "не образуются", "s2_v_car_coated": "накапливаются в цитоплазме с оболочкой", "s2_v_car_docked": "накапливаются у мишени, не слившись", "s2_r_cargo": "Груз в мишени", "s2_v_cargo_delivered": "доставлен", "s2_v_cargo_donor": "нет: остаётся в доноре", "s2_v_cargo_carriers": "нет: остаётся в носителях", "s2_erg_none": "Белки, синтезированные в грЭПР, покидают его в носителях с оболочкой COP-II: оболочка отбирает груз и изгибает мембрану ЭПР, носитель отделяется и переносит белки в комплекс Гольджи. Перед слиянием носитель сбрасывает значительную часть оболочки, а слияние с мембраной-мишенью обеспечивают SNARE-белки.", "s2_erg_none_z": "Этим маршрутом большинство белков, синтезированных в грЭПР, попадает в комплекс Гольджи.", "s2_erg_coat": "Без белков оболочки COP-II мембрана ЭПР не изгибается в носитель: носители не образуются, и белки остаются в ЭПР (ЗАКЛЮЧЕНИЕ). В модели оболочка другого маршрута этот участок не заменяет: три системы оболочек обслуживают разные участки мембранной сети.", "s2_erg_coat_z": "Перенос белков секреторного пути начинается с оболочки COP-II; без неё белки не достигают комплекса Гольджи.", "s2_erg_uncoat": "Носители с оболочкой COP-II образуются и отделяются, но оболочка с них не снимается: в модели такие носители накапливаются в цитоплазме и с комплексом Гольджи не сливаются, груз в него не поступает. Основание: оболочка нужна для образования носителя и отбора груза, но мешала бы последующим взаимодействиям с мишенью, поэтому носитель сбрасывает её до слияния.", "s2_erg_uncoat_z": "Снятие оболочки — обязательный этап цикла: носитель уже несёт груз, но без этого этапа не доставляет его в мишень.", "s2_erg_snare": "Носители образуются, отделяются и сбрасывают оболочку, но без SNARE-белка на носителе с комплексом Гольджи не сливаются. Слияние носителя с мишенью обеспечивают SNARE-белки носителя (v-SNARE) и мембраны-мишени (t-SNARE). В модели носители удерживаются у мишени: первичное узнавание мишени обеспечивают Rab-белки и белки удержания.", "s2_erg_snare_z": "Слияние обеспечивают SNARE-белки обеих мембран: без SNARE на носителе груз в мишень не попадает.", "s2_intra_none": "Мембранные ферменты-резиденты комплекса Гольджи — например, гликозилтрансферазы — возвращаются из более поздних цистерн в более ранние в носителях с оболочкой COP-I. На схеме они встроены в мембрану, каталитический домен обращён в просвет. Носитель отделяется, сбрасывает оболочку и сливается с мембраной цистерны-мишени.", "s2_intra_none_z": "Как белки продвигаются от цис- к транс-стороне комплекса Гольджи, остаётся предметом дискуссии; по модели созревания цистерны сами смещаются к транс-стороне, а ферменты-резиденты возвращаются назад в везикулах COP-I.", "s2_intra_coat": "Без оболочки COP-I носители обратного транспорта между цистернами не образуются: ферменты-резиденты не возвращаются и остаются в более поздней цистерне (ЗАКЛЮЧЕНИЕ). Прямой маршрут из ЭПР в комплекс Гольджи с оболочкой COP-II в модели сохраняется.", "s2_intra_coat_z": "ЗАКЛЮЧЕНИЕ: без обратного транспорта цистерны не сохраняли бы свой набор ферментов.", "s2_intra_uncoat": "Носители с оболочкой COP-I образуются и отделяются, но оболочка с них не снимается: в модели они накапливаются в цитоплазме и с более ранней цистерной не сливаются. Основание: оболочка нужна для образования носителя и отбора груза, но мешала бы последующим взаимодействиям с мишенью, поэтому носитель сбрасывает её до слияния.", "s2_intra_uncoat_z": "Возврат ферментов останавливается на этапе снятия оболочки, хотя носители уже образовались.", "s2_intra_snare": "Носители обратного транспорта образуются и сбрасывают оболочку, но без SNARE-белка на носителе с более ранней цистерной не сливаются. Слияние носителя с мишенью обеспечивают SNARE-белки носителя (v-SNARE) и мембраны-мишени (t-SNARE). В модели носители удерживаются у мишени: первичное узнавание мишени обеспечивают Rab-белки и белки удержания.", "s2_intra_snare_z": "Слияние обеспечивают SNARE-белки обеих мембран: без SNARE на носителе груз в мишень не попадает.", "s2_tgn_none": "Из транс-сети комплекса Гольджи часть белков направляется в поздние эндосомы прямым путём — в покрытых клатрином везикулах; слияние с поздней эндосомой обеспечивают SNARE-белки везикулы и мембраны-мишени. Клатрин образует носители на плазматической мембране и в транс-сети комплекса Гольджи.", "s2_tgn_none_z": "Так в поздние эндосомы, минуя плазматическую мембрану, попадают мембранные белки лизосом; на схеме они встроены в мембрану донора, носителя и мишени.", "s2_tgn_coat": "Без клатрина покрытые везикулы в транс-сети комплекса Гольджи не образуются: белки, которые идут в поздние эндосомы прямым путём, остаются в комплексе Гольджи (ЗАКЛЮЧЕНИЕ).", "s2_tgn_coat_z": "ЗАКЛЮЧЕНИЕ: одна и та же оболочка — клатрин — работает на двух участках сети: на плазматической мембране и в транс-сети комплекса Гольджи.", "s2_tgn_uncoat": "Покрытые клатрином везикулы отделяются от транс-сети комплекса Гольджи, но оболочка с них не снимается: в модели они накапливаются в цитоплазме и с поздней эндосомой не сливаются. Основание: оболочка нужна для образования носителя и отбора груза, но мешала бы последующим взаимодействиям с мишенью, поэтому носитель сбрасывает её до слияния.", "s2_tgn_uncoat_z": "Снятие оболочки — обязательный этап цикла на любом участке мембранной сети.", "s2_tgn_snare": "Везикулы отделяются и сбрасывают оболочку, но без SNARE-белка на носителе с поздней эндосомой не сливаются. Слияние носителя с мишенью обеспечивают SNARE-белки носителя (v-SNARE) и мембраны-мишени (t-SNARE). В модели носители удерживаются у мишени: первичное узнавание мишени обеспечивают Rab-белки и белки удержания.", "s2_tgn_snare_z": "Слияние обеспечивают SNARE-белки обеих мембран: без SNARE на носителе груз в мишень не попадает.", "s2b_take": "Цикл носителя на разных участках мембранной сети устроен одинаково: оболочка отбирает груз и изгибает мембрану, носитель отделяется, сбрасывает оболочку, узнаёт мишень и сливается с ней с помощью SNARE-белков; после слияния SNARE-комплекс разбирается АТФазой NSF. Различаются белки оболочки: COP-II — на выходе из ЭПР, COP-I — в обратном транспорте в ЭПР и между цистернами комплекса Гольджи, клатрин — на плазматической мембране и в транс-сети комплекса Гольджи. ЗАКЛЮЧЕНИЕ: если выключить белок, нужный на одном этапе, цикл останавливается на этом этапе, и груз не доходит до мишени.", "p2b_1_q": "Ферменты-резиденты комплекса Гольджи возвращаются из более поздних цистерн в более ранние в носителях с оболочкой COP-I. Что будет с этими ферментами, если белки оболочки COP-I не собираются?", "p2b_1_o1": "Они не вернутся и останутся в более поздней цистерне", "p2b_1_o2": "Они вернутся в носителях с оболочкой COP-II", "p2b_1_o3": "Они вернутся через цитоплазму, без носителей", "p2b_1_e": "COP-I обеспечивает ретроградный транспорт между цистернами комплекса Гольджи. Без этой оболочки носители не образуются, и ферменты-резиденты остаются в более поздней цистерне (ЗАКЛЮЧЕНИЕ).", "p2b_1_w2": "COP-II образует носители на мембране ЭПР и переносит груз в прямом направлении — из ЭПР в комплекс Гольджи; обратного транспорта между цистернами он не обеспечивает.", "p2b_1_w3": "Белки просвета и мембраны цистерн отделены от цитоплазмы мембраной; между компартментами их переносят мембранные носители.", "p2b_2_q": "Покрытые клатрином везикулы отделяются от транс-сети комплекса Гольджи, но оболочка с них не снимается. Дойдёт ли их груз до поздней эндосомы?", "p2b_2_o1": "Нет: покрытые везикулы останутся в цитоплазме", "p2b_2_o2": "Да: оболочка снимется при слиянии с эндосомой", "p2b_2_o3": "Нет: везикулы не отделятся от транс-сети", "p2b_2_e": "Клатриновая оболочка быстро сбрасывается, и только после этого везикула может слиться с мембраной-мишенью. Если оболочка не снимается, покрытые везикулы остаются в цитоплазме, и груз до поздней эндосомы не доходит (ЗАКЛЮЧЕНИЕ).", "p2b_2_w2": "Порядок этапов обратный: сначала оболочка снимается, и только после этого везикула может слиться с мембраной-мишенью.", "p2b_2_w3": "В условии везикулы уже отделились; нарушен следующий этап — снятие оболочки.", "p2b_3_q": "Носитель из ЭПР в комплекс Гольджи покрыт оболочкой COP-II. Какой оболочкой покрыт носитель, который возвращает ферменты-резиденты из более поздней цистерны комплекса Гольджи в более раннюю?", "p2b_3_o1": "COP-I", "p2b_3_o2": "COP-II, как на выходе из ЭПР", "p2b_3_o3": "Клатрином", "p2b_3_e": "Ретроградный транспорт между цистернами комплекса Гольджи, как и возврат белков в грЭПР, обеспечивает оболочка COP-I. Этапы цикла те же, различаются белки оболочки.", "p2b_3_w2": "COP-II образует носители только на выходе из грЭПР — в прямом направлении.", "p2b_3_w3": "Клатрин образует носители на плазматической мембране и в транс-сети комплекса Гольджи, а не между цистернами.", "s2a_nem": "Мембраны обработаны N-этилмалеимидом (NEM), цитозоль без активного NSF", "s2a_nsf": "Добавлен очищенный NSF", "s2a_lbl_donor": "донорная стопка Гольджи", "s2a_lbl_acc": "акцепторная стопка Гольджи", "s2a_lbl_vsvg": "перенос мембранного белка G (жёлтый)", "s2a_lbl_nsf_on": "NSF разбирает SNARE-комплекс после слияния", "s2a_lbl_nsf_off": "NSF не работает: SNARE-комплексы остаются собранными", "s2a_lbl_nem": "NEM: перенос почти не идёт", "s2a_lbl_nem_nsf": "NEM + очищенный NSF: перенос восстановлен", "s2a_r_tr": "Перенос белка G между стопками Гольджи", "s2a_r_tr_s": "присоединение [3H]GlcNAc в акцепторных мембранах", "s2a_v_tr_ctrl": "контроль", "s2a_v_tr_none": "почти не идёт", "s2a_v_tr_back": "восстановлен", "s2a_r_cis": "SNARE-комплексы после слияния", "s2a_r_cis_s": "обобщение данных литературы", "s2a_v_cis_free": "разбираются, SNARE снова свободны", "s2a_v_cis_stuck": "остаются собранными (ЗАКЛЮЧЕНИЕ)", "s2a_r_cat": "Один комплекс NSF", "s2a_r_cat_s": "оценка авторов, заведомо заниженная", "s2a_v_cat": "обслуживает не менее трёх носителей", "s2a_cap_ctrl": "Бесклеточная система: мембраны комплекса Гольджи, цитозоль и АТФ. Донорные мембраны получены из клеток CHO, заражённых вирусом везикулярного стоматита, акцепторные — из незаражённых клеток; перенос вирусного белка G из цис- в медиальный компартмент измеряют по присоединению [3H]GlcNAc к белку G. После слияния SNARE-белки оказываются собранными в одной мембране; NSF вместе с α-SNAP разбирает эти комплексы, затрачивая АТФ, и SNARE снова готовы к слиянию.", "s2a_cap_ctrl_z": "Слияние связывает свободные SNARE-белки в собранный комплекс; его разборка возвращает SNARE в работу.", "s2a_cap_nem": "Мембраны обработали N-этилмалеимидом (1 мМ, 0 °C, 15 мин) и добавили цитозоль без активного NSF: перенос белка G почти не идёт. ЗАКЛЮЧЕНИЕ по обзору литературы: без NSF SNARE-комплексы после слияния остаются собранными, свободных SNARE не остаётся, и новые носители не сливаются.", "s2a_cap_nem_z": "N-этилмалеимид модифицирует остатки цистеина многих белков; что именно он выключил, показывает следующий эксперимент — добавление очищенного NSF.", "s2a_cap_nem_cis": "Если NSF не работает, SNARE-комплексы, собранные при слиянии, не разбираются: одиночные SNARE-белки в одной мембране неактивны, и новые носители сливаться не могут. ЗАКЛЮЧЕНИЕ модели: в мембранах накапливаются собранные комплексы, а свободных SNARE не остаётся.", "s2a_cap_nem_cis_z": "Слияние не только требует SNARE-белков, но и расходует их; без разборки комплексов цикл носителя останавливается после первых слияний.", "s2a_cap_nsf": "К обработанным N-этилмалеимидом мембранам добавили очищенный NSF: перенос белка G восстановился. По оценке авторов, один комплекс NSF обеспечивает перенос не менее чем трёх носителей — NSF действует каталитически, а не расходуется.", "s2a_cap_nsf_z": "Восстановление очищенным белком указывает, какой из белков, чувствительных к N-этилмалеимиду, нужен для переноса: добавления NSF достаточно, чтобы вернуть перенос в системе, где все остальные компоненты сохранены. Достаточен ли NSF для переноса сам по себе, этот эксперимент не проверяет.", "s2a_take": "Слияние носителя с мишенью связывает SNARE-белки в комплексы: после слияния они остаются собранными в одной мембране. АТФаза NSF вместе с α-SNAP разбирает эти комплексы и возвращает SNARE в работу. Мембраны комплекса Гольджи, обработанные N-этилмалеимидом, переносят белок только после добавления очищенного NSF, и один комплекс NSF обслуживает несколько носителей.", "p2a_1_q": "Мембраны комплекса Гольджи обработали N-этилмалеимидом и добавили цитозоль без активного NSF. Что произойдёт с переносом белка G между стопками?", "p2a_1_o1": "Перенос почти прекратится", "p2a_1_o2": "Перенос не изменится: SNARE-белки на мембранах сохранились", "p2a_1_o3": "Перенос ускорится: SNARE-комплексы будут дольше оставаться собранными", "p2a_1_e": "После обработки N-этилмалеимидом мембраны Гольджи переносят белок G только при добавлении активного NSF.", "p2a_1_w2": "Наличия SNARE-белков недостаточно: после каждого слияния их нужно освободить из собранных комплексов, а это делает NSF.", "p2a_1_w3": "Собранный после слияния комплекс уже не сближает мембраны: для нового слияния SNARE-белки должны быть свободными, поэтому без NSF перенос не ускоряется, а останавливается.", "p2a_2_q": "Что происходит со SNARE-комплексами после слияния, если NSF не работает?", "p2a_2_o1": "Они остаются собранными, и свободных SNARE для новых слияний не остаётся", "p2a_2_o2": "Они распадаются сами, и слияния продолжаются", "p2a_2_o3": "Они переходят в мембрану следующего носителя и сливают его с мишенью", "p2a_2_e": "После слияния все SNARE-белки комплекса оказываются в одной мембране; разбирает такие комплексы АТФаза NSF вместе с α-SNAP, возвращая SNARE в работу. ЗАКЛЮЧЕНИЕ: без NSF собранные комплексы накапливаются, а свободных SNARE не остаётся.", "p2a_2_w2": "SNARE-комплекс очень стабилен: для его разборки нужна АТФаза NSF и энергия АТФ.", "p2a_2_w3": "После слияния SNARE-белки находятся в одной мембране в составе собранного комплекса, и сам по себе комплекс в мембрану другого носителя не переходит. Чтобы SNARE снова участвовали в слиянии, комплекс должен разобрать NSF вместе с α-SNAP.", "p2a_3_q": "К обработанным N-этилмалеимидом мембранам добавили очищенный NSF. Что произойдёт?", "p2a_3_o1": "Перенос восстановится, и одного комплекса NSF хватит на несколько носителей", "p2a_3_o2": "Перенос не восстановится: N-этилмалеимид необратимо повредил мембраны", "p2a_3_o3": "Перенос восстановится, только если добавить по одному комплексу NSF на каждый носитель", "p2a_3_e": "Очищенный NSF восстановил перенос белка G; по оценке авторов, один комплекс NSF обеспечивает перенос не менее чем трёх носителей, то есть действует каталитически.", "p2a_3_w2": "Перенос восстанавливается одним добавленным белком — NSF; значит, остальные компоненты мембран после обработки сохранили работоспособность.", "p2a_3_w3": "NSF не расходуется на каждый носитель: он разбирает комплекс и освобождается для следующего, поэтому одного комплекса NSF хватает на несколько носителей.", "s3_dis": "Лиганд в ранней эндосоме", "s3_dis_y": "отделяется от рецептора", "s3_dis_n": "остаётся связанным", "s3_rec": "Рецептор после ранней эндосомы", "s3_rec_back": "возвращается на поверхность", "s3_rec_lyso": "направлен в лизосому", "s3t_status": "размеры и время условные", "s3t_note": "Этапы описаны для выделенного рецептора. Порядок этапов — учебная модель; длительность и число молекул условные, не измерены.", "s3t_r1_1": "Рецепторы со связанным лигандом находятся в мембране ранней эндосомы.", "s3t_r1_2": "В ранней эндосоме лиганд отделяется от рецептора; этому часто способствует кислая среда.", "s3t_r1_3": "От ранней эндосомы отпочковывается везикула с рецептором.", "s3t_r1_4": "Рецептор возвращается на поверхность клетки и снова связывает лиганд.", "s3t_r1_5": "Лиганд остаётся в эндосоме, которая созревает в позднюю.", "s3t_r1_6": "Поздняя эндосома сливается с лизосомой; лиганд расщепляется.", "s3t_r2_1": "Рецепторы со связанным лигандом находятся в мембране ранней эндосомы.", "s3t_r2_2": "Лиганд не отделяется от рецептора.", "s3t_r2_3": "От ранней эндосомы отпочковывается везикула с комплексом.", "s3t_r2_4": "Комплекс возвращается на поверхность клетки; отделится ли там лиганд, зависит от свойств комплекса.", "s3t_r3_1": "Рецепторы со связанным лигандом и меткой — убиквитином — находятся в мембране ранней эндосомы.", "s3t_r3_2": "Лиганд остаётся связанным; убиквитин не даёт рецептору вернуться на поверхность.", "s3t_r3_3": "Комплекс включается в мембрану внутрипросветных везикул: лиганд обращён в просвет эндосомы.", "s3t_r3_4": "Эндосома созревает в позднюю: мультивезикулярное тельце.", "s3t_r3_5": "Поздняя эндосома сливается с лизосомой; рецептор и лиганд расщепляются.", "s3t_rx_1": "Рецепторы со связанным лигандом находятся в мембране ранней эндосомы.", "s3t_rx_2": "Лиганд отделяется от рецептора.", "s3t_rx_3": "Условное сочетание: рецептор не возвращается на поверхность и остаётся в мембране эндосомы.", "s3t_rx_4": "Эндосома созревает в позднюю; свободный лиганд остаётся в просвете.", "s3t_rx_5": "Поздняя эндосома сливается с лизосомой; в модели рецептор и лиганд расщепляются порознь.", "s3_lbl_ee": "ранняя эндосома", "s3_lbl_le": "поздняя эндосома", "s3_lbl_ly": "лизосома", "s3_lbl_back": "везикула возврата", "s3_lbl_release": "комплекс вернулся на поверхность", "s3_lbl_fewer": "рецепторов на поверхности меньше", "s3_lbl_dis": "лиганд отделился от рецептора", "s3_lbl_nodis": "лиганд связан с рецептором", "s3_r_route": "Путь", "s3_r_route_s": "рецептор и лиганд после ранней эндосомы", "s3_v_route_r1": "рециркуляция рецептора, деградация лиганда", "s3_v_route_r2": "рециркуляция рецептора и лиганда", "s3_v_route_r3": "деградация рецептора и лиганда", "s3_v_route_rx": "сочетание модели", "s3_r_lig": "Лиганд", "s3_v_lig_lyso": "расщепляется в лизосоме", "s3_v_lig_surface": "возвращается на поверхность", "s3_v_lig_lyso_rec": "расщепляется в лизосоме вместе с рецептором", "s3_r_rec": "Рецептор", "s3_v_rec_surface": "возвращается на поверхность", "s3_v_rec_lyso": "расщепляется в лизосоме", "s3_r_cyc": "Сколько раз работает одна молекула рецептора", "s3_r_cyc_s": "ЗАКЛЮЧЕНИЕ", "s3_v_cyc_many": "много раз", "s3_v_cyc_once": "один раз", "s3_y_back": "В ранней эндосоме лиганд отделяется от рецептора; рецептор возвращается на поверхность клетки в везикулах, отпочковывающихся от ранней эндосомы, а лиганд остаётся в эндосоме, которая созревает в позднюю, и расщепляется в лизосоме. Это самый частый путь. Отделению лиганда часто способствует кислая среда эндосомы.", "s3_y_back_z": "Рецептор возвращается и снова связывает лиганд, поэтому клетка может постоянно и избирательно захватывать нужное вещество.", "s3_n_back": "Лиганд не отделяется от рецептора в ранней эндосоме, и комплекс возвращается на поверхность клетки. Отделится ли там лиганд, зависит от свойств комплекса: например, апотрансферрин при нейтральном pH поверхности отделяется от рецептора (продвинутый уровень этой вкладки).", "s3_n_back_z": "Лиганд не расщепляется и возвращается к поверхности вместе с рецептором; как такой путь работает у трансферрина, показывает продвинутый уровень этой вкладки.", "s3_n_lyso": "Лиганд остаётся связанным с рецептором, а рецептор несёт метку — убиквитин, которая не даёт ему вернуться на поверхность и направляет его на расщепление. Комплекс, например фактор роста EGF с рецептором, включается в мембрану внутрипросветных везикул мультивезикулярного тельца (лиганд обращён в просвет эндосомы) и разрушается в лизосоме.", "s3_n_lyso_z": "Рецептор расщепляется вместе с лигандом и проходит цикл один раз (ЗАКЛЮЧЕНИЕ).", "s3_y_lyso": "Лиганд отделяется, а рецептор направлен в лизосому: в модели оба расщепляются в лизосоме порознь. Это сочетание модели: его показывают, чтобы сравнить два события в ранней эндосоме по отдельности (ЗАКЛЮЧЕНИЕ модели). Предполагаем, что свободный лиганд остаётся в просвете и направляется на расщепление; другие маршруты не рассматриваются.", "s3_y_lyso_z": "В модели отделение лиганда и направление рецептора задаются раздельно, поэтому их вклад можно сравнить; в клетке эти события могут быть связаны.", "s3b_take": "Путь рецептора и лиганда определяется двумя событиями: отделяется ли лиганд от рецептора в ранней эндосоме и куда направлен рецептор — назад на поверхность или в лизосому. Отсюда три пути: рециркуляция рецептора и деградация лиганда; рециркуляция обоих; деградация обоих; кроме того, перенос через клетку — трансцитоз. ЗАКЛЮЧЕНИЕ: рецептор, который возвращается на поверхность, проходит цикл много раз; рецептор, который расщепляется вместе с лигандом, — один раз.", "p3b_1_q": "Лиганд обычно отделяется от рецептора в ранней эндосоме. Что произойдёт с ним, если он останется связанным, а рецептор, как и прежде, вернётся на поверхность?", "p3b_1_o1": "Лиганд вернётся на поверхность вместе с рецептором", "p3b_1_o2": "Лиганд расщепится в лизосоме, а рецептор вернётся без него", "p3b_1_o3": "Лиганд и рецептор останутся в ранней эндосоме", "p3b_1_e": "Связанный лиганд следует за рецептором: если рецептор возвращается из ранней эндосомы на поверхность, лиганд возвращается вместе с ним. Так ведут себя некоторые лиганды, чаще белки-переносчики: их комплекс с рецептором распадается только на поверхности клетки. Отделится ли там лиганд, который в норме отделяется в эндосоме, из условия не следует: это зависит от свойств конкретной пары лиганда и рецептора.", "p3b_1_w2": "Чтобы лиганд попал в лизосому, а рецептор вернулся без него, они должны разойтись в ранней эндосоме; связанный лиганд следует за рецептором.", "p3b_1_w3": "Ранняя эндосома — сортировочный компартмент: из неё содержимое уходит либо назад на поверхность, либо в поздние эндосомы; накопления в ней модель не предполагает.", "p3b_2_q": "Рецептор с прочно связанным лигандом получил метку — убиквитин, которая направляет его на расщепление в лизосоме. Где окажутся рецептор и лиганд?", "p3b_2_o1": "Рецептор войдёт в мембрану внутрипросветных везикул, связанный лиганд будет обращён в просвет эндосомы; затем оба расщепятся в лизосоме", "p3b_2_o2": "Рецептор вернётся на поверхность, лиганд расщепится в лизосоме", "p3b_2_o3": "Оба вернутся на поверхность клетки", "p3b_2_e": "Убиквитинированный рецептор вместе со связанным лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца: хвост рецептора оказывается внутри везикулы, а лиганд остаётся обращённым в просвет эндосомы. Затем оба разрушаются в лизосоме. Рецептор не возвращается на поверхность, поэтому без синтеза новых рецепторов захват лиганда снижается (ЗАКЛЮЧЕНИЕ).", "p3b_2_w2": "Чтобы рецептор вернулся без лиганда, они должны разойтись в ранней эндосоме; убиквитинированный рецептор с прочно связанным лигандом направляется в лизосому вместе с ним.", "p3b_2_w3": "Метка убиквитином направляет рецептор на расщепление, а не на возврат.", "p3b_3_q": "Измените условие модели: лиганд отделяется от рецептора в ранней эндосоме, но сам рецептор направлен не на поверхность, а в лизосому. Где окажутся рецептор и лиганд?", "p3b_3_o1": "Оба расщепятся в лизосоме, но порознь", "p3b_3_o2": "Рецептор вернётся на поверхность, лиганд расщепится", "p3b_3_o3": "Оба вернутся на поверхность клетки", "p3b_3_e": "Отделившийся лиганд остаётся в созревающей эндосоме и расщепляется в лизосоме; рецептор, направленный в лизосому, тоже расщепляется — оба разрушаются порознь (ЗАКЛЮЧЕНИЕ модели). В модели отделение лиганда и сортировка рецептора задаются раздельно, чтобы сравнить их по отдельности; в клетке эти события могут быть связаны.", "p3b_3_w2": "В условии рецептор направлен не на поверхность, а в лизосому: на поверхность он не вернётся.", "p3b_3_w3": "Лиганд отделился от рецептора в ранней эндосоме и с везикулой возврата не уходит; кроме того, и рецептор в этом условии не возвращается.", "s3a_exp": "Эксперимент", "s3a_exp_tf": "трансферрин и pH", "s3a_exp_snx": "возврат GLUT1", "s3a_lig": "Лиганд на поверхности клеток", "s3a_lig_holo": "трансферрин с железом", "s3a_lig_apo": "апотрансферрин (без железа)", "s3a_lig_asor": "асиалоорозомукоид", "s3a_ph": "pH среды", "s3a_ph_7": "нейтральный (7,0–7,3)", "s3a_ph_5": "кислый (5,0–5,4)", "s3a_kd": "Подавлен белок", "s3a_kd_none": "нет (контроль)", "s3a_kd_snx27": "SNX27", "s3a_kd_vps35": "VPS35 (ретромер)", "s3a_glut": "GLUT1", "s3a_glut_full": "полный", "s3a_glut_dpdz": "без трёх концевых аминокислот", "s3a_lbl_ph7": "среда с нейтральным pH (как снаружи клетки)", "s3a_lbl_ph5": "среда с кислым pH (как в эндосоме)", "s3a_lbl_tfr": "рецепторы на поверхности клеток HepG2", "s3a_lbl_bound": "лиганд связан с рецептором", "s3a_lbl_free": "лиганд отделяется от рецептора", "s3a_lbl_lamp": "лизосома (LAMP1)", "s3a_lbl_retromer": "SNX27–ретромер на эндосоме", "s3a_lbl_kd_snx27": "SNX27 подавлен", "s3a_lbl_kd_vps35": "VPS35 подавлен", "s3a_lbl_dpdz": "у GLUT1 нет концевого PDZ-лиганда", "s3a_r_bound": "Связь лиганда с рецептором", "s3a_r_bound_s": "клетки HepG2; полупериоды — при 37 °C", "s3a_v_bound_holo_7": "связан; отделяется медленно (полупериод 7,5 мин)", "s3a_v_bound_holo_5": "связан", "s3a_v_bound_apo_5": "связан, как трансферрин с железом при pH 7", "s3a_v_bound_apo_7": "отделяется быстро (полупериод 16 с)", "s3a_v_bound_asor_7": "связан", "s3a_v_bound_asor_5": "отделяется", "s3a_r_iron": "Железо", "s3a_r_iron_s": "в присутствии хелатора железа", "s3a_v_iron_bound": "связано с трансферрином", "s3a_v_iron_released": "освобождается (полупериод 1,5 мин)", "s3a_v_iron_none": "—", "s3a_r_glut": "Где находится GLUT1", "s3a_r_glut_s": "переносчик глюкозы; иммунофлуоресценция", "s3a_v_glut_pm": "на плазматической мембране", "s3a_v_glut_lyso": "в лизосомах (LAMP1)", "s3a_r_glc": "Захват глюкозы", "s3a_r_glc_s": "меченая 2-дезоксиглюкоза, 10 мин", "s3a_v_glc_ctrl": "контроль", "s3a_v_glc_low": "ниже более чем на 60 %", "s3a_v_glc_nm": "не измеряли", "s3a_r_tfr": "Рецептор трансферрина на поверхности", "s3a_r_tfr_s": "протеомика поверхности", "s3a_v_tfr_same": "не изменился", "s3a_v_tfr_less": "в 1,5 раза меньше, не расщепляется", "s3a_tf_holo_7": "Трансферрин с железом связан с рецептором на поверхности (клетки гепатомы человека HepG2). При нейтральном pH и 37 °C он отделяется от рецептора медленно, с полупериодом 7,5 мин.", "s3a_tf_holo_7_z": "Так трансферрин доставляет железо: он связывается с рецептором снаружи и вместе с ним уходит в эндосому.", "s3a_tf_holo_5": "При кислом pH, как в эндосоме, трансферрин остаётся связанным с рецептором (при pH от 4,5 до 7,5; измерено при 4 °C, сходный результат — при 37 °C), а железо от него отделяется: при pH 5 и 37 °C в присутствии хелатора — с полупериодом около 1,5 мин.", "s3a_tf_holo_5_z": "Кислая среда отделяет от трансферрина не рецептор, а железо: железо остаётся в клетке, а белок — на рецепторе.", "s3a_tf_apo_5": "При pH 5,4 апотрансферрин (без железа) связывается с рецептором так же прочно и в том же количестве, как трансферрин с железом при pH 7,0.", "s3a_tf_apo_5_z": "В кислой эндосоме апотрансферрин остаётся на рецепторе и вместе с ним возвращается к поверхности.", "s3a_tf_apo_7": "При нейтральном pH апотрансферрин быстро отделяется от рецептора: при 37 °C с полупериодом 16 с, в 30–40 раз быстрее, чем трансферрин с железом.", "s3a_tf_apo_7_z": "Вернувшись на поверхность, рецептор отдаёт апотрансферрин в среду и освобождается для нового трансферрина с железом.", "s3a_tf_asor_7": "Асиалоорозомукоид (белок крови без концевых остатков сиаловой кислоты) при нейтральном pH связан со своим рецептором на клетках HepG2.", "s3a_tf_asor_7_z": "Для сравнения взят лиганд, который после эндоцитоза расщепляется в клетке.", "s3a_tf_asor_5": "При кислом pH асиалоорозомукоид, как и инсулин, отделяется от своего рецептора, а трансферрин в тех же условиях остаётся связанным.", "s3a_tf_asor_5_z": "Кислая среда эндосомы отделяет многие лиганды от рецепторов; трансферрин — исключение, и поэтому он возвращается на поверхность.", "s3a_snx_none_full": "Клетки HeLa, контроль: переносчик глюкозы GLUT1 находится на плазматической мембране. После эндоцитоза его возвращает из ранней эндосомы комплекс SNX27–ретромер, который связывает короткий концевой участок GLUT1 — PDZ-лиганд.", "s3a_snx_none_full_z": "Возврат из эндосомы удерживает GLUT1 на поверхности, и клетка поглощает глюкозу.", "s3a_snx_snx27_full": "Подавлен SNX27: GLUT1 почти полностью оказывается в LAMP1-положительных лизосомах и расщепляется быстрее; захват глюкозы снижается более чем на 60 %. Рецептор трансферрина при этом не меняется.", "s3a_snx_snx27_full_z": "Без SNX27 GLUT1 не возвращается из эндосомы и уходит на расщепление, хотя сам белок не изменён.", "s3a_snx_vps35_full": "Подавлен VPS35 — субъединица ретромера: GLUT1 уходит в лизосомы, захват глюкозы снижается более чем на 60 %. Рецептора трансферрина на поверхности в 1,5 раза меньше, но он не расщепляется.", "s3a_snx_vps35_full_z": "Ретромер нужен для возврата многих белков поверхности: при его подавлении с поверхности уходят 152 мембранных белка.", "s3a_snx_none_dpdz": "GLUT1 без трёх концевых аминокислот (без PDZ-лиганда) в контрольных клетках оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на плазматической мембране; захват глюкозы в этом эксперименте не измеряли.", "s3a_snx_none_dpdz_z": "Удаление сигнала возврата на самом грузе даёт тот же результат, что и подавление белка, который этот сигнал узнаёт.", "s3a_snx_snx27_dpdz": "Сочетание подавленного SNX27 и GLUT1 без PDZ-лиганда в работе не изучали. В модели GLUT1 попадает в лизосомы: возврат нарушен и со стороны груза, и со стороны белка, узнающего сигнал (ЗАКЛЮЧЕНИЕ модели).", "s3a_snx_snx27_dpdz_z": "Сочетание показано для сравнения; данных о нём нет.", "s3a_snx_vps35_dpdz": "Сочетание подавленного VPS35 и GLUT1 без PDZ-лиганда в работе не изучали. В модели GLUT1 попадает в лизосомы (ЗАКЛЮЧЕНИЕ модели).", "s3a_snx_vps35_dpdz_z": "Сочетание показано для сравнения; данных о нём нет.", "s3a_take": "Два эксперимента уточняют базовую модель. Трансферрин — пример лиганда, который не отделяется от рецептора в эндосоме: кислая среда отделяет от него железо, а апотрансферрин отделяется от рецептора только при нейтральном pH на поверхности. Возврат рецептора из ранней эндосомы требует сигнала на самом белке и белков, которые его узнают: без PDZ-лиганда или без SNX27–ретромера GLUT1 уходит в лизосомы.", "p3a_1_q": "Трансферрин с железом связан с рецептором. Среду подкислили до pH 5, как в эндосоме (в присутствии хелатора железа). Что произойдёт?", "p3a_1_o1": "Железо отделится от трансферрина, а трансферрин останется на рецепторе", "p3a_1_o2": "Трансферрин вместе с железом отделится от рецептора", "p3a_1_o3": "Ничего не изменится: и железо, и трансферрин останутся на месте", "p3a_1_e": "При pH 5 в присутствии хелатора железо отделяется от трансферрина, связанного с рецептором (полупериод около 1,5 мин при 37 °C), а сам белок — теперь апотрансферрин — остаётся на рецепторе. Трансферрин, связанный с рецептором при нейтральном pH, не отделялся при последующей обработке растворами с pH от 4,5 до 7,5 (4 °C, с хелатором железа; сходный результат — при 37 °C).", "p3a_1_w2": "Многие лиганды в кислой среде действительно отделяются от рецепторов (например, асиалоорозомукоид), но трансферрин остаётся связанным; отделяется только железо.", "p3a_1_w3": "Связь железа с т
