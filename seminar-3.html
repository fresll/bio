    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,

    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {

    return `<g transform="rotate(${rot} ${f(x)} ${f(y)})"><line x1="${f(x)}" y1="${f(y)}" x2="${f(x)}" y2="${f(y + 9 * s)}" stroke="${X.igg}" stroke-width="${f(3.2 * s)}" stroke-linecap="round"/>` +
      `<line x1="${f(x)}" y1="${f(y)}" x2="${f(x - 6 * s)}" y2="${f(y - 7 * s)}" stroke="${X.igg}" stroke-width="${f(3.2 * s)}" stroke-linecap="round"/><line x1="${f(x)}" y1="${f(y)}" x2="${f(x + 6 * s)}" y2="${f(y - 7 * s)}" stroke="${X.igg}" stroke-width="${f(3.2 * s)}" stroke-linecap="round"/></g>`;
  }
  /* ЛПНП: жёлтая частица с оболочкой */
  const ldl = (x, y, r = 6.5) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${X.ldl}" stroke="#8a6d00" stroke-width="1.6" stroke-dasharray="2 1.4"/>`;
  /* трансферрин (жёлтый) с ионом железа (красная точка) */
  const tfn = (x, y, fe = true) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` + (fe ? `<circle cx="${f(x + 3.5)}" cy="${f(y - 3.5)}" r="2.3" fill="${C.red}"/>` : '');
  /* PCSK9 (розовый) и ингибитор (маленький тёмный ромб) */
  const pcsk9 = (x, y) => `<path d="M${f(x - 6)},${f(y)} q6,-8 12,0 q-6,8 -12,0 z" fill="${X.pcsk9}" stroke="#8c2c5e" stroke-width=".9"/>`;
  const inhib = (x, y) => `<path d="M${f(x)},${f(y - 4)} l4,4 l-4,4 l-4,-4 z" fill="#3B2F63"/>`;
  /* SNX17: FERM-домен (бирюзовый) с C-концевым участком: closed — участок в бороздке */
  function snx17(x, y, open, k = 1) {
    const tail = open ? `<path d="M${f(x + 8)},${f(y + 2)} q14,6 22,-6" fill="none" stroke="${X.snx17}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${f(x + 30)}" cy="${f(y - 4)}" r="2.6" fill="${X.snx17}"/>`
      : `<path d="M${f(x + 8)},${f(y + 2)} q-4,-10 -8,-6" fill="none" stroke="${X.snx17}" stroke-width="2.4" stroke-linecap="round"/>`;
    return `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7.5" fill="${X.snx17}" opacity=".9"/>` + `<path d="M${f(x - 4)},${f(y - 7.5)} q4,5 8,0" fill="var(--surface)"/>` + tail;
  }
  /* синаптический пузырёк с медиатором */
  function synves(cx, cy, R, nglu = 5) { let s = `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(R)}" fill="#fff"/>` + thinMem(BF.circlePts(cx, cy, R, 48), true, 3.2);
    for (let i = 0; i < nglu; i++) { const a = i / nglu * 2 * Math.PI + .4, r = R * .38; s += `<circle cx="${f(cx + r * Math.cos(a))}" cy="${f(cy + r * Math.sin(a))}" r="1.9" fill="${X.glu}" stroke="#8a6d00" stroke-width=".5"/>`; }
    return s; }
  /* капсид ВИЧ-1: конус (fill), геном — волнистая линия */
  function capsid(cx, cy, L, Wb, ang = 90, open = 0) {
    const r1 = Wb / 2, r2 = Wb * .2, a = ang * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
    const P = (t, w) => [cx + ux * L * (t - .5) + nx * w, cy + uy * L * (t - .5) + ny * w], rad = t => r2 + (r1 - r2) * t;
    const top = [], bot = [];
    for (let i = 0; i <= 24; i++) { const t = .08 + .84 * i / 24; top.push(P(t, rad(t))); bot.push(P(t, -rad(t))); }
    const capW = [], capN = [];
    for (let i = 1; i < 12; i++) { const q = Math.PI / 2 - Math.PI * i / 12, rr = rad(.92); capW.push([P(.92, 0)[0] + ux * rr * .55 * Math.cos(q) + nx * rr * Math.sin(q), P(.92, 0)[1] + uy * rr * .55 * Math.cos(q) + ny * rr * Math.sin(q)]); }
    for (let i = 1; i < 12; i++) { const q = -Math.PI / 2 + Math.PI * i / 12, rr = rad(.08); capN.push([P(.08, 0)[0] - ux * rr * 1.2 * Math.cos(q) + nx * rr * Math.sin(-q) * -1, P(.08, 0)[1] - uy * rr * 1.2 * Math.cos(q) + ny * rr * Math.sin(-q) * -1]); }
    const out = top.concat(capW, bot.reverse(), capN);
    let s = `<path d="M${out.map(q => f(q[0]) + ',' + f(q[1])).join(' L')} z" fill="#F4E3EC" stroke="${X.hiv}" stroke-width="2.4"${open ? ' stroke-dasharray="9 4"' : ''}/>`;
    const G = []; for (let i = 0; i <= 24; i++) { const t = .2 + .65 * i / 24; G.push(P(t, rad(t) * .45 * Math.sin(i * 1.3))); }
    return s + poly(G, { c: '#C0392B', w: 1.4 });
  }

  /* рецептор, груз и адаптер отдельными группами (у каждой своя справка); геометрия как у BF.recAt */
  function recSplit(x, y, th, depth = 13) {
    const top = y - depth, R = s => `<g transform="rotate(${f(th)} ${f(x)} ${f(y)})">${s}</g>`;
    return pk('receptor', R(`<line x1="${f(x)}" y1="${f(y + 10)}" x2="${f(x)}" y2="${f(top)}" stroke="${C.rec}" stroke-width="3.6" stroke-linecap="round"/><path d="M${f(x - 6)},${f(top)} Q${f(x)},${f(top + 8)} ${f(x + 6)},${f(top)}" fill="none" stroke="${C.rec}" stroke-width="3.6" stroke-linecap="round"/>`)) +
      pk('ligand', R(`<circle cx="${f(x)}" cy="${f(top - 1)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`)) +
      pk('adapter', R(`<line x1="${f(x)}" y1="${f(y + 12)}" x2="${f(x)}" y2="${f(y + 20)}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`));
  }
  /* ===================== кадры моделей ===================== */
  const M = {};
  /* ---------- 1М: изгиб решётки клатрина ----------
     st: { th (°, 0–180), R (нм) или Infinity, A (нм²), frac (доля собранной решётки, 0–1), dyn (0–1) }; L — подписи */
  M.coatSection = function (st, o) {
    const c = o.c || 300, y0 = o.y0 || 86, k = o.k || 0.7;   /* k — пикселей на нм */
    const th = st.th * Math.PI / 180, rr = 10;
    let feat = null, P, mid;
    const half = Math.sqrt(Math.max(0, st.A) / Math.PI) * k;   /* половина ширины плоской решётки, px */
    if (th < 1e-3 || !isFinite(st.R)) { P = MFL.join(y0, [], 6, o.x1 || 594); mid = P.findIndex(p => p[0] >= c); }
    else { feat = MFL.cap(c, y0, st.R * k, rr, th); P = MFL.join(y0, [feat], 6, o.x1 || 594); mid = P.indexOf(feat.pts[feat.mid]); }
    let s = pk('membrane', BF.bilayerPts(P));
    /* решётка: трискелионы с цитоплазматической стороны; длина по контуру = R·θ (для плоской — √(A/π)) */
    const arc = (th < 1e-3 || !isFinite(st.R)) ? half : st.R * th * k, an = arc * Math.sqrt(st.frac == null ? 1 : st.frac);
    let lat = ''; const step = 9;
    for (let a = -an; a <= an + .01; a += step) { const p = MFL.arcAt(P, mid, a); if (p.y + p.ny * 17 < y0 + 9) continue; lat += trisk(p.x + p.nx * 17, p.y + p.ny * 17, 4.2, a * 7); }
    s += pk('trisk', lat);
    /* рецепторы с грузом и адаптером внутри решётки */
    [-.6, -.2, .2, .6].forEach(q => { if (an < 20) return; const p = MFL.arcAt(P, mid, q * an); s += recSplit(p.x, p.y, MFL.turn(p)); });
    if (feat && st.dyn > 0) { const nk = Math.max(3, feat.neck), yy = feat.yn + 2;
      s += pk('dynamin', `<g opacity="${f(st.dyn)}"><rect x="${f(c - nk - 16)}" y="${f(yy - 5)}" width="10" height="10" rx="3" fill="${C.dyn}"/><rect x="${f(c + nk + 6)}" y="${f(yy - 5)}" width="10" height="10" rx="3" fill="${C.dyn}"/></g>`); }
    return { s, P, mid, feat };
  };
  M.coat = function (st, L) {
    let s = `<rect width="600" height="420" fill="var(--surface)"/>`;
    /* панель А: ямка в разрезе */
    s += panel(4, 34, 592, 196, L.pA);
    s += tx(30, 56, L.out, { cls: 'area', fs: 12.5 }) + tx(30, 218, L.cyto, { cls: 'area', fs: 12.5 });
    const sec = M.coatSection(st, { c: 300, y0: 76, k: 0.62 });
    s += sec.s;
    s += pk('theta', tx(590, 56, L.theta, { a: 'end', fs: 12.5, fw: 600 }));
    s += pk('lattice', tx(590, 218, L.lattice, { a: 'end', fs: 12, fill: C.clath, fw: 600 }));
    /* панель Б: два графика */
    s += panel(4, 236, 592, 182, L.pB);
    s += M.coatPlots(st, L, 236);
    return s;
  };
  M.coatPlots = function (st, L, y) {
    let s = '';
    const xf = v => v + '°';
    const g1 = axes({ x: 14, y: y + 4, w: 286, h: 174, xr: [0, 180], yr: [50, 250], xt: [0, 90, 180], xf, yt: [50, 100, 150, 200, 250], yl: L.yR });
    s += g1.s + poly(st.curveR.filter(([, r]) => r <= 250).map(([a, r]) => [g1.sx(a), g1.sy(r)]), { c: C.clath, w: 2.6 });
    const g2 = axes({ x: 304, y: y + 4, w: 290, h: 174, xr: [0, 180], yr: [0, 140], xt: [0, 90, 180], xf, yt: [0, 40, 80, 120], yl: L.yA });
    s += g2.s + poly(st.curveA.map(([a, v]) => [g2.sx(a), g2.sy(v / 1000)]), { c: 'var(--ink)', w: 2.4 }) + poly(st.curveAp.map(([a, v]) => [g2.sx(a), g2.sy(v / 1000)]), { c: 'var(--ink)', w: 2, dash: '6 4' });
    /* Измеренные значения SK-MEL-2 не привязаны к оси угла: радиусы относятся к псевдовремени и медиане, проекции — к началу и концу ряда.
       На угловой оси остаются расчётные кривые и текущий угол; измерения вынесены в отдельный блок подписей без точек на оси (ФА-08). */
    if (st.meas) {
      s += tx(g1.sx(72), g1.Y1 + 4, L.measHead, { fs: 10, fill: '#0B4F7A', fw: 600 });
      st.meas.R.forEach(([r, lab], i) => { s += tx(g1.sx(72), g1.Y1 + 4 + (i + 1) * 13, lab, { fs: 10, fill: '#0B4F7A' }); });
      s += tx(g1.sx(72), g1.Y1 + 4 + 4 * 13, L.measAp, { fs: 10, fill: '#0B4F7A' });
    } else s += tx(g1.sx(72), g1.Y1 + 4, L.noMeas, { fs: 10, fill: 'var(--muted)', n: 30 });
    /* курсор — текущий угол */
    [g1, g2].forEach(g => { s += `<line x1="${f(g.sx(st.th))}" y1="${g.Y1}" x2="${f(g.sx(st.th))}" y2="${g.Y0}" stroke="#0090D0" stroke-width="1.6"/>`; });
    s += `<line x1="${g2.X0 + 8}" y1="${g2.Y1 + 6}" x2="${g2.X0 + 28}" y2="${g2.Y1 + 6}" stroke="var(--ink)" stroke-width="2.4"/>` + tx(g2.X0 + 32, g2.Y1 + 10, L.lgA, { fs: 10.5 }) +
      `<line x1="${g2.X0 + 8}" y1="${g2.Y1 + 18}" x2="${g2.X0 + 28}" y2="${g2.Y1 + 18}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/>` + pk('proj', tx(g2.X0 + 32, g2.Y1 + 22, L.lgAp, { fs: 10.5 }));
    return s;
  };


  /* ---------- 1М2: чем закончится ямка ----------
     st: { pos (1–5), shares {ab, st, pr} (числа или null), stuckCond (доля «условно»), T, frozen }; L — подписи */
  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  M.pitfate = function (st, L) {
    let s = `<rect width="600" height="420" fill="var(--surface)"/>`;
    s += panel(4, 34, 592, 212, L.pA);
    /* вид снизу: участок мембраны, ямки появляются и исчезают; цвет — исход */
    const bx = 16, by = 66, bw = 300, bh = 170;
    s += pk('membrane', `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="#EEF3FA" stroke="${C.head}" stroke-width="1.4"/>`);
    s += tx(bx + 16, by - 12, L.below, { fs: 11.5, fill: 'var(--muted)' });
    const n = 24, sh = st.shares, stq = sh.st != null ? sh.st : st.stuckCond;
    const nAb = Math.round(sh.ab / 100 * n), nSt = Math.max(stq > 0 ? 1 : 0, Math.round(stq / 100 * n));
    let pits = '';
    for (let i = 0; i < n; i++) {
      const kind = i < nAb ? 'ab' : i < nAb + nSt ? 'st' : 'pr', x = bx + 18 + (bw - 36) * rnd(i, 1), y = by + 16 + (bh - 32) * rnd(i, 2);
      const b = 2.6 * rnd(i, 3), life = kind === 'ab' ? .35 : kind === 'pr' ? 1.1 : 99, T = st.T;
      if (T < b || T > b + life) continue;
      const u = Math.min(1, (T - b) / Math.min(life, .8)), r = 3 + 4 * u;
      const col = kind === 'ab' ? '#9AA6B2' : kind === 'pr' ? C.clath : '#3E1F6B';
      pits += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${C.adapt}" opacity=".35"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(r * .7)}" fill="${col}"/>`;
      if (kind === 'pr' && T > b + life - .2) pits += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r + 3)}" fill="none" stroke="${C.dyn}" stroke-width="2"/>`;
      if (kind === 'st' && sh.st == null) { const lf = x > bx + bw - 70; pits += tx(lf ? x - 9 : x + 9, y + 4, L.cond, { a: lf ? 'end' : 'start', fs: 10, fill: 'var(--muted)' }); }
    }
    s += pk('lattice', pits);
    /* легенда цвета */
    /* увеличенная ямка в разрезе */
    const cx = 455, y0 = 112, T = st.T, frozen = st.frozen;
    s += tx(cx, 56, L.zoom, { a: 'middle', fs: 11.5, fill: 'var(--muted)' });
    const th = T < 1 ? 0 : T < 3 ? Math.min(Math.PI * .92, (T - 1) / 2 * Math.PI * .92) : Math.PI * .92;
    const R = 34, P = th < 1e-3 ? MFL.join(y0, [], 330, 590) : null;
    const feat = th < 1e-3 ? null : MFL.cap(cx, y0, R, 8, th), PP = P || MFL.join(y0, [feat], 330, 590), mid = feat ? PP.indexOf(feat.pts[feat.mid]) : PP.findIndex(q => q[0] >= cx);
    const detached = T >= 2.6 && T < 3;
    s += pk('membrane', BF.bilayerPts(detached ? MFL.join(y0, [], 330, 590) : PP));
    /* сеть белков начала сборки: капли под мембраной (застывшая сеть — сплошная заливка) */
    const span = feat ? R * th : 24 + 30 * Math.min(1, T);
    let net = '', cry = '';
    if (!detached) for (let a = -span; a <= span; a += 11) { const q = MFL.arcAt(PP, mid, a); if (q.y + q.ny * 30 < y0 + 9) continue; net += `<circle cx="${f(q.x + q.nx * 30)}" cy="${f(q.y + q.ny * 30)}" r="5.5" fill="#F0B35A" opacity="${frozen ? .95 : .55}" stroke="${frozen ? '#8A5A12' : '#C9802A'}"${frozen ? ' stroke-width="1.6"' : ' stroke-dasharray="2 2"'}/>`;
      if (st.cry2) cry += `<circle cx="${f(q.x + q.nx * 37)}" cy="${f(q.y + q.ny * 37)}" r="2.6" fill="#2F6FD6"/>`; }
    s += pk('eps', net) + pk('cry2', cry);
    if (!detached && T >= .5) { let lat = ''; const an = span * Math.min(1, (T - .5) / .8); for (let a = -an; a <= an + .01; a += 9) { const q = MFL.arcAt(PP, mid, a); if (q.y + q.ny * 17 < y0 + 9) continue; lat += trisk(q.x + q.nx * 17, q.y + q.ny * 17, 4, a * 7); } s += pk('lattice', lat);
      [-.5, 0, .5].forEach(k => { const q = MFL.arcAt(PP, mid, k * an); s += pk('adapter', `<line x1="${f(q.x + q.nx * 10)}" y1="${f(q.y + q.ny * 10)}" x2="${f(q.x + q.nx * 6)}" y2="${f(q.y + q.ny * 6)}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`); }); }
    if (feat && T > 2.2 && T < 2.6) s += pk('dynamin', `<rect x="${f(cx - feat.neck - 15)}" y="${f(feat.yn - 4)}" width="9" height="9" rx="3" fill="${C.dyn}"/><rect x="${f(cx + feat.neck + 6)}" y="${f(feat.yn - 4)}" width="9" height="9" rx="3" fill="${C.dyn}"/>`);
    if (detached) s += pk('lattice', BF.vesicle(cx, y0 + 70, 22, C.clath, 0));
    if (T >= 3 && frozen) s += tx(588, 241, L.stuckNote, { a: 'end', fs: 10, fill: 'var(--muted)', n: 75 });
    s += tx(338, 80, L.out, { cls: 'area', fs: 11.5 }) + tx(588, 214, L.cyto, { cls: 'area', fs: 11.5, a: 'end' });
    /* панель Б: доли трёх исходов по времени жизни */
    s += panel(4, 252, 592, 166, L.pB);
    const g = axes({ x: 14, y: 254, w: 340, h: 162, xr: [0, 3], yr: [0, 100], xt: [], yt: [0, 25, 50, 75, 100], yl: L.yShare });
    s += g.s + `<defs>${hatchDef('h1m2')}</defs>`;
    [['ab', L.binAb, '#9AA6B2'], ['pr', L.binPr, C.clath], ['st', L.binSt, '#3E1F6B']].forEach(([k, lab, c], i) => {
      const x0 = g.sx(i + .15), x1 = g.sx(i + .85), v = sh[k];
      if (v == null) s += `<rect x="${f(x0)}" y="${f(g.sy(40))}" width="${f(x1 - x0)}" height="${f(g.Y0 - g.sy(40))}" fill="url(#h1m2)" stroke="var(--line)"/>` + tx((x0 + x1) / 2, g.Y1 + 12, L.na, { a: 'middle', fs: 10, fill: 'var(--muted)', n: 14, lh: 12 });
      else s += `<rect x="${f(x0)}" y="${f(g.sy(v))}" width="${f(x1 - x0)}" height="${f(g.Y0 - g.sy(v))}" fill="${c}" opacity=".85"/>` + tx((x0 + x1) / 2, g.sy(v) - 9, L.val[k], { a: 'middle', fs: 11.5, fw: 600 });
      s += tx((x0 + x1) / 2, g.Y0 + 15, lab, { a: 'middle', fs: 11, fill: 'var(--muted)' });
    });
    s += `<line x1="${f(g.sx(1))}" y1="${g.Y1}" x2="${f(g.sx(1))}" y2="${g.Y0}" stroke="var(--ink)" stroke-dasharray="4 3"/><line x1="${f(g.sx(2))}" y1="${g.Y1}" x2="${f(g.sx(2))}" y2="${g.Y0}" stroke="var(--ink)" stroke-dasharray="4 3"/>`;
    s += tx(g.sx(1) + 3, g.Y1 - 4, L.t20, { fs: 10.5 }) + tx(g.sx(2) + 3, g.Y1 - 4, L.t180, { fs: 10.5 });
    /* условие положения */
    s += tx(370, 286, L.posT, { fs: 12, fw: 600, n: 34 }) + tx(370, 306 + 15 * (nlines(L.posT, 34) - 1), L.posV, { fs: 12, n: 34 });
    [['#9AA6B2', L.lgAb], [C.clath, L.lgPr], ['#3E1F6B', L.lgSt]].forEach(([c, l], i) => { s += `<circle cx="378" cy="${356 + i * 17}" r="5" fill="${c}"/>` + tx(388, 360 + i * 17, l, { fs: 11.5 }); });
    return s;
  };

  /* ---------- тонкий бислой (масштабные схемы, где мембрана в несколько раз тоньше пузырька) ---------- */
  function thinMem(points, closed, hw = 2.6) {
    const P0 = closed ? points.concat([points[0]]) : points, P = [P0[0]], A = [], B = [];
    for (let i = 1; i < P0.length; i++) { const [x0, y0] = P0[i - 1], [x1, y1] = P0[i], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 2.5)); for (let k = 1; k <= n; k++) P.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]); }
    let acc = 0, out = '';
    for (let i = 0; i < P.length; i++) { const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)]; let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
      A.push([P[i][0] - ty * hw, P[i][1] + tx * hw]); B.push([P[i][0] + ty * hw, P[i][1] - tx * hw]); }
    out += `<path d="M${P.map(q => f(q[0]) + ',' + f(q[1])).join(' L')}" fill="none" stroke="${C.tail}" stroke-width="${f(hw * 1.2)}" opacity=".7"/>`;
    [A, B].forEach(L => { let d = 0; for (let i = 1; i < L.length; i++) { d += Math.hypot(L[i][0] - L[i - 1][0], L[i][1] - L[i - 1][1]); if (d >= 2.9) { d = 0; out += `<circle cx="${f(L[i][0])}" cy="${f(L[i][1])}" r="1.25" fill="${C.head}"/>`; } } });
    return out;
  }

      /* лиганд */
      const lig = (x, y) => k === 'ldl' ? pk('ldl', ldl(x, y)) : k === 'tf' ? pk('transferrin', tfn(x, y, S.fe)) : pk('igg', igg(x, y, 1));
      if (S.bound) s += lig(head[0], head[1] - (k === 'igg' ? 6 : 2));
      else if (S.free === 'out') s += lig(rx - 34, Y - 22);
      else if (S.free === 'lumen') s += lig(ex - 6, ey - 4);
      else if (S.free === 'lyso') s += lig(lx, ey);
      if (S.na) s += `<circle cx="${head[0]}" cy="${head[1] - 4}" r="11" fill="url(#h3m)" stroke="var(--muted)" stroke-dasharray="2 2"/>` + tx(onEndo ? ex - R - 8 : head[0] + 14, onEndo ? ey + 4 : head[1] - 10, L.na, { a: onEndo ? 'end' : 'start', fs: 9.5, fill: 'var(--muted)', halo: H });
      if (k === 'tf' && S.feFree) s += pk('iron', `<circle cx="${ex + 8}" cy="${ey - 8}" r="2.6" fill="${C.red}"/>`);
      if (k === 'igg' && st.excess && ph >= 1) s += pk('igg', igg(ex + 9, ey - 2, .9) + igg(lx - 2, ey - 2, .9));
    });
    /* панель Б: шкала pH и строки состояний */
    s += panel(4, 300, 592, 118, L.pB);
    const X0 = 140, X1 = 584, sx = v => X0 + (7.4 - v) / 2.9 * (X1 - X0), y = 330;
    s += `<rect x="${f(sx(6))}" y="${y - 6}" width="${f(sx(5) - sx(6))}" height="12" fill="${X.fcrn}" opacity=".18"/>` + `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="var(--ink)" stroke-width="1.6"/>`;
    [7.4, 6.6, 6.5, 5.7, 5.4, 5, 4.5].forEach((v, i) => { s += `<line x1="${f(sx(v))}" y1="${y - 5}" x2="${f(sx(v))}" y2="${y + 5}" stroke="var(--ink)"/>` + tx(sx(v), v === 6.5 ? y - 9 : y + 16, String(v).replace('.', ','), { a: 'middle', fs: 10, fill: 'var(--muted)' }); });
    s += pk('phendo', tx(X0 - 8, y + 4, L.ph, { a: 'end', fs: 11, fw: 600 })) + tx(sx(5.5), y - 13, L.band, { a: 'middle', fs: 9.5, fill: X.fcrn });
    s += `<path d="M${f(sx(st.x))},${y - 18} l-5,-8 h10 z" fill="${C.red}"/>`;
    const seg = (r, a, b, kind) => { const yy = 356 + r * 18, x0 = sx(a), x1 = sx(b), w = Math.max(3, x1 - x0);
      return kind === 'na' ? `<rect x="${f(x0)}" y="${yy - 5}" width="${f(w)}" height="10" fill="url(#h3m)" stroke="var(--line)"/>` : `<rect x="${f(x0)}" y="${yy - 5}" width="${f(w)}" height="10" rx="2" fill="${kind === 'on' ? '#0D6E73' : '#B8CDD0'}"/>`; };
    const R3 = [['ldl', [[7.4, 6.5, 'on'], [6.5, 4.5, 'off']]], ['tf', [[7.42, 7.38, 'on'], [7.38, 5.45, 'na'], [5.45, 5.35, 'on'], [5.35, 5.05, 'na'], [5.05, 4.95, 'on'], [4.95, 4.5, 'na']]], ['igg', [[7.42, 7.38, 'off'], [7.38, 6.0, 'na'], [6.0, 5.0, 'on'], [5.0, 4.5, 'na']]]];
    R3.forEach(([k, segs], r) => { s += tx(X0 - 8, 360 + r * 18, L.row[k], { a: 'end', fs: 10.5 }); segs.forEach(([a, b, kd]) => { s += seg(r, a, b, kd); }); });
    s += `<line x1="${f(sx(st.x))}" y1="${y + 20}" x2="${f(sx(st.x))}" y2="${356 + 2 * 18 + 7}" stroke="${C.red}" stroke-width="1.4"/>`;
    s += `<rect x="20" y="404" width="12" height="8" fill="#0D6E73"/>` + tx(36, 411, L.lgOn, { fs: 10 }) + `<rect x="130" y="404" width="12" height="8" fill="#B8CDD0"/>` + tx(146, 411, L.lgOff, { fs: 10 }) +
      `<rect x="250" y="404" width="12" height="8" fill="url(#h3m)" stroke="var(--line)"/>` + tx(266, 411, L.lgNa, { fs: 10 });
    return s;
  };

  /* ---------- 3М2: адрес в хвосте рецептора ----------
     st: { motif, out ('rec'|'lyso'|'ilv'|'stay'), T, snx17 ('yes'|'no'|'dc'), snx27, cmd, closedFrac } */
  M.tail = function (st, L) {
    let s = `<rect width="600" height="420" fill="var(--surface)"/>`; const H = 'var(--surface)';
    s += panel(4, 36, 592, 256, L.pA);
    const cx = 200, cy = 168, R = 72, ty = 150, tx0 = cx + R - 6, tx1 = 470, tw = 13, T = st.T, sm = (a, b, x) => { const u = Math.max(0, Math.min(1, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
    /* эндосома: основная часть и трубчатый участок возврата */
    const body = circ(cx, cy, R, 90).filter(([x, y]) => !(x > cx + R * .8 && Math.abs(y - ty) < tw + 2));
    s += pk('endosome', `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#F6E4D4"/>` + thinMem(body, false, 3));
    s += pk('retsite', `<rect x="${tx0}" y="${ty - tw}" width="${tx1 - tx0}" height="${2 * tw}" rx="${tw}" fill="#F6E4D4"/>` + thinMem([[tx0, ty - tw], [tx1 - tw, ty - tw]], false, 3) + thinMem([[tx0, ty + tw], [tx1 - tw, ty + tw]], false, 3) +
      thinMem(Array.from({ length: 13 }, (_, i) => { const a = -Math.PI / 2 + Math.PI * i / 12; return [tx1 - tw + tw * Math.cos(a), ty + tw * Math.sin(a)]; }), false, 3));
    /* ESCPE-1 на трубке, ретромер, ретривер и CCC у её основания */
    let es = ''; for (let x = tx0 + 20; x < tx1 - 10; x += 12) es += `<rect x="${x - 4}" y="${ty - tw - 10}" width="8" height="5" rx="2" fill="#7C8B2E"/><rect x="${x - 4}" y="${ty + tw + 5}" width="8" height="5" rx="2" fill="#7C8B2E"/>`;
    s += pk('escpe', es);
    s += pk('retromer', `<rect x="${tx0 + 4}" y="${ty - tw - 17}" width="22" height="10" rx="4" fill="#B5651D"/>`);
    s += pk('commander', `<g opacity="${st.cmd === 'ok' ? 1 : .35}"><rect x="${tx0 + 34}" y="${ty + tw + 14}" width="24" height="10" rx="4" fill="${X.ret}"/><circle cx="${tx0 + 70}" cy="${ty + tw + 19}" r="7" fill="none" stroke="${X.ret}" stroke-width="3" stroke-dasharray="${st.cmd === 'ok' ? '' : '3 3'}"/></g>`);
    s += pk('retsite', tx(tx1 - 6, 74, L.ret, { a: 'end', fs: 10.5, fill: 'var(--muted)', halo: H })) + tx(tx0 + 84, ty + tw + 23, L.cmd, { fs: 10.5, fill: 'var(--muted)', halo: H });
    s += tx(cx - 12, cy + R + 30, L.endo, { a: 'end', fs: 11, fill: 'var(--muted)' }) + tx(30, 60, L.cyto, { cls: 'area', fs: 11 });
    /* путь груза: вверху основной части → в трубку → к концу трубки */
    const onBody = a => [cx + R * Math.cos(a), cy + R * Math.sin(a)], a0 = -2.2;
    let p0 = onBody(a0), ang = a0, inTube = false, ilv = 0;
    if (st.out === 'rec') { const u = sm(1.2, 2.0, T), v = sm(2.0, 3.0, T); ang = a0 + (-0.32 - a0) * u; p0 = onBody(ang); if (v > 0) { inTube = true; p0 = [tx0 + (tx1 - tw - 18 - tx0) * v, ty - tw]; } }
    if (st.out === 'ilv') ilv = sm(1.2, 2.6, T);
    /* груз: трансмембранный белок; хвост с мотивом — в цитоплазму (снаружи эндосомы) */
    const nrm = inTube ? [0, -1] : [Math.cos(ang), Math.sin(ang)];
    let g = '';
    if (ilv > 0) { const ix = cx - 10, iy = cy + 8, r = 18 * ilv; g += pk('ilv', `<circle cx="${ix}" cy="${iy}" r="${f(Math.max(2, r))}" fill="${H}"/>` + thinMem(circ(ix, iy, Math.max(2, r), 40), true, 2.6)); p0 = [ix + (p0[0] - ix) * (1 - ilv) + 0, iy - r + (p0[1] - iy + r) * (1 - ilv)]; }
    /* при внутрипросветной почке хвост (цитоплазматическая сторона) оказывается внутри пузырька, просветная часть — снаружи */
    const nl = Math.hypot(nrm[0] * (1 - ilv), nrm[1] * (1 - ilv) + ilv) || 1, [nx, ny] = ilv > 0 ? [nrm[0] * (1 - ilv) / nl, (nrm[1] * (1 - ilv) + ilv) / nl] : nrm;
    const [x, y] = p0, tl = ilv > 0 ? 26 - 6 * ilv : 26, tip = [x + nx * tl, y + ny * tl];
    g += `<line x1="${f(x - nx * 14)}" y1="${f(y - ny * 14)}" x2="${f(tip[0])}" y2="${f(tip[1])}" stroke="${C.cargo}" stroke-width="5" stroke-linecap="round"/><circle cx="${f(x - nx * 16)}" cy="${f(y - ny * 16)}" r="6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
    const tag = st.motif === 'pdz' ? `<rect x="${f(tip[0] - 5)}" y="${f(tip[1] - 5)}" width="10" height="10" fill="#2F6FD6"/>` : st.motif === 'npxy' ? `<path d="M${f(tip[0])},${f(tip[1] - 7)} l6,10 h-12 z" fill="${X.snx17}"/>` : st.motif === 'ub' ? `<circle cx="${f(tip[0])}" cy="${f(tip[1])}" r="7" fill="#6748B6"/>` : '';
    g = pk('cargoT', g) + (tag ? pk(st.motif === 'ub' ? 'ub' : 'motif', tag) : '');
    s += g;
    /* SNX17: на основной части; закрыт → связан с хвостом → открытым участком связывает ретривер */
    if (st.snx17 !== 'no') { const sa = a0 + .35, sp0 = onBody(sa), sxy = [sp0[0] + Math.cos(sa) * 13, sp0[1] + Math.sin(sa) * 13];
      let pos = sxy, open = st.snx17 === 'dc' ? false : false;
      if (st.motif === 'npxy') { const u = sm(.3, 1.2, T); pos = [sxy[0] + (tip[0] + 12 - sxy[0]) * u, sxy[1] + (tip[1] - sxy[1]) * u]; open = st.snx17 === 'yes' && T > 1.2; }
      s += pk('snx17', st.snx17 === 'dc' ? `<ellipse cx="${f(pos[0])}" cy="${f(pos[1])}" rx="11" ry="7.5" fill="${X.snx17}" opacity=".9"/>` : snx17(pos[0], pos[1], open)); }
    if (st.snx27 === 'yes') { const sp = st.motif === 'pdz' ? [tip[0] + 10, tip[1] - 6] : [cx - R - 10, cy]; s += pk('snx27', `<ellipse cx="${f(sp[0])}" cy="${f(sp[1])}" rx="10" ry="7" fill="#2B4C9B"/>`); }
    /* выходы */
    s += `<path d="M${tx1 + 4},${ty} L560,${ty}" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#a_3m2)"/>` + tx(590, ty - 46, L.surf, { a: 'end', fs: 11, fill: 'var(--muted)', n: 14 });
    s += `<path d="M${cx},${cy + R + 4} L${cx},${cy + R + 30}" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#a_3m2)"/>` + tx(cx + 10, cy + R + 38, L.lyso, { fs: 11, fill: 'var(--muted)' });
    /* панель Б: исходы */
    s += panel(4, 298, 592, 120, L.pB);
    const outs = [['rec', L.oRec], ['lyso', L.oLyso], ['ilv', L.oIlv]];
    outs.forEach(([k, lab], i) => { const on = st.out === k || (k === 'lyso' && st.out === 'stay'), x0 = 24 + i * 190;
      s += `<rect x="${x0}" y="322" width="176" height="56" rx="9" class="box${on && T >= 2.9 ? ' on' : ''}"/>` + tx(x0 + 88, 344, lab, { a: 'middle', fs: 11, fw: 600, n: 21 }); });
    s += tx(300, 404, L.note, { a: 'middle', fs: 10.5, fill: 'var(--muted)' });
    return s;
  };

  /* ---------- 3М3: PCSK9 и рецептор ЛПНП ----------
     st: { d (доза), T, fP (доля рецепторов с PCSK9 на анимации — условная), nI (молекул ингибитора — условно), red {доза: %} } */
  M.pcsk9 = function (st, L) {
    let s = `<rect width="600" height="420" fill="var(--surface)"/>`; const H = 'var(--surface)', T = st.T;
    const sm = (a, b, x) => { const u = Math.max(0, Math.min(1, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
    s += panel(4, 36, 592, 236, L.pA);
    const Y = 104, ex = 210, ey = 196, lx = 430, ly = 196;
    s += tx(30, 60, L.blood, { cls: 'area', fs: 11.5 }) + tx(30, 262, L.cell, { cls: 'area', fs: 11.5 });
    s += pk('membrane', thinMem([[14, Y], [586, Y]], false, 3.2));
    s += pk('endosome', `<circle cx="${ex}" cy="${ey}" r="32" fill="#F6E4D4"/>` + thinMem(circ(ex, ey, 32), true, 3)) + tx(ex, ey + 50, L.endo, { a: 'middle', fs: 10.5, fill: 'var(--muted)' });
    s += pk('lysosome', `<circle cx="${lx}" cy="${ly}" r="28" fill="#FCE9E4"/>` + thinMem(circ(lx, ly, 28), true, 3)) + tx(lx, ly + 46, L.lyso, { a: 'middle', fs: 10.5, fill: 'var(--muted)' });
    s += `<path d="M${ex + 36},${ey} L${lx - 34},${ly}" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a_3m3)"/><path d="M${ex - 30},${ey - 18} Q${ex - 80},${Y + 30} ${ex - 70},${Y + 12}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a_3m3)"/>`;
    const N = 8, nP = Math.round(st.fP * N), xs = Array.from({ length: N }, (_, i) => 96 + i * 62);
    let recs = '', pc = '', ld = '';
    xs.forEach((x, i) => { const withP = i < nP;
      /* этап 2: рецептор с PCSK9 уходит в лизосому; этап 3–4: остальные рецепторы возвращаются */
      let rx = x, ry = Y, inMem = true;
      if (withP) { const u = sm(1, 2, T); if (u > 0) { inMem = false; const q = Math.min(1, u * 1.4), q2 = Math.max(0, u * 1.4 - .4) / 1; rx = x + (lx - 12 + (i % 3) * 10 - x) * Math.min(1, u); ry = Y + (ly - Y + 18) * Math.min(1, u); } }
      if (inMem) recs += BF.recAt(rx, ry, 0, false, 14, false); else recs += `<g opacity=".85">${BF.recAt(rx, ry - 14, 0, false, 10, false)}</g>`;
      if (withP && T >= .3) { const a = sm(.3, 1, T); pc += pcsk9(rx, (inMem ? ry - 22 : ry - 30) - (1 - a) * 30); }
      if (!withP && T >= 3) ld += ldl(rx, Y - 24 - (1 - sm(3, 3.8, T)) * 30);
    });
    s += pk('ldlr', recs) + pk('pcsk9', pc) + pk('ldl', ld);
    /* ингибитор связывает свободный PCSK9 в крови (этап 3) */
    let inh = ''; for (let i = 0; i < st.nI; i++) { const x = 330 + i * 46, y = 66 + (i % 2) * 8; if (T >= 2) { inh += pk('pcsk9', pcsk9(x, y)) + pk('inhib', inhib(x + 9 - 9 * (1 - sm(2, 2.8, T)) * 0, y - 2 - 20 * (1 - sm(2, 2.8, T)))); } }
    s += inh;
    if (st.nI === 0) s += tx(590, 60, L.noInh, { a: 'end', fs: 10.5, fill: 'var(--muted)' });
    s += tx(590, 128, L.cond, { a: 'end', fs: 10.5, fill: 'var(--muted)', halo: H });
    /* панель Б: снижение ХС-ЛПНП по сравнению с плацебо */
    s += panel(4, 278, 592, 140, L.pB);
    s += tx(26, 298, L.yl, { fs: 11.5, fw: 600 }) + tx(590, 298, L.ciNote, { a: 'end', fs: 10.5, fill: 'var(--muted)' });
    const D = [0, 6, 12, 18, 30], x0 = 150, w = 70, base = 312, sc = 1.1;
    s += `<line x1="${x0 - 20}" y1="${base}" x2="${x0 + 5 * 84}" y2="${base}" stroke="var(--ink)"/>`;
    [0, -20, -40, -60].forEach(v => { s += tx(x0 - 26, base - v * sc + 4, v ? '−' + (-v) : '0', { a: 'end', fs: 10, fill: 'var(--muted)' }) + (v ? `<line x1="${x0 - 20}" y1="${base - v * sc}" x2="${x0 + 5 * 84}" y2="${base - v * sc}" stroke="var(--line)"/>` : ''); });
    /* точка — оценка разности; отрезок — 95 % доверительный интервал; плацебо — нулевая линия сравнения (ФА-05) */
    D.forEach((d, i) => { const v = st.red[d], x = x0 + i * 84, on = d === st.d, cx = x + w / 2, col = on ? '#0D6E73' : '#7FA3A8';
      if (v != null) { const ci = st.ci[d], y1 = base - ci[0] * sc, y2 = base - ci[1] * sc, yv = base - v * sc;
        s += `<line x1="${f(cx)}" y1="${f(y1)}" x2="${f(cx)}" y2="${f(y2)}" stroke="${col}" stroke-width="2"/><line x1="${f(cx - 6)}" y1="${f(y1)}" x2="${f(cx + 6)}" y2="${f(y1)}" stroke="${col}" stroke-width="2"/><line x1="${f(cx - 6)}" y1="${f(y2)}" x2="${f(cx + 6)}" y2="${f(y2)}" stroke="${col}" stroke-width="2"/>` +
          `<circle cx="${f(cx)}" cy="${f(yv)}" r="${on ? 6 : 5}" fill="${col}"${on ? ` stroke="${C.red}" stroke-width="2"` : ''}/>` + tx(cx + 10, yv + 4, String(v).replace('.', ',').replace('-', '−'), { fs: 10.5, fw: on ? 700 : 400 }); }
      else s += tx(cx, base + 15, L.placebo, { a: 'middle', fs: 10.5, fill: on ? C.red : 'var(--muted)', fw: on ? 700 : 400 });
      s += tx(x + w / 2, 412, d + ' ' + L.mg, { a: 'middle', fs: 10.5, fw: on ? 700 : 400 });
    });
    return s;
  };

  /* ---------- ядерная пора в разрезе: кольца каркаса, мембрана поры, FG-повторы, корзина ----------
     d — диаметр внутреннего кольца (нм); k — px/нм; yo, yi — наружная и внутренняя мембраны; crack — смещённое звено цитоплазматического кольца */
  M.poreSec = function (cx, yo, yi, d, k, o = {}) {
    let s = ''; const r = d / 2 * k, rw = 10 * k, rC = (d / 2 * .45 + 30 * .55) * k, rN = rC;
    const ym = (yo + yi) / 2, hw = (yi - yo) / 2;
    /* мембраны ядерной оболочки: слева и справа от поры; у края поры наружная переходит во внутреннюю (мембрана поры) */
    const edge = r + rw * 0.9 + hw;
    [-1, 1].forEach(sg => {
      const P = [[sg < 0 ? (o.x0 || 8) : (o.x1 || 592), yo]];
      const ex = cx + sg * edge; P.push([ex, yo]);
      for (let i = 1; i < 18; i++) { const a = -Math.PI / 2 + Math.PI * i / 18; P.push([ex - sg * hw * Math.cos(a) - sg * 0, ym + hw * Math.sin(a)]); }
      P.push([ex, yi]); P.push([sg < 0 ? (o.x0 || 8) : (o.x1 || 592), yi]);
      s += pk(o.pickMem || 'envelope', `<path d="M${P.map(q => f(q[0]) + ',' + f(q[1])).join(' L')}" fill="none"/>` + thinMem(sg < 0 ? P : P, false, 3));
    });
    s += pk('poremem', `<circle cx="${f(cx - edge)}" cy="${f(ym)}" r="${f(hw + 4)}" fill="transparent"/><circle cx="${f(cx + edge)}" cy="${f(ym)}" r="${f(hw + 4)}" fill="transparent"/>`);
    /* внутреннее кольцо — встроено в мембрану поры; цитоплазматическое и ядерное — над и под ним */
    s += pk('inring', `<rect x="${f(cx - r - rw)}" y="${f(ym - 12)}" width="${f(rw)}" height="24" rx="4" fill="${X.ring}"/><rect x="${f(cx + r)}" y="${f(ym - 12)}" width="${f(rw)}" height="24" rx="4" fill="${X.ring}"/>`);
    const crack = o.crack ? 9 : 0;
    s += pk('rings', `<rect x="${f(cx - rC - rw)}" y="${f(yo - 18 - crack)}" width="${f(rw)}" height="14" rx="4" fill="#8796A6"/><rect x="${f(cx + rC)}" y="${f(yo - 18)}" width="${f(rw)}" height="14" rx="4" fill="#8796A6"/>` +
      `<rect x="${f(cx - rN - rw)}" y="${f(yi + 4)}" width="${f(rw)}" height="14" rx="4" fill="#8796A6"/><rect x="${f(cx + rN)}" y="${f(yi + 4)}" width="${f(rw)}" height="14" rx="4" fill="#8796A6"/>`);
    /* FG-повторы: тонкие нити в канале */
    let fg = ''; for (let i = 0; i < 7; i++) { const yy = yo - 8 + (yi - yo + 16) * i / 6, P = []; for (let j = 0; j <= 16; j++) { const x = cx - r + 2 * r * j / 16; P.push([x, yy + 3 * Math.sin(j * 1.3 + i)]); } fg += poly(P, { c: X.fg, w: 1.2 }); }
    if (!o.noFG) s += pk('fg', `<g opacity=".8">${fg}</g>`);
    /* корзина */
    s += pk('basket', `<path d="M${f(cx - rN)},${f(yi + 18)} Q${f(cx - rN * .6)},${f(yi + 56)} ${f(cx - 10)},${f(yi + 64)} L${f(cx + 10)},${f(yi + 64)} Q${f(cx + rN * .6)},${f(yi + 56)} ${f(cx + rN)},${f(yi + 18)}" fill="none" stroke="#8796A6" stroke-width="2.2"/>`);
    return s;
  };
  /* вид сверху: восемь спиц, диаметр внутреннего кольца; crack — одно звено смещено */
  M.poreTop = function (cx, cy, d, k, crack) {
    const r = d / 2 * k; let s = `<circle cx="${cx}" cy="${cy}" r="${f(r + 16)}" fill="none" stroke="#C3CCD6" stroke-width="10"/>`;

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (прототип, вкладка 1).
   MF — семейства форм мембраны: контур меняется непрерывно, бислой строит BF.bilayerPts.
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
BF.setPick(true);   /* справка по любой детали схемы (см. s0_figs.js) */
const MF = (function () {
  const c01 = x => Math.max(0, Math.min(1, x));
  const ease = u => { u = c01(u); return u * u * (3 - 2 * u); };
  const lerp = (a, b, u) => a + (b - a) * u;

  /* ямка постоянного радиуса: th — угол охвата от дна (0 — плоско, π — шейка сомкнута);
     край ямки — дуга радиуса rr, касательная к плоской мембране и к окружности */
  function cap(c, y0, R, rr, th) {
    const D = R + rr, yn = y0 + rr, cy = yn - D * Math.cos(th), xl = c - D * Math.sin(th), L = [];
    const nr = Math.max(3, Math.ceil(th * rr / 3));
    for (let i = 0; i <= nr; i++) { const a = -Math.PI / 2 + th * i / nr; L.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]); }
    const nc = Math.max(3, Math.ceil(th * R / 3));
    for (let i = 1; i <= nc; i++) { const s = th * (1 - i / nc); L.push([c - R * Math.sin(s), cy + R * Math.cos(s)]); }
    const Rt = L.slice(0, -1).reverse().map(([x, y]) => [2 * c - x, y]);
    return { pts: L.concat(Rt), mid: L.length - 1, cy, neck: D * Math.sin(th) - rr, yn };
  }

  /* стык выроста с плоской мембраной — дуга радиуса F, касательная к линии y0 и к наружной окружности Ro */
  const F = 16;
  function foot(c, cy, y0, Ro) {
    const yc = y0 - F, dx = Math.sqrt(Math.max(0, (Ro + F) ** 2 - (yc - cy) ** 2));
    return { dx, yc, s: Math.atan2(dx, yc - cy) };   /* s — угол точки касания от дна окружности */
  }
  const th0Of = (cy, y0, Ro) => foot(0, cy, y0, Ro).s;
  function fillet(c, cy, y0, Ro) {   /* точки дуги слева направо до касания окружности (левый край выроста) */
    const { dx, yc } = foot(c, cy, y0, Ro), xf = c - dx, a1 = Math.atan2(cy - yc, c - xf), P = [], n = 10;
    for (let i = 0; i <= n; i++) { const a = Math.PI / 2 + (a1 - Math.PI / 2) * i / n; P.push([xf + F * Math.cos(a), yc + F * Math.sin(a)]); }

  /* выросты вокруг окружности Ri: левый и правый край доходят до углов thL и thR от дна; k — высота (0 — плоско) */
  function wrap(c, cy, y0, Ri, tip, thL, thR, k = 1) {

      for (let i = 0; i <= 10; i++) { const p = Math.PI * i / 10; P.push([x + tip * (Math.cos(p) * rx + Math.sin(p) * fx), y + tip * (Math.cos(p) * ry + Math.sin(p) * fy)]); } }
    for (let s = -thL + dI; s < thR; s += dI) P.push(pc(Ri, s));

    for (let s = thR - dO; s > th0; s -= dO) P.push(pc(Ro, s));
    FL.slice().reverse().forEach(([x, y]) => P.push([2 * c - x, y]));
    return { pts: P.map(([x, y]) => [x, y0 + (y - y0) * k]), th0 };
  }

  /* наружный контур после смыкания: мембрана над ушедшей внутрь вакуолью, k — высота */
  function dome(c, cy, y0, Ro, k) {

  /* неглубокая ямка на месте отделившейся везикулы */
  function dip(c, y0, w, d) {
    const P = []; for (let x = c - w; x <= c + w; x += 3) { const q = Math.cos((x - c) / w * Math.PI / 2); P.push([x, y0 + d * q * q]); }
    return { pts: P };
  }

  /* полная линия мембраны из участков: между ними — плоско */
  function join(y0, feats, x0 = 6, x1 = 594) {
    const P = []; let x = x0;
    feats.filter(Boolean).sort((a, b) => a.pts[0][0] - b.pts[0][0]).forEach(f => {
      for (; x < f.pts[0][0] - 1; x += 3) P.push([x, y0]);
      f.pts.forEach(p => P.push(p)); x = f.pts[f.pts.length - 1][0] + 3;

  }

  /* точка на контуре на расстоянии a от P[i0] вдоль линии; n — нормаль в сторону цитоплазмы; за концами контура — плоская мембрана */

    while (true) {

      const dx = P[j][0] - P[i][0], dy = P[j][1] - P[i][1], L = Math.hypot(dx, dy) || 1e-6;
      if (rest <= L) { const tx = dir * dx / L, ty = dir * dy / L; return { x: P[i][0] + dx * rest / L, y: P[i][1] + dy * rest / L, nx: -ty, ny: tx }; }
      rest -= L; i = j;
    }
  }
  /* поворот рецептора: чаша — в сторону, противоположную цитоплазме */
  const turn = p => Math.atan2(-p.nx, p.ny) * 180 / Math.PI;
  return { c01, ease, lerp, cap, wrap, dome, dip, join, arcAt, turn, th0Of };
})();

/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */

    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);

       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */

      if (calm.matches) {   /* без движения: ответ показывается сразу, кнопка идёт по одному этапу */
        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;

      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }

  btn.onclick = () => st.on ? api.pause() : api.play(false);
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });

}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};

  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => CASE.on ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */

/* =====================================================================
   s0_range.js — бегунок величины (общий компонент курса «Биология», v1.6 семинара 3).
   По образцу бегунков «Молекулярной биологии» (rangeHTML: подпись — величина, вывод — значение с единицами;
   засечки измеренных значений как в сцене s2b семинара 1 МБ).
   Возможности: засечки измеренных значений с подписями под шкалой; прилипание к засечке в пределах 3 % шкалы;
   ступенчатый режим (только измеренные положения); логарифмическая или своя шкала; штриховка участков
   «интерполяция модели / не измерено» между засечками. Блокировку в шаге «предскажите» даёт poeLock
   (s9_wip.js): бегунок — элемент input внутри панели переключателей.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
const RX = (function () {
  const SP = {}, N = 1000;
  const lg = Math.log10;
  /* положение на шкале p ∈ [0, 1] ↔ значение величины */
  function toP(sp, v) {
    if (sp.map) return clamp(sp.map[0](v));
    if (sp.log) return clamp((lg(v) - lg(sp.min)) / (lg(sp.max) - lg(sp.min)));
    return clamp((v - sp.min) / (sp.max - sp.min));

  function toV(sp, p) {
    if (sp.map) return sp.map[1](p);
    if (sp.log) return Math.pow(10, lg(sp.min) + p * (lg(sp.max) - lg(sp.min)));

  const num = (v, d) => (d == null ? String(v) : v.toFixed(d)).replace('.', ',').replace('-', '−');
  function fmtV(sp, v) { return sp.fmt ? sp.fmt(v) : num(v, sp.dec != null ? sp.dec : 0); }
  function round(sp, v) { if (!sp.round) return v; const r = sp.round(v); return r; }
  /* место на дорожке: центр бегунка ходит от 11 px до (ширина − 11 px) */
  const at = p => `calc(11px + ${(p * 100).toFixed(2)}% - ${(p * 22).toFixed(2)}px)`;

  function html(id, sp) {
    SP[id] = sp; sp.id = id;
    const steps = !!sp.stepped, marks = sp.marks || [];
    const v0 = sp.val != null ? sp.val : steps ? marks[0][0] : sp.min, sep = sp.glue ? '' : ' ';
    sp.v = v0;
    const iv = steps ? marks.findIndex(m => m[0] === v0) : Math.round(toP(sp, v0) * N);
    let h = `<div class="rx${steps ? ' rxstep' : ''}" id="${id}W"><div class="row"><label for="${id}">${t(sp.k)}</label><output id="${id}O">${fmtV(sp, v0)}${sep}${t(sp.unit)}</output></div>`;
    h += `<div class="rxtrack">`;
    if (!steps) (sp.hatch || []).forEach(([a, b]) => { const pa = toP(sp, a), pb = toP(sp, b), l = Math.min(pa, pb), r = Math.max(pa, pb);
      h += `<i class="rxh" style="left:${at(l)};width:calc(${((r - l) * 100).toFixed(2)}% - ${((r - l) * 22).toFixed(2)}px)"></i>`; });
    h += `<input type="range" id="${id}" min="0" max="${steps ? marks.length - 1 : N}" step="1" value="${iv}" aria-valuetext="${fmtV(sp, v0)}${sep}${t(sp.unit)}">`;
    const pm = (v, i) => steps ? (marks.length > 1 ? i / (marks.length - 1) : 0) : toP(sp, v);
    const two = marks.some(m => m[3]);   /* близкие засечки: подпись во втором ряду */
    h += `</div><div class="rxticks${two ? ' two' : ''}" aria-hidden="true">` + marks.map(([v, , short, row], i) => { const p = pm(v, i);
      return `<span class="rxt${row ? ' r1' : ''}" style="left:${at(p)}" data-p="${p.toFixed(3)}"><i></i>${short ? t(short) : fmtV(sp, v)}</span>`; }).join('') + `</div>`;
    const leg = marks.filter(m => m[1]).map(([v, k]) => `<li><b>${fmtV(sp, v)}${sep}${t(sp.unit)}</b> — ${t(k)}</li>`).join('') +
      (sp.hatchKey ? `<li class="rxhl"><i class="rxsw"></i>${t(sp.hatchKey)}</li>` : '');
    if (leg) h += `<ul class="rxleg">${leg}</ul>`;
    return h + `</div>`;
  }
  /* обработчик: прилипание, вывод значения; fn вызывается после пересчёта */
  function bind(id, fn) {
    const sp = SP[id], e = $(id);
    /* клавиатура: стрелка переходит к следующей засечке или на 2 % шкалы (без прилипания, иначе из засечки не уйти) */
    if (!sp.stepped) e.addEventListener('keydown', ev => {
      const dir = ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? 1 : ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -1 : 0;

      (sp.marks || []).forEach(([mv]) => { const pm = toP(sp, mv); if (dir > 0 ? pm > p + 1e-4 && pm < q : pm < p - 1e-4 && pm > q) q = pm; });

    });

      if (sp.stepped) { sp.v = sp.marks[+e.value][0]; }

        const snap = sp.snap != null ? sp.snap : 0.03;
        let best = null; if (!sp._kb) (sp.marks || []).forEach(([mv]) => { const d = Math.abs(toP(sp, mv) - p); if (d <= snap && (!best || d < best.d)) best = { d, mv }; });
        if (best) { v = best.mv; e.value = Math.round(toP(sp, v) * N); }
        else if (sp._kb) { const m = (sp.marks || []).find(([mv]) => Math.abs(toP(sp, mv) - p) < 1e-3); if (m) v = m[0]; }
        sp.v = v;

      out(sp); if (fn) fn(sp.v);
    });

  }
  function out(sp) {
    const s = fmtV(sp, sp.v) + (sp.glue ? '' : ' ') + t(sp.unit), o = $(sp.id + 'O'), e = $(sp.id);
    if (o) o.textContent = s; if (e) e.setAttribute('aria-valuetext', s);
    const W = $(sp.id + 'W'); if (W) W.querySelectorAll('.rxt').forEach((x, i) => x.classList.toggle('on', (sp.marks[i] || [])[0] === sp.v));
  }
  /* поставить значение (из сценария или из анимации); ступенчатый бегунок — ближайшее измеренное положение */
  function set(id, v) {
    const sp = SP[id], e = $(id);
    if (sp.stepped) { let bi = 0; sp.marks.forEach(([mv], i) => { if (Math.abs(mv - v) < Math.abs(sp.marks[bi][0] - v)) bi = i; }); sp.v = sp.marks[bi][0]; if (e) e.value = bi; }
    else { (sp.marks || []).forEach(([mv]) => { if (Math.abs(toP(sp, mv) - toP(sp, v)) < 1e-4) v = mv; });   /* ошибка округления при пересчёте время ↔ значение */
      if (sp.round && !(sp.marks || []).some(([mv]) => mv === v)) v = sp.round(v);
      sp.v = v; if (e) e.value = Math.round(toP(sp, v) * N); }
    out(sp); return sp.v;
  }

  const spec = id => SP[id];
  /* значение на засечке? (для показаний «измерено» и для тестов) */
  const onMark = id => (SP[id].marks || []).some(([mv]) => mv === SP[id].v);
  return { html, bind, set, get, spec, onMark, toP, toV, fmtV, num };
})();
window.RX = RX;

/* =====================================================================
   Вопрос 1. Эндоцитоз: механизмы и признаки, по которым их различают
   1b — базовый: груз × убранная деталь (клатрин, перестройка актина)
   1a — продвинутый: два эксперимента — мутантный динамин (Damke 1994) и кавеолы при натяжении (Sinha 2011)
   Все подписи — через t(); геометрия мембран — BF (s0_figs.js).
   ===================================================================== */
(function(){
  const K = '1b', Y = 150;
  layout(K);

  /* ---- модель: что образуется при данном грузе и наборе деталей ---- */
  function model1b(cargo, rm){
    const clath = rm !== 'clath', actin = rm !== 'actin';
    const o = { micro: false, macro: false, rme: false, phago: false, ligSurface: false, partOut: false };
    if (cargo === 'fl' || cargo === 'gf') o.micro = true;                 /* мелкие пузырьки: в модели без клатрина и без перестройки актина (упрощение; Damke et al., 1994 — захват жидкости при блокаде клатринового пути сохраняется) */
    if (cargo === 'gf' && actin) o.macro = true;                          /* макропиноцитоз: регулируемый, нужен актин */
    if (cargo === 'lig') { o.rme = clath; o.ligSurface = !clath; }        /* рецептор-опосредованный: клатрин-зависимый */
    if (cargo === 'part') { o.phago = actin; o.partOut = !actin; }        /* фагоцитоз: актин-зависимый, клатрин не нужен */
    o.inside = o.micro || o.macro || o.rme || o.phago;
    o.clathCoat = o.rme; o.actinOn = o.macro || o.phago;
    return o;
  }
  window.MODEL1B = model1b;   /* для автотеста */

  const solute = (pts) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#7FA7D6"/>`).join('');
  const SOL = [[60,40],[110,70],[170,30],[230,64],[290,36],[350,72],[410,30],[470,58],[530,34],[570,80],[40,100],[520,110],[260,108]];

  /* ---- ход процесса: этапы каждого пути и этап, на котором модель останавливает путь ---- */
  const STAGES = { fl: 3, gf: 4, lig: 7, part: 4 };
  const stageKeys = c => Array.from({ length: STAGES[c] }, (_, i) => `s1t_${c}_${i + 1}`);
  let caseCause = null;   /* «Найти причину»: скрытая причина, показанная на схеме после решения */
  const CASE_STOP = { nosyn: 7, noer: 7, nobind: 7, noadapt: 7, dyn: 4 };
  const G = 's1t_case_other', B = 's1t_case_empty';
  const CASE_KEYS = { nosyn: ['s1t_case_norec_1', G, G, G, G, G, 's1t_case_norec_7'], noer: ['s1t_case_norec_1', G, G, G, G, G, 's1t_case_norec_7'],
    nobind: ['s1t_case_nobind_1', B, B, B, B, B, 's1t_case_nobind_7'], noadapt: ['s1t_case_noadapt_1', G, G, G, G, G, 's1t_case_noadapt_7'] };
  function stopOf(cargo, o){
    if (caseCause) return CASE_STOP[caseCause];
    if (cargo === 'lig' && !o.rme) return 2;      /* адаптеры связаны, ямки нет: рецепторы остаются рассеянными */
    if (cargo === 'gf' && !o.macro) return 1;     /* сигнал получен, складки нет */
    if (cargo === 'part' && !o.phago) return 1;   /* частица у мембраны, псевдоподий нет */
    return STAGES[cargo];
  }
  window.STOP1B = stopOf;   /* для автотеста */

  const { ease, lerp, cap, wrap, dome, dip, join, arcAt, turn } = MF;
  const f1 = x => (+x).toFixed(1);
  const part01 = (T, i) => Math.max(0, Math.min(1, T - i));

  /* мелкий пузырёк: mu от 0 до 1 — впячивание, шейка, отделение, уход в цитоплазму */
  function bud(c, mu, vx, vy){
    const R = 15, rr = 20, thN = 2.163, cut = .72, top = cap(c, Y, R, rr, thN);
    if (mu < cut){
      const th = thN * ease(mu / cut);
      if (th < .03) return { feat: null, s: '' };
      const m = cap(c, Y, R, rr, th);
      return { feat: m, s: th > 1.2 ? solute([[c - 3, m.cy - 1], [c + 4, m.cy + 3]]) : '' };
    }

    return { feat: v < .5 ? dip(c, Y, 18, 3 * (1 - v / .5)) : null,
      s: `<g class="clickable" data-g="micro">${BF.vesicle(+f1(x), +f1(y), R, null, 0)}${solute([[x - 4, y - 3], [x + 5, y + 4]])}</g>` };
  }

  /* рецептор-опосредованный эндоцитоз: 7 этапов */
  const LC = 300, LR = 30, LRR = 18, TH_NECK = 2.518, AR = [-42, -14, 14, 42], X0 = [90, 190, 380, 425], XG = [236, 272, 328, 364];
  function ligand(T, stop){

    let surf = '', free = '';
    X0.forEach((x, i) => {
      if (cc === 'noadapt') surf += BF.recAt(x, Y, 0, u0 >= 1, 15, false);
      if (u0 < 1) free += `<circle data-x="1" cx="${f1(lerp(x + 26 - 16 * i, x, u0))}" cy="${f1(lerp(36 + 14 * i, Y - 16, u0))}" r="4.4" fill="${BF.C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
    });
    out.s += (free ? `<g class="clickable" data-g="ligand">${free}</g>` : '') + (surf ? `<g class="clickable" data-g="receptor">${surf}</g>` : '');
    if (other && T >= 2.5 && T < 6) out.labels += `<text class="lbl-l" x="226" y="${Y + 74}" font-size="12" text-anchor="end">${t('s1t_lbl_other')}</text>`;
    if (T < 5){
      const m = th > .03 ? cap(LC, Y, LR, LRR, th) : { pts: [[LC, Y]], mid: 0, cy: Y };
      out.feat = th > .03 ? m : null;
      let rec = '';
      AR.forEach((a, i) => {
        const p = arcAt(m.pts, m.mid, lerp(start[i] - LC, a, uG));
        rec += BF.recAt(p.x, p.y, turn(p), pitCargo && u0 >= 1, 15, adapter);
      });
      /* клатрин: решётка растёт от центра ямки, снаружи от адаптеров */
      let coat = '';
      if (uG > 0){
        const ext = Math.max(46 * uG, th * LR - 4), step = 11 * LR / (LR + 26 * Math.min(1, th / 1.2));
        for (let a = -Math.floor(ext / step) * step; a <= ext + .01; a += step){
          const p = arcAt(m.pts, m.mid, a), x = p.x + p.nx * 26, y = p.y + p.ny * 26;
          if (y > Y + 22) coat += `<circle cx="${f1(x)}" cy="${f1(y)}" r="3.6" fill="${BF.C.clath}"/>`;
        }
      }
      out.s += `<g class="clickable" data-g="receptor">${tint(rec)}</g>` + (coat ? `<g class="clickable" data-g="clathrin">${coat}</g>` : '');
      /* динамин на шейке */
      if (T > 4){
        const w = m.neck + 9, op = ease((T - 4) / .5).toFixed(2);
        const r = (x, y) => `<rect x="${f1(x)}" y="${f1(y)}" width="18" height="7" rx="3" fill="${BF.C.dyn}"/>`;
        out.s += `<g class="clickable" data-g="dynamin" opacity="${op}">${r(LC - w - 18, m.yn - 8)}${r(LC - w - 18, m.yn + 2)}${r(LC + w, m.yn - 8)}${r(LC + w, m.yn + 2)}</g>`;
      }
      if (T >= 3.5) out.labels += `<text class="lbl-l" x="226" y="${Y + 56}" font-size="12" text-anchor="end">${t('s1_lbl_pit')}</text>`;
      return out;
    }
    /* везикула отделилась: клатрин только с цитоплазматической стороны, поэтому кольцо замыкается, когда везикула отошла от мембраны */
    const cy0 = cap(LC, Y, LR, LRR, TH_NECK).cy, v = ease(part01(T, 5)), y = +f1(lerp(cy0, 330, v)), u = part01(T, 6);
    if (v < .5) out.feat = dip(LC, Y, 24, 3 * (1 - v / .5));
    const phis = AR.map(a => 90 - a / LR * 180 / Math.PI), n = 32, r = LR + 26 + 26 * ease(u);
    let ring = '';
    for (let i = 0; i < n; i++){ const a = i / n * 2 * Math.PI, x = LC + Math.cos(a) * r, yy = y + Math.sin(a) * r;
      if (yy > Y + 24) ring += `<circle cx="${f1(x)}" cy="${f1(yy)}" r="3.6" fill="${BF.C.clath}"/>`; }
    const ves = `<circle cx="${LC}" cy="${y}" r="${LR}" fill="#fff"/>` + BF.bilayerPts(BF.circlePts(LC, y, LR), { closed: true }) + tint(BF.recRadial(LC, y, LR, phis, pitCargo, u < .35));

  /* актин в выросте: штриховая дуга по средней линии выроста */

  function macro(T, stop){
    const out = { feat: null, s: '', labels: '' };
    const u0 = ease(part01(T, 0));
    out.s += `<g class="clickable" data-g="gf">${BF.receptor(76, Y - 6, -1, false)}<circle cx="${f1(lerp(36, 76, u0))}" cy="${f1(lerp(70, Y - 24, u0))}" r="6" fill="#C0392B"/></g>`;
    out.labels += `<text class="lbl" x="62" y="52" font-size="12">${t('s1_lbl_gf')}</text>`;
    if (stop <= 1 || T <= 1) return out;
    const th0 = MF.th0Of(GCy, Y, GRo), a0 = th0 + .12;
    if (T < 3){
      const u1 = ease(part01(T, 1)), u2 = ease(part01(T, 2));

      out.labels += `<text class="lbl" x="${GC}" y="${Y + 62}" font-size="12">${t('s1t_lbl_fold')}</text>`;
      return out;
    }
    const v = ease(part01(T, 3)), y = +f1(lerp(GCy, 300, v)), k = 1 - v;

  /* фагоцитоз: псевдоподии с двух сторон охватывают частицу */

    else if (saved) { set(saved[0], saved[1]); saved = null; }

  SCENES[K] = { update, caseShow, tick: tl.tick, poe: [
    { n: 3, ok: 0, pre(){ set('lig', 'none'); }, apply(){ run('lig', 'clath'); } },
    { n: 3, ok: 0, pre(){ set('gf', 'none'); }, apply(){ run('gf', 'actin'); } },
    { n: 3, ok: 0, pre(){ set('part', 'none'); }, apply(){ run('part', 'clath'); } },

})();

  }

/* =====================================================================
   Вопрос 4. Ядерная пора и общий принцип адресации
   4b — базовый: груз × убранная деталь
   4a — продвинутый: сигнал ядерной локализации (Kalderon et al., 1984) и пассивная проницаемость поры (Timney et al., 2016)
   Геометрия — BF.nucScene (s0_figs.js). Все подписи — через t().
   ===================================================================== */
(function(){
  const K = '4b', { ease, lerp } = MF;
  layout(K);

  /* ---- ход процесса: этапы описаны для выделенной молекулы; модель BF.nucScene(...).res не меняется ---- */
  const STAGES = { small: 3, big: 2, nls: 4, nes: 4 };
  const stageKeys = c => Array.from({ length: STAGES[c] }, (_, i) => `s4t_${c}_${i + 1}`);
  let caseCause = null;   /* «Найти причину»: скрытая причина, показанная на схеме после решения */
  function stopOf(cargo, rm){
    if (caseCause === 'mut') return 1;
    if (cargo === 'nls' && rm === 'imp') return 1;   /* NLS не узнаётся */
    if (cargo === 'nls' && rm === 'ran') return 3;   /* комплекс проходит пору, груз не освобождается */
    if (cargo === 'nes' && (rm === 'exp' || rm === 'ran')) return 1;   /* комплекс не образуется */
    return STAGES[cargo];
  }
  window.STOP4B = stopOf;   /* для автотеста */
  const N = { small: 26, big: 10, nls: 10, nes: 10 };
  const secs = (cargo, stop) => stop === 1 ? 6 : cargo === 'big' ? 3.5 : cargo === 'small' ? 3 : 1.7;

  /* положение каждой частицы — чистая функция времени: ползунок перематывает, снимки воспроизводимы */
  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const CY = { x0: 34, x1: 566, y0: 94, y1: 150 }, NU = { x0: 34, x1: 566, y0: 298, y1: 362 };
  const PORES = [206, 394], MOUTH_T = 168, MOUTH_B = 252;

    const x = xc + 16 * Math.sin(1.1 * tau + 6.3 * rnd(i, 3)) + 8 * Math.sin(2.3 * tau + 6.3 * rnd(i, 4));
    const y = yc + 12 * Math.sin(1.4 * tau + 6.3 * rnd(i, 5)) + 5 * Math.sin(2.9 * tau + 6.3 * rnd(i, 6));
    return [Math.max(box.x0, Math.min(box.x1, x)), Math.max(box.y0, Math.min(box.y1, y))];
  }
  /* переход через пору: к устью, по каналу, от устья */
  function leg(p0, px, p1, u){
    const down = p1[1] > p0[1], a = [px, down ? MOUTH_T : MOUTH_B], b = [px, down ? MOUTH_B : MOUTH_T], P = [p0, a, b, p1];

  }
  const f1 = x => (+x).toFixed(1);
  const halo = (p) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="24" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  const ranDot = (p, op = 1) => `<g class="clickable" data-g="ran"><circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="6" fill="#1E7B4A" stroke="#1E7B4A" stroke-width="2" opacity="${op}"/></g>`;

    const arc = imp ? P.imp : P.exp, tag = caseCause === 'mut' ? 'mut' : imp ? 'nls' : 'nes';
    let s = '', top = 0, bot = 0, focus = null; const pts = [];

      const tau = blocked ? T * 2.2 : T + .9 * i / (n - 1), px = PORES[i % 2];

        if (!imp){ const r0 = [c[0] + 46, c[1] + 26]; ran = [lerp(r0[0], c[0] + 13, b), lerp(r0[1], c[1] + 15, b)]; ranOp = b; }

      if (c[1] < MOUTH_T + 2) top++; else if (c[1] > MOUTH_B - 2) bot++;

  function plain(T){

  function small(T){

/* =====================================================================
   s9z_case.js — режим «Найти причину» (прототип). Идея — из интерактивной клетки курса «Молекулярная биология».
   Образец со скрытой причиной; студент выбирает измерения. Задача решена, только если данные
   оставляют одно объяснение: верная догадка без данных не засчитывается.
   Логика (caseFits, caseMinimal) — чистые функции; все подписи — через t().
   ===================================================================== */
const CASE_SPEC = {
  '1b': { id: 'c1', causes: ['nosyn', 'noer', 'nobind', 'noadapt', 'dyn'], meth: {
    tot:  { ctrl: 'yes',  nosyn: 'no',   noer: 'yes',  nobind: 'yes',  noadapt: 'yes',  dyn: 'yes' },
    rec:  { ctrl: 'yes',  nosyn: 'no',   noer: 'no',   nobind: 'yes',  noadapt: 'yes',  dyn: 'yes' },
    bind: { ctrl: 'yes',  nosyn: 'no',   noer: 'no',   nobind: 'no',   noadapt: 'yes',  dyn: 'yes' },
    pit:  { ctrl: 'in',   nosyn: 'none', noer: 'none', nobind: 'in',   noadapt: 'out',  dyn: 'in' },
    em:   { ctrl: 'norm', nosyn: 'norm', noer: 'norm', nobind: 'norm', noadapt: 'norm', dyn: 'stalled' },
    tf:   { ctrl: 'norm', nosyn: 'norm', noer: 'norm', nobind: 'norm', noadapt: 'norm', dyn: 'low' },
    fl:   { ctrl: 'norm', nosyn: 'norm', noer: 'norm', nobind: 'norm', noadapt: 'norm', dyn: 'norm' },
  } },
  '4b': { id: 'c4', causes: ['mut', 'exp', 'ran'], meth: {
    ctl:  { ctrl: 'cyto', mut: 'cyto', exp: 'nuc',  ran: 'nuc' },
    nls:  { ctrl: 'nuc',  mut: 'nuc',  exp: 'nuc',  ran: 'both' },
    bind: { ctrl: 'yes',  mut: 'no',   exp: 'no',   ran: 'no' },
  } },
};
/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (set.length < best.length && caseFits(spec, set, truth).length === 1) best = set;
  }
  return best;
}
window.CASE_LOGIC = { CASE_SPEC, caseFits, caseMinimal };

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };
(function(){
  const url = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`);
  Object.keys(CASE_SPEC).forEach(K => {
    const sec = $('sc' + K);
    sec.querySelector('.side').insertAdjacentHTML('afterbegin', `<div class="panel case" id="case${K}" hidden></div>`);
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', `<div class="veil" aria-hidden="true"><b>${t('case_veil')}</b><span>${t('case_veil_s')}</span></div>`);
  });
  const val = (S, m, v) => t(`${S.id}_v_${m}_${v}`);
  /* решение проверяется и после выбора объяснения, и после каждого измерения */
  function settle(K, S){
    if (!CASE.solved && CASE.done.length && CASE.guess === CASE.truth && caseFits(S, CASE.done, CASE.truth).length === 1){
      CASE.solved = true; $('sc' + K).classList.add('casedone'); SCENES[K].caseShow(CASE.truth);
    }
  }
  const ctl = (S, m) => { const k = `${S.id}_v_${m}_${S.meth[m].ctrl}`; return t(TEXTS[k + '_c'] ? k + '_c' : k); };   /* в строке контроля «как в контроле» не годится */
  function start(K, seed){
    const S = CASE_SPEC[K];
    /* порядок измерений и объяснений перемешивается, как в сценариях; ?fixed — постоянный порядок */
    const mix = a => { a = a.slice(); if (!url.has('fixed')) for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    Object.assign(CASE, { on: true, K, seed, truth: S.causes[seed % S.causes.length], done: [], guess: null, solved: false, open: null, mo: mix(Object.keys(S.meth)), co: mix(S.causes) });
    POE.on = false; poeRender();
    const sec = $('sc' + K); sec.classList.add('casemode'); sec.classList.remove('casedone');
    SCENES[K].caseShow(null); render(); sync();
    if (window.matchMedia && matchMedia('(max-width:1000px)').matches) $('case' + K).scrollIntoView({ block: 'start' });
  }
  function exit(){
    if (!CASE.on) return;
    const K = CASE.K, sec = $('sc' + K); CASE.on = false;
    sec.classList.remove('casemode', 'casedone'); $('case' + K).hidden = true; $('case' + K).innerHTML = '';
    SCENES[K].caseShow(null); SCENES[K].update(); sync();
  }
  function verdict(S){
    const g = CASE.guess; if (!g) return '';
    if (CASE.solved) return '';
    const fits = caseFits(S, CASE.done, CASE.truth);
    if (!CASE.done.length) return `<p class="cv warn">${t('case_need')}</p>`;
    if (!fits.includes(g)){
      const m = CASE.done.find(x => S.meth[x][g] !== S.meth[x][CASE.truth]);
      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
    }
    return `<p class="cv warn">${t(fits.length === 2 ? 'case_more1' : 'case_more', { n: fits.length - 1 })}</p>`;
  }
  function render(){
    const K = CASE.K, S = CASE_SPEC[K], box = $('case' + K); box.hidden = false;
    let h = `<div class="k">${t('case_k')}</div><h3 class="ct">${t(S.id + '_title')}</h3>${TEXTS[S.id + '_tag'] ? `<p class="ctag">${t(S.id + '_tag')}</p>` : ''}<p class="co">${t(S.id + '_obs')}</p><p class="cnote">${t('case_note')}</p>`;
    h += `<div class="ch">${t('case_meas')}</div><div class="cm">`;
    CASE.mo.forEach(m => {
      const on = CASE.done.includes(m), open = CASE.open === m;
      h += `<div class="crow${on ? ' on' : ''}"><button type="button" class="cmb" data-m="${m}"${on ? ' aria-pressed="true"' : ''}${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_m_${m}`)}</button>` +
        `<button type="button" class="cq" data-q="${m}" aria-expanded="${open}" aria-label="${t('case_meth')}: ${esc(t(`${S.id}_m_${m}`))}">${t('case_meth')}</button>` +
        (on ? `<div class="cres"><span>${t('case_ctrl')}: ${ctl(S, m)}</span><b>${t('case_sample')}: ${val(S, m, S.meth[m][CASE.truth])}</b></div>` : '') +
        (open ? `<p class="cmeth">${t(`${S.id}_k_${m}`)}</p>` : '') + `</div>`;
    });
    h += `</div><div class="ch">${t('case_why')}</div><div class="cc">`;
    CASE.co.forEach(c => {
      const right = CASE.solved && c === CASE.truth;
      h += `<button type="button" class="ccb${CASE.guess === c ? ' picked' : ''}${right ? ' right' : ''}" data-c="${c}"${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_c_${c}`)}</button>`;
    });
    h += `</div><div role="status">${verdict(S)}</div>`;
    if (CASE.solved){
      const min = caseMinimal(S, CASE.truth);
      const flat = Object.keys(S.meth).filter(m => new Set(S.causes.map(c => S.meth[m][c])).size === 1);
      h += `<div class="cdone" role="status"><b>${t('case_ok')}</b><p>${t(`${S.id}_w_${CASE.truth}`)}</p>` +
        (TEXTS[S.id + '_after'] ? `<p class="cmin">${t(S.id + '_after')}</p>` : '') +
        `<p class="cmin">${t('case_used', { n: CASE.done.length, k: min.length })} ${t('case_enough', { m: min.map(x => '«' + t(`${S.id}_m_${x}`) + '»').join(', ') })}</p>` +
        flat.map(m => `<p class="cmin">${t('case_flat', { m: t(`${S.id}_m_${m}`) })}</p>`).join('') +
        `<p class="cmin"><a href="${t(S.id + '_link_h')}">${t(S.id + '_link_t')}</a></p></div>`;
    }
    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;
    box.innerHTML = h;
    const keep = sel => { const e = $('case' + K).querySelector(sel); if (e && !e.disabled) e.focus({ preventScroll: true }); };   /* панель перестраивается: фокус не теряется */
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      if (!url.has('fixed')) do { seed = Math.floor(Math.random() * 9973); } while (S.causes[seed % S.causes.length] === CASE.truth);
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur]; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */

})();
