2m2_2_w2": "Гемислияния тоже нет: для него уже нужен SNARE-комплекс, а синаптобревин расщеплён.", "p2m2_2_w3": "Тетанотоксин блокирует слияние с самого начала: гемислияния и пор нет, удерживаемых пузырьков больше.", "p2m2_3_q": "Часть пузырьков всё же распласталась, и их мембрана встроилась в плазматическую. Что видно на краю активной зоны через 100–300 мс?", "p2m2_3_o1": "Эндоцитозные структуры около 80 нм — мембрана возвращается в клетку.", "p2m2_3_o2": "Ничего: встроенная мембрана остаётся в плазматической.", "p2m2_3_o3": "Клатриновые ямки, число которых за 300 мс резко выросло.", "p2m2_3_e": "Через 100–300 мс на краю активной зоны становится больше эндоцитозных структур около 80 нм; авторы считают их сверхбыстрым эндоцитозом. Число клатриновых ямок за эти 300 мс не менялось.", "p2m2_3_w2": "По предположению авторов, мембрана не остаётся: уже через 100–300 мс её забирают эндоцитозные структуры около 80 нм.", "p2m2_3_w3": "Число клатриновых ямок за первые 300 мс не менялось; мембрану забирают эндоцитозные структуры около 80 нм на краю активной зоны.", "s2m2_lim1": "Ход событий между засечками.", "s2m2_lim2": "Поведение одного пузырька во времени: последовательность восстановлена по снимкам разных синапсов.", "s2m2_lim3": "Процессы в ткани мозга: это культура нейронов.", "s2m2_lim4": "Как получены оценки времени. Выход медиатора около 50 мкс — расчёт по закону диффузии: глутамат выходит из пузырька радиусом 20 нм через пору длиной 10 нм; за 46–53 мкс в пузырьке остаётся 1/e молекул, 95 % выходит за 106–159 мкс. Пора открыта около 2 мс — минимальная модель переходов между состояниями по снимкам через 4 мс (0,54 + 1,36 = 1,90 мс); авторы называют это нижней оценкой.", "s2m2_lim5": "Действие тетанотоксина в других моментах: его сравнивали только в покое и через 8 мс.", "gn_meth_m2m2": "Метод · время-разрешённая криоэлектронная томография синапсов", "g_meth_m2m2": "Что измеряется: трёхмерное строение нервных окончаний, замороженных в заданный момент после потенциала действия. Уровень: отдельные пузырьки и поры; нанометры; миллисекунды (по моменту замораживания). Контроль: синапсы без стимуляции; синапсы с тетанотоксином; все группы — с CNQX. Типичный артефакт: точки 4 и 8 мс сняты при более низкой температуре; культура, а не ткань мозга; последовательность восстановлена по разным синапсам. Чего не доказывает: что плотности рядом с порой — SNARE-комплексы (авторы называют их предположительными); как долго открыта пора: около 2 мс — нижняя оценка по модели.", "gn_synves": "Синаптический пузырёк", "g_synves": "Сверх программы: мелкий (около 40 нм) мембранный пузырёк нервного окончания, заполненный медиатором; выделяет медиатор при слиянии с пресинаптической мембраной.", "gn_syb": "Синаптобревин", "g_syb": "Сверх программы: SNARE-белок мембраны синаптического пузырька (R-SNARE, другое название — VAMP2); его расщепляет тетанотоксин, и слияние пузырька с мембраной прекращается.", "gn_glu": "Медиатор", "g_glu": "Вещество, которое нервное окончание выделяет в синаптическую щель при слиянии синаптических пузырьков с пресинаптической мембраной, например глутамат.", "gn_az": "Активная зона", "g_az": "Сверх программы: участок пресинаптической мембраны, у которого удерживаются синаптические пузырьки и происходит их слияние.", "gn_tent": "Тетанотоксин", "g_tent": "Сверх программы: белковый токсин возбудителя столбняка — протеаза, расщепляющая синаптобревин; без синаптобревина синаптические пузырьки не сливаются с мембраной.", "gn_ufe": "Сверхбыстрый эндоцитоз", "g_ufe": "Сверх программы: захват мембраны на краю активной зоны в первые сотни миллисекунд после выброса медиатора.", "gn_hemi": "Гемислияние", "g_hemi": "Сверх программы: промежуточное состояние слияния, при котором слиты только обращённые друг к другу (проксимальные) монослои двух мембран, а поры ещё нет. Авторы работы о синапсе называют такое состояние частично слитым.", "gn_pore": "Пора слияния", "g_pore": "Сверх программы: канал, который соединяет просвет носителя с просветом мишени (или с внеклеточной средой при экзоцитозе) в момент слияния мембран.", "s3m_cond": "Один цикл эндоцитоза и возврата рецептора в клетке; pH на поверхности 7,4; pH эндосом — по измерениям в клетках HeLa (увеличенные эндосомы — модельная система): около 6,6 до прихода Rab5, около 5,7 в Rab7-положительных эндосомах; в эндолизосомах и лизосомах 4,0–5,7. Три пары изучены в разных клетках и разными методами; модель сводит их на одну шкалу только для сравнения.", "s3m_status": "Модель по данным: засечки pH — измеренные значения; состояния пар — по работам, где они измерены (для ЛПНП — по обзору); между засечками состояние не измерено. Клинический пример — иллюстрация механизма", "s3m_sl": "pH среды вокруг рецептора", "s3m_mk74": "поверхность клетки", "s3m_mk66": "pH эндосом до прихода Rab5 — измерение в клетках HeLa (отдельная работа)", "s3m_mk65": "граница отделения ЛПНП — обобщение из обзоров, не измерение в этой точке", "s3m_mk57": "pH Rab7-положительных эндосом — измерение в клетках HeLa (та же отдельная работа)", "s3m_mk54": "условия экспериментов с трансферрином", "s3m_mk50": "условия экспериментов с трансферрином", "s3m_hatch": "штриховка — переход: положение не измерено; pH 5–6 — обобщённый диапазон связывания IgG с FcRn", "s3m_ex": "Избыток IgG", "s3m_ex_off": "нет", "s3m_ex_on": "есть", "s3m_lbl_surf": "поверхность, pH 7,4", "s3m_lbl_endo": "эндосома", "s3m_lbl_lyso": "лизосома", "s3m_lbl_na": "не измерено", "s3m_lbl_ph": "pH", "s3m_lbl_band": "IgG–FcRn: pH 5–6 (обобщение)", "s3m_lane_ldl": "ЛПНП и рецептор ЛПНП", "s3m_lane_tf": "Трансферрин и его рецептор", "s3m_lane_igg": "IgG и FcRn", "s3m_row_ldl": "ЛПНП", "s3m_row_tf": "трансферрин", "s3m_row_igg": "IgG", "s3m_lg_on": "связаны", "s3m_lg_off": "не связаны", "s3m_lg_na": "не измерено", "s3m_r_x": "pH среды вокруг рецептора", "s3m_r_stage": "Стадия цикла", "s3m_v_stage_0": "начало цикла: поверхность клетки", "s3m_v_stage_1": "кислая эндосома", "s3m_v_stage_2": "возврат на поверхность", "s3m_r_ldl": "ЛПНП — рецептор ЛПНП", "s3m_v_ldl_n": "связаны", "s3m_v_ldl_rel": "ниже 6,5 ЛПНП отделяется", "s3m_v_ldl_acid": "ЛПНП отделён; рецептор уходит на возврат, ЛПНП — в лизосому", "s3m_v_ldl_back": "рецептор возвращается без ЛПНП; ЛПНП остаётся в эндосоме и уходит в лизосому", "s3m_r_tf": "Трансферрин — рецептор", "s3m_v_tf_n": "трансферрин с железом связан с рецептором, отделяется медленно (полупериод 7,5 мин при 37 °C, клетки HepG2); апотрансферрин отделяется быстро (16 с)", "s3m_v_tf_na": "— (не измерено)", "s3m_v_tf_acid": "железо отделяется (полупериод около 1,5 мин при pH 5 и 37 °C, в присутствии хелатора — вещества, связывающего железо), апотрансферрин остаётся на рецепторе", "s3m_v_tf_ap": "апотрансферрин связан с рецептором при pH 5,4 (измерено); состояние железа в этой точке не измерено", "s3m_v_tf_surf": "на поверхности при pH 7,4 апотрансферрин отделяется от рецептора (около 16 с при 37 °C, клетки HepG2)", "s3m_v_tf_back": "апотрансферрин остаётся на рецепторе и возвращается на поверхность; промежуточные pH при возврате не измерены", "s3m_v_ldl_n2": "связаны (по обзору отделение ниже pH 6,5; в этой точке не измерено)", "s3m_r_igg": "IgG — FcRn", "s3m_v_igg_n": "связывание утрачено", "s3m_v_igg_na": "— (не измерено)", "s3m_v_igg_acid": "при pH 5–6 IgG связывается с FcRn", "s3m_v_igg_surf": "на поверхности при pH 7,4 связывание с FcRn утрачено, IgG отделяется", "s3m_v_igg_back": "IgG остаётся на FcRn и возвращается на поверхность", "s3m_r_ex": "Избыток IgG", "s3m_v_ex": "качественно: избыток IgG, не связанный с FcRn, направляется в лизосомы", "s3m_st1": "На поверхности при pH 7,4: ЛПНП и трансферрин с железом связаны со своими рецепторами; IgG с FcRn не связан и захватывается вместе с жидкостью.", "s3m_st2": "Ранняя эндосома закисляется: ЛПНП отделяется от рецептора, при более низком pH от трансферрина отделяется железо.", "s3m_st3": "В кислой эндосоме IgG связывается с FcRn; трансферрин остаётся на своём рецепторе.", "s3m_st4": "Рецепторы возвращаются на поверхность: при pH 7,4 отделяются апотрансферрин и IgG, ЛПНП остаётся в эндосоме и уходит в лизосому.", "s3m_note": "Бегунок pH движется по маршруту 7,4 → 5,7 → 7,4 (возврат); три дорожки идут синхронно. pH 5,7 измерен в Rab7-положительных эндосомах; сортировка на возврат идёт и в более ранних эндосомах. Порядок этапов — учебная модель.", "s3m_c_74": "При pH 7,4 ЛПНП и трансферрин с железом связаны с рецепторами, а IgG с FcRn — нет.", "s3m_c_74_z": "Нейтральная среда поверхности удерживает одни комплексы и разрушает другие: всё определяется свойствами пары.", "s3m_c_pre": "При pH {x} ЛПНП ещё связан с рецептором; трансферрин и IgG в переходе (не измерено).", "s3m_c_pre_z": "ЛПНП отделяется ниже pH 6,5; для двух других пар состояние между засечками не измерено.", "s3m_c_ee": "При pH {x} ЛПНП уже отделился от рецептора; трансферрин и IgG ещё в переходе (не измерено).", "s3m_c_ee_z": "Кислая среда отделяет ЛПНП раньше, чем измерены изменения двух других пар.", "s3m_c_acid": "При pH {x} ЛПНП отделён, IgG связан с FcRn; для трансферрина эта точка не измерена (при pH 5,0–5,4 апотрансферрин остаётся на рецепторе).", "s3m_c_acid_z": "Одна и та же кислая среда отделяет одни лиганды, другие оставляет связанными, а третьи присоединяет. Поэтому на поверхность возвращаются апотрансферрин и IgG, а ЛПНП уходит в лизосому.", "s3m_c_ret": "При возврате на поверхность (pH 7,4) апотрансферрин и IgG отделяются от рецепторов; ЛПНП остался в эндосоме.", "s3m_c_ret_z": "Нейтральная среда поверхности снова разрушает комплексы апотрансферрина с рецептором и IgG с FcRn: рецепторы освобождены для нового цикла.", "s3m_c_back": "Рецепторы возвращаются на поверхность; в этом положении pH при возврате не измерен.", "s3m_c_back_z": "Возвращается то, что осталось на рецепторе: апотрансферрин и IgG; ЛПНП остался в просвете эндосомы.", "s3m_take": "Кислая среда эндосомы — общее условие, а исход задаёт сама пара «рецептор — лиганд»: ЛПНП отделяется; трансферрин теряет железо, но остаётся на рецепторе; IgG, наоборот, связывается с FcRn только в кислой среде и поэтому не попадает в лизосому.", "s3m_clin": "Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма. Препараты, занимающие FcRn, ускоряют расщепление IgG, в том числе аутоантител, — их применяют при аутоиммунных болезнях.", "p3m_1_q": "Клетка эндотелия сосуда захватывает IgG из плазмы вместе с жидкостью (пиноцитоз). В крови pH 7,4, а в эндосоме среда закисляется (в клетках HeLa — от примерно 6,6 до примерно 5,7). Где IgG свяжется с рецептором FcRn?", "p3m_1_o1": "В кислой эндосоме; на поверхности при pH 7,4 комплекс распадается.", "p3m_1_o2": "На поверхности клетки, а в кислой эндосоме отделится, как ЛПНП.", "p3m_1_o3": "Нигде: IgG проходит через клетку без рецептора.", "p3m_1_e": "FcRn связывает Fc-участок IgG при pH 5–6 и теряет связывание при pH 7,4. Поэтому комплекс образуется в ранней эндосоме, а на поверхности IgG освобождается. Логика обратна ЛПНП: там кислая среда разъединяет пару.", "p3m_1_w2": "Так ведёт себя ЛПНП. У FcRn наоборот: при pH 7,4 связывания с IgG нет, при pH 5–6 оно есть.", "p3m_1_w3": "IgG захватывается клеткой при эндоцитозе; без FcRn он остаётся в эндосоме и уходит в лизосому.", "p3m_2_q": "Что будет с молекулой IgG, которая в эндосоме не связалась с FcRn?", "p3m_2_o1": "Она останется в созревающей эндосоме и попадёт в лизосому.", "p3m_2_o2": "Она вернётся на поверхность с другими рецепторами.", "p3m_2_o3": "Она выйдет в цитоплазму.", "p3m_2_e": "Возвращается только IgG, связанный с FcRn. Несвязанный IgG направляется в лизосомы и расщепляется. Поэтому связывание с FcRn продлевает жизнь IgG в крови.", "p3m_2_w2": "На поверхность уходят мембранные рецепторы; растворимый лиганд, не связанный с рецептором, остаётся в просвете эндосомы.", "p3m_2_w3": "Белок из просвета эндосомы не переходит в цитоплазму: он отделён мембраной.", "p3m_3_q": "Эндосома закислилась до pH около 5,7. Какой из трёх лигандов — ЛПНП, трансферрин или IgG — уйдёт в лизосому?", "p3m_3_o1": "ЛПНП: он отделился от рецептора и остался в просвете эндосомы.", "p3m_3_o2": "Трансферрин: кислая среда отделила его от рецептора.", "p3m_3_o3": "IgG: кислая среда отделила его от FcRn.", "p3m_3_e": "В кислой эндосоме ЛПНП отделяется от рецептора и остаётся в просвете; трансферрин при более низком pH теряет железо, но остаётся на рецепторе; IgG, наоборот, связывается с FcRn. Рецепторы возвращают на поверхность то, что на них осталось.", "p3m_3_w2": "От трансферрина в кислой среде отделяется железо, а сам белок (апотрансферрин) остаётся на рецепторе и возвращается на поверхность.", "p3m_3_w3": "IgG в кислой среде, наоборот, связывается с FcRn и возвращается на поверхность.", "s3m_lim1": "Между засечками состояния пар не измерены; переходы нарисованы штриховкой.", "s3m_lim2": "Три пары изучены в разных клетках и разными методами; модель сводит их на одну шкалу только для сравнения.", "s3m_lim3": "FcRn показан в обобщённой клетке; в организме (по данным на мышах) IgG возвращают прежде всего клетки эндотелия сосудов, макрофаги и моноциты — клетки с интенсивным пиноцитозом.", "gn_meth_m3m": "Метод · измерение pH в эндосомах флуоресцентным датчиком", "g_meth_m3m": "Что измеряется: отношение флуоресценции двух белков датчика, чувствительное к pH, в отдельных эндосомах; перевод в pH по калибровке. Уровень: отдельные эндосомы в живой клетке. Контроль: калибровка в средах с известным pH при уравнивании pH ионофором; в клетках без белка Ccz1 закисление эндосом сильно задерживается. Типичный артефакт: увеличенные эндосомы, полученные воздействием на клетку, — модельная система; избыточная экспрессия меченых белков могла влиять на результат. Чего не доказывает: при каком pH отделяется конкретный лиганд — это измеряют отдельно, на очищенных рецепторах или клетках.", "gn_ldl": "Липопротеин низкой плотности (ЛПНП)", "g_ldl": "Сверх программы: частица крови, переносящая холестерин: ядро из эфиров холестерина окружено оболочкой из фосфолипидов, холестерина и одной молекулы белка apoB100.", "gn_ldlr": "Рецептор ЛПНП", "g_ldlr": "Сверх программы: трансмембранный рецептор, связывающий ЛПНП на поверхности клетки; в кислой ранней эндосоме ЛПНП отделяется, и рецептор возвращается на поверхность.", "gn_igg": "Иммуноглобулин G (IgG)", "g_igg": "Основной класс антител плазмы крови; константный Fc-участок молекулы связывается с Fc-рецепторами клеток.", "gn_fcrn": "Неонатальный Fc-рецептор (FcRn)", "g_fcrn": "Сверх программы: рецептор, связывающий Fc-участок IgG при pH 5–6 и не связывающий его при pH 7,4; возвращает IgG из эндосом на поверхность клетки и тем защищает его от расщепления в лизосомах.", "gn_phendo": "pH эндосомы", "g_phendo": "Кислотность просвета эндосомы; снижается по мере созревания эндосомы за счёт протонной АТФазы её мембраны; в лизосоме среда самая кислая.", "s3m2_cond": "Ранняя эндосома обобщённой клетки; комплексы возврата изучены на очищенных белках и в клетках человека (HEK293T, RPE1, HeLa; в части экспериментов — с удалёнными генами); строение комплексов — по криоэлектронной микроскопии и предсказанию структуры.", "s3m2_status": "Качественная схема по трём работам, по одной на шаг: исходы для SNX27, SNX17 и Commander — по экспериментам с удалением белков, для убиквитина и хвоста без мотива — по справочным данным и ЗАКЛЮЧЕНИЕ модели; доли груза и скорость не моделируются; положения бегунка — не измеренные значения", "s3m2_mo": "Мотив в цитоплазматическом хвосте груза", "s3m2_mo_pdz": "концевой PDZ-связывающий (GLUT1)", "s3m2_mo_npxy": "ØxNxx[Y/F] с NPxY (β1-интегрин, LRP1)", "s3m2_mo_ub": "убиквитин", "s3m2_mo_none": "без мотива", "s3m2_27": "SNX27", "s3m2_17": "SNX17", "s3m2_17dc": "без C-концевого участка", "s3m2_yes": "есть", "s3m2_no": "нет", "s3m2_cmd": "Commander", "s3m2_cmd_ok": "норма", "s3m2_cmd_bad": "нарушен", "s3m2_sl": "Количество груза с мотивом в эндосоме", "s3m2_sl_note": "Положения бегунка — не измеренные значения: в работе связывание SNX17 с ретривером растёт с дозой пептида груза (очищенные белки), абсолютные числа на странице не приводятся.", "s3m2_qm1": "мало (качественно)", "s3m2_qs1": "мало", "s3m2_q1": "мало", "s3m2_qm2": "средне (качественно)", "s3m2_qs2": "средне", "s3m2_q2": "средне", "s3m2_qm3": "много (качественно)", "s3m2_qs3": "много", "s3m2_q3": "много", "s3m2_lbl_ret": "участок возврата: ESCPE-1, ретромер", "s3m2_lbl_cmd": "ретривер и CCC — части Commander", "s3m2_lbl_endo": "ранняя эндосома", "s3m2_lbl_cyto": "цитоплазма", "s3m2_lbl_surf": "на поверхность клетки", "s3m2_lbl_lyso": "в лизосому", "s3m2_lbl_note": "исход выбран по таблице экспериментов с удалением белков; доли груза не моделируются", "s3m2_out_rec": "возврат через участок возврата", "s3m2_out_lyso": "лизосома", "s3m2_out_stay": "остаётся в созревающей эндосоме → лизосома (качественный вывод)", "s3m2_out_ilv": "внутрипросветный пузырёк → лизосома", "s3m2_o_pdz_ok": "SNX27 узнаёт концевой мотив и передаёт груз белкам ESCPE-1 трубчатого носителя.", "s3m2_o_pdz_no": "Без SNX27 груз не попадает в носитель возврата и вместе с эндосомой уходит в лизосому.", "s3m2_o_npxy_ok": "Груз связывает SNX17, освобождая его C-концевой участок; этот участок связывает ретривер, и груз передаётся в участок возврата.", "s3m2_o_npxy_no": "Без SNX17 или целого Commander возврат груза нарушен.", "s3m2_o_npxy_27": "В экспериментах одна система возврата не компенсировала потерю другой.", "s3m2_o_dc": "ЗАКЛЮЧЕНИЕ: без этого участка SNX17 не может связать ретривер — связывание нарушают замены в самом участке.", "s3m2_o_ub": "Убиквитинированный груз включается во внутрипросветные пузырьки (по справочным данным).", "s3m2_o_none": "ЗАКЛЮЧЕНИЕ модели: без сигнала сортировки груз остаётся в созревающей эндосоме и, по качественному выводу, попадает в лизосому; в этих работах путь такого груза не изучали.", "s3m2_st0": "Груз с выбранным хвостом находится в мембране ранней эндосомы.", "s3m2_st1": "SNX17 закрыт: собственный C-концевой участок занимает бороздку, которая связывает груз.", "s3m2_st2": "Хвост груза с мотивом ØxNxx[Y/F] вытесняет этот участок из бороздки.", "s3m2_st3": "Освобождённый участок SNX17 связывает ретривер, и груз передаётся в трубчатый участок возврата эндосомы.", "s3m2_note": "Цикл останавливается на первой недостающей детали. Анимация — качественная схема, время условное.", "s3m2_r_mo": "Мотив в хвосте", "s3m2_r_out": "Исход", "s3m2_r_why": "Почему", "s3m2_r_aff": "Сродство груза к закрытому SNX17", "s3m2_v_aff": "примерно вдвое ниже, чем к SNX17 без C-концевого участка", "s3m2_r_open": "SNX17 в открытой форме и ретривер на эндосоме", "s3m2_r_open_s": "в эксперименте на очищенных белках: чем больше пептида груза, тем больше SNX17 связывается с ретривером; перенос на эндосому — толкование модели", "s3m2_v_open1": "меньше (качественно)", "s3m2_v_open2": "средне (качественно)", "s3m2_v_open3": "больше (качественно)", "s3m2_c_pdz": "Хвост с концевым PDZ-связывающим мотивом узнаёт SNX27; груз переходит в трубчатый носитель ESCPE-1 и возвращается на поверхность.", "s3m2_c_pdz_z": "Узнающий белок и белки, изгибающие мембрану в трубку, — разные белки: SNX27 передаёт груз ESCPE-1.", "s3m2_c_npxy": "Хвост с мотивом NPxY узнаёт SNX17; освобождённый C-концевой участок SNX17 связывает ретривер, и груз передаётся в участок возврата.", "s3m2_c_npxy_z": "Связывание груза открывает SNX17: без груза его C-концевой участок занимает бороздку связывания. Оба пути — через SNX27 и через SNX17 — ведут в один трубчатый участок возврата эндосомы.", "s3m2_c_wrong": "Мотив есть, но нужного комплекса возврата нет: груз уходит в лизосому.", "s3m2_c_wrong_z": "В экспериментах системы возврата не заменяли друг друга: каждая узнаёт свой мотив.", "s3m2_c_ub": "Убиквитинированный груз включается во внутрипросветные пузырьки и уходит в лизосому.", "s3m2_c_ub_z": "Убиквитин — метка, по которой груз включается в мембрану внутрипросветных пузырьков; путь ведёт в лизосому.", "s3m2_c_none": "Без сигнала сортировки груз остаётся в созревающей эндосоме.", "s3m2_c_none_z": "Комплексы возврата узнают мотив в хвосте; без мотива груз созревает вместе с эндосомой (качественно).", "s3m2_take": "Каким комплексом рецептор вернётся из эндосомы, определяет мотив в его цитоплазматическом хвосте: концевой PDZ-связывающий мотив узнаёт SNX27, мотив NPxY — SNX17; оба передают груз в общий трубчатый участок возврата. В экспериментах эти комплексы не заменяли друг друга.", "p3m2_1_q": "Из SNX17 удалили C-концевой участок. Как это скажется на связывании хвоста груза с мотивом NPxY и на возврате груза?", "p3m2_1_o1": "Груз связывается примерно вдвое прочнее, но SNX17 теряет участок, которым связывает ретривер.", "p3m2_1_o2": "Груз перестаёт связываться: C-концевой участок и есть место связывания груза.", "p3m2_1_o3": "Ничего не изменится: C-концевой участок не нужен.", "p3m2_1_e": "В свободном SNX17 C-концевой участок лежит в бороздке связывания груза, поэтому без него пептиды груза связываются с SNX17 примерно вдвое прочнее. Но на конце этого участка — мотив, которым SNX17 связывает ретривер: замены в нём почти полностью нарушают связывание. Без участка груз узнан, но передать его в участок возврата SNX17 не может.", "p3m2_1_w2": "Груз связывает FERM-домен; C-концевой участок лишь временно занимает эту бороздку, поэтому без него связывание даже прочнее.", "p3m2_1_w3": "C-концевой участок нужен дважды: он закрывает бороздку, пока груза нет, и связывает ретривер, когда груз его вытеснил. Проверено и иначе: ретривер с заменой в участке связывания SNX17 собирается нормально, но интегрин α5β1 в таких клетках уходит в лизосомы.", "p3m2_2_q": "В клетках HeLa без SNX27 переносчик глюкозы GLUT1 накапливается в лизосомах. В эти клетки вернули SNX27. Куда пойдёт GLUT1 и как он туда попадёт?", "p3m2_2_o1": "На поверхность клетки: SNX27 узнаёт его концевой мотив и передаёт белкам ESCPE-1 трубчатого носителя.", "p3m2_2_o2": "Останется в лизосомах: возврат после потери SNX27 не восстанавливается.", "p3m2_2_o3": "На поверхность, но через Commander.", "p3m2_2_e": "Возвращённый SNX27 снова извлекает GLUT1 из пути в лизосомы, и белок появляется на поверхности. FERM-домен SNX27 прямо связывает кислые мотивы в белках SNX1 и SNX2 комплекса ESCPE-1 — так груз переходит в трубчатый носитель.", "p3m2_2_w2": "Возврат восстанавливается, как только SNX27 снова синтезируется: новые молекулы GLUT1 снова попадают в носители возврата.", "p3m2_2_w3": "GLUT1 несёт PDZ-связывающий мотив, который узнаёт SNX27, а не SNX17; его путь — через ESCPE-1.", "p3m2_3_q": "При синдроме Ритшера–Шинцеля мутации затрагивают разные субъединицы Commander. Почему мутации разных генов дают сходное нарушение?", "p3m2_3_o1": "Commander работает как единый комплекс из 16 субъединиц; многие мутации, связанные с синдромом, лежат у мест соединения субъединиц и нарушают сборку комплекса.", "p3m2_3_o2": "Все мутации затрагивают один и тот же белок SNX17.", "p3m2_3_o3": "Каждая субъединица независимо возвращает свой груз.", "p3m2_3_e": "Commander состоит из ретривера (три белка), комплекса CCC (двенадцать белков, десять из них — белки COMMD, образующие кольцо) и белка DENND10. Многие мутации, связанные с синдромом, лежат вблизи мест соединения субъединиц, и эксперименты показали, что они нарушают сборку комплекса, поэтому эффект сходен.", "p3m2_3_w2": "SNX17 не входит в Commander: это отдельный белок, который передаёт груз ретриверу.", "p3m2_3_w3": "Субъединицы работают вместе: по отдельности они груз не возвращают.", "s3m2_lim1": "Как делится груз, у которого есть оба мотива.", "s3m2_lim2": "Скорость возврата.", "s3m2_lim3": "Что делают остальные из более чем 100 грузов SNX17.", "gn_meth_m3m2": "Метод · удаление гена и возврат белка («спасение»)", "g_meth_m3m2": "Что измеряется: где находится груз (поверхность или лизосомы) в клетках без белка этого комплекса и после его повторного синтеза. Уровень: популяция клеток (иммунофлуоресценция, количество белка на поверхности). Контроль: повторный синтез удалённого белка возвращает исходную картину; белок с точечной заменой в участке связывания её не возвращает. Типичный артефакт: повторно синтезированный белок может быть в избытке; удаление гена меняет и другие грузы. Чего не доказывает: прямое связывание (его проверяют на очищенных белках) и долю груза, идущую каждым путём в обычной клетке.", "gn_snx17": "SNX17", "g_snx17": "Сверх программы: белок ранней эндосомы из семейства сортирующих нексинов; связывает в хвосте груза мотив NPxY; без груза его собственный C-концевой участок блокирует участок связывания груза (аутоингибирование).", "gn_commander": "Ретривер и Commander", "g_commander": "Сверх программы: ретривер — комплекс трёх белков, родственный ретромеру; вместе с комплексом CCC и белком DENND10 он образует Commander из 16 субъединиц, возвращающий груз из эндосомы на поверхность клетки; SNX17 передаёт ему груз.", "gn_escpe": "ESCPE-1", "g_escpe": "Сверх программы: комплекс сортирующих нексинов, изгибающий мембрану эндосомы в трубчатый носитель возврата; принимает груз от SNX27–ретромера.", "gn_retsite": "Участок возврата эндосомы", "g_retsite": "Сверх программы: трубчато-пузырьковый участок ранней эндосомы, где вместе находятся ретромер, ретривер, комплекс CCC и ESCPE-1; отсюда носители возвращают груз на поверхность клетки.", "gn_snx27": "SNX27", "g_snx27": "Сверх программы: сортирующий нексин ранней эндосомы; связывает концевой PDZ-связывающий мотив груза и вместе с ретромером передаёт груз ESCPE-1.", "gn_cargoT": "Мембранный груз с цитоплазматическим хвостом", "g_cargoT": "Белок, встроенный в мембрану эндосомы: один домен обращён в просвет, хвост — в цитоплазму; мотив в хвосте узнают белки сортировки.", "gn_motif": "Мотив сортировки в хвосте", "g_motif": "Короткий участок цитоплазматического хвоста мембранного белка, который узнаёт белок сортировки: концевой PDZ-связывающий мотив — SNX27, мотив NPxY — SNX17.", "s3m3_cond": "Рандомизированное двойное слепое испытание фазы 2b; 381 взрослый с гиперхолестеринемией (380 получили препарат или плацебо); MK-0616 — пероральный макроциклический пептид, связывающий PCSK9; 6, 12, 18 или 30 мг один раз в день, 8 недель. Показатель — процентное изменение холестерина ЛПНП (ХС-ЛПНП) от исходного уровня к 8-й неделе; сравнивают разность этих изменений в группе дозы и в группе плацебо (процентные пункты).", "s3m3_status": "Числа — разность скорректированных средних (метод наименьших квадратов) процентных изменений ХС-ЛПНП от исходного уровня к 8-й неделе, группа дозы минус плацебо, в процентных пунктах, с 95 % доверительным интервалом; доля рецепторов на анимации условная. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма", "s3m3_sl": "Доза в испытании, мг в день", "s3m3_mk0": "плацебо; остальные засечки — испытанные дозы 6, 12, 18 и 30 мг", "s3m3_lbl_blood": "кровь", "s3m3_lbl_cell": "клетка печени", "s3m3_lbl_noinh": "ингибитора нет", "s3m3_lbl_cond": "доля рецепторов с PCSK9 — условно", "s3m3_ax": "Разность изменений ХС-ЛПНП, доза минус плацебо, п. п.", "s3m3_lbl_placebo": "плацебо: 0", "s3m3_lbl_ci": "точка — оценка; отрезок — 95 % ДИ", "s3m3_lbl_mg": "мг", "s3m3_r_d": "Доза в испытании", "s3m3_v_placebo": "0 (плацебо)", "s3m3_r_red": "Разность изменений ХС-ЛПНП от исходного уровня к 8-й неделе (доза минус плацебо)", "s3m3_r_red_s": "разность скорректированных средних процентных изменений от исходного уровня; единица — процентные пункты", "s3m3_r_ci": "95 % доверительный интервал разности", "s3m3_r_frac": "Доля рецепторов, связанных с PCSK9", "s3m3_v_frac": "на анимации условная: в работе не измерялась", "s3m3_st1": "PCSK9 связывает рецептор ЛПНП в печени.", "s3m3_st2": "Рецептор с PCSK9 уходит не на возврат, а в лизосому.", "s3m3_st3": "Ингибитор связывает PCSK9, и рецептор снова возвращается на поверхность.", "s3m3_st3_0": "Ингибитора нет: PCSK9 в крови остаётся свободным и продолжает связывать рецепторы.", "s3m3_st4_0": "На поверхности остаётся меньше рецепторов, чем при ингибиторе: печень захватывает меньше ЛПНП из крови.", "s3m3_st4": "Рецепторов на поверхности больше: печень захватывает больше ЛПНП из крови.", "s3m3_note": "Этапы 1–2 — механизм по введению работы; этап 3 (возврат рецептора при связывании PCSK9 ингибитором) и этап 4 — ЗАКЛЮЧЕНИЕ модели (следствие механизма; измерен только итог — снижение ХС-ЛПНП). Доля рецепторов, связанных с PCSK9, на анимации уменьшается с дозой условно.", "s3m3_c_0": "Без ингибитора часть рецепторов ЛПНП после каждого цикла эндоцитоза расщепляется в лизосомах.", "s3m3_c_0_z": "ЗАКЛЮЧЕНИЕ: чем больше PCSK9, тем меньше циклов успевает совершить рецептор.", "s3m3_c_d": "При {d} мг в день оценка изменения ХС-ЛПНП от исходного уровня к 8-й неделе составила на {x} процентного пункта меньше, чем при плацебо.", "s3m3_c_d_z": "Оценка растёт с дозой. При 18 и 30 мг в день точечные оценки близки (−59,1 и −60,9 п. п.), а доверительные интервалы пересекаются; данных этого сравнения недостаточно для вывода о плато.", "s3m3_take": "Концентрацию холестерина в крови определяет и то, сколько раз рецептор ЛПНП успевает вернуться на поверхность клетки печени. PCSK9 направляет связанные рецепторы в лизосомы; ингибитор PCSK9 сохраняет их (это схема механизма: число рецепторов у участников не измеряли). Разность изменений ХС-ЛПНП относительно плацебо при дозах от 6 до 30 мг составила от −41,2 до −60,9 процентного пункта; при 18 и 30 мг точечные оценки близки, но для вывода о плато данных недостаточно.", "s3m3_clin": "Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.", "p3m3_1_q": "PCSK9 связывает рецептор ЛПНП в печени. Куда после эндоцитоза пойдёт такой рецептор?", "p3m3_1_o1": "В лизосому, где расщепится, вместо возврата на поверхность.", "p3m3_1_o2": "На поверхность, как обычный рецептор ЛПНП.", "p3m3_1_o3": "В ядро.", "p3m3_1_e": "PCSK9 направляет связанный рецептор ЛПНП в лизосомы на расщепление и мешает его обычному возврату на поверхность. ЗАКЛЮЧЕНИЕ: у такого рецептора остаётся меньше циклов.", "p3m3_1_w2": "Обычный рецептор ЛПНП в кислой эндосоме теряет ЛПНП и возвращается; рецептор, связанный с PCSK9, вместо этого уходит в лизосому.", "p3m3_1_w3": "Мембранные рецепторы из эндосом в ядро не переходят: выбор — между возвратом на поверхность и лизосомой.", "p3m3_2_q": "В испытании взрослые с гиперхолестеринемией 8 недель получали ингибитор PCSK9 в дозах 6 или 30 мг в день. Как у этих групп изменится ХС-ЛПНП от исходного уровня к 8-й неделе по сравнению с группой плацебо?", "p3m3_2_o1": "Разность изменений составит около −41 п. п. при 6 мг и около −61 п. п. при 30 мг.", "p3m3_2_o2": "Не изменится: PCSK9 действует на рецептор, а не на ЛПНП.", "p3m3_2_o3": "Разность изменений будет одинаковой при обеих дозах.", "p3m3_2_e": "Разность изменений ХС-ЛПНП от исходного уровня к 8-й неделе (группа дозы минус плацебо) составила −41,2 п. п. при 6 мг, −55,7 при 12 мг, −59,1 при 18 мг и −60,9 при 30 мг (95 % ДИ: −47,8…−34,7; −62,3…−49,1; −65,7…−52,5; −67,6…−54,3). Число рецепторов у участников не измеряли: связь с рецепторами — схема механизма, по которой чем меньше рецепторов уходит в лизосому, тем больше их на поверхности и тем больше ЛПНП захватывает печень.", "p3m3_2_w2": "Именно через рецептор: рецепторы, сохранённые от расщепления, захватывают ЛПНП из крови, и его концентрация падает.", "p3m3_2_w3": "Разность зависела от дозы: около −41 п. п. при 6 мг и около −61 п. п. при 30 мг.", "s3m3_lim1": "Количество рецепторов ЛПНП в печени участников: его не измеряли.", "s3m3_lim2": "Долю рецепторов, связанных с PCSK9: на анимации она условная.", "s3m3_lim3": "Исходы болезни.", "s3m3_lim4": "Равенство доз 18 и 30 мг и плато: оценки близки, но сравнение этих доз между собой в данных модели не проведено.", "gn_meth_m3m3": "Метод · рандомизированное двойное слепое плацебо-контролируемое испытание", "g_meth_m3m3": "Что измеряется: изменение ХС-ЛПНП в крови от исходного уровня к 8-й неделе. Уровень: группы участников (средние по группе). Контроль: группа плацебо; распределение по группам случайное; ни участник, ни врач не знают, что принимается. Типичный артефакт: короткий срок (8 недель); ХС-ЛПНП — суррогатный показатель, а не исход болезни. Чего не доказывает: что снижается частота сердечно-сосудистых событий; что механизм у каждого участника одинаков.", "gn_pcsk9": "PCSK9", "g_pcsk9": "Сверх программы: белок, который связывает рецептор ЛПНП в печени и направляет его в лизосомы на расщепление вместо возврата на поверхность клетки.", "gn_inhib": "Ингибитор PCSK9", "g_inhib": "Сверх программы: вещество, связывающее PCSK9 и тем сохраняющее рецепторы ЛПНП от расщепления; снижает ХС-ЛПНП в крови.", "s4m_cond": "Ядерная оболочка клеток человека в культуре (клетки разных линий — по обзору); строение пор определено криоэлектронной томографией в клетке и усреднением изображений многих пор; состояние клетки меняют составом среды (гипер- и гипоосмотическая) и истощением АТФ; часть этих данных получена на делящихся дрожжах, для сравнения показаны и они.", "s4m_status": "Модель по данным обзора строения пор в клетке: засечки — измеренные состояния; капсид — масштабная метка. Влияние диаметра на скорость переноса в клетке не измерено", "s4m_org": "Организм", "s4m_org_hs": "клетки человека", "s4m_org_sp": "делящиеся дрожжи", "s4m_sl": "Диаметр внутреннего кольца, нм", "s4m_sl_note": "Засечки — измеренные состояния из разных выборок и воздействий; промежуточные положения — геометрические варианты шкалы, а не отдельные измерения. У клеток человека внутреннее кольцо меняется примерно от 40 до 60 нм, у делящихся дрожжей — примерно от 50 до 70 нм.", "s4m_mk40": "суженная пора: выделенные ядерные оболочки и кольцевые ламеллы; сужение описано также в гиперосмотической среде и при истощении энергии (на делящихся дрожжах)", "s4m_mk60": "средний диаметр пор в клетке; расширенные поры чаще на базальной поверхности ядра", "s4m_mk50": "наиболее суженное состояние у делящихся дрожжей", "s4m_mk70": "расширенная пора у делящихся дрожжей (по обзору)", "s4m_ps40": "суженная", "s4m_ps60": "средняя в клетке", "s4m_ps70": "расширенная", "s4m_ps50": "дрожжи: суженная", "s4m_lbl_rng_hs": "полоса — диапазон у клеток человека", "s4m_lbl_rng_sp": "полоса — диапазон у делящихся дрожжей", "s4m_lbl_cap": "пунктир — капсид ВИЧ-1: широкий конец около 60 нм (масштабная метка)", "s4m_lbl_rings": "цитоплазматическое кольцо", "s4m_lbl_inring": "внутреннее кольцо в мембране поры", "s4m_lbl_top": "вид сверху: восемь спиц", "s4m_lbl_many": "поры одного ядра различаются по диаметру", "s4m_lbl_apical": "верхняя поверхность", "lgm_head": "Детали моделей продвинутого уровня", "lgm_snx27": "SNX27 (узнаёт концевой мотив PDZ-типа)", "lgm_snx17": "SNX17 (узнаёт мотив NPxY)", "lgm_escpe": "ESCPE-1 на трубчатом носителе возврата", "lgm_retromer": "ретромер", "lgm_ret": "ретривер и Commander (CCC)", "lgm_pcsk9": "PCSK9", "lgm_inhib": "ингибитор PCSK9", "lgm_igg": "IgG", "lgm_fcrn": "FcRn", "lgm_ldl": "частица ЛПНП (жёлтая)", "lgm_tf": "трансферрин (красный)", "lgm_eps": "сеть белков начала сборки (Eps15): пунктир — подвижна, сплошной контур — потеряла подвижность; синие точки — Cry2", "s4m_lbl_basket": "ядерная корзина", "s4m_lbl_basal": "расширенных пор больше на базальной поверхности ядра", "s4m_lbl_43": "≈ 43 нм — прежние модели (выделенные оболочки)", "s4m_lbl_57": "≈ 57 нм — поры в клетках DLD-1", "s4m_r_d": "Диаметр внутреннего кольца", "s4m_r_ch": "Изменение к нижней границе этой шкалы", "s4m_r_ch_s": "ЗАКЛЮЧЕНИЕ (расчёт по модели): p = (d − dmin)/dmin·100, где dmin — наименьший диаметр на шкале; при 40 → 60 нм это +50 %, при 50 → 70 нм +40 %; в статье — около 30 % (от наиболее закрытого до наиболее открытого состояния, оценка авторов по разным работам)", "s4m_r_open": "Закрыта ли пора", "s4m_v_open": "нет — даже в наиболее суженном состоянии пора открыта и переносит молекулы", "s4m_r_tr": "Скорость переноса белков", "s4m_v_tr": "прямо не измерена", "s4m_st1": "Ядро сжимается, натяжение ядерной оболочки падает: внутреннее кольцо поры сужается.", "s4m_st2": "Даже в суженном состоянии канал открыт: импортин с грузом проходит сеть FG-повторов.", "s4m_st3": "Ядро набухает, натяжение оболочки растёт: внутреннее кольцо расширяется сильнее других колец.", "s4m_st4": "В покоящейся клетке поры различаются по диаметру; на плоской базальной поверхности ядра расширенных пор больше.", "s4m_note": "Анимация проигрывает переход между состояниями при выбранном организме; бегунок диаметра движется вместе с ней. Порядок этапов — учебная модель.", "s4m_c_narrow": "Пора в наиболее суженном состоянии ({d} нм). Канал не закрыт: перенос через пору продолжается.", "s4m_c_narrow_z": "Сужение — изменение строения каркаса, а не закрытие поры; в физиологических условиях оболочка, вероятно, всегда несколько натянута, поэтому наиболее суженные состояния в клетке редки.", "s4m_c_mid": "Диаметр {d} нм — промежуточное геометрическое положение между засечками.", "s4m_c_mid_z": "Засечки шкалы взяты из разных выборок и воздействий, поэтому промежуточное положение не относится к одной клетке. Поры одного ядра различаются по диаметру; соседние поры часто сходны, как будто оболочка натянута участками. Без белков, связывающих оболочку с цитоскелетом (комплексов LINC), такие участки исчезают.", "s4m_c_wide": "Диаметр {d} нм: на {p} % больше нижней границы этой шкалы.", "s4m_c_wide_z": "Как диаметр влияет на перенос воды и белков через пору в клетке, прямо не измерено. В искусственных нанопорах, выстланных FG-нуклеопоринами, избирательность снижалась при диаметре около 55 нм; это измерение в искусственной системе, а не в поре клетки.", "s4m_take": "Ядерная пора — не жёсткая трубка с одним диаметром: в клетках человека внутреннее кольцо меняется примерно от 40 до 60 нм вместе с натяжением ядерной оболочки. Суженная пора не закрыта. Влияет ли диаметр на скорость переноса белков в клетке, прямо не измерено.", "p4m_1_q": "Делящиеся дрожжи, растущие в обычной среде, перенесли в гиперосмотическую: вода выходит, ядро сжимается. Что произойдёт с ядерными порами?", "p4m_1_o1": "Внутреннее кольцо сузится, но канал останется открытым и перенос через пору продолжится.", "p4m_1_o2": "Поры закроются, и перенос белков в ядро остановится.", "p4m_1_o3": "Поры не изменятся: каркас поры жёсткий.", "p4m_1_e": "У делящихся дрожжей поры растущих клеток расширены, а при гиперосмотическом шоке (как и при истощении энергии) сужаются; внутреннее кольцо — самое податливое из колец поры. По обзору, у делящихся дрожжей его диаметр меняется примерно от 50 до 70 нм, у клеток человека — от 40 до 60 нм. Даже в наиболее суженном состоянии пора не закрыта и сохраняет способность к переносу.", "p4m_1_w2": "Закрытия не наблюдают: в наиболее суженном состоянии канал остаётся открытым, а перенос через пору продолжается.", "p4m_1_w3": "Каркас поры не жёсткий: диаметр внутреннего кольца в клетке меняется примерно в полтора раза.", "p4m_2_q": "В покоящейся клетке, без изменений среды, сравнили отдельные поры на верхней (апикальной) и на нижней, прилегающей к подложке (базальной), поверхности ядра. Что ожидать?", "p4m_2_o1": "Поры различаются по диаметру; на плоской базальной поверхности расширенных пор больше.", "p4m_2_o2": "Все поры одного ядра имеют одинаковый диаметр.", "p4m_2_o3": "Расширенные поры встречаются только при гипоосмотическом шоке.", "p4m_2_e": "Даже в покое поры одного ядра образуют спектр диаметров. Базальная поверхность ядра более плоская и, вероятно, натянута сильнее; там больше расширенных пор. Соседние поры часто сходны по диаметру, а после удаления комплексов LINC такая группировка исчезает. Однако вклад LINC в диаметр невелик: около 10 % возможного расширения.", "p4m_2_w2": "Одинакового диаметра нет: криоэлектронная томография и экспансионная микроскопия показывают разброс диаметров пор в одном ядре.", "p4m_2_w3": "Шок не нужен: разброс диаметров есть и в покоящейся клетке, а расширенные поры чаще лежат на базальной поверхности ядра.", "p4m_3_q": "Пору расширили с 40 до 60 нм. Как изменится скорость переноса белка с сигналом ядерной локализации?", "p4m_3_o1": "В клетке это прямо не измерено; искусственные системы лишь предсказывают, что широкий канал хуже отличает транспортный рецептор от инертного белка.", "p4m_3_o2": "Вырастет в полтора раза — пропорционально диаметру.", "p4m_3_o3": "Не изменится, потому что перенос с рецептором от диаметра не зависит.", "p4m_3_e": "Работ, в которых измерили бы перенос белков через поры заданного диаметра в клетке, пока нет. Прямо измерена геометрия: диаметр внутреннего кольца меняется вместе с натяжением оболочки. Косвенные данные о диффузии: по обзору, наиболее суженная пора (делящиеся дрожжи) немного сильнее ограничивает диффузию, а расширенная лучше пропускает воду; в клетках человека это прямо не измерено. Измерение в искусственной системе: в нанопорах диаметром от 35 до 160 нм, выстланных FG-нуклеопоринами, избирательность снижалась при диаметре около 55 нм. Это не поры клетки, поэтому перенос белков в клетке по таким данным не предсказать.", "p4m_3_w2": "Пропорциональности никто не измерял: прямых данных о переносе через поры заданного диаметра в клетке нет.", "p4m_3_w3": "Это тоже не установлено: в искусственных нанопорах избирательность зависела от диаметра, поэтому полностью исключить влияние нельзя.", "p4m_4_q": "Строение поры долго определяли по порам в выделенных ядерных оболочках. Чем поры в клетках DLD-1 отличаются от пор в прежних моделях по выделенным оболочкам?", "p4m_4_o1": "В клетке канал шире: около 57 нм против около 43 нм, объём канала больше примерно на 75 %.", "p4m_4_o2": "Ничем: каркас поры при выделении не меняется.", "p4m_4_o3": "В клетке канал уже, потому что его заполняют транспортируемые молекулы.", "p4m_4_e": "Криоэлектронная томография пор прямо в клетках DLD-1 показала канал шириной около 57 нм — примерно на треть шире, чем в прежних моделях пор человека по выделенным (полуочищенным) оболочкам, где он около 43 нм; объём канала в клетке больше примерно на 75 %. Это сравнение двух разных выборок и способов подготовки; снятие натяжения при выделении оболочки — возможное объяснение, а не доказанная причина.", "p4m_4_w2": "При выделении оболочка теряет натяжение, и пора сужается; поэтому строение, определённое вне клетки, нельзя без проверки переносить на клетку.", "p4m_4_w3": "Наоборот: в клетке канал шире; заполнение канала сетью FG-повторов на диаметр каркаса не влияет.", "s4m_lim1": "Натяжение оболочки в клетке в единицах не измерено; бегунок задаёт диаметр, а не натяжение.", "s4m_lim2": "Засечки округлены авторами («около 40», «около 60», «около 70 нм»), а изменение «около 30 %» — их сводная оценка; поэтому расчёт по засечкам и оценка авторов расходятся.", "s4m_lim3": "Связь диаметра со скоростью переноса белков в клетке не установлена.", "s4m_lim4": "Капсид ВИЧ-1 показан только для масштаба: широкий конец около 55–60 нм.", "s4m_lim5": "Шаг 4 — данные другой работы (клетки рака толстой кишки человека DLD-1): засечки около 57 и около 43 нм появляются только в этом шаге и не связываются с засечками модели формулой.", "gn_meth_m4m": "Метод · криоэлектронная томография пор в клетке", "g_meth_m4m": "Что измеряется: трёхмерное строение пор в тонком слое быстро замороженной клетки; изображения многих пор усредняются. Уровень: кольца каркаса поры, нанометры. Контроль: сравнение с порами выделенных ядерных оболочек; клетки с изменённой средой или истощением АТФ сравнивают с необработанными (это разные выборки). Типичный артефакт: усреднение скрывает разнообразие отдельных пор; изменение среды и истощение АТФ меняют не только натяжение оболочки. Чего не доказывает: что изменение диаметра меняет скорость переноса белков в клетке.", "gn_poremem": "Мембрана поры", "g_poremem": "Сверх программы: участок ядерной оболочки, где наружная и внутренняя мембраны переходят друг в друга и окружают комплекс ядерной поры.", "gn_inring": "Кольца каркаса поры: внутреннее кольцо", "g_inring": "Сверх программы: цитоплазматическое, внутреннее и ядерное кольца, из которых построен каркас комплекса ядерной поры; внутреннее кольцо встроено в мембрану поры, и его диаметр сильнее всего меняется с натяжением ядерной оболочки.", "gn_rings": "Кольца каркаса поры", "g_rings": "Сверх программы: цитоплазматическое, внутреннее и ядерное кольца, из которых построен каркас комплекса ядерной поры; внутреннее кольцо встроено в мембрану поры, и его диаметр сильнее всего меняется с натяжением ядерной оболочки.", "gn_fg": "FG-повторы", "g_fg": "Сверх программы: участки нуклеопоринов, богатые фенилаланином (F) и глицином (G) и лишённые устойчивой пространственной структуры; заполняют центральный канал поры сетью, которая задерживает крупные инертные молекулы и пропускает транспортные рецепторы.", "gn_basket": "Ядерная корзина", "g_basket": "Сверх программы: нити белков, отходящие от ядерного кольца поры в нуклеоплазму.", "gn_linc": "Комплекс LINC", "g_linc": "Сверх программы: белковый комплекс, связывающий нуклеоскелет с цитоскелетом через обе мембраны ядерной оболочки и передающий механическую силу на ядро.", "gn_hiv": "Капсид ВИЧ-1", "g_hiv": "Сверх программы: конусовидная белковая оболочка размером около 120 × 60 нм, внутри которой геном вируса иммунодефицита человека переносится к ядру.", "s4m2_cond": "Клетки линии CD4⁺-Т-лимфобластов человека SupT1-R5, заражённые вирусом иммунодефицита человека (ВИЧ-1); капсиды найдены по флуоресценции и сняты корреляционной световой и электронной томографией; строение пор определено по томограммам замороженных клеток. Шаг 3 и положение «макрофаги» — другая работа: первичные макрофаги человека из моноцитов крови, заражённые ВИЧ-1; криоэлектронная томография; положение каждой субъединицы колец поры найдено сопоставлением с образцом.", "s4m2_status": "Модель по данным двух работ (клетки SupT1-R5; первичные макрофаги): размеры — измеренные; разность диаметров — расчёт; бегунок — сравнение размеров, а не прогноз прохождения; механизм прохождения через сеть FG-повторов здесь не показан", "s4m2_sl": "Диаметр центрального канала, нм", "s4m2_mk60": "широкий конец капсида (для сравнения)", "s4m2_mk64": "поры клеток SupT1-R5 — заражённых и незаражённых (среднее, расширенные поры)", "s4m2_mk65": "поры первичных макрофагов (около 65 нм по подписи источника)", "s4m2_hatch": "штриховка — значения диаметра, для которых в работах нет измерений: показан только расчёт разности", "s4m2_cells": "Клетки", "s4m2_c_sup": "SupT1-R5", "s4m2_c_mac": "макрофаги человека", "s4m2_lbl_wide": "поры в этих клетках расширены: канал около 64 нм", "s4m2_lbl_crack": "кольцо поры может треснуть при прохождении капсида", "s4m2_lbl_env": "ядерная оболочка и пора", "s4m2_lbl_60": "≈ 60 — широкий конец капсида", "s4m2_lbl_64": "≈ 64 — поры SupT1-R5", "s4m2_lbl_65m": "в макрофагах ≈ 65 — почти как в SupT1-R5", "s4m2_lbl_hint": "диаметр канала, нм", "s4m2_lbl_gap": "разность диаметров {g} нм", "s4m2_r_d": "Диаметр канала", "s4m2_r_gap": "Разность диаметров канала и широкого конца капсида", "s4m2_r_gap_s": "ЗАКЛЮЧЕНИЕ: расчёт d − 60 нм для капсида шириной 60 нм (широкий конец капсида — около 55–60 нм); отрицательное значение — геометрическое перекрытие в жёсткой схеме, положительное — геометрический запас; по работе на клетках SupT1-R5 — около 4–9 нм при d ≈ 64 нм", "s4m2_r_where": "Где капсид", "s4m2_v_where_cyto": "в цитоплазме у поры", "s4m2_v_where_chan": "в канале поры", "s4m2_v_where_nuc": "в ядре", "s4m2_r_shape": "Капсид", "s4m2_r_cmp": "Сравнение диаметров", "s4m2_v_cmp_neg": "канал уже широкого конца капсида: в жёсткой схеме они перекрываются", "s4m2_v_cmp_eq": "диаметры равны: в жёсткой схеме запаса нет", "s4m2_v_cmp_pos": "канал шире широкого конца капсида: в жёсткой схеме есть геометрический запас", "s4m2_v_shape_whole": "целый", "s4m2_v_shape_open": "раскрыт", "s4m2_r_ring": "Растрескивание цитоплазматического кольца поры", "s4m2_v_ring": "у 4 из 9 пор с капсидом в канале; у 12 из 259 пор без капсида; в незаражённых макрофагах — у 0 из 112", "s4m2_st1": "Конусовидный капсид ВИЧ-1 подходит к поре узким концом.", "s4m2_st2": "Поры в клетках SupT1-R5 расширены (и в заражённых, и в незаражённых): канал около 64 нм, на несколько нанометров шире широкого конца капсида.", "s4m2_st3": "Капсид проходит через канал целым.", "s4m2_st4": "В ядре капсид раскрывается и освобождает геном; сразу на отдельные субъединицы он не распадается, остаются остатки капсида.", "s4m2_mst2": "В заражённых макрофагах человека канал пор около 65 нм; капсиды находили в канале пор.", "s4m2_mst3": "У части пор с капсидом в канале симметрия цитоплазматического кольца нарушена (4 из 9 пор с капсидом в этой выборке); раскрытие капсида в ядре в этой последовательности не показано.", "s4m2_note": "Бегунок диаметра — сравнение размеров: он не задаёт положение капсида и не предсказывает прохождение. Этапы показывают наблюдения на томограммах разных пор (последовательность восстановлена по снимкам, а не записана как процесс): для SupT1-R5 — подход, канал, целый капсид в канале, раскрытый капсид в ядре; для макрофагов — капсид в канале и нарушение симметрии кольца.", "s4m2_take": "Пора пропускает не только то, что меньше её обычного отверстия: в заражённых клетках поры расширены до примерно 64 нм, и целый конусовидный капсид ВИЧ-1 проходит через канал; в клетках SupT1-R5 он раскрывается в ядре, а в макрофагах человека капсиды в ядре выглядели целыми, и прохождение капсида связано с растрескиванием колец каркаса поры.", "s4m2_c_neg": "Канал {d} нм уже широкого конца капсида (60 нм) на {gap} нм: в жёсткой схеме они перекрываются. Это сравнение размеров, а не прогноз прохождения.", "s4m2_c_neg_z": "Живой капсид и пора не жёсткие, а проход определяют и другие условия (сеть FG-повторов, ориентация, состояние колец поры); таких пор в заражённых клетках SupT1-R5 не измеряли.", "s4m2_c_eq": "Канал {d} нм равен широкому концу капсида (60 нм). Это сравнение размеров, а не прогноз прохождения.", "s4m2_c_eq_z": "Нулевая разность означает отсутствие геометрического запаса в жёсткой схеме; таких пор в заражённых клетках SupT1-R5 не измеряли.", "s4m2_c_pos": "Канал {d} нм шире широкого конца капсида (60 нм) на {gap} нм: в жёсткой схеме есть геометрический запас при выбранной ориентации. Это сравнение размеров, а не прогноз прохождения.", "s4m2_c_pos_z": "Геометрический запас — не достаточное условие прохождения: проход определяют и другие условия (сеть FG-повторов, ориентация капсида, состояние колец поры). Наблюдения в клетках показаны на этапах.", "s4m2_c_obs_sup": "Наблюдение в клетках SupT1-R5: канал около 64 нм (около 64 нм было и у незаражённых клеток); целые капсиды найдены в канале пор, раскрытые — в ядре.", "s4m2_c_obs_sup_z": "Положения капсида по этапам — последовательность, восстановленная авторами по томограммам разных пор, а не запись одного капсида.", "s4m2_c_obs_mac": "Наблюдение в первичных макрофагах человека: канал около 65 нм; у части пор с капсидом в канале нарушена симметрия цитоплазматического кольца.", "s4m2_c_obs_mac_z": "Это статичные томограммы: растрескивание напрямую не наблюдали, а число событий мало (4 из 9 пор с капсидом в канале, 12 из 259 без капсида, 0 из 112 в незаражённых макрофагах).", "p4m2_1_q": "Капсид ВИЧ-1 — конус длиной около 110 нм с широким концом около 55–60 нм. Должен ли он сначала распасться на субъединицы, чтобы пройти в ядро клетки SupT1-R5?", "p4m2_1_o1": "Нет: целый капсид проходит через пору и раскрывается в ядре.", "p4m2_1_o2": "Да: капсид шире любой поры, поэтому в ядро попадает только геном.", "p4m2_1_o3": "Нет: капсид проходит через ядерную оболочку в обход пор.", "p4m2_1_e": "Томограммы заражённых клеток показали целые конусовидные капсиды в центральном канале пор и в ядре рядом с порами. Поры этих клеток расширены — около 64 нм (в незаражённых клетках той же линии — такие же), на 4–9 нм шире широкого конца капсида. В ядре капсид раскрывается и освобождает геном.", "p4m2_1_w2": "Канал пор в этих клетках (около 64 нм) шире широкого конца капсида (около 60 нм), и капсид проходит целым.", "p4m2_1_w3": "Капсиды находили именно в канале пор; через мембраны ядерной оболочки они не проходят.", "p4m2_2_q": "Капсид оказался в ядре. Как он освобождает геном?", "p4m2_2_o1": "Раскрывается: оболочка ломается, но не распадается на отдельные белки.", "p4m2_2_o2": "Полностью распадается на отдельные белки капсида.", "p4m2_2_o3": "Остаётся целым, а геном выходит через пору в капсиде.", "p4m2_2_e": "В ядре находили раскрытые капсиды: фрагменты и трубки, остатки оболочки. Авторы считают, что капсид не растворяется сразу на отдельные субъединицы, а частично разрушается, и геном освобождается из остатков капсида.", "p4m2_2_w2": "Мгновенного распада на отдельные белки не видели: в ядре находили фрагменты и трубки капсида, остатки оболочки.", "p4m2_2_w3": "Капсиды в ядре находили раскрытыми: целый капсид геном не освобождает.", "p4m2_3_q": "В заражённых макрофагах человека сравнили поры, в канале которых находится капсид ВИЧ-1, и поры без капсида. Что нашли в строении колец поры?", "p4m2_3_o1": "У пор с капсидом в канале цитоплазматическое кольцо чаще растрескивается: симметрия восьмого порядка нарушена.", "p4m2_3_o2": "Никаких различий: капсид проходит, как транспортный рецептор, не задевая каркаса.", "p4m2_3_o3": "Поры с капсидом полностью разрушены и исчезают из оболочки.", "p4m2_3_e": "Растрескивание цитоплазматического кольца нашли у 4 из 9 пор с капсидом в канале и лишь у 12 из 259 пор без капсида; в незаражённых макрофагах — ни у одной из 112. Растрескивание видели, когда капсид глубоко вошёл в канал. Наблюдение статичное: процесс растрескивания напрямую не видели, а число событий мало.", "p4m2_3_w2": "Различие есть: у пор с капсидом кольцо растрескивается заметно чаще (событий мало). Связь капсида с FG-повторами не исключает механического воздействия на каркас.", "p4m2_3_w3": "Поры не исчезают: нарушается правильная симметрия восьмого порядка кольца, а пора остаётся в оболочке.", "s4m2_lim1": "Вход капсида в сеть FG-повторов как транспортного рецептора показан только в бесклеточных системах и на собранных частицах капсидного белка, а не на настоящих капсидах с РНК.", "s4m2_lim2": "В первичных макрофагах человека прохождение капсида связано с растрескиванием колец поры; в клетках SupT1-R5 этого не изучали (усреднение многих пор такие нарушения скрывает); процесс растрескивания не наблюдали напрямую.", "s4m2_lim4": "Одной геометрии каркаса недостаточно: по расчётам авторов работы о макрофагах, без FG-повторов капсид проходит через пору либо при расширении внутреннего кольца до примерно 70 нм, либо при растрескивании кольца; вклад FG-повторов в эффективный диаметр оценить не удалось.", "s4m2_lim3": "Поры других клеток.", "gn_meth_m4m2": "Метод · корреляционная световая и электронная томография", "g_meth_m4m2": "Что измеряется: положение меченых капсидов по флуоресценции, затем трёхмерное строение того же участка клетки по электронной томографии. Уровень: отдельные поры и капсиды. Контроль: размеры пор сопоставляют с размерами капсидов на тех же томограммах; поры незаражённых макрофагов (у них растрескивания цитоплазматического кольца не нашли). Типичный артефакт: использован неинфекционный вариант вируса, а для накопления капсидов у пор — вариант с заменой в капсиде; метка — флуоресцентный белок на интегразе внутри капсида; линия клеток, а не клетки крови больного; один момент времени на клетку. Чего не доказывает: как капсид проходит сеть FG-повторов и не повреждает ли он при этом каркас поры.", "gn_genome": "Геном вируса", "g_genome": "Сверх программы: РНК ВИЧ-1 в капсиде; в ядре после обратной транскрипции интегрируется в геном клетки-хозяина.", "gn_gf": "Фактор роста", "g_gf": "Белок, который связывается со своим рецептором на поверхности клетки и запускает в ней ответ. Факторы роста, например эпидермальный фактор роста, усиливают макропиноцитоз. Белки-рецепторы — вопрос 4 коллоквиума.", "gn_phago": "Фагоцитоз", "g_phago": "Поглощение крупных частиц — бактерий, обломков клеток, пыли — специализированными клетками-фагоцитами: макрофагами, нейтрофилами, дендритными клетками. Псевдоподии, образованные за счёт перестройки актина, охватывают частицу, и образуется фагосома более 250 нм.", "gn_membrane": "Плазматическая мембрана", "g_membrane": "Липидный бислой с белками, отделяющий клетку от внеклеточной среды. На схеме синие кружки — гидрофильные головки липидов, оранжевые линии — их гидрофобные хвосты.", "gn_micro": "Микропиноцитоз", "g_micro": "Постоянное неспецифическое поглощение жидкости и небольших белковых молекул в мелких пузырьках (менее 150 нм). Такие пузырьки образуются разными путями — из покрытых клатрином ямок и без клатрина.", "gn_macro": "Макропиноцитоз", "g_macro": "Регулируемый захват внеклеточной жидкости: перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы более 0,2 мкм. Усиливается факторами роста; характерен для клеток иммунной системы.", "gn_receptor": "Рецептор груза", "g_receptor": "Трансмембранный белок, который снаружи связывает определённый груз (лиганд), а цитоплазматическим участком — белок-адаптер. Так рецепторы с грузом концентрируются в покрытой клатрином ямке.", "gn_clathrin": "Клатрин", "g_clathrin": "Белок оболочки, который собирается в решётку с цитоплазматической стороны мембраны и изгибает её в ямку. С рецепторами груза клатрин связывается не напрямую, а через белки-адаптеры.", "gn_ccv": "Покрытая клатрином везикула", "g_ccv": "Пузырёк, отделившийся от ямки вместе с клатриновой оболочкой. Затем оболочка быстро сбрасывается, и везикула может слиться с мембраной-мишенью.", "gn_actin": "Актиновый цитоскелет", "g_actin": "Сеть актиновых филаментов под плазматической мембраной. Её перестройка создаёт складки мембраны при макропиноцитозе и псевдоподии при фагоцитозе.", "gn_dynamin": "Динамин", "g_dynamin": "ГТФаза, которая обеспечивает отшнуровывание покрытой клатрином везикулы от мембраны: динамин собирается спиралью вокруг шейки ямки, и после гидролиза ГТФ мембрана шейки смыкается. Сверх программы: в клетках с мутантным динамином K44A ямки собираются, но не сужаются и не отделяются.", "gn_cycle": "Цикл транспортного носителя", "g_cycle": "Последовательные этапы переноса груза между мембранами: белки оболочки отбирают груз и изгибают мембрану, носитель отделяется, теряет оболочку, узнаёт мишень и сливается с ней. Оболочки разных маршрутов: COP-II — из ЭПР в комплекс Гольджи, COP-I — обратно и между цистернами, клатрин — от плазматической мембраны и транс-сети комплекса Гольджи.", "gn_golgi": "Комплекс Гольджи", "g_golgi": "Стопка уплощённых мембранных цистерн, в которой белки, пришедшие из грЭПР, модифицируются, сортируются и упаковываются в транспортные везикулы; цистерны, ближайшие к грЭПР, образуют цис-сеть, дальние — транс-сеть. На схеме продвинутого уровня — бесклеточная система из мембран комплекса Гольджи.", "gn_vesicle": "Транспортный носитель", "g_vesicle": "Мембранный пузырёк, который переносит груз из одного компартмента в другой: образуется почкованием от мембраны-донора и сливается с мембраной-мишенью.", "gn_snare": "SNARE-белки", "g_snare": "Белки слияния мембран: SNARE носителя (v-SNARE) и SNARE мембраны-мишени (t-SNARE) собираются в комплекс и обеспечивают слияние. По аминокислотному остатку в центре комплекса SNARE-белки делят на R-SNARE (остаток аргинина) и Q-SNARE (остаток глутамина). Сверх программы: это другая классификация, а не новое название v- и t-SNARE — у носителя из ЭПР есть и R-, и Q-SNARE; комплекс из четырёх спиралей собирается от N-концов к C-концам и стягивает мембраны.", "gn_nsf": "NSF", "g_nsf": "АТФаза, чувствительная к N-этилмалеимиду (англ. N-ethylmaleimide-sensitive factor). Вместе с α-SNAP разбирает SNARE-комплексы, оставшиеся собранными после слияния, и возвращает SNARE-белки в работу.", "gn_endosome": "Ранняя эндосома", "g_endosome": "Сортировочный компартмент: в него после разборки оболочки поступает содержимое эндоцитозных везикул; в самом частом варианте рецепторы отсюда возвращаются на поверхность, а лиганды остаются в эндосоме и попадают в лизосомы. Ранняя эндосома образуется при слиянии эндоцитозных везикул, обычно около 10 минут принимает новые везикулы, а затем созревает в позднюю. Сверх программы: при созревании Rab5 на эндосоме сменяется Rab7.", "gn_tfr": "Рецептор трансферрина", "g_tfr": "Рецептор белка-переносчика железа трансферрина. Трансферрин отдаёт железо в кислой эндосоме, но остаётся на рецепторе и вместе с ним возвращается на поверхность.", "gn_lysosome": "Лизосома", "g_lysosome": "Мембранная органелла с гидролитическими ферментами, в которой расщепляются макромолекулы, поступившие в клетку путём эндоцитоза. LAMP1 — белок мембраны лизосом и поздних эндосом; совпадение груза с LAMP1 в микроскопии согласуется с доставкой в лизосомные компартменты, а расщепление подтверждают отдельным измерением.", "gn_glut1": "GLUT1", "g_glut1": "Переносчик глюкозы плазматической мембраны. На его цитоплазматическом конце — короткий PDZ-лиганд, по которому SNX27–ретромер возвращает GLUT1 из ранней эндосомы.", "gn_retromer": "SNX27–ретромер", "g_retromer": "Белковый комплекс на ранней эндосоме: сортирующий нексин SNX27 связывает PDZ-лиганд груза, ретромер (VPS26–VPS29–VPS35) направляет груз назад, а не в лизосому.", "gn_npc": "Комплекс ядерной поры", "g_npc": "Белковый комплекс в поре двойной ядерной оболочки: построен примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; каркас имеет восьмикратную симметрию. Малые молекулы (до ~5 кДа) проходят его простой диффузией практически свободно; крупные белки пассивно проходят очень медленно, а быстро — с транспортными рецепторами.", "gn_caveola": "Кавеола", "g_caveola": "Небольшая колбовидная инвагинация плазматической мембраны, стабилизированная кавеолинами и кавинами; при повышении натяжения кавеола распластывается и увеличивает площадь плоской мембраны, поэтому кавеолы служат резервом мембраны и смягчают механическую нагрузку. Эндоцитоз — не главная функция кавеол. Размер 50–100 нм, мембрана кавеол обогащена холестерином и сфинголипидами.", "gn_er": "грЭПР", "g_er": "Гранулярная эндоплазматическая сеть: мембранный компартмент с рибосомами на цитоплазматической стороне. Белки, синтезированные здесь, покидают его в носителях с оболочкой COP-II.", "gn_ribo": "Рибосомы", "g_ribo": "Рибосомы на цитоплазматической стороне мембраны грЭПР: здесь синтезируются белки, которые сразу поступают в ЭПР.", "gn_tgn": "Транс-сеть комплекса Гольджи", "g_tgn": "Выход из комплекса Гольджи: отсюда часть белков направляется в поздние эндосомы прямым путём — в покрытых клатрином везикулах.", "gn_le": "Поздняя эндосома", "g_le": "Эндосома, в которую созревает ранняя: её среда кислее, она лежит глубже в цитоплазме; мембрана поздней эндосомы впячивается внутрь, образуя мультивезикулярное тельце.", "gn_copii": "COP-II", "g_copii": "Оболочка носителей, переносящих только что синтезированные белки из грЭПР в цис-сеть комплекса Гольджи (антероградный транспорт).", "gn_copi": "COP-I", "g_copi": "Оболочка носителей ретроградного транспорта: из комплекса Гольджи в грЭПР и между цистернами комплекса Гольджи.", "gn_tether": "Rab-белки и тетеринг-белки", "g_tether": "Белки первичного узнавания мишени: Rab в активной форме (связанный с ГТФ) отмечает мембрану и привлекает длинные тетеринг-белки (также называемые белками удержания), которые держат подходящий носитель на расстоянии до сборки SNARE.", "gn_cargo": "Растворимый груз", "g_cargo": "Белок в просвете компартмента: переносится в просвете носителя.", "gn_memcargo": "Мембранный груз", "g_memcargo": "Белок, встроенный в мембрану: переносится в мембране носителя, один из доменов обращён в просвет.", "gn_ligand": "Лиганд", "g_ligand": "Молекула, которую рецептор связывает снаружи клетки или в просвете компартмента. После эндоцитоза лиганд и рецептор могут разойтись в ранней эндосоме.", "gn_mvb": "Мультивезикулярное тельце", "g_mvb": "Поздняя эндосома с внутрипросветными везикулами, образованными впячиванием её мембраны в просвет; мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется.", "gn_ilv": "Внутрипросветная везикула", "g_ilv": "Пузырёк в просвете поздней эндосомы, образованный впячиванием её мембраны. В его мембране — рецепторы, направленные на расщепление; связанный лиганд обращён в просвет эндосомы.", "gn_ub": "Убиквитин", "g_ub": "Небольшой белок, который присоединяется к другим белкам как метка; убиквитинированный рецептор включается в мембрану внутрипросветных везикул и расщепляется в лизосоме.", "gn_nucleus": "Ядро", "g_nucleus": "Компартмент, в котором находится геном; отделён от цитоплазмы ядерной оболочкой, вещества переходят через комплексы ядерных пор.", "gn_envelope": "Ядерная оболочка", "g_envelope": "Две мембраны с перинуклеарным пространством между ними; наружная мембрана продолжается в мембрану грЭПР. Обе мембраны прерываются в порах.", "gn_nlsprot": "Белок с сигналом ядерной локализации (NLS)", "g_nlsprot": "Крупный белок с участком NLS (красная метка), по которому его узнаёт импортин и переносит из цитоплазмы в ядро.", "gn_nesprot": "Белок с последовательностью ядерного экспорта (NES)", "g_nesprot": "Крупный белок с участком NES, по которому его в ядре узнаёт экспортин и переносит в цитоплазму.", "gn_mutprot": "Белок с изменённым сигналом", "g_mutprot": "Крупный белок, у которого сигнал изменён: транспортный рецептор его не узнаёт.", "gn_bigprot": "Крупный белок без сигнала", "g_bigprot": "За время наблюдения пассивно через пору почти не проходит: белки с FG-повторами создают в поре селективный барьер.", "gn_smallmol": "Малая молекула", "g_smallmol": "Ионы и небольшие молекулы (до ~5 кДа) проходят через каналы поры простой диффузией практически свободно.", "gn_importin": "Импортин", "g_importin": "Ядерный транспортный рецептор (кариоферин): связывает белки с NLS в цитоплазме и переносит их в ядро; в ядре Ran-ГТФ освобождает груз.", "gn_exportin": "Экспортин", "g_exportin": "Ядерный транспортный рецептор (кариоферин): в ядре вместе с Ran-ГТФ связывает белки с NES и переносит их в цитоплазму.", "gn_ran": "Ran-ГТФ и Ran-ГДФ", "g_ran": "Малая ГТФаза Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме; это различие задаёт направление переноса через п function blotHTML(rows, lanes){
  if (!lanes.length) return `<p class="small">${t('blot_empty')}</p>`;
  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;
  h += `<div class="lanes">` + lanes.map(L => `<div class="head">${L.h1}<br>${L.h2 || '&nbsp;'}</div>`).join('') + `</div>`;
  h += `<div class="film"><div class="lanes">` + lanes.map(L => `<div>` + L.v.map(v => `<div class="cell"><div class="band" style="opacity:${(0.04 + 0.96 * clamp(v)).toFixed(2)}"></div></div>`).join('') + `</div>`).join('') + `</div></div>`;
  return h + `</div></div></div>`;
}

function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */

    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
