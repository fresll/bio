<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-8.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Сохранность генома: точность копирования ДНК, репарация повреждений и защита концов хромосом</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-error-damage-mutation"><div class="eyebrow">Точность копирования: ошибка, её исправление и закрепление · шаг 1 из 26</div><h2>Ошибка спаривания, повреждение и мутация — три разных события</h2><p class="lead">Уже известно: при репликации напротив каждого основания матрицы встаёт комплементарный нуклеотид, и каждая цепь служит матрицей для новой (<a href="https://fresll.github.io/bio/seminar-7-route.html#template-principle">вспомнить БИО-7·3</a>). Новое: с ДНК может случиться три разных события, и в этом семинаре важно их не смешивать. Раздел относится к вопросу 4 коллоквиума 2 (предварительный список) и вопросу 15 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Ошибку удалила корректирующая экзонуклеаза полимеразы: изменения нет.</div><ol class="mech"><li><a href="#ns-g-S8-T05">Ошибка спаривания</a> — при синтезе встал некомплементарный нуклеотид, например C напротив A. Оба основания химически нормальные, неправильна только пара.</li><li>Повреждение ДНК — химическое или структурное изменение молекулы: изменённое или утраченное основание, сшитые соседние нуклеотиды, разрыв цепи. Оно возникает и без копирования.</li><li><a href="#ns-g-S8-T09">Мутация</a> — устойчивое изменение последовательности ДНК: обе цепи согласованы, и системы репарации его уже не узнают; при репликации оно передаётся дочерним молекулам.</li><li>Ошибка спаривания и повреждение — ещё не мутации: если их исправить, исходная последовательность сохранится. В примере этого семинара ошибка спаривания становится мутацией при следующей репликации.</li></ol><p>Различие важно, потому что системы защиты узнают разные признаки. Ошибку спаривания выдаёт нарушенная геометрия пары, повреждение — необычное основание или искажение двойной спирали. Закреплённую мутацию не узнаёт ни одна система: в ней обе цепи согласованы, и сравнивать нечего.</p><p>Поэтому один и тот же итог — изменённая пара в дочерней молекуле — может возникнуть разными путями: из ошибки, которую не исправили, или из повреждения, которое не успели устранить до репликации. По одной изменённой паре нельзя сказать, какой путь к ней привёл.</p><p>Изменение последовательности не обязательно меняет белок или свойства клетки: оно может прийтись на участок, не кодирующий белок, или заменить кодон на синонимичный. Мутацией его делает устойчивость изменения последовательности, а не последствия; о последствиях для РНК и белка — семинар 9.</p><div class="static-quiz"><h3>В клетке урацил появился в ДНК при дезаминировании цитозина, и его удалили до следующей репликации. Что это было?</h3><ol><li><b>А.</b> Повреждение, которое не стало мутацией <i>(верный вариант)</i><br><span class="expl">Урацил — химически изменённое основание; его устранили до репликации, исходная пара восстановлена, и изменение не передаётся дочерним молекулам.</span></li><li><b>Б.</b> Мутация, которая была исправлена <i>(неверный вариант)</i><br><span class="expl">Мутация — устойчивое изменение последовательности; здесь урацил удалили, исходная пара восстановлена, и устойчивого изменения не осталось.</span></li><li><b>В.</b> Ошибка спаривания <i>(неверный вариант)</i><br><span class="expl">Ошибка спаривания возникает при синтезе: оба основания нормальные. Урацил возник в уже готовой цепи из цитозина — это повреждение.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Схема шага — модель вкладки 1: одна ошибка C напротив A матрицы. Последовательности условные.</p></details></article><article class="card print-unit" id="ns-proofreading"><div class="eyebrow">Точность копирования: ошибка, её исправление и закрепление · шаг 2 из 26</div><h2>Выбор нуклеотида и коррекция 3′-конца: две проверки в момент синтеза</h2><p class="lead">Уже известно: <a href="#ns-g-S8-T03">ДНК-полимераза</a> присоединяет нуклеотид только к спаренному с матрицей 3′-OH (<a href="https://fresll.github.io/bio/seminar-7-route.html#polymerase-rule">вспомнить БИО-7·4</a>). Новое: это требование и есть основа первой проверки ошибок — ещё до того, как синтез продолжится.</p><div class="note"><strong>Что показывает схема.</strong> C отщеплён с 3′-конца сразу, на его место встал T.</div><ol class="mech"><li>Первая проверка — выбор нуклеотида: правильная пара подходит к активному центру полимеразы лучше, чем неправильная, и неправильный нуклеотид чаще уходит, не присоединившись.</li><li>Если некомплементарный нуклеотид всё же присоединён, 3′-конец оказывается неспаренным, и полимераза плохо его удлиняет.</li><li>Такой конец переходит в экзонуклеазный центр той же полимеразы, и <a href="#ns-g-S8-T04">корректирующая экзонуклеаза</a> отщепляет ошибочный нуклеотид в направлении 3′→5′.</li><li>После этого синтез продолжается с правильно спаренного 3′-OH.</li></ol><p>Корректирующую экзонуклеазу имеют полимеразы δ и ε, которые синтезируют основную часть новых цепей; у полимеразы α, начинающей каждый фрагмент, её нет. Поэтому ошибки, сделанные полимеразой α, проверяет уже следующий этап.</p><p>По оценкам, приведённым в учебнике Alberts et al. (получены в основном на бактериях), при выборе нуклеотида полимераза ошибается примерно 1 раз на 10⁵ присоединений, а коррекция уменьшает число ошибок примерно в 100 раз. Эти оценки зависят от полимеразы и типа ошибки: одни ошибочные пары возникают и исправляются легче других.</p><p>Коррекция работает только на растущем 3′-конце. Ошибку, которую полимераза оставила позади и продолжила синтез, коррекция уже не исправит — для этого нужен следующий этап.</p><div class="static-quiz"><h3>Какую ошибку может исправить корректирующая экзонуклеаза ДНК-полимеразы?</h3><ol><li><b>А.</b> Ошибочную пару в середине уже синтезированной цепи <i>(неверный вариант)</i><br><span class="expl">Позади полимеразы ошибочную пару находит другая система — MMR; коррекция работает только на 3′-конце.</span></li><li><b>Б.</b> Неверно спаренный нуклеотид на 3′-конце растущей цепи <i>(верный вариант)</i><br><span class="expl">Коррекция проверяет последний присоединённый нуклеотид: неспаренный 3′-конец переходит в экзонуклеазный центр.</span></li><li><b>В.</b> Изменённое основание в матрице <i>(неверный вариант)</i><br><span class="expl">Повреждения матрицы устраняют пути репарации повреждений (раздел 2), а не коррекция полимеразы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1146/annurev-genet-112414-054722">Kunkel T. A., Erie D. A. Eukaryotic mismatch repair in relation to DNA replication. Annu Rev Genet. 2015;49:291–313</a></li></ul><p>Числа — оценки из учебника Alberts et al., полученные в основном на бактериях; для клеток человека они другие и зависят от типа ошибки и полимеразы.</p></details></article><article class="card print-unit" id="ns-mismatch-repair"><div class="eyebrow">Точность копирования: ошибка, её исправление и закрепление · шаг 3 из 26</div><h2>Репарация ошибочно спаренных нуклеотидов: какая цепь новая</h2><p class="lead">Ошибки, которые пропустила коррекция, остаются в новой цепи позади полимеразы. Их находит третий этап — <a href="#ns-g-S8-T07">репарация ошибочно спаренных нуклеотидов</a> (MMR). Главная трудность: в ошибочной паре оба основания нормальные. Как узнать, какое из них неверное?</p><div class="note"><strong>Что показывает схема.</strong> По разрыву узнана новая цепь: её участок с ошибкой заменён.</div><ol class="mech"><li><a href="#ns-g-S8-T06">Белок узнавания ошибочной пары</a> (у человека — MutSα или MutSβ) связывается с ошибочной парой.</li><li>Комплекс привлекает белок MutL и вместе с ним находит рядом <a href="#ns-g-S8-T08">разрыв в одной цепи</a> и скользящий зажим PCNA. Разрывы есть только в новой цепи: в отстающей — между фрагментами Оказаки; как отмечается новая ведущая цепь, установлено не окончательно (предполагают разрывы на месте случайно встроенных рибонуклеотидов).</li><li>По этой метке активируется нуклеаза, и участок новой цепи вместе с ошибкой удаляется.</li><li>ДНК-полимераза δ синтезирует участок заново по матрице, <a href="#ns-g-S8-T19">лигаза</a> сшивает разрыв.</li></ol><p>Метка нужна потому, что исправлять надо именно новую цепь: матрица — образец. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при «исправлении».</p><p>У бактерии кишечной палочки новую цепь отличает отсутствие метильных групп, которые появляются на ней с задержкой; у эукариот такой метки нет, и меткой служат разрывы новой цепи.</p><p>MMR работает после синтеза, но до следующей репликации. По оценкам из учебника Alberts et al., она уменьшает число ошибок ещё в 100–1000 раз. Наследственные дефекты белков MMR у человека повышают частоту мутаций и предрасполагают к некоторым опухолям; это клинический пример значения механизма.</p><div class="static-quiz"><h3>Почему для MMR должна быть отмечена новая цепь?</h3><ol><li><b>А.</b> Новая цепь химически повреждена, и её проще узнать <i>(неверный вариант)</i><br><span class="expl">Новая цепь не повреждена; её отличает только метка — разрывы.</span></li><li><b>Б.</b> MMR может исправлять только новую цепь, потому что матрица закрыта белками <i>(неверный вариант)</i><br><span class="expl">Обе цепи доступны; выбор новой цепи нужен для сохранения информации, а не из-за доступности.</span></li><li><b>В.</b> В ошибочной паре оба основания нормальные; исправлять нужно новую цепь, а матрицу сохранить как образец <i>(верный вариант)</i><br><span class="expl">Иначе в половине случаев заменялся бы нуклеотид матрицы, и исходная последовательность была бы утрачена.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1146/annurev-genet-112414-054722">Kunkel T. A., Erie D. A. Eukaryotic mismatch repair in relation to DNA replication. Annu Rev Genet. 2015;49:291–313</a></li></ul><p>Схема шага — модель вкладки 1. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p></details></article><article class="card print-unit" id="ns-fixation"><div class="eyebrow">Точность копирования: ошибка, её исправление и закрепление · шаг 4 из 26</div><h2>Как изменение закрепляется при репликации</h2><p class="lead">Ошибочная пара и повреждённое основание — временные состояния. Что происходит, если их не исправили до репликации? Это объясняет, почему мутация — изменение, которое «пережило» репликация.</p><div class="note"><strong>Что показывает схема.</strong> Во второй молекуле пара C–G вместо T–A: изменение закреплено, MMR его не узнаёт.</div><ol class="mech"><li>При репликации цепи расходятся, и каждая служит матрицей.</li><li>Цепь с исходным нуклеотидом даёт молекулу с исходной парой; цепь с ошибочным нуклеотидом — молекулу, где напротив него встал комплементарный.</li><li>В этой второй молекуле обе цепи согласованы: ошибочной пары нет, и ни коррекция, ни MMR её не узнают.</li><li>Так C напротив A превращается в пару C–G вместо T–A в одной из двух дочерних молекул.</li></ol><p>Так же закрепляется повреждение. Цитозин самопроизвольно теряет аминогруппу и превращается в <a href="#ns-g-S8-T10">урацил</a>; урацил спаривается с аденином. Если его не удалить до репликации, в одной дочерней молекуле появится пара U–A, а после следующей репликации — T–A вместо исходной C–G.</p><p>По оценке, приведённой в учебнике Alberts et al., в диплоидной клетке млекопитающего за сутки дезаминируется около 100 цитозинов. Если цитозин метилирован (5-метилцитозин), при дезаминировании сразу образуется тимин — нормальное основание ДНК; такие места чаще дают замену C–G на T–A.</p><p>Решающее значение имеет время: успеет ли система исправления до репликации. После репликации исправлять уже нечего.</p><div class="static-quiz"><h3>Ошибочная пара C·A не исправлена, произошла репликация. Что получится?</h3><ol><li><b>А.</b> Одна молекула с исходной парой T–A, другая — с C–G <i>(верный вариант)</i><br><span class="expl">Каждая цепь служит матрицей: A даёт пару A–T, C — пару C–G.</span></li><li><b>Б.</b> Обе молекулы с ошибочной парой C·A <i>(неверный вариант)</i><br><span class="expl">Ошибочная пара не копируется: напротив каждого основания встаёт комплементарный нуклеотид.</span></li><li><b>В.</b> Обе молекулы с исходной парой T–A <i>(неверный вариант)</i><br><span class="expl">Напротив C полимераза ставит G; ошибка в одной из молекул закрепляется.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Схема шага — модель вкладки 1, панель «после следующей репликации». Число дезаминирований — оценка из учебника Alberts et al. для диплоидной клетки млекопитающего за 24 ч.</p></details></article><article class="card print-unit" id="ns-barriers-in-series"><div class="eyebrow">Точность копирования: ошибка, её исправление и закрепление · шаг 5 из 26</div><h2>Почему несколько несовершенных барьеров дают высокую точность</h2><p class="lead">Уже известно: выбор нуклеотида, коррекция и MMR работают один за другим (БИО-8·2, БИО-8·3). Новое: что следует из того, что каждый этап исправляет лишь часть ошибок, дошедших до него.</p><div class="note"><strong>Что показывает схема.</strong> Итог 100 на 10¹⁰: два этапа вместе снизили число ошибок в 10 000 раз.</div><ol class="mech"><li>Каждый этап пропускает определённую долю ошибок, которые до него дошли.</li><li>Поэтому итог равен произведению: число возникших ошибок × доля, пропущенная коррекцией, × доля, пропущенная MMR.</li><li>Если этап ослаб и пропускает в 10 раз больше, итог растёт в 10 раз — независимо от того, насколько хорошо работают остальные.</li><li>Ошибка, не исправленная до репликации, закрепляется; время работы этапа так же важно, как его эффективность.</li></ol><p>В учебной модели копируется 10¹⁰ нуклеотидов; при ошибках выбора 1 на 10 000, коррекции 99 % и MMR 99 % возникает миллион ошибок, после коррекции остаётся 10 000, после MMR — 100. Все проценты — учебные значения, а не измерения для клеток человека.</p><p>Обратная задача: одинаковый итог (например, 100 изменений) дают разные сочетания этапов. Поэтому по одному итоговому числу нельзя установить, какой этап ослаб; нужны дополнительные наблюдения — число ошибочных пар до MMR или состав изменений (следующий шаг).</p><p>В клетке этапы не вполне независимы: эффективность каждого зависит от типа ошибки, а MMR узнаёт новую цепь по разрывам, которые оставляет синтез. Модель этого не показывает.</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Коррекция исправляет 99 % ошибок, MMR — 99 % оставшихся. Во сколько раз они вместе уменьшают число ошибок?</h3><ol><li><b>А.</b> В 198 раз <i>(неверный вариант)</i><br><span class="expl">Доли пропущенных ошибок перемножаются, а не складываются: 0,01 × 0,01.</span></li><li><b>Б.</b> В 10 000 раз <i>(верный вариант)</i><br><span class="expl">Каждый этап пропускает 1 из 100; вместе — 1 из 100 × 100 = 10 000.</span></li><li><b>В.</b> В 100 раз: второй этап уже ничего не добавляет <i>(неверный вариант)</i><br><span class="expl">Второй этап работает с ошибками, пропущенными первым, и тоже исправляет 99 % из них.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1146/annurev-genet-112414-054722">Kunkel T. A., Erie D. A. Eukaryotic mismatch repair in relation to DNA replication. Annu Rev Genet. 2015;49:291–313</a></li></ul><p>Учебная модель с условными значениями; принцип последовательных этапов — по учебнику Alberts et al. и обзору (три процесса работают последовательно).</p></details></article><article class="card print-unit" id="ns-spectrum-not-count"><div class="eyebrow">Точность копирования: ошибка, её исправление и закрепление · шаг 6 из 26</div><h2>Одно число — разные причины: по составу изменений видно, какой этап нарушен</h2><p class="lead">Уже известно: одинаковое итоговое число ошибок дают разные сочетания этапов (БИО-8·5). Новое: в клетках человека нарушения разных этапов оставляют разные следы в последовательности.</p><div class="note"><strong>Что показывает схема.</strong> Итог 100; после коррекции осталось 10 000.</div><ol class="mech"><li>Полимераза особенно часто ошибается в участках из повторов одного нуклеотида: там легко добавить или пропустить один нуклеотид.</li><li>В опухолях человека с нарушенной MMR в таких участках преобладают выпадения нуклеотидов.</li><li>При мутантной полимеразе с нарушенной коррекцией в тех же участках преобладают вставки одного нуклеотида.</li><li>При утрате обеих систем изменений особенно много — это согласуется с последовательной работой этапов.</li></ol><p>Отсюда следует, что состав изменений, а не только их число, указывает на нарушенный этап. Такие «следы» удаётся различить даже в нормальных клетках крови людей, унаследовавших дефект обеих копий гена MMR.</p><p>Как это узнали: сравнивали последовательности ДНК опухолей и нормальных клеток тех же людей и подсчитывали изменения разных типов в участках из повторов. Тип изменений указывает на нарушенный этап, но не исключает других причин.</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>В двух линиях клеток изменений одинаково много. В первой преобладают выпадения нуклеотидов в повторах, во второй — вставки одного нуклеотида. Какой вывод допустим?</h3><ol><li><b>А.</b> Причины одинаковы, раз число изменений одинаково <i>(неверный вариант)</i><br><span class="expl">Одинаковое число дают разные причины; состав их различает.</span></li><li><b>Б.</b> Обе системы нарушены в обеих линиях <i>(неверный вариант)</i><br><span class="expl">При утрате обеих систем изменений было бы особенно много и присутствовали бы оба типа следов.</span></li><li><b>В.</b> Вероятно, в первой нарушена MMR, во второй — коррекция полимеразы; это гипотеза, которую нужно проверить <i>(верный вариант)</i><br><span class="expl">Состав изменений указывает на этап, но не доказывает причину: нужна проверка белков этих систем.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1158/2159-8290.CD-20-0790">Chung J., Maruvka Y. E., Sudhaman S., Kelly J. et al. DNA polymerase and mismatch repair exert distinct microsatellite instability signatures in normal and malignant human cells. Cancer Discov. 2021;11:1176–1191</a></li></ul><p>Данные — опухоли и нормальные клетки человека (сравнение последовательностей); клинические примеры приводятся для демонстрации патофизиологического значения клеточного механизма.</p></details></article><article class="card print-unit" id="ns-damage-sources"><div class="eyebrow">Повреждения ДНК и их вырезание · шаг 7 из 26</div><h2>Откуда берутся повреждения ДНК</h2><p class="lead">ДНК химически не инертна: даже без внешних воздействий её основания изменяются в каждой клетке ежедневно. Это вторая часть вопроса: какие повреждения бывают и почему их нужно устранять до репликации. Раздел относится к вопросу 6 коллоквиума 2 (предварительный список) и вопросу 17 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Урацил в паре с G: повреждение ещё не узнано.</div><ol class="mech"><li>Гидролиз: связь основания с сахаром рвётся, и основание отщепляется — остаётся <a href="#ns-g-S8-T12">AP-сайт</a>; чаще теряются пурины (депуринизация).</li><li>Дезаминирование: цитозин теряет аминогруппу и превращается в урацил; аденин и гуанин — в гипоксантин и ксантин.</li><li>Окисление активными формами кислорода изменяет основания (например, образуется 8-оксогуанин); метилирующие вещества присоединяют метильные группы.</li><li>Ультрафиолет сшивает соседние пиримидины одной цепи — образуется <a href="#ns-g-S8-T14">пиримидиновый димер</a>; ионизирующее излучение разрывает цепи.</li></ol><p>По оценкам, приведённым в учебнике Alberts et al., в диплоидной клетке млекопитающего за сутки происходит около 18 000 депуринизаций, около 100 дезаминирований цитозина, около 1 500 окислений гуанина до 8-оксогуанина. Это оценки: они показывают порядок величины, а не точное число в каждой клетке.</p><p>Неисправленное повреждение опасно при репликации: напротив изменённого основания может встать неверный нуклеотид, а напротив AP-сайта полимераза вообще не может выбрать нуклеотид по комплементарности.</p><p>Основания ДНК таковы, что продукты их повреждения отличимы от нормальных: урацил, гипоксантин и ксантин не входят в состав ДНК в норме, поэтому их можно узнать. Тимин аминогруппы не имеет, поэтому дезаминирования тимина не бывает.</p><div class="static-quiz"><h3>Какое повреждение встречается в клетке чаще всего, по приведённым оценкам?</h3><ol><li><b>А.</b> Потеря пуриновых оснований (депуринизация) <i>(верный вариант)</i><br><span class="expl">Около 18 000 в сутки на клетку — больше, чем любое другое спонтанное повреждение в таблице.</span></li><li><b>Б.</b> Дезаминирование цитозина <i>(неверный вариант)</i><br><span class="expl">Около 100 в сутки — в сотни раз реже депуринизации.</span></li><li><b>В.</b> Пиримидиновые димеры <i>(неверный вариант)</i><br><span class="expl">Димеры возникают при ультрафиолетовом облучении; без него их почти нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Числа — оценки из учебника Alberts et al. для диплоидной клетки млекопитающего за 24 ч, без внешних воздействий.</p></details></article><article class="card print-unit" id="ns-base-excision"><div class="eyebrow">Повреждения ДНК и их вырезание · шаг 8 из 26</div><h2>Вырезание основания (BER): изменённое основание и один нуклеотид</h2><p class="lead">Небольшие изменения одного основания — урацил, окисленные и метилированные основания — устраняет путь вырезания основания (BER). Каждое изменённое основание узнаёт своя гликозилаза.</p><div class="note"><strong>Что показывает схема.</strong> Пара C–G восстановлена по другой цепи.</div><ol class="mech"><li><a href="#ns-g-S8-T11">ДНК-гликозилаза</a> (считается, что она движется по ДНК, выворачивая основания из спирали) узнаёт изменённое и отщепляет его от сахара; остов остаётся целым — образуется AP-сайт.</li><li><a href="#ns-g-S8-T13">AP-эндонуклеаза</a> надрезает остов у AP-сайта; остаток сахара удаляется, и в цепи остаётся пробел в один нуклеотид.</li><li>ДНК-полимераза встраивает нуклеотид, комплементарный основанию противоположной цепи.</li><li>ДНК-лигаза сшивает разрыв.</li></ol><p>AP-сайт, возникший самопроизвольно (например, при депуринизации), сразу узнаёт AP-эндонуклеаза: путь начинается со второго этапа. Так одна последовательность этапов устраняет и изменённые, и утраченные основания.</p><p>Для узнавания нужно, чтобы изменённое основание отличалось от нормальных. Урацил узнаётся урацил-ДНК-гликозилазой, а вот тимин, возникший при дезаминировании 5-метилцитозина, — нормальное основание; его узнаёт по ошибочной паре T·G особая гликозилаза, но эта репарация малоэффективна, и такие места чаще других дают изменения.</p><p>Промежуточные продукты пути — AP-сайт, пробел, разрыв — сами опасны, поэтому каждый быстро передаётся следующему ферменту и в норме не накапливается.</p><div class="static-quiz"><h3>Что остаётся в ДНК, если гликозилаза удалила урацил, а AP-эндонуклеазы нет?</h3><ol><li><b>А.</b> Урацил <i>(неверный вариант)</i><br><span class="expl">Урацил уже удалён гликозилазой.</span></li><li><b>Б.</b> AP-сайт <i>(верный вариант)</i><br><span class="expl">Гликозилаза отщепила основание, остов цел; надрезать цепь некому.</span></li><li><b>В.</b> Пробел в один нуклеотид <i>(неверный вариант)</i><br><span class="expl">Пробел появляется после надреза AP-эндонуклеазой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1146/annurev-biochem-013118-111315">Beard W. A., Horton J. K., Prasad R., Wilson S. H. Eukaryotic base excision repair: new approaches shine light on mechanism. Annu Rev Biochem. 2019;88:137–162</a></li></ul><p>Схема шага — модель вкладки 2. В клетке BER может заменять и более длинный участок, чем один нуклеотид; модель показывает основной вариант.</p></details></article><article class="card print-unit" id="ns-nucleotide-excision"><div class="eyebrow">Повреждения ДНК и их вырезание · шаг 9 из 26</div><h2>Вырезание нуклеотидов (NER): искажение спирали и участок около 30 нуклеотидов</h2><p class="lead">Крупные повреждения — пиримидиновые димеры, присоединённые к основаниям крупные химические группы — искажают двойную спираль. Их устраняет путь вырезания нуклеотидов (NER), который узнаёт не определённое основание, а само искажение.</p><div class="note"><strong>Что показывает схема.</strong> Участок с димером удалён и достроен по другой цепи.</div><ol class="mech"><li><a href="#ns-g-S8-T15">Белок XPC</a> находит искажённый участок; комплекс TFIIH раскрывает спираль вокруг него и проверяет, есть ли в цепи повреждение.</li><li>Две <a href="#ns-g-S8-T16">нуклеазы</a> надрезают повреждённую цепь по обе стороны от повреждения, и участок около 30 нуклеотидов удаляется целиком.</li><li>ДНК-полимераза достраивает <a href="#ns-g-S8-T17">пробел</a> по неповреждённой цепи.</li><li>ДНК-лигаза сшивает разрыв.</li></ol><p>Узнавание по искажению делает путь универсальным: одни и те же белки устраняют очень разные повреждения, если они меняют форму спирали.</p><p>В генах, которые в этот момент транскрибируются, сигналом служит РНК-полимераза, остановившаяся на повреждении в матричной цепи. Так повреждения в работающих генах устраняются быстрее (транскрипционно-сопряжённая репарация).</p><p>В клетках человека пиримидиновые димеры удаляются путём NER. Наследственные дефекты белков NER делают кожу очень чувствительной к солнечному свету и повышают риск рака кожи; это клинический пример значения механизма.</p><div class="static-quiz"><h3>Чем узнавание повреждения в NER отличается от узнавания в BER?</h3><ol><li><b>А.</b> NER узнаёт ошибочные пары, BER — разрывы <i>(неверный вариант)</i><br><span class="expl">Ошибочные пары — субстрат MMR; разрывы обеих цепей — тема раздела 3.</span></li><li><b>Б.</b> Различий нет: оба пути начинаются с гликозилазы <i>(неверный вариант)</i><br><span class="expl">Гликозилаза — фермент BER; NER начинается с белков, находящих искажение спирали.</span></li><li><b>В.</b> NER узнаёт искажение двойной спирали, а BER — определённое изменённое основание <i>(верный вариант)</i><br><span class="expl">Поэтому один набор белков NER устраняет разные объёмные повреждения, а в BER для разных оснований — разные гликозилазы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1038/s41586-023-05959-z">Kim J., Li C.-L., Chen X., Cui Y., Golebiowski F. M., Wang H., Hanaoka F., Sugasawa K., Yang W. Lesion recognition by XPC, TFIIH and XPA in DNA excision repair. Nature. 2023;617:170–175</a></li></ul><p>Схема шага — модель вкладки 2; длина участка на схеме сокращена. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p></details></article><article class="card print-unit" id="ns-template-strand"><div class="eyebrow">Повреждения ДНК и их вырезание · шаг 10 из 26</div><h2>Почему восстановление точное: матрица — неповреждённая цепь</h2><p class="lead">Пути BER и NER различаются узнаванием и размером вырезаемого участка, но сходятся в главном. Это последняя часть вопроса 6: восстановление последовательности по неповреждённой цепи.</p><div class="note"><strong>Что показывает схема.</strong> Восстановлено по неповреждённой цепи.</div><ol class="mech"><li>Информация в ДНК записана дважды: каждая цепь задаёт другую.</li><li>После удаления повреждённого участка ДНК-полимераза синтезирует новый участок по <a href="#ns-g-S8-T21">неповреждённой цепи</a> как по матрице.</li><li>Поэтому восстановленная последовательность совпадает с исходной — независимо от того, какой путь сработал.</li><li>Если повреждены обе цепи на одном участке, правильной матрицы в этой молекуле нет.</li></ol><p>По той же причине MMR сохраняет последовательность: она заменяет участок новой цепи, используя матрицу как образец.</p><p>Когда противоположная цепь повреждена напротив, точно восстановить участок по этой молекуле нельзя: возможно изменение последовательности, а близкие надрезы в двух цепях могут дать разрыв обеих цепей. Тогда нужна другая молекула с той же последовательностью — об этом раздел 3.</p><p>Итог «повреждение устранено» не говорит, каким путём это сделано: одинаково восстановленную ДНК дают BER, NER и, для ошибочных пар, MMR.</p><div class="static-quiz"><h3>Почему BER и NER восстанавливают исходную последовательность точно?</h3><ol><li><b>А.</b> Новый участок синтезируется по неповреждённой цепи <i>(верный вариант)</i><br><span class="expl">Информация записана в двух комплементарных цепях; одна служит образцом для другой.</span></li><li><b>Б.</b> Ферменты запоминают удалённый нуклеотид <i>(неверный вариант)</i><br><span class="expl">Ферменты не хранят информацию о последовательности; её даёт матрица.</span></li><li><b>В.</b> Вырезанный участок возвращается на место после ремонта <i>(неверный вариант)</i><br><span class="expl">Вырезанный участок удаляется, новый синтезируется заново.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Схема шага — модель вкладки 2.</p></details></article><article class="card print-unit" id="ns-two-recognitions"><div class="eyebrow">Повреждения ДНК и их вырезание · шаг 11 из 26</div><h2>Два разных сигнала — одна система вырезания: как сходятся пути узнавания NER</h2><p class="lead">Уже известно: в NER повреждение находит XPC, а в транскрибируемых генах — остановившаяся РНК-полимераза (БИО-8·9). Новое: что происходит дальше и почему разные сигналы ведут к одному результату.</p><div class="note"><strong>Что показывает схема.</strong> Все 100 повреждений устранены.</div><ol class="mech"><li>Белок узнавания XPC передаёт ДНК комплексу TFIIH; по положению повреждения в комплексе авторы заключают, что и сигнал от остановившейся РНК-полимеразы передаётся тому же TFIIH.</li><li>Две хеликазы этого комплекса движутся по повреждённой цепи в противоположных направлениях и подтягивают повреждение к месту проверки.</li><li>Белок XPA изгибает ДНК и закрепляет это положение.</li><li>По ранее полученным данным, цепь надрезается, когда раскрытый участок достигает примерно 24–34 нуклеотидов.</li></ol><p>Так устроена двухступенчатая система: сначала находят искажение, затем проверяют, есть ли в цепи повреждение. Это снижает вероятность ненужного вырезания неповреждённой ДНК.</p><p>Следствие для рассуждения: одинаковый итог (повреждение устранено) может быть получен разными путями узнавания. Если один путь узнавания нарушен, повреждения устраняются только там, где работает другой, — например, только в транскрибируемых генах.</p><p>Как это узнали: собрали комплексы из очищенных белков человека на ДНК с модельным повреждением (не на пиримидиновом димере) и определили их строение для пути через XPC; надрезы проверяли в бесклеточной системе. Это показывает возможное взаимодействие белков, но не скорость процесса в клетке.</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>В клетках нет XPC, но работает узнавание по остановившейся РНК-полимеразе. Где будут устранены пиримидиновые димеры?</h3><ol><li><b>А.</b> Во всём геноме, но медленнее <i>(неверный вариант)</i><br><span class="expl">РНК-полимераза не проходит по нетранскрибируемым участкам и сигнала там не даёт.</span></li><li><b>Б.</b> В основном в транскрибируемых генах, в их матричной цепи <i>(верный вариант)</i><br><span class="expl">Остановившаяся РНК-полимераза — сигнал только там, где идёт транскрипция.</span></li><li><b>В.</b> Нигде: без XPC NER невозможна <i>(неверный вариант)</i><br><span class="expl">Второй сигнал передаёт ДНК тому же комплексу проверки, и путь продолжается.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-023-05959-z">Kim J., Li C.-L., Chen X., Cui Y., Golebiowski F. M., Wang H., Hanaoka F., Sugasawa K., Yang W. Lesion recognition by XPC, TFIIH and XPA in DNA excision repair. Nature. 2023;617:170–175</a></li></ul><p>Очищенные белки человека; строение комплексов и надрезы в бесклеточной системе. Числа на схеме — учебные значения модели вкладки 2.</p></details></article><article class="card print-unit" id="ns-intermediates"><div class="eyebrow">Повреждения ДНК и их вырезание · шаг 12 из 26</div><h2>Что накапливается при остановке репарации и что это говорит о причине</h2><p class="lead">Уже известно: BER и NER — цепочки этапов (БИО-8·8, БИО-8·9). Новое: по тому, что накопилось, можно судить, на каком этапе путь остановился.</p><div class="note"><strong>Что показывает схема.</strong> Накопились AP-сайты: гликозилаза сработала.</div><ol class="mech"><li>Если остановлен этап, накапливается продукт предыдущего: AP-сайт, пробел или разрыв в одной цепи.</li><li>В модели накопление промежуточного продукта указывает, что узнавание произошло. В клетке AP-сайты возникают и самопроизвольно, поэтому нужен контроль: сколько их без урацила.</li><li>Если же на месте само повреждение, причин может быть несколько: нет узнавания, нет надреза после узнавания, работает только ограниченный путь узнавания.</li><li>Промежуточные продукты с разрывами опасны; продукт одного этапа сразу передаётся ферменту следующего.</li></ol><p>В модели 100 условных повреждений: при исправном пути через то же время все устранены; при остановке на сшивании — 100 разрывов, на синтезе — 100 пробелов, на вскрытии цепи — 100 AP-сайтов (для урацила).</p><p>Обратная задача: повреждений не осталось, но цепь разорвана во многих местах — значит, пройдены узнавание, надрез и синтез, а не прошло сшивание. Если же повреждения на месте и промежуточных продуктов нет, одного этого наблюдения мало: нужно проверить, узнано ли повреждение и где оно устранено.</p><p>Модель не показывает скорости этапов: в клетке промежуточные продукты есть всегда (AP-сайтов в клетке млекопитающего одновременно десятки тысяч), и накопленный продукт может сам вызывать гибель клетки или превращаться при репликации в разрыв обеих цепей.</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Урацила в клетках не осталось, но накопились пробелы в один нуклеотид. Какой этап BER не прошёл?</h3><ol><li><b>А.</b> Узнавание урацила <i>(неверный вариант)</i><br><span class="expl">Если бы урацил не был узнан, он остался бы в ДНК.</span></li><li><b>Б.</b> Сшивание <i>(неверный вариант)</i><br><span class="expl">При остановке на сшивании остались бы разрывы без пробелов.</span></li><li><b>В.</b> Синтез: полимераза не встроила нуклеотид <i>(верный вариант)</i><br><span class="expl">Узнавание и надрез прошли — урацила нет, остов надрезан; не заполнен пробел.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-013118-111315">Beard W. A., Horton J. K., Prasad R., Wilson S. H. Eukaryotic base excision repair: new approaches shine light on mechanism. Annu Rev Biochem. 2019;88:137–162</a></li><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Учебная модель с условными долями; принцип связанности этапов BER — по обзору.</p></details></article><article class="card print-unit" id="ns-dsb-danger"><div class="eyebrow">Разрыв обеих цепей: соединение концов и гомологичная рекомбинация · шаг 13 из 26</div><h2>Почему разрыв обеих цепей особенно опасен</h2><p class="lead">Уже известно: повреждение одной цепи устраняется по неповреждённой цепи (БИО-8·10). Новое: при <a href="#ns-g-S8-T23">разрыве обеих цепей</a> такой цепи на месте разрыва нет, а молекула разделена на две части. Раздел относится к вопросу 7 коллоквиума 2 (предварительный список) и вопросу 18 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Концы не соединены: фрагмент может быть утрачен при делении.</div><ol class="mech"><li>Разрыв обеих цепей вызывают ионизирующее излучение, некоторые химические вещества, а также разрушение репликационной вилки.</li><li>Без репарации фрагмент хромосомы без центромеры при делении не распределяется к полюсам и утрачивается вместе с генами.</li><li>Для соединения концов матрица не нужна; для восстановления утраченных нуклеотидов нужна другая молекула ДНК с той же последовательностью.</li><li>Поэтому в клетке два основных пути: негомологичное соединение концов (NHEJ) и гомологичная рекомбинация (HR).</li></ol><p>Повреждения, затрагивающие обе цепи в одном месте, — например, близкие повреждения двух цепей (БИО-8·10) — тоже могут превратиться в разрыв обеих цепей при попытке репарации или при репликации.</p><p>Различайте две задачи репарации разрыва: восстановить целостность молекулы (соединить концы) и восстановить исходную последовательность (вернуть утраченные нуклеотиды). Это разные результаты, и пути решают их по-разному.</p><p>При разрыве переход клетки к следующему периоду цикла обычно задерживается, и на это время разрыв может быть устранён; как устроена эта задержка, — в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Почему разрыв обеих цепей нельзя устранить так же, как повреждение одной цепи путём BER или NER?</h3><ol><li><b>А.</b> На месте разрыва нет целой цепи, которая служила бы матрицей <i>(верный вариант)</i><br><span class="expl">BER и NER достраивают участок по противоположной цепи; при разрыве обеих цепей её нет.</span></li><li><b>Б.</b> Ферменты BER и NER не проникают в ядро <i>(неверный вариант)</i><br><span class="expl">Они работают в ядре; дело не в доступности, а в отсутствии матрицы.</span></li><li><b>В.</b> Разрыв обеих цепей не узнаётся клеткой <i>(неверный вариант)</i><br><span class="expl">Разрыв узнаётся, в том числе белками Ku; трудность — в восстановлении информации.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Схема шага — модель вкладки 3.</p></details></article><article class="card print-unit" id="ns-nhej"><div class="eyebrow">Разрыв обеих цепей: соединение концов и гомологичная рекомбинация · шаг 14 из 26</div><h2>Негомологичное соединение концов: целостность без матрицы</h2><p class="lead">Самый простой способ — соединить концы напрямую. Так работает негомологичное соединение концов (NHEJ). Оно возможно в любом периоде цикла и у млекопитающих преобладает в соматических клетках.</p><div class="note"><strong>Что показывает схема.</strong> Концы сшиты без потерь: последовательность как исходная.</div><ol class="mech"><li><a href="#ns-g-S8-T28">Белки Ku</a> (комплекс Ku70–Ku80) связываются с каждым из концов разрыва: кольцо комплекса охватывает конец ДНК. Вместе с другими белками NHEJ они удерживают концы рядом.</li><li>Если концы повреждены, их обрабатывают: удаляют повреждённые нуклеотиды или достраивают короткие участки.</li><li><a href="#ns-g-S8-T29">Лигаза IV</a> сшивает концы.</li><li>Длинная гомологичная матрица не нужна: возможно лишь спаривание нескольких нуклеотидов на концах и короткая достройка, поэтому утраченные нуклеотиды не восстанавливаются.</li></ol><p>Если концы разрыва не повреждены и подходят друг к другу (совместимы), соединение возвращает исходную последовательность. Если концы повреждены и их обрабатывают, на месте соединения обычно теряется несколько нуклеотидов. Точность NHEJ, таким образом, определяется состоянием концов, а не самим путём.</p><p>По оценке, приведённой в учебнике Alberts et al., к 70 годам в типичной соматической клетке человека более 2000 мест, где разрыв был соединён неточно. Большая часть генома не кодирует белок, поэтому многие такие изменения не нарушают работу клетки.</p><p>Другая опасность NHEJ — соединение концов разных хромосом, если разрывов несколько. Поэтому естественные концы хромосом должны быть защищены от этого пути (раздел 4).</p><div class="static-quiz"><h3>Всегда ли негомологичное соединение концов изменяет последовательность?</h3><ol><li><b>А.</b> Да: без матрицы соединение всегда неточное <i>(неверный вариант)</i><br><span class="expl">Матрица нужна, чтобы восстановить утраченное; если ничего не утрачено, восстанавливать нечего.</span></li><li><b>Б.</b> Нет: совместимые неповреждённые концы соединяются без потерь <i>(верный вариант)</i><br><span class="expl">Нуклеотиды теряются при обработке повреждённых концов; если обрабатывать нечего, последовательность сохраняется.</span></li><li><b>В.</b> Нет: NHEJ использует сестринскую хроматиду <i>(неверный вариант)</i><br><span class="expl">NHEJ не копирует сестринскую хроматиду: длинная гомологичная матрица нужна гомологичной рекомбинации.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1146/annurev-biochem-080320-110356">Stinson B. M., Loparo J. J. Repair of DNA double-strand breaks by the nonhomologous end joining pathway. Annu Rev Biochem. 2021;90:137–164</a></li><li><a href="https://doi.org/10.1371/journal.pgen.1004086">Bétermier M., Bertrand P., Lopez B. S. Is non-homologous end-joining really an inherently error-prone process? PLoS Genet. 2014;10:e1004086</a></li><li><a href="https://doi.org/10.1038/s41580-019-0152-0">Scully R., Panday A., Elango R., Willis N. A. DNA double-strand break repair-pathway choice in somatic mammalian cells. Nat Rev Mol Cell Biol. 2019;20:698–714</a></li></ul><p>Схема шага — модель вкладки 3: утрата 4 пар нуклеотидов — условный пример.</p></details></article><article class="card print-unit" id="ns-homologous-recombination"><div class="eyebrow">Разрыв обеих цепей: соединение концов и гомологичная рекомбинация · шаг 15 из 26</div><h2>Гомологичная рекомбинация: участок восстанавливается по сестринской хроматиде</h2><p class="lead">Чтобы вернуть утраченные нуклеотиды, нужна неповреждённая копия того же участка. После репликации ДНК такая копия есть — <a href="#ns-g-S8-T25">сестринская хроматида</a>. Её использует гомологичная рекомбинация (HR).</p><div class="note"><strong>Что показывает схема.</strong> Участок восстановлен по сестринской хроматиде.</div><ol class="mech"><li><a href="#ns-g-S8-T30">Нуклеазы резекции</a> укорачивают 5′-концы разрыва; на обоих концах остаются одноцепочечные 3′-участки, сначала покрытые белком RPA.</li><li><a href="#ns-g-S8-T31">RAD51</a> собирается на 3′-участке и обеспечивает поиск комплементарного участка в сестринской хроматиде.</li><li>3′-конец встраивается в сестринскую молекулу и спаривается с её комплементарной цепью; вытесненная цепь образует D-петлю.</li><li>ДНК-полимераза удлиняет 3′-конец по матрице; затем удлинённая цепь соединяется со вторым концом разрыва, пробелы заполняются, лигаза сшивает. Сестринская хроматида остаётся неизменной.</li></ol><p>Гомологичная рекомбинация точна, потому что копирует матрицу, а сестринская хроматида — точная копия, возникшая при репликации. Сёстры удерживаются рядом <a href="#ns-g-S8-T26">когезином</a> до анафазы митоза, что облегчает поиск.</p><p>Резекция — первый и решающий этап: после неё концы уже не подходят для прямого соединения. Нуклеазы резекции активны в основном в S и G2, поэтому гомологичная рекомбинация работает в эти периоды.</p><p>Гомологичная рекомбинация — точное копирование матрицы, а не гарантия исходной последовательности: если матрицей окажется не сестринская хроматида, а гомологичная хромосома другого родителя, участок станет таким, как в ней (продвинутый шаг раздела).</p><div class="static-quiz"><h3>Почему гомологичная рекомбинация восстанавливает утраченные нуклеотиды, а NHEJ — нет?</h3><ol><li><b>А.</b> Она использует более точную лигазу <i>(неверный вариант)</i><br><span class="expl">Точность определяется наличием матрицы, а не лигазой.</span></li><li><b>Б.</b> Она соединяет концы медленнее и аккуратнее <i>(неверный вариант)</i><br><span class="expl">Дело не в скорости: без матрицы утраченное восстановить не по чему.</span></li><li><b>В.</b> Она копирует недостающий участок с неповреждённой молекулы — сестринской хроматиды <i>(верный вариант)</i><br><span class="expl">Утраченную информацию можно восстановить только по другой копии; HR её использует.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1038/s41580-019-0152-0">Scully R., Panday A., Elango R., Willis N. A. DNA double-strand break repair-pathway choice in somatic mammalian cells. Nat Rev Mol Cell Biol. 2019;20:698–714</a></li></ul><p>Схема шага — модель вкладки 3; этапы рекомбинации показаны упрощённо, без образования перекрёстных структур.</p></details></article><article class="card print-unit" id="ns-phase-and-template"><div class="eyebrow">Разрыв обеих цепей: соединение концов и гомологичная рекомбинация · шаг 16 из 26</div><h2>Стадия клеточного цикла определяет, есть ли матрица</h2><p class="lead">Уже известно: в S-фазе ДНК реплицируется, и до митоза хромосома состоит из двух сестринских хроматид (семинар 6). Отсюда связь пути репарации разрыва со стадией цикла — последняя часть вопроса 7.</p><div class="note"><strong>Что показывает схема.</strong> G1: концы соединены, утрачено 4 пары.</div><ol class="mech"><li>В G1 сестринской хроматиды нет: обычно используется NHEJ; возможность и исход репарации зависят от условий (состояния концов, доступных белков).</li><li>В S и G2 сестринская хроматида есть, и нуклеазы резекции активны: возможна гомологичная рекомбинация.</li><li>NHEJ возможен и в S/G2; в эти периоды пути конкурируют.</li><li>Точность определяется не стадией как таковой, а тем, используется ли матрица; стадия определяет, есть ли она.</li></ol><p>Гомологичная хромосома другого родителя есть в клетке всегда, но в соматических клетках для репарации разрыва она используется редко: сестринская хроматида удерживается рядом когезином, а гомологичная хромосома — обычно нет.</p><p>Резекция концов активна в S и G2 — в те периоды, когда в клетке есть сестринская хроматида.</p><p>Как клетка регулирует выбор пути по стадии цикла и состоянию концов, разбирается в курсе «Молекулярная биология»; на этом курсе достаточно связи «есть копия — возможна рекомбинация».</p><div class="static-quiz"><h3>Клетка в G2, но нуклеазы резекции не работают. Каким путём, по учебной модели этого семинара, будет устранён разрыв обеих цепей и будет ли восстановлена исходная последовательность?</h3><ol><li><b>А.</b> NHEJ; последовательность восстановится, только если концы совместимы <i>(верный вариант)</i><br><span class="expl">Без резекции HR не начинается, хотя сестринская хроматида есть; соединение без матрицы точно лишь при неповреждённых концах.</span></li><li><b>Б.</b> Гомологичной рекомбинацией по сестринской хроматиде, точно <i>(неверный вариант)</i><br><span class="expl">RAD51 собирается на одноцепочечном 3′-конце, который образуется только при резекции.</span></li><li><b>В.</b> Разрыв будет сохраняться до митоза <i>(неверный вариант)</i><br><span class="expl">NHEJ работает во всех периодах клеточного цикла, в том числе в G2.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1038/s41580-019-0152-0">Scully R., Panday A., Elango R., Willis N. A. DNA double-strand break repair-pathway choice in somatic mammalian cells. Nat Rev Mol Cell Biol. 2019;20:698–714</a></li></ul><p>Схема шага — модель вкладки 3: в G2 при всех деталях показана HR; в клетке в G2 работают оба пути.</p></details></article><article class="card print-unit" id="ns-integrity-vs-sequence"><div class="eyebrow">Разрыв обеих цепей: соединение концов и гомологичная рекомбинация · шаг 17 из 26</div><h2>Целостность молекулы и исходная последовательность — разные результаты</h2><p class="lead">Уже известно: NHEJ соединяет концы без матрицы, HR копирует матрицу (БИО-8·14, БИО-8·15). Новое: какой результат даёт каждый путь при разной доступной информации.</p><div class="note"><strong>Что показывает схема.</strong> Без матрицы, но без потерь: последовательность как исходная.</div><ol class="mech"><li>Без матрицы: если соединение концов завершилось успешно, целостность восстановлена; исходная последовательность — только при совместимых концах.</li><li>С сестринской хроматидой: восстанавливается и целостность, и исходная последовательность.</li><li>С гомологичной хромосомой: целостность восстановлена, утраченные нуклеотиды тоже, но по её последовательности — различие между родительскими вариантами на этом участке утрачивается (потеря гетерозиготности).</li><li>Значит, точное копирование матрицы не равно восстановлению исходной последовательности.</li></ol><p>Обратная задача: последовательность на месте разрыва совпадает с исходной. Такой итог дают и рекомбинация с сестринской хроматидой, и точное соединение совместимых концов — по одному этому наблюдению путь не установить. Помогли бы другие наблюдения: стадия цикла, состояние концов, зависимость результата от RAD51 или от Ku.</p><p>Обратная задача: на месте соединения утрачено несколько пар. Значит, информация не была скопирована; это возможно и в G1, и в G2, если сестринская хроматида не использована.</p><p>Гомологичная рекомбинация тоже не безошибочна: при синтезе по матрице возможны ошибки, а некоторые её варианты, при которых копируется длинный участок, особенно склонны к изменениям. Потеря гетерозиготности, хотя и редкое событие, — один из этапов развития многих опухолей; это пример значения механизма.</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>После восстановления разрыва в G2 участок совпал с гомологичной хромосомой, а не с исходной молекулой. Что произошло?</h3><ol><li><b>А.</b> Концы были соединены NHEJ с ошибкой <i>(неверный вариант)</i><br><span class="expl">NHEJ не копирует последовательность другой хромосомы; он может лишь утратить нуклеотиды.</span></li><li><b>Б.</b> Матрицей для рекомбинации послужила гомологичная хромосома, а не сестринская хроматида <i>(верный вариант)</i><br><span class="expl">Рекомбинация точно копирует матрицу; если матрица отличается от исходной, результат тоже будет отличаться.</span></li><li><b>В.</b> Произошло новое изменение в гомологичной хромосоме <i>(неверный вариант)</i><br><span class="expl">Гомологичная хромосома не меняется: она служит образцом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1038/s41580-019-0152-0">Scully R., Panday A., Elango R., Willis N. A. DNA double-strand break repair-pathway choice in somatic mammalian cells. Nat Rev Mol Cell Biol. 2019;20:698–714</a></li></ul><p>Учебная модель вкладки 3 (продвинутый уровень): различие в позиции 7 и утрата 4 пар — условный пример. В модели показаны только успешно завершившиеся варианты репарации; неудачная репарация, гибель клетки и другие пути в ней не учитываются.</p></details></article><article class="card print-unit" id="ns-sister-nearby"><div class="eyebrow">Разрыв обеих цепей: соединение концов и гомологичная рекомбинация · шаг 18 из 26</div><h2>Сестринская хроматида помогает, если она рядом: роль когезина</h2><p class="lead">Уже известно: сёстры удерживаются вместе когезином до анафазы (семинар 6; БИО-8·15). Новое: это удержание важно не только для расхождения хромосом, но и для точной репарации.</p><div class="note"><strong>Что показывает схема.</strong> Участок восстановлен по сестринской хроматиде.</div><ol class="mech"><li>Когезия держит сестринскую хроматиду рядом с разрывом и облегчает поиск комплементарного участка.</li><li>Она же снижает вероятность того, что матрицей станет другой похожий участок генома (повтор или гомологичная хромосома).</li><li>У дрожжей показано, что после разрыва когезин дополнительно накапливается у повреждённого участка; предполагают, что это укрепляет связь с сестрой и облегчает точную рекомбинацию.</li><li>Наличие копии в клетке и её доступность — разные условия.</li></ol><p>В модели продвинутого уровня есть положение «сестринская хроматида не удержана рядом»: копия есть, но не найдена, и концы соединяются без матрицы — как в G1. Это упрощение: в клетке поиск идёт и на расстоянии, но с меньшим успехом.</p><p>Когезин участвует и в других процессах — например, образует петли хроматина; это тема курса «Молекулярная биология» (<a href="https://fresll.github.io/molbio/seminar-6-route.html#loops">МБ, семинар 6, шаг 11</a>).</p><p>Как это узнали: вызывали разрыв в известном месте генома и определяли, где связывается когезин и как часто разрыв устраняется по сестринской хроматиде; данные для дрожжей и клеток млекопитающих обобщены в обзоре. Роль накопления когезина у разрыва — предположение авторов, а не прямо измеренное следствие для клеток человека.</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Клетка в G2, сестринская хроматида есть, но когезия нарушена. Какой исход разрыва с утратой нуклеотидов вероятнее в модели?</h3><ol><li><b>А.</b> Точное восстановление по сестринской хроматиде <i>(неверный вариант)</i><br><span class="expl">Для рекомбинации копию нужно найти; удержание рядом этому способствует.</span></li><li><b>Б.</b> Разрыв не будет устранён <i>(неверный вариант)</i><br><span class="expl">NHEJ возможен в любом периоде цикла.</span></li><li><b>В.</b> Соединение концов без матрицы с утратой нуклеотидов <i>(верный вариант)</i><br><span class="expl">Копия есть, но не удержана рядом; в модели она не найдена, и концы соединяются напрямую.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-026-00988-6">Marin-Gonzalez A., Ha T. Folding a broken genome: the versatile roles of cohesin in genome maintenance. Nat Rev Genet. 2026</a></li></ul><p>Обзор; данные о накоплении когезина у разрыва получены на дрожжах.</p></details></article><article class="card print-unit" id="ns-end-replication"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 19 из 26</div><h2>Почему конец линейной ДНК при репликации укорачивается</h2><p class="lead">Уже известно: ДНК-полимераза лишь удлиняет имеющийся 3′-OH, а каждый фрагмент отстающей цепи начинается с РНК-затравки (<a href="https://fresll.github.io/bio/seminar-7-route.html#okazaki-maturation">вспомнить БИО-7·18</a>). Новое: у конца линейной молекулы это приводит к неполному копированию. Раздел относится к вопросу 5 коллоквиума 2 (предварительный список) и вопросу 16 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Двуцепочечная часть конца стала короче на условный повтор.</div><ol class="mech"><li>У конца, где новой цепью становится C-цепь (её синтез идёт фрагментами), последнюю РНК-затравку отстающей цепи нельзя заменить ДНК: после её удаления перед участком нет 3′-OH, от которого полимераза могла бы начать синтез.</li><li>Одноцепочечный 3′-выступ G-цепи восстанавливается тем, что специальная нуклеаза укорачивает 5′-конец C-цепи.</li><li>В обоих случаях конец становится короче — на каждой репликации.</li><li>У бактерий с кольцевой ДНК этой проблемы нет: у кольца нет концов.</li></ol><p>Пока укорачиваются повторы <a href="#ns-g-S8-T34">теломер</a>, гены не затрагиваются. В клетках с низкой активностью теломеразы теломеры теряют, по оценке, приведённой в учебнике Alberts et al., 100–200 нуклеотидов за деление; в разных клетках и условиях измеряли от десятков до сотен нуклеотидов.</p><p>Почему укорачиваются оба конца хромосомы и чем различаются причины укорочения на двух концах — продвинутый шаг раздела.</p><p>Если изменить условие и рассмотреть кольцевую хромосому бактерии или митохондрии, укорочения при репликации не будет: на кольце нет последнего фрагмента без места для затравки.</p><div class="static-quiz"><h3>Почему ДНК-полимераза не может достроить новую цепь до самого конца линейной молекулы?</h3><ol><li><b>А.</b> Она лишь удлиняет имеющийся 3′-OH, а для последнего участка нет затравки <i>(верный вариант)</i><br><span class="expl">Начать цепь заново полимераза не может; последнюю РНК-затравку нельзя заменить ДНК.</span></li><li><b>Б.</b> У конца матрица разрушена <i>(неверный вариант)</i><br><span class="expl">Матрица не повреждена; дело в устройстве синтеза, а не в повреждении.</span></li><li><b>В.</b> Полимераза синтезирует цепь в направлении 3′→5′ <i>(неверный вариант)</i><br><span class="expl">Синтез идёт 5′→3′; поэтому новой цепи нужен 3′-OH, и без затравки начать участок нельзя.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Схема шага — модель вкладки 4: один повтор на схеме обозначает много повторов; показан конец, у которого новая цепь — C-цепь.</p></details></article><article class="card print-unit" id="ns-telomere-cap"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 20 из 26</div><h2>Как устроена теломера и почему её конец не принимается за разрыв</h2><p class="lead">Конец линейной хромосомы — конец двойной спирали, как у разрыва. Если бы его репарировали как разрыв, хромосомы сшивались бы концами. Это вторая часть вопроса 5: защитная организация теломер.</p><div class="note"><strong>Что показывает схема.</strong> Конец защищён: 3′-выступ в t-петле.</div><ol class="mech"><li>Теломера человека — тысячи пар нуклеотидов из повторов TTAGGG; <a href="#ns-g-S8-T35">G-цепь</a> длиннее и образует одноцепочечный <a href="#ns-g-S8-T37">3′-выступ</a>.</li><li>С повторами связан <a href="#ns-g-S8-T41">шелтерин</a> — комплекс из шести белков; одни связывают двуцепочечные повторы, другие — одноцепочечный выступ.</li><li>Белок шелтерина TRF2 необходим, чтобы 3′-выступ встроился в двуцепочечную часть теломеры: образуется <a href="#ns-g-S8-T42">t-петля</a>.</li><li>Считается, что в такой структуре конец недоступен белкам, узнающим разрывы: не включается сигнал повреждения и не работает NHEJ; t-петля — объяснение защиты, которое предлагают на основании наблюдений, а не прямо доказанный механизм.</li></ol><p>Защита — свойство структуры конца, а не только его длины: без TRF2 даже длинная теломера узнаётся как разрыв, и концы хромосом сшиваются (продвинутый шаг раздела).</p><p>Конец хромосомы отличается от разрыва, таким образом, не формой ДНК (она одинакова), а связанными с ней белками и пространственной структурой.</p><p>t-петлю видели в электронном микроскопе на концах хромосом человека; её размер — тысячи пар нуклеотидов.</p><div class="static-quiz"><h3>Что мешает клетке принять естественный конец хромосомы за разрыв?</h3><ol><li><b>А.</b> Особая последовательность концевых нуклеотидов, которую не узнаёт ни один белок <i>(неверный вариант)</i><br><span class="expl">Повторы сами по себе не защищают; защищают связанные с ними белки и структура конца.</span></li><li><b>Б.</b> Шелтерин и t-петля, в которой 3′-выступ спрятан в двойную спираль <i>(верный вариант)</i><br><span class="expl">Считается, что белки разрывов не получают доступа к концу, и сигнал повреждения не включается.</span></li><li><b>В.</b> Конец хромосомы химически отличается от конца разрыва <i>(неверный вариант)</i><br><span class="expl">Концы ДНК устроены одинаково; различие — в белках и структуре.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1038/s41580-021-00328-y">Lim C. J., Cech T. R. Shaping human telomeres: from shelterin and CST complexes to telomeric chromatin organization. Nat Rev Mol Cell Biol. 2021;22:283–298</a></li><li><a href="https://doi.org/10.1016/j.cell.2013.09.048">Doksani Y., Wu J. Y., de Lange T., Zhuang X. Super-resolution fluorescence imaging of telomeres reveals TRF2-dependent T-loop formation. Cell. 2013;155:345–356</a></li></ul><p>Схема шага — модель вкладки 4, панель Б.</p></details></article><article class="card print-unit" id="ns-telomerase"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 21 из 26</div><h2>Теломераза: ДНК по собственной РНК</h2><p class="lead">Укорочение можно возместить, если удлинить G-цепь. Это делает фермент <a href="#ns-g-S8-T38">теломераза</a>. Это третья часть вопроса 5: работа теломеразы.</p><div class="note"><strong>Что показывает схема.</strong> Длина восстановлена: G-цепь удлинена, C-цепь достроена.</div><ol class="mech"><li>Теломераза — обратная транскриптаза: её белок синтезирует ДНК по матрице из <a href="#ns-g-S8-T39">собственной РНК</a>.</li><li>Участок РНК теломеразы спаривается с концом G-цепи, и к её 3′-концу присоединяются нуклеотиды повтора TTAGGG; субстраты — обычные dNTP.</li><li>Фермент сдвигается к новому 3′-концу, и цикл повторяется — добавляются десятки повторов.</li><li>Удлинённая G-цепь служит матрицей для C-цепи, которую достраивают <a href="#ns-g-S8-T40">ДНК-полимераза α с праймазой</a>; 3′-выступ при этом сохраняется.</li></ol><p>Теломераза удлиняет только одну цепь — G-цепь. Без достройки C-цепи растёт лишь одноцепочечный выступ, а двуцепочечная часть остаётся короткой.</p><p>Теломераза — пример переноса информации от РНК к ДНК в клетках человека: матрицей служит РНК, а продуктом — ДНК.</p><p>Высокая активность теломеразы — в половых клетках и многих стволовых клетках, а также примерно в 90 % опухолевых клеток; в большинстве соматических клеток она низкая. Если ввести активный ген теломеразы в фибробласты человека в культуре, теломеры перестают укорачиваться, и многие клетки продолжают делиться неограниченно.</p><div class="static-quiz"><h3>Какую цепь удлиняет теломераза и что служит ей матрицей?</h3><ol><li><b>А.</b> 5′-конец C-цепи; матрица — G-цепь <i>(неверный вариант)</i><br><span class="expl">C-цепь достраивают полимераза α с праймазой; теломераза удлиняет G-цепь.</span></li><li><b>Б.</b> Обе цепи; матрица — повторы соседней хромосомы <i>(неверный вариант)</i><br><span class="expl">Теломераза не использует ДНК-матрицу: её матрица — собственная РНК.</span></li><li><b>В.</b> 3′-конец G-цепи; матрица — РНК в составе самой теломеразы <i>(верный вариант)</i><br><span class="expl">Теломераза — обратная транскриптаза: ДНК по собственной РНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li><li><a href="https://doi.org/10.1038/s41580-021-00328-y">Lim C. J., Cech T. R. Shaping human telomeres: from shelterin and CST complexes to telomeric chromatin organization. Nat Rev Mol Cell Biol. 2021;22:283–298</a></li></ul><p>Схема шага — модель вкладки 4. Числа — по учебнику Alberts et al. для клеток человека в культуре и опухолей.</p></details></article><article class="card print-unit" id="ns-shortening"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 22 из 26</div><h2>Укорочение теломер при делениях и предел числа делений</h2><p class="lead">Без теломеразы потери накапливаются с каждым делением. Что происходит, когда теломеры становятся очень короткими?</p><div class="note"><strong>Что показывает схема.</strong> Исходная длина; конец защищён.</div><ol class="mech"><li>В большинстве соматических клеток человека теломеразы мало, и теломеры при каждом делении укорачиваются.</li><li>Когда теломеры становятся критически короткими, их защита утрачивается, и концы узнаются как разрывы.</li><li>В клетках с сохранными контрольными системами сигнал повреждения обычно приводит к стойкой остановке делений — репликативной сенесценции; клетка при этом остаётся живой. Возможны и другие исходы: гибель клетки или, если контрольные системы нарушены, продолжение делений с нестабильностью хромосом.</li><li>Фибробласты человека в культуре, по оценке, приведённой в учебнике Alberts et al., делятся около 60 раз, прежде чем прекращают деления.</li></ol><p>Число возможных делений зависит от типа клеток, исходной длины теломер и условий; это не постоянная величина.</p><p>Ограничение числа делений можно рассматривать как защиту от неограниченного размножения изменённых клеток. Но не все клетки с короткими теломерами прекращают деление: некоторые становятся генетически нестабильными, и среди них может возникнуть клетка с вновь включённой теломеразой.</p><p>Предполагают, что такое ограничение числа делений может вносить вклад в старение организма; это гипотеза, а не установленная причина. Механизм остановки делений и её последствия для ткани — в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Что обычно происходит с соматической клеткой с сохранными контрольными системами, когда её теломеры становятся критически короткими?</h3><ol><li><b>А.</b> Концы узнаются как разрывы, и клетка, как правило, стойко прекращает деления, оставаясь живой <i>(верный вариант)</i><br><span class="expl">Это репликативная сенесценция — типичный исход, например у фибробластов в культуре; она не равна гибели клетки. Возможны и другие исходы: гибель клетки или, при нарушенных контрольных системах, продолжение делений с нестабильностью хромосом.</span></li><li><b>Б.</b> Клетка сразу погибает <i>(неверный вариант)</i><br><span class="expl">Гибель возможна, но это не типичный исход: остановка делений и гибель — разные исходы, и при укорочении теломер в культуре обычно наблюдают остановку делений.</span></li><li><b>В.</b> Клетка включает теломеразу и продолжает делиться <i>(неверный вариант)</i><br><span class="expl">В большинстве соматических клеток теломераза не включается; её включение — редкое событие, характерное для опухолевых клеток.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Число делений — оценка из учебника Alberts et al. для фибробластов человека в культуре.</p></details></article><article class="card print-unit" id="ns-two-end-problems"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 23 из 26</div><h2>Не одна, а две проблемы концевой репликации</h2><p class="lead">Уже известно: при репликации конец линейной ДНК укорачивается (БИО-8·19). Новое: укорачиваются оба конца хромосомы, и причины у них разные.</p><div class="note"><strong>Что показывает схема.</strong> Длина восстановлена.</div><ol class="mech"><li>У конца, где G-цепь служит матрицей для отстающей цепи, синтез новой C-цепи останавливается, не дойдя до края: на 3′-выступе затравки не синтезируются.</li><li>У конца, где новая G-цепь синтезируется непрерывно, она доходит до края, и для образования 3′-выступа нуклеазы укорачивают 5′-конец C-цепи.</li><li>В обоих случаях укорачивается C-цепь; теломераза удлиняет только G-цепь и эту потерю не возмещает.</li><li>C-цепь достраивают полимераза α с праймазой, которые привлекает к теломере комплекс CST.</li></ol><p>В клетках опухолевой линии человека без комплекса CST C-цепь укорачивалась примерно на 50–60 нуклеотидов за репликацию у первого конца и примерно на 100 нуклеотидов — у второго; в среднем около 76 нуклеотидов. В пробирке синтез отстающей цепи останавливался в зоне шириной около 150 нуклеотидов, не ближе 26 нуклеотидов от конца матрицы.</p><p>Отсюда следует, что поддержание теломер требует двух ферментов: теломераза поддерживает G-цепь, а полимераза α с праймазой — C-цепь.</p><p>Как это узнали: в клетках выключали белок комплекса CST и измеряли длину каждой из двух цепей теломер по отдельности на концах разных типов; в пробирке собирали репликацию из очищенных белков пекарских дрожжей — что реплисома человека ведёт себя так же, авторы предполагают по сходству строения. Числа получены в одной линии клеток и в общем виде на другие клетки не переносятся.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Почему теломераза не может одна полностью возместить укорочение теломер?</h3><ol><li><b>А.</b> Она работает только в G1 <i>(неверный вариант)</i><br><span class="expl">Дело не в периоде цикла, а в том, какую цепь она удлиняет.</span></li><li><b>Б.</b> Она удлиняет только G-цепь, а C-цепь достраивают другие ферменты <i>(верный вариант)</i><br><span class="expl">Без достройки C-цепи растёт лишь одноцепочечный выступ; двуцепочечная часть не восстанавливается.</span></li><li><b>В.</b> Её РНК-матрица слишком короткая <i>(неверный вариант)</i><br><span class="expl">Теломераза многократно повторяет цикл; ограничение — в одной удлиняемой цепи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-024-07137-1">Takai H., Aria V., Borges P., Yeeles J. T. P., de Lange T. CST–Polymerase α-primase solves a second telomere end-replication problem. Nature. 2024;627:664–670</a></li></ul><p>Линия опухолевых клеток человека (HCT116) с выключенным CST; репликация в бесклеточной системе из очищенных белков пекарских дрожжей (перенос на клетки человека — допущение авторов).</p></details></article><article class="card print-unit" id="ns-protection-vs-length"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 24 из 26</div><h2>Защита конца и длина теломеры — разные свойства</h2><p class="lead">Уже известно: критически короткая теломера теряет защиту (БИО-8·22), а шелтерин образует t-петлю (БИО-8·20). Новое: защита может быть утрачена и при нормальной длине, а короткая теломера может быть ещё защищена.</p><div class="note"><strong>Что показывает схема.</strong> Короче, но защищён.</div><ol class="mech"><li>В клетках мыши удаление TRF2 приводило к включению сигнала повреждения на концах и частому сшиванию концов хромосом путём NHEJ; чтобы подсчитать t-петли, сшивание подавляли, удаляя лигазу IV, — без TRF2 t-петель становилось намного меньше.</li><li>Удаление других белков шелтерина (TRF1, RAP1, POT1) t-петли не разрушало.</li><li>Значит, TRF2 необходим и для t-петли, и для защиты конца; это согласуется с защитной ролью t-петли. Защита зависит от белков шелтерина, а не от длины повторов самой по себе.</li><li>Обратная задача: уменьшение длины ещё не доказывает утрату защиты; нужно наблюдать признак защиты — узнаётся ли конец как разрыв.</li></ol><p>В модели продвинутого уровня длина и защита изменяются раздельно: теломера с шелтерином после 40 делений короче, но защищена; теломера без TRF2 при исходной длине не защищена; внутренний разрыв узнаётся как разрыв всегда.</p><p>Средняя длина теломер не показывает самую короткую теломеру, а защиту теряет именно она. Поэтому одно среднее значение длины — слабое основание для вывода о защите концов.</p><p>Как это узнали: в клетках мыши выключали по одному белку шелтерина и рассматривали концы хромосом микроскопом высокого разрешения, подсчитывая t-петли и сшитые концы. Работа показывает необходимость TRF2 для t-петли в этих клетках; другие механизмы защиты она не исключает.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Средняя длина теломер в культуре клеток уменьшилась на треть; других измерений нет. Какой вывод допустим?</h3><ol><li><b>А.</b> Концы хромосом утратили защиту <i>(неверный вариант)</i><br><span class="expl">Укороченная теломера может быть ещё защищена; вывод требует наблюдения самой защиты.</
