дено, и димер остаётся. В клетке есть и второй способ узнавания — по остановившейся РНК-полимеразе в транскрибируемом гене; в базовой модели он не показан.","s2_cap_lesion_ner_z":"Без узнавания повреждение сохраняется до репликации; при копировании напротив него может встать неверный нуклеотид.","s2_cap_ap":"Основания нет, а цепь не надрезана: AP-эндонуклеазы нет, и AP-сайт остаётся. Если урацил был удалён гликозилазой, это значит, что узнавание произошло, а остановился следующий этап.","s2_cap_ap_z":"Промежуточный продукт показывает, какой этап пройден и на каком путь остановился. AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности.","s2_cap_ap_src":"Основание оторвалось само, остов цел — это AP-сайт; гликозилаза здесь не нужна. Но AP-эндонуклеазы нет, цепь не надрезана, и AP-сайт остаётся.","s2_cap_ap_src_z":"AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности. Поэтому его нужно удалить до репликации.","s2_cap_opened":"Повреждение узнано и участок раскрыт, но нуклеаз, надрезающих цепь, нет: димер остаётся в цепи.","s2_cap_opened_z":"Узнать повреждение и удалить его — разные этапы; итог «повреждение осталось» ещё не говорит, какой из них не прошёл.","s2_cap_gap_ber":"Урацил удалён, цепь надрезана, но полимеразы нет: на месте одного нуклеотида пробел.","s2_cap_gap_ber_z":"Пробел — промежуточный продукт: повреждения уже нет, но нет и информации на этом месте. Её восстанавливают по противоположной цепи.","s2_cap_gap_ner":"Участок с димером вырезан, но полимеразы нет: в цепи пробел около 30 нуклеотидов (на схеме укорочен).","s2_cap_gap_ner_z":"Длинный пробел — промежуточный продукт NER; он сохраняется, пока по неповреждённой цепи не будет синтезирован новый участок.","s2_cap_nick":"Последовательность восстановлена по другой цепи, но лигазы нет: на границе нового участка остался разрыв сахаро-фосфатного остова.","s2_cap_nick_z":"Информация уже верна, но непрерывность цепи не восстановлена: разрыв в одной цепи — тоже промежуточный продукт, и его нужно сшить.","s2_cap_notpl":"Повреждения в обеих цепях на одном участке: после вырезания напротив пробела тоже повреждённое основание. В модели правильной матрицы для достройки нет; в клетке на таком участке возможны изменение последовательности или разрыв обеих цепей.","s2_cap_notpl_z":"Эксцизионная репарация точна потому, что информация записана дважды. Если обе копии на одном участке повреждены, восстановить её по этой молекуле нельзя — нужна другая молекула с той же последовательностью (вопрос 3).","s2_pA_an":"А. Участок ДНК: {p}"},"notes":["Восстановлено по неповреждённой цепи.","Напротив пробела тоже повреждение: правильной матрицы нет."],"static":["Восстановлено по неповреждённой цепи."]}}},{"id":"two-recognitions","section":1,"questions":[2],"title":"Два разных сигнала — одна система вырезания: как сходятся пути узнавания NER","keywords":["XPC","РНК-полимераза","TFIIH","проверка повреждения"],"lead":["Уже известно: в NER повреждение находит XPC, а в транскрибируемых генах — остановившаяся РНК-полимераза (БИО-8·9).","Новое: что происходит дальше и почему разные сигналы ведут к одному результату."],"mechanism":["Белок узнавания XPC передаёт ДНК комплексу TFIIH; по положению повреждения в комплексе авторы заключают, что и сигнал от остановившейся РНК-полимеразы передаётся тому же TFIIH.","Две хеликазы этого комплекса движутся по повреждённой цепи в противоположных направлениях и подтягивают повреждение к месту проверки.","Белок XPA изгибает ДНК и закрепляет это положение.","По ранее полученным данным, цепь надрезается, когда раскрытый участок достигает примерно 24–34 нуклеотидов."],"paragraphs":["Так устроена двухступенчатая система: сначала находят искажение, затем проверяют, есть ли в цепи повреждение. Это снижает вероятность ненужного вырезания неповреждённой ДНК.","Следствие для рассуждения: одинаковый итог (повреждение устранено) может быть получен разными путями узнавания. Если один путь узнавания нарушен, повреждения устраняются только там, где работает другой, — например, только в транскрибируемых генах.","Как это узнали: собрали комплексы из очищенных белков человека на ДНК с модельным повреждением (не на пиримидиновом димере) и определили их строение для пути через XPC; надрезы проверяли в бесклеточной системе. Это показывает возможное взаимодействие белков, но не скорость процесса в клетке.","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Очищенные белки человека; строение комплексов и надрезы в бесклеточной системе. Числа на схеме — учебные значения модели вкладки 2.","sources":["Kim2023"],"quiz":{"id":"S8-L11","question":"В клетках нет XPC, но работает узнавание по остановившейся РНК-полимеразе. Где будут устранены пиримидиновые димеры?","options":[{"id":"S8-L11-1","text":"Во всём геноме, но медленнее","correct":false,"feedback":"РНК-полимераза не проходит по нетранскрибируемым участкам и сигнала там не даёт."},{"id":"S8-L11-2","text":"В основном в транскрибируемых генах, в их матричной цепи","correct":true,"feedback":"Остановившаяся РНК-полимераза — сигнал только там, где идёт транскрипция."},{"id":"S8-L11-3","text":"Нигде: без XPC NER невозможна","correct":false,"feedback":"Второй сигнал передаёт ДНК тому же комплексу проверки, и путь продолжается."}]},"widget":{"kind":"dna","title":"","s":{"title":"Два пути узнавания NER","status":"Учебная модель · условные доли","modes_label":"Что показать","modes":["узнавание работает","нет XPC, второго пути нет","нет XPC, работает узнавание по РНК-полимеразе"],"scene":"a2","args":[["dimer","none","no"],["dimer","rec","no"],["dimer","rec","yes"]],"L":{"s2_path_ber":"вырезание основания (BER)","s2_path_ner":"вырезание нуклеотидов (NER)","s2a_prob":"Если репарация остановилась, что остаётся в ДНК — само повреждение или промежуточный продукт? И что по этому можно сказать о том, на каком этапе путь остановился?","s2a_les":"Повреждение","s2a_blk":"Этап, на котором путь остановлен","s2a_blk_none":"нет","s2a_blk_rec":"узнавание","s2a_blk_nuc":"вскрытие цепи","s2a_blk_pol":"синтез","s2a_blk_lig":"сшивание","s2a_alt":"Другой путь узнавания","s2a_alt_no":"нет","s2a_alt_yes":"есть","s2a_anote":"Другой путь узнавания имеет значение, только когда остановлено узнавание.","s2a_pA":"А. Что стало со 100 условными повреждениями к моменту наблюдения","s2a_k_lesion":"повреждение на месте","s2a_k_inter":"промежуточный продукт","s2a_k_ok":"восстановлено","s2a_lbl_100":"100 условных повреждений в разных местах генома; числа — учебные значения","s2a_pB":"Б. Цепочка состояний: {p}","s2a_n_lesion_u":"урацил\nв цепи","s2a_n_lesion_dimer":"димер\nв цепи","s2a_n_recog":"узнан,\nне вырезан","s2a_n_ap":"AP-сайт","s2a_n_gap":"пробел","s2a_n_nick":"разрыв\nв цепи","s2a_n_ok":"восста-\nновлено","s2a_e_ber_rec":"гликозилаза","s2a_e_ber_nuc":"AP-эндонукл.","s2a_e_ber_pol":"полимераза","s2a_e_ber_lig":"лигаза","s2a_e_ner_rec":"XPC, TFIIH","s2a_e_ner_nuc":"нуклеазы","s2a_e_ner_pol":"полимераза","s2a_e_ner_lig":"лигаза","s2a_lbl_alt_u":"другая гликозилаза удалила часть урацила","s2a_lbl_alt_dimer":"второй путь: остановившаяся РНК-полимераза","s2a_lbl_time":"одно и то же время наблюдения во всех положениях; доли — условные","s2a_r_les":"Повреждений на месте","s2a_r_les_s":"из 100","s2a_v_n":"{n}","s2a_r_int":"Промежуточный продукт","s2a_v_int_none":"нет","s2a_v_int_ap":"{n} AP-сайтов","s2a_v_int_recog":"{n}: повреждение узнано, участок не вырезан","s2a_v_int_gap":"{n} пробелов в одной цепи","s2a_v_int_nick":"{n} разрывов в одной цепи","s2a_r_ok":"Восстановлено","s2a_r_rec":"Узнавание повреждения","s2a_v_rec_yes":"произошло","s2a_v_rec_no":"не произошло","s2a_cap_none":"Все этапы работают: к моменту наблюдения все 100 повреждений устранены, промежуточных продуктов нет.","s2a_cap_none_z":"Промежуточные продукты существуют, но быстро превращаются в следующие; при исправной работе пути они не накапливаются.","s2a_cap_rec_no_u":"Узнавание остановлено, второго пути нет: урацил остаётся во всех 100 местах, промежуточных продуктов нет.","s2a_cap_rec_no_u_z":"Если ничего не узнано, следующие этапы не начинаются: остаётся исходное повреждение.","s2a_cap_rec_no_dimer":"Узнавание остановлено, второго пути нет: все 100 димеров на месте.","s2a_cap_rec_no_dimer_z":"Итог «повреждение на месте» совместим с отсутствием узнавания; другие этапы оставили бы промежуточные продукты.","s2a_cap_rec_yes_u":"Основной белок узнавания отсутствует, но урацил узнаёт и другая гликозилаза: часть повреждений (в модели 60 из 100) устранена за время наблюдения, остальные на месте.","s2a_cap_rec_yes_u_z":"Для одного повреждения бывает несколько путей узнавания; утрата одного белка не обязательно оставляет все повреждения.","s2a_cap_rec_yes_dimer":"Белка, узнающего искажение во всём геноме, нет, но остановившаяся на димере РНК-полимераза служит вторым сигналом. Он работает только в транскрибируемых генах — в модели 20 из 100 повреждений; остальные на месте.","s2a_cap_rec_yes_dimer_z":"Два разных пути узнавания ведут к одним и тем же следующим этапам. Где восстановлены повреждения, показывает, какой путь узнавания работал.","s2a_cap_nuc_u":"Урацила нет, но цепь не надрезана: накопились AP-сайты. Значит, гликозилаза урацил узнала и удалила, а остановился следующий этап.","s2a_cap_nuc_u_z":"Накопление промежуточного продукта говорит о нарушении определённого этапа, а не об отсутствии узнавания.","s2a_cap_nuc_dimer":"Димеры узнаны, участок раскрыт и проверен, но цепь не надрезана: повреждения на месте, хотя узнавание произошло.","s2a_cap_nuc_dimer_z":"«Повреждение на месте» не всегда значит «не узнано»: чтобы различить эти случаи, нужно проверить, связан ли с повреждением комплекс узнавания.","s2a_cap_pol":"Повреждённые участки удалены, но не достроены: накопились пробелы в одной цепи.","s2a_cap_pol_z":"Пробел — уже не повреждение, но и не исправленная ДНК: информации на этом месте нет, пока её не скопируют с другой цепи.","s2a_cap_lig":"Последовательность восстановлена, но не сшита: накопились разрывы в одной цепи.","s2a_cap_lig_z":"Промежуточные продукты с разрывами сами опасны для клетки; продукт одного этапа пути сразу передаётся ферменту следующего.","s2a_cap_mask":"Обратная задача: видно, что стало с повреждениями, но не видно, какой этап остановлен. Переключатели скрыты.","s2a_cap_mask_z":"Сравните, что накопилось, с цепочкой состояний пути.","s2a_take":"Путь репарации — цепочка этапов, и при остановке на любом из них накапливается свой промежуточный продукт: AP-сайт, пробел или разрыв в одной цепи. Поэтому накопление промежуточного продукта указывает на определённый нарушенный этап и доказывает, что узнавание произошло. Если же повреждение осталось, причины могут быть разными: нет узнавания, нет надреза после узнавания, или работает только другой, ограниченный путь узнавания. Одно повреждение может узнаваться несколькими способами, а итог «восстановлено» не говорит, каким именно.","s2a_lim":"Модель не показывает скорости этапов: в клетке каждый этап идёт с конечной скоростью, и промежуточные продукты есть всегда; AP-сайты, кроме того, постоянно возникают сами — в клетках млекопитающих их одновременно десятки тысяч. Поэтому в клетке накопление AP-сайтов само по себе не доказывает узнавания урацила: нужен контроль — сколько их без урацила. Доли 60 и 20 из 100 — учебные значения. Модель не показывает разветвлений пути (замену одного нуклеотида или более длинного участка в BER), перекрытия путей для некоторых повреждений и того, что накопившиеся разрывы могут сами вызывать гибель клетки или превращаться при репликации в разрывы обеих цепей.","s2a_new":"Определено строение комплекса белков человека, который проверяет повреждение при NER: белок узнавания XPC передаёт ДНК комплексу TFIIH, две хеликазы которого движутся по повреждённой цепи в противоположных направлениях и подтягивают повреждение к месту проверки; ещё один белок (XPA) изгибает ДНК и закрепляет это положение. Строение получено для пути узнавания через XPC. Положение повреждения в комплексе такое же, какое ожидается при передаче от остановившейся РНК-полимеразы; отсюда авторы заключают, что оба пути узнавания сходятся на TFIIH.","s2a_how":"собирали комплексы из очищенных белков человека на ДНК с модельным повреждением (не на пиримидиновом димере) и определяли их строение; надрезы проверяли в бесклеточной системе. Это показывает, как белки могут взаимодействовать, но не скорость процесса в живой клетке; схождение двух путей — вывод авторов из сравнения, а не прямое наблюдение.","s2a_tl_note":"Порядок этапов — учебная модель. Числа на схеме — условные счётчики 100 повреждений; доли при другом пути узнавания условные.","s2a_tl_0":"Начало: в разных местах генома возникли 100 условных повреждений.","s2a_tl_rec_ber":"Узнавание: гликозилаза отщепляет урацил — на его месте остаются AP-сайты.","s2a_tl_rec_ner":"Узнавание: белки узнавания находят димеры, участок раскрывается и проверяется.","s2a_tl_rec_alt":"Узнавание: основной путь остановлен; другим путём узнавания за время наблюдения устранена часть повреждений (доля условная).","s2a_tl_nuc_ber":"Вскрытие цепи: AP-эндонуклеаза надрезает остов — на месте AP-сайтов пробелы в один нуклеотид.","s2a_tl_nuc_ner":"Вскрытие цепи: нуклеазы вырезают участки с димерами — остаются пробелы.","s2a_tl_pol":"Синтез: ДНК-полимераза заполняет пробелы — остаются разрывы в одной цепи.","s2a_tl_lig":"Сшивание: ДНК-лигаза соединяет разрывы — участки восстановлены.","s2a_tl_stop_rec":"Путь остановлен на узнавании: повреждения остаются на месте.","s2a_tl_stop_rec_alt":"Основной путь остановлен на узнавании: часть повреждений устранена другим путём, остальные остаются на месте.","s2a_tl_stop_nuc_ber":"Путь остановлен на вскрытии цепи: накапливаются AP-сайты — промежуточный продукт.","s2a_tl_stop_nuc_ner":"Путь остановлен на вскрытии цепи: димеры узнаны, но не вырезаны — повреждения остаются на месте.","s2a_tl_stop_pol":"Путь остановлен на синтезе: накапливаются пробелы — промежуточный продукт.","s2a_tl_stop_lig":"Путь остановлен на сшивании: накапливаются разрывы в одной цепи — промежуточный продукт."},"notes":["Все 100 повреждений устранены.","Все 100 остались.","Устранена часть — в транскрибируемых генах (в модели 20 из 100)."],"static":["Все 100 повреждений устранены."]}},"level":"adv"},{"id":"intermediates","section":1,"questions":[2],"title":"Что накапливается при остановке репарации и что это говорит о причине","keywords":["промежуточный продукт","AP-сайт","пробел","разрыв в одной цепи","обратная задача"],"lead":["Уже известно: BER и NER — цепочки этапов (БИО-8·8, БИО-8·9).","Новое: по тому, что накопилось, можно судить, на каком этапе путь остановился."],"mechanism":["Если остановлен этап, накапливается продукт предыдущего: AP-сайт, пробел или разрыв в одной цепи.","В модели накопление промежуточного продукта указывает, что узнавание произошло. В клетке AP-сайты возникают и самопроизвольно, поэтому нужен контроль: сколько их без урацила.","Если же на месте само повреждение, причин может быть несколько: нет узнавания, нет надреза после узнавания, работает только ограниченный путь узнавания.","Промежуточные продукты с разрывами опасны; продукт одного этапа сразу передаётся ферменту следующего."],"paragraphs":["В модели 100 условных повреждений: при исправном пути через то же время все устранены; при остановке на сшивании — 100 разрывов, на синтезе — 100 пробелов, на вскрытии цепи — 100 AP-сайтов (для урацила).","Обратная задача: повреждений не осталось, но цепь разорвана во многих местах — значит, пройдены узнавание, надрез и синтез, а не прошло сшивание. Если же повреждения на месте и промежуточных продуктов нет, одного этого наблюдения мало: нужно проверить, узнано ли повреждение и где оно устранено.","Модель не показывает скорости этапов: в клетке промежуточные продукты есть всегда (AP-сайтов в клетке млекопитающего одновременно десятки тысяч), и накопленный продукт может сам вызывать гибель клетки или превращаться при репликации в разрыв обеих цепей.","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель с условными долями; принцип связанности этапов BER — по обзору.","sources":["Beard2019","Alberts2022"],"quiz":{"id":"S8-L12","question":"Урацила в клетках не осталось, но накопились пробелы в один нуклеотид. Какой этап BER не прошёл?","options":[{"id":"S8-L12-1","text":"Узнавание урацила","correct":false,"feedback":"Если бы урацил не был узнан, он остался бы в ДНК."},{"id":"S8-L12-2","text":"Сшивание","correct":false,"feedback":"При остановке на сшивании остались бы разрывы без пробелов."},{"id":"S8-L12-3","text":"Синтез: полимераза не встроила нуклеотид","correct":true,"feedback":"Узнавание и надрез прошли — урацила нет, остов надрезан; не заполнен пробел."}]},"widget":{"kind":"dna","title":"","s":{"title":"Промежуточные продукты BER","status":"Учебная модель · условные доли","modes_label":"Что показать","modes":["нет вскрытия цепи","нет синтеза","нет сшивания"],"scene":"a2","args":[["u","nuc","no"],["u","pol","no"],["u","lig","no"]],"L":{"s2_path_ber":"вырезание основания (BER)","s2_path_ner":"вырезание нуклеотидов (NER)","s2a_prob":"Если репарация остановилась, что остаётся в ДНК — само повреждение или промежуточный продукт? И что по этому можно сказать о том, на каком этапе путь остановился?","s2a_les":"Повреждение","s2a_blk":"Этап, на котором путь остановлен","s2a_blk_none":"нет","s2a_blk_rec":"узнавание","s2a_blk_nuc":"вскрытие цепи","s2a_blk_pol":"синтез","s2a_blk_lig":"сшивание","s2a_alt":"Другой путь узнавания","s2a_alt_no":"нет","s2a_alt_yes":"есть","s2a_anote":"Другой путь узнавания имеет значение, только когда остановлено узнавание.","s2a_pA":"А. Что стало со 100 условными повреждениями к моменту наблюдения","s2a_k_lesion":"повреждение на месте","s2a_k_inter":"промежуточный продукт","s2a_k_ok":"восстановлено","s2a_lbl_100":"100 условных повреждений в разных местах генома; числа — учебные значения","s2a_pB":"Б. Цепочка состояний: {p}","s2a_n_lesion_u":"урацил\nв цепи","s2a_n_lesion_dimer":"димер\nв цепи","s2a_n_recog":"узнан,\nне вырезан","s2a_n_ap":"AP-сайт","s2a_n_gap":"пробел","s2a_n_nick":"разрыв\nв цепи","s2a_n_ok":"восста-\nновлено","s2a_e_ber_rec":"гликозилаза","s2a_e_ber_nuc":"AP-эндонукл.","s2a_e_ber_pol":"полимераза","s2a_e_ber_lig":"лигаза","s2a_e_ner_rec":"XPC, TFIIH","s2a_e_ner_nuc":"нуклеазы","s2a_e_ner_pol":"полимераза","s2a_e_ner_lig":"лигаза","s2a_lbl_alt_u":"другая гликозилаза удалила часть урацила","s2a_lbl_alt_dimer":"второй путь: остановившаяся РНК-полимераза","s2a_lbl_time":"одно и то же время наблюдения во всех положениях; доли — условные","s2a_r_les":"Повреждений на месте","s2a_r_les_s":"из 100","s2a_v_n":"{n}","s2a_r_int":"Промежуточный продукт","s2a_v_int_none":"нет","s2a_v_int_ap":"{n} AP-сайтов","s2a_v_int_recog":"{n}: повреждение узнано, участок не вырезан","s2a_v_int_gap":"{n} пробелов в одной цепи","s2a_v_int_nick":"{n} разрывов в одной цепи","s2a_r_ok":"Восстановлено","s2a_r_rec":"Узнавание повреждения","s2a_v_rec_yes":"произошло","s2a_v_rec_no":"не произошло","s2a_cap_none":"Все этапы работают: к моменту наблюдения все 100 повреждений устранены, промежуточных продуктов нет.","s2a_cap_none_z":"Промежуточные продукты существуют, но быстро превращаются в следующие; при исправной работе пути они не накапливаются.","s2a_cap_rec_no_u":"Узнавание остановлено, второго пути нет: урацил остаётся во всех 100 местах, промежуточных продуктов нет.","s2a_cap_rec_no_u_z":"Если ничего не узнано, следующие этапы не начинаются: остаётся исходное повреждение.","s2a_cap_rec_no_dimer":"Узнавание остановлено, второго пути нет: все 100 димеров на месте.","s2a_cap_rec_no_dimer_z":"Итог «повреждение на месте» совместим с отсутствием узнавания; другие этапы оставили бы промежуточные продукты.","s2a_cap_rec_yes_u":"Основной белок узнавания отсутствует, но урацил узнаёт и другая гликозилаза: часть повреждений (в модели 60 из 100) устранена за время наблюдения, остальные на месте.","s2a_cap_rec_yes_u_z":"Для одного повреждения бывает несколько путей узнавания; утрата одного белка не обязательно оставляет все повреждения.","s2a_cap_rec_yes_dimer":"Белка, узнающего искажение во всём геноме, нет, но остановившаяся на димере РНК-полимераза служит вторым сигналом. Он работает только в транскрибируемых генах — в модели 20 из 100 повреждений; остальные на месте.","s2a_cap_rec_yes_dimer_z":"Два разных пути узнавания ведут к одним и тем же следующим этапам. Где восстановлены повреждения, показывает, какой путь узнавания работал.","s2a_cap_nuc_u":"Урацила нет, но цепь не надрезана: накопились AP-сайты. Значит, гликозилаза урацил узнала и удалила, а остановился следующий этап.","s2a_cap_nuc_u_z":"Накопление промежуточного продукта говорит о нарушении определённого этапа, а не об отсутствии узнавания.","s2a_cap_nuc_dimer":"Димеры узнаны, участок раскрыт и проверен, но цепь не надрезана: повреждения на месте, хотя узнавание произошло.","s2a_cap_nuc_dimer_z":"«Повреждение на месте» не всегда значит «не узнано»: чтобы различить эти случаи, нужно проверить, связан ли с повреждением комплекс узнавания.","s2a_cap_pol":"Повреждённые участки удалены, но не достроены: накопились пробелы в одной цепи.","s2a_cap_pol_z":"Пробел — уже не повреждение, но и не исправленная ДНК: информации на этом месте нет, пока её не скопируют с другой цепи.","s2a_cap_lig":"Последовательность восстановлена, но не сшита: накопились разрывы в одной цепи.","s2a_cap_lig_z":"Промежуточные продукты с разрывами сами опасны для клетки; продукт одного этапа пути сразу передаётся ферменту следующего.","s2a_cap_mask":"Обратная задача: видно, что стало с повреждениями, но не видно, какой этап остановлен. Переключатели скрыты.","s2a_cap_mask_z":"Сравните, что накопилось, с цепочкой состояний пути.","s2a_take":"Путь репарации — цепочка этапов, и при остановке на любом из них накапливается свой промежуточный продукт: AP-сайт, пробел или разрыв в одной цепи. Поэтому накопление промежуточного продукта указывает на определённый нарушенный этап и доказывает, что узнавание произошло. Если же повреждение осталось, причины могут быть разными: нет узнавания, нет надреза после узнавания, или работает только другой, ограниченный путь узнавания. Одно повреждение может узнаваться несколькими способами, а итог «восстановлено» не говорит, каким именно.","s2a_lim":"Модель не показывает скорости этапов: в клетке каждый этап идёт с конечной скоростью, и промежуточные продукты есть всегда; AP-сайты, кроме того, постоянно возникают сами — в клетках млекопитающих их одновременно десятки тысяч. Поэтому в клетке накопление AP-сайтов само по себе не доказывает узнавания урацила: нужен контроль — сколько их без урацила. Доли 60 и 20 из 100 — учебные значения. Модель не показывает разветвлений пути (замену одного нуклеотида или более длинного участка в BER), перекрытия путей для некоторых повреждений и того, что накопившиеся разрывы могут сами вызывать гибель клетки или превращаться при репликации в разрывы обеих цепей.","s2a_new":"Определено строение комплекса белков человека, который проверяет повреждение при NER: белок узнавания XPC передаёт ДНК комплексу TFIIH, две хеликазы которого движутся по повреждённой цепи в противоположных направлениях и подтягивают повреждение к месту проверки; ещё один белок (XPA) изгибает ДНК и закрепляет это положение. Строение получено для пути узнавания через XPC. Положение повреждения в комплексе такое же, какое ожидается при передаче от остановившейся РНК-полимеразы; отсюда авторы заключают, что оба пути узнавания сходятся на TFIIH.","s2a_how":"собирали комплексы из очищенных белков человека на ДНК с модельным повреждением (не на пиримидиновом димере) и определяли их строение; надрезы проверяли в бесклеточной системе. Это показывает, как белки могут взаимодействовать, но не скорость процесса в живой клетке; схождение двух путей — вывод авторов из сравнения, а не прямое наблюдение.","s2a_tl_note":"Порядок этапов — учебная модель. Числа на схеме — условные счётчики 100 повреждений; доли при другом пути узнавания условные.","s2a_tl_0":"Начало: в разных местах генома возникли 100 условных повреждений.","s2a_tl_rec_ber":"Узнавание: гликозилаза отщепляет урацил — на его месте остаются AP-сайты.","s2a_tl_rec_ner":"Узнавание: белки узнавания находят димеры, участок раскрывается и проверяется.","s2a_tl_rec_alt":"Узнавание: основной путь остановлен; другим путём узнавания за время наблюдения устранена часть повреждений (доля условная).","s2a_tl_nuc_ber":"Вскрытие цепи: AP-эндонуклеаза надрезает остов — на месте AP-сайтов пробелы в один нуклеотид.","s2a_tl_nuc_ner":"Вскрытие цепи: нуклеазы вырезают участки с димерами — остаются пробелы.","s2a_tl_pol":"Синтез: ДНК-полимераза заполняет пробелы — остаются разрывы в одной цепи.","s2a_tl_lig":"Сшивание: ДНК-лигаза соединяет разрывы — участки восстановлены.","s2a_tl_stop_rec":"Путь остановлен на узнавании: повреждения остаются на месте.","s2a_tl_stop_rec_alt":"Основной путь остановлен на узнавании: часть повреждений устранена другим путём, остальные остаются на месте.","s2a_tl_stop_nuc_ber":"Путь остановлен на вскрытии цепи: накапливаются AP-сайты — промежуточный продукт.","s2a_tl_stop_nuc_ner":"Путь остановлен на вскрытии цепи: димеры узнаны, но не вырезаны — повреждения остаются на месте.","s2a_tl_stop_pol":"Путь остановлен на синтезе: накапливаются пробелы — промежуточный продукт.","s2a_tl_stop_lig":"Путь остановлен на сшивании: накапливаются разрывы в одной цепи — промежуточный продукт."},"notes":["Накопились AP-сайты: гликозилаза сработала.","Накопились пробелы.","Накопились разрывы в одной цепи."],"static":["Накопились AP-сайты: гликозилаза сработала."]}},"level":"adv"},{"id":"dsb-danger","section":2,"questions":[3],"title":"Почему разрыв обеих цепей особенно опасен","keywords":["двуцепочечный разрыв","ионизирующее излучение","фрагмент хромосомы","матрица"],"lead":["Уже известно: повреждение одной цепи устраняется по неповреждённой цепи (БИО-8·10).","Новое: при [[T23|разрыве обеих цепей]] такой цепи на месте разрыва нет, а молекула разделена на две части.","Раздел относится к вопросу 7 коллоквиума 2 (предварительный список) и вопросу 18 зачёта."],"mechanism":["Разрыв обеих цепей вызывают ионизирующее излучение, некоторые химические вещества, а также разрушение репликационной вилки.","Без репарации фрагмент хромосомы без центромеры при делении не распределяется к полюсам и утрачивается вместе с генами.","Для соединения концов матрица не нужна; для восстановления утраченных нуклеотидов нужна другая молекула ДНК с той же последовательностью.","Поэтому в клетке два основных пути: негомологичное соединение концов (NHEJ) и гомологичная рекомбинация (HR)."],"paragraphs":["Повреждения, затрагивающие обе цепи в одном месте, — например, близкие повреждения двух цепей (БИО-8·10) — тоже могут превратиться в разрыв обеих цепей при попытке репарации или при репликации.","Различайте две задачи репарации разрыва: восстановить целостность молекулы (соединить концы) и восстановить исходную последовательность (вернуть утраченные нуклеотиды). Это разные результаты, и пути решают их по-разному.","При разрыве переход клетки к следующему периоду цикла обычно задерживается, и на это время разрыв может быть устранён; как устроена эта задержка, — в курсе «Молекулярная биология»."],"conditions":"Схема шага — модель вкладки 3.","sources":["Alberts2022"],"quiz":{"id":"S8-L13","question":"Почему разрыв обеих цепей нельзя устранить так же, как повреждение одной цепи путём BER или NER?","options":[{"id":"S8-L13-1","text":"На месте разрыва нет целой цепи, которая служила бы матрицей","correct":true,"feedback":"BER и NER достраивают участок по противоположной цепи; при разрыве обеих цепей её нет."},{"id":"S8-L13-2","text":"Ферменты BER и NER не проникают в ядро","correct":false,"feedback":"Они работают в ядре; дело не в доступности, а в отсутствии матрицы."},{"id":"S8-L13-3","text":"Разрыв обеих цепей не узнаётся клеткой","correct":false,"feedback":"Разрыв узнаётся, в том числе белками Ku; трудность — в восстановлении информации."}]},"widget":{"kind":"dna","title":"","s":{"title":"Разрыв и его исход","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["разрыв не соединён","соединён в G1"],"scene":"s3b","args":[["G1","lost",{"ku":false}],["G1","lost",{}]],"L":{"s3_ph":"Период клеточного цикла","s3_ph_G1":"G1 — до репликации ДНК","s3_ph_G2":"G2 — после репликации ДНК","s3_end":"Концы разрыва","s3_end_clean":"совместимые, нуклеотиды не утрачены","s3_end_lost":"повреждены: часть нуклеотидов утрачена","s3_pA":"А. Хромосома в клетке: период {ph}","s3_lbl_g1":"одна молекула ДНК в хромосоме; копии этого участка в той же хромосоме нет","s3_lbl_g2":"две сестринские хроматиды скреплены когезином (кольца)","s3_lbl_brk":"хроматида 1","s3_lbl_sis":"хроматида 2","s3_lbl_whole":"целостность молекулы восстановлена","s3_pB":"Б. Участок ДНК в месте разрыва (зелёным — синтезировано по матрице)","s3_e_ku":"Ku","s3_e_lig4":"лигаза IV","s3_e_res":"резекция","s3_e_rad51":"RAD51","s3_st_hr":"участок восстановлен по сестринской хроматиде:\nпоследовательность как исходная","s3_st_nhej_ok":"концы сшиты напрямую (пунктир — место соединения):\nпоследовательность как исходная","s3_st_nhej_del":"концы сшиты напрямую: утрачены 4 пары нуклеотидов\n(рамка — место соединения)","s3_st_stuck":"концы резецированы, но матрица не найдена:\nразрыв не устранён","s3_st_open":"концы не соединены: разрыв остался","s3_r_path":"Путь","s3_v_path_hr":"гомологичная рекомбинация (HR)","s3_v_path_nhej":"негомологичное соединение концов (NHEJ)","s3_v_path_none":"нет","s3_r_tpl":"Матрица","s3_v_tpl_sis":"сестринская хроматида","s3_v_tpl_none":"не используется: концы соединены напрямую","s3_v_tpl_no":"не найдена","s3_v_tpl_g1":"нет: в G1 сестринской хроматиды нет","s3_v_tpl_nostart":"поиск не начат: концы не резецированы","s3_r_int":"Целостность молекулы","s3_r_int_s":"соединены ли концы","s3_v_int_yes":"восстановлена","s3_v_int_no":"не восстановлена","s3_r_seq":"Последовательность в месте разрыва","s3_v_seq_same":"как исходная","s3_v_seq_del":"утрачено {n} пары нуклеотидов","s3_v_seq_na":"—","s3_cap_hr":"После репликации рядом есть сестринская хроматида с той же последовательностью. Нуклеазы резекции укорачивают 5′-концы разрыва, на одноцепочечных 3′-концах собирается RAD51, конец находит комплементарный участок сестринской хроматиды и встраивается в неё; полимераза копирует недостающий участок, лигаза сшивает. Утраченные нуклеотиды восстановлены по копии.","s3_cap_hr_z":"Гомологичная рекомбинация точна, потому что использует матрицу — неповреждённую копию того же участка. В G2 такая копия есть: это сестринская хроматида, образовавшаяся при репликации.","s3_cap_nhej_ok_G1":"До репликации второй копии участка в этой хромосоме нет. Белки Ku связывают оба конца и удерживают их рядом, лигаза IV сшивает. Концы совместимы, нуклеотиды не утрачены, поэтому последовательность после соединения такая же, как была.","s3_cap_nhej_ok_G1_z":"Соединение концов без матрицы не обязательно ошибочно: если концы не повреждены и подходят друг к другу, исходная последовательность сохраняется.","s3_cap_nhej_del_G1":"До репликации второй копии участка в этой хромосоме нет. Концы повреждены: перед сшиванием их обрабатывают, и несколько нуклеотидов утрачено. Белки Ku и лигаза IV соединяют концы — целостность молекулы восстановлена, но на месте соединения не хватает 4 пар нуклеотидов.","s3_cap_nhej_del_G1_z":"Без матрицы утраченные нуклеотиды восстановить не по чему. Соединение возвращает целостность хромосомы, но не исходную последовательность.","s3_cap_nhej_ok_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы совместимы — последовательность как исходная.","s3_cap_nhej_ok_G2_z":"Наличие матрицы ещё не означает, что её используют: для HR нужна резекция концов. В G2 работает и NHEJ.","s3_cap_nhej_del_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы были повреждены — на месте соединения утрачены 4 пары нуклеотидов, хотя точная копия участка находится рядом.","s3_cap_nhej_del_G2_z":"Точность определяется не периодом цикла как таковым, а тем, используется ли матрица. Период цикла определяет, есть ли сестринская хроматида.","s3_cap_stuck":"Концы резецированы, но без RAD51 одноцепочечный конец не спаривается с комплементарным участком сестринской хроматиды. В модели резецированные концы не соединяются и NHEJ: разрыв остаётся. В клетке такие концы могут соединить другие пути — с большей утратой нуклеотидов; в модели они не показаны.","s3_cap_stuck_z":"Резекция — первый этап HR: после неё концы уже не подходят для прямого соединения. Поэтому нарушение позднего этапа HR может быть опаснее, чем отсутствие резекции.","s3_cap_open":"Нет деталей NHEJ, а гомологичная рекомбинация невозможна или не начата: в модели концы не соединены. В клетке их может соединить альтернативный путь — с утратой нуклеотидов; в модели он не показан. Если разрыв сохранится до деления, фрагмент хромосомы без центромеры будет утрачен.","s3_cap_open_z":"Разрыв обеих цепей опаснее повреждения одной цепи: на месте разрыва нет целой цепи, которая служила бы матрицей, и молекула разделена на две части."},"notes":["Концы не соединены: фрагмент может быть утрачен при делении.","Концы соединены без матрицы: утрачено 4 пары нуклеотидов."],"static":["Концы не соединены: фрагмент может быть утрачен при делении."]}}},{"id":"nhej","section":2,"questions":[3],"title":"Негомологичное соединение концов: целостность без матрицы","keywords":["NHEJ","Ku","лигаза IV","совместимые концы","делеция"],"lead":["Самый простой способ — соединить концы напрямую. Так работает негомологичное соединение концов (NHEJ).","Оно возможно в любом периоде цикла и у млекопитающих преобладает в соматических клетках."],"mechanism":["[[T28|Белки Ku]] (комплекс Ku70–Ku80) связываются с каждым из концов разрыва: кольцо комплекса охватывает конец ДНК. Вместе с другими белками NHEJ они удерживают концы рядом.","Если концы повреждены, их обрабатывают: удаляют повреждённые нуклеотиды или достраивают короткие участки.","[[T29|Лигаза IV]] сшивает концы.","Длинная гомологичная матрица не нужна: возможно лишь спаривание нескольких нуклеотидов на концах и короткая достройка, поэтому утраченные нуклеотиды не восстанавливаются."],"paragraphs":["Если концы разрыва не повреждены и подходят друг к другу (совместимы), соединение возвращает исходную последовательность. Если концы повреждены и их обрабатывают, на месте соединения обычно теряется несколько нуклеотидов. Точность NHEJ, таким образом, определяется состоянием концов, а не самим путём.","По оценке, приведённой в учебнике Alberts et al., к 70 годам в типичной соматической клетке человека более 2000 мест, где разрыв был соединён неточно. Большая часть генома не кодирует белок, поэтому многие такие изменения не нарушают работу клетки.","Другая опасность NHEJ — соединение концов разных хромосом, если разрывов несколько. Поэтому естественные концы хромосом должны быть защищены от этого пути (раздел 4)."],"conditions":"Схема шага — модель вкладки 3: утрата 4 пар нуклеотидов — условный пример.","sources":["Alberts2022","StinsonLoparo2021","Betermier2014","Scully2019"],"quiz":{"id":"S8-L14","question":"Всегда ли негомологичное соединение концов изменяет последовательность?","options":[{"id":"S8-L14-1","text":"Да: без матрицы соединение всегда неточное","correct":false,"feedback":"Матрица нужна, чтобы восстановить утраченное; если ничего не утрачено, восстанавливать нечего."},{"id":"S8-L14-2","text":"Нет: совместимые неповреждённые концы соединяются без потерь","correct":true,"feedback":"Нуклеотиды теряются при обработке повреждённых концов; если обрабатывать нечего, последовательность сохраняется."},{"id":"S8-L14-3","text":"Нет: NHEJ использует сестринскую хроматиду","correct":false,"feedback":"NHEJ не копирует сестринскую хроматиду: длинная гомологичная матрица нужна гомологичной рекомбинации."}]},"widget":{"kind":"dna","title":"","s":{"title":"NHEJ: состояние концов","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["совместимые концы","повреждённые концы"],"scene":"s3b","args":[["G1","clean",{}],["G1","lost",{}]],"L":{"s3_ph":"Период клеточного цикла","s3_ph_G1":"G1 — до репликации ДНК","s3_ph_G2":"G2 — после репликации ДНК","s3_end":"Концы разрыва","s3_end_clean":"совместимые, нуклеотиды не утрачены","s3_end_lost":"повреждены: часть нуклеотидов утрачена","s3_pA":"А. Хромосома в клетке: период {ph}","s3_lbl_g1":"одна молекула ДНК в хромосоме; копии этого участка в той же хромосоме нет","s3_lbl_g2":"две сестринские хроматиды скреплены когезином (кольца)","s3_lbl_brk":"хроматида 1","s3_lbl_sis":"хроматида 2","s3_lbl_whole":"целостность молекулы восстановлена","s3_pB":"Б. Участок ДНК в месте разрыва (зелёным — синтезировано по матрице)","s3_e_ku":"Ku","s3_e_lig4":"лигаза IV","s3_e_res":"резекция","s3_e_rad51":"RAD51","s3_st_hr":"участок восстановлен по сестринской хроматиде:\nпоследовательность как исходная","s3_st_nhej_ok":"концы сшиты напрямую (пунктир — место соединения):\nпоследовательность как исходная","s3_st_nhej_del":"концы сшиты напрямую: утрачены 4 пары нуклеотидов\n(рамка — место соединения)","s3_st_stuck":"концы резецированы, но матрица не найдена:\nразрыв не устранён","s3_st_open":"концы не соединены: разрыв остался","s3_r_path":"Путь","s3_v_path_hr":"гомологичная рекомбинация (HR)","s3_v_path_nhej":"негомологичное соединение концов (NHEJ)","s3_v_path_none":"нет","s3_r_tpl":"Матрица","s3_v_tpl_sis":"сестринская хроматида","s3_v_tpl_none":"не используется: концы соединены напрямую","s3_v_tpl_no":"не найдена","s3_v_tpl_g1":"нет: в G1 сестринской хроматиды нет","s3_v_tpl_nostart":"поиск не начат: концы не резецированы","s3_r_int":"Целостность молекулы","s3_r_int_s":"соединены ли концы","s3_v_int_yes":"восстановлена","s3_v_int_no":"не восстановлена","s3_r_seq":"Последовательность в месте разрыва","s3_v_seq_same":"как исходная","s3_v_seq_del":"утрачено {n} пары нуклеотидов","s3_v_seq_na":"—","s3_cap_hr":"После репликации рядом есть сестринская хроматида с той же последовательностью. Нуклеазы резекции укорачивают 5′-концы разрыва, на одноцепочечных 3′-концах собирается RAD51, конец находит комплементарный участок сестринской хроматиды и встраивается в неё; полимераза копирует недостающий участок, лигаза сшивает. Утраченные нуклеотиды восстановлены по копии.","s3_cap_hr_z":"Гомологичная рекомбинация точна, потому что использует матрицу — неповреждённую копию того же участка. В G2 такая копия есть: это сестринская хроматида, образовавшаяся при репликации.","s3_cap_nhej_ok_G1":"До репликации второй копии участка в этой хромосоме нет. Белки Ku связывают оба конца и удерживают их рядом, лигаза IV сшивает. Концы совместимы, нуклеотиды не утрачены, поэтому последовательность после соединения такая же, как была.","s3_cap_nhej_ok_G1_z":"Соединение концов без матрицы не обязательно ошибочно: если концы не повреждены и подходят друг к другу, исходная последовательность сохраняется.","s3_cap_nhej_del_G1":"До репликации второй копии участка в этой хромосоме нет. Концы повреждены: перед сшиванием их обрабатывают, и несколько нуклеотидов утрачено. Белки Ku и лигаза IV соединяют концы — целостность молекулы восстановлена, но на месте соединения не хватает 4 пар нуклеотидов.","s3_cap_nhej_del_G1_z":"Без матрицы утраченные нуклеотиды восстановить не по чему. Соединение возвращает целостность хромосомы, но не исходную последовательность.","s3_cap_nhej_ok_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы совместимы — последовательность как исходная.","s3_cap_nhej_ok_G2_z":"Наличие матрицы ещё не означает, что её используют: для HR нужна резекция концов. В G2 работает и NHEJ.","s3_cap_nhej_del_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы были повреждены — на месте соединения утрачены 4 пары нуклеотидов, хотя точная копия участка находится рядом.","s3_cap_nhej_del_G2_z":"Точность определяется не периодом цикла как таковым, а тем, используется ли матрица. Период цикла определяет, есть ли сестринская хроматида.","s3_cap_stuck":"Концы резецированы, но без RAD51 одноцепочечный конец не спаривается с комплементарным участком сестринской хроматиды. В модели резецированные концы не соединяются и NHEJ: разрыв остаётся. В клетке такие концы могут соединить другие пути — с большей утратой нуклеотидов; в модели они не показаны.","s3_cap_stuck_z":"Резекция — первый этап HR: после неё концы уже не подходят для прямого соединения. Поэтому нарушение позднего этапа HR может быть опаснее, чем отсутствие резекции.","s3_cap_open":"Нет деталей NHEJ, а гомологичная рекомбинация невозможна или не начата: в модели концы не соединены. В клетке их может соединить альтернативный путь — с утратой нуклеотидов; в модели он не показан. Если разрыв сохранится до деления, фрагмент хромосомы без центромеры будет утрачен.","s3_cap_open_z":"Разрыв обеих цепей опаснее повреждения одной цепи: на месте разрыва нет целой цепи, которая служила бы матрицей, и молекула разделена на две части."},"notes":["Концы сшиты без потерь: последовательность как исходная.","Концы обработаны и сшиты: утрачено 4 пары нуклеотидов."],"static":["Концы сшиты без потерь: последовательность как исходная."]}}},{"id":"homologous-recombination","section":2,"questions":[3],"title":"Гомологичная рекомбинация: участок восстанавливается по сестринской хроматиде","keywords":["HR","резекция","RAD51","D-петля","сестринская хроматида"],"lead":["Чтобы вернуть утраченные нуклеотиды, нужна неповреждённая копия того же участка. После репликации ДНК такая копия есть — [[T25|сестринская хроматида]].","Её использует гомологичная рекомбинация (HR)."],"mechanism":["[[T30|Нуклеазы резекции]] укорачивают 5′-концы разрыва; на обоих концах остаются одноцепочечные 3′-участки, сначала покрытые белком RPA.","[[T31|RAD51]] собирается на 3′-участке и обеспечивает поиск комплементарного участка в сестринской хроматиде.","3′-конец встраивается в сестринскую молекулу и спаривается с её комплементарной цепью; вытесненная цепь образует D-петлю.","ДНК-полимераза удлиняет 3′-конец по матрице; затем удлинённая цепь соединяется со вторым концом разрыва, пробелы заполняются, лигаза сшивает. Сестринская хроматида остаётся неизменной."],"paragraphs":["Гомологичная рекомбинация точна, потому что копирует матрицу, а сестринская хроматида — точная копия, возникшая при репликации. Сёстры удерживаются рядом [[T26|когезином]] до анафазы митоза, что облегчает поиск.","Резекция — первый и решающий этап: после неё концы уже не подходят для прямого соединения. Нуклеазы резекции активны в основном в S и G2, поэтому гомологичная рекомбинация работает в эти периоды.","Гомологичная рекомбинация — точное копирование матрицы, а не гарантия исходной последовательности: если матрицей окажется не сестринская хроматида, а гомологичная хромосома другого родителя, участок станет таким, как в ней (продвинутый шаг раздела)."],"conditions":"Схема шага — модель вкладки 3; этапы рекомбинации показаны упрощённо, без образования перекрёстных структур.","sources":["Alberts2022","Scully2019"],"quiz":{"id":"S8-L15","question":"Почему гомологичная рекомбинация восстанавливает утраченные нуклеотиды, а NHEJ — нет?","options":[{"id":"S8-L15-1","text":"Она использует более точную лигазу","correct":false,"feedback":"Точность определяется наличием матрицы, а не лигазой."},{"id":"S8-L15-2","text":"Она соединяет концы медленнее и аккуратнее","correct":false,"feedback":"Дело не в скорости: без матрицы утраченное восстановить не по чему."},{"id":"S8-L15-3","text":"Она копирует недостающий участок с неповреждённой молекулы — сестринской хроматиды","correct":true,"feedback":"Утраченную информацию можно восстановить только по другой копии; HR её использует."}]},"widget":{"kind":"dna","title":"","s":{"title":"Гомологичная рекомбинация в G2","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["G2, все детали","G2, нет RAD51"],"scene":"s3b","args":[["G2","lost",{}],["G2","lost",{"rad51":false}]],"L":{"s3_ph":"Период клеточного цикла","s3_ph_G1":"G1 — до репликации ДНК","s3_ph_G2":"G2 — после репликации ДНК","s3_end":"Концы разрыва","s3_end_clean":"совместимые, нуклеотиды не утрачены","s3_end_lost":"повреждены: часть нуклеотидов утрачена","s3_pA":"А. Хромосома в клетке: период {ph}","s3_lbl_g1":"одна молекула ДНК в хромосоме; копии этого участка в той же хромосоме нет","s3_lbl_g2":"две сестринские хроматиды скреплены когезином (кольца)","s3_lbl_brk":"хроматида 1","s3_lbl_sis":"хроматида 2","s3_lbl_whole":"целостность молекулы восстановлена","s3_pB":"Б. Участок ДНК в месте разрыва (зелёным — синтезировано по матрице)","s3_e_ku":"Ku","s3_e_lig4":"лигаза IV","s3_e_res":"резекция","s3_e_rad51":"RAD51","s3_st_hr":"участок восстановлен по сестринской хроматиде:\nпоследовательность как исходная","s3_st_nhej_ok":"концы сшиты напрямую (пунктир — место соединения):\nпоследовательность как исходная","s3_st_nhej_del":"концы сшиты напрямую: утрачены 4 пары нуклеотидов\n(рамка — место соединения)","s3_st_stuck":"концы резецированы, но матрица не найдена:\nразрыв не устранён","s3_st_open":"концы не соединены: разрыв остался","s3_r_path":"Путь","s3_v_path_hr":"гомологичная рекомбинация (HR)","s3_v_path_nhej":"негомологичное соединение концов (NHEJ)","s3_v_path_none":"нет","s3_r_tpl":"Матрица","s3_v_tpl_sis":"сестринская хроматида","s3_v_tpl_none":"не используется: концы соединены напрямую","s3_v_tpl_no":"не найдена","s3_v_tpl_g1":"нет: в G1 сестринской хроматиды нет","s3_v_tpl_nostart":"поиск не начат: концы не резецированы","s3_r_int":"Целостность молекулы","s3_r_int_s":"соединены ли концы","s3_v_int_yes":"восстановлена","s3_v_int_no":"не восстановлена","s3_r_seq":"Последовательность в месте разрыва","s3_v_seq_same":"как исходная","s3_v_seq_del":"утрачено {n} пары нуклеотидов","s3_v_seq_na":"—","s3_cap_hr":"После репликации рядом есть сестринская хроматида с той же последовательностью. Нуклеазы резекции укорачивают 5′-концы разрыва, на одноцепочечных 3′-концах собирается RAD51, конец находит комплементарный участок сестринской хроматиды и встраивается в неё; полимераза копирует недостающий участок, лигаза сшивает. Утраченные нуклеотиды восстановлены по копии.","s3_cap_hr_z":"Гомологичная рекомбинация точна, потому что использует матрицу — неповреждённую копию того же участка. В G2 такая копия есть: это сестринская хроматида, образовавшаяся при репликации.","s3_cap_nhej_ok_G1":"До репликации второй копии участка в этой хромосоме нет. Белки Ku связывают оба конца и удерживают их рядом, лигаза IV сшивает. Концы совместимы, нуклеотиды не утрачены, поэтому последовательность после соединения такая же, как была.","s3_cap_nhej_ok_G1_z":"Соединение концов без матрицы не обязательно ошибочно: если концы не повреждены и подходят друг к другу, исходная последовательность сохраняется.","s3_cap_nhej_del_G1":"До репликации второй копии участка в этой хромосоме нет. Концы повреждены: перед сшиванием их обрабатывают, и несколько нуклеотидов утрачено. Белки Ku и лигаза IV соединяют концы — целостность молекулы восстановлена, но на месте соединения не хватает 4 пар нуклеотидов.","s3_cap_nhej_del_G1_z":"Без матрицы утраченные нуклеотиды восстановить не по чему. Соединение возвращает целостность хромосомы, но не исходную последовательность.","s3_cap_nhej_ok_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы совместимы — последовательность как исходная.","s3_cap_nhej_ok_G2_z":"Наличие матрицы ещё не означает, что её используют: для HR нужна резекция концов. В G2 работает и NHEJ.","s3_cap_nhej_del_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы были повреждены — на месте соединения утрачены 4 пары нуклеотидов, хотя точная копия участка находится рядом.","s3_cap_nhej_del_G2_z":"Точность определяется не периодом цикла как таковым, а тем, используется ли матрица. Период цикла определяет, есть ли сестринская хроматида.","s3_cap_stuck":"Концы резецированы, но без RAD51 одноцепочечный конец не спаривается с комплементарным участком сестринской хроматиды. В модели резецированные концы не соединяются и NHEJ: разрыв остаётся. В клетке такие концы могут соединить другие пути — с большей утратой нуклеотидов; в модели они не показаны.","s3_cap_stuck_z":"Резекция — первый этап HR: после неё концы уже не подходят для прямого соединения. Поэтому нарушение позднего этапа HR может быть опаснее, чем отсутствие резекции.","s3_cap_open":"Нет деталей NHEJ, а гомологичная рекомбинация невозможна или не начата: в модели концы не соединены. В клетке их может соединить альтернативный путь — с утратой нуклеотидов; в модели он не показан. Если разрыв сохранится до деления, фрагмент хромосомы без центромеры будет утрачен.","s3_cap_open_z":"Разрыв обеих цепей опаснее повреждения одной цепи: на месте разрыва нет целой цепи, которая служила бы матрицей, и молекула разделена на две части."},"notes":["Участок восстановлен по сестринской хроматиде.","Концы резецированы, матрица не найдена: разрыв остался."],"static":["Участок восстановлен по сестринской хроматиде."]}}},{"id":"phase-and-template","section":2,"questions":[3],"title":"Стадия клеточного цикла определяет, есть ли матрица","keywords":["G1","S","G2","выбор пути","точность"],"lead":["Уже известно: в S-фазе ДНК реплицируется, и до митоза хромосома состоит из двух сестринских хроматид (семинар 6).","Отсюда связь пути репарации разрыва со стадией цикла — последняя часть вопроса 7."],"mechanism":["В G1 сестринской хроматиды нет: обычно используется NHEJ; возможность и исход репарации зависят от условий (состояния концов, доступных белков).","В S и G2 сестринская хроматида есть, и нуклеазы резекции активны: возможна гомологичная рекомбинация.","NHEJ возможен и в S/G2; в эти периоды пути конкурируют.","Точность определяется не стадией как таковой, а тем, используется ли матрица; стадия определяет, есть ли она."],"paragraphs":["Гомологичная хромосома другого родителя есть в клетке всегда, но в соматических клетках для репарации разрыва она используется редко: сестринская хроматида удерживается рядом когезином, а гомологичная хромосома — обычно нет.","Резекция концов активна в S и G2 — в те периоды, когда в клетке есть сестринская хроматида.","Как клетка регулирует выбор пути по стадии цикла и состоянию концов, разбирается в курсе «Молекулярная биология»; на этом курсе достаточно связи «есть копия — возможна рекомбинация»."],"conditions":"Схема шага — модель вкладки 3: в G2 при всех деталях показана HR; в клетке в G2 работают оба пути.","sources":["Alberts2022","Scully2019"],"quiz":{"id":"S8-L16","question":"Клетка в G2, но нуклеазы резекции не работают. Каким путём, по учебной модели этого семинара, будет устранён разрыв обеих цепей и будет ли восстановлена исходная последовательность?","options":[{"id":"S8-L16-1","text":"NHEJ; последовательность восстановится, только если концы совместимы","correct":true,"feedback":"Без резекции HR не начинается, хотя сестринская хроматида есть; соединение без матрицы точно лишь при неповреждённых концах."},{"id":"S8-L16-2","text":"Гомологичной рекомбинацией по сестринской хроматиде, точно","correct":false,"feedback":"RAD51 собирается на одноцепочечном 3′-конце, который образуется только при резекции."},{"id":"S8-L16-3","text":"Разрыв будет сохраняться до митоза","correct":false,"feedback":"NHEJ работает во всех периодах клеточного цикла, в том числе в G2."}]},"widget":{"kind":"dna","title":"","s":{"title":"G1 и G2 при одинаковом разрыве","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["G1, концы повреждены","G2, концы повреждены"],"scene":"s3b","args":[["G1","lost",{}],["G2","lost",{}]],"L":{"s3_ph":"Период клеточного цикла","s3_ph_G1":"G1 — до репликации ДНК","s3_ph_G2":"G2 — после репликации ДНК","s3_end":"Концы разрыва","s3_end_clean":"совместимые, нуклеотиды не утрачены","s3_end_lost":"повреждены: часть нуклеотидов утрачена","s3_pA":"А. Хромосома в клетке: период {ph}","s3_lbl_g1":"одна молекула ДНК в хромосоме; копии этого участка в той же хромосоме нет","s3_lbl_g2":"две сестринские хроматиды скреплены когезином (кольца)","s3_lbl_brk":"хроматида 1","s3_lbl_sis":"хроматида 2","s3_lbl_whole":"целостность молекулы восстановлена","s3_pB":"Б. Участок ДНК в месте разрыва (зелёным — синтезировано по матрице)","s3_e_ku":"Ku","s3_e_lig4":"лигаза IV","s3_e_res":"резекция","s3_e_rad51":"RAD51","s3_st_hr":"участок восстановлен по сестринской хроматиде:\nпоследовательность как исходная","s3_st_nhej_ok":"концы сшиты напрямую (пунктир — место соединения):\nпоследовательность как исходная","s3_st_nhej_del":"концы сшиты напрямую: утрачены 4 пары нуклеотидов\n(рамка — место соединения)","s3_st_stuck":"концы резецированы, но матрица не найдена:\nразрыв не устранён","s3_st_open":"концы не соединены: разрыв остался","s3_r_path":"Путь","s3_v_path_hr":"гомологичная рекомбинация (HR)","s3_v_path_nhej":"негомологичное соединение концов (NHEJ)","s3_v_path_none":"нет","s3_r_tpl":"Матрица","s3_v_tpl_sis":"сестринская хроматида","s3_v_tpl_none":"не используется: концы соединены напрямую","s3_v_tpl_no":"не найдена","s3_v_tpl_g1":"нет: в G1 сестринской хроматиды нет","s3_v_tpl_nostart":"поиск не начат: концы не резецированы","s3_r_int":"Целостность молекулы","s3_r_int_s":"соединены ли концы","s3_v_int_yes":"восстановлена","s3_v_int_no":"не восстановлена","s3_r_seq":"Последовательность в месте разрыва","s3_v_seq_same":"как исходная","s3_v_seq_del":"утрачено {n} пары нуклеотидов","s3_v_seq_na":"—","s3_cap_hr":"После репликации рядом есть сестринская хроматида с той же последовательностью. Нуклеазы резекции укорачивают 5′-концы разрыва, на одноцепочечных 3′-концах собирается RAD51, конец находит комплементарный участок сестринской хроматиды и встраивается в неё; полимераза копирует недостающий участок, лигаза сшивает. Утраченные нуклеотиды восстановлены по копии.","s3_cap_hr_z":"Гомологичная рекомбинация точна, потому что использует матрицу — неповреждённую копию того же участка. В G2 такая копия есть: это сестринская хроматида, образовавшаяся при репликации.","s3_cap_nhej_ok_G1":"До репликации второй копии участка в этой хромосоме нет. Белки Ku связывают оба конца и удерживают их рядом, лигаза IV сшивает. Концы совместимы, нуклеотиды не утрачены, поэтому последовательность после соединения такая же, как была.","s3_cap_nhej_ok_G1_z":"Соединение концов без матрицы не обязательно ошибочно: если концы не повреждены и подходят друг к другу, исходная последовательность сохраняется.","s3_cap_nhej_del_G1":"До репликации второй копии участка в этой хромосоме нет. Концы повреждены: перед сшиванием их обрабатывают, и несколько нуклеотидов утрачено. Белки Ku и лигаза IV соединяют концы — целостность молекулы восстановлена, но на месте соединения не хватает 4 пар нуклеотидов.","s3_cap_nhej_del_G1_z":"Без матрицы утраченные нуклеотиды восстановить не по чему. Соединение возвращает целостность хромосомы, но не исходную последовательность.","s3_cap_nhej_ok_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы совместимы — последовательность как исходная.","s3_cap_nhej_ok_G2_z":"Наличие матрицы ещё не означает, что её используют: для HR нужна резекция концов. В G2 работает и NHEJ.","s3_cap_nhej_del_G2":"Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы были повреждены — на месте соединения утрачены 4 пары нуклеотидов, хотя точная копия участка находится рядом.","s3_cap_nhej_del_G2_z":"Точность определяется не периодом цикла как таковым, а тем, используется ли матрица. Период цикла определяет, есть ли сестринская хроматида.","s3_cap_stuck":"Концы резецированы, но без RAD51 одноцепочечный конец не спаривается с комплементарным участком сестринской хроматиды. В модели резецированные концы не соединяются и NHEJ: разрыв остаётся. В клетке такие концы могут соединить другие пути — с большей утратой нуклеотидов; в модели они не показаны.","s3_cap_stuck_z":"Резекция — первый этап HR: после неё концы уже не подходят для прямого соединения. Поэтому нарушение позднего этапа HR может быть опаснее, чем отсутствие резекции.","s3_cap_open":"Нет деталей NHEJ, а гомологичная рекомбинация невозможна или не начата: в модели концы не соединены. В клетке их может соединить альтернативный путь — с утратой нуклеотидов; в модели он не показан. Если разрыв сохранится до деления, фрагмент хромосомы без центромеры будет утрачен.","s3_cap_open_z":"Разрыв обеих цепей опаснее повреждения одной цепи: на месте разрыва нет целой цепи, которая служила бы матрицей, и молекула разделена на две части."},"notes":["G1: концы соединены, утрачено 4 пары.","G2: участок восстановлен по сестринской хроматиде."],"static":["G1: концы соединены, утрачено 4 пары."]}}},{"id":"integrity-vs-sequence","section":2,"questions":[3],"title":"Целостность молекулы и исходная последовательность — разные результаты","keywords":["целостность","исходная последовательность","потеря гетерозиготности","обратная задача"],"lead":["Уже известно: NHEJ соединяет концы без матрицы, HR копирует матрицу (БИО-8·14, БИО-8·15).","Новое: какой результат даёт каждый путь при разной доступной информации."],"mechanism":["Без матрицы: если соединение концов завершилось успешно, целостность восстановлена; исходная последовательность — только при совместимых концах.","С сестринской хроматидой: восстанавливается и целостность, и исходная последовательность.","С гомологичной хромосомой: целостность восстановлена, утраченные нуклеотиды тоже, но по её последовательности — различие между родительскими вариантами на этом участке утрачивается (потеря гетерозиготности).","Значит, точное копирование матрицы не равно восстановлению исходной последовательности."],"paragraphs":["Обратная задача: последовательность на месте разрыва совпадает с исходной. Такой итог дают и рекомбинация с сестринской хроматидой, и точное соединение совместимых концов — по одному этому наблюдению путь не установить. Помогли бы другие наблюдения: стадия цикла, состояние концов, зависимость результата от RAD51 или от Ku.","Обратная задача: на месте соединения утрачено несколько пар. Значит, информация не была скопирована; это возможно и в G1, и в G2, если сестринская хроматида не использована.","Гомологичная рекомбинация тоже не безошибочна: при синтезе по матрице возможны ошибки, а некоторые её варианты, при которых копируется длинный участок, особенно склонны к изменениям. Потеря гетерозиготности, хотя и редкое событие, — один из этапов развития многих опухолей; это пример значения механизма.","Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель вкладки 3 (продвинутый уровень): различие в позиции 7 и утрата 4 пар — условный пример. В модели показаны только успешно завершившиеся варианты репарации; неудачная репарация, гибель клетки и другие пути в ней не учитываются.","sources":["Alberts2022","Scully2019"],"quiz":{"id":"S8-L17","question":"После восстановления разрыва в G2 участок совпал с гомологичной хромосомой, а не с исходной молекулой. Что произошло?","options":[{"id":"S8-L17-1","text":"Концы были соединены NHEJ с ошибкой","correct":false,"feedback":"NHEJ не копирует последовательность другой хромосомы; он может лишь утратить нуклеотиды."},{"id":"S8-L17-2","text":"Матрицей для рекомбинации послужила гомологичная хромосома, а не сестринская хроматида","correct":true,"feedback":"Рекомбинация точно копирует матрицу; если матрица отличается от исходной, результат тоже будет отличаться."},{"id":"S8-L17-3","text":"Произошло новое изменение в гомологичной хромосоме","correct":false,"feedback":"Гомологичная хромосома не меняется: она служит образцом."}]},"widget":{"kind":"dna","title":"","s":{"title":"Какая информация использована","status":"Учебная модель · условный пример","modes_label":"Что показать","modes":["G1, концы совместимы","G2, сестра рядом","G2, гомологичная хромосома"],"scene":"a3","args":[["G1","near","clean"],["G2","near","lost"],["G2","hom","lost"]],"L":{"s3a_prob":"Восстановить целостность молекулы и восстановить исходную последовательность — одно и то же? От чего зависит, какую информацию клетка использует при репарации разрыва?","s3a_ph":"Период клеточного цикла","s3a_tpl":"Гомологичная матрица в G2","s3a_tpl_near":"сестринская хроматида рядом","s3a_tpl_far":"сестринская хроматида не удержана рядом","s3a_tpl_hom":"использована гомологичная хромосома","s3a_tnote":"В G1 сестринской хроматиды нет; в модели разрыв в G1 соединяется без матрицы.","s3a_pA":"А. Какие копии участка есть в ядре (период {ph}; схема)","s3a_lbl_one":"разорванная хромосома: копии участка в ней нет","s3a_lbl_hom":"гомологичная хромосома (от другого родителя)","s3a_lbl_hom2":"гомологичная хромосома","s3a_lbl_brk":"хроматида с разрывом","s3a_lbl_near":"сестринская — рядом","s3a_lbl_far":"сестринская — далеко","s3a_lbl_mask":"Наблюдение: известна только последовательность после восстановления","s3a_pB":"Б. Последовательность на месте разрыва после восстановления","s3a_lbl_orig":"исходная: в позиции 7 пара T–A; в гомологичной хромосоме здесь C–G","s3a_st_same":"последовательность как исходная","s3a_st_del":"утрачено 4 пары нуклеотидов","s3a_st_hom":"участок скопирован с гомологичной хромосомы:\nв позиции 7 теперь C–G","s3a_r_src":"Информация для восстановления","s3a_v_src_none":"не использована: концы соединены","s3a_v_src_sis":"сестринская хроматида","s3a_v_src_hom":"гомологичная хромосома","s3a_v_seq_same":"как исходная","s3a_v_seq_del":"утрачено 4 пары нуклеотидов","s3a_v_seq_hom":"как в гомологичной хромосоме","s3a_cap_g1_clean":"До репликации копии участка в этой хромосоме нет. Концы совместимы, NHEJ сшивает их без потерь: последовательность восстановлена, хотя никакая матрица не использована.","s3a_cap_g1_clean_z":"Точный результат не доказывает, что работала гомологичная рекомбинация: совместимые концы восстанавливаются точно и без матрицы.","s3a_cap_g1_lost":"До репликации копии участка в этой хромосоме нет. Концы повреждены: при соединении несколько нуклеотидов утрачено. Целостность молекулы восстановлена, исходная последовательность — нет.","s3a_cap_g1_lost_z":"Без информации об утраченном участке его нельзя восстановить: соединение концов возвращает целостность, но не содержание.","s3a_cap_near":"Сестринская хроматида удержана рядом белковыми кольцами когезина. Конец разрыва находит в ней тот же участок, и утраченные нуклеотиды синтезируются по копии: последовательность как исходная.","s3a_cap_near_z":"Сестринская хроматида — точная копия, образовавшаяся при репликации; её близость делает поиск быстрым и снижает риск ошибочного выбора матрицы.","s3a_cap_far_lost":"Сестринская хроматида есть, но не удержана рядом. В модели матрица не найдена, концы соединены без неё: утрачены 4 пары нуклеотидов — как в G1.","s3a_cap_far_lost_z":"Наличие копии в ядре ещё не гарантирует её использование: важно, где она находится.","s3a_cap_far_clean":"Сестринская хроматида не удержана рядом, концы соединены без матрицы; концы совместимы — последовательность как исходная.","s3a_cap_far_clean_z":"Тот же точный итог, что при гомологичной рекомбинации, получен другим путём.","s3a_cap_hom":"Матрицей послужила гомологичная хромосома от другого родителя. Разрыв устранён, утраченные нуклеотиды восстановлены — но по её последовательности: в позиции 7 теперь C–G, как у гомолога. Различие между двумя родительскими вариантами в этом месте утрачено.","s3a_cap_hom_z":"Гомологичная рекомбинация точно копирует матрицу, но матрица может отличаться от исходной последовательности. Такая утрата различия называется потерей гетерозиготности.","s3a_cap_mask":"Обратная задача: известно только, какой стала последовательность. Переключатели и информация о ядре скрыты.","s3a_cap_mask_z":"Подумайте, какими разными путями мог получиться такой результат.","s3a_take":"Способность восстановить целостность молекулы и способность восстановить исходную последовательность — разные свойства системы. Успешное соединение концов без матрицы возвращает целостность, а исходную последовательность — только при совместимых концах. Гомологичная рекомбинация восстанавливает утраченные нуклеотиды, но копирует матрицу: с сестринской хроматидой результат совпадает с исходным, с гомологичной хромосомой — с вариантом другого родителя. Поэтому по одному итогу нельзя доказать путь: точную последовательность дают и рекомбинация, и точное соединение совместимых концов.","s3a_lim":"Модель не показывает, как определяется путь репарации (это регулируемый процесс, который зависит от обработки концов и от периода цикла; подробно — в курсе «Молекулярная биология»). В клетке в G2 работают оба пути — и HR, и соединение концов; в модели при сестринской хроматиде рядом показана HR. Не показаны другие способы соединения концов, при которых утрачиваются более длинные участки, соединение концов разных хромосом и ошибки синтеза при самой рекомбинации. Различие в позиции 7 и утрата 4 пар — условный пример. Показаны только успешно завершившиеся варианты репарации: неудачная репарация, гибель клетки и другие пути в модели не учитываются.","s3a_new":"Сестринская хроматида полезна для репарации, когда находится рядом с разрывом. Белковый комплекс когезин удерживает сестринские хроматиды вместе от репликации до митоза и тем самым способствует рекомбинации именно между сёстрами, подавляя рекомбинацию с другими похожими участками генома. У дрожжей показано, что после разрыва когезин дополнительно накапливается у повреждённого участка; предполагают, что это укрепляет связь с сестринской хроматидой и облегчает точную гомологичную рекомбинацию.","s3a_how":"в клетках вызывали разрыв в известном месте и определяли, где связывается когезин и как часто разрыв устраняется по сестринской хроматиде; данные для дрожжей и клеток млекопитающих обобщены в обзоре. Роль накопления когезина у разрыва — предположение авторов, а не прямо измеренное следствие для клеток человека.","s3a_tl_note":"Порядок этапов — учебная модель. Положение хромосом в ядре и длины участков на схеме условные.","s3a_tl_1":"Разрыв обеих цепей в одной хроматиде: молекула разделена на две части.","s3a_tl_2_g1":"Источник информации: в G1 сестринской хроматиды нет — в модели концы соединяются без матрицы (NHEJ).","s3a_tl_2_near":"Источник информации: сестринская хроматида удержана рядом когезином; концы резецируются, и идёт поиск комплементарного участка на ней.","s3a_tl_2_far":"Источник информации: сестринская хроматида не удержана рядом — в модели HR не идёт, концы соединяются без матрицы (NHEJ).","s3a_tl_2_hom":"Источник информации: матрицей становится гомологичная хромосома другого родителя; концы резецируются, и конец спаривается с ней.","s3a_tl_3_clean":"Восстановление: совместимые концы сшиты напрямую, без утраты нуклеотидов.","s3a_tl_3_lost":"Восстановление: концы сшиты напрямую после удаления повреждённых нуклеотидов — утрачены 4 пары (число условное).","s3a_tl_3_sis":"Восстановление: ДНК-полимераза синтезирует участок по сестринской хроматиде.","s3a_tl_3_hom":"Восстановление: ДНК-полимераза синтезирует участок по гомологичной хромосоме — копируется её вариант последовательности.","s3a_tl_4_same":"Итог: целостность молекулы восстановлена, последовательность как исходная.","s3a_tl_4_del":"Итог: целостность молекулы восстановлена, но 4 пары нуклеотидов утрачены.","s3a_tl_4_hom":"Итог: целостность молекулы восстановлена, но в позиции 7 теперь вариант гомологичной хромосомы — пара C–G вместо T–A.","s3a_pB_an":"Б. Участок ДНК на месте разрыва"},"notes":["Без матрицы, но без потерь: последовательность как исходная.","По сестринской хроматиде: как исходная.","По гомологичной хромосоме: в позиции 7 теперь C–G."],"static":["Без матрицы, но без потерь: последовательность как исходная."]}},"level":"adv"},{"id":"sister-nearby","section":2,"questions":[3],"title":"Сестринская хроматида помогает, если она рядом: роль когезина","keywords":["когезин","когезия сестринских хроматид","поиск матрицы"],"lead":["Уже известно: сёстры удерживаются вместе когезином до анафазы (семинар 6; БИО-8·15).","Новое: это удержание важно не только для расхождения хромосом, но и для точной репарации."],"mechanism":["Когезия держит сестринскую хроматиду рядом с разрывом и облегчает поиск комплементарного участка.","Она же снижает вероятность того, что матрицей станет другой похожий участок генома (повтор или гомологичная хромосома).","У дрожжей показано, что после разрыва когезин дополнительно накапливается у повреждённого участка; предполагают, что это укрепляет связь с сестрой и облегчает точную рекомбинацию.","Наличие копии в клетке и её доступность — разные условия."],"paragraphs":["В модели продвинутого уровня есть положение «сестринская хроматида не удержана рядом»: копия есть, но не найдена, и концы соединяются без матрицы — как в G1. Это упрощение: в клетке поиск идёт и на расстоянии, но с меньшим успехом.","Когезин участвует и в других процессах — например, образует петли хроматина; это тема курса «Молекулярная биология» ([[https://fresll.github.io/molbio/seminar-6-route.html#loops|МБ, семинар 6, шаг 11]]).","Как это узнали: вызывали разрыв в известном месте генома и определяли, где связывается когезин и как часто разрыв устраняется по сестринской хроматиде; данные для дрожжей и клеток млекопитающих обобщены в обзоре. Роль накопления когезина у разрыва — предположение авторов, а не прямо измеренное следствие для клеток человека.","Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Обзор; данные о накоплении когезина у разрыва получены на дрожжах.","sources":["MarinGonzalezHa2026"],"quiz":{"id":"S8-L18","question":"Клетка в G2, сестринская хроматида есть, но когезия нарушена. Какой исход разрыва с утратой нуклеотидов вероятнее в модели?","options":[{"id":"S8-L18-1","text":"Точное восстановление по сестринской хроматиде","correct":false,"feedback":"Для рекомбинации копию нужно найти; удержание рядом этому способствует."},{"id":"S8-L18-2","text":"Разрыв не будет устранён","correct":false,"feedback":"NHEJ возможен в любом периоде цикла."},{"id":"S8-L18-3","text":"Соединение концов без матрицы с утратой нуклеотидов","correct":true,"feedback":"Копия есть, но не удержана рядом; в модели она не найдена, и концы соединяются напрямую."}]},"widget":{"kind":"dna","title":"","s":{"title":"Сестринская хроматида: рядом или далеко","status":"Учебная модель · условный пример","modes_label":"Что показать","modes":["сестра рядом","сестра не удержана"],"scene":"a3","args":[["G2","near","lost"],["G2","far","lost"]],"L":{"s3a_prob":"Восстановить целостность молекулы и восстановить исходную последовательность — одно и то же? От чего зависит, какую информацию клетка использует при репарации разрыва?","s3a_ph":"Период клеточного цикла","s3a_tpl":"Гомологичная матрица в G2","s3a_tpl_near":"сестринская хроматида рядом","s3a_tpl_far":"сестринская хроматида не удержана рядом","s3a_tpl_hom":"использована гомологичная хромосома","s3a_tnote":"В G1 сестринской хроматиды нет; в модели разрыв в G1 соединяется без матрицы.","s3a_pA":"А. Какие копии участка есть в ядре (период {ph}; схема)","s3a_lbl_one":"разорванная хромосома: копии участка в ней нет","s3a_lbl_hom":"гомологичная хромосома (от другого родителя)","s3a_lbl_hom2":"гомологичная хромосома","s3a_lbl_brk":"хроматида с разрывом","s3a_lbl_near":"сестринская — рядом","s3a_lbl_far":"сестринская — далеко","s3a_lbl_mask":"Наблюдение: известна только последовательность после восстановления","s3a_pB":
