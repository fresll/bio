span></li><li><b>Б.</b> В клетках нет активной теломеразы <i>(неверный вариант)</i><br><span class="expl">Теломеры укорачиваются и при низкой активности теломеразы, недостаточной для возмещения потерь (так у фибробластов человека); активность фермента нужно измерять отдельно.</span></li><li><b>В.</b> По одному уменьшению средней длины нельзя определить ни активность теломеразы, ни защиту концов: нужны дополнительные измерения <i>(верный вариант)</i><br><span class="expl">Укорочение согласуется и с отсутствием теломеразы, и с её низкой активностью, которой не хватает, чтобы возместить потери (так у фибробластов человека); могла измениться и доля разных клеток в культуре. Нужно отдельно измерить активность теломеразы, распределение длин (самые короткие теломеры) и узнаются ли концы как разрывы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2013.09.048">Doksani Y., Wu J. Y., de Lange T., Zhuang X. Super-resolution fluorescence imaging of telomeres reveals TRF2-dependent T-loop formation. Cell. 2013;155:345–356</a></li><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Клетки мыши (эмбриональные фибробласты); теломеры мыши длиннее человеческих. Значения модели — условные.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 25 из 26</div><h2>Сводная задача: ошибка, повреждение или закреплённое изменение?</h2><p class="lead">Объединим четыре вопроса. В одном и том же участке ДНК трёх клеток найдено разное. Задача — назвать, что это за событие, какие системы могут с ним справиться и что можно и чего нельзя утверждать.</p><div class="note"><strong>Что показывает схема.</strong> Изменения нет.</div><ol class="mech"><li>Клетка 1: в одной цепи урацил напротив G, репликации ещё не было. Это повреждение; его устранит BER по неповреждённой цепи, и мутации не будет.</li><li>Клетка 2: в новой цепи C напротив A матрицы, разрывы в новой цепи ещё есть. Это ошибка спаривания; её может исправить MMR, а если не успеет — после репликации изменение закрепится в одной из двух молекул.</li><li>Клетка 3: в обеих цепях согласованная пара C–G на месте T–A, которая была у родительской клетки. Это закреплённое изменение; системы репарации его не узнают.</li><li>По одной клетке 3 нельзя сказать, откуда изменение: из не исправленной ошибки спаривания или из не устранённого до репликации повреждения.</li></ol><p>Чтобы различить гипотезы для клетки 3, нужны дополнительные наблюдения: состав многих изменений в геноме (какие замены преобладают), работа систем исправления и репарации в этих клетках, было ли воздействие, повреждающее ДНК.</p><p>Разрыв обеих цепей и укорочение теломер добавляют ещё два типа событий: изменение участка хромосомы при соединении концов и утрату защиты концов. Их тоже различают по виду результата: потери на месте соединения, сшитые концы хромосом, сигнал повреждения на теломерах.</p><p>Общий принцип семинара: предотвращение ошибки, её исправление, устранение повреждения и закрепление изменения — разные процессы, и наблюдаемый результат не всегда однозначно указывает на причину.</p><div class="static-quiz"><h3>В ДНК клетки найдена согласованная пара T–A на месте C–G, которая была у родительской клетки. Какое утверждение верно?</h3><ol><li><b>А.</b> Это закреплённое изменение; по одной этой паре нельзя сказать, возникло оно из ошибки спаривания или из повреждения <i>(верный вариант)</i><br><span class="expl">Обе цепи согласованы; путь к изменению по нему не установить без дополнительных наблюдений.</span></li><li><b>Б.</b> Это урацил, который ещё может удалить BER <i>(неверный вариант)</i><br><span class="expl">Урацила здесь нет: в обеих цепях нормальные основания, T и A.</span></li><li><b>В.</b> Это ошибка спаривания, которую исправит MMR <i>(неверный вариант)</i><br><span class="expl">Пара T–A комплементарна: ошибочной пары нет, и MMR её не узнает.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a> <a href="seminar-8.html#q3">Вопрос 3 →</a> <a href="seminar-8.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Мысленная задача по моделям вкладок 1 и 2.</p></details></article><article class="card print-unit" id="ns-exit-to-gene"><div class="eyebrow">Концы хромосом: укорочение, теломераза и защита · шаг 26 из 26</div><h2>Что дальше: изменение последовательности ДНК и продукт гена</h2><p class="lead">Закреплённое изменение передаётся при репликации. Влияет ли оно на работу клетки — отдельный вопрос. Ответ зависит от того, как последовательность ДНК используется: это тема следующих семинаров.</p><div class="note"><strong>Что показывает схема.</strong> Во второй молекуле пара C–G вместо T–A передаётся дальше при репликациях.</div><ol class="mech"><li>Если изменение находится в участке, который копируется в РНК, оно появится и в РНК.</li><li>Изменится ли белок, зависит от того, где изменение и что оно меняет: некоторые замены не меняют аминокислоту, другие меняют её или прерывают белок.</li><li>Многие изменения приходятся на участки, не кодирующие белок, и не нарушают работу клетки.</li><li>Поэтому мутацию определяет само устойчивое изменение последовательности, а не его последствия.</li></ol><p>В семинаре 9 — как ген читается (транскрипция) и как обрабатывается его РНК; там станет понятно, какие участки гена и как связаны с продуктом.</p><p>Ошибки при синтезе РНК тоже бывают, но не передаются потомкам клетки: молекула РНК не служит матрицей при репликации ДНК. Поэтому к точности синтеза РНК требования ниже, чем к точности репликации.</p><div class="static-quiz"><h3>Замена одного нуклеотида закрепилась в участке ДНК между генами и передаётся дочерним клеткам. Можно ли считать её мутацией?</h3><ol><li><b>А.</b> Нет: мутация — только изменение внутри гена <i>(неверный вариант)</i><br><span class="expl">Определение мутации не ограничено генами; изменение между генами тоже передаётся при репликации.</span></li><li><b>Б.</b> Да: это закреплённое изменение последовательности ДНК, которое передаётся при репликации <i>(верный вариант)</i><br><span class="expl">Мутацию определяет устойчивое изменение последовательности ДНК, а не то, в каком участке оно произошло и как отразилось на белке.</span></li><li><b>В.</b> Нет: такая замена будет исправлена при следующей репликации <i>(неверный вариант)</i><br><span class="expl">Закреплённое изменение системы репарации не узнают: обе цепи согласованы.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a> <a href="seminar-8.html#q3">Вопрос 3 →</a> <a href="seminar-8.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»</li></ul><p>Переход к следующему семинару; подробности — в семинарах 9–11.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S8-T01"><dt>Матрица</dt><dd>Цепь ДНК, по которой строится новая цепь: напротив каждого её основания встаёт комплементарный нуклеотид. При репликации матрицей служит каждая из двух родительских цепей; при репарации — неповреждённая цепь или неповреждённая копия участка.</dd></div><div id="ns-g-S8-T02"><dt>Новая (дочерняя) цепь ДНК</dt><dd>Цепь, которую ДНК-полимераза строит по матрице в направлении 5′→3′; она комплементарна и антипараллельна матрице.</dd></div><div id="ns-g-S8-T03"><dt>ДНК-полимераза</dt><dd>Фермент, который присоединяет нуклеотиды к 3′-OH растущей цепи по матрице. Полимеразы, копирующие основную часть генома (δ и ε), имеют корректирующую 3′→5′-экзонуклеазу; полимераза α, начинающая синтез, её не имеет.</dd></div><div id="ns-g-S8-T04"><dt>Корректирующая экзонуклеаза (коррекция 3′-конца)</dt><dd>Активность ДНК-полимеразы, отщепляющая нуклеотиды с 3′-конца растущей цепи в направлении 3′→5′. Неверно спаренный последний нуклеотид переходит в экзонуклеазный центр и удаляется, после чего синтез продолжается.</dd></div><div id="ns-g-S8-T05"><dt>Ошибочная пара (неправильно спаренные нуклеотиды)</dt><dd>Пара оснований, не соответствующая правилам комплементарности, например G·T, при том что оба основания химически не изменены. Возникает при ошибке выбора нуклеотида и искажает геометрию двойной спирали.</dd></div><div id="ns-g-S8-T06"><dt>Белок узнавания ошибочной пары (MutS)</dt><dd>Белок системы репарации ошибочно спаренных нуклеотидов, который связывается с ошибочной парой; у человека это комплексы MutSα и MutSβ. Название — по сходному белку бактерий.</dd></div><div id="ns-g-S8-T07"><dt>Репарация ошибочно спаренных нуклеотидов (MMR)</dt><dd>Система, которая после синтеза находит ошибочные пары, определяет новую цепь (у эукариот — по разрывам в ней), удаляет участок новой цепи с ошибкой и синтезирует его заново по матрице.</dd></div><div id="ns-g-S8-T08"><dt>Разрыв в одной цепи</dt><dd>Нарушение сахаро-фосфатного остова одной цепи при целой второй цепи; нуклеотиды не утрачены. Сшивается ДНК-лигазой. Разрывы в новой цепи служат меткой для MMR; как промежуточный продукт возникают в конце эксцизионной репарации.</dd></div><div id="ns-g-S8-T09"><dt>Мутация (закреплённое изменение последовательности)</dt><dd>Устойчивое изменение последовательности нуклеотидов ДНК: обе цепи согласованы, системы репарации его уже не узнают, и при репликации оно передаётся дочерним молекулам. Системы репарации его не узнают, потому что в нём нет ни повреждения, ни ошибочной пары.</dd></div><div id="ns-g-S8-T10"><dt>Урацил в ДНК</dt><dd>Основание, которое образуется в ДНК при отщеплении аминогруппы от цитозина (дезаминирование). Спаривается с аденином, поэтому, если его не удалить до репликации, в одной из дочерних молекул образуется пара U–A, а после следующей репликации — T–A вместо исходной C–G.</dd></div><div id="ns-g-S8-T11"><dt>ДНК-гликозилаза</dt><dd>Фермент, который узнаёт определённое изменённое основание (урацил, окисленное или алкилированное) и отщепляет его от сахара, оставляя AP-сайт. Начинает путь вырезания основания (BER).</dd></div><div id="ns-g-S8-T12"><dt>AP-сайт</dt><dd>Место в цепи ДНК, где нуклеотид лишён основания, а сахаро-фосфатный остов цел (апуриновый или апиримидиновый участок). Возникает самопроизвольно или после работы гликозилазы; узнаётся AP-эндонуклеазой.</dd></div><div id="ns-g-S8-T13"><dt>AP-эндонуклеаза</dt><dd>Фермент, который узнаёт AP-сайт и надрезает сахаро-фосфатный остов рядом с ним, подготавливая место для встраивания нового нуклеотида.</dd></div><div id="ns-g-S8-T14"><dt>Пиримидиновый димер</dt><dd>Два соседних пиримидина одной цепи (T–T, T–C или C–C), ковалентно связанные под действием ультрафиолета. Искажает двойную спираль и удаляется у человека путём вырезания нуклеотидов (NER).</dd></div><div id="ns-g-S8-T15"><dt>Белки узнавания NER (XPC, TFIIH)</dt><dd>Белки узнавания (среди них XPC) находят искажение двойной спирали в любом участке генома; комплекс TFIIH раскрывает участок и проверяет, есть ли в цепи повреждение. В транскрибируемых генах сигналом служит остановившаяся РНК-полимераза.</dd></div><div id="ns-g-S8-T16"><dt>Нуклеазы NER</dt><dd>Две нуклеазы, надрезающие повреждённую цепь по обе стороны от повреждения; участок около 30 нуклеотидов (у человека) удаляется целиком.</dd></div><div id="ns-g-S8-T17"><dt>Пробел в одной цепи</dt><dd>Участок, где нуклеотиды одной цепи удалены, а противоположная цепь не повреждена. Промежуточный продукт эксцизионной репарации: заполняется ДНК-полимеразой по противоположной цепи.</dd></div><div id="ns-g-S8-T19"><dt>ДНК-лигаза</dt><dd>Фермент, соединяющий 3′-OH одного нуклеотида с 5′-фосфатом соседнего, то есть сшивающий разрыв сахаро-фосфатного остова.</dd></div><div id="ns-g-S8-T21"><dt>Неповреждённая цепь</dt><dd>Цепь, комплементарная повреждённой; при эксцизионной репарации служит матрицей, поэтому исходная последовательность восстанавливается точно.</dd></div><div id="ns-g-S8-T23"><dt>Двуцепочечный разрыв</dt><dd>Разрыв обеих цепей ДНК в одном или близких местах; молекула разделяется на две части, а целой цепи-матрицы на месте разрыва нет. Возникает под действием ионизирующего излучения, некоторых веществ, при разрушении репликационной вилки.</dd></div><div id="ns-g-S8-T25"><dt>Сестринская хроматида</dt><dd>Копия хроматиды, образовавшаяся при репликации ДНК в S-фазе; до разделения в митозе содержит ту же последовательность и служит матрицей для гомологичной рекомбинации.</dd></div><div id="ns-g-S8-T26"><dt>Когезин</dt><dd>Белковый комплекс в форме кольца, который удерживает сестринские хроматиды вместе от репликации ДНК до анафазы митоза.</dd></div><div id="ns-g-S8-T28"><dt>Белки Ku</dt><dd>Белки Ku70 и Ku80; их комплекс кольцом охватывает каждый конец двуцепочечного разрыва и вместе с другими белками удерживает концы рядом; с него начинается негомологичное соединение концов (NHEJ).</dd></div><div id="ns-g-S8-T29"><dt>Лигаза IV</dt><dd>ДНК-лигаза пути NHEJ, сшивающая сведённые вместе концы двуцепочечного разрыва.</dd></div><div id="ns-g-S8-T30"><dt>Нуклеазы резекции</dt><dd>Нуклеазы, укорачивающие 5′-концы двуцепочечного разрыва, так что на обоих концах остаются одноцепочечные 3′-участки; первый этап гомологичной рекомбинации, идёт в основном в S и G2.</dd></div><div id="ns-g-S8-T31"><dt>RAD51</dt><dd>Белок, собирающийся на одноцепочечном 3′-конце разрыва и обеспечивающий поиск комплементарного участка в гомологичной молекуле и встраивание в неё конца.</dd></div><div id="ns-g-S8-T34"><dt>Теломера</dt><dd>Концевой участок линейной хромосомы из многих повторов TTAGGG (у человека — несколько тысяч пар нуклеотидов) вместе с защитными белками.</dd></div><div id="ns-g-S8-T35"><dt>G-цепь теломеры</dt><dd>Цепь теломеры из повторов TTAGGG, направленная 3′-концом к концу хромосомы; она длиннее комплементарной и образует 3′-выступ.</dd></div><div id="ns-g-S8-T37"><dt>3′-выступ (G-выступ)</dt><dd>Одноцепочечный 3′-конец G-цепи теломеры. Служит затравкой для теломеразы и в t-петле встраивается в двуцепочечную часть теломеры.</dd></div><div id="ns-g-S8-T38"><dt>Теломераза</dt><dd>Фермент из белков и РНК; его белок — обратная транскриптаза, синтезирующая ДНК по матрице из РНК теломеразы (эта РНК входит и в активный центр). Присоединяет повторы TTAGGG к 3′-концу G-цепи, используя dNTP. Активна в половых и многих стволовых клетках, в большинстве опухолей; в большинстве соматических клеток её активность низкая.</dd></div><div id="ns-g-S8-T39"><dt>РНК теломеразы</dt><dd>Молекула РНК в составе теломеразы; её участок комплементарен повтору теломеры и служит матрицей для синтеза ДНК.</dd></div><div id="ns-g-S8-T40"><dt>ДНК-полимераза α с праймазой</dt><dd>Комплекс, синтезирующий РНК-затравку и начальный участок ДНК. На теломере достраивает C-цепь по удлинённой G-цепи; к теломере его привлекает комплекс CST.</dd></div><div id="ns-g-S8-T41"><dt>Шелтерин</dt><dd>Комплекс из шести белков (TRF1, TRF2, RAP1, TIN2, TPP1, POT1), связанный с теломерными повторами. Защищает естественный конец хромосомы от узнавания как разрыв; TRF2 необходим для образования t-петли.</dd></div><div id="ns-g-S8-T42"><dt>t-петля</dt><dd>Структура конца теломеры, в которой 3′-выступ встроен в двуцепочечную часть теломеры. Конец хромосомы оказывается спрятан и не узнаётся белками, связывающими разрывы.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 8 · Сохранность генома: точность копирования ДНК, репарация повреждений и защита концов хромосом — объяснения","home_eyebrow":"Семинар 8 · самостоятельная подготовка","home_h1":"Сохранность генома:\nточность копирования, репарация и концы хромосом","home_lead":"Ошибка копирования, повреждение ДНК и мутация — разные события. От того, как клетка снижает число ошибок, — к тому, как она устраняет повреждения одной и обеих цепей и почему естественный конец хромосомы не принимается за разрыв.","start":"Начать с точности копирования →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"8 сценариев (по одному на каждый вопрос 1–4 на базовом и продвинутом уровне): предсказание, вмешательство и разбор каждого ответа. Пройдите их после объяснений раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 1.2.2, 12 ноября 2026 г. · Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} и
