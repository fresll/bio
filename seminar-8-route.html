не удержана рядом, концы соединены без матрицы; концы совместимы — последовательность как исходная.","s3a_cap_far_clean_z":"Тот же точный итог, что при гомологичной рекомбинации, получен другим путём.","s3a_cap_hom":"Матрицей послужила гомологичная хромосома от другого родителя. Разрыв устранён, утраченные нуклеотиды восстановлены — но по её последовательности: в позиции 7 теперь C–G, как у гомолога. Различие между двумя родительскими вариантами в этом месте утрачено.","s3a_cap_hom_z":"Гомологичная рекомбинация точно копирует матрицу, но матрица может отличаться от исходной последовательности. Такая утрата различия называется потерей гетерозиготности.","s3a_cap_mask":"Обратная задача: известно только, какой стала последовательность. Переключатели и информация о ядре скрыты.","s3a_cap_mask_z":"Подумайте, какими разными путями мог получиться такой результат.","s3a_take":"Способность восстановить целостность молекулы и способность восстановить исходную последовательность — разные свойства системы. Успешное соединение концов без матрицы возвращает целостность, а исходную последовательность — только при совместимых концах. Гомологичная рекомбинация восстанавливает утраченные нуклеотиды, но копирует матрицу: с сестринской хроматидой результат совпадает с исходным, с гомологичной хромосомой — с вариантом другого родителя. Поэтому по одному итогу нельзя доказать путь: точную последовательность дают и рекомбинация, и точное соединение совместимых концов.","s3a_lim":"Модель не показывает, как определяется путь репарации (это регулируемый процесс, который зависит от обработки концов и от периода цикла; подробно — в курсе «Молекулярная биология»). В клетке в G2 работают оба пути — и HR, и соединение концов; в модели при сестринской хроматиде рядом показана HR. Не показаны другие способы соединения концов, при которых утрачиваются более длинные участки, соединение концов разных хромосом и ошибки синтеза при самой рекомбинации. Различие в позиции 7 и утрата 4 пар — условный пример. Показаны только успешно завершившиеся варианты репарации: неудачная репарация, гибель клетки и другие пути в модели не учитываются.","s3a_new":"Сестринская хроматида полезна для репарации, когда находится рядом с разрывом. Белковый комплекс когезин удерживает сестринские хроматиды вместе от репликации до митоза и тем самым способствует рекомбинации именно между сёстрами, подавляя рекомбинацию с другими похожими участками генома. У дрожжей показано, что после разрыва когезин дополнительно накапливается у повреждённого участка; предполагают, что это укрепляет связь с сестринской хроматидой и облегчает точную гомологичную рекомбинацию.","s3a_how":"в клетках вызывали разрыв в известном месте и определяли, где связывается когезин и как часто разрыв устраняется по сестринской хроматиде; данные для дрожжей и клеток млекопитающих обобщены в обзоре. Роль накопления когезина у разрыва — предположение авторов, а не прямо измеренное следствие для клеток человека.","s3a_tl_note":"Порядок этапов — учебная модель. Положение хромосом в ядре и длины участков на схеме условные.","s3a_tl_1":"Разрыв обеих цепей в одной хроматиде: молекула разделена на две части.","s3a_tl_2_g1":"Источник информации: в G1 сестринской хроматиды нет — в модели концы соединяются без матрицы (NHEJ).","s3a_tl_2_near":"Источник информации: сестринская хроматида удержана рядом когезином; концы резецируются, и идёт поиск комплементарного участка на ней.","s3a_tl_2_far":"Источник информации: сестринская хроматида не удержана рядом — в модели HR не идёт, концы соединяются без матрицы (NHEJ).","s3a_tl_2_hom":"Источник информации: матрицей становится гомологичная хромосома другого родителя; концы резецируются, и конец спаривается с ней.","s3a_tl_3_clean":"Восстановление: совместимые концы сшиты напрямую, без утраты нуклеотидов.","s3a_tl_3_lost":"Восстановление: концы сшиты напрямую после удаления повреждённых нуклеотидов — утрачены 4 пары (число условное).","s3a_tl_3_sis":"Восстановление: ДНК-полимераза синтезирует участок по сестринской хроматиде.","s3a_tl_3_hom":"Восстановление: ДНК-полимераза синтезирует участок по гомологичной хромосоме — копируется её вариант последовательности.","s3a_tl_4_same":"Итог: целостность молекулы восстановлена, последовательность как исходная.","s3a_tl_4_del":"Итог: целостность молекулы восстановлена, но 4 пары нуклеотидов утрачены.","s3a_tl_4_hom":"Итог: целостность молекулы восстановлена, но в позиции 7 теперь вариант гомологичной хромосомы — пара C–G вместо T–A.","s3a_pB_an":"Б. Участок ДНК на месте разрыва"},"notes":["Участок восстановлен по сестринской хроматиде.","Концы соединены без матрицы: утрачено 4 пары."],"static":["Участок восстановлен по сестринской хроматиде."]}},"level":"adv"},{"id":"end-replication","section":3,"questions":[4],"title":"Почему конец линейной ДНК при репликации укорачивается","keywords":["проблема концевой репликации","затравка","отстающая цепь","3′-выступ"],"lead":["Уже известно: ДНК-полимераза лишь удлиняет имеющийся 3′-OH, а каждый фрагмент отстающей цепи начинается с РНК-затравки ([[https://fresll.github.io/bio/seminar-7-route.html#okazaki-maturation|вспомнить БИО-7·18]]).","Новое: у конца линейной молекулы это приводит к неполному копированию.","Раздел относится к вопросу 5 коллоквиума 2 (предварительный список) и вопросу 16 зачёта."],"mechanism":["У конца, где новой цепью становится C-цепь (её синтез идёт фрагментами), последнюю РНК-затравку отстающей цепи нельзя заменить ДНК: после её удаления перед участком нет 3′-OH, от которого полимераза могла бы начать синтез.","Одноцепочечный 3′-выступ G-цепи восстанавливается тем, что специальная нуклеаза укорачивает 5′-конец C-цепи.","В обоих случаях конец становится короче — на каждой репликации.","У бактерий с кольцевой ДНК этой проблемы нет: у кольца нет концов."],"paragraphs":["Пока укорачиваются повторы [[T34|теломер]], гены не затрагиваются. В клетках с низкой активностью теломеразы теломеры теряют, по оценке, приведённой в учебнике Alberts et al., 100–200 нуклеотидов за деление; в разных клетках и условиях измеряли от десятков до сотен нуклеотидов.","Почему укорачиваются оба конца хромосомы и чем различаются причины укорочения на двух концах — продвинутый шаг раздела.","Если изменить условие и рассмотреть кольцевую хромосому бактерии или митохондрии, укорочения при репликации не будет: на кольце нет последнего фрагмента без места для затравки."],"conditions":"Схема шага — модель вкладки 4: один повтор на схеме обозначает много повторов; показан конец, у которого новая цепь — C-цепь.","sources":["Alberts2022"],"quiz":{"id":"S8-L19","question":"Почему ДНК-полимераза не может достроить новую цепь до самого конца линейной молекулы?","options":[{"id":"S8-L19-1","text":"Она лишь удлиняет имеющийся 3′-OH, а для последнего участка нет затравки","correct":true,"feedback":"Начать цепь заново полимераза не может; последнюю РНК-затравку нельзя заменить ДНК."},{"id":"S8-L19-2","text":"У конца матрица разрушена","correct":false,"feedback":"Матрица не повреждена; дело в устройстве синтеза, а не в повреждении."},{"id":"S8-L19-3","text":"Полимераза синтезирует цепь в направлении 3′→5′","correct":false,"feedback":"Синтез идёт 5′→3′; поэтому новой цепи нужен 3′-OH, и без затравки начать участок нельзя."}]},"widget":{"kind":"dna","title":"","s":{"title":"Репликация конца без теломеразы","status":"Схема качественная · условные повторы","modes_label":"Что показать","modes":["теломеразы нет"],"scene":"s4b","args":[["off","yes","yes"]],"L":{"s4_tel":"Теломераза","s4_tel_off":"неактивна (как в большинстве соматических клеток)","s4_tel_on":"активна (как в половых и многих стволовых клетках)","s4_fill":"Достройка C-цепи после теломеразы","s4_fill_yes":"есть","s4_fill_no":"нет","s4_fnote":"Достраивать нечего: без теломеразы G-цепь не удлинена.","s4_shel":"Шелтерин (защитный белковый комплекс теломеры)","s4_shel_yes":"есть","s4_shel_no":"нет","s4_pA":"А. Конец хромосомы: G-цепь сверху, C-цепь снизу (условные повторы)","s4_lbl_before":"до репликации: G-цепь длиннее, 3′-выступ (рамка)","s4_lbl_after":"после репликации: новая C-цепь (светлая) у конца не достроена","s4_lbl_lost":"не скопировано","s4_lbl_notel":"теломеразы нет: двуцепочечная часть конца стала короче","s4_lbl_telfill":"теломераза удлинила G-цепь, C-цепь достроена","s4_lbl_telnofill":"теломераза удлинила G-цепь, C-цепь не достроена","s4_lbl_rna":"РНК-матрица","s4_e_tert":"теломераза","s4_pB":"Б. Распознаётся ли конец как разрыв","s4_lbl_shel":"овалы — шелтерин на повторах;\n3′-выступ встроен в двойную спираль (t-петля)","s4_lbl_prot":"конец защищён","s4_lbl_unprot":"конец открыт: его узнают как разрыв обеих цепей","s4_e_rec":"Ku (NHEJ)","s4_r_ds":"Двуцепочечная часть теломеры","s4_r_ds_s":"условные повторы: было {c0}","s4_v_ds_short":"{c} — короче на 1","s4_v_ds_same":"{c} — как до репликации","s4_r_over":"3′-выступ G-цепи","s4_r_over_s":"условные повторы: до репликации 3","s4_v_over":"{n}","s4_r_prot":"Конец распознаётся как разрыв","s4_v_prot_yes":"нет: защищён","s4_v_prot_no":"да: сигнал повреждения, возможно слияние концов","s4_cap_off_prot":"Новая цепь растёт только 5′→3′ от затравки. У этого конца новой цепью стала C-цепь: её последний фрагмент начинается с РНК-затравки, а напротив 3′-выступа затравки не синтезируются; после удаления затравки остаётся незаполненный участок. У другого конца новая G-цепь доходит до самого края, и чтобы снова образовался 3′-выступ, нуклеазы укорачивают 5′-конец C-цепи. В обоих случаях конец становится короче.","s4_cap_off_prot_z":"Укорочение следует из устройства ДНК-полимеразы: она лишь удлиняет имеющийся 3′-конец. Пока теряются повторы теломеры, гены не затрагиваются; но без теломеразы теломеры укорачиваются при каждом делении — в клетках человека в культуре на десятки–сотни нуклеотидов.","s4_cap_off_unprot":"Конец укоротился, как без теломеразы, а шелтерина нет: 3′-выступ не встроен в двойную спираль, и белки, узнающие разрывы, связываются с концом. Возникает ответ, как на разрыв обеих цепей; NHEJ может сшить концы разных хромосом.","s4_cap_off_unprot_z":"Защита конца не зависит от одной его длины: даже длинная теломера без шелтерина распознаётся как разрыв.","s4_cap_on_prot":"Теломераза узнаёт 3′-конец G-цепи, спаривает с ним свою РНК и по ней присоединяет к нему повторы TTAGGG, используя dNTP. Затем ДНК-полимераза α с праймазой достраивает C-цепь по удлинённой G-цепи. Двуцепочечная часть восстановлена до исходной длины, G-цепь удлинена, и 3′-выступ есть (его длина на схеме условная); шелтерин защищает конец.","s4_cap_on_prot_z":"Белок теломеразы — обратная транскриптаза: ДНК по РНК. Теломераза удлиняет только G-цепь; C-цепь достраивают обычные ферменты репликации. Высокая активность теломеразы — в половых и многих стволовых клетках; в большинстве соматических клеток она низкая.","s4_cap_on_unprot":"Длину конца теломераза восстановила, но шелтерина нет: конец открыт и распознаётся как разрыв обеих цепей.","s4_cap_on_unprot_z":"Поддержание длины и защита конца — разные функции: теломераза отвечает за первое, шелтерин — за второе.","s4_cap_nofill_prot":"Теломераза удлинила G-цепь, но C-цепь не достроена: длинный одноцепочечный 3′-выступ, а двуцепочечная часть такая же короткая, как без теломеразы.","s4_cap_nofill_prot_z":"Работа теломеразы восстанавливает длину только вместе с достройкой C-цепи: теломераза наращивает одну цепь, вторую синтезирует полимераза α с праймазой.","s4_cap_nofill_unprot":"Теломераза удлинила G-цепь, C-цепь не достроена, шелтерина нет: длинный одноцепочечный участок открыт и распознаётся как повреждение.","s4_cap_nofill_unprot_z":"Длинная одноцепочечная ДНК без защиты — сигнал повреждения для клетки (подробнее — в курсе «Молекулярная биология»)."},"notes":["Двуцепочечная часть конца стала короче на условный повтор."],"static":["Двуцепочечная часть конца стала короче на условный повтор."]}}},{"id":"telomere-cap","section":3,"questions":[4],"title":"Как устроена теломера и почему её конец не принимается за разрыв","keywords":["теломера","TTAGGG","шелтерин","t-петля","TRF2"],"lead":["Конец линейной хромосомы — конец двойной спирали, как у разрыва. Если бы его репарировали как разрыв, хромосомы сшивались бы концами.","Это вторая часть вопроса 5: защитная организация теломер."],"mechanism":["Теломера человека — тысячи пар нуклеотидов из повторов TTAGGG; [[T35|G-цепь]] длиннее и образует одноцепочечный [[T37|3′-выступ]].","С повторами связан [[T41|шелтерин]] — комплекс из шести белков; одни связывают двуцепочечные повторы, другие — одноцепочечный выступ.","Белок шелтерина TRF2 необходим, чтобы 3′-выступ встроился в двуцепочечную часть теломеры: образуется [[T42|t-петля]].","Считается, что в такой структуре конец недоступен белкам, узнающим разрывы: не включается сигнал повреждения и не работает NHEJ; t-петля — объяснение защиты, которое предлагают на основании наблюдений, а не прямо доказанный механизм."],"paragraphs":["Защита — свойство структуры конца, а не только его длины: без TRF2 даже длинная теломера узнаётся как разрыв, и концы хромосом сшиваются (продвинутый шаг раздела).","Конец хромосомы отличается от разрыва, таким образом, не формой ДНК (она одинакова), а связанными с ней белками и пространственной структурой.","t-петлю видели в электронном микроскопе на концах хромосом человека; её размер — тысячи пар нуклеотидов."],"conditions":"Схема шага — модель вкладки 4, панель Б.","sources":["Alberts2022","LimCech2021","Doksani2013"],"quiz":{"id":"S8-L20","question":"Что мешает клетке принять естественный конец хромосомы за разрыв?","options":[{"id":"S8-L20-1","text":"Особая последовательность концевых нуклеотидов, которую не узнаёт ни один белок","correct":false,"feedback":"Повторы сами по себе не защищают; защищают связанные с ними белки и структура конца."},{"id":"S8-L20-2","text":"Шелтерин и t-петля, в которой 3′-выступ спрятан в двойную спираль","correct":true,"feedback":"Считается, что белки разрывов не получают доступа к концу, и сигнал повреждения не включается."},{"id":"S8-L20-3","text":"Конец хромосомы химически отличается от конца разрыва","correct":false,"feedback":"Концы ДНК устроены одинаково; различие — в белках и структуре."}]},"widget":{"kind":"dna","title":"","s":{"title":"Защита конца","status":"Схема качественная · условные повторы","modes_label":"Что показать","modes":["шелтерин есть","шелтерина нет"],"scene":"s4b","args":[["on","yes","yes"],["on","yes","no"]],"L":{"s4_tel":"Теломераза","s4_tel_off":"неактивна (как в большинстве соматических клеток)","s4_tel_on":"активна (как в половых и многих стволовых клетках)","s4_fill":"Достройка C-цепи после теломеразы","s4_fill_yes":"есть","s4_fill_no":"нет","s4_fnote":"Достраивать нечего: без теломеразы G-цепь не удлинена.","s4_shel":"Шелтерин (защитный белковый комплекс теломеры)","s4_shel_yes":"есть","s4_shel_no":"нет","s4_pA":"А. Конец хромосомы: G-цепь сверху, C-цепь снизу (условные повторы)","s4_lbl_before":"до репликации: G-цепь длиннее, 3′-выступ (рамка)","s4_lbl_after":"после репликации: новая C-цепь (светлая) у конца не достроена","s4_lbl_lost":"не скопировано","s4_lbl_notel":"теломеразы нет: двуцепочечная часть конца стала короче","s4_lbl_telfill":"теломераза удлинила G-цепь, C-цепь достроена","s4_lbl_telnofill":"теломераза удлинила G-цепь, C-цепь не достроена","s4_lbl_rna":"РНК-матрица","s4_e_tert":"теломераза","s4_pB":"Б. Распознаётся ли конец как разрыв","s4_lbl_shel":"овалы — шелтерин на повторах;\n3′-выступ встроен в двойную спираль (t-петля)","s4_lbl_prot":"конец защищён","s4_lbl_unprot":"конец открыт: его узнают как разрыв обеих цепей","s4_e_rec":"Ku (NHEJ)","s4_r_ds":"Двуцепочечная часть теломеры","s4_r_ds_s":"условные повторы: было {c0}","s4_v_ds_short":"{c} — короче на 1","s4_v_ds_same":"{c} — как до репликации","s4_r_over":"3′-выступ G-цепи","s4_r_over_s":"условные повторы: до репликации 3","s4_v_over":"{n}","s4_r_prot":"Конец распознаётся как разрыв","s4_v_prot_yes":"нет: защищён","s4_v_prot_no":"да: сигнал повреждения, возможно слияние концов","s4_cap_off_prot":"Новая цепь растёт только 5′→3′ от затравки. У этого конца новой цепью стала C-цепь: её последний фрагмент начинается с РНК-затравки, а напротив 3′-выступа затравки не синтезируются; после удаления затравки остаётся незаполненный участок. У другого конца новая G-цепь доходит до самого края, и чтобы снова образовался 3′-выступ, нуклеазы укорачивают 5′-конец C-цепи. В обоих случаях конец становится короче.","s4_cap_off_prot_z":"Укорочение следует из устройства ДНК-полимеразы: она лишь удлиняет имеющийся 3′-конец. Пока теряются повторы теломеры, гены не затрагиваются; но без теломеразы теломеры укорачиваются при каждом делении — в клетках человека в культуре на десятки–сотни нуклеотидов.","s4_cap_off_unprot":"Конец укоротился, как без теломеразы, а шелтерина нет: 3′-выступ не встроен в двойную спираль, и белки, узнающие разрывы, связываются с концом. Возникает ответ, как на разрыв обеих цепей; NHEJ может сшить концы разных хромосом.","s4_cap_off_unprot_z":"Защита конца не зависит от одной его длины: даже длинная теломера без шелтерина распознаётся как разрыв.","s4_cap_on_prot":"Теломераза узнаёт 3′-конец G-цепи, спаривает с ним свою РНК и по ней присоединяет к нему повторы TTAGGG, используя dNTP. Затем ДНК-полимераза α с праймазой достраивает C-цепь по удлинённой G-цепи. Двуцепочечная часть восстановлена до исходной длины, G-цепь удлинена, и 3′-выступ есть (его длина на схеме условная); шелтерин защищает конец.","s4_cap_on_prot_z":"Белок теломеразы — обратная транскриптаза: ДНК по РНК. Теломераза удлиняет только G-цепь; C-цепь достраивают обычные ферменты репликации. Высокая активность теломеразы — в половых и многих стволовых клетках; в большинстве соматических клеток она низкая.","s4_cap_on_unprot":"Длину конца теломераза восстановила, но шелтерина нет: конец открыт и распознаётся как разрыв обеих цепей.","s4_cap_on_unprot_z":"Поддержание длины и защита конца — разные функции: теломераза отвечает за первое, шелтерин — за второе.","s4_cap_nofill_prot":"Теломераза удлинила G-цепь, но C-цепь не достроена: длинный одноцепочечный 3′-выступ, а двуцепочечная часть такая же короткая, как без теломеразы.","s4_cap_nofill_prot_z":"Работа теломеразы восстанавливает длину только вместе с достройкой C-цепи: теломераза наращивает одну цепь, вторую синтезирует полимераза α с праймазой.","s4_cap_nofill_unprot":"Теломераза удлинила G-цепь, C-цепь не достроена, шелтерина нет: длинный одноцепочечный участок открыт и распознаётся как повреждение.","s4_cap_nofill_unprot_z":"Длинная одноцепочечная ДНК без защиты — сигнал повреждения для клетки (подробнее — в курсе «Молекулярная биология»)."},"notes":["Конец защищён: 3′-выступ в t-петле.","Конец открыт и узнаётся как разрыв."],"static":["Конец защищён: 3′-выступ в t-петле."]}}},{"id":"telomerase","section":3,"questions":[4],"title":"Теломераза: ДНК по собственной РНК","keywords":["теломераза","обратная транскриптаза","РНК-матрица","C-цепь","полимераза α с праймазой"],"lead":["Укорочение можно возместить, если удлинить G-цепь. Это делает фермент [[T38|теломераза]].","Это третья часть вопроса 5: работа теломеразы."],"mechanism":["Теломераза — обратная транскриптаза: её белок синтезирует ДНК по матрице из [[T39|собственной РНК]].","Участок РНК теломеразы спаривается с концом G-цепи, и к её 3′-концу присоединяются нуклеотиды повтора TTAGGG; субстраты — обычные dNTP.","Фермент сдвигается к новому 3′-концу, и цикл повторяется — добавляются десятки повторов.","Удлинённая G-цепь служит матрицей для C-цепи, которую достраивают [[T40|ДНК-полимераза α с праймазой]]; 3′-выступ при этом сохраняется."],"paragraphs":["Теломераза удлиняет только одну цепь — G-цепь. Без достройки C-цепи растёт лишь одноцепочечный выступ, а двуцепочечная часть остаётся короткой.","Теломераза — пример переноса информации от РНК к ДНК в клетках человека: матрицей служит РНК, а продуктом — ДНК.","Высокая активность теломеразы — в половых клетках и многих стволовых клетках, а также примерно в 90 % опухолевых клеток; в большинстве соматических клеток она низкая. Если ввести активный ген теломеразы в фибробласты человека в культуре, теломеры перестают укорачиваться, и многие клетки продолжают делиться неограниченно."],"conditions":"Схема шага — модель вкладки 4. Числа — по учебнику Alberts et al. для клеток человека в культуре и опухолей.","sources":["Alberts2022","LimCech2021"],"quiz":{"id":"S8-L21","question":"Какую цепь удлиняет теломераза и что служит ей матрицей?","options":[{"id":"S8-L21-1","text":"5′-конец C-цепи; матрица — G-цепь","correct":false,"feedback":"C-цепь достраивают полимераза α с праймазой; теломераза удлиняет G-цепь."},{"id":"S8-L21-2","text":"Обе цепи; матрица — повторы соседней хромосомы","correct":false,"feedback":"Теломераза не использует ДНК-матрицу: её матрица — собственная РНК."},{"id":"S8-L21-3","text":"3′-конец G-цепи; матрица — РНК в составе самой теломеразы","correct":true,"feedback":"Теломераза — обратная транскриптаза: ДНК по собственной РНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Работа теломеразы","status":"Схема качественная · условные повторы","modes_label":"Что показать","modes":["теломераза и достройка C-цепи","теломераза без достройки"],"scene":"s4b","args":[["on","yes","yes"],["on","no","yes"]],"L":{"s4_tel":"Теломераза","s4_tel_off":"неактивна (как в большинстве соматических клеток)","s4_tel_on":"активна (как в половых и многих стволовых клетках)","s4_fill":"Достройка C-цепи после теломеразы","s4_fill_yes":"есть","s4_fill_no":"нет","s4_fnote":"Достраивать нечего: без теломеразы G-цепь не удлинена.","s4_shel":"Шелтерин (защитный белковый комплекс теломеры)","s4_shel_yes":"есть","s4_shel_no":"нет","s4_pA":"А. Конец хромосомы: G-цепь сверху, C-цепь снизу (условные повторы)","s4_lbl_before":"до репликации: G-цепь длиннее, 3′-выступ (рамка)","s4_lbl_after":"после репликации: новая C-цепь (светлая) у конца не достроена","s4_lbl_lost":"не скопировано","s4_lbl_notel":"теломеразы нет: двуцепочечная часть конца стала короче","s4_lbl_telfill":"теломераза удлинила G-цепь, C-цепь достроена","s4_lbl_telnofill":"теломераза удлинила G-цепь, C-цепь не достроена","s4_lbl_rna":"РНК-матрица","s4_e_tert":"теломераза","s4_pB":"Б. Распознаётся ли конец как разрыв","s4_lbl_shel":"овалы — шелтерин на повторах;\n3′-выступ встроен в двойную спираль (t-петля)","s4_lbl_prot":"конец защищён","s4_lbl_unprot":"конец открыт: его узнают как разрыв обеих цепей","s4_e_rec":"Ku (NHEJ)","s4_r_ds":"Двуцепочечная часть теломеры","s4_r_ds_s":"условные повторы: было {c0}","s4_v_ds_short":"{c} — короче на 1","s4_v_ds_same":"{c} — как до репликации","s4_r_over":"3′-выступ G-цепи","s4_r_over_s":"условные повторы: до репликации 3","s4_v_over":"{n}","s4_r_prot":"Конец распознаётся как разрыв","s4_v_prot_yes":"нет: защищён","s4_v_prot_no":"да: сигнал повреждения, возможно слияние концов","s4_cap_off_prot":"Новая цепь растёт только 5′→3′ от затравки. У этого конца новой цепью стала C-цепь: её последний фрагмент начинается с РНК-затравки, а напротив 3′-выступа затравки не синтезируются; после удаления затравки остаётся незаполненный участок. У другого конца новая G-цепь доходит до самого края, и чтобы снова образовался 3′-выступ, нуклеазы укорачивают 5′-конец C-цепи. В обоих случаях конец становится короче.","s4_cap_off_prot_z":"Укорочение следует из устройства ДНК-полимеразы: она лишь удлиняет имеющийся 3′-конец. Пока теряются повторы теломеры, гены не затрагиваются; но без теломеразы теломеры укорачиваются при каждом делении — в клетках человека в культуре на десятки–сотни нуклеотидов.","s4_cap_off_unprot":"Конец укоротился, как без теломеразы, а шелтерина нет: 3′-выступ не встроен в двойную спираль, и белки, узнающие разрывы, связываются с концом. Возникает ответ, как на разрыв обеих цепей; NHEJ может сшить концы разных хромосом.","s4_cap_off_unprot_z":"Защита конца не зависит от одной его длины: даже длинная теломера без шелтерина распознаётся как разрыв.","s4_cap_on_prot":"Теломераза узнаёт 3′-конец G-цепи, спаривает с ним свою РНК и по ней присоединяет к нему повторы TTAGGG, используя dNTP. Затем ДНК-полимераза α с праймазой достраивает C-цепь по удлинённой G-цепи. Двуцепочечная часть восстановлена до исходной длины, G-цепь удлинена, и 3′-выступ есть (его длина на схеме условная); шелтерин защищает конец.","s4_cap_on_prot_z":"Белок теломеразы — обратная транскриптаза: ДНК по РНК. Теломераза удлиняет только G-цепь; C-цепь достраивают обычные ферменты репликации. Высокая активность теломеразы — в половых и многих стволовых клетках; в большинстве соматических клеток она низкая.","s4_cap_on_unprot":"Длину конца теломераза восстановила, но шелтерина нет: конец открыт и распознаётся как разрыв обеих цепей.","s4_cap_on_unprot_z":"Поддержание длины и защита конца — разные функции: теломераза отвечает за первое, шелтерин — за второе.","s4_cap_nofill_prot":"Теломераза удлинила G-цепь, но C-цепь не достроена: длинный одноцепочечный 3′-выступ, а двуцепочечная часть такая же короткая, как без теломеразы.","s4_cap_nofill_prot_z":"Работа теломеразы восстанавливает длину только вместе с достройкой C-цепи: теломераза наращивает одну цепь, вторую синтезирует полимераза α с праймазой.","s4_cap_nofill_unprot":"Теломераза удлинила G-цепь, C-цепь не достроена, шелтерина нет: длинный одноцепочечный участок открыт и распознаётся как повреждение.","s4_cap_nofill_unprot_z":"Длинная одноцепочечная ДНК без защиты — сигнал повреждения для клетки (подробнее — в курсе «Молекулярная биология»)."},"notes":["Длина восстановлена: G-цепь удлинена, C-цепь достроена.","G-цепь удлинена, C-цепь не достроена: длинный выступ."],"static":["Длина восстановлена: G-цепь удлинена, C-цепь достроена."]}}},{"id":"shortening","section":3,"questions":[4],"title":"Укорочение теломер при делениях и предел числа делений","keywords":["укорочение теломер","остановка делений","сенесценция","соматические клетки"],"lead":["Без теломеразы потери накапливаются с каждым делением.","Что происходит, когда теломеры становятся очень короткими?"],"mechanism":["В большинстве соматических клеток человека теломеразы мало, и теломеры при каждом делении укорачиваются.","Когда теломеры становятся критически короткими, их защита утрачивается, и концы узнаются как разрывы.","В клетках с сохранными контрольными системами сигнал повреждения обычно приводит к стойкой остановке делений — репликативной сенесценции; клетка при этом остаётся живой. Возможны и другие исходы: гибель клетки или, если контрольные системы нарушены, продолжение делений с нестабильностью хромосом.","Фибробласты человека в культуре, по оценке, приведённой в учебнике Alberts et al., делятся около 60 раз, прежде чем прекращают деления."],"paragraphs":["Число возможных делений зависит от типа клеток, исходной длины теломер и условий; это не постоянная величина.","Ограничение числа делений можно рассматривать как защиту от неограниченного размножения изменённых клеток. Но не все клетки с короткими теломерами прекращают деление: некоторые становятся генетически нестабильными, и среди них может возникнуть клетка с вновь включённой теломеразой.","Предполагают, что такое ограничение числа делений может вносить вклад в старение организма; это гипотеза, а не установленная причина. Механизм остановки делений и её последствия для ткани — в курсе «Молекулярная биология»."],"conditions":"Число делений — оценка из учебника Alberts et al. для фибробластов человека в культуре.","sources":["Alberts2022"],"quiz":{"id":"S8-L22","question":"Что обычно происходит с соматической клеткой с сохранными контрольными системами, когда её теломеры становятся критически короткими?","options":[{"id":"S8-L22-1","text":"Концы узнаются как разрывы, и клетка, как правило, стойко прекращает деления, оставаясь живой","correct":true,"feedback":"Это репликативная сенесценция — типичный исход, например у фибробластов в культуре; она не равна гибели клетки. Возможны и другие исходы: гибель клетки или, при нарушенных контрольных системах, продолжение делений с нестабильностью хромосом."},{"id":"S8-L22-2","text":"Клетка сразу погибает","correct":false,"feedback":"Гибель возможна, но это не типичный исход: остановка делений и гибель — разные исходы, и при укорочении теломер в культуре обычно наблюдают остановку делений."},{"id":"S8-L22-3","text":"Клетка включает теломеразу и продолжает делиться","correct":false,"feedback":"В большинстве соматических клеток теломераза не включается; её включение — редкое событие, характерное для опухолевых клеток."}]},"widget":{"kind":"dna","title":"","s":{"title":"Длина теломеры при делениях (модель)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["0 делений","40 делений","50 делений"],"scene":"a4","args":[["tel","off","0"],["tel","off","40"],["tel","off","50"]],"L":{"s4a_prob":"Естественный конец хромосомы устроен как конец разорванной двойной спирали, но в норме его не узнают как разрыв. Длина теломеры и её защита — одно свойство или два разных? Достаточно ли измерить длину, чтобы судить о защите?","s4a_end":"Конец молекулы ДНК","s4a_end_tel":"теломера с шелтерином","s4a_end_notrf2":"теломера без TRF2","s4a_end_dsb":"внутренний разрыв","s4a_tert":"Теломераза","s4a_tert_off":"неактивна","s4a_tert_on":"активна","s4a_tnote":"В модели теломераза действует только на теломеры.","s4a_div":"Делений клетки","s4a_div_0":"0","s4a_div_20":"20","s4a_div_40":"40","s4a_div_50":"50","s4a_note":"Условные значения модели: начальная длина 6 000 нуклеотидов, потеря 100 нуклеотидов за деление без теломеразы, порог защиты 1 500. Это не измерения и не клинические пороги.","s4a_pA":"А. Длина теломеры при делениях (условные нуклеотиды)","s4a_ax_x":"число делений","s4a_ax_y":"длина теломеры","s4a_thr":"порог защиты в модели","s4a_lbl_nodata":"внутренний разрыв: теломерных повторов нет","s4a_lbl_noobs":"состояние конца не наблюдали: известна только длина","s4a_pB":"Б. Состояние конца","s4a_st_prot":"конец защищён:\nне узнаётся как разрыв","s4a_st_short":"теломера критически\nкороткая: защита утрачена","s4a_st_notrf2":"без TRF2 конец открыт","s4a_st_dsb":"настоящий разрыв:\nего узнают и репарируют","s4a_st_broke":"конец узнаётся\nкак разрыв","s4a_e_rec":"Ku (разрыв)","s4a_r_len":"Длина теломеры","s4a_r_len_s":"условные нуклеотиды","s4a_v_len":"{n}","s4a_v_len_na":"теломеры нет","s4a_r_prot":"Конец защищён","s4a_v_prot_yes":"да","s4a_v_prot_no":"нет: узнаётся как разрыв","s4a_r_cause":"Почему","s4a_v_cause_ok":"шелтерин на месте, длина выше порога","s4a_v_cause_short":"длина ниже порога модели","s4a_v_cause_notrf2":"нет TRF2 — белка, необходимого для t-петли","s4a_v_cause_dsb":"это не теломера","s4a_cap_ok_off":"Теломера с шелтерином после {d} делений без теломеразы: длина {n}, выше порога модели. Конец укорачивается, но остаётся защищённым.","s4a_cap_ok_off_z":"Укорочение само по себе не равно утрате защиты: пока повторов достаточно для защитной структуры, конец не узнаётся как разрыв.","s4a_cap_ok_on":"Теломераза возмещает потери при каждом делении: длина {n} сохраняется, конец защищён.","s4a_cap_ok_on_z":"Теломераза поддерживает длину; защиту обеспечивает шелтерин. В клетках с активной теломеразой укорочение не накапливается.","s4a_cap_short":"После {d} делений без теломеразы длина теломеры {n} — ниже порога модели (1 500): защитная структура не удерживается, конец узнаётся как разрыв. Модель не учитывает, что в клетке укорочение ниже порога останавливает деления раньше: здесь считается только длина.","s4a_cap_short_z":"Утрата защиты при укорочении — следствие длины; в модели это происходит только ниже порога, а не при любом укорочении.","s4a_cap_notrf2":"Длина теломеры {n}, но белка TRF2 нет: t-петли не образуются, и конец узнаётся как разрыв при любой длине. NHEJ может сшить такие концы разных хромосом.","s4a_cap_notrf2_z":"Защита зависит от белков шелтерина, а не только от длины: длинная теломера без TRF2 не защищена.","s4a_cap_dsb":"Внутренний разрыв обеих цепей: теломерных повторов и шелтерина здесь нет, и концы узнаются как разрыв — его устраняют пути вопроса 3.","s4a_cap_dsb_z":"Геометрически конец разрыва и конец хромосомы похожи; различает их белковая структура, которая есть только на теломере.","s4a_cap_mask":"Обратная задача: видно наблюдение, условия скрыты.","s4a_cap_mask_z":"Отделите то, что известно о длине, от того, что известно о защите.","s4a_take":"Длина теломеры и защита конца — разные свойства. Длину уменьшает неполная репликация концов и поддерживает теломераза; защиту обеспечивают белки шелтерина (считается, что в t-петле, для образования которой необходим TRF2, конец недоступен белкам, узнающим разрывы). Короткая теломера может ещё быть защищена, а длинная без TRF2 — нет. Поэтому одного измерения длины недостаточно, чтобы судить о защите: нужно наблюдать сам признак — узнаётся ли конец как разрыв.","s4a_lim":"У каждой хромосомы два конца, и длина теломер у них различается; утрата защиты наступает на самой короткой теломере, а средняя длина этого не показывает. Порог 1 500, начальная длина 6 000 и потеря 100 нуклеотидов за деление — условные значения; в клетках человека они зависят от типа клеток и условий. Модель не показывает переходных состояний (сигнал повреждения на теломере без слияния концов), регуляции теломеразы шелтерином и того, что сигнал от короткой теломеры может вести к остановке делений или к гибели клетки — это темы курса «Молекулярная биология».","s4a_new":"Концы хромосом при репликации укорачиваются по двум причинам, а не по одной. У конца, где G-цепь служит матрицей для отстающей цепи, синтез новой C-цепи останавливается, не дойдя до края, так как затравки на 3′-выступе не синтезируются. У другого конца для образования 3′-выступа укорачивается 5′-конец C-цепи. В клетках опухолевой линии человека без комплекса CST, который достраивает C-цепь, она укорачивалась примерно на 50–60 нуклеотидов за репликацию у первого конца и примерно на 100 — у второго. Теломераза удлиняет только G-цепь, поэтому C-цепь поддерживается отдельным ферментом — полимеразой α с праймазой. В модели этой вкладки укорочение задано одним средним числом за деление; на самом деле два конца хромосомы укорачиваются по-разному, и защиту первой теряет самая короткая теломера.","s4a_how":"в клетках опухолевой линии человека выключали белок комплекса CST и измеряли длину каждой из двух цепей теломер по отдельности на концах разных типов; в пробирке собирали репликацию из очищенных белков пекарских дрожжей — что реплисома человека ведёт себя так же, авторы предполагают по сходству строения. Числа получены в одной линии клеток и на другие клетки не переносятся.","s4a_tl_note":"Порядок этапов — учебная модель. Длины, потеря за деление и порог условные; прекращение делений модель не показывает.","s4a_tl_1_off":"Деления: без теломеразы теломера в модели укорачивается на 100 условных нуклеотидов за деление.","s4a_tl_1_on":"Деления: активная теломераза восполняет потерю — в модели длина теломеры не меняется.","s4a_tl_1_dsb":"Деления: у внутреннего разрыва теломерных повторов нет — длины в модели нет.","s4a_tl_2_ok":"Состояние конца: шелтерин на месте, длина выше порога модели — конец защищён.","s4a_tl_2_short":"Состояние конца: длина опустилась ниже порога модели — конец узнаётся как разрыв. Прекращение делений модель не показывает.","s4a_tl_2_notrf2":"Состояние конца: без TRF2 конец узнаётся как разрыв при любой длине.","s4a_tl_2_dsb":"Состояние конца: настоящий разрыв узнаётся белками разрыва и репарируется.","s4a_u_div":"","s4a_rx_note":"Бегунок переходит только по засечкам 0, 20, 40 и 50 делений — это положения модели. Порог условный: в клетке защита утрачивается не на определённом делении, а сначала на самой короткой теломере."},"notes":["Исходная длина; конец защищён.","Теломера короче, но выше порога модели: конец защищён.","Ниже порога модели: конец узнаётся как разрыв."],"static":["Исходная длина; конец защищён."]}}},{"id":"two-end-problems","section":3,"questions":[4],"title":"Не одна, а две проблемы концевой репликации","keywords":["C-цепь","G-цепь","CST","полимераза α с праймазой","резекция"],"lead":["Уже известно: при репликации конец линейной ДНК укорачивается (БИО-8·19).","Новое: укорачиваются оба конца хромосомы, и причины у них разные."],"mechanism":["У конца, где G-цепь служит матрицей для отстающей цепи, синтез новой C-цепи останавливается, не дойдя до края: на 3′-выступе затравки не синтезируются.","У конца, где новая G-цепь синтезируется непрерывно, она доходит до края, и для образования 3′-выступа нуклеазы укорачивают 5′-конец C-цепи.","В обоих случаях укорачивается C-цепь; теломераза удлиняет только G-цепь и эту потерю не возмещает.","C-цепь достраивают полимераза α с праймазой, которые привлекает к теломере комплекс CST."],"paragraphs":["В клетках опухолевой линии человека без комплекса CST C-цепь укорачивалась примерно на 50–60 нуклеотидов за репликацию у первого конца и примерно на 100 нуклеотидов — у второго; в среднем около 76 нуклеотидов. В пробирке синтез отстающей цепи останавливался в зоне шириной около 150 нуклеотидов, не ближе 26 нуклеотидов от конца матрицы.","Отсюда следует, что поддержание теломер требует двух ферментов: теломераза поддерживает G-цепь, а полимераза α с праймазой — C-цепь.","Как это узнали: в клетках выключали белок комплекса CST и измеряли длину каждой из двух цепей теломер по отдельности на концах разных типов; в пробирке собирали репликацию из очищенных белков пекарских дрожжей — что реплисома человека ведёт себя так же, авторы предполагают по сходству строения. Числа получены в одной линии клеток и в общем виде на другие клетки не переносятся.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Линия опухолевых клеток человека (HCT116) с выключенным CST; репликация в бесклеточной системе из очищенных белков пекарских дрожжей (перенос на клетки человека — допущение авторов).","sources":["Takai2024"],"quiz":{"id":"S8-L23","question":"Почему теломераза не может одна полностью возместить укорочение теломер?","options":[{"id":"S8-L23-1","text":"Она работает только в G1","correct":false,"feedback":"Дело не в периоде цикла, а в том, какую цепь она удлиняет."},{"id":"S8-L23-2","text":"Она удлиняет только G-цепь, а C-цепь достраивают другие ферменты","correct":true,"feedback":"Без достройки C-цепи растёт лишь одноцепочечный выступ; двуцепочечная часть не восстанавливается."},{"id":"S8-L23-3","text":"Её РНК-матрица слишком короткая","correct":false,"feedback":"Теломераза многократно повторяет цикл; ограничение — в одной удлиняемой цепи."}]},"widget":{"kind":"dna","title":"","s":{"title":"Теломераза без достройки C-цепи","status":"Схема качественная · условные повторы","modes_label":"Что показать","modes":["с достройкой","без достройки"],"scene":"s4b","args":[["on","yes","yes"],["on","no","yes"]],"L":{"s4_tel":"Теломераза","s4_tel_off":"неактивна (как в большинстве соматических клеток)","s4_tel_on":"активна (как в половых и многих стволовых клетках)","s4_fill":"Достройка C-цепи после теломеразы","s4_fill_yes":"есть","s4_fill_no":"нет","s4_fnote":"Достраивать нечего: без теломеразы G-цепь не удлинена.","s4_shel":"Шелтерин (защитный белковый комплекс теломеры)","s4_shel_yes":"есть","s4_shel_no":"нет","s4_pA":"А. Конец хромосомы: G-цепь сверху, C-цепь снизу (условные повторы)","s4_lbl_before":"до репликации: G-цепь длиннее, 3′-выступ (рамка)","s4_lbl_after":"после репликации: новая C-цепь (светлая) у конца не достроена","s4_lbl_lost":"не скопировано","s4_lbl_notel":"теломеразы нет: двуцепочечная часть конца стала короче","s4_lbl_telfill":"теломераза удлинила G-цепь, C-цепь достроена","s4_lbl_telnofill":"теломераза удлинила G-цепь, C-цепь не достроена","s4_lbl_rna":"РНК-матрица","s4_e_tert":"теломераза","s4_pB":"Б. Распознаётся ли конец как разрыв","s4_lbl_shel":"овалы — шелтерин на повторах;\n3′-выступ встроен в двойную спираль (t-петля)","s4_lbl_prot":"конец защищён","s4_lbl_unprot":"конец открыт: его узнают как разрыв обеих цепей","s4_e_rec":"Ku (NHEJ)","s4_r_ds":"Двуцепочечная часть теломеры","s4_r_ds_s":"условные повторы: было {c0}","s4_v_ds_short":"{c} — короче на 1","s4_v_ds_same":"{c} — как до репликации","s4_r_over":"3′-выступ G-цепи","s4_r_over_s":"условные повторы: до репликации 3","s4_v_over":"{n}","s4_r_prot":"Конец распознаётся как разрыв","s4_v_prot_yes":"нет: защищён","s4_v_prot_no":"да: сигнал повреждения, возможно слияние концов","s4_cap_off_prot":"Новая цепь растёт только 5′→3′ от затравки. У этого конца новой цепью стала C-цепь: её последний фрагмент начинается с РНК-затравки, а напротив 3′-выступа затравки не синтезируются; после удаления затравки остаётся незаполненный участок. У другого конца новая G-цепь доходит до самого края, и чтобы снова образовался 3′-выступ, нуклеазы укорачивают 5′-конец C-цепи. В обоих случаях конец становится короче.","s4_cap_off_prot_z":"Укорочение следует из устройства ДНК-полимеразы: она лишь удлиняет имеющийся 3′-конец. Пока теряются повторы теломеры, гены не затрагиваются; но без теломеразы теломеры укорачиваются при каждом делении — в клетках человека в культуре на десятки–сотни нуклеотидов.","s4_cap_off_unprot":"Конец укоротился, как без теломеразы, а шелтерина нет: 3′-выступ не встроен в двойную спираль, и белки, узнающие разрывы, связываются с концом. Возникает ответ, как на разрыв обеих цепей; NHEJ может сшить концы разных хромосом.","s4_cap_off_unprot_z":"Защита конца не зависит от одной его длины: даже длинная теломера без шелтерина распознаётся как разрыв.","s4_cap_on_prot":"Теломераза узнаёт 3′-конец G-цепи, спаривает с ним свою РНК и по ней присоединяет к нему повторы TTAGGG, используя dNTP. Затем ДНК-полимераза α с праймазой достраивает C-цепь по удлинённой G-цепи. Двуцепочечная часть восстановлена до исходной длины, G-цепь удлинена, и 3′-выступ есть (его длина на схеме условная); шелтерин защищает конец.","s4_cap_on_prot_z":"Белок теломеразы — обратная транскриптаза: ДНК по РНК. Теломераза удлиняет только G-цепь; C-цепь достраивают обычные ферменты репликации. Высокая активность теломеразы — в половых и многих стволовых клетках; в большинстве соматических клеток она низкая.","s4_cap_on_unprot":"Длину конца теломераза восстановила, но шелтерина нет: конец открыт и распознаётся как разрыв обеих цепей.","s4_cap_on_unprot_z":"Поддержание длины и защита конца — разные функции: теломераза отвечает за первое, шелтерин — за второе.","s4_cap_nofill_prot":"Теломераза удлинила G-цепь, но C-цепь не достроена: длинный одноцепочечный 3′-выступ, а двуцепочечная часть такая же короткая, как без теломеразы.","s4_cap_nofill_prot_z":"Работа теломеразы восстанавливает длину только вместе с достройкой C-цепи: теломераза наращивает одну цепь, вторую синтезирует полимераза α с праймазой.","s4_cap_nofill_unprot":"Теломераза удлинила G-цепь, C-цепь не достроена, шелтерина нет: длинный одноцепочечный участок открыт и распознаётся как повреждение.","s4_cap_nofill_unprot_z":"Длинная одноцепочечная ДНК без защиты — сигнал повреждения для клетки (подробнее — в курсе «Молекулярная биология»)."},"notes":["Длина восстановлена.","C-цепь не достроена: двуцепочечная часть короткая."],"static":["Длина восстановлена."]}},"level":"adv"},{"id":"protection-vs-length","section":3,"questions":[4],"title":"Защита конца и длина теломеры — разные свойства","keywords":["защита конца","длина теломер","TRF2","обратная задача"],"lead":["Уже известно: критически короткая теломера теряет защиту (БИО-8·22), а шелтерин образует t-петлю (БИО-8·20).","Новое: защита может быть утрачена и при нормальной длине, а короткая теломера может быть ещё защищена."],"mechanism":["В клетках мыши удаление TRF2 приводило к включению сигнала повреждения на концах и частому сшиванию концов хромосом путём NHEJ; чтобы подсчитать t-петли, сшивание подавляли, удаляя лигазу IV, — без TRF2 t-петель становилось намного меньше.","Удаление других белков шелтерина (TRF1, RAP1, POT1) t-петли не разрушало.","Значит, TRF2 необходим и для t-петли, и для защиты конца; это согласуется с защитной ролью t-петли. Защита зависит от белков шелтерина, а не от длины повторов самой по себе.","Обратная задача: уменьшение длины ещё не доказывает утрату защиты; нужно наблюдать признак защиты — узнаётся ли конец как разрыв."],"paragraphs":["В модели продвинутого уровня длина и защита изменяются раздельно: теломера с шелтерином после 40 делений короче, но защищена; теломера без TRF2 при исходной длине не защищена; внутренний разрыв узнаётся как разрыв всегда.","Средняя длина теломер не показывает самую короткую теломеру, а защиту теряет именно она. Поэтому одно среднее значение длины — слабое основание для вывода о защите концов.","Как это узнали: в клетках мыши выключали по одному белку шелтерина и рассматривали концы хромосом микроскопом высокого разрешения, подсчитывая t-петли и сшитые концы. Работа показывает необходимость TRF2 для t-петли в этих клетках; другие механизмы защиты она не исключает.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Клетки мыши (эмбриональные фибробласты); теломеры мыши длиннее человеческих. Значения модели — условные.","sources":["Doksani2013","Alberts2022"],"quiz":{"id":"S8-L24","question":"Средняя длина теломер в культуре клеток уменьшилась на треть; других измерений нет. Какой вывод допустим?","options":[{"id":"S8-L24-1","text":"Концы хромосом утратили защиту","correct":false,"feedback":"Укороченная теломера может быть ещё защищена; вывод требует наблюдения самой защиты."},{"id":"S8-L24-2","text":"В клетках нет активной теломеразы","correct":false,"feedback":"Теломеры укорачиваются и при низкой активности теломеразы, недостаточной для возмещения потерь (так у фибробластов человека); активность фермента нужно измерять отдельно."},{"id":"S8-L24-3","text":"По одному уменьшению средней длины нельзя определить ни активность теломеразы, ни защиту концов: нужны дополнительные измерения","correct":true,"feedback":"Укорочение согласуется и с отсутствием теломеразы, и с её низкой активностью, которой не хватает, чтобы возместить потери (так у фибробластов человека); могла измениться и доля разных клеток в культуре. Нужно отдельно измерить активность теломеразы, распределение длин (самые короткие теломеры) и узнаются ли концы как разрывы."}],"rev":2},"widget":{"kind":"dna","title":"","s":{"title":"Длина и защита раздельно (модель)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["с шелтерином, 20 делений","без TRF2, 0 делений","внутренний разрыв"],"scene":"a4","args":[["tel","off","20"],["notrf2","off","0"],["dsb","off","0"]],"L":{"s4a_prob":"Естественный конец хромосомы устроен как конец разорванной двойной спирали, но в норме его не узнают как разрыв. Длина теломеры и её защита — одно свойство или два разных? Достаточно ли измерить длину, чтобы судить о защите?","s4a_end":"Конец молекулы ДНК","s4a_end_tel":"теломера с шелтерином","s4a_end_notrf2":"теломера без TRF2","s4a_end_dsb":"внутренний разрыв","s4a_tert":"Теломераза","s4a_tert_off":"неактивна","s4a_tert_on":"активна","s4a_tnote":"В модели теломераза действует только на теломеры.","s4a_div":"Делений клетки","s4a_div_0":"0","s4a_div_20":"20","s4a_div_40":"40","s4a_div_50":"50","s4a_note":"Условные значения модели: начальная длина 6 000 нуклеотидов, потеря 100 нуклеотидов за деление без теломеразы, порог защиты 1 500. Это не измерения и не клинические пороги.","s4a_pA":"А. Длина теломеры при делениях (условные нуклеотиды)","s4a_ax_x":"число делений","s4a_ax_y":"длина теломеры","s4a_thr":"порог защиты в модели","s4a_lbl_nodata":"внутренний разрыв: теломерных повторов нет","s4a_lbl_noobs":"состояние конца не наблюдали: известна только длина","s4a_pB":"Б. Состояние конца","s4a_st_prot":"конец защищён:\nне узнаётся как разрыв","s4a_st_short":"теломера критически\nкороткая: защита утрачена","s4a_st_notrf2":"без TRF2 конец открыт","s4a_st_dsb":"настоящий разрыв:\nего узнают и репарируют","s4a_st_broke":"конец узнаётся\nкак разрыв","s4a_e_rec":"Ku (разрыв)","s4a_r_len":"Длина теломеры","s4a_r_len_s":"условные нуклеотиды","s4a_v_len":"{n}","s4a_v_len_na":"теломеры нет","s4a_r_prot":"Конец защищён","s4a_v_prot_yes":"да","s4a_v_prot_no":"нет: узнаётся как разрыв","s4a_r_cause":"Почему","s4a_v_cause_ok":"шелтерин на месте, длина выше порога","s4a_v_cause_short":"длина ниже порога модели","s4a_v_cause_notrf2":"нет TRF2 — белка, необходимого для t-петли","s4a_v_cause_dsb":"это не теломера","s4a_cap_ok_off":"Теломера с шелтерином после {d} делений без теломеразы: длина {n}, выше порога модели. Конец укорачивается, но остаётся защищённым.","s4a_cap_ok_off_z":"Укорочение само по себе не равно утрате защиты: пока повторов достаточно для защитной структуры, конец не узнаётся как разрыв.","s4a_cap_ok_on":"Теломераза возмещает потери при каждом делении: длина {n} сохраняется, конец защищён.","s4a_cap_ok_on_z":"Теломераза поддерживает длину; защиту обеспечивает шелтерин. В клетках с активной теломеразой укорочение не накапливается.","s4a_cap_short":"После {d} делений без теломеразы длина теломеры {n} — ниже порога модели (1 500): защитная структура не удерживается, конец узнаётся как разрыв. Модель не учитывает, что в клетке укорочение ниже порога останавливает деления раньше: здесь считается только длина.","s4a_cap_short_z":"Утрата защиты при укорочении — следствие длины; в модели это происходит только ниже порога, а не при любом укорочении.","s4a_cap_notrf2":"Длина теломеры {n}, но белка TRF2 нет: t-петли не образуются, и конец узнаётся как разрыв при любой длине. NHEJ может сшить такие концы разных хромосом.","s4a_cap_notrf2_z":"Защита зависит от белков шелтерина, а не только от длины: длинная теломера без TRF2 не защищена.","s4a_cap_dsb":"Внутренний разрыв обеих цепей: теломерных повторов и шелтерина здесь нет, и концы узнаются как разрыв — его устраняют пути вопроса 3.","s4a_cap_dsb_z":"Геометрически конец разрыва и конец хромосомы похожи; различает их белковая структура, которая есть только на теломере.","s4a_cap_mask":"Обратная задача: видно наблюдение, условия скрыты.","s4a_cap_mask_z":"Отделите то, что известно о длине, от того, что известно о защите.","s4a_take":"Длина теломеры и защита конца — разные свойства. Длину уменьшает неполная репликация концов и поддерживает теломераза; защиту обеспечивают белки шелтерина (считается, что в t-петле, для образования которой необходим TRF2, конец недоступен белкам, узнающим разрывы). Короткая теломера может ещё быть защищена, а длинная без TRF2 — нет. Поэтому одного измерения длины недостаточно, чтобы судить о защите: нужно наблюдать сам признак — узнаётся ли конец как разрыв.","s4a_lim":"У каждой хромосомы два конца, и длина теломер у них различается; утрата защиты наступает на самой короткой теломере, а средняя длина этого не показывает. Порог 1 500, начальная длина 6 000 и потеря 100 нуклеотидов за деление — условные значения; в клетках человека они зависят от типа клеток и условий. Модель не показывает переходных состояний (сигнал повреждения на теломере без слияния концов), регуляции теломеразы шелтерином и того, что сигнал от короткой теломеры может вести к остановке делений или к гибели клетки — это темы курса «Молекулярная биология».","s4a_new":"Концы хромосом при репликации укорачиваются по двум причинам, а не по одной. У конца, где G-цепь служит матрицей для отстающей цепи, синтез новой C-цепи останавливается, не дойдя до края, так как затравки на 3′-выступе не синтезируются. У другого конца для образования 3′-выступа укорачивается 5′-конец C-цепи. В клетках опухолевой линии человека без комплекса CST, который достраивает C-цепь, она укорачивалась примерно на 50–60 нуклеотидов за репликацию у первого конца и примерно на 100 — у второго. Теломераза удлиняет только G-цепь, поэтому C-цепь поддерживается отдельным ферментом — полимеразой α с праймазой. В модели этой вкладки укорочение задано одним средним числом за деление; на самом деле два конца хромосомы укорачиваются по-разному, и защиту первой теряет самая короткая теломера.","s4a_how":"в клетках опухолевой линии человека выключали белок комплекса CST и измеряли длину каждой из двух цепей теломер по отдельности на концах разных типов; в пробирке собирали репликацию из очищенных белков пекарских дрожжей — что реплисома человека ведёт себя так же, авторы предполагают по сходству строения. Числа получены в одной линии клеток и на другие клетки не переносятся.","s4a_tl_note":"Порядок этапов — учебная модель. Длины, потеря за деление и порог условные; прекращение делений модель не показывает.","s4a_tl_1_off":"Деления: без теломеразы теломера в модели укорачивается на 100 условных нуклеотидов за деление.","s4a_tl_1_on":"Деления: активная теломераза восполняет потерю — в модели длина теломеры не меняется.","s4a_tl_1_dsb":"Деления: у внутреннего разрыва теломерных повторов нет — длины в модели нет.","s4a_tl_2_ok":"Состояние конца: шелтерин на месте, длина выше порога модели — конец защищён.","s4a_tl_2_short":"Состояние конца: длина опустилась ниже порога модели — конец узнаётся как разрыв. Прекращение делений модель не показывает.","s4a_tl_2_notrf2":"Состояние конца: без TRF2 конец узнаётся как разрыв при любой длине.","s4a_tl_2_dsb":"Состояние конца: настоящий разрыв узнаётся белками разрыва и репарируется.","s4a_u_div":"","s4a_rx_note":"Бегунок переходит только по засечкам 0, 20, 40 и 50 делений — это положения модели. Порог условный: в клетке защита утрачивается не на определённом делении, а сначала на самой короткой теломере."},"notes":["Короче, но защищён.","Длина исходная, но защиты нет.","Настоящий разрыв: его узнают и репарируют."],"static":["Короче, но защищён."]}},"level":"adv"},{"id":"integration","section":3,"questions":[1,2,3,4],"title":"Сводная задача: ошибка, повреждение или закреплённое изменение?","keywords":["ошибка спаривания","повреждение","мутация","допустимые гипотезы","дополнительное наблюдение"],"lead":["Объединим четыре вопроса. В одном и том же участке ДНК трёх клеток найдено разное.","Задача — назвать, что это за событие, какие системы могут с ним справиться и что можно и чего нельзя утверждать."],"mechanism":["Клетка 1: в одной цепи урацил напротив G, репликации ещё не было. Это повреждение; его устранит BER по неповреждённой цепи, и мутации не будет.","Клетка 2: в новой цепи C напротив A матрицы, разрывы в новой цепи ещё есть. Это ошибка спаривания; её может исправить MMR, а если не успеет — после репликации изменение закрепится в одной из двух молекул.","Клетка 3: в обеих цепях согласованная пара C–G на месте T–A, которая была у родительской клетки. Это закреплённое изменение; системы репарации его не узнают.","По одной клетке 3 нельзя сказать, откуда изменение: из не исправленной ошибки спаривания или из не устранённого до репликации повреждения."],"paragraphs":["Чтобы различить гипотезы для клетки 3, нужны дополнительные наблюдения: состав многих изменений в геноме (какие замены преобладают), работа систем исправления и репарации в этих клетках, было ли воздействие, повреждающее ДНК.","Разрыв обеих цепей и укорочение теломер добавляют ещё два типа событий: изменение участка хромосомы при соединении концов и утрату защиты концов. Их тоже различают по виду результата: потери на месте соединения, сшитые концы хромосом, сигнал повреждения на теломерах.","Общий принцип семинара: предотвращение ошибки, её исправление, устранение повреждения и закрепление изменения — разные процессы, и наблюдаемый результат не всегда однозначно указывает на причину."],"conditions":"Мысленная задача по моделям вкладок 1 и 2.","sources":["Alberts2022"],"quiz":{"id":"S8-L25","question":"В ДНК клетки найдена согласованная пара T–A на месте C–G, которая была у родительской клетки. Какое утверждение верно?","options":[{"id":"S8-L25-1","text":"Это закреплённое изменение; по одной этой паре нельзя сказать, возникло оно из ошибки спаривания или из повреждения","correct":true,"feedback":"Обе цепи согласованы; путь к изменению по нему не установить без дополнительных наблюдений."},{"id":"S8-L25-2","text":"Это урацил, который ещё может удалить BER","correct":false,"feedback":"Урацила здесь нет: в обеих цепях нормальные основания, T и A."},{"id":"S8-L25-3","text":"Это ошибка спаривания, которую исправит MMR","correct":false,"feedback":"Пара T–A комплементарна: ошибочной пары нет, и MMR её не узнает."}]},"widget":{"kind":"dna","title":"","s":{"title":"Ошибка и закреплённое изменение","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["ошибка исправлена MMR","ошибка закреплена"],"scene":"s1b","args":[["off","on","yes"],["off","off","yes"]],"L":{"s1_proof":"Коррекция 3′-конца ДНК-полимеразой","s1_mmr":"Репарация ошибочно спаренных нуклеотидов (MMR)","s1_mark":"Метка новой цепи — разрыв в ней","s1_on":"работает","s1_off":"выключена","s1_mark_yes":"есть","s1_mark_no":"нет (разрывы уже сшиты)","s1_ctrl_note":"Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.","s1_pA":"А. Сразу после синтеза новой цепи","s1_pA_syn":"А. Во время синтеза: 3′-конец растущей цепи","s1_pB":"Б. После следующей репликации: две дочерние молекулы","s1_lbl_tpl":"матрица (старая цепь)","s1_lbl_new":"новая цепь","s1_lbl_proof":"неверный C отщеплён с 3′-конца, на его место встал T","s1_lbl_patch":"зелёный участок новой цепи вырезан и синтезирован заново","s1_lbl_patch2":"новую цепь узнали по разрыву в ней; матрица не менялась","s1_lbl_nomark":"ошибочная пара узнана, но не определено, какая цепь новая","s1_lbl_none":"ошибочная пара C·A осталась в новой цепи","s1_lbl_d1":"копия матрицы","s1_lbl_d2":"копия новой цепи","s1_lbl_same":"в обеих молекулах на этом месте пара T–A, как в исходной","s1_lbl_fixed":"во второй молекуле пара C–G вместо T–A — изменение закреплено","s1_r_mis":"Ошибочная пара C·A","s1_r_mis_s":"после окончания синтеза новой цепи","s1_v_mis_yes":"осталась","s1_v_mis_no":"не осталась","s1_r_where":"Где исправлена ошибка","s1_v_where_proof":"на 3′-конце, во время синтеза","s1_v_where_mmr":"после синтеза: заменён участок новой цепи","s1_v_where_nomark":"не исправлена: новая цепь не отмечена","s1_v_where_none":"не исправлена","s1_r_next":"После следующей репликации","s1_r_next_s":"пара на месте ошибки в двух дочерних молекулах","s1_v_next_same":"T–A и T–A, как в исходной молекуле","s1_v_next_fixed":"T–A и C–G: в одной молекуле из двух изменение","s1_r_after":"Узнает ли MMR пару C–G после репликации","s1_v_after":"нет: это обычная комплементарная пара","s1_cap_proof":"Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.","s1_cap_proof_z":"Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.","s1_cap_mmr":"Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.","s1_cap_mmr_z":"Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.","s1_cap_nomark":"Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.","s1_cap_nomark_z":"Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.","s1_cap_none":"Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.","s1_cap_none_z":"После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.","s1_e_pol":"ДНК-полимераза"},"notes":["Изменения нет.","Изменение закреплено в одной из двух молекул."],"static":["Изменения нет."]}}},{"id":"exit-to-gene","section":3,"questions":[1,2,3,4],"title":"Что дальше: изменение последовательности ДНК и продукт гена","keywords":["ген","РНК","белок","синонимичная замена","семинар 9"],"lead":["Закреплённое изменение передаётся при репликации. Влияет ли оно на работу клетки — отдельный вопрос.","Ответ зависит от того, как последовательность ДНК используется: это тема следующих семинаров."],"mechanism":["Если изменение находится в участке, который копируется в РНК, оно появится и в РНК.","Изменится ли белок, зависит от того, где изменение и что оно меняет: некоторые замены не меняют аминокислоту, другие меняют её или прерывают белок.","Многие изменения приходятся на участки, не кодирующие белок, и не нарушают работу клетки.","Поэтому мутацию определяет само устойчивое изменение последовательности, а не его последствия."],"paragraphs":["В семинаре 9 — как ген читается (транскрипция) и как обрабатывается его РНК; там станет понятно, какие участки гена и как связаны с продуктом.","Ошибки при синтезе РНК тоже бывают, но не передаются потомкам клетки: молекула РНК не служит матрицей при репликации ДНК. Поэтому к точности синтеза РНК требования ниже, чем к точности репликации."],"conditions":"Переход к следующему семинару; подробности — в семинарах 9–11.","sources":["Alberts2022"],"quiz":{"id":"S8-L26","question":"Замена одного нуклеотида закрепилась в участке ДНК между генами и передаётся дочерним клеткам. Можно ли считать её мутацией?","options":[{"id":"S8-L26-1","text":"Нет: мутация — только изменение внутри гена","correct":false,"feedback":"Определение мутации не ограничено генами; изменение между генами тоже передаётся при репликации."},{"id":"S8-L26-2","text":"Да: это закреплённое изменение последовательности ДНК, которое передаётся при репликации","correct":true,"feedback":"Мутацию определяет устойчивое изменение последовательности ДНК, а не то, в каком участке оно произошло и как отразилось на белке."},{"id":"S8-L26-3","text":"Нет: такая замена будет исправлена при следующей репликации","correct":false,"feedback":"Закреплённое изменение системы репарации не узнают: обе цепи согласованы."}]},"widget":{"kind":"dna","title":"","s":{"title":"Закреплённое изменение","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["изменение закреплено"],"scene":"s1b","args":[["off","off","yes"]],"L":{"s1_proof":"Коррекция 3′-конца ДНК-полимеразой","s1_mmr":"Репарация ошибочно спаренных нуклеотидов (MMR)","s1_mark":"Метка новой цепи — разрыв в ней","s1_on":"работает","s1_off":"выключена","s1_mark_yes":"есть","s1_mark_no":"нет (разрывы уже сшиты)","s1_ctrl_note":"Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.","s1_pA":"А. Сразу после синтеза новой цепи","s1_pA_syn":"А. Во время синтеза: 3′-конец растущей цепи","s1_pB":"Б. После следующей репликации: две дочерние молекулы","s1_lbl_tpl":"матрица (старая цепь)","s1_lbl_new":"новая цепь","s1_lbl_proof":"неверный C отщеплён с 3′-конца, на его место встал T","s1_lbl_patch":"зелёный участок новой цепи вырезан и синтезирован заново","s1_lbl_patch2":"новую цепь узнали по разрыву в ней; матрица не менялась","s1_lbl_nomark":"ошибочная пара узнана, но не определено, какая цепь новая","s1_lbl_none":"ошибочная пара C·A осталась в новой цепи","s1_lbl_d1":"копия матрицы","s1_lbl_d2":"копия новой цепи","s1_lbl_same":"в обеих молекулах на этом месте пара T–A, как в исходной","s1_lbl_fixed":"во второй молекуле пара C–G вместо T–A — изменение закреплено","s1_r_mis":"Ошибочная пара C·A","s1_r_mis_s":"после окончания синтеза новой цепи","s1_v_mis_yes":"осталась","s1_v_mis_no":"не осталась","s1_r_where":"Где исправлена ошибка","s1_v_where_proof":"на 3′-конце, во время синтеза","s1_v_where_mmr":"после синтеза: заменён участок новой цепи","s1_v_where_nomark":"не исправлена: новая цепь не отмечена","s1_v_where_none":"не исправлена","s1_r_next":"После следующей репликации","s1_r_next_s":"пара на месте ошибки в двух дочерних молекулах","s1_v_next_same":"T–A и T–A, как в исходной молекуле","s1_v_next_fixed":"T–A и C–G: в одной молекуле из двух изменение","s1_r_after":"Узнает ли MMR пару C–G после репликации","s1_v_after":"нет: это обычная комплементарная пара","s1_cap_proof":"Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.","s1_cap_proof_z":"Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.","s1_cap_mmr":"Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.","s1_cap_mmr_z":"Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.","s1_cap_nomark":"Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.","s1_cap_nomark_z":"Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.","s1_cap_none":"Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.","s1_cap_none_z":"После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.","s1_e_pol":"ДНК-полимераза"},"notes":["Во второй молекуле пара C–G вместо T–A передаётся дальше при репликациях."],"static":["Во второй молекуле пара C–G вместо T–A передаётся дальше при репликациях."]}}}],"sections":[{"title":"Точность копирования: ошибка, её исправление и закрепление","entry":"error-damage-mutation","sub":"Почему ошибка копирования ещё не мутация и как три последовательных этапа снижают число ошибок"},{"title":"Повреждения ДНК и их вырезание","entry":"damage-sources","sub":"Как разные повреждения узнаются разными белками и почему неповреждённая цепь позволяет восстановить последовательность точно"},{"title":"Разрыв обеих цепей: соединение концов и гомологичная рекомбинация","entry":"dsb-danger","sub":"Почему для точного восстановления разрыва нужна другая молекула и как с этим связана стадия клеточного цикла"},{"title":"Концы хромосом: укорочение, теломераза и защита","entry":"end-replication","sub":"Почему конец линейной ДНК не копируется полностью, как его достраивает теломераза и почему он не принимается за разрыв"}],"glossary":[{"id":"S8-T01","term":"Матрица","section":0,"def":"Цепь ДНК, по которой строится новая цепь: напротив каждого её основания встаёт комплементарный нуклеотид. При репликации матрицей служит каждая из двух родительских цепей; при репарации — неповреждённая цепь или неповреждённая копия участка."},{"id":"S8-T02","term":"Новая (дочерняя) цепь ДНК","section":0,"def":"Цепь, которую ДНК-полимераза строит по матрице в направлении 5′→3′; она комплементарна и антипараллельна матрице."},{"id":"S8-T03","term":"ДНК-полимераза","section":0,"def":"Фермент, который присоединяет нуклеотиды к 3′-OH растущей цепи по матрице. Полимеразы, копирующие основную часть генома (δ и ε), имеют корректирующую 3′→5′-экзонуклеазу; полимераза α, начинающая синтез, её не имеет."},{"id":"S8-T04","term":"Корректирующая экзонуклеаза (коррекция 3′-конца)","section":0,"def":"Активность ДНК-полимеразы, отщепляющая нуклеотиды с 3′-конца растущей цепи в направлении 3′→5′. Неверно спаренный последний нуклеотид переходит в экзонуклеазный центр и удаляется, после чего синтез продолжается."},{"id":"S8-T05","term":"Ошибочная пара (неправильно спаренные нуклеотиды)","section":0,"def":"Пара оснований, не соответствующая правилам комплементарности, например G·T, при том что оба основания химически не изменены. Возникает при ошибке выбора нуклеотида и искажает геометрию двойной спирали."},{"id":"S8-T06","term":"Белок узнавания ошибочной пары (MutS)","section":0,"def":"Белок системы репарации ошибочно спаренных нуклеотидов, который связывается с ошибочной парой; у человека это комплексы MutSα и MutSβ. Название — по сходному белку бактерий."},{"id":"S8-T07","term":"Репарация ошибочно спаренных нуклеотидов (MMR)","section":0,"def":"Система, которая после синтеза находит ошибочные пары, определяет новую цепь (у эукариот — по разрывам в ней), удаляет участок новой цепи с ошибкой и синтезирует его заново по матрице."},{"id":"S8-T08","term":"Разрыв в одной цепи","section":0,"def":"Нарушение сахаро-фосфатного остова одной цепи при целой второй цепи; нуклеотиды не утрачены. Сшивается ДНК-лигазой. Разрывы в новой цепи служат меткой для MMR; как промежуточный продукт возникают в конце эксцизионной репарации."},{"id":"S8-T09","term":"Мутация (закреплённое изменение последовательности)","section":0,"def":"Устойчивое изменение последовательности нуклеотидов ДНК: обе цепи согласованы, системы репарации его уже не узнают, и при репликации оно передаётся дочерним молекулам. Системы репарации его не узнают, потому что в нём нет ни повреждения, ни ошибочной пары."},{"id":"S8-T10","term":"Урацил в ДНК","section":0,"def":"Основание, которое образуется в ДНК при отщеплении аминогруппы от цитозина (дезаминирование). Спаривается с аденином, поэтому, если его не удалить до репликации, в одной из дочерних молекул образуется пара U–A, а после следующей репликации — T–A вместо исходной C–G."},{"id":"S8-T11","term":"ДНК-гликозилаза","section":1,"def":"Фермент, который узнаёт определённое изменённое основание (урацил, окисленное или алкилированное) и отщепляет его от сахара, оставляя AP-сайт. Начинает путь вырезания основания (BER)."},{"id":"S8-T12","term":"AP-сайт","section":1,"def":"Место в цепи ДНК, где нуклеотид лишён основания, а сахаро-фосфатный остов цел (апуриновый или апиримидиновый участок). Возникает самопроизвольно или после работы гликозилазы; узнаётся AP-эндонуклеазой."},{"id":"S8-T13","term":"AP-эндонуклеаза","section":1,"def":"Фермент, который узнаёт AP-сайт и надрезает сахаро-фосфатный остов рядом с ним, подготавливая место для встраивания нового нуклеотида."},{"id":"S8-T14","term":"Пиримидиновый димер","section":1,"def":"Два соседних пиримидина одной цепи (T–T, T–C или C–C), ковалентно связанные под действием ультрафиолета. Искажает двойную спираль и удаляется у человека путём вырезания нуклеотидов (NER)."},{"id":"S8-T15","term":"Белки узнавания NER (XPC, TFIIH)","section":1,"def":"Белки узнавания (среди них XPC) находят искажение двойной спирали в любом участке генома; комплекс TFIIH раскрывает участок и проверяет, есть ли в цепи повреждение. В транскрибируемых генах сигналом служит остановившаяся РНК-полимераза."},{"id":"S8-T16","term":"Нуклеазы NER","section":1,"def":"Две нуклеазы, надрезающие повреждённую цепь по обе стороны от повреждения; участок около 30 нуклеотидов (у человека) удаляется целиком."},{"id":"S8-T17","term":"Пробел в одной цепи","section":1,"def":"Участок, где нуклеотиды одной цепи удалены, а противоположная цепь не повреждена. Промежуточный продукт эксцизионной репарации: заполняется ДНК-полимеразой по противоположной цепи."},{"id":"S8-T19","term":"ДНК-лигаза","section":0,"def":"Фермент, соединяющий 3′-OH одного нуклеотида с 5′-фосфатом соседнего, то есть сшивающий разрыв сахаро-фосфатного остова."},{"id":"S8-T21","term":"Неповреждённая цепь","section":1,"def":"Цепь, комплементарная повреждённой; при эксцизионной репарации служит матрицей, поэтому исходная последовательность восстанавливается точно."},{"id":"S8-T23","term":"Двуцепочечный разрыв","section":2,"def":"Разрыв обеих цепей ДНК в одном или близких местах; молекула разделяется на две части, а целой цепи-матрицы на месте разрыва нет. Возникает под действием ионизирующего излучения, некоторых веществ, при разрушении репликационной вилки."},{"id":"S8-T25","term":"Сестринская хроматида","section":2,"def":"Копия хроматиды, образовавшаяся при репликации ДНК в S-фазе; до разделения в митозе содержит ту же последовательность и служит матрицей для гомологичной рекомбинации."},{"id":"S8-T26","term":"Когезин","section":2,"def":"Белковый комплекс в форме кольца, который удерживает сестринские хроматиды вместе от репликации ДНК до анафазы митоза."},{"id":"S8-T28","term":"Белки Ku","section":2,"def":"Белки Ku70 и Ku80; их комплекс кольцом охватывает каждый конец двуцепочечного разрыва и вместе с другими белками удерживает концы рядом; с него начинается негомологичное соединение концов (NHEJ)."},{"id":"S8-T29","term":"Лигаза IV","section":2,"def":"ДНК-лигаза пути NHEJ, сшивающая сведённые вместе концы двуцепочечного разрыва."},{"id":"S8-T30","term":"Нуклеазы резекции","section":2,"def":"Нуклеазы, укорачивающие 5′-концы двуцепочечного разрыва, так что на обоих концах остаются одноцепочечные 3′-участки; первый этап гомологичной рекомбинации, идёт в основном в S и G2."},{"id":"S8-T31","term":"RAD51","section":2,"def":"Белок, собирающийся на одноцепочечном 3′-конце разрыва и обеспечивающий поиск комплементарного участка в гомологичной молекуле и встраивание в неё конца."},{"id":"S8-T34","term":"Теломера","section":3,"def":"Концевой участок линейной хромосомы из многих повторов TTAGGG (у человека — несколько тысяч пар нуклеотидов) вместе с защитными белками."},{"id":"S8-T35","term":"G-цепь теломеры","section":3,"def":"Цепь теломеры из повторов TTAGGG, направленная 3′-концом к концу хромосомы; она длиннее комплементарной и образует 3′-выступ."},{"id":"S8-T37","term":"3′-выступ (G-выступ)","section":3,"def":"Одноцепочечный 3′-конец G-цепи теломеры. Служит затравкой для теломеразы и в t-петле встраивается в двуцепочечную часть теломеры."},{"id":"S8-T38","term":"Теломераза","section":3,"def":"Фермент из белков и РНК; его белок — обратная транскриптаза, синтезирующая ДНК по матрице из РНК теломеразы (эта РНК входит и в активный центр). Присоединяет повторы TTAGGG к 3′-концу G-цепи, используя dNTP. Активна в половых и многих стволовых клетках, в большинстве опухолей; в большинстве соматических клеток её активность низкая."},{"id":"S8-T39","term":"РНК теломеразы","section":3,"def":"Молекула РНК в составе теломеразы; её участок комплементарен повтору теломеры и служит матрицей для синтеза ДНК."},{"id":"S8-T40","term":"ДНК-полимераза α с праймазой","section":3,"def":"Комплекс, синтезирующий РНК-затравку и начальный участок ДНК. На теломере достраивает C-цепь по удлинённой G-цепи; к теломере его привлекает комплекс CST."},{"id":"S8-T41","term":"Шелтерин","section":3,"def":"Комплекс из шести белков (TRF1, TRF2, RAP1, TIN2, TPP1, POT1), связанный с теломерными повторами. Защищает естественный конец хромосомы от узнавания как разрыв; TRF2 необходим для образования t-петли."},{"id":"S8-T42","term":"t-петля","section":3,"def":"Структура конца теломеры, в которой 3′-выступ встроен в двуцепочечную часть теломеры. Конец хромосомы оказывается спрятан и не узнаётся белками, связывающими разрывы."}],"sources":{"Alberts2022":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»","doi":"","pmid":""},"KunkelErie2015":{"url":"https://doi.org/10.1146/annurev-genet-112414-054722","cite":"Kunkel T. A., Erie D. A. Eukaryotic mismatch repair in relation to DNA replication. Annu Rev Genet. 2015;49:291–313","doi":"10.1146/annurev-genet-112414-054722","pmid":"26436461"},"Chung2021":{"url":"https://doi.org/10.1158/2159-8290.CD-20-0790","cite":"Chung J., Maruvka Y. E., Sudhaman S., Kelly J. et al. DNA polymerase and mismatch repair exert distinct microsatellite instability signatures in normal and malignant human cells. Cancer Discov. 2021;11:1176–1191","doi":"10.1158/2159-8290.CD-20-0790","pmid":"33355208"},"Beard2019":{"url":"https://doi.org/10.1146/annurev-biochem-013118-111315","cite":"Beard W. A., Horton J. K., Prasad R., Wilson S. H. Eukaryotic base excision repair: new approaches shine light on mechanism. Annu Rev Biochem. 2019;88:137–162","doi":"10.1146/annurev-biochem-013118-111315","pmid":"31220977"},"Kim2023":{"url":"https://doi.org/10.1038/s41586-023-05959-z","cite":"Kim J., Li C.-L., Chen X., Cui Y., Golebiowski F. M., Wang H., Hanaoka F., Sugasawa K., Yang W. Lesion recognition by XPC, TFIIH and XPA in DNA excision repair. Nature. 2023;617:170–175","doi":"10.1038/s41586-023-05959-z","pmid":"37076 const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
