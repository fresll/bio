БИО-7·3]]).","Новое: с ДНК может случиться три разных события, и в этом семинаре важно их не смешивать.","Раздел относится к вопросу 4 коллоквиума 2 (предварительный список) и вопросу 15 зачёта."],"mechanism":["[[T05|Ошибка спаривания]] — при синтезе встал некомплементарный нуклеотид, например C напротив A. Оба основания химически нормальные, неправильна только пара.","Повреждение ДНК — химическое или структурное изменение молекулы: изменённое или утраченное основание, сшитые соседние нуклеотиды, разрыв цепи. Оно возникает и без копирования.","[[T09|Мутация]] — устойчивое изменение последовательности ДНК: обе цепи согласованы, и системы репарации его уже не узнают; при репликации оно передаётся дочерним молекулам.","Ошибка спаривания и повреждение — ещё не мутации: если их исправить, исходная последовательность сохранится. В примере этого семинара ошибка спаривания становится мутацией при следующей репликации."],"paragraphs":["Различие важно, потому что системы защиты узнают разные признаки. Ошибку спаривания выдаёт нарушенная геометрия пары, повреждение — необычное основание или искажение двойной спирали. Закреплённую мутацию не узнаёт ни одна система: в ней обе цепи согласованы, и сравнивать нечего.","Поэтому один и тот же итог — изменённая пара в дочерней молекуле — может возникнуть разными путями: из ошибки, которую не исправили, или из повреждения, которое не успели устранить до репликации. По одной изменённой паре нельзя сказать, какой путь к ней привёл.","Изменение последовательности не обязательно меняет белок или свойства клетки: оно может прийтись на участок, не кодирующий белок, или заменить кодон на синонимичный. Мутацией его делает устойчивость изменения последовательности, а не последствия; о последствиях для РНК и белка — семинар 9."],"conditions":"Схема шага — модель вкладки 1: одна ошибка C напротив A матрицы. Последовательности условные.","sources":["Alberts2022"],"quiz":{"id":"S8-L01","question":"В клетке урацил появился в ДНК при дезаминировании цитозина, и его удалили до следующей репликации. Что это было?","options":[{"id":"S8-L01-1","text":"Повреждение, которое не стало мутацией","correct":true,"feedback":"Урацил — химически изменённое основание; его устранили до репликации, исходная пара восстановлена, и изменение не передаётся дочерним молекулам."},{"id":"S8-L01-2","text":"Мутация, которая была исправлена","correct":false,"feedback":"Мутация — устойчивое изменение последовательности; здесь урацил удалили, исходная пара восстановлена, и устойчивого изменения не осталось."},{"id":"S8-L01-3","text":"Ошибка спаривания","correct":false,"feedback":"Ошибка спаривания возникает при синтезе: оба основания нормальные. Урацил возник в уже готовой цепи из цитозина — это повреждение."}]},"widget":{"kind":"dna","title":"","s":{"title":"Одна ошибка спаривания: исправлена или закреплена","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["коррекция работает","ни коррекции, ни MMR"],"scene":"s1b","args":[["on","on","yes"],["off","off","yes"]],"L":{"s1_proof":"Коррекция 3′-конца ДНК-полимеразой","s1_mmr":"Репарация ошибочно спаренных нуклеотидов (MMR)","s1_mark":"Метка новой цепи — разрыв в ней","s1_on":"работает","s1_off":"выключена","s1_mark_yes":"есть","s1_mark_no":"нет (разрывы уже сшиты)","s1_ctrl_note":"Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.","s1_pA":"А. Сразу после синтеза новой цепи","s1_pA_syn":"А. Во время синтеза: 3′-конец растущей цепи","s1_pB":"Б. После следующей репликации: две дочерние молекулы","s1_lbl_tpl":"матрица (старая цепь)","s1_lbl_new":"новая цепь","s1_lbl_proof":"неверный C отщеплён с 3′-конца, на его место встал T","s1_lbl_patch":"зелёный участок новой цепи вырезан и синтезирован заново","s1_lbl_patch2":"новую цепь узнали по разрыву в ней; матрица не менялась","s1_lbl_nomark":"ошибочная пара узнана, но не определено, какая цепь новая","s1_lbl_none":"ошибочная пара C·A осталась в новой цепи","s1_lbl_d1":"копия матрицы","s1_lbl_d2":"копия новой цепи","s1_lbl_same":"в обеих молекулах на этом месте пара T–A, как в исходной","s1_lbl_fixed":"во второй молекуле пара C–G вместо T–A — изменение закреплено","s1_r_mis":"Ошибочная пара C·A","s1_r_mis_s":"после окончания синтеза новой цепи","s1_v_mis_yes":"осталась","s1_v_mis_no":"не осталась","s1_r_where":"Где исправлена ошибка","s1_v_where_proof":"на 3′-конце, во время синтеза","s1_v_where_mmr":"после синтеза: заменён участок новой цепи","s1_v_where_nomark":"не исправлена: новая цепь не отмечена","s1_v_where_none":"не исправлена","s1_r_next":"После следующей репликации","s1_r_next_s":"пара на месте ошибки в двух дочерних молекулах","s1_v_next_same":"T–A и T–A, как в исходной молекуле","s1_v_next_fixed":"T–A и C–G: в одной молекуле из двух изменение","s1_r_after":"Узнает ли MMR пару C–G после репликации","s1_v_after":"нет: это обычная комплементарная пара","s1_cap_proof":"Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.","s1_cap_proof_z":"Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.","s1_cap_mmr":"Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.","s1_cap_mmr_z":"Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.","s1_cap_nomark":"Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.","s1_cap_nomark_z":"Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.","s1_cap_none":"Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.","s1_cap_none_z":"После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.","s1_e_pol":"ДНК-полимераза"},"notes":["Ошибку удалила корректирующая экзонуклеаза полимеразы: изменения нет.","Ошибка не исправлена: после репликации в одной из двух молекул пара C–G вместо T–A — изменение закреплено."],"static":["Ошибку удалила корректирующая экзонуклеаза полимеразы: изменения нет."]}}},{"id":"proofreading","section":0,"questions":[1],"title":"Выбор нуклеотида и коррекция 3′-конца: две проверки в момент синтеза","keywords":["комплементарность","корректирующая экзонуклеаза","3′→5′","ДНК-полимераза δ и ε"],"lead":["Уже известно: [[T03|ДНК-полимераза]] присоединяет нуклеотид только к спаренному с матрицей 3′-OH ([[https://fresll.github.io/bio/seminar-7-route.html#polymerase-rule|вспомнить БИО-7·4]]).","Новое: это требование и есть основа первой проверки ошибок — ещё до того, как синтез продолжится."],"mechanism":["Первая проверка — выбор нуклеотида: правильная пара подходит к активному центру полимеразы лучше, чем неправильная, и неправильный нуклеотид чаще уходит, не присоединившись.","Если некомплементарный нуклеотид всё же присоединён, 3′-конец оказывается неспаренным, и полимераза плохо его удлиняет.","Такой конец переходит в экзонуклеазный центр той же полимеразы, и [[T04|корректирующая экзонуклеаза]] отщепляет ошибочный нуклеотид в направлении 3′→5′.","После этого синтез продолжается с правильно спаренного 3′-OH."],"paragraphs":["Корректирующую экзонуклеазу имеют полимеразы δ и ε, которые синтезируют основную часть новых цепей; у полимеразы α, начинающей каждый фрагмент, её нет. Поэтому ошибки, сделанные полимеразой α, проверяет уже следующий этап.","По оценкам, приведённым в учебнике Alberts et al. (получены в основном на бактериях), при выборе нуклеотида полимераза ошибается примерно 1 раз на 10⁵ присоединений, а коррекция уменьшает число ошибок примерно в 100 раз. Эти оценки зависят от полимеразы и типа ошибки: одни ошибочные пары возникают и исправляются легче других.","Коррекция работает только на растущем 3′-конце. Ошибку, которую полимераза оставила позади и продолжила синтез, коррекция уже не исправит — для этого нужен следующий этап."],"conditions":"Числа — оценки из учебника Alberts et al., полученные в основном на бактериях; для клеток человека они другие и зависят от типа ошибки и полимеразы.","sources":["Alberts2022","KunkelErie2015"],"quiz":{"id":"S8-L02","question":"Какую ошибку может исправить корректирующая экзонуклеаза ДНК-полимеразы?","options":[{"id":"S8-L02-1","text":"Ошибочную пару в середине уже синтезированной цепи","correct":false,"feedback":"Позади полимеразы ошибочную пару находит другая система — MMR; коррекция работает только на 3′-конце."},{"id":"S8-L02-2","text":"Неверно спаренный нуклеотид на 3′-конце растущей цепи","correct":true,"feedback":"Коррекция проверяет последний присоединённый нуклеотид: неспаренный 3′-конец переходит в экзонуклеазный центр."},{"id":"S8-L02-3","text":"Изменённое основание в матрице","correct":false,"feedback":"Повреждения матрицы устраняют пути репарации повреждений (раздел 2), а не коррекция полимеразы."}]},"widget":{"kind":"dna","title":"","s":{"title":"Коррекция 3′-конца","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["коррекция работает","коррекция выключена, MMR работает"],"scene":"s1b","args":[["on","on","yes"],["off","on","yes"]],"L":{"s1_proof":"Коррекция 3′-конца ДНК-полимеразой","s1_mmr":"Репарация ошибочно спаренных нуклеотидов (MMR)","s1_mark":"Метка новой цепи — разрыв в ней","s1_on":"работает","s1_off":"выключена","s1_mark_yes":"есть","s1_mark_no":"нет (разрывы уже сшиты)","s1_ctrl_note":"Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.","s1_pA":"А. Сразу после синтеза новой цепи","s1_pA_syn":"А. Во время синтеза: 3′-конец растущей цепи","s1_pB":"Б. После следующей репликации: две дочерние молекулы","s1_lbl_tpl":"матрица (старая цепь)","s1_lbl_new":"новая цепь","s1_lbl_proof":"неверный C отщеплён с 3′-конца, на его место встал T","s1_lbl_patch":"зелёный участок новой цепи вырезан и синтезирован заново","s1_lbl_patch2":"новую цепь узнали по разрыву в ней; матрица не менялась","s1_lbl_nomark":"ошибочная пара узнана, но не определено, какая цепь новая","s1_lbl_none":"ошибочная пара C·A осталась в новой цепи","s1_lbl_d1":"копия матрицы","s1_lbl_d2":"копия новой цепи","s1_lbl_same":"в обеих молекулах на этом месте пара T–A, как в исходной","s1_lbl_fixed":"во второй молекуле пара C–G вместо T–A — изменение закреплено","s1_r_mis":"Ошибочная пара C·A","s1_r_mis_s":"после окончания синтеза новой цепи","s1_v_mis_yes":"осталась","s1_v_mis_no":"не осталась","s1_r_where":"Где исправлена ошибка","s1_v_where_proof":"на 3′-конце, во время синтеза","s1_v_where_mmr":"после синтеза: заменён участок новой цепи","s1_v_where_nomark":"не исправлена: новая цепь не отмечена","s1_v_where_none":"не исправлена","s1_r_next":"После следующей репликации","s1_r_next_s":"пара на месте ошибки в двух дочерних молекулах","s1_v_next_same":"T–A и T–A, как в исходной молекуле","s1_v_next_fixed":"T–A и C–G: в одной молекуле из двух изменение","s1_r_after":"Узнает ли MMR пару C–G после репликации","s1_v_after":"нет: это обычная комплементарная пара","s1_cap_proof":"Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.","s1_cap_proof_z":"Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.","s1_cap_mmr":"Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.","s1_cap_mmr_z":"Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.","s1_cap_nomark":"Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.","s1_cap_nomark_z":"Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.","s1_cap_none":"Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.","s1_cap_none_z":"После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.","s1_e_pol":"ДНК-полимераза"},"notes":["C отщеплён с 3′-конца сразу, на его место встал T.","Коррекция пропустила ошибку; её исправила MMR после синтеза — заменён участок новой цепи."],"static":["C отщеплён с 3′-конца сразу, на его место встал T."]}}},{"id":"mismatch-repair","section":0,"questions":[1],"title":"Репарация ошибочно спаренных нуклеотидов: какая цепь новая","keywords":["MMR","MutS","MutL","разрыв новой цепи","PCNA"],"lead":["Ошибки, которые пропустила коррекция, остаются в новой цепи позади полимеразы. Их находит третий этап — [[T07|репарация ошибочно спаренных нуклеотидов]] (MMR).","Главная трудность: в ошибочной паре оба основания нормальные. Как узнать, какое из них неверное?"],"mechanism":["[[T06|Белок узнавания ошибочной пары]] (у человека — MutSα или MutSβ) связывается с ошибочной парой.","Комплекс привлекает белок MutL и вместе с ним находит рядом [[T08|разрыв в одной цепи]] и скользящий зажим PCNA. Разрывы есть только в новой цепи: в отстающей — между фрагментами Оказаки; как отмечается новая ведущая цепь, установлено не окончательно (предполагают разрывы на месте случайно встроенных рибонуклеотидов).","По этой метке активируется нуклеаза, и участок новой цепи вместе с ошибкой удаляется.","ДНК-полимераза δ синтезирует участок заново по матрице, [[T19|лигаза]] сшивает разрыв."],"paragraphs":["Метка нужна потому, что исправлять надо именно новую цепь: матрица — образец. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при «исправлении».","У бактерии кишечной палочки новую цепь отличает отсутствие метильных групп, которые появляются на ней с задержкой; у эукариот такой метки нет, и меткой служат разрывы новой цепи.","MMR работает после синтеза, но до следующей репликации. По оценкам из учебника Alberts et al., она уменьшает число ошибок ещё в 100–1000 раз. Наследственные дефекты белков MMR у человека повышают частоту мутаций и предрасполагают к некоторым опухолям; это клинический пример значения механизма."],"conditions":"Схема шага — модель вкладки 1. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.","sources":["Alberts2022","KunkelErie2015"],"quiz":{"id":"S8-L03","question":"Почему для MMR должна быть отмечена новая цепь?","options":[{"id":"S8-L03-1","text":"Новая цепь химически повреждена, и её проще узнать","correct":false,"feedback":"Новая цепь не повреждена; её отличает только метка — разрывы."},{"id":"S8-L03-2","text":"MMR может исправлять только новую цепь, потому что матрица закрыта белками","correct":false,"feedback":"Обе цепи доступны; выбор новой цепи нужен для сохранения информации, а не из-за доступности."},{"id":"S8-L03-3","text":"В ошибочной паре оба основания нормальные; исправлять нужно новую цепь, а матрицу сохранить как образец","correct":true,"feedback":"Иначе в половине случаев заменялся бы нуклеотид матрицы, и исходная последовательность была бы утрачена."}]},"widget":{"kind":"dna","title":"","s":{"title":"Метка новой цепи","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["разрыв в новой цепи есть","метки нет"],"scene":"s1b","args":[["off","on","yes"],["off","on","no"]],"L":{"s1_proof":"Коррекция 3′-конца ДНК-полимеразой","s1_mmr":"Репарация ошибочно спаренных нуклеотидов (MMR)","s1_mark":"Метка новой цепи — разрыв в ней","s1_on":"работает","s1_off":"выключена","s1_mark_yes":"есть","s1_mark_no":"нет (разрывы уже сшиты)","s1_ctrl_note":"Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.","s1_pA":"А. Сразу после синтеза новой цепи","s1_pA_syn":"А. Во время синтеза: 3′-конец растущей цепи","s1_pB":"Б. После следующей репликации: две дочерние молекулы","s1_lbl_tpl":"матрица (старая цепь)","s1_lbl_new":"новая цепь","s1_lbl_proof":"неверный C отщеплён с 3′-конца, на его место встал T","s1_lbl_patch":"зелёный участок новой цепи вырезан и синтезирован заново","s1_lbl_patch2":"новую цепь узнали по разрыву в ней; матрица не менялась","s1_lbl_nomark":"ошибочная пара узнана, но не определено, какая цепь новая","s1_lbl_none":"ошибочная пара C·A осталась в новой цепи","s1_lbl_d1":"копия матрицы","s1_lbl_d2":"копия новой цепи","s1_lbl_same":"в обеих молекулах на этом месте пара T–A, как в исходной","s1_lbl_fixed":"во второй молекуле пара C–G вместо T–A — изменение закреплено","s1_r_mis":"Ошибочная пара C·A","s1_r_mis_s":"после окончания синтеза новой цепи","s1_v_mis_yes":"осталась","s1_v_mis_no":"не осталась","s1_r_where":"Где исправлена ошибка","s1_v_where_proof":"на 3′-конце, во время синтеза","s1_v_where_mmr":"после синтеза: заменён участок новой цепи","s1_v_where_nomark":"не исправлена: новая цепь не отмечена","s1_v_where_none":"не исправлена","s1_r_next":"После следующей репликации","s1_r_next_s":"пара на месте ошибки в двух дочерних молекулах","s1_v_next_same":"T–A и T–A, как в исходной молекуле","s1_v_next_fixed":"T–A и C–G: в одной молекуле из двух изменение","s1_r_after":"Узнает ли MMR пару C–G после репликации","s1_v_after":"нет: это обычная комплементарная пара","s1_cap_proof":"Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.","s1_cap_proof_z":"Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.","s1_cap_mmr":"Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.","s1_cap_mmr_z":"Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.","s1_cap_nomark":"Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.","s1_cap_nomark_z":"Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.","s1_cap_none":"Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.","s1_cap_none_z":"После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.","s1_e_pol":"ДНК-полимераза"},"notes":["По разрыву узнана новая цепь: её участок с ошибкой заменён.","Ошибочная пара узнана, но новая цепь не отмечена — в модели исправление не начинается."],"static":["По разрыву узнана новая цепь: её участок с ошибкой заменён."]}}},{"id":"fixation","section":0,"questions":[1,2],"title":"Как изменение закрепляется при репликации","keywords":["закрепление","мутация","дезаминирование","транзиция"],"lead":["Ошибочная пара и повреждённое основание — временные состояния. Что происходит, если их не исправили до репликации?","Это объясняет, почему мутация — изменение, которое «пережило» репликация."],"mechanism":["При репликации цепи расходятся, и каждая служит матрицей.","Цепь с исходным нуклеотидом даёт молекулу с исходной парой; цепь с ошибочным нуклеотидом — молекулу, где напротив него встал комплементарный.","В этой второй молекуле обе цепи согласованы: ошибочной пары нет, и ни коррекция, ни MMR её не узнают.","Так C напротив A превращается в пару C–G вместо T–A в одной из двух дочерних молекул."],"paragraphs":["Так же закрепляется повреждение. Цитозин самопроизвольно теряет аминогруппу и превращается в [[T10|урацил]]; урацил спаривается с аденином. Если его не удалить до репликации, в одной дочерней молекуле появится пара U–A, а после следующей репликации — T–A вместо исходной C–G.","По оценке, приведённой в учебнике Alberts et al., в диплоидной клетке млекопитающего за сутки дезаминируется около 100 цитозинов. Если цитозин метилирован (5-метилцитозин), при дезаминировании сразу образуется тимин — нормальное основание ДНК; такие места чаще дают замену C–G на T–A.","Решающее значение имеет время: успеет ли система исправления до репликации. После репликации исправлять уже нечего."],"conditions":"Схема шага — модель вкладки 1, панель «после следующей репликации». Число дезаминирований — оценка из учебника Alberts et al. для диплоидной клетки млекопитающего за 24 ч.","sources":["Alberts2022"],"quiz":{"id":"S8-L04","question":"Ошибочная пара C·A не исправлена, произошла репликация. Что получится?","options":[{"id":"S8-L04-1","text":"Одна молекула с исходной парой T–A, другая — с C–G","correct":true,"feedback":"Каждая цепь служит матрицей: A даёт пару A–T, C — пару C–G."},{"id":"S8-L04-2","text":"Обе молекулы с ошибочной парой C·A","correct":false,"feedback":"Ошибочная пара не копируется: напротив каждого основания встаёт комплементарный нуклеотид."},{"id":"S8-L04-3","text":"Обе молекулы с исходной парой T–A","correct":false,"feedback":"Напротив C полимераза ставит G; ошибка в одной из молекул закрепляется."}]},"widget":{"kind":"dna","title":"","s":{"title":"Закрепление при репликации","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["ошибка не исправлена"],"scene":"s1b","args":[["off","off","yes"]],"L":{"s1_proof":"Коррекция 3′-конца ДНК-полимеразой","s1_mmr":"Репарация ошибочно спаренных нуклеотидов (MMR)","s1_mark":"Метка новой цепи — разрыв в ней","s1_on":"работает","s1_off":"выключена","s1_mark_yes":"есть","s1_mark_no":"нет (разрывы уже сшиты)","s1_ctrl_note":"Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.","s1_pA":"А. Сразу после синтеза новой цепи","s1_pA_syn":"А. Во время синтеза: 3′-конец растущей цепи","s1_pB":"Б. После следующей репликации: две дочерние молекулы","s1_lbl_tpl":"матрица (старая цепь)","s1_lbl_new":"новая цепь","s1_lbl_proof":"неверный C отщеплён с 3′-конца, на его место встал T","s1_lbl_patch":"зелёный участок новой цепи вырезан и синтезирован заново","s1_lbl_patch2":"новую цепь узнали по разрыву в ней; матрица не менялась","s1_lbl_nomark":"ошибочная пара узнана, но не определено, какая цепь новая","s1_lbl_none":"ошибочная пара C·A осталась в новой цепи","s1_lbl_d1":"копия матрицы","s1_lbl_d2":"копия новой цепи","s1_lbl_same":"в обеих молекулах на этом месте пара T–A, как в исходной","s1_lbl_fixed":"во второй молекуле пара C–G вместо T–A — изменение закреплено","s1_r_mis":"Ошибочная пара C·A","s1_r_mis_s":"после окончания синтеза новой цепи","s1_v_mis_yes":"осталась","s1_v_mis_no":"не осталась","s1_r_where":"Где исправлена ошибка","s1_v_where_proof":"на 3′-конце, во время синтеза","s1_v_where_mmr":"после синтеза: заменён участок новой цепи","s1_v_where_nomark":"не исправлена: новая цепь не отмечена","s1_v_where_none":"не исправлена","s1_r_next":"После следующей репликации","s1_r_next_s":"пара на месте ошибки в двух дочерних молекулах","s1_v_next_same":"T–A и T–A, как в исходной молекуле","s1_v_next_fixed":"T–A и C–G: в одной молекуле из двух изменение","s1_r_after":"Узнает ли MMR пару C–G после репликации","s1_v_after":"нет: это обычная комплементарная пара","s1_cap_proof":"Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.","s1_cap_proof_z":"Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.","s1_cap_mmr":"Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.","s1_cap_mmr_z":"Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.","s1_cap_nomark":"Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.","s1_cap_nomark_z":"Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.","s1_cap_none":"Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.","s1_cap_none_z":"После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.","s1_e_pol":"ДНК-полимераза"},"notes":["Во второй молекуле пара C–G вместо T–A: изменение закреплено, MMR его не узнаёт."],"static":["Во второй молекуле пара C–G вместо T–A: изменение закреплено, MMR его не узнаёт."]}}},{"id":"barriers-in-series","section":0,"questions":[1],"title":"Почему несколько несовершенных барьеров дают высокую точность","keywords":["последовательные этапы","доля пропущенных ошибок","перемножение"],"lead":["Уже известно: выбор нуклеотида, коррекция и MMR работают один за другим (БИО-8·2, БИО-8·3).","Новое: что следует из того, что каждый этап исправляет лишь часть ошибок, дошедших до него."],"mechanism":["Каждый этап пропускает определённую долю ошибок, которые до него дошли.","Поэтому итог равен произведению: число возникших ошибок × доля, пропущенная коррекцией, × доля, пропущенная MMR.","Если этап ослаб и пропускает в 10 раз больше, итог растёт в 10 раз — независимо от того, насколько хорошо работают остальные.","Ошибка, не исправленная до репликации, закрепляется; время работы этапа так же важно, как его эффективность."],"paragraphs":["В учебной модели копируется 10¹⁰ нуклеотидов; при ошибках выбора 1 на 10 000, коррекции 99 % и MMR 99 % возникает миллион ошибок, после коррекции остаётся 10 000, после MMR — 100. Все проценты — учебные значения, а не измерения для клеток человека.","Обратная задача: одинаковый итог (например, 100 изменений) дают разные сочетания этапов. Поэтому по одному итоговому числу нельзя установить, какой этап ослаб; нужны дополнительные наблюдения — число ошибочных пар до MMR или состав изменений (следующий шаг).","В клетке этапы не вполне независимы: эффективность каждого зависит от типа ошибки, а MMR узнаёт новую цепь по разрывам, которые оставляет синтез. Модель этого не показывает.","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель с условными значениями; принцип последовательных этапов — по учебнику Alberts et al. и обзору (три процесса работают последовательно).","sources":["Alberts2022","KunkelErie2015"],"quiz":{"id":"S8-L05","question":"Коррекция исправляет 99 % ошибок, MMR — 99 % оставшихся. Во сколько раз они вместе уменьшают число ошибок?","options":[{"id":"S8-L05-1","text":"В 198 раз","correct":false,"feedback":"Доли пропущенных ошибок перемножаются, а не складываются: 0,01 × 0,01."},{"id":"S8-L05-2","text":"В 10 000 раз","correct":true,"feedback":"Каждый этап пропускает 1 из 100; вместе — 1 из 100 × 100 = 10 000."},{"id":"S8-L05-3","text":"В 100 раз: второй этап уже ничего не добавляет","correct":false,"feedback":"Второй этап работает с ошибками, пропущенными первым, и тоже исправляет 99 % из них."}]},"widget":{"kind":"dna","title":"","s":{"title":"Последовательные барьеры (условные числа)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["обе системы","без MMR","MMR не успела до репликации"],"scene":"a1","args":[["4","99","99","yes"],["4","99","0","yes"],["4","99","99","no"]],"L":{"s1a_prob":"Ни один этап проверки не исправляет все ошибки. Почему вместе несколько несовершенных этапов дают высокую точность — и можно ли по итоговому числу ошибок понять, какой этап ослаб?","s1a_e":"Ошибки при выборе нуклеотида (условно)","s1a_e_4":"1 на 10 000","s1a_e_5":"1 на 100 000","s1a_p":"Коррекция 3′-конца исправляет","s1a_p_0":"0 %","s1a_p_90":"90 %","s1a_p_99":"99 %","s1a_m":"MMR исправляет оставшиеся","s1a_m_0":"0 %","s1a_m_99":"99 %","s1a_m_999":"99,9 %","s1a_t":"MMR успевает до следующей репликации","s1a_t_yes":"да","s1a_t_no":"нет","s1a_note":"Копируется условно 10 млрд нуклеотидов. Все проценты и частоты — учебные значения модели, а не измеренные величины. Каждый этап работает с ошибками, которые пропустил предыдущий; в модели доля исправленных не зависит от того, сколько ошибок дошло до этапа.","s1a_pA":"А. Ошибки после каждого этапа (условные числа)","s1a_ax_log":"шкала логарифмическая","s1a_bar_arisen":"возникло","s1a_bar_afterP":"после коррекции","s1a_bar_afterM":"после MMR","s1a_bar_fixed":"закрепилось","s1a_f_p":"коррекция: −{p} %","s1a_f_p0":"коррекции нет","s1a_f_m":"MMR: −{m} %","s1a_f_m0":"MMR нет","s1a_f_m_late":"MMR не успела","s1a_f_t_yes":"репликация","s1a_f_t_no":"репликация до MMR","s1a_pB":"Б. Итог копирования","s1a_lbl_rate":"Закрепилось {k} изменений на 10¹⁰ нуклеотидов — около 1 на 10{e}","s1a_lbl_factor":"Два этапа исправления вместе снизили число ошибок в {x} раз","s1a_lbl_factor1":"Исправление снизило число ошибок в {x} раз","s1a_lbl_factor0":"Исправления не было: закрепились все ошибки выбора","s1a_lbl_mask":"Наблюдение: известно только итоговое число закреплённых изменений","s1a_r_arisen":"Возникло ошибок","s1a_r_arisen_s":"при выборе нуклеотида, на 10¹⁰ присоединений","s1a_r_afterP":"Осталось после коррекции","s1a_r_afterM":"Осталось после MMR","s1a_r_fixed":"Закрепилось после репликации","s1a_r_fixed_s":"каждое — в одной из двух дочерних молекул","s1a_v_n":"{n}","s1a_cap_norm":"Этапы работают последовательно: коррекция исправляет часть возникших ошибок, MMR — часть оставшихся. Поэтому доли пропущенных ошибок перемножаются, и вместе этапы снижают число ошибок в {x} раз — больше, чем любой из них по отдельности.","s1a_cap_norm_z":"При последовательных этапах высокая точность не требует совершенства каждого: достаточно, чтобы каждый пропускал лишь часть ошибок. Зато ослабление любого этапа увеличивает итог во столько раз, во сколько выросла доля пропущенных им ошибок.","s1a_cap_late":"MMR не успела исправить ошибки до следующей репликации: всё, что прошло коррекцию, закрепилось. Время работы этапа так же важно, как его эффективность.","s1a_cap_late0":"Коррекции нет, а MMR не успела исправить ошибки до следующей репликации: закрепились все ошибки выбора нуклеотида. Время работы этапа так же важно, как его эффективность.","s1a_cap_late0_z":"Ошибочная пара — временное состояние: после репликации она превращается в обычную пару в одной из молекул, и MMR её уже не узнаёт.","s1a_cap_late_z":"Ошибочная пара — временное состояние: после репликации она превращается в обычную пару в одной из молекул, и MMR её уже не узнаёт.","s1a_cap_none":"Обе системы исправления выключены: закрепляются все ошибки выбора нуклеотида.","s1a_cap_none_z":"Одной комплементарности недостаточно для точности копирования генома: даже 1 ошибка на 10 000 присоединений дала бы на копию 10 млрд нуклеотидов около миллиона изменений.","s1a_cap_onlyp":"Работает только коррекция 3′-конца: она снизила число ошибок в {x} раз. Всё, что она пропустила, закрепляется при репликации — второго этапа нет.","s1a_cap_onlyp_z":"Каждый этап снижает итог во столько раз, во сколько уменьшает число ошибок; без MMR итог больше ровно во столько раз, во сколько MMR его снижала.","s1a_cap_onlym":"Коррекции нет, работает только MMR: она снизила число ошибок в {x} раз. Все ошибки выбора доходят до MMR, и её доля пропущенных определяет итог.","s1a_cap_onlym_z":"В модели итог при одном этапе больше, чем при том же этапе вместе с другим: второй этап работает с ошибками, которые пропустил первый.","s1a_cap_mask":"Обратная задача: известно только, сколько изменений закрепилось. Переключатели скрыты.","s1a_cap_mask_z":"Подумайте, сколько разных сочетаний этапов дают такой же итог.","s1a_take":"Несколько несовершенных этапов, работающих последовательно, вместе обеспечивают высокую точность: доли пропущенных ошибок перемножаются. Поэтому ослабление одного этапа увеличивает итоговое число ошибок во много раз, а время тоже имеет значение — ошибка, не исправленная до репликации, закрепляется. Одно итоговое число не указывает на причину: одинаковый результат дают разные сочетания этапов. Различить их можно по дополнительным наблюдениям — числу ошибочных пар до работы MMR или по типу оставшихся изменений.","s1a_lim":"Модель не показывает, что эффективность этапов различается для разных ошибок: одни ошибочные пары полимераза делает и исправляет легче других, а в повторах одного нуклеотида чаще возникают вставки и выпадения. Модель считает этапы независимыми; в клетке они связаны (MMR узнаёт новую цепь по разрывам, которые оставляет синтез). Модель не учитывает повреждения ДНК и ошибки при их репарации, а также то, что изменение может не повлиять на белок. Проценты и частоты модели — учебные, а не измеренные для клеток человека.","s1a_new":"Если этапы исправления работают последовательно, ослабление двух этапов сразу должно увеличить число новых мутаций сильнее, чем ослабление каждого из них. В культуре опухолевых клеток мыши одновременно разрушали белок MMR (Msh2) и вызывали синтез мутантной полимеразы ε с нарушенной коррекцией; собственная нормальная полимераза ε в клетках оставалась. При двух воздействиях вместе клоны, устойчивые к токсичному веществу, появлялись заметно чаще, чем при каждом отдельно. Это согласуется с моделью последовательных барьеров.","s1a_how":"белок MMR разрушали по команде (добавлением вещества в среду), мутантную полимеразу включали отдельно и подсчитывали клоны, устойчивые к веществу. Частота устойчивых клонов — косвенный показатель частоты мутаций, а не их прямой подсчёт; данные получены на одной линии клеток мыши.","s1a_tl_note":"Порядок этапов — учебная модель. Все числа на схеме условные; шкала столбцов логарифмическая.","s1a_tl_1":"Выбор нуклеотида: при копировании условных 10¹⁰ нуклеотидов часть присоединённых оказывается неверной — возникают ошибочные пары.","s1a_tl_2":"Коррекция 3′-конца: экзонуклеаза ДНК-полимеразы сразу удаляет заданную бегунком долю возникших ошибок.","s1a_tl_2_0":"Коррекции нет: все возникшие ошибки остаются в новой цепи.","s1a_tl_3":"MMR: после синтеза исправляется заданная бегунком доля ошибок, оставшихся после коррекции.","s1a_tl_3_0":"MMR нет: ошибки, пропущенные коррекцией, не исправляются.","s1a_tl_3_late":"MMR не успела до следующей репликации: ошибки, пропущенные коррекцией, не исправлены.","s1a_tl_4":"Следующая репликация: каждая оставшаяся ошибочная пара закрепляется как изменение последовательности в одной из двух дочерних молекул.","s1a_u_none":"","s1a_u_pc":"%","s1a_ex":"1 на 10 000","s1a_ex5":"1 на 100 000","s1a_rx_note":"Бегунки переходят только по засечкам: это положения модели, а не измеренные значения; расстояния между засечками не пропорциональны значениям."},"notes":["Итог 100 на 10¹⁰: два этапа вместе снизили число ошибок в 10 000 раз.","Без MMR итог в 100 раз больше — 10 000.","MMR не успела до репликации: закрепилось 10 000."],"static":["Итог 100 на 10¹⁰: два этапа вместе снизили число ошибок в 10 000 раз."]}},"level":"adv"},{"id":"spectrum-not-count","section":0,"questions":[1],"title":"Одно число — разные причины: по составу изменений видно, какой этап нарушен","keywords":["состав изменений","вставки и выпадения","повторы одного нуклеотида","ослабление коррекции","нарушение MMR"],"lead":["Уже известно: одинаковое итоговое число ошибок дают разные сочетания этапов (БИО-8·5).","Новое: в клетках человека нарушения разных этапов оставляют разные следы в последовательности."],"mechanism":["Полимераза особенно часто ошибается в участках из повторов одного нуклеотида: там легко добавить или пропустить один нуклеотид.","В опухолях человека с нарушенной MMR в таких участках преобладают выпадения нуклеотидов.","При мутантной полимеразе с нарушенной коррекцией в тех же участках преобладают вставки одного нуклеотида.","При утрате обеих систем изменений особенно много — это согласуется с последовательной работой этапов."],"paragraphs":["Отсюда следует, что состав изменений, а не только их число, указывает на нарушенный этап. Такие «следы» удаётся различить даже в нормальных клетках крови людей, унаследовавших дефект обеих копий гена MMR.","Как это узнали: сравнивали последовательности ДНК опухолей и нормальных клеток тех же людей и подсчитывали изменения разных типов в участках из повторов. Тип изменений указывает на нарушенный этап, но не исключает других причин.","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Данные — опухоли и нормальные клетки человека (сравнение последовательностей); клинические примеры приводятся для демонстрации патофизиологического значения клеточного механизма.","sources":["Chung2021"],"quiz":{"id":"S8-L06","question":"В двух линиях клеток изменений одинаково много. В первой преобладают выпадения нуклеотидов в повторах, во второй — вставки одного нуклеотида. Какой вывод допустим?","options":[{"id":"S8-L06-1","text":"Причины одинаковы, раз число изменений одинаково","correct":false,"feedback":"Одинаковое число дают разные причины; состав их различает."},{"id":"S8-L06-2","text":"Обе системы нарушены в обеих линиях","correct":false,"feedback":"При утрате обеих систем изменений было бы особенно много и присутствовали бы оба типа следов."},{"id":"S8-L06-3","text":"Вероятно, в первой нарушена MMR, во второй — коррекция полимеразы; это гипотеза, которую нужно проверить","correct":true,"feedback":"Состав изменений указывает на этап, но не доказывает причину: нужна проверка белков этих систем."}]},"widget":{"kind":"dna","title":"","s":{"title":"Одинаковый итог — разные сочетания","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["ошибки 1 на 10⁵, коррекция 90 %, MMR 99 %","ошибки 1 на 10⁴, коррекция 90 %, MMR 99,9 %"],"scene":"a1","args":[["5","90","99","yes"],["4","90","999","yes"]],"L":{"s1a_prob":"Ни один этап проверки не исправляет все ошибки. Почему вместе несколько несовершенных этапов дают высокую точность — и можно ли по итоговому числу ошибок понять, какой этап ослаб?","s1a_e":"Ошибки при выборе нуклеотида (условно)","s1a_e_4":"1 на 10 000","s1a_e_5":"1 на 100 000","s1a_p":"Коррекция 3′-конца исправляет","s1a_p_0":"0 %","s1a_p_90":"90 %","s1a_p_99":"99 %","s1a_m":"MMR исправляет оставшиеся","s1a_m_0":"0 %","s1a_m_99":"99 %","s1a_m_999":"99,9 %","s1a_t":"MMR успевает до следующей репликации","s1a_t_yes":"да","s1a_t_no":"нет","s1a_note":"Копируется условно 10 млрд нуклеотидов. Все проценты и частоты — учебные значения модели, а не измеренные величины. Каждый этап работает с ошибками, которые пропустил предыдущий; в модели доля исправленных не зависит от того, сколько ошибок дошло до этапа.","s1a_pA":"А. Ошибки после каждого этапа (условные числа)","s1a_ax_log":"шкала логарифмическая","s1a_bar_arisen":"возникло","s1a_bar_afterP":"после коррекции","s1a_bar_afterM":"после MMR","s1a_bar_fixed":"закрепилось","s1a_f_p":"коррекция: −{p} %","s1a_f_p0":"коррекции нет","s1a_f_m":"MMR: −{m} %","s1a_f_m0":"MMR нет","s1a_f_m_late":"MMR не успела","s1a_f_t_yes":"репликация","s1a_f_t_no":"репликация до MMR","s1a_pB":"Б. Итог копирования","s1a_lbl_rate":"Закрепилось {k} изменений на 10¹⁰ нуклеотидов — около 1 на 10{e}","s1a_lbl_factor":"Два этапа исправления вместе снизили число ошибок в {x} раз","s1a_lbl_factor1":"Исправление снизило число ошибок в {x} раз","s1a_lbl_factor0":"Исправления не было: закрепились все ошибки выбора","s1a_lbl_mask":"Наблюдение: известно только итоговое число закреплённых изменений","s1a_r_arisen":"Возникло ошибок","s1a_r_arisen_s":"при выборе нуклеотида, на 10¹⁰ присоединений","s1a_r_afterP":"Осталось после коррекции","s1a_r_afterM":"Осталось после MMR","s1a_r_fixed":"Закрепилось после репликации","s1a_r_fixed_s":"каждое — в одной из двух дочерних молекул","s1a_v_n":"{n}","s1a_cap_norm":"Этапы работают последовательно: коррекция исправляет часть возникших ошибок, MMR — часть оставшихся. Поэтому доли пропущенных ошибок перемножаются, и вместе этапы снижают число ошибок в {x} раз — больше, чем любой из них по отдельности.","s1a_cap_norm_z":"При последовательных этапах высокая точность не требует совершенства каждого: достаточно, чтобы каждый пропускал лишь часть ошибок. Зато ослабление любого этапа увеличивает итог во столько раз, во сколько выросла доля пропущенных им ошибок.","s1a_cap_late":"MMR не успела исправить ошибки до следующей репликации: всё, что прошло коррекцию, закрепилось. Время работы этапа так же важно, как его эффективность.","s1a_cap_late0":"Коррекции нет, а MMR не успела исправить ошибки до следующей репликации: закрепились все ошибки выбора нуклеотида. Время работы этапа так же важно, как его эффективность.","s1a_cap_late0_z":"Ошибочная пара — временное состояние: после репликации она превращается в обычную пару в одной из молекул, и MMR её уже не узнаёт.","s1a_cap_late_z":"Ошибочная пара — временное состояние: после репликации она превращается в обычную пару в одной из молекул, и MMR её уже не узнаёт.","s1a_cap_none":"Обе системы исправления выключены: закрепляются все ошибки выбора нуклеотида.","s1a_cap_none_z":"Одной комплементарности недостаточно для точности копирования генома: даже 1 ошибка на 10 000 присоединений дала бы на копию 10 млрд нуклеотидов около миллиона изменений.","s1a_cap_onlyp":"Работает только коррекция 3′-конца: она снизила число ошибок в {x} раз. Всё, что она пропустила, закрепляется при репликации — второго этапа нет.","s1a_cap_onlyp_z":"Каждый этап снижает итог во столько раз, во сколько уменьшает число ошибок; без MMR итог больше ровно во столько раз, во сколько MMR его снижала.","s1a_cap_onlym":"Коррекции нет, работает только MMR: она снизила число ошибок в {x} раз. Все ошибки выбора доходят до MMR, и её доля пропущенных определяет итог.","s1a_cap_onlym_z":"В модели итог при одном этапе больше, чем при том же этапе вместе с другим: второй этап работает с ошибками, которые пропустил первый.","s1a_cap_mask":"Обратная задача: известно только, сколько изменений закрепилось. Переключатели скрыты.","s1a_cap_mask_z":"Подумайте, сколько разных сочетаний этапов дают такой же итог.","s1a_take":"Несколько несовершенных этапов, работающих последовательно, вместе обеспечивают высокую точность: доли пропущенных ошибок перемножаются. Поэтому ослабление одного этапа увеличивает итоговое число ошибок во много раз, а время тоже имеет значение — ошибка, не исправленная до репликации, закрепляется. Одно итоговое число не указывает на причину: одинаковый результат дают разные сочетания этапов. Различить их можно по дополнительным наблюдениям — числу ошибочных пар до работы MMR или по типу оставшихся изменений.","s1a_lim":"Модель не показывает, что эффективность этапов различается для разных ошибок: одни ошибочные пары полимераза делает и исправляет легче других, а в повторах одного нуклеотида чаще возникают вставки и выпадения. Модель считает этапы независимыми; в клетке они связаны (MMR узнаёт новую цепь по разрывам, которые оставляет синтез). Модель не учитывает повреждения ДНК и ошибки при их репарации, а также то, что изменение может не повлиять на белок. Проценты и частоты модели — учебные, а не измеренные для клеток человека.","s1a_new":"Если этапы исправления работают последовательно, ослабление двух этапов сразу должно увеличить число новых мутаций сильнее, чем ослабление каждого из них. В культуре опухолевых клеток мыши одновременно разрушали белок MMR (Msh2) и вызывали синтез мутантной полимеразы ε с нарушенной коррекцией; собственная нормальная полимераза ε в клетках оставалась. При двух воздействиях вместе клоны, устойчивые к токсичному веществу, появлялись заметно чаще, чем при каждом отдельно. Это согласуется с моделью последовательных барьеров.","s1a_how":"белок MMR разрушали по команде (добавлением вещества в среду), мутантную полимеразу включали отдельно и подсчитывали клоны, устойчивые к веществу. Частота устойчивых клонов — косвенный показатель частоты мутаций, а не их прямой подсчёт; данные получены на одной линии клеток мыши.","s1a_tl_note":"Порядок этапов — учебная модель. Все числа на схеме условные; шкала столбцов логарифмическая.","s1a_tl_1":"Выбор нуклеотида: при копировании условных 10¹⁰ нуклеотидов часть присоединённых оказывается неверной — возникают ошибочные пары.","s1a_tl_2":"Коррекция 3′-конца: экзонуклеаза ДНК-полимеразы сразу удаляет заданную бегунком долю возникших ошибок.","s1a_tl_2_0":"Коррекции нет: все возникшие ошибки остаются в новой цепи.","s1a_tl_3":"MMR: после синтеза исправляется заданная бегунком доля ошибок, оставшихся после коррекции.","s1a_tl_3_0":"MMR нет: ошибки, пропущенные коррекцией, не исправляются.","s1a_tl_3_late":"MMR не успела до следующей репликации: ошибки, пропущенные коррекцией, не исправлены.","s1a_tl_4":"Следующая репликация: каждая оставшаяся ошибочная пара закрепляется как изменение последовательности в одной из двух дочерних молекул.","s1a_u_none":"","s1a_u_pc":"%","s1a_ex":"1 на 10 000","s1a_ex5":"1 на 100 000","s1a_rx_note":"Бегунки переходят только по засечкам: это положения модели, а не измеренные значения; расстояния между засечками не пропорциональны значениям."},"notes":["Итог 100; после коррекции осталось 10 000.","Итог тоже 100; но после коррекции осталось 100 000 — промежуточное наблюдение различает сочетания."],"static":["Итог 100; после коррекции осталось 10 000."]}},"level":"adv"},{"id":"damage-sources","section":1,"questions":[2],"title":"Откуда берутся повреждения ДНК","keywords":["депуринизация","дезаминирование","окисление","ультрафиолет","алкилирование"],"lead":["ДНК химически не инертна: даже без внешних воздействий её основания изменяются в каждой клетке ежедневно.","Это вторая часть вопроса: какие повреждения бывают и почему их нужно устранять до репликации.","Раздел относится к вопросу 6 коллоквиума 2 (предварительный список) и вопросу 17 зачёта."],"mechanism":["Гидролиз: связь основания с сахаром рвётся, и основание отщепляется — остаётся [[T12|AP-сайт]]; чаще теряются пурины (депуринизация).","Дезаминирование: цитозин теряет аминогруппу и превращается в урацил; аденин и гуанин — в гипоксантин и ксантин.","Окисление активными формами кислорода изменяет основания (например, образуется 8-оксогуанин); метилирующие вещества присоединяют метильные группы.","Ультрафиолет сшивает соседние пиримидины одной цепи — образуется [[T14|пиримидиновый димер]]; ионизирующее излучение разрывает цепи."],"paragraphs":["По оценкам, приведённым в учебнике Alberts et al., в диплоидной клетке млекопитающего за сутки происходит около 18 000 депуринизаций, около 100 дезаминирований цитозина, около 1 500 окислений гуанина до 8-оксогуанина. Это оценки: они показывают порядок величины, а не точное число в каждой клетке.","Неисправленное повреждение опасно при репликации: напротив изменённого основания может встать неверный нуклеотид, а напротив AP-сайта полимераза вообще не может выбрать нуклеотид по комплементарности.","Основания ДНК таковы, что продукты их повреждения отличимы от нормальных: урацил, гипоксантин и ксантин не входят в состав ДНК в норме, поэтому их можно узнать. Тимин аминогруппы не имеет, поэтому дезаминирования тимина не бывает."],"conditions":"Числа — оценки из учебника Alberts et al. для диплоидной клетки млекопитающего за 24 ч, без внешних воздействий.","sources":["Alberts2022"],"quiz":{"id":"S8-L07","question":"Какое повреждение встречается в клетке чаще всего, по приведённым оценкам?","options":[{"id":"S8-L07-1","text":"Потеря пуриновых оснований (депуринизация)","correct":true,"feedback":"Около 18 000 в сутки на клетку — больше, чем любое другое спонтанное повреждение в таблице."},{"id":"S8-L07-2","text":"Дезаминирование цитозина","correct":false,"feedback":"Около 100 в сутки — в сотни раз реже депуринизации."},{"id":"S8-L07-3","text":"Пиримидиновые димеры","correct":false,"feedback":"Димеры возникают при ультрафиолетовом облучении; без него их почти нет."}]},"widget":{"kind":"dna","title":"","s":{"title":"Три повреждения одной цепи","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["урацил вместо цитозина","пиримидиновый димер","AP-сайт"],"scene":"s2b","args":[["u","ok",{"rec":false}],["dimer","ok",{"rec":false}],["ap","ok",{"nuc":false}]],"L":{"s2_les":"Повреждение в одной цепи","s2_les_u":"урацил вместо цитозина","s2_les_dimer":"пиримидиновый димер","s2_les_ap":"основание утрачено (AP-сайт)","s2_opp":"Противоположная цепь на этом участке","s2_opp_ok":"не повреждена","s2_opp_dmg":"тоже повреждена","s2_pA":"А. Участок ДНК после работы пути: {p}","s2_path_ber":"вырезание основания (BER)","s2_path_ner":"вырезание нуклеотидов (NER)","s2_lbl_top":"цепь без повреждения","s2_lbl_bot":"цепь, в которой возникло повреждение","s2_st_lesion":"повреждение осталось: его не узнали","s2_st_ap":"основания нет, цепь не надрезана: остался AP-сайт","s2_st_opened":"повреждение узнано, но участок не вырезан","s2_st_gap":"пробел в цепи: участок вырезан, но не достроен","s2_st_nick":"участок достроен, остался разрыв в одной цепи","s2_st_restored":"исходная последовательность восстановлена по другой цепи","s2_st_notpl":"вырезан участок, напротив которого тоже повреждение: правильной матрицы нет","s2_pB":"Б. Этапы пути: ✓ — пройден, ✕ — остановка, — — не начат","s2_e_ber_rec":"гликозилаза","s2_e_ber_nuc":"AP-эндонуклеаза","s2_e_ner_rec":"XPC и TFIIH","s2_e_ner_nuc":"две нуклеазы","s2_e_ber_pol":"полимераза","s2_e_ner_pol":"полимераза","s2_e_ber_lig":"лигаза","s2_e_ner_lig":"лигаза","s2_step_ber_rec":"узнаёт и удаляет\nизменённое основание","s2_step_ber_nuc":"надрезает цепь\nу AP-сайта","s2_step_ber_pol":"встраивает\n1 нуклеотид","s2_step_ber_lig":"сшивает\nразрыв","s2_step_ner_rec":"находят искажение\nи проверяют участок","s2_step_ner_nuc":"надрезают цепь\nпо обе стороны","s2_step_ner_pol":"достраивает около\n30 нуклеотидов","s2_step_ner_lig":"сшивает\nразрыв","s2_mk_skip":"не нужна","s2_mk_notpl":"нет матрицы","s2_r_path":"Путь","s2_v_path_ber":"вырезание основания (BER)","s2_v_path_ner":"вырезание нуклеотидов (NER)","s2_r_cut":"Что удаляется","s2_v_cut_ber":"одно основание, затем один нуклеотид","s2_v_cut_ner":"участок цепи около 30 нуклеотидов у человека (на схеме укорочен)","s2_r_tpl":"Матрица для достройки","s2_v_tpl_ok":"противоположная цепь — не повреждена","s2_v_tpl_dmg":"противоположная цепь повреждена на этом участке","s2_r_state":"Итог","s2_v_st_lesion":"повреждение осталось","s2_v_st_ap":"AP-сайт","s2_v_st_opened":"повреждение узнано, не вырезано","s2_v_st_gap":"пробел в одной цепи","s2_v_st_nick":"разрыв в одной цепи","s2_v_st_restored":"исходная последовательность восстановлена","s2_v_st_notpl":"восстановить по другой цепи нельзя","s2_cap_ok_u":"Урацил появился в ДНК при дезаминировании цитозина: пара U·G вместо C–G. Урацил-ДНК-гликозилаза узнаёт урацил и отщепляет его от сахара — остаётся AP-сайт. AP-эндонуклеаза надрезает цепь, полимераза по G другой цепи встраивает C, лигаза сшивает разрыв. Пара C–G восстановлена.","s2_cap_ok_u_z":"Урацила в ДНК быть не должно, поэтому его можно узнать по самому основанию. Если не удалить его до репликации, напротив U встанет A, и пара C–G в одной из дочерних молекул станет T–A после следующей репликации.","s2_cap_ok_dimer":"Два соседних пиримидина (здесь T и T) ковалентно сшиты, например после ультрафиолета; двойная спираль на этом участке искажена. Белки узнавания (среди них XPC) находят искажение, комплекс TFIIH раскрывает участок и проверяет повреждение, две нуклеазы надрезают цепь по обе стороны, участок около 30 нуклеотидов (у человека) удаляется, полимераза достраивает его по другой цепи, лигаза сшивает.","s2_cap_ok_dimer_z":"NER узнаёт не определённое основание, а искажение двойной спирали, поэтому один путь устраняет очень разные объёмные повреждения: димеры, крупные химические группы, присоединённые к основаниям.","s2_cap_ok_ap":"Основание оторвалось от сахара (так чаще всего теряются пурины), остов цел — это AP-сайт. Гликозилаза здесь не нужна: AP-сайт сразу узнаёт AP-эндонуклеаза. Дальше как в BER: надрез, встраивание одного нуклеотида по другой цепи, сшивание.","s2_cap_ok_ap_z":"AP-сайт — одновременно частое спонтанное повреждение и промежуточный продукт BER после гликозилазы: оба пути сходятся на одном этапе.","s2_cap_lesion_ber":"Нет белка узнавания: урацил никто не находит, и он остаётся в цепи. Следующие ферменты пути на месте, но им не с чем работать: AP-эндонуклеаза узнаёт AP-сайт, а не урацил.","s2_cap_lesion_ber_z":"Пути начинаются с узнавания повреждения; без узнавания исправные ферменты следующих этапов не включаются.","s2_cap_lesion_ner":"Нет белка узнавания: искажение спирали не найдено, и димер остаётся. В клетке есть и второй способ узнавания — по остановившейся РНК-полимеразе в транскрибируемом гене; в базовой модели он не показан.","s2_cap_lesion_ner_z":"Без узнавания повреждение сохраняется до репликации; при копировании напротив него может встать неверный нуклеотид.","s2_cap_ap":"Основания нет, а цепь не надрезана: AP-эндонуклеазы нет, и AP-сайт остаётся. Если урацил был удалён гликозилазой, это значит, что узнавание произошло, а остановился следующий этап.","s2_cap_ap_z":"Промежуточный продукт показывает, какой этап пройден и на каком путь остановился. AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности.","s2_cap_ap_src":"Основание оторвалось само, остов цел — это AP-сайт; гликозилаза здесь не нужна. Но AP-эндонуклеазы нет, цепь не надрезана, и AP-сайт остаётся.","s2_cap_ap_src_z":"AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности. Поэтому его нужно удалить до репликации.","s2_cap_opened":"Повреждение узнано и участок раскрыт, но нуклеаз, надрезающих цепь, нет: димер остаётся в цепи.","s2_cap_opened_z":"Узнать повреждение и удалить его — разные этапы; итог «повреждение осталось» ещё не говорит, какой из них не прошёл.","s2_cap_gap_ber":"Урацил удалён, цепь надрезана, но полимеразы нет: на месте одного нуклеотида пробел.","s2_cap_gap_ber_z":"Пробел — промежуточный продукт: повреждения уже нет, но нет и информации на этом месте. Её восстанавливают по противоположной цепи.","s2_cap_gap_ner":"Участок с димером вырезан, но полимеразы нет: в цепи пробел около 30 нуклеотидов (на схеме укорочен).","s2_cap_gap_ner_z":"Длинный пробел — промежуточный продукт NER; он сохраняется, пока по неповреждённой цепи не будет синтезирован новый участок.","s2_cap_nick":"Последовательность восстановлена по другой цепи, но лигазы нет: на границе нового участка остался разрыв сахаро-фосфатного остова.","s2_cap_nick_z":"Информация уже верна, но непрерывность цепи не восстановлена: разрыв в одной цепи — тоже промежуточный продукт, и его нужно сшить.","s2_cap_notpl":"Повреждения в обеих цепях на одном участке: после вырезания напротив пробела тоже повреждённое основание. В модели правильной матрицы для достройки нет; в клетке на таком участке возможны изменение последовательности или разрыв обеих цепей.","s2_cap_notpl_z":"Эксцизионная репарация точна потому, что информация записана дважды. Если обе копии на одном участке повреждены, восстановить её по этой молекуле нельзя — нужна другая молекула с той же последовательностью (вопрос 3).","s2_pA_an":"А. Участок ДНК: {p}"},"notes":["Урацил в паре с G: повреждение ещё не узнано.","Два соседних T сшиты: спираль на этом участке искажена.","Основание утрачено, остов цел."],"static":["Урацил в паре с G: повреждение ещё не узнано."]}}},{"id":"base-excision","section":1,"questions":[2],"title":"Вырезание основания (BER): изменённое основание и один нуклеотид","keywords":["BER","ДНК-гликозилаза","AP-сайт","AP-эндонуклеаза"],"lead":["Небольшие изменения одного основания — урацил, окисленные и метилированные основания — устраняет путь вырезания основания (BER).","Каждое изменённое основание узнаёт своя гликозилаза."],"mechanism":["[[T11|ДНК-гликозилаза]] (считается, что она движется по ДНК, выворачивая основания из спирали) узнаёт изменённое и отщепляет его от сахара; остов остаётся целым — образуется AP-сайт.","[[T13|AP-эндонуклеаза]] надрезает остов у AP-сайта; остаток сахара удаляется, и в цепи остаётся пробел в один нуклеотид.","ДНК-полимераза встраивает нуклеотид, комплементарный основанию противоположной цепи.","ДНК-лигаза сшивает разрыв."],"paragraphs":["AP-сайт, возникший самопроизвольно (например, при депуринизации), сразу узнаёт AP-эндонуклеаза: путь начинается со второго этапа. Так одна последовательность этапов устраняет и изменённые, и утраченные основания.","Для узнавания нужно, чтобы изменённое основание отличалось от нормальных. Урацил узнаётся урацил-ДНК-гликозилазой, а вот тимин, возникший при дезаминировании 5-метилцитозина, — нормальное основание; его узнаёт по ошибочной паре T·G особая гликозилаза, но эта репарация малоэффективна, и такие места чаще других дают изменения.","Промежуточные продукты пути — AP-сайт, пробел, разрыв — сами опасны, поэтому каждый быстро передаётся следующему ферменту и в норме не накапливается."],"conditions":"Схема шага — модель вкладки 2. В клетке BER может заменять и более длинный участок, чем один нуклеотид; модель показывает основной вариант.","sources":["Alberts2022","Beard2019"],"quiz":{"id":"S8-L08","question":"Что остаётся в ДНК, если гликозилаза удалила урацил, а AP-эндонуклеазы нет?","options":[{"id":"S8-L08-1","text":"Урацил","correct":false,"feedback":"Урацил уже удалён гликозилазой."},{"id":"S8-L08-2","text":"AP-сайт","correct":true,"feedback":"Гликозилаза отщепила основание, остов цел; надрезать цепь некому."},{"id":"S8-L08-3","text":"Пробел в один нуклеотид","correct":false,"feedback":"Пробел появляется после надреза AP-эндонуклеазой."}]},"widget":{"kind":"dna","title":"","s":{"title":"Этапы BER","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["все детали","нет AP-эндонуклеазы","нет полимеразы","нет лигазы"],"scene":"s2 около 30 нуклеотидов у человека (на схеме укорочен)","s2_r_tpl":"Матрица для достройки","s2_v_tpl_ok":"противоположная цепь — не повреждена","s2_v_tpl_dmg":"противоположная цепь повреждена на этом участке","s2_r_state":"Итог","s2_v_st_lesion":"повреждение осталось","s2_v_st_ap":"AP-сайт","s2_v_st_opened":"повреждение узнано, не вырезано","s2_v_st_gap":"пробел в одной цепи","s2_v_st_nick":"разрыв в одной цепи","s2_v_st_restored":"исходная последовательность восстановлена","s2_v_st_notpl":"восстановить по другой цепи нельзя","s2_cap_ok_u":"Урацил появился в ДНК при дезаминировании цитозина: пара U·G вместо C–G. Урацил-ДНК-гликозилаза узнаёт урацил и отщепляет его от сахара — остаётся AP-сайт. AP-эндонуклеаза надрезает цепь, полимераза по G другой цепи встраивает C, лигаза сшивает разрыв. Пара C–G восстановлена.","s2_cap_ok_u_z":"Урацила в ДНК быть не должно, поэтому его можно узнать по самому основанию. Если не удалить его до репликации, напротив U встанет A, и пара C–G в одной из дочерних молекул станет T–A после следующей репликации.","s2_cap_ok_dimer":"Два соседних пиримидина (здесь T и T) ковалентно сшиты, например после ультрафиолета; двойная спираль на этом участке искажена. Белки узнавания (среди них XPC) находят искажение, комплекс TFIIH раскрывает участок и проверяет повреждение, две нуклеазы надрезают цепь по обе стороны, участок около 30 нуклеотидов (у человека) удаляется, полимераза достраивает его по другой цепи, лигаза сшивает.","s2_cap_ok_dimer_z":"NER узнаёт не определённое основание, а искажение двойной спирали, поэтому один путь устраняет очень разные объёмные повреждения: димеры, крупные химические группы, присоединённые к основаниям.","s2_cap_ok_ap":"Основание оторвалось от сахара (так чаще всего теряются пурины), остов цел — это AP-сайт. Гликозилаза здесь не нужна: AP-сайт сразу узнаёт AP-эндонуклеаза. Дальше как в BER: надрез, встраивание одного нуклеотида по другой цепи, сшивание.","s2_cap_ok_ap_z":"AP-сайт — одновременно частое спонтанное повреждение и промежуточный продукт BER после гликозилазы: оба пути сходятся на одном этапе.","s2_cap_lesion_ber":"Нет белка узнавания: урацил никто не находит, и он остаётся в цепи. Следующие ферменты пути на месте, но им не с чем работать: AP-эндонуклеаза узнаёт AP-сайт, а не урацил.","s2_cap_lesion_ber_z":"Пути начинаются с узнавания повреждения; без узнавания исправные ферменты следующих этапов не включаются.","s2_cap_lesion_ner":"Нет белка узнавания: искажение спирали не найдено, и димер остаётся. В клетке есть и второй способ узнавания — по остановившейся РНК-полимеразе в транскрибируемом гене; в базовой модели он не показан.","s2_cap_lesion_ner_z":"Без узнавания повреждение сохраняется до репликации; при копировании напротив него может встать неверный нуклеотид.","s2_cap_ap":"Основания нет, а цепь не надрезана: AP-эндонуклеазы нет, и AP-сайт остаётся. Если урацил был удалён гликозилазой, это значит, что узнавание произошло, а остановился следующий этап.","s2_cap_ap_z":"Промежуточный продукт показывает, какой этап пройден и на каком путь остановился. AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности.","s2_cap_ap_src":"Основание оторвалось само, остов цел — это AP-сайт; гликозилаза здесь не нужна. Но AP-эндонуклеазы нет, цепь не надрезана, и AP-сайт остаётся.","s2_cap_ap_src_z":"AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности. Поэтому его нужно удалить до репликации.","s2_cap_opened":"Повреждение узнано и участок раскрыт, но нуклеаз, надрезающих цепь, нет: димер остаётся в цепи.","s2_cap_opened_z":"Узнать повреждение и удалить его — разные этапы; итог «повреждение осталось» ещё не говорит, какой из них не прошёл.","s2_cap_gap_ber":"Урацил удалён, цепь надрезана, но полимеразы нет: на месте одного нуклеотида пробел.","s2_cap_gap_ber_z":"Пробел — промежуточный продукт: повреждения уже нет, но нет и информации на этом месте. Её восстанавливают по противоположной цепи.","s2_cap_gap_ner":"Участок с димером вырезан, но полимеразы нет: в цепи пробел около 30 нуклеотидов (на схеме укорочен).","s2_cap_gap_ner_z":"Длинный пробел — промежуточный продукт NER; он сохраняется, пока по неповреждённой цепи не будет синтезирован новый участок.","s2_cap_nick":"Последовательность восстановлена по другой цепи, но лигазы нет: на границе нового участка остался разрыв сахаро-фосфатного остова.","s2_cap_nick_z":"Информация уже верна, но непрерывность цепи не восстановлена: разрыв в одной цепи — тоже промежуточный продукт, и его нужно сшить.","s2_cap_notpl":"Повреждения в обеих цепях на одном участке: после вырезания напротив пробела тоже повреждённое основание. В модели правильной матрицы для достройки нет; в клетке на таком участке возможны изменение последовательности или разрыв обеих цепей.","s2_cap_notpl_z":"Эксцизионная репарация точна потому, что информация записана дважды. Если обе копии на одном участке повреждены, восстановить её по этой молекуле нельзя — нужна другая молекула с той же последовательностью (вопрос 3).","s2_pA_an":"А. Участок ДНК: {p}"},"notes":["Пара C–G восстановлена по другой цепи.","Остался AP-сайт.","Остался пробел в один нуклеотид.","Остался разрыв в одной цепи."],"static":["Пара C–G восстановлена по другой цепи."]}}},{"id":"nucleotide-excision","section":1,"questions":[2],"title":"Вырезание нуклеотидов (NER): искажение спирали и участок около 30 нуклеотидов","keywords":["NER","XPC","TFIIH","пиримидиновый димер","транскрипционно-сопряжённая репарация"],"lead":["Крупные повреждения — пиримидиновые димеры, присоединённые к основаниям крупные химические группы — искажают двойную спираль.","Их устраняет путь вырезания нуклеотидов (NER), который узнаёт не определённое основание, а само искажение."],"mechanism":["[[T15|Белок XPC]] находит искажённый участок; комплекс TFIIH раскрывает спираль вокруг него и проверяет, есть ли в цепи повреждение.","Две [[T16|нуклеазы]] надрезают повреждённую цепь по обе стороны от повреждения, и участок около 30 нуклеотидов удаляется целиком.","ДНК-полимераза достраивает [[T17|пробел]] по неповреждённой цепи.","ДНК-лигаза сшивает разрыв."],"paragraphs":["Узнавание по искажению делает путь универсальным: одни и те же белки устраняют очень разные повреждения, если они меняют форму спирали.","В генах, которые в этот момент транскрибируются, сигналом служит РНК-полимераза, остановившаяся на повреждении в матричной цепи. Так повреждения в работающих генах устраняются быстрее (транскрипционно-сопряжённая репарация).","В клетках человека пиримидиновые димеры удаляются путём NER. Наследственные дефекты белков NER делают кожу очень чувствительной к солнечному свету и повышают риск рака кожи; это клинический пример значения механизма."],"conditions":"Схема шага — модель вкладки 2; длина участка на схеме сокращена. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.","sources":["Alberts2022","Kim2023"],"quiz":{"id":"S8-L09","question":"Чем узнавание повреждения в NER отличается от узнавания в BER?","options":[{"id":"S8-L09-1","text":"NER узнаёт ошибочные пары, BER — разрывы","correct":false,"feedback":"Ошибочные пары — субстрат MMR; разрывы обеих цепей — тема раздела 3."},{"id":"S8-L09-2","text":"Различий нет: оба пути начинаются с гликозилазы","correct":false,"feedback":"Гликозилаза — фермент BER; NER начинается с белков, находящих искажение спирали."},{"id":"S8-L09-3","text":"NER узнаёт искажение двойной спирали, а BER — определённое изменённое основание","correct":true,"feedback":"Поэтому один набор белков NER устраняет разные объёмные повреждения, а в BER для разных оснований — разные гликозилазы."}]},"widget":{"kind":"dna","title":"","s":{"title":"Этапы NER","status":"Схема качественная · длина участка сокращена","modes_label":"Что показать","modes":["все детали","нет белка узнавания","нет полимеразы"],"scene":"s2b","args":[["dimer","ok",{}],["dimer","ok",{"rec":false}],["dimer","o тапе.","s2_cap_lesion_ber":"Нет белка узнавания: урацил никто не находит, и он остаётся в цепи. Следующие ферменты пути на месте, но им не с чем работать: AP-эндонуклеаза узнаёт AP-сайт, а не урацил.","s2_cap_lesion_ber_z":"Пути начинаются с узнавания повреждения; без узнавания исправные ферменты следующих этапов не включаются.","s2_cap_lesion_ner":"Нет белка узнавания: искажение спирали не найдено, и димер остаётся. В клетке есть и второй способ узнавания — по остановившейся РНК-полимеразе в транскрибируемом гене; в базовой модели он не показан.","s2_cap_lesion_ner_z":"Без узнавания повреждение сохраняется до репликации; при копировании напротив него может встать неверный нуклеотид.","s2_cap_ap":"Основания нет, а цепь не надрезана: AP-эндонуклеазы нет, и AP-сайт остаётся. Если урацил был удалён гликозилазой, это значит, что узнавание произошло, а остановился следующий этап.","s2_cap_ap_z":"Промежуточный продукт показывает, какой этап пройден и на каком путь остановился. AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности.","s2_cap_ap_src":"Основание оторвалось само, остов цел — это AP-сайт; гликозилаза здесь не нужна. Но AP-эндонуклеазы нет, цепь не надрезана, и AP-сайт остаётся.","s2_cap_ap_src_z":"AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности. Поэтому его нужно удалить до репликации.","s2_cap_opened":"Повреждение узнано и участок раскрыт, но нуклеаз, надрезающих цепь, нет: димер остаётся в цепи.","s2_cap_opened_z":"Узнать повреждение и удалить его — разные этапы; итог «повреждение осталось» ещё не говорит, какой из них не прошёл.","s2_cap_gap_ber":"Урацил удалён, цепь надрезана, но полимеразы нет: на месте одного нуклеотида пробел.","s2_cap_gap_ber_z":"Пробел — промежуточный продукт: повреждения уже нет, но нет и информации на этом месте. Её восстанавливают по противоположной цепи.","s2_cap_gap_ner":"Участок с димером вырезан, но полимеразы нет: в цепи пробел около 30 нуклеотидов (на схеме укорочен).","s2_cap_gap_ner_z":"Длинный пробел — промежуточный продукт NER; он сохраняется, пока по неповреждённой цепи не будет синтезирован новый участок.","s2_cap_nick":"Последовательность восстановлена по другой цепи, но лигазы нет: на границе нового участка остался разрыв сахаро-фосфатного остова.","s2_cap_nick_z":"Информация уже верна, но непрерывность цепи не восстановлена: разрыв в одной цепи — тоже промежуточный продукт, и его нужно сшить.","s2_cap_notpl":"Повреждения в обеих цепях на одном участке: после вырезания напротив пробела тоже повреждённое основание. В модели правильной матрицы для достройки нет; в клетке на таком участке возможны изменение последовательности или разрыв обеих цепей.","s2_cap_notpl_z":"Эксцизионная репарация точна потому, что информация записана дважды. Если обе копии на одном участке повреждены, восстановить её по этой молекуле нельзя — нужна другая молекула с той же последовательностью (вопрос 3).","s2_pA_an":"А. Участок ДНК: {p}"},"notes":["Участок с димером удалён и достроен по другой цепи.","Искажение не найдено: димер остался.","Остался пробел около 30 нуклеотидов (на схеме укорочен)."],"static":["Участок с димером удалён и достроен по другой цепи."]}}},{"id":"template-strand","section":1,"questions":[2],"title":"Почему восстановление точное: матрица — неповреждённая цепь","keywords":["матрица","комплементарность","неповреждённая цепь","повреждения обеих цепей"],"lead":["Пути BER и NER различаются узнаванием и размером вырезаемого участка, но сходятся в главном.","Это последняя часть вопроса 6: восстановление последовательности по неповреждённой цепи."],"mechanism":["Информация в ДНК записана дважды: каждая цепь задаёт другую.","После удаления повреждённого участка ДНК-полимераза синтезирует новый участок по [[T21|неповреждённой цепи]] как по матрице.","Поэтому восстановленная последовательность совпадает с исходной — независимо от того, какой путь сработал.","Если повреждены обе цепи на одном участке, правильной матрицы в этой молекуле нет."],"paragraphs":["По той же причине MMR сохраняет последовательность: она заменяет участок новой цепи, используя матрицу как образец.","Когда противоположная цепь повреждена напротив, точно восстановить участок по этой молекуле нельзя: возможно изменение последовательности, а близкие надрезы в двух цепях могут дать разрыв обеих цепей. Тогда нужна другая молекула с той же последовательностью — об этом раздел 3.","Итог «повреждение устранено» не говорит, каким путём это сделано: одинаково восстановленную ДНК дают BER, NER и, для ошибочных пар, MMR."],"conditions":"Схема шага — модель вкладки 2.","sources":["Alberts2022"],"quiz":{"id":"S8-L10","question":"Почему BER и NER восстанавливают исходную последовательность точно?","options":[{"id":"S8-L10-1","text":"Новый участок синтезируется по неповреждённой цепи","correct":true,"feedback":"Информация записана в двух комплементарных цепях; одна служит образцом для другой."},{"id":"S8-L10-2","text":"Ферменты запоминают удалённый нуклеотид","correct":false,"feedback":"Ферменты не хранят информацию о последовательности; её даёт матрица."},{"id":"S8-L10-3","text":"Вырезанный участок возвращается на место после ремонта","correct":false,"feedback":"Вырезанный участок удаляется, новый синтезируется заново."}]},"widget":{"kind":"dna","title":"","s":{"title":"Когда матрицы нет","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["вторая цепь не повреждена","вторая цепь тоже повреждена"],"scene":"s2b","args":[["u","ok",{}],["u","dmg",{}]],"L":{"s2_les":"Повреждение в одной цепи","s2_les_u":"урацил вместо цитозина","s2_les_dimer":"пиримидиновый димер","s2_les_ap":"основание утрачено (AP-сайт)","s2_opp":"Противоположная цепь на этом участке","s2_opp_ok":"не повреждена","s2_opp_dmg":"тоже повреждена","s2_pA":"А. Участок ДНК после работы пути: {p}","s2_path_ber":"вырезание основания (BER)","s2_path_ner":"вырезание нуклеотидов (NER)","s2_lbl_top":"цепь без повреждения","s2_lbl_bot":"цепь, в которой возникло повреждение","s2_st_lesion":"повреждение осталось: его не узнали","s2_st_ap":"основания нет, цепь не надрезана: остался AP-сайт","s2_st_opened":"повреждение узнано, но участок не вырезан","s2_st_gap":"пробел в цепи: участок вырезан, но не достроен","s2_st_nick":"участок достроен, остался разрыв в одной цепи","s2_st_restored":"исходная последовательность восстановлена по другой цепи","s2_st_notpl":"вырезан участок, напротив которого тоже повреждение: правильной матрицы нет","s2_pB":"Б. Этапы пути: ✓ — пройден, ✕ — остановка, — — не начат","s2_e_ber_rec":"гликозилаза","s2_e_ber_nuc":"AP-эндонуклеаза","s2_e_ner_rec":"XPC и TFIIH","s2_e_ner_nuc":"две нуклеазы","s2_e_ber_pol":"полимераза","s2_e_ner_pol":"полимераза","s2_e_ber_lig":"лигаза","s2_e_ner_lig":"лигаза","s2_step_ber_rec":"узнаёт и удаляет\nизменённое основание","s2_step_ber_nuc":"надрезает цепь\nу AP-сайта","s2_step_ber_pol":"встраивает\n1 нуклеотид","s2_step_ber_lig":"сшивает\nразрыв","s2_step_ner_rec":"находят искажение\nи проверяют участок","s2_step_ner_nuc":"надрезают цепь\nпо обе стороны","s2_step_ner_pol":"достраивает около\n30 нуклеотидов","s2_step_ner_lig":"сшивает\nразрыв","s2_mk_skip":"не нужна","s2_mk_notpl":"нет матрицы","s2_r_path":"Путь","s2_v_path_ber":"вырезание основания (BER)","s2_v_path_ner":"вырезание нуклеотидов (NER)","s2_r_cut":"Что удаляется","s2_v_cut_ber":"одно основание, затем один нуклеотид","s2_v_cut_ner":"участок цепи около 30 нуклеотидов у человека (на схеме укорочен)","s2_r_tpl":"Матрица для достройки","s2_v_tpl_ok":"противоположная цепь — не повреждена","s2_v_tpl_dmg":"противоположная цепь повреждена на этом участке","s2_r_state":"Итог","s2_v_st_lesion":"повреждение осталось","s2_v_st_ap":"AP-сайт","s2_v_st_opened":"повреждение узнано, не вырезано","s2_v_st_gap":"пробел в одной цепи","s2_v_st_nick":"разрыв в одной цепи","s2_v_st_restored":"исходная последовательность восстановлена","s2_v_st_notpl":"восстановить по другой цепи нельзя","s2_cap_ok_u":"Урацил появился в ДНК при дезаминировании цитозина: пара U·G вместо C–G. Урацил-ДНК-гликозилаза узнаёт урацил и отщепляет его от сахара — остаётся AP-сайт. AP-эндонуклеаза надрезает цепь, полимераза по G другой цепи встраивает C, лигаза сшивает разрыв. Пара C–G восстановлена.","s2_cap_ok_u_z":"Урацила в ДНК быть не должно, поэтому его можно узнать по самому основанию. Если не удалить его до репликации, напротив U встанет A, и пара C–G в одной из дочерних молекул станет T–A после следующей репликации.","s2_cap_ok_dimer":"Два соседних пиримидина (здесь T и T) ковалентно сшиты, например после ультрафиолета; двойная спираль на этом участке искажена. Белки узнавания (среди них XPC) находят искажение, комплекс TFIIH раскрывает участок и проверяет повреждение, две нуклеазы надрезают цепь по обе стороны, участок около 30 нуклеотидов (у человека) удаляется, полимераза достраивает его по другой цепи, лигаза сшивает.","s2_cap_ok_dimer_z":"NER узнаёт не определённое основание, а искажение двойной спирали, поэтому один путь устраняет очень разные объёмные повреждения: димеры, крупные химические группы, присоединённые к основаниям.","s2_cap_ok_ap":"Основание оторвалось от сахара (так чаще всего теряются пурины), остов цел — это AP-сайт. Гликозилаза здесь не нужна: AP-сайт сразу узнаёт AP-эндонуклеаза. Дальше как в BER: надрез, встраивание одного нуклеотида по другой цепи, сшивание.","s2_cap_ok_ap_z":"AP-сайт — одновременно частое спонтанное повреждение и промежуточный продукт BER после гликозилазы: оба пути сходятся на одном этапе.","s2_cap_lesion_ber":"Нет белка узнавания: урацил никто не находит, и он остаётся в цепи. Следующие ферменты пути на месте, но им не с чем работать: AP-эндонуклеаза узнаёт AP-сайт, а не урацил.","s2_cap_lesion_ber_z":"Пути начинаются с узнавания повреждения; без узнавания исправные ферменты следующих этапов не включаются.","s2_cap_lesion_ner":"Нет белка узнавания: искажение спирали не най
