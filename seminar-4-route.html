<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-4.html">← Вернуться к семинару</a> · <a href="section-1.html">Раздел I</a> · <a href="index.html">Все разделы</a></p><h1>Путь секретируемого белка: от рибосомы до адреса</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-one-ribosome"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 1 из 29</div><h2>Почему рибосомы на мембране ЭПР и в цитозоле — не два разных вида рибосом?</h2><p class="lead">Почти все белки клетки начинают синтезироваться на <a href="#ns-g-S4-T01">рибосомах</a> в <a href="#ns-g-S4-T48">цитозоле</a>; исключение — немногие белки, которые синтезируются внутри митохондрий. Во время синтеза часть рибосом прикреплена к мембране <a href="#ns-g-S4-T02">гранулярного эндоплазматического ретикулума (грЭПР)</a>, часть свободна.</p><div class="note"><strong>Что показывает схема.</strong> Одни и те же субъединицы рибосом синтезируют цитозольные и секретируемые белки; к мембране ЭПР рибосому направляет сигнальная последовательность растущей цепи</div><p>Прикреплённые и свободные рибосомы одинаковы по строению и работе; различается только белок, который рибосома синтезирует в данный момент. Если в начале растущей <a href="#ns-g-S4-T53">полипептидной цепи</a> есть <a href="#ns-g-S4-T03">сигнальная последовательность ЭПР</a>, рибосома с этой цепью направляется к мембране ЭПР. По окончании синтеза субъединицы рибосомы отделяются от мембраны и возвращаются в общий пул цитозоля. <a href="#ns-g-S4-T52">Матричная РНК (мРНК)</a> такого белка остаётся у мембраны: к ней присоединяются новые рибосомы, и на мембране работает <a href="#ns-g-S4-T04">полирибосома</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-3-route.html#fusion-300ms">семинар 3: «Что происходит с синаптическим пузырьком за первые 300 мс после потенциала действия»</a></p><p>Белок без сигнальной последовательности ЭПР синтезируется на свободной рибосоме и остаётся в цитозоле, если у него нет сигнала другого адреса (в ядро, в митохондрию, в пероксисому). Через ЭПР проходят растворимые белки, которые будут секретированы, растворимые белки самого ЭПР, аппарата Гольджи и лизосом, а также трансмембранные белки этих органелл и <a href="#ns-g-S4-T64">плазматической мембраны</a>. Участки ЭПР, к мембране которых со стороны цитозоля прикреплено много рибосом, образуют гранулярный ЭПР — стопки уплощённых цистерн; участки без рибосом называют гладким ЭПР. Просвет всех участков ЭПР единый. В клетках, которые секретируют много белка (например, в клетках поджелудочной железы, выделяющих пищеварительные ферменты), гранулярный ЭПР особенно развит.</p><p><b>На практикуме.</b> Вкладка 1, шаг 1: две одинаковые рибосомы синтезируют <a href="#ns-g-S4-T70">альбумин</a> и <a href="#ns-g-S4-T71">актин</a>; различается только начало цепи.</p><p><b>Ограничения.</b> Число рибосом на мРНК и размер общего пула субъединиц на схеме условные.</p><div class="static-quiz"><h3>В клетке есть мРНК цитозольного белка и мРНК секретируемого белка. Чем различаются рибосомы, которые начнут синтез этих двух белков?</h3><ol><li><b>А.</b> Ничем: различие появится, когда выйдет начало цепи <i>(верный вариант)</i><br><span class="expl">Рибосомы одинаковы; к мембране ЭПР направляется рибосома, которая синтезирует цепь с сигнальной последовательностью ЭПР</span></li><li><b>Б.</b> Секретируемый белок синтезирует особая рибосома ЭПР <i>(неверный вариант)</i><br><span class="expl">Постоянного вида «рибосом ЭПР» нет: после синтеза субъединицы возвращаются в общий пул цитозоля и могут синтезировать любой белок</span></li><li><b>В.</b> Свободные рибосомы мельче рибосом, работающих на ЭПР <i>(неверный вариант)</i><br><span class="expl">По размеру и строению они одинаковы; прикреплённая рибосома отличается только цепью, которую синтезирует</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: размеры рибосомы, мембраны и цепи не в масштабе.</p></details></article><article class="card print-unit" id="ns-er-signal"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 2 из 29</div><h2>Что делает участок цепи сигналом для ЭПР?</h2><p class="lead">Сигнальная последовательность ЭПР — участок аминокислотной цепи, обычно на её N-конце, который направляет растущую цепь в ЭПР. Главный её признак — центральный участок из восьми и более неполярных (гидрофобных) аминокислот.</p><div class="note"><strong>Что показывает схема.</strong> Сигнал ЭПР — N-концевой участок с гидрофобным центром; без него белок в цитозоле, с ним — в ЭПР</div><p>Сигналы разных белков сильно различаются по порядку аминокислот, но сигналы одного назначения часто взаимозаменяемы: для узнавания важнее физическое свойство — гидрофобность, — чем точная последовательность. Сигнал необходим и достаточен: если присоединить сигнальную последовательность ЭПР к началу цитозольного белка, этот белок попадает в ЭПР; если сигнала у белка ЭПР нет (участок вырезан из гена) или он изменён, белок остаётся в цитозоле. После переноса цепи в ЭПР N-концевой сигнал обычно отщепляется <a href="#ns-g-S4-T05">сигнальной пептидазой</a>, активный центр которой обращён в просвет ЭПР.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-one-ribosome">«Почему рибосомы на мембране ЭПР и в цитозоле — не два разных вида рибосом?»</a></p><p>Другие адреса задаются другими сигналами: для импорта в ядро — короткий участок из положительно заряженных аминокислот (<a href="seminar-3-route.html#eres-resolution">семинар 3: «Что видно у выхода из ЭПР при разном разрешении»</a>), для импорта в митохондрии — участок, в котором положительно заряженные аминокислоты чередуются с гидрофобными. У растворимых белков, которые остаются в ЭПР, кроме N-концевого сигнала есть сигнал возврата на C-конце (шаг <a href="#ns-exit-criterion">«При каком условии белок покидает ЭПР?»</a>).</p><p><b>На практикуме.</b> Вкладка 1, шаги 2 и 3: гидрофобное начало цепи альбумина; к цитозольному белку присоединена сигнальная последовательность ЭПР.</p><p><b>Ограничения.</b> Сигналом для ЭПР служит и внутренний гидрофобный участок мембранного белка (шаг <a href="#ns-membrane-insertion">«Как встраивается в мембрану ЭПР мембранный белок и почему его ориентация задаётся сразу?»</a>): N-концевой сигнал — частый, но не единственный вариант.</p><div class="static-quiz"><h3>Какой эксперимент показывает, что сигнальная последовательность ЭПР достаточна для направления белка в ЭПР?</h3><ol><li><b>А.</b> Удалить сигнал у секретируемого белка и обнаружить белок в цитозоле <i>(неверный вариант)</i><br><span class="expl">Так проверяют необходимость сигнала, а не его достаточность</span></li><li><b>Б.</b> Присоединить её к цитозольному белку и обнаружить этот белок в ЭПР <i>(верный вариант)</i><br><span class="expl">Достаточность проверяют, добавляя сигнал туда, где его не было</span></li><li><b>В.</b> Увеличить число рибосом в клетке <i>(неверный вариант)</i><br><span class="expl">Число рибосом не показывает, какой участок цепи задаёт адрес</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: аминокислоты показаны кружками без названий; закрашены гидрофобные, отмечены знаком заряда заряженные.</p></details></article><article class="card print-unit" id="ns-srp-cycle"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 3 из 29</div><h2>Как SRP, рецептор SRP и транслокон Sec61 доставляют рибосому к мембране?</h2><p class="lead">Сигнальную последовательность узнаёт <a href="#ns-g-S4-T06">частица распознавания сигнала (SRP)</a> — комплекс из шести белков и одной молекулы РНК. Она связывает сигнал, вышедший из рибосомы, и одновременно замедляет синтез белка.</p><div class="note"><strong>Что показывает схема.</strong> SRP узнаёт сигнал и замедляет синтез, рецептор SRP связывает комплекс на мембране, транслокон принимает цепь, SRP и рецептор возвращаются</div><p>Цикл состоит из четырёх звеньев. 1) Узнавание: гидрофобный карман SRP связывает сигнальную последовательность у выхода из туннеля рибосомы; другой конец SRP занимает на рибосоме место, где связываются факторы удлинения цепи, и синтез замедляется. 2) Доставка: при связывании сигнала SRP открывает участок для <a href="#ns-g-S4-T07">рецептора SRP</a> — белкового комплекса мембраны грЭПР — и вместе с рибосомой связывается с ним. 3) Передача: рецептор SRP подводит рибосому к свободному <a href="#ns-g-S4-T08">транслокону Sec61</a>; место у выхода из туннеля рибосомы занимает транслокон, и сигнальная последовательность входит в него. 4) Возврат: SRP и её рецептор отделяются друг от друга и готовы к новому циклу; синтез продолжается с обычной скоростью.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-er-signal">«Что делает участок цепи сигналом для ЭПР?»</a></p><p>SRP и обе цепи рецептора SRP связывают ГТФ. Циклы связывания и гидролиза ГТФ делают цикл направленным: SRP прочно связывает сигнал в цитозоле и отпускает его только после встречи с рецептором на мембране. Цепь через мембрану гидролиз ГТФ не протягивает (шаг <a href="#ns-cotranslational">«Как цепь проходит через мембрану ЭПР во время синтеза?»</a>). Предполагается, что замедление синтеза даёт рибосоме время дойти до мембраны, пока цепь ещё не закончена; это может быть особенно важно для лизосомных гидролаз, которые в цитозоле были бы опасны.</p><p><b>На практикуме.</b> Вкладка 1, шаги 4–5; в конструкторе можно «убрать» SRP или рецептор SRP и предсказать, на каком этапе остановится процесс.</p><p><b>Ограничения.</b> Четыре звена — учебное деление одного непрерывного процесса.</p><div class="static-quiz"><h3>Какую роль играет гидролиз ГТФ в цикле SRP?</h3><ol><li><b>А.</b> Даёт энергию для протягивания цепи через Sec61 <i>(неверный вариант)</i><br><span class="expl">При котрансляционном переносе цепь продвигается за счёт её удлинения на рибосоме</span></li><li><b>Б.</b> Отщепляет сигнальную последовательность от цепи <i>(неверный вариант)</i><br><span class="expl">Сигнал отщепляет сигнальная пептидаза со стороны просвета ЭПР</span></li><li><b>В.</b> Делает цикл направленным <i>(верный вариант)</i><br><span class="expl">ГТФ-связывающие участки есть у SRP и у рецептора SRP; SRP отпускает сигнал только после связывания с рецептором на мембране</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: последовательность событий — учебная модель; формы SRP, рецептора и транслокона условные.</p></details></article><article class="card print-unit" id="ns-cotranslational"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 4 из 29</div><h2>Как цепь проходит через мембрану ЭПР во время синтеза?</h2><p class="lead"><a href="#ns-g-S4-T09">Котрансляционный перенос</a> (котрансляционная транслокация) — перенос полипептидной цепи через мембрану ЭПР одновременно с её синтезом на рибосоме.</p><div class="note"><strong>Что показывает схема.</strong> Сигнал открывает транслокон Sec61, цепь проходит в просвет во время синтеза, сигнальная пептидаза отщепляет сигнал, после синтеза канал закрывается</div><p>Транслокон Sec61 — белковый комплекс из трёх субъединиц с заполненным водой каналом. Когда через транслокон не идёт белок, канал закрыт «пробкой» — короткой спиралью — и не пропускает ионы, в том числе Ca²⁺. Сигнальная последовательность входит в боковую щель транслокона (латеральные ворота) N-концом к цитозолю; канал расширяется, пробка смещается, и следующая за сигналом часть цепи проходит в <a href="#ns-g-S4-T10">просвет ЭПР</a>. Туннель рибосомы и канал транслокона выстроены в одну линию, поэтому цепь движется в просвет по мере удлинения: энергия синтеза цепи косвенно обеспечивает и перенос. Сигнальная пептидаза отщепляет сигнал ещё до окончания синтеза; затем сигнал разрушается. По окончании синтеза C-конец проходит через канал, и пробка возвращается на место.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-srp-cycle">«Как SRP, рецептор SRP и транслокон Sec61 доставляют рибосому к мембране?»</a></p><p>Цепь растворимого белка оказывается в просвете ЭПР целиком и сворачивается уже там (шаг <a href="#ns-er-folding">«Что происходит с цепью в просвете ЭПР?»</a>). Просвет ЭПР по расположению относительно мембраны соответствует <a href="#ns-g-S4-T65">внеклеточной среде</a> (шаг <a href="#ns-topology-kept">«Почему мембранный белок не переворачивается по пути к поверхности?»</a>).</p><p><b>На практикуме.</b> Вкладка 1, шаги 1, 3 и 5: цепь уходит в просвет по мере синтеза; при закрытом канале транслокона она остаётся в цитозоле.</p><p><b>Ограничения.</b> Часть белков переносится через Sec61 после окончания синтеза (шаг <a href="#ns-other-routes">«Все ли белки попадают в ЭПР с помощью SRP?»</a>).</p><div class="static-quiz"><h3>Почему канал Sec61 закрыт, когда через него не проходит белок?</h3><ol><li><b>А.</b> Иначе через мембрану ЭПР утекали бы ионы, в том числе Ca²⁺ <i>(верный вариант)</i><br><span class="expl">Пробка сохраняет барьер мембраны ЭПР</span></li><li><b>Б.</b> Иначе SRP не смогла бы связать сигнальную последовательность <i>(неверный вариант)</i><br><span class="expl">SRP связывает сигнал в цитозоле, у выхода из рибосомы, ещё до встречи с транслоконом</span></li><li><b>В.</b> Иначе рибосома не отделилась бы от мембраны <i>(неверный вариант)</i><br><span class="expl">Рибосома отделяется после окончания синтеза; это не связано с пробкой канала</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: показан разрез мембраны ЭПР; пробка и латеральные ворота изображены условно.</p></details></article><article class="card print-unit" id="ns-membrane-insertion"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 5 из 29</div><h2>Как встраивается в мембрану ЭПР мембранный белок и почему его ориентация задаётся сразу?</h2><p class="lead"><a href="#ns-g-S4-T11">Трансмембранный сегмент</a> — гидрофобная α-спираль полипептидной цепи, которая пересекает <a href="#ns-g-S4-T54">липидный бислой</a>. SRP узнаёт его так же, как сигнальную последовательность, и доставляет рибосому к Sec61.</p><div class="note"><strong>Что показывает схема.</strong> Растворимый белок переносится целиком; гидрофобный сегмент останавливает перенос и задаёт ориентацию мембранного белка</div><p>Гидрофобный сегмент входит в латеральные ворота транслокона и выходит из канала вбок, в бислой: в гидрофобной середине мембраны ему энергетически выгоднее, чем в водном канале. Перенос цепи через мембрану при этом останавливается, и остальная часть цепи синтезируется в цитозоле. У однопроходного белка с большим N-концевым доменом снаружи клетки события идут так: N-концевая сигнальная последовательность начинает перенос и отщепляется; следующий гидрофобный сегмент останавливает перенос и остаётся в мембране. В итоге N-концевой домен — в просвете ЭПР, C-концевой участок — в цитозоле. Если у белка нет отщепляемой N-концевой сигнальной последовательности и в мембрану встраивается только внутренний гидрофобный сегмент, в простейшем случае его ориентацию определяют заряженные аминокислоты по краям сегмента: сторона с избытком положительного заряда остаётся в цитозоле. Влияют также длина сегмента и размер N-концевого участка: длинный свёрнутый N-концевой участок через канал не проходит и остаётся в цитозоле.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-cotranslational">«Как цепь проходит через мембрану ЭПР во время синтеза?»</a>; вспомнить строение бислоя (<a href="seminar-1-route.html#bio-1-1">семинар 1</a>)</p><p>Все копии одного белка встраиваются одинаково, и так возникает <a href="#ns-g-S4-T12">топология мембранного белка</a> — расположение его участков по разные стороны мембраны. Многопроходный белок встраивается сегмент за сегментом: первый сегмент задаёт ориентацию, в простейшем случае каждый следующий встраивается в противоположной ориентации.</p><p><b>На практикуме.</b> Вкладка 4, шаг 3: рецептор ЛПНП в мембране ЭПР N-концевым доменом в просвет; в продвинутом уровне — однопроходный белок вкладки 1.</p><p><b>Ограничения.</b> Белки с единственным гидрофобным сегментом у самого C-конца встраиваются после синтеза другим путём (шаг <a href="#ns-other-routes">«Все ли белки попадают в ЭПР с помощью SRP?»</a>).</p><div class="static-quiz"><h3>У однопроходного белка N-концевая сигнальная последовательность отщепилась, а следующий гидрофобный сегмент остался в мембране. Где окажется N-концевой домен?</h3><ol><li><b>А.</b> В цитозоле <i>(неверный вариант)</i><br><span class="expl">В цитозоле остаётся часть цепи, синтезированная после останавливающего сегмента, — C-концевой участок</span></li><li><b>Б.</b> В просвете ЭПР <i>(верный вариант)</i><br><span class="expl">Сигнал начал перенос N-концевого домена, а гидрофобный сегмент остановил перенос остальной цепи</span></li><li><b>В.</b> У одних молекул в просвете, у других в цитозоле <i>(неверный вариант)</i><br><span class="expl">Встраивание определяется последовательностью белка: все копии ориентированы одинаково</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: бислой, гидрофобный сегмент и заряды показаны условно; число аминокислот не соблюдено.</p></details></article><article class="card print-unit" id="ns-early-decision"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 6 из 29</div><h2>Почему вход в ЭПР определяет, какие изменения доступны белку дальше?</h2><p class="lead">Сверх программы. Что произойдёт с растворимым и с мембранным белком, если не сработает одно из трёх звеньев: сигнальная последовательность, SRP с её рецептором или транслокон?</p><div class="note"><strong>Что показывает схема.</strong> Если не работает сигнал, SRP с рецептором или транслокон, белок остаётся в цитозоле без N-гликана и дисульфидных связей; мембранный белок оставляет в цитозоле гидрофобный сегмент</div><p>Модель практикума: белок переносится только во время синтеза, другого пути в ЭПР у него нет. Если не работает любое из трёх звеньев, синтез заканчивается в цитозоле. Такой белок не получает N-гликан: фермент, переносящий олигосахарид, работает со стороны просвета ЭПР. Не образуются и дисульфидные связи: для них нужны окислительная среда просвета ЭПР и ферменты, которых нет в цитозоле. У мембранного белка в цитозоле оказывается открытый гидрофобный сегмент, склонный к слипанию с другими белками. После входа растворимый и мембранный белок различаются положением: первый — в просвете, второй — в мембране с N-концевым доменом в просвете.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-srp-cycle">«Как SRP, рецептор SRP и транслокон Sec61 доставляют рибосому к мембране?»</a>, шаг <a href="#ns-cotranslational">«Как цепь проходит через мембрану ЭПР во время синтеза?»</a>, шаг <a href="#ns-membrane-insertion">«Как встраивается в мембрану ЭПР мембранный белок и почему его ориентация задаётся сразу?»</a>, шаг <a href="#ns-er-folding">«Что происходит с цепью в просвете ЭПР?»</a></p><p>Обратная задача. Белок синтезирован, но в ЭПР его нет. С этим наблюдением совместимы три причины: изменена сигнальная последовательность этого белка; не работают SRP или её рецептор; не работает транслокон. Различает их наблюдение за другими секретируемыми белками той же клетки: если изменён только сигнал одного белка, другие белки входят в ЭПР; если нарушено общее звено, не входят и они. Отличить дефект SRP от дефекта транслокона по одному этому наблюдению нельзя.</p><p><b>Ограничения.</b> Часть белков может войти в ЭПР после синтеза (шаг <a href="#ns-other-routes">«Все ли белки попадают в ЭПР с помощью SRP?»</a>); модель этот путь исключает предпосылкой.</p><div class="static-quiz"><h3>В клетке ни один из трёх разных секретируемых белков не обнаружен в ЭПР. Какой вывод допустим?</h3><ol><li><b>А.</b> У всех трёх белков изменены сигнальные последовательности <i>(неверный вариант)</i><br><span class="expl">Это возможно, но маловероятно; проверить можно, прочитав последовательности сигналов трёх белков</span></li><li><b>Б.</b> Не работает сигнальная пептидаза мембраны ЭПР <i>(неверный вариант)</i><br><span class="expl">Без сигнальной пептидазы сигнал не отщепляется, но цепь всё равно переносится в ЭПР</span></li><li><b>В.</b> Вероятно, нарушено общее звено, но какое — неизвестно <i>(верный вариант)</i><br><span class="expl">Одно общее объяснение проще, чем три независимых изменения сигналов, а различить общие звенья это наблюдение не позволяет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Учебная модель: три переключателя и два типа груза; показания качественные.</p></details></article><article class="card print-unit" id="ns-nac-gatekeeper"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 7 из 29</div><h2>Что не допускает SRP к рибосомам, синтезирующим белки без сигнала ЭПР?</h2><p class="lead">Сверх программы. Частиц SRP в клетке гораздо меньше, чем рибосом, и SRP прочно связывается с любой рибосомой. Почему же к ЭПР не направляются рибосомы, которые синтезируют цитозольные белки?</p><div class="note"><strong>Что показывает схема.</strong> Комплекс NAC не допускает SRP к цепям без сигнала ЭПР; выходящий сигнал ослабляет NAC, и SRP занимает место у выхода туннеля</div><p>Новые данные: у выхода из туннеля почти каждой рибосомы на ранней стадии синтеза находится <a href="#ns-g-S4-T13">комплекс NAC</a> (комплекс, связанный с растущей цепью). Его центральная часть занимает то же место, что SRP, и препятствует связыванию SRP с цепью. Гибкий концевой участок NAC при этом связывает SRP рядом с рибосомой, так что SRP может связаться с выходящей цепью, если в ней есть сигнал. Когда из туннеля выходит гидрофобная сигнальная последовательность ЭПР, связь центральной части NAC с рибосомой ослабевает, и SRP занимает место у выхода. Цепи цитозольных и митохондриальных белков такого ослабления не вызывают. Предполагается, что у мембраны рецептор SRP вытесняет NAC из связи с SRP: их участки связывания на SRP перекрываются.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-srp-cycle">«Как SRP, рецептор SRP и транслокон Sec61 доставляют рибосому к мембране?»</a></p><p><b>Что уточняет эта работа?</b> По модели авторов, узнавание сигнала двухступенчатое: сначала NAC открывает SRP доступ только к цепям с сигналом ЭПР, затем SRP доставляет рибосому к мембране. Авторы предполагают, что две ступени повышают точность: разнообразные сигналы трудно надёжно узнать одним фактором за один шаг. У круглого червя-нематоды с нарушенным контактом NAC и SRP уровень секретируемого белка-репортёра (легко измеряемого белка, по количеству которого судят о работе пути) был ниже, а признаки нарушения работы ЭПР и цитозоля усиливались.</p><p><b>Ограничения.</b> Строение комплексов получено для очищенных компонентов; поведение в организме проверено на нематоде, а не на клетках человека.</p><div class="static-quiz"><h3>Что открывает SRP доступ к растущей цепи у выхода из туннеля рибосомы?</h3><ol><li><b>А.</b> Выход из туннеля сигнала ЭПР <i>(верный вариант)</i><br><span class="expl">Цепи без сигнала ЭПР такого действия не оказывают</span></li><li><b>Б.</b> Связывание SRP с рецептором на мембране <i>(неверный вариант)</i><br><span class="expl">Это следующий этап: к рецептору SRP приходит уже связанной с сигналом</span></li><li><b>В.</b> Окончание синтеза белка на рибосоме <i>(неверный вариант)</i><br><span class="expl">После окончания синтеза доставка во время синтеза уже невозможна</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.abl6459">Jomaa A., Gamerdinger M., Hsieh H.-H., Wallisch A., Chandrasekaran V., Ulusoy Z., Scaiola A., Hegde R. S., Shan S.-O., Ban N., Deuerling E. Mechanism of signal sequence handover from NAC to SRP on ribosomes during ER-protein targeting. Science. 2022; 375: 839–844</a></li></ul><p>Схема качественная: две последовательные стадии; формы NAC и SRP условные.</p></details></article><article class="card print-unit" id="ns-other-routes"><div class="eyebrow">Начальный адрес: сигнальная последовательность, SRP и транслокон · шаг 8 из 29</div><h2>Все ли белки попадают в ЭПР с помощью SRP?</h2><p class="lead">Сверх программы. Цикл SRP — основной, но не единственный путь в ЭПР.</p><div class="note"><strong>Что показывает схема.</strong> В ЭПР ведут путь SRP во время синтеза, перенос после синтеза и встраивание белков с C-концевым якорем</div><p><a href="#ns-g-S4-T68">Посттрансляционный перенос</a>: белок полностью синтезируется в цитозоле, шапероны цитозоля не дают ему свернуться, затем его сигнальная последовательность открывает Sec61. У эукариот цепь втягивается в просвет шапероном BiP, связанным у транслокона с комплексом белков Sec62 и Sec63; циклы связывания и отпускания цепи за счёт гидролиза АТФ не дают ей вернуться в цитозоль. Так переносится особенно много белков у дрожжей. Другой путь — у <a href="#ns-g-S4-T14">белков с C-концевым якорем</a>: их единственный гидрофобный сегмент находится у самого C-конца и выходит из рибосомы только после окончания синтеза, когда SRP узнать его уже не может. Такой сегмент захватывает в цитозоле другой фактор доставки и передаёт встраивающему комплексу мембраны ЭПР. К этим белкам относятся многие SNARE-белки (<a href="seminar-3-route.html#fusion-pore">семинар 3: «Как открывается и меняется пора слияния»</a>). Часть белков с C-концевым якорем направляется не в ЭПР, а в наружную мембрану митохондрий или в мембрану пероксисом; механизм этой доставки не установлен.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-srp-cycle">«Как SRP, рецептор SRP и транслокон Sec61 доставляют рибосому к мембране?»</a>, шаг <a href="#ns-membrane-insertion">«Как встраивается в мембрану ЭПР мембранный белок и почему его ориентация задаётся сразу?»</a></p><p>Поэтому отсутствие N-концевой сигнальной последовательности не означает, что белок обязательно останется в цитозоле: адрес может задавать внутренний или C-концевой гидрофобный участок.</p><p><b>Ограничения.</b> Механизмы этих путей у млекопитающих изучены не полностью; на коллоквиуме требуется только цикл SRP.</p><div class="static-quiz"><h3>Почему белок с единственным гидрофобным сегментом у самого C-конца не доставляется к ЭПР с помощью SRP?</h3><ol><li><b>А.</b> У такого белка нет трансмембранного сегмента <i>(неверный вариант)</i><br><span class="expl">Сегмент есть — он и служит якорем в мембране</span></li><li><b>Б.</b> Сегмент выходит из туннеля уже после окончания синтеза <i>(верный вариант)</i><br><span class="expl">SRP связывает сигнал, пока цепь ещё синтезируется</span></li><li><b>В.</b> Такие белки сразу секретируются из клетки <i>(неверный вариант)</i><br><span class="expl">Белки с C-концевым якорем встраиваются в мембрану и обращены основной частью в цитозоль</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: сравнение трёх путей; формы факторов условные.</p></details></article><article class="card print-unit" id="ns-er-folding"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 9 из 29</div><h2>Что происходит с цепью в просвете ЭПР?</h2><p class="lead">В <a href="#ns-g-S4-T10">просвете ЭПР</a> цепь проходит <a href="#ns-g-S4-T40">сворачивание</a> — принимает пространственную структуру — и получает первые модификации. В просвете много <a href="#ns-g-S4-T15">шаперонов</a> и ферментов сворачивания.</p><div class="note"><strong>Что показывает схема.</strong> В просвете ЭПР цепь получает N-гликан, связывается с BiP, PDI образует дисульфидные связи; белок сворачивается</div><p>Три события идут одновременно с переносом цепи. 1) <a href="#ns-g-S4-T16">N-гликозилирование</a>: фермент олигосахарилтрансфераза, связанный с транслоконом, переносит заранее собранный олигосахарид из 14 остатков сахаров (2 N-ацетилглюкозамина, 9 маннозы, 3 глюкозы) на аспарагин в последовательности Asn–X–Ser или Asn–X–Thr (X — любая аминокислота, кроме пролина). 2) Шаперон <a href="#ns-g-S4-T17">BiP</a> (белок, связывающий иммуноглобулин) из семейства Hsp70 связывает открытые гидрофобные участки цепи, которые в свёрнутом белке спрятаны внутри; он не даёт цепи слипаться с другими и периодически отпускает её, используя энергию гидролиза АТФ. 3) <a href="#ns-g-S4-T18">Протеиндисульфидизомераза (PDI)</a> образует дисульфидные связи между остатками цистеина и перестраивает неверно соединённые пары.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-cotranslational">«Как цепь проходит через мембрану ЭПР во время синтеза?»</a></p><p>Дисульфидные связи образуются в просвете ЭПР, потому что здесь окислительная среда; в цитозоле среда восстановительная. <a href="#ns-g-S4-T67">Гликопротеинами</a> становятся около половины растворимых и мембранных белков, синтезируемых в ЭПР. Шапероны и ферменты сворачивания сами являются белками ЭПР и удерживаются в нём (шаг <a href="#ns-exit-criterion">«При каком условии белок покидает ЭПР?»</a>).</p><p><b>На практикуме.</b> Вкладка 2, шаг 1: новая цепь в просвете с гликаном, BiP и PDI.</p><p><b>Ограничения.</b> N-гликан — главный, но не единственный тип углеводных цепей; другие цепи присоединяются в основном в аппарате Гольджи.</p><div class="static-quiz"><h3>Почему у белков, прошедших через просвет ЭПР, часто есть дисульфидные связи, а у белков цитозоля их почти нет?</h3><ol><li><b>А.</b> У цитозольных белков нет цистеинов <i>(неверный вариант)</i><br><span class="expl">Цистеины есть и в цитозольных белках; дело в среде компартмента</span></li><li><b>Б.</b> Дисульфидные связи образуются в аппарате Гольджи, а не в ЭПР <i>(неверный вариант)</i><br><span class="expl">Основное место образования дисульфидных связей — просвет ЭПР</span></li><li><b>В.</b> В просвете ЭПР окислительная среда и работает PDI <i>(верный вариант)</i><br><span class="expl">В восстановительной среде цитозоля дисульфидные связи почти не образуются</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: олигосахарид показан условными знаками (квадрат — N-ацетилглюкозамин, кружок — манноза, треугольник — глюкоза), не химической формулой.</p></details></article><article class="card print-unit" id="ns-glycan-timer"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 10 из 29</div><h2>Как гликан показывает, свернулся ли белок?</h2><p class="lead">Состав N-гликана отражает состояние белка: от него зависит, задержит ли белок <a href="#ns-g-S4-T39">контроль качества в ЭПР</a> или белок сможет выйти.</p><div class="note"><strong>Что показывает схема.</strong> Гликан с одной глюкозой связывает белок с калнексином; несвёрнутый белок получает глюкозу вновь; укорочение гликана ведёт к удалению</div><p>Вскоре после присоединения олигосахарида ферменты отщепляют две из трёх глюкоз. Белок с одной оставшейся глюкозой связывают <a href="#ns-g-S4-T19">калнексин и кальретикулин</a> — шапероны, узнающие углеводы (лектины). Когда отщепляется и последняя глюкоза, белок освобождается. Если он уже свернулся, он может покинуть ЭПР. Если нет, фермент <a href="#ns-g-S4-T58">глюкозилтрансфераза</a> ЭПР вновь присоединяет одну глюкозу — избирательно к ещё не свернувшимся белкам, — и белок снова связывается с калнексином или кальретикулином: это повторная попытка сворачивания. Чем дольше белок находится в этом цикле, тем вероятнее, что ферменты <a href="#ns-g-S4-T57">маннозидазы</a> ЭПР отщепят концевые остатки маннозы. Гликан с укороченными маннозными ветвями узнают белки, направляющие белок на удаление (шаг <a href="#ns-er-removal">«Как удаляется белок, который так и не свернулся?»</a>).</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-er-folding">«Что происходит с цепью в просвете ЭПР?»</a></p><p>Гликан работает и как метка «ещё не готов», и как «часы»: белок, который сворачивается быстро, покидает ЭПР раньше, чем гликан укоротится; белок, который долго не сворачивается, направляется на удаление. Контроль качества поэтому избирателен: он задерживает и удаляет не все молекулы, а те, что не свернулись.</p><p><b>На практикуме.</b> Вкладка 2, шаги 2 и 4: связывание с калнексином, освобождение, повторная попытка; медленно сворачивающийся вариант.</p><p><b>Ограничения.</b> Ферменты цикла подробно разбираются в курсе «Молекулярная биология». Контроль качества оценивает сворачивание, а не активность белка: белок с заменой аминокислоты, которая нарушает его работу, но не сворачивание, может выйти из ЭПР.</p><div class="static-quiz"><h3>Что происходит с ещё не свернувшимся гликопротеином после отщепления последней глюкозы?</h3><ol><li><b>А.</b> Глюкоза присоединяется вновь, и белок снова у калнексина <i>(верный вариант)</i><br><span class="expl">Так белок получает повторную попытку сворачивания</span></li><li><b>Б.</b> Белок сразу выходит в аппарат Гольджи, так как глюкозы нет <i>(неверный вариант)</i><br><span class="expl">Покинуть ЭПР может только свернувшийся белок</span></li><li><b>В.</b> Белок сразу направляется на удаление в протеасому <i>(неверный вариант)</i><br><span class="expl">Удаление начинается позже, после укорочения маннозных ветвей гликана</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: последовательность состояний — учебная модель; число циклов условное.</p></details></article><article class="card print-unit" id="ns-exit-criterion"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 11 из 29</div><h2>При каком условии белок покидает ЭПР?</h2><p class="lead">Из ЭПР выходят только правильно свёрнутые белки, а белки, состоящие из нескольких субъединиц, — только после сборки всех субъединиц. Это главное условие экспорта в аппарат Гольджи.</p><div class="note"><strong>Что показывает схема.</strong> Из ЭПР выходят свёрнутые и собранные белки; несобранные задерживаются; белки ЭПР с KDEL возвращаются</div><p>Готовые к выходу белки упаковываются в <a href="#ns-g-S4-T49">транспортные носители</a>, покрытые оболочкой <a href="#ns-g-S4-T20">COP-II</a> (COP — белки оболочки); носители отпочковываются от <a href="#ns-g-S4-T21">участков выхода из ЭПР</a>, свободных от рибосом. Многие мембранные белки активно отбираются в носитель по сигналам выхода на своей цитозольной части; часть растворимых белков связывают в просвете трансмембранные рецепторы груза; часть попадает в носитель без отбора. Несвернувшиеся и несобранные белки связаны с шаперонами (BiP, калнексином) и остаются в ЭПР. Растворимые белки ЭПР несут на C-конце <a href="#ns-g-S4-T60">сигнал возврата</a> из четырёх аминокислот (у многих — Lys–Asp–Glu–Leu, KDEL); если такой белок всё же покинул ЭПР, его связывает <a href="#ns-g-S4-T22">KDEL-рецептор</a> и возвращает в ЭПР в носителях, покрытых <a href="#ns-g-S4-T56">COP-I</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-glycan-timer">«Как гликан показывает, свернулся ли белок?»</a>; вспомнить <a href="seminar-3-route.html#snare-zipper">семинар 3: «Как SNARE-комплекс сближает мембраны и почему его нужно разбирать»</a></p><p>Задержка бывает массовой: у рецептора T-лимфоцитов и у ацетилхолинового рецептора большая часть вновь синтезированных субъединиц не встречает партнёров, не собирается и разрушается, не достигнув поверхности клетки. Клетка синтезирует такие субъединицы с избытком. Значит, «вошёл в ЭПР» и «готов к экспорту» — разные состояния.</p><p><b>На практикуме.</b> Вкладка 2, шаги 3 и 5: двухсубъединичный рецептор без партнёрной субъединицы; белок ЭПР, вернувшийся по сигналу KDEL.</p><p><b>Ограничения.</b> Сигналы выхода растворимых белков известны не полностью.</p><div class="static-quiz"><h3>Субъединица рецептора свернулась правильно, но партнёрная субъединица в клетке не синтезируется. Что ожидается?</h3><ol><li><b>А.</b> Субъединица одна дойдёт до поверхности клетки <i>(неверный вариант)</i><br><span class="expl">Несобранную субъединицу удерживают шапероны ЭПР</span></li><li><b>Б.</b> Субъединица задержится в ЭПР, а затем будет удалена <i>(верный вариант)</i><br><span class="expl">Выходят только собранные комплексы</span></li><li><b>В.</b> Субъединицу вернёт в ЭПР KDEL-рецептор <i>(неверный вариант)</i><br><span class="expl">KDEL-рецептор возвращает собственные растворимые белки ЭПР; несобранная субъединица ЭПР не покидает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: показаны выход в носителе с COP-II и возврат в носителе с COP-I; масштаб условный.</p></details></article><article class="card print-unit" id="ns-er-removal"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 12 из 29</div><h2>Как удаляется белок, который так и не свернулся?</h2><p class="lead">Белок, который не свернулся за отведённое время, переносится из ЭПР обратно в цитозоль и разрушается в <a href="#ns-g-S4-T23">протеасоме</a>. Этот процесс называют деградацией, связанной с ЭПР (<a href="#ns-g-S4-T24">ERAD</a>).</p><div class="note"><strong>Что показывает схема.</strong> Несвернувшийся белок выводится из ЭПР в цитозоль, получает убиквитин, теряет гликан и расщепляется в протеасоме</div><p>Шапероны удерживают такой белок развёрнутым и не дают ему слипаться; ферменты семейства PDI разрывают его дисульфидные связи, чтобы цепь стала линейной; лектины узнают укороченный гликан. Белок проходит в цитозоль через <a href="#ns-g-S4-T59">канал удаления</a> в мембране ЭПР. Канал связан с ферментом, который присоединяет к выходящей цепи цепочку <a href="#ns-g-S4-T25">убиквитина</a>. Убиквитин не даёт белку соскользнуть обратно и служит «ручкой» для АТФазы, которая вытягивает белок. В цитозоле фермент отщепляет гликан целиком, и белок расщепляется протеасомой.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-glycan-timer">«Как гликан показывает, свернулся ли белок?»</a></p><p>Поэтому удаляемый белок в цитозоле лишён гликана и несёт убиквитин, а задержанный белок находится в просвете ЭПР с гликаном. Удаление — не уничтожение всех новых молекул: нормальный белок успевает свернуться и выйти раньше, чем запускается удаление. Иногда удаляется белок, который мог бы работать: при наиболее частых мутациях, вызывающих муковисцидоз, хлоридный канал свёрнут почти правильно, но удерживается в ЭПР и разрушается. Клинический пример иллюстрирует механизм. Подробно об убиквитине и протеасоме — <a href="seminar-5-route.html#ubiquitin-cascade">семинар 5</a>.</p><p><b>На практикуме.</b> Вкладка 2, шаг 4: медленно сворачивающийся вариант направляется на удаление.</p><div class="static-quiz"><h3>Почему контроль качества ЭПР не удаляет белки, которые только что вошли в ЭПР и ещё не свернулись?</h3><ol><li><b>А.</b> Протеасома находится в просвете ЭПР и работает медленно <i>(неверный вариант)</i><br><span class="expl">Протеасома находится в цитозоле; белок для удаления выводится из ЭПР</span></li><li><b>Б.</b> Несвернувшиеся белки не связываются шаперонами <i>(неверный вариант)</i><br><span class="expl">Наоборот: связывание шаперонами удерживает несвернувшийся белок в ЭПР</span></li><li><b>В.</b> Удаление начинается только после укорочения гликана <i>(верный вариант)</i><br><span class="expl">Укорочение маннозных ветвей служит «часами»</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: этапы переноса в цитозоль — учебная модель; число остатков убиквитина условное.</p></details></article><article class="card print-unit" id="ns-flux-capacity"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 13 из 29</div><h2>Почему рост синтеза не обязательно увеличивает выход готового белка?</h2><p class="lead">Сверх программы. Учебная потоковая модель: за каждый интервал времени в ЭПР входит определённое количество белка; ЭПР может провести за интервал ограниченное число проверок сворачивания — это <a href="#ns-g-S4-T47">ёмкость сворачивания и проверки</a>.</p><div class="note"><strong>Что показывает схема.</strong> При ёмкости 120 проверок выход не превышает 95 у.е. за интервал; рост входа выше 100 у.е. увеличивает только очередь непроверенных</div><p>Все числа — условные единицы (у.е.). Ёмкость — 120 проверок за интервал. Молекула, свернувшаяся с первой попытки, требует одной проверки; молекула, которой нужна повторная попытка, — двух; окончательно дефектная — тоже двух, после чего удаляется. В обычном случае повторная попытка нужна 15 % молекул (доля 0,15), окончательно дефектны 5 % (доля 0,05); одна молекула в среднем требует 1,2 проверки, и за интервал можно обработать не больше 100 у.е. белка: выходят 95, удаляются 5. Баланс каждого интервала: очередь в начале + вход = вышли готовыми + удалены + не проверены к концу. Вход 60 у.е.: выходят 57, удаляются 3, непроверенных нет. Вход 150 у.е.: выходят те же 95, удаляются 5, а 50 у.е. остаются в ЭПР непроверенными; за четыре интервала очередь непроверенных вырастает до 200 у.е.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-glycan-timer">«Как гликан показывает, свернулся ли белок?»</a>, шаг <a href="#ns-exit-criterion">«При каком условии белок покидает ЭПР?»</a>, шаг <a href="#ns-er-removal">«Как удаляется белок, который так и не свернулся?»</a></p><p>Если при входе 150 у.е. снизить вход до 100, выход не уменьшится — те же 95 у.е., — а накопление прекратится. Доля молекул, которым нужна повторная попытка, сказывается только у предела ёмкости: при входе 60 у.е. выход одинаков (57) при доле 0,15 и при доле 0,45; при входе 150 у.е. и доле 0,45 выходят лишь 76 у.е., а 70 у.е. за интервал остаются непроверенными. Модель показывает: выход ограничен ёмкостью, и избыток входа превращается в накопление в ЭПР, а не в готовый белок.</p><p><b>Ограничения.</b> В клетке ёмкость ЭПР не постоянна: накопление несвернувшихся белков запускает ответ, который увеличивает ёмкость ЭПР и снижает вход новых белков (курс «Молекулярная биология»). В модели нет слипания белков, гибели клетки и различий между белками. Непроверенные молекулы в модели остаются в очереди сколь угодно долго и никогда не удаляются; в клетке это не так: долго не свернувшийся белок теряет маннозы гликана и направляется на удаление (шаг <a href="#ns-er-removal">«Как удаляется белок, который так и не свернулся?»</a>).</p><div class="static-quiz"><h3>В модели вход вырос со 100 до 150 у.е. за интервал при ёмкости 120 проверок. Что изменится?</h3><ol><li><b>А.</b> Выход останется 95 у.е., растёт очередь <i>(верный вариант)</i><br><span class="expl">За интервал можно обработать не больше 100 у.е.; остальные молекулы остаются в ЭПР непроверенными</span></li><li><b>Б.</b> Выход вырастет до 142,5 у.е. <i>(неверный вариант)</i><br><span class="expl">Так было бы без предела ёмкости; в модели предел — 120 проверок</span></li><li><b>В.</b> Выход упадёт: больше молекул удаляется <i>(неверный вариант)</i><br><span class="expl">Удаляется та же доля обработанных молекул — 5 у.е.; выход не падает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Учебная модель · условные единицы; ёмкость и число проверок на молекулу — допущения, а не измеренные величины.</p></details></article><article class="card print-unit" id="ns-flux-inverse"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 14 из 29</div><h2>Выход одинаково низкий: какие наблюдения различают причины?</h2><p class="lead">Сверх программы. В трёх клетках модели выход готового белка одинаков — 57 у.е. за интервал. Причины разные.</p><div class="note"><strong>Что показывает схема.</strong> Одинаковый выход 57 у.е. различается по накоплению в ЭПР и по количеству удаляемого белка</div><p>Клетка 1: вход снижен до 60 у.е. (ёмкость 120, обычные доли) — удаляются 3 у.е., непроверенных нет. Клетка 2: ёмкость снижена до 72 проверок, вход 100 у.е. — удаляются 3 у.е., а в ЭПР остаются 40 у.е. за каждый интервал (160 у.е. за четыре интервала). Клетка 3: доля дефектных молекул выросла до 0,24, вход 75 у.е. — удаляются 18 у.е., непроверенных нет. Накопление в ЭПР наблюдается только в клетке 2, повышенное количество удаляемого белка — только в клетке 3; в клетке 1 оба показателя малы, но мал и вход.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-flux-capacity">«Почему рост синтеза не обязательно увеличивает выход готового белка?»</a></p><p>Значит, одного наблюдения «выход низкий» недостаточно для вывода о причине: нужны наблюдения ближе к месту нарушения — сколько белка входит, сколько остаётся в ЭПР и сколько удаляется.</p><p><b>Ограничения.</b> В модели количество удаляемого белка задано числом; в клетке его приходится измерять отдельно.</p><div class="static-quiz"><h3>Выход 57 у.е. за интервал; в ЭПР за четыре интервала накопилось 160 у.е.; удаляется по 3 у.е. за интервал. С какой причиной совместимы эти данные?</h3><ol><li><b>А.</b> Снижен вход белка в ЭПР за интервал <i>(неверный вариант)</i><br><span class="expl">При сниженном входе накопления в ЭПР нет</span></li><li><b>Б.</b> Снижена ёмкость сворачивания и проверки <i>(верный вариант)</i><br><span class="expl">Избыток входа задерживается в ЭПР</span></li><li><b>В.</b> Выросла доля окончательно дефектных молекул <i>(неверный вариант)</i><br><span class="expl">Тогда удалялось бы больше белка (18 у.е.), а накопления не было бы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Учебная модель · условные единицы; три клетки различаются одним параметром каждая.</p></details></article><article class="card print-unit" id="ns-glyco-data"><div class="eyebrow">Созревание и контроль качества в ЭПР · шаг 15 из 29</div><h2>Выходит ли из ЭПР каждая молекула нормального белка?</h2><p class="lead">Сверх программы. Новые данные о двух секретируемых белках плазмы крови — α1-антитрипсине и антитромбине — в культуре клеток человека.</p><div class="note"><strong>Что показывает схема.</strong> Даже нормальные белки выходят не полностью; варианты с заменой аминокислоты чаще возвращаются на повторную проверку</div><p>Даже нормальные формы этих белков выходили из клеток не полностью: в одной из серий измерений за время наблюдения в среду поступило около 65 % синтезированного α1-антитрипсина и около 51 % антитромбина. Варианты без участков N-гликозилирования в среде не обнаруживались. Варианты обоих белков, связанные с наследственными болезнями (в основном с заменами аминокислот; один из вариантов α1-антитрипсина — укороченный белок), чаще, чем нормальные, повторно получали глюкозу на гликане. Измерялось именно присоединение глюкозы; отсюда следует, что такие варианты, вероятно, чаще вновь связывались с калнексином или кальретикулином, и это согласуется с их задержкой в ЭПР. У этих белков (и ещё одного белка того же семейства — серпинов) подтвердилось ранее предложенное правило: белок с гликаном вблизи N-конца (в первых примерно 50 аминокислотах) в начале сворачивания связывается с калнексином или кальретикулином, белок без такого гликана — с BiP.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-glycan-timer">«Как гликан показывает, свернулся ли белок?»</a></p><p><b>Что уточняет эта работа?</b> Доля молекул, которым нужна повторная попытка (параметр модели шаг <a href="#ns-flux-capacity">«Почему рост синтеза не обязательно увеличивает выход готового белка?»</a>), — свойство конкретного белка и его варианта: замена одной аминокислоты повышает её. Место гликанов в цепи влияет на то, какие шапероны помогают сворачиванию.</p><p><b>Ограничения.</b> Измерения проведены в культуре клеток почки эмбриона человека (линия HEK293), в которых эти белки синтезировались с введённых генов в больших количествах; клетки печени, где эти белки синтезируются в норме, секретируют их эффективнее. Доли выхода различались между сериями измерений. Подробно роль гликанов в контроле качества разбирается в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Чем варианты α1-антитрипсина, связанные с болезнью, отличались от нормального белка в этой работе?</h3><ol><li><b>А.</b> Выходили из клетки быстрее нормального белка <i>(неверный вариант)</i><br><span class="expl">Такие варианты, наоборот, задерживались</span></li><li><b>Б.</b> Совсем не получали N-гликанов в ЭПР <i>(неверный вариант)</i><br><span class="expl">Гликаны у них были; отличалась частота повторного присоединения глюкозы</span></li><li><b>В.</b> Чаще повторно получали глюкозу на гликане <i>(верный вариант)</i><br><span class="expl">Это согласуется с их задержкой в ЭПР</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2023.11.006">Guay K. P., Ke H., Canniff N. P., George G. T., Eyles S. J., Mariappan M., Contessa J. N., Gershenson A., Gierasch L. M., Hebert D. N. ER chaperones use a protein folding and quality control glyco-code. Mol. Cell. 2023; 83: 4524–4537</a></li></ul><p>Схема по данным работы: доли выхода — по измерениям в культуре клеток; повторные циклы показаны качественно.</p></details></article><article class="card print-unit" id="ns-golgi-passage"><div class="eyebrow">Метка маннозо-6-фосфат и доставка лизосомной гидролазы · шаг 16 из 29</div><h2>Как устроен аппарат Гольджи и что в нём происходит с гликанами?</h2><p class="lead"><a href="#ns-g-S4-T26">Аппарат Гольджи</a> — стопка уплощённых мембранных цистерн с полярностью: <a href="#ns-g-S4-T46">груз</a> (транспортируемые белки и липиды) поступает в <a href="#ns-g-S4-T27">цис-сеть</a> со стороны ЭПР, проходит медиальные цистерны и выходит из <a href="#ns-g-S4-T28">транс-сети аппарата Гольджи</a>.</p><div class="note"><strong>Что показывает схема.</strong> Аппарат Гольджи поляризован: груз проходит от цис- к транс-стороне, и гликаны перестраиваются по порядку</div><p>Носители с оболочкой COP-II доставляют белки из ЭПР; сливаясь друг с другом, они образуют скопления пузырьков и трубочек, которые движутся к цис-стороне. В цистернах ферменты отщепляют часть остатков маннозы с N-гликанов и присоединяют другие сахара; здесь же к белкам присоединяются O-связанные углеводные цепи и сульфатные группы. Разные ферменты сосредоточены в разных цистернах, а груз проходит их от цис- к транс-стороне, поэтому модификации идут в определённом порядке. Ускользнувшие из ЭПР белки ЭПР и ферменты ранних цистерн возвращаются носителями с оболочкой <a href="#ns-g-S4-T56">COP-I</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-exit-criterion">«При каком условии белок покидает ЭПР?»</a></p><p>Итоговая структура гликана зависит от того, какие ферменты встретил белок и как долго он находился в аппарате Гольджи, поэтому у одного белка бывают разные варианты гликанов.</p><p><b>На практикуме.</b> Вкладка 3, шаги 1–2: гидролаза и секретируемый белок проходят цис-сеть, цистерны и транс-сеть.</p><p><b>Ограничения.</b> Как именно груз переходит от цистерны к цистерне — в носителях или вместе с созревающей цистерной, — обсуждается; в модели показан только порядок прохождения.</p><div class="static-quiz"><h3>Почему модификация гликанов в аппарате Гольджи идёт в определённом порядке?</h3><ol><li><b>А.</b> Ферменты разных цистерн различны, а груз идёт от цис к транс <i>(верный вариант)</i><br><span class="expl">Полярность аппарата Гольджи задаёт последовательность модификаций</span></li><li><b>Б.</b> Все ферменты находятся в транс-сети и работают одновременно <i>(неверный вариант)</i><br><span class="expl">Ферменты распределены по цистернам</span></li><li><b>В.</b> Гликан сформирован в ЭПР и в аппарате Гольджи не меняется <i>(неверный вариант)</i><br><span class="expl">В аппарате Гольджи N-гликаны существенно перестраиваются</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: три цистерны вместо реального числа; гликаны показаны условными знаками.</p></details></article><article class="card print-unit" id="ns-m6p-tag"><div class="eyebrow">Метка маннозо-6-фосфат и доставка лизосомной гидролазы · шаг 17 из 29</div><h2>Как лизосомная гидролаза получает метку маннозо-6-фосфат?</h2><p class="lead">Растворимые <a href="#ns-g-S4-T29">лизосомные гидролазы</a> — ферменты, которые расщепляют макромолекулы в кислой среде <a href="#ns-g-S4-T42">лизосомы</a>, — проходят ЭПР и аппарат Гольджи вместе с секретируемыми белками. От них гидролазы отличает метка <a href="#ns-g-S4-T30">маннозо-6-фосфат (M6P)</a> на N-гликане.</p><div class="note"><strong>Что показывает схема.</strong> Фермент метки узнаёт гидролазу по белковому участку и в два этапа ставит фосфат на маннозу её гликана</div><p>В цис-сети аппарата Гольджи фермент <a href="#ns-g-S4-T31">N-ацетилглюкозаминфосфотрансфераза</a> узнаёт гидролазу по сигнальному участку на поверхности её белковой части — группе соседних аминокислот, которая есть только у лизосомных гидролаз. Узнав, фермент переносит N-ацетилглюкозаминфосфат на маннозу гликана. <a href="#ns-g-S4-T61">Второй фермент метки</a>, работающий в транс-сети, отщепляет N-ацетилглюкозамин, и на шестом атоме углерода маннозы остаётся фосфатная группа. У гидролазы обычно несколько гликанов и поэтому несколько меток M6P.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-golgi-passage">«Как устроен аппарат Гольджи и что в нём происходит с гликанами?»</a></p><p>Сигнал для постановки метки находится в белковой части: из ЭПР все гликопротеины выходят с одинаковыми N-гликанами, и только узнавание поверхности белка позволяет пометить именно гидролазы. Сама метка — фосфорилированный сахар на гликане, а не фосфорилированная аминокислота.</p><p><b>На практикуме.</b> Вкладка 3, шаг 1: метку получает гидролаза, а не секретируемый белок рядом.</p><p><b>Ограничения.</b> Названия ферментов на коллоквиуме не требуются; важно, что метку ставит фермент, узнающий белок, а несёт её гликан.</p><div class="static-quiz"><h3>По какому признаку фермент, ставящий метку, связывает гидролазу, а не секретируемый гликопротеин с таким же N-гликаном?</h3><ol><li><b>А.</b> По особому гликану, который гидролаза получила в ЭПР <i>(неверный вариант)</i><br><span class="expl">В ЭПР все белки получают одинаковый олигосахарид</span></li><li><b>Б.</b> По сигнальному участку на поверхности белковой части гидролазы <i>(верный вариант)</i><br><span class="expl">Гликаны у них одинаковые, различаются белки</span></li><li><b>В.</b> По N-концевой сигнальной последовательности <i>(неверный вариант)</i><br><span class="expl">Она отщепляется ещё в ЭПР и в аппарат Гольджи не попадает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: условные знаки углеводов (квадрат — N-ацетилглюкозамин, кружок — манноза, «P» — фосфатная группа); химических формул на схеме нет.</p></details></article><article class="card print-unit" id="ns-m6p-receptor-cycle"><div class="eyebrow">Метка маннозо-6-фосфат и доставка лизосомной гидролазы · шаг 18 из 29</div><h2>Как метка становится адресом: цикл рецептора M6P</h2><p class="lead"><a href="#ns-g-S4-T32">Рецептор M6P</a> — трансмембранный белок транс-сети: в просвете он связывает M6P на гидролазе, а цитозольной частью — белки-адаптеры оболочки из <a href="#ns-g-S4-T43">клатрина</a>.</p><div class="note"><strong>Что показывает схема.</strong> Рецептор M6P связывает гидролазу в транс-сети, отпускает её в кислой эндосоме и возвращается</div><p>1) В транс-сети, где pH около 6,5–6,7, рецептор связывает гидролазу с меткой. 2) Рецепторы с гидролазами собираются в покрытые клатрином пузырьки; пузырьки отпочковываются от транс-сети и сливаются с ранними <a href="#ns-g-S4-T33">эндосомами</a>. 3) В эндосоме, где pH около 6, рецептор отпускает гидролазу. 4) Освободившийся рецептор возвращается в транс-сеть в носителях с оболочкой из белков <a href="#ns-g-S4-T34">ретромера</a> и используется снова. 5) В эндосоме от метки отщепляется фосфат; гидролаза остаётся в эндосомно-лизосомном пути, а эндосомы созревают в лизосомы.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-m6p-tag">«Как лизосомная гидролаза получает метку маннозо-6-фосфат?»</a>; вспомнить <a href="seminar-3-route.html#coated-pit">семинар 3: «Как клатриновая ямка собирается вокруг рецептора с грузом»</a></p><p>У каждого звена своё условие: метка — для узнавания, рецептор — для связывания и упаковки, кислая среда эндосомы — для отделения, возврат рецептора — для его повторного использования. Удаление фосфата, переход фермента в зрелую форму и его работа при кислом pH — разные процессы; например, многие гидролазы доставляются неактивными предшественниками и становятся активными после отщепления части цепи на поздних этапах созревания эндосом.</p><p><b>На практикуме.</b> Вкладка 3, шаги 2–3: где рецептор связывает и где отпускает гидролазу; возврат рецептора.</p><div class="static-quiz"><h3>Почему рецептор M6P отпускает гидролазу в эндосоме, а не в транс-сети?</h3><ol><li><b>А.</b> Потому что в транс-сети фосфат с метки уже отщеплён <i>(неверный вариант)</i><br><span class="expl">Фосфат удаляется в эндосоме, уже после отделения гидролазы от рецептора</span></li><li><b>Б.</b> Потому что в транс-сети рецептор ещё не связан с гидролазой <i>(неверный вариант)</i><br><span class="expl">Связывание происходит именно в транс-сети</span></li><li><b>В.</b> В эндосоме среда кислее (pH около 6), и рецептор отделяется от M6P <i>(верный вариант)</i><br><span class="expl">Связывание и отделение зависят от pH компартмента</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Схема качественная: значения pH — по учебнику; порядок этапов — учебная модель; размеры не в масштабе.</p></details></article><article class="card print-unit" id="ns-escape-recapture"><div class="eyebrow">Метка маннозо-6-фосфат и доставка лизосомной гидролазы · шаг 19 из 29</div><h2>Все ли гидролазы попадают в лизосомы этим путём?</h2><p class="lead">Не все молекулы гидролаз с меткой связываются с рецепторами в транс-сети: часть уходит вместе с белками конститутивной <a href="#ns-g-S4-T41">секреции</a> и выделяется из клетки.</p><div class="note"><strong>Что показывает схема.</strong> Ушедшие гидролазы возвращаются через рецепторы на поверхности; мембранные белки лизосом идут без M6P</div><p>Часть рецепторов M6P находится на плазматической мембране. Они связывают ушедшие гидролазы и возвращают их рецептор-опосредованным <a href="#ns-g-S4-T66">эндоцитозом</a> в эндосомы, а оттуда — в лизосомы. Во внеклеточной среде pH около 7,4, и гидролазы, работающие в кислой среде, там малоактивны. Мембранные белки лизосом метку M6P не несут: их направляют к лизосомам сигналы в их цитозольной части. В некоторых типах клеток, например в клетках печени, есть и пути доставки гидролаз, не зависящие от M6P.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-m6p-receptor-cycle">«Как метка становится адресом: цикл рецептора M6P»</a>; вспомнить <a href="seminar-3-route.html#rab-conversion">семинар 3: «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»</a></p><p>Значение метки видно при наследственной болезни, когда не работает фермент, ставящий метку: гидролазы многих типов клеток секретируются, а в лизосомах их почти нет (подробнее о лизосомах — <a href="seminar-5-route.html#endolysosome">семинар 5</a>).</p><p><b>На практикуме.</b> Вкладка 3, шаги 4 и 5: гидролаза, прошедшая мимо рецепторов (груз Б), и мембранный белок лизосомы (груз В).</p><p><b>Ограничения.</b> Доля гидролазы, уходящей из транс-сети без рецептора, зависит от фермента и клетки; в модели она условная.</p><div class="static-quiz"><h3>Почему мембранные белки лизосом доставляются нормально, даже когда метка M6P не ставится?</h3><ol><li><b>А.</b> Их направляют сигналы в цитозольной части <i>(верный вариант)</i><br><span class="expl">Метка M6P нужна растворимым гидролазам</span></li><li><b>Б.</b> Они получают M6P в другой органелле <i>(неверный вариант)</i><br><span class="expl">Метку ставят в цис-сети аппарата Гольджи; мембранным белкам лизосом она не нужна</span></li><li><b>В.</b> Они синтезируются прямо в лизосоме <i>(неверный вариант)</i><br><span class="expl">Белки лизосом синтезируются на рибосомах грЭПР</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li><li><a href="https://doi.org/10.1126/science.abn5648">Richards C. M., Jabs S., Qiao W. et al. The human disease gene LYSET is essential for lysosomal enzyme transport and viral infection. Science. 2022; 378: eabn5648</a></li></ul><p>Схема качественная: путь через поверхность показан как обходной; доли условные.</p></details></article><article class="card print-unit" id="ns-label-not-enough"><div class="eyebrow">Метка маннозо-6-фосфат и доставка лизосомной гидролазы · шаг 20 из 29</div><h2>Метка необходима, но не достаточна: что различает два дефекта с одинаковым исходом?</h2><p class="lead">Сверх программы. В модели независимо выключаются метка (фермент не ставит M6P) и рецептор (рецептор не узнаёт M6P). Прослеживается партия из 100 условных молекул гидролазы.</p><div class="note"><strong>Что показывает схема.</strong> Без метки и без рецептора гидролаза одинаково уходит в среду; различают их M6P на секретируемой гидролазе и захват гидролазы, добавленной в среду</div><p>Сразу после синтеза все 100 у.е. находятся в аппарате Гольджи. В норме позднее 85 у.е. оказываются в эндосомно-лизосомном пути, 15 у.е. — в среде (часть молекул проходит мимо рецепторов; доля условная, возврат с поверхности в модели не учитывается). Без метки — 100 у.е. в среде. С меткой, но без работающего рецептора — тоже 100 у.е. в среде. Внешняя картина одинакова, причины разные. Различают их два наблюдения. Первое: есть ли M6P на гидролазе из среды — есть при дефекте рецептора, нет при дефекте метки. Второе: в среду добавляют нормальную гидролазу с меткой; клетки с дефектом метки, у которых рецепторы на поверхности исправны, захватывают её и доставляют в лизосомы, а клетки без работающего рецептора — нет.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-m6p-tag">«Как лизосомная гидролаза получает метку маннозо-6-фосфат?»</a>, шаг <a href="#ns-m6p-receptor-cycle">«Как метка становится адресом: цикл рецептора M6P»</a>, шаг <a href="#ns-escape-recapture">«Все ли гидролазы попадают в лизосомы этим путём?»</a></p><p>Метка необходима гидролазе этого пути, но не достаточна: нужен ещё рецептор, который узнаёт M6P именно на гликане, кислая среда эндосомы для отделения и возврат рецептора. Гидролаза, которая доставляется к лизосомам без M6P, в модели не зависит ни от метки, ни от рецептора M6P (переключатель «M6P-независимая гидролаза»).</p><p><b>Ограничения.</b> Модель не диагностирует болезни: секреция гидролазы сама по себе не указывает на определённый дефект.</p><div class="static-quiz"><h3>Клетки с дефектом метки и клетки с дефектом рецептора одинаково секретируют гидролазу. В среду добавили нормальную гидролазу с меткой. Что различит эти клетки?</h3><ol><li><b>А.</b> Количество собственной гидролазы в среде <i>(неверный вариант)</i><br><span class="expl">Оно одинаково: в модели 100 из 100 у.е. в обоих случаях</span></li><li><b>Б.</b> Захват добавленной гидролазы в лизосомы <i>(верный вариант)</i><br><span class="expl">У клеток с дефектом метки рецепторы на поверхности исправны</span></li><li><b>В.</b> Наличие N-гликана на секретируемой гидролазе <i>(неверный вариант)</i><br><span class="expl">N-гликан есть в обоих случаях; различается фосфат на маннозе</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 12 «Intracellular Organization and Protein Sorting», Chapter 13 «Intracellular Membrane Traffic», Chapter 19 «Cell Junctions and the Extracellular Matrix»</li></ul><p>Учебная модель · 100 условных молекул; доли 85 и 15 условные.</p></details></article><article class="card print-unit" id="ns-lyset"><div class="eyebrow">Метка маннозо-6-фосфат и доставка лизосомной гидролазы · шаг 21 из 29</div><h2>Почему для метки нужна не только фосфотрансфераза?</h2><p class="lead">Сверх программы. Новые данные: найден белок мембраны аппарата Гольджи, без которого метка M6P не ставится, хотя сам фермент, ставящий метку, синтезируется.</p><div class="note"><strong>Что показывает схема.</strong> Белок LYSET нужен, чтобы фермент метки M6P оставался в аппарате Гольджи</div><p>Белок назвали <a href="#ns-g-S4-T44">LYSET</a> — фактор транспорта лизосомных ферментов. Он связывается с ферментом, ставящим метку, и, по модели авторов, удерживает его в аппарате Гольджи. Без LYSET этот фермент уходит из аппарата Гольджи в лизосомы и разрушается там, хотя количество его мРНК почти не меняется. Метки M6P на гидролазах почти нет; растворимые гидролазы выделяются в среду, в лизосомах их мало, и в лизосомах накапливается непереваренный материал. Гидролазы, доставляемые без M6P, и мембранные белки лизосом при этом не страдают. Ген нашли при поиске генов, нужных вирусам для заражения клетки: многим вирусам для входа нужны лизосомные протеазы, и клетки без LYSET устойчивы к таким вирусам.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-m6p-tag">«Как лизосомная гидролаза получает метку маннозо-6-фосфат?»</a>, шаг <a href="#ns-label-not-enough">«Метка необходима, но не достаточна: что различает два дефекта с одинаковым исходом?»</a></p><p><b>Что уточняет эта работа?</b> Для метки нужен не один фермент, а правильно расположенный ферментный аппарат; «метка не ставится» может иметь разные причины. Варианты LYSET, найденные у людей с наследственным нарушением, сходным с болезнью при дефекте фермента метки, не восстанавливали сортировку в клетках без LYSET.</p><p><b>Ограничения.</b> У мышей без LYSET были изменения в клетках и в сыворотке крови, но таких клинических проявлений, как у людей с нарушением метки, не наблюдалось.</p><div class="static-quiz"><h3>Что происходит с ферментом, ставящим метку M6P, в клетках без LYSET?</h3><ol><li><b>А.</b> Он перестаёт синтезироваться <i>(неверный вариант)</i><br><span class="expl">Количество его мРНК почти не меняется; меняется местоположение белка</span></li><li><b>Б.</b> Он остаётся в аппарате Гольджи, но ставит метку на все гликопротеины подряд <i>(неверный вариант)</i><br><span class="expl">Наоборот: метки почти нет, потому что фермент покидает аппарат Гольджи</span></li><li><b>В.</b> Он уходит из аппарата Гольджи в лизосомы и разрушается там <i>(верный вариант)</i><br><span class="expl">Поэтому метка не ставится</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.abn5648">Richards C. M., Jabs S., Qiao W. et al. The human disease gene LYSET is essential for lysosomal enzyme transport and viral infection. Science. 2022; 378: eabn5648</a></li></ul><p>Схема по данным работы: местоположение фермента в норме и без LYSET; формы условные.</p></details></article><article class="card print-unit" id="ns-tgn-routes"><div class="eyebrow">Транс-сеть аппарата Гольджи: три направления груза · шаг 22 из 29</div><h2>По каким признакам транс-сеть распределяет груз?</h2><p class="lead">Из <a href="#ns-g-S4-T28">транс-сети аппарата Гольджи</a> груз уходит в трёх основных направлениях: к эндосомам и далее к лизосомам; в секреторные гранулы для регулируемой секреции; к плазматической мембране конститутивным путём.</p><div class="note"><strong>Что показывает схема.</strong> Из транс-сети груз уходит к эндосомам, в секреторные гранулы и к плазматической мембране</div><p>1) Гидролазы с M6P связываются с рецептором M6P и уходят в покрытых клатрином пузырьках к эндосомам (шаг <a href="#ns-m6p-receptor-cycle">«Как метка становится адресом: цикл рецептора M6P»</a>). 2) <a href="#ns-g-S4-T35">Регулируемая секреция</a> есть в специализированных секреторных клетках: белки-продукты собираются в просвете транс-сети в плотные скопления (в кислой среде при высокой концентрации Ca²⁺) и упаковываются в <a href="#ns-g-S4-T36">секреторные гранулы</a>; гранулы созревают, их содержимое концентрируется, и они сливаются с плазматической мембраной только после сигнала — это регулируемый <a href="#ns-g-S4-T38">экзоцитоз</a>. 3) <a href="#ns-g-S4-T37">Конститутивная секреция</a> идёт непрерывно во всех клетках: в неполяризованной клетке белок просвета, который не возвращён в ЭПР, не удержан в аппарате Гольджи и не отобран в другие направления, уходит этим путём к поверхности без особого сигнала (конститутивный экзоцитоз). Белки плазматической мембраны идут тем же потоком, оставаясь встроенными в мембрану носителя.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-golgi-passage">«Как устроен аппарат Гольджи и что в нём происходит с гликанами?»</a>, шаг <a href="#ns-m6p-receptor-cycle">«Как метка становится адресом: цикл рецептора M6P»</a></p><p>Признаки распределения различны: метка, которую узнаёт рецептор; физические свойства груза — способность собираться в скопления, встроенность в мембрану; отсутствие особого сигнала. Мембранный белок уходит вместе с мембраной носителя и сохраняет ориентацию (шаг <a href="#ns-topology-kept">«Почему мембранный белок не переворачивается по пути к поверхности?»</a>). В поляризованных клетках, например в эпителии, к апикальной и базолатеральной мембране ведут разные пути, и хотя бы для одного из них нужен сигнал. Отсюда следует, что единого правила «один сигнал — один адрес» для всех грузов транс-сети нет.</p><p><b>На практикуме.</b> Вкладка 4, шаги 1–2.</p><p><b>Ограничения.</b> Секреция белков в обход аппарата Гольджи существует, но в этом семинаре не рассматривается.</p><div class="static-quiz"><h3>Растворимый белок в просвете транс-сети не несёт M6P и не собирается в скопления; клетка неполяризованная. Куда он направится?</h3><ol><li><b>А.</b> Конститутивным путём в среду <i>(верный вариант)</i><br><span class="expl">Для конститутивного пути в такой клетке особый сигнал не нужен</span></li><li><b>Б.</b> В секреторные гранулы до сигнала <i>(неверный вариант)</i><br><span class="expl">В гранулы попадают белки, собирающиеся в скопления в специализированных секреторных клетках</span></li><li><b>В.</b> Останется в транс-сети, пока не поступит сигнал <i>(неверный вариант)</i><br><span class="expl">Только после сигнала с мембраной сливаются гранулы регулируемо
