которая нарушает его работу, но не сворачивание, может выйти из ЭПР."],"conditions":"Схема качественная: последовательность состояний — учебная модель; число циклов условное.","sources":["src_01"],"base":"БИО-4·9","quiz":{"id":"S4-L10","question":"Что происходит с ещё не свернувшимся гликопротеином после отщепления последней глюкозы?","options":[{"id":"S4-L10-1","text":"Глюкоза присоединяется вновь, и белок снова у калнексина","correct":true,"feedback":"Так белок получает повторную попытку сворачивания"},{"id":"S4-L10-2","text":"Белок сразу выходит в аппарат Гольджи, так как глюкозы нет","correct":false,"feedback":"Покинуть ЭПР может только свернувшийся белок"},{"id":"S4-L10-3","text":"Белок сразу направляется на удаление в протеасому","correct":false,"feedback":"Удаление начинается позже, после укорочения маннозных ветвей гликана"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как гликан метит состояние белка?","status":"Схема качественная: последовательность состояний — учебная модель","modes_label":"Состояние","modes":["связь с калнексином","свёрнут — освобождён","не свёрнут — повторная попытка","укороченный гликан"],"args":[["bound"],["free_ok"],["retry"],["trim"]],"notes":["Одна глюкоза на гликане удерживает белок у калнексина","Глюкоза снята, белок свёрнут — может выйти","Белок не свёрнут — глюкоза присоединена вновь","Маннозы отщеплены — белок направляется на удаление"],"static":["Гликан с одной глюкозой связывает белок с калнексином; несвёрнутый белок получает глюкозу вновь; укорочение гликана ведёт к удалению"],"scene":"s4_t2b","L":{"s4_t2b_cnx":"калнексин","s4_t2b_glc":"одна глюкоза","s4_t2b_gls":"отщепление глюкозы","s4_t2b_ugt":"глюкоза присоединена вновь","s4_t2b_man":"маннозидаза укорачивает гликан","s4_t2b_exit":"к выходу из ЭПР","s4_t2b_erad":"на удаление","lbl_cytosol":"цитозоль","lbl_lumen":"просвет ЭПР"}}}},{"id":"exit-criterion","num":11,"section":1,"questions":[2],"title":"При каком условии белок покидает ЭПР?","keywords":["Транспортный носитель","COP-II","Участок выхода из ЭПР","Сигнал возврата KDEL","KDEL-рецептор","COP-I"],"lead":["Из ЭПР выходят только правильно свёрнутые белки, а белки, состоящие из нескольких субъединиц, — только после сборки всех субъединиц. Это главное условие экспорта в аппарат Гольджи."],"mechanism":["Готовые к выходу белки упаковываются в [[T49|транспортные носители]], покрытые оболочкой [[T20|COP-II]] (COP — белки оболочки); носители отпочковываются от [[T21|участков выхода из ЭПР]], свободных от рибосом. Многие мембранные белки активно отбираются в носитель по сигналам выхода на своей цитозольной части; часть растворимых белков связывают в просвете трансмембранные рецепторы груза; часть попадает в носитель без отбора. Несвернувшиеся и несобранные белки связаны с шаперонами (BiP, калнексином) и остаются в ЭПР. Растворимые белки ЭПР несут на C-конце [[T60|сигнал возврата]] из четырёх аминокислот (у многих — Lys–Asp–Glu–Leu, KDEL); если такой белок всё же покинул ЭПР, его связывает [[T22|KDEL-рецептор]] и возвращает в ЭПР в носителях, покрытых [[T56|COP-I]]."],"paragraphs":["Задержка бывает массовой: у рецептора T-лимфоцитов и у ацетилхолинового рецептора большая часть вновь синтезированных субъединиц не встречает партнёров, не собирается и разрушается, не достигнув поверхности клетки. Клетка синтезирует такие субъединицы с избытком. Значит, «вошёл в ЭПР» и «готов к экспорту» — разные состояния.","<b>На практикуме.<\/b> Вкладка 2, шаги 3 и 5: двухсубъединичный рецептор без партнёрной субъединицы; белок ЭПР, вернувшийся по сигналу KDEL.","<b>Ограничения.<\/b> Сигналы выхода растворимых белков известны не полностью."],"conditions":"Схема качественная: показаны выход в носителе с COP-II и возврат в носителе с COP-I; масштаб условный.","sources":["src_01"],"base":"БИО-4·10; вспомнить [[seminar-3-route.html#snare-zipper|семинар 3: «Как SNARE-комплекс сближает мембраны и почему его нужно разбирать»]]","quiz":{"id":"S4-L11","question":"Субъединица рецептора свернулась правильно, но партнёрная субъединица в клетке не синтезируется. Что ожидается?","options":[{"id":"S4-L11-1","text":"Субъединица одна дойдёт до поверхности клетки","correct":false,"feedback":"Несобранную субъединицу удерживают шапероны ЭПР"},{"id":"S4-L11-2","text":"Субъединица задержится в ЭПР, а затем будет удалена","correct":true,"feedback":"Выходят только собранные комплексы"},{"id":"S4-L11-3","text":"Субъединицу вернёт в ЭПР KDEL-рецептор","correct":false,"feedback":"KDEL-рецептор возвращает собственные растворимые белки ЭПР; несобранная субъединица ЭПР не покидает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Кто выходит из ЭПР, кто остаётся?","status":"Схема качественная: масштаб условный","modes_label":"Груз","modes":["растворимый белок","две субъединицы","нет партнёра","возврат по KDEL"],"args":[["sol"],["pair"],["single"],["kdel"]],"notes":["Свёрнутый белок уходит в носителе с COP-II","Собранный комплекс уходит","Несобранная субъединица удерживается шаперонами","Ушедший белок ЭПР возвращается в носителе с COP-I"],"static":["Из ЭПР выходят свёрнутые и собранные белки; несобранные задерживаются; белки ЭПР с KDEL возвращаются"],"scene":"s4_t2c","L":{"s4_t2c_eres":"участок выхода из ЭПР","s4_t2c_copii":"оболочка COP-II","s4_t2c_copi":"оболочка COP-I","s4_t2c_kdel":"сигнал KDEL","s4_t2c_kdelr":"KDEL-рецептор","s4_t2c_ab":"субъединицы α и β","s4_t2c_wait":"задержка: нет партнёра","s4_t2c_golgi":"к аппарату Гольджи","lbl_cytosol":"цитозоль","lbl_lumen":"просвет ЭПР","s4_t2a_bip":"BiP","s4_t2b_cnx":"калнексин","t2_lbl_a":"α","t2_lbl_cis":"цис-сеть аппарата Гольджи","t2_lbl_kdel":"KDEL"}}},"exam_quiz":{"id":"S4-E01","question":"Какой оболочкой покрыты носители, переносящие белки из ЭПР в аппарат Гольджи?","options":[{"id":"S4-E01-1","text":"COP-II","correct":true,"feedback":"Да"},{"id":"S4-E01-2","text":"COP-I","correct":false,"feedback":"COP-I — оболочка носителей обратного направления"},{"id":"S4-E01-3","text":"Клатрин","correct":false,"feedback":"Клатрин — оболочка пузырьков транс-сети и плазматической мембраны"}]}},{"id":"er-removal","num":12,"section":1,"questions":[2],"title":"Как удаляется белок, который так и не свернулся?","keywords":["Протеасома","ERAD (деградация, связанная с ЭПР)","Канал удаления (канал ретротранслокации)","Убиквитин"],"lead":["Белок, который не свернулся за отведённое время, переносится из ЭПР обратно в цитозоль и разрушается в [[T23|протеасоме]]. Этот процесс называют деградацией, связанной с ЭПР ([[T24|ERAD]])."],"mechanism":["Шапероны удерживают такой белок развёрнутым и не дают ему слипаться; ферменты семейства PDI разрывают его дисульфидные связи, чтобы цепь стала линейной; лектины узнают укороченный гликан. Белок проходит в цитозоль через [[T59|канал удаления]] в мембране ЭПР. Канал связан с ферментом, который присоединяет к выходящей цепи цепочку [[T25|убиквитина]]. Убиквитин не даёт белку соскользнуть обратно и служит «ручкой» для АТФазы, которая вытягивает белок. В цитозоле фермент отщепляет гликан целиком, и белок расщепляется протеасомой."],"paragraphs":["Поэтому удаляемый белок в цитозоле лишён гликана и несёт убиквитин, а задержанный белок находится в просвете ЭПР с гликаном. Удаление — не уничтожение всех новых молекул: нормальный белок успевает свернуться и выйти раньше, чем запускается удаление. Иногда удаляется белок, который мог бы работать: при наиболее частых мутациях, вызывающих муковисцидоз, хлоридный канал свёрнут почти правильно, но удерживается в ЭПР и разрушается. Клинический пример иллюстрирует механизм. Подробно об убиквитине и протеасоме — [[seminar-5-route.html#ubiquitin-cascade|семинар 5]].","<b>На практикуме.<\/b> Вкладка 2, шаг 4: медленно сворачивающийся вариант направляется на удаление."],"conditions":"Схема качественная: этапы переноса в цитозоль — учебная модель; число остатков убиквитина условное.","sources":["src_01"],"base":"БИО-4·10","quiz":{"id":"S4-L12","question":"Почему контроль качества ЭПР не удаляет белки, которые только что вошли в ЭПР и ещё не свернулись?","options":[{"id":"S4-L12-1","text":"Протеасома находится в просвете ЭПР и работает медленно","correct":false,"feedback":"Протеасома находится в цитозоле; белок для удаления выводится из ЭПР"},{"id":"S4-L12-2","text":"Несвернувшиеся белки не связываются шаперонами","correct":false,"feedback":"Наоборот: связывание шаперонами удерживает несвернувшийся белок в ЭПР"},{"id":"S4-L12-3","text":"Удаление начинается только после укорочения гликана","correct":true,"feedback":"Укорочение маннозных ветвей служит «часами»"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как удаляется несвернувшийся белок?","status":"Схема качественная: этапы — учебная модель","modes_label":"Этап","modes":["узнавание","выход и убиквитин","гликан снят, протеасома"],"args":[["rec"],["out"],["deg"]],"notes":["Лектин узнаёт укороченный гликан","Белок вышел в цитозоль и получил убиквитин","Без гликана белок расщепляется протеасомой"],"static":["Несвернувшийся белок выводится из ЭПР в цитозоль, получает убиквитин, теряет гликан и расщепляется в протеасоме"],"scene":"s4_r_erad","L":{"s4_r_erad_lectin":"лектин узнаёт укороченный гликан","s4_r_erad_chan":"канал удаления","s4_r_erad_e3":"убиквитинлигаза","s4_r_erad_ub":"убиквитин","s4_r_erad_atp":"АТФаза вытягивает белок","s4_r_erad_deg":"гликан отщеплён","s4_r_erad_prot":"протеасома","s4_r_erad_cyt":"цитозоль","s4_r_erad_lum":"просвет ЭПР","s4_t2a_bip":"BiP"}}}},{"id":"flux-capacity","num":13,"section":1,"questions":[2],"title":"Почему рост синтеза не обязательно увеличивает выход готового белка?","keywords":["Ёмкость сворачивания и проверки"],"lead":["Сверх программы. Учебная потоковая модель: за каждый интервал времени в ЭПР входит определённое количество белка; ЭПР может провести за интервал ограниченное число проверок сворачивания — это [[T47|ёмкость сворачивания и проверки]]."],"mechanism":["Все числа — условные единицы (у.е.). Ёмкость — 120 проверок за интервал. Молекула, свернувшаяся с первой попытки, требует одной проверки; молекула, которой нужна повторная попытка, — двух; окончательно дефектная — тоже двух, после чего удаляется. В обычном случае повторная попытка нужна 15 % молекул (доля 0,15), окончательно дефектны 5 % (доля 0,05); одна молекула в среднем требует 1,2 проверки, и за интервал можно обработать не больше 100 у.е. белка: выходят 95, удаляются 5. Баланс каждого интервала: очередь в начале + вход = вышли готовыми + удалены + не проверены к концу. Вход 60 у.е.: выходят 57, удаляются 3, непроверенных нет. Вход 150 у.е.: выходят те же 95, удаляются 5, а 50 у.е. остаются в ЭПР непроверенными; за четыре интервала очередь непроверенных вырастает до 200 у.е."],"paragraphs":["Если при входе 150 у.е. снизить вход до 100, выход не уменьшится — те же 95 у.е., — а накопление прекратится. Доля молекул, которым нужна повторная попытка, сказывается только у предела ёмкости: при входе 60 у.е. выход одинаков (57) при доле 0,15 и при доле 0,45; при входе 150 у.е. и доле 0,45 выходят лишь 76 у.е., а 70 у.е. за интервал остаются непроверенными. Модель показывает: выход ограничен ёмкостью, и избыток входа превращается в накопление в ЭПР, а не в готовый белок.","<b>Ограничения.<\/b> В клетке ёмкость ЭПР не постоянна: накопление несвернувшихся белков запускает ответ, который увеличивает ёмкость ЭПР и снижает вход новых белков (курс «Молекулярная биология»). В модели нет слипания белков, гибели клетки и различий между белками. Непроверенные молекулы в модели остаются в очереди сколь угодно долго и никогда не удаляются; в клетке это не так: долго не свернувшийся белок теряет маннозы гликана и направляется на удаление (БИО-4·12)."],"conditions":"Учебная модель · условные единицы; ёмкость и число проверок на молекулу — допущения, а не измеренные величины.","sources":["src_01"],"base":"БИО-4·10, БИО-4·11, БИО-4·12","level":"adv","next_base":"golgi-passage","quiz":{"id":"S4-L13","question":"В модели вход вырос со 100 до 150 у.е. за интервал при ёмкости 120 проверок. Что изменится?","options":[{"id":"S4-L13-1","text":"Выход останется 95 у.е., растёт очередь","correct":true,"feedback":"За интервал можно обработать не больше 100 у.е.; остальные молекулы остаются в ЭПР непроверенными"},{"id":"S4-L13-2","text":"Выход вырастет до 142,5 у.е.","correct":false,"feedback":"Так было бы без предела ёмкости; в модели предел — 120 проверок"},{"id":"S4-L13-3","text":"Выход упадёт: больше молекул удаляется","correct":false,"feedback":"Удаляется та же доля обработанных молекул — 5 у.е.; выход не падает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему выход упирается в ёмкость?","status":"Учебная модель · условные единицы","modes_label":"Условие","modes":["вход 60","вход 150","вход 150 → 100","вход 150, доля повторных 0,45"],"args":[{"I":[60,60,60,60],"q":0.15,"e":0.05,"C":120},{"I":[150,150,150,150],"q":0.15,"e":0.05,"C":120},{"I":[150,150,100,100],"q":0.15,"e":0.05,"C":120},{"I":[150,150,150,150],"q":0.45,"e":0.05,"C":120}],"notes":["Вышли 57, удалены 3, непроверенных нет","Вышли 95, удалены 5, не проверены 50 за интервал; за 4 интервала очередь — 200","Вход снижен до 100: выход тот же — 95, очередь остановилась на 100","Вышли 76, удалены 4, не проверены 70 за интервал; за 4 интервала очередь — 280"],"static":["При ёмкости 120 проверок выход не превышает 95 у.е. за интервал; рост входа выше 100 у.е. увеличивает только очередь непроверенных"],"scene":"s4_a2","L":{"s4_a2_in":"вошло в ЭПР","s4_a2_out":"вышли готовыми","s4_a2_rem":"удалены","s4_a2_held":"не проверены к концу интервала","s4_a2_stock":"очередь непроверенных","s4_a2_cap":"ёмкость: 120 проверок за интервал","s4_a2_ue":"у.е. — условные единицы","s4_a2_bal":"баланс: очередь + вход = вышли + удалены + не проверены","s4_a2_ax_k":"интервал","s4_a2_ax_q":"у.е. к концу интервала","s4_a2_b_in":"вход","s4_a2_b_out":"вышли","s4_a2_b_s0":"очередь в начале","s4_a2_b_t":"баланс интервала {k}:","s4_a2_c_in":"вход: {i} у.е. за интервал","s4_a2_c_inl":"вход по интервалам: {l} у.е.","s4_a2_c_qe":"доля повторных попыток: {q} · доля дефектных: {e}","s4_a2_held_i":"не проверены за интервал","s4_a2_int_t":"интервал {k} из 4","s4_a2_lim":"предел обработки: {n} у.е. за интервал","s4_a2_ue_s":"у.е."}}},"adv_kind":"Исследование модели"},{"id":"flux-inverse","num":14,"section":1,"questions":[2],"title":"Выход одинаково низкий: какие наблюдения различают причины?","keywords":[],"lead":["Сверх программы. В трёх клетках модели выход готового белка одинаков — 57 у.е. за интервал. Причины разные."],"mechanism":["Клетка 1: вход снижен до 60 у.е. (ёмкость 120, обычные доли) — удаляются 3 у.е., непроверенных нет. Клетка 2: ёмкость снижена до 72 проверок, вход 100 у.е. — удаляются 3 у.е., а в ЭПР остаются 40 у.е. за каждый интервал (160 у.е. за четыре интервала). Клетка 3: доля дефектных молекул выросла до 0,24, вход 75 у.е. — удаляются 18 у.е., непроверенных нет. Накопление в ЭПР наблюдается только в клетке 2, повышенное количество удаляемого белка — только в клетке 3; в клетке 1 оба показателя малы, но мал и вход."],"paragraphs":["Значит, одного наблюдения «выход низкий» недостаточно для вывода о причине: нужны наблюдения ближе к месту нарушения — сколько белка входит, сколько остаётся в ЭПР и сколько удаляется.","<b>Ограничения.<\/b> В модели количество удаляемого белка задано числом; в клетке его приходится измерять отдельно."],"conditions":"Учебная модель · условные единицы; три клетки различаются одним параметром каждая.","sources":["src_01"],"base":"БИО-4·13","level":"adv","next_base":"golgi-passage","quiz":{"id":"S4-L14","question":"Выход 57 у.е. за интервал; в ЭПР за четыре интервала накопилось 160 у.е.; удаляется по 3 у.е. за интервал. С какой причиной совместимы эти данные?","options":[{"id":"S4-L14-1","text":"Снижен вход белка в ЭПР за интервал","correct":false,"feedback":"При сниженном входе накопления в ЭПР нет"},{"id":"S4-L14-2","text":"Снижена ёмкость сворачивания и проверки","correct":true,"feedback":"Избыток входа задерживается в ЭПР"},{"id":"S4-L14-3","text":"Выросла доля окончательно дефектных молекул","correct":false,"feedback":"Тогда удалялось бы больше белка (18 у.е.), а накопления не было бы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что различает три причины одинакового выхода?","status":"Учебная модель · условные единицы","modes_label":"Клетка","modes":["клетка 1","клетка 2","клетка 3"],"args":[{"I":[60,60,60,60],"q":0.15,"e":0.05,"C":120},{"I":[100,100,100,100],"q":0.15,"e":0.05,"C":72},{"I":[75,75,75,75],"q":0.15,"e":0.24,"C":120}],"notes":["Выход 57, удалены 3, накопления нет: мал вход","Выход 57, удалены 3, накоплено 160 за 4 интервала: мала ёмкость","Выход 57, удалены 18, накопления нет: много дефектных молекул"],"static":["Одинаковый выход 57 у.е. различается по накоплению в ЭПР и по количеству удаляемого белка"],"scene":"s4_a2","L":{"s4_a2_in":"вошло в ЭПР","s4_a2_out":"вышли готовыми","s4_a2_rem":"удалены","s4_a2_held":"не проверены к концу интервала","s4_a2_stock":"очередь непроверенных","s4_a2_cap":"ёмкость: 120 проверок за интервал","s4_a2_ue":"у.е. — условные единицы","s4_a2_bal":"баланс: очередь + вход = вышли + удалены + не проверены","s4_a2_cell1":"клетка 1: вход снижен","s4_a2_cell2":"клетка 2: ёмкость снижена","s4_a2_cell3":"клетка 3: больше дефектных молекул","s4_a2_ax_k":"интервал","s4_a2_ax_q":"у.е. к концу интервала","s4_a2_b_in":"вход","s4_a2_b_out":"вышли","s4_a2_b_s0":"очередь в начале","s4_a2_b_t":"баланс интервала {k}:","s4_a2_c_in":"вход: {i} у.е. за интервал","s4_a2_c_qe":"доля повторных попыток: {q} · доля дефектных: {e}","s4_a2_cap72":"ёмкость: 72 проверки за интервал","s4_a2_held_i":"не проверены за интервал","s4_a2_int_t":"интервал {k} из 4","s4_a2_lim":"предел обработки: {n} у.е. за интервал","s4_a2_ue_s":"у.е."}}},"adv_kind":"Исследование модели"},{"id":"glyco-data","num":15,"section":1,"questions":[2],"title":"Выходит ли из ЭПР каждая молекула нормального белка?","keywords":[],"lead":["Сверх программы. Новые данные о двух секретируемых белках плазмы крови — α1-антитрипсине и антитромбине — в культуре клеток человека."],"mechanism":["Даже нормальные формы этих белков выходили из клеток не полностью: в одной из серий измерений за время наблюдения в среду поступило около 65 % синтезированного α1-антитрипсина и около 51 % антитромбина. Варианты без участков N-гликозилирования в среде не обнаруживались. Варианты обоих белков, связанные с наследственными болезнями (в основном с заменами аминокислот; один из вариантов α1-антитрипсина — укороченный белок), чаще, чем нормальные, повторно получали глюкозу на гликане. Измерялось именно присоединение глюкозы; отсюда следует, что такие варианты, вероятно, чаще вновь связывались с калнексином или кальретикулином, и это согласуется с их задержкой в ЭПР. У этих белков (и ещё одного белка того же семейства — серпинов) подтвердилось ранее предложенное правило: белок с гликаном вблизи N-конца (в первых примерно 50 аминокислотах) в начале сворачивания связывается с калнексином или кальретикулином, белок без такого гликана — с BiP."],"paragraphs":["<b>Что уточняет эта работа?<\/b> Доля молекул, которым нужна повторная попытка (параметр модели БИО-4·13), — свойство конкретного белка и его варианта: замена одной аминокислоты повышает её. Место гликанов в цепи влияет на то, какие шапероны помогают сворачиванию.","<b>Ограничения.<\/b> Измерения проведены в культуре клеток почки эмбриона человека (линия HEK293), в которых эти белки синтезировались с введённых генов в больших количествах; клетки печени, где эти белки синтезируются в норме, секретируют их эффективнее. Доли выхода различались между сериями измерений. Подробно роль гликанов в контроле качества разбирается в курсе «Молекулярная биология»."],"conditions":"Схема по данным работы: доли выхода — по измерениям в культуре клеток; повторные циклы показаны качественно.","sources":["src_03"],"base":"БИО-4·10","level":"adv","next_base":"golgi-passage","quiz":{"id":"S4-L15","question":"Чем варианты α1-антитрипсина, связанные с болезнью, отличались от нормального белка в этой работе?","options":[{"id":"S4-L15-1","text":"Выходили из клетки быстрее нормального белка","correct":false,"feedback":"Такие варианты, наоборот, задерживались"},{"id":"S4-L15-2","text":"Совсем не получали N-гликанов в ЭПР","correct":false,"feedback":"Гликаны у них были; отличалась частота повторного присоединения глюкозы"},{"id":"S4-L15-3","text":"Чаще повторно получали глюкозу на гликане","correct":true,"feedback":"Это согласуется с их задержкой в ЭПР"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько нормального белка выходит и почему варианты задерживаются?","status":"Схема по данным работы: клетки почки эмбриона человека (линия HEK293)","modes_label":"Белок","modes":["α1-антитрипсин","антитромбин","вариант с заменой"],"args":[["aat",65],["at3",51],["var",null]],"notes":["Гликан вблизи N-конца — сначала калнексин; вышло около 65 %","Гликана у N-конца нет — сначала BiP; вышло около 51 %","Вариант чаще возвращается на повторную проверку"],"static":["Даже нормальные белки выходят не полностью; варианты с заменой аминокислоты чаще возвращаются на повторную проверку"],"scene":"s4_r_glycodata","L":{"s4_r_glycodata_aat":"α1-антитрипсин","s4_r_glycodata_at3":"антитромбин","s4_r_glycodata_n50":"первые ~50 аминокислот","s4_r_glycodata_cnx":"калнексин","s4_r_glycodata_bip":"BiP","s4_r_glycodata_sec":"вышло в среду","s4_r_glycodata_var":"вариант с заменой аминокислоты","s4_r_glycodata_cell":"клетки почки эмбриона человека (линия HEK293)","s4_r_glycodata_cycle":"повторный возврат к калнексину","s4_r_glycodata_reglc":"чаще повторно получает глюкозу","s4_r_glycodata_series":"одна серия измерений","s4_r_ribopool_cyt":"цитозоль","s4_r_ribopool_lum":"просвет ЭПР","s4_r_signal_c":"C-конец","s4_r_signal_n":"N-конец"}}},"adv_kind":"Новые данные"},{"id":"golgi-passage","num":16,"section":2,"questions":[3],"title":"Как устроен аппарат Гольджи и что в нём происходит с гликанами?","keywords":["Аппарат Гольджи","Груз","Цис-сеть аппарата Гольджи","Транс-сеть аппарата Гольджи","COP-I"],"lead":["[[T26|Аппарат Гольджи]] — стопка уплощённых мембранных цистерн с полярностью: [[T46|груз]] (транспортируемые белки и липиды) поступает в [[T27|цис-сеть]] со стороны ЭПР, проходит медиальные цистерны и выходит из [[T28|транс-сети аппарата Гольджи]]."],"mechanism":["Носители с оболочкой COP-II доставляют белки из ЭПР; сливаясь друг с другом, они образуют скопления пузырьков и трубочек, которые движутся к цис-стороне. В цистернах ферменты отщепляют часть остатков маннозы с N-гликанов и присоединяют другие сахара; здесь же к белкам присоединяются O-связанные углеводные цепи и сульфатные группы. Разные ферменты сосредоточены в разных цистернах, а груз проходит их от цис- к транс-стороне, поэтому модификации идут в определённом порядке. Ускользнувшие из ЭПР белки ЭПР и ферменты ранних цистерн возвращаются носителями с оболочкой [[T56|COP-I]]."],"paragraphs":["Итоговая структура гликана зависит от того, какие ферменты встретил белок и как долго он находился в аппарате Гольджи, поэтому у одного белка бывают разные варианты гликанов.","<b>На практикуме.<\/b> Вкладка 3, шаги 1–2: гидролаза и секретируемый белок проходят цис-сеть, цистерны и транс-сеть.","<b>Ограничения.<\/b> Как именно груз переходит от цистерны к цистерне — в носителях или вместе с созревающей цистерной, — обсуждается; в модели показан только порядок прохождения."],"conditions":"Схема качественная: три цистерны вместо реального числа; гликаны показаны условными знаками.","sources":["src_01"],"base":"БИО-4·11","quiz":{"id":"S4-L16","question":"Почему модификация гликанов в аппарате Гольджи идёт в определённом порядке?","options":[{"id":"S4-L16-1","text":"Ферменты разных цистерн различны, а груз идёт от цис к транс","correct":true,"feedback":"Полярность аппарата Гольджи задаёт последовательность модификаций"},{"id":"S4-L16-2","text":"Все ферменты находятся в транс-сети и работают одновременно","correct":false,"feedback":"Ферменты распределены по цистернам"},{"id":"S4-L16-3","text":"Гликан сформирован в ЭПР и в аппарате Гольджи не меняется","correct":false,"feedback":"В аппарате Гольджи N-гликаны существенно перестраиваются"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как полярность аппарата Гольджи задаёт порядок модификаций?","status":"Схема качественная: три цистерны","modes_label":"Показать","modes":["путь цис → транс","перестройка гликана"],"args":[["path"],["glyc"]],"notes":["Груз входит с цис-стороны и выходит из транс-сети","В разных цистернах гликан изменяют разные ферменты"],"static":["Аппарат Гольджи поляризован: груз проходит от цис- к транс-стороне, и гликаны перестраиваются по порядку"],"scene":"s4_t3a","L":{"s4_t3a_cis":"цис-сеть","s4_t3a_med":"медиальная цистерна","s4_t3a_trans":"транс-цистерна","s4_t3a_tgn":"транс-сеть","s4_t3a_copii":"COP-II","s4_t3a_copi":"COP-I","s4_t3a_ret":"возврат ферментов и белков ЭПР","s4_t3a_glyc":"гликан перестраивается","lbl_cytosol":"цитозоль","s4_t3a_er":"ЭПР","s4_t3a_nomech":"как груз переходит между цистернами, схема не показывает"}}},"exam_quiz":{"id":"S4-E02","question":"Что переносят носители с оболочкой COP-I?","options":[{"id":"S4-E02-1","text":"Новые белки из ЭПР в аппарат Гольджи","correct":false,"feedback":"Это носители с COP-II"},{"id":"S4-E02-2","text":"Белки, возвращаемые из аппарата Гольджи в ЭПР","correct":true,"feedback":"А также ферменты аппарата Гольджи между цистернами в обратном направлении"},{"id":"S4-E02-3","text":"Гидролазы из транс-сети к эндосомам","correct":false,"feedback":"Это покрытые клатрином пузырьки"}]}},{"id":"m6p-tag","num":17,"section":2,"questions":[3],"title":"Как лизосомная гидролаза получает метку маннозо-6-фосфат?","keywords":["Лизосомная гидролаза","Лизосома","Маннозо-6-фосфат (M6P)","N-ацетилглюкозаминфосфотрансфераза","Второй фермент метки M6P"],"lead":["Растворимые [[T29|лизосомные гидролазы]] — ферменты, которые расщепляют макромолекулы в кислой среде [[T42|лизосомы]], — проходят ЭПР и аппарат Гольджи вместе с секретируемыми белками. От них гидролазы отличает метка [[T30|маннозо-6-фосфат (M6P)]] на N-гликане."],"mechanism":["В цис-сети аппарата Гольджи фермент [[T31|N-ацетилглюкозаминфосфотрансфераза]] узнаёт гидролазу по сигнальному участку на поверхности её белковой части — группе соседних аминокислот, которая есть только у лизосомных гидролаз. Узнав, фермент переносит N-ацетилглюкозаминфосфат на маннозу гликана. [[T61|Второй фермент метки]], работающий в транс-сети, отщепляет N-ацетилглюкозамин, и на шестом атоме углерода маннозы остаётся фосфатная группа. У гидролазы обычно несколько гликанов и поэтому несколько меток M6P."],"paragraphs":["Сигнал для постановки метки находится в белковой части: из ЭПР все гликопротеины выходят с одинаковыми N-гликанами, и только узнавание поверхности белка позволяет пометить именно гидролазы. Сама метка — фосфорилированный сахар на гликане, а не фосфорилированная аминокислота.","<b>На практикуме.<\/b> Вкладка 3, шаг 1: метку получает гидролаза, а не секретируемый белок рядом.","<b>Ограничения.<\/b> Названия ферментов на коллоквиуме не требуются; важно, что метку ставит фермент, узнающий белок, а несёт её гликан."],"conditions":"Схема качественная: условные знаки углеводов (квадрат — N-ацетилглюкозамин, кружок — манноза, «P» — фосфатная группа); химических формул на схеме нет.","sources":["src_01"],"base":"БИО-4·16","quiz":{"id":"S4-L17","question":"По какому признаку фермент, ставящий метку, связывает гидролазу, а не секретируемый гликопротеин с таким же N-гликаном?","options":[{"id":"S4-L17-1","text":"По особому гликану, который гидролаза получила в ЭПР","correct":false,"feedback":"В ЭПР все белки получают одинаковый олигосахарид"},{"id":"S4-L17-2","text":"По сигнальному участку на поверхности белковой части гидролазы","correct":true,"feedback":"Гликаны у них одинаковые, различаются белки"},{"id":"S4-L17-3","text":"По N-концевой сигнальной последовательности","correct":false,"feedback":"Она отщепляется ещё в ЭПР и в аппарат Гольджи не попадает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как ставится метка M6P?","status":"Схема качественная: условные знаки, без формул","modes_label":"Этап","modes":["узнавание гидролазы","перенос N-ацетилглюкозаминфосфата","метка M6P"],"args":[["tag1"],["tag2"],["tag3"]],"notes":["Фермент узнаёт участок белковой поверхности гидролазы","На маннозу перенесён N-ацетилглюкозаминфосфат","N-ацетилглюкозамин отщеплён: на маннозе осталась фосфатная группа"],"static":["Фермент метки узнаёт гидролазу по белковому участку и в два этапа ставит фосфат на маннозу её гликана"],"scene":"s4_t3a","L":{"s4_t3a_ptr":"фермент метки (фосфотрансфераза)","s4_t3a_patch":"сигнальный участок поверхности гидролазы","s4_t3a_hyd":"лизосомная гидролаза","s4_t3a_secp":"секретируемый гликопротеин: метки нет","s4_t3a_glcnacp":"N-ацетилглюкозаминфосфат","s4_t3a_m6p":"M6P: фосфат на маннозе гликана","s4_t3a_enz2":"второй фермент (в транс-сети) отщепляет N-ацетилглюкозамин","s4_t3a_cis":"цис-сеть","s4_t3a_tgn":"транс-сеть","lbl_cytosol":"цитозоль"}}}},{"id":"m6p-receptor-cycle","num":18,"section":2,"questions":[3],"title":"Как метка становится адресом: цикл рецептора M6P","keywords":["Рецептор M6P","Клатрин","Эндосома","Ретромер"],"lead":["[[T32|Рецептор M6P]] — трансмембранный белок транс-сети: в просвете он связывает M6P на гидролазе, а цитозольной частью — белки-адаптеры оболочки из [[T43|клатрина]]."],"mechanism":["1) В транс-сети, где pH около 6,5–6,7, рецептор связывает гидролазу с меткой. 2) Рецепторы с гидролазами собираются в покрытые клатрином пузырьки; пузырьки отпочковываются от транс-сети и сливаются с ранними [[T33|эндосомами]]. 3) В эндосоме, где pH около 6, рецептор отпускает гидролазу. 4) Освободившийся рецептор возвращается в транс-сеть в носителях с оболочкой из белков [[T34|ретромера]] и используется снова. 5) В эндосоме от метки отщепляется фосфат; гидролаза остаётся в эндосомно-лизосомном пути, а эндосомы созревают в лизосомы."],"paragraphs":["У каждого звена своё условие: метка — для узнавания, рецептор — для связывания и упаковки, кислая среда эндосомы — для отделения, возврат рецептора — для его повторного использования. Удаление фосфата, переход фермента в зрелую форму и его работа при кислом pH — разные процессы; например, многие гидролазы доставляются неактивными предшественниками и становятся активными после отщепления части цепи на поздних этапах созревания эндосом.","<b>На практикуме.<\/b> Вкладка 3, шаги 2–3: где рецептор связывает и где отпускает гидролазу; возврат рецептора."],"conditions":"Схема качественная: значения pH — по учебнику; порядок этапов — учебная модель; размеры не в масштабе.","sources":["src_01"],"base":"БИО-4·17; вспомнить [[seminar-3-route.html#coated-pit|семинар 3: «Как клатриновая ямка собирается вокруг рецептора с грузом»]]","quiz":{"id":"S4-L18","question":"Почему рецептор M6P отпускает гидролазу в эндосоме, а не в транс-сети?","options":[{"id":"S4-L18-1","text":"Потому что в транс-сети фосфат с метки уже отщеплён","correct":false,"feedback":"Фосфат удаляется в эндосоме, уже после отделения гидролазы от рецептора"},{"id":"S4-L18-2","text":"Потому что в транс-сети рецептор ещё не связан с гидролазой","correct":false,"feedback":"Связывание происходит именно в транс-сети"},{"id":"S4-L18-3","text":"В эндосоме среда кислее (pH около 6), и рецептор отделяется от M6P","correct":true,"feedback":"Связывание и отделение зависят от pH компартмента"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как метка становится адресом?","status":"Схема качественная: pH по учебнику","modes_label":"Звено","modes":["1 связывание","2 клатриновый пузырёк","3 отделение","4 возврат рецептора","5 фосфат снят"],"args":[["A",1],["A",2],["A",3],["A",4],["A",5]],"notes":["В транс-сети рецептор связывает M6P","Рецепторы с гидролазами уходят в пузырьке с клатрином","В эндосоме (pH ≈ 6) гидролаза отделяется","Рецептор возвращается в транс-сеть","Фосфат с метки снят; гидролаза остаётся в эндосомно-лизосомном пути"],"static":["Рецептор M6P связывает гидролазу в транс-сети, отпускает её в кислой эндосоме и возвращается"],"scene":"s4_t3b","L":{"s4_t3b_m6pr":"рецептор M6P","s4_t3b_ph_tgn":"pH ≈ 6,5–6,7","s4_t3b_ph_end":"pH ≈ 6","s4_t3b_clat":"клатрин","s4_t3b_retro":"ретромер","s4_t3b_pi":"фосфат отщеплён","s4_t3b_lys":"к лизосоме","s4_t3b_tgn":"транс-сеть","s4_t3b_endo":"эндосома","lbl_cytosol":"цитозоль","lbl_out":"снаружи клетки","s4_t3b_lyso":"лизосома","s4_t3b_pm":"плазматическая мембрана"}},"zoomNarrow":true},"exam_quiz":{"id":"S4-E06","question":"Где рецептор M6P связывает гидролазу?","options":[{"id":"S4-E06-1","text":"В лизосоме, после закисления среды","correct":false,"feedback":"В лизосому рецептор M6P не переходит: он возвращается из эндосомы"},{"id":"S4-E06-2","text":"В просвете ЭПР после синтеза","correct":false,"feedback":"В ЭПР метки M6P ещё нет"},{"id":"S4-E06-3","text":"В транс-сети аппарата Гольджи","correct":true,"feedback":"Отпускает — в эндосоме"}]}},{"id":"escape-recapture","num":19,"section":2,"questions":[3],"title":"Все ли гидролазы попадают в лизосомы этим путём?","keywords":["Секреция","Эндоцитоз"],"lead":["Не все молекулы гидролаз с меткой связываются с рецепторами в транс-сети: часть уходит вместе с белками конститутивной [[T41|секреции]] и выделяется из клетки."],"mechanism":["Часть рецепторов M6P находится на плазматической мембране. Они связывают ушедшие гидролазы и возвращают их рецептор-опосредованным [[T66|эндоцитозом]] в эндосомы, а оттуда — в лизосомы. Во внеклеточной среде pH около 7,4, и гидролазы, работающие в кислой среде, там малоактивны. Мембранные белки лизосом метку M6P не несут: их направляют к лизосомам сигналы в их цитозольной части. В некоторых типах клеток, например в клетках печени, есть и пути доставки гидролаз, не зависящие от M6P."],"paragraphs":["Значение метки видно при наследственной болезни, когда не работает фермент, ставящий метку: гидролазы многих типов клеток секретируются, а в лизосомах их почти нет (подробнее о лизосомах — [[seminar-5-route.html#endolysosome|семинар 5]]).","<b>На практикуме.<\/b> Вкладка 3, шаги 4 и 5: гидролаза, прошедшая мимо рецепторов (груз Б), и мембранный белок лизосомы (груз В).","<b>Ограничения.<\/b> Доля гидролазы, уходящей из транс-сети без рецептора, зависит от фермента и клетки; в модели она условная."],"conditions":"Схема качественная: путь через поверхность показан как обходной; доли условные.","sources":["src_01","src_04"],"base":"БИО-4·18; вспомнить [[seminar-3-route.html#rab-conversion|семинар 3: «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»]]","quiz":{"id":"S4-L19","question":"Почему мембранные белки лизосом доставляются нормально, даже когда метка M6P не ставится?","options":[{"id":"S4-L19-1","text":"Их направляют сигналы в цитозольной части","correct":true,"feedback":"Метка M6P нужна растворимым гидролазам"},{"id":"S4-L19-2","text":"Они получают M6P в другой органелле","correct":false,"feedback":"Метку ставят в цис-сети аппарата Гольджи; мембранным белкам лизосом она не нужна"},{"id":"S4-L19-3","text":"Они синтезируются прямо в лизосоме","correct":false,"feedback":"Белки лизосом синтезируются на рибосомах грЭПР"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие ещё пути ведут к лизосоме?","status":"Схема качественная: доли условные","modes_label":"Груз","modes":["ушедшая гидролаза","мембранный белок лизосомы"],"args":[["B",0],["C",0]],"notes":["Ушедшая гидролаза возвращается через рецептор M6P на поверхности","Мембранный белок лизосомы направляется сигналом в цитозольной части"],"static":["Ушедшие гидролазы возвращаются через рецепторы на поверхности; мембранные белки лизосом идут без M6P"],"scene":"s4_t3b","L":{"s4_t3b_esc":"прошла мимо рецепторов","s4_t3b_ph_out":"снаружи pH ≈ 7,4: гидролаза малоактивна","s4_t3b_pm_r":"рецептор M6P на поверхности","s4_t3b_endocyt":"эндоцитоз","s4_t3b_lmp":"мембранный белок лизосомы: без M6P","s4_t3b_tail":"сигнал в цитозольном хвосте","lbl_cytosol":"цитозоль","lbl_out":"снаружи клетки","s4_t3b_adapt":"адаптер","s4_t3b_const":"конститутивный путь","s4_t3b_endo":"эндосома","s4_t3b_lyso":"лизосома","s4_t3b_ph_end":"pH ≈ 6","s4_t3b_ph_tgn":"pH ≈ 6,5–6,7","s4_t3b_pm":"плазматическая мембрана","s4_t3b_tgn":"транс-сеть"}}}},{"id":"label-not-enough","num":20,"section":2,"questions":[3],"title":"Метка необходима, но не достаточна: что различает два дефекта с одинаковым исходом?","keywords":[],"lead":["Сверх программы. В модели независимо выключаются метка (фермент не ставит M6P) и рецептор (рецептор не узнаёт M6P). Прослеживается партия из 100 условных молекул гидролазы."],"mechanism":["Сразу после синтеза все 100 у.е. находятся в аппарате Гольджи. В норме позднее 85 у.е. оказываются в эндосомно-лизосомном пути, 15 у.е. — в среде (часть молекул проходит мимо рецепторов; доля условная, возврат с поверхности в модели не учитывается). Без метки — 100 у.е. в среде. С меткой, но без работающего рецептора — тоже 100 у.е. в среде. Внешняя картина одинакова, причины разные. Различают их два наблюдения. Первое: есть ли M6P на гидролазе из среды — есть при дефекте рецептора, нет при дефекте метки. Второе: в среду добавляют нормальную гидролазу с меткой; клетки с дефектом метки, у которых рецепторы на поверхности исправны, захватывают её и доставляют в лизосомы, а клетки без работающего рецептора — нет."],"paragraphs":["Метка необходима гидролазе этого пути, но не достаточна: нужен ещё рецептор, который узнаёт M6P именно на гликане, кислая среда эндосомы для отделения и возврат рецептора. Гидролаза, которая доставляется к лизосомам без M6P, в модели не зависит ни от метки, ни от рецептора M6P (переключатель «M6P-независимая гидролаза»).","<b>Ограничения.<\/b> Модель не диагностирует болезни: секреция гидролазы сама по себе не указывает на определённый дефект."],"conditions":"Учебная модель · 100 условных молекул; доли 85 и 15 условные.","sources":["src_01"],"base":"БИО-4·17, БИО-4·18, БИО-4·19","level":"adv","next_base":"tgn-routes","quiz":{"id":"S4-L20","question":"Клетки с дефектом метки и клетки с дефектом рецептора одинаково секретируют гидролазу. В среду добавили нормальную гидролазу с меткой. Что различит эти клетки?","options":[{"id":"S4-L20-1","text":"Количество собственной гидролазы в среде","correct":false,"feedback":"Оно одинаково: в модели 100 из 100 у.е. в обоих случаях"},{"id":"S4-L20-2","text":"Захват добавленной гидролазы в лизосомы","correct":true,"feedback":"У клеток с дефектом метки рецепторы на поверхности исправны"},{"id":"S4-L20-3","text":"Наличие N-гликана на секретируемой гидролазе","correct":false,"feedback":"N-гликан есть в обоих случаях; различается фосфат на маннозе"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему метка необходима, но не достаточна?","status":"Учебная модель · 100 условных молекул","modes_label":"Условие","modes":["метка и рецептор","нет метки","нет рецептора","добавлена гидролаза с меткой"],"args":[[1,1,0],[0,1,0],[1,0,0],["uptake"]],"notes":["85 у.е. в эндосомно-лизосомном пути, 15 в среде","100 у.е. в среде; на гидролазе нет M6P","100 у.е. в среде; на гидролазе есть M6P","Клетки с дефектом метки захватывают добавленную гидролазу; клетки без рецептора — нет"],"static":["Без метки и без рецептора гидролаза одинаково уходит в среду; различают их M6P на секретируемой гидролазе и захват гидролазы, добавленной в среду"],"scene":"s4_a3","L":{"s4_a3_golgi":"аппарат Гольджи","s4_a3_endolys":"эндосомы и лизосомы","s4_a3_medium":"внеклеточная среда","s4_a3_early":"сразу после синтеза","s4_a3_late":"позднее","s4_a3_m6p_med":"M6P на гидролазе из среды","s4_a3_add":"в среду добавлена гидролаза с меткой","s4_a3_capt":"захвачена и доставлена в лизосомы","s4_a3_stay":"осталась в среде","s4_a3_ue":"100 условных молекул","lbl_cytosol":"цитозоль","lbl_out":"снаружи клетки","s4_a3g_axis":"у.е.","s4_a3g_cell_nolab":"дефект метки, рецептор исправен","s4_a3g_cell_norec":"нет рецептора M6P","s4_a3g_endocyt":"эндоцитоз","s4_a3g_hydro":"гидролаза","s4_a3g_k_ind":"гидролаза доставляется без M6P","s4_a3g_k_lab":"метка M6P ставится","s4_a3g_k_rec":"рецептор M6P узнаёт метку","s4_a3g_lyso":"лизосома","s4_a3g_noret":"Возврат ушедших гидролаз с поверхности в распределении не учтён; доли условные","s4_a3g_rec":"рецептор M6P","s4_a3g_tgnlum":"просвет транс-сети","s4_a3g_title":"Партия гидролазы — {ue}","s4_a3g_via_endo":"через эндосомы","s4_c_no":"нет","s4_c_yes":"есть","s4_pan_A":"А","s4_pan_B":"Б","s4_v_no":"нет","s4_v_yes":"да"}}},"adv_kind":"Исследование модели"},{"id":"lyset","num":21,"section":2,"questions":[3],"title":"Почему для метки нужна не только фосфотрансфераза?","keywords":["LYSET"],"lead":["Сверх программы. Новые данные: найден белок мембраны аппарата Гольджи, без которого метка M6P не ставится, хотя сам фермент, ставящий метку, синтезируется."],"mechanism":["Белок назвали [[T44|LYSET]] — фактор транспорта лизосомных ферментов. Он связывается с ферментом, ставящим метку, и, по модели авторов, удерживает его в аппарате Гольджи. Без LYSET этот фермент уходит из аппарата Гольджи в лизосомы и разрушается там, хотя количество его мРНК почти не меняется. Метки M6P на гидролазах почти нет; растворимые гидролазы выделяются в среду, в лизосомах их мало, и в лизосомах накапливается непереваренный материал. Гидролазы, доставляемые без M6P, и мембранные белки лизосом при этом не страдают. Ген нашли при поиске генов, нужных вирусам для заражения клетки: многим вирусам для входа нужны лизосомные протеазы, и клетки без LYSET устойчивы к таким вирусам."],"paragraphs":["<b>Что уточняет эта работа?<\/b> Для метки нужен не один фермент, а правильно расположенный ферментный аппарат; «метка не ставится» может иметь разные причины. Варианты LYSET, найденные у людей с наследственным нарушением, сходным с болезнью при дефекте фермента метки, не восстанавливали сортировку в клетках без LYSET.","<b>Ограничения.<\/b> У мышей без LYSET были изменения в клетках и в сыворотке крови, но таких клинических проявлений, как у людей с нарушением метки, не наблюдалось."],"conditions":"Схема по данным работы: местоположение фермента в норме и без LYSET; формы условные.","sources":["src_04"],"base":"БИО-4·17, БИО-4·20","level":"adv","next_base":"tgn-routes","quiz":{"id":"S4-L21","question":"Что происходит с ферментом, ставящим метку M6P, в клетках без LYSET?","options":[{"id":"S4-L21-1","text":"Он перестаёт синтезироваться","correct":false,"feedback":"Количество его мРНК почти не меняется; меняется местоположение белка"},{"id":"S4-L21-2","text":"Он остаётся в аппарате Гольджи, но ставит метку на все гликопротеины подряд","correct":false,"feedback":"Наоборот: метки почти нет, потому что фермент покидает аппарат Гольджи"},{"id":"S4-L21-3","text":"Он уходит из аппарата Гольджи в лизосомы и разрушается там","correct":true,"feedback":"Поэтому метка не ставится"}]},"widget":{"kind":"dna","title":"","s":{"title":"Где находится фермент метки с LYSET и без него?","status":"Схема по данным работы: формы условные","modes_label":"Клетка","modes":["норма","без LYSET"],"args":[["wt"],["ko"]],"notes":["LYSET удерживает фермент метки в аппарате Гольджи","Без LYSET фермент метки уходит в лизосомы и разрушается; гидролазы с меткой не образуются и уходят в среду"],"static":["Белок LYSET нужен, чтобы фермент метки M6P оставался в аппарате Гольджи"],"scene":"s4_r_lyset","L":{"s4_r_lyset_lyset":"LYSET","s4_r_lyset_ptr":"фермент метки","s4_r_lyset_golgi":"аппарат Гольджи","s4_r_lyset_lys":"лизосома","s4_r_lyset_medium":"внеклеточная среда","s4_r_lyset_deg":"фермент разрушается в лизосоме","s4_r_lyset_indep":"не зависят от M6P","s4_r_lyset_hyd_m6p":"гидролазы с меткой M6P","s4_r_lyset_hyd_no":"гидролазы без метки","s4_r_ribopool_cyt":"цитозоль"}}},"adv_kind":"Новые данные"},{"id":"tgn-routes","num":22,"section":3,"questions":[4],"title":"По каким признакам транс-сеть распределяет груз?","keywords":["Транс-сеть аппарата Гольджи","Регулируемая секреция","Секреторная гранула","Конститутивная секреция"],"lead":["Из [[T28|транс-сети аппарата Гольджи]] груз уходит в трёх основных направлениях: к эндосомам и далее к лизосомам; в секреторные гранулы для регулируемой секреции; к плазматической мембране конститутивным путём."],"mechanism":["1) Гидролазы с M6P связываются с рецептором M6P и уходят в покрытых клатрином пузырьках к эндосомам (БИО-4·18). 2) [[T35|Регулируемая секреция]] есть в специализированных секреторных клетках: белки-продукты собираются в просвете транс-сети в плотные скопления (в кислой среде при высокой концентрации Ca²⁺) и упаковываются в [[T36|секреторные гранулы]]; гранулы созревают, их содержимое концентрируется, и они сливаются с плазматической мембраной только после сигнала — это регулируемый [[T38|экзоцитоз]]. 3) [[T37|Конститутивная секреция]] идёт непрерывно во всех клетках: в неполяризованной клетке белок просвета, который не возвращён в ЭПР, не удержан в аппарате Гольджи и не отобран в другие направления, уходит этим путём к поверхности без особого сигнала (конститутивный экзоцитоз). Белки плазматической мембраны идут тем же потоком, оставаясь встроенными в мембрану носителя."],"paragraphs":["Признаки распределения различны: метка, которую узнаёт рецептор; физические свойства груза — способность собираться в скопления, встроенность в мембрану; отсутствие особого сигнала. Мембранный белок уходит вместе с мембраной носителя и сохраняет ориентацию (БИО-4·23). В поляризованных клетках, например в эпителии, к апикальной и базолатеральной мембране ведут разные пути, и хотя бы для одного из них нужен сигнал. Отсюда следует, что единого правила «один сигнал — один адрес» для всех грузов транс-сети нет.","<b>На практикуме.<\/b> Вкладка 4, шаги 1–2.","<b>Ограничения.<\/b> Секреция белков в обход аппарата Гольджи существует, но в этом семинаре не рассматривается."],"conditions":"Схема качественная: три направления из транс-сети; число носителей и их форма условные.","sources":["src_01"],"base":"БИО-4·16, БИО-4·18","quiz":{"id":"S4-L22","question":"Растворимый белок в просвете транс-сети не несёт M6P и не собирается в скопления; клетка неполяризованная. Куда он направится?","options":[{"id":"S4-L22-1","text":"Конститутивным путём в среду","correct":true,"feedback":"Для конститутивного пути в такой клетке особый сигнал не нужен"},{"id":"S4-L22-2","text":"В секреторные гранулы до сигнала","correct":false,"feedback":"В гранулы попадают белки, собирающиеся в скопления в специализированных секреторных клетках"},{"id":"S4-L22-3","text":"Останется в транс-сети, пока не поступит сигнал","correct":false,"feedback":"Только после сигнала с мембраной сливаются гранулы регулируемой секреции; из транс-сети такой белок уходит без сигнала"}]},"widget":{"kind":"dna","title":"","s":{"title":"По каким признакам транс-сеть распределяет груз?","status":"Схема качественная: неполяризованная клетка","modes_label":"Направление","modes":["к эндосомам","секреторные гранулы","конститутивный путь"],"args":[["endo"],["reg"],["const"]],"notes":["Гидролазы с M6P уходят к эндосомам","Скопления белка упаковываются в гранулы, которые сливаются с мембраной только после сигнала","Белки без особых признаков уходят к поверхности непрерывно"],"static":["Из транс-сети груз уходит к эндосомам, в секреторные гранулы и к плазматической мембране"],"scene":"s4_t4a","L":{"s4_t4a_tgn":"транс-сеть","s4_t4a_endo":"к эндосомам: M6P и рецептор","s4_t4a_gran":"секреторные гранулы: скопления белка","s4_t4a_const":"конститутивный путь: без особого сигнала","s4_t4a_signal":"экзоцитоз после сигнала","s4_t4a_pm":"плазматическая мембрана","s4_t4a_out":"снаружи клетки","s4_t4a_cyt":"цитозоль","s4_t4a_endoC":"эндосома","s4_t4a_lysoC":"лизосома"}}},"exam_quiz":{"id":"S4-E07","question":"Чем регулируемая секреция отличается от конститутивной?","options":[{"id":"S4-E07-1","text":"Продукт хранится в гранулах и выделяется после сигнала","correct":true,"feedback":"Да"},{"id":"S4-E07-2","text":"Регулируемая секреция есть во всех клетках","correct":false,"feedback":"Во всех клетках есть конститутивная секреция; регулируемая — в специализированных"},{"id":"S4-E07-3","text":"При регулируемой секреции белок не проходит аппарат Гольджи","correct":false,"feedback":"Гранулы образуются в транс-сети аппарата Гольджи"}]}},{"id":"topology-kept","num":23,"section":3,"questions":[4],"title":"Почему мембранный белок не переворачивается по пути к поверхности?","keywords":["Экзоцитоз"],"lead":["Просвет ЭПР, аппарата Гольджи и транспортных носителей по расположению относительно мембраны соответствует внеклеточной среде, а цитозольная сторона мембраны всегда обращена к цитозолю."],"mechanism":["При отпочковывании носителя кусок мембраны с её белками переносится в той же ориентации: участок белка, обращённый в просвет органеллы, обращён и в просвет носителя. При [[T38|экзоцитозе]] (как носитель узнаёт мембрану-мишень и сливается с ней — вспомнить [[seminar-3-route.html#fusion-pore|семинар 3: «Как открывается и меняется пора слияния»]]) мембрана носителя становится частью плазматической мембраны, и просвет носителя открывается во внеклеточную среду. Поэтому участок, который при встраивании в ЭПР оказался в просвете, на поверхности клетки обращён наружу, а цитозольный участок так и остаётся в цитозоле. Растворимый груз при экзоцитозе выходит в среду."],"paragraphs":["Ориентация мембранного белка задаётся один раз — при встраивании в мембрану ЭПР (БИО-4·5) — и при почковании и слиянии мембран сохраняется. Поэтому гликаны, присоединённые в просвете ЭПР и аппарата Гольджи, на плазматической мембране обращены наружу.","<b>На практикуме.<\/b> Вкладка 4, шаги 3–4: цветом отмечены сторона просвета (она же наружная) и цитозольная сторона.","<b>Ограничения.<\/b> Ошибка встраивания в ЭПР (обратная ориентация) — отдельное нарушение; при нормальном почковании и слиянии ориентация не меняется (БИО-4·25)."],"conditions":"Схема качественная: просветная и наружная стороны одного цвета, цитозольная — другого; бислой — как во всех семинарах курса.","sources":["src_01"],"base":"БИО-4·5, БИО-4·22; вспомнить [[seminar-3-route.html#fusion-pore|семинар 3: «Как открывается и меняется пора слияния»]]","quiz":{"id":"S4-L23","question":"N-концевой домен мембранного белка при встраивании оказался в просвете ЭПР. Где он будет после доставки на плазматическую мембрану?","options":[{"id":"S4-L23-1","text":"В цитозоле: при слиянии мембрана выворачивается","correct":false,"feedback":"Слияние не меняет ориентацию белков в мембране"},{"id":"S4-L23-2","text":"Снаружи клетки","correct":true,"feedback":"Просвет носителя при экзоцитозе открывается во внеклеточную среду"},{"id":"S4-L23-3","text":"У половины молекул снаружи, у половины в цитозоле","correct":false,"feedback":"Все копии встраиваются одинаково и так же переносятся"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему ориентация сохраняется до поверхности?","status":"Схема качественная: стороны окрашены одинаково на всех кадрах","modes_label":"Этап","modes":["встраивание в ЭПР","носитель","экзоцитоз"],"args":[["er"],["ves"],["pm"]],"notes":["N-домен в просвете ЭПР","N-домен в просвете носителя","N-домен снаружи клетки; хвост в цитозоле"],"static":["При почковании и слиянии ориентация белка сохраняется: участок, обращённый в просвет, на поверхности обращён наружу"],"scene":"s4_t4b","L":{"s4_t4b_ndom":"N-концевой домен","s4_t4b_tail":"цитозольный хвост","s4_t4b_lum":"просвет","s4_t4b_out":"снаружи клетки","s4_t4b_cyt":"цитозоль","s4_t4b_same":"та же сторона: просвет = снаружи","s4_t4b_fus":"экзоцитоз","s4_t4b_bud":"отпочковывание","s4_t4b_f1":"мембрана ЭПР","s4_t4b_f2":"носитель","s4_t4b_f3":"плазматическая мембрана"}}},"exam_quiz":{"id":"S4-E08","question":"Почему углеводные цепи гликопротеинов плазматической мембраны обращены наружу?","options":[{"id":"S4-E08-1","text":"Их присоединяют уже на поверхности клетки","correct":false,"feedback":"N-гликан присоединяется в ЭПР"},{"id":"S4-E08-2","text":"Их присоединяют в просвете, обращённом затем наружу","correct":true,"feedback":"При слиянии носителя с плазматической мембраной просветная сторона мембраны оказывается обращённой во внеклеточную среду"},{"id":"S4-E08-3","text":"Белок переворачивается в мембране при экзоцитозе","correct":false,"feedback":"Ориентация при слиянии сохраняется"}]}},{"id":"three-cargo","num":24,"section":3,"questions":[4],"title":"Доставлен — ещё не значит работает: адрес, топология и доступность домена","keywords":["Рецептор","Фибронектин","Рецептор ЛПНП (рецептор липопротеинов низкой плотности)","Частица ЛПНП (липопротеин низкой плотности)","Лиганд"],"lead":["Три груза — секретируемый растворимый белок, [[T50|рецептор]] плазматической мембраны и лизосомная гидролаза — проходят общий путь до транс-сети, но различаются адресом, положением относительно мембраны и местом, где работает их функциональная часть."],"mechanism":["Секретируемый белок (например, [[T69|фибронектин]]): адрес — внеклеточная среда; в пути растворён в просвете; работает вне клетки. Рецептор (например, [[T62|рецептор липопротеинов низкой плотности, рецептор ЛПНП]], который связывает [[T63|частицы ЛПНП]]): адрес — плазматическая мембрана; встроен в мембрану; домен, связывающий [[T51|лиганд]], обращён наружу, а участок, передающий сигнал, — в цитозоль. Гидролаза: адрес — лизосома; растворена в просвете; работает в кислой среде лизосомы. Для работы нужны одновременно три условия: правильный адрес, правильная топология и завершённое созревание (свёрнут, сформирован функциональный участок)."],"paragraphs":["Нарушение любого из условий даёт картину «белок есть, функции нет». Отсутствие секреции, отсутствие функции и неверный адрес — разные наблюдения, и одно не следует из другого.","<b>На практикуме.<\/b> Вкладка 4, шаг 5 и обратная задача 4: фибронектин, рецептор ЛПНП и катепсин D в одной клетке."],"conditions":"Схема качественная: три груза на одной схеме; стороны мембраны окрашены одинаково на всех панелях.","sources":["src_01"],"base":"БИО-4·22, БИО-4·23","quiz":{"id":"S4-L24","question":"Рецептор встроен в плазматическую мембрану в правильной ориентации. Какое ещё условие нужно, чтобы он связывал лиганд?","options":[{"id":"S4-L24-1","text":"Метка M6P на гликане рецептора","correct":false,"feedback":"M6P — метка лизосомных гидролаз, а не рецепторов плазматической мембраны"},{"id":"S4-L24-2","text":"Возврат рецептора в ЭПР после доставки","correct":false,"feedback":"Рецептор работает на поверхности клетки"},{"id":"S4-L24-3","text":"Сформированный лиганд-связывающий участок","correct":true,"feedback":"Адрес и ориентация необходимы, но не достаточны"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются адрес, топология и рабочее место трёх грузов?","status":"Схема качественная","modes_label":"Груз","modes":["секретируемый белок","рецептор","гидролаза"],"args":[["A"],["B"],["C"]],"notes":["Адрес — среда; работает снаружи","Адрес — плазматическая мембрана; домен снаружи, хвост в цитозоле","Адрес — лизосома; работает в кислой среде"],"static":["Три груза различаются адресом, положением относительно мембраны и местом работы"],"scene":"s4_t4c","L":{"s4_t4c_sec":"секретируемый белок: работает в среде","s4_t4c_rec":"рецептор: домен снаружи, хвост в цитозоле","s4_t4c_lig":"лиганд","s4_t4c_hyd":"гидролаза: работает в лизосоме","s4_t4c_acid":"кислая среда","s4_t4c_addr":"адрес","s4_t4c_topo":"положение относительно мембраны","s4_t4c_site":"где работает","lbl_cytosol":"цитозоль","lbl_out":"снаружи клетки","s4_pan_A":"А","s4_pan_B":"Б","s4_pan_V":"В","s4_t4a_lysoC":"лизосома","t4_v_final_lysosome":"лизосома","t4_v_final_medium":"внеклеточная среда","t4_v_final_plasma_membrane":"плазматическая мембрана","t4_v_site_N_domain_outside":"на поверхности клетки","t4_v_site_lysosome_lumen":"в кислой лизосоме","t4_v_site_medium":"вне клетки","t4_v_topo_N_out_C_cytosol":"N-домен снаружи, хвост в цитозоле","t4_v_topo_lumen":"растворена в просвете","t4_v_topo_lumen_to_outside":"растворён: в просвете носителя, затем снаружи клетки"}}}},{"id":"orientation-independent","num":25,"section":3,"questions":[4],"title":"Белок на поверхности, а ответа нет: что проверить?","keywords":[],"lead":["Сверх программы. В модели три условия работы рецептора меняются независимо: адрес (плазматическая мембрана, задержка в ЭПР, лизосома), созревание (лиганд-связывающий участок сформирован или нет) и ориентация (N-концевой домен в просвете или — при отдельной ошибке встраивания — в цитозоле)."],"mechanism":["Ответ на лиганд есть только при всех трёх «да». Неверный адрес: рецептора на поверхности нет. Верный адрес и ориентация, но участок не сформирован: рецептор на поверхности, N-концевой домен снаружи, лиганд не связывается. Ошибка встраивания: рецептор на поверхности, снаружи оказывается C-концевой участок, N-концевой домен — в цитозоле, лиганд не связывается. Если рецептор в порядке, но нарушено звено передачи сигнала внутри клетки (за пределами модели), лиганд связывается, а ответа нет."],"paragraphs":["Обратная задача. Рецептор обнаружен на поверхности, ответа нет. Автоматически считать причиной обратную ориентацию нельзя. Нужны два наблюдения: доступен ли N-концевой домен снаружи клетки и связывается ли меченый лиганд. Обратная ориентация: домен недоступен, лиганд не связывается. Несформированный участок: домен доступен, лиганд не связывается. Звено за пределами модели: домен доступен, лиганд связывается. Если разрешено только одно из двух наблюдений, правильный ответ — «данных недостаточно».","<b>Ограничения.<\/b> В клетке белок с ошибкой встраивания часто задерживается контролем качества; модель рассматривает случай, когда он дошёл до поверхности."],"conditions":"Учебная модель: три независимых переключателя; показания качественные.","sources":["src_01"],"base":"БИО-4·23, БИО-4·24","level":"adv","next_base":"integration","quiz":{"id":"S4-L25","question":"Рецептор на поверхности; его N-концевой домен доступен снаружи, но меченый лиганд не связывается. С какой причиной совместимы эти данные?","options":[{"id":"S4-L25-1","text":"Не сформирован участок связывания","correct":true,"feedback":"Адрес и ориентация в порядке"},{"id":"S4-L25-2","text":"Обратная ориентация рецептора в мембране","correct":false,"feedback":"При обратной ориентации N-концевой домен не был бы доступен снаружи"},{"id":"S4-L25-3","text":"Рецептор задержан в ЭПР клетки","correct":false,"feedback":"Тогда его не было бы на поверхности"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие три условия нужны для ответа рецептора?","status":"Учебная модель: три независимых условия","modes_label":"Условие","modes":["норма","задержан в ЭПР","участок не сформирован","обратная ориентация","звено вне модели"],"args":[["plasma_membrane",1,"N_lumen",1],["er_retained",1,"N_lumen",1],["plasma_membrane",0,"N_lumen",1],["plasma_membrane",1,"N_cytosol",1],["plasma_membrane",1,"N_lumen",0]],"notes":["Все три условия выполнены — ответ есть","На поверхности рецептора нет","Рецептор на поверхности, домен снаружи, но лиганд не связывается","Рецептор на поверхности, но снаружи его C-хвост; лиганд не связывается","Лиганд связывается, ответа нет: нарушение за пределами модели"],"static":["Ответ рецептора требует правильного адреса, правильной ориентации и сформированного участка связывания"],"scene":"s4_a4","L":{"s4_a4_surf":"на поверхности","s4_a4_nout":"N-домен снаружи","s4_a4_lig":"связывает лиганд","s4_a4_resp":"ответ клетки","s4_a4_inv":"обратная ориентация (ошибка встраивания)","s4_a4_site":"участок связывания не сформирован","s4_a4_beyond":"звено за пределами модели","lbl_cytosol":"цитозоль","lbl_lumen":"просвет ЭПР","lbl_out":"снаружи клетки","s4_a4g_absent":"рецептора нет","s4_a4g_cout":"C-хвост снаружи","s4_a4g_ctail":"C-хвост","s4_a4g_h_car":"носитель","s4_a4g_h_er":"ЭПР","s4_a4g_h_pm":"поверхность клетки","s4_a4g_hyd":"Гидролаза → лизосома","s4_a4g_lig":"лиганд","s4_a4g_lum_car":"просвет носителя","s4_a4g_ndom":"N-домен","s4_a4g_norm":"в норме","s4_a4g_retained":"задержан в ЭПР","s4_a4g_sec":"Секретируемый белок → внеклеточная среда","s4_a4g_title":"Рецептор плазматической мембраны: путь и показания","s4_pan_A":"А","s4_pan_B":"Б","s4_v_no":"нет","s4_v_yes":"да"}}},"adv_kind":"Исследование модели"},{"id":"tgn-data","num":26,"section":3,"questions":[4],"title":"Как в транс-сети отбираются растворимые белки, у которых нет рецептора?","keywords":["Cab45","Гранины"],"lead":["Сверх программы. Новые данные о том, как в транс-сети упаковываются растворимые секретируемые белки."],"mechanism":["Для секретируемых белков не найдено общего участка последовательности, по которому их отбирал бы рецептор, как гидролазы отбирает рецептор M6P. Для части таких белков найден другой механизм: насос мембраны транс-сети кратковременно закачивает Ca²⁺ в её просвет; Ca²⁺-связывающий белок [[T45|Cab45]] объединяется в олигомеры, захватывает определённые секретируемые белки (среди них белки внеклеточного матрикса), и они упаковываются в пузырьки, мембрана которых обогащена липидом сфингомиелином. Образование гранул регулируемой секреции объясняют слипанием белков семейства [[T55|гранинов]] в кислой среде с высокой концентрацией Ca²⁺; это распространённая модель, и как скопления отделяются от мембраны, пока не ясно. Участки тесного контакта ЭПР с транс-сетью поставляют липиды и, предположительно, Ca²⁺."],"paragraphs":["<b>Что уточняет эта работа?<\/b> Представление о конститутивной секреции «по умолчанию» дополняется: часть растворимых белков отбирается в транс-сети активно, но без классического рецептора, с участием Ca²⁺ и липидного состава мембраны. Многое не установлено: источник Ca²⁺, способ присоединения скоплений к мембране, общность механизма для разных белков.","<b>Ограничения.<\/b> Это обзор новых работ; предположения авторов обзора отмечены в тексте как предположения."],"conditions":"Схема по данным обзора: качественная; концентрации Ca²⁺ не показаны.","sources":["src_05"],"base":"БИО-4·22","level":"adv","next_base":"integration","quiz":{"id":"S4-L26","question":"Какой вывод следует из новых данных о сортировке растворимых секретируемых белков в транс-сети?","options":[{"id":"S4-L26-1","text":"Все секретируемые белки несут метку M6P","correct":false,"feedback":"M6P — метка лизосомных гидролаз"},{"id":"S4-L26-2","text":"Часть из них отбирается с участием Ca²⁺ и Cab45","correct":true,"feedback":"«Путь по умолчанию» описывает не все растворимые белки"},{"id":"S4-L26-3","text":"Сортировка не зависит от липидов мембраны","correct":false,"feedback":"Для части грузов нужен участок мембраны, богатый сфингомиелином"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как отбираются растворимые белки без рецептора?","status":"Схема по данным обзора: качественная","modes_label":"Механизм","modes":["Ca²⁺ и Cab45","гранины и гранулы"],"args":[["cab45"],["granin"]],"notes":["Ca²⁺ собирает Cab45 с секретируемыми белками у участка мембраны, богатого сфингомиелином","По распространённой модели гранины слипаются в кислой среде с Ca²⁺ и образуют содержимое гранулы"],"static":["Часть растворимых секретируемых белков отбирается в транс-сети без рецептора — с участием Ca²⁺ и белка Cab45"],"scene":"s4_r_tgndata","L":{"s4_r_tgndata_pump":"насос Ca²⁺","s4_r_tgndata_cab45":"Cab45","s4_r_tgndata_cargo":"секретируемый белок","s4_r_tgndata_sm":"мембрана, богатая сфингомиелином","s4_r_tgndata_contact":"контакт ЭПР и транс-сети","s4_r_tgndata_hyp":"предположение","s4_r_tgndata_gran":"гранины","s4_r_tgndata_acid":"кислая среда, Ca²⁺","s4_r_tgndata_model":"модель","s4_r_ribopool_cyt":"цитозоль","s4_r_tgndata_ca":"Ca²⁺","s4_r_tgndata_igran":"незрелая гранула","s4_r_tgndata_lip":"липиды","s4_r_tgndata_lum":"просвет транс-сети","s4_r_tgndata_ves":"формирующийся пузырёк"}}},"adv_kind":"Новые данные"},{"id":"measure-choice","num":28,"section":4,"questions":[1,2,3,4],"title":"Сколько измерений нужно и когда ответ — «данных недостаточно»?","keywords":[],"lead":["Сверх программы. Для трёх случаев итоговой задачи модель находит наименьший набор измерений, который различает все совместимые причины."],"mechanism":["Случай 1: гидролаза в среде; совместимы «метка не ставится» и «рецептор не работает» — достаточно одного измерения: есть ли M6P на гидролазе из среды. Случай 2: секретируемого белка нет в среде; совместимы «не вошёл в ЭПР» и «не свернулся и задержан» — достаточно одного измерения: находится ли белок в ЭПР (или: задержан ли он в ЭПР). Случай 3: рецептор на поверхности, ответа нет; совместимы обратная ориентация, несформированный лиганд-связывающий участок и нарушение за пределами модели — нужны два измерения: доступность N-концевого домена снаружи и связывание меченого лиганда."],"paragraphs":["Если разрешено меньше измерений, чем нужно, честный ответ — «данных недостаточно». Даже набор из двух измерений в случае 3 различает причины только в рамках модели: связывание лиганда при отсутствии ответа указывает на звенья, которых в модели нет.","<b>Ограничения.<\/b> Модель не учитывает ошибки измерений и одновременные нарушения нескольких этапов."],"conditions":"Учебная модель: таблица «причина → ожидаемые показания»; минимальные наборы рассчитаны перебором.","sources":["src_01"],"base":"БИО-4·27","level":"adv","quiz":{"id":"S4-L28","question":"Рецептор на поверхности, ответа нет. Разрешено одно измерение — связывание меченого лиганда; связывания нет. Какой вывод корректен?","options":[{"id":"S4-L28-1","text":"Данных недостаточно для выбора причины","correct":true,"feedback":"Различает их доступность N-концевого домена снаружи"},{"id":"S4-L28-2","text":"Рецептор встроен в обратной ориентации","correct":false,"feedback":"Это лишь одна из двух совместимых причин"},{"id":"S4-L28-3","text":"Рецептор не дошёл до поверхности клетки","correct":false,"feedback":"По условию рецептор на поверхности"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько измерений различает причины?","status":"Учебная модель: минимальные наборы рассчитаны перебором","modes_label":"Случай","modes":["случай 1","случай 2","случай 3"],"args":[["I_hydrolase_in_medium"],["II_secreted_absent"],["III_surface_no_response"]],"notes":["Одно измерение: есть ли M6P на гидролазе из среды","Одно измерение: находится ли белок в ЭПР","Два измерения: доступен ли N-домен снаружи и связывается ли лиганд"],"static":["Случаи 1 и 2 различаются одним измерением, случай 3 — только двумя; при меньшем числе измерений ответ — «данных недостаточно»"],"scene":"s4_r_measures","L":{"s4_r_measures_cause":"причина","s4_r_measures_obs":"наблюдение","s4_r_measures_min":"наименьший различающий набор","s4_r_measures_na":"не применимо","s4_r_measures_insuf":"если измерений меньше — данных недостаточно","fin_obs1":"Белок в ЭПР (сигнал отщеплён, есть N-гликан)","fin_obs2":"Белок задержан в ЭПР с шаперонами","fin_obs3":"M6P на белке","fin_obs4":"Белок в среде","fin_obs5":"Белок в лизосомах","fin_obs6":"Белок на поверхности","fin_obs7":"N-концевой домен доступен снаружи","fin_obs8":"Связывается меченый лиганд","s4_r_measures_alt":"каждое из двух по отдельности достаточно","s4_r_measures_c_inverted":"обратная ориентация","s4_r_measures_c_misfold_retained":"не свернулся, задержан","s4_r_measures_c_no_entry":"не вошёл в ЭПР","s4_r_measures_c_no_m6p":"метка не ставится","s4_r_measures_c_no_m6p_receptor":"рецептор не работает","s4_r_measures_c_outside_model":"нарушение за пределами модели","s4_r_measures_c_site_defect":"участок связывания не сформирован","s4_r_measures_k":"число измерений: {k}","s4_r_measures_known":"известно по условию","s4_v_dash":"—","s4_v_no":"нет","s4_v_yes":"да"}}},"next_base":"integration","adv_kind":"Исследование модели"},{"id":"integration","num":27,"section":4,"questions":[1,2,3,4],"title":"Почему одно наблюдение часто не указывает место нарушения?","keywords":["Сигнальная последовательность ЭПР (сигнальный пептид)","Контроль качества белков в ЭПР"],"lead":["Путь белка — цепь этапов: вход в ЭПР ([[T03|сигнальная последовательность]], SRP, рецептор SRP, транслокон) → сворачивание и [[T39|контроль качества]] → выход из ЭПР → модификации в аппарате Гольджи (у гидролаз — метка M6P) → распределение в транс-сети → адрес и ориентация в мембране."],"mechanism":["Наблюдение в конце пути («белка нет в среде», «функции нет») совместимо с нарушениями на многих этапах. Наблюдение рядом с этапом сужает выбор: отщеплена ли сигнальная последовательность и есть ли N-гликан — признаки входа в ЭПР; задержка белка в ЭПР вместе с шаперонами — признак незавершённого сворачивания; M6P на гидролазе — признак постановки метки; доступность N-концевого домена снаружи — признак правильной ориентации. Поэтому сначала спрашивают, какие варианты совместимы с имеющимися данными, а затем — какое измерение их различит."],"paragraphs":["Отсутствие секреции, отсутствие функции и неверный адрес — разные наблюдения. Если имеющиеся данные совместимы с несколькими причинами, правильный ответ — «данных недостаточно», а не выбор одной причины.","<b>На практикуме.<\/b> Итоговая задача «Белок есть, но работает не там»."],"conditions":"Схема качественная: карта пути с этапами; около каждого этапа — наблюдение, которое к нему ближе всего.","sources":["src_01"],"base":"БИО-4·4, БИО-4·11, БИО-4·18, БИО-4·23","quiz":{"id":"S4-L27","question":"Секретируемого белка нет в среде. Какое наблюдение ближе всего к месту возможного нарушения?","options":[{"id":"S4-L27-1","text":"Сколько белка в среде через сутки","correct":false,"feedback":"Это то же конечное наблюдение; оно не указывает этап"},{"id":"S4-L27-2","text":"Есть ли на белке метка M6P","correct":false,"feedback":"M6P относится к лизосомным гидролазам; для секретируемого белка это наблюдение не различает этапы"},{"id":"S4-L27-3","text":"Находится ли белок в ЭПР","correct":true,"feedback":"Оно отделяет нарушение входа от нарушений после входа"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какое наблюдение ближе к какому этапу?","status":"Схема качественная: этапы — учебная модель","modes_label":"Показать","modes":["карта этапов","конечные наблюдения"],"args":[["map"],["end"]],"notes":["У каждого этапа своё ближайшее наблюдение","Конечное наблюдение совместимо со многими этапами"],"static":["Наблюдение у конца пути не указывает этап; наблюдения у этапов сужают выбор"],"scene":"s4_int","L":{"s4_int_st1":"вход в ЭПР","s4_int_st2":"сворачивание и проверка","s4_int_st3":"выход из ЭПР","s4_int_st4":"аппарат Гольджи: метка M6P","s4_int_st5":"транс-сеть: направление","s4_int_st6":"адрес и ориентация","s4_int_near":"ближайшее наблюдение","s4_int_end":"конечное наблюдение","s4_int_e1":"нет в среде","s4_int_e2":"нет функции","s4_int_o1":"сигнал отщеплён, N-гликан","s4_int_o2":"задержан с шаперонами","s4_int_o3":"—","s4_int_o4":"M6P на гидролазе","s4_int_o5":"где найден груз","s4_int_o6":"N-домен снаружи"}}}},{"id":"links","num":29,"section":4,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":[],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},{"ul":["[[seminar-1-route.html|Семинар 1]] — «Мембрана: граница и градиенты»: [[seminar-1-route.html#bio-1-1|«Что удерживает липидный бислой как целое?»]]","[[seminar-2-route.html|Семинар 2]] — движение носителей по микротрубочкам","[[seminar-3-route.html|Семинар 3]] — оболочки носителей, рецептор груза, эндосомы и слияние мембран: [[seminar-3-route.html#coated-pit|«Как клатриновая ямка собирается вокруг рецептора с грузом»]]"]},{"h":"Что дальше в курсе"},{"ul":["[[seminar-5-route.html|Семинар 5]] — убиквитин, протеасома и лизосома: как разрушаются удалённые из ЭПР белки и что делают гидролазы в лизосоме","[[seminar-10-route.html|Семинар 10]] — как рибосома синтезирует белок: кодоны, тРНК и сайты рибосомы"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Ответ клетки на перегрузку ЭПР — [[https://edu.mazunin.science/seminar-10-route.html#upr|«Молекулярная биология», семинар 10: UPR]], [[https://edu.mazunin.science/seminar-10-route.html#upr-capacity|ёмкость ЭПР]]","N-гликан как метка состояния белка и удаление дефектных белков ЭПР — [[https://edu.mazunin.science/seminar-11-route.html#glycan-code|«Молекулярная биология», семинар 11: гликановый код]], [[https://edu.mazunin.science/seminar-11-route.html#erad-machine|ERAD]]","Пути из ЭПР и восстановление лизосом — [[https://edu.mazunin.science/seminar-12-route.html#route-er|«Молекулярная биология», семинар 12: пути из ЭПР]], [[https://edu.mazunin.science/seminar-12-route.html#lyso-biogenesis|биогенез лизосом]]"]}],"conditions":"","sources":[],"quiz":{"id":"S4-L29","question":"Где в курсе разбирается, как разрушаются белки, удалённые из ЭПР?","options":[{"id":"S4-L29-1","text":"В теме об оболочках носителей и эндосомах","correct":false,"feedback":"[[seminar-3-route.html|Семинар 3]] — оболочки носителей, рецептор груза, эндосомы."},{"id":"S4-L29-2","text":"В теме об убиквитине, протеасоме и лизосоме","correct":true,"feedback":"[[seminar-5-route.html|Семинар 5]] — убиквитин, протеасома и лизосома."},{"id":"S4-L29-3","text":"В теме о синтезе белка на рибосоме","correct":false,"feedback":"[[seminar-10-route.html|Семинар 10]] — как рибосома синтезирует белок."}]},"service":true}],"sections":[{"title":"Начальный адрес: сигнальная последовательность, SRP и транслокон","entry":"one-ribosome","sub":"Начальный адрес: сигнальная последовательность, SRP и транслокон Sec61","label":"Тема 1","integr":false},{"title":"Созревание и контроль качества в ЭПР","entry":"er-folding","sub":"Созревание и контроль качества в ЭПР","label":"Тема 2","integr":false},{"title":"Метка маннозо-6-фосфат и доставка лизосомной гидролазы","entry":"golgi-passage","sub":"Метка маннозо-6-фосфат и доставка лизосомной гидролазы","label":"Тема 3","integr":false},{"title":"Транс-сеть аппарата Гольджи: три направления груза","entry":"tgn-routes","sub":"Транс-сеть аппарата Гольджи: три направления груза","label":"Тема 4","integr":false},{"title":"Итог: белок есть, но работает не там","entry":"integration","sub":"Белок есть, но работает не там: на каком этапе прервался путь?","label":"Итог","integr":true}],"glossary":[{"id":"S4-T01","term":"Рибосома","section":0,"def":"Частица из рибосомных РНК и белков, на которой синтезируется белок; рибосомы, синтезирующие белки секреторного пути, на время синтеза прикреплены к мембране грЭПР."},{"id":"S4-T02","term":"Гранулярный эндоплазматический ретикулум (грЭПР)","section":0,"def":"Область эндоплазматического ретикулума, мембрана которой покрыта рибосомами со стороны цитозоля; здесь синтезируются и переносятся в ЭПР секретируемые, мембранные и лизосомные белки; мембрана ЭПР непрерывна с наружной ядерной мембраной."},{"id":"S4-T03","term":"Сигнальная последовательность ЭПР (сигнальный пептид)","section":0,"def":"Участок аминокислотной цепи, обычно на N-конце, с центральной частью из восьми и более неполярных аминокислот; направляет растущую цепь в ЭПР; после переноса обычно отщепляется."},{"id":"S4-T04","term":"Полирибосома (полисома)","section":0,"def":"мРНК вместе с несколькими рибосомами, которые одновременно её транслируют."},{"id":"S4-T05","term":"Сигнальная пептидаза","section":0,"def":"Фермент мембраны ЭПР, активный центр которого обращён в просвет; отщепляет сигнальную последовательность от переносимой цепи."},{"id":"S4-T06","term":"Частица распознавания сигнала (SRP)","section":0,"def":"Рибонуклеопротеин цитозоля из шести белков и одной РНК; связывает сигнальную последовательность ЭПР у выхода из рибосомы, замедляет синтез и доставляет рибосому к рецептору SRP."},{"id":"S4-T07","term":"Рецептор SRP","section":0,"def":"Белковый комплекс мембраны грЭПР (у животных — из двух цепей), который связывает SRP с рибосомой и передаёт рибосому транслокону; синонимы — SRP-рецептор, белок стыковки."},{"id":"S4-T08","term":"Транслокон Sec61","section":0,"def":"Белковый комплекс мембраны ЭПР из трёх субъединиц с водным каналом, через который цепь проходит в просвет; имеет пробку, закрывающую канал, и латеральные ворота для выхода гидрофобных участков в бислой; синоним — белок-транслокатор."},{"id":"S4-T09","term":"Котрансляционный перенос (котрансляционная транслокация)","section":0,"def":"Перенос полипептидной цепи через мембрану ЭПР одновременно с её синтезом на рибосоме, связанной с транслоконом."},{"id":"S4-T10","term":"Просвет ЭПР","section":0,"def":"Внутреннее пространство ЭПР, единое для всей сети и непрерывное с пространством между мембранами ядерной оболочки; по расположению относительно мембраны соответствует внеклеточной среде."},{"id":"S4-T11","term":"Трансмембранный сегмент","section":0,"def":"Гидрофобная α-спираль полипептидной цепи, пересекающая липидный бислой."},{"id":"S4-T12","term":"Топология мембранного белка","section":0,"def":"Расположение участков мембранного белка по разные стороны мембраны; задаётся при встраивании в мембрану ЭПР и сохраняется при почковании и слиянии мембран."},{"id":"S4-T13","term":"Комплекс NAC","section":0,"def":"Белковый комплекс, связанный с рибосомой у выхода из туннеля; не допускает SRP к цепям без сигнала ЭПР и облегчает её доступ к цепям с сигналом."},{"id":"S4-T14","term":"Белок с C-концевым якорем","section":0,"def":"Мембранный белок, закреплённый в мембране единственным гидрофобным сегментом у самого C-конца; многие такие белки встраиваются в мембрану ЭПР после окончания синтеза без участия SRP."},{"id":"S4-T15","term":"Шапероны","section":1,"def":"Белки, которые связывают несвёрнутые или неправильно свёрнутые участки других белков, предотвращают их слипание и помогают им свернуться."},{"id":"S4-T16","term":"N-гликозилирование","section":1,"def":"Присоединение заранее собранного олигосахарида к аспарагину в последовательности Asn–X–Ser/Thr в просвете ЭПР; образующаяся углеводная цепь — N-гликан."},{"id":"S4-T17","term":"BiP","section":1,"def":"Шаперон семейства Hsp70 в просвете ЭПР; связывает открытые гидрофобные участки цепей, используя энергию гидролиза АТФ."},{"id":"S4-T18","term":"Протеиндисульфидизомераза (PDI)","section":1,"def":"Фермент просвета ЭПР, образующий, разрывающий и перестраивающий дисульфидные связи между остатками цистеина."},{"id":"S4-T19","term":"Калнексин и кальретикулин","section":1,"def":"Шапероны ЭПР, связывающие гликопротеины с одной оставшейся глюкозой на N-гликане (лектины); калнексин — мембранный белок, кальретикулин — растворимый."},{"id":"S4-T20","term":"COP-II","section":1,"def":"Оболочка (COP — белки оболочки) транспортных носителей, переносящих белки из грЭПР в цис-сеть аппарата Гольджи."},{"id":"S4-T21","term":"Участок выхода из ЭПР","section":1,"def":"Свободный от рибосом участок мембраны ЭПР, где собирается оболочка COP-II и отпочковываются носители к аппарату Гольджи."},{"id":"S4-T22","term":"KDEL-рецептор","section":1,"def":"Мембранный белок аппарата Гольджи и промежуточных мембран, который связывает растворимые белки ЭПР с сигналом KDEL на C-конце и возвращает их в ЭПР в носителях с COP-I."},{"id":"S4-T23","term":"Протеасома","section":1,"def":"Белковый комплекс цитозоля и ядра, расщепляющий белки, помеченные цепочкой убиквитина."},{"id":"S4-T24","term":"ERAD (деградация, связанная с ЭПР)","section":1,"def":"Перенос несвернувшихся белков из ЭПР в цитозоль, их убиквитинирование и расщепление протеасомой."},{"id":"S4-T25","term":"Убиквитин","section":1,"def":"Небольшой белок, который присоединяется к другим белкам как метка; цепочка убиквитина направляет белок в протеасому."},{"id":"S4-T26","term":"Аппарат Гольджи","section":2,"def":"Мембранная органелла из стопок уплощённых цистерн с цис- и транс-стороной; модифицирует, сортирует и упаковывает в носители белки и липиды, поступающие из ЭПР."},{"id":"S4-T27","term":"Цис-сеть аппарата Гольджи","section":2,"def":"Сеть мембран на стороне аппарата Гольджи, обращённой к ЭПР; принимает груз из ЭПР; здесь начинается постановка метки M6P на лизосомные гидролазы."},{"id":"S4-T28","term":"Транс-сеть аппарата Гольджи","section":2,"def":"Сеть трубочек и цистерн на выходной стороне аппарата Гольджи, где груз распределяется по носителям к эндосомам, в секреторные гранулы и к плазматической мембране."},{"id":"S4-T29","term":"Лизосомная гидролаза","section":2,"def":"Фермент, расщепляющий макромолекулы в кислой среде лизосомы; растворимые гидролазы синтезируются на грЭПР и доставляются по пути с меткой M6P."},{"id":"S4-T30","term":"Маннозо-6-фосфат (M6P)","section":2,"def":"Манноза N-гликана с фосф
