  const ell = (x, y, rx, ry, fill, o = {}) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"${o.st ? ` stroke="${o.st}" stroke-width="${o.sw || 1.4}"` : ''}${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
  const lead = (x1, y1, x2, y2, col = C.muted) => line(x1, y1, x2, y2, col, 1.1);
  const sideUp = (x, y, s, a = 'l') => G('lumen', T(x, y, s, { a, size: 12, w: 700, col: '#3E6A9A', it: true }));
  const sideDn = (x, y, s, a = 'l') => G('cyto', T(x, y, s, { a, size: 12, w: 700, col: '#8A7344', it: true }));
  const lab = (x, y, s, o = {}) => T(x, y, s, Object.assign({ size: 12, w: 600 }, o));
  /* субъединицы рибосомы отдельно (те же формы и размеры, что в S4F.ribosome при k = 1) */
  const subL = (x, y) => G('ribo', ell(x, y, 30, 19, C.riboL));
  const subS = (x, y) => G('ribo', ell(x, y, 23, 11, C.riboS));
  /* свёрнутый растворимый белок: светлая глобула с цепью того же цвета внутри */
  const folded = (x, y, col, g = 'cargo') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="15" fill="#fff" stroke="${col}" stroke-width="2"/>` + chain([[x - 9, y + 5], [x - 3, y - 7], [x + 3, y + 6], [x + 9, y - 5]], { col, w: 2.4, wave: 1.6 }));
  /* белок мембраны из двух половин в бислое (y — середина бислоя) */
  const tm2 = (x, y, col, o = {}) => {
    const h = MH + (o.ext || 8), y0 = y - h / 2;
    if (o.ghost) return rect(x - 11, y0, 22, h, 'none', { st: C.grey, dash: '4 3', rx: 4 });
    return rect(x - 11, y0, 10, h, col, { rx: 4 }) + rect(x + 1, y0, 10, h, col, { rx: 4 });
  };

  /* ---------- ·1 one-ribosome: общий пул субъединиц; цитозольный белок; секретируемый белок; окончание синтеза ----------
     Критерий 10: в режимах 1 и 2 рибосомы — одна фигура одного размера (S4F.ribosome, k = 1); отличие — только сигнал и положение. */
  GN.s4_r_ribopool = { view(args, t) {
    const m = args[0], l = K('ribopool', t), X0 = 236, MY = 112, RX = [330, 430, 530];
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 }) + rect(X0, 0, 600 - X0, MY, C.lumen, { rx: 0 });
    s += sideUp(590, 16, l('lum'), 'r') + sideDn(12, 406, l('cyt'));
    /* общий пул: большие и малые субъединицы в цитозоле */
    s += rect(14, 150, 194, 124, '#fff', { st: C.line, dash: '5 4', op: '.9', rx: 12 });
    s += subL(64, 186) + subL(158, 186) + subS(64, 238) + subS(158, 238) + subS(111, 212);
    s += lab(111, 292, l('pool'), { n: 20, size: 12 });
    const attached = m !== 'cyt';
    const gaps = attached ? RX.map(x => [x - 20, x + 20]) : [];
    s += memH(X0, 600, MY, gaps);
    s += lab(X0 - 8, MY, l('er'), { a: 'r' });
    if (!attached) {
      /* режим 1: полирибосома в цитозоле; цепи без сигнала остаются в цитозоле */
      const cy = 292, my = cy + 22;
      s += mrna(262, 586, my);
      [26, 52, 80].forEach((len, i) => { const x = RX[i], R = ribosome(x, cy, 1);
        s += chain([[x, R.y + 2], [x + 6, R.y - len * .5], [x - 4, R.y - len]]) + R.s; });
      s += lab(424, my + 22, l('mrna_c'));
      s += arrow(210, 236, 296, 272, C.muted, 2);
      return s;
    }
    /* режимы 2 и 3: те же рибосомы прикреплены к мембране; цепи уходят в просвет через транслокон */
    const cy = MY + 46, my = cy + 22, done = m === 'end';
    s += mrna(262, 586, my);
    const lens = [16, 38, 62];
    RX.forEach((x, i) => {
      if (done && i === 2) { s += sec61(x, MY, { plug: true }); return; }
      const R = ribosome(x, cy, 1), top = MY - 10, len = lens[i];
      const pts = [[x, R.y + 2], [x, top], [x + 8, top - len]];
      const L = (R.y + 2 - top) + Math.hypot(8, len);
      s += chain(pts, { sig: 12 / L }) + sec61(x, MY, { open: true }) + R.s;
    });
    s += lab(424, my + 20, l('mrna_s'));
    if (!done) {
      /* подпись сигнала — у N-конца цепи третьей рибосомы */
      s += lab(246, 34, l('sig'), { a: 'l' }) + lead(300, 42, 335, 76);
      s += arrow(210, 196, 294, 162, C.muted, 2);
      return s;
    }
    /* режим 3: рибосома закончила синтез — субъединицы отделились от мембраны и возвращаются в пул; мРНК остаётся у мембраны */
    s += folded(532, MY - 48, C.chain);
    s += subL(534, 248) + subS(534, 282);
    s += carrow(500, 268, 212, 246, -.22, C.muted, 2.2);
    s += lab(356, 330, l('back'));
    return s;
  } };

  /* ---------- ·2 er-signal: цепь кружками (N → C); гидрофобный центр закрашен, заряженные — со знаком «+» ----------
     режимы: секретируемый белок; сигнал удалён; сигнал присоединён к цитозольному белку (цепь другого цвета, сигнал — того же цвета). */
  GN.s4_r_signal = { view(args, t) {
    const m = args[0], l = K('signal', t), Y = 124, R = 8.2, D = 19, X = i => 84 + i * D;
    const nPlus = 2, nHyd = 9, nSig = nPlus + nHyd, nMat = 7;
    const matCol = m === 'fus' ? C.fn : C.chain, ghost = m === 'del';
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 });
    /* сигнал */
    let sg = '';
    for (let i = 0; i < nSig; i++) {
      const x = X(i), hyd = i >= nPlus;
      if (ghost) { sg += `<circle cx="${f(x)}" cy="${Y}" r="${R}" fill="none" stroke="${C.grey}" stroke-width="1.4" stroke-dasharray="3 2.5"/>`; continue; }
      sg += `<circle cx="${f(x)}" cy="${Y}" r="${R}" fill="${hyd ? C.sig : '#fff'}" stroke="${C.sig}" stroke-width="2"/>`;
      if (!hyd) sg += `<text x="${f(x)}" y="${Y + .5}" font-size="13" font-weight="800" fill="${C.sig}" style="text-anchor:middle;dominant-baseline:central;fill:${C.sig}">+</text>`;
    }
    s += line(X(0), Y, X(nSig + nMat - 1), Y, ghost ? C.line : '#9AA6B6', 2) ;
    s += G('sig', sg);
    /* зрелая часть белка */
    let mt = '';
    for (let i = nSig; i < nSig + nMat; i++) mt += `<circle cx="${f(X(i))}" cy="${Y}" r="${R}" fill="#fff" stroke="${matCol}" stroke-width="2"/>`;
    const xe = X(nSig + nMat - 1) + R;
    mt += chain([[xe, Y], [520, Y]], { col: matCol, wave: 3 });
    s += G('chain', mt);
    s += lab(528, Y, l('c'), { a: 'l', size: 11.5 });
    const xm = (X(nSig) - R + 520) / 2;
    s += lab(xm, Y + 30, m === 'fus' ? l('cytp') : l('secp'), { col: matCol, w: 700 });
    if (ghost) {
      /* сигнал удалён: штриховой контур и зачёркивание */
      s += rect(X(0) - 14, Y - 16, X(nSig - 1) - X(0) + 28, 32, 'none', { st: C.bad, dash: '5 4', rx: 10 });
      s += line(X(0) - 10, Y + 12, X(nSig - 1) + 10, Y - 12, C.bad, 2, 'stroke-dasharray="6 4"');
      s += lab(X(nSig), Y - 26, l('n'), { size: 11.5 });
    } else {
      s += lab(X(0) - 14, Y, l('n'), { a: 'r', size: 11.5 });
      /* скобки: положительно заряженные (сверху) и гидрофобный центр (снизу) */
      const b1a = X(0) - R, b1b = X(nPlus - 1) + R, b2a = X(nPlus) - R, b2b = X(nSig - 1) + R;
      s += `<path d="M${f(b1a)},${Y - 14} L${f(b1a)},${Y - 20} L${f(b1b)},${Y - 20} L${f(b1b)},${Y - 14}" fill="none" stroke="${C.sig}" stroke-width="1.4"/>`;
      s += lab(b1a - 10, Y - 34, l('plus'), { a: 'l', size: 11.5, col: C.sig });
      s += `<path d="M${f(b2a)},${Y + 14} L${f(b2a)},${Y + 20} L${f(b2b)},${Y + 20} L${f(b2b)},${Y + 14}" fill="none" stroke="${C.sig}" stroke-width="1.4"/>`;
      s += lab((b2a + b2b) / 2, Y + 36, l('hyd'), { size: 11.5, col: C.sig, n: 34 });
    }
    /* ячейка «место белка»: участок мембраны ЭПР, просвет сверху, цитозоль снизу */
    const bx = 330, bw = 250, by = 222, bh = 176, my = by + 84;
    s += lab(bx - 10, by + 14, l('place'), { a: 'r', w: 700 });
    s += rect(bx, by, bw, my - by, C.lumen, { rx: 0 }) + rect(bx, my, bw, by + bh - my, C.cyto, { rx: 0 });
    s += memH(bx, bx + bw, my) + rect(bx, by, bw, bh, 'none', { st: C.line, rx: 0 });
    s += sideUp(bx + 8, by + 16, l('p_er')) + sideDn(bx + 8, by + bh - 14, l('p_cyt'));
    const inEr = m !== 'del', gx = 520, gy = inEr ? by + 46 : my + 46;
    s += folded(gx, gy, matCol);
    s += arrow(gx, Y + 18, gx, by - 6, C.muted, 2);
    /* вывод режима */
    if (m === 'del') s += tag(160, 300, l('need'), C.bad, { size: 12 });
    if (m === 'fus') s += tag(160, 300, l('suff'), C.ok, { size: 12 });
    return s;
  } };

  /* ---------- ·7 nac-gatekeeper: выход туннеля рибосомы; NAC (центральная часть, якорь, гибкий участок), SRP, цепь ----------
     по данным работы (src_02): центральная часть NAC у выхода туннеля не допускает SRP к цепи; гибкий участок держит SRP рядом;
     выходящий сигнал ЭПР ослабляет связь центральной части NAC с рибосомой; SRP связывает сигнал, NAC остаётся на рибосоме.
     Критерий 10: в режиме 1 SRP не касается цепи. */
  GN.s4_r_nac = { view(args, t) {
    const m = args[0], l = K('nac', t), EX = 300, EY = 190, NAC = '#0E7C86', NACL = '#BFE3E6';
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 });
    /* рибосома: большая субъединица с туннелем, малая под ней */
    s += G('ribo', ell(300, 372, 132, 36, C.riboS) + ell(300, 282, 170, 92, C.riboL));
    s += line(EX, 318, EX, EY + 2, '#2B3647', 15);
    s += sideDn(12, 406, t('s4_r_ribopool_cyt'));
    /* выход туннеля */
    s += lab(206, 262, l('exit'), { col: '#fff', size: 12 }) + line(246, 250, EX - 10, EY + 8, '#fff', 1.1);
    /* цепь */
    if (m === 'nosig') s += chain([[EX, 316], [EX, EY + 2], [272, 184], [246, 160], [236, 122]], { wave: 0, w: 3.4 });
    const sigPts = m === 'sig' ? [[EX, 316], [EX, EY + 2], [298, 160], [290, 116]] : [[EX, 316], [EX, EY + 2], [302, 162], [306, 132]];
    if (m !== 'nosig') { let L = 0; for (let i = 1; i < sigPts.length; i++) L += Math.hypot(sigPts[i][0] - sigPts[i - 1][0], sigPts[i][1] - sigPts[i - 1][1]); s += chain(sigPts, { wave: 0, w: 3.4, sig: 30 / L }); }
    /* NAC: центральная часть — у выхода (1) / отошла (2, 3: штриховой контур); якорь — на поверхности рибосомы справа */
    const core = m === 'nosig' ? [EX, 170] : m === 'sig' ? [352, 160] : [384, 158];
    const knob = [404, 206];
    s += G('chap', line(core[0] + 20, core[1] + 10, knob[0], knob[1], NAC, 4) + `<circle cx="${knob[0]}" cy="${knob[1]}" r="6" fill="${NAC}"/>`);
    /* SRP: рядом, на гибком участке NAC (1, 2) / у выхода туннеля, связана с сигналом (3) */
    const sp = m === 'srp' ? [306, 120] : [478, 112], k = 1.45;
    const uba = m === 'srp' ? [338, 112] : [452, 122];
    const tailPts = []; const ca = [core[0] + 10, core[1] - 16];
    for (let i = 0; i <= 20; i++) { const u = i / 20, x = ca[0] + (uba[0] - ca[0]) * u, y = ca[1] + (uba[1] - ca[1]) * u - Math.sin(u * Math.PI) * 26; const off = Math.sin(u * Math.PI * 4) * 3; tailPts.push(f(x) + ',' + f(y + off)); }
    s += G('chap', `<path d="M${tailPts.join(' L')}" fill="none" stroke="${NAC}" stroke-width="2.6" stroke-linecap="round"/>` + `<circle cx="${uba[0]}" cy="${uba[1]}" r="5.5" fill="${NAC}"/>`);
    s += srp(sp[0], sp[1], k);
    s += G('chap', m === 'nosig' ? ell(core[0], core[1], 34, 20, NAC) : ell(core[0], core[1], 34, 20, NACL, { st: NAC, sw: 2, dash: '5 3' }));
    s += lab(core[0], core[1], l('nac'), { col: m === 'nosig' ? '#fff' : NAC, w: 800, size: 13 });
    /* подписи */
    s += lab(446, 178, l('anchor'), { a: 'l', size: 11.5 }) + lead(444, 182, knob[0] + 6, knob[1] - 4);
    if (m === 'srp') {
      s += lab(sp[0] - 46, sp[1] - 2, l('srp'), { a: 'r', w: 700, col: C.srpr });
      s += lab(500, 64, l('tail'), { size: 11.5, n: 20 }) + lead(466, 88, 372, 102);
      s += lab(250, 150, l('sig'), { a: 'r', col: C.sig }) + lead(254, 150, 300, 140, C.sig);
    } else {
      s += lab(sp[0], sp[1] + 34, l('srp'), { w: 700, col: C.srpr });
      s += lab(470, 40, l('tail'), { size: 11.5, n: 22 }) + lead(446, 64, 420, 96);
      if (m === 'nosig') s += lab(236, 104, l('nosig'));
      else s += lab(250, 112, l('sig'), { a: 'r', col: C.sig }) + lead(254, 114, 286, 124, C.sig);
    }
    return s;
  } };

  /* ---------- ·8 other-routes: три пути в ЭПР (панели А, Б, В); активная панель — в полном цвете, остальные приглушены ---------- */
  GN.s4_r_routes = { view(args, t) {
    const m = args[0], l = K('routes', t), MY = 140;
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 }) + S4F.sides(MY, { top: 30 });
    s += memH(0, 600, MY, [[78, 122], [278, 350], [456, 484], [545, 559]]);
    s += line(200, 30, 200, 420, C.line, 1.4, 'stroke-dasharray="5 4"') + line(400, 30, 400, 420, C.line, 1.4, 'stroke-dasharray="5 4"');
    const head = (x0, L, key) => S4F.panel(x0 + 6, 16, L) + lab(x0 + 24, 16, l(key), { a: 'l', size: 11.5, w: 700 });
    const P = {};
    /* А: во время синтеза — SRP, рецептор SRP, Sec61; рибосома на транслоконе, цепь уходит в просвет */
    {
      let q = head(0, 'А', 'co');
      const R = ribosome(100, MY + 40, 1);
      q += mrna(60, 176, MY + 62);
      q += chain([[100, R.y + 2], [100, MY - 10], [108, MY - 52]], { sig: .16 }) + sec61(100, MY, { open: true }) + R.s;
      q += srpR(36, MY) + srp(36, MY + 44, .75);
      q += lab(36, MY + 66, l('srp'), { size: 11, w: 700, col: C.srpr });
      q += lab(36, MY - 46, l('srpr'), { size: 11, n: 9, col: C.srpr }) + lead(36, MY - 25, 36, MY - 11);
      q += lab(156, MY - 30, l('sec61'), { size: 11, col: C.sec61 }) + lead(144, MY - 24, 116, MY - 14);
      P.A = q;
    }
    /* Б: после синтеза — готовый белок с шаперонами цитозоля, Sec61 с комплексом Sec62–Sec63, BiP в просвете */
    {
      let q = head(200, 'Б', 'post');
      const cp = [[300, MY - 66], [300, MY - 8], [300, MY + 22], [286, MY + 56], [306, MY + 92], [282, MY + 126], [300, MY + 160], [278, MY + 196]];
      q += chain(cp.slice().reverse(), { sig: .1, wave: 2.6 });
      q += sec61(300, MY, { open: true }) + tm2(338, MY, '#5E7FA8');
      q += bip(300, MY - 26, .9) + bip(300, MY - 54, .9);
      q += lab(344, MY - 44, l('bip'), { a: 'l', size: 11.5, col: C.chap, w: 700 }) + lead(342, MY - 44, 318, MY - 36);
      q += lab(352, MY + 30, l('sec6263'), { size: 11, n: 9, col: '#3F5F88' });
      [[286, MY + 58], [304, MY + 124]].forEach(([x, y]) => { q += G('chap', `<path d="M${x - 10},${y - 8} A11,11 0 1 0 ${x + 10},${y - 8}" fill="none" stroke="${C.chap}" stroke-width="4" stroke-linecap="round"/>`); });
      q += lab(352, MY + 112, l('chapc'), { size: 11, n: 10, col: C.chap });
      P.B = q;
    }
    /* В: C-концевой якорь — рибосома отделена от цепи; гидрофобный C-конец захвачен фактором доставки → встраивающий комплекс */
    {
      let q = head(400, 'В', 'ta');
      /* рибосома после синтеза — отдельно от цепи (критерий 10) */
      const R = ribosome(520, 372, 1);
      q += mrna(484, 560, 394) + R.s;
      q += lab(520, 318, l('ribo'), { size: 11, n: 14 });
      /* свободная цепь (N → C): у C-конца — гидрофобный сегмент (красный), его держит фактор доставки */
      q += chain([[418, 300], [436, 280], [420, 262], [444, 250], [468, 262]], { wave: 2.4 });
      q += line(468, 262, 488, 250, C.sig, 5);
      q += G('chap', `<path d="M480,238 Q495,230 503,247 Q497,265 482,261" fill="none" stroke="#0D6E73" stroke-width="5" stroke-linecap="round"/>`);
      q += lab(440, 222, l('fac'), { size: 11, n: 9, col: '#0D6E73' });
      q += arrow(492, 230, 473, MY + 16, C.muted, 2);
      /* встраивающий комплекс мембраны ЭПР и встроенный белок: сегмент в бислое, C-конец — в просвете, основная часть — в цитозоле */
      q += tm2(470, MY, '#6C7A89');
      q += lab(462, MY - 46, l('ins'), { size: 11, n: 12 }) + lead(467, MY - 26, 469, MY - 15);
      q += rect(548.5, MY - MH / 2 - 3, 7, MH + 6, C.sig, { rx: 2 });
      q += chain([[552, MY + MH / 2 + 2], [566, MY + 30], [546, MY + 52], [568, MY + 72]], { wave: 0, w: 3 });
      q += lab(556, MY - 46, l('ta'), { size: 11, n: 10, col: C.sig }) + lead(554, MY - 26, 552, MY - 13);
      q += lab(556, MY + 100, l('bulk'), { size: 11, n: 12 });
      P.C = q;
    }
    ['A', 'B', 'C'].forEach(k => { s += k === m ? P[k] : `<g opacity=".35">${P[k]}</g>`; });
    s += sideUp(8, 44, l('lum')) + sideDn(8, 406, l('cyt'));
    return s;
  } };

  /* ---------- ·15 glyco-data (src_03, Guay et al. 2023): две цепи с отмеченными гликанами + доля выхода в среду ----------
     args: [белок, доля выхода, %] — числа только из паспорта 10 (= 04): α1-антитрипсин 65, антитромбин 51 (одна серия, HEK293);
     вариант с заменой — без числа (null): чаще повторно получает глюкозу → повторный возврат к калнексину (качественно). */
  GN.s4_r_glycodata = { view(args, t) {
    const [m, pct] = args, l = K('glycodata', t), MY = 300, XW = 392, CY = 196, XN = 40, XC = 360;
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 }) + rect(0, 0, XW, MY, C.lumen, { rx: 0 }) + rect(0, MY, XW, 420 - MY, C.cyto, { rx: 0 });
    s += memH(0, XW, MY, m === 'at3' ? [[292, 312]] : [[68, 88], [292, 312]]);
    s += sideUp(12, 50, t('s4_r_ribopool_lum')) + sideDn(10, 406, t('s4_r_ribopool_cyt'));
    const name = m === 'at3' ? l('at3') : m === 'var' ? l('var') : l('aat');
    s += lab(12, 22, name, { a: 'l', size: 14, w: 800, col: m === 'var' ? C.bad : C.chain });
    /* цепь N → C; положения гликанов условные: у α1-антитрипсина первый гликан — в первых ~50 аминокислотах, у антитромбина — дальше */
    s += chain([[XN, CY], [XC, CY]], { wave: 2.6 });
    s += lab(XN - 4, CY + 22, t('s4_r_signal_n'), { size: 11 }) + lab(XC + 4, CY + 22, t('s4_r_signal_c'), { size: 11 });
    const x50 = XN + (XC - XN) * 50 / 400;
    s += `<path d="M${XN},${CY - 12} L${XN},${CY - 18} L${f(x50)},${CY - 18} L${f(x50)},${CY - 12}" fill="none" stroke="${C.muted}" stroke-width="1.4"/>`;
    s += lab(XN - 6, CY - 32, l('n50'), { a: 'l', size: 11.5, col: C.muted });
    /* калнексин — белок мембраны ЭПР с лектиновой головкой в просвете (выше обычного: головка достаёт до гликана) */
    const cnx = (x, top) => G('cnx', rect(x - 4, MY - MH / 2 - 2, 8, MH + 4, C.chap, { rx: 3 }) + line(x, MY - MH / 2 - 2, x, top + 10, C.chap, 3) +
      `<path d="M${x - 16},${top + 10} A16,11 0 0 1 ${x + 16},${top + 10} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
    if (m === 'at3') {
      s += glycan(204, CY - 4, -1, { glc: 0, u: 6 }) + glycan(284, CY - 4, -1, { glc: 0, u: 6 });
      s += bip(62, CY, 1.05) + bip(96, CY, 1.05);
      s += lab(80, CY + 40, l('bip'), { w: 700, col: C.chap });
      s += cnx(302, 254) + lab(302, 234, l('cnx'), { size: 11.5, col: C.chap });
    } else {
      /* гликан у N-конца смотрит вниз — к головке калнексина (связан через концевую глюкозу) */
      s += glycan(78, CY + 4, 1, { glc: 1, u: 6 }) + glycan(284, CY - 4, -1, { glc: 0, u: 6 });
      s += cnx(78, 254) + lab(66, 280, l('cnx'), { a: 'r', size: 11, col: C.chap });
      s += cnx(302, 254);
      if (m === 'var') {
        /* замена аминокислоты в цепи и повторные циклы связывания с калнексином */
        s += `<path d="M196,${CY - 11} L200,${CY - 3} L209,${CY - 3} L202,${CY + 3} L205,${CY + 12} L196,${CY + 6} L187,${CY + 12} L190,${CY + 3} L183,${CY - 3} L192,${CY - 3} Z" fill="${C.bad}"/>`;
        s += carrow(94, 238, 136, 252, -.45, C.bad, 2) + carrow(136, 262, 96, 270, -.45, C.bad, 2);
        s += lab(206, 256, l('cycle'), { size: 11.5, col: C.bad, n: 20 });
      }
    }
    /* правая часть: доля выхода в среду (столбец) или повторное глюкозилирование (вариант) */
    const BX = 452, BY = 286, BH = 190;
    if (pct != null) {
      const A = axes(BX, BY, 110, BH, 100, [0, 50, 100], '%');
      s += A.s + rect(BX + 26, BY - A.H(pct), 56, A.H(pct), C.sec, { rx: 2 });
      s += lab(BX + 54, BY - A.H(pct) - 14, pct + ' %', { size: 15, w: 800 });
      s += lab(BX + 54, BY + 16, l('sec'), { size: 12, w: 700 });
      s += lab(BX + 54, BY + 36, l('series'), { size: 11.5, col: C.muted, it: true });
    } else {
      const gx = 500, gy = 178;
      s += glycan(gx, gy + 34, -1, { glc: 1, u: 7 });
      s += carrow(gx + 40, gy - 30, gx + 40, gy + 50, -.6, C.bad, 2.2) + carrow(gx - 40, gy + 50, gx - 40, gy - 30, -.6, C.bad, 2.2);
      s += lab(gx, gy + 96, l('reglc'), { size: 12.5, w: 700, col: C.bad, n: 18 });
    }
    s += lab(500, 370, l('cell'), { size: 11, col: C.muted, n: 26 });
    return s;
  } };

  /* ---------- ·21 lyset (src_04, Richards et al. 2022): фермент метки в аппарате Гольджи с LYSET и без него ----------
     внеклеточная среда — сверху, над плазматической мембраной; цитозоль — снизу; просвет цистерн и лизосомы — внутри мембран.
     Критерий 10: мРНК фермента не изображается (её количество не меняется) — на схеме её нет ни в одном режиме. */
  GN.s4_r_lyset = { view(args, t) {
    const ko = args[0] === 'ko', l = K('lyset', t), PM = 74, ENZ = '#11707A', LYS = '#E0A800';
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 }) + rect(0, 0, 600, PM, C.lumen, { rx: 0 });
    s += memH(0, 600, PM, [], 'pm') + sideUp(10, 18, l('medium')) + sideDn(10, 406, t('s4_r_ribopool_cyt'));
    /* аппарат Гольджи: три цистерны; в средней (широкой) — фермент метки и LYSET в мембране, активная часть фермента в просвете */
    const gx = 170;
    s += cisterna(gx, 130, 220, 28) + cisterna(gx, 196, 240, 28) + cisterna(gx, 264, 256, 56);
    s += lab(96, 96, l('golgi'), { w: 700 });
    const ex = 128, ey = 264 + 28;   /* нижняя мембрана нижней (широкой) цистерны */
    if (!ko) {
      s += G('tagenz', rect(ex - 3.5, ey - MH / 2 - 2, 7, MH + 4, ENZ, { rx: 3 }) + rect(ex - 18, ey - MH / 2 - 16, 36, 14, ENZ, { rx: 6 }));
      s += G('tagenz', rect(ex + 22, ey - MH / 2 - 3, 9, MH + 6, LYS, { rx: 3 }) + rect(ex + 17, ey - MH / 2 - 9, 19, 8, LYS, { rx: 3 }));
      s += lab(84, 340, l('ptr'), { col: ENZ, w: 700 }) + lead(100, 328, ex - 2, ey + 12, ENZ);
      s += lab(200, 340, l('lyset'), { col: '#9A7400', w: 700 }) + lead(192, 328, ex + 27, ey + 12, '#9A7400');
    } else {
      s += rect(ex - 18, ey - MH / 2 - 16, 36, 14 + MH + 18, 'none', { st: C.grey, dash: '4 3', rx: 6 });
      s += rect(ex + 17, ey - MH / 2 - 9, 19, MH + 15, 'none', { st: C.grey, dash: '4 3', rx: 4 }) + cross(ex + 26, ey - 26, 6);
      s += lab(200, 340, l('lyset'), { col: C.muted, w: 700 }) + lead(192, 328, ex + 27, ey + 12, C.muted);
    }
    /* лизосома */
    const LX = 470, LY = 250, LR = 62;
    s += closedMem(circlePts(LX, LY, LR), C.lumen, 'lyso')   /* С-13 */ + lab(LX, LY + LR + 22, l('lys'), { w: 700 });
    /* не зависят от M6P: гидролаза без M6P-пути (другой цвет) и мембранный белок лизосомы — в лизосоме в обоих режимах */
    s += G('hydro', `<circle cx="${LX + 22}" cy="${LY + 26}" r="7" fill="#E9C46A" stroke="#8A6D0B" stroke-width="1"/>`);
    s += G('tm', rect(LX + LR - (MH + 6) / 2, LY - 4.5, MH + 6, 9, '#6B8E23', { rx: 3 }));
    s += lab(552, 352, l('indep'), { size: 11.5, n: 11 }) + lead(540, 338, LX + 27, LY + 31) + lead(560, 338, LX + LR + 4, LY + 8);
    if (!ko) {
      /* норма: гидролазы получают метку и уходят в лизосомы (в лизосоме метка снята) */
      [[LX - 26, LY - 14], [LX - 4, LY - 34], [LX + 6, LY + 2], [LX - 28, LY + 22]].forEach(([x, y]) => { s += hydrolase(x, y); });
      s += carrier(346, 176, 15, null, hydrolase(344, 178, { tag: true, r: 6 }));
      s += arrow(288, 140, 324, 166, C.ink, 2.2) + arrow(366, 186, LX - LR + 2, LY - 22, C.ink, 2.2);
      s += lab(356, 124, l('hyd_m6p'), { size: 11.5, n: 14 });
    } else {
      /* без LYSET: фермент метки уходит в лизосому и разрушается; гидролазы без метки уходят в среду */
      s += hydrolase(LX - 10, LY - 20);
      [[LX - 34, LY + 8, 20], [LX - 22, LY + 22, -30], [LX - 6, LY + 12, 60], [LX - 30, LY - 4, -60]].forEach(([x, y, a]) => { s += G('tagenz', `<rect x="${x - 5}" y="${y - 3}" width="10" height="6" rx="2" fill="${ENZ}" transform="rotate(${a} ${x} ${y})"/>`); });
      s += arrow(306, 268, LX - LR - 8, 258, ENZ, 2.2, '6 4');
      s += lab(352, 290, l('ptr'), { col: ENZ, w: 700 });
      s += lab(470, 162, l('deg'), { size: 11.5, col: ENZ, n: 30 });
      s += arrow(282, 124, 322, PM + 14, C.ink, 2.2);
      [[330, 36], [354, 50], [378, 32]].forEach(([x, y]) => { s += hydrolase(x, y); });
      s += lab(336, 108, l('hyd_no'), { a: 'l', size: 11.5 });
    }
    return s;
  } };

  /* ---------- ·26 tgn-data (src_05, обзор Ramazanov et al. 2021): транс-сеть аппарата Гольджи; концентрации не показаны ----------
     режим 1: насос Ca²⁺, олигомер Cab45 с секретируемым белком, формирующийся пузырёк с мембраной, богатой сфингомиелином; контакт ЭПР
     и транс-сети: липиды; Ca²⁺ — предположение (критерий 10). Режим 2: гранины слипаются в кислой среде с Ca²⁺ → незрелая гранула; «модель». */
  GN.s4_r_tgndata = { view(args, t) {
    const m = args[0], l = K('tgndata', t), MY = 196;
    const bud = (cx, R, neck) => {   /* мембрана транс-сети с почкой в цитозоль: полилиния средней линии и контур просвета почки */
      const P = [[0, MY], [cx - neck - 14, MY]], a0 = Math.asin(Math.min(.99, neck / R)), cy = MY + Math.sqrt(R * R - neck * neck) + 4;
      P.push([cx - neck, MY + 4]);
      for (let i = 0; i <= 40; i++) { const a = -Math.PI / 2 - a0 - i / 40 * (2 * Math.PI - 2 * a0); P.push([cx + R * Math.cos(a), cy - R * Math.sin(a) * -1]); }
      P.push([cx + neck, MY + 4], [cx + neck + 14, MY], [600, MY]);
      return { P, cy, cx, R, neck };
    };
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 }) + rect(0, 0, 600, MY, C.lumen, { rx: 0 });
    const B = m === 'cab45' ? bud(330, 40, 14) : bud(320, 54, 16);
    s += `<circle cx="${f(B.cx)}" cy="${f(B.cy)}" r="${B.R}" fill="${C.lumen}"/>` + rect(B.cx - B.neck, MY - 2, 2 * B.neck, 12, C.lumen, { rx: 0 });
    if (m === 'cab45') s += `<path d="M${B.P.slice(2, -2).map(p => f(p[0]) + ',' + f(p[1])).join(' L')}" fill="none" stroke="#E9B8E0" stroke-width="${MH + 12}" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>`;
    s += G('trans', BF.bilayerPts(B.P));
    s += sideUp(10, 18, l('lum')) + sideDn(10, 406, t('s4_r_ribopool_cyt'));
    const ca = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="3.6" fill="#E0A800" stroke="#8A6D0B" stroke-width=".8"/>`;
    if (m === 'cab45') {
      /* насос Ca²⁺ в мембране транс-сети: Ca²⁺ из цитозоля → в просвет */
      s += G('tm', tm2(560, MY, '#1F8A8A'));
      s += arrow(560, MY + 54, 560, MY - 30, '#1F8A8A', 2.2);
      [[520, 120], [574, 100], [536, 150], [492, 140], [466, 108], [440, 150]].forEach(([x, y]) => { s += ca(x, y); });
      [[530, 238], [588, 246]].forEach(([x, y]) => { s += ca(x, y); });
      s += lab(560, MY + 76, l('pump'), { w: 700, col: '#1F6E6E' });
      s += lab(508, 80, l('ca'), { w: 700, col: '#8A6D0B' });
      /* олигомер Cab45 с секретируемым белком — в формирующемся пузырьке */
      const cab = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="6.5" fill="#C77700" stroke="#7A4A00" stroke-width="1"/>`;
      const ox = 330, oy = B.cy - 2;
      let q = ''; [[-12, -8], [0, -12], [12, -8], [-12, 6], [0, 2], [12, 6], [-4, 16], [8, 18]].forEach(([dx, dy]) => { q += cab(ox + dx, oy + dy); });
      s += G('tm', q) + solProt(ox - 22, oy + 10, C.sec, 6) + solProt(ox + 22, oy - 2, C.sec, 6) + ca(ox - 3, oy - 24) + ca(ox + 16, oy + 22);
      s += lab(330, 120, l('cab45'), { w: 700, col: '#9A5A00' }) + lead(330, 132, 330, oy - 30);
      s += lab(394, 224, l('cargo'), { a: 'l', size: 11.5, col: '#2B5D88' }) + lead(392, 226, ox + 27, oy - 3, '#2B5D88');
      s += lab(394, 264, l('sm'), { a: 'l', size: 11.5, n: 18, col: '#8A3A7E' }) + lead(392, 262, 382, 256, '#8A3A7E');
      s += lab(330, 312, l('ves'), { size: 11.5 });
      /* контакт ЭПР и транс-сети: цистерна ЭПР под мембраной транс-сети; липиды — сплошная стрелка, Ca²⁺ — штриховая (предположение) */
      s += closedMem(roundRectPts(24, 252, 140, 30, 14), C.lumen, 'er_mem');
      s += arrow(54, 246, 54, MY + 12, C.ink, 2) + arrow(134, 246, 134, MY + 12, C.ink, 2, '5 4');
      s += lab(62, 227, l('lip'), { a: 'l', size: 11.5 });
      s += lab(142, 227, l('ca'), { a: 'l', size: 11.5, w: 700, col: '#8A6D0B' });
      s += tag(134, 312, l('hyp'), C.warn, { size: 11 });
      s += lab(94, 344, l('contact'), { size: 11.5, n: 26 });
    } else {
      /* гранины слипаются в кислой среде с высоким Ca²⁺ → содержимое незрелой гранулы (механизм отделения от мембраны не показан) */
      const gr = (x, y, r = 7) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${C.granule}" stroke="#A88B2A" stroke-width="1.2"/>`;
      let q = ''; [[-22, -10], [-8, -18], [8, -16], [22, -6], [-16, 6], [0, -2], [16, 10], [-6, 16], [10, 24], [-22, 22], [24, 26]].forEach(([dx, dy]) => { q += gr(320 + dx, B.cy + dy, 8); });
      s += G('granule', q);
      [[90, 120, 6], [126, 150, 6], [170, 104, 6], [440, 120, 6], [480, 150, 6], [520, 100, 6]].forEach(([x, y, r]) => { s += G('granule', gr(x, y, r)); });
      [[110, 90], [150, 130], [196, 150], [456, 92], [500, 128], [540, 150], [240, 120], [400, 150]].forEach(([x, y]) => { s += ca(x, y); });
      s += lab(320, 60, l('acid'), { w: 700, col: '#3E6A9A' });
      s += lab(320, 116, l('gran'), { w: 700, col: '#8A6D0B' }) + lead(320, 128, 320, B.cy - 30, '#8A6D0B');
      s += lab(394, 262, l('igran'), { a: 'l', w: 700 }) + lead(392, 262, 384, 258);
      s += tag(470, 330, l('model'), C.warn, { size: 12 });
    }
    return s;
  } };

  /* ---------- ·28 measure-choice: таблица «причина → ожидаемые показания» (OC.int_profile), минимальный набор (OC.int_min_sets) ----------
     строки — восемь наблюдений OC.INT_OBS (подписи 02: fin_obs1…fin_obs8), столбцы — совместимые причины случая (OC.INT_CASES). */
  GN.s4_r_measures = { view(args, t) {
    const cs = args[0], l = K('measures', t), c = OC.INT_CASES[cs], MS = OC.int_min_sets(cs), n = c.causes.length;
    const inMin = new Set(MS.sets.flat()), X0 = 8, W0 = 262, X1 = X0 + W0, W1 = (592 - X1) / n, Y0 = 78, RH = 31;
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 });
    s += lab(X0 + 6, Y0 - 14, l('obs'), { a: 'l', w: 800, size: 12.5 });
    s += lab(X1 + (592 - X1) / 2, 11, l('cause'), { w: 800, size: 12.5 });
    c.causes.forEach((h, j) => { const x = X1 + j * W1;
      s += rect(x + 2, 22, W1 - 4, Y0 - 25, '#EEF1F4', { rx: 5 });
      s += lab(x + W1 / 2, 22 + (Y0 - 25) / 2, l('c_' + h), { size: 11.5, w: 700, n: Math.max(10, Math.floor((W1 - 10) / 6.6)), vc: true }); });
    const val = v => v === true ? t('s4_v_yes') : v === false ? t('s4_v_no') : t('s4_v_dash');
    OC.INT_OBS.forEach((o, i) => {
      const y = Y0 + i * RH, known = c.known.includes(o), hi = inMin.has(o);
      const vals = c.causes.map(h => MS.profiles[h][o]), diff = new Set(vals.map(String)).size > 1;
      s += rect(X0, y + 1, 584, RH - 2, hi ? '#FFF1C2' : known ? '#EEF1F4' : (i % 2 ? '#FAFBFC' : '#fff'), { rx: 4, st: hi ? C.warn : null, sw: 1.8 });
      s += lab(X0 + 8, y + RH / 2, t('fin_obs' + (i + 1)), { a: 'l', size: 11, w: hi ? 700 : 500, col: known ? C.muted : C.ink, n: 40, vc: true, it: known });
      vals.forEach((v, j) => { s += lab(X1 + j * W1 + W1 / 2, y + RH / 2, val(v), { size: 12, w: hi || (diff && !known) ? 800 : 500, col: v === true ? C.ok : v === false ? C.bad : C.muted }); });
    });
    /* легенда: наименьший набор (число измерений — MS.k), известное по условию, «—» не применимо; вывод при меньшем числе измерений */
    const yl = Y0 + 8 * RH + 8;
    s += rect(X0, yl, 18, 14, '#FFF1C2', { st: C.warn, sw: 1.8, rx: 3 }) + lab(X0 + 26, yl + 7, l('min') + ' · ' + l('k', { k: MS.k }), { a: 'l', size: 11.5, w: 700 });
    if (MS.sets.length > 1) s += lab(X0 + 26, yl + 25, l('alt'), { a: 'l', size: 11.5, col: C.ink });
    s += rect(X0, yl + 36, 18, 14, '#EEF1F4', { rx: 3 }) + lab(X0 + 26, yl + 43, l('known'), { a: 'l', size: 11.5, col: C.muted, it: true });
    s += lab(240, yl + 43, t('s4_v_dash') + ' ' + l('na'), { a: 'l', size: 11.5, col: C.muted });
    s += lab(300, 406, l('insuf'), { size: 12, w: 700, col: C.bad });
    return s;
  } };
})();
/* =====================================================================
   s4g_t1.js — сцены вкладки 1 «Начальный адрес: сигнальная последовательность, SRP и транслокон Sec61» (02, вкладка 1;
   07, разд. 3.1, 4, 5; 10, ·3–·5; 12, Э1.1–Э1.6 и «Остановки»). Агент t1.
   Сцены (контракт S4F/GN: view(args, t) → SVG 600 × 420; состояние страницы не читается, всё скрытое до ответа — в args):
   GN.s4_t1b — вход белка в ЭПР: цикл SRP и перенос цепи (практикум, панель Б; «Объяснения» ·3 srp-cycle).
     args «Объяснений»: ['1'] узнавание · ['2'] доставка · ['3'] передача · ['4'] возврат (= этапы Э1.2–Э1.5).
     args практикума: [o], o = { cargo: 'secreted'|'cytosolic'|'cytosolic_plus_signal', sec61: 'open'|'blocked', spase: bool,
       parts: { srp, srpr, sec61, spase, sig } (false — деталь убрана в конструкторе), stg: 0…6 (кадр анимации; нет — конечный
       кадр = статичная схема), wait: bool (до ответа: исход не рисуется), focus: 's4' (шаг 1.4 — до ответа кадр Э1.2 без знака
       скорости синтеза), inv: 'pre'|'post' (обратная задача: белок в ЭПР с несрезанным сигналом; после ответа — место отщепления
       помечено крестом) }.
     GN.s4_t1b.outcome(o) — исход модели (07, 3.1): OC.b1 или, при убранных SRP / рецепторе SRP, OC.a1(srp=false) (07, 3.1, 5);
       stop — число этапов анимации до остановки (12, «Остановки»), stopKey — подпись остановки.
   GN.s4_t1a — панель А практикума: ['two', o] две рибосомы (шаг 1.1: альбумин и актин; альбумин — по тем же этапам);
     ['sig', o] увеличенное начало цепи (шаг 1.2: o.rev — гидрофобный центр подсвечен, рядом сигналы двух других секретируемых белков).
   GN.s4_t1c — встраивание в мембрану ЭПР («Объяснения» ·5): ['sol'] растворимый · ['single'] однопроходный · ['multi'] многопроходный.
   GN.s4_r_sec61 — разрез транслокона («Объяснения» ·4): ['closed'] · ['gate'] · ['transfer'] · ['end'].
   Правила (10, разд. 0): просвет ЭПР — сверху, цитозоль — снизу; мембрана — бислой BF (S4F.memH); мембранный белок — в бислое;
   сигнальная пептидаза — активным центром в просвет; выключенное звено — штриховой контур и красный крест; у объектов — подписи.
   Русского текста здесь нет: все подписи — t('<сцена>_<ключ>') (texts_route_L.py — ключи паспорта 10; texts_ui_t1.py — новые).
   ===================================================================== */
/* S4F.sides: o.top || 26 — ноль не передаётся; почти ноль даёт фон от верхнего края кадра (правка S4F — в отчёте) */
const TOP0 = 0.01;
const T1G = (function () {
  const { C, f, G, T, TN, line, arrow, cross, waitBox, tag, memH, MH, ribosome, mrna, chain, srp, srpR, sec61, spase } = S4F;
  const ACT = '#0E7C7B';                 /* цепь актина — другим цветом (10, ·2: «цепь цитозольного белка окрашена иначе») */
  const LUMT = '#3E6A9A', CYTT = '#8A7344';
  const plen = P => { let L = 0; for (let i = 1; i < P.length; i++) L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); return L; };
  /* цепь с красным отрезком фиксированной длины sl у N-конца (последняя точка pts) */
  const chainS = (pts, sl, o = {}) => chain(pts, Object.assign({}, o, { sig: sl ? Math.min(.95, sl / plen(pts)) : 0 }));
  /* свёрнутая цепь: виток от точки входа a0 на радиусе r внутрь; out — выйти наружу отрезком (N-конец) */
  function coil(cx, cy, r, a0, turns = 1.7, n = 44) {
    const P = [];
    for (let i = 0; i <= n; i++) { const u = i / n, a = a0 + u * turns * 2 * Math.PI, rr = r * (1 - .55 * u); P.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
    return P;
  }
  /* знак ГТФ (10, ·3: «ГТФ отмечен значком у SRP и рецептора без кинетики») */
  const gtp = (x, y, t) => `<rect x="${f(x - 15)}" y="${f(y - 8)}" width="30" height="16" rx="5" fill="#fff" stroke="${C.srpr}" stroke-width="1.2"/>` + T(x, y, t('s4_t1b_gtp'), { size: 10.5, w: 700, col: C.srpr });
  /* убранная деталь (конструктор): штриховой контур и крест (10, разд. 0) */
  const srpGhost = (cx, cy) => G('srp', `<path d="M${f(cx - 26)},${f(cy + 6)} C${f(cx - 26)},${f(cy - 15)} ${f(cx - 6)},${f(cy - 17)} ${f(cx)},${f(cy - 5)} C${f(cx + 6)},${f(cy - 17)} ${f(cx + 26)},${f(cy - 15)} ${f(cx + 26)},${f(cy + 6)} C${f(cx + 17)},${f(cy + 15)} ${f(cx - 17)},${f(cy + 15)} ${f(cx - 26)},${f(cy + 6)} Z" fill="none" stroke="${C.grey}" stroke-width="1.4" stroke-dasharray="4 3"/>`) + cross(cx, cy, 8);
  const srprGhost = (x, y) => G('srpr', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 2)}" width="12" height="${f(MH + 4)}" rx="3" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>` +
    `<path d="M${f(x - 16)},${f(y + MH / 2 + 4)} Q${f(x)},${f(y + MH / 2 + 22)} ${f(x + 16)},${f(y + MH / 2 + 4)}" fill="none" stroke="${C.grey}" stroke-width="2" stroke-dasharray="4 3"/>`) + cross(x, y + MH / 2 + 14, 7);
  const sec61Ghost = (x, y) => G('sec61', `<rect x="${f(x - 15)}" y="${f(y - MH / 2 - 7)}" width="30" height="${f(MH + 14)}" rx="5" fill="none" stroke="${C.grey}" stroke-dasharray="4 3"/>`) + cross(x, y, 8);

  /* ---------- исход модели вкладки 1 (07, 3.1; 12, «Остановки») ---------- */
  function outcome(o) {
    const p = o.parts || {}, cargo = o.cargo || 'secreted';
    const hasSig = cargo !== 'cytosolic' && p.sig !== false;
    if (!hasSig) { const r = OC.b1('cytosolic'); return { res: r, kind: 'free', stop: null, stopKey: null, nosig: cargo !== 'cytosolic' }; }
    if (p.srp === false || p.srpr === false) {   /* 07, 3.1: «удаление SRP или рецептора SRP → исход OC.a1(srp=false)» */
      const a = OC.a1(true, false, true, 'soluble');
      return { res: { place: a.place, signal: 'kept', ribosome: 'free', srp_bound: false, stop_stage: 'srp' }, kind: 'nosrp', stop: 1, stopKey: 't1_tl_stop_srp', a1: a };
    }
    const spOn = o.inv ? false : (o.spase !== false && p.spase !== false);
    if (p.sec61 === false) { const r = OC.b1(cargo, 'blocked', spOn); return { res: r, kind: 'nosec61', stop: 3, stopKey: 't1_tl_stop_sec61' }; }
    const r = OC.b1(cargo, o.sec61 || 'open', spOn);
    if (r.stop_stage === 'transfer') return { res: r, kind: 'blocked', stop: 4, stopKey: 't1_tl_stop_sec61' };
    if (r.stop_stage === 'cleavage') return { res: r, kind: 'tethered', stop: 5, stopKey: 't1_tl_stop_spase' };
    return { res: r, kind: 'normal', stop: 6, stopKey: null };
  }

  /* ---------- путь одной рибосомы с цепью от цитозоля до просвета (общий для панелей А и Б) ----------
     P — геометрия: MY — середина бислоя; x0, x1 — края мембраны; RX, SX, PX — рецептор SRP, Sec61, сигнальная пептидаза;
     st — рибосома в начале; srpF — свободная SRP; blobL — белок в просвете; mlab — ключ подписи мРНК; cargoBadge — подпись груза.
     s — состояние кадра: { stg (0…6 | 'fin'), kind, cargo, o } */
  function path(P, s, t) {
    const o = s.o || {}, p = o.parts || {}, kind = s.kind, cargo = o.cargo || 'secreted', wait = !!o.wait;
    const col = cargo === 'secreted' ? C.chain : ACT, MY = P.MY, top = MY - MH / 2, bot = MY + MH / 2;
    const stg = s.stg, fin = stg === 'fin';
    const srpOn = p.srp !== false, srprOn = p.srpr !== false, secOn = p.sec61 !== false, spOn = !(o.spase === false || p.spase === false);
    const blocked = o.sec61 === 'blocked';
    const sigOn = cargo !== 'cytosolic' && p.sig !== false;
    const tN = k => t('s4_t1b_' + k);
    const cargoName = t(cargo === 'secreted' ? 's4_t1b_alb' : cargo === 'cytosolic' ? 's4_t1b_act' : 's4_t1b_actsig');
    let back = '', fore = '', lab = '';
    /* --- какой кадр рисуется: позиции рибосомы и SRP */
    const Q = { ribo: null, srpAt: null, gate: false, open: false, chainIn: null };
    const startR = P.st, dockR = [P.SX, MY + 48], recR = [P.RX + 45, MY + 95], finR = [P.SX, MY + 64];
    const srpBound = [startR[0] + 6, startR[1] - 58], srpRec = [P.RX, MY + 46], srpGone = P.srpBack;
    /* какой «финал» (статичная схема) */
    let F = null;
    if (fin) F = kind;
    /* ---------- мембрана и её белки ---------- */
    const gaps = [[P.SX - 22, P.SX + 22]];
    if (srprOn) gaps.push([P.RX - 8, P.RX + 8]);
    if (spOn) gaps.push([P.PX - 8, P.PX + 8]);
    const sigInMem = (fin && (F === 'normal' || F === 'tethered')) || (!fin && stg >= 5 && sigOn);
    if (sigInMem) gaps.push([P.SX + 23, P.SX + 33]);
    back += memH(P.x0, P.x1, MY, gaps);
    /* рецептор SRP */
    back += srprOn ? srpR(P.RX, MY) : srprGhost(P.RX, MY);
    lab += T(P.RX - 50, MY + 22, tN('sr'), { a: 'r', size: 11.5, w: 600, col: C.srpr });
    /* Sec61: открыт на этапах 4–5 нормального пути; закрыт с пробкой в покое и после синтеза (12, Э1.6) */
    const secOpen = !fin && (stg === 4 || stg === 5) && sigOn && secOn && !blocked && srpOn && srprOn;
    if (!secOn) back += sec61Ghost(P.SX, MY);
    else back += sec61(P.SX, MY, { open: secOpen, plug: !secOpen, gate: !fin && stg === 5 && secOpen, off: blocked });
    lab += T(P.SX + 26, MY - 46, tN(blocked && secOn ? 'sec61_blocked' : 'sec61'), { a: 'l', size: 11.5, w: 600, col: C.sec61 });
    /* сигнальная пептидаза: активный центр со стороны просвета (10, ·4) */
    back += spase(P.PX, MY, { off: !spOn });
    lab += TN(P.PX + 15, MY - 80, S4F.wrap(tN('spase'), 12), { size: 11.5, w: 600, col: C.spase });

    /* ---------- рибосома, мРНК, цепь, SRP по кадрам ---------- */
    const riboAt = (xy, slowSign) => {
      const r = ribosome(xy[0], xy[1], 1, {});
      let s = mrna(xy[0] - 62, xy[0] + 62, xy[1] + 24) + r.s;
      lab += T(xy[0], xy[1] + 40, t(P.mlab || 's4_t1b_mrna'), { size: 11.5, col: C.mrna, w: 600 });
      lab += T(xy[0], xy[1] + 57, tN('ribo'), { size: 11.5, col: C.riboL, w: 600 });
      if (slowSign === 'slow' || slowSign === 'fast') {
        if (slowSign === 'slow') s += `<g>${clock(xy[0] + 27, xy[1] - 27)}</g>`;
        lab += T(xy[0], xy[1] + 75, tN(slowSign), { size: 11.5, w: 700, col: slowSign === 'slow' ? C.warn : C.ok });
      } else if (slowSign === 'wait') lab += waitBox(xy[0] - 85, xy[1] + 68, 170, 22, t('s4_hidden'));
      return { s, ex: r.x, ey: r.y };
    };
    const srpFree = xy => (srpOn ? srp(xy[0], xy[1]) : srpGhost(xy[0], xy[1])) + T(xy[0] + 32, xy[1], tN('srp'), { a: 'l', size: 12, w: 700, col: C.srp });
    const sigLabel = (x, y, key, a = 'l') => TN(x, y, S4F.wrap(tN(key), 15), { a, size: 11.5, w: 600, col: C.sig });
    let R;
    const stage = fin ? -1 : stg;
    if (!fin && (stage === 0 || stage === 1 || (stage >= 2 && !sigOn))) {
      /* Э1.1 (или кадр «до начала»): рибосома в цитозоле, из туннеля выходит начало цепи */
      R = riboAt(startR, null);
      if (stage >= 1) {
        const pts = [[R.ex, R.ey], [R.ex, R.ey - 22]];
        fore += sigOn ? chainS(pts, 22, { col }) : chain(pts, { col });
        if (sigOn && !(P.noSigLabelPre && wait)) lab += sigLabel(R.ex + 14, R.ey - 26, 'sig');
      }
      fore += srpFree(P.srpF);
    } else if (!fin && stage === 2) {
      /* Э1.2: SRP связывает сигнал и рибосому, синтез замедлен */
      R = riboAt(startR, o.focus === 's4' && wait ? 'wait' : 'slow');
      fore += chainS([[R.ex, R.ey], [R.ex + 2, R.ey - 24]], 24, { col }) + srp(srpBound[0], srpBound[1]);
      lab += T(srpBound[0] - 32, srpBound[1] + 2, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }) + gtp(srpBound[0], srpBound[1] - 26, t);
      lab += sigLabel(R.ex + 40, R.ey - 6, 'sig');
    } else if (!fin && stage === 3) {
      /* Э1.3: комплекс SRP с рибосомой связан с рецептором SRP (10, ·3: стрелка рибосома → рецептор) */
      R = riboAt(recR, 'slow');
      fore += chainS([[R.ex, R.ey], [R.ex - 14, R.ey - 6], [srpRec[0] + 6, srpRec[1] + 6]], 30, { col }) + srp(srpRec[0], srpRec[1]);
      lab += T(srpRec[0] - 32, srpRec[1] + 22, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }) + gtp(srpRec[0] - 45, srpRec[1] + 2, t) + gtp(P.RX - 34, MY + 22, t);
      back += arrow(startR[0] + 44, startR[1] - 8, recR[0] - 40, recR[1] + 2, C.muted, 2, '5 4');
    } else if (!fin && stage === 4) {
      /* Э1.4: рецептор передаёт рибосому транслокону; сигнал входит в транслокон (стрелка рецептор → транслокон) */
      R = riboAt(dockR, 'slow');
      if (srpOn && srprOn) fore += srp(srpRec[0], srpRec[1]) + T(srpRec[0] - 32, srpRec[1] + 22, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }) + gtp(srpRec[0] - 45, srpRec[1] + 2, t) + gtp(P.RX - 34, MY + 22, t);
      if (secOn && !blocked) fore += chainS([[R.ex, R.ey], [R.ex, top - 2]], 26, { col, wave: 1.6 });
      else fore += chainS([[R.ex, R.ey], [R.ex - 6, R.ey + 2]], 6, { col, wave: 0 });
      if (secOn && !blocked) lab += TN(P.SX, MY - 76, S4F.wrap(tN('sig'), 15), { size: 11.5, w: 600, col: C.sig }) + line(P.SX, MY - 50, P.SX, top - 10, C.muted, 1);
      fore += arrow(P.RX + 20, MY + 22, P.SX - 26, MY + 18, C.muted, 2);
    } else if (!fin && stage === 5) {
      /* Э1.5: SRP и рецептор отделились (стрелка «в цитозоль, к новому циклу»); цепь проходит в просвет */
      R = riboAt(dockR, 'fast');
      const gx = P.SX + 28;
      fore += chainS([[R.ex, R.ey], [P.SX, top - 4], [P.SX - 14, MY - 40], [P.SX + 4, MY - 56], [gx - 8, top - 8], [gx, top + 2], [gx, bot + 3]], MH + 9, { col, wave: 1.8 });
      lab += T(gx + 2, bot + 12, tN('n'), { a: 'l', size: 11, w: 700, col: C.sig });
      fore += srpFree0(srpGone) + arrow(srpRec[0] - 20, srpRec[1] + 16, srpGone[0] + 30, srpGone[1] - 12, C.srp, 2.2);
      lab += T(srpGone[0], srpGone[1] + 30, tN('recycle'), { size: 11.5, w: 600, col: C.srp });
    } else if (!fin && stage === 6) {
      F = 'normal';
    }
    function srpFree0(xy) { return srp(xy[0], xy[1]) + T(xy[0] - 32, xy[1], tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }); }

    /* ---------- конечные состояния (статичная схема; Э1.6 нормального пути = статичная схема) ---------- */
    if (F) {
      const bl = P.blobL, bc = P.blobC;
      if (F === 'normal' || F === 'tethered') {
        R = riboAt(finR, null);
        const gx = P.SX + 28;
        if (F === 'normal') {
          fore += chain(coil(bl[0], bl[1], 24, -.4), { col, wave: 1.4 }) + G('sig', line(gx, top + 1, gx, bot - 1, C.sig, 3.4));
          lab += T(bl[0], bl[1] + 38, cargoName, { size: 12, w: 700, col }) + TN(gx + 10, MY + 28, S4F.wrap(tN('cleaved'), 15), { a: 'l', size: 11.5, w: 600, col: C.sig });
        } else {
          const cp = coil(bl[0], bl[1], 24, -.4).reverse();
          const pts = cp.concat([[bl[0] + 40, bl[1] + 10], [gx - 10, MY - 46], [gx, top - 4], [gx, top + 1], [gx, bot + 3]]);
          fore += chainS(pts, MH + 7, { col, wave: 1.4 });
          lab += T(bl[0], bl[1] + 38, cargoName, { size: 12, w: 700, col }) + TN(gx + 10, MY + 28, S4F.wrap(tN(o.inv === 'post' ? 'notcut' : 'inmem'), 15), { a: 'l', size: 11.5, w: 600, col: C.sig });
          if (o.inv === 'post') fore += cross(gx, top - 7, 6);
          if (o.inv ? o.inv === 'post' : !spOn) lab += tag(P.PX + 15, MY - 112, t('s4_model_note'), C.warn);
        }
        fore += srpFree(srpGone);
      } else if (F === 'blocked') {
        R = riboAt(dockR, null);
        const cp = coil(bc[0], bc[1], 22, -1.2);
        const pts = [[R.ex, R.ey], [R.ex - 24, R.ey + 3], [bc[0] + 40, bc[1] - 26]].concat(cp).concat([[bc[0] - 44, bc[1] + 2]]);
        fore += chainS(pts, 22, { col, wave: 1.4 });
        lab += T(bc[0], bc[1] + 36, cargoName, { size: 12, w: 700, col }) + T(bc[0] - 52, bc[1] + 2, tN('kept'), { a: 'r', size: 11.5, w: 600, col: C.sig });
        fore += srpFree(P.srpF2);
      } else if (F === 'nosec61') {
        R = riboAt(recR, null);
        fore += srp(srpRec[0], srpRec[1]) + T(srpRec[0] - 32, srpRec[1] + 22, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp });
        const c2 = [recR[0] + 92, recR[1] - 6], cp = coil(c2[0], c2[1], 20, 3.2);
        const pts = [[R.ex, R.ey], [R.ex + 26, R.ey - 4], [c2[0] - 20, c2[1] - 10]].concat(cp).concat([[c2[0] + 20, c2[1] + 30]]);
        fore += chainS(pts, 22, { col, wave: 1.4 });
        lab += T(c2[0], c2[1] - 34, cargoName, { size: 12, w: 700, col }) + T(c2[0] + 22, c2[1] + 46, tN('kept'), { size: 11.5, w: 600, col: C.sig });
      } else {
        /* свободная рибосома: актин, сигнал убран, или нет SRP / рецептора SRP (синтез заканчивается в цитозоле) */
        R = riboAt(startR, null);
        const bf = P.blobF, cp = coil(bf[0], bf[1], 22, 1.6);
        const red = F === 'nosrp';
        const pts = [[R.ex, R.ey], [R.ex, bf[1] + 30]].concat(cp).concat([[bf[0] - 38, bf[1] - 18]]);
        fore += red ? chainS(pts, 22, { col, wave: 1.4 }) : chain(pts, { col, wave: 1.4 });
        lab += T(bf[0] + 32, bf[1] + 6, cargoName, { a: 'l', size: 12, w: 700, col });
        if (red) lab += T(bf[0] - 46, bf[1] - 26, tN('kept'), { a: 'r', size: 11.5, w: 600, col: C.sig });
        if (s.nosig) lab += G('sig', `<path d="M${f(bf[0] - 38)},${f(bf[1] - 18)} L${f(bf[0] - 52)},${f(bf[1] - 30)}" stroke="${C.sig}" stroke-width="2" stroke-dasharray="3 3" fill="none"/>`) + cross(bf[0] - 56, bf[1] - 36, 6);
        fore += srpFree(P.srpF);
      }
    }
    /* до ответа исход не рисуется: плашка на месте результата (просвет и цитозоль — оба возможны) */
    if (wait && P.waitL) lab += waitBox(P.waitL[0], P.waitL[1], P.waitL[2], P.waitL[3], t('s4_hidden'));
    return back + (R ? R.s : '') + fore + lab;
  }
  function clock(x, y) {
    return `<circle cx="${f(x)}" cy="${f(y)}" r="7" fill="#fff" stroke="${C.warn}" stroke-width="1.6"/>` + line(x, y - 4.5, x, y, C.warn, 1.6) + line(x, y, x + 3, y + 2, C.warn, 1.6);
  }
  return { C, ACT, LUMT, CYTT, outcome, path, coil, chainS, plen, gtp };
})();

/* ---------- GN.s4_t1b: панель Б практикума и ·3 «Объяснений» ---------- */
GN.s4_t1b = (function () {
  const { C, T, sides } = S4F;
  const P = { MY: 150, x0: 0, x1: 600, RX: 335, SX: 410, PX: 500, st: [150, 300], srpF: [330, 236], srpF2: [150, 230], srpBack: [222, 262], blobL: [285, 62], blobC: [300, 285], blobF: [150, 214],
    waitL: [20, 42, 230, 56] };
  function view(args, t) {
    const a0 = (args || [])[0];
    let o, stg;
    if (typeof a0 === 'string' || typeof a0 === 'number') {   /* «Объяснения» ·3: режим k → этап Э1.(k+1) нормального пути альбумина */
      o = { cargo: 'secreted', sec61: 'open', spase: true, parts: {} }; stg = (+a0 || 1) + 1;
    } else { o = a0 || {}; stg = o.wait ? (o.focus === 's4' ? 2 : 1) : (o.stg == null ? 'fin' : o.stg); }
    const out = T1G.outcome(o);
    let s = sides(P.MY, { top: TOP0, up: t('s4_t1b_lum'), down: t('s4_t1b_cyt') });
    const show = o.inv === 'pre' ? 'fin' : stg;
    s += T1G.path(P, { stg: show, kind: out.kind, nosig: out.nosig, o: Object.assign({}, o, { wait: o.wait && !o.inv }) }, t);
    if (o.cargo && typeof a0 === 'object') s += T(590, 406, t('s4_t1b_cargo', { p: t(o.cargo === 'secreted' ? 's4_t1b_alb' : o.cargo === 'cytosolic' ? 's4_t1b_act' : 's4_t1b_actsig') }), { a: 'r', size: 12, w: 700, col: T1G.CYTT });
    return s;
  }
  return { view, outcome: T1G.outcome, P };
})();

/* ---------- GN.s4_t1a: панель А практикума (шаги 1.1–1.2) ---------- */
GN.s4_t1a = (function () {
  const { C, f, G, T, TN, line, memH, waitBox } = S4F;
  const PA = { MY: 150, x0: 230, x1: 600, RX: 375, SX: 452, PX: 536, st: [306, 300], srpF: [470, 214], srpF2: [470, 214], srpBack: [330, 262], blobL: [320, 62], blobC: [306, 205], blobF: [306, 200],
    mlab: 's4_t1a_mrna_alb', noSigLabelPre: true, waitL: [250, 26, 170, 64] };
  function two(o, t) {

/* ---------- GN.s4_r_sec61: разрез транслокона Sec61 (·4; MBoC7 с. 704–706, рис. 12–22, 12–23) ---------- */

      s += T(X - 82, 70, L('ca'), { a: 'r', size: 12, w: 700, col: C.ink });

  GN.s4_t2b = { view(args, t) { const [m, o = {}] = args; return t2b(m, o, t); } };

  /* =================== ·11 exit-criterion — GN.s4_t2c =================== */
  function cargoIn(cx, cy, kind) {   /* груз в носителе: свёрнутый белок или комплекс αβ, гликаны без глюкоз (u мелкий) */
    if (kind === 'pair') return fprot(cx - 7, cy + 14, 7) + fprot(cx + 7, cy + 14, 7) + gly(cx - 7, cy + 7, -1, { u: 2.2 }) + gly(cx + 7, cy + 7, -1, { u: 2.2 });

  const golgiCis = (cx, cy, w, h) => F.cisterna(cx, cy, w, h, C.lumen, 'cis');   /* С-13 */
  function t2c(m, o, t) {
    const y0 = 160, b = budGeo(y0, 250, 34), xcn = 110, vx = 370, vy = 282, R = 34, gx = 505, gy = 360;
    let s = F.sides(y0, { up: t('lbl_lumen'), down: t('lbl_cytosol') });

    const xta = 156, xp = 148, p0 = m === 'pair' && o.stg === 0;

    s += lab(b.c, y0 - 70, t('s4_t2c_eres')) + lead(b.c, y0 - 61, b.c, y0 - 14);
    s += lab(b.c - 58, b.cy + 26, t('s4_t2c_copii'), { a: 'r' }) + lead(b.c - 56, b.cy + 22, b.c - 44, b.cy + 14);

         (домены — в просвет, хвосты — в цитозоль, к оболочке COP-II) */
      const pairER = () => subAt('a', xp - 8, y0, 0, -1, 7, `data-y0="${y0}"`) + subAt('b', xp + 8, y0, 0, 1, 7, `data-y0="${y0}"`);
      if (o.stg === 0) { s += (m === 'pair' ? pairER() : cargoIn(150, 64, m)) + cis(); }
      else {
        s += (m === 'pair' ? pairRing(b.c, b.cy, b.R, 90) : cargoIn(b.c, b.cy - 14, m)) + ves(vx, vy, R, 'copii', m === 'pair' ? pairRing(vx, vy, R, 90) : cargoIn(vx, vy - 14, m)) + F.arrow(b.c + 40, b.cy + 40, vx - 50, vy - 26, C.muted, 1.8, '4 3');
        s += cis() + F.larrow(vx + 44, vy + 30, gx - 52, gy - 32, '', C.ink, { w: 2.4 }) + lab(590, 290, t('s4_t2c_golgi'), { a: 'r' });
        if (m === 'pair') s += lab(vx - 58, vy + 46, t('s4_t2c_ab'), { a: 'r' }) + lead(vx - 56, vy + 41, vx - 9, vy + 18);
      }
    } else if (m === 'single') {
      const u = 5, st = u * 1.3, top = y0 - MH / 2 - 26, ya = top - 2 - glyH(u, 7);
      /* o.unk — обратная задача: свёрнута ли α, по наблюдению неизвестно (02, t2_inv) — контур штрихом, без витка внутри */
      const al = o.unk ? G('glycoprot', `<ellipse cx="${f(xcn + st)}" cy="${f(ya - 12)}" rx="15" ry="12" fill="#fff" stroke="${C.chain}" stroke-width="1.6" stroke-dasharray="4 3"/>`) : fprot(xcn + st, ya - 12, 12);
      /* α — субъединица рецептора: домен с гликаном в просвете у калнексина, ТМ-сегмент в бислое (xta), хвост в цитозоле; BiP — в просвете */
      s += F.calnexin(xcn, y0) + subER('a', xta, y0, [[xcn + st + 10, ya - 2], [xcn + 36, ya + 22], [xta, ya + 46]], gly(xcn + st, ya, 1, { glc: 1, u }) + al) + F.bip(xcn + st + 30, ya - 14, .8);

      s += F.arrow(xta + 18, y0 - 48, b.c - 22, y0 - 8, GH, 2, '5 4') + F.cross((xta + 18 + b.c - 22) / 2, (y0 - 48 + y0 - 8) / 2, 8);
      if (!o.wait) s += lab(330, 84, t('s4_t2c_wait'), { a: 'l', col: C.bad, w: 700, n: 14 });

    } else if (m === 'kdel') {
      /* ушедший белок ЭПР (BiP с KDEL) в цис-сети → KDEL-рецептор → носитель с COP-I → ЭПР (MBoC7 рис. 13–26) */
      const rx = 550, ry = gy - 28, R2 = 22, cy2 = 250;
      s += F.arrow(b.c + 34, b.cy + 46, gx - 78, gy - 4, C.muted, 1.8, '4 3') + lab(330, 300, t('s4_t2c_golgi'), { a: 'r' }) + cis();
      if (o.wait) { s += bipK(gx - 30, gy + 4, t, { k: .7, tx: 32, ty: -6 }) + F.waitBox(372, 40, 216, 262, t('s4_hidden')); return s; }
      s += kdelR(rx, ry, 1) + lab(rx - 26, ry - 26, t('s4_t2c_kdelr'), { a: 'r' }) + lead(rx - 24, ry - 21, rx - 8, ry - 12);

        s += F.arrow(rx, cy2 - coatOut(R2) - 2, rx, y0 + MH / 2 + 4, C.ink, 2.2) + lab(rx - 50, cy2, t('s4_t2c_copi'), { a: 'r' });

  /* ---------- практикум, панель «Случаи А–Г»: исходы OC.b2 и этапы Э2.1–Э2.5 (o.stg) ---------- */
  function b2(cas, tt, o, t) {
    const y0 = 190, xs = 60, xc = 175, xe = 315, b = budGeo(y0, 455, 34), vx = 455, vy = 348, u = 5, st = u * 1.3;
    const LET = { soluble_ok: 'A', complex_both: 'B', partner_absent: 'V', slow_variant: 'G' }[cas];
    const R = OC.b2(cas, tt), stg = o.stg == null ? null : o.stg, fin = stg == null;

    s += erMem(y0, b, gps) + budCoat(b, 'copii');

    if (o.wait) { s += F.waitBox(96, 48, 494, 352, t('s4_hidden')); return s; }
    s += lab(xc - 18, y0 - 22, t('s4_t2b_cnx'), { a: 'r' }) + lab(b.c, y0 - 18, t('s4_t2c_eres')) + lab(590, 272, t('s4_t2c_copii'), { a: 'r' });
    s += lab(xe - 20, y0 + 30, t('s4_r_erad_chan'), { a: 'r' });

       стебель к ТМ-сегменту в бислое (xta) и C-хвост в цитозоле; fold — α уже свёрнута (случай В, поздняя точка: «свернулась
       правильно», задержана калнексином и BiP — BiP у свободной поверхности, где связался бы β) */
    const atCnx = (sub, fold) => {
      const dom = gly(xc + st, ya, 1, { glc: 1, u }) + (fold ? fprot(xc + st + 4, ya - 13, 13) : uprot([[xc - 50, ya - 8], [xc - 18, ya + 4], [xc + st, ya], [xc + 40, ya - 16], [xc + 76, ya - 4]]));
      const stalk = fold ? [[xc + st + 16, ya - 4], [xc + 52, ya + 22], [xta - 2, ya + 44]] : [[xc + 76, ya - 4], [xta - 6, ya + 22], [xta, ya + 48]];
      const bx = fold ? xc + st + 34 : xc + 50, by = fold ? ya - 16 : ya - 10;
      return (sub ? subER('a', xta, y0, stalk, dom) : dom) + F.bip(bx, by, .85) + lab(bx, by - 24, t('s4_t2a_bip')) +
        (sub ? lab(fold ? xc + st - 16 : xc - 58, fold ? ya - 13 : ya - 10, t('t2_lbl_a'), { w: 700, size: 13, a: 'r' }) : '') + lab(xc - 4, ya + 30, t('t2_lbl_glycan'), { a: 'r' }); };
    /* β (случай Б, ранняя точка и Э2.3): своя цепь с гликаном и BiP в просвете, ТМ-сегмент β — в бислое (xtb), хвост — в цитозоле */
    const beta = () => { const yb = 106;
      return subER('b', xtb, y0, [[372, yb], [364, yb + 34], [xtb, yb + 56]], uprot([[372, yb], [392, yb + 8], [412, yb], [432, yb + 8], [452, yb - 2]]) + gly(412, yb, -1, { glc: 1, u: 4.5 })) +
        F.bip(444, yb - 4, .8) + lab(480, yb + 2, t('t2_lbl_b'), { w: 700, size: 13, a: 'l' }); };
    /* удаление: цепь без гликана выходит через канал в цитозоль, убиквитин, протеасома (в цитозоле) */
    const removal = () => { const yb = y0 + 112;
      return uprot([[xe + 26, y0 - 40], [xe + 6, y0 - 26], [xe, y0 - 8], [xe, y0 + 24], [xe + 14, y0 + 52], [xe - 4, y0 + 76], [xe, yb - 32]]) + F.bip(xe + 26, y0 - 44, .7) +
        F.ub(xe + 16, y0 + 56, 4, 7) + lab(xe - 14, y0 + 62, t('s4_r_erad_ub'), { a: 'r' }) + prot2(xe, yb) + lab(xe - 26, yb + 6, t('s4_r_erad_prot'), { a: 'r' }); };
    /* носитель COP-II: растворимый груз — внутри; комплекс αβ — в мембране носителя (домены внутрь, хвосты к оболочке; И-03) */
    const carrierOut = kind => ves(vx, vy, 34, 'copii', kind === 'pair' ? pairRing(vx, vy, 34, 270) : cargoIn(vx, vy - 14, kind)) + F.larrow(vx + coatOut(34) + 2, vy + 4, 592, vy + 4, '', C.ink, { w: 2.4 }) + lab(590, 410, t('s4_t2c_golgi'), { a: 'r' });
    if (stg === 0 || stg === 1 || stg === 2) {
      /* Э2.1–Э2.2: цепь выходит из Sec61; олигосахарид из 14 сахаров на аспарагине; BiP и PDI (этап 2) */
      const r = F.ribosome(xs, y0 + 48.5), yy = ya - 20;
      s += F.mrna(10, 110, r.mrnaY) + r.s;

        const xn = 112;

        s += lab(xn + 26, yy + 44, t('t2_lbl_glycan'), { a: 'l' });
        if (stg === 2) s += F.bip(190, yy - 8, .85) + lab(190, yy - 32, t('s4_t2a_bip')) + cys(230, yy - 14) + cys(266, yy - 4) + pdiL(248, yy - 36) + lab(284, yy - 42, t('s4_t2a_pdi'), { a: 'l' });
        if (stg === 2 && rec) s += tmSeg(xs + 2, y0, true);   /* ТМ-сегмент α в канале Sec61 (хвост ещё в рибосоме) */
      } else s += uprot([[xs, y0 - 15], [xs, y0 - 34]]);

    if (cas === 'soluble_ok') s += carrierOut('sol');
    else if (cas === 'complex_both') s += carrierOut('pair') + lab(vx - 64, vy - 42, t('s4_t2c_ab'), { a: 'r' }) + lead(vx - 62, vy - 37, vx - 10, vy - 16);
    else if (cas === 'partner_absent') { s += atCnx(true, true) + lab(380, 52, t('s4_t2c_wait'), { a: 'l', col: C.bad, w: 700 }) + removal(); }
    else { s += carrierOut('sol'); if (stg === 4) s += atCnx(false); else s += removal() + F.tag(500, 52, t('t2_share'), C.muted); }

  }
  GN.s4_t2c = { view(args, t) { const [m, ...rest] = args; if (m === 'b2') return b2(rest[0], rest[1], rest[2] || {}, t); return t2c(m, rest[0] || {}, t); } };

  GN.s4_r_erad = { view(args, t) {

})();

   GN.s4_t3b.view([cargo, k, o]) — карта клетки: плазматическая мембрана (снаружи — сверху, цитозоль — снизу), транс-сеть,
     эндосома, лизосома. cargo: 'A' — катепсин D (рецептор M6P), 'B' — молекулы, прошедшие мимо рецепторов (обход через
     поверхность), 'C' — мембранный белок лизосомы (без M6P). k: 0 — весь путь одним кадром (статика); 1…5 — звенья цикла
     рецептора (·18; для B — 1 уход конститутивным путём, 2 захват на поверхности; для C — 1 адаптер и носитель);
     −1 — исходный кадр (до начала; до ответа). o.acid === false — эндосома не закисляется (обратная задача, OC.b3(…, false));
     o.hideCause — в обратной задаче до ответа не подписаны причина и следствие модели.

   Правила (10, разд. 0; общее задание): мембраны — бислой BF; просвет компартментов и носителей — внутри, внеклеточная
   сторона — над плазматической мембраной; рецептор M6P связывает метку в просвете (чаша — в просвете, хвост — в цитозоле);
   клатрин и ретромер — снаружи носителей, на цитозольной стороне; мембранный белок лизосомы сохраняет ориентацию (домен —
   в просвете, хвост с сигналом — в цитозоле) в транс-сети, носителе, эндосоме и лизосоме; формул нет — условные знаки
   S4F.glycan; рецептор M6P в лизосому не переходит. Элементы в повёрнутых группах — только rect/path/circle (без <line> и
   <text>): знак «P» и гидролаза рисуются вне поворота, в пересчитанной точке.
   Новые детали (локальные; кандидаты в S4F): rec — рецептор M6P под любым углом, с гидролазой в чаше; lmp — мембранный белок
   лизосомы с хвостом и адаптером; coat — оболочка из точек вплотную к бислою; ptr, enz2 — ферменты метки; glyStage — гликан
   по цистернам.

(function () {
  const F = S4F, C = F.C, f = F.f, MH = F.MH, G = F.G;
  const K = { rec: '#9A5A12', ptr: '#3D7EA6', ptrD: '#22597A', enz2: '#6E8B2E', enz2D: '#4B6320', patch: '#F2C230', lmp: '#556B2F', adapt: '#2E9B57', tip: '#15202B' };
  const LS = 12;
  const lab = (t, x, y, k, o = {}) => F.T(x, y, t(k), Object.assign({ size: LS, w: 600 }, o));
  const name = (t, x, y, k, o = {}) => F.T(x, y, t(k), Object.assign({ size: 12.5, w: 700, col: '#3E4A5A' }, o));
  /* поворот вокруг точки мембраны: локальное «вверх» (−y) → направление в просвет */
  const rotG = (x, y, th, k, s) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(th)}) scale(${k}) translate(${f(-x)} ${f(-y)})">${s}</g>`;
  const at = (x, y, th, k, d) => { const a = th * Math.PI / 180; return [x + k * d * Math.sin(a), y - k * d * Math.cos(a)]; };
  /* угол, при котором «вверх» смотрит по вектору (nx, ny) */
  const thOf = (nx, ny) => Math.atan2(nx, -ny) * 180 / Math.PI;

  /* ---------- рецептор M6P: ТМ-сегмент в бислое, короткий хвост в цитозоле, чаша в просвете; o.hyd — связанная гидролаза
     с меткой (o.tag !== false — «P» в чаше); o.k — масштаб; o.dash — штриховой (рецептора нет / звено выключено) */
  function rec(x, y, th = 0, o = {}) {
    const k = o.k || 1, col = o.dash ? C.grey : K.rec, y1 = y - MH / 2 - 3, cupB = y1 - 6;
    let s = `<rect x="${f(x - 3.5)}" y="${f(y1)}" width="7" height="${f(MH + 11)}" rx="3" fill="${o.dash ? 'none' : col}"${o.dash ? ` stroke="${col}" stroke-dasharray="3 2"` : ''}/>` +
      `<path d="M${f(x)},${f(y1)} L${f(x)},${f(cupB)}" fill="none" stroke="${col}" stroke-width="3"/>` +
      `<path d="M${f(x - 9)},${f(cupB - 7)} L${f(x - 9)},${f(cupB - 2)} Q${f(x)},${f(cupB + 5)} ${f(x + 9)},${f(cupB - 2)} L${f(x + 9)},${f(cupB - 7)}" fill="none" stroke="${col}" stroke-width="3.6" stroke-linecap="round"${o.dash ? ' stroke-dasharray="3 2"' : ''}/>`;
    let out = rotG(x, y, th, k, G('m6pr', s));
    if (o.hyd) { const [hx, hy] = at(x, y, th, k, 30.5), [px, py] = at(x, y, th, k, 21);
      out += F.hydrolase(hx, hy, { r: 6.5 * Math.max(.8, k) }) + (o.tag !== false ? G('m6p', F.pmark(px, py, 6)) : ''); }
    return out;

  /* свободная гидролаза: tag — метка M6P (знак «P»), без tag — фосфат снят */
  const hyd = (x, y, tag, r = 6.5) => F.hydrolase(x, y, { tag, r });
  /* мембранный белок лизосомы: домен в просвете (вверх), хвост с сигналом в цитозоле; o.adapt — адаптер связал хвост */
  function lmp(x, y, th = 0, o = {}) {
    const k = o.k || 1, y1 = y - MH / 2 - 3, y2 = y + MH / 2 + 3;
    let s = `<rect x="${f(x - 3.5)}" y="${f(y1)}" width="7" height="${f(MH + 6)}" rx="3" fill="${K.lmp}"/>` +
      `<path d="M${f(x)},${f(y1)} L${f(x)},${f(y1 - 5)}" fill="none" stroke="${K.lmp}" stroke-width="3"/>` +
      `<ellipse cx="${f(x)}" cy="${f(y1 - 13)}" rx="10" ry="8.5" fill="${K.lmp}"/>` +
      `<path d="M${f(x)},${f(y2)} Q${f(x + 6)},${f(y2 + 6)} ${f(x + 1)},${f(y2 + 12)}" fill="none" stroke="${K.lmp}" stroke-width="3" stroke-linecap="round"/>` +
      `<rect x="${f(x - 2)}" y="${f(y2 + 10)}" width="6" height="5" rx="1.5" fill="${K.tip}"/>`;
    let g = G('mcargo', s);
    if (o.adapt) g += `<rect x="${f(x - 8)}" y="${f(y2 + 15)}" width="18" height="7" rx="3.5" fill="${K.adapt}"/>`;
    return rotG(x, y, th, k, g);
  }
  /* оболочка носителя (клатрин, ретромер) — точки вплотную к наружному слою, на цитозольной стороне */
  function coat(cx, cy, R, col, g) {
    const out = R + MH / 2 + 7, n = Math.max(10, Math.round(2 * Math.PI * out / 10));
    return G(g, Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI; return `<circle cx="${f(cx + out * Math.cos(a))}" cy="${f(cy + out * Math.sin(a))}" r="3.4" fill="${col}"/>`; }).join(''));
  }
  const ves = (cx, cy, R, g, inner = '') => G(g, F.closedMem(F.circlePts(cx, cy, R), C.lumen)) + inner;
  const ellPts = (cx, cy, rx, ry, n = 72) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);
  /* точка на эллипсе под углом a (градусы) и поворот «вверх → внутрь» */
  function onEll(cx, cy, rx, ry, a) { const r = a * Math.PI / 180, x = cx + rx * Math.cos(r), y = cy + ry * Math.sin(r);
    let nx = -(x - cx) / (rx * rx), ny = -(y - cy) / (ry * ry); const n = Math.hypot(nx, ny); return [x, y, thOf(nx / n, ny / n)]; }

  /* =====================================================================
     GN.s4_t3a — аппарат Гольджи: стопка цистерн (·16) и постановка метки M6P крупным планом (·17)
     ===================================================================== */
  /* гликан груза по этапам пути (условные знаки; без формул): 0 — ЭПР (маннозы), 1 — цис-сеть (часть ● отщеплена),

  function glyStage(x, y, st, u = 6) {

    s += F.sq(x, Y(1), u) + F.sq(x, Y(2), u) + F.ci(x, Y(3), u) + F.ci(x - s1, Y(4), u) + F.ci(x + s1, Y(4), u);
    if (st === 0) s += F.line(x - s1, Y(4), x - s1, Y(6), '#555', 1.1) + F.line(x + s1, Y(4), x + s1, Y(5), '#555', 1.1) + F.ci(x - s1, Y(5), u) + F.ci(x - s1, Y(6), u) + F.ci(x + s1, Y(5), u);
    if (st >= 2) s += F.line(x - s1, Y(4), x - s1, Y(5), '#555', 1.1) + F.line(x + s1, Y(4), x + s1, Y(5), '#555', 1.1) + F.sq(x - s1, Y(5), u, '#6B8E23') + F.sq(x + s1, Y(5), u, '#6B8E23');
    if (st >= 3) s += F.line(x - s1, Y(5), x - s1, Y(6), '#555', 1.1) + F.line(x + s1, Y(5), x + s1, Y(6), '#555', 1.1) + F.ci(x - s1, Y(6), u * .95, '#E8B4C8') + F.ci(x + s1, Y(6), u * .95, '#E8B4C8');

     COP-I — под стопкой, обратные стрелки (справа налево); груз и его гликан — внутри каждого компартмента */
  const STK = { y0: 92, y1: 270, w: 50, cols: [['cis', 170], ['med', 256], ['trans', 348], ['tgn', 444]], er: 44, erw: 40 };
  function stack(t, o) {

    s += name(t, STK.er, 44, 's4_t3a_er');
    STK.cols.forEach(([k, x]) => {

      s += name(t, x, 44, 's4_t3a_' + k, { n: 10, vc: true, size: 12 });
    });

    const tx = STK.cols[3][1] + STK.w / 2 + 30;
    [ym - 40, ym + 30].forEach(y => { s += G('trans', F.closedMem(F.circlePts(tx, y, 9), C.lumen)); });
    /* путь груза: от ЭПР к транс-сети (над стопкой) */
    s += F.arrow(STK.er - 10, 74, tx + 24, 74, C.chain, 3);
    /* груз (растворимый белок) и его гликан в каждом компартменте */
    [[STK.er, 0], ...STK.cols.map(([k, x], i) => [x, Math.min(3, i + 1)])].forEach(([x, st]) => {
      s += F.solProt(x, ym + 44, C.sec, 6);
      if (gly) s += glyStage(x, ym + 36, st, 5.2);
    });
    /* COP-II: ЭПР → цис-сеть */
    const cx2 = (STK.er + STK.erw / 2 + STK.cols[0][1] - STK.w / 2) / 2;
    [ym - 34, ym + 34].forEach(y => { s += G('copii', ves(cx2, y, 8, 'copii', F.solProt(cx2, y, C.sec, 3)) + coat(cx2, y, 8, C.copii, 'copii')); });
    s += F.arrow(cx2 - 10, ym, cx2 + 18, ym, C.copii, 2.4);
    s += lab(t, cx2, STK.y0 + 12, 's4_t3a_copii', { col: '#1E6B3C', w: 700 });
    /* COP-I: из транс-цистерны в медиальную и из цис-сети в ЭПР (под стопкой, справа налево) */
    const copiV = (x, y) => G('copi', ves(x, y, 8, 'copi') + coat(x, y, 8, C.copi, 'copi'));
    const yb = STK.y1 + 12, yv = STK.y1 + 42;
    [[STK.cols[2][1], STK.cols[1][1]], [STK.cols[0][1], STK.er]].forEach(([xa, xb]) => {
      const xm = (xa + xb) / 2; s += F.carrow(xa - 6, yb, xm + 24, yv, -.25, C.copi, 2.2) + copiV(xm, yv) + F.carrow(xm - 24, yv, xb + 6, yb + 2, -.25, C.copi, 2.2);
    });
    s += lab(t, (STK.cols[2][1] + STK.cols[1][1]) / 2, yv + 40, 's4_t3a_copi', { col: '#7A5A00', w: 700 });
    s += lab(t, (STK.cols[0][1] + STK.er) / 2 + 6, yv + 46, 's4_t3a_ret', { n: 18, vc: true, col: '#7A5A00', size: 11.5 });
    if (gly) s += lab(t, 590, 14, 's4_t3a_glyc', { a: 'r', w: 700 });
    s += F.T(590, 408, t('s4_t3a_nomech'), { a: 'r', size: 10.5, col: C.muted, it: true });
    s += G('cyto', F.T(10, 408, t('lbl_cytosol'), { a: 'l', size: 12, w: 700, col: '#8A7344', it: true }));
    return s;
  }
  /* фермент метки (фосфотрансфераза): белок мембраны (ТМ в бислое у x), тело в просвете с участком узнавания (слева)
     и каталитическим «плечом» к маннозе гликана гидролазы; bound — связан с гидролазой */
  const MY = 362;   /* мембрана крупного плана */
  function ptr(x, bound, armTo) {
    const by = 246, bx = x - 4;
    let s = `<rect x="${f(x - 4)}" y="${f(MY - MH / 2 - 3)}" width="8" height="${f(MH + 6)}" rx="3" fill="${K.ptr}"/>` +
      `<path d="M${f(x)},${f(MY - MH / 2 - 3)} L${f(x)},${f(by + 34)}" fill="none" stroke="${K.ptr}" stroke-width="4"/>` +
      `<ellipse cx="${f(bx)}" cy="${f(by)}" rx="26" ry="36" fill="${K.ptr}" stroke="${K.ptrD}" stroke-width="1.4"/>` +
      /* участок узнавания — выемка слева */
      `<path d="M${f(bx - 26)},${f(by - 2)} q-9,10 0,22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
    if (armTo) { const [ax, ay] = armTo;
      s += `<path d="M${f(bx - 12)},${f(by - 30)} Q${f((bx + ax) / 2)},${f(ay - 18)} ${f(ax + 6)},${f(ay - 4)}" fill="none" stroke="${K.ptr}" stroke-width="7" stroke-linecap="round"/>` +
        `<path d="M${f(ax - 2)},${f(ay - 10)} q8,-2 12,8" fill="none" stroke="${K.ptrD}" stroke-width="2.4" stroke-linecap="round"/>`; }
    else s += `<path d="M${f(bx - 10)},${f(by - 32)} q-6,-14 4,-20" fill="none" stroke="${K.ptr}" stroke-width="7" stroke-linecap="round"/>`;
    return G('tagenz', s);
  }
  /* второй фермент (транс-сеть) — белок мембраны с активным центром у метки */
  function enz2(x, ax, ay) {
    const by = 250;
    let s = `<rect x="${f(x - 4)}" y="${f(MY - MH / 2 - 3)}" width="8" height="${f(MH + 6)}" rx="3" fill="${K.enz2}"/>` +
      `<path d="M${f(x)},${f(MY - MH / 2 - 3)} L${f(x)},${f(by + 26)}" fill="none" stroke="${K.enz2}" stroke-width="4"/>` +
      `<rect x="${f(x - 22)}" y="${f(by - 26)}" width="44" height="52" rx="16" fill="${K.enz2}" stroke="${K.enz2D}" stroke-width="1.4"/>` +
      `<path d="M${f(x - 14)},${f(by - 24)} Q${f((x + ax) / 2)},${f(ay - 10)} ${f(ax + 8)},${f(ay)}" fill="none" stroke="${K.enz2}" stroke-width="6.5" stroke-linecap="round"/>`;

    s += F.memH(0, 600, MY, [], tgn ? 'trans' : 'cis');

  /* =====================================================================
     GN.s4_t3b — путь груза от транс-сети: рецептор M6P, эндосома, лизосома, поверхность клетки (·18, ·19; практикум, панель Б)

  const PMY = 46;                                           /* плазматическая мембрана */
  const TG = { x: 20, y: 130, w: 250, h: 92 };              /* транс-сеть */
  const TGB = TG.y + TG.h;                                  /* нижняя мембрана транс-сети */
  const EN = { cx: 372, cy: 330, rx: 78, ry: 54 };          /* эндосома */
