<html lang="ru">
<head>

<title>Семинар 16 · Эволюция человека и эволюционная медицина: от ископаемых и геномов к отбору в организме</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.qcol{color:var(--muted);font-size:13.5px;margin:2px 0 0;max-width:90ch;flex-basis:100%;order:9}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий «предскажите и проверьте» */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
/* v1.1.6: варианты итогового вопроса (блок .intbox) — тот же вид, что у вариантов шагов (прежде были кнопки браузера без стиля) */
.poe .opts,.intbox .opts{display:grid;gap:6px}
.poe .opt,.intbox .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L,.intbox .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked,.intbox .opt.picked{border-color:var(--ink)}
.poe .opt.right,.intbox .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick,.intbox .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex,.intbox .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled,.intbox .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}

.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}

#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */

  .stage.zoomed svg{width:760px}

}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}

.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}

.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}

.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */
.veil{display:none}

.casemode .stage .tl,.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}

.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}

.ch{margin:12px 0 6px;font-weight:700;font-size:14px}
.cm,.cc{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}

.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}

.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */

.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}
.rxtrack input{position:relative;z-index:1;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}
.mcond p{margin:0;font-size:14.5px}
.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (ограничение 07, разд. 4; R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.poe .hint{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface)}
.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.amapgrid svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.amapq{margin-top:12px}.amapq .opts{display:grid;gap:6px}.amapq .opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.amapq .opt.right{border-color:#2E9B57;background:#EEF8F1}.amapq .opt.wrongpick{border-color:#C0392B;background:#FBECEA}.amapq .opt .L{font-weight:700}
@media (max-width:700px){.amapgrid{grid-template-columns:minmax(0,1fr)}}

/* ---- семинар 8, интерактив (Claude Code, 12.11.2026): из семинара 7 v1.5 ---- */
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}
.tlrow:has(.tlstep) .tlchips{flex-wrap:wrap}
.tlrow:has(.tlstep) .tlplay{min-width:0}
@media (max-width:1000px){.tlrow:has(.tlstep) .tlchips{flex-basis:100%}}   /* рецензия v1.4, п. 9: на компьютере ряд шкалы в одну строку — схема крупнее */
.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}
.scene.predict .panel.cap::before,.scene.predict .panel.reads::before{content:attr(data-predict);display:block;font-weight:600;color:var(--ink)}
.scene.predict .panel.cap,.scene.predict .panel.reads{position:relative}
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}

.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}
.scene.predict .tlr{--stop:100% !important}
.scene.predict .tlc.no{cursor:pointer}   /* v1.2 (рецензия И-15) */

/* v1.2.1 (аудит S9-06, рецензия И-03): телефон — ключевые числа 2а/3а текущего кадра строкой под схемой, без прокрутки увеличенной схемы.
   Скрыта до ответа в сценарии (poehide), в «Найти причину» до решения и до запуска шкалы (predict); на широком экране не нужна. */
.mstrip{display:none}

  .mstrip b{font-variant-numeric:tabular-nums} .mstrip .mh{width:100%;font-size:12.5px;color:var(--muted,#5B6B7F)} }
.poehide .mstrip,.predict .mstrip,.casemode:not(.casedone) .mstrip{visibility:hidden}

header .ttl{min-width:0}

.aprob p{margin:6px 0 0}
.take.none{display:none!important}
.scene .fewrap{grid-column:1/-1;margin-top:10px}
.fepanels{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fepanels svg{flex:1 1 280px;max-width:420px;background:var(--surface);border-radius:10px}
.fecap{font-size:15.5px;border-left:4px solid var(--mtor);padding-left:10px}

.reads.s1wait > *{visibility:hidden}

details.allx{margin-top:8px}details.allx summary{cursor:pointer;color:var(--mtor);font-weight:600}
details.allx li{margin:4px 0}details.allx li.okx b{color:var(--good)}
.exstep{border-left:3px solid var(--mtor);padding-left:8px}
/* семинар 1: итоговая задача */
.intbox h2{margin:0 0 6px;font-size:20px}
.intgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.intgrid{grid-template-columns:1fr}}
.intstage svg{width:100%;height:auto;display:block}
.intsteps{padding-left:20px}.intsteps li{margin:8px 0}
.intc{display:flex;gap:6px;align-items:flex-start;margin:3px 0;font-size:14px}
.intfb.ok{color:var(--good);font-weight:600}.intfb.bad{color:var(--bad);font-weight:600}
.inttab{border-collapse:collapse;margin:6px 0;font-size:14px}.inttab td,.inttab th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.intnote{width:100%;font:inherit}
#intBox select{max-width:100%}
.panel.pre p{margin:6px 0}.panel.pre ul.rules,.panel.pre ol.rules{margin:6px 0}
#intBox .grp > span{margin-right:10px}   /* v1.2 (Н-25): метка «Ситуация» не вплотную к списку */

/* С2: схемы карточек методов в блоке «Как это установили» (11, разд. Г) */
.advx svg.mfig{display:block;width:100%;max-width:600px;height:auto;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:8px}
/* семинар 5: итоговая задача — схема «условие — ресурс — поток» уменьшена; наблюдения продвинутого уровня */
.intbox .finsvg{display:block;width:100%;max-width:520px;margin:10px auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.intbox .fincases{margin:8px 0}
.obsitem{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.obsitem:first-child{border-top:0;margin-top:0;padding-top:0}
.caselink{margin-top:8px}

/* пакет 4 (20.11.2026): окно «О модели» — patches/p4_model_dialog.md, п. 3 */
#modelDlg{max-height:85vh;overflow:auto}
.model-body .model-status::first-letter{text-transform:uppercase}
.model-body{font-size:15px;line-height:1.5}
.model-body .model-status{color:var(--muted);margin:0 0 6px}
.model-body h4{margin:14px 0 6px;font-size:15px}
.model-body p{margin:0 0 8px}
.model-body ul{margin:0 0 8px;padding-left:20px}
@media (max-width:600px){#modelDlg{max-width:calc(100vw - 24px);padding:14px}}
/* пакет 4: строка статуса модели и строка «схема сравнивает состояния» — под схемой (как в С3, С7); в режиме «Найти причину» до решения скрыты */
.stnote{margin:0;padding:3px 12px 6px;font-size:12px;line-height:1.35;color:var(--muted)}
.tl:not([hidden]) + .stnote{padding-top:0}
.casemode:not(.casedone) .stnote{display:none}
/* пакет 4: место под строки статуса; без шкалы этапов схема занимает освободившуюся высоту (рисунки С5 вкладка 2, С6 вкладки 3, 4) */
.stage:has(.stnote):has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 176px)}
.stage:has(.stnote):has(.tl[hidden]):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 66px)}
/* пакет 4: «Наблюдения на модели» продвинутого уровня — в тексте вывода модели (под показаниями), в состоянии наблюдения */
.obsout{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
/* сведение пакета 4 (20.11.2026): длинная плашка показания переносится внутри строки, а не уходит за край колонки и не закрывает подпись */
@media (min-width:701px){.read:has(> .pill){grid-template-columns:max-content minmax(0,1fr)}.read > .pill{white-space:normal;justify-self:end;text-align:right}}

/* пакет 7 (20.11.2026): ссылка на раздел — отдельной строкой под переходом между семинарами */
.semnav .sn-sec{grid-column:1/-1;text-align:center}

/* пакет 5 (20.11.2026): телефон — подписи < 7 px скрыты до увеличения; ширина увеличенной схемы — по самой мелкой подписи (≥ 11 px) */
@media (max-width:700px), (max-height:500px){
  .stage.zoomed svg{width:var(--p5w,760px)!important}
}

/* С13: подписи засечек под бегунком (продвинутый уровень: значения только в засечках) */
.tickrow{display:flex;justify-content:space-between;gap:8px;margin-top:2px;font-size:13px;line-height:1.25;color:var(--muted)}
.tickrow span{flex:1 1 0;text-align:center}.tickrow span:first-child{text-align:left}.tickrow span:last-child{text-align:right}

/* С13, итоговая задача: увеличение схемы на телефоне (рецензия И-15) */
@media (max-width:700px), (max-height:500px){
  .finz.zoomed{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .finz.zoomed svg{width:760px;max-width:none}
}
/* семинар 16: карточка интервала шкалы времени (рядом со схемой) и список номеров интервалов на телефоне (07, разд. 0, п. 2; AT-07) */
.tlcbox{margin:0 0 10px}
.tlcardh{background:var(--panel,#fff);border:1px solid var(--line,#D3DAE3);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.tllist{margin:4px 12px 8px;padding-left:22px;columns:2;column-gap:18px;font-size:12px;line-height:1.35;color:var(--ink,#15202B)}
@media (max-width:480px){.tllist{columns:1}}

/* 3.0.2 (21.11.2026): телефон — как в «Молекулярной биологии»: подписи не скрываются; схема открывается увеличенной;
   «Показать схему целиком» вписывает её во всю ширину экрана (ограничение высотой окна — только для компьютера и проектора) */
@media (max-width:700px){#scenes .stage:not(.zoomed) svg{max-height:none!important}}
</style>

дков: сходные признаки могли возникнуть в разных линиях", "t1_how": "Возраст находок в Восточной Африке определяют по вулканическим туфам выше и ниже них аргоновым методом и по записанным в породах сменам магнитного поля; в пещерах — по натёкам уран-свинцовым и уран-ториевым методами; для последних десятков тысяч лет — радиоуглеродным методом и по свету, накопленному зёрнами минералов. Родство поздних линий установлено по древней ДНК и белкам", "t1_s1_title": "Что означает отрезок на шкале", "t1_s1_cond": "На шкале отрезок Paranthropus boisei — от 2,3 до 1,3 млн лет назад", "t1_s1_q": "Что означает этот отрезок?", "t1_s1_o1": "Интервал известных находок этой формы", "t1_s1_x1": "Да: первая и последняя находки не совпадают с появлением и исчезновением линии", "t1_s1_o2": "Время существования вида от начала до конца", "t1_s1_x2": "Линия могла появиться раньше первой находки и исчезнуть позже последней", "t1_s1_o3": "Возраст одной особи, жившей очень долго", "t1_s1_x3": "Отрезок объединяет многие находки разного возраста", "t1_s1_h1": "Откуда известны концы отрезка?", "t1_s1_h2": "Найдена ли самая первая особь вида?", "t1_s1_h3": "Концы отрезка — первая и последняя известные находки", "t1_s1_e": "Отрезок на шкале — интервал находок. Чем больше находок и чем лучше датированы слои, тем шире он может стать; новые находки сдвигают концы", "t1_s2_title": "Сколько форм жило одновременно", "t1_s2_cond": "Проведите вертикальную линию на шкале на отметке 2,0 млн лет назад", "t1_s2_q": "Что показывает шкала на этой отметке?", "t1_s2_o1": "Несколько форм гоминин существовали одновременно", "t1_s2_x1": "Да: на этой отметке пересекаются четыре отрезка — двух парантропов и двух видов раннего Homo", "t1_s2_o2": "Одна форма сменила другую на этой отметке", "t1_s2_x2": "Отрезки перекрываются: формы жили в одно время", "t1_s2_o3": "На этой отметке гоминин не было", "t1_s2_x3": "Отрезки нескольких форм проходят через эту отметку", "t1_s2_h1": "Сколько отрезков пересекает линию?", "t1_s2_h2": "Каким группам они принадлежат?", "t1_s2_h3": "Перекрывание отрезков — сосуществование форм", "t1_s2_e": "История гоминин ветвилась: несколько линий существовали одновременно, а не сменяли друг друга по ступеням. Какие из них оставили потомков, по шкале не видно", "t1_s3_title": "Конструктор: убрать датирование", "t1_s3_cond": "Выключите линию данных «датирование». Ископаемые, орудия, древние ДНК и белки остаются", "t1_s3_q": "Какой вывод перестаёт быть допустимым?", "t1_s3_o1": "Несколько линий гоминин существовали одновременно", "t1_s3_x1": "Да: без датировок нельзя сказать, что находки одного времени", "t1_s3_o2": "Неандертальцы и денисовцы — сестринские линии", "t1_s3_x2": "Этот вывод опирается на геномы; датирование слоёв ему не нужно", "t1_s3_o3": "Орудия и останки гоминин найдены в одном слое", "t1_s3_x3": "Для этого нужны орудия и останки, а не датировки", "t1_s3_h1": "Что даёт датирование?", "t1_s3_h2": "Каким выводам нужен возраст находок?", "t1_s3_h3": "Сосуществование — утверждение о времени", "t1_s3_e": "Вывод допустим, только если есть все нужные ему линии. Без датирования недопустимы выводы о сосуществовании, о порядке появления признаков, о возрасте орудий и о времени ранних Homo sapiens", "t1_s4_title": "Изменение условий задачи: убрать древние ДНК и белки", "t1_s4_cond": "Включите датирование обратно и выключите «древние ДНК и белки»", "t1_s4_q": "Какой вывод теперь недопустим?", "t1_s4_o1": "Предки неафриканцев смешивались с неандертальцами", "t1_s4_x1": "Да: смешение видно только по геномам", "t1_s4_o2": "Каменные орудия старше древнейших находок Homo", "t1_s4_x2": "Для этого нужны орудия, ископаемые и датировки, а не молекулы", "t1_s4_o3": "Двуногость появилась задолго до увеличения мозга", "t1_s4_x3": "Это вывод по ископаемым и датировкам", "t1_s4_h1": "Какие выводы говорят о родстве и смешении?", "t1_s4_h2": "По каким данным видно смешение?", "t1_s4_h3": "Смешение оставляет след в геномах", "t1_s4_e": "Молекулярные данные отвечают на вопросы о родстве и смешении поздних линий. Без них о денисовцах почти ничего не известно: линию выделили по ДНК", "t1_s5_title": "Мозаика признаков", "t1_s5_cond": "Таблица: двуногость, признаки лазания и небольшой мозговой отдел у четырёх находок: Sahelanthropus, Orrorin, Ardipithecus ramidus, Australopithecus afarensis", "t1_s5_q": "Что вероятнее всего показывает скелет Ardipithecus ramidus (4,51–4,3 млн лет)?", "t1_s5_o1": "Прямохождение по земле и хорошее лазание", "t1_s5_x1": "Да: в одном скелете признаки разных способов передвижения", "t1_s5_o2": "Двуногость вместе с крупным мозгом", "t1_s5_x2": "Мозг Ardipithecus — размером с мозг шимпанзе", "t1_s5_o3": "Передвижение только по деревьям", "t1_s5_x3": "Скелет указывает и на прямохождение по земле", "t1_s5_h1": "Меняются ли признаки одновременно?", "t1_s5_h2": "Какой признак появился раньше — двуногость или крупный мозг?", "t1_s5_h3": "Мозаичная эволюция — неодновременное изменение признаков", "t1_s5_e": "Признаки двуногости появлялись раньше крупного мозга и сочетались с признаками лазания. Прочерк в таблице у других находок — «нет данных»: нужной части скелета у находки нет", "t1_s6_title": "Орудия и изготовитель", "t1_s6_cond": "Засечка «Орудия Ломекви, 3,3 млн лет» стоит левее отрезка древнейшей находки, отнесённой к Homo (2,80–2,75 млн лет)", "t1_s6_q": "Что из этого следует?", "t1_s6_o1": "Орудия старше известных находок Homo", "t1_s6_x1": "Да: изготовитель неизвестен; линия Homo могла появиться раньше своей первой находки", "t1_s6_o2": "Род Homo появился 3,3 млн лет назад", "t1_s6_x2": "Возраст орудий не определяет время появления рода", "t1_s6_o3": "Орудия Ломекви датированы неверно", "t1_s6_x3": "Слой датирован по туфам и магнитостратиграфии; противоречия нет", "t1_s6_h1": "Что старше — орудия или находки Homo?", "t1_s6_h2": "Говорят ли орудия, кто их сделал?", "t1_s6_h3": "Индустрия описывает технологию, а не вид", "t1_s6_e": "Каменная индустрия — способ изготовления орудий, а не признак вида. Изготовителя показывают только останки в том же слое; у Ломекви их нет", "t2_title": "Происхождение и смешение", "t2_rules": "Дерево показывает разделения популяций, дуги — потоки генов с направлением. Средняя длина унаследованного при смешении участка L = 100 / t сантиморган, где t — число поколений после смешения: каждое поколение рекомбинация дробит участки. Модель считает, что доля примеси мала, смешение было однократным, а отбор не действует", "t2_lim": "Дерево не показывает численности и всех известных смешений; трубки и дуги условны. Модель длины участков не учитывает отбор против архаичных участков, повторные смешения и различия скорости рекомбинации вдоль хромосом", "t2_how": "Родство поздних линий установили, сравнив геномы неандертальцев, денисовцев и современных людей; время разделения оценили по числу различий с допущениями о скорости мутаций и длительности поколения. Время смешения оценивают по длине общих с архаичным геномом участков у людей, живших в разное время", "t2_s1_title": "Кто кому сестринская линия", "t2_s1_cond": "Дерево популяций: Африка, неафриканцы, неандертальцы, денисовцы; дуги скрыты", "t2_s1_q": "С кем у неандертальцев общий предок ближе всего?", "t2_s1_o1": "С денисовцами", "t2_s1_x1": "Да: их общий узел — 440–390 тыс. лет назад", "t2_s1_o2": "С неафриканскими популяциями", "t2_s1_x2": "Неафриканцы — ветвь Homo sapiens; с ней общий узел глубже, 630–520 тыс. лет назад", "t2_s1_o3": "С африканскими популяциями", "t2_s1_x3": "Это тоже ветвь Homo sapiens; родство читают по общему узлу", "t2_s1_h1": "Найдите узел, где сходятся неандертальцы с другой ветвью", "t2_s1_h2": "Какой узел ближе к кончикам?", "t2_s1_h3": "Родство определяет общий предок", "t2_s1_e": "Неандертальцы и денисовцы — сестринские линии. Даты узлов — оценки моделей, зависящие от скорости мутаций и длительности поколения", "t2_s2_title": "Что показывают дуги", "t2_s2_cond": "Включите дуги обмена", "t2_s2_q": "Как изменилось изображение истории?", "t2_s2_o1": "Дерево стало сетью обменов", "t2_s2_x1": "Да: дуги — потоки генов с направлением", "t2_s2_o2": "На схеме появились новые виды", "t2_s2_x2": "Дуги не добавляют линий: они показывают обмен генами", "t2_s2_o3": "Дерево оказалось полностью неверным", "t2_s2_x3": "Порядок разделений тот же; дуги добавляют смешения", "t2_s2_h1": "Что соединяет каждая дуга?", "t2_s2_h2": "Есть ли у дуги направление?", "t2_s2_h3": "Сеть — дерево с обменом генами", "t2_s2_e": "История популяций человека — сеть: линии разделялись и смешивались. Направление дуги показывает, в чей генофонд попали участки", "t2_s3_title": "Конструктор: длина участков через 100 поколений", "t2_s3_cond": "У гибрида первого поколения одна хромосома пары — целиком от архаичной популяции. Переключатель «Поколений после смешения» — 100", "t2_s3_q": "Какой станет средняя длина архаичного участка?", "t2_s3_o1": "Около 1 сМ: участки раздроблены", "t2_s3_x1": "Да: L = 100 / 100 = 1 сМ", "t2_s3_o2": "Целая хромосома, как у первого гибрида", "t2_s3_x2": "Каждое поколение рекомбинация дробит участки", "t2_s3_o3": "Участки за это время исчезнут полностью", "t2_s3_x3": "Рекомбинация дробит участки, но не удаляет их; частоту меняют дрейф и отбор", "t2_s3_h1": "Что делает рекомбинация в каждом поколении?", "t2_s3_h2": "Формула: L = 100 / t", "t2_s3_h3": "t = 100", "t2_s3_e": "Средняя длина унаследованного участка обратно пропорциональна числу поколений после смешения", "t2_s4_title": "Изменение условий задачи: прошло 2000 поколений", "t2_s4_cond": "Переключатель — 2000 поколений", "t2_s4_q": "Во сколько раз короче станут участки по сравнению со 100 поколениями?", "t2_s4_o1": "В 20 раз", "t2_s4_x1": "Да: L = 100 / 2000 = 0,05 сМ", "t2_s4_o2": "В 2000 раз", "t2_s4_x2": "Длина обратно пропорциональна t: 2000 / 100 = 20", "t2_s4_o3": "Длина не изменится", "t2_s4_x3": "Рекомбинация продолжает дробить участки", "t2_s4_h1": "Сравните 100 и 2000", "t2_s4_h2": "Длина обратно пропорциональна t", "t2_s4_h3": "2000 / 100 = 20", "t2_s4_e": "Именно это свойство позволяет датировать смешение: по средней длине участков находят число поколений, а через длительность поколения — годы", "t2_s5_title": "Доля неандертальского происхождения", "t2_s5_cond": "У современных неафриканцев около 2 % генома отнесено к неандертальскому происхождению (оценка зависит от метода и референсного генома)", "t2_s5_q": "Что верно об этой оценке?", "t2_s5_o1": "Разные люди несут разные архаичные участки", "t2_s5_x1": "Да: суммарно у всех людей участков больше, чем в одном геноме", "t2_s5_o2": "У всех людей одинаковая доля неандертальской ДНК", "t2_s5_x2": "Доля — оценка для выборки; у разных людей она и участки различаются", "t2_s5_o3": "Это доля генов, полученных от неандертальцев целиком", "t2_s5_x3": "Это участки разной длины, а не целые гены по списку", "t2_s5_h1": "Одинаковы ли участки у двух людей?", "t2_s5_h2": "Одна доля — у всех?", "t2_s5_h3": "Оценка зависит от метода и выборки", "t2_s5_e": "Доля в одном геноме не равна неандертальскому вкладу во всё человечество. Геном — не смесь фиксированных процентов «видов»: рекомбинация дробила участки, их частоты менялись, часть утрачена", "t2_s6_title": "Где древнейшие находки Homo sapiens", "t2_s6_cond": "Панель В: засечки «Джебель-Ирхуд, 315 ± 34 тыс. лет» и «Омо I, не моложе 233 ± 22 тыс. лет» — обе в Африке; рядом — разнообразие аллелей одного участка генома в регионах, расположенных по удалённости от Африки", "t2_s6_q": "Что вместе показывают находки и разнообразие?", "t2_s6_o1": "Происхождение вида в Африке", "t2_s6_x1": "Да: древнейшие находки — в Африке, и там наибольшее разнообразие; вне Африки — его часть", "t2_s6_o2": "Происхождение в одной точке и в один момент", "t2_s6_x2": "Находки разных частей Африки с разной мозаикой признаков указывают на длительное формирование", "t2_s6_o3": "Меньшее разнообразие — признак более поздних людей", "t2_s6_x3": "Это след эффекта основателя при расселении, а не свойство людей", "t2_s6_h1": "Где лежат обе засечки?", "t2_s6_h2": "Где разнообразие больше?", "t2_s6_h3": "Вне Африки — часть африканского разнообразия", "t2_s6_e": "Африканское происхождение подтверждают и ископаемые, и геномы. Происхождение не означает одной изолированной популяции: предки были разделены на части, обменивавшиеся генами", "t3_title": "Адаптация: как её доказывают", "t3_rules": "Пять карточек — пять линий доказательств: вариант, связь с признаком, функция, след отбора, историческая среда. Уровень обоснованности — пять делений шкалы со словами: «все линии согласуются»; «отбор показан, связь с признаком и роль гена известны, причина — интерпретация»; «отбор показан, связь варианта с признаком установлена не полностью»; «связь с признаком есть, отбор не показан»; «гипотеза». Без варианта и следа отбора адаптация не показана", "t3_lim": "Уровни — учебное правило, а не статистическая мера. Модель не взвешивает качество каждой линии и не учитывает, что вариант может влиять на несколько признаков, а современный эффект — отличаться от исторического", "t3_how": "След отбора ищут, сравнивая частоты и строение гаплотипов с моделью без отбора, учитывающей историю численности и смешения; связь с признаком — по выборкам людей; функцию — в экспериментах на клетках и животных; историческую среду — по археологии и древней ДНК", "t3_s1_title": "Высокая частота — это доказательство?", "t3_s1_cond": "Вариант встречается у 70 % жителей одной местности и у 5 % соседей (условно). Других данных нет", "t3_s1_q": "Что можно сказать?", "t3_s1_o1": "Адаптация — лишь гипотеза", "t3_s1_x1": "Да: дрейф, эффект основателя и смешение тоже меняют частоты", "t3_s1_o2": "Высокая частота доказывает адаптацию", "t3_s1_x2": "Частота — наблюдение; её причину называют другие линии данных", "t3_s1_o3": "Вариант вреден, раз его почти нет у соседей", "t3_s1_x3": "Редкость у соседей ничего не говорит о вреде", "t3_s1_h1": "Какие процессы меняют частоты?", "t3_s1_h2": "Есть ли здесь след отбора?", "t3_s1_h3": "Одна частота не называет причину", "t3_s1_e": "Высокая частота варианта в определённой среде совместима с дрейфом, эффектом основателя, смешением и отбором. Чтобы говорить об адаптации, нужны вариант, связь с признаком, функция и след отбора", "t3_s2_title": "EPAS1: все пять линий", "t3_s2_cond": "Предустановка «EPAS1»: гаплотип, сходный с денисовским; у носителей производного аллеля ниже гемоглобин на высоте; ген участвует в ответе на гипоксию; самый сильный сигнал отбора у тибетцев; высокогорье", "t3_s2_q": "Каков уровень обоснованности?", "t3_s2_o1": "Высокий: все пять линий есть", "t3_s2_x1": "Да: это пример адаптивной интрогрессии; карточка 3 описывает роль гена, а действие самих вариантов уточняется", "t3_s2_o2": "Гипотеза: действие вариантов не установлено", "t3_s2_x2": "Это ограничение карточки 3; остальные линии есть и согласуются", "t3_s2_o3": "Отбор не показан", "t3_s2_x3": "След отбора — самый сильный у тибетцев", "t3_s2_h1": "Сколько карточек включено?", "t3_s2_h2": "Есть ли след отбора?", "t3_s2_h3": "Все пять линий согласуются", "t3_s2_e": "Архаичное происхождение участка, связь с гемоглобином, роль гена, след отбора и среда высокогорья согласуются. Какие именно изменения в гаплотипе действуют, ещё уточняется", "t3_s3_title": "Конструктор: убрать историческую среду", "t3_s3_cond": "В предустановке «EPAS1» выключите карточку 5", "t3_s3_q": "Что изменится?", "t3_s3_o1": "Причина отбора станет интерпретацией", "t3_s3_x1": "Да: отбор показан, его причина — интерпретация", "t3_s3_o2": "Адаптация будет опровергнута", "t3_s3_x2": "Отсутствие одной линии снижает обоснованность, но не опровергает", "t3_s3_o3": "Уровень обоснованности не изменится", "t3_s3_x3": "Без исторической среды причина отбора остаётся интерпретацией", "t3_s3_h1": "На какой вопрос отвечает карточка 5?", "t3_s3_h2": "Что остаётся без неё?", "t3_s3_h3": "Отбор показан, причина — нет", "t3_s3_e": "Каждая линия отвечает на свой вопрос: среда — при каких условиях вариант был выгоден. Без неё отбор показан, но его историческая причина — интерпретация", "t3_s4_title": "Изменение условий задачи: амилаза", "t3_s4_cond": "Предустановка «амилаза»: структурные гаплотипы с разным числом копий; число копий связано с количеством амилазы в слюне; фермент расщепляет крахмал; в Западной Евразии за 12 тыс. лет частота гаплотипов с дупликациями росла быстрее, чем без отбора; связь с земледелием — интерпретация", "t3_s4_q": "Чем этот случай отличается от EPAS1?", "t3_s4_o1": "Отбор показан, причина — интерпретация", "t3_s4_x1": "Да: тот же уровень, что без карточки 5 у EPAS1", "t3_s4_o2": "Отбор в этом локусе не показан вовсе", "t3_s4_x2": "Рост частоты быстрее, чем без отбора, — след отбора", "t3_s4_o3": "Число копий не влияет на фермент", "t3_s4_x3": "Связь числа копий с количеством амилазы в слюне показана", "t3_s4_h1": "Какая карточка выключена?", "t3_s4_h2": "Что она добавляет?", "t3_s4_h3": "Сравните с шагом 3.3", "t3_s4_e": "Два примера показывают разную полноту доказательств: у EPAS1 согласуются все пять линий, у амилазы отбор показан, а связь с земледелием проверяют датировками", "t3_s5_title": "Конструктор: убрать функциональные данные", "t3_s5_cond": "В предустановке «EPAS1» выключите карточку 3", "t3_s5_q": "Что изменится?", "t3_s5_o1": "Связь с признаком — не полностью", "t3_s5_x1": "Да: отбор показан, связь варианта с признаком установлена не полностью", "t3_s5_o2": "Отбор перестанет быть показанным", "t3_s5_x2": "След отбора остаётся; не хватает механизма", "t3_s5_o3": "Уровень не изменится", "t3_s5_x3": "Без функции неизвестно, каким путём вариант влияет на признак", "t3_s5_h1": "На какой вопрос отвечает функция?", "t3_s5_h2": "Остался ли след отбора?", "t3_s5_h3": "Отбор есть, роль гена — нет", "t3_s5_e": "Функциональные данные показывают, каким путём вариант меняет признак. Без них отбор показан, но через какой признак он действовал, установлено не полностью", "t3_s6_title": "Генно-культурная коэволюция", "t3_s6_cond": "Варианты, сохраняющие синтез лактазы у взрослых: в Европе один, в Восточной Африке три других; африканские возникли на разных гаплотипах", "t3_s6_q": "Что показывает независимое возникновение вариантов?", "t3_s6_o1": "Сходный признак возник независимо", "t3_s6_x1": "Да: это конвергенция; отбор показан отдельно — по протяжённому гаплотипу вокруг варианта", "t3_s6_o2": "Все носители — потомки одной популяции", "t3_s6_x2": "Варианты разного происхождения: это конвергенция", "t3_s6_o3": "Культура передаётся через гены", "t3_s6_x3": "Культура меняет среду отбора, а не передаётся генами", "t3_s6_h1": "Один это вариант или несколько?", "t3_s6_h2": "Что общего у популяций?", "t3_s6_h3": "Культурная практика — среда отбора", "t3_s6_e": "Генно-культурная коэволюция — изменение частот вариантов в среде, созданной культурной практикой. Связь отбора с конкретной практикой проверяют датировками", "t4_title": "Эволюция в медицине", "t4_rules": "Одна формула для трёх масштабов: доля варианта p после t шагов равна p0·r^t / (p0·r^t + 1 − p0), где p0 — исходная доля, r — во сколько раз за шаг вариант размножается успешнее остальных. Единица и шаг различаются: клетки бактерий и поколения; вирусные линии и циклы передачи; клоны опухоли и условные единицы времени. Равновесная частота рецессивного вредного аллеля q = √(μ / s), где μ — скорость мутаций, s — снижение приспособленности гомозигот", "t4_lim": "Модель показывает только доли. Она не описывает лечение, не учитывает концентрации препаратов, пространство, передачу между людьми, иммунный ответ и обратимые состояния клеток. Все параметры условные; препарат и терапия условные", "t4_how": "Изменение состава популяций возбудителей и опухолей прослеживают, сравнивая геномы образцов, взятых в разное время у одного человека или в популяции", "t4_s1_title": "Бактерии под действием препарата", "t4_s1_cond": "Масштаб «бактерии в организме»; исходная доля устойчивого варианта 0,001; режим «препарат» (условно r = 4)", "t4_s1_q": "Что произойдёт с долей устойчивых клеток через 10 поколений?", "t4_s1_o1": "Станет почти 1: чувствительные гибнут, устойчивые размножаются", "t4_s1_x1": "Да: около 0,999", "t4_s1_o2": "Каждая бактерия станет устойчивой под действием препарата", "t4_s1_x2": "Отдельная клетка не становится устойчивой; меняется доля вариантов", "t4_s1_o3": "Не изменится: устойчивые клетки слишком редки", "t4_s1_x3": "Даже редкий вариант быстро распространяется, если размножается успешнее", "t4_s1_h1": "Что делает препарат с чувствительными клетками?", "t4_s1_h2": "Чему равна доля через 5 поколений?", "t4_s1_h3": "Через 5 поколений — около 0,5", "t4_s1_e": "Препарат меняет среду отбора, а не создаёт мутации. Устойчивость наследуется; растёт доля потомков устойчивых клеток", "t4_s2_title": "Изменение условий задачи: без препарата", "t4_s2_cond": "Режим «без препарата»: устойчивый вариант размножается немного медленнее чувствительного (условно r = 0,9)", "t4_s2_q": "Что произойдёт с долей устойчивых через 10 поколений?", "t4_s2_o1": "Медленно снизится: устойчивость имеет цену", "t4_s2_x1": "Да: около 0,0003", "t4_s2_o2": "Вырастет так же быстро, как с препаратом", "t4_s2_x2": "Без препарата у устойчивого варианта нет преимущества", "t4_s2_o3": "Сразу станет нулевой", "t4_s2_x3": "Доля снижается постепенно; вариант может сохраниться", "t4_s2_h1": "Есть ли у устойчивых преимущество без препарата?", "t4_s2_h2": "r меньше 1", "t4_s2_h3": "Доля снижается медленно", "t4_s2_e": "Направление отбора задаёт среда: с препаратом устойчивость выгодна, без него — часто нет. Редкий вариант при этом может сохраняться долго", "t4_s3_title": "Линии вируса и иммунитет населения", "t4_s3_cond": "Масштаб «линии вируса»; доля варианта, хуже распознаваемого иммунитетом, 0,01; режим «иммунитет населения растёт» (условно r = 1,3 за цикл передачи)", "t4_s3_q": "Что произойдёт с долей этого варианта через 20 циклов передачи?", "t4_s3_o1": "Вырастет примерно до 2/3", "t4_s3_x1": "Да: около 0,66", "t4_s3_o2": "Вирус изменится, чтобы уйти от иммунитета", "t4_s3_x2": "Варианты возникают случайно; иммунитет меняет их успех", "t4_s3_o3": "Не изменится: иммунитет на вирус не действует", "t4_s3_x3": "Иммунитет населения — среда отбора для вирусных линий", "t4_s3_h1": "Какой вариант передаётся успешнее при иммунитете?", "t4_s3_h2": "Доля через 10 циклов — около 0,12", "t4_s3_h3": "Продолжите до 20", "t4_s3_e": "Иммунитет населения повышает долю вариантов, хуже распознаваемых иммунитетом. Ускользание обычно частичное: антитела узнают несколько участков белка", "t4_s4_title": "Клоны опухоли", "t4_s4_cond": "Масштаб «клоны опухоли»; доля устойчивого субклона до терапии 0,01; режим «терапия» (условно r = 1,1 : 0,7 ≈ 1,57)", "t4_s4_q": "Что вероятнее произойдёт?", "t4_s4_o1": "Устойчивый субклон станет преобладать", "t4_s4_x1": "Да: около 0,99 через 20 единиц", "t4_s4_o2": "Доля устойчивого субклона не изменится", "t4_s4_x2": "Терапия меняет конкуренцию клонов", "t4_s4_o3": "Терапия создаст устойчивый субклон", "t4_s4_x3": "Устойчивый субклон существовал до терапии", "t4_s4_h1": "Был ли устойчивый субклон до терапии?", "t4_s4_h2": "Что терапия делает с чувствительными клетками?", "t4_s4_h3": "Состав опухоли меняется", "t4_s4_e": "Эволюция опухоли ветвящаяся; лечение меняет конкуренцию клонов. Изменения клеток тела не передаются потомкам организма", "t4_s5_title": "Равновесие мутаций и отбора", "t4_s5_cond": "Рецессивный вредный аллель; скорость мутаций в этот аллель μ = 10⁻⁴ за поколение (условно); снижение приспособленности гомозигот s = 0,9", "t4_s5_q": "Какой будет равновесная частота аллеля?", "t4_s5_o1": "Около 0,01: q = √(μ / s)", "t4_s5_x1": "Да: √(10⁻⁴ / 0,9) ≈ 0,0105", "t4_s5_o2": "Ноль: отбор удалит аллель полностью", "t4_s5_x2": "Аллель возникает снова мутациями", "t4_s5_o3": "Около 0,9: равна s", "t4_s5_x3": "Частота определяется отношением μ и s", "t4_s5_h1": "Что удаляет аллель, что создаёт его снова?", "t4_s5_h2": "Формула q = √(μ / s)", "t4_s5_h3": "√(1,1·10⁻⁴) ≈ 0,0105", "t4_s5_e": "Вредный аллель сохраняется, потому что возникает заново, а у гетерозигот он почти не снижает приспособленность" function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);

  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){

    if (lvl === 'a') ps.push('level=adv');

    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); if (q !== qn) amk = 1; qn = q; lvl = l; show(); syncUrl(push); }

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 700 px или низкий экран) во всех практикумах.
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 760 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:700px), (max-height:500px)') : null;
  let queued = false;
  function fitStage(st) {
    const sv = st.querySelector('svg'), zw = st.querySelector('.zwrap'); if (!sv || !zw) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); st.style.removeProperty('--p5w'); return; }
    const cur = sv.getBoundingClientRect().width, flatW = zw.clientWidth; if (!cur || !flatW) return;
    const k = Math.min(1, flatW / cur); let min = Infinity;
    ts.forEach(t => {
      const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
      const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
      if (px > 0 && px < min) min = px;
      t.classList.toggle('p5-small', px < 7);
    });
    if (min < Infinity) st.style.setProperty('--p5w', Math.ceil(Math.min(1800, Math.max(760, flatW * 11.2 / min))) + 'px');
  }
  function fitAll() { queued = false; document.querySelectorAll('#scenes .stage').forEach(st => { if (st.offsetParent) fitStage(st); }); }
  const later = () => { if (queued) return; queued = true; requestAnimationFrame(fitAll); };
  function arm() {
    const sc = document.getElementById('scenes') || document.body;
    new MutationObserver(later).observe(sc, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
    document.addEventListener('click', later, true);
    window.addEventListener('resize', later);
    later();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
})();

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));

    }

  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';

        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];

  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {

      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {

  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */

      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +

  }

    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */

    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */

      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;

      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:

        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }

        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------

    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */

      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`

  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {

      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),

      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);

      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;

      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;

      else if (stuckCoat) {

      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);

      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);

      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };

      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);

        if (noSnare) {

            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {

          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);

  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;

    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';

    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */

    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */

    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);

    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,

    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;

    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
