  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = G('nucleus', `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`);
    segs.forEach(([a, b]) => { const P = stadium(a, b, Yc, H); q += G('envelope', `<path d="M${P.map(([x, y]) => f(x) + ',' + f(y)).join(' L')} Z" fill="${C.lumen}"/>` + bilayerPts(P, { closed: true })); });
    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { let w = `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) w += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; q += G('npc', w); });
    const big = nucBig;
    const imp = o.noImp ? () => '' : nucImp;
    const exp = nucExp;
    const sm = nucSm;
    const top = [[110, 70], [300, 110], [480, 80]], bot = [[110, 320], [300, 290], [480, 330]];
    const q0 = q;
    let res = {};
    if (cargo === 'small') { q += sm([[70, 60], [150, 100], [260, 70], [340, 120], [450, 60], [540, 110], [80, 300], [170, 340], [270, 300], [350, 350], [460, 290], [540, 340], [206, 196], [394, 206]]); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'big' || cargo === 'mut') { q += top.map(([x, y]) => big(x, y, cargo === 'mut' ? 'mut' : '')).join(''); res = { mode: 'none', where: cargo === 'big' ? 'cytoslow' : 'cyto' }; }
    else if (cargo === 'm27' || cargo === 'm67') { const r = cargo === 'm27' ? 6 : 9.5, g = (x, y) => G('gfpprot', `<circle cx="${x}" cy="${y}" r="${r}" fill="#7FBF7F" stroke="#3d7a3d" stroke-width="1"/>`);
      q += [[90, 70], [230, 110], [380, 70], [520, 105], [206, 200], [100, 310], [250, 340], [400, 300], [530, 345]].map(([x, y]) => g(x, y)).join(''); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'nls') {
      if (rm === 'imp') { q += top.map(([x, y]) => big(x, y, 'nls')).join(''); res = { mode: 'norec', where: 'cyto' }; }
      else if (rm === 'ran') { q += big(110, 70, 'nls') + imp(110, 70) + big(394, Yc, 'nls') + imp(394, Yc) + big(300, 300, 'nls') + imp(300, 300); res = { mode: 'stuck', where: 'both' }; }
      else { q += big(110, 70, 'nls') + imp(110, 70) + big(206, Yc, 'nls') + imp(206, Yc) + bot.map(([x, y]) => big(x, y, 'nls')).join('') + imp(560, 360); res = { mode: 'imp', where: 'nuc' }; }
    } else {
      if (rm === 'exp' || rm === 'ran') { q += bot.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: rm === 'ran' ? 'noran' : 'norec', where: 'nuc' }; }
      else { q += big(300, 300, 'nes') + exp(300, 300) + big(394, Yc, 'nes') + exp(394, Yc) + top.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: 'exp', where: 'cyto' }; }
    }
    const a = { cyto: [14, 24], nuc: [14, 392], env: [530, Yc - 44], npc: [300, Yc + 62] };
    if (o.ran) {
      const g = (x, y, gtp) => G('ran', `<circle cx="${x}" cy="${y}" r="6" fill="${gtp ? '#1E7B4A' : '#fff'}" stroke="#1E7B4A" stroke-width="2"/>`);
      q += [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      const rd = [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      a.ranC = [300, 50]; a.ranN = [240, 380]; a.gtpN = rm !== 'ran'; a.rd = rd;
    }
    return { s: o.bg ? q0 + (a.rd || '') : q, res, a };
  }

  /* ---------- рецептор груза по нормали к мембране (рецензия v0.1, R27) ----------
     recAt: точка (x, y) на средней линии мембраны; th — поворот (градусы) от направления «вверх»; ножка пересекает бислой,
     чаша — в просвете (на глубине depth), адаптер — с цитоплазматической стороны. */
  function recAt(x, y, th, withCargo = true, depth = 15, adapter = true) {
    const top = y - depth;
    return `<g transform="rotate(${f(th)} ${f(x)} ${f(y)})">` +
      `<line x1="${f(x)}" y1="${f(y + 10)}" x2="${f(x)}" y2="${f(top)}" stroke="${C.rec}" stroke-width="3.6" stroke-linecap="round"/>` +
      `<path d="M${f(x - 6)},${f(top)} Q${f(x)},${f(top + 8)} ${f(x + 6)},${f(top)}" fill="none" stroke="${C.rec}" stroke-width="3.6" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${f(x)}" cy="${f(top - 1)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '') +
      (adapter ? `<line x1="${f(x)}" y1="${f(y + 12)}" x2="${f(x)}" y2="${f(y + 20)}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>` : '') + `</g>`;
  }
  /* точка и наружная нормаль полуэллипса ямки: x = c + w·cos a, y = y0 + d·sin a (a от π до 0) */
  const pitPt = (c, y0, w, d, a) => { const x = c + w * Math.cos(a), y = y0 + d * Math.sin(a); let nx = (x - c) / (w * w), ny = (y - y0) / (d * d); const n = Math.hypot(nx, ny) || 1; return { x, y, nx: nx / n, ny: ny / n }; };
  const thIn = (nx, ny) => Math.atan2(-nx, ny) * 180 / Math.PI;   /* поворот «вверх» → внутрь ямки (против наружной нормали) */
  function recOnPit(c, y0, w, d, as, withCargo = true) {
    return as.map(a => { const p = pitPt(c, y0, w, d, a); return recAt(p.x, p.y, thIn(p.nx, p.ny), withCargo); }).join('');
  }
  function clathOnPit(c, y0, w, d, off = 27, n = 13, color = C.clath) {
    let q = ''; for (let i = 1; i < n; i++) { const p = pitPt(c, y0, w, d, Math.PI - Math.PI * i / n); q += `<circle cx="${f(p.x + p.nx * off)}" cy="${f(p.y + p.ny * off)}" r="3.6" fill="${color}"/>`; }
    return q;
  }
  /* везикула с рецепторами в мембране: phis — направления (градусы) от центра; coat — цвет оболочки (null — без оболочки) */
  function recRadial(cx, cy, R, phis, withCargo = true, adapter = true) {
    const depth = Math.min(15, R - 10);
    return phis.map(ph => { const t = ph * Math.PI / 180, nx = Math.cos(t), ny = Math.sin(t); return recAt(cx + R * nx, cy + R * ny, thIn(nx, ny), withCargo, depth, adapter); }).join('');
  }

    return G('spase', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 4)}" width="12" height="${f(MH + 8)}" rx="3" fill="${C.spase}"/>` +
      `<path d="M${f(x - 9)},${f(y - MH / 2 - 16)} L${f(x)},${f(y - MH / 2 - 6)} L${f(x + 9)},${f(y - MH / 2 - 16)}" fill="none" stroke="${C.spase}" stroke-width="3.2" stroke-linecap="round"/>`);
  }

  /* ---------- гликаны и метка (условные знаки, без формул) */
  const sq = (x, y, u, c = C.glcnac) => `<rect x="${f(x - u / 2)}" y="${f(y - u / 2)}" width="${f(u)}" height="${f(u)}" fill="${c}"/>`;
  const ci = (x, y, u, c = C.man) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u / 2)}" fill="${c}"/>`;
  const tri = (x, y, u, c = C.glc) => `<path d="M${f(x)},${f(y - u * .55)} L${f(x + u * .55)},${f(y + u * .45)} L${f(x - u * .55)},${f(y + u * .45)} Z" fill="${c}"/>`;
  const pmark = (x, y, u) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u * .62)}" fill="${C.phos}"/>` + `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(u * .85)}" font-weight="800" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">P</text>`;
  /* N-гликан на аспарагине в точке (x, y), растёт в сторону dir (−1 — вверх). o.glc — число глюкоз (0–3); o.trim — маннозы укорочены
     (сигнал к удалению); o.p — метка M6P ('P' на маннозе) | 'glcnacP' — промежуточная (GlcNAc-P на маннозе); o.complex — сложный
     (аппарат Гольджи: концевые ветви другими знаками); u — размер знака */
  function glycan(x, y, dir = -1, o = {}, g = 'glycan') {
    const u = o.u || 7, st = u * 1.35, Y = i => y + dir * st * i;
    let s = line(x, y, x, Y(3), '#555', 1.4) + line(x, Y(3), x - st, Y(4), '#555', 1.4) + line(x, Y(3), x + st, Y(4), '#555', 1.4);
    s += sq(x, Y(1), u) + sq(x, Y(2), u) + ci(x, Y(3), u);
    if (o.complex) { s += sq(x - st, Y(4), u, '#6B8E23') + sq(x + st, Y(4), u, '#6B8E23') + ci(x - st, Y(5), u * .9, '#E8B4C8') + ci(x + st, Y(5), u * .9, '#E8B4C8'); return G(g, s); }
    s += ci(x - st, Y(4), u) + ci(x + st, Y(4), u);
    if (!o.trim) { s += line(x - st, Y(4), x - st, Y(5), '#555', 1.2) + ci(x - st, Y(5), u); }
    for (let i = 0; i < (o.glc || 0); i++) s += tri(x - st, Y(6 + i), u);
    if (o.p) {
      const px = x + st + u * .9, py = Y(4) + dir * u * .5;
      s += line(x + st, Y(4), px, py, '#555', 1.2);
      if (o.p === 'glcnacP') s += sq(px + u * 1.1, py + dir * u * .5, u * .9) + G('m6p', pmark(px, py, u)); else s += G('m6p', pmark(px, py, u));
    }
    return G(g, s);
  }

  /* ---------- шапероны, контроль качества, удаление */
  const bip = (x, y, k = 1, g = 'bip') => G(g, `<path d="M${f(x - 12 * k)},${f(y - 9 * k)} A13,13 0 1 0 ${f(x + 12 * k)},${f(y - 9 * k)}" fill="none" stroke="${C.chap}" stroke-width="${f(6 * k)}" stroke-linecap="round"/>`);
  const pdi = (x, y, g = 'pdi') => G(g, `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7" fill="${C.pdi}"/>`);   /* интеграция (агент t2): без текста 7,5 px — подпись PDI ставит сцена */
  /* калнексин: белок мембраны ЭПР (y — середина бислоя) с лектиновой головкой в просвете (сверху) */
  const calnexin = (x, y, g = 'cnx') => G(g, `<rect x="${f(x - 4)}" y="${f(y - MH / 2 - 2)}" width="8" height="${f(MH + 4)}" rx="3" fill="${C.chap}"/>` +
    line(x, y - MH / 2 - 2, x, y - MH / 2 - 16, C.chap, 3) + `<path d="M${f(x - 14)},${f(y - MH / 2 - 16)} A14,10 0 0 1 ${f(x + 14)},${f(y - MH / 2 - 16)} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
  /* убиквитин: цепочка из n малых кружков */
  const ub = (x, y, n = 4, dx = 7, g = 'ub') => G(g, Array.from({ length: n }, (_, i) => `<circle cx="${f(x + i * dx)}" cy="${f(y - (i % 2) * 3)}" r="3.4" fill="${C.ub}"/>`).join(''));
  /* протеасома: бочонок в цитозоле */
  const proteasome = (x, y, g = 'prot') => G(g, [0, 1, 2, 3].map(i => `<rect x="${f(x - 16)}" y="${f(y - 20 + i * 10)}" width="32" height="9" rx="4" fill="${i % 3 ? C.protL : C.prot}"/>`).join(''));
  /* канал удаления (ERAD) в мембране ЭПР */
  const eradCh = (x, y, g = 'erad_ch') => G(g, `<rect x="${f(x - 14)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/><rect x="${f(x + 4)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/>`);

  /* ---------- мембранные белки (в бислое) */
  /* однопроходный белок: трансмембранный сегмент в бислое (y — середина), N-домен (глобула) с одной стороны, C-хвост с другой.
     o.inv — обратная ориентация (N-домен в цитозоле, A4); o.col; o.dom — размер домена; o.lig — связан лиганд; o.bad — участок связывания
     не сформирован (штриховой контур); o.glyc — гликан на N-домене; возвращает и точку N-домена */
  function tmProt(x, y, o = {}) {
    const up = o.inv ? 1 : -1, col = o.col || C.ldlr, r = o.dom || 13, ny = y + up * (MH / 2 + 8 + r);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>`;
    s += line(x, y + up * (MH / 2 + 2), x, ny - up * r, col, 3);
    s += `<circle cx="${f(x)}" cy="${f(ny)}" r="${r}" fill="${o.bad ? '#fff' : col}" stroke="${col}" stroke-width="2"${o.bad ? ' stroke-dasharray="4 3"' : ''}/>`;
    const tailEnd = y - up * (MH / 2 + 18);
    s += `<path d="M${f(x)},${f(y - up * (MH / 2 + 2))} Q${f(x + 8)},${f((y - up * (MH / 2) + tailEnd) / 2)} ${f(x + 2)},${f(tailEnd)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;
    if (o.glyc) s += glycan(x + r - 2, ny + up * (r - 2), up, { u: 5 });
    if (o.lig) s += G('ligand', `<path d="M${f(x - 8)},${f(ny + up * (r + 2))} L${f(x)},${f(ny + up * (r + 14))} L${f(x + 8)},${f(ny + up * (r + 2))} Z" fill="${C.lig}"/>`);
    return { s: G(o.g || 'tm', s), nx: x, ny };
  }
  /* рецептор M6P: белок мембраны (y — середина) с карманом связывания со стороны просвета (сверху; dir=-1) */
  function m6pr(x, y, dir = -1, o = {}) {
    const col = o.off ? C.grey : C.m6pr, hy = y + dir * (MH / 2 + 12);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>` +
      `<path d="M${f(x - 10)},${f(hy + dir * 6)} L${f(x - 10)},${f(hy)} Q${f(x)},${f(hy - dir * 8)} ${f(x + 10)},${f(hy)} L${f(x + 10)},${f(hy + dir * 6)}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
    return G('m6pr', s) + (o.off ? cross(x, hy + dir * 12, 6) : '');
  }
  /* гидролаза (растворимый груз): глобула; o.tag — метка M6P (знак «P»); o.free — без рецептора */
  const hydrolase = (x, y, o = {}) => G(o.g || 'hydro', `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 7}" fill="${C.hydro}" stroke="#6E3554" stroke-width="1"/>` + (o.tag ? pmark(x + (o.r || 7) + 3, y - (o.r || 7) + 1, 6) : ''));
  /* растворимый секретируемый белок (глобула; цвет по грузу) */
  const solProt = (x, y, col = C.sec, r = 6, g = 'cargo') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}" stroke="#2B5D88" stroke-width=".8"/>`);

  /* ---------- аппарат Гольджи: стопка цистерн (просвет — внутри; цис — снизу слева, транс — справа сверху задаёт сцена) */
  function cisterna(cx, cy, w, h = 16, fill = C.lumen /* С-13 */, g = 'cist') { return closedMem(roundRectPts(cx - w / 2, cy - h / 2, w, h, h / 2 - .5), fill, g); }

  /* шкала столбцов (модели A2, A3): ось, деления и подписи; возвращает функцию высоты */
  function axes(x, y, w, h, vmax, ticks, lab) {
    let s = line(x, y, x, y - h, C.muted, 1.4) + line(x, y, x + w, y, C.muted, 1.4);
    ticks.forEach(v => { const yy = y - h * v / vmax; s += line(x - 4, yy, x, yy, C.muted, 1.2) + T(x - 7, yy, String(v), { a: 'r', size: 10.5, col: C.muted }); });
    if (lab) s += T(x - 4, y - h - 14, lab, { a: 'l', size: 11, col: C.muted, w: 600 });
    return { s, H: v => h * v / vmax };
  }
  const num = (x, d = 1) => { const v = +x; return (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v).toFixed(0) : v.toFixed(d)).replace('.', ',').replace('-', '−'); };

  return { C, f, G, esc, T, TN, wrap, title, panel, line, arrow, carrow, larrow, cross, waitBox, tag, readout, sides, memH, MH, closedMem, roundRectPts, circlePts, carrier,
    ribosome, mrna, chain, srp, srpR, sec61, spase, sq, ci, tri, pmark, glycan, bip, pdi, calnexin, ub, proteasome, eradCh, tmProt, m6pr, hydrolase, solProt, cisterna, axes, num,
    setPick: v => { PICK = !!v; }, get pick() { return PICK; } };
})();

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   stageView — возврат схемы на экран при запуске (телефон).
   Семинар 8 (из семинара 7 v1.5): формы мембраны MF не нужны; справка по деталям — группы data-g (GN.G), она включена
   всегда в практикуме, а на странице «Объяснений» не используется.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */
const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));
    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */
    chips.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));
      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */
    const Td = T > 1e-9 && T < stop - 1e-9 && Math.abs(T - Math.round(T)) < 1e-9 ? T - 1e-6 : T;
    o.render(Td);
  }
  const api = {
    get T() { return st.T; }, get playing() { return st.on; }, get end() { return st.stop; },
    config(keys, stop, stopKey, opt = {}) {
      st.speed = opt.speed || 1.5; st.halt = !!opt.halt; st.keys = keys; st.n = keys.length; st.stop = stop; st.stopKey = stopKey; st.on = false; st.text = '';
      st.stepKey = opt.stepKey || 'tl_step'; st.off = opt.off || 0;
      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');
      chips.querySelectorAll('button').forEach((b, i) => b.onclick = () => { st.on = false; api.seek(i + 1); });
    },
    seek(T) { st.until = null; st.T = Math.max(0, Math.min(st.stop, T)); paint(); },
    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
    play(fromStart, until) {
      if (fromStart || st.T >= st.stop - 1e-6) st.T = 0;
      st.until = until != null && until < st.stop ? until : null;
      if (calm.matches) {   /* без движения: ответ показывается сразу, кнопка идёт по одному этапу */
        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => (typeof CASE !== 'undefined' && CASE.on) ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };

const EV = (function () {

const PO = (function () {
  const P = {
    bacteria: { p0: 0.001, t: [0, 5, 10], m: [[2.0, 0.5], [1.8, 2.0]] },
    virus: { p0: 0.01, t: [0, 10, 20], m: [[1.3, 1.0], [0.95, 1.0]] },

  return { P, p, at, icons, r: (scale, mode) => P[scale].m[mode][0] / P[scale].m[mode][1] };

     TRF.mark(kind, x, y, r) — маркер типа дерева участка: 'KL' круг, 'LM' ромб, 'KM' треугольник (форма дублирует цвет, AT-17).

const TRF = (function () {

    box: '#F3F5F8', boxE: '#C9D3DF', bad: '#C0392B' };

          clade: true — подсветить кладу общего предка, sel: [имена] — выбранные кончики, events: { имя узла: 'spec'|'dup' }, loss: [имена кончиков],

    const tipW = V ? 0 : Math.max(...L.nodes.filter(x => !x.ch).map(x => String(lab(x.n.name)).length)) * 8 + (o.out ? 132 : 22);

        conn += `<line x1="${f(a1)}" y1="${f(b1)}" x2="${f(a2)}" y2="${f(b2)}" stroke="${cc}" stroke-width="2.6" stroke-linecap="round"/>`; }

      const sel = o.sel && o.sel.includes(x.n.name), col = out ? C.muted : dim ? C.grey : C.ink;

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (ограничение 07, разд. 4; R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

const S16U = (s, sfx) => sfx ? s.replace(/id="([a-z_]+)"/g, 'id="$1_' + sfx + '"').replace(/url\(#([a-z_]+)\)/g, 'url(#$1_' + sfx + ')') : s;   /* id узоров — свои у каждой схемы страницы */
GN.s16_t1 = { view(a, t) { a = Array.isArray(a) ? a[0] : (a || {}); return S16U(GN.s16_t1.raw(a, t), a.sfx); },
 raw(a, t) {
  const p = a.panel || 'A';
  if (p === 'B') return TLF.lines(a, t);
  if (p === 'C') return TLF.mosaic(a, t);
  let s = TLF.draw(a, t);
  if (a.s6) {   /* шаг 1.6: засечка Ломекви и отрезок Ледигераруской челюсти; после ответа — вывод на схеме (02, «Наблюдение») */
    const o = a, xm = TLF.X(o, 3.3), xl = TLF.X(o, TL.byId('ledi').fad), y = 26;
    if (a.reveal) s += `<path d="M${S4F.f(xm)} ${y + 4} L${S4F.f(xm)} ${y} L${S4F.f(xl)} ${y} L${S4F.f(xl)} ${y + 4}" fill="none" stroke="#2C7FB8" stroke-width="2"/>` +
      S4F.T(340, 76, t('t1_s6_lab'), { a: 'l', size: 11, w: 700, col: '#2C7FB8', n: 38 });
  }
  return s;
} };

/* GN.s16_t2 — вкладка 2: { panel: 'A', arcs, arcLab, nodeLab } — дерево популяций (TRF.net); { panel: 'B', t: 1|100|500|2000, show, mode: 'one'|'two', stg } —
   участки после смешения (пара хромосом; окно увеличения 2 условные единицы — длины видны при любом t); { panel: 'C', show } — происхождение
   в Африке: фрагмент шкалы 0,4–0,1 млн лет с засечками Джебель-Ирхуд и Омо I и условная схема разнообразия аллелей одного участка. */
GN.s16_t2 = (function () {
  const F = S4F, f = F.f, T = (x, y, s, o = {}) => F.T(x, y, s, Object.assign({ size: 12 }, o, { size: Math.max(11, o.size || 12) }));
  const G = (g, s) => (typeof POP_G2T !== 'undefined' && POP_G2T[g]) ? F.G(g, s) : s;
  const K = { arch: '#A08C74', sap: '#6E8CA8', ink: '#15202B', muted: '#5A6676', line: '#D3DAE3', rec: '#15202B', hl: '#2C7FB8' };
  /* ---------- А: дерево популяций (07, 3.3): корень 575 тыс. лет (середина 630–520); узел НЕАНД/ДЕНИС — 415 (середина 440–390);
     кончики вымерших линий — по последним находкам шкалы (40 и 55 тыс. лет, TL_TAXA); узел АФР/НЕАФР — без даты (положение условно) */
  const NEWICK = '((АФР:100,НЕАФР:100):475,(НЕАНД:375,ДЕНИС:360):160)';
  function tree(o, t) {
    const arcs = o.arcs ? [{ n: 1, from: 'НЕАНД', to: 'НЕАФР', at: 40, bend: 16 }, { n: 2, from: 'ДЕНИС', to: 'НЕАФР', at: 75, bend: -22 }, { n: 3, from: 'НЕАНД', to: 'ДЕНИС', at: 170, both: true, bend: 16 }, { n: 4, from: 'stem', to: 'НЕАНД', at: 300, bend: 16 }] : [];   /* порядок по источникам: Денисова 11 ≈ 118–79, примеси неафриканцам ≈ 54–44; положения условны */   /* положения по времени условны (t2_a_note) */
    let s = F.T(12, 14, t('ad_pA'), { a: 'l', size: 13, w: 700, col: K.muted });
    s += TRF.net({ x: 50, y: 40, w: 516, h: 224, newick: NEWICK, root: 575, ticks: [600, 500, 400, 300, 200, 100, 0], stemTips: ['АФР', 'НЕАФР'],
      tipLab: { 'АФР': t('ad_tip_afr'), 'НЕАФР': t('ad_tip_nonafr'), 'НЕАНД': t('ad_tip_n'), 'ДЕНИС': t('ad_tip_d') },
      ints: [{ tips: ['АФР', 'НЕАФР', 'НЕАНД', 'ДЕНИС'], a: 630, b: 520, lab: t('ad_int_root'), show: o.nodeLab, side: 'r' }, { tips: ['НЕАНД', 'ДЕНИС'], a: 440, b: 390, lab: t('ad_int_nd'), show: o.nodeLab, side: 'l' }],   /* Р-12: подписи над входящей ветвью, без подложки */
      axis: !o.arcs, axisNote: o.arcs ? t('ad_arcs_note') : '',   /* Р-11: при дугах числовой оси нет — положение дуг условно */
      nodeNote: { tips: ['АФР', 'НЕАФР'], lab: o.nodeLab ? t('ad_node_afr') : '' }, arcs,
      cap: t('ad_cap'), legend: o.arcs ? (o.arcLab ? ['n', 'd', 'nd', 's'].map((k, i) => (i + 1) + ' — ' + t('ad_arc_lab_' + k)) : [t('ad_arc_wait')]) : [] }, t);
    return s;
  }
  /* ---------- Б: участки после смешения (07, 3.3: L = 100 / t; число отрезков min(12, round(t/100) + 1) — условно) */
  const POS = [0.08, 0.17, 0.24, 0.33, 0.41, 0.47, 0.55, 0.62, 0.7, 0.77, 0.85, 0.93];   /* условные положения участков вдоль хромосомы */
  function chrom(x, y, w, h, segs, o = {}) {   /* segs: [[начало 0–1, длина 0–1]] — архаичные участки на хромосоме Homo sapiens */
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${h}" rx="${h / 2}" fill="${o.allArch ? K.arch : K.sap}"/>`;
    if (o.allArch) s = G('seg_arch', `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${h}" rx="${h / 2}" fill="url(#adh)" stroke="${K.arch}" stroke-width="1.2"/>`);
    segs.forEach(([a, l], i) => { const xa = x + a * w, wa = Math.max(3, l * w);
      if (i === 0 && o.letter !== false) s += T(xa + wa / 2, y - 9, 'А', { size: 11, w: 800, col: K.arch });
      s += G('seg_arch', `<rect x="${f(xa)}" y="${f(y)}" width="${f(wa)}" height="${h}" fill="url(#adh)" stroke="${K.arch}" stroke-width=".8"/>`);
      if (o.rec !== false) s += G('recomb', `<line x1="${f(xa)}" y1="${f(y - 3)}" x2="${f(xa)}" y2="${f(y + h + 3)}" stroke="${K.rec}" stroke-width="1.2"/><line x1="${f(xa + wa)}" y1="${f(y - 3)}" x2="${f(xa + wa)}" y2="${f(y + h + 3)}" stroke="${K.rec}" stroke-width="1.2"/>`); });
    return s;
  }
  const segsFor = (tt, shift = 0) => { if (tt <= 1) return null; const n = AD.nseg(tt), L = AD.tract(tt) / 100; return POS.slice(0, n).map((p, i) => [((p + shift + i * 0.013) % 0.96) + 0.01, L]); };
  function tracts(o, t) {
    const tt = o.t || 100, x0 = 70, w = 470;
    let s = `<defs><pattern id="adh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${K.arch}" opacity=".35"/><line x1="0" y1="0" x2="0" y2="6" stroke="${K.arch}" stroke-width="2.4"/></pattern></defs>`;
    s += F.T(12, 14, t('ad_pB'), { a: 'l', size: 13, w: 700, col: K.muted });
    if (o.mode === 'two') {   /* шаг 2.5: два условных человека — архаичные участки в разных местах */
      [[0, 'ad_person1'], [0.37, 'ad_person2']].forEach(([sh, lab], j) => { const y = 64 + j * 110;
        s += T(x0, y - 18, t(lab), { a: 'l', size: 12, w: 700 });
        [0, 1].forEach(c => { s += chrom(x0, y + c * 26, w, 13, POS.slice(0, 3).map((p, i) => [((p * 2.7 + sh + c * 0.31 + i * 0.07) % 0.9) + 0.04, 0.022]), { rec: false, letter: false }) + T(x0 - 8, y + c * 26 + 6.5, 'С', { a: 'r', size: 12, w: 800, col: K.sap }); }); });
      s += T(x0 + w, 270, t('ad_two_wide'), { a: 'r', size: 11, col: K.muted }) + T(x0, 252, t('ad_two_lab_hint'), { a: 'l', size: 11, col: K.muted });
      s += legend(x0, 300, t);
      s += o.show ? T(x0, 352, t('ad_two_lab'), { a: 'l', size: 12, w: 700, col: K.hl, n: 80 }) : T(x0, 352, t('tl_hidden'), { a: 'l', size: 12, col: K.muted });
      return s;
    }
    const stg = o.stg, show = o.show !== false;
    /* пара хромосом: верхняя — получена от популяции с примесью (участки А), нижняя — Homo sapiens (С) */
    const y1 = 70, y2 = 104, h = 16;
    const tShown = stg === 1 ? 0 : stg === 2 ? 1 : stg === 3 ? 10 : tt;
    if (stg === 1) { s += chrom(x0, y1, w, h, [], { allArch: true }) + T(x0 - 8, y1 + 8, 'А', { a: 'r', size: 13, w: 800, col: K.arch }); s += chrom(x0, y2 + 30, w, h, []) + T(x0 - 8, y2 + 38, 'С', { a: 'r', size: 13, w: 800, col: K.sap }); }
    else {
      const segs = tShown <= 1 ? null : tShown === 10 ? [[0.12, 0.3], [0.55, 0.22]] : (show ? segsFor(tShown) : null);
      s += (segs ? chrom(x0, y1, w, h, segs) : (tShown <= 1 ? chrom(x0, y1, w, h, [], { allArch: true }) : `<rect x="${x0}" y="${y1 - 3}" width="${w}" height="${h + 6}" rx="8" fill="#fff" stroke="#9AA5B1" stroke-dasharray="5 4"/>` + T(x0 + w / 2, y1 + 8, t('tl_hidden'), { size: 11, col: K.muted })));
      s += T(x0 - 8, y1 + 8, tShown <= 1 ? 'А' : 'С', { a: 'r', size: 13, w: 800, col: tShown <= 1 ? K.arch : K.sap });

    /* окно увеличения: 2 условные единицы хромосомы (участок средней длины L = 100 / t) */
    if (stg == null || stg >= 4) {
      const wy = 176, ww = 470, L = AD.tract(tt);

      s += `<rect x="${x0}" y="${wy}" width="${ww}" height="22" rx="4" fill="${tt <= 1 ? '#fff' : K.sap}"/>`;
      if (tt <= 1) s += G('seg_arch', `<rect x="${x0}" y="${wy}" width="${ww}" height="22" rx="4" fill="url(#adh)" stroke="${K.arch}"/>`) + T(x0 + ww / 2, wy + 11, t('ad_whole'), { size: 12, w: 800 });
      else if (show) { const sw = ww * Math.min(1, L / 2), sx = x0 + (ww - sw) / 2;
        s += G('seg_arch', `<rect x="${f(sx)}" y="${wy}" width="${f(sw)}" height="22" fill="url(#adh)" stroke="${K.arch}" stroke-width="1.2"/>`) + G('recomb', `<line x1="${f(sx)}" y1="${wy - 4}" x2="${f(sx)}" y2="${wy + 26}" stroke="${K.rec}" stroke-width="1.4"/><line x1="${f(sx + sw)}" y1="${wy - 4}" x2="${f(sx + sw)}" y2="${wy + 26}" stroke="${K.rec}" stroke-width="1.4"/>`) +
          G('tract_len', T(sx + sw / 2, wy + 40, t('ad_L', { L: TLF.num(L) }), { size: 12, w: 800, col: K.ink, bg: true })); }
      else s += `<rect x="${x0 + ww / 2 - 75}" y="${wy}" width="150" height="22" rx="4" fill="#fff" stroke="#9AA5B1" stroke-dasharray="4 3"/>` + T(x0 + ww / 2, wy + 11, t('tl_hidden'), { size: 11, col: K.muted });
      s += `<line x1="${x0}" y1="${wy + 54}" x2="${x0 + ww}" y2="${wy + 54}" stroke="${K.muted}"/>` + T(x0, wy + 66, '0', { size: 11, col: K.muted }) + T(x0 + ww, wy + 66, t('ad_zoom_end'), { a: 'r', size: 11, col: K.muted });
      if (o.inv && show) s += T(x0, wy + 92, t('ad_inv_lab'), { a: 'l', size: 12, w: 700, col: K.hl, n: 80 });

    s += legend(x0, 316, t);
    s += T(x0, 362, t('ad_formula'), { a: 'l', size: 11, w: 700, col: K.muted, n: 90 }) + T(x0, 380, t('ad_nseg'), { a: 'l', size: 11, col: K.muted, n: 90 });
    return s;
  }
  function legend(x, y, t) {
    return G('seg_arch', `<rect x="${x}" y="${y - 7}" width="26" height="14" fill="url(#adh)" stroke="${K.arch}"/>`) + T(x + 32, y, t('ad_lg_arch'), { a: 'l', size: 11 }) +
      `<rect x="${x + 290}" y="${y - 7}" width="26" height="14" fill="${K.sap}"/>` + T(x + 322, y, t('ad_lg_sap'), { a: 'l', size: 11 }) +
      G('recomb', `<line x1="${x + 13}" y1="${y + 11}" x2="${x + 13}" y2="${y + 27}" stroke="${K.rec}" stroke-width="1.4"/>`) + T(x + 32, y + 19, t('ad_lg_rec'), { a: 'l', size: 11 });

  /* ---------- В: происхождение в Африке (02, паспорт; шаг 2.6): засечки находок и условная схема разнообразия одного участка */
  function africa(o, t) {
    let s = F.T(12, 14, t('ad_pC'), { a: 'l', size: 13, w: 700, col: K.muted });

    s += T(40, 142, t('ad_c_both'), { a: 'l', size: 11, col: K.muted, n: 92 });

    const AL = ['#2C7FB8', '#E8912A', '#2E7D5B', '#7C4DBE', '#C0392B', '#8A6A00', '#1F7A7A', '#5A6676'];
    const REG = [{ x: 90, n: 8, k: 'afr' }, { x: 240, n: 5, k: 'r1' }, { x: 380, n: 3, k: 'r2' }, { x: 510, n: 2, k: 'r3' }];
    REG.forEach((r, i) => {
      s += `<ellipse cx="${r.x}" cy="222" rx="${i ? 56 : 74}" ry="46" fill="${i ? '#F4F6F9' : '#EEF5F5'}" stroke="${i ? '#B8C2CE' : '#1F7A7A'}" stroke-width="1.4"/>`;
      for (let j = 0; j < r.n; j++) { const a = j / r.n * Math.PI * 2, rr = r.n > 4 ? 26 : 16; s += `<circle cx="${f(r.x + rr * Math.cos(a))}" cy="${f(222 + rr * .62 * Math.sin(a))}" r="6" fill="${AL[j]}" stroke="#fff"/>`; }

})();

/* поле 100 значков (компонент «Популяция» семинара 13: порядок — POPF.order с закреплённым начальным значением; EVO, разд. 8):
   вариант — пурпурный ромб, прочие — серо-синий круг. o = { x, y, n (значков варианта из 100), seed, cols, gap, g (справка варианта), dim } */
const S16F = (function () {
  const F = S4F, f = F.f, C = { v: '#7C4DBE', o: '#5B7A99', fld: '#F6F8FB', fldE: '#C9D3DF' };
  const G = (g, s) => (g && typeof POP_G2T !== 'undefined' && POP_G2T[g]) ? F.G(g, s) : s;
  const dia = (x, y, r, c = C.v) => `<path d="M${f(x)} ${f(y - r)} L${f(x + r)} ${f(y)} L${f(x)} ${f(y + r)} L${f(x - r)} ${f(y)} Z" fill="${c}" stroke="#fff" stroke-width=".8"/>`;
  const dot = (x, y, r, c = C.o) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r * .78)}" fill="${c}" stroke="#fff" stroke-width=".8"/>`;
  function field(o, t) {
    const N = 100, cols = o.cols || 10, gap = o.gap || 15, r = o.r || 5.6, n = Math.max(0, Math.min(N, o.n));
    const ord = POPF.order([n, 0, N - n], o.seed || 16);
    let v = '', w = '';
    ord.forEach((g, i) => { const cx = o.x + gap / 2 + (i % cols) * gap, cy = o.y + gap / 2 + Math.floor(i / cols) * gap; if (g === 'AA') v += dia(cx, cy, r); else w += dot(cx, cy, r); });
    const W = cols * gap, H = Math.ceil(N / cols) * gap;
    return `<rect x="${f(o.x - 4)}" y="${f(o.y - 4)}" width="${f(W + 8)}" height="${f(H + 8)}" rx="8" fill="${C.fld}" stroke="${C.fldE}" stroke-width="1.2"/>` +
      `<g role="img"><title>${o.tOther || ''}</title>${w}</g>` + G(o.g, `<g role="img"><title>${o.tVar || ''}</title>${v}</g>`);
  }
  return { C, field, dia, dot };
})();

/* GN.s16_t3 — вкладка 3: { panel: 'A', preset, on: [карточки], reveal, hl: номер карточки (кадр этапа) } — пять карточек и шкала уровня;
   { panel: 'B', reveal } — частота варианта в двух условных популяциях; { panel: 'C', reveal } — независимые варианты персистенции лактазы. */
GN.s16_t3 = (function () {
  const F = S4F, f = F.f, T = (x, y, s, o = {}) => F.T(x, y, s, Object.assign({ size: 12 }, o, { size: Math.max(11, o.size || 12) }));
  const G = (g, s) => (g && typeof POP_G2T !== 'undefined' && POP_G2T[g]) ? F.G(g, s) : s;
  const K = { ink: '#15202B', muted: '#5A6676', off: '#9AA5B1', lv: ['#C9D3DF', '#A9BED3', '#86A8C8', '#5B8FC0', '#2C7FB8'], hl: '#2C7FB8', v: '#7C4DBE' };
  const CG = { 1: 'card1', 2: 'card2', 3: '', 4: 'card4', 5: '' };
  /* значки карточек: 1 гаплотип, 2 связь, 3 функция, 4 след отбора, 5 среда */
  function glyph(n, x, y, on) {
    const c = on ? K.ink : K.off;
    if (n === 1) return `<rect x="${x - 13}" y="${y - 3}" width="26" height="6" rx="3" fill="none" stroke="${c}" stroke-width="1.6"/>` + [-7, 0, 6].map(d => `<line x1="${x + d}" y1="${y - 6}" x2="${x + d}" y2="${y + 6}" stroke="${c}" stroke-width="1.6"/>`).join('');
    if (n === 2) return `<circle cx="${x - 8}" cy="${y}" r="5" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="${x + 8}" cy="${y}" r="5" fill="${c}"/><line x1="${x - 3}" y1="${y}" x2="${x + 3}" y2="${y}" stroke="${c}" stroke-width="1.6"/>`;
    if (n === 3) return `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${c}" stroke-width="1.6"/>` + [0, 60, 120, 180, 240, 300].map(a => { const r = a * Math.PI / 180; return `<line x1="${f(x + 7 * Math.cos(r))}" y1="${f(y + 7 * Math.sin(r))}" x2="${f(x + 10.5 * Math.cos(r))}" y2="${f(y + 10.5 * Math.sin(r))}" stroke="${c}" stroke-width="2"/>`; }).join('');
    if (n === 4) return `<path d="M${x - 13} ${y + 7} L${x - 6} ${y + 6} L${x - 2} ${y - 8} L${x + 2} ${y - 8} L${x + 6} ${y + 6} L${x + 13} ${y + 7}" fill="none" stroke="${c}" stroke-width="1.8"/>`;
    return `<path d="M${x - 13} ${y + 7} L${x - 4} ${y - 7} L${x + 1} ${y} L${x + 5} ${y - 4} L${x + 13} ${y + 7} Z" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  }
  function cards(o, t) {
    const on = new Set(o.on || []), pre = o.preset || 'epas1', L = EV.level([...on]);
