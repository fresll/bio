<title>Семинар 8 · Сохранность генома: точность копирования ДНК, репарация повреждений и защита концов хромосом — Кафедра биологии и генетики, Медицинский университет Петровского</title>

<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tlrow{display:flex;gap:10px;align-items:center}
.tlplay{white-space:nowrap;min-width:116px;padding-top:7px;padding-bottom:7px}
.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */
.veil{display:none}
.casemode .side>.panel:not(.case),.casemode .totake{display:none!important}
.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .tl,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}
.case .k{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}
.co{margin:0 0 10px;font-size:15px;line-height:1.4}
.ch{margin:12px 0 6px;font-weight:700;font-size:14px}
.cm,.cc{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.cq{font:600 12.5px var(--f-body);padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}
.kh{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */
:root{--nucbg:#F3EEF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}
.rxtrack input{position:relative;z-index:1;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}
.mcond p{margin:0;font-size:14.5px}
.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (граница с занятием, R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.poe .hint{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface)}
.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.amapgrid svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.amapq{margin-top:12px}.amapq .opts{display:grid;gap:6px}.amapq .opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.amapq .opt.right{border-color:#2E9B57;background:#EEF8F1}.amapq .opt.wrongpick{border-color:#C0392B;background:#FBECEA}.amapq .opt .L{font-weight:700}
@media (max-width:700px){.amapgrid{grid-template-columns:minmax(0,1fr)}}

/* ---- семинар 8, интерактив (Claude Code, 12.11.2026): из семинара 7 v1.5 ---- */
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}
.tlrow:has(.tlstep) .tlchips{flex-wrap:wrap}
.tlrow:has(.tlstep) .tlplay{min-width:0}
@media (max-width:1000px){.tlrow:has(.tlstep) .tlchips{flex-basis:100%}}   /* рецензия v1.4, п. 9: на компьютере ряд шкалы в одну строку — схема крупнее */
.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}
.scene.predict .panel.cap::before,.scene.predict .panel.reads::before{content:attr(data-predict);display:block;font-weight:600;color:var(--ink)}
.scene.predict .panel.cap,.scene.predict .panel.reads{position:relative}
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
/* рецензия v1.4, п. 7: до запуска шкала не показывает, где остановится процесс */
.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}

и зачёте он не требуется.", "teacher_2": "Базовые модели качественные: одна ошибка, одно повреждение, один разрыв, один конец хромосомы. Число нуклеотидов на схемах сокращено. На продвинутом уровне все числа — условные учебные значения, они так и подписаны; измеренные величины приведены только в «Объяснениях» с условиями измерения.", "teacher_3": "Уровни и источники. Базовый уровень сверен с зарубежным учебником (Alberts et al., 7-е изд.) и первичными работами; продвинутый уровень — учебные модели по учебнику и обзорам, указанным в «Источниках»; методы исследования в нём не разбираются. Упрощения названы в подписях сцен и в блоке «Чего модель не показывает».", "amode_t": "Режим", "amode_e": "Эксперимент", "amode_m": "Модель по данным", "amk_t": "Сцена", "amk_1": "Модель 1", "amk_2": "Модель 2", "amk_3": "Модель 3", "amode_note": "Переключатели и бегунки показывают значения, измеренные в одной работе, или расчёт по этим значениям, а не доказательство. Положения переключателя — измеренные значения.", "m_cond_t": "Условия", "m_lim_t": "Чего модель не показывает", "m_pA": "А", "m_pB": "Б", "m_hidden": "Показания откроются после ответа", "poe_hidden": "Схема откроется после ответа: сначала выберите вариант и нажмите «Показать на схеме».", "k_on": "на месте", "k_empty": "пусто", "k_fixed": "на месте", "k_first": "Вынуто несколько деталей: показан исход первой недостающей детали по ходу этапов.", "s1_proof": "Коррекция 3′-конца ДНК-полимеразой", "s1_mmr": "Репарация ошибочно спаренных нуклеотидов (MMR)", "s1_mark": "Метка новой цепи — разрыв в ней", "s1_on": "работает", "s1_off": "выключена", "s1_mark_yes": "есть", "s1_mark_no": "нет (разрывы уже сшиты)", "s1_ctrl_note": "Во всех положениях при синтезе возникла одна и та же ошибка: напротив A матрицы ДНК-полимераза присоединила C вместо T. Переключатели меняют только то, что происходит с этой ошибкой дальше.", "s1_pA": "А. Сразу после синтеза новой цепи", "s1_pA_syn": "А. Во время синтеза: 3′-конец растущей цепи", "s1_pB": "Б. После следующей репликации: две дочерние молекулы", "s1_lbl_tpl": "матрица (старая цепь)", "s1_lbl_new": "новая цепь", "s1_lbl_proof": "неверный C отщеплён с 3′-конца, на его место встал T", "s1_lbl_patch": "зелёный участок новой цепи вырезан и синтезирован заново", "s1_lbl_patch2": "новую цепь узнали по разрыву в ней; матрица не менялась", "s1_lbl_nomark": "ошибочная пара узнана, но не определено, какая цепь новая", "s1_lbl_none": "ошибочная пара C·A осталась в новой цепи", "s1_lbl_d1": "копия матрицы", "s1_lbl_d2": "копия новой цепи", "s1_lbl_same": "в обеих молекулах на этом месте пара T–A, как в исходной", "s1_lbl_fixed": "во второй молекуле пара C–G вместо T–A — изменение закреплено", "s1_r_mis": "Ошибочная пара C·A", "s1_r_mis_s": "после окончания синтеза новой цепи", "s1_v_mis_yes": "осталась", "s1_v_mis_no": "не осталась", "s1_r_where": "Где исправлена ошибка", "s1_v_where_proof": "на 3′-конце, во время синтеза", "s1_v_where_mmr": "после синтеза: заменён участок новой цепи", "s1_v_where_nomark": "не исправлена: новая цепь не отмечена", "s1_v_where_none": "не исправлена", "s1_r_next": "После следующей репликации", "s1_r_next_s": "пара на месте ошибки в двух дочерних молекулах", "s1_v_next_same": "T–A и T–A, как в исходной молекуле", "s1_v_next_fixed": "T–A и C–G: в одной молекуле из двух изменение", "s1_r_after": "Узнает ли MMR пару C–G после репликации", "s1_v_after": "нет: это обычная комплементарная пара", "s1_cap_proof": "Ошибка возникла на растущем 3′-конце: неверно спаренный C не образует правильной пары с A матрицы. Такой конец ДНК-полимераза не удлиняет, а переносит в свой экзонуклеазный центр и отщепляет C в направлении 3′→5′. Затем напротив A встаёт T, и синтез продолжается.", "s1_cap_proof_z": "Коррекция работает в момент синтеза и только на 3′-конце растущей цепи: она проверяет последний присоединённый нуклеотид. Ошибку, оставшуюся позади, она уже не исправит.", "s1_cap_mmr": "Коррекция пропустила ошибку, и пара C·A осталась в новой цепи позади полимеразы. Белок узнавания ошибочной пары (MutS) находит её, а по разрыву в новой цепи система определяет, какая из двух цепей новая. Участок новой цепи вместе с C удаляется, полимераза синтезирует его заново по матрице, лигаза сшивает разрыв.", "s1_cap_mmr_z": "Ошибочная пара состоит из двух нормальных нуклеотидов, и по химическому строению нельзя сказать, какой из них «неверный». Исходная последовательность восстанавливается только потому, что исправляется новая цепь, а матрица остаётся образцом.", "s1_cap_nomark": "Ошибочная пара C·A осталась, MMR её узнаёт, но разрывов в новой цепи уже нет, и в модели нельзя определить, какая цепь новая. Исправление, направленное на новую цепь, не начинается, и ошибка сохраняется до следующей репликации.", "s1_cap_nomark_z": "Узнать ошибочную пару недостаточно: нужно знать, какая цепь ошибочна. Если бы исправлялась случайная цепь, примерно в половине случаев заменялся бы нуклеотид матрицы, и изменение закреплялось бы уже при исправлении.", "s1_cap_none": "Ни коррекция, ни MMR не сработали: пара C·A осталась в новой цепи. При следующей репликации цепи расходятся, и каждая служит матрицей. Напротив A старой цепи встаёт T — эта молекула как исходная. Напротив C новой цепи встаёт G — во второй молекуле пара C–G вместо T–A.", "s1_cap_none_z": "После репликации изменённая пара комплементарна, и ни одна из двух систем её уже не узнаёт: изменение последовательности закреплено и будет передаваться при следующих репликациях. Такое закреплённое изменение и называют мутацией.", "s1b_take": "Точность копирования складывается из последовательных этапов. Напротив основания матрицы встаёт комплементарный нуклеотид; ошибку на растущем 3′-конце отщепляет корректирующая экзонуклеаза ДНК-полимеразы; пропущенную ошибку после синтеза исправляет MMR, заменяя участок новой цепи, которую узнаёт по разрыву. Ошибка спаривания ещё не мутация: она становится закреплённым изменением, только если не исправлена до следующей репликации. В этой модели отсутствие этапа оставляет ошибку; в эксперименте такой результат поддерживает необходимость этапа, если воздействие специфично, а остальные условия сохранены.", "p1b_1_q": "Условия: при копировании напротив A матрицы встал C. Коррекция 3′-конца выключена, MMR работает, в новой цепи есть разрывы. Что будет с этим местом сразу после синтеза и после следующей репликации?", "p1b_1_o1": "Ошибку исправит MMR: участок новой цепи будет заменён, и после репликации обе молекулы будут как исходная", "p1b_1_o2": "Ошибка закрепится: без коррекции полимеразой её уже ничто не исправит", "p1b_1_o3": "MMR заменит A в матрице на G, чтобы пара стала комплементарной", "p1b_1_e": "Коррекция пропустила ошибку, но MMR проверяет уже синтезированную цепь. По разрыву система узнаёт новую цепь и заменяет её участок вместе с C; по матрице снова встаёт T. После репликации обе молекулы как исходная.", "p1b_1_w2": "Коррекция — не последний этап: MMR работает после синтеза и исправляет ошибки, которые пропустила полимераза.", "p1b_1_w3": "Комплементарность восстановилась бы, но последовательность изменилась бы. MMR исправляет новую цепь, а матрицу оставляет образцом — так сохраняется исходная информация.", "p1b_2_q": "Те же условия, но разрывы в новой цепи уже сшиты: метки новой цепи нет. MMR работает. Что произойдёт в этой модели?", "p1b_2_o1": "Ошибочная пара будет узнана, но исправление новой цепи не начнётся; после репликации в одной из молекул будет пара C–G", "p1b_2_o2": "Ошибка будет исправлена так же, как с меткой, только медленнее", "p1b_2_o3": "Ошибочную пару вообще никто не заметит", "p1b_2_e": "Узнать ошибочную пару и узнать новую цепь — разные задачи. Без метки нельзя определить, какой нуклеотид пары неверный, поэтому в модели исправление новой цепи не начинается. Ошибка сохраняется и закрепляется при следующей репликации.", "p1b_2_w2": "Дело не во времени: без метки нет сведений, какая цепь новая. Исправление случайной цепи в половине случаев заменило бы нуклеотид матрицы.", "p1b_2_w3": "Белок узнавания ошибочной пары её находит: пара C·A нарушает геометрию двойной спирали. Не хватает другого — сведений о том, какая цепь новая.", "p1b_3_q": "Условия: при копировании напротив A матрицы встал C; коррекция 3′-конца и MMR выключены. В клетке ещё раз проходит репликация ДНК. Какие пары будут на этом месте в двух дочерних молекулах?", "p1b_3_o1": "T–A в одной молекуле и C–G в другой", "p1b_3_o2": "C–G в обеих молекулах", "p1b_3_o3": "T–A в обеих: при репликации полимераза поставит напротив C правильный нуклеотид T", "p1b_3_e": "Цепи расходятся, и каждая служит матрицей. Старая цепь с A даёт пару A–T, как в исходной молекуле. Новая цепь с C даёт пару C–G. Изменение есть только в одной из двух молекул, но в ней оно уже закреплено.", "p1b_3_w2": "Ошибка была только в новой цепи; старая цепь с A по-прежнему служит матрицей и даёт молекулу с исходной парой.", "p1b_3_w3": "Напротив C комплементарен G, а не T. Полимераза строит цепь по матрице: какой нуклеотид в матрице, такой и определяет пару.", "p1b_4_q": "Обратная задача. На схеме итог: после следующей репликации в одной из двух дочерних молекул пара C–G вместо T–A. Переключатели скрыты. Что можно сказать о работе систем исправления в этой клетке?", "p1b_4_o1": "Ошибку не удалила коррекция 3′-конца, и до следующей репликации её не исправила MMR", "p1b_4_o2": "Коррекция работала, не сработала только MMR", "p1b_4_o3": "Обе системы работали, а изменение возникло при второй репликации", "p1b_4_e": "Закреплённое изменение означает, что ошибочная пара C·A сохранилась до следующей репликации: её не удалила коррекция во время синтеза и не заменила MMR после него. Была ли MMR выключена или не могла определить новую цепь, по этому итогу различить нельзя.", "p1b_4_w2": "Если бы коррекция работала, неверный C был бы отщеплён ещё на 3′-конце растущей цепи, и в модели изменение не закрепилось бы.", "p1b_4_w3": "Ошибка второй репликации дала бы ошибочную пару в новой цепи одной молекулы, а на схеме пара C–G правильная: ошибка возникла раньше и при второй репликации уже служила матрицей.", "s2_les": "Повреждение в одной цепи", "s2_les_u": "урацил вместо цитозина", "s2_les_dimer": "пиримидиновый димер", "s2_les_ap": "основание утрачено (AP-сайт)", "s2_opp": "Противоположная цепь на этом участке", "s2_opp_ok": "не повреждена", "s2_opp_dmg": "тоже повреждена", "s2k_title": "Детали пути репарации", "s2k_rec": "белок узнавания", "s2k_nuc": "нуклеазы, вскрывающие цепь", "s2k_pol": "ДНК-полимераза", "s2k_lig": "ДНК-лигаза", "s2k_hint": "Уберите деталь и предскажите, на каком этапе остановится путь и что останется в ДНК. Нажатие на гнездо вынимает деталь, нажатие на деталь под гнёздами возвращает её.", "s2_pA": "А. Участок ДНК после работы пути: {p}", "s2_path_ber": "вырезание основания (BER)", "s2_path_ner": "вырезание нуклеотидов (NER)", "s2_lbl_top": "цепь без повреждения", "s2_lbl_bot": "цепь, в которой возникло повреждение", "s2_st_lesion": "повреждение осталось: его не узнали", "s2_st_ap": "основания нет, цепь не надрезана: остался AP-сайт", "s2_st_opened": "повреждение узнано, но участок не вырезан", "s2_st_gap": "пробел в цепи: участок вырезан, но не достроен", "s2_st_nick": "участок достроен, остался разрыв в одной цепи", "s2_st_restored": "исходная последовательность восстановлена по другой цепи", "s2_st_notpl": "вырезан участок, напротив которого тоже повреждение: правильной матрицы нет", "s2_pB": "Б. Этапы пути: ✓ — пройден, ✕ — остановка, — — не начат", "s2_e_ber_rec": "гликозилаза", "s2_e_ber_nuc": "AP-эндонуклеаза", "s2_e_ner_rec": "XPC и TFIIH", "s2_e_ner_nuc": "две нуклеазы", "s2_e_ber_pol": "полимераза", "s2_e_ner_pol": "полимераза", "s2_e_ber_lig": "лигаза", "s2_e_ner_lig": "лигаза", "s2_step_ber_rec": "узнаёт и удаляет\nизменённое основание", "s2_step_ber_nuc": "надрезает цепь\nу AP-сайта", "s2_step_ber_pol": "встраивает\n1 нуклеотид", "s2_step_ber_lig": "сшивает\nразрыв", "s2_step_ner_rec": "находят искажение\nи проверяют участок", "s2_step_ner_nuc": "надрезают цепь\nпо обе стороны", "s2_step_ner_pol": "достраивает около\n30 нуклеотидов", "s2_step_ner_lig": "сшивает\nразрыв", "s2_mk_skip": "не нужна", "s2_mk_notpl": "нет матрицы", "s2_r_path": "Путь", "s2_v_path_ber": "вырезание основания (BER)", "s2_v_path_ner": "вырезание нуклеотидов (NER)", "s2_r_cut": "Что удаляется", "s2_v_cut_ber": "одно основание, затем один нуклеотид", "s2_v_cut_ner": "участок цепи около 30 нуклеотидов у человека (на схеме укорочен)", "s2_r_tpl": "Матрица для достройки", "s2_v_tpl_ok": "противоположная цепь — не повреждена", "s2_v_tpl_dmg": "противоположная цепь повреждена на этом участке", "s2_r_state": "Итог", "s2_v_st_lesion": "повреждение осталось", "s2_v_st_ap": "AP-сайт", "s2_v_st_opened": "повреждение узнано, не вырезано", "s2_v_st_gap": "пробел в одной цепи", "s2_v_st_nick": "разрыв в одной цепи", "s2_v_st_restored": "исходная последовательность восстановлена", "s2_v_st_notpl": "восстановить по другой цепи нельзя", "s2_cap_ok_u": "Урацил появился в ДНК при дезаминировании цитозина: пара U·G вместо C–G. Урацил-ДНК-гликозилаза узнаёт урацил и отщепляет его от сахара — остаётся AP-сайт. AP-эндонуклеаза надрезает цепь, полимераза по G другой цепи встраивает C, лигаза сшивает разрыв. Пара C–G восстановлена.", "s2_cap_ok_u_z": "Урацила в ДНК быть не должно, поэтому его можно узнать по самому основанию. Если не удалить его до репликации, напротив U встанет A, и пара C–G в одной из дочерних молекул станет T–A после следующей репликации.", "s2_cap_ok_dimer": "Два соседних пиримидина (здесь T и T) ковалентно сшиты, например после ультрафиолета; двойная спираль на этом участке искажена. Белки узнавания (среди них XPC) находят искажение, комплекс TFIIH раскрывает участок и проверяет повреждение, две нуклеазы надрезают цепь по обе стороны, участок около 30 нуклеотидов (у человека) удаляется, полимераза достраивает его по другой цепи, лигаза сшивает.", "s2_cap_ok_dimer_z": "NER узнаёт не определённое основание, а искажение двойной спирали, поэтому один путь устраняет очень разные объёмные повреждения: димеры, крупные химические группы, присоединённые к основаниям.", "s2_cap_ok_ap": "Основание оторвалось от сахара (так чаще всего теряются пурины), остов цел — это AP-сайт. Гликозилаза здесь не нужна: AP-сайт сразу узнаёт AP-эндонуклеаза. Дальше как в BER: надрез, встраивание одного нуклеотида по другой цепи, сшивание.", "s2_cap_ok_ap_z": "AP-сайт — одновременно частое спонтанное повреждение и промежуточный продукт BER после гликозилазы: оба пути сходятся на одном этапе.", "s2_cap_lesion_ber": "Нет белка узнавания: урацил никто не находит, и он остаётся в цепи. Следующие ферменты пути на месте, но им не с чем работать: AP-эндонуклеаза узнаёт AP-сайт, а не урацил.", "s2_cap_lesion_ber_z": "Пути начинаются с узнавания повреждения; без узнавания исправные ферменты следующих этапов не включаются.", "s2_cap_lesion_ner": "Нет белка узнавания: искажение спирали не найдено, и димер остаётся. В клетке есть и второй способ узнавания — по остановившейся РНК-полимеразе в транскрибируемом гене; в базовой модели он не показан.", "s2_cap_lesion_ner_z": "Без узнавания повреждение сохраняется до репликации; при копировании напротив него может встать неверный нуклеотид.", "s2_cap_ap": "Основания нет, а цепь не надрезана: AP-эндонуклеазы нет, и AP-сайт остаётся. Если урацил был удалён гликозилазой, это значит, что узнавание произошло, а остановился следующий этап.", "s2_cap_ap_z": "Промежуточный продукт показывает, какой этап пройден и на каком путь остановился. AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности.", "s2_cap_ap_src": "Основание оторвалось само, остов цел — это AP-сайт; гликозилаза здесь не нужна. Но AP-эндонуклеазы нет, цепь не надрезана, и AP-сайт остаётся.", "s2_cap_ap_src_z": "AP-сайт не несёт информации: при копировании напротив него полимераза не может выбрать нуклеотид по комплементарности. Поэтому его нужно удалить до репликации.", "s2_cap_opened": "Повреждение узнано и участок раскрыт, но нуклеаз, надрезающих цепь, нет: димер остаётся в цепи.", "s2_cap_opened_z": "Узнать повреждение и удалить его — разные этапы; итог «повреждение осталось» ещё не говорит, какой из них не прошёл.", "s2_cap_gap_ber": "Урацил удалён, цепь надрезана, но полимеразы нет: на месте одного нуклеотида пробел.", "s2_cap_gap_ber_z": "Пробел — промежуточный продукт: повреждения уже нет, но нет и информации на этом месте. Её восстанавливают по противоположной цепи.", "s2_cap_gap_ner": "Участок с димером вырезан, но полимеразы нет: в цепи пробел около 30 нуклеотидов (на схеме укорочен).", "s2_cap_gap_ner_z": "Длинный пробел — промежуточный продукт NER; он сохраняется, пока по неповреждённой цепи не будет синтезирован новый участок.", "s2_cap_nick": "Последовательность восстановлена по другой цепи, но лигазы нет: на границе нового участка остался разрыв сахаро-фосфатного остова.", "s2_cap_nick_z": "Информация уже верна, но непрерывность цепи не восстановлена: разрыв в одной цепи — тоже промежуточный продукт, и его нужно сшить.", "s2_cap_notpl": "Повреждения в обеих цепях на одном участке: после вырезания напротив пробела тоже повреждённое основание. В модели правильной матрицы для достройки нет; в клетке на таком участке возможны изменение последовательности или разрыв обеих цепей.", "s2_cap_notpl_z": "Эксцизионная репарация точна потому, что информация записана дважды. Если обе копии на одном участке повреждены, восстановить её по этой молекуле нельзя — нужна другая молекула с той же последовательностью (вопрос 3).", "s2b_take": "Разные повреждения узнают разные белки: изменённое основание (урацил, окисленное или алкилированное) — ДНК-гликозилазы пути BER, искажение двойной спирали (пиримидиновые димеры, объёмные присоединённые группы) — белки пути NER. Дальше пути сходны: цепь надрезается, повреждённый участок удаляется (один нуклеотид или около 30), ДНК-полимераза достраивает его по неповреждённой цепи, лигаза сшивает разрыв. Исходная последовательность восстанавливается точно, потому что вторая цепь служит матрицей. В этой модели отсутствие детали останавливает путь на определённом промежуточном продукте; в эксперименте такой результат поддерживает необходимость детали при специфичности воздействия.", "p2b_1_q": "Условия: в цепи урацил вместо цитозина, вторая цепь не повреждена. Из пути убрана AP-эндонуклеаза; гликозилаза, полимераза и лигаза на месте. Что окажется в ДНК на месте урацила?", "p2b_1_o1": "AP-сайт: урацила уже нет, но цепь не надрезана", "p2b_1_o2": "Урацил: без AP-эндонуклеазы путь не начнётся", "p2b_1_o3": "Цитозин: полимераза заменит основание без надреза", "p2b_1_e": "Гликозилаза работает первой и удаляет урацил, оставляя AP-сайт. Надрезать цепь у AP-сайта некому, поэтому путь останавливается на этом промежуточном продукте.", "p2b_1_w2": "Путь начинается с гликозилазы, а она есть: урацил узнан и удалён. AP-эндонуклеаза нужна на следующем этапе.", "p2b_1_w3": "ДНК-полимераза присоединяет нуклеотид к 3′-OH в разрыве цепи; без надреза ей не к чему его присоединить.", "p2b_2_q": "Условия: в цепи AP-сайт — основание оторвалось само, остов цел. Из пути убран белок узнавания (гликозилаза), остальное на месте. Что будет?", "p2b_2_o1": "Исходная последовательность восстановится: гликозилаза для AP-сайта не нужна", "p2b_2_o2": "AP-сайт останется: без гликозилазы путь BER не начинается", "p2b_2_o3": "Участок будет удалён путём NER", "p2b_2_e": "Гликозилаза нужна, чтобы удалить изменённое основание и получить AP-сайт. Здесь AP-сайт уже есть, его узнаёт AP-эндонуклеаза, и путь проходит до конца.", "p2b_2_w2": "Путь BER можно начать и с середины: AP-сайт — общий этап для удалённых гликозилазой и для потерянных самопроизвольно оснований.", "p2b_2_w3": "AP-сайт — субстрат BER: его прямо узнаёт AP-эндонуклеаза. Путь определяется характером повреждения, а не тем, какой белок убран.", "p2b_3_q": "Условия: в цепи пиримидиновый димер, вторая цепь не повреждена. Из пути убрана ДНК-полимераза. Что останется в ДНК?", "p2b_3_o1": "Пробел в одной цепи около 30 нуклеотидов", "p2b_3_o2": "Пробел в один нуклеотид", "p2b_3_o3": "Димер: без полимеразы его не вырезают", "p2b_3_e": "Узнавание и двойной надрез прошли, участок с димером удалён. Достроить его по второй цепи некому — остаётся длинный пробел.", "p2b_3_w2": "Пробел в один нуклеотид — промежуточный продукт BER. NER удаляет участок цепи по обе стороны от искажения.", "p2b_3_w3": "Вырезание выполняют нуклеазы, а не полимераза: полимераза работает позже — заполняет пробел.", "p2b_4_q": "Условия: урацил в одной цепи, все детали пути на месте, но и в противоположной цепи напротив урацила основание повреждено. Восстановится ли исходная последовательность в этой модели?", "p2b_4_o1": "Нет: правильной матрицы на этом участке нет", "p2b_4_o2": "Да: путь BER всегда восстанавливает исходную пару", "p2b_4_o3": "Да: полимераза восстановит последовательность по соседним парам", "p2b_4_e": "Точность BER и NER держится на том, что другая цепь не повреждена и служит матрицей. Если повреждены обе копии одного участка, по этой молекуле информацию не восстановить; в клетке такие участки могут привести к изменению последовательности или к разрыву обеих цепей.", "p2b_4_w2": "Путь восстанавливает исходную пару не сам по себе, а копируя противоположную цепь. Если она повреждена, точной копии не получится.", "p2b_4_w3": "Нуклеотид определяется только основанием матрицы напротив; соседние пары ничего не говорят о том, какой нуклеотид был на этом месте.", "s3_ph": "Период клеточного цикла", "s3_ph_G1": "G1 — до репликации ДНК", "s3_ph_G2": "G2 — после репликации ДНК", "s3_end": "Концы разрыва", "s3_end_clean": "совместимые, нуклеотиды не утрачены", "s3_end_lost": "повреждены: часть нуклеотидов утрачена", "s3k_title": "Детали двух путей", "s3k_ku": "Ku — связывает концы", "s3k_lig4": "лигаза IV", "s3k_res": "нуклеазы резекции", "s3k_rad51": "RAD51 — поиск матрицы", "s3k_hint": "Уберите деталь и предскажите, каким путём и с каким результатом будет устранён разрыв. Нажатие на гнездо вынимает деталь, нажатие на деталь под гнёздами возвращает её.", "s3_pA": "А. Хромосома в клетке: период {ph}", "s3_lbl_g1": "одна молекула ДНК в хромосоме; копии этого участка в той же хромосоме нет", "s3_lbl_g2": "две сестринские хроматиды скреплены когезином (кольца)", "s3_lbl_brk": "хроматида 1", "s3_lbl_sis": "хроматида 2", "s3_lbl_whole": "целостность молекулы восстановлена", "s3_pB": "Б. Участок ДНК в месте разрыва (зелёным — синтезировано по матрице)", "s3_e_ku": "Ku", "s3_e_lig4": "лигаза IV", "s3_e_res": "резекция", "s3_e_rad51": "RAD51", "s3_st_hr": "участок восстановлен по сестринской хроматиде:\nпоследовательность как исходная", "s3_st_nhej_ok": "концы сшиты напрямую (пунктир — место соединения):\nпоследовательность как исходная", "s3_st_nhej_del": "концы сшиты напрямую: утрачены 4 пары нуклеотидов\n(рамка — место соединения)", "s3_st_stuck": "концы резецированы, но матрица не найдена:\nразрыв не устранён", "s3_st_open": "концы не соединены: разрыв остался", "s3_r_path": "Путь", "s3_v_path_hr": "гомологичная рекомбинация (HR)", "s3_v_path_nhej": "негомологичное соединение концов (NHEJ)", "s3_v_path_none": "нет", "s3_r_tpl": "Матрица", "s3_v_tpl_sis": "сестринская хроматида", "s3_v_tpl_none": "не используется: концы соединены напрямую", "s3_v_tpl_no": "не найдена", "s3_v_tpl_g1": "нет: в G1 сестринской хроматиды нет", "s3_v_tpl_nostart": "поиск не начат: концы не резецированы", "s3_r_int": "Целостность молекулы", "s3_r_int_s": "соединены ли концы", "s3_v_int_yes": "восстановлена", "s3_v_int_no": "не восстановлена", "s3_r_seq": "Последовательность в месте разрыва", "s3_v_seq_same": "как исходная", "s3_v_seq_del": "утрачено {n} пары нуклеотидов", "s3_v_seq_na": "—", "s3_cap_hr": "После репликации рядом есть сестринская хроматида с той же последовательностью. Нуклеазы резекции укорачивают 5′-концы разрыва, на одноцепочечных 3′-концах собирается RAD51, конец находит комплементарный участок сестринской хроматиды и встраивается в неё; полимераза копирует недостающий участок, лигаза сшивает. Утраченные нуклеотиды восстановлены по копии.", "s3_cap_hr_z": "Гомологичная рекомбинация точна, потому что использует матрицу — неповреждённую копию того же участка. В G2 такая копия есть: это сестринская хроматида, образовавшаяся при репликации.", "s3_cap_nhej_ok_G1": "До репликации второй копии участка в этой хромосоме нет. Белки Ku связывают оба конца и удерживают их рядом, лигаза IV сшивает. Концы совместимы, нуклеотиды не утрачены, поэтому последовательность после соединения такая же, как была.", "s3_cap_nhej_ok_G1_z": "Соединение концов без матрицы не обязательно ошибочно: если концы не повреждены и подходят друг к другу, исходная последовательность сохраняется.", "s3_cap_nhej_del_G1": "До репликации второй копии участка в этой хромосоме нет. Концы повреждены: перед сшиванием их обрабатывают, и несколько нуклеотидов утрачено. Белки Ku и лигаза IV соединяют концы — целостность молекулы восстановлена, но на месте соединения не хватает 4 пар нуклеотидов.", "s3_cap_nhej_del_G1_z": "Без матрицы утраченные нуклеотиды восстановить не по чему. Соединение возвращает целостность хромосомы, но не исходную последовательность.", "s3_cap_nhej_ok_G2": "Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы совместимы — последовательность как исходная.", "s3_cap_nhej_ok_G2_z": "Наличие матрицы ещё не означает, что её используют: для HR нужна резекция концов. В G2 работает и NHEJ.", "s3_cap_nhej_del_G2": "Сестринская хроматида есть, но концы не резецированы (нуклеаз резекции нет), и разрыв соединяет NHEJ. Концы были повреждены — на месте соединения утрачены 4 пары нуклеотидов, хотя точная копия участка находится рядом.", "s3_cap_nhej_del_G2_z": "Точность определяется не периодом цикла как таковым, а тем, используется ли матрица. Период цикла определяет, есть ли сестринская хроматида.", "s3_cap_stuck": "Концы резецированы, но без RAD51 одноцепочечный конец не спаривается с комплементарным участком сестринской хроматиды. В модели резецированные концы не соединяются и NHEJ: разрыв остаётся. В клетке такие концы могут соединить другие пути — с большей утратой нуклеотидов; в модели они не показаны.", "s3_cap_stuck_z": "Резекция — первый этап HR: после неё концы уже не подходят для прямого соединения. Поэтому нарушение позднего этапа HR может быть опаснее, чем отсутствие резекции.", "s3_cap_open": "Нет деталей NHEJ, а гомологичная рекомбинация невозможна или не начата: в модели концы не соединены. В клетке их может соединить альтернативный путь — с утратой нуклеотидов; в модели он не показан. Если разрыв сохранится до деления, фрагмент хромосомы без центромеры будет утрачен.", "s3_cap_open_z": "Разрыв обеих цепей опаснее повреждения одной цепи: на месте разрыва нет целой цепи, которая служила бы матрицей, и молекула разделена на две части.", "s3b_take": "При разрыве обеих цепей целой цепи напротив нет, поэтому для точного восстановления нужна другая молекула с той же последовательностью — гомологичная матрица. После репликации ДНК (S и G2) ею служит сестринская хроматида: гомологичная рекомбинация восстанавливает участок по копии. Негомологичное соединение концов матрицы не использует и возможно в любом периоде цикла, в G1 — основной путь: оно восстанавливает целостность хромосомы, а последовательность — только если концы совместимы и не утрачены нуклеотиды. Целостность молекулы и исходная последовательность — разные результаты. В этой модели отсутствие детали останавливает путь; в эксперименте такой результат поддерживает необходимость детали при специфичности воздействия.", "p3b_1_q": "Условия: клетка в G1, разрыв обеих цепей, все детали на месте. Концы разрыва повреждены, несколько нуклеотидов на них утрачено. Каким будет результат?", "p3b_1_o1": "Концы будут соединены, целостность молекулы восстановится, но на месте соединения не хватит нескольких пар нуклеотидов", "p3b_1_o2": "Участок будет восстановлен точно по гомологичной хромосоме", "p3b_1_o3": "Разрыв не будет устранён до репликации ДНК", "p3b_1_e": "В G1 сестринской хроматиды нет, и в модели разрыв соединяет NHEJ — без матрицы. Утраченные нуклеотиды восстановить не по чему: целостность возвращается, исходная последовательность — нет.", "p3b_1_w2": "Сестринская хроматида удерживается рядом когезином, гомологичная хромосома — обычно нет; к тому же она отличается последовательностью во многих местах. В соматических клетках для точной репарации используется в основном сестринская хроматида, а её в G1 ещё нет.", "p3b_1_w3": "NHEJ работает и в G1, причём здесь это основной путь; ждать репликации не нужно.", "p3b_2_q": "Условия: клетка в G2, сестринская хроматида рядом. Концы разрыва повреждены, несколько нуклеотидов утрачено. Нуклеаз резекции нет, остальные детали на месте. Каким будет результат в модели?", "p3b_2_o1": "Концы соединит NHEJ; на месте соединения не хватит нескольких пар нуклеотидов", "p3b_2_o2": "Участок будет восстановлен по сестринской хроматиде без потерь", "p3b_2_o3": "Разрыв останется: в G2 NHEJ не работает", "p3b_2_e": "Без резекции не образуются одноцепочечные 3′-концы, на которых собирается RAD51, и поиск матрицы не начинается. Концы связывают белки Ku, лигаза IV их сшивает — с утратой нуклеотидов. Наличие сестринской хроматиды само по себе путь не определяет: в модели HR начинается только после резекции, и при всех деталях в G2 участок восстанавливается по сестринской хроматиде.", "p3b_2_w2": "Сестринская хроматида есть, но служить матрицей она может только после резекции: RAD51 собирается на одноцепочечном 3′-конце.", "p3b_2_w3": "NHEJ работает во всех периодах клеточного цикла, в том числе в G2.", "p3b_3_q": "Условия: клетка в G2, концы разрыва повреждены. Нуклеазы резекции на месте, но убран RAD51. Что будет с разрывом в модели?", "p3b_3_o1": "Разрыв останется: концы резецированы, но матрица не найдена", "p3b_3_o2": "Разрыв соединит NHEJ с утратой нуклеотидов", "p3b_3_o3": "Участок всё равно восстановится по сестринской хроматиде", "p3b_3_e": "Резекция уже прошла: в модели резецированные концы не соединяются NHEJ, а без RAD51 они не спариваются с комплементарным участком сестринской хроматиды. Путь остановился на промежуточном этапе, и разрыв остаётся. В клетке такие концы могут соединить другие пути — с большей утратой нуклеотидов; в модели они не показаны.", "p3b_3_w2": "NHEJ соединяет нерезецированные концы; в модели после резекции концы направлены в HR.", "p3b_3_w3": "Сестринская хроматида рядом, но спаривание одноцепочечного конца с её участком обеспечивает именно RAD51.", "p3b_4_q": "Условия: клетка в G1, концы разрыва совместимые, но убраны белки Ku. Что произойдёт в модели?", "p3b_4_o1": "Концы не будут соединены: разрыв останется", "p3b_4_o2": "Концы сошьёт лигаза IV сама", "p3b_4_o3": "Разрыв будет устранён гомологичной рекомбинацией", "p3b_4_e": "Ku связывает концы разрыва и удерживает их рядом — с этого начинается NHEJ. В G1 сестринской хроматиды нет, HR невозможна, и в модели разрыв остаётся. В клетке без Ku концы может соединить альтернативный путь — с утратой нуклеотидов; в модели он не показан.", "p3b_4_w2": "Лигаза IV соединяет концы, которые уже сведены вместе; в модели без Ku концы не удерживаются рядом.", "p3b_4_w3": "Для HR нужна гомологичная матрица — в G1 сестринской хроматиды ещё нет.", "s4_tel": "Теломераза", "s4_tel_off": "неактивна (как в большинстве соматических клеток)", "s4_tel_on": "активна (как в половых и многих стволовых клетках)", "s4_fill": "Достройка C-цепи после теломеразы", "s4_fill_yes": "есть", "s4_fill_no": "нет", "s4_fnote": "Достраивать нечего: без теломеразы G-цепь не удлинена.", "s4_shel": "Шелтерин (защитный белковый комплекс теломеры)", "s4_shel_yes": "есть", "s4_shel_no": "нет", "s4_pA": "А. Конец хромосомы: G-цепь сверху, C-цепь снизу (условные повторы)", "s4_lbl_before": "до репликации: G-цепь длиннее, 3′-выступ (рамка)", "s4_lbl_after": "после репликации: новая C-цепь (светлая) у конца не достроена", "s4_lbl_lost": "не скопировано", "s4_lbl_notel": "теломеразы нет: двуцепочечная часть конца стала короче", "s4_lbl_telfill": "теломераза удлинила G-цепь, C-цепь достроена", "s4_lbl_telnofill": "теломераза удлинила G-цепь, C-цепь не достроена", "s4_lbl_rna": "РНК-матрица", "s4_e_tert": "теломераза", "s4_pB": "Б. Распознаётся ли конец как разрыв", "s4_lbl_shel": "овалы — шелтерин на повторах;\n3′-выступ встроен в двойную спираль (t-петля)", "s4_lbl_prot": "конец защищён", "s4_lbl_unprot": "конец открыт: его узнают как разрыв обеих цепей", "s4_e_rec": "Ku (NHEJ)", "s4_r_ds": "Двуцепочечная часть теломеры", "s4_r_ds_s": "условные повторы: было {c0}", "s4_v_ds_short": "{c} — короче на 1", "s4_v_ds_same": "{c} — как до репликации", "s4_r_over": "3′-выступ G-цепи", "s4_r_over_s": "условные повторы: до репликации 3", "s4_v_over": "{n}", "s4_r_prot": "Конец распознаётся как разрыв", "s4_v_prot_yes": "нет: защищён", "s4_v_prot_no": "да: сигнал повреждения, возможно слияние концов", "s4_cap_off_prot": "Новая цепь растёт только 5′→3′ от затравки. У этого конца новой цепью стала C-цепь: её последний фрагмент начинается с РНК-затравки, а напротив 3′-выступа затравки не синтезируются; после удаления затравки остаётся незаполненный участок. У другого конца новая G-цепь доходит до самого края, и чтобы снова образовался 3′-выступ, нуклеазы укорачивают 5′-конец C-цепи. В обоих случаях конец становится короче.", "s4_cap_off_prot_z": "Укорочение следует из устройства ДНК-полимеразы: она лишь удлиняет имеющийся 3′-конец. Пока теряются повторы теломеры, гены не затрагиваются; но без теломеразы теломеры укорачиваются при каждом делении — в клетках человека в культуре на десятки–сотни нуклеотидов.", "s4_cap_off_unprot": "Конец укоротился, как без теломеразы, а шелтерина нет: 3′-выступ не встроен в двойную спираль, и белки, узнающие разрывы, связываются с концом. Возникает ответ, как на разрыв обеих цепей; NHEJ может сшить концы разных хромосом.", "s4_cap_off_unprot_z": "Защита конца не зависит от одной его длины: даже длинная теломера без шелтерина распознаётся как разрыв.", "s4_cap_on_prot": "Теломераза узнаёт 3′-конец G-цепи, спаривает с ним свою РНК и по ней присоединяет к нему повторы TTAGGG, используя dNTP. Затем ДНК-полимераза α с праймазой достраивает C-цепь по удлинённой G-цепи. Двуцепочечная часть восстановлена до исходной длины, G-цепь удлинена, и 3′-выступ есть (его длина на схеме условная); шелтерин защищает конец.", "s4_cap_on_prot_z": "Белок теломеразы — обратная транскриптаза: ДНК по РНК. Теломераза удлиняет только G-цепь; C-цепь достраивают обычные ферменты репликации. Высокая активность теломеразы — в половых и многих стволовых клетках; в большинстве соматических клеток она низкая.", "s4_cap_on_unprot": "Длину конца теломераза восстановила, но шелтерина нет: конец открыт и распознаётся как разрыв обеих цепей.", "s4_cap_on_unprot_z": "Поддержание длины и защита конца — разные функции: теломераза отвечает за первое, шелтерин — за второе.", "s4_cap_nofill_prot": "Теломераза удлинила G-цепь, но C-цепь не достроена: длинный одноцепочечный 3′-выступ, а двуцепочечная часть такая же короткая, как без теломеразы.", "s4_cap_nofill_prot_z": "Работа теломеразы восстанавливает длину только вместе с достройкой C-цепи: теломераза наращивает одну цепь, вторую синтезирует полимераза α с праймазой.", "s4_cap_nofill_unprot": "Теломераза удлинила G-цепь, C-цепь не достроена, шелтерина нет: длинный одноцепочечный участок открыт и распознаётся как повреждение.", "s4_cap_nofill_unprot_z": "Длинная одноцепочечная ДНК без защиты — сигнал повреждения для клетки (подробнее — в курсе «Молекулярная биология»).", "s4b_take": "Конец линейной ДНК при репликации копируется не полностью: новая цепь растёт только 5′→3′ от затравки, и у конца остаётся неотстроенный участок, а восстановление 3′-выступа требует укоротить 5′-конец C-цепи. Поэтому без теломеразы теломеры укорачиваются при каждом делении. Теломераза удлиняет 3′-конец G-цепи по собственной РНК-матрице, а C-цепь достраивают ДНК-полимераза α с праймазой. Шелтерин, удерживающий 3′-выступ в двойной спирали (t-петля), защищает естественный конец от узнавания как разрыв. В этой модели отсутствие шелтерина делает конец «разрывом» независимо от длины; в эксперименте такой результат поддерживает необходимость белка при специфичности воздействия.", "p4b_1_q": "Условия: соматическая клетка без активной теломеразы, шелтерин на месте. В клетке проходит репликация ДНК. Что произойдёт с концом хромосомы?", "p4b_1_o1": "Двуцепочечная часть теломеры станет короче", "p4b_1_o2": "Ничего: ДНК-полимераза копирует обе цепи до самого конца", "p4b_1_o3": "Конец будет распознан как разрыв и сшит с другой хромосомой", "p4b_1_e": "ДНК-полимераза удлиняет только имеющийся 3′-конец, поэтому новая цепь у конца хромосомы не доходит до края, а восстановление 3′-выступа укорачивает C-цепь. Конец становится короче, но шелтерин по-прежнему его защищает.", "p4b_1_w2": "Для начала синтеза нужна затравка с 3′-OH; у самого конца для последнего фрагмента её нет, и участок остаётся не скопирован.", "p4b_1_w3": "Шелтерин на месте, и конец защищён: одно укорочение на условный повтор не лишает его защиты.", "p4b_2_q": "Теперь в клетке активна теломераза, C-цепь достраивается. Что произойдёт с концом после репликации?", "p4b_2_o1": "Длина восстановится: теломераза удлинит G-цепь, C-цепь будет достроена по ней", "p4b_2_o2": "Теломераза достроит недостающий участок C-цепи по G-цепи", "p4b_2_o3": "Теломераза удлинит обе цепи одновременно", "p4b_2_e": "Теломераза присоединяет повторы к 3′-концу G-цепи, используя собственную РНК как матрицу. Удлинённая G-цепь служит матрицей для C-цепи, которую синтезируют ДНК-полимераза α с праймазой.", "p4b_2_w2": "Теломераза синтезирует ДНК по РНК-матрице и удлиняет только 3′-конец G-цепи; C-цепь достраивают другие ферменты.", "p4b_2_w3": "Матрица теломеразы — G-богатый участок её РНК; C-цепь теломераза не синтезирует.", "p4b_3_q": "Теломераза активна, но достройки C-цепи нет. Какая теломера получится?", "p4b_3_o1": "Длинный одноцепочечный 3′-выступ при укороченной двуцепочечной части", "p4b_3_o2": "Такая же, как при достройке: теломераза восстанавливает длину сама", "p4b_3_o3": "Короче, чем без теломеразы", "p4b_3_e": "G-цепь удлинена, но комплементарную ей C-цепь никто не синтезировал: выступ растёт, а двуцепочечная часть остаётся короткой.", "p4b_3_w2": "Теломераза удлиняет одну цепь; двуцепочечная часть восстанавливается только после синтеза C-цепи.", "p4b_3_w3": "Теломераза ничего не отнимает: G-цепь даже длиннее, не хватает только C-цепи.", "p4b_4_q": "Теломераза активна, C-цепь достраивается, но шелтерина нет. Что будет с концом?", "p4b_4_o1": "Длина сохранится, но конец распознают как разрыв", "p4b_4_o2": "Конец защищён, потому что теломера длинная", "p4b_4_o3": "Теломераза не сможет работать, и конец укоротится", "p4b_4_e": "Длину поддерживает теломераза, защиту — шелтерин. Без шелтерина 3′-выступ не встроен в двойную спираль, и белки, узнающие разрывы, связываются с концом при любой длине.", "p4b_4_w2": "Длина сама по себе не защищает: защищает определённая структура конца, которую поддерживает шелтерин.", "p4b_4_w3": "В модели теломераза работает независимо от шелтерина; в клетке шелтерин участвует и в привлечении теломеразы — этот уровень регуляции модель не показывает.", "a_prob_t": "Исследование", "a_lim_t": "Чего модель не показывает", "a_new_t": "Новые данные и как это установили", "a_how_t": "Как это установили:", "hint_btn": "Подсказка {i} из {n}", "hint_n": "Подсказка {i}.", "s1a_prob": "Ни один этап проверки не исправляет все ошибки. Почему вместе несколько несовершенных этапов дают высокую точность — и можно ли по итоговому числу ошибок понять, какой этап ослаб?", "s1a_e": "Ошибки при выборе нуклеотида (условно)", "s1a_e_4": "1 на 10 000", "s1a_e_5": "1 на 100 000", "s1a_p": "Коррекция 3′-конца исправляет", "s1a_p_0": "0 %", "s1a_p_90": "90 %", "s1a_p_99": "99 %", "s1a_m": "MMR исправляет оставшиеся", "s1a_m_0": "0 %", "s1a_m_99": "99 %", "s1a_m_999": "99,9 %", "s1a_t": "MMR успевает до следующей репликации", "s1a_t_yes": "да", "s1a_t_no": "нет", "s1a_note": "Копируется условно 10 млрд нуклеотидов. Все проценты и частоты — учебные значения модели, а не измеренные величины. Каждый этап работает с ошибками, которые пропустил предыдущий; в модели доля исправленных не зависит от того, сколько ошибок дошло до этапа.", "s1a_pA": "А. Ошибки после каждого этапа (условные числа)", "s1a_ax_log": "шкала логарифмическая", "s1a_bar_arisen": "возникло", "s1a_bar_afterP": "после коррекции", "s1a_bar_afterM": "после MMR", "s1a_bar_fixed": "закрепилось", "s1a_f_p": "коррекция: −{p} %", "s1a_f_p0": "коррекции нет", "s1a_f_m": "MMR: −{m} %", "s1a_f_m0": "MMR нет", "s1a_f_m_late": "MMR не успела", "s1a_f_t_yes": "репликация", "s1a_f_t_no": "репликация до MMR", "s1a_pB": "Б. Итог копирования", "s1a_lbl_rate": "Закрепилось {k} изменений на 10¹⁰ нуклеотидов — около 1 на 10{e}", "s1a_lbl_factor": "Два этапа исправления вместе снизили число ошибок в {x} раз", "s1a_lbl_factor1": "Исправление снизило число ошибок в {x} раз", "s1a_lbl_factor0": "Исправления не было: закрепились все ошибки выбора", "s1a_lbl_mask": "Наблюдение: известно только итоговое число закреплённых изменений", "s1a_r_arisen": "Возникло ошибок", "s1a_r_arisen_s": "при выборе нуклеотида, на 10¹⁰ присоединений", "s1a_r_afterP": "Осталось после коррекции", "s1a_r_afterM": "Осталось после MMR", "s1a_r_fixed": "Закрепилось после репликации", "s1a_r_fixed_s": "каждое — в одной из двух дочерних молекул", "s1a_v_n": "{n}", "s1a_cap_norm": "Этапы работают последовательно: коррекция исправляет часть возникших ошибок, MMR — часть оставшихся. Поэтому доли пропущенных ошибок перемножаются, и вместе этапы снижают число ошибок в {x} раз — больше, чем любой из них по отдельности.", "s1a_cap_norm_z": "При последовательных этапах высокая точность не требует совершенства каждого: достаточно, чтобы каждый пропускал лишь часть ошибок. Зато ослабление любого этапа увеличивает итог во столько раз, во сколько выросла доля пропущенных им ошибок.", "s1a_cap_late": "MMR не успела исправить ошибки до следующей репликации: всё, что прошло коррекцию, закрепилось. Время работы этапа так же важно, как его эффективность.", "s1a_cap_late0": "Коррекции нет, а MMR не успела исправить ошибки до следующей репликации: закрепились все ошибки выбора нуклеотида. Время работы этапа так же важно, как его эффективность.", "s1a_cap_late0_z": "Ошибочная пара — временное состояние: после репликации она превращается в обычную пару в одной из молекул, и MMR её уже не узнаёт.", "s1a_cap_late_z": "Ошибочная пара — временное состояние: после репликации она превращается в обычную пару в одной из молекул, и MMR её уже не узнаёт.", "s1a_cap_none": "Обе системы исправления выключены: закрепляются все ошибки выбора нуклеотида.", "s1a_cap_none_z": "Одной комплементарности недостаточно для точности копирования генома: даже 1 ошибка на 10 000 присоединений дала бы на копию 10 млрд нуклеотидов около миллиона изменений.", "s1a_cap_onlyp": "Работает только коррекция 3′-конца: она снизила число ошибок в {x} раз. Всё, что она пропустила, закрепляется при репликации — второго этапа нет.", "s1a_cap_onlyp_z": "Каждый этап снижает итог во столько раз, во сколько уменьшает число ошибок; без MMR итог больше ровно во столько раз, во сколько MMR его снижала.", "s1a_cap_onlym": "Коррекции нет, работает только MMR: она снизила число ошибок в {x} раз. Все ошибки выбора доходят до MMR, и её доля пропущенных определяет итог.", "s1a_cap_onlym_z": "В модели итог при одном этапе больше, чем при том же этапе вместе с другим: второй этап работает с ошибками, которые пропустил первый.", "s1a_cap_mask": "Обратная задача: известно только, сколько изменений закрепилось. Переключатели скрыты.", "s1a_cap_mask_z": "Подумайте, сколько разных сочетаний этапов дают такой же итог.", "s1a_take": "Несколько несовершенных этапов, работающих последовательно, вместе обеспечивают высокую точность: доли пропущенных ошибок перемножаются. Поэтому ослабление одного этапа увеличивает итоговое число ошибок во много раз, а время тоже имеет значение — ошибка, не исправленная до репликации, закрепляется. Одно итоговое число не указывает на причину: одинаковый результат дают разные сочетания этапов. Различить их можно по дополнительным наблюдениям — числу ошибочных пар до работы MMR или по типу оставшихся изменений.", "s1a_lim": "Модель не показывает, что эффективность этапов различается для разных ошибок: одни ошибочные пары полимераза делает и исправляет легче других, а в повторах одного нуклеотида чаще возникают вставки и выпадения. Модель считает этапы независимыми; в клетке они связаны (MMR узнаёт новую цепь по разрывам, которые оставляет синтез). Модель не учитывает повреждения ДНК и ошибки при их репарации, а также то, что изменение может не повлиять на белок. Проценты и частоты модели — учебные, а не измеренные для клеток человека.", "s1a_new": "Если этапы исправления работают последовательно, ослабление двух этапов сразу должно увеличить число новых мутаций сильнее, чем ослабление каждого из них. В культуре опухолевых клеток мыши одновременно разрушали белок MMR (Msh2) и вызывали синтез мутантной полимеразы ε с нарушенной коррекцией; собственная нормальная полимераза ε в клетках оставалась. При двух воздействиях вместе клоны, устойчивые к токсичному веществу, появлялись заметно чаще, чем при каждом отдельно. Это согласуется с моделью последовательных барьеров.", "s1a_how": "белок MMR разрушали по команде (добавлением вещества в среду), мутантную полимеразу включали отдельно и подсчитывали клоны, устойчивые к веществу. Частота устойчивых клонов — косвенный показатель частоты мутаций, а не их прямой подсчёт; данные получены на одной линии клеток мыши.", "p1a_1_q": "Условия: ошибки выбора — 1 на 10 000, коррекция исправляет 99 %, MMR — 99 %, MMR успевает до репликации. Закрепляется 100 изменений. Во сколько раз изменится итог, если выключить MMR?", "p1a_1_o1": "Увеличится в 100 раз:
