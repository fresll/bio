let revA11yT = 0;
function revLater(){ if (!revA11yT) revA11yT = setTimeout(() => { revA11yT = 0; revA11y(); revTake(); }, 250); }
/* «↓ К выводу»: на компьютере правая колонка прокручивается отдельно; кнопка видна, пока вывод ниже видимой части */
let revTakeT = 0;
function revTakeSoon(){ if (revTakeT) return; revTakeT = requestAnimationFrame(() => { revTakeT = 0; revTake(); }); }
function revTake(){
  const desk = !window.matchMedia || matchMedia('(min-width:1001px)').matches;
  document.querySelectorAll('#scenes .scene:not([hidden]) .side').forEach(sd => {

function revInit(){

    b.onclick = () => { sd.scrollTo({ top: sd.scrollTop + tk.getBoundingClientRect().top - sd.getBoundingClientRect().top - 8, behavior: 'smooth' }); tk.focus({ preventScroll: true }); };
    sd.appendChild(b);

  window.addEventListener('resize', revTakeSoon);
  /* подсказка над увеличенной схемой; на телефоне схема по умолчанию увеличена — подписи читаются без ручного увеличения */
  document.querySelectorAll('#scenes .stage').forEach(st => {

      const zw = b.closest('.stage').querySelector('.zwrap');   /* увеличенная схема по умолчанию открывается с левого верхнего угла */

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      h += TEXTS.sn_next_ready === '1' ? `<a class="sn-next" href="${abs}seminar-${TEXTS.sn_next_n}.html${fx}">${inner}</a>` : `<div class="sn-soon">${inner}</div>`;

/* =====================================================================
   s0_gn.js — общие детали схем семинара 8 «Сохранность генома». Общие для практикума и «Объяснений».
   Условности (как в семинаре 7): тёмно-синяя цепь — матрица (старая цепь), светло-синяя — новая цепь,
   оранжевая — РНК. Три состояния ДНК различаются цветом и формой (решение семинара 8):
     повреждение — красная заливка основания (DMG);
     промежуточный продукт репарации — янтарный пунктир или полый кружок (INT): AP-сайт, пробел, разрыв в одной цепи;
     восстановленный участок — зелёный отрезок цепи (OK);
     ошибочная пара — красное кольцо вокруг пары; закреплённое изменение — фиолетовая пунктирная рамка (MUT).
   Это схемы, не химические формулы. Функции возвращают строку SVG; русского текста здесь нет (подписи — через t()).
   Группы data-g — справка по детали (термины словаря: gn_<g>, g_<g>).
   ===================================================================== */
const GN = (function () {
  const C = { old: '#1F3B73', neu: '#8DB4E2', neuD: '#4F86C6', rna: '#E8912A', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',
    dmg: '#C0392B', int: '#C77700', ok: '#2E9B57', mut: '#7D2E8E', pol: '#7C4DBE', muts: '#B8860B', nuc: '#5E6E80', lig: '#D9579B',
    gly: '#2C7FB8', ku: '#1F8A8A', rad: '#B85C00', shel: '#3D5A99', tert: '#6A3FA0', coh: '#8A5A12', panel: '#F4F7FA', line: '#D3DAE3' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* подпись: anchor m — по центру, l — слева, r — справа; o.w — жирность, o.size, o.col; o.bg — белая подложка под текстом */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const t = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a}"${o.it ? ' font-style="italic"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return t;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + t;
  }
  /* многострочная подпись: строки через «\n» */
  function textN(x, y, s, o = {}) {
    return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join('');
  }
  /* заголовок панели «А. …» */
  function panel(x, y, w, h, title) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${C.panel}" stroke="${C.line}"/>` + text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted });
  }
  function arrow(x1, y1, x2, y2, col = C.muted, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
    const p1 = [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], p2 = [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)];
    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* фермент: овал с короткой подписью (подпись — уже переведённая строка) */
  function blob(x, y, w, h, col, g, label, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2)}" fill="${col}" opacity="${o.op || .93}" stroke="#fff" stroke-width="1.5"/>` +
      (label ? text(x, y + 1, label, { size: o.size || 12.5, w: 700, col: '#fff' }) : ''));
  }
  /* --- двойная цепь ДНК с буквами ---
     d: { x, y, dx, top: 'GACT…', bot: 'CTGA…', mark: {i: тип}, botFrom, botTo (видимая часть новой цепи), botCol, topCol,
          patch: [a, b] — зелёный восстановленный участок нижней цепи, gapB: [a, b] — пробел в нижней цепи, nickB: i — разрыв после позиции i,
          lbl: { tl, tr, bl, br } — концевые подписи 3′/5′, gTop, gBot — data-g цепей }
     типы меток: 'mis' — ошибочная пара (красное кольцо); 'dmgT' / 'dmgB' — повреждённое основание сверху/снизу (красная заливка);
     'apT' / 'apB' — основания нет (AP-сайт, полый янтарный кружок); 'mut' — закреплённое изменение (фиолетовая рамка);
     'okT' / 'okB' — восстановленное основание (зелёная рамка); 'dimer' — пиримидиновый димер на верхней цепи (две соседние позиции, красная скобка) */
  function duplex(d) {
    const n = Math.max(d.top.length, d.bot.length), dx = d.dx || 36, x0 = d.x, y = d.y, yT = y - 26, yB = y + 26;
    const X = i => x0 + i * dx;
    const bf = d.botFrom == null ? 0 : d.botFrom, bt = d.botTo == null ? n - 1 : d.botTo;
    let s = '';
    /* остовы */
    const tf = d.topFrom == null ? 0 : d.topFrom, tt = d.topTo == null ? n - 1 : d.topTo;
    s += G(d.gTop || 'template', line(X(tf) - dx * .45, yT, X(tt) + dx * .45, yT, d.topCol || C.old, 6));
    const segs = [];
    let a = bf;
    const cuts = [];
    if (d.gapB) cuts.push([d.gapB[0], d.gapB[1]]);
    for (let i = bf; i <= bt; i++) {
      const inGap = cuts.some(([p, q]) => i >= p && i <= q);
      if (inGap) { if (i > a) segs.push([a, i - 1]); a = i + 1; }
    }
    if (a <= bt) segs.push([a, bt]);
    const botCol = d.botCol || C.neu;
    for (const [p, q] of segs) {
      let xa = X(p) - dx * .45, xb = X(q) + dx * .45;
      s += G(d.gBot || 'newstrand', line(xa, yB, xb, yB, botCol, 6));
    }
    if (d.gapB) {
      const xa = X(d.gapB[0]) - dx * .45, xb = X(d.gapB[1]) + dx * .45;
      s += G('gap', line(xa + 3, yB, xb - 3, yB, C.int, 2.4, 'stroke-dasharray="5 4"'));
    }
    if (d.patch) {
      const xa = X(d.patch[0]) - dx * .45, xb = X(d.patch[1]) + dx * .45;
      s += G('patch', line(xa, yB, xb, yB, C.ok, 6));
    }
    if (d.nickB != null) {
      const xn = X(d.nickB) + dx * .5;
      s += `<rect x="${f(xn - 3.5)}" y="${f(yB - 5)}" width="7" height="10" fill="#fff"/>` +
        G('nick', `<line x1="${f(xn)}" y1="${f(yB - 10)}" x2="${f(xn)}" y2="${f(yB + 10)}" stroke="${C.int}" stroke-width="2.6"/>`);
    }
    if (d.patchT) {
      const xa = X(d.patchT[0]) - dx * .45, xb = X(d.patchT[1]) + dx * .45;
      s += G('patch', line(xa, yT, xb, yT, C.ok, 6));
    }
    /* основания и пары */
    for (let i = 0; i < n; i++) {
      const T = (i >= tf && i <= tt && d.top[i] !== ' ') ? (d.top[i] || '') : '', B = (i >= bf && i <= bt && !(d.gapB && i >= d.gapB[0] && i <= d.gapB[1])) ? (d.bot[i] || '') : '';
      const m = (d.mark || {})[i];
      const x = X(i);
      if (T && B && m !== 'mis' && m !== 'apT' && m !== 'apB' && m !== 'dimer') s += line(x, y - 6, x, y + 6, C.rung, 1.6, 'stroke-dasharray="2.5 2.5"');
      if (m === 'apT') s += G('apsite', `<circle cx="${f(x)}" cy="${f(y - 12)}" r="9" fill="#fff" stroke="${C.int}" stroke-width="2.4"/>`);
      else if (T) s += baseL(x, y - 13, T, m === 'dmgT' || m === 'dimer' ? 'dmg' : m === 'okT' ? 'ok' : null);
      if (m === 'apB') s += G('apsite', `<circle cx="${f(x)}" cy="${f(y + 12)}" r="9" fill="#fff" stroke="${C.int}" stroke-width="2.4"/>`);
      else if (B) s += baseL(x, y + 13, B, m === 'dmgB' ? 'dmg' : m === 'okB' ? 'ok' : null);
      if (m === 'mis') s += G('mismatch', `<ellipse cx="${f(x)}" cy="${f(y)}" rx="16" ry="29" fill="none" stroke="${C.dmg}" stroke-width="2.6"/>`);
      if (m === 'mut') s += G('mutation', `<rect x="${f(x - 16)}" y="${f(y - 30)}" width="32" height="60" rx="6" fill="none" stroke="${C.mut}" stroke-width="2.6" stroke-dasharray="5 3"/>`);
    }
    if (d.dimerAt != null) {
      const x = X(d.dimerAt), x2 = X(d.dimerAt + 1);
      s += G('dimer', `<path d="M${f(x - 8)},${f(y - 30)} L${f(x - 8)},${f(y - 37)} L${f(x2 + 8)},${f(y - 37)} L${f(x2 + 8)},${f(y - 30)}" fill="none" stroke="${C.dmg}" stroke-width="3"/>`);
    }
    /* концевые подписи */
    const L = d.lbl || {};
    if (L.tl) s += text(X(tf) - dx * .45 - 8, yT, L.tl, { a: 'r', size: 12, w: 700 });
    if (L.tr) s += text(X(tt) + dx * .45 + 8, yT, L.tr, { a: 'l', size: 12, w: 700 });
    if (L.bl && bf === 0) s += text(X(0) - dx * .45 - 8, yB, L.bl, { a: 'r', size: 12, w: 700 });
    if (L.br) s += text(X(bt) + dx * .45 + 8, yB, L.br, { a: 'l', size: 12, w: 700 });
    return s;
  }
  /* основание: буква в маленьком скруглённом квадрате; kind: dmg — повреждено (красная заливка), ok — восстановлено (зелёная рамка) */
  function baseL(x, y, Lt, kind) {

GN.a1 = (function () {
  const { C, text, panel, line, f, G, arrow } = GN;
  const N = 1e10;
  const E = { '4': 1e-4, '5': 1e-5 }, P = { '0': 0, '90': .9, '99': .99 }, M = { '0': 0, '99': .99, '999': .999 };
  /* e — ошибки выбора нуклеотида (1 на 10⁴ / 10⁵); pr — доля, исправленная коррекцией; mm — доля, исправленная MMR; tm — MMR успевает до удвоения */
  function model(e, pr, mm, tm) {
    const arisen = Math.round(N * E[e]);
    const afterP = Math.round(arisen * (1 - P[pr]));
    const afterM = tm === 'yes' ? Math.round(afterP * (1 - M[mm])) : afterP;
    const fixed = afterM;
    const exp = Math.log10(N / Math.max(fixed, 1));
    const nStages = (pr !== '0' ? 1 : 0) + (mm !== '0' && tm === 'yes' ? 1 : 0);   /* сколько этапов исправления реально сработало */
    return { e, pr, mm, tm, N, arisen, afterP, afterM, fixed, factor: arisen / Math.max(fixed, 1), exp, nStages };

  /* T — кадр анимации (v1.1.1, паспорт 5.1): этап k (T ∈ (k−1, k]) — столбец k; столбец 1 растёт от нуля, следующие —

     итоговая строка — в конце (T = 4). Без T (или T ≥ 4) — статичная схема. */
  function draw(o, t, mask, T) {
    const anim = typeof T === 'number' && T < 4 - 1e-6 && !mask;
    let s = panel(16, 22, 568, 322, t('s1a_pA'));
    s += text(572, 38, t('s1a_ax_log'), { a: 'r', size: 11.5, col: C.muted });
    /* логарифмическая шкала: 10⁰…10⁶ */
    const x0 = 100, y0 = 280, H = 196, lv = v => y0 - H * Math.log10(Math.max(v, 1)) / 6;
    for (let k = 0; k <= 6; k++) {
      const y = y0 - H * k / 6;
      s += line(x0 - 6, y, 560, y, '#E3E8EF', 1, '');
      s += text(x0 - 12, y, k === 0 ? '1' : '10' + '⁰¹²³⁴⁵⁶'[k], { a: 'r', size: 12, col: C.muted });
    }

    const bw = 72, gap = mask ? 0 : 42, xs = mask ? [292] : [128, 128 + bw + gap, 128 + 2 * (bw + gap), 128 + 3 * (bw + gap)];
    const ease = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
    bars.forEach(([k, v, col], i) => {

        const u = ease(T - i), y1 = i ? lv(bars[i - 1][1]) : y0; y = y1 + (lv(v) - y1) * u; ready = T >= i + 1 - 1e-6;

      if (ready) s += text(x + bw / 2, y - 12, num(v), { size: 13.5, w: 700 });
      s += text(x + bw / 2, y0 + 16, t('s1a_bar_' + k), { size: 12.5, col: C.ink });
    });
    if (!mask) {
      if (!anim || T > 1) s += text(xs[0] + bw + gap / 2, y0 + 40, (o.pr === '0' ? t('s1a_f_p0') : t('s1a_f_p', { p: o.pr })), { size: 12, col: C.muted, bg: true });
      if (!anim || T > 2) s += text(xs[1] + bw + gap / 2, y0 + 40, o.mm === '0' ? t('s1a_f_m0') : o.tm === 'no' ? t('s1a_f_m_late') : t('s1a_f_m', { m: o.mm === '999' ? '99,9' : o.mm }), { size: 12, col: C.muted, bg: true });
      if (!anim || T > 3) s += text(xs[2] + bw + gap / 2, y0 + 40, t(o.tm === 'yes' ? 's1a_f_t_yes' : 's1a_f_t_no'), { size: 12, col: C.muted, bg: true });
    }
    s += panel(16, 352, 568, 58, '');
    if (anim) return s;   /* итог — после этапа 4 */
    const sup = x => String(Math.round(x)).replace(/[0-9]/g, c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]);
    s += text(300, 372, t('s1a_lbl_rate', { k: num(o.fixed), e: sup(o.exp) }), { size: 14, w: 600 });
    s += text(300, 396, mask ? t('s1a_lbl_mask') : t('s1a_lbl_factor' + (o.nStages === 2 ? '' : o.nStages), { x: num(Math.round(o.factor)) }), { size: 13, col: C.muted });

  return { model, draw, view, num, stageKeys };
})();

GN.a2 = (function () {
  const { C, text, textN, panel, line, f, G, arrow } = GN;
  /* lesion: 'u' | 'dimer'; block: 'none' | 'rec' | 'nuc' | 'pol' | 'lig'; alt: 'no' | 'yes' (второй путь узнавания) */
  const ALT = { u: 60, dimer: 20 };   /* условные доли, восстановленные вторым путём узнавания за время наблюдения */
  function model(lesion, block, alt) {
    const r = { lesion: 0, recog: 0, ap: 0, gap: 0, nick: 0, ok: 0 };
    if (block === 'none') r.ok = 100;
    else if (block === 'rec') { if (alt === 'yes') { r.ok = ALT[lesion]; r.lesion = 100 - ALT[lesion]; } else r.lesion = 100; }
    else if (block === 'nuc') { if (lesion === 'u') r.ap = 100; else r.recog = 100; }
    else if (block === 'pol') r.gap = 100;
    else r.nick = 100;
    const inter = r.ap + r.gap + r.nick;   /* узнанное, но не вырезанное повреждение (recog) остаётся повреждением на месте */
    const kind = r.ap ? 'ap' : r.gap ? 'gap' : r.nick ? 'nick' : null;

  }
  /* анимация (v1.1.2, паспорт 5.2): этап 0 — возникли 100 условных повреждений; этап k = 1…4 — переход из состояния k−1 цепочки
     в состояние k (узнавание, вскрытие цепи, синтез, сшивание). Путь идёт до остановленного этапа; при «другом пути узнавания»
     этап 1 переносит условную долю ALT прямо в «восстановлено» (зелёная дуга). При T = конец — статичная схема. */
  const BOX = { ber: ['lesion', 'ap', 'gap', 'nick', 'ok'], ner: ['lesion', 'recog', 'gap', 'nick', 'ok'] };
  const end = o => o.block === 'none' ? 5 : o.block === 'rec' ? (o.alt === 'yes' ? 2 : 1) : 1 + ['rec', 'nuc', 'pol', 'lig'].indexOf(o.block);

    }
    return r;
  }
  const stageKeys = o => ['s2a_tl_0', o.block === 'rec' && o.alt === 'yes' ? 's2a_tl_rec_alt' : 's2a_tl_rec_' + o.path, 's2a_tl_nuc_' + o.path, 's2a_tl_pol', 's2a_tl_lig'];
  const stopKey = o => o.block === 'none' ? null : o.block === 'rec' ? 's2a_tl_stop_rec' + (o.alt === 'yes' ? '_alt' : '') : o.block === 'nuc' ? 's2a_tl_stop_nuc_' + o.path : 's2a_tl_stop_' + o.block;

        `<rect x="${f(x)}" y="${f(y - 20)}" width="${f(w)}" height="40" fill="${col}" opacity="${k === 'inter' ? .55 : .8}" ${k === 'inter' ? `stroke="${C.int}" stroke-width="2" stroke-dasharray="5 3"` : ''}/>`);

    s += text(300, 158, t('s2a_lbl_100'), { size: 12, col: C.muted });

        if (blocked && !mask) s += text(cx + 57, cy - 17, '✕', { size: 18, w: 700, col: C.dmg });   /* v1.2 (И-11): у самой стрелки, ниже дуги второго пути */
      }

    return s;
  }

  const stageKeys = o => ['s1t_1', o.proof === 'on' ? 's1t_2_on' : 's1t_2_off', 's1t_3_' + o.state, o.fixed ? 's1t_4_fixed' : 's1t_4_same'];
  const view = (args, t) => draw(model(...args), t);
  return { model, draw, drawA, drawB, frame, stageKeys, view, TPL, NEW, E };
})();

/* =====================================================================
   s0_gn_s2.js — вкладка 2 «Повреждения и эксцизионная репарация» (базовая сцена 2b).
   Модель (MBoC7, с. 286–290; Beard et al. 2019; Kim et al. 2023): урацил и AP-сайт удаляются вырезанием основания (BER),
   пиримидиновый димер — вырезанием нуклеотидов (NER). Этапы: узнавание → вскрытие цепи → синтез по неповреждённой цепи → сшивание.
   Процесс останавливается на первой недостающей детали; AP-сайт не требует гликозилазы. Если противоположная цепь повреждена на том же
   участке, в модели нет правильной матрицы для достройки. Модель качественная: одно повреждение, числа нуклеотидов — схема.
   ===================================================================== */
GN.s2b = (function () {
  const { C, text, panel, duplex, blob, line, f, G } = GN;
  const SEQ = { u: 'CGTACCATGCA', dimer: 'CGTACTTAGCA', ap: 'CGTACGATGCA' };
  const comp = s => s.split('').map(c => ({ A: 'T', T: 'A', G: 'C', C: 'G' }[c])).join('');
  const I = 5;
  /* lesion: 'u' | 'dimer' | 'ap'; opp: 'ok' | 'dmg'; P: { rec, nuc, pol, lig } — детали на месте (true/false) */
  function model(lesion, opp, P) {
    P = Object.assign({ rec: true, nuc: true, pol: true, lig: true }, P || {});
    const path = lesion === 'dimer' ? 'ner' : 'ber';
    const steps = ['rec', 'nuc', 'pol', 'lig'];
    let state = 'restored', stop = null;
    const need = s => !(s === 'rec' && lesion === 'ap');   /* AP-сайт узнаёт AP-эндонуклеаза: гликозилаза не нужна */
    for (const s of steps) {
      if (s === 'pol' && opp === 'dmg') { state = 'notpl'; stop = 'pol'; break; }
      if (need(s) && !P[s]) { stop = s; state = { rec: 'lesion', nuc: lesion === 'dimer' ? 'opened' : 'ap', pol: 'gap', lig: 'nick' }[s]; break; }
    }
    if (state === 'lesion' && lesion === 'ap') state = 'ap';
    return { lesion, opp, P, path, state, stop, restored: state === 'restored' };
  }
  /* an (анимация, v1.1.2): { k — пройдено этапов (0…4), cur — индекс идущего этапа или −1, mv — 0…1, ход фермента к месту повреждения }.
     Без an — статичная схема v1.1. Промежуточное состояние после k этапов — stateAfter (путь при всех деталях на месте). */
  function stateAfter(o, k) {
    if (k <= 0) return o.lesion === 'ap' ? 'ap' : 'lesion';
    if (k === 1) return o.lesion === 'dimer' ? 'opened' : 'ap';
    return ['gap', 'nick', 'restored'][Math.min(k, 4) - 2];
  }
  function draw(o, t, an) {
    let s = panel(16, 22, 568, 196, t(an ? 's2_pA_an' : 's2_pA', { p: t('s2_path_' + o.path) }));
    const bot = SEQ[o.lesion], top = comp(bot);
    const span = o.path === 'ner' ? [2, 9] : [I, I];
    const mark = {};
    let gapB = null, nickB = null, patch = null, b = bot;
    const st = an ? stateAfter(o, an.k) : o.state;
    if (st === 'lesion') {
      if (o.lesion === 'u') { b = bot.slice(0, I) + 'U' + bot.slice(I + 1); mark[I] = 'dmgB'; }
      if (o.lesion === 'dimer') { mark[I] = 'dmgB'; mark[I + 1] = 'dmgB'; }
    }
    if (st === 'ap') mark[I] = 'apB';
    if (st === 'opened') { mark[I] = 'dmgB'; mark[I + 1] = 'dmgB'; }
    if (st === 'gap' || st === 'notpl') gapB = span;
    if (st === 'nick') { patch = span; nickB = span[1]; mark[I] = 'okB'; if (o.lesion === 'dimer') mark[I + 1] = 'okB'; }
    if (st === 'restored') { patch = span; mark[I] = 'okB'; if (o.lesion === 'dimer') mark[I + 1] = 'okB'; }
    const dd = { x: 120, y: 112, dx: 36, top, bot: b, mark, gapB, nickB, patch, botCol: C.old, gBot: 'damagedstrand', gTop: 'intactstrand',
      lbl: { tl: '3′', tr: '5′', bl: '5′', br: '3′' } };
    s += duplex(dd);
    if (o.opp === 'dmg') s += G('dmg2', `<rect x="${f(120 + I * 36 - 11)}" y="${f(112 - 23)}" width="22" height="20" rx="4" fill="#F6D5D1" stroke="${C.dmg}" stroke-width="2.2"/>`) + text(120 + I * 36, 112 - 12.5, top[I], { size: 14, w: 700, col: C.dmg });
    if (st === 'opened') s += line(120 + 2 * 36 - 14, 112 + 34, 120 + 9 * 36 + 14, 112 + 34, C.int, 2, 'stroke-dasharray="3 3"');
    s += text(40, 62, t('s2_lbl_top'), { a: 'l', size: 13, col: C.muted });
    s += text(40, 160, t('s2_lbl_bot'), { a: 'l', size: 13, col: C.muted });
    if (!an) s += text(300, 196, t('s2_st_' + st), { size: 13.5, w: 600, col: st === 'restored' ? C.ok : (st === 'lesion' || st === 'notpl') ? C.dmg : C.int });
    /* панель Б: четыре этапа пути */
    s += panel(16, 230, 568, 180, t('s2_pB'));
    const order = ['rec', 'nuc', 'pol', 'lig'], col = { rec: C.gly, nuc: C.nuc, pol: C.pol, lig: C.lig }, gg = { rec: o.path === 'ner' ? 'xpc' : 'glycosylase', nuc: o.path === 'ner' ? 'nernuc' : 'apend', pol: 'polymerase', lig: 'ligase' };
    const stopIdx = o.stop ? order.indexOf(o.stop) : 4;
    order.forEach((k, i) => {
      const x = 90 + i * 140, y = 300;
      const skip = k === 'rec' && o.lesion === 'ap';
      const done = an ? i < an.k : i < stopIdx, here = an ? false : i === stopIdx, run = an && i === an.cur;
      const lab = t('s2_step_' + o.path + '_' + k);
      s += blob(x, y - 26, 122, 28, col[k], gg[k], t('s2_e_' + o.path + '_' + k), { op: skip || (!done && !here && !run) ? .35 : .93, size: 11.5 });
      s += GN.textN(x, y + 12, lab, { size: 12.5, col: C.ink });
      const notpl = here && o.state === 'notpl';   /* деталь на месте, но правильной матрицы нет — не «отказ фермента» */
      const mk = skip ? t('s2_mk_skip') : notpl ? t('s2_mk_notpl') : done ? '✓' : here ? '✕' : run ? '' : '—';   /* идущий этап — без значка: легенда панели Б знает только ✓, ✕ и — */
      if (mk) s += text(x, y + 62, mk, { size: skip || notpl ? 12 : 18, w: 700, col: skip ? C.muted : done ? C.ok : here ? C.dmg : C.muted });
      if (i < 3) s += GN.arrow(x + 63, y - 26, x + 77, y - 26, C.muted, 2);
    });
    /* фермент идущего этапа подходит к месту повреждения (анимация) */
    if (an && an.cur >= 0 && an.mv != null && !(order[an.cur] === 'rec' && o.lesion === 'ap')) {
      const k = order[an.cur], v = an.mv, x0 = 90 + an.cur * 140, y0 = 274, x1 = 120 + I * 36, y1 = 188;   /* ниже подписи цепи (y 160) */
      s += `<g opacity="${f(v < .85 ? 1 : (1 - v) / .15)}">` + blob(x0 + (x1 - x0) * Math.min(1, v / .7), y0 + (y1 - y0) * Math.min(1, v / .7), 110, 24, col[k], gg[k], t('s2_e_' + o.path + '_' + k), { size: 11 }) + '</g>';
    }
    return s;
  }
  /* ---- анимация (Claude Code, v1.1.2; паспорт 2.2): этапы 1 — узнавание, 2 — вскрытие цепи, 3 — синтез, 4 — сшивание.
     Путь идёт до первой недостающей детали (model.stop); кадр — чистая функция T ∈ [0, конец]; при T = конец — статичная схема. */
  const ORDER = ['rec', 'nuc', 'pol', 'lig'];
  const plan = o => {
    const norec = o.stop === 'rec';   /* v1.2 (рецензия И-01): без белка узнавания — этап 1 «узнавания нет»; шкала не нулевой длины */
    const end = norec ? 1 : o.stop ? ORDER.indexOf(o.stop) : 4;
    const keys = [norec ? 's2t_1_none_' + o.path : 's2t_1_' + (o.lesion === 'ap' ? 'ap' : o.path), 's2t_2_' + o.path, 's2t_3', 's2t_4'];
    const stopKey = !o.stop ? null : o.state === 'notpl' ? 's2t_stop_notpl' : o.stop === 'nuc' ? 's2t_stop_nuc_' + o.path : 's2t_stop_' + o.stop;
    return { keys, end, stopKey };
  };
  function frame(o, T, t) {
    const { end } = plan(o);
    if (T >= end - 1e-6) return draw(o, t);
    if (o.stop === 'rec') return draw(o, t, { k: 0, cur: -1 });   /* узнавания нет: фермент не подходит, повреждение на месте */
    const i = Math.min(end - 1, Math.floor(T + 1e-9)), u = T - i;   /* идёт этап i (с нуля); u — доля этапа */
    return u < .7 ? draw(o, t, { k: i, cur: i, mv: u / .7 * .85 }) : draw(o, t, { k: i + 1, cur: i, mv: .85 + (u - .7) / .3 * .15 });
  }
  const view = (args, t) => draw(model(args[0], args[1], args[2]), t);
  return { model, draw, view, frame, plan, stateAfter };
})();

/* =====================================================================
   s0_gn_s3.js — вкладка 3 «Разрыв обеих цепей» (базовая сцена 3b).
   Модель (MBoC7, с. 292–300; Scully et al. 2019; Stinson, Loparo 2021; Bétermier et al. 2014):
   NHEJ — белки Ku связывают концы, лигаза IV сшивает; матрица не нужна; совместимые концы соединяются без потерь, при утрате
   нуклеотидов на концах — с небольшой делецией. HR — нуклеазы резекции образуют 3′-концы, RAD51 ищет гомологичный участок,
   полимераза копирует сестринскую хроматиду; возможна в S/G2, когда сестринская хроматида есть. Резекция направляет концы в HR:
   резецированные концы в модели не соединяются NHEJ. Модель качественная: один разрыв; в клетке в G2 работают оба пути — в модели при всех деталях показана HR (рецензия v1.0, Р-08).
   ===================================================================== */
GN.s3b = (function () {
  const { C, text, textN, panel, duplex, blob, line, f, G, chromatid } = GN;
  const TOP = 'TACGGATCCTAG', BOT = 'ATGCCTAGGATC', DEL = [4, 7];
  /* phase: 'G1' | 'G2'; ends: 'clean' | 'lost'; P: { ku, lig4, res, rad51 } */
  function model(phase, ends, P) {
    P = Object.assign({ ku: true, lig4: true, res: true, rad51: true }, P || {});
    let path, state;
    if (phase === 'G2' && P.res && P.rad51) { path = 'hr'; state = 'hr'; }
    else if (phase === 'G2' && P.res && !P.rad51) { path = 'hr'; state = 'stuck'; }
    else if (P.ku && P.lig4) { path = 'nhej'; state = ends === 'clean' ? 'nhej_ok' : 'nhej_del'; }
    else { path = 'none'; state = 'open'; }
    const intact = state === 'hr' || state === 'nhej_ok' || state === 'nhej_del';
    const same = state === 'hr' || state === 'nhej_ok';
    return { phase, ends, P, path, state, intact, same, lost: state === 'nhej_del' ? DEL[1] - DEL[0] + 1 : 0 };
  }
  /* an (анимация, v1.1.3): { st — промежуточное состояние ('brk' разрыв, 'ku', 'proc' обработка концов, 'res' резекция,
     'rad51', 'pair' спаривание с сестринской хроматидой, 'synth' синтез), u — доля этапа }. Без an — статичная схема v1.1. */
  function draw(o, t, an) {
    let s = panel(16, 22, 568, 150, t('s3_pA', { ph: o.phase }));
    /* хромосома: G1 — одна хроматида, G2 — две сестринские; разрыв — на одной */
    const brkIntact = o.intact && !an ? null : .62;
    if (o.phase === 'G1') {
      s += G('chromatid', chromatid(120, 92, 360, '#6F8FBF', { brk: brkIntact, cen: .3 }));
      s += text(300, 128, t('s3_lbl_g1'), { size: 13, col: C.muted });
    } else {
      s += G('chromatid', chromatid(120, 78, 360, '#6F8FBF', { brk: brkIntact, cen: .3 }));
      s += G('sister', chromatid(120, 106, 360, '#9DB4D6', { cen: .3 }));
      for (let i = 0; i < 6; i++) s += G('cohesin', `<circle cx="${f(150 + i * 58)}" cy="92" r="4.5" fill="none" stroke="${C.coh}" stroke-width="2"/>`);
      s += text(120 - 10, 78, t('s3_lbl_brk'), { a: 'r', size: 12.5, col: C.muted });
      s += text(120 - 10, 106, t('s3_lbl_sis'), { a: 'r', size: 12.5, col: C.muted });
      s += text(300, 140, t('s3_lbl_g2'), { size: 13, col: C.muted });
    }
    if (o.intact && !an) s += text(300, 158, t('s3_lbl_whole'), { size: 13, w: 600, col: C.ok });
    /* спаривание и синтез: конец хроматиды 1 спаривается с комплементарным участком хроматиды 2 (стрелка в панели А) */
    if (an && (an.st === 'pair' || an.st === 'synth')) s += GN.arrow(120 + 360 * .62, 84, 120 + 360 * .62, 100, C.rad, 2.2);
    s += panel(16, 184, 568, 226, t('s3_pB'));
    const y = 270;
    if (an) return s + drawAnB(o, t, an, y);
    /* панель Б: участок ДНК в месте разрыва */
    const st = o.state;
    if (st === 'hr' || st === 'nhej_ok') {
      s += duplex({ x: 102, y, dx: 36, top: TOP, bot: BOT, botCol: C.old, gBot: 'template', gTop: 'template', patch: st === 'hr' ? [3, 8] : null, patchT: st === 'hr' ? [3, 8] : null,
        lbl: { tl: '3′', tr: '5′', bl: '5′', br: '3′' } });
      if (st === 'nhej_ok') s += G('junction', line(102 + 5.5 * 36, y - 40, 102 + 5.5 * 36, y + 40, C.lig, 2, 'stroke-dasharray="3 3"'));
    } else if (st === 'nhej_del') {
      const tp = TOP.slice(0, DEL[0]) + TOP.slice(DEL[1] + 1), bt = BOT.slice(0, DEL[0]) + BOT.slice(DEL[1] + 1);
      s += duplex({ x: 174, y, dx: 36, top: tp, bot: bt, botCol: C.old, gBot: 'template', gTop: 'template', mark: {}, lbl: { tl: '3′', tr: '5′', bl: '5′', br: '3′' } });
      s += G('deletion', `<rect x="${f(174 + 3.5 * 36 - 8)}" y="${f(y - 34)}" width="16" height="68" rx="5" fill="none" stroke="${C.mut}" stroke-width="2.4" stroke-dasharray="5 3"/>`);
    } else {
      /* концы не соединены; при резекции — одноцепочечные 3′-концы */
      const res = st === 'stuck';
      s += duplex({ x: 66, y, dx: 36, top: TOP.slice(0, 5), bot: BOT.slice(0, 5), topTo: res ? 1 : 4, botCol: C.old, gBot: 'template', gTop: 'template', lbl: { tl: '3′', bl: '5′' } });
      s += duplex({ x: 66 + 7 * 36, y, dx: 36, top: TOP.slice(5), bot: BOT.slice(5), botFrom: res ? 3 : 0, botCol: C.old, gBot: 'template', gTop: 'template', lbl: { tr: '5′', br: '3′' } });
      s += G('dsb', text(66 + 5.9 * 36, y, '⚡', { size: 22, col: C.dmg }));
    }
    const lab = { hr: 's3_st_hr', nhej_ok: 's3_st_nhej_ok', nhej_del: 's3_st_nhej_del', stuck: 's3_st_stuck', open: 's3_st_open' }[st];
    s += textN(300, 340, t(lab), { size: 13.5, w: 600, col: st === 'hr' || st === 'nhej_ok' ? C.ok : st === 'nhej_del' ? C.mut : C.dmg });
    /* белки, участвовавшие в исходе */
    const used = st === 'hr' || st === 'stuck' ? [['res', C.nuc, 'resection'], ['rad51', C.rad, 'rad51']] : st.startsWith('nhej') ? [['ku', C.ku, 'ku'], ['lig4', C.lig, 'lig4']] : [];
    used.forEach(([k, col, g], i) => { if (o.P[k]) s += blob(220 + i * 160, 392, 132, 24, col, g, t('s3_e_' + k), { size: 12 });
      else { s += blob(220 + i * 160, 392, 132, 24, col, g, t('s3_e_' + k), { size: 12, op: .35 }) + text(220 + i * 160 + 80, 392, '✕', { size: 16, w: 700, col: C.dmg }); } });
    return s;
  }
  /* панель Б во время анимации */
  function drawAnB(o, t, an, y) {
    /* v1.2 (рецензия И-08, И-09): фрагменты не «разлетаются»; удалённые нуклеотиды — пустые позиции; синтез заполняет пустые позиции;
       лигаза IV появляется на этапе сшивания, и концы смыкаются к конечному положению статичной схемы */
    let s = '';
    const ease = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
    const lost = o.ends === 'lost' && (an.st === 'proc' || an.st === 'lig');
    const LB = { tl: '3′', bl: '5′' }, RB = { tr: '5′', br: '3′' }, piece = (x, a, b, o2) => duplex(Object.assign({ x, y, dx: 36, top: TOP.slice(a, b), bot: BOT.slice(a, b), botCol: C.old, gBot: 'template', gTop: 'template' }, o2));
    if (an.st === 'synth') {   /* HR: концы сходятся по сестринской матрице, затем полимераза заполняет одноцепочечные участки */
      const v = ease(an.u / .3), w = Math.max(0, Math.min(1, (an.u - .3) / .7));
      const xl = 66 + 36 * v, xr = 318 - 36 * v, ft = 1 + Math.round(3 * w), fb = 3 - Math.round(3 * w);
      s += piece(xl, 0, 5, { topTo: ft, patchT: ft >= 2 ? [2, ft] : null, lbl: LB });
      s += piece(xr, 5, 12, { botFrom: fb, patch: fb <= 2 ? [fb, 2] : null, lbl: RB });
      [['res', C.nuc, 'resection'], ['rad51', C.rad, 'rad51']].forEach(([k, col, g], i) => { s += blob(220 + i * 160, 392, 132, 24, col, g, t('s3_e_' + k), { size: 12 }); });
      return s;
    }
    if (an.st === 'lig') {   /* NHEJ: лигаза IV сшивает — концы смыкаются к положению статичной схемы */
      const v = ease(an.u), xl = lost ? 92 + 82 * v : 92 + 10 * v, xr = lost ? 400 - 82 * v : 292 - 10 * v;
      s += piece(xl, 0, lost ? 4 : 5, { lbl: LB }) + piece(xr, lost ? 8 : 5, 12, { lbl: RB });
      const xe = xl + (lost ? 3 : 4) * 36, xj = (xe + xr) / 2;
      s += blob(xe + 4, y + 48, 44, 22, C.ku, 'ku', t('s3_e_ku'), { size: 11.5 }) + blob(xr - 4, y + 48, 44, 22, C.ku, 'ku', t('s3_e_ku'), { size: 11.5 });
      s += blob(xj, y + 76, 76, 22, C.lig, 'lig4', t('s3_e_lig4'), { size: 11.5 });
      [['ku', C.ku, 'ku'], ['lig4', C.lig, 'lig4']].forEach(([k, col, g], i) => { s += blob(220 + i * 160, 392, 132, 24, col, g, t('s3_e_' + k), { size: 12 }); });
      return s;
    }
    const res = ['res', 'rad51', 'pair'].includes(an.st);
    const gapX = an.st === 'ku' ? 26 * ease(an.u * 1.6) : an.st === 'proc' ? 26 : 0;   /* Ku удерживают концы рядом */
    const xl = 66 + gapX, xr = 318 - gapX;
    if (lost) {   /* обработка концов: утраченные нуклеотиды исчезают на месте (рамка утраты), фрагменты не сдвигаются */
      s += piece(xl, 0, 4, { lbl: LB }) + piece(xr + 3 * 36, 8, 12, { lbl: RB });
      s += G('deletion', `<rect x="${f(xl + 3.5 * 36 + 2)}" y="${f(y - 34)}" width="${f(xr + 2.5 * 36 - xl - 3.5 * 36 - 4)}" height="68" rx="5" fill="none" stroke="${C.mut}" stroke-width="2" stroke-dasharray="5 3" opacity=".7"/>`);
    } else {

    if (an.st === 'brk') s += G('dsb', text(66 + 5.9 * 36, y, '⚡', { size: 22, col: C.dmg }));
    if (an.st === 'ku' || an.st === 'proc') {

      s += blob(kl, y + 48, 44, 22, C.ku, 'ku', t('s3_e_ku'), { size: 11.5 });
      s += blob(kr, y + 48, 44, 22, C.ku, 'ku', t('s3_e_ku'), { size: 11.5 });
    }

    } else {

      s += blob(70 + o.g * 20 - 10, 384, 120, 22, C.ku, 'ku', t('s4_e_rec'), { size: 12 });

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   stageView — возврат схемы на экран при запуске (телефон).

   всегда в практикуме, а на странице «Объяснений» не используется.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().

/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */

  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);

  function paint() {

    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */

    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */

      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));

    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;

      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');

    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => CASE.on ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —
   сначала прогноз, потом явный запуск («▶ Запустить», шаг или кнопка этапа). Как только шкала ушла с нуля, итог виден. */
function predictHold(K){ const sc = $('sc' + K); if (!sc) return; sc.classList.add('predict');
  /* рецензия v1.4, п. 8: кнопки этапов без исхода в доступном имени, пока прогноз не сделан */
  sc.querySelectorAll('.tlc').forEach(b => { if (!b.dataset.al) b.dataset.al = b.getAttribute('aria-label') || ''; b.setAttribute('aria-label', (b.dataset.al.split(':')[0] || '').trim());
    if (b.disabled) { b.dataset.no = '1'; b.disabled = false; } });   /* семинар 8, v1.2 (рецензия И-15): до запуска кружки одинаковы — недоступные не выдают место остановки */
  const c = $('capbox' + K), r = $('reads' + K); if (c) c.dataset.predict = t('predict_note'); if (r) r.dataset.predict = t('predict_reads'); }
function predictDone(K, T){ if (T > 1e-6) { const sc = $('sc' + K); if (sc && sc.classList.contains('predict')) { sc.classList.remove('predict');
  sc.querySelectorAll('.tlc').forEach(b => { if (b.dataset.al != null) { b.setAttribute('aria-label', b.dataset.al); delete b.dataset.al; } if (b.dataset.no) { b.disabled = true; delete b.dataset.no; } }); } } }

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typeof fitStage === 'function') fitStage(); });

/* =====================================================================
   s0_range.js — бегунок величины (общий компонент курса «Биология», v1.6 семинара 3).
   По образцу бегунков «Молекулярной биологии» (rangeHTML: подпись — величина, вывод — значение с единицами;
   засечки измеренных значений как в сцене s2b семинара 1 МБ).
   Возможности: засечки измеренных значений с подписями под шкалой; прилипание к засечке в пределах 3 % шкалы;
   ступенчатый режим (только измеренные положения); логарифмическая или своя шкала; штриховка участков
   «интерполяция модели / не измерено» между засечками. Блокировку в шаге «предскажите» даёт poeLock
   (s9_wip.js): бегунок — элемент input внутри панели переключателей.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
const RX = (function () {
  const SP = {}, N = 1000;
  const lg = Math.log10;
  /* положение на шкале p ∈ [0, 1] ↔ значение величины */
  function toP(sp, v) {
    if (sp.map) return clamp(sp.map[0](v));
    if (sp.log) return clamp((lg(v) - lg(sp.min)) / (lg(sp.max) - lg(sp.min)));
    return clamp((v - sp.min) / (sp.max - sp.min));
  }
  function toV(sp, p) {
    if (sp.map) return sp.map[1](p);
    if (sp.log) return Math.pow(10, lg(sp.min) + p * (lg(sp.max) - lg(sp.min)));
    return sp.min + p * (sp.max - sp.min);
  }
  const num = (v, d) => (d == null ? String(v) : v.toFixed(d)).replace('.', ',').replace('-', '−');
  function fmtV(sp, v) { return sp.fmt ? sp.fmt(v) : num(v, sp.dec != null ? sp.dec : 0); }
  function round(sp, v) { if (!sp.round) return v; const r = sp.round(v); return r; }
  /* место на дорожке: центр бегунка ходит от 11 px до (ширина − 11 px) */
  const at = p => `calc(11px + ${(p * 100).toFixed(2)}% - ${(p * 22).toFixed(2)}px)`;

  function html(id, sp) {
    SP[id] = sp; sp.id = id;
    const steps = !!sp.stepped, marks = sp.marks || [];
    const v0 = sp.val != null ? sp.val : steps ? marks[0][0] : sp.min, sep = sp.glue ? '' : ' ';
    sp.v = v0;
    const iv = steps ? marks.findIndex(m => m[0] === v0) : Math.round(toP(sp, v0) * N);
    let h = `<div class="rx${steps ? ' rxstep' : ''}" id="${id}W"><div class="row"><label for="${id}">${t(sp.k)}</label><output id="${id}O">${fmtV(sp, v0)}${sep}${t(sp.unit)}</output></div>`;
    h += `<div class="rxtrack">`;
    if (!steps) (sp.hatch || []).forEach(([a, b]) => { const pa = toP(sp, a), pb = toP(sp, b), l = Math.min(pa, pb), r = Math.max(pa, pb);
      h += `<i class="rxh" style="left:${at(l)};width:calc(${((r - l) * 100).toFixed(2)}% - ${((r - l) * 22).toFixed(2)}px)"></i>`; });
    h += `<input type="range" id="${id}" min="0" max="${steps ? marks.length - 1 : N}" step="1" value="${iv}" aria-valuetext="${fmtV(sp, v0)}${sep}${t(sp.unit)}">`;
    const pm = (v, i) => steps ? (marks.length > 1 ? i / (marks.length - 1) : 0) : toP(sp, v);
    const two = marks.some(m => m[3]);   /* близкие засечки: подпись во втором ряду */
    h += `</div><div class="rxticks${two ? ' two' : ''}" aria-hidden="true">` + marks.map(([v, , short, row], i) => { const p = pm(v, i);
      return `<span class="rxt${row ? ' r1' : ''}" style="left:${at(p)}" data-p="${p.toFixed(3)}"><i></i>${short ? t(short) : fmtV(sp, v)}</span>`; }).join('') + `</div>`;
    const leg = marks.filter(m => m[1]).map(([v, k]) => `<li><b>${fmtV(sp, v)}${sep}${t(sp.unit)}</b> — ${t(k)}</li>`).join('') +
      (sp.hatchKey ? `<li class="rxhl"><i class="rxsw"></i>${t(sp.hatchKey)}</li>` : '');
    if (leg) h += `<ul class="rxleg">${leg}</ul>`;
    return h + `</div>`;
  }
  /* обработчик: прилипание, вывод значения; fn вызывается после пересчёта */
  function bind(id, fn) {
    const sp = SP[id], e = $(id);
    /* клавиатура: стрелка переходит к следующей засечке или на 2 % шкалы (без прилипания, иначе из засечки не уйти) */
    if (!sp.stepped) e.addEventListener('keydown', ev => {
      const dir = ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? 1 : ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -1 : 0;
      if (!dir) return;
      ev.preventDefault();
      const p = +e.value / N, stp = 0.02;
      let q = clamp(p + dir * stp);
      (sp.marks || []).forEach(([mv]) => { const pm = toP(sp, mv); if (dir > 0 ? pm > p + 1e-4 && pm < q : pm < p - 1e-4 && pm > q) q = pm; });
      e.value = Math.round(q * N); sp._kb = true; e.dispatchEvent(new Event('input', { bubbles: true })); sp._kb = false;
    });
    e.addEventListener('input', () => {
      if (e.disabled) { set(id, sp.v); return; }   /* шаг сценария «предскажите»: заблокированный бегунок состояние не меняет (семинар 7, v1.2) */
      if (sp.stepped) { sp.v = sp.marks[+e.value][0]; }
      else {
        let p = +e.value / N, v = round(sp, toV(sp, p));
        const snap = sp.snap != null ? sp.snap : 0.03;
        let best = null; if (!sp._kb) (sp.marks || []).forEach(([mv]) => { const d = Math.abs(toP(sp, mv) - p); if (d <= snap && (!best || d < best.d)) best = { d, mv }; });
        if (best) { v = best.mv; e.value = Math.round(toP(sp, v) * N); }
        else if (sp._kb) { const m = (sp.marks || []).find(([mv]) => Math.abs(toP(sp, mv) - p) < 1e-3); if (m) v = m[0]; }
        sp.v = v;
      }
      out(sp); if (fn) fn(sp.v);
    });
    out(sp);
  }
  function out(sp) {
    const s = fmtV(sp, sp.v) + (sp.glue ? '' : ' ') + t(sp.unit), o = $(sp.id + 'O'), e = $(sp.id);
    if (o) o.textContent = s; if (e) e.setAttribute('aria-valuetext', s);
    const W = $(sp.id + 'W'); if (W) W.querySelectorAll('.rxt').forEach((x, i) => x.classList.toggle('on', (sp.marks[i] || [])[0] === sp.v));
  }
  /* поставить значение (из сценария или из анимации); ступенчатый бегунок — ближайшее измеренное положение */
  function set(id, v) {
    const sp = SP[id], e = $(id);
    if (sp.stepped) { let bi = 0; sp.marks.forEach(([mv], i) => { if (Math.abs(mv - v) < Math.abs(sp.marks[bi][0] - v)) bi = i; }); sp.v = sp.marks[bi][0]; if (e) e.value = bi; }
    else { (sp.marks || []).forEach(([mv]) => { if (Math.abs(toP(sp, mv) - toP(sp, v)) < 1e-4) v = mv; });   /* ошибка округления при пересчёте время ↔ значение */
      if (sp.round && !(sp.marks || []).some(([mv]) => mv === v)) v = sp.round(v);
      sp.v = v; if (e) e.value = Math.round(toP(sp, v) * N); }
    out(sp); return sp.v;
  }
  const get = id => SP[id].v;
  const spec = id => SP[id];
  /* значение на засечке? (для показаний «измерено» и для тестов) */
  const onMark = id => (SP[id].marks || []).some(([mv]) => mv === SP[id].v);
  return { html, bind, set, get, spec, onMark, toP, toV, fmtV, num };
})();
window.RX = RX;

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (граница с занятием, R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   Вкладка 1. Точность копирования: судьба одной ошибки спаривания.
   1b — базовый (статичная версия Desktop): коррекция 3′-конца × MMR × метка новой цепи; исход сразу после синтеза и после
        следующего удвоения. Модель — GN.s1b (s0_gn_s1.js). Анимация по этапам — v1.1.1 (Claude Code): GN.s1b.frame, шкала timeStrip (s0_motion.js).
   1a — продвинутый: s5_adv.js.
   ===================================================================== */
(function(){
  const K = '1b', M = GN.s1b;
  layout(K); window.MODEL1B = M.model;
  $('ctrl' + K).innerHTML =
    segHTML('s1b_proof', 's1_proof', [['on', 's1_on'], ['off', 's1_off']], 'on') +
    segHTML('s1b_mmr', 's1_mmr', [['on', 's1_on'], ['off', 's1_off']], 'on') +
    segHTML('s1b_mark', 's1_mark', [['yes', 's1_mark_yes'], ['no', 's1_mark_no']], 'yes') +
    `<p class="small">${t('s1_ctrl_note')}</p>`;
  $('take' + K).textContent = t('s1b_take');
  const pill = (k, cls = 'np') => `<span class="pill ${cls}">${t(k)}</span>`;
  /* v1.1.1 (Claude Code): шкала этапов и анимация (паспорт 1.2). Кадр — GN.s1b.frame(o, T); конечный кадр = статичная схема.
     Смена условия → кадр «до начала» и пауза для прогноза (как в семинаре 7, аудит A19); «Показать на схеме» → анимация с начала. */
  const cur1 = () => M.model(segVal('s1b_proof'), segVal('s1b_mmr'), segVal('s1b_mark'));
  const view = stageView(K);
  const tl = timeStrip(K, { note: 's1t_note', render(T){ if ($('svg' + K)) $('svg' + K).innerHTML = defs(K) + M.frame(cur1(), T, t); predictDone(K, T); }, onEnd: view.back });
  window.TL1B = tl;
  window.STATIC1B = () => defs(K) + M.draw(cur1(), t);   /* для теста: статичная схема текущих условий (конечный кадр шкалы должен с ней совпадать) */
  let lastKey = null, armed = false, hold = false;
  function update(){
    const o = cur1(), key = [o.proof, o.mmr, o.mark].join('|');
    if (key !== lastKey){ lastKey = key; tl.config(M.stageKeys(o), 4, null, { speed: 1.6 }); if (!armed) tl.seek(tl.end); }
    if (armed){ armed = false; hold = false; tl.play(true); view.reveal(300); }
    else if (hold){ hold = false; tl.seek(0); predictHold(K); }
    else if (!tl.playing) tl.redraw();
    $('reads' + K).innerHTML =
      readRow(t('s1_r_mis'), t('s1_r_mis_s'), o.misLeft ? pill('s1_v_mis_yes', 'p') : pill('s1_v_mis_no')) +
      readRow(t('s1_r_where'), '', pill('s1_v_where_' + o.state, o.fixed ? 'p' : 'np')) +
      readRow(t('s1_r_next'), t('s1_r_next_s'), o.fixed ? pill('s1_v_next_fixed', 'p') : pill('s1_v_next_same'));
    setCap(K, 's1_cap_' + o.state);
  }
  wire(['s1b_proof', 's1b_mmr', 's1b_mark'], () => { hold = true; update(); });
  const set = (p, m, k) => { segSet('s1b_proof', p); segSet('s1b_mmr', m); segSet('s1b_mark', k); };
  const run = (p, m, k) => { set(p, m, k); armed = true; };
  SCENES[K] = { update, tick: tl.tick, poe: [
    { n: 3, ok: 0, pre(){ set('on', 'on', 'yes'); }, apply(){ run('off', 'on', 'yes'); } },
    { n: 3, chain: true, ok: 0, pre(){ set('off', 'on', 'yes'); }, apply(){ run('off', 'on', 'no'); } },
    { n: 3, ok: 0, pre(){ set('on', 'on', 'yes'); }, apply(){ run('off', 'off', 'yes'); } },
    { n: 3, mask: true, last: true, ok: 0, pre(){ set('off', 'off', 'yes'); }, apply(){} },
  ] };
})();

/* =====================================================================
   Вкладка 2. Повреждения и эксцизионная репарация.
   2b — базовый (статичная версия Desktop): повреждение (урацил / пиримидиновый димер / AP-сайт) × противоположная цепь (цела / повреждена)
        × конструктор деталей (белок узнавания, нуклеазы, ДНК-полимераза, ДНК-лигаза). Модель — GN.s2b (s0_gn_s2.js).

/* =====================================================================
   s5_adv.js — продвинутый уровень семинара 8 (v1.0, статичная версия Desktop): четыре системных исследования.
   1a — последовательные барьеры (GN.a1); 2a — что накапливается при остановке репарации (GN.a2);
   3a — информация для восстановления разрыва (GN.a3); 4a — защита конца и длина теломеры (GN.a4).
   В каждой сцене: биологическая проблема (над переключателями), переключатели, показания, «предскажите → проверьте → объясните»
   с обратной задачей (флаг mask), лестница подсказок (ключи p{K}_{i}_h1…h3), раскрываемые блоки «Чего модель не показывает»
   и «Новые данные · как это установили». Анимация и пошаговый ход — Claude Code (v1.1.1+): advStrip, бегунки RX по засечкам модели.
   Флаг шага mask: схема видна (это наблюдение обратной задачи), переключатели скрыты; рисунок и показания — без признаков причины.
   ===================================================================== */
const ADV = {};
function advMasked(K){ const st = (typeof poeMasked === 'function') ? poeMasked(K) : null; return !!(st && st.mask); }
function segOff(id, vals, noteId, noteKey){
  $(id).querySelectorAll('button').forEach(b => { const off = vals.includes(b.dataset.v); b.disabled = off; b.setAttribute('aria-disabled', String(off)); b.classList.toggle('na', off); });
  const n = $(noteId); if (n){ n.textContent = noteKey ? t(noteKey) : ''; n.hidden = !noteKey; }
}
const advPill = (k, v, cls = 'np') => `<span class="pill ${cls}">${t(k, v)}</span>`;
/* v1.1.1 (Claude Code): шкала этапов продвинутых сцен — из семинара 7 v1.5 (advStrip, advReads). */
/* шкала этапов продвинутой сцены: frame(T) — SVG кадра; sig — подпись набора этапов (новые условия → новая шкала).
   mode: 'end' — конечный кадр (загрузка страницы, программная установка условий, шаг сценария до показа);
   'hold' — пользователь сменил условие: кадр «до начала», ждём «Запустить»; 'play' — после «Показать на схеме». */
function advStrip(K, note){
  const view = stageView(K);
  let frame = () => '', mode = 'end', sig = null;
  const tl = timeStrip(K, { note, steps: true, render(T){ const s = $('svg' + K); if (s) s.innerHTML = defs(K) + frame(T); predictDone(K, T); }, onEnd: view.back });
  window['TL' + K.toUpperCase()] = tl;
  const z = $('tl' + K + 'z'); if (z) z.addEventListener('click', () => predictHold(K));   /* рецензия v1.4, п. 17: «Сначала» — снова пауза для прогноза */
  return {
    tl,
    hold(){ mode = 'hold'; }, go(){ mode = 'play'; }, K,
    /* keys — подписи этапов; f(T) — кадр; masked — шаг обратной задачи: всегда конечный кадр наблюдения */
    show(keys, f, opt = {}, masked = false){
      frame = masked ? () => f(null) : T => f(T >= tl.end - 1e-6 ? null : T);
      const s2 = JSON.stringify([keys, opt.key || '', opt.stop, opt.stopKey]);
      const changed = s2 !== sig;
      /* семинар 8 (v1.1.2): opt.stop — число пройденных этапов, если процесс останавливается раньше (2а), opt.stopKey — подпись остановки */
      if (changed){ sig = s2; tl.config(keys, opt.stop != null ? opt.stop : keys.length, opt.stopKey || null, Object.assign({ speed: 1.3 }, opt)); }
      if (masked) tl.seek(tl.end);
      else if (mode === 'end') { if (changed) tl.seek(tl.end); else if (!tl.playing) tl.redraw(); }   /* рецензия v1.4, п. 26: при возврате на сцену кадр сохраняется */
      else if (mode === 'hold') { tl.seek(0); predictHold(K); }
      else { tl.play(true); view.reveal(300); }
      mode = 'end';
    },
  };
}
/* показания продвинутых сцен — итог выбранных условий, а не текущий кадр шкалы (аудит A20) */
const advReads = (K, html) => { $('reads' + K).innerHTML = `<p class="small rdnote">${t('rd_final')}</p>` + html; };

    len:  { ctrl: 'long', notrf2: 'long', short: 'short', brk: 'none' },
    shel: { ctrl: 'yes', notrf2: 'no', short: 'yes', brk: 'no' },
  } },
};
/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (caseFits(spec, set, truth).length !== 1) continue;
    if (set.length < any.length) any = set;
    if (set.every(m => spec.meth[m][truth] !== spec.meth[m].ctrl) && (!best || set.length < best.length)) best = set;
  }
  return best || any;
}
window.CASE_LOGIC = { CASE_SPEC, caseFits, caseMinimal };

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };
(function(){
  const url = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`);
  Object.keys(CASE_SPEC).forEach(K => {
    const sec = $('sc' + K);
    sec.querySelector('.side').insertAdjacentHTML('afterbegin', `<div class="panel case" id="case${K}" hidden></div>`);
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', `<div class="veil" aria-hidden="true"><b>${t('case_veil')}</b><span>${t('case_veil_s')}</span></div>`);
  });
  const val = (S, m, v) => t(`${S.id}_v_${m}_${v}`);
  /* решение проверяется и после выбора объяснения, и после каждого измерения */
  function settle(K, S){
    if (!CASE.solved && CASE.done.length && CASE.guess === CASE.truth && caseFits(S, CASE.done, CASE.truth).length === 1){
      CASE.solved = true; $('sc' + K).classList.add('casedone'); SCENES[K].caseShow(CASE.truth);
    }
  }
  const ctl = (S, m) => { const k = `${S.id}_v_${m}_${S.meth[m].ctrl}`; return t(TEXTS[k + '_c'] ? k + '_c' : k); };   /* в строке контроля «как в контроле» не годится */
  function start(K, seed){
    const S = CASE_SPEC[K];
    /* порядок измерений и объяснений перемешивается, как в сценариях; ?fixed — постоянный порядок */
    const mix = a => { a = a.slice(); if (!url.has('fixed')) for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const TR = S.truths || S.causes;
    Object.assign(CASE, { on: true, K, seed, truth: TR[seed % TR.length], done: [], guess: null, solved: false, open: null, mo: mix(Object.keys(S.meth)), co: mix(S.causes) });
    POE.on = false; poeRender();
    const sec = $('sc' + K); sec.classList.add('casemode'); sec.classList.remove('casedone');
    SCENES[K].caseShow(null); render(); sync();
    if (window.matchMedia && matchMedia('(max-width:1000px)').matches) $('case' + K).scrollIntoView({ block: 'start' });
  }
  function exit(){
    if (!CASE.on) return;
    const K = CASE.K, sec = $('sc' + K); CASE.on = false;
    sec.classList.remove('casemode', 'casedone'); $('case' + K).hidden = true; $('case' + K).innerHTML = '';
    SCENES[K].caseShow(null); SCENES[K].update(); sync();
  }
  function verdict(S){
    const g = CASE.guess; if (!g) return '';
    if (CASE.solved) return '';
    const fits = caseFits(S, CASE.done, CASE.truth);
    if (!CASE.done.length) return `<p class="cv warn">${t('case_need')}</p>`;
    if (!fits.includes(g)){
      const m = CASE.done.find(x => S.meth[x][g] !== S.meth[x][CASE.truth]);
      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
    }
    return `<p class="cv warn">${t(fits.length === 2 ? 'case_more1' : 'case_more', { n: fits.length - 1 })}</p>`;
  }
  function render(){
    const K = CASE.K, S = CASE_SPEC[K], box = $('case' + K); box.hidden = false;
    let h = `<div class="k">${t('case_k')}</div><h3 class="ct">${t(S.id + '_title')}</h3>${TEXTS[S.id + '_tag'] ? `<p class="ctag">${t(S.id + '_tag')}</p>` : ''}<p class="co">${t(S.id + '_obs')}</p><p class="cnote">${t('case_note')}</p>`;
    h += `<div class="ch">${t('case_meas')}</div><div class="cm">`;
    CASE.mo.forEach(m => {
      const on = CASE.done.includes(m), open = CASE.open === m;
      h += `<div class="crow${on ? ' on' : ''}"><button type="button" class="cmb" data-m="${m}"${on ? ' aria-pressed="true"' : ''}${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_m_${m}`)}</button>` +
        `<button type="button" class="cq" data-q="${m}" aria-expanded="${open}" aria-label="${t('case_meth')}: ${esc(t(`${S.id}_m_${m}`))}">${t('case_meth')}</button>` +
        (on ? `<div class="cres"><span>${t('case_ctrl')}: ${ctl(S, m)}</span><b>${t('case_sample')}: ${val(S, m, S.meth[m][CASE.truth])}</b></div>` : '') +
        (open ? `<p class="cmeth">${t(`${S.id}_k_${m}`)}</p>` : '') + `</div>`;
    });
    h += `</div><div class="ch">${t('case_why')}</div><div class="cc">`;
    CASE.co.forEach(c => {
      const right = CASE.solved && c === CASE.truth;
      h += `<button type="button" class="ccb${CASE.guess === c ? ' picked' : ''}${right ? ' right' : ''}" data-c="${c}"${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_c_${c}`)}</button>`;
    });
    h += `</div><div role="status">${verdict(S)}</div>`;
    if (CASE.solved){
      const min = caseMinimal(S, CASE.truth);
      const flat = Object.keys(S.meth).filter(m => new Set(S.causes.map(c => S.meth[m][c])).size === 1);
      h += `<div class="cdone" role="status"><b>${t('case_ok')}</b><p>${t(`${S.id}_w_${CASE.truth}`)}</p>` +
        (TEXTS[S.id + '_after'] ? `<p class="cmin">${t(S.id + '_after')}</p>` : '') +
        `<p class="cmin">${t('case_used', { n: CASE.done.length, k: min.length })} ${t('case_enough', { m: min.map(x => '«' + t(`${S.id}_m_${x}`) + '»').join(', ') })}</p>` +
        flat.map(m => `<p class="cmin">${t('case_flat', { m: t(`${S.id}_m_${m}`) })}</p>`).join('') +
        `<p class="cmin"><a href="${t(S.id + '_link_h')}">${t(S.id + '_link_t')}</a></p></div>`;
    }
    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;
    box.innerHTML = h;
    const keep = sel => { const e = $('case' + K).querySelector(sel); if (e && !e.disabled) e.focus({ preventScroll: true }); };   /* панель перестраивается: фокус не теряется */
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      const TR = S.truths || S.causes;
      if (!url.has('fixed') && TR.length > 1) do { seed = Math.floor(Math.random() * 9973); } while (TR[seed % TR.length] === CASE.truth);   /* семинар 8: при одной верной причине — тот же случай заново */
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur] || !SCENES[cur].caseShow; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
if (!TEXTS.route_url) document.querySelector('.routes').hidden = true;
/* «← Раздел …: семинары»: адрес берётся из ключа home_href (например, section-2.html#seminars; без ключа — index.html рядом);
   на сайте ссылка относительная, в сохранённом файле — на адрес сайта (аудит 06.11.2026, LINK-001) */
(function(){
  const a = $('homeLink'); if (!a) return;
  if (TEXTS.home_href) a.setAttribute('href', TEXTS.home_href);
  if (!/^(fresll\.github\.io|edu\.mazunin\.science)$/.test(location.hostname)) a.href = 'https://fresll.github.io/bio/' + (a.getAttribute('href') || '').replace(/^\.\//, '');
})();
window.addEventListener('hashchange', fromHash);
initNav(); fromHash(); show(); revInit();

</script>
