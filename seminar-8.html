 до 10 000", "p1a_1_o2": "Увеличится на 99 %: почти вдвое", "p1a_1_o3": "Почти не изменится: коррекция уже исправила 99 % ошибок", "p1a_1_e": "MMR пропускала 1 % дошедших до неё ошибок. Без неё закрепляются все 10 000 ошибок, оставшихся после коррекции, — в 100 раз больше.", "p1a_1_w2": "99 % — доля исправленных, а не прибавка. Если этап пропускал 1 %, а теперь пропускает 100 %, итог растёт в 100 раз.", "p1a_1_w3": "После коррекции осталось 10 000 ошибок, и без MMR все они закрепляются; вклад этапа измеряется отношением итогов, а не процентом сам по себе.", "p1a_1_h1": "Найдите в показаниях, сколько ошибок доходит до MMR.", "p1a_1_h2": "MMR исправляет 99 % — значит, пропускает 1 из 100.", "p1a_2_q": "MMR выключена, закрепляется 10 000 изменений. Коррекция стала исправлять 90 % вместо 99 %. Каким будет итог?", "p1a_2_o1": "100 000 — в 10 раз больше", "p1a_2_o2": "10 900 — на 9 % больше", "p1a_2_o3": "1 000 — меньше, потому что коррекции стало меньше нужно", "p1a_2_e": "Важна доля пропущенных ошибок: была 1 %, стала 10 % — в 10 раз больше. Из миллиона возникших ошибок теперь остаётся 100 000.", "p1a_2_w2": "Проценты относятся к ошибкам, дошедшим до этапа: пропущенных стало 10 из 100 вместо 1 из 100, то есть в 10 раз больше.", "p1a_2_w3": "Число возникших ошибок не изменилось; менее эффективная коррекция пропускает их больше, а не меньше.", "p1a_2_h1": "Сравните доли пропущенных ошибок: 100 % − 99 % и 100 % − 90 %.", "p1a_3_q": "Условия: ошибки выбора 1 на 10 000, коррекция 99 %, MMR 99 % (в модели 100 закреплённых изменений). Но репликация начинается до того, как MMR успевает проверить новую цепь. Каким будет итог?", "p1a_3_o1": "10 000: закрепится всё, что пропустила коррекция", "p1a_3_o2": "100: MMR исправит ошибки после репликации", "p1a_3_o3": "1: при репликации часть ошибок исчезнет", "p1a_3_e": "После репликации ошибочная пара превращается в обычную пару в одной из дочерних молекул, и MMR её не узнаёт. Поэтому её вклад зависит от того, успевает ли она до репликации.", "p1a_3_w2": "После репликации ошибочной пары уже нет: в одной молекуле исходная пара, в другой — новая, но комплементарная. Узнавать нечего.", "p1a_3_w3": "Репликация копирует обе цепи, включая ошибочную; ошибки при этом не исчезают, а закрепляются.", "p1a_4_q": "Обратная задача. В клетке закрепилось 100 изменений на 10¹⁰ нуклеотидов; переключатели скрыты. Что можно сказать о работе этапов?", "p1a_4_o1": "Однозначно ничего: такой итог дают несколько разных сочетаний этапов", "p1a_4_o2": "Обе системы исправления работали в полную силу", "p1a_4_o3": "MMR выключена: иначе изменений было бы меньше", "p1a_4_e": "100 изменений получаются, например, при ошибках 1 на 100 000, коррекции 90 % и MMR 99 % — и при ошибках 1 на 10 000, коррекции 99 % и MMR 99 %, и при ошибках 1 на 100 000 без коррекции, но с MMR 99,9 %. Одно итоговое число не различает эти причины.", "p1a_4_w2": "Сочетание «1 на 10 000, коррекция 99 %, MMR 99 %» действительно даёт 100, но тот же итог дают и другие сочетания — например, 1 на 100 000, коррекция 90 %, MMR 99 %. Однозначно сказать нельзя.", "p1a_4_w3": "Без MMR итог был бы не меньше 1 000 при любой коррекции; 100 изменений с выключенной MMR в этой модели не получить.", "p1a_4_h1": "Попробуйте переключателями найти несколько сочетаний с итогом 100.", "p1a_4_h2": "Итог — произведение: возникло × доля, пропущенная коррекцией, × доля, пропущенная MMR.", "p1a_5_q": "Какое дополнительное наблюдение лучше всего отличит сочетание «ошибки 1 на 100 000, коррекция 90 %, MMR 99 %» от сочетания «ошибки 1 на 10 000, коррекция 90 %, MMR 99,9 %», если итог в обоих случаях 100?", "p1a_5_o1": "Число ошибок, оставшихся после коррекции, до работы MMR", "p1a_5_o2": "Ещё раз подсчитать закрепившиеся изменения", "p1a_5_o3": "Измерить длину теломер", "p1a_5_e": "В первом случае до MMR доходит 10 000 ошибок, во втором — 100 000: промежуточный этап различает сочетания, которые итог не различает. В клетке похожую роль играет состав изменений: нарушения разных этапов оставляют разные следы.", "p1a_5_w2": "Итог одинаков по условию; повторный подсчёт того же итога новых сведений не даст.", "p1a_5_w3": "Длина теломер не связана с точностью выбора нуклеотида и работой MMR.", "s2a_prob": "Если репарация остановилась, что остаётся в ДНК — само повреждение или промежуточный продукт? И что по этому можно сказать о том, на каком этапе путь остановился?", "s2a_les": "Повреждение", "s2a_blk": "Этап, на котором путь остановлен", "s2a_blk_none": "нет", "s2a_blk_rec": "узнавание", "s2a_blk_nuc": "вскрытие цепи", "s2a_blk_pol": "синтез", "s2a_blk_lig": "сшивание", "s2a_alt": "Другой путь узнавания", "s2a_alt_no": "нет", "s2a_alt_yes": "есть", "s2a_anote": "Другой путь узнавания имеет значение, только когда остановлено узнавание.", "s2a_pA": "А. Что стало со 100 условными повреждениями к моменту наблюдения", "s2a_k_lesion": "повреждение на месте", "s2a_k_inter": "промежуточный продукт", "s2a_k_ok": "восстановлено", "s2a_lbl_100": "100 условных повреждений в разных местах генома; числа — учебные значения", "s2a_pB": "Б. Цепочка состояний: {p}", "s2a_n_lesion_u": "урацил\nв цепи", "s2a_n_lesion_dimer": "димер\nв цепи", "s2a_n_recog": "узнан,\nне вырезан", "s2a_n_ap": "AP-сайт", "s2a_n_gap": "пробел", "s2a_n_nick": "разрыв\nв цепи", "s2a_n_ok": "восста-\nновлено", "s2a_e_ber_rec": "гликозилаза", "s2a_e_ber_nuc": "AP-эндонукл.", "s2a_e_ber_pol": "полимераза", "s2a_e_ber_lig": "лигаза", "s2a_e_ner_rec": "XPC, TFIIH", "s2a_e_ner_nuc": "нуклеазы", "s2a_e_ner_pol": "полимераза", "s2a_e_ner_lig": "лигаза", "s2a_lbl_alt_u": "другая гликозилаза удалила часть урацила", "s2a_lbl_alt_dimer": "второй путь: остановившаяся РНК-полимераза", "s2a_lbl_time": "одно и то же время наблюдения во всех положениях; доли — условные", "s2a_r_les": "Повреждений на месте", "s2a_r_les_s": "из 100", "s2a_v_n": "{n}", "s2a_r_int": "Промежуточный продукт", "s2a_v_int_none": "нет", "s2a_v_int_ap": "{n} AP-сайтов", "s2a_v_int_recog": "{n}: повреждение узнано, участок не вырезан", "s2a_v_int_gap": "{n} пробелов в одной цепи", "s2a_v_int_nick": "{n} разрывов в одной цепи", "s2a_r_ok": "Восстановлено", "s2a_r_rec": "Узнавание повреждения", "s2a_v_rec_yes": "произошло", "s2a_v_rec_no": "не произошло", "s2a_cap_none": "Все этапы работают: к моменту наблюдения все 100 повреждений устранены, промежуточных продуктов нет.", "s2a_cap_none_z": "Промежуточные продукты существуют, но быстро превращаются в следующие; при исправной работе пути они не накапливаются.", "s2a_cap_rec_no_u": "Узнавание остановлено, второго пути нет: урацил остаётся во всех 100 местах, промежуточных продуктов нет.", "s2a_cap_rec_no_u_z": "Если ничего не узнано, следующие этапы не начинаются: остаётся исходное повреждение.", "s2a_cap_rec_no_dimer": "Узнавание остановлено, второго пути нет: все 100 димеров на месте.", "s2a_cap_rec_no_dimer_z": "Итог «повреждение на месте» совместим с отсутствием узнавания; другие этапы оставили бы промежуточные продукты.", "s2a_cap_rec_yes_u": "Основной белок узнавания отсутствует, но урацил узнаёт и другая гликозилаза: часть повреждений (в модели 60 из 100) устранена за время наблюдения, остальные на месте.", "s2a_cap_rec_yes_u_z": "Для одного повреждения бывает несколько путей узнавания; утрата одного белка не обязательно оставляет все повреждения.", "s2a_cap_rec_yes_dimer": "Белка, узнающего искажение во всём геноме, нет, но остановившаяся на димере РНК-полимераза служит вторым сигналом. Он работает только в транскрибируемых генах — в модели 20 из 100 повреждений; остальные на месте.", "s2a_cap_rec_yes_dimer_z": "Два разных пути узнавания ведут к одним и тем же следующим этапам. Где восстановлены повреждения, показывает, какой путь узнавания работал.", "s2a_cap_nuc_u": "Урацила нет, но цепь не надрезана: накопились AP-сайты. Значит, гликозилаза урацил узнала и удалила, а остановился следующий этап.", "s2a_cap_nuc_u_z": "Накопление промежуточного продукта говорит о нарушении определённого этапа, а не об отсутствии узнавания.", "s2a_cap_nuc_dimer": "Димеры узнаны, участок раскрыт и проверен, но цепь не надрезана: повреждения на месте, хотя узнавание произошло.", "s2a_cap_nuc_dimer_z": "«Повреждение на месте» не всегда значит «не узнано»: чтобы различить эти случаи, нужно проверить, связан ли с повреждением комплекс узнавания.", "s2a_cap_pol": "Повреждённые участки удалены, но не достроены: накопились пробелы в одной цепи.", "s2a_cap_pol_z": "Пробел — уже не повреждение, но и не исправленная ДНК: информации на этом месте нет, пока её не скопируют с другой цепи.", "s2a_cap_lig": "Последовательность восстановлена, но не сшита: накопились разрывы в одной цепи.", "s2a_cap_lig_z": "Промежуточные продукты с разрывами сами опасны для клетки; продукт одного этапа пути сразу передаётся ферменту следующего.", "s2a_cap_mask": "Обратная задача: видно, что стало с повреждениями, но не видно, какой этап остановлен. Переключатели скрыты.", "s2a_cap_mask_z": "Сравните, что накопилось, с цепочкой состояний пути.", "s2a_take": "Путь репарации — цепочка этапов, и при остановке на любом из них накапливается свой промежуточный продукт: AP-сайт, пробел или разрыв в одной цепи. Поэтому накопление промежуточного продукта указывает на определённый нарушенный этап и доказывает, что узнавание произошло. Если же повреждение осталось, причины могут быть разными: нет узнавания, нет надреза после узнавания, или работает только другой, ограниченный путь узнавания. Одно повреждение может узнаваться несколькими способами, а итог «восстановлено» не говорит, каким именно.", "s2a_lim": "Модель не показывает скорости этапов: в клетке каждый этап идёт с конечной скоростью, и промежуточные продукты есть всегда; AP-сайты, кроме того, постоянно возникают сами — в клетках млекопитающих их одновременно десятки тысяч. Поэтому в клетке накопление AP-сайтов само по себе не доказывает узнавания урацила: нужен контроль — сколько их без урацила. Доли 60 и 20 из 100 — учебные значения. Модель не показывает разветвлений пути (замену одного нуклеотида или более длинного участка в BER), перекрытия путей для некоторых повреждений и того, что накопившиеся разрывы могут сами вызывать гибель клетки или превращаться при репликации в разрывы обеих цепей.", "s2a_new": "Определено строение комплекса белков человека, который проверяет повреждение при NER: белок узнавания XPC передаёт ДНК комплексу TFIIH, две хеликазы которого движутся по повреждённой цепи в противоположных направлениях и подтягивают повреждение к месту проверки; ещё один белок (XPA) изгибает ДНК и закрепляет это положение. Строение получено для пути узнавания через XPC. Положение повреждения в комплексе такое же, какое ожидается при передаче от остановившейся РНК-полимеразы; отсюда авторы заключают, что оба пути узнавания сходятся на TFIIH.", "s2a_how": "собирали комплексы из очищенных белков человека на ДНК с модельным повреждением (не на пиримидиновом димере) и определяли их строение; надрезы проверяли в бесклеточной системе. Это показывает, как белки могут взаимодействовать, но не скорость процесса в живой клетке; схождение двух путей — вывод авторов из сравнения, а не прямое наблюдение.", "p2a_1_q": "Обратная задача. В клетках с урацилом в ДНК через некоторое время урацила не осталось, но в 100 местах цепь разорвана, а последовательность уже верна. На каком этапе остановился путь?", "p2a_1_o1": "На сшивании: синтез прошёл, разрыв не сшит", "p2a_1_o2": "На узнавании: урацил не узнан", "p2a_1_o3": "Репарация не начиналась", "p2a_1_e": "Урацила нет, последовательность верна — пройдены узнавание, надрез и синтез. Остался разрыв в цепи, значит, не прошло последнее звено — сшивание.", "p2a_1_w2": "Если бы урацил не был узнан, он остался бы в цепи; а его нет.", "p2a_1_w3": "Разрыв на месте бывшего урацила — продукт работы пути; без репарации урацил остался бы, а цепь не была бы надрезана.", "p2a_1_h1": "Найдите в цепочке состояний то, которое совпадает с наблюдением.", "p2a_2_q": "Путь BER для урацила остановлен на этапе вскрытия цепи (нет AP-эндонуклеазы). Что накопится?", "p2a_2_o1": "AP-сайты", "p2a_2_o2": "Урацил", "p2a_2_o3": "Пробелы в один нуклеотид", "p2a_2_e": "Гликозилаза работает раньше и удаляет урацил; дальше без надреза путь не идёт — остаются AP-сайты.", "p2a_2_w2": "Урацил удаляет гликозилаза, она на месте; остановлен следующий этап.", "p2a_2_w3": "Пробел появляется после надреза и удаления остатка сахара, а надреза нет.", "p2a_3_q": "Для пиримидиновых димеров остановлено узнавание во всём геноме; второго пути нет. Что будет с 100 димерами?", "p2a_3_o1": "Все останутся, промежуточных продуктов не будет", "p2a_3_o2": "Накопятся пробелы около 30 нуклеотидов", "p2a_3_o3": "Их удалит путь BER", "p2a_3_e": "Без узнавания путь не начинается; повреждения остаются в исходном виде.", "p2a_3_w2": "Пробелы образуются после двойного надреза, а до него путь без узнавания не доходит.", "p2a_3_w3": "Гликозилазы BER узнают определённые изменённые основания; искажение спирали, создаваемое димером, — субстрат NER.", "p2a_4_q": "Тот же случай, но теперь работает второй путь узнавания — по РНК-полимеразе, остановившейся на димере. Что изменится?", "p2a_4_o1": "Восстановится часть повреждений — в транскрибируемых генах", "p2a_4_o2": "Восстановятся все 100 повреждений", "p2a_4_o3": "Ничего: без белка XPC путь NER невозможен", "p2a_4_e": "Остановившаяся РНК-полимераза — сигнал только там, где идёт транскрипция; повреждения в других участках генома этим путём не находятся. Дальше оба пути узнавания ведут к одним и тем же этапам.", "p2a_4_w2": "РНК-полимераза останавливается только в транскрибируемых генах и только на матричной цепи; большая часть генома так не проверяется.", "p2a_4_w3": "XPC — один из двух сигналов. Второй сигнал передаёт ДНК тому же комплексу проверки, и путь продолжается.", "p2a_5_q": "Обратная задача. Через то же время 80 димеров на месте, 20 устранены, промежуточных продуктов нет. Достаточно ли этого, чтобы заключить, что белок узнавания во всём геноме отсутствует?", "p2a_5_o1": "Нет: нужно проверить, где устранены повреждения — только в транскрибируемых генах или по всему геному", "p2a_5_o2": "Да: иначе были бы устранены все 100", "p2a_5_o3": "Да: промежуточных продуктов нет, значит, путь не работает совсем", "p2a_5_e": "Такой итог согласуется с отсутствием XPC при работающем втором пути, но в клетке похожий итог дало бы и замедленное узнавание по всему геному или более короткое наблюдение. Различает гипотезы место устранения: только транскрибируемые гены — признак второго пути.", "p2a_5_w2": "Модель упрощает время; в клетке неполное устранение бывает и при работающем, но медленном узнавании.", "p2a_5_w3": "20 повреждений устранены — путь работает; отсутствие промежуточных продуктов значит лишь, что остановки после узнавания нет.", "p2a_5_h1": "Какие разные причины могут дать «часть устранена, часть осталась»?", "s3a_prob": "Восстановить целостность молекулы и восстановить исходную последовательность — одно и то же? От чего зависит, какую информацию клетка использует при репарации разрыва?", "s3a_ph": "Период клеточного цикла", "s3a_tpl": "Гомологичная матрица в G2", "s3a_tpl_near": "сестринская хроматида рядом", "s3a_tpl_far": "сестринская хроматида не удержана рядом", "s3a_tpl_hom": "использована гомологичная хромосома", "s3a_tnote": "В G1 сестринской хроматиды нет; в модели разрыв в G1 соединяется без матрицы.", "s3a_pA": "А. Какие копии участка есть в ядре (период {ph}; схема)", "s3a_lbl_one": "разорванная хромосома: копии участка в ней нет", "s3a_lbl_hom": "гомологичная хромосома (от другого родителя)", "s3a_lbl_hom2": "гомологичная хромосома", "s3a_lbl_brk": "хроматида с разрывом", "s3a_lbl_near": "сестринская — рядом", "s3a_lbl_far": "сестринская — далеко", "s3a_lbl_mask": "Наблюдение: известна только последовательность после восстановления", "s3a_pB": "Б. Последовательность на месте разрыва после восстановления", "s3a_lbl_orig": "исходная: в позиции 7 пара T–A; в гомологичной хромосоме здесь C–G", "s3a_st_same": "последовательность как исходная", "s3a_st_del": "утрачено 4 пары нуклеотидов", "s3a_st_hom": "участок скопирован с гомологичной хромосомы:\nв позиции 7 теперь C–G", "s3a_r_src": "Информация для восстановления", "s3a_v_src_none": "не использована: концы соединены", "s3a_v_src_sis": "сестринская хроматида", "s3a_v_src_hom": "гомологичная хромосома", "s3a_v_seq_same": "как исходная", "s3a_v_seq_del": "утрачено 4 пары нуклеотидов", "s3a_v_seq_hom": "как в гомологичной хромосоме", "s3a_cap_g1_clean": "До репликации копии участка в этой хромосоме нет. Концы совместимы, NHEJ сшивает их без потерь: последовательность восстановлена, хотя никакая матрица не использована.", "s3a_cap_g1_clean_z": "Точный результат не доказывает, что работала гомологичная рекомбинация: совместимые концы восстанавливаются точно и без матрицы.", "s3a_cap_g1_lost": "До репликации копии участка в этой хромосоме нет. Концы повреждены: при соединении несколько нуклеотидов утрачено. Целостность молекулы восстановлена, исходная последовательность — нет.", "s3a_cap_g1_lost_z": "Без информации об утраченном участке его нельзя восстановить: соединение концов возвращает целостность, но не содержание.", "s3a_cap_near": "Сестринская хроматида удержана рядом белковыми кольцами когезина. Конец разрыва находит в ней тот же участок, и утраченные нуклеотиды синтезируются по копии: последовательность как исходная.", "s3a_cap_near_z": "Сестринская хроматида — точная копия, образовавшаяся при репликации; её близость делает поиск быстрым и снижает риск ошибочного выбора матрицы.", "s3a_cap_far_lost": "Сестринская хроматида есть, но не удержана рядом. В модели матрица не найдена, концы соединены без неё: утрачены 4 пары нуклеотидов — как в G1.", "s3a_cap_far_lost_z": "Наличие копии в ядре ещё не гарантирует её использование: важно, где она находится.", "s3a_cap_far_clean": "Сестринская хроматида не удержана рядом, концы соединены без матрицы; концы совместимы — последовательность как исходная.", "s3a_cap_far_clean_z": "Тот же точный итог, что при гомологичной рекомбинации, получен другим путём.", "s3a_cap_hom": "Матрицей послужила гомологичная хромосома от другого родителя. Разрыв устранён, утраченные нуклеотиды восстановлены — но по её последовательности: в позиции 7 теперь C–G, как у гомолога. Различие между двумя родительскими вариантами в этом месте утрачено.", "s3a_cap_hom_z": "Гомологичная рекомбинация точно копирует матрицу, но матрица может отличаться от исходной последовательности. Такая утрата различия называется потерей гетерозиготности.", "s3a_cap_mask": "Обратная задача: известно только, какой стала последовательность. Переключатели и информация о ядре скрыты.", "s3a_cap_mask_z": "Подумайте, какими разными путями мог получиться такой результат.", "s3a_take": "Способность восстановить целостность молекулы и способность восстановить исходную последовательность — разные свойства системы. Успешное соединение концов без матрицы возвращает целостность, а исходную последовательность — только при совместимых концах. Гомологичная рекомбинация восстанавливает утраченные нуклеотиды, но копирует матрицу: с сестринской хроматидой результат совпадает с исходным, с гомологичной хромосомой — с вариантом другого родителя. Поэтому по одному итогу нельзя доказать путь: точную последовательность дают и рекомбинация, и точное соединение совместимых концов.", "s3a_lim": "Модель не показывает, как определяется путь репарации (это регулируемый процесс, который зависит от обработки концов и от периода цикла; подробно — в курсе «Молекулярная биология»). В клетке в G2 работают оба пути — и HR, и соединение концов; в модели при сестринской хроматиде рядом показана HR. Не показаны другие способы соединения концов, при которых утрачиваются более длинные участки, соединение концов разных хромосом и ошибки синтеза при самой рекомбинации. Различие в позиции 7 и утрата 4 пар — условный пример. Показаны только успешно завершившиеся варианты репарации: неудачная репарация, гибель клетки и другие пути в модели не учитываются.", "s3a_new": "Сестринская хроматида полезна для репарации, когда находится рядом с разрывом. Белковый комплекс когезин удерживает сестринские хроматиды вместе от репликации до митоза и тем самым способствует рекомбинации именно между сёстрами, подавляя рекомбинацию с другими похожими участками генома. У дрожжей показано, что после разрыва когезин дополнительно накапливается у повреждённого участка; предполагают, что это укрепляет связь с сестринской хроматидой и облегчает точную гомологичную рекомбинацию.", "s3a_how": "в клетках вызывали разрыв в известном месте и определяли, где связывается когезин и как часто разрыв устраняется по сестринской хроматиде; данные для дрожжей и клеток млекопитающих обобщены в обзоре. Роль накопления когезина у разрыва — предположение авторов, а не прямо измеренное следствие для клеток человека.", "p3a_1_q": "Клетка в G1, концы разрыва совместимые, нуклеотиды не утрачены. Какой будет последовательность после восстановления?", "p3a_1_o1": "Как исходная, хотя матрица не использована", "p3a_1_o2": "С потерей нескольких нуклеотидов: без матрицы соединение всегда неточное", "p3a_1_o3": "Как исходная, потому что матрицей послужила гомологичная хромосома", "p3a_1_e": "Соединение совместимых концов возвращает исходную последовательность: утраченных нуклеотидов нет, восстанавливать нечего.", "p3a_1_w2": "Неточность соединения возникает при обработке повреждённых концов; совместимые концы соединяются без потерь.", "p3a_1_w3": "В модели в G1 матрица не используется; точный итог получен соединением концов.", "p3a_2_q": "Клетка в G2, концы с утратой нуклеотидов, но сестринская хроматида не удержана рядом. Каким будет итог в модели?", "p3a_2_o1": "Концы соединены, утрачено 4 пары — как в G1", "p3a_2_o2": "Участок восстановлен по сестринской хроматиде: в G2 она всегда используется", "p3a_2_o3": "Разрыв не устранён", "p3a_2_e": "Копия есть, но не рядом; в модели она не найдена, и концы соединены без матрицы. Период цикла определяет, есть ли копия, но не гарантирует её использование.", "p3a_2_w2": "Для рекомбинации копию нужно найти; удержание сестринских хроматид рядом этому способствует.", "p3a_2_w3": "Соединение концов возможно в любом периоде, и в модели оно происходит.", "p3a_3_q": "Клетка в G2, концы с утратой нуклеотидов; матрицей послужила гомологичная хромосома, у которой в позиции 7 вместо T–A пара C–G. Каким будет итог?", "p3a_3_o1": "Разрыв устранён без потерь, но в позиции 7 теперь C–G", "p3a_3_o2": "Последовательность как исходная: рекомбинация всегда точна", "p3a_3_o3": "Утрачено 4 пары нуклеотидов", "p3a_3_e": "Рекомбинация копирует матрицу точно, но матрица отличается от исходной молекулы: участок становится таким, как в гомологичной хромосоме.", "p3a_3_w2": "Точна передача последовательности матрицы, а не восстановление исходной; результат совпадает с исходным, только если матрица совпадает с ней.", "p3a_3_w3": "Утраченные нуклеотиды синтезированы по матрице; потерь нет.", "p3a_4_q": "Обратная задача. После восстановления разрыва последовательность совпадает с исходной. Каким путём он был устранён?", "p3a_4_o1": "По одному этому наблюдению нельзя сказать: так могла сработать и рекомбинация с сестринской хроматидой, и точное соединение совместимых концов", "p3a_4_o2": "Гомологичной рекомбинацией: только она точна", "p3a_4_o3": "Соединением концов в G1", "p3a_4_e": "Точный итог дают оба пути при разных условиях. Различить их помогли бы другие наблюдения: период цикла, были ли концы совместимыми, зависит ли результат от RAD51 или от Ku.", "p3a_4_w2": "Соединение совместимых концов тоже точно; точность итога не указывает на путь однозначно.", "p3a_4_w3": "Такой итог возможен и в G2 — и рекомбинацией, и соединением концов.", "p3a_4_h1": "Найдите переключателями все условия, при которых последовательность «как исходная».", "p3a_5_q": "Обратная задача. После восстановления утрачено 4 пары нуклеотидов. Что можно сказать?", "p3a_5_o1": "Концы соединены без матрицы; был ли это G1 или G2 без используемой сестринской хроматиды, по этому не определить", "p3a_5_o2": "Разрыв был в G1: в G2 потерь не бывает", "p3a_5_o3": "Матрицей была гомологичная хромосома", "p3a_5_e": "Утрата нуклеотидов показывает, что информация об участке не была скопирована. Это возможно и в G1, и в G2, если сестринская хроматида не использована.", "p3a_5_w2": "В G2 соединение концов тоже возможно; наличие сестринской хроматиды не гарантирует рекомбинацию.", "p3a_5_w3": "Рекомбинация восстанавливает утраченные нуклеотиды по матрице; потери говорят об обратном.", "s4a_prob": "Естественный конец хромосомы устроен как конец разорванной двойной спирали, но в норме его не узнают как разрыв. Длина теломеры и её защита — одно свойство или два разных? Достаточно ли измерить длину, чтобы судить о защите?", "s4a_end": "Конец молекулы ДНК", "s4a_end_tel": "теломера с шелтерином", "s4a_end_notrf2": "теломера без TRF2", "s4a_end_dsb": "внутренний разрыв", "s4a_tert": "Теломераза", "s4a_tert_off": "неактивна", "s4a_tert_on": "активна", "s4a_tnote": "В модели теломераза действует только на теломеры.", "s4a_div": "Делений клетки", "s4a_div_0": "0", "s4a_div_20": "20", "s4a_div_40": "40", "s4a_div_50": "50", "s4a_note": "Условные значения модели: начальная длина 6 000 нуклеотидов, потеря 100 нуклеотидов за деление без теломеразы, порог защиты 1 500. Это не измерения и не клинические пороги.", "s4a_pA": "А. Длина теломеры при делениях (условные нуклеотиды)", "s4a_ax_x": "число делений", "s4a_ax_y": "длина теломеры", "s4a_thr": "порог защиты в модели", "s4a_lbl_nodata": "внутренний разрыв: теломерных повторов нет", "s4a_lbl_noobs": "состояние конца не наблюдали: известна только длина", "s4a_pB": "Б. Состояние конца", "s4a_st_prot": "конец защищён:\nне узнаётся как разрыв", "s4a_st_short": "теломера критически\nкороткая: защита утрачена", "s4a_st_notrf2": "без TRF2 конец открыт", "s4a_st_dsb": "настоящий разрыв:\nего узнают и репарируют", "s4a_st_broke": "конец узнаётся\nкак разрыв", "s4a_e_rec": "Ku (разрыв)", "s4a_r_len": "Длина теломеры", "s4a_r_len_s": "условные нуклеотиды", "s4a_v_len": "{n}", "s4a_v_len_na": "теломеры нет", "s4a_r_prot": "Конец защищён", "s4a_v_prot_yes": "да", "s4a_v_prot_no": "нет: узнаётся как разрыв", "s4a_r_cause": "Почему", "s4a_v_cause_ok": "шелтерин на месте, длина выше порога", "s4a_v_cause_short": "длина ниже порога модели", "s4a_v_cause_notrf2": "нет TRF2 — белка, необходимого для t-петли", "s4a_v_cause_dsb": "это не теломера", "s4a_cap_ok_off": "Теломера с шелтерином после {d} делений без теломеразы: длина {n}, выше порога модели. Конец укорачивается, но остаётся защищённым.", "s4a_cap_ok_off_z": "Укорочение само по себе не равно утрате защиты: пока повторов достаточно для защитной структуры, конец не узнаётся как разрыв.", "s4a_cap_ok_on": "Теломераза возмещает потери при каждом делении: длина {n} сохраняется, конец защищён.", "s4a_cap_ok_on_z": "Теломераза поддерживает длину; защиту обеспечивает шелтерин. В клетках с активной теломеразой укорочение не накапливается.", "s4a_cap_short": "После {d} делений без теломеразы длина теломеры {n} — ниже порога модели (1 500): защитная структура не удерживается, конец узнаётся как разрыв. Модель не учитывает, что в клетке укорочение ниже порога останавливает деления раньше: здесь считается только длина.", "s4a_cap_short_z": "Утрата защиты при укорочении — следствие длины; в модели это происходит только ниже порога, а не при любом укорочении.", "s4a_cap_notrf2": "Длина теломеры {n}, но белка TRF2 нет: t-петли не образуются, и конец узнаётся как разрыв при любой длине. NHEJ может сшить такие концы разных хромосом.", "s4a_cap_notrf2_z": "Защита зависит от белков шелтерина, а не только от длины: длинная теломера без TRF2 не защищена.", "s4a_cap_dsb": "Внутренний разрыв обеих цепей: теломерных повторов и шелтерина здесь нет, и концы узнаются как разрыв — его устраняют пути вопроса 3.", "s4a_cap_dsb_z": "Геометрически конец разрыва и конец хромосомы похожи; различает их белковая структура, которая есть только на теломере.", "s4a_cap_mask": "Обратная задача: видно наблюдение, условия скрыты.", "s4a_cap_mask_z": "Отделите то, что известно о длине, от того, что известно о защите.", "s4a_take": "Длина теломеры и защита конца — разные свойства. Длину уменьшает неполная репликация концов и поддерживает теломераза; защиту обеспечивают белки шелтерина (считается, что в t-петле, для образования которой необходим TRF2, конец недоступен белкам, узнающим разрывы). Короткая теломера может ещё быть защищена, а длинная без TRF2 — нет. Поэтому одного измерения длины недостаточно, чтобы судить о защите: нужно наблюдать сам признак — узнаётся ли конец как разрыв.", "s4a_lim": "У каждой хромосомы два конца, и длина теломер у них различается; утрата защиты наступает на самой короткой теломере, а средняя длина этого не показывает. Порог 1 500, начальная длина 6 000 и потеря 100 нуклеотидов за деление — условные значения; в клетках человека они зависят от типа клеток и условий. Модель не показывает переходных состояний (сигнал повреждения на теломере без слияния концов), регуляции теломеразы шелтерином и того, что сигнал от короткой теломеры может вести к остановке делений или к гибели клетки — это темы курса «Молекулярная биология».", "s4a_new": "Концы хромосом при репликации укорачиваются по двум причинам, а не по одной. У конца, где G-цепь служит матрицей для отстающей цепи, синтез новой C-цепи останавливается, не дойдя до края, так как затравки на 3′-выступе не синтезируются. У другого конца для образования 3′-выступа укорачивается 5′-конец C-цепи. В клетках опухолевой линии человека без комплекса CST, который достраивает C-цепь, она укорачивалась примерно на 50–60 нуклеотидов за репликацию у первого конца и примерно на 100 — у второго. Теломераза удлиняет только G-цепь, поэтому C-цепь поддерживается отдельным ферментом — полимеразой α с праймазой. В модели этой вкладки укорочение задано одним средним числом за деление; на самом деле два конца хромосомы укорачиваются по-разному, и защиту первой теряет самая короткая теломера.", "s4a_how": "в клетках опухолевой линии человека выключали белок комплекса CST и измеряли длину каждой из двух цепей теломер по отдельности на концах разных типов; в пробирке собирали репликацию из очищенных белков пекарских дрожжей — что реплисома человека ведёт себя так же, авторы предполагают по сходству строения. Числа получены в одной линии клеток и на другие клетки не переносятся.", "p4a_1_q": "Теломера с шелтерином, теломераза неактивна. Что будет с концом после 40 делений?", "p4a_1_o1": "Теломера короче, но конец ещё защищён", "p4a_1_o2": "Теломера короче, и поэтому защита уже утрачена", "p4a_1_o3": "Длина не изменится: шелтерин защищает от укорочения", "p4a_1_e": "Каждое деление уносит 100 условных нуклеотидов: 6 000 − 40 × 100 = 2 000. Это выше порога модели, и шелтерин удерживает защитную структуру.", "p4a_1_w2": "Укорочение и утрата защиты — не одно и то же: в модели защита утрачивается только ниже порога.", "p4a_1_w3": "Шелтерин защищает конец от узнавания как разрыв, но не возмещает недокопированные участки; это делает теломераза.", "p4a_2_q": "Ещё 10 делений — всего 50. Что изменится?", "p4a_2_o1": "Длина опустится ниже порога: конец узнаётся как разрыв", "p4a_2_o2": "Ничего: шелтерин защищает при любой длине", "p4a_2_o3": "Теломера исчезнет полностью", "p4a_2_e": "6 000 − 50 × 100 = 1 000 — ниже порога 1 500: защитная структура не удерживается, конец узнаётся как разрыв.", "p4a_2_w2": "Шелтерину нужны повторы, на которых он собирается; при критически короткой теломере защита не удерживается.", "p4a_2_w3": "Повторов осталось 1 000 условных нуклеотидов; теломера коротка, но не исчезла.", "p4a_3_q": "Теломера исходной длины (0 делений), но в клетке нет TRF2. Защищён ли конец?", "p4a_3_o1": "Нет: без TRF2 нет t-петли, и конец узнаётся как разрыв", "p4a_3_o2": "Да: теломера длинная", "p4a_3_o3": "Да, пока не пройдёт 50 делений", "p4a_3_e": "Защита — свойство структуры конца. Без TRF2 конец не спрятан в t-петлю и узнаётся белками разрывов при любой длине.", "p4a_3_w2": "Длина сама по себе не защищает; длинный конец без шелтерина узнаётся как разрыв.", "p4a_3_w3": "Число делений определяет длину, а здесь нарушена не длина, а защитный белок.", "p4a_4_q": "Клетка с теломерой после 50 делений; в ней с самого начала активна теломераза. Что будет с концом?", "p4a_4_o1": "Длина сохранится, конец защищён", "p4a_4_o2": "Теломера станет бесконечно длинной", "p4a_4_o3": "Конец всё равно узнается как разрыв", "p4a_4_e": "В модели теломераза возмещает потери каждого деления, и длина остаётся постоянной; конец защищён. В клетке длина теломер с теломеразой поддерживается в определённом диапазоне, а не растёт без предела.", "p4a_4_w2": "Активность теломеразы регулируется; длина поддерживается в определённом диапазоне.", "p4a_4_w3": "При сохранённой длине и шелтерине конец защищён.", "p4a_5_q": "Обратная задача. Средняя длина теломер уменьшилась с 6 000 до 4 000 условных нуклеотидов. Достаточно ли этого, чтобы заключить, что защита концов утрачена?", "p4a_5_o1": "Нет: нужно наблюдать признак защиты — узнаются ли концы как разрывы", "p4a_5_o2": "Да: укорочение означает утрату защиты", "p4a_5_o3": "Да, если клетка ещё делится", "p4a_5_e": "При длине 4 000 конец в модели защищён, а при длине 6 000 без TRF2 — нет. Длина и защита измеряются по-разному; кроме того, средняя длина не показывает самую короткую теломеру.", "p4a_5_w2": "Укорочение — признак числа делений без теломеразы, а не утраты защиты: в модели защита держится выше порога.", "p4a_5_w3": "Деление клетки не измеряет защиту концов; нужно прямое наблюдение признака.", "p4a_5_h1": "Сравните два положения: «теломера с шелтерином, 20 делений» и «теломера без TRF2, 0 делений».", "p4a_6_q": "Обратная задача. Конец узнаётся как разрыв, хотя на нём 6 000 нуклеотидов теломерных повторов. Какое объяснение согласуется с наблюдением?", "p4a_6_o1": "Нарушена защитная структура (например, нет TRF2), а не длина", "p4a_6_o2": "Теломера критически короткая", "p4a_6_o3": "Это внутренний разрыв, а не конец хромосомы", "p4a_6_e": "Повторов много — значит, причина не в длине. Конец теломеры узнаётся как разрыв, когда утрачен шелтерин.", "p4a_6_w2": "Длина 6 000 выше порога модели; укорочение не объясняет наблюдение.", "p4a_6_w3": "У внутреннего разрыва нет теломерных повторов, а здесь их 6 000.", "tl_slider": "Ход процесса: положение на шкале этапов", "tl_chips": "Этапы процесса", "tl_step": "Этап {i} из {n}", "tl_play": "▶ Запустить", "tl_pause": "❚❚ Пауза", "tl_again": "↺ Ещё раз", "tl_back": "◀ Шаг", "tl_fwd": "Шаг ▶", "tl_reset": "Сначала", "tl_note": "Порядок этапов — учебная модель. Длительность этапов условная, не измерена.", "rd_final": "Показания — итог выбранных условий, как на последнем этапе шкалы.", "predict_note": "Условие изменено. Предскажите, что произойдёт, и нажмите «▶ Запустить» или выберите этап на шкале — подпись появится после запуска.", "predict_reads": "Показания появятся после запуска.", "s1t_note": "Порядок этапов — учебная модель. Последовательность из 11 нуклеотидов и длина заменяемого участка на схеме условные; длительность этапов не измерена.", "s1t_1": "Выбор нуклеотида: напротив A матрицы ДНК-полимераза присоединила C вместо T — возникла ошибочная пара C·A.", "s1t_2_on": "Коррекция 3′-конца: неспаренный 3′-конец не удлиняется и переходит в экзонуклеазный центр ДНК-полимеразы; неверный C отщепляется, напротив A встаёт T.", "s1t_2_off": "Коррекция 3′-конца выключена: синтез продолжается, и ошибочная пара C·A остаётся в новой цепи позади полимеразы.", "s1t_3_proof": "MMR: ошибочной пары в новой цепи уже нет — исправлять нечего.", "s1t_3_mmr": "MMR: белок узнавания (MutS) связывается с ошибочной парой; новую цепь узнают по разрыву в ней, её участок удаляется и синтезируется заново по матрице.", "s1t_3_nomark": "MMR: белок узнавания (MutS) связывается с ошибочной парой, но разрывов в новой цепи нет: в модели не определено, какая цепь новая, и исправление не начинается.", "s1t_3_none": "MMR выключена: ошибочная пара C·A остаётся в новой цепи до следующей репликации.", "s1t_4_same": "Следующая репликация: цепи расходятся, и каждая служит матрицей; в обеих дочерних молекулах на этом месте пара T–A.", "s1t_4_fixed": "Следующая репликация: цепи расходятся; напротив C новой цепи встаёт G — в одной из двух дочерних молекул пара C–G вместо T–A закреплена.", "s1a_tl_note": "Порядок этапов — учебная модель. Все числа на схеме условные; шкала столбцов логарифмическая.", "s1a_tl_1": "Выбор нуклеотида: при копировании условных 10¹⁰ нуклеотидов часть присоединённых оказывается неверной — возникают ошибочные пары.", "s1a_tl_2": "Коррекция 3′-конца: экзонуклеаза ДНК-полимеразы сразу удаляет заданную бегунком долю возникших ошибок.", "s1a_tl_2_0": "Коррекции нет: все возникшие ошибки остаются в новой цепи.", "s1a_tl_3": "MMR: после синтеза исправляется заданная бегунком доля ошибок, оставшихся после коррекции.", "s1a_tl_3_0": "MMR нет: ошибки, пропущенные коррекцией, не исправляются.", "s1a_tl_3_late": "MMR не успела до следующей репликации: ошибки, пропущенные коррекцией, не исправлены.", "s1a_tl_4": "Следующая репликация: каждая оставшаяся ошибочная пара закрепляется как изменение последовательности в одной из двух дочерних молекул.", "s1a_u_none": "", "s1a_u_pc": "%", "s1a_ex": "1 на 10 000", "s1a_ex5": "1 на 100 000", "s1a_rx_note": "Бегунки переходят только по засечкам: это положения модели, а не измеренные значения; расстояния между засечками не пропорциональны значениям.", "s2t_note": "Порядок этапов — учебная модель. Длина вырезаемого участка на схеме условная (у человека при NER — около 30 нуклеотидов); длительность этапов не измерена.", "s2t_1_ber": "Узнавание: ДНК-гликозилаза узнаёт изменённое основание и отщепляет его от сахара — остаётся AP-сайт.", "s2t_1_ap": "Узнавание: основания уже нет, гликозилаза не нужна — AP-сайт узнаёт AP-эндонуклеаза.", "s2t_1_ner": "Узнавание: белки узнавания (среди них XPC) находят искажение спирали; TFIIH раскрывает участок и проверяет повреждение.", "s2t_2_ber": "Вскрытие цепи: AP-эндонуклеаза надрезает остов у AP-сайта; нуклеотид без основания удаляется.", "s2t_2_ner": "Вскрытие цепи: две нуклеазы надрезают цепь по обе стороны от повреждения, и участок около 30 нуклеотидов (у человека) удаляется.", "s2t_3": "Синтез: ДНК-полимераза достраивает пробел по неповреждённой цепи.", "s2t_4": "Сшивание: ДНК-лигаза соединяет разрыв в остове.", "s2t_stop_rec": "Путь остановился на этапе 1: без белка узнавания повреждение не найдено и осталось в цепи.", "s2t_stop_nuc_ber": "Путь остановился на этапе 2: без AP-эндонуклеазы цепь не надрезана — остался AP-сайт.", "s2t_stop_nuc_ner": "Путь остановился на этапе 2: повреждение узнано, но без нуклеаз участок не вырезан.", "s2t_stop_pol": "Путь остановился на этапе 3: участок вырезан, но без ДНК-полимеразы пробел не достроен.", "s2t_stop_lig": "Путь остановился на этапе 4: участок достроен, но без ДНК-лигазы остался разрыв в одной цепи.", "s2t_stop_notpl": "Путь остановился на этапе 3: напротив вырезанного участка тоже повреждение — в модели правильной матрицы для достройки нет.", "tl_step0": "Этап {k} из {m}", "s2a_tl_note": "Порядок этапов — учебная модель. Числа на схеме — условные счётчики 100 повреждений; доли при другом пути узнавания условные.", "s2a_tl_0": "Начало: в разных местах генома возникли 100 условных повреждений.", "s2a_tl_rec_ber": "Узнавание: гликозилаза отщепляет урацил — на его месте остаются AP-сайты.", "s2a_tl_rec_ner": "Узнавание: белки узнавания находят димеры, участок раскрывается и проверяется.", "s2a_tl_rec_alt": "Узнавание: основной путь остановлен; другим путём узнавания за время наблюдения устранена часть повреждений (доля условная).", "s2a_tl_nuc_ber": "Вскрытие цепи: AP-эндонуклеаза надрезает остов — на месте AP-сайтов пробелы в один нуклеотид.", "s2a_tl_nuc_ner": "Вскрытие цепи: нуклеазы вырезают участки с димерами — остаются пробелы.", "s2a_tl_pol": "Синтез: ДНК-полимераза заполняет пробелы — остаются разрывы в одной цепи.", "s2a_tl_lig": "Сшивание: ДНК-лигаза соединяет разрывы — участки восстановлены.", "s2a_tl_stop_rec": "Путь остановлен на узнавании: повреждения остаются на месте.", "s2a_tl_stop_rec_alt": "Основной путь остановлен на узнавании: часть повреждений устранена другим путём, остальные остаются на месте.", "s2a_tl_stop_nuc_ber": "Путь остановлен на вскрытии цепи: накапливаются AP-сайты — промежуточный продукт.", "s2a_tl_stop_nuc_ner": "Путь остановлен на вскрытии цепи: димеры узнаны, но не вырезаны — повреждения остаются на месте.", "s2a_tl_stop_pol": "Путь остановлен на синтезе: накапливаются пробелы — промежуточный продукт.", "s2a_tl_stop_lig": "Путь остановлен на сшивании: накапливаются разрывы в одной цепи — промежуточный продукт.", "s3t_note": "Порядок этапов — учебная модель. Утрата 4 пар нуклеотидов и длины участков на схеме условные; длительность этапов не измерена.", "s3t_1": "Разрыв обеих цепей: молекула ДНК разделена на две части.", "s3t_nhej_ku": "Белки Ku связывают оба конца и удерживают их рядом.", "s3t_nhej_proc_clean": "Концы обрабатываются; совместимые концы в модели соединяются без утраты нуклеотидов.", "s3t_nhej_proc_lost": "Концы обрабатываются: повреждённые нуклеотиды на концах удаляются — утрачены 4 пары (число условное).", "s3t_nhej_lig": "Лигаза IV сшивает концы; матрица для этого не нужна.", "s3t_hr_res": "Нуклеазы резекции укорачивают 5′-концы — образуются одноцепочечные 3′-концы.", "s3t_hr_rad51": "На одноцепочечных 3′-концах собирается RAD51.", "s3t_hr_pair": "Конец спаривается с комплементарным участком сестринской хроматиды.", "s3t_hr_syn": "ДНК-полимераза синтезирует недостающий участок по сестринской хроматиде; сама сестринская хроматида не меняется.", "s3t_stop_rad51": "Путь остановился на этапе 3: концы резецированы, но без RAD51 конец не спаривается с сестринской хроматидой — в модели разрыв не устранён.", "s3t_stop_ku": "Путь остановился на этапе 2: без Ku концы не удерживаются рядом — в модели разрыв остался.", "s3t_stop_lig4": "Путь остановился на этапе 4: концы удерживаются рядом, но без лигазы IV не сшиты — в модели разрыв остался.", "s3t_stop_ku_nores": "Путь остановился на этапе 2: резекции нет, поэтому HR не начата, а без Ku концы не удерживаются рядом — в модели разрыв остался.", "s3t_stop_lig4_nores": "Путь остановился на этапе 4: резекции нет, поэтому HR не начата, а без лигазы IV концы не сшиты — в модели разрыв остался.", "s3a_tl_note": "Порядок этапов — учебная модель. Положение хромосом в ядре и длины участков на схеме условные.", "s3a_tl_1": "Разрыв обеих цепей в одной хроматиде: молекула разделена на две части.", "s3a_tl_2_g1": "Источник информации: в G1 сестринской хроматиды нет — в модели концы соединяются без матрицы (NHEJ).", "s3a_tl_2_near": "Источник информации: сестринская хроматида удержана рядом когезином; концы резецируются, и идёт поиск комплементарного участка на ней.", "s3a_tl_2_far": "Источник информации: сестринская хроматида не удержана рядом — в модели HR не идёт, концы соединяются без матрицы (NHEJ).", "s3a_tl_2_hom": "Источник информации: матрицей становится гомологичная хромосома другого родителя; концы резецируются, и конец спаривается с ней.", "s3a_tl_3_clean": "Восстановление: совместимые концы сшиты напрямую, без утраты нуклеотидов.", "s3a_tl_3_lost": "Восстановление: концы сшиты напрямую после удаления повреждённых нуклеотидов — утрачены 4 пары (число условное).", "s3a_tl_3_sis": "Восстановление: ДНК-полимераза синтезирует участок по сестринской хроматиде.", "s3a_tl_3_hom": "Восстановление: ДНК-полимераза синтезирует участок по гомологичной хромосоме — копируется её вариант последовательности.", "s3a_tl_4_same": "Итог: целостность молекулы восстановлена, последовательность как исходная.", "s3a_tl_4_del": "Итог: целостность молекулы восстановлена, но 4 пары нуклеотидов утрачены.", "s3a_tl_4_hom": "Итог: целостность молекулы восстановлена, но в позиции 7 теперь вариант гомологичной хромосомы — пара C–G вместо T–A.", "s4t_note": "Порядок этапов — учебная модель. Один повтор на схеме обозначает много повторов TTAGGG; числа повторов условные; длительность этапов не измерена.", "s4t_1": "На этом конце последнюю РНК-затравку отстающей цепи нельзя заменить ДНК: новая C-цепь у конца не достраивается.", "s4t_2": "3′-выступ G-цепи (рамка): на показанном конце он остаётся, потому что новая C-цепь у края не достроена. Там, где выступа после репликации нет, его создаёт специальная нуклеаза, укорачивающая 5′-конец C-цепи.", "s4t_3_on": "Теломераза спаривает свою РНК с 3′-концом G-цепи и присоединяет повторы TTAGGG, используя dNTP.", "s4t_3_off": "Теломераза неактивна: G-цепь не удлиняется.", "s4t_4_yes": "ДНК-полимераза α с праймазой достраивает C-цепь по удлинённой G-цепи: двуцепочечная часть — как до репликации.", "s4t_4_no": "C-цепь не достраивается: G-цепь удлинена, но двуцепочечная часть короче, чем до репликации.", "s4t_4_na": "Достраивать нечего: без теломеразы G-цепь не удлинена — двуцепочечная часть конца стала короче.", "s4t_5_prot": "Шелтерин связывает повторы; с TRF2 3′-выступ встраивается в двуцепочечную часть (t-петля). Считается, что так конец становится недоступен белкам, узнающим разрывы.", "s4t_5_unprot": "Шелтерина нет: t-петля не образуется.", "s4t_stop_unprot": "Конец не защищён: белки, узнающие разрывы, связываются с ним как с разрывом обеих цепей.", "s4a_tl_note": "Порядок этапов — учебная модель. Длины, потеря за деление и порог условные; прекращение делений модель не показывает.", "s4a_tl_1_off": "Деления: без теломеразы теломера в модели укорачивается на 100 условных нуклеотидов за деление.", "s4a_tl_1_on": "Деления: активная теломераза восполняет потерю — в модели длина теломеры не меняется.", "s4a_tl_1_dsb": "Деления: у внутреннего разрыва теломерных повторов нет — длины в модели нет.", "s4a_tl_2_ok": "Состояние конца: шелтерин на месте, длина выше порога модели — конец защищён.", "s4a_tl_2_short": "Состояние конца: длина опустилась ниже порога модели — конец узнаётся как разрыв. Прекращение делений модель не показывает.", "s4a_tl_2_notrf2": "Состояние конца: без TRF2 конец узнаётся как разрыв при любой длине.", "s4a_tl_2_dsb": "Состояние конца: настоящий разрыв узнаётся белками разрыва и репарируется.", "s4a_u_div": "", "s4a_rx_note": "Бегунок переходит только по засечкам 0, 20, 40 и 50 делений — это положения модели. Порог условный: в клетке защита утрачивается не на определённом делении, а сначала на самой короткой теломере.", "s2_pA_an": "А. Участок ДНК: {p}", "s3a_pB_an": "Б. Участок ДНК на месте разрыва", "s1_e_pol": "ДНК-полимераза", "s2t_1_none_ber": "Узнавание: белка узнавания нет — изменённое основание не найдено.", "s2t_1_none_ner": "Узнавание: белков узнавания нет — искажение спирали не найдено.", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Что измеряется", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а получено «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Какое измерение их разделит?", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Какое измерение их разделит?", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Чтобы из предложенных объяснений осталось одно, достаточно, например, измерений: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Начать заново", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента. Список причин здесь задан заранее, в реальной работе его нет.", "c1_title": "Изменённых оснований нет, но репарация во многих местах не завершена", "c1_obs": "Условия: в ДНК клеток возникло много изменённых оснований; каждое удаляет ДНК-гликозилаза, и на его месте остаётся AP-сайт — дальше работает путь вырезания основания (BER). Наблюдение: через некоторое время изменённых оснований не осталось, но во многих местах исходная двойная спираль не восстановлена. Причина одна из трёх; какая — определите по измерениям.", "c1_c_lig": "Нет ДНК-лигазы", "c1_c_pol": "Нет ДНК-полимеразы, достраивающей пробел", "c1_c_ape": "Нет AP-эндонуклеазы", "c1_m_base": "Изменённые основания на месте повреждений", "c1_m_site": "Что на месте удалённого основания", "c1_m_seq": "Есть ли на этом месте нуклеотид, комплементарный другой цепи", "c1_v_base_no": "нет", "c1_v_site_ok": "цепь восстановлена и сшита", "c1_v_site_nick": "разрыв: все нуклеотиды на месте, не хватает одной связи", "c1_v_site_gap": "пробел: нуклеотида нет", "c1_v_site_ap": "AP-сайт: сахар без основания, цепь не надрезана", "c1_v_seq_same": "есть, как в исходной молекуле", "c1_v_seq_none": "нет", "c1_k_base": "Что измеряется: остались ли изменённые основания на месте повреждений. Метод в учебной модели не задан: значение — предсказание модели. Чего не говорит: на каком этапе остановилась репарация.", "c1_k_site": "Что измеряется: какой промежуточный продукт вырезания основания остался — AP-сайт, пробел или разрыв остова. Метод в учебной модели не задан: значение — предсказание модели. Контроль: клетки со всеми ферментами пути.", "c1_k_seq": "Что измеряется: встроен ли на место удалённого основания нуклеотид, комплементарный неповреждённой цепи. Метод в учебной модели не задан: значение — предсказание модели. Чего не говорит: сшита ли цепь.", "c1_w_lig": "Изменённое основание удалено, на его месте уже стоит правильный нуклеотид, но в остове остался разрыв: путь прошёл узнавание, вскрытие цепи и синтез и остановился на сшивании. Значит, нет ДНК-лигазы.", "c1_after": "Промежуточный продукт показывает, на каком этапе остановился путь: AP-сайт — до вскрытия цепи, пробел — до синтеза, разрыв — до сшивания. На схеме — путь с того момента, когда гликозилаза уже удалила основание и остался AP-сайт.", "c1_src": "Правила модели — по учебнику и обзору вырезания основания (см. «Источники» внизу страницы). Значения таблицы выведены из модели вкладки 2.", "c1_link_h": "seminar-8-route.html#intermediates", "c1_link_t": "Подробнее: шаг «Что накапливается при остановке репарации и что это говорит о причине» в «Объяснениях» (сверх программы)", "c2_title": "На концах хромосом собираются белки, узнающие разрывы", "c2_obs": "Условия: делящиеся клетки; теломераза в них неактивна. Наблюдение: на концах молекул ДНК в ядре собираются белки, узнающие разрывы; длину теломер не измеряли. Причина одна из трёх; какая — определите по измерениям.", "c2_c_notrf2": "Нет TRF2 — белка шелтерина, необходимого для t-петли", "c2_c_short": "Теломеры укоротились ниже порога", "c2_c_brk": "Это не концы хромосом, а разрывы внутри них", "c2_m_rep": "Теломерные повторы TTAGGG на этом конце", "c2_m_len": "Длина теломеры", "c2_m_shel": "TRF2 на конце", "c2_v_rep_yes": "есть", "c2_v_rep_no": "нет", "c2_v_len_long": "длинная, как в контроле", "c2_v_len_short": "короткая", "c2_v_len_none": "не определяется: повторов нет", "c2_v_shel_yes": "есть", "c2_v_shel_no": "нет", "c2_k_rep": "Что измеряется: есть ли на конце теломерные повторы. Метод в учебной модели не задан: значение — предсказание модели. Чего не говорит: защищён ли конец.", "c2_k_len": "Что измеряется: длина теломерных повторов на конце. Метод в учебной модели не задан: значение — предсказание модели. Чего не говорит: защищён ли конец.", "c2_k_shel": "Что измеряется: связан ли с концом TRF2. Метод в учебной модели не задан: значение — предсказание модели.", "c2_w_notrf2": "Повторы на месте и длинные, но TRF2 на конце нет — и конец узнаётся как разрыв. Защита конца зависит от шелтерина (TRF2 необходим для t-петли), а не только от длины.", "c2_after": "Длина и защита конца — разные свойства: длинная теломера без шелтерина не защищена. На схеме — один цикл репликации конца без шелтерина; укорочение за цикл в модели условное.", "c2_src": "Правила модели — по учебнику и работе о роли TRF2 (см. «Источники» внизу страницы). Значения таблицы выведены из моделей вкладки 4.", "c2_link_h": "seminar-8-route.html#protection-vs-length", "c2_link_t": "Подробнее: шаг «Защита конца и длина теломеры — разные свойства» в «Объяснениях» (сверх программы)", "gn_template": "Матрица", "g_template": "Цепь ДНК, по которой строится новая цепь: напротив каждого её основания встаёт комплементарный нуклеотид. При репликации матрицей служит каждая из двух родительских цепей; при репарации — неповреждённая цепь или неповреждённая копия участка.", "gn_newstrand": "Новая (дочерняя) цепь ДНК", "g_newstrand": "Цепь, которую ДНК-полимераза строит по матрице в направлении 5′→3′; она комплементарна и антипараллельна матрице.", "gn_polymerase": "ДНК-полимераза", "g_polymerase": "Фермент, который присоединяет нуклеотиды к 3′-OH растущей цепи по матрице. Полимеразы, копирующие основную часть генома (δ и ε), имеют корректирующую 3′→5′-экзонуклеазу; полимераза α, начинающая синтез, её не имеет.", "gn_exo": "Корректирующая экзонуклеаза (коррекция 3′-конца)", "g_exo": "Активность ДНК-полимеразы, отщепляющая нуклеотиды с 3′-конца растущей цепи в направлении 3′→5′. Неверно спаренный последний нуклеотид переходит в экзонуклеазный центр и удаляется, после чего синтез продолжается.", "gn_mismatch": "Ошибочная пара (неправильно спаренные нуклеотиды)", "g_mismatch": "Пара оснований, не соответствующая правилам комплементарности, например G·T, при том что оба основания химически не изменены. Возникает при ошибке выбора нуклеотида и искажает геометрию двойной спирали.", "gn_muts": "Белок узнавания ошибочной пары (MutS)", "g_muts": "Белок системы репарации ошибочно спаренных нуклеотидов, который связывается с ошибочной парой; у человека это комплексы MutSα и MutSβ. Название — по сходному белку бактерий.", "gn_mmr": "Репарация ошибочно спаренных нуклеотидов (MMR)", "g_mmr": "Система, которая после синтеза находит ошибочные пары, определяет новую цепь (у эукариот — по разрывам в ней), удаляет участок новой цепи с ошибкой и синтезирует его заново по матрице.", "gn_nick": "Разрыв в одной цепи", "g_nick": "Нарушение сахаро-фосфатного остова одной цепи при целой второй цепи; нуклеотиды не утрачены. Сшивается ДНК-лигазой. Разрывы в новой цепи служат меткой для MMR; как промежуточный продукт возникают в конце эксцизионной репарации.", "gn_mutation": "Мутация (закреплённое изменение последовательности)", "g_mutation": "Устойчивое изменение последовательности нуклеотидов ДНК: обе цепи согласованы, системы репарации его уже не узнают, и при репликации оно передаётся дочерним молекулам. Системы репарации его не узнают, потому что в нём нет ни повреждения, ни ошибочной пары.", "gn_uracil": "Урацил в ДНК", "g_uracil": "Основание, которое образуется в ДНК при отщеплении аминогруппы от цитозина (дезаминирование). Спаривается с аденином, поэтому, если его не удалить до репликации, в одной из дочерних молекул образуется пара U–A, а после следующей репликации — T–A вместо исходной C–G.", "gn_glycosylase": "ДНК-гликозилаза", "g_glycosylase": "Фермент, который узнаёт определённое изменённое основание (урацил, окисленное или алкилированное) и отщепляет его от сахара, оставляя AP-сайт. Начинает путь вырезания основания (BER).", "gn_apsite": "AP-сайт", "g_apsite": "Место в цепи ДНК, где нуклеотид лишён основания, а сахаро-фосфатный остов цел (апуриновый или апиримидиновый участок). Возникает самопроизвольно или после работы гликозилазы; узнаётся AP-эндонуклеазой.", "gn_apend": "AP-эндонуклеаза", "g_apend": "Фермент, который узнаёт AP-сайт и надрезает сахаро-фосфатный остов рядом с ним, подготавливая место для встраивания нового нуклеотида.", "gn_dimer": "Пиримидиновый димер", "g_dimer": "Два соседних пиримидина одной цепи (T–T, T–C или C–C), ковалентно связанные под действием ультрафиолета. Искажает двойную спираль и удаляется у человека путём вырезания нуклеотидов (NER).", "gn_xpc": "Белки узнавания NER (XPC, TFIIH)", "g_xpc": "Белки узнавания (среди них XPC) находят искажение двойной спирали в любом участке генома; комплекс TFIIH раскрывает участок и проверяет, есть ли в цепи повреждение. В транскрибируемых генах сигналом служит остановившаяся РНК-полимераза.", "gn_nernuc": "Нуклеазы NER", "g_nernuc": "Две нуклеазы, надрезающие повреждённую цепь по обе стороны от повреждения; участок около 30 нуклеотидов (у человека) удаляется целиком.", "gn_gap": "Пробел в одной цепи", "g_gap": "Участок, где нуклеотиды одной цепи удалены, а противоположная цепь не повреждена. Промежуточный продукт эксцизионной репарации: заполняется ДНК-полимеразой по противоположной цепи.", "gn_patch": "Восстановленный участок", "g_patch": "Участок цепи, синтезированный заново по матрице при репарации; его последовательность определяется матрицей.", "gn_ligase": "ДНК-лигаза", "g_ligase": "Фермент, соединяющий 3′-OH одного нуклеотида с 5′-фосфатом соседнего, то есть сшивающий разрыв сахаро-фосфатного остова.", "gn_damagedstrand": "Цепь с повреждением", "g_damagedstrand": "Цепь ДНК, в которой изменено или утрачено основание либо нуклеотиды сшиты между собой. При эксцизионной репарации повреждённый участок этой цепи удаляется.", "gn_intactstrand": "Неповреждённая цепь", "g_intactstrand": "Цепь, комплементарная повреждённой; при эксцизионной репарации служит матрицей, поэтому исходная последовательность восстанавливается точно.", "gn_dmg2": "Повреждение во второй цепи", "g_dmg2": "Повреждение противоположной цепи на том же участке. Когда обе цепи повреждены в одном месте, правильной матрицы в этой молекуле нет.", "gn_dsb": "Двуцепочечный разрыв", "g_dsb": "Разрыв обеих цепей ДНК в одном или близких местах; молекула разделяется на две части, а целой цепи-матрицы на месте разрыва нет. Возникает под действием ионизирующего излучения, некоторых веществ, при разрушении репликационной вилки.", "gn_chromatid": "Хроматида", "g_chromatid": "Одна молекула ДНК хромосомы вместе с белками. После репликации ДНК хромосома состоит из двух сестринских хроматид.", "gn_sister": "Сестринская хроматида", "g_sister": "Копия хроматиды, образовавшаяся при репликации ДНК в S-фазе; до разделения в митозе содержит ту же последовательность и служит матрицей для гомологичной рекомбинации.", "gn_cohesin": "Когезин", "g_cohesin": "Белковый комплекс в форме кольца, который удерживает сестринские хроматиды вместе от репликации ДНК до анафазы митоза.", "gn_homolog": "Гомологичная хромосома", "g_homolog": "Хромосома той же пары, полученная от другого родителя: те же гены в том же порядке, но последовательность во многих местах отличается.", "gn_ku": "Белки Ku", "g_ku": "Белки Ku70 и Ku80; их комплекс кольцом охватывает каждый конец двуцепочечного разрыва и вместе с другими белками удерживает концы рядом; с него начинается негомологичное соединение концов (NHEJ).", "gn_lig4": "Лигаза IV", "g_lig4": "ДНК-лигаза пути NHEJ, сшивающая сведённые вместе концы двуцепочечного разрыва.", "gn_resection": "Нуклеазы резекции", "g_resection": "Нуклеазы, укорачивающие 5′-концы двуцепочечного разрыва, так что на обоих концах остаются одноцепочечные 3′-участки; первый этап гомологичной рекомбинации, идёт в основном в S и G2.", "gn_rad51": "RAD51", "g_rad51": "Белок, собирающийся на одноцепочечном 3′-конце разрыва и обеспечивающий поиск комплементарного участка в гомологичной молекуле и встраивание в неё конца.", "gn_junction": "Место соединения концов", "g_junction": "Участок, где NHEJ сшил концы двуцепочечного разрыва. Если концы были совместимыми, последовательность здесь не меняется; если концы обрабатывались, здесь возможна утрата нуклеотидов.", "gn_deletion": "Делеция (утрата нуклеотидов)", "g_deletion": "Изменение последовательности, при котором несколько пар нуклеотидов утрачено, например при соединении повреждённых концов разрыва.", "gn_telomere": "Теломера", "g_telomere": "Концевой участок линейной хромосомы из многих повторов TTAGGG (у человека — несколько тысяч пар нуклеотидов) вместе с защитными белками.", "gn_gstrand": "G-цепь теломеры", "g_gstrand": "Цепь теломеры из повторов TTAGGG, направленная 3′-концом к концу хромосомы; она длиннее комплементарной и образует 3′-выступ.", "gn_cstrand": "C-цепь теломеры", "g_cstrand": "Цепь теломеры из повторов CCCTAA, комплементарная G-цепи; её 5′-конец находится у конца хромосомы. Укорачивается при репликации и достраивается полимеразой α с праймазой.", "gn_overhang": "3′-выступ (G-выступ)", "g_overhang": "Одноцепочечный 3′-конец G-цепи теломеры. Служит затравкой для теломеразы и в t-петле встраивается в двуцепочечную часть теломеры.", "gn_telomerase": "Теломераза", "g_telomerase": "Фермент из белков и РНК; его белок — обратная транскриптаза, синтезирующая ДНК по матрице из РНК теломеразы (эта РНК входит и в активный центр). Присоединяет повторы TTAGGG к 3′-концу G-цепи, используя dNTP. Активна в половых и многих стволовых клетках, в большинстве опухолей; в большинстве соматических клеток её активность низкая.", "gn_terc": "РНК теломеразы", "g_terc": "Молекула РНК в составе теломеразы; её участок комплементарен повтору теломеры и служит матрицей для синтеза ДНК.", "gn_polaprim": "ДНК-полимераза α с праймазой", "g_polaprim": "Комплекс, синтезирующий РНК-затравку и начальный участок ДНК. На теломере достраивает C-цепь по удлинённой G-цепи; к теломере его привлекает комплекс CST.", "gn_shelterin": "Шелтерин", "g_shelterin": "Комплекс из шести белков (TRF1, TRF2, RAP1, TIN2, TPP1, POT1), связанный с теломерными повторами. Защищает естественный конец хромосомы от узнавания как разрыв; TRF2 необходим для образования t-петли.", "gn_tloop": "t-петля", "g_tloop": "Структура конца теломеры, в которой 3′-выступ встроен в двуцепочечную часть теломеры. Конец хромосомы оказывается спрятан и не узнаётся белками, связывающими разрывы.", "src_01": "Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 5 «DNA Replication, Repair, and Recombination»", "src_02": "Kunkel T. A., Erie D. A. Eukaryotic mismatch repair in relation to DNA replication. Annu Rev Genet. 2015;49:291–313. doi:10.1146/annurev-genet-112414-054722", "src_03": "Chung J., Maruvka Y. E., Sudhaman S. et al. DNA polymerase and mismatch repair exert distinct microsatellite instability signatures in normal and malignant human cells. Cancer Discov. 2021;11:1176–1191. doi:10.1158/2159-8290.CD-20-0790", "src_04": "Nguyen A.-H., Li V., Chen W.-M., Kimberg J., Davis A. J., McFadden D. G., Povedano J. M. Ultramutagenesis through combined Msh2 depletion and proofreading-deficient DNA polymerase ε expression enhances small molecule target identification in forward genetic screens. ACS Chem Biol. 2026;21:2755–2764. doi:10.1021/acschembio.6c00605", "src_05": "Beard W. A., Horton J. K., Prasad R., Wilson S. H. Eukaryotic base excision repair: new approaches shine light on mechanism. Annu Rev Biochem. 2019;88:137–162. doi:10.1146/annurev-biochem-013118-111315", "src_06": "Kim J., Li C.-L., Chen X., Cui Y., Golebiowski F. M., Wang H., Hanaoka F., Sugasawa K., Yang W. Lesion recognition by XPC, TFIIH and XPA in DNA excision repair. Nature. 2023;617:170–175. doi:10.1038/s41586-023-05959-z", "src_07": "Scully R., Panday A., Elango R., Willis N. A. DNA double-strand break repair-pathway choice in somatic mammalian cells. Nat Rev Mol Cell Biol. 2019;20:698–714. doi:10.1038/s41580-019-0152-0", "src_08": "Stinson B. M., Loparo J. J. Repair of DNA double-strand breaks by the nonhomologous end joining pathway. Annu Rev Biochem. 2021;90:137–164. doi:10.1146/annurev-biochem-080320-110356", "src_09": "Bétermier M., Bertrand P., Lopez B. S. Is non-homologous end-joining really an inherently error-prone process? PLoS Genet. 2014;10:e1004086. doi:10.1371/journal.pgen.1004086", "src_10": "Marin-Gonzalez A., Ha T. Folding a broken genome: the versatile roles of cohesin in genome maintenance. Nat Rev Genet. 2026. doi:10.1038/s41576-026-00988-6", "src_11": "Takai H., Aria V., Borges P., Yeeles J. T. P., de Lange T. CST–Polymerase α-primase solves a second telomere end-replication problem. Nature. 2024;627:664–670. doi:10.1038/s41586-024-07137-1", "src_12": "Doksani Y., Wu J. Y., de Lange T., Zhuang X. Super-resolution fluorescence imaging of telomeres reveals TRF2-dependent T-loop formation. Cell. 2013;155:345–356. doi:10.1016/j.cell.2013.09.048", "src_13": "Lim C. J., Cech T. R. Shaping human telomeres: from shelterin and CST complexes to telomeric chromatin organization. Nat Rev Mol Cell Biol. 2021;22:283–298. doi:10.1038/s41580-021-00328-y"};
function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- SVG: заготовки ---------- */
function defs(s){ return `<defs>
  <marker id="a_${s}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
  <marker id="b_${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="10" orient="auto"><path d="M3.5 0 L6.5 0 L6.5 10 L3.5 10 z" class="mk"/></marker>
</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }
function setEdge(id, v){ const e = $(id); if (e) e.style.opacity = (typeof v === 'boolean' ? (v ? 1 : .16) : (.16 + .84 * clamp(v))).toFixed(2); }
function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }
function setOp(id, v){ const e = $(id); if (e) e.setAttribute('opacity', (+v).toFixed(2)); }
function setTxt(id, s){ const e = $(id); if (e) e.textContent = s; }
function move(id, dx, dy){ const e = $(id); if (e) e.style.transform = `translate(${dx}px,${dy}px)`; }
function PB(id, x, y){ return `<g class="pb fade" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="8.5"/><text x="${x}" y="${y + .5}">P</text></g>`; }
function XX(id, x1, y1, x2, y2){ return `<g class="cross fade" id="${id}" opacity="0"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x2}" y1="${y1}" x2="${x1}" y2="${y2}"/></g>`; }
/* узел-прямоугольник: id группы, подпись, справка */
function BX(id, x, y, w, h, label, g, fs = 13){
  return `<g id="${id}" class="clickable" data-g="${g || ''}"><rect class="box" id="${id}_r" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="lbl" x="${x + w / 2}" y="${y + h / 2}" font-size="${fs}" font-weight="700">${label}</text></g>`;
}
function setBoxState(id, st){ setCls(id + '_r', st); }
function missing(id, on){ const g = $(id); if (g) g.classList.toggle('missing', !!on); }

/* ---------- элементы управления ---------- */
function sliderHTML(id, k, val){ return `<div class="slider"><div class="row"><label for="${id}">${t(k)}</label><output id="${id}O">${val} %</output></div><input type="range" id="${id}" min="0" max="100" value="${val}"></div>`; }
function toggleHTML(id, k, on){ return `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span>${t(k)}</span></label>`; }
function segHTML(id, k, opts, val){ return `<div class="grp"><span>${t(k)}</span><div class="seg" id="${id}">` +
  opts.map(([v, kk]) => `<button data-v="${v}" aria-pressed="${v === val}">${t(kk)}</button>`).join('') + `</div></div>`; }
function segVal(id){ const b = $(id).querySelector('[aria-pressed="true"]'); return b ? b.dataset.v : null; }
function segSet(id, v){ $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
function wire(ids, fn){ ids.forEach(id => { const e = $(id); if (!e) return;
  if (e.classList.contains('seg')) e.querySelectorAll('button').forEach(b => b.onclick = () => { segSet(id, b.dataset.v); fn(); });
  else e.addEventListener(e.type === 'checkbox' ? 'change' : 'input', fn); }); }
function sv(id){ const e = $(id); const v = +e.value / 100; const o = $(id + 'O'); if (o) o.textContent = Math.round(v * 100) + ' %'; return v; }
function setSlider(id, v){ $(id).value = Math.round(v * 100); sv(id); }
function readRow(name, sub, right){ return `<div class="read"><div><b>${name}</b>${sub ? `<small>${sub}</small>` : ''}</div>${right}</div>`; }
function meterRow(name, v, text){ return `<div class="read" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;gap:8px"><small style="color:var(--ink);font-size:14.5px">${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i></div></div>`; }
function pill(on, kOn = 'pill_p', kOff = 'pill_np'){ return `<span class="pill ${on ? 'p' : 'np'}">${t(on ? kOn : kOff)}</span>`; }

/* ---------- вестерн-блот ---------- */
function blotHTML(rows, lanes){
  if (!lanes.length) return `<p class="small">${t('blot_empty')}</p>`;
  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;
  h += `<div class="lanes">` + lanes.map(L => `<div class="head">${L.h1}<br>${L.h2 || '&nbsp;'}</div>`).join('') + `</div>`;
  h += `<div class="film"><div class="lanes">` + lanes.map(L => `<div>` + L.v.map(v => `<div class="cell"><div class="band" style="opacity:${(0.04 + 0.96 * clamp(v)).toFixed(2)}"></div></div>`).join('') + `</div>`).join('') + `</div></div>`;
  return h + `</div></div></div>`;
}

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py собирает оба варианта) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  if (POE_RND) return poeShuffle(n, key + '/' + i + '/' + POE_SEED);
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 'v21';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }
function poeUnits(K){
  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);

}
function poeIdx(i, K = cur){

/* Куда вернуть фокус после перестроения панели сценария (ТА-05): {opt: j} — вариант ответа, {sel: css} — элемент панели, {id} — элемент страницы */

/* ---------- навигация ---------- */

/* перейти к сцене по ключу (1b, 1a, 1m, 1m2…): для тестов и снимков */
function goScene(K){ qn = +K[0]; if (/^\dm/.test(K)) { lvl = 'a'; amode = 'm'; amk = +(K.slice(2) || 1); } else { lvl = K[1]; amode = 'e'; } show(); }
/* Уход со сцены (ТА-01, ТА-06): воспроизведение останавливается, отложенные прокрутки и особые остановки отменяются;
   кадр сохраняется, возобновлять воспроизведение без действия студента нельзя. */

/* ===== навигация (каркас 26.10.2026, из ревизии сайта 3.9): адрес вопроса и уровня, история, возврат, телефон,
   «↓ К выводу», клавиатура, переход между семинарами. Тексты — ключи to_take, zoom_hint, zoom_out, sn_* ===== */
/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;
   переход по истории браузера восстанавливает вопрос и уровень */
function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); if (q !== qn) amk = 1; qn = q; lvl = l; show(); syncUrl(push); }
window.addEventListener('popstate', fromHash);
/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */
const revShow0 = show;
show = function(){ revShow0(); revAfterShow(); };
function revAfterShow(){
  const a = $('routeQ');

    const h = a.getAttribute('href'), i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);
    let b = (i < 0 ? h : h.slice(0, i)).replace(/([?&])level=adv(?=&|$)/, '$1').replace(/\?&/, '?').replace(/[?&]+$/, '');
    if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';

}
/* уровень сложности передаётся в ссылки на соседние семинары и в общий вход «Объяснения» (аудит 06.11.2026, NAV-LEVEL) */
function revWithLevel(h){

/* справки молекул с клавиатуры: фокус, роль кнопки, доступное имя, Enter/Space (в семинарах, где этого не было);
   невидимые на схеме элементы (неприменённый препарат и т. п.) исключаются из порядка Tab */
function revVisible(e, stop){ for (let x = e; x && x !== stop; x = x.parentElement){ const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return false; } return true; }
function revA11y(){
  const sc = document.querySelector('#scenes .scene:not([hidden])'); if (!sc) return;
  const seen = new Set();   /* с клавиатуры — одна кнопка на каждую структуру, мышью и пальцем — любая деталь */
  sc.querySelectorAll('[data-g]').forEach(e => {
    if (!e.dataset.g) return;
    if (!e.hasAttribute('aria-label')){ const n = TEXTS['gn_' + e.dataset.g] || (e.textContent || '').trim(); if (n) e.setAttribute('aria-label', n); }
    if (e.hasAttribute('tabindex') && !e.dataset.rev) return;   /* фокус задан разметкой страницы — не трогаем */
    if (!e.dataset.rev){ e.dataset.rev = '1'; if (!e.hasAttribute('role')) e.setAttribute('role', 'button'); }
    const vis = revVisible(e, sc) && !seen.has(e.dataset.g), ti = vis ? '0' : '-1'; if (vis) seen.add(e.dataset.g);
    if (e.getAttribute('tabindex') !== ti) e.setAttribute('tabindex', ti);
