to":"цитоплазма","l_pit":"покрытая клатрином ямка","l_mut":"рецепторы с ЛПНП не собираются в ямке","m":["Связывание ЛПНП","Сбор в ямке","Цикл рецептора"],"v":[["есть","есть"],["есть","нет"],["около 10 мин","не идёт"]],"notes":["Рецепторы с ЛПНП собираются в покрытой клатрином ямке и уходят в клетку; цикл — около 10 мин.","Рецепторы связывают ЛПНП, но в ямке не собираются: ЛПНП остаётся на поверхности."],"static":["Норма: рецепторы с ЛПНП в покрытой клатрином ямке. Мутант по цитоплазматическому участку: ЛПНП связан, но рецепторы вне ямки."]}},"level":"adv"},{"id":"rab-conversion","section":2,"questions":[3],"title":"Как ранняя эндосома становится поздней: смена Rab5 на Rab7","keywords":["Rab5","Rab7","созревание эндосомы","HOPS","ЛПНП"],"lead":["Ранняя эндосома не отпочковывает позднюю: на её мембране метка [[T29|Rab5]] быстро сменяется меткой Rab7, и эндосома становится поздней (Rink et al., 2005).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Ранние эндосомы с Rab5 сливаются друг с другом до двух раз в минуту; груз, предназначенный для расщепления (ЛПНП), собирается во всё меньшем числе всё более крупных эндосом (Rink et al., 2005).","Крупные эндосомы перемещаются от периферии к центру клетки, и там Rab5 на их мембране быстро сменяется Rab7.","Для смены нужен комплекс HOPS (англ. homotypic fusion and protein sorting; белки класса C VPS — англ. vacuolar protein sorting), который связывается с Rab5; авторы, опираясь на данные того времени, считали HOPS фактором обмена нуклеотидов для Rab7. При подавлении его субъединицы hVps39 увеличиваются и ранние, и поздние эндосомы, а смена Rab5 на Rab7 растягивается с минут до часов."],"paragraphs":["Что уточняет эта работа. Ранняя эндосома созревает в позднюю, и метка Rab5 сменяется Rab7 (БИО-3·18). Эксперимент показывает, что созревание идёт сменой метки на той же мембране, а не переносом груза в новый компартмент.","ЛПНП в контроле покидал ранние эндосомы с полупериодом около 11 мин; при подавлении hVps39 он оставался в ранних эндосомах, несущих белок EEA1 (англ. early endosome antigen 1), до 4 ч.",{"h":"Метод"},"Живые клетки A431 (линия клеток эпидермоидной карциномы человека) с флуоресцентными Rab5 и Rab7; снимки каждые несколько секунд и алгоритмы, которые прослеживают отдельные эндосомы. Груз — флуоресцентный ЛПНП. Подавление hVps39 — малыми интерферирующими РНК в тех же клетках; белки, связывающие Rab5, в том числе HOPS, выделяли из цитозоля клеток HeLa на колонке с Rab5.","Контроль: клетки с контрольной РНК. Ограничение: избыточный синтез меченых Rab может менять их количество на мембране. Чего данные не доказывают: смена Rab показана для грузов, идущих на расщепление; для рецепторов, возвращающихся на поверхность, механизм выхода иной."],"trap":["Ошибка: поздняя эндосома образуется отпочкованием от ранней.","В живых клетках Rab5 на мембране эндосомы сменяется Rab7: та же эндосома становится поздней (Rink et al., 2005)."],"conditions":"Rink et al., 2005: съёмка живых клеток A431; цитозоль для колонки с Rab5 — из клеток HeLa; полупериод выхода ЛПНП — 10,9 мин в контроле. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Rink2005"],"quiz":{"id":"S3-L21","question":"В клетках подавили hVps39 — субъединицу комплекса HOPS, нужного для смены Rab5 на Rab7. Что произойдёт с ЛПНП после эндоцитоза?","options":[{"id":"S3-L21-1","text":"ЛПНП сразу попадёт в лизосомы, минуя ранние эндосомы","correct":false,"feedback":"Без HOPS ранние эндосомы не превращаются в поздние, поэтому груз, наоборот, задерживается в ранних."},{"id":"S3-L21-2","text":"ЛПНП вернётся на поверхность вместе с рецептором","correct":false,"feedback":"ЛПНП отделяется от рецептора и задерживается в ранних эндосомах; на поверхность возвращается рецептор."},{"id":"S3-L21-3","text":"ЛПНП надолго задержится в ранних эндосомах","correct":true,"feedback":"Смена растягивается с минут до часов, и ЛПНП остаётся в EEA1-положительных эндосомах до 4 ч (Rink et al., 2005)."}]},"widget":{"kind":"rab","title":"","s":{"title":"Проследите смену метки на мембране эндосомы","status":"Схема по Rink et al., 2005 · клетки A431","modes_label":"Состояние","modes":["ранняя эндосома","смена метки","поздняя эндосома","подавлен hVps39"],"l_c":["Rab5","Rab5 → Rab7","Rab7","ранняя, крупная"],"l_c3b":"поздняя, крупная","l_axis0":"периферия клетки","l_axis1":"центр клетки","l_rab5":"Rab5","l_rab7":"Rab7","m":["Метка на мембране","Положение","Скорость смены"],"v":[["Rab5","Rab5 сменяется Rab7","Rab7","чаще раздельно; иногда обе метки"],["периферия","ближе к центру","центр","эндосомы увеличены"],["—","минуты","—","часы"]],"notes":["Ранние эндосомы с Rab5 сливаются друг с другом; груз собирается во всё более крупных эндосомах.","В центре клетки Rab5 на мембране быстро сменяется Rab7.","Та же эндосома с Rab7 — поздняя.","Без hVps39 смена растягивается до часов; ранние и поздние эндосомы крупнее; метки чаще раздельны, иногда встречаются эндосомы с обеими."],"static":["Rab5 (ранняя эндосома, периферия) → смена Rab5 на Rab7 → Rab7 (поздняя эндосома, центр); без hVps39 смена растягивается до часов."]}},"level":"adv"},{"id":"retrieval-signal","section":2,"questions":[3],"title":"Как мембранный белок избегает лизосомы: сигнал возврата и SNX27–ретромер","keywords":["SNX27","ретромер","VPS35","GLUT1","PDZ"],"lead":["GLUT1 постоянно попадает с поверхности в ранние эндосомы. Чтобы переносчик глюкозы оставался на поверхности, клетка должна вернуть его, а не направить на расщепление. Как эндосома узнаёт этот груз? Для GLUT1 нужен короткий концевой участок — PDZ-лиганд, который связывает PDZ-домен (белковый домен, названный по белкам PSD-95, Dlg и ZO-1), — и комплекс [[T30|SNX27–ретромер]]: сортирующий нексин 27 (SNX27) вместе с ретромером — комплексом белков, возвращающим мембранные белки из эндосом (Steinberg et al., 2013).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["SNX27 своим PDZ-доменом связывает концевой участок груза и одновременно — субъединицу ретромера VPS26 (VPS26 и VPS35 — субъединицы ретромера); это связывание необходимо и достаточно, чтобы груз не попал в лизосомы (Steinberg et al., 2013).","При подавлении SNX27 с поверхности клеток HeLa уходят 122 мембранных белка, при подавлении VPS35 — 152; 81 из них общий.","Без SNX27 или VPS35 GLUT1 оказывается в лизосомах и расщепляется быстрее; захват глюкозы снижается более чем на 60 %. GLUT1 без трёх концевых аминокислот уходит в лизосомы и в контрольных клетках."],"paragraphs":["Что уточняет эта работа. Рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а выбор пути зависит от сигналов сортировки (БИО-3·15). Эксперимент показывает один такой сигнал и белки, которые его узнают: без них белок уходит в лизосому, хотя сам не изменён.","При подавлении VPS35 рецептора трансферрина на поверхности было в 1,5 раза меньше (при подавлении SNX27 — без изменений), и он не расщеплялся быстрее: разные грузы возвращаются разными путями.",{"h":"Метод"},"Клетки HeLa и RPE1 (линия клеток пигментного эпителия сетчатки человека); SNX27 и VPS35 подавляли малыми интерферирующими РНК. Белки поверхности метили биотином и сравнивали количественной масс-спектрометрией с мечением белков аминокислотами, содержащими тяжёлые изотопы (SILAC); положение GLUT1 определяли иммунофлуоресценцией с маркером лизосом — белком мембраны лизосом LAMP1 (англ. lysosome-associated membrane protein 1); захват глюкозы — по меченой 2-дезоксиглюкозе.","Контроль: клетки с контрольной РНК; две разные РНК против каждого белка — против неспецифического действия. Чего данные не доказывают: как именно SNX27–ретромер не пускает груз в лизосомный путь, работа не устанавливает; сочетание подавления SNX27 и укороченного GLUT1 не изучали."],"trap":["Ошибка: белок, который не вернулся на поверхность, остаётся в ранней эндосоме.","Без SNX27 или ретромера GLUT1 оказывается не в ранних эндосомах (EEA1), а в лизосомах (LAMP1) и расщепляется быстрее (Steinberg et al., 2013)."],"conditions":"Steinberg et al., 2013: клетки HeLa и RPE1; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Steinberg2013"],"quiz":{"id":"S3-L22","question":"В обычных клетках синтезируется GLUT1 без трёх концевых аминокислот. Где он окажется?","options":[{"id":"S3-L22-1","text":"В лизосомах: без концевого участка его не узнаёт SNX27","correct":true,"feedback":"GLUT1 без PDZ-лиганда оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на мембране (Steinberg et al., 2013)."},{"id":"S3-L22-2","text":"На плазматической мембране, как полный GLUT1","correct":false,"feedback":"Концевой участок нужен для возврата из ранней эндосомы; без него белок уходит в лизосомы."},{"id":"S3-L22-3","text":"В ранних эндосомах, где он будет накапливаться","correct":false,"feedback":"Без сигнала возврата GLUT1 не задерживается в ранних эндосомах, а уходит в лизосомы."}]},"widget":{"kind":"glut","title":"","s":{"title":"Выключите SNX27–ретромер или сигнал на грузе","status":"Данные Steinberg et al., 2013 · клетки HeLa","modes_label":"Условия","modes":["контроль","подавлен SNX27","подавлен VPS35","GLUT1 без концевого участка"],"cfg":[["none",false],["snx27",false],["vps35",false],["none",true]],"out":"внеклеточная среда","cyto":"цитоплазма","l_ee":"ранняя эндосома","l_ly":"лизосома (LAMP1)","l_retro":"SNX27–ретромер","l_kd":{"snx27":"SNX27 подавлен","vps35":"VPS35 подавлен"},"l_pdz":"у GLUT1 нет концевого PDZ-лиганда","m":["GLUT1","Захват глюкозы"],"v":[["на мембране","в лизосомах","в лизосомах","в лизосомах"],["контроль","ниже более чем на 60 %","ниже более чем на 60 %","не измеряли"]],"notes":["SNX27–ретромер возвращает GLUT1 из ранней эндосомы на поверхность.","Без SNX27 GLUT1 уходит в лизосомы и расщепляется быстрее.","Без VPS35 GLUT1 уходит в лизосомы; с поверхности уходят и многие другие белки.","GLUT1 без PDZ-лиганда уходит в лизосомы и в контрольных клетках."],"static":["Контроль: GLUT1 на мембране. Без SNX27, без VPS35 или без концевого участка GLUT1 — в лизосомах."]}},"level":"adv"},{"id":"envelope-pore","section":3,"questions":[4],"title":"Как устроены ядерная оболочка и ядерная пора","keywords":["ядерная оболочка","ядерная пора","нуклеопорины","диффузия"],"lead":["[[T31|Ядерная оболочка]] — две мембраны; наружная продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами.","В каждой поре находится [[T32|комплекс ядерной поры]]: через него идёт транспорт белков, рибонуклеопротеинов и РНК между ядром и цитоплазмой. Это вопрос 18 коллоквиума."],"mechanism":["Комплекс ядерной поры построен примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; каркас комплекса имеет восьмикратную симметрию: восемь повторяющихся секторов между цитоплазматическим и нуклеоплазматическим кольцами.","Из цитоплазматического кольца в цитоплазму выступают восемь фибрилл; нуклеоплазматическое кольцо закрепляет ядерную корзину.","Ионы и небольшие молекулы (до ~5 кДа) проходят через каналы поры простой диффузией практически свободно; более крупные диффундируют тем медленнее, чем они больше.","Белки с FG-повторами (повторами фенилаланин–глицин) создают в поре селективный барьер; крупные макромолекулы быстро проходят его только с транспортными рецепторами."],"paragraphs":["Через пору проходят потоки в обе стороны: мРНК и рибосомные субъединицы выходят в цитоплазму, а ядерные белки — гистоны, ламины — синтезируются в цитоплазме и поступают в ядро.","Вспомнить БИО-3·9: в цитоплазме груз переносят мембранные носители; ядерная пора — другой механизм, без пузырьков: груз проходит через водный канал белкового комплекса."],"trap":["Ошибка: считать, что у поры есть порог размера: всё, что мельче, проходит свободно, а более крупные молекулы не проходят вовсе.","Резкого порога нет: более крупные молекулы проходят тем медленнее, чем они больше; крупные белки пассивно проходят очень медленно, а быстро — с транспортными рецепторами."],"conditions":"Схема упрощена: показаны две поры и разрез оболочки.","sources":["Alberts2022"],"quiz":{"id":"S3-L23","question":"Какие молекулы проходят через ядерную пору простой диффузией практически свободно?","options":[{"id":"S3-L23-1","text":"Любые белки, если они не крупнее определённого размера","correct":false,"feedback":"Резкой границы размера нет: крупные белки пассивно проходят пору очень медленно, быстро — только с транспортными рецепторами."},{"id":"S3-L23-2","text":"Ионы и небольшие молекулы примерно до 5 кДа","correct":true,"feedback":"Они проходят практически свободно; более крупные молекулы диффундируют тем медленнее, чем они больше."},{"id":"S3-L23-3","text":"Только молекулы с сигналом ядерной локализации","correct":false,"feedback":"Сигнал нужен для активного переноса крупных белков; малые молекулы проходят без сигнала."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Сравните малую молекулу и крупный белок без сигнала","status":"Схема качественная · не экспериментальные данные","modes_label":"Груз","modes":["малая молекула","крупный белок без сигнала"],"cfg":[["small","none"],["big","none"]],"m":["Как проходит пору","Где находится"],"v":[["простой диффузией","очень медленно"],["по обе стороны оболочки","в цитоплазме; в ядре не накапливается"]],"notes":["Малые молекулы проходят через каналы поры диффузией и распределяются по обе стороны оболочки.","Крупный белок без сигнала за время наблюдения в ядре не накапливается: пассивно он проходит пору очень медленно (насколько медленно — БИО-3·28)."],"static":["Малая молекула — по обе стороны оболочки; крупный белок без сигнала в ядре не накапливается."]}}},{"id":"nls-importin","section":3,"questions":[4],"title":"Как сигнал и транспортный рецептор переносят белок в ядро и из ядра","keywords":["NLS","NES","импортин","экспортин","ГТФ"],"lead":["Крупный белок попадает в ядро, если на нём есть [[T33|сигнал ядерной локализации]] и в клетке есть [[T35|импортин]], который этот сигнал узнаёт.","Обратный путь — [[T34|последовательность ядерного экспорта]] и экспортин."],"mechanism":["Белок с NLS связывается в цитоплазме с растворимым белком импортином.","Импортин с грузом проходит через пору, взаимодействуя с FG-нуклеопоринами.","Процесс энергозависим и идёт при участии ГТФ.","Белок с NES связывается в ядре с экспортином и выходит в цитоплазму, тоже при участии ГТФ."],"paragraphs":["Сигнал сам по себе не переносит белок: без импортина белок с NLS остаётся в цитоплазме, а без экспортина белок с NES — в ядре (ЗАКЛЮЧЕНИЕ). Импортин и экспортин, который переносит из ядра белки с NES, узнают разные сигналы: без этого экспортина белок с NLS по-прежнему узнаётся импортином (ЗАКЛЮЧЕНИЕ). Сверх программы: транспортные рецепторы тоже возвращаются для нового цикла — в классическом импорте импортин-α выносит из ядра экспортин CAS, а импортин-β выходит в комплексе с Ran-ГТФ (БИО-3·29).","Адрес считывается рецептором, но сам по себе не гарантирует локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты.","Сверх программы: необходимость и достаточность сигнала ядерной локализации показали на Т-антигене вируса SV40 (БИО-3·27).",{"h":"Дальше в курсе «Молекулярная биология»"},"Иная система адресации — несколько путей импорта белков в митохондрию — [[https://fresll.github.io/molbio/seminar-9-route.html#import-routes|МБ, семинар 9, шаг 11]]."],"trap":["Ошибка: белок с NLS проходит в ядро сам, как малая молекула.","Белок с NLS переносит импортин; без транспортного рецептора крупный белок проходит пору пассивно очень медленно и в ядре не накапливается."],"conditions":"Схема качественная: импортин показан одним белком.","sources":["Alberts2022"],"quiz":{"id":"S3-L24","question":"В клетке нет экспортина, который переносит из ядра белки с NES. Что будет с белком, несущим сигнал ядерной локализации и находящимся в цитоплазме?","options":[{"id":"S3-L24-1","text":"Он останется в цитоплазме","correct":false,"feedback":"Для импорта нужен импортин, а он в этой клетке есть."},{"id":"S3-L24-2","text":"Он поступит в ядро и тут же выйдет обратно","correct":false,"feedback":"Без экспортина выход белков из ядра нарушен, а не ускорен."},{"id":"S3-L24-3","text":"Он по-прежнему поступит в ядро с импортином","correct":true,"feedback":"Сигнал ядерной локализации узнаёт импортин; этот экспортин нужен для выхода из ядра белков с NES (ЗАКЛЮЧЕНИЕ)."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Уберите транспортный рецептор","status":"Схема качественная · не экспериментальные данные","modes_label":"Груз и рецептор","modes":["NLS + импортин","NLS, нет импортина","NES + экспортин","NES, нет экспортина"],"cfg":[["nls","none"],["nls","imp"],["nes","none"],["nes","exp"]],"warn":["","нет импортина — NLS не узнаётся","","нет экспортина — NES не узнаётся"],"m":["Перенос","Где белок"],"v":[["импорт","нет","экспорт","нет"],["в ядре","в цитоплазме","в цитоплазме","в ядре"]],"notes":["Импортин узнаёт NLS и переносит белок в ядро.","Без импортина NLS не узнаётся: белок остаётся в цитоплазме.","Экспортин узнаёт NES в ядре и переносит белок в цитоплазму.","Без экспортина белок с NES остаётся в ядре."],"static":["NLS + импортин → ядро; NES + экспортин → цитоплазма; без рецептора сигнал не работает."]}}},{"id":"ran-direction","section":3,"questions":[4],"title":"Чем задано направление переноса через пору","keywords":["Ran","Ran-ГТФ","Ran-ГДФ","направление","импорт","экспорт"],"lead":["Пора пропускает транспортные рецепторы в обе стороны. Направление переноса задаёт [[T36|градиент Ran]]: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме.","Импорт и экспорт идут при участии ГТФ; направление переноса задаёт распределение Ran-ГТФ и Ran-ГДФ между ядром и цитоплазмой."],"mechanism":["Импортин связывает груз с NLS в цитоплазме, где Ran-ГТФ мало.","В ядре Ran-ГТФ связывается с импортином и освобождает груз — груз остаётся в ядре.","При экспорте Ran-ГТФ, наоборот, стабилизирует комплекс экспортина с грузом до выхода из ядра.","Гидролиз ГТФ не проталкивает груз через канал механически, а поддерживает различие состояний Ran по сторонам оболочки."],"paragraphs":["ЗАКЛЮЧЕНИЕ: для импорта связывание сигнала импортином от Ran-ГТФ не зависит, а освобождение груза в ядре зависит: без Ran-ГТФ импортин связывает белок и проходит с ним пору, но груз не накапливается в ядре. Для экспорта Ran-ГТФ нужен уже для связывания груза экспортином: без него комплекс не образуется, и белок с NES остаётся в ядре.","Направленный перенос через пору устроен иначе, чем перенос в мембранных носителях: здесь нет оболочки и слияния мембран; груз связывается с транспортным рецептором по одну сторону оболочки и освобождается по другую.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как градиент Ran-ГТФ задаёт направление ядерного транспорта и как он поддерживается — [[https://fresll.github.io/molbio/seminar-1-route.html#ran-gradient|МБ, семинар 1, шаг 13]]."],"trap":["Ошибка: энергия ГТФ проталкивает груз через пору.","Гидролиз ГТФ поддерживает различие состояний Ran по сторонам оболочки, а не толкает груз механически."],"conditions":"На коллоквиуме достаточно знать, что импорт и экспорт идут при участии ГТФ; градиент Ran объясняет, откуда берётся направление переноса. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L25","question":"Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Что произойдёт с белком, несущим NLS?","options":[{"id":"S3-L25-1","text":"Импортин его свяжет, но белок не будет накапливаться в ядре","correct":true,"feedback":"Импортин связывает NLS и без Ran-ГТФ, а освобождение груза в ядре зависит от Ran-ГТФ; ЗАКЛЮЧЕНИЕ."},{"id":"S3-L25-2","text":"Импортин его не свяжет","correct":false,"feedback":"Импортин связывает NLS в цитоплазме, где Ran-ГТФ мало и в норме; Ran-ГТФ нужен для освобождения груза в ядре."},{"id":"S3-L25-3","text":"Белок накопится в ядре быстрее обычного","correct":false,"feedback":"Без Ran-ГТФ в ядре груз не освобождается, и накопления в ядре нет."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Уберите Ran-ГТФ","ran":true,"l_gtp":"Ran-ГТФ","l_gdp":"Ran-ГДФ","status":"Схема качественная · не экспериментальные данные","modes_label":"Состояние","modes":["NLS: градиент есть","NLS: Ran-ГТФ нет","NES: градиент есть","NES: Ran-ГТФ нет"],"cfg":[["nls","none"],["nls","ran"],["nes","none"],["nes","ran"]],"warn":["","нет Ran-ГТФ — груз не освобождается в ядре","","нет Ran-ГТФ — экспортин не связывает груз"],"m":["Связывание груза рецептором","Где накапливается белок"],"v":[["есть","есть","есть","нет: комплекс не образуется"],["в ядре","нигде: по обе стороны","в цитоплазме","остаётся в ядре"]],"notes":["Ran-ГТФ в ядре освобождает груз от импортина — белок накапливается в ядре.","Импортин связывает белок, но без Ran-ГТФ в ядре груз не освобождается именно там (ЗАКЛЮЧЕНИЕ).","Ran-ГТФ стабилизирует комплекс экспортина с грузом — белок выходит в цитоплазму.","Без Ran-ГТФ экспортин не образует комплекса с грузом, и белок остаётся в ядре (ЗАКЛЮЧЕНИЕ)."],"static":["С градиентом Ran: импорт в ядро и экспорт из ядра. Без Ran-ГТФ импортин связывает груз, но не освобождает его в ядре, а экспортин груз не связывает."]}}},{"id":"address-principle","section":3,"questions":[4],"title":"Сигналы сортировки: что задаёт адрес белка","keywords":["адрес","сигнал сортировки","рецептор","адаптер","путь по умолчанию"],"lead":["Место назначения белка зависит от [[T37|сигналов сортировки]], которые распознают транспортные и сортировочные белки. Такими сигналами могут быть участки аминокислотной цепи или модификации белка; распознавание сигнала включает груз в транспортный путь.","Адрес считывается рецептором, но сам по себе не гарантирует конечную локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты."],"mechanism":["Сигнал сортировки — участок аминокислотной цепи белка или его модификация: связанные с белком углеводы (например, маннозо-6-фосфат) или присоединённый убиквитин.","Белки секреторного пути, у которых нет сигналов сортировки в другие компартменты, по умолчанию попадают в конститутивные секреторные везикулы транс-сети комплекса Гольджи.","В рецептор-опосредованном эндоцитозе лиганд узнаётся рецептором снаружи клетки, а в покрытую клатрином ямку рецептор попадает по своему цитоплазматическому участку, который связывают адаптерные белки.","Для переноса через ядерную пору сигналы — NLS и NES; их узнают импортин и экспортин."],"paragraphs":["Сигнал и груз — не одно и то же. Для отбора в ямку важен участок самого рецептора, а не лиганд: мутации цитоплазматического участка рецептора ЛПНП не мешают ему связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках (сверх программы, БИО-3·20).","Сигналы сортировки работают и на других участках мембранной сети: сигнальная последовательность направляет растущий белок в ЭПР, маннозо-6-фосфат — гидролазы в лизосомы."],"trap":["Ошибка: считать, что все сигналы сортировки устроены одинаково.","Часть сигналов — участки аминокислотной цепи самого белка (NLS, NES, цитоплазматический участок рецептора груза); другие возникают при модификации белка — углеводная метка маннозо-6-фосфат, убиквитин на рецепторе, направляющий его в лизосому."],"conditions":"Пример с GLUT1 — сверх программы.","sources":["Alberts2022","Steinberg2013"],"quiz":{"id":"S3-L26","question":"По какому участку рецептор груза собирается в покрытой клатрином ямке?","options":[{"id":"S3-L26-1","text":"По связанному с ним лиганду","correct":false,"feedback":"Лиганд связывается с внеклеточной частью рецептора; в ямку рецептор попадает по своему участку со стороны цитоплазмы."},{"id":"S3-L26-2","text":"По своему цитоплазматическому участку, который связывают адаптерные белки","correct":true,"feedback":"Рецепторы груза концентрируются в ямке за счёт связывания их цитозольных участков с адаптерными белками."},{"id":"S3-L26-3","text":"По размеру: в ямку попадают самые крупные белки мембраны","correct":false,"feedback":"Отбор в ямку идёт по участку рецептора, который узнают адаптерные белки, а не по размеру."}]},"widget":{"kind":"addr","title":"","s":{"title":"Сравните сигналы сортировки","noarrows":true,"status":"Обобщение","modes_label":"Система","modes":["эндоцитоз","ядерный импорт","ядерный экспорт","возврат GLUT1 (сверх программы)"],"h":["Сигнал","Что его узнаёт","Где находится сигнал"],"rows":[["участок рецептора\nгруза","адаптерные\nбелки","на рецепторе,\nсо стороны\nцитоплазмы"],["NLS","импортин","в цепи\nсамого белка"],["NES","экспортин","в цепи\nсамого белка"],["PDZ-лиганд","SNX27\n(с ретромером)","на конце\nцепи GLUT1"]],"foot":"в этих примерах сигнал — участок самого белка или его рецептора","notes":["Лиганд связывается с рецептором снаружи; цитоплазматический участок рецептора связывают адаптерные белки, и рецептор собирается в покрытой клатрином ямке.","Сигнал ядерной локализации узнаёт импортин.","Последовательность ядерного экспорта узнаёт экспортин в ядре.","Концевой участок GLUT1 узнаёт SNX27, связанный с ретромером (Steinberg et al., 2013; сверх программы)."],"static":["Эндоцитоз: участок рецептора — адаптерные белки. Импорт: NLS — импортин. Экспорт: NES — экспортин."]}}},{"id":"nls-proof","section":3,"questions":[4],"title":"Как доказали, что семи аминокислот достаточно для адреса в ядро","keywords":["NLS","SV40","Т-антиген","пируваткиназа","PKKKRKV"],"lead":["Сигнал ядерной локализации был впервые определён как короткая последовательность, которая и необходима, и достаточна для накопления белка в ядре (Kalderon et al., 1984).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Большой Т-антиген вируса SV40 накапливается в ядре; замена одного остатка — лизина 128 на треонин — нарушает это накопление, хотя стабильность белка заметно не меняется (Kalderon et al., 1984).","Участок вокруг лизина 128, присоединённый к N-концу цитоплазматического мутанта Т-антигена, возвращает его в ядро.","Участок вокруг лизина 128 (у пируваткиназы — остатки 119–135), присоединённый к β-галактозидазе бактерий и к пируваткиназе — цитоплазматическому ферменту, — приводит к полному накоплению химерных белков в ядре; с треонином вместо лизина 128 участок не действует.","Укорочение участка показало: для накопления пируваткиназы в ядре достаточно остатков 126–132 — семи аминокислот Pro-Lys-Lys-Lys-Arg-Lys-Val (PKKKRKV). Авторы оговаривают, что в действие такого короткого сигнала могут вносить вклад соседние остатки, закодированные линкером."],"paragraphs":["Что уточняет эта работа. Белки с NLS переносит импортин (БИО-3·24). Эксперимент показывает, что сам сигнал может быть очень коротким и работает в составе чужого белка. Импортин тогда ещё не был известен: механизм узнавания сигнала описали позже.","Здесь удобно различить необходимость и достаточность. Необходимость: без лизина 128 Т-антиген в ядро не попадает. Достаточность: семь аминокислот переводят в ядро белок, который в норме там не бывает, — в клетке, где весь транспортный аппарат работает. Ни то, ни другое отдельно не доказывает, что сигнал — единственное условие: нужен ещё рецептор, который его узнаёт, а в других белках сигнал может быть недоступен.",{"h":"Метод"},"Плазмиды с генами мутантных и химерных белков вводили микроинъекцией в клетки Vero (линия клеток почки обезьяны); через 18 ч белки выявляли непрямой иммунофлуоресценцией и оценивали, где они находятся — в ядре или в цитоплазме.","Контроль: исходная пируваткиназа и химера с участком 119–135, в котором лизин 128 заменён треонином. Ограничение: оценка качественная, по микроскопии; ключевой лизин не единственный — замены соседних остатков ослабляли, но не отменяли накопление в ядре. Чего данные не доказывают: что сигнал ускоряет перенос в ядро. Авторы оценивали только накопление в ядре, и удержание белка в ядре этим экспериментом не исключено."],"trap":["Ошибка: чтобы попасть в ядро, белок должен быть маленьким.","Пируваткиназа — крупный белок, и с присоединённым участком Т-антигена она накапливается в ядре; для этого достаточно даже семи аминокислот PKKKRKV (Kalderon et al., 1984)."],"conditions":"Kalderon et al., 1984: клетки Vero, микроинъекция плазмид, иммунофлуоресценция через 18 ч. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Kalderon1984"],"quiz":{"id":"S3-L27","question":"Что доказывает эксперимент, в котором пируваткиназа с присоединённым PKKKRKV накапливается в ядре?","options":[{"id":"S3-L27-1","text":"Что без этого сигнала никакой белок не попадёт в ядро","correct":false,"feedback":"Это утверждение о необходимости, и для всех белков оно из эксперимента не следует: у других ядерных белков бывают другие сигналы."},{"id":"S3-L27-2","text":"Что пируваткиназа в норме работает в ядре","correct":false,"feedback":"Пируваткиназа — цитоплазматический фермент; в ядро её перевёл присоединённый сигнал."},{"id":"S3-L27-3","text":"Что сигнала достаточно, чтобы направить в ядро чужой белок","correct":true,"feedback":"Цитоплазматический белок с семью аминокислотами сигнала оказывается в ядре — это достаточность добавления сигнала в клетке с работающим транспортным аппаратом (Kalderon et al., 1984)."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Присоедините сигнал к цитоплазматическому белку","noimp":true,"status":"Данные Kalderon et al., 1984 · клетки Vero","modes_label":"Белок","modes":["Т-антиген","Т-антиген, Lys128 → Thr","пируваткиназа","пируваткиназа + PKKKRKV","пируваткиназа + участок 119–135 (Thr128)"],"cfg":[["nls","none"],["mut","none"],["big","none"],["nls","none"],["mut","none"]],"m":["Где белок","Что показывает"],"v":[["в ядре","в цитоплазме","в цитоплазме","в ядре","в цитоплазме"],["исходное состояние","необходимость сигнала","контроль","достаточность сигнала","контроль последовательности"]],"notes":["Т-антиген вируса SV40 накапливается в ядре.","Замена лизина 128 на треонин: белок остаётся в цитоплазме.","Пируваткиназа — цитоплазматический белок.","С семью аминокислотами PKKKRKV пируваткиназа накапливается в ядре.","Участок 119–135 с треонином вместо лизина 128 не действует."],"static":["Т-антиген — в ядре; с заменой Lys128 → Thr — в цитоплазме. Пируваткиназа — в цитоплазме; с PKKKRKV — в ядре; с участком 119–135 (Thr128) — в цитоплазме."]}},"level":"adv"},{"id":"soft-barrier","section":3,"questions":[4],"title":"Есть ли у ядерной поры порог размера","keywords":["пассивная диффузия","порог размера","GFP","дрожжи","FRAP"],"lead":["Часто говорят, что пора пропускает белки только до определённой массы. Измерения в живых клетках показали: резкого порога нет, пассивный проход постепенно замедляется с ростом массы (Timney et al., 2016).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В живых дрожжах Saccharomyces cerevisiae сравнивали белки от 27 до 67 кДа: флуоресцентный белок GFP с 0–6 доменами белка A по 7 кДа (Timney et al., 2016).","Характерная постоянная времени τ выравнивания между ядром и цитоплазмой у GFP (27 кДа) — 15 ± 1,4 с, у белка 67 кДа — 413 ± 92 с (± — 95%-й доверительный интервал); обе величины приведены к клетке со средними объёмами ядра и цитоплазмы и средним числом пор.","τ растёт примерно как масса в степени 3,8 (3,8 ± 1,0); подвижность белков в растворе при этом различается лишь в 1,6 раза, значит, замедление создаёт сама пора."],"paragraphs":["Что уточняет эта работа. Молекулы до ~5 кДа проходят пору практически свободно, а более крупные — тем медленнее, чем они больше (БИО-3·23). Эксперимент даёт числа для белков 27–67 кДа и показывает, что это мягкий барьер, а не сито с жёсткой границей.","ЗАКЛЮЧЕНИЕ: крупный белок без сигнала может постепенно пройти пору пассивно, но за минуты и без накопления по одну сторону оболочки; быстрый направленный перенос обеспечивают сигнал и транспортный рецептор.",{"h":"Метод"},"Фотообесцвечивание в живых клетках: флуоресценцию белка в цитоплазме гасят лазером и следят, как убывает флуоресценция ядра, пока меченые и обесцвеченные молекулы обмениваются через поры. Убыль экспоненциальная: за время τ разница между текущей и равновесной флуоресценцией уменьшается примерно в 2,7 раза, за τ·ln 2 — вдвое; τ — не время прохода одной молекулы через пору. Измерено около 236 клеток; форму молекул проверяли малоугловым рассеянием рентгеновских лучей.","Контроль: белки одинакового строения, различающиеся только числом доменов. Чего данные не доказывают: измерения сделаны на дрожжах; перенос чисел на клетки человека не проверен, а облегчённый транспорт с рецепторами эта работа не описывает."],"trap":["Ошибка: белки крупнее ~40 кДа через пору пассивно не проходят.","Резкого порога нет: белок 67 кДа проходит пассивно, но в десятки раз медленнее белка 27 кДа (Timney et al., 2016)."],"conditions":"Timney et al., 2016: живые дрожжи; белки 27–67 кДа; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Timney2016"],"quiz":{"id":"S3-L28","question":"Белок 67 кДа без сигнала ядерной локализации находится в цитоплазме дрожжевой клетки. Что покажет измерение?","options":[{"id":"S3-L28-1","text":"Он выравнивается между ядром и цитоплазмой за минуты","correct":true,"feedback":"Постоянная времени выравнивания — около 413 с: пассивный проход идёт, но медленно (Timney et al., 2016)."},{"id":"S3-L28-2","text":"Он не проходит пору совсем","correct":false,"feedback":"Резкого порога нет: белок 67 кДа проходит пору пассивно, хотя и медленно."},{"id":"S3-L28-3","text":"Он проходит так же быстро, как GFP (27 кДа)","correct":false,"feedback":"Постоянная времени различается примерно в 27 раз: 15 с и 413 с."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Сравните белки разной массы","status":"Данные Timney et al., 2016 · живые дрожжи","modes_label":"Масса белка","modes":["27 кДа","67 кДа"],"cfg":[["m27","none"],["m67","none"]],"m":["Постоянная времени выравнивания","Резкий порог"],"v":[["15 ± 1,4 с","413 ± 92 с"],["не обнаружен","не обнаружен"]],"notes":["GFP (27 кДа) распределяется по обе стороны оболочки за секунды.","Белок 67 кДа тоже проходит пору пассивно, но за минуты."],"static":["27 кДа — 15 с; 67 кДа — 413 с; резкого порога нет."]}},"level":"adv"},{"id":"npc-structure","section":3,"questions":[4],"title":"Что известно о строении ядерной поры сегодня","keywords":["нуклеопорины","FG-повторы","структура","Ran"],"lead":["Структурные исследования последних лет описали комплекс ядерной поры почти полностью: это один из крупнейших белковых комплексов клетки (Petrovic et al., 2026).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Комплекс построен примерно из 35 разных нуклеопоринов, представленных множеством копий, — всего около 1000 белковых субъединиц; масса у позвоночных — около 120 МДа (Petrovic et al., 2026).","Нуклеопорины образуют кольца из восьми одинаковых спиц, которые проходят через слившиеся наружную и внутреннюю ядерные мембраны.","Неупорядоченные участки с FG-повторами составляют около 40 % массы поры человека и заполняют центральный канал, создавая барьер.","Через одну пору проходит около 1000 макромолекул в секунду; каждая находится в канале около 10 мс."],"paragraphs":["Что уточняет этот обзор. Обычно называют около 30 различных нуклеопоринов (БИО-3·23); обзор 2026 г. — около 35. Числа близки.","Обзор подтверждает и схему направленного переноса (БИО-3·25): фактор обмена нуклеотидов для Ran находится на хроматине в ядре, белок, активирующий гидролиз ГТФ Ran, — в цитоплазме; поэтому Ran-ГТФ преобладает в ядре (Petrovic et al., 2026; вспомнить БИО-3·25). Обзор описывает и обратный путь самого импортина: в классическом импорте сигнал ядерной локализации связывает импортин-α вместе с импортином-β; в ядре Ran-ГТФ освобождает груз, импортин-β с Ran-ГТФ возвращается в цитоплазму, а импортин-α выносит из ядра другой экспортин — Cas — тоже вместе с Ran-ГТФ. Белки с NES выносит экспортин Crm1. ЗАКЛЮЧЕНИЕ: без Cas импортин-α накапливался бы в ядре, и импорт остановился бы после того, как свободный импортин-α в цитоплазме закончится.","Раньше считали, что барьер поры ограничивает свободную диффузию макромолекул крупнее 40 кДа; более поздние работы показывают, что он влияет на скорость прохода молекул самых разных размеров (вспомнить БИО-3·28).",{"h":"Метод"},"Обзор описывает, как к почти атомным структурам целых пор пришли, объединив электронную микроскопию, биохимическую реконструкцию комплексов нуклеопоринов и интегративную структурную биологию: структуры отдельных нуклеопоринов встраивают в карты плотности поры, полученные криоэлектронной томографией клеток и выделенных ядерных оболочек (Petrovic et al., 2026). Контроль — сравнение карт пор разных организмов и проверка взаимодействий нуклеопоринов биохимически и в клетке. Ограничение: разрешение карт пор в клетке — около 2–5 нм, поэтому положение отдельных участков белков в них определяют, встраивая структуры, полученные другими методами. Чего данные не доказывают: как именно FG-барьер отбирает молекулы — это обсуждают отдельные модели."],"trap":["Ошибка: ядерная пора — пустое отверстие в оболочке.","Центральный канал заполнен неупорядоченными участками с FG-повторами — около 40 % массы поры человека; они и создают барьер (Petrovic et al., 2026)."],"conditions":"Petrovic, Mobbs, Hoelz, 2026 — обзор. Числа — из него; масса указана для позвоночных. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Petrovic2026"],"quiz":{"id":"S3-L29","question":"Что заполняет центральный канал ядерной поры и создаёт её барьер?","options":[{"id":"S3-L29-1","text":"Липидный бислой, который пора проходит насквозь","correct":false,"feedback":"Мембраны ядерной оболочки в поре слиты и окружают комплекс снаружи; канал заполнен белковыми участками."},{"id":"S3-L29-2","text":"Неупорядоченные участки нуклеопоринов с FG-повторами","correct":true,"feedback":"Они составляют около 40 % массы поры человека и заполняют канал (Petrovic et al., 2026)."},{"id":"S3-L29-3","text":"Вода без белков, поэтому проходит всё, что меньше канала","correct":false,"feedback":"Канал заполнен FG-участками; именно поэтому крупные молекулы проходят медленно."}]},"widget":{"kind":"addr","title":"","s":{"title":"Числа, описывающие ядерную пору","noarrows":true,"status":"По обзору Petrovic et al., 2026","modes_label":"Что сравнить","modes":["состав","барьер","поток"],"h":["Показатель","Значение","Источник"],"rows":[["разных\nнуклеопоринов","около 35\n(обычно — около 30)","обзор 2026"],["доля FG-участков\nв массе поры","около 40 %","обзор 2026"],["макромолекул\nв секунду","около 1000\nна одну пору","обзор 2026"]],"foot":"сверх программы — на коллоквиуме и зачёте не требуется","notes":["Комплекс ядерной поры построен примерно из 35 разных нуклеопоринов, всего около 1000 субъединиц.","FG-участки составляют около 40 % массы поры человека и заполняют канал.","Через одну пору проходит около 1000 макромолекул в секунду; время пребывания в канале — около 10 мс."],"static":["Около 35 нуклеопоринов и 1000 субъединиц; FG-участки — около 40 % массы; около 1000 макромолекул в секунду через пору."]}},"level":"adv"},{"id":"methods","section":4,"questions":[1,2,3,4],"title":"Как узнают, на каком этапе остановился груз","keywords":["метод","иммунофлуоресценция","электронная микроскопия","фотообесцвечивание","бесклеточная система"],"lead":["Во многих экспериментах семинара вопрос один: где оказался груз после того, как выключили деталь. Ответить на него помогают разные методы, и у каждого — своя измеряемая величина, свой контроль и свои ограничения.","Шаг собирает методы, которые встретились в продвинутых шагах разделов 1–4. Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Электронная микроскопия показывает форму мембран — впяченную ямку, суженную шейку, трубку (БИО-3·4; Damke et al., 1994).","Иммунофлуоресценция с белками-маркерами компартментов показывает, с каким компартментом совпадает груз: LAMP1 — маркер лизосом и поздних эндосом, EEA1 — ранних эндосом (БИО-3·22; Steinberg et al., 2013).","Бесклеточная система из мембран и цитозоля позволяет выключить один компонент и вернуть его очищенным (БИО-3·13; Block et al., 1988).","Съёмка живых клеток и фотообесцвечивание измеряют время: как быстро меняется метка эндосомы или выравнивается белок между ядром и цитоплазмой (БИО-3·21, 3·28)."],"paragraphs":["ЗАКЛЮЧЕНИЕ: измеряемую величину выбирают по вопросу. Если нужно узнать, образовался ли носитель, смотрят форму мембраны; если нужно узнать, куда попал груз, — его положение относительно маркеров компартментов; если нужно узнать, какой белок необходим, — выключают его и возвращают очищенным или синтезированным заново.",{"h":"Контроль и ограничения"},"Контроль — тот же эксперимент без вмешательства или с вмешательством, которое не должно действовать (белок дикого типа вместо мутантного, контрольная РНК, сигнал с заменой ключевого остатка). Типичные артефакты: избыточный синтез меченого белка, неспецифическое действие ингибитора (например, N-этилмалеимида), перенос выводов с одного типа клеток на другие.","Измерение само по себе показывает, где находится груз или как выглядит мембрана, — это наблюдение. Необходимость детали доказывает вмешательство (удаление, мутация, подавление синтеза) вместе с таким измерением; достаточность добавления — перенос сигнала на чужой белок или восстановление функции очищенным белком в системе, где остальные компоненты сохранены. Некоторые работы семинара измеряли свойство, а не необходимость детали: скорость прохода через пору (Timney et al., 2016), натяжение мембраны (Sinha et al., 2011), сродство лиганда к рецептору при разном pH (Dautry-Varsat et al., 1983)."],"trap":["Ошибка: если метод показал, где находится груз, механизм уже доказан.","Положение груза — наблюдение; чтобы показать, что деталь необходима, её выключают и сравнивают с контролем, а достаточность добавления проверяют переносом сигнала на чужой белок или восстановлением функции очищенным белком в системе, где остальные компоненты сохранены."],"conditions":"Обобщение методов из продвинутых шагов семинара; числа и условия — в соответствующих шагах. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Damke1994","Block1988","Rink2005","Steinberg2013","Timney2016"],"quiz":{"id":"S3-L30","question":"Нужно проверить, попадает ли белок в лизосомы после выключения SNX27. Какую величину измерить?","options":[{"id":"S3-L30-1","text":"Форму клатриновых ямок в электронной микроскопии","correct":false,"feedback":"Форма ямок говорит об образовании носителя на поверхности, а не о том, куда груз попал после эндосомы."},{"id":"S3-L30-2","text":"Скорость выравнивания белка между ядром и цитоплазмой","correct":false,"feedback":"Эта величина описывает проход через ядерную пору; к лизосомам она отношения не имеет."},{"id":"S3-L30-3","text":"Положение белка относительно маркера лизосом LAMP1","correct":true,"feedback":"Увеличение совпадения с LAMP1 согласуется с доставкой белка в лизосомные компартменты; расщепление подтверждают отдельным измерением — так и сделано в работе (Steinberg et al., 2013)."}]},"widget":{"kind":"addr","title":"","s":{"title":"Выберите метод и посмотрите, что он измеряет","noarrows":true,"status":"Обобщение методов семинара","modes_label":"Метод","modes":["электронная микроскопия","иммунофлуоресценция","бесклеточная система","фотообесцвечивание"],"h":["Что измеряется","Контроль","Чего не доказывает"],"rows":[["форма мембран:\nямки, шейки,\nтрубки","клетки без\nвмешательства","какой белок\nсужает шейку"],["в каком\nкомпартменте\nгруз","контрольная\nРНК","как белок\nне пускает груз"],["перенос между\nмембранами","необработанные\nмембраны","этап, на котором\nработает белок"],["скорость\nвыравнивания","белки одного\nстроения","перенос на\nдругие клетки"]],"foot":"измерение описывает состояние; необходимость показывает вмешательство","notes":["Damke et al., 1994: в клетках с мутантным динамином ямки впячены, но не сужаются.","Steinberg et al., 2013: без SNX27 GLUT1 совпадает с маркером лизосом LAMP1.","Block et al., 1988: после N-этилмалеимида перенос возвращает очищенный NSF.","Timney et al., 2016: белок 67 кДа выравнивается между ядром и цитоплазмой за минуты."],"static":["Электронная микроскопия — форма мембран; иммунофлуоресценция — компартмент; бесклеточная система — необходимый белок; фотообесцвечивание — скорость прохода."]}},"level":"adv"},{"id":"investigation","section":4,"questions":[1,2,3,4],"title":"Путь одного груза через клетку: трансцитоз IgA","keywords":["путь груза","трансцитоз","IgA","рецептор","носитель","эндосома"],"lead":["Проследим один груз — димерный IgA, который эпителиальная клетка переносит от базолатеральной поверхности к апикальной ([[T27|трансцитоз]]), — и на каждом этапе назовём, что происходит и что для этого нужно.","Шаг повторяет материал разделов 1–3 на новом примере."],"mechanism":["Базолатеральная поверхность: IgA связывается с полимерным иммуноглобулиновым рецептором; рецептор собирается в покрытой клатрином ямке, его цитоплазматический участок связывают адаптерные белки; покрытую везикулу отделяет динамин (условие примера).","Цитоплазма: везикула сбрасывает клатриновую оболочку и сливается с ранней эндосомой с участием SNARE-белков.","Эндосомы: комплекс IgA с рецептором не диссоциирует и переносится через эндосомы к апикальной мембране.","Апикальная мембрана: рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом."],"paragraphs":["ЗАКЛЮЧЕНИЕ: этот путь отличается от самого частого тем, что лиганд не отделяется от рецептора в ранней эндосоме, а рецептор не возвращается: его внеклеточная часть уходит в секрет вместе с IgA. Поэтому одна молекула рецептора переносит IgA один раз (вспомнить БИО-3·16, 3·17).","Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко. Клинический пример иллюстрирует механизм и не является рекомендацией.","Сравните с белком, идущим в ядро: там нет мембранных носителей, а груз проходит через водный канал комплекса ядерной поры с транспортным рецептором (БИО-3·24, 3·25)."],"trap":["Ошибка: в эндосоме лиганд всегда отделяется от рецептора.","Комплекс IgA с полимерным иммуноглобулиновым рецептором не диссоциирует: рецептор переносит IgA через клетку и расщепляется на апикальной мембране."],"conditions":"Обобщение материала разделов 1–3. Условие примера: рецептор с IgA захватывается через покрытые клатрином ямки, как рецепторный груз в шаге БИО-3·2. Схема-таблица качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L31","question":"Где IgA отделяется от полимерного иммуноглобулинового рецептора при трансцитозе?","options":[{"id":"S3-L31-1","text":"Нигде в клетке: на апикальной мембране рецептор расщепляется, и IgA выделяется вместе с его внеклеточной частью","correct":true,"feedback":"IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом."},{"id":"S3-L31-2","text":"В ранней эндосоме, как большинство лигандов","correct":false,"feedback":"Комплекс IgA с рецептором в эндосомах не диссоциирует и переносится к апикальной мембране."},{"id":"S3-L31-3","text":"В лизосоме, где рецептор расщепляется","correct":false,"feedback":"Комплекс идёт не в лизосому, а к апикальной мембране; рецептор расщепляется там."}]},"widget":{"kind":"addr","title":"","s":{"title":"Пройдите путь IgA по этапам","noarrows":true,"status":"Обобщение","modes_label":"Этап","modes":["базолатеральная поверхность","носитель","эндосомы","апикальная мембрана"],"h":["Что происходит","Что для этого нужно","Где оказывается груз"],"rows":[["IgA связывается\nс рецептором;\nрецептор — в ямке","адаптерные белки,\nклатрин, динамин","в покрытой\nклатрином\nвезикуле"],["снятие оболочки\nи слияние\nс эндосомой","Rab-белки,\nSNARE-белки","в ранней\nэндосоме"],["комплекс\nне диссоциирует","сортировка\nв эндосомах","в везикулах,\nидущих к апикальной\nмембране"],["рецептор\nрасщепляется","расщепление\nрецептора","IgA с секреторным\nкомпонентом —\nв секрете"]],"foot":"одна молекула рецептора переносит IgA один раз (ЗАКЛЮЧЕНИЕ)","notes":["IgA связывается с полимерным иммуноглобулиновым рецептором; рецептор собирается в покрытой клатрином ямке.","Везикула сбрасывает оболочку и сливается с ранней эндосомой.","Комплекс IgA с рецептором не диссоциирует и переносится к апикальной мембране.","Рецептор расщепляется; IgA выделяется в секрет вместе с секреторным компонентом."],"static":["Базолатеральная поверхность → покрытая клатрином везикула → эндосомы → апикальная мембрана: комплекс не распадается до расщепления рецептора."]}}}],"sections":[{"title":"Эндоцитоз: механизмы и признаки","entry":"endo-routes","sub":"Что захватывается, каким носителем и какие белки для этого нужны"},{"title":"Цикл транспортного носителя","entry":"carrier-cycle","sub":"Оболочка, отделение, снятие оболочки, узнавание мишени и слияние"},{"title":"Рецептор и лиганд после эндоцитоза","entry":"early-endosome","sub":"Ранняя эндосома, пути рецептора и лиганда, поздняя эндосома и лизосома"},{"title":"Ядерная пора и общий принцип адресации","entry":"envelope-pore","sub":"Диффузия малых молекул, импорт и экспорт с рецепторами, градиент Ran, метка — рецептор — механизм"},{"title":"Исследование","entry":"methods","sub":"Методы семинара и путь одного груза через эпителиальную клетку"}],"glossary":[{"id":"S3-T01","term":"Эндоцитоз","section":0,"def":"Общее название процессов везикулярного транспорта, при которых вещества поступают в клетку в мембранных пузырьках, образованных из плазматической мембраны."},{"id":"S3-T02","term":"Микропиноцитоз","section":0,"def":"Постоянное неспецифическое поглощение жидкости и небольших белковых молекул в мелких пузырьках (менее 150 нм). Такие пузырьки образуются разными путями — из покрытых клатрином ямок и без клатрина."},{"id":"S3-T03","term":"Макропиноцитоз","section":0,"def":"Регулируемый захват внеклеточной жидкости: перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы более 0,2 мкм."},{"id":"S3-T04","term":"Фагоцитоз","section":0,"def":"Поглощение крупных частиц (бактерий, обломков клеток, пыли) специализированными фагоцитами; псевдоподии охватывают частицу, образуется фагосома более 250 нм."},{"id":"S3-T05","term":"Рецептор-опосредованный эндоцитоз","section":0,"def":"Захват молекул, которые связываются со своими рецепторами на поверхности клетки. Во многих клетках животных растворённые макромолекулы так поступают через покрытые клатрином ямки: рецепторы с грузом через адаптеры связываются с клатрином, и ямка становится покрытой клатрином везикулой. Узнавание груза рецептором бывает и в клатрин-независимых путях, например при фагоцитозе."},{"id":"S3-T06","term":"Рецептор груза","section":0,"def":"Трансмембранный белок, который снаружи связывает определённый груз, а цитоплазматическим участком — белок-адаптер."},{"id":"S3-T07","term":"Белок-адаптер","section":0,"def":"Белок, связывающий цитоплазматический участок рецептора груза с клатрином, например адаптин."},{"id":"S3-T08","term":"Клатрин","section":0,"def":"Белок оболочки, который собирается в решётку с цитоплазматической стороны мембраны и изгибает её в ямку."},{"id":"S3-T09","term":"Динамин","section":0,"def":"ГТФаза, которая опосредует отделение покрытой клатрином везикулы от мембраны; шейку ямки перерезает динамин."},{"id":"S3-T10","term":"Кавеола","section":0,"def":"Сверх программы: колбовидное впячивание плазматической мембраны 50–100 нм, образованное кавеолинами и кавинами и обогащённое холестерином и сфинголипидами."},{"id":"S3-T11","term":"Натяжение мембраны","section":0,"def":"Сверх программы: сила, растягивающая мембрану в её плоскости, в расчёте на единицу длины (мН/м); растёт, когда площадь клетки должна увеличиться (например, при набухании), а запаса мембраны нет."},{"id":"S3-T12","term":"Асимметрия мембраны","section":0,"def":"Сверх программы: различие липидного состава наружного и цитоплазматического листков плазматической мембраны."},{"id":"S3-T13","term":"Транспортный носитель","section":1,"def":"Мембранный пузырёк (везикула), который образуется почкованием от мембраны одного компартмента и сливается с мембраной другого, перенося груз между ними."},{"id":"S3-T14","term":"Оболочка носителя","section":1,"def":"Белковый слой, который собирается на мембране-доноре, отбирает груз и изгибает мембрану в носитель: COP-II, COP-I или клатрин с адаптерами."},{"id":"S3-T15","term":"COP-II","section":1,"def":"Оболочка носителей, переносящих только что синтезированные белки из грЭПР в цис-сеть комплекса Гольджи (антероградный, прямой транспорт)."},{"id":"S3-T16","term":"COP-I","section":1,"def":"Оболочка носителей ретроградного (обратного) транспорта: из комплекса Гольджи в грЭПР и между цистернами комплекса Гольджи."},{"id":"S3-T17","term":"SNARE-белки","section":1,"def":"Белки слияния мембран: SNARE носителя (v-SNARE) и SNARE мембраны-мишени (t-SNARE) собираются в комплекс и обеспечивают слияние. По остатку в центре комплекса их делят также на R-SNARE (аргинин) и Q-SNARE (глутамин); это другая классификация, а не новое название v- и t-SNARE (БИО-3·12)."},{"id":"S3-T18","term":"Rab-белки и тетеринг-факторы","section":1,"def":"Белки первичного узнавания мишени: Rab в активной форме (связанный с ГТФ) отмечает мембрану и привлекает длинные тетеринг-факторы, которые удерживают подходящий носитель на расстоянии до сборки SNARE."},{"id":"S3-T19","term":"Ранняя эндосома","section":1,"def":"Сортировочный компартмент, который образуется при слиянии эндоцитозных везикул друг с другом; обычно около 10 минут принимает новые везикулы, а затем созревает в позднюю эндосому."},{"id":"S3-T20","term":"NSF","section":1,"def":"АТФаза, чувствительная к N-этилмалеимиду (англ. N-ethylmaleimide-sensitive factor): после слияния разбирает SNARE-комплекс. Сверх программы: работает вместе с белками α-SNAP — растворимыми белками, связывающими NSF."},{"id":"S3-T21","term":"Пора слияния","section":1,"def":"Сверх программы: канал, который соединяет просвет носителя с просветом мишени (или с внеклеточной средой при экзоцитозе) в момент слияния мембран."},{"id":"S3-T22","term":"Гемислияние","section":1,"def":"Сверх программы: промежуточное состояние слияния, при котором слиты только обращённые друг к другу (проксимальные) монослои двух мембран, а поры ещё нет."},{"id":"S3-T23","term":"Рециркуляция рецептора","section":2,"def":"Возврат рецептора из ранней эндосомы на поверхность клетки в везикулах, отпочковывающихся от эндосомы; позволяет клетке постоянно и избирательно захватывать вещество."},{"id":"S3-T24","term":"Поздняя эндосома","section":2,"def":"Эндосома, в которую созревает ранняя: её среда кислее, она лежит глубже в цитоплазме; мембрана поздней эндосомы впячивается внутрь, образуя мультивезикулярное тельце."},{"id":"S3-T25","term":"Мультивезикулярное тельце","section":2,"def":"Поздняя эндосома с внутрипросветными везикулами, образованными впячиванием её мембраны в просвет; мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется."},{"id":"S3-T26","term":"Убиквитин","section":2,"def":"Небольшой белок, который присоединяется к другим белкам как метка; убиквитинированный рецептор включается в мембрану внутрипросветных везикул и разрушается в лизосоме."},{"id":"S3-T27","term":"Трансцитоз","section":2,"def":"Перенос рецептора с лигандом через клетку — например, димерного IgA с полимерным иммуноглобулиновым рецептором от базолатеральной поверхности эпителиальной клетки к апикальной."},{"id":"S3-T28","term":"Трансферрин","section":2,"def":"Сверх программы: белок плазмы крови, переносящий железо; отдаёт железо в кислой эндосоме, а сам вместе с рецептором возвращается на поверхность клетки."},{"id":"S3-T29","term":"Rab5 и Rab7","section":2,"def":"Малые ГТФазы — метки ранней (Rab5) и поздней (Rab7) эндосомы. Сверх программы: при созревании эндосомы Rab5 на её мембране сменяется Rab7."},{"id":"S3-T30","term":"SNX27–ретромер","section":2,"def":"Сверх программы: комплекс на ранней эндосоме, который узнаёт концевой PDZ-лиганд мембранного белка и возвращает белок на поверхность вместо лизосомы."},{"id":"S3-T31","term":"Ядерная оболочка","section":3,"def":"Две мембраны с перинуклеарным пространством между ними; наружная мембрана продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами."},{"id":"S3-T32","term":"Комплекс ядерной поры","section":3,"def":"Белковый комплекс в поре ядерной оболочки, построенный примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; белки с FG-повторами создают в нём селективный барьер."},{"id":"S3-T33","term":"Сигнал ядерной локализации (NLS)","section":3,"def":"Участок белка, по которому его узнаёт импортин и переносит из цитоплазмы в ядро."},{"id":"S3-T34","term":"Последовательность ядерного экспорта (NES)","section":3,"def":"Участок белка, по которому его в ядре узнаёт экспортин и переносит в цитоплазму."},{"id":"S3-T35","term":"Импортин и экспортин","section":3,"def":"Растворимые транспортные рецепторы: импортин связывает белки с NLS и переносит их в ядро, экспортин — белки с NES из ядра; оба процесса идут при участии ГТФ."},{"id":"S3-T36","term":"Градиент Ran","section":3,"def":"Различие состояний малой ГТФазы Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме; задаёт направление переноса через пору."},{"id":"S3-T37","term":"Сигнал сортировки","section":3,"def":"Участок аминокислотной цепи белка или его модификация (например, маннозо-6-фосфат или присоединённый убиквитин), по которым сортировочный аппарат клетки направляет белок к месту назначения."}],"sources":{"Alberts2022":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»","doi":"","pmid":""},"Damke1994":{"url":"https://doi.org/10.1083/jcb.127.4.915","cite":"Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934","doi":"10.1083/jcb.127.4.915","pmid":"7962076"},"Lennartz2026":{"url":"https://doi.org/10.1038/s41556-026-02068-7","cite":"Lennartz H. M. et al. Quantification of lipid sorting during clathrin-mediated endocytosis. Nat Cell Biol. 2026;28:2027–2035","doi":"10.1038/s41556-026-02068-7","pmid":""},"Parton2026":{"url":"https://doi.org/10.1038/s41556-026-01945-5","cite":"Parton R. G., Kozlov M. M., Lundmark R. A lipid-centric view of endocytosis by caveolae. Nat Cell Biol. 2026;28:852–860","doi":"10.1038/s41556-026-01945-5","pmid":""},"Sinha2011":{"url":"https://doi.org/10.1016/j.cell.2010.12.031","cite":"Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413","doi":"10.1016/j.cell.2010.12.031","pmid":"21295700"},"Lamaze2026":{"url":"https://doi.org/10.1038/s41580-026-00964-2","cite":"Lamaze C., Blouin C. M., Sens P. Caveolae mechanics in cellular functions and disease. Nat Rev Mol Cell Biol. 2026;27:581–600","doi":"10.1038/s41580-026-00964-2","pmid":""},"Block1988":{"url":"https://doi.org/10.1073/pnas.85.21.7852","cite":"Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856","doi":"10.1073/pnas.85.21.7852","pmid":""},"Jahn2024":{"url":"https://doi.org/10.1038/s41580-023-00668-x","cite":"Jahn R., Cafiso D. C., Tamm L. K. Mechanisms of SNARE proteins in membrane fusion. Nat Rev Mol Cell Biol. 2024;25:101–118","doi":"10.1038/s41580-023-00668-x","pmid":""},"WuChan2024":{"url":"https://doi.org/10.1038/s41467-023-44539-7","cite":"Wu L.-G., Chan C. Y. Membrane transformations of fusion and budding. Nat Commun. 2024;15:21","doi":"10.1038/s41467-023-44539-7","pmid":""},"DautryVarsat1983":{"url":"https://doi.org/10.1073/pnas.80.8.2258","cite":"Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262","doi":"10.1073/pnas.80.8.2258","pmid":""},"Brown1986":{"url":"https://doi.org/10.1126/science.3513311","cite":"Brown M. S., Goldstein J. L. A receptor-mediated pathway for cholesterol homeostasis. Science. 1986;232:34–47","doi":"10.1126/science.3513311","pmid":""},"Rink2005":{"url":"https://doi.org/10.1016/j.cell.2005.06.043","cite":"Rink J., Ghigo E., Kalaidzidis Y., Zerial M. Rab conversion as a mechanism of progression from early to late endosomes. Cell. 2005;122:735–749","doi":"10.1016/j.cell.2005.06.043","pmid":""},"Steinberg2013":{"url":"https://doi.org/10.1038/ncb2721","cite":"Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471","doi":"10.1038/ncb2721","pmid":"23563491"},"Kalderon1984":{"url":"https://doi.org/10.1016/0092-8674(84)90457-4","cite":"Kalderon D., Roberts B. L., Richardson W. D., Smith A. E. A short amino acid sequence able to specify nuclear location. Cell. 1984;39:499–509","doi":"10.1016/0092-8674(84)90457-4","pmid":""},"Timney2016":{"url":"https://doi.org/10.1083/jcb.201601004","cite":"Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76","doi":"10.1083/jcb.201601004","pmid":""},"Petrovic2026":{"url":"https://doi.org/10.1038/s41580-025-00881-w","cite":"Petrovic S., Mobbs G. W., Hoelz A. Structure, function and assembly of nuclear pore complexes. Nat Rev Mol Cell Biol. 2026;27:35–54","doi":"10.1038/s41580-025-00881-w","pmid":""}},"questions":["Эндоцитоз","Цикл носителя","Рецептор и лиганд","Ядерная пора"],"exam_ids":["endo-routes","coated-pit","actin-uptake","carrier-cycle","uncoating","docking-fusion","early-endosome","four-routes","recycling-gain","envelope-pore","nls-importin","address-principle"],"practice_url":"seminar-3.html","open_questions":[{"q":"Макрофагу в культуре одновременно дали раствор с растворённым красителем, лиганд, который поступает в клетку через клатриновые ямки, и крупные частицы. Объясните, какими путями и в каких носителях каждый груз может попасть в клетку и какой белок нужно выключить, чтобы нарушить только избирательный захват лиганда.","crit":"Названы пути: микропиноцитоз (пузырьки < 150 нм), рецептор-опосредованный эндоцитоз (покрытые клатрином везикулы), фагоцитоз (фагосома > 250 нм; макрофаг — специализированный фагоцит); выключить клатрин (или адаптер); объяснено, почему захват жидкости при этом продолжается (макропиносомы и мелкие носители без клатрина) и почему небольшая часть лиганда может попасть в клетку вместе с жидкостью."},{"q":"Объясните, почему цикл транспортного носителя может повторяться многократно: что происходит после отделения носителя с белками оболочки и после слияния — с SNARE-комплексом и мембранными белками носителя.","crit":"Названо: оболочка снимается с отделившегося носителя, её белки возвращаются в цитоплазму и снова собираются на мембране-доноре; после слияния SNARE-комплекс разбирается АТФазой NSF, и SNARE-белки снова готовы к слиянию; при экзоцитозе мембранные белки везикулы вместе с участком плазмолеммы возвращаются в клетку путём эндоцитоза."},{"q":"Сравните путь белка-переносчика, который не отделяется от рецептора в ранней эндосоме и вместе с ним возвращается на ту же поверхность клетки, где при нейтральном pH отделяется от рецептора, и путь димерного IgA с полимерным иммуноглобулиновым рецептором в эпителиальной клетке. Где в каждом случае комплекс распадается и сколько раз может работать одна молекула рецептора?","crit":"Белок-переносчик: комплекс не диссоциирует в ранней эндосоме, возвращается на поверхность и по условию распадается там при нейтральном pH; рецептор работает многократно. IgA: комплекс, захваченный на базолатеральной поверхности, переносится через эндосомы к апикальной мембране; рецептор расщепляется, и IgA выделяется в секрет вместе с секреторным компонентом; одна молекула рецептора переносит IgA один раз (ЗАКЛЮЧЕНИЕ). Названо общее: в обоих случаях лиганд не отделяется от рецептора в ранней эндосоме."},{"q":"Объясните, как крупный белок, который работает в ядре лишь временно и пассивно проходит пору пренебрежимо мало, покидает ядро: какой сигнал на нём должен быть, какой белок этот сигнал узнаёт и почему без Ran-ГТФ белок останется в ядре.","crit":"Названы последовательность ядерного экспорта (NES) и экспортин, который связывает белок в ядре и переносит его в цитоплазму; экспорт идёт при участии ГТФ. Ran-ГТФ преобладает в ядре и стабилизирует комплекс экспортина с грузом до выхода; гидролиз ГТФ не проталкивает груз, а поддерживает различие состояний Ran по сторонам оболочки. Без Ran-ГТФ комплекс экспортина с грузом не образуется, рецепторный экспорт нарушен, и за время наблюдения крупный белок остаётся в ядре (ЗАКЛЮЧЕНИЕ)."}]};
/* Объяснения к семинару 3. Без внешних библиотек и сетевых запросов.

const $ = id => document.getElementById(id);

  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */
const ncap = s => esc(s).replace(/Ca(?=²⁺)/g, '<span style="text-transform:none">Ca</span>');

/* ---------- порядок вариантов: перемешивается при открытии страницы; ?fixed — постоянный порядок ---------- */
const params = new URLSearchParams(location.search);
const FIXQ = params.has('fixed') ? '?fixed' : '';  /* каркас с 23.10.2026 (из сем. 7 v3.8, аудит A09): ссылки на практикум сохраняют ?fixed */
const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');
const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => ORDER[l.id] || (ORDER[l.id] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id));
const optById = (l, id) => l.quiz.options.find(o => o.id === id);
const EXAM_IDS = SHUFFLE ? shuffled(CONTENT.exam_ids) : CONTENT.exam_ids.slice();
const LETTERS = ['А', 'Б', 'В'];

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {
  const lines = String(label).split('\n'), lh = size * 1.2, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};
const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;
const slider = (id, label, min, max, value, step = 1, unit = '') => `<label for="${id}">${esc(label)}<output id="${id}-value">${value}${unit}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" data-unit="${esc(unit)}"></label>`;
const select = (id, label, opts, value = 0) => `<label for="${id}">${esc(label)}<select id="${id}">${opts.map((x, i) => `<option value="${i}"${i === value ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
const check = (id, label, on) => `<label class="chk" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> <span>${esc(label)}</span></label>`;
const metric = (label, value) => `<div>${esc(label)}<strong>${esc(value)}</strong></div>`;
const result = s => `<div class="result">${s}</div>`;
const tbl = (head, rows, cls = '') => `<div class="table-scroll"><table class="${cls}"><thead><tr>${head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);
const lvlTag = (v) => `<span class="lvl lvl${v < 0 ? 'x' : v}">${esc(lvl(v))}</span>`;
function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');
    d += rect(x0, y, W, 26, '#eef3f7', 6, 'stroke="#c8d6e2"');
    if (r.v >= 0) d += rect(x0, y, W * (r.v / 3), 26, r.cls === 'warn' ? '#c3662f' : '#145c96', 6, r.v === 0 ? 'opacity=".0"' : '');
    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');
  });
  return svg(d, U.chart_levels, h, w);
}
/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {

  }

    const dense = sample(points, m.closed);

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */

    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */

      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }

  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:

        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------

    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */

      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`

  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */

      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };

      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);

        if (noSnare) {

              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
