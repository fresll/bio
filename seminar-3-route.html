"апотрансферрин","pH","железо","HepG2"],"lead":["[[T28|Трансферрин]] — пример белка-переносчика, который не отделяется от рецептора в ранней эндосоме. Эксперимент с изменением pH показал, что кислая среда отделяет от него не рецептор, а железо.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Трансферрин с железом связывается с рецептором на поверхности при нейтральном pH, и комплекс уходит в клетку (Dautry-Varsat et al., 1983).","В кислой среде эндосомы (pH 5,5 и ниже) железо отделяется от трансферрина; трансферрин без железа — апотрансферрин — остаётся на рецепторе: при pH 5,4 он связывается так же прочно, как трансферрин с железом при pH 7,0.","Комплекс апотрансферрина с рецептором возвращается на поверхность; при нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C, а трансферрин с железом — 7,5 мин (примерно в 28 раз медленнее; по сводной оценке авторов для двух температур — в 30–40 раз). Железо остаётся в клетке."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Путь «рециркуляция рецептора и лиганда» описывают для белков-переносчиков (БИО-3·16); эксперимент показывает, как такой путь возникает: связь лиганда с рецептором зависит от pH по-разному для формы с железом и без него. В кислой среде железо отделяется, но связь трансферрина с рецептором сохраняется: трансферрин, связанный при нейтральном pH, не отделялся при обработке растворами с pH от 4,5 до 7,5 (4 °C, с хелатором железа; сходный результат — при 37 °C). Для сравнения, асиалоорозомукоид и инсулин при кислом pH от своих рецепторов отделялись.",{"h":"Метод"},"Клетки гепатомы человека HepG2. Меченый трансферрин (125I — белок, 59Fe — железо) связывали с рецепторами при 4 °C, когда интернализации нет, затем меняли pH среды и измеряли, что остаётся на клетках. Чтобы при 37 °C трансферрин не уходил в клетку, добавляли ингибиторы энергетического обмена (цианид и 2-дезоксиглюкозу); освободившееся железо связывал хелатор десферриоксамин.","Контроль: трансферрин с железом при нейтральном pH; другие лиганды (асиалоорозомукоид, инсулин) в тех же условиях. Ограничение: эксперименты на поверхности клеток моделируют среду эндосомы, но не воспроизводят саму эндосому.","Чего данные не доказывают. Работа объясняет, почему трансферрин и рецептор возвращаются вместе, но не показывает, по какому пути комплекс выходит из эндосомы и где именно освобождается железо внутри клетки."],"conditions":"Dautry-Varsat et al., 1983: клетки HepG2; полупериоды при 37 °C — 16 с (апотрансферрин) и 7,5 мин (трансферрин с железом) при нейтральном pH; освобождение железа при pH 5 — около 1,5 мин. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["DautryVarsat1983"],"quiz":{"id":"S3-L19","question":"Апотрансферрин связан с рецептором в эндосоме при pH 5,4. Комплекс вернулся на поверхность клетки с нейтральным pH. Что произойдёт?","options":[{"id":"S3-L19-1","text":"Апотрансферрин быстро отделится, рецептор освободится","correct":true,"feedback":"При нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C (Dautry-Varsat et al., 1983)."},{"id":"S3-L19-2","text":"Апотрансферрин останется на рецепторе до следующего эндоцитоза","correct":false,"feedback":"При нейтральном pH апотрансферрин удерживается на рецепторе слабо и отделяется за секунды."},{"id":"S3-L19-3","text":"Апотрансферрин свяжет железо прямо на рецепторе и уйдёт в клетку снова","correct":false,"feedback":"Железо апотрансферрин связывает в среде, уже отделившись; на рецептор возвращается трансферрин с железом."}]},"widget":{"kind":"tf","title":"","s":{"title":"Пройдите цикл трансферрина","status":"Данные Dautry-Varsat et al., 1983 · клетки HepG2","modes_label":"Этап","modes":["на поверхности: pH 7","в эндосоме: pH 5","апотрансферрин: pH 5","снова на поверхности: pH 7"],"cfg":[["holo",false],["holo",true],["apo",true],["apo",false]],"ph":["нейтральный pH, как снаружи клетки","кислый pH, как в эндосоме","кислый pH, как в эндосоме","нейтральный pH, как снаружи клетки"],"out":"внеклеточная среда","cyto":"цитоплазма","l_bound":"трансферрин связан с рецептором","l_free":"апотрансферрин отделяется от рецептора","m":["Трансферрин и рецептор","Железо"],"v":[["связаны","связаны","связаны","отделяются за секунды"],["на трансферрине","отделяется","в клетке","в клетке"]],"notes":["Трансферрин с железом связан с рецептором.","В кислой среде железо отделяется, трансферрин остаётся на рецепторе.","Апотрансферрин связан с рецептором так же прочно, как трансферрин с железом при pH 7.","При нейтральном pH апотрансферрин отделяется с полупериодом 16 с."],"static":["Трансферрин с железом на рецепторе → в кислой эндосоме железо отделяется → апотрансферрин с рецептором возвращается → на поверхности апотрансферрин отделяется."]}},"num":19,"level":"adv"},{"id":"tf-two-cycles","section":2,"questions":[3],"num":43,"title":"Вошли вместе — уходят порознь: железо, трансферрин и рецептор за два цикла","keywords":["трансферрин","железо","рецептор","рециркуляция","обратная задача"],"lead":["Вспомнить: шаг «Какими путями расходятся рецептор и лиганд» — в ранней эндосоме определяется, вернётся ли рецептор и куда пойдёт лиганд. Трансферрин показывает, что у компонентов, вошедших вместе, может быть три разных пути.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Трансферрин с железом связывается с рецептором на поверхности, комплекс поступает в раннюю эндосому.","В слабокислой среде ранней эндосомы железо отделяется от трансферрина и остаётся в клетке (в эксперименте на клетках гепатомы человека железо уходило с трансферрина, связанного с рецептором, при pH 5 в присутствии вещества, связывающего железо).","Трансферрин без железа остаётся на рецепторе и вместе с ним возвращается на поверхность.","При нейтральном pH внеклеточной среды он отделяется; свободный рецептор связывает новый трансферрин."],"paragraphs":["Три компонента, вошедшие вместе, уходят порознь: железо остаётся в клетке, трансферрин и рецептор возвращаются. Поэтому одна молекула рецептора участвует во многих циклах, и захват железа зависит от того, сколько рецепторов возвращается на поверхность.","Если возврат рецептора нарушен, первый цикл проходит как обычно, но к следующему рецепторов на поверхности меньше: захват трансферрина и доставка железа снижаются. Если ослаблена кислотность эндосомы, в модели железо не отделяется: трансферрин с железом возвращается на поверхность связанным с рецептором, и рецепторы заняты.",{"h":"Обратная задача"},"Через некоторое время на поверхности стало меньше рецепторов. Возможны два объяснения: нарушен возврат — или рецепторы стали быстрее уходить внутрь. Число рецепторов на поверхности — баланс этих двух потоков, поэтому одно наблюдение их не различает. Различает отдельное измерение: пометить рецепторы, уже ушедшие внутрь, и проследить, возвращаются ли они с обычной скоростью.",{"h":"Граница вывода"},"Кислотность — не единственный фактор отделения железа в клетке, а переход железа из эндосомы в цитоплазму требует отдельных переносчиков. Свойства трансферрина нельзя переносить на любой рецептор: у ЛПНП кислая среда, наоборот, отделяет лиганд от рецептора.","Сверх программы и в эту модель не входят сортировочные комплексы эндосомы, сигналы возврата в хвосте рецептора и смена Rab5 на Rab7 — шаги «Как мембранный белок избегает лизосомы: сигнал возврата и SNX27–ретромер» и «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»."],"conditions":"Клетки человека; правила связывания — по измерениям на клетках гепатомы HepG2 и учебнику Alberts et al., 2022. Модель качественная.","sources":["DautryVarsat1983","Alberts2022"],"quiz":{"id":"S3-L43","question":"Первый цикл захвата трансферрина прошёл как обычно, затем возврат рецептора на поверхность нарушен. Что изменится при следующем цикле?","options":[{"id":"S3-L43-1","text":"Рецепторов на поверхности станет меньше, и железа клетка получит меньше","correct":true,"feedback":"Каждая молекула рецептора работает много раз, только если возвращается; без возврата к следующему циклу рецепторов на поверхности меньше."},{"id":"S3-L43-2","text":"Ничего: трансферрин вернётся на поверхность и без рецептора","correct":false,"feedback":"Трансферрин возвращается связанным с рецептором; без возврата рецептора он тоже остаётся внутри."},{"id":"S3-L43-3","text":"Захват усилится за счёт рецепторов, оставшихся в эндосомах","correct":false,"feedback":"Новый трансферрин связывается с рецепторами на поверхности, а не в эндосомах."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Нарушьте возврат рецептора трансферрина","status":"Схема качественная · не экспериментальные данные","modes_label":"Возврат рецептора","modes":["работает","нарушен"],"cfg":[[false,true,""],[false,false,"le"]],"m":["Трансферрин без железа (на схеме — лиганд)","Рецептор","К следующему циклу"],"v":[["возвращается с рецептором","остаётся на рецепторе, уходит к поздним эндосомам"],["возвращается","не возвращается"],["рецепторов на поверхности столько же","рецепторов на поверхности меньше"]],"notes":["Железо осталось в клетке; трансферрин без железа вернулся с рецептором и отделился на поверхности.","Рецептор не вернулся: к следующему циклу на поверхности меньше рецепторов, железа клетка получит меньше."],"static":["Возврат работает — рецептор с трансферрином без железа возвращается; нарушен — рецепторов на поверхности к следующему циклу меньше."]}},"level":"adv"},{"id":"ph-three-pairs","section":2,"questions":[3],"title":"Почему кислая среда эндосомы одни лиганды отделяет, а другие присоединяет","keywords":["pH эндосомы","рецептор ЛПНП","трансферрин","IgG","FcRn"],"lead":["Кислая среда эндосомы — общее условие для всех пар «рецептор — лиганд», но исход у них разный: [[T48|ЛПНП]] отделяется, трансферрин теряет железо и остаётся на рецепторе, а [[T50|IgG]], наоборот, связывается с рецептором [[T51|FcRn]] и благодаря этому возвращается.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["[[T52|pH эндосом]] при созревании снижается: в клетках HeLa — в среднем от 6,6 до прихода Rab5 до 5,7 в Rab7-положительных эндосомах (Podinovskaia et al., 2021); диапазон pH 5–6 — это условие связывания FcRn с IgG, а не pH ранней эндосомы.","FcRn связывает Fc-участок IgG при pH 5–6 и не связывает при pH 7,4: IgG, захваченный при пиноцитозе, связывается с FcRn в эндосоме, возвращается и освобождается на поверхности; несвязанный IgG уходит в лизосомы (Pyzik et al., 2023).","По обзору, ниже pH 6,5 ЛПНП отделяется от рецептора и уходит в лизосому (Brown, Goldstein, 1986); трансферрин при pH около 5 теряет железо (в присутствии хелатора), а апотрансферрин остаётся на рецепторе и отделяется при pH 7,4 (Dautry-Varsat et al., 1983)."],"paragraphs":["Что уточняет этот шаг. В кислой эндосоме многие лиганды отделяются от рецепторов (БИО-3·15). FcRn показывает обратную зависимость: кислая среда создаёт комплекс, а нейтральная его разрушает. Поэтому IgG в крови живёт долго: молекулы, связанные с FcRn, спасаются от лизосом. Препараты, занимающие FcRn, ускоряют расщепление IgG, в том числе аутоантител (клинический пример приводится для демонстрации патофизиологического значения клеточного механизма).",{"h":"Метод"},"pH эндосом измеряли датчиком из двух флуоресцентных белков, отношение свечения которых зависит от pH, с калибровкой в средах известного pH. Связывание рецепторов с лигандами при разном pH измеряют отдельно, на клетках или очищенных белках.","Чего метод не доказывает. Пары изучены в разных клетках и разными методами; для ЛПНП порог отделения взят из обзора; между измеренными значениями pH поведение пар не определено. Увеличенные эндосомы, в которых измеряли pH, — модельная система.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как меняется метка мембраны при созревании эндосомы — [[https://fresll.github.io/molbio/seminar-1-route.html#conversion|МБ, семинар 1, шаг 16]]."],"conditions":"Podinovskaia et al., 2021: клетки HeLa, увеличенные эндосомы, флуоресцентный датчик pH. Pyzik et al., 2023: обзор. Brown, Goldstein, 1986; Dautry-Varsat et al., 1983 — см. БИО-3·19, 3·20.","sources":["Pyzik2023","Podinovskaia2021","Brown1986","DautryVarsat1983"],"quiz":{"id":"S3-L36","question":"У мутантного FcRn связывание с IgG не зависит от pH: прочное и при 7,4; путь возврата рецептора на поверхность сохранён. Что станет с IgG, захваченным клеткой?","options":[{"id":"S3-L36-1","text":"Он уйдёт в лизосому","correct":false,"feedback":"В модели в лизосому уходит несвязанный IgG; здесь связывание есть и в эндосоме."},{"id":"S3-L36-2","text":"Ничего не изменится","correct":false,"feedback":"Изменится: освобождение IgG на поверхности зависит от слабого связывания при pH 7,4."},{"id":"S3-L36-3","text":"Он будет возвращаться на поверхность, но там не освободится, а останется на рецепторе","correct":true,"feedback":"Освобождение IgG на поверхности обеспечивает потеря связывания при pH 7,4; без неё IgG остаётся связанным; это вывод из механизма."}]},"widget":{"kind":"ph3","zoomNarrow":true,"title":"","s":{"title":"Три пары «рецептор — лиганд» при разном pH","status":"Засечки 6,6 и 5,7 — pH эндосом, измеренный в клетках HeLa в отдельной работе; граница 6,5 для ЛПНП и диапазон pH 5–6 для IgG — обобщения; состояния пар — по работам, где они измерены; между засечками состояние не измерено","modes_label":"pH","modes":["7,4","6,6","5,7"],"x":[7.4,6.6,5.7],"L":{"pA":"А","pB":"Б","surf":"поверхность, pH 7,4","endo":"эндосома","lyso":"лизосома","na":"не измерено","ph":"pH","band":"IgG–FcRn: pH 5–6 (обобщение)","lane":{"ldl":"ЛПНП и рецептор ЛПНП","tf":"Трансферрин и его рецептор","igg":"IgG и FcRn"},"row":{"ldl":"ЛПНП","tf":"трансферрин","igg":"IgG"},"lgOn":"связаны","lgOff":"не связаны","lgNa":"не измерено"},"notes":["pH 7,4: ЛПНП и трансферрин с железом связаны с рецепторами, IgG с FcRn — нет.","pH 6,6: ЛПНП ещё связан (по обзору отделение ниже 6,5); для трансферрина и IgG состояние не измерено.","pH 5,7: ЛПНП отделён, IgG связан с FcRn; для трансферрина эта точка не измерена."]}},"num":36,"level":"adv"},{"id":"ldl-cycle","section":2,"questions":[3],"title":"Сколько раз рецептор ЛПНП проходит цикл и что нужно ему для захвата","keywords":["рецептор ЛПНП","холестерин","покрытая клатрином ямка","цикл рецептора"],"lead":["Рецептор липопротеинов низкой плотности (ЛПНП) — классический пример пути «рециркуляция рецептора, деградация лиганда»: ЛПНП расщепляется в лизосоме, а рецептор возвращается на поверхность (Brown, Goldstein, 1986).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Рецепторы ЛПНП собираются в покрытых клатрином ямках; ямки впячиваются за 3–5 мин после образования, клатриновая оболочка быстро снимается (Brown, Goldstein, 1986).","Эндосомы закисляются ниже pH 6,5 протонными насосами, и ЛПНП отделяется от рецептора; рецептор возвращается на поверхность.","ЛПНП попадает в лизосому: белок расщепляется до аминокислот, эфиры холестерина — кислой липазой; в клетке освобождается холестерин.","Каждый рецептор совершает один полный цикл примерно за 10 мин — независимо от того, связан ли он с ЛПНП."],"paragraphs":["Время жизни рецептора — около 20 ч; авторы пишут о нескольких сотнях циклов за это время. По расчёту из приведённых чисел получается порядка сотни циклов (20 ч по 10 мин — около 120); в любом случае одна молекула рецептора захватывает ЛПНП многократно.","Мутации цитоплазматического участка рецептора (впервые описаны у пациента, обозначенного в работах как J.D.) не мешают связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь клетки. Значит, для сбора в ямке нужен цитоплазматический участок рецептора; именно цитозольные участки рецепторов связывают адаптерные белки (вспомнить БИО-3·2).",{"h":"Метод"},"Культура фибробластов кожи человека, в том числе от пациентов с семейной гиперхолестеринемией. ЛПНП метили 125I и различали ЛПНП, связанный с поверхностью, ушедший в клетку и расщеплённый (по выходу 125I-монойодтирозина в среду). Контроль — фибробласты здоровых людей. Ограничение: числа цикла получены в культуре клеток. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.","Чего данные не доказывают. Обзор обобщает работы многих лет; механизм возврата рецептора из эндосомы в нём описан как модель, без молекул, которые этот возврат обеспечивают."],"conditions":"Brown, Goldstein, 1986 — обзор собственных работ авторов (Science, 1986). Числа — из неё; число циклов около 120 — расчёт по этим числам. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Brown1986"],"quiz":{"id":"S3-L20","question":"У рецептора ЛПНП изменён цитоплазматический участок; ЛПНП он связывает нормально. Что произойдёт с захватом ЛПНП?","options":[{"id":"S3-L20-1","text":"Рецептор перестанет связывать ЛПНП","correct":false,"feedback":"ЛПНП связывается наружным участком рецептора; изменён цитоплазматический."},{"id":"S3-L20-2","text":"Рецептор не соберётся в ямках, и ЛПНП останется на поверхности","correct":true,"feedback":"Мутации цитоплазматического участка не мешают связыванию, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь (Brown, Goldstein, 1986)."},{"id":"S3-L20-3","text":"Захват не изменится: ямки соберутся вокруг ЛПНП","correct":false,"feedback":"Ямка собирается через адаптеры, связывающие цитоплазматический участок рецептора; ЛПНП снаружи сбор в ямке не обеспечивает."}]},"widget":{"kind":"ldl","title":"","s":{"title":"Сравните нормальный и мутантный рецептор ЛПНП","status":"По Brown, Goldstein, 1986 · фибробласты человека","modes_label":"Рецептор","modes":["норма","изменён цитоплазматический участок"],"out":"внеклеточная среда","cyto":"цитоплазма","l_pit":"покрытая клатрином ямка","l_mut":"рецепторы с ЛПНП не собираются в ямке","m":["Связывание ЛПНП","Сбор в ямке","Цикл рецептора"],"v":[["есть","есть"],["есть","нет"],["около 10 мин","не идёт"]],"notes":["Рецепторы с ЛПНП собираются в покрытой клатрином ямке и уходят в клетку; цикл — около 10 мин.","Рецепторы связывают ЛПНП, но в ямке не собираются: ЛПНП остаётся на поверхности."],"static":["Норма: рецепторы с ЛПНП в покрытой клатрином ямке. Мутант по цитоплазматическому участку: ЛПНП связан, но рецепторы вне ямки."]}},"num":20,"level":"adv"},{"id":"pcsk9-dose","section":2,"questions":[3],"title":"Как белок PCSK9 сокращает число циклов рецептора ЛПНП","keywords":["рецептор ЛПНП","PCSK9","лизосома","ХС-ЛПНП","клиническое испытание"],"lead":["[[T69|PCSK9]] связывает [[T49|рецептор ЛПНП]] в печени и направляет его в лизосомы, мешая возврату на поверхность; на фоне [[T70|ингибитора]] PCSK9 холестерин ЛПНП (ХС-ЛПНП) в крови снижается: разность его изменения относительно плацебо растёт с дозой, а при 18 и 30 мг точечные оценки близки, но данных для вывода о плато недостаточно (по механизму, снижение — следствие сохранения рецепторов).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Рецептор ЛПНП совершает много циклов «эндоцитоз — возврат» (БИО-3·20); PCSK9 связывает рецепторы ЛПНП в печени и направляет их в лизосомы, мешая их возврату на поверхность клетки (Ballantyne et al., 2023). Поэтому у такого рецептора остаётся меньше циклов.","Пероральный ингибитор MK-0616 связывает PCSK9; за 8 недель разность изменений ХС-ЛПНП от исходного уровня (группа дозы минус плацебо) составила −41,2 процентного пункта (6 мг; 95 % ДИ −47,8…−34,7), −55,7 (12 мг; −62,3…−49,1), −59,1 (18 мг; −65,7…−52,5) и −60,9 (30 мг; −67,6…−54,3).","По механизму, снижение ХС-ЛПНП — следствие того, что на поверхности клеток печени остаётся больше рецепторов; число рецепторов у участников не измеряли."],"paragraphs":["Что уточняет этот шаг. Захват ЛПНП зависит не только от числа рецепторов, но и от того, сколько раз каждый рецептор возвращается. PCSK9 отключает возврат для связанных рецепторов. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.",{"h":"Метод"},"Рандомизированное двойное слепое испытание фазы 2b: 381 взрослый с гиперхолестеринемией, пять групп (плацебо и четыре дозы), 8 недель; показатель — процентное изменение ХС-ЛПНП от исходного уровня к 8-й неделе; сравнивают разность скорректированных средних (метод наименьших квадратов) между группой дозы и плацебо, в процентных пунктах.","Чего метод не доказывает. ХС-ЛПНП — суррогатный показатель; влияние на частоту сердечно-сосудистых событий за 8 недель оценить нельзя; механизм в клетках участников не измеряли."],"conditions":"Ballantyne et al., 2023: фаза 2b, 381 участник; MK-0616 6–30 мг один раз в день, 8 недель.","sources":["Ballantyne2023","Brown1986"],"quiz":{"id":"S3-L38","question":"Что именно измеряли в испытании ингибитора PCSK9, чтобы оценить его действие?","options":[{"id":"S3-L38-1","text":"Число рецепторов ЛПНП на клетках печени","correct":false,"feedback":"Рецепторы у участников не измеряли; их сохранение — вывод из механизма."},{"id":"S3-L38-2","text":"Разность изменений ХС-ЛПНП к 8-й неделе между группами","correct":true,"feedback":"Это суррогатный показатель: число рецепторов ЛПНП в печени и исходы болезни в этой работе не измеряли."},{"id":"S3-L38-3","text":"Частоту инфарктов за 8 недель","correct":false,"feedback":"За 8 недель исходы болезни оценить нельзя; оценивали ХС-ЛПНП и нежелательные явления."}]},"widget":{"kind":"pcsk9","zoomNarrow":true,"title":"","s":{"title":"Разность изменений ХС-ЛПНП при четырёх дозах ингибитора PCSK9 и плацебо","status":"Разность скорректированных средних (метод наименьших квадратов) процентных изменений ХС-ЛПНП от исходного уровня к 8-й неделе, группа дозы минус плацебо, в процентных пунктах, с 95 % ДИ; доля рецепторов на рисунке условная. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма","modes_label":"Доза в испытании, в день","modes":["0 мг","6 мг","12 мг","18 мг","30 мг"],"d":[0,6,12,18,30],"L":{"pA":"А","pB":"Б","blood":"кровь","cell":"клетка печени","endo":"ранняя эндосома","lyso":"лизосома","noInh":"ингибитора нет","cond":"доля рецепторов с PCSK9 — условно","yl":"Разность изменений ХС-ЛПНП, доза минус плацебо, п. п.","ciNote":"точка — оценка; отрезок — 95 % ДИ","placebo":"плацебо: 0","mg":"мг"},"notes":["Плацебо: нулевая линия сравнения; часть рецепторов ЛПНП после каждого цикла эндоцитоза расщепляется в лизосомах (схема механизма).","6 мг: разность −41,2 п. п. (95 % ДИ −47,8…−34,7).","12 мг: −55,7 п. п. (−62,3…−49,1).","18 мг: −59,1 п. п. (−65,7…−52,5).","30 мг: −60,9 п. п. (−67,6…−54,3); при 18 и 30 мг точечные оценки близки, но для вывода о плато данных недостаточно."]}},"num":38,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"rab-conversion","section":2,"questions":[3],"title":"Как ранняя эндосома становится поздней: смена Rab5 на Rab7","keywords":["Rab5","Rab7","созревание эндосомы","HOPS","ЛПНП"],"lead":["Ранняя эндосома не отпочковывает позднюю: на её мембране метка [[T29|Rab5]] быстро сменяется меткой Rab7, и эндосома становится поздней (Rink et al., 2005).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Ранние эндосомы с Rab5 сливаются друг с другом до двух раз в минуту; груз, предназначенный для расщепления (ЛПНП), собирается во всё меньшем числе всё более крупных эндосом (Rink et al., 2005).","Крупные эндосомы перемещаются от периферии к центру клетки, и там Rab5 на их мембране быстро сменяется Rab7.","Для смены нужен комплекс HOPS (англ. homotypic fusion and protein sorting; белки класса C VPS — англ. vacuolar protein sorting), который связывается с Rab5; авторы, опираясь на данные того времени, считали HOPS фактором обмена нуклеотидов для Rab7. При подавлении его субъединицы hVps39 увеличиваются и ранние, и поздние эндосомы, а смена Rab5 на Rab7 растягивается с минут до часов."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Ранняя эндосома созревает в позднюю, и метка Rab5 сменяется Rab7 (БИО-3·18). Эксперимент показывает, что созревание идёт сменой метки на той же мембране, а не переносом груза в новый компартмент.","ЛПНП в контроле покидал ранние эндосомы с полупериодом около 11 мин; при подавлении hVps39 он оставался в ранних эндосомах, несущих белок EEA1 (англ. early endosome antigen 1), до 4 ч.",{"h":"Метод"},"Живые клетки A431 (линия клеток эпидермоидной карциномы человека) с флуоресцентными Rab5 и Rab7; снимки каждые несколько секунд и алгоритмы, которые прослеживают отдельные эндосомы. Груз — флуоресцентный ЛПНП. Подавление hVps39 — малыми интерферирующими РНК в тех же клетках; белки, связывающие Rab5, в том числе HOPS, выделяли из цитозоля клеток HeLa на колонке с Rab5.","Контроль: клетки с контрольной РНК. Ограничение: избыточный синтез меченых Rab может менять их количество на мембране. Чего данные не доказывают: смена Rab показана для грузов, идущих на расщепление; для рецепторов, возвращающихся на поверхность, механизм выхода иной."],"conditions":"Rink et al., 2005: съёмка живых клеток A431; цитозоль для колонки с Rab5 — из клеток HeLa; полупериод выхода ЛПНП — 10,9 мин в контроле. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Rink2005"],"quiz":{"id":"S3-L21","question":"В клетках подавили hVps39 — субъединицу комплекса HOPS, нужного для смены Rab5 на Rab7. Что произойдёт с ЛПНП после эндоцитоза?","options":[{"id":"S3-L21-1","text":"ЛПНП сразу попадёт в лизосомы, минуя ранние эндосомы","correct":false,"feedback":"Без HOPS ранние эндосомы не превращаются в поздние, поэтому груз, наоборот, задерживается в ранних."},{"id":"S3-L21-2","text":"ЛПНП вернётся на поверхность вместе с рецептором","correct":false,"feedback":"ЛПНП отделяется от рецептора и задерживается в ранних эндосомах; на поверхность возвращается рецептор."},{"id":"S3-L21-3","text":"ЛПНП надолго задержится в ранних эндосомах","correct":true,"feedback":"Смена растягивается с минут до часов, и ЛПНП остаётся в EEA1-положительных эндосомах до 4 ч (Rink et al., 2005)."}]},"widget":{"kind":"rab","title":"","s":{"title":"Проследите смену метки на мембране эндосомы","status":"Схема по Rink et al., 2005 · клетки A431","modes_label":"Состояние","modes":["ранняя эндосома","смена метки","поздняя эндосома","подавлен hVps39"],"l_c":["Rab5","Rab5 → Rab7","Rab7","ранняя, крупная"],"l_c3b":"поздняя, крупная","l_axis0":"периферия клетки","l_axis1":"центр клетки","l_rab5":"Rab5","l_rab7":"Rab7","m":["Метка на мембране","Положение","Скорость смены"],"v":[["Rab5","Rab5 сменяется Rab7","Rab7","чаще раздельно; иногда обе метки"],["периферия","ближе к центру","центр","эндосомы увеличены"],["—","минуты","—","часы"]],"notes":["Ранние эндосомы с Rab5 сливаются друг с другом; груз собирается во всё более крупных эндосомах.","В центре клетки Rab5 на мембране быстро сменяется Rab7.","Та же эндосома с Rab7 — поздняя.","Без hVps39 смена растягивается до часов; ранние и поздние эндосомы крупнее; метки чаще раздельны, иногда встречаются эндосомы с обеими."],"static":["Rab5 (ранняя эндосома, периферия) → смена Rab5 на Rab7 → Rab7 (поздняя эндосома, центр); без hVps39 смена растягивается до часов."]}},"num":21,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"retrieval-signal","section":2,"questions":[3],"title":"Как мембранный белок избегает лизосомы: сигнал возврата и SNX27–ретромер","keywords":["SNX27","ретромер","VPS35","GLUT1","PDZ"],"lead":["GLUT1 постоянно попадает с поверхности в ранние эндосомы. Чтобы переносчик глюкозы оставался на поверхности, клетка должна вернуть его, а не направить на расщепление. Как эндосома узнаёт этот груз? Для GLUT1 нужен короткий концевой участок — PDZ-лиганд, который связывает PDZ-домен (белковый домен, названный по белкам PSD-95, Dlg и ZO-1), — и комплекс [[T30|SNX27–ретромер]]: сортирующий нексин 27 (SNX27) вместе с ретромером — комплексом белков, возвращающим мембранные белки из эндосом (Steinberg et al., 2013).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["SNX27 своим PDZ-доменом связывает концевой участок груза и одновременно — субъединицу ретромера VPS26 (VPS26 и VPS35 — субъединицы ретромера); это связывание необходимо и достаточно, чтобы груз не попал в лизосомы (Steinberg et al., 2013).","При подавлении SNX27 с поверхности клеток HeLa уходят 122 мембранных белка, при подавлении VPS35 — 152; 81 из них общий.","Без SNX27 или VPS35 GLUT1 оказывается в лизосомах и расщепляется быстрее; захват глюкозы снижается более чем на 60 %. GLUT1 без трёх концевых аминокислот уходит в лизосомы и в контрольных клетках."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а выбор пути зависит от сигналов сортировки (БИО-3·15). Эксперимент показывает один такой сигнал и белки, которые его узнают: без них белок уходит в лизосому, хотя сам не изменён.","При подавлении VPS35 рецептора трансферрина на поверхности было в 1,5 раза меньше (при подавлении SNX27 — без изменений), и он не расщеплялся быстрее: разные грузы возвращаются разными путями.",{"h":"Метод"},"Клетки HeLa и RPE1 (линия клеток пигментного эпителия сетчатки человека); SNX27 и VPS35 подавляли малыми интерферирующими РНК. Белки поверхности метили биотином и сравнивали количественной масс-спектрометрией с мечением белков аминокислотами, содержащими тяжёлые изотопы (SILAC); положение GLUT1 определяли иммунофлуоресценцией с маркером лизосом — белком мембраны лизосом LAMP1 (англ. lysosome-associated membrane protein 1); захват глюкозы — по меченой 2-дезоксиглюкозе.","Контроль: клетки с контрольной РНК; две разные РНК против каждого белка — против неспецифического действия. Чего данные не доказывают: как именно SNX27–ретромер не пускает груз в лизосомный путь, работа не устанавливает; сочетание подавления SNX27 и укороченного GLUT1 не изучали."],"conditions":"Steinberg et al., 2013: клетки HeLa и RPE1; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Steinberg2013"],"quiz":{"id":"S3-L22","question":"В обычных клетках синтезируется GLUT1 без трёх концевых аминокислот. Где он окажется?","options":[{"id":"S3-L22-1","text":"В лизосомах: без концевого участка его не узнаёт SNX27","correct":true,"feedback":"GLUT1 без PDZ-лиганда оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на мембране (Steinberg et al., 2013)."},{"id":"S3-L22-2","text":"На плазматической мембране, как полный GLUT1","correct":false,"feedback":"Концевой участок нужен для возврата из ранней эндосомы; без него белок уходит в лизосомы."},{"id":"S3-L22-3","text":"В ранних эндосомах, где он будет накапливаться","correct":false,"feedback":"Без сигнала возврата GLUT1 не задерживается в ранних эндосомах, а уходит в лизосомы."}]},"widget":{"kind":"glut","title":"","s":{"title":"Выключите SNX27–ретромер или сигнал на грузе","status":"Данные Steinberg et al., 2013 · клетки HeLa","modes_label":"Условия","modes":["контроль","подавлен SNX27","подавлен VPS35","GLUT1 без концевого участка"],"cfg":[["none",false],["snx27",false],["vps35",false],["none",true]],"out":"внеклеточная среда","cyto":"цитоплазма","l_ee":"ранняя эндосома","l_ly":"лизосома (LAMP1)","l_retro":"SNX27–ретромер","l_kd":{"snx27":"SNX27 подавлен","vps35":"VPS35 подавлен"},"l_pdz":"у GLUT1 нет концевого PDZ-лиганда","m":["GLUT1","Захват глюкозы"],"v":[["на мембране","в лизосомах","в лизосомах","в лизосомах"],["контроль","ниже более чем на 60 %","ниже более чем на 60 %","не измеряли"]],"notes":["SNX27–ретромер возвращает GLUT1 из ранней эндосомы на поверхность.","Без SNX27 GLUT1 уходит в лизосомы и расщепляется быстрее.","Без VPS35 GLUT1 уходит в лизосомы; с поверхности уходят и многие другие белки.","GLUT1 без PDZ-лиганда уходит в лизосомы и в контрольных клетках."],"static":["Контроль: GLUT1 на мембране. Без SNX27, без VPS35 или без концевого участка GLUT1 — в лизосомах."]}},"num":22,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"tail-address","section":2,"questions":[3],"title":"От чего зависит, каким комплексом рецептор вернётся из эндосомы","keywords":["SNX17","SNX27","ретривер","Commander","ESCPE-1","интегрин"],"lead":["Разные мембранные белки возвращаются из эндосомы разными белковыми комплексами, и путь определяет мотив в цитоплазматическом хвосте: концевой PDZ-связывающий мотив узнаёт SNX27, мотив NPxY — [[T54|SNX17]]; оба передают груз в общий трубчатый участок возврата эндосомы.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["FERM-домен SNX27 прямо связывает кислые мотивы белков SNX1 и SNX2 комплекса [[T56|ESCPE-1]], и груз, захваченный SNX27–ретромером, переходит в трубчатый носитель (Simonetti et al., 2022).","В свободном SNX17 C-концевой участок лежит в бороздке связывания груза; груз с мотивом NPxY вытесняет его, и освобождённый участок концевым мотивом связывает ретривер (Butkovič et al., 2024).","Ретривер вместе с комплексом CCC и белком DENND10 образует [[T55|Commander]] — комплекс из 16 субъединиц; мутации его генов вызывают синдром Ритшера–Шинцеля (Healy et al., 2023)."],"paragraphs":["Что уточняет этот шаг. Сигнал возврата — участок хвоста, который узнаёт белок на эндосоме (БИО-3·22, SNX27 и GLUT1). Сигналов по меньшей мере два, и каждому соответствует свой комплекс: SNX27–ретромер или SNX17–Commander. В экспериментах эти комплексы не заменяли друг друга.",{"h":"Метод"},"Взаимодействия проверяли на очищенных белках (калориметрия, осаждение на гранулах) и в клетках человека (в части экспериментов — с удалёнными генами); строение комплексов — криоэлектронной микроскопией и предсказанием структуры. Функциональный контроль: ретривер с заменой в участке связывания SNX17 собирается нормально, но интегрин α5β1 — груз с мотивом NPxY, как и LRP1, — в таких клетках уходит в лизосомы (Butkovič et al., 2024). В клетках без SNX27 интегрин α5 служил контролем возврата, не зависящего от SNX27 (Simonetti et al., 2022).","Чего метод не доказывает. Как делится груз с обоими мотивами и какая доля груза идёт каждым путём в обычной клетке, неизвестно.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как меняется метка мембраны при созревании эндосомы — [[https://fresll.github.io/molbio/seminar-1-route.html#conversion|МБ, семинар 1, шаг 16]]."],"conditions":"Butkovič et al., 2024: клетки HEK293T и RPE1, очищенные белки, предсказание структуры. Simonetti et al., 2022: клетки HeLa. Healy et al., 2023: криоэлектронная микроскопия.","sources":["Butkovic2024","Simonetti2022","Healy2023","Alberts2022"],"quiz":{"id":"S3-L37","question":"В SNX17 заменили аминокислоты C-концевого участка так, что он больше не ложится в бороздку связывания груза. Как изменится связывание груза LRP1?","options":[{"id":"S3-L37-1","text":"Усилится: бороздка свободна, и груз связывается легче","correct":true,"feedback":"Мутанты с ослабленным внутримолекулярным связыванием связывали LRP1, LRP2 и APP сильнее, чем обычный SNX17."},{"id":"S3-L37-2","text":"Ослабнет","correct":false,"feedback":"Ослабляют связывание груза замены в самой бороздке FERM-домена, а не в C-концевом участке."},{"id":"S3-L37-3","text":"Не изменится","correct":false,"feedback":"Изменится: C-концевой участок конкурирует с грузом за бороздку."}]},"widget":{"kind":"tail","zoomNarrow":true,"title":"","s":{"title":"Ранняя эндосома с участком возврата: исход по мотиву в хвосте груза","status":"Качественная схема по трём работам: исходы для SNX27, SNX17 и Commander — по экспериментам с удалением белков, для убиквитина — по MBoC7; доли груза и скорость не моделируются","modes_label":"Мотив в хвосте","modes":["PDZ-мотив","NPxY","убиквитин"],"motif":["pdz","npxy","ub"],"out":["rec","rec","ilv"],"L":{"pA":"А","pB":"Б","ret":"участок возврата: ESCPE-1, ретромер","cmd":"ретривер и CCC (Commander)","endo":"ранняя эндосома","cyto":"цитоплазма","surf":"на поверхность клетки","lyso":"в лизосому","oRec":"возврат через участок возврата","oLyso":"лизосома","oIlv":"внутрипросветный пузырёк → лизосома","note":"исход выбран по таблице экспериментов с удалением белков; доли груза не моделируются"},"notes":["PDZ-связывающий мотив: SNX27 узнаёт его и передаёт груз белкам ESCPE-1 трубчатого носителя.","NPxY: груз освобождает C-концевой участок SNX17, участок связывает ретривер, и груз передаётся в участок возврата.","Убиквитин (по MBoC7): груз включается во внутрипросветные пузырьки и уходит в лизосому."]}},"num":37,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"envelope-pore","section":3,"questions":[4],"title":"Как устроены ядерная оболочка и ядерная пора","keywords":["ядерная оболочка","ядерная пора","нуклеопорины","диффузия"],"lead":["[[T31|Ядерная оболочка]] — две мембраны; наружная продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами.","В каждой поре находится [[T32|комплекс ядерной поры]]: через него идёт транспорт белков, рибонуклеопротеинов и РНК между ядром и цитоплазмой. Это вопрос 18 коллоквиума."],"mechanism":["Комплекс ядерной поры построен примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; каркас комплекса имеет восьмикратную симметрию: восемь повторяющихся секторов между цитоплазматическим и нуклеоплазматическим кольцами.","Из цитоплазматического кольца в цитоплазму выступают восемь фибрилл; нуклеоплазматическое кольцо закрепляет ядерную корзину.","Ионы и небольшие молекулы (до ~5 кДа) проходят через каналы поры простой диффузией практически свободно; более крупные диффундируют тем медленнее, чем они больше. Резкой границы размера нет.","Белки с FG-повторами (повторами фенилаланин–глицин) создают в поре селективный барьер; крупные макромолекулы быстро проходят его только с транспортными рецепторами."],"paragraphs":["Через пору проходят потоки в обе стороны: мРНК и рибосомные субъединицы выходят в цитоплазму, а ядерные белки — гистоны, ламины — синтезируются в цитоплазме и поступают в ядро.","Вспомнить БИО-3·9: в цитоплазме груз переносят мембранные носители; ядерная пора — другой механизм, без пузырьков: груз проходит через водный канал белкового комплекса."],"conditions":"Схема упрощена: показаны две поры и разрез оболочки.","sources":["Alberts2022"],"quiz":{"id":"S3-L23","question":"Какие молекулы проходят через ядерную пору простой диффузией практически свободно?","options":[{"id":"S3-L23-1","text":"Любые белки, если они не крупнее определённого размера","correct":false,"feedback":"Резкой границы размера нет: крупные белки пассивно проходят пору очень медленно, быстро — только с транспортными рецепторами."},{"id":"S3-L23-2","text":"Ионы и небольшие молекулы примерно до 5 кДа","correct":true,"feedback":"Они проходят практически свободно; более крупные молекулы диффундируют тем медленнее, чем они больше."},{"id":"S3-L23-3","text":"Только молекулы с сигналом ядерной локализации","correct":false,"feedback":"Сигнал нужен для активного переноса крупных белков; малые молекулы проходят без сигнала."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Сравните малую молекулу и крупный белок без сигнала","status":"Схема качественная · не экспериментальные данные","modes_label":"Груз","modes":["малая молекула","крупный белок без сигнала"],"cfg":[["small","none"],["big","none"]],"m":["Как проходит пору","Где находится"],"v":[["простой диффузией","очень медленно"],["по обе стороны оболочки","в цитоплазме; в ядре не накапливается"]],"notes":["Малые молекулы проходят через каналы поры диффузией и распределяются по обе стороны оболочки.","Крупный белок без сигнала за время наблюдения в ядре не накапливается: пассивно он проходит пору очень медленно (насколько медленно — БИО-3·28)."],"static":["Малая молекула — по обе стороны оболочки; крупный белок без сигнала в ядре не накапливается."]}},"num":23},{"id":"nls-importin","section":3,"questions":[4],"title":"Как сигнал и транспортный рецептор переносят белок в ядро","keywords":["NLS","импортин","ядерная пора","ГТФ","NES","экспортин"],"lead":["Крупный белок попадает в ядро, если на нём есть доступный [[T33|сигнал ядерной локализации]] и в клетке есть [[T35|импортин]], который этот сигнал узнаёт; комплекс импортина с грузом проходит через комплекс ядерной поры."],"mechanism":["Белок с NLS связывается в цитоплазме с растворимым белком импортином.","Импортин с грузом проходит через пору, взаимодействуя с FG-нуклеопоринами.","Процесс энергозависим и идёт при участии ГТФ."],"paragraphs":["Сигнал сам по себе не переносит белок: его переносят транспортные рецепторы. Без импортина — или если NLS закрыт связанным белком цитоплазмы — белок с NLS остаётся в цитоплазме: крупный белок проходит пору пассивно очень медленно и в ядре не накапливается.",{"more":"Обратный путь — [[T34|последовательность ядерного экспорта]] (NES) и экспортин: белок с NES связывается в ядре с экспортином и выходит в цитоплазму, тоже при участии ГТФ. Без экспортина белок с NES остаётся в ядре. Импортин и экспортин, который переносит из ядра белки с NES, узнают разные сигналы: без этого экспортина белок с NLS по-прежнему узнаётся импортином. Транспортные рецепторы тоже возвращаются для нового цикла — в классическом импорте импортин-α выносит из ядра экспортин CAS, а импортин-β выходит в комплексе с Ran-ГТФ (БИО-3·29)."},"Адрес считывается рецептором, но сам по себе не гарантирует локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты.",{"more":"Необходимость и достаточность сигнала ядерной локализации показали на Т-антигене вируса SV40 (БИО-3·27)."},{"h":"Дальше в курсе «Молекулярная биология»"},"Иная система адресации — несколько путей импорта белков в митохондрию — [[https://fresll.github.io/molbio/seminar-9-route.html#import-routes|МБ, семинар 9, шаг 11]]."],"conditions":"Схема качественная: импортин показан одним белком.","sources":["Alberts2022"],"quiz":{"id":"S3-L24","question":"Два одинаково крупных белка с сигналом ядерной локализации; импортин в клетке есть, пора не повреждена. У первого белка NLS открыт, у второго закрыт связанным с ним белком цитоплазмы. Чем различается их судьба?","options":[{"id":"S3-L24-1","text":"Оба окажутся в ядре: сигнал есть у обоих, импортин есть","correct":false,"feedback":"Наличия сигнала и рецептора недостаточно: рецептор должен сигнал узнать."},{"id":"S3-L24-2","text":"Оба останутся в цитоплазме: крупные белки пору не проходят","correct":false,"feedback":"С импортином крупный белок с открытым NLS переносится через пору в ядро."},{"id":"S3-L24-3","text":"Первый импортин перенесёт в ядро, второй останется в цитоплазме: закрытый сигнал импортин не узнаёт","correct":true,"feedback":"Сигнал работает, только если его узнаёт транспортный рецептор; закрытый NLS импортину недоступен."}],"rev":2},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Уберите транспортный рецептор","status":"Схема качественная · не экспериментальные данные","modes_label":"Груз и рецептор","modes":["NLS + импортин","NLS, нет импортина","NLS закрыт связанным белком","выход из ядра (дополнительно): NES + экспортин","выход из ядра (дополнительно): NES, нет экспортина"],"cfg":[["nls","none"],["nls","imp"],["nls","mask"],["nes","none"],["nes","exp"]],"warn":["","нет импортина — NLS не узнаётся","NLS закрыт — импортин его не узнаёт","","нет экспортина — NES не узнаётся"],"m":["Перенос","Где белок"],"v":[["импорт","нет","нет","экспорт","нет"],["в ядре","в цитоплазме","в цитоплазме","в цитоплазме","в ядре"]],"notes":["Импортин узнаёт NLS и переносит белок в ядро.","Без импортина NLS не узнаётся: белок остаётся в цитоплазме.","Импортин есть, но NLS закрыт связанным белком: сигнал не узнаётся, белок остаётся в цитоплазме.","Экспортин узнаёт NES в ядре и переносит белок в цитоплазму.","Без экспортина белок с NES остаётся в ядре."],"static":["NLS + импортин → ядро; без импортина или при закрытом NLS белок остаётся в цитоплазме. Дополнительно: NES + экспортин → цитоплазма."]}},"num":24},{"id":"address-principle","section":3,"questions":[4],"title":"Сигналы сортировки: что задаёт адрес белка","keywords":["адрес","сигнал сортировки","рецептор","адаптер","путь по умолчанию"],"lead":["Место назначения белка зависит от [[T37|сигналов сортировки]], которые распознают транспортные и сортировочные белки. Такими сигналами могут быть участки аминокислотной цепи или модификации белка; распознавание сигнала включает груз в транспортный путь.","Адрес считывается рецептором, но сам по себе не гарантирует конечную локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты."],"mechanism":["Сигнал сортировки — участок аминокислотной цепи белка или его модификация: связанные с белком углеводы (например, маннозо-6-фосфат) или присоединённый убиквитин (на рецепторе он направляет его в лизосому).","Белки секреторного пути, у которых нет сигналов сортировки в другие компартменты, по умолчанию попадают в конститутивные секреторные везикулы транс-сети аппарата Гольджи.","В рецептор-опосредованном эндоцитозе лиганд узнаётся рецептором снаружи клетки, а в покрытую клатрином ямку рецептор попадает по своему цитоплазматическому участку, который связывают адаптерные белки.","Для переноса через ядерную пору в ядро сигнал — NLS; его узнаёт импортин."],"paragraphs":["Сигнал и груз — не одно и то же. Для отбора в ямку важен участок самого рецептора, а не лиганд.",{"more":"Например, мутации цитоплазматического участка рецептора ЛПНП не мешают ему связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках (БИО-3·20)."},"Сигналы сортировки работают и на других участках мембранной сети: сигнальная последовательность направляет растущий белок в ЭПР, маннозо-6-фосфат — гидролазы в лизосомы.",{"more":"Выход белков из ядра задаёт другой сигнал — последовательность ядерного экспорта (NES); её узнаёт экспортин (шаг «Как сигнал и транспортный рецептор переносят белок в ядро», раскрываемое дополнение)."}],"conditions":"Таблица обобщает примеры сигналов сортировки; схема качественная.","sources":["Alberts2022","Steinberg2013"],"quiz":{"id":"S3-L26","question":"По какому участку рецептор груза собирается в покрытой клатрином ямке?","options":[{"id":"S3-L26-1","text":"По связанному с ним лиганду","correct":false,"feedback":"Лиганд связывается с внеклеточной частью рецептора; в ямку рецептор попадает по своему участку со стороны цитоплазмы."},{"id":"S3-L26-2","text":"По своему цитоплазматическому участку, который связывают адаптерные белки","correct":true,"feedback":"Рецепторы груза концентрируются в ямке за счёт связывания их цитозольных участков с адаптерными белками."},{"id":"S3-L26-3","text":"По размеру: в ямку попадают самые крупные белки мембраны","correct":false,"feedback":"Отбор в ямку идёт по участку рецептора, который узнают адаптерные белки, а не по размеру."}]},"widget":{"kind":"addr","title":"","s":{"title":"Сравните сигналы сортировки","noarrows":true,"status":"Обобщение","modes_label":"Система","modes":["эндоцитоз","ядерный импорт","возврат GLUT1","ядерный экспорт (дополнительно)"],"h":["Сигнал","Что его узнаёт","Где находится сигнал"],"rows":[["участок рецептора\nгруза","адаптерные\nбелки","на рецепторе,\nсо стороны\nцитоплазмы"],["NLS","импортин","в цепи\nсамого белка"],["PDZ-лиганд","SNX27\n(с ретромером)","на конце\nцепи GLUT1"],["NES","экспортин","в цепи\nсамого белка"]],"foot":"в этих примерах сигнал — участок самого белка или его рецептора","notes":["Лиганд связывается с рецептором снаружи; цитоплазматический участок рецептора связывают адаптерные белки, и рецептор собирается в покрытой клатрином ямке.","Сигнал ядерной локализации узнаёт импортин.","Концевой участок GLUT1 узнаёт SNX27, связанный с ретромером.","Последовательность ядерного экспорта узнаёт экспортин в ядре."],"static":["Эндоцитоз: участок рецептора — адаптерные белки. Импорт в ядро: NLS — импортин. Дополнительно: выход из ядра — NES и экспортин."]}},"num":26},{"id":"ran-direction","section":3,"questions":[4],"title":"Чем задано направление переноса через пору","keywords":["Ran","Ran-ГТФ","Ran-ГДФ","направление","импорт","экспорт"],"lead":["Пора пропускает транспортные рецепторы в обе стороны. Направление переноса задаёт [[T36|градиент Ran]]: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме.","Импорт и экспорт идут при участии ГТФ; направление переноса задаёт распределение Ran-ГТФ и Ran-ГДФ между ядром и цитоплазмой.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Импортин связывает груз с NLS в цитоплазме, где Ran-ГТФ мало.","В ядре Ran-ГТФ связывается с импортином и освобождает груз — груз остаётся в ядре.","При экспорте Ran-ГТФ, наоборот, стабилизирует комплекс экспортина с грузом до выхода из ядра.","Гидролиз ГТФ не проталкивает груз через канал механически, а поддерживает различие состояний Ran по сторонам оболочки."],"paragraphs":["Отсюда следует: для импорта связывание сигнала импортином от Ran-ГТФ не зависит, а освобождение груза в ядре зависит: без Ran-ГТФ импортин связывает белок и проходит с ним пору, но груз не накапливается в ядре. Для экспорта Ran-ГТФ нужен уже для связывания груза экспортином: без него комплекс не образуется, и белок с NES остаётся в ядре.","Направленный перенос через пору устроен иначе, чем перенос в мембранных носителях: здесь нет оболочки и слияния мембран; груз связывается с транспортным рецептором по одну сторону оболочки и освобождается по другую.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как градиент Ran-ГТФ задаёт направление ядерного транспорта и как он поддерживается — [[https://fresll.github.io/molbio/seminar-1-route.html#ran-gradient|МБ, семинар 1, шаг 13]]."],"conditions":"На коллоквиуме достаточно знать, что импорт и экспорт идут при участии ГТФ; градиент Ran объясняет, откуда берётся направление переноса. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L25","question":"Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Что произойдёт с белком, несущим NLS?","options":[{"id":"S3-L25-1","text":"Импортин его свяжет, но белок не будет накапливаться в ядре","correct":true,"feedback":"Импортин связывает NLS и без Ran-ГТФ, а освобождение груза в ядре зависит от Ran-ГТФ."},{"id":"S3-L25-2","text":"Импортин его не свяжет","correct":false,"feedback":"Импортин связывает NLS в цитоплазме, где Ran-ГТФ мало и в норме; Ran-ГТФ нужен для освобождения груза в ядре."},{"id":"S3-L25-3","text":"Белок накопится в ядре быстрее обычного","correct":false,"feedback":"Без Ran-ГТФ в ядре груз не освобождается, и накопления в ядре нет."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Уберите Ran-ГТФ","ran":true,"l_gtp":"Ran-ГТФ","l_gdp":"Ran-ГДФ","status":"Схема качественная · не экспериментальные данные","modes_label":"Состояние","modes":["NLS: градиент есть","NLS: Ran-ГТФ нет","NES: градиент есть","NES: Ran-ГТФ нет"],"cfg":[["nls","none"],["nls","ran"],["nes","none"],["nes","ran"]],"warn":["","нет Ran-ГТФ — груз не освобождается в ядре","","нет Ran-ГТФ — экспортин не связывает груз"],"m":["Связывание груза рецептором","Где накапливается белок"],"v":[["есть","есть","есть","нет: комплекс не образуется"],["в ядре","нигде: по обе стороны","в цитоплазме","остаётся в ядре"]],"notes":["Ran-ГТФ в ядре освобождает груз от импортина — белок накапливается в ядре.","Импортин связывает белок, но без Ran-ГТФ в ядре груз не освобождается именно там.","Ran-ГТФ стабилизирует комплекс экспортина с грузом — белок выходит в цитоплазму.","Без Ran-ГТФ экспортин не образует комплекса с грузом, и белок остаётся в ядре."],"static":["С градиентом Ran: импорт в ядро и экспорт из ядра. Без Ran-ГТФ импортин связывает груз, но не освобождает его в ядре, а экспортин груз не связывает."]}},"num":25,"level":"adv"},{"id":"flux-balance","section":3,"questions":[4],"num":44,"title":"Почему белок копится в ядре, хотя пора пропускает вещества в обе стороны","keywords":["ядерная пора","импорт","экспорт","баланс потоков","Ran"],"lead":["Вспомнить: шаг «Как сигнал и транспортный рецептор переносят белок в ядро». Возможность пройти пору и итоговое распределение белка — разные вопросы.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Малая молекула проходит пору простой диффузией в обе стороны: концентрации выравниваются, накопления нет.","Крупный белок с NLS пассивно проходит пору очень медленно; импортин переносит его в ядро, и белок накапливается там против разницы концентраций.","У белка с NLS и NES идут два потока — импорт и экспорт; где он находится, задаёт соотношение их скоростей.","Изменение одного потока сдвигает распределение постепенно, а не мгновенно."],"paragraphs":["Пора пропускает и малые молекулы, и транспортные рецепторы с грузом в обоих направлениях. Распределение белка между ядром и цитоплазмой — результат продолжающихся потоков: если импорт быстрее экспорта, белка больше в ядре; если экспорт быстрее — в цитоплазме. Поэтому наличие NLS ещё не означает, что белок находится в ядре, а клетка может переместить белок, изменив скорость одного из потоков или закрыв сигнал.","Накопление в ядре против разницы концентраций требует энергии. Её дают превращения белка Ran: в ядре преобладает Ran-ГТФ, в цитоплазме — Ran-ГДФ (шаг «Чем задано направление переноса через пору»). Импортин связывает груз в цитоплазме и освобождает его в ядре, поэтому перенос идёт в одну сторону.",{"h":"Обратная задача"},"В ядре стало меньше [[T75|челночного белка]]. Объяснений два: ослаб импорт — или усилился экспорт. Новое распределение в обоих случаях сдвинуто в цитоплазму, и одно наблюдение их не различает. Различает вмешательство: выключить экспорт (или убрать NES) и проследить накопление в ядре. Если белок быстро накапливается — импорт в порядке, причина в экспорте; если медленно — ослаблен импорт.",{"h":"Как это узнали"},"Что соотношение импорта и экспорта задаёт место челночных белков, обобщено в учебниках по многим работам. Что пассивный перенос замедляется с размером белка постепенно, без резкого порога, измерили в живых дрожжах (шаг «Есть ли у ядерной поры порог размера»); числа для дрожжей нельзя переносить на клетки человека.",{"h":"Граница вывода"},"Модель не учитывает связывание белка с другими молекулами по обе стороны оболочки, которое тоже влияет на распределение, и не показывает, как клетка открывает и закрывает сигналы."],"conditions":"Качественная модель по Alberts et al., 2022 (гл. 12); скорости условные, не измерены.","sources":["Alberts2022","Timney2016"],"quiz":{"id":"S3-L44","question":"Белок несёт NLS и NES. Импорт работает, но экспорт усилили так, что он стал быстрее импорта. Где будет больше этого белка?","options":[{"id":"S3-L44-1","text":"В ядре: на белке есть NLS","correct":false,"feedback":"NLS обеспечивает импорт, но экспорт по условию быстрее."},{"id":"S3-L44-2","text":"В цитоплазме","correct":true,"feedback":"Итог задаёт соотношение скоростей: экспорт быстрее импорта."},{"id":"S3-L44-3","text":"Поровну: пора пропускает вещества в обе стороны","correct":false,"feedback":"Поровну белок распределился бы при равных скоростях импорта и экспорта."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Сравните грузы и транспортные потоки","status":"Схема качественная · не экспериментальные данные","modes_label":"Груз","modes":["малая молекула","белок с NLS","белок с закрытым NLS","белок с NES"],"cfg":[["small","none"],["nls","none"],["nls","mask"],["nes","none"]],"warn":["","","NLS закрыт — импортин его не узнаёт",""],"m":["Перенос","Где больше белка"],"v":[["диффузия в обе стороны","импорт","нет","экспорт"],["поровну","в ядре","в цитоплазме","в цитоплазме"]],"notes":["Малая молекула распределяется по обе стороны оболочки.","Импортин переносит белок в ядро, и белок накапливается там.","Импорта нет: белок остаётся в цитоплазме.","Экспортин выносит белок с NES из ядра."],"static":["Малая молекула — поровну; белок с NLS — в ядре; с закрытым NLS — в цитоплазме; с NES — в цитоплазме."]}},"level":"adv"},{"id":"soft-barrier","section":3,"questions":[4],"title":"Есть ли у ядерной поры порог размера","keywords":["пассивная диффузия","порог размера","GFP","дрожжи","FRAP"],"lead":["Часто говорят, что пора пропускает белки только до определённой массы. Измерения в живых клетках показали: резкого порога нет, пассивный проход постепенно замедляется с ростом массы (Timney et al., 2016).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В живых дрожжах Saccharomyces cerevisiae сравнивали белки от 27 до 67 кДа: флуоресцентный белок GFP с 0–6 доменами белка A по 7 кДа (Timney et al., 2016).","Характерная постоянная времени τ выравнивания между ядром и цитоплазмой у GFP (27 кДа) — 15 ± 1,4 с, у белка 67 кДа — 413 ± 92 с (± — 95%-й доверительный интервал); обе величины приведены к клетке со средними объёмами ядра и цитоплазмы и средним числом пор.","τ растёт примерно как масса в степени 3,8 (3,8 ± 1,0); подвижность белков в растворе при этом различается лишь в 1,6 раза, значит, замедление создаёт сама пора."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Молекулы до ~5 кДа проходят пору практически свободно, а более крупные — тем медленнее, чем они больше (БИО-3·23). Эксперимент даёт числа для белков 27–67 кДа и показывает, что это мягкий барьер, а не сито с жёсткой границей.","Значит, крупный белок без сигнала может постепенно пройти пору пассивно, но за минуты и без накопления по одну сторону оболочки; быстрый направленный перенос обеспечивают сигнал и транспортный рецептор.",{"h":"Метод"},"Фотообесцвечивание в живых клетках: флуоресценцию белка в цитоплазме гасят лазером и следят, как убывает флуоресценция ядра, пока меченые и обесцвеченные молекулы обмениваются через поры. Убыль экспоненциальная: за время τ разница между текущей и равновесной флуоресценцией уменьшается примерно в 2,7 раза, за τ·ln 2 — вдвое; τ — не время прохода одной молекулы через пору. Измерено около 236 клеток; форму молекул проверяли малоугловым рассеянием рентгеновских лучей.","Контроль: белки одинакового строения, различающиеся только числом доменов. Чего данные не доказывают: измерения сделаны на дрожжах; перенос чисел на клетки человека не проверен, а облегчённый транспорт с рецепторами эта работа не описывает."],"conditions":"Timney et al., 2016: живые дрожжи; белки 27–67 кДа; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Timney2016"],"quiz":{"id":"S3-L28","question":"Белок 67 кДа без сигнала ядерной локализации находится в цитоплазме дрожжевой клетки. Что покажет измерение?","options":[{"id":"S3-L28-1","text":"Он выравнивается между ядром и цитоплазмой за минуты","correct":true,"feedback":"Постоянная времени выравнивания — около 413 с: пассивный проход идёт, но медленно (Timney et al., 2016)."},{"id":"S3-L28-2","text":"Он не проходит пору совсем","correct":false,"feedback":"Резкого порога нет: белок 67 кДа проходит пору пассивно, хотя и медленно."},{"id":"S3-L28-3","text":"Он проходит так же быстро, как GFP (27 кДа)","correct":false,"feedback":"Постоянная времени различается примерно в 27 раз: 15 с и 413 с."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Сравните белки разной массы","status":"Данные Timney et al., 2016 · живые дрожжи","modes_label":"Масса белка","modes":["27 кДа","67 кДа"],"cfg":[["m27","none"],["m67","none"]],"m":["Постоянная времени выравнивания","Резкий порог"],"v":[["15 ± 1,4 с","413 ± 92 с"],["не обнаружен","не обнаружен"]],"notes":["GFP (27 кДа) распределяется по обе стороны оболочки за секунды.","Белок 67 кДа тоже проходит пору пассивно, но за минуты."],"static":["27 кДа — 15 с; 67 кДа — 413 с; резкого порога нет."]}},"num":28,"level":"adv"},{"id":"nls-proof","section":3,"questions":[4],"title":"Как доказали, что семи аминокислот достаточно для адреса в ядро","keywords":["NLS","SV40","Т-антиген","пируваткиназа","PKKKRKV"],"lead":["Сигнал ядерной локализации был впервые определён как короткая последовательность, которая и необходима, и достаточна для накопления белка в ядре (Kalderon et al., 1984).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Большой Т-антиген вируса SV40 накапливается в ядре; замена одного остатка — лизина 128 на треонин — нарушает это накопление, хотя стабильность белка заметно не меняется (Kalderon et al., 1984).","Участок вокруг лизина 128, присоединённый к N-концу цитоплазматического мутанта Т-антигена, возвращает его в ядро.","Участок вокруг лизина 128 (у пируваткиназы — остатки 119–135), присоединённый к β-галактозидазе бактерий и к пируваткиназе — крупному цитоплазматическому ферменту, — приводит к полному накоплению химерных белков в ядре; с треонином вместо лизина 128 участок не действует.","Укорочение участка показало: для накопления пируваткиназы в ядре достаточно остатков 126–132 — семи аминокислот Pro-Lys-Lys-Lys-Arg-Lys-Val (PKKKRKV). Авторы оговаривают, что в действие такого короткого сигнала могут вносить вклад соседние остатки, закодированные линкером."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Белки с NLS переносит импортин (БИО-3·24). Эксперимент показывает, что сам сигнал может быть очень коротким и работает и в составе химерного белка. Импортин тогда ещё не был известен: механизм узнавания сигнала описали позже.","Здесь удобно различить необходимость и достаточность. Необходимость: без лизина 128 Т-антиген в ядро не попадает. Достаточность: семь аминокислот переводят в ядро белок, который в норме там не бывает, — в клетке, где весь транспортный аппарат работает. Ни то, ни другое отдельно не доказывает, что сигнал — единственное условие: нужен ещё рецептор, который его узнаёт, а в других белках сигнал может быть недоступен.",{"h":"Метод"},"Плазмиды с генами мутантных и химерных белков вводили микроинъекцией в клетки Vero (линия клеток почки обезьяны); через 18 ч белки выявляли непрямой иммунофлуоресценцией и оценивали, где они находятся — в ядре или в цитоплазме.","Контроль: исходная пируваткиназа и химера с участком 119–135, в котором лизин 128 заменён треонином. Ограничение: оценка качественная, по микроскопии; ключевой лизин не единственный — замены соседних остатков ослабляли, но не отменяли накопление в ядре. Чего данные не доказывают: что сигнал ускоряет перенос в ядро. Авторы оценивали только накопление в ядре, и удержание белка в ядре этим экспериментом не исключено."],"conditions":"Kalderon et al., 1984: клетки Vero, микроинъекция плазмид, иммунофлуоресценция через 18 ч. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Kalderon1984"],"quiz":{"id":"S3-L27","question":"Что доказывает эксперимент, в котором пируваткиназа с присоединённым PKKKRKV накапливается в ядре?","options":[{"id":"S3-L27-1","text":"Что без этого сигнала никакой белок не попадёт в ядро","correct":false,"feedback":"Это утверждение о необходимости, и для всех белков оно из эксперимента не следует: у других ядерных белков бывают другие сигналы."},{"id":"S3-L27-2","text":"Что пируваткиназа в норме работает в ядре","correct":false,"feedback":"Пируваткиназа — цитоплазматический фермент; в ядро её перевёл присоединённый сигнал."},{"id":"S3-L27-3","text":"Что сигнала достаточно, чтобы направить в ядро цитоплазматический белок","correct":true,"feedback":"Цитоплазматический белок с семью аминокислотами сигнала оказывается в ядре — это достаточность добавления сигнала в клетке с работающим транспортным аппаратом (Kalderon et al., 1984)."}]},"widget":{"kind":"nuc","title":"","s":{"cyto":"цитоплазма","nuc":"ядро","l_npc":"комплексы ядерных пор в двойной ядерной оболочке","title":"Присоедините сигнал к цитоплазматическому белку","noimp":true,"status":"Данные Kalderon et al., 1984 · клетки Vero","modes_label":"Белок","modes":["Т-антиген","Т-антиген, Lys128 → Thr","пируваткиназа","пируваткиназа + PKKKRKV","пируваткиназа + участок 119–135 (Thr128)"],"cfg":[["nls","none"],["mut","none"],["big","none"],["nls","none"],["mut","none"]],"m":["Где белок","Что показывает"],"v":[["в ядре","в цитоплазме","в цитоплазме","в ядре","в цитоплазме"],["исходное состояние","необходимость сигнала","контроль","достаточность сигнала","контроль последовательности"]],"notes":["Т-антиген вируса SV40 накапливается в ядре.","Замена лизина 128 на треонин: белок остаётся в цитоплазме.","Пируваткиназа — цитоплазматический белок.","С семью аминокислотами PKKKRKV пируваткиназа накапливается в ядре.","Участок 119–135 с треонином вместо лизина 128 не действует."],"static":["Т-антиген — в ядре; с заменой Lys128 → Thr — в цитоплазме. Пируваткиназа — в цитоплазме; с PKKKRKV — в ядре; с участком 119–135 (Thr128) — в цитоплазме."]}},"num":27,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"npc-structure","section":3,"questions":[4],"title":"Что известно о строении ядерной поры сегодня","keywords":["нуклеопорины","FG-повторы","структура","Ran"],"lead":["Структурные исследования последних лет описали комплекс ядерной поры почти полностью: это один из крупнейших белковых комплексов клетки (Petrovic et al., 2026).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Комплекс построен примерно из 35 разных нуклеопоринов, представленных множеством копий, — всего около 1000 белковых субъединиц; масса у позвоночных — около 120 МДа (Petrovic et al., 2026).","Нуклеопорины образуют кольца из восьми одинаковых спиц, которые проходят через слившиеся наружную и внутреннюю ядерные мембраны.","Внутренне неупорядоченные участки с FG-повторами составляют около 40 % массы поры человека и заполняют центральный канал, создавая барьер.","Через одну пору проходит около 1000 макромолекул в секунду; каждая находится в канале около 10 мс."],"paragraphs":["Что уточняет этот обзор. Обычно называют около 30 различных нуклеопоринов (БИО-3·23); обзор 2026 г. — около 35. Числа близки.","Обзор подтверждает и схему направленного переноса (БИО-3·25): фактор обмена нуклеотидов для Ran находится на хроматине в ядре, белок, активирующий гидролиз ГТФ Ran, — в цитоплазме; поэтому Ran-ГТФ преобладает в ядре (Petrovic et al., 2026; вспомнить БИО-3·25). Обзор описывает и обратный путь самого импортина: в классическом импорте сигнал ядерной локализации связывает импортин-α вместе с импортином-β; в ядре Ran-ГТФ освобождает груз, импортин-β с Ran-ГТФ возвращается в цитоплазму, а импортин-α выносит из ядра другой экспортин — Cas — тоже вместе с Ran-ГТФ. Белки с NES выносит экспортин Crm1. Можно заключить, что без Cas импортин-α накапливался бы в ядре, и импорт остановился бы после того, как свободный импортин-α в цитоплазме закончится.","Раньше считали, что барьер поры ограничивает свободную диффузию макромолекул крупнее 40 кДа; более поздние работы показывают, что он влияет на скорость прохода молекул самых разных размеров (вспомнить БИО-3·28).",{"h":"Метод"},"Обзор описывает, как к почти атомным структурам целых пор пришли, объединив электронную микроскопию, биохимическую реконструкцию комплексов нуклеопоринов и интегративную структурную биологию: структуры отдельных нуклеопоринов встраивают в карты плотности поры, полученные криоэлектронной томографией клеток и выделенных ядерных оболочек (Petrovic et al., 2026). Контроль — сравнение карт пор разных организмов и проверка взаимодействий нуклеопоринов биохимически и в клетке. Ограничение: разрешение карт пор в клетке — около 2–5 нм, поэтому положение отдельных участков белков в них определяют, встраивая структуры, полученные другими методами. Чего данные не доказывают: как именно FG-барьер отбирает молекулы — это обсуждают отдельные модели."],"conditions":"Petrovic, Mobbs, Hoelz, 2026 — обзор. Числа — из него; масса указана для позвоночных. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Petrovic2026"],"quiz":{"id":"S3-L29","question":"Что заполняет центральный канал ядерной поры и создаёт её барьер?","options":[{"id":"S3-L29-1","text":"Липидный бислой, который пора проходит насквозь","correct":false,"feedback":"Мембраны ядерной оболочки в поре слиты и окружают комплекс снаружи; канал заполнен белковыми участками."},{"id":"S3-L29-2","text":"Внутренне неупорядоченные участки нуклеопоринов с FG-повторами","correct":true,"feedback":"Они составляют около 40 % массы поры человека и заполняют канал (Petrovic et al., 2026)."},{"id":"S3-L29-3","text":"Вода без белков, поэтому проходит всё, что меньше канала","correct":false,"feedback":"Канал заполнен FG-участками; именно поэтому крупные молекулы проходят медленно."}]},"widget":{"kind":"addr","title":"","s":{"title":"Числа, описывающие ядерную пору","noarrows":true,"status":"По обзору Petrovic et al., 2026","modes_label":"Что сравнить","modes":["состав","барьер","поток"],"h":["Показатель","Значение","Источник"],"rows":[["разных\nнуклеопоринов","около 35\n(обычно — около 30)","обзор 2026"],["доля FG-участков\nв массе поры","около 40 %","обзор 2026"],["макромолекул\nв секунду","около 1000\nна одну пору","обзор 2026"]],"foot":"сверх программы — на коллоквиуме и зачёте не требуется","notes":["Комплекс ядерной поры построен примерно из 35 разных нуклеопоринов, всего около 1000 субъединиц.","FG-участки составляют около 40 % массы поры человека и заполняют канал.","Через одну пору проходит около 1000 макромолекул в секунду; время пребывания в канале — около 10 мс."],"static":["Около 35 нуклеопоринов и 1000 субъединиц; FG-участки — около 40 % массы; около 1000 макромолекул в секунду через пору."]}},"num":29,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"pore-diameter","section":3,"questions":[4],"title":"Меняется ли диаметр ядерной поры","keywords":["комплекс ядерной поры","внутреннее кольцо","натяжение ядерной оболочки","комплекс LINC"],"lead":["Диаметр канала ядерной поры не постоянен: в клетках человека [[T58|внутреннее кольцо]] меняется примерно от 40 до 60 нм, и авторы обзора предлагают считать причиной натяжение ядерной оболочки; но даже суженная пора открыта и переносит молекулы.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Внутреннее кольцо встроено в мембрану поры и, как предполагают авторы обзора, испытывает натяжение оболочки прямо, поэтому оно самое податливое из колец; у клеток человека — примерно 40–60 нм, у делящихся дрожжей — 50–70 нм (Lusk et al., 2025).","Поры в клетках DLD-1 шире, чем в прежних моделях пор человека по выделенным (полуочищенным) оболочкам: канал около 57 нм против около 43 нм, объём канала больше примерно на 75 % (Schuller et al., 2021). Это сравнение разных выборок и способов подготовки; снятие натяжения при выделении оболочки — возможное объяснение.","Поры одного ядра различаются по диаметру; на плоской базальной поверхности ядра расширенных пор больше; вклад [[T61|комплексов LINC]] (они связывают ядерный скелет с цитоскелетом) — около 10 % возможного расширения (Lusk et al., 2025)."],"paragraphs":["Что уточняет этот шаг. Комплекс ядерной поры построен из примерно 30 видов нуклеопоринов (БИО-3·23). Его каркас не жёсткий: строение, определённое на выделенных оболочках, относится к суженной поре. Сужение — не закрытие: перенос продолжается.",{"h":"Метод"},"Криоэлектронная томография пор прямо в клетке и усреднение изображений многих пор; сравнение с порами выделенных ядерных оболочек и с клетками, у которых изменили осмолярность среды или истощили АТФ, — это разные выборки клеток, а не одни и те же клетки до и после воздействия.","Чего метод не доказывает. Влияет ли диаметр на скорость переноса белков в клетке, прямо не измерено; в искусственных нанопорах, выстланных [[T59|FG-нуклеопоринами]], избирательность снижалась при диаметре около 55 нм — это измерение в искусственной системе, а не в поре клетки. Сужение при истощении энергии и в гиперосмотической среде и более сильное ограничение диффузии показаны на делящихся дрожжах, а не на клетках человека.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как градиент Ran-ГТФ задаёт направление ядерного транспорта — [[https://fresll.github.io/molbio/seminar-1-route.html#ran-gradient|МБ, семинар 1, шаг 13]]."],"conditions":"Lusk et al., 2025: обзор данных криоэлектронной томографии и экспансионной микроскопии пор. Schuller et al., 2021: клетки рака толстой кишки человека DLD-1.","sources":["Lusk2025","Schuller2021"],"quiz":{"id":"S3-L39","question":"Какое кольцо каркаса ядерной поры, по данным обзора, сильнее всего меняет диаметр при изменении натяжения ядерной оболочки и почему?","options":[{"id":"S3-L39-1","text":"Цитоплазматическое: на него действуют силы цитоскелета","correct":false,"feedback":"Цитоплазматическое кольцо меняется меньше внутреннего."},{"id":"S3-L39-2","text":"Ни одно: каркас поры жёсткий","correct":false,"feedback":"Каркас не жёсткий: поры наблюдают в суженном и расширенном состояниях."},{"id":"S3-L39-3","text":"Внутреннее: оно встроено в мембрану поры и испытывает натяжение оболочки прямо","correct":true,"feedback":"Все три кольца могут сужаться и расширяться, но самое податливое — внутреннее."}]},"widget":{"kind":"porediam","zoomNarrow":true,"title":"","s":{"title":"Ядерная пора при разном диаметре внутреннего кольца","status":"Засечки — измеренные состояния (Lusk et al., 2025); капсид — масштабная метка (широкий конец около 60 нм)","modes_label":"Диаметр внутреннего кольца","modes":["≈ 40 нм","≈ 60 нм","≈ 70 нм"],"d":[40,60,70],"org":["hs","hs","sp"],"L":{"pA":"А","pB":"Б","cyto":"цитоплазма","nuc":"ядро","cap":"пунктир — капсид ВИЧ-1: широкий конец около 60 нм (масштабная метка)","ring":"цитоплазматическое кольцо","inring":"внутреннее кольцо в мембране поры","top":"вид сверху: восемь спиц","many":"","apical":"","basal":"","basket":"ядерная корзина","nm":"нм","s43":"","s57":"","rngLbl":"полоса — диапазон у клеток человека","rngLbl2":"полоса — диапазон у делящихся дрожжей","marks":[[40,"суженная"],[60,"средняя в клетке"],[70,"расширенная"]]},"notes":["≈ 40 нм — суженная пора: в выделенных оболочках и кольцевых ламеллах; сужение описано и в гиперосмотической среде, при истощении энергии (делящиеся дрожжи); канал открыт.","≈ 60 нм — средний диаметр пор в клетке человека; расширенные поры чаще на базальной поверхности ядра.","≈ 70 нм — расширенная пора у делящихся дрожжей (по обзору)."]}},"num":39,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"hiv-capsid","section":3,"questions":[4],"title":"Как капсид ВИЧ-1 проходит через ядерную пору","keywords":["капсид ВИЧ-1","комплекс ядерной поры","FG-повторы","макрофаги"],"lead":["Конусовидный [[T62|капсид]] вируса иммунодефицита человека (ВИЧ-1) с широким концом около 55–60 нм проходит через ядерную пору целым; в клетках SupT1-R5 он раскрывается в ядре, а в макрофагах человека капсиды в ядре выглядели целыми, и их прохождение связано с растрескиванием колец каркаса поры.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В клетках SupT1-R5 поры расширены до примерно 64 нм (такие же — и в незаражённых клетках) — на 4–9 нм шире широкого конца капсида (около 55–60 нм; конусы в цитоплазме 112 ± 12 × 53 ± 7 нм); целые капсиды найдены в канале пор, в ядре — раскрытые (Zila et al., 2021).","В ядре капсид раскрывается: его оболочка частично разрушается (остаются фрагменты и трубки), но не растворяется сразу на отдельные белки, и геном освобождается из остатков капсида (Zila et al., 2021).","В первичных макрофагах человека (внутреннее кольцо около 65 нм) цитоплазматическое кольцо треснуто у 4 из 9 пор с капсидом в канале против 12 из 259 пор без капсида и 0 из 112 в незаражённых клетках; капсиды с ядерной стороны выглядели целыми (Kreysing et al., 2025)."],"paragraphs":["Что уточняет этот шаг. Пора пропускает крупные частицы не только по размеру, но и по способности войти в сеть [[T59|FG-повторов]] (БИО-3·28). Собранные частицы капсидного белка ВИЧ-1 связывают FG-повторы и в бесклеточной системе входят в их сеть, как транспортный рецептор (Fu et al., 2024); в клетке прохождение капсида может деформировать каркас поры. По расчётам авторов работы о макрофагах, без FG-повторов капсид проходит через пору либо при расширении внутреннего кольца до примерно 70 нм, либо при растрескивании кольца; вклад FG-повторов не оценён. Как именно сочетаются эти механизмы, не решено.",{"h":"Метод"},"Корреляционная световая и электронная томография: капсиды находят по флуоресценции, затем снимают тот же участок криоэлектронной томографией; положение каждой из восьми субъединиц кольца поры находят сопоставлением с образцом.","Чего метод не доказывает. Наблюдение статичное: растрескивание как процесс не видели; событий мало; использованы неинфекционный вариант вируса и (у пор в SupT1-R5) вариант с заменой в капсиде; не доказано, что каждый найденный капсид привёл бы к заражению."],"conditions":"Zila et al., 2021: клетки SupT1-R5. Kreysing et al., 2025: первичные макрофаги человека. Fu et al., 2024: бесклеточные системы, собранные частицы капсидного белка.","sources":["Zila2021","Kreysing2025","Fu2024"],"quiz":{"id":"S3-L40","question":"В незаражённых макрофагах человека у скольких пор цитоплазматическое кольцо оказалось треснутым?","options":[{"id":"S3-L40-1","text":"Ни у одной из 112","correct":true,"feedback":"Растрескивание наблюдали только в заражённых клетках, чаще всего у пор с капсидом в канале."},{"id":"S3-L40-2","text":"Примерно у половины","correct":false,"feedback":"Так часто кольцо нарушено лишь у пор с капсидом в канале (4 из 9)."},{"id":"S3-L40-3","text":"Примерно у 5 %","correct":false,"feedback":"Около 5 % (12 из 259) — у пор без капсида в заражённых клетках; в незаражённых — 0 из 112."}]},"widget":{"kind":"hivcap","zoomNarrow":true,"title":"","s":{"title":"Капсид ВИЧ-1 в канале ядерной поры","status":"Размеры — измеренные (Zila et al., 2021; Kreysing et al., 2025); разность диаметров — расчёт; кадры — наблюдения на томограммах, а не прогноз прохождения","modes_label":"Клетки","modes":["SupT1-R5","макрофаги"],"mac":[0,1],"L":{"pA":"А","pB":"Б","cyto":"цитоплазма","nuc":"ядро","wide":"","crack":"кольцо поры может треснуть при прохождении капсида","env":"ядерная оболочка и пора","nm":"нм","m60":"≈ 60 — широкий конец капсида","m64":"≈ 64 — поры SupT1-R5","m65":"в макрофагах ≈ 65 — почти как в SupT1-R5","hint":"диаметр канала, нм","gap":"разность диаметров {g} нм"},"notes":["SupT1-R5: канал около 64 нм (и в заражённых, и в незаражённых клетках), на 4–9 нм шире широкого конца капсида; целые капсиды найдены в канале пор.","Макрофаги человека: канал около 65 нм; у 4 из 9 пор с капсидом в канале цитоплазматическое кольцо нарушено (у 12 из 259 без капсида, у 0 из 112 в незаражённых клетках); раскрытие капсида в ядре в этом кадре не показано."]}},"num":40,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"causal-chain","section":4,"questions":[1,2,3,4],"num":45,"title":"Груз оказался не там: как найти, где прервалась цепь","keywords":["адресация","метка","узнавание","обратная задача","причинная цепь"],"lead":["Четыре вопроса семинара сводятся к одной цепи: метка на грузе → узнавание → механизм переноса → подходящие условия. Если груз оказался не там, ищут звено, на котором цепь прервалась.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Есть ли на грузе метка и доступна ли она?","Есть ли рецептор, который эту метку узнаёт?","Работают ли все этапы переноса — от оболочки до слияния, от импорта до экспорта?","Подходят ли местные условия — кислотность эндосомы, возврат рецептора, соотношение потоков?"],"paragraphs":["Чтобы груз оказался в нужном месте, важны тип груза и способ захвата, выполнение каждого этапа доставки, условия сортировки и баланс встречных потоков. Если результат неожиданен, ищут не «неправильный белок», а этап, на котором прервалась причинная цепь.","Одинаковое наблюдение часто совместимо с несколькими объяснениями: впячиваний-кавеол меньше — они распластались или ушли внутрь; носители у мишени не сливаются — нет SNARE или они не восстанавливаются; рецепторов на поверхности меньше — нарушен возврат или ускорен уход; белка в ядре меньше — ослаб импорт или усилился экспорт. Каждый раз нужно назвать дополнительное наблюдени
