людение поддержит объяснение «кавеолы распластались», а не «ушли внутрь»?","options":[{"id":"S3-L41-1","text":"Клатриновые ямки при растяжении почти не изменились","correct":false,"feedback":"Это наблюдение говорит о клатриновых ямках, а не о том, куда делись кавеолы."},{"id":"S3-L41-2","text":"Потеря кавеол та же, когда отделение пузырьков остановлено","correct":true,"feedback":"Если кавеолы исчезают и без отделения пузырьков, они не ушли внутрь, а распластались."},{"id":"S3-L41-3","text":"Клетка при набухании увеличилась в объёме","correct":false,"feedback":"Набухание — причина растяжения; оно не различает два объяснения."}]},"widget":{"kind":"reserve","title":"","s":{"title":"Растяните мембрану клеток с кавеолами и без них","status":"Качественная схема · не измеренные значения","modes_label":"Клетки","modes":["с кавеолами","без кавеолина-1"],"load_kind":"stretch","load_label":"Нагрузка","loads":["покой","растяжение"],"out":"внеклеточная среда","cyto":"цитоплазма","m_cav":"Видимые кавеолы","m_force":"Натяжение мембраны","cav":[["много","меньше: часть распластана"],["нет","нет"]],"force":[["исходное","почти не меняется"],["исходное","растёт сильно"]],"notes":[["Кавеолы хранят запас мембраны во впячиваниях.","Видимых кавеол меньше: они распластались и отдали мембрану, а не ушли внутрь."],["Кавеол нет.","Запаса во впячиваниях нет: натяжение растёт сильно."]],"static":["С кавеолами: при растяжении часть кавеол распластывается, натяжение почти не меняется. Без кавеолина-1: натяжение растёт сильно."]}},"level":"adv"},{"id":"dynamin-k44a","section":0,"questions":[1],"title":"Как показали, на каком этапе нужен динамин","keywords":["динамин","K44A","ГТФ","трансферрин","HeLa"],"lead":["Мутантный динамин с нарушенными связыванием и гидролизом ГТФ позволил разделить этапы образования покрытой везикулы: ямка собирается и захватывает рецепторы без активного динамина, а сужение шейки и отделение — нет.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В клетках HeLa (линия клеток рака шейки матки человека) включали синтез динамина-1 человека с заменой K44A — лизина в положении 44 на аланин; у такого белка нарушены связывание и гидролиз ГТФ (Damke et al., 1994).","Ямки собирались, впячивались и собирали рецепторы трансферрина (в ямке их примерно в 20 раз больше на единицу площади, чем на остальной мембране, как и в контроле), но не сужались; впяченных ямок становилось примерно вдвое больше.","Захват трансферрина снижался более чем на 80 %, захват EGF (эпидермального фактора роста) — более чем на 60 %; захват жидкости и рециркуляция рецептора трансферрина не менялись."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Высвобождение покрытой везикулы из мембраны опосредует динамин (БИО-3·2). Эксперимент указывает, какой этап от него зависит: не сборка ямки и не захват рецепторов, а сужение шейки и отделение носителя; для этого динамину нужно связывать и гидролизовать ГТФ.",{"h":"Метод"},"Синтез мутантного белка включали, убирая из среды тетрациклин, и сравнивали клетки до и после включения. Захват трансферрина и EGF измеряли по недоступности меченного биотином лиганда для авидина, добавленного снаружи: лиганд, ушедший в суженную ямку или в отделившийся пузырёк, авидин уже не связывает. Строение ямок оценивали электронной микроскопией, захват жидкости — по пероксидазе хрена в среде.","Контроль: синтез динамина дикого типа в таком же количестве захват не менял. Значит, эффект связан с потерей способности связывать ГТФ, а не с избытком белка. Типичный артефакт метода: мутантный белок синтезировался в количестве, не менее чем в 50 раз превышающем собственный динамин клетки, и подавлял его работу.","Чего данные не доказывают. Мутантный белок подавляет и работу собственного динамина клетки, поэтому эксперимент показывает необходимость активного динамина для отделения носителя, но не механизм — сужает ли динамин шейку сам или вместе с другими белками. Вывод получен на одной линии клеток."],"conditions":"Damke et al., 1994: клетки HeLa; индуцируемый синтез динамина-1 человека дикого типа или K44A; захват трансферрина и EGF — начальная скорость перехода в суженные ямки и пузырьки; захват жидкости — пероксидаза хрена. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Damke1994"],"quiz":{"id":"S3-L04","question":"В клетках HeLa с мутантным динамином K44A меченый трансферрин связался с рецепторами. Что изменится по сравнению с контролем?","options":[{"id":"S3-L04-1","text":"Рецепторы концентрируются в ямках, как в контроле, но комплексы остаются на поверхности","correct":true,"feedback":"Концентрирование рецепторов в ямках не нарушено (примерно в 20 раз выше, чем на остальной мембране), но ямки не сужаются и не отделяются, поэтому комплексы остаются на поверхности клетки (Damke et al., 1994)."},{"id":"S3-L04-2","text":"Рецепторы перестают концентрироваться в ямках и рассеиваются по мембране","correct":false,"feedback":"Сборка ямок и концентрирование в них рецепторов от динамина не зависят: в клетках с K44A рецепторы в ямках собираются так же, как в контроле."},{"id":"S3-L04-3","text":"Комплексы, как в контроле, за минуты попадают в ранние эндосомы","correct":false,"feedback":"Чтобы попасть в эндосому, носитель должен отделиться от мембраны; без активного динамина захват трансферрина снижен более чем на 80 %."}]},"widget":{"kind":"dynamin","title":"","s":{"title":"Сравните контрольные клетки и клетки с мутантным динамином","status":"Данные Damke et al., 1994 · клетки HeLa","modes_label":"Клетки","modes":["контроль","динамин K44A"],"out":"внеклеточная среда","cyto":"цитоплазма","ring":"кольцо динамина","tube":"трубка, связанная с поверхностью","m_tfn":"Захват трансферрина","m_pits":"Впяченные ямки","m_fluid":"Захват жидкости","tfn":["контроль","ниже более чем на 80 %"],"pits":["контроль","примерно вдвое больше"],"fluid":["контроль","не изменён"],"notes":["Ямка сужается, динамин на шейке, покрытые везикулы отделяются.","Ямки впячены, но шейки не сужаются; носители не отделяются, часть мембраны вытянута в трубки."],"static":["Контроль: ямки сужаются и отделяются. Динамин K44A: ямки впячены, шейки не сужаются, захват трансферрина ниже более чем на 80 %, захват жидкости не изменён."]}},"num":4,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"coat-bending","section":0,"questions":[1],"title":"Когда плоская решётка клатрина начинает изгибаться","keywords":["клатрин","трискелион","кривизна","псевдовремя","микроскопия одиночных молекул"],"lead":["Клатриновая ямка не собирается сразу изогнутой и не сворачивается в самом конце: по трёхмерным изображениям 1798 структур (из них 1645 эндоцитозных ямок) около половины [[T39|решётки]] собирается на плоской мембране, а затем решётка изгибается — сначала быстро, потом всё медленнее.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В клетках меланомы человека SK-MEL-2 форму каждой ямки определили трёхмерной локализационной микроскопией одиночных молекул; ямки упорядочили по степени замкнутости, и порядковый номер ямки служил псевдовременем (Mund et al., 2023).","Самые ранние решётки уже содержали около половины конечной площади и были почти плоскими; затем кривизна росла: за первые 10 % псевдовремени радиус составлял около 134 нм, к 60 % — 83 нм; на последних 40 % кривизна почти не менялась.","Данные описывает модель, в которой скорость изгиба наибольшая в начале и падает по мере приближения к собственному радиусу решётки: 72 нм в SK-MEL-2, 85 нм в U2OS, около 89 нм в 3T3; доля площади до изгиба во всех трёх — около половины (0,45–0,52)."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Клатрин собирается в решётку и изгибает мембрану в ямку (БИО-3·2). Работа показывает, в каком порядке идут рост и изгиб: они перекрываются, но изгиб начинается не с первого [[T38|трискелиона]]. Два крайних предположения — «решётка сразу изогнута» и «вся решётка собирается плоской, а потом сворачивается» — с данными не согласуются.",{"h":"Метод"},"Клатрин помечали флуоресцентными антителами в фиксированных клетках; по координатам отдельных меток восстанавливали форму решётки как сферический колпачок с радиусом и углом замыкания. Разрешение — около 10 нм в плоскости мембраны и около 30 нм по глубине. Структуры с особенно высокой кривизной (8,5 % найденных) образовали отдельную группу и были исключены; среди структур, совпавших с адаптером AP2, в этой группе AP2 не нашли, поэтому их считают не эндоцитозными (возможно, это пузырьки из транс-сети Гольджи).","Чего метод не доказывает. Время в секундах не измерено: псевдовремя предполагает, что все ямки собираются одинаково, а доля ямок в данной форме пропорциональна длительности этой формы. Самые ранние этапы сборки либо очень коротки, либо частично ниже предела обнаружения. К тому же выводу — изгиб начинается до конца сборки — в живых клетках дрозофилы приводит отсутствие резкого уменьшения площади видимого снизу пятна, которое дало бы позднее сворачивание (Willy et al., 2021). Выводы двух работ о модели постоянной кривизны расходятся: Mund et al. считают, что их данные ей не соответствуют, Willy et al. склоняются к ней."],"conditions":"Mund et al., 2023: клетки SK-MEL-2 (1798 структур в 13 клетках, из них 1645 эндоцитозных), U2OS (241 ямка, 3 клетки), 3T3 (688 ямок, 7 клеток); фиксированные клетки; трёхмерная локализационная микроскопия одиночных молекул; время — псевдовремя.","sources":["Mund2023","Willy2021"],"quiz":{"id":"S3-L32","question":"На каком участке пути — от плоской решётки до почти замкнутой ямки — кривизна растёт быстрее всего?","options":[{"id":"S3-L32-1","text":"В конце, перед отделением","correct":false,"feedback":"В конце изгиб почти останавливается: радиус уже близок к собственному радиусу решётки."},{"id":"S3-L32-2","text":"В начале изгиба","correct":true,"feedback":"Скорость изгиба наибольшая, пока кривизна мала, и падает по мере приближения к собственному радиусу решётки; на последних 40 % псевдовремени кривизна почти не меняется."},{"id":"S3-L32-3","text":"Равномерно на всём пути","correct":false,"feedback":"Равномерный рост не описывает данные: изгиб быстрый в начале и медленный в конце."}]},"widget":{"kind":"coatbend","zoomNarrow":true,"title":"","s":{"title":"Кадр модели: решётка клатрина при разных углах замыкания","status":"Модель по данным одной работы на фиксированных клетках (SK-MEL-2): кривые — расчёт по параметрам авторов; измеренные значения вынесены отдельно, к оси угла они не привязаны","modes_label":"θ","modes":["0°","90°","180°"],"th":[0,90,180],"L":{"pA":"А","pB":"Б","out":"внеклеточная среда","cyto":"цитоплазма","lattice":"решётка клатрина","yR":"Радиус кривизны R, нм","yA":"Площадь, тыс. нм²","lgA":"решётка A","lgAp":"проекция Ap","measHead":"Измерено, угол не определён:","measAp":"Ap: около 31 и 13 тыс. нм²","noMeas":"","theta":"θ = {th}°, R = {r}","flat":"плоская","nm":"нм","m134":"134 нм — к 10 % псевдовремени","m87":"87 нм — медиана всех ямок","m83":"83 нм — к 60 % псевдовремени"},"notes":["Около половины решётки собрано на плоской мембране; радиус не определён (решётка плоская).","Полусфера: радиус около 91 нм, площадь решётки около 52,6 тыс. нм², проекция — около 26,3 тыс. нм².","Ямка почти замкнута: радиус около 74 нм — немного больше собственного радиуса решётки (72 нм)."]}},"num":32,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"pit-fate","section":0,"questions":[1],"title":"Почему не каждая клатриновая ямка становится носителем","keywords":["Eps15","белки начала сборки","оборвавшиеся ямки","застрявшие ямки","оптогенетика"],"lead":["Часть начатых клатриновых ямок обрывается, часть застревает на мембране; доля этих исходов зависит от прочности сети белков, собирающихся до клатрина, и наилучший результат дают не самые прочные связи, а средние.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В клетках SUM159 без собственного Eps15 оборвавшихся ямок (короче 20 с) 41 %, а при синтезе Eps15 с меткой — 22 % (Day et al., 2021).","Eps15, у которого собственный участок сцепления молекул заменён светочувствительным модулем [[T63|Cry2]], без света работает плохо (37 %), а слабый синий свет, усиливающий сцепление его молекул, возвращает долю к 23 %.","Сильный свет даёт 20 % оборвавшихся, но застрявших ямок (дольше 180 с) становится 22 % против 4 % в контроле: слишком прочная сеть теряет подвижность."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Сборку ямки начинают [[T40|белки, собирающиеся до клатрина]] и удерживающие адаптеры. В пробирке они образуют жидкоподобные капли; в клетке о подвижности сети судят по восстановлению флуоресценции после обесцвечивания: слабая сеть распадается, прочная застывает. Поэтому «больше сборочного белка — лучше» неверно: для созревания ямки сеть должна быть и прочной, и подвижной.",{"h":"Метод"},"Жизнь каждой ямки записывали микроскопией полного внутреннего отражения по флуоресцентной метке адаптера AP2: от появления пятна до его исчезновения. Ямки делили по времени жизни: короче 20 с (вероятно оборвавшиеся), 20–180 с, дольше 180 с. Контроль: свет той же мощности в клетках без модуля Cry2 динамику ямок не менял; у продуктивных ямок в конце — максимум динамина 2, у застрявших повторных максимумов почти нет.","Чего метод не доказывает. Границы 20 и 180 с условны; «оборвавшиеся» — предположение авторов о структурах короче 20 с, а часть «застрявших» может отделиться позже. Влияние прочности сети на исходы показано вмешательством — изменением освещения, — но в искусственной оптогенетической системе; что сеть в клетке именно «жидкая», выведено по экспериментам с каплями вне клетки; в тканях это не проверяли."],"conditions":"Day et al., 2021: клетки SUM159 с меченым AP2 и удалённым Eps15; Eps15-Cry2; синий свет 0, 10, 50 мкВт; 37 °C; запись 11 мин.","sources":["Day2021"],"quiz":{"id":"S3-L33","question":"В клетках без Eps15 оборвавшихся ямок 41 %. Что произойдёт, если вместо Eps15 синтезировать Eps15-Cry2 и не включать свет?","options":[{"id":"S3-L33-1","text":"Доля вернётся к уровню контроля (22 %)","correct":false,"feedback":"Долю возвращал свет (23 % при 10 мкВт, 20 % при 50 мкВт), а не темнота."},{"id":"S3-L33-2","text":"Почти все ямки застрянут","correct":false,"feedback":"Рост доли застрявших наблюдали при сильном свете (50 мкВт), а не без света."},{"id":"S3-L33-3","text":"Доля почти не изменится (37 %): без света модуль Cry2 не усиливает сцепление","correct":true,"feedback":"Без света Eps15-Cry2 восстанавливает сборку плохо; долю к уровню контроля возвращает лишь слабый свет."}]},"widget":{"kind":"pitfate","zoomNarrow":true,"title":"","s":{"title":"Доли исходов ямок в пяти измеренных положениях","status":"Доли — по данным одной работы (Day et al., 2021); поток ямок на рисунке условный; границы 20 и 180 с — принятые в литературе","modes_label":"Белки-инициаторы сборки","modes":["контроль","нет Eps15","Cry2 без света","свет 10 мкВт","свет 50 мкВт"],"ab":[22,41,37,23,20],"st":[4,null,null,null,22],"L":{"pA":"А","pB":"Б","below":"вид снизу на участок мембраны (площадь условная)","zoom":"увеличенная ямка в разрезе","cond":"условно","stuckNote":"при слишком прочной сети ямка остаётся на мембране дольше 3 мин","out":"внеклеточная среда","cyto":"цитоплазма","yShare":"Доля ямок, %","binAb":"короче 20 с","binPr":"20–180 с","binSt":"дольше 180 с","na":"в тексте статьи не приведено","t20":"20 с","t180":"180 с","posT":"Белки-инициаторы сборки:","lgAb":"оборвалась","lgPr":"отделилась (вспышка динамина)","lgSt":"застряла"},"pos":["Eps15 с меткой (контроль)","Eps15 нет","Eps15-Cry2, без света","Eps15-Cry2, свет 10 мкВт","Eps15-Cry2, свет 50 мкВт"],"notes":["Контроль: оборвались 22 %, застряли 4 %, продуктивных 74 % (расчёт: 100 − 22 − 4).","Без Eps15 оборвавшихся 41 %; доля застрявших в тексте статьи не приведена.","Eps15-Cry2 без света: оборвавшихся 37 %.","Слабый свет: оборвавшихся 23 % — как в контроле.","Сильный свет: оборвавшихся 20 %, застрявших 22 % (в 5 раз больше контроля), продуктивных 58 % (расчёт: 100 − 20 − 22)."]}},"num":33,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"caveolae-muscle","section":0,"questions":[1],"title":"Почему мутации кавеолина-3 поражают прежде всего мышцы","keywords":["кавеолин-3","CAV3","мышечная дистрофия","сарколемма","механика"],"lead":["Кавеолин-3 входит в состав кавеол волокон скелетных мышц, которые постоянно растягиваются; мутации CAV3 нарушают образование кавеол, и мембрана мышечного волокна становится хрупкой.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Кавеолы — впячивания 50–100 нм из кавеолинов (Cav1–Cav3) и кавинов; Cav3 характерен для скелетной мышцы (Lamaze et al., 2026).","Мутантный Cav3 задерживается в аппарате Гольджи, кавеолы в сарколемме не образуются, её устойчивость к растяжению снижается.","Мутации гена CAV3, кодирующего кавеолин-3, вызывают поясно-конечностную мышечную дистрофию 1C и болезнь «волнообразных мышц»."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Обзор подытоживает: роль кавеол в избирательном эндоцитозе сейчас считают второстепенной по сравнению с их механическими функциями — резервом мембраны и передачей сигнала при растяжении (Lamaze et al., 2026). Кавеол особенно много в мышцах, эндотелии и жировых клетках — тканях, которые постоянно растягиваются, — что согласуется с ролью резерва мембраны.","Кавеолин-3 синтезируется в скелетной мышце. При сокращении и растяжении волокна запас мембраны в кавеолах гасит скачки натяжения. Без кавеол каждое растяжение сильнее нагружает сарколемму — плазматическую мембрану мышечного волокна.",{"h":"Метод"},"Обзор объединяет разные методы: электронную микроскопию и микроскопию сверхвысокого разрешения (строение кавеол), криоэлектронную микроскопию олигомеров кавеолина, измерение натяжения мембраны и генетику больных. Натяжение, при котором кавеолы распластываются (около 0,1 мН/м), получено расчётом по физической модели мембраны, а не прямым измерением. Контроль в таких работах — клетки или волокна того же типа без мутации. Ограничение: обзор сводит данные разных моделей — клеток в культуре, мышей и больных, — и числа, полученные в одной модели, нельзя переносить на другую.","Чего данные не доказывают. Цепочка «нет кавеол — хрупкая мембрана — дистрофия» согласуется с экспериментами на клетках, но поражение мышцы у конкретного больного зависит и от других белков сарколеммы. Медицинский пример иллюстрирует механизм и не является клиническим описанием."],"conditions":"Lamaze, Blouin, Sens, 2026 — обзор. Оценка критического натяжения — расчёт по модели. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Lamaze2026"],"quiz":{"id":"S3-L08","question":"В мышечных волокнах мутантный кавеолин-3 задерживается в аппарате Гольджи. Что вероятнее всего произойдёт при повторяющемся растяжении волокна?","options":[{"id":"S3-L08-1","text":"Клатриновые ямки распластаются и заменят кавеолы","correct":false,"feedback":"Клатриновые ямки — места образования носителей эндоцитоза; роль резерва мембраны обзор отводит кавеолам (Lamaze et al., 2026; данные о ямках при набухании клетки — вспомнить БИО-3·7)."},{"id":"S3-L08-2","text":"Сарколемма будет чаще повреждаться: запаса мембраны в кавеолах нет","correct":true,"feedback":"Без кавеол растяжение не гасится распластыванием впячиваний, и мембрана повреждается чаще (Lamaze et al., 2026)."},{"id":"S3-L08-3","text":"Ничего не изменится: кавеолы нужны только для захвата грузов","correct":false,"feedback":"Главная функция кавеол — механическая; без них мембрана хуже переносит растяжение."}]},"widget":{"kind":"reserve","title":"","s":{"title":"Растяните мышечное волокно","status":"Качественная схема по Lamaze et al., 2026 · не экспериментальные данные","modes_label":"Кавеолин-3","modes":["норма","мутантный (в аппарате Гольджи)"],"load_kind":"stretch","load_label":"Нагрузка","loads":["покой","растяжение"],"out":"внеклеточная среда","cyto":"цитоплазма волокна","m_cav":"Кавеолы в сарколемме","m_force":"Нагрузка на мембрану","cav":[["много","распластываются"],["нет","нет"]],"force":[["обычная","погашена кавеолами"],["обычная","высокая: мембрана повреждается"]],"notes":[["Кавеолы в сарколемме хранят запас мембраны.","При растяжении кавеолы распластываются и гасят нагрузку."],["Кавеол в сарколемме нет.","Растяжение не гасится — сарколемма повреждается чаще."]],"static":["Норма: при растяжении кавеолы распластываются. Мутантный кавеолин-3: кавеол нет, сарколемма повреждается чаще."]}},"num":8,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"carrier-cycle","section":1,"questions":[2],"title":"Из каких этапов состоит цикл транспортного носителя","keywords":["носитель","оболочка","COP-II","COP-I","клатрин","SNARE"],"lead":["[[T13|Транспортный носитель]] переносит груз между мембранами: он образуется почкованием от мембраны одного компартмента и сливается с мембраной другого.","Цикл носителя удобно разделить на этапы: сборка оболочки и отбор груза, отделение, разборка оболочки, узнавание мишени и слияние. Это продолжение вопроса 8 коллоквиума."],"mechanism":["Белки [[T14|оболочки]] собираются на мембране-доноре, отбирают груз и изгибают мембрану.","Носитель отделяется от донора; на плазматической мембране отделение покрытой клатрином везикулы опосредует динамин.","Носитель теряет оболочку.","[[T18|Rab-белки и удерживающие белки]] обеспечивают первичное узнавание мишени.","[[T17|SNARE-белки]] носителя и мишени собираются в комплекс, и мембраны сливаются."],"paragraphs":["Оболочки разных участков мембранной сети различаются. [[T15|COP-II]] образует носители, которые переносят только что синтезированные белки из грЭПР в цис-сеть аппарата Гольджи; [[T16|COP-I]] — носители обратного транспорта из аппарата Гольджи в грЭПР и между его цистернами; клатрин с адаптерами — носители от плазматической мембраны и от транс-сети аппарата Гольджи.","Оболочка выполняет две функции: связывает груз (у клатрина — через адаптеры, связывающие цитоплазматические участки рецепторов груза) и придаёт мембране кривизну. Поэтому без оболочки нет ни отбора груза, ни самого носителя.","SNARE-белки называют по мембране, на которой они находятся: v-SNARE — на носителе, t-SNARE — на мембране-мишени. Есть и другие названия — R- и Q-SNARE, по остатку аргинина или глутамина в центре комплекса.",{"more":"Это две разные классификации, а не старое и новое название одних и тех же белков; у носителя из ЭПР есть и R-, и Q-SNARE (БИО-3·12)."},"Таким образом, схема цикла на всех маршрутах одна и та же, а различается набор белков — какая оболочка образует носитель на этом участке и по каким белкам носитель узнаёт мишень. Белки оболочки (например, COP-II на участке от ЭПР к аппарату Гольджи) обеспечивают отбор груза и образование носителя; к плазматической мембране секреторные везикулы перемещаются по микротрубочкам с помощью моторных белков.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как носитель движется от донора к мишени по микротрубочкам и актиновым филаментам с помощью моторных белков — [[https://fresll.github.io/molbio/seminar-2-route.html#tracks|МБ, семинар 2, шаг 1]]; как моторный белок связывается со своим грузом через адаптер — [[https://fresll.github.io/molbio/seminar-2-route.html#adaptors|МБ, семинар 2, шаг 3]]."],"conditions":"Схема качественная: показан один носитель на каждом этапе.","sources":["Alberts2022"],"quiz":{"id":"S3-L09","question":"Какая оболочка образует носитель, который переносит белки из транс-сети аппарата Гольджи в эндосому?","options":[{"id":"S3-L09-1","text":"COP-I","correct":false,"feedback":"COP-I обеспечивает ретроградный транспорт: из аппарата Гольджи в грЭПР и между цистернами аппарата Гольджи."},{"id":"S3-L09-2","text":"COP-II","correct":false,"feedback":"COP-II образует носители в прямом направлении — на выходе из грЭПР в аппарат Гольджи."},{"id":"S3-L09-3","text":"Клатрин","correct":true,"feedback":"Белки, предназначенные для лизосом, покидают транс-сеть аппарата Гольджи в покрытых клатрином везикулах; клатрин образует носители на плазматической мембране и в транс-сети аппарата Гольджи."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Выберите участок сети и сравните оболочки носителей","status":"Схема качественная · не экспериментальные данные","modes_label":"Участок","modes":["ЭПР → аппарат Гольджи","между цистернами аппарата Гольджи","транс-сеть Гольджи → эндосома"],"cfg":[["erg","none"],["intra","none"],["tgn","none"]],"names":{"erg":["грЭПР","аппарат Гольджи"],"gerr":["аппарат Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Оболочка","Груз","Направление"],"v":[["COP-II","COP-I","клатрин"],["белки из грЭПР","мембранные ферменты-резиденты","мембранные белки лизосом"],["прямой транспорт","обратный транспорт","прямой транспорт"]],"notes":["Носитель с оболочкой COP-II отделяется от грЭПР, теряет оболочку и сливается с цис-сетью аппарата Гольджи.","Носитель с оболочкой COP-I возвращает мембранные ферменты-резиденты (например, гликозилтрансферазы) из более поздней цистерны аппарата Гольджи в более раннюю.","Покрытая клатрином везикула с мембранными белками лизосом отделяется от транс-сети аппарата Гольджи, теряет оболочку и сливается с эндосомой."],"static":["Этапы цикла на всех участках одинаковы; различаются белки оболочки: COP-II — на выходе из грЭПР, COP-I — в обратном транспорте между цистернами аппарата Гольджи, клатрин — в транс-сети аппарата Гольджи."]}},"num":9},{"id":"uncoating","section":1,"questions":[2],"title":"Почему носитель должен потерять оболочку до слияния","keywords":["разборка оболочки","клатрин","слияние","ранняя эндосома"],"lead":["Оболочка нужна, чтобы отобрать груз и изогнуть мембрану, но после отделения носителя она мешала бы его взаимодействию с мишенью.","Поэтому разборка оболочки — отдельный обязательный этап цикла: клатриновая оболочка разбирается, и только после этого везикула может слиться с мембраной-мишенью."],"mechanism":["Покрытая клатрином везикула отделяется от плазматической мембраны.","Клатриновая оболочка сбрасывается; её компоненты возвращаются в цитоплазму для нового цикла.","Неокаймлённый носитель сливается с [[T19|ранней эндосомой]], используя Rab- и SNARE-системы."],"paragraphs":["Носители других маршрутов тоже сбрасывают значительную часть оболочки до слияния с мишенью. Белки оболочки при этом не расходуются: они возвращаются в цитоплазму и собираются на мембране-доноре снова.","Если же оболочка не снимается, носитель уже отделился и несёт груз, но с мишенью не сливается; покрытые носители накапливаются в цитоплазме, а груз в мишень не поступает.","Именно так ведёт себя модель практикума вопроса 2, если убрать разборка оболочки (вкладка «Цикл носителя»). Вспомнить БИО-3·2: оболочка собирается вокруг рецепторов с грузом через адаптеры."],"conditions":"Белки, разбирающие оболочку, в шаге не обсуждаются. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L10","question":"Покрытая клатрином везикула отделилась, но оболочка с неё не снимается. Где окажутся рецепторы с лигандом?","options":[{"id":"S3-L10-1","text":"В покрытых везикулах в цитоплазме","correct":true,"feedback":"Оболочка сбрасывается, позволяя везикуле слиться с целевой мембраной; без этого везикулы остаются в цитоплазме, и груз в раннюю эндосому не попадает."},{"id":"S3-L10-2","text":"В ранней эндосоме: оболочка разберётся при слиянии","correct":false,"feedback":"Разборка оболочки предшествует слиянию: покрытый носитель с мишенью не сливается."},{"id":"S3-L10-3","text":"На поверхности клетки, в неотделившихся ямках","correct":false,"feedback":"Отделение везикулы обеспечивает динамин, и в этой ситуации оно не нарушено: нарушен следующий этап."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Сравните нормальный цикл и цикл без разборки оболочки","status":"Схема качественная · не экспериментальные данные","modes_label":"Состояние","modes":["норма","оболочка не снимается"],"cfg":[["pme","none"],["pme","uncoat"]],"names":{"erg":["грЭПР","аппарат Гольджи"],"gerr":["аппарат Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Носители","Оболочка","Груз в ранней эндосоме"],"v":[["сливаются с эндосомой","в цитоплазме"],["снята","сохраняется"],["есть","нет"]],"notes":["Везикула отделилась, сбросила клатриновую оболочку и слилась с ранней эндосомой; груз в эндосоме.","Везикулы отделились, но остаются покрытыми клатрином и с ранней эндосомой не сливаются; груз остаётся в них."],"static":["Норма: оболочка разбирается, везикула сливается с ранней эндосомой. Без разборки оболочки покрытые везикулы накапливаются в цитоплазме."]}},"num":10},{"id":"docking-fusion","section":1,"questions":[2],"title":"Как носитель узнаёт мишень и сливается с ней","keywords":["Rab","удерживающие белки","белки первоначального узнавания и удержания","tethering","SNARE","слияние","мишень"],"lead":["Прежде чем слиться с мишенью, носитель должен её узнать. Это делают в два этапа разные белки: Rab-белки и белки первоначального узнавания и удержания носителя (удерживающие белки) задерживают подходящий носитель у мембраны, а SNARE-белки сближают мембраны до слияния.","Слияние обеспечивает взаимодействие SNARE-белков носителя и мембраны-мишени; Rab-белки и удерживающие белки отбирают подходящий носитель ещё до этого."],"mechanism":["Rab в активной форме (связанный с ГТФ) отмечает мембрану-мишень и привлекает длинные удерживающие белки.","Удерживающие белки держат подходящий носитель у мишени на расстоянии.","SNARE носителя и SNARE мишени собираются в плотный четырёхспиральный комплекс, который сближает бислои; мембраны сливаются."],"paragraphs":["Точность доставки обеспечивается последовательными проверками: сначала первичное узнавание, затем сборка комплементарных SNARE-белков двух мембран. Слияние обеспечивают SNARE-белки обеих мембран — v-SNARE носителя и t-SNARE мишени.","SNARE-белки работают при слиянии секреторной везикулы с плазматической мембраной — после слияния SNARE-комплекс разбирает АТФаза NSF — и при слиянии транспортных везикул с эндосомами.",{"h":"Дальше в курсе «Молекулярная биология»"},"Чем мембранный контактный сайт отличается от слияния — [[https://fresll.github.io/molbio/seminar-1-route.html#contact-site|МБ, семинар 1, шаг 22]]; почему слияние, закисление и гидролиз в лизосоме — разные процессы — [[https://fresll.github.io/molbio/seminar-7-route.html#fusion-acidity|МБ, семинар 7, шаг 26]]."],"conditions":"Схема качественная: показаны один SNARE мишени и один SNARE носителя вместо четырёх спиралей комплекса.","sources":["Alberts2022"],"quiz":{"id":"S3-L11","question":"Какие белки первыми связывают приближающийся носитель с мембраной-мишенью?","options":[{"id":"S3-L11-1","text":"SNARE-белки носителя","correct":false,"feedback":"SNARE-белки собираются в комплекс позже, когда носитель уже удерживается у мишени."},{"id":"S3-L11-2","text":"Удерживающие белки, которых привлекает Rab в активной форме","correct":true,"feedback":"Rab, связанный с ГТФ, отмечает мембрану-мишень и привлекает длинные удерживающие белки; они держат подходящий носитель на расстоянии."},{"id":"S3-L11-3","text":"Белки оболочки носителя","correct":false,"feedback":"Оболочка разбирается до слияния; узнавание мишени обеспечивают Rab-белки и удерживающие белки."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Выключите этапы цикла по очереди","status":"Схема качественная · не экспериментальные данные","modes_label":"Что выключено","modes":["ничего","белки оболочки","разборка оболочки","SNARE на носителе"],"cfg":[["tgn","none"],["tgn","coat"],["tgn","uncoat"],["tgn","snare"]],"names":{"erg":["грЭПР","аппарат Гольджи"],"gerr":["аппарат Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Где носители","Оболочка","Груз в эндосоме"],"v":[["слились с мишенью","не образуются","в цитоплазме","у мишени"],["снята","не собирается","сохраняется","снята"],["есть","нет","нет","нет"]],"notes":["Покрытые клатрином везикулы отделяются от транс-сети аппарата Гольджи, теряют оболочку и сливаются с эндосомой.","Без клатрина везикулы в транс-сети не образуются; белки остаются в аппарате Гольджи.","Везикулы отделились, но остаются покрытыми клатрином и накапливаются в цитоплазме.","Везикулы потеряли оболочку и удерживаются у эндосомы, но без SNARE на носителе не сливаются."],"static":["Схема показывает, где оказываются носители и груз, если выключить один из этапов цикла на пути из транс-сети аппарата Гольджи в эндосому."]}},"num":11},{"id":"snare-zipper","section":1,"questions":[2],"title":"Как SNARE-комплекс сближает мембраны и почему его нужно разбирать","keywords":["SNARE","застёгивание","Qa","Qb","Qc","R-SNARE","NSF"],"lead":["Одиночные SNARE-белки неактивны и не сливают мембраны даже в высокой концентрации: слияние обеспечивает комплекс, который собирают SNARE-белки двух мембран (Jahn et al., 2024).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Четыре SNARE-мотива — по одному типа Qa, Qb, Qc и R — собираются в пучок из четырёх параллельных α-спиралей; в центре пучка лежит слой из трёх остатков глутамина (Q) и одного аргинина (R), по которому и названы подсемейства (Jahn et al., 2024).","Сборка начинается с N-концевых участков SNARE-мотивов и самопроизвольно продвигается к C-концевым якорям в мембранах («застёгивание»); собранный между двумя мембранами комплекс стягивает их до слияния.","После слияния все спирали комплекса оказываются в одной мембране (cis-комплекс). Его разбирает АТФаза [[T20|NSF]] вместе с белками α-SNAP — растворимыми белками, связывающими NSF. После разборки SNARE-белки снова готовы к слиянию."],"paragraphs":["Что уточняет обзор. Слияние обеспечивает взаимодействие SNARE-белков носителя (v-SNARE) и мишени (t-SNARE) (БИО-3·11). Обзор объясняет, откуда берётся сила: комплекс очень стабилен, и энергия его сборки сближает мембраны и помогает преодолеть энергетический барьер слияния.","Пример — слияние синаптических пузырьков с плазматической мембраной нервного окончания: синтаксин-1 (Qa) и SNAP25 (два мотива, Qb и Qc) находятся в плазматической мембране, синаптобревин-2 (R) — в мембране пузырька (Jahn et al., 2024). У носителя с оболочкой COP-II, который сливается с цис-стороной аппарата Гольджи, распределение другое: на носителе — Qb-, Qc- и R-SNARE, на мембране-мишени — Qa-SNARE. Поэтому деление на R- и Q-SNARE (по остатку аргинина или глутамина в центре комплекса) и на v- и t-SNARE (по мембране, на которой находится белок) — разные классификации. Для слияния пузырька достаточно, по разным оценкам, от одного до трёх комплексов.","Сборку регулируют дополнительные белки — белки семейства Sec1/Munc18 и удерживающие белки, которые держат SNARE в нужном положении. Как именно начинается сборка, пока не установлено.",{"h":"Метод"},"Большая часть сведений обзора получена в бесклеточных системах: очищенные SNARE-белки встраивают в искусственные липидные пузырьки (липосомы) и по флуоресценции измеряют смешивание липидов и содержимого двух мембран; силу сборки комплекса измеряют оптическим пинцетом на одиночных молекулах (Jahn et al., 2024). Контроль — пузырьки без SNARE-белков или с белками только одной мембраны. Типичный артефакт: при гемислиянии смешиваются липиды наружных монослоёв, а содержимое не смешивается, поэтому слияние подтверждают по смешиванию содержимого. Чего данные не доказывают: что в клетке слияние идёт с тем же числом комплексов и с той же скоростью, что в бесклеточной системе.","Из сведений обзора можно заключить: слияние связывает свободные SNARE-белки в собранные комплексы, а NSF разбирает их и возвращает SNARE в работу; без разборки комплексов цикл носителя остановился бы после первых слияний."],"conditions":"Jahn, Cafiso, Tamm, 2024 — обзор. Число комплексов, необходимых для слияния, оценивается по-разному. Схема упрощена: показано по одному мотиву каждого типа; распределение мотивов между мембранами — как при слиянии синаптического пузырька: Qb и Qc — два мотива одного белка SNAP25, который прикреплён к мембране не трансмембранным участком, а остатками жирной кислоты (пальмитоильными). Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Jahn2024"],"quiz":{"id":"S3-L12","question":"Почему одиночный SNARE-белок на носителе, даже в большом количестве, не сливает носитель с мембраной?","options":[{"id":"S3-L12-1","text":"Его сначала должна разобрать АТФаза NSF","correct":false,"feedback":"NSF разбирает уже собранные комплексы после слияния; одиночный SNARE разбирать не нужно."},{"id":"S3-L12-2","text":"Его сначала должна покрыть оболочка COP-II","correct":false,"feedback":"Оболочка участвует в образовании носителя и снимается до слияния; к работе SNARE она отношения не имеет."},{"id":"S3-L12-3","text":"Слияние обеспечивает только комплекс SNARE-мотивов двух мембран","correct":true,"feedback":"Одиночные SNARE неактивны; энергию для сближения мембран даёт сборка комплекса из четырёх мотивов (Qa, Qb, Qc, R) (Jahn et al., 2024)."}]},"widget":{"kind":"zipper","title":"","s":{"title":"Пройдите этапы работы SNARE-комплекса","status":"Схема по обзору Jahn et al., 2024 · не экспериментальные данные","modes_label":"Этап","modes":["SNARE порознь","сборка между мембранами","после слияния","разборка NSF"],"cyto":"цитоплазма","lumen":"просвет мишени","l_r":"R-SNARE носителя","l_q":"Q-SNARE мишени:|Qa — синтаксин,|Qb и Qc — SNAP25","l_zip":"застёгивание: от N- к C-концам","l_cis":"комплекс в одной мембране","l_nsf":"NSF и α-SNAP, АТФ","m":["SNARE","Мембраны"],"v":[["свободны","собираются в комплекс","в собранном комплексе","снова свободны"],["разделены","стянуты","слились","слились"]],"notes":["SNARE носителя и мишени ещё не связаны.","Мотивы собираются в четырёхспиральный пучок от N- к C-концам и стягивают мембраны.","Мембраны слились; все спирали комплекса оказались в одной мембране.","NSF вместе с α-SNAP, затрачивая АТФ, разбирает комплекс; SNARE снова свободны."],"static":["SNARE порознь → сборка комплекса и стягивание мембран → слияние, комплекс в одной мембране → разборка NSF."]}},"num":12,"level":"adv"},{"id":"carrier-limiting","section":1,"questions":[2],"num":42,"title":"Носители есть, а доставки нет: как найти ограничивающий этап","keywords":["цикл носителя","ограничивающий этап","SNARE","узнавание мишени"],"lead":["Вспомнить: шаг «Из каких этапов состоит цикл транспортного носителя». Этапы зависят друг от друга: каждый возможен, только если пройден предыдущий.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Нет оболочки — носители не образуются, груз в доноре.","Оболочка не снимается — носители с полной оболочкой копятся в цитоплазме.","Нет узнавания мишени — носители, сбросившие оболочку, рассеяны в цитоплазме.","Нет SNARE на носителе — носители удержаны у мишени, но не сливаются.","SNARE не восстанавливаются после слияния — первые носители сливаются, затем поток падает."],"paragraphs":["Итог «груз не доставлен» одинаков, но место, где копится груз, и вид носителей различают этапы. Так по распределению промежуточных структур находят ограничивающий этап — самый ранний из нарушенных.","Отдельный случай — восстановление компонентов. После слияния SNARE-белки носителя и мишени образуют прочный комплекс; пока его не разберут за счёт энергии АТФ, эти SNARE не могут участвовать в новом слиянии. Поэтому при нарушенной разборке первая доставка проходит за счёт уже свободных SNARE, а установившийся поток падает с каждым циклом.",{"h":"Как это узнали"},"Белок, разбирающий комплексы SNARE, — NSF — нашли в смеси мембран аппарата Гольджи с цитоплазмой без клеток: перенос груза останавливался, если вывести этот белок из строя, и возвращался, когда его добавляли в очищенном виде (подробнее — шаг «Как обнаружили белок, без которого перенос между цистернами Гольджи останавливается»).",{"h":"Граница вывода"},"Место накопления указывает на ограничивающий этап, но не доказывает его: носители могут копиться и при ускоренном образовании. Вывод проверяют дополнительным наблюдением — например, сравнивают первый цикл и установившийся поток."],"conditions":"Учебная модель цикла носителя на маршруте транс-сеть Гольджи → эндосома (в клетке — прежде всего ранняя эндосома; клатриновые носители сбрасывают оболочку вскоре после отделения; у носителей с COP-II часть оболочки может сохраняться до мишени); порядок этапов — учебная модель; не экспериментальные данные.","sources":["Alberts2022","Block1988"],"quiz":{"id":"S3-L42","question":"Груз не поступает в мишень, носители, сбросившие оболочку, удержаны у её мембраны. Сразу после начала наблюдения первые носители слились. Какой этап, вероятнее всего, нарушен?","options":[{"id":"S3-L42-1","text":"SNARE на носителе отсутствуют","correct":false,"feedback":"Тогда не слились бы и первые носители."},{"id":"S3-L42-2","text":"Узнавание мишени","correct":false,"feedback":"Носители удержаны у мишени — узнавание прошло."},{"id":"S3-L42-3","text":"Восстановление SNARE после слияния","correct":true,"feedback":"Первые носители слились за счёт уже свободных SNARE; затем комплексы не разбираются, и новые носители не сливаются."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Выключите один этап и найдите, где копятся носители","status":"Схема качественная · не экспериментальные данные","modes_label":"Что выключено","modes":["ничего","белки оболочки","разборка оболочки","узнавание мишени","SNARE на носителе"],"cfg":[["tgn","none"],["tgn","coat"],["tgn","uncoat"],["tgn","rec"],["tgn","snare"]],"names":{"erg":["грЭПР","аппарат Гольджи"],"gerr":["аппарат Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","rec":"нет узнавания мишени","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Где носители","Оболочка","Груз в эндосоме"],"v":[["слились с мишенью","не образуются","в цитоплазме","в цитоплазме, вдали от мишени","у мишени"],["в основном снята","не собирается","сохраняется","в основном снята","в основном снята"],["есть","нет","нет","нет","нет"]],"notes":["Клатриновые носители отделяются от транс-сети Гольджи, вскоре сбрасывают значительную часть оболочки, закрепляются у эндосомы и сливаются с ней.","Без белков оболочки носители не образуются; груз остаётся в транс-сети Гольджи.","Носители отделились, но оболочка не снимается, и носители с полной оболочкой копятся в цитоплазме.","Носители сбросили большую часть оболочки, но без Rab-белков и удерживающих белков не закрепляются у мишени.","Носители удержаны у мишени, но без SNARE на носителе не сливаются."],"static":["Нет оболочки — носителей нет; оболочка не снимается — носители с оболочкой в цитоплазме; нет узнавания — носители, сбросившие оболочку, в цитоплазме; нет SNARE — носители у мишени не сливаются."]}},"level":"adv"},{"id":"nsf-recycling","section":1,"questions":[2],"title":"Как обнаружили белок, без которого перенос между цистернами Гольджи останавливается","keywords":["NSF","N-этилмалеимид","бесклеточная система","аппарат Гольджи"],"lead":["Перенос белка между стопками аппарата Гольджи удалось воспроизвести вне клетки и найти белок, необходимый для этого переноса, — NSF.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Мембраны аппарата Гольджи обрабатывали N-этилмалеимидом (NEM) — веществом, которое модифицирует остатки цистеина; после этого перенос белка G вируса везикулярного стоматита почти прекращался (Block et al., 1988).","Добавление фракции цитозоля восстанавливало перенос; по восстановлению из цитозоля очистили белок NSF.","Очищенный NSF восстанавливал перенос и действовал каталитически: по оценке авторов, один комплекс NSF обеспечивал перенос не менее трёх носителей."],"paragraphs":[{"h":"Что уточняет эта работа?"},"В названии SNARE-белков уже упомянут этот белок: SNARE — рецепторы растворимых белков, связывающих NSF, N-этилмалеимид-чувствительный фактор. Эксперимент 1988 г. показал, что этот белок необходим для переноса между цистернами аппарата Гольджи и не расходуется; позже стало известно, что NSF разбирает SNARE-комплексы после слияния (вспомнить БИО-3·12).",{"h":"Метод"},"Бесклеточная система: донорные мембраны аппарата Гольджи из клеток CHO, заражённых вирусом везикулярного стоматита, акцепторные — из незаражённых клеток, цитозоль и АТФ. Перенос вирусного белка G из цис- в медиальный компартмент измеряли по присоединению [3H]GlcNAc к белку G. Мембраны обрабатывали 1 мМ N-этилмалеимида 15 мин при 0 °C, цитозоль готовили без активного NSF.","Контроль: необработанные мембраны с обычным цитозолем. Ограничение: N-этилмалеимид модифицирует многие белки, поэтому вывод о роли именно NSF опирается на восстановление переноса очищенным белком. Восстановление показывает, что добавления NSF достаточно, чтобы вернуть перенос в системе, где остальные компоненты сохранены; достаточен ли NSF для переноса сам по себе, из этого не следует.","Чего данные не доказывают. Эксперимент показывает, что NSF необходим для переноса, но не показывает, на каком этапе цикла он работает; роль NSF в разборке SNARE-комплексов установлена позже. Оценка каталитического действия заведомо занижена: при очистке большая часть активности теряется."],"conditions":"Block et al., 1988: бесклеточная система из мембран аппарата Гольджи клеток CHO (линия клеток яичника китайского хомячка); измеряемая величина — присоединение [3H]GlcNAc к белку G вируса везикулярного стоматита. Белок G — мембранный гликопротеин, поэтому на схеме он встроен в мембраны цистерн и носителей. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Block1988"],"quiz":{"id":"S3-L13","question":"К мембранам аппарата Гольджи, обработанным N-этилмалеимидом, добавили очищенный NSF. Что показал эксперимент?","options":[{"id":"S3-L13-1","text":"Перенос восстановился, и один комплекс NSF обслуживал несколько носителей","correct":true,"feedback":"Очищенный NSF вернул перенос белка G; по оценке авторов, один комплекс обеспечивал перенос не менее трёх носителей (Block et al., 1988)."},{"id":"S3-L13-2","text":"Перенос не восстановился: мембраны необратимо повреждены","correct":false,"feedback":"Перенос восстанавливался одним добавленным белком, значит, остальные компоненты мембран сохранили работоспособность."},{"id":"S3-L13-3","text":"Перенос восстановился, только если NSF было столько же, сколько носителей","correct":false,"feedback":"NSF действует каталитически: он не расходуется на каждый носитель."}]},"widget":{"kind":"nsf","title":"","s":{"title":"Повторите эксперимент с N-этилмалеимидом","status":"Данные Block et al., 1988 · бесклеточная система","modes_label":"Условия","modes":["контроль","N-этилмалеимид","N-этилмалеимид + очищенный NSF"],"donor":"донорная стопка","acc":"акцепторная стопка","notes_short":["перенос идёт, NSF разбирает комплексы","перенос почти не идёт","перенос восстановлен"],"m":["Перенос белка G","SNARE после слияния"],"v":[["контроль","почти не идёт","восстановлен"],["разбираются","остаются собранными (вывод по обзору)","разбираются"]],"notes":["Мембраны и цитозоль без обработки: белок G переходит в акцепторную стопку.","После N-этилмалеимида и без активного NSF перенос почти прекращается; по обзору Jahn et al., 2024, можно заключить, что собранные SNARE-комплексы при этом не разбираются.","Очищенный NSF восстанавливает перенос; один комплекс NSF обслуживает несколько носителей."],"static":["Контроль — перенос идёт; N-этилмалеимид — перенос почти не идёт; N-этилмалеимид + очищенный NSF — перенос восстановлен."]}},"num":13,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"eres-resolution","section":1,"questions":[2],"title":"Что видно у выхода из ЭПР при разном разрешении","keywords":["COP-II","участок выхода из ЭПР","разрешение","криоэлектронная томография"],"lead":["В световом микроскопе [[T41|участок выхода из эндоплазматической сети (ЭПР)]] выглядит одним пятном, и по нему нельзя определить, пузырьки там или трубка; в клетках без воздействий криоэлектронная томография показала скопления пузырьков с оболочкой COP-II около 70 нм.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Предел [[T45|разрешения]] светового микроскопа около 200 нм; скопление покрытых мембран у ЭПР в клетках RPE-1 — около 240 нм (медиана), поэтому оно сливается в одно пятно (Downes et al., 2026; MBoC7). Такое пятно может содержать скопление из нескольких пузырьков около 70 нм или трубку; различить их позволяют лишь методы с намного более высоким разрешением, чем у светового микроскопа (в этой работе — криоэлектронная томография).","На томограммах 63 участков нашли 157 мембран с COP-II (95 отделившихся и 62 формирующихся пузырька — выпячивания мембраны, ещё не отделившиеся от неё) и 187 с COP-I; пузырёк COP-II — около 70 нм, COP-I — около 64 нм.","В этой работе формирующиеся пузырьки с оболочкой COP-II находились на мембране ЭПР, а с оболочкой COP-I — на мембранах промежуточного компартмента или аппарата Гольджи; формирующихся пузырьков без оболочки не встретили; авторы заключили, что оболочка разбирается после отделения пузырька, но до слияния."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Носитель с оболочкой COP-II переносит груз из ЭПР в аппарат Гольджи (БИО-3·9). Другие работы описали у выхода из ЭПР трубчатые носители (прижизненная съёмка, объёмная электронная микроскопия). В клетках без воздействий авторы этой работы нашли пузырьки; трубки и туннели они не исключают. Возможно, форма носителя зависит от условий, но здесь это не проверяли.",{"h":"Метод"},"Участки выхода из ЭПР находили по флуоресценции белка Sec23A — компонента оболочки COP-II. В клетках этот белок был слит с белком-меткой HaloTag (к ней присоединяют флуоресцентный краситель): последовательность метки встроили в клеточный ген SEC23A методом редактирования генома, поэтому меченый белок синтезируется с собственного гена клеток, а не вводится извне. Затем из замороженной клетки ионным пучком вырезали тонкий слой (томограммы толщиной 150–350 нм) и снимали томограмму. Тип оболочки определяли по виду оболочки и подтверждали сопоставлением с шаблонами COP-I и COP-II.","Чего метод не доказывает. Слой мал, а участки выбирали по скоплениям флуоресценции — выборка смещена к скоплениям пузырьков; авторы прямо пишут, что трубчатые носители и туннели не исключены. Крупный груз ([[T44|проколлаген]] длиной около 300 нм) в пузырёк 60–80 нм не помещается, и его выход объясняют более крупными носителями (MBoC7)."],"conditions":"Downes et al., 2026: клетки RPE-1 без воздействий; белок Sec23A слит с меткой HaloTag (метка встроена в ген SEC23A в геноме клеток); криоэлектронная томография тонких слоёв; 63 томограммы.","sources":["Downes2026","Alberts2022"],"quiz":{"id":"S3-L34","question":"На томограмме у мембраны ЭПР виден формирующийся пузырёк без белковой оболочки. Как это согласуется с данными работы?","options":[{"id":"S3-L34-1","text":"Не согласуется: формирующихся пузырьков без оболочки не нашли, а по выводу авторов оболочка разбирается после отделения пузырька","correct":true,"feedback":"Все найденные формирующиеся пузырьки были покрыты оболочкой; авторы заключили, что оболочка разбирается после отделения, но до слияния, и формирующийся пузырёк без оболочки поставил бы этот вывод под сомнение."},{"id":"S3-L34-2","text":"Согласуется: оболочка разбирается ещё до отделения","correct":false,"feedback":"Тогда встречались бы формирующиеся пузырьки без оболочки; их не нашли."},{"id":"S3-L34-3","text":"Согласуется: на ЭПР формирующиеся пузырьки всегда без оболочки","correct":false,"feedback":"Формирующиеся пузырьки на ЭПР всегда несли оболочку COP-II."}]},"widget":{"kind":"eres","zoomNarrow":true,"title":"","s":{"title":"Участок выхода из ЭПР «как есть» и «в приборе»","status":"Модель по данным одной работы: размеры — измеренные; размытие — расчёт","modes_label":"Предел разрешения (меньше — лучше)","modes":["200 нм","10 нм","1,5 нм"],"x":[200,10,1.5],"L":{"pA":"А","pB":"Б","tA":"как есть (масштаб соблюдён)","tB":"то же в приборе: разрешение {x} нм","zone":"зона без рибосом","er":"мембрана ЭПР с рибосомами","ergic":"промежуточный компартмент (ERGIC)","ctrl":"контрольная фигура модели","v70":"COP-II ≈ 70 нм","v64":"COP-I ≈ 64 нм","v243":"скопление 243 нм","v483":"483 нм","hl1":"пузырьки COP-II — на мембране ЭПР","hl2":"пузырьки COP-I — на ERGIC или аппарате Гольджи","rod":""},"notes":["200 нм: скопление пузырьков видно как одно пятно — пузырьки это или трубка, не определить.","10 нм: по правилу модели пузырьки различимы по отдельности (при разрешении около 100 нм они ещё сливаются).","1,5 нм: видны отдельные формирующиеся и отделившиеся пузырьки около 70 нм; тип оболочки определяют по профилю плотности."]}},"num":34,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"fusion-pore","section":1,"questions":[2],"title":"Как открывается и меняется пора слияния","keywords":["пора слияния","гемислияние","Ω-профиль","экзоцитоз","STED"],"lead":["Слияние проходит через промежуточные состояния. По одной из моделей сначала сливаются обращённые друг к другу монослои мембран ([[T22|гемислияние]]), затем открывается [[T21|пора]]; конкурирующая модель предполагала начальную пору, выстланную SNARE-белками. В эксперименте на живых хромаффинных клетках надпочечника быка гемислияние, длившееся достаточно долго, чтобы его зарегистрировать, наблюдали примерно в 30–40 % событий слияния; пора может расшириться или снова закрыться (Wu, Chan, 2024).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["По классической схеме при слиянии везикулы с плазматической мембраной открывается узкая пора (менее ~5 нм); она может быстро закрыться и ограничить выход содержимого («поцелуй и беги») или расшириться, и тогда везикула полностью встраивается в мембрану (Wu, Chan, 2024).","В живых хромаффинных клетках надпочечника примерно в 30–40 % событий слияния наблюдали гемислияние, длившееся достаточно долго, чтобы его зарегистрировать; примерно в трети таких случаев оно переходило в полное слияние за 0,1–26 с.","Поры видны непосредственно, если они крупнее ~60 нм: у везикул 180–720 нм поры бывают от ~0 до 490 нм и могут расширяться быстрее ~9 нм/мс. Слившаяся везикула сохраняет форму Ω-профиля, сжимается, увеличивается, а пора остаётся открытой или закрывается — всего семь вариантов."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Обычно описывают два исхода слияния — полное слияние и «поцелуй и беги», при котором пора открывается кратковременно. В крупных секреторных везикулах хромаффинных клеток распластывание везикулы в плазматической мембране, считавшееся основным исходом, не наблюдали; вместо этого Ω-профиль сохранялся, сжимался или увеличивался (Wu, Chan, 2024).",{"h":"Метод"},"Микроскопия STED (разрешение ~60–80 нм, кадр каждые ~26–300 мс) в первичной культуре хромаффинных клеток надпочечника быка; секрецию запускали деполяризацией в течение 1 с. Цитоплазматический монослой плазматической мембраны метили флуоресцентным белком, связывающим фосфатидилинозитол-4,5-бисфосфат, а внеклеточную среду — малым флуоресцентным красителем: краситель проникает в везикулу, только когда пора открыта.","Контроль: гемислиянию соответствует Ω-профиль, на который переходит метка цитоплазматического монослоя плазматической мембраны, но в который не проникают малый краситель и ионы H+ и на который не переходит метка внеклеточного монослоя; открытая пора пропускает краситель. Ограничение: поры меньше ~60 нм не видны непосредственно, их открытие определяют по проникновению красителя.","Чего данные не доказывают. Наблюдения сделаны на крупных везикулах (~200–1500 нм) одного типа клеток; везикулы 30–100 нм, например синаптические, таким методом не видны, и перенос выводов на них не показан."],"conditions":"Wu, Chan, 2024 — аналитическая статья (рубрика Perspective), обобщающая наблюдения в живых хромаффинных клетках быка; числа — из неё. На схеме гемислияния слиты только обращённые к цитоплазме монослои, а просвет везикулы отделён от внеклеточной среды перегородкой из двух других монослоёв. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["WuChan2024"],"quiz":{"id":"S3-L14","question":"Во внеклеточную среду добавили малый флуоресцентный краситель. Метка цитоплазматического монослоя плазматической мембраны перешла на Ω-профиль слившейся везикулы, но ни краситель, ни ионы H+ в него не проникают, а метка внеклеточного монослоя на него не переходит. Как авторы интерпретируют это состояние?","options":[{"id":"S3-L14-1","text":"Широкая пора, через которую выходит содержимое","correct":false,"feedback":"Через открытую пору малый краситель проник бы в везикулу."},{"id":"S3-L14-2","text":"Гемислияние: слиты только обращённые друг к другу монослои, поры нет","correct":true,"feedback":"Метка перешла из цитоплазматического монослоя — значит, обращённые к цитоплазме монослои слились; непроницаемость для красителя и H+ и отсутствие метки внеклеточного монослоя показывают, что поры нет. Так гемислияние определяют Wu и Chan (2024)."},{"id":"S3-L14-3","text":"Везикула уже полностью распласталась в мембране","correct":false,"feedback":"Распластанной везикулы как отдельной структуры уже нет; здесь же видна слившаяся, но непроницаемая для красителя структура."}],"rev":2},"widget":{"kind":"pore","title":"","s":{"title":"Проследите, что происходит с порой слияния","status":"Схема по Wu, Chan, 2024 · хромаффинные клетки быка","modes_label":"Состояние","modes":["сближение","гемислияние","узкая пора","широкая пора","Ω-профиль сжимается","пора закрылась"],"out":"внеклеточная среда","cyto":"цитоплазма","m":["Пора","Содержимое везикулы"],"v":[["нет","нет: слиты только монослои со стороны цитоплазмы","узкая (< ~5 нм по проводимости)","до ~490 нм, Ω-профиль сохраняется","открыта, Ω-профиль уменьшается","закрыта"],["внутри","внутри: краситель и H+ не проникают","начинает выходить","выходит","вышло","вышло частично"]],"notes":["Везикула подошла к плазматической мембране; поры ещё нет.","Гемислияние: обращённые к цитоплазме монослои слились, и метка цитоплазматического монослоя плазматической мембраны переходит на Ω-профиль; просвет везикулы отделён от внеклеточной среды перегородкой, поэтому краситель и H+ в него не проникают.","Открылась узкая пора: содержимое начинает выходить.","Пора расширилась; везикула сохраняет форму Ω-профиля.","Ω-профиль сжимается, и мембрана везикулы переходит в плазматическую мембрану.","Пора закрылась: везикула отделилась, отдав часть содержимого («поцелуй и беги»)."],"static":["Сближение → гемислияние (не всегда) → узкая пора → широкая пора → сжатие Ω-профиля или закрытие поры."]}},"num":14,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"fusion-300ms","section":1,"questions":[2],"title":"Что происходит с синаптическим пузырьком за первые 300 мс после потенциала действия","keywords":["синаптический пузырёк","гемислияние","пора слияния","сверхбыстрый эндоцитоз","тетанотоксин"],"lead":["Снимки синапсов, замороженных через миллисекунды после потенциала действия, показали: пузырёк проходит гемислияние, открывает пору около 4 нм, сжимается и чаще всего уходит от мембраны, не встраиваясь в неё целиком.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Число пузырьков в состоянии гемислияния максимально через 4 мс, пузырьков с порой около 4 нм — через 8 мс (Tao et al., 2025). Последовательность восстановлена по снимкам разных синапсов.","Пузырёк с открытой порой быстро сжимается с 41 до 29 нм — примерно до половины площади; затем пора закрывается, и с 30 мс пузырёк начинает отходить от мембраны; по оценке авторов, такой путь — больше 80 % событий выброса, распластываются немногие.","Через 100–300 мс (одна группа томограмм) на краю активной зоны появляются эндоцитозные структуры около 80 нм; по предположению авторов, быстрый эндоцитоз забирает мембрану, добавленную немногими распластавшимися пузырьками (Tao et al., 2025); при [[T66|тетанотоксине]], расщепляющем [[T47|синаптобревин]], в покое и через 8 мс (так его сравнивали) гемислияния и пор нет."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Слияние идёт через гемислияние (авторы называют это состояние частично слитым) и пору (БИО-3·14). Работа показывает это в синапсе с разрешением в миллисекунды и добавляет к схеме «выброс через пору с возвратом пузырька» сжатие пузырька: он отдаёт медиатор через пору, сжимается и уходит.",{"h":"Метод"},"Нейроны в культуре несли светочувствительный канал; вспышка света вызывала потенциал действия (все группы — в присутствии CNQX, блокатора возбуждающей передачи), и образец замораживали через заданное время; затем снимали томограммы нервных окончаний. По расчётам авторов, большая часть медиатора выходит через пору около 4 нм примерно за 50 мкс (диффузионный расчёт), а пора открыта не менее примерно 2 мс (нижняя оценка по модели переходов).","Чего метод не доказывает. Последовательность восстановлена по разным синапсам; точки 4 и 8 мс сняты при более низкой температуре (около 24 и 29 °C), чем остальные (34 °C); это культура, а не ткань мозга; плотности у поры лишь предположительно соответствуют SNARE-комплексам."],"conditions":"Tao et al., 2025: культура нейронов гиппокампа крысы; потенциал действия вызывали светом; замораживание через 4, 8, 30, 70, 100–300 мс (одна группа томограмм); тетанотоксин — в покое и через 8 мс; криоэлектронная томография.","sources":["Tao2025"],"quiz":{"id":"S3-L35","question":"Через 30 мс после потенциала действия на томограмме у мембраны виден малый пузырёк около 29 нм с ещё открытой порой. На какой стадии он находится?","options":[{"id":"S3-L35-1","text":"Новый пузырёк, только что образованный эндоцитозом","correct":false,"feedback":"Эндоцитозные структуры в этих синапсах крупнее (около 80 нм) и появляются позже — через 100–300 мс."},{"id":"S3-L35-2","text":"Малый пузырёк на стадии выброса с ещё открытой порой","correct":true,"feedback":"Пузырёк 41 нм после открытия поры быстро сжимается примерно до 29 нм; на снимках 30 мс есть малые пузырьки и с открытой, и с уже закрытой порой. Закрытие поры и отход пузырька от мембраны — последующие состояния."},{"id":"S3-L35-3","text":"Пузырёк, который ещё не начал слияние","correct":false,"feedback":"Пузырьки до слияния — около 41 нм и без поры."}]},"widget":{"kind":"fusion300","zoomNarrow":true,"title":"","s":{"title":"Нервное окончание в моменты после потенциала действия","status":"Снимки синапсов в отдельные моменты (Tao et al., 2025); ход между ними не измерен","modes_label":"Время после потенциала действия","modes":["контроль, без стимуляции","4 мс","8 мс","30 мс","70 мс","100–300 мс","тетанотоксин, 8 мс"],"t":[0,4,8,30,70,200,8],"tent":[0,0,0,0,0,0,1],"L":{"pA":"А","pB":"Б","term":"нервное окончание","cleft":"синаптическая щель","post":"постсинаптическая мембрана","az":"активная зона","flat":"немногие распластываются","ufe":"эндоцитозная структура около 80 нм","tentLbl":"тетанотоксин: синаптобревин расщеплён","rows":["удерживается","гемислияние","открытая пора слияния","сжат, пора","отошёл","эндоцитоз"],"xl":"время, мс","note":"кружок — группа синапсов на снимке; между снимками ход не измерен","late":"поздняя выборка","tentNa":"для тетанотоксина в этом положении сравнение не проводилось","pOpen":"пора открыта","pClosed":"пора закрыта"},"notes":["Контроль без стимуляции: пузырьки около 41 нм удерживаются у мембраны; немногие уже в состоянии гемислияния.","4 мс: число пузырьков в состоянии гемислияния максимально.","8 мс: число пузырьков с открытой порой около 4 нм максимально; по расчёту авторов, медиатор выходит за десятки микросекунд.","30 мс: малые пузырьки (около 29 нм) на двух стадиях — у одних пора ещё открыта, у других уже закрыта; первые пузырьки начинают отходить от мембраны.","70 мс: большинство сжатых пузырьков отошло; распластались немногие.","Поздняя выборка 100–300 мс (одна группа томограмм): на краю активной зоны — эндоцитозные структуры около 80 нм.","Тетанотоксин (сравнение в покое и через 8 мс): только удерживаемые у мембраны пузырьки, без гемислияния и пор."]}},"num":35,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"early-endosome","section":2,"questions":[3],"title":"Ранняя эндосома — сортировочный компартмент","keywords":["ранняя эндосома","сортировка","рециркуляция","кислая среда"],"lead":["После разборки оболочки эндоцитозные везикулы сливаются друг с другом и с уже образованными [[T19|ранними эндосомами]]. Обычно ранняя эндосома около 10 минут принимает новые везикулы, а затем начинает созревать в позднюю.","Основная функция ранних эндосом — сортировка и [[T23|рециркуляция]] белков, поступивших путём эндоцитоза. Это вопрос 9 коллоквиума."],"mechanism":["Эндоцитозные везикулы сливаются друг с другом или с уже существующими ранними эндосомами.","В ранней эндосоме лиганд часто отделяется от рецептора: этому способствует кислая среда.","В самом частом варианте рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а отделившийся лиганд остаётся в эндосоме, которая созревает в позднюю, и затем попадает в лизосомы; другие варианты зависят от конкретного рецептора и лиганда (следующий шаг).","Куда направится рецептор, зависит от сигналов сортировки и убиквитинирования."],"paragraphs":["Вспомнить БИО-3·10: клатриновая оболочка разбирается до слияния, и в раннюю эндосому поступает неокаймлённый носитель. Дальше ранняя эндосома работает как сортировочная станция: одни белки она возвращает на поверхность, другие направляет к поздним эндосомам и лизосомам.","Таким образом, путь лиганда и рецептора определяется двумя событиями в ранней эндосоме — отделяется ли лиганд от рецептора (это зависит от того, как связь лиганда с рецептором меняется в кислой среде) и куда отсортирован рецептор. Эти два события и создают пути рецептора и лиганда (следующий шаг).",{"h":"Дальше в курсе «Молекулярная биология»"},"Как доставка, диффузия и эндоцитоз вместе поддерживают домен плазматической мембраны — [[https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes|МБ, семинар 2, шаг 25]]."],"conditions":"Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L15","question":"Какая основная функция ранней эндосомы?","options":[{"id":"S3-L15-1","text":"Расщепление всех поступивших белков","correct":false,"feedback":"Расщепление идёт в лизосомах; ранняя эндосома многие белки, прежде всего рецепторы, возвращает на поверхность."},{"id":"S3-L15-2","text":"Образование покрытых клатрином везикул из плазматической мембраны","correct":false,"feedback":"Покрытые везикулы образуются на плазматической мембране; в раннюю эндосому они приходят уже без оболочки."},{"id":"S3-L15-3","text":"Сортировка и рециркуляция белков, поступивших путём эндоцитоза","correct":true,"feedback":"Из ранней эндосомы рецепторы возвращаются на поверхность, а лиганды уходят к поздним эндосомам."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Сравните, что уходит из ранней эндосомы","status":"Схема качественная · не экспериментальные данные","modes_label":"В ранней эндосоме","modes":["лиганд отделяется от рецептора","лиганд остаётся связанным"],"cfg":[[true,true,"ee"],[false,true,"ee"]],"m":["На поверхность","В поздние эндосомы"],"v":[["рецепторы","рецепторы с лигандом"],["лиганды","—"]],"notes":["Лиганд отделился: рецепторы возвращаются на поверхность в везикулах, лиганды остаются в созревающей эндосоме и попадают в лизосомы.","Лиганд остался на рецепторе: комплекс возвращается на поверхность и распадается там."],"static":["Ранняя эндосома: рецепторы возвращаются на поверхность, отделившиеся лиганды уходят к поздним эндосомам; связанные лиганды возвращаются с рецептором."]}},"num":15},{"id":"four-routes","section":2,"questions":[3],"title":"Какими путями расходятся рецептор и лиганд","keywords":["рециркуляция","деградация","EGF","трансцитоз","IgA"],"lead":["Лиганд-рецепторный комплекс после эндоцитоза проходит одним из четырёх путей.","Различаются они тем, отделяется ли лиганд от рецептора в ранней эндосоме и куда направлен рецептор."],"mechanism":["Рециркуляция рецептора и деградация лиганда — самый частый путь: комплекс в ранней эндосоме диссоциирует, рецептор возвращается на поверхность, лиганд остаётся в эндосоме, которая созревает в позднюю, и расщепляется в лизосоме.","Рециркуляция рецептора и лиганда: некоторые лиганды, зачастую белки-переносчики, не отделяются от рецептора в ранних эндосомах; комплекс возвращается и распадается на поверхности.","Деградация рецептора и лиганда: комплекс, например фактор роста EGF с его рецептором, не диссоциирует; [[T26|убиквитинированный]] рецептор вместе с лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца и разрушается в лизосоме.","[[T27|Трансцитоз]]: комплекс димерного IgA с полимерным иммуноглобулиновым рецептором переносится от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом."],"paragraphs":["Первые три пути показаны на схеме и в практикуме вопроса 3; трансцитоз требует клетки с двумя разными поверхностями — эпителиальной — и на схеме не показан.","Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко: клетка переносит IgA через себя, не расщепляя его. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.","Таким образом, первые три пути различаются двумя событиями в ранней эндосоме (вспомнить БИО-3·15): отделяется ли лиганд от рецептора и куда отсортирован рецептор — на поверхность или в лизосому. Трансцитоз добавляет третье направление — к противоположной поверхности клетки."],"conditions":"Схема качественная, трансцитоз на ней не показан.","sources":["Alberts2022"],"quiz":{"id":"S3-L16","question":"Белок-переносчик остаётся связанным с рецептором в ранней эндосоме, и этот рецептор направляется обратно на ту же поверхность клетки. Куда попадёт белок-переносчик?","options":[{"id":"S3-L16-1","text":"Вернётся на поверхность вместе с рецептором","correct":true,"feedback":"Связанный лиганд следует за рецептором: это путь «рециркуляция рецептора и лиганда». Отделится ли белок-переносчик на поверхности, зависит от свойств комплекса; например, апотрансферрин при нейтральном pH отделяется (БИО-3·19)."},{"id":"S3-L16-2","text":"Расщепится в лизосоме, а рецептор вернётся","correct":false,"feedback":"Так проходит лиганд, который отделяется от рецептора в ранней эндосоме."},{"id":"S3-L16-3","text":"Перенесётся через клетку на противоположную поверхность","correct":false,"feedback":"Трансцитоз — перенос к противоположной поверхности эпителиальной клетки; в условии рецептор возвращается на ту же поверхность."}],"rev":2},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Выберите путь и проследите рецептор и лиганд","status":"Схема качественная · не экспериментальные данные","modes_label":"Путь","modes":["рециркуляция рецептора, деградация лиганда","рециркуляция рецептора и лиганда","деградация рецептора и лиганда"],"cfg":[[true,true,""],[false,true,""],[false,false,"le"]],"m":["Лиганд","Рецептор","Пример"],"v":[["расщепляется в лизосоме","возвращается на поверхность","расщепляется с рецептором"],["возвращается","возвращается","расщепляется"],["самый частый путь","белки-переносчики","EGF и его рецептор"]],"notes":["Лиганд отделился в ранней эндосоме и расщепляется в лизосоме; рецептор вернулся на поверхность.","Лиганд не отделился: комплекс вернулся на поверхность и распадается там.","Убиквитинированный рецептор с лигандом включён во внутрипросветные везикулы и разрушается в лизосоме; рецепторов на поверхности меньше."],"static":["Три пути на схеме: рециркуляция рецептора и деградация лиганда; рециркуляция обоих; деградация обоих. Четвёртый путь — трансцитоз — описан в тексте."]}},"num":16},{"id":"recycling-gain","section":2,"questions":[3],"title":"Зачем рецептору возвращаться на поверхность","keywords":["рециркуляция","захват","рецептор","десенситизация"],"lead":["Рециркуляция рецептора позволяет клетке постоянно и избирательно захватывать нужное вещество: одна молекула рецептора работает много раз.","Если рецептор расщепляется вместе с лигандом или, как при трансцитозе, расщепляется на противоположной поверхности клетки, каждая молекула работает один раз."],"mechanism":["Рецептор связывает лиганд на поверхности и уходит с ним в клетку в покрытой клатрином везикуле.","В ранней эндосоме лиганд отделяется, и рецептор возвращается на поверхность.","На поверхности рецептор снова связывает лиганд — цикл повторяется.","При пути «деградация рецептора и лиганда» рецептор расщепляется в лизосоме и на поверхность не возвращается."],"paragraphs":["Полимерный иммуноглобулиновый рецептор переносит димерный IgA от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом. Значит, такая молекула рецептора переносит IgA один раз, и для каждого переноса клетка использует новую молекулу рецептора.",{"more":"Сколько раз рецептор проходит цикл, измерено для рецептора ЛПНП (БИО-3·20)."},{"h":"Дальше в курсе «Молекулярная биология»"},"Как ответ клетки ослабевает при длительной стимуляции, в том числе за счёт захвата рецепторов внутрь клетки — [[https://fresll.github.io/molbio/seminar-3-route.html#desensitization|МБ, семинар 3, шаг 6]]."],"conditions":"Модель не учитывает синтез новых рецепторов. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L17","question":"Сколько молекул IgA может перенести через эпителиальную клетку одна молекула полимерного иммуноглобулинового рецептора?","options":[{"id":"S3-L17-1","text":"Много: после выделения IgA рецептор вернётся на базолатеральную поверхность","correct":false,"feedback":"Возвращаться нечему: внеклеточная часть рецептора отщепляется и выделяется вместе с IgA."},{"id":"S3-L17-2","text":"Одну: на апикальной мембране рецептор расщепляется, и его часть уходит в секрет вместе с IgA","correct":true,"feedback":"IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом."},{"id":"S3-L17-3","text":"Ни одной: комплекс расщепится в лизосоме","correct":false,"feedback":"Комплекс IgA с рецептором переносится через эндосомы к апикальной мембране, а не в лизосому."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Сравните рецептор, который возвращается, и рецептор, который расщепляется","status":"Схема качественная · не экспериментальные данные","modes_label":"Рецептор","modes":["возвращается на поверхность","расщепляется в лизосоме"],"cfg":[[true,true,""],[false,false,"ly"]],"m":["Сколько раз работает рецептор","Где оказывается рецептор"],"v":[["много раз","один раз"],["снова на поверхности","в лизосоме"]],"notes":["Рецептор возвращается и снова связывает лиганд.","Рецептор расщепляется вместе с лигандом и проходит цикл один раз."],"static":["Возвращающийся рецептор работает много раз; расщепляющийся вместе с лигандом — один раз."]}},"num":17},{"id":"late-endosome","section":2,"questions":[3],"title":"Как ранняя эндосома становится поздней и что попадает в лизосому","keywords":["поздняя эндосома","мультивезикулярное тельце","лизосома","Rab5","Rab7"],"lead":["По мере созревания ранних эндосом их внутренняя среда становится более кислой, а сами эндосомы уходят глубже в цитоплазму и становятся [[T24|поздними]].","Мембрана созревающей эндосомы впячивается в её просвет и образует внутрипросветные везикулы — так возникает [[T25|мультивезикулярное тельце]]. Поздняя эндосома сливается с лизосомой, и содержимое расщепляется."],"mechanism":["Ранняя эндосома закисляется и перемещается глубже в цитоплазму.","Эндосома меняет Rab-белки, липиды, кислотность и положение в клетке; метка ранней эндосомы — Rab5, поздней — Rab7.","Мембрана поздней эндосомы впячивается в её просвет — образуются внутрипросветные везикулы мультивезикулярного тельца.","Мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется; некоторые сливаются с плазматической мембраной, и их внутрипросветные везикулы выходят наружу как экзосомы."],"paragraphs":["Лизосомы содержат гидролитические ферменты — протеазы, нуклеазы, гликозидазы, липазы и фосфолипазы — и расщепляют макромолекулы, поступившие путём эндоцитоза. Поэтому белок, который не вернулся из ранней эндосомы, обычно оказывается в лизосоме и расщепляется.","Убиквитинированные рецепторы включаются в мембрану внутрипросветных везикул и вместе с ними попадают в просвет лизосомы. Значит, включение в мембрану внутрипросветных везикул отделяет мембранный белок от ограничивающей мембраны эндосомы, с которой он мог бы вернуться на поверхность.",{"more":"Как именно ранняя эндосома становится поздней — смена Rab5 на Rab7, — показано в живых клетках (БИО-3·21)."},{"h":"Дальше в курсе «Молекулярная биология»"},"Как меняется метка мембраны при созревании эндосомы — [[https://fresll.github.io/molbio/seminar-1-route.html#conversion|МБ, семинар 1, шаг 16]]; почему для закисления лизосомы нужен насос — [[https://fresll.github.io/molbio/seminar-1-route.html#pumps-channels|МБ, семинар 1, шаг 3]]."],"conditions":"Значения pH в шаге не используются. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L18","question":"Что происходит с ранней эндосомой по мере созревания?","options":[{"id":"S3-L18-1","text":"Она сливается с плазматической мембраной и исчезает","correct":false,"feedback":"С плазматической мембраной могут сливаться мультивезикулярные тельца, но созревание ранней эндосомы ведёт к поздней эндосоме."},{"id":"S3-L18-2","text":"Её среда становится нейтральной, и рецепторы отделяются от лигандов","correct":false,"feedback":"Наоборот: при созревании среда эндосомы становится кислее."},{"id":"S3-L18-3","text":"Её среда становится кислее, и она уходит глубже в цитоплазму, становясь поздней","correct":true,"feedback":"Так идёт созревание эндосомы; при этом метка Rab5 на её мембране сменяется Rab7."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Пройдите от ранней эндосомы к лизосоме","status":"Схема качественная · не экспериментальные данные","modes_label":"Компартмент","modes":["ранняя эндосома","поздняя эндосома","лизосома"],"cfg":[[true,true,"ee"],[true,true,"le"],[true,true,"ly"]],"m":["Положение","Что происходит","Метка"],"v":[["ближе к поверхности","глубже в цитоплазме","глубже в цитоплазме"],["сортировка и возврат рецепторов","впячивание мембраны, внутрипросветные везикулы","расщепление гидролазами"],["Rab5","Rab7","—"]],"notes":["Ранняя эндосома сортирует: рецепторы уходят на поверхность, лиганды — дальше.","Поздняя эндосома кислее и глубже; её мембрана впячивается внутрь — это мультивезикулярное тельце.","В лизосоме гидролазы расщепляют поступившие макромолекулы."],"static":["Ранняя эндосома → поздняя эндосома (мультивезикулярное тельце) → лизосома: среда кислее, положение глубже, содержимое расщепляется."]}},"num":18},{"id":"acid-release","section":2,"questions":[3],"title":"Почему трансферрин возвращается на поверхность без железа","keywords":["трансферрин",
