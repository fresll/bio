е, которое различит объяснения.","Похожая форма не гарантирует одинаковой функции: клатриновая ямка и кавеола — обе впячивания, но первая отбирает рецепторы и становится носителем, а вторая служит резервом площади мембраны."],"conditions":"Обобщение продвинутых шагов разделов 1–4; схема — таблица.","sources":["Alberts2022","Sinha2011","DautryVarsat1983"],"quiz":{"id":"S3-L45","question":"Белок с NLS оказался в цитоплазме, хотя импортин в клетке есть и пора в порядке. Какое звено цепи, вероятнее всего, прервано?","options":[{"id":"S3-L45-1","text":"Механизм переноса через пору","correct":false,"feedback":"Пора по условию в порядке."},{"id":"S3-L45-2","text":"Местные условия эндосомы","correct":false,"feedback":"Кислотность эндосомы к ядерному импорту отношения не имеет."},{"id":"S3-L45-3","text":"Доступность метки: NLS закрыт или изменён","correct":true,"feedback":"Рецептор и пора в порядке — значит, импортин не может узнать сигнал."}]},"widget":{"kind":"addr","title":"","s":{"title":"Одно наблюдение — два объяснения","status":"Обобщение","modes_label":"Система","modes":["кавеолы","цикл носителя","рецептор трансферрина","ядерный белок"],"h":["Наблюдение","Два объяснения","Что их различит"],"rows":[["впячиваний\nстало меньше","распластались\nили ушли внутрь","исчезают ли они\nбез отделения\nпузырьков"],["носители у мишени\nне сливаются","нет SNARE или SNARE\nне восстанавливаются","слились ли\nпервые носители"],["рецепторов\nна поверхности\nменьше","возврат нарушен\nили уход ускорен","возвращаются ли\nмеченые рецепторы"],["белка в ядре\nменьше","импорт ослаб или\nэкспорт усилен","выключить экспорт\nи проследить\nнакопление"]],"foot":"одно наблюдение совместимо с разными причинами; различает дополнительное наблюдение","notes":["Кавеолы: распластывание или уход внутрь различают, остановив отделение пузырьков.","Цикл носителя: при нарушенном восстановлении SNARE первые носители сливаются.","Рецептор трансферрина: число на поверхности — баланс ухода и возвращения.","Ядерный белок: выключение экспорта показывает, работает ли импорт."],"static":["Кавеолы, цикл носителя, рецептор трансферрина, ядерный белок: наблюдение → два объяснения → различающее наблюдение."]}},"level":"adv"},{"id":"methods","section":4,"questions":[1,2,3,4],"title":"Как узнают, на каком этапе остановился груз","keywords":["метод","иммунофлуоресценция","электронная микроскопия","фотообесцвечивание","бесклеточная система"],"lead":["Во многих экспериментах семинара вопрос один: где оказался груз после того, как выключили деталь. Ответить на него помогают разные методы, и у каждого — своя измеряемая величина, свой контроль и свои ограничения.","Шаг собирает методы, которые встретились в продвинутых шагах разделов 1–4. Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Электронная микроскопия показывает форму мембран — впяченную ямку, суженную шейку, трубку (БИО-3·4; Damke et al., 1994).","Иммунофлуоресценция с белками-маркерами компартментов показывает, с каким компартментом совпадает груз: LAMP1 — маркер лизосом и поздних эндосом, EEA1 — ранних эндосом (БИО-3·22; Steinberg et al., 2013).","Бесклеточная система из мембран и цитозоля позволяет выключить один компонент и вернуть его очищенным (БИО-3·13; Block et al., 1988).","Съёмка живых клеток и фотообесцвечивание измеряют время: как быстро меняется метка эндосомы или выравнивается белок между ядром и цитоплазмой (БИО-3·21, 3·28)."],"paragraphs":["Измеряемую величину выбирают по вопросу. Если нужно узнать, образовался ли носитель, смотрят форму мембраны; если нужно узнать, куда попал груз, — его положение относительно маркеров компартментов; если нужно узнать, какой белок необходим, — выключают его и возвращают очищенным или синтезированным заново.",{"h":"Контроль и ограничения"},"Контроль — тот же эксперимент без вмешательства или с вмешательством, которое не должно действовать (белок дикого типа вместо мутантного, контрольная РНК, сигнал с заменой ключевого остатка). Типичные артефакты: избыточный синтез меченого белка, неспецифическое действие ингибитора (например, N-этилмалеимида), перенос выводов с одного типа клеток на другие.","Измерение само по себе показывает, где находится груз или как выглядит мембрана, — это наблюдение. Необходимость детали доказывает вмешательство (удаление, мутация, подавление синтеза) вместе с таким измерением; достаточность добавления — перенос сигнала на другой белок или восстановление функции очищенным белком в системе, где остальные компоненты сохранены. Некоторые работы семинара измеряли свойство, а не необходимость детали: скорость прохода через пору (Timney et al., 2016), натяжение мембраны (Sinha et al., 2011), сродство лиганда к рецептору при разном pH (Dautry-Varsat et al., 1983)."],"conditions":"Обобщение методов из продвинутых шагов семинара; числа и условия — в соответствующих шагах. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Damke1994","Block1988","Rink2005","Steinberg2013","Timney2016"],"quiz":{"id":"S3-L30","question":"Нужно проверить, попадает ли белок в лизосомы после выключения SNX27. Какую величину измерить?","options":[{"id":"S3-L30-1","text":"Форму клатриновых ямок в электронной микроскопии","correct":false,"feedback":"Форма ямок говорит об образовании носителя на поверхности, а не о том, куда груз попал после эндосомы."},{"id":"S3-L30-2","text":"Скорость выравнивания белка между ядром и цитоплазмой","correct":false,"feedback":"Эта величина описывает проход через ядерную пору; к лизосомам она отношения не имеет."},{"id":"S3-L30-3","text":"Положение белка относительно маркера лизосом LAMP1","correct":true,"feedback":"Увеличение совпадения с LAMP1 согласуется с доставкой белка в лизосомные компартменты; расщепление подтверждают отдельным измерением — так и сделано в работе (Steinberg et al., 2013)."}]},"widget":{"kind":"addr","title":"","s":{"title":"Выберите метод и посмотрите, что он измеряет","noarrows":true,"status":"Обобщение методов семинара","modes_label":"Метод","modes":["электронная микроскопия","иммунофлуоресценция","бесклеточная система","фотообесцвечивание"],"h":["Что измеряется","Контроль","Чего не доказывает"],"rows":[["форма мембран:\nямки, шейки,\nтрубки","клетки без\nвмешательства","какой белок\nсужает шейку"],["в каком\nкомпартменте\nгруз","контрольная\nРНК","как белок\nне пускает груз"],["перенос между\nмембранами","необработанные\nмембраны","этап, на котором\nработает белок"],["скорость\nвыравнивания","белки одного\nстроения","перенос на\nдругие клетки"]],"foot":"измерение описывает состояние; необходимость показывает вмешательство","notes":["Damke et al., 1994: в клетках с мутантным динамином ямки впячены, но не сужаются.","Steinberg et al., 2013: без SNX27 GLUT1 совпадает с маркером лизосом LAMP1.","Block et al., 1988: после N-этилмалеимида перенос возвращает очищенный NSF.","Timney et al., 2016: белок 67 кДа выравнивается между ядром и цитоплазмой за минуты."],"static":["Электронная микроскопия — форма мембран; иммунофлуоресценция — компартмент; бесклеточная система — необходимый белок; фотообесцвечивание — скорость прохода."]}},"num":30,"level":"adv","badge":"сверх программы · научное дополнение"},{"id":"investigation","section":4,"questions":[1,2,3,4],"title":"Путь одного груза через клетку: трансцитоз IgA","keywords":["путь груза","трансцитоз","IgA","рецептор","носитель","эндосома"],"lead":["Проследим один груз — димерный IgA, который эпителиальная клетка переносит от базолатеральной поверхности к апикальной ([[T27|трансцитоз]]), — и на каждом этапе назовём, что происходит и что для этого нужно.","Шаг повторяет материал разделов 1–3 на новом примере.","Научное дополнение — на коллоквиуме и зачёте не требуется; для продвинутых исследований знать его не нужно."],"mechanism":["Базолатеральная поверхность: IgA связывается с полимерным иммуноглобулиновым рецептором; рецептор собирается в покрытой клатрином ямке, его цитоплазматический участок связывают адаптерные белки; покрытую везикулу отделяет динамин (условие примера).","Цитоплазма: везикула сбрасывает клатриновую оболочку и сливается с ранней эндосомой с участием SNARE-белков.","Эндосомы: комплекс IgA с рецептором не диссоциирует и переносится через эндосомы к апикальной мембране.","Апикальная мембрана: рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом."],"paragraphs":["Этот путь отличается от самого частого тем, что лиганд не отделяется от рецептора в ранней эндосоме, а рецептор не возвращается: его внеклеточная часть уходит в секрет вместе с IgA. Поэтому одна молекула рецептора переносит IgA один раз (вспомнить БИО-3·16, 3·17).","Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.","Сравните с белком, идущим в ядро: там нет мембранных носителей, а груз проходит через водный канал комплекса ядерной поры с транспортным рецептором (БИО-3·24, 3·25)."],"conditions":"Обобщение материала разделов 1–3. Условие примера: рецептор с IgA захватывается через покрытые клатрином ямки, как рецепторный груз в шаге БИО-3·2. Схема-таблица качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L31","question":"Где IgA отделяется от полимерного иммуноглобулинового рецептора при трансцитозе?","options":[{"id":"S3-L31-1","text":"Нигде в клетке: на апикальной мембране рецептор расщепляется, и IgA выделяется вместе с его внеклеточной частью","correct":true,"feedback":"IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом."},{"id":"S3-L31-2","text":"В ранней эндосоме, как большинство лигандов","correct":false,"feedback":"Комплекс IgA с рецептором в эндосомах не диссоциирует и переносится к апикальной мембране."},{"id":"S3-L31-3","text":"В лизосоме, где рецептор расщепляется","correct":false,"feedback":"Комплекс идёт не в лизосому, а к апикальной мембране; рецептор расщепляется там."}]},"widget":{"kind":"addr","title":"","s":{"title":"Пройдите путь IgA по этапам","noarrows":true,"status":"Обобщение","modes_label":"Этап","modes":["базолатеральная поверхность","носитель","эндосомы","апикальная мембрана"],"h":["Что происходит","Что для этого нужно","Где оказывается груз"],"rows":[["IgA связывается\nс рецептором;\nрецептор — в ямке","адаптерные белки,\nклатрин, динамин","в покрытой\nклатрином\nвезикуле"],["разборка оболочки\nи слияние\nс эндосомой","Rab-белки,\nSNARE-белки","в ранней\nэндосоме"],["комплекс\nне диссоциирует","сортировка\nв эндосомах","в везикулах,\nидущих к апикальной\nмембране"],["рецептор\nрасщепляется","расщепление\nрецептора","IgA с секреторным\nкомпонентом —\nв секрете"]],"foot":"в схеме одна молекула рецептора переносит IgA один раз","notes":["IgA связывается с полимерным иммуноглобулиновым рецептором; рецептор собирается в покрытой клатрином ямке.","Везикула теряет оболочку и сливается с ранней эндосомой.","Комплекс IgA с рецептором не диссоциирует и переносится к апикальной мембране.","Рецептор расщепляется; IgA выделяется в секрет вместе с секреторным компонентом."],"static":["Базолатеральная поверхность → покрытая клатрином везикула → эндосомы → апикальная мембрана: комплекс не распадается до расщепления рецептора."]}},"num":31,"level":"adv","badge":"сверх программы · научное дополнение"}],"sections":[{"title":"Эндоцитоз: механизмы и признаки","entry":"endo-routes","sub":"Что захватывается, каким носителем и какие белки для этого нужны"},{"title":"Цикл транспортного носителя","entry":"carrier-cycle","sub":"Оболочка, отделение, разборка оболочки, узнавание мишени и слияние"},{"title":"Рецептор и лиганд после эндоцитоза","entry":"early-endosome","sub":"Ранняя эндосома, пути рецептора и лиганда, поздняя эндосома и лизосома"},{"title":"Ядерная пора и общий принцип адресации","entry":"envelope-pore","sub":"Диффузия малых молекул, импорт и экспорт с рецепторами, градиент Ran, метка — рецептор — механизм"},{"title":"Исследование","entry":"methods","sub":"Методы семинара и путь одного груза через эпителиальную клетку"}],"glossary":[{"id":"S3-T01","term":"Эндоцитоз","section":0,"def":"Общее название процессов везикулярного транспорта, при которых вещества поступают в клетку в мембранных пузырьках, образованных из плазматической мембраны."},{"id":"S3-T02","term":"Микропиноцитоз","section":0,"def":"Постоянное неспецифическое поглощение жидкости и небольших белковых молекул в мелких пузырьках (менее 150 нм). Такие пузырьки образуются разными путями — из покрытых клатрином ямок и без клатрина."},{"id":"S3-T03","term":"Макропиноцитоз","section":0,"def":"Регулируемый захват внеклеточной жидкости: перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы более 0,2 мкм."},{"id":"S3-T04","term":"Фагоцитоз","section":0,"def":"Поглощение крупных частиц (бактерий, обломков клеток, пыли) специализированными фагоцитами; псевдоподии охватывают частицу, образуется фагосома более 250 нм."},{"id":"S3-T05","term":"Рецептор-опосредованный эндоцитоз","section":0,"def":"Захват молекул, которые связываются со своими рецепторами на поверхности клетки. Во многих клетках животных растворённые макромолекулы так поступают через покрытые клатрином ямки: рецепторы с грузом через адаптеры связываются с клатрином, и ямка становится покрытой клатрином везикулой. Узнавание груза рецептором бывает и в клатрин-независимых путях, например при фагоцитозе."},{"id":"S3-T06","term":"Рецептор груза","section":0,"def":"Трансмембранный белок, который снаружи связывает определённый груз, а цитоплазматическим участком — белок-адаптер."},{"id":"S3-T07","term":"Белок-адаптер","section":0,"def":"Белок, связывающий цитоплазматический участок рецептора груза с клатрином, например адаптин."},{"id":"S3-T08","term":"Клатрин","section":0,"def":"Белок оболочки, который собирается в решётку с цитоплазматической стороны мембраны и изгибает её в ямку."},{"id":"S3-T09","term":"Динамин","section":0,"def":"ГТФаза, которая обеспечивает отшнуровывание покрытой клатрином везикулы от мембраны: динамин собирается спиралью вокруг шейки ямки, и после гидролиза ГТФ мембрана шейки смыкается."},{"id":"S3-T10","term":"Кавеола","section":0,"def":"Сверх программы: колбовидная инвагинация плазматической мембраны 50–100 нм, образованная кавеолинами и кавинами и обогащённая холестерином и сфинголипидами. При механической нагрузке кавеолы служат резервом мембраны и смягчают её; эндоцитоз кавеол возможен, но, по современным оценкам, не главная их функция, а его масштаб в разных клетках неизвестен."},{"id":"S3-T11","term":"Натяжение мембраны","section":0,"def":"Сверх программы: сила, растягивающая мембрану в её плоскости, в расчёте на единицу длины (мН/м); растёт, когда площадь клетки должна увеличиться (например, при набухании), а запаса мембраны нет."},{"id":"S3-T12","term":"Асимметрия мембраны","section":0,"def":"Сверх программы: различие липидного состава наружного и цитоплазматического листков плазматической мембраны."},{"id":"S3-T13","term":"Транспортный носитель","section":1,"def":"Мембранный пузырёк (везикула), который образуется почкованием от мембраны одного компартмента и сливается с мембраной другого, перенося груз между ними."},{"id":"S3-T14","term":"Оболочка носителя","section":1,"def":"Белковый слой, который собирается на мембране-доноре, отбирает груз и изгибает мембрану в носитель: COP-II, COP-I или клатрин с адаптерами."},{"id":"S3-T15","term":"COP-II","section":1,"def":"Оболочка носителей, переносящих только что синтезированные белки из грЭПР в цис-сеть аппарата Гольджи (антероградный транспорт)."},{"id":"S3-T16","term":"COP-I","section":1,"def":"Оболочка носителей ретроградного транспорта: из аппарата Гольджи в грЭПР и между цистернами аппарата Гольджи."},{"id":"S3-T17","term":"SNARE-белки","section":1,"def":"Белки слияния мембран: SNARE носителя (v-SNARE) и SNARE мембраны-мишени (t-SNARE) собираются в комплекс и обеспечивают слияние. По остатку в центре комплекса их делят также на R-SNARE (аргинин) и Q-SNARE (глутамин); это другая классификация, а не новое название v- и t-SNARE (БИО-3·12)."},{"id":"S3-T18","term":"Rab-белки и белки первоначального узнавания и удержания транспортного носителя","section":1,"def":"Белки, которые первыми узнают мембрану-мишень: Rab в активной форме (связанный с ГТФ) отмечает мембрану и привлекает длинные удерживающие белки, которые держат подходящий носитель у мишени до сборки SNARE. В текстах семинара — кратко «удерживающие белки». Научная справка: в англоязычной литературе — tethering factors."},{"id":"S3-T19","term":"Ранняя эндосома","section":1,"def":"Сортировочный компартмент, который образуется при слиянии эндоцитозных везикул друг с другом; обычно около 10 минут принимает новые везикулы, а затем созревает в позднюю эндосому."},{"id":"S3-T20","term":"NSF","section":1,"def":"АТФаза, чувствительная к N-этилмалеимиду (англ. N-ethylmaleimide-sensitive factor): после слияния разбирает SNARE-комплекс. Сверх программы: работает вместе с белками α-SNAP — растворимыми белками, связывающими NSF."},{"id":"S3-T21","term":"Пора слияния","section":1,"def":"Сверх программы: канал, который соединяет просвет носителя с просветом мишени (или с внеклеточной средой при экзоцитозе) в момент слияния мембран."},{"id":"S3-T22","term":"Гемислияние","section":1,"def":"Сверх программы: промежуточное состояние слияния, при котором слиты только обращённые друг к другу (проксимальные) монослои двух мембран, а поры ещё нет."},{"id":"S3-T23","term":"Рециркуляция рецептора","section":2,"def":"Возврат рецептора из ранней эндосомы на поверхность клетки в везикулах, отпочковывающихся от эндосомы; позволяет клетке постоянно и избирательно захватывать вещество."},{"id":"S3-T24","term":"Поздняя эндосома","section":2,"def":"Эндосома, в которую созревает ранняя: её среда кислее, она лежит глубже в цитоплазме; мембрана поздней эндосомы впячивается внутрь, образуя мультивезикулярное тельце."},{"id":"S3-T25","term":"Мультивезикулярное тельце","section":2,"def":"Поздняя эндосома с внутрипросветными везикулами, образованными впячиванием её мембраны в просвет; мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется."},{"id":"S3-T26","term":"Убиквитин","section":2,"def":"Небольшой белок, который присоединяется к другим белкам как метка; убиквитинированный рецептор включается в мембрану внутрипросветных везикул и разрушается в лизосоме."},{"id":"S3-T27","term":"Трансцитоз","section":2,"def":"Перенос рецептора с лигандом через клетку — например, димерного IgA с полимерным иммуноглобулиновым рецептором от базолатеральной поверхности эпителиальной клетки к апикальной."},{"id":"S3-T28","term":"Трансферрин","section":2,"def":"Сверх программы: белок плазмы крови, переносящий железо; отдаёт железо в кислой эндосоме, а сам вместе с рецептором возвращается на поверхность клетки."},{"id":"S3-T29","term":"Rab5 и Rab7","section":2,"def":"Малые ГТФазы — метки ранней (Rab5) и поздней (Rab7) эндосомы. Сверх программы: при созревании эндосомы Rab5 на её мембране сменяется Rab7."},{"id":"S3-T30","term":"SNX27–ретромер","section":2,"def":"Сверх программы: комплекс на ранней эндосоме, который узнаёт концевой PDZ-лиганд мембранного белка и возвращает белок на поверхность вместо лизосомы."},{"id":"S3-T31","term":"Ядерная оболочка","section":3,"def":"Две мембраны с перинуклеарным пространством между ними; наружная мембрана продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами."},{"id":"S3-T32","term":"Комплекс ядерной поры","section":3,"def":"Белковый комплекс в поре ядерной оболочки, построенный примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; белки с FG-повторами создают в нём селективный барьер."},{"id":"S3-T33","term":"Сигнал ядерной локализации (NLS)","section":3,"def":"Участок белка, по которому его узнаёт импортин и переносит из цитоплазмы в ядро."},{"id":"S3-T34","term":"Последовательность ядерного экспорта (NES)","section":3,"def":"Участок белка, по которому его в ядре узнаёт экспортин и переносит в цитоплазму."},{"id":"S3-T35","term":"Импортин и экспортин","section":3,"def":"Ядерные транспортные рецепторы (кариоферины): импортин связывает белки с NLS и переносит их в ядро, экспортин — белки с NES из ядра; оба процесса идут при участии ГТФ."},{"id":"S3-T36","term":"Градиент Ran","section":3,"def":"Различие состояний малой ГТФазы Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме; задаёт направление переноса через пору."},{"id":"S3-T37","term":"Сигнал сортировки","section":3,"def":"Участок аминокислотной цепи белка или его модификация (например, маннозо-6-фосфат или присоединённый убиквитин), по которым сортировочный аппарат клетки направляет белок к месту назначения."},{"id":"S3-T38","term":"Трискелион","section":0,"def":"Сверх программы: трёхлучевая единица клатриновой оболочки из трёх тяжёлых и трёх лёгких цепей клатрина; трискелионы собираются в решётку из шести- и пятиугольников."},{"id":"S3-T39","term":"Решётка клатрина (плоская и изогнутая)","section":0,"def":"Сверх программы: слой трискелионов на цитоплазматической стороне мембраны; плоская решётка состоит в основном из шестиугольников, изогнутая содержит и пятиугольники; изгибаясь, решётка превращает участок мембраны в ямку."},{"id":"S3-T40","term":"Белки-инициаторы сборки ямки","section":0,"def":"Сверх программы: белки (Eps15, FCHO и другие), которые собираются на месте будущей клатриновой ямки раньше клатрина и образуют сеть, удерживающую адаптеры: в пробирке — жидкоподобные капли, в клетке подвижность оценивают по восстановлению флуоресценции после обесцвечивания; слишком слабая сеть распадается, слишком прочная теряет подвижность."},{"id":"S3-T41","term":"Участок выхода из ЭПР","section":0,"def":"Сверх программы: свободный от рибосом участок мембраны грЭПР, на котором собирается оболочка COP-II и отпочковываются носители к аппарату Гольджи."},{"id":"S3-T42","term":"Промежуточный компартмент ЭПР–Гольджи","section":0,"def":"Сверх программы: мембраны между грЭПР и цис-сетью аппарата Гольджи; принимают носители с COP-II, от них отпочковываются носители с COP-I."},{"id":"S3-T43","term":"Рибосома","section":0,"def":"Частица из рРНК и белков, на которой синтезируется белок; рибосомы, синтезирующие белки секреторного пути, прикреплены к мембране грЭПР."},{"id":"S3-T44","term":"Проколлаген","section":0,"def":"Сверх программы: предшественник коллагена — тройная спираль, собранная в ЭПР в жёсткую палочковидную молекулу длиной около 300 нм."},{"id":"S3-T45","term":"Разрешение микроскопа","section":0,"def":"Наименьшее расстояние, на котором два объекта видны раздельно; у светового микроскопа около 200 нм, у электронного — единицы нанометров и меньше."},{"id":"S3-T46","term":"Синаптический пузырёк","section":0,"def":"Сверх программы: мелкий (около 40 нм) мембранный пузырёк нервного окончания, заполненный медиатором; выделяет медиатор при слиянии с пресинаптической мембраной."},{"id":"S3-T47","term":"Синаптобревин","section":0,"def":"Сверх программы: SNARE-белок мембраны синаптического пузырька (R-SNARE, другое название — VAMP2); его расщепляет тетанотоксин, и слияние пузырька с мембраной прекращается."},{"id":"S3-T48","term":"Липопротеин низкой плотности (ЛПНП)","section":0,"def":"Сверх программы: частица крови, переносящая холестерин: ядро из эфиров холестерина окружено оболочкой из фосфолипидов, холестерина и одной молекулы белка apoB100."},{"id":"S3-T49","term":"Рецептор ЛПНП","section":0,"def":"Сверх программы: трансмембранный рецептор, связывающий ЛПНП на поверхности клетки; в кислой ранней эндосоме ЛПНП отделяется, и рецептор возвращается на поверхность."},{"id":"S3-T50","term":"Иммуноглобулин G (IgG)","section":0,"def":"Основной класс антител плазмы крови; константный Fc-участок молекулы связывается с Fc-рецепторами клеток."},{"id":"S3-T51","term":"Неонатальный Fc-рецептор (FcRn)","section":0,"def":"Сверх программы: рецептор, связывающий Fc-участок IgG при pH 5–6 и не связывающий его при pH 7,4; возвращает IgG из эндосом на поверхность клетки и тем защищает его от расщепления в лизосомах."},{"id":"S3-T52","term":"pH эндосомы","section":0,"def":"Кислотность просвета эндосомы; снижается по мере созревания эндосомы за счёт протонной АТФазы её мембраны; в лизосоме среда самая кислая."},{"id":"S3-T53","term":"Лизосома","section":0,"def":"Мембранный органоид с кислой средой и гидролазами, в котором расщепляются макромолекулы, поступившие эндоцитозом и аутофагией."},{"id":"S3-T54","term":"SNX17","section":0,"def":"Сверх программы: белок ранней эндосомы из семейства сортирующих нексинов; связывает в хвосте груза мотив NPxY; без груза его собственный C-концевой участок блокирует участок связывания груза (аутоингибирование)."},{"id":"S3-T55","term":"Ретривер и Commander","section":0,"def":"Сверх программы: ретривер — комплекс трёх белков, родственный ретромеру; вместе с комплексом CCC и белком DENND10 он образует Commander из 16 субъединиц, возвращающий груз из эндосомы на поверхность клетки; SNX17 передаёт ему груз."},{"id":"S3-T56","term":"ESCPE-1","section":0,"def":"Сверх программы: комплекс сортирующих нексинов, изгибающий мембрану эндосомы в трубчатый носитель возврата; принимает груз от SNX27–ретромера."},{"id":"S3-T57","term":"Мембрана поры","section":0,"def":"Сверх программы: участок ядерной оболочки, где наружная и внутренняя мембраны переходят друг в друга и окружают комплекс ядерной поры."},{"id":"S3-T58","term":"Кольца каркаса поры","section":0,"def":"Сверх программы: цитоплазматическое, внутреннее и ядерное кольца, из которых построен каркас комплекса ядерной поры; внутреннее кольцо встроено в мембрану поры, и его диаметр сильнее всего меняется с натяжением ядерной оболочки."},{"id":"S3-T59","term":"FG-повторы","section":0,"def":"Сверх программы: участки нуклеопоринов, богатые фенилаланином (F) и глицином (G) и лишённые устойчивой пространственной структуры; заполняют центральный канал поры сетью, которая задерживает крупные инертные молекулы и пропускает транспортные рецепторы."},{"id":"S3-T60","term":"Ядерная корзина","section":0,"def":"Сверх программы: нити белков, отходящие от ядерного кольца поры в нуклеоплазму."},{"id":"S3-T61","term":"Комплекс LINC","section":0,"def":"Сверх программы: белковый комплекс, связывающий нуклеоскелет с цитоскелетом через обе мембраны ядерной оболочки и передающий механическую силу на ядро."},{"id":"S3-T62","term":"Капсид ВИЧ-1","section":0,"def":"Сверх программы: конусовидная белковая оболочка размером около 120 × 60 нм, внутри которой геном вируса иммунодефицита человека переносится к ядру."},{"id":"S3-T63","term":"Светочувствительный модуль Cry2","section":0,"def":"Сверх программы: белковый модуль растения, который на синем свету сцепляется с такими же модулями; соединённый с другим белком, позволяет светом усиливать сцепление его молекул."},{"id":"S3-T64","term":"Медиатор","section":0,"def":"Вещество, которое нервное окончание выделяет в синаптическую щель при слиянии синаптических пузырьков с пресинаптической мембраной, например глутамат."},{"id":"S3-T65","term":"Активная зона","section":0,"def":"Сверх программы: участок пресинаптической мембраны, у которого удерживаются синаптические пузырьки и происходит их слияние."},{"id":"S3-T66","term":"Тетанотоксин","section":0,"def":"Сверх программы: белковый токсин возбудителя столбняка — протеаза, расщепляющая синаптобревин; без синаптобревина синаптические пузырьки не сливаются с мембраной."},{"id":"S3-T67","term":"Сверхбыстрый эндоцитоз","section":0,"def":"Сверх программы: захват мембраны на краю активной зоны в первые сотни миллисекунд после выброса медиатора."},{"id":"S3-T68","term":"Геном вируса","section":0,"def":"Сверх программы: РНК ВИЧ-1 в капсиде; в ядре после обратной транскрипции интегрируется в геном клетки-хозяина."},{"id":"S3-T69","term":"PCSK9","section":0,"def":"Сверх программы: белок плазмы крови, который связывает рецептор ЛПНП и направляет его в лизосомы на расщепление вместо возврата на поверхность клетки."},{"id":"S3-T70","term":"Ингибитор PCSK9","section":0,"def":"Сверх программы: вещество, связывающее PCSK9 и тем сохраняющее рецепторы ЛПНП от расщепления; снижает ХС-ЛПНП в крови."},{"id":"S3-T71","term":"Угол замыкания ямки","section":0,"def":"Сверх программы: угол θ, которым описывают форму решётки как сферического колпачка: 0° — плоская решётка, 90° — полусфера, 180° — замкнутая сфера."},{"id":"S3-T72","term":"Площадь проекции","section":0,"def":"Сверх программы: площадь пятна, которое решётка занимает на изображении, если смотреть на мембрану снизу; при изгибе решётки она меньше площади самой решётки."},{"id":"S3-T73","term":"Кавеолин","section":0,"def":"Сверх программы: интегральный белок мембраны, образующий кавеолы; его комплексы встроены в цитоплазматический листок. При распластывании кавеолы кавеолин остаётся в плоской мембране."},{"id":"S3-T74","term":"Кавины","section":0,"def":"Сверх программы: белки цитоплазмы, которые образуют оболочку кавеолы с цитоплазматической стороны мембраны и вместе с кавеолином поддерживают форму впячивания. При распластывании кавеолы кавины частично отделяются от кавеолина и переходят в цитоплазму."},{"id":"S3-T75","term":"Челночный белок","section":0,"def":"Белок, у которого есть и сигнал ядерной локализации (NLS), и сигнал ядерного экспорта (NES): импортин переносит его в ядро, экспортин — обратно. Где такого белка больше, определяет соотношение скоростей импорта и экспорта."}],"sources":{"Alberts2022":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»","doi":"","pmid":""},"Damke1994":{"url":"https://doi.org/10.1083/jcb.127.4.915","cite":"Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934","doi":"10.1083/jcb.127.4.915","pmid":"7962076"},"Lennartz2026":{"url":"https://doi.org/10.1038/s41556-026-02068-7","cite":"Lennartz H. M. et al. Quantification of lipid sorting during clathrin-mediated endocytosis. Nat Cell Biol. 2026;28:2027–2035","doi":"10.1038/s41556-026-02068-7","pmid":""},"Parton2026":{"url":"https://doi.org/10.1038/s41556-026-01945-5","cite":"Parton R. G., Kozlov M. M., Lundmark R. A lipid-centric view of endocytosis by caveolae. Nat Cell Biol. 2026;28:852–860","doi":"10.1038/s41556-026-01945-5","pmid":""},"Sinha2011":{"url":"https://doi.org/10.1016/j.cell.2010.12.031","cite":"Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413","doi":"10.1016/j.cell.2010.12.031","pmid":"21295700"},"Lamaze2026":{"url":"https://doi.org/10.1038/s41580-026-00964-2","cite":"Lamaze C., Blouin C. M., Sens P. Caveolae mechanics in cellular functions and disease. Nat Rev Mol Cell Biol. 2026;27:581–600","doi":"10.1038/s41580-026-00964-2","pmid":""},"Block1988":{"url":"https://doi.org/10.1073/pnas.85.21.7852","cite":"Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856","doi":"10.1073/pnas.85.21.7852","pmid":""},"Jahn2024":{"url":"https://doi.org/10.1038/s41580-023-00668-x","cite":"Jahn R., Cafiso D. C., Tamm L. K. Mechanisms of SNARE proteins in membrane fusion. Nat Rev Mol Cell Biol. 2024;25:101–118","doi":"10.1038/s41580-023-00668-x","pmid":""},"WuChan2024":{"url":"https://doi.org/10.1038/s41467-023-44539-7","cite":"Wu L.-G., Chan C. Y. Membrane transformations of fusion and budding. Nat Commun. 2024;15:21","doi":"10.1038/s41467-023-44539-7","pmid":""},"DautryVarsat1983":{"url":"https://doi.org/10.1073/pnas.80.8.2258","cite":"Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983 2022;20:e3001601","doi":"10.1371/journal.pbio.3001601","pmid":"35417450"},"Healy2023":{"url":"https://doi.org/10.1016/j.cell.2023.04.003","cite":"Healy M. D. et al. Structure of the endosomal Commander complex linked to Ritscher–Schinzel syndrome. Cell. 2023;186:2219–2237.e29","doi":"10.1016/j.cell.2023.04.003","pmid":"37172566"},"Ballantyne2023":{"url":"https://doi.org/10.1016/j.jacc.2023.02.018","cite":"Ballantyne C. M. et al. Phase 2b randomized trial of the oral PCSK9 inhibitor MK-0616. J Am Coll Cardiol. 2023;81(16):1553–1564","doi":"10.1016/j.jacc.2023.02.018","pmid":""},"Lusk2025":{"url":"https://doi.org/10.1038/s41556-025-01768-w","cite":"Lusk C. P., Morgan K. J., King M. C. Nuclear mechanics as a determinant of nuclear pore complex plasticity. Nat Cell Biol. 2025;27:1622–1631","doi":"10.1038/s41556-025-01768-w","pmid":"40973737"},"Schuller2021":{"url":"https://doi.org/10.1038/s41586-021-03985-3","cite":"Schuller A. P. et al. The cellular environment shapes the nuclear pore complex architecture. Nature. 2021;598:667–671","doi":"10.1038/s41586-021-03985-3","pmid":"34646014"},"Zila2021":{"url":"https://doi.org/10.1016/j.cell.2021.01.025","cite":"Zila V. et al. Cone-shaped HIV-1 capsids are transported through intact nuclear pores. Cell. 2021;184:1032–1046.e18","doi":"10.1016/j.cell.2021.01.025","pmid":"33571428"},"Kreysing2025":{"url":"https://doi.org/10.1016/j.cell.2024.12.008","cite":"Kreysing J. P. et al. Passage of the HIV capsid cracks the nuclear pore. Cell. 2025;188(4):930–943.e21","doi":"10.1016/j.cell.2024.12.008","pmid":"39826544"},"Fu2024":{"url":"https://doi.org/10.1038/s41586-023-06966-w","cite":"Fu L., Weiskopf E. N., Akkermans O., Swanson N. A., Cheng S., Schwartz T. U., Görlich D. HIV-1 capsids enter the FG phase of nuclear pores like a transport receptor. Nature. 2024;626:843–851","doi":"10.1038/s41586-023-06966-w","pmid":"38267583"}},"questions":["Эндоцитоз","Цикл носителя","Рецептор и лиганд","Ядерная пора"],"exam_ids":["endo-routes","coated-pit","actin-uptake","carrier-cycle","uncoating","docking-fusion","early-endosome","four-routes","recycling-gain","envelope-pore","nls-importin","address-principle"],"practice_url":"seminar-3.html","open_questions":[{"q":"Макрофагу в культуре одновременно дали раствор с растворённым красителем, лиганд, который поступает в клетку через клатриновые ямки, и крупные частицы. Объясните, какими путями и в каких носителях каждый груз может попасть в клетку и какой белок нужно выключить, чтобы нарушить только избирательный захват лиганда.","crit":"Названы пути: микропиноцитоз (пузырьки < 150 нм), рецептор-опосредованный эндоцитоз (покрытые клатрином везикулы), фагоцитоз (фагосома > 250 нм; макрофаг — специализированный фагоцит); выключить клатрин (или адаптер); объяснено, почему захват жидкости при этом продолжается (макропиносомы и мелкие носители без клатрина) и почему небольшая часть лиганда может попасть в клетку вместе с жидкостью."},{"q":"Объясните, почему цикл транспортного носителя может повторяться многократно: что происходит после отделения носителя с белками оболочки и после слияния — с SNARE-комплексом и мембранными белками носителя.","crit":"Названо: оболочка разбирается с отделившегося носителя, её белки возвращаются в цитоплазму и снова собираются на мембране-доноре; после слияния SNARE-комплекс разбирается АТФазой NSF, и SNARE-белки снова готовы к слиянию; при экзоцитозе мембранные белки везикулы вместе с участком плазмолеммы возвращаются в клетку путём эндоцитоза."},{"q":"Сравните путь белка-переносчика, который не отделяется от рецептора в ранней эндосоме и вместе с ним возвращается на ту же поверхность клетки, где при нейтральном pH отделяется от рецептора, и путь димерного IgA с полимерным иммуноглобулиновым рецептором в эпителиальной клетке. Где в каждом случае комплекс распадается и сколько раз может работать одна молекула рецептора?","crit":"Белок-переносчик: комплекс не диссоциирует в ранней эндосоме, возвращается на поверхность и по условию распадается там при нейтральном pH; рецептор работает многократно. IgA: комплекс, захваченный на базолатеральной поверхности, переносится через эндосомы к апикальной мембране; рецептор расщепляется, и IgA выделяется в секрет вместе с секреторным компонентом; одна молекула рецептора переносит IgA один раз. Названо общее: в обоих случаях лиганд не отделяется от рецептора в ранней эндосоме."},{"q":"Объясните, как крупный белок, который работает в ядре лишь временно и пассивно проходит пору пренебрежимо мало, покидает ядро: какой сигнал на нём должен быть, какой белок этот сигнал узнаёт и почему без Ran-ГТФ белок останется в ядре.","crit":"Названы последовательность ядерного экспорта (NES) и экспортин, который связывает белок в ядре и переносит его в цитоплазму; экспорт идёт при участии ГТФ. Ran-ГТФ преобладает в ядре и стабилизирует комплекс экспортина с грузом до выхода; гидролиз ГТФ не проталкивает груз, а поддерживает различие состояний Ran по сторонам оболочки. Без Ran-ГТФ комплекс экспортина с грузом не образуется, рецепторный экспорт нарушен, и за время наблюдения крупный белок остаётся в ядре."}]};
/* Объяснения к семинару 3. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => s.replace(/(шаге? )?БИО-3·(\d+)((?:, 3·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
const rt = s => stepRefs(esc(s)).replace(/\[\[(T\d{2,3})\|([^\]]+)\]\]/g, (_, id, t) => `<a class="gl" href="#glossary-S3-${id}" data-gloss="S3-${id}">${t}</a>`)
  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */
const ncap = s => esc(s).replace(/Ca(?=²⁺)/g, '<span style="text-transform:none">Ca</span>');
const plain = s => String(s).replace(/\[\[(T\d{2,3}|https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, '$2');

/* ---------- хранение: один ключ, шаги и итоговая проверка раздельно ---------- */
const KEY = 'bio-s3-explanations-v1-progress';
let store = {v: 1, steps: {}, exam: {}}, state = {}, current = 'home';
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.v === 1) store = {v: 1, steps: raw.steps || {}, exam: raw.exam || {}, last: raw.last || null};
} catch (e) {}
/* ревизия вопроса (quiz.rev, по умолчанию 1): после содержательной правки вопроса rev увеличивают, и прежняя отметка не засчитывается;
   записи шагов, которых больше нет, не учитываются. Записи без rev считаются rev 1 — прежний прогресс сохраняется. */
const qrev = l => l.quiz.rev || 1;
(function () {
  const cur = {}; CONTENT.lessons.forEach(l => { cur[l.id] = qrev(l); });
  ['steps', 'exam'].forEach(k => Object.keys(store[k]).forEach(id => { const r = store[k][id]; if (!(id in cur) || !r || (r.rev || 1) !== cur[id]) delete store[k][id]; }));
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} renderNav(); };
/* v1.8: запоминаем, где читатель остановился. iPhone и встроенные браузеры при возврате в приложение перезагружают страницу по исходному адресу
   (без #шаг) — раньше после этого открывалась начальная страница, а шаг приходилось искать заново. Теперь шаг и положение прокрутки восстанавливаются
   (если прошло меньше 14 дней); кнопка начальной страницы в шапке по-прежнему открывает начало. */
const LAST_TTL = 14 * 24 * 3600 * 1000;
/* пишется только поле last в свежих данных хранилища: так запись положения не затирает прогресс, изменённый в другой вкладке или сброшенный */
const saveLast = (id, y) => { store.last = {id: id, y: y || 0, t: Date.now()}; try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); const base = raw && raw.v === 1 ? raw : {v: 1, steps: {}, exam: {}}; base.last = store.last; localStorage.setItem(KEY, JSON.stringify(base)); } catch (e) {} };
const rememberScroll = () => { if (store.last) saveLast(store.last.id, Math.round(window.scrollY || 0)); };
let scrollTimer = 0;
window.addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(rememberScroll, 250); }, {passive: true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') rememberScroll(); });
window.addEventListener('pagehide', rememberScroll);
const lessonById = id => CONTENT.lessons.find(x => x.id === id);
const lessonIndex = id => CONTENT.lessons.findIndex(x => x.id === id);
const stepsDone = () => CONTENT.lessons.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;

/* ---------- порядок вариантов: перемешивается при открытии страницы; ?fixed — постоянный порядок ---------- */
const params = new URLSearchParams(location.search);
const FIXQ = params.has('fixed') ? '?fixed' : '';  /* каркас с 23.10.2026 (из сем. 7 v3.8, аудит A09): ссылки на практикум сохраняют ?fixed */
const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');
const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => ORDER[l.id] || (ORDER[l.id] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id));
const optById = (l, id) => l.quiz.options.find(o => o.id === id);
const EXAM_IDS = SHUFFLE ? shuffled(CONTENT.exam_ids) : CONTENT.exam_ids.slice();
const LETTERS = ['А', 'Б', 'В'];

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {

const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {

    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');

const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;

/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);

function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */

  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

  const BL = CONTENT.lessons.filter(l => l.level !== 'adv'), nb = BL.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;   /* базовые шаги (курс «Биология», А1-22) */

function navigate(id) {

function initWidget(l) {

  const groups = CONTENT.sections.map((sec, i) => ({sec, i, items: CONTENT.glossary.filter(g => g.section === i)})).filter(g => g.items.length);
  $('main').innerHTML = `<section class="card"><div class="eyebrow">${esc(U.gl_eyebrow)}</div><h1>${esc(U.gl_h1)}</h1><p class="lead">${esc(U.gl_lead)}</p>` +
    groups.map(g => `<h2 class="gl-h">${esc(g.sec.title)}</h2><dl class="glossary">${g.items.map(t => `<div id="g-${t.id}"><dt>${esc(t.term)}</dt><dd>${rt(t.def)}</dd></div>`).join('')}</dl>`).join('') + `</section>`;

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;
    return `<path d="M${x - 2},${y1} Q${x - 7},${ym} ${x - 2},${y2}" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */
  function profile(y0, feats, x0 = 6, x1 = 594){
    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        const b0 = Math.atan2(yn - cyb, xl - f.c) + 2 * Math.PI, b1 = Math.atan2(yn - cyb, xr - f.c);
        for (let a = b0; a >= b1; a -= Math.PI / 48) P.push([f.c + R * Math.cos(a), cyb + R * Math.sin(a)]);
        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }
    flatTo(x1); return P;
  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → аппарат Гольджи (COP-II), 'gerr' — аппарат Гольджи → ЭПР (COP-I), 'intra' — между цистернами аппарата Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).
     rm: 'none' | 'coat' (нет белков оболочки) | 'uncoat' (оболочка не снимается) | 'snare' (нет SNARE на носителе).
     Возвращает { s: SVG, a: точки для подписей }. Русского текста нет. */
  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      }
      else if (rm === 'rec') {
        /* v2.0: нет узнавания мишени — носители без оболочки рассеяны в цитоплазме, у мишени их нет */
        s += ves(x0, yv, VR, coatC) + ves(xm, 168, VR, null) + ves(toR ? 250 : 350, 262, VR, null) + ves(toR ? 340 : 260, 226, VR, null);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);
    /* носитель возврата к поверхности */
    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` :
    /* v2.0: NLS закрыт связанным белком цитоплазмы (сигнал есть, но недоступен импортину) */
    tag === 'mask' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/><ellipse cx="${x + 17}" cy="${y}" rx="11" ry="9" fill="#C9B48A" stroke="#7a6a45" stroke-width="1.2"/>` :
