<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-3.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Адресация груза: метка, рецептор и механизм переноса</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-endo-routes"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 1 из 31</div><h2>Какие механизмы эндоцитоза различают и по каким признакам</h2><p class="lead"><a href="#ns-g-S3-T01">Эндоцитоз</a> — общее название путей, которыми вещества поступают в клетку в мембранных пузырьках. В семинаре рассматриваются пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Эти названия описывают разные признаки — размер и способ образования носителя, узнавание груза рецептором, — поэтому частично перекрываются: фагоцитоз тоже начинается с узнавания частицы рецепторами. Их характеристика — вопрос 8 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Четыре варианта груза: раствор — мелкие пузырьки &lt; 150 нм; раствор с фактором роста — ещё и макропиносомы &gt; 0,2 мкм; лиганд рецептора — покрытые клатрином везикулы; крупная частица — фагосома &gt; 250 нм.</div><ol class="mech"><li><a href="#ns-g-S3-T02">Микропиноцитоз</a>: мембрана постоянно образует мелкие пузырьки (&lt; 150 нм) и неспецифически захватывает жидкость.</li><li><a href="#ns-g-S3-T03">Макропиноцитоз</a>: после сигнала фактора роста перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы (&gt; 0,2 мкм).</li><li><a href="#ns-g-S3-T04">Фагоцитоз</a>: псевдоподии фагоцита охватывают крупную частицу, образуется фагосома (&gt; 250 нм).</li><li><a href="#ns-g-S3-T05">Рецептор-опосредованный эндоцитоз</a> в показанном клатрин-зависимом варианте: адаптеры связывают цитоплазматические участки рецепторов с клатриновой оболочкой, и ямка становится покрытой клатрином везикулой.</li></ol><p>Эндоцитоз делят на пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Кроме того, пути различают по тому, какие белки нужны для образования носителя: клатрин и перестройка актина.</p><p>Жидкость с растворёнными веществами клетка поглощает неспецифически: внутрь попадает то, что растворено во внеклеточной среде. Молекулы, для которых на поверхности есть рецепторы, захватываются избирательно и концентрируются в ямке. Крупные частицы — бактерии, обломки клеток, пыль — поглощают главным образом специализированные клетки-фагоциты: макрофаги, нейтрофилы, дендритные клетки.</p><p>Мелкие пузырьки микропиноцитоза — менее 150 нм; макропиносомы — более 0,2 мкм, фагосомы — более 250 нм. Макропиносомы и фагосомы образуются из выпячиваний мембраны — складок или псевдоподий, которые создаёт перестройка актина. ЗАКЛЮЧЕНИЕ: крупный носитель образуется из выпячивания, охватывающего большой объём, поэтому он и крупнее мелкого пузырька.</p><h3>Как зависимость пути от белка проверяют в эксперименте</h3><p>Белок выключают и смотрят, какие носители перестали образовываться: если без белка носитель не образуется, белок необходим для этого пути. По такому принципу устроен практикум вопроса 1 (вкладка «Эндоцитоз»).</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: считать, что любой эндоцитоз идёт через клатриновые ямки.<p class="trap-fix">Клатрин нужен показанному здесь пути захвата рецепторного груза; другие пути, в том числе начинающиеся с узнавания рецепторами (фагоцитоз), обходятся без клатрина.</p></div><div class="static-quiz"><h3>В клетке нет клатрина. Какой груз клетка по-прежнему сможет поглощать?</h3><ol><li><b>А.</b> Жидкость с растворёнными веществами <i>(верный вариант)</i><br><span class="expl">Жидкость продолжают захватывать макропиносомы и мелкие носители, которые образуются без клатрина.</span></li><li><b>Б.</b> Только молекулы, связанные с рецепторами <i>(неверный вариант)</i><br><span class="expl">Наоборот: показанный здесь избирательный захват растворённых молекул, связанных с рецепторами, идёт через клатриновые ямки и без клатрина выпадает.</span></li><li><b>В.</b> Никакой: без клатрина эндоцитоз невозможен <i>(неверный вариант)</i><br><span class="expl">Клатрин нужен не всем путям: макропиноцитоз, фагоцитоз и часть мелких пузырьков обходятся без него.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Размеры носителей приближённые. Модель упрощена: мелкие пузырьки показаны как путь, которому не нужны клатрин и перестройка актина; на самом деле часть мелких пузырьков образуется из клатриновых ямок, а при повышенном натяжении мембраны им нужна и полимеризация актина (продвинутые шаги этого раздела). Схема качественная.</p></details></article><article class="card print-unit" id="ns-coated-pit"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 2 из 31</div><h2>Как клатриновая ямка собирается вокруг рецептора с грузом</h2><p class="lead">Груз попадает в клатриновую ямку не сам: его связывает трансмембранный <a href="#ns-g-S3-T06">рецептор</a>, цитоплазматический участок рецептора связывает <a href="#ns-g-S3-T07">белок-адаптер</a>, а к адаптеру присоединяется <a href="#ns-g-S3-T08">клатрин</a>. Поэтому рецептор-опосредованный эндоцитоз избирателен: в ямке концентрируются те молекулы, для которых есть рецепторы. Это основа вопроса 9 коллоквиума; что происходит с грузом дальше — вопрос 3 практикума.</p><div class="note"><strong>Что показывает схема.</strong> Четыре этапа: связывание лиганда с рецептором → связывание рецептора с адаптером → сборка клатриновой решётки и изгиб мембраны → отделение везикулы и сброс оболочки.</div><ol class="mech"><li>Лиганд связывается с рецептором на наружной стороне мембраны.</li><li>Цитоплазматический участок рецептора связывается с белком-адаптером, например адаптином.</li><li>Адаптеры привлекают клатрин; клатриновая решётка изгибает мембрану в ямку.</li><li>Ямка отделяется как покрытая клатрином везикула, затем оболочка быстро сбрасывается.</li></ol><p>Клатрин собирается в решётку с цитоплазматической стороны мембраны и изгибает её; с рецепторами груза он связывается не напрямую, а через белки-адаптеры. Работа разделена: рецептор определяет, какой груз будет захвачен, адаптер связывает рецептор с оболочкой, клатрин придаёт мембране форму ямки.</p><p>Рецепторы концентрируются в ямке за счёт того, что их цитоплазматические участки связываются с адаптерами. Поэтому груза в ямке больше, чем на соседних участках мембраны, — в этом и состоит избирательность пути.</p><p>Отделение покрытой везикулы от мембраны опосредует белок <a href="#ns-g-S3-T09">динамин</a>. Затем клатриновая оболочка быстро сбрасывается, и везикула может слиться с мембраной-мишенью — ранней эндосомой.</p><p>Так клетка поглощает, например, белки-переносчики, связанные со своими рецепторами; что происходит с рецептором и лигандом после эндоцитоза — тема вопроса 3 практикума (вопрос 9 коллоквиума). Вспомнить: белки-рецепторы — вопрос 4 коллоквиума.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как эндоцитоз вместе с доставкой и диффузией поддерживает полярный домен мембраны — <a href="https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes">МБ, семинар 2, шаг 25</a>; как захват рецепторов внутрь клетки ослабляет ответ на длительный сигнал — <a href="https://fresll.github.io/molbio/seminar-3-route.html#desensitization">МБ, семинар 3, шаг 6</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: клатрин сам узнаёт груз.<p class="trap-fix">Груз узнаёт рецептор, а клатрин связывается с рецептором через белок-адаптер.</p></div><div class="static-quiz"><h3>В клетке синтезируется рецептор, у которого удалён цитоплазматический участок, связывающий адаптер; наружный участок связывает лиганд нормально. Что произойдёт с этим рецептором?</h3><ol><li><b>А.</b> Он перестанет связывать лиганд на поверхности клетки <i>(неверный вариант)</i><br><span class="expl">Лиганд связывается наружным участком рецептора, а удалён цитоплазматический участок.</span></li><li><b>Б.</b> Он будет связывать лиганд, но не будет концентрироваться в ямках <i>(верный вариант)</i><br><span class="expl">Наружный участок связывает груз, а попадание рецептора в ямку обеспечивает связывание цитоплазматического участка с адаптером.</span></li><li><b>В.</b> Он соберёт клатриновую оболочку вокруг себя без адаптера <i>(неверный вариант)</i><br><span class="expl">Клатрин связывается с рецептором через адаптер; без участка для адаптера связи рецептора с оболочкой нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема упрощена: показаны один тип адаптера и одна оболочка.</p></details></article><article class="card print-unit" id="ns-actin-uptake"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 3 из 31</div><h2>Как перестройка актина образует макропиносомы и фагосомы</h2><p class="lead">Макропиносомы и фагосомы образуются не из ямки, а из выпячиваний плазматической мембраны, которые охватывают жидкость или частицу. Выпячивания — складки при макропиноцитозе и псевдоподии при фагоцитозе — создаёт перестройка актинового цитоскелета.</p><div class="note"><strong>Что показывает схема.</strong> Без перестройки актина не образуются ни макропиносомы, ни фагосомы; мелкие пузырьки по условию модели сохраняются.</div><ol class="mech"><li>Фактор роста запускает перестройку актина под мембраной.</li><li>Складки мембраны удлиняются, загибаются и замыкаются, захватывая внеклеточную жидкость, — образуется макропиносома.</li><li>Рецепторы фагоцита узнают частицу, например бактерию, покрытую антителами, и актин выталкивает псевдоподии вокруг неё — образуется фагосома.</li><li>Без перестройки актина выпячиваний нет, и оба крупных носителя не образуются.</li></ol><p>При макропиноцитозе складки мембраны захватывают внеклеточную жидкость с растворёнными веществами и антигенами; при фагоцитозе псевдоподии охватывают крупную твёрдую частицу. В обоих случаях носитель образуется из выпячивания мембраны, и выпячивание создаёт перестройка актина.</p><p>Макропиноцитоз — регулируемый процесс: в большинстве клеток его запускают сигналы, например макрофагальный колониестимулирующий фактор-1 и эпидермальный фактор роста; активно идёт у макрофагов. Во многих клетках макропиносомы, как и фагосомы, затем сливаются с поздними эндосомами или лизосомами, и их содержимое расщепляется; здесь показан этот вариант.</p><p>Фагоцитоз осуществляют главным образом специализированные фагоциты — макрофаги, нейтрофилы и дендритные клетки. Бактерии, покрытые антителами, узнаются рецепторами к Fc-фрагментам антител; небиологические частицы, например угольная пыль, захватываются без участия этих рецепторов.</p><p>Вспомнить: актиновые филаменты, их полярность и динамика.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: считать, что макропиноцитоз идёт постоянно и одинаково во всех клетках.<p class="trap-fix">В большинстве клеток макропиноцитоз не идёт постоянно: его запускают сигналы, например факторы роста, и для него нужна перестройка актина.</p></div><div class="static-quiz"><h3>Макрофаг обработали веществом, которое не даёт перестраиваться актиновому цитоскелету, а затем добавили бактерии, покрытые антителами. Что произойдёт с фагоцитозом?</h3><ol><li><b>А.</b> Бактерии будут поглощены в покрытых клатрином везикулах <i>(неверный вариант)</i><br><span class="expl">Фагоцитоз не использует клатриновые ямки, а бактерия намного крупнее покрытой клатрином везикулы.</span></li><li><b>Б.</b> Фагоцитоз не изменится: псевдоподии образуются за счёт клатрина <i>(неверный вариант)</i><br><span class="expl">Псевдоподии создаёт перестройка актина, а не клатрин; фагоцитоз — клатрин-независимый путь.</span></li><li><b>В.</b> Фагосомы не образуются: без перестройки актина нет псевдоподий <i>(верный вариант)</i><br><span class="expl">Псевдоподии, охватывающие частицу, создаёт перестройка актина; без неё частица не поглощается.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: показано, образуется ли носитель, но не скорость процесса.</p></details></article><article class="card print-unit" id="ns-dynamin-k44a"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 4 из 31</div><h2>Как показали, на каком этапе нужен динамин</h2><p class="lead">Мутантный динамин с нарушенными связыванием и гидролизом ГТФ позволил разделить этапы образования покрытой везикулы: ямка собирается и захватывает рецепторы без активного динамина, а сужение шейки и отделение — нет. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Контроль: ямки сужаются и отделяются. Динамин K44A: ямки впячены, шейки не сужаются, захват трансферрина ниже более чем на 80 %, захват жидкости не изменён.</div><ol class="mech"><li>В клетках HeLa (линия клеток рака шейки матки человека) включали синтез динамина-1 человека с заменой K44A — лизина в положении 44 на аланин; у такого белка нарушены связывание и гидролиз ГТФ (Damke et al., 1994).</li><li>Ямки собирались, впячивались и собирали рецепторы трансферрина (в ямке их примерно в 20 раз больше на единицу площади, чем на остальной мембране, как и в контроле), но не сужались; впяченных ямок становилось примерно вдвое больше.</li><li>Захват трансферрина снижался более чем на 80 %, захват EGF (эпидермального фактора роста) — более чем на 60 %; захват жидкости и рециркуляция рецептора трансферрина не менялись.</li></ol><p>Что уточняет эта работа. Высвобождение покрытой везикулы из мембраны опосредует динамин (БИО-3·2). Эксперимент указывает, какой этап от него зависит: не сборка ямки и не захват рецепторов, а сужение шейки и отделение носителя; для этого динамину нужно связывать и гидролизовать ГТФ.</p><h3>Метод</h3><p>Синтез мутантного белка включали, убирая из среды тетрациклин, и сравнивали клетки до и после включения. Захват трансферрина и EGF измеряли по недоступности меченного биотином лиганда для авидина, добавленного снаружи: лиганд, ушедший в суженную ямку или в отделившийся пузырёк, авидин уже не связывает. Строение ямок оценивали электронной микроскопией, захват жидкости — по пероксидазе хрена в среде.</p><p>Контроль: синтез динамина дикого типа в таком же количестве захват не менял. Значит, эффект связан с потерей способности связывать ГТФ, а не с избытком белка. Типичный артефакт метода: мутантный белок синтезировался в количестве, не менее чем в 50 раз превышающем собственный динамин клетки, и подавлял его работу.</p><p>Чего данные не доказывают. Мутантный белок подавляет и работу собственного динамина клетки, поэтому эксперимент показывает необходимость активного динамина для отделения носителя, но не механизм — сужает ли динамин шейку сам или вместе с другими белками. Вывод получен на одной линии клеток.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: без активного динамина клатриновые ямки не образуются.<p class="trap-fix">Ямки собираются, впячиваются и захватывают рецепторы; без активного динамина нарушается следующий этап — сужение шейки и отделение носителя (Damke et al., 1994).</p></div><div class="static-quiz"><h3>В клетках HeLa с мутантным динамином K44A меченый трансферрин связался с рецепторами. Что изменится по сравнению с контролем?</h3><ol><li><b>А.</b> Рецепторы концентрируются в ямках, как в контроле, но комплексы остаются на поверхности <i>(верный вариант)</i><br><span class="expl">Концентрирование рецепторов в ямках не нарушено (примерно в 20 раз выше, чем на остальной мембране), но ямки не сужаются и не отделяются, поэтому комплексы остаются на поверхности клетки (Damke et al., 1994).</span></li><li><b>Б.</b> Рецепторы перестают концентрироваться в ямках и рассеиваются по мембране <i>(неверный вариант)</i><br><span class="expl">Сборка ямок и концентрирование в них рецепторов от динамина не зависят: в клетках с K44A рецепторы в ямках собираются так же, как в контроле.</span></li><li><b>В.</b> Комплексы, как в контроле, за минуты попадают в ранние эндосомы <i>(неверный вариант)</i><br><span class="expl">Чтобы попасть в эндосому, носитель должен отделиться от мембраны; без активного динамина захват трансферрина снижен более чем на 80 %.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.127.4.915">Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934</a></li></ul><p>Damke et al., 1994: клетки HeLa; индуцируемый синтез динамина-1 человека дикого типа или K44A; захват трансферрина и EGF — начальная скорость перехода в суженные ямки и пузырьки; захват жидкости — пероксидаза хрена. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-lipid-sorting"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 5 из 31</div><h2>Отбирает ли клатриновая ямка липиды так же, как белки</h2><p class="lead">Белки-рецепторы концентрируются в клатриновой ямке через адаптеры, а липиды мембраны попадают в неё почти в той же доле, что и в окружающую мембрану. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Измерено 2,09, модель без отбора 2,10; после поправки на геометрию 10 липидов — от 0,84 до 1,07 (диапазон между видами, не доверительный интервал).</div><ol class="mech"><li>В поздних ямках (с динамином) 10 видов липидов распределены почти равномерно: от 0,84 до 1,07 относительно окружающей мембраны (Lennartz et al., 2026).</li><li>Насыщенные липиды слегка обогащены в ямке, полиненасыщенные слегка обеднены; различия между видами — до 21 %.</li><li>Различия между видами коррелируют с неравным распределением липидов между листками мембраны (<a href="#ns-g-S3-T12">асимметрией</a>) и с их температурой плавления; с числом рецепторов в ямке связь слабая. Проверить, вызывает ли асимметрия эти различия, не удалось.</li></ol><p>Что уточняет эта работа. Груз в клатриновой ямке концентрируют рецепторы и адаптеры (БИО-3·2). Работа отвечает на другой вопрос: переносит ли этот путь мембрану избирательно. После поправки на геометрию ямки сильного обогащения липидов не обнаружено, но разные виды липидных зондов распределяются с небольшими, статистически значимыми различиями — до 21 %. Клатриновый носитель отбирает белки, а липиды несёт почти в том составе, который есть в плазматической мембране.</p><h3>Метод</h3><p>Липидные зонды, близкие к природным, встраивали в наружный листок мембраны клеток меланомы человека SK-MEL2, за 3 секунды сшивали ультрафиолетом с соседними белками и фиксировали. Затем липид и клатрин снимали методом STED — флуоресцентной микроскопией сверхвысокого разрешения — и сравнивали яркость липида в ямке и в окружающей мембране. Стадию ямки определяли по меткам: адаптерный комплекс AP2 и клатрин — ранняя, плюс динамин-2, меченный зелёным флуоресцентным белком (GFP), — поздняя.</p><p>Главный контроль — модель. Изогнутая мембрана ямки в проекции даёт больше сигнала, чем плоская, поэтому кажущееся обогащение фосфатидилхолина 16:0 — PC(16:0) — в поздней ямке составило 2,09. Почти такую же величину (2,10) дала модель с равномерно распределённым липидом на реальной геометрии ямок; после поправки на геометрию обогащение близко к 1.</p><p>Чего данные не доказывают. Причинную роль асимметрии проверить не удалось: обработка, запускающая перемешивание липидов между листками (вход кальция и активация скрамблазы), разбирала поздние ямки примерно вчетверо быстрее, чем шло само перемешивание, поэтому измерить распределение липидов в ямках после перемешивания нельзя. Зонды близки к природным липидам, но не тождественны им; работа выполнена на одной линии клеток.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: яркий сигнал липида в ямке означает, что ямка его отбирает.<p class="trap-fix">Изогнутая мембрана в проекции даёт больше сигнала, чем плоская; без поправки на геометрию обогащение завышается примерно вдвое (Lennartz et al., 2026).</p></div><div class="static-quiz"><h3>В поздних ямках сигнал фосфатидилхолина в 2,09 раза ярче, чем в окружающей мембране, а модель с равномерно распределённым липидом даёт 2,10. Какой вывод допустим?</h3><ol><li><b>А.</b> Ямка отбирает фосфатидилхолин и концентрирует его вдвое <i>(неверный вариант)</i><br><span class="expl">Модель без отбора даёт ту же величину; разница создаётся геометрией ямки, а не отбором.</span></li><li><b>Б.</b> Липид распределён почти равномерно; яркость объясняет форма ямки <i>(верный вариант)</i><br><span class="expl">Модель без всякого отбора даёт ту же яркость, значит, избыток сигнала создаёт изогнутая мембрана в проекции (Lennartz et al., 2026).</span></li><li><b>В.</b> Фосфатидилхолин исключён из клатриновой ямки <i>(неверный вариант)</i><br><span class="expl">Измеренный сигнал равен модельному, а не ниже его; исключения нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-026-02068-7">Lennartz H. M. et al. Quantification of lipid sorting during clathrin-mediated endocytosis. Nat Cell Biol. 2026;28:2027–2035</a></li></ul><p>Lennartz et al., 2026: клетки SK-MEL2 с динамином-2–GFP; 10 бифункциональных липидных зондов; STED; поправка на геометрию по электронно-микроскопическим данным для той же линии. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-caveolar-endocytosis"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 6 из 31</div><h2>Чем кавеола отличается от клатриновой ямки</h2><p class="lead"><a href="#ns-g-S3-T10">Кавеола</a> — впячивание плазматической мембраны из кавеолинов и кавинов; по модели авторов, её изгиб и отделение определяются взаимодействием дисков кавеолина с липидами мембраны, прежде всего с холестерином, а не оболочкой с адаптерами, как у клатриновой ямки. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Снижение холестерина — кавеола распластывается; повышение — по модели авторов отделение вероятнее; без EHD2 отделение учащается. Положения переключателя не являются измеренными концентрационными порогами.</div><ol class="mech"><li>Кавеолин-1 образует диски из 11 молекул, встроенные в цитоплазматический листок; кавины собираются в периферическую оболочку (Parton et al., 2026).</li><li>По модели авторов, больше холестерина и гликосфинголипидов — сильнее изгиб и вероятнее отделение кавеолы; меньше холестерина — кавеола распластывается.</li><li>Кольца белка EHD2 на шейке ограничивают отделение; без EHD2 кавеолы отделяются чаще. Роль динамина в отделении кавеол оспаривается.</li></ol><p>Что уточняет эта работа. Кавеолы нередко описывают как ещё один путь захвата жидкости мелкими пузырьками. Авторы показывают, что кавеолы устроены и отделяются иначе, чем клатриновые ямки: модельные трансмембранные белки из кавеол исключены, а в каждый момент лишь около 5 % кавеол клетки связаны с ранними эндосомами.</p><p>В клатриновом пути оболочка с адаптерами отбирает груз, а ГТФаза динамин сужает шейку. В кавеоле изгиб создаёт сочетание дисков кавеолина с липидами, обогащёнными холестерином и сфингомиелином; по оценке на основе структуры, один диск занимает в цитоплазматическом листке место около 250 молекул липидов. Отделение кавеолы ограничивают кольца EHD2 (белка 2 с EH-доменом) на шейке; динамин, по данным, приведённым в работе, скорее удерживает часть кавеол на мембране.</p><h3>Метод</h3><p>Динамику кавеол изучают по флуоресцентному кавеолину или кавину-1 в живых клетках (лучше — в клетках с отредактированным геномом, без избыточного синтеза белка), электронной микроскопией и по метке, которую добавляют снаружи и затем удаляют с поверхности: остаётся только метка внутри отделившихся кавеол.</p><p>Чего данные не доказывают. Главный тезис авторов — кавеола не столько путь для белкового груза, сколько чувствительный к липидам участок поверхности. Это модель, обобщающая эксперименты в культуре клеток; роль кавеолярного эндоцитоза в тканях и набор грузов, которым кавеолы необходимы, остаются открытыми вопросами.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: кавеола — та же клатриновая ямка, только с другим белком оболочки.<p class="trap-fix">Механизмы разные: клатриновую ямку формируют оболочка с адаптерами и динамин, а изгиб и отделение кавеолы определяют диски кавеолина и липиды мембраны (Parton et al., 2026).</p></div><div class="static-quiz"><h3>Из мембраны клеток в культуре удалили значительную часть холестерина. Что произойдёт с кавеолами?</h3><ol><li><b>А.</b> Кавеолы будут чаще отделяться от мембраны <i>(неверный вариант)</i><br><span class="expl">Отделение усиливает добавление холестерина, а не его удаление.</span></li><li><b>Б.</b> Кавеолы превратятся в клатриновые ямки <i>(неверный вариант)</i><br><span class="expl">Кавеолы и клатриновые ямки построены из разных белков; удаление холестерина не переводит одну структуру в другую.</span></li><li><b>В.</b> Кавеолы распластаются <i>(верный вариант)</i><br><span class="expl">Изгиб кавеолы поддерживают липиды, прежде всего холестерин; его снижение вызывает распластывание кавеол (Parton et al., 2026).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-026-01945-5">Parton R. G., Kozlov M. M., Lundmark R. A lipid-centric view of endocytosis by caveolae. Nat Cell Biol. 2026;28:852–860</a></li></ul><p>Parton, Kozlov, Lundmark, 2026 — аналитическая статья с авторской моделью (рубрика Perspective): обзор экспериментов в культуре клеток и биофизическая модель авторов. Числа (5 %, 11 молекул, около 250 липидов) — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-caveolae-reserve"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 7 из 31</div><h2>Как кавеолы защищают мембрану при набухании клетки</h2><p class="lead">Кавеола — колбовидное впячивание мембраны, стабилизированное кавеолинами и кавинами; при повышении натяжения она распластывается, и площадь плоской мембраны увеличивается без синтеза новой мембраны. Ниже — эксперимент, который это показал: сверх программы, на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Дикий тип в гипоосмотической среде: кавеолы распластываются, сила почти не меняется. Без кавеолина-1: сила +200 %.</div><ol class="mech"><li>В гипоосмотической среде вода входит в клетку, и клетка набухает: объём клеток HeLa в среде 30 мОсм (миллиосмоль на литр; обычная среда — около 300 мОсм) за 5 минут вырос на 35 % (Sinha et al., 2011).</li><li>Часть кавеол распластывается: кавин-1 отделяется от кавеолина, кавеолин переходит в плоскую мембрану; АТФ и перестройка актина для этого не нужны.</li><li>У эндотелиальных клеток мыши без кавеолина-1 при 150 мОсм сила вытягивания мембранной нити выросла на 200 %, мембрана чаще разрывалась; у клеток дикого типа <a href="#ns-g-S3-T11">натяжение</a> почти не менялось. После возврата из среды 30 мОсм в обычную кавеолы за 2–5 минут собирались снова, и для этого нужен АТФ.</li></ol><p>Что уточняет эта работа. Кавеолы служат резервом мембраны; эксперимент показывает, как этот резерв работает и что происходит без него.</p><h3>Метод</h3><p>Натяжение оценивали по силе, с которой мембрана удерживает тонкую нить, вытянутую оптическим пинцетом за приклеенную к мембране бусину: чем выше натяжение, тем больше сила. Число кавеол на поверхности считали флуоресцентной микроскопией полного внутреннего отражения, строение оценивали электронной микроскопией. Контроль — клетки без кавеолина-1 и те же клетки после восстановления его синтеза. Типичный артефакт: сила нити зависит и от сцепления мембраны с цитоскелетом, поэтому сравнивают изменения в первые минуты, пока кортикальный актин не перестраивается.</p><p>Распластывание — не эндоцитоз: ингибитор динамина динасор не предотвращал потерю кавеол. Клатриновые ямки при набухании почти не исчезали — не больше одной десятой от числа исчезнувших кавеол — и натяжение не гасили. Распластывание шло и в «сферах» плазматической мембраны, где нет органелл и актиновых филаментов: это собственное механическое свойство кавеол.</p><p>Значение для медицины и границы вывода. Миотрубки человека с мутацией кавеолина-3 P28L (замена пролина в положении 28 на лейцин), при которой белок задерживается в комплексе Гольджи, не гасили скачок натяжения и чаще разрывались. Это показано на клетках в культуре; механизм поражения мышцы у больного этим не исчерпывается.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: кавеолы исчезают с поверхности при набухании, потому что уходят внутрь клетки эндоцитозом.<p class="trap-fix">Кавеолы распластываются в мембране: ингибитор динамина их потерю не предотвращает, а после возврата в обычную среду кавеолы снова собираются на поверхности (Sinha et al., 2011).</p></div><div class="static-quiz"><h3>Перед гипоосмотическим шоком клетки дикого типа лишили АТФ. Будут ли кавеолы распластываться?</h3><ol><li><b>А.</b> Да: распластывание не требует АТФ <i>(верный вариант)</i><br><span class="expl">Распластывание кавеол — пассивный механический ответ: оно шло и в клетках без АТФ, и при разрушенном актине. АТФ нужен для обратной сборки кавеол (Sinha et al., 2011).</span></li><li><b>Б.</b> Нет: без АТФ кавеолы не могут изменить форму <i>(неверный вариант)</i><br><span class="expl">АТФ нужен для обратной сборки кавеол после шока, а не для распластывания.</span></li><li><b>В.</b> Нет: кавеолы распластывает динамин за счёт ГТФ <i>(неверный вариант)</i><br><span class="expl">Ингибитор динамина динасор не предотвращал потерю кавеол; распластывание — механический ответ на натяжение мембраны.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2010.12.031">Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413</a></li></ul><p>Sinha et al., 2011: клетки HeLa с Cav1-EGFP (30 мОсм, подсчёт кавеол), эндотелий лёгких мыши дикого типа и Cav1−/− (150 мОсм, сила вытягивания нити), миотрубки человека с Cav3 P28L. Числа — из этой работы, каждое со своими условиями. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-caveolae-muscle"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 8 из 31</div><h2>Почему мутации кавеолина-3 поражают прежде всего мышцы</h2><p class="lead">Кавеолин-3 входит в состав кавеол волокон скелетных мышц, которые постоянно растягиваются; мутации CAV3 нарушают образование кавеол, и мембрана мышечного волокна становится хрупкой. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Норма: при растяжении кавеолы распластываются. Мутантный кавеолин-3: кавеол нет, сарколемма повреждается чаще.</div><ol class="mech"><li>Кавеолы — впячивания 50–100 нм из кавеолинов (Cav1–Cav3) и кавинов; Cav3 характерен для скелетной мышцы (Lamaze et al., 2026).</li><li>Мутантный Cav3 задерживается в комплексе Гольджи, кавеолы в сарколемме не образуются, её устойчивость к растяжению снижается.</li><li>Мутации гена CAV3, кодирующего кавеолин-3, вызывают поясно-конечностную мышечную дистрофию 1C и болезнь «волнообразных мышц».</li></ol><p>Что уточняет эта работа. Обзор подытоживает: роль кавеол в избирательном эндоцитозе сейчас считают второстепенной по сравнению с их механическими функциями. Кавеол особенно много в мышцах, эндотелии и жировых клетках — тканях, которые постоянно растягиваются, — что согласуется с ролью резерва мембраны.</p><p>Кавеолин-3 синтезируется в скелетной мышце. При сокращении и растяжении волокна запас мембраны в кавеолах гасит скачки натяжения. Без кавеол каждое растяжение сильнее нагружает сарколемму — плазматическую мембрану мышечного волокна.</p><h3>Метод</h3><p>Обзор объединяет разные методы: электронную микроскопию и микроскопию сверхвысокого разрешения (строение кавеол), криоэлектронную микроскопию олигомеров кавеолина, измерение натяжения мембраны и генетику больных. Натяжение, при котором кавеолы распластываются (около 0,1 мН/м), получено расчётом по физической модели мембраны, а не прямым измерением. Контроль в таких работах — клетки или волокна того же типа без мутации. Ограничение: обзор сводит данные разных моделей — клеток в культуре, мышей и больных, — и числа, полученные в одной модели, нельзя переносить на другую.</p><p>Чего данные не доказывают. Цепочка «нет кавеол — хрупкая мембрана — дистрофия» согласуется с экспериментами на клетках, но поражение мышцы у конкретного больного зависит и от других белков сарколеммы. Медицинский пример иллюстрирует механизм и не является клиническим описанием.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: кавеолы нужны прежде всего для захвата грузов в клетку.<p class="trap-fix">По современным данным их главная функция — механическая: резерв мембраны и передача сигнала при растяжении; вклад в эндоцитоз второстепенен (Lamaze et al., 2026).</p></div><div class="static-quiz"><h3>В мышечных волокнах мутантный кавеолин-3 задерживается в комплексе Гольджи. Что вероятнее всего произойдёт при повторяющемся растяжении волокна?</h3><ol><li><b>А.</b> Клатриновые ямки распластаются и заменят кавеолы <i>(неверный вариант)</i><br><span class="expl">Клатриновые ямки — места образования носителей эндоцитоза; роль резерва мембраны обзор отводит кавеолам (Lamaze et al., 2026; данные о ямках при набухании клетки — вспомнить БИО-3·7).</span></li><li><b>Б.</b> Сарколемма будет чаще повреждаться: запаса мембраны в кавеолах нет <i>(верный вариант)</i><br><span class="expl">Без кавеол растяжение не гасится распластыванием впячиваний, и мембрана повреждается чаще (Lamaze et al., 2026).</span></li><li><b>В.</b> Ничего не изменится: кавеолы нужны только для захвата грузов <i>(неверный вариант)</i><br><span class="expl">Главная функция кавеол — механическая; без них мембрана хуже переносит растяжение.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-026-00964-2">Lamaze C., Blouin C. M., Sens P. Caveolae mechanics in cellular functions and disease. Nat Rev Mol Cell Biol. 2026;27:581–600</a></li></ul><p>Lamaze, Blouin, Sens, 2026 — обзор. Оценка критического натяжения — расчёт по модели. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-carrier-cycle"><div class="eyebrow">Цикл транспортного носителя · шаг 9 из 31</div><h2>Из каких этапов состоит цикл транспортного носителя</h2><p class="lead"><a href="#ns-g-S3-T13">Транспортный носитель</a> переносит груз между мембранами: он образуется почкованием от мембраны одного компартмента и сливается с мембраной другого. Цикл носителя удобно разделить на этапы: сборка оболочки и отбор груза, отделение, снятие оболочки, узнавание мишени и слияние. Это продолжение вопроса 8 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Этапы цикла на всех участках одинаковы; различаются белки оболочки: COP-II — на выходе из грЭПР, COP-I — в обратном транспорте между цистернами комплекса Гольджи, клатрин — в транс-сети комплекса Гольджи.</div><ol class="mech"><li>Белки <a href="#ns-g-S3-T14">оболочки</a> собираются на мембране-доноре, отбирают груз и изгибают мембрану.</li><li>Носитель отделяется от донора; на плазматической мембране отделение покрытой клатрином везикулы опосредует динамин.</li><li>Носитель сбрасывает оболочку.</li><li><a href="#ns-g-S3-T18">Rab-белки и тетеринг-факторы</a> обеспечивают первичное узнавание мишени.</li><li><a href="#ns-g-S3-T17">SNARE-белки</a> носителя и мишени собираются в комплекс, и мембраны сливаются.</li></ol><p>Оболочки разных участков мембранной сети различаются. <a href="#ns-g-S3-T15">COP-II</a> образует носители, которые переносят только что синтезированные белки из грЭПР в цис-сеть комплекса Гольджи; <a href="#ns-g-S3-T16">COP-I</a> — носители обратного транспорта из комплекса Гольджи в грЭПР и между его цистернами; клатрин с адаптерами — носители от плазматической мембраны и от транс-сети комплекса Гольджи.</p><p>Оболочка выполняет две работы: связывает груз (у клатрина — через адаптеры, связывающие цитоплазматические участки рецепторов груза) и придаёт мембране кривизну. Поэтому без оболочки нет ни отбора груза, ни самого носителя.</p><p>SNARE-белки называют по мембране, на которой они находятся: v-SNARE — на носителе, t-SNARE — на мембране-мишени. Есть и другие названия — R- и Q-SNARE, по остатку аргинина или глутамина в центре комплекса. Сверх программы: это две разные классификации, а не старое и новое название одних и тех же белков; у носителя из ЭПР есть и R-, и Q-SNARE (БИО-3·12).</p><p>ЗАКЛЮЧЕНИЕ: схема цикла на всех маршрутах одна и та же, а различается набор белков — какая оболочка образует носитель на этом участке и по каким белкам носитель узнаёт мишень.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как носитель движется от донора к мишени по микротрубочкам и актиновым филаментам с помощью моторных белков — <a href="https://fresll.github.io/molbio/seminar-2-route.html#tracks">МБ, семинар 2, шаг 1</a>; как моторный белок связывается со своим грузом через адаптер — <a href="https://fresll.github.io/molbio/seminar-2-route.html#adaptors">МБ, семинар 2, шаг 3</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: считать, что везикулу направляет к плазматической мембране её оболочка COP-I или COP-II.<p class="trap-fix">Белки оболочки обеспечивают отбор груза и образование носителя на участке ЭПР — комплекс Гольджи; к плазматической мембране секреторные везикулы перемещаются по микротрубочкам с помощью моторных белков.</p></div><div class="static-quiz"><h3>Какая оболочка образует носитель, который переносит белки из транс-сети комплекса Гольджи в позднюю эндосому?</h3><ol><li><b>А.</b> COP-I <i>(неверный вариант)</i><br><span class="expl">COP-I обеспечивает ретроградный транспорт: из комплекса Гольджи в грЭПР и между цистернами комплекса Гольджи.</span></li><li><b>Б.</b> COP-II <i>(неверный вариант)</i><br><span class="expl">COP-II образует носители в прямом направлении — на выходе из грЭПР в комплекс Гольджи.</span></li><li><b>В.</b> Клатрин <i>(верный вариант)</i><br><span class="expl">При прямом пути белки покидают транс-сеть комплекса Гольджи в покрытых клатрином везикулах; клатрин образует носители на плазматической мембране и в транс-сети комплекса Гольджи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: показан один носитель на каждом этапе.</p></details></article><article class="card print-unit" id="ns-uncoating"><div class="eyebrow">Цикл транспортного носителя · шаг 10 из 31</div><h2>Зачем носитель сбрасывает оболочку</h2><p class="lead">Оболочка нужна, чтобы отобрать груз и изогнуть мембрану, но после отделения носителя она мешала бы его взаимодействию с мишенью. Поэтому снятие оболочки — отдельный обязательный этап цикла: клатриновая оболочка сбрасывается, и только после этого везикула может слиться с мембраной-мишенью.</p><div class="note"><strong>Что показывает схема.</strong> Норма: оболочка снимается, везикула сливается с ранней эндосомой. Без снятия оболочки покрытые везикулы накапливаются в цитоплазме.</div><ol class="mech"><li>Покрытая клатрином везикула отделяется от плазматической мембраны.</li><li>Клатриновая оболочка сбрасывается; её компоненты возвращаются в цитоплазму для нового цикла.</li><li>Неокаймлённый носитель сливается с <a href="#ns-g-S3-T19">ранней эндосомой</a>, используя Rab- и SNARE-системы.</li></ol><p>Носители других маршрутов тоже сбрасывают значительную часть оболочки до слияния с мишенью. Белки оболочки при этом не расходуются: они возвращаются в цитоплазму и собираются на мембране-доноре снова.</p><p>ЗАКЛЮЧЕНИЕ: если оболочка не снимается, носитель уже отделился и несёт груз, но с мишенью не сливается; покрытые носители накапливаются в цитоплазме, а груз в мишень не поступает.</p><p>Именно так ведёт себя модель практикума вопроса 2, если убрать снятие оболочки (вкладка «Цикл носителя»). Вспомнить БИО-3·2: оболочка собирается вокруг рецепторов с грузом через адаптеры.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: оболочка снимается при слиянии, поэтому носитель может слиться и покрытым.<p class="trap-fix">Порядок обратный: оболочку сбрасывает уже отделившийся носитель, и только после этого он может слиться с мембраной-мишенью.</p></div><div class="static-quiz"><h3>Покрытая клатрином везикула отделилась, но оболочка с неё не снимается. Где окажутся рецепторы с лигандом?</h3><ol><li><b>А.</b> В покрытых везикулах в цитоплазме <i>(верный вариант)</i><br><span class="expl">Оболочка сбрасывается, позволяя везикуле слиться с целевой мембраной; без этого везикулы остаются в цитоплазме, и груз в раннюю эндосому не попадает.</span></li><li><b>Б.</b> В ранней эндосоме: оболочка снимется при слиянии <i>(неверный вариант)</i><br><span class="expl">Снятие оболочки предшествует слиянию: покрытый носитель с мишенью не сливается.</span></li><li><b>В.</b> На поверхности клетки, в неотделившихся ямках <i>(неверный вариант)</i><br><span class="expl">Отделение везикулы обеспечивает динамин, и в этой ситуации оно не нарушено: нарушен следующий этап.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Белки, снимающие оболочку, в шаге не обсуждаются. Схема качественная.</p></details></article><article class="card print-unit" id="ns-docking-fusion"><div class="eyebrow">Цикл транспортного носителя · шаг 11 из 31</div><h2>Как носитель узнаёт мишень и сливается с ней</h2><p class="lead">Прежде чем слиться с мишенью, носитель должен её узнать. Это делают в два этапа разные белки: Rab-белки и тетеринг-факторы удерживают подходящий носитель у мембраны, а SNARE-белки сближают мембраны до слияния. Слияние обеспечивает взаимодействие SNARE-белков носителя и мембраны-мишени; Rab-белки и тетеринг-факторы отбирают подходящий носитель ещё до этого.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает, где оказываются носители и груз, если выключить один из этапов цикла на пути из транс-сети комплекса Гольджи в позднюю эндосому.</div><ol class="mech"><li>Rab в активной форме (связанный с ГТФ) отмечает мембрану-мишень и привлекает длинные тетеринг-факторы.</li><li>Тетеринг-факторы удерживают подходящий носитель у мишени на расстоянии.</li><li>SNARE носителя и SNARE мишени собираются в плотный четырёхспиральный комплекс, который сближает бислои; мембраны сливаются.</li></ol><p>Точность доставки обеспечивается последовательными проверками: сначала первичное узнавание, затем сборка комплементарных SNARE-белков двух мембран. Слияние обеспечивают SNARE-белки обеих мембран — v-SNARE носителя и t-SNARE мишени.</p><p>SNARE-белки работают при слиянии секреторной везикулы с плазматической мембраной — после слияния SNARE-комплекс разбирает АТФаза NSF — и при слиянии транспортных везикул с поздними эндосомами.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Чем мембранный контактный сайт отличается от слияния — <a href="https://fresll.github.io/molbio/seminar-1-route.html#contact-site">МБ, семинар 1, шаг 22</a>; почему слияние, закисление и гидролиз в лизосоме — разные процессы — <a href="https://fresll.github.io/molbio/seminar-7-route.html#fusion-acidity">МБ, семинар 7, шаг 26</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: SNARE-белки узнают мишень на расстоянии, ещё до того, как носитель к ней приблизился.<p class="trap-fix">На расстоянии носитель удерживают тетеринг-факторы, которых привлекает Rab-белок мишени; SNARE-белки собираются в комплекс, когда мембраны уже сближены.</p></div><div class="static-quiz"><h3>Какие белки первыми связывают приближающийся носитель с мембраной-мишенью?</h3><ol><li><b>А.</b> SNARE-белки носителя <i>(неверный вариант)</i><br><span class="expl">SNARE-белки собираются в комплекс позже, когда носитель уже удерживается у мишени.</span></li><li><b>Б.</b> Тетеринг-факторы, которых привлекает Rab в активной форме <i>(верный вариант)</i><br><span class="expl">Rab, связанный с ГТФ, отмечает мембрану-мишень и привлекает длинные тетеринг-факторы; они удерживают подходящий носитель на расстоянии.</span></li><li><b>В.</b> Белки оболочки носителя <i>(неверный вариант)</i><br><span class="expl">Оболочка снимается до слияния; узнавание мишени обеспечивают Rab-белки и тетеринг-факторы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: показаны один SNARE мишени и один SNARE носителя вместо четырёх спиралей комплекса.</p></details></article><article class="card print-unit" id="ns-snare-zipper"><div class="eyebrow">Цикл транспортного носителя · шаг 12 из 31</div><h2>Как SNARE-комплекс сближает мембраны и почему его нужно разбирать</h2><p class="lead">Одиночные SNARE-белки неактивны и не сливают мембраны даже в высокой концентрации: слияние обеспечивает комплекс, который собирают SNARE-белки двух мембран (Jahn et al., 2024). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> SNARE порознь → сборка комплекса и стягивание мембран → слияние, комплекс в одной мембране → разборка NSF.</div><ol class="mech"><li>Четыре SNARE-мотива — по одному типа Qa, Qb, Qc и R — собираются в пучок из четырёх параллельных α-спиралей; в центре пучка лежит слой из трёх остатков глутамина (Q) и одного аргинина (R), по которому и названы подсемейства (Jahn et al., 2024).</li><li>Сборка начинается с N-концевых участков SNARE-мотивов и самопроизвольно продвигается к C-концевым якорям в мембранах («застёгивание»); собранный между двумя мембранами комплекс стягивает их до слияния.</li><li>После слияния все спирали комплекса оказываются в одной мембране (cis-комплекс). Его разбирает АТФаза <a href="#ns-g-S3-T20">NSF</a> вместе с белками α-SNAP — растворимыми белками, связывающими NSF. После разборки SNARE-белки снова готовы к слиянию.</li></ol><p>Что уточняет обзор. Слияние обеспечивает взаимодействие SNARE-белков носителя (v-SNARE) и мишени (t-SNARE) (БИО-3·11). Обзор объясняет, откуда берётся сила: комплекс очень стабилен, и энергия его сборки сближает мембраны и помогает преодолеть энергетический барьер слияния.</p><p>Пример — слияние синаптических пузырьков с плазматической мембраной нервного окончания: синтаксин-1 (Qa) и SNAP25 (два мотива, Qb и Qc) находятся в плазматической мембране, синаптобревин-2 (R) — в мембране пузырька (Jahn et al., 2024). У носителя с оболочкой COP-II, который сливается с цис-стороной комплекса Гольджи, распределение другое: на носителе — Qb-, Qc- и R-SNARE, на мембране-мишени — Qa-SNARE. Поэтому деление на R- и Q-SNARE (по остатку в центре комплекса) и на v- и t-SNARE (по мембране, на которой находится белок) — разные классификации. Для слияния пузырька достаточно, по разным оценкам, от одного до трёх комплексов.</p><p>Сборку регулируют дополнительные белки — белки семейства Sec1/Munc18 и тетеринг-факторы, которые удерживают SNARE в нужном положении. Как именно начинается сборка, пока не установлено.</p><h3>Метод</h3><p>Большая часть сведений обзора получена в бесклеточных системах: очищенные SNARE-белки встраивают в искусственные липидные пузырьки (липосомы) и по флуоресценции измеряют смешивание липидов и содержимого двух мембран; силу сборки комплекса измеряют оптическим пинцетом на одиночных молекулах (Jahn et al., 2024). Контроль — пузырьки без SNARE-белков или с белками только одной мембраны. Типичный артефакт: при гемислиянии смешиваются липиды наружных монослоёв, а содержимое не смешивается, поэтому слияние подтверждают по смешиванию содержимого (ЗАКЛЮЧЕНИЕ). Чего данные не доказывают: что в клетке слияние идёт с тем же числом комплексов и с той же скоростью, что в бесклеточной системе.</p><p>ЗАКЛЮЧЕНИЕ: слияние связывает свободные SNARE-белки в собранные комплексы, а NSF разбирает их и возвращает SNARE в работу; без разборки комплексов цикл носителя остановился бы после первых слияний.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: SNARE-белок носителя сам сливает носитель с мембраной, если его достаточно много.<p class="trap-fix">Одиночные SNARE-белки неактивны даже в высокой концентрации; нужен комплекс SNARE-мотивов двух мембран (Jahn et al., 2024).</p></div><div class="static-quiz"><h3>Почему одиночный SNARE-белок на носителе, даже в большом количестве, не сливает носитель с мембраной?</h3><ol><li><b>А.</b> Его сначала должна разобрать АТФаза NSF <i>(неверный вариант)</i><br><span class="expl">NSF разбирает уже собранные комплексы после слияния; одиночный SNARE разбирать не нужно.</span></li><li><b>Б.</b> Его сначала должна покрыть оболочка COP-II <i>(неверный вариант)</i><br><span class="expl">Оболочка участвует в образовании носителя и снимается до слияния; к работе SNARE она отношения не имеет.</span></li><li><b>В.</b> Слияние обеспечивает только комплекс SNARE-мотивов двух мембран <i>(верный вариант)</i><br><span class="expl">Одиночные SNARE неактивны; энергию для сближения мембран даёт сборка комплекса из четырёх мотивов (Qa, Qb, Qc, R) (Jahn et al., 2024).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00668-x">Jahn R., Cafiso D. C., Tamm L. K. Mechanisms of SNARE proteins in membrane fusion. Nat Rev Mol Cell Biol. 2024;25:101–118</a></li></ul><p>Jahn, Cafiso, Tamm, 2024 — обзор. Число комплексов, необходимых для слияния, оценивается по-разному. Схема упрощена: показано по одному мотиву каждого типа; распределение мотивов между мембранами — как при слиянии синаптического пузырька: Qb и Qc — два мотива одного белка SNAP25, который прикреплён к мембране не трансмембранным участком, а остатками жирной кислоты (пальмитоильными). Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-nsf-recycling"><div class="eyebrow">Цикл транспортного носителя · шаг 13 из 31</div><h2>Как обнаружили белок, без которого перенос между цистернами Гольджи останавливается</h2><p class="lead">Перенос белка между стопками комплекса Гольджи удалось воспроизвести вне клетки и найти белок, необходимый для этого переноса, — NSF. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Контроль — перенос идёт; N-этилмалеимид — перенос почти не идёт; N-этилмалеимид + очищенный NSF — перенос восстановлен.</div><ol class="mech"><li>Мембраны комплекса Гольджи обрабатывали N-этилмалеимидом (NEM) — веществом, которое модифицирует остатки цистеина; после этого перенос белка G вируса везикулярного стоматита почти прекращался (Block et al., 1988).</li><li>Добавление фракции цитозоля восстанавливало перенос; по восстановлению из цитозоля очистили белок NSF.</li><li>Очищенный NSF восстанавливал перенос и действовал каталитически: по оценке авторов, один комплекс NSF обеспечивал перенос не менее трёх носителей.</li></ol><p>Что уточняет эта работа. В названии SNARE-белков уже упомянут этот белок: SNARE — рецепторы растворимых белков, связывающих NSF, N-этилмалеимид-чувствительный фактор. Эксперимент 1988 г. показал, что этот белок необходим для переноса между цистернами комплекса Гольджи и не расходуется; позже стало известно, что NSF разбирает SNARE-комплексы после слияния (вспомнить БИО-3·12).</p><h3>Метод</h3><p>Бесклеточная система: донорные мембраны комплекса Гольджи из клеток CHO, заражённых вирусом везикулярного стоматита, акцепторные — из незаражённых клеток, цитозоль и АТФ. Перенос вирусного белка G из цис- в медиальный компартмент измеряли по присоединению [3H]GlcNAc к белку G. Мембраны обрабатывали 1 мМ N-этилмалеимида 15 мин при 0 °C, цитозоль готовили без активного NSF.</p><p>Контроль: необработанные мембраны с обычным цитозолем. Ограничение: N-этилмалеимид модифицирует многие белки, поэтому вывод о роли именно NSF опирается на восстановление переноса очищенным белком. Восстановление показывает, что добавления NSF достаточно, чтобы вернуть перенос в системе, где остальные компоненты сохранены; достаточен ли NSF для переноса сам по себе, из этого не следует.</p><p>Чего данные не доказывают. Эксперимент показывает, что NSF необходим для переноса, но не показывает, на каком этапе цикла он работает; роль NSF в разборке SNARE-комплексов установлена позже. Оценка каталитического действия заведомо занижена: при очистке большая часть активности теряется.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: NSF расходуется — на каждый носитель нужен свой.<p class="trap-fix">Один комплекс NSF обслуживает несколько носителей: белок действует каталитически (Block et al., 1988).</p></div><div class="static-quiz"><h3>К мембранам комплекса Гольджи, обработанным N-этилмалеимидом, добавили очищенный NSF. Что показал эксперимент?</h3><ol><li><b>А.</b> Перенос восстановился, и один комплекс NSF обслуживал несколько носителей <i>(верный вариант)</i><br><span class="expl">Очищенный NSF вернул перенос белка G; по оценке авторов, один комплекс обеспечивал перенос не менее трёх носителей (Block et al., 1988).</span></li><li><b>Б.</b> Перенос не восстановился: мембраны необратимо повреждены <i>(неверный вариант)</i><br><span class="expl">Перенос восстанавливался одним добавленным белком, значит, остальные компоненты мембран сохранили работоспособность.</span></li><li><b>В.</b> Перенос восстановился, только если NSF было столько же, сколько носителей <i>(неверный вариант)</i><br><span class="expl">NSF действует каталитически: он не расходуется на каждый носитель.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.85.21.7852">Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856</a></li></ul><p>Block et al., 1988: бесклеточная система из мембран комплекса Гольджи клеток CHO (линия клеток яичника китайского хомячка); измеряемая величина — присоединение [3H]GlcNAc к белку G вируса везикулярного стоматита. Белок G — мембранный гликопротеин, поэтому на схеме он встроен в мембраны цистерн и носителей. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-fusion-pore"><div class="eyebrow">Цикл транспортного носителя · шаг 14 из 31</div><h2>Как открывается и меняется пора слияния</h2><p class="lead">Слияние проходит через промежуточные состояния. По одной из моделей сначала сливаются обращённые друг к другу монослои мембран (<a href="#ns-g-S3-T22">гемислияние</a>), затем открывается <a href="#ns-g-S3-T21">пора</a>; конкурирующая модель предполагала начальную пору, выстланную SNARE-белками. В живых клетках гемислияние заметной длительности наблюдали примерно в 30–40 % событий слияния; пора может расшириться или снова закрыться (Wu, Chan, 2024). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Сближение → гемислияние (не всегда) → узкая пора → широкая пора → сжатие Ω-профиля или закрытие поры.</div><ol class="mech"><li>По классической схеме при слиянии везикулы с плазматической мембраной открывается узкая пора (менее ~5 нм); она может быстро закрыться и ограничить выход содержимого («поцелуй и беги») или расшириться, и тогда везикула полностью встраивается в мембрану (Wu, Chan, 2024).</li><li>В живых хромаффинных клетках надпочечника примерно 30–40 % слияний проходят через гемислияние заметной длительности; около трети из них переходят в полное слияние за 0,1–26 с.</li><li>Поры видны непосредственно, если они крупнее ~60 нм: у везикул 180–720 нм поры бывают от ~0 до 490 нм и могут расширяться быстрее ~9 нм/мс. Слившаяся везикула сохраняет форму Ω-профиля, сжимается, увеличивается, а пора остаётся открытой или закрывается — всего семь вариантов.</li></ol><p>Что уточняет эта работа. Обычно описывают два исхода слияния — полное слияние и «поцелуй и беги», при котором пора открывается кратковременно. В крупных секреторных везикулах хромаффинных клеток распластывание везикулы в плазматической мембране, считавшееся основным исходом, не наблюдали; вместо этого Ω-профиль сохранялся, сжимался или увеличивался (Wu, Chan, 2024).</p><h3>Метод</h3><p>Микроскопия STED (разрешение ~60–80 нм, кадр каждые ~26–300 мс) в первичной культуре хромаффинных клеток надпочечника быка; секрецию запускали деполяризацией в течение 1 с. Цитоплазматический монослой плазматической мембраны метили флуоресцентным белком, связывающим фосфатидилинозитол-4,5-бисфосфат, а внеклеточную среду — малым флуоресцентным красителем: краситель проникает в везикулу, только когда пора открыта.</p><p>Контроль: гемислиянию соответствует Ω-профиль, на который переходит метка цитоплазматического монослоя плазматической мембраны, но в который не проникают малый краситель и ионы H+ и на который не переходит метка внеклеточного монослоя; открытая пора пропускает краситель. Ограничение: поры меньше ~60 нм не видны непосредственно, их открытие определяют по проникновению красителя.</p><p>Чего данные не доказывают. Наблюдения сделаны на крупных везикулах (~200–1500 нм) одного типа клеток; везикулы 30–100 нм, например синаптические, таким методом не видны, и перенос выводов на них не показан.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: слияние — одномоментное событие, после которого везикула всегда распластывается в мембране.<p class="trap-fix">Слияние может идти через промежуточные состояния — гемислияние (в живых клетках его заметная длительность видна примерно в 30–40 % событий) и узкую пору, — а пора может закрыться; в крупных везикулах хромаффинных клеток полное распластывание не наблюдали (Wu, Chan, 2024).</p></div><div class="static-quiz"><h3>Во внеклеточную среду добавили малый флуоресцентный краситель. Метка цитоплазматического монослоя плазматической мембраны перешла на Ω-профиль слившейся везикулы, но ни краситель, ни ионы H+ в него не проникают, а метка внеклеточного монослоя на него не переходит. Как авторы интерпретируют это состояние?</h3><ol><li><b>А.</b> Широкая пора, через которую выходит содержимое <i>(неверный вариант)</i><br><span class="expl">Через открытую пору малый краситель проник бы в везикулу.</span></li><li><b>Б.</b> Гемислияние: слиты только обращённые друг к другу монослои, поры нет <i>(верный вариант)</i><br><span class="expl">Метка перешла из цитоплазматического монослоя — значит, обращённые к цитоплазме монослои слились; непроницаемость для красителя и H+ и отсутствие метки внеклеточного монослоя показывают, что поры нет. Так гемислияние определяют Wu и Chan (2024).</span></li><li><b>В.</b> Везикула уже полностью распласталась в мембране <i>(неверный вариант)</i><br><span class="expl">Распластанной везикулы как отдельной структуры уже нет; здесь же видна слившаяся, но непроницаемая для красителя структура.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41467-023-44539-7">Wu L.-G., Chan C. Y. Membrane transformations of fusion and budding. Nat Commun. 2024;15:21</a></li></ul><p>Wu, Chan, 2024 — аналитическая статья (рубрика Perspective), обобщающая наблюдения в живых хромаффинных клетках быка; числа — из неё. На схеме гемислияния слиты только обращённые к цитоплазме монослои, а просвет везикулы отделён от внеклеточной среды перегородкой из двух других монослоёв. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-early-endosome"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 15 из 31</div><h2>Ранняя эндосома — сортировочный компартмент</h2><p class="lead">После снятия оболочки эндоцитозные везикулы сливаются друг с другом и с уже образованными <a href="#ns-g-S3-T19">ранними эндосомами</a>. Обычно ранняя эндосома около 10 минут принимает новые везикулы, а затем начинает созревать в позднюю. Основная функция ранних эндосом — сортировка и <a href="#ns-g-S3-T23">рециркуляция</a> белков, поступивших путём эндоцитоза. Это вопрос 9 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Ранняя эндосома: рецепторы возвращаются на поверхность, отделившиеся лиганды уходят к поздним эндосомам; связанные лиганды возвращаются с рецептором.</div><ol class="mech"><li>Эндоцитозные везикулы сливаются друг с другом или с уже существующими ранними эндосомами.</li><li>В ранней эндосоме лиганд часто отделяется от рецептора: этому способствует кислая среда.</li><li>В самом частом варианте рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а отделившийся лиганд остаётся в эндосоме, которая созревает в позднюю, и затем попадает в лизосомы; другие варианты зависят от конкретного рецептора и лиганда (следующий шаг).</li><li>Куда направится рецептор, зависит от сигналов сортировки и убиквитинирования.</li></ol><p>Вспомнить БИО-3·10: клатриновая оболочка сбрасывается до слияния, и в раннюю эндосому поступает неокаймлённый носитель. Дальше ранняя эндосома работает как сортировочная станция: одни белки она возвращает на поверхность, другие направляет к поздним эндосомам и лизосомам.</p><p>ЗАКЛЮЧЕНИЕ: путь лиганда и рецептора определяется двумя событиями в ранней эндосоме — отделяется ли лиганд от рецептора (это зависит от того, как связь лиганда с рецептором меняется в кислой среде) и куда отсортирован рецептор. Эти два события и создают пути рецептора и лиганда (следующий шаг).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как доставка, диффузия и эндоцитоз вместе поддерживают домен плазматической мембраны — <a href="https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes">МБ, семинар 2, шаг 25</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: ранняя эндосома образуется заново из каждой эндоцитозной везикулы.<p class="trap-fix">Ранняя эндосома образуется при слиянии многих эндоцитозных везикул друг с другом, около 10 минут принимает новые везикулы, а затем созревает в позднюю.</p></div><div class="static-quiz"><h3>Какая основная функция ранней эндосомы?</h3><ol><li><b>А.</b> Расщепление всех поступивших белков <i>(неверный вариант)</i><br><span class="expl">Расщепление идёт в лизосомах; ранняя эндосома многие белки, прежде всего рецепторы, возвращает на поверхность.</span></li><li><b>Б.</b> Образование покрытых клатрином везикул из плазматической мембраны <i>(неверный вариант)</i><br><span class="expl">Покрытые везикулы образуются на плазматической мембране; в раннюю эндосому они приходят уже без оболочки.</span></li><li><b>В.</b> Сортировка и рециркуляция белков, поступивших путём эндоцитоза <i>(верный вариант)</i><br><span class="expl">Из ранней эндосомы рецепторы возвращаются на поверхность, а лиганды уходят к поздним эндосомам.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная.</p></details></article><article class="card print-unit" id="ns-four-routes"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 16 из 31</div><h2>Какими путями расходятся рецептор и лиганд</h2><p class="lead">Лиганд-рецепторный комплекс после эндоцитоза проходит одним из четырёх путей. Различаются они тем, отделяется ли лиганд от рецептора в ранней эндосоме и куда направлен рецептор.</p><div class="note"><strong>Что показывает схема.</strong> Три пути на схеме: рециркуляция рецептора и деградация лиганда; рециркуляция обоих; деградация обоих. Четвёртый путь — трансцитоз — описан в тексте.</div><ol class="mech"><li>Рециркуляция рецептора и деградация лиганда — самый частый путь: комплекс в ранней эндосоме диссоциирует, рецептор возвращается на поверхность, лиганд остаётся в эндосоме, которая созревает в позднюю, и расщепляется в лизосоме.</li><li>Рециркуляция рецептора и лиганда: некоторые лиганды, зачастую белки-переносчики, не отделяются от рецептора в ранних эндосомах; комплекс возвращается и распадается на поверхности.</li><li>Деградация рецептора и лиганда: комплекс, например фактор роста EGF с его рецептором, не диссоциирует; <a href="#ns-g-S3-T26">убиквитинированный</a> рецептор вместе с лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца и разрушается в лизосоме.</li><li><a href="#ns-g-S3-T27">Трансцитоз</a>: комплекс димерного IgA с полимерным иммуноглобулиновым рецептором переносится от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом.</li></ol><p>Первые три пути показаны на схеме и в практикуме вопроса 3; трансцитоз требует клетки с двумя разными поверхностями — эпителиальной — и на схеме не показан.</p><p>Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко: клетка переносит IgA через себя, не расщепляя его. Клинический пример иллюстрирует механизм и не является рекомендацией.</p><p>ЗАКЛЮЧЕНИЕ: первые три пути различаются двумя событиями в ранней эндосоме (вспомнить БИО-3·15): отделяется ли лиганд от рецептора и куда отсортирован рецептор — на поверхность или в лизосому. Трансцитоз добавляет третье направление — к противоположной поверхности клетки.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: при деградации рецептора и лиганда они сначала разделяются в ранней эндосоме и расщепляются порознь.<p class="trap-fix">Комплекс (например, EGF с рецептором) не диссоциирует: рецептор вместе с лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца и расщепляется в лизосоме.</p></div><div class="static-quiz"><h3>Белок-переносчик остаётся связанным с рецептором в ранней эндосоме, и этот рецептор направляется обратно на ту же поверхность клетки. Куда попадёт белок-переносчик?</h3><ol><li><b>А.</b> Вернётся на поверхность вместе с рецептором <i>(верный вариант)</i><br><span class="expl">Связанный лиганд следует за рецептором: это путь «рециркуляция рецептора и лиганда». Отделится ли белок-переносчик на поверхности, зависит от свойств комплекса; например, апотрансферрин при нейтральном pH отделяется (БИО-3·19).</span></li><li><b>Б.</b> Расщепится в лизосоме, а рецептор вернётся <i>(неверный вариант)</i><br><span class="expl">Так проходит лиганд, который отделяется от рецептора в ранней эндосоме.</span></li><li><b>В.</b> Перенесётся через клетку на противоположную поверхность <i>(неверный вариант)</i><br><span class="expl">Трансцитоз — перенос к противоположной поверхности эпителиальной клетки; в условии рецептор возвращается на ту же поверхность.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная, трансцитоз на ней не показан.</p></details></article><article class="card print-unit" id="ns-recycling-gain"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 17 из 31</div><h2>Зачем рецептору возвращаться на поверхность</h2><p class="lead">Рециркуляция рецептора позволяет клетке постоянно и избирательно захватывать нужное вещество: одна молекула рецептора работает много раз (ЗАКЛЮЧЕНИЕ). Если рецептор расщепляется вместе с лигандом или, как при трансцитозе, расщепляется на противоположной поверхности клетки, каждая молекула работает один раз (ЗАКЛЮЧЕНИЕ).</p><div class="note"><strong>Что показывает схема.</strong> Возвращающийся рецептор работает много раз; расщепляющийся вместе с лигандом — один раз.</div><ol class="mech"><li>Рецептор связывает лиганд на поверхности и уходит с ним в клетку в покрытой клатрином везикуле.</li><li>В ранней эндосоме лиганд отделяется, и рецептор возвращается на поверхность.</li><li>На поверхности рецептор снова связывает лиганд — цикл повторяется.</li><li>При пути «деградация рецептора и лиганда» рецептор расщепляется в лизосоме и на поверхность не возвращается.</li></ol><p>Полимерный иммуноглобулиновый рецептор переносит димерный IgA от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом. ЗАКЛЮЧЕНИЕ: такая молекула рецептора переносит IgA один раз, и для каждого переноса клетка использует новую молекулу рецептора.</p><p>Сверх программы: сколько раз рецептор проходит цикл, измерено для рецептора ЛПНП (БИО-3·20).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как ответ клетки ослабевает при длительной стимуляции, в том числе за счёт захвата рецепторов внутрь клетки — <a href="https://fresll.github.io/molbio/seminar-3-route.html#desensitization">МБ, семинар 3, шаг 6</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: рецептор расходуется на каждую захваченную молекулу лиганда.<p class="trap-fix">При самом частом пути рецептор возвращается на поверхность и захватывает лиганд снова и снова.</p></div><div class="static-quiz"><h3>Сколько молекул IgA может перенести через эпителиальную клетку одна молекула полимерного иммуноглобулинового рецептора?</h3><ol><li><b>А.</b> Много: после выделения IgA рецептор вернётся на базолатеральную поверхность <i>(неверный вариант)</i><br><span class="expl">Возвращаться нечему: внеклеточная часть рецептора отщепляется и выделяется вместе с IgA.</span></li><li><b>Б.</b> Одну: на апикальной мембране рецептор расщепляется, и его часть уходит в секрет вместе с IgA <i>(верный вариант)</i><br><span class="expl">IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом; ЗАКЛЮЧЕНИЕ.</span></li><li><b>В.</b> Ни одной: комплекс расщепится в лизосоме <i>(неверный вариант)</i><br><span class="expl">Комплекс IgA с рецептором переносится через эндосомы к апикальной мембране, а не в лизосому.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Модель не учитывает синтез новых рецепторов. Схема качественная.</p></details></article><article class="card print-unit" id="ns-late-endosome"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 18 из 31</div><h2>Как ранняя эндосома становится поздней и что попадает в лизосому</h2><p class="lead">По мере созревания ранних эндосом их внутренняя среда становится более кислой, а сами эндосомы уходят глубже в цитоплазму и становятся <a href="#ns-g-S3-T24">поздними</a>. Мембрана созревающей эндосомы впячивается в её просвет и образует внутрипросветные везикулы — так возникает <a href="#ns-g-S3-T25">мультивезикулярное тельце</a>. Поздняя эндосома сливается с лизосомой, и содержимое расщепляется.</p><div class="note"><strong>Что показывает схема.</strong> Ранняя эндосома → поздняя эндосома (мультивезикулярное тельце) → лизосома: среда кислее, положение глубже, содержимое расщепляется.</div><ol class="mech"><li>Ранняя эндосома закисляется и перемещается глубже в цитоплазму.</li><li>Эндосома меняет Rab-белки, липиды, кислотность и положение в клетке; метка ранней эндосомы — Rab5, поздней — Rab7.</li><li>Мембрана поздней эндосомы впячивается в её просвет — образуются внутрипросветные везикулы мультивезикулярного тельца.</li><li>Мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется; некоторые сливаются с плазматической мембраной, и их внутрипросветные везикулы выходят наружу как экзосомы.</li></ol><p>Лизосомы содержат гидролитические ферменты — протеазы, нуклеазы, гликозидазы, липазы и фосфолипазы — и расщепляют макромолекулы, поступившие путём эндоцитоза. Поэтому белок, который не вернулся из ранней эндосомы, обычно оказывается в лизосоме и расщепляется.</p><p>Убиквитинированные рецепторы включаются в мембрану внутрипросветных везикул и вместе с ними попадают в просвет лизосомы. ЗАКЛЮЧЕНИЕ: включение в мембрану внутрипросветных везикул отделяет мембранный белок от ограничивающей мембраны эндосомы, с которой он мог бы вернуться на поверхность.</p><p>Сверх программы: как именно ранняя эндосома становится поздней — смена Rab5 на Rab7, — показано в живых клетках (БИО-3·21).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как меняется метка мембраны при созревании эндосомы — <a href="https://fresll.github.io/molbio/seminar-1-route.html#conversion">МБ, семинар 1, шаг 16</a>; почему для закисления лизосомы нужен насос — <a href="https://fresll.github.io/molbio/seminar-1-route.html#pumps-channels">МБ, семинар 1, шаг 3</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: поздняя эндосома отпочковывается от ранней как отдельный пузырёк.<p class="trap-fix">Ранняя эндосома сама созревает в позднюю: закисляется и уходит глубже в цитоплазму.</p></div><div class="static-quiz"><h3>Что происходит с ранней эндосомой по мере созревания?</h3><ol><li><b>А.</b> Она сливается с плазматической мембраной и исчезает <i>(неверный вариант)</i><br><span class="expl">С плазматической мембраной могут сливаться мультивезикулярные тельца, но созревание ранней эндосомы ведёт к поздней эндосоме.</span></li><li><b>Б.</b> Её среда становится нейтральной, и рецепторы отделяются от лигандов <i>(неверный вариант)</i><br><span class="expl">Наоборот: при созревании среда эндосомы становится кислее.</span></li><li><b>В.</b> Её среда становится кислее, и она уходит глубже в цитоплазму, становясь поздней <i>(верный вариант)</i><br><span class="expl">Так идёт созревание эндосомы; при этом метка Rab5 на её мембране сменяется Rab7.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Значения pH в шаге не используются. Схема качественная.</p></details></article><article class="card print-unit" id="ns-acid-release"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 19 из 31</div><h2>
