е данные","modes_label":"Груз","modes":["раствор + фактор роста","крупная частица"],"map":[1,3],"actin_label":"Перестройка актина","out":"внеклеточная среда","cyto":"цитоплазма","m_route":"Механизм","m_carrier":"Носитель","m_size":"Размер","routes":["микро- и макропиноцитоз","фагоцитоз"],"routes_off":["только микропиноцитоз","нет"],"carriers":["мелкие пузырьки и макропиносомы","фагосома"],"carriers_off":["только мелкие пузырьки","не образуется"],"sizes":["< 150 нм и > 0,2 мкм","> 250 нм"],"sizes_off":["< 150 нм","—"],"notes":["Складки мембраны замыкаются в макропиносомы.","Псевдоподии охватывают частицу; после смыкания их краёв фагосома уходит в цитоплазму (справа)."],"notes_off":["Без перестройки актина складок нет: остаются мелкие пузырьки (по условию модели).","Без перестройки актина псевдоподий нет: частица остаётся снаружи."],"static":["Без перестройки актина не образуются ни макропиносомы, ни фагосомы; мелкие пузырьки по условию модели сохраняются."]}}},{"id":"dynamin-k44a","section":0,"questions":[1],"title":"Как показали, на каком этапе нужен динамин","keywords":["динамин","K44A","ГТФ","трансферрин","HeLa"],"lead":["Мутантный динамин с нарушенными связыванием и гидролизом ГТФ позволил разделить этапы образования покрытой везикулы: ямка собирается и захватывает рецепторы без активного динамина, а сужение шейки и отделение — нет.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В клетках HeLa (линия клеток рака шейки матки человека) включали синтез динамина-1 человека с заменой K44A — лизина в положении 44 на аланин; у такого белка нарушены связывание и гидролиз ГТФ (Damke et al., 1994).","Ямки собирались, впячивались и собирали рецепторы трансферрина (в ямке их примерно в 20 раз больше на единицу площади, чем на остальной мембране, как и в контроле), но не сужались; впяченных ямок становилось примерно вдвое больше.","Захват трансферрина снижался более чем на 80 %, захват EGF (эпидермального фактора роста) — более чем на 60 %; захват жидкости и рециркуляция рецептора трансферрина не менялись."],"paragraphs":["Что уточняет эта работа. Высвобождение покрытой везикулы из мембраны опосредует динамин (БИО-3·2). Эксперимент указывает, какой этап от него зависит: не сборка ямки и не захват рецепторов, а сужение шейки и отделение носителя; для этого динамину нужно связывать и гидролизовать ГТФ.",{"h":"Метод"},"Синтез мутантного белка включали, убирая из среды тетрациклин, и сравнивали клетки до и после включения. Захват трансферрина и EGF измеряли по недоступности меченного биотином лиганда для авидина, добавленного снаружи: лиганд, ушедший в суженную ямку или в отделившийся пузырёк, авидин уже не связывает. Строение ямок оценивали электронной микроскопией, захват жидкости — по пероксидазе хрена в среде.","Контроль: синтез динамина дикого типа в таком же количестве захват не менял. Значит, эффект связан с потерей способности связывать ГТФ, а не с избытком белка. Типичный артефакт метода: мутантный белок синтезировался в количестве, не менее чем в 50 раз превышающем собственный динамин клетки, и подавлял его работу.","Чего данные не доказывают. Мутантный белок подавляет и работу собственного динамина клетки, поэтому эксперимент показывает необходимость активного динамина для отделения носителя, но не механизм — сужает ли динамин шейку сам или вместе с другими белками. Вывод получен на одной линии клеток."],"trap":["Ошибка: без активного динамина клатриновые ямки не образуются.","Ямки собираются, впячиваются и захватывают рецепторы; без активного динамина нарушается следующий этап — сужение шейки и отделение носителя (Damke et al., 1994)."],"conditions":"Damke et al., 1994: клетки HeLa; индуцируемый синтез динамина-1 человека дикого типа или K44A; захват трансферрина и EGF — начальная скорость перехода в суженные ямки и пузырьки; захват жидкости — пероксидаза хрена. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Damke1994"],"quiz":{"id":"S3-L04","question":"В клетках HeLa с мутантным динамином K44A меченый трансферрин связался с рецепторами. Что изменится по сравнению с контролем?","options":[{"id":"S3-L04-1","text":"Рецепторы концентрируются в ямках, как в контроле, но комплексы остаются на поверхности","correct":true,"feedback":"Концентрирование рецепторов в ямках не нарушено (примерно в 20 раз выше, чем на остальной мембране), но ямки не сужаются и не отделяются, поэтому комплексы остаются на поверхности клетки (Damke et al., 1994)."},{"id":"S3-L04-2","text":"Рецепторы перестают концентрироваться в ямках и рассеиваются по мембране","correct":false,"feedback":"Сборка ямок и концентрирование в них рецепторов от динамина не зависят: в клетках с K44A рецепторы в ямках собираются так же, как в контроле."},{"id":"S3-L04-3","text":"Комплексы, как в контроле, за минуты попадают в ранние эндосомы","correct":false,"feedback":"Чтобы попасть в эндосому, носитель должен отделиться от мембраны; без активного динамина захват трансферрина снижен более чем на 80 %."}]},"widget":{"kind":"dynamin","title":"","s":{"title":"Сравните контрольные клетки и клетки с мутантным динамином","status":"Данные Damke et al., 1994 · клетки HeLa","modes_label":"Клетки","modes":["контроль","динамин K44A"],"out":"внеклеточная среда","cyto":"цитоплазма","ring":"кольцо динамина","tube":"трубка, связанная с поверхностью","m_tfn":"Захват трансферрина","m_pits":"Впяченные ямки","m_fluid":"Захват жидкости","tfn":["контроль","ниже более чем на 80 %"],"pits":["контроль","примерно вдвое больше"],"fluid":["контроль","не изменён"],"notes":["Ямка сужается, динамин на шейке, покрытые везикулы отделяются.","Ямки впячены, но шейки не сужаются; носители не отделяются, часть мембраны вытянута в трубки."],"static":["Контроль: ямки сужаются и отделяются. Динамин K44A: ямки впячены, шейки не сужаются, захват трансферрина ниже более чем на 80 %, захват жидкости не изменён."]}},"level":"adv"},{"id":"lipid-sorting","section":0,"questions":[1],"title":"Отбирает ли клатриновая ямка липиды так же, как белки","keywords":["липиды","клатрин","асимметрия","STED","фосфатидилхолин"],"lead":["Белки-рецепторы концентрируются в клатриновой ямке через адаптеры, а липиды мембраны попадают в неё почти в той же доле, что и в окружающую мембрану.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В поздних ямках (с динамином) 10 видов липидов распределены почти равномерно: от 0,84 до 1,07 относительно окружающей мембраны (Lennartz et al., 2026).","Насыщенные липиды слегка обогащены в ямке, полиненасыщенные слегка обеднены; различия между видами — до 21 %.","Различия между видами коррелируют с неравным распределением липидов между листками мембраны ([[T12|асимметрией]]) и с их температурой плавления; с числом рецепторов в ямке связь слабая. Проверить, вызывает ли асимметрия эти различия, не удалось."],"paragraphs":["Что уточняет эта работа. Груз в клатриновой ямке концентрируют рецепторы и адаптеры (БИО-3·2). Работа отвечает на другой вопрос: переносит ли этот путь мембрану избирательно. После поправки на геометрию ямки сильного обогащения липидов не обнаружено, но разные виды липидных зондов распределяются с небольшими, статистически значимыми различиями — до 21 %. Клатриновый носитель отбирает белки, а липиды несёт почти в том составе, который есть в плазматической мембране.",{"h":"Метод"},"Липидные зонды, близкие к природным, встраивали в наружный листок мембраны клеток меланомы человека SK-MEL2, за 3 секунды сшивали ультрафиолетом с соседними белками и фиксировали. Затем липид и клатрин снимали методом STED — флуоресцентной микроскопией сверхвысокого разрешения — и сравнивали яркость липида в ямке и в окружающей мембране. Стадию ямки определяли по меткам: адаптерный комплекс AP2 и клатрин — ранняя, плюс динамин-2, меченный зелёным флуоресцентным белком (GFP), — поздняя.","Главный контроль — модель. Изогнутая мембрана ямки в проекции даёт больше сигнала, чем плоская, поэтому кажущееся обогащение фосфатидилхолина 16:0 — PC(16:0) — в поздней ямке составило 2,09. Почти такую же величину (2,10) дала модель с равномерно распределённым липидом на реальной геометрии ямок; после поправки на геометрию обогащение близко к 1.","Чего данные не доказывают. Причинную роль асимметрии проверить не удалось: обработка, запускающая перемешивание липидов между листками (вход кальция и активация скрамблазы), разбирала поздние ямки примерно вчетверо быстрее, чем шло само перемешивание, поэтому измерить распределение липидов в ямках после перемешивания нельзя. Зонды близки к природным липидам, но не тождественны им; работа выполнена на одной линии клеток."],"trap":["Ошибка: яркий сигнал липида в ямке означает, что ямка его отбирает.","Изогнутая мембрана в проекции даёт больше сигнала, чем плоская; без поправки на геометрию обогащение завышается примерно вдвое (Lennartz et al., 2026)."],"conditions":"Lennartz et al., 2026: клетки SK-MEL2 с динамином-2–GFP; 10 бифункциональных липидных зондов; STED; поправка на геометрию по электронно-микроскопическим данным для той же линии. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Lennartz2026"],"quiz":{"id":"S3-L05","question":"В поздних ямках сигнал фосфатидилхолина в 2,09 раза ярче, чем в окружающей мембране, а модель с равномерно распределённым липидом даёт 2,10. Какой вывод допустим?","options":[{"id":"S3-L05-1","text":"Ямка отбирает фосфатидилхолин и концентрирует его вдвое","correct":false,"feedback":"Модель без отбора даёт ту же величину; разница создаётся геометрией ямки, а не отбором."},{"id":"S3-L05-2","text":"Липид распределён почти равномерно; яркость объясняет форма ямки","correct":true,"feedback":"Модель без всякого отбора даёт ту же яркость, значит, избыток сигнала создаёт изогнутая мембрана в проекции (Lennartz et al., 2026)."},{"id":"S3-L05-3","text":"Фосфатидилхолин исключён из клатриновой ямки","correct":false,"feedback":"Измеренный сигнал равен модельному, а не ниже его; исключения нет."}]},"widget":{"kind":"lipids","title":"","s":{"title":"Сравните измеренный сигнал с моделью","status":"Данные Lennartz et al., 2026 · клетки SK-MEL2, поздние ямки","modes_label":"Показать","modes":["кажущееся обогащение","после поправки на геометрию"],"bars":["измерено, фосфатидилхолин 16:0","модель без отбора"],"axis":"сигнал липида в ямке / в окружающей мембране","vals":[2.09,2.1],"range_label":"диапазон значений|для 10 видов липидов|(не доверительный интервал)","range":[0.84,1.07],"one":"1 — как в окружающей мембране","notes":["Без поправки ямка кажется вдвое обогащённой липидом — так же, как в модели без всякого отбора.","После поправки 10 липидов лежат между 0,84 и 1,07: сильного обогащения нет, но небольшие различия между видами статистически значимы."],"static":["Измерено 2,09, модель без отбора 2,10; после поправки на геометрию 10 липидов — от 0,84 до 1,07 (диапазон между видами, не доверительный интервал)."]}},"level":"adv"},{"id":"caveolar-endocytosis","section":0,"questions":[1],"title":"Чем кавеола отличается от клатриновой ямки","keywords":["кавеола","кавеолин","кавин","холестерин","EHD2"],"lead":["[[T10|Кавеола]] — впячивание плазматической мембраны из кавеолинов и кавинов; по модели авторов, её изгиб и отделение определяются взаимодействием дисков кавеолина с липидами мембраны, прежде всего с холестерином, а не оболочкой с адаптерами, как у клатриновой ямки.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Кавеолин-1 образует диски из 11 молекул, встроенные в цитоплазматический листок; кавины собираются в периферическую оболочку (Parton et al., 2026).","По модели авторов, больше холестерина и гликосфинголипидов — сильнее изгиб и вероятнее отделение кавеолы; меньше холестерина — кавеола распластывается.","Кольца белка EHD2 на шейке ограничивают отделение; без EHD2 кавеолы отделяются чаще. Роль динамина в отделении кавеол оспаривается."],"paragraphs":["Что уточняет эта работа. Кавеолы нередко описывают как ещё один путь захвата жидкости мелкими пузырьками. Авторы показывают, что кавеолы устроены и отделяются иначе, чем клатриновые ямки: модельные трансмембранные белки из кавеол исключены, а в каждый момент лишь около 5 % кавеол клетки связаны с ранними эндосомами.","В клатриновом пути оболочка с адаптерами отбирает груз, а ГТФаза динамин сужает шейку. В кавеоле изгиб создаёт сочетание дисков кавеолина с липидами, обогащёнными холестерином и сфингомиелином; по оценке на основе структуры, один диск занимает в цитоплазматическом листке место около 250 молекул липидов. Отделение кавеолы ограничивают кольца EHD2 (белка 2 с EH-доменом) на шейке; динамин, по данным, приведённым в работе, скорее удерживает часть кавеол на мембране.",{"h":"Метод"},"Динамику кавеол изучают по флуоресцентному кавеолину или кавину-1 в живых клетках (лучше — в клетках с отредактированным геномом, без избыточного синтеза белка), электронной микроскопией и по метке, которую добавляют снаружи и затем удаляют с поверхности: остаётся только метка внутри отделившихся кавеол.","Чего данные не доказывают. Главный тезис авторов — кавеола не столько путь для белкового груза, сколько чувствительный к липидам участок поверхности. Это модель, обобщающая эксперименты в культуре клеток; роль кавеолярного эндоцитоза в тканях и набор грузов, которым кавеолы необходимы, остаются открытыми вопросами."],"trap":["Ошибка: кавеола — та же клатриновая ямка, только с другим белком оболочки.","Механизмы разные: клатриновую ямку формируют оболочка с адаптерами и динамин, а изгиб и отделение кавеолы определяют диски кавеолина и липиды мембраны (Parton et al., 2026)."],"conditions":"Parton, Kozlov, Lundmark, 2026 — аналитическая статья с авторской моделью (рубрика Perspective): обзор экспериментов в культуре клеток и биофизическая модель авторов. Числа (5 %, 11 молекул, около 250 липидов) — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Parton2026"],"quiz":{"id":"S3-L06","question":"Из мембраны клеток в культуре удалили значительную часть холестерина. Что произойдёт с кавеолами?","options":[{"id":"S3-L06-1","text":"Кавеолы будут чаще отделяться от мембраны","correct":false,"feedback":"Отделение усиливает добавление холестерина, а не его удаление."},{"id":"S3-L06-2","text":"Кавеолы превратятся в клатриновые ямки","correct":false,"feedback":"Кавеолы и клатриновые ямки построены из разных белков; удаление холестерина не переводит одну структуру в другую."},{"id":"S3-L06-3","text":"Кавеолы распластаются","correct":true,"feedback":"Изгиб кавеолы поддерживают липиды, прежде всего холестерин; его снижение вызывает распластывание кавеол (Parton et al., 2026)."}]},"widget":{"kind":"cavlip","title":"","s":{"title":"Измените содержание холестерина в мембране","status":"Качественная схема по модели Parton et al., 2026 · положения переключателя — не измеренные пороги","modes_label":"Холестерин","modes":["снижен","обычный","повышен"],"ehd2":"Кольца EHD2 на шейке","out":"внеклеточная среда","cyto":"цитоплазма","m_shape":"Кавеола в модели","shapes":["распластана","впячена","изгиб сильнее, отделение вероятнее"],"shapes_noehd":["распластана","отделяется чаще","изгиб сильнее, отделение вероятнее"],"notes":["Меньше холестерина — изгиб исчезает, кавеола распластывается.","Обычный состав: кавеола впячена; EHD2 ограничивает отделение.","Больше холестерина — по модели авторов, изгиб усиливается и отделение кавеолы становится вероятнее; EHD2 на шейке этому противодействует."],"note_noehd":"Обычный состав, колец EHD2 нет: кавеолы отделяются от мембраны чаще (Parton et al., 2026).","ehd_hint":"Влияние EHD2 показано при обычном содержании холестерина.","static":["Снижение холестерина — кавеола распластывается; повышение — по модели авторов отделение вероятнее; без EHD2 отделение учащается. Положения переключателя не являются измеренными концентрационными порогами."]}},"level":"adv"},{"id":"caveolae-reserve","section":0,"questions":[1],"title":"Как кавеолы защищают мембрану при набухании клетки","keywords":["кавеолы","натяжение","гипоосмотическая среда","кавеолин-1","резерв мембраны"],"lead":["Кавеола — колбовидное впячивание мембраны, стабилизированное кавеолинами и кавинами; при повышении натяжения она распластывается, и площадь плоской мембраны увеличивается без синтеза новой мембраны.","Ниже — эксперимент, который это показал: сверх программы, на коллоквиуме и зачёте не требуется."],"mechanism":["В гипоосмотической среде вода входит в клетку, и клетка набухает: объём клеток HeLa в среде 30 мОсм (миллиосмоль на литр; обычная среда — около 300 мОсм) за 5 минут вырос на 35 % (Sinha et al., 2011).","Часть кавеол распластывается: кавин-1 отделяется от кавеолина, кавеолин переходит в плоскую мембрану; АТФ и перестройка актина для этого не нужны.","У эндотелиальных клеток мыши без кавеолина-1 при 150 мОсм сила вытягивания мембранной нити выросла на 200 %, мембрана чаще разрывалась; у клеток дикого типа [[T11|натяжение]] почти не менялось. После возврата из среды 30 мОсм в обычную кавеолы за 2–5 минут собирались снова, и для этого нужен АТФ."],"paragraphs":["Что уточняет эта работа. Кавеолы служат резервом мембраны; эксперимент показывает, как этот резерв работает и что происходит без него.",{"h":"Метод"},"Натяжение оценивали по силе, с которой мембрана удерживает тонкую нить, вытянутую оптическим пинцетом за приклеенную к мембране бусину: чем выше натяжение, тем больше сила. Число кавеол на поверхности считали флуоресцентной микроскопией полного внутреннего отражения, строение оценивали электронной микроскопией. Контроль — клетки без кавеолина-1 и те же клетки после восстановления его синтеза. Типичный артефакт: сила нити зависит и от сцепления мембраны с цитоскелетом, поэтому сравнивают изменения в первые минуты, пока кортикальный актин не перестраивается.","Распластывание — не эндоцитоз: ингибитор динамина динасор не предотвращал потерю кавеол. Клатриновые ямки при набухании почти не исчезали — не больше одной десятой от числа исчезнувших кавеол — и натяжение не гасили. Распластывание шло и в «сферах» плазматической мембраны, где нет органелл и актиновых филаментов: это собственное механическое свойство кавеол.","Значение для медицины и границы вывода. Миотрубки человека с мутацией кавеолина-3 P28L (замена пролина в положении 28 на лейцин), при которой белок задерживается в комплексе Гольджи, не гасили скачок натяжения и чаще разрывались. Это показано на клетках в культуре; механизм поражения мышцы у больного этим не исчерпывается."],"trap":["Ошибка: кавеолы исчезают с поверхности при набухании, потому что уходят внутрь клетки эндоцитозом.","Кавеолы распластываются в мембране: ингибитор динамина их потерю не предотвращает, а после возврата в обычную среду кавеолы снова собираются на поверхности (Sinha et al., 2011)."],"conditions":"Sinha et al., 2011: клетки HeLa с Cav1-EGFP (30 мОсм, подсчёт кавеол), эндотелий лёгких мыши дикого типа и Cav1−/− (150 мОсм, сила вытягивания нити), миотрубки человека с Cav3 P28L. Числа — из этой работы, каждое со своими условиями. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Sinha2011"],"quiz":{"id":"S3-L07","question":"Перед гипоосмотическим шоком клетки дикого типа лишили АТФ. Будут ли кавеолы распластываться?","options":[{"id":"S3-L07-1","text":"Да: распластывание не требует АТФ","correct":true,"feedback":"Распластывание кавеол — пассивный механический ответ: оно шло и в клетках без АТФ, и при разрушенном актине. АТФ нужен для обратной сборки кавеол (Sinha et al., 2011)."},{"id":"S3-L07-2","text":"Нет: без АТФ кавеолы не могут изменить форму","correct":false,"feedback":"АТФ нужен для обратной сборки кавеол после шока, а не для распластывания."},{"id":"S3-L07-3","text":"Нет: кавеолы распластывает динамин за счёт ГТФ","correct":false,"feedback":"Ингибитор динамина динасор не предотвращал потерю кавеол; распластывание — механический ответ на натяжение мембраны."}]},"widget":{"kind":"reserve","title":"","s":{"title":"Перенесите клетки в гипоосмотическую среду","status":"Данные Sinha et al., 2011 · HeLa (30 мОсм, подсчёт кавеол) и эндотелий лёгких мыши (150 мОсм, сила нити)","modes_label":"Клетки","modes":["дикий тип","без кавеолина-1"],"load_label":"Среда","loads":["изоосмотическая","гипоосмотическая"],"out":"внеклеточная среда","cyto":"цитоплазма","m_cav":"Кавеолы","m_force":"Сила вытягивания нити","cav":[["много","часть распластана"],["нет","нет"]],"force":[["исходная","почти не меняется"],["исходная","+200 %"]],"notes":[["Кавеолы хранят запас мембраны.","Кавеолы распластываются — натяжение почти не растёт."],["Кавеол нет.","Запаса нет — натяжение резко растёт, мембрана чаще рвётся."]],"static":["Дикий тип в гипоосмотической среде: кавеолы распластываются, сила почти не меняется. Без кавеолина-1: сила +200 %."]}},"level":"adv"},{"id":"caveolae-muscle","section":0,"questions":[1],"title":"Почему мутации кавеолина-3 поражают прежде всего мышцы","keywords":["кавеолин-3","CAV3","мышечная дистрофия","сарколемма","механика"],"lead":["Кавеолин-3 входит в состав кавеол волокон скелетных мышц, которые постоянно растягиваются; мутации CAV3 нарушают образование кавеол, и мембрана мышечного волокна становится хрупкой.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Кавеолы — впячивания 50–100 нм из кавеолинов (Cav1–Cav3) и кавинов; Cav3 характерен для скелетной мышцы (Lamaze et al., 2026).","Мутантный Cav3 задерживается в комплексе Гольджи, кавеолы в сарколемме не образуются, её устойчивость к растяжению снижается.","Мутации гена CAV3, кодирующего кавеолин-3, вызывают поясно-конечностную мышечную дистрофию 1C и болезнь «волнообразных мышц»."],"paragraphs":["Что уточняет эта работа. Обзор подытоживает: роль кавеол в избирательном эндоцитозе сейчас считают второстепенной по сравнению с их механическими функциями. Кавеол особенно много в мышцах, эндотелии и жировых клетках — тканях, которые постоянно растягиваются, — что согласуется с ролью резерва мембраны.","Кавеолин-3 синтезируется в скелетной мышце. При сокращении и растяжении волокна запас мембраны в кавеолах гасит скачки натяжения. Без кавеол каждое растяжение сильнее нагружает сарколемму — плазматическую мембрану мышечного волокна.",{"h":"Метод"},"Обзор объединяет разные методы: электронную микроскопию и микроскопию сверхвысокого разрешения (строение кавеол), криоэлектронную микроскопию олигомеров кавеолина, измерение натяжения мембраны и генетику больных. Натяжение, при котором кавеолы распластываются (около 0,1 мН/м), получено расчётом по физической модели мембраны, а не прямым измерением. Контроль в таких работах — клетки или волокна того же типа без мутации. Ограничение: обзор сводит данные разных моделей — клеток в культуре, мышей и больных, — и числа, полученные в одной модели, нельзя переносить на другую.","Чего данные не доказывают. Цепочка «нет кавеол — хрупкая мембрана — дистрофия» согласуется с экспериментами на клетках, но поражение мышцы у конкретного больного зависит и от других белков сарколеммы. Медицинский пример иллюстрирует механизм и не является клиническим описанием."],"trap":["Ошибка: кавеолы нужны прежде всего для захвата грузов в клетку.","По современным данным их главная функция — механическая: резерв мембраны и передача сигнала при растяжении; вклад в эндоцитоз второстепенен (Lamaze et al., 2026)."],"conditions":"Lamaze, Blouin, Sens, 2026 — обзор. Оценка критического натяжения — расчёт по модели. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Lamaze2026"],"quiz":{"id":"S3-L08","question":"В мышечных волокнах мутантный кавеолин-3 задерживается в комплексе Гольджи. Что вероятнее всего произойдёт при повторяющемся растяжении волокна?","options":[{"id":"S3-L08-1","text":"Клатриновые ямки распластаются и заменят кавеолы","correct":false,"feedback":"Клатриновые ямки — места образования носителей эндоцитоза; роль резерва мембраны обзор отводит кавеолам (Lamaze et al., 2026; данные о ямках при набухании клетки — вспомнить БИО-3·7)."},{"id":"S3-L08-2","text":"Сарколемма будет чаще повреждаться: запаса мембраны в кавеолах нет","correct":true,"feedback":"Без кавеол растяжение не гасится распластыванием впячиваний, и мембрана повреждается чаще (Lamaze et al., 2026)."},{"id":"S3-L08-3","text":"Ничего не изменится: кавеолы нужны только для захвата грузов","correct":false,"feedback":"Главная функция кавеол — механическая; без них мембрана хуже переносит растяжение."}]},"widget":{"kind":"reserve","title":"","s":{"title":"Растяните мышечное волокно","status":"Качественная схема по Lamaze et al., 2026 · не экспериментальные данные","modes_label":"Кавеолин-3","modes":["норма","мутантный (в комплексе Гольджи)"],"load_kind":"stretch","load_label":"Нагрузка","loads":["покой","растяжение"],"out":"внеклеточная среда","cyto":"цитоплазма волокна","m_cav":"Кавеолы в сарколемме","m_force":"Нагрузка на мембрану","cav":[["много","распластываются"],["нет","нет"]],"force":[["обычная","погашена кавеолами"],["обычная","высокая: мембрана повреждается"]],"notes":[["Кавеолы в сарколемме хранят запас мембраны.","При растяжении кавеолы распластываются и гасят нагрузку."],["Кавеол в сарколемме нет.","Растяжение не гасится — сарколемма повреждается чаще."]],"static":["Норма: при растяжении кавеолы распластываются. Мутантный кавеолин-3: кавеол нет, сарколемма повреждается чаще."]}},"level":"adv"},{"id":"carrier-cycle","section":1,"questions":[2],"title":"Из каких этапов состоит цикл транспортного носителя","keywords":["носитель","оболочка","COP-II","COP-I","клатрин","SNARE"],"lead":["[[T13|Транспортный носитель]] переносит груз между мембранами: он образуется почкованием от мембраны одного компартмента и сливается с мембраной другого.","Цикл носителя удобно разделить на этапы: сборка оболочки и отбор груза, отделение, снятие оболочки, узнавание мишени и слияние. Это продолжение вопроса 8 коллоквиума."],"mechanism":["Белки [[T14|оболочки]] собираются на мембране-доноре, отбирают груз и изгибают мембрану.","Носитель отделяется от донора; на плазматической мембране отделение покрытой клатрином везикулы опосредует динамин.","Носитель сбрасывает оболочку.","[[T18|Rab-белки и тетеринг-факторы]] обеспечивают первичное узнавание мишени.","[[T17|SNARE-белки]] носителя и мишени собираются в комплекс, и мембраны сливаются."],"paragraphs":["Оболочки разных участков мембранной сети различаются. [[T15|COP-II]] образует носители, которые переносят только что синтезированные белки из грЭПР в цис-сеть комплекса Гольджи; [[T16|COP-I]] — носители обратного транспорта из комплекса Гольджи в грЭПР и между его цистернами; клатрин с адаптерами — носители от плазматической мембраны и от транс-сети комплекса Гольджи.","Оболочка выполняет две работы: связывает груз (у клатрина — через адаптеры, связывающие цитоплазматические участки рецепторов груза) и придаёт мембране кривизну. Поэтому без оболочки нет ни отбора груза, ни самого носителя.","SNARE-белки называют по мембране, на которой они находятся: v-SNARE — на носителе, t-SNARE — на мембране-мишени. Есть и другие названия — R- и Q-SNARE, по остатку аргинина или глутамина в центре комплекса. Сверх программы: это две разные классификации, а не старое и новое название одних и тех же белков; у носителя из ЭПР есть и R-, и Q-SNARE (БИО-3·12).","ЗАКЛЮЧЕНИЕ: схема цикла на всех маршрутах одна и та же, а различается набор белков — какая оболочка образует носитель на этом участке и по каким белкам носитель узнаёт мишень.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как носитель движется от донора к мишени по микротрубочкам и актиновым филаментам с помощью моторных белков — [[https://fresll.github.io/molbio/seminar-2-route.html#tracks|МБ, семинар 2, шаг 1]]; как моторный белок связывается со своим грузом через адаптер — [[https://fresll.github.io/molbio/seminar-2-route.html#adaptors|МБ, семинар 2, шаг 3]]."],"trap":["Ошибка: считать, что везикулу направляет к плазматической мембране её оболочка COP-I или COP-II.","Белки оболочки обеспечивают отбор груза и образование носителя на участке ЭПР — комплекс Гольджи; к плазматической мембране секреторные везикулы перемещаются по микротрубочкам с помощью моторных белков."],"conditions":"Схема качественная: показан один носитель на каждом этапе.","sources":["Alberts2022"],"quiz":{"id":"S3-L09","question":"Какая оболочка образует носитель, который переносит белки из транс-сети комплекса Гольджи в позднюю эндосому?","options":[{"id":"S3-L09-1","text":"COP-I","correct":false,"feedback":"COP-I обеспечивает ретроградный транспорт: из комплекса Гольджи в грЭПР и между цистернами комплекса Гольджи."},{"id":"S3-L09-2","text":"COP-II","correct":false,"feedback":"COP-II образует носители в прямом направлении — на выходе из грЭПР в комплекс Гольджи."},{"id":"S3-L09-3","text":"Клатрин","correct":true,"feedback":"При прямом пути белки покидают транс-сеть комплекса Гольджи в покрытых клатрином везикулах; клатрин образует носители на плазматической мембране и в транс-сети комплекса Гольджи."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Выберите участок сети и сравните оболочки носителей","status":"Схема качественная · не экспериментальные данные","modes_label":"Участок","modes":["ЭПР → комплекс Гольджи","между цистернами комплекса Гольджи","транс-сеть Гольджи → поздняя эндосома"],"cfg":[["erg","none"],["intra","none"],["tgn","none"]],"names":{"erg":["грЭПР","комплекс Гольджи"],"gerr":["комплекс Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","поздняя эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Оболочка","Груз","Направление"],"v":[["COP-II","COP-I","клатрин"],["белки из грЭПР","мембранные ферменты-резиденты","мембранные белки лизосом"],["прямой транспорт","обратный транспорт","прямой транспорт"]],"notes":["Носитель с оболочкой COP-II отделяется от грЭПР, сбрасывает оболочку и сливается с цис-сетью комплекса Гольджи.","Носитель с оболочкой COP-I возвращает мембранные ферменты-резиденты (например, гликозилтрансферазы) из более поздней цистерны комплекса Гольджи в более раннюю.","Покрытая клатрином везикула с мембранными белками лизосом отделяется от транс-сети комплекса Гольджи, сбрасывает оболочку и сливается с поздней эндосомой."],"static":["Этапы цикла на всех участках одинаковы; различаются белки оболочки: COP-II — на выходе из грЭПР, COP-I — в обратном транспорте между цистернами комплекса Гольджи, клатрин — в транс-сети комплекса Гольджи."]}}},{"id":"uncoating","section":1,"questions":[2],"title":"Зачем носитель сбрасывает оболочку","keywords":["снятие оболочки","клатрин","слияние","ранняя эндосома"],"lead":["Оболочка нужна, чтобы отобрать груз и изогнуть мембрану, но после отделения носителя она мешала бы его взаимодействию с мишенью.","Поэтому снятие оболочки — отдельный обязательный этап цикла: клатриновая оболочка сбрасывается, и только после этого везикула может слиться с мембраной-мишенью."],"mechanism":["Покрытая клатрином везикула отделяется от плазматической мембраны.","Клатриновая оболочка сбрасывается; её компоненты возвращаются в цитоплазму для нового цикла.","Неокаймлённый носитель сливается с [[T19|ранней эндосомой]], используя Rab- и SNARE-системы."],"paragraphs":["Носители других маршрутов тоже сбрасывают значительную часть оболочки до слияния с мишенью. Белки оболочки при этом не расходуются: они возвращаются в цитоплазму и собираются на мембране-доноре снова.","ЗАКЛЮЧЕНИЕ: если оболочка не снимается, носитель уже отделился и несёт груз, но с мишенью не сливается; покрытые носители накапливаются в цитоплазме, а груз в мишень не поступает.","Именно так ведёт себя модель практикума вопроса 2, если убрать снятие оболочки (вкладка «Цикл носителя»). Вспомнить БИО-3·2: оболочка собирается вокруг рецепторов с грузом через адаптеры."],"trap":["Ошибка: оболочка снимается при слиянии, поэтому носитель может слиться и покрытым.","Порядок обратный: оболочку сбрасывает уже отделившийся носитель, и только после этого он может слиться с мембраной-мишенью."],"conditions":"Белки, снимающие оболочку, в шаге не обсуждаются. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L10","question":"Покрытая клатрином везикула отделилась, но оболочка с неё не снимается. Где окажутся рецепторы с лигандом?","options":[{"id":"S3-L10-1","text":"В покрытых везикулах в цитоплазме","correct":true,"feedback":"Оболочка сбрасывается, позволяя везикуле слиться с целевой мембраной; без этого везикулы остаются в цитоплазме, и груз в раннюю эндосому не попадает."},{"id":"S3-L10-2","text":"В ранней эндосоме: оболочка снимется при слиянии","correct":false,"feedback":"Снятие оболочки предшествует слиянию: покрытый носитель с мишенью не сливается."},{"id":"S3-L10-3","text":"На поверхности клетки, в неотделившихся ямках","correct":false,"feedback":"Отделение везикулы обеспечивает динамин, и в этой ситуации оно не нарушено: нарушен следующий этап."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Сравните нормальный цикл и цикл без снятия оболочки","status":"Схема качественная · не экспериментальные данные","modes_label":"Состояние","modes":["норма","оболочка не снимается"],"cfg":[["pme","none"],["pme","uncoat"]],"names":{"erg":["грЭПР","комплекс Гольджи"],"gerr":["комплекс Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","поздняя эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Носители","Оболочка","Груз в ранней эндосоме"],"v":[["сливаются с эндосомой","в цитоплазме"],["снята","сохраняется"],["есть","нет"]],"notes":["Везикула отделилась, сбросила клатриновую оболочку и слилась с ранней эндосомой; груз в эндосоме.","Везикулы отделились, но остаются покрытыми клатрином и с ранней эндосомой не сливаются; груз остаётся в них."],"static":["Норма: оболочка снимается, везикула сливается с ранней эндосомой. Без снятия оболочки покрытые везикулы накапливаются в цитоплазме."]}}},{"id":"docking-fusion","section":1,"questions":[2],"title":"Как носитель узнаёт мишень и сливается с ней","keywords":["Rab","тетеринг-факторы","SNARE","слияние","мишень"],"lead":["Прежде чем слиться с мишенью, носитель должен её узнать. Это делают в два этапа разные белки: Rab-белки и тетеринг-факторы удерживают подходящий носитель у мембраны, а SNARE-белки сближают мембраны до слияния.","Слияние обеспечивает взаимодействие SNARE-белков носителя и мембраны-мишени; Rab-белки и тетеринг-факторы отбирают подходящий носитель ещё до этого."],"mechanism":["Rab в активной форме (связанный с ГТФ) отмечает мембрану-мишень и привлекает длинные тетеринг-факторы.","Тетеринг-факторы удерживают подходящий носитель у мишени на расстоянии.","SNARE носителя и SNARE мишени собираются в плотный четырёхспиральный комплекс, который сближает бислои; мембраны сливаются."],"paragraphs":["Точность доставки обеспечивается последовательными проверками: сначала первичное узнавание, затем сборка комплементарных SNARE-белков двух мембран. Слияние обеспечивают SNARE-белки обеих мембран — v-SNARE носителя и t-SNARE мишени.","SNARE-белки работают при слиянии секреторной везикулы с плазматической мембраной — после слияния SNARE-комплекс разбирает АТФаза NSF — и при слиянии транспортных везикул с поздними эндосомами.",{"h":"Дальше в курсе «Молекулярная биология»"},"Чем мембранный контактный сайт отличается от слияния — [[https://fresll.github.io/molbio/seminar-1-route.html#contact-site|МБ, семинар 1, шаг 22]]; почему слияние, закисление и гидролиз в лизосоме — разные процессы — [[https://fresll.github.io/molbio/seminar-7-route.html#fusion-acidity|МБ, семинар 7, шаг 26]]."],"trap":["Ошибка: SNARE-белки узнают мишень на расстоянии, ещё до того, как носитель к ней приблизился.","На расстоянии носитель удерживают тетеринг-факторы, которых привлекает Rab-белок мишени; SNARE-белки собираются в комплекс, когда мембраны уже сближены."],"conditions":"Схема качественная: показаны один SNARE мишени и один SNARE носителя вместо четырёх спиралей комплекса.","sources":["Alberts2022"],"quiz":{"id":"S3-L11","question":"Какие белки первыми связывают приближающийся носитель с мембраной-мишенью?","options":[{"id":"S3-L11-1","text":"SNARE-белки носителя","correct":false,"feedback":"SNARE-белки собираются в комплекс позже, когда носитель уже удерживается у мишени."},{"id":"S3-L11-2","text":"Тетеринг-факторы, которых привлекает Rab в активной форме","correct":true,"feedback":"Rab, связанный с ГТФ, отмечает мембрану-мишень и привлекает длинные тетеринг-факторы; они удерживают подходящий носитель на расстоянии."},{"id":"S3-L11-3","text":"Белки оболочки носителя","correct":false,"feedback":"Оболочка снимается до слияния; узнавание мишени обеспечивают Rab-белки и тетеринг-факторы."}]},"widget":{"kind":"cycle","title":"","s":{"title":"Выключите этапы цикла по очереди","status":"Схема качественная · не экспериментальные данные","modes_label":"Что выключено","modes":["ничего","белки оболочки","снятие оболочки","SNARE на носителе"],"cfg":[["tgn","none"],["tgn","coat"],["tgn","uncoat"],["tgn","snare"]],"names":{"erg":["грЭПР","комплекс Гольджи"],"gerr":["комплекс Гольджи","грЭПР"],"intra":["более поздняя цистерна","более ранняя цистерна"],"tgn":["транс-сеть Гольджи","поздняя эндосома"],"pme":["плазматическая мембрана","ранняя эндосома"]},"warn":{"coat":"носитель не образуется","uncoat":"оболочка не снимается","snare":"нет SNARE — нет слияния"},"out":"внеклеточная среда","cyto":"цитоплазма","m":["Где носители","Оболочка","Груз в поздней эндосоме"],"v":[["слились с мишенью","не образуются","в цитоплазме","у мишени"],["снята","не собирается","сохраняется","снята"],["есть","нет","нет","нет"]],"notes":["Покрытые клатрином везикулы отделяются от транс-сети комплекса Гольджи, сбрасывают оболочку и сливаются с поздней эндосомой.","Без клатрина везикулы в транс-сети не образуются; белки остаются в комплексе Гольджи.","Везикулы отделились, но остаются покрытыми клатрином и накапливаются в цитоплазме.","Везикулы сбросили оболочку и удерживаются у поздней эндосомы, но без SNARE на носителе не сливаются."],"static":["Схема показывает, где оказываются носители и груз, если выключить один из этапов цикла на пути из транс-сети комплекса Гольджи в позднюю эндосому."]}}},{"id":"snare-zipper","section":1,"questions":[2],"title":"Как SNARE-комплекс сближает мембраны и почему его нужно разбирать","keywords":["SNARE","застёгивание","Qa","Qb","Qc","R-SNARE","NSF"],"lead":["Одиночные SNARE-белки неактивны и не сливают мембраны даже в высокой концентрации: слияние обеспечивает комплекс, который собирают SNARE-белки двух мембран (Jahn et al., 2024).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Четыре SNARE-мотива — по одному типа Qa, Qb, Qc и R — собираются в пучок из четырёх параллельных α-спиралей; в центре пучка лежит слой из трёх остатков глутамина (Q) и одного аргинина (R), по которому и названы подсемейства (Jahn et al., 2024).","Сборка начинается с N-концевых участков SNARE-мотивов и самопроизвольно продвигается к C-концевым якорям в мембранах («застёгивание»); собранный между двумя мембранами комплекс стягивает их до слияния.","После слияния все спирали комплекса оказываются в одной мембране (cis-комплекс). Его разбирает АТФаза [[T20|NSF]] вместе с белками α-SNAP — растворимыми белками, связывающими NSF. После разборки SNARE-белки снова готовы к слиянию."],"paragraphs":["Что уточняет обзор. Слияние обеспечивает взаимодействие SNARE-белков носителя (v-SNARE) и мишени (t-SNARE) (БИО-3·11). Обзор объясняет, откуда берётся сила: комплекс очень стабилен, и энергия его сборки сближает мембраны и помогает преодолеть энергетический барьер слияния.","Пример — слияние синаптических пузырьков с плазматической мембраной нервного окончания: синтаксин-1 (Qa) и SNAP25 (два мотива, Qb и Qc) находятся в плазматической мембране, синаптобревин-2 (R) — в мембране пузырька (Jahn et al., 2024). У носителя с оболочкой COP-II, который сливается с цис-стороной комплекса Гольджи, распределение другое: на носителе — Qb-, Qc- и R-SNARE, на мембране-мишени — Qa-SNARE. Поэтому деление на R- и Q-SNARE (по остатку в центре комплекса) и на v- и t-SNARE (по мембране, на которой находится белок) — разные классификации. Для слияния пузырька достаточно, по разным оценкам, от одного до трёх комплексов.","Сборку регулируют дополнительные белки — белки семейства Sec1/Munc18 и тетеринг-факторы, которые удерживают SNARE в нужном положении. Как именно начинается сборка, пока не установлено.",{"h":"Метод"},"Большая часть сведений обзора получена в бесклеточных системах: очищенные SNARE-белки встраивают в искусственные липидные пузырьки (липосомы) и по флуоресценции измеряют смешивание липидов и содержимого двух мембран; силу сборки комплекса измеряют оптическим пинцетом на одиночных молекулах (Jahn et al., 2024). Контроль — пузырьки без SNARE-белков или с белками только одной мембраны. Типичный артефакт: при гемислиянии смешиваются липиды наружных монослоёв, а содержимое не смешивается, поэтому слияние подтверждают по смешиванию содержимого (ЗАКЛЮЧЕНИЕ). Чего данные не доказывают: что в клетке слияние идёт с тем же числом комплексов и с той же скоростью, что в бесклеточной системе.","ЗАКЛЮЧЕНИЕ: слияние связывает свободные SNARE-белки в собранные комплексы, а NSF разбирает их и возвращает SNARE в работу; без разборки комплексов цикл носителя остановился бы после первых слияний."],"trap":["Ошибка: SNARE-белок носителя сам сливает носитель с мембраной, если его достаточно много.","Одиночные SNARE-белки неактивны даже в высокой концентрации; нужен комплекс SNARE-мотивов двух мембран (Jahn et al., 2024)."],"conditions":"Jahn, Cafiso, Tamm, 2024 — обзор. Число комплексов, необходимых для слияния, оценивается по-разному. Схема упрощена: показано по одному мотиву каждого типа; распределение мотивов между мембранами — как при слиянии синаптического пузырька: Qb и Qc — два мотива одного белка SNAP25, который прикреплён к мембране не трансмембранным участком, а остатками жирной кислоты (пальмитоильными). Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Jahn2024"],"quiz":{"id":"S3-L12","question":"Почему одиночный SNARE-белок на носителе, даже в большом количестве, не сливает носитель с мембраной?","options":[{"id":"S3-L12-1","text":"Его сначала должна разобрать АТФаза NSF","correct":false,"feedback":"NSF разбирает уже собранные комплексы после слияния; одиночный SNARE разбирать не нужно."},{"id":"S3-L12-2","text":"Его сначала должна покрыть оболочка COP-II","correct":false,"feedback":"Оболочка участвует в образовании носителя и снимается до слияния; к работе SNARE она отношения не имеет."},{"id":"S3-L12-3","text":"Слияние обеспечивает только комплекс SNARE-мотивов двух мембран","correct":true,"feedback":"Одиночные SNARE неактивны; энергию для сближения мембран даёт сборка комплекса из четырёх мотивов (Qa, Qb, Qc, R) (Jahn et al., 2024)."}]},"widget":{"kind":"zipper","title":"","s":{"title":"Пройдите этапы работы SNARE-комплекса","status":"Схема по обзору Jahn et al., 2024 · не экспериментальные данные","modes_label":"Этап","modes":["SNARE порознь","сборка между мембранами","после слияния","разборка NSF"],"cyto":"цитоплазма","lumen":"просвет мишени","l_r":"R-SNARE носителя","l_q":"Q-SNARE мишени:|Qa — синтаксин,|Qb и Qc — SNAP25","l_zip":"застёгивание: от N- к C-концам","l_cis":"комплекс в одной мембране","l_nsf":"NSF и α-SNAP, АТФ","m":["SNARE","Мембраны"],"v":[["свободны","собираются в комплекс","в собранном комплексе","снова свободны"],["разделены","стянуты","слились","слились"]],"notes":["SNARE носителя и мишени ещё не связаны.","Мотивы собираются в четырёхспиральный пучок от N- к C-концам и стягивают мембраны.","Мембраны слились; все спирали комплекса оказались в одной мембране.","NSF вместе с α-SNAP, затрачивая АТФ, разбирает комплекс; SNARE снова свободны."],"static":["SNARE порознь → сборка комплекса и стягивание мембран → слияние, комплекс в одной мембране → разборка NSF."]}},"level":"adv"},{"id":"nsf-recycling","section":1,"questions":[2],"title":"Как обнаружили белок, без которого перенос между цистернами Гольджи останавливается","keywords":["NSF","N-этилмалеимид","бесклеточная система","комплекс Гольджи"],"lead":["Перенос белка между стопками комплекса Гольджи удалось воспроизвести вне клетки и найти белок, необходимый для этого переноса, — NSF.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Мембраны комплекса Гольджи обрабатывали N-этилмалеимидом (NEM) — веществом, которое модифицирует остатки цистеина; после этого перенос белка G вируса везикулярного стоматита почти прекращался (Block et al., 1988).","Добавление фракции цитозоля восстанавливало перенос; по восстановлению из цитозоля очистили белок NSF.","Очищенный NSF восстанавливал перенос и действовал каталитически: по оценке авторов, один комплекс NSF обеспечивал перенос не менее трёх носителей."],"paragraphs":["Что уточняет эта работа. В названии SNARE-белков уже упомянут этот белок: SNARE — рецепторы растворимых белков, связывающих NSF, N-этилмалеимид-чувствительный фактор. Эксперимент 1988 г. показал, что этот белок необходим для переноса между цистернами комплекса Гольджи и не расходуется; позже стало известно, что NSF разбирает SNARE-комплексы после слияния (вспомнить БИО-3·12).",{"h":"Метод"},"Бесклеточная система: донорные мембраны комплекса Гольджи из клеток CHO, заражённых вирусом везикулярного стоматита, акцепторные — из незаражённых клеток, цитозоль и АТФ. Перенос вирусного белка G из цис- в медиальный компартмент измеряли по присоединению [3H]GlcNAc к белку G. Мембраны обрабатывали 1 мМ N-этилмалеимида 15 мин при 0 °C, цитозоль готовили без активного NSF.","Контроль: необработанные мембраны с обычным цитозолем. Ограничение: N-этилмалеимид модифицирует многие белки, поэтому вывод о роли именно NSF опирается на восстановление переноса очищенным белком. Восстановление показывает, что добавления NSF достаточно, чтобы вернуть перенос в системе, где остальные компоненты сохранены; достаточен ли NSF для переноса сам по себе, из этого не следует.","Чего данные не доказывают. Эксперимент показывает, что NSF необходим для переноса, но не показывает, на каком этапе цикла он работает; роль NSF в разборке SNARE-комплексов установлена позже. Оценка каталитического действия заведомо занижена: при очистке большая часть активности теряется."],"trap":["Ошибка: NSF расходуется — на каждый носитель нужен свой.","Один комплекс NSF обслуживает несколько носителей: белок действует каталитически (Block et al., 1988)."],"conditions":"Block et al., 1988: бесклеточная система из мембран комплекса Гольджи клеток CHO (линия клеток яичника китайского хомячка); измеряемая величина — присоединение [3H]GlcNAc к белку G вируса везикулярного стоматита. Белок G — мембранный гликопротеин, поэтому на схеме он встроен в мембраны цистерн и носителей. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Block1988"],"quiz":{"id":"S3-L13","question":"К мембранам комплекса Гольджи, обработанным N-этилмалеимидом, добавили очищенный NSF. Что показал эксперимент?","options":[{"id":"S3-L13-1","text":"Перенос восстановился, и один комплекс NSF обслуживал несколько носителей","correct":true,"feedback":"Очищенный NSF вернул перенос белка G; по оценке авторов, один комплекс обеспечивал перенос не менее трёх носителей (Block et al., 1988)."},{"id":"S3-L13-2","text":"Перенос не восстановился: мембраны необратимо повреждены","correct":false,"feedback":"Перенос восстанавливался одним добавленным белком, значит, остальные компоненты мембран сохранили работоспособность."},{"id":"S3-L13-3","text":"Перенос восстановился, только если NSF было столько же, сколько носителей","correct":false,"feedback":"NSF действует каталитически: он не расходуется на каждый носитель."}]},"widget":{"kind":"nsf","title":"","s":{"title":"Повторите эксперимент с N-этилмалеимидом","status":"Данные Block et al., 1988 · бесклеточная система","modes_label":"Условия","modes":["контроль","N-этилмалеимид","N-этилмалеимид + очищенный NSF"],"donor":"донорная стопка","acc":"акцепторная стопка","notes_short":["перенос идёт, NSF разбирает комплексы","перенос почти не идёт","перенос восстановлен"],"m":["Перенос белка G","SNARE после слияния"],"v":[["контроль","почти не идёт","восстановлен"],["разбираются","остаются собранными (ЗАКЛЮЧЕНИЕ)","разбираются"]],"notes":["Мембраны и цитозоль без обработки: белок G переходит в акцепторную стопку.","После N-этилмалеимида и без активного NSF перенос почти прекращается; по обзору Jahn et al., 2024, собранные SNARE-комплексы при этом не разбираются (ЗАКЛЮЧЕНИЕ).","Очищенный NSF восстанавливает перенос; один комплекс NSF обслуживает несколько носителей."],"static":["Контроль — перенос идёт; N-этилмалеимид — перенос почти не идёт; N-этилмалеимид + очищенный NSF — перенос восстановлен."]}},"level":"adv"},{"id":"fusion-pore","section":1,"questions":[2],"title":"Как открывается и меняется пора слияния","keywords":["пора слияния","гемислияние","Ω-профиль","экзоцитоз","STED"],"lead":["Слияние проходит через промежуточные состояния. По одной из моделей сначала сливаются обращённые друг к другу монослои мембран ([[T22|гемислияние]]), затем открывается [[T21|пора]]; конкурирующая модель предполагала начальную пору, выстланную SNARE-белками. В живых клетках гемислияние заметной длительности наблюдали примерно в 30–40 % событий слияния; пора может расшириться или снова закрыться (Wu, Chan, 2024).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["По классической схеме при слиянии везикулы с плазматической мембраной открывается узкая пора (менее ~5 нм); она может быстро закрыться и ограничить выход содержимого («поцелуй и беги») или расшириться, и тогда везикула полностью встраивается в мембрану (Wu, Chan, 2024).","В живых хромаффинных клетках надпочечника примерно 30–40 % слияний проходят через гемислияние заметной длительности; около трети из них переходят в полное слияние за 0,1–26 с.","Поры видны непосредственно, если они крупнее ~60 нм: у везикул 180–720 нм поры бывают от ~0 до 490 нм и могут расширяться быстрее ~9 нм/мс. Слившаяся везикула сохраняет форму Ω-профиля, сжимается, увеличивается, а пора остаётся открытой или закрывается — всего семь вариантов."],"paragraphs":["Что уточняет эта работа. Обычно описывают два исхода слияния — полное слияние и «поцелуй и беги», при котором пора открывается кратковременно. В крупных секреторных везикулах хромаффинных клеток распластывание везикулы в плазматической мембране, считавшееся основным исходом, не наблюдали; вместо этого Ω-профиль сохранялся, сжимался или увеличивался (Wu, Chan, 2024).",{"h":"Метод"},"Микроскопия STED (разрешение ~60–80 нм, кадр каждые ~26–300 мс) в первичной культуре хромаффинных клеток надпочечника быка; секрецию запускали деполяризацией в течение 1 с. Цитоплазматический монослой плазматической мембраны метили флуоресцентным белком, связывающим фосфатидилинозитол-4,5-бисфосфат, а внеклеточную среду — малым флуоресцентным красителем: краситель проникает в везикулу, только когда пора открыта.","Контроль: гемислиянию соответствует Ω-профиль, на который переходит метка цитоплазматического монослоя плазматической мембраны, но в который не проникают малый краситель и ионы H+ и на который не переходит метка внеклеточного монослоя; открытая пора пропускает краситель. Ограничение: поры меньше ~60 нм не видны непосредственно, их открытие определяют по проникновению красителя.","Чего данные не доказывают. Наблюдения сделаны на крупных везикулах (~200–1500 нм) одного типа клеток; везикулы 30–100 нм, например синаптические, таким методом не видны, и перенос выводов на них не показан."],"trap":["Ошибка: слияние — одномоментное событие, после которого везикула всегда распластывается в мембране.","Слияние может идти через промежуточные состояния — гемислияние (в живых клетках его заметная длительность видна примерно в 30–40 % событий) и узкую пору, — а пора может закрыться; в крупных везикулах хромаффинных клеток полное распластывание не наблюдали (Wu, Chan, 2024)."],"conditions":"Wu, Chan, 2024 — аналитическая статья (рубрика Perspective), обобщающая наблюдения в живых хромаффинных клетках быка; числа — из неё. На схеме гемислияния слиты только обращённые к цитоплазме монослои, а просвет везикулы отделён от внеклеточной среды перегородкой из двух других монослоёв. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["WuChan2024"],"quiz":{"id":"S3-L14","question":"Во внеклеточную среду добавили малый флуоресцентный краситель. Метка цитоплазматического монослоя плазматической мембраны перешла на Ω-профиль слившейся везикулы, но ни краситель, ни ионы H+ в него не проникают, а метка внеклеточного монослоя на него не переходит. Как авторы интерпретируют это состояние?","options":[{"id":"S3-L14-1","text":"Широкая пора, через которую выходит содержимое","correct":false,"feedback":"Через открытую пору малый краситель проник бы в везикулу."},{"id":"S3-L14-2","text":"Гемислияние: слиты только обращённые друг к другу монослои, поры нет","correct":true,"feedback":"Метка перешла из цитоплазматического монослоя — значит, обращённые к цитоплазме монослои слились; непроницаемость для красителя и H+ и отсутствие метки внеклеточного монослоя показывают, что поры нет. Так гемислияние определяют Wu и Chan (2024)."},{"id":"S3-L14-3","text":"Везикула уже полностью распласталась в мембране","correct":false,"feedback":"Распластанной везикулы как отдельной структуры уже нет; здесь же видна слившаяся, но непроницаемая для красителя структура."}],"rev":2},"widget":{"kind":"pore","title":"","s":{"title":"Проследите, что происходит с порой слияния","status":"Схема по Wu, Chan, 2024 · хромаффинные клетки быка","modes_label":"Состояние","modes":["сближение","гемислияние","узкая пора","широкая пора","Ω-профиль сжимается","пора закрылась"],"out":"внеклеточная среда","cyto":"цитоплазма","m":["Пора","Содержимое везикулы"],"v":[["нет","нет: слиты только монослои со стороны цитоплазмы","узкая (< ~5 нм по проводимости)","до ~490 нм, Ω-профиль сохраняется","открыта, Ω-профиль уменьшается","закрыта"],["внутри","внутри: краситель и H+ не проникают","начинает выходить","выходит","вышло","вышло частично"]],"notes":["Везикула подошла к плазматической мембране; поры ещё нет.","Гемислияние: обращённые к цитоплазме монослои слились, и метка цитоплазматического монослоя плазматической мембраны переходит на Ω-профиль; просвет везикулы отделён от внеклеточной среды перегородкой, поэтому краситель и H+ в него не проникают.","Открылась узкая пора: содержимое начинает выходить.","Пора расширилась; везикула сохраняет форму Ω-профиля.","Ω-профиль сжимается, и мембрана везикулы переходит в плазматическую мембрану.","Пора закрылась: везикула отделилась, отдав часть содержимого («поцелуй и беги»)."],"static":["Сближение → гемислияние (не всегда) → узкая пора → широкая пора → сжатие Ω-профиля или закрытие поры."]}},"level":"adv"},{"id":"early-endosome","section":2,"questions":[3],"title":"Ранняя эндосома — сортировочный компартмент","keywords":["ранняя эндосома","сортировка","рециркуляция","кислая среда"],"lead":["После снятия оболочки эндоцитозные везикулы сливаются друг с другом и с уже образованными [[T19|ранними эндосомами]]. Обычно ранняя эндосома около 10 минут принимает новые везикулы, а затем начинает созревать в позднюю.","Основная функция ранних эндосом — сортировка и [[T23|рециркуляция]] белков, поступивших путём эндоцитоза. Это вопрос 9 коллоквиума."],"mechanism":["Эндоцитозные везикулы сливаются друг с другом или с уже существующими ранними эндосомами.","В ранней эндосоме лиганд часто отделяется от рецептора: этому способствует кислая среда.","В самом частом варианте рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а отделившийся лиганд остаётся в эндосоме, которая созревает в позднюю, и затем попадает в лизосомы; другие варианты зависят от конкретного рецептора и лиганда (следующий шаг).","Куда направится рецептор, зависит от сигналов сортировки и убиквитинирования."],"paragraphs":["Вспомнить БИО-3·10: клатриновая оболочка сбрасывается до слияния, и в раннюю эндосому поступает неокаймлённый носитель. Дальше ранняя эндосома работает как сортировочная станция: одни белки она возвращает на поверхность, другие направляет к поздним эндосомам и лизосомам.","ЗАКЛЮЧЕНИЕ: путь лиганда и рецептора определяется двумя событиями в ранней эндосоме — отделяется ли лиганд от рецептора (это зависит от того, как связь лиганда с рецептором меняется в кислой среде) и куда отсортирован рецептор. Эти два события и создают пути рецептора и лиганда (следующий шаг).",{"h":"Дальше в курсе «Молекулярная биология»"},"Как доставка, диффузия и эндоцитоз вместе поддерживают домен плазматической мембраны — [[https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes|МБ, семинар 2, шаг 25]]."],"trap":["Ошибка: ранняя эндосома образуется заново из каждой эндоцитозной везикулы.","Ранняя эндосома образуется при слиянии многих эндоцитозных везикул друг с другом, около 10 минут принимает новые везикулы, а затем созревает в позднюю."],"conditions":"Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L15","question":"Какая основная функция ранней эндосомы?","options":[{"id":"S3-L15-1","text":"Расщепление всех поступивших белков","correct":false,"feedback":"Расщепление идёт в лизосомах; ранняя эндосома многие белки, прежде всего рецепторы, возвращает на поверхность."},{"id":"S3-L15-2","text":"Образование покрытых клатрином везикул из плазматической мембраны","correct":false,"feedback":"Покрытые везикулы образуются на плазматической мембране; в раннюю эндосому они приходят уже без оболочки."},{"id":"S3-L15-3","text":"Сортировка и рециркуляция белков, поступивших путём эндоцитоза","correct":true,"feedback":"Из ранней эндосомы рецепторы возвращаются на поверхность, а лиганды уходят к поздним эндосомам."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Сравните, что уходит из ранней эндосомы","status":"Схема качественная · не экспериментальные данные","modes_label":"В ранней эндосоме","modes":["лиганд отделяется от рецептора","лиганд остаётся связанным"],"cfg":[[true,true,"ee"],[false,true,"ee"]],"m":["На поверхность","В поздние эндосомы"],"v":[["рецепторы","рецепторы с лигандом"],["лиганды","—"]],"notes":["Лиганд отделился: рецепторы возвращаются на поверхность в везикулах, лиганды остаются в созревающей эндосоме и попадают в лизосомы.","Лиганд остался на рецепторе: комплекс возвращается на поверхность и распадается там."],"static":["Ранняя эндосома: рецепторы возвращаются на поверхность, отделившиеся лиганды уходят к поздним эндосомам; связанные лиганды возвращаются с рецептором."]}}},{"id":"four-routes","section":2,"questions":[3],"title":"Какими путями расходятся рецептор и лиганд","keywords":["рециркуляция","деградация","EGF","трансцитоз","IgA"],"lead":["Лиганд-рецепторный комплекс после эндоцитоза проходит одним из четырёх путей.","Различаются они тем, отделяется ли лиганд от рецептора в ранней эндосоме и куда направлен рецептор."],"mechanism":["Рециркуляция рецептора и деградация лиганда — самый частый путь: комплекс в ранней эндосоме диссоциирует, рецептор возвращается на поверхность, лиганд остаётся в эндосоме, которая созревает в позднюю, и расщепляется в лизосоме.","Рециркуляция рецептора и лиганда: некоторые лиганды, зачастую белки-переносчики, не отделяются от рецептора в ранних эндосомах; комплекс возвращается и распадается на поверхности.","Деградация рецептора и лиганда: комплекс, например фактор роста EGF с его рецептором, не диссоциирует; [[T26|убиквитинированный]] рецептор вместе с лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца и разрушается в лизосоме.","[[T27|Трансцитоз]]: комплекс димерного IgA с полимерным иммуноглобулиновым рецептором переносится от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом."],"paragraphs":["Первые три пути показаны на схеме и в практикуме вопроса 3; трансцитоз требует клетки с двумя разными поверхностями — эпителиальной — и на схеме не показан.","Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко: клетка переносит IgA через себя, не расщепляя его. Клинический пример иллюстрирует механизм и не является рекомендацией.","ЗАКЛЮЧЕНИЕ: первые три пути различаются двумя событиями в ранней эндосоме (вспомнить БИО-3·15): отделяется ли лиганд от рецептора и куда отсортирован рецептор — на поверхность или в лизосому. Трансцитоз добавляет третье направление — к противоположной поверхности клетки."],"trap":["Ошибка: при деградации рецептора и лиганда они сначала разделяются в ранней эндосоме и расщепляются порознь.","Комплекс (например, EGF с рецептором) не диссоциирует: рецептор вместе с лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца и расщепляется в лизосоме."],"conditions":"Схема качественная, трансцитоз на ней не показан.","sources":["Alberts2022"],"quiz":{"id":"S3-L16","question":"Белок-переносчик остаётся связанным с рецептором в ранней эндосоме, и этот рецептор направляется обратно на ту же поверхность клетки. Куда попадёт белок-переносчик?","options":[{"id":"S3-L16-1","text":"Вернётся на поверхность вместе с рецептором","correct":true,"feedback":"Связанный лиганд следует за рецептором: это путь «рециркуляция рецептора и лиганда». Отделится ли белок-переносчик на поверхности, зависит от свойств комплекса; например, апотрансферрин при нейтральном pH отделяется (БИО-3·19)."},{"id":"S3-L16-2","text":"Расщепится в лизосоме, а рецептор вернётся","correct":false,"feedback":"Так проходит лиганд, который отделяется от рецептора в ранней эндосоме."},{"id":"S3-L16-3","text":"Перенесётся через клетку на противоположную поверхность","correct":false,"feedback":"Трансцитоз — перенос к противоположной поверхности эпителиальной клетки; в условии рецептор возвращается на ту же поверхность."}],"rev":2},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Выберите путь и проследите рецептор и лиганд","status":"Схема качественная · не экспериментальные данные","modes_label":"Путь","modes":["рециркуляция рецептора, деградация лиганда","рециркуляция рецептора и лиганда","деградация рецептора и лиганда"],"cfg":[[true,true,""],[false,true,""],[false,false,"le"]],"m":["Лиганд","Рецептор","Пример"],"v":[["расщепляется в лизосоме","возвращается на поверхность","расщепляется с рецептором"],["возвращается","возвращается","расщепляется"],["самый частый путь","белки-переносчики","EGF и его рецептор"]],"notes":["Лиганд отделился в ранней эндосоме и расщепляется в лизосоме; рецептор вернулся на поверхность.","Лиганд не отделился: комплекс вернулся на поверхность и распадается там.","Убиквитинированный рецептор с лигандом включён во внутрипросветные везикулы и разрушается в лизосоме; рецепторов на поверхности меньше."],"static":["Три пути на схеме: рециркуляция рецептора и деградация лиганда; рециркуляция обоих; деградация обоих. Четвёртый путь — трансцитоз — описан в тексте."]}}},{"id":"recycling-gain","section":2,"questions":[3],"title":"Зачем рецептору возвращаться на поверхность","keywords":["рециркуляция","захват","рецептор","десенситизация"],"lead":["Рециркуляция рецептора позволяет клетке постоянно и избирательно захватывать нужное вещество: одна молекула рецептора работает много раз (ЗАКЛЮЧЕНИЕ).","Если рецептор расщепляется вместе с лигандом или, как при трансцитозе, расщепляется на противоположной поверхности клетки, каждая молекула работает один раз (ЗАКЛЮЧЕНИЕ)."],"mechanism":["Рецептор связывает лиганд на поверхности и уходит с ним в клетку в покрытой клатрином везикуле.","В ранней эндосоме лиганд отделяется, и рецептор возвращается на поверхность.","На поверхности рецептор снова связывает лиганд — цикл повторяется.","При пути «деградация рецептора и лиганда» рецептор расщепляется в лизосоме и на поверхность не возвращается."],"paragraphs":["Полимерный иммуноглобулиновый рецептор переносит димерный IgA от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом. ЗАКЛЮЧЕНИЕ: такая молекула рецептора переносит IgA один раз, и для каждого переноса клетка использует новую молекулу рецептора.","Сверх программы: сколько раз рецептор проходит цикл, измерено для рецептора ЛПНП (БИО-3·20).",{"h":"Дальше в курсе «Молекулярная биология»"},"Как ответ клетки ослабевает при длительной стимуляции, в том числе за счёт захвата рецепторов внутрь клетки — [[https://fresll.github.io/molbio/seminar-3-route.html#desensitization|МБ, семинар 3, шаг 6]]."],"trap":["Ошибка: рецептор расходуется на каждую захваченную молекулу лиганда.","При самом частом пути рецептор возвращается на поверхность и захватывает лиганд снова и снова."],"conditions":"Модель не учитывает синтез новых рецепторов. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L17","question":"Сколько молекул IgA может перенести через эпителиальную клетку одна молекула полимерного иммуноглобулинового рецептора?","options":[{"id":"S3-L17-1","text":"Много: после выделения IgA рецептор вернётся на базолатеральную поверхность","correct":false,"feedback":"Возвращаться нечему: внеклеточная часть рецептора отщепляется и выделяется вместе с IgA."},{"id":"S3-L17-2","text":"Одну: на апикальной мембране рецептор расщепляется, и его часть уходит в секрет вместе с IgA","correct":true,"feedback":"IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом; ЗАКЛЮЧЕНИЕ."},{"id":"S3-L17-3","text":"Ни одной: комплекс расщепится в лизосоме","correct":false,"feedback":"Комплекс IgA с рецептором переносится через эндосомы к апикальной мембране, а не в лизосому."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Сравните рецептор, который возвращается, и рецептор, который расщепляется","status":"Схема качественная · не экспериментальные данные","modes_label":"Рецептор","modes":["возвращается на поверхность","расщепляется в лизосоме"],"cfg":[[true,true,""],[false,false,"ly"]],"m":["Сколько раз работает рецептор","Где оказывается рецептор"],"v":[["много раз","один раз"],["снова на поверхности","в лизосоме"]],"notes":["Рецептор возвращается и снова связывает лиганд.","Рецептор расщепляется вместе с лигандом и проходит цикл один раз (ЗАКЛЮЧЕНИЕ)."],"static":["Возвращающийся рецептор работает много раз; расщепляющийся вместе с лигандом — один раз."]}}},{"id":"late-endosome","section":2,"questions":[3],"title":"Как ранняя эндосома становится поздней и что попадает в лизосому","keywords":["поздняя эндосома","мультивезикулярное тельце","лизосома","Rab5","Rab7"],"lead":["По мере созревания ранних эндосом их внутренняя среда становится более кислой, а сами эндосомы уходят глубже в цитоплазму и становятся [[T24|поздними]].","Мембрана созревающей эндосомы впячивается в её просвет и образует внутрипросветные везикулы — так возникает [[T25|мультивезикулярное тельце]]. Поздняя эндосома сливается с лизосомой, и содержимое расщепляется."],"mechanism":["Ранняя эндосома закисляется и перемещается глубже в цитоплазму.","Эндосома меняет Rab-белки, липиды, кислотность и положение в клетке; метка ранней эндосомы — Rab5, поздней — Rab7.","Мембрана поздней эндосомы впячивается в её просвет — образуются внутрипросветные везикулы мультивезикулярного тельца.","Мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется; некоторые сливаются с плазматической мембраной, и их внутрипросветные везикулы выходят наружу как экзосомы."],"paragraphs":["Лизосомы содержат гидролитические ферменты — протеазы, нуклеазы, гликозидазы, липазы и фосфолипазы — и расщепляют макромолекулы, поступившие путём эндоцитоза. Поэтому белок, который не вернулся из ранней эндосомы, обычно оказывается в лизосоме и расщепляется.","Убиквитинированные рецепторы включаются в мембрану внутрипросветных везикул и вместе с ними попадают в просвет лизосомы. ЗАКЛЮЧЕНИЕ: включение в мембрану внутрипросветных везикул отделяет мембранный белок от ограничивающей мембраны эндосомы, с которой он мог бы вернуться на поверхность.","Сверх программы: как именно ранняя эндосома становится поздней — смена Rab5 на Rab7, — показано в живых клетках (БИО-3·21).",{"h":"Дальше в курсе «Молекулярная биология»"},"Как меняется метка мембраны при созревании эндосомы — [[https://fresll.github.io/molbio/seminar-1-route.html#conversion|МБ, семинар 1, шаг 16]]; почему для закисления лизосомы нужен насос — [[https://fresll.github.io/molbio/seminar-1-route.html#pumps-channels|МБ, семинар 1, шаг 3]]."],"trap":["Ошибка: поздняя эндосома отпочковывается от ранней как отдельный пузырёк.","Ранняя эндосома сама созревает в позднюю: закисляется и уходит глубже в цитоплазму."],"conditions":"Значения pH в шаге не используются. Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L18","question":"Что происходит с ранней эндосомой по мере созревания?","options":[{"id":"S3-L18-1","text":"Она сливается с плазматической мембраной и исчезает","correct":false,"feedback":"С плазматической мембраной могут сливаться мультивезикулярные тельца, но созревание ранней эндосомы ведёт к поздней эндосоме."},{"id":"S3-L18-2","text":"Её среда становится нейтральной, и рецепторы отделяются от лигандов","correct":false,"feedback":"Наоборот: при созревании среда эндосомы становится кислее."},{"id":"S3-L18-3","text":"Её среда становится кислее, и она уходит глубже в цитоплазму, становясь поздней","correct":true,"feedback":"Так идёт созревание эндосомы; при этом метка Rab5 на её мембране сменяется Rab7."}]},"widget":{"kind":"sort","title":"","s":{"out":"внеклеточная среда","l_ee":"ранняя эндосома","l_le":"поздняя эндосома","l_ly":"лизосома","title":"Пройдите от ранней эндосомы к лизосоме","status":"Схема качественная · не экспериментальные данные","modes_label":"Компартмент","modes":["ранняя эндосома","поздняя эндосома","лизосома"],"cfg":[[true,true,"ee"],[true,true,"le"],[true,true,"ly"]],"m":["Положение","Что происходит","Метка"],"v":[["ближе к поверхности","глубже в цитоплазме","глубже в цитоплазме"],["сортировка и возврат рецепторов","впячивание мембраны, внутрипросветные везикулы","расщепление гидролазами"],["Rab5","Rab7","—"]],"notes":["Ранняя эндосома сортирует: рецепторы уходят на поверхность, лиганды — дальше.","Поздняя эндосома кислее и глубже; её мембрана впячивается внутрь — это мультивезикулярное тельце.","В лизосоме гидролазы расщепляют поступившие макромолекулы."],"static":["Ранняя эндосома → поздняя эндосома (мультивезикулярное тельце) → лизосома: среда кислее, положение глубже, содержимое расщепляется."]}}},{"id":"acid-release","section":2,"questions":[3],"title":"Почему трансферрин возвращается на поверхность без железа","keywords":["трансферрин","апотрансферрин","pH","железо","HepG2"],"lead":["[[T28|Трансферрин]] — пример белка-переносчика, который не отделяется от рецептора в ранней эндосоме. Эксперимент с изменением pH показал, что кислая среда отделяет от него не рецептор, а железо.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Трансферрин с железом связывается с рецептором на поверхности при нейтральном pH, и комплекс уходит в клетку (Dautry-Varsat et al., 1983).","В кислой среде эндосомы (pH 5,5 и ниже) железо отделяется от трансферрина; трансферрин без железа — апотрансферрин — остаётся на рецепторе: при pH 5,4 он связывается так же прочно, как трансферрин с железом при pH 7,0.","Комплекс апотрансферрина с рецептором возвращается на поверхность; при нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C, а трансферрин с железом — 7,5 мин (примерно в 28 раз медленнее; по сводной оценке авторов для двух температур — в 30–40 раз). Железо остаётся в клетке."],"paragraphs":["Что уточняет эта работа. Путь «рециркуляция рецептора и лиганда» описывают для белков-переносчиков (БИО-3·16); эксперимент показывает, как такой путь возникает: связь лиганда с рецептором зависит от pH по-разному для формы с железом и без него. Для сравнения, асиалоорозомукоид и инсулин при кислом pH от своих рецепторов отделялись.",{"h":"Метод"},"Клетки гепатомы человека HepG2. Меченый трансферрин (125I — белок, 59Fe — железо) связывали с рецепторами при 4 °C, когда интернализации нет, затем меняли pH среды и измеряли, что остаётся на клетках. Чтобы при 37 °C трансферрин не уходил в клетку, добавляли ингибиторы энергетического обмена (цианид и 2-дезоксиглюкозу); освободившееся железо связывал хелатор десферриоксамин.","Контроль: трансферрин с железом при нейтральном pH; другие лиганды (асиалоорозомукоид, инсулин) в тех же условиях. Ограничение: эксперименты на поверхности клеток моделируют среду эндосомы, но не воспроизводят саму эндосому.","Чего данные не доказывают. Работа объясняет, почему трансферрин и рецептор возвращаются вместе, но не показывает, по какому пути комплекс выходит из эндосомы и где именно освобождается железо внутри клетки."],"trap":["Ошибка: в кислой эндосоме трансферрин отделяется от рецептора, как большинство лигандов.","Связь с рецептором сохраняется: в кислой среде от трансферрина отделяется железо, а апотрансферрин остаётся на рецепторе. Трансферрин, связанный при нейтральном pH, не отделялся при обработке растворами с pH от 4,5 до 7,5 (4 °C, с хелатором железа; сходный результат — при 37 °C) (Dautry-Varsat et al., 1983)."],"conditions":"Dautry-Varsat et al., 1983: клетки HepG2; полупериоды при 37 °C — 16 с (апотрансферрин) и 7,5 мин (трансферрин с железом) при нейтральном pH; освобождение железа при pH 5 — около 1,5 мин. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["DautryVarsat1983"],"quiz":{"id":"S3-L19","question":"Апотрансферрин связан с рецептором в эндосоме при pH 5,4. Комплекс вернулся на поверхность клетки с нейтральным pH. Что произойдёт?","options":[{"id":"S3-L19-1","text":"Апотрансферрин быстро отделится, рецептор освободится","correct":true,"feedback":"При нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C (Dautry-Varsat et al., 1983)."},{"id":"S3-L19-2","text":"Апотрансферрин останется на рецепторе до следующего эндоцитоза","correct":false,"feedback":"При нейтральном pH апотрансферрин удерживается на рецепторе слабо и отделяется за секунды."},{"id":"S3-L19-3","text":"Апотрансферрин свяжет железо прямо на рецепторе и уйдёт в клетку снова","correct":false,"feedback":"Железо апотрансферрин связывает в среде, уже отделившись; на рецептор возвращается трансферрин с железом."}]},"widget":{"kind":"tf","title":"","s":{"title":"Пройдите цикл трансферрина","status":"Данные Dautry-Varsat et al., 1983 · клетки HepG2","modes_label":"Этап","modes":["на поверхности: pH 7","в эндосоме: pH 5","апотрансферрин: pH 5","снова на поверхности: pH 7"],"cfg":[["holo",false],["holo",true],["apo",true],["apo",false]],"ph":["нейтральный pH, как снаружи клетки","кислый pH, как в эндосоме","кислый pH, как в эндосоме","нейтральный pH, как снаружи клетки"],"out":"внеклеточная среда","cyto":"цитоплазма","l_bound":"трансферрин связан с рецептором","l_free":"апотрансферрин отделяется от рецептора","m":["Трансферрин и рецептор","Железо"],"v":[["связаны","связаны","связаны","отделяются за секунды"],["на трансферрине","отделяется","в клетке","в клетке"]],"notes":["Трансферрин с железом связан с рецептором.","В кислой среде железо отделяется, трансферрин остаётся на рецепторе.","Апотрансферрин связан с рецептором так же прочно, как трансферрин с железом при pH 7.","При нейтральном pH апотрансферрин отделяется с полупериодом 16 с."],"static":["Трансферрин с железом на рецепторе → в кислой эндосоме железо отделяется → апотрансферрин с рецептором возвращается → на поверхности апотрансферрин отделяется."]}},"level":"adv"},{"id":"ldl-cycle","section":2,"questions":[3],"title":"Сколько раз рецептор ЛПНП проходит цикл и что нужно ему для захвата","keywords":["рецептор ЛПНП","холестерин","покрытая клатрином ямка","цикл рецептора"],"lead":["Рецептор липопротеинов низкой плотности (ЛПНП) — классический пример пути «рециркуляция рецептора, деградация лиганда»: ЛПНП расщепляется в лизосоме, а рецептор возвращается на поверхность (Brown, Goldstein, 1986).","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Рецепторы ЛПНП собираются в покрытых клатрином ямках; ямки впячиваются за 3–5 мин после образования, клатриновая оболочка быстро снимается (Brown, Goldstein, 1986).","Эндосомы закисляются ниже pH 6,5 протонными насосами, и ЛПНП отделяется от рецептора; рецептор возвращается на поверхность.","ЛПНП попадает в лизосому: белок расщепляется до аминокислот, эфиры холестерина — кислой липазой; в клетке освобождается холестерин.","Каждый рецептор совершает один полный цикл примерно за 10 мин — независимо от того, связан ли он с ЛПНП."],"paragraphs":["Время жизни рецептора — около 20 ч; авторы пишут о нескольких сотнях циклов за это время. ЗАКЛЮЧЕНИЕ: из приведённых чисел следует порядка сотни циклов (20 ч по 10 мин — около 120); в любом случае одна молекула рецептора захватывает ЛПНП многократно.","Мутации цитоплазматического участка рецептора (впервые описаны у пациента, обозначенного в работах как J.D.) не мешают связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь клетки. Значит, для сбора в ямке нужен цитоплазматический участок рецептора; именно цитозольные участки рецепторов связывают адаптерные белки (ЗАКЛЮЧЕНИЕ; вспомнить БИО-3·2).",{"h":"Метод"},"Культура фибробластов кожи человека, в том числе от пациентов с семейной гиперхолестеринемией. ЛПНП метили 125I и различали ЛПНП, связанный с поверхностью, ушедший в клетку и расщеплённый (по выходу 125I-монойодтирозина в среду). Контроль — фибробласты здоровых людей. Ограничение: числа цикла получены в культуре клеток. Клинический пример иллюстрирует механизм и не является рекомендацией.","Чего данные не доказывают. Обзор обобщает работы многих лет; механизм возврата рецептора из эндосомы в нём описан как модель, без молекул, которые этот возврат обеспечивают."],"trap":["Ошибка: рецептор ЛПНП уходит в клетку только после связывания ЛПНП.","Рецептор проходит цикл каждые 10 мин независимо от того, связан ли он с ЛПНП (Brown, Goldstein, 1986)."],"conditions":"Brown, Goldstein, 1986 — обзор собственных работ авторов (Science, 1986). Числа — из неё; расчёт числа циклов — ЗАКЛЮЧЕНИЕ. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Brown1986"],"quiz":{"id":"S3-L20","question":"У рецептора ЛПНП изменён цитоплазматический участок; ЛПНП он связывает нормально. Что произойдёт с захватом ЛПНП?","options":[{"id":"S3-L20-1","text":"Рецептор перестанет связывать ЛПНП","correct":false,"feedback":"ЛПНП связывается наружным участком рецептора; изменён цитоплазматический."},{"id":"S3-L20-2","text":"Рецептор не соберётся в ямках, и ЛПНП останется на поверхности","correct":true,"feedback":"Мутации цитоплазматического участка не мешают связыванию, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь (Brown, Goldstein, 1986)."},{"id":"S3-L20-3","text":"Захват не изменится: ямки соберутся вокруг ЛПНП","correct":false,"feedback":"Ямка собирается через адаптеры, связывающие цитоплазматический участок рецептора; ЛПНП снаружи сбор в ямке не обеспечивает."}]},"widget":{"kind":"ldl","title":"","s":{"title":"Сравните нормальный и мутантный рецептор ЛПНП","status":"По Brown, Goldstein, 1986 · фибробласты человека","modes_label":"Рецептор","modes":["норма","изменён цитоплазматический участок"],"out":"внеклеточная среда","cy
