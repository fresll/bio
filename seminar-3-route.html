Почему трансферрин возвращается на поверхность без железа</h2><p class="lead"><a href="#ns-g-S3-T28">Трансферрин</a> — пример белка-переносчика, который не отделяется от рецептора в ранней эндосоме. Эксперимент с изменением pH показал, что кислая среда отделяет от него не рецептор, а железо. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Трансферрин с железом на рецепторе → в кислой эндосоме железо отделяется → апотрансферрин с рецептором возвращается → на поверхности апотрансферрин отделяется.</div><ol class="mech"><li>Трансферрин с железом связывается с рецептором на поверхности при нейтральном pH, и комплекс уходит в клетку (Dautry-Varsat et al., 1983).</li><li>В кислой среде эндосомы (pH 5,5 и ниже) железо отделяется от трансферрина; трансферрин без железа — апотрансферрин — остаётся на рецепторе: при pH 5,4 он связывается так же прочно, как трансферрин с железом при pH 7,0.</li><li>Комплекс апотрансферрина с рецептором возвращается на поверхность; при нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C, а трансферрин с железом — 7,5 мин (примерно в 28 раз медленнее; по сводной оценке авторов для двух температур — в 30–40 раз). Железо остаётся в клетке.</li></ol><p>Что уточняет эта работа. Путь «рециркуляция рецептора и лиганда» описывают для белков-переносчиков (БИО-3·16); эксперимент показывает, как такой путь возникает: связь лиганда с рецептором зависит от pH по-разному для формы с железом и без него. Для сравнения, асиалоорозомукоид и инсулин при кислом pH от своих рецепторов отделялись.</p><h3>Метод</h3><p>Клетки гепатомы человека HepG2. Меченый трансферрин (125I — белок, 59Fe — железо) связывали с рецепторами при 4 °C, когда интернализации нет, затем меняли pH среды и измеряли, что остаётся на клетках. Чтобы при 37 °C трансферрин не уходил в клетку, добавляли ингибиторы энергетического обмена (цианид и 2-дезоксиглюкозу); освободившееся железо связывал хелатор десферриоксамин.</p><p>Контроль: трансферрин с железом при нейтральном pH; другие лиганды (асиалоорозомукоид, инсулин) в тех же условиях. Ограничение: эксперименты на поверхности клеток моделируют среду эндосомы, но не воспроизводят саму эндосому.</p><p>Чего данные не доказывают. Работа объясняет, почему трансферрин и рецептор возвращаются вместе, но не показывает, по какому пути комплекс выходит из эндосомы и где именно освобождается железо внутри клетки.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: в кислой эндосоме трансферрин отделяется от рецептора, как большинство лигандов.<p class="trap-fix">Связь с рецептором сохраняется: в кислой среде от трансферрина отделяется железо, а апотрансферрин остаётся на рецепторе. Трансферрин, связанный при нейтральном pH, не отделялся при обработке растворами с pH от 4,5 до 7,5 (4 °C, с хелатором железа; сходный результат — при 37 °C) (Dautry-Varsat et al., 1983).</p></div><div class="static-quiz"><h3>Апотрансферрин связан с рецептором в эндосоме при pH 5,4. Комплекс вернулся на поверхность клетки с нейтральным pH. Что произойдёт?</h3><ol><li><b>А.</b> Апотрансферрин быстро отделится, рецептор освободится <i>(верный вариант)</i><br><span class="expl">При нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C (Dautry-Varsat et al., 1983).</span></li><li><b>Б.</b> Апотрансферрин останется на рецепторе до следующего эндоцитоза <i>(неверный вариант)</i><br><span class="expl">При нейтральном pH апотрансферрин удерживается на рецепторе слабо и отделяется за секунды.</span></li><li><b>В.</b> Апотрансферрин свяжет железо прямо на рецепторе и уйдёт в клетку снова <i>(неверный вариант)</i><br><span class="expl">Железо апотрансферрин связывает в среде, уже отделившись; на рецептор возвращается трансферрин с железом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.80.8.2258">Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262</a></li></ul><p>Dautry-Varsat et al., 1983: клетки HepG2; полупериоды при 37 °C — 16 с (апотрансферрин) и 7,5 мин (трансферрин с железом) при нейтральном pH; освобождение железа при pH 5 — около 1,5 мин. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-ldl-cycle"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 20 из 31</div><h2>Сколько раз рецептор ЛПНП проходит цикл и что нужно ему для захвата</h2><p class="lead">Рецептор липопротеинов низкой плотности (ЛПНП) — классический пример пути «рециркуляция рецептора, деградация лиганда»: ЛПНП расщепляется в лизосоме, а рецептор возвращается на поверхность (Brown, Goldstein, 1986). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Норма: рецепторы с ЛПНП в покрытой клатрином ямке. Мутант по цитоплазматическому участку: ЛПНП связан, но рецепторы вне ямки.</div><ol class="mech"><li>Рецепторы ЛПНП собираются в покрытых клатрином ямках; ямки впячиваются за 3–5 мин после образования, клатриновая оболочка быстро снимается (Brown, Goldstein, 1986).</li><li>Эндосомы закисляются ниже pH 6,5 протонными насосами, и ЛПНП отделяется от рецептора; рецептор возвращается на поверхность.</li><li>ЛПНП попадает в лизосому: белок расщепляется до аминокислот, эфиры холестерина — кислой липазой; в клетке освобождается холестерин.</li><li>Каждый рецептор совершает один полный цикл примерно за 10 мин — независимо от того, связан ли он с ЛПНП.</li></ol><p>Время жизни рецептора — около 20 ч; авторы пишут о нескольких сотнях циклов за это время. ЗАКЛЮЧЕНИЕ: из приведённых чисел следует порядка сотни циклов (20 ч по 10 мин — около 120); в любом случае одна молекула рецептора захватывает ЛПНП многократно.</p><p>Мутации цитоплазматического участка рецептора (впервые описаны у пациента, обозначенного в работах как J.D.) не мешают связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь клетки. Значит, для сбора в ямке нужен цитоплазматический участок рецептора; именно цитозольные участки рецепторов связывают адаптерные белки (ЗАКЛЮЧЕНИЕ; вспомнить БИО-3·2).</p><h3>Метод</h3><p>Культура фибробластов кожи человека, в том числе от пациентов с семейной гиперхолестеринемией. ЛПНП метили 125I и различали ЛПНП, связанный с поверхностью, ушедший в клетку и расщеплённый (по выходу 125I-монойодтирозина в среду). Контроль — фибробласты здоровых людей. Ограничение: числа цикла получены в культуре клеток. Клинический пример иллюстрирует механизм и не является рекомендацией.</p><p>Чего данные не доказывают. Обзор обобщает работы многих лет; механизм возврата рецептора из эндосомы в нём описан как модель, без молекул, которые этот возврат обеспечивают.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: рецептор ЛПНП уходит в клетку только после связывания ЛПНП.<p class="trap-fix">Рецептор проходит цикл каждые 10 мин независимо от того, связан ли он с ЛПНП (Brown, Goldstein, 1986).</p></div><div class="static-quiz"><h3>У рецептора ЛПНП изменён цитоплазматический участок; ЛПНП он связывает нормально. Что произойдёт с захватом ЛПНП?</h3><ol><li><b>А.</b> Рецептор перестанет связывать ЛПНП <i>(неверный вариант)</i><br><span class="expl">ЛПНП связывается наружным участком рецептора; изменён цитоплазматический.</span></li><li><b>Б.</b> Рецептор не соберётся в ямках, и ЛПНП останется на поверхности <i>(верный вариант)</i><br><span class="expl">Мутации цитоплазматического участка не мешают связыванию, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь (Brown, Goldstein, 1986).</span></li><li><b>В.</b> Захват не изменится: ямки соберутся вокруг ЛПНП <i>(неверный вариант)</i><br><span class="expl">Ямка собирается через адаптеры, связывающие цитоплазматический участок рецептора; ЛПНП снаружи сбор в ямке не обеспечивает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.3513311">Brown M. S., Goldstein J. L. A receptor-mediated pathway for cholesterol homeostasis. Science. 1986;232:34–47</a></li></ul><p>Brown, Goldstein, 1986 — обзор собственных работ авторов (Science, 1986). Числа — из неё; расчёт числа циклов — ЗАКЛЮЧЕНИЕ. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-rab-conversion"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 21 из 31</div><h2>Как ранняя эндосома становится поздней: смена Rab5 на Rab7</h2><p class="lead">Ранняя эндосома не отпочковывает позднюю: на её мембране метка <a href="#ns-g-S3-T29">Rab5</a> быстро сменяется меткой Rab7, и эндосома становится поздней (Rink et al., 2005). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Rab5 (ранняя эндосома, периферия) → смена Rab5 на Rab7 → Rab7 (поздняя эндосома, центр); без hVps39 смена растягивается до часов.</div><ol class="mech"><li>Ранние эндосомы с Rab5 сливаются друг с другом до двух раз в минуту; груз, предназначенный для расщепления (ЛПНП), собирается во всё меньшем числе всё более крупных эндосом (Rink et al., 2005).</li><li>Крупные эндосомы перемещаются от периферии к центру клетки, и там Rab5 на их мембране быстро сменяется Rab7.</li><li>Для смены нужен комплекс HOPS (англ. homotypic fusion and protein sorting; белки класса C VPS — англ. vacuolar protein sorting), который связывается с Rab5; авторы, опираясь на данные того времени, считали HOPS фактором обмена нуклеотидов для Rab7. При подавлении его субъединицы hVps39 увеличиваются и ранние, и поздние эндосомы, а смена Rab5 на Rab7 растягивается с минут до часов.</li></ol><p>Что уточняет эта работа. Ранняя эндосома созревает в позднюю, и метка Rab5 сменяется Rab7 (БИО-3·18). Эксперимент показывает, что созревание идёт сменой метки на той же мембране, а не переносом груза в новый компартмент.</p><p>ЛПНП в контроле покидал ранние эндосомы с полупериодом около 11 мин; при подавлении hVps39 он оставался в ранних эндосомах, несущих белок EEA1 (англ. early endosome antigen 1), до 4 ч.</p><h3>Метод</h3><p>Живые клетки A431 (линия клеток эпидермоидной карциномы человека) с флуоресцентными Rab5 и Rab7; снимки каждые несколько секунд и алгоритмы, которые прослеживают отдельные эндосомы. Груз — флуоресцентный ЛПНП. Подавление hVps39 — малыми интерферирующими РНК в тех же клетках; белки, связывающие Rab5, в том числе HOPS, выделяли из цитозоля клеток HeLa на колонке с Rab5.</p><p>Контроль: клетки с контрольной РНК. Ограничение: избыточный синтез меченых Rab может менять их количество на мембране. Чего данные не доказывают: смена Rab показана для грузов, идущих на расщепление; для рецепторов, возвращающихся на поверхность, механизм выхода иной.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: поздняя эндосома образуется отпочкованием от ранней.<p class="trap-fix">В живых клетках Rab5 на мембране эндосомы сменяется Rab7: та же эндосома становится поздней (Rink et al., 2005).</p></div><div class="static-quiz"><h3>В клетках подавили hVps39 — субъединицу комплекса HOPS, нужного для смены Rab5 на Rab7. Что произойдёт с ЛПНП после эндоцитоза?</h3><ol><li><b>А.</b> ЛПНП сразу попадёт в лизосомы, минуя ранние эндосомы <i>(неверный вариант)</i><br><span class="expl">Без HOPS ранние эндосомы не превращаются в поздние, поэтому груз, наоборот, задерживается в ранних.</span></li><li><b>Б.</b> ЛПНП вернётся на поверхность вместе с рецептором <i>(неверный вариант)</i><br><span class="expl">ЛПНП отделяется от рецептора и задерживается в ранних эндосомах; на поверхность возвращается рецептор.</span></li><li><b>В.</b> ЛПНП надолго задержится в ранних эндосомах <i>(верный вариант)</i><br><span class="expl">Смена растягивается с минут до часов, и ЛПНП остаётся в EEA1-положительных эндосомах до 4 ч (Rink et al., 2005).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2005.06.043">Rink J., Ghigo E., Kalaidzidis Y., Zerial M. Rab conversion as a mechanism of progression from early to late endosomes. Cell. 2005;122:735–749</a></li></ul><p>Rink et al., 2005: съёмка живых клеток A431; цитозоль для колонки с Rab5 — из клеток HeLa; полупериод выхода ЛПНП — 10,9 мин в контроле. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-retrieval-signal"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 22 из 31</div><h2>Как мембранный белок избегает лизосомы: сигнал возврата и SNX27–ретромер</h2><p class="lead">GLUT1 постоянно попадает с поверхности в ранние эндосомы. Чтобы переносчик глюкозы оставался на поверхности, клетка должна вернуть его, а не направить на расщепление. Как эндосома узнаёт этот груз? Для GLUT1 нужен короткий концевой участок — PDZ-лиганд, который связывает PDZ-домен (белковый домен, названный по белкам PSD-95, Dlg и ZO-1), — и комплекс <a href="#ns-g-S3-T30">SNX27–ретромер</a>: сортирующий нексин 27 (SNX27) вместе с ретромером — комплексом белков, возвращающим мембранные белки из эндосом (Steinberg et al., 2013). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Контроль: GLUT1 на мембране. Без SNX27, без VPS35 или без концевого участка GLUT1 — в лизосомах.</div><ol class="mech"><li>SNX27 своим PDZ-доменом связывает концевой участок груза и одновременно — субъединицу ретромера VPS26 (VPS26 и VPS35 — субъединицы ретромера); это связывание необходимо и достаточно, чтобы груз не попал в лизосомы (Steinberg et al., 2013).</li><li>При подавлении SNX27 с поверхности клеток HeLa уходят 122 мембранных белка, при подавлении VPS35 — 152; 81 из них общий.</li><li>Без SNX27 или VPS35 GLUT1 оказывается в лизосомах и расщепляется быстрее; захват глюкозы снижается более чем на 60 %. GLUT1 без трёх концевых аминокислот уходит в лизосомы и в контрольных клетках.</li></ol><p>Что уточняет эта работа. Рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а выбор пути зависит от сигналов сортировки (БИО-3·15). Эксперимент показывает один такой сигнал и белки, которые его узнают: без них белок уходит в лизосому, хотя сам не изменён.</p><p>При подавлении VPS35 рецептора трансферрина на поверхности было в 1,5 раза меньше (при подавлении SNX27 — без изменений), и он не расщеплялся быстрее: разные грузы возвращаются разными путями.</p><h3>Метод</h3><p>Клетки HeLa и RPE1 (линия клеток пигментного эпителия сетчатки человека); SNX27 и VPS35 подавляли малыми интерферирующими РНК. Белки поверхности метили биотином и сравнивали количественной масс-спектрометрией с мечением белков аминокислотами, содержащими тяжёлые изотопы (SILAC); положение GLUT1 определяли иммунофлуоресценцией с маркером лизосом — белком мембраны лизосом LAMP1 (англ. lysosome-associated membrane protein 1); захват глюкозы — по меченой 2-дезоксиглюкозе.</p><p>Контроль: клетки с контрольной РНК; две разные РНК против каждого белка — против неспецифического действия. Чего данные не доказывают: как именно SNX27–ретромер не пускает груз в лизосомный путь, работа не устанавливает; сочетание подавления SNX27 и укороченного GLUT1 не изучали.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: белок, который не вернулся на поверхность, остаётся в ранней эндосоме.<p class="trap-fix">Без SNX27 или ретромера GLUT1 оказывается не в ранних эндосомах (EEA1), а в лизосомах (LAMP1) и расщепляется быстрее (Steinberg et al., 2013).</p></div><div class="static-quiz"><h3>В обычных клетках синтезируется GLUT1 без трёх концевых аминокислот. Где он окажется?</h3><ol><li><b>А.</b> В лизосомах: без концевого участка его не узнаёт SNX27 <i>(верный вариант)</i><br><span class="expl">GLUT1 без PDZ-лиганда оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на мембране (Steinberg et al., 2013).</span></li><li><b>Б.</b> На плазматической мембране, как полный GLUT1 <i>(неверный вариант)</i><br><span class="expl">Концевой участок нужен для возврата из ранней эндосомы; без него белок уходит в лизосомы.</span></li><li><b>В.</b> В ранних эндосомах, где он будет накапливаться <i>(неверный вариант)</i><br><span class="expl">Без сигнала возврата GLUT1 не задерживается в ранних эндосомах, а уходит в лизосомы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb2721">Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471</a></li></ul><p>Steinberg et al., 2013: клетки HeLa и RPE1; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-envelope-pore"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 23 из 31</div><h2>Как устроены ядерная оболочка и ядерная пора</h2><p class="lead"><a href="#ns-g-S3-T31">Ядерная оболочка</a> — две мембраны; наружная продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами. В каждой поре находится <a href="#ns-g-S3-T32">комплекс ядерной поры</a>: через него идёт транспорт белков, рибонуклеопротеинов и РНК между ядром и цитоплазмой. Это вопрос 18 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Малая молекула — по обе стороны оболочки; крупный белок без сигнала в ядре не накапливается.</div><ol class="mech"><li>Комплекс ядерной поры построен примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; каркас комплекса имеет восьмикратную симметрию: восемь повторяющихся секторов между цитоплазматическим и нуклеоплазматическим кольцами.</li><li>Из цитоплазматического кольца в цитоплазму выступают восемь фибрилл; нуклеоплазматическое кольцо закрепляет ядерную корзину.</li><li>Ионы и небольшие молекулы (до ~5 кДа) проходят через каналы поры простой диффузией практически свободно; более крупные диффундируют тем медленнее, чем они больше.</li><li>Белки с FG-повторами (повторами фенилаланин–глицин) создают в поре селективный барьер; крупные макромолекулы быстро проходят его только с транспортными рецепторами.</li></ol><p>Через пору проходят потоки в обе стороны: мРНК и рибосомные субъединицы выходят в цитоплазму, а ядерные белки — гистоны, ламины — синтезируются в цитоплазме и поступают в ядро.</p><p>Вспомнить БИО-3·9: в цитоплазме груз переносят мембранные носители; ядерная пора — другой механизм, без пузырьков: груз проходит через водный канал белкового комплекса.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: считать, что у поры есть порог размера: всё, что мельче, проходит свободно, а более крупные молекулы не проходят вовсе.<p class="trap-fix">Резкого порога нет: более крупные молекулы проходят тем медленнее, чем они больше; крупные белки пассивно проходят очень медленно, а быстро — с транспортными рецепторами.</p></div><div class="static-quiz"><h3>Какие молекулы проходят через ядерную пору простой диффузией практически свободно?</h3><ol><li><b>А.</b> Любые белки, если они не крупнее определённого размера <i>(неверный вариант)</i><br><span class="expl">Резкой границы размера нет: крупные белки пассивно проходят пору очень медленно, быстро — только с транспортными рецепторами.</span></li><li><b>Б.</b> Ионы и небольшие молекулы примерно до 5 кДа <i>(верный вариант)</i><br><span class="expl">Они проходят практически свободно; более крупные молекулы диффундируют тем медленнее, чем они больше.</span></li><li><b>В.</b> Только молекулы с сигналом ядерной локализации <i>(неверный вариант)</i><br><span class="expl">Сигнал нужен для активного переноса крупных белков; малые молекулы проходят без сигнала.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема упрощена: показаны две поры и разрез оболочки.</p></details></article><article class="card print-unit" id="ns-nls-importin"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 24 из 31</div><h2>Как сигнал и транспортный рецептор переносят белок в ядро и из ядра</h2><p class="lead">Крупный белок попадает в ядро, если на нём есть <a href="#ns-g-S3-T33">сигнал ядерной локализации</a> и в клетке есть <a href="#ns-g-S3-T35">импортин</a>, который этот сигнал узнаёт. Обратный путь — <a href="#ns-g-S3-T34">последовательность ядерного экспорта</a> и экспортин.</p><div class="note"><strong>Что показывает схема.</strong> NLS + импортин → ядро; NES + экспортин → цитоплазма; без рецептора сигнал не работает.</div><ol class="mech"><li>Белок с NLS связывается в цитоплазме с растворимым белком импортином.</li><li>Импортин с грузом проходит через пору, взаимодействуя с FG-нуклеопоринами.</li><li>Процесс энергозависим и идёт при участии ГТФ.</li><li>Белок с NES связывается в ядре с экспортином и выходит в цитоплазму, тоже при участии ГТФ.</li></ol><p>Сигнал сам по себе не переносит белок: без импортина белок с NLS остаётся в цитоплазме, а без экспортина белок с NES — в ядре (ЗАКЛЮЧЕНИЕ). Импортин и экспортин, который переносит из ядра белки с NES, узнают разные сигналы: без этого экспортина белок с NLS по-прежнему узнаётся импортином (ЗАКЛЮЧЕНИЕ). Сверх программы: транспортные рецепторы тоже возвращаются для нового цикла — в классическом импорте импортин-α выносит из ядра экспортин CAS, а импортин-β выходит в комплексе с Ran-ГТФ (БИО-3·29).</p><p>Адрес считывается рецептором, но сам по себе не гарантирует локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты.</p><p>Сверх программы: необходимость и достаточность сигнала ядерной локализации показали на Т-антигене вируса SV40 (БИО-3·27).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Иная система адресации — несколько путей импорта белков в митохондрию — <a href="https://fresll.github.io/molbio/seminar-9-route.html#import-routes">МБ, семинар 9, шаг 11</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: белок с NLS проходит в ядро сам, как малая молекула.<p class="trap-fix">Белок с NLS переносит импортин; без транспортного рецептора крупный белок проходит пору пассивно очень медленно и в ядре не накапливается.</p></div><div class="static-quiz"><h3>В клетке нет экспортина, который переносит из ядра белки с NES. Что будет с белком, несущим сигнал ядерной локализации и находящимся в цитоплазме?</h3><ol><li><b>А.</b> Он останется в цитоплазме <i>(неверный вариант)</i><br><span class="expl">Для импорта нужен импортин, а он в этой клетке есть.</span></li><li><b>Б.</b> Он поступит в ядро и тут же выйдет обратно <i>(неверный вариант)</i><br><span class="expl">Без экспортина выход белков из ядра нарушен, а не ускорен.</span></li><li><b>В.</b> Он по-прежнему поступит в ядро с импортином <i>(верный вариант)</i><br><span class="expl">Сигнал ядерной локализации узнаёт импортин; этот экспортин нужен для выхода из ядра белков с NES (ЗАКЛЮЧЕНИЕ).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: импортин показан одним белком.</p></details></article><article class="card print-unit" id="ns-ran-direction"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 25 из 31</div><h2>Чем задано направление переноса через пору</h2><p class="lead">Пора пропускает транспортные рецепторы в обе стороны. Направление переноса задаёт <a href="#ns-g-S3-T36">градиент Ran</a>: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. Импорт и экспорт идут при участии ГТФ; направление переноса задаёт распределение Ran-ГТФ и Ran-ГДФ между ядром и цитоплазмой.</p><div class="note"><strong>Что показывает схема.</strong> С градиентом Ran: импорт в ядро и экспорт из ядра. Без Ran-ГТФ импортин связывает груз, но не освобождает его в ядре, а экспортин груз не связывает.</div><ol class="mech"><li>Импортин связывает груз с NLS в цитоплазме, где Ran-ГТФ мало.</li><li>В ядре Ran-ГТФ связывается с импортином и освобождает груз — груз остаётся в ядре.</li><li>При экспорте Ran-ГТФ, наоборот, стабилизирует комплекс экспортина с грузом до выхода из ядра.</li><li>Гидролиз ГТФ не проталкивает груз через канал механически, а поддерживает различие состояний Ran по сторонам оболочки.</li></ol><p>ЗАКЛЮЧЕНИЕ: для импорта связывание сигнала импортином от Ran-ГТФ не зависит, а освобождение груза в ядре зависит: без Ran-ГТФ импортин связывает белок и проходит с ним пору, но груз не накапливается в ядре. Для экспорта Ran-ГТФ нужен уже для связывания груза экспортином: без него комплекс не образуется, и белок с NES остаётся в ядре.</p><p>Направленный перенос через пору устроен иначе, чем перенос в мембранных носителях: здесь нет оболочки и слияния мембран; груз связывается с транспортным рецептором по одну сторону оболочки и освобождается по другую.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как градиент Ran-ГТФ задаёт направление ядерного транспорта и как он поддерживается — <a href="https://fresll.github.io/molbio/seminar-1-route.html#ran-gradient">МБ, семинар 1, шаг 13</a>.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: энергия ГТФ проталкивает груз через пору.<p class="trap-fix">Гидролиз ГТФ поддерживает различие состояний Ran по сторонам оболочки, а не толкает груз механически.</p></div><div class="static-quiz"><h3>Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Что произойдёт с белком, несущим NLS?</h3><ol><li><b>А.</b> Импортин его свяжет, но белок не будет накапливаться в ядре <i>(верный вариант)</i><br><span class="expl">Импортин связывает NLS и без Ran-ГТФ, а освобождение груза в ядре зависит от Ran-ГТФ; ЗАКЛЮЧЕНИЕ.</span></li><li><b>Б.</b> Импортин его не свяжет <i>(неверный вариант)</i><br><span class="expl">Импортин связывает NLS в цитоплазме, где Ran-ГТФ мало и в норме; Ran-ГТФ нужен для освобождения груза в ядре.</span></li><li><b>В.</b> Белок накопится в ядре быстрее обычного <i>(неверный вариант)</i><br><span class="expl">Без Ran-ГТФ в ядре груз не освобождается, и накопления в ядре нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>На коллоквиуме достаточно знать, что импорт и экспорт идут при участии ГТФ; градиент Ran объясняет, откуда берётся направление переноса. Схема качественная.</p></details></article><article class="card print-unit" id="ns-address-principle"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 26 из 31</div><h2>Сигналы сортировки: что задаёт адрес белка</h2><p class="lead">Место назначения белка зависит от <a href="#ns-g-S3-T37">сигналов сортировки</a>, которые распознают транспортные и сортировочные белки. Такими сигналами могут быть участки аминокислотной цепи или модификации белка; распознавание сигнала включает груз в транспортный путь. Адрес считывается рецептором, но сам по себе не гарантирует конечную локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты.</p><div class="note"><strong>Что показывает схема.</strong> Эндоцитоз: участок рецептора — адаптерные белки. Импорт: NLS — импортин. Экспорт: NES — экспортин.</div><ol class="mech"><li>Сигнал сортировки — участок аминокислотной цепи белка или его модификация: связанные с белком углеводы (например, маннозо-6-фосфат) или присоединённый убиквитин.</li><li>Белки секреторного пути, у которых нет сигналов сортировки в другие компартменты, по умолчанию попадают в конститутивные секреторные везикулы транс-сети комплекса Гольджи.</li><li>В рецептор-опосредованном эндоцитозе лиганд узнаётся рецептором снаружи клетки, а в покрытую клатрином ямку рецептор попадает по своему цитоплазматическому участку, который связывают адаптерные белки.</li><li>Для переноса через ядерную пору сигналы — NLS и NES; их узнают импортин и экспортин.</li></ol><p>Сигнал и груз — не одно и то же. Для отбора в ямку важен участок самого рецептора, а не лиганд: мутации цитоплазматического участка рецептора ЛПНП не мешают ему связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках (сверх программы, БИО-3·20).</p><p>Сигналы сортировки работают и на других участках мембранной сети: сигнальная последовательность направляет растущий белок в ЭПР, маннозо-6-фосфат — гидролазы в лизосомы.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: считать, что все сигналы сортировки устроены одинаково.<p class="trap-fix">Часть сигналов — участки аминокислотной цепи самого белка (NLS, NES, цитоплазматический участок рецептора груза); другие возникают при модификации белка — углеводная метка маннозо-6-фосфат, убиквитин на рецепторе, направляющий его в лизосому.</p></div><div class="static-quiz"><h3>По какому участку рецептор груза собирается в покрытой клатрином ямке?</h3><ol><li><b>А.</b> По связанному с ним лиганду <i>(неверный вариант)</i><br><span class="expl">Лиганд связывается с внеклеточной частью рецептора; в ямку рецептор попадает по своему участку со стороны цитоплазмы.</span></li><li><b>Б.</b> По своему цитоплазматическому участку, который связывают адаптерные белки <i>(верный вариант)</i><br><span class="expl">Рецепторы груза концентрируются в ямке за счёт связывания их цитозольных участков с адаптерными белками.</span></li><li><b>В.</b> По размеру: в ямку попадают самые крупные белки мембраны <i>(неверный вариант)</i><br><span class="expl">Отбор в ямку идёт по участку рецептора, который узнают адаптерные белки, а не по размеру.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li><li><a href="https://doi.org/10.1038/ncb2721">Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471</a></li></ul><p>Пример с GLUT1 — сверх программы.</p></details></article><article class="card print-unit" id="ns-nls-proof"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 27 из 31</div><h2>Как доказали, что семи аминокислот достаточно для адреса в ядро</h2><p class="lead">Сигнал ядерной локализации был впервые определён как короткая последовательность, которая и необходима, и достаточна для накопления белка в ядре (Kalderon et al., 1984). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Т-антиген — в ядре; с заменой Lys128 → Thr — в цитоплазме. Пируваткиназа — в цитоплазме; с PKKKRKV — в ядре; с участком 119–135 (Thr128) — в цитоплазме.</div><ol class="mech"><li>Большой Т-антиген вируса SV40 накапливается в ядре; замена одного остатка — лизина 128 на треонин — нарушает это накопление, хотя стабильность белка заметно не меняется (Kalderon et al., 1984).</li><li>Участок вокруг лизина 128, присоединённый к N-концу цитоплазматического мутанта Т-антигена, возвращает его в ядро.</li><li>Участок вокруг лизина 128 (у пируваткиназы — остатки 119–135), присоединённый к β-галактозидазе бактерий и к пируваткиназе — цитоплазматическому ферменту, — приводит к полному накоплению химерных белков в ядре; с треонином вместо лизина 128 участок не действует.</li><li>Укорочение участка показало: для накопления пируваткиназы в ядре достаточно остатков 126–132 — семи аминокислот Pro-Lys-Lys-Lys-Arg-Lys-Val (PKKKRKV). Авторы оговаривают, что в действие такого короткого сигнала могут вносить вклад соседние остатки, закодированные линкером.</li></ol><p>Что уточняет эта работа. Белки с NLS переносит импортин (БИО-3·24). Эксперимент показывает, что сам сигнал может быть очень коротким и работает в составе чужого белка. Импортин тогда ещё не был известен: механизм узнавания сигнала описали позже.</p><p>Здесь удобно различить необходимость и достаточность. Необходимость: без лизина 128 Т-антиген в ядро не попадает. Достаточность: семь аминокислот переводят в ядро белок, который в норме там не бывает, — в клетке, где весь транспортный аппарат работает. Ни то, ни другое отдельно не доказывает, что сигнал — единственное условие: нужен ещё рецептор, который его узнаёт, а в других белках сигнал может быть недоступен.</p><h3>Метод</h3><p>Плазмиды с генами мутантных и химерных белков вводили микроинъекцией в клетки Vero (линия клеток почки обезьяны); через 18 ч белки выявляли непрямой иммунофлуоресценцией и оценивали, где они находятся — в ядре или в цитоплазме.</p><p>Контроль: исходная пируваткиназа и химера с участком 119–135, в котором лизин 128 заменён треонином. Ограничение: оценка качественная, по микроскопии; ключевой лизин не единственный — замены соседних остатков ослабляли, но не отменяли накопление в ядре. Чего данные не доказывают: что сигнал ускоряет перенос в ядро. Авторы оценивали только накопление в ядре, и удержание белка в ядре этим экспериментом не исключено.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: чтобы попасть в ядро, белок должен быть маленьким.<p class="trap-fix">Пируваткиназа — крупный белок, и с присоединённым участком Т-антигена она накапливается в ядре; для этого достаточно даже семи аминокислот PKKKRKV (Kalderon et al., 1984).</p></div><div class="static-quiz"><h3>Что доказывает эксперимент, в котором пируваткиназа с присоединённым PKKKRKV накапливается в ядре?</h3><ol><li><b>А.</b> Что без этого сигнала никакой белок не попадёт в ядро <i>(неверный вариант)</i><br><span class="expl">Это утверждение о необходимости, и для всех белков оно из эксперимента не следует: у других ядерных белков бывают другие сигналы.</span></li><li><b>Б.</b> Что пируваткиназа в норме работает в ядре <i>(неверный вариант)</i><br><span class="expl">Пируваткиназа — цитоплазматический фермент; в ядро её перевёл присоединённый сигнал.</span></li><li><b>В.</b> Что сигнала достаточно, чтобы направить в ядро чужой белок <i>(верный вариант)</i><br><span class="expl">Цитоплазматический белок с семью аминокислотами сигнала оказывается в ядре — это достаточность добавления сигнала в клетке с работающим транспортным аппаратом (Kalderon et al., 1984).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/0092-8674(84)90457-4">Kalderon D., Roberts B. L., Richardson W. D., Smith A. E. A short amino acid sequence able to specify nuclear location. Cell. 1984;39:499–509</a></li></ul><p>Kalderon et al., 1984: клетки Vero, микроинъекция плазмид, иммунофлуоресценция через 18 ч. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-soft-barrier"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 28 из 31</div><h2>Есть ли у ядерной поры порог размера</h2><p class="lead">Часто говорят, что пора пропускает белки только до определённой массы. Измерения в живых клетках показали: резкого порога нет, пассивный проход постепенно замедляется с ростом массы (Timney et al., 2016). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> 27 кДа — 15 с; 67 кДа — 413 с; резкого порога нет.</div><ol class="mech"><li>В живых дрожжах Saccharomyces cerevisiae сравнивали белки от 27 до 67 кДа: флуоресцентный белок GFP с 0–6 доменами белка A по 7 кДа (Timney et al., 2016).</li><li>Характерная постоянная времени τ выравнивания между ядром и цитоплазмой у GFP (27 кДа) — 15 ± 1,4 с, у белка 67 кДа — 413 ± 92 с (± — 95%-й доверительный интервал); обе величины приведены к клетке со средними объёмами ядра и цитоплазмы и средним числом пор.</li><li>τ растёт примерно как масса в степени 3,8 (3,8 ± 1,0); подвижность белков в растворе при этом различается лишь в 1,6 раза, значит, замедление создаёт сама пора.</li></ol><p>Что уточняет эта работа. Молекулы до ~5 кДа проходят пору практически свободно, а более крупные — тем медленнее, чем они больше (БИО-3·23). Эксперимент даёт числа для белков 27–67 кДа и показывает, что это мягкий барьер, а не сито с жёсткой границей.</p><p>ЗАКЛЮЧЕНИЕ: крупный белок без сигнала может постепенно пройти пору пассивно, но за минуты и без накопления по одну сторону оболочки; быстрый направленный перенос обеспечивают сигнал и транспортный рецептор.</p><h3>Метод</h3><p>Фотообесцвечивание в живых клетках: флуоресценцию белка в цитоплазме гасят лазером и следят, как убывает флуоресценция ядра, пока меченые и обесцвеченные молекулы обмениваются через поры. Убыль экспоненциальная: за время τ разница между текущей и равновесной флуоресценцией уменьшается примерно в 2,7 раза, за τ·ln 2 — вдвое; τ — не время прохода одной молекулы через пору. Измерено около 236 клеток; форму молекул проверяли малоугловым рассеянием рентгеновских лучей.</p><p>Контроль: белки одинакового строения, различающиеся только числом доменов. Чего данные не доказывают: измерения сделаны на дрожжах; перенос чисел на клетки человека не проверен, а облегчённый транспорт с рецепторами эта работа не описывает.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: белки крупнее ~40 кДа через пору пассивно не проходят.<p class="trap-fix">Резкого порога нет: белок 67 кДа проходит пассивно, но в десятки раз медленнее белка 27 кДа (Timney et al., 2016).</p></div><div class="static-quiz"><h3>Белок 67 кДа без сигнала ядерной локализации находится в цитоплазме дрожжевой клетки. Что покажет измерение?</h3><ol><li><b>А.</b> Он выравнивается между ядром и цитоплазмой за минуты <i>(верный вариант)</i><br><span class="expl">Постоянная времени выравнивания — около 413 с: пассивный проход идёт, но медленно (Timney et al., 2016).</span></li><li><b>Б.</b> Он не проходит пору совсем <i>(неверный вариант)</i><br><span class="expl">Резкого порога нет: белок 67 кДа проходит пору пассивно, хотя и медленно.</span></li><li><b>В.</b> Он проходит так же быстро, как GFP (27 кДа) <i>(неверный вариант)</i><br><span class="expl">Постоянная времени различается примерно в 27 раз: 15 с и 413 с.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.201601004">Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76</a></li></ul><p>Timney et al., 2016: живые дрожжи; белки 27–67 кДа; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-npc-structure"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 29 из 31</div><h2>Что известно о строении ядерной поры сегодня</h2><p class="lead">Структурные исследования последних лет описали комплекс ядерной поры почти полностью: это один из крупнейших белковых комплексов клетки (Petrovic et al., 2026). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Около 35 нуклеопоринов и 1000 субъединиц; FG-участки — около 40 % массы; около 1000 макромолекул в секунду через пору.</div><ol class="mech"><li>Комплекс построен примерно из 35 разных нуклеопоринов, представленных множеством копий, — всего около 1000 белковых субъединиц; масса у позвоночных — около 120 МДа (Petrovic et al., 2026).</li><li>Нуклеопорины образуют кольца из восьми одинаковых спиц, которые проходят через слившиеся наружную и внутреннюю ядерные мембраны.</li><li>Неупорядоченные участки с FG-повторами составляют около 40 % массы поры человека и заполняют центральный канал, создавая барьер.</li><li>Через одну пору проходит около 1000 макромолекул в секунду; каждая находится в канале около 10 мс.</li></ol><p>Что уточняет этот обзор. Обычно называют около 30 различных нуклеопоринов (БИО-3·23); обзор 2026 г. — около 35. Числа близки.</p><p>Обзор подтверждает и схему направленного переноса (БИО-3·25): фактор обмена нуклеотидов для Ran находится на хроматине в ядре, белок, активирующий гидролиз ГТФ Ran, — в цитоплазме; поэтому Ran-ГТФ преобладает в ядре (Petrovic et al., 2026; вспомнить БИО-3·25). Обзор описывает и обратный путь самого импортина: в классическом импорте сигнал ядерной локализации связывает импортин-α вместе с импортином-β; в ядре Ran-ГТФ освобождает груз, импортин-β с Ran-ГТФ возвращается в цитоплазму, а импортин-α выносит из ядра другой экспортин — Cas — тоже вместе с Ran-ГТФ. Белки с NES выносит экспортин Crm1. ЗАКЛЮЧЕНИЕ: без Cas импортин-α накапливался бы в ядре, и импорт остановился бы после того, как свободный импортин-α в цитоплазме закончится.</p><p>Раньше считали, что барьер поры ограничивает свободную диффузию макромолекул крупнее 40 кДа; более поздние работы показывают, что он влияет на скорость прохода молекул самых разных размеров (вспомнить БИО-3·28).</p><h3>Метод</h3><p>Обзор описывает, как к почти атомным структурам целых пор пришли, объединив электронную микроскопию, биохимическую реконструкцию комплексов нуклеопоринов и интегративную структурную биологию: структуры отдельных нуклеопоринов встраивают в карты плотности поры, полученные криоэлектронной томографией клеток и выделенных ядерных оболочек (Petrovic et al., 2026). Контроль — сравнение карт пор разных организмов и проверка взаимодействий нуклеопоринов биохимически и в клетке. Ограничение: разрешение карт пор в клетке — около 2–5 нм, поэтому положение отдельных участков белков в них определяют, встраивая структуры, полученные другими методами. Чего данные не доказывают: как именно FG-барьер отбирает молекулы — это обсуждают отдельные модели.</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: ядерная пора — пустое отверстие в оболочке.<p class="trap-fix">Центральный канал заполнен неупорядоченными участками с FG-повторами — около 40 % массы поры человека; они и создают барьер (Petrovic et al., 2026).</p></div><div class="static-quiz"><h3>Что заполняет центральный канал ядерной поры и создаёт её барьер?</h3><ol><li><b>А.</b> Липидный бислой, который пора проходит насквозь <i>(неверный вариант)</i><br><span class="expl">Мембраны ядерной оболочки в поре слиты и окружают комплекс снаружи; канал заполнен белковыми участками.</span></li><li><b>Б.</b> Неупорядоченные участки нуклеопоринов с FG-повторами <i>(верный вариант)</i><br><span class="expl">Они составляют около 40 % массы поры человека и заполняют канал (Petrovic et al., 2026).</span></li><li><b>В.</b> Вода без белков, поэтому проходит всё, что меньше канала <i>(неверный вариант)</i><br><span class="expl">Канал заполнен FG-участками; именно поэтому крупные молекулы проходят медленно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00881-w">Petrovic S., Mobbs G. W., Hoelz A. Structure, function and assembly of nuclear pore complexes. Nat Rev Mol Cell Biol. 2026;27:35–54</a></li></ul><p>Petrovic, Mobbs, Hoelz, 2026 — обзор. Числа — из него; масса указана для позвоночных. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 30 из 31</div><h2>Как узнают, на каком этапе остановился груз</h2><p class="lead">Во многих экспериментах семинара вопрос один: где оказался груз после того, как выключили деталь. Ответить на него помогают разные методы, и у каждого — своя измеряемая величина, свой контроль и свои ограничения. Шаг собирает методы, которые встретились в продвинутых шагах разделов 1–4. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Электронная микроскопия — форма мембран; иммунофлуоресценция — компартмент; бесклеточная система — необходимый белок; фотообесцвечивание — скорость прохода.</div><ol class="mech"><li>Электронная микроскопия показывает форму мембран — впяченную ямку, суженную шейку, трубку (БИО-3·4; Damke et al., 1994).</li><li>Иммунофлуоресценция с белками-маркерами компартментов показывает, с каким компартментом совпадает груз: LAMP1 — маркер лизосом и поздних эндосом, EEA1 — ранних эндосом (БИО-3·22; Steinberg et al., 2013).</li><li>Бесклеточная система из мембран и цитозоля позволяет выключить один компонент и вернуть его очищенным (БИО-3·13; Block et al., 1988).</li><li>Съёмка живых клеток и фотообесцвечивание измеряют время: как быстро меняется метка эндосомы или выравнивается белок между ядром и цитоплазмой (БИО-3·21, 3·28).</li></ol><p>ЗАКЛЮЧЕНИЕ: измеряемую величину выбирают по вопросу. Если нужно узнать, образовался ли носитель, смотрят форму мембраны; если нужно узнать, куда попал груз, — его положение относительно маркеров компартментов; если нужно узнать, какой белок необходим, — выключают его и возвращают очищенным или синтезированным заново.</p><h3>Контроль и ограничения</h3><p>Контроль — тот же эксперимент без вмешательства или с вмешательством, которое не должно действовать (белок дикого типа вместо мутантного, контрольная РНК, сигнал с заменой ключевого остатка). Типичные артефакты: избыточный синтез меченого белка, неспецифическое действие ингибитора (например, N-этилмалеимида), перенос выводов с одного типа клеток на другие.</p><p>Измерение само по себе показывает, где находится груз или как выглядит мембрана, — это наблюдение. Необходимость детали доказывает вмешательство (удаление, мутация, подавление синтеза) вместе с таким измерением; достаточность добавления — перенос сигнала на чужой белок или восстановление функции очищенным белком в системе, где остальные компоненты сохранены. Некоторые работы семинара измеряли свойство, а не необходимость детали: скорость прохода через пору (Timney et al., 2016), натяжение мембраны (Sinha et al., 2011), сродство лиганда к рецептору при разном pH (Dautry-Varsat et al., 1983).</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: если метод показал, где находится груз, механизм уже доказан.<p class="trap-fix">Положение груза — наблюдение; чтобы показать, что деталь необходима, её выключают и сравнивают с контролем, а достаточность добавления проверяют переносом сигнала на чужой белок или восстановлением функции очищенным белком в системе, где остальные компоненты сохранены.</p></div><div class="static-quiz"><h3>Нужно проверить, попадает ли белок в лизосомы после выключения SNX27. Какую величину измерить?</h3><ol><li><b>А.</b> Форму клатриновых ямок в электронной микроскопии <i>(неверный вариант)</i><br><span class="expl">Форма ямок говорит об образовании носителя на поверхности, а не о том, куда груз попал после эндосомы.</span></li><li><b>Б.</b> Скорость выравнивания белка между ядром и цитоплазмой <i>(неверный вариант)</i><br><span class="expl">Эта величина описывает проход через ядерную пору; к лизосомам она отношения не имеет.</span></li><li><b>В.</b> Положение белка относительно маркера лизосом LAMP1 <i>(верный вариант)</i><br><span class="expl">Увеличение совпадения с LAMP1 согласуется с доставкой белка в лизосомные компартменты; расщепление подтверждают отдельным измерением — так и сделано в работе (Steinberg et al., 2013).</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.127.4.915">Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934</a></li><li><a href="https://doi.org/10.1073/pnas.85.21.7852">Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856</a></li><li><a href="https://doi.org/10.1016/j.cell.2005.06.043">Rink J., Ghigo E., Kalaidzidis Y., Zerial M. Rab conversion as a mechanism of progression from early to late endosomes. Cell. 2005;122:735–749</a></li><li><a href="https://doi.org/10.1038/ncb2721">Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471</a></li><li><a href="https://doi.org/10.1083/jcb.201601004">Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76</a></li></ul><p>Обобщение методов из продвинутых шагов семинара; числа и условия — в соответствующих шагах. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 31 из 31</div><h2>Путь одного груза через клетку: трансцитоз IgA</h2><p class="lead">Проследим один груз — димерный IgA, который эпителиальная клетка переносит от базолатеральной поверхности к апикальной (<a href="#ns-g-S3-T27">трансцитоз</a>), — и на каждом этапе назовём, что происходит и что для этого нужно. Шаг повторяет материал разделов 1–3 на новом примере.</p><div class="note"><strong>Что показывает схема.</strong> Базолатеральная поверхность → покрытая клатрином везикула → эндосомы → апикальная мембрана: комплекс не распадается до расщепления рецептора.</div><ol class="mech"><li>Базолатеральная поверхность: IgA связывается с полимерным иммуноглобулиновым рецептором; рецептор собирается в покрытой клатрином ямке, его цитоплазматический участок связывают адаптерные белки; покрытую везикулу отделяет динамин (условие примера).</li><li>Цитоплазма: везикула сбрасывает клатриновую оболочку и сливается с ранней эндосомой с участием SNARE-белков.</li><li>Эндосомы: комплекс IgA с рецептором не диссоциирует и переносится через эндосомы к апикальной мембране.</li><li>Апикальная мембрана: рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом.</li></ol><p>ЗАКЛЮЧЕНИЕ: этот путь отличается от самого частого тем, что лиганд не отделяется от рецептора в ранней эндосоме, а рецептор не возвращается: его внеклеточная часть уходит в секрет вместе с IgA. Поэтому одна молекула рецептора переносит IgA один раз (вспомнить БИО-3·16, 3·17).</p><p>Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко. Клинический пример иллюстрирует механизм и не является рекомендацией.</p><p>Сравните с белком, идущим в ядро: там нет мембранных носителей, а груз проходит через водный канал комплекса ядерной поры с транспортным рецептором (БИО-3·24, 3·25).</p><div class="note trap"><strong>Типичная ошибка</strong> Ошибка: в эндосоме лиганд всегда отделяется от рецептора.<p class="trap-fix">Комплекс IgA с полимерным иммуноглобулиновым рецептором не диссоциирует: рецептор переносит IgA через клетку и расщепляется на апикальной мембране.</p></div><div class="static-quiz"><h3>Где IgA отделяется от полимерного иммуноглобулинового рецептора при трансцитозе?</h3><ol><li><b>А.</b> Нигде в клетке: на апикальной мембране рецептор расщепляется, и IgA выделяется вместе с его внеклеточной частью <i>(верный вариант)</i><br><span class="expl">IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом.</span></li><li><b>Б.</b> В ранней эндосоме, как большинство лигандов <i>(неверный вариант)</i><br><span class="expl">Комплекс IgA с рецептором в эндосомах не диссоциирует и переносится к апикальной мембране.</span></li><li><b>В.</b> В лизосоме, где рецептор расщепляется <i>(неверный вариант)</i><br><span class="expl">Комплекс идёт не в лизосому, а к апикальной мембране; рецептор расщепляется там.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Обобщение материала разделов 1–3. Условие примера: рецептор с IgA захватывается через покрытые клатрином ямки, как рецепторный груз в шаге БИО-3·2. Схема-таблица качественная.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S3-T01"><dt>Эндоцитоз</dt><dd>Общее название процессов везикулярного транспорта, при которых вещества поступают в клетку в мембранных пузырьках, образованных из плазматической мембраны.</dd></div><div id="ns-g-S3-T02"><dt>Микропиноцитоз</dt><dd>Постоянное неспецифическое поглощение жидкости и небольших белковых молекул в мелких пузырьках (менее 150 нм). Такие пузырьки образуются разными путями — из покрытых клатрином ямок и без клатрина.</dd></div><div id="ns-g-S3-T03"><dt>Макропиноцитоз</dt><dd>Регулируемый захват внеклеточной жидкости: перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы более 0,2 мкм.</dd></div><div id="ns-g-S3-T04"><dt>Фагоцитоз</dt><dd>Поглощение крупных частиц (бактерий, обломков клеток, пыли) специализированными фагоцитами; псевдоподии охватывают частицу, образуется фагосома более 250 нм.</dd></div><div id="ns-g-S3-T05"><dt>Рецептор-опосредованный эндоцитоз</dt><dd>Захват молекул, которые связываются со своими рецепторами на поверхности клетки. Во многих клетках животных растворённые макромолекулы так поступают через покрытые клатрином ямки: рецепторы с грузом через адаптеры связываются с клатрином, и ямка становится покрытой клатрином везикулой. Узнавание груза рецептором бывает и в клатрин-независимых путях, например при фагоцитозе.</dd></div><div id="ns-g-S3-T06"><dt>Рецептор груза</dt><dd>Трансмембранный белок, который снаружи связывает определённый груз, а цитоплазматическим участком — белок-адаптер.</dd></div><div id="ns-g-S3-T07"><dt>Белок-адаптер</dt><dd>Белок, связывающий цитоплазматический участок рецептора груза с клатрином, например адаптин.</dd></div><div id="ns-g-S3-T08"><dt>Клатрин</dt><dd>Белок оболочки, который собирается в решётку с цитоплазматической стороны мембраны и изгибает её в ямку.</dd></div><div id="ns-g-S3-T09"><dt>Динамин</dt><dd>ГТФаза, которая опосредует отделение покрытой клатрином везикулы от мембраны; шейку ямки перерезает динамин.</dd></div><div id="ns-g-S3-T10"><dt>Кавеола</dt><dd>Сверх программы: колбовидное впячивание плазматической мембраны 50–100 нм, образованное кавеолинами и кавинами и обогащённое холестерином и сфинголипидами.</dd></div><div id="ns-g-S3-T11"><dt>Натяжение мембраны</dt><dd>Сверх программы: сила, растягивающая мембрану в её плоскости, в расчёте на единицу длины (мН/м); растёт, когда площадь клетки должна увеличиться (например, при набухании), а запаса мембраны нет.</dd></div><div id="ns-g-S3-T12"><dt>Асимметрия мембраны</dt><dd>Сверх программы: различие липидного состава наружного и цитоплазматического листков плазматической мембраны.</dd></div><div id="ns-g-S3-T13"><dt>Транспортный носитель</dt><dd>Мембранный пузырёк (везикула), который образуется почкованием от мембраны одного компартмента и сливается с мембраной другого, перенося груз между ними.</dd></div><div id="ns-g-S3-T14"><dt>Оболочка носителя</dt><dd>Белковый слой, который собирается на мембране-доноре, отбирает груз и изгибает мембрану в носитель: COP-II, COP-I или клатрин с адаптерами.</dd></div><div id="ns-g-S3-T15"><dt>COP-II</dt><dd>Оболочка носителей, переносящих только что синтезированные белки из грЭПР в цис-сеть комплекса Гольджи (антероградный, прямой транспорт).</dd></div><div id="ns-g-S3-T16"><dt>COP-I</dt><dd>Оболочка носителей ретроградного (обратного) транспорта: из комплекса Гольджи в грЭПР и между цистернами комплекса Гольджи.</dd></div><div id="ns-g-S3-T17"><dt>SNARE-белки</dt><dd>Белки слияния мембран: SNARE носителя (v-SNARE) и SNARE мембраны-мишени (t-SNARE) собираются в комплекс и обеспечивают слияние. По остатку в центре комплекса их делят также на R-SNARE (аргинин) и Q-SNARE (глутамин); это другая классификация, а не новое название v- и t-SNARE (БИО-3·12).</dd></div><div id="ns-g-S3-T18"><dt>Rab-белки и тетеринг-факторы</dt><dd>Белки первичного узнавания мишени: Rab в активной форме (связанный с ГТФ) отмечает мембрану и привлекает длинные тетеринг-факторы, которые удерживают подходящий носитель на расстоянии до сборки SNARE.</dd></div><div id="ns-g-S3-T19"><dt>Ранняя эндосома</dt><dd>Сортировочный компартмент, который образуется при слиянии эндоцитозных везикул друг с другом; обычно около 10 минут принимает новые везикулы, а затем созревает в позднюю эндосому.</dd></div><div id="ns-g-S3-T20"><dt>NSF</dt><dd>АТФаза, чувствительная к N-этилмалеимиду (англ. N-ethylmaleimide-sensitive factor): после слияния разбирает SNARE-комплекс. Сверх программы: работает вместе с белками α-SNAP — растворимыми белками, связывающими NSF.</dd></div><div id="ns-g-S3-T21"><dt>Пора слияния</dt><dd>Сверх программы: канал, который соединяет просвет носителя с просветом мишени (или с внеклеточной средой при экзоцитозе) в момент слияния мембран.</dd></div><div id="ns-g-S3-T22"><dt>Гемислияние</dt><dd>Сверх программы: промежуточное состояние слияния, при котором слиты только обращённые друг к другу (проксимальные) монослои двух мембран, а поры ещё нет.</dd></div><div id="ns-g-S3-T23"><dt>Рециркуляция рецептора</dt><dd>Возврат рецептора из ранней эндосомы на поверхность клетки в везикулах, отпочковывающихся от эндосомы; позволяет клетке постоянно и избирательно захватывать вещество.</dd></div><div id="ns-g-S3-T24"><dt>Поздняя эндосома</dt><dd>Эндосома, в которую созревает ранняя: её среда кислее, она лежит глубже в цитоплазме; мембрана поздней эндосомы впячивается внутрь, образуя мультивезикулярное тельце.</dd></div><div id="ns-g-S3-T25"><dt>Мультивезикулярное тельце</dt><dd>Поздняя эндосома с внутрипросветными везикулами, образованными впячиванием её мембраны в просвет; мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется.</dd></div><div id="ns-g-S3-T26"><dt>Убиквитин</dt><dd>Небольшой белок, который присоединяется к другим белкам как метка; убиквитинированный рецептор включается в мембрану внутрипросветных везикул и разрушается в лизосоме.</dd></div><div id="ns-g-S3-T27"><dt>Трансцитоз</dt><dd>Перенос рецептора с лигандом через клетку — например, димерного IgA с полимерным иммуноглобулиновым рецептором от базолатеральной поверхности эпителиальной клетки к апикальной.</dd></div><div id="ns-g-S3-T28"><dt>Трансферрин</dt><dd>Сверх программы: белок плазмы крови, переносящий железо; отдаёт железо в кислой эндосоме, а сам вместе с рецептором возвращается на поверхность клетки.</dd></div><div id="ns-g-S3-T29"><dt>Rab5 и Rab7</dt><dd>Малые ГТФазы — метки ранней (Rab5) и поздней (Rab7) эндосомы. Сверх программы: при созревании эндосомы Rab5 на её мембране сменяется Rab7.</dd></div><div id="ns-g-S3-T30"><dt>SNX27–ретромер</dt><dd>Сверх программы: комплекс на ранней эндосоме, который узнаёт концевой PDZ-лиганд мембранного белка и возвращает белок на поверхность вместо лизосомы.</dd></div><div id="ns-g-S3-T31"><dt>Ядерная оболочка</dt><dd>Две мембраны с перинуклеарным пространством между ними; наружная мембрана продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами.</dd></div><div id="ns-g-S3-T32"><dt>Комплекс ядерной поры</dt><dd>Белковый комплекс в поре ядерной оболочки, построенный примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; белки с FG-повторами создают в нём селективный барьер.</dd></div><div id="ns-g-S3-T33"><dt>Сигнал ядерной локализации (NLS)</dt><dd>Участок белка, по которому его узнаёт импортин и переносит из цитоплазмы в ядро.</dd></div><div id="ns-g-S3-T34"><dt>Последовательность ядерного экспорта (NES)</dt><dd>Участок белка, по которому его в ядре узнаёт экспортин и переносит в цитоплазму.</dd></div><div id="ns-g-S3-T35"><dt>Импортин и экспортин</dt><dd>Растворимые транспортные рецепторы: импортин связывает белки с NLS и переносит их в ядро, экспортин — белки с NES из ядра; оба процесса идут при участии ГТФ.</dd></div><div id="ns-g-S3-T36"><dt>Градиент Ran</dt><dd>Различие состояний малой ГТФазы Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме; задаёт направление переноса через пору.</dd></div><div id="ns-g-S3-T37"><dt>Сигнал сортировки</dt><dd>Участок аминокислотной цепи белка или его модификация (например, маннозо-6-фосфат или присоединённый убиквитин), по которым сортировочный аппарат клетки направляет белок к месту назначения.</dd></div></dl></section></noscript>

к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","trap_label":"Типичная ошибка","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Правильные ответы","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения помогают читать схемы и формулировать вывод из эксперимента. Подчёркнутые в тексте шагов термины ведут к этому словарю.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Двенадцать вопросов базового уровня разделов 1–4. После ответа откройте разбор. Если механизм остался непонятен, вернитесь к объяснению.","exam_note":"Это повторение ключевых связей, а не гарантия освоения всей темы. Результаты показаны в оглавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 26 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Переключатели показывают предсказания учебной модели: её правила заданы заранее, а экспериментальные основания правил рассматриваются на продвинутом уровне; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Адресация груза: метка, рецептор и механизм переноса","stats":[["4 вопроса","от эндоцитоза до ядерной поры"],["Объяснения","с вопросами для самопроверки"],["2 уровня","базовый — к коллоквиуму и зачёту, продвинутый — по исследовательским статьям"]],"num_fmt":"БИО-3·{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Все семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →"},"lessons":[{"id":"endo-routes","section":0,"questions":[1],"title":"Какие механизмы эндоцитоза различают и по каким признакам","keywords":["эндоцитоз","пиноцитоз","фагоцитоз","клатрин","актин"],"lead":["[[T01|Эндоцитоз]] — общее название путей, которыми вещества поступают в клетку в мембранных пузырьках.","В семинаре рассматриваются пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Эти названия описывают разные признаки — размер и способ образования носителя, узнавание груза рецептором, — поэтому частично перекрываются: фагоцитоз тоже начинается с узнавания частицы рецепторами. Их характеристика — вопрос 8 коллоквиума."],"mechanism":["[[T02|Микропиноцитоз]]: мембрана постоянно образует мелкие пузырьки (< 150 нм) и неспецифически захватывает жидкость.","[[T03|Макропиноцитоз]]: после сигнала фактора роста перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы (> 0,2 мкм).","[[T04|Фагоцитоз]]: псевдоподии фагоцита охватывают крупную частицу, образуется фагосома (> 250 нм).","[[T05|Рецептор-опосредованный эндоцитоз]] в показанном клатрин-зависимом варианте: адаптеры связывают цитоплазматические участки рецепторов с клатриновой оболочкой, и ямка становится покрытой клатрином везикулой."],"paragraphs":["Эндоцитоз делят на пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Кроме того, пути различают по тому, какие белки нужны для образования носителя: клатрин и перестройка актина.","Жидкость с растворёнными веществами клетка поглощает неспецифически: внутрь попадает то, что растворено во внеклеточной среде. Молекулы, для которых на поверхности есть рецепторы, захватываются избирательно и концентрируются в ямке. Крупные частицы — бактерии, обломки клеток, пыль — поглощают главным образом специализированные клетки-фагоциты: макрофаги, нейтрофилы, дендритные клетки.","Мелкие пузырьки микропиноцитоза — менее 150 нм; макропиносомы — более 0,2 мкм, фагосомы — более 250 нм. Макропиносомы и фагосомы образуются из выпячиваний мембраны — складок или псевдоподий, которые создаёт перестройка актина. ЗАКЛЮЧЕНИЕ: крупный носитель образуется из выпячивания, охватывающего большой объём, поэтому он и крупнее мелкого пузырька.",{"h":"Как зависимость пути от белка проверяют в эксперименте"},"Белок выключают и смотрят, какие носители перестали образовываться: если без белка носитель не образуется, белок необходим для этого пути. По такому принципу устроен практикум вопроса 1 (вкладка «Эндоцитоз»)."],"trap":["Ошибка: считать, что любой эндоцитоз идёт через клатриновые ямки.","Клатрин нужен показанному здесь пути захвата рецепторного груза; другие пути, в том числе начинающиеся с узнавания рецепторами (фагоцитоз), обходятся без клатрина."],"conditions":"Размеры носителей приближённые. Модель упрощена: мелкие пузырьки показаны как путь, которому не нужны клатрин и перестройка актина; на самом деле часть мелких пузырьков образуется из клатриновых ямок, а при повышенном натяжении мембраны им нужна и полимеризация актина (продвинутые шаги этого раздела). Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L01","question":"В клетке нет клатрина. Какой груз клетка по-прежнему сможет поглощать?","options":[{"id":"S3-L01-1","text":"Жидкость с растворёнными веществами","correct":true,"feedback":"Жидкость продолжают захватывать макропиносомы и мелкие носители, которые образуются без клатрина."},{"id":"S3-L01-2","text":"Только молекулы, связанные с рецепторами","correct":false,"feedback":"Наоборот: показанный здесь избирательный захват растворённых молекул, связанных с рецепторами, идёт через клатриновые ямки и без клатрина выпадает."},{"id":"S3-L01-3","text":"Никакой: без клатрина эндоцитоз невозможен","correct":false,"feedback":"Клатрин нужен не всем путям: макропиноцитоз, фагоцитоз и часть мелких пузырьков обходятся без него."}]},"widget":{"kind":"routes","title":"","s":{"title":"Выберите груз и посмотрите, каким носителем он попадёт в клетку","status":"Схема качественная · размеры не в масштабе","modes_label":"Груз","modes":["раствор","раствор + фактор роста","лиганд рецептора","крупная частица"],"out":"внеклеточная среда","cyto":"цитоплазма","m_route":"Механизм","m_carrier":"Носитель","m_size":"Размер","routes":["микропиноцитоз","микро- и макропиноцитоз","рецептор-опосредованный эндоцитоз","фагоцитоз"],"carriers":["мелкие пузырьки","мелкие пузырьки и макропиносомы","покрытые клатрином везикулы","фагосома"],"sizes":["< 150 нм","< 150 нм и > 0,2 мкм","≈ 60–120 нм","> 250 нм"],"notes":["Жидкость захватывается постоянно и неспецифически.","Фактор роста запускает складки мембраны: к мелким пузырькам добавляются крупные макропиносомы.","Рецепторы с лигандом собраны в ямке; клатрин связан с ними через адаптеры.","Псевдоподии фагоцита охватывают частицу; после смыкания их краёв фагосома уходит в цитоплазму (справа)."],"static":["Четыре варианта груза: раствор — мелкие пузырьки < 150 нм; раствор с фактором роста — ещё и макропиносомы > 0,2 мкм; лиганд рецептора — покрытые клатрином везикулы; крупная частица — фагосома > 250 нм."]}}},{"id":"coated-pit","section":0,"questions":[1],"title":"Как клатриновая ямка собирается вокруг рецептора с грузом","keywords":["клатрин","адаптер","адаптин","рецептор","ямка"],"lead":["Груз попадает в клатриновую ямку не сам: его связывает трансмембранный [[T06|рецептор]], цитоплазматический участок рецептора связывает [[T07|белок-адаптер]], а к адаптеру присоединяется [[T08|клатрин]].","Поэтому рецептор-опосредованный эндоцитоз избирателен: в ямке концентрируются те молекулы, для которых есть рецепторы. Это основа вопроса 9 коллоквиума; что происходит с грузом дальше — вопрос 3 практикума."],"mechanism":["Лиганд связывается с рецептором на наружной стороне мембраны.","Цитоплазматический участок рецептора связывается с белком-адаптером, например адаптином.","Адаптеры привлекают клатрин; клатриновая решётка изгибает мембрану в ямку.","Ямка отделяется как покрытая клатрином везикула, затем оболочка быстро сбрасывается."],"paragraphs":["Клатрин собирается в решётку с цитоплазматической стороны мембраны и изгибает её; с рецепторами груза он связывается не напрямую, а через белки-адаптеры. Работа разделена: рецептор определяет, какой груз будет захвачен, адаптер связывает рецептор с оболочкой, клатрин придаёт мембране форму ямки.","Рецепторы концентрируются в ямке за счёт того, что их цитоплазматические участки связываются с адаптерами. Поэтому груза в ямке больше, чем на соседних участках мембраны, — в этом и состоит избирательность пути.","Отделение покрытой везикулы от мембраны опосредует белок [[T09|динамин]]. Затем клатриновая оболочка быстро сбрасывается, и везикула может слиться с мембраной-мишенью — ранней эндосомой.","Так клетка поглощает, например, белки-переносчики, связанные со своими рецепторами; что происходит с рецептором и лигандом после эндоцитоза — тема вопроса 3 практикума (вопрос 9 коллоквиума). Вспомнить: белки-рецепторы — вопрос 4 коллоквиума.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как эндоцитоз вместе с доставкой и диффузией поддерживает полярный домен мембраны — [[https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes|МБ, семинар 2, шаг 25]]; как захват рецепторов внутрь клетки ослабляет ответ на длительный сигнал — [[https://fresll.github.io/molbio/seminar-3-route.html#desensitization|МБ, семинар 3, шаг 6]]."],"trap":["Ошибка: клатрин сам узнаёт груз.","Груз узнаёт рецептор, а клатрин связывается с рецептором через белок-адаптер."],"conditions":"Схема упрощена: показаны один тип адаптера и одна оболочка.","sources":["Alberts2022"],"quiz":{"id":"S3-L02","question":"В клетке синтезируется рецептор, у которого удалён цитоплазматический участок, связывающий адаптер; наружный участок связывает лиганд нормально. Что произойдёт с этим рецептором?","options":[{"id":"S3-L02-1","text":"Он перестанет связывать лиганд на поверхности клетки","correct":false,"feedback":"Лиганд связывается наружным участком рецептора, а удалён цитоплазматический участок."},{"id":"S3-L02-2","text":"Он будет связывать лиганд, но не будет концентрироваться в ямках","correct":true,"feedback":"Наружный участок связывает груз, а попадание рецептора в ямку обеспечивает связывание цитоплазматического участка с адаптером."},{"id":"S3-L02-3","text":"Он соберёт клатриновую оболочку вокруг себя без адаптера","correct":false,"feedback":"Клатрин связывается с рецептором через адаптер; без участка для адаптера связи рецептора с оболочкой нет."}]},"widget":{"kind":"pit","title":"","s":{"title":"Пройдите этапы сборки ямки","status":"Схема качественная · не экспериментальные данные","modes_label":"Этап","modes":["лиганд связан с рецепторами","адаптеры связали рецепторы","клатрин изогнул мембрану","везикула отделилась, оболочка сброшена"],"out":"внеклеточная среда","cyto":"цитоплазма","notes":["Рецепторы с лигандом рассеяны по мембране.","Цитоплазматические участки рецепторов связаны с адаптерами.","Клатриновая решётка изгибает мембрану в ямку; рецепторы с грузом собраны в ней.","Покрытая везикула отделилась (с участием динамина), клатриновая оболочка сброшена."],"m_stage":"Что изменилось","static":["Четыре этапа: связывание лиганда с рецептором → связывание рецептора с адаптером → сборка клатриновой решётки и изгиб мембраны → отделение везикулы и сброс оболочки."]}}},{"id":"actin-uptake","section":0,"questions":[1],"title":"Как перестройка актина образует макропиносомы и фагосомы","keywords":["актин","макропиноцитоз","фагоцитоз","псевдоподии","макрофаг"],"lead":["Макропиносомы и фагосомы образуются не из ямки, а из выпячиваний плазматической мембраны, которые охватывают жидкость или частицу.","Выпячивания — складки при макропиноцитозе и псевдоподии при фагоцитозе — создаёт перестройка актинового цитоскелета."],"mechanism":["Фактор роста запускает перестройку актина под мембраной.","Складки мембраны удлиняются, загибаются и замыкаются, захватывая внеклеточную жидкость, — образуется макропиносома.","Рецепторы фагоцита узнают частицу, например бактерию, покрытую антителами, и актин выталкивает псевдоподии вокруг неё — образуется фагосома.","Без перестройки актина выпячиваний нет, и оба крупных носителя не образуются."],"paragraphs":["При макропиноцитозе складки мембраны захватывают внеклеточную жидкость с растворёнными веществами и антигенами; при фагоцитозе псевдоподии охватывают крупную твёрдую частицу. В обоих случаях носитель образуется из выпячивания мембраны, и выпячивание создаёт перестройка актина.","Макропиноцитоз — регулируемый процесс: в большинстве клеток его запускают сигналы, например макрофагальный колониестимулирующий фактор-1 и эпидермальный фактор роста; активно идёт у макрофагов. Во многих клетках макропиносомы, как и фагосомы, затем сливаются с поздними эндосомами или лизосомами, и их содержимое расщепляется; здесь показан этот вариант.","Фагоцитоз осуществляют главным образом специализированные фагоциты — макрофаги, нейтрофилы и дендритные клетки. Бактерии, покрытые антителами, узнаются рецепторами к Fc-фрагментам антител; небиологические частицы, например угольная пыль, захватываются без участия этих рецепторов.","Вспомнить: актиновые филаменты, их полярность и динамика."],"trap":["Ошибка: считать, что макропиноцитоз идёт постоянно и одинаково во всех клетках.","В большинстве клеток макропиноцитоз не идёт постоянно: его запускают сигналы, например факторы роста, и для него нужна перестройка актина."],"conditions":"Схема качественная: показано, образуется ли носитель, но не скорость процесса.","sources":["Alberts2022"],"quiz":{"id":"S3-L03","question":"Макрофаг обработали веществом, которое не даёт перестраиваться актиновому цитоскелету, а затем добавили бактерии, покрытые антителами. Что произойдёт с фагоцитозом?","options":[{"id":"S3-L03-1","text":"Бактерии будут поглощены в покрытых клатрином везикулах","correct":false,"feedback":"Фагоцитоз не использует клатриновые ямки, а бактерия намного крупнее покрытой клатрином везикулы."},{"id":"S3-L03-2","text":"Фагоцитоз не изменится: псевдоподии образуются за счёт клатрина","correct":false,"feedback":"Псевдоподии создаёт перестройка актина, а не клатрин; фагоцитоз — клатрин-независимый путь."},{"id":"S3-L03-3","text":"Фагосомы не образуются: без перестройки актина нет псевдоподий","correct":true,"feedback":"Псевдоподии, охватывающие частицу, создаёт перестройка актина; без неё частица не поглощается."}]},"widget":{"kind":"routes","title":"","s":{"title":"Включите и выключите перестройку актина","status":"Схема качественная · не экспериментальны
