дпочечника быка; секрецию запускали деполяризацией в течение 1 с. Цитоплазматический монослой плазматической мембраны метили флуоресцентным белком, связывающим фосфатидилинозитол-4,5-бисфосфат, а внеклеточную среду — малым флуоресцентным красителем: краситель проникает в везикулу, только когда пора открыта.</p><p>Контроль: гемислиянию соответствует Ω-профиль, на который переходит метка цитоплазматического монослоя плазматической мембраны, но в который не проникают малый краситель и ионы H+ и на который не переходит метка внеклеточного монослоя; открытая пора пропускает краситель. Ограничение: поры меньше ~60 нм не видны непосредственно, их открытие определяют по проникновению красителя.</p><p>Чего данные не доказывают. Наблюдения сделаны на крупных везикулах (~200–1500 нм) одного типа клеток; везикулы 30–100 нм, например синаптические, таким методом не видны, и перенос выводов на них не показан.</p><div class="static-quiz"><h3>Во внеклеточную среду добавили малый флуоресцентный краситель. Метка цитоплазматического монослоя плазматической мембраны перешла на Ω-профиль слившейся везикулы, но ни краситель, ни ионы H+ в него не проникают, а метка внеклеточного монослоя на него не переходит. Как авторы интерпретируют это состояние?</h3><ol><li><b>А.</b> Широкая пора, через которую выходит содержимое <i>(неверный вариант)</i><br><span class="expl">Через открытую пору малый краситель проник бы в везикулу.</span></li><li><b>Б.</b> Гемислияние: слиты только обращённые друг к другу монослои, поры нет <i>(верный вариант)</i><br><span class="expl">Метка перешла из цитоплазматического монослоя — значит, обращённые к цитоплазме монослои слились; непроницаемость для красителя и H+ и отсутствие метки внеклеточного монослоя показывают, что поры нет. Так гемислияние определяют Wu и Chan (2024).</span></li><li><b>В.</b> Везикула уже полностью распласталась в мембране <i>(неверный вариант)</i><br><span class="expl">Распластанной везикулы как отдельной структуры уже нет; здесь же видна слившаяся, но непроницаемая для красителя структура.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41467-023-44539-7">Wu L.-G., Chan C. Y. Membrane transformations of fusion and budding. Nat Commun. 2024;15:21</a></li></ul><p>Wu, Chan, 2024 — аналитическая статья (рубрика Perspective), обобщающая наблюдения в живых хромаффинных клетках быка; числа — из неё. На схеме гемислияния слиты только обращённые к цитоплазме монослои, а просвет везикулы отделён от внеклеточной среды перегородкой из двух других монослоёв. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-fusion-300ms"><div class="eyebrow">Цикл транспортного носителя · шаг 20 из 45</div><h2>Что происходит с синаптическим пузырьком за первые 300 мс после потенциала действия</h2><p class="lead">Снимки синапсов, замороженных через миллисекунды после потенциала действия, показали: пузырёк проходит гемислияние, открывает пору около 4 нм, сжимается и чаще всего уходит от мембраны, не встраиваясь в неё целиком. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>Число пузырьков в состоянии гемислияния максимально через 4 мс, пузырьков с порой около 4 нм — через 8 мс (Tao et al., 2025). Последовательность восстановлена по снимкам разных синапсов.</li><li>Пузырёк с открытой порой быстро сжимается с 41 до 29 нм — примерно до половины площади; затем пора закрывается, и с 30 мс пузырёк начинает отходить от мембраны; по оценке авторов, такой путь — больше 80 % событий выброса, распластываются немногие.</li><li>Через 100–300 мс (одна группа томограмм) на краю активной зоны появляются эндоцитозные структуры около 80 нм; по предположению авторов, быстрый эндоцитоз забирает мембрану, добавленную немногими распластавшимися пузырьками (Tao et al., 2025); при <a href="#ns-g-S3-T66">тетанотоксине</a>, расщепляющем <a href="#ns-g-S3-T47">синаптобревин</a>, в покое и через 8 мс (так его сравнивали) гемислияния и пор нет.</li></ol><h3>Что уточняет эта работа?</h3><p>Слияние идёт через гемислияние (авторы называют это состояние частично слитым) и пору (БИО-3·14). Работа показывает это в синапсе с разрешением в миллисекунды и добавляет к схеме «выброс через пору с возвратом пузырька» сжатие пузырька: он отдаёт медиатор через пору, сжимается и уходит.</p><h3>Метод</h3><p>Нейроны в культуре несли светочувствительный канал; вспышка света вызывала потенциал действия (все группы — в присутствии CNQX, блокатора возбуждающей передачи), и образец замораживали через заданное время; затем снимали томограммы нервных окончаний. По расчётам авторов, большая часть медиатора выходит через пору около 4 нм примерно за 50 мкс (диффузионный расчёт), а пора открыта не менее примерно 2 мс (нижняя оценка по модели переходов).</p><p>Чего метод не доказывает. Последовательность восстановлена по разным синапсам; точки 4 и 8 мс сняты при более низкой температуре (около 24 и 29 °C), чем остальные (34 °C); это культура, а не ткань мозга; плотности у поры лишь предположительно соответствуют SNARE-комплексам.</p><div class="static-quiz"><h3>Через 30 мс после потенциала действия на томограмме у мембраны виден малый пузырёк около 29 нм с ещё открытой порой. На какой стадии он находится?</h3><ol><li><b>А.</b> Новый пузырёк, только что образованный эндоцитозом <i>(неверный вариант)</i><br><span class="expl">Эндоцитозные структуры в этих синапсах крупнее (около 80 нм) и появляются позже — через 100–300 мс.</span></li><li><b>Б.</b> Малый пузырёк на стадии выброса с ещё открытой порой <i>(верный вариант)</i><br><span class="expl">Пузырёк 41 нм после открытия поры быстро сжимается примерно до 29 нм; на снимках 30 мс есть малые пузырьки и с открытой, и с уже закрытой порой. Закрытие поры и отход пузырька от мембраны — последующие состояния.</span></li><li><b>В.</b> Пузырёк, который ещё не начал слияние <i>(неверный вариант)</i><br><span class="expl">Пузырьки до слияния — около 41 нм и без поры.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.ads7954">Tao C.-L. et al. «Kiss-shrink-run» unifies mechanisms for synaptic vesicle exocytosis and hyperfast recycling. Science. 2025;390(6770):eads7954</a></li></ul><p>Tao et al., 2025: культура нейронов гиппокампа крысы; потенциал действия вызывали светом; замораживание через 4, 8, 30, 70, 100–300 мс (одна группа томограмм); тетанотоксин — в покое и через 8 мс; криоэлектронная томография.</p></details></article><article class="card print-unit" id="ns-early-endosome"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 21 из 45</div><h2>Ранняя эндосома — сортировочный компартмент</h2><p class="lead">После разборки оболочки эндоцитозные везикулы сливаются друг с другом и с уже образованными <a href="#ns-g-S3-T19">ранними эндосомами</a>. Обычно ранняя эндосома около 10 минут принимает новые везикулы, а затем начинает созревать в позднюю. Основная функция ранних эндосом — сортировка и <a href="#ns-g-S3-T23">рециркуляция</a> белков, поступивших путём эндоцитоза. Это вопрос 9 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Ранняя эндосома: рецепторы возвращаются на поверхность, отделившиеся лиганды уходят к поздним эндосомам; связанные лиганды возвращаются с рецептором.</div><ol class="mech"><li>Эндоцитозные везикулы сливаются друг с другом или с уже существующими ранними эндосомами.</li><li>В ранней эндосоме лиганд часто отделяется от рецептора: этому способствует кислая среда.</li><li>В самом частом варианте рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а отделившийся лиганд остаётся в эндосоме, которая созревает в позднюю, и затем попадает в лизосомы; другие варианты зависят от конкретного рецептора и лиганда (следующий шаг).</li><li>Куда направится рецептор, зависит от сигналов сортировки и убиквитинирования.</li></ol><p>Вспомнить БИО-3·10: клатриновая оболочка разбирается до слияния, и в раннюю эндосому поступает неокаймлённый носитель. Дальше ранняя эндосома работает как сортировочная станция: одни белки она возвращает на поверхность, другие направляет к поздним эндосомам и лизосомам.</p><p>Таким образом, путь лиганда и рецептора определяется двумя событиями в ранней эндосоме — отделяется ли лиганд от рецептора (это зависит от того, как связь лиганда с рецептором меняется в кислой среде) и куда отсортирован рецептор. Эти два события и создают пути рецептора и лиганда (следующий шаг).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как доставка, диффузия и эндоцитоз вместе поддерживают домен плазматической мембраны — <a href="https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes">МБ, семинар 2, шаг 25</a>.</p><div class="static-quiz"><h3>Какая основная функция ранней эндосомы?</h3><ol><li><b>А.</b> Расщепление всех поступивших белков <i>(неверный вариант)</i><br><span class="expl">Расщепление идёт в лизосомах; ранняя эндосома многие белки, прежде всего рецепторы, возвращает на поверхность.</span></li><li><b>Б.</b> Образование покрытых клатрином везикул из плазматической мембраны <i>(неверный вариант)</i><br><span class="expl">Покрытые везикулы образуются на плазматической мембране; в раннюю эндосому они приходят уже без оболочки.</span></li><li><b>В.</b> Сортировка и рециркуляция белков, поступивших путём эндоцитоза <i>(верный вариант)</i><br><span class="expl">Из ранней эндосомы рецепторы возвращаются на поверхность, а лиганды уходят к поздним эндосомам.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная.</p></details></article><article class="card print-unit" id="ns-four-routes"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 22 из 45</div><h2>Какими путями расходятся рецептор и лиганд</h2><p class="lead">Лиганд-рецепторный комплекс после эндоцитоза проходит одним из четырёх путей. Различаются они тем, отделяется ли лиганд от рецептора в ранней эндосоме и куда направлен рецептор.</p><div class="note"><strong>Что показывает схема.</strong> Три пути на схеме: рециркуляция рецептора и деградация лиганда; рециркуляция обоих; деградация обоих. Четвёртый путь — трансцитоз — описан в тексте.</div><ol class="mech"><li>Рециркуляция рецептора и деградация лиганда — самый частый путь: комплекс в ранней эндосоме диссоциирует, рецептор возвращается на поверхность, лиганд остаётся в эндосоме, которая созревает в позднюю, и расщепляется в лизосоме.</li><li>Рециркуляция рецептора и лиганда: некоторые лиганды, зачастую белки-переносчики, не отделяются от рецептора в ранних эндосомах; комплекс возвращается и распадается на поверхности.</li><li>Деградация рецептора и лиганда: комплекс, например фактор роста EGF с его рецептором, не диссоциирует; <a href="#ns-g-S3-T26">убиквитинированный</a> рецептор вместе с лигандом включается в мембрану внутрипросветных везикул мультивезикулярного тельца и разрушается в лизосоме.</li><li><a href="#ns-g-S3-T27">Трансцитоз</a>: комплекс димерного IgA с полимерным иммуноглобулиновым рецептором переносится от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом.</li></ol><p>Первые три пути показаны на схеме и в практикуме вопроса 3; трансцитоз требует клетки с двумя разными поверхностями — эпителиальной — и на схеме не показан.</p><p>Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко: клетка переносит IgA через себя, не расщепляя его. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p><p>Таким образом, первые три пути различаются двумя событиями в ранней эндосоме (вспомнить БИО-3·15): отделяется ли лиганд от рецептора и куда отсортирован рецептор — на поверхность или в лизосому. Трансцитоз добавляет третье направление — к противоположной поверхности клетки.</p><div class="static-quiz"><h3>Белок-переносчик остаётся связанным с рецептором в ранней эндосоме, и этот рецептор направляется обратно на ту же поверхность клетки. Куда попадёт белок-переносчик?</h3><ol><li><b>А.</b> Вернётся на поверхность вместе с рецептором <i>(верный вариант)</i><br><span class="expl">Связанный лиганд следует за рецептором: это путь «рециркуляция рецептора и лиганда». Отделится ли белок-переносчик на поверхности, зависит от свойств комплекса; например, апотрансферрин при нейтральном pH отделяется (БИО-3·19).</span></li><li><b>Б.</b> Расщепится в лизосоме, а рецептор вернётся <i>(неверный вариант)</i><br><span class="expl">Так проходит лиганд, который отделяется от рецептора в ранней эндосоме.</span></li><li><b>В.</b> Перенесётся через клетку на противоположную поверхность <i>(неверный вариант)</i><br><span class="expl">Трансцитоз — перенос к противоположной поверхности эпителиальной клетки; в условии рецептор возвращается на ту же поверхность.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная, трансцитоз на ней не показан.</p></details></article><article class="card print-unit" id="ns-recycling-gain"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 23 из 45</div><h2>Зачем рецептору возвращаться на поверхность</h2><p class="lead">Рециркуляция рецептора позволяет клетке постоянно и избирательно захватывать нужное вещество: одна молекула рецептора работает много раз. Если рецептор расщепляется вместе с лигандом или, как при трансцитозе, расщепляется на противоположной поверхности клетки, каждая молекула работает один раз.</p><div class="note"><strong>Что показывает схема.</strong> Возвращающийся рецептор работает много раз; расщепляющийся вместе с лигандом — один раз.</div><ol class="mech"><li>Рецептор связывает лиганд на поверхности и уходит с ним в клетку в покрытой клатрином везикуле.</li><li>В ранней эндосоме лиганд отделяется, и рецептор возвращается на поверхность.</li><li>На поверхности рецептор снова связывает лиганд — цикл повторяется.</li><li>При пути «деградация рецептора и лиганда» рецептор расщепляется в лизосоме и на поверхность не возвращается.</li></ol><p>Полимерный иммуноглобулиновый рецептор переносит димерный IgA от базолатеральной поверхности эпителиальной клетки к апикальной; там рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом. Значит, такая молекула рецептора переносит IgA один раз, и для каждого переноса клетка использует новую молекулу рецептора.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Сколько раз рецептор проходит цикл, измерено для рецептора ЛПНП (БИО-3·20).</p></details><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как ответ клетки ослабевает при длительной стимуляции, в том числе за счёт захвата рецепторов внутрь клетки — <a href="https://fresll.github.io/molbio/seminar-3-route.html#desensitization">МБ, семинар 3, шаг 6</a>.</p><div class="static-quiz"><h3>Сколько молекул IgA может перенести через эпителиальную клетку одна молекула полимерного иммуноглобулинового рецептора?</h3><ol><li><b>А.</b> Много: после выделения IgA рецептор вернётся на базолатеральную поверхность <i>(неверный вариант)</i><br><span class="expl">Возвращаться нечему: внеклеточная часть рецептора отщепляется и выделяется вместе с IgA.</span></li><li><b>Б.</b> Одну: на апикальной мембране рецептор расщепляется, и его часть уходит в секрет вместе с IgA <i>(верный вариант)</i><br><span class="expl">IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом.</span></li><li><b>В.</b> Ни одной: комплекс расщепится в лизосоме <i>(неверный вариант)</i><br><span class="expl">Комплекс IgA с рецептором переносится через эндосомы к апикальной мембране, а не в лизосому.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Модель не учитывает синтез новых рецепторов. Схема качественная.</p></details></article><article class="card print-unit" id="ns-late-endosome"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 24 из 45</div><h2>Как ранняя эндосома становится поздней и что попадает в лизосому</h2><p class="lead">По мере созревания ранних эндосом их внутренняя среда становится более кислой, а сами эндосомы уходят глубже в цитоплазму и становятся <a href="#ns-g-S3-T24">поздними</a>. Мембрана созревающей эндосомы впячивается в её просвет и образует внутрипросветные везикулы — так возникает <a href="#ns-g-S3-T25">мультивезикулярное тельце</a>. Поздняя эндосома сливается с лизосомой, и содержимое расщепляется.</p><div class="note"><strong>Что показывает схема.</strong> Ранняя эндосома → поздняя эндосома (мультивезикулярное тельце) → лизосома: среда кислее, положение глубже, содержимое расщепляется.</div><ol class="mech"><li>Ранняя эндосома закисляется и перемещается глубже в цитоплазму.</li><li>Эндосома меняет Rab-белки, липиды, кислотность и положение в клетке; метка ранней эндосомы — Rab5, поздней — Rab7.</li><li>Мембрана поздней эндосомы впячивается в её просвет — образуются внутрипросветные везикулы мультивезикулярного тельца.</li><li>Мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется; некоторые сливаются с плазматической мембраной, и их внутрипросветные везикулы выходят наружу как экзосомы.</li></ol><p>Лизосомы содержат гидролитические ферменты — протеазы, нуклеазы, гликозидазы, липазы и фосфолипазы — и расщепляют макромолекулы, поступившие путём эндоцитоза. Поэтому белок, который не вернулся из ранней эндосомы, обычно оказывается в лизосоме и расщепляется.</p><p>Убиквитинированные рецепторы включаются в мембрану внутрипросветных везикул и вместе с ними попадают в просвет лизосомы. Значит, включение в мембрану внутрипросветных везикул отделяет мембранный белок от ограничивающей мембраны эндосомы, с которой он мог бы вернуться на поверхность.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Как именно ранняя эндосома становится поздней — смена Rab5 на Rab7, — показано в живых клетках (БИО-3·21).</p></details><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как меняется метка мембраны при созревании эндосомы — <a href="https://fresll.github.io/molbio/seminar-1-route.html#conversion">МБ, семинар 1, шаг 16</a>; почему для закисления лизосомы нужен насос — <a href="https://fresll.github.io/molbio/seminar-1-route.html#pumps-channels">МБ, семинар 1, шаг 3</a>.</p><div class="static-quiz"><h3>Что происходит с ранней эндосомой по мере созревания?</h3><ol><li><b>А.</b> Она сливается с плазматической мембраной и исчезает <i>(неверный вариант)</i><br><span class="expl">С плазматической мембраной могут сливаться мультивезикулярные тельца, но созревание ранней эндосомы ведёт к поздней эндосоме.</span></li><li><b>Б.</b> Её среда становится нейтральной, и рецепторы отделяются от лигандов <i>(неверный вариант)</i><br><span class="expl">Наоборот: при созревании среда эндосомы становится кислее.</span></li><li><b>В.</b> Её среда становится кислее, и она уходит глубже в цитоплазму, становясь поздней <i>(верный вариант)</i><br><span class="expl">Так идёт созревание эндосомы; при этом метка Rab5 на её мембране сменяется Rab7.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Значения pH в шаге не используются. Схема качественная.</p></details></article><article class="card print-unit" id="ns-acid-release"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 25 из 45</div><h2>Почему трансферрин возвращается на поверхность без железа</h2><p class="lead"><a href="#ns-g-S3-T28">Трансферрин</a> — пример белка-переносчика, который не отделяется от рецептора в ранней эндосоме. Эксперимент с изменением pH показал, что кислая среда отделяет от него не рецептор, а железо. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Трансферрин с железом на рецепторе → в кислой эндосоме железо отделяется → апотрансферрин с рецептором возвращается → на поверхности апотрансферрин отделяется.</div><ol class="mech"><li>Трансферрин с железом связывается с рецептором на поверхности при нейтральном pH, и комплекс уходит в клетку (Dautry-Varsat et al., 1983).</li><li>В кислой среде эндосомы (pH 5,5 и ниже) железо отделяется от трансферрина; трансферрин без железа — апотрансферрин — остаётся на рецепторе: при pH 5,4 он связывается так же прочно, как трансферрин с железом при pH 7,0.</li><li>Комплекс апотрансферрина с рецептором возвращается на поверхность; при нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C, а трансферрин с железом — 7,5 мин (примерно в 28 раз медленнее; по сводной оценке авторов для двух температур — в 30–40 раз). Железо остаётся в клетке.</li></ol><h3>Что уточняет эта работа?</h3><p>Путь «рециркуляция рецептора и лиганда» описывают для белков-переносчиков (БИО-3·16); эксперимент показывает, как такой путь возникает: связь лиганда с рецептором зависит от pH по-разному для формы с железом и без него. В кислой среде железо отделяется, но связь трансферрина с рецептором сохраняется: трансферрин, связанный при нейтральном pH, не отделялся при обработке растворами с pH от 4,5 до 7,5 (4 °C, с хелатором железа; сходный результат — при 37 °C). Для сравнения, асиалоорозомукоид и инсулин при кислом pH от своих рецепторов отделялись.</p><h3>Метод</h3><p>Клетки гепатомы человека HepG2. Меченый трансферрин (125I — белок, 59Fe — железо) связывали с рецепторами при 4 °C, когда интернализации нет, затем меняли pH среды и измеряли, что остаётся на клетках. Чтобы при 37 °C трансферрин не уходил в клетку, добавляли ингибиторы энергетического обмена (цианид и 2-дезоксиглюкозу); освободившееся железо связывал хелатор десферриоксамин.</p><p>Контроль: трансферрин с железом при нейтральном pH; другие лиганды (асиалоорозомукоид, инсулин) в тех же условиях. Ограничение: эксперименты на поверхности клеток моделируют среду эндосомы, но не воспроизводят саму эндосому.</p><p>Чего данные не доказывают. Работа объясняет, почему трансферрин и рецептор возвращаются вместе, но не показывает, по какому пути комплекс выходит из эндосомы и где именно освобождается железо внутри клетки.</p><div class="static-quiz"><h3>Апотрансферрин связан с рецептором в эндосоме при pH 5,4. Комплекс вернулся на поверхность клетки с нейтральным pH. Что произойдёт?</h3><ol><li><b>А.</b> Апотрансферрин быстро отделится, рецептор освободится <i>(верный вариант)</i><br><span class="expl">При нейтральном pH апотрансферрин отделяется с полупериодом 16 с при 37 °C (Dautry-Varsat et al., 1983).</span></li><li><b>Б.</b> Апотрансферрин останется на рецепторе до следующего эндоцитоза <i>(неверный вариант)</i><br><span class="expl">При нейтральном pH апотрансферрин удерживается на рецепторе слабо и отделяется за секунды.</span></li><li><b>В.</b> Апотрансферрин свяжет железо прямо на рецепторе и уйдёт в клетку снова <i>(неверный вариант)</i><br><span class="expl">Железо апотрансферрин связывает в среде, уже отделившись; на рецептор возвращается трансферрин с железом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.80.8.2258">Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262</a></li></ul><p>Dautry-Varsat et al., 1983: клетки HepG2; полупериоды при 37 °C — 16 с (апотрансферрин) и 7,5 мин (трансферрин с железом) при нейтральном pH; освобождение железа при pH 5 — около 1,5 мин. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-tf-two-cycles"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 26 из 45</div><h2>Вошли вместе — уходят порознь: железо, трансферрин и рецептор за два цикла</h2><p class="lead">Вспомнить: шаг «Какими путями расходятся рецептор и лиганд» — в ранней эндосоме определяется, вернётся ли рецептор и куда пойдёт лиганд. Трансферрин показывает, что у компонентов, вошедших вместе, может быть три разных пути. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Возврат работает — рецептор с трансферрином без железа возвращается; нарушен — рецепторов на поверхности к следующему циклу меньше.</div><ol class="mech"><li>Трансферрин с железом связывается с рецептором на поверхности, комплекс поступает в раннюю эндосому.</li><li>В слабокислой среде ранней эндосомы железо отделяется от трансферрина и остаётся в клетке (в эксперименте на клетках гепатомы человека железо уходило с трансферрина, связанного с рецептором, при pH 5 в присутствии вещества, связывающего железо).</li><li>Трансферрин без железа остаётся на рецепторе и вместе с ним возвращается на поверхность.</li><li>При нейтральном pH внеклеточной среды он отделяется; свободный рецептор связывает новый трансферрин.</li></ol><p>Три компонента, вошедшие вместе, уходят порознь: железо остаётся в клетке, трансферрин и рецептор возвращаются. Поэтому одна молекула рецептора участвует во многих циклах, и захват железа зависит от того, сколько рецепторов возвращается на поверхность.</p><p>Если возврат рецептора нарушен, первый цикл проходит как обычно, но к следующему рецепторов на поверхности меньше: захват трансферрина и доставка железа снижаются. Если ослаблена кислотность эндосомы, в модели железо не отделяется: трансферрин с железом возвращается на поверхность связанным с рецептором, и рецепторы заняты.</p><h3>Обратная задача</h3><p>Через некоторое время на поверхности стало меньше рецепторов. Возможны два объяснения: нарушен возврат — или рецепторы стали быстрее уходить внутрь. Число рецепторов на поверхности — баланс этих двух потоков, поэтому одно наблюдение их не различает. Различает отдельное измерение: пометить рецепторы, уже ушедшие внутрь, и проследить, возвращаются ли они с обычной скоростью.</p><h3>Граница вывода</h3><p>Кислотность — не единственный фактор отделения железа в клетке, а переход железа из эндосомы в цитоплазму требует отдельных переносчиков. Свойства трансферрина нельзя переносить на любой рецептор: у ЛПНП кислая среда, наоборот, отделяет лиганд от рецептора.</p><p>Сверх программы и в эту модель не входят сортировочные комплексы эндосомы, сигналы возврата в хвосте рецептора и смена Rab5 на Rab7 — шаги «Как мембранный белок избегает лизосомы: сигнал возврата и SNX27–ретромер» и «Как ранняя эндосома становится поздней: смена Rab5 на Rab7».</p><div class="static-quiz"><h3>Первый цикл захвата трансферрина прошёл как обычно, затем возврат рецептора на поверхность нарушен. Что изменится при следующем цикле?</h3><ol><li><b>А.</b> Рецепторов на поверхности станет меньше, и железа клетка получит меньше <i>(верный вариант)</i><br><span class="expl">Каждая молекула рецептора работает много раз, только если возвращается; без возврата к следующему циклу рецепторов на поверхности меньше.</span></li><li><b>Б.</b> Ничего: трансферрин вернётся на поверхность и без рецептора <i>(неверный вариант)</i><br><span class="expl">Трансферрин возвращается связанным с рецептором; без возврата рецептора он тоже остаётся внутри.</span></li><li><b>В.</b> Захват усилится за счёт рецепторов, оставшихся в эндосомах <i>(неверный вариант)</i><br><span class="expl">Новый трансферрин связывается с рецепторами на поверхности, а не в эндосомах.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.80.8.2258">Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262</a></li><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Клетки человека; правила связывания — по измерениям на клетках гепатомы HepG2 и учебнику Alberts et al., 2022. Модель качественная.</p></details></article><article class="card print-unit" id="ns-ph-three-pairs"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 27 из 45</div><h2>Почему кислая среда эндосомы одни лиганды отделяет, а другие присоединяет</h2><p class="lead">Кислая среда эндосомы — общее условие для всех пар «рецептор — лиганд», но исход у них разный: <a href="#ns-g-S3-T48">ЛПНП</a> отделяется, трансферрин теряет железо и остаётся на рецепторе, а <a href="#ns-g-S3-T50">IgG</a>, наоборот, связывается с рецептором <a href="#ns-g-S3-T51">FcRn</a> и благодаря этому возвращается. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li><a href="#ns-g-S3-T52">pH эндосом</a> при созревании снижается: в клетках HeLa — в среднем от 6,6 до прихода Rab5 до 5,7 в Rab7-положительных эндосомах (Podinovskaia et al., 2021); диапазон pH 5–6 — это условие связывания FcRn с IgG, а не pH ранней эндосомы.</li><li>FcRn связывает Fc-участок IgG при pH 5–6 и не связывает при pH 7,4: IgG, захваченный при пиноцитозе, связывается с FcRn в эндосоме, возвращается и освобождается на поверхности; несвязанный IgG уходит в лизосомы (Pyzik et al., 2023).</li><li>По обзору, ниже pH 6,5 ЛПНП отделяется от рецептора и уходит в лизосому (Brown, Goldstein, 1986); трансферрин при pH около 5 теряет железо (в присутствии хелатора), а апотрансферрин остаётся на рецепторе и отделяется при pH 7,4 (Dautry-Varsat et al., 1983).</li></ol><p>Что уточняет этот шаг. В кислой эндосоме многие лиганды отделяются от рецепторов (БИО-3·15). FcRn показывает обратную зависимость: кислая среда создаёт комплекс, а нейтральная его разрушает. Поэтому IgG в крови живёт долго: молекулы, связанные с FcRn, спасаются от лизосом. Препараты, занимающие FcRn, ускоряют расщепление IgG, в том числе аутоантител (клинический пример приводится для демонстрации патофизиологического значения клеточного механизма).</p><h3>Метод</h3><p>pH эндосом измеряли датчиком из двух флуоресцентных белков, отношение свечения которых зависит от pH, с калибровкой в средах известного pH. Связывание рецепторов с лигандами при разном pH измеряют отдельно, на клетках или очищенных белках.</p><p>Чего метод не доказывает. Пары изучены в разных клетках и разными методами; для ЛПНП порог отделения взят из обзора; между измеренными значениями pH поведение пар не определено. Увеличенные эндосомы, в которых измеряли pH, — модельная система.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как меняется метка мембраны при созревании эндосомы — <a href="https://fresll.github.io/molbio/seminar-1-route.html#conversion">МБ, семинар 1, шаг 16</a>.</p><div class="static-quiz"><h3>У мутантного FcRn связывание с IgG не зависит от pH: прочное и при 7,4; путь возврата рецептора на поверхность сохранён. Что станет с IgG, захваченным клеткой?</h3><ol><li><b>А.</b> Он уйдёт в лизосому <i>(неверный вариант)</i><br><span class="expl">В модели в лизосому уходит несвязанный IgG; здесь связывание есть и в эндосоме.</span></li><li><b>Б.</b> Ничего не изменится <i>(неверный вариант)</i><br><span class="expl">Изменится: освобождение IgG на поверхности зависит от слабого связывания при pH 7,4.</span></li><li><b>В.</b> Он будет возвращаться на поверхность, но там не освободится, а останется на рецепторе <i>(верный вариант)</i><br><span class="expl">Освобождение IgG на поверхности обеспечивает потеря связывания при pH 7,4; без неё IgG остаётся связанным; это вывод из механизма.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41577-022-00821-1">Pyzik M., Kozicky L. K., Gandhi A. K., Blumberg R. S. The therapeutic age of the neonatal Fc receptor. Nat Rev Immunol. 2023;23:415–432</a></li><li><a href="https://doi.org/10.7554/eLife.70982">Podinovskaia M., Prescianotto-Baschong C., Buser D. P., Spang A. A novel live-cell imaging assay reveals regulation of endosome maturation. eLife. 2021;10:e70982</a></li><li><a href="https://doi.org/10.1126/science.3513311">Brown M. S., Goldstein J. L. A receptor-mediated pathway for cholesterol homeostasis. Science. 1986;232:34–47</a></li><li><a href="https://doi.org/10.1073/pnas.80.8.2258">Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262</a></li></ul><p>Podinovskaia et al., 2021: клетки HeLa, увеличенные эндосомы, флуоресцентный датчик pH. Pyzik et al., 2023: обзор. Brown, Goldstein, 1986; Dautry-Varsat et al., 1983 — см. БИО-3·19, 3·20.</p></details></article><article class="card print-unit" id="ns-ldl-cycle"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 28 из 45</div><h2>Сколько раз рецептор ЛПНП проходит цикл и что нужно ему для захвата</h2><p class="lead">Рецептор липопротеинов низкой плотности (ЛПНП) — классический пример пути «рециркуляция рецептора, деградация лиганда»: ЛПНП расщепляется в лизосоме, а рецептор возвращается на поверхность (Brown, Goldstein, 1986). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Норма: рецепторы с ЛПНП в покрытой клатрином ямке. Мутант по цитоплазматическому участку: ЛПНП связан, но рецепторы вне ямки.</div><ol class="mech"><li>Рецепторы ЛПНП собираются в покрытых клатрином ямках; ямки впячиваются за 3–5 мин после образования, клатриновая оболочка быстро снимается (Brown, Goldstein, 1986).</li><li>Эндосомы закисляются ниже pH 6,5 протонными насосами, и ЛПНП отделяется от рецептора; рецептор возвращается на поверхность.</li><li>ЛПНП попадает в лизосому: белок расщепляется до аминокислот, эфиры холестерина — кислой липазой; в клетке освобождается холестерин.</li><li>Каждый рецептор совершает один полный цикл примерно за 10 мин — независимо от того, связан ли он с ЛПНП.</li></ol><p>Время жизни рецептора — около 20 ч; авторы пишут о нескольких сотнях циклов за это время. По расчёту из приведённых чисел получается порядка сотни циклов (20 ч по 10 мин — около 120); в любом случае одна молекула рецептора захватывает ЛПНП многократно.</p><p>Мутации цитоплазматического участка рецептора (впервые описаны у пациента, обозначенного в работах как J.D.) не мешают связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь клетки. Значит, для сбора в ямке нужен цитоплазматический участок рецептора; именно цитозольные участки рецепторов связывают адаптерные белки (вспомнить БИО-3·2).</p><h3>Метод</h3><p>Культура фибробластов кожи человека, в том числе от пациентов с семейной гиперхолестеринемией. ЛПНП метили 125I и различали ЛПНП, связанный с поверхностью, ушедший в клетку и расщеплённый (по выходу 125I-монойодтирозина в среду). Контроль — фибробласты здоровых людей. Ограничение: числа цикла получены в культуре клеток. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p><p>Чего данные не доказывают. Обзор обобщает работы многих лет; механизм возврата рецептора из эндосомы в нём описан как модель, без молекул, которые этот возврат обеспечивают.</p><div class="static-quiz"><h3>У рецептора ЛПНП изменён цитоплазматический участок; ЛПНП он связывает нормально. Что произойдёт с захватом ЛПНП?</h3><ol><li><b>А.</b> Рецептор перестанет связывать ЛПНП <i>(неверный вариант)</i><br><span class="expl">ЛПНП связывается наружным участком рецептора; изменён цитоплазматический.</span></li><li><b>Б.</b> Рецептор не соберётся в ямках, и ЛПНП останется на поверхности <i>(верный вариант)</i><br><span class="expl">Мутации цитоплазматического участка не мешают связыванию, но рецептор не собирается в покрытых клатрином ямках и не уходит внутрь (Brown, Goldstein, 1986).</span></li><li><b>В.</b> Захват не изменится: ямки соберутся вокруг ЛПНП <i>(неверный вариант)</i><br><span class="expl">Ямка собирается через адаптеры, связывающие цитоплазматический участок рецептора; ЛПНП снаружи сбор в ямке не обеспечивает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.3513311">Brown M. S., Goldstein J. L. A receptor-mediated pathway for cholesterol homeostasis. Science. 1986;232:34–47</a></li></ul><p>Brown, Goldstein, 1986 — обзор собственных работ авторов (Science, 1986). Числа — из неё; число циклов около 120 — расчёт по этим числам. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-pcsk9-dose"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 29 из 45</div><h2>Как белок PCSK9 сокращает число циклов рецептора ЛПНП</h2><p class="lead"><a href="#ns-g-S3-T69">PCSK9</a> связывает <a href="#ns-g-S3-T49">рецептор ЛПНП</a> в печени и направляет его в лизосомы, мешая возврату на поверхность; на фоне <a href="#ns-g-S3-T70">ингибитора</a> PCSK9 холестерин ЛПНП (ХС-ЛПНП) в крови снижается: разность его изменения относительно плацебо растёт с дозой, а при 18 и 30 мг точечные оценки близки, но данных для вывода о плато недостаточно (по механизму, снижение — следствие сохранения рецепторов). Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>Рецептор ЛПНП совершает много циклов «эндоцитоз — возврат» (БИО-3·20); PCSK9 связывает рецепторы ЛПНП в печени и направляет их в лизосомы, мешая их возврату на поверхность клетки (Ballantyne et al., 2023). Поэтому у такого рецептора остаётся меньше циклов.</li><li>Пероральный ингибитор MK-0616 связывает PCSK9; за 8 недель разность изменений ХС-ЛПНП от исходного уровня (группа дозы минус плацебо) составила −41,2 процентного пункта (6 мг; 95 % ДИ −47,8…−34,7), −55,7 (12 мг; −62,3…−49,1), −59,1 (18 мг; −65,7…−52,5) и −60,9 (30 мг; −67,6…−54,3).</li><li>По механизму, снижение ХС-ЛПНП — следствие того, что на поверхности клеток печени остаётся больше рецепторов; число рецепторов у участников не измеряли.</li></ol><p>Что уточняет этот шаг. Захват ЛПНП зависит не только от числа рецепторов, но и от того, сколько раз каждый рецептор возвращается. PCSK9 отключает возврат для связанных рецепторов. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p><h3>Метод</h3><p>Рандомизированное двойное слепое испытание фазы 2b: 381 взрослый с гиперхолестеринемией, пять групп (плацебо и четыре дозы), 8 недель; показатель — процентное изменение ХС-ЛПНП от исходного уровня к 8-й неделе; сравнивают разность скорректированных средних (метод наименьших квадратов) между группой дозы и плацебо, в процентных пунктах.</p><p>Чего метод не доказывает. ХС-ЛПНП — суррогатный показатель; влияние на частоту сердечно-сосудистых событий за 8 недель оценить нельзя; механизм в клетках участников не измеряли.</p><div class="static-quiz"><h3>Что именно измеряли в испытании ингибитора PCSK9, чтобы оценить его действие?</h3><ol><li><b>А.</b> Число рецепторов ЛПНП на клетках печени <i>(неверный вариант)</i><br><span class="expl">Рецепторы у участников не измеряли; их сохранение — вывод из механизма.</span></li><li><b>Б.</b> Разность изменений ХС-ЛПНП к 8-й неделе между группами <i>(верный вариант)</i><br><span class="expl">Это суррогатный показатель: число рецепторов ЛПНП в печени и исходы болезни в этой работе не измеряли.</span></li><li><b>В.</b> Частоту инфарктов за 8 недель <i>(неверный вариант)</i><br><span class="expl">За 8 недель исходы болезни оценить нельзя; оценивали ХС-ЛПНП и нежелательные явления.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.jacc.2023.02.018">Ballantyne C. M. et al. Phase 2b randomized trial of the oral PCSK9 inhibitor MK-0616. J Am Coll Cardiol. 2023;81(16):1553–1564</a></li><li><a href="https://doi.org/10.1126/science.3513311">Brown M. S., Goldstein J. L. A receptor-mediated pathway for cholesterol homeostasis. Science. 1986;232:34–47</a></li></ul><p>Ballantyne et al., 2023: фаза 2b, 381 участник; MK-0616 6–30 мг один раз в день, 8 недель.</p></details></article><article class="card print-unit" id="ns-rab-conversion"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 30 из 45</div><h2>Как ранняя эндосома становится поздней: смена Rab5 на Rab7</h2><p class="lead">Ранняя эндосома не отпочковывает позднюю: на её мембране метка <a href="#ns-g-S3-T29">Rab5</a> быстро сменяется меткой Rab7, и эндосома становится поздней (Rink et al., 2005). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Rab5 (ранняя эндосома, периферия) → смена Rab5 на Rab7 → Rab7 (поздняя эндосома, центр); без hVps39 смена растягивается до часов.</div><ol class="mech"><li>Ранние эндосомы с Rab5 сливаются друг с другом до двух раз в минуту; груз, предназначенный для расщепления (ЛПНП), собирается во всё меньшем числе всё более крупных эндосом (Rink et al., 2005).</li><li>Крупные эндосомы перемещаются от периферии к центру клетки, и там Rab5 на их мембране быстро сменяется Rab7.</li><li>Для смены нужен комплекс HOPS (англ. homotypic fusion and protein sorting; белки класса C VPS — англ. vacuolar protein sorting), который связывается с Rab5; авторы, опираясь на данные того времени, считали HOPS фактором обмена нуклеотидов для Rab7. При подавлении его субъединицы hVps39 увеличиваются и ранние, и поздние эндосомы, а смена Rab5 на Rab7 растягивается с минут до часов.</li></ol><h3>Что уточняет эта работа?</h3><p>Ранняя эндосома созревает в позднюю, и метка Rab5 сменяется Rab7 (БИО-3·18). Эксперимент показывает, что созревание идёт сменой метки на той же мембране, а не переносом груза в новый компартмент.</p><p>ЛПНП в контроле покидал ранние эндосомы с полупериодом около 11 мин; при подавлении hVps39 он оставался в ранних эндосомах, несущих белок EEA1 (англ. early endosome antigen 1), до 4 ч.</p><h3>Метод</h3><p>Живые клетки A431 (линия клеток эпидермоидной карциномы человека) с флуоресцентными Rab5 и Rab7; снимки каждые несколько секунд и алгоритмы, которые прослеживают отдельные эндосомы. Груз — флуоресцентный ЛПНП. Подавление hVps39 — малыми интерферирующими РНК в тех же клетках; белки, связывающие Rab5, в том числе HOPS, выделяли из цитозоля клеток HeLa на колонке с Rab5.</p><p>Контроль: клетки с контрольной РНК. Ограничение: избыточный синтез меченых Rab может менять их количество на мембране. Чего данные не доказывают: смена Rab показана для грузов, идущих на расщепление; для рецепторов, возвращающихся на поверхность, механизм выхода иной.</p><div class="static-quiz"><h3>В клетках подавили hVps39 — субъединицу комплекса HOPS, нужного для смены Rab5 на Rab7. Что произойдёт с ЛПНП после эндоцитоза?</h3><ol><li><b>А.</b> ЛПНП сразу попадёт в лизосомы, минуя ранние эндосомы <i>(неверный вариант)</i><br><span class="expl">Без HOPS ранние эндосомы не превращаются в поздние, поэтому груз, наоборот, задерживается в ранних.</span></li><li><b>Б.</b> ЛПНП вернётся на поверхность вместе с рецептором <i>(неверный вариант)</i><br><span class="expl">ЛПНП отделяется от рецептора и задерживается в ранних эндосомах; на поверхность возвращается рецептор.</span></li><li><b>В.</b> ЛПНП надолго задержится в ранних эндосомах <i>(верный вариант)</i><br><span class="expl">Смена растягивается с минут до часов, и ЛПНП остаётся в EEA1-положительных эндосомах до 4 ч (Rink et al., 2005).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2005.06.043">Rink J., Ghigo E., Kalaidzidis Y., Zerial M. Rab conversion as a mechanism of progression from early to late endosomes. Cell. 2005;122:735–749</a></li></ul><p>Rink et al., 2005: съёмка живых клеток A431; цитозоль для колонки с Rab5 — из клеток HeLa; полупериод выхода ЛПНП — 10,9 мин в контроле. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-retrieval-signal"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 31 из 45</div><h2>Как мембранный белок избегает лизосомы: сигнал возврата и SNX27–ретромер</h2><p class="lead">GLUT1 постоянно попадает с поверхности в ранние эндосомы. Чтобы переносчик глюкозы оставался на поверхности, клетка должна вернуть его, а не направить на расщепление. Как эндосома узнаёт этот груз? Для GLUT1 нужен короткий концевой участок — PDZ-лиганд, который связывает PDZ-домен (белковый домен, названный по белкам PSD-95, Dlg и ZO-1), — и комплекс <a href="#ns-g-S3-T30">SNX27–ретромер</a>: сортирующий нексин 27 (SNX27) вместе с ретромером — комплексом белков, возвращающим мембранные белки из эндосом (Steinberg et al., 2013). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Контроль: GLUT1 на мембране. Без SNX27, без VPS35 или без концевого участка GLUT1 — в лизосомах.</div><ol class="mech"><li>SNX27 своим PDZ-доменом связывает концевой участок груза и одновременно — субъединицу ретромера VPS26 (VPS26 и VPS35 — субъединицы ретромера); это связывание необходимо и достаточно, чтобы груз не попал в лизосомы (Steinberg et al., 2013).</li><li>При подавлении SNX27 с поверхности клеток HeLa уходят 122 мембранных белка, при подавлении VPS35 — 152; 81 из них общий.</li><li>Без SNX27 или VPS35 GLUT1 оказывается в лизосомах и расщепляется быстрее; захват глюкозы снижается более чем на 60 %. GLUT1 без трёх концевых аминокислот уходит в лизосомы и в контрольных клетках.</li></ol><h3>Что уточняет эта работа?</h3><p>Рецептор возвращается на поверхность в везикулах, отпочковывающихся от ранней эндосомы, а выбор пути зависит от сигналов сортировки (БИО-3·15). Эксперимент показывает один такой сигнал и белки, которые его узнают: без них белок уходит в лизосому, хотя сам не изменён.</p><p>При подавлении VPS35 рецептора трансферрина на поверхности было в 1,5 раза меньше (при подавлении SNX27 — без изменений), и он не расщеплялся быстрее: разные грузы возвращаются разными путями.</p><h3>Метод</h3><p>Клетки HeLa и RPE1 (линия клеток пигментного эпителия сетчатки человека); SNX27 и VPS35 подавляли малыми интерферирующими РНК. Белки поверхности метили биотином и сравнивали количественной масс-спектрометрией с мечением белков аминокислотами, содержащими тяжёлые изотопы (SILAC); положение GLUT1 определяли иммунофлуоресценцией с маркером лизосом — белком мембраны лизосом LAMP1 (англ. lysosome-associated membrane protein 1); захват глюкозы — по меченой 2-дезоксиглюкозе.</p><p>Контроль: клетки с контрольной РНК; две разные РНК против каждого белка — против неспецифического действия. Чего данные не доказывают: как именно SNX27–ретромер не пускает груз в лизосомный путь, работа не устанавливает; сочетание подавления SNX27 и укороченного GLUT1 не изучали.</p><div class="static-quiz"><h3>В обычных клетках синтезируется GLUT1 без трёх концевых аминокислот. Где он окажется?</h3><ol><li><b>А.</b> В лизосомах: без концевого участка его не узнаёт SNX27 <i>(верный вариант)</i><br><span class="expl">GLUT1 без PDZ-лиганда оказывается в LAMP1-положительных лизосомах, тогда как полный GLUT1 остаётся на мембране (Steinberg et al., 2013).</span></li><li><b>Б.</b> На плазматической мембране, как полный GLUT1 <i>(неверный вариант)</i><br><span class="expl">Концевой участок нужен для возврата из ранней эндосомы; без него белок уходит в лизосомы.</span></li><li><b>В.</b> В ранних эндосомах, где он будет накапливаться <i>(неверный вариант)</i><br><span class="expl">Без сигнала возврата GLUT1 не задерживается в ранних эндосомах, а уходит в лизосомы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb2721">Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471</a></li></ul><p>Steinberg et al., 2013: клетки HeLa и RPE1; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-tail-address"><div class="eyebrow">Рецептор и лиганд после эндоцитоза · шаг 32 из 45</div><h2>От чего зависит, каким комплексом рецептор вернётся из эндосомы</h2><p class="lead">Разные мембранные белки возвращаются из эндосомы разными белковыми комплексами, и путь определяет мотив в цитоплазматическом хвосте: концевой PDZ-связывающий мотив узнаёт SNX27, мотив NPxY — <a href="#ns-g-S3-T54">SNX17</a>; оба передают груз в общий трубчатый участок возврата эндосомы. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>FERM-домен SNX27 прямо связывает кислые мотивы белков SNX1 и SNX2 комплекса <a href="#ns-g-S3-T56">ESCPE-1</a>, и груз, захваченный SNX27–ретромером, переходит в трубчатый носитель (Simonetti et al., 2022).</li><li>В свободном SNX17 C-концевой участок лежит в бороздке связывания груза; груз с мотивом NPxY вытесняет его, и освобождённый участок концевым мотивом связывает ретривер (Butkovič et al., 2024).</li><li>Ретривер вместе с комплексом CCC и белком DENND10 образует <a href="#ns-g-S3-T55">Commander</a> — комплекс из 16 субъединиц; мутации его генов вызывают синдром Ритшера–Шинцеля (Healy et al., 2023).</li></ol><p>Что уточняет этот шаг. Сигнал возврата — участок хвоста, который узнаёт белок на эндосоме (БИО-3·22, SNX27 и GLUT1). Сигналов по меньшей мере два, и каждому соответствует свой комплекс: SNX27–ретромер или SNX17–Commander. В экспериментах эти комплексы не заменяли друг друга.</p><h3>Метод</h3><p>Взаимодействия проверяли на очищенных белках (калориметрия, осаждение на гранулах) и в клетках человека (в части экспериментов — с удалёнными генами); строение комплексов — криоэлектронной микроскопией и предсказанием структуры. Функциональный контроль: ретривер с заменой в участке связывания SNX17 собирается нормально, но интегрин α5β1 — груз с мотивом NPxY, как и LRP1, — в таких клетках уходит в лизосомы (Butkovič et al., 2024). В клетках без SNX27 интегрин α5 служил контролем возврата, не зависящего от SNX27 (Simonetti et al., 2022).</p><p>Чего метод не доказывает. Как делится груз с обоими мотивами и какая доля груза идёт каждым путём в обычной клетке, неизвестно.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как меняется метка мембраны при созревании эндосомы — <a href="https://fresll.github.io/molbio/seminar-1-route.html#conversion">МБ, семинар 1, шаг 16</a>.</p><div class="static-quiz"><h3>В SNX17 заменили аминокислоты C-концевого участка так, что он больше не ложится в бороздку связывания груза. Как изменится связывание груза LRP1?</h3><ol><li><b>А.</b> Усилится: бороздка свободна, и груз связывается легче <i>(верный вариант)</i><br><span class="expl">Мутанты с ослабленным внутримолекулярным связыванием связывали LRP1, LRP2 и APP сильнее, чем обычный SNX17.</span></li><li><b>Б.</b> Ослабнет <i>(неверный вариант)</i><br><span class="expl">Ослабляют связывание груза замены в самой бороздке FERM-домена, а не в C-концевом участке.</span></li><li><b>В.</b> Не изменится <i>(неверный вариант)</i><br><span class="expl">Изменится: C-концевой участок конкурирует с грузом за бороздку.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41467-024-50971-0">Butkovič R. et al. Mechanism and regulation of cargo entry into the Commander endosomal recycling pathway. Nat Commun. 2024;15:7180</a></li><li><a href="https://doi.org/10.1371/journal.pbio.3001601">Simonetti B. et al. SNX27–Retromer directly binds ESCPE-1 to transfer cargo proteins during endosomal recycling. PLoS Biol. 2022;20:e3001601</a></li><li><a href="https://doi.org/10.1016/j.cell.2023.04.003">Healy M. D. et al. Structure of the endosomal Commander complex linked to Ritscher–Schinzel syndrome. Cell. 2023;186:2219–2237.e29</a></li><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Butkovič et al., 2024: клетки HEK293T и RPE1, очищенные белки, предсказание структуры. Simonetti et al., 2022: клетки HeLa. Healy et al., 2023: криоэлектронная микроскопия.</p></details></article><article class="card print-unit" id="ns-envelope-pore"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 33 из 45</div><h2>Как устроены ядерная оболочка и ядерная пора</h2><p class="lead"><a href="#ns-g-S3-T31">Ядерная оболочка</a> — две мембраны; наружная продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами. В каждой поре находится <a href="#ns-g-S3-T32">комплекс ядерной поры</a>: через него идёт транспорт белков, рибонуклеопротеинов и РНК между ядром и цитоплазмой. Это вопрос 18 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Малая молекула — по обе стороны оболочки; крупный белок без сигнала в ядре не накапливается.</div><ol class="mech"><li>Комплекс ядерной поры построен примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; каркас комплекса имеет восьмикратную симметрию: восемь повторяющихся секторов между цитоплазматическим и нуклеоплазматическим кольцами.</li><li>Из цитоплазматического кольца в цитоплазму выступают восемь фибрилл; нуклеоплазматическое кольцо закрепляет ядерную корзину.</li><li>Ионы и небольшие молекулы (до ~5 кДа) проходят через каналы поры простой диффузией практически свободно; более крупные диффундируют тем медленнее, чем они больше. Резкой границы размера нет.</li><li>Белки с FG-повторами (повторами фенилаланин–глицин) создают в поре селективный барьер; крупные макромолекулы быстро проходят его только с транспортными рецепторами.</li></ol><p>Через пору проходят потоки в обе стороны: мРНК и рибосомные субъединицы выходят в цитоплазму, а ядерные белки — гистоны, ламины — синтезируются в цитоплазме и поступают в ядро.</p><p>Вспомнить БИО-3·9: в цитоплазме груз переносят мембранные носители; ядерная пора — другой механизм, без пузырьков: груз проходит через водный канал белкового комплекса.</p><div class="static-quiz"><h3>Какие молекулы проходят через ядерную пору простой диффузией практически свободно?</h3><ol><li><b>А.</b> Любые белки, если они не крупнее определённого размера <i>(неверный вариант)</i><br><span class="expl">Резкой границы размера нет: крупные белки пассивно проходят пору очень медленно, быстро — только с транспортными рецепторами.</span></li><li><b>Б.</b> Ионы и небольшие молекулы примерно до 5 кДа <i>(верный вариант)</i><br><span class="expl">Они проходят практически свободно; более крупные молекулы диффундируют тем медленнее, чем они больше.</span></li><li><b>В.</b> Только молекулы с сигналом ядерной локализации <i>(неверный вариант)</i><br><span class="expl">Сигнал нужен для активного переноса крупных белков; малые молекулы проходят без сигнала.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема упрощена: показаны две поры и разрез оболочки.</p></details></article><article class="card print-unit" id="ns-nls-importin"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 34 из 45</div><h2>Как сигнал и транспортный рецептор переносят белок в ядро</h2><p class="lead">Крупный белок попадает в ядро, если на нём есть доступный <a href="#ns-g-S3-T33">сигнал ядерной локализации</a> и в клетке есть <a href="#ns-g-S3-T35">импортин</a>, который этот сигнал узнаёт; комплекс импортина с грузом проходит через комплекс ядерной поры.</p><div class="note"><strong>Что показывает схема.</strong> NLS + импортин → ядро; без импортина или при закрытом NLS белок остаётся в цитоплазме. Дополнительно: NES + экспортин → цитоплазма.</div><ol class="mech"><li>Белок с NLS связывается в цитоплазме с растворимым белком импортином.</li><li>Импортин с грузом проходит через пору, взаимодействуя с FG-нуклеопоринами.</li><li>Процесс энергозависим и идёт при участии ГТФ.</li></ol><p>Сигнал сам по себе не переносит белок: его переносят транспортные рецепторы. Без импортина — или если NLS закрыт связанным белком цитоплазмы — белок с NLS остаётся в цитоплазме: крупный белок проходит пору пассивно очень медленно и в ядре не накапливается.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Обратный путь — <a href="#ns-g-S3-T34">последовательность ядерного экспорта</a> (NES) и экспортин: белок с NES связывается в ядре с экспортином и выходит в цитоплазму, тоже при участии ГТФ. Без экспортина белок с NES остаётся в ядре. Импортин и экспортин, который переносит из ядра белки с NES, узнают разные сигналы: без этого экспортина белок с NLS по-прежнему узнаётся импортином. Транспортные рецепторы тоже возвращаются для нового цикла — в классическом импорте импортин-α выносит из ядра экспортин CAS, а импортин-β выходит в комплексе с Ran-ГТФ (БИО-3·29).</p></details><p>Адрес считывается рецептором, но сам по себе не гарантирует локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Необходимость и достаточность сигнала ядерной локализации показали на Т-антигене вируса SV40 (БИО-3·27).</p></details><h3>Дальше в курсе «Молекулярная биология»</h3><p>Иная система адресации — несколько путей импорта белков в митохондрию — <a href="https://fresll.github.io/molbio/seminar-9-route.html#import-routes">МБ, семинар 9, шаг 11</a>.</p><div class="static-quiz"><h3>Два одинаково крупных белка с сигналом ядерной локализации; импортин в клетке есть, пора не повреждена. У первого белка NLS открыт, у второго закрыт связанным с ним белком цитоплазмы. Чем различается их судьба?</h3><ol><li><b>А.</b> Оба окажутся в ядре: сигнал есть у обоих, импортин есть <i>(неверный вариант)</i><br><span class="expl">Наличия сигнала и рецептора недостаточно: рецептор должен сигнал узнать.</span></li><li><b>Б.</b> Оба останутся в цитоплазме: крупные белки пору не проходят <i>(неверный вариант)</i><br><span class="expl">С импортином крупный белок с открытым NLS переносится через пору в ядро.</span></li><li><b>В.</b> Первый импортин перенесёт в ядро, второй останется в цитоплазме: закрытый сигнал импортин не узнаёт <i>(верный вариант)</i><br><span class="expl">Сигнал работает, только если его узнаёт транспортный рецептор; закрытый NLS импортину недоступен.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: импортин показан одним белком.</p></details></article><article class="card print-unit" id="ns-address-principle"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 35 из 45</div><h2>Сигналы сортировки: что задаёт адрес белка</h2><p class="lead">Место назначения белка зависит от <a href="#ns-g-S3-T37">сигналов сортировки</a>, которые распознают транспортные и сортировочные белки. Такими сигналами могут быть участки аминокислотной цепи или модификации белка; распознавание сигнала включает груз в транспортный путь. Адрес считывается рецептором, но сам по себе не гарантирует конечную локализацию: важны доступность сигнала, сворачивание белка и конкурирующие маршруты.</p><div class="note"><strong>Что показывает схема.</strong> Эндоцитоз: участок рецептора — адаптерные белки. Импорт в ядро: NLS — импортин. Дополнительно: выход из ядра — NES и экспортин.</div><ol class="mech"><li>Сигнал сортировки — участок аминокислотной цепи белка или его модификация: связанные с белком углеводы (например, маннозо-6-фосфат) или присоединённый убиквитин (на рецепторе он направляет его в лизосому).</li><li>Белки секреторного пути, у которых нет сигналов сортировки в другие компартменты, по умолчанию попадают в конститутивные секреторные везикулы транс-сети аппарата Гольджи.</li><li>В рецептор-опосредованном эндоцитозе лиганд узнаётся рецептором снаружи клетки, а в покрытую клатрином ямку рецептор попадает по своему цитоплазматическому участку, который связывают адаптерные белки.</li><li>Для переноса через ядерную пору в ядро сигнал — NLS; его узнаёт импортин.</li></ol><p>Сигнал и груз — не одно и то же. Для отбора в ямку важен участок самого рецептора, а не лиганд.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Например, мутации цитоплазматического участка рецептора ЛПНП не мешают ему связывать ЛПНП, но рецептор не собирается в покрытых клатрином ямках (БИО-3·20).</p></details><p>Сигналы сортировки работают и на других участках мембранной сети: сигнальная последовательность направляет растущий белок в ЭПР, маннозо-6-фосфат — гидролазы в лизосомы.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Выход белков из ядра задаёт другой сигнал — последовательность ядерного экспорта (NES); её узнаёт экспортин (шаг «Как сигнал и транспортный рецептор переносят белок в ядро», раскрываемое дополнение).</p></details><div class="static-quiz"><h3>По какому участку рецептор груза собирается в покрытой клатрином ямке?</h3><ol><li><b>А.</b> По связанному с ним лиганду <i>(неверный вариант)</i><br><span class="expl">Лиганд связывается с внеклеточной частью рецептора; в ямку рецептор попадает по своему участку со стороны цитоплазмы.</span></li><li><b>Б.</b> По своему цитоплазматическому участку, который связывают адаптерные белки <i>(верный вариант)</i><br><span class="expl">Рецепторы груза концентрируются в ямке за счёт связывания их цитозольных участков с адаптерными белками.</span></li><li><b>В.</b> По размеру: в ямку попадают самые крупные белки мембраны <i>(неверный вариант)</i><br><span class="expl">Отбор в ямку идёт по участку рецептора, который узнают адаптерные белки, а не по размеру.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li><li><a href="https://doi.org/10.1038/ncb2721">Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471</a></li></ul><p>Таблица обобщает примеры сигналов сортировки; схема качественная.</p></details></article><article class="card print-unit" id="ns-ran-direction"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 36 из 45</div><h2>Чем задано направление переноса через пору</h2><p class="lead">Пора пропускает транспортные рецепторы в обе стороны. Направление переноса задаёт <a href="#ns-g-S3-T36">градиент Ran</a>: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме. Импорт и экспорт идут при участии ГТФ; направление переноса задаёт распределение Ran-ГТФ и Ran-ГДФ между ядром и цитоплазмой. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> С градиентом Ran: импорт в ядро и экспорт из ядра. Без Ran-ГТФ импортин связывает груз, но не освобождает его в ядре, а экспортин груз не связывает.</div><ol class="mech"><li>Импортин связывает груз с NLS в цитоплазме, где Ran-ГТФ мало.</li><li>В ядре Ran-ГТФ связывается с импортином и освобождает груз — груз остаётся в ядре.</li><li>При экспорте Ran-ГТФ, наоборот, стабилизирует комплекс экспортина с грузом до выхода из ядра.</li><li>Гидролиз ГТФ не проталкивает груз через канал механически, а поддерживает различие состояний Ran по сторонам оболочки.</li></ol><p>Отсюда следует: для импорта связывание сигнала импортином от Ran-ГТФ не зависит, а освобождение груза в ядре зависит: без Ran-ГТФ импортин связывает белок и проходит с ним пору, но груз не накапливается в ядре. Для экспорта Ran-ГТФ нужен уже для связывания груза экспортином: без него комплекс не образуется, и белок с NES остаётся в ядре.</p><p>Направленный перенос через пору устроен иначе, чем перенос в мембранных носителях: здесь нет оболочки и слияния мембран; груз связывается с транспортным рецептором по одну сторону оболочки и освобождается по другую.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как градиент Ran-ГТФ задаёт направление ядерного транспорта и как он поддерживается — <a href="https://fresll.github.io/molbio/seminar-1-route.html#ran-gradient">МБ, семинар 1, шаг 13</a>.</p><div class="static-quiz"><h3>Ran-ГТФ нет ни в ядре, ни в цитоплазме: весь Ran связан с ГДФ. Что произойдёт с белком, несущим NLS?</h3><ol><li><b>А.</b> Импортин его свяжет, но белок не будет накапливаться в ядре <i>(верный вариант)</i><br><span class="expl">Импортин связывает NLS и без Ran-ГТФ, а освобождение груза в ядре зависит от Ran-ГТФ.</span></li><li><b>Б.</b> Импортин его не свяжет <i>(неверный вариант)</i><br><span class="expl">Импортин связывает NLS в цитоплазме, где Ran-ГТФ мало и в норме; Ran-ГТФ нужен для освобождения груза в ядре.</span></li><li><b>В.</b> Белок накопится в ядре быстрее обычного <i>(неверный вариант)</i><br><span class="expl">Без Ran-ГТФ в ядре груз не освобождается, и накопления в ядре нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>На коллоквиуме достаточно знать, что импорт и экспорт идут при участии ГТФ; градиент Ran объясняет, откуда берётся направление переноса. Схема качественная.</p></details></article><article class="card print-unit" id="ns-flux-balance"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 37 из 45</div><h2>Почему белок копится в ядре, хотя пора пропускает вещества в обе стороны</h2><p class="lead">Вспомнить: шаг «Как сигнал и транспортный рецептор переносят белок в ядро». Возможность пройти пору и итоговое распределение белка — разные вопросы. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Малая молекула — поровну; белок с NLS — в ядре; с закрытым NLS — в цитоплазме; с NES — в цитоплазме.</div><ol class="mech"><li>Малая молекула проходит пору простой диффузией в обе стороны: концентрации выравниваются, накопления нет.</li><li>Крупный белок с NLS пассивно проходит пору очень медленно; импортин переносит его в ядро, и белок накапливается там против разницы концентраций.</li><li>У белка с NLS и NES идут два потока — импорт и экспорт; где он находится, задаёт соотношение их скоростей.</li><li>Изменение одного потока сдвигает распределение постепенно, а не мгновенно.</li></ol><p>Пора пропускает и малые молекулы, и транспортные рецепторы с грузом в обоих направлениях. Распределение белка между ядром и цитоплазмой — результат продолжающихся потоков: если импорт быстрее экспорта, белка больше в ядре; если экспорт быстрее — в цитоплазме. Поэтому наличие NLS ещё не означает, что белок находится в ядре, а клетка может переместить белок, изменив скорость одного из потоков или закрыв сигнал.</p><p>Накопление в ядре против разницы концентраций требует энергии. Её дают превращения белка Ran: в ядре преобладает Ran-ГТФ, в цитоплазме — Ran-ГДФ (шаг «Чем задано направление переноса через пору»). Импортин связывает груз в цитоплазме и освобождает его в ядре, поэтому перенос идёт в одну сторону.</p><h3>Обратная задача</h3><p>В ядре стало меньше <a href="#ns-g-S3-T75">челночного белка</a>. Объяснений два: ослаб импорт — или усилился экспорт. Новое распределение в обоих случаях сдвинуто в цитоплазму, и одно наблюдение их не различает. Различает вмешательство: выключить экспорт (или убрать NES) и проследить накопление в ядре. Если белок быстро накапливается — импорт в порядке, причина в экспорте; если медленно — ослаблен импорт.</p><h3>Как это узнали</h3><p>Что соотношение импорта и экспорта задаёт место челночных белков, обобщено в учебниках по многим работам. Что пассивный перенос замедляется с размером белка постепенно, без резкого порога, измерили в живых дрожжах (шаг «Есть ли у ядерной поры порог размера»); числа для дрожжей нельзя переносить на клетки человека.</p><h3>Граница вывода</h3><p>Модель не учитывает связывание белка с другими молекулами по обе стороны оболочки, которое тоже влияет на распределение, и не показывает, как клетка открывает и закрывает сигналы.</p><div class="static-quiz"><h3>Белок несёт NLS и NES. Импорт работает, но экспорт усилили так, что он стал быстрее импорта. Где будет больше этого белка?</h3><ol><li><b>А.</b> В ядре: на белке есть NLS <i>(неверный вариант)</i><br><span class="expl">NLS обеспечивает импорт, но экспорт по условию быстрее.</span></li><li><b>Б.</b> В цитоплазме <i>(верный вариант)</i><br><span class="expl">Итог задаёт соотношение скоростей: экспорт быстрее импорта.</span></li><li><b>В.</b> Поровну: пора пропускает вещества в обе стороны <i>(неверный вариант)</i><br><span class="expl">Поровну белок распределился бы при равных скоростях импорта и экспорта.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li><li><a href="https://doi.org/10.1083/jcb.201601004">Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76</a></li></ul><p>Качественная модель по Alberts et al., 2022 (гл. 12); скорости условные, не измерены.</p></details></article><article class="card print-unit" id="ns-soft-barrier"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 38 из 45</div><h2>Есть ли у ядерной поры порог размера</h2><p class="lead">Часто говорят, что пора пропускает белки только до определённой массы. Измерения в живых клетках показали: резкого порога нет, пассивный проход постепенно замедляется с ростом массы (Timney et al., 2016). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> 27 кДа — 15 с; 67 кДа — 413 с; резкого порога нет.</div><ol class="mech"><li>В живых дрожжах Saccharomyces cerevisiae сравнивали белки от 27 до 67 кДа: флуоресцентный белок GFP с 0–6 доменами белка A по 7 кДа (Timney et al., 2016).</li><li>Характерная постоянная времени τ выравнивания между ядром и цитоплазмой у GFP (27 кДа) — 15 ± 1,4 с, у белка 67 кДа — 413 ± 92 с (± — 95%-й доверительный интервал); обе величины приведены к клетке со средними объёмами ядра и цитоплазмы и средним числом пор.</li><li>τ растёт примерно как масса в степени 3,8 (3,8 ± 1,0); подвижность белков в растворе при этом различается лишь в 1,6 раза, значит, замедление создаёт сама пора.</li></ol><h3>Что уточняет эта работа?</h3><p>Молекулы до ~5 кДа проходят пору практически свободно, а более крупные — тем медленнее, чем они больше (БИО-3·23). Эксперимент даёт числа для белков 27–67 кДа и показывает, что это мягкий барьер, а не сито с жёсткой границей.</p><p>Значит, крупный белок без сигнала может постепенно пройти пору пассивно, но за минуты и без накопления по одну сторону оболочки; быстрый направленный перенос обеспечивают сигнал и транспортный рецептор.</p><h3>Метод</h3><p>Фотообесцвечивание в живых клетках: флуоресценцию белка в цитоплазме гасят лазером и следят, как убывает флуоресценция ядра, пока меченые и обесцвеченные молекулы обмениваются через поры. Убыль экспоненциальная: за время τ разница между текущей и равновесной флуоресценцией уменьшается примерно в 2,7 раза, за τ·ln 2 — вдвое; τ — не время прохода одной молекулы через пору. Измерено около 236 клеток; форму молекул проверяли малоугловым рассеянием рентгеновских лучей.</p><p>Контроль: белки одинакового строения, различающиеся только числом доменов. Чего данные не доказывают: измерения сделаны на дрожжах; перенос чисел на клетки человека не проверен, а облегчённый транспорт с рецепторами эта работа не описывает.</p><div class="static-quiz"><h3>Белок 67 кДа без сигнала ядерной локализации находится в цитоплазме дрожжевой клетки. Что покажет измерение?</h3><ol><li><b>А.</b> Он выравнивается между ядром и цитоплазмой за минуты <i>(верный вариант)</i><br><span class="expl">Постоянная времени выравнивания — около 413 с: пассивный проход идёт, но медленно (Timney et al., 2016).</span></li><li><b>Б.</b> Он не проходит пору совсем <i>(неверный вариант)</i><br><span class="expl">Резкого порога нет: белок 67 кДа проходит пору пассивно, хотя и медленно.</span></li><li><b>В.</b> Он проходит так же быстро, как GFP (27 кДа) <i>(неверный вариант)</i><br><span class="expl">Постоянная времени различается примерно в 27 раз: 15 с и 413 с.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.201601004">Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76</a></li></ul><p>Timney et al., 2016: живые дрожжи; белки 27–67 кДа; числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-nls-proof"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 39 из 45</div><h2>Как доказали, что семи аминокислот достаточно для адреса в ядро</h2><p class="lead">Сигнал ядерной локализации был впервые определён как короткая последовательность, которая и необходима, и достаточна для накопления белка в ядре (Kalderon et al., 1984). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Т-антиген — в ядре; с заменой Lys128 → Thr — в цитоплазме. Пируваткиназа — в цитоплазме; с PKKKRKV — в ядре; с участком 119–135 (Thr128) — в цитоплазме.</div><ol class="mech"><li>Большой Т-антиген вируса SV40 накапливается в ядре; замена одного остатка — лизина 128 на треонин — нарушает это накопление, хотя стабильность белка заметно не меняется (Kalderon et al., 1984).</li><li>Участок вокруг лизина 128, присоединённый к N-концу цитоплазматического мутанта Т-антигена, возвращает его в ядро.</li><li>Участок вокруг лизина 1
