28 (у пируваткиназы — остатки 119–135), присоединённый к β-галактозидазе бактерий и к пируваткиназе — крупному цитоплазматическому ферменту, — приводит к полному накоплению химерных белков в ядре; с треонином вместо лизина 128 участок не действует.</li><li>Укорочение участка показало: для накопления пируваткиназы в ядре достаточно остатков 126–132 — семи аминокислот Pro-Lys-Lys-Lys-Arg-Lys-Val (PKKKRKV). Авторы оговаривают, что в действие такого короткого сигнала могут вносить вклад соседние остатки, закодированные линкером.</li></ol><h3>Что уточняет эта работа?</h3><p>Белки с NLS переносит импортин (БИО-3·24). Эксперимент показывает, что сам сигнал может быть очень коротким и работает и в составе химерного белка. Импортин тогда ещё не был известен: механизм узнавания сигнала описали позже.</p><p>Здесь удобно различить необходимость и достаточность. Необходимость: без лизина 128 Т-антиген в ядро не попадает. Достаточность: семь аминокислот переводят в ядро белок, который в норме там не бывает, — в клетке, где весь транспортный аппарат работает. Ни то, ни другое отдельно не доказывает, что сигнал — единственное условие: нужен ещё рецептор, который его узнаёт, а в других белках сигнал может быть недоступен.</p><h3>Метод</h3><p>Плазмиды с генами мутантных и химерных белков вводили микроинъекцией в клетки Vero (линия клеток почки обезьяны); через 18 ч белки выявляли непрямой иммунофлуоресценцией и оценивали, где они находятся — в ядре или в цитоплазме.</p><p>Контроль: исходная пируваткиназа и химера с участком 119–135, в котором лизин 128 заменён треонином. Ограничение: оценка качественная, по микроскопии; ключевой лизин не единственный — замены соседних остатков ослабляли, но не отменяли накопление в ядре. Чего данные не доказывают: что сигнал ускоряет перенос в ядро. Авторы оценивали только накопление в ядре, и удержание белка в ядре этим экспериментом не исключено.</p><div class="static-quiz"><h3>Что доказывает эксперимент, в котором пируваткиназа с присоединённым PKKKRKV накапливается в ядре?</h3><ol><li><b>А.</b> Что без этого сигнала никакой белок не попадёт в ядро <i>(неверный вариант)</i><br><span class="expl">Это утверждение о необходимости, и для всех белков оно из эксперимента не следует: у других ядерных белков бывают другие сигналы.</span></li><li><b>Б.</b> Что пируваткиназа в норме работает в ядре <i>(неверный вариант)</i><br><span class="expl">Пируваткиназа — цитоплазматический фермент; в ядро её перевёл присоединённый сигнал.</span></li><li><b>В.</b> Что сигнала достаточно, чтобы направить в ядро цитоплазматический белок <i>(верный вариант)</i><br><span class="expl">Цитоплазматический белок с семью аминокислотами сигнала оказывается в ядре — это достаточность добавления сигнала в клетке с работающим транспортным аппаратом (Kalderon et al., 1984).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/0092-8674(84)90457-4">Kalderon D., Roberts B. L., Richardson W. D., Smith A. E. A short amino acid sequence able to specify nuclear location. Cell. 1984;39:499–509</a></li></ul><p>Kalderon et al., 1984: клетки Vero, микроинъекция плазмид, иммунофлуоресценция через 18 ч. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-npc-structure"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 40 из 45</div><h2>Что известно о строении ядерной поры сегодня</h2><p class="lead">Структурные исследования последних лет описали комплекс ядерной поры почти полностью: это один из крупнейших белковых комплексов клетки (Petrovic et al., 2026). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Около 35 нуклеопоринов и 1000 субъединиц; FG-участки — около 40 % массы; около 1000 макромолекул в секунду через пору.</div><ol class="mech"><li>Комплекс построен примерно из 35 разных нуклеопоринов, представленных множеством копий, — всего около 1000 белковых субъединиц; масса у позвоночных — около 120 МДа (Petrovic et al., 2026).</li><li>Нуклеопорины образуют кольца из восьми одинаковых спиц, которые проходят через слившиеся наружную и внутреннюю ядерные мембраны.</li><li>Внутренне неупорядоченные участки с FG-повторами составляют около 40 % массы поры человека и заполняют центральный канал, создавая барьер.</li><li>Через одну пору проходит около 1000 макромолекул в секунду; каждая находится в канале около 10 мс.</li></ol><p>Что уточняет этот обзор. Обычно называют около 30 различных нуклеопоринов (БИО-3·23); обзор 2026 г. — около 35. Числа близки.</p><p>Обзор подтверждает и схему направленного переноса (БИО-3·25): фактор обмена нуклеотидов для Ran находится на хроматине в ядре, белок, активирующий гидролиз ГТФ Ran, — в цитоплазме; поэтому Ran-ГТФ преобладает в ядре (Petrovic et al., 2026; вспомнить БИО-3·25). Обзор описывает и обратный путь самого импортина: в классическом импорте сигнал ядерной локализации связывает импортин-α вместе с импортином-β; в ядре Ran-ГТФ освобождает груз, импортин-β с Ran-ГТФ возвращается в цитоплазму, а импортин-α выносит из ядра другой экспортин — Cas — тоже вместе с Ran-ГТФ. Белки с NES выносит экспортин Crm1. Можно заключить, что без Cas импортин-α накапливался бы в ядре, и импорт остановился бы после того, как свободный импортин-α в цитоплазме закончится.</p><p>Раньше считали, что барьер поры ограничивает свободную диффузию макромолекул крупнее 40 кДа; более поздние работы показывают, что он влияет на скорость прохода молекул самых разных размеров (вспомнить БИО-3·28).</p><h3>Метод</h3><p>Обзор описывает, как к почти атомным структурам целых пор пришли, объединив электронную микроскопию, биохимическую реконструкцию комплексов нуклеопоринов и интегративную структурную биологию: структуры отдельных нуклеопоринов встраивают в карты плотности поры, полученные криоэлектронной томографией клеток и выделенных ядерных оболочек (Petrovic et al., 2026). Контроль — сравнение карт пор разных организмов и проверка взаимодействий нуклеопоринов биохимически и в клетке. Ограничение: разрешение карт пор в клетке — около 2–5 нм, поэтому положение отдельных участков белков в них определяют, встраивая структуры, полученные другими методами. Чего данные не доказывают: как именно FG-барьер отбирает молекулы — это обсуждают отдельные модели.</p><div class="static-quiz"><h3>Что заполняет центральный канал ядерной поры и создаёт её барьер?</h3><ol><li><b>А.</b> Липидный бислой, который пора проходит насквозь <i>(неверный вариант)</i><br><span class="expl">Мембраны ядерной оболочки в поре слиты и окружают комплекс снаружи; канал заполнен белковыми участками.</span></li><li><b>Б.</b> Внутренне неупорядоченные участки нуклеопоринов с FG-повторами <i>(верный вариант)</i><br><span class="expl">Они составляют около 40 % массы поры человека и заполняют канал (Petrovic et al., 2026).</span></li><li><b>В.</b> Вода без белков, поэтому проходит всё, что меньше канала <i>(неверный вариант)</i><br><span class="expl">Канал заполнен FG-участками; именно поэтому крупные молекулы проходят медленно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00881-w">Petrovic S., Mobbs G. W., Hoelz A. Structure, function and assembly of nuclear pore complexes. Nat Rev Mol Cell Biol. 2026;27:35–54</a></li></ul><p>Petrovic, Mobbs, Hoelz, 2026 — обзор. Числа — из него; масса указана для позвоночных. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-pore-diameter"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 41 из 45</div><h2>Меняется ли диаметр ядерной поры</h2><p class="lead">Диаметр канала ядерной поры не постоянен: в клетках человека <a href="#ns-g-S3-T58">внутреннее кольцо</a> меняется примерно от 40 до 60 нм, и авторы обзора предлагают считать причиной натяжение ядерной оболочки; но даже суженная пора открыта и переносит молекулы. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>Внутреннее кольцо встроено в мембрану поры и, как предполагают авторы обзора, испытывает натяжение оболочки прямо, поэтому оно самое податливое из колец; у клеток человека — примерно 40–60 нм, у делящихся дрожжей — 50–70 нм (Lusk et al., 2025).</li><li>Поры в клетках DLD-1 шире, чем в прежних моделях пор человека по выделенным (полуочищенным) оболочкам: канал около 57 нм против около 43 нм, объём канала больше примерно на 75 % (Schuller et al., 2021). Это сравнение разных выборок и способов подготовки; снятие натяжения при выделении оболочки — возможное объяснение.</li><li>Поры одного ядра различаются по диаметру; на плоской базальной поверхности ядра расширенных пор больше; вклад <a href="#ns-g-S3-T61">комплексов LINC</a> (они связывают ядерный скелет с цитоскелетом) — около 10 % возможного расширения (Lusk et al., 2025).</li></ol><p>Что уточняет этот шаг. Комплекс ядерной поры построен из примерно 30 видов нуклеопоринов (БИО-3·23). Его каркас не жёсткий: строение, определённое на выделенных оболочках, относится к суженной поре. Сужение — не закрытие: перенос продолжается.</p><h3>Метод</h3><p>Криоэлектронная томография пор прямо в клетке и усреднение изображений многих пор; сравнение с порами выделенных ядерных оболочек и с клетками, у которых изменили осмолярность среды или истощили АТФ, — это разные выборки клеток, а не одни и те же клетки до и после воздействия.</p><p>Чего метод не доказывает. Влияет ли диаметр на скорость переноса белков в клетке, прямо не измерено; в искусственных нанопорах, выстланных <a href="#ns-g-S3-T59">FG-нуклеопоринами</a>, избирательность снижалась при диаметре около 55 нм — это измерение в искусственной системе, а не в поре клетки. Сужение при истощении энергии и в гиперосмотической среде и более сильное ограничение диффузии показаны на делящихся дрожжах, а не на клетках человека.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как градиент Ran-ГТФ задаёт направление ядерного транспорта — <a href="https://fresll.github.io/molbio/seminar-1-route.html#ran-gradient">МБ, семинар 1, шаг 13</a>.</p><div class="static-quiz"><h3>Какое кольцо каркаса ядерной поры, по данным обзора, сильнее всего меняет диаметр при изменении натяжения ядерной оболочки и почему?</h3><ol><li><b>А.</b> Цитоплазматическое: на него действуют силы цитоскелета <i>(неверный вариант)</i><br><span class="expl">Цитоплазматическое кольцо меняется меньше внутреннего.</span></li><li><b>Б.</b> Ни одно: каркас поры жёсткий <i>(неверный вариант)</i><br><span class="expl">Каркас не жёсткий: поры наблюдают в суженном и расширенном состояниях.</span></li><li><b>В.</b> Внутреннее: оно встроено в мембрану поры и испытывает натяжение оболочки прямо <i>(верный вариант)</i><br><span class="expl">Все три кольца могут сужаться и расширяться, но самое податливое — внутреннее.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-025-01768-w">Lusk C. P., Morgan K. J., King M. C. Nuclear mechanics as a determinant of nuclear pore complex plasticity. Nat Cell Biol. 2025;27:1622–1631</a></li><li><a href="https://doi.org/10.1038/s41586-021-03985-3">Schuller A. P. et al. The cellular environment shapes the nuclear pore complex architecture. Nature. 2021;598:667–671</a></li></ul><p>Lusk et al., 2025: обзор данных криоэлектронной томографии и экспансионной микроскопии пор. Schuller et al., 2021: клетки рака толстой кишки человека DLD-1.</p></details></article><article class="card print-unit" id="ns-hiv-capsid"><div class="eyebrow">Ядерная пора и общий принцип адресации · шаг 42 из 45</div><h2>Как капсид ВИЧ-1 проходит через ядерную пору</h2><p class="lead">Конусовидный <a href="#ns-g-S3-T62">капсид</a> вируса иммунодефицита человека (ВИЧ-1) с широким концом около 55–60 нм проходит через ядерную пору целым; в клетках SupT1-R5 он раскрывается в ядре, а в макрофагах человека капсиды в ядре выглядели целыми, и их прохождение связано с растрескиванием колец каркаса поры. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>В клетках SupT1-R5 поры расширены до примерно 64 нм (такие же — и в незаражённых клетках) — на 4–9 нм шире широкого конца капсида (около 55–60 нм; конусы в цитоплазме 112 ± 12 × 53 ± 7 нм); целые капсиды найдены в канале пор, в ядре — раскрытые (Zila et al., 2021).</li><li>В ядре капсид раскрывается: его оболочка частично разрушается (остаются фрагменты и трубки), но не растворяется сразу на отдельные белки, и геном освобождается из остатков капсида (Zila et al., 2021).</li><li>В первичных макрофагах человека (внутреннее кольцо около 65 нм) цитоплазматическое кольцо треснуто у 4 из 9 пор с капсидом в канале против 12 из 259 пор без капсида и 0 из 112 в незаражённых клетках; капсиды с ядерной стороны выглядели целыми (Kreysing et al., 2025).</li></ol><p>Что уточняет этот шаг. Пора пропускает крупные частицы не только по размеру, но и по способности войти в сеть <a href="#ns-g-S3-T59">FG-повторов</a> (БИО-3·28). Собранные частицы капсидного белка ВИЧ-1 связывают FG-повторы и в бесклеточной системе входят в их сеть, как транспортный рецептор (Fu et al., 2024); в клетке прохождение капсида может деформировать каркас поры. По расчётам авторов работы о макрофагах, без FG-повторов капсид проходит через пору либо при расширении внутреннего кольца до примерно 70 нм, либо при растрескивании кольца; вклад FG-повторов не оценён. Как именно сочетаются эти механизмы, не решено.</p><h3>Метод</h3><p>Корреляционная световая и электронная томография: капсиды находят по флуоресценции, затем снимают тот же участок криоэлектронной томографией; положение каждой из восьми субъединиц кольца поры находят сопоставлением с образцом.</p><p>Чего метод не доказывает. Наблюдение статичное: растрескивание как процесс не видели; событий мало; использованы неинфекционный вариант вируса и (у пор в SupT1-R5) вариант с заменой в капсиде; не доказано, что каждый найденный капсид привёл бы к заражению.</p><div class="static-quiz"><h3>В незаражённых макрофагах человека у скольких пор цитоплазматическое кольцо оказалось треснутым?</h3><ol><li><b>А.</b> Ни у одной из 112 <i>(верный вариант)</i><br><span class="expl">Растрескивание наблюдали только в заражённых клетках, чаще всего у пор с капсидом в канале.</span></li><li><b>Б.</b> Примерно у половины <i>(неверный вариант)</i><br><span class="expl">Так часто кольцо нарушено лишь у пор с капсидом в канале (4 из 9).</span></li><li><b>В.</b> Примерно у 5 % <i>(неверный вариант)</i><br><span class="expl">Около 5 % (12 из 259) — у пор без капсида в заражённых клетках; в незаражённых — 0 из 112.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2021.01.025">Zila V. et al. Cone-shaped HIV-1 capsids are transported through intact nuclear pores. Cell. 2021;184:1032–1046.e18</a></li><li><a href="https://doi.org/10.1016/j.cell.2024.12.008">Kreysing J. P. et al. Passage of the HIV capsid cracks the nuclear pore. Cell. 2025;188(4):930–943.e21</a></li><li><a href="https://doi.org/10.1038/s41586-023-06966-w">Fu L., Weiskopf E. N., Akkermans O., Swanson N. A., Cheng S., Schwartz T. U., Görlich D. HIV-1 capsids enter the FG phase of nuclear pores like a transport receptor. Nature. 2024;626:843–851</a></li></ul><p>Zila et al., 2021: клетки SupT1-R5. Kreysing et al., 2025: первичные макрофаги человека. Fu et al., 2024: бесклеточные системы, собранные частицы капсидного белка.</p></details></article><article class="card print-unit" id="ns-causal-chain"><div class="eyebrow">Исследование · шаг 43 из 45</div><h2>Груз оказался не там: как найти, где прервалась цепь</h2><p class="lead">Четыре вопроса семинара сводятся к одной цепи: метка на грузе → узнавание → механизм переноса → подходящие условия. Если груз оказался не там, ищут звено, на котором цепь прервалась. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Кавеолы, цикл носителя, рецептор трансферрина, ядерный белок: наблюдение → два объяснения → различающее наблюдение.</div><ol class="mech"><li>Есть ли на грузе метка и доступна ли она?</li><li>Есть ли рецептор, который эту метку узнаёт?</li><li>Работают ли все этапы переноса — от оболочки до слияния, от импорта до экспорта?</li><li>Подходят ли местные условия — кислотность эндосомы, возврат рецептора, соотношение потоков?</li></ol><p>Чтобы груз оказался в нужном месте, важны тип груза и способ захвата, выполнение каждого этапа доставки, условия сортировки и баланс встречных потоков. Если результат неожиданен, ищут не «неправильный белок», а этап, на котором прервалась причинная цепь.</p><p>Одинаковое наблюдение часто совместимо с несколькими объяснениями: впячиваний-кавеол меньше — они распластались или ушли внутрь; носители у мишени не сливаются — нет SNARE или они не восстанавливаются; рецепторов на поверхности меньше — нарушен возврат или ускорен уход; белка в ядре меньше — ослаб импорт или усилился экспорт. Каждый раз нужно назвать дополнительное наблюдение, которое различит объяснения.</p><p>Похожая форма не гарантирует одинаковой функции: клатриновая ямка и кавеола — обе впячивания, но первая отбирает рецепторы и становится носителем, а вторая служит резервом площади мембраны.</p><div class="static-quiz"><h3>Белок с NLS оказался в цитоплазме, хотя импортин в клетке есть и пора в порядке. Какое звено цепи, вероятнее всего, прервано?</h3><ol><li><b>А.</b> Механизм переноса через пору <i>(неверный вариант)</i><br><span class="expl">Пора по условию в порядке.</span></li><li><b>Б.</b> Местные условия эндосомы <i>(неверный вариант)</i><br><span class="expl">Кислотность эндосомы к ядерному импорту отношения не имеет.</span></li><li><b>В.</b> Доступность метки: NLS закрыт или изменён <i>(верный вариант)</i><br><span class="expl">Рецептор и пора в порядке — значит, импортин не может узнать сигнал.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li><li><a href="https://doi.org/10.1016/j.cell.2010.12.031">Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413</a></li><li><a href="https://doi.org/10.1073/pnas.80.8.2258">Dautry-Varsat A., Ciechanover A., Lodish H. F. pH and the recycling of transferrin during receptor-mediated endocytosis. Proc Natl Acad Sci USA. 1983;80:2258–2262</a></li></ul><p>Обобщение продвинутых шагов разделов 1–4; схема — таблица.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 44 из 45</div><h2>Как узнают, на каком этапе остановился груз</h2><p class="lead">Во многих экспериментах семинара вопрос один: где оказался груз после того, как выключили деталь. Ответить на него помогают разные методы, и у каждого — своя измеряемая величина, свой контроль и свои ограничения. Шаг собирает методы, которые встретились в продвинутых шагах разделов 1–4. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Электронная микроскопия — форма мембран; иммунофлуоресценция — компартмент; бесклеточная система — необходимый белок; фотообесцвечивание — скорость прохода.</div><ol class="mech"><li>Электронная микроскопия показывает форму мембран — впяченную ямку, суженную шейку, трубку (БИО-3·4; Damke et al., 1994).</li><li>Иммунофлуоресценция с белками-маркерами компартментов показывает, с каким компартментом совпадает груз: LAMP1 — маркер лизосом и поздних эндосом, EEA1 — ранних эндосом (БИО-3·22; Steinberg et al., 2013).</li><li>Бесклеточная система из мембран и цитозоля позволяет выключить один компонент и вернуть его очищенным (БИО-3·13; Block et al., 1988).</li><li>Съёмка живых клеток и фотообесцвечивание измеряют время: как быстро меняется метка эндосомы или выравнивается белок между ядром и цитоплазмой (БИО-3·21, 3·28).</li></ol><p>Измеряемую величину выбирают по вопросу. Если нужно узнать, образовался ли носитель, смотрят форму мембраны; если нужно узнать, куда попал груз, — его положение относительно маркеров компартментов; если нужно узнать, какой белок необходим, — выключают его и возвращают очищенным или синтезированным заново.</p><h3>Контроль и ограничения</h3><p>Контроль — тот же эксперимент без вмешательства или с вмешательством, которое не должно действовать (белок дикого типа вместо мутантного, контрольная РНК, сигнал с заменой ключевого остатка). Типичные артефакты: избыточный синтез меченого белка, неспецифическое действие ингибитора (например, N-этилмалеимида), перенос выводов с одного типа клеток на другие.</p><p>Измерение само по себе показывает, где находится груз или как выглядит мембрана, — это наблюдение. Необходимость детали доказывает вмешательство (удаление, мутация, подавление синтеза) вместе с таким измерением; достаточность добавления — перенос сигнала на другой белок или восстановление функции очищенным белком в системе, где остальные компоненты сохранены. Некоторые работы семинара измеряли свойство, а не необходимость детали: скорость прохода через пору (Timney et al., 2016), натяжение мембраны (Sinha et al., 2011), сродство лиганда к рецептору при разном pH (Dautry-Varsat et al., 1983).</p><div class="static-quiz"><h3>Нужно проверить, попадает ли белок в лизосомы после выключения SNX27. Какую величину измерить?</h3><ol><li><b>А.</b> Форму клатриновых ямок в электронной микроскопии <i>(неверный вариант)</i><br><span class="expl">Форма ямок говорит об образовании носителя на поверхности, а не о том, куда груз попал после эндосомы.</span></li><li><b>Б.</b> Скорость выравнивания белка между ядром и цитоплазмой <i>(неверный вариант)</i><br><span class="expl">Эта величина описывает проход через ядерную пору; к лизосомам она отношения не имеет.</span></li><li><b>В.</b> Положение белка относительно маркера лизосом LAMP1 <i>(верный вариант)</i><br><span class="expl">Увеличение совпадения с LAMP1 согласуется с доставкой белка в лизосомные компартменты; расщепление подтверждают отдельным измерением — так и сделано в работе (Steinberg et al., 2013).</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.127.4.915">Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934</a></li><li><a href="https://doi.org/10.1073/pnas.85.21.7852">Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856</a></li><li><a href="https://doi.org/10.1016/j.cell.2005.06.043">Rink J., Ghigo E., Kalaidzidis Y., Zerial M. Rab conversion as a mechanism of progression from early to late endosomes. Cell. 2005;122:735–749</a></li><li><a href="https://doi.org/10.1038/ncb2721">Steinberg F. et al. A global analysis of SNX27–retromer assembly and cargo specificity reveals a function in glucose and metal ion transport. Nat Cell Biol. 2013;15:461–471</a></li><li><a href="https://doi.org/10.1083/jcb.201601004">Timney B. L. et al. Simple rules for passive diffusion through the nuclear pore complex. J Cell Biol. 2016;215:57–76</a></li></ul><p>Обобщение методов из продвинутых шагов семинара; числа и условия — в соответствующих шагах. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 45 из 45</div><h2>Путь одного груза через клетку: трансцитоз IgA</h2><p class="lead">Проследим один груз — димерный IgA, который эпителиальная клетка переносит от базолатеральной поверхности к апикальной (<a href="#ns-g-S3-T27">трансцитоз</a>), — и на каждом этапе назовём, что происходит и что для этого нужно. Шаг повторяет материал разделов 1–3 на новом примере. Научное дополнение — на коллоквиуме и зачёте не требуется; для продвинутых исследований знать его не нужно.</p><div class="note"><strong>Что показывает схема.</strong> Базолатеральная поверхность → покрытая клатрином везикула → эндосомы → апикальная мембрана: комплекс не распадается до расщепления рецептора.</div><ol class="mech"><li>Базолатеральная поверхность: IgA связывается с полимерным иммуноглобулиновым рецептором; рецептор собирается в покрытой клатрином ямке, его цитоплазматический участок связывают адаптерные белки; покрытую везикулу отделяет динамин (условие примера).</li><li>Цитоплазма: везикула сбрасывает клатриновую оболочку и сливается с ранней эндосомой с участием SNARE-белков.</li><li>Эндосомы: комплекс IgA с рецептором не диссоциирует и переносится через эндосомы к апикальной мембране.</li><li>Апикальная мембрана: рецептор расщепляется, и IgA выделяется в секрет вместе с отщеплённой внеклеточной частью рецептора — секреторным компонентом.</li></ol><p>Этот путь отличается от самого частого тем, что лиганд не отделяется от рецептора в ранней эндосоме, а рецептор не возвращается: его внеклеточная часть уходит в секрет вместе с IgA. Поэтому одна молекула рецептора переносит IgA один раз (вспомнить БИО-3·16, 3·17).</p><p>Трансцитоз объясняет, как иммуноглобулины попадают в слюну и грудное молоко. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p><p>Сравните с белком, идущим в ядро: там нет мембранных носителей, а груз проходит через водный канал комплекса ядерной поры с транспортным рецептором (БИО-3·24, 3·25).</p><div class="static-quiz"><h3>Где IgA отделяется от полимерного иммуноглобулинового рецептора при трансцитозе?</h3><ol><li><b>А.</b> Нигде в клетке: на апикальной мембране рецептор расщепляется, и IgA выделяется вместе с его внеклеточной частью <i>(верный вариант)</i><br><span class="expl">IgA выделяется в секрет вместе с отщеплённой частью рецептора — секреторным компонентом.</span></li><li><b>Б.</b> В ранней эндосоме, как большинство лигандов <i>(неверный вариант)</i><br><span class="expl">Комплекс IgA с рецептором в эндосомах не диссоциирует и переносится к апикальной мембране.</span></li><li><b>В.</b> В лизосоме, где рецептор расщепляется <i>(неверный вариант)</i><br><span class="expl">Комплекс идёт не в лизосому, а к апикальной мембране; рецептор расщепляется там.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Обобщение материала разделов 1–3. Условие примера: рецептор с IgA захватывается через покрытые клатрином ямки, как рецепторный груз в шаге БИО-3·2. Схема-таблица качественная.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S3-T01"><dt>Эндоцитоз</dt><dd>Общее название процессов везикулярного транспорта, при которых вещества поступают в клетку в мембранных пузырьках, образованных из плазматической мембраны.</dd></div><div id="ns-g-S3-T02"><dt>Микропиноцитоз</dt><dd>Постоянное неспецифическое поглощение жидкости и небольших белковых молекул в мелких пузырьках (менее 150 нм). Такие пузырьки образуются разными путями — из покрытых клатрином ямок и без клатрина.</dd></div><div id="ns-g-S3-T03"><dt>Макропиноцитоз</dt><dd>Регулируемый захват внеклеточной жидкости: перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы более 0,2 мкм.</dd></div><div id="ns-g-S3-T04"><dt>Фагоцитоз</dt><dd>Поглощение крупных частиц (бактерий, обломков клеток, пыли) специализированными фагоцитами; псевдоподии охватывают частицу, образуется фагосома более 250 нм.</dd></div><div id="ns-g-S3-T05"><dt>Рецептор-опосредованный эндоцитоз</dt><dd>Захват молекул, которые связываются со своими рецепторами на поверхности клетки. Во многих клетках животных растворённые макромолекулы так поступают через покрытые клатрином ямки: рецепторы с грузом через адаптеры связываются с клатрином, и ямка становится покрытой клатрином везикулой. Узнавание груза рецептором бывает и в клатрин-независимых путях, например при фагоцитозе.</dd></div><div id="ns-g-S3-T06"><dt>Рецептор груза</dt><dd>Трансмембранный белок, который снаружи связывает определённый груз, а цитоплазматическим участком — белок-адаптер.</dd></div><div id="ns-g-S3-T07"><dt>Белок-адаптер</dt><dd>Белок, связывающий цитоплазматический участок рецептора груза с клатрином, например адаптин.</dd></div><div id="ns-g-S3-T08"><dt>Клатрин</dt><dd>Белок оболочки, который собирается в решётку с цитоплазматической стороны мембраны и изгибает её в ямку.</dd></div><div id="ns-g-S3-T09"><dt>Динамин</dt><dd>ГТФаза, которая обеспечивает отшнуровывание покрытой клатрином везикулы от мембраны: динамин собирается спиралью вокруг шейки ямки, и после гидролиза ГТФ мембрана шейки смыкается.</dd></div><div id="ns-g-S3-T10"><dt>Кавеола</dt><dd>Сверх программы: колбовидная инвагинация плазматической мембраны 50–100 нм, образованная кавеолинами и кавинами и обогащённая холестерином и сфинголипидами. При механической нагрузке кавеолы служат резервом мембраны и смягчают её; эндоцитоз кавеол возможен, но, по современным оценкам, не главная их функция, а его масштаб в разных клетках неизвестен.</dd></div><div id="ns-g-S3-T11"><dt>Натяжение мембраны</dt><dd>Сверх программы: сила, растягивающая мембрану в её плоскости, в расчёте на единицу длины (мН/м); растёт, когда площадь клетки должна увеличиться (например, при набухании), а запаса мембраны нет.</dd></div><div id="ns-g-S3-T12"><dt>Асимметрия мембраны</dt><dd>Сверх программы: различие липидного состава наружного и цитоплазматического листков плазматической мембраны.</dd></div><div id="ns-g-S3-T13"><dt>Транспортный носитель</dt><dd>Мембранный пузырёк (везикула), который образуется почкованием от мембраны одного компартмента и сливается с мембраной другого, перенося груз между ними.</dd></div><div id="ns-g-S3-T14"><dt>Оболочка носителя</dt><dd>Белковый слой, который собирается на мембране-доноре, отбирает груз и изгибает мембрану в носитель: COP-II, COP-I или клатрин с адаптерами.</dd></div><div id="ns-g-S3-T15"><dt>COP-II</dt><dd>Оболочка носителей, переносящих только что синтезированные белки из грЭПР в цис-сеть аппарата Гольджи (антероградный транспорт).</dd></div><div id="ns-g-S3-T16"><dt>COP-I</dt><dd>Оболочка носителей ретроградного транспорта: из аппарата Гольджи в грЭПР и между цистернами аппарата Гольджи.</dd></div><div id="ns-g-S3-T17"><dt>SNARE-белки</dt><dd>Белки слияния мембран: SNARE носителя (v-SNARE) и SNARE мембраны-мишени (t-SNARE) собираются в комплекс и обеспечивают слияние. По остатку в центре комплекса их делят также на R-SNARE (аргинин) и Q-SNARE (глутамин); это другая классификация, а не новое название v- и t-SNARE (БИО-3·12).</dd></div><div id="ns-g-S3-T18"><dt>Rab-белки и белки первоначального узнавания и удержания транспортного носителя</dt><dd>Белки, которые первыми узнают мембрану-мишень: Rab в активной форме (связанный с ГТФ) отмечает мембрану и привлекает длинные удерживающие белки, которые держат подходящий носитель у мишени до сборки SNARE. В текстах семинара — кратко «удерживающие белки». Научная справка: в англоязычной литературе — tethering factors.</dd></div><div id="ns-g-S3-T19"><dt>Ранняя эндосома</dt><dd>Сортировочный компартмент, который образуется при слиянии эндоцитозных везикул друг с другом; обычно около 10 минут принимает новые везикулы, а затем созревает в позднюю эндосому.</dd></div><div id="ns-g-S3-T20"><dt>NSF</dt><dd>АТФаза, чувствительная к N-этилмалеимиду (англ. N-ethylmaleimide-sensitive factor): после слияния разбирает SNARE-комплекс. Сверх программы: работает вместе с белками α-SNAP — растворимыми белками, связывающими NSF.</dd></div><div id="ns-g-S3-T21"><dt>Пора слияния</dt><dd>Сверх программы: канал, который соединяет просвет носителя с просветом мишени (или с внеклеточной средой при экзоцитозе) в момент слияния мембран.</dd></div><div id="ns-g-S3-T22"><dt>Гемислияние</dt><dd>Сверх программы: промежуточное состояние слияния, при котором слиты только обращённые друг к другу (проксимальные) монослои двух мембран, а поры ещё нет.</dd></div><div id="ns-g-S3-T23"><dt>Рециркуляция рецептора</dt><dd>Возврат рецептора из ранней эндосомы на поверхность клетки в везикулах, отпочковывающихся от эндосомы; позволяет клетке постоянно и избирательно захватывать вещество.</dd></div><div id="ns-g-S3-T24"><dt>Поздняя эндосома</dt><dd>Эндосома, в которую созревает ранняя: её среда кислее, она лежит глубже в цитоплазме; мембрана поздней эндосомы впячивается внутрь, образуя мультивезикулярное тельце.</dd></div><div id="ns-g-S3-T25"><dt>Мультивезикулярное тельце</dt><dd>Поздняя эндосома с внутрипросветными везикулами, образованными впячиванием её мембраны в просвет; мультивезикулярные тельца сливаются с лизосомами, где содержимое расщепляется.</dd></div><div id="ns-g-S3-T26"><dt>Убиквитин</dt><dd>Небольшой белок, который присоединяется к другим белкам как метка; убиквитинированный рецептор включается в мембрану внутрипросветных везикул и разрушается в лизосоме.</dd></div><div id="ns-g-S3-T27"><dt>Трансцитоз</dt><dd>Перенос рецептора с лигандом через клетку — например, димерного IgA с полимерным иммуноглобулиновым рецептором от базолатеральной поверхности эпителиальной клетки к апикальной.</dd></div><div id="ns-g-S3-T28"><dt>Трансферрин</dt><dd>Сверх программы: белок плазмы крови, переносящий железо; отдаёт железо в кислой эндосоме, а сам вместе с рецептором возвращается на поверхность клетки.</dd></div><div id="ns-g-S3-T29"><dt>Rab5 и Rab7</dt><dd>Малые ГТФазы — метки ранней (Rab5) и поздней (Rab7) эндосомы. Сверх программы: при созревании эндосомы Rab5 на её мембране сменяется Rab7.</dd></div><div id="ns-g-S3-T30"><dt>SNX27–ретромер</dt><dd>Сверх программы: комплекс на ранней эндосоме, который узнаёт концевой PDZ-лиганд мембранного белка и возвращает белок на поверхность вместо лизосомы.</dd></div><div id="ns-g-S3-T31"><dt>Ядерная оболочка</dt><dd>Две мембраны с перинуклеарным пространством между ними; наружная мембрана продолжается в мембрану грЭПР, внутренняя связана с ядерной ламиной; обе прерываются ядерными порами.</dd></div><div id="ns-g-S3-T32"><dt>Комплекс ядерной поры</dt><dd>Белковый комплекс в поре ядерной оболочки, построенный примерно из 30 различных нуклеопоринов, многие из которых представлены 8, 16 или 32 копиями; белки с FG-повторами создают в нём селективный барьер.</dd></div><div id="ns-g-S3-T33"><dt>Сигнал ядерной локализации (NLS)</dt><dd>Участок белка, по которому его узнаёт импортин и переносит из цитоплазмы в ядро.</dd></div><div id="ns-g-S3-T34"><dt>Последовательность ядерного экспорта (NES)</dt><dd>Участок белка, по которому его в ядре узнаёт экспортин и переносит в цитоплазму.</dd></div><div id="ns-g-S3-T35"><dt>Импортин и экспортин</dt><dd>Ядерные транспортные рецепторы (кариоферины): импортин связывает белки с NLS и переносит их в ядро, экспортин — белки с NES из ядра; оба процесса идут при участии ГТФ.</dd></div><div id="ns-g-S3-T36"><dt>Градиент Ran</dt><dd>Различие состояний малой ГТФазы Ran: Ran-ГТФ преобладает в ядре, Ran-ГДФ — в цитоплазме; задаёт направление переноса через пору.</dd></div><div id="ns-g-S3-T37"><dt>Сигнал сортировки</dt><dd>Участок аминокислотной цепи белка или его модификация (например, маннозо-6-фосфат или присоединённый убиквитин), по которым сортировочный аппарат клетки направляет белок к месту назначения.</dd></div><div id="ns-g-S3-T38"><dt>Трискелион</dt><dd>Сверх программы: трёхлучевая единица клатриновой оболочки из трёх тяжёлых и трёх лёгких цепей клатрина; трискелионы собираются в решётку из шести- и пятиугольников.</dd></div><div id="ns-g-S3-T39"><dt>Решётка клатрина (плоская и изогнутая)</dt><dd>Сверх программы: слой трискелионов на цитоплазматической стороне мембраны; плоская решётка состоит в основном из шестиугольников, изогнутая содержит и пятиугольники; изгибаясь, решётка превращает участок мембраны в ямку.</dd></div><div id="ns-g-S3-T40"><dt>Белки-инициаторы сборки ямки</dt><dd>Сверх программы: белки (Eps15, FCHO и другие), которые собираются на месте будущей клатриновой ямки раньше клатрина и образуют сеть, удерживающую адаптеры: в пробирке — жидкоподобные капли, в клетке подвижность оценивают по восстановлению флуоресценции после обесцвечивания; слишком слабая сеть распадается, слишком прочная теряет подвижность.</dd></div><div id="ns-g-S3-T41"><dt>Участок выхода из ЭПР</dt><dd>Сверх программы: свободный от рибосом участок мембраны грЭПР, на котором собирается оболочка COP-II и отпочковываются носители к аппарату Гольджи.</dd></div><div id="ns-g-S3-T42"><dt>Промежуточный компартмент ЭПР–Гольджи</dt><dd>Сверх программы: мембраны между грЭПР и цис-сетью аппарата Гольджи; принимают носители с COP-II, от них отпочковываются носители с COP-I.</dd></div><div id="ns-g-S3-T43"><dt>Рибосома</dt><dd>Частица из рРНК и белков, на которой синтезируется белок; рибосомы, синтезирующие белки секреторного пути, прикреплены к мембране грЭПР.</dd></div><div id="ns-g-S3-T44"><dt>Проколлаген</dt><dd>Сверх программы: предшественник коллагена — тройная спираль, собранная в ЭПР в жёсткую палочковидную молекулу длиной около 300 нм.</dd></div><div id="ns-g-S3-T45"><dt>Разрешение микроскопа</dt><dd>Наименьшее расстояние, на котором два объекта видны раздельно; у светового микроскопа около 200 нм, у электронного — единицы нанометров и меньше.</dd></div><div id="ns-g-S3-T46"><dt>Синаптический пузырёк</dt><dd>Сверх программы: мелкий (около 40 нм) мембранный пузырёк нервного окончания, заполненный медиатором; выделяет медиатор при слиянии с пресинаптической мембраной.</dd></div><div id="ns-g-S3-T47"><dt>Синаптобревин</dt><dd>Сверх программы: SNARE-белок мембраны синаптического пузырька (R-SNARE, другое название — VAMP2); его расщепляет тетанотоксин, и слияние пузырька с мембраной прекращается.</dd></div><div id="ns-g-S3-T48"><dt>Липопротеин низкой плотности (ЛПНП)</dt><dd>Сверх программы: частица крови, переносящая холестерин: ядро из эфиров холестерина окружено оболочкой из фосфолипидов, холестерина и одной молекулы белка apoB100.</dd></div><div id="ns-g-S3-T49"><dt>Рецептор ЛПНП</dt><dd>Сверх программы: трансмембранный рецептор, связывающий ЛПНП на поверхности клетки; в кислой ранней эндосоме ЛПНП отделяется, и рецептор возвращается на поверхность.</dd></div><div id="ns-g-S3-T50"><dt>Иммуноглобулин G (IgG)</dt><dd>Основной класс антител плазмы крови; константный Fc-участок молекулы связывается с Fc-рецепторами клеток.</dd></div><div id="ns-g-S3-T51"><dt>Неонатальный Fc-рецептор (FcRn)</dt><dd>Сверх программы: рецептор, связывающий Fc-участок IgG при pH 5–6 и не связывающий его при pH 7,4; возвращает IgG из эндосом на поверхность клетки и тем защищает его от расщепления в лизосомах.</dd></div><div id="ns-g-S3-T52"><dt>pH эндосомы</dt><dd>Кислотность просвета эндосомы; снижается по мере созревания эндосомы за счёт протонной АТФазы её мембраны; в лизосоме среда самая кислая.</dd></div><div id="ns-g-S3-T53"><dt>Лизосома</dt><dd>Мембранный органоид с кислой средой и гидролазами, в котором расщепляются макромолекулы, поступившие эндоцитозом и аутофагией.</dd></div><div id="ns-g-S3-T54"><dt>SNX17</dt><dd>Сверх программы: белок ранней эндосомы из семейства сортирующих нексинов; связывает в хвосте груза мотив NPxY; без груза его собственный C-концевой участок блокирует участок связывания груза (аутоингибирование).</dd></div><div id="ns-g-S3-T55"><dt>Ретривер и Commander</dt><dd>Сверх программы: ретривер — комплекс трёх белков, родственный ретромеру; вместе с комплексом CCC и белком DENND10 он образует Commander из 16 субъединиц, возвращающий груз из эндосомы на поверхность клетки; SNX17 передаёт ему груз.</dd></div><div id="ns-g-S3-T56"><dt>ESCPE-1</dt><dd>Сверх программы: комплекс сортирующих нексинов, изгибающий мембрану эндосомы в трубчатый носитель возврата; принимает груз от SNX27–ретромера.</dd></div><div id="ns-g-S3-T57"><dt>Мембрана поры</dt><dd>Сверх программы: участок ядерной оболочки, где наружная и внутренняя мембраны переходят друг в друга и окружают комплекс ядерной поры.</dd></div><div id="ns-g-S3-T58"><dt>Кольца каркаса поры</dt><dd>Сверх программы: цитоплазматическое, внутреннее и ядерное кольца, из которых построен каркас комплекса ядерной поры; внутреннее кольцо встроено в мембрану поры, и его диаметр сильнее всего меняется с натяжением ядерной оболочки.</dd></div><div id="ns-g-S3-T59"><dt>FG-повторы</dt><dd>Сверх программы: участки нуклеопоринов, богатые фенилаланином (F) и глицином (G) и лишённые устойчивой пространственной структуры; заполняют центральный канал поры сетью, которая задерживает крупные инертные молекулы и пропускает транспортные рецепторы.</dd></div><div id="ns-g-S3-T60"><dt>Ядерная корзина</dt><dd>Сверх программы: нити белков, отходящие от ядерного кольца поры в нуклеоплазму.</dd></div><div id="ns-g-S3-T61"><dt>Комплекс LINC</dt><dd>Сверх программы: белковый комплекс, связывающий нуклеоскелет с цитоскелетом через обе мембраны ядерной оболочки и передающий механическую силу на ядро.</dd></div><div id="ns-g-S3-T62"><dt>Капсид ВИЧ-1</dt><dd>Сверх программы: конусовидная белковая оболочка размером около 120 × 60 нм, внутри которой геном вируса иммунодефицита человека переносится к ядру.</dd></div><div id="ns-g-S3-T63"><dt>Светочувствительный модуль Cry2</dt><dd>Сверх программы: белковый модуль растения, который на синем свету сцепляется с такими же модулями; соединённый с другим белком, позволяет светом усиливать сцепление его молекул.</dd></div><div id="ns-g-S3-T64"><dt>Медиатор</dt><dd>Вещество, которое нервное окончание выделяет в синаптическую щель при слиянии синаптических пузырьков с пресинаптической мембраной, например глутамат.</dd></div><div id="ns-g-S3-T65"><dt>Активная зона</dt><dd>Сверх программы: участок пресинаптической мембраны, у которого удерживаются синаптические пузырьки и происходит их слияние.</dd></div><div id="ns-g-S3-T66"><dt>Тетанотоксин</dt><dd>Сверх программы: белковый токсин возбудителя столбняка — протеаза, расщепляющая синаптобревин; без синаптобревина синаптические пузырьки не сливаются с мембраной.</dd></div><div id="ns-g-S3-T67"><dt>Сверхбыстрый эндоцитоз</dt><dd>Сверх программы: захват мембраны на краю активной зоны в первые сотни миллисекунд после выброса медиатора.</dd></div><div id="ns-g-S3-T68"><dt>Геном вируса</dt><dd>Сверх программы: РНК ВИЧ-1 в капсиде; в ядре после обратной транскрипции интегрируется в геном клетки-хозяина.</dd></div><div id="ns-g-S3-T69"><dt>PCSK9</dt><dd>Сверх программы: белок плазмы крови, который связывает рецептор ЛПНП и направляет его в лизосомы на расщепление вместо возврата на поверхность клетки.</dd></div><div id="ns-g-S3-T70"><dt>Ингибитор PCSK9</dt><dd>Сверх программы: вещество, связывающее PCSK9 и тем сохраняющее рецепторы ЛПНП от расщепления; снижает ХС-ЛПНП в крови.</dd></div><div id="ns-g-S3-T71"><dt>Угол замыкания ямки</dt><dd>Сверх программы: угол θ, которым описывают форму решётки как сферического колпачка: 0° — плоская решётка, 90° — полусфера, 180° — замкнутая сфера.</dd></div><div id="ns-g-S3-T72"><dt>Площадь проекции</dt><dd>Сверх программы: площадь пятна, которое решётка занимает на изображении, если смотреть на мембрану снизу; при изгибе решётки она меньше площади самой решётки.</dd></div><div id="ns-g-S3-T73"><dt>Кавеолин</dt><dd>Сверх программы: интегральный белок мембраны, образующий кавеолы; его комплексы встроены в цитоплазматический листок. При распластывании кавеолы кавеолин остаётся в плоской мембране.</dd></div><div id="ns-g-S3-T74"><dt>Кавины</dt><dd>Сверх программы: белки цитоплазмы, которые образуют оболочку кавеолы с цитоплазматической стороны мембраны и вместе с кавеолином поддерживают форму впячивания. При распластывании кавеолы кавины частично отделяются от кавеолина и переходят в цитоплазму.</dd></div><div id="ns-g-S3-T75"><dt>Челночный белок</dt><dd>Белок, у которого есть и сигнал ядерной локализации (NLS), и сигнал ядерного экспорта (NES): импортин переносит его в ядро, экспортин — обратно. Где такого белка больше, определяет соотношение скоростей импорта и экспорта.</dd></div></dl></section></noscript>

. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 77 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Переключатели показывают предсказания учебной модели: её правила заданы заранее, а экспериментальные основания правил рассматриваются на продвинутом уровне; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Внутриклеточный направленный транспорт: сигнальные метки, рецепторы и механизмы везикулярного переноса","stats":[["4 вопроса","от эндоцитоза до ядерной поры"],["Объяснения","с вопросами для самопроверки"],["3 ступени","базовый уровень — к коллоквиуму и зачёту; продвинутый — системные исследования; научные дополнения — по желанию"]],"num_fmt":"БИО-3·{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Все семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →","more_h":"Подробнее — сверх программы"},"lessons":[{"id":"endo-routes","section":0,"questions":[1],"title":"Какие механизмы эндоцитоза различают и по каким признакам","keywords":["эндоцитоз","пиноцитоз","фагоцитоз","клатрин","актин"],"lead":["[[T01|Эндоцитоз]] — общее название путей, которыми вещества поступают в клетку в мембранных пузырьках.","В семинаре рассматриваются пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Эти названия описывают разные признаки — размер и способ образования носителя, узнавание груза рецептором, — поэтому частично перекрываются: фагоцитоз тоже начинается с узнавания частицы рецепторами. Их характеристика — вопрос 8 коллоквиума."],"mechanism":["[[T02|Микропиноцитоз]]: мембрана постоянно образует мелкие пузырьки (< 150 нм) и неспецифически захватывает жидкость.","[[T03|Макропиноцитоз]]: после сигнала фактора роста перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы (> 0,2 мкм).","[[T04|Фагоцитоз]]: псевдоподии фагоцита охватывают крупную частицу, образуется фагосома (> 250 нм).","[[T05|Рецептор-опосредованный эндоцитоз]] в показанном клатрин-зависимом варианте: адаптеры связывают цитоплазматические участки рецепторов с клатриновой оболочкой, и ямка становится покрытой клатрином везикулой."],"paragraphs":["Эндоцитоз делят на пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Кроме того, пути различают по тому, какие белки нужны для образования носителя: клатрин и перестройка актина. Клатрин нужен показанному на схеме пути захвата рецепторного груза; макропиноцитоз и фагоцитоз, в том числе начинающийся с узнавания частицы рецепторами, обходятся без клатрина.","Жидкость с растворёнными веществами клетка поглощает неспецифически: внутрь попадает то, что растворено во внеклеточной среде. Молекулы, для которых на поверхности есть рецепторы, захватываются избирательно и концентрируются в ямке. Крупные частицы — бактерии, обломки клеток, пыль — поглощают главным образом специализированные клетки-фагоциты: макрофаги, нейтрофилы, дендритные клетки.","Мелкие пузырьки микропиноцитоза — менее 150 нм; макропиносомы — более 0,2 мкм, фагосомы — более 250 нм. Макропиносомы и фагосомы образуются из выпячиваний мембраны — складок или псевдоподий, которые создаёт перестройка актина. Такие выпячивания охватывают большие участки мембраны и внеклеточной среды, поэтому макропиносомы и фагосомы значительно крупнее мелких пузырьков микропиноцитоза, которые образуются без такого выпячивания.",{"h":"Как зависимость пути от белка проверяют в эксперименте"},"Белок выключают и смотрят, какие носители перестали образовываться: если без белка носитель не образуется, белок необходим для этого пути. По такому принципу устроен практикум вопроса 1 (вкладка «Эндоцитоз»)."],"conditions":"Размеры носителей приближённые. Модель упрощена: мелкие пузырьки показаны как путь, которому не нужны клатрин и перестройка актина; на самом деле часть мелких пузырьков образуется из клатриновых ямок, а при повышенном натяжении мембраны им нужна и полимеризация актина (продвинутые шаги этого раздела). Схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S3-L01","question":"В клетке нет клатрина. Какой груз клетка по-прежнему сможет поглощать?","options":[{"id":"S3-L01-1","text":"Жидкость с растворёнными веществами","correct":true,"feedback":"Жидкость продолжают захватывать макропиносомы и мелкие носители, которые образуются без клатрина."},{"id":"S3-L01-2","text":"Только молекулы, связанные с рецепторами","correct":false,"feedback":"Наоборот: показанный здесь избирательный захват растворённых молекул, связанных с рецепторами, идёт через клатриновые ямки и без клатрина выпадает."},{"id":"S3-L01-3","text":"Никакой: без клатрина эндоцитоз невозможен","correct":false,"feedback":"Клатрин нужен не всем путям: макропиноцитоз, фагоцитоз и часть мелких пузырьков обходятся без него."}]},"widget":{"kind":"routes","title":"","s":{"title":"Выберите груз и посмотрите, каким носителем он попадёт в клетку","status":"Схема качественная · размеры не в масштабе","modes_label":"Груз","modes":["раствор","раствор + фактор роста","лиганд рецептора","крупная частица"],"out":"внеклеточная среда","cyto":"цитоплазма","m_route":"Механизм","m_carrier":"Носитель","m_size":"Размер","routes":["микропиноцитоз","микро- и макропиноцитоз","рецептор-опосредованный эндоцитоз","фагоцитоз"],"carriers":["мелкие пузырьки","мелкие пузырьки и макропиносомы","покрытые клатрином везикулы","фагосома"],"sizes":["< 150 нм","< 150 нм и > 0,2 мкм","≈ 60–120 нм","> 250 нм"],"notes":["Жидкость захватывается постоянно и неспецифически.","Фактор роста запускает складки мембраны: к мелким пузырькам добавляются крупные макропиносомы.","Рецепторы с лигандом собраны в ямке; клатрин связан с ними через адаптеры.","Псевдоподии фагоцита охватывают частицу; после смыкания их краёв фагосома уходит в цитоплазму (справа)."],"static":["Четыре варианта груза: раствор — мелкие пузырьки < 150 нм; раствор с фактором роста — ещё и макропиносомы > 0,2 мкм; лиганд рецептора — покрытые клатрином везикулы; крупная частица — фагосома > 250 нм."]}},"num":1},{"id":"coated-pit","section":0,"questions":[1],"title":"Как клатриновая ямка собирается вокруг рецептора с грузом","keywords":["клатрин","адаптер","адаптин","рецептор","ямка"],"lead":["Груз попадает в клатриновую ямку не сам: его связывает трансмембранный [[T06|рецептор]], цитоплазматический участок рецептора связывает [[T07|белок-адаптер]], а к адаптеру присоединяется [[T08|клатрин]].","Поэтому рецептор-опосредованный эндоцитоз избирателен: в ямке концентрируются те молекулы, для которых есть рецепторы. Это основа вопроса 9 коллоквиума; что происходит с грузом дальше — вопрос 3 практикума."],"mechanism":["Лиганд связывается с рецептором на наружной стороне мембраны.","Цитоплазматический участок рецептора связывается с белком-адаптером, например адаптином.","Адаптеры привлекают клатрин; клатриновая решётка изгибает мембрану в ямку.","Ямка отделяется как покрытая клатрином везикула, затем оболочка быстро сбрасывается."],"paragraphs":["Клатрин собирается в решётку с цитоплазматической стороны мембраны и изгибает её; с рецепторами груза он связывается не напрямую, а через белки-адаптеры. Работа разделена: рецептор определяет, какой груз будет захвачен, адаптер связывает рецептор с оболочкой, клатрин придаёт мембране форму ямки.","Рецепторы концентрируются в ямке за счёт того, что их цитоплазматические участки связываются с адаптерами. Поэтому груза в ямке больше, чем на соседних участках мембраны, — в этом и состоит избирательность пути.","Отделение покрытой везикулы от мембраны опосредует белок [[T09|динамин]]. Затем клатриновая оболочка быстро сбрасывается, и везикула может слиться с мембраной-мишенью — ранней эндосомой.","Так клетка поглощает, например, белки-переносчики, связанные со своими рецепторами; что происходит с рецептором и лигандом после эндоцитоза — тема вопроса 3 практикума (вопрос 9 коллоквиума). Вспомнить: белки-рецепторы — вопрос 4 коллоквиума.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как эндоцитоз вместе с доставкой и диффузией поддерживает полярный домен мембраны — [[https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes|МБ, семинар 2, шаг 25]]; как захват рецепторов внутрь клетки ослабляет ответ на длительный сигнал — [[https://fresll.github.io/molbio/seminar-3-route.html#desensitization|МБ, семинар 3, шаг 6]]."],"conditions":"Схема упрощена: показаны один тип адаптера и одна оболочка.","sources":["Alberts2022"],"quiz":{"id":"S3-L02","question":"В клетке синтезируется рецептор, у которого удалён цитоплазматический участок, связывающий адаптер; наружный участок связывает лиганд нормально. Что произойдёт с этим рецептором?","options":[{"id":"S3-L02-1","text":"Он перестанет связывать лиганд на поверхности клетки","correct":false,"feedback":"Лиганд связывается наружным участком рецептора, а удалён цитоплазматический участок."},{"id":"S3-L02-2","text":"Он будет связывать лиганд, но не будет концентрироваться в ямках","correct":true,"feedback":"Наружный участок связывает груз, а попадание рецептора в ямку обеспечивает связывание цитоплазматического участка с адаптером."},{"id":"S3-L02-3","text":"Он соберёт клатриновую оболочку вокруг себя без адаптера","correct":false,"feedback":"Клатрин связывается с рецептором через адаптер; без участка для адаптера связи рецептора с оболочкой нет."}]},"widget":{"kind":"pit","title":"","s":{"title":"Пройдите этапы сборки ямки","status":"Схема качественная · не экспериментальные данные","modes_label":"Этап","modes":["лиганд связан с рецепторами","адаптеры связали рецепторы","клатрин изогнул мембрану","везикула отделилась, оболочка сброшена"],"out":"внеклеточная среда","cyto":"цитоплазма","notes":["Рецепторы с лигандом рассеяны по мембране.","Цитоплазматические участки рецепторов связаны с адаптерами.","Клатриновая решётка изгибает мембрану в ямку; рецепторы с грузом собраны в ней.","Покрытая везикула отделилась (с участием динамина), клатриновая оболочка сброшена."],"m_stage":"Что изменилось","static":["Четыре этапа: связывание лиганда с рецептором → связывание рецептора с адаптером → сборка клатриновой решётки и изгиб мембраны → отделение везикулы и потеря оболочки."]}},"num":2},{"id":"actin-uptake","section":0,"questions":[1],"title":"Как перестройка актина образует макропиносомы и фагосомы","keywords":["актин","макропиноцитоз","фагоцитоз","псевдоподии","макрофаг"],"lead":["Макропиносомы и фагосомы образуются не из ямки, а из выпячиваний плазматической мембраны, которые охватывают жидкость или частицу.","Выпячивания — складки при макропиноцитозе и псевдоподии при фагоцитозе — создаёт перестройка актинового цитоскелета."],"mechanism":["Фактор роста запускает перестройку актина под мембраной.","Складки мембраны удлиняются, загибаются и замыкаются, захватывая внеклеточную жидкость, — образуется макропиносома.","Рецепторы фагоцита узнают частицу, например бактерию, покрытую антителами, и актин выталкивает псевдоподии вокруг неё — образуется фагосома.","Без перестройки актина выпячиваний нет, и оба крупных носителя не образуются."],"paragraphs":["При макропиноцитозе складки мембраны захватывают внеклеточную жидкость с растворёнными веществами и антигенами; при фагоцитозе псевдоподии охватывают крупную твёрдую частицу. В обоих случаях носитель образуется из выпячивания мембраны, и выпячивание создаёт перестройка актина.","Макропиноцитоз — регулируемый процесс: в большинстве клеток его запускают сигналы, например макрофагальный колониестимулирующий фактор-1 и эпидермальный фактор роста; активно идёт у макрофагов. Во многих клетках макропиносомы, как и фагосомы, затем сливаются с поздними эндосомами или лизосомами, и их содержимое расщепляется; здесь показан этот вариант.","Фагоцитоз осуществляют главным образом специализированные фагоциты — макрофаги, нейтрофилы и дендритные клетки. Бактерии, покрытые антителами, узнаются рецепторами к Fc-фрагментам антител; небиологические частицы, например угольная пыль, захватываются без участия этих рецепторов.","Вспомнить: актиновые филаменты, их полярность и динамика."],"conditions":"Схема качественная: показано, образуется ли носитель, но не скорость процесса.","sources":["Alberts2022"],"quiz":{"id":"S3-L03","question":"Макрофаг обработали веществом, которое не даёт перестраиваться актиновому цитоскелету, а затем добавили бактерии, покрытые антителами. Что произойдёт с фагоцитозом?","options":[{"id":"S3-L03-1","text":"Бактерии будут поглощены в покрытых клатрином везикулах","correct":false,"feedback":"Фагоцитоз не использует клатриновые ямки, а бактерия намного крупнее покрытой клатрином везикулы."},{"id":"S3-L03-2","text":"Фагоцитоз не изменится: псевдоподии образуются за счёт клатрина","correct":false,"feedback":"Псевдоподии создаёт перестройка актина, а не клатрин; фагоцитоз — клатрин-независимый путь."},{"id":"S3-L03-3","text":"Фагосомы не образуются: без перестройки актина нет псевдоподий","correct":true,"feedback":"Псевдоподии, охватывающие частицу, создаёт перестройка актина; без неё частица не поглощается."}]},"widget":{"kind":"routes","title":"","s":{"title":"Включите и выключите перестройку актина","status":"Схема качественная · не экспериментальные данные","modes_label":"Груз","modes":["раствор + фактор роста","крупная частица"],"map":[1,3],"actin_label":"Перестройка актина","out":"внеклеточная среда","cyto":"цитоплазма","m_route":"Механизм","m_carrier":"Носитель","m_size":"Размер","routes":["микро- и макропиноцитоз","фагоцитоз"],"routes_off":["только микропиноцитоз","нет"],"carriers":["мелкие пузырьки и макропиносомы","фагосома"],"carriers_off":["только мелкие пузырьки","не образуется"],"sizes":["< 150 нм и > 0,2 мкм","> 250 нм"],"sizes_off":["< 150 нм","—"],"notes":["Складки мембраны замыкаются в макропиносомы.","Псевдоподии охватывают частицу; после смыкания их краёв фагосома уходит в цитоплазму (справа)."],"notes_off":["Без перестройки актина складок нет: остаются мелкие пузырьки (по условию модели).","Без перестройки актина псевдоподий нет: частица остаётся снаружи."],"static":["Без перестройки актина не образуются ни макропиносомы, ни фагосомы; мелкие пузырьки по условию модели сохраняются."]}},"num":3},{"id":"lipid-sorting","section":0,"questions":[1],"title":"Отбирает ли клатриновая ямка липиды так же, как белки","keywords":["липиды","клатрин","асимметрия","STED","фосфатидилхолин"],"lead":["Белки-рецепторы концентрируются в клатриновой ямке через адаптеры, а липиды мембраны попадают в неё почти в той же доле, что и в окружающую мембрану.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["В поздних ямках (с динамином) 10 видов липидов распределены почти равномерно: от 0,84 до 1,07 относительно окружающей мембраны (Lennartz et al., 2026).","Насыщенные липиды слегка обогащены в ямке, полиненасыщенные слегка обеднены; различия между видами — до 21 %.","Различия между видами коррелируют с неравным распределением липидов между листками мембраны ([[T12|асимметрией]]) и с их температурой плавления; с числом рецепторов в ямке связь слабая. Проверить, вызывает ли асимметрия эти различия, не удалось."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Груз в клатриновой ямке концентрируют рецепторы и адаптеры (БИО-3·2). Работа отвечает на другой вопрос: переносит ли этот путь мембрану избирательно. После поправки на геометрию ямки сильного обогащения липидов не обнаружено, но разные виды липидных зондов распределяются с небольшими, статистически значимыми различиями — до 21 %. Клатриновый носитель отбирает белки, а липиды несёт почти в том составе, который есть в плазматической мембране.",{"h":"Метод"},"Липидные зонды, близкие к природным, встраивали в наружный листок мембраны клеток меланомы человека SK-MEL2, за 3 секунды сшивали ультрафиолетом с соседними белками и фиксировали. Затем липид и клатрин снимали методом STED — флуоресцентной микроскопией сверхвысокого разрешения — и сравнивали яркость липида в ямке и в окружающей мембране. Стадию ямки определяли по меткам: адаптерный комплекс AP2 и клатрин — ранняя, плюс динамин-2, меченный зелёным флуоресцентным белком (GFP), — поздняя.","Главный контроль — модель. Изогнутая мембрана ямки в проекции даёт больше сигнала, чем плоская, поэтому кажущееся обогащение фосфатидилхолина 16:0 — PC(16:0) — в поздней ямке составило 2,09. Почти такую же величину (2,10) дала модель с равномерно распределённым липидом на реальной геометрии ямок; после поправки на геометрию обогащение близко к 1.","Чего данные не доказывают. Причинную роль асимметрии проверить не удалось: обработка, запускающая перемешивание липидов между листками (приток ионов Ca²⁺ в цитозоль и активация скрамблазы), разбирала поздние ямки примерно вчетверо быстрее, чем шло само перемешивание, поэтому измерить распределение липидов в ямках после перемешивания нельзя. Зонды близки к природным липидам, но не тождественны им; работа выполнена на одной линии клеток."],"conditions":"Lennartz et al., 2026: клетки SK-MEL2 с динамином-2–GFP; 10 бифункциональных липидных зондов; STED; поправка на геометрию по электронно-микроскопическим данным для той же линии. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Lennartz2026"],"quiz":{"id":"S3-L05","question":"В поздних ямках сигнал фосфатидилхолина в 2,09 раза ярче, чем в окружающей мембране, а модель с равномерно распределённым липидом даёт 2,10. Какой вывод допустим?","options":[{"id":"S3-L05-1","text":"Ямка отбирает фосфатидилхолин и концентрирует его вдвое","correct":false,"feedback":"Модель без отбора даёт ту же величину; разница создаётся геометрией ямки, а не отбором."},{"id":"S3-L05-2","text":"Липид распределён почти равномерно; яркость объясняет форма ямки","correct":true,"feedback":"Модель без всякого отбора даёт ту же яркость, значит, избыток сигнала создаёт изогнутая мембрана в проекции (Lennartz et al., 2026)."},{"id":"S3-L05-3","text":"Фосфатидилхолин исключён из клатриновой ямки","correct":false,"feedback":"Измеренный сигнал равен модельному, а не ниже его; исключения нет."}]},"widget":{"kind":"lipids","title":"","s":{"title":"Сравните измеренный сигнал с моделью","status":"Данные Lennartz et al., 2026 · клетки SK-MEL2, поздние ямки","modes_label":"Показать","modes":["кажущееся обогащение","после поправки на геометрию"],"bars":["измерено, фосфатидилхолин 16:0","модель без отбора"],"axis":"сигнал липида в ямке / в окружающей мембране","vals":[2.09,2.1],"range_label":"диапазон значений|для 10 видов липидов|(не доверительный интервал)","range":[0.84,1.07],"one":"1 — как в окружающей мембране","notes":["Без поправки ямка кажется вдвое обогащённой липидом — так же, как в модели без всякого отбора.","После поправки 10 липидов лежат между 0,84 и 1,07: сильного обогащения нет, но небольшие различия между видами статистически значимы."],"static":["Измерено 2,09, модель без отбора 2,10; после поправки на геометрию 10 липидов — от 0,84 до 1,07 (диапазон между видами, не доверительный интервал)."]}},"num":5,"level":"adv"},{"id":"caveolar-endocytosis","section":0,"questions":[1],"title":"Чем кавеола отличается от клатриновой ямки","keywords":["кавеола","кавеолин","кавин","холестерин","EHD2"],"lead":["[[T10|Кавеола]] — впячивание плазматической мембраны из [[T73|кавеолинов]] и [[T74|кавинов]]; по модели авторов, её изгиб и отделение определяются взаимодействием дисков кавеолина с липидами мембраны, прежде всего с холестерином, а не оболочкой с адаптерами, как у клатриновой ямки.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Кавеолин-1 образует диски из 11 молекул, встроенные в цитоплазматический листок; кавины собираются в периферическую оболочку (Parton et al., 2026).","По модели авторов, больше холестерина и гликосфинголипидов — сильнее изгиб и вероятнее отделение кавеолы; меньше холестерина — кавеола распластывается.","Кольца белка EHD2 на шейке ограничивают отделение; без EHD2 кавеолы отделяются чаще. Роль динамина в отделении кавеол оспаривается."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Кавеолы нередко описывают как ещё один путь захвата жидкости мелкими пузырьками. Авторы показывают, что кавеолы устроены и отделяются иначе, чем клатриновые ямки: модельные трансмембранные белки из кавеол исключены, а в каждый момент лишь около 5 % кавеол клетки связаны с ранними эндосомами.","В клатриновом пути оболочка с адаптерами отбирает груз, а ГТФаза динамин сужает шейку. В кавеоле изгиб создаёт сочетание дисков кавеолина с липидами, обогащёнными холестерином и сфингомиелином; по оценке на основе структуры, один диск занимает в цитоплазматическом листке место около 250 молекул липидов. Отделение кавеолы ограничивают кольца EHD2 (белка 2 с EH-доменом) на шейке; динамин, по данным, приведённым в работе, скорее удерживает часть кавеол на мембране.",{"h":"Метод"},"Динамику кавеол изучают по флуоресцентному кавеолину или кавину-1 в живых клетках (лучше — в клетках с отредактированным геномом, без избыточного синтеза белка), электронной микроскопией и по метке, которую добавляют снаружи и затем удаляют с поверхности: остаётся только метка внутри отделившихся кавеол.","Чего данные не доказывают. Главный тезис авторов — кавеола не столько путь для белкового груза, сколько чувствительный к липидам участок поверхности. Это модель, обобщающая эксперименты в культуре клеток; роль кавеолярного эндоцитоза в тканях и набор грузов, которым кавеолы необходимы, остаются открытыми вопросами."],"conditions":"Parton, Kozlov, Lundmark, 2026 — аналитическая статья с авторской моделью (рубрика Perspective): обзор экспериментов в культуре клеток и биофизическая модель авторов. Числа (5 %, 11 молекул, около 250 липидов) — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Parton2026"],"quiz":{"id":"S3-L06","question":"Из мембраны клеток в культуре удалили значительную часть холестерина. Что произойдёт с кавеолами?","options":[{"id":"S3-L06-1","text":"Кавеолы будут чаще отделяться от мембраны","correct":false,"feedback":"Отделение усиливает добавление холестерина, а не его удаление."},{"id":"S3-L06-2","text":"Кавеолы превратятся в клатриновые ямки","correct":false,"feedback":"Кавеолы и клатриновые ямки построены из разных белков; удаление холестерина не переводит одну структуру в другую."},{"id":"S3-L06-3","text":"Кавеолы распластаются","correct":true,"feedback":"Изгиб кавеолы поддерживают липиды, прежде всего холестерин; его снижение вызывает распластывание кавеол (Parton et al., 2026)."}]},"widget":{"kind":"cavlip","title":"","s":{"title":"Измените содержание холестерина в мембране","status":"Качественная схема по модели Parton et al., 2026 · положения переключателя — не измеренные пороги","modes_label":"Холестерин","modes":["снижен","обычный","повышен"],"ehd2":"Кольца EHD2 на шейке","out":"внеклеточная среда","cyto":"цитоплазма","m_shape":"Кавеола в модели","shapes":["распластана","впячена","изгиб сильнее, отделение вероятнее"],"shapes_noehd":["распластана","отделяется чаще","изгиб сильнее, отделение вероятнее"],"notes":["Меньше холестерина — изгиб исчезает, кавеола распластывается.","Обычный состав: кавеола впячена; EHD2 ограничивает отделение.","Больше холестерина — по модели авторов, изгиб усиливается и отделение кавеолы становится вероятнее; EHD2 на шейке этому противодействует."],"note_noehd":"Обычный состав, колец EHD2 нет: кавеолы отделяются от мембраны чаще (Parton et al., 2026).","ehd_hint":"Влияние EHD2 показано при обычном содержании холестерина.","static":["Снижение холестерина — кавеола распластывается; повышение — по модели авторов отделение вероятнее; без EHD2 отделение учащается. Положения переключателя не являются измеренными концентрационными порогами."]}},"num":6,"level":"adv"},{"id":"caveolae-reserve","section":0,"questions":[1],"title":"Как кавеолы защищают мембрану при набухании клетки","keywords":["кавеолы","натяжение","гипоосмотическая среда","кавеолин-1","резерв мембраны"],"lead":["Кавеола — колбовидная инвагинация мембраны, стабилизированная кавеолинами и кавинами; при повышении натяжения она распластывается, и площадь плоской мембраны увеличивается без синтеза новой мембраны.","Ниже — эксперимент, который это показал: сверх программы, на коллоквиуме и зачёте не требуется."],"mechanism":["В гипоосмотической среде вода входит в клетку, и клетка набухает: объём клеток HeLa в среде 30 мОсм (миллиосмоль на литр; обычная среда — около 300 мОсм) за 5 минут вырос на 35 % (Sinha et al., 2011).","Часть кавеол распластывается: кавин-1 отделяется от кавеолина, кавеолин переходит в плоскую мембрану; АТФ и перестройка актина для этого не нужны.","У эндотелиальных клеток мыши без кавеолина-1 при 150 мОсм сила вытягивания мембранной нити выросла на 200 %, мембрана чаще разрывалась; у клеток дикого типа [[T11|натяжение]] почти не менялось. После возврата из среды 30 мОсм в обычную кавеолы за 2–5 минут собирались снова, и для этого нужен АТФ."],"paragraphs":[{"h":"Что уточняет эта работа?"},"Кавеолы служат резервом мембраны; эксперимент показывает, как этот резерв работает и что происходит без него.",{"h":"Метод"},"Натяжение оценивали по силе, с которой мембрана удерживает тонкую нить, вытянутую оптическим пинцетом за приклеенную к мембране бусину: чем выше натяжение, тем больше сила. Число кавеол на поверхности считали флуоресцентной микроскопией полного внутреннего отражения, строение оценивали электронной микроскопией. Контроль — клетки без кавеолина-1 и те же клетки после восстановления его синтеза. Типичный артефакт: сила нити зависит и от сцепления мембраны с цитоскелетом, поэтому сравнивают изменения в первые минуты, пока кортикальный актин не перестраивается.","Распластывание — не эндоцитоз: ингибитор динамина динасор не предотвращал потерю кавеол. Клатриновые ямки при набухании почти не исчезали — не больше одной десятой от числа исчезнувших кавеол — и натяжение не гасили. Распластывание шло и в «сферах» плазматической мембраны, где нет органелл и актиновых филаментов: это собственное механическое свойство кавеол.","Значение для медицины и границы вывода. Миотрубки человека с мутацией кавеолина-3 P28L (замена пролина в положении 28 на лейцин), при которой белок задерживается в аппарате Гольджи, не гасили скачок натяжения и чаще разрывались. Это показано на клетках в культуре; механизм поражения мышцы у больного этим не исчерпывается."],"conditions":"Sinha et al., 2011: клетки HeLa с Cav1-EGFP (30 мОсм, подсчёт кавеол), эндотелий лёгких мыши дикого типа и Cav1−/− (150 мОсм, сила вытягивания нити), миотрубки человека с Cav3 P28L. Числа — из этой работы, каждое со своими условиями. Сверх программы — на коллоквиуме и зачёте не требуется.","sources":["Sinha2011"],"quiz":{"id":"S3-L07","question":"Перед гипоосмотическим шоком клетки дикого типа лишили АТФ. Будут ли кавеолы распластываться?","options":[{"id":"S3-L07-1","text":"Да: распластывание не требует АТФ","correct":true,"feedback":"Распластывание кавеол — пассивный механический ответ: оно шло и в клетках без АТФ, и при разрушенном актине. АТФ нужен для обратной сборки кавеол (Sinha et al., 2011)."},{"id":"S3-L07-2","text":"Нет: без АТФ кавеолы не могут изменить форму","correct":false,"feedback":"АТФ нужен для обратной сборки кавеол после шока, а не для распластывания."},{"id":"S3-L07-3","text":"Нет: кавеолы распластывает динамин за счёт ГТФ","correct":false,"feedback":"Ингибитор динамина динасор не предотвращал потерю кавеол; распластывание — механический ответ на натяжение мембраны."}]},"widget":{"kind":"reserve","title":"","s":{"title":"Перенесите клетки в гипоосмотическую среду","status":"Данные Sinha et al., 2011 · HeLa (30 мОсм, подсчёт кавеол) и эндотелий лёгких мыши (150 мОсм, сила нити)","modes_label":"Клетки","modes":["дикий тип","без кавеолина-1"],"load_label":"Среда","loads":["изоосмотическая","гипоосмотическая"],"out":"внеклеточная среда","cyto":"цитоплазма","m_cav":"Кавеолы","m_force":"Сила вытягивания нити","cav":[["много","часть распластана"],["нет","нет"]],"force":[["исходная","почти не меняется"],["исходная","+200 %"]],"notes":[["Кавеолы хранят запас мембраны.","Кавеолы распластываются — натяжение почти не растёт."],["Кавеол нет.","Запаса нет — натяжение резко растёт, мембрана чаще рвётся."]],"static":["Дикий тип в гипоосмотической среде: кавеолы распластываются, сила почти не меняется. Без кавеолина-1: сила +200 %."]}},"num":7,"level":"adv"},{"id":"caveolae-inverse","section":0,"questions":[1],"num":41,"title":"Видимых кавеол стало меньше — значит ли это, что они ушли внутрь клетки?","keywords":["кавеолы","распластывание","обратная задача","эндоцитоз"],"lead":["Вспомнить: шаг «Как клатриновая ямка собирается вокруг рецептора с грузом» — клатриновая ямка становится носителем и уходит внутрь клетки. Кавеола внешне похожа, но при растяжении может просто распластаться.","Сверх программы — на коллоквиуме и зачёте не требуется."],"mechanism":["Наблюдение: после растяжения или набухания на снимках меньше впячиваний-кавеол.","Объяснение 1: кавеолы распластались — их мембрана перешла в плоскую мембрану; кавеолин остался в ней, кавины частично ушли в цитоплазму.","Объяснение 2: кавеолы отделились и ушли внутрь клетки.","Различают дополнительными наблюдениями: есть ли кавеолы внутри клетки; исчезают ли они, когда отделение пузырьков остановлено; как быстро они возвращаются после снятия нагрузки."],"paragraphs":["Одно и то же наблюдение — впячиваний стало меньше — совместимо с двумя механизмами. Клатриновая ямка — носитель: исчезнув с поверхности, она уходит внутрь клетки. Для кавеол это не обязательно: при механической нагрузке они служат резервом площади мембраны и при растяжении распластываются.",{"h":"Как это узнали"},"В эндотелиальных клетках лёгких мыши после 5 мин в гипоосмотической среде кавеол на снимках электронного микроскопа стало примерно вдвое меньше; кавеолин при этом обнаруживался в плоской мембране. В других клетках при наблюдении поверхности в световом микроскопе вещество, останавливающее отделение пузырьков (ингибитор динамина), потерю кавеол не предотвращало. Через 2–5 мин после возвращения в обычную среду кавеолы собирались вновь. Значит, большая часть исчезнувших кавеол не отделилась, а распласталась.",{"h":"Граница вывода"},"Эндоцитоз кавеол в клетках возможен. Обзор 2026 г. считает его вторичным по значению по сравнению с механическими функциями, а в работе того же года, излагающей модель отделения кавеол, масштаб и роль их эндоцитоза названы во многом неизвестными. Модель отделения кавеол, в которой изгиб задают холестерин и сфингомиелин вместе с дисками кавеолина, а белок шейки ограничивает отделение, — предложенный механизм, а не установленный во всех клетках. Остаются ли распластанные кавеолы участками мембраны особого состава или распадаются на отдельные комплексы кавеолина, пока не решено."],"conditions":"Эндотелиальные клетки лёгких мыши в культуре, гипоосмотическая среда 5 мин, электронная микроскопия; обобщение — по обзорам 2026 г. Схема качественная.","sources":["Sinha2011","Lamaze2026","Parton2026"],"quiz":{"id":"S3-L41","question":"После растяжения клеток впячиваний-кавеол на снимках стало меньше. Какое наб
