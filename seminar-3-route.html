  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join('');
    q += [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join('');
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300]) + snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false);
      q += vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220]) + snarePair(xa, 232, 0, true);
      q += [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('') + snarePair(xa - 2, 318, Math.PI / 2, true) + nsfRing(xa - 28, 318, true);
    } else {
      q += vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]);
      q += [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('') + nsfRing(xa - 46, 336, false);
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);
    /* носитель возврата к поверхности */
    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += receptor(x, Y - 6, -1, false);
      const mol = (xx, yy) => lig === 'asor' ? asorMol(xx, yy) : tfMol(xx, yy, iron);
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join('');
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') for (let a = -0.9; a <= -0.2; a += 0.1) q += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`;
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`;
    segs.forEach(([a, b]) => { const P = stadium(a, b, Yc, H); q += `<path d="M${P.map(([x, y]) => f(x) + ',' + f(y)).join(' L')} Z" fill="${C.lumen}"/>` + bilayerPts(P, { closed: true }); });
    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { q += `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) q += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; });
    const big = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
    const imp = o.noImp ? () => '' : (x, y) => `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`;
    const exp = (x, y) => `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`;
    const sm = pts => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join('');
    const top = [[110, 70], [300, 110], [480, 80]], bot = [[110, 320], [300, 290], [480, 330]];
    let res = {};
    if (cargo === 'small') { q += sm([[70, 60], [150, 100], [260, 70], [340, 120], [450, 60], [540, 110], [80, 300], [170, 340], [270, 300], [350, 350], [460, 290], [540, 340], [206, 196], [394, 206]]); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'big' || cargo === 'mut') { q += top.map(([x, y]) => big(x, y, cargo === 'mut' ? 'mut' : '')).join(''); res = { mode: 'none', where: cargo === 'big' ? 'cytoslow' : 'cyto' }; }
    else if (cargo === 'm27' || cargo === 'm67') { const r = cargo === 'm27' ? 6 : 9.5, g = (x, y) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#7FBF7F" stroke="#3d7a3d" stroke-width="1"/>`;
      q += [[90, 70], [230, 110], [380, 70], [520, 105], [206, 200], [100, 310], [250, 340], [400, 300], [530, 345]].map(([x, y]) => g(x, y)).join(''); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'nls') {
      if (rm === 'imp') { q += top.map(([x, y]) => big(x, y, 'nls')).join(''); res = { mode: 'norec', where: 'cyto' }; }
      else if (rm === 'ran') { q += big(110, 70, 'nls') + imp(110, 70) + big(394, Yc, 'nls') + imp(394, Yc) + big(300, 300, 'nls') + imp(300, 300); res = { mode: 'stuck', where: 'both' }; }
      else { q += big(110, 70, 'nls') + imp(110, 70) + big(206, Yc, 'nls') + imp(206, Yc) + bot.map(([x, y]) => big(x, y, 'nls')).join('') + imp(560, 360); res = { mode: 'imp', where: 'nuc' }; }
    } else {
      if (rm === 'exp' || rm === 'ran') { q += bot.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: rm === 'ran' ? 'noran' : 'norec', where: 'nuc' }; }
      else { q += big(300, 300, 'nes') + exp(300, 300) + big(394, Yc, 'nes') + exp(394, Yc) + top.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: 'exp', where: 'cyto' }; }
    }
    const a = { cyto: [14, 24], nuc: [14, 392], env: [530, Yc - 44], npc: [300, Yc + 62] };
    if (o.ran) {
      const g = (x, y, gtp) => `<circle cx="${x}" cy="${y}" r="6" fill="${gtp ? '#1E7B4A' : '#fff'}" stroke="#1E7B4A" stroke-width="2"/>`;
      q += [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      a.ranC = [300, 50]; a.ranN = [240, 380]; a.gtpN = rm !== 'ran';
    }
    return { s: q, res, a };
  }

  /* ---------- рецептор груза по нормали к мембране (рецензия v0.1, R27) ----------
     recAt: точка (x, y) на средней линии мембраны; th — поворот (градусы) от направления «вверх»; ножка пересекает бислой,
     чаша — в просвете (на глубине depth), адаптер — с цитоплазматической стороны. */
  function recAt(x, y, th, withCargo = true, depth = 15, adapter = true) {
    const top = y - depth;
    return `<g transform="rotate(${f(th)} ${f(x)} ${f(y)})">` +
      `<line x1="${f(x)}" y1="${f(y + 10)}" x2="${f(x)}" y2="${f(top)}" stroke="${C.rec}" stroke-width="3.6" stroke-linecap="round"/>` +
      `<path d="M${f(x - 6)},${f(top)} Q${f(x)},${f(top + 8)} ${f(x + 6)},${f(top)}" fill="none" stroke="${C.rec}" stroke-width="3.6" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${f(x)}" cy="${f(top - 1)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '') +
      (adapter ? `<line x1="${f(x)}" y1="${f(y + 12)}" x2="${f(x)}" y2="${f(y + 20)}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>` : '') + `</g>`;
  }
  /* точка и наружная нормаль полуэллипса ямки: x = c + w·cos a, y = y0 + d·sin a (a от π до 0) */
  const pitPt = (c, y0, w, d, a) => { const x = c + w * Math.cos(a), y = y0 + d * Math.sin(a); let nx = (x - c) / (w * w), ny = (y - y0) / (d * d); const n = Math.hypot(nx, ny) || 1; return { x, y, nx: nx / n, ny: ny / n }; };
  const thIn = (nx, ny) => Math.atan2(-nx, ny) * 180 / Math.PI;   /* поворот «вверх» → внутрь ямки (против наружной нормали) */
  function recOnPit(c, y0, w, d, as, withCargo = true) {
    return as.map(a => { const p = pitPt(c, y0, w, d, a); return recAt(p.x, p.y, thIn(p.nx, p.ny), withCargo); }).join('');
  }
  function clathOnPit(c, y0, w, d, off = 27, n = 13, color = C.clath) {
    let q = ''; for (let i = 1; i < n; i++) { const p = pitPt(c, y0, w, d, Math.PI - Math.PI * i / n); q += `<circle cx="${f(p.x + p.nx * off)}" cy="${f(p.y + p.ny * off)}" r="3.6" fill="${color}"/>`; }
    return q;
  }
  /* везикула с рецепторами в мембране: phis — направления (градусы) от центра; coat — цвет оболочки (null — без оболочки) */
  function recRadial(cx, cy, R, phis, withCargo = true, adapter = true) {
    const depth = Math.min(15, R - 10);
    return phis.map(ph => { const t = ph * Math.PI / 180, nx = Math.cos(t), ny = Math.sin(t); return recAt(cx + R * nx, cy + R * ny, thIn(nx, ny), withCargo, depth, adapter); }).join('');
  }
  function vesicleRec(cx, cy, R = 26, coat = null, phis = [90, 210, 330], withCargo = true) {
    let q = '';
    if (coat) { const out = R + 26, n = Math.round(2 * Math.PI * out / 11); for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI; q += `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${coat}"/>`; } }
    q += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` + bilayerPts(circlePts(cx, cy, R), { closed: true });
    const depth = Math.min(15, R - 10);
    phis.forEach(ph => { const t = ph * Math.PI / 180, nx = Math.cos(t), ny = Math.sin(t); q += recAt(cx + R * nx, cy + R * ny, thIn(nx, ny), withCargo, depth, !!coat); });
    return q;
  }

W.routes = ({S, s, set, out, onGroup, onCheck}) => {

/* W.zipper — сборка SNARE-комплекса (Jahn et al., 2024): 0 — порознь, 1 — trans-комплекс, 2 — слияние, cis-комплекс, 3 — разборка NSF */
W.zipper = ({S, s, set, out, onGroup}) => {
  /* Ориентация по Jahn et al., 2024 (рецензия v1.0, аудит А1-23): SNARE-мотивы параллельны, N-концы — с одной стороны пучка,
     C-концы — у мембран; R-SNARE заякорен в мембране носителя, Qa (синтаксин) — в мембране мишени; Qb и Qc — два мотива SNAP25,
     прикреплённого к мембране мишени без трансмембранного участка; цепь SNAP25 непрерывна: Qb → линкер с пальмитоильными якорями → Qc (аудит А2-09). */
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('zp-mode', S.modes, s.mode, S.modes_label));
  const Ym = 250, top = Ym - BF.MEM.h / 2;
  const flatM = () => { const P = []; for (let x = 4; x <= 596; x += 3) P.push([x, Ym]); return P; };
  const helixV = (x, y1, y2, c, w = 3) => `<path d="M${x},${y1} ${Array.from({ length: 6 }, (_, i) => { const y = y1 + (y2 - y1) * (i + 1) / 6; return `Q${x + (i % 2 ? -6 : 6)},${(y1 + (y2 - y1) * (i + .5) / 6).toFixed(1)} ${x},${y.toFixed(1)}`; }).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
  const helixH = (x1, x2, y, c, w = 2.6) => `<path d="M${x1},${y} ${Array.from({ length: 8 }, (_, i) => { const x = x1 + (x2 - x1) * (i + 1) / 8; return `Q${(x1 + (x2 - x1) * (i + .5) / 8).toFixed(1)},${y + (i % 2 ? -3.5 : 3.5)} ${x.toFixed(1)},${y}`; }).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
  const tm = (x1, y1, x2, y2, c) => line(x1, y1, x2, y2, c, 4.2, 'stroke-linecap="round"');          /* трансмембранный участок */
  const lk = (x1, y1, x2, y2, c) => line(x1, y1, x2, y2, c, 2, 'stroke-linecap="round"');            /* линкер */
  const palm = (x, y) => circ(x, y, 2.6, '#7A4E12');                                                  /* пальмитоильный якорь линкера SNAP25 (А2-09) */
  /* SNAP25 — одна цепь: N → Qb → линкер с пальмитоильными якорями у мембраны → Qc → C (вертикальная запись, свободные SNARE) */
  const snap25V = (xb, xc) => helixV(xb, top - 54, top - 14, Q[1]) + `<path d="M${xb},${top - 14} Q${xb + 2},${top - 4} ${xb + 8},${top - 4} L${xc - 8},${top - 4} Q${xc + 6},${top - 8} ${xc},${top - 58}" fill="none" stroke="${Q[1]}" stroke-width="2" stroke-dasharray="4 2"/>` +
    palm(xb + 10, top - 2) + palm(xb + 17, top - 2) + palm(xb + 24, top - 2) + helixV(xc, top - 58, top - 18, Q[2]) + NC(xb - 11, top - 48, 'N') + NC(xc + 10, top - 12, 'C');
  /* SNAP25 в горизонтальном пучке: Qb (N слева → C справа), линкер от C-конца Qb к мембране и вдоль неё назад к N-концу Qc */
  const snap25H = (x1, x2, yb, yc) => `<path d="M${x2},${yb} Q${x2 + 8},${yb + 6} ${x2 + 4},${top - 4} L${x1 + 4},${top - 4} Q${x1 - 14},${top - 6} ${x1},${yc}" fill="none" stroke="${Q[1]}" stroke-width="2" stroke-dasharray="4 2"/>` +
    palm(x2 - 6, top - 2) + palm(x2 - 14, top - 2) + palm(x2 - 22, top - 2);
  const NC = (x, y, s) => txc(x, y, s, 12, 'middle', '#6b7a8c');
  const R = BF.C.snareV, Q = ['#1F3B73', '#2E6FA8', '#5B9BD5'];
  const draw = () => {
    const m = s.mode;
    let d = rect(0, 0, 600, 360, '#fbfcfe', 0) + rect(0, Ym + BF.MEM.h / 2, 600, 360, '#f4f7fb', 0);
    d += txc(12, 22, S.cyto, 13, 'start', '#6b7a8c') + txc(12, 350, S.lumen, 13, 'start', '#6b7a8c');
    d += BF.bilayerPts(flatM());
    if (m === 0) {
      /* SNARE порознь: R-SNARE на носителе, синтаксин (Qa) и SNAP25 (Qb, Qc) на мишени; N-концы свободны */
      d += BF.vesicle(300, 92, 56, null, 0) + tm(300, 140, 300, 158, R) + helixV(300, 160, 204, R) + NC(312, 212, 'N');
      d += tm(236, Ym - 10, 236, Ym + 10, Q[0]) + helixV(236, top - 6, top - 52, Q[0]) + NC(236, top - 58, 'N');
      d += snap25V(392, 426);
      d += txc(326, 168, S.l_r, 13, 'start', R) + S.l_q.split('|').map((q, i) => txc(446, top - 50 + i * 17, q, 13, 'start', '#1F3B73')).join('');
    } else if (m === 1) {
      /* trans-комплекс: пучок параллелен мембранам, N-концы слева, C-концы у места сближения мембран */
      d += BF.vesicle(318, 150, 56, null, 0);
      const ys = [196, 202, 208, 214], x1 = 132, x2 = 236;
      d += helixH(x1, x2, ys[0], R) + helixH(x1, x2, ys[1], Q[0]) + helixH(x1, x2, ys[2], Q[1]) + helixH(x1, x2, ys[3], Q[2]);
      const vx = 318 - 56 * Math.cos(Math.PI / 4), vy = 150 + 56 * Math.sin(Math.PI / 4);   /* точка мембраны носителя внизу слева */
      d += lk(x2, ys[0], vx - 9, vy + 9, R) + tm(vx - 7, vy + 7, vx + 7, vy - 7, R);
      d += lk(x2, ys[1], 252, Ym - 12, Q[0]) + tm(252, Ym - 10, 252, Ym + 10, Q[0]);
      d += snap25H(x1, x2, ys[2], ys[3]);
      d += NC(x1 - 10, 209, 'N') + NC(x2 - 10, 188, 'C');
      d += arrow(140, 172, 220, 172, '#7A8899', 2) + txc(40, 158, S.l_zip, 13, 'start', '#15202b');
    } else if (m === 2) {
      /* после слияния: все участники в одной мембране (cis-комплекс) */
      const ys = [192, 198, 204, 210], x1 = 196, x2 = 288;
      d += helixH(x1, x2, ys[0], R) + helixH(x1, x2, ys[1], Q[0]) + helixH(x1, x2, ys[2], Q[1]) + helixH(x1, x2, ys[3], Q[2]);
