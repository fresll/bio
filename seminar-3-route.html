<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-3.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Внутриклеточный направленный транспорт: сигнальные метки, рецепторы и механизмы везикулярного переноса</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-endo-routes"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 1 из 45</div><h2>Какие механизмы эндоцитоза различают и по каким признакам</h2><p class="lead"><a href="#ns-g-S3-T01">Эндоцитоз</a> — общее название путей, которыми вещества поступают в клетку в мембранных пузырьках. В семинаре рассматриваются пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Эти названия описывают разные признаки — размер и способ образования носителя, узнавание груза рецептором, — поэтому частично перекрываются: фагоцитоз тоже начинается с узнавания частицы рецепторами. Их характеристика — вопрос 8 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Четыре варианта груза: раствор — мелкие пузырьки &lt; 150 нм; раствор с фактором роста — ещё и макропиносомы &gt; 0,2 мкм; лиганд рецептора — покрытые клатрином везикулы; крупная частица — фагосома &gt; 250 нм.</div><ol class="mech"><li><a href="#ns-g-S3-T02">Микропиноцитоз</a>: мембрана постоянно образует мелкие пузырьки (&lt; 150 нм) и неспецифически захватывает жидкость.</li><li><a href="#ns-g-S3-T03">Макропиноцитоз</a>: после сигнала фактора роста перестройка актина создаёт складки мембраны, которые замыкаются в макропиносомы (&gt; 0,2 мкм).</li><li><a href="#ns-g-S3-T04">Фагоцитоз</a>: псевдоподии фагоцита охватывают крупную частицу, образуется фагосома (&gt; 250 нм).</li><li><a href="#ns-g-S3-T05">Рецептор-опосредованный эндоцитоз</a> в показанном клатрин-зависимом варианте: адаптеры связывают цитоплазматические участки рецепторов с клатриновой оболочкой, и ямка становится покрытой клатрином везикулой.</li></ol><p>Эндоцитоз делят на пиноцитоз (микро- и макропиноцитоз), фагоцитоз и рецептор-опосредованный эндоцитоз. Кроме того, пути различают по тому, какие белки нужны для образования носителя: клатрин и перестройка актина. Клатрин нужен показанному на схеме пути захвата рецепторного груза; макропиноцитоз и фагоцитоз, в том числе начинающийся с узнавания частицы рецепторами, обходятся без клатрина.</p><p>Жидкость с растворёнными веществами клетка поглощает неспецифически: внутрь попадает то, что растворено во внеклеточной среде. Молекулы, для которых на поверхности есть рецепторы, захватываются избирательно и концентрируются в ямке. Крупные частицы — бактерии, обломки клеток, пыль — поглощают главным образом специализированные клетки-фагоциты: макрофаги, нейтрофилы, дендритные клетки.</p><p>Мелкие пузырьки микропиноцитоза — менее 150 нм; макропиносомы — более 0,2 мкм, фагосомы — более 250 нм. Макропиносомы и фагосомы образуются из выпячиваний мембраны — складок или псевдоподий, которые создаёт перестройка актина. Такие выпячивания охватывают большие участки мембраны и внеклеточной среды, поэтому макропиносомы и фагосомы значительно крупнее мелких пузырьков микропиноцитоза, которые образуются без такого выпячивания.</p><h3>Как зависимость пути от белка проверяют в эксперименте</h3><p>Белок выключают и смотрят, какие носители перестали образовываться: если без белка носитель не образуется, белок необходим для этого пути. По такому принципу устроен практикум вопроса 1 (вкладка «Эндоцитоз»).</p><div class="static-quiz"><h3>В клетке нет клатрина. Какой груз клетка по-прежнему сможет поглощать?</h3><ol><li><b>А.</b> Жидкость с растворёнными веществами <i>(верный вариант)</i><br><span class="expl">Жидкость продолжают захватывать макропиносомы и мелкие носители, которые образуются без клатрина.</span></li><li><b>Б.</b> Только молекулы, связанные с рецепторами <i>(неверный вариант)</i><br><span class="expl">Наоборот: показанный здесь избирательный захват растворённых молекул, связанных с рецепторами, идёт через клатриновые ямки и без клатрина выпадает.</span></li><li><b>В.</b> Никакой: без клатрина эндоцитоз невозможен <i>(неверный вариант)</i><br><span class="expl">Клатрин нужен не всем путям: макропиноцитоз, фагоцитоз и часть мелких пузырьков обходятся без него.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Размеры носителей приближённые. Модель упрощена: мелкие пузырьки показаны как путь, которому не нужны клатрин и перестройка актина; на самом деле часть мелких пузырьков образуется из клатриновых ямок, а при повышенном натяжении мембраны им нужна и полимеризация актина (продвинутые шаги этого раздела). Схема качественная.</p></details></article><article class="card print-unit" id="ns-coated-pit"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 2 из 45</div><h2>Как клатриновая ямка собирается вокруг рецептора с грузом</h2><p class="lead">Груз попадает в клатриновую ямку не сам: его связывает трансмембранный <a href="#ns-g-S3-T06">рецептор</a>, цитоплазматический участок рецептора связывает <a href="#ns-g-S3-T07">белок-адаптер</a>, а к адаптеру присоединяется <a href="#ns-g-S3-T08">клатрин</a>. Поэтому рецептор-опосредованный эндоцитоз избирателен: в ямке концентрируются те молекулы, для которых есть рецепторы. Это основа вопроса 9 коллоквиума; что происходит с грузом дальше — вопрос 3 практикума.</p><div class="note"><strong>Что показывает схема.</strong> Четыре этапа: связывание лиганда с рецептором → связывание рецептора с адаптером → сборка клатриновой решётки и изгиб мембраны → отделение везикулы и потеря оболочки.</div><ol class="mech"><li>Лиганд связывается с рецептором на наружной стороне мембраны.</li><li>Цитоплазматический участок рецептора связывается с белком-адаптером, например адаптином.</li><li>Адаптеры привлекают клатрин; клатриновая решётка изгибает мембрану в ямку.</li><li>Ямка отделяется как покрытая клатрином везикула, затем оболочка быстро сбрасывается.</li></ol><p>Клатрин собирается в решётку с цитоплазматической стороны мембраны и изгибает её; с рецепторами груза он связывается не напрямую, а через белки-адаптеры. Работа разделена: рецептор определяет, какой груз будет захвачен, адаптер связывает рецептор с оболочкой, клатрин придаёт мембране форму ямки.</p><p>Рецепторы концентрируются в ямке за счёт того, что их цитоплазматические участки связываются с адаптерами. Поэтому груза в ямке больше, чем на соседних участках мембраны, — в этом и состоит избирательность пути.</p><p>Отделение покрытой везикулы от мембраны опосредует белок <a href="#ns-g-S3-T09">динамин</a>. Затем клатриновая оболочка быстро сбрасывается, и везикула может слиться с мембраной-мишенью — ранней эндосомой.</p><p>Так клетка поглощает, например, белки-переносчики, связанные со своими рецепторами; что происходит с рецептором и лигандом после эндоцитоза — тема вопроса 3 практикума (вопрос 9 коллоквиума). Вспомнить: белки-рецепторы — вопрос 4 коллоквиума.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как эндоцитоз вместе с доставкой и диффузией поддерживает полярный домен мембраны — <a href="https://fresll.github.io/molbio/seminar-2-route.html#three-fluxes">МБ, семинар 2, шаг 25</a>; как захват рецепторов внутрь клетки ослабляет ответ на длительный сигнал — <a href="https://fresll.github.io/molbio/seminar-3-route.html#desensitization">МБ, семинар 3, шаг 6</a>.</p><div class="static-quiz"><h3>В клетке синтезируется рецептор, у которого удалён цитоплазматический участок, связывающий адаптер; наружный участок связывает лиганд нормально. Что произойдёт с этим рецептором?</h3><ol><li><b>А.</b> Он перестанет связывать лиганд на поверхности клетки <i>(неверный вариант)</i><br><span class="expl">Лиганд связывается наружным участком рецептора, а удалён цитоплазматический участок.</span></li><li><b>Б.</b> Он будет связывать лиганд, но не будет концентрироваться в ямках <i>(верный вариант)</i><br><span class="expl">Наружный участок связывает груз, а попадание рецептора в ямку обеспечивает связывание цитоплазматического участка с адаптером.</span></li><li><b>В.</b> Он соберёт клатриновую оболочку вокруг себя без адаптера <i>(неверный вариант)</i><br><span class="expl">Клатрин связывается с рецептором через адаптер; без участка для адаптера связи рецептора с оболочкой нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема упрощена: показаны один тип адаптера и одна оболочка.</p></details></article><article class="card print-unit" id="ns-actin-uptake"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 3 из 45</div><h2>Как перестройка актина образует макропиносомы и фагосомы</h2><p class="lead">Макропиносомы и фагосомы образуются не из ямки, а из выпячиваний плазматической мембраны, которые охватывают жидкость или частицу. Выпячивания — складки при макропиноцитозе и псевдоподии при фагоцитозе — создаёт перестройка актинового цитоскелета.</p><div class="note"><strong>Что показывает схема.</strong> Без перестройки актина не образуются ни макропиносомы, ни фагосомы; мелкие пузырьки по условию модели сохраняются.</div><ol class="mech"><li>Фактор роста запускает перестройку актина под мембраной.</li><li>Складки мембраны удлиняются, загибаются и замыкаются, захватывая внеклеточную жидкость, — образуется макропиносома.</li><li>Рецепторы фагоцита узнают частицу, например бактерию, покрытую антителами, и актин выталкивает псевдоподии вокруг неё — образуется фагосома.</li><li>Без перестройки актина выпячиваний нет, и оба крупных носителя не образуются.</li></ol><p>При макропиноцитозе складки мембраны захватывают внеклеточную жидкость с растворёнными веществами и антигенами; при фагоцитозе псевдоподии охватывают крупную твёрдую частицу. В обоих случаях носитель образуется из выпячивания мембраны, и выпячивание создаёт перестройка актина.</p><p>Макропиноцитоз — регулируемый процесс: в большинстве клеток его запускают сигналы, например макрофагальный колониестимулирующий фактор-1 и эпидермальный фактор роста; активно идёт у макрофагов. Во многих клетках макропиносомы, как и фагосомы, затем сливаются с поздними эндосомами или лизосомами, и их содержимое расщепляется; здесь показан этот вариант.</p><p>Фагоцитоз осуществляют главным образом специализированные фагоциты — макрофаги, нейтрофилы и дендритные клетки. Бактерии, покрытые антителами, узнаются рецепторами к Fc-фрагментам антител; небиологические частицы, например угольная пыль, захватываются без участия этих рецепторов.</p><p>Вспомнить: актиновые филаменты, их полярность и динамика.</p><div class="static-quiz"><h3>Макрофаг обработали веществом, которое не даёт перестраиваться актиновому цитоскелету, а затем добавили бактерии, покрытые антителами. Что произойдёт с фагоцитозом?</h3><ol><li><b>А.</b> Бактерии будут поглощены в покрытых клатрином везикулах <i>(неверный вариант)</i><br><span class="expl">Фагоцитоз не использует клатриновые ямки, а бактерия намного крупнее покрытой клатрином везикулы.</span></li><li><b>Б.</b> Фагоцитоз не изменится: псевдоподии образуются за счёт клатрина <i>(неверный вариант)</i><br><span class="expl">Псевдоподии создаёт перестройка актина, а не клатрин; фагоцитоз — клатрин-независимый путь.</span></li><li><b>В.</b> Фагосомы не образуются: без перестройки актина нет псевдоподий <i>(верный вариант)</i><br><span class="expl">Псевдоподии, охватывающие частицу, создаёт перестройка актина; без неё частица не поглощается.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: показано, образуется ли носитель, но не скорость процесса.</p></details></article><article class="card print-unit" id="ns-lipid-sorting"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 4 из 45</div><h2>Отбирает ли клатриновая ямка липиды так же, как белки</h2><p class="lead">Белки-рецепторы концентрируются в клатриновой ямке через адаптеры, а липиды мембраны попадают в неё почти в той же доле, что и в окружающую мембрану. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Измерено 2,09, модель без отбора 2,10; после поправки на геометрию 10 липидов — от 0,84 до 1,07 (диапазон между видами, не доверительный интервал).</div><ol class="mech"><li>В поздних ямках (с динамином) 10 видов липидов распределены почти равномерно: от 0,84 до 1,07 относительно окружающей мембраны (Lennartz et al., 2026).</li><li>Насыщенные липиды слегка обогащены в ямке, полиненасыщенные слегка обеднены; различия между видами — до 21 %.</li><li>Различия между видами коррелируют с неравным распределением липидов между листками мембраны (<a href="#ns-g-S3-T12">асимметрией</a>) и с их температурой плавления; с числом рецепторов в ямке связь слабая. Проверить, вызывает ли асимметрия эти различия, не удалось.</li></ol><h3>Что уточняет эта работа?</h3><p>Груз в клатриновой ямке концентрируют рецепторы и адаптеры (БИО-3·2). Работа отвечает на другой вопрос: переносит ли этот путь мембрану избирательно. После поправки на геометрию ямки сильного обогащения липидов не обнаружено, но разные виды липидных зондов распределяются с небольшими, статистически значимыми различиями — до 21 %. Клатриновый носитель отбирает белки, а липиды несёт почти в том составе, который есть в плазматической мембране.</p><h3>Метод</h3><p>Липидные зонды, близкие к природным, встраивали в наружный листок мембраны клеток меланомы человека SK-MEL2, за 3 секунды сшивали ультрафиолетом с соседними белками и фиксировали. Затем липид и клатрин снимали методом STED — флуоресцентной микроскопией сверхвысокого разрешения — и сравнивали яркость липида в ямке и в окружающей мембране. Стадию ямки определяли по меткам: адаптерный комплекс AP2 и клатрин — ранняя, плюс динамин-2, меченный зелёным флуоресцентным белком (GFP), — поздняя.</p><p>Главный контроль — модель. Изогнутая мембрана ямки в проекции даёт больше сигнала, чем плоская, поэтому кажущееся обогащение фосфатидилхолина 16:0 — PC(16:0) — в поздней ямке составило 2,09. Почти такую же величину (2,10) дала модель с равномерно распределённым липидом на реальной геометрии ямок; после поправки на геометрию обогащение близко к 1.</p><p>Чего данные не доказывают. Причинную роль асимметрии проверить не удалось: обработка, запускающая перемешивание липидов между листками (приток ионов Ca²⁺ в цитозоль и активация скрамблазы), разбирала поздние ямки примерно вчетверо быстрее, чем шло само перемешивание, поэтому измерить распределение липидов в ямках после перемешивания нельзя. Зонды близки к природным липидам, но не тождественны им; работа выполнена на одной линии клеток.</p><div class="static-quiz"><h3>В поздних ямках сигнал фосфатидилхолина в 2,09 раза ярче, чем в окружающей мембране, а модель с равномерно распределённым липидом даёт 2,10. Какой вывод допустим?</h3><ol><li><b>А.</b> Ямка отбирает фосфатидилхолин и концентрирует его вдвое <i>(неверный вариант)</i><br><span class="expl">Модель без отбора даёт ту же величину; разница создаётся геометрией ямки, а не отбором.</span></li><li><b>Б.</b> Липид распределён почти равномерно; яркость объясняет форма ямки <i>(верный вариант)</i><br><span class="expl">Модель без всякого отбора даёт ту же яркость, значит, избыток сигнала создаёт изогнутая мембрана в проекции (Lennartz et al., 2026).</span></li><li><b>В.</b> Фосфатидилхолин исключён из клатриновой ямки <i>(неверный вариант)</i><br><span class="expl">Измеренный сигнал равен модельному, а не ниже его; исключения нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-026-02068-7">Lennartz H. M. et al. Quantification of lipid sorting during clathrin-mediated endocytosis. Nat Cell Biol. 2026;28:2027–2035</a></li></ul><p>Lennartz et al., 2026: клетки SK-MEL2 с динамином-2–GFP; 10 бифункциональных липидных зондов; STED; поправка на геометрию по электронно-микроскопическим данным для той же линии. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-caveolar-endocytosis"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 5 из 45</div><h2>Чем кавеола отличается от клатриновой ямки</h2><p class="lead"><a href="#ns-g-S3-T10">Кавеола</a> — впячивание плазматической мембраны из <a href="#ns-g-S3-T73">кавеолинов</a> и <a href="#ns-g-S3-T74">кавинов</a>; по модели авторов, её изгиб и отделение определяются взаимодействием дисков кавеолина с липидами мембраны, прежде всего с холестерином, а не оболочкой с адаптерами, как у клатриновой ямки. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Снижение холестерина — кавеола распластывается; повышение — по модели авторов отделение вероятнее; без EHD2 отделение учащается. Положения переключателя не являются измеренными концентрационными порогами.</div><ol class="mech"><li>Кавеолин-1 образует диски из 11 молекул, встроенные в цитоплазматический листок; кавины собираются в периферическую оболочку (Parton et al., 2026).</li><li>По модели авторов, больше холестерина и гликосфинголипидов — сильнее изгиб и вероятнее отделение кавеолы; меньше холестерина — кавеола распластывается.</li><li>Кольца белка EHD2 на шейке ограничивают отделение; без EHD2 кавеолы отделяются чаще. Роль динамина в отделении кавеол оспаривается.</li></ol><h3>Что уточняет эта работа?</h3><p>Кавеолы нередко описывают как ещё один путь захвата жидкости мелкими пузырьками. Авторы показывают, что кавеолы устроены и отделяются иначе, чем клатриновые ямки: модельные трансмембранные белки из кавеол исключены, а в каждый момент лишь около 5 % кавеол клетки связаны с ранними эндосомами.</p><p>В клатриновом пути оболочка с адаптерами отбирает груз, а ГТФаза динамин сужает шейку. В кавеоле изгиб создаёт сочетание дисков кавеолина с липидами, обогащёнными холестерином и сфингомиелином; по оценке на основе структуры, один диск занимает в цитоплазматическом листке место около 250 молекул липидов. Отделение кавеолы ограничивают кольца EHD2 (белка 2 с EH-доменом) на шейке; динамин, по данным, приведённым в работе, скорее удерживает часть кавеол на мембране.</p><h3>Метод</h3><p>Динамику кавеол изучают по флуоресцентному кавеолину или кавину-1 в живых клетках (лучше — в клетках с отредактированным геномом, без избыточного синтеза белка), электронной микроскопией и по метке, которую добавляют снаружи и затем удаляют с поверхности: остаётся только метка внутри отделившихся кавеол.</p><p>Чего данные не доказывают. Главный тезис авторов — кавеола не столько путь для белкового груза, сколько чувствительный к липидам участок поверхности. Это модель, обобщающая эксперименты в культуре клеток; роль кавеолярного эндоцитоза в тканях и набор грузов, которым кавеолы необходимы, остаются открытыми вопросами.</p><div class="static-quiz"><h3>Из мембраны клеток в культуре удалили значительную часть холестерина. Что произойдёт с кавеолами?</h3><ol><li><b>А.</b> Кавеолы будут чаще отделяться от мембраны <i>(неверный вариант)</i><br><span class="expl">Отделение усиливает добавление холестерина, а не его удаление.</span></li><li><b>Б.</b> Кавеолы превратятся в клатриновые ямки <i>(неверный вариант)</i><br><span class="expl">Кавеолы и клатриновые ямки построены из разных белков; удаление холестерина не переводит одну структуру в другую.</span></li><li><b>В.</b> Кавеолы распластаются <i>(верный вариант)</i><br><span class="expl">Изгиб кавеолы поддерживают липиды, прежде всего холестерин; его снижение вызывает распластывание кавеол (Parton et al., 2026).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-026-01945-5">Parton R. G., Kozlov M. M., Lundmark R. A lipid-centric view of endocytosis by caveolae. Nat Cell Biol. 2026;28:852–860</a></li></ul><p>Parton, Kozlov, Lundmark, 2026 — аналитическая статья с авторской моделью (рубрика Perspective): обзор экспериментов в культуре клеток и биофизическая модель авторов. Числа (5 %, 11 молекул, около 250 липидов) — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-caveolae-reserve"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 6 из 45</div><h2>Как кавеолы защищают мембрану при набухании клетки</h2><p class="lead">Кавеола — колбовидная инвагинация мембраны, стабилизированная кавеолинами и кавинами; при повышении натяжения она распластывается, и площадь плоской мембраны увеличивается без синтеза новой мембраны. Ниже — эксперимент, который это показал: сверх программы, на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Дикий тип в гипоосмотической среде: кавеолы распластываются, сила почти не меняется. Без кавеолина-1: сила +200 %.</div><ol class="mech"><li>В гипоосмотической среде вода входит в клетку, и клетка набухает: объём клеток HeLa в среде 30 мОсм (миллиосмоль на литр; обычная среда — около 300 мОсм) за 5 минут вырос на 35 % (Sinha et al., 2011).</li><li>Часть кавеол распластывается: кавин-1 отделяется от кавеолина, кавеолин переходит в плоскую мембрану; АТФ и перестройка актина для этого не нужны.</li><li>У эндотелиальных клеток мыши без кавеолина-1 при 150 мОсм сила вытягивания мембранной нити выросла на 200 %, мембрана чаще разрывалась; у клеток дикого типа <a href="#ns-g-S3-T11">натяжение</a> почти не менялось. После возврата из среды 30 мОсм в обычную кавеолы за 2–5 минут собирались снова, и для этого нужен АТФ.</li></ol><h3>Что уточняет эта работа?</h3><p>Кавеолы служат резервом мембраны; эксперимент показывает, как этот резерв работает и что происходит без него.</p><h3>Метод</h3><p>Натяжение оценивали по силе, с которой мембрана удерживает тонкую нить, вытянутую оптическим пинцетом за приклеенную к мембране бусину: чем выше натяжение, тем больше сила. Число кавеол на поверхности считали флуоресцентной микроскопией полного внутреннего отражения, строение оценивали электронной микроскопией. Контроль — клетки без кавеолина-1 и те же клетки после восстановления его синтеза. Типичный артефакт: сила нити зависит и от сцепления мембраны с цитоскелетом, поэтому сравнивают изменения в первые минуты, пока кортикальный актин не перестраивается.</p><p>Распластывание — не эндоцитоз: ингибитор динамина динасор не предотвращал потерю кавеол. Клатриновые ямки при набухании почти не исчезали — не больше одной десятой от числа исчезнувших кавеол — и натяжение не гасили. Распластывание шло и в «сферах» плазматической мембраны, где нет органелл и актиновых филаментов: это собственное механическое свойство кавеол.</p><p>Значение для медицины и границы вывода. Миотрубки человека с мутацией кавеолина-3 P28L (замена пролина в положении 28 на лейцин), при которой белок задерживается в аппарате Гольджи, не гасили скачок натяжения и чаще разрывались. Это показано на клетках в культуре; механизм поражения мышцы у больного этим не исчерпывается.</p><div class="static-quiz"><h3>Перед гипоосмотическим шоком клетки дикого типа лишили АТФ. Будут ли кавеолы распластываться?</h3><ol><li><b>А.</b> Да: распластывание не требует АТФ <i>(верный вариант)</i><br><span class="expl">Распластывание кавеол — пассивный механический ответ: оно шло и в клетках без АТФ, и при разрушенном актине. АТФ нужен для обратной сборки кавеол (Sinha et al., 2011).</span></li><li><b>Б.</b> Нет: без АТФ кавеолы не могут изменить форму <i>(неверный вариант)</i><br><span class="expl">АТФ нужен для обратной сборки кавеол после шока, а не для распластывания.</span></li><li><b>В.</b> Нет: кавеолы распластывает динамин за счёт ГТФ <i>(неверный вариант)</i><br><span class="expl">Ингибитор динамина динасор не предотвращал потерю кавеол; распластывание — механический ответ на натяжение мембраны.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2010.12.031">Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413</a></li></ul><p>Sinha et al., 2011: клетки HeLa с Cav1-EGFP (30 мОсм, подсчёт кавеол), эндотелий лёгких мыши дикого типа и Cav1−/− (150 мОсм, сила вытягивания нити), миотрубки человека с Cav3 P28L. Числа — из этой работы, каждое со своими условиями. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-caveolae-inverse"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 7 из 45</div><h2>Видимых кавеол стало меньше — значит ли это, что они ушли внутрь клетки?</h2><p class="lead">Вспомнить: шаг «Как клатриновая ямка собирается вокруг рецептора с грузом» — клатриновая ямка становится носителем и уходит внутрь клетки. Кавеола внешне похожа, но при растяжении может просто распластаться. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> С кавеолами: при растяжении часть кавеол распластывается, натяжение почти не меняется. Без кавеолина-1: натяжение растёт сильно.</div><ol class="mech"><li>Наблюдение: после растяжения или набухания на снимках меньше впячиваний-кавеол.</li><li>Объяснение 1: кавеолы распластались — их мембрана перешла в плоскую мембрану; кавеолин остался в ней, кавины частично ушли в цитоплазму.</li><li>Объяснение 2: кавеолы отделились и ушли внутрь клетки.</li><li>Различают дополнительными наблюдениями: есть ли кавеолы внутри клетки; исчезают ли они, когда отделение пузырьков остановлено; как быстро они возвращаются после снятия нагрузки.</li></ol><p>Одно и то же наблюдение — впячиваний стало меньше — совместимо с двумя механизмами. Клатриновая ямка — носитель: исчезнув с поверхности, она уходит внутрь клетки. Для кавеол это не обязательно: при механической нагрузке они служат резервом площади мембраны и при растяжении распластываются.</p><h3>Как это узнали</h3><p>В эндотелиальных клетках лёгких мыши после 5 мин в гипоосмотической среде кавеол на снимках электронного микроскопа стало примерно вдвое меньше; кавеолин при этом обнаруживался в плоской мембране. В других клетках при наблюдении поверхности в световом микроскопе вещество, останавливающее отделение пузырьков (ингибитор динамина), потерю кавеол не предотвращало. Через 2–5 мин после возвращения в обычную среду кавеолы собирались вновь. Значит, большая часть исчезнувших кавеол не отделилась, а распласталась.</p><h3>Граница вывода</h3><p>Эндоцитоз кавеол в клетках возможен. Обзор 2026 г. считает его вторичным по значению по сравнению с механическими функциями, а в работе того же года, излагающей модель отделения кавеол, масштаб и роль их эндоцитоза названы во многом неизвестными. Модель отделения кавеол, в которой изгиб задают холестерин и сфингомиелин вместе с дисками кавеолина, а белок шейки ограничивает отделение, — предложенный механизм, а не установленный во всех клетках. Остаются ли распластанные кавеолы участками мембраны особого состава или распадаются на отдельные комплексы кавеолина, пока не решено.</p><div class="static-quiz"><h3>После растяжения клеток впячиваний-кавеол на снимках стало меньше. Какое наблюдение поддержит объяснение «кавеолы распластались», а не «ушли внутрь»?</h3><ol><li><b>А.</b> Клатриновые ямки при растяжении почти не изменились <i>(неверный вариант)</i><br><span class="expl">Это наблюдение говорит о клатриновых ямках, а не о том, куда делись кавеолы.</span></li><li><b>Б.</b> Потеря кавеол та же, когда отделение пузырьков остановлено <i>(верный вариант)</i><br><span class="expl">Если кавеолы исчезают и без отделения пузырьков, они не ушли внутрь, а распластались.</span></li><li><b>В.</b> Клетка при набухании увеличилась в объёме <i>(неверный вариант)</i><br><span class="expl">Набухание — причина растяжения; оно не различает два объяснения.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2010.12.031">Sinha B. et al. Cells respond to mechanical stress by rapid disassembly of caveolae. Cell. 2011;144:402–413</a></li><li><a href="https://doi.org/10.1038/s41580-026-00964-2">Lamaze C., Blouin C. M., Sens P. Caveolae mechanics in cellular functions and disease. Nat Rev Mol Cell Biol. 2026;27:581–600</a></li><li><a href="https://doi.org/10.1038/s41556-026-01945-5">Parton R. G., Kozlov M. M., Lundmark R. A lipid-centric view of endocytosis by caveolae. Nat Cell Biol. 2026;28:852–860</a></li></ul><p>Эндотелиальные клетки лёгких мыши в культуре, гипоосмотическая среда 5 мин, электронная микроскопия; обобщение — по обзорам 2026 г. Схема качественная.</p></details></article><article class="card print-unit" id="ns-dynamin-k44a"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 8 из 45</div><h2>Как показали, на каком этапе нужен динамин</h2><p class="lead">Мутантный динамин с нарушенными связыванием и гидролизом ГТФ позволил разделить этапы образования покрытой везикулы: ямка собирается и захватывает рецепторы без активного динамина, а сужение шейки и отделение — нет. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Контроль: ямки сужаются и отделяются. Динамин K44A: ямки впячены, шейки не сужаются, захват трансферрина ниже более чем на 80 %, захват жидкости не изменён.</div><ol class="mech"><li>В клетках HeLa (линия клеток рака шейки матки человека) включали синтез динамина-1 человека с заменой K44A — лизина в положении 44 на аланин; у такого белка нарушены связывание и гидролиз ГТФ (Damke et al., 1994).</li><li>Ямки собирались, впячивались и собирали рецепторы трансферрина (в ямке их примерно в 20 раз больше на единицу площади, чем на остальной мембране, как и в контроле), но не сужались; впяченных ямок становилось примерно вдвое больше.</li><li>Захват трансферрина снижался более чем на 80 %, захват EGF (эпидермального фактора роста) — более чем на 60 %; захват жидкости и рециркуляция рецептора трансферрина не менялись.</li></ol><h3>Что уточняет эта работа?</h3><p>Высвобождение покрытой везикулы из мембраны опосредует динамин (БИО-3·2). Эксперимент указывает, какой этап от него зависит: не сборка ямки и не захват рецепторов, а сужение шейки и отделение носителя; для этого динамину нужно связывать и гидролизовать ГТФ.</p><h3>Метод</h3><p>Синтез мутантного белка включали, убирая из среды тетрациклин, и сравнивали клетки до и после включения. Захват трансферрина и EGF измеряли по недоступности меченного биотином лиганда для авидина, добавленного снаружи: лиганд, ушедший в суженную ямку или в отделившийся пузырёк, авидин уже не связывает. Строение ямок оценивали электронной микроскопией, захват жидкости — по пероксидазе хрена в среде.</p><p>Контроль: синтез динамина дикого типа в таком же количестве захват не менял. Значит, эффект связан с потерей способности связывать ГТФ, а не с избытком белка. Типичный артефакт метода: мутантный белок синтезировался в количестве, не менее чем в 50 раз превышающем собственный динамин клетки, и подавлял его работу.</p><p>Чего данные не доказывают. Мутантный белок подавляет и работу собственного динамина клетки, поэтому эксперимент показывает необходимость активного динамина для отделения носителя, но не механизм — сужает ли динамин шейку сам или вместе с другими белками. Вывод получен на одной линии клеток.</p><div class="static-quiz"><h3>В клетках HeLa с мутантным динамином K44A меченый трансферрин связался с рецепторами. Что изменится по сравнению с контролем?</h3><ol><li><b>А.</b> Рецепторы концентрируются в ямках, как в контроле, но комплексы остаются на поверхности <i>(верный вариант)</i><br><span class="expl">Концентрирование рецепторов в ямках не нарушено (примерно в 20 раз выше, чем на остальной мембране), но ямки не сужаются и не отделяются, поэтому комплексы остаются на поверхности клетки (Damke et al., 1994).</span></li><li><b>Б.</b> Рецепторы перестают концентрироваться в ямках и рассеиваются по мембране <i>(неверный вариант)</i><br><span class="expl">Сборка ямок и концентрирование в них рецепторов от динамина не зависят: в клетках с K44A рецепторы в ямках собираются так же, как в контроле.</span></li><li><b>В.</b> Комплексы, как в контроле, за минуты попадают в ранние эндосомы <i>(неверный вариант)</i><br><span class="expl">Чтобы попасть в эндосому, носитель должен отделиться от мембраны; без активного динамина захват трансферрина снижен более чем на 80 %.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.127.4.915">Damke H., Baba T., Warnock D. E., Schmid S. L. Induction of mutant dynamin specifically blocks endocytic coated vesicle formation. J Cell Biol. 1994;127:915–934</a></li></ul><p>Damke et al., 1994: клетки HeLa; индуцируемый синтез динамина-1 человека дикого типа или K44A; захват трансферрина и EGF — начальная скорость перехода в суженные ямки и пузырьки; захват жидкости — пероксидаза хрена. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-coat-bending"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 9 из 45</div><h2>Когда плоская решётка клатрина начинает изгибаться</h2><p class="lead">Клатриновая ямка не собирается сразу изогнутой и не сворачивается в самом конце: по трёхмерным изображениям 1798 структур (из них 1645 эндоцитозных ямок) около половины <a href="#ns-g-S3-T39">решётки</a> собирается на плоской мембране, а затем решётка изгибается — сначала быстро, потом всё медленнее. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>В клетках меланомы человека SK-MEL-2 форму каждой ямки определили трёхмерной локализационной микроскопией одиночных молекул; ямки упорядочили по степени замкнутости, и порядковый номер ямки служил псевдовременем (Mund et al., 2023).</li><li>Самые ранние решётки уже содержали около половины конечной площади и были почти плоскими; затем кривизна росла: за первые 10 % псевдовремени радиус составлял около 134 нм, к 60 % — 83 нм; на последних 40 % кривизна почти не менялась.</li><li>Данные описывает модель, в которой скорость изгиба наибольшая в начале и падает по мере приближения к собственному радиусу решётки: 72 нм в SK-MEL-2, 85 нм в U2OS, около 89 нм в 3T3; доля площади до изгиба во всех трёх — около половины (0,45–0,52).</li></ol><h3>Что уточняет эта работа?</h3><p>Клатрин собирается в решётку и изгибает мембрану в ямку (БИО-3·2). Работа показывает, в каком порядке идут рост и изгиб: они перекрываются, но изгиб начинается не с первого <a href="#ns-g-S3-T38">трискелиона</a>. Два крайних предположения — «решётка сразу изогнута» и «вся решётка собирается плоской, а потом сворачивается» — с данными не согласуются.</p><h3>Метод</h3><p>Клатрин помечали флуоресцентными антителами в фиксированных клетках; по координатам отдельных меток восстанавливали форму решётки как сферический колпачок с радиусом и углом замыкания. Разрешение — около 10 нм в плоскости мембраны и около 30 нм по глубине. Структуры с особенно высокой кривизной (8,5 % найденных) образовали отдельную группу и были исключены; среди структур, совпавших с адаптером AP2, в этой группе AP2 не нашли, поэтому их считают не эндоцитозными (возможно, это пузырьки из транс-сети Гольджи).</p><p>Чего метод не доказывает. Время в секундах не измерено: псевдовремя предполагает, что все ямки собираются одинаково, а доля ямок в данной форме пропорциональна длительности этой формы. Самые ранние этапы сборки либо очень коротки, либо частично ниже предела обнаружения. К тому же выводу — изгиб начинается до конца сборки — в живых клетках дрозофилы приводит отсутствие резкого уменьшения площади видимого снизу пятна, которое дало бы позднее сворачивание (Willy et al., 2021). Выводы двух работ о модели постоянной кривизны расходятся: Mund et al. считают, что их данные ей не соответствуют, Willy et al. склоняются к ней.</p><div class="static-quiz"><h3>На каком участке пути — от плоской решётки до почти замкнутой ямки — кривизна растёт быстрее всего?</h3><ol><li><b>А.</b> В конце, перед отделением <i>(неверный вариант)</i><br><span class="expl">В конце изгиб почти останавливается: радиус уже близок к собственному радиусу решётки.</span></li><li><b>Б.</b> В начале изгиба <i>(верный вариант)</i><br><span class="expl">Скорость изгиба наибольшая, пока кривизна мала, и падает по мере приближения к собственному радиусу решётки; на последних 40 % псевдовремени кривизна почти не меняется.</span></li><li><b>В.</b> Равномерно на всём пути <i>(неверный вариант)</i><br><span class="expl">Равномерный рост не описывает данные: изгиб быстрый в начале и медленный в конце.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.202206038">Mund M. et al. Clathrin coats partially preassemble and subsequently bend during endocytosis. J Cell Biol. 2023;222(3):e202206038</a></li><li><a href="https://doi.org/10.1016/j.devcel.2021.10.019">Willy N. M. et al. De novo endocytic clathrin coats develop curvature at early stages of their formation. Dev Cell. 2021;56(22):3146–3159.e5</a></li></ul><p>Mund et al., 2023: клетки SK-MEL-2 (1798 структур в 13 клетках, из них 1645 эндоцитозных), U2OS (241 ямка, 3 клетки), 3T3 (688 ямок, 7 клеток); фиксированные клетки; трёхмерная локализационная микроскопия одиночных молекул; время — псевдовремя.</p></details></article><article class="card print-unit" id="ns-pit-fate"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 10 из 45</div><h2>Почему не каждая клатриновая ямка становится носителем</h2><p class="lead">Часть начатых клатриновых ямок обрывается, часть застревает на мембране; доля этих исходов зависит от прочности сети белков, собирающихся до клатрина, и наилучший результат дают не самые прочные связи, а средние. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>В клетках SUM159 без собственного Eps15 оборвавшихся ямок (короче 20 с) 41 %, а при синтезе Eps15 с меткой — 22 % (Day et al., 2021).</li><li>Eps15, у которого собственный участок сцепления молекул заменён светочувствительным модулем <a href="#ns-g-S3-T63">Cry2</a>, без света работает плохо (37 %), а слабый синий свет, усиливающий сцепление его молекул, возвращает долю к 23 %.</li><li>Сильный свет даёт 20 % оборвавшихся, но застрявших ямок (дольше 180 с) становится 22 % против 4 % в контроле: слишком прочная сеть теряет подвижность.</li></ol><h3>Что уточняет эта работа?</h3><p>Сборку ямки начинают <a href="#ns-g-S3-T40">белки, собирающиеся до клатрина</a> и удерживающие адаптеры. В пробирке они образуют жидкоподобные капли; в клетке о подвижности сети судят по восстановлению флуоресценции после обесцвечивания: слабая сеть распадается, прочная застывает. Поэтому «больше сборочного белка — лучше» неверно: для созревания ямки сеть должна быть и прочной, и подвижной.</p><h3>Метод</h3><p>Жизнь каждой ямки записывали микроскопией полного внутреннего отражения по флуоресцентной метке адаптера AP2: от появления пятна до его исчезновения. Ямки делили по времени жизни: короче 20 с (вероятно оборвавшиеся), 20–180 с, дольше 180 с. Контроль: свет той же мощности в клетках без модуля Cry2 динамику ямок не менял; у продуктивных ямок в конце — максимум динамина 2, у застрявших повторных максимумов почти нет.</p><p>Чего метод не доказывает. Границы 20 и 180 с условны; «оборвавшиеся» — предположение авторов о структурах короче 20 с, а часть «застрявших» может отделиться позже. Влияние прочности сети на исходы показано вмешательством — изменением освещения, — но в искусственной оптогенетической системе; что сеть в клетке именно «жидкая», выведено по экспериментам с каплями вне клетки; в тканях это не проверяли.</p><div class="static-quiz"><h3>В клетках без Eps15 оборвавшихся ямок 41 %. Что произойдёт, если вместо Eps15 синтезировать Eps15-Cry2 и не включать свет?</h3><ol><li><b>А.</b> Доля вернётся к уровню контроля (22 %) <i>(неверный вариант)</i><br><span class="expl">Долю возвращал свет (23 % при 10 мкВт, 20 % при 50 мкВт), а не темнота.</span></li><li><b>Б.</b> Почти все ямки застрянут <i>(неверный вариант)</i><br><span class="expl">Рост доли застрявших наблюдали при сильном свете (50 мкВт), а не без света.</span></li><li><b>В.</b> Доля почти не изменится (37 %): без света модуль Cry2 не усиливает сцепление <i>(верный вариант)</i><br><span class="expl">Без света Eps15-Cry2 восстанавливает сборку плохо; долю к уровню контроля возвращает лишь слабый свет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-021-00646-5">Day K. J., Kago G., Wang L., Richter J. B., Hayden C. C., Lafer E. M., Stachowiak J. C. Liquid-like protein interactions catalyse assembly of endocytic vesicles. Nat Cell Biol. 2021;23(4):366–376</a></li></ul><p>Day et al., 2021: клетки SUM159 с меченым AP2 и удалённым Eps15; Eps15-Cry2; синий свет 0, 10, 50 мкВт; 37 °C; запись 11 мин.</p></details></article><article class="card print-unit" id="ns-caveolae-muscle"><div class="eyebrow">Эндоцитоз: механизмы и признаки · шаг 11 из 45</div><h2>Почему мутации кавеолина-3 поражают прежде всего мышцы</h2><p class="lead">Кавеолин-3 входит в состав кавеол волокон скелетных мышц, которые постоянно растягиваются; мутации CAV3 нарушают образование кавеол, и мембрана мышечного волокна становится хрупкой. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Норма: при растяжении кавеолы распластываются. Мутантный кавеолин-3: кавеол нет, сарколемма повреждается чаще.</div><ol class="mech"><li>Кавеолы — впячивания 50–100 нм из кавеолинов (Cav1–Cav3) и кавинов; Cav3 характерен для скелетной мышцы (Lamaze et al., 2026).</li><li>Мутантный Cav3 задерживается в аппарате Гольджи, кавеолы в сарколемме не образуются, её устойчивость к растяжению снижается.</li><li>Мутации гена CAV3, кодирующего кавеолин-3, вызывают поясно-конечностную мышечную дистрофию 1C и болезнь «волнообразных мышц».</li></ol><h3>Что уточняет эта работа?</h3><p>Обзор подытоживает: роль кавеол в избирательном эндоцитозе сейчас считают второстепенной по сравнению с их механическими функциями — резервом мембраны и передачей сигнала при растяжении (Lamaze et al., 2026). Кавеол особенно много в мышцах, эндотелии и жировых клетках — тканях, которые постоянно растягиваются, — что согласуется с ролью резерва мембраны.</p><p>Кавеолин-3 синтезируется в скелетной мышце. При сокращении и растяжении волокна запас мембраны в кавеолах гасит скачки натяжения. Без кавеол каждое растяжение сильнее нагружает сарколемму — плазматическую мембрану мышечного волокна.</p><h3>Метод</h3><p>Обзор объединяет разные методы: электронную микроскопию и микроскопию сверхвысокого разрешения (строение кавеол), криоэлектронную микроскопию олигомеров кавеолина, измерение натяжения мембраны и генетику больных. Натяжение, при котором кавеолы распластываются (около 0,1 мН/м), получено расчётом по физической модели мембраны, а не прямым измерением. Контроль в таких работах — клетки или волокна того же типа без мутации. Ограничение: обзор сводит данные разных моделей — клеток в культуре, мышей и больных, — и числа, полученные в одной модели, нельзя переносить на другую.</p><p>Чего данные не доказывают. Цепочка «нет кавеол — хрупкая мембрана — дистрофия» согласуется с экспериментами на клетках, но поражение мышцы у конкретного больного зависит и от других белков сарколеммы. Медицинский пример иллюстрирует механизм и не является клиническим описанием.</p><div class="static-quiz"><h3>В мышечных волокнах мутантный кавеолин-3 задерживается в аппарате Гольджи. Что вероятнее всего произойдёт при повторяющемся растяжении волокна?</h3><ol><li><b>А.</b> Клатриновые ямки распластаются и заменят кавеолы <i>(неверный вариант)</i><br><span class="expl">Клатриновые ямки — места образования носителей эндоцитоза; роль резерва мембраны обзор отводит кавеолам (Lamaze et al., 2026; данные о ямках при набухании клетки — вспомнить БИО-3·7).</span></li><li><b>Б.</b> Сарколемма будет чаще повреждаться: запаса мембраны в кавеолах нет <i>(верный вариант)</i><br><span class="expl">Без кавеол растяжение не гасится распластыванием впячиваний, и мембрана повреждается чаще (Lamaze et al., 2026).</span></li><li><b>В.</b> Ничего не изменится: кавеолы нужны только для захвата грузов <i>(неверный вариант)</i><br><span class="expl">Главная функция кавеол — механическая; без них мембрана хуже переносит растяжение.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-026-00964-2">Lamaze C., Blouin C. M., Sens P. Caveolae mechanics in cellular functions and disease. Nat Rev Mol Cell Biol. 2026;27:581–600</a></li></ul><p>Lamaze, Blouin, Sens, 2026 — обзор. Оценка критического натяжения — расчёт по модели. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-carrier-cycle"><div class="eyebrow">Цикл транспортного носителя · шаг 12 из 45</div><h2>Из каких этапов состоит цикл транспортного носителя</h2><p class="lead"><a href="#ns-g-S3-T13">Транспортный носитель</a> переносит груз между мембранами: он образуется почкованием от мембраны одного компартмента и сливается с мембраной другого. Цикл носителя удобно разделить на этапы: сборка оболочки и отбор груза, отделение, разборка оболочки, узнавание мишени и слияние. Это продолжение вопроса 8 коллоквиума.</p><div class="note"><strong>Что показывает схема.</strong> Этапы цикла на всех участках одинаковы; различаются белки оболочки: COP-II — на выходе из грЭПР, COP-I — в обратном транспорте между цистернами аппарата Гольджи, клатрин — в транс-сети аппарата Гольджи.</div><ol class="mech"><li>Белки <a href="#ns-g-S3-T14">оболочки</a> собираются на мембране-доноре, отбирают груз и изгибают мембрану.</li><li>Носитель отделяется от донора; на плазматической мембране отделение покрытой клатрином везикулы опосредует динамин.</li><li>Носитель теряет оболочку.</li><li><a href="#ns-g-S3-T18">Rab-белки и удерживающие белки</a> обеспечивают первичное узнавание мишени.</li><li><a href="#ns-g-S3-T17">SNARE-белки</a> носителя и мишени собираются в комплекс, и мембраны сливаются.</li></ol><p>Оболочки разных участков мембранной сети различаются. <a href="#ns-g-S3-T15">COP-II</a> образует носители, которые переносят только что синтезированные белки из грЭПР в цис-сеть аппарата Гольджи; <a href="#ns-g-S3-T16">COP-I</a> — носители обратного транспорта из аппарата Гольджи в грЭПР и между его цистернами; клатрин с адаптерами — носители от плазматической мембраны и от транс-сети аппарата Гольджи.</p><p>Оболочка выполняет две функции: связывает груз (у клатрина — через адаптеры, связывающие цитоплазматические участки рецепторов груза) и придаёт мембране кривизну. Поэтому без оболочки нет ни отбора груза, ни самого носителя.</p><p>SNARE-белки называют по мембране, на которой они находятся: v-SNARE — на носителе, t-SNARE — на мембране-мишени. Есть и другие названия — R- и Q-SNARE, по остатку аргинина или глутамина в центре комплекса.</p><details open class="more"><summary>Подробнее — сверх программы</summary><p>Это две разные классификации, а не старое и новое название одних и тех же белков; у носителя из ЭПР есть и R-, и Q-SNARE (БИО-3·12).</p></details><p>Таким образом, схема цикла на всех маршрутах одна и та же, а различается набор белков — какая оболочка образует носитель на этом участке и по каким белкам носитель узнаёт мишень. Белки оболочки (например, COP-II на участке от ЭПР к аппарату Гольджи) обеспечивают отбор груза и образование носителя; к плазматической мембране секреторные везикулы перемещаются по микротрубочкам с помощью моторных белков.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как носитель движется от донора к мишени по микротрубочкам и актиновым филаментам с помощью моторных белков — <a href="https://fresll.github.io/molbio/seminar-2-route.html#tracks">МБ, семинар 2, шаг 1</a>; как моторный белок связывается со своим грузом через адаптер — <a href="https://fresll.github.io/molbio/seminar-2-route.html#adaptors">МБ, семинар 2, шаг 3</a>.</p><div class="static-quiz"><h3>Какая оболочка образует носитель, который переносит белки из транс-сети аппарата Гольджи в эндосому?</h3><ol><li><b>А.</b> COP-I <i>(неверный вариант)</i><br><span class="expl">COP-I обеспечивает ретроградный транспорт: из аппарата Гольджи в грЭПР и между цистернами аппарата Гольджи.</span></li><li><b>Б.</b> COP-II <i>(неверный вариант)</i><br><span class="expl">COP-II образует носители в прямом направлении — на выходе из грЭПР в аппарат Гольджи.</span></li><li><b>В.</b> Клатрин <i>(верный вариант)</i><br><span class="expl">Белки, предназначенные для лизосом, покидают транс-сеть аппарата Гольджи в покрытых клатрином везикулах; клатрин образует носители на плазматической мембране и в транс-сети аппарата Гольджи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: показан один носитель на каждом этапе.</p></details></article><article class="card print-unit" id="ns-uncoating"><div class="eyebrow">Цикл транспортного носителя · шаг 13 из 45</div><h2>Почему носитель должен потерять оболочку до слияния</h2><p class="lead">Оболочка нужна, чтобы отобрать груз и изогнуть мембрану, но после отделения носителя она мешала бы его взаимодействию с мишенью. Поэтому разборка оболочки — отдельный обязательный этап цикла: клатриновая оболочка разбирается, и только после этого везикула может слиться с мембраной-мишенью.</p><div class="note"><strong>Что показывает схема.</strong> Норма: оболочка разбирается, везикула сливается с ранней эндосомой. Без разборки оболочки покрытые везикулы накапливаются в цитоплазме.</div><ol class="mech"><li>Покрытая клатрином везикула отделяется от плазматической мембраны.</li><li>Клатриновая оболочка сбрасывается; её компоненты возвращаются в цитоплазму для нового цикла.</li><li>Неокаймлённый носитель сливается с <a href="#ns-g-S3-T19">ранней эндосомой</a>, используя Rab- и SNARE-системы.</li></ol><p>Носители других маршрутов тоже сбрасывают значительную часть оболочки до слияния с мишенью. Белки оболочки при этом не расходуются: они возвращаются в цитоплазму и собираются на мембране-доноре снова.</p><p>Если же оболочка не снимается, носитель уже отделился и несёт груз, но с мишенью не сливается; покрытые носители накапливаются в цитоплазме, а груз в мишень не поступает.</p><p>Именно так ведёт себя модель практикума вопроса 2, если убрать разборка оболочки (вкладка «Цикл носителя»). Вспомнить БИО-3·2: оболочка собирается вокруг рецепторов с грузом через адаптеры.</p><div class="static-quiz"><h3>Покрытая клатрином везикула отделилась, но оболочка с неё не снимается. Где окажутся рецепторы с лигандом?</h3><ol><li><b>А.</b> В покрытых везикулах в цитоплазме <i>(верный вариант)</i><br><span class="expl">Оболочка сбрасывается, позволяя везикуле слиться с целевой мембраной; без этого везикулы остаются в цитоплазме, и груз в раннюю эндосому не попадает.</span></li><li><b>Б.</b> В ранней эндосоме: оболочка разберётся при слиянии <i>(неверный вариант)</i><br><span class="expl">Разборка оболочки предшествует слиянию: покрытый носитель с мишенью не сливается.</span></li><li><b>В.</b> На поверхности клетки, в неотделившихся ямках <i>(неверный вариант)</i><br><span class="expl">Отделение везикулы обеспечивает динамин, и в этой ситуации оно не нарушено: нарушен следующий этап.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Белки, разбирающие оболочку, в шаге не обсуждаются. Схема качественная.</p></details></article><article class="card print-unit" id="ns-docking-fusion"><div class="eyebrow">Цикл транспортного носителя · шаг 14 из 45</div><h2>Как носитель узнаёт мишень и сливается с ней</h2><p class="lead">Прежде чем слиться с мишенью, носитель должен её узнать. Это делают в два этапа разные белки: Rab-белки и белки первоначального узнавания и удержания носителя (удерживающие белки) задерживают подходящий носитель у мембраны, а SNARE-белки сближают мембраны до слияния. Слияние обеспечивает взаимодействие SNARE-белков носителя и мембраны-мишени; Rab-белки и удерживающие белки отбирают подходящий носитель ещё до этого.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает, где оказываются носители и груз, если выключить один из этапов цикла на пути из транс-сети аппарата Гольджи в эндосому.</div><ol class="mech"><li>Rab в активной форме (связанный с ГТФ) отмечает мембрану-мишень и привлекает длинные удерживающие белки.</li><li>Удерживающие белки держат подходящий носитель у мишени на расстоянии.</li><li>SNARE носителя и SNARE мишени собираются в плотный четырёхспиральный комплекс, который сближает бислои; мембраны сливаются.</li></ol><p>Точность доставки обеспечивается последовательными проверками: сначала первичное узнавание, затем сборка комплементарных SNARE-белков двух мембран. Слияние обеспечивают SNARE-белки обеих мембран — v-SNARE носителя и t-SNARE мишени.</p><p>SNARE-белки работают при слиянии секреторной везикулы с плазматической мембраной — после слияния SNARE-комплекс разбирает АТФаза NSF — и при слиянии транспортных везикул с эндосомами.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Чем мембранный контактный сайт отличается от слияния — <a href="https://fresll.github.io/molbio/seminar-1-route.html#contact-site">МБ, семинар 1, шаг 22</a>; почему слияние, закисление и гидролиз в лизосоме — разные процессы — <a href="https://fresll.github.io/molbio/seminar-7-route.html#fusion-acidity">МБ, семинар 7, шаг 26</a>.</p><div class="static-quiz"><h3>Какие белки первыми связывают приближающийся носитель с мембраной-мишенью?</h3><ol><li><b>А.</b> SNARE-белки носителя <i>(неверный вариант)</i><br><span class="expl">SNARE-белки собираются в комплекс позже, когда носитель уже удерживается у мишени.</span></li><li><b>Б.</b> Удерживающие белки, которых привлекает Rab в активной форме <i>(верный вариант)</i><br><span class="expl">Rab, связанный с ГТФ, отмечает мембрану-мишень и привлекает длинные удерживающие белки; они держат подходящий носитель на расстоянии.</span></li><li><b>В.</b> Белки оболочки носителя <i>(неверный вариант)</i><br><span class="expl">Оболочка разбирается до слияния; узнавание мишени обеспечивают Rab-белки и удерживающие белки.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Схема качественная: показаны один SNARE мишени и один SNARE носителя вместо четырёх спиралей комплекса.</p></details></article><article class="card print-unit" id="ns-snare-zipper"><div class="eyebrow">Цикл транспортного носителя · шаг 15 из 45</div><h2>Как SNARE-комплекс сближает мембраны и почему его нужно разбирать</h2><p class="lead">Одиночные SNARE-белки неактивны и не сливают мембраны даже в высокой концентрации: слияние обеспечивает комплекс, который собирают SNARE-белки двух мембран (Jahn et al., 2024). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> SNARE порознь → сборка комплекса и стягивание мембран → слияние, комплекс в одной мембране → разборка NSF.</div><ol class="mech"><li>Четыре SNARE-мотива — по одному типа Qa, Qb, Qc и R — собираются в пучок из четырёх параллельных α-спиралей; в центре пучка лежит слой из трёх остатков глутамина (Q) и одного аргинина (R), по которому и названы подсемейства (Jahn et al., 2024).</li><li>Сборка начинается с N-концевых участков SNARE-мотивов и самопроизвольно продвигается к C-концевым якорям в мембранах («застёгивание»); собранный между двумя мембранами комплекс стягивает их до слияния.</li><li>После слияния все спирали комплекса оказываются в одной мембране (cis-комплекс). Его разбирает АТФаза <a href="#ns-g-S3-T20">NSF</a> вместе с белками α-SNAP — растворимыми белками, связывающими NSF. После разборки SNARE-белки снова готовы к слиянию.</li></ol><p>Что уточняет обзор. Слияние обеспечивает взаимодействие SNARE-белков носителя (v-SNARE) и мишени (t-SNARE) (БИО-3·11). Обзор объясняет, откуда берётся сила: комплекс очень стабилен, и энергия его сборки сближает мембраны и помогает преодолеть энергетический барьер слияния.</p><p>Пример — слияние синаптических пузырьков с плазматической мембраной нервного окончания: синтаксин-1 (Qa) и SNAP25 (два мотива, Qb и Qc) находятся в плазматической мембране, синаптобревин-2 (R) — в мембране пузырька (Jahn et al., 2024). У носителя с оболочкой COP-II, который сливается с цис-стороной аппарата Гольджи, распределение другое: на носителе — Qb-, Qc- и R-SNARE, на мембране-мишени — Qa-SNARE. Поэтому деление на R- и Q-SNARE (по остатку аргинина или глутамина в центре комплекса) и на v- и t-SNARE (по мембране, на которой находится белок) — разные классификации. Для слияния пузырька достаточно, по разным оценкам, от одного до трёх комплексов.</p><p>Сборку регулируют дополнительные белки — белки семейства Sec1/Munc18 и удерживающие белки, которые держат SNARE в нужном положении. Как именно начинается сборка, пока не установлено.</p><h3>Метод</h3><p>Большая часть сведений обзора получена в бесклеточных системах: очищенные SNARE-белки встраивают в искусственные липидные пузырьки (липосомы) и по флуоресценции измеряют смешивание липидов и содержимого двух мембран; силу сборки комплекса измеряют оптическим пинцетом на одиночных молекулах (Jahn et al., 2024). Контроль — пузырьки без SNARE-белков или с белками только одной мембраны. Типичный артефакт: при гемислиянии смешиваются липиды наружных монослоёв, а содержимое не смешивается, поэтому слияние подтверждают по смешиванию содержимого. Чего данные не доказывают: что в клетке слияние идёт с тем же числом комплексов и с той же скоростью, что в бесклеточной системе.</p><p>Из сведений обзора можно заключить: слияние связывает свободные SNARE-белки в собранные комплексы, а NSF разбирает их и возвращает SNARE в работу; без разборки комплексов цикл носителя остановился бы после первых слияний.</p><div class="static-quiz"><h3>Почему одиночный SNARE-белок на носителе, даже в большом количестве, не сливает носитель с мембраной?</h3><ol><li><b>А.</b> Его сначала должна разобрать АТФаза NSF <i>(неверный вариант)</i><br><span class="expl">NSF разбирает уже собранные комплексы после слияния; одиночный SNARE разбирать не нужно.</span></li><li><b>Б.</b> Его сначала должна покрыть оболочка COP-II <i>(неверный вариант)</i><br><span class="expl">Оболочка участвует в образовании носителя и снимается до слияния; к работе SNARE она отношения не имеет.</span></li><li><b>В.</b> Слияние обеспечивает только комплекс SNARE-мотивов двух мембран <i>(верный вариант)</i><br><span class="expl">Одиночные SNARE неактивны; энергию для сближения мембран даёт сборка комплекса из четырёх мотивов (Qa, Qb, Qc, R) (Jahn et al., 2024).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00668-x">Jahn R., Cafiso D. C., Tamm L. K. Mechanisms of SNARE proteins in membrane fusion. Nat Rev Mol Cell Biol. 2024;25:101–118</a></li></ul><p>Jahn, Cafiso, Tamm, 2024 — обзор. Число комплексов, необходимых для слияния, оценивается по-разному. Схема упрощена: показано по одному мотиву каждого типа; распределение мотивов между мембранами — как при слиянии синаптического пузырька: Qb и Qc — два мотива одного белка SNAP25, который прикреплён к мембране не трансмембранным участком, а остатками жирной кислоты (пальмитоильными). Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-carrier-limiting"><div class="eyebrow">Цикл транспортного носителя · шаг 16 из 45</div><h2>Носители есть, а доставки нет: как найти ограничивающий этап</h2><p class="lead">Вспомнить: шаг «Из каких этапов состоит цикл транспортного носителя». Этапы зависят друг от друга: каждый возможен, только если пройден предыдущий. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Нет оболочки — носителей нет; оболочка не снимается — носители с оболочкой в цитоплазме; нет узнавания — носители, сбросившие оболочку, в цитоплазме; нет SNARE — носители у мишени не сливаются.</div><ol class="mech"><li>Нет оболочки — носители не образуются, груз в доноре.</li><li>Оболочка не снимается — носители с полной оболочкой копятся в цитоплазме.</li><li>Нет узнавания мишени — носители, сбросившие оболочку, рассеяны в цитоплазме.</li><li>Нет SNARE на носителе — носители удержаны у мишени, но не сливаются.</li><li>SNARE не восстанавливаются после слияния — первые носители сливаются, затем поток падает.</li></ol><p>Итог «груз не доставлен» одинаков, но место, где копится груз, и вид носителей различают этапы. Так по распределению промежуточных структур находят ограничивающий этап — самый ранний из нарушенных.</p><p>Отдельный случай — восстановление компонентов. После слияния SNARE-белки носителя и мишени образуют прочный комплекс; пока его не разберут за счёт энергии АТФ, эти SNARE не могут участвовать в новом слиянии. Поэтому при нарушенной разборке первая доставка проходит за счёт уже свободных SNARE, а установившийся поток падает с каждым циклом.</p><h3>Как это узнали</h3><p>Белок, разбирающий комплексы SNARE, — NSF — нашли в смеси мембран аппарата Гольджи с цитоплазмой без клеток: перенос груза останавливался, если вывести этот белок из строя, и возвращался, когда его добавляли в очищенном виде (подробнее — шаг «Как обнаружили белок, без которого перенос между цистернами Гольджи останавливается»).</p><h3>Граница вывода</h3><p>Место накопления указывает на ограничивающий этап, но не доказывает его: носители могут копиться и при ускоренном образовании. Вывод проверяют дополнительным наблюдением — например, сравнивают первый цикл и установившийся поток.</p><div class="static-quiz"><h3>Груз не поступает в мишень, носители, сбросившие оболочку, удержаны у её мембраны. Сразу после начала наблюдения первые носители слились. Какой этап, вероятнее всего, нарушен?</h3><ol><li><b>А.</b> SNARE на носителе отсутствуют <i>(неверный вариант)</i><br><span class="expl">Тогда не слились бы и первые носители.</span></li><li><b>Б.</b> Узнавание мишени <i>(неверный вариант)</i><br><span class="expl">Носители удержаны у мишени — узнавание прошло.</span></li><li><b>В.</b> Восстановление SNARE после слияния <i>(верный вариант)</i><br><span class="expl">Первые носители слились за счёт уже свободных SNARE; затем комплексы не разбираются, и новые носители не сливаются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li><li><a href="https://doi.org/10.1073/pnas.85.21.7852">Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856</a></li></ul><p>Учебная модель цикла носителя на маршруте транс-сеть Гольджи → эндосома (в клетке — прежде всего ранняя эндосома; клатриновые носители сбрасывают оболочку вскоре после отделения; у носителей с COP-II часть оболочки может сохраняться до мишени); порядок этапов — учебная модель; не экспериментальные данные.</p></details></article><article class="card print-unit" id="ns-nsf-recycling"><div class="eyebrow">Цикл транспортного носителя · шаг 17 из 45</div><h2>Как обнаружили белок, без которого перенос между цистернами Гольджи останавливается</h2><p class="lead">Перенос белка между стопками аппарата Гольджи удалось воспроизвести вне клетки и найти белок, необходимый для этого переноса, — NSF. Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Контроль — перенос идёт; N-этилмалеимид — перенос почти не идёт; N-этилмалеимид + очищенный NSF — перенос восстановлен.</div><ol class="mech"><li>Мембраны аппарата Гольджи обрабатывали N-этилмалеимидом (NEM) — веществом, которое модифицирует остатки цистеина; после этого перенос белка G вируса везикулярного стоматита почти прекращался (Block et al., 1988).</li><li>Добавление фракции цитозоля восстанавливало перенос; по восстановлению из цитозоля очистили белок NSF.</li><li>Очищенный NSF восстанавливал перенос и действовал каталитически: по оценке авторов, один комплекс NSF обеспечивал перенос не менее трёх носителей.</li></ol><h3>Что уточняет эта работа?</h3><p>В названии SNARE-белков уже упомянут этот белок: SNARE — рецепторы растворимых белков, связывающих NSF, N-этилмалеимид-чувствительный фактор. Эксперимент 1988 г. показал, что этот белок необходим для переноса между цистернами аппарата Гольджи и не расходуется; позже стало известно, что NSF разбирает SNARE-комплексы после слияния (вспомнить БИО-3·12).</p><h3>Метод</h3><p>Бесклеточная система: донорные мембраны аппарата Гольджи из клеток CHO, заражённых вирусом везикулярного стоматита, акцепторные — из незаражённых клеток, цитозоль и АТФ. Перенос вирусного белка G из цис- в медиальный компартмент измеряли по присоединению [3H]GlcNAc к белку G. Мембраны обрабатывали 1 мМ N-этилмалеимида 15 мин при 0 °C, цитозоль готовили без активного NSF.</p><p>Контроль: необработанные мембраны с обычным цитозолем. Ограничение: N-этилмалеимид модифицирует многие белки, поэтому вывод о роли именно NSF опирается на восстановление переноса очищенным белком. Восстановление показывает, что добавления NSF достаточно, чтобы вернуть перенос в системе, где остальные компоненты сохранены; достаточен ли NSF для переноса сам по себе, из этого не следует.</p><p>Чего данные не доказывают. Эксперимент показывает, что NSF необходим для переноса, но не показывает, на каком этапе цикла он работает; роль NSF в разборке SNARE-комплексов установлена позже. Оценка каталитического действия заведомо занижена: при очистке большая часть активности теряется.</p><div class="static-quiz"><h3>К мембранам аппарата Гольджи, обработанным N-этилмалеимидом, добавили очищенный NSF. Что показал эксперимент?</h3><ol><li><b>А.</b> Перенос восстановился, и один комплекс NSF обслуживал несколько носителей <i>(верный вариант)</i><br><span class="expl">Очищенный NSF вернул перенос белка G; по оценке авторов, один комплекс обеспечивал перенос не менее трёх носителей (Block et al., 1988).</span></li><li><b>Б.</b> Перенос не восстановился: мембраны необратимо повреждены <i>(неверный вариант)</i><br><span class="expl">Перенос восстанавливался одним добавленным белком, значит, остальные компоненты мембран сохранили работоспособность.</span></li><li><b>В.</b> Перенос восстановился, только если NSF было столько же, сколько носителей <i>(неверный вариант)</i><br><span class="expl">NSF действует каталитически: он не расходуется на каждый носитель.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.85.21.7852">Block M. R., Glick B. S., Wilcox C. A., Wieland F. T., Rothman J. E. Purification of an N-ethylmaleimide-sensitive protein catalyzing vesicular transport. Proc Natl Acad Sci USA. 1988;85:7852–7856</a></li></ul><p>Block et al., 1988: бесклеточная система из мембран аппарата Гольджи клеток CHO (линия клеток яичника китайского хомячка); измеряемая величина — присоединение [3H]GlcNAc к белку G вируса везикулярного стоматита. Белок G — мембранный гликопротеин, поэтому на схеме он встроен в мембраны цистерн и носителей. Числа — из этой работы. Сверх программы — на коллоквиуме и зачёте не требуется.</p></details></article><article class="card print-unit" id="ns-eres-resolution"><div class="eyebrow">Цикл транспортного носителя · шаг 18 из 45</div><h2>Что видно у выхода из ЭПР при разном разрешении</h2><p class="lead">В световом микроскопе <a href="#ns-g-S3-T41">участок выхода из эндоплазматической сети (ЭПР)</a> выглядит одним пятном, и по нему нельзя определить, пузырьки там или трубка; в клетках без воздействий криоэлектронная томография показала скопления пузырьков с оболочкой COP-II около 70 нм. Сверх программы — на коллоквиуме и зачёте не требуется.</p><ol class="mech"><li>Предел <a href="#ns-g-S3-T45">разрешения</a> светового микроскопа около 200 нм; скопление покрытых мембран у ЭПР в клетках RPE-1 — около 240 нм (медиана), поэтому оно сливается в одно пятно (Downes et al., 2026; MBoC7). Такое пятно может содержать скопление из нескольких пузырьков около 70 нм или трубку; различить их позволяют лишь методы с намного более высоким разрешением, чем у светового микроскопа (в этой работе — криоэлектронная томография).</li><li>На томограммах 63 участков нашли 157 мембран с COP-II (95 отделившихся и 62 формирующихся пузырька — выпячивания мембраны, ещё не отделившиеся от неё) и 187 с COP-I; пузырёк COP-II — около 70 нм, COP-I — около 64 нм.</li><li>В этой работе формирующиеся пузырьки с оболочкой COP-II находились на мембране ЭПР, а с оболочкой COP-I — на мембранах промежуточного компартмента или аппарата Гольджи; формирующихся пузырьков без оболочки не встретили; авторы заключили, что оболочка разбирается после отделения пузырька, но до слияния.</li></ol><h3>Что уточняет эта работа?</h3><p>Носитель с оболочкой COP-II переносит груз из ЭПР в аппарат Гольджи (БИО-3·9). Другие работы описали у выхода из ЭПР трубчатые носители (прижизненная съёмка, объёмная электронная микроскопия). В клетках без воздействий авторы этой работы нашли пузырьки; трубки и туннели они не исключают. Возможно, форма носителя зависит от условий, но здесь это не проверяли.</p><h3>Метод</h3><p>Участки выхода из ЭПР находили по флуоресценции белка Sec23A — компонента оболочки COP-II. В клетках этот белок был слит с белком-меткой HaloTag (к ней присоединяют флуоресцентный краситель): последовательность метки встроили в клеточный ген SEC23A методом редактирования генома, поэтому меченый белок синтезируется с собственного гена клеток, а не вводится извне. Затем из замороженной клетки ионным пучком вырезали тонкий слой (томограммы толщиной 150–350 нм) и снимали томограмму. Тип оболочки определяли по виду оболочки и подтверждали сопоставлением с шаблонами COP-I и COP-II.</p><p>Чего метод не доказывает. Слой мал, а участки выбирали по скоплениям флуоресценции — выборка смещена к скоплениям пузырьков; авторы прямо пишут, что трубчатые носители и туннели не исключены. Крупный груз (<a href="#ns-g-S3-T44">проколлаген</a> длиной около 300 нм) в пузырёк 60–80 нм не помещается, и его выход объясняют более крупными носителями (MBoC7).</p><div class="static-quiz"><h3>На томограмме у мембраны ЭПР виден формирующийся пузырёк без белковой оболочки. Как это согласуется с данными работы?</h3><ol><li><b>А.</b> Не согласуется: формирующихся пузырьков без оболочки не нашли, а по выводу авторов оболочка разбирается после отделения пузырька <i>(верный вариант)</i><br><span class="expl">Все найденные формирующиеся пузырьки были покрыты оболочкой; авторы заключили, что оболочка разбирается после отделения, но до слияния, и формирующийся пузырёк без оболочки поставил бы этот вывод под сомнение.</span></li><li><b>Б.</b> Согласуется: оболочка разбирается ещё до отделения <i>(неверный вариант)</i><br><span class="expl">Тогда встречались бы формирующиеся пузырьки без оболочки; их не нашли.</span></li><li><b>В.</b> Согласуется: на ЭПР формирующиеся пузырьки всегда без оболочки <i>(неверный вариант)</i><br><span class="expl">Формирующиеся пузырьки на ЭПР всегда несли оболочку COP-II.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-026-01964-2">Downes K. W., Flood J. R., Nans A., Van der Verren S. E., Audhya A., Zanetti G. In situ cryo-ET defines the ultrastructure of ER exit sites in human cells. Nat Cell Biol. 2026;28:1258–1268</a></li><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Гл. 9 «Visualizing Cells and Their Molecules», гл. 12 «Intracellular Organization and Protein Sorting», гл. 13 «Intracellular Membrane Traffic»</li></ul><p>Downes et al., 2026: клетки RPE-1 без воздействий; белок Sec23A слит с меткой HaloTag (метка встроена в ген SEC23A в геноме клеток); криоэлектронная томография тонких слоёв; 63 томограммы.</p></details></article><article class="card print-unit" id="ns-fusion-pore"><div class="eyebrow">Цикл транспортного носителя · шаг 19 из 45</div><h2>Как открывается и меняется пора слияния</h2><p class="lead">Слияние проходит через промежуточные состояния. По одной из моделей сначала сливаются обращённые друг к другу монослои мембран (<a href="#ns-g-S3-T22">гемислияние</a>), затем открывается <a href="#ns-g-S3-T21">пора</a>; конкурирующая модель предполагала начальную пору, выстланную SNARE-белками. В эксперименте на живых хромаффинных клетках надпочечника быка гемислияние, длившееся достаточно долго, чтобы его зарегистрировать, наблюдали примерно в 30–40 % событий слияния; пора может расшириться или снова закрыться (Wu, Chan, 2024). Сверх программы — на коллоквиуме и зачёте не требуется.</p><div class="note"><strong>Что показывает схема.</strong> Сближение → гемислияние (не всегда) → узкая пора → широкая пора → сжатие Ω-профиля или закрытие поры.</div><ol class="mech"><li>По классической схеме при слиянии везикулы с плазматической мембраной открывается узкая пора (менее ~5 нм); она может быстро закрыться и ограничить выход содержимого («поцелуй и беги») или расшириться, и тогда везикула полностью встраивается в мембрану (Wu, Chan, 2024).</li><li>В живых хромаффинных клетках надпочечника примерно в 30–40 % событий слияния наблюдали гемислияние, длившееся достаточно долго, чтобы его зарегистрировать; примерно в трети таких случаев оно переходило в полное слияние за 0,1–26 с.</li><li>Поры видны непосредственно, если они крупнее ~60 нм: у везикул 180–720 нм поры бывают от ~0 до 490 нм и могут расширяться быстрее ~9 нм/мс. Слившаяся везикула сохраняет форму Ω-профиля, сжимается, увеличивается, а пора остаётся открытой или закрывается — всего семь вариантов.</li></ol><h3>Что уточняет эта работа?</h3><p>Обычно описывают два исхода слияния — полное слияние и «поцелуй и беги», при котором пора открывается кратковременно. В крупных секреторных везикулах хромаффинных клеток распластывание везикулы в плазматической мембране, считавшееся основным исходом, не наблюдали; вместо этого Ω-профиль сохранялся, сжимался или увеличивался (Wu, Chan, 2024).</p><h3>Метод</h3><p>Микроскопия STED (разрешение ~60–80 нм, кадр каждые ~26–300 мс) в первичной культуре хромаффинных клеток на
