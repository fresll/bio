<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-5.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Деградация и энергетика: контроль качества как система</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-three-routes"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 1 из 31</div><h2>Почему у клетки несколько путей разрушения белков и органелл?</h2><p class="lead">Каждый белок клетки рано или поздно разрушается: одни белки — через минуты после синтеза, другие — через дни. Разрушают их ферменты, расщепляющие пептидные связи, — протеазы. Протеазы, способные разрушать белки целиком, не работают свободно в <a href="#ns-g-S5-T78">цитозоле</a>: у одних активные центры спрятаны внутри белкового цилиндра <a href="#ns-g-S5-T01">протеасомы</a>, другие находятся в просвете отдельной мембранной органеллы — <a href="#ns-g-S5-T12">лизосомы</a>.</p><div class="note"><strong>Что показывает схема.</strong> Три пути: протеасома — для отдельного меченого белка, аутофагия и фагоцитоз — к лизосоме</div><ol class="mech"><li>Протеасома — немембранный белковый комплекс цитозоля и ядра. Она разрушает по одной молекуле белка, помеченной цепью небольшого белка <a href="#ns-g-S5-T02">убиквитина</a>, и только если цепь белка удаётся развернуть и протянуть в узкий канал. Лизосома принимает материал, окружённый мембраной: внеклеточные белки и частицы приходят путём <a href="#ns-g-S5-T30">эндоцитоза</a> и <a href="#ns-g-S5-T28">фагоцитоза</a>, а участки цитоплазмы, крупные белковые <a href="#ns-g-S5-T27">агрегаты</a> и целые органеллы — путём <a href="#ns-g-S5-T14">аутофагии</a>. Поэтому путь разрушения определяется не химической природой объекта (и там, и там белок), а тем, где он находится, каков его размер и какая на нём метка.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-4-route.html#er-removal">семинар 4: «Как удаляется белок, который так и не свернулся?»</a> и <a href="seminar-3-route.html#rab-conversion">семинар 3: «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»</a></p><p>Пример: отдельная молекула фермента в цитозоле, помеченная цепью убиквитина, разрушается протеасомой за минуты; повреждённая митохондрия размером около микрометра в канал протеасомы не помещается и разрушается в лизосоме после аутофагии; частица, захваченная снаружи клеткой-фагоцитом, попадает в лизосому путём фагоцитоза. Мембранные белки <a href="#ns-g-S5-T81">плазматической мембраны</a> после эндоцитоза разрушаются в лизосоме, а белки, которые не свернулись в ЭПР, выводятся в цитозоль и разрушаются протеасомой (<a href="seminar-4-route.html#er-removal">семинар 4: «Как удаляется белок, который так и не свернулся?»</a>).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаги 1.1–1.4: пять объектов, разных по месту, размеру и метке.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Деление на «пути» учебное: некоторые белки могут разрушаться двумя путями (БИО-5·5, БИО-5·7).</p><div class="static-quiz"><h3>Какой признак объекта прежде всего определяет, разрушит его протеасома или лизосома?</h3><ol><li><b>А.</b> Где находится объект и каков его размер <i>(верный вариант)</i><br><span class="expl">Отдельный помеченный белок цитозоля — протеасома; материал внутри мембранного пузырька и крупные объекты — лизосома</span></li><li><b>Б.</b> Из каких молекул состоит объект <i>(неверный вариант)</i><br><span class="expl">И в протеасоме, и в лизосоме разрушаются белки; химическая природа объекта путь не определяет</span></li><li><b>В.</b> Сколько времени объект уже находится в клетке <i>(неверный вариант)</i><br><span class="expl">Возраст объекта сам по себе путь не задаёт; важны место, размер и метка</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: размеры частиц и органелл не в масштабе.</p></details></article><article class="card print-unit" id="ns-ubiquitin-cascade"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 2 из 31</div><h2>Как к белку присоединяется убиквитин: ферменты E1, E2 и E3</h2><p class="lead"><a href="#ns-g-S5-T02">Убиквитин</a> — небольшой белок из 76 аминокислот. Его C-конец присоединяется ковалентной связью к боковой цепи лизина в белке-мишени.</p><div class="note"><strong>Что показывает схема.</strong> Этапы мечения: E1 с затратой АТФ активирует убиквитин; убиквитин переходит на E2; E3 узнаёт мишень по дегрону и вместе с E2 переносит убиквитин; повторение строит цепь.</div><ol class="mech"><li>Присоединение идёт в три этапа. <a href="#ns-g-S5-T03">Убиквитин-активирующий фермент (E1)</a> с затратой АТФ активирует C-конец убиквитина и передаёт его <a href="#ns-g-S5-T04">убиквитин-конъюгирующему ферменту (E2)</a>. <a href="#ns-g-S5-T05">Убиквитинлигаза (E3)</a> связывает определённый белок-мишень и вместе с E2 переносит на него убиквитин. Убиквитинлигаз в клетке много, и каждая узнаёт свои мишени по особому участку цепи — <a href="#ns-g-S5-T10">дегрону</a>. Поэтому специфичность метки задаёт E3, а не E1.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·1</p><p>Дегрон становится доступным, когда белок не свернулся или повреждён (открытый гидрофобный участок), после присоединения фосфатной группы или после того, как белок закончил работу. Так <a href="#ns-g-S5-T11">короткоживущие</a> регуляторные белки — например, циклины митоза — разрушаются в строго определённый момент (<a href="seminar-6-route.html#irreversible-transitions">семинар 6</a>). Метку можно снять: ферменты, отщепляющие убиквитин, делают метку обратимой.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, конструктор: «убрать убиквитинлигазу».</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; На схеме один E1, один E2 и одна E3; число ферментов каждого типа в клетке условно не показано.</p><div class="static-quiz"><h3>В клетке нет одной из убиквитинлигаз. Что изменится?</h3><ol><li><b>А.</b> Ни один белок клетки не получит убиквитин <i>(неверный вариант)</i><br><span class="expl">Так было бы без E1, общего для многих путей; E3 же много, и они разные</span></li><li><b>Б.</b> Не получат метку только мишени этой лигазы <i>(верный вариант)</i><br><span class="expl">Каждая E3 узнаёт свои дегроны; остальные белки метятся другими лигазами</span></li><li><b>В.</b> Убиквитин будет присоединяться к случайным белкам <i>(неверный вариант)</i><br><span class="expl">Без E3 метка на её мишени просто не появляется; случайного мечения не возникает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: последовательность этапов — учебное деление непрерывного процесса.</p></details></article><article class="card print-unit" id="ns-ubiquitin-code"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 3 из 31</div><h2>Одна молекула убиквитина или цепь: что означает метка?</h2><p class="lead">Убиквитин присоединяется к белку по-разному: одной молекулой (<a href="#ns-g-S5-T07">моноубиквитинирование</a>), несколькими одиночными молекулами к разным лизинам или цепью, в которой каждый следующий убиквитин связан с предыдущим.</p><div class="note"><strong>Что показывает схема.</strong> Тип метки: одиночная — регуляция хроматина; одиночные на мембранном белке — эндоцитоз и эндосома; цепь через Lys48 — протеасома; цепь через Lys63 — репарация ДНК и другие процессы.</div><ol class="mech"><li>Метку «читают» белки, которые узнают определённый тип присоединения. <a href="#ns-g-S5-T06">Полиубиквитиновая цепь</a>, в которой молекулы связаны через лизин 48 (Lys48) предыдущего убиквитина, направляет белок в протеасому. Одиночные молекулы убиквитина на цитозольном домене мембранного белка служат сигналом эндоцитоза и сортировки в эндосомах: такой белок разрушается не протеасомой, а в лизосоме. Моноубиквитин гистонов участвует в регуляции хроматина, а цепи, связанные через лизин 63 (Lys63), — в репарации ДНК и других процессах, не связанных с протеасомой.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·2</p><p>Поэтому вопрос «есть ли на белке убиквитин» недостаточен: важно, сколько молекул, как они связаны и где находится белок. Одна и та же молекула убиквитина в цепи разного типа имеет разные последствия.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.2: растворимый фермент с цепью через Lys48 и мембранный белок с одиночными молекулами убиквитина.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Таблица «тип метки → последствие» учебная: у одного типа метки бывает несколько последствий, а убиквитин служит меткой и для селективной аутофагии (БИО-5·6).</p><div class="static-quiz"><h3>Рецептор плазматической мембраны получил на цитозольном домене одиночные молекулы убиквитина. Где он, скорее всего, будет разрушен?</h3><ol><li><b>А.</b> В протеасоме, прямо на мембране <i>(неверный вариант)</i><br><span class="expl">Протеасому направляет цепь через Lys48; одиночные молекулы — другой сигнал</span></li><li><b>Б.</b> Нигде: одиночная метка ничего не означает <i>(неверный вариант)</i><br><span class="expl">Одиночная метка — тоже сигнал, но для другого пути</span></li><li><b>В.</b> В лизосоме, после эндоцитоза <i>(верный вариант)</i><br><span class="expl">Одиночные молекулы убиквитина на мембранном белке — сигнал эндоцитоза и сортировки в эндосомах</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: цепи нарисованы из условного числа молекул.</p></details></article><article class="card print-unit" id="ns-proteasome-26s"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 4 из 31</div><h2>Как 26S-протеасома узнаёт, разворачивает и разрушает белок?</h2><p class="lead">Протеасомы многочисленны — около 1 % всех белков клетки — и находятся в цитозоле и ядре. Протеасома с регуляторными частицами называется 26S-протеасомой (S — единица скорости осаждения при центрифугировании).</p><div class="note"><strong>Что показывает схема.</strong> 26S-протеасома: 19S-частица связывает цепь убиквитина, убиквитин отщепляется, кольцо АТФаз разворачивает белок и протягивает его в канал 20S-частицы, где белок разрезается на пептиды.</div><ol class="mech"><li>Центральная <a href="#ns-g-S5-T08">20S-частица</a> — полый цилиндр из четырёх колец по семь субъединиц; активные центры протеаз обращены внутрь цилиндра. С концами цилиндра связаны <a href="#ns-g-S5-T09">19S-частицы</a>. В 19S-частице есть рецептор цепи убиквитина, фермент, отщепляющий убиквитин, и кольцо из шести АТФаз. Связав цепь, 19S-частица захватывает неупорядоченный участок белка и с затратой АТФ разворачивает цепь, протягивая её в канал цилиндра. Внутри белок разрезается на короткие пептиды, которые затем расщепляются пептидазами цитозоля до аминокислот. Убиквитин отщепляется до входа в канал и используется снова.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·3</p><p>Протеасома проверяет белок дважды: нужна цепь убиквитина и нужен участок, с которого начнётся развёртывание. Белок с цепью, но без такого участка, обычно освобождается от убиквитина и отпускается. Протеасома работает непрерывно: разрушает молекулу целиком, не отпуская её на полпути. Через протеасому проходят белки ЭПР, которые не свернулись и выведены в цитозоль (<a href="seminar-4-route.html#er-removal">семинар 4: «Как удаляется белок, который так и не свернулся?»</a>): считается, что 1–5 % всех новых белков не сворачиваются правильно и разрушаются протеасомой.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, конструктор: «убрать рецептор цепи в 19S-частице» и «заблокировать активные центры 20S-частицы».</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; В клетке есть протеасомы с одной и с двумя 19S-частицами; на схеме — две.</p><div class="static-quiz"><h3>Почему протеаза, спрятанная внутрь цилиндра 20S-частицы, не разрушает белки цитозоля без разбора?</h3><ol><li><b>А.</b> Внутрь попадает только развёрнутая цепь, обычно с меткой <i>(верный вариант)</i><br><span class="expl">В основном пути вход в канал открывают узнавание цепи убиквитина и развёртывание с затратой АТФ; часть белков разрушается и без убиквитина (БИО-5·8)</span></li><li><b>Б.</b> Протеазы 20S-частицы работают только в ядре <i>(неверный вариант)</i><br><span class="expl">Протеасомы работают и в цитозоле, и в ядре; защита — в строении цилиндра</span></li><li><b>В.</b> Белки цитозоля устойчивы к любым протеазам <i>(неверный вариант)</i><br><span class="expl">Белки цитозоля разрушаются протеазами, если попадут внутрь цилиндра</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема по строению комплекса, упрощённая: число субъединиц и форма частиц условны. Доля 1–5 % — оценка по MBoC7, с. 386.</p></details></article><article class="card print-unit" id="ns-autophagy-types"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 5 из 31</div><h2>Три вида аутофагии: чем они различаются?</h2><p class="lead"><a href="#ns-g-S5-T14">Аутофагия</a> — доставка собственного материала цитоплазмы в лизосому для разрушения. Различают три вида по способу доставки.</p><div class="note"><strong>Что показывает схема.</strong> Три вида аутофагии: макроаутофагия — двойная мембрана; микроаутофагия — впячивание мембраны лизосомы; шаперон-опосредованная — отдельный развёрнутый белок через мембрану.</div><ol class="mech"><li>При <a href="#ns-g-S5-T15">макроаутофагии</a> вокруг участка цитоплазмы растёт плоская двойная мембрана — <a href="#ns-g-S5-T17">фагофор</a>. Её края смыкаются, и образуется <a href="#ns-g-S5-T16">аутофагосома</a> — пузырь с двумя мембранами. Наружная мембрана сливается с лизосомой, внутренняя мембрана и груз разрушаются гидролазами. Мембрана фагофора растёт за счёт слияния мелких пузырьков и переноса липидов из ЭПР в местах контакта мембран (в частности, белком ATG2); к её липиду присоединяется белок <a href="#ns-g-S5-T25">ATG8</a>, похожий на убиквитин. При <a href="#ns-g-S5-T18">микроаутофагии</a> мембрана лизосомы или поздней эндосомы сама впячивается внутрь и отшнуровывает пузырёк с небольшой порцией цитоплазмы. При <a href="#ns-g-S5-T19">шаперон-опосредованной аутофагии</a> отдельные растворимые белки с мотивом <a href="#ns-g-S5-T20">KFERQ</a> связываются с шапероном <a href="#ns-g-S5-T21">HSC70</a> и по одной молекуле переходят через мембрану лизосомы с помощью рецептора <a href="#ns-g-S5-T22">LAMP2A</a>; для перехода белок должен быть развёрнут.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·1</p><p>Макроаутофагия усиливается при голодании: аминокислоты, полученные при разрушении белков, используются для синтеза нужных белков. Шаперон-опосредованная аутофагия активируется позже — при голодании дольше примерно 8 часов (в экспериментах на грызунах). Мотив, похожий на KFERQ, есть примерно у 40 % белков млекопитающих, но этим путём разрушаются только белки, у которых мотив в данный момент доступен шаперону. Шаперон-опосредованная аутофагия не разрушает агрегаты: через мембрану проходят только отдельные развёрнутые молекулы.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.4: растворимый белок с мотивом KFERQ при длительном голодании.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Шаперон-опосредованная аутофагия описана у млекопитающих и птиц; на схемах размеры пузырьков условны.</p><div class="static-quiz"><h3>Какой вид аутофагии может разрушить целую митохондрию?</h3><ol><li><b>А.</b> Шаперон-опосредованная аутофагия <i>(неверный вариант)</i><br><span class="expl">Через мембрану лизосомы этим путём проходят только отдельные развёрнутые белки</span></li><li><b>Б.</b> Макроаутофагия <i>(верный вариант)</i><br><span class="expl">Только двойная мембрана фагофора может окружить органеллу целиком</span></li><li><b>В.</b> Микроаутофагия, при любом размере груза <i>(неверный вариант)</i><br><span class="expl">Впячивание мембраны лизосомы захватывает небольшие порции цитоплазмы; основной путь для органеллы — макроаутофагия</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li><li><a href="https://doi.org/10.1038/s41580-018-0001-6">Kaushik S., Cuervo A.M. The coming of age of chaperone-mediated autophagy. Nat Rev Mol Cell Biol. 2018;19(6):365–381</a></li></ul><p>Схема качественная, три панели: А — макроаутофагия, Б — микроаутофагия, В — шаперон-опосредованная аутофагия.</p></details></article><article class="card print-unit" id="ns-selective-autophagy"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 6 из 31</div><h2>Как аутофагия узнаёт повреждённую митохондрию или бактерию в цитозоле?</h2><p class="lead">Аутофагия бывает неизбирательной, когда фагофор захватывает случайный участок цитоплазмы (например, при голодании), и <a href="#ns-g-S5-T23">селективной</a>, когда мембрана плотно охватывает определённый груз.</p><div class="note"><strong>Что показывает схема.</strong> Рецептор селективной аутофагии связывает убиквитин на грузе и ATG8 на фагофоре; на повреждённой митохондрии PINK1 и Parkin ставят убиквитин на белки наружной мембраны.</div><ol class="mech"><li>Грузы селективной аутофагии — повреждённые органеллы, белковые агрегаты, слишком крупные для протеасомы, и бактерии, вышедшие из фагосомы в цитозоль. Груз получает метку, чаще всего убиквитин. <a href="#ns-g-S5-T24">Рецепторы селективной аутофагии</a> связывают метку на грузе и белок ATG8 на мембране растущего фагофора, и мембрана растёт по контуру груза, почти не захватывая окружающий цитозоль. Удаление повреждённых митохондрий называют <a href="#ns-g-S5-T26">митофагией</a>. Повреждённая митохондрия не поддерживает протонный градиент, поэтому киназа PINK1, которую нормальная митохондрия импортирует внутрь, остаётся на её поверхности и привлекает убиквитинлигазу Parkin; Parkin метит белки наружной мембраны, и метку узнают рецепторы аутофагии.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·3, БИО-5·5</p><p>Здесь убиквитин служит меткой не для протеасомы, а для лизосомы: смысл метки зависит от того, кто её читает и где находится груз. Мутации генов PINK1 или Parkin вызывают одну из форм болезни Паркинсона с ранним началом; почему погибают именно определённые нейроны, неизвестно.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.1 (бактерия в цитозоле) и шаг 1.3 (агрегат).</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Путь PINK1–Parkin — не единственный путь митофагии; другие пути на странице не разбираются.</p><div class="static-quiz"><h3>Бактерия вышла из фагосомы в цитозоль клетки, и её поверхностные белки получили убиквитин. Каким путём её разрушит клетка?</h3><ol><li><b>А.</b> Протеасомой, потому что на бактерии есть убиквитин <i>(неверный вариант)</i><br><span class="expl">Бактерия слишком велика для канала протеасомы; убиквитин здесь — метка для аутофагии</span></li><li><b>Б.</b> Фагоцитозом, потому что это бактерия <i>(неверный вариант)</i><br><span class="expl">Фагоцитоз захватывает объект снаружи клетки; эта бактерия уже в цитозоле</span></li><li><b>В.</b> Селективной аутофагией с разрушением в лизосоме <i>(верный вариант)</i><br><span class="expl">Рецепторы связывают убиквитин на бактерии и ATG8 на фагофоре</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: рецептор, метка и ATG8 показаны условными знаками.</p></details></article><article class="card print-unit" id="ns-limited-compensation"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 7 из 31</div><h2>Может ли аутофагия заменить протеасому?</h2><p class="lead">Сверх программы. Учебная потоковая модель: за каждый интервал в цитозоль поступают растворимые меченые белки, агрегаты и повреждённые органеллы; у протеасомы и у аутофагии своя ёмкость — сколько условных единиц (у.е.) материала они разрушают за интервал.</p><div class="note"><strong>Что показывает схема.</strong> Учебная модель A1 (интервал 4): норма — ничего не копится; протеасома 40 — растворимые 37,5, агрегаты ≈ 51, органеллы ≈ 1,5 у.е.; протеасома 40 и аутофагия 80 — растворимые 37,5, агрегаты 37,5, органеллы 0; протеасома 40 и аутофагия 20 — растворимые 37,5, агрегаты ≈ 99,9, органеллы ≈ 7,6 у.е.</div><ol class="mech"><li>Правила модели. Протеасома разрушает только растворимые меченые белки — не больше своей ёмкости. Аутофагия разрушает агрегаты и органеллы; растворимые белки она не берёт. Половина растворимых белков, оставшихся неразрушенными к концу интервала, слипается в агрегаты (доля 0,5 — допущение модели). Приток за интервал: 80 у.е. растворимых белков, 10 у.е. агрегатов, 5 у.е. органелл. Ёмкость протеасомы 100 у.е., аутофагии 40 у.е.: всё разрушается, ничего не копится. Если ёмкость протеасомы снизить до 40 у.е., за первый интервал остаются 40 у.е. растворимых белков; половина из них переходит в агрегаты. К четвёртому интервалу растворимых белков копится 37,5 у.е., агрегатов — около 51 у.е., и начинают копиться органеллы (около 1,5 у.е.): поток агрегатов занял ёмкость аутофагии.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·4, БИО-5·5, БИО-5·6</p><p>Если при сниженной протеасоме удвоить ёмкость аутофагии (80 у.е.), органеллы не копятся, а запас агрегатов равен лишь порции, слипшейся за последний интервал (37,5 у.е.), и сверх неё не растёт; запас же растворимых меченых белков остаётся тем же — 37,5 у.е.: в модели аутофагия берёт только ту часть растворимых белков, которая слиплась в агрегаты. Баланс каждого интервала: запас в начале + приток = разрушено протеасомой + разрушено аутофагией + запас в конце. &lt;b&gt;Обратная задача.&lt;/b&gt; Копятся и растворимые меченые белки, и повреждённые органеллы. Нужно проверить приток и обе ёмкости: ту же картину даёт и рост притока при обычной протеасоме (140 у.е. при ёмкости 100), и снижение ёмкости протеасомы, и одновременное нарушение обоих путей.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; В клетке компенсация зависит от ткани и условий: в печени мышей без шаперон-опосредованной аутофагии её часть берут на себя макроаутофагия и протеасома, но при стрессе и с возрастом эта компенсация утрачивается; в сетчатке её нет. Ёмкости, доля слипания и притоки — допущения, а не измеренные величины.</p><div class="static-quiz"><h3>В модели ёмкость протеасомы снижена до 40 у.е., ёмкость аутофагии удвоена. Что произойдёт с запасом растворимых меченых белков?</h3><ol><li><b>А.</b> Останется тем же: аутофагия их не берёт <i>(верный вариант)</i><br><span class="expl">Она убирает только слипшуюся часть; растворимые белки копятся как прежде</span></li><li><b>Б.</b> Исчезнет: аутофагия заменит протеасому <i>(неверный вариант)</i><br><span class="expl">В модели аутофагия не разрушает отдельные растворимые белки</span></li><li><b>В.</b> Вырастет вдвое: аутофагия мешает протеасоме <i>(неверный вариант)</i><br><span class="expl">Ёмкость аутофагии не влияет на работу протеасомы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li><li><a href="https://doi.org/10.1038/s41580-018-0001-6">Kaushik S., Cuervo A.M. The coming of age of chaperone-mediated autophagy. Nat Rev Mol Cell Biol. 2018;19(6):365–381</a></li></ul><p>Учебная модель · условные единицы; ёмкости и доля слипания — допущения, а не измеренные величины.</p></details></article><article class="card print-unit" id="ns-ubiquitin-free"><div class="eyebrow">Пути деградации: протеасома, аутофагия и лизосома · шаг 8 из 31</div><h2>Всегда ли для протеасомы нужна цепь убиквитина?</h2><p class="lead">Сверх программы. Цепь убиквитина — главный, но не единственный путь в протеасому. Белки, которые клетка синтезирует сразу после внешнего сигнала (белки «генов раннего ответа», например факторы транскрипции c-Fos и EGR1), живут минуты, и долго было неизвестно, как они разрушаются.</p><div class="note"><strong>Что показывает схема.</strong> Миднолин подаёт протеасоме белок без цепи убиквитина: при подавлении E1 разрушение продолжается, при подавлении протеасомы останавливается.</div><ol class="mech"><li>Поиск генов, без которых такие белки становятся устойчивыми, указал на белок миднолин. <a href="#ns-g-S5-T77">Миднолин</a> находится в основном в ядре и связывается с протеасомой своим длинным C-концевым α-спиральным участком. Другой его участок связывает в белке-мишени неупорядоченный гидрофобный отрезок цепи, который при связывании принимает форму β-тяжа. Третий участок миднолина, похожий на убиквитин, необходим для разрушения захваченного белка. В клетках, где подавлены ферменты E1, активирующие убиквитин, миднолин продолжал направлять мишени в протеасому, а мишени, у которых все лизины заменены, тоже разрушались; подавление протеасомы разрушение останавливало.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·3, БИО-5·4</p><p>Мишени миднолина — многие белки ядра, прежде всего регуляторы транскрипции. Значит, отсутствие убиквитина на белке ещё не доказывает, что протеасома в его разрушении не участвует.</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Схема «метка — узнавание — разрушение» верна для большинства белков, но у протеасомы есть и путь без метки, где узнавание выполняет белок-посредник.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Работа выполнена на культурах клеток человека и мыши и на нейронах мыши, в основном при повышенном синтезе миднолина; авторы допускают, что те же белки разрушаются и с участием убиквитина, параллельно.</p><div class="static-quiz"><h3>Ферменты E1, активирующие убиквитин, подавлены, а белок c-Fos всё равно разрушается, причём только при работающей протеасоме. Какой вывод допустим?</h3><ol><li><b>А.</b> c-Fos разрушается в лизосоме <i>(неверный вариант)</i><br><span class="expl">Подавление протеасомы останавливает разрушение; лизосома здесь ни при чём</span></li><li><b>Б.</b> Есть путь в протеасому без убиквитина <i>(верный вариант)</i><br><span class="expl">Миднолин захватывает такие белки и подаёт их протеасоме</span></li><li><b>В.</b> Протеасома не нужна для разрушения c-Fos <i>(неверный вариант)</i><br><span class="expl">Без протеасомы c-Fos не разрушается; не нужна оказалась метка</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-5.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.adh5021">Gu X., Nardone C., Kamitaki N., Mao A., Elledge S.J., Greenberg M.E. The midnolin-proteasome pathway catches proteins for ubiquitination-independent degradation. Science. 2023;381(6660):eadh5021</a></li></ul><p>Схема по данным работы, упрощённая: форма участков миднолина условна.</p></details></article><article class="card print-unit" id="ns-endolysosome"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 9 из 31</div><h2>Из каких компартментов состоит эндосомно-лизосомная система?</h2><p class="lead">Материал, поглощённый <a href="#ns-g-S5-T30">эндоцитозом</a>, сначала попадает в <a href="#ns-g-S5-T31">раннюю эндосому</a>. Здесь большинство лигандов отделяется от рецепторов в слабокислой среде, и рецепторы возвращаются на поверхность клетки.</p><div class="note"><strong>Что показывает схема.</strong> Ранняя эндосома созревает в позднюю (внутрипросветные пузырьки), сливается с лизосомой (эндолизосома) и становится лизосомой; pH снижается.</div><ol class="mech"><li>Ранняя эндосома созревает в <a href="#ns-g-S5-T32">позднюю эндосому</a>: её среда становится кислее. Мембранные белки, предназначенные для разрушения, уже в ранней эндосоме получают одиночные молекулы <a href="#ns-g-S5-T02">убиквитина</a> (<a href="#ns-g-S5-T07">моноубиквитинирование</a>) и с помощью комплексов ESCRT по мере созревания эндосомы уходят во <a href="#ns-g-S5-T34">внутрипросветные пузырьки</a>. Поэтому позднюю эндосому называют мультивезикулярным тельцем. Поздние эндосомы движутся по микротрубочкам к центру клетки и сливаются с <a href="#ns-g-S5-T12">лизосомами</a>, образуя <a href="#ns-g-S5-T33">эндолизосомы</a>, где идёт расщепление. Когда большая часть содержимого расщеплена, эндолизосома становится плотной небольшой лизосомой, которая может снова слиться с поздней эндосомой.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-3-route.html#rab-conversion">семинар 3: «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»</a> и <a href="seminar-3-route.html#coated-pit">семинар 3: «Как клатриновая ямка собирается вокруг рецептора с грузом»</a></p><p>Поэтому лизосомы разнообразны по форме и размеру: это не один вид органеллы, а стадии одного цикла созревания; общее у них — много кислых гидролаз. Уход рецептора во внутрипросветный пузырёк отделяет его цитозольный домен от белков цитозоля и прекращает передачу сигнала. Гидролазы приходят в поздние эндосомы из транс-сети аппарата Гольджи с меткой маннозо-6-фосфат (<a href="seminar-4-route.html#m6p-tag">семинар 4: «Как лизосомная гидролаза получает метку маннозо-6-фосфат?»</a>, <a href="seminar-4-route.html#m6p-receptor-cycle">семинар 4: «Как метка становится адресом: цикл рецептора M6P»</a>).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, вступление.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Созревание показано как последовательность; в клетке эндосомы также сливаются и делятся.</p><div class="static-quiz"><h3>Почему лизосомы в одной клетке так различаются по форме и размеру?</h3><ol><li><b>А.</b> Это разные органеллы с разными ферментами <i>(неверный вариант)</i><br><span class="expl">У всех лизосом общий признак — много кислых гидролаз; различаются содержимое и стадия</span></li><li><b>Б.</b> Лизосомы делятся только на крупные и мелкие <i>(неверный вариант)</i><br><span class="expl">Размер отражает количество и природу содержимого, а не два вида органелл</span></li><li><b>В.</b> Это стадии одного цикла созревания <i>(верный вариант)</i><br><span class="expl">Эндолизосомы с разным содержимым постепенно становятся лизосомами и снова сливаются с эндосомами</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: шкала pH справа условная, значения pH — по учебнику.</p></details></article><article class="card print-unit" id="ns-acid-hydrolases"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 10 из 31</div><h2>Какие ферменты содержит лизосома и как они туда попадают?</h2><p class="lead">Лизосома содержит около 40 видов <a href="#ns-g-S5-T13">кислых гидролаз</a> — ферментов, расщепляющих макромолекулы с присоединением воды: протеазы, нуклеазы, гликозидазы, липазы, фосфолипазы, фосфатазы и сульфатазы. Большинство из них работает лучше всего в кислой среде.</p><div class="note"><strong>Что показывает схема.</strong> Гидролаза получает метку M6P в цис-сети, в транс-сети связывается с рецептором M6P, в эндосоме отделяется и в кислом просвете становится активной.</div><ol class="mech"><li>Гидролазы синтезируются на мембране гранулярного ЭПР, в аппарате Гольджи получают метку <a href="#ns-g-S5-T36">маннозо-6-фосфат (M6P)</a> и в транс-сети связываются с <a href="#ns-g-S5-T37">рецептором M6P</a>, который доставляет их в эндосомы (<a href="seminar-4-route.html#m6p-receptor-cycle">семинар 4</a>). Многие гидролазы синтезируются как неактивные предшественники и становятся активными после расщепления; у многих это созревание идёт в кислом просвете эндосом и лизосом, но механизмы созревания и оптимальный pH у разных ферментов различаются. Лизосомные протеазы — например, <a href="#ns-g-S5-T42">катепсины</a> — разрушают белки до аминокислот и коротких пептидов.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> <a href="seminar-4-route.html#m6p-tag">семинар 4: «Как лизосомная гидролаза получает метку маннозо-6-фосфат?»</a>, <a href="seminar-4-route.html#m6p-receptor-cycle">семинар 4: «Как метка становится адресом: цикл рецептора M6P»</a></p><p>Если метка M6P не ставится, гидролазы уходят из транс-сети к поверхности клетки и секретируются, а в лизосомах копится непереваренный материал (<a href="seminar-4-route.html#label-not-enough">семинар 4: «Метка необходима, но не достаточна: что различает два дефекта с одинаковым исходом?»</a>). Если в лизосомах нет одного фермента, копятся именно его субстраты: так возникают <a href="#ns-g-S5-T41">лизосомные болезни накопления</a> (клинические примеры — иллюстрация механизма).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 2.3.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Число «около 40» — для типичной клетки млекопитающих; набор ферментов зависит от типа клетки.</p><div class="static-quiz"><h3>Почему предшественник гидролазы не становится активным уже в транс-сети аппарата Гольджи?</h3><ol><li><b>А.</b> Созреванию многих гидролаз нужна кислая среда <i>(верный вариант)</i><br><span class="expl">Расщепление предшественника идёт при кислом pH, который поддерживается в эндосомах и лизосомах</span></li><li><b>Б.</b> Предшественник активируется только в цитозоле <i>(неверный вариант)</i><br><span class="expl">В цитозоле гидролазы не нужны и малоактивны; активация идёт в кислом просвете</span></li><li><b>В.</b> Метка M6P сама разрушает фермент <i>(неверный вариант)</i><br><span class="expl">Метка служит адресом, а не разрушает фермент</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: путь гидролазы из транс-сети в лизосому, условные знаки метки.</p></details></article><article class="card print-unit" id="ns-v-atpase"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 11 из 31</div><h2>Как лизосома поддерживает кислую среду?</h2><p class="lead">pH в просвете лизосомы — около 4,5–5,0, в цитозоле — около 7,2: концентрация протонов в просвете в сотни раз выше.</p><div class="note"><strong>Что показывает схема.</strong> Насос V-типа тратит АТФ и перекачивает H⁺ из цитозоля в просвет; без насоса или без АТФ pH просвета растёт.</div><ol class="mech"><li>Такую разницу создаёт <a href="#ns-g-S5-T35">протонный насос V-типа</a> в мембране лизосомы. Он использует энергию гидролиза АТФ, чтобы перекачивать протоны из цитозоля в просвет. По строению насос V-типа похож на АТФ-синтазу митохондрий, но работает только в одном направлении — тратит АТФ, а не синтезирует его (сравните с БИО-5·25). Такие насосы закисляют эндосомы, лизосомы, часть цистерн аппарата Гольджи и многие секреторные пузырьки. Созданный градиент протонов — ещё и запас энергии: он приводит в действие <a href="#ns-g-S5-T38">переносчики лизосомной мембраны</a>, выводящие в цитозоль продукты расщепления — аминокислоты, сахара, нуклеотиды.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-1-route.html#bio-1-17">семинар 1: «Как работает Na⁺/K⁺-АТФаза?»</a> и <a href="seminar-1-route.html#bio-1-20">семинар 1: «Градиент как запасённая энергия»</a></p><p>Если насос остановить или лишить его АТФ, протоны постепенно уходят из просвета, pH приближается к нейтральному, и гидролазы работают медленно: материал доставлен, но не расщеплён.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 2.2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Скорость, с которой pH растёт после остановки насоса, на странице не показывается.</p><div class="static-quiz"><h3>Протонный насос лизосомы заблокирован, мембрана не повреждена. Что произойдёт с белком, доставленным в лизосому?</h3><ol><li><b>А.</b> Вернётся в цитозоль через мембрану <i>(неверный вариант)</i><br><span class="expl">Целая мембрана не пропускает белки обратно в цитозоль</span></li><li><b>Б.</b> Останется в лизосоме нерасщеплённым <i>(верный вариант)</i><br><span class="expl">Без кислой среды гидролазы работают медленно; доставка не нарушена</span></li><li><b>В.</b> Будет расщеплён с обычной скоростью <i>(неверный вариант)</i><br><span class="expl">Кислые гидролазы при pH, близком к нейтральному, работают медленно</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: стрелки протонов — направление, а не число частиц.</p></details></article><article class="card print-unit" id="ns-double-protection"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 12 из 31</div><h2>Почему гидролазы лизосомы не переваривают саму клетку?</h2><p class="lead">Гидролазы лизосомы расщепляют почти любые макромолекулы, однако нормальная клетка их действию не подвергается.</p><div class="note"><strong>Что показывает схема.</strong> Две защиты: мембрана с гликозилированными белками не выпускает гидролазы; в нейтральном цитозоле вышедшие гидролазы малоактивны.</div><ol class="mech"><li>Защита двойная, и два её условия независимы друг от друга. Первое — мембрана: она не выпускает гидролазы из просвета. Белки самой мембраны — <a href="#ns-g-S5-T39">LAMP и LIMP</a> — сильно гликозилированы со стороны просвета: углеводные цепи закрывают их полипептидные цепи от протеаз. Второе — нейтральная среда цитозоля: гидролазы работают лучше всего при pH около 5 и мало активны при pH цитозоля около 7,2, поэтому многие вышедшие в цитозоль ферменты работают там медленнее. Но часть активности при нейтральном pH сохраняется — например, у катепсина B (БИО-5·16), поэтому выход гидролаз в цитозоль опасен. Условия независимы: нейтральность цитозоля не зависит от лизосомы, а мембрана не выпускает ферменты при любом pH цитозоля. Кислая среда просвета, которую создаёт насос, нужна для расщепления, а не для защиты.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·10, БИО-5·11</p><p>Защита не абсолютна: при нейтральном pH активность снижается, но не у всех гидролаз до нуля (БИО-5·16), а массовое повреждение мембран многих лизосом может привести клетку к гибели (<a href="seminar-6-route.html">семинар 6</a>). Небольшие повреждения мембраны клетка устраняет: повреждённые лизосомы восстанавливаются или удаляются аутофагией (курс «Молекулярная биология»).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 2.1 (гидролаза в двух пробирках) и итоговая задача.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; На схеме показан один фермент и одна мембрана; доля активности при нейтральном pH для разных гидролаз различна.</p><div class="static-quiz"><h3>Почему гликозилированные белки мембраны лизосомы не разрушаются её протеазами?</h3><ol><li><b>А.</b> Протеазы лизосомы не расщепляют мембранные белки <i>(неверный вариант)</i><br><span class="expl">Расщепляют: после эндоцитоза мембранные белки разрушаются в лизосомах</span></li><li><b>Б.</b> Они покрыты слоем липидов цитозоля <i>(неверный вариант)</i><br><span class="expl">Они встроены в мембрану лизосомы, и их большая часть обращена в просвет</span></li><li><b>В.</b> Углеводные цепи закрывают их со стороны просвета <i>(верный вариант)</i><br><span class="expl">Протеазы не получают доступа к полипептидной цепи</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная, две панели: А — мембрана с гликозилированными белками, Б — шкала pH и относительная активность гидролазы в просвете и в цитозоле (условно).</p></details></article><article class="card print-unit" id="ns-three-streams"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 13 из 31</div><h2>Какими путями материал поступает в лизосому?</h2><p class="lead">Лизосома — место, где сходятся несколько потоков: из ЭПР через аппарат Гольджи приходят ферменты, а с поверхности клетки и из цитоплазмы — то, что нужно расщепить.</p><div class="note"><strong>Что показывает схема.</strong> В лизосому приходят материал эндоцитоза, макропиносомы, фагосомы и аутофагосомы; продукты выходят через переносчики.</div><ol class="mech"><li>Внеклеточные молекулы и мембранные белки приходят через эндоцитоз и эндосомы (БИО-5·9). <a href="#ns-g-S5-T43">Макропиноцитоз</a> — захват внеклеточной жидкости крупными пузырьками после сигнала на поверхности клетки — тоже ведёт в эндолизосомы. При <a href="#ns-g-S5-T28">фагоцитозе</a> специализированные клетки — макрофаги и нейтрофилы — окружают выростами плазматической мембраны крупные частицы, микроорганизмы и погибшие клетки; образуется <a href="#ns-g-S5-T29">фагосома</a>, которая сливается с лизосомами. Фагоцитоз начинается только после связывания частицы с рецепторами фагоцита. Собственный материал цитоплазмы приходит через <a href="#ns-g-S5-T14">аутофагию</a> (БИО-5·5). Продукты расщепления — аминокислоты, сахара, нуклеотиды — выходят в цитозоль через переносчики и используются снова.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·5, БИО-5·9</p><p>Фагоцитоз — способ захвата внешнего материала, а не отдельная система расщепления: расщепляют поглощённое те же гидролазы лизосом. Макрофаги человека ежедневно поглощают больше 10¹¹ стареющих эритроцитов. Нерасщепляемые остатки остаются в лизосоме — <a href="#ns-g-S5-T40">остаточном тельце</a> — или выводятся из клетки экзоцитозом.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, вступление и шаг 2.4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Учебная схема не показывает, что часть мембраны фагосомы возвращается на поверхность клетки.</p><div class="static-quiz"><h3>Чем фагоцитоз отличается от аутофагии?</h3><ol><li><b>А.</b> Источником материала: снаружи или из своей цитоплазмы <i>(верный вариант)</i><br><span class="expl">Фагоцитоз захватывает частицы снаружи клетки, аутофагия — собственный материал цитоплазмы</span></li><li><b>Б.</b> Местом расщепления: фагосома без лизосомы <i>(неверный вариант)</i><br><span class="expl">Фагосома сливается с лизосомами; расщепляют поглощённое те же гидролазы</span></li><li><b>В.</b> Фагоцитоз есть во всех клетках, аутофагия — нет <i>(неверный вариант)</i><br><span class="expl">Наоборот: аутофагия есть во всех клетках, фагоцитоз — в основном у специализированных</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: четыре потока к лизосоме.</p></details></article><article class="card print-unit" id="ns-delivery-vs-digestion"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 14 из 31</div><h2>Субстрат накопился: не доставлен или не расщеплён?</h2><p class="lead">Накопление материала в клетке — наблюдение, а не причина: одно и то же накопление возникает при нарушении разных звеньев.</p><div class="note"><strong>Что показывает схема.</strong> Не доставлен — копится вне лизосомы; не расщеплён — внутри; продукт не выведен — внутри копятся аминокислоты (следствие модели).</div><ol class="mech"><li>Решающее наблюдение — где именно накопился материал (для разбираемого случая; это не универсальное правило диагностики). Если не образуются аутофагосомы, агрегаты и повреждённые органеллы копятся в цитозоле, а лизосомы не переполнены грузом: материал не доставлен. Если нет кислой среды или фермента, материал копится внутри лизосом, и лизосомы увеличиваются: материал доставлен, но не расщеплён. Если не работает переносчик продукта, белок расщеплён, но внутри лизосомы копится продукт расщепления — например, аминокислота.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·11, БИО-5·13</p><p>Поэтому для вывода нужны два наблюдения: где материал и в какой форме (целый белок, агрегат, органелла или малая молекула). Тот же принцип помогает и для <a href="#ns-g-S5-T01">протеасомы</a>: белки с цепью убиквитина копятся при нарушении узнавания или расщепления, а без цепи — при отсутствии метки (БИО-5·2, БИО-5·4).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаги 2.4–2.5 и обратная задача; итоговая задача.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Пример с переносчиком продукта — следствие модели; конкретные заболевания на странице не разбираются.</p><div class="static-quiz"><h3>Агрегаты белка копятся в цитозоле, лизосомы обычного размера и с обычной кислотностью. Какое звено проверить первым?</h3><ol><li><b>А.</b> Протонный насос лизосомы <i>(неверный вариант)</i><br><span class="expl">При нарушенном закислении материал копился бы внутри лизосом</span></li><li><b>Б.</b> Образование аутофагосом <i>(верный вариант)</i><br><span class="expl">Материал не дошёл до лизосом, а сами лизосомы работают</span></li><li><b>В.</b> Переносчики продуктов расщепления <i>(неверный вариант)</i><br><span class="expl">При их нарушении внутри лизосом копились бы продукты расщепления</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная, три панели: А — не доставлен, Б — не расщеплён, В — расщеплён, продукт не выведен.</p></details></article><article class="card print-unit" id="ns-ph-vs-damage"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 15 из 31</div><h2>Незакисленная лизосома и повреждённая мембрана: чем они различаются?</h2><p class="lead">Сверх программы. Учебная модель: в лизосому за интервал поступает 50 у.е. субстрата; при pH 4,6 и целой мембране она может расщепить за интервал 60 у.е.</p><div class="note"><strong>Что показывает схема.</strong> Учебная модель A2 (интервал 4): pH 6,5 при целой мембране — запас 104 у.е.; pH 4,6, вышло 50 % — запас 80 у.е. и 10 % активности в цитозоле; вышло 10 % — запас 0 и 2 %; без доставки — 200 у.е. субстрата в цитозоле.</div><ol class="mech"><li>Два условия меняются независимо. Кислотность задаёт активность гидролаз: при pH 5,0 и ниже — 100 %, при 5,5 — 80 %, при 6,0 — 60 %, при 6,5 — 40 %, при 7,2 — 20 % (условная шкала). Повреждение мембраны задаёт, какая доля гидролаз вышла в цитозоль: 0, 10 или 50 %. Возможность расщепления за интервал = 60 у.е. × активность × доля гидролаз, оставшихся в просвете. Целая лизосома при pH 6,5 расщепляет 24 у.е. за интервал, остальные 26 у.е. копятся (за четыре интервала — 104 у.е.); гидролаз в цитозоле нет. Лизосома с повреждённой мембраной (50 %) при pH 4,6 расщепляет 30 у.е., копятся 20 у.е. за интервал (за четыре — 80 у.е.), а в цитозоле половина гидролаз, работающих там на 20 % от полной активности: 10 % от активности всех гидролаз лизосомы.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·12, БИО-5·14</p><p>Накопление субстрата в обоих случаях сопоставимо; различает их только наблюдение в цитозоле — есть ли там гидролазы. При небольшом повреждении (10 %) возможность расщепления — 54 у.е. — ещё превышает нагрузку: субстрат не копится, но в цитозоле появляется 2 % от полной активности гидролаз. Если субстрат не доставлен, лизосома не нагружена, а субстрат копится в цитозоле — 50 у.е. за интервал. Баланс каждого интервала: запас в просвете + поступило = расщеплено + запас в конце.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; В клетке при крупном повреждении мембраны протоны уходят, и pH просвета растёт; в модели pH задаётся отдельно, чтобы два условия можно было сравнить. Шкала активности — допущение; у разных гидролаз она разная.</p><div class="static-quiz"><h3>Субстрат копится в лизосомах двух клеток одинаково. Какое наблюдение различит незакисленную лизосому и повреждённую мембрану?</h3><ol><li><b>А.</b> Количество субстрата в лизосоме <i>(неверный вариант)</i><br><span class="expl">Оно в двух случаях сопоставимо и их не различает</span></li><li><b>Б.</b> Есть ли субстрат в цитозоле <i>(неверный вариант)</i><br><span class="expl">Субстрат доставлен в обоих случаях; в цитозоле он копится при нарушении доставки</span></li><li><b>В.</b> Есть ли гидролазы в цитозоле <i>(верный вариант)</i><br><span class="expl">При повреждении мембраны часть гидролаз выходит в цитозоль, при недостатке закисления — нет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Учебная модель · условные единицы; шкала активности и ёмкость — допущения, а не измеренные величины.</p></details></article><article class="card print-unit" id="ns-neutral-cathepsin"><div class="eyebrow">Лизосома: кислый компартмент с защищённой мембраной · шаг 16 из 31</div><h2>Действительно ли гидролазы неактивны при нейтральном pH?</h2><p class="lead">Сверх программы. Защита клетки от гидролаз объясняется и тем, что при нейтральном pH они менее активны. Насколько менее — зависит от фермента и от субстрата.</p><div class="note"><strong>Что показывает схема.</strong> Катепсин B: при pH 4,6 — 179 расщеплённых связей, при pH 7,2 — 109; активность для стандартного субстрата при pH 7,2 — около половины.</div><ol class="mech"><li>Работу очищенной лизосомной протеазы <a href="#ns-g-S5-T42">катепсина B</a> сравнили при pH 4,6 (как в лизосоме) и 7,2 (как в цитозоле) на сотнях разных коротких пептидов. Фермент расщеплял пептиды при обоих значениях pH; при 7,2 он расщеплял меньше разных связей (109 против 179), а предпочтения к аминокислотам рядом с местом разреза при двух значениях pH различались. Для стандартного субстрата удельная активность при pH 7,2 составила около половины активности при pH 4,6 (наибольшей она была при pH 5,5).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·12</p><p>Катепсин B обнаруживают и вне лизосом — в цитозоле, в ядре, во внеклеточной среде, — особенно при ряде заболеваний; там он может расщеплять другие белки, чем в лизосоме.</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Слова «гидролазы неактивны в цитозоле» — упрощение: многие гидролазы при нейтральном pH теряют большую часть активности, но не все. Поэтому мембрана — самостоятельное и необходимое условие защиты, а не дублирование кислотности.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Измерения выполнены с очищенным ферментом на коротких пептидах при комнатной температуре; это не измерения внутри клетки.</p><div class="static-quiz"><h3>Что следует из того, что катепсин B расщепляет пептиды и при pH 7,2?</h3><ol><li><b>А.</b> Мембрана лизосомы необходима и сама по себе <i>(верный вариант)</i><br><span class="expl">Одной кислотности недостаточно, чтобы вышедший фермент был безопасен</span></li><li><b>Б.</b> Лизосоме не нужна кислая среда <i>(неверный вариант)</i><br><span class="expl">Кислая среда нужна: многие гидролазы при нейтральном pH работают значительно хуже</span></li><li><b>В.</b> Катепсин B работает только вне лизосом <i>(неверный вариант)</i><br><span class="expl">Он работает и при лизосомном pH; различаются предпочтения к субстратам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-5.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1021/acs.biochem.2c00358">Yoon M.C., Hook V., O&#x27;Donoghue A.J. Cathepsin B dipeptidyl carboxypeptidase and endopeptidase activities demonstrated across a broad pH range. Biochemistry. 2022;61(17):1904–1914</a></li></ul><p>Схема по данным работы, упрощённая: относительные величины, а не исходные графики.</p></details></article><article class="card print-unit" id="ns-peroxisome-reactions"><div class="eyebrow">Пероксисома: окисление и перекись водорода в одном компартменте · шаг 17 из 31</div><h2>Какие реакции идут в пероксисоме?</h2><p class="lead"><a href="#ns-g-S5-T44">Пероксисома</a> — небольшая органелла, окружённая одной мембраной. Пероксисомы есть почти во всех клетках эукариот; особенно много их в клетках печени и почек.</p><div class="note"><strong>Что показывает схема.</strong> Реакции пероксисомы: RH₂ + O₂ → R + H₂O₂; 2H₂O₂ → 2H₂O + O₂; H₂O₂ + R′H₂ → R′ + 2H₂O.</div><ol class="mech"><li>Ферменты пероксисомы — <a href="#ns-g-S5-T45">оксидазы</a> — отнимают атомы водорода у органических веществ и передают их на молекулярный кислород; продукт реакции — <a href="#ns-g-S5-T46">перекись водорода (H₂O₂)</a>: RH₂ + O₂ → R + H₂O₂ (R — органическое вещество). В той же пероксисоме находится <a href="#ns-g-S5-T47">каталаза</a>. Она использует H₂O₂ двумя способами: окисляет ею другие вещества — муравьиную кислоту, формальдегид, этанол (H₂O₂ + R′H₂ → R′ + 2H₂O), а избыток H₂O₂ разлагает на воду и кислород (2H₂O₂ → 2H₂O + O₂). Так опасный продукт образуется и расходуется в одном компартменте.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·1</p><p>Главная окислительная задача пероксисом — <a href="#ns-g-S5-T48">β-окисление жирных кислот</a>: цепь укорачивается по два атома углерода, и образуются ацетил-CoA и укороченные ацил-CoA. Свободно через мембрану пероксисомы ацетил-CoA не проходит: ацильные группы выводятся, в частности, в составе ацетилкарнитина и ацилкарнитинов или после гидролиза — в виде соответствующих кислот. У млекопитающих β-окисление идёт и в митохондриях, и в пероксисомах; <a href="#ns-g-S5-T49">жирные кислоты с очень длинной цепью</a> разрушаются в пероксисомах. Пероксисомы печени и почек обезвреживают вещества, попавшие в кровь; каталаза, например, может окислять этанол до ацетальдегида, используя H₂O₂. Основной путь окисления этанола в печени человека — алкогольдегидрогеназа; вклад каталазы обычно невелик и зависит от условий. Пероксисомы животных начинают синтез <a href="#ns-g-S5-T50">плазмалогенов</a> — фосфолипидов, особенно многочисленных в миелиновой оболочке нервных волокон. Набор ферментов пероксисом различен в разных клетках и меняется при изменении условий.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.1.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; На схеме показана одна оксидаза; в пероксисоме их несколько, с разными субстратами.</p><div class="static-quiz"><h3>Во что превращается молекула O₂, когда оксидаза пероксисомы отнимает водород у жирной кислоты?</h3><ol><li><b>А.</b> В воду, как в дыхательной цепи <i>(неверный вариант)</i><br><span class="expl">До воды кислород восстанавливает дыхательная цепь митохондрии; оксидаза пероксисомы образует H₂O₂</span></li><li><b>Б.</b> В перекись водорода H₂O₂ <i>(верный вариант)</i><br><span class="expl">Два атома водорода переходят на O₂; H₂O₂ затем расходует каталаза</span></li><li><b>В.</b> В углекислый газ <i>(неверный вариант)</i><br><span class="expl">Углекислый газ образуется в других реакциях; оксидаза переносит на кислород водород</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-5.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: уравнения реакций — по учебнику; размеры не в масштабе.</p></details></article><article class="card print-unit" id="ns-peroxisome-import"><div class="eyebrow">Пероксисома: окисление и перекись водорода в одном компартменте · шаг 18 из 31</div><h2>Как белки попадают в пероксисому?</h2><p class="lead">Своей ДНК и рибосом у пероксисомы нет. Белки её просвета синтезируются на свободных рибосомах в цитозоле и приходят в уже готовую пероксисому.</p><div class="note"><strong>Что показывает схема.</strong> Импорт: Pex5 связывает белок с Ser-Lys-Leu в цитозоле, входит в транслокатор, груз освобождается свёрнутым, Pex5 с убиквитином возвращается комплексом Pex1 и Pex6.</div><ol class="mech"><li>У многих белков просвета пероксисомы на C-конце есть <a href="#ns-g-S5-T52">сигнал из трёх аминокислот Ser-Lys-Leu</a>. В цитозоле его узнаёт белок-рецептор <a href="#ns-g-S5-T53">Pex5</a>; вместе с грузом он входит в белковый транслокатор пероксисомной мембраны, отдаёт груз в просвет и возвращается в цитозоль. Для возврата Pex5 получает убиквитин, и комплекс АТФаз из Pex1 и Pex6 с затратой АТФ вытягивает его из мембраны. Другие белки несут сигнал вблизи N-конца; его узнаёт Pex7. Белки, участвующие в импорте и образовании пероксисом, называют <a href="#ns-g-S5-T51">пероксинами</a>. В отличие от транслокатора ЭПР, транслокатор пероксисомы переносит свёрнутые и даже собранные из нескольких цепей белки.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-4-route.html#er-signal">семинар 4: «Что делает участок цепи сигналом для ЭПР?»</a></p><p>Сигнал Ser-Lys-Leu достаточен: если присоединить его к C-концу белка цитозоля, этот белок окажется в пероксисоме. Необходимость импорта видна при <a href="#ns-g-S5-T57">синдроме Цельвегера</a>: из-за мутации одного из пероксинов (чаще Pex1) белки просвета остаются в цитозоле, пероксисомы «пусты», жирные кислоты с очень длинной и разветвлённой цепью не разрушаются, а плазмалогенов не хватает; страдают мозг, печень и почки (клинический пример — иллюстрация механизма).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаги 3.2–3.4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Число и названия пероксинов транслокатора на схеме не приводятся.</p><div class="static-quiz"><h3>Белок просвета пероксисомы уже свёрнут и собран из нескольких цепей. Должен ли он развернуться, чтобы войти в пероксисому?</h3><ol><li><b>А.</b> Да: через мембрану проходит только развёрнутая цепь <i>(неверный вариант)</i><br><span class="expl">Так переносят белки транслоконы ЭПР; транслокатор пероксисомы устроен иначе</span></li><li><b>Б.</b> Нет: он синтезируется прямо в пероксисоме <i>(неверный вариант)</i><br><span class="expl">Рибосом в пероксисоме нет; белки просвета синтезируются в цитозоле и импортируются</span></li><li><b>В.</b> Нет: транслокатор переносит свёрнутые белки <i>(верный вариант)</i><br><span class="expl">В этом отличие пероксисомы от ЭПР, куда цепь входит развёрнутой во время синтеза</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-5.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: цикл рецептора Pex5 по стадиям; порядок стадий — учебное деление.</p></details></article><article class="card print-unit" id="ns-peroxisome-biogenesis"><div class="eyebrow">Пероксисома: окисление и перекись водорода в одном компартменте · шаг 19 из 31</div><h2>Как образуются новые пероксисомы?</h2><p class="lead">Число пероксисом в клетке меняется: при некоторых условиях их становится много больше. Новые пероксисомы образуются двумя путями.</p><div class="note"><strong>Что показывает схема.</strong> Новые пероксисомы: деление существующих; пузырьки-предшественники из ЭПР (Pex3, Pex19) сливаются друг с другом или с пероксисомой.</div><ol class="mech"><li>Первый путь — рост и деление существующих пероксисом: в них импортируются белки и липиды, затем пероксисома делится на дочерние. Второй путь — сборка из пузырьков-предшественников; на схеме показан его вариант, который начинается в ЭПР. Некоторые мембранные белки пероксисомы — например, <a href="#ns-g-S5-T54">Pex3</a> — встраиваются в мембрану ЭПР транслоконом Sec61 и с участием белка <a href="#ns-g-S5-T55">Pex19</a> собираются в <a href="#ns-g-S5-T56">пузырьки-предшественники</a>, отпочковывающиеся от ЭПР. Пузырьки-предшественники сливаются друг с другом, образуя новую пероксисому, или с существующей пероксисомой; затем в неё импортируются белки просвета (БИО-5·18).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·18</p><p>Поэтому пероксисома не возникает «из ничего»: её мембрана происходит от уже существующих мембран — другой пероксисомы или ЭПР; в клетках млекопитающих описаны и предшественники, отпочковывающиеся от митохондрий (на схеме не показаны). Связь с ЭПР объясняет, почему пероксисомы получают из него часть липидов.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.5.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Какая доля пероксисом в клетке образуется каждым из двух путей, на странице не обсуждается; механизм отпочковывания пузырьков-предшественников изучен не полностью.</p><div class="static-quiz"><h3>В показанном на схеме пути — от какого компартмента отпочковываются пузырьки-предшественники пероксисом?</h3><ol><li><b>А.</b> Отпочковывается от ЭПР <i>(верный вариант)</i><br><span class="expl">Мембранные белки пероксисомы встраиваются в ЭПР и выходят из него в пузырьках</span></li><li><b>Б.</b> Синтезируется заново внутри пероксисомы <i>(неверный вариант)</i><br><span class="expl">Мембрана растёт из уже существующей мембраны; в показанном пути — из мембраны ЭПР</span></li><li><b>В.</b> Отделяется от митохондрии <i>(неверный вариант)</i><br><span class="expl">Не в показанном пути: здесь предшественники отпочковываются от ЭПР; в клетках млекопитающих описаны и митохондриальные предшественники пероксисом</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-5.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная, две панели: А — рост и деление, Б — пузырьки-предшественники из ЭПР.</p></details></article><article class="card print-unit" id="ns-peroxisome-partners"><div class="eyebrow">Пероксисома: окисление и перекись водорода в одном компартменте · шаг 20 из 31</div><h2>С какими органеллами взаимодействует пероксисома?</h2><p class="lead">Пероксисома выполняет свою работу не в одиночку: её продукты и субстраты переходят в другие компартменты.</p><div class="note"><strong>Что показывает схема.</strong> Партнёры пероксисомы: ЭПР (мембрана, контакт), митохондрия (β-окисление), цитозоль (ацетильные группы), лизосома (удаление).</div><ol class="mech"><li>С ЭПР пероксисому связывает происхождение части мембранных белков и липидов (БИО-5·19); вообще липиды переходят между органеллами и через <a href="#ns-g-S5-T58">мембранные контакты</a> — участки, где мембраны двух органелл удерживаются на расстоянии 10–30 нм, но не сливаются. С митохондриями пероксисому связывает β-окисление: обе органеллы окисляют жирные кислоты, а продукты пероксисомного β-окисления — ацетильные и укороченные ацильные группы — выводятся из пероксисомы в составе ацетилкарнитина и ацилкарнитинов или в виде свободных кислот и используются в синтезе или окисляются в митохондриях. Повреждённые или лишние пероксисомы разрушаются в <a href="#ns-g-S5-T12">лизосомах</a> после <a href="#ns-g-S5-T23">селективной аутофагии</a> (на электронных фотографиях в одной аутофагосоме бывают видны митохондрия и пероксисома).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·17, БИО-5·19</p><p>H₂O₂ — небольшая незаряженная молекула, она может выходить из пероксисомы в цитозоль (БИО-5·22). Поэтому разделение «пероксисома — опасная химия, цитозоль — безопасно» верно только как соотношение скоростей образования и удаления H₂O₂, а не как полная изоляция.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.6.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Белки, удерживающие мембраны в контакте, на странице не называются.</p><div class="static-quiz"><h3>Что общего у пероксисомы и митохондрии клетки печени?</h3><ol><li><b>А.</b> Обе получают белки только из ЭПР <i>(неверный вариант)</i><br><span class="expl">Большинство белков обеих органелл приходит из цитозоля</span></li><li><b>Б.</b> Обе окисляют жирные кислоты <i>(верный вариант)</i><br><span class="expl">Β-окисление идёт в обеих органеллах; жирные кислоты с очень длинной цепью окисляются в пероксисоме</span></li><li><b>В.</b> Обе синтезируют АТФ на своей мембране <i>(неверный вариант)</i><br><span class="expl">АТФ-синтаза есть во внутренней мембране митохондрии, но не в пероксисоме</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-5.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: пероксисома в окружении ЭПР, митохондрии и лизосомы; стрелки — направления потоков.</p></details></article><article class="card print-unit" id="ns-h2o2-balance"><div class="eyebrow">Пероксисома: окисление и перекись водорода в одном компартменте · шаг 21 из 31</div><h2>Образование и накопление H₂O₂ — не одно и то же</h2><p class="lead">Сверх программы. Учебная потоковая модель: за интервал в пероксисоме образуется P у.е. H₂O₂; каталаза может разложить за интервал до K у.е.; половина неразложенной H₂O₂ выходит за интервал в цитозоль, где другие ферменты удаляют до 20 у.е. за интервал (все величины — допущения).</p><div class="note"><strong>Что показывает схема.</strong> Учебная модель A3 (интервал 4): норма — ничего не копится; образование 100 при каталазе 80, образование 40 при каталазе 20 и P = 60 при K = 40 дают одинаковые запас и выход — 18,75 у.е.</div><ol class="mech"><li>При P = 40 и K = 80 вся H₂O₂ разлагается сразу, ничего не копится и не выходит. Если увеличить образование до P = 100 при K = 80, каталаза разлагает 80 у.е., оставшиеся 20 у.е. за интервал копятся в пероксисоме и частично выходят в цитозоль: к четвёртому интервалу в пероксисоме 18,75 у.е., и столько же выходит в цитозоль за интервал. Если оставить P = 40, а работу каталазы снизить до K = 20, все показатели будут теми же: избыток в обоих случаях 20 у.е. за интервал. Накопление определяется разностью скоростей образования и удаления, а не каждой из них отдельно.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·17</p><p>Различает две причины только измерение одной из скоростей: работа каталазы — 80 у.е. в первом случае и 20 у.е. во втором. Тот же результат даёт и любое другое сочетание с избытком 20 у.е. за интервал, например P = 60 и K = 40. Если же избыток больше, чем успевают удалить ферменты цитозоля (20 у.е. за интервал), H₂O₂ начинает копиться и в цитозоле. Баланс: запасы в начале + образовано = разложено каталазой + удалено в цитозоле + запасы в конце.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; В клетке каталаза не имеет постоянного предела, как в модели: скорость её работы растёт с количеством H₂O₂; предел — упрощение модели. Каталаза — не единственный фермент, удаляющий H₂O₂; часть H₂O₂ используется в передаче сигналов (БИО-5·22). Доля выхода, ёмкости и скорости — допущения, концентрации не показаны.</p><div class="static-quiz"><h3>В двух клетках H₂O₂ выходит из пероксисом с одинаковой скоростью. Какое измерение покажет причину?</h3><ol><li><b>А.</b> Количество H₂O₂ в пероксисоме <i>(неверный вариант)</i><br><span class="expl">Оно в двух случаях одинаково и причины не различает</span></li><li><b>Б.</b> Число пероксисом в клетке <i>(неверный вариант)</i><br><span class="expl">В модели число пероксисом одинаково; различаются скорости</span></li><li><b>В.</b> Работа каталазы в пероксисомах <i>(верный вариант)</i><br><span class="expl">Одинаковый избыток даёт и усиленное образование, и ослабленное удаление</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-5.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.3389/fcell.2022.888873">Lismont C., Revenco I., Li H., Costa C.F., Lenaerts L., Hussein M.A.F., De Bie J., Knoops B., Van Veldhoven P.P., Derua R., Fransen M. Peroxisome-derived hydrogen peroxide modulates the sulfenylation profiles of key redox signaling proteins in Flp-In T-REx 293 cells. Front Cell Dev Biol. 2022;10:888873</a></li></ul><p>Учебная модель · условные единицы; ёмкости и доля выхода — допущения, а не измеренные величины.</p></details></article><article class="card print-unit" id="ns-h2o2-reach"><div class="eyebrow">Пероксисома: окисление и перекись водорода в одном компартменте · шаг 22 из 31</div><h2>Остаётся ли перекись водорода пероксисомы внутри неё?</h2><p class="lead">Сверх программы. H₂O₂ не только опасна: в малых количествах она служит сигнальной молекулой, окисляя определённые остатки цистеина в белках и меняя их работу.</p><div class="note"><strong>Что показывает схема.</strong> В условиях работы H₂O₂ пероксисом окисляла белки пероксисом, цитозоля и митохондрий; образование H₂O₂ было искусственно усилено, каталаза подавлена.</div><ol class="mech"><li>В клетках человека в культуре образование H₂O₂ в пероксисомах искусственно усилили: туда направили фермент, образующий H₂O₂ только в присутствии определённой аминокислоты в среде; каталазу в большинстве экспериментов подавляли. В этих условиях перекись, образованная в пероксисомах, окисляла остатки цистеина в белках пероксисом, цитозоля и митохондрий — больше 400 разных белков, в том числе пероксиредоксины, белки цитоскелета, шапероны, ферменты гликолиза и белки митохондрий. Подавление каталазы усиливало эффект: каталаза ограничивает выход H₂O₂, особенно когда её образуется много.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·20, БИО-5·21</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Пероксисома — не замкнутый «ящик для опасной химии», а источник H₂O₂, который влияет на белки цитозоля и митохондрий. Поэтому утверждение о полной изоляции опасного продукта неверно: изоляция частичная и зависит от соотношения образования и удаления (БИО-5·21).</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Эксперименты выполнены на культуре клеток при повышенном содержании кислорода, обычно в присутствии ингибитора каталазы, при искусственно усиленном образовании H₂O₂ и по одной биологической повторности на условие; концентрацию H₂O₂ в цитозоле авторы оценивают косвенно. Что окисление каждого белка меняет в его работе, в работе не проверялось.</p><div class="static-quiz"><h3>Что показывает окисление белков митохондрий перекисью, образованной в пероксисомах?</h3><ol><li><b>А.</b> H₂O₂ выходит за пределы пероксисомы <i>(верный вариант)</i><br><span class="expl">Часть её доходит до цитозоля и митохондрий</span></li><li><b>Б.</b> Пероксисомы и митохондрии — один компартмент <i>(неверный вариант)</i><br><span class="expl">Это разные органеллы; H₂O₂ переходит между ними через цитозоль</span></li><li><b>В.</b> Каталаза находится в митохондриях <i>(неверный вариант)</i><br><span class="expl">Каталаза — фермент пероксисом; её подавление усиливало выход H₂O₂</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-5.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.3389/fcell.2022.888873">Lismont C., Revenco I., Li H., Costa C.F., Lenaerts L., Hussein M.A.F., De Bie J., Knoops B., Van Veldhoven P.P., Derua R., Fransen M. Peroxisome-derived hydrogen peroxide modulates the sulfenylation profiles of key redox signaling proteins in Flp-In T-REx 293 cells. Front Cell Dev Biol. 2022;10:888873</a></li></ul><p>Схема по данным работы, упрощённая: компартменты и число найденных белков — качественно.</p></details></article><article class="card print-unit" id="ns-mito-compartments"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 23 из 31</div><h2>Из каких компартментов состоит митохондрия?</h2><p class="lead"><a href="#ns-g-S5-T59">Митохондрия</a> окружена двумя мембранами — <a href="#ns-g-S5-T60">наружной</a> и <a href="#ns-g-S5-T63">внутренней</a>. Они ограничивают два водных компартмента: <a href="#ns-g-S5-T62">межмембранное пространство</a> и <a href="#ns-g-S5-T65">матрикс</a>. Митохондрия производит большую часть АТФ клетки.</p><div class="note"><strong>Что показывает схема.</strong> Митохондрия: наружная мембрана с поринами, межмембранное пространство, внутренняя мембрана с кристами, матрикс.</div><ol class="mech"><li>Наружная мембрана содержит много белков-каналов <a href="#ns-g-S5-T61">поринов</a> и свободно пропускает ионы и молекулы массой до 5000 дальтон; поэтому по составу малых молекул межмембранное пространство похоже на цитозоль. Межмембранное пространство — узкий промежуток шириной 20–30 нм. Внутренняя мембрана образует складки — <a href="#ns-g-S5-T64">кристы</a>, в мембране которых находятся белки <a href="#ns-g-S5-T66">дыхательной цепи</a> и <a href="#ns-g-S5-T71">АТФ-синтаза</a>; эта мембрана почти непроницаема для ионов и пропускает вещества только через специальные белки-переносчики. Матрикс содержит ферменты цикла лимонной кислоты и β-окисления жирных кислот, митохондриальную ДНК и рибосомы.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-1-route.html#bio-1-11">семинар 1: «Электрохимический градиент: два вклада в движение иона»</a></p><p>Непроницаемость внутренней мембраны — условие работы митохондрии: только поэтому перекачанные протоны не возвращаются в матрикс сами и градиент сохраняется (БИО-5·24). Большинство белков митохондрии кодируется ядерной ДНК и импортируется из цитозоля (БИО-5·27). Митохондриальная ДНК человека кодирует лишь 13 белков и 24 РНК, нужные для синтеза белка в самой митохондрии; от поколения к поколению она передаётся по материнской линии. Митохондрии, как и ЭПР, служат внутриклеточным депо Ca²⁺. Митохондрий больше там, где много АТФ расходуется: в сердечной мышце, вокруг жгутика сперматозоида.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, вступление и шаг 4.1.</p><
