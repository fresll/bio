кие","correct":false,"feedback":"Размер отражает количество и природу содержимого, а не два вида органелл"},{"id":"S5-L09-3","text":"Это стадии одного цикла созревания","correct":true,"feedback":"Эндолизосомы с разным содержимым постепенно становятся лизосомами и снова сливаются с эндосомами"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как созревает эндосома в лизосому?","status":"Схема качественная · pH — по учебнику","modes_label":"Стадия","modes":["ранняя эндосома","поздняя эндосома","эндолизосома","лизосома"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Ранняя эндосома: рецепторы возвращаются к мембране, среда слабокислая","Поздняя эндосома: мембранные белки с одиночным убиквитином уходят во внутрипросветные пузырьки (ESCRT)","Эндолизосома: поздняя эндосома сливается с лизосомой, гидролазы приходят из транс-сети","Лизосома: самая кислая среда, расщепление до мономеров"],"static":["Ранняя эндосома созревает в позднюю (внутрипросветные пузырьки), сливается с лизосомой (эндолизосома) и становится лизосомой; pH снижается."],"scene":"s5_r_endolyso","L":{"s5_el_back":"рецептор возвращается","s5_el_early":"ранняя эндосома","s5_el_endolyso":"эндолизосома","s5_el_escrt":"ESCRT: внутрипросветные пузырьки","s5_el_late":"поздняя эндосома","s5_el_mt":"микротрубочка","s5_el_ph1":"pH ≈ 6","s5_el_ph2":"pH снижается","s5_el_ph3":"pH снижается","s5_el_ph4":"pH ≈ 4,5–5","s5_el_tgn":"гидролазы из транс-сети","s5_l_cytosol":"цитозоль","s5_l_lysosome":"лизосома"}}}},{"id":"acid-hydrolases","num":10,"section":1,"questions":[2],"title":"Какие ферменты содержит лизосома и как они туда попадают?","keywords":["Кислые гидролазы","Маннозо-6-фосфат (M6P)","Рецептор M6P","Катепсины","Лизосомная болезнь накопления"],"lead":["Лизосома содержит около 40 видов [[T13|кислых гидролаз]] — ферментов, расщепляющих макромолекулы с присоединением воды: протеазы, нуклеазы, гликозидазы, липазы, фосфолипазы, фосфатазы и сульфатазы. Большинство из них работает лучше всего в кислой среде."],"mechanism":["Гидролазы синтезируются на мембране гранулярного ЭПР, в аппарате Гольджи получают метку [[T36|маннозо-6-фосфат (M6P)]] и в транс-сети связываются с [[T37|рецептором M6P]], который доставляет их в эндосомы ([[seminar-4-route.html#m6p-receptor-cycle|семинар 4]]). Многие гидролазы синтезируются как неактивные предшественники и становятся активными после расщепления; у многих это созревание идёт в кислом просвете эндосом и лизосом, но механизмы созревания и оптимальный pH у разных ферментов различаются. Лизосомные протеазы — например, [[T42|катепсины]] — разрушают белки до аминокислот и коротких пептидов."],"paragraphs":["Если метка M6P не ставится, гидролазы уходят из транс-сети к поверхности клетки и секретируются, а в лизосомах копится непереваренный материал ([[seminar-4-route.html#label-not-enough|семинар 4: «Метка необходима, но не достаточна: что различает два дефекта с одинаковым исходом?»]]). Если в лизосомах нет одного фермента, копятся именно его субстраты: так возникают [[T41|лизосомные болезни накопления]] (клинические примеры — иллюстрация механизма).","<b>На практикуме.<\/b> Вкладка 2, шаг 2.3.","<b>Ограничения.<\/b> Число «около 40» — для типичной клетки млекопитающих; набор ферментов зависит от типа клетки."],"conditions":"Схема качественная: путь гидролазы из транс-сети в лизосому, условные знаки метки.","sources":["src_01"],"base":"[[seminar-4-route.html#m6p-tag|семинар 4: «Как лизосомная гидролаза получает метку маннозо-6-фосфат?»]], [[seminar-4-route.html#m6p-receptor-cycle|семинар 4: «Как метка становится адресом: цикл рецептора M6P»]]","quiz":{"id":"S5-L10","question":"Почему предшественник гидролазы не становится активным уже в транс-сети аппарата Гольджи?","options":[{"id":"S5-L10-1","text":"Созреванию многих гидролаз нужна кислая среда","correct":true,"feedback":"Расщепление предшественника идёт при кислом pH, который поддерживается в эндосомах и лизосомах"},{"id":"S5-L10-2","text":"Предшественник активируется только в цитозоле","correct":false,"feedback":"В цитозоле гидролазы не нужны и малоактивны; активация идёт в кислом просвете"},{"id":"S5-L10-3","text":"Метка M6P сама разрушает фермент","correct":false,"feedback":"Метка служит адресом, а не разрушает фермент"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как гидролаза попадает в лизосому и активируется?","status":"Схема качественная","modes_label":"Этап","modes":["метка","рецептор","активация"],"args":[["tag2"],["A",2],{}],"notes":["Метка M6P ставится на гидролазу в цис-сети аппарата Гольджи","В транс-сети рецептор M6P связывает гидролазу и направляет её в эндосому","В кислом просвете предшественник гидролазы становится активным"],"static":["Гидролаза получает метку M6P в цис-сети, в транс-сети связывается с рецептором M6P, в эндосоме отделяется и в кислом просвете становится активной."],"scene":"s4_t3a","scenes":["s4_t3a","s4_t3b","s5_t2_preact"],"L":{"lbl_cytosol":"цитозоль","lbl_out":"снаружи клетки","s4_t3a_cis":"цис-сеть","s4_t3a_glcnacp":"N-ацетилглюкозаминфосфат","s4_t3a_hyd":"лизосомная гидролаза","s4_t3a_patch":"сигнальный участок поверхности гидролазы","s4_t3a_ptr":"фермент метки (фосфотрансфераза)","s4_t3a_secp":"секретируемый гликопротеин: метки нет","s4_t3b_clat":"клатрин","s4_t3b_endo":"эндосома","s4_t3b_lyso":"лизосома","s4_t3b_ph_end":"pH ≈ 6","s4_t3b_ph_tgn":"pH ≈ 6,5–6,7","s4_t3b_pm":"плазматическая мембрана","s4_t3b_tgn":"транс-сеть","s5_l_cytosol":"цитозоль","s5_t2p_acid":"кислая среда","s5_t2p_active":"активный фермент","s5_t2p_lumen":"просвет эндосомы и лизосомы","s5_t2p_pre":"предшественник"}}}},{"id":"v-atpase","num":11,"section":1,"questions":[2],"title":"Как лизосома поддерживает кислую среду?","keywords":["Протонный насос V-типа","Переносчики лизосомной мембраны"],"lead":["pH в просвете лизосомы — около 4,5–5,0, в цитозоле — около 7,2: концентрация протонов в просвете в сотни раз выше."],"mechanism":["Такую разницу создаёт [[T35|протонный насос V-типа]] в мембране лизосомы. Он использует энергию гидролиза АТФ, чтобы перекачивать протоны из цитозоля в просвет. По строению насос V-типа похож на АТФ-синтазу митохондрий, но работает только в одном направлении — тратит АТФ, а не синтезирует его (сравните с БИО-5·25). Такие насосы закисляют эндосомы, лизосомы, часть цистерн аппарата Гольджи и многие секреторные пузырьки. Созданный градиент протонов — ещё и запас энергии: он приводит в действие [[T38|переносчики лизосомной мембраны]], выводящие в цитозоль продукты расщепления — аминокислоты, сахара, нуклеотиды."],"paragraphs":["Если насос остановить или лишить его АТФ, протоны постепенно уходят из просвета, pH приближается к нейтральному, и гидролазы работают медленно: материал доставлен, но не расщеплён.","<b>На практикуме.<\/b> Вкладка 2, шаг 2.2.","<b>Ограничения.<\/b> Скорость, с которой pH растёт после остановки насоса, на странице не показывается."],"conditions":"Схема качественная: стрелки протонов — направление, а не число частиц.","sources":["src_01"],"base":"вспомнить [[seminar-1-route.html#bio-1-17|семинар 1: «Как работает Na⁺/K⁺-АТФаза?»]] и [[seminar-1-route.html#bio-1-20|семинар 1: «Градиент как запасённая энергия»]]","quiz":{"id":"S5-L11","question":"Протонный насос лизосомы заблокирован, мембрана не повреждена. Что произойдёт с белком, доставленным в лизосому?","options":[{"id":"S5-L11-1","text":"Вернётся в цитозоль через мембрану","correct":false,"feedback":"Целая мембрана не пропускает белки обратно в цитозоль"},{"id":"S5-L11-2","text":"Останется в лизосоме нерасщеплённым","correct":true,"feedback":"Без кислой среды гидролазы работают медленно; доставка не нарушена"},{"id":"S5-L11-3","text":"Будет расщеплён с обычной скоростью","correct":false,"feedback":"Кислые гидролазы при pH, близком к нейтральному, работают медленно"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как насос создаёт кислую среду?","status":"Схема качественная","modes_label":"Условие","modes":["насос работает","насос заблокирован","нет АТФ"],"args":[{"pump":true},{"pump":false},{"pump":true,"atp":false}],"notes":["насос тратит АТФ и перекачивает H⁺ в просвет","H⁺ уходит, pH растёт","без АТФ насос не работает: исход тот же"],"static":["Насос V-типа тратит АТФ и перекачивает H⁺ из цитозоля в просвет; без насоса или без АТФ pH просвета растёт."],"scene":"s5_r_vatpase","L":{"s5_l_pump":"протонный насос V-типа","s5_l_transporter":"переносчик продуктов","s5_va_cyto":"цитозоль: pH ≈ 7,2","s5_va_lumen":"просвет: pH ≈ 4,5–5","s5_va_noatp":"АТФ нет","s5_va_up":"H⁺ уходит, pH растёт"}}},"exam_quiz":{"id":"S5-E10","question":"Что общего у протонного насоса лизосомы и АТФ-синтазы митохондрии?","options":[{"id":"S5-E10-1","text":"Сходное строение; насос тратит АТФ","correct":true,"feedback":"Насос V-типа гидролизует АТФ, перекачивая протоны, а синтаза синтезирует АТФ за счёт потока протонов"},{"id":"S5-E10-2","text":"Оба синтезируют АТФ","correct":false,"feedback":"Насос лизосомы работает только на гидролиз АТФ"},{"id":"S5-E10-3","text":"Оба находятся в наружной мембране","correct":false,"feedback":"Насос — в мембране лизосомы, синтаза — во внутренней мембране митохондрии"}]}},{"id":"double-protection","num":12,"section":1,"questions":[2],"title":"Почему гидролазы лизосомы не переваривают саму клетку?","keywords":["Гликозилированные мембранные белки лизосомы (LAMP, LIMP)"],"lead":["Гидролазы лизосомы расщепляют почти любые макромолекулы, однако нормальная клетка их действию не подвергается."],"mechanism":["Защита двойная, и два её условия независимы друг от друга. Первое — мембрана: она не выпускает гидролазы из просвета. Белки самой мембраны — [[T39|LAMP и LIMP]] — сильно гликозилированы со стороны просвета: углеводные цепи закрывают их полипептидные цепи от протеаз. Второе — нейтральная среда цитозоля: гидролазы работают лучше всего при pH около 5 и мало активны при pH цитозоля около 7,2, поэтому многие вышедшие в цитозоль ферменты работают там медленнее. Но часть активности при нейтральном pH сохраняется — например, у катепсина B (БИО-5·16), поэтому выход гидролаз в цитозоль опасен. Условия независимы: нейтральность цитозоля не зависит от лизосомы, а мембрана не выпускает ферменты при любом pH цитозоля. Кислая среда просвета, которую создаёт насос, нужна для расщепления, а не для защиты."],"paragraphs":["Защита не абсолютна: при нейтральном pH активность снижается, но не у всех гидролаз до нуля (БИО-5·16), а массовое повреждение мембран многих лизосом может привести клетку к гибели ([[seminar-6-route.html|семинар 6]]). Небольшие повреждения мембраны клетка устраняет: повреждённые лизосомы восстанавливаются или удаляются аутофагией (курс «Молекулярная биология»).","<b>На практикуме.<\/b> Вкладка 2, шаг 2.1 (гидролаза в двух пробирках) и итоговая задача.","<b>Ограничения.<\/b> На схеме показан один фермент и одна мембрана; доля активности при нейтральном pH для разных гидролаз различна."],"conditions":"Схема качественная, две панели: А — мембрана с гликозилированными белками, Б — шкала pH и относительная активность гидролазы в просвете и в цитозоле (условно).","sources":["src_01"],"base":"БИО-5·10, БИО-5·11","quiz":{"id":"S5-L12","question":"Почему гликозилированные белки мембраны лизосомы не разрушаются её протеазами?","options":[{"id":"S5-L12-1","text":"Протеазы лизосомы не расщепляют мембранные белки","correct":false,"feedback":"Расщепляют: после эндоцитоза мембранные белки разрушаются в лизосомах"},{"id":"S5-L12-2","text":"Они покрыты слоем липидов цитозоля","correct":false,"feedback":"Они встроены в мембрану лизосомы, и их большая часть обращена в просвет"},{"id":"S5-L12-3","text":"Углеводные цепи закрывают их со стороны просвета","correct":true,"feedback":"Протеазы не получают доступа к полипептидной цепи"}]},"widget":{"kind":"dna","title":"","s":{"title":"Два независимых условия защиты","status":"Схема качественная · доля активности условна","modes_label":"Панель","modes":["А мембрана","Б нейтральный цитозоль","оба условия"],"args":[{"panel":"A"},{"panel":"B"},{"panel":"AB"}],"notes":["мембрана не выпускает гидролазы в цитозоль","вышедшие в цитозоль гидролазы при pH 7,2 малоактивны (доля условна)","условия независимы: нейтральность цитозоля не зависит от лизосомы"],"static":["Две защиты: мембрана с гликозилированными белками не выпускает гидролазы; в нейтральном цитозоле вышедшие гидролазы малоактивны."],"scene":"s5_t2a","L":{"s5_l_cytosol":"цитозоль","s5_l_hydrolases":"кислые гидролазы","s5_t2a_act_c":"активность в цитозоле (доля условна)","s5_t2a_glyc":"углеводные цепи — со стороны просвета","s5_t2a_lamp":"гликозилированные белки (LAMP, LIMP)","s5_t2a_lumen":"просвет лизосомы","s5_t2a_nopass":"мембрана не выпускает гидролазы","s5_t2a_ph_c":"цитозоль: pH ≈ 7,2","s5_t2a_ph_l":"просвет: pH ≈ 5"}}}},{"id":"three-streams","num":13,"section":1,"questions":[2],"title":"Какими путями материал поступает в лизосому?","keywords":["Макропиноцитоз","Фагоцитоз","Фагосома","Аутофагия","Остаточное тельце"],"lead":["Лизосома — место, где сходятся несколько потоков: из ЭПР через аппарат Гольджи приходят ферменты, а с поверхности клетки и из цитоплазмы — то, что нужно расщепить."],"mechanism":["Внеклеточные молекулы и мембранные белки приходят через эндоцитоз и эндосомы (БИО-5·9). [[T43|Макропиноцитоз]] — захват внеклеточной жидкости крупными пузырьками после сигнала на поверхности клетки — тоже ведёт в эндолизосомы. При [[T28|фагоцитозе]] специализированные клетки — макрофаги и нейтрофилы — окружают выростами плазматической мембраны крупные частицы, микроорганизмы и погибшие клетки; образуется [[T29|фагосома]], которая сливается с лизосомами. Фагоцитоз начинается только после связывания частицы с рецепторами фагоцита. Собственный материал цитоплазмы приходит через [[T14|аутофагию]] (БИО-5·5). Продукты расщепления — аминокислоты, сахара, нуклеотиды — выходят в цитозоль через переносчики и используются снова."],"paragraphs":["Фагоцитоз — способ захвата внешнего материала, а не отдельная система расщепления: расщепляют поглощённое те же гидролазы лизосом. Макрофаги человека ежедневно поглощают больше 10¹¹ стареющих эритроцитов. Нерасщепляемые остатки остаются в лизосоме — [[T40|остаточном тельце]] — или выводятся из клетки экзоцитозом.","<b>На практикуме.<\/b> Вкладка 2, вступление и шаг 2.4.","<b>Ограничения.<\/b> Учебная схема не показывает, что часть мембраны фагосомы возвращается на поверхность клетки."],"conditions":"Схема качественная: четыре потока к лизосоме.","sources":["src_01"],"base":"БИО-5·5, БИО-5·9","quiz":{"id":"S5-L13","question":"Чем фагоцитоз отличается от аутофагии?","options":[{"id":"S5-L13-1","text":"Источником материала: снаружи или из своей цитоплазмы","correct":true,"feedback":"Фагоцитоз захватывает частицы снаружи клетки, аутофагия — собственный материал цитоплазмы"},{"id":"S5-L13-2","text":"Местом расщепления: фагосома без лизосомы","correct":false,"feedback":"Фагосома сливается с лизосомами; расщепляют поглощённое те же гидролазы"},{"id":"S5-L13-3","text":"Фагоцитоз есть во всех клетках, аутофагия — нет","correct":false,"feedback":"Наоборот: аутофагия есть во всех клетках, фагоцитоз — в основном у специализированных"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какими путями материал приходит в лизосому?","status":"Схема качественная","modes_label":"Поток","modes":["эндоцитоз","макропиноцитоз","фагоцитоз","аутофагия"],"args":[{"stream":1},{"stream":2},{"stream":3},{"stream":4}],"notes":["Эндоцитоз: материал с поверхности проходит раннюю и позднюю эндосому","Макропиноцитоз: крупный пузырь с внеклеточной жидкостью созревает и сливается с лизосомой","Фагоцитоз: фагосома с крупной частицей сливается с лизосомой","Аутофагия: аутофагосома с материалом цитоплазмы сливается с лизосомой"],"static":["В лизосому приходят материал эндоцитоза, макропиносомы, фагосомы и аутофагосомы; продукты выходят через переносчики."],"scene":"s5_r_streams","L":{"s5_l_cytosol":"цитозоль","s5_l_lysosome":"лизосома","s5_l_outside":"снаружи клетки","s5_sm_auto":"аутофагосома","s5_sm_endo":"эндосома","s5_sm_macro":"макропиносома","s5_sm_phago":"фагосома","s5_sm_tr":"переносчики: выход продуктов"}}},"exam_quiz":{"id":"S5-E05","question":"Что выходит из лизосомы в цитозоль после расщепления белков?","options":[{"id":"S5-E05-1","text":"Целые белки, через мембрану","correct":false,"feedback":"Мембрана не пропускает белки в цитозоль"},{"id":"S5-E05-2","text":"Аминокислоты, через переносчики мембраны","correct":true,"feedback":"Они используются для синтеза новых белков"},{"id":"S5-E05-3","text":"Гидролазы, после окончания работы","correct":false,"feedback":"Гидролазы остаются в просвете"}]}},{"id":"delivery-vs-digestion","num":14,"section":1,"questions":[2],"title":"Субстрат накопился: не доставлен или не расщеплён?","keywords":["Протеасома"],"lead":["Накопление материала в клетке — наблюдение, а не причина: одно и то же накопление возникает при нарушении разных звеньев."],"mechanism":["Решающее наблюдение — где именно накопился материал (для разбираемого случая; это не универсальное правило диагностики). Если не образуются аутофагосомы, агрегаты и повреждённые органеллы копятся в цитозоле, а лизосомы не переполнены грузом: материал не доставлен. Если нет кислой среды или фермента, материал копится внутри лизосом, и лизосомы увеличиваются: материал доставлен, но не расщеплён. Если не работает переносчик продукта, белок расщеплён, но внутри лизосомы копится продукт расщепления — например, аминокислота."],"paragraphs":["Поэтому для вывода нужны два наблюдения: где материал и в какой форме (целый белок, агрегат, органелла или малая молекула). Тот же принцип помогает и для [[T01|протеасомы]]: белки с цепью убиквитина копятся при нарушении узнавания или расщепления, а без цепи — при отсутствии метки (БИО-5·2, БИО-5·4).","<b>На практикуме.<\/b> Вкладка 2, шаги 2.4–2.5 и обратная задача; итоговая задача.","<b>Ограничения.<\/b> Пример с переносчиком продукта — следствие модели; конкретные заболевания на странице не разбираются."],"conditions":"Схема качественная, три панели: А — не доставлен, Б — не расщеплён, В — расщеплён, продукт не выведен.","sources":["src_01"],"base":"БИО-5·11, БИО-5·13","quiz":{"id":"S5-L14","question":"Агрегаты белка копятся в цитозоле, лизосомы обычного размера и с обычной кислотностью. Какое звено проверить первым?","options":[{"id":"S5-L14-1","text":"Протонный насос лизосомы","correct":false,"feedback":"При нарушенном закислении материал копился бы внутри лизосом"},{"id":"S5-L14-2","text":"Образование аутофагосом","correct":true,"feedback":"Материал не дошёл до лизосом, а сами лизосомы работают"},{"id":"S5-L14-3","text":"Переносчики продуктов расщепления","correct":false,"feedback":"При их нарушении внутри лизосом копились бы продукты расщепления"}]},"widget":{"kind":"dna","title":"","s":{"title":"Не доставлен или не расщеплён?","status":"Схема качественная · панель В — следствие модели","modes_label":"Панель","modes":["А не доставлен","Б не расщеплён","В продукт не выведен"],"args":[{"panel":"A"},{"panel":"B"},{"panel":"C"}],"notes":["А: агрегат не доставлен — копится в цитозоле","Б: груз доставлен, но в незакисленной лизосоме не расщеплён — копится внутри","В: белки расщеплены, но аминокислоты не выходят (следствие модели)"],"static":["Не доставлен — копится вне лизосомы; не расщеплён — внутри; продукт не выведен — внутри копятся аминокислоты (следствие модели)."],"scene":"s5_t2b","L":{"s5_l_atp":"АТФ","s5_l_cytosol":"цитозоль","s5_l_lysosome":"лизосома","s5_l_pump":"протонный насос V-типа","s5_l_transporter":"переносчик продуктов","s5_t2b_aa":"аминокислоты","s5_t2b_ap":"аутофагосома с агрегатом","s5_t2b_endo":"поздняя эндосома: белок из эндоцитоза","s5_t2b_noap":"агрегат без мембраны","s5_t2b_out":"в цитозоль","s5_t2b_ph_acid":"pH ≈ 4,5–5","s5_t2b_ph_neut":"pH почти нейтральный","s5_t2b_stop_ap":"груз в цитозоле","s5_t2b_stop_pump":"pH растёт, расщепление медленное","s5_t2b_stop_tr":"продукты остаются в лизосоме (следствие модели)","s5_t2b_tgn":"пузырёк из транс-сети: гидролаза с меткой M6P"}}},"exam_quiz":{"id":"S5-E04","question":"Что такое остаточное тельце?","options":[{"id":"S5-E04-1","text":"Лизосома с нерасщеплёнными остатками","correct":true,"feedback":"Остатки могут сохраняться долго или выводиться экзоцитозом"},{"id":"S5-E04-2","text":"Аутофагосома до слияния с лизосомой","correct":false,"feedback":"В аутофагосоме гидролаз ещё нет"},{"id":"S5-E04-3","text":"Ранняя эндосома без гидролаз","correct":false,"feedback":"Ранняя эндосома — сортировочный компартмент, а не место хранения остатков"}]}},{"id":"ph-vs-damage","num":15,"section":1,"questions":[2],"title":"Незакисленная лизосома и повреждённая мембрана: чем они различаются?","keywords":[],"lead":["Сверх программы. Учебная модель: в лизосому за интервал поступает 50 у.е. субстрата; при pH 4,6 и целой мембране она может расщепить за интервал 60 у.е."],"mechanism":["Два условия меняются независимо. Кислотность задаёт активность гидролаз: при pH 5,0 и ниже — 100 %, при 5,5 — 80 %, при 6,0 — 60 %, при 6,5 — 40 %, при 7,2 — 20 % (условная шкала). Повреждение мембраны задаёт, какая доля гидролаз вышла в цитозоль: 0, 10 или 50 %. Возможность расщепления за интервал = 60 у.е. × активность × доля гидролаз, оставшихся в просвете. Целая лизосома при pH 6,5 расщепляет 24 у.е. за интервал, остальные 26 у.е. копятся (за четыре интервала — 104 у.е.); гидролаз в цитозоле нет. Лизосома с повреждённой мембраной (50 %) при pH 4,6 расщепляет 30 у.е., копятся 20 у.е. за интервал (за четыре — 80 у.е.), а в цитозоле половина гидролаз, работающих там на 20 % от полной активности: 10 % от активности всех гидролаз лизосомы."],"paragraphs":["Накопление субстрата в обоих случаях сопоставимо; различает их только наблюдение в цитозоле — есть ли там гидролазы. При небольшом повреждении (10 %) возможность расщепления — 54 у.е. — ещё превышает нагрузку: субстрат не копится, но в цитозоле появляется 2 % от полной активности гидролаз. Если субстрат не доставлен, лизосома не нагружена, а субстрат копится в цитозоле — 50 у.е. за интервал. Баланс каждого интервала: запас в просвете + поступило = расщеплено + запас в конце.","<b>Ограничения.<\/b> В клетке при крупном повреждении мембраны протоны уходят, и pH просвета растёт; в модели pH задаётся отдельно, чтобы два условия можно было сравнить. Шкала активности — допущение; у разных гидролаз она разная."],"conditions":"Учебная модель · условные единицы; шкала активности и ёмкость — допущения, а не измеренные величины.","sources":["src_01"],"base":"БИО-5·12, БИО-5·14","level":"adv","next_base":"peroxisome-reactions","quiz":{"id":"S5-L15","question":"Субстрат копится в лизосомах двух клеток одинаково. Какое наблюдение различит незакисленную лизосому и повреждённую мембрану?","options":[{"id":"S5-L15-1","text":"Количество субстрата в лизосоме","correct":false,"feedback":"Оно в двух случаях сопоставимо и их не различает"},{"id":"S5-L15-2","text":"Есть ли субстрат в цитозоле","correct":false,"feedback":"Субстрат доставлен в обоих случаях; в цитозоле он копится при нарушении доставки"},{"id":"S5-L15-3","text":"Есть ли гидролазы в цитозоле","correct":true,"feedback":"При повреждении мембраны часть гидролаз выходит в цитозоль, при недостатке закисления — нет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Незакисленная лизосома и повреждённая мембрана","status":"Учебная модель · условные единицы","modes_label":"Условия","modes":["pH 6,5, мембрана не повреждена","pH 4,6, вышло 50 %","pH 4,6, вышло 10 %","нет доставки"],"args":[{"pH":6.5,"d":0,"del":true},{"pH":4.6,"d":0.5,"del":true},{"pH":4.6,"d":0.1,"del":true},{"pH":4.6,"d":0,"del":false}],"notes":["запас 104 у.е., гидролаз в цитозоле нет","запас 80 у.е., в цитозоле 10 % от полной активности гидролаз","запас 0, в цитозоле 2 % от полной активности","в цитозоле 200 у.е. субстрата"],"static":["Учебная модель A2 (интервал 4): pH 6,5 при целой мембране — запас 104 у.е.; pH 4,6, вышло 50 % — запас 80 у.е. и 10 % активности в цитозоле; вышло 10 % — запас 0 и 2 %; без доставки — 200 у.е. субстрата в цитозоле."],"scene":"s5_a2","L":{"s5_a1_head":"Интервал {k}","s5_a2_act":"pH {pH}: активность {a} %, возможность {c} у.е. за интервал","s5_a2_bal":"Баланс: {a} + {b} = {c} + {d}","s5_a2_cact":"в цитозоле: гидролаз {p} %, активность {a} % от полной","s5_a2_cs":"субстрат в цитозоле","s5_a2_damage":"мембрана повреждена","s5_a2_dig":"расщеплено","s5_a2_lumen":"просвет лизосомы","s5_a2_q":"запас в просвете","s5_l_cytosol":"цитозоль"}}},"adv_kind":"Исследование модели"},{"id":"neutral-cathepsin","num":16,"section":1,"questions":[2],"title":"Действительно ли гидролазы неактивны при нейтральном pH?","keywords":["Катепсины"],"lead":["Сверх программы. Защита клетки от гидролаз объясняется и тем, что при нейтральном pH они менее активны. Насколько менее — зависит от фермента и от субстрата."],"mechanism":["Работу очищенной лизосомной протеазы [[T42|катепсина B]] сравнили при pH 4,6 (как в лизосоме) и 7,2 (как в цитозоле) на сотнях разных коротких пептидов. Фермент расщеплял пептиды при обоих значениях pH; при 7,2 он расщеплял меньше разных связей (109 против 179), а предпочтения к аминокислотам рядом с местом разреза при двух значениях pH различались. Для стандартного субстрата удельная активность при pH 7,2 составила около половины активности при pH 4,6 (наибольшей она была при pH 5,5)."],"paragraphs":["Катепсин B обнаруживают и вне лизосом — в цитозоле, в ядре, во внеклеточной среде, — особенно при ряде заболеваний; там он может расщеплять другие белки, чем в лизосоме.","<b>Что уточняет эта работа?<\/b> Слова «гидролазы неактивны в цитозоле» — упрощение: многие гидролазы при нейтральном pH теряют большую часть активности, но не все. Поэтому мембрана — самостоятельное и необходимое условие защиты, а не дублирование кислотности.","<b>Ограничения.<\/b> Измерения выполнены с очищенным ферментом на коротких пептидах при комнатной температуре; это не измерения внутри клетки."],"conditions":"Схема по данным работы, упрощённая: относительные величины, а не исходные графики.","sources":["src_04"],"base":"БИО-5·12","level":"adv","next_base":"peroxisome-reactions","quiz":{"id":"S5-L16","question":"Что следует из того, что катепсин B расщепляет пептиды и при pH 7,2?","options":[{"id":"S5-L16-1","text":"Мембрана лизосомы необходима и сама по себе","correct":true,"feedback":"Одной кислотности недостаточно, чтобы вышедший фермент был безопасен"},{"id":"S5-L16-2","text":"Лизосоме не нужна кислая среда","correct":false,"feedback":"Кислая среда нужна: многие гидролазы при нейтральном pH работают значительно хуже"},{"id":"S5-L16-3","text":"Катепсин B работает только вне лизосом","correct":false,"feedback":"Он работает и при лизосомном pH; различаются предпочтения к субстратам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Работает ли катепсин B при нейтральном pH?","status":"Схема по данным работы, упрощённая","modes_label":"pH","modes":["4,6","7,2","сравнение"],"args":[{"pH":4.6},{"pH":7.2},{"pH":"both"}],"notes":["pH 4,6: 179 расщеплённых связей; активность для стандартного субстрата — 100 %","pH 7,2: 109 расщеплённых связей; активность ≈ половина","Катепсин B активен при обоих pH, при нейтральном — слабее и с другим выбором мест разреза"],"static":["Катепсин B: при pH 4,6 — 179 расщеплённых связей, при pH 7,2 — 109; активность для стандартного субстрата при pH 7,2 — около половины."],"scene":"s5_r_cathepsin","L":{"s5_ct_legend":"голубые столбцы — число расщеплённых связей; зелёные — активность для стандартного субстрата относительно pH 4,6","s5_ct_note":"катепсин B, очищенный от других белков"}}},"adv_kind":"Новые данные"},{"id":"peroxisome-reactions","num":17,"section":2,"questions":[3],"title":"Какие реакции идут в пероксисоме?","keywords":["Пероксисома","Оксидаза","Перекись водорода (H₂O₂)","Каталаза","β-Окисление жирных кислот","Жирные кислоты с очень длинной цепью"],"lead":["[[T44|Пероксисома]] — небольшая органелла, окружённая одной мембраной. Пероксисомы есть почти во всех клетках эукариот; особенно много их в клетках печени и почек."],"mechanism":["Ферменты пероксисомы — [[T45|оксидазы]] — отнимают атомы водорода у органических веществ и передают их на молекулярный кислород; продукт реакции — [[T46|перекись водорода (H₂O₂)]]: RH₂ + O₂ → R + H₂O₂ (R — органическое вещество). В той же пероксисоме находится [[T47|каталаза]]. Она использует H₂O₂ двумя способами: окисляет ею другие вещества — муравьиную кислоту, формальдегид, этанол (H₂O₂ + R′H₂ → R′ + 2H₂O), а избыток H₂O₂ разлагает на воду и кислород (2H₂O₂ → 2H₂O + O₂). Так опасный продукт образуется и расходуется в одном компартменте."],"paragraphs":["Главная окислительная задача пероксисом — [[T48|β-окисление жирных кислот]]: цепь укорачивается по два атома углерода, и образуются ацетил-CoA и укороченные ацил-CoA. Свободно через мембрану пероксисомы ацетил-CoA не проходит: ацильные группы выводятся, в частности, в составе ацетилкарнитина и ацилкарнитинов или после гидролиза — в виде соответствующих кислот. У млекопитающих β-окисление идёт и в митохондриях, и в пероксисомах; [[T49|жирные кислоты с очень длинной цепью]] разрушаются в пероксисомах. Пероксисомы печени и почек обезвреживают вещества, попавшие в кровь; каталаза, например, может окислять этанол до ацетальдегида, используя H₂O₂. Основной путь окисления этанола в печени человека — алкогольдегидрогеназа; вклад каталазы обычно невелик и зависит от условий. Пероксисомы животных начинают синтез [[T50|плазмалогенов]] — фосфолипидов, особенно многочисленных в миелиновой оболочке нервных волокон. Набор ферментов пероксисом различен в разных клетках и меняется при изменении условий.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.1.","<b>Ограничения.<\/b> На схеме показана одна оксидаза; в пероксисоме их несколько, с разными субстратами."],"conditions":"Схема качественная: уравнения реакций — по учебнику; размеры не в масштабе.","sources":["src_01"],"base":"БИО-5·1","quiz":{"id":"S5-L17","question":"Во что превращается молекула O₂, когда оксидаза пероксисомы отнимает водород у жирной кислоты?","options":[{"id":"S5-L17-1","text":"В воду, как в дыхательной цепи","correct":false,"feedback":"До воды кислород восстанавливает дыхательная цепь митохондрии; оксидаза пероксисомы образует H₂O₂"},{"id":"S5-L17-2","text":"В перекись водорода H₂O₂","correct":true,"feedback":"Два атома водорода переходят на O₂; H₂O₂ затем расходует каталаза"},{"id":"S5-L17-3","text":"В углекислый газ","correct":false,"feedback":"Углекислый газ образуется в других реакциях; оксидаза переносит на кислород водород"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие реакции идут в пероксисоме?","status":"Схема качественная · уравнения — по учебнику","modes_label":"Реакция","modes":["оксидаза","каталаза: разложение","каталаза: окисление"],"args":[{"rx":"oxidase"},{"rx":"cat_decomp"},{"rx":"cat_perox"}],"notes":["RH₂ + O₂ → R + H₂O₂","2H₂O₂ → 2H₂O + O₂","H₂O₂ + R′H₂ → R′ + 2H₂O"],"static":["Реакции пероксисомы: RH₂ + O₂ → R + H₂O₂; 2H₂O₂ → 2H₂O + O₂; H₂O₂ + R′H₂ → R′ + 2H₂O."],"scene":"s5_t3a","L":{"s5_eq_cat":"2H₂O₂ → 2H₂O + O₂","s5_eq_ox":"RH₂ + O₂ → R + H₂O₂","s5_eq_perox":"H₂O₂ + R′H₂ → R′ + 2H₂O","s5_l_catalase":"каталаза","s5_l_cytosol":"цитозоль","s5_l_oxidase":"оксидаза","s5_l_peroxisome":"пероксисома","s5_t3a_examples":"Примеры веществ, окисляемых каталазой: этанол, формальдегид, муравьиная кислота"}}}},{"id":"peroxisome-import","num":18,"section":2,"questions":[3],"title":"Как белки попадают в пероксисому?","keywords":["Сигнал Ser-Lys-Leu","Pex5","Пероксины","Синдром Цельвегера"],"lead":["Своей ДНК и рибосом у пероксисомы нет. Белки её просвета синтезируются на свободных рибосомах в цитозоле и приходят в уже готовую пероксисому."],"mechanism":["У многих белков просвета пероксисомы на C-конце есть [[T52|сигнал из трёх аминокислот Ser-Lys-Leu]]. В цитозоле его узнаёт белок-рецептор [[T53|Pex5]]; вместе с грузом он входит в белковый транслокатор пероксисомной мембраны, отдаёт груз в просвет и возвращается в цитозоль. Для возврата Pex5 получает убиквитин, и комплекс АТФаз из Pex1 и Pex6 с затратой АТФ вытягивает его из мембраны. Другие белки несут сигнал вблизи N-конца; его узнаёт Pex7. Белки, участвующие в импорте и образовании пероксисом, называют [[T51|пероксинами]]. В отличие от транслокатора ЭПР, транслокатор пероксисомы переносит свёрнутые и даже собранные из нескольких цепей белки."],"paragraphs":["Сигнал Ser-Lys-Leu достаточен: если присоединить его к C-концу белка цитозоля, этот белок окажется в пероксисоме. Необходимость импорта видна при [[T57|синдроме Цельвегера]]: из-за мутации одного из пероксинов (чаще Pex1) белки просвета остаются в цитозоле, пероксисомы «пусты», жирные кислоты с очень длинной и разветвлённой цепью не разрушаются, а плазмалогенов не хватает; страдают мозг, печень и почки (клинический пример — иллюстрация механизма).","<b>На практикуме.<\/b> Вкладка 3, шаги 3.2–3.4.","<b>Ограничения.<\/b> Число и названия пероксинов транслокатора на схеме не приводятся."],"conditions":"Схема качественная: цикл рецептора Pex5 по стадиям; порядок стадий — учебное деление.","sources":["src_01"],"base":"вспомнить [[seminar-4-route.html#er-signal|семинар 4: «Что делает участок цепи сигналом для ЭПР?»]]","quiz":{"id":"S5-L18","question":"Белок просвета пероксисомы уже свёрнут и собран из нескольких цепей. Должен ли он развернуться, чтобы войти в пероксисому?","options":[{"id":"S5-L18-1","text":"Да: через мембрану проходит только развёрнутая цепь","correct":false,"feedback":"Так переносят белки транслоконы ЭПР; транслокатор пероксисомы устроен иначе"},{"id":"S5-L18-2","text":"Нет: он синтезируется прямо в пероксисоме","correct":false,"feedback":"Рибосом в пероксисоме нет; белки просвета синтезируются в цитозоле и импортируются"},{"id":"S5-L18-3","text":"Нет: транслокатор переносит свёрнутые белки","correct":true,"feedback":"В этом отличие пероксисомы от ЭПР, куда цепь входит развёрнутой во время синтеза"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как белок с сигналом Ser-Lys-Leu входит в пероксисому?","status":"Схема качественная · стадии — учебное деление","modes_label":"Этап","modes":["1 Pex5","2 транслокатор","3 груз внутри","4 возврат Pex5"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Pex5 связывает в цитозоле белок с сигналом Ser-Lys-Leu на C-конце","Pex5 с грузом входит в транслокатор пероксисомной мембраны","Свёрнутый груз освобождается в просвете пероксисомы","Pex5 получает убиквитин, и комплекс Pex1 и Pex6 с затратой АТФ возвращает его в цитозоль"],"static":["Импорт: Pex5 связывает белок с Ser-Lys-Leu в цитозоле, входит в транслокатор, груз освобождается свёрнутым, Pex5 с убиквитином возвращается комплексом Pex1 и Pex6."],"scene":"s5_t3b","L":{"s5_l_atp":"АТФ","s5_l_cytosol":"цитозоль","s5_l_pex5":"Pex5","s5_l_translocator":"транслокатор","s5_t3b_cargo":"свёрнутый белок с Ser-Lys-Leu","s5_t3b_folded":"груз внутри — свёрнутым","s5_t3b_lumen":"просвет пероксисомы","s5_t3b_pex16":"комплекс Pex1 и Pex6"}}},"exam_quiz":{"id":"S5-E09","question":"Чем пероксисома отличается от лизосомы по способу получения белков просвета?","options":[{"id":"S5-E09-1","text":"Синтезирует их на своих рибосомах","correct":false,"feedback":"Рибосом в пероксисоме нет"},{"id":"S5-E09-2","text":"Получает их только из ЭПР","correct":false,"feedback":"Белки просвета пероксисомы приходят из цитозоля"},{"id":"S5-E09-3","text":"Импортирует их из цитозоля","correct":true,"feedback":"Гидролазы лизосомы приходят из ЭПР через аппарат Гольджи"}]}},{"id":"peroxisome-biogenesis","num":19,"section":2,"questions":[3],"title":"Как образуются новые пероксисомы?","keywords":["Pex3","Pex19","Пузырёк-предшественник пероксисомы"],"lead":["Число пероксисом в клетке меняется: при некоторых условиях их становится много больше. Новые пероксисомы образуются двумя путями."],"mechanism":["Первый путь — рост и деление существующих пероксисом: в них импортируются белки и липиды, затем пероксисома делится на дочерние. Второй путь — сборка из пузырьков-предшественников; на схеме показан его вариант, который начинается в ЭПР. Некоторые мембранные белки пероксисомы — например, [[T54|Pex3]] — встраиваются в мембрану ЭПР транслоконом Sec61 и с участием белка [[T55|Pex19]] собираются в [[T56|пузырьки-предшественники]], отпочковывающиеся от ЭПР. Пузырьки-предшественники сливаются друг с другом, образуя новую пероксисому, или с существующей пероксисомой; затем в неё импортируются белки просвета (БИО-5·18)."],"paragraphs":["Поэтому пероксисома не возникает «из ничего»: её мембрана происходит от уже существующих мембран — другой пероксисомы или ЭПР; в клетках млекопитающих описаны и предшественники, отпочковывающиеся от митохондрий (на схеме не показаны). Связь с ЭПР объясняет, почему пероксисомы получают из него часть липидов.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.5.","<b>Ограничения.<\/b> Какая доля пероксисом в клетке образуется каждым из двух путей, на странице не обсуждается; механизм отпочковывания пузырьков-предшественников изучен не полностью."],"conditions":"Схема качественная, две панели: А — рост и деление, Б — пузырьки-предшественники из ЭПР.","sources":["src_01"],"base":"БИО-5·18","quiz":{"id":"S5-L19","question":"В показанном на схеме пути — от какого компартмента отпочковываются пузырьки-предшественники пероксисом?","options":[{"id":"S5-L19-1","text":"Отпочковывается от ЭПР","correct":true,"feedback":"Мембранные белки пероксисомы встраиваются в ЭПР и выходят из него в пузырьках"},{"id":"S5-L19-2","text":"Синтезируется заново внутри пероксисомы","correct":false,"feedback":"Мембрана растёт из уже существующей мембраны; в показанном пути — из мембраны ЭПР"},{"id":"S5-L19-3","text":"Отделяется от митохондрии","correct":false,"feedback":"Не в показанном пути: здесь предшественники отпочковываются от ЭПР; в клетках млекопитающих описаны и митохондриальные предшественники пероксисом"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как образуются новые пероксисомы?","status":"Схема качественная","modes_label":"Путь","modes":["А деление","Б пузырёк из ЭПР","Б′ слияние"],"args":[{"route":"fission"},{"route":"er_bud"},{"route":"fusion"}],"notes":["Пероксисома растёт и делится на дочерние","Pex3 встраивается в ЭПР; с Pex19 мембранные белки пероксисомы выходят в пузырьке-предшественнике","Пузырьки-предшественники сливаются друг с другом или с пероксисомой"],"static":["Новые пероксисомы: деление существующих; пузырьки-предшественники из ЭПР (Pex3, Pex19) сливаются друг с другом или с пероксисомой."],"scene":"s5_r_perbio","L":{"s5_l_cytosol":"цитозоль","s5_l_er_lumen":"просвет ЭПР","s5_l_peroxisome":"пероксисома","s5_pb_A":"А. Рост и деление","s5_pb_B":"Б. Пузырёк из ЭПР","s5_pb_B2":"Б′. Слияние пузырьков","s5_pb_daughters":"дочерние пероксисомы","s5_pb_grow":"растёт","s5_pb_new":"новая пероксисома","s5_pb_pex3":"Pex3 в мембране, Pex19","s5_pb_sec61":"Sec61","s5_pb_two":"два пузырька-предшественника","s5_pb_vesicle":"пузырёк-предшественник"}}},"exam_quiz":{"id":"S5-E06","question":"Какие два пути образования новых пероксисом разобраны в этом шаге?","options":[{"id":"S5-E06-1","text":"Почкование от митохондрий и от лизосом","correct":false,"feedback":"Лизосомы пероксисом не образуют; митохондриальные предшественники описаны, но в этом шаге разобраны деление и путь через ЭПР"},{"id":"S5-E06-2","text":"Синтез внутри ядра","correct":false,"feedback":"Пероксисомы образуются в цитоплазме"},{"id":"S5-E06-3","text":"Деление существующих и пузырьки из ЭПР","correct":true,"feedback":"Пузырьки-предшественники сливаются друг с другом или с пероксисомой"}]}},{"id":"peroxisome-partners","num":20,"section":2,"questions":[3],"title":"С какими органеллами взаимодействует пероксисома?","keywords":["Мембранный контакт","Лизосома","Селективная аутофагия"],"lead":["Пероксисома выполняет свою работу не в одиночку: её продукты и субстраты переходят в другие компартменты."],"mechanism":["С ЭПР пероксисому связывает происхождение части мембранных белков и липидов (БИО-5·19); вообще липиды переходят между органеллами и через [[T58|мембранные контакты]] — участки, где мембраны двух органелл удерживаются на расстоянии 10–30 нм, но не сливаются. С митохондриями пероксисому связывает β-окисление: обе органеллы окисляют жирные кислоты, а продукты пероксисомного β-окисления — ацетильные и укороченные ацильные группы — выводятся из пероксисомы в составе ацетилкарнитина и ацилкарнитинов или в виде свободных кислот и используются в синтезе или окисляются в митохондриях. Повреждённые или лишние пероксисомы разрушаются в [[T12|лизосомах]] после [[T23|селективной аутофагии]] (на электронных фотографиях в одной аутофагосоме бывают видны митохондрия и пероксисома)."],"paragraphs":["H₂O₂ — небольшая незаряженная молекула, она может выходить из пероксисомы в цитозоль (БИО-5·22). Поэтому разделение «пероксисома — опасная химия, цитозоль — безопасно» верно только как соотношение скоростей образования и удаления H₂O₂, а не как полная изоляция.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.6.","<b>Ограничения.<\/b> Белки, удерживающие мембраны в контакте, на странице не называются."],"conditions":"Схема качественная: пероксисома в окружении ЭПР, митохондрии и лизосомы; стрелки — направления потоков.","sources":["src_01"],"base":"БИО-5·17, БИО-5·19","quiz":{"id":"S5-L20","question":"Что общего у пероксисомы и митохондрии клетки печени?","options":[{"id":"S5-L20-1","text":"Обе получают белки только из ЭПР","correct":false,"feedback":"Большинство белков обеих органелл приходит из цитозоля"},{"id":"S5-L20-2","text":"Обе окисляют жирные кислоты","correct":true,"feedback":"Β-окисление идёт в обеих органеллах; жирные кислоты с очень длинной цепью окисляются в пероксисоме"},{"id":"S5-L20-3","text":"Обе синтезируют АТФ на своей мембране","correct":false,"feedback":"АТФ-синтаза есть во внутренней мембране митохондрии, но не в пероксисоме"}]},"widget":{"kind":"dna","title":"","s":{"title":"С кем взаимодействует пероксисома?","status":"Схема качественная","modes_label":"Партнёр","modes":["ЭПР","митохондрия","цитозоль","лизосома"],"args":[{"partner":1},{"partner":2},{"partner":3},{"partner":4}],"notes":["ЭПР — источник мембраны; мембраны удерживаются мембранным контактом","Митохондрия тоже ведёт β-окисление","Ацетильные группы выходят в цитозоль в составе ацетилкарнитина или ацетата, а не как свободный ацетил-CoA","Лишние пероксисомы удаляет аутофагия в лизосоме"],"static":["Партнёры пероксисомы: ЭПР (мембрана, контакт), митохондрия (β-окисление), цитозоль (ацетильные группы), лизосома (удаление)."],"scene":"s5_r_partners","L":{"s5_l_cytosol":"цитозоль","s5_l_er":"ЭПР","s5_l_lysosome":"лизосома","s5_l_mito":"митохондрия","s5_l_peroxisome":"пероксисома","s5_pt_acoa":"ацетилкарнитин → в цитозоль","s5_pt_beta":"β-окисление","s5_pt_contact":"мембранный контакт (10–30 нм)","s5_pt_remove":"удаление лишних (аутофагия)"}}}},{"id":"h2o2-balance","num":21,"section":2,"questions":[3],"title":"Образование и накопление H₂O₂ — не одно и то же","keywords":[],"lead":["Сверх программы. Учебная потоковая модель: за интервал в пероксисоме образуется P у.е. H₂O₂; каталаза может разложить за интервал до K у.е.; половина неразложенной H₂O₂ выходит за интервал в цитозоль, где другие ферменты удаляют до 20 у.е. за интервал (все величины — допущения)."],"mechanism":["При P = 40 и K = 80 вся H₂O₂ разлагается сразу, ничего не копится и не выходит. Если увеличить образование до P = 100 при K = 80, каталаза разлагает 80 у.е., оставшиеся 20 у.е. за интервал копятся в пероксисоме и частично выходят в цитозоль: к четвёртому интервалу в пероксисоме 18,75 у.е., и столько же выходит в цитозоль за интервал. Если оставить P = 40, а работу каталазы снизить до K = 20, все показатели будут теми же: избыток в обоих случаях 20 у.е. за интервал. Накопление определяется разностью скоростей образования и удаления, а не каждой из них отдельно."],"paragraphs":["Различает две причины только измерение одной из скоростей: работа каталазы — 80 у.е. в первом случае и 20 у.е. во втором. Тот же результат даёт и любое другое сочетание с избытком 20 у.е. за интервал, например P = 60 и K = 40. Если же избыток больше, чем успевают удалить ферменты цитозоля (20 у.е. за интервал), H₂O₂ начинает копиться и в цитозоле. Баланс: запасы в начале + образовано = разложено каталазой + удалено в цитозоле + запасы в конце.","<b>Ограничения.<\/b> В клетке каталаза не имеет постоянного предела, как в модели: скорость её работы растёт с количеством H₂O₂; предел — упрощение модели. Каталаза — не единственный фермент, удаляющий H₂O₂; часть H₂O₂ используется в передаче сигналов (БИО-5·22). Доля выхода, ёмкости и скорости — допущения, концентрации не показаны."],"conditions":"Учебная модель · условные единицы; ёмкости и доля выхода — допущения, а не измеренные величины.","sources":["src_05"],"base":"БИО-5·17","level":"adv","next_base":"mito-compartments","quiz":{"id":"S5-L21","question":"В двух клетках H₂O₂ выходит из пероксисом с одинаковой скоростью. Какое измерение покажет причину?","options":[{"id":"S5-L21-1","text":"Количество H₂O₂ в пероксисоме","correct":false,"feedback":"Оно в двух случаях одинаково и причины не различает"},{"id":"S5-L21-2","text":"Число пероксисом в клетке","correct":false,"feedback":"В модели число пероксисом одинаково; различаются скорости"},{"id":"S5-L21-3","text":"Работа каталазы в пероксисомах","correct":true,"feedback":"Одинаковый избыток даёт и усиленное образование, и ослабленное удаление"}]},"widget":{"kind":"dna","title":"","s":{"title":"Образование и накопление H₂O₂","status":"Учебная модель · условные единицы","modes_label":"Условия","modes":["норма","образование 100","каталаза 20","P = 60, K = 40"],"args":[{"P":40,"K":80},{"P":100,"K":80},{"P":40,"K":20},{"P":60,"K":40}],"notes":["ничего не копится","в пероксисоме 18,75, выход 18,75","то же: 18,75 и 18,75","то же: любой избыток 20 у.е. за интервал"],"static":["Учебная модель A3 (интервал 4): норма — ничего не копится; образование 100 при каталазе 80, образование 40 при каталазе 20 и P = 60 при K = 40 дают одинаковые запас и выход — 18,75 у.е."],"scene":"s5_a3","L":{"s5_a1_head":"Интервал {k}","s5_a3_bal":"Баланс: {a} + {b} = {c} + {d} + {e}","s5_a3_cat":"разложено каталазой {v}","s5_a3_made":"образовано {v}","s5_a3_out":"вышло в цитозоль {v}","s5_a3_pc":"запас в цитозоле","s5_a3_pp":"запас в пероксисоме","s5_a3_rem":"удалено в цитозоле {v}","s5_l_catalase":"каталаза","s5_l_cytosol":"цитозоль","s5_l_oxidase":"оксидаза","s5_l_peroxisome":"пероксисома"}}},"adv_kind":"Новые данные"},{"id":"h2o2-reach","num":22,"section":2,"questions":[3],"title":"Остаётся ли перекись водорода пероксисомы внутри неё?","keywords":[],"lead":["Сверх программы. H₂O₂ не только опасна: в малых количествах она служит сигнальной молекулой, окисляя определённые остатки цистеина в белках и меняя их работу."],"mechanism":["В клетках человека в культуре образование H₂O₂ в пероксисомах искусственно усилили: туда направили фермент, образующий H₂O₂ только в присутствии определённой аминокислоты в среде; каталазу в большинстве экспериментов подавляли. В этих условиях перекись, образованная в пероксисомах, окисляла остатки цистеина в белках пероксисом, цитозоля и митохондрий — больше 400 разных белков, в том числе пероксиредоксины, белки цитоскелета, шапероны, ферменты гликолиза и белки митохондрий. Подавление каталазы усиливало эффект: каталаза ограничивает выход H₂O₂, особенно когда её образуется много."],"paragraphs":["<b>Что уточняет эта работа?<\/b> Пероксисома — не замкнутый «ящик для опасной химии», а источник H₂O₂, который влияет на белки цитозоля и митохондрий. Поэтому утверждение о полной изоляции опасного продукта неверно: изоляция частичная и зависит от соотношения образования и удаления (БИО-5·21).","<b>Ограничения.<\/b> Эксперименты выполнены на культуре клеток при повышенном содержании кислорода, обычно в присутствии ингибитора каталазы, при искусственно усиленном образовании H₂O₂ и по одной биологической повторности на условие; концентрацию H₂O₂ в цитозоле авторы оценивают косвенно. Что окисление каждого белка меняет в его работе, в работе не проверялось."],"conditions":"Схема по данным работы, упрощённая: компартменты и число найденных белков — качественно.","sources":["src_05"],"base":"БИО-5·20, БИО-5·21","level":"adv","next_base":"mito-compartments","quiz":{"id":"S5-L22","question":"Что показывает окисление белков митохондрий перекисью, образованной в пероксисомах?","options":[{"id":"S5-L22-1","text":"H₂O₂ выходит за пределы пероксисомы","correct":true,"feedback":"Часть её доходит до цитозоля и митохондрий"},{"id":"S5-L22-2","text":"Пероксисомы и митохондрии — один компартмент","correct":false,"feedback":"Это разные органеллы; H₂O₂ переходит между ними через цитозоль"},{"id":"S5-L22-3","text":"Каталаза находится в митохондриях","correct":false,"feedback":"Каталаза — фермент пероксисом; её подавление усиливало выход H₂O₂"}]},"widget":{"kind":"dna","title":"","s":{"title":"Доходит ли H₂O₂ пероксисом до других компартментов?","status":"Схема по данным работы, упрощённая: показаны условия эксперимента","modes_label":"Компартмент","modes":["пероксисома","цитозоль","митохондрия","условия эксперимента"],"args":[{"view":1},{"view":2},{"view":3},{"view":4}],"notes":["окислены белки пероксисомы","окислены белки цитозоля (больше всего найденных)","окислены белки митохондрий","образование H₂O₂ искусственно усилено, каталаза подавлена; без ингибитора эффект слабее"],"static":["В условиях работы H₂O₂ пероксисом окисляла белки пероксисом, цитозоля и митохондрий; образование H₂O₂ было искусственно усилено, каталаза подавлена."],"scene":"s5_r_h2o2reach","L":{"s5_hr_cond":"образование H₂O₂ искусственно усилено, каталаза подавлена","s5_hr_legend":"красный кружок — белок с окисленным цистеином","s5_l_cytosol":"цитозоль","s5_l_mito":"митохондрия","s5_l_peroxisome":"пероксисома"}}},"adv_kind":"Новые данные"},{"id":"mito-compartments","num":23,"section":3,"questions":[4],"title":"Из каких компартментов состоит митохондрия?","keywords":["Митохондрия","Наружная мембрана митохондрии","Внутренняя мембрана митохондрии","Межмембранное пространство","Матрикс митохондрии","Порин"],"lead":["[[T59|Митохондрия]] окружена двумя мембранами — [[T60|наружной]] и [[T63|внутренней]]. Они ограничивают два водных компартмента: [[T62|межмембранное пространство]] и [[T65|матрикс]]. Митохондрия производит большую часть АТФ клетки."],"mechanism":["Наружная мембрана содержит много белков-каналов [[T61|поринов]] и свободно пропускает ионы и молекулы массой до 5000 дальтон; поэтому по составу малых молекул межмембранное пространство похоже на цитозоль. Межмембранное пространство — узкий промежуток шириной 20–30 нм. Внутренняя мембрана образует складки — [[T64|кристы]], в мембране которых находятся белки [[T66|дыхательной цепи]] и [[T71|АТФ-синтаза]]; эта мембрана почти непроницаема для ионов и пропускает вещества только через специальные белки-переносчики. Матрикс содержит ферменты цикла лимонной кислоты и β-окисления жирных кислот, митохондриальную ДНК и рибосомы."],"paragraphs":["Непроницаемость внутренней мембраны — условие работы митохондрии: только поэтому перекачанные протоны не возвращаются в матрикс сами и градиент сохраняется (БИО-5·24). Большинство белков митохондрии кодируется ядерной ДНК и импортируется из цитозоля (БИО-5·27). Митохондриальная ДНК человека кодирует лишь 13 белков и 24 РНК, нужные для синтеза белка в самой митохондрии; от поколения к поколению она передаётся по материнской линии. Митохондрии, как и ЭПР, служат внутриклеточным депо Ca²⁺. Митохондрий больше там, где много АТФ расходуется: в сердечной мышце, вокруг жгутика сперматозоида.","<b>На практикуме.<\/b> Вкладка 4, вступление и шаг 4.1.","<b>Ограничения.<\/b> Кристы на схеме показаны складками; на трёхмерных реконструкциях это диски и трубочки, соединённые с остальной внутренней мембраной узкими участками."],"conditions":"Схема по строению органеллы, упрощённая: мембраны — бислой, размеры не в масштабе.","sources":["src_01"],"base":"вспомнить [[seminar-1-route.html#bio-1-11|семинар 1: «Электрохимический градиент: два вклада в движение иона»]]","quiz":{"id":"S5-L23","question":"Почему межмембранное пространство по составу малых молекул похоже на цитозоль, а матрикс — нет?","options":[{"id":"S5-L23-1","text":"Межмембранное пространство соединено с цитозолем отверстием","correct":false,"feedback":"Межмембранное пространство отделено от цитозоля наружной мембраной"},{"id":"S5-L23-2","text":"Наружная мембрана пропускает малые молекулы, внутренняя — нет","correct":true,"feedback":"Порины наружной мембраны пропускают молекулы до 5000 Да; внутренняя мембрана почти непроницаема для ионов"},{"id":"S5-L23-3","text":"Матрикс сообщается с цитозолем через кристы","correct":false,"feedback":"Кристы — складки внутренней мембраны; они не открываются в цитозоль"}]},"widget":{"kind":"dna","title":"","s":{"title":"Из каких частей состоит митохондрия?","status":"Схема по строению органеллы, упрощённая","modes_label":"Часть органеллы","modes":["наружная мембрана","межмембранное пространство","внутренняя мембрана","матрикс"],"args":[{"hl":1},{"hl":2},{"hl":3},{"hl":4}],"notes":["Наружная мембрана: порины пропускают малые молекулы","Межмембранное пространство: узкий промежуток между мембранами","Внутренняя мембрана образует кристы; в ней дыхательная цепь и АТФ-синтаза","Матрикс: ДНК, рибосомы митохондрии и ферменты"],"static":["Митохондрия: наружная мембрана с поринами, межмембранное пространство, внутренняя мембрана с кристами, матрикс."],"scene":"s5_t4a","L":{"s5_l_cytosol":"цитозоль","s5_t4a_crista":"внутренняя мембрана, кристы","s5_t4a_etc":"дыхательная цепь и АТФ-синтаза — во внутренней мембране","s5_t4a_ims":"межмембранное пространство (20–30 нм)","s5_t4a_matrix":"матрикс: ДНК, рибосомы, ферменты","s5_t4a_om":"наружная мембрана с поринами","s5_t4a_porin":"порин: проходят молекулы до 5000 Да"}},"zoomNarrow":true},"exam_quiz":{"id":"S5-E07","question":"Где находится митохондриальная ДНК?","options":[{"id":"S5-E07-1","text":"В матриксе","correct":true,"feedback":"Вместе с рибосомами митохондрии"},{"id":"S5-E07-2","text":"В межмембранном пространстве","correct":false,"feedback":"Межмембранное пространство похоже на цитозоль по составу малых молекул; ДНК там нет"},{"id":"S5-E07-3","text":"В наружной мембране","correct":false,"feedback":"В мембранах ДНК не находится"}]}},{"id":"etc-gradient","num":24,"section":3,"questions":[4],"title":"Как дыхательная цепь создаёт протонный градиент?","keywords":["NADH","Дыхательная цепь","Электрохимический градиент протонов","Мембранный потенциал митохондрии","Протонодвижущая сила"],"lead":["В матриксе при окислении питательных веществ образуется [[T67|NADH]] — переносчик электронов. Электроны от NADH передаются по [[T66|дыхательной цепи]] — набору белковых комплексов внутренней мембраны — на кислород, который восстанавливается до воды."],"mechanism":["Переход электронов по цепи энергетически выгоден, и три комплекса цепи используют эту энергию, чтобы перекачивать протоны из матрикса в межмембранное пространство (в пространство крист). Так создаётся [[T68|электрохимический градиент протонов]] из двух вкладов: разности pH (в матриксе около 7,9, снаружи — около 7,4) и [[T69|мембранного потенциала]] (матрикс заряжен отрицательно). В дышащей митохондрии градиент составляет около 180 мВ, из них около 150 мВ приходится на мембранный потенциал, а разность pH — 0,5–0,6 единицы — добавляет остальное (одна единица pH эквивалентна примерно 60 мВ). Градиент создаёт [[T70|протонодвижущую силу]], направленную на возврат протонов в матрикс."],"paragraphs":["Энергия градиента определяется не числом протонов снаружи, а суммой двух вкладов: главный вклад — мембранный потенциал, а разность концентраций протонов невелика. Поэтому «больше протонов в межмембранном пространстве» — неточное описание запаса энергии. Протоны в водной среде и по цепочкам полярных групп белков движутся очень быстро.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.1–4.2.","<b>Ограничения.<\/b> Названия и состав комплексов дыхательной цепи на базовом уровне не требуются (курс «Молекулярная биология»)."],"conditions":"Схема качественная: стрелки протонов — направление, а не число частиц; значения градиента — по учебнику.","sources":["src_01"],"base":"БИО-5·23; вспомнить [[seminar-1-route.html#bio-1-12|семинар 1: «Мембранный потенциал: что это и откуда он берётся»]]","quiz":{"id":"S5-L24","question":"Куда перекачивают протоны комплексы дыхательной цепи?","options":[{"id":"S5-L24-1","text":"Из межмембранного пространства в матрикс","correct":false,"feedback":"В матрикс протоны возвращаются через АТФ-синтазу или путём утечки"},{"id":"S5-L24-2","text":"Из цитозоля в межмембранное пространство","correct":false,"feedback":"Перекачка идёт через внутреннюю мембрану, а не через наружную"},{"id":"S5-L24-3","text":"Из матрикса в межмембранное пространство","correct":true,"feedback":"Матрикс становится более щелочным и заряжается отрицательно"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как цепь создаёт градиент?","status":"Схема качественная · значения — по учебнику","modes_label":"Показать","modes":["электроны","протоны","два вклада"],"args":[{"show":"e"},{"show":"h"},{"show":"dV_dpH"}],"notes":["Электроны от NADH идут по дыхательной цепи к кислороду","Три комплекса цепи перекачивают протоны из матрикса в межмембранное пространство","Градиент — разность pH и мембранный потенциал, матрикс заряжен отрицательно"],"static":["Электроны от NADH идут к O₂; три комплекса перекачивают H⁺ из матрикса; градиент ≈ 180 мВ = ≈ 150 мВ + 0,5–0,6 ед. pH."],"scene":"s5_t4b","L":{"s5_l_cytosol":"цитозоль","s5_l_etc":"дыхательная цепь","s5_l_ims":"межмембранное пространство","s5_l_matrix":"матрикс","s5_l_o2h2o":"O₂ → H₂O","s5_l_synthase":"АТФ-синтаза","s5_t4b_matrix":"матрикс: pH ≈ 7,9, заряд −","s5_t4b_out":"снаружи: pH ≈ 7,4, заряд +","s5_t4b_sum":"≈ 150 мВ + 0,5–0,6 ед. pH ≈ 180 мВ"}}}},{"id":"atp-synthase","num":25,"section":3,"questions":[4],"title":"Как АТФ-синтаза использует протонный градиент?","keywords":["АТФ-синтаза","Сопряжение","Окислительное фосфорилирование","Переносчик АДФ/АТФ"],"lead":["[[T71|АТФ-синтаза]] — крупный комплекс внутренней мембраны: мембранная часть Fo и каталитическая головка F1, обращённая в матрикс."],"mechanism":["Протоны возвращаются в матрикс по градиенту через мембранную часть Fo; их движение вращает кольцо из нескольких субъединиц c, а вращение меняет форму каталитических центров головки F1, где из АДФ и фосфата образуется АТФ. Так энергия градиента запасается как свободная энергия химической системы: отношение АТФ к АДФ и фосфату поддерживается далеко от равновесия; связь переноса электронов с синтезом АТФ через общий градиент называют [[T80|сопряжением]], а весь процесс — [[T75|окислительным фосфорилированием]]. Образованный в матриксе АТФ выходит в межмембранное пространство через [[T72|переносчик АДФ/АТФ]] в обмен на АДФ и далее через порины — в цитозоль."],"paragraphs":["АТФ-синтаза обратима: при недостатке градиента она может гидролизовать АТФ и перекачивать протоны наружу; протонные насосы V-типа лизосом устроены похоже, но работают только на гидролиз АТФ (БИО-5·11). Градиент нужен не только для синтеза АТФ: он обеспечивает перенос веществ через внутреннюю мембрану и импорт белков (БИО-5·27).","<b>На практикуме.<\/b> Вкладка 4, шаг 4.2.","<b>Ограничения.<\/b> Число субъединиц c различно у разных организмов (у быка — 8), поэтому на схеме кольцо условное; механизм вращения на базовом уровне не требуется."],"conditions":"Схема по строению комплекса, упрощённая: число субъединиц условно.","sources":["src_01"],"base":"БИО-5·24","quiz":{"id":"S5-L25","question":"В каком направлении движутся протоны через АТФ-синтазу, когда она синтезирует АТФ?","options":[{"id":"S5-L25-1","text":"Из межмембранного пространства в матрикс","correct":true,"feedback":"По градиенту, к отрицательно заряженной и более щелочной стороне"},{"id":"S5-L25-2","text":"Из матрикса в межмембранное пространство","correct":false,"feedback":"В эту сторону протоны перекачивает дыхательная цепь; синтаза при этом работала бы как насос"},{"id":"S5-L25-3","text":"Протоны через АТФ-синтазу не проходят","correct":false,"feedback":"Синтез АТФ идёт именно за счёт прохождения протонов через Fo"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как синтаза использует градиент?","status":"Схема по строению комплекса, упрощённая","modes_label":"Этап","modes":["поток H⁺","синтез","выход АТФ","обратная работа"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Протоны идут через Fo в матрикс, кольцо c вращается","Вращение меняет форму F1: из АДФ и фосфата образуется АТФ","АТФ выходит из матрикса через переносчик АДФ/АТФ в обмен на АДФ","При обратной работе синтаза тратит АТФ и перекачивает протоны наружу"],"static":["АТФ-синтаза: H⁺ проходят Fo, кольцо c вращается, F1 образует АТФ; АТФ выходит через переносчик АДФ/АТФ; при обратной работе синтаза тратит АТФ."],"scene":"s5_r_synthase","L":{"s5_l_aac":"переносчик АДФ/АТФ","s5_l_cytosol":"цитозоль","s5_l_ims":"межмембранное пространство","s5_l_matrix":"матрикс","s5_sy_adp":"АДФ + фосфат","s5_sy_exch":"АТФ наружу, АДФ внутрь","s5_sy_f1":"F1","s5_sy_fo":"Fo","s5_sy_rev":"обратная работа: гидролиз АТФ перекачивает H⁺ наружу","s5_sy_ring":"кольцо c вращается"}}},"exam_quiz":{"id":"S5-E08","question":"Для чего митохондрии нужен переносчик АДФ/АТФ?","options":[{"id":"S5-E08-1","text":"Синтезирует АТФ на наружной мембране","correct":false,"feedback":"АТФ синтезирует АТФ-синтаза внутренней мембраны"},{"id":"S5-E08-2","text":"Обменивает АТФ из матрикса на АДФ снаружи","correct":true,"feedback":"Так АТФ выходит к местам расхода, а АДФ поступает на синтез"},{"id":"S5-E08-3","text":"Перекачивает протоны в матрикс","correct":false,"feedback":"Протоны перекачивает дыхательная цепь, и в обратную сторону — из матрикса"}]}},{"id":"leak-vs-block","num":26,"section":3,"questions":[4],"title":"Утечка протонов и остановка АТФ-синтазы: чем они различаются?","keywords":["Утечка протонов","Разобщающий белок (UCP1)"],"lead":["Синтез АТФ в митохондрии снижается и при [[T73|утечке протонов]] — их возвращении в матрикс в обход АТФ-синтазы, — и при остановке самой синтазы. Но остальные показатели в этих двух случаях меняются в противоположные стороны."],"mechanism":["При утечке протоны возвращаются в матрикс без синтеза АТФ; градиент уменьшается, его тормозящее действие на насосы ослабевает, и при достатке субстратов и кислорода дыхательная цепь работает быстрее: потребление кислорода растёт, а энергия рассеивается в виде тепла. При остановке АТФ-синтазы протонам некуда возвращаться, кроме небольшой утечки; градиент растёт, насосы перекачивают протоны против всё большей силы, и перенос электронов замедляется — потребление кислорода падает. В экспериментах на клетках ингибитор АТФ-синтазы снижает дыхание."],"paragraphs":["Значит, одного показателя «синтез АТФ снизился» недостаточно: различить причины позволяют потребление кислорода и мембранный потенциал. В бурой жировой ткани утечку создаёт [[T74|разобщающий белок (UCP1)]]: большая часть энергии окисления превращается в тепло, а не в АТФ; это защищает новорождённых от охлаждения.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.3–4.4.","<b>Ограничения.<\/b> Утверждение «при утечке дыхание ускоряется» верно при достатке субстратов и кислорода; если их не хватает, ускоряться нечему (БИО-5·28). Направления изменений выведены из учебной модели вкладки 4."],"conditions":"Схема качественная, две панели: А — утечка, Б — остановка АТФ-синтазы; стрелки показывают направления, толщина — условную величину потока.","sources":["src_01","src_06"],"base":"БИО-5·24, БИО-5·25","quiz":{"id":"S5-L26","question":"Синтез АТФ снизился, потребление кислорода выросло. Какая причина вероятнее?","options":[{"id":"S5-L26-1","text":"Остановка самой АТФ-синтазы","correct":false,"feedback":"При остановке синтазы градиент растёт, и потребление кислорода падает"},{"id":"S5-L26-2","text":"Утечка протонов в обход синтазы","correct":true,"feedback":"Градиент меньше тормозит насосы, цепь работает быстрее, а АТФ образуется меньше"},{"id":"S5-L26-3","text":"Нехватка кислорода","correct":false,"feedback":"При нехватке кислорода его потребление не может вырасти"}]},"widget":{"kind":"dna","title":"","s":{"title":"Утечка и блок синтазы","status":"Схема качественная · числа — учебная модель, у.е.","modes_label":"Условие","modes":["норма","А утечка","Б блок синтазы"],"args":[{"cond":"normal"},{"cond":"leak"},{"cond":"synthase_off"}],"notes":["градиент ≈ 47,6; O₂ ≈ 52,4; АТФ ≈ 47,6 у.е.","градиент ↓ 20; O₂ ↑ 80; АТФ ↓ 20","градиент ↑ 90,9; O₂ ↓ 9,1; АТФ 0"],"static":["Утечка: градиент ↓, O₂ ↑, АТФ ↓; блок синтазы: градиент ↑, O₂ ↓, АТФ 0."],"scene":"s5_t4c","L":{"s5_l_cytosol":"цитозоль","s5_l_etc":"дыхательная цепь","s5_l_heat":"тепло","s5_l_ims":"межмембранное пространство","s5_l_leak":"путь утечки","s5_l_matrix":"матрикс","s5_l_synthase":"АТФ-синтаза","s5_t4c_stop_syn":"градиент растёт, перекачка замедляется"}}}},{"id":"potential-import","num":27,"section":3,"questions":[4],"title":"Зачем митохондрии мембранный потенциал помимо синтеза АТФ?","keywords":["Импорт белков в митохондрию","Митофагия"],"lead":["Большинство белков митохондрии синтезируется в цитозоле и должно быть доставлено внутрь, через две мембраны."],"mechanism":["[[T76|Импорт белков]] матрикса начинается с узнавания их сигнальной последовательности белковым комплексом наружной мембраны; затем белок передаётся комплексу внутренней мембраны. Переход через внутреннюю мембрану требует электрохимического градиента, а втягивание в матрикс — гидролиза АТФ шапероном матрикса. Поэтому при потере потенциала нарушается сразу и синтез АТФ, и импорт белков: предшественники белков остаются в цитозоле, а в митохондрии не хватает новых белков. Тот же признак — потеря потенциала — служит сигналом для удаления повреждённой митохондрии [[T26|митофагией]] (БИО-5·6)."],"paragraphs":["Электрохимический градиент на внутренней мембране также приводит в действие перенос ряда веществ через неё, энергетически невыгодный без градиента.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.5.","<b>Ограничения.<\/b> Названия комплексов импорта и пути импорта разных белков подробно разбираются в курсе «Молекулярная биология»."],"conditions":"Схема качественная: путь предшественника белка через две мембраны.","sources":["src_01"],"base":"БИО-5·24","quiz":{"id":"S5-L27","question":"Почему вещество, рассеивающее мембранный потенциал, нарушает импорт белков матрикса?","options":[{"id":"S5-L27-1","text":"Без потенциала распадаются рибосомы цитозоля","correct":false,"feedback":"Рибосомы цитозоля от потенциала митохондрии не зависят"},{"id":"S5-L27-2","text":"Потенциал нужен только порину наружной мембраны","correct":false,"feedback":"Порин — пассивный канал; потенциал нужен для перехода через внутреннюю мембрану"},{"id":"S5-L27-3","text":"Переход через внутреннюю мембрану требует потенциала","correct":true,"feedback":"Без потенциала предшественники белков остаются в цитозоле"}]},"widget":{"kind":"dna","title":"","s":{"title":"Зачем потенциал для импорта белков?","status":"Схема качественная","modes_label":"Потенциал","modes":["есть","рассеян"],"args":[{"dpsi":true},{"dpsi":false}],"notes":["белок проходит обе мембраны","белок остаётся в цитозоле"],"static":["Предшественник белка матрикса проходит комплекс наружной, затем внутренней мембраны только при мембранном потенциале."],"scene":"s5_r_import","L":{"s5_im_dpsi":"потенциал есть","s5_im_in":"белок в матриксе, шаперон матрикса","s5_im_nodpsi":"потенциал рассеян","s5_im_pre":"предшественник белка матрикса","s5_im_stop":"предшественник связан с комплексом наружной мембраны, внутреннюю не проходит","s5_im_tim":"комплекс внутренней мембраны","s5_im_tom":"комплекс наружной мембраны","s5_l_atp":"АТФ","s5_l_cytosol":"цитозоль","s5_l_ims":"межмембранное пространство","s5_l_matrix":"матрикс"}}}},{"id":"respiration-not-atp","num":28,"section":3,"questions":[4],"title":"Почему больше работы дыхательной цепи не обязательно означает больше АТФ?","keywords":[],"lead":["Сверх программы. Учебная стационарная модель: дыхательная цепь перекачивает протоны тем медленнее, чем выше градиент; протоны возвращаются через АТФ-синтазу и путём утечки, пропорционально градиенту."],"mechanism":["Подача электронов S (субстрат и кислород) задаётся от 0 до 100 у.е. Перекачка = S × (1 − G/100), где G — градиент в у.е.; возврат через синтазу = G (если синтаза работает), утечка = L × G. В стационарном состоянии перекачка равна возврату. При S = 100 и малой утечке (L = 0,1) градиент около 47,6 у.е., перекачка (а с ней потребление кислорода) около 52,4 у.е., синтез АТФ — около 47,6 у.е. При утечке L = 3 градиент падает до 20 у.е., перекачка растёт до 80 у.е., а синтез АТФ снижается до 20 у.е.: цепь работает больше, а АТФ образуется меньше, 60 у.е. рассеиваются. При остановленной синтазе (L = 0,1) градиент около 90,9 у.е., перекачка падает до 9,1 у.е., АТФ не образуется."],"paragraphs":["Если подача электронов мала (S = 30) и утечка велика (L = 3), перекачка растёт лишь с 23,6 до 27,9 у.е. и не может превысить подачу, а синтез АТФ падает примерно до 7 у.е.: прирост работы цепи ограничен подачей. Баланс каждого состояния: перекачано = вернулось через синтазу + утекло.","<b>Ограничения.<\/b> Зависимость перекачки от градиента линейна только в модели; синтез АТФ в модели пропорционален потоку протонов через синтазу, а доступность АДФ не учтена. Все величины — условные единицы."],"conditions":"Учебная модель · условные единицы; зависимость перекачки от градиента и коэффициенты — допущения, а не измеренные величины.","sources":["src_01"],"base":"БИО-5·26","level":"adv","next_base":"integration","quiz":{"id":"S5-L28","question":"В модели утечка увеличена при малой подаче электронов (S = 30). Что произойдёт с потреблением кислорода?","options":[{"id":"S5-L28-1","text":"Вырастет немного: не больше подачи","correct":true,"feedback":"С 23,6 до 27,9 у.е.; перекачка не может превысить подачу, а АТФ падает сильно"},{"id":"S5-L28-2","text":"Вырастет так же, как при S = 100","correct":false,"feedback":"При S = 100 прирост с 52,4 до 80 у.е.; при S = 30 прирост ограничен подачей"},{"id":"S5-L28-3","text":"Упадёт до нуля","correct":false,"feedback":"Подача сохраняется; цепь работает, но АТФ образуется мало"}]},"widget":{"kind":"dna","title":"","s":{"title":"Дыхание, градиент и АТФ","status":"Учебная модель · условные единицы","modes_label":"Условия","modes":["норма","утечка 3","синтаза заблокирована","S = 30, утечка 3"],"args":[{"S":100,"L":0.1,"syn":true},{"S":100,"L":3,"syn":true},{"S":100,"L":0.1,"syn":false},{"S":30,"L":3,"syn":true}],"notes":["Градиент 47,6; O₂ 52,4; АТФ 47,6; утечка 4,8 у.е.","Градиент 20; O₂ 80; АТФ 20; утечка 60 у.е.","Градиент 90,9; O₂ 9,1; АТФ 0; утечка 9,1 у.е.","Градиент 7,0; O₂ 27,9; АТФ 7,0; утечка 20,9 у.е."],"static":["Учебная модель A4: перекачано = через синтазу + утечка; утечка повышает дыхание и снижает синтез АТФ, блок синтазы повышает градиент и снижает дыхание."],"scene":"s5_a4","L":{"s5_a4_bal":"Перекачано = через синтазу + утечка: {p} = {s} + {l}","s5_a4_g":"градиент {v}","s5_a4_jl":"утечка (тепло) {v}","s5_a4_jp":"перекачано (O₂) {v}","s5_a4_js":"через синтазу (АТФ) {v}","s5_l_cytosol":"цитозоль","s5_l_etc":"дыхательная цепь","s5_l_heat":"тепло","s5_l_ims":"межмембранное пространство","s5_l_leak":"путь утечки","s5_l_matrix":"матрикс","s5_l_synthase":"АТФ-синтаза","s5_t4c_stop_syn":"градиент растёт, перекачка замедляется"}}},"adv_kind":"Исследование модели"},{"id":"aac-leak","num":29,"section":3,"questions":[4],"title":"Через что протоны утекают в обход АТФ-синтазы?","keywords":["Разобщитель"],"lead":["Сверх программы. Утечка протонов есть и в нормальной митохондрии. Долго считалось, что вещества-[[T79|разобщители]] переносят протоны через любой липидный бислой сами, без участия белков."],"mechanism":["Разобщители (например, динитрофенол) вызывали во внутренней мембране митохондрий ток протонов гораздо больший, чем в плазматической мембране клеток, даже при более высоких концентрациях в последнем случае. В митохондриях сердца мышей без основного переносчика АДФ/АТФ ток, вызванный динитрофенолом, был меньше примерно на 80 %. В бурой жировой ткани основную часть этого тока обеспечивал разобщающий белок UCP1. По расчётам, разобщители связываются внутри полости переносчика АДФ/АТФ, рядом с местом связывания АДФ. В клетках без переносчиков АДФ/АТФ дыхание, усиленное разобщителями, было значительно меньше."],"paragraphs":["<b>Что уточняет эта работа?<\/b> Ток протонов, вызванный разобщителями, проводят в основном определённые белки, а не липиды мембраны (около 20 % тока, вызванного динитрофенолом, от переносчика не зависит): переносчик АДФ/АТФ выполняет две функции — обмен АДФ на АТФ и проведение протонов, — и поэтому распределяет энергию градиента между синтезом АТФ и образованием тепла. АДФ и АТФ уменьшают ток, но полностью его не подавляют.","<b>Ограничения.<\/b> Эксперименты выполнены на митохондриях мышей и на клеточной линии мыши; другие разобщители (например, FCCP) зависели от переносчика слабее; синтез АТФ в работе прямо не измеряли. Разобщители — лабораторные вещества; динитрофенол токсичен, и клинических рекомендаций работа не даёт."],"conditions":"Схема по данным работы, упрощённая: относительные величины тока, а не исходные записи.","sources":["src_06"],"base":"БИО-5·25, БИО-5·26","level":"adv","next_base":"integration","quiz":{"id":"S5-L29","question":"Что показало удаление переносчика АДФ/АТФ в митохондриях сердца?","options":[{"id":"S5-L29-1","text":"Синтез АТФ полностью прекратился","correct":false,"feedback":"Синтез АТФ в этой работе прямо не измеряли; измеряли ток протонов"},{"id":"S5-L29-2","text":"Ток, вызванный разобщителем, резко уменьшился","correct":true,"feedback":"Значит, ток, вызванный разобщителем, идёт в основном через этот белок"},{"id":"S5-L29-3","text":"Разобщитель стал действовать сильнее","correct":false,"feedback":"Наоборот: без переносчика действие разобщителя ослабло"}]},"widget":{"kind":"dna","title":"","s":{"title":"Через что идёт утечка?","status":"Схема по данным работы, упрощённая","modes_label":"Митохондрии","modes":["сердце","сердце без переносчика АДФ/АТФ","бурый жир"],"args":[{"tissue":"heart"},{"tissue":"heart_ko"},{"tissue":"bat"}],"notes":["ток, вызванный разобщителем, — 100 % (относительно)","≈ 20 %","основную часть тока проводит UCP1"],"static":["Ток H⁺, вызванный разобщителем: в сердце без переносчика АДФ/АТФ — около 20 % от нормы; в бурой жировой ткани основную часть проводит UCP1."],"scene":"s5_r_aac","L":{"s5_ac_cur_bat":"основную часть тока проводит UCP1","s5_ac_cur_heart":"ток H⁺, вызванный разобщителем: 100 % (относительно)","s5_ac_cur_heart_ko":"ток H⁺: ≈ 20 %","s5_ac_noaac":"переносчика АДФ/АТФ нет","s5_ac_ucp1":"UCP1","s5_ac_unc":"разобщитель","s5_l_aac":"переносчик АДФ/АТФ","s5_l_cytosol":"цитозоль","s5_l_ims":"межмембранное пространство","s5_l_matrix":"матрикс"}}},"adv_kind":"Новые данные"},{"id":"integration","num":30,"section":4,"questions":[1,2,3,4],"title":"Накопился груз или снизился синтез АТФ: как найти звено?","keywords":[],"lead":["Во всех четырёх тематических блоках работает один принцип: опасная химия идёт в отдельном пространстве, и результат определяется соотношением потоков — сколько поступает и сколько успевает обработаться."],"mechanism":["Чтобы найти нарушенное звено, нужны три ответа. Первый — локальное условие: есть ли кислая среда в лизосоме, не повреждена ли мембрана, сохраняется ли потенциал митохондрии. Второй — ресурс: есть ли фермент, метка, переносчик, кислород и субстрат. Третий — поток: дошёл ли материал до места обработки и успевает ли он обрабатываться. Отсюда правило для накопления: что накопилось (отдельные белки, агрегаты, органеллы, малые молекулы), где (цитозоль, лизосома, пероксисома) и в какой форме (с цепью убиквитина или без неё). Для митохондрии: снижение АТФ различают по потреблению кислорода и потенциалу."],"paragraphs":["Иногда одного наблюдения недостаточно, и честный ответ — «данных недостаточно, нужно ещё одно измерение»: например, снижение АТФ без данных о кислороде и потенциале одинаково совместимо с утечкой, остановкой синтазы и недостатком кислорода. Связь компартментов работает и в другую сторону: протеасома и аутофагия тратят АТФ, а повреждённые митохондрии удаляются аутофагией — нарушение в одном месте меняет нагрузку на другие ([[seminar-6-route.html|семинар 6]] — гомеостаз и гибель клетки; [[seminar-10-route.html#quality-control|семинар 10]] — что происходит с дефектным белком).","<b>На практикуме.<\/b> Итоговая задача под вкладкой 4.","<b>Ограничения.<\/b> Три вопроса — учебная схема рассуждения, а не полный перечень причин."],"conditions":"Схема качественная: четыре компартмента и вопросы «условие — ресурс — поток».","sources":["src_01"],"base":"БИО-5·14, БИО-5·21, БИО-5·26","quiz":{"id":"S5-L30","question":"Белок, поглощённый эндоцитозом, доходит до лизосом, но не расщепляется; гидролазы на месте, мембраны не повреждены. Что измерить первым?","options":[{"id":"S5-L30-1","text":"Образование аутофагосом","correct":false,"feedback":"Материал уже в лизосомах, значит, доставка состоялась"},{"id":"S5-L30-2","text":"Число протеасом в клетке","correct":false,"feedback":"Протеасома не разрушает материал внутри лизосом"},{"id":"S5-L30-3","text":"pH в просвете лизосом","correct":true,"feedback":"Ферменты есть и материал доставлен; остаётся проверить кислую среду"}]},"widget":{"kind":"dna","title":"","s":{"title":"Условие — ресурс — поток","status":"Схема качественная","modes_label":"Компартмент","modes":["лизосома","протеасома и аутофагия","пероксисома","митохондрия"],"args":[{"view":1},{"view":2},{"view":3},{"view":4}],"notes":["Лизосома: есть ли кислая среда и не повреждена мембрана, на месте ли гидролазы, доставлен ли груз?","Протеасома и аутофагия: есть ли метка, работает ли путь, не превышает ли приток ёмкость?","Пероксисома: импортированы ли ферменты, не опережает ли образование H₂O₂ её удаление?","Митохондрия: есть ли кислород и субстрат, работает ли синтаза, нет ли утечки?"],"static":["Найти звено: условие (среда, мембрана, потенциал), ресурс (фермент, метка, переносчик, кислород, субстрат), поток (дошёл ли материал, не опережает ли приток ёмкость)."],"scene":"s5_int","L":{"s5_int_c1":"лизосома","s5_int_c2":"протеасома и аутофагия","s5_int_c3":"пероксисома","s5_int_c4":"митохондрия","s5_int_cond":"условие","s5_int_flow":"поток","s5_int_q":"Что накопилось, где и в какой форме?","s5_int_res":"ресурс","s5_int_v1_1":"кислая среда в просвете, мембрана не повреждена","s5_int_v1_2":"гидролазы с меткой M6P, насос, переносчики","s5_int_v1_3":"доставка груза и выход продуктов","s5_int_v2_1":"метка: цепь убиквитина или мотив KFERQ","s5_int_v2_2":"E1–E3, 19S- и 20S-частицы, фагофор, LAMP2A","s5_int_v2_3":"приток белков и ёмкость путей","s5_int_v3_1":"импорт ферментов просвета (Pex5)","s5_int_v3_2":"оксидазы и каталаза","s5_int_v3_3":"образование и удаление H₂O₂","s5_int_v4_1":"мембранный потенциал внутренней мембраны","s5_int_v4_2":"кислород, субстрат, АТФ-синтаза","s5_int_v4_3":"перекачка протонов и их возврат"}}}},{"id":"links","num":31,"section":4,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":[],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},{"ul":["[[seminar-1-route.html|Семинар 1]] — электрохимический градиент, мембранный потенциал и насосы: [[seminar-1-route.html#bio-1-17|«Как работает Na⁺/K⁺-АТФаза?»]], [[seminar-1-route.html#bio-1-20|«Градиент как запасённая энергия»]], [[seminar-1-route.html#bio-1-11|«Электрохимический градиент: два вклада в движение иона»]], [[seminar-1-route.html#bio-1-12|«Мембранный потенциал: что это и откуда он берётся»]]","[[seminar-3-route.html|Семинар 3]] — эндоцитоз, ранняя эндосома и рециклинг рецепторов; [[seminar-3-route.html#caveolae-reserve|кавеолы как запас мембраны]], сохраняющий границу клетки: [[seminar-3-route.html#coated-pit|«Как клатриновая ямка собирается вокруг рецептора с грузом»]]","[[seminar-4-route.html|Семинар 4]] — метка маннозо-6-фосфат и доставка гидролаз; удаление несвернувшихся белков ЭПР: [[seminar-4-route.html#er-removal
