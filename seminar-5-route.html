p>&lt;b&gt;Ограничения.&lt;/b&gt; Кристы на схеме показаны складками; на трёхмерных реконструкциях это диски и трубочки, соединённые с остальной внутренней мембраной узкими участками.</p><div class="static-quiz"><h3>Почему межмембранное пространство по составу малых молекул похоже на цитозоль, а матрикс — нет?</h3><ol><li><b>А.</b> Межмембранное пространство соединено с цитозолем отверстием <i>(неверный вариант)</i><br><span class="expl">Межмембранное пространство отделено от цитозоля наружной мембраной</span></li><li><b>Б.</b> Наружная мембрана пропускает малые молекулы, внутренняя — нет <i>(верный вариант)</i><br><span class="expl">Порины наружной мембраны пропускают молекулы до 5000 Да; внутренняя мембрана почти непроницаема для ионов</span></li><li><b>В.</b> Матрикс сообщается с цитозолем через кристы <i>(неверный вариант)</i><br><span class="expl">Кристы — складки внутренней мембраны; они не открываются в цитозоль</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема по строению органеллы, упрощённая: мембраны — бислой, размеры не в масштабе.</p></details></article><article class="card print-unit" id="ns-etc-gradient"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 24 из 31</div><h2>Как дыхательная цепь создаёт протонный градиент?</h2><p class="lead">В матриксе при окислении питательных веществ образуется <a href="#ns-g-S5-T67">NADH</a> — переносчик электронов. Электроны от NADH передаются по <a href="#ns-g-S5-T66">дыхательной цепи</a> — набору белковых комплексов внутренней мембраны — на кислород, который восстанавливается до воды.</p><div class="note"><strong>Что показывает схема.</strong> Электроны от NADH идут к O₂; три комплекса перекачивают H⁺ из матрикса; градиент ≈ 180 мВ = ≈ 150 мВ + 0,5–0,6 ед. pH.</div><ol class="mech"><li>Переход электронов по цепи энергетически выгоден, и три комплекса цепи используют эту энергию, чтобы перекачивать протоны из матрикса в межмембранное пространство (в пространство крист). Так создаётся <a href="#ns-g-S5-T68">электрохимический градиент протонов</a> из двух вкладов: разности pH (в матриксе около 7,9, снаружи — около 7,4) и <a href="#ns-g-S5-T69">мембранного потенциала</a> (матрикс заряжен отрицательно). В дышащей митохондрии градиент составляет около 180 мВ, из них около 150 мВ приходится на мембранный потенциал, а разность pH — 0,5–0,6 единицы — добавляет остальное (одна единица pH эквивалентна примерно 60 мВ). Градиент создаёт <a href="#ns-g-S5-T70">протонодвижущую силу</a>, направленную на возврат протонов в матрикс.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·23; вспомнить <a href="seminar-1-route.html#bio-1-12">семинар 1: «Мембранный потенциал: что это и откуда он берётся»</a></p><p>Энергия градиента определяется не числом протонов снаружи, а суммой двух вкладов: главный вклад — мембранный потенциал, а разность концентраций протонов невелика. Поэтому «больше протонов в межмембранном пространстве» — неточное описание запаса энергии. Протоны в водной среде и по цепочкам полярных групп белков движутся очень быстро.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаги 4.1–4.2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Названия и состав комплексов дыхательной цепи на базовом уровне не требуются (курс «Молекулярная биология»).</p><div class="static-quiz"><h3>Куда перекачивают протоны комплексы дыхательной цепи?</h3><ol><li><b>А.</b> Из межмембранного пространства в матрикс <i>(неверный вариант)</i><br><span class="expl">В матрикс протоны возвращаются через АТФ-синтазу или путём утечки</span></li><li><b>Б.</b> Из цитозоля в межмембранное пространство <i>(неверный вариант)</i><br><span class="expl">Перекачка идёт через внутреннюю мембрану, а не через наружную</span></li><li><b>В.</b> Из матрикса в межмембранное пространство <i>(верный вариант)</i><br><span class="expl">Матрикс становится более щелочным и заряжается отрицательно</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: стрелки протонов — направление, а не число частиц; значения градиента — по учебнику.</p></details></article><article class="card print-unit" id="ns-atp-synthase"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 25 из 31</div><h2>Как АТФ-синтаза использует протонный градиент?</h2><p class="lead"><a href="#ns-g-S5-T71">АТФ-синтаза</a> — крупный комплекс внутренней мембраны: мембранная часть Fo и каталитическая головка F1, обращённая в матрикс.</p><div class="note"><strong>Что показывает схема.</strong> АТФ-синтаза: H⁺ проходят Fo, кольцо c вращается, F1 образует АТФ; АТФ выходит через переносчик АДФ/АТФ; при обратной работе синтаза тратит АТФ.</div><ol class="mech"><li>Протоны возвращаются в матрикс по градиенту через мембранную часть Fo; их движение вращает кольцо из нескольких субъединиц c, а вращение меняет форму каталитических центров головки F1, где из АДФ и фосфата образуется АТФ. Так энергия градиента запасается как свободная энергия химической системы: отношение АТФ к АДФ и фосфату поддерживается далеко от равновесия; связь переноса электронов с синтезом АТФ через общий градиент называют <a href="#ns-g-S5-T80">сопряжением</a>, а весь процесс — <a href="#ns-g-S5-T75">окислительным фосфорилированием</a>. Образованный в матриксе АТФ выходит в межмембранное пространство через <a href="#ns-g-S5-T72">переносчик АДФ/АТФ</a> в обмен на АДФ и далее через порины — в цитозоль.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·24</p><p>АТФ-синтаза обратима: при недостатке градиента она может гидролизовать АТФ и перекачивать протоны наружу; протонные насосы V-типа лизосом устроены похоже, но работают только на гидролиз АТФ (БИО-5·11). Градиент нужен не только для синтеза АТФ: он обеспечивает перенос веществ через внутреннюю мембрану и импорт белков (БИО-5·27).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 4.2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Число субъединиц c различно у разных организмов (у быка — 8), поэтому на схеме кольцо условное; механизм вращения на базовом уровне не требуется.</p><div class="static-quiz"><h3>В каком направлении движутся протоны через АТФ-синтазу, когда она синтезирует АТФ?</h3><ol><li><b>А.</b> Из межмембранного пространства в матрикс <i>(верный вариант)</i><br><span class="expl">По градиенту, к отрицательно заряженной и более щелочной стороне</span></li><li><b>Б.</b> Из матрикса в межмембранное пространство <i>(неверный вариант)</i><br><span class="expl">В эту сторону протоны перекачивает дыхательная цепь; синтаза при этом работала бы как насос</span></li><li><b>В.</b> Протоны через АТФ-синтазу не проходят <i>(неверный вариант)</i><br><span class="expl">Синтез АТФ идёт именно за счёт прохождения протонов через Fo</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема по строению комплекса, упрощённая: число субъединиц условно.</p></details></article><article class="card print-unit" id="ns-leak-vs-block"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 26 из 31</div><h2>Утечка протонов и остановка АТФ-синтазы: чем они различаются?</h2><p class="lead">Синтез АТФ в митохондрии снижается и при <a href="#ns-g-S5-T73">утечке протонов</a> — их возвращении в матрикс в обход АТФ-синтазы, — и при остановке самой синтазы. Но остальные показатели в этих двух случаях меняются в противоположные стороны.</p><div class="note"><strong>Что показывает схема.</strong> Утечка: градиент ↓, O₂ ↑, АТФ ↓; блок синтазы: градиент ↑, O₂ ↓, АТФ 0.</div><ol class="mech"><li>При утечке протоны возвращаются в матрикс без синтеза АТФ; градиент уменьшается, его тормозящее действие на насосы ослабевает, и при достатке субстратов и кислорода дыхательная цепь работает быстрее: потребление кислорода растёт, а энергия рассеивается в виде тепла. При остановке АТФ-синтазы протонам некуда возвращаться, кроме небольшой утечки; градиент растёт, насосы перекачивают протоны против всё большей силы, и перенос электронов замедляется — потребление кислорода падает. В экспериментах на клетках ингибитор АТФ-синтазы снижает дыхание.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·24, БИО-5·25</p><p>Значит, одного показателя «синтез АТФ снизился» недостаточно: различить причины позволяют потребление кислорода и мембранный потенциал. В бурой жировой ткани утечку создаёт <a href="#ns-g-S5-T74">разобщающий белок (UCP1)</a>: большая часть энергии окисления превращается в тепло, а не в АТФ; это защищает новорождённых от охлаждения.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаги 4.3–4.4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Утверждение «при утечке дыхание ускоряется» верно при достатке субстратов и кислорода; если их не хватает, ускоряться нечему (БИО-5·28). Направления изменений выведены из учебной модели вкладки 4.</p><div class="static-quiz"><h3>Синтез АТФ снизился, потребление кислорода выросло. Какая причина вероятнее?</h3><ol><li><b>А.</b> Остановка самой АТФ-синтазы <i>(неверный вариант)</i><br><span class="expl">При остановке синтазы градиент растёт, и потребление кислорода падает</span></li><li><b>Б.</b> Утечка протонов в обход синтазы <i>(верный вариант)</i><br><span class="expl">Градиент меньше тормозит насосы, цепь работает быстрее, а АТФ образуется меньше</span></li><li><b>В.</b> Нехватка кислорода <i>(неверный вариант)</i><br><span class="expl">При нехватке кислорода его потребление не может вырасти</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li><li><a href="https://doi.org/10.1038/s41586-022-04747-5">Bertholet A.M., Natale A.M., Bisignano P., Suzuki J., Fedorenko A., Hamilton J., Brustovetsky T., Kazak L., Garrity R., Chouchani E.T., Brustovetsky N., Grabe M., Kirichok Y. Mitochondrial uncouplers induce proton leak by activating AAC and UCP1. Nature. 2022;606(7912):180–187</a></li></ul><p>Схема качественная, две панели: А — утечка, Б — остановка АТФ-синтазы; стрелки показывают направления, толщина — условную величину потока.</p></details></article><article class="card print-unit" id="ns-potential-import"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 27 из 31</div><h2>Зачем митохондрии мембранный потенциал помимо синтеза АТФ?</h2><p class="lead">Большинство белков митохондрии синтезируется в цитозоле и должно быть доставлено внутрь, через две мембраны.</p><div class="note"><strong>Что показывает схема.</strong> Предшественник белка матрикса проходит комплекс наружной, затем внутренней мембраны только при мембранном потенциале.</div><ol class="mech"><li><a href="#ns-g-S5-T76">Импорт белков</a> матрикса начинается с узнавания их сигнальной последовательности белковым комплексом наружной мембраны; затем белок передаётся комплексу внутренней мембраны. Переход через внутреннюю мембрану требует электрохимического градиента, а втягивание в матрикс — гидролиза АТФ шапероном матрикса. Поэтому при потере потенциала нарушается сразу и синтез АТФ, и импорт белков: предшественники белков остаются в цитозоле, а в митохондрии не хватает новых белков. Тот же признак — потеря потенциала — служит сигналом для удаления повреждённой митохондрии <a href="#ns-g-S5-T26">митофагией</a> (БИО-5·6).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·24</p><p>Электрохимический градиент на внутренней мембране также приводит в действие перенос ряда веществ через неё, энергетически невыгодный без градиента.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 4.5.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Названия комплексов импорта и пути импорта разных белков подробно разбираются в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Почему вещество, рассеивающее мембранный потенциал, нарушает импорт белков матрикса?</h3><ol><li><b>А.</b> Без потенциала распадаются рибосомы цитозоля <i>(неверный вариант)</i><br><span class="expl">Рибосомы цитозоля от потенциала митохондрии не зависят</span></li><li><b>Б.</b> Потенциал нужен только порину наружной мембраны <i>(неверный вариант)</i><br><span class="expl">Порин — пассивный канал; потенциал нужен для перехода через внутреннюю мембрану</span></li><li><b>В.</b> Переход через внутреннюю мембрану требует потенциала <i>(верный вариант)</i><br><span class="expl">Без потенциала предшественники белков остаются в цитозоле</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: путь предшественника белка через две мембраны.</p></details></article><article class="card print-unit" id="ns-respiration-not-atp"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 28 из 31</div><h2>Почему больше работы дыхательной цепи не обязательно означает больше АТФ?</h2><p class="lead">Сверх программы. Учебная стационарная модель: дыхательная цепь перекачивает протоны тем медленнее, чем выше градиент; протоны возвращаются через АТФ-синтазу и путём утечки, пропорционально градиенту.</p><div class="note"><strong>Что показывает схема.</strong> Учебная модель A4: перекачано = через синтазу + утечка; утечка повышает дыхание и снижает синтез АТФ, блок синтазы повышает градиент и снижает дыхание.</div><ol class="mech"><li>Подача электронов S (субстрат и кислород) задаётся от 0 до 100 у.е. Перекачка = S × (1 − G/100), где G — градиент в у.е.; возврат через синтазу = G (если синтаза работает), утечка = L × G. В стационарном состоянии перекачка равна возврату. При S = 100 и малой утечке (L = 0,1) градиент около 47,6 у.е., перекачка (а с ней потребление кислорода) около 52,4 у.е., синтез АТФ — около 47,6 у.е. При утечке L = 3 градиент падает до 20 у.е., перекачка растёт до 80 у.е., а синтез АТФ снижается до 20 у.е.: цепь работает больше, а АТФ образуется меньше, 60 у.е. рассеиваются. При остановленной синтазе (L = 0,1) градиент около 90,9 у.е., перекачка падает до 9,1 у.е., АТФ не образуется.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·26</p><p>Если подача электронов мала (S = 30) и утечка велика (L = 3), перекачка растёт лишь с 23,6 до 27,9 у.е. и не может превысить подачу, а синтез АТФ падает примерно до 7 у.е.: прирост работы цепи ограничен подачей. Баланс каждого состояния: перекачано = вернулось через синтазу + утекло.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Зависимость перекачки от градиента линейна только в модели; синтез АТФ в модели пропорционален потоку протонов через синтазу, а доступность АДФ не учтена. Все величины — условные единицы.</p><div class="static-quiz"><h3>В модели утечка увеличена при малой подаче электронов (S = 30). Что произойдёт с потреблением кислорода?</h3><ol><li><b>А.</b> Вырастет немного: не больше подачи <i>(верный вариант)</i><br><span class="expl">С 23,6 до 27,9 у.е.; перекачка не может превысить подачу, а АТФ падает сильно</span></li><li><b>Б.</b> Вырастет так же, как при S = 100 <i>(неверный вариант)</i><br><span class="expl">При S = 100 прирост с 52,4 до 80 у.е.; при S = 30 прирост ограничен подачей</span></li><li><b>В.</b> Упадёт до нуля <i>(неверный вариант)</i><br><span class="expl">Подача сохраняется; цепь работает, но АТФ образуется мало</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Учебная модель · условные единицы; зависимость перекачки от градиента и коэффициенты — допущения, а не измеренные величины.</p></details></article><article class="card print-unit" id="ns-aac-leak"><div class="eyebrow">Митохондрия: протонный градиент и синтез АТФ · шаг 29 из 31</div><h2>Через что протоны утекают в обход АТФ-синтазы?</h2><p class="lead">Сверх программы. Утечка протонов есть и в нормальной митохондрии. Долго считалось, что вещества-<a href="#ns-g-S5-T79">разобщители</a> переносят протоны через любой липидный бислой сами, без участия белков.</p><div class="note"><strong>Что показывает схема.</strong> Ток H⁺, вызванный разобщителем: в сердце без переносчика АДФ/АТФ — около 20 % от нормы; в бурой жировой ткани основную часть проводит UCP1.</div><ol class="mech"><li>Разобщители (например, динитрофенол) вызывали во внутренней мембране митохондрий ток протонов гораздо больший, чем в плазматической мембране клеток, даже при более высоких концентрациях в последнем случае. В митохондриях сердца мышей без основного переносчика АДФ/АТФ ток, вызванный динитрофенолом, был меньше примерно на 80 %. В бурой жировой ткани основную часть этого тока обеспечивал разобщающий белок UCP1. По расчётам, разобщители связываются внутри полости переносчика АДФ/АТФ, рядом с местом связывания АДФ. В клетках без переносчиков АДФ/АТФ дыхание, усиленное разобщителями, было значительно меньше.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·25, БИО-5·26</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Ток протонов, вызванный разобщителями, проводят в основном определённые белки, а не липиды мембраны (около 20 % тока, вызванного динитрофенолом, от переносчика не зависит): переносчик АДФ/АТФ выполняет две функции — обмен АДФ на АТФ и проведение протонов, — и поэтому распределяет энергию градиента между синтезом АТФ и образованием тепла. АДФ и АТФ уменьшают ток, но полностью его не подавляют.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Эксперименты выполнены на митохондриях мышей и на клеточной линии мыши; другие разобщители (например, FCCP) зависели от переносчика слабее; синтез АТФ в работе прямо не измеряли. Разобщители — лабораторные вещества; динитрофенол токсичен, и клинических рекомендаций работа не даёт.</p><div class="static-quiz"><h3>Что показало удаление переносчика АДФ/АТФ в митохондриях сердца?</h3><ol><li><b>А.</b> Синтез АТФ полностью прекратился <i>(неверный вариант)</i><br><span class="expl">Синтез АТФ в этой работе прямо не измеряли; измеряли ток протонов</span></li><li><b>Б.</b> Ток, вызванный разобщителем, резко уменьшился <i>(верный вариант)</i><br><span class="expl">Значит, ток, вызванный разобщителем, идёт в основном через этот белок</span></li><li><b>В.</b> Разобщитель стал действовать сильнее <i>(неверный вариант)</i><br><span class="expl">Наоборот: без переносчика действие разобщителя ослабло</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-5.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-022-04747-5">Bertholet A.M., Natale A.M., Bisignano P., Suzuki J., Fedorenko A., Hamilton J., Brustovetsky T., Kazak L., Garrity R., Chouchani E.T., Brustovetsky N., Grabe M., Kirichok Y. Mitochondrial uncouplers induce proton leak by activating AAC and UCP1. Nature. 2022;606(7912):180–187</a></li></ul><p>Схема по данным работы, упрощённая: относительные величины тока, а не исходные записи.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог: что накопилось, где и в какой форме · шаг 30 из 31</div><h2>Накопился груз или снизился синтез АТФ: как найти звено?</h2><p class="lead">Во всех четырёх тематических блоках работает один принцип: опасная химия идёт в отдельном пространстве, и результат определяется соотношением потоков — сколько поступает и сколько успевает обработаться.</p><div class="note"><strong>Что показывает схема.</strong> Найти звено: условие (среда, мембрана, потенциал), ресурс (фермент, метка, переносчик, кислород, субстрат), поток (дошёл ли материал, не опережает ли приток ёмкость).</div><ol class="mech"><li>Чтобы найти нарушенное звено, нужны три ответа. Первый — локальное условие: есть ли кислая среда в лизосоме, не повреждена ли мембрана, сохраняется ли потенциал митохондрии. Второй — ресурс: есть ли фермент, метка, переносчик, кислород и субстрат. Третий — поток: дошёл ли материал до места обработки и успевает ли он обрабатываться. Отсюда правило для накопления: что накопилось (отдельные белки, агрегаты, органеллы, малые молекулы), где (цитозоль, лизосома, пероксисома) и в какой форме (с цепью убиквитина или без неё). Для митохондрии: снижение АТФ различают по потреблению кислорода и потенциалу.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-5·14, БИО-5·21, БИО-5·26</p><p>Иногда одного наблюдения недостаточно, и честный ответ — «данных недостаточно, нужно ещё одно измерение»: например, снижение АТФ без данных о кислороде и потенциале одинаково совместимо с утечкой, остановкой синтазы и недостатком кислорода. Связь компартментов работает и в другую сторону: протеасома и аутофагия тратят АТФ, а повреждённые митохондрии удаляются аутофагией — нарушение в одном месте меняет нагрузку на другие (<a href="seminar-6-route.html">семинар 6</a> — гомеостаз и гибель клетки; <a href="seminar-10-route.html#quality-control">семинар 10</a> — что происходит с дефектным белком).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Итоговая задача под вкладкой 4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Три вопроса — учебная схема рассуждения, а не полный перечень причин.</p><div class="static-quiz"><h3>Белок, поглощённый эндоцитозом, доходит до лизосом, но не расщепляется; гидролазы на месте, мембраны не повреждены. Что измерить первым?</h3><ol><li><b>А.</b> Образование аутофагосом <i>(неверный вариант)</i><br><span class="expl">Материал уже в лизосомах, значит, доставка состоялась</span></li><li><b>Б.</b> Число протеасом в клетке <i>(неверный вариант)</i><br><span class="expl">Протеасома не разрушает материал внутри лизосом</span></li><li><b>В.</b> pH в просвете лизосом <i>(верный вариант)</i><br><span class="expl">Ферменты есть и материал доставлен; остаётся проверить кислую среду</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-5.html#q1">Вопрос 1 →</a> <a href="seminar-5.html#q2">Вопрос 2 →</a> <a href="seminar-5.html#q3">Вопрос 3 →</a> <a href="seminar-5.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell, 7th ed. New York: W. W. Norton, 2022. Гл. 3 (с. 162–163), гл. 6 (с. 378–387), гл. 12 (с. 722–728), гл. 13 (с. 784–785, 794–807), гл. 14 (с. 811–842)</li></ul><p>Схема качественная: четыре компартмента и вопросы «условие — ресурс — поток».</p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог: что накопилось, где и в какой форме · шаг 31 из 31</div><h2>Связи и что дальше</h2><p class="lead"></p><ol class="mech"></ol><h3>Что понадобилось из прежних семинаров</h3><ul><li><a href="seminar-1-route.html">Семинар 1</a> — электрохимический градиент, мембранный потенциал и насосы: <a href="seminar-1-route.html#bio-1-17">«Как работает Na⁺/K⁺-АТФаза?»</a>, <a href="seminar-1-route.html#bio-1-20">«Градиент как запасённая энергия»</a>, <a href="seminar-1-route.html#bio-1-11">«Электрохимический градиент: два вклада в движение иона»</a>, <a href="seminar-1-route.html#bio-1-12">«Мембранный потенциал: что это и откуда он берётся»</a></li><li><a href="seminar-3-route.html">Семинар 3</a> — эндоцитоз, ранняя эндосома и рециклинг рецепторов; <a href="seminar-3-route.html#caveolae-reserve">кавеолы как запас мембраны</a>, сохраняющий границу клетки: <a href="seminar-3-route.html#coated-pit">«Как клатриновая ямка собирается вокруг рецептора с грузом»</a></li><li><a href="seminar-4-route.html">Семинар 4</a> — метка маннозо-6-фосфат и доставка гидролаз; удаление несвернувшихся белков ЭПР: <a href="seminar-4-route.html#er-removal">«Как удаляется белок, который так и не свернулся?»</a>, <a href="seminar-4-route.html#m6p-tag">«Как лизосомная гидролаза получает метку маннозо-6-фосфат?»</a>, <a href="seminar-4-route.html#m6p-receptor-cycle">«Как метка становится адресом: цикл рецептора M6P»</a>, <a href="seminar-4-route.html#er-signal">«Что делает участок цепи сигналом для ЭПР?»</a></li></ul><h3>Что дальше в курсе</h3><ul><li><a href="seminar-6-route.html">Семинар 6</a> — гомеостаз клетки, клеточный цикл и гибель клетки: роль митохондрий и лизосом</li><li><a href="seminar-10-route.html">Семинар 10</a> — дефектный белок: от рибосомы до протеасомы</li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Регуляция аутофагии и mTORC1, AMPK — <a href="https://edu.mazunin.science/seminar-7-route.html#autophagy">«Молекулярная биология», семинар 7: начало аутофагии</a>, <a href="https://edu.mazunin.science/seminar-7-route.html#phagophore">фагофор</a>, <a href="https://edu.mazunin.science/seminar-7-route.html#lc3">LC3</a>, <a href="https://edu.mazunin.science/seminar-7-route.html#fusion-acidity">слияние и закисление</a>, <a href="https://edu.mazunin.science/seminar-7-route.html#lysosomal-defects">дефекты лизосом</a></li><li>Образование и удаление H₂O₂, локальная редокс-сигнализация — <a href="https://edu.mazunin.science/seminar-8-route.html#ros-sources">«Молекулярная биология», семинар 8: источники</a>, <a href="https://edu.mazunin.science/seminar-8-route.html#h2o2-removal">удаление H₂O₂</a>, <a href="https://edu.mazunin.science/seminar-8-route.html#redox-signaling">редокс-сигнализация</a></li><li>Хемиосмос, АТФ-синтаза, блок синтазы и разобщение, импорт белков — <a href="https://edu.mazunin.science/seminar-9-route.html#chemiosmosis">«Молекулярная биология», семинар 9: хемиосмос</a>, <a href="https://edu.mazunin.science/seminar-9-route.html#atp-synthase">АТФ-синтаза</a>, <a href="https://edu.mazunin.science/seminar-9-route.html#inhibition">блок синтазы</a>, <a href="https://edu.mazunin.science/seminar-9-route.html#uncoupling">разобщение</a>, <a href="https://edu.mazunin.science/seminar-9-route.html#presequence-import">импорт</a></li><li>Каскад E1–E2–E3, цепь убиквитина, 26S-протеасома — <a href="https://edu.mazunin.science/seminar-11-route.html#ubiquitin-cascade">«Молекулярная биология», семинар 11: каскад</a>, <a href="https://edu.mazunin.science/seminar-11-route.html#ub-chain">цепь убиквитина</a>, <a href="https://edu.mazunin.science/seminar-11-route.html#proteasome-26s">26S-протеасома</a>, <a href="https://edu.mazunin.science/seminar-11-route.html#autophagy-flux">аутофагический поток</a></li><li>Повреждение и ремонт лизосомы, лизофагия — <a href="https://edu.mazunin.science/seminar-12-route.html#lyso-damage">«Молекулярная биология», семинар 12: повреждение</a>, <a href="https://edu.mazunin.science/seminar-12-route.html#lyso-repair">ремонт</a>, <a href="https://edu.mazunin.science/seminar-12-route.html#lysophagy">лизофагия</a></li><li>Компартменты и pH — <a href="https://edu.mazunin.science/seminar-1-route.html#pumps-channels">«Молекулярная биология», семинар 1: насосы и каналы</a>, <a href="https://edu.mazunin.science/seminar-1-route.html#mito-potential">потенциал митохондрии</a></li></ul><div class="static-quiz"><h3>Где в курсе продолжается тема роли митохондрий и лизосом в гибели клетки?</h3><ol><li><b>А.</b> В теме о метке маннозо-6-фосфат <i>(неверный вариант)</i><br><span class="expl">Это было раньше — <a href="seminar-4-route.html">семинар 4</a>.</span></li><li><b>Б.</b> В теме о клеточном цикле и гибели клетки <i>(верный вариант)</i><br><span class="expl"><a href="seminar-6-route.html">Семинар 6</a> — гомеостаз клетки, клеточный цикл и гибель клетки.</span></li><li><b>В.</b> В теме о дефектном белке <i>(неверный вариант)</i><br><span class="expl"><a href="seminar-10-route.html">Семинар 10</a> — дефектный белок: от рибосомы до протеасомы.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-5.html#q1">Вопрос 1 →</a> <a href="seminar-5.html#q2">Вопрос 2 →</a> <a href="seminar-5.html#q3">Вопрос 3 →</a> <a href="seminar-5.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S5-T01"><dt>Протеасома</dt><dd>Белковый комплекс цитозоля и ядра, разрушающий белки, помеченные цепью убиквитина; 26S-протеасома состоит из 20S-частицы с протеазами внутри и одной или двух 19S-частиц.</dd></div><div id="ns-g-S5-T02"><dt>Убиквитин</dt><dd>Небольшой белок из 76 аминокислот, который присоединяется к лизину другого белка как метка; смысл метки зависит от числа молекул и типа связи между ними.</dd></div><div id="ns-g-S5-T03"><dt>Убиквитин-активирующий фермент (E1)</dt><dd>Фермент, который с затратой АТФ активирует C-конец убиквитина и передаёт его ферменту E2.</dd></div><div id="ns-g-S5-T04"><dt>Убиквитин-конъюгирующий фермент (E2)</dt><dd>Фермент, который принимает активированный убиквитин от E1 и вместе с убиквитинлигазой переносит его на белок-мишень.</dd></div><div id="ns-g-S5-T05"><dt>Убиквитинлигаза (E3)</dt><dd>Фермент, узнающий определённый белок-мишень по дегрону и обеспечивающий присоединение к нему убиквитина; от E3 зависит, какой белок будет помечен.</dd></div><div id="ns-g-S5-T06"><dt>Полиубиквитиновая цепь</dt><dd>Цепочка молекул убиквитина, присоединённая к одному лизину белка; цепь, в которой молекулы связаны через лизин 48, направляет белок в протеасому.</dd></div><div id="ns-g-S5-T07"><dt>Моноубиквитинирование</dt><dd>Присоединение к белку одной молекулы убиквитина (или нескольких одиночных молекул к разным лизинам); у мембранных белков — сигнал эндоцитоза и сортировки в эндосомах.</dd></div><div id="ns-g-S5-T08"><dt>20S-частица</dt><dd>Центральная часть протеасомы: полый цилиндр из четырёх колец субъединиц, активные центры протеаз которого обращены внутрь.</dd></div><div id="ns-g-S5-T09"><dt>19S-частица</dt><dd>Регуляторная часть протеасомы на конце цилиндра: связывает цепь убиквитина, отщепляет убиквитин и кольцом АТФаз разворачивает белок, протягивая его в 20S-частицу.</dd></div><div id="ns-g-S5-T10"><dt>Дегрон</dt><dd>Участок белка, по которому убиквитинлигаза или другой белок узнаёт его как мишень разрушения.</dd></div><div id="ns-g-S5-T11"><dt>Короткоживущий белок</dt><dd>Белок, который разрушается вскоре после синтеза или после выполнения работы; к ним относятся многие регуляторные белки.</dd></div><div id="ns-g-S5-T12"><dt>Лизосома</dt><dd>Мембранная органелла с кислой средой и кислыми гидролазами, в которой расщепляются макромолекулы, поступившие путём эндоцитоза, фагоцитоза и аутофагии.</dd></div><div id="ns-g-S5-T13"><dt>Кислые гидролазы</dt><dd>Ферменты лизосом, расщепляющие макромолекулы с присоединением воды и работающие лучше всего в кислой среде.</dd></div><div id="ns-g-S5-T14"><dt>Аутофагия</dt><dd>Доставка собственного материала цитоплазмы — участков цитозоля, агрегатов, органелл — в лизосому для расщепления.</dd></div><div id="ns-g-S5-T15"><dt>Макроаутофагия</dt><dd>Вид аутофагии, при котором груз окружается двойной мембраной фагофора и образуется аутофагосома, сливающаяся затем с лизосомой.</dd></div><div id="ns-g-S5-T16"><dt>Аутофагосома</dt><dd>Пузырь с двумя мембранами, содержащий груз аутофагии; наружная мембрана сливается с лизосомой.</dd></div><div id="ns-g-S5-T17"><dt>Фагофор</dt><dd>Растущая плоская двойная мембрана, которая окружает груз и, смыкая края, образует аутофагосому; называется также изолирующей мембраной.</dd></div><div id="ns-g-S5-T18"><dt>Микроаутофагия</dt><dd>Вид аутофагии, при котором мембрана лизосомы или поздней эндосомы сама впячивается и захватывает небольшую порцию цитоплазмы.</dd></div><div id="ns-g-S5-T19"><dt>Шаперон-опосредованная аутофагия</dt><dd>Вид аутофагии, при котором отдельные растворимые белки с мотивом KFERQ с участием шаперона HSC70 и рецептора LAMP2A по одному переходят через мембрану лизосомы.</dd></div><div id="ns-g-S5-T20"><dt>Мотив KFERQ</dt><dd>Короткий участок белка, по свойствам аминокислот похожий на последовательность Lys-Phe-Glu-Arg-Gln; его узнаёт шаперон HSC70.</dd></div><div id="ns-g-S5-T21"><dt>HSC70</dt><dd>Шаперон цитозоля, который связывает мотив KFERQ и доставляет белок к мембране лизосомы.</dd></div><div id="ns-g-S5-T22"><dt>LAMP2A</dt><dd>Белок мембраны лизосомы, рецептор шаперон-опосредованной аутофагии; через собранный из него комплекс белок переходит в просвет.</dd></div><div id="ns-g-S5-T23"><dt>Селективная аутофагия</dt><dd>Аутофагия определённого груза (органеллы, агрегата, бактерии), при которой мембрана плотно охватывает груз, почти не захватывая цитозоль.</dd></div><div id="ns-g-S5-T24"><dt>Рецептор селективной аутофагии</dt><dd>Белок, который связывает метку на грузе (чаще всего убиквитин) и белок ATG8 на мембране фагофора.</dd></div><div id="ns-g-S5-T25"><dt>ATG8</dt><dd>Похожий на убиквитин белок, присоединённый к липиду мембраны фагофора; с ним связываются рецепторы селективной аутофагии.</dd></div><div id="ns-g-S5-T26"><dt>Митофагия</dt><dd>Селективная аутофагия повреждённых или лишних митохондрий.</dd></div><div id="ns-g-S5-T27"><dt>Агрегат белка</dt><dd>Скопление многих молекул неправильно свёрнутого белка, связанных друг с другом; слишком крупно для канала протеасомы.</dd></div><div id="ns-g-S5-T28"><dt>Фагоцитоз</dt><dd>Захват клеткой крупных частиц, микроорганизмов и погибших клеток выростами плазматической мембраны с образованием фагосомы; начинается после связывания частицы с рецепторами.</dd></div><div id="ns-g-S5-T29"><dt>Фагосома</dt><dd>Крупный мембранный пузырёк с поглощённой частицей, который сливается с лизосомами.</dd></div><div id="ns-g-S5-T30"><dt>Эндоцитоз</dt><dd>Поглощение веществ путём впячивания участка плазматической мембраны и отделения пузырька внутрь клетки.</dd></div><div id="ns-g-S5-T31"><dt>Ранняя эндосома</dt><dd>Компартмент, принимающий пузырьки эндоцитоза; в его слабокислой среде многие лиганды отделяются от рецепторов, а рецепторы возвращаются на поверхность.</dd></div><div id="ns-g-S5-T32"><dt>Поздняя эндосома</dt><dd>Более кислый компартмент, образующийся при созревании ранней эндосомы; содержит внутрипросветные пузырьки (мультивезикулярное тельце) и сливается с лизосомами.</dd></div><div id="ns-g-S5-T33"><dt>Эндолизосома</dt><dd>Компартмент, образующийся при слиянии поздней эндосомы с лизосомой, где идёт расщепление содержимого.</dd></div><div id="ns-g-S5-T34"><dt>Внутрипросветный пузырёк</dt><dd>Пузырёк внутри поздней эндосомы, образованный впячиванием её мембраны; уводит мембранные белки, предназначенные для разрушения, от цитозоля.</dd></div><div id="ns-g-S5-T35"><dt>Протонный насос V-типа</dt><dd>Белковый комплекс мембраны лизосом, эндосом и других органелл, который за счёт гидролиза АТФ перекачивает протоны в просвет.</dd></div><div id="ns-g-S5-T36"><dt>Маннозо-6-фосфат (M6P)</dt><dd>Фосфорилированный остаток маннозы на гликане лизосомных гидролаз, служащий меткой их адреса.</dd></div><div id="ns-g-S5-T37"><dt>Рецептор M6P</dt><dd>Мембранный белок, который в транс-сети аппарата Гольджи связывает гидролазы с меткой M6P и доставляет их в эндосомы, а затем возвращается.</dd></div><div id="ns-g-S5-T38"><dt>Переносчики лизосомной мембраны</dt><dd>Белки мембраны лизосомы, выводящие в цитозоль продукты расщепления: аминокислоты, сахара, нуклеотиды.</dd></div><div id="ns-g-S5-T39"><dt>Гликозилированные мембранные белки лизосомы (LAMP, LIMP)</dt><dd>Основные белки мембраны лизосомы; их углеводные цепи со стороны просвета защищают полипептидную часть от протеаз.</dd></div><div id="ns-g-S5-T40"><dt>Остаточное тельце</dt><dd>Лизосома, содержащая нерасщеплённые остатки.</dd></div><div id="ns-g-S5-T41"><dt>Лизосомная болезнь накопления</dt><dd>Наследственное нарушение, при котором из-за отсутствия лизосомного фермента или его доставки в лизосомах копится нерасщеплённый материал.</dd></div><div id="ns-g-S5-T42"><dt>Катепсины</dt><dd>Протеазы лизосом; катепсин B — одна из них.</dd></div><div id="ns-g-S5-T43"><dt>Макропиноцитоз</dt><dd>Захват внеклеточной жидкости вместе с растворёнными веществами крупными пузырьками, образующимися после сигнала на поверхности клетки.</dd></div><div id="ns-g-S5-T44"><dt>Пероксисома</dt><dd>Органелла с одной мембраной, в которой оксидазы окисляют органические вещества с образованием перекиси водорода, а каталаза её расходует.</dd></div><div id="ns-g-S5-T45"><dt>Оксидаза</dt><dd>Фермент, переносящий атомы водорода от органического вещества на молекулярный кислород; оксидазы пероксисом образуют перекись водорода.</dd></div><div id="ns-g-S5-T46"><dt>Перекись водорода (H₂O₂)</dt><dd>Небольшая незаряженная молекула-окислитель, проходящая через мембраны; в малых количествах избирательно окисляет отдельные остатки цистеина белков и участвует в передаче сигналов, в больших повреждает молекулы.</dd></div><div id="ns-g-S5-T47"><dt>Каталаза</dt><dd>Фермент пероксисом, который использует H₂O₂ для окисления других веществ или разлагает её на воду и кислород.</dd></div><div id="ns-g-S5-T48"><dt>β-Окисление жирных кислот</dt><dd>Последовательное укорочение цепи жирной кислоты по два атома углерода с образованием ацетил-CoA; у млекопитающих идёт в митохондриях и пероксисомах.</dd></div><div id="ns-g-S5-T49"><dt>Жирные кислоты с очень длинной цепью</dt><dd>Жирные кислоты, углеродная цепь которых длиннее, чем у основных жирных кислот клетки; в клетках животных их β-окисление идёт в пероксисомах, а не в митохондриях.</dd></div><div id="ns-g-S5-T50"><dt>Плазмалогены</dt><dd>Фосфолипиды, синтез которых начинается в пероксисомах; особенно многочисленны в миелиновой оболочке нервных волокон.</dd></div><div id="ns-g-S5-T51"><dt>Пероксины</dt><dd>Белки, необходимые для импорта белков в пероксисому и для её образования.</dd></div><div id="ns-g-S5-T52"><dt>Сигнал Ser-Lys-Leu</dt><dd>Последовательность из трёх аминокислот на C-конце многих белков просвета пероксисомы, направляющая их в пероксисому.</dd></div><div id="ns-g-S5-T53"><dt>Pex5</dt><dd>Пероксин-рецептор, который в цитозоле связывает белки с сигналом Ser-Lys-Leu, доставляет их в просвет пероксисомы и возвращается в цитозоль.</dd></div><div id="ns-g-S5-T54"><dt>Pex3</dt><dd>Мембранный пероксин, который встраивается в ЭПР и выходит из него в пузырьках-предшественниках пероксисом.</dd></div><div id="ns-g-S5-T55"><dt>Pex19</dt><dd>Пероксин цитозоля, необходимый для отбора мембранных белков пероксисом в пузырьки-предшественники.</dd></div><div id="ns-g-S5-T56"><dt>Пузырёк-предшественник пероксисомы</dt><dd>Пузырёк с мембранными белками пероксисомы, отпочковывающийся от ЭПР и сливающийся с другими такими пузырьками или с пероксисомой.</dd></div><div id="ns-g-S5-T57"><dt>Синдром Цельвегера</dt><dd>Наследственное заболевание, при котором из-за мутации одного из пероксинов белки не импортируются в пероксисомы.</dd></div><div id="ns-g-S5-T58"><dt>Мембранный контакт</dt><dd>Участок, где мембраны двух органелл удерживаются белками на расстоянии 10–30 нм без слияния; через него переходят липиды и другие молекулы.</dd></div><div id="ns-g-S5-T59"><dt>Митохондрия</dt><dd>Органелла с двумя мембранами, в которой окисление питательных веществ сопряжено с синтезом АТФ через протонный градиент на внутренней мембране.</dd></div><div id="ns-g-S5-T60"><dt>Наружная мембрана митохондрии</dt><dd>Мембрана, окружающая митохондрию снаружи; благодаря поринам проницаема для ионов и молекул массой до 5000 дальтон.</dd></div><div id="ns-g-S5-T61"><dt>Порин</dt><dd>Белок-канал наружной мембраны митохондрии, пропускающий малые молекулы и ионы.</dd></div><div id="ns-g-S5-T62"><dt>Межмембранное пространство</dt><dd>Узкий промежуток между наружной и внутренней мембранами митохондрии; по составу малых молекул похоже на цитозоль.</dd></div><div id="ns-g-S5-T63"><dt>Внутренняя мембрана митохондрии</dt><dd>Мембрана, окружающая матрикс; почти непроницаема для ионов, содержит дыхательную цепь, АТФ-синтазу и переносчики.</dd></div><div id="ns-g-S5-T64"><dt>Криста</dt><dd>Складка внутренней мембраны митохондрии, вдающаяся в матрикс; в её мембране сосредоточены дыхательная цепь и АТФ-синтаза.</dd></div><div id="ns-g-S5-T65"><dt>Матрикс митохондрии</dt><dd>Внутренний компартмент митохондрии с ферментами цикла лимонной кислоты и β-окисления, митохондриальной ДНК и рибосомами.</dd></div><div id="ns-g-S5-T66"><dt>Дыхательная цепь</dt><dd>Набор белковых комплексов внутренней мембраны митохондрии, по которым электроны переходят от NADH на кислород; три комплекса при этом перекачивают протоны из матрикса.</dd></div><div id="ns-g-S5-T67"><dt>NADH</dt><dd>Восстановленная форма никотинамидадениндинуклеотида, переносчик электронов от окисляемых веществ к дыхательной цепи.</dd></div><div id="ns-g-S5-T68"><dt>Электрохимический градиент протонов</dt><dd>Разность концентраций протонов и электрических потенциалов на мембране, вместе определяющая стремление протонов пройти через неё.</dd></div><div id="ns-g-S5-T69"><dt>Мембранный потенциал митохондрии</dt><dd>Разность электрических потенциалов на внутренней мембране (матрикс заряжен отрицательно), основной вклад в протонный градиент.</dd></div><div id="ns-g-S5-T70"><dt>Протонодвижущая сила</dt><dd>Сила, с которой электрохимический градиент протонов направляет протоны обратно в матрикс; выражается в милливольтах.</dd></div><div id="ns-g-S5-T71"><dt>АТФ-синтаза</dt><dd>Комплекс внутренней мембраны митохондрии, который синтезирует АТФ из АДФ и фосфата за счёт потока протонов в матрикс; может работать и в обратном направлении.</dd></div><div id="ns-g-S5-T72"><dt>Переносчик АДФ/АТФ</dt><dd>Белок внутренней мембраны митохондрии, обменивающий АТФ из матрикса на АДФ из межмембранного пространства.</dd></div><div id="ns-g-S5-T73"><dt>Утечка протонов</dt><dd>Возвращение протонов в матрикс в обход АТФ-синтазы, при котором энергия градиента рассеивается в виде тепла.</dd></div><div id="ns-g-S5-T74"><dt>Разобщающий белок (UCP1)</dt><dd>Белок внутренней мембраны митохондрий бурой жировой ткани, проводящий протоны в обход АТФ-синтазы; так энергия окисления превращается в тепло.</dd></div><div id="ns-g-S5-T75"><dt>Окислительное фосфорилирование</dt><dd>Синтез АТФ в митохондрии за счёт энергии переноса электронов по дыхательной цепи через протонный градиент.</dd></div><div id="ns-g-S5-T76"><dt>Импорт белков в митохондрию</dt><dd>Перенос белков, синтезированных в цитозоле, через мембраны митохондрии комплексами наружной и внутренней мембран; переход в матрикс требует мембранного потенциала и АТФ.</dd></div><div id="ns-g-S5-T77"><dt>Миднолин</dt><dd>Белок ядра, который связывает определённые белки и протеасому и направляет эти белки на разрушение без присоединения убиквитина.</dd></div><div id="ns-g-S5-T78"><dt>Цитозоль</dt><dd>Жидкая часть цитоплазмы вне мембранных органелл.</dd></div><div id="ns-g-S5-T79"><dt>Разобщитель</dt><dd>Вещество, вызывающее утечку протонов через внутреннюю мембрану митохондрии и тем ослабляющее сопряжение дыхания с синтезом АТФ.</dd></div><div id="ns-g-S5-T80"><dt>Сопряжение</dt><dd>Связь переноса электронов по дыхательной цепи с синтезом АТФ через общий протонный градиент.</dd></div><div id="ns-g-S5-T81"><dt>Плазматическая мембрана</dt><dd>Мембрана, окружающая клетку и отделяющая цитоплазму от внеклеточной среды.</dd></div></dl></section></noscript>

,"num":1,"section":0,"questions":[1],"title":"Почему у клетки несколько путей разрушения белков и органелл?","keywords":["Цитозоль","Протеасома","Лизосома","Убиквитин","Эндоцитоз","Фагоцитоз"],"lead":["Каждый белок клетки рано или поздно разрушается: одни белки — через минуты после синтеза, другие — через дни. Разрушают их ферменты, расщепляющие пептидные связи, — протеазы. Протеазы, способные разрушать белки целиком, не работают свободно в [[T78|цитозоле]]: у одних активные центры спрятаны внутри белкового цилиндра [[T01|протеасомы]], другие находятся в просвете отдельной мембранной органеллы — [[T12|лизосомы]]."],"mechanism":["Протеасома — немембранный белковый комплекс цитозоля и ядра. Она разрушает по одной молекуле белка, помеченной цепью небольшого белка [[T02|убиквитина]], и только если цепь белка удаётся развернуть и протянуть в узкий канал. Лизосома принимает материал, окружённый мембраной: внеклеточные белки и частицы приходят путём [[T30|эндоцитоза]] и [[T28|фагоцитоза]], а участки цитоплазмы, крупные белковые [[T27|агрегаты]] и целые органеллы — путём [[T14|аутофагии]]. Поэтому путь разрушения определяется не химической природой объекта (и там, и там белок), а тем, где он находится, каков его размер и какая на нём метка."],"paragraphs":["Пример: отдельная молекула фермента в цитозоле, помеченная цепью убиквитина, разрушается протеасомой за минуты; повреждённая митохондрия размером около микрометра в канал протеасомы не помещается и разрушается в лизосоме после аутофагии; частица, захваченная снаружи клеткой-фагоцитом, попадает в лизосому путём фагоцитоза. Мембранные белки [[T81|плазматической мембраны]] после эндоцитоза разрушаются в лизосоме, а белки, которые не свернулись в ЭПР, выводятся в цитозоль и разрушаются протеасомой ([[seminar-4-route.html#er-removal|семинар 4: «Как удаляется белок, который так и не свернулся?»]]).","<b>На практикуме.<\/b> Вкладка 1, шаги 1.1–1.4: пять объектов, разных по месту, размеру и метке.","<b>Ограничения.<\/b> Деление на «пути» учебное: некоторые белки могут разрушаться двумя путями (БИО-5·5, БИО-5·7)."],"conditions":"Схема качественная: размеры частиц и органелл не в масштабе.","sources":["src_01"],"base":"вспомнить [[seminar-4-route.html#er-removal|семинар 4: «Как удаляется белок, который так и не свернулся?»]] и [[seminar-3-route.html#rab-conversion|семинар 3: «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»]]","quiz":{"id":"S5-L01","question":"Какой признак объекта прежде всего определяет, разрушит его протеасома или лизосома?","options":[{"id":"S5-L01-1","text":"Где находится объект и каков его размер","correct":true,"feedback":"Отдельный помеченный белок цитозоля — протеасома; материал внутри мембранного пузырька и крупные объекты — лизосома"},{"id":"S5-L01-2","text":"Из каких молекул состоит объект","correct":false,"feedback":"И в протеасоме, и в лизосоме разрушаются белки; химическая природа объекта путь не определяет"},{"id":"S5-L01-3","text":"Сколько времени объект уже находится в клетке","correct":false,"feedback":"Возраст объекта сам по себе путь не задаёт; важны место, размер и метка"}]},"widget":{"kind":"dna","title":"","s":{"title":"Где и по какому признаку разрушается объект?","status":"Схема качественная","modes_label":"Объект","modes":["белок","органелла","частица снаружи"],"args":[{"obj":"protein"},{"obj":"mito"},{"obj":"bacterium_out"}],"notes":["Отдельный белок с цепью разворачивается и входит в канал протеасомы","Органелла окружает фагофор; аутофагосома сливается с лизосомой","Частицу снаружи захватывают выросты мембраны фагоцита; фагосома сливается с лизосомой"],"static":["Три пути: протеасома — для отдельного меченого белка, аутофагия и фагоцитоз — к лизосоме"],"scene":"s5_r_routes","L":{"s5_l_cytosol":"цитозоль","s5_l_lysosome":"лизосома","s5_l_outside":"снаружи клетки","s5_l_phagophore":"фагофор","s5_l_proteasome":"26S-протеасома","s5_ro_19s20s":"19S/20S","s5_ro_chain":"цепь убиквитина","s5_ro_phago":"фагосома"}},"zoomNarrow":true}},{"id":"ubiquitin-cascade","num":2,"section":0,"questions":[1],"title":"Как к белку присоединяется убиквитин: ферменты E1, E2 и E3","keywords":["Убиквитин","Убиквитин-активирующий фермент (E1)","Убиквитин-конъюгирующий фермент (E2)","Убиквитинлигаза (E3)","Дегрон","Короткоживущий белок"],"lead":["[[T02|Убиквитин]] — небольшой белок из 76 аминокислот. Его C-конец присоединяется ковалентной связью к боковой цепи лизина в белке-мишени."],"mechanism":["Присоединение идёт в три этапа. [[T03|Убиквитин-активирующий фермент (E1)]] с затратой АТФ активирует C-конец убиквитина и передаёт его [[T04|убиквитин-конъюгирующему ферменту (E2)]]. [[T05|Убиквитинлигаза (E3)]] связывает определённый белок-мишень и вместе с E2 переносит на него убиквитин. Убиквитинлигаз в клетке много, и каждая узнаёт свои мишени по особому участку цепи — [[T10|дегрону]]. Поэтому специфичность метки задаёт E3, а не E1."],"paragraphs":["Дегрон становится доступным, когда белок не свернулся или повреждён (открытый гидрофобный участок), после присоединения фосфатной группы или после того, как белок закончил работу. Так [[T11|короткоживущие]] регуляторные белки — например, циклины митоза — разрушаются в строго определённый момент ([[seminar-6-route.html#irreversible-transitions|семинар 6]]). Метку можно снять: ферменты, отщепляющие убиквитин, делают метку обратимой.","<b>На практикуме.<\/b> Вкладка 1, конструктор: «убрать убиквитинлигазу».","<b>Ограничения.<\/b> На схеме один E1, один E2 и одна E3; число ферментов каждого типа в клетке условно не показано."],"conditions":"Схема качественная: последовательность этапов — учебное деление непрерывного процесса.","sources":["src_01"],"base":"БИО-5·1","quiz":{"id":"S5-L02","question":"В клетке нет одной из убиквитинлигаз. Что изменится?","options":[{"id":"S5-L02-1","text":"Ни один белок клетки не получит убиквитин","correct":false,"feedback":"Так было бы без E1, общего для многих путей; E3 же много, и они разные"},{"id":"S5-L02-2","text":"Не получат метку только мишени этой лигазы","correct":true,"feedback":"Каждая E3 узнаёт свои дегроны; остальные белки метятся другими лигазами"},{"id":"S5-L02-3","text":"Убиквитин будет присоединяться к случайным белкам","correct":false,"feedback":"Без E3 метка на её мишени просто не появляется; случайного мечения не возникает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как E1, E2, E3 передают убиквитин?","status":"Схема качественная · порядок этапов — учебное деление","modes_label":"Этап","modes":["1 E1","2 E2","3 E3","4 цепь"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["E1 с затратой АТФ активирует C-конец убиквитина","Убиквитин переходит на E2","E3 связывает мишень по дегрону и вместе с E2 переносит убиквитин","Повторение этапов строит цепь"],"static":["Этапы мечения: E1 с затратой АТФ активирует убиквитин; убиквитин переходит на E2; E3 узнаёт мишень по дегрону и вместе с E2 переносит убиквитин; повторение строит цепь."],"scene":"s5_r_cascade","L":{"s5_cs_chain":"повторение этапов строит цепь","s5_cs_degron":"дегрон","s5_cs_lys":"лизин мишени","s5_cs_target":"мишень","s5_l_atp_amp":"АТФ","s5_l_cytosol":"цитозоль","s5_l_ub":"убиквитин"}}},"exam_quiz":{"id":"S5-E01","question":"В клетке нет АТФ. Какой этап мечения белка убиквитином остановится первым?","options":[{"id":"S5-E01-1","text":"Активация убиквитина ферментом E1","correct":true,"feedback":"E1 тратит АТФ на активацию C-конца убиквитина"},{"id":"S5-E01-2","text":"Узнавание мишени ферментом E3","correct":false,"feedback":"E3 работает после активации убиквитина; первым останавливается этап E1"},{"id":"S5-E01-3","text":"Перенос убиквитина с E2 на мишень","correct":false,"feedback":"Перенос идёт после активации; без АТФ останавливается уже первый этап"}]}},{"id":"ubiquitin-code","num":3,"section":0,"questions":[1],"title":"Одна молекула убиквитина или цепь: что означает метка?","keywords":["Моноубиквитинирование","Полиубиквитиновая цепь"],"lead":["Убиквитин присоединяется к белку по-разному: одной молекулой ([[T07|моноубиквитинирование]]), несколькими одиночными молекулами к разным лизинам или цепью, в которой каждый следующий убиквитин связан с предыдущим."],"mechanism":["Метку «читают» белки, которые узнают определённый тип присоединения. [[T06|Полиубиквитиновая цепь]], в которой молекулы связаны через лизин 48 (Lys48) предыдущего убиквитина, направляет белок в протеасому. Одиночные молекулы убиквитина на цитозольном домене мембранного белка служат сигналом эндоцитоза и сортировки в эндосомах: такой белок разрушается не протеасомой, а в лизосоме. Моноубиквитин гистонов участвует в регуляции хроматина, а цепи, связанные через лизин 63 (Lys63), — в репарации ДНК и других процессах, не связанных с протеасомой."],"paragraphs":["Поэтому вопрос «есть ли на белке убиквитин» недостаточен: важно, сколько молекул, как они связаны и где находится белок. Одна и та же молекула убиквитина в цепи разного типа имеет разные последствия.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.2: растворимый фермент с цепью через Lys48 и мембранный белок с одиночными молекулами убиквитина.","<b>Ограничения.<\/b> Таблица «тип метки → последствие» учебная: у одного типа метки бывает несколько последствий, а убиквитин служит меткой и для селективной аутофагии (БИО-5·6)."],"conditions":"Схема качественная: цепи нарисованы из условного числа молекул.","sources":["src_01"],"base":"БИО-5·2","quiz":{"id":"S5-L03","question":"Рецептор плазматической мембраны получил на цитозольном домене одиночные молекулы убиквитина. Где он, скорее всего, будет разрушен?","options":[{"id":"S5-L03-1","text":"В протеасоме, прямо на мембране","correct":false,"feedback":"Протеасому направляет цепь через Lys48; одиночные молекулы — другой сигнал"},{"id":"S5-L03-2","text":"Нигде: одиночная метка ничего не означает","correct":false,"feedback":"Одиночная метка — тоже сигнал, но для другого пути"},{"id":"S5-L03-3","text":"В лизосоме, после эндоцитоза","correct":true,"feedback":"Одиночные молекулы убиквитина на мембранном белке — сигнал эндоцитоза и сортировки в эндосомах"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что означает тип метки?","status":"Схема качественная","modes_label":"Тип метки","modes":["одиночная","одиночные на мембранном белке","цепь Lys48","цепь Lys63"],"args":[{"mark":"mono"},{"mark":"multi_membrane"},{"mark":"k48"},{"mark":"k63"}],"notes":["регуляция хроматина","эндоцитоз и сортировка в эндосомах","протеасома","репарация ДНК и другие процессы"],"static":["Тип метки: одиночная — регуляция хроматина; одиночные на мембранном белке — эндоцитоз и эндосома; цепь через Lys48 — протеасома; цепь через Lys63 — репарация ДНК и другие процессы."],"scene":"s5_r_ubcode","L":{"s5_l_cytosol":"цитозоль","s5_l_proteasome":"26S-протеасома","s5_uc_dna":"репарация ДНК и другие процессы","s5_uc_endo":"эндоцитоз и эндосома","s5_uc_hist":"гистон: регуляция хроматина","s5_uc_k48":"цепь через Lys48","s5_uc_k63":"цепь через Lys63","s5_uc_mono":"одиночная","s5_uc_multi":"одиночные на мембранном белке"}}}},{"id":"proteasome-26s","num":4,"section":0,"questions":[1],"title":"Как 26S-протеасома узнаёт, разворачивает и разрушает белок?","keywords":["20S-частица","19S-частица"],"lead":["Протеасомы многочисленны — около 1 % всех белков клетки — и находятся в цитозоле и ядре. Протеасома с регуляторными частицами называется 26S-протеасомой (S — единица скорости осаждения при центрифугировании)."],"mechanism":["Центральная [[T08|20S-частица]] — полый цилиндр из четырёх колец по семь субъединиц; активные центры протеаз обращены внутрь цилиндра. С концами цилиндра связаны [[T09|19S-частицы]]. В 19S-частице есть рецептор цепи убиквитина, фермент, отщепляющий убиквитин, и кольцо из шести АТФаз. Связав цепь, 19S-частица захватывает неупорядоченный участок белка и с затратой АТФ разворачивает цепь, протягивая её в канал цилиндра. Внутри белок разрезается на короткие пептиды, которые затем расщепляются пептидазами цитозоля до аминокислот. Убиквитин отщепляется до входа в канал и используется снова."],"paragraphs":["Протеасома проверяет белок дважды: нужна цепь убиквитина и нужен участок, с которого начнётся развёртывание. Белок с цепью, но без такого участка, обычно освобождается от убиквитина и отпускается. Протеасома работает непрерывно: разрушает молекулу целиком, не отпуская её на полпути. Через протеасому проходят белки ЭПР, которые не свернулись и выведены в цитозоль ([[seminar-4-route.html#er-removal|семинар 4: «Как удаляется белок, который так и не свернулся?»]]): считается, что 1–5 % всех новых белков не сворачиваются правильно и разрушаются протеасомой.","<b>На практикуме.<\/b> Вкладка 1, конструктор: «убрать рецептор цепи в 19S-частице» и «заблокировать активные центры 20S-частицы».","<b>Ограничения.<\/b> В клетке есть протеасомы с одной и с двумя 19S-частицами; на схеме — две."],"conditions":"Схема по строению комплекса, упрощённая: число субъединиц и форма частиц условны. Доля 1–5 % — оценка по MBoC7, с. 386.","sources":["src_01"],"base":"БИО-5·3","quiz":{"id":"S5-L04","question":"Почему протеаза, спрятанная внутрь цилиндра 20S-частицы, не разрушает белки цитозоля без разбора?","options":[{"id":"S5-L04-1","text":"Внутрь попадает только развёрнутая цепь, обычно с меткой","correct":true,"feedback":"В основном пути вход в канал открывают узнавание цепи убиквитина и развёртывание с затратой АТФ; часть белков разрушается и без убиквитина (БИО-5·8)"},{"id":"S5-L04-2","text":"Протеазы 20S-частицы работают только в ядре","correct":false,"feedback":"Протеасомы работают и в цитозоле, и в ядре; защита — в строении цилиндра"},{"id":"S5-L04-3","text":"Белки цитозоля устойчивы к любым протеазам","correct":false,"feedback":"Белки цитозоля разрушаются протеазами, если попадут внутрь цилиндра"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как 26S-протеасома разрушает белок?","status":"Схема по строению комплекса, упрощённая","modes_label":"Этап","modes":["1 связывание","2 отщепление","3 протягивание","4 пептиды"],"args":[{"ps":1,"cargo":"short_lived"},{"ps":2,"cargo":"short_lived"},{"ps":3,"cargo":"short_lived"},{"ps":4,"cargo":"short_lived"}],"notes":["19S-частица связывает цепь убиквитина, связанную через Lys48","Убиквитин отщепляется и используется снова","Кольцо АТФаз разворачивает белок и протягивает его в канал 20S-частицы","Внутри цилиндра белок разрезается на короткие пептиды"],"static":["26S-протеасома: 19S-частица связывает цепь убиквитина, убиквитин отщепляется, кольцо АТФаз разворачивает белок и протягивает его в канал 20S-частицы, где белок разрезается на пептиды."],"scene":"s5_t1b","L":{"s5_l_19s":"19S-частица","s5_l_20s":"20S-частица","s5_l_cytosol":"цитозоль","s5_l_peptides":"пептиды","s5_t1b_atpase":"кольцо АТФаз","s5_t1b_rec":"рецептор цепи","s5_t1b_reuse":"убиквитин используется снова","s5_t1b_sites":"активные центры (внутри)"}}},"exam_quiz":{"id":"S5-E02","question":"Протеасома работает с избытком нагрузки. Почему запас свободного убиквитина в клетке при этом может уменьшиться?","options":[{"id":"S5-E02-1","text":"Протеасома разрушает убиквитин вместе с белком","correct":false,"feedback":"Убиквитин отщепляется до входа цепи в канал и не разрушается"},{"id":"S5-E02-2","text":"Убиквитин связан в цепях неразрушенных белков","correct":true,"feedback":"В норме он отщепляется 19S-частицей и используется снова"},{"id":"S5-E02-3","text":"Убиквитин уходит в лизосомы","correct":false,"feedback":"Цепи на белках, ожидающих протеасомы, остаются в цитозоле"}]}},{"id":"autophagy-types","num":5,"section":0,"questions":[1],"title":"Три вида аутофагии: чем они различаются?","keywords":["Аутофагия","Макроаутофагия","Фагофор","Аутофагосома","ATG8","Микроаутофагия"],"lead":["[[T14|Аутофагия]] — доставка собственного материала цитоплазмы в лизосому для разрушения. Различают три вида по способу доставки."],"mechanism":["При [[T15|макроаутофагии]] вокруг участка цитоплазмы растёт плоская двойная мембрана — [[T17|фагофор]]. Её края смыкаются, и образуется [[T16|аутофагосома]] — пузырь с двумя мембранами. Наружная мембрана сливается с лизосомой, внутренняя мембрана и груз разрушаются гидролазами. Мембрана фагофора растёт за счёт слияния мелких пузырьков и переноса липидов из ЭПР в местах контакта мембран (в частности, белком ATG2); к её липиду присоединяется белок [[T25|ATG8]], похожий на убиквитин. При [[T18|микроаутофагии]] мембрана лизосомы или поздней эндосомы сама впячивается внутрь и отшнуровывает пузырёк с небольшой порцией цитоплазмы. При [[T19|шаперон-опосредованной аутофагии]] отдельные растворимые белки с мотивом [[T20|KFERQ]] связываются с шапероном [[T21|HSC70]] и по одной молекуле переходят через мембрану лизосомы с помощью рецептора [[T22|LAMP2A]]; для перехода белок должен быть развёрнут."],"paragraphs":["Макроаутофагия усиливается при голодании: аминокислоты, полученные при разрушении белков, используются для синтеза нужных белков. Шаперон-опосредованная аутофагия активируется позже — при голодании дольше примерно 8 часов (в экспериментах на грызунах). Мотив, похожий на KFERQ, есть примерно у 40 % белков млекопитающих, но этим путём разрушаются только белки, у которых мотив в данный момент доступен шаперону. Шаперон-опосредованная аутофагия не разрушает агрегаты: через мембрану проходят только отдельные развёрнутые молекулы.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.4: растворимый белок с мотивом KFERQ при длительном голодании.","<b>Ограничения.<\/b> Шаперон-опосредованная аутофагия описана у млекопитающих и птиц; на схемах размеры пузырьков условны."],"conditions":"Схема качественная, три панели: А — макроаутофагия, Б — микроаутофагия, В — шаперон-опосредованная аутофагия.","sources":["src_01","src_02"],"base":"БИО-5·1","quiz":{"id":"S5-L05","question":"Какой вид аутофагии может разрушить целую митохондрию?","options":[{"id":"S5-L05-1","text":"Шаперон-опосредованная аутофагия","correct":false,"feedback":"Через мембрану лизосомы этим путём проходят только отдельные развёрнутые белки"},{"id":"S5-L05-2","text":"Макроаутофагия","correct":true,"feedback":"Только двойная мембрана фагофора может окружить органеллу целиком"},{"id":"S5-L05-3","text":"Микроаутофагия, при любом размере груза","correct":false,"feedback":"Впячивание мембраны лизосомы захватывает небольшие порции цитоплазмы; основной путь для органеллы — макроаутофагия"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются три вида аутофагии?","status":"Схема качественная","modes_label":"Вид","modes":["А макро","Б микро","В шаперон-опосредованная"],"args":[{"type":"macro"},{"type":"micro"},{"type":"cma"}],"notes":["двойная мембрана окружает участок цитоплазмы или органеллу","мембрана лизосомы впячивается и захватывает порцию цитоплазмы","отдельный развёрнутый белок проходит через мембрану"],"static":["Три вида аутофагии: макроаутофагия — двойная мембрана; микроаутофагия — впячивание мембраны лизосомы; шаперон-опосредованная — отдельный развёрнутый белок через мембрану."],"scene":"s5_r_autotypes","L":{"s5_at_A":"А. Макроаутофагия","s5_at_B":"Б. Микроаутофагия","s5_at_C":"В. Шаперон-опосредованная","s5_at_ap":"аутофагосома (две мембраны)","s5_at_inv":"впячивание мембраны лизосомы","s5_l_cytosol":"цитозоль","s5_l_hsc70":"HSC70","s5_l_lamp2a":"LAMP2A","s5_l_lysosome":"лизосома","s5_t1c_kferq":"мотив KFERQ"}}},"exam_quiz":{"id":"S5-E03","question":"В клетке не образуются аутофагосомы. Каким видом аутофагии небольшая порция цитозоля всё же может попасть в лизосому?","options":[{"id":"S5-E03-1","text":"Макроаутофагией, без фагофора","correct":false,"feedback":"Макроаутофагия всегда идёт через фагофор и аутофагосому"},{"id":"S5-E03-2","text":"Фагоцитозом изнутри клетки","correct":false,"feedback":"Фагоцитоз захватывает частицы снаружи клетки"},{"id":"S5-E03-3","text":"Микроаутофагией","correct":true,"feedback":"Мембрана лизосомы сама впячивается; этот путь не требует фагофора и аутофагосомы"}]}},{"id":"selective-autophagy","num":6,"section":0,"questions":[1],"title":"Как аутофагия узнаёт повреждённую митохондрию или бактерию в цитозоле?","keywords":["Селективная аутофагия","Рецептор селективной аутофагии","Митофагия"],"lead":["Аутофагия бывает неизбирательной, когда фагофор захватывает случайный участок цитоплазмы (например, при голодании), и [[T23|селективной]], когда мембрана плотно охватывает определённый груз."],"mechanism":["Грузы селективной аутофагии — повреждённые органеллы, белковые агрегаты, слишком крупные для протеасомы, и бактерии, вышедшие из фагосомы в цитозоль. Груз получает метку, чаще всего убиквитин. [[T24|Рецепторы селективной аутофагии]] связывают метку на грузе и белок ATG8 на мембране растущего фагофора, и мембрана растёт по контуру груза, почти не захватывая окружающий цитозоль. Удаление повреждённых митохондрий называют [[T26|митофагией]]. Повреждённая митохондрия не поддерживает протонный градиент, поэтому киназа PINK1, которую нормальная митохондрия импортирует внутрь, остаётся на её поверхности и привлекает убиквитинлигазу Parkin; Parkin метит белки наружной мембраны, и метку узнают рецепторы аутофагии."],"paragraphs":["Здесь убиквитин служит меткой не для протеасомы, а для лизосомы: смысл метки зависит от того, кто её читает и где находится груз. Мутации генов PINK1 или Parkin вызывают одну из форм болезни Паркинсона с ранним началом; почему погибают именно определённые нейроны, неизвестно.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.1 (бактерия в цитозоле) и шаг 1.3 (агрегат).","<b>Ограничения.<\/b> Путь PINK1–Parkin — не единственный путь митофагии; другие пути на странице не разбираются."],"conditions":"Схема качественная: рецептор, метка и ATG8 показаны условными знаками.","sources":["src_01"],"base":"БИО-5·3, БИО-5·5","quiz":{"id":"S5-L06","question":"Бактерия вышла из фагосомы в цитозоль клетки, и её поверхностные белки получили убиквитин. Каким путём её разрушит клетка?","options":[{"id":"S5-L06-1","text":"Протеасомой, потому что на бактерии есть убиквитин","correct":false,"feedback":"Бактерия слишком велика для канала протеасомы; убиквитин здесь — метка для аутофагии"},{"id":"S5-L06-2","text":"Фагоцитозом, потому что это бактерия","correct":false,"feedback":"Фагоцитоз захватывает объект снаружи клетки; эта бактерия уже в цитозоле"},{"id":"S5-L06-3","text":"Селективной аутофагией с разрушением в лизосоме","correct":true,"feedback":"Рецепторы связывают убиквитин на бактерии и ATG8 на фагофоре"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как рецептор связывает груз и фагофор?","status":"Схема качественная","modes_label":"Груз","modes":["агрегат","бактерия в цитозоле","повреждённая митохондрия"],"args":[{"cargo":"aggregate","stg":2},{"cargo":"cyto_bacterium","stg":2},{"cargo":"mito_pink","stg":2}],"notes":["рецептор связывает убиквитин на грузе и ATG8 на фагофоре","то же для бактерии","PINK1 остаётся на поверхности, Parkin метит белки наружной мембраны"],"static":["Рецептор селективной аутофагии связывает убиквитин на грузе и ATG8 на фагофоре; на повреждённой митохондрии PINK1 и Parkin ставят убиквитин на белки наружной мембраны."],"scene":"s5_t1c","L":{"s5_l_cytosol":"цитозоль","s5_l_lysosome":"лизосома","s5_l_phagophore":"фагофор","s5_t1c_om":"наружная мембрана митохондрии","s5_t1c_parkin":"Parkin","s5_t1c_pink1":"PINK1","s5_t1c_rec":"рецептор аутофагии связывает убиквитин и ATG8"}}}},{"id":"limited-compensation","num":7,"section":0,"questions":[1],"title":"Может ли аутофагия заменить протеасому?","keywords":[],"lead":["Сверх программы. Учебная потоковая модель: за каждый интервал в цитозоль поступают растворимые меченые белки, агрегаты и повреждённые органеллы; у протеасомы и у аутофагии своя ёмкость — сколько условных единиц (у.е.) материала они разрушают за интервал."],"mechanism":["Правила модели. Протеасома разрушает только растворимые меченые белки — не больше своей ёмкости. Аутофагия разрушает агрегаты и органеллы; растворимые белки она не берёт. Половина растворимых белков, оставшихся неразрушенными к концу интервала, слипается в агрегаты (доля 0,5 — допущение модели). Приток за интервал: 80 у.е. растворимых белков, 10 у.е. агрегатов, 5 у.е. органелл. Ёмкость протеасомы 100 у.е., аутофагии 40 у.е.: всё разрушается, ничего не копится. Если ёмкость протеасомы снизить до 40 у.е., за первый интервал остаются 40 у.е. растворимых белков; половина из них переходит в агрегаты. К четвёртому интервалу растворимых белков копится 37,5 у.е., агрегатов — около 51 у.е., и начинают копиться органеллы (около 1,5 у.е.): поток агрегатов занял ёмкость аутофагии."],"paragraphs":["Если при сниженной протеасоме удвоить ёмкость аутофагии (80 у.е.), органеллы не копятся, а запас агрегатов равен лишь порции, слипшейся за последний интервал (37,5 у.е.), и сверх неё не растёт; запас же растворимых меченых белков остаётся тем же — 37,5 у.е.: в модели аутофагия берёт только ту часть растворимых белков, которая слиплась в агрегаты. Баланс каждого интервала: запас в начале + приток = разрушено протеасомой + разрушено аутофагией + запас в конце. <b>Обратная задача.<\/b> Копятся и растворимые меченые белки, и повреждённые органеллы. Нужно проверить приток и обе ёмкости: ту же картину даёт и рост притока при обычной протеасоме (140 у.е. при ёмкости 100), и снижение ёмкости протеасомы, и одновременное нарушение обоих путей.","<b>Ограничения.<\/b> В клетке компенсация зависит от ткани и условий: в печени мышей без шаперон-опосредованной аутофагии её часть берут на себя макроаутофагия и протеасома, но при стрессе и с возрастом эта компенсация утрачивается; в сетчатке её нет. Ёмкости, доля слипания и притоки — допущения, а не измеренные величины."],"conditions":"Учебная модель · условные единицы; ёмкости и доля слипания — допущения, а не измеренные величины.","sources":["src_01","src_02"],"base":"БИО-5·4, БИО-5·5, БИО-5·6","level":"adv","next_base":"endolysosome","quiz":{"id":"S5-L07","question":"В модели ёмкость протеасомы снижена до 40 у.е., ёмкость аутофагии удвоена. Что произойдёт с запасом растворимых меченых белков?","options":[{"id":"S5-L07-1","text":"Останется тем же: аутофагия их не берёт","correct":true,"feedback":"Она убирает только слипшуюся часть; растворимые белки копятся как прежде"},{"id":"S5-L07-2","text":"Исчезнет: аутофагия заменит протеасому","correct":false,"feedback":"В модели аутофагия не разрушает отдельные растворимые белки"},{"id":"S5-L07-3","text":"Вырастет вдвое: аутофагия мешает протеасоме","correct":false,"feedback":"Ёмкость аутофагии не влияет на работу протеасомы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему аутофагия не заменяет протеасому?","status":"Учебная модель · условные единицы","modes_label":"Условия","modes":["норма","протеасома 40","протеасома 40, аутофагия 80","протеасома 40, аутофагия 20"],"args":[{"IS":80,"Cp":100,"Ca":40},{"IS":80,"Cp":40,"Ca":40},{"IS":80,"Cp":40,"Ca":80},{"IS":80,"Cp":40,"Ca":20}],"notes":["ничего не копится","растворимые 37,5; агрегаты ≈ 51; органеллы ≈ 1,5 у.е.","растворимые 37,5; агрегаты 37,5; органеллы 0","растворимые 37,5; агрегаты ≈ 99,9; органеллы ≈ 7,6 у.е."],"static":["Учебная модель A1 (интервал 4): норма — ничего не копится; протеасома 40 — растворимые 37,5, агрегаты ≈ 51, органеллы ≈ 1,5 у.е.; протеасома 40 и аутофагия 80 — растворимые 37,5, агрегаты 37,5, органеллы 0; протеасома 40 и аутофагия 20 — растворимые 37,5, агрегаты ≈ 99,9, органеллы ≈ 7,6 у.е."],"scene":"s5_a1","L":{"s5_a1_bal":"Баланс: {a} + {b} = {c} + {d} + {e}","s5_a1_capA":"ёмкость {v}","s5_a1_capP":"ёмкость {v}","s5_a1_dg":"аутофагией: агрегаты","s5_a1_do":"аутофагией: органеллы","s5_a1_dp":"разрушено протеасомой","s5_a1_head":"Интервал {k}","s5_a1_moved":"слиплось в агрегаты: {v} у.е.","s5_a1_pg":"агрегаты","s5_a1_po":"органеллы","s5_a1_pools":"Запасы в конце интервала: растворимые {s}, агрегаты {g}, органеллы {o} у.е.","s5_a1_ps":"растворимые","s5_a_interval":"интервал"}}},"adv_kind":"Новые данные"},{"id":"ubiquitin-free","num":8,"section":0,"questions":[1],"title":"Всегда ли для протеасомы нужна цепь убиквитина?","keywords":["Миднолин"],"lead":["Сверх программы. Цепь убиквитина — главный, но не единственный путь в протеасому. Белки, которые клетка синтезирует сразу после внешнего сигнала (белки «генов раннего ответа», например факторы транскрипции c-Fos и EGR1), живут минуты, и долго было неизвестно, как они разрушаются."],"mechanism":["Поиск генов, без которых такие белки становятся устойчивыми, указал на белок миднолин. [[T77|Миднолин]] находится в основном в ядре и связывается с протеасомой своим длинным C-концевым α-спиральным участком. Другой его участок связывает в белке-мишени неупорядоченный гидрофобный отрезок цепи, который при связывании принимает форму β-тяжа. Третий участок миднолина, похожий на убиквитин, необходим для разрушения захваченного белка. В клетках, где подавлены ферменты E1, активирующие убиквитин, миднолин продолжал направлять мишени в протеасому, а мишени, у которых все лизины заменены, тоже разрушались; подавление протеасомы разрушение останавливало."],"paragraphs":["Мишени миднолина — многие белки ядра, прежде всего регуляторы транскрипции. Значит, отсутствие убиквитина на белке ещё не доказывает, что протеасома в его разрушении не участвует.","<b>Что уточняет эта работа?<\/b> Схема «метка — узнавание — разрушение» верна для большинства белков, но у протеасомы есть и путь без метки, где узнавание выполняет белок-посредник.","<b>Ограничения.<\/b> Работа выполнена на культурах клеток человека и мыши и на нейронах мыши, в основном при повышенном синтезе миднолина; авторы допускают, что те же белки разрушаются и с участием убиквитина, параллельно."],"conditions":"Схема по данным работы, упрощённая: форма участков миднолина условна.","sources":["src_03"],"base":"БИО-5·3, БИО-5·4","level":"adv","next_base":"endolysosome","quiz":{"id":"S5-L08","question":"Ферменты E1, активирующие убиквитин, подавлены, а белок c-Fos всё равно разрушается, причём только при работающей протеасоме. Какой вывод допустим?","options":[{"id":"S5-L08-1","text":"c-Fos разрушается в лизосоме","correct":false,"feedback":"Подавление протеасомы останавливает разрушение; лизосома здесь ни при чём"},{"id":"S5-L08-2","text":"Есть путь в протеасому без убиквитина","correct":true,"feedback":"Миднолин захватывает такие белки и подаёт их протеасоме"},{"id":"S5-L08-3","text":"Протеасома не нужна для разрушения c-Fos","correct":false,"feedback":"Без протеасомы c-Fos не разрушается; не нужна оказалась метка"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как белок попадает в протеасому без убиквитина?","status":"Схема по данным работы, упрощённая","modes_label":"Путь","modes":["цепь убиквитина","миднолин","E1 подавлены","протеасома подавлена"],"args":[{"route":"ub"},{"route":"midn"},{"route":"midn_e1off"},{"route":"midn_protoff"}],"notes":["обычный путь","миднолин захватывает отрезок цепи и подаёт белок протеасоме","разрушение продолжается без убиквитина","разрушение останавливается"],"static":["Миднолин подаёт протеасоме белок без цепи убиквитина: при подавлении E1 разрушение продолжается, при подавлении протеасомы останавливается."],"scene":"s5_r_midnolin","L":{"s5_l_proteasome":"26S-протеасома","s5_md_catch":"участок захвата","s5_md_e1off":"E1 подавлены: разрушение продолжается без убиквитина","s5_md_helix":"α-спираль — к протеасоме","s5_md_midnolin":"миднолин","s5_md_nucleus":"ядро","s5_md_protoff":"протеасома подавлена: разрушение останавливается","s5_md_target":"белок-мишень (c-Fos)","s5_md_usual":"цепь убиквитина: обычный путь"}}},"adv_kind":"Новые данные"},{"id":"endolysosome","num":9,"section":1,"questions":[2],"title":"Из каких компартментов состоит эндосомно-лизосомная система?","keywords":["Эндоцитоз","Ранняя эндосома","Поздняя эндосома","Убиквитин","Моноубиквитинирование","Внутрипросветный пузырёк"],"lead":["Материал, поглощённый [[T30|эндоцитозом]], сначала попадает в [[T31|раннюю эндосому]]. Здесь большинство лигандов отделяется от рецепторов в слабокислой среде, и рецепторы возвращаются на поверхность клетки."],"mechanism":["Ранняя эндосома созревает в [[T32|позднюю эндосому]]: её среда становится кислее. Мембранные белки, предназначенные для разрушения, уже в ранней эндосоме получают одиночные молекулы [[T02|убиквитина]] ([[T07|моноубиквитинирование]]) и с помощью комплексов ESCRT по мере созревания эндосомы уходят во [[T34|внутрипросветные пузырьки]]. Поэтому позднюю эндосому называют мультивезикулярным тельцем. Поздние эндосомы движутся по микротрубочкам к центру клетки и сливаются с [[T12|лизосомами]], образуя [[T33|эндолизосомы]], где идёт расщепление. Когда большая часть содержимого расщеплена, эндолизосома становится плотной небольшой лизосомой, которая может снова слиться с поздней эндосомой."],"paragraphs":["Поэтому лизосомы разнообразны по форме и размеру: это не один вид органеллы, а стадии одного цикла созревания; общее у них — много кислых гидролаз. Уход рецептора во внутрипросветный пузырёк отделяет его цитозольный домен от белков цитозоля и прекращает передачу сигнала. Гидролазы приходят в поздние эндосомы из транс-сети аппарата Гольджи с меткой маннозо-6-фосфат ([[seminar-4-route.html#m6p-tag|семинар 4: «Как лизосомная гидролаза получает метку маннозо-6-фосфат?»]], [[seminar-4-route.html#m6p-receptor-cycle|семинар 4: «Как метка становится адресом: цикл рецептора M6P»]]).","<b>На практикуме.<\/b> Вкладка 2, вступление.","<b>Ограничения.<\/b> Созревание показано как последовательность; в клетке эндосомы также сливаются и делятся."],"conditions":"Схема качественная: шкала pH справа условная, значения pH — по учебнику.","sources":["src_01"],"base":"вспомнить [[seminar-3-route.html#rab-conversion|семинар 3: «Как ранняя эндосома становится поздней: смена Rab5 на Rab7»]] и [[seminar-3-route.html#coated-pit|семинар 3: «Как клатриновая ямка собирается вокруг рецептора с грузом»]]","quiz":{"id":"S5-L09","question":"Почему лизосомы в одной клетке так различаются по форме и размеру?","options":[{"id":"S5-L09-1","text":"Это разные органеллы с разными ферментами","correct":false,"feedback":"У всех лизосом общий признак — много кислых гидролаз; различаются содержимое и стадия"},{"id":"S5-L09-2","text":"Лизосомы делятся только на крупные и мел
