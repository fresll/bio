    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = G('nucleus', `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`);
    segs.forEach(([a, b]) => { const P = stadium(a, b, Yc, H); q += G('envelope', `<path d="M${P.map(([x, y]) => f(x) + ',' + f(y)).join(' L')} Z" fill="${C.lumen}"/>` + bilayerPts(P, { closed: true })); });
    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { let w = `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) w += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; q += G('npc', w); });
    const big = nucBig;
    const imp = o.noImp ? () => '' : nucImp;
    const exp = nucExp;
    const sm = nucSm;
    const top = [[110, 70], [300, 110], [480, 80]], bot = [[110, 320], [300, 290], [480, 330]];
    const q0 = q;

    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   s0y_oc_ui.js — помощники сцен семинара 1 (образец — семинар 12): вкладка из нескольких панелей (А, Б, В) с одной
   схемой — переключатель «Панель», у каждой панели свои переключатели, показания и подпись. «Статуса утверждения»
   в семинаре 1 нет (он — сквозной элемент семинара 12).

/* шкала этапов вкладки (этап 1): план берётся у текущей панели (OC.*.plan); у панели без анимации шкала скрыта.
   Правило (07, разд. 4; промпт, этап 1): анимация только рисует модель — кадр этапа рисует та же функция, что статичную схему,
   конечный кадр — статичная схема; после смены условия — кадр «до начала» и пауза для прогноза; после ответа в сценарии — запуск. */
function ocAnim(K, cfg){
  const view = stageView(K); let P = null, sig = null, armed = false, hold = false;
  const frameAt = T => {
    if (cfg.masked()) return cfg.maskDraw();
    const o = cfg.cur(); if (!P) P = cfg.plan(o);
    if (!P || T >= P.stop - 1e-9) return cfg.draw(o);
    if (T <= 1e-9) return cfg.draw(P.init);
    const i = Math.min(P.st.length - 1, Math.max(0, Math.ceil(T) - 1)), u = T - i, prev = i ? P.st[i - 1] : P.init;
    return cfg.draw(u < .5 ? prev : P.st[i]);
  };
  const tl = timeStrip(K, { note: 'tl_note', steps: true, render(T){ const e = $('svg' + K); if (e) e.innerHTML = defs(K) + frameAt(T); predictDone(K, T); }, onEnd: view.back });
  const el = $('tl' + K);
  return { tl, frameAt, get plan(){ return P; },
    sync(){
      const o = cfg.cur(); P = cfg.masked() ? null : cfg.plan(o);
      el.hidden = !P;
      if (!P) { $('sc' + K).classList.remove('predict'); armed = hold = false; sig = null; $('svg' + K).innerHTML = defs(K) + (cfg.masked() ? cfg.maskDraw() : cfg.draw(o)); return; }
      el.querySelector('.tlnote').textContent = t(P.note || 'tl_note');
      const s = JSON.stringify([P.keys, P.stop, P.stopKey, P.stepKey, !!P.halt]);
      if (s !== sig) { sig = s; tl.config(P.keys, P.stop, P.stopKey, { speed: 1.4, stepKey: P.stepKey || 'tl_step', halt: !!P.halt });   /* семинар 5: остановка после всех этапов (12: «без гидролаз — на Э1.11») */ if (!armed && !hold) tl.seek(tl.end); }
      if (armed) { armed = false; hold = false; tl.play(true); view.reveal(300); }
      else if (hold) { hold = false; tl.seek(0); predictHold(K); }
      else if (!tl.playing) tl.redraw();
    },
    arm(){ armed = true; }, hold(){ hold = true; } };
}
/* вкладка с панелями: cfg = { P: 's1_t1', panels: { A: { ctrl, ids, model, draw, mask, reads, cap }, … }, poe, after } */
function ocTab(K, cfg){
  const sec = layout(K), pans = Object.keys(cfg.panels);
  let pan = pans[0], inv = false;
  const S = { get pan(){ return pan; }, set pan(v){ pan = v; }, inv: false, statusSel: null };
  $('ctrl' + K).innerHTML = (pans.length > 1 ? segHTML('pn' + K, 's4_panel', pans.map(p => [p, 's4_pan_' + p]), pan) : '') +
    pans.map(p => `<div class="pctl" id="pc${K}${p}">${cfg.panels[p].ctrl()}</div>`).join('') + `<p class="small">${t('s4_ctrl_note')}</p>`;
  taskFrame(K, cfg.P);
  moreFrame(K, cfg.P, cfg.more);
  const masked = () => S.inv || S.caseHide || !!(maskOf(K) && maskOf(K).mask);
  const draw = () => { const Pn = cfg.panels[pan]; return defs(K) + (masked() ? Pn.mask(t, S) : Pn.draw(Pn.model(S), t, S)); };
  const A = ocAnim(K, { cur: () => cfg.panels[pan].model(S), plan: o => cfg.panels[pan].plan ? cfg.panels[pan].plan(o, S) : null, draw: o => cfg.panels[pan].draw(o, t, S), masked, maskDraw: () => S.caseHide ? cfg.panels[pan].mask(t, S) : cfg.panels[pan].mask(t, S) });
  window['STATIC' + K.toUpperCase()] = draw;
  function update(){
    if (!(typeof POE !== 'undefined' && POE.on)) { S.inv = false; S.statusSel = null; S.after = null; S.bare = false; S.which = null; S.hl = 0; S.noconf = false; }
    pans.forEach(p => { const e = $('pc' + K + p); if (e) e.hidden = p !== pan; });
    if ($('pn' + K)) segSet('pn' + K, pan);
    const Pn = cfg.panels[pan];
    if (Pn.render) Pn.render(S);
    A.sync();
    if (masked()){ baseReads(K, `<p class="small">${t('s4_rd_mask')}</p>`); setCap(K, cfg.P + '_cap_mask'); mstripSet(K, t('ms_head'), []); }
    else {

      mstripSet(K, t('ms_head'), (typeof POE !== 'undefined' && POE.on && cur === K && !POE.shown) ? [] : R.slice(0, 2).map(([k, v]) => [k, v]));   /* С2 (агент И3–И4): до ответа строка показаний под схемой (телефон) пуста — T-UI-1 */
      setCap(K, Pn.cap(o, S));

  const upd = () => { A.hold(); update(); };   /* смена условия — кадр «до начала» и пауза для прогноза */
  if ($('pn' + K)) wire(['pn' + K], () => { pan = segVal('pn' + K); update(); });
  pans.forEach(p => { const Pn = cfg.panels[p]; if (Pn.wire) Pn.wire(upd, S); else if (Pn.ids) wire(Pn.ids, upd); });
  /* шаги: после ответа — состояние apply(); если ответ — название статуса, он выделяется в «Статусе утверждения» */
  const poe = cfg.poe.map(st => Object.assign({}, st, { pre(){ if (typeof TLS !== 'undefined' && TLS[K]) TLS[K].halt(); S.inv = false; S.statusSel = null; S.after = null; S.bare = false; S.which = null; S.noconf = false; if (st.pre) st.pre(S); }, apply(){ S.inv = false; A.arm(); if (st.apply) st.apply(S);  } }));
  /* «Найти причину» (этап 1): до решения образец скрыт (veil), после — его состояние на панели случая; выход — норма */
  const caseShow = cfg.case ? c => { const on = typeof CASE !== 'undefined' && CASE.on && CASE.K === K;
    if (on) { pan = cfg.case.pan; S.caseHide = !c; cfg.case.set(S, c ? cfg.case.C.state(c) : cfg.case.C.normal); }
    else { S.caseHide = false; cfg.case.set(S, cfg.case.C.normal); }
    update(); } : null;
  SCENES[K] = { update, poe, S, caseShow, tick: A.tl.tick, A, set: (p) => { pan = p; }, redraw: () => A.tl.redraw() };

}

  const title = (s, x = 12, y = 16) => T(x, y, s, { a: 'l', size: 14, w: 700, col: C.muted });
  const panel = (x, y, s) => T(x, y, s, { a: 'l', size: 15, w: 800, col: C.ink });   /* буква панели: А, Б, В */
  function line(x1, y1, x2, y2, col, w = 2, extra = '') { return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`; }
  function arrow(x1, y1, x2, y2, col = C.ink, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8 + w;
    const p1 = [x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)], p2 = [x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)];
    return line(x1, y1, x2 - Math.cos(a) * s * .6, y2 - Math.sin(a) * s * .6, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* дуговая стрелка (цикл): от (x1,y1) к (x2,y2) с изгибом k (доля длины, знак — сторона) */
  function carrow(x1, y1, x2, y2, k = .3, col = C.ink, w = 2.2, dash = '') {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, cx = mx - dy * k, cy = my + dx * k;
    const a = Math.atan2(y2 - cy, x2 - cx), s = 8 + w;
    const p1 = [x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)], p2 = [x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)];
    const ex = x2 - Math.cos(a) * s * .6, ey = y2 - Math.sin(a) * s * .6;
    return `<path d="M${f(x1)},${f(y1)} Q${f(cx)},${f(cy)} ${f(ex)},${f(ey)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  function larrow(x1, y1, x2, y2, label, col = C.ink, o = {}) {
    return arrow(x1, y1, x2, y2, col, o.w || 2.4, o.dash || '') + (label ? T((x1 + x2) / 2 + (o.dx || 0), (y1 + y2) / 2 + (o.dy == null ? -12 : o.dy), label, { size: o.size || 12, w: 600, col, bg: true, n: o.n }) : '');
  }
  const cross = (x, y, r = 9) => `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`;
  /* плашка «откроется после ответа» на месте скрытого результата */
  function waitBox(x, y, w, h, label) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="8" fill="#EEF1F4" stroke="${C.line}" stroke-dasharray="5 4"/>` + (label ? T(x + w / 2, y + h / 2, label, { size: 11.5, col: C.muted, it: true, n: Math.max(12, Math.floor(w / 7)), vc: true }) : '');
  }
  /* метка-плашка (например, «следствие модели»): текст в рамке */
  function tag(x, y, s, col = C.warn, o = {}) {
    const sz = o.size || 11.5, wd = String(s).length * sz * .58 + 14;
    return `<rect x="${f(x - wd / 2)}" y="${f(y - sz)}" width="${f(wd)}" height="${f(sz * 2)}" rx="${f(sz)}" fill="#fff" stroke="${col}" stroke-width="1.4"/>` + T(x, y, s, { size: sz, w: 700, col });
  }
  /* строка показаний под схемой: [[название, значение, хорошо?], …] — текст + цвет */
  function readout(x, y, rows, o = {}) {
    const lh = o.lh || 18; let s = '';
    rows.forEach(([k, v, good], i) => { s += T(x, y + i * lh, k + ':', { a: 'l', size: o.size || 11.5, w: 600, col: C.muted }) + T(x + (o.kw || 150), y + i * lh, v, { a: 'l', size: o.size || 11.5, w: 700, col: good == null ? C.ink : good ? C.ok : C.bad }); });
    return s;
  }

  /* ---------- стороны мембраны: просвет / снаружи — сверху, цитозоль — снизу (10, разд. 0) */
  function sides(y, o = {}) {
    const x0 = o.x0 || 0, x1 = o.x1 || 600, top = o.top == null ? 26 : o.top, bot = o.bot || 420;   /* интеграция: top: 0 допустим (агенты t1, t3) */
    let s = `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${f(y - top)}" fill="${C.lumen}"/>` + `<rect x="${x0}" y="${f(y)}" width="${x1 - x0}" height="${f(bot - y)}" fill="${C.cyto}"/>`;
    if (o.up) s += G(o.gUp || 'lumen', T(x0 + 10, top + 14, o.up, { a: 'l', size: 12, w: 700, col: '#3E6A9A', it: true }));
    if (o.down) s += G(o.gDown || 'cyto', T(x0 + 10, bot - 14, o.down, { a: 'l', size: 12, w: 700, col: '#8A7344', it: true }));
    return s;
  }
  /* горизонтальная мембрана (бислой BF) на уровне y с разрывами gaps = [[xa, xb], …] (места белков, проходящих мембрану) */
  function memH(x0, x1, y, gaps = [], g = 'er_mem') {
    const seg = []; let a = x0;
    gaps.slice().sort((p, q) => p[0] - q[0]).forEach(([ga, gb]) => { if (ga > a) seg.push([a, ga]); a = Math.max(a, gb); });
    if (a < x1) seg.push([a, x1]);
    return G(g, seg.map(([p, q]) => BF.bilayerPts([[p, y], [q, y]])).join(''));
  }
  const MH = BF.MEM.h;   /* толщина бислоя */
  /* замкнутый компартмент из бислоя по точкам (носитель, цистерна, эндосома) с заливкой просвета */
  function closedMem(pts, fill = C.lumen, g = null) {
    const d = 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' Z';
    return G(g, `<path d="${d}" fill="${fill}"/>` + BF.bilayerPts(pts, { closed: true }));
  }
  const roundRectPts = (x, y, w, h, r, n = 8) => {
    const P = [], arc = (cx, cy, a0) => { for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; P.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
    arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI); return P;
  };
  const circlePts = (cx, cy, R, n = 48) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  /* носитель (транспортный пузырёк) из бислоя; coat — 'copii' | 'copi' | 'clath' | null — оболочка снаружи (цитозольная сторона) */
  function carrier(cx, cy, R = 18, coat = null, inner = '', g = 'carrier') {
    let s = closedMem(circlePts(cx, cy, R), C.lumen) + inner;
    /* интеграция (агенты t2, t3, a34): BF.coatRing сам отступает от бислоя — радиус носителя R без добавки; группа справки ретромера — retromer */
    if (coat) s += G(coat === 'retro' ? 'retromer' : coat, BF.coatRing(cx, cy, R, C[coat] || coat, Math.max(10, Math.round(R * .7))));
    return G(g, s);
  }

  /* ---------- синтез: рибосома, мРНК, цепь (вкладка 1) */
  /* рибосома: большая субъединица сверху (выход туннеля — к мембране), малая снизу на мРНК; возвращает точку выхода туннеля */
  function ribosome(cx, cy, k = 1, o = {}) {
    const s = `<ellipse cx="${f(cx)}" cy="${f(cy - 13 * k)}" rx="${f(30 * k)}" ry="${f(19 * k)}" fill="${C.riboL}"/>` +
      `<ellipse cx="${f(cx)}" cy="${f(cy + 12 * k)}" rx="${f(23 * k)}" ry="${f(11 * k)}" fill="${C.riboS}"/>` +
      (o.slow ? `<circle cx="${f(cx + 26 * k)}" cy="${f(cy - 26 * k)}" r="${f(7 * k)}" fill="#fff" stroke="${C.warn}" stroke-width="1.6"/>` + line(cx + 26 * k, cy - 30 * k, cx + 26 * k, cy - 26 * k, C.warn, 1.6) + line(cx + 26 * k, cy - 26 * k, cx + 29 * k, cy - 24 * k, C.warn, 1.6) : '');
    return { s: G(o.g || 'ribo', s), x: cx, y: cy - 32 * k, mrnaY: cy + 22 * k };
  }
  /* мРНК: горизонтальная линия с засечками */
  function mrna(x0, x1, y, g = 'mrna') {
    let s = line(x0, y, x1, y, C.mrna, 3.2);
    for (let x = x0 + 6; x < x1; x += 10) s += line(x, y, x, y + 5, C.mrna, 1.6);
    return G(g, s);
  }
  /* растущая цепь по точкам pts (от рибосомы к N-концу); o.sig — доля длины у N-конца, закрашенная как сигнал (0 — нет);
     o.sigG — группа справки сигнала; o.wave — амплитуда волны (0 — прямая); o.col — цвет; o.dash — штрих (белок вне пути) */
  function chain(pts, o = {}) {
    const amp = o.wave == null ? 3.2 : o.wave, wl = 14, col = o.col || C.chain, w = o.w || 3.2;
    const seg = []; let L = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
    const at = l => { let i = 0; while (i < seg.length - 1 && l > seg[i]) { l -= seg[i]; i++; } const u = seg[i] ? Math.min(1, l / seg[i]) : 0, a = pts[i], b = pts[i + 1]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, (b[0] - a[0]) / (seg[i] || 1), (b[1] - a[1]) / (seg[i] || 1)]; };
    const path = (l0, l1) => { const q = []; for (let l = l0; l <= l1 + .01; l += 1.5) { const [x, y, tx, ty] = at(Math.min(l, L)); const off = Math.sin(l / wl * 2 * Math.PI) * amp; q.push(f(x - ty * off) + ',' + f(y + tx * off)); } return 'M' + q.join(' L'); };
    const P = (d, c) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
    const ls = L * (1 - (o.sig || 0));
    let s = G(o.g || 'chain', P(path(0, ls), col));
    if (o.sig) s += G(o.sigG || 'sig', P(path(ls, L), C.sig));
    return s;
  }
  /* SRP: частица с гидрофобным карманом (зелёная), k — масштаб */
  const srp = (cx, cy, k = 1, g = 'srp') => G(g, `<path d="M${f(cx - 26 * k)},${f(cy + 6 * k)} C${f(cx - 26 * k)},${f(cy - 15 * k)} ${f(cx - 6 * k)},${f(cy - 17 * k)} ${f(cx)},${f(cy - 5 * k)} C${f(cx + 6 * k)},${f(cy - 17 * k)} ${f(cx + 26 * k)},${f(cy - 15 * k)} ${f(cx + 26 * k)},${f(cy + 6 * k)} C${f(cx + 17 * k)},${f(cy + 15 * k)} ${f(cx - 17 * k)},${f(cy + 15 * k)} ${f(cx - 26 * k)},${f(cy + 6 * k)} Z" fill="${C.srp}" stroke="#1B5E3A" stroke-width="1"/>`);
  /* рецептор SRP: две цепи в мембране (y — середина бислоя), головка в цитозоле (снизу) */
  const srpR = (x, y, g = 'srpr') => G(g, `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 2)}" width="12" height="${f(MH + 4)}" rx="3" fill="${C.srpr}"/>` +
    `<path d="M${f(x - 16)},${f(y + MH / 2 + 4)} Q${f(x)},${f(y + MH / 2 + 22)} ${f(x + 16)},${f(y + MH / 2 + 4)}" fill="none" stroke="${C.srpr}" stroke-width="6" stroke-linecap="round"/>`);
  /* транслокон Sec61: две половины поперёк мембраны (y — середина бислоя); o.open — канал открыт; o.plug — пробка закрывает канал
     (со стороны просвета); o.gate — латеральные ворота приоткрыты (сигнал уходит в бислой справа); o.off — звено выключено */
  function sec61(x, y, o = {}) {
    const gap = o.open ? 12 : 4, w = 13, h = MH + 14, y0 = y - h / 2, col = o.off ? C.grey : C.sec61;
    let s = `<rect x="${f(x - gap / 2 - w)}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>` +
      `<rect x="${f(x + gap / 2 + (o.gate ? 4 : 0))}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>`;
    if (o.plug) s += G('plug', `<rect x="${f(x - gap / 2 - 2)}" y="${f(y0 + 1)}" width="${f(gap + 4)}" height="7" rx="3" fill="${C.plug}" stroke="${col}" stroke-width="1"/>`);
    return G('sec61', s) + (o.off ? cross(x, y0 - 12, 7) : '');
  }
  /* сигнальная пептидаза: белок мембраны с активным центром со стороны просвета (сверху); o.off — нет фермента (штрих) */
  function spase(x, y, o = {}) {
    if (o.off) return G('spase', `<rect x="${f(x - 7)}" y="${f(y - MH / 2 - 14)}" width="14" height="${f(MH + 14)}" rx="4" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>`) + cross(x, y - MH / 2 - 20, 6);
    return G('spase', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 4)}" width="12" height="${f(MH + 8)}" rx="3" fill="${C.spase}"/>` +
      `<path d="M${f(x - 9)},${f(y - MH / 2 - 16)} L${f(x)},${f(y - MH / 2 - 6)} L${f(x + 9)},${f(y - MH / 2 - 16)}" fill="none" stroke="${C.spase}" stroke-width="3.2" stroke-linecap="round"/>`);
  }

  /* ---------- гликаны и метка (условные знаки, без формул) */
  const sq = (x, y, u, c = C.glcnac) => `<rect x="${f(x - u / 2)}" y="${f(y - u / 2)}" width="${f(u)}" height="${f(u)}" fill="${c}"/>`;
  const ci = (x, y, u, c = C.man) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u / 2)}" fill="${c}"/>`;
  const tri = (x, y, u, c = C.glc) => `<path d="M${f(x)},${f(y - u * .55)} L${f(x + u * .55)},${f(y + u * .45)} L${f(x - u * .55)},${f(y + u * .45)} Z" fill="${c}"/>`;
  const pmark = (x, y, u) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u * .62)}" fill="${C.phos}"/>` + `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(u * .85)}" font-weight="800" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">P</text>`;
  /* N-гликан на аспарагине в точке (x, y), растёт в сторону dir (−1 — вверх). o.glc — число глюкоз (0–3); o.trim — маннозы укорочены
     (сигнал к удалению); o.p — метка M6P ('P' на маннозе) | 'glcnacP' — промежуточная (GlcNAc-P на маннозе); o.complex — сложный
     (аппарат Гольджи: концевые ветви другими знаками); u — размер знака */
  function glycan(x, y, dir = -1, o = {}, g = 'glycan') {
    const u = o.u || 7, st = u * 1.35, Y = i => y + dir * st * i;
    let s = line(x, y, x, Y(3), '#555', 1.4) + line(x, Y(3), x - st, Y(4), '#555', 1.4) + line(x, Y(3), x + st, Y(4), '#555', 1.4);
    s += sq(x, Y(1), u) + sq(x, Y(2), u) + ci(x, Y(3), u);
    if (o.complex) { s += sq(x - st, Y(4), u, '#6B8E23') + sq(x + st, Y(4), u, '#6B8E23') + ci(x - st, Y(5), u * .9, '#E8B4C8') + ci(x + st, Y(5), u * .9, '#E8B4C8'); return G(g, s); }
    s += ci(x - st, Y(4), u) + ci(x + st, Y(4), u);
    if (!o.trim) { s += line(x - st, Y(4), x - st, Y(5), '#555', 1.2) + ci(x - st, Y(5), u); }
    for (let i = 0; i < (o.glc || 0); i++) s += tri(x - st, Y(6 + i), u);
    if (o.p) {
      const px = x + st + u * .9, py = Y(4) + dir * u * .5;
      s += line(x + st, Y(4), px, py, '#555', 1.2);
      if (o.p === 'glcnacP') s += sq(px + u * 1.1, py + dir * u * .5, u * .9) + G('m6p', pmark(px, py, u)); else s += G('m6p', pmark(px, py, u));
    }
    return G(g, s);
  }

  /* ---------- шапероны, контроль качества, удаление */
  const bip = (x, y, k = 1, g = 'bip') => G(g, `<path d="M${f(x - 12 * k)},${f(y - 9 * k)} A13,13 0 1 0 ${f(x + 12 * k)},${f(y - 9 * k)}" fill="none" stroke="${C.chap}" stroke-width="${f(6 * k)}" stroke-linecap="round"/>`);
  const pdi = (x, y, g = 'pdi') => G(g, `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7" fill="${C.pdi}"/>`);   /* интеграция (агент t2): без текста 7,5 px — подпись PDI ставит сцена */
  /* калнексин: белок мембраны ЭПР (y — середина бислоя) с лектиновой головкой в просвете (сверху) */
  const calnexin = (x, y, g = 'cnx') => G(g, `<rect x="${f(x - 4)}" y="${f(y - MH / 2 - 2)}" width="8" height="${f(MH + 4)}" rx="3" fill="${C.chap}"/>` +
    line(x, y - MH / 2 - 2, x, y - MH / 2 - 16, C.chap, 3) + `<path d="M${f(x - 14)},${f(y - MH / 2 - 16)} A14,10 0 0 1 ${f(x + 14)},${f(y - MH / 2 - 16)} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
  /* убиквитин: цепочка из n малых кружков */
  const ub = (x, y, n = 4, dx = 7, g = 'ub') => G(g, Array.from({ length: n }, (_, i) => `<circle cx="${f(x + i * dx)}" cy="${f(y - (i % 2) * 3)}" r="3.4" fill="${C.ub}"/>`).join(''));
  /* протеасома: бочонок в цитозоле */
  const proteasome = (x, y, g = 'prot') => G(g, [0, 1, 2, 3].map(i => `<rect x="${f(x - 16)}" y="${f(y - 20 + i * 10)}" width="32" height="9" rx="4" fill="${i % 3 ? C.protL : C.prot}"/>`).join(''));
  /* канал удаления (ERAD) в мембране ЭПР */
  const eradCh = (x, y, g = 'erad_ch') => G(g, `<rect x="${f(x - 14)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/><rect x="${f(x + 4)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/>`);

  /* ---------- мембранные белки (в бислое) */
  /* однопроходный белок: трансмембранный сегмент в бислое (y — середина), N-домен (глобула) с одной стороны, C-хвост с другой.
     o.inv — обратная ориентация (N-домен в цитозоле, A4); o.col; o.dom — размер домена; o.lig — связан лиганд; o.bad — участок связывания
     не сформирован (штриховой контур); o.glyc — гликан на N-домене; возвращает и точку N-домена */
  function tmProt(x, y, o = {}) {
    const up = o.inv ? 1 : -1, col = o.col || C.ldlr, r = o.dom || 13, ny = y + up * (MH / 2 + 8 + r);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>`;
    s += line(x, y + up * (MH / 2 + 2), x, ny - up * r, col, 3);
    s += `<circle cx="${f(x)}" cy="${f(ny)}" r="${r}" fill="${o.bad ? '#fff' : col}" stroke="${col}" stroke-width="2"${o.bad ? ' stroke-dasharray="4 3"' : ''}/>`;
    const tailEnd = y - up * (MH / 2 + 18);
    s += `<path d="M${f(x)},${f(y - up * (MH / 2 + 2))} Q${f(x + 8)},${f((y - up * (MH / 2) + tailEnd) / 2)} ${f(x + 2)},${f(tailEnd)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;
    if (o.glyc) s += glycan(x + r - 2, ny + up * (r - 2), up, { u: 5 });
    if (o.lig) s += G('ligand', `<path d="M${f(x - 8)},${f(ny + up * (r + 2))} L${f(x)},${f(ny + up * (r + 14))} L${f(x + 8)},${f(ny + up * (r + 2))} Z" fill="${C.lig}"/>`);
    return { s: G(o.g || 'tm', s), nx: x, ny };
  }
  /* рецептор M6P: белок мембраны (y — середина) с карманом связывания со стороны просвета (сверху; dir=-1) */
  function m6pr(x, y, dir = -1, o = {}) {
    const col = o.off ? C.grey : C.m6pr, hy = y + dir * (MH / 2 + 12);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>` +
      `<path d="M${f(x - 10)},${f(hy + dir * 6)} L${f(x - 10)},${f(hy)} Q${f(x)},${f(hy - dir * 8)} ${f(x + 10)},${f(hy)} L${f(x + 10)},${f(hy + dir * 6)}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
    return G('m6pr', s) + (o.off ? cross(x, hy + dir * 12, 6) : '');
  }
  /* гидролаза (растворимый груз): глобула; o.tag — метка M6P (знак «P»); o.free — без рецептора */
  const hydrolase = (x, y, o = {}) => G(o.g || 'hydro', `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 7}" fill="${C.hydro}" stroke="#6E3554" stroke-width="1"/>` + (o.tag ? pmark(x + (o.r || 7) + 3, y - (o.r || 7) + 1, 6) : ''));
  /* растворимый секретируемый белок (глобула; цвет по грузу) */
  const solProt = (x, y, col = C.sec, r = 6, g = 'cargo') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}" stroke="#2B5D88" stroke-width=".8"/>`);

  /* ---------- аппарат Гольджи: стопка цистерн (просвет — внутри; цис — снизу слева, транс — справа сверху задаёт сцена) */
  function cisterna(cx, cy, w, h = 16, fill = C.lumen /* С-13 */, g = 'cist') { return closedMem(roundRectPts(cx - w / 2, cy - h / 2, w, h, h / 2 - .5), fill, g); }

  /* шкала столбцов (модели A2, A3): ось, деления и подписи; возвращает функцию высоты */
  function axes(x, y, w, h, vmax, ticks, lab) {
    let s = line(x, y, x, y - h, C.muted, 1.4) + line(x, y, x + w, y, C.muted, 1.4);
    ticks.forEach(v => { const yy = y - h * v / vmax; s += line(x - 4, yy, x, yy, C.muted, 1.2) + T(x - 7, yy, String(v), { a: 'r', size: 10.5, col: C.muted }); });
    if (lab) s += T(x - 4, y - h - 14, lab, { a: 'l', size: 11, col: C.muted, w: 600 });
    return { s, H: v => h * v / vmax };
  }
  const num = (x, d = 1) => { const v = +x; return (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v).toFixed(0) : v.toFixed(d)).replace('.', ',').replace('-', '−'); };

  return { C, f, G, esc, T, TN, wrap, title, panel, line, arrow, carrow, larrow, cross, waitBox, tag, readout, sides, memH, MH, closedMem, roundRectPts, circlePts, carrier,
    ribosome, mrna, chain, srp, srpR, sec61, spase, sq, ci, tri, pmark, glycan, bip, pdi, calnexin, ub, proteasome, eradCh, tmProt, m6pr, hydrolase, solProt, cisterna, axes, num,
    setPick: v => { PICK = !!v; }, get pick() { return PICK; } };
})();

/* =====================================================================
   s5_a0.js — общие помощники продвинутого уровня семинара 4 (03, вводная часть; 07, разд. 5) для исследований И1–И4.
   API (описание — tools_s2/решения_a12.md, разд. «API s5_a0.js»):
     advBase(K, P)        — блок «Новая опора» (P_new) над «Задачей» и заметка s2_adv_note под переключателями (03, вводная часть);
     advMore(P, card)     — блоки под показаниями для ocTab({ more }): «Правила модели» (P_rules), «Научное объяснение» (P_expl; заголовок — a_expl_t),
                            «Новые данные» (P_data[, P_data2]), «Как это установили» (P_how [+ карточка метода card: ключи card, card_items]),
                            «Чего модель не показывает» (P_limits); блок без текста не выводится;
     advWait(K)           — true, пока в шаге сценария на сцене K ответ не дан (07, 4.0: показания и таблицы исходов скрыты);
     advHalt(K)           — остановить идущую анимацию сцены K (смена шага; иначе мелькает кадр результата);
     advStep(K, key, pre, apply) — шаг сценария сцены K с метаданными документа (ocStep) и остановкой анимации перед pre;
                            ключ шага-ссылки 03 («Шаг 4 — обратная задача») переводится через OCALIAS;
     advSeg(id, label, pairs, v) — переключатель segHTML, pairs — [[значение, ключ подписи], …].
   В практикуме нет пометки «сверх программы», фамилий и годов (03, вводная часть).
   ===================================================================== */
function advBase(K, P){
  const tk = $('task' + K), paras = String(t(P + '_new')).split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');
  tk.insertAdjacentHTML('beforebegin', `<div class="panel aprob anew" id="new${K}"><b class="k">${t('a_base_t')}</b>${paras}</div>`);
  $('ctrl' + K).insertAdjacentHTML('beforeend', `<p class="small">${t('s4_adv_note')}</p>`);
}
function advMore(P, card){
  const has = k => k in TEXTS && TEXTS[k];
  const M = [['b_rules_t', P + '_rules'], ['a_expl_t', P + '_expl'], ['b_new_t', () => [P + '_data', P + '_data2'].filter(has).map(k => `<p>${t(k)}</p>`).join('')]];
  M.push(['b_how_t', () => (has(P + '_how') ? `<p>${t(P + '_how')}</p>` : '') + (card && has(card) ? `<p><b>${t(card)}</b></p>` + listHTML(t(card + '_items')) : '')]);
  M.push(['b_lim_t', P + '_limits']);
  return M;
}
const advWait = K => typeof POE !== 'undefined' && POE.on && cur === K && !POE.shown;
function advHalt(K){ if (typeof TLS !== 'undefined' && TLS[K]) TLS[K].halt(); }
function advStep(K, key, pre, apply){
  const k = (typeof OCALIAS !== 'undefined' && OCALIAS[key]) || key;
  return ocStep(k, { pre(S){ advHalt(K); S.after = null; if (pre) pre(S); }, apply(S){ S.after = null; if (apply) apply(S); } });
}
const advSeg = (id, label, pairs, v) => segHTML(id, label, pairs, v);

   продвинутом уровне (s7_a*.js). Главная идея (02: tK_idea) — в блоке «Вывод»: ядро скрывает его в сценарии до ответа

function caseLink(K, n){

/* шаги сценария со своей шкалой (stg): plan по списку состояний (07, разд. 5; 12) */
function planSt(o, keys, stgs, stop, stopKey, halt){
  return { init: Object.assign({}, o, { stg: 0 }), keys, stop, stopKey: stopKey || null, halt: !!halt, st: stgs.slice(0, stop).map(g => Object.assign({}, o, { stg: g })) };

/* «Научное объяснение» вкладки: объяснения отвеченных шагов (02: tK_sN_e) — не раскрывает ответы заранее */

}
function explWire(K, T){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments); explBox(K, T); return r; }; const _u = T.update; T.update = function(){ _u(); explBox(K, T); }; }

  const ubChain = (x, y, n = 4, g = 'ub_chain') => G(g, line(x, y, x + (n - 1) * 8, y - 6, C.ub, 1.6) + Array.from({ length: n }, (_, i) => circ(x + i * 8, y - i * 2, 3.6, C.ub)).join(''));

  if (window.FIN4 && $('fin')) ['4b', '4a'].forEach(K => { CASES[K] = { go(){ const e = $('finCase') || $('fin'); if (!e) return;
    try { e.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (_) { e.scrollIntoView(); }
    e.setAttribute('tabindex', '-1'); setTimeout(() => { try { e.focus({ preventScroll: true }); } catch (_) {} }, 350); } }; });
  let cb = $('caseBtn');
  if (!cb) { $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`); cb = $('caseBtn'); }
  const cbOrig = cb.onclick;
  cb.onclick = e => { const c = CASES[cur]; if (c) return c.go(); if (cbOrig) return cbOrig.call(cb, e); };
  const caseSync = () => { const c = CASES[cur];
    if (c) { cb.hidden = false; if (c.title) cb.title = c.title; else cb.removeAttribute('title'); }
    else { if (!cbOrig) cb.hidden = true; cb.removeAttribute('title'); } };
  const _show = show; show = function(){ const r = _show.apply(this, arguments); caseSync(); Object.keys(SCENES).forEach(cmpSync); if (typeof fitStage === 'function') fitStage(); return r; };   /* кнопка в строке вопроса может перенести строку: место под схему пересчитывается */
  /* условия вкладки (tK_cond) — в первом экране сценария базового уровня, до ответа */
  const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments);
    if (POE.on && POE.i === 0 && base(cur)) { const k = 't' + qn + '_cond', box = $('poe' + cur);
      if (box && has(k) && !box.querySelector('.tcond')) { const h = box.querySelector('.k'); if (h) h.insertAdjacentHTML('afterend', `<p class="small pcond tcond"><b>${t('b_cond_t')}</b> ${t(k)}</p>`); } }
    return r; };
  /* окно «О модели»: статус и «Чего модель не показывает» текущей вкладки и уровня; правил и методов в практикуме С4–С6 нет */
  function modelInfo(){
    return { status: [t(base(cur) ? 'lg_model' : (has('a_model_note') ? 'a_model_note' : 's4_adv_note'))], rules: [], limits: LIM[cur] || [], how: [] };
  }
  function renderModelDlg() {
    const I = modelInfo() || {}, sec = (h, a) => (a && a.length) ? `<h4>${h}</h4>` + a.map(x => /^\s*<(ul|ol|p|div)/.test(x) ? x : `<p>${x}</p>`).join('') : '';
    $('modelBody').innerHTML = (I.status || []).map(x => `<p class="model-status">${x}</p>`).join('') +
      sec(TEXTS.model_rules, I.rules) + sec(TEXTS.model_limits, I.limits) + sec(TEXTS.model_how, I.how);
  }
  $('modelBtn').onclick = () => { renderModelDlg(); try { $('modelDlg').showModal(); } catch(e){ $('modelDlg').setAttribute('open', ''); } $('modelDlg').scrollTop = 0; };   /* окно открывается с начала */
  $('modelClose').onclick = () => { try { $('modelDlg').close(); } catch(e){ $('modelDlg').removeAttribute('open'); } };
  return { LIM, modelInfo, caseSync, cmpSync };
})();
