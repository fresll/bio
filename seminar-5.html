, агрегат и бактерия. Все три помечены убиквитином", "t1_s1_q": "Как будет разрушен каждый объект?", "t1_s1_o1": "Фермент — протеасомой, агрегат и бактерия — в лизосоме", "t1_s1_x1": "Да: протеасома принимает отдельную развёрнутую цепь; агрегат и бактерию окружает мембрана фагофора, и они разрушаются в лизосоме", "t1_s1_o2": "Все три — протеасомой: на всех есть убиквитин", "t1_s1_x2": "Убиквитин есть на всех, но в узкий канал протеасомы проходит только отдельная развёрнутая цепь", "t1_s1_o3": "Все три — в лизосоме: она расщепляет любые макромолекулы", "t1_s1_x3": "Отдельный меченый фермент цитозоля до лизосомы не доставляется: его разрушает протеасома", "t1_s1_h1": "Сравните размеры объектов и ширину канала протеасомы", "t1_s1_h2": "Что может окружить объект размером с бактерию?", "t1_s1_h3": "Протеасома разворачивает одну цепь; крупный объект окружает фагофор", "t1_s1_e": "Путь определяется размером и местом объекта; убиквитин — общая метка, смысл которой зависит от того, кто её узнаёт", "t1_s2_title": "Одиночный убиквитин или цепь", "t1_s2_cond": "Сравниваем объект 1 (цепь, связанная через лизин 48) и объект 2 (одиночные молекулы убиквитина на мембранном белке)", "t1_s2_q": "Где будет разрушен мембранный белок с одиночными молекулами убиквитина?", "t1_s2_o1": "В лизосоме, после эндоцитоза и эндосом", "t1_s2_x1": "Да: одиночные молекулы убиквитина на мембранном белке — сигнал эндоцитоза и сортировки во внутрипросветные пузырьки", "t1_s2_o2": "В протеасоме, как фермент с цепью", "t1_s2_x2": "В протеасому направляет цепь через Lys48; одиночные молекулы прочитываются другими белками", "t1_s2_o3": "Нигде: одной молекулы мало для любой метки", "t1_s2_x3": "Одиночная метка — тоже сигнал, но не протеасомный", "t1_s2_h1": "Чем отличаются метки двух белков?", "t1_s2_h2": "Где находится мембранный белок?", "t1_s2_h3": "Одиночный убиквитин на мембранном белке узнают белки эндоцитоза и эндосом", "t1_s2_e": "Важно не только наличие убиквитина, но и форма метки, и место белка: одна и та же молекула в разных метках ведёт разными путями", "t1_s3_title": "Почему агрегат не идёт в протеасому", "t1_s3_cond": "В клетке все звенья работают. Агрегат (объект 3) несёт убиквитин. Протеасом в клетке много", "t1_s3_q": "Почему агрегат разрушается аутофагией, а не протеасомой?", "t1_s3_o1": "Агрегат не развернуть в одну цепь", "t1_s3_x1": "Да: в канал 20S-частицы проходит одна развёрнутая цепь; агрегат из многих молекул туда не помещается", "t1_s3_o2": "На агрегате неподходящий тип убиквитина", "t1_s3_x2": "Тип метки здесь не главное: даже с цепью через Lys48 агрегат не проходит в канал", "t1_s3_o3": "Протеасома работает только в ядре", "t1_s3_x3": "Протеасомы есть и в цитозоле, и в ядре", "t1_s3_h1": "Сколько молекул в агрегате?", "t1_s3_h2": "Что делает 19S-частица перед тем, как белок войдёт в канал?", "t1_s3_h3": "Развернуть и протянуть можно только отдельную цепь", "t1_s3_e": "Метка необходима для узнавания, но не достаточна для разрушения в протеасоме: нужен ещё участок, с которого цепь развернётся, и размер одной молекулы", "t1_s4_title": "Голодание: отдельный белок без убиквитина", "t1_s4_cond": "Клетка сутки находится без питательных веществ. Объект 5 — растворимый белок цитозоля с мотивом KFERQ; убиквитина на нём нет", "t1_s4_q": "Каким путём этот белок попадёт в лизосому?", "t1_s4_o1": "Через мембрану лизосомы, с шапероном HSC70 и LAMP2A", "t1_s4_x1": "Да: это шаперон-опосредованная аутофагия; белок развёртывается и переходит через мембрану по одной молекуле", "t1_s4_o2": "В аутофагосоме вместе с участком цитоплазмы", "t1_s4_x2": "Так белок тоже может попасть в лизосому, но мотив KFERQ и HSC70 указывают на шаперон-опосредованный путь", "t1_s4_o3": "Никаким: без убиквитина белок не разрушается", "t1_s4_x3": "Шаперон-опосредованной аутофагии убиквитин не нужен; метку заменяет мотив KFERQ", "t1_s4_h1": "Есть ли на белке убиквитин? Что есть вместо него?", "t1_s4_h2": "Какой шаперон узнаёт мотив KFERQ?", "t1_s4_h3": "HSC70 доставляет белок к рецептору LAMP2A", "t1_s4_e": "Убиквитин — частая, но не единственная метка: шаперон-опосредованная аутофагия узнаёт мотив в самой цепи белка", "t1_s5_title": "Протеазы протеасомы заблокированы", "t1_s5_cond": "Активные центры 20S-частицы заблокированы (так действует ингибитор протеасомы). Остальные звенья работают. Наблюдаем объекты 1 и 2 через час", "t1_s5_q": "Какой из двух объектов накопится и в какой форме?", "t1_s5_o1": "Фермент с цепью; мембранный белок разрушится", "t1_s5_x1": "Да: фермент ждёт протеасому, а мембранный белок разрушается в лизосоме", "t1_s5_o2": "Оба объекта, и оба — с убиквитином на себе", "t1_s5_x2": "Мембранный белок с одиночным убиквитином идёт в лизосому; протеасома ему не нужна", "t1_s5_o3": "Ни один: оба уйдут в лизосому", "t1_s5_x3": "Отдельный растворимый фермент с цепью в лизосому в модели не доставляется", "t1_s5_h1": "Какой путь у каждого из двух объектов?", "t1_s5_h2": "Зависит ли лизосома от протеасомы?", "t1_s5_h3": "Блокировка протеасомы останавливает только протеасомный путь", "t1_s5_e": "Форма накопленного белка указывает звено: с цепью — нарушено узнавание или расщепление в протеасоме, без цепи — мечение; белки лизосомных путей при этом не копятся", "t1_s6_title": "Гидролазы лизосомы не работают", "t1_s6_cond": "В лизосомах нет активных гидролаз; протеасома и образование аутофагосом в норме. Наблюдаем все пять объектов (объект 5 — после суток без питательных веществ)", "t1_s6_q": "Какие объекты накопятся?", "t1_s6_o1": "Все, кроме фермента с цепью, — внутри лизосом", "t1_s6_x1": "Да: четыре пути ведут в лизосому; протеасома от неё не зависит", "t1_s6_o2": "Только агрегат и бактерия, в цитозоле", "t1_s6_x2": "Аутофагосомы образуются и сливаются с лизосомой; материал копится внутри неё", "t1_s6_o3": "Все пять, в цитозоле", "t1_s6_x3": "Фермент с цепью разрушит протеасома; остальные доставлены и копятся внутри лизосом", "t1_s6_h1": "Какие из пяти путей заканчиваются в лизосоме?", "t1_s6_h2": "Нарушена доставка или расщепление?", "t1_s6_h3": "Доставка работает, значит, материал будет внутри лизосом", "t1_s6_e": "Доставка и расщепление — разные звенья: по месту накопления (цитозоль или лизосома) их можно различить", "t1_inv_cond": "Мембранные белки с одиночными молекулами убиквитина копятся нерасщеплёнными во внутрипросветных пузырьках эндолизосом. Ферменты с цепью убиквитина разрушаются как обычно", "t1_inv_q": "Какое звено нарушено?", "t1_inv_o1": "Расщепление внутри лизосом", "t1_inv_x1": "Да: белки доставлены и даже отсортированы во внутрипросветные пузырьки, но не расщеплены", "t1_inv_o2": "Мечение белков одиночным убиквитином", "t1_inv_x2": "Метка на накопленных белках есть", "t1_inv_o3": "Узнавание цепи протеасомой", "t1_inv_x3": "Ферменты с цепью разрушаются; кроме того, этот путь к протеасоме не ведёт", "t1_inv_e": "Место накопления (внутри лизосомного компартмента) и наличие метки указывают на этап после доставки", "t1_lim": "Пути показаны раздельно; в клетке некоторые белки разрушаются двумя путями, и один путь частично берёт на себя нагрузку другого (продвинутый уровень A1). Белки без убиквитина тоже могут разрушаться протеасомой с участием особых белков-посредников (Объяснения, <a href=\"seminar-5-route.html#ubiquitin-free\" target=\"_blank\" rel=\"noopener\">«Всегда ли для протеасомы нужна цепь убиквитина?»</a>)", "t2_title": "Лизосома: доставка, кислая среда и защита клетки", "t2_idea": "Лизосома расщепляет макромолекулы кислыми гидролазами. Чтобы расщепление шло, нужны три условия: материал доставлен, в просвете кислая среда и гидролазы на месте. Клетку от гидролаз защищают два независимых условия: мембрана и нейтральный pH цитозоля", "t2_why": "Если хотя бы одно условие нарушено, материал копится; по месту и форме накопленного можно определить, какое условие нарушено. На этом основано понимание лизосомных болезней накопления", "t2_problem": "Как клетка держит внутри себя ферменты, способные расщепить почти любые её молекулы, и при этом не повреждает себя?", "t2_cond": "Фибробласт человека в культуре. Наблюдаем лизосомы и цитозоль через несколько часов после изменения условий. Грузы лизосомы: белок, поглощённый эндоцитозом, и агрегат белка, доставляемый аутофагией. В шаге 2.1 — очищенная лизосомная гидролаза в двух пробирках", "t2_s1_title": "Один фермент — две пробирки", "t2_s1_cond": "Очищенную лизосомную протеазу поместили в две пробирки с одним и тем же белком-субстратом: в одной pH 5,0, в другой pH 7,2. Температура и количество фермента одинаковы", "t2_s1_q": "В какой пробирке белок будет расщепляться быстрее?", "t2_s1_o1": "При pH 5,0", "t2_s1_x1": "Да: кислые гидролазы работают лучше всего в кислой среде, как в просвете лизосомы", "t2_s1_o2": "При pH 7,2, как в цитозоле", "t2_s1_x2": "При pH цитозоля большинство кислых гидролаз работает значительно медленнее", "t2_s1_o3": "Одинаково: pH на ферменты не влияет", "t2_s1_x3": "Активность ферментов зависит от pH; у кислых гидролаз оптимум в кислой среде", "t2_s1_h1": "В какой среде этот фермент работает в клетке?", "t2_s1_h2": "Какой pH в просвете лизосомы, а какой в цитозоле?", "t2_s1_h3": "Оптимум кислых гидролаз — около pH 5", "t2_s1_e": "Кислотность — одно из двух условий защиты клетки: даже вышедшая в цитозоль гидролаза работает там медленно", "t2_s2_title": "Насос остановлен", "t2_s2_cond": "Протонный насос V-типа в мембране лизосом заблокирован; мембрана не повреждена, гидролазы на месте, доставка работает", "t2_s2_q": "Что будет с белком, поглощённым эндоцитозом, и с агрегатом?", "t2_s2_o1": "Оба доставлены, но копятся внутри лизосом", "t2_s2_x1": "Да: без насоса pH растёт, и гидролазы работают медленно", "t2_s2_o2": "Оба копятся в цитозоле", "t2_s2_x2": "Доставка не нарушена: эндоцитоз и аутофагия работают", "t2_s2_o3": "Оба расщепляются, но медленнее только агрегат", "t2_s2_x3": "Без кислой среды страдает расщепление любого груза, независимо от пути доставки", "t2_s2_h1": "Что делает насос V-типа?", "t2_s2_h2": "Нарушена доставка или расщепление?", "t2_s2_h3": "Материал попадёт внутрь, но гидролазы будут работать медленно", "t2_s2_e": "Кислая среда создаётся работой насоса и тратой АТФ; без неё гидролазы присутствуют, но расщепление почти останавливается", "t2_s3_title": "Нет метки M6P", "t2_s3_cond": "В аппарате Гольджи нет фермента, присоединяющего метку маннозо-6-фосфат к гидролазам (он работает в цис-сети). Насос работает, доставка работает", "t2_s3_q": "Что найдут в лизосомах и во внеклеточной среде?", "t2_s3_o1": "В лизосомах мало гидролаз, снаружи — много", "t2_s3_x1": "Да: без метки гидролазы не связываются с рецептором M6P и уходят к поверхности клетки", "t2_s3_o2": "Гидролазы останутся в ЭПР", "t2_s3_x2": "Метка ставится в аппарате Гольджи; без неё гидролазы уходят путём конститутивной секреции", "t2_s3_o3": "В лизосомах будет обычное количество гидролаз", "t2_s3_x3": "Метка M6P — адрес гидролаз; без неё они не доставляются в эндосомы", "t2_s3_h1": "Вспомните семинар 4: что узнаёт рецептор M6P?", "t2_s3_h2": "Куда уходит из транс-сети растворимый белок без адреса?", "t2_s3_h3": "Без адреса — к поверхности и наружу", "t2_s3_e": "Кислая среда без ферментов не расщепляет: условие «гидролазы на месте» независимо от кислотности", "t2_s4_title": "Аутофагосомы не образуются", "t2_s4_cond": "В клетке не образуются аутофагосомы. Насос, метка и гидролазы в норме", "t2_s4_q": "Где окажется агрегат и где — белок из эндоцитоза?", "t2_s4_o1": "Агрегат — в цитозоле, белок из эндоцитоза расщеплён", "t2_s4_x1": "Да: нарушена только доставка аутофагией; лизосомы работают", "t2_s4_o2": "Оба груза доставлены и копятся внутри лизосом", "t2_s4_x2": "Агрегат не доставлен, а белок из эндоцитоза расщепляется нормально", "t2_s4_o3": "Оба груза остаются нерасщеплёнными в цитозоле", "t2_s4_x3": "Эндоцитоз не зависит от аутофагосом", "t2_s4_h1": "Какой груз зависит от аутофагосомы?", "t2_s4_h2": "Работают ли сами лизосомы?", "t2_s4_h3": "Недоставленный материал остаётся там, где был", "t2_s4_e": "Недоставленный материал копится вне лизосом, нерасщеплённый — внутри: это главный признак, различающий доставку и расщепление", "t2_s5_title": "Продукты не выходят", "t2_s5_cond": "В мембране лизосом не работает переносчик аминокислот. Всё остальное в норме", "t2_s5_q": "Что будет копиться в лизосомах?", "t2_s5_o1": "Аминокислоты, а не белки", "t2_s5_x1": "Да: белки расщепляются, но продукты не выходят в цитозоль", "t2_s5_o2": "Нерасщеплённые белки", "t2_s5_x2": "Гидролазы и кислая среда в норме; белки расщепляются", "t2_s5_o3": "Ничего: аминокислоты выйдут через мембрану сами", "t2_s5_x3": "Аминокислоты — полярные молекулы и проходят мембрану лизосомы через переносчики", "t2_s5_h1": "Какой этап идёт после расщепления?", "t2_s5_h2": "Что делают переносчики мембраны лизосомы?", "t2_s5_h3": "Продукт расщепления — малая молекула", "t2_s5_e": "Форма накопленного материала (макромолекула или малая молекула) указывает, какое звено нарушено", "t2_inv_cond": "В клетке копятся агрегаты белка. Неизвестно, где именно — в цитозоле или внутри лизосом", "t2_inv_q": "Какое одно наблюдение различит «не доставлен» и «не расщеплён»?", "t2_inv_o1": "Находится ли он в просвете лизосомы", "t2_inv_x1": "Да: вне лизосом (даже внутри аутофагосомы, не слившейся с лизосомой) — нарушена доставка; в просвете лизосом — расщепление", "t2_inv_o2": "Сколько агрегата накопилось в клетке", "t2_inv_x2": "Количество одинаково возрастает при обоих нарушениях", "t2_inv_o3": "Есть ли на агрегате убиквитин", "t2_inv_x3": "Убиквитин есть при обоих нарушениях; он поставлен до доставки", "t2_inv_e": "Место накопления — решающее наблюдение", "t2_lim": "Мембрана лизосом на базовом уровне не повреждена. При остановленном насосе модель учитывает только уже доставленные гидролазы: в клетке без закисления эндосом новые гидролазы хуже отделяются от рецептора M6P. Что происходит при её повреждении и почему нейтральный pH не гарантирует полной безопасности гидролаз — продвинутый уровень A2 и Объяснения (<a href=\"seminar-5-route.html#ph-vs-damage\" target=\"_blank\" rel=\"noopener\">«Незакисленная лизосома и повреждённая мембрана: чем они различаются?»</a>, <a href=\"seminar-5-route.html#neutral-cathepsin\" target=\"_blank\" rel=\"noopener\">«Действительно ли гидролазы неактивны при нейтральном pH?»</a>)", "t3_title": "Пероксисома: H₂O₂ образуется и расходуется в одном компартменте", "t3_idea": "В пероксисоме оксидазы окисляют вещества с образованием перекиси водорода, а каталаза в том же компартменте её расходует. Белки просвета пероксисома получает из цитозоля по сигналу Ser-Lys-Leu, а новые пероксисомы образуются делением или из пузырьков ЭПР", "t3_why": "Пероксисомы разрушают жирные кислоты с очень длинной цепью, обезвреживают ряд веществ в печени и почках и начинают синтез плазмалогенов — липидов миелина. При нарушении импорта белков в пероксисомы страдают мозг, печень и почки", "t3_problem": "Как клетка проводит реакции, образующие опасный окислитель, и не допускает его накопления?", "t3_cond": "Клетка печени человека. Наблюдаем через несколько часов после изменения условий. Субстраты окисления — жирные кислоты с очень длинной цепью", "t3_s1_title": "Что образуется при окислении", "t3_s1_cond": "Оксидаза пероксисомы окисляет вещество (на схеме — RH₂, где R — остаток молекулы): отнимает два атома водорода и передаёт их на O₂", "t3_s1_q": "Какое вещество образуется из кислорода в этой реакции?", "t3_s1_o1": "Перекись водорода H₂O₂", "t3_s1_x1": "Да: RH₂ + O₂ → R + H₂O₂; затем каталаза расходует H₂O₂", "t3_s1_o2": "Вода, как в дыхательной цепи", "t3_s1_x2": "До воды кислород восстанавливает дыхательная цепь митохондрии; оксидаза пероксисомы образует H₂O₂", "t3_s1_o3": "Углекислый газ", "t3_s1_x3": "Углекислый газ — продукт других реакций; оксидаза переносит водород на кислород", "t3_s1_h1": "Сколько атомов водорода получает молекула O₂?", "t3_s1_h2": "Посмотрите на название органеллы", "t3_s1_h3": "Два атома водорода + O₂ = H₂O₂", "t3_s1_e": "Опасный продукт образуется и расходуется в одном компартменте, рядом с ферментом, который его использует", "t3_s2_title": "Достаточно ли трёх аминокислот?", "t3_s2_cond": "К C-концу белка цитозоля, который в норме в пероксисому не входит, присоединили три аминокислоты: Ser-Lys-Leu", "t3_s2_q": "Где окажется этот белок?", "t3_s2_o1": "В просвете пероксисомы", "t3_s2_x1": "Да: сигнал Ser-Lys-Leu на C-конце достаточен, чтобы направить белок в пероксисому", "t3_s2_o2": "В цитозоле: три аминокислоты ничего не меняют", "t3_s2_x2": "Эти три аминокислоты узнаёт рецептор Pex5", "t3_s2_o3": "В ЭПР", "t3_s2_x3": "Сигнал ЭПР — гидрофобный участок на N-конце; Ser-Lys-Leu на C-конце — адрес пероксисомы", "t3_s2_h1": "Вспомните семинар 4: может ли короткий сигнал изменить адрес белка?", "t3_s2_h2": "Какой белок узнаёт сигнал на C-конце?", "t3_s2_h3": "Pex5 узнаёт Ser-Lys-Leu", "t3_s2_e": "Как и у ЭПР, адрес записан в самой цепи; но сигнал пероксисомы другой, и белок входит уже свёрнутым", "t3_s3_title": "Нет Pex5", "t3_s3_cond": "В клетке нет рецептора Pex5. Мембраны пероксисом образуются как обычно", "t3_s3_q": "Где окажутся оксидазы и каталаза и что будет с жирными кислотами?", "t3_s3_o1": "Ферменты в цитозоле, жирные кислоты копятся", "t3_s3_x1": "Да: без Pex5 белки просвета не импортируются; пероксисомы «пусты»", "t3_s3_o2": "Ферменты в пероксисомах, всё в норме", "t3_s3_x2": "Без рецептора белки с сигналом Ser-Lys-Leu не входят в пероксисому", "t3_s3_o3": "Пероксисом не будет совсем", "t3_s3_x3": "Мембраны пероксисом образуются; не хватает белков их просвета", "t3_s3_h1": "Что делает Pex5?", "t3_s3_h2": "Где синтезируются белки пероксисомы?", "t3_s3_h3": "Без Pex5 они остаются там, где синтезированы", "t3_s3_e": "Работа пероксисомы зависит от импорта: компартмент без своих ферментов не выполняет функцию. Так нарушается работа клеток при синдроме Цельвегера", "t3_s4_title": "Окисление усилено", "t3_s4_cond": "Клетка получает больше жирных кислот с очень длинной цепью, и оксидазы пероксисом работают быстрее. Каталаза на месте, её количество прежнее", "t3_s4_q": "Что изменится?", "t3_s4_o1": "H₂O₂ станет больше, часть выйдет в цитозоль", "t3_s4_x1": "Да: образование выросло, а расход не увеличился в той же мере", "t3_s4_o2": "Ничего: каталаза разложит любую H₂O₂", "t3_s4_x2": "Количество каталазы прежнее; накопление зависит от соотношения образования и расхода", "t3_s4_o3": "Импорт белков в пероксисому прекратится", "t3_s4_x3": "Импорт не зависит от скорости окисления", "t3_s4_h1": "Что увеличилось — образование или расход H₂O₂?", "t3_s4_h2": "Изменилось ли количество каталазы?", "t3_s4_h3": "Если образование растёт быстрее расхода, H₂O₂ копится", "t3_s4_e": "Изоляция опасного продукта — соотношение образования и удаления, а не непроницаемая стенка: H₂O₂ может выходить через мембрану", "t3_s5_title": "Откуда новые пероксисомы", "t3_s5_cond": "В клетках печени после изменения питания число пероксисом увеличивается", "t3_s5_q": "Откуда возьмутся новые пероксисомы?", "t3_s5_o1": "Делением существующих и из пузырьков ЭПР", "t3_s5_x1": "Да: пузырьки-предшественники с Pex3 отпочковываются от ЭПР и сливаются друг с другом или с пероксисомами", "t3_s5_o2": "Только из лизосом", "t3_s5_x2": "Лизосомы разрушают пероксисомы, но не образуют их", "t3_s5_o3": "Синтезируются заново на рибосомах целиком", "t3_s5_x3": "На рибосомах синтезируются белки; мембрана растёт из уже существующей мембраны", "t3_s5_h1": "Из чего растёт любая новая мембрана?", "t3_s5_h2": "Какие два источника мембраны есть у пероксисомы?", "t3_s5_h3": "Существующая пероксисома и ЭПР", "t3_s5_e": "Новая мембрана образуется только из уже существующей", "t3_s6_title": "Партнёры пероксисомы", "t3_s6_cond": "Пероксисома окислила часть жирной кислоты. Образовался ацетил-CoA", "t3_s6_q": "Куда он направится?", "t3_s6_o1": "В цитозоль, для синтеза других веществ", "t3_s6_x1": "Да: ацетильные группы выводятся из пероксисомы — в составе ацетилкарнитина или в виде ацетата — и используются в синтезе", "t3_s6_o2": "Останется в пероксисоме навсегда", "t3_s6_x2": "Продукты окисления выходят из пероксисомы", "t3_s6_o3": "В лизосому, для разрушения", "t3_s6_x3": "Ацетил-CoA — не груз лизосомы, а исходное вещество для синтеза", "t3_s6_h1": "Нужен ли ацетил-CoA другим компартментам?", "t3_s6_h2": "Есть ли в пероксисоме ферменты синтеза жирных кислот?", "t3_s6_h3": "Продукт выходит в цитозоль", "t3_s6_e": "Пероксисома работает вместе с другими органеллами: обменивается с ними веществами и мембраной", "t3_inv_cond": "В клетках печени копятся жирные кислоты с очень длинной цепью; каталаза обнаруживается в цитозоле, а не в пероксисомах", "t3_inv_q": "Какое звено нарушено вероятнее всего?", "t3_inv_o1": "Импорт белков в пероксисому", "t3_inv_x1": "Да: ферменты просвета, включая каталазу, остались в цитозоле", "t3_inv_o2": "Синтез каталазы на рибосомах", "t3_inv_x2": "Каталаза синтезирована — она найдена в цитозоле", "t3_inv_o3": "Образование H₂O₂", "t3_inv_x3": "Накопление жирных кислот и место каталазы указывают на импорт", "t3_inv_e": "Место фермента — признак, различающий нарушение импорта и нарушение синтеза фермента", "t3_lim": "Количества H₂O₂ показаны словами. Работа ферментов, оставшихся в цитозоле без импорта, в модели не учитывается. Количественное сравнение «усилено образование» и «ослаблено удаление» — продвинутый уровень A3. H₂O₂ в малых количествах участвует в передаче сигналов (Объяснения, <a href=\"seminar-5-route.html#h2o2-reach\" target=\"_blank\" rel=\"noopener\">«Остаётся ли перекись водорода пероксисомы внутри неё?»</a>); каталаза — не единственный фермент её удаления", "t4_title": "Митохондрия: протонный градиент и АТФ-синтаза", "t4_idea": "Дыхательная цепь перекачивает протоны из матрикса в межмембранное пространство; протоны возвращаются в матрикс через АТФ-синтазу, и при этом синтезируется АТФ. Утечка протонов в обход синтазы и остановка самой синтазы снижают синтез АТФ, но по-разному меняют градиент и дыхание", "t4_why": "Митохондрия производит большую часть АТФ клетки. Её мембранный потенциал нужен и для импорта белков, и как признак повреждения органеллы. Чтобы понять, почему снизился синтез АТФ, нужно измерять не только его", "t4_problem": "Как энергия окисления питательных веществ превращается в энергию АТФ и почему эти процессы можно разъединить?", "t4_cond": "Митохондрии клеток сердечной мышцы мыши (выделенные). Субстрат окисления и кислород в избытке, если не сказано иное. Наблюдаем через несколько минут после изменения условий", "t4_s1_title": "Куда перекачиваются протоны", "t4_s1_cond": "Дыхательная цепь работает. Сравниваем межмембранное пространство и матрикс", "t4_s1_q": "Где после работы цепи больше протонов и какой заряд у матрикса?", "t4_s1_o1": "Больше снаружи; матрикс заряжен отрицательно", "t4_s1_x1": "Да: протоны перекачиваются из матрикса; матрикс становится щелочнее и отрицательнее", "t4_s1_o2": "Больше в матриксе; матрикс положителен", "t4_s1_x2": "Цепь выкачивает протоны из матрикса, а не накачивает", "t4_s1_o3": "Поровну: цепь только переносит электроны", "t4_s1_x3": "Перенос электронов сопряжён с перекачкой протонов через мембрану", "t4_s1_h1": "В какую сторону направлены стрелки протонов у комплексов цепи?", "t4_s1_h2": "Что теряет матрикс, если из него уходят положительные ионы?", "t4_s1_h3": "Протоны уходят — остаётся отрицательный заряд", "t4_s1_e": "Градиент состоит из двух вкладов — разности pH и мембранного потенциала; главный вклад — потенциал", "t4_s2_title": "Чем движется АТФ-синтаза", "t4_s2_cond": "Градиент создан. АТФ-синтаза работает, АДФ и фосфат есть", "t4_s2_q": "Что приводит в действие синтез АТФ?", "t4_s2_o1": "Поток протонов в матрикс через синтазу", "t4_s2_x1": "Да: энергия градиента превращается в энергию связи АТФ", "t4_s2_o2": "Поток электронов прямо через синтазу", "t4_s2_x2": "Электроны проходят дыхательную цепь; через синтазу идут протоны", "t4_s2_o3": "Гидролиз АТФ в матриксе", "t4_s2_x3": "Гидролиз АТФ — обратная работа синтазы; при синтезе энергия приходит от градиента", "t4_s2_h1": "Какие частицы проходят через Fo?", "t4_s2_h2": "В какую сторону?", "t4_s2_h3": "По градиенту — в матрикс", "t4_s2_e": "Перенос электронов и синтез АТФ связаны только через общий градиент — это и есть сопряжение", "t4_s3_title": "Синтаза заблокирована", "t4_s3_cond": "АТФ-синтаза заблокирована. Субстрат и кислород в избытке, утечка малая", "t4_s3_q": "Что произойдёт с градиентом и с потреблением кислорода?", "t4_s3_o1": "Градиент вырастет, потребление кислорода упадёт", "t4_s3_x1": "Да: протонам некуда вернуться, и насосы работают против всё большей силы", "t4_s3_o2": "Градиент упадёт, потребление кислорода вырастет", "t4_s3_x2": "Так меняются показатели при утечке; здесь путь возврата закрыт", "t4_s3_o3": "Ничего не изменится, кроме АТФ", "t4_s3_x3": "Без возврата протонов градиент растёт и тормозит перенос электронов", "t4_s3_h1": "Через что протоны возвращались в матрикс?", "t4_s3_h2": "Что происходит с градиентом, если возврат закрыт?", "t4_s3_h3": "Высокий градиент тормозит насосы цепи", "t4_s3_e": "Скорость дыхания зависит от того, расходуется ли градиент: без синтеза АТФ цепь замедляется. Поток утечки при этом немного растёт: прежний путь утечки работает при большем градиенте", "t4_s4_title": "Утечка и блок — сравнение", "t4_s4_cond": "Две пробы митохондрий: в первой добавлен путь утечки протонов, во второй заблокирована АТФ-синтаза. В обеих синтез АТФ снижен", "t4_s4_q": "Какие два измерения их различат?", "t4_s4_o1": "Потребление кислорода и мембранный потенциал", "t4_s4_x1": "Да: при утечке O₂ ↑ и потенциал ↓; при блоке синтазы O₂ ↓ и потенциал ↑", "t4_s4_o2": "Синтез АТФ и общее количество митохондрий", "t4_s4_x2": "Синтез АТФ снижен в обоих случаях, а количество митохондрий одинаково", "t4_s4_o3": "Количество NADH и АТФ в пробе", "t4_s4_x3": "АТФ снижен в обеих пробах, а NADH не отличает утечку от нехватки субстрата; надёжнее измерить O₂ и потенциал", "t4_s4_h1": "Какие показатели при утечке и при блоке меняются в разные стороны?", "t4_s4_h2": "Посмотрите на стрелки в двух панелях", "t4_s4_h3": "Градиент и дыхание", "t4_s4_e": "Один показатель («АТФ снизился») не различает причины; нужны показатели, которые меняются в разные стороны", "t4_s5_title": "Потенциал и импорт белков", "t4_s5_cond": "Мембранный потенциал митохондрий в клетке рассеян (большая утечка). Наблюдаем белок матрикса, синтезированный в цитозоле, через час", "t4_s5_q": "Где окажется этот белок?", "t4_s5_o1": "Останется в цитозоле", "t4_s5_x1": "Да: переход через внутреннюю мембрану требует потенциала", "t4_s5_o2": "Войдёт в матрикс как обычно", "t4_s5_x2": "Импорт в матрикс зависит от потенциала; без него белок не проходит внутреннюю мембрану", "t4_s5_o3": "Встроится в наружную мембрану", "t4_s5_x3": "Белок матрикса не становится белком наружной мембраны", "t4_s5_h1": "Через сколько мембран проходит белок матрикса?", "t4_s5_h2": "Что нужно для перехода через внутреннюю?", "t4_s5_h3": "Потенциал внутренней мембраны", "t4_s5_e": "Потенциал нужен не только для синтеза АТФ: его потеря сразу нарушает и импорт белков", "t4_inv_cond": "Синтез АТФ в митохондриях снижен. Потребление кислорода тоже снижено, мембранный потенциал снижен", "t4_inv_q": "Какая причина совместима с этими данными?", "t4_inv_o1": "Недостаток кислорода или субстрата", "t4_inv_x1": "Да: при малой подаче электронов падают и дыхание, и градиент", "t4_inv_o2": "Утечка протонов при избытке субстрата", "t4_inv_x2": "При утечке и избытке субстрата потребление кислорода выросло бы", "t4_inv_o3": "Блок АТФ-синтазы", "t4_inv_x3": "При блоке синтазы потенциал вырос бы", "t4_inv_e": "Три показателя вместе различают три причины, если причины не сочетаются: большая утечка при нехватке субстрата тоже даёт снижение кислорода и потенциала", "t4_lim": "Стрелки показывают направление изменений в учебной модели. Утверждение «при утечке дыхание ускоряется» верно при избытке субстрата и кислорода; при малой подаче прирост невелик и не может превысить подачу. Без кислорода АТФ-синтаза в клетке может работать в обратную сторону, тратя АТФ, — в модели это не показано", "fin_title": "Что накопилось, где и в какой форме?", "fin_cond": "Четыре клетки с разными нарушениями. Для каждой отметьте, какие измерения нужны, чтобы найти нарушенное звено, и только затем — причину. Измерений можно отметить не больше указанного числа", "fin_c1_cond": "Фибробласт после добавления неизвестного вещества: белок, поглощённый эндоцитозом, доходит до лизосом, но не расщепляется. Гидролазы в лизосомах на месте, мембраны лизосом не повреждены, гидролаз в цитозоле нет", "fin_c1_lim": "1", "fin_c1_m1": "pH просвета лизосом", "fin_c1_m1_r": "около 6,8", "fin_c1_m2": "Образование аутофагосом", "fin_c1_m2_r": "норма", "fin_c1_m3": "Количество протеасом", "fin_c1_m3_r": "норма", "fin_c1_m4": "Убиквитин на белке", "fin_c1_m4_r": "одиночные молекулы, как обычно", "fin_c1_c1": "Нарушено закисление лизосом", "fin_c1_c1_x": "Да: pH близок к нейтральному, гидролазы на месте, мембрана не повреждена — не работает протонный насос", "fin_c1_c2": "Нет гидролаз в лизосомах", "fin_c1_c2_x": "Гидролазы на месте по условию", "fin_c1_c3": "Нарушена доставка в лизосомы", "fin_c1_c3_x": "Белок доходит до лизосом; нарушено расщепление", "fin_c1_c4": "Данных недостаточно", "fin_c1_c4_x": "После измерения pH данных достаточно", "fin_c2_cond": "Клетка сердечной мышцы: синтез АТФ митохондриями снижен; других данных нет", "fin_c2_lim": "2", "fin_c2_m1": "Потребление O₂", "fin_c2_m2": "Мембранный потенциал", "fin_c2_m3": "Количество митохондрий", "fin_c2_m4": "Количество NADH", "fin_c2_c1": "Утечка протонов в обход синтазы", "fin_c2_c2": "Остановка АТФ-синтазы", "fin_c2_c3": "Недостаток кислорода или субстрата", "fin_c2_c4": "Данных недостаточно", "fin_c2_xall": "Сравните направления изменений O₂ и потенциала с моделью вкладки 4", "fin_c3_cond": "Нейрон в культуре: копятся растворимые белки и белковые агрегаты; образование аутофагосом и лизосомы в норме", "fin_c3_lim": "1", "fin_c3_m1": "Есть ли на накопленных растворимых белках цепь убиквитина", "fin_c3_m1_r": "есть", "fin_c3_m2": "pH лизосом", "fin_c3_m2_r": "норма", "fin_c3_m3": "Число аутофагосом", "fin_c3_m3_r": "норма", "fin_c3_m4": "Потребление O₂", "fin_c3_m4_r": "норма", "fin_c3_c1": "Нарушено узнавание или расщепление в протеасоме", "fin_c3_c1_x": "Да: метка поставлена, лизосомные пути работают; агрегаты возникают из неразрушенных белков (как в модели A1)", "fin_c3_c2": "Нет убиквитинлигазы для этих белков", "fin_c3_c2_x": "Тогда на них не было бы цепи", "fin_c3_c3": "Нарушено образование аутофагосом", "fin_c3_c3_x": "Аутофагосомы образуются по условию", "fin_c3_c4": "Данных недостаточно", "fin_c3_c4_x": "После проверки цепи данных достаточно", "fin_c4_cond": "Клетка печени: из пероксисом в цитозоль выходит больше H₂O₂, чем обычно. Пероксисомы с ферментами на месте", "fin_c4_lim": "1", "fin_c4_m1": "Работа каталазы в пероксисомах", "fin_c4_m1_r": "обычная", "fin_c4_m2": "Скорость окисления жирных кислот в пероксисомах", "fin_c4_m2_r": "повышена", "fin_c4_m3": "Число пероксисом", "fin_c4_m3_r": "обычное", "fin_c4_m4": "Место каталазы", "fin_c4_m4_r": "просвет", "fin_c4_c1": "Усилено образование H₂O₂", "fin_c4_c1_x": "Да: каталаза работает обычно, а окисление ускорено", "fin_c4_c2": "Ослаблено удаление H₂O₂", "fin_c4_c2_x": "Работа каталазы обычная", "fin_c4_c3": "Нарушен импорт белков в пероксисому", "fin_c4_c3_x": "Ферменты, включая каталазу, находятся в просвете", "fin_c4_c4": "Данных недостаточно", "fin_c4_c4_x": "Одного из двух измерений достаточно", "a1_title": "Параллельные пути и ограниченность компенсации", "a1_q": "Может ли аутофагия взять на себя работу протеасомы?", "a1_cond": "В цитозоль за каждый интервал времени поступают: растворимые белки, помеченные цепью убиквитина (бегунок, 0–150 у.е.), 10 у.е. белковых агрегатов и 5 у.е. повреждённых органелл. Протеасома разрушает только растворимые меченые белки — не больше своей ёмкости. Аутофагия разрушает агрегаты и органеллы — вместе не больше своей ёмкости, пропорционально их запасу. Половина растворимых белков, не разрушенных к концу интервала, слипается в агрегаты (допущение модели). Четыре интервала", "a1_s1_q": "Ёмкость протеасомы снижена до 40 у.е. Где в первом интервале возникнет избыток?", "a1_s1_o1": "Среди растворимых меченых белков", "a1_s1_x1": "Да: протеасома успевает 40 из 80 у.е.; остаются 40 у.е., половина из них к концу интервала слипается в агрегаты", "a1_s1_o2": "Среди органелл", "a1_s1_x2": "Органеллы копятся позже — когда агрегаты займут ёмкость аутофагии", "a1_s1_o3": "Нигде: аутофагия возьмёт лишнее", "a1_s1_x3": "В модели аутофагия не берёт растворимые белки", "a1_s2_q": "Удвоим ёмкость аутофагии (80 у.е.) при сниженной протеасоме. Что станет с запасом растворимых белков?", "a1_s2_o1": "Останется 37,5 у.е.", "a1_s2_x1": "Да: аутофагия убирает только слипшуюся часть", "a1_s2_o2": "Станет равным нулю", "a1_s2_x2": "Растворимые белки не субстрат аутофагии в модели", "a1_s2_o3": "Вырастет", "a1_s2_x3": "Ёмкость аутофагии не влияет на протеасому", "a1_s3_kind": "Наблюдение без подсказки", "a1_s3_obs": "студент сам двигает бегунок притока при обычных ёмкостях и находит порог, выше которого начинается накопление (100 у.е.: при 110 у.е. остаётся 10 у.е. за интервал).", "a1_s3_e": "Накопление начинается, когда приток превышает ёмкость; ниже порога путь справляется полностью", "a1_s4_kind": "Объяснение", "a1_s4_e": "Аутофагия берёт на себя только подходящий субстрат — то, что слиплось в агрегаты. Компенсация есть, но она частичная и имеет цену: агрегаты занимают ёмкость аутофагии, и начинают копиться органеллы", "a1_inv_q": "Копятся и растворимые меченые белки, и повреждённые органеллы. Что проверить?", "a1_inv_o1": "Приток и ёмкости обоих путей", "a1_inv_x1": "Да: ту же картину дают рост притока (140 у.е. при обычной протеасоме) и снижение ёмкости протеасомы, а быстрое накопление органелл — ещё и нарушение аутофагии (сравните inflow_high, proteasome_low и inv_both)", "a1_inv_o2": "Только ёмкость протеасомы", "a1_inv_x2": "Рост притока даёт ту же картину; кроме того, при одновременном снижении аутофагии органеллы копятся быстрее (7,6 у.е. против 1,5)", "a1_inv_o3": "Только ёмкость аутофагии", "a1_inv_x3": "Растворимые меченые белки копятся только при избытке притока над ёмкостью протеасомы", "a1_lim": "Шаперон-опосредованную аутофагию и разрушение белков без убиквитина; усиление синтеза протеасом и компонентов аутофагии в ответ на нагрузку; гибель клетки. Компенсация между путями в разных тканях различна", "a1_new_data": "Цепь убиквитина — не единственный путь в протеасому. Белки, которые клетка образует сразу после внешнего сигнала (например, факторы транскрипции c-Fos и EGR1), разрушаются протеасомой с участием белка миднолина. Миднолин связывается с протеасомой одним своим участком, а другим захватывает в белке-мишени гидрофобный отрезок цепи. Когда в клетке подавлены ферменты E1, активирующие убиквитин, эти белки продолжают разрушаться, а при подавлении протеасомы — нет. Большинство экспериментов выполнено на культурах клеток при повышенном синтезе миднолина. Значит, отсутствие убиквитина на накопленном белке ещё не исключает участия протеасомы", "a2_title": "Два условия защиты: кислотность и целостность мембраны", "a2_q": "Субстрат копится в лизосомах: не хватает кислотности или повреждена мембрана?", "a2_cond": "В лизосому за интервал поступает 50 у.е. субстрата. Активность гидролаз зависит от pH: при 5,0 и ниже — 100 %, при 5,5 — 80 %, при 6,0 — 60 %, при 6,5 — 40 %, при 7,2 — 20 % (условная шкала). При целой мембране и полной активности лизосома расщепляет за интервал до 60 у.е. При повреждении мембраны часть гидролаз выходит в цитозоль. В модели pH и повреждение мембраны задаются независимо. Четыре интервала", "a2_s1_q": "pH просвета поднялся до 6,5, мембрана не повреждена. Что изменится?", "a2_s1_o1": "Копится 26 у.е. за интервал", "a2_s1_x1": "Да: активность 40 %, возможность — 24 у.е. за интервал", "a2_s1_o2": "Гидролазы выйдут в цитозоль", "a2_s1_x2": "Мембрана не повреждена; гидролазы остаются в просвете", "a2_s1_o3": "Ничего: гидролаз в избытке", "a2_s1_x3": "Избыток есть только при полной активности: 60 у.е. против нагрузки 50", "a2_s2_cond": "pH 4,6, но мембрана повреждена: в цитозоль вышла половина гидролаз", "a2_s2_q": "Что изменится?", "a2_s2_o1": "Копится 20 у.е.; в цитозоле — 10 %", "a2_s2_x1": "Да: в просвете осталась половина ферментов", "a2_s2_o2": "Расщепление не изменится", "a2_s2_x2": "С половиной ферментов возможность — 30 у.е.", "a2_s2_o3": "Гидролазы в цитозоле неактивны", "a2_s2_x3": "В модели при pH 7,2 у гидролаз остаётся 20 % активности", "a2_s3_kind": "Наблюдение", "a2_s3_obs": "«Малое повреждение (10 %) при pH 4,6»: субстрат не копится (возможность 54 у.е.), но в цитозоле — 2 % от полной активности гидролаз.", "a2_s3_e": "Отсутствие накопления в просвете ещё не означает отсутствия повреждения мембраны", "a2_s4_kind": "Объяснение", "a2_s4_e": "Ось pH в модели — условие расщепления в просвете, а мембрана — условие того, что гидролазы не выходят в цитозоль; в модели они меняются независимо. Недостаток кислотности замедляет расщепление, повреждение мембраны ещё и выпускает гидролазы в цитозоль, где их защищает от работы только нейтральный pH. Одинаковое накопление различает только наблюдение в цитозоле", "a2_inv_q": "Субстрат накопился. Он не доставлен или не расщеплён?", "a2_inv_o1": "Проверить, где он: в цитозоле или в просвете", "a2_inv_x1": "Да: при выключенной доставке он копится в цитозоле, лизосома не нагружена", "a2_inv_o2": "Измерить pH просвета", "a2_inv_x2": "pH различает причины нерасщепления, но не отличает их от недоставки", "a2_inv_o3": "Измерить активность гидролаз в цитозоле", "a2_inv_x3": "Она указывает на повреждение мембраны, но не на доставку", "a2_lim": "Как pH меняется при повреждении мембраны (в клетке при крупном повреждении протоны уходят из просвета); ремонт мембраны и удаление повреждённых лизосом (курс «Молекулярная биология»); различия гидролаз по зависимости от pH; гибель клетки при повреждении многих лизосом", "a2_new_data": "Лизосомная протеаза катепсин B, очищенная от других белков, расщепляет пептиды и при pH лизосомы (4,6), и при pH цитозоля (7,2). При нейтральном pH она расщепляет меньше разных связей и предпочитает другие аминокислоты рядом с местом разреза; для стандартного субстрата её активность при pH 7,2 составляет около половины активности при pH 4,6 (наибольшая — при pH 5,5). Катепсин B обнаруживают в цитозоле, ядре и вне клетки, особенно при ряде заболеваний. Значит, утверждение «гидролазы в цитозоле неактивны» — упрощение, и мембрана лизосомы — самостоятельное условие защиты", "a3_title": "Образование и накопление H₂O₂", "a3_q": "Чем отличается усиленное образование опасного продукта от ослабленного удаления?", "a3_cond": "В пероксисоме за интервал образуется P у.е. H₂O₂ (бегунок 0–100). Каталаза разлагает за интервал до K у.е. Половина неразложенной H₂O₂ за интервал выходит в цитозоль, где другие ферменты удаляют до 20 у.е. за интервал. Все величины — допущения. Четыре интервала", "a3_s1_q": "Образование выросло с 40 до 100 у.е. при K = 80. Что произойдёт?", "a3_s1_o1": "Избыток 20 у.е. копится и выходит", "a3_s1_x1": "Да: каталаза разлагает не больше 80 у.е.", "a3_s1_o2": "Всё разложит каталаза", "a3_s1_x2": "Её возможность — 80 у.е. за интервал", "a3_s1_o3": "Каталаза разложит больше, чем может", "a3_s1_x3": "Возможность каталазы в модели постоянна", "a3_s2_q": "Вернём P = 40 и снизим K до 20. Какими станут выход и запас H₂O₂?", "a3_s2_o1": "Те же, что при P = 100 и K = 80", "a3_s2_x1": "Да: избыток в обоих случаях 20 у.е.", "a3_s2_o2": "Накопления не будет: образование мало", "a3_s2_x2": "Удаление ещё меньше — 20 у.е.", "a3_s2_o3": "Накопление будет в пять раз больше", "a3_s2_x3": "Важна разность образования и удаления, а она та же", "a3_s3_kind": "Наблюдение", "a3_s3_obs": "«Поставим P = 60 и K = 40». Картина та же, что в двух предыдущих случаях: любой избыток в 20 у.е. за интервал даёт одинаковые выход и запас.", "a3_s3_e": "Накопление определяется разностью образования и удаления", "a3_s4_kind": "Наблюдение", "a3_s4_obs": "«Сделаем выход медленнее (пятая часть) при P = 100, K = 80»: в цитозоль выходит меньше (11,8 у.е.), но в пероксисоме копится больше (47,2 у.е.).", "a3_s4_e": "Мембрана пероксисомы не изолирует H₂O₂ полностью; медленный выход переносит накопление внутрь пероксисомы", "a3_inv_q": "В двух клетках H₂O₂ выходит из пероксисом одинаково. Как узнать причину?", "a3_inv_o1": "Измерить работу каталазы", "a3_inv_x1": "Да: одинаковый избыток даёт и рост образования, и снижение удаления", "a3_inv_o2": "Измерить запас H₂O₂ в пероксисоме", "a3_inv_x2": "Он одинаков", "a3_inv_o3": "Посчитать пероксисомы", "a3_inv_x3": "В модели их число одинаково", "a3_lim": "В клетке скорость работы каталазы растёт с количеством H₂O₂; постоянный предел — упрощение модели. Другие ферменты удаления H₂O₂ в самой пероксисоме; концентрации; передачу сигналов через H₂O₂; повреждение белков и липидов. Скорости и доля выхода — допущения", "a3_new_data": "В клетках человека в культуре образование H₂O₂ в пероксисомах искусственно усилили, поместив туда фермент, который образует H₂O₂ после добавления в среду определённой аминокислоты; каталазу в большинстве экспериментов подавляли. В этих условиях перекись, образованная в пероксисомах, окисляла остатки цистеина в белках не только пероксисом, но и цитозоля и митохондрий — больше 400 разных белков. Подавление каталазы этот эффект усиливало. Перекись пероксисом, по-видимому, работает и как сигнальная молекула. Значит, пероксисома — не замкнутый «ящик», а источник H₂O₂ для соседних компартментов; каталаза ограничивает выход, особенно при большом образовании", "a4_title": "Почему больше работы дыхательной цепи не обязательно означает больше АТФ", "a4_q": "Как связаны дыхание, градиент и синтез АТФ при утечке и при блоке синтазы?", "a4_cond": "Митохондрии в стационарном состоянии. Подача электронов S (субстрат и кислород) задана условием, 0–100 у.е. Дыхательная цепь перекачивает протоны из матрикса тем медленнее, чем выше градиент G (0–100 у.е.): перекачка = S × (1 − G/100). Протоны возвращаются в матрикс через АТФ-синтазу (поток = G, если синтаза работает) и путём утечки (поток = L × G). В стационаре перекачка равна возврату. Синтез АТФ в модели пропорционален потоку через синтазу, потребление кислорода — перекачке, тепло — утечке. АДФ в избытке", "a4_s1_q": "Утечку увеличили с 0,1 до 3 при S = 100. Что станет с потреблением кислорода и АТФ?", "a4_s1_o1": "Кислорода больше, АТФ меньше", "a4_s1_x1": "Да: градиент падает до 20 у.е., перекачка растёт до 80, через синтазу идёт лишь 20", "a4_s1_o2": "Больше и того и другого", "a4_s1_x2": "Утекающие протоны не проходят синтазу", "a4_s1_o3": "Меньше и того и другого", "a4_s1_x3": "Падает только АТФ; дыхание при избытке подачи растёт", "a4_s2_cond": "Вернём малую утечку и заблокируем синтазу", "a4_s2_q": "Что изменится?", "a4_s2_o1": "Градиент ≈ 91, кислорода ≈ 9", "a4_s2_x1": "Да: возврат почти закрыт, высокий градиент тормозит перекачку", "a4_s2_o2": "Градиент упадёт", "a4_s2_x2": "Протонам некуда вернуться, градиент растёт", "a4_s2_o3": "Кислорода потребуется больше", "a4_s2_x3": "Насосы работают против большой силы и замедляются", "a4_s3_kind": "Наблюдение", "a4_s3_obs": "«Уменьшим подачу до S = 30 и включим большую утечку»: потребление кислорода ≈ 27,9, АТФ ≈ 7.", "a4_s3_e": "Дыхание растёт лишь немного (с 23,6 до 27,9) и не может превысить подачу; синтез АТФ падает сильно", "a4_s4_kind": "Наблюдение", "a4_s4_obs": "«Блок синтазы + большая утечка»: градиент 25, потребление кислорода 75, АТФ 0 — вся перекачка уходит в утечку.", "a4_inv_q": "Синтез АТФ одинаково снижен в двух пробах. Какие показания различат утечку и блок синтазы?", "a4_inv_o1": "Потребление кислорода и градиент", "a4_inv_x1": "Да: при утечке O₂ ↑ и градиент ↓, при блоке — наоборот", "a4_inv_o2": "Синтез АТФ в каждой пробе", "a4_inv_x2": "Он снижен в обеих пробах", "a4_inv_o3": "Подача электронов в пробах", "a4_inv_x3": "Она задана одинаковой условием задачи", "a4_lim": "Зависимость от АДФ (дыхательный контроль); работу синтазы в обратном направлении; составляющие градиента (мембранный потенциал и разность pH); образование активных форм кислорода. Линейные зависимости и коэффициенты — допущения", "a4_new_data": "Ток протонов, вызванный веществами-разобщителями, проводят в основном определённые белки, а не липиды мембраны. Разобщители вызывают во внутренней мембране митохондрий ток протонов гораздо больший, чем в плазматической мембране клеток. В митохондриях сердца мышей без основного переносчика АДФ/АТФ ток, вызванный динитрофенолом, был меньше примерно на 80 % (у других разобщителей — меньше), а в бурой жировой ткани основную его часть проводил разобщающий белок UCP1. Без переносчиков АДФ/АТФ дыхание, усиленное разобщителями, было значительно меньше. Переносчик АДФ/АТФ, таким образом, выполняет две работы — обменивает АДФ на АТФ и проводит протоны — и распределяет энергию градиента между синтезом АТФ и теплом", "s5_wait": "Исход появится после ответа", "s5_l_outside": "снаружи клетки", "s5_l_cytosol": "цитозоль", "s5_l_matrix": "матрикс", "s5_l_ims": "межмембранное пространство", "s5_l_er_lumen": "просвет ЭПР", "s5_l_er": "ЭПР", "s5_l_mito": "митохондрия", "s5_l_proteasome": "26S-протеасома", "s5_l_19s": "19S-частица", "s5_l_20s": "20S-частица", "s5_l_ub": "убиквитин", "s5_l_peptides": "пептиды", "s5_l_endosome": "эндосома", "s5_l_lysosome": "лизосома", "s5_l_lamp2a": "LAMP2A", "s5_l_hsc70": "HSC70", "s5_l_phagophore": "фагофор", "s5_l_hydrolases": "кислые гидролазы", "s5_l_pump": "протонный насос V-типа", "s5_l_transporter": "переносчик продуктов", "s5_l_atp": "АТФ", "s5_l_atp_amp": "АТФ", "s5_l_peroxisome": "пероксисома", "s5_l_oxidase": "оксидаза", "s5_l_catalase": "каталаза", "s5_l_vlcfa": "жирная кислота с очень длинной цепью", "s5_l_pex5": "Pex5", "s5_l_translocator": "транслокатор", "s5_l_etc": "дыхательная цепь", "s5_l_synthase": "АТФ-синтаза", "s5_l_leak": "путь утечки", "s5_l_aac": "переносчик АДФ/АТФ", "s5_   for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* семинар 11: ключи текстов шага — ключи документов v1.1 (s11_t1_s1_q, _o1…_o4, _e, _w2…_w4, _h1…_h3, _obs, _cond) */
function poeKey(K, si){ const S = SCENES[K], st = S.poe[si]; return st.key || (S.pfx ? S.pfx + (si + 1) : `p${K}_${si + 1}`); }

const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  if (POE_RND) return poeShuffle(n, key + '/' + i + '/' + POE_SEED);
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;

const POE_SALT = 'v21';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.

const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };

}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */

  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);

  if (!POE_RND) return i;

  const units = poeUnits(K), ord = poeShuffle(units.length, K + '/steps/' + POE_SEED);

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 700 px или низкий экран) во всех практикумах.
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 760 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:700px), (max-height:500px)') : null;
  let queued = false;
  function fitStage(st) {
    const sv = st.querySelector('svg'), zw = st.querySelector('.zwrap'); if (!sv || !zw) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); st.style.removeProperty('--p5w'); return; }
    const cur = sv.getBoundingClientRect().width, flatW = zw.clientWidth; if (!cur || !flatW) return;
    const k = Math.min(1, flatW / cur); let min = Infinity;
    ts.forEach(t => {
      const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
      const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
      if (px > 0 && px < min) min = px;
      t.classList.toggle('p5-small', px < 7);
    });
    if (min < Infinity) st.style.setProperty('--p5w', Math.ceil(Math.min(1800, Math.max(760, flatW * 11.2 / min))) + 'px');
  }
  function fitAll() { queued = false; document.querySelectorAll('#scenes .stage').forEach(st => { if (st.offsetParent) fitStage(st); }); }
  const later = () => { if (queued) return; queued = true; requestAnimationFrame(fitAll); };
  function arm() {
    const sc = document.getElementById('scenes') || document.body;
    new MutationObserver(later).observe(sc, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
    document.addEventListener('click', later, true);
    window.addEventListener('resize', later);
    later();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
})();

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;
    return `<path d="M${x - 2},${y1} Q${x - 7},${ym} ${x - 2},${y2}" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */
  function profile(y0, feats, x0 = 6, x1 = 594){
    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        const b0 = Math.atan2(yn - cyb, xl - f.c) + 2 * Math.PI, b1 = Math.atan2(yn - cyb, xr - f.c);
        for (let a = b0; a >= b1; a -= Math.PI / 48) P.push([f.c + R * Math.cos(a), cyb + R * Math.sin(a)]);
        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }
    flatTo(x1); return P;
  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → аппарат Гольджи (COP-II), 'gerr' — аппарат Гольджи → ЭПР (COP-I), 'intra' — между цистернами аппарата Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).
     rm: 'none' | 'coat' (нет белков оболочки) | 'uncoat' (оболочка не снимается) | 'snare' (нет SNARE на носителе).
     Возвращает { s: SVG, a: точки для подписей }. Русского текста нет. */
  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }

      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);

  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;

  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };

    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');

    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */

    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);

    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,

    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;

    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);

      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));

    });

  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;

    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
