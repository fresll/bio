      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);
    /* носитель возврата к поверхности */
    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = G('nucleus', `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`);
    segs.forEach(([a, b]) => { const P = stadium(a, b, Yc, H); q += G('envelope', `<path d="M${P.map(([x, y]) => f(x) + ',' + f(y)).join(' L')} Z" fill="${C.lumen}"/>` + bilayerPts(P, { closed: true })); });
    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { let w = `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) w += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; q += G('npc', w); });
    const big = nucBig;
    const imp = o.noImp ? () => '' : nucImp;
    const exp = nucExp;
    const sm = nucSm;
    const top = [[110, 70], [300, 110], [480, 80]], bot = [[110, 320], [300, 290], [480, 330]];
    const q0 = q;
    let res = {};
    if (cargo === 'small') { q += sm([[70, 60], [150, 100], [260, 70], [340, 120], [450, 60], [540, 110], [80, 300], [170, 340], [270, 300], [350, 350], [460, 290], [540, 340], [206, 196], [394, 206]]); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'big' || cargo === 'mut') { q += top.map(([x, y]) => big(x, y, cargo === 'mut' ? 'mut' : '')).join(''); res = { mode: 'none', where: cargo === 'big' ? 'cytoslow' : 'cyto' }; }
    else if (cargo === 'm27' || cargo === 'm67') { const r = cargo === 'm27' ? 6 : 9.5, g = (x, y) => G('gfpprot', `<circle cx="${x}" cy="${y}" r="${r}" fill="#7FBF7F" stroke="#3d7a3d" stroke-width="1"/>`);
      q += [[90, 70], [230, 110], [380, 70], [520, 105], [206, 200], [100, 310], [250, 340], [400, 300], [530, 345]].map(([x, y]) => g(x, y)).join(''); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'nls') {
      if (rm === 'imp') { q += top.map(([x, y]) => big(x, y, 'nls')).join(''); res = { mode: 'norec', where: 'cyto' }; }
      else if (rm === 'ran') { q += big(110, 70, 'nls') + imp(110, 70) + big(394, Yc, 'nls') + imp(394, Yc) + big(300, 300, 'nls') + imp(300, 300); res = { mode: 'stuck', where: 'both' }; }
      else { q += big(110, 70, 'nls') + imp(110, 70) + big(206, Yc, 'nls') + imp(206, Yc) + bot.map(([x, y]) => big(x, y, 'nls')).join('') + imp(560, 360); res = { mode: 'imp', where: 'nuc' }; }
    } else {
      if (rm === 'exp' || rm === 'ran') { q += bot.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: rm === 'ran' ? 'noran' : 'norec', where: 'nuc' }; }
      else { q += big(300, 300, 'nes') + exp(300, 300) + big(394, Yc, 'nes') + exp(394, Yc) + top.map(([x, y]) => big(x, y, 'nes')).join(''); res = { mode: 'exp', where: 'cyto' }; }
    }
    const a = { cyto: [14, 24], nuc: [14, 392], env: [530, Yc - 44], npc: [300, Yc + 62] };
    if (o.ran) {
      const g = (x, y, gtp) => G('ran', `<circle cx="${x}" cy="${y}" r="6" fill="${gtp ? '#1E7B4A' : '#fff'}" stroke="#1E7B4A" stroke-width="2"/>`);
      q += [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      const rd = [[236, 40], [262, 52], [288, 40]].map(([x, y]) => g(x, y, false)).join('') + [[176, 380], [202, 368], [228, 380]].map(([x, y]) => g(x, y, rm !== 'ran')).join('');
      a.ranC = [300, 50]; a.ranN = [240, 380]; a.gtpN = rm !== 'ran'; a.rd = rd;
    }
    return { s: o.bg ? q0 + (a.rd || '') : q, res, a };
  }

  /* ---------- рецептор груза по нормали к мембране (рецензия v0.1, R27) ----------
     recAt: точка (x, y) на средней линии мембраны; th — поворот (градусы) от направления «вверх»; ножка пересекает бислой,
     чаша — в просвете (на глубине depth), адаптер — с цитоплазматической стороны. */
  function recAt(x, y, th, withCargo = true, depth = 15, adapter = true) {
    const top = y - depth;
    return `<g transform="rotate(${f(th)} ${f(x)} ${f(y)})">` +

  const srp = (cx, cy, k = 1, g = 'srp') => G(g, `<path d="M${f(cx - 26 * k)},${f(cy + 6 * k)} C${f(cx - 26 * k)},${f(cy - 15 * k)} ${f(cx - 6 * k)},${f(cy - 17 * k)} ${f(cx)},${f(cy - 5 * k)} C${f(cx + 6 * k)},${f(cy - 17 * k)} ${f(cx + 26 * k)},${f(cy - 15 * k)} ${f(cx + 26 * k)},${f(cy + 6 * k)} C${f(cx + 17 * k)},${f(cy + 15 * k)} ${f(cx - 17 * k)},${f(cy + 15 * k)} ${f(cx - 26 * k)},${f(cy + 6 * k)} Z" fill="${C.srp}" stroke="#1B5E3A" stroke-width="1"/>`);
  /* рецептор SRP: две цепи в мембране (y — середина бислоя), головка в цитозоле (снизу) */
  const srpR = (x, y, g = 'srpr') => G(g, `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 2)}" width="12" height="${f(MH + 4)}" rx="3" fill="${C.srpr}"/>` +
    `<path d="M${f(x - 16)},${f(y + MH / 2 + 4)} Q${f(x)},${f(y + MH / 2 + 22)} ${f(x + 16)},${f(y + MH / 2 + 4)}" fill="none" stroke="${C.srpr}" stroke-width="6" stroke-linecap="round"/>`);
  /* транслокон Sec61: две половины поперёк мембраны (y — середина бислоя); o.open — канал открыт; o.plug — пробка закрывает канал
     (со стороны просвета); o.gate — латеральные ворота приоткрыты (сигнал уходит в бислой справа); o.off — звено выключено */
  function sec61(x, y, o = {}) {
    const gap = o.open ? 12 : 4, w = 13, h = MH + 14, y0 = y - h / 2, col = o.off ? C.grey : C.sec61;
    let s = `<rect x="${f(x - gap / 2 - w)}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>` +
      `<rect x="${f(x + gap / 2 + (o.gate ? 4 : 0))}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>`;
    if (o.plug) s += G('plug', `<rect x="${f(x - gap / 2 - 2)}" y="${f(y0 + 1)}" width="${f(gap + 4)}" height="7" rx="3" fill="${C.plug}" stroke="${col}" stroke-width="1"/>`);
    return G('sec61', s) + (o.off ? cross(x, y0 - 12, 7) : '');
  }
  /* сигнальная пептидаза: белок мембраны с активным центром со стороны просвета (сверху); o.off — нет фермента (штрих) */
  function spase(x, y, o = {}) {
    if (o.off) return G('spase', `<rect x="${f(x - 7)}" y="${f(y - MH / 2 - 14)}" width="14" height="${f(MH + 14)}" rx="4" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>`) + cross(x, y - MH / 2 - 20, 6);
    return G('spase', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 4)}" width="12" height="${f(MH + 8)}" rx="3" fill="${C.spase}"/>` +
      `<path d="M${f(x - 9)},${f(y - MH / 2 - 16)} L${f(x)},${f(y - MH / 2 - 6)} L${f(x + 9)},${f(y - MH / 2 - 16)}" fill="none" stroke="${C.spase}" stroke-width="3.2" stroke-linecap="round"/>`);
  }

  /* ---------- гликаны и метка (условные знаки, без формул) */
  const sq = (x, y, u, c = C.glcnac) => `<rect x="${f(x - u / 2)}" y="${f(y - u / 2)}" width="${f(u)}" height="${f(u)}" fill="${c}"/>`;
  const ci = (x, y, u, c = C.man) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u / 2)}" fill="${c}"/>`;
  const tri = (x, y, u, c = C.glc) => `<path d="M${f(x)},${f(y - u * .55)} L${f(x + u * .55)},${f(y + u * .45)} L${f(x - u * .55)},${f(y + u * .45)} Z" fill="${c}"/>`;
  const pmark = (x, y, u) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u * .62)}" fill="${C.phos}"/>` + `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(u * .85)}" font-weight="800" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">P</text>`;
  /* N-гликан на аспарагине в точке (x, y), растёт в сторону dir (−1 — вверх). o.glc — число глюкоз (0–3); o.trim — маннозы укорочены
     (сигнал к удалению); o.p — метка M6P ('P' на маннозе) | 'glcnacP' — промежуточная (GlcNAc-P на маннозе); o.complex — сложный
     (аппарат Гольджи: концевые ветви другими знаками); u — размер знака */
  function glycan(x, y, dir = -1, o = {}, g = 'glycan') {
    const u = o.u || 7, st = u * 1.35, Y = i => y + dir * st * i;
    let s = line(x, y, x, Y(3), '#555', 1.4) + line(x, Y(3), x - st, Y(4), '#555', 1.4) + line(x, Y(3), x + st, Y(4), '#555', 1.4);
    s += sq(x, Y(1), u) + sq(x, Y(2), u) + ci(x, Y(3), u);
    if (o.complex) { s += sq(x - st, Y(4), u, '#6B8E23') + sq(x + st, Y(4), u, '#6B8E23') + ci(x - st, Y(5), u * .9, '#E8B4C8') + ci(x + st, Y(5), u * .9, '#E8B4C8'); return G(g, s); }
    s += ci(x - st, Y(4), u) + ci(x + st, Y(4), u);
    if (!o.trim) { s += line(x - st, Y(4), x - st, Y(5), '#555', 1.2) + ci(x - st, Y(5), u); }
    for (let i = 0; i < (o.glc || 0); i++) s += tri(x - st, Y(6 + i), u);
    if (o.p) {
      const px = x + st + u * .9, py = Y(4) + dir * u * .5;
      s += line(x + st, Y(4), px, py, '#555', 1.2);
      if (o.p === 'glcnacP') s += sq(px + u * 1.1, py + dir * u * .5, u * .9) + G('m6p', pmark(px, py, u)); else s += G('m6p', pmark(px, py, u));
    }
    return G(g, s);
  }

  /* ---------- шапероны, контроль качества, удаление */
  const bip = (x, y, k = 1, g = 'bip') => G(g, `<path d="M${f(x - 12 * k)},${f(y - 9 * k)} A13,13 0 1 0 ${f(x + 12 * k)},${f(y - 9 * k)}" fill="none" stroke="${C.chap}" stroke-width="${f(6 * k)}" stroke-linecap="round"/>`);
  const pdi = (x, y, g = 'pdi') => G(g, `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7" fill="${C.pdi}"/>`);   /* интеграция (агент t2): без текста 7,5 px — подпись PDI ставит сцена */
  /* калнексин: белок мембраны ЭПР (y — середина бислоя) с лектиновой головкой в просвете (сверху) */
  const calnexin = (x, y, g = 'cnx') => G(g, `<rect x="${f(x - 4)}" y="${f(y - MH / 2 - 2)}" width="8" height="${f(MH + 4)}" rx="3" fill="${C.chap}"/>` +
    line(x, y - MH / 2 - 2, x, y - MH / 2 - 16, C.chap, 3) + `<path d="M${f(x - 14)},${f(y - MH / 2 - 16)} A14,10 0 0 1 ${f(x + 14)},${f(y - MH / 2 - 16)} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
  /* убиквитин: цепочка из n малых кружков */
  const ub = (x, y, n = 4, dx = 7, g = 'ub') => G(g, Array.from({ length: n }, (_, i) => `<circle cx="${f(x + i * dx)}" cy="${f(y - (i % 2) * 3)}" r="3.4" fill="${C.ub}"/>`).join(''));
  /* протеасома: бочонок в цитозоле */
  const proteasome = (x, y, g = 'prot') => G(g, [0, 1, 2, 3].map(i => `<rect x="${f(x - 16)}" y="${f(y - 20 + i * 10)}" width="32" height="9" rx="4" fill="${i % 3 ? C.protL : C.prot}"/>`).join(''));
  /* канал удаления (ERAD) в мембране ЭПР */
  const eradCh = (x, y, g = 'erad_ch') => G(g, `<rect x="${f(x - 14)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/><rect x="${f(x + 4)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/>`);

  /* ---------- мембранные белки (в бислое) */
  /* однопроходный белок: трансмембранный сегмент в бислое (y — середина), N-домен (глобула) с одной стороны, C-хвост с другой.
     o.inv — обратная ориентация (N-домен в цитозоле, A4); o.col; o.dom — размер домена; o.lig — связан лиганд; o.bad — участок связывания
     не сформирован (штриховой контур); o.glyc — гликан на N-домене; возвращает и точку N-домена */
  function tmProt(x, y, o = {}) {
    const up = o.inv ? 1 : -1, col = o.col || C.ldlr, r = o.dom || 13, ny = y + up * (MH / 2 + 8 + r);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>`;
    s += line(x, y + up * (MH / 2 + 2), x, ny - up * r, col, 3);
    s += `<circle cx="${f(x)}" cy="${f(ny)}" r="${r}" fill="${o.bad ? '#fff' : col}" stroke="${col}" stroke-width="2"${o.bad ? ' stroke-dasharray="4 3"' : ''}/>`;
    const tailEnd = y - up * (MH / 2 + 18);
    s += `<path d="M${f(x)},${f(y - up * (MH / 2 + 2))} Q${f(x + 8)},${f((y - up * (MH / 2) + tailEnd) / 2)} ${f(x + 2)},${f(tailEnd)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;
    if (o.glyc) s += glycan(x + r - 2, ny + up * (r - 2), up, { u: 5 });
    if (o.lig) s += G('ligand', `<path d="M${f(x - 8)},${f(ny + up * (r + 2))} L${f(x)},${f(ny + up * (r + 14))} L${f(x + 8)},${f(ny + up * (r + 2))} Z" fill="${C.lig}"/>`);
    return { s: G(o.g || 'tm', s), nx: x, ny };
  }
  /* рецептор M6P: белок мембраны (y — середина) с карманом связывания со стороны просвета (сверху; dir=-1) */
  function m6pr(x, y, dir = -1, o = {}) {
    const col = o.off ? C.grey : C.m6pr, hy = y + dir * (MH / 2 + 12);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>` +
      `<path d="M${f(x - 10)},${f(hy + dir * 6)} L${f(x - 10)},${f(hy)} Q${f(x)},${f(hy - dir * 8)} ${f(x + 10)},${f(hy)} L${f(x + 10)},${f(hy + dir * 6)}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
    return G('m6pr', s) + (o.off ? cross(x, hy + dir * 12, 6) : '');
  }
  /* гидролаза (растворимый груз): глобула; o.tag — метка M6P (знак «P»); o.free — без рецептора */
  const hydrolase = (x, y, o = {}) => G(o.g || 'hydro', `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 7}" fill="${C.hydro}" stroke="#6E3554" stroke-width="1"/>` + (o.tag ? pmark(x + (o.r || 7) + 3, y - (o.r || 7) + 1, 6) : ''));
  /* растворимый секретируемый белок (глобула; цвет по грузу) */
  const solProt = (x, y, col = C.sec, r = 6, g = 'cargo') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}" stroke="#2B5D88" stroke-width=".8"/>`);

  /* ---------- аппарат Гольджи: стопка цистерн (просвет — внутри; цис — снизу слева, транс — справа сверху задаёт сцена) */
  function cisterna(cx, cy, w, h = 16, fill = C.lumen /* С-13 */, g = 'cist') { return closedMem(roundRectPts(cx - w / 2, cy - h / 2, w, h, h / 2 - .5), fill, g); }

  /* шкала столбцов (модели A2, A3): ось, деления и подписи; возвращает функцию высоты */
  function axes(x, y, w, h, vmax, ticks, lab) {
    let s = line(x, y, x, y - h, C.muted, 1.4) + line(x, y, x + w, y, C.muted, 1.4);
    ticks.forEach(v => { const yy = y - h * v / vmax; s += line(x - 4, yy, x, yy, C.muted, 1.2) + T(x - 7, yy, String(v), { a: 'r', size: 10.5, col: C.muted }); });
    if (lab) s += T(x - 4, y - h - 14, lab, { a: 'l', size: 11, col: C.muted, w: 600 });
    return { s, H: v => h * v / vmax };
  }
  const num = (x, d = 1) => { const v = +x; return (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v).toFixed(0) : v.toFixed(d)).replace('.', ',').replace('-', '−'); };

  return { C, f, G, esc, T, TN, wrap, title, panel, line, arrow, carrow, larrow, cross, waitBox, tag, readout, sides, memH, MH, closedMem, roundRectPts, circlePts, carrier,
    ribosome, mrna, chain, srp, srpR, sec61, spase, sq, ci, tri, pmark, glycan, bip, pdi, calnexin, ub, proteasome, eradCh, tmProt, m6pr, hydrolase, solProt, cisterna, axes, num,
    setPick: v => { PICK = !!v; }, get pick() { return PICK; } };
})();

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   stageView — возврат схемы на экран при запуске (телефон).
   Семинар 8 (из семинара 7 v1.5): формы мембраны MF не нужны; справка по деталям — группы data-g (GN.G), она включена
   всегда в практикуме, а на странице «Объяснений» не используется.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */
const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));
    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */
    chips.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));
      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */
    const Td = T > 1e-9 && T < stop - 1e-9 && Math.abs(T - Math.round(T)) < 1e-9 ? T - 1e-6 : T;
    o.render(Td);
  }
  const api = {
    get T() { return st.T; }, get playing() { return st.on; }, get end() { return st.stop; },
    config(keys, stop, stopKey, opt = {}) {
      st.speed = opt.speed || 1.5; st.halt = !!opt.halt; st.keys = keys; st.n = keys.length; st.stop = stop; st.stopKey = stopKey; st.on = false; st.text = '';
      st.stepKey = opt.stepKey || 'tl_step'; st.off = opt.off || 0;
      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');
      chips.querySelectorAll('button').forEach((b, i) => b.onclick = () => { st.on = false; api.seek(i + 1); });
    },
    seek(T) { st.until = null; st.T = Math.max(0, Math.min(st.stop, T)); paint(); },
    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
    play(fromStart, until) {
      if (fromStart || st.T >= st.stop - 1e-6) st.T = 0;
      st.until = until != null && until < st.stop ? until : null;
      if (calm.matches) {   /* без движения: ответ показывается сразу, кнопка идёт по одному этапу */
        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (ограничение 07, разд. 4; R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

  const ell = (cx, cy, rx, ry, fill, st = 'none', w = 1.2, extra = '') => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
  const circ = (cx, cy, r, fill, st = 'none', w = 1, extra = '') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}" stroke="${st}" stroke-width="${w}" ${extra}/>`;

  const area = (x, y, s, kind, o = {}) => T(x, y, s, Object.assign({ a: 'l', size: 12, w: 700, it: true, col: { lumen: '#3E6A9A', cyto: '#8A7344', matrix: '#2E6B3A', ims: '#6A4C93', out: '#3E6A9A' }[kind] }, o));
  /* ---------- мембраны */

    const o = arc(r + 12), i = arc(r), band = 'M' + o.map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' L' + i.reverse().map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' Z';

  const enzyme = (x, y, col = '#5D6D7E', r = 9, g = 'cargo1') => G(g, `<path d="M${f(x - r)},${f(y)} C${f(x - r)},${f(y - r * 1.2)} ${f(x + r)},${f(y - r * 1.2)} ${f(x + r)},${f(y)} C${f(x + r)},${f(y + r)} ${f(x - r * .3)},${f(y + r * 1.1)} ${f(x - r)},${f(y)} Z" fill="${col}" stroke="#2C3E50" stroke-width="1"/>`);
  const aggregate = (x, y, k = 1, g = 'aggregate') => G(g, [[0, 0], [12, -6], [-10, 8], [8, 10], [-6, -10], [16, 6], [-14, -2]].map(([dx, dy]) => circ(x + dx * k, y + dy * k, 7 * k, C.agg, '#6E4B2F', .8)).join(''));

   Числа — опубликованные значения работ (03; ME.A1…A4, эталон models_reference.json); между засечками значений нет.
   A2 — три позиции одного оформления, ни одна не выделена (07, AT-06; s14-a2-neutral); A3 — точки без линии регрессии (s14-a3-noline).
   Фамилий и годов на схемах нет (07, разд. 6). Русского текста здесь нет.

/* ---------------- A1: сколько новых мутаций получает ребёнок (накопительный столбик; ступенчато) */
GN.s14_a1 = {
  mk(t){
  const Q = POPF, V = VARF, f = V.f, C = V.C, T = V.T, LB = V.LB;
  const COL = ['#2C7FB8', '#5B7A99', '#9A7B5B', '#7F8C9A'];
  function draw(o){
    const lv = o.lv, cum = ME.a1Cumulative(), Y = v => 360 - v * 1.35, X0 = 90, BW = 80;
    let s = V.defs() + T(12, 16, t('a1_head'), { a: 'l', size: 13, w: 700, col: C.muted }) + T(14, 38, t('a1_y'), { a: 'l', size: 11.5, w: 700, col: C.muted });
    s += Q.line(X0 - 10, Y(0), X0 + BW + 50, Y(0), '#8A97A8', 1.2);
    [0, 50, 100, 150, 200].forEach(v => { s += Q.line(X0 - 14, Y(v), X0 - 8, Y(v), '#8A97A8', 1.2) + T(X0 - 18, Y(v), String(v), { a: 'r', size: 11 }); });
    /* классы — столбик снизу вверх; подписи — столбцом справа с выносками (тонкие классы 7,4 и 4,4 не помещаются у сегмента) */
    const LY = [330, 284, 238, 192];
    cum.slice(0, lv).forEach((c, i) => { const y1 = Y(c.cumulative), y0 = Y(c.cumulative - c.value), ym = (y0 + y1) / 2;
      s += V.G('dnm_class', `<rect x="${X0}" y="${f(y1)}" width="${BW}" height="${f(Math.max(1.5, y0 - y1))}" fill="${COL[i]}" stroke="#fff" stroke-width="1"/>`) +
        `<path d="M${X0 + BW} ${f(ym)} L${X0 + BW + 40} ${LY[i]} H${X0 + BW + 48}" fill="none" stroke="${COL[i]}" stroke-width="1.2"/>` +
        T(X0 + BW + 52, LY[i], t('a1_s' + (i + 1)) + ': ' + V.dec(c.value, 1), { a: 'l', size: 11.5, w: i === lv - 1 ? 800 : 600 }); });
    const top = cum[lv - 1].cumulative;
    s += T(X0 + BW / 2, Y(top) - 12, V.dec(top, 1) + (lv === 4 ? ' *' : ''), { size: 14, w: 800 });
    /* у детей семьи 98–206 (скобка) и прежние оценки 60–70 (красная метка) — у левого края столбика */
    if (o.range) s += V.G('dnm_range', `<path d="M${X0 - 54} ${f(Y(98))} H${X0 - 48} M${X0 - 51} ${f(Y(98))} V${f(Y(206))} M${X0 - 54} ${f(Y(206))} H${X0 - 48}" stroke="${C.ink}" stroke-width="2" fill="none"/>`);
    s += V.G('dnm_old', `<rect x="${X0 - 6}" y="${f(Y(70))}" width="5" height="${f(Y(60) - Y(70))}" fill="#C0392B"/>`);
    const yl = 376;
    if (o.range) s += `<path d="M14 ${yl - 6} V${yl + 6}" stroke="${C.ink}" stroke-width="2"/>` + T(22, yl, t('a1_lab1'), { a: 'l', size: 11 });
    s += `<rect x="12" y="${yl + 12}" width="5" height="12" fill="#C0392B"/>` + T(22, yl + 18, t('a1_lab2'), { a: 'l', size: 11, col: '#C0392B', n: 96 });
    if (lv === 4) s += T(X0 + BW + 52, 150, '* ' + t('a1_lab3'), { a: 'l', size: 11, col: C.muted, n: 28 });
    /* панель Б «Откуда» */
    const cx = 530, cy = 96, r = 44, a16 = 2 * Math.PI * ME.A1.postzygotic_share_snv;
    s += T(cx, 38, t('a1_b_head'), { size: 12.5, w: 700, col: C.muted });
    if (o.panelB !== false) {
      const p = (a, rr) => [cx + rr * Math.sin(a), cy - rr * Math.cos(a)];
      const [x1, y1] = p(a16, r), [x2, y2] = p(a16, r - 20);
      s += V.G('germline', `<circle cx="${cx}" cy="${cy}" r="${r - 10}" fill="none" stroke="#B7C0CB" stroke-width="20"/>`) +
        V.G('postzygotic', `<path d="M${cx} ${cy - r} A${r} ${r} 0 0 1 ${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)} A${r - 20} ${r - 20} 0 0 0 ${cx} ${cy - r + 20} Z" fill="#2C7FB8"/>`);
      s += T(cx, cy, '16 %', { size: 15, w: 800, col: '#2C7FB8' });
      s += T(cx, cy + r + 16, t('a1_b_post'), { size: 11, w: 700, col: '#2C7FB8', n: 17 }) + T(cx, cy + r + 84, t('a1_b_germ'), { size: 11, col: C.muted, n: 17 });
      const yb = 342; s += T(cx, yb - 44, t('a1_b_pat'), { size: 11, w: 700, n: 20 });
      s += V.G('paternal', `<rect x="${cx - 60}" y="${yb}" width="${f(120 * ME.A1.paternal_share_small)}" height="16" fill="#5B7A99"/><rect x="${f(cx - 60 + 120 * ME.A1.paternal_share_small)}" y="${yb}" width="${f(120 * (1 - ME.A1.paternal_share_small))}" height="16" fill="#D7DEE6"/>`) +
        T(cx - 60, yb + 30, t('a1_b_father'), { a: 'l', size: 11, w: 700 }) + T(cx + 60, yb + 30, t('a1_b_mother'), { a: 'r', size: 11, col: C.muted }) + T(cx - 60 + 60 * ME.A1.paternal_share_small, yb + 8, '81,4 %', { size: 11, w: 800, col: '#fff' });
    }
    return s;
  }
  return { draw };
  },
  view(a, t){ return this.mk(t).draw({ lv: a.level || 4, range: true }); }
};
/* ---------------- A2: утверждение — возражение — ответ (три позиции одного оформления) + человек */
GN.s14_a2 = {
  mk(t){
  const Q = POPF, V = VARF, f = V.f, C = V.C, T = V.T, LB = V.LB;
  const POS = ['claim', 'objection', 'reply'], NEUTRAL = '#5A6676';
  function draw(o){
    let s = V.defs() + T(12, 16, t('a2_head'), { a: 'l', size: 13, w: 700, col: C.muted });
    /* три позиции: одинаковые рамки, цвет, толщина и кегль; выбранная раскрыта, без выделения цветом (AT-06) */
    POS.forEach((k, i) => { const x = 14 + i * 194, on = o.pos === k;
      s += V.G('a2_pos', `<rect x="${x}" y="32" width="184" height="26" rx="6" fill="#fff" stroke="${NEUTRAL}" stroke-width="1.4"/>` + T(x + 92, 45, t('a2_' + k + '_t') + (on ? ' ▾' : ''), { size: 12, w: 700, col: NEUTRAL })); });
    if (o.pos !== 'human') {
      s += `<rect x="14" y="66" width="572" height="186" rx="8" fill="#fff" stroke="${NEUTRAL}" stroke-width="1.4"/>`;
      s += V.G('a2_pos', T(28, 84, t('a2_' + o.pos), { a: 'l', size: 11.5, w: 600, n: 78 }));
    }
    /* панель Б «Человек» */
    const yb = o.pos === 'human' ? 90 : 276, X0 = 250, sc = 4.4;
    s += T(14, yb, t('a2_b_head'), { a: 'l', size: 11.5, w: 700, col: C.muted, n: 88 });
    [[55, 'a2_h1'], [27, 'a2_h2'], [2, 'a2_h3']].forEach(([n, k], i) => { const y = yb + 30 + i * 24;
      s += T(X0 - 8, y, t(k + '_s'), { a: 'r', size: 11.5, w: 600 }) + V.G('human_bar', `<rect x="${X0}" y="${y - 8}" width="${f(n * sc)}" height="16" rx="2" fill="#7F8C9A"/>`) + T(X0 + n * sc + 6, y, t('a2_of', { n }), { a: 'l', size: 11.5, w: 700 }); });
    s += T(14, yb + 98, t('a2_h4'), { a: 'l', size: 11, col: C.muted, n: 88 });
    if (o.open) s += LB(300, 398, t('a2_open'), { size: 11, w: 700, n: 76 });
    return s;
  }
  return { draw, POS };
  },
  view(a, t){ return this.mk(t).draw({ pos: a.pos || 'claim', open: a.pos === 'human' }); }
};
/* ---------------- A3: скорость соматических мутаций и продолжительность жизни (15 видов; логарифмические оси; без линии) */
GN.s14_a3 = {
  mk(t){
  const Q = POPF, V = VARF, f = V.f, C = V.C, T = V.T, LB = V.LB;
  const SPC = ME.A3.species, X0 = 90, X1 = 560, Y0 = 300, Y1 = 50;
  const X = v => X0 + (X1 - X0) * (Math.log10(v) - Math.log10(2)) / (Math.log10(100) - Math.log10(2));
  const Y = v => Y0 - (Y0 - Y1) * (Math.log10(v) - Math.log10(30)) / (Math.log10(1000) - Math.log10(30));
  function draw(o){
    let s = V.defs() + T(12, 16, t('a3_head'), { a: 'l', size: 12.5, w: 700, col: C.muted, n: 86 });
    s += `<rect x="${X0}" y="${Y1}" width="${X1 - X0}" height="${Y0 - Y1}" fill="#fff" stroke="#D3DAE3"/>`;
    [2, 5, 10, 20, 50, 100].forEach(v => { s += Q.line(X(v), Y0, X(v), Y0 + 5, '#8A97A8', 1.2) + T(X(v), Y0 + 16, String(v), { size: 11 }); });
    [30, 100, 300, 1000].forEach(v => { s += Q.line(X0 - 5, Y(v), X0, Y(v), '#8A97A8', 1.2) + T(X0 - 8, Y(v), String(v), { a: 'r', size: 11 }); });
    s += T(X1, Y0 + 32, t('a3_x') + ' · ' + t('log_scale'), { a: 'r', size: 11.5, col: C.muted });
    s += T(14, 34, t('a3_y') + ' · ' + t('log_scale'), { a: 'l', size: 11.5, w: 700, col: C.muted });
    if (!o.hidePts) SPC.forEach(([k, rate, life], i) => { const on = (o.sel || []).includes(i), x = X(life), y = Y(rate);
      s += V.G('species_point', `<g><title>${V.esc(t('a3_sp' + (i + 1)))}: ${V.dec(rate, 1)}; ${V.dec(life, 2)}</title><circle cx="${f(x)}" cy="${f(y)}" r="${on ? 7 : 5}" fill="${on ? '#2C7FB8' : '#8A97A8'}" stroke="#fff" stroke-width="1.5"/></g>`);
      if (on) { const k = (o.sel || []).indexOf(i);   /* подписи выбранных видов — списком в углу графика, не на точках (Р-21) */
        s += `<circle cx="${f(X1 - 196)}" cy="${f(Y1 + 16 + k * 20)}" r="5" fill="#2C7FB8"/>` + T(X1 - 186, Y1 + 16 + k * 20, t('a3_sp' + (i + 1)) + ': ' + V.dec(rate, 1) + ' / ' + V.dec(life, 2), { a: 'l', size: 11.5, w: 700 }); } });
    if ((o.sel || []).length && !o.hidePts) s += T(X1 - 6, Y1 + 16 + o.sel.length * 20, t('a3_leg'), { a: 'r', size: 10.5, col: C.muted });
    else s += LB((X0 + X1) / 2, (Y0 + Y1) / 2, t('s4_hidden'), { size: 12, col: C.muted });
    /* панель Б «К концу жизни» */
    if (o.end) s += LB(300, 352, t('a3_end'), { size: 11, w: 700, n: 84 });
    if (o.calc) s += LB(300, 396, t('a3_calc'), { size: 11, w: 700, col: '#2C7FB8', n: 60 });
    return s;
  }
  const idx = k => SPC.findIndex(x => x[0] === k);
  return { draw, idx, SPC };
  },
  view(a, t){ const D = this.mk(t), sel = a.sel === 'all' ? [] : (a.sel || []).map(k => D.idx(k));
    return D.draw({ sel, end: a.sel === 'all' || (a.sel || []).includes('human'), calc: (a.sel || []).includes('human') }); }
};
/* ---------------- A4: копии генов после удвоений генома в мозге позвоночных (три полосы долей + пример на дереве копий) */
GN.s14_a4 = {
  mk(t){
  const Q = POPF, V = VARF, f = V.f, C = V.C, T = V.T, LB = V.LB;
  const OUT = [['subfunc', ME.A4.subfunc, 'a4_o1'], ['neofunc', ME.A4.neofunc, 'a4_o2'], ['loss', ME.A4.loss_lt, 'a4_o3']];
  function draw(o){
    let s = V.defs() + T(12, 16, t('a4_head'), { a: 'l', size: 12.5, w: 700, col: C.muted, n: 86 });
    const X0 = 260, W = 300;
    OUT.forEach(([k, v, lab], i) => { const y = 56 + i * 40, on = o.o === k;
      s += T(X0 - 10, y, t('a4_oc' + (i + 1)) + (o.hideShares ? '' : ' — ' + t('a4_v_' + k)), { a: 'r', size: 11.5, w: on ? 800 : 600 }) + `<rect x="${X0}" y="${y - 10}" width="${W}" height="20" rx="3" fill="#F3F5F8" stroke="#C9D3DF"/>`;
      if (!o.hideShares) s += V.G('a4_share', `<rect x="${X0}" y="${y - 10}" width="${f(Math.max(3, W * v))}" height="20" rx="3" fill="${on ? '#2C7FB8' : '#8A97A8'}"/>`);
    });
    if (o.hideShares) s += LB(X0 + W / 2, 96, t('s4_hidden'), { size: 12, col: C.muted });
    /* пример на дереве копий (как на базовом уровне: круг, треугольник, ромб, крест) */
    const y = 216;
    if (o.hideShares) s += LB(300, y, t('a4_ex_w'), { size: 12, col: C.muted });
    else {
    s += T(14, 184, t('a4_ex', { o: t('t4_out_' + o.o) }), { a: 'l', size: 12, w: 700, col: C.muted });
    const box = (x, lab, parts) => { let q = `<rect x="${x}" y="${y - 17}" width="84" height="34" rx="6" fill="#fff" stroke="${C.ink}" stroke-width="1.4"/>` + T(x + 18, y, lab, { size: 12, w: 800 });
      if (parts === 'x') q += V.part('x', x + 58, y, 9); else if (parts === 'new') q += V.part('f1', x + 46, y, 7.5) + V.part('new', x + 68, y, 8);
      else q += V.part(parts.includes('f1') ? 'f1' : 'f1x', x + 46, y, 7.5) + V.part(parts.includes('f2') ? 'f2' : 'f2x', x + 68, y, 7.5); return q; };
    s += V.G('ancestor', box(30, 'G', ['f1', 'f2'])) + Q.line(114, y, 150, y, C.ink, 2) + `<rect x="150" y="${y - 9}" width="18" height="18" fill="${C.ink}"/>` + Q.line(168, y, 200, y, C.ink, 2);
    const ex = o.o === 'subfunc' ? [['f1'], ['f2']] : o.o === 'neofunc' ? [['f1', 'f2'], 'new'] : [['f1'], ['f1']];
    s += V.G('copy', box(204, 'G1', ex[0]) + box(298, 'G2', ex[1])) + T(400, y, t('a4_ex_note_' + o.o), { a: 'l', size: 11, n: 26 });
    }
    /* панель Б «Откуда копии» */
    const yb = 290; s += T(14, yb, t('a4_b_head'), { a: 'l', size: 12.5, w: 700, col: C.muted });
    [[ME.A4.ohnologue_og, 'a4_b1'], [ME.A4.ssd_og, 'a4_b2']].forEach(([n, k], i) => { const yy = yb + 24 + i * 26;
      s += T(X0 - 10, yy, t(k), { a: 'r', size: 11.5, w: 600, n: 32 }) + V.G('a4_groups', `<rect x="${X0}" y="${yy - 8}" width="${f(W * n / 2693)}" height="16" rx="2" fill="#7F8C9A"/>`); });
    s += T(14, yb + 76, t('a4_b339'), { a: 'l', size: 11, col: C.muted, n: 96 }) + T(14, yb + 96, t('a4_b3'), { a: 'l', size: 11, col: C.muted, n: 96 }) + T(14, yb + 124, t('a4_b4'), { a: 'l', size: 11, col: C.muted, n: 96 });
    return s;
  }
  return { draw };
  },
  view(a, t){ return this.mk(t).draw({ o: a.o || 'subfunc' }); }
};

/* =====================================================================
   s6g_14base.js — сцены базовых вкладок семинара 14 (GN.s14_t1…t4): одни и те же функции рисуют практикум (s7_t*.js) и схемы
   «Объяснений» (10: сцены s14_t1…t4). Детали — компоненты «Популяция» (POPF) и «История варианта» (VARF); числа — модели ME.*
   (эталон models_check.py). Контракт: GN.<сцена>.mk(t) → функции рисования; GN.<сцена>.view(args, t) → SVG 600 × 420.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* ---------------------------------------------------------------- вкладка 1 «От мутации к замещению» */
GN.s14_t1 = {
  mk(t){
  const Q = POPF, V = VARF, f = V.f, C = V.C, T = V.T, LB = V.LB;
  /* панель «Выравнивание» (шаг 1.1): 12 особей двух видов × 12 позиций условной последовательности; позиция 7 подсвечена */
  const SEQ = 'AGTCGACATGCA';   /* условная последовательность; позиция 7 — C (02, шаг 1.1) */
  function drawA(o){
    let s = V.defs() + T(12, 16, t('t1_a_head'), { a: 'l', size: 13, w: 700, col: C.muted });
    const rows = [];
    for (let sp = 1; sp <= 2; sp++) for (let i = 1; i <= 6; i++) {
      const seq = SEQ.split(''); if (sp === 1 && i === 3) seq[6] = 'T';
      const st = seq.map((ch, j) => (o.fills && j === 6) ? (ch === 'T' ? 'der' : 'anc') : null);
      rows.push({ lab: t('t1_a_row', { sp, i }), seq: seq.join(''), st, bold: o.fills && sp === 1 && i === 3, g: 'seq_row',
        titles: seq.map((ch, j) => j === 6 && o.fills ? t(ch === 'T' ? 't1_a_der' : 't1_a_anc') + ': ' + ch : '') });
    }
    s += V.align({ x: 40, y: 62, cw: 30, ch: 20, labW: 130, rows, sep: 6, hl: 6, colLab: t('t1_a_pos') });
    /* условные обозначения заливки — после ответа (до ответа заливка скрыта: 02, шаг 1.1) */
    if (o.fills) {
      s += V.cell(60, 362, 22, 18, 'C', 'anc') + T(88, 371, t('t1_a_anc'), { a: 'l', size: 11.5 }) +
        V.cell(250, 362, 22, 18, 'T', 'der') + T(278, 371, t('t1_a_der'), { a: 'l', size: 11.5 });
      s += LB(300, 400, t('t1_a_freq'), { size: 12.5, w: 700 });
    } else s += LB(300, 384, t('t1_a_wait'), { size: 12, col: C.muted });
    return s;
  }
  /* панель «История варианта»: шкала состояний + копии локуса + график частоты (повторы ME.history; связка с «Популяцией») */
  const HCACHE = {};
  const runs = (N, s) => HCACHE[N + '|' + s] || (HCACHE[N + '|' + s] = Array.from({ length: 10 }, (_, i) => ME.history(N, s, i + 1)));
  const GMAX = N => N === 10 ? 60 : 300, YMAX = N => N === 10 ? 1 : .5;
  const pAt = (h, g) => { const tr = h._raw || h.traj; return g < tr.length ? tr[g] : tr[tr.length - 1]; };
  const fates = (N, s) => { const c = { lost: 0, fixed: 0 }; runs(N, s).forEach(h => { c[h.fate === 'fixed' ? 'fixed' : 'lost']++; }); return c; };
  const sTxt = s => s === 0 ? '0' : (s > 0 ? '+' : '−') + V.dec(Math.abs(s), 2);
  function copiesRow(x, y, p, twoN, show){
    const n = Math.min(40, twoN), k = p <= 0 ? 0 : Math.max(1, Math.round(p * n)), W = 12.4;
    let s = '';
    for (let i = 0; i < n; i++) s += `<rect x="${f(x + i * W)}" y="${f(y - 6)}" width="10" height="12" rx="2" fill="${show && i < k ? C.der : C.anc}" stroke="${C.cellE}" stroke-width=".7"/>`;
    return V.G('copies', s);
  }
  function drawH(o){
    const N = o.N, s0 = o.s; let s = V.defs();
    s += T(12, 14, t(N === 1000 ? 't1_h_head_1000' : o.all ? 't1_h_head_all' : 't1_h_head_one', { N, s: sTxt(s0), r: o.rep }), { a: 'l', size: 12.5, w: 700, col: C.muted });
    if (N === 1000) {   /* 02, паспорт: «повторы для N = 1000 не показаны: расчёт по формуле» */
      s += V.scale({ x: 40, y: 32, w: 520, cur: o.wait ? 'arose' : null, lab: k => t('t1_st_' + k) });
      s += LB(300, 190, t('t1_h_1000'), { size: 13, w: 700, col: C.muted, n: 46 });
      if (!o.wait) { const fp = ME.fixprob(N, s0); s += LB(300, 250, t('t1_h_calc', { u: V.uFmt(fp.u), k: V.ratio(fp.ratio) }), { size: 13, w: 700, n: 50 }); }
      return s;
    }
    const R = runs(N, s0), h = R[o.rep - 1], G0 = GMAX(N), stg = o.stg, g = Math.max(0, Math.min(G0, o.gen));
    const p = o.wait || (stg != null && stg < 3) ? 1 / (2 * N) : pAt(h, g);

      s += T(160, 150, t('r_types_sdel'), { a: 'r', size: 12, w: 700, n: 14 }) + seg(170, 150, 100, '#5B7A99', 'A') + seg(270, 150, 100, '#7F8C9A', 'C');
      s += T(160, 210, t('r_types_sdup'), { a: 'r', size: 12, w: 700, n: 14 }) + seg(170, 210, 100, '#5B7A99', 'A') + seg(270, 210, 100, '#9A7B5B', 'B') + seg(370, 210, 100, '#9A7B5B', 'B') + seg(470, 210, 100, '#7F8C9A', 'C');
      s += T(160, 270, t('r_types_inv'), { a: 'r', size: 12, w: 700 }) + seg(170, 270, 100, '#5B7A99', 'A') + seg(270, 270, 100, '#9A7B5B', 'ᗺ') + seg(370, 270, 100, '#7F8C9A', 'C');
    }
    return s;
  });

  /* ·3 скорость мутаций и скорость замещений: что сравнивают */
  reg('s14_r_rates', (a, t) => {
    let s = '';
    if (a.v === 'trio') {
      s += Q.G('ind_aa', Q.ind(200, 90, 22, 'aa')) + T(200, 128, t('r_rates_f'), { size: 12, w: 700 }) + Q.G('ind_aa', Q.ind(400, 90, 22, 'aa')) + T(400, 128, t('r_rates_m'), { size: 12, w: 700 });
      s += `<path d="M200 140 V170 H400 V140 M300 170 V200" fill="none" stroke="${C.ink}" stroke-width="2"/>` + Q.G('ind_Aa', Q.ind(300, 226, 22, 'Aa')) + T(300, 264, t('r_rates_c'), { size: 12, w: 700 });
      s += LB(300, 300, t('r_rates_new'), { size: 12.5, w: 800, col: C.hl });
    } else if (a.v === 'scale') {
      s += T(300, 60, t('r_rates_pernt'), { size: 14, w: 800 });
      for (let i = 0; i < 60; i++) s += `<rect x="${60 + (i % 30) * 16}" y="${100 + Math.floor(i / 30) * 18}" width="12" height="12" fill="${i === 17 || i === 44 ? C.der : C.anc}"/>`;
      s += Q.arrow(300, 150, 300, 200, C.ink, 2) + T(300, 230, t('r_rates_pergam'), { size: 14, w: 800 });
    } else {
      s += `<path d="M150 200 V100 H460 M150 200 V300 H460" fill="none" stroke="${C.ink}" stroke-width="2.4"/>` + T(470, 100, t('r_rates_sp1'), { a: 'l', size: 13, w: 800 }) + T(470, 300, t('r_rates_sp2'), { a: 'l', size: 13, w: 800 });
      [220, 300, 380].forEach(x => { s += `<circle cx="${x}" cy="100" r="5" fill="${C.der}"/>`; });
      [260, 340].forEach(x => { s += `<circle cx="${x}" cy="300" r="5" fill="${C.der}"/>`; });
      s += LB(300, 200, t('r_rates_fixed'), { size: 12.5, w: 700 }) + T(16, 340, t('r_tree_len'), { a: 'l', size: 11, col: C.muted });
    }
    return s;
  });

  /* ·7 сколько вариантов возникает на одно замещение (ME.neutral) */
  reg('s14_r_onesub', (a, t) => {
    let s = '';
    if (a.site) {
      s += T(300, 40, t('r_onesub_site'), { size: 14, w: 800, n: 60 });
      s += `<rect x="80" y="120" width="440" height="40" rx="6" fill="#F3F5F8" stroke="#C9D3DF"/>` + V.G('subst', `<rect x="296" y="120" width="8" height="40" fill="${C.ink}"/>`);
      s += Q.line(80, 250, 520, 250, '#8A97A8', 1.2);
      [0, 50, 100, 150, 200].forEach((v, i) => { const x = 80 + i * 110; s += Q.line(x, 246, x, 254, '#8A97A8', 1.2) + T(x, 268, String(v), { size: 11 }); });
      s += T(520, 286, t('r_onesub_gax'), { a: 'r', size: 11, col: C.muted });
      [100, 200].forEach(v => { const x = 80 + v * 2.2; s += V.G('subst', `<circle cx="${x}" cy="250" r="7" fill="${C.ink}"/>`); });
      s += T(300, 190, t('r_onesub_gens'), { size: 13, w: 800 }) + T(300, 214, t('r_onesub_avg'), { size: 11.5, col: C.muted });
      return s;
    }
    const r = ME.neutral(a.N), big = a.N > 1e4;
    s += T(300, 30, 'N = ' + (big ? '1 000 000' : '10 000') + ' · 2N = ' + (big ? '2 000 000' : '20 000'), { size: 14, w: 800 });
    const n = big ? 200 : 2; for (let i = 0; i < 200; i++) s += `<circle cx="${f(52 + (i % 25) * 20.5)}" cy="${f(72 + Math.floor(i / 25) * 26)}" r="6" fill="${i >= n ? '#fff' : i === 0 ? '#2C7FB8' : '#C9D3DF'}" stroke="${i >= n ? '#E3E8EE' : 'none'}"/>`;
    s += LB(300, 310, t('r_onesub_arose', { n: big ? '2 000 000' : '20 000' }), { size: 12.5, w: 700 }) + LB(300, 336, t('r_onesub_one'), { size: 12.5, w: 800, col: '#2C7FB8' });
    s += T(300, 362, t('r_onesub_each10k'), { size: 11, col: C.muted });
    return s;
  });

  /* ·9 почти нейтральный вариант: кратность шанса от 2Ns (ME.fixprobEA), полоса |2Ns| ≤ 1, точки N = 100 и 10 000 */
  reg('s14_r_nearly', (a, t) => {
    const X0 = 80, X1 = 560, X = v => X0 + (X1 - X0) * (v + 25) / 30, Y = r => 330 - (Math.log10(r) + 9) * 28;
    let s = T(300, 22, t('r_nearly_head'), { size: 13, w: 700, col: C.muted });
    s += `<rect x="${f(X(-1))}" y="50" width="${f(X(1) - X(-1))}" height="280" fill="#2C7FB8" opacity=".10"/>` + `<rect x="80" y="384" width="16" height="12" fill="#2C7FB8" opacity=".25"/>` + T(102, 390, t('r_nearly_band'), { a: 'l', size: 11, w: 700, col: '#2C7FB8' });
    for (let e = -8; e <= 0; e += 2) s += Q.line(X0, Y(Math.pow(10, e)), X1, Y(Math.pow(10, e)), '#EDF1F5', 1) + T(X0 - 6, Y(Math.pow(10, e)), e ? '10' + V.sup(e) : '1', { a: 'r', size: 11 });
    [-25, -20, -10, -5, 0, 5].forEach(v => { s += T(X(v), 346, String(v).replace('-', '−'), { size: 11 }); });
    s += T(X1, 362, t('r_nearly_x'), { a: 'r', size: 11.5, col: C.muted }) + T(14, 40, t('r_nearly_y') + ' · ' + t('log_scale'), { a: 'l', size: 11, w: 700, col: C.muted });
    let pts = []; for (let v = -25; v <= 5; v += .25) { const r = ME.fixprobEA(v); if (r >= 1e-9 && Y(r) >= 50) pts.push(f(X(v)) + ',' + f(Y(r))); }
    s += T(X0, 362, t('r_nearly_rm'), { a: 'l', size: 11.5, w: 700, col: C.muted });
    s += V.G('fix_curve', `<polyline points="${pts.join(' ')}" fill="none" stroke="${C.ink}" stroke-width="2.2"/>`);
    const P = [[100, -0.2], [10000, -20]];
    P.forEach(([N, v]) => { const on = !a.curve && a.N === N || a.curve, r = ME.nearly(N).ratio;
      s += V.G('nearly_point', `<circle cx="${f(X(v))}" cy="${f(Y(r))}" r="${on ? 7 : 4}" fill="${on ? '#2C7FB8' : '#8A97A8'}"/>`) +
        (on ? LB(X(v) + (v < -10 ? 10 : -10), Y(r) - 16, 'N = ' + (N === 100 ? '100' : '10 000') + ': ' + (r < 1e-4 ? V.sci(r) : V.dec(r, 2)), { a: v < -10 ? 'l' : 'r', size: 11.5, w: 800 }) : ''); });
    return s;
  });

  /* ·10 синонимичные и несинонимичные сайты кодона (ME.codonSites; замены к стоп-кодону не учитываются) */
  reg('s14_r_sites', (a, t) => {
    let s = '';
    if (a.seq) {
      const X = ME.DNDS_X.match(/.{3}/g), S0 = ME.seqSites(ME.DNDS_X);
      s += T(300, 24, t('r_sites_seq'), { size: 13, w: 700, col: C.muted });
      s += V.codons({ x: 10, y: 60, per: 6, cw: 86, labW: 44, rows: [{ lab: t('t2_d_x'), codons: X, aa: X.map(c => V.AA3[ME.CODE[c]]) }], diff: [] });
      X.forEach((c, j) => { const cs = ME.codonSites(c), x = 54 + (j % 6) * 86 + 41, y = 60 + Math.floor(j / 6) * 70 + 46; s += T(x, y, V.dec(cs.S, 2) + ' / ' + V.dec(cs.N, 2), { size: 10.5, col: C.muted }); });
      s += LB(300, 250, t('r_sites_tot', { s: V.dec(S0.S, 2), n: V.dec(S0.N, 2) }), { size: 13, w: 800 });
      s += T(300, 280, t('r_sites_each'), { size: 11, col: C.muted });
      return s;
    }
    const c = a.codon, cs = ME.codonSites(c), B = ['A', 'C', 'G', 'T'];
    s += T(300, 24, t('r_sites_codon', { c, aa: V.AA3[ME.CODE[c]] }), { size: 14, w: 800 });
    for (let p = 0; p < 3; p++) {
      const x = 90 + p * 170; s += T(x + 40, 60, t('r_sites_pos', { p: p + 1 }), { size: 12, w: 700 });
      B.filter(b => b !== c[p]).forEach((b, i) => { const m = c.slice(0, p) + b + c.slice(p + 1), aa = ME.CODE[m], y = 100 + i * 64;
        const kind = aa === '*' ? 'stop' : aa === ME.CODE[c] ? 'syn' : 'non';
        s += `<rect x="${x}" y="${y}" width="80" height="44" rx="6" fill="#fff" stroke="${kind === 'syn' ? C.syn : kind === 'non' ? C.non : '#C0392B'}" stroke-width="1.8"${kind === 'stop' ? ' stroke-dasharray="4 3"' : ''}/>` +
          T(x + 40, y + 14, m, { size: 12, w: 800 }) + T(x + 40, y + 32, V.AA3[aa], { size: 11, col: C.muted });
        if (kind === 'syn') s += V.syn(x + 92, y + 22, 6); else if (kind === 'non') s += V.non(x + 92, y + 22, 7); else s += T(x + 92, y + 22, '×', { size: 14, w: 800, col: '#C0392B' }); });
      s += T(x + 40, 300, t('r_sites_s', { v: V.dec(cs.pos[p].S, 2) }), { size: 11.5, w: 700 });
    }
    s += V.syn(60, 340, 6) + T(72, 340, t('r_sites_syn'), { a: 'l', size: 11 }) + V.non(220, 340, 7) + T(234, 340, t('r_sites_non'), { a: 'l', size: 11 }) + T(380, 340, '× ' + t('r_sites_stop'), { a: 'l', size: 11, col: '#C0392B' });
    return s;
  });

  /* ·12 чего dN/dS не показывает: четыре панели */
  reg('s14_r_limits', (a, t) => {
    let s = T(300, 22, t('r_lim_t_' + a.lim), { size: 14, w: 800 });
    if (a.lim === 'avg') {
      const w = [.1, .1, .2, .1, 3, .1, .1, .2, .1, .1, 2.5, .1];
      w.forEach((v, i) => { const x = 60 + i * 36, h = Math.min(160, v * 50); s += V.G('codon_omega', `<rect x="${x}" y="${f(260 - h)}" width="28" height="${f(h)}" fill="${v > 1 ? '#3F6E73' : '#8A97A8'}"/>`); });
      const avg = w.reduce((p, q) => p + q, 0) / w.length;
      s += Q.line(50, 260 - 50, 484, 260 - 50, C.ink, 1.6, 'stroke-dasharray="6 4"') + T(490, 210, 'ω = 1', { a: 'l', size: 11.5, w: 700 });
      s += Q.line(50, 260 - avg * 50, 484, 260 - avg * 50, '#2C7FB8', 2) + T(490, 260 - avg * 50, t('r_lim_mean', { v: V.dec(avg, 2) }), { a: 'l', size: 11, w: 700, col: '#2C7FB8' });
      s += T(300, 280, t('r_lim_codons'), { size: 11, col: C.muted });
    } else if (a.lim === 'syn') {
      s += V.codons({ x: 60, y: 90, per: 6, cw: 76, labW: 0, rows: [{ lab: '', codons: ['CTG', 'GCT', 'AAA', 'GGC', 'TTC', 'GAA'], aa: ['Leu', 'Ala', 'Lys', 'Gly', 'Phe', 'Glu'] }], diff: [{ i: 1, kind: 'syn' }], frames: true, marks: true });
      s += LB(300, 200, t('r_lim_synsel'), { size: 12.5, w: 700, n: 60 });
    } else if (a.lim === 'sat') {
      s += V.align({ x: 100, y: 80, cw: 36, ch: 24, labW: 120, rows: [{ lab: t('r_lim_anc'), seq: 'AGT', st: null }, { lab: t('r_lim_mid'), seq: 'ACT', st: [null, 'der', null] }, { lab: t('r_lim_now'), seq: 'AGT', st: [null, 'anc', null] }] });
      s += T(360, 140, t('r_lim_rep'), { a: 'l', size: 11.5, w: 700, col: C.hl }) + T(360, 164, t('r_lim_vis'), { a: 'l', size: 11.5, col: C.muted }) + LB(300, 220, t('r_lim_satx'), { size: 12.5, w: 700, n: 60 });
    } else {
      const br = (x1, y1, x2, y2) => `<path d="M${x1} ${y1} V${y2} H${x2}" fill="none" stroke="${C.ink}" stroke-width="2.2"/>`;
      s += `<rect x="96" y="${200 - 9}" width="18" height="18" fill="${C.ink}"/>` + T(50, 200, t('t4_t_dup'), { size: 11, w: 700 });
      s += br(114, 200, 200, 120) + br(114, 200, 200, 280) + br(200, 120, 440, 80) + br(200, 120, 440, 160) + br(200, 280, 440, 240) + br(200, 280, 440, 320);
      [['A', 80], ['B', 160], ['A', 240], ['B', 320]].forEach(([sp, y], i) => { s += T(450, y, t('r_lim_gene', { g: i < 2 ? 1 : 2, sp }), { a: 'l', size: 12, w: 700 }); });
      s += LB(330, 120, t('r_lim_ortho'), { size: 11, w: 700, col: '#2C7FB8' }) + LB(150, 140, t('r_lim_para'), { size: 11, w: 700, col: C.hl }) + T(16, 350, t('r_tree_len'), { a: 'l', size: 11, col: C.muted });
    }
    return s;
  });

  /* ·14 среднее по гену скрывает отбор в отдельных кодонах (ME.siteMix) */
  reg('s14_r_mix', (a, t) => {
    const m = ME.siteMix({ codons: 100, purifying: { n: 100 - a.pos, omega: .1 }, positive: { n: a.pos, omega: 5 } }), avg = m.average_omega;
    let s = T(300, 16, t('r_mix_head', { k: a.pos }), { size: 12, w: 700, col: C.muted, n: 76 });
    for (let i = 0; i < 100; i++) { const pos = i >= 100 - a.pos; s += V.G(pos ? 'codon_pos' : 'codon_pur', `<rect x="${60 + (i % 20) * 24}" y="${50 + Math.floor(i / 20) * 26}" width="20" height="20" rx="3" fill="${pos ? '#3F6E73' : '#B7C0CB'}"/>`); }
    s += `<rect x="60" y="200" width="16" height="12" fill="#B7C0CB"/>` + T(82, 206, t('r_mix_pur'), { a: 'l', size: 11.5 }) + `<rect x="300" y="200" width="16" height="12" fill="#3F6E73"/>` + T(322, 206, t('r_mix_pos'), { a: 'l', size: 11.5 });
    const X = v => 60 + v * 240;
    s += Q.line(X(0), 290, X(2), 290, '#8A97A8', 1.4);
    [0, .5, 1, 1.5, 2].forEach(v => { s += Q.line(X(v), 285, X(v), 295, '#8A97A8', 1.2) + T(X(v), 310, V.trim(V.dec(v, 1)), { size: 11 }); });
    s += `<line x1="${X(1)}" y1="276" x2="${X(1)}" y2="300" stroke="${C.ink}" stroke-width="2" stroke-dasharray="6 4"/>`;
    s += V.G('mean_omega', `<circle cx="${f(X(avg))}" cy="290" r="9" fill="#2C7FB8"/>`) + LB(X(avg), 250, t('r_mix_mean', { v: V.trim(V.dec(avg, 3)) }), { size: 12.5, w: 800 });
    return s;
  });

  /* ·20 две калибровки: согласованные — общая часть скоростей; противоречащие — общей части нет */
  reg('s14_r_calib2', (a, t) => {
    const X0 = 80, X1 = 540, X = r => X0 + (X1 - X0) * r / .005;
    let s = T(300, 22, t('r_calib2_head'), { size: 13, w: 700, col: C.muted });
    s += Q.line(X0, 300, X1, 300, '#8A97A8', 1.2);
    [0, .001, .002, .003, .004, .005].forEach(r => { s += Q.line(X(r), 296, X(r), 304, '#8A97A8', 1.2) + T(X(r), 318, V.trim(V.dec(r, 3)), { size: 11 }); });
    s += T(X1, 336, t('r_calib2_x'), { a: 'r', size: 11, col: C.muted });
    const R = a.ok ? [[.0017778, .0022857], [.002, .0024]] : [[.001, .002], [.003, .004]];
    R.forEach(([lo, hi], i) => { const y = 100 + i * 70; s += T(X0, y - 22, t('r_calib2_c' + (i + 1)), { a: 'l', size: 12, w: 700 }) + V.band(X(lo), X(hi), y, 22, 'rate_band'); });
    if (a.ok) { s += V.G('rate_common', `<rect x="${f(X(.002))}" y="230" width="${f(X(.0022857) - X(.002))}" height="22" fill="${C.cal}"/>`) + LB(X(.0021), 270, t('r_calib2_common'), { size: 12, w: 800, col: C.cal }); }
    else s += LB(300, 240, t('r_calib2_none'), { size: 12.5, w: 800, col: C.hl });
    return s;
  });

  /* ·22 четыре исхода дупликации — дерево копий вкладки 4, выбранный исход выделен */
  reg('s14_r_copies', (a, t) => GN.s14_t4.mk(t).drawT({ o: a.o }));
  /* ·23 ген из некодирующей ДНК — карточка вкладки 4 */
  reg('s14_r_denovo', (a, t) => GN.s14_t4.mk(t).drawS({ card: 'denovo', st: a.st }));
  /* ·24 мобильные элементы — карточка вкладки 4: ДНК-транспозон, ретротранспозон, последствия вставки */
  reg('s14_r_te', (a, t) => GN.s14_t4.mk(t).drawS({ card: 'te', te: a.te, cardOnly: a.te !== 'fx' }));

  /* ·25 как отличить перенос гена от загрязнения: путь переноса, проверка сборки, дерево генов */
  reg('s14_r_hgt', (a, t) => {
    let s = T(300, 22, t('r_hgt_' + a.v), { size: 14, w: 800 });
    if (a.v === 'path') {
      ['r_hgt_p1', 'r_hgt_p2', 'r_hgt_p3', 'r_hgt_p4'].forEach((k, i) => { const x = 20 + i * 146; s += box(x, 120, 130, 80, true) + T(x + 65, 160, t(k), { size: 12, w: 700, n: 16 });
        if (i < 3) s += Q.arrow(x + 131, 160, x + 145, 160, C.ink, 1.8); });
    } else if (a.v === 'assembly') {
      const seg = (x, y, w, col) => `<rect x="${x}" y="${y - 9}" width="${w}" height="18" rx="2" fill="${col}"/>`;
      s += T(20, 90, t('r_hgt_host'), { a: 'l', size: 12, w: 700 }) + seg(20, 120, 80, '#7F8C9A') + seg(110, 120, 80, '#7F8C9A') + seg(200, 120, 90, '#9A7B5B') + seg(300, 120, 80, '#7F8C9A') + seg(390, 120, 80, '#7F8C9A');
      s += T(245, 146, t('r_hgt_gene'), { size: 11, w: 700, col: '#9A7B5B' });
      s += T(20, 210, t('r_hgt_bact'), { a: 'l', size: 12, w: 700, col: C.hl }) + seg(20, 240, 90, '#9A7B5B') + seg(120, 240, 90, '#C9A97B') + seg(220, 240, 90, '#C9A97B') + seg(320, 240, 90, '#C9A97B');
      s += T(20, 300, t('r_hgt_samples'), { a: 'l', size: 12, w: 700 });
    } else {   /* дерево гена: ген эукариоты 2 вложен в группу бактерий-доноров */
      const br = (x1, y1, x2, y2, col = C.ink) => `<path d="M${x1} ${y1} V${y2} H${x2}" fill="none" stroke="${col}" stroke-width="2.2"/>`;
      s += br(70, 210, 150, 120) + br(70, 210, 150, 300) + br(150, 120, 380, 70) + br(150, 120, 250, 170) + br(250, 170, 380, 145) + br(250, 170, 380, 200, '#9A7B5B') + br(150, 300, 380, 270) + br(150, 300, 380, 330);
      [[70, 'r_hgt_t_b1', C.ink], [145, 'r_hgt_t_b2', C.ink], [200, 'r_hgt_t_x', '#9A7B5B'], [270, 'r_hgt_t_e1', C.ink], [330, 'r_hgt_t_e2', C.ink]].forEach(([y, k, col]) => { s += T(390, y, t(k), { a: 'l', size: 11.5, w: 700, col, n: 30 }); });
      s += T(16, 360, t('r_tree_len'), { a: 'l', size: 11, col: C.muted });
    }
    return s;
  });

  /* ·26 митохондриальная ДНК: материнская передача, без рекомбинации, гетероплазмия */
  reg('s14_r_mtdna', (a, t) => {
    let s = T(300, 22, t('r_mt_' + a.p), { size: 14, w: 800 });
    const mt = (x, y, r, col) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="3"/>`;
    if (a.p === 'maternal') {
      s += `<circle cx="200" cy="90" r="22" fill="#F3EDE4" stroke="#9A7B5B"/>` + mt(200, 90, 9, '#2E7D5B') + T(200, 124, t('r_mt_mother'), { size: 12, w: 700 });
