": "Вспомните: мутация — изменение последовательности, ставшее согласованным в обеих цепях ДНК", "t1_back1_href": "seminar-8-route.html#error-damage-mutation", "t1_back2": "синонимичная замена меняет кодон, но не аминокислоту", "t1_back2_href": "seminar-10-route.html#sequence-changes", "t1_back3": "новая нейтральная копия закрепляется с вероятностью, равной её частоте", "t1_back3_href": "seminar-13-route.html#fixation", "t1_back4": "история гена и история линии могут не совпадать: дупликации, потери, перенос", "t1_back4_href": "seminar-12-route.html#hgt", "t1_title": "От мутации к замещению", "t1_rules": "Одна новая копия варианта в популяции из N диплоидных особей: её начальная частота 1/(2N). Каждое поколение сначала действует отбор (приспособленность без варианта 1, у гетерозиготы 1 + s/2, у гомозиготы по варианту 1 + s; s — коэффициент отбора), затем случайно набираются 2N копий следующего поколения. Шанс закрепления — расчёт по формуле популяционной генетики; повторы — та же модель со случайной выборкой и закреплёнными начальными значениями генератора. Вариант, который закрепился, стал замещением — различием этой популяции с другими. Численность и s условные", "t1_lim": "Модель не показывает, где и почему произошло мутационное событие, рекомбинации, нескольких вариантов сразу и смены условий. Коэффициент отбора в модели постоянен; в природе он может меняться со средой, возрастом и генетическим фоном. Эффективная численность принята равной фактической", "t1_how": "Вероятность закрепления новой мутации при дрейфе и отборе рассчитали в середине XX века средствами теории вероятностей; позже расчёты проверили имитацией на компьютере и экспериментами с малыми лабораторными популяциями. Скорость возникновения мутаций у человека сейчас измеряют прямо: сравнивают геномы родителей и детей", "t1_s1_title": "Событие, вариант, различие", "t1_s1_cond": "Выровнены последовательности шести особей вида 1 и шести особей вида 2. В позиции 7 у особи 3 вида 1 — T, у всех остальных одиннадцати особей — C", "t1_s1_q": "Что видно в позиции 7?", "t1_s1_o1": "Вариант внутри вида 1, а не различие между видами", "t1_s1_x1": "Да: у остальных особей вида 1 там C, как у вида 2. Это полиморфизм, а не замещение", "t1_s1_o2": "Замещение между видами 1 и 2", "t1_s1_x2": "Замещение — различие, закреплённое во всей популяции. Здесь T есть у одной особи из шести", "t1_s1_o3": "Мутационное событие, произошедшее в этом поколении", "t1_s1_x3": "Видно состояние последовательности — вариант. Когда произошло событие, по одной выборке сказать нельзя: вариант мог возникнуть много поколений назад", "t1_s1_h1": "Сколько особей вида 1 несут T?", "t1_s1_h2": "Чем различие внутри вида отличается от различия между видами?", "t1_s1_h3": "Замещение — вариант, достигший частоты 1", "t1_s1_e": "Мутационное событие — однократное изменение в одной молекуле ДНК. Вариант — наблюдаемое состояние последовательности. Полиморфизм — сосуществование вариантов в популяции. Замещение — вариант, закрепившийся в популяции; различие между видами складывается из замещений", "t1_s2_title": "Что происходит с новой нейтральной копией", "t1_s2_cond": "Популяция из 100 особей, то есть 200 копий локуса. Возникла одна новая копия варианта, не влияющего на приспособленность (s = 0). Смотрим 10 независимых повторов", "t1_s2_q": "Сколько из 10 копий, вероятнее всего, исчезнет?", "t1_s2_o1": "Почти все", "t1_s2_x1": "Да: каждая закрепляется с вероятностью 1/200 = 0,005, то есть в среднем одна из двухсот", "t1_s2_o2": "Около половины: вариант нейтрален", "t1_s2_x2": "Нейтральность значит, что вариант не влияет на приспособленность. Шанс закрепления при этом равен его частоте — 0,005, а не 0,5", "t1_s2_o3": "Ни одна: нейтральный вариант не испытывает отбора, значит, сохранится", "t1_s2_x3": "Без отбора частоту меняет случайная выборка копий. Редкий вариант чаще всего выпадает из выборки", "t1_s2_h1": "Чему равна частота новой копии среди 200?", "t1_s2_h2": "Вспомните, с какой вероятностью закрепляется нейтральная копия", "t1_s2_h3": "Вероятность закрепления равна начальной частоте", "t1_s2_e": "Большинство новых вариантов исчезает в первые поколения, даже если они нейтральны. Возникновение варианта ещё не означает, что он станет различием между видами", "t1_s3_title": "Конструктор: численность и польза", "t1_s3_cond": "Новая копия варианта, который повышает приспособленность гомозиготы на 1 % (s = +0,01; у гетерозиготы — на 0,5 %). Сравниваем популяции из 10 и из 1000 особей", "t1_s3_q": "Во сколько раз такой вариант закрепляется чаще нейтрального?", "t1_s3_o1": "При 10 особях почти так же, как нейтральный; при 1000 — примерно в 20 раз чаще", "t1_s3_x1": "Да: 1,10 и 19,9. В малой популяции слабый отбор почти не заметен на фоне дрейфа", "t1_s3_o2": "Одинаково: польза варианта та же", "t1_s3_x2": "Польза та же, но при 10 особях случайные колебания частоты намного сильнее, чем действие отбора в 1 %", "t1_s3_o3": "При 10 особях чаще: копий меньше, вариант быстрее распространится", "t1_s3_x3": "Быстрее идут и распространение, и потеря. Отбор становится заметен, когда величина 2Ns много больше 1: при N = 10 она 0,2, при N = 1000 — 20", "t1_s3_h1": "Что сильнее при малой численности — отбор или дрейф?", "t1_s3_h2": "Сравните 2N·s при N = 10 и N = 1000", "t1_s3_h3": "Если 2Ns много меньше 1, вариант ведёт себя почти как нейтральный", "t1_s3_e": "Сам шанс одной копии при 10 особях выше (около 5,5 %), но только потому, что выше её начальная частота 1/(2N); по сравнению с нейтральной копией он почти тот же. Действие отбора определяет произведение численности на коэффициент отбора. Даже полезный вариант в большой популяции чаще всего исчезает: при N = 1000 его шанс около 1 %", "t1_s4_title": "Изменение условий задачи: вредный вариант", "t1_s4_cond": "Тот же конструктор, но вариант снижает приспособленность гомозиготы на 1 % (s = −0,01). Численность — 100 особей", "t1_s4_q": "Может ли такой вариант закрепиться?", "t1_s4_o1": "Может, но реже нейтрального — примерно в три раза", "t1_s4_x1": "Да: кратность 0,31. При 2Ns = −2 отбор заметен, но дрейф ещё может довести вариант до закрепления", "t1_s4_o2": "Нет: отбор всегда удаляет вредные варианты", "t1_s4_x2": "Отбор удаляет вредный вариант надёжно, только когда |2Ns| много больше 1. Здесь |2Ns| = 2", "t1_s4_o3": "Так же часто, как нейтральный", "t1_s4_x3": "При 100 особях отбор в 1 % уже заметен: шанс втрое ниже нейтрального", "t1_s4_h1": "Чему равно 2N·s?", "t1_s4_h2": "При |2Ns| около 1–2 действуют и отбор, и дрейф", "t1_s4_h3": "Сравните с таблицей: N = 100, s = −0,01", "t1_s4_e": "Слабовредный вариант может закрепиться в малой популяции. Чем больше численность, тем надёжнее отбор его удаляет", "t1_s5_title": "Возникает чаще — не значит полезнее", "t1_s5_cond": "В геноме сравнивают, какие однонуклеотидные изменения возникают у детей и отсутствуют у родителей. Замены C на T в сочетании CG встречаются заметно чаще, чем другие замены", "t1_s5_q": "Почему одни замены возникают чаще других?", "t1_s5_o1": "Одни повреждения и ошибки происходят чаще других", "t1_s5_x1": "Да: метилированный цитозин в CG при дезаминировании превращается в тимин, и такая замена возникает часто независимо от последствий", "t1_s5_o2": "Отбор заранее отсеивает более редкие замены", "t1_s5_x2": "Отбор действует на вариант уже после возникновения; частота возникновения от него не зависит", "t1_s5_o3": "Частые замены полезнее для самого организма", "t1_s5_x3": "Частота возникновения изменения не связана с его пользой: мутации возникают без учёта будущих последствий", "t1_s5_h1": "Что здесь сравнивают — возникновение или закрепление?", "t1_s5_h2": "Вспомните, какие повреждения ДНК самопроизвольно превращают одно основание в другое", "t1_s5_h3": "Дезаминирование метилированного цитозина даёт тимин", "t1_s5_e": "Скорость и спектр мутаций описывают возникновение вариантов. Что произойдёт с вариантом дальше, зависит от отбора и дрейфа. Поэтому одинаковое различие у двух линий может возникнуть повторно и независимо, если оно возникает часто", "t1_s6_title": "Функциональный и селективный эффект", "t1_s6_cond": "Замена в гене фермента вдвое снижает его активность в пробирке. У носителей одной копии активности хватает: выживаемость и число потомков у них такие же, как у остальных (условно)", "t1_s6_q": "Каков селективный эффект варианта у носителей одной копии?", "t1_s6_o1": "Близок к нулю в этих условиях", "t1_s6_x1": "Да: изменился продукт гена, но не вклад носителя в следующие поколения", "t1_s6_o2": "Вредный: активность снижена вдвое", "t1_s6_x2": "Снижение активности — функциональный эффект. Селективный эффект — изменение вклада в следующее поколение; здесь его нет", "t1_s6_o3": "Полезный: организм экономит на ферменте", "t1_s6_x3": "Данных о пользе нет: выживаемость и число потомков не изменились", "t1_s6_h1": "Что изменилось — продукт гена или число потомков?", "t1_s6_h2": "Селективный эффект измеряют вкладом в следующее поколение", "t1_s6_h3": "Сравните столбики «активность» и «вклад»", "t1_s6_e": "Функциональный эффект описывает изменение продукта или клетки, селективный — изменение вклада в следующие поколения. Первый не определяет второй: селективный эффект зависит от среды, генетического фона и доминирования. Будет ли отбор заметен на фоне дрейфа, зависит ещё и от численности (шаг 2.2)", "t2_title": "Нейтральная эволюция и dN/dS", "t2_rules": "Нейтральная теория: за поколение в популяции из N диплоидных особей возникает 2N·μ новых нейтральных копий на сайт (μ — скорость нейтральных мутаций на сайт за поколение); каждая закрепляется с вероятностью 1/(2N); их произведение — μ замещений на сайт за поколение, при любой N. Почти нейтральный вариант: если |s| не больше 1/(2N), частоту варианта меняет главным образом дрейф. Счётчик: dN — число несинонимичных различий, делённое на число несинонимичных сайтов; dS — то же для синонимичных; dN/dS — их отношение. Числа сайтов посчитаны заранее по правилу: в каждой позиции кодона учитываются три возможные замены, кроме ведущих к стоп-кодону. Последовательности и параметры условные", "t2_lim": "Модель не учитывает повторных замен в одном сайте, различий частоты разных замен, рекомбинации и ошибок выравнивания. Ген в ней один, ветвь одна; отдельные кодоны и ветви требуют отдельных моделей. Нейтральность синонимичных замен — допущение", "t2_how": "Нейтральную теорию предложили в конце 1960-х годов, когда сравнили белки разных видов и обнаружили, что аминокислотные замены накапливаются быстро и почти равномерно во времени. Позже, сравнив последовательности генов, увидели, что синонимичные различия в большинстве генов накапливаются быстрее несинонимичных, — так и предсказывает теория, если большинство несинонимичных замен вредно", "t2_s1_title": "Численность и скорость нейтральных замещений", "t2_s1_cond": "Две популяции одного вида: 10 000 и 1 000 000 особей. В обеих скорость нейтральных мутаций одинакова — 10⁻⁸ на сайт за поколение. Ген — 1000 сайтов", "t2_s1_q": "В какой популяции нейтральные замещения в этом гене накапливаются быстрее?", "t2_s1_o1": "Одинаково: 10⁻⁵ замещений за поколение в обеих", "t2_s1_x1": "Да: в большой популяции новых копий в 100 раз больше, но каждая закрепляется в 100 раз реже", "t2_s1_o2": "В большой: в ней возникает больше новых вариантов", "t2_s1_x2": "Больше и возникает, и теряется: шанс каждой копии 1/(2N) в 100 раз ниже", "t2_s1_o3": "В малой: дрейф в ней сильнее", "t2_s1_x3": "Дрейф сильнее для каждой копии, но новых копий возникает в 100 раз меньше", "t2_s1_h1": "Сколько новых копий возникает за поколение в каждой популяции?", "t2_s1_h2": "С какой вероятностью закрепляется каждая?", "t2_s1_h3": "Перемножьте", "t2_s1_e": "Скорость нейтральных замещений равна скорости нейтральных мутаций и не зависит от численности. Численность меняет другое: сколько вариантов одновременно есть в популяции и как долго они там держатся; для слабовредных вариантов — и шанс закрепления (шаг 2.2)", "t2_s2_title": "Почти нейтральный вариант", "t2_s2_cond": "Вариант снижает приспособленность гомозиготы на 0,1 % (s = −0,001). Популяции из 100 и из 10 000 особей", "t2_s2_q": "В какой популяции этот вариант может закрепиться почти так же часто, как нейтральный?", "t2_s2_o1": "В популяции из 100 особей", "t2_s2_x1": "Да: там |s| = 0,001 меньше порога 1/(2N) = 0,005; шанс — 0,90 от нейтрального", "t2_s2_o2": "В популяции из 10 000: в ней возникает больше таких копий", "t2_s2_x2": "Вопрос о шансе каждой копии. При 10 000 особях |2Ns| = 20, и отбор практически не даёт варианту закрепиться", "t2_s2_o3": "Ни в какой: вредный вариант всегда удаляется", "t2_s2_x3": "Отбор удаляет вариант надёжно, только если |s| много больше 1/(2N). В малой популяции слабовредный вариант ведёт себя почти как нейтральный", "t2_s2_h1": "Сравните |s| с 1/(2N) для каждой популяции", "t2_s2_h2": "Порог для 100 особей — 0,005, для 10 000 — 0,00005", "t2_s2_h3": "Если |s| меньше порога, главную роль играет дрейф", "t2_s2_e": "Один и тот же вариант может быть почти нейтральным в малой популяции и вредным в большой. Нейтральность — свойство варианта в определённой популяции и среде, а не только самой замены", "t2_s3_title": "Синонимичные и несинонимичные различия", "t2_s3_cond": "Выровнены 12 кодонов вида X и вида Y (режим 1). Аминокислоты подписаны под кодонами", "t2_s3_q": "Сколько различий синонимичных и сколько несинонимичных?", "t2_s3_o1": "3 синонимичных и 1 несинонимичное", "t2_s3_x1": "Да: в кодонах 2, 5 и 8 аминокислота та же (Ala, Gly, Pro), в кодоне 4 Lys заменён на Glu", "t2_s3_o2": "4 несинонимичных: все различия меняют ДНК", "t2_s3_x2": "Синонимичная замена тоже меняет ДНК, но не меняет аминокислоту", "t2_s3_o3": "2 и 2: зависит от положения в кодоне", "t2_s3_x3": "Важна не позиция, а то, меняется ли аминокислота. Различие в кодоне 4 стоит в первой позиции и меняет аминокислоту; в остальных — в третьей, и аминокислота та же", "t2_s3_h1": "Сравните аминокислоты под каждым различающимся кодоном", "t2_s3_h2": "Синонимичная замена: кодон другой, аминокислота та же", "t2_s3_h3": "Посмотрите кодон 4: AAA и GAA", "t2_s3_e": "Синонимичное различие меняет кодон, но не аминокислоту; несинонимичное меняет аминокислоту. Различия считают по каждому кодону, сверяясь с генетическим кодом", "t2_s4_title": "Почему делят на число сайтов", "t2_s4_cond": "Синонимичных различий 3, несинонимичных 1. Синонимичных сайтов 8,33, несинонимичных 27,67", "t2_s4_q": "Чему равно dN/dS и почему нельзя просто сравнить 3 и 1?", "t2_s4_o1": "0,10: различия считают на сайт, а сайтов не поровну", "t2_s4_x1": "Да: dS = 3/8,33 = 0,36, dN = 1/27,67 = 0,036; отношение 0,10", "t2_s4_o2": "3: синонимичных различий втрое больше", "t2_s4_x2": "Сравнивать числа различий нельзя: возможностей для несинонимичной замены в гене примерно втрое больше", "t2_s4_o3": "0,33: одно несинонимичное различие на три", "t2_s4_x3": "Это отношение чисел различий, а не различий на сайт", "t2_s4_h1": "Какая доля замен в кодоне меняет аминокислоту?", "t2_s4_h2": "Разделите каждое число различий на своё число сайтов", "t2_s4_h3": "1/27,67 и 3/8,33", "t2_s4_e": "dN/dS меньше 1: несинонимичные изменения закреплялись реже синонимичных. Это ожидается, если большинство изменений аминокислот вредно и их удаляет очищающий отбор", "t2_s5_title": "Значение около 1", "t2_s5_cond": "Переключатель — режим 2: 2 синонимичных и 7 несинонимичных различий", "t2_s5_q": "dN/dS = 0,97. Что можно заключить?", "t2_s5_o1": "Совместимо с нейтральностью, но не доказывает её", "t2_s5_x1": "Да: такое же среднее даёт смесь кодонов под очищающим и под положительным отбором", "t2_s5_o2": "Ген вообще не испытывает никакого отбора", "t2_s5_x2": "Среднее около 1 может складываться из кодонов с очень разным давлением отбора", "t2_s5_o3": "Ген испытывает сильный положительный отбор", "t2_s5_x3": "Положительный отбор в среднем по гену дал бы значение больше 1; около 1 его не доказывает, но и не исключает в отдельных кодонах", "t2_s5_h1": "Какие разные причины дают одно и то же среднее?", "t2_s5_h2": "Представьте ген, где часть кодонов меняется редко, а часть — очень часто", "t2_s5_h3": "Среднее не показывает распределения", "t2_s5_e": "Отношение — среднее по гену. Чтобы различить нейтральность и смесь давлений, нужны оценки по отдельным кодонам и ветвям и данные о функции гена", "t2_s6_title": "Изменение условий задачи: нет синонимичных различий", "t2_s6_cond": "Переключатель — «нет синонимичных различий»: последовательности различаются только в кодонах 4 и 7, оба различия несинонимичные", "t2_s6_q": "Что покажет счётчик dN/dS?", "t2_s6_o1": "Показатель не определён", "t2_s6_x1": "Да: dS = 0, а делить на ноль нельзя. Нужны более длинные или более разошедшиеся последовательности", "t2_s6_o2": "Бесконечно большое значение — очень сильный положительный отбор", "t2_s6_x2": "Ноль синонимичных различий в 12 кодонах может получиться случайно; это не измерение отбора", "t2_s6_o3": "Ноль", "t2_s6_x3": "dN = 0,072, не ноль; не определено отношение, потому что знаменатель равен нулю", "t2_s6_h1": "Чему равно dS?", "t2_s6_h2": "Что получится при делении на ноль?", "t2_s6_h3": "Хватает ли 12 кодонов для оценки?", "t2_s6_e": "Отношение имеет смысл, только если синонимичных различий достаточно. При очень близких последовательностях оценка неустойчива, при очень далёких её искажают повторные замены в одном сайте", "t3_title": "Молекулярные часы", "t3_rules": "После расхождения двух видов замены накапливаются в обеих линиях. Если скорость r (замен на сайт за миллион лет в одной линии) постоянна, доля различий d = 2rT, а время расхождения T = d / (2r). Последовательности дают только d; чтобы получить r, нужен узел с независимо известным возрастом — калибровка. Возраст калибровки известен с неопределённостью, поэтому и время получается интервалом. Числа условные", "t3_lim": "Модель не учитывает повторных замен в одном сайте, различий скорости между генами и участками и того, что ископаемое обычно задаёт только нижнюю границу возраста узла. Дерево в ней известно заранее; в реальном исследовании и дерево, и скорости, и времена оцениваются вместе", "t3_how": "В 1960-х годах заметили, что число аминокислотных различий белков разных видов растёт примерно пропорционально времени их расхождения, известному по ископаемым. Отсюда возникла идея молекулярных часов. Сейчас скорости и времена оценивают вместе, с моделями неравномерных скоростей и с калибровками, заданными интервалами", "t3_s1_title": "Скорость по известному времени", "t3_s1_cond": "Ископаемые показывают, что линии К и Л разошлись 6 млн лет назад (условно, без неопределённости). Последовательности видов К и Л различаются в 2,4 % сайтов (d = 0,024)", "t3_s1_q": "Какова скорость замен в одной линии?", "t3_s1_o1": "0,002 на сайт за миллион лет", "t3_s1_x1": "r = d / (2T) = 0,024 / 12 = 0,002: за 6 млн лет обе линии вместе накопили 2,4 % различий", "t3_s1_o2": "0,004 на сайт за миллион лет", "t3_s1_x2": "0,004 — скорость, с которой растёт различие между двумя линиями, а не скорость одной линии", "t3_s1_o3": "0,001 на сайт за миллион лет", "t3_s1_x3": "При такой скорости две линии за 6 млн лет накопили бы только 1,2 % различий", "t3_s1_h1": "Сколько линий накапливают замены после расхождения?", "t3_s1_h2": "За время T каждая линия накопит r·T замен на сайт: d = 2rT", "t3_s1_h3": "Выразите r из d = 2rT", "t3_s1_e": "Различие двух видов растёт со скоростью 2r: замены накапливаются в обеих линиях. Отсюда и обратная задача — время по известной скорости: T = d / (2r)", "t3_s2_title": "Конструктор: убрать калибровку", "t3_s2_cond": "Скорость не задана. Есть только последовательности четырёх видов", "t3_s2_q": "Что можно получить по одним последовательностям?", "t3_s2_o1": "Дерево и относительные длины ветвей, но не время", "t3_s2_x1": "Да: последовательности дают число замен d = 2rT, а не r и T по отдельности", "t3_s2_o2": "Ничего: без калибровки дерево не построить", "t3_s2_x2": "Дерево и длины ветвей в заменах на сайт строятся по одним последовательностям", "t3_s2_o3": "Время, если последовательности достаточно длинные", "t3_s2_x3": "Длина последовательности уточняет d, но не даёт скорости; одинаковое d бывает при большой скорости и малом времени и наоборот", "t3_s2_h1": "Какие две величины прячутся в d?", "t3_s2_h2": "Можно ли по одному произведению найти оба множителя?", "t3_s2_h3": "Нужен узел с известным возрастом", "t3_s2_e": "Молекулярные часы без калибровки показывают порядок расхождений и относительные расстояния, но не годы", "t3_s3_title": "Калибровка ископаемым", "t3_s3_cond": "Ископаемое показывает, что линии К и Н разошлись 14–18 млн лет назад. d(К,Н) = 0,064", "t3_s3_q": "Почему время узла К–Л получится интервалом, а не числом?", "t3_s3_o1": "Возраст калибровки известен как 14–18 млн лет", "t3_s3_x1": "Да: r = 0,00178–0,00229, время К–Л — 5,25–6,75 млн лет", "t3_s3_o2": "Из-за ошибки при подсчёте различий в генах", "t3_s3_x2": "Различия в модели известны точно; неопределённость пришла из возраста ископаемого", "t3_s3_o3": "Потому что сама модель часов случайна", "t3_s3_x3": "Модель здесь не случайна: интервал — перенос неопределённости калибровки", "t3_s3_h1": "Как найти скорость по узлу К–Н?", "t3_s3_h2": "r = d / (2T) при T = 14 и при T = 18", "t3_s3_h3": "Подставьте обе скорости в T = d/(2r)", "t3_s3_e": "Интервал оценки — обычный результат молекулярных часов. Его ширина определяется главным образом неопределённостью калибровок", "t3_s4_title": "Изменение условий задачи: другая калибровка", "t3_s4_cond": "Вместо ископаемого — геологическое событие: линии К и М разделились 10–12 млн лет назад. d(К,М) = 0,048. Затем используем обе калибровки", "t3_s4_q": "Что произойдёт с интервалом, если использовать обе калибровки вместе?", "t3_s4_o1": "Он сузится", "t3_s4_x1": "Да: по геологическому событию — 5,0–6,0, по ископаемому — 5,25–6,75; совместимы обе только при 5,25–6,0 млн лет", "t3_s4_o2": "Он расширится до 5,0–6,75", "t3_s4_x2": "Скорость должна согласовываться с обеими калибровками сразу, поэтому остаётся только общая часть", "t3_s4_o3": "Получится одна точная дата", "t3_s4_x3": "Обе калибровки сами заданы интервалами; общая часть — тоже интервал", "t3_s4_h1": "Найдите скорость по каждой калибровке", "t3_s4_h2": "Какие скорости совместимы с обеими?", "t3_s4_h3": "Общая часть 0,0020–0,0024 и 0,00178–0,00229", "t3_s4_e": "Замена калибровки сдвигает оценку, добавление согласованной калибровки сужает её. Поэтому в работах всегда указывают, какие калибровки использованы", "t3_s5_title": "Неравные скорости: как их заметить", "t3_s5_cond": "Виды К и Л разошлись 6 млн лет назад. В линии К скорость 0,002, в линии Л вдвое выше — 0,004 (например, из-за более короткого поколения). Есть вид М, отделившийся раньше, — внешняя группа", "t3_s5_q": "По каким данным видно, что в линии Л замены копились быстрее?", "t3_s5_o1": "По расстояниям К и Л до внешней группы М", "t3_s5_x1": "Л дальше от М (0,060), чем К (0,048), хотя от общего с М предка обе линии отделяет одно и то же время", "t3_s5_o2": "По числу различий между К и Л", "t3_s5_x2": "Различие К–Л (0,036) складывается из обеих линий и не показывает, какая из них быстрее", "t3_s5_o3": "По числу замен в линии К", "t3_s5_x3": "Число замен в одной линии без сравнения с другой не показывает неравенства скоростей", "t3_s5_h1": "Какое время отделяет К и Л от их общего с М предка?", "t3_s5_h2": "При равных скоростях К и Л были бы от М одинаково далеки", "t3_s5_h3": "Сравните d(К,М) и d(Л,М)", "t3_s5_e": "Часы идут неравномерно: скорость зависит от времени поколения, скорости мутаций, участка генома и — через долю почти нейтральных изменений — от численности (шаг 2.2). Если не учесть неравенства скоростей, оценка времени искажается; заметить его помогает внешняя группа", "t4_title": "Откуда берутся новые гены", "t4_rules": "Предковый ген выполняет две части функции (круг и треугольник) — например, работает в двух тканях. После дупликации две одинаковые копии. Дальше возможны исходы: одна копия утрачивает функцию; обе сохраняются, если важна доза продукта; копии делят части функции; одна копия приобретает новую функцию. На дереве исходы показаны в разных линиях; какие из них реализуются, зависит от отбора, дрейфа и случая. Схема качественная", "t4_lim": "Модель не показывает, как долго идёт каждый исход, сколько копий утрачено полностью (их на дереве не видно), и обмена участками между копиями. Функции в ней — две условные части; у реальных генов функций и мест работы больше", "t4_how": "Копии генов находят, сравнивая геномы: по сходству последовательностей, положению в геноме и наличию интронов. Что произошло с функцией копий, узнают по тому, где и когда каждая копия транскрибируется, и по экспериментам с выключением копий", "t4_s1_title": "Каким путём возникла копия", "t4_s1_cond": "В геноме найдена вторая копия гена. В ней нет интронов, она стоит на другой хромосоме, на её конце — участок из многих A", "t4_s1_q": "Каким путём, вероятнее всего, возникла новая копия?", "t4_s1_o1": "Ретропозицией: ДНК-копия с зрелой мРНК", "t4_s1_x1": "Да: в зрелой мРНК интронов уже нет, а на её конце — поли(А)-хвост", "t4_s1_o2": "Неравным кроссинговером в мейозе", "t4_s1_x2": "При неравном кроссинговере копия стоит рядом с исходной и сохраняет интроны", "t4_s1_o3": "Удвоением всего генома", "t4_s1_x3": "При удвоении генома копии получают все гены, и каждая копия сохраняет интроны", "t4_s1_h1": "Где в клетке есть последовательность гена без интронов?", "t4_s1_h2": "Откуда берётся участок из многих A?", "t4_s1_h3": "Зрелая мРНК + обратная транскрипция", "t4_s1_e": "Путь возникновения копии оставляет следы: копия от неравного кроссинговера стоит рядом и с интронами, копия от ретропозиции — без интронов и в другом месте. Ретрокопия без регуляторных участков часто не транскрибируется и становится псевдогеном", "t4_s2_title": "Что чаще всего происходит с копией", "t4_s2_cond": "Только что возникла дупликация: две одинаковые копии гена", "t4_s2_q": "Какой исход встречается чаще всего?", "t4_s2_o1": "Одна копия утрачивает функцию", "t4_s2_x1": "Да: вредные изменения в одной из двух одинаковых копий почти не удаляются отбором, и копия превращается в псевдоген или исчезает", "t4_s2_o2": "Обе копии приобретают новые функции", "t4_s2_x2": "Новая функция — редкий исход; копия должна сохраниться, пока не накопит полезных изменений", "t4_s2_o3": "Копия сразу получает новую функцию — для этого она и возникает", "t4_s2_x3": "Дупликация — случайное событие; оно не происходит «для» новой функции. Что будет с копией, определяют потом отбор, дрейф и случай", "t4_s2_h1": "Что происходит, когда одна из двух одинаковых копий повреждается?", "t4_s2_h2": "Удаляет ли отбор вредное изменение во второй одинаковой копии, если первая работает?", "t4_s2_h3": "Какие изменения чаще: выключающие или создающие новое свойство?", "t4_s2_e": "Дупликация создаёт материал, но не новую функцию. Копии сохраняются, если важна доза продукта, если они разделяют части функции или если одна приобретает новую", "t4_s3_title": "Какой это исход", "t4_s3_cond": "У предка ген работал в печени и в почке (условно). У потомка две копии: первая работает только в печени, вторая — только в почке. Новых мест работы нет", "t4_s3_q": "Какой это исход дупликации?", "t4_s3_o1": "Разделение функций", "t4_s3_x1": "Да: копии поделили между собой две части предковой функции, и теперь нужны обе", "t4_s3_o2": "Новая функция", "t4_s3_x2": "Новых функций не появилось: обе части были у предкового гена", "t4_s3_o3": "Сохранение дозы", "t4_s3_x3": "При сохранении дозы обе копии работали бы, как предковый ген, в обоих органах", "t4_s3_h1": "Были ли у предкового гена обе части?", "t4_s3_h2": "Появилось ли что-то новое?", "t4_s3_h3": "Сравните с кругом и треугольником на дереве", "t4_s3_e": "Разделение функций сохраняет обе копии без новой функции: каждая утратила часть, и вместе они делают то же, что предковый ген", "t4_s4_title": "Ген без предшественника", "t4_s4_cond": "У вида 1 транскрибируется короткая открытая рамка считывания, по ней синтезируется белок. У трёх близких видов в той же позиции генома такая же последовательность, но с общим преждевременным стоп-кодоном. Сходных генов в геноме и у других организмов нет", "t4_s4_q": "Откуда, вероятнее всего, взялся этот ген?", "t4_s4_o1": "Из некодирующей ДНК общего предка", "t4_s4_x1": "Да: рамка открылась в линии вида 1, а у остальных видов осталась прерванной", "t4_s4_o2": "Дупликацией существующего гена", "t4_s4_x2": "Тогда в геноме нашёлся бы сходный ген-предшественник", "t4_s4_o3": "Горизонтальным переносом от другого вида", "t4_s4_x3": "Тогда нашлось бы сходство с генами другого организма; здесь же та же последовательность есть у близких видов в той же позиции", "t4_s4_h1": "Есть ли у гена родственники в геноме?", "t4_s4_h2": "Что у близких видов в той же позиции?", "t4_s4_h3": "Общий стоп-кодон у трёх видов", "t4_s4_e": "Новые гены возникают не только дупликацией. Чтобы считать рамку геном, возникшим из некодирующей ДНК, нужны данные о её транскрипции, трансляции и функции", "t4_s5_title": "Мобильный элемент в интроне", "t4_s5_cond": "В интрон гена встроилась новая копия ретротранспозона — элемента, который копируется через РНК", "t4_s5_q": "Как такие вставки чаще всего сказываются на хозяине?", "t4_s5_o1": "Обычно нейтрально или вредно, изредка — материал для новой роли", "t4_s5_x1": "Да: большинство вставок не влияет на приспособленность или вредит, но за долгое время часть элементов стала регуляторными участками", "t4_s5_o2": "Полезно: элементы распространяются, чтобы создавать новшества", "t4_s5_x2": "Элемент распространяется, потому что копируется; польза для хозяина — редкое и более позднее следствие", "t4_s5_o3": "Всегда вредно: вставка разрушает ген", "t4_s5_x3": "Вставка в интрон или между генами часто не меняет продукта и не влияет на приспособленность", "t4_s5_h1": "Что делает вставка в интроне с белком?", "t4_s5_h2": "Чем отличается распространение элемента от его использования хозяином?", "t4_s5_h3": "Кооптация — использование готовой последовательности в новой роли", "t4_s5_e": "Мобильные элементы — источник мутаций и перестроек и, изредка, материал для новых регуляторных участков. Их распространение и их последующее использование организмом — разные события", "c1_obs": "В позиции 112 гена у одной особи вида 1 — A, у одной особи вида 2 — G", "c1_c1": "Замещение в линии вида 1", "c1_c2": "Замещение в линии вида 2", "c1_c3": "Полиморфизм: случайно взяты особи с разными вариантами", "c1_c4": "Ошибка определения последовательности", "c1_m1": "Последовательности 20 особей каждого вида", "c1_r1_1": "у всех вида 1 — A, у всех вида 2 — G", "c1_r1_2": "то же", "c1_r1_3": "у одного или обоих видов встречаются и A, и G", "c1_r1_4": "у всех вида 1 и вида 2 — один и тот же нуклеотид", "c1_m2": "Последовательность близкого вида вне этой пары (внешняя группа)", "c1_r2_1": "G (предковое) — изменилась линия 1", "c1_r2_2": "A (предковое) — изменилась линия 2", "c1_r2_3": "не отличает полиморфизм от замещения", "c1_r2_4": "—", "c1_m3": "Повторное определение тех же образцов", "c1_r3_1": "подтверждается", "c1_r3_2": "подтверждается", "c1_r3_3": "подтверждается", "c1_r3_4": "различие исчезает", "c1_after": "Различие двух особей — наблюдение. Замещение утверждают по выборке из популяций, а линию, где оно произошло, — по внешней группе", "c2_obs": "Для гена G у вида Y по сравнению с близким видом dN/dS = 0,97", "c2_c1": "Ослабление отбора: ген утрачивает функцию", "c2_c2": "Смесь давлений: часть кодонов под очищающим, часть под положительным отбором", "c2_c3": "Сравнили не ортологи, а паралоги — копии, разошедшиеся при дупликации", "c2_m1": "Оценки по отдельным кодонам", "c2_r1_1": "около 1 почти во всех кодонах", "c2_r1_2": "большинство кодонов меньше 1, немногие больше 1", "c2_r1_3": "неинформативно", "c2_m2": "Стоп-кодоны, сдвиги рамки, транскрипция гена у вида Y", "c2_r2_1": "преждевременный стоп-кодон или нет транскрипции", "c2_r2_2": "рамка не нарушена, ген транскрибируется", "c2_r2_3": "рамка не нарушена", "c2_m3": "Положение гена в геноме и дерево генов семейства", "c2_r3_1": "ген на ожидаемом месте; на дереве — ортолог", "c2_r3_2": "то же", "c2_r3_3": "гены на разных местах; на дереве — копии, разошедшиеся при дупликации", "c2_after": "dN/dS — статистический сигнал. Его причину называют по оценкам для отдельных кодонов, по данным о функции гена и по проверке, что сравнивают ортологи. Паралоги расходились с момента дупликации, а не с разделения видов, и могли пройти период ослабленного отбора сразу после неё; их отношение описывает другую историю", "c3_obs": "Две работы оценили время расхождения одних и тех же двух видов: 5–6 и 8–10 млн лет назад", "c3_c1": "Разные калибровки", "c3_c2": "В одной из линий скорость выше, а оценку дали строгие часы", "c3_c3": "Разные гены с разной скоростью", "c3_m1": "Какие калибровки использованы в каждой работе", "c3_r1_1": "разные узлы или разные интервалы возраста", "c3_r1_2": "одни и те же", "c3_r1_3": "одни и те же", "c3_m2": "Расстояния двух видов до общей внешней группы", "c3_r2_1": "равны", "c3_r2_2": "заметно различаются", "c3_r2_3": "равны", "c3_m3": "Какие гены и модели скоростей использованы", "c3_r3_1": "одни и те же", "c3_r3_2": "одни и те же или нет", "c3_r3_3": "разные гены; при пересчёте одним набором генов оценки сближаются", "c3_after": "Расхождение дат — наблюдение. Причину ищут, сравнивая калибровки, скорости в линиях и использованные данные", "c4_obs": "В сборке генома одноклеточного эукариота найден ген, похожий на гены бактерий", "c4_c1": "Горизонтальный перенос гена", "c4_c2": "Загрязнение образца бактериальной ДНК", "c4_c3": "Перенос гена из митохондрии в ядро (эндосимбиотический)", "c4_m1": "Соседние гены на том же участке сборки", "c4_r1_1": "эукариотические гены рядом", "c4_r1_2": "участок содержит только бактериальные гены", "c4_r1_3": "эукариотические гены рядом", "c4_m2": "Ген в независимых образцах того же вида", "c4_r2_1": "есть", "c4_r2_2": "нет или непостоянно", "c4_r2_3": "есть", "c4_m3": "Положение гена на дереве генов", "c4_r3_1": "внутри определённой группы бактерий (не альфапротеобактерий)", "c4_r3_2": "внутри какой-либо группы бактерий — так же, как при переносе", "c4_r3_3": "рядом с альфапротеобактериями и митохондриальными генами других эукариот", "c4_after": "Ген бактериального типа в геноме эукариоты — наблюдение. Перенос признают, если ген встроен среди генов хозяина, повторяется в независимых образцах и на дереве генов стоит рядом с определённым донором", "a1_title": "Сколько новых мутаций получает ребёнок", "a1_cond": "Одна семья из четырёх поколений, 28 человек. Геномы прочитаны пятью разными методами, в том числе длинными прочтениями, которые позволяют собрать и повторяющиеся участки. Новая мутация — изменение, которого нет ни у отца, ни у матери. Числа — средние на одного ребёнка, то есть на оба родительских генома вместе; от каждого родителя — примерно половина", "a1_lv1": "только однонуклеотидные замены", "a1_lv2": "+ вставки и делеции вне повторов", "a1_lv3": "+ изменения в тандемных повторах, включая структурные", "a1_lv4": "+ изменения в центромерах", "a1_lab1": "у разных детей этой семьи — от 98 до 206", "a1_lab2": "прежние оценки по коротким прочтениям — около 60–70: в основном однонуклеотидные замены вне трудных участков", "a1_lab3": "сумма средних — расчёт по числам работы", "a1_status": "Модель по данным одной семьи; числа измерены; сумма — расчёт", "a1_s1_q": "Если считать только однонуклеотидные замены, получится около 75 новых мутаций. Что изменится, если добавить изменения в тандемных повторах?", "a1_s1_o1": "Число вырастет почти вдвое", "a1_s1_x1": "Да: повторы — самые изменчивые участки генома; в среднем 65,3 изменения на ребёнка", "a1_s1_o2": "Почти не изменится: повторов в геноме мало", "a1_s1_x2": "Повторы изменяются намного чаще остальной ДНК; их изменений почти столько же, сколько однонуклеотидных замен", "a1_s1_o3": "Уменьшится: повторы трудно прочитать", "a1_s1_x3": "Трудность прочтения уменьшает число найденных изменений; здесь повторы прочитаны длинными прочтениями", "a1_s1_e": "Сколько новых мутаций получает ребёнок, зависит от того, что считают и что удаётся прочитать. Прежние оценки около 60–70 — в основном однонуклеотидные замены", "a1_s2_q": "16 % новых однонуклеотидных замен возникли уже после оплодотворения. Что из этого следует?", "a1_s2_o1": "Часть «новых» мутаций есть не во всех клетках человека и может не передаться его детям", "a1_s2_x1": "Да: изменение, возникшее у зародыша, есть только в части его клеток", "a1_s2_o2": "Эти мутации получены от отца", "a1_s2_x2": "Мутации после оплодотворения не унаследованы от родителей; преобладания отцовских среди них нет", "a1_s2_o3": "Это ошибки прочтения", "a1_s2_x3": "Их проверяли по прочтениям разных методов и по передаче следующему поколению", "a1_s2_e": "Мутационное событие может произойти в зародышевой линии родителя или в самом начале развития потомка. От этого зависит, в скольких клетках есть вариант и перейдёт ли он дальше", "a1_s3_q": "Можно ли по этой семье назвать число новых мутаций у любого человека?", "a1_s3_o1": "Нет: это одна семья, а число зависит от возраста отца", "a1_s3_x1": "Нельзя: в работе — около 1,55 дополнительной мутации на каждый год возраста отца; разброс у детей 98–206", "a1_s3_o2": "Да: геномы этой семьи прочитаны полностью", "a1_s3_x2": "Полнота прочтения уточняет счёт в этой семье, но не делает её выборкой всех людей", "a1_s3_o3": "Да, если взять среднюю сумму 151,6 мутации", "a1_s3_x3": "Сумма средних — расчёт по одной семье", "a1_new": "В семье из четырёх поколений, прочитанной почти полностью, у каждого ребёнка нашлось от 98 до 206 новых мутаций — в сумме от обоих родителей. Примерно половина из них — однонуклеотидные замены, почти столько же — изменения в тандемных повторах. Около 16 % новых однонуклеотидных замен возникли после оплодотворения. Около четырёх пятых мелких изменений зародышевой линии пришли от отца", "a1_how": "Прочитали геномы всех членов семьи разными методами, в том числе длинными прочтениями, и собрали каждый геном почти целиком. Новыми считали изменения, которых нет у родителей, и проверяли, передаются ли они следующему поколению", "a1_lim": "Одна семья не описывает всех людей: число новых мутаций зависит от возраста родителей и, возможно, от других свойств. Модель не показывает, какие из этих изменений влияют на признаки", "a2_title": "Утверждение и возражение: вредны ли синонимичные мутации", "a2_cond": "Дрожжи: в 21 ген по одной вносили однонуклеотидные замены — синонимичные, несинонимичные и создающие стоп-кодон — и сравнивали скорость роста мутантов с исходным штаммом в одной смеси. Мутант считали вредным, если его приспособленность значимо ниже 1", "a2_claim_t": "Утверждение", "a2_claim": "Из 1866 синонимичных мутантов 75,9 % значимо вредны — почти как несинонимичных (75,8 %). Медиана приспособленности: синонимичных 0,989, несинонимичных 0,988, со стоп-кодоном 0,940", "a2_objection_t": "Возражение", "a2_objection": "Не было исходных штаммов, полученных тем же путём для каждого гена; повторы были техническими, а не независимыми; побочные мутации при получении штаммов могли сделать нейтральные замены «вредными». Проверка малых эффектов отдельным измерением роста дала значения около 1", "a2_reply_t": "Ответ", "a2_reply": "Прочитано 603 генома: ошибочных разрезов при редактировании нет, но у 26,7 % из 580 прочитанных мутантов есть побочные мутации. Повтор с четырьмя независимыми смесями и своим исходным штаммом для каждого гена; в повторе по 11 генам значимо не нейтральны 86,5 % синонимичных; вместе с прежними данными по шести генам, где влияние побочных мутаций пренебрежимо мало, — 76,9 % из 1621 синонимичных и 77,0 % из 5386 несинонимичных", "a2_h1": "гены, связанные хотя бы с одним признаком, по редким вариантам, обрывающим белок: 55 из 18 762", "a2_h2": "по редким миссенс-вариантам: 27 из 18 762", "a2_h3": "по редким синонимичным вариантам: 2 из 18 762", "a2_h4": "наблюдение в одной большой выборке людей", "a2_open": "Спор о дрожжах не закрыт. У человека редкие синонимичные варианты связаны с признаками гораздо реже, чем миссенс-варианты и варианты, обрывающие белок", "a2_status": "Схема трёх опубликованных позиций и одного наблюдения у человека; числа — из работ", "a2_s1_q": "По каким данным расходятся стороны в споре о дрожжах?", "a2_s1_o1": "По надёжности сравнения с исходным штаммом", "a2_s1_x1": "Да: возражение касается контролей и повторов: были ли исходные штаммы получены тем же путём и были ли повторы независимыми", "a2_s1_o2": "По тому, меняют ли синонимичные замены белок", "a2_s1_x2": "Обе стороны согласны: последовательность белка не меняется; спор — о влиянии на приспособленность", "a2_s1_o3": "По генетическому коду дрожжей", "a2_s1_x3": "Код у сторон один и тот же; расходятся оценки приспособленности", "a2_s2_q": "Что можно сказать сейчас?", "a2_s2_o1": "Спор о дрожжах не закрыт", "a2_s2_x1": "Да: авторы повторили измерения с контролями, но вопрос о малых эффектах обсуждается", "a2_s2_o2": "Доказано, что большинство синонимичных мутаций вредно для всех организмов", "a2_s2_x2": "Даже для дрожжей вывод оспаривается; у человека данные указывают на гораздо меньшую роль синонимичных вариантов", "a2_s2_o3": "Доказано, что синонимичные мутации всегда нейтральны", "a2_s2_x3": "Известны синонимичные замены, нарушающие сплайсинг; нейтральность — допущение для большинства, а не для всех", "a2_s3_q": "Почему этот спор важен для dN/dS?", "a2_s3_o1": "dS принимают за меру нейтральных изменений", "a2_s3_x1": "Да: показатель опирается на допущение о нейтральности синонимичных замен", "a2_s3_o2": "dN/dS считают только для генов дрожжей", "a2_s3_x2": "Показатель используют для любых кодирующих последовательностей", "a2_s3_o3": "dS не зависит от отбора по определению", "a2_s3_x3": "dS измеряет закрепившиеся синонимичные различия; если на них действует отбор, он влияет и на dS", "a2_new": "В работе с дрожжами три четверти синонимичных мутаций в 21 гене снижали приспособленность почти так же часто, как несинонимичные. Другие исследователи возразили: не было подходящих контролей, а побочные мутации при получении штаммов могли создать ложный эффект. Авторы повторили измерения с контролями и получили близкую долю не нейтральных мутаций — около 77 %. Спор не закрыт. У человека в большой выборке редкие синонимичные варианты оказались связаны с признаками только в двух генах из 18 762, миссенс-варианты — в 27, а варианты, обрывающие белок, — в 55", "a2_how": "Мутантов выращивали вместе с исходным штаммом и по изменению их долей в смеси за двое суток рассчитывали приспособленность. У людей сравнивали, как часто у больных и здоровых встречаются редкие варианты каждого гена", "a2_lim": "Модель не показывает, почему отдельные синонимичные замены могут влиять на клетку (сплайсинг, устойчивость РНК, скорость трансляции), и не переносит результаты с дрожжей на человека", "a3_title": "Скорость мутаций в клетках тела и продолжительность жизни", "a3_cond": "В стволовых клетках кишечника 15 видов млекопитающих посчитали, сколько однонуклеотидных замен накапливается в геноме клетки за год. Это мутации клеток тела, а не половых клеток: потомкам они не передаются. Продолжительность жизни — возраст, до которого не доживают 80 % особей, достигших взрослости", "a3_sp1": "мышь", "a3_sp2": "крыса", "a3_sp3": "хорёк", "a3_sp4": "кошка", "a3_sp5": "собака", "a3_sp6": "кролик", "a3_sp7": "тигр", "a3_sp8": "корова", "a3_sp9": "лев", "a3_sp10": "лошадь", "a3_sp11": "кошачий лемур", "a3_sp12": "жираф", "a3_sp13": "голый землекоп", "a3_sp14": "гвереца", "a3_sp15": "человек", "a3_end": "в среднем около 3200 замен на геном клетки (95 %-й доверительный интервал 2684–3729); у разных видов — различие примерно втрое, хотя продолжительность жизни различается в 30 раз, а масса тела — в 40 000 раз", "a3_status": "Данные одной работы; точки измерены; линия не проводится; связь — корреляция", "a3_s1_q": "Жираф и голый землекоп различаются по массе тела примерно в 23 000 раз, а живут примерно одинаково — около 24–25 лет. Как различаются у них скорости накопления мутаций?", "a3_s1_o1": "Почти не различаются — около 99 и 93 замен в год", "a3_s1_x1": "Да: скорость следует за продолжительностью жизни, а не за массой тела", "a3_s1_o2": "У жирафа во много раз выше: у него больше клеток", "a3_s1_x2": "Скорость считают на одну клетку; масса тела после учёта продолжительности жизни почти ничего не объясняет", "a3_s1_o3": "У жирафа во много раз ниже: крупным видам нужно защищаться от рака", "a3_s1_x3": "Такое предположение проверяли; у жирафа и голого землекопа скорости близки", "a3_s2_q": "Мышь накапливает около 796 замен в год, человек — около 47. Что получается к концу жизни?", "a3_s2_o1": "Близкое: около 2900 у мыши и 3900 у человека", "a3_s2_x1": "Да: 796 × 3,68 ≈ 2930 и 47,1 × 83,67 ≈ 3940 — расчёт по числам работы. Скорость примерно обратно пропорциональна продолжительности жизни", "a3_s2_o2": "У мыши примерно в 17 раз больше", "a3_s2_x2": "В 17 раз больше в год, но мышь живёт в 23 раза меньше", "a3_s2_o3": "У человека примерно в 17 раз больше", "a3_s2_x3": "Человек живёт дольше, но и накапливает мутации медленнее; итоги близки", "a3_s3_q": "Можно ли по этой работе сказать, что молекулярные часы у мыши идут в 17 раз быстрее, чем у человека?", "a3_s3_o1": "Нет: измерены мутации клеток тела", "a3_s3_x1": "Нельзя: часы считают замены, закрепившиеся в ряду поколений; работа показывает, что скорость мутирования различается у видов, но скорость часов не измеряет", "a3_s3_o2": "Да: у мыши мутаций в год больше", "a3_s3_x2": "Часы зависят от мутаций в половых клетках и от времени поколения; соматические мутации потомкам не передаются", "a3_s3_o3": "Да, если пересчитать на поколение", "a3_s3_x3": "Пересчёт не превращает мутации клеток кишки в мутации половых клеток", "a3_new": "У 15 видов млекопитающих стволовые клетки кишки накапливают от 47 (человек) до 796 (мышь) однонуклеотидных замен в год. Скорость тем выше, чем короче жизнь вида: обратная величина продолжительности жизни объясняет 82 % различий между видами. К концу жизни в клетке набирается сопоставимое число замен — в среднем около 3200. Масса тела после учёта продолжительности жизни почти ничего не добавляет. Связь корреляционная: что ограничивает скорость мутирования, работа не устанавливает", "a3_how": "Из кишки выделяли отдельные крипты — потомство одной стволовой клетки — и читали их геномы. Мутации, общие для всех клеток крипты, но отсутствующие в других тканях, — это мутации, накопленные стволовой клеткой", "a3_lim": "Модель не показывает мутаций половых клеток и скорости молекулярных часов. Она не устанавливает причины связи и не позволяет продлевать линию за пределы измеренных видов", "a4_title": "Что происходило с копиями генов в мозге позвоночных", "a4_cond": "В начале эволюции позвоночных геном удвоился целиком, а затем у предков челюстных позвоночных — ещё раз. Копии генов от удвоений и от отдельных дупликаций сохранились у человека, мыши, ящерицы и миноги. Для групп копий, пара которых есть хотя бы у трёх видов из четырёх, сравнили, в каких типах клеток мозга каждая копия служит маркером — отличительным геном типа клеток, — у этих видов и у их общего предка (реконструкция)", "a4_o1": "разделение функций — около 78 %", "a4_o2": "новая функция — около 21 %", "a4_o3": "утрата (ни одна копия больше не служит маркером этого типа клеток) — менее 1 %", "a4_b1": "от удвоения генома — 1872", "a4_b2": "от отдельных дупликаций — 1050", "a4_b3": "2693 — все группы паралогов; две полосы — группы, отнесённые к удвоению генома или к отдельным дупликациям", "a4_b4": "доли исходов в обоих наборах близки", "a4_status": "Данные одной работы; доли — реконструкция по использованию копий как маркеров типов клеток", "a4_s1_q": "Какой исход, по базовой модели, чаще всего ожидается в целом для копий после дупликации — и о чём эта работа?", "a4_s1_o1": "Утрата функции; в работе — только сохранившиеся копии", "a4_s1_x1": "Утраченные копии в такой анализ не попадают: сравнивают копии, пара которых есть хотя бы у трёх видов из четырёх", "a4_s1_o2": "Новая функция; работа это подтверждает", "a4_s1_x2": "Новая функция встречается реже: около 21 % изменений даже среди сохранившихся копий", "a4_s1_o3": "Работа показывает, что копии не утрачиваются", "a4_s1_x3": "«Утрата» в работе — когда ни одна копия больше не служит маркером данного типа клеток; утраченные гены здесь не считали", "a4_s2_q": "Какой исход объясняет большинство изменений в том, маркерами каких типов клеток служат сохранившиеся копии?", "a4_s2_o1": "Разделение функций", "a4_s2_x1": "Копии поделили между собой типы клеток, маркером которых был предковый ген", "a4_s2_o2": "Новая функция у одной копии", "a4_s2_x2": "Около 21 % — новые типы клеток у одной из копий", "a4_s2_o3": "Сохранение дозы обеих копий", "a4_s2_x3": "Отбор на дозу авторы находят отдельно — по уровню экспрессии копий. Доли 78, 21 и менее 1 % относятся к другому: маркером каких типов клеток служит копия", "a4_s3_q": "Почему авторы осторожны с этой долей?", "a4_s3_o1": "Их способ может легче выявлять разделение функций", "a4_s3_x1": "Авторы допускают это сами; оценка зависит и от способа реконструкции предка", "a4_s3_o2": "Потому что данных о мозге человека нет", "a4_s3_x2": "Данные о человеке использованы", "a4_s3_o3": "Потому что удвоения генома не было", "a4_s3_x3": "Удвоения генома в начале эволюции позвоночных — общепринятая реконструкция, на которую опирается работа", "a4_new": "У позвоночных копии генов, сохранившиеся после удвоений генома, чаще копий от отдельных дупликаций служат маркерами — отличительными генами — определённых типов клеток мозга. Изменения того, маркерами каких типов клеток служат копии, примерно на 78 % объясняются разделением функций предкового гена, на 21 % — новой функцией одной из копий, менее чем на 1 % — утратой. Авторы допускают, что их способ может легче обнаруживать разделение функций", "a4_how": "Прочитали РНК отдельных клеток мозга у нескольких видов, разделили клетки на типы и для каждой пары копий определили, маркером каких типов она служит. Состояние у общего предка реконструировали по видам", "a4_lim": "Модель не показывает копий, утраченных полностью, изменений белка и того, насколько разделение функций сказалось на приспособленности", "fin_title": "Что объясняет различие?", "fin_cond": "Четыре наблюдения. Для каждого выберите объяснение, которое совместимо с данными, и данные, нужные для проверки. Если данных недостаточно, выберите «нельзя различить» или «нельзя определить»", "fin_s1_obs": "Два вида различаются в 40 позициях гена; у 30 обследованных особей каждого вида эти различия одни и те же", "fin_s2_obs": "dN/dS гена по сравнению двух видов — 0,1", "fin_s3_obs": "По последовательностям четырёх видов построено дерево с длинами ветвей в заменах на сайт. Ископаемых и других датированных событий для этих видов нет", "fin_s4_obs": "В геноме найдена вторая копия гена: без интронов, на другой хромосоме, в рамке — преждевременный стоп-кодон", "fin_s1_x": "Одинаковые различия у всех особей каждого вида — признак закреплённых различий, то есть замещений. Где произошло каждое, показывает внешняя группа", "fin_s2_x": "Несинонимичные изменения закреплялись в десять раз реже синонимичных: большинство изменений аминокислот удалял очищающий отбор. Отдельные кодоны под положительным отбором это среднее не исключает", "fin_s3_x": "Последовательности дают число замен — произведение скорости на время. Чтобы получить годы, нужен узел с независимо известным возрастом; без него по этим данным время назвать нельзя", "fin_s4_x": "Копия без интронов в другом месте генома — след ретропозиции. Преждевременный стоп-кодон говорит об утрате функции; работает ли копия, проверяют по транскрипции, а когда возник стоп-кодон — по близким видам", "src_01": "Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014.", "src_02": "dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80. doi:10.1038/nrg.2015.8", "src_03": "Porubsky D. et al. Human de novo mutation rates from a four-generation pedigree reference. Nature 2025; 643: 427–436. doi:10.1038/s41586-025-08922-2", "src_04": "Shen X., Song S., Li C., Zhang J. Synonymous mutations in representative yeast genes are mostly strongly nonneutral. Nature 2022; 606: 725–731. doi:10.1038/s41586-022-04823-w", "src_05": "Kruglyak L. et al. Insufficient evidence for non-neutrality of synonymous mutations. Nature 2023; 616: E8–E9. doi:10.1038/s41586-023-05865-4", "src_06": "Shen X. et al. Further evidence for strong nonneutrality of yeast synonymous mutations. Mol Biol Evol 2024; 41: msae224. doi:10.1093/molbev/msae224", "src_07": "Dhindsa R.S. et al. A minimal role for synonymous variation in human disease. Am J Hum Genet 2022; 109: 2105–2109. doi:10.1016/j.ajhg.2022.10.016", "src_08": "Cagan A. et al. Somatic mutation rates scale with lifespan across mammals. Nature 2022; 604: 517–524. doi:10.1038/s41586-022-04618-z", "src_09": "Kuzmin E., Taylor J.S., Boone C. Retention of duplicated genes in evolution. Trends Genet 2022; 38: 59–72. doi:10.1016/j.tig.2021.06.016", "src_10": "Zhu Y. et al. Whole-genome duplication shaped cell-type evolution in the vertebrate brain. Nature 2026. doi:10.1038/s41586-026-10629-x", "src_11": "Broeils L.A., Ruiz-Orera J., Snel B., Hubner N., van Heesch S. Evolution and implications of de novo genes in humans. Nat Ecol Evol 2023; 7: 804–815. doi:10.1038/s41559-023-02014-y", "src_12": "Feschotte C. Transposable elements: McClintock’s legacy revisited. Nat Rev Genet 2023; 24: 797–800. doi:10.1038/s41576-023-00652-3", "src_13": "Keeling P.J. Horizontal gene transfer in eukaryotes: aligning theory with data. Nat Rev Genet 2024; 25: 416–430. doi:10.1038/s41576-023-00688-5", "src_14": "Ocaña-Pallarès E. et al. Signatures of gene transfer in the parallel evolution of osmotrophic specialization in eukaryotes. Nat Ecol Evol 2026. doi:10.1038/s41559-026-03054-w", "src_15": "Stewart J.B., Chinnery P.F. The dynamics of mitochondrial DNA heteroplasmy: implications for human function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }

const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* семинар 11: ключи текстов шага — ключи документов v1.1 (s11_t1_s1_q, _o1…_o4, _e, _w2…_w4, _h1…_h3, _obs, _cond) */
function poeKey(K, si){ const S = SCENES[K], st = S.poe[si]; return st.key || (S.pfx ? S.pfx + (si + 1) : `p${K}_${si + 1}`); }

/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */

const POE_SALT = 'v21';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */

/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.

/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */

/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;

function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); if (q !== qn) amk = 1; qn = q; lvl = l; show(); syncUrl(push); }

/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */

show = function(){ revShow0(); revAfterShow(); };

function revVisible(e, stop){ for (let x = e; x && x !== stop; x = x.parentElement){ const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return false; } return true; }
function revA11y(){

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 700 px или низкий экран) во всех практикумах.
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 760 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:700px), (max-height:500px)') : null;
  let queued = false;
  function fitStage(st) {
    const sv = st.querySelector('svg'), zw = st.querySelector('.zwrap'); if (!sv || !zw) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); st.style.removeProperty('--p5w'); return; }
    const cur = sv.getBoundingClientRect().width, flatW = zw.clientWidth; if (!cur || !flatW) return;
    const k = Math.min(1, flatW / cur); let min = Infinity;
    ts.forEach(t => {
      const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
      const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
      if (px > 0 && px < min) min = px;
      t.classList.toggle('p5-small', px < 7);
    });

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;

  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);

  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;

      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
