<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-2.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Цитоскелет: полярность, динамика и сила</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-three-systems"><div class="eyebrow">Три системы цитоскелета · шаг 1 из 29</div><h2>Что такое цитоскелет и почему у клетки три системы полимеров?</h2><p class="lead"><a href="#ns-g-S2-T01">Цитоскелет</a> — система белковых полимеров и связанных с ними белков, которая придаёт клетке форму и механическую прочность, меняет форму поверхности, создаёт силу и направленно перемещает компоненты внутри клетки. Каждый полимер собран из множества одинаковых <a href="#ns-g-S2-T02">субъединиц</a>, связанных нековалентно.</p><div class="note"><strong>Что показывает схема.</strong> Пучок толще микротрубочки: различает субъединица и стенка, а не диаметр</div><ol class="mech"><li>В животной клетке три системы: <a href="#ns-g-S2-T03">актиновые филаменты</a> (диаметр около 8 нм), <a href="#ns-g-S2-T05">микротрубочки</a> (наружный диаметр 25 нм) и <a href="#ns-g-S2-T08">промежуточные филаменты</a> (около 10 нм). Они различаются не только толщиной, но и белком-субъединицей, наличием нуклеотида, полярностью, <a href="#ns-g-S2-T45">моторными белками</a>, скоростью перестройки и тем, какую нагрузку они лучше выдерживают. Актиновые филаменты сосредоточены у плазматической мембраны и определяют форму поверхности; микротрубочки — длинные жёсткие пути от центра клетки к периферии; промежуточные филаменты — прочная сеть от ядра к межклеточным контактам.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить БИО-1·4 (текучесть мембраны) и БИО-1·6 (кортикальный слой под мембраной)</p><p>Различия в свойствах объясняют, почему клетке нужны все три: прочная, но неполярная сеть не может служить путём для направленного транспорта; динамичная сеть актина не выдерживает сильного растяжения в одиночку. Все три системы связаны друг с другом и с мембраной. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 2: пучок из десяти актиновых филаментов толще микротрубочки, и отличить их помогает субъединица и строение стенки, а не диаметр.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Актин и тубулин есть у всех эукариот; цитоплазматические промежуточные филаменты образуются только у части многоклеточных животных. Есть и другие полимеры, например септины.</p><div class="static-quiz"><h3>Препарат клетки окрашен так, что видны только нити. Какой признак надёжнее всего указывает, к какой системе относится нить?</h3><ol><li><b>А.</b> Белок-субъединица <i>(верный вариант)</i><br><span class="expl">Да: субъединица однозначно определяет систему; диаметр пучков и сетей зависит от числа сшитых нитей</span></li><li><b>Б.</b> Толщина нити <i>(неверный вариант)</i><br><span class="expl">Толщина помогает, но пучок тонких филаментов может быть толще одной микротрубочки</span></li><li><b>В.</b> Длина нити <i>(неверный вариант)</i><br><span class="expl">Длина у всех трёх систем меняется в широких пределах и систему не определяет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p>Схема качественная; масштаб диаметров соблюдён, длины условные.</p></details></article><article class="card print-unit" id="ns-actin-filament"><div class="eyebrow">Три системы цитоскелета · шаг 2 из 29</div><h2>Как устроен актиновый филамент?</h2><p class="lead"><a href="#ns-g-S2-T04">Актин</a> — глобулярный белок; свободный мономер называют G-актином, полимер — F-актином. Актиновый филамент — две закрученные цепочки субъединиц актина.</p><div class="note"><strong>Что показывает схема.</strong> Все субъединицы ориентированы одинаково — концы различаются</div><ol class="mech"><li>Каждая субъединица актина несёт прочно связанный нуклеотид — <a href="#ns-g-S2-T46">АТФ</a> или АДФ. Все субъединицы присоединяются в одной ориентации, поэтому у филамента есть <a href="#ns-g-S2-T09">полярность</a>: два конца различаются. Быстрорастущий конец называют <a href="#ns-g-S2-T10">плюс-концом</a>, медленнорастущий — <a href="#ns-g-S2-T11">минус-концом</a>. Вскоре после встраивания субъединицы её АТФ <a href="#ns-g-S2-T35">гидролизуется</a> до АДФ, и неорганический фосфат постепенно уходит; старые участки филамента состоят из АДФ-актина и удерживаются слабее.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·1</p><p>Отдельный актиновый филамент гибок, но филаменты, сшитые белками в пучки и сети, образуют прочные структуры. Наибольшая концентрация актина — под мембраной, в <a href="#ns-g-S2-T18">клеточном кортексе</a>. По актиновым филаментам движутся моторы <a href="#ns-g-S2-T56">миозины</a> (тема 4). &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, панель А: у актинового филамента подписаны плюс- и минус-концы, у субъединиц — буквы «Т» и «Д» (АТФ и АДФ).</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Слова «плюс» и «минус» не означают заряда: это названия концов.</p><details><summary>Дополнение (добровольно)</summary><p>Плюс-конец называют также «зазубренным», минус-конец — «заострённым»: так концы выглядят на электронных фотографиях, если филамент покрыт головками миозина.</p></details><div class="static-quiz"><h3>Почему у актинового филамента два конца различаются?</h3><ol><li><b>А.</b> На двух концах находятся разные белки <i>(неверный вариант)</i><br><span class="expl">Полярность есть и у филамента из одного очищенного актина; она — свойство укладки субъединиц</span></li><li><b>Б.</b> Субъединицы ориентированы одинаково <i>(верный вариант)</i><br><span class="expl">Да: ориентация субъединиц одинакова по всей длине, и поэтому один конец отличается от другого</span></li><li><b>В.</b> Один конец прикреплён к мембране <i>(неверный вариант)</i><br><span class="expl">Связь с мембраной не создаёт полярность; она есть и у свободного филамента</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-microtubule-structure"><div class="eyebrow">Три системы цитоскелета · шаг 3 из 29</div><h2>Как устроена микротрубочка?</h2><p class="lead">Микротрубочку собирает <a href="#ns-g-S2-T06">тубулин</a> — димер из α-тубулина и β-тубулина. Димеры выстраиваются «голова к хвосту» в <a href="#ns-g-S2-T07">протофиламенты</a>; 13 параллельных протофиламентов замыкаются в полую трубку.</p><div class="note"><strong>Что показывает схема.</strong> Плюс-конец оканчивается β-тубулином</div><ol class="mech"><li>Все димеры ориентированы одинаково, поэтому микротрубочка полярна: на плюс-конце наружу обращён β-тубулин, на минус-конце — α-тубулин. Каждая субъединица тубулина несёт <a href="#ns-g-S2-T34">ГТФ</a>; в β-тубулине ГТФ гидролизуется после встраивания, в α-тубулине — нет. Чтобы разорвать микротрубочку посередине, нужно одновременно разорвать связи во всех 13 протофиламентах, поэтому тепловое движение её не ломает, а присоединение и отделение субъединиц на концах идут легко. Полая трубка гораздо жёстче двухцепочечного актинового филамента.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·2 (полярность)</p><p>Жёсткость позволяет микротрубочкам пересекать клетку и сопротивляться изгибу и сжатию. Минус-концы обычно закреплены в <a href="#ns-g-S2-T19">центре организации</a>, плюс-концы растут к периферии (БИО-2·5). &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, панель А: разрез из 13 кружков; α и β различаются цветом.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Число протофиламентов 13 — у большинства микротрубочек.</p><div class="static-quiz"><h3>Какой тубулин обращён наружу на плюс-конце микротрубочки?</h3><ol><li><b>А.</b> α-тубулин <i>(неверный вариант)</i><br><span class="expl">α-тубулин обращён наружу на минус-конце</span></li><li><b>Б.</b> На обоих концах одинаковые <i>(неверный вариант)</i><br><span class="expl">Тогда микротрубочка не была бы полярной</span></li><li><b>В.</b> β-тубулин <i>(верный вариант)</i><br><span class="expl">Да: плюс-конец оканчивается β-тубулином, минус-конец — α-тубулином</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-intermediate-filaments"><div class="eyebrow">Три системы цитоскелета · шаг 4 из 29</div><h2>Почему у промежуточных филаментов нет полярности?</h2><p class="lead">Белки промежуточных филаментов — вытянутые молекулы с α-спиральной средней частью. Две молекулы скручиваются в параллельный димер, а два димера укладываются навстречу друг другу в <a href="#ns-g-S2-T12">антипараллельный тетрамер</a>.</p><div class="note"><strong>Что показывает схема.</strong> В тетрамере два димера уложены навстречу друг другу — концы одинаковы</div><ol class="mech"><li>В тетрамере ориентации двух димеров противоположны, и тетрамер с обоих концов одинаков. Из тетрамеров, уложенных бок о бок и конец к концу, собирается филамент около 10 нм. Поэтому у промежуточного филамента нет плюс- и минус-конца, и моторные белки по нему направленно не движутся. Субъединицы не несут АТФ или ГТФ. Сильные боковые связи делают филамент прочным: он сильно растягивается и не рвётся.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·2, БИО-2·3</p><p>Промежуточные филаменты разных клеток собраны из разных белков: <a href="#ns-g-S2-T13">кератины</a> — в эпителии, <a href="#ns-g-S2-T14">виментин</a> — во многих клетках соединительной ткани, десмин — в мышечных, нейрофиламенты — в <a href="#ns-g-S2-T52">аксонах</a>; <a href="#ns-g-S2-T15">ламины</a> образуют сеть под внутренней мембраной ядра. Кератиновые сети соединены с межклеточными контактами — <a href="#ns-g-S2-T16">десмосомами</a> — и с контактами клетки с внеклеточным матриксом — <a href="#ns-g-S2-T17">гемидесмосомами</a>; так нагрузка распределяется по ткани. Промежуточные филаменты обновляются медленнее актина и микротрубочек, но не неподвижны: при делении клетки их белки <a href="#ns-g-S2-T78">фосфорилируются</a>, и сеть быстро разбирается. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1 и лупа на панели А.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; «Неполярность» означает отсутствие направленности пути для моторов; это не значит, что молекулы в филаменте лишены ориентации.</p><details><summary>Дополнение (добровольно)</summary><p>Дефект кератина в базальных клетках эпидермиса приводит к тому, что кожа покрывается пузырями даже при слабом механическом воздействии — клетки разрываются. Пример иллюстрирует механизм, а не правило диагностики.</p></details><div class="static-quiz"><h3>Почему по промежуточному филаменту не может направленно двигаться моторный белок?</h3><ol><li><b>А.</b> Его концы одинаковы <i>(верный вариант)</i><br><span class="expl">Да: нет различия «вперёд — назад», по которому мотор мог бы шагать в одну сторону</span></li><li><b>Б.</b> Он слишком толстый для мотора <i>(неверный вариант)</i><br><span class="expl">Толщина не мешает: микротрубочка ещё толще, а моторы по ней движутся</span></li><li><b>В.</b> Он покрыт другими белками <i>(неверный вариант)</i><br><span class="expl">Не в этом причина: у промежуточных филаментов нет полярности как таковой</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-centrosome"><div class="eyebrow">Три системы цитоскелета · шаг 5 из 29</div><h2>Откуда растут микротрубочки: центросома, центриоли и другие центры организации</h2><p class="lead">Новая микротрубочка не возникает в любом месте: её образование — <a href="#ns-g-S2-T26">нуклеация</a> — требует затравки. Её даёт <a href="#ns-g-S2-T23">γ-тубулиновый кольцевой комплекс</a> (γ-TuRC): кольцо из γ-тубулина и других белков повторяет расположение 13 протофиламентов, и на нём собирается минус-конец.</p><div class="note"><strong>Что показывает схема.</strong> Микротрубочки растут из колец γ-тубулина вокруг центриолей</div><ol class="mech"><li>Место, где сосредоточены такие комплексы и закреплены минус-концы, называют центром организации микротрубочек (ЦОМТ). В большинстве животных клеток главный ЦОМТ — <a href="#ns-g-S2-T20">центросома</a> у ядра: пара <a href="#ns-g-S2-T21">центриолей</a>, расположенных под прямым углом, и окружающий их <a href="#ns-g-S2-T22">перицентриолярный материал</a>, в котором и находятся кольца γ-TuRC. Микротрубочки растут не из стенки центриоли, а из этого материала. Центриоль — цилиндр из девяти триплетов микротрубочек.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·3</p><p>Центросома — не единственный ЦОМТ. У высших растений центросом нет, а микротрубочки нуклеируются у оболочки ядра и у мембраны; в животных клетках ЦОМТ бывают на <a href="#ns-g-S2-T79">аппарате Гольджи</a>, у апикальной поверхности эпителиальной клетки, на оболочке ядра мышечной клетки. Перед делением центросома удваивается, и две центросомы становятся полюсами <a href="#ns-g-S2-T43">веретена деления</a> (семинар 6). Центриоль может стать <a href="#ns-g-S2-T24">базальным тельцем</a>, из которого растут микротрубочки <a href="#ns-g-S2-T25">реснички</a>. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 7: после удаления центриолей микротрубочки есть, но сеть хуже сфокусирована.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; «Центросома» и «центриоль» — разные понятия: центриоль — часть центросомы.</p><div class="static-quiz"><h3>Что непосредственно нуклеирует минус-конец микротрубочки в центросоме?</h3><ol><li><b>А.</b> Стенка самой центриоли из триплетов <i>(неверный вариант)</i><br><span class="expl">Триплеты центриоли — её собственные микротрубочки; цитоплазматические микротрубочки растут из колец γ-тубулина</span></li><li><b>Б.</b> Кольца γ-тубулина вокруг центриолей <i>(верный вариант)</i><br><span class="expl">Да: центриоли собирают этот материал вокруг себя</span></li><li><b>В.</b> Оболочка ядра рядом с центросомой <i>(неверный вариант)</i><br><span class="expl">Ядро рядом, но нуклеирует не оно; лишь в некоторых клетках ЦОМТ находится на оболочке ядра</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41580-022-00473-y">Akhmanova A., Kapitein L. C. Mechanisms of microtubule organization in differentiated animal cells. Nat. Rev. Mol. Cell Biol. 2022; 23: 541–558</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-mechanics-shared"><div class="eyebrow">Три системы цитоскелета · шаг 6 из 29</div><h2>Как три системы делят механическую работу?</h2><p class="lead">Нагрузки, которые испытывает клетка, различны: растяжение, сжатие и изгиб, изменение формы поверхности, перенос груза. Каждая система лучше справляется со своей.</p><div class="note"><strong>Что показывает схема.</strong> Растяжение — сохранено, перенос — сохранено, выпячивание — сохранено</div><ol class="mech"><li>Промежуточные филаменты главным образом сопротивляются растяжению и через десмосомы распределяют его по ткани. Микротрубочки жёсткие и выдерживают сжатие и изгиб, а главное — служат путями для транспорта. Актиновый кортекс связан с мембраной белками-адаптерами (семинар 1); вместе с миозином он создаёт натяжение поверхности и определяет её форму. Ни одна механическая функция не принадлежит только одной системе: снижение функции кортекса ослабляет устойчивость клетки, даже если промежуточные филаменты в норме.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·1–2·4; вспомнить БИО-1·6 (кортикальный слой и белки, связывающие его с мембраной)</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, панель Б и шаги 4–6: при сильно сниженной функции промежуточных филаментов нарушена устойчивость к растяжению; микротрубочек — перенос груза; актина — выпячивание, а устойчивость к растяжению ослаблена. Правило модели: у каждой нагрузки есть главная и вспомогательная система.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Правило «главная — вспомогательная» — учебное упрощение. Общей числовой шкалы прочности трёх систем нет.</p><div class="static-quiz"><h3>У клетки сильно снижена функция актинового кортекса, промежуточные филаменты в норме. Что с устойчивостью к растяжению в модели?</h3><ol><li><b>А.</b> Не изменилась <i>(неверный вариант)</i><br><span class="expl">Кортекс участвует в механике клетки; его снижение ослабляет устойчивость</span></li><li><b>Б.</b> Нарушена <i>(неверный вариант)</i><br><span class="expl">Нарушение — при сильном снижении главной системы, то есть промежуточных филаментов</span></li><li><b>В.</b> Ослаблена <i>(верный вариант)</i><br><span class="expl">Да: кортекс — вспомогательная система, главная — промежуточные филаменты</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-nucleus-squeeze"><div class="eyebrow">Три системы цитоскелета · шаг 7 из 29</div><h2>Как три системы вместе деформируют ядро и восстанавливают его форму, когда клетка протискивается сквозь ткань</h2><p class="lead">Клетки иммунной системы и опухолевые клетки проходят сквозь промежутки в тканях диаметром от 1 до 20 мкм. Ядро — самая крупная и жёсткая органелла клетки, и оно должно деформироваться.</p><div class="note"><strong>Что показывает схема.</strong> Ядро — самая крупная и жёсткая часть клетки</div><ol class="mech"><li>В деформации ядра участвуют все три системы. Актомиозин может проталкивать ядро сзади и сжимать его с боков; микротрубочки через центросому могут тянуть его вперёд. Какой механизм главный, зависит от типа клеток и обсуждается. Возврат ядра к прежней форме после деформации требует ламинов A/C — белков промежуточных филаментов ядра — и виментина — белка промежуточных филаментов цитоплазмы, а также белков, соединяющих ядерную оболочку с цитоскелетом.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·4, БИО-2·6</p><p>Сильная деформация может приводить к временным разрывам ядерной оболочки и к повреждению ДНК. &lt;b&gt;Исследование 1 практикума&lt;/b&gt; иллюстрирует ту же логику на учебной модели (это не доказательство): сочетание нагрузок выявляет сразу две ослабленные системы, а одну систему нельзя «усилить» вместо другой.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Данные получены в основном на культивируемых клетках в искусственных узких каналах; насколько часто разрывы оболочки происходят в тканях организма, изучено меньше.</p><details><summary>Как это узнали (добровольно)</summary><p>ядро в живой клетке деформировали и после снятия нагрузки следили, возвращается ли оно к прежней форме: без ламинов A/C, белков, связывающих оболочку ядра с цитоскелетом, или виментина возврат был хуже. Прохождение клеток сквозь узкие промежутки изучают, пропуская их через каналы известной ширины.</p></details><div class="static-quiz"><h3>Что, по этим данным, нужно ядру, чтобы вернуть форму после протискивания?</h3><ol><li><b>А.</b> Ламины A/C и виментин <i>(верный вариант)</i><br><span class="expl">Да: обе группы — белки промежуточных филаментов, ядерных и цитоплазматических</span></li><li><b>Б.</b> Только миозин II актомиозина <i>(неверный вариант)</i><br><span class="expl">Миозин сдавливает и проталкивает ядро, но упругий возврат формы обеспечивают другие белки</span></li><li><b>В.</b> Только микротрубочки от центросомы <i>(неверный вариант)</i><br><span class="expl">Микротрубочки тянут ядро вперёд; возврат формы с ними здесь не связан</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00480-z">Kalukula Y., Stephens A. D., Lammerding J., Gabriele S. Mechanics and functional consequences of nuclear deformations. Nat. Rev. Mol. Cell Biol. 2022; 23: 583–602</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-polymerization"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 8 из 29</div><h2>Сборка полимера: свободный пул, полимеризация и нуклеация</h2><p class="lead"><a href="#ns-g-S2-T27">Полимеризация</a> — присоединение субъединиц к концам полимера, <a href="#ns-g-S2-T28">деполимеризация</a> — их отделение. Субъединицы, не встроенные в полимер, составляют <a href="#ns-g-S2-T29">свободный пул</a>.</p><div class="note"><strong>Что показывает схема.</strong> Ниже Cc отделение быстрее присоединения — полимер укорачивается</div><ol class="mech"><li>Скорость присоединения к концу пропорциональна концентрации свободных субъединиц, а скорость отделения от концентрации не зависит. Поэтому при высокой концентрации полимер растёт, при низкой — укорачивается; концентрацию, при которой рост и укорочение уравновешены, называют критической. Начать новый полимер трудно: несколько субъединиц должны сначала собраться вместе. Поэтому в клетке нуклеацию обеспечивают специальные белки: для микротрубочек — γ-TuRC, для актина — <a href="#ns-g-S2-T61">комплекс Arp2/3</a> и <a href="#ns-g-S2-T62">формины</a> (тема 4).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·2, БИО-2·3, БИО-2·5</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 4: при высоком уровне свободного тубулина микротрубочка растёт быстрее.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Описание через критическую концентрацию строго верно для полимера без гидролиза нуклеотида; гидролиз делает поведение концов разным (БИО-2·10, БИО-2·13).</p><div class="static-quiz"><h3>Почему без специальных белков новые микротрубочки в клетке почти не образуются, хотя свободного тубулина много?</h3><ol><li><b>А.</b> Свободный тубулин не присоединяется к концам <i>(неверный вариант)</i><br><span class="expl">К концам существующих микротрубочек присоединяется</span></li><li><b>Б.</b> Без затравки сборка нового полимера медленна <i>(верный вариант)</i><br><span class="expl">Да: нуклеация — кинетический барьер; его снимает γ-TuRC</span></li><li><b>В.</b> Свободный тубулин не несёт ГТФ <i>(неверный вариант)</i><br><span class="expl">Свободный тубулин несёт ГТФ</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-dynamic-instability"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 9 из 29</div><h2>Динамическая нестабильность: рост, катастрофа, укорочение, спасение</h2><p class="lead">Отдельная микротрубочка при постоянной концентрации свободного тубулина то растёт, то быстро укорачивается. Такое поведение называют <a href="#ns-g-S2-T30">динамической нестабильностью</a>.</p><div class="note"><strong>Что показывает схема.</strong> 2 катастрофы, 0 спасений, 2 полные разборки; средняя длина 3,18</div><ol class="mech"><li>Переход от роста к укорочению — <a href="#ns-g-S2-T31">катастрофа</a>, от укорочения к росту — <a href="#ns-g-S2-T32">спасение</a>. Если спасения нет, микротрубочка укорачивается до минус-конца, и на том же месте может нуклеироваться новая. Переходы происходят в основном на плюс-конце; минус-конец обычно закреплён в ЦОМТ.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·8</p><p>Частоту катастроф и спасений меняют концентрация свободного тубулина и <a href="#ns-g-S2-T39">белки, ассоциированные с микротрубочками</a>: одни стабилизируют стенку, <a href="#ns-g-S2-T82">белки спасения</a> прерывают укорочение, другие, например <a href="#ns-g-S2-T38">факторы катастроф</a> (<a href="#ns-g-S2-T47">кинезины</a> семейства 13), ускоряют переход к укорочению. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаги 1, 5, 6.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Термин «катастрофа» относится к одной микротрубочке; это не «митотическая катастрофа» — гибель клетки при сбое деления. Момент катастрофы случаен: две микротрубочки в одних условиях ведут себя по-разному.</p><div class="static-quiz"><h3>Длина микротрубочки росла, затем быстро уменьшилась, но не до нуля, и снова начала расти. Как называется последний переход?</h3><ol><li><b>А.</b> Катастрофа <i>(неверный вариант)</i><br><span class="expl">Катастрофа — переход от роста к укорочению</span></li><li><b>Б.</b> Нуклеация <i>(неверный вариант)</i><br><span class="expl">Нуклеация — начало новой микротрубочки с нуля, а эта не разобралась до конца</span></li><li><b>В.</b> Спасение <i>(верный вариант)</i><br><span class="expl">Да: переход от укорочения к росту до полной разборки</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-gtp-cap"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 10 из 29</div><h2>ГТФ-шапочка: почему растущий конец устойчив</h2><p class="lead">Тубулин присоединяется к плюс-концу как ГТФ-тубулин, а гидролиз ГТФ до ГДФ в β-тубулине происходит позже. Пока присоединение опережает гидролиз, у конца остаётся участок ГТФ-тубулина — <a href="#ns-g-S2-T33">ГТФ-шапочка</a>.</p><div class="note"><strong>Что показывает схема.</strong> У растущего конца — участок ГТФ-тубулина; субъединицы встраиваются и выпрямляются</div><ol class="mech"><li>ГДФ-тубулин в стенке удерживается прямым только боковыми связями с соседями; в свободном состоянии он изогнут. Пока на конце есть ГТФ-шапочка, присоединившиеся субъединицы встраиваются в стенку, выпрямляются и прочно связываются с соседями (короткие концы протофиламентов у растущего конца слегка отогнуты). Если гидролиз догоняет конец, протофиламенты из ГДФ-тубулина изгибаются наружу и быстро распадаются: от конца с ГДФ-тубулином субъединицы уходят (в экспериментах в пробирке) примерно в 100 раз быстрее, чем от конца с ГТФ-тубулином. Энергия гидролиза запасена в напряжённой стенке и освобождается при разборке.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·3, БИО-2·9</p><p>Отсюда два следствия. Быстрый рост (много свободного тубулина) уменьшает вероятность катастрофы. Гидролиз необходим для динамической нестабильности: микротрубочки из тубулина с негидролизуемым аналогом ГТФ почти не разбираются; но катастрофа не следует автоматически за каждым гидролизом — важно соотношение скоростей. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаги 2, 3, 4, 7 и панель Б.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; ГТФ-шапочка — функциональная модель состояния конца, а не постоянная структура: её размер меняется, и что именно на уровне структуры запускает катастрофу, до конца не установлено.</p><div class="static-quiz"><h3>Почему микротрубочка из тубулина с негидролизуемым аналогом ГТФ почти не укорачивается?</h3><ol><li><b>А.</b> В стенке нет ГДФ-тубулина <i>(верный вариант)</i><br><span class="expl">Да: без гидролиза конец не теряет защиту</span></li><li><b>Б.</b> Аналог мешает тубулину присоединяться к концу <i>(неверный вариант)</i><br><span class="expl">Присоединение идёт: такие микротрубочки растут. Причина устойчивости — в стенке нет ГДФ-тубулина</span></li><li><b>В.</b> Аналог прикрепляет её к центросоме <i>(неверный вариант)</i><br><span class="expl">Аналог действует на сами субъединицы, а не на связь с ЦОМТ</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41556-022-01033-4">Song X., Yang F., Yang T. et al. Phase separation of EB1 guides microtubule plus-end dynamics. Nat. Cell Biol. 2023; 25: 79–91</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-length-plot"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 11 из 29</div><h2>Как читать график длины микротрубочки</h2><p class="lead">График длины от времени — главный способ описать поведение одной микротрубочки.</p><div class="note"><strong>Что показывает схема.</strong> Наибольшая длина 9,0; катастрофы при t = 6 и 19</div><ol class="mech"><li>Положительный наклон — рост, отрицательный — укорочение; крутизна наклона — скорость. Вершина, после которой длина падает, — катастрофа; минимум выше нуля, после которого длина растёт, — спасение; участок на нуле и начало роста от нуля — полная разборка и новая нуклеация. Наклон при укорочении обычно круче, чем при росте.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·9, БИО-2·10</p><p>По одному графику можно определить не только переходы, но и средние величины: скорость роста, частоту катастроф (число катастроф за время роста), долю времени в росте. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, панель А: средний уровень тубулина — 2 катастрофы за 24 у.е.в., наибольшая длина 9,0, средняя 3,18 у.е.д.; с белком спасения — 3 спасения, полных разборок нет, средняя длина 7,22.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Числа модели условные; в клетке скорости и частоты различаются в разных типах клеток и в разных участках одной клетки.</p><div class="static-quiz"><h3>На графике длина 5 у.е.в. росла с наклоном +1, затем 1 у.е.в. падала с наклоном −3, затем снова росла. Сколько переходов произошло?</h3><ol><li><b>А.</b> Один: катастрофа <i>(неверный вариант)</i><br><span class="expl">После укорочения рост возобновился — это второй переход</span></li><li><b>Б.</b> Два: катастрофа и спасение <i>(верный вариант)</i><br><span class="expl">Да: рост → укорочение → рост</span></li><li><b>В.</b> Ни одного: это обычные колебания длины <i>(неверный вариант)</i><br><span class="expl">Смена знака наклона — это и есть переходы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-why-unstable"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 12 из 29</div><h2>Зачем клетке полимер, который разбирается</h2><p class="lead">Динамическая нестабильность кажется расточительной, но именно она позволяет сети микротрубочек быстро меняться.</p><div class="note"><strong>Что показывает схема.</strong> Каждая растущая микротрубочка проходит в одном из направлений</div><ol class="mech"><li>Каждая растущая микротрубочка проходит в одном из направлений; если её плюс-конец встречает структуру, которая его связывает и защищает, микротрубочка сохраняется, а остальные разбираются и начинаются снова, возможно в других направлениях. Так сеть может перестраиваться: при делении клетки за минуты разбирается интерфазная сеть и собирается веретено (семинар 6); при поляризации клетки микротрубочки стабилизируются в одном направлении.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·9–2·11</p><p>Вещества, нарушающие динамику, останавливают такие перестройки. <a href="#ns-g-S2-T42">Колхицин</a> и нокодазол разбирают микротрубочки, <a href="#ns-g-S2-T41">таксол</a> их стабилизирует; и те и другие останавливают деление клеток. Это показывает, что функция микротрубочек зависит от их динамики, а не только от наличия. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 5: фактор катастроф укорачивает микротрубочки, но чаще начинаются новые.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Стабилизация «найденной» микротрубочки — модель; в клетке направление роста определяют и другие механизмы.</p><div class="static-quiz"><h3>Почему для сборки веретена деления микротрубочки должны уметь и расти, и укорачиваться?</h3><ol><li><b>А.</b> Иначе микротрубочки потеряют полярность <i>(неверный вариант)</i><br><span class="expl">Полярность от динамики не зависит</span></li><li><b>Б.</b> Укорочение нужно, чтобы удвоить центросому <i>(неверный вариант)</i><br><span class="expl">Центросома удваивается независимо от укорочения микротрубочек</span></li><li><b>В.</b> Сеть должна разобраться и собраться заново <i>(верный вариант)</i><br><span class="expl">Да: интерфазная сеть разбирается, и из тех же субъединиц собирается веретено</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-instability-vs-treadmilling"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 13 из 29</div><h2>Динамическая нестабильность и тредмиллинг — разные процессы</h2><p class="lead">Оба типа поведения связаны с гидролизом нуклеотида, но выглядят по-разному.</p><div class="note"><strong>Что показывает схема.</strong> Длина резко меняется: рост, катастрофа, укорочение</div><ol class="mech"><li>При <a href="#ns-g-S2-T40">тредмиллинге</a> субъединицы присоединяются к плюс-концу и с той же скоростью отделяются от минус-конца: длина постоянна, а каждая субъединица проходит через полимер от плюс-конца к минус-концу. При динамической нестабильности один конец резко переходит от роста к укорочению и обратно. Тредмиллинг особенно характерен для актина, динамическая нестабильность — для микротрубочек.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·2, БИО-2·9</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 8 и панель В: слева — график микротрубочки, справа — полимер постоянной длины с помеченной субъединицей.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Микротрубочки в определённых условиях тоже могут проявлять тредмиллинг, а актиновые филаменты — резкие переходы; «характерен» не значит «единственный».</p><div class="static-quiz"><h3>Длина полимера постоянна, но помеченная субъединица смещается от одного конца к другому. Что это?</h3><ol><li><b>А.</b> Тредмиллинг <i>(верный вариант)</i><br><span class="expl">Да: поток субъединиц при постоянной длине</span></li><li><b>Б.</b> Динамическая нестабильность <i>(неверный вариант)</i><br><span class="expl">Она проявляется изменениями длины</span></li><li><b>В.</b> Полимер неподвижен и не обновляется <i>(неверный вариант)</i><br><span class="expl">Смещение метки показывает обновление</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-eb1-condensate"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 14 из 29</div><h2>Белок плюс-конца регулирует динамику, собираясь в конденсат</h2><p class="lead">На растущем плюс-конце собираются <a href="#ns-g-S2-T36">белки плюс-конца</a>. Один из главных — <a href="#ns-g-S2-T37">EB1</a>: он узнаёт участок стенки у самого конца и привлекает другие белки.</p><div class="note"><strong>Что показывает схема.</strong> Конец без белков плюс-конца</div><ol class="mech"><li>Было известно, что EB1 ускоряет рост микротрубочек и повышает частоту катастроф, то есть делает конец динамичнее. Эксперименты показали, что для этого EB1 должен образовать у конца скопление без мембраны — <a href="#ns-g-S2-T44">конденсат</a>, в котором концентрируются тубулин и другие белки плюс-конца. Мутантный EB1, не способный образовывать конденсаты, почти не накапливался на растущем конце и не регулировал его динамику; в делящихся клетках с таким белком перемещение хромосом было нарушено.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·9, БИО-2·10</p><p>Вывод: динамичность конца не «случается», а регулируется белками, причём один и тот же белок может ускорять и рост, и переход к укорочению. Это согласуется с исследованием 2 практикума: динамичная сеть может быть эффективнее стабильной.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Эксперименты выполнены в пробирке и на культивируемых клетках; как конденсат EB1 работает в разных тканях, неизвестно.</p><details><summary>Как это узнали (добровольно)</summary><p>сравнивали обычный EB1 и белок с заменёнными аминокислотами, который не собирается в конденсаты.</p></details><div class="static-quiz"><h3>Что нового показали эксперименты с EB1?</h3><ol><li><b>А.</b> EB1 предотвращает катастрофы <i>(неверный вариант)</i><br><span class="expl">Нормальный EB1, наоборот, повышает их частоту</span></li><li><b>Б.</b> Регуляции нужен конденсат EB1 <i>(верный вариант)</i><br><span class="expl">Да: EB1 без конденсата почти не накапливается на растущем конце и не меняет рост и частоту катастроф</span></li><li><b>В.</b> EB1 нуклеирует микротрубочки <i>(неверный вариант)</i><br><span class="expl">Нуклеирует γ-TuRC; EB1 работает на растущем конце</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41556-022-01033-4">Song X., Yang F., Yang T. et al. Phase separation of EB1 guides microtubule plus-end dynamics. Nat. Cell Biol. 2023; 25: 79–91</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-search-optimum"><div class="eyebrow">Динамическая нестабильность микротрубочек · шаг 15 из 29</div><h2>Достижение мишени: почему максимальная динамика не всегда лучше</h2><p class="lead">Исследование 2 практикума моделирует, как 8 микротрубочек, растущих от одного центра, достигают <a href="#ns-g-S2-T75">мишени</a> на расстоянии 10 условных единиц за 60 единиц времени.</p><div class="note"><strong>Что показывает схема.</strong> Мишень достигнута в 65 % клеток; среднее время 10,0</div><ol class="mech"><li>Стабильная сеть достигает мишени, только если в начале одна из микротрубочек уже направлена к ней: так в 65 % условных клеток (прогонов модели). Сеть средней динамики после катастроф начинает микротрубочки в новых направлениях и достигает мишени в 83 % условных клеток. При очень частых катастрофах микротрубочки остаются короткими, и доля падает до 23 %. Если мишень вдвое дальше, преимущество динамики исчезает: стабильная сеть и сеть с низкой динамикой достигают мишени одинаково часто (около 65 %), средняя — в 53 %, высокая — в 10 %.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·12</p><p>Нужно различать три показателя: вероятность достижения мишени, время достижения и устойчивость контакта после него. Стабильная сеть, когда достигает мишени, делает это быстрее (10 против 20 единиц времени), но реже. Поэтому одна и та же доля достижения у двух клеток может получиться при разной частоте катастроф, если различаются расстояние до мишени, скорость роста или спасения.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Вероятности катастроф и спасений в модели учебные; модель плоская и не учитывает, что клетка может направлять рост микротрубочек.</p><div class="static-quiz"><h3>Почему при очень частых катастрофах мишень достигается реже, хотя направления перебираются быстрее?</h3><ol><li><b>А.</b> Новые микротрубочки начинаются только в старых направлениях <i>(неверный вариант)</i><br><span class="expl">В модели новое направление выбирается случайно</span></li><li><b>Б.</b> Катастрофы уничтожают мишень <i>(неверный вариант)</i><br><span class="expl">Мишень от катастроф не зависит</span></li><li><b>В.</b> Микротрубочки разбираются раньше, чем дорастают до мишени <i>(верный вариант)</i><br><span class="expl">Да: перебор направлений есть, а длины не хватает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-motor-cycle"><div class="eyebrow">Моторные белки и направление транспорта · шаг 16 из 29</div><h2>Моторный белок: как энергия АТФ превращается в шаг</h2><p class="lead">Моторный белок связывается с филаментом и, гидролизуя АТФ, меняет форму так, что перемещается вдоль филамента и переносит прикреплённый к нему <a href="#ns-g-S2-T50">груз</a>.</p><div class="note"><strong>Что показывает схема.</strong> Задняя головка после гидролиза АТФ отделилась; передняя, связанная с микротрубочкой, связывает АТФ</div><ol class="mech"><li>По микротрубочкам движутся кинезины и динеины, по актиновым филаментам — миозины. <a href="#ns-g-S2-T48">Кинезин-1</a> имеет две головки: они поочерёдно связываются с микротрубочкой, и каждый цикл связывания, гидролиза АТФ и отделения переносит заднюю головку вперёд («шаг за шагом»). <a href="#ns-g-S2-T49">Цитоплазматический динеин</a> — крупный белок, не родственный кинезинам; его головка — кольцо, связанное с микротрубочкой стебельком.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·2, БИО-2·3</p><p>Моторы переносят везикулы, органеллы, <a href="#ns-g-S2-T72">мРНК</a> и белковые комплексы, а также сдвигают микротрубочки относительно друг друга. Без АТФ моторы не шагают. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, панель А и шаг 6.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Скорость движения и размер шага в модели условные.</p><div class="static-quiz"><h3>Что происходит с моторами кинезином-1 и динеином при резком снижении АТФ в клетке?</h3><ol><li><b>А.</b> Оба перестают шагать <i>(верный вариант)</i><br><span class="expl">Да: оба — АТФазы</span></li><li><b>Б.</b> Останавливается только кинезин <i>(неверный вариант)</i><br><span class="expl">Динеин тоже использует АТФ</span></li><li><b>В.</b> Оба меняют направление <i>(неверный вариант)</i><br><span class="expl">Нехватка АТФ не меняет направление</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41580-024-00780-6">Yildiz A. Mechanism and regulation of kinesin motors. Nat. Rev. Mol. Cell Biol. 2025; 26: 86–103</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-motor-direction"><div class="eyebrow">Моторные белки и направление транспорта · шаг 17 из 29</div><h2>Направление мотора задаёт полярность микротрубочки</h2><p class="lead">Каждый мотор движется к определённому концу микротрубочки.</p><div class="note"><strong>Что показывает схема.</strong> Большинство кинезинов — к плюс-концу; кинезин-14 и динеин — к минус-концу</div><ol class="mech"><li>Кинезин-1 и большинство кинезинов движутся к плюс-концу; цитоплазматический динеин — к минус-концу. Есть и кинезины, движущиеся к минус-концу (семейство 14), и кинезины, которые не переносят груз, а разбирают концы микротрубочек (семейство 13). Поэтому фраза «кинезин движется к плюс-концу» верна для определённого кинезина, и в задачах нужно указывать, о каком моторе речь. Миозины, кроме одного (миозина VI), движутся к плюс-концу актинового филамента.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·3, БИО-2·16</p><p>Если микротрубочку повернуть, мотор пойдёт в другую сторону пространства — но по-прежнему к тому же концу. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаги 1–2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; На одном грузе в клетке часто есть и кинезины, и динеины; какой из них активен, регулируют белки-адаптеры.</p><div class="static-quiz"><h3>Почему нельзя сказать «все кинезины движутся к плюс-концу»?</h3><ol><li><b>А.</b> Кинезины движутся в случайном направлении <i>(неверный вариант)</i><br><span class="expl">Каждый кинезин движется в определённом направлении</span></li><li><b>Б.</b> Есть кинезины, движущиеся к минус-концу <i>(верный вариант)</i><br><span class="expl">Да: например, кинезины семейства 14</span></li><li><b>В.</b> Кинезины движутся по актину <i>(неверный вариант)</i><br><span class="expl">Кинезины движутся по микротрубочкам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41580-024-00780-6">Yildiz A. Mechanism and regulation of kinesin motors. Nat. Rev. Mol. Cell Biol. 2025; 26: 86–103</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-mt-orientation"><div class="eyebrow">Моторные белки и направление транспорта · шаг 18 из 29</div><h2>Как ориентированы микротрубочки в разных клетках</h2><p class="lead">Ориентация микротрубочек — свойство клетки, а не мотора.</p><div class="note"><strong>Что показывает схема.</strong> Кинезин-1 → к периферии; динеин → к центру</div><ol class="mech"><li>В клетке соединительной ткани в культуре микротрубочки расходятся от центросомы, плюс-концы — на периферии: кинезин-1 везёт груз — например, <a href="#ns-g-S2-T81">лизосомы</a> — к периферии, динеин — к центру. В аксоне нейрона все микротрубочки обращены плюс-концом к окончанию: кинезины переносят белки и мембранные компоненты из тела нейрона к синапсам, динеин — обратно. В <a href="#ns-g-S2-T53">дендритах</a> нейронов млекопитающих микротрубочки лежат в обеих ориентациях. В эпителиальной клетке микротрубочки идут вертикально: минус-концы у <a href="#ns-g-S2-T54">апикальной стороны</a>, плюс-концы у базальной.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·5, БИО-2·17</p><p>Аксон человека может достигать метра в длину, поэтому направленный транспорт по нему особенно важен. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаги 3–5.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Каждая микротрубочка аксона короче аксона; пути состоят из многих перекрывающихся микротрубочек одной ориентации.</p><div class="static-quiz"><h3>В эпителиальной клетке груз на кинезине-1. Куда он будет перемещаться?</h3><ol><li><b>А.</b> К апикальной стороне <i>(неверный вариант)</i><br><span class="expl">Там минус-концы: туда везёт динеин</span></li><li><b>Б.</b> К центросоме у ядра <i>(неверный вариант)</i><br><span class="expl">К минус-концам кинезин-1 не движется</span></li><li><b>В.</b> К базальной стороне <i>(верный вариант)</i><br><span class="expl">Да: там плюс-концы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41580-022-00473-y">Akhmanova A., Kapitein L. C. Mechanisms of microtubule organization in differentiated animal cells. Nat. Rev. Mol. Cell Biol. 2022; 23: 541–558</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-two-directions"><div class="eyebrow">Моторные белки и направление транспорта · шаг 19 из 29</div><h2>Направление относительно микротрубочки и направление в клетке — разные величины</h2><p class="lead">Чтобы предсказать путь груза, нужны три сведения: тип мотора, ориентация микротрубочки на этом участке, положение груза.</p><div class="note"><strong>Что показывает схема.</strong> Кинезин-1: к плюс-концу = к мембране</div><ol class="mech"><li>Полярность микротрубочки — где её плюс- и минус-конец. Направление мотора относительно микротрубочки — к плюс- или к минус-концу. Пространственное направление в клетке — к ядру, к мембране, к базальной стороне. Третье определяется первыми двумя. Поэтому по направлению движения груза можно определить мотор, только если известна ориентация пути, и наоборот.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·17, БИО-2·18</p><p>Пространственная организация транспорта — часть <a href="#ns-g-S2-T76">клеточной полярности</a>: различия между частями клетки (апикальная и базальная стороны эпителия, аксон и дендриты нейрона) поддерживаются в том числе направленной доставкой компонентов по ориентированным путям. Её продолжение — семинар 4 (адресная доставка мембранных белков). &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, обратная задача.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Здесь рассматривается один мотор на грузе.</p><div class="static-quiz"><h3>Груз движется от ядра к мембране. Достаточно ли этого, чтобы назвать мотор?</h3><ol><li><b>А.</b> Нет: нужна ориентация микротрубочек <i>(верный вариант)</i><br><span class="expl">Да: при плюс-концах у мембраны — плюс-направленный мотор, при минус-концах — динеин</span></li><li><b>Б.</b> Да: к мембране всегда везёт кинезин-1 <i>(неверный вариант)</i><br><span class="expl">Только если плюс-концы у мембраны</span></li><li><b>В.</b> Да: к мембране всегда везёт динеин <i>(неверный вариант)</i><br><span class="expl">Только если у мембраны минус-концы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41580-022-00473-y">Akhmanova A., Kapitein L. C. Mechanisms of microtubule organization in differentiated animal cells. Nat. Rev. Mol. Cell Biol. 2022; 23: 541–558</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-mixed-networks"><div class="eyebrow">Моторные белки и направление транспорта · шаг 20 из 29</div><h2>Один кинезин — разные направления в клетке</h2><p class="lead">Обзор последних лет сводит данные о том, как микротрубочки организованы в специализированных клетках животных.</p><div class="note"><strong>Что показывает схема.</strong> Средний сдвиг кинезина-1 +1,0 (к концу отростка)</div><ol class="mech"><li>В дендритах нейронов млекопитающих микротрубочки лежат в обеих ориентациях, причём обращённые минус-концом наружу устойчивее. Центрами организации служат не только центросома, но и аппарат Гольджи, оболочка ядра в мышечных клетках, апикальная поверхность эпителия и межклеточные контакты. &lt;b&gt;Исследование 3 практикума&lt;/b&gt; моделирует смешанный пучок: при доле микротрубочек «плюс-концом наружу» 0,5 груз кинезина-1 в среднем стоит на месте, при 0,3 — сдвигается внутрь (−0,4), а груз динеина — наружу (+0,4). Смена ориентации меняет пространственный вектор, но не направление мотора.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·18, БИО-2·19</p><p>Как именно поддерживается смешанная ориентация в дендритах, пока до конца не понятно.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; В модели мотор пересаживается между микротрубочками случайно. В настоящих отростках микротрубочки одной ориентации часто собраны в пучки, и мотор после пересадки, вероятно, продолжает движение в ту же сторону; кроме того, выбор микротрубочки зависит от её устойчивости и связанных белков. Поэтому средний сдвиг не сводится к доле ориентаций.</p><details><summary>Как это узнали (добровольно)</summary><p>Ориентацию микротрубочек в отростках нейронов определяют по тому, в какую сторону растут их концы: растут в основном плюс-концы, а белки, связывающиеся только с растущими концами, светятся именно у них.</p></details><div class="static-quiz"><h3>В пучке 70 % микротрубочек обращены плюс-концом к телу клетки. Куда в среднем сдвигается груз кинезина-1?</h3><ol><li><b>А.</b> К концу отростка <i>(неверный вариант)</i><br><span class="expl">Так было бы, если бы большинство плюс-концов было обращено наружу</span></li><li><b>Б.</b> К телу клетки <i>(верный вариант)</i><br><span class="expl">Да: большинство плюс-концов там</span></li><li><b>В.</b> Не сдвигается <i>(неверный вариант)</i><br><span class="expl">Средний сдвиг ноль — только при равных долях</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00473-y">Akhmanova A., Kapitein L. C. Mechanisms of microtubule organization in differentiated animal cells. Nat. Rev. Mol. Cell Biol. 2022; 23: 541–558</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-kinesin-autoinhibition"><div class="eyebrow">Моторные белки и направление транспорта · шаг 21 из 29</div><h2>Кинезин без груза выключен</h2><p class="lead">У человека 45 генов кинезинов, и многие изученные кинезины, в том числе кинезин-1, не движутся, пока не связаны с грузом.</p><div class="note"><strong>Что показывает схема.</strong> Без груза хвост выключает головки и мешает связыванию с микротрубочкой — АТФ не тратится</div><ol class="mech"><li>Без груза кинезин-1 складывается: хвост прижимается к моторным головкам, выключает их и мешает им связываться с микротрубочкой — это <a href="#ns-g-S2-T55">аутоингибирование</a>. Белок, связанный с микротрубочкой (MAP7), присоединяется к средней спиральной части молекулы, а <a href="#ns-g-S2-T51">белок-адаптер</a> груза — к хвосту; вместе они раскладывают мотор и включают его. В результате выключенный мотор не гидролизует АТФ и не связывается с микротрубочкой.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·16</p><p>Это объясняет, почему количество мотора в клетке не равно количеству работающего мотора.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Как именно белок, связанный с микротрубочкой, и адаптер раскладывают мотор, установлено не полностью: предложена двухэтапная схема включения.</p><details><summary>Как это узнали (добровольно)</summary><p>Сравнивали строение выключенного и работающего кинезина-1: в выключенном моторе нашли множество контактов между моторными головками, стеблем, хвостом и лёгкими цепями.</p></details><div class="static-quiz"><h3>Почему свободный кинезин-1 почти не движется по микротрубочкам?</h3><ol><li><b>А.</b> Без груза ему не хватает АТФ <i>(неверный вариант)</i><br><span class="expl">АТФ в цитоплазме достаточно; дело в выключенной конформации</span></li><li><b>Б.</b> Без груза кинезин-1 распадается на отдельные головки <i>(неверный вариант)</i><br><span class="expl">Кинезин-1 остаётся димером; без груза он складывается, и хвост выключает головки</span></li><li><b>В.</b> Хвост выключает головки <i>(верный вариант)</i><br><span class="expl">Да: это аутоингибирование</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00780-6">Yildiz A. Mechanism and regulation of kinesin motors. Nat. Rev. Mol. Cell Biol. 2025; 26: 86–103</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-actin-assembly"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 22 из 29</div><h2>Сборка актина: АТФ-актин, концы и тредмиллинг</h2><p class="lead">Свободный G-актин несёт АТФ и присоединяется в основном к плюс-концу филамента.</p><div class="note"><strong>Что показывает схема.</strong> Субъединица проходит цикл: пул → плюс-конец → разборка → пул</div><ol class="mech"><li>После встраивания АТФ гидролизуется, фосфат уходит, и старые участки становятся АДФ-актином, который удерживается слабее. Старые участки находятся у минус-конца, поэтому при росте плюс-конца субъединицы уходят в основном с минус-конца. Свободный АДФ-актин обменивает АДФ на АТФ; этот обмен ускоряет <a href="#ns-g-S2-T63">профилин</a>, который также доставляет мономеры к растущим концам. В большинстве немышечных клеток позвоночных около половины актина удерживается в свободной форме белками, связывающими мономер. <a href="#ns-g-S2-T65">Кэпирующий белок</a> закрывает плюс-конец и останавливает его рост; <a href="#ns-g-S2-T64">кофилин</a> связывается со старыми участками АДФ-актина и ускоряет их разборку.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·2, БИО-2·8, БИО-2·13</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 1: в сети у переднего края плюс-концы обращены к мембране.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Скорости реакций сильно различаются в пробирке и в клетке; в клетке их задают связывающие белки.</p><div class="static-quiz"><h3>Что делает кофилин?</h3><ol><li><b>А.</b> Ускоряет разборку АДФ-актина <i>(верный вариант)</i><br><span class="expl">Да: так субъединицы возвращаются в пул</span></li><li><b>Б.</b> Закрывает плюс-конец филамента <i>(неверный вариант)</i><br><span class="expl">Это кэпирующий белок</span></li><li><b>В.</b> Нуклеирует новые ветви сети <i>(неверный вариант)</i><br><span class="expl">Это комплекс Arp2/3</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-brownian-ratchet"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 23 из 29</div><h2>Как полимеризация актина толкает мембрану</h2><p class="lead"><a href="#ns-g-S2-T59">Ламеллиподия</a> — плоский выступ края ползущей клетки, заполненный ветвящейся сетью актина. Её выдвигает сила, возникающая при сборке актина.</p><div class="note"><strong>Что показывает схема.</strong> Конец упирается в мембрану</div><ol class="mech"><li>Новые филаменты начинаются как ветви на боковой поверхности старых под углом около 70°; их нуклеирует комплекс Arp2/3. Длинные неразветвлённые филаменты собирают формины. Плюс-концы сети упираются в мембрану. Мембрана и концы филаментов колеблются из-за теплового движения молекул; когда между концом филамента и мембраной открывается зазор, в него встраивается субъединица, и мембрана уже не возвращается. Это <a href="#ns-g-S2-T60">броуновский храповик</a>: случайные колебания превращаются в направленное движение, а <a href="#ns-g-S2-T77">механическую силу</a> создаёт само присоединение субъединиц.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·22; вспомнить БИО-1·4 (мембрана — жидкий гибкий бислой)</p><p>Энергию для этой работы даёт гидролиз АТФ в филаменте; обмен АДФ на АТФ в свободном актине восполняет запас АТФ-актина. Сила зависит от скорости сборки, числа и угла филаментов и сцепления сети. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 2 и лупа на панели А.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Броуновский храповик — модель; точные силы отдельных филаментов измерены в пробирке, в клетке они зависят от натяжения мембраны.</p><div class="static-quiz"><h3>Почему встраивание одной субъединицы не позволяет мембране вернуться назад?</h3><ol><li><b>А.</b> Субъединица связывается с мембраной ковалентно <i>(неверный вариант)</i><br><span class="expl">Ковалентной связи нет</span></li><li><b>Б.</b> Субъединица становится упором <i>(верный вариант)</i><br><span class="expl">Да: каждый шаг закрепляется</span></li><li><b>В.</b> Гидролиз АТФ отталкивает мембрану <i>(неверный вариант)</i><br><span class="expl">Гидролиз происходит позже и в глубине филамента</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li><li><a href="https://doi.org/10.1038/s41580-022-00508-4">Lappalainen P., Kotila T., Jégou A., Romet-Lemonne G. Biochemical and mechanical regulation of actin dynamics. Nat. Rev. Mol. Cell Biol. 2022; 23: 836–852</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-network-turnover"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 24 из 29</div><h2>Обновление сети: сборка впереди, разборка позади</h2><p class="lead">Сеть у края постоянно обновляется: впереди она собирается, позади разбирается.</p><div class="note"><strong>Что показывает схема.</strong> свободный актин G 25,0; в сети F 75,0; присоединение J 7,5; край 19,12</div><ol class="mech"><li>Кофилин разбирает старые филаменты из АДФ-актина в глубине ламеллиподии, и субъединицы возвращаются в свободный пул, откуда снова поступают к плюс-концам у мембраны. Это похоже на тредмиллинг отдельного филамента, но относится ко всей сети. Поскольку общее количество актина ограничено, без разборки пул быстро истощается.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·22, БИО-2·23</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 3: при остановленной разборке G падает с 80 до 2,26 к t = 10, а край останавливается на 7,99 у.е.д. вместо 19,12 к t = 20. Модель соблюдает закон сохранения: G + F = 100 в каждый момент. Доля свободного актина в модели (25 %) условная; в клетке около половины актина находится в свободной форме.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; В модели скорости пропорциональны G и F; в клетке оборот сети регулируют многие белки.</p><div class="static-quiz"><h3>В замкнутой модели остановили разборку. Почему край останавливается, хотя сборка не запрещена?</h3><ol><li><b>А.</b> Сеть становится слишком тяжёлой <i>(неверный вариант)</i><br><span class="expl">Масса сети на выдвижение в модели не влияет</span></li><li><b>Б.</b> Кофилин толкает мембрану назад <i>(неверный вариант)</i><br><span class="expl">Кофилин не толкает мембрану</span></li><li><b>В.</b> Закончился свободный пул <i>(верный вариант)</i><br><span class="expl">Да: без разборки субъединицы не возвращаются в пул</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-actomyosin"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 25 из 29</div><h2>Актомиозиновое сокращение — другая сила</h2><p class="lead">Миозины — моторные белки актиновых филаментов. <a href="#ns-g-S2-T57">Миозин II</a> образует биполярные нити: головки на двух концах нити обращены в противоположные стороны.</p><div class="note"><strong>Что показывает схема.</strong> Пучок укорачивается с 10 до 6,0 за 8 шагов; край выдвигается</div><ol class="mech"><li>Головка миозина II связывает актин, совершает силовой ход, отделяется после связывания АТФ и возвращается в исходное положение после его гидролиза. Биполярная нить, связанная с двумя антипараллельными филаментами, тянет их навстречу друг другу, и пучок укорачивается. Это <a href="#ns-g-S2-T58">актомиозиновое сокращение</a>: стягивание, а не толчок.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·16, БИО-2·22</p><p>Так работают саркомеры мышцы, <a href="#ns-g-S2-T68">стрессовые волокна</a> клеток на подложке, натяжение кортекса и <a href="#ns-g-S2-T69">сократительное кольцо</a>, разделяющее клетку при делении (семинар 6). &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 5: при подавленном миозине II пучок не сокращается, а край продолжает выдвигаться.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Для сокращения нужна правильная полярность филаментов и закрепление их концов.</p><div class="static-quiz"><h3>Чем сила актомиозина отличается от силы полимеризации актина?</h3><ol><li><b>А.</b> Стягивание против толчка <i>(верный вариант)</i><br><span class="expl">Да: два разных механизма</span></li><li><b>Б.</b> Ничем: обе создаёт миозин <i>(неверный вариант)</i><br><span class="expl">Полимеризационная сила не требует миозина</span></li><li><b>В.</b> Полимеризация тянет, миозин толкает <i>(неверный вариант)</i><br><span class="expl">Наоборот</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-edge-vs-cell"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 26 из 29</div><h2>Выдвижение края и перемещение клетки — не одно и то же</h2><p class="lead">Выпячивание края — первый этап ползания клетки, но не всё ползание.</p><div class="note"><strong>Что показывает схема.</strong> Сеть отъезжает назад; край почти не выдвигается</div><ol class="mech"><li>Чтобы край выдвигался, сеть должна опираться на подложку: белки адгезии (интегрины) связывают её с внеклеточным матриксом — это <a href="#ns-g-S2-T66">сцепление с подложкой</a>. Без сцепления значительная часть сборки уходит на движение сети назад — <a href="#ns-g-S2-T67">ретроградный поток</a>. Чтобы переместилась вся клетка, нужны ещё новые контакты впереди, сокращение актомиозина позади и открепление заднего края. Такая миграция медленная: фибробласты и эпителиальные клетки на стекле перемещаются меньше чем на 1 мкм в минуту.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·23–2·25</p><p>Поэтому тредмиллинг сети — не перемещение клетки, а смещение края — не смещение центра клетки. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 4: без сцепления сборка идёт с той же скоростью, а край продвигается в 5 раз меньше; исследование 4, шаг 4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Есть и другие способы перемещения клеток (например, с пузыревидными выпячиваниями); здесь рассматривается ползание по подложке.</p><div class="static-quiz"><h3>Край ламеллиподии выдвигается, но клетка за час не сместилась. Что из этого может быть причиной?</h3><ol><li><b>А.</b> Сборка актина у края идёт слишком быстро <i>(неверный вариант)</i><br><span class="expl">Быстрая сборка не мешает перемещению</span></li><li><b>Б.</b> Задний край не открепляется от подложки <i>(верный вариант)</i><br><span class="expl">Да: без открепления и подтягивания сзади центр клетки не перемещается</span></li><li><b>В.</b> У клетки нет промежуточных филаментов <i>(неверный вариант)</i><br><span class="expl">Для ползания они не главные</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><article class="card print-unit" id="ns-autoregulation"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 27 из 29</div><h2>Как количество свободной субъединицы влияет на синтез актина и тубулина</h2><p class="lead">Запас свободных субъединиц нужен для сборки; клетка поддерживает его <a href="#ns-g-S2-T70">авторегуляцией</a> — синтез белка зависит от количества его свободной формы.</p><div class="note"><strong>Что показывает схема.</strong> Синтез соответствует количеству свободных субъединиц</div><ol class="mech"><li>Белок синтезируется на <a href="#ns-g-S2-T80">рибосоме</a> по мРНК — молекуле-копии гена (подробно — семинары 9–11). Сигналом для синтеза актина и тубулина служит количество их свободной формы: когда свободного актина становится мало (он ушёл в филаменты), синтез актина возрастает; когда свободного тубулина становится много (микротрубочки разобрались), синтез тубулина снижается. Общий принцип — отрицательная обратная связь: больше свободной субъединицы — меньше синтеза.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·8, БИО-2·24</p><p>Пути у двух белков разные. У актина регуляция идёт на уровне работы генов в ядре, у тубулина — на уровне устойчивости мРНК во время синтеза. &lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, панель В, шаги 6–7: в одной клетке синтез актина возрастает, а тубулина снижается.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Знать молекулярные подробности транскрипции и разрушения мРНК для этого семинара не требуется.</p><details><summary>Дополнение, для коллоквиума не требуется (добровольно)</summary><p>свободный G-актин связывает белок <a href="#ns-g-S2-T71">MRTF</a> и удерживает его в цитоплазме; когда G-актина мало, MRTF переходит в ядро и вместе с белком <a href="#ns-g-S2-T83">SRF</a> усиливает работу генов актина и других белков цитоскелета. При избытке свободного тубулина белок <a href="#ns-g-S2-T73">TTC5</a> узнаёт начало растущей цепи тубулина на рибосоме, и мРНК тубулина разрушается.</p></details><div class="static-quiz"><h3>Почему у актина и тубулина говорят об одном принципе авторегуляции, но о разных путях?</h3><ol><li><b>А.</b> У обоих регулируется только деградация белка <i>(неверный вариант)</i><br><span class="expl">Регулируется синтез: у актина — работа генов, у тубулина — устойчивость мРНК</span></li><li><b>Б.</b> Сигналы противоположные, пути одинаковые <i>(неверный вариант)</i><br><span class="expl">Наоборот: сигнал одинаковый — свободная субъединица, а пути разные</span></li><li><b>В.</b> Сигнал один, уровни регуляции разные <i>(верный вариант)</i><br><span class="expl">Да: сигнал — количество свободной субъединицы; у актина меняется работа генов, у тубулина — устойчивость мРНК</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s12276-025-01615-w">Cho Y., Kim Y. K. Multilayered regulation of cytoskeletal protein abundance: autoregulatory mechanisms of actin and tubulin. Exp. Mol. Med. 2026; 58: 59–72</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-turnover-limits"><div class="eyebrow">Актин: сборка, сила и обновление сети · шаг 28 из 29</div><h2>Скорость обновления сети задают белки разборки, а нагрузка делает сеть плотнее</h2><p class="lead">Обзор последних лет обобщает, как регулируется оборот актиновых сетей.</p><div class="note"><strong>Что показывает схема.</strong> Край 8,00 — предел пула</div><ol class="mech"><li>Ветвящаяся сеть у переднего края мигрирующих в культуре клеток меланомы мыши обновляется полностью менее чем за минуту, а актиновые сети в местах эндоцитоза — за несколько секунд. Очищенный актин сам по себе разбирается слишком медленно: такую скорость обеспечивают белки, разрезающие и разбирающие филаменты, прежде всего кофилин и его партнёры. Сеть реагирует на нагрузку (это показано в том числе на сетях, собранных из очищенных белков): упираясь в препятствие, филаменты удлиняются медленнее, а сеть становится плотнее и толкает эффективнее, а растягивающая сила облегчает отделение ветвей. Одиночный актиновый филамент выдерживает растяжение более 100 пН.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·24, БИО-2·26</p><p>&lt;b&gt;Исследование 4 практикума&lt;/b&gt; иллюстрирует ту же логику на замкнутой учебной модели: при остановленной разборке край продвигается не дальше 8 у.е.д. при любой скорости сборки; ускорение разборки вдвое продвигает край дальше (50,40 у.е.д. за 40 шагов), чем ускорение сборки вдвое (39,92). Обновление сети не гарантирует выдвижения: без сцепления край продвигается на 6,82 вместо 34,12.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Механизм обновления различается в разных клетках; модель — замкнутая и упрощённая.</p><details><summary>Как это узнали (добровольно)</summary><p>Скорость оборота оценивали, следя в живых клетках за тем, как быстро обновляется помеченный актин в сети; влияние нагрузки изучали на сетях, собранных из очищенных белков.</p></details><div class="static-quiz"><h3>Почему, по данным обзора, скорость обновления сети в клетке задают белки разборки?</h3><ol><li><b>А.</b> Сам актин разбирается слишком медленно <i>(верный вариант)</i><br><span class="expl">Да: нужны кофилин и другие белки</span></li><li><b>Б.</b> Сборка в клетке медленнее разборки <i>(неверный вариант)</i><br><span class="expl">Нет: в клетке сборка у переднего края быстрая, а очищенный актин разбирается слишком медленно — скорость обновления ограничивает разборка, её ускоряют кофилин и партнёры</span></li><li><b>В.</b> Разборку обеспечивает миозин II <i>(неверный вариант)</i><br><span class="expl">Миозин участвует в сокращении; разборку ускоряют кофилин и его партнёры</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00508-4">Lappalainen P., Kotila T., Jégou A., Romet-Lemonne G. Biochemical and mechanical regulation of actin dynamics. Nat. Rev. Mol. Cell Biol. 2022; 23: 836–852</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог: одна картина — несколько причин · шаг 29 из 29</div><h2>Почему клетка изменила форму и нарушила внутриклеточный транспорт?</h2><p class="lead">Один и тот же <a href="#ns-g-S2-T74">фенотип</a> — набор наблюдаемых признаков — может иметь разные молекулярные причины.</p><div class="note"><strong>Что показывает схема.</strong> Три признака</div><ol class="mech"><li>Условная эпителиальная клетка округлилась и не образует выпячиваний, лизосомы не доходят до периферии, при растяжении клеточного слоя клетки рвутся. Ни одна из шести причин модели не объясняет все три признака сама. Совместимых минимальных наборов шесть: снижение АТФ вместе с дефектом промежуточных филаментов или их связи с контактами; либо сочетание сниженной сборки актина, нарушения транспорта (мало микротрубочек или неактивен кинезин-1) и дефекта промежуточных филаментов или их связи с контактами.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-2·6, БИО-2·12, БИО-2·19, БИО-2·26</p><p>Различить гипотезы помогают три измерения: например, окраска микротрубочек, окраска промежуточных филаментов и уровень АТФ. Окраска промежуточных филаментов нужна в любом случае: она отличает отсутствие сети от сети, не закреплённой у контактов. Вывод ограничен: признаки в модели «есть/нет», причин только шесть, системы в клетке влияют друг на друга. &lt;b&gt;На практикуме.&lt;/b&gt; Итоговая задача.</p><p>&lt;b&gt;Ограничения.&lt;/
