/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;
    return `<path d="M${x - 2},${y1} Q${x - 7},${ym} ${x - 2},${y2}" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */
  function profile(y0, feats, x0 = 6, x1 = 594){
    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        const b0 = Math.atan2(yn - cyb, xl - f.c) + 2 * Math.PI, b1 = Math.atan2(yn - cyb, xr - f.c);
        for (let a = b0; a >= b1; a -= Math.PI / 48) P.push([f.c + R * Math.cos(a), cyb + R * Math.sin(a)]);
        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }
    flatTo(x1); return P;
  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → аппарат Гольджи (COP-II), 'gerr' — аппарат Гольджи → ЭПР (COP-I), 'intra' — между цистернами аппарата Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).
     rm: 'none' | 'coat' (нет белков оболочки) | 'uncoat' (оболочка не снимается) | 'snare' (нет SNARE на носителе).
     Возвращает { s: SVG, a: точки для подписей }. Русского текста нет. */
  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;

      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });

          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);

  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }

  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;

  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));

      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };

    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +

    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,

    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');

    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');

    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');

  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');

              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;

  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);

  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);

  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = G('nucleus', `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`);

    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { let w = `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) w += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; q += G('npc', w); });
    const big = nucBig;
    const imp = o.noImp ? () => '' : nucImp;
    const exp = nucExp;
    const sm = nucSm;
    const top = [[110, 70], [300, 110], [480, 80]], bot = [[110, 320], [300, 290], [480, 330]];
    const q0 = q;
    let res = {};
    if (cargo === 'small') { q += sm([[70, 60], [150, 100], [260, 70], [340, 120], [450, 60], [540, 110], [80, 300], [170, 340], [270, 300], [350, 350], [460, 290], [540, 340], [206, 196], [394, 206]]); res = { mode: 'diff', where: 'both' }; }
    else if (cargo === 'big' || cargo === 'mut') { q += top.map(([x, y]) => big(x, y, cargo === 'mut' ? 'mut' : '')).join(''); res = { mode: 'none', where: cargo === 'big' ? 'cytoslow' : 'cyto' }; }
    else if (cargo === 'm27' || cargo === 'm67') { const r = cargo === 'm27' ? 6 : 9.5, g = (x, y) => G('gfpprot', `<circle cx="${x}" cy="${y}" r="${r}" fill="#7FBF7F" stroke="#3d7a3d" stroke-width="1"/>`);

GN.s2_a3 = (function () {

    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

    s += T(14, top - 16, t('s2_a3g_body'), { a: 'l', size: 11.5, w: 600, col: C.muted }) + T(586, top - 16, t('s2_a3g_end'), { a: 'r', size: 11.5, w: 600, col: C.muted });

      s += arrow(126, 92, 162, 92, C.muted, 1.8);
      s += S2F.G('ifdimer', mono(176, 86) + mono(176, 98, 1, C.ifL)) + orient(176, 72, 1) + T(211, 120, l('dimer'), { size: 11.5, w: 600 });
      s += arrow(262, 92, 302, 92, C.muted, 1.8);
      /* антипараллельный тетрамер: два димера навстречу друг другу, со смещением */
      s += S2F.G('tetramer', mono(320, 84) + mono(320, 92, 1, C.ifL) + mono(344, 108, -1) + mono(344, 116, -1, C.ifL)) + orient(320, 70, 1) + orient(344, 130, -1);
      s += T(368, 150, l('tetra'), { size: 11.5, w: 600 }) + T(368, 166, l('tetra2'), { size: 10.5, col: C.muted });
      s += arrow(430, 100, 468, 100, C.muted, 1.8);
      /* единичный филамент: тетрамеры бок о бок */
      let u = ''; for (let i = 0; i < 4; i++) u += line(484, 78 + i * 7, 560, 78 + i * 7, i % 2 ? C.ifL : C.if, 4.4);
      s += S2F.G('tetramer', u) + T(522, 120, l('ulf'), { size: 11.5, w: 600 });
      s += arrow(522, 176, 522, 222, C.muted, 1.8) + T(512, 200, l('endtoend'), { size: 10.5, col: C.muted, a: 'r' });
      /* филамент около 10 нм: концы одинаковы, знаков «+»/«−» нет */
      s += ifRope(80, 262, 500, 262, { w: 14 });
      s += T(80, 238, l('same'), { size: 11.5, col: C.if, w: 700, a: 'l' }) + T(500, 238, l('same'), { size: 11.5, col: C.if, w: 700, a: 'r' });
      s += T(290, 296, l('fil'), { size: 12, w: 600 });
      s += T(300, 352, l('note'), { size: 12, col: C.muted, it: true, n: 80 });
      return s;
    }
    if (mode === 'classes') {
      s += title(l('t2'));
      /* эпителиальная клетка, соседняя клетка, внеклеточный матрикс снизу */
      const ex = 40, ey = 60, ew = 200, eh = 230;
      s += `<rect x="${ex}" y="${ey}" width="${ew}" height="${eh}" rx="22" fill="${C.cyto}"/>` + mem(roundRectPts(ex, ey, ew, eh, 22, 8), { closed: true }, .5);
      s += `<rect x="${ex + ew + 22}" y="${ey}" width="90" height="${eh}" rx="22" fill="${C.cyto}"/>` + mem(roundRectPts(ex + ew + 22, ey, 90, eh, 22, 8), { closed: true }, .5);
      s += `<rect x="20" y="${ey + eh + 20}" width="330" height="22" rx="4" fill="#E6E1D6"/>` + T(185, ey + eh + 31, l('ecm'), { size: 10.5, col: C.muted, it: true });
      const dx = ex + ew + 11, D = [[dx, 120], [dx, 230]], H = [[90, ey + eh + 10], [190, ey + eh + 10]];
      D.forEach(([x, y]) => { s += S2F.G('desmosome', box(x - 12, y - 12, 8, 24, '#4A3A28') + box(x + 4, y - 12, 8, 24, '#4A3A28')); });
      H.forEach(([x, y]) => { s += S2F.G('hemidesmosome', box(x - 14, y - 4, 28, 9, '#4A3A28')); });
      /* ядро с ламиной (под внутренней мембраной ядра) */
      const nx = 130, ny = 168;
      s += nucleus(nx, ny, 50, 42, .35) + S2F.G('lamin', `<ellipse cx="${nx}" cy="${ny}" rx="38" ry="30" fill="none" stroke="${C.if}" stroke-width="2.4" stroke-dasharray="5 2"/>`);
      /* кератиновые филаменты от ядра к десмосомам и гемидесмосомам */
      s += ifRope(nx + 48, ny - 20, dx - 12, 120, { w: 5, g: 'keratin' }) + ifRope(nx + 48, ny + 22, dx - 12, 230, { w: 5, g: 'keratin' }) + ifRope(nx - 18, ny + 40, 90, ey + eh + 6, { w: 5, g: 'keratin' }) + ifRope(nx + 20, ny + 40, 190, ey + eh + 6, { w: 5, g: 'keratin' });
      s += T(nx, ny, l('lamina'), { size: 10.5, col: C.if, w: 600 });
      s += T(ex + 6, ey - 16, l('epi'), { size: 11.5, w: 700, a: 'l' }) + line(dx, 106, dx + 16, 46, C.muted, 1) + T(dx + 18, 42, l('desm'), { size: 10.5, col: '#4A3A28', w: 600, a: 'l' }) + T(140, ey + eh + 58, l('hemi'), { size: 10.5, col: '#4A3A28', w: 600 });
      s += T(160, 92, l('ker'), { size: 11, col: C.if, w: 700, a: 'l' });
      /* перечень классов (04, ·4) */
      const rows = ['r1', 'r2', 'r3', 'r4', 'r5'];
      s += box(372, 42, 220, 288, '#fff', C.line);
      rows.forEach((r, i) => { const y = 62 + i * 56; s += S2F.G('ifclass', line(386, y, 410, y, i % 2 ? C.ifL : C.if, 5)) + T(418, y - 7, l(r + 'a'), { size: 11.5, w: 700, a: 'l', col: C.if }) + T(418, y + 9, l(r + 'b'), { size: 10, a: 'l', col: C.muted, n: 29 }); });
      s += T(300, 392, l('note2'), { size: 12, col: C.muted, it: true, n: 80 });
      return s;
    }
    /* mitosis: сеть → фосфорилирование («Ф») → тетрамеры */
    s += title(l('t3'));
    let net = ''; [[40, 110, 230, 150], [40, 170, 230, 130], [60, 90, 200, 250], [50, 230, 240, 230], [70, 270, 220, 90], [40, 200, 240, 200]].forEach(([a, b, c, d]) => { net += ifRope(a, b, c, d, { w: 6 }); });
    s += net + T(140, 300, l('net'), { size: 12, w: 600 });
    s += larrow(262, 180, 338, 180, '', C.ink) + T(300, 160, l('phos'), { size: 11.5, w: 700 });
    s += `<circle cx="300" cy="208" r="11" fill="${C.pi}"/>` + T(300, 208, l('F'), { size: 12, w: 700, col: '#fff' });
    [[380, 100], [470, 130], [540, 92], [400, 200], [500, 220], [430, 270], [540, 280], [380, 300]].forEach(([x, y], i) => {
      s += S2F.G('tetramer', mono(x - 30, y - 4, 1) + mono(x - 22, y + 6, -1)) + `<circle cx="${x + 46}" cy="${y - 10}" r="8" fill="${C.pi}"/>` + T(x + 46, y - 10, l('F'), { size: 10, w: 700, col: '#fff' }); });
    s += T(460, 340, l('tetras'), { size: 12, w: 600 });
    s += T(300, 386, l('note3'), { size: 12, col: C.muted, it: true, n: 84 });
    return s;
  } };

  /* ---------- ·7: ядро в узком промежутке (11, ·7; 04, ·7) — качественно, без сил в числах ---------- */
  GN.s2_r_nucleus = { view(args, t) {
    const l = L('nucleus', t), mode = args[0];
    let s = title(l('t'));
    /* стенки промежутка */
    const gx0 = 250, gx1 = 430, gy0 = 156, gy1 = 264;
    s += `<rect x="${gx0}" y="${gy0 - 24}" width="${gx1 - gx0}" height="24" fill="#C9CFD6"/><rect x="${gx0}" y="${gy1}" width="${gx1 - gx0}" height="24" fill="#C9CFD6"/>`;
    s += T((gx0 + gx1) / 2, gy1 + 40, l('gap'), { size: 11, col: C.muted, w: 600 });
    if (mode === 'before' || mode === 'inside') s += T((gx0 + gx1) / 2, gy0 - 34, l('wall'), { size: 10.5, col: C.muted, it: true });
    const lam = (cx, cy, rx, ry) => S2F.G('lamin', `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx - 7)}" ry="${f(ry - 7)}" fill="none" stroke="${C.if}" stroke-width="2.6"/>`);
    const amy = (x0, x1, y) => actinLine(x0, y, x1, y, { r: 2.2, g: 'actomyosin' }) + myosinII((x0 + x1) / 2, y, 30, 'myosin2');
    if (mode === 'before') {
      const P = roundRectPts(40, 120, 200, 180, 70, 10);
      s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
      s += ifCage(130, 210, 64, 56) + nucleus(130, 210, 56, 48, .32) + lam(130, 210, 56, 48);
      s += amy(70, 190, 140) + amy(70, 190, 282);
      s += centrosome(214, 210, { R: 9 }); [[-40], [0], [40]].forEach(([d]) => { const a = d * Math.PI / 180; s += mtLine(214, 210, 214 + 22 * Math.cos(a), 210 + 22 * Math.sin(a), { w: 2.6, signs: false }); });
      s += T(130, 210, l('nuc'), { size: 11.5, w: 700 });
      s += larrow(80, 352, 220, 352, l('dir'), C.ink);
      s += T(480, 360, l('n1'), { size: 12, w: 600, n: 30 });
      return s;
    }
    if (mode === 'inside') {
      /* клетка вошла в промежуток: ядро вытянуто; актомиозин по бокам сжимает, микротрубочки от центросомы впереди тянут */
      const P = [];
      roundRectPts(150, gy0 + 6, 330, gy1 - gy0 - 12, 40, 10).forEach(p => P.push(p));
      s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
      const nx = 300, ny = 210;
      s += ifCage(nx, ny, 84, 36, 12, 3.4) + nucleus(nx, ny, 78, 30, .3) + lam(nx, ny, 78, 30);
      s += amy(220, 380, gy0 + 22) + amy(220, 380, gy1 - 22);
      s += arrow(300, gy0 + 30, 300, ny - 26, C.actin, 2.4) + arrow(300, gy1 - 30, 300, ny + 26, C.actin, 2.4);
      s += arrow(176, ny, 214, ny, C.actin, 2.6);
      const cx = 420, cy = 210; s += centrosome(cx, cy, { R: 9 });
      [[cx, cy, 384, 200], [cx, cy, 384, 220], [cx, cy, 464, 192], [cx, cy, 468, 210], [cx, cy, 464, 228]].forEach(([a, b, c, d]) => { s += mtLine(a, b, c, d, { w: 2.6, signs: false }); });
      s += arrow(500, 210, 560, 210, C.mtA, 2.6);
      /* подписи */
      s += T(130, 90, l('am'), { size: 11.5, w: 700, col: C.actin, a: 'l' }) + line(200, 98, 250, gy0 + 20, C.muted, 1);
      s += T(130, 106, l('squeeze'), { size: 11, col: C.actin, a: 'l' });
      s += T(130, 330, l('push'), { size: 11, col: C.actin, a: 'l' }) + line(175, 320, 195, ny + 6, C.muted, 1);
      s += T(452, 74, l('mtc'), { size: 11.5, w: 700, col: C.mtA, a: 'l', n: 20 }) + T(452, 106, l('pull'), { size: 11, col: C.mtA, a: 'l' }) + line(470, 112, 432, 196, C.muted, 1);
      s += T(470, 330, l('ifn'), { size: 11.5, w: 700, col: C.if, a: 'l', n: 20 }) + line(468, 322, 360, ny + 26, C.muted, 1);
      s += T(nx, ny, l('nuc'), { size: 11, w: 700 });
      s += T(300, 396, l('debate'), { size: 10.5, col: C.muted, it: true, n: 90 });   /* v1.2, И-19: механизм зависит от типа клеток и обсуждается (Kalukula 2022) */
      return s;
    }
    /* после выхода: с ламинами A/C и виментином форма восстановлена; без них — нет, возможен разрыв оболочки */
    const ok = mode === 'after';
    const P = roundRectPts(420, 120, 160, 180, 60, 10);
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
    if (ok) s += ifCage(500, 210, 60, 52) + nucleus(500, 210, 52, 44, .3) + lam(500, 210, 52, 44) + T(500, 210, l('nuc'), { size: 11, w: 700 });
    else {
      /* ядро осталось вытянутым и неровным; разрыв оболочки — красный значок */
      s += `<ellipse cx="500" cy="210" rx="62" ry="28" fill="${C.nuc}"/>` + mem(BF.ellipsePts(500, 210, 62, 28, 56).map(([x, y], i) => [x, y + Math.sin(i * 1.3) * 3]), { closed: true }, .3);
      s += mem(BF.ellipsePts(500, 210, 55, 21, 52), { closed: true }, .3);
      s += `<rect x="538" y="184" width="18" height="16" fill="${C.nuc}"/>` + cross(547, 178, 7) + T(500, 210, l('nuc'), { size: 11, w: 700 });
    }
    s += larrow(80, 352, 220, 352, l('dir'), C.ink);
    s += T(200, 64, l(ok ? 'ok' : 'nolam'), { size: 12, w: 700, col: ok ? C.ok : C.bad, n: 34 });
    s += T(200, 96, l(ok ? 'ok2' : 'nolam2'), { size: 11.5, col: C.muted, n: 44 });
    return s;
  } };

  /* ---------- ·8: полимеризация и нуклеация — скорости от концентрации, Cc, затравка (11, ·8; 04, ·8) ---------- */
  GN.s2_r_kinetics = { view(args, t) {
    const l = L('kinetics', t), m = args[0];
    let s = title(l('t'));
    if (m === 'seed') {
      /* две пробирки: без затравки субъединицы порознь; с кольцом γ-TuRC растёт микротрубочка */
      const tube = (x, lab) => `<path d="M${x},70 L${x},300 Q${x},340 ${x + 50},340 Q${x + 100},340 ${x + 100},300 L${x + 100},70" fill="#F4F8FB" stroke="${C.muted}" stroke-width="2"/>` + T(x + 50, 360, lab, { size: 12, w: 700 });
      s += tube(90, l('tube1')) + tube(380, l('tube2'));
      [[110, 120], [150, 160], [120, 220], [170, 260], [130, 300], [160, 100], [175, 200], [112, 270]].forEach(([x, y], i) => { s += dimer(x, y, i * 40); });
      [[400, 120], [470, 110], [405, 300], [468, 296], [395, 220]].forEach(([x, y], i) => { s += dimer(x, y, i * 50); });
      s += turc(430, 300, 8);
      s += S2F.G('mt', `<rect x="423" y="160" width="14" height="132" rx="3" fill="${C.mtB}" stroke="${C.mtA}"/>`) + endSign(430, 146, '+', C.mtA, 7) + T(452, 318, l('turc'), { size: 11, col: C.turc, w: 700, a: 'l' });
      s += T(140, 390, l('noseed'), { size: 11.5, col: C.bad, w: 600, n: 30 }) + T(430, 390, l('seed'), { size: 11.5, col: C.ok, w: 600, n: 30 });
      return s;
    }
    /* график: присоединение ∝ C, отделение не зависит от C; пересечение — критическая концентрация Cc */
    const A = axes(70, 66, 300, 250, { min: 0, max: 2.5, ticks: [] }, { min: 0, max: 2.5, ticks: [] }, l('xl'), l('yl'));
    s += A.s + poly([[A.X(0), A.Y(0)], [A.X(2.5), A.Y(2.5)]], C.ok, 2.6) + poly([[A.X(0), A.Y(1)], [A.X(2.5), A.Y(1)]], C.bad, 2.6);
    s += T(A.X(2.05), A.Y(2.3), l('on'), { size: 11.5, col: C.ok, w: 700, a: 'r' }) + (m < 1 ? T(A.X(2.45), A.Y(1) - 12, l('off'), { size: 11.5, col: C.bad, w: 700, a: 'r' }) : T(A.X(0.08), A.Y(1) - 12, l('off'), { size: 11.5, col: C.bad, w: 700, a: 'l' }))   /* v1.2, И-30: подпись — на стороне графика без стрелки режима */;
    s += `<circle cx="${f(A.X(1))}" cy="${f(A.Y(1))}" r="5" fill="${C.ink}"/>`; const ccl = T(A.X(1) + 10, A.Y(1) + 18, l('cc'), { size: 11, a: 'l', w: 600, bg: true }) + line(A.X(1), A.Y(0), A.X(1), A.Y(0) + 5, C.ink, 1.4) + T(A.X(1), A.Y(0) + 13, 'Cc', { size: 10.5, w: 700 });
    const c = m;
    s += line(A.X(c), A.Y(0), A.X(c), A.Y(Math.max(c, 1)) - 6, C.ink, 1.4, 'stroke-dasharray="4 3"') + T(A.X(c), A.Y(0) - 10 - (c < 1 ? 0 : 0), l(c < 1 ? 'cl' : 'ch'), { size: 11, w: 700, bg: true });
    s += arrow(A.X(c), A.Y(Math.min(c, 1)), A.X(c), A.Y(Math.max(c, 1)), c < 1 ? C.bad : C.ok, 2) + ccl;
    /* миниатюра полимера: при C < Cc укорачивается, при C > Cc растёт */
    const px = 416, py = 190, n = c < 1 ? 3 : 6;
    s += box(400, 96, 186, 230, '#fff', C.line) + T(493, 116, l('mini'), { size: 11.5, w: 700 });
    for (let i = 0; i < n; i++) s += S2F.G('polymer', dimer(px + 14 + i * 18, py, 0, 1));
    const pe = px + 14 + n * 18 - 9;
    s += endSign(px - 2, py, '-', C.mtA, 7) + endSign(pe + 14, py, '+', C.mtA, 7);
    if (c < 1) { s += dimer(pe + 40, py - 40, 30) + dimer(pe + 54, py - 14, -20) + arrow(pe + 16, py - 14, pe + 34, py - 32, C.bad, 1.6) + T(493, 270, l('shrink'), { size: 12, w: 700, col: C.bad }); }
    else { s += dimer(pe + 44, py - 38, 0) + arrow(pe + 40, py - 28, pe + 22, py - 14, C.ok, 1.6) + T(493, 270, l('grow'), { size: 12, w: 700, col: C.ok }); }
    s += T(493, 300, l(c < 1 ? 'shrink2' : 'grow2'), { size: 10.5, col: C.muted, n: 28 });
    s += T(220, 392, l('lim'), { size: 11, col: C.muted, it: true, n: 70 });
    return s;
  } };

  /* ---------- ·12: зачем разборка — захват конца и таксол (11, ·12; 04, ·12) ---------- */
  GN.s2_r_capture = { view(args, t) {
    const l = L('capture', t), mode = args[0];
    let s = title(l('t'));
    const P = roundRectPts(60, 50, 400, 290, 90, 12);
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .5);
    /* стабилизирующая структура у мембраны справа (синий прямоугольник) */
    s += S2F.G('capstruct', box(430, 172, 18, 46, C.motor));
    const cx = 250, cy = 195;
    /* 8 направлений; длины в режимах; оранжевая — укорачивается */
    const LEN = { dyn: [120, 70, 140, 50, 110, 90, 60, 130], capture: [168, 100, 60, 120, 40, 130, 90, 70], taxol: null };
    const SHR = { dyn: [0, 1, 0, 1, 0, 0, 1, 0], capture: [0, 0, 1, 0, 1, 0, 0, 1], taxol: [0, 0, 0, 0, 0, 0, 0, 0] };
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * 2 * Math.PI, end = rayEnd(P, cx, cy, a, 30);
      let r = mode === 'taxol' ? end[2] : Math.min(LEN[mode][k], end[2]);
      if (mode === 'capture' && k === 0) r = 430 - 4 - cx;   /* плюс-конец связан со стабилизирующей структурой */
      const ex = cx + r * Math.cos(a), ey = cy + r * Math.sin(a), cap = mode === 'capture' && k === 0;
      s += mtLine(cx, cy, ex, ey, { w: cap ? 5.5 : 3.6, col: cap ? C.mtA : SHR[mode][k] ? C.mtD : C.mt, signs: true, minus: false, sr: 6 });
    }
    s += centrosome(cx, cy, { R: 13 });
    s += endSign(cx - 31, cy - 13, '-', C.mtA, 7);   /* v1.2, И-33: минус-концы — у центросомы (T-UI-2) */
    s += line(cx + 6, cy - 8, 470, 84, C.muted, 1) + T(472, 74, l('minus'), { size: 10.5, col: C.muted, a: 'l', n: 18 });
    s += T(470, 160, l('struct'), { size: 11, w: 700, col: C.motor, a: 'l', n: 15 });
    if (mode === 'capture') s += T(350, 170, l('cap'), { size: 11, w: 700, col: C.mtA, bg: true });
    if (mode === 'taxol') s += T(250, 360, l('nore'), { size: 12, w: 700, col: C.bad });
    /* обозначения: растёт / укорачивается */
    if (mode !== 'taxol') s += line(80, 360, 104, 360, C.mt, 4) + T(110, 360, l('grow'), { size: 11, a: 'l' }) + line(200, 360, 224, 360, C.mtD, 4) + T(230, 360, l('shrink'), { size: 11, a: 'l' });
    /* таблица веществ (04, ·12) */
    s += box(14, 380, 572, 34, '#fff', C.line) + T(24, 397, l('tab'), { size: 11, a: 'l', w: 600 });
    return s;
  } };

  /* ---------- ·14: конденсат EB1 на плюс-конце (11, ·14; 04, ·14) — без чисел; конденсат без мембраны ---------- */
  GN.s2_r_eb1 = { view(args, t) {
    const l = L('eb1', t), mode = args[0];
    let s = title(l('t'));
    s += mtSide(60, 200, 330, { h: 40, cap: 0 });
    if (mode === 'eb1') {
      /* облако конденсата: полупрозрачное, без бислоя; внутри EB1, тубулин, другие белки плюс-конца */
      s += S2F.G('condensate', `<ellipse cx="345" cy="200" rx="70" ry="58" fill="${C.eb1}" opacity=".22"/>`);
      [[320, 168], [352, 160], [380, 180], [372, 222], [340, 236], [312, 230], [396, 204], [330, 200]].forEach(([x, y]) => { s += S2F.G('eb1', `<circle cx="${x}" cy="${y}" r="5" fill="${C.eb1}" stroke="#A86410" stroke-width="1"/>`); });
      s += dimer(362, 196, 20) + dimer(386, 236, -30) + dimer(318, 152, 10);
      [[300, 246], [392, 160]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${C.grey}"/>`; });
      s += T(345, 120, l('cond'), { size: 11.5, w: 700, col: '#A86410' });
      s += larrow(428, 150, 472, 150, '', C.ok) + T(480, 150, l('vg'), { size: 12, w: 700, a: 'l', col: C.ok, n: 11 });   /* v1.2, И-26: подписи целиком в рамке */
      s += larrow(428, 250, 472, 250, '', C.warn) + T(480, 250, l('cat'), { size: 12, w: 700, a: 'l', col: C.warn, n: 11 });
      s += T(345, 290, l('inside'), { size: 11, col: C.muted, n: 40 });
    } else if (mode === 'mut') {
      /* EB1 без конденсата: точки рассеяны вдоль стенки и в стороне, скопления у конца нет */
      [[100, 136], [170, 236], [250, 128], [290, 240], [380, 130], [420, 260], [460, 190], [200, 120], [140, 280]].forEach(([x, y]) => { s += S2F.G('eb1', `<circle cx="${x}" cy="${y}" r="5" fill="${C.eb1}" stroke="#A86410" stroke-width="1"/>`); });
      s += T(345, 320, l('mut'), { size: 12, w: 700, col: C.bad, n: 44 });
    } else s += T(345, 300, l('bare'), { size: 12, w: 600, col: C.muted, n: 40 });
    s += T(195, 160, l('mt'), { size: 11.5, w: 700, col: C.mtA });
    s += T(300, 390, l('note'), { size: 11, col: C.muted, it: true, n: 84 });
    return s;
  } };

  /* ---------- ·16: шаг кинезина-1 и динеин (11, ·16; 04, ·16; MBoC7 рис. 16–53) — схема цикла упрощена ---------- */
  GN.s2_r_kinesin_step = { view(args, t) {
    const l = L('kinesin_step', t), mode = args[0];
    let s = title(l('t'));
    const head = (x, y, col, lab, up = 0) => S2F.G('kinesin', `<ellipse cx="${f(x)}" cy="${f(y - 8 - up)}" rx="13" ry="10" fill="${col}"/>`) + (lab ? T(x, y - 8 - up, lab, { size: 8.5, w: 700, col: '#fff' }) : '');
    /* мотор на микротрубочке: rear, front — x головок; rearUp — задняя головка поднята; cargo наверху */
    function kin(cx, y, rearX, frontX, rearLab, frontLab, rearUp, swing, swap) {
      let q = '';
      const top = y - 100;
      q += line(rearX, y - 18 - rearUp, cx, y - 44, C.motor, 3) + line(frontX, y - 18, cx, y - 44, C.motor, 3) + line(cx, y - 44, cx, top + 18, C.motor, 3.4);
      q += head(rearX, y, swap ? C.motor : C.motorL, rearLab, rearUp) + head(frontX, y, swap ? C.motorL : C.motor, frontLab);
      if (swing) q += `<path d="M${f(rearX)},${f(y - 40)} Q${f((rearX + swing) / 2)},${f(y - 84)} ${f(swing)},${f(y - 40)}" fill="none" stroke="${C.ink}" stroke-width="1.8" stroke-dasharray="5 3"/>` + arrow(swing - 8, y - 48, swing, y - 38, C.ink, 1.6);
      return q + vesicle(cx, top, 16, 'cargo', .5);
    }
    if (mode === 'p12' || mode === 'p34') {
      const panes = mode === 'p12' ? [1, 2] : [3, 4];
      panes.forEach((ph, i) => {
        const x0 = 20 + i * 290, y = 300;
        s += box(x0, 46, 270, 330, '#fff', C.line) + T(x0 + 12, 64, l('ph' + ph), { size: 11.5, w: 700, a: 'l', n: 40 });
        s += mtSide(x0 + 26, y + 14, x0 + 244, { h: 22 });
        const cx = x0 + 135;
        /* v1.2 (рецензия И-01; Yildiz 2025: передняя головка не связывает АТФ, пока задняя не отделилась; MBoC7, рис. 16–53):
           1 — задняя головка после гидролиза АТФ и ухода фосфата отделилась (АДФ); 2 — передняя, связанная с микротрубочкой, связывает АТФ;
           3 — изменение формы передней головки переносит заднюю вперёд; 4 — головка связалась впереди и отдала АДФ */
        if (ph === 1) s += kin(cx, y, cx - 26, cx + 26, l('adp'), '', 26, 0) + T(cx - 72, y - 84, l('rear'), { size: 10.5, col: C.motor, w: 600 }) + T(cx + 58, y - 70, l('front'), { size: 10.5, col: C.motor, w: 600 });
        if (ph === 2) s += kin(cx, y, cx - 26, cx + 26, l('adp'), l('atp'), 26, 0) + T(cx + 58, y - 70, l('front'), { size: 10.5, col: C.motor, w: 600 });
        if (ph === 3) s += kin(cx, y, cx - 26, cx + 26, l('adp'), l('atp'), 26, cx + 78);
        if (ph === 4) s += kin(cx + 26, y, cx + 26, cx + 78, '', '', 0, 0, true) + larrow(x0 + 60, y + 50, x0 + 210, y + 50, l('toplus'), C.motor, { dy: 16 });
      });
      return s;
    }
    if (mode === 'dynein') {
      s += mtSide(70, 300, 530, { h: 24 });
      s += dynein(300, 288, { s: 1.6, stalk: 60 }) + vesicle(296, 182, 18, 'cargo', .5);
      s += T(380, 236, l('ring'), { size: 11, w: 600, col: C.motor, a: 'l' }) + T(330, 280, l('stalk'), { size: 10.5, col: C.motor, a: 'l' });
      s += larrow(400, 360, 200, 360, l('tominus'), C.motor, { dy: 18 });
      return s;
    }
    /* нет АТФ (v1.2, И-01; Yildiz 2025: «kinesin 1 waits for ATP binding»): мотор связан с микротрубочкой одной головкой, вторая (с АДФ) отделена, шагов нет */
    s += mtSide(70, 300, 530, { h: 24 }) + kin(300, 286, 274, 326, l('adp'), '', 26, 0);
    s += cross(300, 364, 9) + T(300, 392, l('noatp'), { size: 12, w: 700, col: C.bad });
    return s;
  } };

  /* ---------- ·17: направление моторов (11, ·17; 04, ·17) — направление к концу не зависит от поворота пути ---------- */
  GN.s2_r_motor_families = { view(args, t) {
    const l = L('motor_families', t), mode = args[0];
    let s = title(l('t'));
    const y = 240;
    if (mode === 'actin') {
      s += actinFil(70, y, 530, y, { n: 26, r: 7 });
      /* миозин II — к плюс-концу; миозин VI — к минус-концу */
      const myo = (x, lab) => S2F.G('myosin', `<ellipse cx="${x}" cy="${y - 22}" rx="12" ry="9" fill="${C.motor}"/>` + line(x, y - 30, x - 8, y - 64, C.motor, 3)) + T(x, y - 78, lab, { size: 11.5, w: 700, col: C.motor });
      s += myo(200, l('m2')) + larrow(170, y - 104, 250, y - 104, l('toplus'), C.motor, { dy: -14 });
      s += myo(420, l('m6')) + larrow(450, y + 64, 370, y + 64, l('tominus'), C.motor, { dy: 16 });
      s += T(300, 380, l('n2'), { size: 11.5, col: C.muted, n: 80 });
      return s;
    }
    const flip = mode === 'flip';
    s += mtSide(70, y, 530, { h: 24, plus: flip ? 'l' : 'r' });
    const toPlus = flip ? -1 : 1;   /* знак направления к плюс-концу на экране */
    /* кинезин-1 → к плюс-концу; кинезин-14 → к минус-концу; динеин → к минус-концу; кинезин-13 у плюс-конца разбирает его */
    const kx = flip ? 400 : 160, k14 = flip ? 260 : 300, dx = flip ? 200 : 380, k13 = flip ? 96 : 504;
    s += kinesin(kx, y - 12, { s: 1, stalk: 30 }) + T(kx, y - 60, l('k1'), { size: 11.5, w: 700, col: C.motor }) + larrow(kx - 36 * toPlus, y - 86, kx + 36 * toPlus, y - 86, l('toplus'), C.motor, { dy: -14 });
    s += `<g transform="rotate(180 ${k14} ${y + 3})">${kinesin(k14, y - 6, { s: 1, stalk: 30 })}</g>` + T(k14, y + 58, l('k14'), { size: 11.5, w: 700, col: C.motor }) + larrow(k14 + 36 * toPlus, y + 80, k14 - 36 * toPlus, y + 80, l('tominus'), C.motor, { dy: 16 });
    s += dynein(dx, y - 12, { s: 1, stalk: 34 }) + T(dx, y - 62, l('dyn'), { size: 11.5, w: 700, col: C.motor }) + larrow(dx + 36 * toPlus, y - 86, dx - 36 * toPlus, y - 86, l('tominus'), C.motor, { dy: -14 });
    s += `<g transform="rotate(180 ${k13 - 14 * toPlus} ${y + 3})">${kinesin(k13 - 14 * toPlus, y - 6, { s: .9, stalk: 26 })}</g>` + dimer(k13 + 18 * toPlus, y + 30, 30) + dimer(k13 + 30 * toPlus, y + 48, -20);
    s += T(k13 - 20 * toPlus, y + 70, l('k13'), { size: 11.5, w: 700, col: C.motor }) + T(k13 - 20 * toPlus, y + 86, l('k13b'), { size: 10.5, col: C.muted });
    s += T(300, 392, l(flip ? 'n3' : 'n1'), { size: 11.5, col: C.muted, n: 84 });
    return s;
  } };

  /* ---------- ·21: аутоингибирование кинезина-1 (11, ·21; 04, ·21; двухэтапная активация) ---------- */
  GN.s2_r_autoinh = { view(args, t) {
    const l = L('autoinh', t), mode = args[0];
    let s = title(l('t'));
    const y = 320;
    s += mtSide(60, y, 540, { h: 24 });
    const heads = (x, yy) => S2F.G('kinesin', `<ellipse cx="${x - 12}" cy="${yy}" rx="12" ry="9" fill="${C.motor}"/><ellipse cx="${x + 12}" cy="${yy}" rx="12" ry="9" fill="${C.motorL}"/>`);
    if (mode === 'off') {
      /* сложен: хвост прижат к головкам; с микротрубочкой не связан; стрелки движения нет */
      const x = 300, yy = 200;
      s += heads(x, yy) + S2F.G('kinesin', `<path d="M${x},${yy - 8} C${x},${yy - 80} ${x + 70},${yy - 80} ${x + 50},${yy - 30} C${x + 40},${yy - 10} ${x + 20},${yy - 6} ${x + 14},${yy - 6}" fill="none" stroke="${C.motor}" stroke-width="3.4"/>`);
      s += `<circle cx="${x + 16}" cy="${yy - 6}" r="5" fill="${C.motor}"/>` + T(x + 90, yy - 70, l('tail'), { size: 11, col: C.motor, w: 600, a: 'l' }) + line(x + 88, yy - 66, x + 22, yy - 10, C.muted, 1);
      s += T(x, yy + 40, l('off'), { size: 13, w: 700, col: C.bad }) + T(300, 380, l('n1'), { size: 11.5, col: C.muted, n: 80 });
      return s;
    }
    const x = mode === 'walk' ? 320 : 260;
    /* разложенный кинезин на микротрубочке: головки — шейка — средняя спиральная часть — хвост */
    s += heads(x, y - 20) + S2F.G('kinesin', line(x, y - 28, x, y - 150, C.motor, 3.4));
    /* MAP7 связан с микротрубочкой и со средней спиральной частью */
    s += S2F.G('map7', `<rect x="${x + 32}" y="${y - 96}" width="12" height="84" rx="5" fill="${C.map7}"/><rect x="${x + 2}" y="${y - 96}" width="34" height="8" rx="4" fill="${C.map7}"/>`) + T(x + 52, y - 64, l('map7'), { size: 11, w: 700, col: '#2A86AC', a: 'l', n: 22 });
    /* адаптер груза на хвосте, груз — везикула */
    s += S2F.G('adapter', `<rect x="${x - 14}" y="${y - 170}" width="28" height="18" rx="6" fill="${C.adapter}"/>`) + vesicle(x, y - 200, 18, 'cargo', .5);
    s += T(x - 26, y - 162, l('adapter'), { size: 11, w: 700, col: '#8A6A00', a: 'r' });
    if (mode === 'activate') s += T(440, 120, l('n2'), { size: 12, w: 600, n: 26 });
    else s += larrow(x + 60, y - 110, x + 170, y - 110, l('toplus'), C.motor, { dy: -14 }) + T(140, 120, l('n3'), { size: 12, w: 600, n: 24 });
    return s;
  } };

  /* ---------- ·22: цикл субъединицы актина (11, ·22; 04, ·22) — скорости не показаны ---------- */
  GN.s2_r_actin_cycle = { view(args, t) {
    const l = L('actin_cycle', t), mode = args[0];
    let s = title(l('t'));
    const y = 200, x0 = 150, x1 = mode === 'nocofilin' ? 470 : 430;
    s += actinFil(x0, y, x1, y, { n: mode === 'nocofilin' ? 14 : 12, r: 12, nuc: i => (i < 2 ? 'Т' : i < 5 ? 'Д·Pi' : 'Д') });   /* v1.2, И-30: крупнее субъединицы — «Д·Pi» читается */
    /* узлы цикла */
    const node = (x, yy, lab, col = C.ink, w = 150, tx = 0) => box(x - w / 2, yy - 16, w, 32, '#fff', col) + T(x + tx, yy, lab, { size: 11, w: 600, col, n: 34 });
    const capped = mode === 'capped', nocof = mode === 'nocofilin';
    s += node(470, 70, l('gatp'), C.actin, 210, 12) + gact(382, 70, 7) + `<circle cx="375" cy="61" r="4.5" fill="#2E7D32"/>`;
    s += node(118, 330, l('cof'), nocof ? C.grey : C.ink, 210);
    s += node(300, 380, l('gadp'), C.actinD, 160);
    s += node(500, 330, l('prof'), C.ok, 170);
    /* стрелки цикла (замкнутый) */
    s += capped ? arrow(470, 88, x1 + 26, y - 18, C.grey, 2.2, '5 4') + cross(x1 + 30, y - 40, 8) : arrow(470, 88, x1 + 26, y - 18, C.ink, 2.2);
    s += arrow(x1 - 30, y + 30, x0 + 40, y + 30, C.ink, 1.8) + T((x0 + x1) / 2, y + 46, l('hydro'), { size: 10.5, col: C.muted });
    s += arrow(x0 - 6, y + 20, 118, 312, nocof ? C.grey : C.ink, 2.2, nocof ? '5 4' : '') + arrow(140, 346, 222, 372, nocof ? C.grey : C.ink, 2.2, nocof ? '5 4' : '');
    s += arrow(380, 376, 430, 346, C.ink, 2.2) + arrow(520, 312, 500, 88, C.ink, 2.2);
    /* подписи состояний в филаменте */
    s += T(x1 - 6, 132, l('in'), { size: 10.5, col: C.actin, w: 600, a: 'r' }) + T(x0 + 50, y - 34, l('old'), { size: 10.5, col: C.actinD, w: 600 });
    if (capped) s += S2F.G('capping', `<rect x="${x1 - 4}" y="${y - 17}" width="9" height="34" rx="3" fill="${C.ctr}"/>`) + T(x1 + 30, y + 24, l('capbox'), { size: 10.5, w: 700, col: C.ctr, a: 'l', n: 10 }) + T(260, 104, l('n2'), { size: 12, w: 700, col: C.bad, n: 40 });
    if (nocof) s += cross(110, 300, 7) + T(250, 100, l('n3'), { size: 12, w: 700, col: C.bad, n: 44 });
    return s;
  } };

  /* ---------- ·26: выдвижение края и перемещение клетки (11, ·26; 04, ·26) — один способ миграции ---------- */
  GN.s2_r_migration = { view(args, t) {
    const l = L('migration', t), mode = args[0];
    let s = title(l('t'));
    const sub = 330, c0 = 220, shift = mode === 'full' ? 70 : 0, front = mode === 'noadh' ? 440 : 500;
    s += `<rect x="10" y="${sub}" width="580" height="16" fill="#D9D3C6"/>` + T(260, sub + 30, l('sub'), { size: 10.5, col: C.muted, it: true });
    /* профиль клетки сбоку: тело с ядром, впереди (справа) тонкая ламеллиподия */
    const rear = 70 + shift, fr = front + shift;
    const P = [[rear + 6, mode === 'full' ? sub - 10 : sub - 2]];
    for (let i = 0; i <= 14; i++) { const a = Math.PI - i / 14 * Math.PI * .92; P.push([c0 + shift + 150 * Math.cos(a), sub - 6 - 134 * Math.pow(Math.sin(a), .8)]); }
    P.push([fr - 30, sub - 24], [fr, sub - 14], [fr, sub - 4], [fr - 6, sub - 2]);
    s += `<path d="M${P.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="${C.cyto}"/>` + mem(P, { closed: true }, .45);
    s += nucleus(c0 + shift, sub - 92, 54, 34, .3);
    /* актиновая сеть ламеллиподии */
    /* v1.2, И-31: ветвящаяся сеть (ветви под 70°, плюс-концы к переднему краю), без рядов «X» — красный крест на этих страницах значит «нарушено» */
    for (let k = 0; k < 6; k++) { const x = fr - 112 + k * 17, y = sub - 6, a = -20 * Math.PI / 180, L1 = 16, bx = x + L1 * .45 * Math.cos(a), by = y + L1 * .45 * Math.sin(a), b = a - 70 * Math.PI / 180;
      s += S2F.G('actin', line(x, y, x + L1 * Math.cos(a), y + L1 * Math.sin(a), C.actin, 2) + line(bx, by, bx + 10 * Math.cos(b + Math.PI / 2.6), by + 10 * Math.sin(b + Math.PI / 2.6), C.actin, 1.8)); }
    /* метка «центр клетки»; исходное положение — пунктир */
    s += line(c0, 50, c0, sub, C.muted, 1, 'stroke-dasharray="4 4"') + T(c0, 44, l('start'), { size: 10.5, col: C.muted });
    s += S2F.G('center', `<circle cx="${c0 + shift}" cy="${sub - 92}" r="6" fill="${C.ink}"/>`) + T(c0 + shift, sub - 44, l('center'), { size: 11, w: 700 });
    if (mode === 'noadh') {
      s += larrow(fr - 20, sub - 40, fr - 110, sub - 40, l('retro'), C.actin, { dy: -14 });
      s += T(470, 90, l('n1'), { size: 12, w: 600, n: 26 });
    } else {
      /* сцепление с подложкой (новые контакты впереди) */
      [fr - 90, fr - 55, fr - 22].forEach(x => { s += S2F.G('adhesion', `<path d="M${x - 6},${sub} L${x - 3},${sub - 8} L${x + 3},${sub - 8} L${x + 6},${sub} Z" fill="#4A3A28"/>`); });
      s += T(Math.min(fr + 4, 592), sub + 30, l('adh'), { size: 10.5, w: 600, col: '#4A3A28', a: 'r' });
      if (mode === 'adh') s += line(440, sub - 40, 440, sub, C.muted, 1.2, 'stroke-dasharray="3 3"') + T(440, sub - 50, l('old'), { size: 10, col: C.muted }) + T(470, 90, l('n2'), { size: 12, w: 600, n: 26 });   /* v1.2, И-30 */
      else {
        /* сокращение актомиозина позади и открепление заднего края */
        s += actinLine(rear + 30, sub - 50, c0 + shift - 70, sub - 50, { r: 2.2 }) + myosinII((rear + c0 + shift - 40) / 2, sub - 50, 30);
        s += arrow(rear + 44, sub - 34, rear + 74, sub - 34, C.actin, 2) + T(rear + 62, sub - 68, l('contr'), { size: 10.5, w: 600, col: C.actin });   /* v1.2, И-30: подпись внутри клетки, не на мембране */
        s += T(rear - 10, sub + 46, l('detach'), { size: 10.5, w: 600, col: C.muted, a: 'l' });
        s += arrow(c0 + 4, 130, c0 + shift - 6, 130, C.ink, 2.2) + T(c0 + shift / 2, 116, l('shift'), { size: 10.5, w: 600 });
        s += T(470, 90, l('n3'), { size: 12, w: 600, n: 26 });
      }
    }
    return s;
  } };
})();
/* =====================================================================
   s3_gn_t1.js — сцены вкладки 1, панели Б и В (02, 1.5; 07, разд. 3, 4.0, 4.1; 10, А2; 11, ·5, ·6).
   GN.s2_t1b «Условная клетка» — view([reduced, load, o], t): reduced ∈ {null, 'A', 'M', 'I'} — система со сильно сниженной функцией
     (её сеть редкая и бледная, но не исчезает — 02, 1.5); load ∈ {'stretch', 'cargo', 'protrude'}; исходы — модель OC.s1 (три индикатора:
     текст + цвет). o.wait — до ответа шагов 4–6 индикаторы и следы исхода нагрузки скрыты (07, 4.0); o.nets === false — сети скрыты
     (обратная задача до ответа: вид сетей подсказывал бы ответ); o.stg — кадр анимации А2: 0 — нагрузка ещё не приложена;
     нет o.stg — конечный кадр = статичная схема (07, 4.1: растяжение — клетку тянут за края, сеть ПФ натягивается; перенос — лизосома
     идёт по микротрубочке; выпячивание — край выдвигается).
   GN.s2_t1c «Центр организации микротрубочек» — view([mode, o], t): 'cent' — центросома (две центриоли под прямым углом, облако
     перицентриолярного материала, кольца γ-TuRC, минус-концы у колец) и аппарат Гольджи с кольцами γ-TuRC; 'nocent' — центриоли
     удалены: кольца γ-TuRC в цитоплазме и на Гольджи, сеть хуже сфокусирована; 'epi' — эпителиальная клетка: минус-концы у апикальной
     стороны, плюс-концы к базальной (11, ·5; 05, C-10…C-12). Мембрана клетки — бислой BF (S2F.mem).
   ===================================================================== */
GN.s2_t1b = (function () {
  const { C, f, G, T, title, line, endSign, waitBox, outcome, mem, vesicle, nucleus, actinLine, ifRope, mtLine, centrosome, arrow, cross } = S2F;
  const K = .5;   /* масштаб рисунка бислоя на обзорной схеме клетки */
  const OUT = ['s2_t1b_out_0', 's2_t1b_out_1', 's2_t1b_out_2'];
  /* контур клетки: скруглённый прямоугольник, справа — выпуклость ламеллиподии на величину p */
  function cellPts(p, dx = 0) {
