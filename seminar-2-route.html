b&gt; Модель не говорит, какая причина чаще встречается.</p><h3>Дальше в курсе «Биология»</h3><ul><li><a href="https://fresll.github.io/bio/seminar-1-route.html">Семинар 1</a> — мембрана и белки, связывающие её с кортексом</li><li><a href="https://fresll.github.io/bio/seminar-3-route.html">Семинар 3</a> — актин в эндоцитозе и движение везикул по микротрубочкам</li><li>Семинар 4 — направленная доставка мембранных и секретируемых белков</li><li>Семинар 6 — веретено деления из микротрубочек и сократительное кольцо из актина и миозина</li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Транспорт органелл по цитоскелету и адаптеры моторов — <a href="https://fresll.github.io/molbio/seminar-2-route.html#tracks">МБ 2·1</a>, <a href="https://fresll.github.io/molbio/seminar-2-route.html#motors">МБ 2·2</a>, <a href="https://fresll.github.io/molbio/seminar-2-route.html#adaptors">МБ 2·3</a> (семинар 2 «Транспорт, сети органелл, конденсаты и полярность»)</li></ul><div class="static-quiz"><h3>Почему по одному набору признаков нельзя сразу назвать единственную причину?</h3><ol><li><b>А.</b> Признаки появляются случайно <i>(неверный вариант)</i><br><span class="expl">Признаки следуют из причин, но не однозначно</span></li><li><b>Б.</b> Разные причины дают те же признаки <i>(верный вариант)</i><br><span class="expl">Да: нужны дополнительные измерения</span></li><li><b>В.</b> У каждого признака одна причина <i>(неверный вариант)</i><br><span class="expl">Например, нарушенный перенос лизосом к периферии дают и малое число микротрубочек, и неактивный кинезин-1, и снижение АТФ</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-2.html#q1">Вопрос 1 →</a> <a href="seminar-2.html#q2">Вопрос 2 →</a> <a href="seminar-2.html#q3">Вопрос 3 →</a> <a href="seminar-2.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 16 «The Cytoskeleton»</li></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S2-T01"><dt>Цитоскелет</dt><dd>Система белковых полимеров и связанных с ними белков в цитоплазме эукариотической клетки; придаёт клетке форму и механическую прочность, обеспечивает изменение формы, генерацию силы и направленное перемещение внутриклеточных компонентов.</dd></div><div id="ns-g-S2-T02"><dt>Субъединица полимера</dt><dd>Отдельная белковая молекула или комплекс (например, мономер актина, димер тубулина), из множества которых нековалентно собран полимер.</dd></div><div id="ns-g-S2-T03"><dt>Актиновый филамент</dt><dd>Полярный полимер актина диаметром около 8 нм; две закрученные цепочки субъединиц; синоним — микрофиламент, F-актин.</dd></div><div id="ns-g-S2-T04"><dt>Актин</dt><dd>Глобулярный белок, связывающий АТФ; свободная форма — G-актин (глобулярный), полимерная — F-актин (филаментный).</dd></div><div id="ns-g-S2-T05"><dt>Микротрубочка</dt><dd>Полый полярный цилиндр наружным диаметром 25 нм, стенка которого обычно состоит из 13 протофиламентов αβ-тубулина.</dd></div><div id="ns-g-S2-T06"><dt>Тубулин</dt><dd>Белок микротрубочек; субъединица — прочный димер α- и β-тубулина, каждый из которых связывает ГТФ.</dd></div><div id="ns-g-S2-T07"><dt>Протофиламент</dt><dd>Линейная цепочка димеров тубулина, уложенных «голова к хвосту»; 13 протофиламентов образуют стенку микротрубочки.</dd></div><div id="ns-g-S2-T08"><dt>Промежуточный филамент</dt><dd>Неполярный прочный филамент диаметром около 10 нм из вытянутых белков (кератинов, виментина, ламинов и др.); сопротивляется растяжению, не служит путём для моторных белков.</dd></div><div id="ns-g-S2-T09"><dt>Полярность филамента</dt><dd>Различие двух концов филамента, возникающее потому, что все субъединицы встроены в одной ориентации.</dd></div><div id="ns-g-S2-T10"><dt>Плюс-конец</dt><dd>Быстрее растущий конец полярного филамента; у микротрубочки на нём наружу обращён β-тубулин.</dd></div><div id="ns-g-S2-T11"><dt>Минус-конец</dt><dd>Медленнее растущий конец полярного филамента; у микротрубочек обычно закреплён в центре организации.</dd></div><div id="ns-g-S2-T12"><dt>Антипараллельный тетрамер</dt><dd>Субъединица промежуточного филамента: два параллельных димера, уложенные навстречу друг другу, так что оба конца тетрамера одинаковы.</dd></div><div id="ns-g-S2-T13"><dt>Кератины</dt><dd>Белки промежуточных филаментов эпителиальных клеток; кислые и основные кератины образуют пары.</dd></div><div id="ns-g-S2-T14"><dt>Виментин</dt><dd>Белок промежуточных филаментов многих клеток соединительной ткани и других клеток мезенхимного происхождения.</dd></div><div id="ns-g-S2-T15"><dt>Ламины</dt><dd>Белки промежуточных филаментов ядра; образуют ядерную ламину — сеть под внутренней мембраной ядерной оболочки.</dd></div><div id="ns-g-S2-T16"><dt>Десмосома</dt><dd>Межклеточный контакт, к которому с цитоплазматической стороны прикреплены промежуточные филаменты.</dd></div><div id="ns-g-S2-T17"><dt>Гемидесмосома</dt><dd>Контакт клетки с внеклеточным матриксом, к которому прикреплены промежуточные филаменты.</dd></div><div id="ns-g-S2-T18"><dt>Клеточный кортекс</dt><dd>Сеть актиновых филаментов и связанных белков под плазматической мембраной; определяет форму поверхности и её натяжение.</dd></div><div id="ns-g-S2-T19"><dt>Центр организации микротрубочек (ЦОМТ)</dt><dd>Место в клетке, где нуклеируются микротрубочки и закреплены их минус-концы.</dd></div><div id="ns-g-S2-T20"><dt>Центросома</dt><dd>Главный центр организации микротрубочек большинства животных клеток: пара центриолей и окружающий перицентриолярный материал.</dd></div><div id="ns-g-S2-T21"><dt>Центриоль</dt><dd>Цилиндрическая органелла из девяти триплетов микротрубочек; две центриоли входят в центросому, центриоль может стать базальным тельцем.</dd></div><div id="ns-g-S2-T22"><dt>Перицентриолярный материал</dt><dd>Белковый матрикс вокруг центриолей, содержащий γ-тубулиновые кольцевые комплексы.</dd></div><div id="ns-g-S2-T23"><dt>γ-Тубулиновый кольцевой комплекс (γ-TuRC)</dt><dd>Кольцо из γ-тубулина и связанных белков, на котором нуклеируется минус-конец микротрубочки.</dd></div><div id="ns-g-S2-T24"><dt>Базальное тельце</dt><dd>Структура в основании реснички или жгутика, происходящая из центриоли; от неё растут микротрубочки реснички.</dd></div><div id="ns-g-S2-T25"><dt>Ресничка</dt><dd>Выступ поверхности клетки, покрытый мембраной, с каркасом из микротрубочек; подвижные реснички бьются, первичная ресничка воспринимает сигналы.</dd></div><div id="ns-g-S2-T26"><dt>Нуклеация</dt><dd>Начальный этап образования нового полимера, на котором несколько субъединиц собираются в затравку; в клетке обеспечивается специальными белками.</dd></div><div id="ns-g-S2-T27"><dt>Полимеризация</dt><dd>Присоединение субъединиц к концу полимера.</dd></div><div id="ns-g-S2-T28"><dt>Деполимеризация</dt><dd>Отделение субъединиц от конца полимера.</dd></div><div id="ns-g-S2-T29"><dt>Свободный пул субъединиц</dt><dd>Субъединицы (например, G-актин, димеры тубулина), находящиеся в цитоплазме вне полимера и доступные для сборки.</dd></div><div id="ns-g-S2-T30"><dt>Динамическая нестабильность</dt><dd>Чередование периодов роста и быстрого укорочения одной микротрубочки при постоянной концентрации свободного тубулина.</dd></div><div id="ns-g-S2-T31"><dt>Катастрофа микротрубочки</dt><dd>Переход микротрубочки от роста к быстрому укорочению.</dd></div><div id="ns-g-S2-T32"><dt>Спасение микротрубочки</dt><dd>Переход микротрубочки от укорочения к росту до полной разборки.</dd></div><div id="ns-g-S2-T33"><dt>ГТФ-шапочка</dt><dd>Участок у растущего конца микротрубочки из субъединиц тубулина, ещё не гидролизовавших ГТФ; защищает конец от быстрой разборки.</dd></div><div id="ns-g-S2-T34"><dt>ГТФ и ГДФ</dt><dd>Гуанозинтрифосфат и гуанозиндифосфат; нуклеотиды, связанные с тубулином; ГДФ образуется при гидролизе ГТФ.</dd></div><div id="ns-g-S2-T35"><dt>Гидролиз нуклеотида</dt><dd>Отщепление концевой фосфатной группы от АТФ или ГТФ с участием воды; в полимерах актина и тубулина происходит после встраивания субъединицы.</dd></div><div id="ns-g-S2-T36"><dt>Белки плюс-конца (+TIP)</dt><dd>Белки, связывающиеся с растущим плюс-концом микротрубочки и регулирующие его динамику.</dd></div><div id="ns-g-S2-T37"><dt>EB1</dt><dd>Белок, связывающийся с концом микротрубочки (от англ. end-binding); белок плюс-конца, узнающий участок стенки у растущего конца микротрубочки и привлекающий другие белки плюс-конца.</dd></div><div id="ns-g-S2-T38"><dt>Фактор катастроф</dt><dd>Белок, повышающий частоту катастроф микротрубочек (например, кинезины семейства 13).</dd></div><div id="ns-g-S2-T39"><dt>Белки, ассоциированные с микротрубочками (MAP)</dt><dd>Белки, связывающиеся с микротрубочками и меняющие их устойчивость, динамику или связи с другими структурами.</dd></div><div id="ns-g-S2-T40"><dt>Тредмиллинг</dt><dd>Поведение полимера, при котором субъединицы присоединяются к одному концу и с той же скоростью отделяются от другого: длина постоянна, субъединицы проходят через полимер.</dd></div><div id="ns-g-S2-T41"><dt>Таксол (паклитаксел)</dt><dd>Вещество из тиса, связывающееся с микротрубочками и стабилизирующее их.</dd></div><div id="ns-g-S2-T42"><dt>Колхицин</dt><dd>Вещество из безвременника, связывающее тубулин и вызывающее разборку микротрубочек.</dd></div><div id="ns-g-S2-T43"><dt>Веретено деления</dt><dd>Структура из микротрубочек, распределяющая хромосомы между дочерними клетками при делении.</dd></div><div id="ns-g-S2-T44"><dt>Конденсат</dt><dd>Скопление молекул в цитоплазме или ядре без окружающей мембраны, в котором определённые белки и другие молекулы сконцентрированы.</dd></div><div id="ns-g-S2-T45"><dt>Моторный белок</dt><dd>Белок, который, гидролизуя АТФ, направленно перемещается вдоль филамента и может переносить груз или сдвигать филаменты.</dd></div><div id="ns-g-S2-T46"><dt>АТФ и АДФ</dt><dd>Аденозинтрифосфат и аденозиндифосфат; энергия гидролиза АТФ используется моторными белками; актин связывает АТФ и после встраивания гидролизует его до АДФ.</dd></div><div id="ns-g-S2-T47"><dt>Кинезины</dt><dd>Семейство моторных белков микротрубочек (у человека 45 генов); большинство движется к плюс-концу, некоторые — к минус-концу, некоторые разбирают концы микротрубочек.</dd></div><div id="ns-g-S2-T48"><dt>Кинезин-1</dt><dd>Двухголовый кинезин, движущийся к плюс-концу микротрубочки и переносящий мембранные органеллы и везикулы.</dd></div><div id="ns-g-S2-T49"><dt>Цитоплазматический динеин</dt><dd>Крупный моторный белок, не родственный кинезинам, движущийся к минус-концу микротрубочки; куда в клетке попадёт груз, зависит от ориентации микротрубочек.</dd></div><div id="ns-g-S2-T50"><dt>Груз</dt><dd>Органелла, везикула, комплекс белков или РНК, переносимые моторным белком.</dd></div><div id="ns-g-S2-T51"><dt>Белок-адаптер груза</dt><dd>Белок, связывающий моторный белок с определённым грузом и регулирующий активность мотора.</dd></div><div id="ns-g-S2-T52"><dt>Аксон</dt><dd>Длинный отросток нейрона, передающий сигнал к другим клеткам; микротрубочки в нём обращены плюс-концом к окончанию.</dd></div><div id="ns-g-S2-T53"><dt>Дендрит</dt><dd>Отросток нейрона, принимающий сигналы; у млекопитающих микротрубочки в нём лежат в обеих ориентациях.</dd></div><div id="ns-g-S2-T54"><dt>Апикальная и базальная стороны</dt><dd>Стороны эпителиальной клетки: апикальная обращена в просвет или наружу, базальная — к базальной мембране.</dd></div><div id="ns-g-S2-T55"><dt>Аутоингибирование</dt><dd>Выключение белка его собственной частью; у кинезина-1 хвост, прижимаясь к головкам, выключает их, пока нет груза.</dd></div><div id="ns-g-S2-T56"><dt>Миозины</dt><dd>Семейство моторных белков актиновых филаментов; почти все движутся к плюс-концу (исключение — миозин VI).</dd></div><div id="ns-g-S2-T57"><dt>Миозин II</dt><dd>Миозин, образующий биполярные нити; стягивает антипараллельные актиновые филаменты в мышце, стрессовых волокнах, кортексе и сократительном кольце.</dd></div><div id="ns-g-S2-T58"><dt>Актомиозиновое сокращение</dt><dd>Укорочение структуры, при котором миозин II, гидролизуя АТФ, тянет антипараллельные актиновые филаменты навстречу друг другу.</dd></div><div id="ns-g-S2-T59"><dt>Ламеллиподия</dt><dd>Плоский выступ переднего края ползущей клетки, заполненный ветвящейся сетью актиновых филаментов.</dd></div><div id="ns-g-S2-T60"><dt>Броуновский храповик</dt><dd>Модель генерации силы полимеризацией: субъединица встраивается в зазор, открытый тепловым колебанием мембраны, и не даёт мембране вернуться.</dd></div><div id="ns-g-S2-T61"><dt>Комплекс Arp2/3</dt><dd>Комплекс из семи белков, в том числе двух, родственных актину (Arp2 и Arp3; Arp — actin-related proteins); нуклеирует новый актиновый филамент на боковой поверхности существующего под углом около 70°.</dd></div><div id="ns-g-S2-T62"><dt>Формины</dt><dd>Белки, нуклеирующие неразветвлённые актиновые филаменты и остающиеся на растущем плюс-конце.</dd></div><div id="ns-g-S2-T63"><dt>Профилин</dt><dd>Белок, связывающий G-актин, ускоряющий замену АДФ на АТФ и доставляющий мономеры к растущим плюс-концам.</dd></div><div id="ns-g-S2-T64"><dt>Кофилин</dt><dd>Белок, связывающийся с участками АДФ-актина и ускоряющий разрезание и разборку филаментов.</dd></div><div id="ns-g-S2-T65"><dt>Кэпирующий белок</dt><dd>Белок, закрывающий плюс-конец актинового филамента и останавливающий его рост и разборку.</dd></div><div id="ns-g-S2-T66"><dt>Сцепление с подложкой</dt><dd>Связь актиновой сети через белки адгезии (интегрины) с внеклеточным матриксом, позволяющая передавать силу на подложку.</dd></div><div id="ns-g-S2-T67"><dt>Ретроградный поток актина</dt><dd>Движение актиновой сети от переднего края вглубь клетки, когда сила сборки не передаётся на подложку полностью.</dd></div><div id="ns-g-S2-T68"><dt>Стрессовое волокно</dt><dd>Пучок актиновых филаментов с миозином II, связанный концами с контактами клетки с подложкой.</dd></div><div id="ns-g-S2-T69"><dt>Сократительное кольцо</dt><dd>Кольцо из актина и миозина II под мембраной, перешнуровывающее клетку при делении.</dd></div><div id="ns-g-S2-T70"><dt>Авторегуляция синтеза</dt><dd>Зависимость синтеза белка от количества его собственной свободной формы (отрицательная обратная связь).</dd></div><div id="ns-g-S2-T71"><dt>MRTF</dt><dd>Фактор транскрипции, родственный миокардину: белок, который удерживается в цитоплазме свободным G-актином и, переходя в ядро, когда G-актина мало, вместе с SRF усиливает работу генов цитоскелета.</dd></div><div id="ns-g-S2-T72"><dt>мРНК</dt><dd>Матричная РНК: копия гена, по которой рибосома синтезирует белок.</dd></div><div id="ns-g-S2-T73"><dt>TTC5</dt><dd>Белок с тетратрикопептидными повторами 5, узнающий начало растущей цепи тубулина на рибосоме и запускающий разрушение мРНК тубулина при избытке свободного тубулина.</dd></div><div id="ns-g-S2-T74"><dt>Фенотип</dt><dd>Совокупность наблюдаемых признаков клетки или организма.</dd></div><div id="ns-g-S2-T75"><dt>Мишень</dt><dd>В задаче о динамике микротрубочек: место в клетке, до которого может дорасти плюс-конец микротрубочки (например, участок мембраны).</dd></div><div id="ns-g-S2-T76"><dt>Клеточная полярность</dt><dd>Различие свойств и состава частей клетки (например, апикальной и базальной сторон, аксона и дендритов).</dd></div><div id="ns-g-S2-T77"><dt>Механическая сила</dt><dd>В клетке: воздействие одной структуры на другую, способное сдвинуть или деформировать её (например, толчок мембраны растущей сетью актина, стягивание миозином).</dd></div><div id="ns-g-S2-T78"><dt>Фосфорилирование</dt><dd>Присоединение фосфатной группы к белку; меняет свойства белка, например вызывает разборку промежуточных филаментов при делении клетки.</dd></div><div id="ns-g-S2-T79"><dt>Аппарат Гольджи</dt><dd>Стопка уплощённых мембранных цистерн, где модифицируются и сортируются белки; во многих клетках служит также центром организации микротрубочек.</dd></div><div id="ns-g-S2-T80"><dt>Рибосома</dt><dd>Частица из РНК и белков, синтезирующая белок по мРНК.</dd></div><div id="ns-g-S2-T81"><dt>Лизосома</dt><dd>Мембранная органелла с ферментами расщепления; переносится моторными белками по микротрубочкам.</dd></div><div id="ns-g-S2-T82"><dt>Белок спасения</dt><dd>Белок, повышающий частоту спасений микротрубочек, то есть прерывающий их укорочение.</dd></div><div id="ns-g-S2-T83"><dt>SRF</dt><dd>Фактор сывороточного ответа: белок, связывающийся с регуляторными участками генов актина и других белков цитоскелета; вместе с MRTF усиливает их работу.</dd></div></dl></section></noscript>

Микротрубочка","Промежуточный филамент","Моторный белок"],"lead":["[[T01|Цитоскелет]] — система белковых полимеров и связанных с ними белков, которая придаёт клетке форму и механическую прочность, меняет форму поверхности, создаёт силу и направленно перемещает компоненты внутри клетки. Каждый полимер собран из множества одинаковых [[T02|субъединиц]], связанных нековалентно."],"mechanism":["В животной клетке три системы: [[T03|актиновые филаменты]] (диаметр около 8 нм), [[T05|микротрубочки]] (наружный диаметр 25 нм) и [[T08|промежуточные филаменты]] (около 10 нм). Они различаются не только толщиной, но и белком-субъединицей, наличием нуклеотида, полярностью, [[T45|моторными белками]], скоростью перестройки и тем, какую нагрузку они лучше выдерживают. Актиновые филаменты сосредоточены у плазматической мембраны и определяют форму поверхности; микротрубочки — длинные жёсткие пути от центра клетки к периферии; промежуточные филаменты — прочная сеть от ядра к межклеточным контактам."],"paragraphs":["Различия в свойствах объясняют, почему клетке нужны все три: прочная, но неполярная сеть не может служить путём для направленного транспорта; динамичная сеть актина не выдерживает сильного растяжения в одиночку. Все три системы связаны друг с другом и с мембраной. <b>На практикуме.<\/b> Вкладка 1, шаг 2: пучок из десяти актиновых филаментов толще микротрубочки, и отличить их помогает субъединица и строение стенки, а не диаметр.","<b>Ограничения.<\/b> Актин и тубулин есть у всех эукариот; цитоплазматические промежуточные филаменты образуются только у части многоклеточных животных. Есть и другие полимеры, например септины."],"conditions":"Схема качественная; масштаб диаметров соблюдён, длины условные.","sources":["src_01"],"base":"вспомнить БИО-1·4 (текучесть мембраны) и БИО-1·6 (кортикальный слой под мембраной)","quiz":{"id":"S2-L01","question":"Препарат клетки окрашен так, что видны только нити. Какой признак надёжнее всего указывает, к какой системе относится нить?","options":[{"id":"S2-L01-1","text":"Белок-субъединица","correct":true,"feedback":"Да: субъединица однозначно определяет систему; диаметр пучков и сетей зависит от числа сшитых нитей"},{"id":"S2-L01-2","text":"Толщина нити","correct":false,"feedback":"Толщина помогает, но пучок тонких филаментов может быть толще одной микротрубочки"},{"id":"S2-L01-3","text":"Длина нити","correct":false,"feedback":"Длина у всех трёх систем меняется в широких пределах и систему не определяет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Три системы цитоскелета","status":"Схема качественная · диаметры в масштабе, длины условные","modes_label":"Что показать","modes":["клетка","три полимера","пучок или микротрубочка"],"args":[["cell"],["three",{"table":"full"}],["bundle"]],"notes":["Три сети в одной клетке: актин у мембраны, микротрубочки от центросомы, промежуточные филаменты от ядра к контактам","Различаются субъединица, нуклеотид, полярность, моторы, перестройка и механическая роль","Пучок толще микротрубочки: различает субъединица и стенка, а не диаметр"],"static":["Пучок толще микротрубочки: различает субъединица и стенка, а не диаметр"],"scenes":["s2_r_overview","s2_t1a","s2_t1a"],"L":{"s2_r_overview_cent":"центросома","s2_r_overview_cortex":"кортекс: актин под мембраной","s2_r_overview_desm":"десмосомы — контакты с соседними клетками","s2_r_overview_if":"промежуточные филаменты: от ядра к контактам","s2_r_overview_lam":"ламеллиподия у свободного края","s2_r_overview_mt":"микротрубочки от центросомы","s2_r_overview_mt2":"«+» — у периферии","s2_r_overview_nb":"соседняя клетка","s2_r_overview_nuc":"ядро","s2_r_overview_t":"Три сети в одной клетке (вид сверху)","s2_t1a_13":"13 протофиламентов","s2_t1a_actin":"Актиновый филамент","s2_t1a_bundle":"Пучок: 10 актиновых филаментов","s2_t1a_bundle_note":"Пучок толще микротрубочки: различает субъединица и стенка, а не диаметр","s2_t1a_c_dyn_actin":"быстрая: секунды — минуты","s2_t1a_c_dyn_if":"медленнее; разборка при фосфорилировании","s2_t1a_c_dyn_mt":"быстрая: секунды — минуты","s2_t1a_c_mech_actin":"форма поверхности, натяжение","s2_t1a_c_mech_if":"прочность на растяжение","s2_t1a_c_mech_mt":"жёсткие пути транспорта","s2_t1a_c_mot_actin":"миозины","s2_t1a_c_mot_if":"нет","s2_t1a_c_mot_mt":"кинезины и динеины","s2_t1a_c_nuc_actin":"АТФ","s2_t1a_c_nuc_if":"нет","s2_t1a_c_nuc_mt":"ГТФ","s2_t1a_c_pol_actin":"есть: «+» и «−»","s2_t1a_c_pol_if":"нет","s2_t1a_c_pol_mt":"есть: «+» и «−»","s2_t1a_c_sub_actin":"актин","s2_t1a_c_sub_if":"белки промежуточных филаментов","s2_t1a_c_sub_mt":"αβ-тубулин","s2_t1a_d_actin":"около 8 нм","s2_t1a_d_bundle":"больше 25 нм","s2_t1a_d_if":"около 10 нм","s2_t1a_d_mt":"25 нм, полая","s2_t1a_if":"Промежуточный филамент","s2_t1a_lens":"тетрамер: два димера уложены навстречу друг другу","s2_t1a_mt":"Микротрубочка","s2_t1a_pA":"А. Три полимера: один масштаб по длине","s2_t1a_pB2":"А. Пучок актиновых филаментов и микротрубочка","s2_t1a_same":"концы одинаковы","s2_t1a_sub_actin":"субъединица: актин","s2_t1a_sub_mt":"субъединица: αβ-тубулин; полая стенка","s2_t1a_tab_dyn":"перестройка","s2_t1a_tab_mech":"главная механическая роль","s2_t1a_tab_mot":"моторные белки","s2_t1a_tab_nuc":"нуклеотид у субъединицы","s2_t1a_tab_pol":"полярность","s2_t1a_tab_sub":"субъединица"}},"zoomNarrow":true},"exam_quiz":{"id":"S2-E02","question":"Где находятся ламины?","options":[{"id":"S2-E02-1","text":"В аксоне","correct":false,"feedback":"В аксоне — нейрофиламенты"},{"id":"S2-E02-2","text":"Под внутренней мембраной ядра","correct":true,"feedback":"Да: они образуют ядерную ламину"},{"id":"S2-E02-3","text":"В кортексе","correct":false,"feedback":"Кортекс — актин"}]}},{"id":"actin-filament","num":2,"section":0,"questions":[1],"title":"Как устроен актиновый филамент?","keywords":["Актин","АТФ и АДФ","Полярность филамента","Плюс-конец","Минус-конец","Гидролиз нуклеотида"],"lead":["[[T04|Актин]] — глобулярный белок; свободный мономер называют G-актином, полимер — F-актином. Актиновый филамент — две закрученные цепочки субъединиц актина."],"mechanism":["Каждая субъединица актина несёт прочно связанный нуклеотид — [[T46|АТФ]] или АДФ. Все субъединицы присоединяются в одной ориентации, поэтому у филамента есть [[T09|полярность]]: два конца различаются. Быстрорастущий конец называют [[T10|плюс-концом]], медленнорастущий — [[T11|минус-концом]]. Вскоре после встраивания субъединицы её АТФ [[T35|гидролизуется]] до АДФ, и неорганический фосфат постепенно уходит; старые участки филамента состоят из АДФ-актина и удерживаются слабее."],"paragraphs":["Отдельный актиновый филамент гибок, но филаменты, сшитые белками в пучки и сети, образуют прочные структуры. Наибольшая концентрация актина — под мембраной, в [[T18|клеточном кортексе]]. По актиновым филаментам движутся моторы [[T56|миозины]] (тема 4). <b>На практикуме.<\/b> Вкладка 1, панель А: у актинового филамента подписаны плюс- и минус-концы, у субъединиц — буквы «Т» и «Д» (АТФ и АДФ).","<b>Ограничения.<\/b> Слова «плюс» и «минус» не означают заряда: это названия концов.",{"details":"Дополнение (добровольно)","text":"Плюс-конец называют также «зазубренным», минус-конец — «заострённым»: так концы выглядят на электронных фотографиях, если филамент покрыт головками миозина."}],"conditions":"","sources":["src_01"],"base":"БИО-2·1","quiz":{"id":"S2-L02","question":"Почему у актинового филамента два конца различаются?","options":[{"id":"S2-L02-1","text":"На двух концах находятся разные белки","correct":false,"feedback":"Полярность есть и у филамента из одного очищенного актина; она — свойство укладки субъединиц"},{"id":"S2-L02-2","text":"Субъединицы ориентированы одинаково","correct":true,"feedback":"Да: ориентация субъединиц одинакова по всей длине, и поэтому один конец отличается от другого"},{"id":"S2-L02-3","text":"Один конец прикреплён к мембране","correct":false,"feedback":"Связь с мембраной не создаёт полярность; она есть и у свободного филамента"}]},"widget":{"kind":"dna","title":"","s":{"title":"Актиновый филамент","status":"Схема качественная","modes_label":"Что показать","modes":["филамент","свежий и старый участки"],"args":[["actin",{"nuc":"none"}],["actin",{"nuc":"age"}]],"notes":["Все субъединицы ориентированы одинаково — концы различаются","У плюс-конца — АТФ-актин, глубже — АДФ-актин"],"static":["Все субъединицы ориентированы одинаково — концы различаются"],"scene":"s2_t1a","L":{"s2_t1a_fresh":"свежий участок: АТФ-актин","s2_t1a_old":"старый участок: АДФ-актин","s2_t1a_orient":"Все субъединицы присоединены в одной ориентации — концы филамента различаются","s2_t1a_pActin":"Актиновый филамент: две цепочки субъединиц","s2_t1a_pi":"фосфат ещё связан","s2_t1a_tdl":"Т — АТФ-актин, Д·Pi — АДФ и фосфат, Д — АДФ-актин"}}},"exam_quiz":{"id":"S2-E09","question":"Какие функции у актиновых филаментов?","options":[{"id":"S2-E09-1","text":"Только перенос груза на большие расстояния","correct":false,"feedback":"Это функция микротрубочек"},{"id":"S2-E09-2","text":"Только прочность при растяжении","correct":false,"feedback":"Главная система здесь — промежуточные филаменты"},{"id":"S2-E09-3","text":"Форма поверхности, выпячивания, сокращение, деление клетки","correct":true,"feedback":"Да"}]}},{"id":"microtubule-structure","num":3,"section":0,"questions":[1],"title":"Как устроена микротрубочка?","keywords":["Тубулин","Протофиламент","ГТФ и ГДФ","Центр организации микротрубочек (ЦОМТ)"],"lead":["Микротрубочку собирает [[T06|тубулин]] — димер из α-тубулина и β-тубулина. Димеры выстраиваются «голова к хвосту» в [[T07|протофиламенты]]; 13 параллельных протофиламентов замыкаются в полую трубку."],"mechanism":["Все димеры ориентированы одинаково, поэтому микротрубочка полярна: на плюс-конце наружу обращён β-тубулин, на минус-конце — α-тубулин. Каждая субъединица тубулина несёт [[T34|ГТФ]]; в β-тубулине ГТФ гидролизуется после встраивания, в α-тубулине — нет. Чтобы разорвать микротрубочку посередине, нужно одновременно разорвать связи во всех 13 протофиламентах, поэтому тепловое движение её не ломает, а присоединение и отделение субъединиц на концах идут легко. Полая трубка гораздо жёстче двухцепочечного актинового филамента."],"paragraphs":["Жёсткость позволяет микротрубочкам пересекать клетку и сопротивляться изгибу и сжатию. Минус-концы обычно закреплены в [[T19|центре организации]], плюс-концы растут к периферии (БИО-2·5). <b>На практикуме.<\/b> Вкладка 1, панель А: разрез из 13 кружков; α и β различаются цветом.","<b>Ограничения.<\/b> Число протофиламентов 13 — у большинства микротрубочек."],"conditions":"","sources":["src_01"],"base":"БИО-2·2 (полярность)","quiz":{"id":"S2-L03","question":"Какой тубулин обращён наружу на плюс-конце микротрубочки?","options":[{"id":"S2-L03-1","text":"α-тубулин","correct":false,"feedback":"α-тубулин обращён наружу на минус-конце"},{"id":"S2-L03-2","text":"На обоих концах одинаковые","correct":false,"feedback":"Тогда микротрубочка не была бы полярной"},{"id":"S2-L03-3","text":"β-тубулин","correct":true,"feedback":"Да: плюс-конец оканчивается β-тубулином, минус-конец — α-тубулином"}]},"widget":{"kind":"dna","title":"","s":{"title":"Микротрубочка","status":"Схема качественная · 25 нм","modes_label":"Что показать","modes":["трубка","разрез","протофиламент"],"args":[["mt",{"view":"side"}],["mt",{"view":"cross"}],["mt",{"view":"pf"}]],"notes":["Плюс-конец оканчивается β-тубулином","13 протофиламентов замкнуты в трубку — жёсткая структура","В β-тубулине ГТФ гидролизуется после встраивания, в α — нет"],"static":["Плюс-конец оканчивается β-тубулином"],"scene":"s2_t1a","L":{"s2_t1a_13":"13 протофиламентов","s2_t1a_25":"25 нм","s2_t1a_alpha_beta":"Гантели αβ-тубулина: α — тёмная, β — светлая; «Т» и «Д» — ГТФ и ГДФ в β-тубулине","s2_t1a_beta_end":"у плюс-конца — β-тубулин","s2_t1a_gtp_a":"α: ГТФ не гидролизуется","s2_t1a_gtp_b":"β: ГТФ → ГДФ после встраивания","s2_t1a_lumen":"полость","s2_t1a_pMt":"Микротрубочка: стенка из αβ-тубулина","s2_t1a_pf":"Протофиламент: димеры αβ-тубулина уложены «голова к хвосту»"}}},"exam_quiz":{"id":"S2-E05","question":"Что такое базальное тельце?","options":[{"id":"S2-E05-1","text":"Часть ядра","correct":false,"feedback":"Нет: базальное тельце лежит в цитоплазме, у основания реснички"},{"id":"S2-E05-2","text":"Структура в основании реснички, из которой растут её микротрубочки","correct":true,"feedback":"Да: оно происходит из центриоли"},{"id":"S2-E05-3","text":"Место прикрепления актина к мембране","correct":false,"feedback":"Нет: это структура из микротрубочек, от которой растут микротрубочки реснички"}]}},{"id":"intermediate-filaments","num":4,"section":0,"questions":[1],"title":"Почему у промежуточных филаментов нет полярности?","keywords":["Антипараллельный тетрамер","Кератины","Виментин","Аксон","Ламины","Десмосома"],"lead":["Белки промежуточных филаментов — вытянутые молекулы с α-спиральной средней частью. Две молекулы скручиваются в параллельный димер, а два димера укладываются навстречу друг другу в [[T12|антипараллельный тетрамер]]."],"mechanism":["В тетрамере ориентации двух димеров противоположны, и тетрамер с обоих концов одинаков. Из тетрамеров, уложенных бок о бок и конец к концу, собирается филамент около 10 нм. Поэтому у промежуточного филамента нет плюс- и минус-конца, и моторные белки по нему направленно не движутся. Субъединицы не несут АТФ или ГТФ. Сильные боковые связи делают филамент прочным: он сильно растягивается и не рвётся."],"paragraphs":["Промежуточные филаменты разных клеток собраны из разных белков: [[T13|кератины]] — в эпителии, [[T14|виментин]] — во многих клетках соединительной ткани, десмин — в мышечных, нейрофиламенты — в [[T52|аксонах]]; [[T15|ламины]] образуют сеть под внутренней мембраной ядра. Кератиновые сети соединены с межклеточными контактами — [[T16|десмосомами]] — и с контактами клетки с внеклеточным матриксом — [[T17|гемидесмосомами]]; так нагрузка распределяется по ткани. Промежуточные филаменты обновляются медленнее актина и микротрубочек, но не неподвижны: при делении клетки их белки [[T78|фосфорилируются]], и сеть быстро разбирается. <b>На практикуме.<\/b> Вкладка 1, шаг 1 и лупа на панели А.","<b>Ограничения.<\/b> «Неполярность» означает отсутствие направленности пути для моторов; это не значит, что молекулы в филаменте лишены ориентации.",{"details":"Дополнение (добровольно)","text":"Дефект кератина в базальных клетках эпидермиса приводит к тому, что кожа покрывается пузырями даже при слабом механическом воздействии — клетки разрываются. Пример иллюстрирует механизм, а не правило диагностики."}],"conditions":"","sources":["src_01"],"base":"БИО-2·2, БИО-2·3","quiz":{"id":"S2-L04","question":"Почему по промежуточному филаменту не может направленно двигаться моторный белок?","options":[{"id":"S2-L04-1","text":"Его концы одинаковы","correct":true,"feedback":"Да: нет различия «вперёд — назад», по которому мотор мог бы шагать в одну сторону"},{"id":"S2-L04-2","text":"Он слишком толстый для мотора","correct":false,"feedback":"Толщина не мешает: микротрубочка ещё толще, а моторы по ней движутся"},{"id":"S2-L04-3","text":"Он покрыт другими белками","correct":false,"feedback":"Не в этом причина: у промежуточных филаментов нет полярности как таковой"}]},"widget":{"kind":"dna","title":"","s":{"title":"Промежуточные филаменты","status":"Схема качественная","modes_label":"Что показать","modes":["сборка","белки в разных клетках","разборка при делении"],"args":[["assembly"],["classes"],["mitosis"]],"notes":["В тетрамере два димера уложены навстречу друг другу — концы одинаковы","Разные клетки — разные белки промежуточных филаментов","Фосфорилирование вызывает разборку сети"],"static":["В тетрамере два димера уложены навстречу друг другу — концы одинаковы"],"scene":"s2_r_if_assembly","L":{"s2_r_if_assembly_F":"Ф","s2_r_if_assembly_desm":"десмосомы","s2_r_if_assembly_dimer":"параллельный димер","s2_r_if_assembly_ecm":"внеклеточный матрикс","s2_r_if_assembly_endtoend":"конец к концу","s2_r_if_assembly_epi":"эпителиальная клетка","s2_r_if_assembly_fil":"филамент около 10 нм: нет плюс- и минус-конца","s2_r_if_assembly_hemi":"гемидесмосомы","s2_r_if_assembly_ker":"кератины","s2_r_if_assembly_lamina":"ламины","s2_r_if_assembly_mono":"мономер","s2_r_if_assembly_mono2":"головка — стержень — хвост","s2_r_if_assembly_net":"сеть промежуточных филаментов","s2_r_if_assembly_note":"Стрелки показывают ориентацию молекул: в тетрамере ориентации двух димеров противоположны, поэтому концы филамента одинаковы","s2_r_if_assembly_note2":"Разные клетки — разные белки промежуточных филаментов","s2_r_if_assembly_note3":"При делении клетки белки промежуточных филаментов фосфорилируются, и сеть быстро разбирается","s2_r_if_assembly_phos":"фосфорилирование","s2_r_if_assembly_r1a":"кератины","s2_r_if_assembly_r1b":"эпителий; связаны с десмосомами и гемидесмосомами","s2_r_if_assembly_r2a":"виментин","s2_r_if_assembly_r2b":"многие клетки соединительной ткани","s2_r_if_assembly_r3a":"десмин","s2_r_if_assembly_r3b":"мышечные клетки","s2_r_if_assembly_r4a":"нейрофиламенты","s2_r_if_assembly_r4b":"аксоны","s2_r_if_assembly_r5a":"ламины","s2_r_if_assembly_r5b":"сеть под внутренней мембраной ядра","s2_r_if_assembly_same":"концы одинаковы","s2_r_if_assembly_t":"Сборка промежуточного филамента","s2_r_if_assembly_t2":"Белки промежуточных филаментов в разных клетках","s2_r_if_assembly_t3":"Разборка сети при делении клетки","s2_r_if_assembly_tetra":"антипараллельный тетрамер","s2_r_if_assembly_tetra2":"димеры навстречу друг другу","s2_r_if_assembly_tetras":"тетрамеры","s2_r_if_assembly_ulf":"тетрамеры бок о бок"}},"zoomNarrow":true},"exam_quiz":{"id":"S2-E01","question":"Какие белки образуют промежуточные филаменты эпителиальных клеток?","options":[{"id":"S2-E01-1","text":"Кератины","correct":true,"feedback":"Да: кислые и основные кератины образуют пары"},{"id":"S2-E01-2","text":"Виментин","correct":false,"feedback":"Виментин — во многих клетках соединительной ткани"},{"id":"S2-E01-3","text":"Ламины","correct":false,"feedback":"Ламины — в ядре"}]}},{"id":"centrosome","num":5,"section":0,"questions":[1],"title":"Откуда растут микротрубочки: центросома, центриоли и другие центры организации","keywords":["Нуклеация","γ-Тубулиновый кольцевой комплекс (γ-TuRC)","Центросома","Центриоль","Перицентриолярный материал","Аппарат Гольджи"],"lead":["Новая микротрубочка не возникает в любом месте: её образование — [[T26|нуклеация]] — требует затравки. Её даёт [[T23|γ-тубулиновый кольцевой комплекс]] (γ-TuRC): кольцо из γ-тубулина и других белков повторяет расположение 13 протофиламентов, и на нём собирается минус-конец."],"mechanism":["Место, где сосредоточены такие комплексы и закреплены минус-концы, называют центром организации микротрубочек (ЦОМТ). В большинстве животных клеток главный ЦОМТ — [[T20|центросома]] у ядра: пара [[T21|центриолей]], расположенных под прямым углом, и окружающий их [[T22|перицентриолярный материал]], в котором и находятся кольца γ-TuRC. Микротрубочки растут не из стенки центриоли, а из этого материала. Центриоль — цилиндр из девяти триплетов микротрубочек."],"paragraphs":["Центросома — не единственный ЦОМТ. У высших растений центросом нет, а микротрубочки нуклеируются у оболочки ядра и у мембраны; в животных клетках ЦОМТ бывают на [[T79|аппарате Гольджи]], у апикальной поверхности эпителиальной клетки, на оболочке ядра мышечной клетки. Перед делением центросома удваивается, и две центросомы становятся полюсами [[T43|веретена деления]] (семинар 6). Центриоль может стать [[T24|базальным тельцем]], из которого растут микротрубочки [[T25|реснички]]. <b>На практикуме.<\/b> Вкладка 1, шаг 7: после удаления центриолей микротрубочки есть, но сеть хуже сфокусирована.","<b>Ограничения.<\/b> «Центросома» и «центриоль» — разные понятия: центриоль — часть центросомы."],"conditions":"","sources":["src_01","src_02"],"base":"БИО-2·3","quiz":{"id":"S2-L05","question":"Что непосредственно нуклеирует минус-конец микротрубочки в центросоме?","options":[{"id":"S2-L05-1","text":"Стенка самой центриоли из триплетов","correct":false,"feedback":"Триплеты центриоли — её собственные микротрубочки; цитоплазматические микротрубочки растут из колец γ-тубулина"},{"id":"S2-L05-2","text":"Кольца γ-тубулина вокруг центриолей","correct":true,"feedback":"Да: центриоли собирают этот материал вокруг себя"},{"id":"S2-L05-3","text":"Оболочка ядра рядом с центросомой","correct":false,"feedback":"Ядро рядом, но нуклеирует не оно; лишь в некоторых клетках ЦОМТ находится на оболочке ядра"}]},"widget":{"kind":"dna","title":"","s":{"title":"Центросома и центры организации микротрубочек","status":"Схема качественная","modes_label":"Что показать","modes":["центросома","центриоли удалены","эпителий"],"args":[["cent"],["nocent"],["epi"]],"notes":["Микротрубочки растут из колец γ-тубулина вокруг центриолей","Без центриолей микротрубочки есть, но сеть хуже сфокусирована","В эпителии главный ЦОМТ — у апикальной стороны"],"static":["Микротрубочки растут из колец γ-тубулина вокруг центриолей"],"scene":"s2_t1c","L":{"s2_t1c_apical":"апикальная сторона","s2_t1c_apical_mtoc":"минус-концы — у апикальной стороны","s2_t1c_basal":"базальная сторона","s2_t1c_cs":"центросома: две центриоли","s2_t1c_golgi":"аппарат Гольджи","s2_t1c_minus":"минус-конец — у кольца","s2_t1c_nocent":"центриоли удалены: γ-TuRC — на аппарате Гольджи и в цитоплазме","s2_t1c_pEpi":"Эпителиальная клетка: центр организации у апикальной стороны","s2_t1c_pV":"В. Центр организации микротрубочек","s2_t1c_pcm":"перицентриолярный материал","s2_t1c_turc":"фиолетовые кольца — γ-TuRC; из них растут микротрубочки"}}},"exam_quiz":{"id":"S2-E04","question":"Из чего построена центриоль?","options":[{"id":"S2-E04-1","text":"Из девяти триплетов микротрубочек","correct":true,"feedback":"Да"},{"id":"S2-E04-2","text":"Из 13 протофиламентов","correct":false,"feedback":"Это стенка одной микротрубочки"},{"id":"S2-E04-3","text":"Из актиновых филаментов","correct":false,"feedback":"Нет: центриоль построена из микротрубочек — девяти триплетов"}]}},{"id":"mechanics-shared","num":6,"section":0,"questions":[1],"title":"Как три системы делят механическую работу?","keywords":[],"lead":["Нагрузки, которые испытывает клетка, различны: растяжение, сжатие и изгиб, изменение формы поверхности, перенос груза. Каждая система лучше справляется со своей."],"mechanism":["Промежуточные филаменты главным образом сопротивляются растяжению и через десмосомы распределяют его по ткани. Микротрубочки жёсткие и выдерживают сжатие и изгиб, а главное — служат путями для транспорта. Актиновый кортекс связан с мембраной белками-адаптерами (семинар 1); вместе с миозином он создаёт натяжение поверхности и определяет её форму. Ни одна механическая функция не принадлежит только одной системе: снижение функции кортекса ослабляет устойчивость клетки, даже если промежуточные филаменты в норме."],"paragraphs":["<b>На практикуме.<\/b> Вкладка 1, панель Б и шаги 4–6: при сильно сниженной функции промежуточных филаментов нарушена устойчивость к растяжению; микротрубочек — перенос груза; актина — выпячивание, а устойчивость к растяжению ослаблена. Правило модели: у каждой нагрузки есть главная и вспомогательная система.","<b>Ограничения.<\/b> Правило «главная — вспомогательная» — учебное упрощение. Общей числовой шкалы прочности трёх систем нет."],"conditions":"","sources":["src_01"],"base":"БИО-2·1–2·4; вспомнить БИО-1·6 (кортикальный слой и белки, связывающие его с мембраной)","quiz":{"id":"S2-L06","question":"У клетки сильно снижена функция актинового кортекса, промежуточные филаменты в норме. Что с устойчивостью к растяжению в модели?","options":[{"id":"S2-L06-1","text":"Не изменилась","correct":false,"feedback":"Кортекс участвует в механике клетки; его снижение ослабляет устойчивость"},{"id":"S2-L06-2","text":"Нарушена","correct":false,"feedback":"Нарушение — при сильном снижении главной системы, то есть промежуточных филаментов"},{"id":"S2-L06-3","text":"Ослаблена","correct":true,"feedback":"Да: кортекс — вспомогательная система, главная — промежуточные филаменты"}]},"widget":{"kind":"dna","title":"","s":{"title":"Кто держит какую нагрузку","status":"Учебная модель · исходы качественные","modes_label":"Что показать","modes":["норма","ПФ снижены · растяжение","актин снижен · растяжение"],"args":[[null,"stretch"],["I","stretch"],["A","stretch"]],"notes":["Растяжение — сохранено, перенос — сохранено, выпячивание — сохранено","Растяжение — нарушено, перенос — сохранено, выпячивание — сохранено","Растяжение — ослаблено, перенос — сохранено, выпячивание — нарушено"],"static":["Растяжение — сохранено, перенос — сохранено, выпячивание — сохранено"],"scene":"s2_t1b","L":{"s2_t1b_cargo":"груз","s2_t1b_cell":"условная клетка","s2_t1b_desmo":"десмосомы","s2_t1b_free":"свободный край","s2_t1b_ind_cargo":"перенос груза","s2_t1b_ind_protrude":"выпячивание поверхности","s2_t1b_ind_stretch":"устойчивость к растяжению","s2_t1b_lamel":"ламеллиподия","s2_t1b_neighbors":"соседние клетки","s2_t1b_nuc":"ядро","s2_t1b_out_0":"нарушено","s2_t1b_out_1":"ослаблено","s2_t1b_out_2":"сохранено","s2_t1b_pB":"Б. Условная клетка на краю слоя: вид сверху","s2_t1b_pull":"растяжение","s2_t1b_reduced":"Функция {sys} сильно снижена: сеть редкая и бледная, но не исчезла","s2_t1b_sysname_A":"актиновых филаментов","s2_t1b_sysname_I":"промежуточных филаментов"}}},"exam_quiz":{"id":"S2-E03","question":"Что связывают десмосомы?","options":[{"id":"S2-E03-1","text":"Клетку и внеклеточный матрикс","correct":false,"feedback":"Это гемидесмосомы"},{"id":"S2-E03-2","text":"Микротрубочки с центросомой","correct":false,"feedback":"Это не связано с десмосомами"},{"id":"S2-E03-3","text":"Соседние клетки; к ним прикреплены промежуточные филаменты","correct":true,"feedback":"Да"}]}},{"id":"nucleus-squeeze","num":7,"section":0,"questions":[1],"title":"Как три системы вместе деформируют ядро и восстанавливают его форму, когда клетка протискивается сквозь ткань","keywords":[],"lead":["Клетки иммунной системы и опухолевые клетки проходят сквозь промежутки в тканях диаметром от 1 до 20 мкм. Ядро — самая крупная и жёсткая органелла клетки, и оно должно деформироваться."],"mechanism":["В деформации ядра участвуют все три системы. Актомиозин может проталкивать ядро сзади и сжимать его с боков; микротрубочки через центросому могут тянуть его вперёд. Какой механизм главный, зависит от типа клеток и обсуждается. Возврат ядра к прежней форме после деформации требует ламинов A/C — белков промежуточных филаментов ядра — и виментина — белка промежуточных филаментов цитоплазмы, а также белков, соединяющих ядерную оболочку с цитоскелетом."],"paragraphs":["Сильная деформация может приводить к временным разрывам ядерной оболочки и к повреждению ДНК. <b>Исследование 1 практикума<\/b> иллюстрирует ту же логику на учебной модели (это не доказательство): сочетание нагрузок выявляет сразу две ослабленные системы, а одну систему нельзя «усилить» вместо другой.","<b>Ограничения.<\/b> Данные получены в основном на культивируемых клетках в искусственных узких каналах; насколько часто разрывы оболочки происходят в тканях организма, изучено меньше.",{"details":"Как это узнали (добровольно)","text":"ядро в живой клетке деформировали и после снятия нагрузки следили, возвращается ли оно к прежней форме: без ламинов A/C, белков, связывающих оболочку ядра с цитоскелетом, или виментина возврат был хуже. Прохождение клеток сквозь узкие промежутки изучают, пропуская их через каналы известной ширины."}],"conditions":"","sources":["src_06"],"base":"БИО-2·4, БИО-2·6","level":"adv","next_base":"polymerization","quiz":{"id":"S2-L07","question":"Что, по этим данным, нужно ядру, чтобы вернуть форму после протискивания?","options":[{"id":"S2-L07-1","text":"Ламины A/C и виментин","correct":true,"feedback":"Да: обе группы — белки промежуточных филаментов, ядерных и цитоплазматических"},{"id":"S2-L07-2","text":"Только миозин II актомиозина","correct":false,"feedback":"Миозин сдавливает и проталкивает ядро, но упругий возврат формы обеспечивают другие белки"},{"id":"S2-L07-3","text":"Только микротрубочки от центросомы","correct":false,"feedback":"Микротрубочки тянут ядро вперёд; возврат формы с ними здесь не связан"}]},"widget":{"kind":"dna","title":"","s":{"title":"Ядро в узком промежутке","status":"Схема качественная · по обзорной работе","modes_label":"Что показать","modes":["перед каналом","в канале","после выхода","после выхода без ламинов A/C и виментина"],"args":[["before"],["inside"],["after"],["after_nolamin"]],"notes":["Ядро — самая крупная и жёсткая часть клетки","Актомиозин может сжимать ядро и проталкивать его сзади, микротрубочки — тянуть вперёд; какой механизм главный, зависит от типа клеток","Ламины A/C, белки связи с цитоскелетом и виментин возвращают ядру форму после снятия нагрузки","Без них форма не восстанавливается; возможны разрывы оболочки"],"static":["Ядро — самая крупная и жёсткая часть клетки"],"scene":"s2_r_nucleus","L":{"s2_r_nucleus_am":"актомиозин","s2_r_nucleus_debate":"Какой механизм главный — проталкивание или тяга, — зависит от типа клеток и обсуждается","s2_r_nucleus_dir":"направление движения клетки","s2_r_nucleus_gap":"промежуток 1–20 мкм","s2_r_nucleus_ifn":"ламины A/C и виментин","s2_r_nucleus_mtc":"микротрубочки и центросома","s2_r_nucleus_n1":"Ядро — самая крупная и жёсткая органелла клетки","s2_r_nucleus_nolam":"Без ламинов A/C и виментина форма не восстановлена","s2_r_nucleus_nolam2":"Возможен разрыв ядерной оболочки (красный значок)","s2_r_nucleus_nuc":"ядро","s2_r_nucleus_ok":"Ламины A/C и виментин есть: форма восстановлена","s2_r_nucleus_ok2":"Ламины A/C, белки связи ядерной оболочки с цитоскелетом и виментин возвращают ядру форму после снятия нагрузки","s2_r_nucleus_pull":"могут тянуть вперёд","s2_r_nucleus_push":"может проталкивать сзади","s2_r_nucleus_squeeze":"может сжимать с боков","s2_r_nucleus_t":"Ядро в узком промежутке ткани","s2_r_nucleus_wall":"стенки промежутка"}},"zoomNarrow":true}},{"id":"polymerization","num":8,"section":1,"questions":[2],"title":"Сборка полимера: свободный пул, полимеризация и нуклеация","keywords":["Полимеризация","Деполимеризация","Свободный пул субъединиц","Комплекс Arp2/3","Формины"],"lead":["[[T27|Полимеризация]] — присоединение субъединиц к концам полимера, [[T28|деполимеризация]] — их отделение. Субъединицы, не встроенные в полимер, составляют [[T29|свободный пул]]."],"mechanism":["Скорость присоединения к концу пропорциональна концентрации свободных субъединиц, а скорость отделения от концентрации не зависит. Поэтому при высокой концентрации полимер растёт, при низкой — укорачивается; концентрацию, при которой рост и укорочение уравновешены, называют критической. Начать новый полимер трудно: несколько субъединиц должны сначала собраться вместе. Поэтому в клетке нуклеацию обеспечивают специальные белки: для микротрубочек — γ-TuRC, для актина — [[T61|комплекс Arp2/3]] и [[T62|формины]] (тема 4)."],"paragraphs":["<b>На практикуме.<\/b> Вкладка 2, шаг 4: при высоком уровне свободного тубулина микротрубочка растёт быстрее.","<b>Ограничения.<\/b> Описание через критическую концентрацию строго верно для полимера без гидролиза нуклеотида; гидролиз делает поведение концов разным (БИО-2·10, БИО-2·13)."],"conditions":"","sources":["src_01"],"base":"БИО-2·2, БИО-2·3, БИО-2·5","quiz":{"id":"S2-L08","question":"Почему без специальных белков новые микротрубочки в клетке почти не образуются, хотя свободного тубулина много?","options":[{"id":"S2-L08-1","text":"Свободный тубулин не присоединяется к концам","correct":false,"feedback":"К концам существующих микротрубочек присоединяется"},{"id":"S2-L08-2","text":"Без затравки сборка нового полимера медленна","correct":true,"feedback":"Да: нуклеация — кинетический барьер; его снимает γ-TuRC"},{"id":"S2-L08-3","text":"Свободный тубулин не несёт ГТФ","correct":false,"feedback":"Свободный тубулин несёт ГТФ"}]},"widget":{"kind":"dna","title":"","s":{"title":"Полимеризация и нуклеация","status":"Схема качественная · единицы условные","modes_label":"Что показать","modes":["C ниже Cc","C выше Cc","нужна затравка"],"args":[[0.5],[2.0],["seed"]],"notes":["Ниже Cc отделение быстрее присоединения — полимер укорачивается","Выше Cc полимер растёт","Без затравки новый полимер почти не начинается: нуклеацию обеспечивает γ-TuRC"],"static":["Ниже Cc отделение быстрее присоединения — полимер укорачивается"],"scene":"s2_r_kinetics","L":{"s2_r_kinetics_cc":"критическая концентрация Cc","s2_r_kinetics_ch":"C выше Cc","s2_r_kinetics_cl":"C ниже Cc","s2_r_kinetics_grow":"растёт","s2_r_kinetics_grow2":"присоединение быстрее отделения","s2_r_kinetics_lim":"Строго верно для полимера без гидролиза нуклеотида; единицы условные","s2_r_kinetics_mini":"Полимер на этом уровне","s2_r_kinetics_noseed":"новый полимер не начинается","s2_r_kinetics_off":"отделение","s2_r_kinetics_on":"присоединение","s2_r_kinetics_seed":"нуклеация на γ-TuRC: микротрубочка растёт","s2_r_kinetics_shrink":"укорачивается","s2_r_kinetics_shrink2":"отделение быстрее присоединения","s2_r_kinetics_t":"Присоединение и отделение субъединиц","s2_r_kinetics_tube1":"без затравки","s2_r_kinetics_tube2":"с кольцом γ-TuRC","s2_r_kinetics_turc":"γ-TuRC","s2_r_kinetics_xl":"концентрация свободных субъединиц","s2_r_kinetics_yl":"скорость"}},"zoomNarrow":true}},{"id":"dynamic-instability","num":9,"section":1,"questions":[2],"title":"Динамическая нестабильность: рост, катастрофа, укорочение, спасение","keywords":["Динамическая нестабильность","Катастрофа микротрубочки","Спасение микротрубочки","Белки, ассоциированные с микротрубочками (MAP)","Белок спасения","Фактор катастроф"],"lead":["Отдельная микротрубочка при постоянной концентрации свободного тубулина то растёт, то быстро укорачивается. Такое поведение называют [[T30|динамической нестабильностью]]."],"mechanism":["Переход от роста к укорочению — [[T31|катастрофа]], от укорочения к росту — [[T32|спасение]]. Если спасения нет, микротрубочка укорачивается до минус-конца, и на том же месте может нуклеироваться новая. Переходы происходят в основном на плюс-конце; минус-конец обычно закреплён в ЦОМТ."],"paragraphs":["Частоту катастроф и спасений меняют концентрация свободного тубулина и [[T39|белки, ассоциированные с микротрубочками]]: одни стабилизируют стенку, [[T82|белки спасения]] прерывают укорочение, другие, например [[T38|факторы катастроф]] ([[T47|кинезины]] семейства 13), ускоряют переход к укорочению. <b>На практикуме.<\/b> Вкладка 2, шаги 1, 5, 6.","<b>Ограничения.<\/b> Термин «катастрофа» относится к одной микротрубочке; это не «митотическая катастрофа» — гибель клетки при сбое деления. Момент катастрофы случаен: две микротрубочки в одних условиях ведут себя по-разному."],"conditions":"","sources":["src_01"],"base":"БИО-2·8","quiz":{"id":"S2-L09","question":"Длина микротрубочки росла, затем быстро уменьшилась, но не до нуля, и снова начала расти. Как называется последний переход?","options":[{"id":"S2-L09-1","text":"Катастрофа","correct":false,"feedback":"Катастрофа — переход от роста к укорочению"},{"id":"S2-L09-2","text":"Нуклеация","correct":false,"feedback":"Нуклеация — начало новой микротрубочки с нуля, а эта не разобралась до конца"},{"id":"S2-L09-3","text":"Спасение","correct":true,"feedback":"Да: переход от укорочения к росту до полной разборки"}]},"widget":{"kind":"dna","title":"","s":{"title":"Динамическая нестабильность одной микротрубочки","status":"Учебная модель · условные единицы","modes_label":"Что показать","modes":["средний тубулин","+ фактор катастроф","+ белок спасения"],"args":[["mid",0,0,0],["mid",1,0,0],["mid",0,1,0]],"notes":["2 катастрофы, 0 спасений, 2 полные разборки; средняя длина 3,18","4 катастрофы, 4 полные разборки и новые нуклеации; средняя длина 1,10","3 катастрофы и 3 спасения, полных разборок нет; средняя длина 7,22"],"static":["2 катастрофы, 0 спасений, 2 полные разборки; средняя длина 3,18"],"scene":"s2_t2a","L":{"s2_t2a_ev_cat":"катастрофа","s2_t2a_ev_loss":"полная разборка","s2_t2a_ev_renuc":"новая нуклеация","s2_t2a_ev_res":"спасение","s2_t2a_f_catf":"фактор катастроф","s2_t2a_f_none":"факторов нет, ГТФ гидролизуется","s2_t2a_f_res":"белок спасения","s2_t2a_grow":"рост","s2_t2a_leg":"Переходы:","s2_t2a_mini":"Микротрубочка от центра нуклеации","s2_t2a_mini_t":"t = {t}: длина {L}","s2_t2a_pA":"А. График длины одной микротрубочки","s2_t2a_rd1":"Катастроф: {c} · спасений: {r} · полных разборок: {l}","s2_t2a_rd2":"Наибольшая длина: {mx} · средняя за 24 у.е.в.: {mean} (у.е.д.)","s2_t2a_shrink":"укорочение","s2_t2a_tub":"Свободный тубулин","s2_t2a_tub_mid":"средний","s2_t2a_x":"время, у.е.в.","s2_t2a_y":"длина, у.е.д."}},"zoomNarrow":true}},{"id":"gtp-cap","num":10,"section":1,"questions":[2],"title":"ГТФ-шапочка: почему растущий конец устойчив","keywords":["ГТФ-шапочка"],"lead":["Тубулин присоединяется к плюс-концу как ГТФ-тубулин, а гидролиз ГТФ до ГДФ в β-тубулине происходит позже. Пока присоединение опережает гидролиз, у конца остаётся участок ГТФ-тубулина — [[T33|ГТФ-шапочка]]."],"mechanism":["ГДФ-тубулин в стенке удерживается прямым только боковыми связями с соседями; в свободном состоянии он изогнут. Пока на конце есть ГТФ-шапочка, присоединившиеся субъединицы встраиваются в стенку, выпрямляются и прочно связываются с соседями (короткие концы протофиламентов у растущего конца слегка отогнуты). Если гидролиз догоняет конец, протофиламенты из ГДФ-тубулина изгибаются наружу и быстро распадаются: от конца с ГДФ-тубулином субъединицы уходят (в экспериментах в пробирке) примерно в 100 раз быстрее, чем от конца с ГТФ-тубулином. Энергия гидролиза запасена в напряжённой стенке и освобождается при разборке."],"paragraphs":["Отсюда два следствия. Быстрый рост (много свободного тубулина) уменьшает вероятность катастрофы. Гидролиз необходим для динамической нестабильности: микротрубочки из тубулина с негидролизуемым аналогом ГТФ почти не разбираются; но катастрофа не следует автоматически за каждым гидролизом — важно соотношение скоростей. <b>На практикуме.<\/b> Вкладка 2, шаги 2, 3, 4, 7 и панель Б.","<b>Ограничения.<\/b> ГТФ-шапочка — функциональная модель состояния конца, а не постоянная структура: её размер меняется, и что именно на уровне структуры запускает катастрофу, до конца не установлено."],"conditions":"","sources":["src_01","src_04"],"base":"БИО-2·3, БИО-2·9","quiz":{"id":"S2-L10","question":"Почему микротрубочка из тубулина с негидролизуемым аналогом ГТФ почти не укорачивается?","options":[{"id":"S2-L10-1","text":"В стенке нет ГДФ-тубулина","correct":true,"feedback":"Да: без гидролиза конец не теряет защиту"},{"id":"S2-L10-2","text":"Аналог мешает тубулину присоединяться к концу","correct":false,"feedback":"Присоединение идёт: такие микротрубочки растут. Причина устойчивости — в стенке нет ГДФ-тубулина"},{"id":"S2-L10-3","text":"Аналог прикрепляет её к центросоме","correct":false,"feedback":"Аналог действует на сами субъединицы, а не на связь с ЦОМТ"}],"rev":2},"widget":{"kind":"dna","title":"","s":{"title":"ГТФ-шапочка","status":"Схема качественная · ГТФ-шапочка — функциональная модель","modes_label":"Что показать","modes":["рост","катастрофа","ГТФ не гидролизуется"],"args":[["grow"],["shrink"],["nohydro"]],"notes":["У растущего конца — участок ГТФ-тубулина; субъединицы встраиваются и выпрямляются","Шапочки нет: протофиламенты из ГДФ-тубулина изгибаются, субъединицы уходят (в экспериментах в пробирке) примерно в 100 раз быстрее","Без гидролиза ГДФ-тубулина нет — катастроф нет"],"static":["У растущего конца — участок ГТФ-тубулина; субъединицы встраиваются и выпрямляются"],"scene":"s2_t2b","L":{"s2_t2b_cap":"ГТФ-шапочка","s2_t2b_h_3":"Пока присоединение опережает гидролиз, у конца сохраняется участок ГТФ-тубулина","s2_t2b_h_5":"Субъединицы ГДФ-тубулина быстро отделяются — укорочение","s2_t2b_h_nohydro":"ГТФ не гидролизуется: вся стенка — ГТФ-тубулин, ГДФ-тубулина нет","s2_t2b_inset":"длина во времени","s2_t2b_leave":"ГДФ-тубулин отделяется","s2_t2b_lg_ab":"Гантель — димер αβ-тубулина: α — тёмная, β — светлая; буква — нуклеотид в β-тубулине","s2_t2b_lg_gdp":"ГДФ-тубулин (Д)","s2_t2b_lg_gtp":"ГТФ-тубулин (Т)","s2_t2b_minus":"к минус-концу","s2_t2b_pB":"Б. Плюс-конец: фрагмент стенки из 5 протофиламентов","s2_t2b_plus":"плюс-конец"}}},"exam_quiz":{"id":"S2-E06","question":"Какой нуклеотид несёт тубулин?","options":[{"id":"S2-E06-1","text":"АТФ","correct":false,"feedback":"АТФ несёт актин"},{"id":"S2-E06-2","text":"Никакого","correct":false,"feedback":"Это белки промежуточных филаментов"},{"id":"S2-E06-3","text":"ГТФ","correct":true,"feedback":"Да"}]}},{"id":"length-plot","num":11,"section":1,"questions":[2],"title":"Как читать график длины микротрубочки","keywords":[],"lead":["График длины от времени — главный способ описать поведение одной микротрубочки."],"mechanism":["Положительный наклон — рост, отрицательный — укорочение; крутизна наклона — скорость. Вершина, после которой длина падает, — катастрофа; минимум выше нуля, после которого длина растёт, — спасение; участок на нуле и начало роста от нуля — полная разборка и новая нуклеация. Наклон при укорочении обычно круче, чем при росте."],"paragraphs":["По одному графику можно определить не только переходы, но и средние величины: скорость роста, частоту катастроф (число катастроф за время роста), долю времени в росте. <b>На практикуме.<\/b> Вкладка 2, панель А: средний уровень тубулина — 2 катастрофы за 24 у.е.в., наибольшая длина 9,0, средняя 3,18 у.е.д.; с белком спасения — 3 спасения, полных разборок нет, средняя длина 7,22.","<b>Ограничения.<\/b> Числа модели условные; в клетке скорости и частоты различаются в разных типах клеток и в разных участках одной клетки."],"conditions":"","sources":["src_01"],"base":"БИО-2·9, БИО-2·10","quiz":{"id":"S2-L11","question":"На графике длина 5 у.е.в. росла с наклоном +1, затем 1 у.е.в. падала с наклоном −3, затем снова росла. Сколько переходов произошло?","options":[{"id":"S2-L11-1","text":"Один: катастрофа","correct":false,"feedback":"После укорочения рост возобновился — это второй переход"},{"id":"S2-L11-2","text":"Два: катастрофа и спасение","correct":true,"feedback":"Да: рост → укорочение → рост"},{"id":"S2-L11-3","text":"Ни одного: это обычные колебания длины","correct":false,"feedback":"Смена знака наклона — это и есть переходы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как читать график длины","status":"Учебная модель · условные единицы","modes_label":"Что показать","modes":["средний","высокий тубулин","белок спасения"],"args":[["mid",0,0,0,1],["high",0,0,0,1],["mid",0,1,0,1]],"notes":["Наибольшая длина 9,0; катастрофы при t = 6 и 19","1 катастрофа (t = 9); наибольшая длина 13,5; средняя 6,06","3 спасения; наибольшая длина 12,0; средняя 7,22"],"static":["Наибольшая длина 9,0; катастрофы при t = 6 и 19"],"scene":"s2_t2a","L":{"s2_t2a_ev_cat_t":"катастрофа, t = {t}","s2_t2a_ev_loss":"полная разборка","s2_t2a_ev_renuc":"новая нуклеация","s2_t2a_ev_res":"спасение","s2_t2a_ev_t":"t = {t}","s2_t2a_f_none":"факторов нет, ГТФ гидролизуется","s2_t2a_f_res":"белок спасения","s2_t2a_max":"наибольшая длина {v}","s2_t2a_mean":"средняя длина {v}","s2_t2a_pA":"А. График длины одной микротрубочки","s2_t2a_rd1":"Катастроф: {c} · спасений: {r} · полных разборок: {l}","s2_t2a_rd2":"Наибольшая длина: {mx} · средняя за 24 у.е.в.: {mean} (у.е.д.)","s2_t2a_slope":"наклон {v}","s2_t2a_tub":"Свободный тубулин","s2_t2a_tub_high":"высокий","s2_t2a_tub_mid":"средний","s2_t2a_x":"время, у.е.в.","s2_t2a_y":"длина, у.е.д."}},"zoomNarrow":true}},{"id":"why-unstable","num":12,"section":1,"questions":[2],"title":"Зачем клетке полимер, который разбирается","keywords":["Колхицин","Таксол (паклитаксел)"],"lead":["Динамическая нестабильность кажется расточительной, но именно она позволяет сети микротрубочек быстро меняться."],"mechanism":["Каждая растущая микротрубочка проходит в одном из направлений; если её плюс-конец встречает структуру, которая его связывает и защищает, микротрубочка сохраняется, а остальные разбираются и начинаются снова, возможно в других направлениях. Так сеть может перестраиваться: при делении клетки за минуты разбирается интерфазная сеть и собирается веретено (семинар 6); при поляризации клетки микротрубочки стабилизируются в одном направлении."],"paragraphs":["Вещества, нарушающие динамику, останавливают такие перестройки. [[T42|Колхицин]] и нокодазол разбирают микротрубочки, [[T41|таксол]] их стабилизирует; и те и другие останавливают деление клеток. Это показывает, что функция микротрубочек зависит от их динамики, а не только от наличия. <b>На практикуме.<\/b> Вкладка 2, шаг 5: фактор катастроф укорачивает микротрубочки, но чаще начинаются новые.","<b>Ограничения.<\/b> Стабилизация «найденной» микротрубочки — модель; в клетке направление роста определяют и другие механизмы."],"conditions":"","sources":["src_01"],"base":"БИО-2·9–2·11","quiz":{"id":"S2-L12","question":"Почему для сборки веретена деления микротрубочки должны уметь и расти, и укорачиваться?","options":[{"id":"S2-L12-1","text":"Иначе микротрубочки потеряют полярность","correct":false,"feedback":"Полярность от динамики не зависит"},{"id":"S2-L12-2","text":"Укорочение нужно, чтобы удвоить центросому","correct":false,"feedback":"Центросома удваивается независимо от укорочения микротрубочек"},{"id":"S2-L12-3","text":"Сеть должна разобраться и собраться заново","correct":true,"feedback":"Да: интерфазная сеть разбирается, и из тех же субъединиц собирается веретено"}]},"widget":{"kind":"dna","title":"","s":{"title":"Зачем микротрубочкам разборка","status":"Схема качественная","modes_label":"Что показать","modes":["динамичная сеть","конец захвачен","таксол"],"args":[["dyn"],["capture"],["taxol"]],"notes":["Каждая растущая микротрубочка проходит в одном из направлений","Захваченная микротрубочка сохраняется, остальные перестраиваются","Стабилизированная сеть не перестраивается: захваченных и незахваченных микротрубочек уже не различить по устойчивости"],"static":["Каждая растущая микротрубочка проходит в одном из направлений"],"scene":"s2_r_capture","L":{"s2_r_capture_cap":"захвачена, стабилизирована","s2_r_capture_grow":"растёт","s2_r_capture_minus":"минус-концы — у центросомы","s2_r_capture_nore":"перестройки нет","s2_r_capture_shrink":"укорачивается","s2_r_capture_struct":"стабилизирующая структура","s2_r_capture_t":"Сеть микротрубочек перестраивается","s2_r_capture_tab":"Колхицин, нокодазол — разборка микротрубочек; таксол — стабилизация"}},"zoomNarrow":true}},{"id":"instability-vs-treadmilling","num":13,"section":1,"questions":[2],"title":"Динамическая нестабильность и тредмиллинг — разные процессы","keywords":["Тредмиллинг"],"lead":["Оба типа поведения связаны с гидролизом нуклеотида, но выглядят по-разному."],"mechanism":["При [[T40|тредмиллинге]] субъединицы присоединяются к плюс-концу и с той же скоростью отделяются от минус-конца: длина постоянна, а каждая субъединица проходит через полимер от плюс-конца к минус-концу. При динамической нестабильности один конец резко переходит от роста к укорочению и обратно. Тредмиллинг особенно характерен для актина, динамическая нестабильность — для микротрубочек."],"paragraphs":["<b>На практикуме.<\/b> Вкладка 2, шаг 8 и панель В: слева — график микротрубочки, справа — полимер постоянной длины с помеченной субъединицей.","<b>Ограничения.<\/b> Микротрубочки в определённых условиях тоже могут проявлять тредмиллинг, а актиновые филаменты — резкие переходы; «характерен» не значит «единственный»."],"conditions":"","sources":["src_01"],"base":"БИО-2·2, БИО-2·9","quiz":{"id":"S2-L13","question":"Длина полимера постоянна, но помеченная субъединица смещается от одного конца к другому. Что это?","options":[{"id":"S2-L13-1","text":"Тредмиллинг","correct":true,"feedback":"Да: поток субъединиц при постоянной длине"},{"id":"S2-L13-2","text":"Динамическая нестабильность","correct":false,"feedback":"Она проявляется изменениями длины"},{"id":"S2-L13-3","text":"Полимер неподвижен и не обновляется","correct":false,"feedback":"Смещение метки показывает обновление"}]},"widget":{"kind":"dna","title":"","s":{"title":"Динамическая нестабильность и тредмиллинг","status":"Схема качественная","modes_label":"Что показать","modes":["микротрубочка","тредмиллинг актина"],"args":[["mt"],["tread"]],"notes":["Длина резко меняется: рост, катастрофа, укорочение","Длина 10 постоянна; метка проходит от плюс-конца к минус-концу за 10 у.е.в."],"static":["Длина резко меняется: рост, катастрофа, укорочение"],"scene":"s2_t2c","L":{"s2_t2a_ev_cat":"катастрофа","s2_t2a_ev_loss":"полная разборка","s2_t2a_ev_renuc":"новая нуклеация","s2_t2a_grow":"рост","s2_t2a_shrink":"укорочение","s2_t2a_x":"время, у.е.в.","s2_t2a_y":"длина, у.е.д.","s2_t2c_exit":"метка вышла, t = 10","s2_t2c_in":"присоединение","s2_t2c_lab_pos":"метка: расстояние от плюс-конца","s2_t2c_left":"Микротрубочка: динамическая нестабильность","s2_t2c_len":"длина 10 — постоянна","s2_t2c_note_mt":"Длина резко меняется: рост, катастрофа, укорочение","s2_t2c_note_tread":"Длина 10 постоянна; метка проходит от плюс-конца к минус-концу за 10 у.е.в.","s2_t2c_out":"уход","s2_t2c_pV":"В. Два типа поведения полимера","s2_t2c_right":"Актиновый филамент: тредмиллинг"}}}},{"id":"eb1-condensate","num":14,"section":1,"questions":[2],"title":"Белок плюс-конца регулирует динамику, собираясь в конденсат","keywords":["Белки плюс-конца (+TIP)","EB1","Конденсат"],"lead":["На растущем плюс-конце собираются [[T36|белки плюс-конца]]. Один из главных — [[T37|EB1]]: он узнаёт участок стенки у самого конца и привлекает другие белки."],"mechanism":["Было известно, что EB1 ускоряет рост микротрубочек и повышает частоту катастроф, то есть делает конец динамичнее. Эксперименты показали, что для этого EB1 должен образовать у конца скопление без мембраны — [[T44|конденсат]], в котором концентрируются тубулин и другие белки плюс-конца. Мутантный EB1, не способный образовывать конденсаты, почти не накапливался на растущем конце и не регулировал его динамику; в делящихся клетках с таким белком перемещение хромосом было нарушено."],"paragraphs":["Вывод: динамичность конца не «случается», а регулируется белками, причём один и тот же белок может ускорять и рост, и переход к укорочению. Это согласуется с исследованием 2 практикума: динамичная сеть может быть эффективнее стабильной.","<b>Ограничения.<\/b> Эксперименты выполнены в пробирке и на культивируемых клетках; как конденсат EB1 работает в разных тканях, неизвестно.",{"details":"Как это узнали (добровольно)","text":"сравнивали обычный EB1 и белок с заменёнными аминокислотами, который не собирается в конденсаты."}],"conditions":"","sources":["src_04"],"base":"БИО-2·9, БИО-2·10","level":"adv","next_base":"motor-cycle","quiz":{"id":"S2-L14","question":"Что нового показали эксперименты с EB1?","options":[{"id":"S2-L14-1","text":"EB1 предотвращает катастрофы","correct":false,"feedback":"Нормальный EB1, наоборот, повышает их частоту"},{"id":"S2-L14-2","text":"Регуляции нужен конденсат EB1","correct":true,"feedback":"Да: EB1 без конденсата почти не накапливается на растущем конце и не меняет рост и частоту катастроф"},{"id":"S2-L14-3","text":"EB1 нуклеирует микротрубочки","correct":false,"feedback":"Нуклеирует γ-TuRC; EB1 работает на растущем конце"}]},"widget":{"kind":"dna","title":"","s":{"title":"Конденсат EB1 на плюс-конце","status":"Схема качественная · по экспериментальной работе","modes_label":"Что показать","modes":["без EB1","EB1","EB1 без конденсата"],"args":[["none"],["eb1"],["mut"]],"notes":["Конец без белков плюс-конца","EB1 концентрирует тубулин и белки у конца: рост быстрее, катастрофы чаще","Без конденсата EB1 хуже следует за концом и не регулирует его динамику"],"static":["Конец без белков плюс-конца"],"scene":"s2_r_eb1","L":{"s2_r_eb1_bare":"конец без белков плюс-конца","s2_r_eb1_cat":"частота катастроф ↑","s2_r_eb1_cond":"конденсат EB1: без мембраны","s2_r_eb1_inside":"в конденсате — EB1, тубулин и другие белки плюс-конца","s2_r_eb1_mt":"микротрубочка","s2_r_eb1_mut":"EB1 без конденсата: конец не регулируется","s2_r_eb1_note":"Схема качественная: по экспериментальной работе, без чисел","s2_r_eb1_t":"Белок EB1 на плюс-конце","s2_r_eb1_vg":"скорость роста ↑"}}}},{"id":"search-optimum","num":15,"section":1,"questions":[2],"title":"Достижение мишени: почему максимальная динамика не всегда лучше","keywords":["Мишень"],"lead":["Исследование 2 практикума моделирует, как 8 микротрубочек, растущих от одного центра, достигают [[T75|мишени]] на расстоянии 10 условных единиц за 60 единиц времени."],"mechanism":["Стабильная сеть достигает мишени, только если в начале одна из микротрубочек уже направлена к ней: так в 65 % условных клеток (прогонов модели). Сеть средней динамики после катастроф начинает микротрубочки в новых направлениях и достигает мишени в 83 % условных клеток. При очень частых катастрофах микротрубочки остаются короткими, и доля падает до 23 %. Если мишень вдвое дальше, преимущество динамики исчезает: стабильная сеть и сеть с низкой динамикой достигают мишени одинаково часто (около 65 %), средняя — в 53 %, высокая — в 10 %."],"paragraphs":["Нужно различать три показателя: вероятность достижения мишени, время достижения и устойчивость контакта после него. Стабильная сеть, когда достигает мишени, делает это быстрее (10 против 20 единиц времени), но реже. Поэтому одна и та же доля достижения у двух клеток может получиться при разной частоте катастроф, если различаются расстояние до мишени, скорость роста или спасения.","<b>Ограничения.<\/b> Вероятности катастроф и спасений в модели учебные; модель плоская и не учитывает, что клетка может направлять рост микротрубочек."],"conditions":"","sources":["src_01"],"base":"БИО-2·12","level":"adv","next_base":"motor-cycle","quiz":{"id":"S2-L15","question":"Почему при очень частых катастрофах мишень достигается реже, хотя направления перебираются быстрее?","options":[{"id":"S2-L15-1","text":"Новые микротрубочки начинаются только в старых направлениях","correct":false,"feedback":"В модели новое направление выбирается случайно"},{"id":"S2-L15-2","text":"Катастрофы уничтожают мишень","correct":false,"feedback":"Мишень от катастроф не зависит"},{"id":"S2-L15-3","text":"Микротрубочки разбираются раньше, чем дорастают до мишени","correct":true,"feedback":"Да: перебор направлений есть, а длины не хватает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Достижение мишени","status":"Учебная модель · 4000 условных клеток, начальное число генератора 2","modes_label":"Что показать","modes":["стабильная","средняя","очень высокая","средняя, мишень на 20"],"args":[[0,0,10],[0.08,0.1,10],[0.35,0,10],[0.08,0.1,20]],"notes":["Мишень достигнута в 65 % клеток; среднее время 10,0","83 %; 19,6","23 %; 32,5","53 %; 31,9; при этой мишени стабильная и низкодинамичная сети — около 65 %"],"static":["Мишень достигнута в 65 % клеток; среднее время 10,0"],"scene":"s2_a2","L":{"s2_a2_P_l":"доля клеток, где мишень достигнута за 60 единиц времени","s2_a2_clip":"рост за пределами рисунка не показан","s2_a2_cond_s":"мишень на расстоянии {d}, рост {v}","s2_a2_empty":"направлений без микротрубочек: {n}","s2_a2_legend":"Зелёная — растёт, оранжевая — укорачивается; флажок — мишень; серый пунктир — пустое направление","s2_a2_pA":"Центр нуклеации, 8 направлений и мишень","s2_a2_sum_t":"Итог по 4000 условным клеткам (прогонам модели)","s2_a2_t_l":"среднее время достижения среди достигших","s2_a2_time":"время: {t} из 60"}}}},{"id":"motor-cycle","num":16,"section":2,"questions":[3],"title":"Моторный белок: как энергия АТФ превращается в шаг","keywords":["Груз","Кинезин-1","Цитоплазматический динеин","мРНК"],"lead":["Моторный белок связывается с филаментом и, гидролизуя АТФ, меняет форму так, что перемещается вдоль филамента и переносит прикреплённый к нему [[T50|груз]]."],"mechanism":["По микротрубочкам движутся кинезины и динеины, по актиновым филаментам — миозины. [[T48|Кинезин-1]] имеет две головки: они поочерёдно связываются с микротрубочкой, и каждый цикл связывания, гидролиза АТФ и отделения переносит заднюю головку вперёд («шаг за шагом»). [[T49|Цитоплазматический динеин]] — крупный белок, не родственный кинезинам; его головка — кольцо, связанное с микротрубочкой стебельком."],"paragraphs":["Моторы переносят везикулы, органеллы, [[T72|мРНК]] и белковые комплексы, а также сдвигают микротрубочки относительно друг друга. Без АТФ моторы не шагают. <b>На практикуме.<\/b> Вкладка 3, панель А и шаг 6.","<b>Ограничения.<\/b> Скорость движения и размер шага в модели условные."],"conditions":"","sources":["src_01","src_05"],"base":"БИО-2·2, БИО-2·3","quiz":{"id":"S2-L16","question":"Что происходит с моторами кинезином-1 и динеином при резком снижении АТФ в клетке?","options":[{"id":"S2-L16-1","text":"Оба перестают шагать","correct":true,"feedback":"Да: оба — АТФазы"},{"id":"S2-L16-2","text":"Останавливается только кинезин","correct":false,"feedback":"Динеин тоже использует АТФ"},{"id":"S2-L16-3","text":"Оба меняют направление","correct":false,"feedback":"Нехватка АТФ не меняет направление"}]},"widget":{"kind":"dna","title":"","s":{"title":"Шаг моторного белка","status":"Схема качественная","modes_label":"Что показать","modes":["шаг: отделение задней головки и связывание АТФ","шаг: перенос и связывание","динеин","нет АТФ"],"args":[["p12"],["p34"],["dynein"],["noatp"]],"notes":["Задняя головка после гидролиза АТФ отделилась; передняя, связанная с микротрубочкой, связывает АТФ","Изменение формы передней головки переносит заднюю вперёд, к плюс-концу; она связывается впереди — шаг сделан","Динеин: кольцо головки, стебелёк к микротрубочке; движение к минус-концу","АТФ нет: мотор связан с микротрубочкой одной головкой и не шагает"],"static":["Задняя головка после гидролиза АТФ отделилась; передняя, связанная с микротрубочкой, связывает АТФ"],"scene":"s2_r_kinesin_step","L":{"s2_r_kinesin_step_adp":"АДФ","s2_r_kinesin_step_atp":"АТФ","s2_r_kinesin_step_front":"передняя головка","s2_r_kinesin_step_noatp":"АТФ нет: мотор связан с микротрубочкой одной головкой и не шагает","s2_r_kinesin_step_ph1":"1. Задняя головка после гидролиза АТФ и ухода фосфата отделилась","s2_r_kinesin_step_ph2":"2. Передняя головка, связанная с микротрубочкой, связывает АТФ","s2_r_kinesin_step_ph3":"3. Изменение формы передней головки переносит заднюю вперёд","s2_r_kinesin_step_ph4":"4. Головка связалась впереди и отдала АДФ — шаг сделан","s2_r_kinesin_step_rear":"задняя головка","s2_r_kinesin_step_ring":"динеин: кольцо головки","s2_r_kinesin_step_stalk":"стебелёк","s2_r_kinesin_step_t":"Шаг моторного белка","s2_r_kinesin_step_tominus":"к минус-концу","s2_r_kinesin_step_toplus":"к плюс-концу"}},"zoomNarrow":true}},{"id":"motor-direction","num":17,"section":2,"questions":[3],"title":"Направление мотора задаёт полярность микротрубочки","keywords":[],"lead":["Каждый мотор движется к определённому концу микротрубочки."],"mechanism":["Кинезин-1 и большинство кинезинов движутся к плюс-концу; цитоплазматический динеин — к минус-концу. Есть и кинезины, движущиеся к минус-концу (семейство 14), и кинезины, которые не переносят груз, а разбирают концы микротрубочек (семейство 13). Поэтому фраза «кинезин движется к плюс-концу» верна для определённого кинезина, и в задачах нужно указывать, о каком моторе речь. Миозины, кроме одного (миозина VI), движутся к плюс-концу актинового филамента."],"paragraphs":["Если микротрубочку повернуть, мотор пойдёт в другую сторону пространства — но по-прежнему к тому же концу. <b>На практикуме.<\/b> Вкладка 3, шаги 1–2.","<b>Ограничения.<\/b> На одном грузе в клетке часто есть и кинезины, и динеины; какой из них активен, регулируют белки-адаптеры."],"conditions":"","sources":["src_01","src_05"],"base":"БИО-2·3, БИО-2·16","quiz":{"id":"S2-L17","question":"Почему нельзя сказать «все кинезины движутся к плюс-концу»?","options":[{"id":"S2-L17-1","text":"Кинезины движутся в случайном направлении","correct":false,"feedback":"Каждый кинезин движется в определённом направлении"},{"id":"S2-L17-2","text":"Есть кинезины, движущиеся к минус-концу","correct":true,"feedback":"Да: например, кинезины семейства 14"},{"id":"S2-L17-3","text":"Кинезины движутся по актину","correct":false,"feedback":"Кинезины движутся по микротрубочкам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Направление моторных белков","status":"Схема качественная","modes_label":"Что показать","modes":["моторы микротрубочек","моторы актина","микротрубочка повёрнута"],"args":[["mt"],["actin"],["flip"]],"notes":["Большинство кинезинов — к плюс-концу; кинезин-14 и динеин — к минус-концу","Почти все миозины — к плюс-концу; миозин VI — к минус-концу","Повернули путь — повернулись и стрелки: направление к концу не изменилось"],"static":["Большинство кинезинов — к плюс-концу; кинезин-14 и динеин — к минус-концу"],"scene":"s2_r_motor_families","L":{"s2_r_motor_families_dyn":"динеин","s2_r_motor_families_k1":"кинезин-1","s2_r_motor_families_k13":"кинезин-13","s2_r_motor_families_k13b":"разбирает конец","s2_r_motor_families_k14":"кинезин-14","s2_r_motor_families_m2":"миозин II","s2_r_motor_families_m6":"миозин VI","s2_r_motor_families_n1":"Большинство кинезинов — к плюс-концу; кинезин-14 и динеин — к минус-концу","s2_r_motor_families_n2":"Почти все миозины — к плюс-концу актинового филамента; миозин VI — к минус-концу","s2_r_motor_families_n3":"Путь повёрнут: стрелки повернулись вместе с ним, но каждый мотор идёт к тому же концу","s2_r_motor_families_t":"К какому концу движется мотор","s2_r_motor_families_tominus":"к минус-концу","s2_r_motor_families_toplus":"к плюс-концу"}},"zoomNarrow":true}},{"id":"mt-orientation","num":18,"section":2,"questions":[3],"title":"Как ориентированы микротрубочки в разных клетках","keywords":["Лизосома","Дендрит","Апикальная и базальная стороны"],"lead":["Ориентация микротрубочек — свойство клетки, а не мотора."],"mechanism":["В клетке соединительной ткани в культуре микротрубочки расходятся от центросомы, плюс-концы — на периферии: кинезин-1 везёт груз — например, [[T81|лизосомы]] — к периферии, динеин — к центру. В аксоне нейрона все микротрубочки обращены плюс-концом к окончанию: кинезины переносят белки и мембранные компоненты из тела нейрона к синапсам, динеин — обратно. В [[T53|дендритах]] нейронов млекопитающих микротрубо
