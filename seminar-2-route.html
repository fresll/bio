чки лежат в обеих ориентациях. В эпителиальной клетке микротрубочки идут вертикально: минус-концы у [[T54|апикальной стороны]], плюс-концы у базальной."],"paragraphs":["Аксон человека может достигать метра в длину, поэтому направленный транспорт по нему особенно важен. <b>На практикуме.<\/b> Вкладка 3, шаги 3–5.","<b>Ограничения.<\/b> Каждая микротрубочка аксона короче аксона; пути состоят из многих перекрывающихся микротрубочек одной ориентации."],"conditions":"","sources":["src_01","src_02"],"base":"БИО-2·5, БИО-2·17","quiz":{"id":"S2-L18","question":"В эпителиальной клетке груз на кинезине-1. Куда он будет перемещаться?","options":[{"id":"S2-L18-1","text":"К апикальной стороне","correct":false,"feedback":"Там минус-концы: туда везёт динеин"},{"id":"S2-L18-2","text":"К центросоме у ядра","correct":false,"feedback":"К минус-концам кинезин-1 не движется"},{"id":"S2-L18-3","text":"К базальной стороне","correct":true,"feedback":"Да: там плюс-концы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Ориентация микротрубочек в разных клетках","status":"Схема качественная","modes_label":"Что показать","modes":["клетка соединительной ткани","нейрон: аксон","эпителий","дендрит"],"args":[["fib"],["axon"],["epi"],["dendrite",0.5]],"notes":["Кинезин-1 → к периферии; динеин → к центру","Кинезин-1 → к окончанию аксона; динеин → к телу нейрона","Кинезин-1 → к базальной стороне; динеин → к апикальной","Ориентации смешанные: кинезин-1 везёт груз к концу дендрита или к телу — в зависимости от ориентации микротрубочки"],"static":["Кинезин-1 → к периферии; динеин → к центру"],"scene":"s2_t3b","L":{"lbl_out":"внеклеточная среда","s2_t3_dend_one":"кинезин-1 везёт груз к концу дендрита или к телу — в зависимости от ориентации микротрубочки","s2_t3_lbl_apical":"апикальная сторона (к просвету)","s2_t3_lbl_axon":"аксон","s2_t3_lbl_basal":"базальная сторона","s2_t3_lbl_centrosome":"центросома","s2_t3_lbl_dendrite":"дендрит","s2_t3_lbl_mixed":"10 микротрубочек: половина «+» к концу дендрита, половина — к телу; доли условные","s2_t3_lbl_nucleus":"ядро","s2_t3_lbl_soma":"тело нейрона","s2_t3_lbl_terminal":"окончание аксона","s2_t3_m_dyn_short":"динеин","s2_t3_m_dynein":"цитоплазматический динеин","s2_t3_m_kinesin1":"кинезин-1","s2_t3_sp_apical":"в клетке: к апикальной стороне","s2_t3_sp_basal":"в клетке: к базальной стороне","s2_t3_sp_center":"в клетке: к центру (центросоме)","s2_t3_sp_dtip":"в клетке: к концу дендрита","s2_t3_sp_periphery":"в клетке: к периферии","s2_t3_sp_soma":"в клетке: к телу нейрона","s2_t3_sp_soma_d":"в клетке: к телу нейрона","s2_t3_sp_terminal":"в клетке: к окончанию аксона","s2_t3b_cell_axon":"нейрон: тело и аксон","s2_t3b_cell_dend":"Нейрон: дендрит — ориентации микротрубочек смешанные","s2_t3b_cell_epi":"эпителиальная клетка","s2_t3b_cell_fib":"клетка соединительной ткани в культуре","s2_t3b_pB":"Б."}}},"exam_quiz":{"id":"S2-E08","question":"Какой мотор переносит груз в аксоне от окончания к телу нейрона?","options":[{"id":"S2-E08-1","text":"Кинезин-1","correct":false,"feedback":"Он везёт к окончанию"},{"id":"S2-E08-2","text":"Цитоплазматический динеин","correct":true,"feedback":"Да: к минус-концам"},{"id":"S2-E08-3","text":"Миозин II","correct":false,"feedback":"Миозин II — сокращение"}]}},{"id":"two-directions","num":19,"section":2,"questions":[3],"title":"Направление относительно микротрубочки и направление в клетке — разные величины","keywords":["Клеточная полярность"],"lead":["Чтобы предсказать путь груза, нужны три сведения: тип мотора, ориентация микротрубочки на этом участке, положение груза."],"mechanism":["Полярность микротрубочки — где её плюс- и минус-конец. Направление мотора относительно микротрубочки — к плюс- или к минус-концу. Пространственное направление в клетке — к ядру, к мембране, к базальной стороне. Третье определяется первыми двумя. Поэтому по направлению движения груза можно определить мотор, только если известна ориентация пути, и наоборот."],"paragraphs":["Пространственная организация транспорта — часть [[T76|клеточной полярности]]: различия между частями клетки (апикальная и базальная стороны эпителия, аксон и дендриты нейрона) поддерживаются в том числе направленной доставкой компонентов по ориентированным путям. Её продолжение — семинар 4 (адресная доставка мембранных белков). <b>На практикуме.<\/b> Вкладка 3, обратная задача.","<b>Ограничения.<\/b> Здесь рассматривается один мотор на грузе."],"conditions":"","sources":["src_01","src_02"],"base":"БИО-2·17, БИО-2·18","quiz":{"id":"S2-L19","question":"Груз движется от ядра к мембране. Достаточно ли этого, чтобы назвать мотор?","options":[{"id":"S2-L19-1","text":"Нет: нужна ориентация микротрубочек","correct":true,"feedback":"Да: при плюс-концах у мембраны — плюс-направленный мотор, при минус-концах — динеин"},{"id":"S2-L19-2","text":"Да: к мембране всегда везёт кинезин-1","correct":false,"feedback":"Только если плюс-концы у мембраны"},{"id":"S2-L19-3","text":"Да: к мембране всегда везёт динеин","correct":false,"feedback":"Только если у мембраны минус-концы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Направление относительно микротрубочки и направление в клетке","status":"Схема качественная","modes_label":"Что показать","modes":["плюс-конец у мембраны","плюс-конец у ядра","ориентация скрыта"],"args":[["one","periphery","kinesin1"],["one","center","kinesin1"],["one","hidden","kinesin1"]],"notes":["Кинезин-1: к плюс-концу = к мембране","Кинезин-1: к плюс-концу = к ядру","Без ориентации пути направление в клетке не предсказать"],"static":["Кинезин-1: к плюс-концу = к мембране"],"scene":"s2_t3b","L":{"lbl_out":"внеклеточная среда","s2_t3_lbl_membrane":"мембрана","s2_t3_lbl_nucleus":"ядро","s2_t3_m_kinesin1":"кинезин-1","s2_t3_rel_plus":"относительно микротрубочки: к плюс-концу","s2_t3_sp_membrane":"в клетке: к мембране","s2_t3_sp_nucleus":"в клетке: к ядру","s2_t3_sp_unknown":"в клетке: ? (ориентация пути не показана)","s2_t3b_pOne":"Одна микротрубочка в клетке: мотор и направление в клетке"}}}},{"id":"mixed-networks","num":20,"section":2,"questions":[3],"title":"Один кинезин — разные направления в клетке","keywords":[],"lead":["Обзор последних лет сводит данные о том, как микротрубочки организованы в специализированных клетках животных."],"mechanism":["В дендритах нейронов млекопитающих микротрубочки лежат в обеих ориентациях, причём обращённые минус-концом наружу устойчивее. Центрами организации служат не только центросома, но и аппарат Гольджи, оболочка ядра в мышечных клетках, апикальная поверхность эпителия и межклеточные контакты. <b>Исследование 3 практикума<\/b> моделирует смешанный пучок: при доле микротрубочек «плюс-концом наружу» 0,5 груз кинезина-1 в среднем стоит на месте, при 0,3 — сдвигается внутрь (−0,4), а груз динеина — наружу (+0,4). Смена ориентации меняет пространственный вектор, но не направление мотора."],"paragraphs":["Как именно поддерживается смешанная ориентация в дендритах, пока до конца не понятно.","<b>Ограничения.<\/b> В модели мотор пересаживается между микротрубочками случайно. В настоящих отростках микротрубочки одной ориентации часто собраны в пучки, и мотор после пересадки, вероятно, продолжает движение в ту же сторону; кроме того, выбор микротрубочки зависит от её устойчивости и связанных белков. Поэтому средний сдвиг не сводится к доле ориентаций.",{"details":"Как это узнали (добровольно)","text":"Ориентацию микротрубочек в отростках нейронов определяют по тому, в какую сторону растут их концы: растут в основном плюс-концы, а белки, связывающиеся только с растущими концами, светятся именно у них."}],"conditions":"","sources":["src_02"],"base":"БИО-2·18, БИО-2·19","level":"adv","next_base":"actin-assembly","quiz":{"id":"S2-L20","question":"В пучке 70 % микротрубочек обращены плюс-концом к телу клетки. Куда в среднем сдвигается груз кинезина-1?","options":[{"id":"S2-L20-1","text":"К концу отростка","correct":false,"feedback":"Так было бы, если бы большинство плюс-концов было обращено наружу"},{"id":"S2-L20-2","text":"К телу клетки","correct":true,"feedback":"Да: большинство плюс-концов там"},{"id":"S2-L20-3","text":"Не сдвигается","correct":false,"feedback":"Средний сдвиг ноль — только при равных долях"}]},"widget":{"kind":"dna","title":"","s":{"title":"Смешанная сеть: средний сдвиг груза","status":"Учебная модель · условные единицы","modes_label":"Что показать","modes":["f = 1,0","f = 0,5","f = 0,3"],"args":[["kinesin1",1.0],["kinesin1",0.5],["both",0.3]],"notes":["Средний сдвиг кинезина-1 +1,0 (к концу отростка)","0: груз ходит в обе стороны","Кинезин-1 −0,4 (к телу клетки), динеин +0,4 (к концу)"],"static":["Средний сдвиг кинезина-1 +1,0 (к концу отростка)"],"scene":"s2_a3","L":{"s2_a3g_body":"← тело клетки","s2_a3g_dyn":"динеин","s2_a3g_end":"конец отростка →","s2_a3g_frac":"плюс-концом наружу: {n} из 10 (f = {f})","s2_a3g_kin":"кинезин-1","s2_a3g_mean":"средний сдвиг за отрезок {d}","s2_a3g_net_body":"к телу клетки","s2_a3g_net_end":"к концу отростка","s2_a3g_net_zero":"в среднем на месте","s2_a3g_start":"старт","s2_a3g_t":"Отросток клетки: пучок из 10 микротрубочек, 20 отрезков пути груза"}},"zoomNarrow":true}},{"id":"kinesin-autoinhibition","num":21,"section":2,"questions":[3],"title":"Кинезин без груза выключен","keywords":["Аутоингибирование","Белок-адаптер груза"],"lead":["У человека 45 генов кинезинов, и многие изученные кинезины, в том числе кинезин-1, не движутся, пока не связаны с грузом."],"mechanism":["Без груза кинезин-1 складывается: хвост прижимается к моторным головкам, выключает их и мешает им связываться с микротрубочкой — это [[T55|аутоингибирование]]. Белок, связанный с микротрубочкой (MAP7), присоединяется к средней спиральной части молекулы, а [[T51|белок-адаптер]] груза — к хвосту; вместе они раскладывают мотор и включают его. В результате выключенный мотор не гидролизует АТФ и не связывается с микротрубочкой."],"paragraphs":["Это объясняет, почему количество мотора в клетке не равно количеству работающего мотора.","<b>Ограничения.<\/b> Как именно белок, связанный с микротрубочкой, и адаптер раскладывают мотор, установлено не полностью: предложена двухэтапная схема включения.",{"details":"Как это узнали (добровольно)","text":"Сравнивали строение выключенного и работающего кинезина-1: в выключенном моторе нашли множество контактов между моторными головками, стеблем, хвостом и лёгкими цепями."}],"conditions":"","sources":["src_05"],"base":"БИО-2·16","level":"adv","next_base":"actin-assembly","quiz":{"id":"S2-L21","question":"Почему свободный кинезин-1 почти не движется по микротрубочкам?","options":[{"id":"S2-L21-1","text":"Без груза ему не хватает АТФ","correct":false,"feedback":"АТФ в цитоплазме достаточно; дело в выключенной конформации"},{"id":"S2-L21-2","text":"Без груза кинезин-1 распадается на отдельные головки","correct":false,"feedback":"Кинезин-1 остаётся димером; без груза он складывается, и хвост выключает головки"},{"id":"S2-L21-3","text":"Хвост выключает головки","correct":true,"feedback":"Да: это аутоингибирование"}]},"widget":{"kind":"dna","title":"","s":{"title":"Аутоингибирование кинезина-1","status":"Схема качественная","modes_label":"Что показать","modes":["без груза","включение","перенос груза"],"args":[["off"],["activate"],["walk"]],"notes":["Без груза хвост выключает головки и мешает связыванию с микротрубочкой — АТФ не тратится","Адаптер груза и белок микротрубочки раскладывают мотор","Включённый кинезин-1 переносит груз к плюс-концу"],"static":["Без груза хвост выключает головки и мешает связыванию с микротрубочкой — АТФ не тратится"],"scene":"s2_r_autoinh","L":{"s2_r_autoinh_adapter":"адаптер груза","s2_r_autoinh_map7":"MAP7 — белок, связанный с микротрубочкой","s2_r_autoinh_n1":"Без груза мотор не связывается с микротрубочкой и не тратит АТФ","s2_r_autoinh_n2":"Адаптер груза и MAP7 раскладывают мотор","s2_r_autoinh_n3":"Включённый кинезин-1 переносит груз","s2_r_autoinh_off":"выключен","s2_r_autoinh_t":"Кинезин-1 без груза и с грузом","s2_r_autoinh_tail":"хвост прижат к головкам","s2_r_autoinh_toplus":"к плюс-концу"}},"zoomNarrow":true}},{"id":"actin-assembly","num":22,"section":3,"questions":[4],"title":"Сборка актина: АТФ-актин, концы и тредмиллинг","keywords":["Профилин","Кэпирующий белок","Кофилин"],"lead":["Свободный G-актин несёт АТФ и присоединяется в основном к плюс-концу филамента."],"mechanism":["После встраивания АТФ гидролизуется, фосфат уходит, и старые участки становятся АДФ-актином, который удерживается слабее. Старые участки находятся у минус-конца, поэтому при росте плюс-конца субъединицы уходят в основном с минус-конца. Свободный АДФ-актин обменивает АДФ на АТФ; этот обмен ускоряет [[T63|профилин]], который также доставляет мономеры к растущим концам. В большинстве немышечных клеток позвоночных около половины актина удерживается в свободной форме белками, связывающими мономер. [[T65|Кэпирующий белок]] закрывает плюс-конец и останавливает его рост; [[T64|кофилин]] связывается со старыми участками АДФ-актина и ускоряет их разборку."],"paragraphs":["<b>На практикуме.<\/b> Вкладка 4, шаг 1: в сети у переднего края плюс-концы обращены к мембране.","<b>Ограничения.<\/b> Скорости реакций сильно различаются в пробирке и в клетке; в клетке их задают связывающие белки."],"conditions":"","sources":["src_01"],"base":"БИО-2·2, БИО-2·8, БИО-2·13","quiz":{"id":"S2-L22","question":"Что делает кофилин?","options":[{"id":"S2-L22-1","text":"Ускоряет разборку АДФ-актина","correct":true,"feedback":"Да: так субъединицы возвращаются в пул"},{"id":"S2-L22-2","text":"Закрывает плюс-конец филамента","correct":false,"feedback":"Это кэпирующий белок"},{"id":"S2-L22-3","text":"Нуклеирует новые ветви сети","correct":false,"feedback":"Это комплекс Arp2/3"}]},"widget":{"kind":"dna","title":"","s":{"title":"Цикл субъединицы актина","status":"Схема качественная","modes_label":"Что показать","modes":["цикл","плюс-конец закрыт","кофилин неактивен"],"args":[["cycle"],["capped"],["nocofilin"]],"notes":["Субъединица проходит цикл: пул → плюс-конец → разборка → пул","Кэпирующий белок останавливает рост плюс-конца","Без кофилина субъединицы медленно возвращаются в пул"],"static":["Субъединица проходит цикл: пул → плюс-конец → разборка → пул"],"scene":"s2_r_actin_cycle","L":{"s2_r_actin_cycle_capbox":"кэпирующий белок","s2_r_actin_cycle_cof":"кофилин разбирает старые участки","s2_r_actin_cycle_gadp":"G-актин·АДФ","s2_r_actin_cycle_gatp":"G-актин·АТФ с профилином","s2_r_actin_cycle_hydro":"АТФ гидролизуется, фосфат уходит","s2_r_actin_cycle_in":"присоединение к «+»","s2_r_actin_cycle_n2":"Плюс-конец закрыт: присоединение остановлено","s2_r_actin_cycle_n3":"Кофилин неактивен: старые участки накапливаются, пул уменьшается","s2_r_actin_cycle_old":"АДФ-актин","s2_r_actin_cycle_prof":"профилин: АДФ → АТФ","s2_r_actin_cycle_t":"Цикл субъединицы актина"}},"zoomNarrow":true}},{"id":"brownian-ratchet","num":23,"section":3,"questions":[4],"title":"Как полимеризация актина толкает мембрану","keywords":["Ламеллиподия","Броуновский храповик","Механическая сила"],"lead":["[[T59|Ламеллиподия]] — плоский выступ края ползущей клетки, заполненный ветвящейся сетью актина. Её выдвигает сила, возникающая при сборке актина."],"mechanism":["Новые филаменты начинаются как ветви на боковой поверхности старых под углом около 70°; их нуклеирует комплекс Arp2/3. Длинные неразветвлённые филаменты собирают формины. Плюс-концы сети упираются в мембрану. Мембрана и концы филаментов колеблются из-за теплового движения молекул; когда между концом филамента и мембраной открывается зазор, в него встраивается субъединица, и мембрана уже не возвращается. Это [[T60|броуновский храповик]]: случайные колебания превращаются в направленное движение, а [[T77|механическую силу]] создаёт само присоединение субъединиц."],"paragraphs":["Энергию для этой работы даёт гидролиз АТФ в филаменте; обмен АДФ на АТФ в свободном актине восполняет запас АТФ-актина. Сила зависит от скорости сборки, числа и угла филаментов и сцепления сети. <b>На практикуме.<\/b> Вкладка 4, шаг 2 и лупа на панели А.","<b>Ограничения.<\/b> Броуновский храповик — модель; точные силы отдельных филаментов измерены в пробирке, в клетке они зависят от натяжения мембраны."],"conditions":"","sources":["src_01","src_03"],"base":"БИО-2·22; вспомнить БИО-1·4 (мембрана — жидкий гибкий бислой)","quiz":{"id":"S2-L23","question":"Почему встраивание одной субъединицы не позволяет мембране вернуться назад?","options":[{"id":"S2-L23-1","text":"Субъединица связывается с мембраной ковалентно","correct":false,"feedback":"Ковалентной связи нет"},{"id":"S2-L23-2","text":"Субъединица становится упором","correct":true,"feedback":"Да: каждый шаг закрепляется"},{"id":"S2-L23-3","text":"Гидролиз АТФ отталкивает мембрану","correct":false,"feedback":"Гидролиз происходит позже и в глубине филамента"}]},"widget":{"kind":"dna","title":"","s":{"title":"Броуновский храповик","status":"Схема качественная · модель","modes_label":"Что показать","modes":["зазор закрыт","зазор открыт","субъединица встроена","сеть края"],"args":[["closed"],["open"],["inserted"],["net",{"t":0}]],"notes":["Конец упирается в мембрану","Тепловое колебание открыло зазор","Встроенная субъединица не даёт мембране вернуться","Ветви под 70°; плюс-концы толкают мембрану"],"static":["Конец упирается в мембрану"],"scenes":["s2_t4a_zoom","s2_t4a_zoom","s2_t4a_zoom","s2_t4a"],"L":{"lbl_cytosol":"цитоплазма","lbl_out":"внеклеточная среда","s2_t4a_cof":"кофилин","s2_t4a_fbar":"F-актин в сети","s2_t4a_gbar":"свободный G-актин","s2_t4a_lens":"лупа:\nброуновский храповик","s2_t4a_pA":"А. Передний край (ламеллиподия), вид сбоку","s2_t4a_sub":"подложка; серые якоря — точки сцепления","s2_t4a_sum":"G + F = 100","s2_t4a_tax":"время, шаги","s2_t4a_xplot":"положение края X","s2_t4z_gap":"зазор больше субъединицы","s2_t4z_ins":"субъединица встроена","s2_t4z_osc":"колебание мембраны","s2_t4z_title":"Лупа: конец филамента у мембраны","s2_t4z_was":"прежнее положение"}}},"exam_quiz":{"id":"S2-E10","question":"Какой комплекс нуклеирует ветви актиновой сети?","options":[{"id":"S2-E10-1","text":"Arp2/3","correct":true,"feedback":"Да"},{"id":"S2-E10-2","text":"γ-TuRC","correct":false,"feedback":"Он нуклеирует микротрубочки"},{"id":"S2-E10-3","text":"Кофилин","correct":false,"feedback":"Кофилин ускоряет разборку"}]}},{"id":"network-turnover","num":24,"section":3,"questions":[4],"title":"Обновление сети: сборка впереди, разборка позади","keywords":[],"lead":["Сеть у края постоянно обновляется: впереди она собирается, позади разбирается."],"mechanism":["Кофилин разбирает старые филаменты из АДФ-актина в глубине ламеллиподии, и субъединицы возвращаются в свободный пул, откуда снова поступают к плюс-концам у мембраны. Это похоже на тредмиллинг отдельного филамента, но относится ко всей сети. Поскольку общее количество актина ограничено, без разборки пул быстро истощается."],"paragraphs":["<b>На практикуме.<\/b> Вкладка 4, шаг 3: при остановленной разборке G падает с 80 до 2,26 к t = 10, а край останавливается на 7,99 у.е.д. вместо 19,12 к t = 20. Модель соблюдает закон сохранения: G + F = 100 в каждый момент. Доля свободного актина в модели (25 %) условная; в клетке около половины актина находится в свободной форме.","<b>Ограничения.<\/b> В модели скорости пропорциональны G и F; в клетке оборот сети регулируют многие белки."],"conditions":"","sources":["src_01"],"base":"БИО-2·22, БИО-2·23","quiz":{"id":"S2-L24","question":"В замкнутой модели остановили разборку. Почему край останавливается, хотя сборка не запрещена?","options":[{"id":"S2-L24-1","text":"Сеть становится слишком тяжёлой","correct":false,"feedback":"Масса сети на выдвижение в модели не влияет"},{"id":"S2-L24-2","text":"Кофилин толкает мембрану назад","correct":false,"feedback":"Кофилин не толкает мембрану"},{"id":"S2-L24-3","text":"Закончился свободный пул","correct":true,"feedback":"Да: без разборки субъединицы не возвращаются в пул"}]},"widget":{"kind":"dna","title":"","s":{"title":"Обновление сети у края","status":"Учебная модель · условные единицы","modes_label":"Что показать","modes":["норма, t = 20","разборка остановлена, t = 20"],"args":[["net",{"kp":0.3,"kd":0.1,"t":20}],["net",{"kp":0.3,"kd":0,"t":20}]],"notes":["свободный актин G 25,0; в сети F 75,0; присоединение J 7,5; край 19,12","свободный актин G 0,06; в сети F 99,94; присоединение J 0,02; край 7,99"],"static":["свободный актин G 25,0; в сети F 75,0; присоединение J 7,5; край 19,12"],"scene":"s2_t4a","L":{"lbl_cytosol":"цитоплазма","lbl_out":"внеклеточная среда","s2_t4a_cof":"кофилин","s2_t4a_fbar":"F-актин в сети","s2_t4a_gbar":"свободный G-актин","s2_t4a_lens":"лупа:\nброуновский храповик","s2_t4a_nocof":"кофилин неактивен","s2_t4a_pA":"А. Передний край (ламеллиподия), вид сбоку","s2_t4a_sub":"подложка; серые якоря — точки сцепления","s2_t4a_sum":"G + F = 100","s2_t4a_tax":"время, шаги","s2_t4a_xplot":"положение края X"}}}},{"id":"actomyosin","num":25,"section":3,"questions":[4],"title":"Актомиозиновое сокращение — другая сила","keywords":["Миозин II","Актомиозиновое сокращение","Стрессовое волокно","Сократительное кольцо"],"lead":["Миозины — моторные белки актиновых филаментов. [[T57|Миозин II]] образует биполярные нити: головки на двух концах нити обращены в противоположные стороны."],"mechanism":["Головка миозина II связывает актин, совершает силовой ход, отделяется после связывания АТФ и возвращается в исходное положение после его гидролиза. Биполярная нить, связанная с двумя антипараллельными филаментами, тянет их навстречу друг другу, и пучок укорачивается. Это [[T58|актомиозиновое сокращение]]: стягивание, а не толчок."],"paragraphs":["Так работают саркомеры мышцы, [[T68|стрессовые волокна]] клеток на подложке, натяжение кортекса и [[T69|сократительное кольцо]], разделяющее клетку при делении (семинар 6). <b>На практикуме.<\/b> Вкладка 4, шаг 5: при подавленном миозине II пучок не сокращается, а край продолжает выдвигаться.","<b>Ограничения.<\/b> Для сокращения нужна правильная полярность филаментов и закрепление их концов."],"conditions":"","sources":["src_01"],"base":"БИО-2·16, БИО-2·22","quiz":{"id":"S2-L25","question":"Чем сила актомиозина отличается от силы полимеризации актина?","options":[{"id":"S2-L25-1","text":"Стягивание против толчка","correct":true,"feedback":"Да: два разных механизма"},{"id":"S2-L25-2","text":"Ничем: обе создаёт миозин","correct":false,"feedback":"Полимеризационная сила не требует миозина"},{"id":"S2-L25-3","text":"Полимеризация тянет, миозин толкает","correct":false,"feedback":"Наоборот"}]},"widget":{"kind":"dna","title":"","s":{"title":"Актомиозиновое сокращение","status":"Учебная модель · условные единицы","modes_label":"Что показать","modes":["миозин активен","миозин подавлен","нет АТФ"],"args":[["on"],["nomyosin"],["noatp"]],"notes":["Пучок укорачивается с 10 до 6,0 за 8 шагов; край выдвигается","Длина 10 без изменений; край выдвигается","Длина 10 без изменений"],"static":["Пучок укорачивается с 10 до 6,0 за 8 шагов; край выдвигается"],"scenes":["s2_t4b","s2_t4b","s2_t4b"],"L":{"s2_t4b_anchor":"точка прикрепления","s2_t4b_edge":"Передний край (панель А)","s2_t4b_edge_res":"край выдвигается: сборку у мембраны миозин не меняет","s2_t4b_len":"длина пучка: {L}","s2_t4b_noatp":"АТФ нет","s2_t4b_nomyo":"миозин II подавлен","s2_t4b_title":"Б. Актомиозиновый пучок"}}},"exam_quiz":{"id":"S2-E07","question":"Какая структура разделяет клетку надвое при делении?","options":[{"id":"S2-E07-1","text":"Сократительное кольцо из актина и миозина II","correct":true,"feedback":"Да (семинар 6)"},{"id":"S2-E07-2","text":"Веретено","correct":false,"feedback":"Веретено распределяет хромосомы"},{"id":"S2-E07-3","text":"Центриоль","correct":false,"feedback":"Нет: центриоли входят в центросомы на полюсах веретена, а клетку разделяет сократительное кольцо"}]}},{"id":"edge-vs-cell","num":26,"section":3,"questions":[4],"title":"Выдвижение края и перемещение клетки — не одно и то же","keywords":["Сцепление с подложкой","Ретроградный поток актина"],"lead":["Выпячивание края — первый этап ползания клетки, но не всё ползание."],"mechanism":["Чтобы край выдвигался, сеть должна опираться на подложку: белки адгезии (интегрины) связывают её с внеклеточным матриксом — это [[T66|сцепление с подложкой]]. Без сцепления значительная часть сборки уходит на движение сети назад — [[T67|ретроградный поток]]. Чтобы переместилась вся клетка, нужны ещё новые контакты впереди, сокращение актомиозина позади и открепление заднего края. Такая миграция медленная: фибробласты и эпителиальные клетки на стекле перемещаются меньше чем на 1 мкм в минуту."],"paragraphs":["Поэтому тредмиллинг сети — не перемещение клетки, а смещение края — не смещение центра клетки. <b>На практикуме.<\/b> Вкладка 4, шаг 4: без сцепления сборка идёт с той же скоростью, а край продвигается в 5 раз меньше; исследование 4, шаг 4.","<b>Ограничения.<\/b> Есть и другие способы перемещения клеток (например, с пузыревидными выпячиваниями); здесь рассматривается ползание по подложке."],"conditions":"","sources":["src_01"],"base":"БИО-2·23–2·25","quiz":{"id":"S2-L26","question":"Край ламеллиподии выдвигается, но клетка за час не сместилась. Что из этого может быть причиной?","options":[{"id":"S2-L26-1","text":"Сборка актина у края идёт слишком быстро","correct":false,"feedback":"Быстрая сборка не мешает перемещению"},{"id":"S2-L26-2","text":"Задний край не открепляется от подложки","correct":true,"feedback":"Да: без открепления и подтягивания сзади центр клетки не перемещается"},{"id":"S2-L26-3","text":"У клетки нет промежуточных филаментов","correct":false,"feedback":"Для ползания они не главные"}]},"widget":{"kind":"dna","title":"","s":{"title":"Выдвижение края и перемещение клетки","status":"Схема качественная","modes_label":"Что показать","modes":["нет сцепления","есть сцепление","полный цикл"],"args":[["noadh"],["adh"],["full"]],"notes":["Сеть отъезжает назад; край почти не выдвигается","Край выдвинут, центр клетки на месте","С сокращением и откреплением сзади смещается вся клетка"],"static":["Сеть отъезжает назад; край почти не выдвигается"],"scene":"s2_r_migration","L":{"s2_r_migration_adh":"сцепление с подложкой","s2_r_migration_center":"центр клетки","s2_r_migration_contr":"сокращение","s2_r_migration_detach":"открепление заднего края","s2_r_migration_n1":"Нет сцепления: сеть отъезжает назад, край почти не выдвигается","s2_r_migration_n2":"Край выдвинут, центр клетки на месте","s2_r_migration_n3":"Новые контакты впереди, сокращение и открепление сзади: смещается вся клетка","s2_r_migration_old":"край раньше","s2_r_migration_retro":"ретроградный поток","s2_r_migration_shift":"смещение центра","s2_r_migration_start":"исходное положение центра","s2_r_migration_sub":"подложка (внеклеточный матрикс)","s2_r_migration_t":"Край и клетка (вид сбоку)"}},"zoomNarrow":true}},{"id":"autoregulation","num":27,"section":3,"questions":[4],"title":"Как количество свободной субъединицы влияет на синтез актина и тубулина","keywords":["Авторегуляция синтеза","Рибосома"],"lead":["Запас свободных субъединиц нужен для сборки; клетка поддерживает его [[T70|авторегуляцией]] — синтез белка зависит от количества его свободной формы."],"mechanism":["Белок синтезируется на [[T80|рибосоме]] по мРНК — молекуле-копии гена (подробно — семинары 9–11). Сигналом для синтеза актина и тубулина служит количество их свободной формы: когда свободного актина становится мало (он ушёл в филаменты), синтез актина возрастает; когда свободного тубулина становится много (микротрубочки разобрались), синтез тубулина снижается. Общий принцип — отрицательная обратная связь: больше свободной субъединицы — меньше синтеза."],"paragraphs":["Пути у двух белков разные. У актина регуляция идёт на уровне работы генов в ядре, у тубулина — на уровне устойчивости мРНК во время синтеза. <b>На практикуме.<\/b> Вкладка 4, панель В, шаги 6–7: в одной клетке синтез актина возрастает, а тубулина снижается.","<b>Ограничения.<\/b> Знать молекулярные подробности транскрипции и разрушения мРНК для этого семинара не требуется.",{"details":"Дополнение, для коллоквиума не требуется (добровольно)","text":"свободный G-актин связывает белок [[T71|MRTF]] и удерживает его в цитоплазме; когда G-актина мало, MRTF переходит в ядро и вместе с белком [[T83|SRF]] усиливает работу генов актина и других белков цитоскелета. При избытке свободного тубулина белок [[T73|TTC5]] узнаёт начало растущей цепи тубулина на рибосоме, и мРНК тубулина разрушается."}],"conditions":"","sources":["src_07"],"base":"БИО-2·8, БИО-2·24","quiz":{"id":"S2-L27","question":"Почему у актина и тубулина говорят об одном принципе авторегуляции, но о разных путях?","options":[{"id":"S2-L27-1","text":"У обоих регулируется только деградация белка","correct":false,"feedback":"Регулируется синтез: у актина — работа генов, у тубулина — устойчивость мРНК"},{"id":"S2-L27-2","text":"Сигналы противоположные, пути одинаковые","correct":false,"feedback":"Наоборот: сигнал одинаковый — свободная субъединица, а пути разные"},{"id":"S2-L27-3","text":"Сигнал один, уровни регуляции разные","correct":true,"feedback":"Да: сигнал — количество свободной субъединицы; у актина меняется работа генов, у тубулина — устойчивость мРНК"}]},"widget":{"kind":"dna","title":"","s":{"title":"Авторегуляция синтеза актина и тубулина","status":"Схема качественная · без времени и величин","modes_label":"Что показать","modes":["норма","актин ушёл в филаменты","микротрубочки разобраны","оба воздействия в одной клетке"],"args":[["norm"],["actin_poly"],["mt_depol"],["both"]],"notes":["Синтез соответствует количеству свободных субъединиц","G-актина мало → MRTF в ядре → синтез актина ↑","Свободного тубулина много → TTC5 → мРНК разрушается → синтез тубулина ↓","Синтез актина ↑, синтез тубулина ↓: принцип один, пути разные"],"static":["Синтез соответствует количеству свободных субъединиц"],"scene":"s2_t4c","L":{"s2_t4c_actin":"Актин","s2_t4c_free_a":"свободный G-актин","s2_t4c_free_t":"свободный тубулин","s2_t4c_genes_a":"ядро: гены цитоскелета","s2_t4c_mrna":"мРНК тубулина","s2_t4c_mrtf":"MRTF","s2_t4c_note":"мРНК — молекула-копия гена, по которой рибосома строит белок; подробно её синтез разбирают семинары 9–11","s2_t4c_ribo":"рибосома","s2_t4c_srf":"SRF","s2_t4c_syn_a_0":"синтез актина — по количеству свободного G-актина","s2_t4c_syn_a_up":"синтез актина ↑","s2_t4c_syn_t_0":"синтез тубулина — по количеству свободного тубулина","s2_t4c_syn_t_down":"синтез тубулина ↓","s2_t4c_title":"В. Свободный пул и синтез","s2_t4c_ttc5":"TTC5","s2_t4c_tub":"Тубулин"}}}},{"id":"turnover-limits","num":28,"section":3,"questions":[4],"title":"Скорость обновления сети задают белки разборки, а нагрузка делает сеть плотнее","keywords":[],"lead":["Обзор последних лет обобщает, как регулируется оборот актиновых сетей."],"mechanism":["Ветвящаяся сеть у переднего края мигрирующих в культуре клеток меланомы мыши обновляется полностью менее чем за минуту, а актиновые сети в местах эндоцитоза — за несколько секунд. Очищенный актин сам по себе разбирается слишком медленно: такую скорость обеспечивают белки, разрезающие и разбирающие филаменты, прежде всего кофилин и его партнёры. Сеть реагирует на нагрузку (это показано в том числе на сетях, собранных из очищенных белков): упираясь в препятствие, филаменты удлиняются медленнее, а сеть становится плотнее и толкает эффективнее, а растягивающая сила облегчает отделение ветвей. Одиночный актиновый филамент выдерживает растяжение более 100 пН."],"paragraphs":["<b>Исследование 4 практикума<\/b> иллюстрирует ту же логику на замкнутой учебной модели: при остановленной разборке край продвигается не дальше 8 у.е.д. при любой скорости сборки; ускорение разборки вдвое продвигает край дальше (50,40 у.е.д. за 40 шагов), чем ускорение сборки вдвое (39,92). Обновление сети не гарантирует выдвижения: без сцепления край продвигается на 6,82 вместо 34,12.","<b>Ограничения.<\/b> Механизм обновления различается в разных клетках; модель — замкнутая и упрощённая.",{"details":"Как это узнали (добровольно)","text":"Скорость оборота оценивали, следя в живых клетках за тем, как быстро обновляется помеченный актин в сети; влияние нагрузки изучали на сетях, собранных из очищенных белков."}],"conditions":"","sources":["src_03"],"base":"БИО-2·24, БИО-2·26","level":"adv","next_base":"integration","quiz":{"id":"S2-L28","question":"Почему, по данным обзора, скорость обновления сети в клетке задают белки разборки?","options":[{"id":"S2-L28-1","text":"Сам актин разбирается слишком медленно","correct":true,"feedback":"Да: нужны кофилин и другие белки"},{"id":"S2-L28-2","text":"Сборка в клетке медленнее разборки","correct":false,"feedback":"Нет: в клетке сборка у переднего края быстрая, а очищенный актин разбирается слишком медленно — скорость обновления ограничивает разборка, её ускоряют кофилин и партнёры"},{"id":"S2-L28-3","text":"Разборку обеспечивает миозин II","correct":false,"feedback":"Миозин участвует в сокращении; разборку ускоряют кофилин и его партнёры"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что ограничивает выдвижение края","status":"Учебная модель · условные единицы","modes_label":"Что показать","modes":["разборка остановлена","сборка ×2","разборка ×2","нет сцепления"],"args":[[0.3,0,80,1,40],[0.6,0.1,80,1,40],[0.3,0.2,80,1,40],[0.3,0.1,80,0.2,40]],"notes":["Край 8,00 — предел пула","Край 39,92; свободный актин в равновесии 14,29","Край 50,40; свободный актин в равновесии 40","Обновление как в норме, край 6,82"],"static":["Край 8,00 — предел пула"],"scene":"s2_a4","L":{"s2_a4g_adh":"сцепление с подложкой","s2_a4g_adh_no":"нет","s2_a4g_adh_yes":"есть","s2_a4g_center":"центр клетки","s2_a4g_center_note":"центр клетки: не смещается (в модели нет подтягивания заднего края)","s2_a4g_edge0":"X = 0","s2_a4g_edge_axis":"положение края X","s2_a4g_gf":"G и F","s2_a4g_gstar":"G* {g}","s2_a4g_j":"J, присоединение за шаг","s2_a4g_read":"t = {T}: G {G} · F {F} · J {J} · X {X}","s2_a4g_retro":"сеть отъезжает назад","s2_a4g_sum":"G + F = 100","s2_a4g_t":"Замкнутый пул актина у края: G + F = 100","s2_a4g_t_axis":"шаг t","s2_a4g_x":"X, положение края"}},"zoomNarrow":true}},{"id":"integration","num":29,"section":4,"questions":[1,2,3,4],"title":"Почему клетка изменила форму и нарушила внутриклеточный транспорт?","keywords":["Фенотип"],"lead":["Один и тот же [[T74|фенотип]] — набор наблюдаемых признаков — может иметь разные молекулярные причины."],"mechanism":["Условная эпителиальная клетка округлилась и не образует выпячиваний, лизосомы не доходят до периферии, при растяжении клеточного слоя клетки рвутся. Ни одна из шести причин модели не объясняет все три признака сама. Совместимых минимальных наборов шесть: снижение АТФ вместе с дефектом промежуточных филаментов или их связи с контактами; либо сочетание сниженной сборки актина, нарушения транспорта (мало микротрубочек или неактивен кинезин-1) и дефекта промежуточных филаментов или их связи с контактами."],"paragraphs":["Различить гипотезы помогают три измерения: например, окраска микротрубочек, окраска промежуточных филаментов и уровень АТФ. Окраска промежуточных филаментов нужна в любом случае: она отличает отсутствие сети от сети, не закреплённой у контактов. Вывод ограничен: признаки в модели «есть/нет», причин только шесть, системы в клетке влияют друг на друга. <b>На практикуме.<\/b> Итоговая задача.","<b>Ограничения.<\/b> Модель не говорит, какая причина чаще встречается.",{"h":"Дальше в курсе «Биология»"},{"ul":["[[https://fresll.github.io/bio/seminar-1-route.html|Семинар 1]] — мембрана и белки, связывающие её с кортексом","[[https://fresll.github.io/bio/seminar-3-route.html|Семинар 3]] — актин в эндоцитозе и движение везикул по микротрубочкам","Семинар 4 — направленная доставка мембранных и секретируемых белков","Семинар 6 — веретено деления из микротрубочек и сократительное кольцо из актина и миозина"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Транспорт органелл по цитоскелету и адаптеры моторов — [[https://fresll.github.io/molbio/seminar-2-route.html#tracks|МБ 2·1]], [[https://fresll.github.io/molbio/seminar-2-route.html#motors|МБ 2·2]], [[https://fresll.github.io/molbio/seminar-2-route.html#adaptors|МБ 2·3]] (семинар 2 «Транспорт, сети органелл, конденсаты и полярность»)"]}],"conditions":"","sources":["src_01"],"base":"БИО-2·6, БИО-2·12, БИО-2·19, БИО-2·26","quiz":{"id":"S2-L29","question":"Почему по одному набору признаков нельзя сразу назвать единственную причину?","options":[{"id":"S2-L29-1","text":"Признаки появляются случайно","correct":false,"feedback":"Признаки следуют из причин, но не однозначно"},{"id":"S2-L29-2","text":"Разные причины дают те же признаки","correct":true,"feedback":"Да: нужны дополнительные измерения"},{"id":"S2-L29-3","text":"У каждого признака одна причина","correct":false,"feedback":"Например, нарушенный перенос лизосом к периферии дают и малое число микротрубочек, и неактивный кинезин-1, и снижение АТФ"}]},"widget":{"kind":"dna","title":"","s":{"title":"Одна картина — несколько причин","status":"Учебная модель · исходы качественные","modes_label":"Что показать","modes":["наблюдения","гипотезы","измерения"],"args":[["obs"],["hyp"],["meas",["m_mt","m_if","m_atp"]]],"notes":["Три признака","Шесть минимальных наборов причин совместимы с наблюдениями","Три измерения различают все шесть гипотез"],"static":["Три признака"],"scene":"s2_int","L":{"s2_int_all_note":"Все строки различаются: измерения различают все шесть гипотез","s2_int_cs_actin":"мало актиновой сети","s2_int_cs_atp":"мало АТФ","s2_int_cs_if":"дефект ПФ","s2_int_cs_kin":"кинезин-1 неактивен","s2_int_cs_link":"ПФ не связаны с контактами","s2_int_cs_mt":"мало микротрубочек","s2_int_f1":"(1) округление","s2_int_f1s":"клетка округлилась, выпячиваний нет","s2_int_f2":"(2) перенос к периферии нарушен","s2_int_f2s":"перенос к периферии нарушен","s2_int_f3":"(3) разрывы","s2_int_f3s":"разрыв слоя при растяжении","s2_int_meas_m_atp":"уровень АТФ","s2_int_meas_m_if":"окраска промежуточных филаментов","s2_int_meas_m_mt":"окраска микротрубочек","s2_int_obs_note":"Условная эпителиальная клетка в культуре; лизосомы — только в центральной части клетки","s2_int_pA":"Условная эпителиальная клетка в слое: три признака","s2_int_pB":"Шесть наборов причин: какая причина даёт каждый признак","s2_int_pC":"Результаты измерений для шести наборов причин","s2_int_stretch":"растяжение слоя","s2_int_v_atp_low":"снижен","s2_int_v_atp_norm":"в норме","s2_int_v_if_none":"сети нет","s2_int_v_if_unlinked":"сеть есть, у контактов не закреплена","s2_int_v_mt_norm":"в норме","s2_int_v_mt_sparse":"сеть редкая"}},"zoomNarrow":true}}],"sections":[{"title":"Три системы цитоскелета","entry":"three-systems","sub":"Три системы цитоскелета","label":"Тема 1","integr":false},{"title":"Динамическая нестабильность микротрубочек","entry":"polymerization","sub":"Динамическая нестабильность микротрубочек","label":"Тема 2","integr":false},{"title":"Моторные белки и направление транспорта","entry":"motor-cycle","sub":"Моторные белки и направление транспорта","label":"Тема 3","integr":false},{"title":"Актин: сборка, сила и обновление сети","entry":"actin-assembly","sub":"Актин: сборка, сила и обновление сети","label":"Тема 4","integr":false},{"title":"Итог: одна картина — несколько причин","entry":"integration","sub":"Почему клетка изменила форму и нарушила внутриклеточный транспорт?","label":"Итог","integr":true}],"glossary":[{"id":"S2-T01","term":"Цитоскелет","section":0,"def":"Система белковых полимеров и связанных с ними белков в цитоплазме эукариотической клетки; придаёт клетке форму и механическую прочность, обеспечивает изменение формы, генерацию силы и направленное перемещение внутриклеточных компонентов."},{"id":"S2-T02","term":"Субъединица полимера","section":0,"def":"Отдельная белковая молекула или комплекс (например, мономер актина, димер тубулина), из множества которых нековалентно собран полимер."},{"id":"S2-T03","term":"Актиновый филамент","section":0,"def":"Полярный полимер актина диаметром около 8 нм; две закрученные цепочки субъединиц; синоним — микрофиламент, F-актин."},{"id":"S2-T04","term":"Актин","section":0,"def":"Глобулярный белок, связывающий АТФ; свободная форма — G-актин (глобулярный), полимерная — F-актин (филаментный)."},{"id":"S2-T05","term":"Микротрубочка","section":0,"def":"Полый полярный цилиндр наружным диаметром 25 нм, стенка которого обычно состоит из 13 протофиламентов αβ-тубулина."},{"id":"S2-T06","term":"Тубулин","section":0,"def":"Белок микротрубочек; субъединица — прочный димер α- и β-тубулина, каждый из которых связывает ГТФ."},{"id":"S2-T07","term":"Протофиламент","section":0,"def":"Линейная цепочка димеров тубулина, уложенных «голова к хвосту»; 13 протофиламентов образуют стенку микротрубочки."},{"id":"S2-T08","term":"Промежуточный филамент","section":0,"def":"Неполярный прочный филамент диаметром около 10 нм из вытянутых белков (кератинов, виментина, ламинов и др.); сопротивляется растяжению, не служит путём для моторных белков."},{"id":"S2-T09","term":"Полярность филамента","section":0,"def":"Различие двух концов филамента, возникающее потому, что все субъединицы встроены в одной ориентации."},{"id":"S2-T10","term":"Плюс-конец","section":0,"def":"Быстрее растущий конец полярного филамента; у микротрубочки на нём наружу обращён β-тубулин."},{"id":"S2-T11","term":"Минус-конец","section":0,"def":"Медленнее растущий конец полярного филамента; у микротрубочек обычно закреплён в центре организации."},{"id":"S2-T12","term":"Антипараллельный тетрамер","section":0,"def":"Субъединица промежуточного филамента: два параллельных димера, уложенные навстречу друг другу, так что оба конца тетрамера одинаковы."},{"id":"S2-T13","term":"Кератины","section":0,"def":"Белки промежуточных филаментов эпителиальных клеток; кислые и основные кератины образуют пары."},{"id":"S2-T14","term":"Виментин","section":0,"def":"Белок промежуточных филаментов многих клеток соединительной ткани и других клеток мезенхимного происхождения."},{"id":"S2-T15","term":"Ламины","section":0,"def":"Белки промежуточных филаментов ядра; образуют ядерную ламину — сеть под внутренней мембраной ядерной оболочки."},{"id":"S2-T16","term":"Десмосома","section":0,"def":"Межклеточный контакт, к которому с цитоплазматической стороны прикреплены промежуточные филаменты."},{"id":"S2-T17","term":"Гемидесмосома","section":0,"def":"Контакт клетки с внеклеточным матриксом, к которому прикреплены промежуточные филаменты."},{"id":"S2-T18","term":"Клеточный кортекс","section":0,"def":"Сеть актиновых филаментов и связанных белков под плазматической мембраной; определяет форму поверхности и её натяжение."},{"id":"S2-T19","term":"Центр организации микротрубочек (ЦОМТ)","section":0,"def":"Место в клетке, где нуклеируются микротрубочки и закреплены их минус-концы."},{"id":"S2-T20","term":"Центросома","section":0,"def":"Главный центр организации микротрубочек большинства животных клеток: пара центриолей и окружающий перицентриолярный материал."},{"id":"S2-T21","term":"Центриоль","section":0,"def":"Цилиндрическая органелла из девяти триплетов микротрубочек; две центриоли входят в центросому, центриоль может стать базальным тельцем."},{"id":"S2-T22","term":"Перицентриолярный материал","section":0,"def":"Белковый матрикс вокруг центриолей, содержащий γ-тубулиновые кольцевые комплексы."},{"id":"S2-T23","term":"γ-Тубулиновый кольцевой комплекс (γ-TuRC)","section":0,"def":"Кольцо из γ-тубулина и связанных белков, на котором нуклеируется минус-конец микротрубочки."},{"id":"S2-T24","term":"Базальное тельце","section":0,"def":"Структура в основании реснички или жгутика, происходящая из центриоли; от неё растут микротрубочки реснички."},{"id":"S2-T25","term":"Ресничка","section":0,"def":"Выступ поверхности клетки, покрытый мембраной, с каркасом из микротрубочек; подвижные реснички бьются, первичная ресничка воспринимает сигналы."},{"id":"S2-T26","term":"Нуклеация","section":0,"def":"Начальный этап образования нового полимера, на котором несколько субъединиц собираются в затравку; в клетке обеспечивается специальными белками."},{"id":"S2-T27","term":"Полимеризация","section":1,"def":"Присоединение субъединиц к концу полимера."},{"id":"S2-T28","term":"Деполимеризация","section":1,"def":"Отделение субъединиц от конца полимера."},{"id":"S2-T29","term":"Свободный пул субъединиц","section":1,"def":"Субъединицы (например, G-актин, димеры тубулина), находящиеся в цитоплазме вне полимера и доступные для сборки."},{"id":"S2-T30","term":"Динамическая нестабильность","section":1,"def":"Чередование периодов роста и быстрого укорочения одной микротрубочки при постоянной концентрации свободного тубулина."},{"id":"S2-T31","term":"Катастрофа микротрубочки","section":1,"def":"Переход микротрубочки от роста к быстрому укорочению."},{"id":"S2-T32","term":"Спасение микротрубочки","section":1,"def":"Переход микротрубочки от укорочения к росту до полной разборки."},{"id":"S2-T33","term":"ГТФ-шапочка","section":1,"def":"Участок у растущего конца микротрубочки из субъединиц тубулина, ещё не гидролизовавших ГТФ; защищает конец от быстрой разборки."},{"id":"S2-T34","term":"ГТФ и ГДФ","section":1,"def":"Гуанозинтрифосфат и гуанозиндифосфат; нуклеотиды, связанные с тубулином; ГДФ образуется при гидролизе ГТФ."},{"id":"S2-T35","term":"Гидролиз нуклеотида","section":1,"def":"Отщепление концевой фосфатной группы от АТФ или ГТФ с участием воды; в полимерах актина и тубулина происходит после встраивания субъединицы."},{"id":"S2-T36","term":"Белки плюс-конца (+TIP)","section":1,"def":"Белки, связывающиеся с растущим плюс-концом микротрубочки и регулирующие его динамику."},{"id":"S2-T37","term":"EB1","section":1,"def":"Белок, связывающийся с концом микротрубочки (от англ. end-binding); белок плюс-конца, узнающий участок стенки у растущего конца микротрубочки и привлекающий другие белки плюс-конца."},{"id":"S2-T38","term":"Фактор катастроф","section":1,"def":"Белок, повышающий частоту катастроф микротрубочек (например, кинезины семейства 13)."},{"id":"S2-T39","term":"Белки, ассоциированные с микротрубочками (MAP)","section":1,"def":"Белки, связывающиеся с микротрубочками и меняющие их устойчивость, динамику или связи с другими структурами."},{"id":"S2-T40","term":"Тредмиллинг","section":1,"def":"Поведение полимера, при котором субъединицы присоединяются к одному концу и с той же скоростью отделяются от другого: длина постоянна, субъединицы проходят через полимер."},{"id":"S2-T41","term":"Таксол (паклитаксел)","section":1,"def":"Вещество из тиса, связывающееся с микротрубочками и стабилизирующее их."},{"id":"S2-T42","term":"Колхицин","section":1,"def":"Вещество из безвременника, связывающее тубулин и вызывающее разборку микротрубочек."},{"id":"S2-T43","term":"Веретено деления","section":1,"def":"Структура из микротрубочек, распределяющая хромосомы между дочерними клетками при делении."},{"id":"S2-T44","term":"Конденсат","section":1,"def":"Скопление молекул в цитоплазме или ядре без окружающей мембраны, в котором определённые белки и другие молекулы сконцентрированы."},{"id":"S2-T45","term":"Моторный белок","section":2,"def":"Белок, который, гидролизуя АТФ, направленно перемещается вдоль филамента и может переносить груз или сдвигать филаменты."},{"id":"S2-T46","term":"АТФ и АДФ","section":2,"def":"Аденозинтрифосфат и аденозиндифосфат; энергия гидролиза АТФ используется моторными белками; актин связывает АТФ и после встраивания гидролизует его до АДФ."},{"id":"S2-T47","term":"Кинезины","section":2,"def":"Семейство моторных белков микротрубочек (у человека 45 генов); большинство движется к плюс-концу, некоторые — к минус-концу, некоторые разбирают концы микротрубочек."},{"id":"S2-T48","term":"Кинезин-1","section":2,"def":"Двухголовый кинезин, движущийся к плюс-концу микротрубочки и переносящий мембранные органеллы и везикулы."},{"id":"S2-T49","term":"Цитоплазматический динеин","section":2,"def":"Крупный моторный белок, не родственный кинезинам, движущийся к минус-концу микротрубочки; куда в клетке попадёт груз, зависит от ориентации микротрубочек."},{"id":"S2-T50","term":"Груз","section":2,"def":"Органелла, везикула, комплекс белков или РНК, переносимые моторным белком."},{"id":"S2-T51","term":"Белок-адаптер груза","section":2,"def":"Белок, связывающий моторный белок с определённым грузом и регулирующий активность мотора."},{"id":"S2-T52","term":"Аксон","section":2,"def":"Длинный отросток нейрона, передающий сигнал к другим клеткам; микротрубочки в нём обращены плюс-концом к окончанию."},{"id":"S2-T53","term":"Дендрит","section":2,"def":"Отросток нейрона, принимающий сигналы; у млекопитающих микротрубочки в нём лежат в обеих ориентациях."},{"id":"S2-T54","term":"Апикальная и базальная стороны","section":2,"def":"Стороны эпителиальной клетки: апикальная обращена в просвет или наружу, базальная — к базальной мембране."},{"id":"S2-T55","term":"Аутоингибирование","section":2,"def":"Выключение белка его собственной частью; у кинезина-1 хвост, прижимаясь к головкам, выключает их, пока нет груза."},{"id":"S2-T56","term":"Миозины","section":3,"def":"Семейство моторных белков актиновых филаментов; почти все движутся к плюс-концу (исключение — миозин VI)."},{"id":"S2-T57","term":"Миозин II","section":3,"def":"Миозин, образующий биполярные нити; стягивает антипараллельные актиновые филаменты в мышце, стрессовых волокнах, кортексе и сократительном кольце."},{"id":"S2-T58","term":"Актомиозиновое сокращение","section":3,"def":"Укорочение структуры, при котором миозин II, гидролизуя АТФ, тянет антипараллельные актиновые филаменты навстречу друг другу."},{"id":"S2-T59","term":"Ламеллиподия","section":3,"def":"Плоский выступ переднего края ползущей клетки, заполненный ветвящейся сетью актиновых филаментов."},{"id":"S2-T60","term":"Броуновский храповик","section":3,"def":"Модель генерации силы полимеризацией: субъединица встраивается в зазор, открытый тепловым колебанием мембраны, и не даёт мембране вернуться."},{"id":"S2-T61","term":"Комплекс Arp2/3","section":3,"def":"Комплекс из семи белков, в том числе двух, родственных актину (Arp2 и Arp3; Arp — actin-related proteins); нуклеирует новый актиновый филамент на боковой поверхности существующего под углом около 70°."},{"id":"S2-T62","term":"Формины","section":3,"def":"Белки, нуклеирующие неразветвлённые актиновые филаменты и остающиеся на растущем плюс-конце."},{"id":"S2-T63","term":"Профилин","section":3,"def":"Белок, связывающий G-актин, ускоряющий замену АДФ на АТФ и доставляющий мономеры к растущим плюс-концам."},{"id":"S2-T64","term":"Кофилин","section":3,"def":"Белок, связывающийся с участками АДФ-актина и ускоряющий разрезание и разборку филаментов."},{"id":"S2-T65","term":"Кэпирующий белок","section":3,"def":"Белок, закрывающий плюс-конец актинового филамента и останавливающий его рост и разборку."},{"id":"S2-T66","term":"Сцепление с подложкой","section":3,"def":"Связь актиновой сети через белки адгезии (интегрины) с внеклеточным матриксом, позволяющая передавать силу на подложку."},{"id":"S2-T67","term":"Ретроградный поток актина","section":3,"def":"Движение актиновой сети от переднего края вглубь клетки, когда сила сборки не передаётся на подложку полностью."},{"id":"S2-T68","term":"Стрессовое волокно","section":3,"def":"Пучок актиновых филаментов с миозином II, связанный концами с контактами клетки с подложкой."},{"id":"S2-T69","term":"Сократительное кольцо","section":3,"def":"Кольцо из актина и миозина II под мембраной, перешнуровывающее клетку при делении."},{"id":"S2-T70","term":"Авторегуляция синтеза","section":3,"def":"Зависимость синтеза белка от количества его собственной свободной формы (отрицательная обратная связь)."},{"id":"S2-T71","term":"MRTF","section":3,"def":"Фактор транскрипции, родственный миокардину: белок, который удерживается в цитоплазме свободным G-актином и, переходя в ядро, когда G-актина мало, вместе с SRF усиливает работу генов цитоскелета."},{"id":"S2-T72","term":"мРНК","section":3,"def":"Матричная РНК: копия гена, по которой рибосома синтезирует белок."},{"id":"S2-T73","term":"TTC5","section":3,"def":"Белок с тетратрикопептидными повторами 5, узнающий начало растущей цепи тубулина на рибосоме и запускающий разрушение мРНК тубулина при избытке свободного тубулина."},{"id":"S2-T74","term":"Фенотип","section":4,"def":"Совокупность наблюдаемых признаков клетки или организма."},{"id":"S2-T75","term":"Мишень","section":1,"def":"В задаче о динамике микротрубочек: место в клетке, до которого может дорасти плюс-конец микротрубочки (например, участок мембраны)."},{"id":"S2-T76","term":"Клеточная полярность","section":2,"def":"Различие свойств и состава частей клетки (например, апикальной и базальной сторон, аксона и дендритов)."},{"id":"S2-T77","term":"Механическая сила","section":3,"def":"В клетке: воздействие одной структуры на другую, способное сдвинуть или деформировать её (например, толчок мембраны растущей сетью актина, стягивание миозином)."},{"id":"S2-T78","term":"Фосфорилирование","section":0,"def":"Присоединение фосфатной группы к белку; меняет свойства белка, например вызывает разборку промежуточных филаментов при делении клетки."},{"id":"S2-T79","term":"Аппарат Гольджи","section":0,"def":"Стопка уплощённых мембранных цистерн, где модифицируются и сортируются белки; во многих клетках служит также центром организации микротрубочек."},{"id":"S2-T80","term":"Рибосома","section":3,"def":"Частица из РНК и белков, синтезирующая белок по мРНК."},{"id":"S2-T81","term":"Лизосома","section":2,"def":"Мембранная органелла с ферментами расщепления; переносится моторными белками по микротрубочкам."},{"id":"S2-T82","term":"Белок спасения","section":1,"def":"Белок, повышающий частоту спасений микротрубочек, то есть прерывающий их укорочение."},{"id":"S2-T83","term":"SRF","section":3,"def":"Фактор сывороточного ответа: белок, связывающийся с регуляторными участками генов актина и других белков цитоскелета; вместе с MRTF усиливает их работу."}],"sources":{"src_01":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 16 «The Cytoskeleton»","doi":"","pmid":""},"src_02":{"url":"https://doi.org/10.1038/s41580-022-00473-y","cite":"Akhmanova A., Kapitein L. C. Mechanisms of microtubule organization in differentiated animal cells. Nat. Rev. Mol. Cell Biol. 2022; 23: 541–558","doi":"10.1038/s41580-022-00473-y","pmid":""},"src_03":{"url":"https://doi.org/10.1038/s41580-022-00508-4","cite":"Lappalainen P., Kotila T., Jégou A., Romet-Lemonne G. Biochemical and mechanical regulation of actin dynamics. Nat. Rev. Mol. Cell Biol. 2022; 23: 836–852","doi":"10.1038/s41580-022-00508-4","pmid":""},"src_04":{"url":"https://doi.org/10.1038/s41556-022-01033-4","cite":"Song X., Yang F., Yang T. et al. Phase separation of EB1 guides microtubule plus-end dynamics. Nat. Cell Biol. 2023; 25: 79–91","doi":"10.1038/s41556-022-01033-4","pmid":""},"src_05":{"url":"https://doi.org/10.1038/s41580-024-00780-6","cite":"Yildiz A. Mechanism and regulation of kinesin motors. Nat. Rev. Mol. Cell Biol. 2025; 26: 86–103","doi":"10.1038/s41580-024-00780-6","pmid":""},"src_06":{"url":"https://doi.org/10.1038/s41580-022-00480-z","cite":"Kalukula Y., Stephens A. D., Lammerding J., Gabriele S. Mechanics and functional consequences of nuclear deformations. Nat. Rev. Mol. Cell Biol. 2022; 23: 583–602","doi":"10.1038/s41580-022-00480-z","pmid":""},"src_07":{"url":"https://doi.org/10.1038/s12276-025-01615-w","cite":"Cho Y., Kim Y. K. Multilayered regulation of cytoskeletal protein abundance: autoregulatory mechanisms of actin and tubulin. Exp. Mol. Med. 2026; 58: 59–72","doi":"10.1038/s12276-025-01615-w","pmid":""}},"questions":["Три системы","Динамика микротрубочек","Моторные белки","Актин и сила"],"exam_ids":["three-systems","actin-filament","microtubule-structure","intermediate-filaments","centrosome","mechanics-shared","gtp-cap","mt-orientation","brownian-ratchet","actomyosin"],"practice_url":"seminar-2.html","open_questions":[]};

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

};

const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);
const lvlTag = (v) => `<span class="lvl lvl${v < 0 ? 'x' : v}">${esc(lvl(v))}</span>`;
function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');
    d += rect(x0, y, W, 26, '#eef3f7', 6, 'stroke="#c8d6e2"');
    if (r.v >= 0) d += rect(x0, y, W * (r.v / 3), 26, r.cls === 'warn' ? '#c3662f' : '#145c96', 6, r.v === 0 ? 'opacity=".0"' : '');
    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');
  });
  return svg(d, U.chart_levels, h, w);
}
/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

/* ---------- оглавление ---------- */
const hay = l => [l.title, l.lead.join(' '), l.paragraphs.map(p => typeof p === 'string' ? p : p.ul ? p.ul.join(' ') : p.h || ((p.details || '') + ' ' + (p.text || ''))).join(' '), (l.quiz ? l.quiz.question : ''), ...(l.keywords || [])].join(' ').toLowerCase();
function renderNav() {
  const q = ($('search').value || '').trim().toLowerCase(), n = stepsDone(), N = CONTENT.lessons.length;
  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  const BL = CONTENT.lessons.filter(l => l.level !== 'adv'), nb = BL.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;   /* базовые шаги (курс «Биология», А1-22) */
  let html = `<div class="progress">${esc(U.progress_label)}: <b>${n} ${esc(U.of)} ${N}</b><progress value="${n}" max="${N}" aria-label="${esc(U.progress_label)}"></progress>` +
    (U.viewed_label ? `<div class="viewed-stat">${esc(U.viewed_label)}: <b>${CONTENT.lessons.filter(l => store.steps[l.id] && (store.steps[l.id].read || store.steps[l.id].correct)).length} ${esc(U.of)} ${N}</b></div>` : '') +
    `<div class="exam-stat">${esc(U.exam_stat_label)}: <b>${exOk} ${esc(U.of)} ${CONTENT.exam_ids.length}</b>${exTries ? ` · ${esc(fmt(U.exam_tries, {n: exTries}))}` : ''}</div>` +
    (U.base_progress && BL.length < N ? `<div class="base-stat">${esc(U.base_progress)}: <b>${nb} ${esc(U.of)} ${BL.length}</b></div>` : '') +
    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {
    const ls = CONTENT.lessons.filter(l => l.section === i && (!q || hay(l).includes(q)));
    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${ncap(s.title)}</div>` + ls.map(l => {
      const done = store.steps[l.id] && store.steps[l.id].correct, seen = !done && store.steps[l.id] && store.steps[l.id].read;
      return `<button data-nav="${l.id}" class="${l.id === current ? 'active' : ''}"${l.id === current ? ' aria-current="page"' : ''}><span class="tick" aria-hidden="true">${done ? '✓' : seen ? '◐' : '○'}</span><span class="sr">${esc(done ? U.done : seen ? (U.viewed || U.notdone) : U.notdone)}: </span>${esc(l.title)}${l.level === 'adv' && (l.badge || U.adv_badge) ? ` <span class="lvl">${esc(l.badge || U.adv_badge)}</span>` : ''}</button>`;
    }).join('');
  });
  if (q && !any) html += `<p class="empty">${esc(U.no_match)}</p>`;
  $('nav').innerHTML = html;
  $('nav').querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
  const r = $('reset-progress'); if (r) r.onclick = () => { store = {v: 1, steps: {}, exam: {}}; save(); if (current === 'exam') renderExam(); else if (lessonById(current)) renderLesson(lessonById(current)); };
}
function navigate(id) {
  let target = id, anchor = '';
  if (id.indexOf('glossary-') === 0) { anchor = id.slice(9); target = 'glossary'; }
  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  saveLast(want, 0);
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);
  else if (target === 'exam') renderExam(); else if (target === 'all') renderAll(); else renderLesson(lessonById(target));
  if (anchor) { const el = $('g-' + anchor); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
  else window.scrollTo({top: 0, behavior: 'instant'});
  if (!anchor) $('main').focus({preventScroll: true});
  document.title = (lessonById(target) ? lessonById(target).title + ' — ' : '') + U.page_title;
}

/* ---------- элементы шага ---------- */
function sourcesHtml(l) {
  return `<details class="sources" id="src-${l.id}"><summary>${esc(U.src_summary)}</summary>` +
    `<ul class="src-list">${l.sources.map(k => { const s = CONTENT.sources[k]; return s.url ? `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)} ↗</a></li>` : `<li>${esc(s.cite)}</li>`; }).join('')}</ul>` +
    `<p>${rt(l.conditions)}</p></details>`;
}
function quizHtml(l, scope = 'quiz') {
  const q = l.quiz, ord = optionOrder(l);
  const done = scope === 'quiz' && store.steps[l.id] && store.steps[l.id].correct;
  return `<section class="quiz" id="${scope}-${l.id}" aria-labelledby="${scope}-${l.id}-q"><div class="eyebrow">${esc(U.quiz_eyebrow)}</div><h3 id="${scope}-${l.id}-q">${rt(q.question)}</h3>` +
    `<div class="answers" role="group" aria-labelledby="${scope}-${l.id}-q">${ord.map((id, i) => `<button data-answer="${id}"><b aria-hidden="true">${LETTERS[i]}</b><span>${rt(optById(l, id).text)}</span></button>`).join('')}</div>` +
    `<div class="quiz-feedback" aria-live="polite">${done ? `<p class="quiet">${esc(U.quiz_done_before)}</p>` : ''}</div></section>`;
}
function bindQuiz(l, scope = 'quiz') {
  const boxEl = $(`${scope}-${l.id}`); let last = null;
  boxEl.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
    const id = b.dataset.answer, o = optById(l, id), ok = !!o.correct;
    boxEl.querySelectorAll('[data-answer]').forEach(x => { x.classList.remove('correct', 'wrong'); x.setAttribute('aria-pressed', String(x === b)); });
    b.classList.add(ok ? 'correct' : 'wrong');
    boxEl.querySelector('.quiz-feedback').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${esc(ok ? U.fb_ok : U.fb_bad)}</strong> ${rt(o.feedback)}` +
      (scope === 'exam' ? `<p><button data-return="${l.id}">${esc(U.open_expl)}</button></p>` : '') + `</div>`;
    const rec = (scope === 'exam' ? store.exam : store.steps);
    const r = rec[l.id] || (rec[l.id] = {attempts: 0, first: null, correct: false, rev: qrev(l)});
    if (last !== id) { r.attempts = (r.attempts || 0) + 1; if (r.first === null) r.first = ok; }
    last = id;
    if (ok) r.correct = true;
    save();
    const ret = boxEl.querySelector('[data-return]'); if (ret) ret.onclick = () => navigate(l.id);
  });
}
/* печатная копия вопроса и разбора всех вариантов */

function renderLesson(l) {

  if (nb > i + 1 && !l.back) $('nextbase').onclick = () => navigate(l.next_base || CONTENT.lessons[nb].id);

  $('main').querySelectorAll('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); const el = $(a.dataset.jump); if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({block: 'start'}); const f = el.querySelector('button,summary,a'); if (f) f.focus({preventScroll: true}); } });
  /* семинар 11 (решение автора 16.11.2026, п. 1): открытие шага отмечается как «просмотрен», а не как выполнение задания;
     «понимание проверено» — после верного ответа на вопрос шага. Навигация не блокируется. */
  { const r = store.steps[l.id]; if (!r) { store.steps[l.id] = {attempts: 0, first: null, correct: false, read: true, rev: qrev(l)}; save(); } else if (!r.read) { r.read = true; save(); } }
  if (l.quiz) bindQuiz(l);
  if (l.widget) initWidget(l);
  /* каркас с 23.10.2026 (из сем. 9; включается ключами ui.zoom_in/zoom_out/zoom_area, как «Увеличить схему» в практикумах): на телефоне схему можно увеличить и прокручивать в её рамке */
  const zb = $('widget-zoom');
  if (zb) zb.onclick = () => { const on = !$('widget-drawing').classList.contains('zoomed'); $('widget-drawing').classList.toggle('zoomed', on); zb.setAttribute('aria-pressed', String(on)); zb.textContent = on ? U.zoom_out : U.zoom_in; if (on) $('widget-drawing').setAttribute('aria-label', U.zoom_area); else $('widget-drawing').removeAttribute('aria-label'); $('widget-drawing').scrollLeft = 0; };
  /* схема на телефоне увеличена по умолчанию, если шаг просит (w.zoomNarrow): подписи читаются без ручного увеличения */
  if (zb && l.widget && l.widget.zoomNarrow && window.matchMedia && matchMedia('(max-width:700px)').matches) zb.click();
}
function initWidget(l) {
  const w = l.widget, fn = W[w.kind], s = state[l.id] || (state[l.id] = {});
  if (!fn) { $('widget-title').textContent = w.title; return; }
  const set = (title, status, controls) => { $('widget-title').textContent = title; $('widget-status').textContent = status; $('widget-controls').innerHTML = controls; };
  const out = (drawing, text) => { $('widget-drawing').innerHTML = drawing; $('widget-result').innerHTML = text; };
  const onRange = (id, f) => { $(id).oninput = () => { $(id + '-value').textContent = $(id).value + ($(id).dataset.unit || ''); f(Number($(id).value)); }; };
  const onSelect = (id, f) => { $(id).onchange = () => f(Number($(id).value)); };
  const onCheck = (id, f) => { $(id).onchange = () => f($(id).checked); };
  const onGroup = (id, f) => { $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); f(Number(b.dataset.choice)); }); };
  fn({l, w, S: w.s, s, set, out, onRange, onSelect, onCheck, onGroup});
}
