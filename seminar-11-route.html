<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-11.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Регуляция экспрессии генов</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-one-genome"><div class="eyebrow">Введение · шаг 1 из 33</div><h2>Один геном, разные клетки</h2><p class="lead"></p><ol class="mech"></ol><p>Нейрон и лейкоцит одного человека содержат практически одинаковую последовательность ДНК, но различаются формой, функциями и набором белков. Различия создаются не разной ДНК, а тем, какие гены и с какой интенсивностью экспрессируются. <a href="#ns-g-S11-T62">Экспрессия гена</a> — использование записанной в нём информации для синтеза функционального продукта: РНК или белка.</p><p>Многие белки нужны почти всем клеткам: белки <a href="#ns-g-S11-T13">рибосом</a>, ферменты основных путей обмена, белки цитоскелета. Их количество тем не менее различается в клетках разных типов. Другие белки синтезируются только в клетках определённого типа и обеспечивают их специализированные функции. Дифференцировка клеток — результат изменения экспрессии генов, а не изменения последовательности нуклеотидов. Положение об одинаковом геноме всех клеток — рабочая модель: в лимфоцитах, например, при созревании перестраиваются гены антител и рецепторов T-клеток.</p><p>Набор экспрессируемых генов изменяется и в клетках одного типа — в ответ на внеклеточные <a href="#ns-g-S11-T12">сигналы</a>. Так, глюкокортикоиды в гепатоцитах увеличивают синтез тирозинаминотрансферазы — фермента распада тирозина.</p><div class="static-quiz"><h3>Нейрон и лейкоцит одного человека содержат практически одинаковую ДНК. Почему в них разные наборы белков?</h3><ol><li><b>А.</b> В них экспрессируются разные гены и с разной интенсивностью <i>(верный вариант)</i><br><span class="expl">Различия создаёт регуляция экспрессии: одна и та же последовательность ДНК используется по-разному. Дифференцировка — результат изменения экспрессии генов, а не последовательности нуклеотидов.</span></li><li><b>Б.</b> При дифференцировке каждая клетка утрачивает ненужные ей гены <i>(неверный вариант)</i><br><span class="expl">Гены в клетках разных типов сохраняются; различается, какие из них транскрибируются. Перестройка генов антител в лимфоцитах — редкое исключение, а не общий механизм.</span></li><li><b>В.</b> Белки, нужные всем клеткам, синтезируются в одинаковом количестве, различаются только специализированные <i>(неверный вариант)</i><br><span class="expl">Даже у белков, нужных почти всем клеткам, — рибосомных белков, ферментов основного обмена, белков цитоскелета — количество в клетках разных типов различается.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-11.html#q1">Вопрос 1 →</a> <a href="seminar-11.html#q2">Вопрос 2 →</a> <a href="seminar-11.html#q3">Вопрос 3 →</a> <a href="seminar-11.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-levels"><div class="eyebrow">Введение · шаг 2 из 33</div><h2>Уровни регуляции экспрессии</h2><p class="lead"></p><ol class="mech"></ol><p>Количество и активность продукта гена регулируются на нескольких уровнях, связанных в одну цепь:</p><p>1. <a href="#ns-g-S11-T33">доступность хроматина</a> — могут ли белки транскрипции связаться с <a href="#ns-g-S11-T50">промотором</a> и регуляторными участками;</p><p>2. наличие и активность факторов транскрипции;</p><p>3. взаимодействие регуляторных последовательностей с промотором;</p><p>4. частота инициации транскрипции;</p><p>5. процессинг пре-мРНК, экспорт <a href="#ns-g-S11-T07">мРНК</a> из ядра и её стабильность (вспомнить: <a href="seminar-9-route.html#primary-transcript">семинар 9: «Первичный транскрипт и котранскрипционный процессинг»</a>);</p><p>6. эффективность трансляции (вспомнить: <a href="seminar-10-route.html#initiation">семинар 10: «Инициация: малая субчастица находит старт-кодон, инициаторная тРНК — в P-сайте»</a>);</p><p>7. стабильность, распад и функциональное состояние белка.</p><p>Изменение на любом уровне может изменить итог, а одинаковый итог может возникнуть при изменениях на разных уровнях. Поэтому, чтобы установить, где изменилась экспрессия, нужно измерять промежуточные этапы, а не только конечный результат.</p><div class="static-quiz"><h3>Количество активного белка гена уменьшилось вдвое. Почему по одному этому измерению нельзя сказать, на каком уровне изменилась экспрессия?</h3><ol><li><b>А.</b> Потому что экспрессия регулируется только на уровне транскрипции, а её по белку не видно <i>(неверный вариант)</i><br><span class="expl">Транскрипция — лишь один из уровней: количество белка зависит ещё от процессинга, стабильности мРНК, трансляции и распада белка.</span></li><li><b>Б.</b> Одинаковое уменьшение может возникнуть на любом уровне — от доступности хроматина до состояния готового белка <i>(верный вариант)</i><br><span class="expl">Уровни связаны в одну цепь, и изменение любого звена меняет итог. Чтобы найти звено, измеряют промежуточные этапы, а не только конечный результат.</span></li><li><b>В.</b> Потому что активность белка не зависит от экспрессии гена <i>(неверный вариант)</i><br><span class="expl">Активный белок — конечный продукт экспрессии; он зависит от всех предшествующих уровней, поэтому и не указывает однозначно, какой из них изменился.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-11.html#q1">Вопрос 1 →</a> <a href="seminar-11.html#q2">Вопрос 2 →</a> <a href="seminar-11.html#q3">Вопрос 3 →</a> <a href="seminar-11.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p>Обзорный шаг: источники — в шагах темы.</p></details></article><article class="card print-unit" id="ns-operon"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 3 из 33</div><h2>Оперон</h2><p class="lead"></p><ol class="mech"></ol><p>У бактерий гены нескольких ферментов одного метаболического пути часто расположены подряд и транскрибируются с одного промотора в составе одной молекулы мРНК. Такую единицу называют <a href="#ns-g-S11-T46">опероном</a>, а мРНК — <a href="#ns-g-S11-T21">полицистронной</a>: в ней несколько кодирующих областей, и трансляция каждой начинается со своего участка связывания рибосомы.</p><p>lac-оперон кишечной палочки включает промотор, <a href="#ns-g-S11-T45">оператор</a> и три структурных гена: &lt;i&gt;lacZ&lt;/i&gt; (<a href="#ns-g-S11-T29">β-галактозидаза</a> — расщепляет лактозу на глюкозу и галактозу), &lt;i&gt;lacY&lt;/i&gt; (пермеаза — переносит лактозу в клетку) и &lt;i&gt;lacA&lt;/i&gt; (<a href="#ns-g-S11-T23">трансацетилаза</a>). Рядом находится ген &lt;i&gt;<a href="#ns-g-S11-T15">lacI</a>&lt;/i&gt;; он кодирует <a href="#ns-g-S11-T54">репрессор</a>, имеет собственный промотор и транскрибируется отдельно, постоянно и с низкой интенсивностью.</p><p>Поскольку гены оперона транскрибируются вместе, их экспрессия изменяется согласованно.</p><div class="static-quiz"><h3>Почему количества продуктов генов lacZ, lacY и lacA изменяются согласованно?</h3><ol><li><b>А.</b> У каждого гена собственный промотор с одинаковой последовательностью <i>(неверный вариант)</i><br><span class="expl">В опероне промотор один; именно поэтому изменяется транскрипция всех трёх генов сразу.</span></li><li><b>Б.</b> Ген lacI транскрибируется вместе с ними и регулирует каждый по отдельности <i>(неверный вариант)</i><br><span class="expl">Ген lacI имеет собственный промотор и транскрибируется отдельно; его продукт — репрессор — действует на один общий оператор.</span></li><li><b>В.</b> Гены транскрибируются с одного промотора в составе одной мРНК <i>(верный вариант)</i><br><span class="expl">Оперон — одна единица транскрипции: полицистронная мРНК несёт три кодирующие области, поэтому изменение транскрипции меняет синтез всех трёх продуктов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1128/mBio.02232-19">Phillips K. N., Widmann S., Lai H.-Y., Nguyen J., Ray J. C. J., Balázsi G., Cooper T. F. Diversity in lac operon regulation among diverse Escherichia coli isolates depends on the broader genetic background but is not explained by genetic relatedness. mBio. 2019;10(6):e02232-19.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-lac-negative"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 4 из 33</div><h2>Отрицательная регуляция: репрессор, оператор, индуктор</h2><p class="lead"></p><ol class="mech"></ol><p>Оператор — участок ДНК рядом с началом транскрипции, с которым связывается белок-репрессор LacI. Пока репрессор связан с оператором, <a href="#ns-g-S11-T72">РНК-полимераза</a> транскрибирует оперон лишь изредка: в клетке есть небольшое количество ферментов оперона (<a href="#ns-g-S11-T28">базальная транскрипция</a>). Это отрицательная регуляция — регуляторный белок подавляет транскрипцию.</p><p>Когда в среде появляется лактоза, она поступает в клетку, и из неё образуется изомер — <a href="#ns-g-S11-T24">аллолактоза</a>. Аллолактоза связывается с репрессором и изменяет его конформацию; сродство репрессора к оператору резко снижается, и он отделяется от ДНК. Аллолактоза — физиологический <a href="#ns-g-S11-T35">индуктор</a> lac-оперона: малая молекула, снимающая репрессию.</p><p>Важно, что физически изменяется не ДНК, а белок на ДНК: индуктор действует на репрессор, а не на оператор. Когда лактоза исчерпана, репрессор вновь связывается с оператором.</p><p>У lac-оперона есть ещё два дополнительных оператора; репрессор может связывать два оператора одновременно, образуя петлю ДНК, что усиливает репрессию.</p><div class="static-quiz"><h3>Что изменяется, когда аллолактоза освобождает оператор?</h3><ol><li><b>А.</b> Конформация репрессора: его сродство к оператору резко снижается <i>(верный вариант)</i><br><span class="expl">Индуктор действует на белок, а не на ДНК. Изменённый репрессор отделяется от оператора, и РНК-полимераза может транскрибировать оперон.</span></li><li><b>Б.</b> Последовательность оператора, и репрессор перестаёт её узнавать <i>(неверный вариант)</i><br><span class="expl">ДНК оператора не изменяется: когда лактоза исчерпана, репрессор вновь связывается с тем же участком.</span></li><li><b>В.</b> Активность РНК-полимеразы, которая сама сталкивает репрессор <i>(неверный вариант)</i><br><span class="expl">Аллолактоза связывается с репрессором. РНК-полимеразе мешает репрессор на операторе, а не её собственная активность.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1128/mBio.02232-19">Phillips K. N., Widmann S., Lai H.-Y., Nguyen J., Ray J. C. J., Balázsi G., Cooper T. F. Diversity in lac operon regulation among diverse Escherichia coli isolates depends on the broader genetic background but is not explained by genetic relatedness. mBio. 2019;10(6):e02232-19.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-lac-positive"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 5 из 33</div><h2>Положительная регуляция: CAP–цАМФ. Действие глюкозы</h2><p class="lead"></p><ol class="mech"></ol><p>Без активатора промотор lac-оперона инициирует транскрипцию неэффективно, даже если оператор свободен. Инициацию облегчает <a href="#ns-g-S11-T25">белок-активатор</a> <a href="#ns-g-S11-T36">CAP</a> (белок-активатор катаболитных генов), но только в комплексе с циклическим аденозинмонофосфатом (<a href="#ns-g-S11-T59">цАМФ</a>). Комплекс CAP–цАМФ связывается с участком ДНК рядом с промотором и непосредственно контактирует с РНК-полимеразой. Это положительная регуляция.</p><p>Когда в среде есть глюкоза, в клетке мало цАМФ, и CAP с ДНК не связывается. Кроме того, при переносе глюкозы в клетку белок её транспортной системы подавляет <a href="#ns-g-S11-T47">пермеазу лактозы</a> и тем уменьшает поступление лактозы (а значит, и образование индуктора). Глюкоза, таким образом, снижает транскрипцию оперона несколькими путями, а не только через цАМФ.</p><p>Поэтому снятие репрессии и максимальная транскрипция — разные состояния. Если лактоза и глюкоза есть одновременно, транскрипция ниже максимальной: положительной регуляции нет, а поступление лактозы уменьшено, и оператор может в значительной мере оставаться занятым. Даже когда лактозы достаточно, чтобы освободить оператор, без CAP–цАМФ транскрипция лишь умеренная. Высокая транскрипция достигается, когда оператор свободен и CAP–цАМФ связан с ДНК, — при лактозе и низком количестве глюкозы.</p><p>Регуляция не двоичная: интенсивность транскрипции изменяется постепенно и зависит от количества индуктора и цАМФ, а у разных штаммов кишечной палочки различается.</p><div class="static-quiz"><h3>В среде есть лактоза и глюкоза; лактозы достаточно, чтобы освободить оператор. Почему транскрипция всё же ниже максимальной?</h3><ol><li><b>А.</b> Глюкоза связывается с репрессором и возвращает его на оператор <i>(неверный вариант)</i><br><span class="expl">Глюкоза с репрессором не связывается; по условию оператор свободен. Глюкоза действует через количество цАМФ и поступление лактозы.</span></li><li><b>Б.</b> При глюкозе в клетке мало цАМФ, CAP–цАМФ не связан с ДНК, а без активатора промотор инициирует транскрипцию неэффективно <i>(верный вариант)</i><br><span class="expl">Снятие репрессии делает транскрипцию возможной, но её интенсивность зависит ещё и от положительной регуляции. Высокая транскрипция требует обоих событий.</span></li><li><b>В.</b> Комплекс CAP–цАМФ при глюкозе подавляет транскрипцию <i>(неверный вариант)</i><br><span class="expl">CAP–цАМФ — активатор, облегчающий инициацию. При глюкозе его на ДНК нет, поэтому и нет усиления транскрипции.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1128/mBio.02232-19">Phillips K. N., Widmann S., Lai H.-Y., Nguyen J., Ray J. C. J., Balázsi G., Cooper T. F. Diversity in lac operon regulation among diverse Escherichia coli isolates depends on the broader genetic background but is not explained by genetic relatedness. mBio. 2019;10(6):e02232-19.</a></li><li><a href="https://doi.org/10.1016/j.synbio.2026.08.005">Lu M., Ding H., Zhang H., Xu J., Meng R., Li Y., Zhang Z., Zheng P., Zhu Y., Sun J. Strategies and applications for alleviating carbon catabolite repression. Synth. Syst. Biotechnol. 2027;18:25–39 (онлайн — 2026).</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-operon-limits"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 6 из 33</div><h2>Чем оперон полезен и где его границы</h2><p class="lead"></p><ol class="mech"></ol><p>Оперон показывает общий принцип регуляции транскрипции: белок связывается с определённой последовательностью ДНК, а его активность изменяет малая молекула или сигнал. Этот принцип действует и у эукариот.</p><p>Но устройство генов человека другое. Оперонов, как правило, нет: каждый ген имеет собственный промотор, и большинство мРНК содержит одну основную кодирующую область. ДНК упакована в хроматин, поэтому доступность промотора — отдельный уровень регуляции (БИО-11·10). Регуляторные участки могут находиться на расстоянии десятков и сотен тысяч пар нуклеотидов от промотора, и с ними связываются многие разные белки (БИО-11·17). Поэтому модель оперона нельзя переносить на гены человека без изменений.</p><div class="static-quiz"><h3>Какой вывод из модели оперона можно перенести на гены человека?</h3><ol><li><b>А.</b> Гены человека, кодирующие ферменты одного пути, объединены в опероны с общим промотором <i>(неверный вариант)</i><br><span class="expl">Оперонов у человека, как правило, нет: каждый ген имеет собственный промотор, и большинство мРНК содержит одну основную кодирующую область.</span></li><li><b>Б.</b> Доступность промотора не влияет на транскрипцию, как у бактерий <i>(неверный вариант)</i><br><span class="expl">У эукариот ДНК упакована в хроматин, поэтому доступность промотора — отдельный уровень регуляции, которого в модели оперона нет.</span></li><li><b>В.</b> Белок, связанный с определённой последовательностью ДНК, изменяет транскрипцию, а его активность изменяет малая молекула или сигнал <i>(верный вариант)</i><br><span class="expl">Это общий принцип. Устройство генов человека другое: у каждого гена свой промотор, ДНК упакована в хроматин, регуляторные участки бывают удалены от промотора.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p>Источник: MBoC7, с. 412–415.</p></details></article><article class="card print-unit" id="ns-a1-two-inputs"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 7 из 33</div><h2>Снятие репрессии и интенсивность транскрипции</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·4, БИО-11·5</p><p>В модели исследования 1 интенсивность транскрипции lac-оперона — произведение двух независимых величин: доли времени, когда оператор свободен, и положительной регуляции. Поэтому свободный оператор без CAP–цАМФ даёт лишь десятую часть максимума, а промежуточные количества индуктора дают промежуточную интенсивность. Глюкоза действует на оба множителя: уменьшает цАМФ и поступление лактозы.</p><p>Обратная задача модели показывает главное: одинаковую невысокую транскрипцию дают дикий тип при избытке лактозы и глюкозе, мутант без CAP, мутант без репрессора при глюкозе и двойной мутант. Состояние оператора и отсутствие CAP на ДНК у них одинаковы; различают их удаление глюкозы и, отдельно, удаление лактозы, а также количество цАМФ.</p><p>Новые данные. Правило, по которому два сигнала определяют транскрипцию оперона, различается у штаммов кишечной палочки, выделенных из природы: один индуктор даёт у разных штаммов от 18 до 83 % максимальной транскрипции, у части штаммов транскрипция слабо зависит от цАМФ, и даже у лабораторного штамма зависимость промежуточная между «нужны оба сигнала» и «достаточно одного». Какое правило действует, определяется и генами оперона, и остальным геномом бактерии. Модель практикума — упрощение одного варианта.</p><div class="static-quiz"><h3>По модели исследования 1 оператор свободен всё время, а транскрипция — 10 из 100. Чего не хватает до максимума?</h3><ol><li><b>А.</b> Положительной регуляции: CAP–цАМФ не связан с ДНК <i>(верный вариант)</i><br><span class="expl">Интенсивность — произведение доли времени со свободным оператором и положительной регуляции: 100 × 1 × 0,1 = 10.</span></li><li><b>Б.</b> Индуктора: в клетке нет лактозы <i>(неверный вариант)</i><br><span class="expl">Без индуктора оператор был бы занят репрессором большую часть времени, а он свободен всё время.</span></li><li><b>В.</b> Ничего: 10 из 100 — максимум при свободном операторе <i>(неверный вариант)</i><br><span class="expl">Максимум модели — 100; он достигается, только когда оператор свободен и CAP–цАМФ связан с ДНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1128/mBio.02232-19">Phillips K. N., Widmann S., Lai H.-Y., Nguyen J., Ray J. C. J., Balázsi G., Cooper T. F. Diversity in lac operon regulation among diverse Escherichia coli isolates depends on the broader genetic background but is not explained by genetic relatedness. mBio. 2019;10(6):e02232-19.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-lac-feedback"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 8 из 33</div><h2>Положительная обратная связь lac-оперона</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·4, БИО-11·5</p><p>Пермеаза и β-галактозидаза синтезируются с самого lac-оперона, а пермеаза переносит индуктор в клетку. Чем больше в клетке пермеазы, тем больше индуктора поступает, тем полнее снимается репрессия и тем больше синтезируется новой пермеазы. Так возникает <a href="#ns-g-S11-T70">положительная обратная связь</a>: продукт оперона усиливает синтез продуктов самого оперона.</p><p>Обратная связь действует и в обратную сторону. Бактерии выращивали на глицерине в присутствии нерасщепляемого индуктора, и оперон был полностью индуцирован. После добавления глюкозы активность β-галактозидазы в клетках за несколько поколений снизилась примерно в 900 раз. При этом каждое отдельное действие глюкозы было небольшим: уменьшение поступления индуктора (<a href="#ns-g-S11-T71">исключение индуктора</a>) снижало его количество в клетке не более чем в 6 раз, снижение количества цАМФ замедляло синтез ферментов оперона примерно в 3 раза, а ускорение роста, разбавляющее ферменты между дочерними клетками, — лишь в 2 раза. Сильное подавление возникло потому, что эти эффекты усиливались по кругу: меньше индуктора — меньше новой пермеазы — ещё меньше индуктора. Если обратную связь разорвать — у мутантов, транскрибирующих оперон без индуктора, или при избытке индуктора, который проникает в клетку и без пермеазы, — глюкоза почти не подавляет синтез ферментов оперона.</p><p>Какой вклад вносит каждый путь действия глюкозы, продолжают обсуждать; описанный эксперимент выполнен с искусственным индуктором, а не с лактозой. Модель исследования 1 обратной связи не содержит: в ней количество индуктора задано условием задачи.</p><div class="static-quiz"><h3>Почему глюкоза снижала активность β-галактозидазы примерно в 900 раз, хотя каждое её действие по отдельности было небольшим?</h3><ol><li><b>А.</b> Глюкоза разрушает молекулы β-галактозидазы <i>(неверный вариант)</i><br><span class="expl">Активность снижалась постепенно, за несколько поколений: уменьшался синтез ферментов, и они разбавлялись между дочерними клетками.</span></li><li><b>Б.</b> Эффекты усиливались по кругу: меньше индуктора — меньше новой пермеазы — ещё меньше индуктора <i>(верный вариант)</i><br><span class="expl">Продукт оперона, пермеаза, переносит индуктор в клетку, поэтому небольшие эффекты умножаются через положительную обратную связь. Если её разорвать, глюкоза почти не подавляет синтез ферментов.</span></li><li><b>В.</b> Подавление целиком объясняется снижением цАМФ <i>(неверный вариант)</i><br><span class="expl">Снижение цАМФ замедляло синтез ферментов лишь примерно в 3 раза; сильное подавление требует обратной связи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bpj.2022.01.016">Aggarwal R. K., Narang A. Inducer exclusion, by itself, cannot account for the glucose-mediated lac repression of Escherichia coli. Biophys. J. 2022;121(5):820–829.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-trp-operon"><div class="eyebrow">Оперон: отрицательная и положительная регуляция · шаг 9 из 33</div><h2>Репрессия: trp-оперон</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·3, БИО-11·4</p><p>Гены ферментов синтеза триптофана у кишечной палочки также образуют оперон. Его репрессор связывается с оператором, только если присоединил триптофан. Когда триптофана много, оперон транскрибируется редко; когда мало — репрессор неактивен, и ферменты синтезируются. Это отрицательная обратная связь: конечный продукт пути подавляет синтез своих ферментов. У lac-оперона малая молекула снимает репрессию (индукция), у trp-оперона — включает её (репрессия).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Рецепция и молекулярные переключатели — <a href="https://edu.mazunin.science/seminar-3-route.html#receptor-equilibrium">«Молекулярная биология», семинар 3 «Рецепция и молекулярные переключатели»</a>; динамика, обратные связи и интеграция сигналов — <a href="https://edu.mazunin.science/seminar-4-route.html#feedback-vs-termination">«Молекулярная биология», семинар 4 «Динамика, обратные связи и интеграция сигналов»</a></p><div class="static-quiz"><h3>Чем действие триптофана на trp-оперон отличается от действия аллолактозы на lac-оперон?</h3><ol><li><b>А.</b> Триптофан, как аллолактоза, снимает репрессор с оператора <i>(неверный вариант)</i><br><span class="expl">Без триптофана репрессор trp-оперона неактивен; триптофан нужен ему, чтобы связаться с оператором.</span></li><li><b>Б.</b> Триптофан связывается с CAP и усиливает транскрипцию <i>(неверный вариант)</i><br><span class="expl">Триптофан действует через собственный репрессор trp-оперона; при его избытке транскрипция снижается.</span></li><li><b>В.</b> Триптофан включает репрессию: репрессор связывается с оператором, только присоединив триптофан <i>(верный вариант)</i><br><span class="expl">Конечный продукт пути подавляет синтез своих ферментов — отрицательная обратная связь. У lac-оперона малая молекула, наоборот, снимает репрессию.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-nucleosome-access"><div class="eyebrow">Хроматин и доступность · шаг 10 из 33</div><h2>Нуклеосома и доступность ДНК</h2><p class="lead"></p><ol class="mech"></ol><p>Вспомнить: <a href="seminar-3-route.html#chromatin-levels">семинар 3: «Уровни организации хроматина»</a>. Основная единица хроматина — <a href="#ns-g-S11-T44">нуклеосома</a>: около 147 пар нуклеотидов ДНК, обвитых вокруг октамера гистонов (по две молекулы H2A, H2B, H3 и H4). Соседние нуклеосомы соединены <a href="#ns-g-S11-T09">линкерной ДНК</a>.</p><p>ДНК, намотанная на октамер, малодоступна для большинства белков. Нуклеосома на промоторе препятствует связыванию <a href="#ns-g-S11-T17">общих факторов транскрипции</a> и <a href="#ns-g-S11-T08">РНК-полимеразы II</a>; верно и обратное — если аппарат транскрипции уже собран на промоторе, нуклеосома на этом месте не образуется. Нуклеосома и аппарат транскрипции конкурируют за один участок ДНК.</p><p>Доступность участка хроматина — возможность белков связаться с его ДНК. Её изменение — самостоятельный уровень регуляции экспрессии. Доступность различается в клетках разных типов, и доступные участки в основном совпадают с промоторами и другими регуляторными участками.</p><div class="static-quiz"><h3>Почему нуклеосома на промоторе препятствует транскрипции?</h3><ol><li><b>А.</b> ДНК, обвитая вокруг октамера гистонов, малодоступна, и аппарат транскрипции не может собраться на этом участке <i>(верный вариант)</i><br><span class="expl">Нуклеосома и аппарат транскрипции конкурируют за один участок ДНК. Поэтому доступность промотора — самостоятельный уровень регуляции.</span></li><li><b>Б.</b> Гистоны разрушают РНК-полимеразу II <i>(неверный вариант)</i><br><span class="expl">Нуклеосома не разрушает белки, а закрывает от них ДНК.</span></li><li><b>В.</b> Нуклеосома изменяет последовательность нуклеотидов промотора <i>(неверный вариант)</i><br><span class="expl">Последовательность не изменяется; изменяется доступность ДНК для белков.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1080/19491034.2022.2143106">Mansisidor A. R., Risca V. I. Chromatin accessibility: methods, mechanisms, and biological insights. Nucleus. 2022;13(1):236–276.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-remodeling"><div class="eyebrow">Хроматин и доступность · шаг 11 из 33</div><h2>Ремоделирование хроматина</h2><p class="lead"></p><ol class="mech"></ol><p>Положение и состав нуклеосом изменяют <a href="#ns-g-S11-T01">АТФ</a>-зависимые <a href="#ns-g-S11-T38">комплексы ремоделирования хроматина</a>. За счёт энергии гидролиза АТФ они смещают ДНК относительно гистонового октамера: сдвигают нуклеосомы вдоль ДНК, удаляют их или заменяют гистоны их вариантами.</p><p>В разбираемой схеме к нужному гену комплекс ремоделирования привлекают белки, связывающиеся с определённой последовательностью, — например, активаторы транскрипции; у разных комплексов механизмы адресации к участкам ДНК различаются. Так набор активаторов в клетке определяет, какие промоторы станут доступными.</p><p>Сдвиг нуклеосомы делает промотор доступным, но это необходимое, а не достаточное условие транскрипции: на доступном промоторе ещё должен собраться аппарат транскрипции (БИО-11·16).</p><div class="static-quiz"><h3>Почему комплекс ремоделирования хроматина сдвигает нуклеосомы на одних генах и не трогает другие?</h3><ol><li><b>А.</b> Он узнаёт определённую последовательность промотора <i>(неверный вариант)</i><br><span class="expl">В этой схеме к промотору комплекс направляет активатор, связанный со своим участком; собственное узнавание последовательности промотора не объясняет, почему затронуты именно гены с этим активатором.</span></li><li><b>Б.</b> Его привлекают к определённым генам белки, узнающие последовательность ДНК, например активаторы <i>(верный вариант)</i><br><span class="expl">В разбираемой схеме адресность обеспечивает активатор: набор активаторов в клетке определяет, какие промоторы станут доступными. У разных комплексов ремоделирования механизмы адресации различаются.</span></li><li><b>В.</b> Он сдвигает нуклеосомы только там, где уже идёт транскрипция <i>(неверный вариант)</i><br><span class="expl">Сдвиг нуклеосомы делает промотор доступным, и только после этого на нём может собраться аппарат транскрипции.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-histone-modifications"><div class="eyebrow">Хроматин и доступность · шаг 12 из 33</div><h2>Модификации гистонов: ацетилирование и его границы</h2><p class="lead"></p><ol class="mech"></ol><p>Аминокислотные остатки гистонов, прежде всего в их N-концевых участках («<a href="#ns-g-S11-T03">хвостах</a>»), подвергаются ковалентным модификациям: ацетилированию и метилированию лизинов, <a href="#ns-g-S11-T58">фосфорилированию</a> серинов и другим. Модификации вносят и удаляют разные ферменты; другие белки узнают модифицированные остатки.</p><p><a href="#ns-g-S11-T27">Ацетилтрансферазы гистонов</a> переносят ацетильную группу с ацетил-CoA на остатки лизина, <a href="#ns-g-S11-T31">деацетилазы гистонов</a> её удаляют. Ацетилирование нейтрализует положительный заряд лизина и ослабляет связь гистонов с ДНК. Ацетилированные лизины узнают белки с бромодоменом, в том числе субъединицы общего фактора транскрипции TFIID и комплексов ремоделирования. Активаторы привлекают к промотору ацетилтрансферазы, репрессоры — деацетилазы.</p><p><a href="#ns-g-S11-T02">Ацетилирование гистонов</a> обычно сопутствует активной транскрипции, но не служит универсальным выключателем. Во-первых, эффект модификации определяется тем, какие белки её узнают на данном участке и в данном типе клеток. Во-вторых, значительная часть ацетилирования гистонов сама зависит от транскрипции (БИО-11·14). Поэтому утверждение «ацетилирование любого гистона активирует любой ген» неверно. Метилирование лизинов связано и с активацией, и с репрессией: триметилирование лизина 4 гистона H3 характерно для активных промоторов, триметилирование лизинов 9 и 27 — для репрессированного хроматина.</p><div class="static-quiz"><h3>На гене гистоны ацетилированы и идёт транскрипция. Можно ли заключить, что ацетилирование её вызвало?</h3><ol><li><b>А.</b> Да: ацетилирование любого гистона активирует любой ген <i>(неверный вариант)</i><br><span class="expl">Это утверждение неверно: эффект модификации зависит от участка, от белков, узнающих её, и от типа клеток.</span></li><li><b>Б.</b> Нет, потому что ацетилирование всегда подавляет транскрипцию <i>(неверный вариант)</i><br><span class="expl">Ацетилирование ослабляет связь гистонов с ДНК и создаёт участки для белков, способствующих транскрипции; удаляют ацетильные группы деацетилазы, которые привлекают репрессоры.</span></li><li><b>В.</b> Нет: значительная часть ацетилирования сама зависит от транскрипции <i>(верный вариант)</i><br><span class="expl">Ацетилирование обычно сопутствует активной транскрипции, но совпадение не указывает, что из них причина; к тому же эффект модификации зависит от белков, которые её узнают.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1038/s41467-020-20543-z">Martin B. J. E., Brind&#x27;Amour J., Kuzmin A., Jensen K. N., Liu Z. C., Lorincz M., Howe L. J. Transcription shapes genome-wide histone acetylation patterns. Nat. Commun. 2021;12:210.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-dna-methylation"><div class="eyebrow">Хроматин и доступность · шаг 13 из 33</div><h2>Метилирование ДНК: важно, где</h2><p class="lead"></p><ol class="mech"></ol><p>У позвоночных метилируется в основном цитозин в динуклеотидах CpG; образуется 5-метилцитозин. Последовательность нуклеотидов при этом не изменяется. Бо́льшая часть CpG генома метилирована, кроме <a href="#ns-g-S11-T37">CpG-островков</a> — участков длиной около тысячи пар нуклеотидов с повышенным содержанием CpG. CpG-островки обычно включают промоторы; у человека около 60 % генов, кодирующих белки, имеют промоторы в CpG-островках, и в норме эти островки не метилированы.</p><p>Метилирование CpG-островка промотора связано с устойчивым подавлением транскрипции: метилированные CpG узнают белки, которые привлекают деацетилазы гистонов и другие репрессорные комплексы. Метилирование CpG в транскрибируемой части гена, напротив, часто встречается у активно транскрибируемых генов. Поэтому <a href="#ns-g-S11-T41">метилирование ДНК</a> — не универсальный выключатель: его действие зависит от того, какой участок метилирован.</p><p>Профиль метилирования сохраняется при делении клетки; механизмы этого и роль метилирования в развитии разбираются в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Почему метилирование ДНК нельзя считать универсальным выключателем гена?</h3><ol><li><b>А.</b> Его действие зависит от участка: метилирование CpG-островка промотора связано с устойчивой репрессией, а в транскрибируемой части часто встречается у активных генов <i>(верный вариант)</i><br><span class="expl">Метилирование не меняет последовательность; эффект определяют белки, которые узнают метилированные CpG в данном участке, например привлекающие деацетилазы гистонов.</span></li><li><b>Б.</b> Потому что метилирование изменяет последовательность нуклеотидов <i>(неверный вариант)</i><br><span class="expl">Образуется 5-метилцитозин; последовательность нуклеотидов при этом не изменяется.</span></li><li><b>В.</b> Потому что метилированные CpG всегда активируют ген <i>(неверный вариант)</i><br><span class="expl">Метилирование CpG-островка промотора связано, наоборот, с устойчивым подавлением транскрипции.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith Z. D., Hetzel S., Meissner A. DNA methylation in mammalian development and disease. Nat. Rev. Genet. 2025;26(1):7–30.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-a2-access"><div class="eyebrow">Хроматин и доступность · шаг 14 из 33</div><h2>Доступность — необходимое, но недостаточное условие</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·10, БИО-11·11, БИО-11·12, БИО-11·18</p><p>Для транскрипции нужны и доступный регуляторный участок, и активный фактор транскрипции, связанный с ним. В модели исследования 2 одинаковое отсутствие транскрипции в двух клетках имеет разные причины: в одной закрыт участок, в другой неактивен фактор. <a href="#ns-g-S11-T48">Пионерные факторы транскрипции</a> способны связываться с ДНК на нуклеосоме и способствовать открытию участка; но открытый ими участок без активатора не транскрибируется. Если участок доступен, а вновь синтезированной РНК нет, проверяют фактор, его активность и связывание, репрессоры и аппарат транскрипции; если измерена зрелая мРНК или белок — ещё и процессинг, распад и трансляцию.</p><p>Новые данные. Ацетилирование гистонов не только способствует транскрипции, но и во многом следует за ней. В дрожжах после быстрой остановки РНК-полимеразы II бо́льшая часть ацетилирования гистонов исчезла; ацетилтрансферазы, привлечённые активаторами к промоторам, без транскрипции гистоны не ацетилировали. Быстрое деацетилирование после остановки транскрипции наблюдали и в эмбриональных стволовых клетках мыши. Поэтому ацетилирование гистонов на гене — свидетельство транскрипции, но не доказательство того, что оно её вызвало.</p><div class="static-quiz"><h3>Регуляторный участок гена доступен, а вновь синтезированной РНК этого гена нет. Что проверяют в первую очередь?</h3><ol><li><b>А.</b> Скорость распада белка этого гена <i>(неверный вариант)</i><br><span class="expl">Измерена вновь синтезированная РНК; распад белка на неё не влияет.</span></li><li><b>Б.</b> Есть ли нужный фактор транскрипции, активен ли он и связан ли с участком; нет ли репрессора; есть ли аппарат транскрипции <i>(верный вариант)</i><br><span class="expl">Доступность — только первое условие. Транскрипция требует ещё связанного активного фактора и аппарата транскрипции.</span></li><li><b>В.</b> Есть ли пионерный фактор, без которого участок закрыт <i>(неверный вариант)</i><br><span class="expl">Участок уже доступен; пионерный фактор нужен, чтобы открыть закрытый участок.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1038/s41467-020-20543-z">Martin B. J. E., Brind&#x27;Amour J., Kuzmin A., Jensen K. N., Liu Z. C., Lorincz M., Howe L. J. Transcription shapes genome-wide histone acetylation patterns. Nat. Commun. 2021;12:210.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-methylation-memory"><div class="eyebrow">Хроматин и доступность · шаг 15 из 33</div><h2>Метилирование ДНК и сохранение состояния экспрессии</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·13</p><p>После репликации ДНК полуметилирована: CpG родительской цепи метилирован, новой — нет. Поддерживающая ДНК-метилтрансфераза метилирует цитозин новой цепи по образцу родительской, поэтому профиль метилирования сохраняется при делениях клетки. В развитии млекопитающих профили метилирования дважды широко перестраиваются — в раннем зародыше и в клетках зародышевой линии. Метилирование CpG-островка промотора часто следует за подавлением гена другими механизмами и закрепляет его. Подробно — в курсе «Молекулярная биология».</p><p><a href="https://edu.mazunin.science/seminar-6-route.html#memory">→ «Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»</a></p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Нуклеосомы, ремоделирование и модификации гистонов подробно — <a href="https://edu.mazunin.science/seminar-5-route.html#core">«Молекулярная биология», семинар 5 «Нуклеосомы, ремоделирование и гистоны»</a>; метилирование ДНК и сохранение состояний — <a href="https://edu.mazunin.science/seminar-6-route.html#memory">«Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»</a></p><div class="static-quiz"><h3>Почему профиль метилирования ДНК сохраняется при делениях клетки?</h3><ol><li><b>А.</b> Новая цепь сразу синтезируется из метилированных нуклеотидов <i>(неверный вариант)</i><br><span class="expl">Сразу после репликации CpG новой цепи не метилированы; их метилирует фермент по образцу родительской цепи.</span></li><li><b>Б.</b> Профиль метилирования заново устанавливается в каждой клетке после деления <i>(неверный вариант)</i><br><span class="expl">Профиль копируется; широкие перестройки происходят лишь в раннем зародыше и в клетках зародышевой линии.</span></li><li><b>В.</b> После репликации ДНК полуметилирована, и поддерживающая ДНК-метилтрансфераза метилирует новую цепь по образцу родительской <i>(верный вариант)</i><br><span class="expl">Метка родительской цепи служит образцом для новой, поэтому профиль копируется в каждом цикле.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith Z. D., Hetzel S., Meissner A. DNA methylation in mammalian development and disease. Nat. Rev. Genet. 2025;26(1):7–30.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-promoter"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 16 из 33</div><h2>Промотор и преинициаторный комплекс</h2><p class="lead"></p><ol class="mech"></ol><p>Промотор — участок ДНК, на котором собирается аппарат транскрипции и начинается синтез РНК (вспомнить: <a href="seminar-9-route.html#promoter-start">семинар 9: «Промотор и точка начала транскрипции: +1 — не старт-кодон»</a>). На доступном промоторе гена, транскрибируемого РНК-полимеразой II, собираются общие факторы транскрипции (TFIID, TFIIB, TFIIE, TFIIF, TFIIH) и сама РНК-полимераза II; вместе они образуют <a href="#ns-g-S11-T49">преинициаторный комплекс</a>. Сборку обычно начинает фактор TFIID, узнающий последовательности промотора.</p><p>Общие факторы одинаковы для всех генов РНК-полимеразы II. Поэтому то, какие гены и как часто транскрибируются, определяют не они, а факторы транскрипции, связанные с регуляторными участками конкретного гена (БИО-11·18).</p><div class="static-quiz"><h3>Общие факторы транскрипции одинаковы для всех генов РНК-полимеразы II. Что тогда определяет, какие гены и как часто транскрибируются?</h3><ol><li><b>А.</b> Факторы транскрипции, связанные с регуляторными участками конкретного гена <i>(верный вариант)</i><br><span class="expl">Общие факторы обеспечивают сборку аппарата на доступном промоторе любого гена, а различия между генами создают регуляторные белки и их участки.</span></li><li><b>Б.</b> Набор общих факторов, свой для каждого гена <i>(неверный вариант)</i><br><span class="expl">Общие факторы одинаковы для всех генов, транскрибируемых РНК-полимеразой II.</span></li><li><b>В.</b> Только наличие TATA-бокса в промоторе <i>(неверный вариант)</i><br><span class="expl">TATA-бокс есть лишь у части промоторов; частоту транскрипции определяют регуляторные белки.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-enhancer"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 17 из 33</div><h2>Энхансер</h2><p class="lead"></p><ol class="mech"></ol><p><a href="#ns-g-S11-T60">Энхансер</a> — участок ДНК, с которым связываются белки-активаторы и который увеличивает интенсивность транскрипции гена. Энхансер может находиться перед геном, после него, в интроне и на расстоянии от десятков тысяч до миллиона пар нуклеотидов от промотора. У одного гена бывает несколько энхансеров, и каждый связывает несколько разных факторов транскрипции.</p><p>Наличие последовательности энхансера в геноме не гарантирует активации гена. Чтобы энхансер действовал, он должен быть доступен, с ним должны связаться нужные активные факторы, а их действие должно быть передано на аппарат транскрипции промотора. В клетках разных типов одни и те же энхансеры доступны или закрыты по-разному.</p><p>Как действие удалённого энхансера передаётся на промотор, изучено не полностью. Широко принятая модель — сближение энхансера и промотора в пространстве: ДНК между ними образует петлю. Но устойчивая петля не обязательна для действия каждого энхансера: предложены и другие модели связи энхансера с промотором. Пространственная близость сама по себе не доказывает активации; описан даже случай, когда при активации энхансера в развивающихся нервных клетках расстояние между ним и промотором увеличивалось (БИО-11·22).</p><div class="static-quiz"><h3>Последовательность энхансера есть в геноме клетки, но ген не активирован. Как это возможно?</h3><ol><li><b>А.</b> Энхансер действует, только если находится вплотную к промотору <i>(неверный вариант)</i><br><span class="expl">Энхансер может находиться на расстоянии от десятков тысяч до миллиона пар нуклеотидов от промотора.</span></li><li><b>Б.</b> Энхансер может быть недоступен, нужный фактор — неактивен, или действие не передаётся на промотор <i>(верный вариант)</i><br><span class="expl">Чтобы энхансер действовал, нужны одновременно его доступность, связанный активный фактор и передача действия на аппарат транскрипции.</span></li><li><b>В.</b> Это невозможно: энхансер в геноме всегда активирует свой ген <i>(неверный вариант)</i><br><span class="expl">В клетках разных типов одни и те же энхансеры доступны или закрыты по-разному, поэтому одного наличия последовательности недостаточно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1016/j.molcel.2019.07.038">Benabdallah N. S., Williamson I., Illingworth R. S., Kane L., Boyle S., Sengupta D., Grimes G. R., Therizols P., Bickmore W. A. Decreased enhancer-promoter proximity accompanying enhancer activation. Mol. Cell. 2019;76(3):473–484.e7.</a></li><li><a href="https://doi.org/10.1186/s13059-021-02322-1">Panigrahi A., O&#x27;Malley B. W. Mechanisms of enhancer action: the known and the unknown. Genome Biol. 2021;22:108.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-activators-repressors"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 18 из 33</div><h2>Активаторы и репрессоры</h2><p class="lead"></p><ol class="mech"></ol><p><a href="#ns-g-S11-T57">Факторы транскрипции</a> — белки, связывающиеся с определёнными последовательностями ДНК и изменяющие интенсивность транскрипции. Активаторы увеличивают её: непосредственно ускоряют сборку общих факторов, взаимодействуют с <a href="#ns-g-S11-T40">медиатором</a> и привлекают <a href="#ns-g-S11-T39">коактиваторы</a>, изменяющие хроматин, — ацетилтрансферазы и комплексы ремоделирования.</p><p>Репрессоры уменьшают транскрипцию разными способами: конкурируют с активаторами за участок ДНК, связываются с самими активаторами, препятствуют сборке общих факторов транскрипции, привлекают деацетилазы и комплексы, возвращающие нуклеосомы на промотор.</p><p>Транскрипцию одного гена обычно регулируют несколько факторов одновременно, и итог определяется их сочетанием, а не одним из них.</p><div class="static-quiz"><h3>Почему по наличию одного активатора нельзя предсказать транскрипцию гена?</h3><ol><li><b>А.</b> Активаторы действуют на трансляцию, а не на транскрипцию <i>(неверный вариант)</i><br><span class="expl">Активаторы связываются с ДНК и увеличивают транскрипцию — ускоряют сборку общих факторов, взаимодействуют с медиатором, привлекают коактиваторы.</span></li><li><b>Б.</b> Репрессоры подавляют только трансляцию мРНК <i>(неверный вариант)</i><br><span class="expl">Репрессоры уменьшают транскрипцию: конкурируют с активаторами, мешают сборке аппарата, привлекают деацетилазы и комплексы, возвращающие нуклеосомы.</span></li><li><b>В.</b> Ген обычно регулируют несколько активаторов и репрессоров одновременно, и итог определяется их сочетанием <i>(верный вариант)</i><br><span class="expl">Репрессоры могут конкурировать с активатором за участок, связываться с ним, мешать сборке общих факторов или привлекать деацетилазы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-mediator"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 19 из 33</div><h2>Медиатор и коактиваторы</h2><p class="lead"></p><ol class="mech"></ol><p>Медиатор — крупный белковый комплекс (у человека — около 30 субъединиц; число зависит от организма и состава комплекса), посредник между факторами транскрипции и РНК-полимеразой II. Активаторы на энхансерах и промоторе взаимодействуют с медиатором, а он — с РНК-полимеразой II и общими факторами; медиатор участвует и в том, чтобы РНК-полимераза перешла от инициации к синтезу РНК. Для инициации транскрипции у большинства генов РНК-полимеразы II в клетке медиатор необходим.</p><p>Важно различать: медиатор не «сближает» участки ДНК сам по себе, а передаёт действие связанных с ДНК регуляторных белков на аппарат транскрипции. Коактиваторы — белки, которые не связываются с ДНК, но привлекаются активаторами и усиливают транскрипцию; к ним относятся и ацетилтрансферазы гистонов.</p><div class="static-quiz"><h3>Активатор связан с энхансером, но медиатора нет. Почему транскрипция не усиливается?</h3><ol><li><b>А.</b> Медиатор передаёт действие активатора на РНК-полимеразу II и общие факторы транскрипции <i>(верный вариант)</i><br><span class="expl">Без посредника связанный активатор не действует на аппарат; для инициации у большинства генов РНК-полимеразы II медиатор необходим.</span></li><li><b>Б.</b> Медиатор нужен только для того, чтобы сблизить участки ДНК <i>(неверный вариант)</i><br><span class="expl">Медиатор не сближает участки ДНК сам по себе — он передаёт действие связанных с ДНК белков на аппарат транскрипции.</span></li><li><b>В.</b> Медиатор связывается с энхансером вместо активатора <i>(неверный вариант)</i><br><span class="expl">С энхансером связывается активатор; медиатор — белковый посредник между ним и РНК-полимеразой II.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1186/s40001-025-02720-2">Schiano C., Napoli C. Mediator complex: update of key insights into transcriptional regulation of ancestral framework and its role in cardiovascular diseases. Eur. J. Med. Res. 2025;30:507.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-signal-specificity"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 20 из 33</div><h2>От сигнала к гену: почему ответ специфичен</h2><p class="lead"></p><ol class="mech"></ol><p>Внеклеточный сигнал, связавшись с <a href="#ns-g-S11-T11">рецептором</a> (вспомнить: <a href="seminar-1-route.html#bio-1-24">семинар 1</a>), изменяет активность факторов транскрипции: переводит их в форму, способную связываться с ДНК, изменяет их локализацию или взаимодействие с партнёрами. Пример — глюкокортикоидный рецептор: связав гормон, он переходит в ядро и связывается со своими участками ДНК.</p><p>Один и тот же активированный фактор в клетках разных типов увеличивает транскрипцию разных генов. Причина — различия в доступности энхансеров, в наборе факторов-партнёров и в передаче действия на промоторы. Так, в клетках двух типов мыши до 95 % новых участков связывания глюкокортикоидного рецептора после гормона приходилось на участки, доступные ещё до гормона, а общими для обоих типов клеток оказались лишь около 11 % участков связывания. Поэтому ответ клетки на сигнал определяется не только сигналом и рецептором, но и тем, в каком состоянии находятся регуляторные участки её генома.</p><div class="static-quiz"><h3>Один и тот же активированный фактор усиливает транскрипцию разных генов в клетках разных типов. Почему?</h3><ol><li><b>А.</b> Фактор в каждой клетке узнаёт другую последовательность ДНК <i>(неверный вариант)</i><br><span class="expl">Последовательность, которую узнаёт фактор, одна и та же; различается, доступна ли она.</span></li><li><b>Б.</b> Клетки различаются доступностью энхансеров, набором факторов-партнёров и передачей действия на промоторы <i>(верный вариант)</i><br><span class="expl">Ответ определяется не только сигналом и рецептором, но и состоянием регуляторных участков генома данной клетки.</span></li><li><b>В.</b> Клетки разных типов содержат разные геномы <i>(неверный вариант)</i><br><span class="expl">Геном клеток одного организма одинаков; различается состояние регуляторных участков.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1038/ng.759">John S., Sabo P. J., Thurman R. E., Sung M.-H., Biddie S. C., Johnson T. A., Hager G. L., Stamatoyannopoulos J. A. Chromatin accessibility pre-determines glucocorticoid receptor binding patterns. Nat. Genet. 2011;43(3):264–268.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-a3-one-signal"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 21 из 33</div><h2>Один сигнал — разные ответы</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·17, БИО-11·18, БИО-11·19, БИО-11·20</p><p>В модели исследования 3 сигнал одинаково активирует фактор R в двух клетках, но клетка А транскрибирует ген 1, а клетка Б — ген 2. Для каждого гена нужно сочетание условий: доступный энхансер, активный фактор, для гена 2 — партнёр Q, и передача действия на промотор. Открыть один энхансер недостаточно, если не хватает партнёра; связывание факторов с энхансером недостаточно, если нарушена передача.</p><p>Почему один фактор в разных клетках связывается с разными участками, показано в шаге БИО-11·20: связывание во многом определяется заранее различной доступностью хроматина.</p><p>Новые данные. Даже один энхансер может состоять из участков с противоположной ролью: из четырёх участков связывания глюкокортикоидного рецептора перед одним геном в клетках опухоли молочной железы человека три усиливали транскрипцию, а один подавлял её, и гормон снимал это подавление. Ответ на гормон различался и между соседними клетками; авторы предполагают, что это связано с разным использованием четырёх участков.</p><p>Модель показывает принцип регуляторной специфичности; дифференцировка клеток не сводится к действию одного фактора, а реальные регуляторные сети включают сотни факторов.</p><div class="static-quiz"><h3>Почему в модели исследования 3 открыть энхансер ещё недостаточно, чтобы ген ответил на сигнал?</h3><ol><li><b>А.</b> Потому что сигнал активирует фактор только в одной из клеток <i>(неверный вариант)</i><br><span class="expl">Сигнал активирует фактор R в обеих клетках; различаются другие условия.</span></li><li><b>Б.</b> Потому что открытый энхансер всегда подавляет транскрипцию <i>(неверный вариант)</i><br><span class="expl">Доступный энхансер — необходимое условие активации, а не причина подавления.</span></li><li><b>В.</b> Нужно сочетание условий: активный фактор, доступный энхансер, нужный партнёр и передача действия на промотор <i>(верный вариант)</i><br><span class="expl">Если не хватает хотя бы одного условия — партнёра или передачи, — связывание или его действие на промотор не происходит.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2021.12.035">Hoffman J. A., Trotter K. W., Day C. R., Ward J. M., Inoue K., Rodriguez J., Archer T. K. Multimodal regulatory elements within a hormone-specific super enhancer control a heterogeneous transcriptional response. Mol. Cell. 2022;82(4):803–815.e5.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-contact-not-proof"><div class="eyebrow">Промотор, энхансер и факторы транскрипции · шаг 22 из 33</div><h2>Контакт энхансера с промотором — не доказательство активации</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·17</p><p>Пространственную близость участков ДНК в ядре изучают, наблюдая меченые участки в живых клетках или определяя, какие участки ДНК находятся рядом. Близость энхансера и промотора и транскрипция гена часто наблюдаются вместе, но это корреляция. В эмбриональных стволовых клетках мыши наблюдали за геном &lt;i&gt;Sox2&lt;/i&gt; и его необходимым энхансером в живых клетках: ген транскрибировался короткими <a href="#ns-g-S11-T14">вспышками</a>, но во время вспышек энхансер не находился к нему ближе обычного. Поэтому причинную связь проверяют функционально: удаляют или изменяют энхансер и измеряют транскрипцию. Как именно энхансер действует на удалённый промотор, остаётся открытой научной проблемой.</p><p><a href="https://edu.mazunin.science/seminar-6-route.html#enhancer-test">→ «Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»</a></p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Регуляторные элементы, контакты энхансера с промотором и совместимость энхансеров и промоторов — <a href="https://edu.mazunin.science/seminar-6-route.html#enhancer-test">«Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»</a>; сигнальные пути — <a href="https://edu.mazunin.science/seminar-3-route.html#receptor-equilibrium">семинары 3</a> и <a href="https://edu.mazunin.science/seminar-4-route.html#cascade">4</a></p><div class="static-quiz"><h3>Энхансер и промотор часто оказываются рядом, когда ген транскрибируется. Почему это ещё не доказывает, что близость вызывает транскрипцию?</h3><ol><li><b>А.</b> Это совместное наблюдение — корреляция; причинную связь проверяют, изменяя энхансер и измеряя транскрипцию <i>(верный вариант)</i><br><span class="expl">У гена Sox2 вспышки транскрипции шли без дополнительного сближения с необходимым энхансером; поэтому механизм проверяют функционально.</span></li><li><b>Б.</b> Потому что энхансеры не влияют на транскрипцию <i>(неверный вариант)</i><br><span class="expl">Энхансер Sox2 был необходим для транскрипции; не доказана лишь роль самой близости.</span></li><li><b>В.</b> Потому что положение участков ДНК в ядре нельзя наблюдать <i>(неверный вариант)</i><br><span class="expl">Близость наблюдают по меченым участкам в живых клетках; вопрос в её причинной роли, а не в возможности измерения.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.7554/eLife.41769">Alexander J. M., Guan J., Li B., Maliskova L., Song M., Shen Y., Huang B., Lomvardas S., Weiner O. D. Live-cell imaging reveals enhancer-dependent Sox2 transcription in the absence of enhancer proximity. eLife. 2019;8:e41769.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-mrna-balance"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 23 из 33</div><h2>Количество мРНК — равновесие синтеза и распада</h2><p class="lead"></p><ol class="mech"></ol><p>Количество молекул мРНК в клетке определяется двумя потоками: скоростью её синтеза (транскрипции и процессинга) и скоростью распада. Когда эти скорости равны, количество мРНК постоянно — это <a href="#ns-g-S11-T56">стационарное состояние</a>. Постоянное количество не означает, что молекулы не обновляются: новые синтезируются, старые разрушаются с той же скоростью.</p><p><a href="#ns-g-S11-T30">Время полужизни</a> мРНК — время, за которое распадается половина её молекул. У мРНК клеток млекопитающих оно различается от минут до многих часов; в эмбриональных стволовых клетках мыши медиана составила около 7 ч, и лишь у немногих мРНК (среди них много мРНК факторов транскрипции) время полужизни меньше часа. мРНК, количество продукта которых должно быстро изменяться, обычно живут недолго.</p><p>Одно измерение количества мРНК не показывает, изменился синтез или распад: одинаковое количество получается при медленном синтезе и медленном распаде или при быстром синтезе и быстром распаде.</p><div class="static-quiz"><h3>У двух генов одинаковое количество мРНК. Что можно сказать о скорости их транскрипции?</h3><ol><li><b>А.</b> Транскрипция у них одинакова <i>(неверный вариант)</i><br><span class="expl">При разной скорости распада одинаковое количество дают разные скорости транскрипции.</span></li><li><b>Б.</b> Ничего определённого: одинаковое количество получается и при медленном синтезе с медленным распадом, и при быстром синтезе с быстрым распадом <i>(верный вариант)</i><br><span class="expl">Количество мРНК — итог равновесия двух потоков, и одно измерение не показывает, какой из них изменился.</span></li><li><b>В.</b> мРНК этих генов не обновляется <i>(неверный вариант)</i><br><span class="expl">Постоянное количество — равновесие синтеза и распада, а не отсутствие обновления.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1093/dnares/dsn030">Sharova L. V., Sharov A. A., Nedorezov T., Piao Y., Shaik N., Ko M. S. H. Database for mRNA half-life of 19 977 genes obtained by DNA microarray analysis of pluripotent and differentiating mouse embryonic stem cells. DNA Res. 2009;16(1):45–58.</a></li><li><a href="https://doi.org/10.1101/gr.130559.111">Tani H., Mizutani R., Salam K. A., Tano K., Ijiri K., Wakamatsu A., Isogai T., Suzuki Y., Akimitsu N. Genome-wide determination of RNA stability reveals hundreds of short-lived noncoding transcripts in mammals. Genome Res. 2012;22(5):947–956.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-mrna-decay"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 24 из 33</div><h2>Как разрушается мРНК</h2><p class="lead"></p><ol class="mech"></ol><p>Распад большинства мРНК в цитоплазме начинается с постепенного укорочения <a href="#ns-g-S11-T06">поли(А)-хвоста</a> ферментами-деаденилазами (вспомнить: <a href="seminar-9-route.html#three-prime-end">семинар 9: «3′-конец: расщепление и полиаденилирование»</a>). Когда хвост укорачивается до критической длины (у человека около 25 нуклеотидов), мРНК разрушается одним из двух путей: удаляется 5′-кэп (декэпирование), и мРНК расщепляется экзонуклеазой с 5′-конца; или мРНК расщепляется с 3′-конца многобелковым комплексом — <a href="#ns-g-S11-T61">экзосомой</a>. Оба пути могут действовать на одну молекулу.</p><p>Скорость распада конкретной мРНК зависит от последовательностей её <a href="#ns-g-S11-T05">нетранслируемых областей</a> и от белков и малых РНК, которые с ними связываются.</p><div class="static-quiz"><h3>Почему укорочение поли(А)-хвоста приближает разрушение мРНК?</h3><ol><li><b>А.</b> Поли(А)-хвост кодирует часть белка, и без него мРНК больше не нужна <i>(неверный вариант)</i><br><span class="expl">Поли(А)-хвост не кодирует аминокислоты; дело не в «ненужности», а в том, что короткий хвост запускает разрушение.</span></li><li><b>Б.</b> Деаденилирование само разрезает мРНК посередине <i>(неверный вариант)</i><br><span class="expl">Деаденилазы укорачивают хвост; разрушение затем идёт с 5′- или с 3′-конца молекулы.</span></li><li><b>В.</b> Когда хвост укорачивается до критической длины, мРНК разрушается — с 5′-конца после удаления кэпа или с 3′-конца экзосомой <i>(верный вариант)</i><br><span class="expl">Деаденилирование — обычно первый этап распада: оно открывает путь ферментам, разрушающим мРНК с концов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-small-rnas"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 25 из 33</div><h2>микроРНК и малые интерферирующие РНК</h2><p class="lead"></p><ol class="mech"></ol><p><a href="#ns-g-S11-T42">микроРНК</a> — малые некодирующие РНК длиной около 22 нуклеотидов. Они образуются из более длинных предшественников, транскрибируемых в основном РНК-полимеразой II, и действуют в комплексе с белком семейства <a href="#ns-g-S11-T26">Argonaute</a> (AGO) — этот комплекс называют <a href="#ns-g-S11-T55">RISC</a>. Малая РНК служит направляющей: она спаривается с комплементарным участком мРНК-мишени, а белок AGO обеспечивает действие на мишень.</p><p>микроРНК животных спариваются с мишенью, как правило, частично — прежде всего <a href="#ns-g-S11-T34">затравочным участком</a> (нуклеотиды 2–7 от 5′-конца; вместе с 8-м — расширенный затравочный участок), чаще всего в 3′-нетранслируемой области. При частичном спаривании AGO привлекает белки, которые подавляют трансляцию и вызывают <a href="#ns-g-S11-T32">деаденилирование</a>, декэпирование и распад мРНК. Неверно, что микроРНК всегда разрезают мРНК: в клетках млекопитающих в стационарном состоянии бо́льшая часть (от 66 % до более чем 90 %) подавления объясняется ускоренным распадом мРНК, а подавление трансляции заметнее вскоре после появления микроРНК. Одна микроРНК действует на сотни мРНК, и по оценкам микроРНК регулируют не менее половины генов человека, кодирующих белки; действие на каждую мишень обычно умеренное.</p><p>Регулируют экспрессию и другие некодирующие РНК: например, длинные некодирующие РНК, часть которых служит каркасом для белковых комплексов и участвует в упаковке хроматина, в том числе при инактивации одной из X-хромосом.</p><p>При высокой комплементарности, особенно в центральной части дуплекса, белок AGO2 разрезает мишень напротив нуклеотидов 10 и 11 направляющей РНК. Так действуют <a href="#ns-g-S11-T43">малые интерферирующие РНК</a>; на этом основаны лекарства, снижающие синтез определённых белков в клетках печени.</p><div class="static-quiz"><h3>Почему микроРНК обычно не разрезает мРНК-мишень, а малая интерферирующая РНК — разрезает?</h3><ol><li><b>А.</b> Для разрезания белку AGO2 нужна высокая комплементарность, особенно в центральной части дуплекса, а микроРНК спаривается с мишенью частично <i>(верный вариант)</i><br><span class="expl">При частичном спаривании AGO привлекает белки, подавляющие трансляцию и вызывающие деаденилирование и распад; при полном — AGO2 разрезает мишень.</span></li><li><b>Б.</b> микроРНК связывается с ДНК гена, а малая интерферирующая РНК — с мРНК <i>(неверный вариант)</i><br><span class="expl">Обе малые РНК в комплексе с AGO действуют на мРНК; различается степень комплементарности.</span></li><li><b>В.</b> Малая интерферирующая РНК сама является ферментом <i>(неверный вариант)</i><br><span class="expl">Разрезает белок AGO2; малая РНК служит направляющей, которая находит мишень.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1016/j.cell.2018.03.006">Bartel D. P. Metazoan microRNAs. Cell. 2018;173(1):20–51.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00805-0">Kim H., Lee Y.-Y., Kim V. N. The biogenesis and regulation of animal microRNAs. Nat. Rev. Mol. Cell Biol. 2025;26(4):276–296.</a></li><li><a href="https://doi.org/10.1038/s41587-023-02105-y">Jadhav V., Vaishnaw A., Fitzgerald K., Maier M. A. RNA interference in the era of nucleic acid therapeutics. Nat. Biotechnol. 2024;42:394–405.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.08.028">Eichhorn S. W., Guo H., McGeary S. E., Rodriguez-Mias R. A., Shin C., Baek D., Hsu S.-H., Ghoshal K., Villén J., Bartel D. P. mRNA destabilization is the dominant effect of mammalian microRNAs by the time substantial repression ensues. Mol. Cell. 2014;56(1):104–115.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-translation-control"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 26 из 33</div><h2>Регуляция трансляции</h2><p class="lead"></p><ol class="mech"></ol><p>Количество белка зависит не только от количества мРНК, но и от того, как часто инициируется её трансляция (вспомнить: <a href="seminar-10-route.html#initiation">семинар 10: «Инициация: малая субчастица находит старт-кодон, инициаторная тРНК — в P-сайте»</a>). Чаще всего регулируется именно инициация трансляции. Белки и малые РНК, связанные с нетранслируемыми областями мРНК, могут препятствовать присоединению малой субчастицы рибосомы или её продвижению к старт-кодону. Регуляция трансляции позволяет изменить синтез белка быстро, без изменения транскрипции и количества мРНК.</p><div class="static-quiz"><h3>Синтез белка быстро изменился, а количество его мРНК осталось прежним. Какой уровень регуляции, скорее всего, изменился?</h3><ol><li><b>А.</b> Транскрипция гена <i>(неверный вариант)</i><br><span class="expl">При изменении транскрипции изменилось бы и количество мРНК.</span></li><li><b>Б.</b> Инициация трансляции <i>(верный вариант)</i><br><span class="expl">Белки и малые РНК, связанные с нетранслируемыми областями, могут мешать присоединению малой субчастицы рибосомы или её продвижению к старт-кодону; так синтез меняется без изменения мРНК.</span></li><li><b>В.</b> Скорость распада мРНК <i>(неверный вариант)</i><br><span class="expl">Ускорение или замедление распада изменило бы количество мРНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1038/s41580-023-00624-9">Brito Querido J., Díaz-López I., Ramakrishnan V. The molecular basis of translation initiation and its regulation in eukaryotes. Nat. Rev. Mol. Cell Biol. 2024;25(3):168–186.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-protein-degradation"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 27 из 33</div><h2>Распад белка: убиквитин и протеасома</h2><p class="lead"></p><ol class="mech"></ol><p>Количество белка определяется скоростью его синтеза и скоростью распада. Многие регуляторные белки разрушаются быстро; их количество поэтому быстро изменяется. Распад белков регулируется: ферменты E1, E2 и <a href="#ns-g-S11-T53">убиквитинлигаза</a> E3 последовательно присоединяют к белку <a href="#ns-g-S11-T52">убиквитин</a>, образуя цепь; определённые цепи узнаёт <a href="#ns-g-S11-T51">протеасома</a>, разворачивает белок с затратой АТФ и расщепляет его до коротких пептидов (вспомнить: <a href="seminar-10-route.html#quality-control">семинар 10: «Контроль качества: шапероны, убиквитин и протеасома»</a>). Специфичность обеспечивают убиквитинлигазы: в клетке млекопитающего их сотни, и каждая узнаёт определённые белки.</p><p>Ускорение распада уменьшает стационарное количество белка при неизменных мРНК и трансляции.</p><div class="static-quiz"><h3>Белок стал быстрее распадаться, а его мРНК и трансляция не изменились. Что произойдёт с количеством белка?</h3><ol><li><b>А.</b> Количество не изменится, потому что синтез прежний <i>(неверный вариант)</i><br><span class="expl">Количество зависит и от синтеза, и от распада; ускорение распада уменьшает его даже при прежнем синтезе.</span></li><li><b>Б.</b> Уменьшится количество мРНК этого белка <i>(неверный вариант)</i><br><span class="expl">Убиквитинлигаза и протеасома действуют на белок, а не на мРНК.</span></li><li><b>В.</b> Стационарное количество уменьшится: оно определяется соотношением синтеза и распада <i>(верный вариант)</i><br><span class="expl">При прежнем синтезе ускоренный распад сдвигает равновесие к меньшему количеству белка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-amount-vs-activity"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 28 из 33</div><h2>Количество белка и его активность</h2><p class="lead"></p><ol class="mech"></ol><p>Количество белка и его функциональная активность — разные величины. Активность изменяют ковалентные модификации (например, фосфорилирование и дефосфорилирование, вспомнить: <a href="seminar-1-route.html">семинар 1</a>), связывание малых молекул и партнёров, правильное сворачивание и локализация. Поэтому одинаковое количество белка может давать разную активность, а одинаковая активность — получаться при разном количестве белка. Регуляция активности изменяет функцию уже имеющихся молекул и не требует синтеза новых.</p><div class="static-quiz"><h3>В двух клетках одинаковое количество белка, а его активность различается. Как это возможно?</h3><ol><li><b>А.</b> Активность изменяют ковалентные модификации, связывание малых молекул и партнёров, сворачивание и локализация <i>(верный вариант)</i><br><span class="expl">Регуляция активности изменяет функцию уже имеющихся молекул и не требует синтеза новых.</span></li><li><b>Б.</b> Это невозможно: активность всегда пропорциональна количеству белка <i>(неверный вариант)</i><br><span class="expl">Количество и активность — разные величины: одинаковое количество может давать разную активность.</span></li><li><b>В.</b> В клетках различается количество мРНК этого белка <i>(неверный вариант)</i><br><span class="expl">Количество белка одинаково; различие — в состоянии самих молекул белка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="semi
