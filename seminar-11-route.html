nar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li></ul><p></p></details></article><article class="card print-unit" id="ns-a4-balance"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 29 из 33</div><h2>Баланс синтеза и распада во времени</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·23, БИО-11·27, БИО-11·28</p><p>Модель исследования 4 описывает мРНК и белок двумя уравнениями: dM/dt = s − M/τM, dP/dt = r·M − P/τP. В стационарном состоянии M* = s·τM, P* = r·M*·τP. Отсюда три вывода. Первый: одинаковое количество мРНК совместимо с разным количеством белка — оно зависит ещё от трансляции и распада белка. Второй: одинаковое низкое количество белка может быть следствием медленного синтеза или быстрого распада; различают их синтез нового белка за час, убыль белка после остановки трансляции и ход накопления после начала транскрипции гена: чем короче <a href="#ns-g-S11-T22">время существования молекулы</a>, тем быстрее устанавливается стационарный уровень. Третий: количество белка не равно активности.</p><p>Новые данные. В четырёх линиях клеток человека около 9 % из почти 12 тысяч белков оказались короткоживущими (половина молекул разрушается за 8 ч и быстрее), и у сотни белков устойчивость различалась между линиями клеток. Время существования одного белка — свойство не только самого белка, но и клетки.</p><div class="static-quiz"><h3>В одной клетке белок медленно синтезируется, в другой быстро распадается; стационарное количество одинаково. Какие измерения их различат?</h3><ol><li><b>А.</b> Стационарное количество белка <i>(неверный вариант)</i><br><span class="expl">Оно одинаково, поэтому и не различает причины.</span></li><li><b>Б.</b> Синтез нового белка за час, убыль белка после остановки трансляции и ход накопления после начала транскрипции <i>(верный вариант)</i><br><span class="expl">Стационарное количество — итог двух потоков; сами потоки и скорость выхода на стационарный уровень у этих клеток различаются.</span></li><li><b>В.</b> Количество мРНК <i>(неверный вариант)</i><br><span class="expl">Оба механизма действуют после мРНК; её количество в обеих клетках может быть одинаковым.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2021.09.015">Li J., Cai Z., Vaites L. P., Shen N., Mitchell D. C., Huttlin E. L., Paulo J. A., Harry B. L., Gygi S. P. Proteome-wide mapping of short-lived proteins in human cells. Mol. Cell. 2021;81(22):4722–4735.e5.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-ferritin-ire"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 30 из 33</div><h2>Железо и трансляция ферритина</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·24, БИО-11·26</p><p><a href="#ns-g-S11-T63">Ферритин</a> — белок, запасающий железо в клетке. В 5′-нетранслируемой области его мРНК, недалеко от <a href="#ns-g-S11-T04">кэпа</a>, находится шпилька — <a href="#ns-g-S11-T64">железочувствительный элемент</a> (IRE). При недостатке железа с IRE связываются <a href="#ns-g-S11-T65">белки регуляции обмена железа</a> — IRP1 и IRP2 — и пространственно препятствуют инициации трансляции: ферритин почти не синтезируется. При достаточном количестве железа в IRP1 собирается <a href="#ns-g-S11-T66">железосерный кластер</a>, и белок теряет способность связывать IRE (в этой форме он служит ферментом — <a href="#ns-g-S11-T67">цитоплазматической аконитазой</a>), а IRP2 убиквитинируется и разрушается протеасомой. IRE освобождается, и мРНК ферритина транслируется. Количество мРНК ферритина при этом может оставаться сопоставимым — изменяется интенсивность синтеза белка.</p><p>Та же система противоположно регулирует <a href="#ns-g-S11-T68">рецептор трансферрина</a> — белок, через который клетка получает железо. Его мРНК несёт IRE в 3′-нетранслируемой области. При недостатке железа связанные IRP защищают эту мРНК от расщепления <a href="#ns-g-S11-T69">эндонуклеазой</a>: мРНК стабильна, рецептор синтезируется. Когда железа достаточно, IRP отделяются, мРНК расщепляется и разрушается. Один и тот же регуляторный белок, связываясь с одинаковыми по устройству элементами, подавляет трансляцию одной мРНК и стабилизирует другую — в зависимости от того, где расположен элемент.</p><p>Мутации в IRE мРНК L-цепи ферритина, нарушающие связывание IRP, вызывают наследственный синдром гиперферритинемии и катаракты: ферритина в сыворотке крови много, хотя избытка железа в организме нет.</p><div class="static-quiz"><h3>Почему один и тот же белок IRP подавляет трансляцию мРНК ферритина, но защищает мРНК рецептора трансферрина?</h3><ol><li><b>А.</b> IRP узнаёт в этих мРНК разные последовательности <i>(неверный вариант)</i><br><span class="expl">В обеих мРНК IRP связывается с одинаковыми по устройству элементами IRE; различается их положение.</span></li><li><b>Б.</b> При недостатке железа ферритин разрушается протеасомой <i>(неверный вариант)</i><br><span class="expl">Ферритина при недостатке железа мало потому, что не идёт его трансляция; протеасомой при достатке железа разрушается IRP2.</span></li><li><b>В.</b> Результат зависит от положения IRE: в 5′-НТО связанный IRP мешает инициации трансляции, в 3′-НТО — защищает мРНК от расщепления эндонуклеазой <i>(верный вариант)</i><br><span class="expl">Элементы одинаковы по устройству, а их действие определяет место в мРНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.3389/fphar.2014.00176">Wilkinson N., Pantopoulos K. The IRP/IRE system in vivo: insights from mouse models. Front. Pharmacol. 2014;5:176.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-rna-level-variety"><div class="eyebrow">После транскрипции: мРНК, трансляция, белок · шаг 31 из 33</div><h2>Другие посттранскрипционные механизмы</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·23, БИО-11·24, БИО-11·25, БИО-11·26</p><p>Экспрессия гена изменяется и на других уровнях после транскрипции: при альтернативном сплайсинге и выборе места полиаденилирования из одного гена образуются разные мРНК (вспомнить: <a href="seminar-9-route.html#alternative-splicing">семинар 9: «Альтернативный сплайсинг: разные мРНК одного гена»</a>); редактирование РНК изменяет отдельные нуклеотиды в РНК без изменения ДНК; мРНК может доставляться в определённый участок цитоплазмы и транслироваться там. Эти механизмы изменяют не только количество мРНК, но и её вариант и место синтеза белка; белковая изоформа меняется, только если затронута <a href="#ns-g-S11-T20">кодирующая область</a>.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Убиквитин-протеасомная система и контроль качества белков — <a href="https://edu.mazunin.science/seminar-11-route.html#ubiquitin-cascade">«Молекулярная биология», семинар 11 «Протеостаз, убиквитин-протеасомная система, ERAD и аутофагический поток»</a>. Время жизни мРНК и её распад подробно — отдельный семинар (в разработке)</p><div class="static-quiz"><h3>Чем альтернативный сплайсинг и выбор места полиаденилирования отличаются от механизмов, изменяющих только количество мРНК?</h3><ol><li><b>А.</b> Они изменяют состав мРНК: из одного гена образуются разные варианты РНК <i>(верный вариант)</i><br><span class="expl">Если изменение затрагивает кодирующую область, меняется белковая изоформа; если только нетранслируемые области — последовательность белка прежняя, но могут измениться стабильность, трансляция или локализация мРНК.</span></li><li><b>Б.</b> Они всегда изменяют аминокислотную последовательность белка <i>(неверный вариант)</i><br><span class="expl">Не всегда: при выборе другого места полиаденилирования или другого экзона в 3′-НТО последовательность белка остаётся прежней, меняются свойства мРНК.</span></li><li><b>В.</b> Они изменяют последовательность ДНК гена <i>(неверный вариант)</i><br><span class="expl">ДНК не изменяется; различаются участки, вошедшие в зрелую мРНК, и положение её 3′-конца.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.</li><li><a href="https://doi.org/10.1038/s41580-024-00805-0">Kim H., Lee Y.-Y., Kim V. N. The biogenesis and regulation of animal microRNAs. Nat. Rev. Mol. Cell Biol. 2025;26(4):276–296.</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог семинара · шаг 32 из 33</div><h2>Сквозная задача: от хроматина до активного белка</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-11·2, БИО-11·23, вспомнить <a href="seminar-7-route.html">семинары 7</a>–<a href="seminar-10-route.html">10</a></p><p>Шесть наблюдений — доступность, занятость гена РНК-полимеразой II, вновь синтезированная РНК (поток синтеза), зрелая мРНК, белок и его активность — сравнивают с тем, что изменилось бы при каждом возможном механизме. Механизм подходит как единственная причина, если сам по себе объясняет и изменённые, и неизменённые наблюдения. Часто таких механизмов несколько: снижение доступности может быть и причиной, и следствием прекращения транскрипции; меньше зрелой мРНК при прежнем синтезе — и нарушение процессинга, и экспорт, и распад в цитоплазме; меньше белка при прежней мРНК — и трансляция, и распад белка; меньше активности при прежнем белке — и мутация, и модификации. Различают такие причины дополнительные измерения скоростей, мест накопления и последовательностей. Экспрессия гена — многоуровневая динамическая система, и её конечный результат не позволяет автоматически восстановить состояние всех предшествующих этапов.</p><div class="static-quiz"><h3>Когда механизм считают способным самостоятельно объяснить профиль из шести наблюдений — от доступности до активности белка?</h3><ol><li><b>А.</b> Когда он объясняет хотя бы одно изменённое наблюдение <i>(неверный вариант)</i><br><span class="expl">Нужно учитывать и неизменённые наблюдения: механизм, который им противоречит, сам по себе профиль не объясняет.</span></li><li><b>Б.</b> Когда он сам по себе объясняет и изменённые, и неизменённые наблюдения <i>(верный вариант)</i><br><span class="expl">Механизм не подходит как единственная причина, если при нём изменилось бы наблюдение, которое на деле не изменилось. Часто таких механизмов несколько — их различают дополнительные измерения.</span></li><li><b>В.</b> Когда он изменяет конечный результат — количество и активность белка <i>(неверный вариант)</i><br><span class="expl">Конечный результат меняют многие механизмы; какие из них подходят, определяют промежуточные наблюдения.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-11.html#q1">Вопрос 1 →</a> <a href="seminar-11.html#q2">Вопрос 2 →</a> <a href="seminar-11.html#q3">Вопрос 3 →</a> <a href="seminar-11.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p>Обзорный шаг: источники — в шагах темы.</p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог семинара · шаг 33 из 33</div><h2>Связи и что дальше</h2><p class="lead"></p><ol class="mech"></ol><h3>Что понадобилось из прежних семинаров</h3><p><a href="seminar-1-route.html">Семинар 1</a> — рецептор и сигнал: сигнал изменяет активность факторов транскрипции (БИО-11·20).</p><p><a href="seminar-7-route.html">Семинар 7</a> — упаковка ДНК и репликация: число копий гена и восстановление хроматина после репликации.</p><p><a href="seminar-8-route.html">Семинар 8</a> — изменения последовательности: мутация может изменить активность белка при неизменном количестве (итоговая задача, случай 4).</p><p><a href="seminar-9-route.html">Семинар 9</a> — транскрипция и процессинг: промотор, общие факторы, кэп, сплайсинг, поли(А) — точки регуляции после синтеза РНК.</p><p><a href="seminar-10-route.html">Семинар 10</a> — трансляция, сворачивание, убиквитин и протеасома — регуляция количества и активности белка.</p><h3>Что дальше в курсе</h3><p><a href="seminar-12-route.html">Семинар 12</a> «Как появилась клетка» объединяет наследственную информацию, компартменты, мембраны и энергетику в эволюционной перспективе. Регуляция в этом семинаре держалась на двух способах узнавания — белок узнаёт участок ДНК, малая РНК узнаёт мРНК по комплементарности; второй способ мог существовать ещё до появления белков.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Сигналы и их динамика — <a href="https://edu.mazunin.science/seminar-3-route.html#receptor-equilibrium">«Молекулярная биология», семинар 3</a>, <a href="https://edu.mazunin.science/seminar-4-route.html#feedback-vs-termination">семинар 4</a></p><p>Нуклеосомы, ремоделирование и гистоны — <a href="https://edu.mazunin.science/seminar-5-route.html#core">«Молекулярная биология», семинар 5</a></p><p>Метилирование ДНК, регуляторные элементы и память — <a href="https://edu.mazunin.science/seminar-6-route.html#memory">«Молекулярная биология», семинар 6</a></p><p>Протеостаз и убиквитин-протеасомная система — <a href="https://edu.mazunin.science/seminar-11-route.html#ubiquitin-cascade">«Молекулярная биология», семинар 11</a></p><p>Время жизни мРНК и её распад (в разработке)</p><div class="static-quiz"><h3>На каких двух способах узнавания держится регуляция, рассмотренная в семинаре?</h3><ol><li><b>А.</b> Рибосома узнаёт промотор; белок узнаёт кодон <i>(неверный вариант)</i><br><span class="expl">Промотор узнают общие факторы транскрипции, а кодон — антикодон тРНК; ни то, ни другое не основа регуляции в этом семинаре.</span></li><li><b>Б.</b> ДНК узнаёт белок по его аминокислотной последовательности <i>(неверный вариант)</i><br><span class="expl">Узнавание идёт в обратную сторону: регуляторный белок узнаёт последовательность ДНК.</span></li><li><b>В.</b> Белок узнаёт участок ДНК; малая РНК узнаёт мРНК по комплементарности <i>(верный вариант)</i><br><span class="expl">Факторы транскрипции, репрессоры и активаторы узнают последовательности ДНК, а микроРНК и малые интерферирующие РНК в комплексе с AGO находят мРНК по спариванию оснований.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-11.html#q1">Вопрос 1 →</a> <a href="seminar-11.html#q2">Вопрос 2 →</a> <a href="seminar-11.html#q3">Вопрос 3 →</a> <a href="seminar-11.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S11-T01"><dt>АТФ (аденозинтрифосфат)</dt><dd>Нуклеотид, энергия гидролиза которого используется во многих процессах клетки, в том числе комплексами ремоделирования хроматина.</dd></div><div id="ns-g-S11-T02"><dt>Ацетилирование гистонов</dt><dd>Присоединение ацетильной группы к остаткам лизина гистонов; нейтрализует их положительный заряд и создаёт участки, которые узнают другие белки.</dd></div><div id="ns-g-S11-T03"><dt>Гистоновый хвост</dt><dd>Неупорядоченный N-концевой участок гистона, выступающий из нуклеосомы; основное место модификаций гистонов.</dd></div><div id="ns-g-S11-T04"><dt>Кэп</dt><dd>7-метилгуанозин на 5′-конце мРНК; защищает 5′-конец от экзонуклеаз и участвует в инициации трансляции. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T05"><dt>Нетранслируемая область (НТО)</dt><dd>Участок зрелой мРНК до старт-кодона (5′-НТО) или после стоп-кодона (3′-НТО); не кодирует аминокислоты и содержит последовательности, от которых зависят трансляция и стабильность мРНК. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T06"><dt>Поли(А)-хвост</dt><dd>Цепочка адениловых остатков на 3′-конце мРНК; защищает 3′-конец, а её укорочение (деаденилирование) — обычно первый этап распада мРНК. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T07"><dt>мРНК (матричная РНК)</dt><dd>РНК, по последовательности кодонов которой рибосома синтезирует белок. Подробнее — семинары 9 и 10.</dd></div><div id="ns-g-S11-T08"><dt>РНК-полимераза II</dt><dd>Фермент ядра эукариот, транскрибирующий гены, кодирующие белки; на промотор её привлекают общие факторы транскрипции. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T09"><dt>Линкерная ДНК</dt><dd>Участок ДНК между соседними нуклеосомами.</dd></div><div id="ns-g-S11-T10"><dt>Мембрана (липидный бислой)</dt><dd>Двойной слой липидов, отделяющий клетку от среды; мембранные белки, например пермеаза и рецепторы, встроены в бислой.</dd></div><div id="ns-g-S11-T11"><dt>Рецептор</dt><dd>Белок, который связывает сигнальную молекулу и в ответ изменяет работу клетки.</dd></div><div id="ns-g-S11-T12"><dt>Сигнал</dt><dd>Молекула, например гормон, которая, связавшись с рецептором, изменяет работу клетки.</dd></div><div id="ns-g-S11-T13"><dt>Рибосома</dt><dd>Комплекс рРНК и белков, синтезирующий белок по мРНК; состоит из малой и большой субчастиц. Подробнее — семинар 10.</dd></div><div id="ns-g-S11-T14"><dt>Вспышки транскрипции</dt><dd>Периоды частой инициации транскрипции гена, разделённые паузами.</dd></div><div id="ns-g-S11-T15"><dt>Ген-регулятор lacI</dt><dd>Ген репрессора lac-оперона; транскрибируется с собственного промотора отдельно от оперона.</dd></div><div id="ns-g-S11-T16"><dt>Киназа (протеинкиназа)</dt><dd>Фермент, переносящий фосфатную группу с АТФ на белок.</dd></div><div id="ns-g-S11-T17"><dt>Общие факторы транскрипции</dt><dd>Белки (TFIID, TFIIB, TFIIE, TFIIF, TFIIH и др.), которые вместе с РНК-полимеразой II собираются на промоторах почти всех генов, транскрибируемых этим ферментом. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T18"><dt>TATA-бокс</dt><dd>Богатая A и T последовательность примерно за 30 нуклеотидов до точки начала транскрипции, которую узнаёт фактор TFIID; есть лишь у части промоторов РНК-полимеразы II. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T19"><dt>Точка начала транскрипции</dt><dd>Нуклеотид ДНК, против которого стоит первый нуклеотид РНК (+1). Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T20"><dt>Кодирующая область</dt><dd>Участок мРНК от старт-кодона до стоп-кодона, последовательность кодонов которого задаёт последовательность аминокислот белка. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T21"><dt>Полицистронная мРНК</dt><dd>мРНК, содержащая несколько кодирующих областей, каждая со своим участком связывания рибосомы.</dd></div><div id="ns-g-S11-T22"><dt>Среднее время существования молекулы</dt><dd>Среднее время от синтеза молекулы до её распада; время полужизни приблизительно равно 0,7 среднего времени существования.</dd></div><div id="ns-g-S11-T23"><dt>Трансацетилаза</dt><dd>Фермент, продукт гена &lt;i&gt;lacA&lt;/i&gt; lac-оперона; в расщеплении лактозы не участвует.</dd></div><div id="ns-g-S11-T24"><dt>Аллолактоза</dt><dd>Изомер лактозы, образующийся в клетке кишечной палочки; связывается с репрессором lac-оперона и снижает его сродство к оператору; физиологический индуктор lac-оперона.</dd></div><div id="ns-g-S11-T25"><dt>Белок-активатор транскрипции (активатор)</dt><dd>Фактор транскрипции, увеличивающий интенсивность транскрипции гена. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T26"><dt>Argonaute (AGO)</dt><dd>Белок, который удерживает малую направляющую РНК и действует на комплементарную ей мРНК; основа комплекса RISC.</dd></div><div id="ns-g-S11-T27"><dt>Ацетилтрансфераза гистонов</dt><dd>Фермент, переносящий ацетильную группу с ацетил-CoA на остатки лизина гистонов.</dd></div><div id="ns-g-S11-T28"><dt>Базальная транскрипция</dt><dd>Низкая интенсивность транскрипции гена в отсутствие активирующих воздействий.</dd></div><div id="ns-g-S11-T29"><dt>β-галактозидаза</dt><dd>Фермент, расщепляющий лактозу на глюкозу и галактозу; продукт гена &lt;i&gt;lacZ&lt;/i&gt;.</dd></div><div id="ns-g-S11-T30"><dt>Время полужизни</dt><dd>Время, за которое распадается половина молекул данного вида.</dd></div><div id="ns-g-S11-T31"><dt>Деацетилаза гистонов</dt><dd>Фермент, удаляющий ацетильные группы с остатков лизина гистонов.</dd></div><div id="ns-g-S11-T32"><dt>Деаденилирование</dt><dd>Укорочение поли(А)-хвоста мРНК; обычно первый этап её распада.</dd></div><div id="ns-g-S11-T33"><dt>Доступность хроматина</dt><dd>Возможность белков связаться с ДНК данного участка хроматина.</dd></div><div id="ns-g-S11-T34"><dt>Затравочный участок</dt><dd>Нуклеотиды 2–7 от 5′-конца микроРНК, спаривание которых с мишенью наиболее важно для её узнавания (вместе с нуклеотидом 8 — расширенный затравочный участок).</dd></div><div id="ns-g-S11-T35"><dt>Индуктор</dt><dd>Малая молекула, снимающая репрессию транскрипции.</dd></div><div id="ns-g-S11-T36"><dt>CAP (белок-активатор катаболитных генов)</dt><dd>Белок кишечной палочки, который в комплексе с цАМФ связывается с ДНК рядом с промоторами ряда оперонов и облегчает связывание РНК-полимеразы.</dd></div><div id="ns-g-S11-T37"><dt>CpG-островок</dt><dd>Участок ДНК длиной около тысячи пар нуклеотидов с повышенным содержанием динуклеотидов CpG; часто включает промотор.</dd></div><div id="ns-g-S11-T38"><dt>Комплекс ремоделирования хроматина</dt><dd>Белковый комплекс, который за счёт энергии гидролиза АТФ сдвигает нуклеосомы, удаляет их или изменяет их состав.</dd></div><div id="ns-g-S11-T39"><dt>Коактиватор</dt><dd>Белок, не связывающийся с ДНК, который привлекается активатором и усиливает транскрипцию.</dd></div><div id="ns-g-S11-T40"><dt>Медиатор (белковый комплекс)</dt><dd>Белковый комплекс, посредник между факторами транскрипции и РНК-полимеразой II. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T41"><dt>Метилирование ДНК</dt><dd>Присоединение метильной группы к цитозину (у позвоночных — в основном в динуклеотидах CpG) без изменения последовательности нуклеотидов.</dd></div><div id="ns-g-S11-T42"><dt>микроРНК</dt><dd>Малая некодирующая РНК длиной около 22 нуклеотидов, которая в комплексе с AGO подавляет трансляцию мРНК-мишени и ускоряет её распад.</dd></div><div id="ns-g-S11-T43"><dt>Малая интерферирующая РНК</dt><dd>Малая двуцепочечная РНК, одна цепь которой в комплексе с AGO2 направляет разрезание полностью комплементарной мРНК.</dd></div><div id="ns-g-S11-T44"><dt>Нуклеосома</dt><dd>Основная единица хроматина: около 147 пар нуклеотидов ДНК, обвитых вокруг октамера гистонов (по две молекулы H2A, H2B, H3 и H4).</dd></div><div id="ns-g-S11-T45"><dt>Оператор</dt><dd>Участок ДНК оперона, с которым связывается репрессор.</dd></div><div id="ns-g-S11-T46"><dt>Оперон</dt><dd>Группа генов бактерии, транскрибируемых с одного промотора в составе одной мРНК.</dd></div><div id="ns-g-S11-T47"><dt>Пермеаза лактозы</dt><dd>Мембранный белок, переносящий лактозу в клетку кишечной палочки; продукт гена &lt;i&gt;lacY&lt;/i&gt;.</dd></div><div id="ns-g-S11-T48"><dt>Пионерный фактор транскрипции</dt><dd>Фактор транскрипции, способный связываться с ДНК на нуклеосоме и способствовать открытию участка.</dd></div><div id="ns-g-S11-T49"><dt>Преинициаторный комплекс</dt><dd>Общие факторы транскрипции и РНК-полимераза II, собранные на промоторе. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T50"><dt>Промотор</dt><dd>Участок ДНК у начала гена, на котором собираются общие факторы транскрипции и РНК-полимераза; задаёт точку начала и направление транскрипции. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T51"><dt>Протеасома</dt><dd>Крупный белковый комплекс, который разворачивает белки, помеченные цепью убиквитина, и расщепляет их на короткие пептиды. Подробнее — семинар 10.</dd></div><div id="ns-g-S11-T52"><dt>Убиквитин</dt><dd>Небольшой белок, который ферменты E1, E2 и E3 присоединяют к белку-мишени; цепь из нескольких молекул убиквитина — сигнал разрушения белка протеасомой. Подробнее — семинар 10.</dd></div><div id="ns-g-S11-T53"><dt>Убиквитинлигаза (E3)</dt><dd>Фермент, который узнаёт определённые белки и присоединяет к ним убиквитин; от неё зависит, какой белок будет помечен. Подробнее — семинар 10.</dd></div><div id="ns-g-S11-T54"><dt>Репрессор</dt><dd>Белок, связывающийся с ДНК и уменьшающий интенсивность транскрипции гена.</dd></div><div id="ns-g-S11-T55"><dt>RISC</dt><dd>Комплекс белка Argonaute с малой направляющей РНК.</dd></div><div id="ns-g-S11-T56"><dt>Стационарное состояние</dt><dd>Состояние, при котором скорости синтеза и распада молекулы равны и её количество постоянно.</dd></div><div id="ns-g-S11-T57"><dt>Фактор транскрипции</dt><dd>Белок, связывающийся с определённой последовательностью ДНК и изменяющий интенсивность транскрипции.</dd></div><div id="ns-g-S11-T58"><dt>Фосфорилирование</dt><dd>Присоединение фосфатной группы к белку (обычно к остатку серина, треонина или тирозина); изменяет активность, структуру или локализацию белка.</dd></div><div id="ns-g-S11-T59"><dt>цАМФ (циклический аденозинмонофосфат)</dt><dd>Малая молекула, передающая внутриклеточный сигнал; у кишечной палочки при недостатке глюкозы её много, и она связывается с белком CAP.</dd></div><div id="ns-g-S11-T60"><dt>Энхансер</dt><dd>Регуляторный участок ДНК, связывающий активаторы и увеличивающий транскрипцию гена; может находиться на большом расстоянии от промотора. Подробнее — семинар 9.</dd></div><div id="ns-g-S11-T61"><dt>Экзосома</dt><dd>Многобелковый комплекс, расщепляющий РНК с 3′-конца.</dd></div><div id="ns-g-S11-T62"><dt>Экспрессия гена</dt><dd>Использование информации гена для синтеза функционального продукта — РНК или белка.</dd></div><div id="ns-g-S11-T63"><dt>Ферритин</dt><dd>Белок, запасающий железо в клетке.</dd></div><div id="ns-g-S11-T64"><dt>Железочувствительный элемент (IRE)</dt><dd>Шпилька в нетранслируемой области мРНК, с которой при недостатке железа связываются белки IRP.</dd></div><div id="ns-g-S11-T65"><dt>Белки регуляции обмена железа (IRP1, IRP2)</dt><dd>РНК-связывающие белки, которые при недостатке железа связываются с IRE: в 5′-нетранслируемой области подавляют инициацию трансляции, в 3′-нетранслируемой области защищают мРНК от расщепления.</dd></div><div id="ns-g-S11-T66"><dt>Железосерный кластер</dt><dd>Группа атомов железа и серы в составе белка.</dd></div><div id="ns-g-S11-T67"><dt>Цитоплазматическая аконитаза</dt><dd>Фермент цитоплазмы; форма белка IRP1 с железосерным кластером, не связывающая IRE.</dd></div><div id="ns-g-S11-T68"><dt>Рецептор трансферрина</dt><dd>Мембранный белок, через который клетка поглощает железо в комплексе с трансферрином — белком плазмы крови, переносящим железо.</dd></div><div id="ns-g-S11-T69"><dt>Эндонуклеаза</dt><dd>Фермент, расщепляющий нуклеиновую кислоту внутри цепи.</dd></div><div id="ns-g-S11-T70"><dt>Положительная обратная связь</dt><dd>Регуляция, при которой продукт процесса усиливает сам этот процесс.</dd></div><div id="ns-g-S11-T71"><dt>Исключение индуктора</dt><dd>Уменьшение поступления индуктора в клетку кишечной палочки в присутствии глюкозы.</dd></div><div id="ns-g-S11-T72"><dt>РНК-полимераза (бактерии)</dt><dd>Фермент, синтезирующий РНК по матрице ДНК; у кишечной палочки одна РНК-полимераза транскрибирует все гены, а начало транскрипции определяют участки промотора.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 11 · Регуляция экспрессии генов · Объяснения","home_eyebrow":"Семинар 11 · самостоятельная подготовка · Объяснения","home_h1":"Регуляция экспрессии генов\nОт хроматина до функционального белка","home_lead":"Клетки одного организма содержат практически одинаковую ДНК, но синтезируют разные наборы РНК и белков. На этой странице по шагам разобрано, на каких уровнях регулируется экспрессия гена — от упаковки ДНК в хроматин до активности готового белка — и почему одинаковый итог может иметь разные причины. Страница разделена на четыре темы. В каждой теме сначала идут базовые шаги — они нужны для коллоквиума и зачёта, — затем продвинутое исследование и научные дополнения, помеченные «сверх программы». Сквозная задача и связи с другими семинарами — в конце страницы","start":"Начать с введения →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; самопроверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"Восемь сценариев (по одному на каждую вкладку на базовом и продвинутом уровне) и итоговая задача: предсказание, наблюдение на схеме и разбор каждого ответа. Пройдите их после объяснений темы.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть ра d":"one-genome","num":1,"section":0,"questions":[1,2,3,4],"title":"Один геном, разные клетки","keywords":["Рецептор","Сигнал","Экспрессия гена"],"lead":[],"mechanism":[],"paragraphs":["Нейрон и лейкоцит одного человека содержат практически одинаковую последовательность ДНК, но различаются формой, функциями и набором белков. Различия создаются не разной ДНК, а тем, какие гены и с какой интенсивностью экспрессируются. [[T62|Экспрессия гена]] — использование записанной в нём информации для синтеза функционального продукта: РНК или белка.","Многие белки нужны почти всем клеткам: белки [[T13|рибосом]], ферменты основных путей обмена, белки цитоскелета. Их количество тем не менее различается в клетках разных типов. Другие белки синтезируются только в клетках определённого типа и обеспечивают их специализированные функции. Дифференцировка клеток — результат изменения экспрессии генов, а не изменения последовательности нуклеотидов. Положение об одинаковом геноме всех клеток — рабочая модель: в лимфоцитах, например, при созревании перестраиваются гены антител и рецепторов T-клеток.","Набор экспрессируемых генов изменяется и в клетках одного типа — в ответ на внеклеточные [[T12|сигналы]]. Так, глюкокортикоиды в гепатоцитах увеличивают синтез тирозинаминотрансферазы — фермента распада тирозина."],"conditions":"","sources":["src_01"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Один геном — разные наборы активных генов","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["клетки А и Б"],"scene":"a3","args":[[1,{"E1":1,"E2":0,"Q":0,"L1":1,"L2":1},{"E1":0,"E2":1,"Q":1,"L1":1,"L2":1}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_m м, синтезируются в одинаковом количестве, различаются только специализированные","correct":false,"feedback":"Даже у белков, нужных почти всем клеткам, — рибосомных белков, ферментов основного обмена, белков цитоскелета — количество в клетках разных типов различается."}]}},{"id":"levels","num":2,"section":0,"questions":[1,2,3,4],"title":"Уровни регуляции экспрессии","keywords":["мРНК (матричная РНК)","Доступность хроматина","Промотор"],"lead":[],"mechanism":[],"paragraphs":["Количество и активность продукта гена регулируются на нескольких уровнях, связанных в одну цепь:","1. [[T33|доступность хроматина]] — могут ли белки транскрипции связаться с [[T50|промотором]] и регуляторными участками;","2. наличие и активность факторов транскрипции;","3. взаимодействие регуляторных последовательностей с промотором;","4. частота инициации транскрипции;","5. процессинг пре-мРНК, экспорт [[T07|мРНК]] из ядра и её стабильность (вспомнить: [[seminar-9-route.html#primary-transcript|семинар 9: «Первичный транскрипт и котранскрипционный процессинг»]]);","6. эффективность трансляции (вспомнить: [[seminar-10-route.html#initiation|семинар 10: «Инициация: малая субчастица находит старт-кодон, инициаторная тРНК — в P-сайте»]]);","7. стабильность, распад и функциональное состояние белка.","Изменение на любом уровне может изменить итог, а одинаковый итог может возникнуть при изменениях на разных уровнях. Поэтому, чтобы установить, где изменилась экспрессия, нужно измерять промежуточные этапы, а не только конечный результат."],"conditions":"Обзорный шаг: источники — в шагах темы.","sources":[],"widget":{"kind":"chain","title":"","s":{"title":"Уровни регуляции экспрессии","status":"Схема качественная","items":["доступность хроматина","наличие и активность факторов транскрипции","взаимодействие регуляторных последовательностей с промотором","частота инициации транскрипции","процессинг пре-мРНК, экспорт мРНК из ядра и её стабильность","эффективность трансляции","стабильность, распад и функциональное состояние белка"]}},"quiz":{"id":"S11-L02","question":"Количество активного белка гена уменьшилось вдвое. Почему по одному этому измерению нельзя сказать, на каком уровне изменилась экспрессия?","options":[{"id":"S11-L02-1","text":"Потому что экспрессия регулируется только на уровне транскрипции, а её по белку не видно","correct":false,"feedback":"Транскрипция — лишь один из уровней: количество белка зависит ещё от процессинга, стабильности мРНК, трансляции и распада белка."},{"id":"S11-L02-2","text":"Одинаковое уменьшение может возникнуть на любом уровне — от доступности хроматина до состояния готового белка","correct":true,"feedback":"Уровни связаны в одну цепь, и изменение любого звена меняет итог. Чтобы найти звено, измеряют промежуточные этапы, а не только конечный результат."},{"id":"S11-L02-3","text":"Потому что активность белка не зависит от экспрессии гена","correct":false,"feedback":"Активный белок — конечный продукт экспрессии; он зависит от всех предшествующих уровней, поэтому и не указывает однозначно, какой из них изменился."}]}},{"id":"operon","num":3,"section":1,"questions":[1],"title":"Оперон","keywords":["мРНК (матричная РНК)","Трансацетилаза","β-галактозидаза","Оператор","Оперон","Промотор"],"lead":[],"mechanism":[],"paragraphs":["У бактерий гены нескольких ферментов одного метаболического пути часто расположены подряд и транскрибируются с одного промотора в составе одной молекулы мРНК. Такую единицу называют [[T46|опероном]], а мРНК — [[T21|полицистронной]]: в ней несколько кодирующих областей, и трансляция каждой начинается со своего участка связывания рибосомы.","lac-оперон кишечной палочки включает промотор, [[T45|оператор]] и три структурных гена: <i>lacZ<\/i> ([[T29|β-галактозидаза]] — расщепляет лактозу на глюкозу и галактозу), <i>lacY<\/i> (пермеаза — переносит лактозу в клетку) и <i>lacA<\/i> ([[T23|трансацетилаза]]). Рядом находится ген <i>[[T15|lacI]]<\/i>; он кодирует [[T54|репрессор]], имеет собственный промотор и транскрибируется отдельно, постоянно и с низкой интенсивностью.","Поскольку гены оперона транскрибируются вместе, их экспрессия изменяется согласованно."],"conditions":"","sources":["src_01","src_02"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"operon","title":"lac-оперон и полицистронная мРНК","status":"Схема качественная","modes_label":"Состояние","modes":["структура оперона"],"notes":["Гены <i>lacZ<\/i>, <i>lacY<\/i> и <i>lacA<\/i> транскрибируются с одного промотора в одну полицистронную мРНК; трансляция каждой кодирующей области начинается со своего участка связывания рибосомы. Поэтому количества трёх белков изменяются согласованно. Ген <i>lacI<\/i> транскрибируется отдельно, со своего промотора."]}},"quiz":{"id":"S11-L03","question":"Почему количества продуктов генов lacZ, lacY и lacA изменяются согласованно?","options":[{"id":"S11-L03-1","text":"У каждого гена собственный промотор с одинаковой последовательностью","correct":false,"feedback":"В опероне промотор один; именно поэтому изменяется транскрипция всех трёх генов сразу."},{"id":"S11-L03-2","text":"Ген lacI транскрибируется вместе с ними и регулирует каждый по отдельности","correct":false,"feedback":"Ген lacI имеет собственный промотор и транскрибируется отдельно; его продукт — репрессор — действует на один общий оператор."},{"id":"S11-L03-3","text":"Гены транскрибируются с одного промотора в составе одной мРНК","correct":true,"feedback":"Оперон — одна единица транскрипции: полицистронная мРНК несёт три кодирующие области, поэтому изменение транскрипции меняет синтез всех трёх продуктов."}]},"exam_quiz":{"id":"S11-E03","question":"Чем отличается отрицательная регуляция от положительной в lac-опероне?","options":[{"id":"S11-E03-1","text":"Отрицательная выключает ген навсегда","correct":false,"feedback":"Репрессия обратима: её снимает индуктор, и она возвращается, когда лактоза исчерпана."},{"id":"S11-E03-2","text":"Положительная действует на трансляцию","correct":false,"feedback":"CAP–цАМФ связывается с ДНК рядом с промотором и действует на инициацию транскрипции, а не на трансляцию."},{"id":"S11-E03-3","text":"Репрессор на операторе подавляет транскрипцию, а CAP–цАМФ рядом с промотором облегчает связывание РНК-полимеразы","correct":true,"feedback":"Это два независимых события с разными белками: репрессор, пока он на операторе, подавляет транскрипцию, а CAP–цАМФ облегчает связывание РНК-полимеразы; высокая транскрипция требует обоих."},{"id":"S11-E03-4","text":"Это одно и то же","correct":false,"feedback":"Регуляция противоположна по знаку и осуществляется разными белками: одна подавляет транскрипцию, другая облегчает её."}]}},{"id":"lac-negative","num":4,"section":1,"questions":[1],"title":"Отрицательная регуляция: репрессор, оператор, индуктор","keywords":["Аллолактоза","Базальная транскрипция","Индуктор","Оператор","Оперон","Репрессор"],"lead":[],"mechanism":[],"paragraphs":["Оператор — участок ДНК рядом с началом транскрипции, с которым связывается белок-репрессор LacI. Пока репрессор связан с оператором, [[T72|РНК-полимераза]] транскрибирует оперон лишь изредка: в клетке есть небольшое количество ферментов оперона ([[T28|базальная транскрипция]]). Это отрицательная регуляция — регуляторный белок подавляет транскрипцию.","Когда в среде появляется лактоза, она поступает в клетку, и из неё образуется изомер — [[T24|аллолактоза]]. Аллолактоза связывается с репрессором и изменяет его конформацию; сродство репрессора к оператору резко снижается, и он отделяется от ДНК. Аллолактоза — физиологический [[T35|индуктор]] lac-оперона: малая молекула, снимающая репрессию.","Важно, что физически изменяется не ДНК, а белок на ДНК: индуктор действует на репрессор, а не на оператор. Когда лактоза исчерпана, репрессор вновь связывается с оператором.","У lac-оперона есть ещё два дополнительных оператора; репрессор может связывать два оператора одновременно, образуя петлю ДНК, что усиливает репрессию."],"conditions":"","sources":["src_01","src_02"],"widget":{"kind":"s11","t id":"S11-L04","question":"Что изменяется, когда аллолактоза освобождает оператор?","options":[{"id":"S11-L04-1","text":"Конформация репрессора: его сродство к оператору резко снижается","correct":true,"feedback":"Индуктор действует на белок, а не на ДНК. Изменённый репрессор отделяется от оператора, и РНК-полимераза может транскрибировать оперон."},{"id":"S11-L04-2","text":"Последовательность оператора, и репрессор перестаёт её узнавать","correct":false,"feedback":"ДНК оператора не изменяется: когда лактоза исчерпана, репрессор вновь связывается с тем же участком."},{"id":"S11-L04-3","text":"Активность РНК-полимеразы, которая сама сталкивает репрессор","correct":false,"feedback":"Аллолактоза связывается с репрессором. РНК-полимеразе мешает репрессор на операторе, а не её собственная активность."}]},"exam_quiz":{"id":"S11-E02","question":"Какая молекула — физиологический индуктор lac-оперона?","options":[{"id":"S11-E02-1","text":"Лактоза","correct":false,"feedback":"Лактоза — источник индуктора: с репрессором связывается образующийся из неё изомер."},{"id":"S11-E02-2","text":"Аллолактоза","correct":true,"feedback":"Аллолактоза образуется из лактозы в клетке и, связываясь с репрессором, снижает его сродство к оператору — это и делает её индуктором."},{"id":"S11-E02-3","text":"ЦАМФ","correct":false,"feedback":"цАМФ связывается с CAP и участвует в положительной регуляции, а не в снятии репрессии."},{"id":"S11-E02-4","text":"Β-галактозидаза","correct":false,"feedback":"β-Галактозидаза — фермент, продукт гена lacZ, а не малая молекула, действующая на репрессор."}]}},{"id":"lac-positive","num":5,"section":1,"questions":[1],"title":"Положительная регуляция: CAP–цАМФ. Действие глюкозы","keywords":["Индуктор","CAP (белок-активатор катаболитных генов)","Оператор","Оперон","Промотор","цАМФ (циклический аденозинмонофосфат)"],"lead":[],"mechanism":[],"paragraphs":["Без активатора промотор lac-оперона инициирует транскрипцию неэффективно, даже если оператор свободен. Инициацию облегчает [[T25|белок-активатор]] [[T36|CAP]] (белок-активатор катаболитных генов), но только в комплексе с циклическим аденозинмонофосфатом ([[T59|цАМФ]]). Комплекс CAP–цАМФ связывается с участком ДНК рядом с промотором и непосредственно контактирует с РНК-полимеразой. Это положительная регуляция.","Когда в среде есть глюкоза, в клетке мало цАМФ, и CAP с ДНК не связывается. Кроме того, при переносе глюкозы в клетку белок её транспортной системы подавляет [[T47|пермеазу лактозы]] и тем уменьшает поступление лактозы (а значит, и образование индуктора). Глюкоза, таким образом, снижает транскрипцию оперона несколькими путями, а не только через цАМФ.","Поэтому снятие репрессии и максимальная транскрипция — разные состояния. Если лактоза и глюкоза есть одновременно, транскрипция ниже максимальной: положительной регуляции нет, а поступление лактозы уменьшено, и оператор может в значительной мере оставаться занятым. Даже когда лактозы достаточно, чтобы освободить оператор, без CAP–цАМФ транскрипция лишь умеренная. Высокая транскрипция достигается, когда оператор свободен и CAP–цАМФ связан с ДНК, — при лактозе и низком количестве глюкозы.","Регуляция не двоичная: интенсивность транскрипции изменяется постепенно и зависит от количества индуктора и цАМФ, а у разных штаммов кишечной палочки различается."],"conditions":"","sources":["src_01","src_02","src_03"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Положительная регуляция","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["лактоза и глюкоза","лактоза без глюкозы"],"scene":"s1b","args":[[{"lac":1,"glc":1}],[{"lac":1,"glc":0}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_muc ":"Сигнал есть. Фактор T активен\nи связан с энхансером. Транскрипции гена Y нет","s11_d3_mask_q":"Чего может не хватать?","s11_d3a_cA":"Клетка А","s11_d3a_cB":"Клетка Б","s11_d3a_E1":"Э1","s11_d3a_E2":"Э2","s11_d3a_P":"P","s11_d3a_g1":"ген 1","s11_d3a_g2":"ген 2","s11_d3a_g1s":"ген 1","s11_d3a_g2s":"ген 2","s11_v_n":"{n}","s11_ms_A":"клетка А, гены 1 / 2","s11_ms_B":"клетка Б, гены 1 / 2","s11_d3a_mask":"Обратная задача: показания","s11_d3a_mask_r":"Сигнал S поступил в обе клетки, рецепторы работают.\nКлетка 3: ген 1 — высокая, ген 2 — базальная.\nКлетка 4: оба гена — базальная","s11_d3a_mask_q":"Какие регуляторные уровни могут объяснить различие?","s11_rd4_M":"мРНК в клетке","s11_rd4_syn":"синтез белка, молекул в час","s11_rd4_P":"белок Z в клетке","s11_rd4_A":"активный белок Z","s11_d4_pA":"А. мРНК гена Z и белок Z в цитоплазме","s11_d4_pB":"Б. Стационарное состояние: числа молекул условные","s11_d4_syn":"транскрипция гена Z: {n} новых молекул мРНК в час","s11_d4_mir":"микроРНК: частичное спаривание","s11_d4_si":"полное спаривание: разрезание","s11_d4_Z":"белок Z","s11_d4_kin":"киназа","s11_d4_e3":"убиквитинлигаза","s11_d4_prot":"протеасома","s11_d4_mask":"Обратная задача: показания","s11_d4_mask_r":"По сравнению с исходным состоянием:\nмРНК — в {m} раза меньше, синтез белка — в {s} раза меньше,\nбелка — в {p} раза меньше; активного белка столько же, сколько белка","s11_fe_sw":"Железо в клетке","s11_fe_low":"недостаточно","s11_fe_high":"достаточно","s11_fe_lock":"Сначала выберите ответ: до ответа переключатель зафиксирован в положении «недостаточно».","s11_fe_pA":"А. мРНК ферритина","s11_fe_pB":"Б. мРНК рецептора трансферрина","s11_fe_pC":"В. Белки IRP","s11_fe_ft_on":"ферритин синтезируется","s11_fe_ft_off":"трансляции нет: IRP на IRE","s11_fe_tfr_stable":"мРНК устойчива, рецептор синтезируется","s11_fe_tfr_cut":"мРНК расщепляется: её меньше","s11_fe_endo":"эндонуклеаза","s11_fe_acon":"цитоплазматическая\nаконитаза","s11_fe_bind":"связывает IRE","s11_fe_deg":"распад","s11_d4a_pA":"А. Потоки в выбранный момент","s11_d4a_pB":"Б. мРНК и белок во времени","s11_d4a_M":"мРНК, M","s11_d4a_P":"белок, P","s11_d4a_A":"активный белок, A","s11_d4a_tx":"транскрипция: {n} в час","s11_d4a_decM":"распад мРНК: M/τM","s11_d4a_tl":"трансляция: {n} в час","s11_d4a_decP":"распад белка: P/τP","s11_d4a_al":"активно {n} %","s11_d4a_time":"время, ч","s11_d4a_axM":"мРНК","s11_d4a_axP":"белок","s11_d4a_now":"{n} ч","s11_rda4_of":"{n} стационарного уровня","s11_d4a_tab1":"Стационарное состояние: клетки А, Б, В","s11_d4a_tab2":"Что различает клетки Б и В (по модели)","s11_d4a_cA":"Клетка А","s11_d4a_cB":"Клетка Б","s11_d4a_cC":"Клетка В","s11_d4a_colM":"мРНК","s11_d4a_colP":"белок","s11_d4a_colSyn":"синтез белка в час","s11_d4a_colChase":"половина белка исчезает за","s11_d4a_col10":"белок через 10 ч","s11_d1a_tab":"Интенсивность транскрипции T, из 100 (глюкоза есть / нет)","s11_d1a_tab_h":"штамм","s11_d1a_tab_L":"лактозы: {l}","s11_d1a_tab_note":"T = 100 × f × a; числа — по правилам модели","s11_d3_prom":"промотор"},"notes":["Аллолактоза сняла репрессор с оператора. Но глюкоза есть, цАМФ мало, CAP–цАМФ на ДНК нет, а без активатора промотор lac-оперона инициирует транскрипцию неэффективно. Транскрипция умеренная","Оператор свободен, комплекс CAP–цАМФ связан рядом с промотором. Транскрипция высокая"],"w":600,"h":420}},"quiz":{"id":"S11-L05","question":"В среде есть лактоза и глюкоза; лактозы достаточно, чтобы освободить оператор. Почему транскрипция всё же ниже максимальной?","options":[{"id":"S11-L05-1","text":"Глюкоза связывается с репрессором и возвращает его на оператор","correct":false,"feedback":"Глюкоза с репрессором не связывается; по условию оператор свободен. Глюкоза действует через количество цАМФ и поступление лактозы."},{"id":"S11-L05-2","text":"При глюкозе в клетке мало цАМФ, CAP–цАМФ не связан с ДНК, а без активатора промотор инициирует транскрипцию неэффективно","correct":true,"feedback":"Снятие репрессии делает транскрипцию возможной, но её интенсивность зависит ещё и от положительной регуляции. Высокая транскрипция требует обоих событий."},{"id":"S11-L05-3","text":"Комплекс CAP–цАМФ при глюкозе подавляет транскрипцию","correct":false,"feedback":"CAP–цАМФ — активатор, облегчающий инициацию. При глюкозе его на ДНК нет, поэтому и нет усиления транскрипции."}]},"exam_quiz":{"id":"S11-E01","question":"Почему в клетке с лактозой и глюкозой lac-оперон транскрибируется слабее, чем в клетке только с лактозой?","options":[{"id":"S11-E01-1","text":"При глюкозе комплекс CAP–цАМФ не связан с ДНК, а поступление лактозы и образование индуктора снижены","correct":true,"feedback":"Глюкоза лишает оперон положительной регуляции и уменьшает поступление лактозы, а значит и образование индуктора; поэтому транскрипция ниже, даже если часть времени оператор свободен."},{"id":"S11-E01-2","text":"Глюкоза разрушает мРНК оперона","correct":false,"feedback":"Такого механизма в регуляции lac-оперона не рассматривали: глюкоза влияет на транскрипцию оперона, а не на распад его мРНК."},{"id":"S11-E01-3","text":"Глюкоза связывается с оператором","correct":false,"feedback":"Глюкоза не связывается с ДНК; с оператором связывается репрессор."},{"id":"S11-E01-4","text":"Глюкоза связывается с репрессором вместо аллолактозы","correct":false,"feedback":"С репрессором связывается индуктор — аллолактоза; глюкоза действует через количество цАМФ и поступление лактозы."}]}},{"id":"operon-limits","num":6,"section":1,"questions":[1],"title":"Чем оперон полезен и где его границы","keywords":["мРНК (матричная РНК)","Сигнал","Оперон","Промотор"],"lead":[],"mechanism":[],"paragraphs":["Оперон показывает общий принцип регуляции транскрипции: белок связывается с определённой последовательностью ДНК, а его активность изменяет малая молекула или сигнал. Этот принцип действует и у эукариот.","Но устройство генов человека другое. Оперонов, как правило, нет: каждый ген имеет собственный промотор, и большинство мРНК содержит одну основную кодирующую область. ДНК упакована в хроматин, поэтому доступность промотора — отдельный уровень регуляции (БИО-11·10). Регуляторные участки могут находиться на расстоянии десятков и сотен тысяч пар нуклеотидов от промотора, и с ними связываются многие разные белки (БИО-11·17). Поэтому модель оперона нельзя переносить на гены человека без изменений."],"conditions":"Источник: MBoC7, с. 412–415.","sources":["src_01"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"compare","title":"Общий принцип и границы модели оперона","status":"Схема качественная","modes_label":"Состояние","modes":["бактерия","клетка человека"],"notes":["У бактерии гены одного пути транскрибируются с одного промотора; регуляторный участок рядом с промотором, нуклеосом нет.","У гена человека свой промотор и одна основная кодирующая область; ДНК упакована в хроматин, регуляторные участки могут быть удалены на десятки и сотни тысяч пар нуклеотидов, и с ними связываются многие разные белки. Общий принцип тот же, но модель оперона без изменений не переносится."]}},"quiz":{"id":"S11-L06","question":"Какой вывод из модели оперона можно перенести на гены человека?","options":[{"id":"S11-L06-1","text":"Гены человека, кодирующие ферменты одного пути, объединены в опероны с общим промотором","correct":false,"feedback":"Оперонов у человека, как правило, нет: каждый ген имеет собственный промотор, и большинство мРНК содержит одну основную кодирующую область."},{"id":"S11-L06-2","text":"Доступность промотора не влияет на транскрипцию, как у бактерий","correct":false,"feedback":"У эукариот ДНК упакована в хроматин, поэтому доступность промотора — отдельный уровень регуляции, которого в модели оперона нет."},{"id":"S11-L06-3","text":"Белок, связанный с определённой последовательностью ДНК, изменяет транскрипцию, а его активность изменяет малая молекула или сигнал","correct":true,"feedback":"Это общий принцип. Устройство генов человека другое: у каждого гена свой промотор, ДНК упакована в хроматин, регуляторные участки бывают удалены от промотора."}]}},{"id":"a1-two-inputs","num":7,"section":1,"questions":[1],"title":"Снятие репрессии и интенсивность транскрипции","keywords":["Сигнал","Индуктор","CAP (белок-активатор катаболитных генов)","Оператор","Оперон","Репрессор"],"lead":[],"mechanism":[],"paragraphs":["В модели исследования 1 интенсивность транскрипции lac-оперона — произведение двух независимых величин: доли времени, когда оператор свободен, и положительной регуляции. Поэтому свободный оператор без CAP–цАМФ даёт лишь десятую часть максимума, а промежуточные количества индуктора дают промежуточную интенсивность. Глюкоза действует на оба множителя: уменьшает цАМФ и поступление лактозы.","Обратная задача модели показывает главное: одинаковую невысокую транскрипцию дают дикий тип при избытке лактозы и глюкозе, мутант без CAP, мутант без репрессора при глюкозе и двойной мутант. Состояние оператора и отсутствие CAP на ДНК у них одинаковы; различают их удаление глюкозы и, отдельно, удаление лактозы, а также количество цАМФ.","Новые данные. Правило, по которому два сигнала определяют транскрипцию оперона, различается у штаммов кишечной палочки, выделенных из природы: один индуктор даёт у разных штаммов от 18 до 83 % максимальной транскрипции, у части штаммов транскрипция слабо зависит от цАМФ, и даже у лабораторного штамма зависимость промежуточная между «нужны оба сигнала» и «достаточно одного». Какое правило действует, определяется и генами оперона, и остальным геномом бактерии. Модель практикума — упрощение одного варианта."],"conditions":"","sources":["src_02"],"base":"БИО-11·4, БИО-11·5","next_base":"nucleosome-access","level":"adv","widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Интенсивность транскрипции T, из 100","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["таблица модели"],"scene":"a1","args":[["tab"]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключ льшую часть времени, а он свободен всё время."},{"id":"S11-L07-3","text":"Ничего: 10 из 100 — максимум при свободном операторе","correct":false,"feedback":"Максимум модели — 100; он достигается, только когда оператор свободен и CAP–цАМФ связан с ДНК."}]},"adv_kind":"Новые данные"},{"id":"lac-feedback","num":8,"section":1,"questions":[1],"title":"Положительная обратная связь lac-оперона","keywords":["β-галактозидаза","Индуктор","Оперон","цАМФ (циклический аденозинмонофосфат)","Положительная обратная связь","Исключение индуктора"],"lead":[],"mechanism":[],"paragraphs":["Пермеаза и β-галактозидаза синтезируются с самого lac-оперона, а пермеаза переносит индуктор в клетку. Чем больше в клетке пермеазы, тем больше индуктора поступает, тем полнее снимается репрессия и тем больше синтезируется новой пермеазы. Так возникает [[T70|положительная обратная связь]]: продукт оперона усиливает синтез продуктов самого оперона.","Обратная связь действует и в обратную сторону. Бактерии выращивали на глицерине в присутствии нерасщепляемого индуктора, и оперон был полностью индуцирован. После добавления глюкозы активность β-галактозидазы в клетках за несколько поколений снизилась примерно в 900 раз. При этом каждое отдельное действие глюкозы было небольшим: уменьшение поступления индуктора ([[T71|исключение индуктора]]) снижало его количество в клетке не более чем в 6 раз, снижение количества цАМФ замедляло синтез ферментов оперона примерно в 3 раза, а ускорение роста, разбавляющее ферменты между дочерними клетками, — лишь в 2 раза. Сильное подавление возникло потому, что эти эффекты усиливались по кругу: меньше индуктора — меньше новой пермеазы — ещё меньше индуктора. Если обратную связь разорвать — у мутантов, транскрибирующих оперон без индуктора, или при избытке индуктора, который проникает в клетку и без пермеазы, — глюкоза почти не подавляет синтез ферментов оперона.","Какой вклад вносит каждый путь действия глюкозы, продолжают обсуждать; описанный эксперимент выполнен с искусственным индуктором, а не с лактозой. Модель исследования 1 обратной связи не содержит: в ней количество индуктора задано условием задачи."],"conditions":"","sources":["src_21"],"base":"БИО-11·4, БИО-11·5","next_base":"nucleosome-access","level":"adv","widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"feedback","title":"Положительная обратная связь lac-оперона","status":"Схема качественная · числа — из описанного эксперимента","modes_label":"Состояние","modes":["петля работает","добавлена глюкоза","петля разорвана"],"notes":["Пермеаза переносит индуктор в клетку: чем больше пермеазы, тем полнее снята репрессия и тем больше синтезируется новой пермеазы.","Эксперимент с нерасщепляемым индуктором, рост на глицерине. Каждое действие глюкозы по отдельности небольшое, но по кругу эффекты усиливаются: активность β-галактозидазы за несколько поколений снизилась примерно в 900 раз.","Если обратная связь разорвана (мутант транскрибирует оперон без индуктора или индуктор в избытке входит и без пермеазы), глюкоза почти не подавляет синтез ферментов оперона."]}},"quiz":{"id":"S11-L08","question":"Почему глюкоза снижала активность β-галактозидазы примерно в 900 раз, хотя каждое её действие по отдельности было небольшим?","options":[{"id":"S11-L08-1","text":"Глюкоза разрушает молекулы β-галактозидазы","correct":false,"feedback":"Активность снижалась постепенно, за несколько поколений: уменьшался синтез ферментов, и они разбавлялись между дочерними клетками."},{"id":"S11-L08-2","text":"Эффекты усиливались по кругу: меньше индуктора — меньше новой пермеазы — ещё меньше индуктора","correct":true,"feedback":"Продукт оперона, пермеаза, переносит индуктор в клетку, поэтому небольшие эффекты умножаются через положительную обратную связь. Если её разорвать, глюкоза почти не подавляет синтез ферментов."},{"id":"S11-L08-3","text":"Подавление целиком объясняется снижением цАМФ","correct":false,"feedback":"Снижение цАМФ замедляло синтез ферментов лишь примерно в 3 раза; сильное подавление требует обратной связи."}]},"adv_kind":"Новые данные"},{"id":"trp-operon","num":9,"section":1,"questions":[1],"title":"Репрессия: trp-оперон","keywords":["Сигнал","Оператор","Оперон","Репрессор"],"lead":[],"mechanism":[],"paragraphs":["Гены ферментов синтеза триптофана у кишечной палочки также образуют оперон. Его репрессор связывается с оператором, только если присоединил триптофан. Когда триптофана много, оперон транскрибируется редко; когда мало — репрессор неактивен, и ферменты синтезируются. Это отрицательная обратная связь: конечный продукт пути подавляет синтез своих ферментов. У lac-оперона малая молекула снимает репрессию (индукция), у trp-оперона — включает её (репрессия).",{"h":"Дальше в курсе «Молекулярная биология»"},"Рецепция и молекулярные переключатели — [[https://edu.mazunin.science/seminar-3-route.html#receptor-equilibrium|«Молекулярная биология», семинар 3 «Рецепция и молекулярные переключатели»]]; динамика, обратные связи и интеграция сигналов — [[https://edu.mazunin.science/seminar-4-route.html#feedback-vs-termination|«Молекулярная биология», семинар 4 «Динамика, обратные связи и интеграция сигналов»]]"],"conditions":"","sources":["src_01"],"base":"БИО-11·3, БИО-11·4","next_base":"nucleosome-access","level":"adv","widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"trp","title":"trp-оперон: репрессия конечным продуктом","status":"Схема качественная","modes_label":"Состояние","modes":["триптофана мало","триптофана много"],"notes":["Когда триптофана мало, репрессор неактивен: РНК-полимераза связывается с промотором и транскрибирует гены ферментов синтеза триптофана.","Репрессор связывается с оператором, только если присоединил триптофан. Оператор перекрывается с промотором, поэтому комплекс репрессора с триптофаном не даёт РНК-полимеразе связаться с промотором: оперон транскрибируется редко. Конечный продукт пути подавляет синтез своих ферментов."]}},"quiz":{"id":"S11-L09","question":"Чем действие триптофана на trp-оперон отличается от действия аллолактозы на lac-оперон?","options":[{"id":"S11-L09-1","text":"Триптофан, как аллолактоза, снимает репрессор с оператора","correct":false,"feedback":"Без триптофана репрессор trp-оперона неактивен; триптофан нужен ему, чтобы связаться с оператором."},{"id":"S11-L09-2","text":"Триптофан связывается с CAP и усиливает транскрипцию","correct":false,"feedback":"Триптофан действует через собственный репрессор trp-оперона; при его избытке транскрипция снижается."},{"id":"S11-L09-3","text":"Триптофан включает репрессию: репрессор связывается с оператором, только присоединив триптофан","correct":true,"feedback":"Конечный продукт пути подавляет синтез своих ферментов — отрицательная обратная связь. У lac-оперона малая молекула, наоборот, снимает репрессию."}]},"adv_kind":"Исследование модели"},{"id":"nucleosome-access","num":10,"section":2,"questions":[2],"title":"Нуклеосома и доступность ДНК","keywords":["Нуклеосома","Промотор"],"lead":[],"mechanism":[],"paragraphs":["Вспомнить: [[seminar-3-route.html#chromatin-levels|семинар 3: «Уровни организации хроматина»]]. Основная единица хроматина — [[T44|нуклеосома]]: около 147 пар нуклеотидов ДНК, обвитых вокруг октамера гистонов (по две молекулы H2A, H2B, H3 и H4). Соседние нуклеосомы соединены [[T09|линкерной ДНК]].","ДНК, намотанная на октамер, малодоступна для большинства белков. Нуклеосома на промоторе препятствует связыванию [[T17|общих факторов транскрипции]] и [[T08|РНК-полимеразы II]]; верно и обратное — если аппарат транскрипции уже собран на промоторе, нуклеосома на этом месте не образуется. Нуклеосома и аппарат транскрипции конкурируют за один участок ДНК.","Доступность участка хроматина — возможность белков связаться с его ДНК. Её изменение — самостоятельный уровень регуляции экспрессии. Доступность различается в клетках разных типов, и доступные участки в основном совпадают с промоторами и другими регуляторными участками."],"conditions":"","sources":["src_01","src_08"],"widget":{"kind":"s11","t а счёт энергии гидролиза АТФ они смещают ДНК относительно гистонового октамера: сдвигают нуклеосомы вдоль ДНК, удаляют их или заменяют гистоны их вариантами.","В разбираемой схеме к нужному гену комплекс ремоделирования привлекают белки, связывающиеся с определённой последовательностью, — например, активаторы транскрипции; у разных комплексов механизмы адресации к участкам ДНК различаются. Так набор активаторов в клетке определяет, какие промоторы станут доступными.","Сдвиг нуклеосомы делает промотор доступным, но это необходимое, а не достаточное условие транскрипции: на доступном промоторе ещё должен собраться аппарат транскрипции (БИО-11·16)."],"conditions":"","sources":["src_01"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Ремоделирование хроматина","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["ремоделирование без ацетилтрансферазы и аппарата","полный набор"],"scene":"s2b","args":[[{"H":0,"G":0}],[{}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_much":"много","s11_v_little":"мало","s11_v_glc_yes":"есть","s11_v_glc_no":"нет","s11_rd1_op":"Оператор","s11_rd1_cap":"CAP–цАМФ на ДНК","s11_rd1_camp":"цАМФ в клетке","s11_rd1_tx":"Интенсивность транскрипции оперона","s11_rd1_glc":"Глюкоза в среде","s11_ms_tx":"транскрипция","s11_d1_pA":"А. Клетка кишечной палочки: lac-оперон","s11_d1_pB":"Б. Интенсивность транскрипции оперона","s11_d1_medium":"В среде:","s11_d1_lac":"лактоза","s11_d1_glc":"глюкоза","s11_d1_none":"ни лактозы, ни глюкозы","s11_d1_lacI_note":"lacI: транскрибируется\nпостоянно, слабо","s11_d1_capsite":"участок CAP","s11_d1_mrna":"мРНК: одна молекула, три кодирующие области","s11_d1_camp_hi":"цАМФ мн ции различаются, но объяснять адресность узнаванием промотора самим комплексом здесь не нужно."},{"id":"S11-E04-2","text":"Он изменяет последовательность нуклеотидов","correct":false,"feedback":"Ремоделирование изменяет положение нуклеосом, а не последовательность нуклеотидов."},{"id":"S11-E04-3","text":"Сдвинув нуклеосому, он сам начинает транскрипцию","correct":false,"feedback":"Сдвиг нуклеосомы лишь делает промотор доступным; для транскрипции на нём должен собраться аппарат транскрипции."},{"id":"S11-E04-4","text":"Он сдвигает нуклеосомы за счёт энергии гидролиза АТФ, а к определённым генам его привлекают белки, узнающие последовательность ДНК","correct":true,"feedback":"Комплекс использует энергию АТФ, чтобы сдвинуть нуклеосомы; к определённым генам его направляют белки, узнающие последовательность ДНК, — поэтому доступными становятся именно эти промоторы."}]}},{"id":"histone-modifications","num":12,"section":2,"questions":[2],"title":"Модификации гистонов: ацетилирование и его границы","keywords":["Ацетилирование гистонов","Промотор","Репрессор"],"lead":[],"mechanism":[],"paragraphs":["Аминокислотные остатки гистонов, прежде всего в их N-концевых участках («[[T03|хвостах]]»), подвергаются ковалентным модификациям: ацетилированию и метилированию лизинов, [[T58|фосфорилированию]] серинов и другим. Модификации вносят и удаляют разные ферменты; другие белки узнают модифицированные остатки.","[[T27|Ацетилтрансферазы гистонов]] переносят ацетильную группу с ацетил-CoA на остатки лизина, [[T31|деацетилазы гистонов]] её удаляют. Ацетилирование нейтрализует положительный заряд лизина и ослабляет связь гистонов с ДНК. Ацетилированные лизины узнают белки с бромодоменом, в том числе субъединицы общего фактора транскрипции TFIID и комплексов ремоделирования. Активаторы привлекают к промотору ацетилтрансферазы, репрессоры — деацетилазы.","[[T02|Ацетилирование гистонов]] обычно сопутствует активной транскрипции, но не служит универсальным выключателем. Во-первых, эффект модификации определяется тем, какие белки её узнают на данном участке и в данном типе клеток. Во-вторых, значительная часть ацетилирования гистонов сама зависит от транскрипции (БИО-11·14). Поэтому утверждение «ацетилирование любого гистона активирует любой ген» неверно. Метилирование лизинов связано и с активацией, и с репрессией: триметилирование лизина 4 гистона H3 характерно для активных промоторов, триметилирование лизинов 9 и 27 — для репрессированного хроматина."],"conditions":"","sources":["src_01","src_04"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"acetyl","title":"Ацетилирование гистонов и транскрипция","status":"Схема качественная","modes_label":"Состояние","modes":["ген транскрибируется","транскрипция остановлена"],"notes":["Активатор привлекает ацетилтрансферазу; на гене ацетилирование гистонов и транскрипция наблюдаются вместе. Это ещё не доказывает, что ацетилирование вызвало транскрипцию.","По новым данным (БИО-11·14), в дрожжах после быстрой остановки РНК-полимеразы II бо́льшая часть ацетилирования гистонов исчезла, хотя ацетилтрансферазы оставались привлечены к генам: значительная часть ацетилирования сама зависит от транскрипции."]}},"quiz":{"id":"S11-L12","question":"На гене гистоны ацетилированы и идёт транскрипция. Можно ли заключить, что ацетилирование её вызвало?","options":[{"id":"S11-L12-1","text":"Да: ацетилирование любого гистона активирует любой ген","correct":false,"feedback":"Это утверждение неверно: эффект модификации зависит от участка, от белков, узнающих её, и от типа клеток."},{"id":"S11-L12-2","text":"Нет, потому что ацетилирование всегда подавляет транскрипцию","correct":false,"feedback":"Ацетилирование ослабляет связь гистонов с ДНК и создаёт участки для белков, способствующих транскрипции; удаляют ацетильные группы деацетилазы, которые привлекают репрессоры."},{"id":"S11-L12-3","text":"Нет: значительная часть ацетилирования сама зависит от транскрипции","correct":true,"feedback":"Ацетилирование обычно сопутствует активной транскрипции, но совпадение не указывает, что из них причина; к тому же эффект модификации зависит от белков, которые её узнают."}]}},{"id":"dna-methylation","num":13,"section":2,"questions":[2],"title":"Метилирование ДНК: важно, где","keywords":["Метилирование ДНК","Промотор","Репрессор"],"lead":[],"mechanism":[],"paragraphs":["У позвоночных метилируется в основном цитозин в динуклеотидах CpG; образуется 5-метилцитозин. Последовательность нуклеотидов при этом не изменяется. Бо́льшая часть CpG генома метилирована, кроме [[T37|CpG-островков]] — участков длиной около тысячи пар нуклеотидов с повышенным содержанием CpG. CpG-островки обычно включают промоторы; у человека около 60 % генов, кодирующих белки, имеют промоторы в CpG-островках, и в норме эти островки не метилированы.","Метилирование CpG-островка промотора связано с устойчивым подавлением транскрипции: метилированные CpG узнают белки, которые привлекают деацетилазы гистонов и другие репрессорные комплексы. Метилирование CpG в транскрибируемой части гена, напротив, часто встречается у активно транскрибируемых генов. Поэтому [[T41|метилирование ДНК]] — не универсальный выключатель: его действие зависит от того, какой участок метилирован.","Профиль метилирования сохраняется при делении клетки; механизмы этого и роль метилирования в развитии разбираются в курсе «Молекулярная биология»."],"conditions":"","sources":["src_01","src_17"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Метилирование ДНК","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["в транскрибируемой части","в промоторе"],"scene":"s2b","args":[[{"me":"body"}],[{"me":"prom"}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени" ательность; эффект определяют белки, которые узнают метилированные CpG в данном участке, например привлекающие деацетилазы гистонов."},{"id":"S11-L13-2","text":"Потому что метилирование изменяет последовательность нуклеотидов","correct":false,"feedback":"Образуется 5-метилцитозин; последовательность нуклеотидов при этом не изменяется."},{"id":"S11-L13-3","text":"Потому что метилированные CpG всегда активируют ген","correct":false,"feedback":"Метилирование CpG-островка промотора связано, наоборот, с устойчивым подавлением транскрипции."}]},"exam_quiz":{"id":"S11-E06","question":"Как действует метилирование CpG?","options":[{"id":"S11-E06-1","text":"Всегда выключает ген","correct":false,"feedback":"Метилирование транскрибируемой части часто наблюдают у активно транскрибируемых генов, поэтому «всегда выключает» неверно."},{"id":"S11-E06-2","text":"Зависит от участка: метилирование CpG-островка промотора связано с устойчивой репрессией, метилирование в теле гена встречается у активных генов","correct":true,"feedback":"Эффект определяют белки, узнающие метилированные CpG в данном участке: в CpG-островке промотора они привлекают репрессорные комплексы, а в транскрибируемой части гена метилирование часто встречается у активных генов."},{"id":"S11-E06-3","text":"Всегда активирует","correct":false,"feedback":"Метилирование CpG-островка промотора связано с устойчивым подавлением транскрипции."},{"id":"S11-E06-4","text":"Изменяет последовательность нуклеотидов","correct":false,"feedback":"Метилирование присоединяет метильную группу к цитозину; последовательность нуклеотидов не изменяется."}]}},{"id":"a2-access","num":14,"section":2,"questions":[2],"title":"Доступность — необходимое, но недостаточное условие","keywords":["Ацетилирование гистонов","мРНК (матричная РНК)","Промотор","Репрессор","Фактор транскрипции"],"lead":[],"mechanism":[],"paragraphs":["Для транскрипции нужны и доступный регуляторный участок, и активный фактор транскрипции, связанный с ним. В модели исследования 2 одинаковое отсутствие транскрипции в двух клетках имеет разные причины: в одной закрыт участок, в другой неактивен фактор. [[T48|Пионерные факторы транскрипции]] способны связываться с ДНК на нуклеосоме и способствовать открытию участка; но открытый ими участок без активатора не транскрибируется. Если участок доступен, а вновь синтезированной РНК нет, проверяют фактор, его активность и связывание, репрессоры и аппарат транскрипции; если измерена зрелая мРНК или белок — ещё и процессинг, распад и трансляцию.","Новые данные. Ацетилирование гистонов не только способствует транскрипции, но и во многом следует за ней. В дрожжах после быстрой остановки РНК-полимеразы II бо́льшая часть ацетилирования гистонов исчезла; ацетилтрансферазы, привлечённые активаторами к промоторам, без транскрипции гистоны не ацетилировали. Быстрое деацетилирование после остановки транскрипции наблюдали и в эмбриональных стволовых клетках мыши. Поэтому ацетилирование гистонов на гене — свидетельство транскрипции, но не доказательство того, что оно её вызвало."],"conditions":"","sources":["src_01","src_04"],"base":"БИО-11·10, БИО-11·11, БИО-11·12, БИО-11·18","next_base":"promoter","level":"adv","widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Доступность и фактор транскрипции","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["исходные клетки","пионерный фактор в клетке 1"],"scene":"a2","args":[[{"open0":0,"pio":0,"T":"active"},{"open0":1,"pio":0,"T":"inactive"}],[{"open0":0,"pio":1,"T":"active"},{"open0":1,"pio":0,"T":"inactive"}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_much":"много","s11_v_little":"мало","s11_v_glc_yes":"есть","s11_v_glc  участок."}]},"adv_kind":"Новые данные"},{"id":"methylation-memory","num":15,"section":2,"questions":[2],"title":"Метилирование ДНК и сохранение состояния экспрессии","keywords":["Метилирование ДНК","Промотор"],"lead":[],"mechanism":[],"paragraphs":["После репликации ДНК полуметилирована: CpG родительской цепи метилирован, новой — нет. Поддерживающая ДНК-метилтрансфераза метилирует цитозин новой цепи по образцу родительской, поэтому профиль метилирования сохраняется при делениях клетки. В развитии млекопитающих профили метилирования дважды широко перестраиваются — в раннем зародыше и в клетках зародышевой линии. Метилирование CpG-островка промотора часто следует за подавлением гена другими механизмами и закрепляет его. Подробно — в курсе «Молекулярная биология».","[[https://edu.mazunin.science/seminar-6-route.html#memory|→ «Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»]]",{"h":"Дальше в курсе «Молекулярная биология»"},"Нуклеосомы, ремоделирование и модификации гистонов подробно — [[https://edu.mazunin.science/seminar-5-route.html#core|«Молекулярная биология», семинар 5 «Нуклеосомы, ремоделирование и гистоны»]]; метилирование ДНК и сохранение состояний — [[https://edu.mazunin.science/seminar-6-route.html#memory|«Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»]]"],"conditions":"","sources":["src_17"],"base":"БИО-11·13","next_base":"promoter","level":"adv","widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"meth","title":"Сохранение метилирования CpG при репликации","status":"Схема качественная","modes_label":"Этап","modes":["до репликации","после репликации","поддерживающее метилирование"],"notes":["До репликации цитозин CpG метилирован в обеих цепях.","После репликации ДНК полуметилирована: CpG родительской цепи метилирован, новой — нет.","Поддерживающая ДНК-метилтрансфераза метилирует цитозин новой цепи по образцу родительской, поэтому профиль метилирования сохраняется при делениях клетки."]}},"quiz":{"id":"S11-L15","question":"Почему профиль метилирования ДНК сохраняется при делениях клетки?","options":[{"id":"S11-L15-1","text":"Новая цепь сразу синтезируется из метилированных нуклеотидов","correct":false,"feedback":"Сразу после репликации CpG новой цепи не метилированы; их метилирует фермент по образцу родительской цепи."},{"id":"S11-L15-2","text":"Профиль метилирования заново устанавливается в каждой клетке после деления","correct":false,"feedback":"Профиль копируется; широкие перестройки происходят лишь в раннем зародыше и в клетках зародышевой линии."},{"id":"S11-L15-3","text":"После репликации ДНК полуметилирована, и поддерживающая ДНК-метилтрансфераза метилирует новую цепь по образцу родительской","correct":true,"feedback":"Метка родительской цепи служит образцом для новой, поэтому профиль копируется в каждом цикле."}]},"adv_kind":"Новые данные"},{"id":"promoter","num":16,"section":3,"questions":[2],"title":"Промотор и преинициаторный комплекс","keywords":["РНК-полимераза II","Общие факторы транскрипции","Преинициаторный комплекс","Промотор","РНК-полимераза (бактерии)"],"lead":[],"mechanism":[],"paragraphs":["Промотор — участок ДНК, на котором собирается аппарат транскрипции и начинается синтез РНК (вспомнить: [[seminar-9-route.html#promoter-start|семинар 9: «Промотор и точка начала транскрипции: +1 — не старт-кодон»]]). На доступном промоторе гена, транскрибируемого РНК-полимеразой II, собираются общие факторы транскрипции (TFIID, TFIIB, TFIIE, TFIIF, TFIIH) и сама РНК-полимераза II; вместе они образуют [[T49|преинициаторный комплекс]]. Сборку обычно начинает фактор TFIID, узнающий последовательности промотора.","Общие факторы одинаковы для всех генов РНК-полимеразы II. Поэтому то, какие гены и как часто транскрибируются, определяют не они, а факторы транскрипции, связанные с регуляторными участками конкретного гена (БИО-11·18)."],"conditions":"","sources":["src_01"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"tit
