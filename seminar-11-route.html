"S11-L16","question":"Общие факторы транскрипции одинаковы для всех генов РНК-полимеразы II. Что тогда определяет, какие гены и как часто транскрибируются?","options":[{"id":"S11-L16-1","text":"Факторы транскрипции, связанные с регуляторными участками конкретного гена","correct":true,"feedback":"Общие факторы обеспечивают сборку аппарата на доступном промоторе любого гена, а различия между генами создают регуляторные белки и их участки."},{"id":"S11-L16-2","text":"Набор общих факторов, свой для каждого гена","correct":false,"feedback":"Общие факторы одинаковы для всех генов, транскрибируемых РНК-полимеразой II."},{"id":"S11-L16-3","text":"Только наличие TATA-бокса в промоторе","correct":false,"feedback":"TATA-бокс есть лишь у части промоторов; частоту транскрипции определяют регуляторные белки."}]}},{"id":"enhancer","num":17,"section":3,"questions":[3],"title":"Энхансер","keywords":["Промотор","Энхансер"],"lead":[],"mechanism":[],"paragraphs":["[[T60|Энхансер]] — участок ДНК, с которым связываются белки-активаторы и который увеличивает интенсивность транскрипции гена. Энхансер может находиться перед геном, после него, в интроне и на расстоянии от десятков тысяч до миллиона пар нуклеотидов от промотора. У одного гена бывает несколько энхансеров, и каждый связывает несколько разных факторов транскрипции.","Наличие последовательности энхансера в геноме не гарантирует активации гена. Чтобы энхансер действовал, он должен быть доступен, с ним должны связаться нужные активные факторы, а их действие должно быть передано на аппарат транскрипции промотора. В клетках разных типов одни и те же энхансеры доступны или закрыты по-разному.","Как действие удалённого энхансера передаётся на промотор, изучено не полностью. Широко принятая модель — сближение энхансера и промотора в пространстве: ДНК между ними образует петлю. Но устойчивая петля не обязательна для действия каждого энхансера: предложены и другие модели связи энхансера с промотором. Пространственная близость сама по себе не доказывает активации; описан даже случай, когда при активации энхансера в развивающихся нервных клетках расстояние между ним и промотором увеличивалось (БИО-11·22)."],"conditions":"","sources":["src_01","src_12","src_13"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Энхансер","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["энхансер на нуклеосомах","энхансер доступен"],"scene":"s3b","args":[[{"enh":"closed"}],[{}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_much":"много","s11_v_little":"мало","s11_v_glc_yes":"есть","s11_v_glc_no":"нет","s11_rd1_op":"Оператор","s11_rd1_cap":"CAP–цАМФ на ДНК","s11_rd1_camp":"цАМФ в клетке","s11_rd1_tx":"Интенсивность транскрипции оперона","s11_rd1_glc":"Глюкоза в среде","s11_ms_tx":"транскрипция","s11_d1_pA":"А. Клетка кишечной палочки: lac-оперон","s11_d1_pB":"Б. Интенсивность транскрипции оперона","s11_d1_medium":"В среде:","s11_d1_lac":"лактоза","s11_d1_glc":"глюкоза","s11_d1_none":"ни лактозы, ни глюкозы","s11_d1_lacI_note":"lacI: транскрибируется\nпостоянно, слабо","s11_d1_capsite":"участок CAP","s11_d1_mrna":"мРНК: одна молекула, три кодирующие области","s11_d1_camp_hi":"цАМФ много","s11_d1_camp_lo":"цАМФ мало","s11_d1_half":"свободен половину времени","s11_d1_mask":"Показания двух культур","s11_d1_cult1":"Культура 1","s11_d1_cult2":"Культура 2","s11_d1a_pA":"А. lac-оперон: оператор и CAP–цАМФ","s11_d1a_pB":"Б. Индуктор в клетке","s11_d1a_pC":"В. Интенсивность транскрипции, из 100","s11_d1a_ind_note":"аллолактоза, связывающаяся с репрессором","s11_d1a_log":"шкала логарифмическая: каждое деление — в 10 раз","s11_ind_0":"нет","s11_ind_1":"мало","s11_ind_2":"много","s11_st "id":"S11-E07-4","text":"Энхансер кодирует белок-активатор","correct":false,"feedback":"Энхансер — регуляторный участок ДНК, с которым связываются белки-активаторы; он не кодирует белок."}]}},{"id":"activators-repressors","num":18,"section":3,"questions":[3],"title":"Активаторы и репрессоры","keywords":["Коактиватор","Медиатор","Промотор","Репрессор"],"lead":[],"mechanism":[],"paragraphs":["[[T57|Факторы транскрипции]] — белки, связывающиеся с определёнными последовательностями ДНК и изменяющие интенсивность транскрипции. Активаторы увеличивают её: непосредственно ускоряют сборку общих факторов, взаимодействуют с [[T40|медиатором]] и привлекают [[T39|коактиваторы]], изменяющие хроматин, — ацетилтрансферазы и комплексы ремоделирования.","Репрессоры уменьшают транскрипцию разными способами: конкурируют с активаторами за участок ДНК, связываются с самими активаторами, препятствуют сборке общих факторов транскрипции, привлекают деацетилазы и комплексы, возвращающие нуклеосомы на промотор.","Транскрипцию одного гена обычно регулируют несколько факторов одновременно, и итог определяется их сочетанием, а не одним из них."],"conditions":"","sources":["src_01"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"combo","title":"Активаторы и репрессоры","status":"Схема качественная","modes_label":"Состояние","modes":["только активатор","репрессор занял участок","репрессор привлёк деацетилазу"],"notes":["Активатор на своём участке привлекает общие факторы транскрипции, медиатор и коактиваторы: транскрипция высокая.","Репрессор конкурирует с активатором за участок ДНК: активатор не связан, транскрипция снижена.","Активатор связан, но соседний репрессор привлекает деацетилазу, и нуклеосома остаётся на промоторе: транскрипция снижена. Итог определяется сочетанием факторов."]}},"quiz":{"id":"S11-L18","question":"Почему по наличию одного активатора нельзя предсказать транскрипцию гена?","options":[{"id":"S11-L18-1","text":"Активаторы действуют на трансляцию, а не на активированный фактор в клетках разных типов увеличивает транскрипцию разных генов. Причина — различия в доступности энхансеров, в наборе факторов-партнёров и в передаче действия на промоторы. Так, в клетках двух типов мыши до 95 % новых участков связывания глюкокортикоидного рецептора после гормона приходилось на участки, доступные ещё до гормона, а общими для обоих типов клеток оказались лишь около 11 % участков связывания. Поэтому ответ клетки на сигнал определяется не только сигналом и рецептором, но и тем, в каком состоянии находятся регуляторные участки её генома."],"conditions":"","sources":["src_01","src_05"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"От сигнала к гену","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["сигнала нет","сигнал есть","клетка другого типа"],"scene":"s3b","args":[[{"S":0}],[{}],[{"enh":"closed"}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_much":"много","s11_v_little":"мало","s11_v_glc_yes":"есть","s11_v_glc_no":"нет","s11_rd1_op":"Оператор","s11_rd1_cap":"CAP–цАМФ на ДНК","s11_rd1_camp":"цАМФ в клетке","s11_rd1_tx":"Интенсивность транскрипции оперона","s11_rd1_glc":"Глюкоза в среде","s11_ms_tx":"транскрипция","s11_d1_pA":"А. Клетка кишечной палочки: lac-оперон","s11_d1_pB":"Б. Интенсивность транскрипции оперона","s11_d1_medium":"В среде:","s11_d1_lac":"лактоза","s11_d1_glc":"глюкоза","s11_d1_none":"ни лактозы, ни глюкозы","s11_d1_lacI_note":"lacI: транскрибируется\nпостоянно, слабо","s11_d1_capsite":"участок CAP","s11_d1_mrna":"мРНК: одна молекула, три кодирующие области","s11_d1_camp_hi":"цАМФ много","s11_d1_camp_lo":"цАМФ мало","s11_d1_half":"свободен половину времени","s1 доступностью хроматина и наличием партнёров, поэтому в разных клетках он действует на разные гены."},{"id":"S11-E09-2","text":"У клеток разные последовательности ДНК","correct":false,"feedback":"Клетки одного организма содержат одинаковый геном."},{"id":"S11-E09-3","text":"Фактор в каждой клетке узнаёт другую последовательность","correct":false,"feedback":"Фактор узнаёт одну и ту же последовательность; различается, доступна ли она в клетке."},{"id":"S11-E09-4","text":"Энхансеры действуют только в одной из клеток, потому что их нет в геноме другой","correct":false,"feedback":"Энхансеры есть в геномах обеих клеток; различается их доступность."}]}},{"id":"a3-one-signal","num":21,"section":3,"questions":[3],"title":"Один сигнал — разные ответы","keywords":["Рецептор","Сигнал","Промотор","Энхансер"],"lead":[],"mechanism":[],"paragraphs":["В модели исследования 3 сигнал одинаково активирует фактор R в двух клетках, но клетка А транскрибирует ген 1, а клетка Б — ген 2. Для каждого гена нужно сочетание условий: доступный энхансер, активный фактор, для гена 2 — партнёр Q, и передача действия на промотор. Открыть один энхансер недостаточно, если не хватает партнёра; связывание факторов с энхансером недостаточно, если нарушена передача.","Почему один фактор в разных клетках связывается с разными участками, показано в шаге БИО-11·20: связывание во многом определяется заранее различной доступностью хроматина.","Новые данные. Даже один энхансер может состоять из участков с противоположной ролью: из четырёх участков связывания глюкокортикоидного рецептора перед одним геном в клетках опухоли молочной железы человека три усиливали транскрипцию, а один подавлял её, и гормон снимал это подавление. Ответ на гормон различался и между соседними клетками; авторы предполагают, что это связано с разным использованием четырёх участков.","Модель показывает принцип регуляторной специфичности; дифференцировка клеток не сводится к действию одного фактора, а реальные регуляторные сети включают со ную связь проверяют функционально: удаляют или изменяют энхансер и измеряют транскрипцию. Как именно энхансер действует на удалённый промотор, остаётся открытой научной проблемой.","[[https://edu.mazunin.science/seminar-6-route.html#enhancer-test|→ «Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»]]",{"h":"Дальше в курсе «Молекулярная биология»"},"Регуляторные элементы, контакты энхансера с промотором и совместимость энхансеров и промоторов — [[https://edu.mazunin.science/seminar-6-route.html#enhancer-test|«Молекулярная биология», семинар 6 «Метилирование ДНК, регуляторные элементы и память»]]; сигнальные пути — [[https://edu.mazunin.science/seminar-3-route.html#receptor-equilibrium|семинары 3]] и [[https://edu.mazunin.science/seminar-4-route.html#cascade|4]]"],"conditions":"","sources":["src_11"],"base":"БИО-11·17","next_base":"mrna-balance","level":"adv","widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"contact","title":"Контакт энхансера с промотором — не доказательство активации","status":"Схема качественная · по описанию наблюдения","modes_label":"Состояние","modes":["контакт без активации","вспышки без сближения"],"notes":["Близость энхансера и промотора и транскрипция часто наблюдаются вместе, но это корреляция: сближение возможно и без транскрипции.","В эмбриональных стволовых клетках мыши ген <i>Sox2<\/i> транскрибировался короткими вспышками, но во время вспышек его энхансер не был к нему ближе обычного. Причинную связь проверяют, удаляя или изменяя энхансер."]}},"quiz":{"id":"S11-L22","question":"Энхансер и промотор часто оказываются рядом, когда ген транскрибируется. Почему это ещё не доказывает, что близость вызывает транскрипцию?","options":[{"id":"S11-L22-1","text":"Это совместное наблюдение — корреляция; причинную связь проверяют, изменяя энхансер и измеряя транскрипцию","correct":true,"feedback":"У гена Sox2 вспышки транскрипции шли без дополнительного сближения с необходимым энхансером; поэтому механизм проверяют функционально."},{"id":"S11-L22-2","text":"Потому что энхансеры не влияют на транскрипцию","correct":false,"feedback":"Энхансер Sox2 был необходим для транскрипции; не доказана лишь роль самой близости."},{"id":"S11-L22-3","text":"Потому что положение участков ДНК в ядре нельзя наблюдать","correct":false,"feedback":"Близость наблюдают по меченым участкам в живых клетках; вопрос в её причинной роли, а не в возможности измерения."}]},"adv_kind":"Новые данные"},{"id":"mrna-balance","num":23,"section":4,"questions":[4],"title":"Количество мРНК — равновесие синтеза и распада","keywords":["мРНК (матричная РНК)","Время полужизни","Стационарное состояние"],"lead":[],"mechanism":[],"paragraphs":["Количество молекул мРНК в клетке определяется двумя потоками: скоростью её синтеза (транскрипции и процессинга) и скоростью распада. Когда эти скорости равны, количество мРНК постоянно — это [[T56|стационарное состояние]]. Постоянное количество не означает, что молекулы не обновляются: новые синтезируются, старые разрушаются с той же скоростью.","[[T30|Время полужизни]] мРНК — время, за которое распадается половина её молекул. У мРНК клеток млекопитающих оно различается от минут до многих часов; в эмбриональных стволовых клетках мыши медиана составила около 7 ч, и лишь у немногих мРНК (среди них много мРНК факторов транскрипции) время полужизни меньше часа. мРНК, количество продукта которых должно быстро изменяться, обычно живут недолго.","Одно измерение количества мРНК не показывает, изменился синтез или распад: одинаковое количество получается при медленном синтезе и медленном распаде или при быстром синтезе и быстром распаде."],"conditions":"","sources":["src_01","src_10","src_19"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"balance","title":"Синтез и распад мРНК","status":"Схема модели · числа условные","modes_label":"Состояние","modes":["два гена"],"notes":["У генов 1 и 2 одинаковое количество мРНК — 100 молекул, но у гена 2 синтез вдвое быстрее, а каждая молекула существует вдвое меньше. Одно измерение количества мРНК не показывает скорость транскрипции."]}},"quiz":{"id":"S11-L23","question":"У двух генов одинаковое количество мРНК. Что можно сказать о скорости их транскрипции?","options":[{"id":"S11-L23-1","text":"Транскрипция у них одинакова","correct":false,"feedback":"При разной скорости распада одинаковое количество дают разные скорости транскрипции."},{"id":"S11-L23-2","text":"Ничего определённого: одинаковое количество получается и при медленном синтезе с медленным распадом, и при быстром синтезе с быстрым распадом","correct":true,"feedback":"Количество мРНК — итог равновесия двух потоков, и одно измерение не показывает, какой из них изменился."},{"id":"S11-L23-3","text":"мРНК этих генов не обновляется","correct":false,"feedback":"Постоянное количество — равновесие синтеза и распада, а не отсутствие обновления."}]},"exam_quiz":{"id":"S11-E11","question":"Количество мРНК в клетке постоянно. Что это значит?","options":[{"id":"S11-E11-1","text":"МРНК не синтезируется","correct":false,"feedback":"Без синтеза количество мРНК уменьшалось бы по мере распада."},{"id":"S11-E11-2","text":"МРНК не разрушается","correct":false,"feedback":"мРНК разрушаются; количество постоянно потому, что столько же синтезируется."},{"id":"S11-E11-3","text":"Скорости синтеза и распада мРНК равны","correct":true,"feedback":"Постоянное количество — равновесие двух потоков: за одно и то же время синтезируется столько же молекул, сколько разрушается."},{"id":"S11-E11-4","text":"Белка тоже постоянное количество, равное мРНК","correct":false,"feedback":"Количество белка определяется ещё трансляцией и распадом белка, поэтому оно не равно количеству мРНК."}]}},{"id":"mrna-decay","num":24,"section":4,"questions":[4],"title":"Как разрушается мРНК","keywords":["Кэп","мРНК (матричная РНК)"],"lead":[],"mechanism":[],"paragraphs":["Распад большинства мРНК в цитоплазме начинается с постепенного укорочения [[T06|поли(А)-хвоста]] ферментами-деаденилазами (вспомнить: [[seminar-9-route.html#three-prime-end|семинар 9: «3′-конец: расщепление и полиаденилирование»]]). Когда хвост укорачивается до критической длины (у человека около 25 нуклеотидов), мРНК разрушается одним из двух путей: удаляется 5′-кэп (декэпирование), и мРНК расщепляется экзонуклеазой с 5′-конца; или мРНК расщепляется с 3′-конца многобелковым комплексом — [[T61|экзосомой]]. Оба пути могут действовать на одну молекулу.","Скорость распада конкретной мРНК зависит от последовательностей её [[T05|нетранслируемых областей]] и от белков и малых РНК, которые с ними связываются."],"conditions":"","sources":["src_01"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"decay","title":"Распад мРНК","status":"Схема качественная","modes_label":"Состояние","modes":["укорочение поли(А)-хвоста","снятие кэпа и 5′→3′","экзосома 3′→5′"],"notes":["Распад большинства мРНК в цитоплазме начинается с укорочения поли(А)-хвоста деаденилазами.","Когда хвост укорочен до критической длины, снимается 5′-кэп, и мРНК расщепляется экзонуклеазой с 5′-конца.","Другой путь — расщепление мРНК с 3′-конца экзосомой. Оба пути могут действовать на одну молекулу."]}},"quiz":{"id":"S11-L24","question":"Почему укорочение поли(А)-хвоста приближает разрушение мРНК?","options":[{"id":"S11-L24-1","text":"Поли(А)-хвост кодирует часть белка, и без него мРНК больше не нужна","correct":false,"feedback":"Поли(А)-хвост не кодирует аминокислоты; дело не в «ненужности», а в том, что короткий хвост запускает разрушение."},{"id":"S11-L24-2","text":"Деаденилирование само разрезает мРНК посередине","correct":false,"feedback":"Деаденилазы укорачивают хвост; разрушение затем идёт с 5′- или с 3′-конца молекулы."},{"id":"S11-L24-3","text":"Когда хвост укорачивается до критической длины, мРНК разрушается — с 5′-конца после удаления кэпа или с 3′-конца экзосомой","correct":true,"feedback":"Деаденилирование — обычно первый этап распада: оно открывает путь ферментам, разрушающим мРНК с концов."}]}},{"id":"small-rnas","num":25,"section":4,"questions":[4],"title":"микроРНК и малые интерферирующие РНК","keywords":["Кэп","мРНК (матричная РНК)","Argonaute (AGO)","Деаденилирование","Затравочный участок","микроРНК"],"lead":[],"mechanism":[],"paragraphs":["[[T42|микроРНК]] — малые некодирующие РНК длиной около 22 нуклеотидов. Они образуются из более длинных предшественников, транскрибируемых в основном РНК-полимеразой II, и действуют в комплексе с белком семейства [[T26|Argonaute]] (AGO) — этот комплекс называют [[T55|RISC]]. Малая РНК служит направляющей: она спаривается с комплементарным участком мРНК-мишени, а белок AGO обеспечивает действие на мишень.","микроРНК животных спариваются с мишенью, как правило, частично — прежде всего [[T34|затравочным участком]] (нуклеотиды 2–7 от 5′-конца; вместе с 8-м — расширенный затравочный участок), чаще всего в 3′-нетранслируемой области. При частичном спаривании AGO привлекает белки, которые подавляют трансляцию и вызывают [[T32|деаденилирование]], декэпирование и распад мРНК. Неверно, что микроРНК всегда разрезают мРНК: в клетках млекопитающих в стационарном состоянии бо́льшая часть (от 66 % до более чем 90 %) подавления объясняется ускоренным распадом мРНК, а подавление трансляции заметнее вскоре после появления микроРНК. Одна микроРНК действует на сотни мРНК, и по оценкам микроРНК регулируют не менее половины генов человека, кодирующих белки; действие на каждую мишень обычно умеренное.","Регулируют экспрессию и другие некодирующие РНК: например, длинные некодирующие РНК, часть которых служит каркасом для белковых комплексов и участвует в упаковке хроматина, в том числе при инактивации одной из X-хромосом.","При высокой комплементарности, особенно в центральной части дуплекса, белок AGO2 разрезает мишень напротив нуклеотидов 10 и 11 направляющей РНК. Так действуют [[T43|малые интерферирующие РНК]]; на этом основаны лекарства, снижающие синтез определённых белков в клетках печени."],"conditions":"","sources":[" ать мРНК посередине спаренного участка. мРНК в 10 раз меньше, белка тоже"],"w":600,"h":420}},"quiz":{"id":"S11-L25","question":"Почему микроРНК обычно не разрезает мРНК-мишень, а малая интерферирующая РНК — разрезает?","options":[{"id":"S11-L25-1","text":"Для разрезания белку AGO2 нужна высокая комплементарность, особенно в центральной части дуплекса, а микроРНК спаривается с мишенью частично","correct":true,"feedback":"При частичном спаривании AGO привлекает белки, подавляющие трансляцию и вызывающие деаденилирование и распад; при полном — AGO2 разрезает мишень."},{"id":"S11-L25-2","text":"микроРНК связывается с ДНК гена, а малая интерферирующая РНК — с мРНК","correct":false,"feedback":"Обе малые РНК в комплексе с AGO действуют на мРНК; различается степень комплементарности."},{"id":"S11-L25-3","text":"Малая интерферирующая РНК сама является ферментом","correct":false,"feedback":"Разрезает белок AGO2; малая РНК служит направляющей, которая находит мишень."}]},"exam_quiz":{"id":"S11-E10","question":"Чем действие микроРНК обычно отличается от действия малой интерферирующей РНК?","options":[{"id":"S11-E10-1","text":"МикроРНК всегда разрезает мРНК","correct":false,"feedback":"Для разрезания нужна высокая комплементарность в центральной части; микроРНК спаривается частично и обычно мишень не разрезает."},{"id":"S11-E10-2","text":"МикроРНК частично комплементарна мишени и вызывает подавление трансляции и распад мРНК; полностью комплементарная малая интерферирующая РНК позволяет AGO2 разрезать мишень","correct":true,"feedback":"Степень спаривания определяет исход: при частичном AGO привлекает белки, подавляющие трансляцию и вызывающие распад мРНК; при полном AGO2 разрезает мишень."},{"id":"S11-E10-3","text":"МикроРНК связывается с ДНК гена","correct":false,"feedback":"микроРНК в комплексе с AGO действует на мРНК, а не на ДНК гена."},{"id":"S11-E10-4","text":"Они ничем не отличаются","correct":false,"feedback":"Они различаются комплементарностью мишени и, следовательно, исходом её узнавания."}]}},{"id":"translation-control","num":26,"section":4,"questions":[4],"title":"Регуляция трансляции","keywords":["мРНК (матричная РНК)"],"lead":[],"mechanism":[],"paragraphs":["Количество белка зависит не только от количества мРНК, но и от того, как часто инициируется её трансляция (вспомнить: [[seminar-10-route.html#initiation|семинар 10: «Инициация: малая субчастица находит старт-кодон, инициаторная тРНК — в P-сайте»]]). Чаще всего регулируется именно инициация трансляции. Белки и малые РНК, связанные с нетранслируемыми областями мРНК, могут препятствовать присоединению малой субчастицы рибосомы или её продвижению к старт-кодону. Регуляция трансляции позволяет изменить синтез белка быстро, без изменения транскрипции и количества мРНК."],"conditions":"","sources":["src_01","src_20"],"widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"transl","title":"Регуляция инициации трансляции","status":"Схема качественная","modes_label":"Состояние","modes":["трансляция идёт","белок на 5′-НТО","малая РНК на 3′-НТО"],"notes":["Малая субчастица рибосомы присоединяется у 5′-кэпа и движется к старт-кодону.","Белок, связанный с 5′-нетранслируемой областью, мешает присоединению малой субчастицы или её продвижению к старт-кодону: синтез белка снижается, количество мРНК прежнее.","Малая РНК, связанная с 3′-нетранслируемой областью, снижает инициацию трансляции; количество мРНК в этой схеме прежнее. Пример — регуляция синтеза ферритина (научное дополнение, шаг «Железо и ферритин»)."]}},"quiz":{"id":"S11-L26","question":"Синтез белка быстро изменился, а количество его мРНК осталось прежним. Какой уровень регуляции, скорее всего, изменился?","options":[{"id":"S11-L26-1","text":"Транскрипция гена","correct":false,"feedback":"При изменении транскрипции изменилось бы и количество мРНК."},{"id":"S11-L26-2","text":"Инициация трансляции","correct":true,"feedback":"Белки и малые РНК, связанные с нетранслируемыми областями, могут мешать присоединению малой субчастицы рибосомы или её продвижению к старт-кодону; так синтез меняется без изменения мРНК."},{"id":"S11-L26-3","text":"Скорость распада мРНК","correct":false,"feedback":"Ускорение или замедление распада изменило бы количество мРНК."}]}},{"id":"protein-degradation","num":27,"section":4,"questions":[4],"title":"Распад белка: убиквитин и протеасома","keywords":["АТФ (аденозинтрифосфат)","мРНК (матричная РНК)","Протеасома","Убиквитин","Убиквитинлигаза (E3)"],"lead":[],"mechanism":[],"paragraphs":["Количество белка определяется скоростью его синтеза и скоростью распада. Многие регуляторные белки разрушаются быстро; их количество поэтому быстро изменяется. Распад белков регулируется: ферменты E1, E2 и [[T53|убиквитинлигаза]] E3 последовательно присоединяют к белку [[T52|убиквитин]], образуя цепь; определённые цепи узнаёт [[T51|протеасома]], разворачивает белок с затратой АТФ и расщепляет его до коротких пептидов (вспомнить: [[seminar-10-route.html#quality-control|семинар 10: «Контроль качества: шапероны, убиквитин и протеасома»]]). Специфичность обеспечивают убиквитинлигазы: в клетке млекопитающего их сотни, и каждая узнаёт определённые белки.","Ускорение распада уменьшает стационарное количество белка при неизменных мРНК и трансляции."],"conditions":"","sources":["src_01"],"widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Распад белка","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["исходное состояние","убиквитинлигаза активнее"],"scene":"s4b","args":[[{}],[{"e3":1}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_much":"много","s11_v_little":"мало","s11_v_glc_yes":"есть","s11_v_glc_no":"нет","s11_rd1_op":"Оператор","s11_rd1 , M","s11_d4a_P":"белок, P","s11_d4a_A":"активный белок, A","s11_d4a_tx":"транскрипция: {n} в час","s11_d4a_decM":"распад мРНК: M/τM","s11_d4a_tl":"трансляция: {n} в час","s11_d4a_decP":"распад белка: P/τP","s11_d4a_al":"активно {n} %","s11_d4a_time":"время, ч","s11_d4a_axM":"мРНК","s11_d4a_axP":"белок","s11_d4a_now":"{n} ч","s11_rda4_of":"{n} стационарного уровня","s11_d4a_tab1":"Стационарное состояние: клетки А, Б, В","s11_d4a_tab2":"Что различает клетки Б и В (по модели)","s11_d4a_cA":"Клетка А","s11_d4a_cB":"Клетка Б","s11_d4a_cC":"Клетка В","s11_d4a_colM":"мРНК","s11_d4a_colP":"белок","s11_d4a_colSyn":"синтез белка в час","s11_d4a_colChase":"половина белка исчезает за","s11_d4a_col10":"белок через 10 ч","s11_d1a_tab":"Интенсивность транскрипции T, из 100 (глюкоза есть / нет)","s11_d1a_tab_h":"штамм","s11_d1a_tab_L":"лактозы: {l}","s11_d1a_tab_note":"T = 100 × f × a; числа — по правилам модели","s11_d3_prom":"промотор"},"notes":["Синтез и распад мРНК уравновешены: в клетке около 100 молекул мРНК, хотя каждая существует в среднем 5 ч. Белка — 10 000 молекул, все активны","Убиквитинлигаза присоединяет к белку Z цепь убиквитина, протеасома разрушает его быстрее: среднее время существования белка 8 ч вместо 20, белка 4 000 молекул"],"w":600,"h":420}},"quiz":{"id":"S11-L27","question":"Белок стал быстрее распадаться, а его мРНК и трансляция не изменились. Что произойдёт с количеством белка?","options":[{"id":"S11-L27-1","text":"Количество не изменится, потому что синтез прежний","correct":false,"feedback":"Количество зависит и от синтеза, и от распада; ускорение распада уменьшает его даже при прежнем синтезе."},{"id":"S11-L27-2","text":"Уменьшится количество мРНК этого белка","correct":false,"feedback":"Убиквитинлигаза и протеасома действуют на белок, а не на мРНК."},{"id":"S11-L27-3","text":"Стационарное количество уменьшится: оно определяется соотношением синтеза и распада","correct":true,"feedback":"При прежнем синтезе ускоренный распад сдвигает равновесие к меньшему количеству белка."}]},"exam_quiz":{"id":"S11-E12","question":"В клетках 1 и 2 количество мРНК белка уже постоянно и одинаково, синтез белка идёт с постоянной скоростью, исходно белка нет. Белок клетки 1 существует в среднем 20 ч, белок клетки 2 — 5 ч. В какой клетке белок раньше достигнет половины своего стационарного количества?","options":[{"id":"S11-E12-1","text":"В клетке 1: её белок накапливается дольше","correct":false,"feedback":"Дольше живущий белок накапливается до более высокого уровня, но приближается к нему медленнее: половина — за 13,9 ч против 3,5 ч."},{"id":"S11-E12-2","text":"Одновременно: синтез идёт одинаково","correct":false,"feedback":"Начало синтеза одинаково, но скорость выхода на стационарный уровень задаёт время существования белка."},{"id":"S11-E12-3","text":"Зависит от количества мРНК","correct":false,"feedback":"Количество мРНК по условию одинаково и постоянно; различается только время существования белка."},{"id":"S11-E12-4","text":"В клетке 2: чем короче время существования молекулы, тем быстрее устанавливается стационарный уровень","correct":true,"feedback":"При постоянном синтезе из нулевого уровня половина стационарного количества достигается за τP·ln 2 — около 13,9 ч в клетке 1 и около 3,5 ч в клетке 2: чем быстрее распад, тем раньше устанавливается равновесие синтеза и распада."}]}},{"id":"amount-vs-activity","num":28,"section":4,"questions":[4],"title":"Количество белка и его активность","keywords":["Фосфорилирование"],"lead":[],"mechanism":[],"paragraphs":["Количество белка и его функциональная активность — разные величины. Активность изменяют ковалентные модификации (например, фосфорилирование и дефосфорилирование, вспомнить: [[seminar-1-route.html|семинар 1]]), связывание малых молекул и партнёров, правильное сворачивание и локализация. Поэтому одинаковое количество белка может давать разную активность, а одинаковая активность — получаться при разном количестве белка. Регуляция активности изменяет функцию уже имеющихся молек  разные величины"],"w":600,"h":420}},"quiz":{"id":"S11-L28","question":"В двух клетках одинаковое количество белка, а его активность различается. Как это возможно?","options":[{"id":"S11-L28-1","text":"Активность изменяют ковалентные модификации, связывание малых молекул и партнёров, сворачивание и локализация","correct":true,"feedback":"Регуляция активности изменяет функцию уже имеющихся молекул и не требует синтеза новых."},{"id":"S11-L28-2","text":"Это невозможно: активность всегда пропорциональна количеству белка","correct":false,"feedback":"Количество и активность — разные величины: одинаковое количество может давать разную активность."},{"id":"S11-L28-3","text":"В клетках различается количество мРНК этого белка","correct":false,"feedback":"Количество белка одинаково; различие — в состоянии самих молекул белка."}]}},{"id":"a4-balance","num":29,"section":4,"questions":[4],"title":"Баланс синтеза и распада во времени","keywords":["мРНК (матричная РНК)"],"lead":[],"mechanism":[],"paragraphs":["Модель исследования 4 описывает мРНК и белок двумя уравнениями: dM/dt = s − M/τM, dP/dt = r·M − P/τP. В стационарном состоянии M* = s·τM, P* = r·M*·τP. Отсюда три вывода. Первый: одинаковое количество мРНК совместимо с разным количеством белка — оно зависит ещё от трансляции и распада белка. Второй: одинаковое низкое количество белка может быть следствием медленного синтеза или быстрого распада; различают их синтез нового белка за час, убыль белка после остановки трансляции и ход накопления после начала транскрипции гена: чем короче [[T22|время существования молекулы]], тем быстрее устанавливается стационарный уровень. Третий: количество белка не равно активности.","Новые данные. В четырёх линиях клеток человека около 9 % из почти 12 тысяч белков оказались короткоживущими (половина молекул разрушается за 8 ч и быстрее), и у сотни белков устойчивость различалась между линиями клеток. Время существования одного белка — свойство не только самого белка, но и клетки."],"condition ие измерения их различат?","options":[{"id":"S11-L29-1","text":"Стационарное количество белка","correct":false,"feedback":"Оно одинаково, поэтому и не различает причины."},{"id":"S11-L29-2","text":"Синтез нового белка за час, убыль белка после остановки трансляции и ход накопления после начала транскрипции","correct":true,"feedback":"Стационарное количество — итог двух потоков; сами потоки и скорость выхода на стационарный уровень у этих клеток различаются."},{"id":"S11-L29-3","text":"Количество мРНК","correct":false,"feedback":"Оба механизма действуют после мРНК; её количество в обеих клетках может быть одинаковым."}]},"adv_kind":"Новые данные"},{"id":"ferritin-ire","num":30,"section":4,"questions":[4],"title":"Железо и трансляция ферритина","keywords":["Кэп","мРНК (матричная РНК)","Рецептор","Убиквитин","Ферритин","Железочувствительный элемент (IRE)"],"lead":[],"mechanism":[],"paragraphs":["[[T63|Ферритин]] — белок, запасающий железо в клетке. В 5′-нетранслируемой области его мРНК, недалеко от [[T04|кэпа]], находится шпилька — [[T64|железочувствительный элемент]] (IRE). При недостатке железа с IRE связываются [[T65|белки регуляции обмена железа]] — IRP1 и IRP2 — и пространственно препятствуют инициации трансляции: ферритин почти не синтезируется. При достаточном количестве железа в IRP1 собирается [[T66|железосерный кластер]], и белок теряет способность связывать IRE (в этой форме он служит ферментом — [[T67|цитоплазматической аконитазой]]), а IRP2 убиквитинируется и разрушается протеасомой. IRE освобождается, и мРНК ферритина транслируется. Количество мРНК ферритина при этом может оставаться сопоставимым — изменяется интенсивность синтеза белка.","Та же система противоположно регулирует [[T68|рецептор трансферрина]] — белок, через который клетка получает железо. Его мРНК несёт IRE в 3′-нетранслируемой области. При недостатке железа связанные IRP защищают эту мРНК от расщепления [[T69|эндонуклеазой]]: мРНК стабильна, рецептор синтезируется. Когда железа достаточно, IRP отделяются, мРНК расщепляется и разрушается. Один и тот же регуляторный белок, связываясь с одинаковыми по устройству элементами, подавляет трансляцию одной мРНК и стабилизирует другую — в зависимости от того, где расположен элемент.","Мутации в IRE мРНК L-цепи ферритина, нарушающие связывание IRP, вызывают наследственный синдром гиперферритинемии и катаракты: ферритина в сыворотке крови много, хотя избытка железа в организме нет."],"conditions":"","sources":["src_01","src_22"],"base":"БИО-11·24, БИО-11·26","back":"translation-control","level":"adv","badge":"сверх программы · научное дополнение","widget":{"kind":"s11","title":"","zoomNarrow":true,"s":{"title":"Железо и ферритин","status":"Схема модели практикума · числа условные","modes_label":"Состояние","modes":["железа недостаточно","железа достаточно"],"scene":"fe","args":[[{"fe":"low"}],[{"fe":"high"}]],"L":{"pill_yes":"да","pill_no":"нет","ms_head":"Показания","s11_rd_mask":"Показания — на схеме; переключатели скрыты до ответа.","s11_lv_basal":"базальная","s11_lv_mod":"умеренная","s11_lv_high":"высокая","s11_lv_null":"—","s11_v_occ":"занят","s11_v_free":"свободен","s11_v_half":"свободен половину времени","s11_v_nocap":"белка CAP нет","s11_v_much":"много","s11_v_little":"мало","s11_v_glc_yes":"есть","s11_v_glc_no":"нет","s11_rd1_op":"Оператор","s11_rd1_cap":"CAP–цАМФ на ДНК","s11_rd1_camp":"цАМФ в клетке","s11_rd1_tx":"Интенсивность транскрипции оперона","s11_rd1_glc":"Глюкоза в среде","s11_ms_tx":"транскрипция","s11_d1_pA":"А. Клетка кишечной палочки: lac-оперон","s11_d1_pB":"Б. Интенсивность транскрипции оперона","s11_d1_medium":"В среде:","s11_d1_lac":"лактоза","s11_d1_glc":"глюкоза","s11_d1_none":"ни лактозы, ни глюкозы","s11_d1_lacI_note":"lacI: транскрибируется\nпостоянно, слабо","s11_d1_capsite":"участок CAP","s11_d1_mrna":"мРНК: одна молекула, три кодирующие области","s11_d1_camp_hi":"цАМФ много","s11_d1_camp_lo":"цАМФ мало","s11_d1_half":"свободен половину времени","s11_d1_mask":"Показания двух к лка исчезает за","s11_d4a_col10":"белок через 10 ч","s11_d1a_tab":"Интенсивность транскрипции T, из 100 (глюкоза есть / нет)","s11_d1a_tab_h":"штамм","s11_d1a_tab_L":"лактозы: {l}","s11_d1a_tab_note":"T = 100 × f × a; числа — по правилам модели","s11_d3_prom":"промотор"},"notes":["Железа недостаточно. IRP связаны с IRE обеих мРНК. На мРНК ферритина IRP в 5′-НТО препятствует инициации трансляции: ферритин почти не синтезируется. На мРНК рецептора трансферрина IRP в 3′-НТО защищают её от расщепления: мРНК устойчива, рецептор синтезируется, и клетка получает больше железа","Железа достаточно. IRP1 содержит железосерный кластер и не связывает IRE, IRP2 разрушается протеасомой. мРНК ферритина транслируется: количество мРНК то же, а синтез ферритина выше. мРНК рецептора трансферрина расщепляется и разрушается: рецептора синтезируется меньше"],"w":900,"h":220}},"quiz":{"id":"S11-L30","question":"Почему один и тот же белок IRP подавляет трансляцию мРНК ферритина, но защищает мРНК рецептора трансферрина?","options":[{"id":"S11-L30-1","text":"IRP узнаёт в этих мРНК разные последовательности","correct":false,"feedback":"В обеих мРНК IRP связывается с одинаковыми по устройству элементами IRE; различается их положение."},{"id":"S11-L30-2","text":"При недостатке железа ферритин разрушается протеасомой","correct":false,"feedback":"Ферритина при недостатке железа мало потому, что не идёт его трансляция; протеасомой при достатке железа разрушается IRP2."},{"id":"S11-L30-3","text":"Результат зависит от положения IRE: в 5′-НТО связанный IRP мешает инициации трансляции, в 3′-НТО — защищает мРНК от расщепления эндонуклеазой","correct":true,"feedback":"Элементы одинаковы по устройству, а их действие определяет место в мРНК."}]},"adv_kind":"Новые данные"},{"id":"rna-level-variety","num":31,"section":4,"questions":[4],"title":"Другие посттранскрипционные механизмы","keywords":["мРНК (матричная РНК)","Кодирующая область","Убиквитин","Экспрессия гена"],"lead":[],"mechanism":[],"paragraphs":["Экспрессия гена изменяется и на других уровнях после транскрипции: при альтернативном сплайсинге и выборе места полиаденилирования из одного гена образуются разные мРНК (вспомнить: [[seminar-9-route.html#alternative-splicing|семинар 9: «Альтернативный сплайсинг: разные мРНК одного гена»]]); редактирование РНК изменяет отдельные нуклеотиды в РНК без изменения ДНК; мРНК может доставляться в определённый участок цитоплазмы и транслироваться там. Эти механизмы изменяют не только количество мРНК, но и её вариант и место синтеза белка; белковая изоформа меняется, только если затронута [[T20|кодирующая область]].",{"h":"Дальше в курсе «Молекулярная биология»"},"Убиквитин-протеасомная система и контроль качества белков — [[https://edu.mazunin.science/seminar-11-route.html#ubiquitin-cascade|«Молекулярная биология», семинар 11 «Протеостаз, убиквитин-протеасомная система, ERAD и аутофагический поток»]]. Время жизни мРНК и её распад подробно — отдельный семинар (в разработке)"],"conditions":"","sources":["src_01","src_15"],"base":"БИО-11·23, БИО-11·24, БИО-11·25, БИО-11·26","back":"amount-vs-activity","level":"adv","widget":{"kind":"chain","title":"","s":{"title":"Другие посттранскрипционные механизмы","status":"Схема качественная","parallel":true,"root":"один ген","items":["альтернативный сплайсинг и выбор места полиаденилирования — разные мРНК","редактирование РНК — изменены отдельные нуклеотиды РНК, ДНК прежняя","доставка мРНК в участок цитоплазмы — белок синтезируется там"],"note":"Эти механизмы изменяют не только количество мРНК, но и её вариант и место синтеза белка."}},"quiz":{"id":"S11-L31","question":"Чем альтернативный сплайсинг и выбор места полиаденилирования отличаются от механизмов, изменяющих только количество мРНК?","options":[{"id":"S11-L31-1","text":"Они изменяют состав мРНК: из одного гена образуются разные варианты РНК","correct":true,"feedback":"Если изменение затрагивает кодирующую область, меняется белковая изоформа; если только нетранслируемые области — последовательность белка прежняя, но могут измениться стабильность, трансляция или локализация мРНК."},{"id":"S11-L31-2","text":"Они всегда изменяют аминокислотную последовательность белка","correct":false,"feedback":"Не всегда: при выборе другого места полиаденилирования или другого экзона в 3′-НТО последовательность белка остаётся прежней, меняются свойства мРНК."},{"id":"S11-L31-3","text":"Они изменяют последовательность ДНК гена","correct":false,"feedback":"ДНК не изменяется; различаются участки, вошедшие в зрелую мРНК, и положение её 3′-конца."}]},"adv_kind":"Новые данные"},{"id":"integration","num":32,"section":5,"questions":[1,2,3,4],"title":"Сквозная задача: от хроматина до активного белка","keywords":["мРНК (матричная РНК)","Экспрессия гена"],"lead":[],"mechanism":[],"paragraphs":["Шесть наблюдений — доступность, занятость гена РНК-полимеразой II, вновь синтезированная РНК (поток синтеза), зрелая мРНК, белок и его активность — сравнивают с тем, что изменилось бы при каждом возможном механизме. Механизм подходит как единственная причина, если сам по себе объясняет и изменённые, и неизменённые наблюдения. Часто таких механизмов несколько: снижение доступности может быть и причиной, и следствием прекращения транскрипции; меньше зрелой мРНК при прежнем синтезе — и нарушение процессинга, и экспорт, и распад в цитоплазме; меньше белка при прежней мРНК — и трансляция, и распад белка; меньше активности при прежнем белке — и мутация, и модификации. Различают такие причины дополнительные измерения скоростей, мест накопления и последовательностей. Экспрессия гена — многоуровневая динамическая система, и её конечный результат не позволяет автоматически восстановить состояние всех предшествующих этапов."],"conditions":"Обзорный шаг: источники — в шагах темы.","sources":[],"base":"БИО-11·2, БИО-11·23, вспомнить [[seminar-7-route.html|семинары 7]]–[[seminar-10-route.html|10]]","widget":{"kind":"s11q","title":"","zoomNarrow":true,"s":{"scene":"profile","title":"Профиль шести наблюдений и механизмы","status":"Схема качественная","modes_label":"Состояние","modes":["механизмы","меньше белка при прежней мРНК","меньше зрелой мРНК при прежнем синтезе"],"notes":["Для каждого механизма — какие из шести наблюдений он изменяет (↓) и какие оставляет прежними (=). Механизм подходит как единственная причина, если объясняет и изменённые, и неизменённые наблюдения.","Профилю «прежние доступность, РНК-полимераза II, новая РНК и зрелая мРНК, меньше белка и активности» подходят и снижение трансляции, и ускорение распада белка.","Профилю «прежний синтез, меньше зрелой мРНК» подходят и нарушение процессинга или экспорта, и ускоренный распад мРНК в цитоплазме. Различают такие причины дополнительные измерения."]}},"quiz":{"id":"S11-L32","question":"Когда механизм считают способным самостоятельно объяснить профиль из шести наблюдений — от доступности до активности белка?","options":[{"id":"S11-L32-1","text":"Когда он объясняет хотя бы одно изменённое наблюдение","correct":false,"feedback":"Нужно учитывать и неизменённые наблюдения: механизм, который им противоречит, сам по себе профиль не объясняет."},{"id":"S11-L32-2","text":"Когда он сам по себе объясняет и изменённые, и неизменённые наблюдения","correct":true,"feedback":"Механизм не подходит как единственная причина, если при нём изменилось бы наблюдение, которое на деле не изменилось. Часто таких механизмов несколько — их различают дополнительные измерения."},{"id":"S11-L32-3","text":"Когда он изменяет конечный результат — количество и активность белка","correct":false,"feedback":"Конечный результат меняют многие механизмы; какие из них подходят, определяют промежуточные наблюдения."}]}},{"id":"links","num":33,"section":5,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":["Кэп","мРНК (матричная РНК)","Рецептор","Сигнал","Метилирование ДНК","Промотор"],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},"[[seminar-1-route.html|Семинар 1]] — рецептор и сигнал: сигнал изменяет активность факторов транскрипции (БИО-11·20).","[[seminar-7-route.html|Семинар 7]] — упаковка ДНК и репликация: число копий гена и восстановление хроматина после репликации.","[[seminar-8-route.html|Семинар 8]] — изменения последовательности: мутация может изменить активность белка при неизменном количестве (итоговая задача, случай 4).","[[seminar-9-route.html|Семинар 9]] — транскрипция и процессинг: промотор, общие факторы, кэп, сплайсинг, поли(А) — точки регуляции после синтеза РНК.","[[seminar-10-route.html|Семинар 10]] — трансляция, сворачивание, убиквитин и протеасома — регуляция количества и активности белка.",{"h":"Что дальше в курсе"},"[[seminar-12-route.html|Семинар 12]] «Как появилась клетка» объединяет наследственную информацию, компартменты, мембраны и энергетику в эволюционной перспективе. Регуляция в этом семинаре держалась на двух способах узнавания — белок узнаёт участок ДНК, малая РНК узнаёт мРНК по комплементарности; второй способ мог существовать ещё до появления белков.",{"h":"Дальше в курсе «Молекулярная биология»"},"Сигналы и их динамика — [[https://edu.mazunin.science/seminar-3-route.html#receptor-equilibrium|«Молекулярная биология», семинар 3]], [[https://edu.mazunin.science/seminar-4-route.html#feedback-vs-termination|семинар 4]]","Нуклеосомы, ремоделирование и гистоны — [[https://edu.mazunin.science/seminar-5-route.html#core|«Молекулярная биология», семинар 5]]","Метилирование ДНК, регуляторные элементы и память — [[https://edu.mazunin.science/seminar-6-route.html#memory|«Молекулярная биология», семинар 6]]","Протеостаз и убиквитин-протеасомная система — [[https://edu.mazunin.science/seminar-11-route.html#ubiquitin-cascade|«Молекулярная биология», семинар 11]]","Время жизни мРНК и её распад (в разработке)"],"conditions":"","sources":[],"quiz":{"id":"S11-L33","question":"На каких двух способах узнавания держится регуляция, рассмотренная в семинаре?","options":[{"id":"S11-L33-1","text":"Рибосома узнаёт промотор; белок узнаёт кодон","correct":false,"feedback":"Промотор узнают общие факторы транскрипции, а кодон — антикодон тРНК; ни то, ни другое не основа регуляции в этом семинаре."},{"id":"S11-L33-2","text":"ДНК узнаёт белок по его аминокислотной последовательности","correct":false,"feedback":"Узнавание идёт в обратную сторону: регуляторный белок узнаёт последовательность ДНК."},{"id":"S11-L33-3","text":"Белок узнаёт участок ДНК; малая РНК узнаёт мРНК по комплементарности","correct":true,"feedback":"Факторы транскрипции, репрессоры и активаторы узнают последовательности ДНК, а микроРНК и малые интерферирующие РНК в комплексе с AGO находят мРНК по спариванию оснований."}]},"service":true}],"sections":[{"title":"Введение","entry":"one-genome","sub":"Один геном — разные клетки; уровни регуляции экспрессии","label":"Введение","integr":true},{"title":"Оперон: отрицательная и положительная регуляция","entry":"operon","sub":"Предскажите, занят ли оператор и с какой интенсивностью транскрибируется lac-оперон при разных сочетаниях сахаров в среде, а также после удаления репрессора или белка-активатора катаболитных генов (CAP). Затем проверьте предсказание на схеме.","label":"Тема 1","integr":false},{"title":"Хроматин и доступность","entry":"nucleosome-access","sub":"Соберите на промоторе условного гена X аппарат, необходимый для транскрипции, и определите, какой вклад вносит каждая деталь: что сделает промотор доступным, что увеличит интенсивность транскрипции, что её прекратит.","label":"Тема 2","integr":false},{"title":"Промотор, энхансер и факторы транскрипции","entry":"promoter","sub":"Определите, при каких условиях сигнал, поступивший в клетку, усилит транскрипцию гена Y, и какое наблюдение доказывает, что этот энхансер регулирует именно этот ген.","label":"Тема 3","integr":false},{"title":"После транскрипции: мРНК, трансляция, белок","entry":"mrna-balance","sub":"Определите, как изменятся количество мРНК, синтез белка, количество белка и количество активного белка, если на мРНК действует микроРНК или малая интерферирующая РНК, если белок узнаёт убиквитинлигаза или если не происходит активирующее фосфорилирование.","label":"Тема 4","integr":false},{"title":"Итог семинара","entry":"integration","sub":"Сквозная задача и связи с другими семинарами","label":"Итог","integr":true}],"glossary":[{"id":"S11-T01","term":"АТФ (аденозинтрифосфат)","section":2,"def":"Нуклеотид, энергия гидролиза которого используется во многих процессах клетки, в том числе комплексами ремоделирования хроматина."},{"id":"S11-T02","term":"Ацетилирование гистонов","section":2,"def":"Присоединение ацетильной группы к остаткам лизина гистонов; нейтрализует их положительный заряд и создаёт участки, которые узнают другие белки."},{"id":"S11-T03","term":"Гистоновый хвост","section":0,"def":"Неупорядоченный N-концевой участок гистона, выступающий из нуклеосомы; основное место модификаций гистонов."},{"id":"S11-T04","term":"Кэп","section":4,"def":"7-метилгуанозин на 5′-конце мРНК; защищает 5′-конец от экзонуклеаз и участвует в инициации трансляции. Подробнее — семинар 9."},{"id":"S11-T05","term":"Нетранслируемая область (НТО)","section":4,"def":"Участок зрелой мРНК до старт-кодона (5′-НТО) или после стоп-кодона (3′-НТО); не кодирует аминокислоты и содержит последовательности, от которых зависят трансляция и стабильность мРНК. Подробнее — семинар 9."},{"id":"S11-T06","term":"Поли(А)-хвост","section":0,"def":"Цепочка адениловых остатков на 3′-конце мРНК; защищает 3′-конец, а её укорочение (деаденилирование) — обычно первый этап распада мРНК. Подробнее — семинар 9."},{"id":"S11-T07","term":"мРНК (матричная РНК)","section":0,"def":"РНК, по последовательности кодонов которой рибосома синтезирует белок. Подробнее — семинары 9 и 10."},{"id":"S11-T08","term":"РНК-полимераза II","section":1,"def":"Фермент ядра эукариот, транскрибирующий гены, кодирующие белки; на промотор её привлекают общие факторы транскрипции. Подробнее — семинар 9."},{"id":"S11-T09","term":"Линкерная ДНК","section":0,"def":"Участок ДНК между соседними нуклеосомами."},{"id":"S11-T10","term":"Мембрана (липидный бислой)","section":0,"def":"Двойной слой липидов, отделяющий клетку от среды; мембранные белки, например пермеаза и рецепторы, встроены в бислой.","practice_only":true},{"id":"S11-T11","term":"Рецептор","section":0,"def":"Белок, который связывает сигнальную молекулу и в ответ изменяет работу клетки."},{"id":"S11-T12","term":"Сигнал","section":0,"def":"Молекула, например гормон, которая, связавшись с рецептором, изменяет работу клетки."},{"id":"S11-T13","term":"Рибосома","section":0,"def":"Комплекс рРНК и белков, синтезирующий белок по мРНК; состоит из малой и большой субчастиц. Подробнее — семинар 10."},{"id":"S11-T14","term":"Вспышки транскрипции","section":0,"def":"Периоды частой инициации транскрипции гена, разделённые паузами."},{"id":"S11-T15","term":"Ген-регулятор lacI","section":0,"def":"Ген репрессора lac-оперона; транскрибируется с собственного промотора отдельно от оперона."},{"id":"S11-T16","term":"Киназа (протеинкиназа)","section":0,"def":"Фермент, переносящий фосфатную группу с АТФ на белок.","practice_only":true},{"id":"S11-T17","term":"Общие факторы транскрипции","section":3,"def":"Белки (TFIID, TFIIB, TFIIE, TFIIF, TFIIH и др.), которые вместе с РНК-полимеразой II собираются на промоторах почти всех генов, транскрибируемых этим ферментом. Подробнее — семинар 9."},{"id":"S11-T18","term":"TATA-бокс","section":0,"def":"Богатая A и T последовательность примерно за 30 нуклеотидов до точки начала транскрипции, которую узнаёт фактор TFIID; есть лишь у части промоторов РНК-полимеразы II. Подробнее — семинар 9.","practice_only":true},{"id":"S11-T19","term":"Точка начала транскрипции","section":0,"def":"Нуклеотид ДНК, против которого стоит первый нуклеотид РНК (+1). Подробнее — семинар 9.","practice_only":true},{"id":"S11-T20","term":"Кодирующая область","section":4,"def":"Участок мРНК от старт-кодона до стоп-кодона, последовательность кодонов которого задаёт последовательность аминокислот белка. Подробнее — семинар 9."},{"id":"S11-T21","term":"Полицистронная мРНК","section":1,"def":"мРНК, содержащая несколько кодирующих областей, каждая со своим участком связывания рибосомы."},{"id":"S11-T22","term":"Среднее время существования молекулы","section":0,"def":"Среднее время от синтеза молекулы до её распада; время полужизни приблизительно равно 0,7 среднего времени существования."},{"id":"S11-T23","term":"Трансацетилаза","section":1,"def":"Фермент, продукт гена <i>lacA<\/i> lac-оперона; в расщеплении лактозы не участвует."},{"id":"S11-T24","term":"Аллолактоза","section":1,"def":"Изомер лактозы, образующийся в клетке кишечной палочки; связывается с репрессором lac-оперона и снижает его сродство к оператору; физиологический индуктор lac-оперона."},{"id":"S11-T25","term":"Белок-активатор транскрипции (активатор)","section":1,"def":"Фактор транскрипции, увеличивающий интенсивность транскрипции гена. Подробнее — семинар 9."},{"id":"S11-T26","term":"Argonaute (AGO)","section":4,"def":"Белок, который удерживает малую направляющую РНК и действует на комплементарную ей мРНК; основа комплекса RISC."},{"id":"S11-T27","term":"Ацетилтрансфераза гистонов","section":2,"def":"Фермент, переносящий ацетильную группу с ацетил-CoA на остатки лизина гистонов."},{"id":"S11-T28","term":"Базальная транскрипция","section":1,"def":"Низкая интенсивность транскрипции гена в отсутствие активирующих воздействий."},{"id":"S11-T29","term":"β-галактозидаза","section":1,"def":"Фермент, расщепляющий лактозу на глюкозу и галактозу; продукт гена <i>lacZ<\/i>."},{"id":"S11-T30","term":"Время полужизни","section":4,"def":"Время, за которое распадается половина молекул данного вида."},{"id":"S11-T31","term":"Деацетилаза гистонов","section":2,"def":"Фермент, удаляющий ацетильные группы с остатков лизина гистонов."},{"id":"S11-T32","term":"Деаденилирование","section":4,"def":"Укорочение поли(А)-хвоста мРНК; обычно первый этап её распада."},{"id":"S11-T33","term":"Доступность хроматина","section":0,"def":"Возможность белков связаться с ДНК данного участка хроматина."},{"id":"S11-T34","term":"Затравочный участок","section":4,"def":"Нуклеотиды 2–7 от 5′-конца микроРНК, спаривание которых с мишенью наиболее важно для её узнавания (вместе с нуклеотидом 8 — расширенный затравочный участок)."},{"id":"S11-T35","term":"Индуктор","section":1,"def":"Малая молекула, снимающая репрессию транскрипции."},{"id":"S11-T36","term":"CAP (белок-активатор катаболитных генов)","section":1,"def":"Белок кишечной палочки, который в комплексе с цАМФ связывается с ДНК рядом с промоторами ряда оперонов и облегчает связывание РНК-полимеразы."},{"id":"S11-T37","term":"CpG-островок","section":2,"def":"Участок ДНК длиной около тысячи пар нуклеотидов с повышенным содержанием динуклеотидов CpG; часто включает промотор."},{"id":"S11-T38","term":"Комплекс ремоделирования хроматина","section":1,"def":"Белковый комплекс, который за счёт энергии гидролиза АТФ сдвигает нуклеосомы, удаляет их или изменяет их состав."},{"id":"S11-T39","term":"Коактиватор","section":3,"def":"Белок, не связывающийся с ДНК, который привлекается активатором и усиливает транскрипцию."},{"id":"S11-T40","term":"Медиатор (белковый комплекс)","section":3,"def":"Белковый комплекс, посредник между факторами транскрипции и РНК-полимеразой II. Подробнее — семинар 9."},{"id":"S11-T41","term":"Метилирование ДНК","section":2,"def":"Присоединение метильной группы к цитозину (у позвоночных — в основном в динуклеотидах CpG) без изменения последовательности нуклеотидов."},{"id":"S11-T42","term":"микроРНК","section":4,"def":"Малая некодирующая РНК длиной около 22 нуклеотидов, которая в комплексе с AGO подавляет трансляцию мРНК-мишени и ускоряет её распад."},{"id":"S11-T43","term":"Малая интерферирующая РНК","section":0,"def":"Малая двуцепочечная РНК, одна цепь которой в комплексе с AGO2 направляет разрезание полностью комплементарной мРНК."},{"id":"S11-T44","term":"Нуклеосома","section":2,"def":"Основная единица хроматина: около 147 пар нуклеотидов ДНК, обвитых вокруг октамера гистонов (по две молекулы H2A, H2B, H3 и H4)."},{"id":"S11-T45","term":"Оператор","section":1,"def":"Участок ДНК оперона, с которым связывается репрессор."},{"id":"S11-T46","term":"Оперон","section":1,"def":"Группа генов бактерии, транскрибируемых с одного промотора в составе одной мРНК."},{"id":"S11-T47","term":"Пермеаза лактозы","section":1,"def":"Мембранный белок, переносящий лактозу в клетку кишечной палочки; продукт гена <i>lacY<\/i>."},{"id":"S11-T48","term":"Пионерный фактор транскрипции","section":0,"def":"Фактор транскрипции, способный связываться с ДНК на нуклеосоме и способствовать открытию участка."},{"id":"S11-T49","term":"Преинициаторный комплекс","section":3,"def":"Общие факторы транскрипции и РНК-полимераза II, собранные на промоторе. Подробнее — семинар 9."},{"id":"S11-T50","term":"Промотор","section":0,"def":"Участок ДНК у начала гена, на котором собираются общие факторы транскрипции и РНК-полимераза; задаёт точку начала и направление транскрипции. Подробнее — семинар 9."},{"id":"S11-T51","term":"Протеасома","section":4,"def":"Крупный белковый комплекс, который разворачивает белки, помеченные цепью убиквитина, и расщепляет их на короткие пептиды. Подробнее — семинар 10."},{"id":"S11-T52","term":"Убиквитин","section":4,"def":"Небольшой белок, который ферменты E1, E2 и E3 присоединяют к белку-мишени; цепь из нескольких молекул убиквитина — сигнал разрушения белка протеасомой. Подробнее — семинар 10."},{"id":"S11-T53","term":"Убиквитинлигаза (E3)","section":4,"def":"Фермент, который узнаёт определённые белки и присоединяет к ним убиквитин; от неё зависит, какой белок будет помечен. Подробнее — семинар 10."},{"id":"S11-T54","term":"Репрессор","section":1,"def":"Белок, связывающийся с ДНК и уменьшающий интенсивность транскрипции гена."},{"id":"S11-T55","term":"RISC","section":4,"def":"Комплекс белка Argonaute с малой направляющей РНК."},{"id":"S11-T56","term":"Стационарное состояние","section":4,"def":"Состояние, при котором скорости синтеза и распада молекулы равны и её количество постоянно."},{"id":"S11-T57","term":"Фактор транскрипции","section":2,"def":"Белок, связывающийся с определённой последовательностью ДНК и изменяющий интенсивность транскрипции."},{"id":"S11-T58","term":"Фосфорилирование","section":2,"def":"Присоединение фосфатной группы к белку (обычно к остатку серина, треонина или тирозина); изменяет активность, структуру или локализацию белка."},{"id":"S11-T59","term":"цАМФ (циклический аденозинмонофосфат)","section":1,"def":"Малая молекула, передающая внутриклеточный сигнал; у кишечной палочки при недостатке глюкозы её много, и она связывается с белком CAP."},{"id":"S11-T60","term":"Энхансер","section":3,"def":"Регуляторный участок ДНК, связывающий активаторы и увеличивающий транскрипцию гена; может находиться на большом расстоянии от промотора. Подробнее — семинар 9."},{"id":"S11-T61","term":"Экзосома","section":4,"def":"Многобелковый комплекс, расщепляющий РНК с 3′-конца."},{"id":"S11-T62","term":"Экспрессия гена","section":0,"def":"Использование информации гена для синтеза функционального продукта — РНК или белка."},{"id":"S11-T63","term":"Ферритин","section":4,"def":"Белок, запасающий железо в клетке."},{"id":"S11-T64","term":"Железочувствительный элемент (IRE)","section":4,"def":"Шпилька в нетранслируемой области мРНК, с которой при недостатке железа связываются белки IRP."},{"id":"S11-T65","term":"Белки регуляции обмена железа (IRP1, IRP2)","section":4,"def":"РНК-связывающие белки, которые при недостатке железа связываются с IRE: в 5′-нетранслируемой области подавляют инициацию трансляции, в 3′-нетранслируемой области защищают мРНК от расщепления."},{"id":"S11-T66","term":"Железосерный кластер","section":4,"def":"Группа атомов железа и серы в составе белка."},{"id":"S11-T67","term":"Цитоплазматическая аконитаза","section":4,"def":"Фермент цитоплазмы; форма белка IRP1 с железосерным кластером, не связывающая IRE."},{"id":"S11-T68","term":"Рецептор трансферрина","section":4,"def":"Мембранный белок, через который клетка поглощает железо в комплексе с трансферрином — белком плазмы крови, переносящим железо."},{"id":"S11-T69","term":"Эндонуклеаза","section":4,"def":"Фермент, расщепляющий нуклеиновую кислоту внутри цепи."},{"id":"S11-T70","term":"Положительная обратная связь","section":1,"def":"Регуляция, при которой продукт процесса усиливает сам этот процесс."},{"id":"S11-T71","term":"Исключение индуктора","section":1,"def":"Уменьшение поступления индуктора в клетку кишечной палочки в присутствии глюкозы."},{"id":"S11-T72","term":"РНК-полимераза (бактерии)","section":1,"def":"Фермент, синтезирующий РНК по матрице ДНК; у кишечной палочки одна РНК-полимераза транскрибирует все гены, а начало транскрипции определяют участки промотора."}],"sources":{"src_01":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022.","doi":"","pmid":""},"src_02":{"url":"https://doi.org/10.1128/mBio.02232-19","cite":"Phillips K. N., Widmann S., Lai H.-Y., Nguyen J., Ray J. C. J., Balázsi G., Cooper T. F. Diversity in lac operon regulation among diverse Escherichia coli isolates depends on the broader genetic background but is not explained by genetic relatedness. mBio. 2019;10(6):e02232-19.","doi":"10.1128/mBio.02232-19","pmid":""},"src_03":{"url":"https://doi.org/10.1016/j.synbio.2026.08.005","cite":"Lu M., Ding H., Zhang H., Xu J., Meng R., Li Y., Zhang Z., Zheng P., Zhu Y., Sun J. Strategies and applications for alleviating carbon catabolite repression. Synth. Syst. Biotechnol. 2027;18:25–39 (онлайн — 2026).","doi":"10.1016/j.synbio.2026.08.005","pmid":""},"src_04":{"url":"https://doi.org/10.1038/s41467-020-20543-z","cite":"Martin B. J. E., Brind'Amour J., Kuzmin A., Jensen K. N., Liu Z. C., Lorincz M., Howe L. J. Transcription shapes genome-wide histone acetylation patterns. Nat. Commun. 2021;12:210.","doi":"10.1038/s const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');

const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {

    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};

function levelBars(rows, w = 640) {

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

function navigate(id) {

function bindQuiz(l, scope = 'quiz') {

function initWidget(l) {

/* =====================================================================
   s0_gn.js — общие детали схем семинара 9 «Транскрипция и процессинг пре-мРНК». Общие для практикума и «Объяснений».
   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;
   оранжевая — РНК; фиолетовый овал — РНК-полимераза II; на генах и мРНК: тёмная заливка — кодирующий участок,
   светлая — нетранслируемая область (НТО), тонкая линия — интрон; красный кружок m⁷G — кэп; «AAAA» — поли(А)-хвост.
   Ядерная оболочка — две мембраны (каждая — липидный бислой) с ядерной порой. Это схемы, не химические формулы.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t()). Группы data-g — справка (gn_<g>, g_<g>).
   GN.seq — преобразования последовательностей (чистые функции, проверяются тестом tests9/models.mjs).
   ===================================================================== */
const GN = (function () {
  const C = { tpl: '#1F3B73', cod: '#8AA0BF', rna: '#E8912A', rnaL: '#F6D7AE', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',
    bad: '#C0392B', warn: '#C77700', ok: '#2E9B57', pol: '#7C4DBE', tfd: '#2C7FB8', tfb: '#4E9AC7', tfh: '#1F8A8A', tfo: '#6C8FB0',
    med: '#8A5A12', act: '#B85C00', cap: '#B03A2E', cpa: '#3D5A99', spl: '#2E9B57', exp: '#1F8A8A', xrn: '#6A3FA0',
    cds: '#4F86C6', utr: '#BBD0EA', mem: '#9C8F6E', memH: '#C9B98F', panel: '#F4F7FA', line: '#D3DAE3', nuc: '#FBF8F1', cyt: '#F3F7FB' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* подпись: anchor m — по центру, l — слева, r — справа; o.w — жирность, o.size, o.col; o.bg — белая подложка.
     Цвет повторён в style: правило оболочки «Объяснений» .widget svg text{fill:var(--ink)} перекрывало атрибут fill,
     и цветные подписи (красные замены, зелёный старт-кодон) в «Объяснениях» становились чёрными (семинар 10, v1.0). */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a};fill:${o.col || C.ink}"${o.it ? ' font-style="italic"' : ''}${o.mono ? ' font-family="ui-monospace,Menlo,Consolas,monospace"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function textN(x, y, s, o = {}) { return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join(''); }
  function panel(x, y, w, h, title, fill) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${fill || C.panel}" stroke="${C.line}"/>` + (title ? text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted }) : '');
  }
  function arrow(x1, y1, x2, y2, col = C.muted, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
    const p1 = [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], p2 = [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)];
    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* белок: скруглённый прямоугольник с короткой подписью; o.op — непрозрачность (полупрозрачный — этап не начат или деталь вынута) */
  function blob(x, y, w, h, col, g, label, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2)}" fill="${col}" opacity="${o.op != null ? o.op : .93}" stroke="#fff" stroke-width="1.5"${o.dash ? ' stroke-dasharray="4 3"' : ''}/>` +
      (label ? (() => { const op = o.dash ? 1 : Math.min(1, (o.op != null ? o.op : .93) / .93), tx = text(x, y + 1, label, { size: o.size || 12, w: 700, col: '#fff' });
        return op < .9 ? `<g opacity="${f(op)}">${tx}</g>` : tx; })() : ''));   /* v1.2 (рецензия интерактива И-13): без «призраков» подписей у ещё не появившихся факторов */
  }
  /* красный крест: этап, на котором процесс остановился */
  function cross(x, y, r = 9) { return `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`; }

  /* ---------- последовательности ---------- */
  const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G', U: 'A' };
  const seq = {
    comp: s => s.split('').map(c => PAIR[c]).join(''),          /* комплементарная цепь, записанная под исходной (в обратной ориентации) */
    rev: s => s.split('').reverse().join(''),
    revcomp: s => seq.rev(seq.comp(s)),                          /* комплементарная цепь, записанная 5′→3′ */
    toRNA: s => s.replace(/T/g, 'U'),
    /* единица транскрипции на участке: top — верхняя цепь 5′→3′ слева направо; u = { a, b, dir: '+' (вправо) | '-' (влево) } */
    unit(top, u) {
      const part = top.slice(u.a, u.b + 1);
      const tplStrand = u.dir === '+' ? 'bot' : 'top', codStrand = u.dir === '+' ? 'top' : 'bot';
      const rna = seq.toRNA(u.dir === '+' ? part : seq.revcomp(part));             /* РНК 5′→3′ */
      const tpl35 = u.dir === '+' ? seq.comp(part) : seq.rev(part);                 /* матрица, записанная 3′→5′ (по ходу синтеза) */
      return { tplStrand, codStrand, rna, tpl35, len: part.length };
    },
  };

  /* ---------- двойная цепь ДНК с буквами ----------
     d: { x, y, dx, top, bot (bot — комплементарна top), tplStrand: 'top' | 'bot' | null, from, to — выделенный участок,
          lbl: true — концевые 5′/3′, size — размер букв, bubble: [a, b] — расплетённый участок (цепи расходятся) } */
  function duplex(d) {
    const n = d.top.length, dx = d.dx || 30, x0 = d.x, y = d.y, gap = d.gap || 26, X = i => x0 + i * dx;
    const sz = d.size || 14, bw = Math.min(22, dx - 4), bh = sz + 6;
    const colT = d.tplStrand === 'top' ? C.tpl : C.cod, colB = d.tplStrand === 'bot' ? C.tpl : C.cod;
    const gT = d.tplStrand === 'top' ? 'template' : d.tplStrand ? 'coding' : 'dna', gB = d.tplStrand === 'bot' ? 'template' : d.tplStrand ? 'coding' : 'dna';
    const bub = d.bubble, open = i => bub && i >= bub[0] && i <= bub[1];
    const yT = i => y - gap - (open(i) ? (d.open || 10) : 0), yB = i => y + gap + (open(i) ? (d.open || 10) : 0);
    let s = '';
    /* остовы: ломаная, чтобы показать расплетённый участок */
    const pathOf = yy => { let p = `M${f(X(0) - dx * .45)},${f(yy(0))}`; for (let i = 0; i < n; i++) p += ` L${f(X(i))},${f(yy(i))}`; return p + ` L${f(X(n - 1) + dx * .45)},${f(yy(n - 1))}`; };
    s += G(gT, `<path d="${pathOf(yT)}" fill="none" stroke="${colT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    s += G(gB, `<path d="${pathOf(yB)}" fill="none" stroke="${colB}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    for (let i = 0; i < n; i++) {
      const x = X(i), hl = d.from != null && i >= d.from && i <= d.to;
      if (!open(i)) s += line(x, yT(i) + bh / 2 + 3, x, yB(i) - bh / 2 - 3, C.rung, 1.4, 'stroke-dasharray="2.5 2.5"');
      s += baseL(x, yT(i) + (bh / 2 + 3), d.top[i], hl ? 'hl' : null, bw, bh, sz) + baseL(x, yB(i) - (bh / 2 + 3), d.bot[i], hl ? 'hl' : null, bw, bh, sz);
    }
    if (d.lbl !== false) {
      const ls = { size: 12.5, w: 700 };
      s += text(X(0) - dx * .45 - 6, yT(0), '5′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yT(n - 1), '3′', Object.assign({ a: 'l' }, ls));
      s += text(X(0) - dx * .45 - 6, yB(0), '3′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yB(n - 1), '5′', Object.assign({ a: 'l' }, ls));
    }
    return s;
  }
  function baseL(x, y, Lt, kind, w = 22, h = 20, sz = 14) {
    const fill = kind === 'hl' ? '#EEF3FA' : kind === 'rna' ? '#FFF4E6' : '#fff', st = kind === 'rna' ? C.rna : '#AEB9C7';
    return `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="4" fill="${fill}" stroke="${st}" stroke-width="1.2"/>` +
      text(x, y + .5, Lt, { size: sz, w: 700, col: kind === 'rna' ? '#8A4B00' : C.ink });
  }
  /* РНК под или над участком ДНК: буквы rna (5′→3′) по позициям ДНК; dir '+' — 5′-конец слева; k — сколько нуклеотидов уже синтезировано */
  function rnaRow(d) {
    const dx = d.dx || 30, X = i => d.x + i * dx, n = d.rna.length, k = d.k == null ? n : d.k, y = d.y, sz = d.size || 14;
    if (k <= 0) return '';
    const pos = j => d.dir === '+' ? d.a + j : d.b - j;          /* j-й нуклеотид РНК (от 5′) стоит напротив позиции ДНК pos(j) */
    const xs = [...Array(k).keys()].map(j => X(pos(j)));
    const xa = Math.min(...xs) - dx * .45, xb = Math.max(...xs) + dx * .45;
    let s = G('rna', line(xa, y + (d.up ? 13 : -13), xb, y + (d.up ? 13 : -13), C.rna, 5));
    for (let j = 0; j < k; j++) s += baseL(xs[j], y, d.rna[j], 'rna', Math.min(22, dx - 4), sz + 6, sz);
    const e5 = d.dir === '+' ? xa - 6 : xb + 6, e3 = d.dir === '+' ? xb + 6 : xa - 6;
    s += text(e5, y, '5′', { a: d.dir === '+' ? 'r' : 'l', size: 12.5, w: 700, col: '#8A4B00' });
    if (k >= n || d.end3) s += text(e3, y, '3′', { a: d.dir === '+' ? 'l' : 'r', size: 12.5, w: 700, col: '#8A4B00' });
    return s;
  }
  /* РНК-полимераза II (фиолетовый овал) с подписью */
  function pol2(x, y, t, o = {}) { return blob(x, y, o.w || 62, o.h || 34, C.pol, 'pol2', o.label === false ? '' : (o.label || 'Pol II'), Object.assign({ size: 12 }, o)); }
  /* промотор: прямоугольник на участке и стрелка направления транскрипции от точки +1 */
  function promoter(x1, x2, y, dir, g = 'promoter') {
    const xs = dir === '+' ? x2 : x1;
    return G(g, `<rect x="${f(Math.min(x1, x2))}" y="${f(y - 9)}" width="${f(Math.abs(x2 - x1))}" height="18" rx="4" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.4"/>`) +
      G('tss', `<path d="M${f(xs)},${f(y - 9)} L${f(xs)},${f(y - 26)} L${f(xs + (dir === '+' ? 30 : -30))},${f(y - 26)}" fill="none" stroke="${C.ink}" stroke-width="2.4"/>` +
        `<path d="M${f(xs + (dir === '+' ? 38 : -38))},${f(y - 26)} l${dir === '+' ? -9 : 9},-5 l0,10 z" fill="${C.ink}"/>`);
  }
  /* липидный бислой горизонтально: две цепочки головок с хвостами (мембрана ядерной оболочки) */
  function bilayer(x1, x2, y, o = {}) {
    let s = ''; const step = 7, r = 2.6;
    for (let x = x1 + 3; x <= x2 - 3; x += step) {
      s += `<line x1="${f(x)}" y1="${f(y - 5.5)}" x2="${f(x)}" y2="${f(y - .8)}" stroke="${C.mem}" stroke-width="1"/><line x1="${f(x)}" y1="${f(y + .8)}" x2="${f(x)}" y2="${f(y + 5.5)}" stroke="${C.mem}" stroke-width="1"/>` +
        `<circle cx="${f(x)}" cy="${f(y - 7)}" r="${r}" fill="${C.memH}" stroke="${C.mem}" stroke-width=".7"/><circle cx="${f(x)}" cy="${f(y + 7)}" r="${r}" fill="${C.memH}" stroke="${C.mem}" stroke-width=".7"/>`;
    }
    return G(o.g || 'envelope', s);
  }
  /* ядерная оболочка (две мембраны) с порой между xp1 и xp2 */
  function envelope(x1, x2, y, xp1, xp2) {
    let s = bilayer(x1, xp1, y - 11) + bilayer(x1, xp1, y + 11) + bilayer(xp2, x2, y - 11) + bilayer(xp2, x2, y + 11);
    /* мембраны соединяются у края поры (общий изгиб бислоя), в поре — белки ядерного порового комплекса */
    s += G('npc', `<path d="M${f(xp1)},${f(y - 18)} Q${f(xp1 + 9)},${f(y)} ${f(xp1)},${f(y + 18)}" fill="none" stroke="${C.mem}" stroke-width="3"/>` +
      `<path d="M${f(xp2)},${f(y - 18)} Q${f(xp2 - 9)},${f(y)} ${f(xp2)},${f(y + 18)}" fill="none" stroke="${C.mem}" stroke-width="3"/>` +
      `<rect x="${f(xp1 + 2)}" y="${f(y - 22)}" width="9" height="44" rx="4" fill="#7E8CA3"/><rect x="${f(xp2 - 11)}" y="${f(y - 22)}" width="9" height="44" rx="4" fill="#7E8CA3"/>` +
      [0, 1, 2].map(i => `<path d="M${f(xp1 + 11)},${f(y - 14 + i * 14)} q${f((xp2 - xp1 - 22) / 4)},4 ${f((xp2 - xp1 - 22) / 2)},0 t${f((xp2 - xp1 - 22) / 2)},0" fill="none" stroke="#A9B4C6" stroke-width="1.2"/>`).join(''));
    return s;
  }
  /* молекула мРНК (или пре-мРНК) горизонтально: части parts = [{ w, kind: 'utr'|'cds'|'intron', g }], cap, pa — поли(А) */
  function mrna(x, y, parts, o = {}) {
    let s = '', xx = x;

(function () {

  const fmtN = n => { const r = Math.round(n); return r >= 10000 ? String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : r >= 1000 ? String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(r); };
