/* =====================================================================
   s0_gn.js — общие детали схем семинара 9 «Транскрипция и процессинг пре-мРНК». Общие для практикума и «Объяснений».
   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;
   оранжевая — РНК; фиолетовый овал — РНК-полимераза II; на генах и мРНК: тёмная заливка — кодирующий участок,
   светлая — нетранслируемая область (НТО), тонкая линия — интрон; красный кружок m⁷G — кэп; «AAAA» — поли(А)-хвост.
   Ядерная оболочка — две мембраны (каждая — липидный бислой) с ядерной порой. Это схемы, не химические формулы.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t()). Группы data-g — справка (gn_<g>, g_<g>).
   GN.seq — преобразования последовательностей (чистые функции, проверяются тестом tests9/models.mjs).
   ===================================================================== */
const GN = (function () {
  const C = { tpl: '#1F3B73', cod: '#8AA0BF', rna: '#E8912A', rnaL: '#F6D7AE', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',
    bad: '#C0392B', warn: '#C77700', ok: '#2E9B57', pol: '#7C4DBE', tfd: '#2C7FB8', tfb: '#4E9AC7', tfh: '#1F8A8A', tfo: '#6C8FB0',
    med: '#8A5A12', act: '#B85C00', cap: '#B03A2E', cpa: '#3D5A99', spl: '#2E9B57', exp: '#1F8A8A', xrn: '#6A3FA0',
    cds: '#4F86C6', utr: '#BBD0EA', mem: '#9C8F6E', memH: '#C9B98F', panel: '#F4F7FA', line: '#D3DAE3', nuc: '#FBF8F1', cyt: '#F3F7FB' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* подпись: anchor m — по центру, l — слева, r — справа; o.w — жирность, o.size, o.col; o.bg — белая подложка */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a}"${o.it ? ' font-style="italic"' : ''}${o.mono ? ' font-family="ui-monospace,Menlo,Consolas,monospace"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function textN(x, y, s, o = {}) { return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join(''); }
  function panel(x, y, w, h, title, fill) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${fill || C.panel}" stroke="${C.line}"/>` + (title ? text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted }) : '');
  }
  function arrow(x1, y1, x2, y2, col = C.muted, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
    const p1 = [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], p2 = [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)];
    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* белок: скруглённый прямоугольник с короткой подписью; o.op — непрозрачность (полупрозрачный — этап не начат или деталь вынута) */
  function blob(x, y, w, h, col, g, label, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2)}" fill="${col}" opacity="${o.op != null ? o.op : .93}" stroke="#fff" stroke-width="1.5"${o.dash ? ' stroke-dasharray="4 3"' : ''}/>` +
      (label ? (() => { const op = o.dash ? 1 : Math.min(1, (o.op != null ? o.op : .93) / .93), tx = text(x, y + 1, label, { size: o.size || 12, w: 700, col: '#fff' });
        return op < .9 ? `<g opacity="${f(op)}">${tx}</g>` : tx; })() : ''));   /* v1.2 (рецензия интерактива И-13): без «призраков» подписей у ещё не появившихся факторов */
  }
  /* красный крест: этап, на котором процесс остановился */
  function cross(x, y, r = 9) { return `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`; }

  /* ---------- последовательности ---------- */
  const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G', U: 'A' };
  const seq = {
    comp: s => s.split('').map(c => PAIR[c]).join(''),          /* комплементарная цепь, записанная под исходной (в обратной ориентации) */
    rev: s => s.split('').reverse().join(''),
    revcomp: s => seq.rev(seq.comp(s)),                          /* комплементарная цепь, записанная 5′→3′ */
    toRNA: s => s.replace(/T/g, 'U'),
    /* единица транскрипции на участке: top — верхняя цепь 5′→3′ слева направо; u = { a, b, dir: '+' (вправо) | '-' (влево) } */
    unit(top, u) {
      const part = top.slice(u.a, u.b + 1);
      const tplStrand = u.dir === '+' ? 'bot' : 'top', codStrand = u.dir === '+' ? 'top' : 'bot';
      const rna = seq.toRNA(u.dir === '+' ? part : seq.revcomp(part));             /* РНК 5′→3′ */
      const tpl35 = u.dir === '+' ? seq.comp(part) : seq.rev(part);                 /* матрица, записанная 3′→5′ (по ходу синтеза) */
      return { tplStrand, codStrand, rna, tpl35, len: part.length };
    },
  };

  /* ---------- двойная цепь ДНК с буквами ----------
     d: { x, y, dx, top, bot (bot — комплементарна top), tplStrand: 'top' | 'bot' | null, from, to — выделенный участок,
          lbl: true — концевые 5′/3′, size — размер букв, bubble: [a, b] — расплетённый участок (цепи расходятся) } */
  function duplex(d) {
    const n = d.top.length, dx = d.dx || 30, x0 = d.x, y = d.y, gap = d.gap || 26, X = i => x0 + i * dx;
    const sz = d.size || 14, bw = Math.min(22, dx - 4), bh = sz + 6;
    const colT = d.tplStrand === 'top' ? C.tpl : C.cod, colB = d.tplStrand === 'bot' ? C.tpl : C.cod;
    const gT = d.tplStrand === 'top' ? 'template' : d.tplStrand ? 'coding' : 'dna', gB = d.tplStrand === 'bot' ? 'template' : d.tplStrand ? 'coding' : 'dna';
    const bub = d.bubble, open = i => bub && i >= bub[0] && i <= bub[1];
    const yT = i => y - gap - (open(i) ? (d.open || 10) : 0), yB = i => y + gap + (open(i) ? (d.open || 10) : 0);
    let s = '';
    /* остовы: ломаная, чтобы показать расплетённый участок */
    const pathOf = yy => { let p = `M${f(X(0) - dx * .45)},${f(yy(0))}`; for (let i = 0; i < n; i++) p += ` L${f(X(i))},${f(yy(i))}`; return p + ` L${f(X(n - 1) + dx * .45)},${f(yy(n - 1))}`; };
    s += G(gT, `<path d="${pathOf(yT)}" fill="none" stroke="${colT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    s += G(gB, `<path d="${pathOf(yB)}" fill="none" stroke="${colB}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    for (let i = 0; i < n; i++) {
      const x = X(i), hl = d.from != null && i >= d.from && i <= d.to;
      if (!open(i)) s += line(x, yT(i) + bh / 2 + 3, x, yB(i) - bh / 2 - 3, C.rung, 1.4, 'stroke-dasharray="2.5 2.5"');
      s += baseL(x, yT(i) + (bh / 2 + 3), d.top[i], hl ? 'hl' : null, bw, bh, sz) + baseL(x, yB(i) - (bh / 2 + 3), d.bot[i], hl ? 'hl' : null, bw, bh, sz);
    }
    if (d.lbl !== false) {
      const ls = { size: 12.5, w: 700 };
      s += text(X(0) - dx * .45 - 6, yT(0), '5′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yT(n - 1), '3′', Object.assign({ a: 'l' }, ls));
      s += text(X(0) - dx * .45 - 6, yB(0), '3′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yB(n - 1), '5′', Object.assign({ a: 'l' }, ls));
    }
    return s;
  }
  function baseL(x, y, Lt, kind, w = 22, h = 20, sz = 14) {
    const fill = kind === 'hl' ? '#EEF3FA' : kind === 'rna' ? '#FFF4E6' : '#fff', st = kind === 'rna' ? C.rna : '#AEB9C7';
    return `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="4" fill="${fill}" stroke="${st}" stroke-width="1.2"/>` +
      text(x, y + .5, Lt, { size: sz, w: 700, col: kind === 'rna' ? '#8A4B00' : C.ink });
  }
  /* РНК под или над участком ДНК: буквы rna (5′→3′) по позициям ДНК; dir '+' — 5′-конец слева; k — сколько нуклеотидов уже синтезировано */
  function rnaRow(d) {
    const dx = d.dx || 30, X = i => d.x + i * dx, n = d.rna.length, k = d.k == null ? n : d.k, y = d.y, sz = d.size || 14;
    if (k <= 0) return '';
    const pos = j => d.dir === '+' ? d.a + j : d.b - j;          /* j-й нуклеотид РНК (от 5′) стоит напротив позиции ДНК pos(j) */
    const xs = [...Array(k).keys()].map(j => X(pos(j)));
    const xa = Math.min(...xs) - dx * .45, xb = Math.max(...xs) + dx * .45;
    let s = G('rna', line(xa, y + (d.up ? 13 : -13), xb, y + (d.up ? 13 : -13), C.rna, 5));
    for (let j = 0; j < k; j++) s += baseL(xs[j], y, d.rna[j], 'rna', Math.min(22, dx - 4), sz + 6, sz);
    const e5 = d.dir === '+' ? xa - 6 : xb + 6, e3 = d.dir === '+' ? xb + 6 : xa - 6;
    s += text(e5, y, '5′', { a: d.dir === '+' ? 'r' : 'l', size: 12.5, w: 700, col: '#8A4B00' });
    if (k >= n || d.end3) s += text(e3, y, '3′', { a: d.dir === '+' ? 'l' : 'r', size: 12.5, w: 700, col: '#8A4B00' });
    return s;
  }
  /* РНК-полимераза II (фиолетовый овал) с подписью */
  function pol2(x, y, t, o = {}) { return blob(x, y, o.w || 62, o.h || 34, C.pol, 'pol2', o.label === false ? '' : (o.label || 'Pol II'), Object.assign({ size: 12 }, o)); }
  /* промотор: прямоугольник на участке и стрелка направления транскрипции от точки +1 */
  function promoter(x1, x2, y, dir, g = 'promoter') {
    const xs = dir === '+' ? x2 : x1;
    return G(g, `<rect x="${f(Math.min(x1, x2))}" y="${f(y - 9)}" width="${f(Math.abs(x2 - x1))}" height="18" rx="4" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.4"/>`) +
      G('tss', `<path d="M${f(xs)},${f(y - 9)} L${f(xs)},${f(y - 26)} L${f(xs + (dir === '+' ? 30 : -30))},${f(y - 26)}" fill="none" stroke="${C.ink}" stroke-width="2.4"/>` +
        `<path d="M${f(xs + (dir === '+' ? 38 : -38))},${f(y - 26)} l${dir === '+' ? -9 : 9},-5 l0,10 z" fill="${C.ink}"/>`);
  }
  /* липидный бислой горизонтально: две цепочки головок с хвостами (мембрана ядерной оболочки) */
  function bilayer(x1, x2, y, o = {}) {
    let s = ''; const step = 7, r = 2.6;
    for (let x = x1 + 3; x <= x2 - 3; x += step) {
      s += `<line x1="${f(x)}" y1="${f(y - 5.5)}" x2="${f(x)}" y2="${f(y - .8)}" stroke="${C.mem}" stroke-width="1"/><line x1="${f(x)}" y1="${f(y + .8)}" x2="${f(x)}" y2="${f(y + 5.5)}" stroke="${C.mem}" stroke-width="1"/>` +
        `<circle cx="${f(x)}" cy="${f(y - 7)}" r="${r}" fill="${C.memH}" stroke="${C.mem}" stroke-width=".7"/><circle cx="${f(x)}" cy="${f(y + 7)}" r="${r}" fill="${C.memH}" stroke="${C.mem}" stroke-width=".7"/>`;
    }
    return G(o.g || 'envelope', s);
  }
  /* ядерная оболочка (две мембраны) с порой между xp1 и xp2 */
  function envelope(x1, x2, y, xp1, xp2) {
    let s = bilayer(x1, xp1, y - 11) + bilayer(x1, xp1, y + 11) + bilayer(xp2, x2, y - 11) + bilayer(xp2, x2, y + 11);
    /* мембраны соединяются у края поры (общий изгиб бислоя), в поре — белки ядерного порового комплекса */
    s += G('npc', `<path d="M${f(xp1)},${f(y - 18)} Q${f(xp1 + 9)},${f(y)} ${f(xp1)},${f(y + 18)}" fill="none" stroke="${C.mem}" stroke-width="3"/>` +
