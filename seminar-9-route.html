ap_inc_dist_z":"Не каждое изменение состава зрелой мРНК меняет белок: изменения в нетранслируемых областях последовательность аминокислот не затрагивают.","s4_cap_skip_dist":"Сразу два альтернативных выбора: 5′-НТО длиннее (дальний 5′-сайт интрона 1), а экзон 3 пропущен — белок короче на внутренний участок из 21 аминокислоты.","s4_cap_skip_dist_z":"Альтернативные события в одной пре-мРНК могут сочетаться; каждое затрагивает свой участок зрелой мРНК."},"notes":["Все пять экзонов в мРНК; белок 110 аминокислот.","Экзон 2 соединён с экзоном 4; белок 89 аминокислот."],"static":["Все пять экзонов в мРНК; белок 110 аминокислот."]}},"exam_quiz":{"id":"S9-E11","question":"При каком варианте альтернативного сплайсинга последовательность интрона остаётся в зрелой мРНК целиком?","options":[{"id":"S9-E11-1","text":"При пропуске экзона","correct":false,"feedback":"Пропускается экзон, а интроны вокруг него удаляются вместе с ним."},{"id":"S9-E11-2","text":"При удержании интрона","correct":true,"feedback":"Интрон не вырезается и становится частью зрелой мРНК."},{"id":"S9-E11-3","text":"При выборе одного из взаимоисключающих экзонов","correct":false,"feedback":"В мРНК входит один из экзонов; интроны удаляются."}]}},{"id":"what-changes","section":3,"questions":[4],"title":"Что меняется в белке при альтернативном сплайсинге, а что нет","keywords":["кодирующая область","нетранслируемая область","длина экзона","кратность трём","изоформа белка"],"lead":["Уже известно: разные мРНК одного гена образуются без изменения ДНК (БИО-9·21).","Новое: изменится ли белок, зависит от того, какой участок мРНК затронут."],"mechanism":["Если альтернативный выбор касается нетранслируемой области (например, длины 5′-НТО), кодирующая область и белок не меняются.","Если пропускается кодирующий экзон, длина которого кратна трём, белок короче на внутренний участок, а начало и конец сохраняются (здесь это правило дано готовым; рамка считывания — семинар 10).","Если длина пропущенного участка не кратна трём или вариант вносит стоп-кодон, белок изменяется сильнее или его почти нет — это разбирается в семинаре 10.","Поэтому разные мРНК одного гена могут кодировать одинаковый белок, разные варианты белка или не давать устойчивого белка."],"paragraphs":["Обнаружение варианта мРНК ещё не доказывает, что в клетке есть соответствующий вариант белка: для этого белок нужно найти отдельно.","Состав зрелой мРНК, а с ним и белок, может измениться и без изменения кодонов — если изменён сам сайт сплайсинга на границе экзона и интрона; такие изменения подробно разбираются в курсе «Молекулярная биология».","Вопрос «на каком этапе изменение меняет белковый продукт» (зачёт, вопрос 25): изменение последовательности кодирующей области или выбора экзонов при сплайсинге может изменить белок; изменение только в нетранслируемых областях последовательность белка не меняет."],"conditions":"Схема шага — модель вкладки 4.","sources":["Alberts2022"],"quiz":{"id":"S9-L22","question":"При альтернативном сплайсинге использован другой 5′-сайт интрона 1, и 5′-НТО стала на 35 нуклеотидов длиннее. Что с белком?","options":[{"id":"S9-L22-1","text":"Белок тот же: изменилась только нетранслируемая область","correct":true,"feedback":"Старт-кодон и кодирующая область не затронуты."},{"id":"S9-L22-2","text":"Белок длиннее на 35 аминокислот","correct":false,"feedback":"35 нуклеотидов добавились до старт-кодона и аминокислот не кодируют."},{"id":"S9-L22-3","text":"Белка не будет: сдвинулась рамка","correct":false,"feedback":"Рамку задаёт старт-кодон; изменение перед ним её не сдвигает."}]},"widget":{"kind":"dna","title":"","s":{"title":"Изменение 5′-НТО и кодирующей области","status":"Схема качественная · длины условные","modes_label":"Что показать","modes":["дальний 5′-сайт","пропуск экзона 3"],"scene":"s4b","args":[["inc","dist"],["skip","prox"]],"L":{"s4_e3":"Экзон 3","s4_e3_inc":"включён","s4_e3_skip":"пропущен","s4_ss":"5′-сайт сплайсинга интрона 1","s4_ss_prox":"ближний","s4_ss_dist":"дальний","s4_ctrl_note":"Ген один и тот же; меняется только то, какие сайты сплайсинга использованы при созревании пре-мРНК. У интрона 1 два возможных 5′-сайта: ближний — у самого конца экзона 1 и дальний — на 35 нуклеотидов ниже по ходу транскрипции, внутри интрона. Длина экзона 3 — 63 нуклеотида (кратна трём). Длины участков условные.","s4_pA":"А. Пре-мРНК (организация как в гене) и выбранные соединения экзонов","s4_pB":"Б. Зрелая мРНК","s4_pC":"В. Белок (схема; синтез белка — семинар 10)","s4_lbl_stop":"стоп","s4_lbl_e1":"экзон из одной 5′-НТО","s4_lbl_e3":"альтернативный экзон","s4_lbl_utr5":"5′-НТО: {n} нт","s4_lbl_cds":"кодирующая область: {n} нт","s4_lbl_utr3":"3′-НТО: {n} нт","s4_lbl_prot_inc":"{n} аминокислот; тёмный участок кодирует экзон 3","s4_lbl_prot_skip":"{n} аминокислот: нет внутреннего участка из 21 аминокислоты; начало и конец те же","s4_r_ex":"Экзоны в зрелой мРНК","s4_v_ex":"{e}","s4_r_utr5":"5′-нетранслируемая область","s4_v_nt":"{n} нт","s4_r_cds":"Кодирующая область","s4_r_cds_s":"от старт-кодона до стоп-кодона","s4_v_cds":"{n} нт, {c} кодонов","s4_r_prot":"Белок","s4_v_prot_inc":"{n} аминокислот","s4_v_prot_skip":"{n} аминокислот, без участка экзона 3","s4_r_dna":"Последовательность гена","s4_v_dna":"та же во всех вариантах","s4_cap_inc_prox":"Используются все экзоны и ближний 5′-сайт интрона 1. Экзон 1 целиком нетранслируемый, экзон 2 содержит конец 5′-НТО и старт-кодон, экзон 4 — стоп-кодон и начало 3′-НТО, экзон 5 — остальную 3′-НТО.","s4_cap_inc_prox_z":"Экзон — участок гена, который сохраняется в зрелой мРНК, а не обязательно кодирующий: в этом гене экзоны 1 и 5 целиком нетранслируемые, а экзоны 2 и 4 — частично.","s4_cap_skip_prox":"Экзон 3 пропущен: экзон 2 соединён прямо с экзоном 4. Длина экзона 3 кратна трём, поэтому без него кодирующая область короче на 21 кодон, а начало и конец белка те же; внутреннего участка из 21 аминокислоты нет.","s4_cap_skip_prox_z":"Альтернативный сплайсинг меняет состав зрелой мРНК, а последовательность гена остаётся прежней.","s4_cap_inc_dist":"Использован дальний 5′-сайт интрона 1: участок, который при ближнем сайте удалялся с интроном, остался в экзоне 1. Удлинилась только 5′-НТО; кодирующая область и белок не изменились.","s4_cap_inc_dist_z":"Не каждое изменение состава зрелой мРНК меняет белок: изменения в нетранслируемых областях последовательность аминокислот не затрагивают.","s4_cap_skip_dist":"Сразу два альтернативных выбора: 5′-НТО длиннее (дальний 5′-сайт интрона 1), а экзон 3 пропущен — белок короче на внутренний участок из 21 аминокислоты.","s4_cap_skip_dist_z":"Альтернативные события в одной пре-мРНК могут сочетаться; каждое затрагивает свой участок зрелой мРНК."},"notes":["5′-НТО 115 нт, белок прежний — 110 аминокислот.","5′-НТО 80 нт, белок короче — 89 аминокислот."],"static":["5′-НТО 115 нт, белок прежний — 110 аминокислот."]}},"exam_quiz":{"id":"S9-E12","question":"При альтернативном сплайсинге пропущен кодирующий экзон длиной 75 нуклеотидов. Что с белком?","options":[{"id":"S9-E12-1","text":"Рамка сдвинется, и белок оборвётся","correct":false,"feedback":"Рамка сдвигается, только если длина пропущенного участка не кратна трём."},{"id":"S9-E12-2","text":"Белок не изменится: экзоны не кодируют аминокислоты","correct":false,"feedback":"Этот экзон кодирующий; без него в белке нет соответствующего участка."},{"id":"S9-E12-3","text":"Он короче на внутренний участок из 25 аминокислот; начало и конец те же","correct":true,"feedback":"75 кратно трём, поэтому рамка не сдвигается."}]}},{"id":"bound-proteins","section":3,"questions":[4],"title":"Белки, связанные рядом с экзоном, меняют его включение","keywords":["РНК-связывающие белки","включение экзона","положение связывания"],"lead":["Уже известно: выбор сайтов сплайсинга зависит от белков, связывающихся с пре-мРНК (БИО-9·21).","Новое: таких белков больше, чем считали, и важно, с какой стороны экзона белок связан."],"mechanism":["Проверили 718 РНК-связывающих белков человека: каждый по очереди закрепляли на искусственной пре-мРНК рядом с альтернативным экзоном.","58 белков повышали включение экзона в зрелую мРНК, и среди них были белки, о роли которых в сплайсинге раньше не знали.","Для 41 из них результат зависел от того, с какой стороны экзона белок связан: 26 действовали только из интрона за экзоном, 15 — только из интрона перед ним; ещё 17 — с обеих сторон.","Значит, включение экзона определяется не только самим экзоном, но и набором белков у его границ — а этот набор различается в клетках."],"paragraphs":["Как это узнали: в клетках человека линии HEK293T белок принудительно связывали с искусственной пре-мРНК и измеряли долю мРНК с экзоном. Искусственное закрепление показывает, что белок может повысить включение, но не то, где и когда он делает это в природе.","Граница вывода: одна линия клеток и репортёрная пре-мРНК; для нескольких белков авторы затем показали влияние на сотни природных событий сплайсинга, но это не переносится автоматически на все гены и ткани.","Связанная модель — в практикуме: вопрос 4, уровень «Продвинутый» (две клетки с разным набором белков, влияющих на выбор сайтов сплайсинга); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Данные — клетки человека HEK293T, искусственная пре-мРНК.","sources":["Schmok2024"],"quiz":{"id":"S9-L23","question":"Белок повышает включение экзона, только если закреплён в интроне за экзоном. Что из этого следует?","options":[{"id":"S9-L23-1","text":"Белок изменяет последовательность ДНК гена","correct":false,"feedback":"Белок действует на пре-мРНК; ДНК не меняется."},{"id":"S9-L23-2","text":"Действие белка на выбор экзона зависит от места его связывания с пре-мРНК","correct":true,"feedback":"Один и тот же белок влияет или не влияет в зависимости от положения."},{"id":"S9-L23-3","text":"Белок не участвует в сплайсинге","correct":false,"feedback":"Он повышает включение экзона, то есть влияет на сплайсинг."}]},"widget":{"kind":"dna","title":"","s":{"title":"Две клетки — один ген","status":"Учебная модель · доли условные","modes_label":"Что показать","modes":["без репрессора в обеих","много репрессора в клетке Б"],"scene":"a4","args":[["no","no","no","no"],["no","no","hi","no"]],"L":{"s4a_prob":"В двух типах клеток один и тот же ген (вкладка 4). В каждой клетке свой набор РНК-связывающих белков, которые меняют выбор сайтов сплайсинга. Какие зрелые мРНК образуются в каждой клетке и можно ли по различию мРНК заключить, что различается ДНК?","s4a_r1_A":"Клетка А: репрессор включения экзона 3","s4a_r1_B":"Клетка Б: репрессор включения экзона 3","s4a_r2_A":"Клетка А: белок, активирующий дальний 3′-сайт интрона 4","s4a_r2_B":"Клетка Б: белок, активирующий дальний 3′-сайт интрона 4","s4a_r1_hi":"много","s4a_r1_lo":"мало","s4a_r1_no":"нет","s4a_r2_no":"нет","s4a_r2_yes":"есть","s4a_note":"В каждой клетке 100 условных молекул пре-мРНК; каждая молекула сплайсируется одним способом. Доли молекул с экзоном 3 (без репрессора — 100 %, при малом его количестве — 50 %, при большом — 0 %) — учебные допущения. Белок, активирующий дальний 3′-сайт сплайсинга интрона 4 (расположенный ниже по ходу транскрипции, внутри экзона 5), делает этот сайт используемым: начало экзона 5 удаляется вместе с интроном, 3′-НТО становится короче (310 вместо 460 нт).","s4a_pA":"А. Ген — одинаковая последовательность в клетках А и Б","s4a_pB":"Б. Клетка А: зрелые мРНК","s4a_pC":"В. Клетка Б: зрелые мРНК","s4a_lbl_gene":"та же пре-мРНК в обеих клетках","s4a_lbl_iso":"{n} из 100 молекул\nбелок {a} аминокислот, 3′-НТО {u} нт","s4a_lbl_reg":"репрессор экзона 3: {a}\nактиватор дальнего 3′-сайта: {b}","s4a_v_r1_hi":"много","s4a_v_r1_lo":"мало","s4a_v_r1_no":"нет","s4a_v_r2_no":"нет","s4a_v_r2_yes":"есть","s4a_lbl_one":"в этой клетке один вид зрелой мРНК","s4a_lbl_two":"в этой клетке два вида зрелой мРНК","s4a_r_A":"Клетка А","s4a_r_B":"Клетка Б","s4a_v_cell":"с экзоном 3: {i}, без него: {s}; 3′-НТО {u} нт","s4a_r_prot":"Белок в клетках А и Б","s4a_r_utr":"3′-НТО в клетках А и Б","s4a_v_diff":"различается","s4a_v_nodiff":"одинаков","s4a_r_gene":"Последовательность гена","s4a_v_gene":"одинакова в обеих клетках","s4a_cap_same":"Набор белков в клетках одинаков, и зрелые мРНК одинаковы.","s4a_cap_same_z":"Меняйте белки в одной из клеток и сравнивайте результаты.","s4a_cap_prot":"Клетки различаются только репрессором включения экзона 3: мРНК с экзоном 3 и без него представлены в разных долях, и белок в клетках различается внутренним участком. Ген одинаков.","s4a_cap_prot_z":"Разные продукты одной транскрипционной единицы возникают без изменения ДНК — при разном наборе белков, участвующих в выборе сайтов сплайсинга.","s4a_cap_utr":"Клетки различаются белком, активирующим дальний 3′-сайт интрона 4: 3′-НТО в них разной длины, а белок одинаков.","s4a_cap_utr_z":"Изменение зрелой мРНК не всегда меняет белок: здесь меняется только нетранслируемая область.","s4a_cap_both":"Клетки различаются обоими белками: в них разные доли мРНК с экзоном 3 и разная длина 3′-НТО.","s4a_cap_both_z":"Одна пре-мРНК может давать несколько вариантов, но клетка не обязательно образует все: набор вариантов зависит от белков клетки.","s4a_cap_mask":"Обратная задача: видны только зрелые мРНК двух клеток. Переключатели скрыты; последовательность гена в двух клетках не исследована.","s4a_cap_mask_z":"Что, кроме изменения гена, могло бы дать такое различие мРНК?","s4a_take":"Одна транскрипционная единица может давать разные зрелые мРНК: в разных клетках одна и та же пре-мРНК сплайсируется по-разному, потому что различаются белки, участвующие в выборе сайтов сплайсинга. Разница может касаться кодирующей области (белок меняется) или только нетранслируемой (белок прежний). Клетка не обязательно образует несколько вариантов. Различие мРНК двух клеток само по себе не доказывает различия ДНК: чтобы его исключить, сравнивают последовательности гена.","s4a_lim":"Модель не показывает конкретных РНК-связывающих белков и мест их связывания, конкуренции активаторов и подавляющих белков, связи выбора сайта с транскрипцией и того, что вариант с изменённой рамкой может разрушаться (семинар 10, курс «Молекулярная биология»). Длину 3′-НТО в клетках меняет и выбор места расщепления и полиаденилирования (альтернативное полиаденилирование); в модели показан только выбор 3′-сайта сплайсинга. Доли изоформ — учебные допущения. Мутация в сайте сплайсинга тоже меняет состав мРНК — подробно это разбирается в курсе «Молекулярная биология».","s4a_new":"Включением экзона в зрелую мРНК управляют белки, которые связываются с пре-мРНК рядом с ним. Это проверили на 718 РНК-связывающих белках человека: каждый по очереди закрепляли на искусственной пре-мРНК рядом с альтернативным экзоном. 58 белков повышали включение экзона, и среди них были белки, о роли которых в сплайсинге раньше не знали. Для 41 из них результат зависел от того, с какой стороны экзона белок связан: 26 действовали только из интрона за экзоном, 15 — только из интрона перед ним, ещё 17 — с обеих сторон.","s4a_how":"в клетках человека линии HEK293T белок принудительно связывали с искусственной пре-мРНК и измеряли долю мРНК с экзоном. Искусственное закрепление показывает, что белок может повысить включение, но не то, где и когда он делает это в природе.","s4a_tl_note":"Порядок этапов — учебная модель; доли изоформ условные.","s4a_tl_1":"Транскрипция: в обеих клетках синтезируется одна и та же пре-мРНК.","s4a_tl_2":"Белки клеток: в каждой клетке свой набор РНК-связывающих белков, которые присоединяются к пре-мРНК у сайтов сплайсинга.","s4a_tl_3":"Сплайсинг в клетке А: каждая молекула пре-мРНК сплайсируется одним способом.","s4a_tl_4":"Сплайсинг в клетке Б: варианты зависят от её набора белков.","s4a_pA_mask":"А. Ген клеток А и Б: последовательность не исследована","s4a_v_gene_mask":"не исследована","s4a_v_nodiff_f":"одинакова","s4a_pA_hyp":"А. Ген клеток А и Б: последовательность не исследована","s4a_lbl_gene_hyp":"гипотеза модели: та же пре-мРНК, разные белки клеток","s4a_v_gene_hyp":"не исследована; одинаковый ген — одна из гипотез","s4a_cap_hyp":"Такие различия мРНК совместимы с одинаковым геном при разных наборах РНК-связывающих белков — на схеме показана эта гипотеза. Это одна из возможных гипотез, а не установленный факт для этих клеток: последовательность гена не исследована.","s4a_cap_hyp_z":"Отличить различие белков от мутации сайта сплайсинга можно только сравнением последовательности соответствующего участка ДНК в двух клетках."},"notes":["Обе клетки: все мРНК с экзоном 3.","Клетка Б: все мРНК без экзона 3."],"static":["Обе клетки: все мРНК с экзоном 3."]}},"level":"adv"},{"id":"two-cells","section":3,"questions":[4],"title":"Разные мРНК двух клеток при одинаковом гене","keywords":["обратная задача","две клетки","набор регуляторов","мутация или регуляция","одна или несколько изоформ"],"lead":["Уже известно: включение экзона зависит от белков у его границ (БИО-9·23).","Новое: как рассуждать, когда мРНК двух клеток различаются, и что нужно, чтобы исключить изменение ДНК."],"mechanism":["В учебной модели две клетки с одним геном различаются двумя белками: репрессором включения экзона 3 и белком, активирующим дальний 3′-сайт последнего интрона (интрона 4).","При большом количестве репрессора экзон 3 пропускается (белок короче на внутренний участок из 21 аминокислоты); активатор дальнего 3′-сайта укорачивает 3′-НТО (460 → 310 нт), не меняя белка.","Если репрессора мало, в одной клетке есть оба варианта; если много или нет — один. Альтернативный сплайсинг не обязательно даёт несколько продуктов в каждой клетке.","То же различие мРНК могла бы дать мутация сайта сплайсинга. Различает гипотезы последовательность гена: при регуляции она одинакова, при мутации — изменена."],"paragraphs":["Обратная задача модели: в клетке А все мРНК с экзоном 3 и длинной 3′-НТО, в клетке Б — без экзона 3 и с короткой 3′-НТО; гены не сравнивали. Вывод «ДНК изменена» не следует: такие же мРНК модель даёт при одинаковом гене и разном наборе белков.","Мутации сайтов сплайсинга и их последствия подробно разбираются в курсе «Молекулярная биология»; регуляция количества и вариантов продукта — семинар 11.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель 4а; доли изоформ условные.","sources":["Alberts2022","Schmok2024"],"quiz":{"id":"S9-L24","question":"В двух клетках доли мРНК с экзоном 3 разные. Какое наблюдение отличит различие регуляторных белков от мутации сайта сплайсинга?","options":[{"id":"S9-L24-1","text":"Сравнение долей изоформ мРНК","correct":false,"feedback":"Это наблюдение уже есть, и обе гипотезы его объясняют."},{"id":"S9-L24-2","text":"Сравнение длины белка","correct":false,"feedback":"Длина белка — следствие состава мРНК; при обеих гипотезах она одна и та же."},{"id":"S9-L24-3","text":"Сравнение последовательности гена в двух клетках","correct":true,"feedback":"Две гипотезы предсказывают разное только для ДНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Две клетки — один ген","status":"Учебная модель · доли условные","modes_label":"Что показать","modes":["репрессора мало в клетке Б","клетка Б: много репрессора, активатор 3′-сайта"],"scene":"a4","args":[["no","no","lo","no"],["no","no","hi","yes"]],"L":{"s4a_prob":"В двух типах клеток один и тот же ген (вкладка 4). В каждой клетке свой набор РНК-связывающих белков, которые меняют выбор сайтов сплайсинга. Какие зрелые мРНК образуются в каждой клетке и можно ли по различию мРНК заключить, что различается ДНК?","s4a_r1_A":"Клетка А: репрессор включения экзона 3","s4a_r1_B":"Клетка Б: репрессор включения экзона 3","s4a_r2_A":"Клетка А: белок, активирующий дальний 3′-сайт интрона 4","s4a_r2_B":"Клетка Б: белок, активирующий дальний 3′-сайт интрона 4","s4a_r1_hi":"много","s4a_r1_lo":"мало","s4a_r1_no":"нет","s4a_r2_no":"нет","s4a_r2_yes":"есть","s4a_note":"В каждой клетке 100 условных молекул пре-мРНК; каждая молекула сплайсируется одним способом. Доли молекул с экзоном 3 (без репрессора — 100 %, при малом его количестве — 50 %, при большом — 0 %) — учебные допущения. Белок, активирующий дальний 3′-сайт сплайсинга интрона 4 (расположенный ниже по ходу транскрипции, внутри экзона 5), делает этот сайт используемым: начало экзона 5 удаляется вместе с интроном, 3′-НТО становится короче (310 вместо 460 нт).","s4a_pA":"А. Ген — одинаковая последовательность в клетках А и Б","s4a_pB":"Б. Клетка А: зрелые мРНК","s4a_pC":"В. Клетка Б: зрелые мРНК","s4a_lbl_gene":"та же пре-мРНК в обеих клетках","s4a_lbl_iso":"{n} из 100 молекул\nбелок {a} аминокислот, 3′-НТО {u} нт","s4a_lbl_reg":"репрессор экзона 3: {a}\nактиватор дальнего 3′-сайта: {b}","s4a_v_r1_hi":"много","s4a_v_r1_lo":"мало","s4a_v_r1_no":"нет","s4a_v_r2_no":"нет","s4a_v_r2_yes":"есть","s4a_lbl_one":"в этой клетке один вид зрелой мРНК","s4a_lbl_two":"в этой клетке два вида зрелой мРНК","s4a_r_A":"Клетка А","s4a_r_B":"Клетка Б","s4a_v_cell":"с экзоном 3: {i}, без него: {s}; 3′-НТО {u} нт","s4a_r_prot":"Белок в клетках А и Б","s4a_r_utr":"3′-НТО в клетках А и Б","s4a_v_diff":"различается","s4a_v_nodiff":"одинаков","s4a_r_gene":"Последовательность гена","s4a_v_gene":"одинакова в обеих клетках","s4a_cap_same":"Набор белков в клетках одинаков, и зрелые мРНК одинаковы.","s4a_cap_same_z":"Меняйте белки в одной из клеток и сравнивайте результаты.","s4a_cap_prot":"Клетки различаются только репрессором включения экзона 3: мРНК с экзоном 3 и без него представлены в разных долях, и белок в клетках различается внутренним участком. Ген одинаков.","s4a_cap_prot_z":"Разные продукты одной транскрипционной единицы возникают без изменения ДНК — при разном наборе белков, участвующих в выборе сайтов сплайсинга.","s4a_cap_utr":"Клетки различаются белком, активирующим дальний 3′-сайт интрона 4: 3′-НТО в них разной длины, а белок одинаков.","s4a_cap_utr_z":"Изменение зрелой мРНК не всегда меняет белок: здесь меняется только нетранслируемая область.","s4a_cap_both":"Клетки различаются обоими белками: в них разные доли мРНК с экзоном 3 и разная длина 3′-НТО.","s4a_cap_both_z":"Одна пре-мРНК может давать несколько вариантов, но клетка не обязательно образует все: набор вариантов зависит от белков клетки.","s4a_cap_mask":"Обратная задача: видны только зрелые мРНК двух клеток. Переключатели скрыты; последовательность гена в двух клетках не исследована.","s4a_cap_mask_z":"Что, кроме изменения гена, могло бы дать такое различие мРНК?","s4a_take":"Одна транскрипционная единица может давать разные зрелые мРНК: в разных клетках одна и та же пре-мРНК сплайсируется по-разному, потому что различаются белки, участвующие в выборе сайтов сплайсинга. Разница может касаться кодирующей области (белок меняется) или только нетранслируемой (белок прежний). Клетка не обязательно образует несколько вариантов. Различие мРНК двух клеток само по себе не доказывает различия ДНК: чтобы его исключить, сравнивают последовательности гена.","s4a_lim":"Модель не показывает конкретных РНК-связывающих белков и мест их связывания, конкуренции активаторов и подавляющих белков, связи выбора сайта с транскрипцией и того, что вариант с изменённой рамкой может разрушаться (семинар 10, курс «Молекулярная биология»). Длину 3′-НТО в клетках меняет и выбор места расщепления и полиаденилирования (альтернативное полиаденилирование); в модели показан только выбор 3′-сайта сплайсинга. Доли изоформ — учебные допущения. Мутация в сайте сплайсинга тоже меняет состав мРНК — подробно это разбирается в курсе «Молекулярная биология».","s4a_new":"Включением экзона в зрелую мРНК управляют белки, которые связываются с пре-мРНК рядом с ним. Это проверили на 718 РНК-связывающих белках человека: каждый по очереди закрепляли на искусственной пре-мРНК рядом с альтернативным экзоном. 58 белков повышали включение экзона, и среди них были белки, о роли которых в сплайсинге раньше не знали. Для 41 из них результат зависел от того, с какой стороны экзона белок связан: 26 действовали только из интрона за экзоном, 15 — только из интрона перед ним, ещё 17 — с обеих сторон.","s4a_how":"в клетках человека линии HEK293T белок принудительно связывали с искусственной пре-мРНК и измеряли долю мРНК с экзоном. Искусственное закрепление показывает, что белок может повысить включение, но не то, где и когда он делает это в природе.","s4a_tl_note":"Порядок этапов — учебная модель; доли изоформ условные.","s4a_tl_1":"Транскрипция: в обеих клетках синтезируется одна и та же пре-мРНК.","s4a_tl_2":"Белки клеток: в каждой клетке свой набор РНК-связывающих белков, которые присоединяются к пре-мРНК у сайтов сплайсинга.","s4a_tl_3":"Сплайсинг в клетке А: каждая молекула пре-мРНК сплайсируется одним способом.","s4a_tl_4":"Сплайсинг в клетке Б: варианты зависят от её набора белков.","s4a_pA_mask":"А. Ген клеток А и Б: последовательность не исследована","s4a_v_gene_mask":"не исследована","s4a_v_nodiff_f":"одинакова","s4a_pA_hyp":"А. Ген клеток А и Б: последовательность не исследована","s4a_lbl_gene_hyp":"гипотеза модели: та же пре-мРНК, разные белки клеток","s4a_v_gene_hyp":"не исследована; одинаковый ген — одна из гипотез","s4a_cap_hyp":"Такие различия мРНК совместимы с одинаковым геном при разных наборах РНК-связывающих белков — на схеме показана эта гипотеза. Это одна из возможных гипотез, а не установленный факт для этих клеток: последовательность гена не исследована.","s4a_cap_hyp_z":"Отличить различие белков от мутации сайта сплайсинга можно только сравнением последовательности соответствующего участка ДНК в двух клетках."},"notes":["Клетка Б: по 50 молекул с экзоном 3 и без него.","Клетка Б: без экзона 3 и с короткой 3′-НТО."],"static":["Клетка Б: по 50 молекул с экзоном 3 и без него."]}},"level":"adv"},{"id":"integration","section":3,"questions":[1,2,3,4],"title":"Сводная задача: по какому наблюдению находят этап, на котором изменился путь к мРНК","keywords":["этапы пути","сочетание наблюдений","возможные причины","предел вывода"],"lead":["Объединим четыре вопроса. Для одного гена в клетках человека можно измерить число начатых синтезов, короткие РНК у промотора, пре-мРНК и зрелую мРНК в ядре, мРНК в цитоплазме и её экзонный состав.","Задача — для каждого этапа пути от ДНК к цитоплазматической мРНК назвать сочетание наблюдений, которое на него указывает, и не делать вывода сильнее, чем позволяют данные."],"mechanism":["Инициация: реже начинается синтез — меньше начатых синтезов, а все последующие пулы уменьшаются почти пропорционально; ни один промежуточный продукт не накапливается.","Продолжение синтеза: начатых синтезов столько же, но больше коротких РНК у промотора или незавершённых РНК в теле гена.","Процессинг: накапливается пре-мРНК (с интронами или без образованного 3′-конца), а РНК без кэпа быстро разрушается.","Экспорт: в ядре накапливается зрелая мРНК с кэпом, без интронов и с поли(А)-хвостом.","Сплайсинг другого варианта: меняется экзонный состав мРНК. В модели вкладки 4 общее количество мРНК при этом прежнее, но в клетке изоформы могут разрушаться с разной скоростью, поэтому признак — состав, а не количество."],"paragraphs":["Общее правило: молекулы накапливаются перед замедленным этапом; если не накапливается ни один пул, а всё меньше пропорционально, уменьшено поступление — инициация.","Изменённый экзонный состав мРНК ещё не означает изменения ДНК: так действует и альтернативный сплайсинг. Изменение ДНК устанавливают, сравнивая последовательность гена.","Общий принцип семинара: транскрипция, процессинг пре-мРНК, образование зрелой мРНК и её экспорт — связанные, но разные процессы, и количество и состав зрелой мРНК не определяются одним фактом инициации транскрипции."],"conditions":"Мысленная задача по моделям вкладок 2–4; числа в вопросе условные.","sources":["Alberts2022"],"quiz":{"id":"S9-L25","question":"По сравнению с нормой число начатых синтезов, пре-мРНК в ядре и мРНК в цитоплазме меньше примерно в одно и то же число раз, доля коротких РНК у промотора прежняя. На каком этапе изменение?","options":[{"id":"S9-L25-1","text":"На инициации: синтез начинается реже","correct":true,"feedback":"Ни один промежуточный продукт не накапливается — уменьшено поступление молекул на первом этапе."},{"id":"S9-L25-2","text":"На экспорте мРНП из ядра","correct":false,"feedback":"Тогда зрелая мРНК накапливалась бы в ядре, а число начатых синтезов не изменилось бы."},{"id":"S9-L25-3","text":"На сплайсинге","correct":false,"feedback":"Тогда накапливалась бы пре-мРНК, а число начатых синтезов осталось бы прежним."}]},"widget":{"kind":"dna","title":"","s":{"title":"Синтез снижен: все пулы меньше пропорционально","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["норма","синтез снижен"],"scene":"a3","args":[["10","0.3","0.2"],["4","0.3","0.2"]],"L":{"s3a_prob":"Транскрипция идёт, но мРНК в цитоплазме мало. В учебной модели РНК гена разделена на три пула, которые сменяют друг друга: пре-мРНК в ядре, зрелая мРНК в ядре, мРНК в цитоплазме; каждая молекула в каждый момент находится в одном пуле (в клетке процессинг во многом идёт во время транскрипции, и модель это упрощает). Как по количеству РНК в ядре и в цитоплазме отличить замедление процессинга от замедления экспорта и от снижения синтеза?","s3a_s":"Синтез пре-мРНК (условно)","s3a_s_10":"10 в мин","s3a_s_4":"4 в мин","s3a_kp":"Процессинг: созревает за минуту","s3a_kp_30":"30 % пре-мРНК","s3a_kp_3":"3 %","s3a_ke":"Экспорт: выходит за минуту","s3a_ke_20":"20 % зрелых ядерных мРНК","s3a_ke_2":"2 %","s3a_note":"Наблюдение — 60 мин от начала синтеза, шаг модели — 1 мин. Разрушается за минуту: 5 % пре-мРНК, 2 % зрелых мРНК в ядре и 2 % в цитоплазме. Все значения — учебные допущения, а не измеренные величины; в модели ни одна молекула не возникает и не исчезает без перехода — синтезировано = сумма пулов + разрушено. Пулы — балансовое учебное представление состояний РНК, а не хронология процессинга одной молекулы: в клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции.","s3a_pN":"Ядро · через {m} мин","s3a_pC":"Цитоплазма","s3a_pB":"Б. Пулы во времени (условные единицы)","s3a_pool_pre":"пре-мРНК","s3a_pool_nuc":"зрелая мРНК в ядре","s3a_pool_cyt":"мРНК в цитоплазме","s3a_lbl_syn":"синтез {s}/мин","s3a_lbl_proc":"процессинг","s3a_lbl_k":"{k} % в мин","s3a_lbl_exp":"экспорт {k} % в мин","s3a_lbl_dn":"разрушено в ядре: {n}","s3a_lbl_dc":"разрушено в цитоплазме: {n}","s3a_lbl_ctrl":"контроль","s3a_leg":"янтарная — пре-мРНК · фиолетовая — зрелая в ядре · зелёная — в цитоплазме","s3a_leg_mask":"зелёная — мРНК в цитоплазме · пунктир — контроль","s3a_r_tot":"Синтезировано пре-мРНК","s3a_r_tot_s":"за 60 мин","s3a_r_pre":"Пре-мРНК в ядре","s3a_r_nuc":"Зрелая мРНК в ядре","s3a_r_cyt":"мРНК в цитоплазме","s3a_r_cyt_s":"через 60 мин","s3a_r_ctrl":"мРНК в цитоплазме в контроле","s3a_r_deg":"Разрушено","s3a_r_deg_s":"в ядре + в цитоплазме","s3a_v_n":"{n}","s3a_v_deg":"{a} + {b}","s3a_cap_ctrl":"Контроль модели: пре-мРНК созревает быстрее, чем разрушается, и зрелая мРНК быстро выходит в цитоплазму. Через 60 мин в цитоплазме {c} молекул; в ядре их немного.","s3a_cap_ctrl_z":"Даже без нарушений не вся синтезированная РНК доходит до цитоплазмы: часть разрушается в ядре.","s3a_cap_proc":"Процессинг замедлен в 10 раз: пре-мРНК накапливается в ядре и чаще разрушается, не успев созреть. Зрелой мРНК в ядре мало, в цитоплазме — {c} (в контроле {k}).","s3a_cap_proc_z":"Признак замедленного процессинга — избыток пре-мРНК в ядре при малом количестве зрелой мРНК.","s3a_cap_exp":"Экспорт замедлен в 10 раз: процессинг идёт нормально, и зрелая мРНК накапливается в ядре. В цитоплазме — {c} (в контроле {k}).","s3a_cap_exp_z":"Признак замедленного экспорта — избыток зрелой мРНК в ядре при нормальном количестве пре-мРНК.","s3a_cap_tx":"Синтез снижен в 2,5 раза: все пулы уменьшились почти пропорционально. В цитоплазме — {c} (в контроле {k}); избытка ни пре-мРНК, ни зрелой мРНК в ядре нет.","s3a_cap_tx_z":"Если ни один ядерный пул не накапливается, причину ищут до процессинга — в синтезе.","s3a_cap_mix":"Изменено несколько условий сразу. В цитоплазме — {c} (в контроле {k}); вклады этапов перемножаются.","s3a_cap_mix_z":"Чтобы отделить вклады нескольких нарушений, нужны все три пула и скорость синтеза.","s3a_cap_mask":"Обратная задача: известно только количество мРНК в цитоплазме. Переключатели скрыты.","s3a_cap_mask_z":"Сколько разных причин дают такой же итог?","s3a_take":"Количество мРНК в цитоплазме определяется не только транскрипцией: каждая молекула проходит процессинг и экспорт и на каждом этапе может разрушиться. Одинаково мало цитоплазматической мРНК дают сниженный синтез, замедленный процессинг и замедленный экспорт; различить их можно по ядерным пулам: при замедленном процессинге накапливается пре-мРНК, при замедленном экспорте — зрелая мРНК в ядре, при сниженном синтезе не накапливается ни то ни другое.","s3a_lim":"Это балансовая модель состояний РНК, а не буквальная хронология процессинга одной молекулы: в реальной клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции. Все доли и скорости модели — учебные допущения, не измеренные для какого-либо гена. Модель не показывает, что процессинг идёт в несколько этапов и во время транскрипции, что разные интроны удаляются с разной скоростью, что зрелая мРНК в цитоплазме разрушается с разной скоростью у разных генов (время жизни мРНК — курс «Молекулярная биология»), и что клетка может регулировать задержку РНК в ядре.","s3a_new":"Не все интроны удаляются во время транскрипции. В клетках млекопитающих 27–40 % интронов ещё присутствуют в уже полиаденилированной РНК, связанной с хроматином: они удаляются после окончания синтеза, пока РНК остаётся у места транскрипции. В клетках человека линии K562 медиана времени полужизни мРНК на хроматине — около 50 мин, а для мРНК части генов оценка — 170 мин и больше. РНК с так называемыми задержанными интронами удерживается в ядре, пока интрон не будет удалён; иначе её разрушают в ядре. Так задержка сплайсинга определяет, когда и сколько мРНК выйдет в цитоплазму.","s3a_how":"разделили РНК клеток на фракции — связанную с хроматином, ядерную и цитоплазматическую — и определили, какие интроны в каждой ещё есть; время пребывания на хроматине измеряли по метке, встроенной в новосинтезированную РНК. Это сводка многих работ в обзоре; доли и времена различаются между типами клеток и генами.","s3a_tl_note":"Шкала — время наблюдения, по 10 мин на этап. Числа на схеме — условные, округлённые до целых.","s3a_tl_1":"0–10 мин: синтезируется пре-мРНК; часть её уже созрела.","s3a_tl_2":"10–20 мин: зрелая мРНК выходит в цитоплазму.","s3a_tl_3":"20–30 мин: ядерные пулы приближаются к постоянному уровню; пул перед замедленным этапом растёт дольше.","s3a_tl_4":"30–40 мин: мРНК в цитоплазме продолжает накапливаться.","s3a_tl_5":"40–50 мин: распад идёт всё время — разрушенных молекул всё больше.","s3a_tl_6":"50–60 мин: итог; синтезировано = пре-мРНК + зрелая в ядре + в цитоплазме + разрушено.","s3a_ms":"Через {m} мин:","s3a_ms_dn":"разрушено в ядре","s3a_ms_dc":"разрушено в цитоплазме"},"notes":["Синтез 10 в минуту: в цитоплазме 254 мРНК через 60 мин.","Синтез 4 в минуту: все пулы меньше примерно в 2,5 раза."],"static":["Синтез 10 в минуту: в цитоплазме 254 мРНК через 60 мин."]}}},{"id":"exit-to-translation","section":3,"questions":[1,2,3,4],"title":"Что дальше: зрелая мРНК — матрица трансляции","keywords":["зрелая мРНК","старт-кодон","кодирующая область","семинар 10"],"lead":["Зрелая мРНК в цитоплазме — с кэпом, кодирующей областью между нетранслируемыми и поли(А)-хвостом — готова служить матрицей.","Как рибосома синтезирует по ней белок — тема следующего семинара."],"mechanism":["Кэп и поли(А)-хвост участвуют в инициации трансляции.","Трансляция начинается со старт-кодона — не с точки начала транскрипции: 5′-НТО рибосома проходит, не синтезируя белок.","Последовательность кодонов кодирующей области определяет последовательность аминокислот белка.","Изменения нетранслируемых областей не меняют последовательности белка, но могут влиять на количество мРНК и белка (семинар 11)."],"paragraphs":["В семинаре 10 — генетический код, рамка считывания и то, что происходит, если в мРНК изменена длина кодирующего участка: тогда станет понятно, почему пропуск экзона, длина которого не кратна трём, меняет белок сильнее.","Регуляция количества мРНК и выбора её вариантов — семинар 11 и курс «Молекулярная биология».",{"h":"Дальше в курсе «Молекулярная биология»"},"Чем различаются энхансер и промотор — [[https://fresll.github.io/molbio/seminar-6-route.html#enhancer|МБ, семинар 6, шаг 9]]; как факторы и коактиваторы связывают контакт энхансера с транскрипцией — [[https://fresll.github.io/molbio/seminar-6-route.html#coactivators|МБ, семинар 6, шаг 12]]; нарушение сайта сплайсинга, время жизни мРНК и нонсенс-опосредованный распад мРНК — МБ, семинар 13 (в разработке)."],"conditions":"Переход к следующему семинару; подробности — в семинарах 10–11.","sources":["Alberts2022"],"quiz":{"id":"S9-L26","question":"С какого места мРНК рибосома начинает синтез белка?","options":[{"id":"S9-L26-1","text":"С первого нуклеотида после кэпа","correct":false,"feedback":"Начало мРНК — 5′-НТО, она не транслируется."},{"id":"S9-L26-2","text":"Со старт-кодона AUG","correct":true,"feedback":"Трансляция начинается со старт-кодона; участок до него — 5′-НТО."},{"id":"S9-L26-3","text":"С точки +1 на ДНК","correct":false,"feedback":"Точка +1 — начало транскрипции на ДНК, а трансляция идёт на мРНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Зрелая мРНК","status":"Схема качественная · длины условные","modes_label":"Что показать","modes":["зрелая мРНК"],"scene":"s4b","args":[["inc","prox"]],"L":{"s4_e3":"Экзон 3","s4_e3_inc":"включён","s4_e3_skip":"пропущен","s4_ss":"5′-сайт сплайсинга интрона 1","s4_ss_prox":"ближний","s4_ss_dist":"дальний","s4_ctrl_note":"Ген один и тот же; меняется только то, какие сайты сплайсинга использованы при созревании пре-мРНК. У интрона 1 два возможных 5′-сайта: ближний — у самого конца экзона 1 и дальний — на 35 нуклеотидов ниже по ходу транскрипции, внутри интрона. Длина экзона 3 — 63 нуклеотида (кратна трём). Длины участков условные.","s4_pA":"А. Пре-мРНК (организация как в гене) и выбранные соединения экзонов","s4_pB":"Б. Зрелая мРНК","s4_pC":"В. Белок (схема; синтез белка — семинар 10)","s4_lbl_stop":"стоп","s4_lbl_e1":"экзон из одной 5′-НТО","s4_lbl_e3":"альтернативный экзон","s4_lbl_utr5":"5′-НТО: {n} нт","s4_lbl_cds":"кодирующая область: {n} нт","s4_lbl_utr3":"3′-НТО: {n} нт","s4_lbl_prot_inc":"{n} аминокислот; тёмный участок кодирует экзон 3","s4_lbl_prot_skip":"{n} аминокислот: нет внутреннего участка из 21 аминокислоты; начало и конец те же","s4_r_ex":"Экзоны в зрелой мРНК","s4_v_ex":"{e}","s4_r_utr5":"5′-нетранслируемая область","s4_v_nt":"{n} нт","s4_r_cds":"Кодирующая область","s4_r_cds_s":"от старт-кодона до стоп-кодона","s4_v_cds":"{n} нт, {c} кодонов","s4_r_prot":"Белок","s4_v_prot_inc":"{n} аминокислот","s4_v_prot_skip":"{n} аминокислот, без участка экзона 3","s4_r_dna":"Последовательность гена","s4_v_dna":"та же во всех вариантах","s4_cap_inc_prox":"Используются все экзоны и ближний 5′-сайт интрона 1. Экзон 1 целиком нетранслируемый, экзон 2 содержит конец 5′-НТО и старт-кодон, экзон 4 — стоп-кодон и начало 3′-НТО, экзон 5 — остальную 3′-НТО.","s4_cap_inc_prox_z":"Экзон — участок гена, который сохраняется в зрелой мРНК, а не обязательно кодирующий: в этом гене экзоны 1 и 5 целиком нетранслируемые, а экзоны 2 и 4 — частично.","s4_cap_skip_prox":"Экзон 3 пропущен: экзон 2 соединён прямо с экзоном 4. Длина экзона 3 кратна трём, поэтому без него кодирующая область короче на 21 кодон, а начало и конец белка те же; внутреннего участка из 21 аминокислоты нет.","s4_cap_skip_prox_z":"Альтернативный сплайсинг меняет состав зрелой мРНК, а последовательность гена остаётся прежней.","s4_cap_inc_dist":"Использован дальний 5′-сайт интрона 1: участок, который при ближнем сайте удалялся с интроном, остался в экзоне 1. Удлинилась только 5′-НТО; кодирующая область и белок не изменились.","s4_cap_inc_dist_z":"Не каждое изменение состава зрелой мРНК меняет белок: изменения в нетранслируемых областях последовательность аминокислот не затрагивают.","s4_cap_skip_dist":"Сразу два альтернативных выбора: 5′-НТО длиннее (дальний 5′-сайт интрона 1), а экзон 3 пропущен — белок короче на внутренний участок из 21 аминокислоты.","s4_cap_skip_dist_z":"Альтернативные события в одной пре-мРНК могут сочетаться; каждое затрагивает свой участок зрелой мРНК."},"notes":["Кэп, 5′-НТО, кодирующая область, 3′-НТО, поли(А)."],"static":["Кэп, 5′-НТО, кодирующая область, 3′-НТО, поли(А)."]}}}],"sections":[{"title":"Матричная и кодирующая цепи ДНК и ориентация транскрипционной единицы","entry":"transcription-unit","sub":"Почему выбор матричной цепи определяется ориентацией транскрипционной единицы, а не хромосомы"},{"title":"Инициация, элонгация и терминация транскрипции","entry":"rna-polymerases","sub":"Что задаёт начало и конец транскрипции и почему начатый синтез ещё не полный транскрипт"},{"title":"Котранскрипционный процессинг пре-мРНК и ядерный экспорт","entry":"primary-transcript","sub":"Как пре-мРНК созревает во время транскрипции и почему синтез РНК ещё не означает мРНК в цитоплазме"},{"title":"Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК","entry":"exon-utr","sub":"Чем экзон отличается от кодирующей последовательности и почему разные мРНК одного гена не требуют изменения ДНК"}],"glossary":[{"id":"S9-T01","term":"Транскрипция","section":0,"def":"Синтез РНК на матрице ДНК, который осуществляет ДНК-зависимая РНК-полимераза. РНК удлиняется от 5′- к 3′-концу и комплементарна матричной цепи ДНК."},{"id":"S9-T02","term":"Транскрипционная единица","section":0,"def":"Участок ДНК, с которого синтезируется определённая РНК (первичный транскрипт): от точки начала транскрипции до области терминации. Её транскрипцию обеспечивает промотор, расположенный у начала единицы и задающий направление синтеза; сам промотор в общем случае не транскрибируется."},{"id":"S9-T03","term":"Матричная цепь ДНК","section":0,"def":"Цепь ДНК, комплементарная синтезируемой РНК и антипараллельная ей; РНК-полимераза движется вдоль неё в направлении 3′→5′. Какая цепь станет матричной, зависит от ориентации конкретной транскрипционной единицы."},{"id":"S9-T04","term":"Кодирующая цепь ДНК","section":0,"def":"Цепь ДНК, комплементарная матричной; её последовательность, прочитанная от 5′ к 3′, совпадает с последовательностью РНК, если T заменить на U. Последовательности генов принято записывать по кодирующей цепи."},{"id":"S9-T07","term":"РНК-полимераза II","section":1,"def":"Фермент ядра эукариот, который транскрибирует белок-кодирующие гены (и гены многих некодирующих РНК). Не узнаёт промотор сама: её привлекают общие факторы транскрипции. Имеет C-концевой домен, с которым связываются факторы процессинга."},{"id":"S9-T08","term":"Промотор","section":0,"def":"Участок ДНК у начала транскрипционной единицы, с которым связываются общие факторы транскрипции и РНК-полимераза; задаёт точку начала транскрипции и её направление, а тем самым — какая цепь станет матричной."},{"id":"S9-T09","term":"Точка начала транскрипции (+1)","section":0,"def":"Нуклеотид ДНК, против которого стоит первый нуклеотид РНК. Нуклеотиды, расположенные перед ней, обозначают отрицательными номерами, после неё — положительными. Не совпадает со старт-кодоном."},{"id":"S9-T10","term":"TATA-бокс","section":1,"def":"Последовательность, богатая A и T, примерно за 30 нуклеотидов до точки начала транскрипции у части промоторов РНК-полимеразы II; её узнаёт TATA-связывающий белок в составе TFIID. Есть не у всех промоторов."},{"id":"S9-T11","term":"Инициаторный элемент (Inr) и нижележащий элемент промотора (DPE)","section":1,"def":"Последовательности промотора РНК-полимеразы II у точки +1 (Inr) и после неё (DPE), которые узнают субъединицы TFIID; у промоторов без TATA-бокса задают положение начала транскрипции."},{"id":"S9-T12","term":"TFIID","section":1,"def":"Общий фактор транскрипции из TATA-связывающего белка и связанных с ним субъединиц (TAF). Первым связывается с промотором — с TATA-боксом или другими его элементами — и начинает сборку преинициаторного комплекса."},{"id":"S9-T13","term":"TFIIB","section":1,"def":"Общий фактор транскрипции, связывающийся рядом с TATA-связывающим белком; ориентирует РНК-полимеразу II на промоторе и тем самым задаёт направление транскрипции."},{"id":"S9-T14","term":"TFIIF","section":1,"def":"Общий фактор транскрипции, который присоединяется вместе с РНК-полимеразой II и стабилизирует её связь с TFIIB и TBP; привлекает TFIIE и TFIIH."},{"id":"S9-T15","term":"TFIIE","section":1,"def":"Общий фактор транскрипции, который привлекает TFIIH к преинициаторному комплексу и регулирует его."},{"id":"S9-T16","term":"TFIIH","section":1,"def":"Общий фактор транскрипции с хеликазной и киназной активностями: расплетает ДНК у точки начала транскрипции и фосфорилирует серин 5 повторов C-концевого домена РНК-полимеразы II, освобождая её от промотора. Участвует также в репарации ДНК."},{"id":"S9-T17","term":"Преинициаторный комплекс","section":1,"def":"Комплекс общих факторов транскрипции (TFIID, TFIIA, TFIIB, TFIIE, TFIIF, TFIIH) и РНК-полимеразы II, собранный на промоторе перед началом синтеза РНК."},{"id":"S9-T18","term":"Белок-активатор транскрипции","section":1,"def":"Регуляторный белок, связывающийся с определённой последовательностью ДНК (часто в энхансере) и ускоряющий сборку преинициаторного комплекса на промоторе — через медиатор и белки, изменяющие хроматин."},{"id":"S9-T19","term":"Энхансер","section":1,"def":"Регуляторный участок ДНК, с которым связываются белки-активаторы; может находиться далеко от промотора, до или после гена, и действует на промотор через сближение участков ДНК."},{"id":"S9-T20","term":"Медиатор","section":1,"def":"Крупный белковый комплекс (более 30 субъединиц), связывающий белки-активаторы с РНК-полимеразой II и общими факторами транскрипции; необходим для активированной транскрипции большинства генов."},{"id":"S9-T21","term":"C-концевой домен РНК-полимеразы II","section":1,"def":"«Хвост» крупнейшей субъединицы РНК-полимеразы II из повторов семи аминокислот (у человека 52 повтора). Фосфорилирование серина 5 сопровождает уход с промотора, серина 2 — элонгацию; фосфорилированный домен связывает факторы кэпирования, сплайсинга и образования 3′-конца."},{"id":"S9-T22","term":"Пауза у промотора","section":1,"def":"Остановка РНК-полимеразы II вскоре после начала синтеза (у животных — после 20–100 нуклеотидов). После паузы полимераза либо переходит к продуктивной элонгации, либо прекращает синтез."},{"id":"S9-T23","term":"Короткая РНК у промотора","section":1,"def":"РНК длиной в десятки нуклеотидов, синтез которой прекратился у промотора после паузы; быстро разрушается в ядре."},{"id":"S9-T24","term":"Место старт-кодона","section":1,"def":"Последовательность ATG в кодирующей цепи (AUG в мРНК), с которой начинается трансляция. Находится после точки начала транскрипции; участок РНК перед ним — 5′-нетранслируемая область."},{"id":"S9-T25","term":"Сигнал полиаденилирования AAUAAA","section":1,"def":"Последовательность пре-мРНК (AATAAA в кодирующей цепи ДНК), которую узнаёт фактор специфичности расщепления и полиаденилирования; в 10–30 нуклеотидах ниже по цепи пре-мРНК разрезается."},{"id":"S9-T26","term":"Место расщепления","section":1,"def":"Место, где пре-мРНК разрезается при образовании 3′-конца; к образовавшемуся 3′-концу присоединяется поли(А)-хвост. Определяет положение 3′-конца мРНК."},{"id":"S9-T27","term":"Терминация транскрипции","section":1,"def":"Завершение синтеза: РНК-полимераза отделяется от ДНК и РНК. У РНК-полимеразы II терминация следует за расщеплением пре-мРНК и происходит ниже места расщепления."},{"id":"S9-T28","term":"5′→3′-экзорибонуклеаза XRN2","section":1,"def":"Фермент, разрушающий РНК от незащищённого 5′-конца. После расщепления пре-мРНК разрушает фрагмент РНК, оставшийся на полимеразе, и способствует терминации; разрушает и РНК, не получившие функционального кэпа, после удаления их 5′-конца другими ферментами."},{"id":"S9-T30","term":"Пре-мРНК (первичный транскрипт)","section":0,"def":"Продукт транскрипции белок-кодирующего гена до завершения процессинга; повторяет организацию гена — содержит экзоны и интроны."},{"id":"S9-T31","term":"Кэп","section":2,"def":"7-метилгуанозин, присоединённый к первому нуклеотиду РНК 5′–5′-трифосфатной связью. Защищает 5′-конец от экзонуклеаз; через кэп-связывающие белки участвует в процессинге, экспорте мРНК и инициации трансляции."},{"id":"S9-T32","term":"Ферменты кэпирования","section":2,"def":"Три фермента, связанные с C-концевым доменом РНК-полимеразы II: РНК-трифосфатаза удаляет концевой фосфат, гуанилилтрансфераза присоединяет ГМФ 5′–5′-связью, метилтрансфераза метилирует гуанин по N7."},{"id":"S9-T34","term":"Экзон","section":3,"def":"Участок гена, последовательность которого сохраняется в зрелой РНК после сплайсинга. Может содержать кодирующую последовательность, нетранслируемую область или то и другое."},{"id":"S9-T35","term":"Интрон","section":2,"def":"Участок гена и пре-мРНК между экзонами, удаляемый при сплайсинге; обычно начинается с GU и заканчивается AG."},{"id":"S9-T36","term":"Сплайсосома","section":2,"def":"Комплекс пяти малых ядерных РНК (U1, U2, U4, U5, U6) и множества белков, который узнаёт границы интронов и удаляет интрон двумя реакциями переэтерификации, соединяя экзоны."},{"id":"S9-T37","term":"Лассо (лариат)","section":2,"def":"Форма, в которой освобождается удалённый интрон: его 5′-конец соединён с аденозином точки ветвления внутри интрона. Затем лассо раскрывается и разрушается."},{"id":"S9-T38","term":"Сайты сплайсинга","section":2,"def":"Последовательности на границах интрона, которые узнаёт сплайсосома: 5′-сайт (начало интрона, GU) и 3′-сайт (конец интрона, AG), а также точка ветвления."},{"id":"S9-T41","term":"Комплекс соединения экзонов","section":2,"def":"Белки, которые сплайсосома оставляет на мРНК рядом с каждым соединением экзонов; отмечают завершённый сплайсинг и участвуют в экспорте и дальнейших этапах."},{"id":"S9-T42","term":"Факторы расщепления и полиаденилирования","section":2,"def":"Белковые комплексы (CPSF узнаёт AAUAAA, CstF — участок ниже места расщепления), которые разрезают пре-мРНК и привлекают поли(А)-полимеразу."},{"id":"S9-T43","term":"Поли(А)-хвост","section":2,"def":"Цепочка адениловых остатков (около 200) на 3′-конце мРНК; её присоединяет поли(А)-полимераза без матрицы, поэтому в гене она не закодирована. Защищает 3′-конец, участвует в экспорте и трансляции."},{"id":"S9-T45","term":"Кодирующая область","section":3,"def":"Участок зрелой мРНК от старт-кодона до стоп-кодона, последовательность кодонов которого задаёт аминокислотную последовательность белка."},{"id":"S9-T47","term":"5′-нетранслируемая область","section":3,"def":"Участок зрелой мРНК от кэпа до старт-кодона; не кодирует аминокислоты. Входит в первый экзон (иногда и в следующие)."},{"id":"S9-T48","term":"3′-нетранслируемая область","section":3,"def":"Участок зрелой мРНК от стоп-кодона до поли(А)-хвоста; не кодирует аминокислоты, содержит последовательности, влияющие на стабильность, локализацию и трансляцию мРНК."},{"id":"S9-T49","term":"Старт-кодон","section":3,"def":"Кодон AUG (ATG в кодирующей цепи), с которого рибосома начинает трансляцию; граница 5′-НТО и кодирующей области."},{"id":"S9-T50","term":"Стоп-кодон","section":3,"def":"Кодон UAA, UAG или UGA, на котором заканчивается трансляция; граница кодирующей области и 3′-НТО."},{"id":"S9-T51","term":"Альтернативный экзон","section":3,"def":"Экзон, который входит в зрелую мРНК не всегда: в одних молекулах пре-мРНК он сохраняется, в других удаляется вместе с соседними интронами."},{"id":"S9-T53","term":"мРНП (матричный рибонуклеопротеид)","section":2,"def":"Комплекс мРНК с белками, присоединившимися при кэпировании, сплайсинге и образовании 3′-конца; в таком виде мРНК экспортируется из ядра."},{"id":"S9-T54","term":"Рецептор экспорта мРНК (NXF1–NXT1)","section":2,"def":"Белок из двух субъединиц, который связывается с мРНП зрелой мРНК и взаимодействует с FG-повторами белков ядерной поры, проводя мРНП в цитоплазму; работает без Ran и без сигнала ядерной локализации. На цитоплазматической стороне поры хеликаза снимает с мРНП часть белков, и обратно в ядро мРНП не возвращается."},{"id":"S9-T55","term":"Ядерная пора","section":2,"def":"Белковый комплекс (ядерный поровый комплекс) в ядерной оболочке, через канал которого идёт обмен макромолекулами между ядром и цитоплазмой; канал заполнен неструктурированными участками белков с FG-повторами."},{"id":"S9-T58","term":"Инициация транскрипции","section":1,"def":"Начальный этап транскрипции: сборка РНК-полимеразы и общих факторов транскрипции на промоторе, расплетание ДНК у точки +1 и синтез первых нуклеотидов РНК."},{"id":"S9-T59","term":"Элонгация транскрипции","section":1,"def":"Этап транскрипции, на котором РНК-полимераза движется вдоль матричной цепи ДНК и удлиняет РНК, присоединяя нуклеотиды к её 3′-концу."},{"id":"S9-T60","term":"Общие факторы транскрипции","section":1,"def":"Белки (TFIID, TFIIA, TFIIB, TFIIE, TFIIF, TFIIH), которые вместе с РНК-полимеразой II собираются на промоторах почти всех генов, транскрибируемых этим ферментом, и необходимы для начала транскрипции."},{"id":"S9-T61","term":"TFIIA","section":1,"def":"Общий фактор транскрипции, который связывается с промотором рядом с TFIID после присоединения TFIID к ДНК."},{"id":"S9-T62","term":"Процессинг пре-мРНК","section":2,"def":"Изменения первичного транскрипта, превращающие его в зрелую мРНК: кэпирование 5′-конца, сплайсинг, расщепление и полиаденилирование 3′-конца."},{"id":"S9-T63","term":"Котранскрипционный процессинг","section":2,"def":"Процессинг пре-мРНК, который идёт во время её синтеза, пока РНК связана с транскрибирующей РНК-полимеразой II."},{"id":"S9-T64","term":"Полиаденилирование","section":2,"def":"Присоединение поли(А)-полимеразой цепочки адениловых остатков к 3′-концу пре-мРНК, образованному расщеплением."},{"id":"S9-T65","term":"Зрелая мРНК","section":2,"def":"мРНК, готовая к выходу из ядра и к трансляции: в составе мРНП выходит из ядра и служит матрицей для трансляции. У мРНК большинства генов, как у гена в моделях семинара, она прошла кэпирование, сплайсинг и образование 3′-конца с поли(А)-хвостом; у генов без интронов сплайсинга нет, а мРНК гистонов, синтезируемых в S-фазе, получают 3′-конец без поли(А)-хвоста."},{"id":"S9-T66","term":"Ядерный экспорт мРНК","section":2,"def":"Перенос зрелой мРНК в составе мРНП из ядра в цитоплазму через ядерные поры при участии рецептора экспорта мРНК (NXF1–NXT1); этот основной путь не зависит от Ran. Часть мРНК может выходить и другим, Ran-зависимым путём."},{"id":"S9-T67","term":"Альтернативный сплайсинг","section":3,"def":"Образование из разных молекул пре-мРНК одной транскрипционной единицы разных зрелых мРНК за счёт выбора разных сайтов сплайсинга: включения или пропуска экзонов, альтернативных 5′- и 3′-сайтов, удержания интронов."}],"sources":{"Alberts2022":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)","doi":"","pmid":""},"Shine2024":{"url":"https://doi.org/10.1038/s41580-024-00706-2","cite":"Shine M., Gordon J., Schärfen L., Zigackova D., Herzel L., Neugebauer K. M. Co-transcriptional gene regulation in eukaryotes and prokaryotes. Nat Rev Mol Cell Biol. 2024;25:534–554","doi":"10.1038/s41580-024-00706-2","pmid":"38509203"},"Petrovic2026":{"url":"https://doi.org/10.1038/s41580-025-00881-w","cite":"Petrovic S., Mobbs G. W., Hoelz A. Structure, function and assembly of nuclear pore complexes. Nat Rev Mol Cell Biol. 2026;27:35–54","doi":"10.1038/s41580-025-00881-w","pmid":"40926106"},"Wiechens2025":{"url":"https://doi.org/10.1038/s41588-024-02025-w","cite":"Wiechens E., Vigliotti F., Siniuk K. et al. Gene regulation by convergent promoters. Nat Genet. 2025;57:206–217","doi":"10.1038/s41588-024-02025-w","pmid":"39779959"},"FischerHoffmann2026":{"url":"https://doi.org/10.1038/s41588-026-02536-8","cite":"Fischer M., Hoffmann S. Transcriptional interference revisited. Nat Genet. 2026;58:974–983","doi":"10.1038/s41588-026-02536-8","pmid":""},"Song2026":{"url":"https://doi.org/10.1038/s41580-026-01005-8","cite":"Song A., Hu M., Chen F. X. Mechanisms of transcription termination across the coding and noncoding loci of the genome. Nat Rev Mol Cell Biol. 2026","doi":"10.1038/s41580-026-01005-8","pmid":""},"Choquet2025":{"url":"https://doi.org/10.1038/s41576-025-00836-z","cite":"Choquet K., Patop I. L., Churchman L. S. The regulation and function of post-transcriptional RNA splicing. Nat Rev Genet. 2025;26:378–394","doi":"10.1038/s41576-025-00836-z","pmid":""},"Schmok2024":{"url":"https://doi.org/10.1038/s41587-023-02014-0","cite":"Schmok J. C., Jain M., Street L. A. et al. Large-scale evaluation of the ability of RNA-binding proteins to activate exon inclusion. Nat Biotechnol. 2024;42:1429–1441","doi":"10.1038/s41587-023-02014-0","pmid":"38168984"}},"questions":["Матричная и кодирующая цепи","Инициация, элонгация, терминация","Процессинг и экспорт","Альтернативный сплайсинг"],"exam_ids":["transcription-unit","template-coding","orientation","pic-assembly","escape-elongation","termination","capping","three-prime-end","export","exon-utr","alternative-splicing","what-changes"],"practice_url":"seminar-9.html","open_questions":[]};
/* Объяснения к семинару 9. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => s.replace(/(шаге? )?БИО-9·(\d+)((?:, 9·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
const rt = s => stepRefs(esc(s)).replace(/\[\[(T\d{2,3})\|([^\]]+)\]\]/g, (_, id, t) => `<a class="gl" href="#glossary-S9-${id}" data-gloss="S9-${id}">${t}</a>`)
  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */
const ncap = s => esc(s).replace(/Ca(?=²⁺)/g, '<span style="text-transform:none">Ca</span>');
const plain = s => String(s).replace(/\[\[(T\d{2,3}|https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, '$2');

/* ---------- хранение: один ключ, шаги и итоговая проверка раздельно ---------- */
const KEY = 'bio-s9-explanations-v1-progress';
let store = {v: 1, steps: {}, exam: {}}, state = {}, current = 'home';
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.v === 1) store = {v: 1, steps: raw.steps || {}, exam: raw.exam || {}, last: raw.last || null};
} catch (e) {}
/* ревизия вопроса (quiz.rev, по умолчанию 1): после содержательной правки вопроса rev увеличивают, и прежняя отметка не засчитывается;
   записи шагов, которых больше нет, не учитываются. Записи без rev считаются rev 1 — прежний прогресс сохраняется. */
const qrev = l => l.quiz.rev || 1;
(function () {
  const cur = {}; CONTENT.lessons.forEach(l => { cur[l.id] = qrev(l); });
  ['steps', 'exam'].forEach(k => Object.keys(store[k]).forEach(id => { const r = store[k][id]; if (!(id in cur) || !r || (r.rev || 1) !== cur[id]) delete store[k][id]; }));
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} renderNav(); };
/* v1.8: запоминаем, где читатель остановился. iPhone и встроенные браузеры при возврате в приложение перезагружают страницу по исходному адресу
   (без #шаг) — раньше после этого открывалась начальная страница, а шаг приходилось искать заново. Теперь шаг и положение прокрутки восстанавливаются
   (если прошло меньше 14 дней); кнопка начальной страницы в шапке по-прежнему открывает начало. */
const LAST_TTL = 14 * 24 * 3600 * 1000;
/* пишется только поле last в свежих данных хранилища: так запись положения не затирает прогресс, изменённый в другой вкладке или сброшенный */
const saveLast = (id, y) => { store.last = {id: id, y: y || 0, t: Date.now()}; try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); const base = raw && raw.v === 1 ? raw : {v: 1, steps: {}, exam: {}}; base.last = store.last; localStorage.setItem(KEY, JSON.stringify(base)); } catch (e) {} };
const rememberScroll = () => { if (store.last) saveLast(store.last.id, Math.round(window.scrollY || 0)); };
let scrollTimer = 0;
window.addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(rememberScroll, 250); }, {passive: true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') rememberScroll(); });
window.addEventListener('pagehide', rememberScroll);
const lessonById = id => CONTENT.lessons.find(x => x.id === id);
const lessonIndex = id => CONTENT.lessons.findIndex(x => x.id === id);
const stepsDone = () => CONTENT.lessons.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;

/* ---------- порядок вариантов: перемешивается при открытии страницы; ?fixed — постоянный порядок ---------- */
const params = new URLSearchParams(location.search);
const FIXQ = params.has('fixed') ? '?fixed' : '';  /* каркас с 23.10.2026 (из сем. 7 v3.8, аудит A09): ссылки на практикум сохраняют ?fixed */
const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');
const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => { const k = l.quiz.id || l.id; return ORDER[k] || (ORDER[k] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id)); };   /* семинар 9, v1.1: порядок — по id вопроса (у итоговой проверки свои вопросы) */
const optById = (l, id) => l.quiz.options.find(o => o.id === id);
const EXAM_IDS = SHUFFLE ? shuffled(CONTENT.exam_ids) : CONTENT.exam_ids.slice();
const LETTERS = ['А', 'Б', 'В'];

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {
  const lines = String(label).split('\n'), lh = size * 1.2, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};
const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;
const slider = (id, label, min, max, value, step = 1, unit = '') => `<label for="${id}">${esc(label)}<output id="${id}-value">${value}${unit}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" data-unit="${esc(unit)}"></label>`;

const check = (id, label, on) => `<label class="chk" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> <span>${esc(label)}</span></label>`;
const metric = (label, value) => `<div>${esc(label)}<strong>${esc(value)}</strong></div>`;
const result = s => `<div class="result">${s}</div>`;
const tbl = (head, rows, cls = '') => `<div class="table-scroll"><table class="${cls}"><thead><tr>${head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);

function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');
    d += rect(x0, y, W, 26, '#eef3f7', 6, 'stroke="#c8d6e2"');
    if (r.v >= 0) d += rect(x0, y, W * (r.v / 3), 26, r.cls === 'warn' ? '#c3662f' : '#145c96', 6, r.v === 0 ? 'opacity=".0"' : '');
    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

/* ---------- оглавление ---------- */
const hay = l => [l.title, l.lead.join(' '), l.paragraphs.map(p => typeof p === 'string' ? p : p.h || ((p.details || '') + ' ' + (p.text || ''))).join(' '), l.quiz.question, ...(l.keywords || [])].join(' ').toLowerCase();
function renderNav() {

  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  const BL = CONTENT.lessons.filter(l => l.level !== 'adv'), nb = BL.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;   /* базовые шаги (курс «Биология», А1-22) */
  let html = `<div class="progress">${esc(U.progress_label)}: <b>${n} ${esc(U.of)} ${N}</b><progress value="${n}" max="${N}" aria-label="${esc(U.progress_label)}"></progress>` +
    `<div class="exam-stat">${esc(U.exam_stat_label)}: <b>${exOk} ${esc(U.of)} ${CONTENT.exam_ids.length}</b>${exTries ? ` · ${esc(fmt(U.exam_tries, {n: exTries}))}` : ''}</div>` +
    (U.base_progress && BL.length < N ? `<div class="base-stat">${esc(U.base_progress)}: <b>${nb} ${esc(U.of)} ${BL.length}</b></div>` : '') +
    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {
    const ls = CONTENT.lessons.filter(l => l.section === i && (!q || hay(l).includes(q)));
    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${ncap(s.title)}</div>` + ls.map(l => {
      const done = store.steps[l.id] && store.steps[l.id].correct;
      return `<button data-nav="${l.id}" class="${l.id === current ? 'active' : ''}"${l.id === current ? ' aria-current="page"' : ''}><span class="tick" aria-hidden="true">${done ? '✓' : '○'}</span><span class="sr">${esc(done ? U.done : U.notdone)}: </span>${esc(l.title)}${l.level === 'adv' && U.adv_badge ? ` <span class="lvl">${esc(U.adv_badge)}</span>` : ''}</button>`;
    }).join('');
  });
  if (q && !any) html += `<p class="empty">${esc(U.no_match)}</p>`;
  $('nav').innerHTML = html;
  $('nav').querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
  const r = $('reset-progress'); if (r) r.onclick = () => { store = {v: 1, steps: {}, exam: {}}; save(); if (current === 'exam') renderExam(); else if (lessonById(current)) renderLesson(lessonById(current)); };
}
function navigate(id) {
  let target = id, anchor = '';
  if (id.indexOf('glossary-') === 0) { anchor = id.slice(9); target = 'glossary'; }
  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  saveLast(want, 0);
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);
  else if (target === 'exam') renderExam(); else if (target === 'all') renderAll(); else renderLesson(lessonById(target));
  if (anchor) { const el = $('g-' + anchor); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
  else window.scrollTo({top: 0, behavior: 'instant'});
  if (!anchor) $('main').focus({preventScroll: true});
  document.title = (lessonById(target) ? lessonById(target).title + ' — ' : '') + U.page_title;
}

    `<ul class="src-list">${l.sources.map(k => { const s = CONTENT.sources[k]; return s.url ? `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)} ↗</a></li>` : `<li>${esc(s.cite)}</li>`; }).join('')}</ul>` +
    `<p>${rt(l.conditions)}</p></details>`;
}
function quizHtml(l, scope = 'quiz') {
  const q = l.quiz, ord = optionOrder(l);

  return `<section class="quiz" id="${scope}-${l.id}" aria-labelledby="${scope}-${l.id}-q"><div class="eyebrow">${esc(U.quiz_eyebrow)}</div><h3 id="${scope}-${l.id}-q">${rt(q.question)}</h3>` +

    `<div class="quiz-feedback" aria-live="polite">${done ? `<p class="quiet">${esc(U.quiz_done_before)}</p>` : ''}</div></section>`;

function bindQuiz(l, scope = 'quiz') {
  const boxEl = $(`${scope}-${l.id}`); let last = null;
  boxEl.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
    const id = b.dataset.answer, o = optById(l, id), ok = !!o.correct;
    boxEl.querySelectorAll('[data-answer]').forEach(x => { x.classList.remove('correct', 'wrong'); x.setAttribute('aria-pressed', String(x === b)); });
    b.classList.add(ok ? 'correct' : 'wrong');
    boxEl.querySelector('.quiz-feedback').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${esc(ok ? U.fb_ok : U.fb_bad)}</strong> ${rt(o.feedback)}` +
      (scope === 'exam' ? `<p><button data-return="${l.id}">${esc(U.open_expl)}</button></p>` : '') + `</div>`;
    const rec = (scope === 'exam' ? store.exam : store.steps);
    const r = rec[l.id] || (rec[l.id] = {attempts: 0, first: null, correct: false, rev: qrev(l)});
    if (last !== id) { r.attempts = (r.attempts || 0) + 1; if (r.first === null) r.first = ok; }
    last = id;

}

  bindQuiz(l); initWidget(l);
  /* каркас с 23.10.2026 (из сем. 9; включается ключами ui.zoom_in/zoom_out/zoom_area, как «Увеличить схему» в практикумах): на телефоне схему можно увеличить и прокручивать в её рамке */

  /* схема на телефоне увеличена по умолчанию, если шаг просит (w.zoomNarrow): подписи читаются без ручного увеличения */

}
function initWidget(l) {
  const w = l.widget, fn = W[w.kind], s = state[l.id] || (state[l.id] = {});
  if (!fn) { $('widget-title').textContent = w.title; return; }
  const set = (title, status, controls) => { $('widget-title').textContent = title; $('widget-status').textContent = status; $('widget-controls').innerHTML = controls; };
  const out = (drawing, text) => { $('widget-drawing').innerHTML = drawing; $('widget-result').innerHTML = text; };
  const onRange = (id, f) => { $(id).oninput = () => { $(id + '-value').textContent = $(id).value + ($(id).dataset.unit || ''); f(Number($(id).value)); }; };
