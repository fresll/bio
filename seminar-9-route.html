е означает изменения ДНК: так действует и альтернативный сплайсинг. Изменение ДНК устанавливают, сравнивая последовательность гена.</p><p>Общий принцип семинара: транскрипция, процессинг пре-мРНК, образование зрелой мРНК и её экспорт — связанные, но разные процессы, и количество и состав зрелой мРНК не определяются одним фактом инициации транскрипции.</p><div class="static-quiz"><h3>По сравнению с нормой число начатых синтезов, пре-мРНК в ядре и мРНК в цитоплазме меньше примерно в одно и то же число раз, доля коротких РНК у промотора прежняя. На каком этапе изменение?</h3><ol><li><b>А.</b> На инициации: синтез начинается реже <i>(верный вариант)</i><br><span class="expl">Ни один промежуточный продукт не накапливается — уменьшено поступление молекул на первом этапе.</span></li><li><b>Б.</b> На экспорте мРНП из ядра <i>(неверный вариант)</i><br><span class="expl">Тогда зрелая мРНК накапливалась бы в ядре, а число начатых синтезов не изменилось бы.</span></li><li><b>В.</b> На сплайсинге <i>(неверный вариант)</i><br><span class="expl">Тогда накапливалась бы пре-мРНК, а число начатых синтезов осталось бы прежним.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-9.html#q1">Вопрос 1 →</a> <a href="seminar-9.html#q2">Вопрос 2 →</a> <a href="seminar-9.html#q3">Вопрос 3 →</a> <a href="seminar-9.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Мысленная задача по моделям вкладок 2–4; числа в вопросе условные.</p></details></article><article class="card print-unit" id="ns-exit-to-translation"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 26 из 26</div><h2>Что дальше: зрелая мРНК — матрица трансляции</h2><p class="lead">Зрелая мРНК в цитоплазме — с кэпом, кодирующей областью между нетранслируемыми и поли(А)-хвостом — готова служить матрицей. Как рибосома синтезирует по ней белок — тема следующего семинара.</p><div class="note"><strong>Что показывает схема.</strong> Кэп, 5′-НТО, кодирующая область, 3′-НТО, поли(А).</div><ol class="mech"><li>Кэп и поли(А)-хвост участвуют в инициации трансляции.</li><li>Трансляция начинается со старт-кодона — не с точки начала транскрипции: 5′-НТО рибосома проходит, не синтезируя белок.</li><li>Последовательность кодонов кодирующей области определяет последовательность аминокислот белка.</li><li>Изменения нетранслируемых областей не меняют последовательности белка, но могут влиять на количество мРНК и белка (семинар 11).</li></ol><p>В семинаре 10 — генетический код, рамка считывания и то, что происходит, если в мРНК изменена длина кодирующего участка: тогда станет понятно, почему пропуск экзона, длина которого не кратна трём, меняет белок сильнее.</p><p>Регуляция количества мРНК и выбора её вариантов — семинар 11 и курс «Молекулярная биология».</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Чем различаются энхансер и промотор — <a href="https://fresll.github.io/molbio/seminar-6-route.html#enhancer">МБ, семинар 6, шаг 9</a>; как факторы и коактиваторы связывают контакт энхансера с транскрипцией — <a href="https://fresll.github.io/molbio/seminar-6-route.html#coactivators">МБ, семинар 6, шаг 12</a>; нарушение сайта сплайсинга, время жизни мРНК и нонсенс-опосредованный распад мРНК — МБ, семинар 13 (в разработке).</p><div class="static-quiz"><h3>С какого места мРНК рибосома начинает синтез белка?</h3><ol><li><b>А.</b> С первого нуклеотида после кэпа <i>(неверный вариант)</i><br><span class="expl">Начало мРНК — 5′-НТО, она не транслируется.</span></li><li><b>Б.</b> Со старт-кодона AUG <i>(верный вариант)</i><br><span class="expl">Трансляция начинается со старт-кодона; участок до него — 5′-НТО.</span></li><li><b>В.</b> С точки +1 на ДНК <i>(неверный вариант)</i><br><span class="expl">Точка +1 — начало транскрипции на ДНК, а трансляция идёт на мРНК.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-9.html#q1">Вопрос 1 →</a> <a href="seminar-9.html#q2">Вопрос 2 →</a> <a href="seminar-9.html#q3">Вопрос 3 →</a> <a href="seminar-9.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Переход к следующему семинару; подробности — в семинарах 10–11.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S9-T01"><dt>Транскрипция</dt><dd>Синтез РНК на матрице ДНК, который осуществляет ДНК-зависимая РНК-полимераза. РНК удлиняется от 5′- к 3′-концу и комплементарна матричной цепи ДНК.</dd></div><div id="ns-g-S9-T02"><dt>Транскрипционная единица</dt><dd>Участок ДНК, с которого синтезируется определённая РНК (первичный транскрипт): от точки начала транскрипции до области терминации. Её транскрипцию обеспечивает промотор, расположенный у начала единицы и задающий направление синтеза; сам промотор в общем случае не транскрибируется.</dd></div><div id="ns-g-S9-T03"><dt>Матричная цепь ДНК</dt><dd>Цепь ДНК, комплементарная синтезируемой РНК и антипараллельная ей; РНК-полимераза движется вдоль неё в направлении 3′→5′. Какая цепь станет матричной, зависит от ориентации конкретной транскрипционной единицы.</dd></div><div id="ns-g-S9-T04"><dt>Кодирующая цепь ДНК</dt><dd>Цепь ДНК, комплементарная матричной; её последовательность, прочитанная от 5′ к 3′, совпадает с последовательностью РНК, если T заменить на U. Последовательности генов принято записывать по кодирующей цепи.</dd></div><div id="ns-g-S9-T07"><dt>РНК-полимераза II</dt><dd>Фермент ядра эукариот, который транскрибирует белок-кодирующие гены (и гены многих некодирующих РНК). Не узнаёт промотор сама: её привлекают общие факторы транскрипции. Имеет C-концевой домен, с которым связываются факторы процессинга.</dd></div><div id="ns-g-S9-T08"><dt>Промотор</dt><dd>Участок ДНК у начала транскрипционной единицы, с которым связываются общие факторы транскрипции и РНК-полимераза; задаёт точку начала транскрипции и её направление, а тем самым — какая цепь станет матричной.</dd></div><div id="ns-g-S9-T09"><dt>Точка начала транскрипции (+1)</dt><dd>Нуклеотид ДНК, против которого стоит первый нуклеотид РНК. Нуклеотиды, расположенные перед ней, обозначают отрицательными номерами, после неё — положительными. Не совпадает со старт-кодоном.</dd></div><div id="ns-g-S9-T10"><dt>TATA-бокс</dt><dd>Последовательность, богатая A и T, примерно за 30 нуклеотидов до точки начала транскрипции у части промоторов РНК-полимеразы II; её узнаёт TATA-связывающий белок в составе TFIID. Есть не у всех промоторов.</dd></div><div id="ns-g-S9-T11"><dt>Инициаторный элемент (Inr) и нижележащий элемент промотора (DPE)</dt><dd>Последовательности промотора РНК-полимеразы II у точки +1 (Inr) и после неё (DPE), которые узнают субъединицы TFIID; у промоторов без TATA-бокса задают положение начала транскрипции.</dd></div><div id="ns-g-S9-T12"><dt>TFIID</dt><dd>Общий фактор транскрипции из TATA-связывающего белка и связанных с ним субъединиц (TAF). Первым связывается с промотором — с TATA-боксом или другими его элементами — и начинает сборку преинициаторного комплекса.</dd></div><div id="ns-g-S9-T13"><dt>TFIIB</dt><dd>Общий фактор транскрипции, связывающийся рядом с TATA-связывающим белком; ориентирует РНК-полимеразу II на промоторе и тем самым задаёт направление транскрипции.</dd></div><div id="ns-g-S9-T14"><dt>TFIIF</dt><dd>Общий фактор транскрипции, который присоединяется вместе с РНК-полимеразой II и стабилизирует её связь с TFIIB и TBP; привлекает TFIIE и TFIIH.</dd></div><div id="ns-g-S9-T15"><dt>TFIIE</dt><dd>Общий фактор транскрипции, который привлекает TFIIH к преинициаторному комплексу и регулирует его.</dd></div><div id="ns-g-S9-T16"><dt>TFIIH</dt><dd>Общий фактор транскрипции с хеликазной и киназной активностями: расплетает ДНК у точки начала транскрипции и фосфорилирует серин 5 повторов C-концевого домена РНК-полимеразы II, освобождая её от промотора. Участвует также в репарации ДНК.</dd></div><div id="ns-g-S9-T17"><dt>Преинициаторный комплекс</dt><dd>Комплекс общих факторов транскрипции (TFIID, TFIIA, TFIIB, TFIIE, TFIIF, TFIIH) и РНК-полимеразы II, собранный на промоторе перед началом синтеза РНК.</dd></div><div id="ns-g-S9-T18"><dt>Белок-активатор транскрипции</dt><dd>Регуляторный белок, связывающийся с определённой последовательностью ДНК (часто в энхансере) и ускоряющий сборку преинициаторного комплекса на промоторе — через медиатор и белки, изменяющие хроматин.</dd></div><div id="ns-g-S9-T19"><dt>Энхансер</dt><dd>Регуляторный участок ДНК, с которым связываются белки-активаторы; может находиться далеко от промотора, до или после гена, и действует на промотор через сближение участков ДНК.</dd></div><div id="ns-g-S9-T20"><dt>Медиатор</dt><dd>Крупный белковый комплекс (более 30 субъединиц), связывающий белки-активаторы с РНК-полимеразой II и общими факторами транскрипции; необходим для активированной транскрипции большинства генов.</dd></div><div id="ns-g-S9-T21"><dt>C-концевой домен РНК-полимеразы II</dt><dd>«Хвост» крупнейшей субъединицы РНК-полимеразы II из повторов семи аминокислот (у человека 52 повтора). Фосфорилирование серина 5 сопровождает уход с промотора, серина 2 — элонгацию; фосфорилированный домен связывает факторы кэпирования, сплайсинга и образования 3′-конца.</dd></div><div id="ns-g-S9-T22"><dt>Пауза у промотора</dt><dd>Остановка РНК-полимеразы II вскоре после начала синтеза (у животных — после 20–100 нуклеотидов). После паузы полимераза либо переходит к продуктивной элонгации, либо прекращает синтез.</dd></div><div id="ns-g-S9-T23"><dt>Короткая РНК у промотора</dt><dd>РНК длиной в десятки нуклеотидов, синтез которой прекратился у промотора после паузы; быстро разрушается в ядре.</dd></div><div id="ns-g-S9-T24"><dt>Место старт-кодона</dt><dd>Последовательность ATG в кодирующей цепи (AUG в мРНК), с которой начинается трансляция. Находится после точки начала транскрипции; участок РНК перед ним — 5′-нетранслируемая область.</dd></div><div id="ns-g-S9-T25"><dt>Сигнал полиаденилирования AAUAAA</dt><dd>Последовательность пре-мРНК (AATAAA в кодирующей цепи ДНК), которую узнаёт фактор специфичности расщепления и полиаденилирования; в 10–30 нуклеотидах ниже по цепи пре-мРНК разрезается.</dd></div><div id="ns-g-S9-T26"><dt>Место расщепления</dt><dd>Место, где пре-мРНК разрезается при образовании 3′-конца; к образовавшемуся 3′-концу присоединяется поли(А)-хвост. Определяет положение 3′-конца мРНК.</dd></div><div id="ns-g-S9-T27"><dt>Терминация транскрипции</dt><dd>Завершение синтеза: РНК-полимераза отделяется от ДНК и РНК. У РНК-полимеразы II терминация следует за расщеплением пре-мРНК и происходит ниже места расщепления.</dd></div><div id="ns-g-S9-T28"><dt>5′→3′-экзорибонуклеаза XRN2</dt><dd>Фермент, разрушающий РНК от незащищённого 5′-конца. После расщепления пре-мРНК разрушает фрагмент РНК, оставшийся на полимеразе, и способствует терминации; разрушает и РНК, не получившие функционального кэпа, после удаления их 5′-конца другими ферментами.</dd></div><div id="ns-g-S9-T30"><dt>Пре-мРНК (первичный транскрипт)</dt><dd>Продукт транскрипции белок-кодирующего гена до завершения процессинга; повторяет организацию гена — содержит экзоны и интроны.</dd></div><div id="ns-g-S9-T31"><dt>Кэп</dt><dd>7-метилгуанозин, присоединённый к первому нуклеотиду РНК 5′–5′-трифосфатной связью. Защищает 5′-конец от экзонуклеаз; через кэп-связывающие белки участвует в процессинге, экспорте мРНК и инициации трансляции.</dd></div><div id="ns-g-S9-T32"><dt>Ферменты кэпирования</dt><dd>Три фермента, связанные с C-концевым доменом РНК-полимеразы II: РНК-трифосфатаза удаляет концевой фосфат, гуанилилтрансфераза присоединяет ГМФ 5′–5′-связью, метилтрансфераза метилирует гуанин по N7.</dd></div><div id="ns-g-S9-T34"><dt>Экзон</dt><dd>Участок гена, последовательность которого сохраняется в зрелой РНК после сплайсинга. Может содержать кодирующую последовательность, нетранслируемую область или то и другое.</dd></div><div id="ns-g-S9-T35"><dt>Интрон</dt><dd>Участок гена и пре-мРНК между экзонами, удаляемый при сплайсинге; обычно начинается с GU и заканчивается AG.</dd></div><div id="ns-g-S9-T36"><dt>Сплайсосома</dt><dd>Комплекс пяти малых ядерных РНК (U1, U2, U4, U5, U6) и множества белков, который узнаёт границы интронов и удаляет интрон двумя реакциями переэтерификации, соединяя экзоны.</dd></div><div id="ns-g-S9-T37"><dt>Лассо (лариат)</dt><dd>Форма, в которой освобождается удалённый интрон: его 5′-конец соединён с аденозином точки ветвления внутри интрона. Затем лассо раскрывается и разрушается.</dd></div><div id="ns-g-S9-T38"><dt>Сайты сплайсинга</dt><dd>Последовательности на границах интрона, которые узнаёт сплайсосома: 5′-сайт (начало интрона, GU) и 3′-сайт (конец интрона, AG), а также точка ветвления.</dd></div><div id="ns-g-S9-T41"><dt>Комплекс соединения экзонов</dt><dd>Белки, которые сплайсосома оставляет на мРНК рядом с каждым соединением экзонов; отмечают завершённый сплайсинг и участвуют в экспорте и дальнейших этапах.</dd></div><div id="ns-g-S9-T42"><dt>Факторы расщепления и полиаденилирования</dt><dd>Белковые комплексы (CPSF узнаёт AAUAAA, CstF — участок ниже места расщепления), которые разрезают пре-мРНК и привлекают поли(А)-полимеразу.</dd></div><div id="ns-g-S9-T43"><dt>Поли(А)-хвост</dt><dd>Цепочка адениловых остатков (около 200) на 3′-конце мРНК; её присоединяет поли(А)-полимераза без матрицы, поэтому в гене она не закодирована. Защищает 3′-конец, участвует в экспорте и трансляции.</dd></div><div id="ns-g-S9-T45"><dt>Кодирующая область</dt><dd>Участок зрелой мРНК от старт-кодона до стоп-кодона, последовательность кодонов которого задаёт аминокислотную последовательность белка.</dd></div><div id="ns-g-S9-T47"><dt>5′-нетранслируемая область</dt><dd>Участок зрелой мРНК от кэпа до старт-кодона; не кодирует аминокислоты. Входит в первый экзон (иногда и в следующие).</dd></div><div id="ns-g-S9-T48"><dt>3′-нетранслируемая область</dt><dd>Участок зрелой мРНК от стоп-кодона до поли(А)-хвоста; не кодирует аминокислоты, содержит последовательности, влияющие на стабильность, локализацию и трансляцию мРНК.</dd></div><div id="ns-g-S9-T49"><dt>Старт-кодон</dt><dd>Кодон AUG (ATG в кодирующей цепи), с которого рибосома начинает трансляцию; граница 5′-НТО и кодирующей области.</dd></div><div id="ns-g-S9-T50"><dt>Стоп-кодон</dt><dd>Кодон UAA, UAG или UGA, на котором заканчивается трансляция; граница кодирующей области и 3′-НТО.</dd></div><div id="ns-g-S9-T51"><dt>Альтернативный экзон</dt><dd>Экзон, который входит в зрелую мРНК не всегда: в одних молекулах пре-мРНК он сохраняется, в других удаляется вместе с соседними интронами.</dd></div><div id="ns-g-S9-T53"><dt>мРНП (матричный рибонуклеопротеид)</dt><dd>Комплекс мРНК с белками, присоединившимися при кэпировании, сплайсинге и образовании 3′-конца; в таком виде мРНК экспортируется из ядра.</dd></div><div id="ns-g-S9-T54"><dt>Рецептор экспорта мРНК (NXF1–NXT1)</dt><dd>Белок из двух субъединиц, который связывается с мРНП зрелой мРНК и взаимодействует с FG-повторами белков ядерной поры, проводя мРНП в цитоплазму; работает без Ran и без сигнала ядерной локализации. На цитоплазматической стороне поры хеликаза снимает с мРНП часть белков, и обратно в ядро мРНП не возвращается.</dd></div><div id="ns-g-S9-T55"><dt>Ядерная пора</dt><dd>Белковый комплекс (ядерный поровый комплекс) в ядерной оболочке, через канал которого идёт обмен макромолекулами между ядром и цитоплазмой; канал заполнен неструктурированными участками белков с FG-повторами.</dd></div><div id="ns-g-S9-T58"><dt>Инициация транскрипции</dt><dd>Начальный этап транскрипции: сборка РНК-полимеразы и общих факторов транскрипции на промоторе, расплетание ДНК у точки +1 и синтез первых нуклеотидов РНК.</dd></div><div id="ns-g-S9-T59"><dt>Элонгация транскрипции</dt><dd>Этап транскрипции, на котором РНК-полимераза движется вдоль матричной цепи ДНК и удлиняет РНК, присоединяя нуклеотиды к её 3′-концу.</dd></div><div id="ns-g-S9-T60"><dt>Общие факторы транскрипции</dt><dd>Белки (TFIID, TFIIA, TFIIB, TFIIE, TFIIF, TFIIH), которые вместе с РНК-полимеразой II собираются на промоторах почти всех генов, транскрибируемых этим ферментом, и необходимы для начала транскрипции.</dd></div><div id="ns-g-S9-T61"><dt>TFIIA</dt><dd>Общий фактор транскрипции, который связывается с промотором рядом с TFIID после присоединения TFIID к ДНК.</dd></div><div id="ns-g-S9-T62"><dt>Процессинг пре-мРНК</dt><dd>Изменения первичного транскрипта, превращающие его в зрелую мРНК: кэпирование 5′-конца, сплайсинг, расщепление и полиаденилирование 3′-конца.</dd></div><div id="ns-g-S9-T63"><dt>Котранскрипционный процессинг</dt><dd>Процессинг пре-мРНК, который идёт во время её синтеза, пока РНК связана с транскрибирующей РНК-полимеразой II.</dd></div><div id="ns-g-S9-T64"><dt>Полиаденилирование</dt><dd>Присоединение поли(А)-полимеразой цепочки адениловых остатков к 3′-концу пре-мРНК, образованному расщеплением.</dd></div><div id="ns-g-S9-T65"><dt>Зрелая мРНК</dt><dd>мРНК, готовая к выходу из ядра и к трансляции: в составе мРНП выходит из ядра и служит матрицей для трансляции. У мРНК большинства генов, как у гена в моделях семинара, она прошла кэпирование, сплайсинг и образование 3′-конца с поли(А)-хвостом; у генов без интронов сплайсинга нет, а мРНК гистонов, синтезируемых в S-фазе, получают 3′-конец без поли(А)-хвоста.</dd></div><div id="ns-g-S9-T66"><dt>Ядерный экспорт мРНК</dt><dd>Перенос зрелой мРНК в составе мРНП из ядра в цитоплазму через ядерные поры при участии рецептора экспорта мРНК (NXF1–NXT1); этот основной путь не зависит от Ran. Часть мРНК может выходить и другим, Ran-зависимым путём.</dd></div><div id="ns-g-S9-T67"><dt>Альтернативный сплайсинг</dt><dd>Образование из разных молекул пре-мРНК одной транскрипционной единицы разных зрелых мРНК за счёт выбора разных сайтов сплайсинга: включения или пропуска экзонов, альтернативных 5′- и 3′-сайтов, удержания интронов.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 9 · Транскрипция и процессинг пре-мРНК: от транскрипционной единицы к зрелой мРНК — объяснения","home_eyebrow":"Семинар 9 · самостоятельная подготовка","home_h1":"Транскрипция и процессинг пре-мРНК:\nот транскрипционной единицы к зрелой мРНК","home_lead":"Транскрипция, процессинг пре-мРНК и ядерный экспорт — связанные, но разные процессы. От того, какая цепь ДНК служит матрицей, — к тому, как начинается и заканчивается синтез РНК, как пре-мРНК созревает во время транскрипции и почему одна транскрипционная единица даёт разные зрелые мРНК.","start":"Начать с матричной и кодирующей цепей →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"8 сценариев (по одному на каждый вопрос 1–4 на базовом и продвинутом уровне): предсказание, вмешательство и разбор каждого ответа. Пройдите их после объяснений раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 1.2.2, 14 ноября 2026 г. · Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры","footer_lesson":"Версия 1.2. практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Переключатели показывают предсказания учебной модели, а не доказательство: её правила заданы заранее, а основания и границы правил — в шагах «Объяснений»; условия и ограничения указаны в подписи каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Сводная задача использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Транскрипция и процессинг пре-мРНК: от транскрипционной единицы к зрелой мРНК","stats":[["4 вопроса","цепи ДНК, начало и конец транскрипции, процессинг и экспорт, альтернативный сплайсинг"],["Объяснения","с вопросами для самопроверки"],["2 уровня","базовый — к коллоквиуму и зачёту, продвинутый — системные исследования сверх программы"]],"num_fmt":"БИО-9·{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Все семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →"},"lessons":[{"id":"transcription-unit","section":0,"questions":[1],"title":"Транскрипция и транскрипционная единица","keywords":["транскрипция","транскрипционная единица","промотор","точка начала транскрипции","первичный транскрипт"],"lead":["Уже известно: две цепи ДНК комплементарны и антипараллельны, и каждая может служить матрицей ([[https://fresll.github.io/bio/seminar-7-route.html#double-helix|вспомнить БИО-7·2]]); изменение последовательности ДНК копируется в РНК, если находится в транскрибируемом участке ([[https://fresll.github.io/bio/seminar-8-route.html#exit-to-gene|вспомнить БИО-8·26]]).","Новое: при транскрипции копируется не весь геном и не обе цепи, а определённый участок одной цепи.","Раздел относится к вопросу 8 коллоквиума 2 (предварительный список) и вопросу 19 зачёта."],"mechanism":["[[T01|Транскрипция]] — синтез РНК на матрице ДНК; его осуществляет ДНК-зависимая РНК-полимераза. Матричная ДНК при этом не изменяется.","[[T02|Транскрипционная единица]] — участок ДНК, с которого синтезируется определённая РНК: от точки начала транскрипции до области терминации. Её транскрипцию обеспечивает [[T08|промотор]], расположенный у начала единицы и задающий направление синтеза.","Нуклеотид ДНК, против которого стоит первый нуклеотид РНК, — [[T09|точка начала транскрипции]] (+1).","РНК, синтезированная с транскрипционной единицы, — первичный транскрипт; у белок-кодирующих генов эукариот это [[T30|пре-мРНК]], которая ещё пройдёт процессинг (раздел 3)."],"paragraphs":["В отличие от репликации, транскрибируется лишь часть генома, и многие участки — многократно: с активного гена одна молекула РНК-полимеразы может начинать синтез, пока предыдущая ещё не закончила. Поэтому с одного гена образуется множество одинаковых молекул РНК.","Ошибки транскрипции случаются чаще, чем ошибки репликации (у РНК-полимеразы — около одной на 10⁴ нуклеотидов), но затрагивают только одну молекулу РНК и не передаются дочерним клеткам.","РНК-полимеразе не нужна затравка: она начинает новую цепь сама, присоединяя рибонуклеотиды по матрице."],"conditions":"Схема шага — модель вкладки 1: участок ДНК 12 пар нуклеотидов, последовательность условная.","sources":["Alberts2022"],"quiz":{"id":"S9-L01","question":"Чем транскрипция отличается от репликации ДНК?","options":[{"id":"S9-L01-1","text":"Копируется участок одной цепи — транскрипционная единица, а продуктом служит РНК","correct":true,"feedback":"При транскрипции матрицей служит одна цепь определённого участка, а синтезируется РНК; при репликации копируются обе цепи всего генома."},{"id":"S9-L01-2","text":"Копируются обе цепи всего генома, но из рибонуклеотидов","correct":false,"feedback":"Обе цепи всего генома копируются при репликации; транскрипция считывает отдельные участки одной цепи."},{"id":"S9-L01-3","text":"Для начала синтеза нужна РНК-затравка, как у ДНК-полимеразы","correct":false,"feedback":"РНК-полимераза начинает цепь без затравки; затравка нужна ДНК-полимеразе."}]},"widget":{"kind":"dna","title":"","s":{"title":"Участок ДНК и синтезируемая РНК","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["промотор слева","промотор справа"],"scene":"s1b","args":[["+","top"],["-","bot"]],"L":{"s1_dir":"Транскрипционная единица","s1_dir_r":"промотор слева, синтез вправо","s1_dir_l":"промотор справа, синтез влево","s1_cmp":"С РНК сравнивается цепь ДНК","s1_cmp_top":"верхняя","s1_cmp_bot":"нижняя","s1_ctrl_note":"Участок ДНК один и тот же; меняется только положение промотора, то есть ориентация транскрипционной единицы. Верхняя цепь записана от 5′ к 3′ слева направо, нижняя — от 3′ к 5′. Последовательность условная.","s1_pA":"А. Участок ДНК и синтезируемая РНК","s1_pA_mask":"А. Другой участок ДНК (12 п. н.): промотор и направление синтеза не показаны","s1_pB":"Б. РНК от 5′ к 3′ и цепь ДНК, прочитанная в том же направлении","s1_lbl_prom":"промотор","s1_lbl_dir":"направление синтеза РНК","s1_lbl_rna":"РНК","s1_lbl_cmp_top":"верхняя цепь","s1_lbl_cmp_bot":"нижняя цепь","s1_lbl_same":"совпадает с РНК, если T заменить на U: это кодирующая цепь","s1_lbl_comp":"комплементарна РНК и антипараллельна ей: это матричная цепь","s1_lbl_maskq":"Какая цепь служила матрицей и в какую сторону шёл синтез?","s1_r_tpl":"Матричная цепь","s1_r_tpl_s":"служит матрицей: РНК-полимераза движется вдоль неё от 3′ к 5′","s1_v_top":"верхняя","s1_v_bot":"нижняя","s1_r_cod":"Кодирующая цепь","s1_r_grow":"РНК удлиняется","s1_r_grow_s":"нуклеотиды присоединяются к 3′-концу","s1_v_grow_r":"слева направо","s1_v_grow_l":"справа налево","s1_r_rna":"РНК","s1_r_rna_s":"записана от 5′ к 3′","s1_v_seq":"5′-{s}-3′","s1_r_rel":"Цепь для сравнения и РНК","s1_r_rel_s":"{s} цепь, прочитанная от 5′ к 3′","s1_v_rel_same":"совпадают (T вместо U)","s1_v_rel_comp":"комплементарны","s1_cap_r_same":"Промотор слева, поэтому РНК-полимераза движется вправо. РНК растёт от 5′ к 3′, значит, матрица должна быть ориентирована от 3′ к 5′ в том же направлении — это нижняя цепь. Верхняя цепь совпадает с РНК (T вместо U): это кодирующая цепь.","s1_cap_r_same_z":"Последовательность РНК находят по кодирующей цепи (замена T на U), а не по матричной: так записывают последовательности генов.","s1_cap_r_comp":"Промотор слева, синтез идёт вправо; матрица — нижняя цепь. Нижняя цепь, прочитанная от 5′ к 3′, комплементарна РНК: напротив каждого её нуклеотида в РНК стоит комплементарный, а направления цепей противоположны.","s1_cap_r_comp_z":"Сравнивать цепи нужно в одном направлении — от 5′ к 3′. Если читать обе слева направо, РНК не совпадёт ни с одной цепью.","s1_cap_l_same":"Промотор справа: синтез идёт влево, и матрицей стала верхняя цепь — она ориентирована от 3′ к 5′ справа налево. Нижняя цепь, прочитанная от 5′ к 3′, совпадает с РНК (T вместо U) — теперь кодирующая она.","s1_cap_l_same_z":"Матричной или кодирующей цепь бывает не сама по себе, а по отношению к конкретной транскрипционной единице.","s1_cap_l_comp":"Промотор справа, синтез идёт влево; матрица — верхняя цепь. Верхняя цепь комплементарна РНК и антипараллельна ей.","s1_cap_l_comp_z":"Ориентацию задаёт промотор: от него зависит и место начала синтеза, и то, какая цепь станет матрицей.","s1_cap_mask":"Обратная задача: известна РНК; промотор и направление синтеза скрыты.","s1_cap_mask_z":"Найдите цепь, которая совпадает с РНК при чтении от 5′ к 3′ (с заменой U на T): матрица — другая цепь.","s1_pA_inv":"А. Участок ДНК из обратной задачи (другой участок, 12 п. н.)","s1_cap_inv":"Обратная задача решена: на этом участке верхняя цепь совпадает с РНК 5′-AUGCCUAAGGUC-3′ (T вместо U) — она кодирующая. Матрица — нижняя цепь; 5′-конец РНК слева, значит, синтез шёл слева направо, а промотор этой единицы — слева.","s1_cap_inv_z":"Матрицу находят по РНК: цепь, совпадающая с РНК при чтении от 5′ к 3′, — кодирующая; матрица — вторая, комплементарная ей цепь."},"notes":["Синтез вправо: матрица — нижняя цепь; РНК совпадает с верхней (T вместо U).","Синтез влево: матрица — верхняя цепь; РНК совпадает с нижней, прочитанной от 5′ к 3′."],"static":["Синтез вправо: матрица — нижняя цепь; РНК совпадает с верхней (T вместо U)."]}},"exam_quiz":{"id":"S9-E01","question":"Транскрипционная единица транскрибируется справа налево. Где находится её промотор?","options":[{"id":"S9-E01-1","text":"Справа от транскрибируемого участка: промотор стоит у начала единицы","correct":true,"feedback":"Промотор задаёт точку начала и направление синтеза; синтез идёт от него."},{"id":"S9-E01-2","text":"Слева: промотор всегда в конце единицы","correct":false,"feedback":"Промотор — у начала единицы, а не у её конца."},{"id":"S9-E01-3","text":"В середине транскрибируемого участка","correct":false,"feedback":"Точка начала транскрипции +1 находится у промотора, на краю единицы."}]}},{"id":"template-coding","section":0,"questions":[1],"title":"Матричная и кодирующая цепи: что с чем совпадает","keywords":["матричная цепь","кодирующая цепь","5′→3′","комплементарность","антипараллельность","T и U"],"lead":["Уже известно: новый нуклеотид присоединяется к 3′-OH растущей цепи ([[https://fresll.github.io/bio/seminar-7-route.html#polymerase-rule|вспомнить БИО-7·4]]).","Новое: то же правило у РНК-полимеразы определяет, как РНК связана с каждой из двух цепей ДНК."],"mechanism":["РНК удлиняется от 5′- к 3′-концу: каждый новый рибонуклеотид присоединяется к 3′-OH растущей цепи.","Поэтому РНК-полимераза движется вдоль [[T03|матричной цепи]] в направлении 3′→5′: РНК комплементарна ей и антипараллельна.","Вторая цепь — [[T04|кодирующая]]: она комплементарна матричной и потому совпадает с РНК, если заменить T на U.","Пары при транскрипции: A матрицы — U в РНК, T — A, G — C, C — G."],"paragraphs":["Сравнивать цепи нужно в одном направлении — от 5′ к 3′. Если читать слева направо обе цепи ДНК и РНК, не учитывая их концов, РНК может не совпасть ни с одной из цепей.","Последовательности генов в базах данных записывают по кодирующей цепи от 5′ к 3′: по такой записи сразу видна последовательность РНК (с заменой T на U).","Пример: матрица 3′-TACGGAATT-5′ — РНК 5′-AUGCCUUAA-3′ — кодирующая цепь 5′-ATGCCTTAA-3′."],"conditions":"Схема шага — модель вкладки 1; переключатель меняет цепь, которую сравнивают с РНК.","sources":["Alberts2022"],"quiz":{"id":"S9-L02","question":"Кодирующая цепь участка гена — 5′-GATTC-3′. Какой будет РНК?","options":[{"id":"S9-L02-1","text":"5′-CUAAG-3′","correct":false,"feedback":"Это последовательность, комплементарная кодирующей цепи, да ещё без учёта направления цепей; РНК не комплементарна кодирующей цепи, а совпадает с ней."},{"id":"S9-L02-2","text":"5′-GAUUC-3′","correct":true,"feedback":"РНК совпадает с кодирующей цепью, если T заменить на U."},{"id":"S9-L02-3","text":"3′-CUAAG-5′","correct":false,"feedback":"Комплементарна кодирующей цепи матричная цепь ДНК (3′-CTAAG-5′), а не РНК; РНК совпадает с кодирующей."}]},"widget":{"kind":"dna","title":"","s":{"title":"РНК и цепи ДНК, прочитанные от 5′ к 3′","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["сравнение с кодирующей","сравнение с матричной"],"scene":"s1b","args":[["+","top"],["+","bot"]],"L":{"s1_dir":"Транскрипционная единица","s1_dir_r":"промотор слева, синтез вправо","s1_dir_l":"промотор справа, синтез влево","s1_cmp":"С РНК сравнивается цепь ДНК","s1_cmp_top":"верхняя","s1_cmp_bot":"нижняя" comp_z":"Сравнивать цепи нужно в одном направлении — от 5′ к 3′. Если читать обе слева направо, РНК не совпадёт ни с одной цепью.","s1_cap_l_same":"Промотор справа: синтез идёт влево, и матрицей стала верхняя цепь — она ориентирована от 3′ к 5′ справа налево. Нижняя цепь, прочитанная от 5′ к 3′, совпадает с РНК (T вместо U) — теперь кодирующая она.","s1_cap_l_same_z":"Матричной или кодирующей цепь бывает не сама по себе, а по отношению к конкретной транскрипционной единице.","s1_cap_l_comp":"Промотор справа, синтез идёт влево; матрица — верхняя цепь. Верхняя цепь комплементарна РНК и антипараллельна ей.","s1_cap_l_comp_z":"Ориентацию задаёт промотор: от него зависит и место начала синтеза, и то, какая цепь станет матрицей.","s1_cap_mask":"Обратная задача: известна РНК; промотор и направление синтеза скрыты.","s1_cap_mask_z":"Найдите цепь, которая совпадает с РНК при чтении от 5′ к 3′ (с заменой U на T): матрица — другая цепь.","s1_pA_inv":"А. Участок ДНК из обратной задачи (другой участок, 12 п. н.)","s1_cap_inv":"Обратная задача решена: на этом участке верхняя цепь совпадает с РНК 5′-AUGCCUAAGGUC-3′ (T вместо U) — она кодирующая. Матрица — нижняя цепь; 5′-конец РНК слева, значит, синтез шёл слева направо, а промотор этой единицы — слева.","s1_cap_inv_z":"Матрицу находят по РНК: цепь, совпадающая с РНК при чтении от 5′ к 3′, — кодирующая; матрица — вторая, комплементарная ей цепь."},"notes":["Верхняя цепь совпадает с РНК (T вместо U): она кодирующая.","Нижняя цепь, прочитанная от 5′ к 3′, комплементарна РНК: она матричная."],"static":["Верхняя цепь совпадает с РНК (T вместо U): она кодирующая."]}},"exam_quiz":{"id":"S9-E02","question":"Матричная цепь участка гена: 3′-TACGGT-5′. Какая РНК синтезируется с этого участка?","options":[{"id":"S9-E02-1","text":"5′-UACGGU-3′","correct":false,"feedback":"Это сама матрица с U вместо T; РНК должна быть ей комплементарна."},{"id":"S9-E02-2","text":"5′-AUGCCA-3′","correct":true,"feedback":"РНК комплементарна матрице и антипараллельна ей: напротив 3′-T стоит 5′-A."},{"id":"S9-E02-3","text":"5′-ACCGUA-3′","correct":false,"feedback":"Буквы комплементарны, но порядок обратный: 5′-конец РНК стоит напротив 3′-конца матрицы."}]}},{"id":"orientation","section":0,"questions":[1],"title":"Какая цепь служит матрицей, задаёт ориентация транскрипционной единицы","keywords":["ориентация промотора","направление транскрипции","соседние гены","матрица не постоянна"],"lead":["Уже известно: матрица антипараллельна РНК, а РНК растёт от 5′ к 3′.","Новое: от промотора зависит, в какую сторону пойдёт синтез, а значит — какая из двух цепей станет матрицей."],"mechanism":["Промотор асимметричен: связавшиеся с ним общие факторы ориентируют РНК-полимеразу II, и синтез идёт от точки +1 в одну сторону.","При синтезе вправо матрицей служит цепь, ориентированная 3′→5′ слева направо; при синтезе влево — другая цепь.","Поэтому для одной транскрипционной единицы матрица одна, но у соседних единиц матрицами могут быть разные цепи одной молекулы ДНК.","Нельзя назвать одну цепь всей хромосомы матричной или кодирующей: это роли цепи по отношению к конкретной единице."],"paragraphs":["Обратная задача решается так: найдите цепь, совпадающую с РНК при чтении от 5′ к 3′ (с заменой U на T) — это кодирующая цепь; матрица — другая, а направление синтеза указывает положение 5′-конца РНК.","В геноме человека гены, соседние на хромосоме, нередко транскрибируются в противоположных направлениях; встречаются и единицы, частично перекрывающиеся на разных цепях."],"conditions":"Схема шага — модель вкладки 1: тот же участок при двух ориентациях промотора.","sources":["Alberts2022"],"quiz":{"id":"S9-L03","question":"Два соседних гена одной хромосомы транскрибируются навстречу друг другу. Что можно сказать об их матрицах?","options":[{"id":"S9-L03-1","text":"Матрица одна и та же: у хромосомы одна матричная цепь","correct":false,"feedback":"Матричную цепь задаёт ориентация каждой единицы; постоянной матричной цепи у хромосомы нет."},{"id":"S9-L03-2","text":"Встречная транскрипция невозможна: РНК-полимеразы столкнутся","correct":false,"feedback":"Встречно ориентированные гены обычны; столкновение возможно лишь там, где единицы перекрываются, и не делает их существование невозможным."},{"id":"S9-L03-3","text":"Матрицы — разные цепи одной молекулы ДНК","correct":true,"feedback":"При противоположных направлениях синтеза антипараллельность требует разных матриц."}]},"widget":{"kind":"dna","title":"","s":{"title":"Одна последовательность — две ориентации","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["синтез вправо","синтез влево"],"scene":"s1b","args":[["+","top"],["-","top"]],"L":{"s1_dir":"Транскрипционная единица","s1_dir_r":"промотор слева, синтез вправо","s1_dir_l":"промотор справа, синтез влево","s1_cmp":"С РНК сравнивается цепь ДНК","s1_cmp_top":"верхняя","s1_cmp_bot":"нижняя","s1_ctrl_note":"Участок ДНК один и тот же; меняется только положение промотора, то есть ориентация транскрипционной единицы. Верхняя цепь записана от 5′ к 3′ слева направо, нижняя — от 3′ к 5′. Последовательность условная.","s1_pA":"А. Участок ДНК и синтезируемая РНК","s1_pA_mask":"А. Другой участок ДНК (12 п. н.): промотор и направление синтеза не показаны","s1_pB":"Б. РНК от 5′ к 3′ и цепь ДНК, прочитанная в том же направлении","s1_lbl_prom":"промотор","s1_lbl_dir":"направление синтеза РНК","s1_lbl_rna":"РНК","s1_lbl_cmp_top":"верхняя цепь","s1_lbl_cmp_bot":"нижняя цепь","s1_lbl_same":"совпадает с РНК, если T заменить на U: это кодирующая цепь","s1_lbl_comp":"комплементарна РНК и антипараллельна ей: это матричная цепь","s1_lbl_maskq":"Какая цепь служила матрицей и в какую сторону шёл синтез?","s1_r_tpl":"Матричная цепь","s1_r_tpl_s":"служит матрицей: РНК-полимераза движется вдоль неё от 3′ к 5′","s1_v_top":"верхняя","s1_v_bot":"нижняя","s1_r_cod":"Кодирующая цепь","s1_r_grow":"РНК удлиняется","s1_r_grow_s":"нуклеотиды присоединяются к 3′-концу","s1_v_grow_r":"слева направо","s1_v_grow_l":"справа налево","s1_r_rna":"РНК","s1_r_rna_s":"записана от 5′ к 3′","s1_v_seq":"5′-{s}-3′","s1_r_rel":"Цепь для сравнения и РНК","s1_r_rel_s":"{s} цепь, прочитанная от 5′ к 3′","s1_v_rel_same":"совпадают (T вместо U)","s1_v_rel_comp":"комплементарны","s1_cap_r_same":"Промотор слева, поэтому РНК-полимераза движется вправо. РНК растёт от 5′ к 3′, значит, матрица должна быть ориентирована от 3′ к 5′ в том же направлении — это нижняя цепь. Верхняя цепь совпадает с РНК (T вместо U): это кодирующая цепь.","s1_cap_r_same_z":"Последовательность РНК находят по кодирующей цепи (замена T на U), а не по матричной: так записывают последовательности генов.","s1_cap_r_comp":"Промотор слева, синтез идёт вправо; матрица — нижняя цепь. Нижняя цепь, прочитанная от 5′ к 3′, комплементарна РНК: напротив каждого её нуклеотида в РНК стоит комплементарный, а направления цепей противоположны.","s1_cap_r_comp_z":"Сравнивать цепи нужно в одном направлении — от 5′ к 3′. Если читать обе слева направо, РНК не совпадёт ни с одной цепью.","s1_cap_l_same":"Промотор справа: синтез идёт влево, и матрицей стала верхняя цепь — она ориентирована от 3′ к 5′ справа налево. Нижняя цепь, прочитанная от 5′ к 3′, совпадает с РНК (T вместо U) — теперь кодирующая она.","s1_cap_l_same_z":"Матричной или кодирующей цепь бывает не сама по себе, а по отношению к конкретной транскрипционной единице.","s1_cap_l_comp":"Промотор справа, синтез идёт влево; матрица — верхняя цепь. Верхняя цепь комплементарна РНК и антипараллельна ей.","s1_cap_l_comp_z":"Ориентацию задаёт промотор: от него зависит и место начала синтеза, и то, какая цепь станет матрицей.","s1_cap_mask":"Обратная задача: известна РНК; промотор и направление синтеза скрыты.","s1_cap_mask_z":"Найдите цепь, которая совпадает с РНК при чтении от 5′ к 3′ (с заменой U на T): матрица — другая цепь.","s1_pA_inv":"А. Участок ДНК из обратной задачи (другой участок, 12 п. н.)","s1_cap_inv":"Обратная задача решена: на этом участке верхняя цепь совпадает с РНК 5′-AUGCCUAAGGUC-3′ (T вместо U) — она кодирующая. Матрица — нижняя цепь; 5′-конец РНК слева, значит, синтез шёл слева направо, а промотор этой единицы — слева.","s1_cap_inv_z":"Матрицу находят по РНК: цепь, совпадающая с РНК при чтении от 5′ к 3′, — кодирующая; матрица — вторая, комплементарная ей цепь."},"notes":["Синтез вправо: верхняя цепь совпадает с РНК — она кодирующая.","Синтез влево: верхняя цепь стала матрицей и комплементарна РНК."],"static":["Синтез вправо: верхняя цепь совпадает с РНК — она кодирующая."]}},"exam_quiz":{"id":"S9-E03","question":"Как удлиняется молекула РНК во время транскрипции?","options":[{"id":"S9-E03-1","text":"Нуклеотиды присоединяются к 5′-концу РНК","correct":false,"feedback":"У РНК-полимеразы, как у ДНК-полимеразы, наращивается 3′-конец цепи."},{"id":"S9-E03-2","text":"Нуклеотиды присоединяются к обоим концам РНК","correct":false,"feedback":"Удлиняется только 3′-конец; 5′-конец образуется в точке +1 и затем получает кэп."},{"id":"S9-E03-3","text":"Нуклеотиды по одному присоединяются к 3′-концу растущей РНК","correct":true,"feedback":"Поэтому РНК растёт от 5′ к 3′, а полимераза движется вдоль матрицы от её 3′- к 5′-концу."}]}},{"id":"two-units","section":0,"questions":[1],"title":"Две перекрывающиеся транскрипционные единицы на одном участке ДНК","keywords":["две единицы","встречная ориентация","перекрывание","обратная задача","восстановление матрицы"],"lead":["Уже известно: матрицу задаёт ориентация конкретной единицы (БИО-9·3).","Новое: что получится, если две единицы на одном коротком участке перекрываются, и как по РНК восстановить матрицу."],"mechanism":["Если единицы I и II ориентированы навстречу, у I матрица — одна цепь, у II — другая. Там, где единицы перекрываются, одни и те же нуклеотиды цепи служат матрицей для одной единицы и кодирующей цепью для другой, а РНК двух единиц в этом участке комплементарны друг другу.","Если ориентация одинакова, матрица у обеих единиц одна и та же цепь.","По РНК и направлению синтеза матрица восстанавливается однозначно: она комплементарна РНК и антипараллельна ей, а её 3′-конец стоит напротив 5′-конца РНК.","Для одной единицы обе цепи сразу матрицей быть не могут: РНК растёт 5′→3′ и антипараллельна только одной цепи."],"paragraphs":["Обратная задача модели: РНК 5′-AAGCAUUCGGACUAUC-3′, синтез справа налево. Нижняя цепь от правого края участка к середине, прочитанная от 5′ к 3′, совпадает с РНК (U → T); значит, матрица — верхняя цепь, 3′-TTCGTAAGCCTGATAG-5′.","Модель условная: единицы по 16 нуклеотидов, перекрываются на 6 пар, промоторы показаны только прямоугольниками. Она не показывает, мешают ли две единицы друг другу, — об этом следующий шаг.","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель с условной последовательностью; правила — по учебнику Alberts et al.","sources":["Alberts2022"],"quiz":{"id":"S9-L04","question":"РНК 5′-GGCU-3′ синтезирована при движении РНК-полимеразы справа налево. Как записать её матрицу от 3′ к 5′?","options":[{"id":"S9-L04-1","text":"3′-CCGA-5′","correct":true,"feedback":"Напротив 5′-G РНК стоит C у 3′-конца матрицы; матрица комплементарна РНК и антипараллельна ей."},{"id":"S9-L04-2","text":"3′-GGCT-5′","correct":false,"feedback":"Это последовательность РНК с T вместо U — кодирующая цепь, а не матрица."},{"id":"S9-L04-3","text":"5′-CCGA-3′","correct":false,"feedback":"Буквы верные, но концы перепутаны: у матрицы 3′-конец напротив 5′-конца РНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Две транскрипционные единицы","status":"Учебная модель · последовательность условная","modes_label":"Что показать","modes":["встречные единицы","одинаковая ориентация","обратная задача"],"scene":"a1","args":[["II","-"],["II","+"],["II","-","mask"]],"L":{"s1a_prob":"На участке ДНК 30 пар нуклеотидов две условные транскрипционные единицы, которые в середине участка перекрываются. Может ли один и тот же участок цепи ДНК быть матричным для одной единицы и кодирующим для другой? Как по готовой РНК восстановить матрицу?","s1a_sel":"Выбрана единица","s1a_sel_I":"I","s1a_sel_II":"II","s1a_dir":"Ориентация единицы II","s1a_dir_opp":"встречная к I (синтез влево)","s1a_dir_same":"как у I (синтез вправо, промотор внутри единицы I)","s1a_note":"Единица I: промотор слева, синтез вправо. Единицы I и II перекрываются на 6 пар нуклеотидов в середине участка. Последовательность условная; РНК, матрица и направление вычисляются по правилам комплементарности и антипараллельности. Длина единиц (16 нуклеотидов) условная.","s1a_pA":"А. Участок ДНК, две транскрипционные единицы и РНК выбранной","s1a_pA_mask":"А. Участок ДНК: промоторы и единицы не показаны","s1a_pB":"Б. Матрица и РНК каждой единицы","s1a_lbl_unit_I":"единица I","s1a_lbl_unit_II":"единица II","s1a_lbl_overlap":"перекрывание: {n} п. н.","s1a_lbl_row":"{u}: матрица — {s} цепь, синтез {d}","s1a_lbl_rna":"РНК 5′-{r}-3′ · матрица 3′-{m}-5′","s1a_lbl_given":"Дано: РНК 5′-{r}-3′","s1a_lbl_given_dir":"Синтез шёл справа налево; единица находится на этом участке.","s1a_lbl_maskq":"Найдите матричную цепь и запишите её от 3′ к 5′.","s1a_v_top":"верхняя","s1a_v_bot":"нижняя","s1a_v_dir_r":"слева направо","s1a_v_dir_l":"справа налево","s1a_r_tpl":"Матричная цепь","s1a_r_tpl_s":"для единицы: {u}","s1a_r_dirg":"Направление синтеза РНК","s1a_r_rna":"РНК","s1a_r_rna_s":"от 5′ к 3′","s1a_v_seq":"5′-{s}-3′","s1a_r_m35":"Матрица","s1a_r_m35_s":"записана от 3′ к 5′, в направлении движения РНК-полимеразы","s1a_v_m35":"3′-{s}-5′","s1a_r_same":"Матрица у единиц I и II","s1a_v_same_yes":"одна и та же цепь","s1a_v_same_no":"разные цепи","s1a_cap_I_opp":"Единица I транскрибируется вправо, её матрица — нижняя цепь. Единица II встречная: её матрица — верхняя цепь. В участке перекрывания одни и те же нуклеотиды верхней цепи служат матрицей для единицы II и кодирующей цепью для единицы I.","s1a_cap_I_opp_z":"Статус «матричная» или «кодирующая» относится к транскрипционной единице, а не к цепи всей хромосомы и даже не к участку цепи.","s1a_cap_II_opp":"Выбрана единица II: промотор справа, синтез влево. Её матрица — верхняя цепь, а РНК совпадает с нижней цепью, прочитанной от 5′ к 3′ (справа налево), с заменой T на U. В участке перекрывания РНК единиц I и II комплементарны друг другу.","s1a_cap_II_opp_z":"Чтобы найти РНК встречной единицы, нижнюю цепь читают от её 5′-конца — справа налево.","s1a_cap_I_same":"Единица II ориентирована так же, как I, и её промотор лежит внутри единицы I: у обеих матрица — нижняя цепь. Для обеих единиц верхняя цепь — кодирующая.","s1a_cap_I_same_z":"Перекрывание единиц одной ориентации — частный случай: в геноме встречаются перекрывания обеих ориентаций.","s1a_cap_II_same":"Единица II теперь транскрибируется вправо: её матрица — нижняя цепь, как у единицы I, и РНК совпадает с верхней цепью (T вместо U).","s1a_cap_II_same_z":"Матрицу задаёт ориентация промотора, поэтому при смене ориентации меняются и матрица, и последовательность РНК.","s1a_cap_mask":"Обратная задача: известны РНК и направление синтеза; промоторы скрыты.","s1a_cap_mask_z":"Сначала найдите на участке последовательность, совпадающую с РНК при чтении от 5′ к 3′ (U → T), — это кодирующая цепь.","s1a_take":"Обе цепи одного участка ДНК могут служить матрицей — каждая для своей транскрипционной единицы, даже там, где единицы перекрываются, но не для одной и той же единицы одновременно: направление синтеза РНК (5′→3′) и антипараллельность задают единственную матрицу. Поэтому цепь хромосомы и даже отдельный её участок нельзя назвать кодирующими или матричными вообще — только по отношению к определённой единице. По РНК и направлению синтеза матрица восстанавливается однозначно: это цепь, комплементарная РНК и антипараллельная ей.","s1a_lim":"Модель не показывает настоящих промоторов (их последовательности длиннее и сложнее) и не показывает, мешают ли две встречные единицы друг другу и что происходит с комплементарными участками двух РНК. Длина единиц и последовательность условные; процессинг РНК здесь не учитывается.","s1a_new":"В геноме человека обе цепи транскрибируются во многих участках. По оценке одной полногеномной работы, около четверти активных точек начала транскрипции в изученных клетках человека относится к встречным промоторам, а пар, в которых длинная некодирующая РНК перекрывается с белок-кодирующим геном, найдено более 5000. Ожидали, что встречная транскрипция будет подавлять соседний ген (это назвали транскрипционной интерференцией). Однако у большинства перекрывающихся пар активность обеих единиц изменяется согласованно, а не противоположно; для встречных промоторов полногеномные данные противоречивы (в части работ найдено ослабление, в части — нет), а сильное подавление показано для отдельных генов.","s1a_how":"сравнили, как меняется количество РНК обеих единиц в тысячах пар перекрывающихся генов в разных клетках и условиях. Согласованное изменение — корреляция, а не доказательство отсутствия влияния: отдельные гены могут подавлять друг друга.","s1a_tl_note":"Порядок этапов — учебная модель; длина единиц и последовательность условные.","s1a_tl_1":"Промотор выбранной единицы: на нём собираются общие факторы и РНК-полимераза II; он задаёт точку начала и направление синтеза.","s1a_tl_2_r":"Синтез идёт вправо: матрица — нижняя цепь, полимераза движется вдоль неё от 3′ к 5′.","s1a_tl_2_l":"Синтез идёт влево: матрица — верхняя цепь, полимераза движется вдоль неё от 3′ к 5′, справа налево.","s1a_tl_3":"РНК синтезирована: она комплементарна матрице и совпадает с кодирующей цепью единицы (T вместо U).","s1a_tl_4_opp":"Сравнение: у единиц I и II матрицы на разных цепях; в участке перекрывания одна цепь — матрица для II и кодирующая для I.","s1a_tl_4_same":"Сравнение: у единиц I и II матрица — одна и та же нижняя цепь.","s1a_lbl_prom":"промотор","s1a_pA_inv":"А. Обратная задача: участок у левого края, синтез справа налево","s1a_lbl_unit_inv":"участок обратной задачи","s1a_lbl_inv_note":"Это другой участок того же фрагмента ДНК, а не единица I или II.","s1a_cap_inv":"Обратная задача решена: РНК 5′-GGCUAACGUAUG-3′ совпадает с нижней цепью у левого края, прочитанной от её 5′-конца (T вместо U), — это кодирующая цепь. Матрица — верхняя цепь этого участка: 3′-CCGATTGCATAC-5′; синтез шёл справа налево.","s1a_cap_inv_z":"По одной РНК и направлению синтеза матрицу находят однозначно: последовательность, совпадающая с РНК, встречается на участке один раз.","s1a_tl_mask":"Обратная задача: даны РНК и направление синтеза; найдите матричную цепь и её участок.","s1a_tl_inv":"Обратная задача решена: матрица — верхняя цепь у левого края, синтез справа налево.","s1a_pB_inv":"Б. Матрица и РНК участка обратной задачи"},"notes":["Единица II встречная: её матрица — верхняя цепь, а для единицы I верхняя цепь кодирующая, в том числе в участке перекрывания.","Обе единицы транскрибируются вправо: матрица — нижняя цепь у обеих.","Дана РНК и направление синтеза; найдите матрицу."],"static":["Единица II встречная: её матрица — верхняя цепь, а для единицы I верхняя цепь кодирующая, в том числе в участке перекрывания."]}},"level":"adv"},{"id":"interference","section":0,"questions":[1],"title":"По полногеномным данным перекрывающиеся встречные единицы чаще активны согласованно, чем подавляют друг друга","keywords":["перекрывающиеся единицы","антисмысловая транскрипция","транскрипционная интерференция","корреляция"],"lead":["Уже известно: на одном участке ДНК могут быть единицы противоположной ориентации (БИО-9·4).","Новое: обе цепи генома человека транскрибируются во многих участках, и у большинства перекрывающихся пар единиц активность изменяется согласованно, а не противоположно."],"mechanism":["По оценке полногеномной работы, около четверти активных точек начала транскрипции в изученных клетках человека относится к встречным промоторам — промоторам на противоположных цепях, направленным навстречу друг другу; найдено также более 5000 пар, в которых длинная некодирующая РНК перекрывается с белок-кодирующим геном.","Давно предполагали, что встречно движущиеся РНК-полимеразы будут мешать друг другу и вытеснять белки с промоторов — транскрипционная интерференция.","Анализ тысяч перекрывающихся пар показал, что у большинства активность обеих единиц изменяется согласованно, а не противоположно.","Для встречных промоторов полногеномные данные противоречивы: в части работ найдено ослабление экспрессии, в части — нет. Сильное подавление одной единицы другой показано для отдельных генов; почему одни участки чувствительны к интерференции, а другие нет, — открытый вопрос."],"paragraphs":["Как это узнали: сравнивали, как меняется количество РНК обеих единиц в тысячах пар перекрывающихся генов в разных клетках и условиях. Согласованное изменение — это корреляция: оно не доказывает, что единицы вовсе не влияют друг на друга, и не исключает подавления в отдельных генах.","Граница вывода: работа — обзор-перспектива по данным многих исследований; она не устанавливает механизм, а ставит вопрос, почему интерференция проявляется только в части участков.","Связанная модель — в практикуме: вопрос 1, уровень «Продвинутый» (две перекрывающиеся транскрипционные единицы); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Данные — клетки и ткани человека, анализ транскриптов; сводка в перспективной статье, доля встречных промоторов — по полногеномной работе на клетках человека.","sources":["FischerHoffmann2026","Wiechens2025"],"quiz":{"id":"S9-L05","question":"В двух перекрывающихся встречных единицах активность изменяется согласованно в разных тканях. Какой вывод допустим?","options":[{"id":"S9-L05-1","text":"Единицы транскрибируются с одной матричной цепи","correct":false,"feedback":"У встречных единиц матрицы — разные цепи; согласованность активности этого не меняет."},{"id":"S9-L05-2","text":"Активность единиц связана положительно, но есть ли между ними интерференция и насколько она сильна, это наблюдение не показывает","correct":true,"feedback":"Согласованность — корреляция: обе единицы могут зависеть от общих регуляторов, а подавление одной единицы другой может скрываться за общим усилением транскрипции участка. Чтобы проверить интерференцию, меняют транскрипцию одной единицы и измеряют активность другой."},{"id":"S9-L05-3","text":"Доказано, что одна единица активирует другую","correct":false,"feedback":"Корреляция не устанавливает причину: обе единицы могут зависеть от общих регуляторов."}]},"widget":{"kind":"dna","title":"","s":{"title":"Встречные единицы на одном участке","status":"Учебная модель · последовательность условная","modes_label":"Что показать","modes":["единица I","единица II"],"scene":"a1","args":[["I","-"],["II","-"]],"L":{"s1a_prob":"На участке ДНК 30 пар нуклеотидов две условные транскрипционные единицы, которые в середине участка перекрываются. Может ли один и тот же участок цепи ДНК быть матричным для одной единицы и кодирующим для другой? Как по готовой РНК восстановить матрицу?","s1a_sel":"Выбрана единица","s1a_sel_I":"I","s1a_sel_II":"II","s1a_dir":"Ориентация единицы II","s1a_dir_opp":"встречная к I (синтез влево)","s1a_dir_same":"как у I (синтез вправо, промотор внутри единицы I)","s1a_note":"Единица I: промотор слева, синтез вправо. Единицы I и II перекрываются на 6 пар нуклеотидов в середине участка. Последовательность условная; РНК, матрица и направление вычисляются по правилам комплементарности и антипараллельности. Длина единиц (16 нуклеотидов) условная.","s1a_pA":"А. Участок ДНК, две транскрипционные единицы и РНК выбранной","s1a_pA_mask":"А. Участок ДНК: промоторы и единицы не показаны","s1a_pB":"Б. Матрица и РНК каждой единицы","s1a_lbl_unit_I":"единица I","s1a_lbl_unit_II":"единица II","s1a_lbl_overlap":"перекрывание: {n} п. н.","s1a_lbl_row":"{u}: матрица — {s} цепь, синтез {d}","s1a_lbl_rna":"РНК 5′-{r}-3′ · матрица 3′-{m}-5′","s1a_lbl_given":"Дано: РНК 5′-{r}-3′","s1a_lbl_given_dir":"Синтез шёл справа налево; единица находится на этом участке.","s1a_lbl_maskq":"Найдите матричную цепь и запишите её от 3′ к 5′.","s1a_v_top":"верхняя","s1a_v_bot":"нижняя","s1a_v_dir_r":"слева направо","s1a_v_dir_l":"справа налево","s1a_r_tpl":"Матричная цепь","s1a_r_tpl_s":"для единицы: {u}","s1a_r_dirg":"Направление синтеза РНК","s1a_r_rna":"РНК","s1a_r_rna_s":"от 5′ к 3′","s1a_v_seq":"5′-{s}-3′","s1a_r_m35":"Матрица","s1a_r_m35_s":"записана от 3′ к 5′, в направлении движения РНК-полимеразы","s1a_v_m35":"3′-{s}-5′","s1a_r_same":"Матрица у единиц I и II","s1a_v_same_yes":"одна и та же цепь","s1a_v_same_no":"разные цепи","s1a_cap_I_opp":"Единица I транскрибируется вправо, её матрица — нижняя цепь. Единица II встречная: её матрица — верхняя цепь. В участке перекрывания одни и те же нуклеотиды верхней цепи служат матрицей для единицы II и кодирующей цепью для единицы I.","s1a_cap_I_opp_z":"Статус «матричная» или «кодирующая» относится к транскрипционной единице, а не к цепи всей хромосомы и даже не к участку цепи.","s1a_cap_II_opp":"Выбрана единица II: промотор справа, синтез влево. Её матрица — верхняя цепь, а РНК совпадает с нижней цепью, прочитанной от 5′ к 3′ (справа налево), с заменой T на U. В участке перекрывания РНК единиц I и II комплементарны друг другу.","s1a_cap_II_opp_z":"Чтобы найти РНК встречной единицы, нижнюю цепь читают от её 5′-конца — справа налево.","s1a_cap_I_same":"Единица II ориентирована так же, как I, и её промотор лежит внутри единицы I: у обеих матрица — нижняя цепь. Для обеих единиц верхняя цепь — кодирующая.","s1a_cap_I_same_z":"Перекрывание единиц одной ориентации — частный случай: в геноме встречаются перекрывания обеих ориентаций.","s1a_cap_II_same":"Единица II теперь транскрибируется вправо: её матрица — нижняя цепь, как у единицы I, и РНК совпадает с верхней цепью (T вместо U).","s1a_cap_II_same_z":"Матрицу задаёт ориентация промотора, поэтому при смене ориентации меняются и матрица, и последовательность РНК.","s1a_cap_mask":"Обратная задача: известны РНК и направление синтеза; промоторы скрыты.","s1a_cap_mask_z":"Сначала найдите на участке последовательность, совпадающую с РНК при чтении от 5′ к 3′ (U → T), — это кодирующая цепь.","s1a_take":"Обе цепи одного участка ДНК могут служить матрицей — каждая для своей транскрипционной единицы, даже там, где единицы перекрываются, но не для одной и той же единицы одновременно: направление синтеза РНК (5′→3′) и антипараллельность задают единственную матрицу. Поэтому цепь хромосомы и даже отдельный её участок нельзя назвать кодирующими или матричными вообще — только по отношению к определённой единице. По РНК и направлению синтеза матрица восстанавливается однозначно: это цепь, комплементарная РНК и антипараллельная ей.","s1a_lim":"Модель не показывает настоящих промоторов (их последовательности длиннее и сложнее) и не показывает, мешают ли две встречные единицы друг другу и что происходит с комплементарными участками двух РНК. Длина единиц и последовательность условные; процессинг РНК здесь не учитывается.","s1a_new":"В геноме человека обе цепи транскрибируются во многих участках. По оценке одной полногеномной работы, около четверти активных точек начала транскрипции в изученных клетках человека относится к встречным промоторам, а пар, в которых длинная некодирующая РНК перекрывается с белок-кодирующим геном, найдено более 5000. Ожидали, что встречная транскрипция будет подавлять соседний ген (это назвали транскрипционной интерференцией). Однако у большинства перекрывающихся пар активность обеих единиц изменяется согласованно, а не противоположно; для встречных промоторов полногеномные данные противоречивы (в части работ найдено ослабление, в части — нет), а сильное подавление показано для отдельных генов.","s1a_how":"сравнили, как меняется количество РНК обеих единиц в тысячах пар перекрывающихся генов в разных клетках и условиях. Согласованное изменение — корреляция, а не доказательство отсутствия влияния: отдельные гены могут подавлять друг друга.","s1a_tl_note":"Порядок этапов — учебная модель; длина единиц и последовательность условные.","s1a_tl_1":"Промотор выбранной единицы: на нём собираются общие факторы и РНК-полимераза II; он задаёт точку начала и направление синтеза.","s1a_tl_2_r":"Синтез идёт вправо: матрица — нижняя цепь, полимераза движется вдоль неё от 3′ к 5′.","s1a_tl_2_l":"Синтез идёт влево: матрица — верхняя цепь, полимераза движется вдоль неё от 3′ к 5′, справа налево.","s1a_tl_3":"РНК синтезирована: она комплементарна матрице и совпадает с кодирующей цепью единицы (T вместо U).","s1a_tl_4_opp":"Сравнение: у единиц I и II матрицы на разных цепях; в участке перекрывания одна цепь — матрица для II и кодирующая для I.","s1a_tl_4_same":"Сравнение: у единиц I и II матрица — одна и та же нижняя цепь.","s1a_lbl_prom":"промотор","s1a_pA_inv":"А. Обратная задача: участок у левого края, синтез справа налево","s1a_lbl_unit_inv":"участок обратной задачи","s1a_lbl_inv_note":"Это другой участок того же фрагмента ДНК, а не единица I или II.","s1a_cap_inv":"Обратная задача решена: РНК 5′-GGCUAACGUAUG-3′ совпадает с нижней цепью у левого края, прочитанной от её 5′-конца (T вместо U), — это кодирующая цепь. Матрица — верхняя цепь этого участка: 3′-CCGATTGCATAC-5′; синтез шёл справа налево.","s1a_cap_inv_z":"По одной РНК и направлению синтеза матрицу находят однозначно: последовательность, совпадающая с РНК, встречается на участке один раз.","s1a_tl_mask":"Обратная задача: даны РНК и направление синтеза; найдите матричную цепь и её участок.","s1a_tl_inv":"Обратная задача решена: матрица — верхняя цепь у левого края, синтез справа налево.","s1a_pB_inv":"Б. Матрица и РНК участка обратной задачи"},"notes":["Единица I: матрица — нижняя цепь.","Единица II: матрица — верхняя цепь."],"static":["Единица I: матрица — нижняя цепь."]}},"level":"adv"},{"id":"rna-polymerases","section":1,"questions":[2],"title":"Три РНК-полимеразы ядра и РНК-полимераза II","keywords":["РНК-полимераза I","РНК-полимераза II","РНК-полимераза III","C-концевой домен"],"lead":["Уже известно: РНК-полимераза синтезирует РНК 5′→3′ по матричной цепи (БИО-9·2).","Новое: в ядре эукариот три РНК-полимеразы, и транскрипты разных классов синтезирует разная полимераза.","Раздел относится к вопросам 8 и 9 коллоквиума 2 (предварительный список) и вопросу 19 зачёта."],"mechanism":["РНК-полимераза I синтезирует в ядрышке общий предшественник рРНК, из которого образуются 18S, 5,8S и 28S рРНК.","[[T07|РНК-полимераза II]] транскрибирует все белок-кодирующие гены (синтезирует пре-мРНК) и гены многих некодирующих РНК, в том числе большинства малых ядерных РНК и предшественников микроРНК.","РНК-полимераза III синтезирует тРНК, 5S рРНК и другие короткие РНК.","У РНК-полимеразы II есть [[T21|C-концевой домен]] — повторы из семи аминокислот (у человека 52). Его фосфорилирование меняется по ходу транскрипции, и с ним связываются белки процессинга."],"paragraphs":["Каждая полимераза узнаёт промоторы своего типа при участии собственного набора общих факторов транскрипции. Дальше в семинаре речь идёт только о РНК-полимеразе II.","Кэп, сплайсинг сплайсосомой и поли(А)-хвост характерны для транскриптов РНК-полимеразы II; транскрипты РНК-полимераз I и III проходят иной процессинг."],"conditions":"Схема шага — модель вкладки 2.","sources":["Alberts2022"],"quiz":{"id":"S9-L06","question":"Какая РНК-полимераза синтезирует пре-мРНК белок-кодирующих генов?","options":[{"id":"S9-L06-1","text":"РНК-полимераза I","correct":false,"feedback":"РНК-полимераза I синтезирует предшественник рРНК в ядрышке."},{"id":"S9-L06-2","text":"РНК-полимераза III","correct":false,"feedback":"РНК-полимераза III синтезирует тРНК, 5S рРНК и другие короткие РНК."},{"id":"S9-L06-3","text":"РНК-полимераза II","correct":true,"feedback":"РНК-полимераза II транскрибирует все белок-кодирующие гены."}]},"widget":{"kind":"dna","title":"","s":{"title":"Транскрипция гена РНК-полимеразой II","status":"Схема качественная","modes_label":"Что показать","modes":["все белки на месте"],"scene":"s2b","args":[["tata",{}]],"L":{"s2_prom":"Промотор","s2_prom_tata":"с TATA-боксом", ют частоту инициации."],"mechanism":["Сборку начинает [[T12|TFIID]]: его TATA-связывающий белок узнаёт TATA-бокс, другие субъединицы — другие элементы промотора; TFIID изгибает ДНК.","Затем присоединяются [[T13|TFIIB]] (он ориентирует полимеразу и задаёт направление синтеза) и [[T61|TFIIA]], РНК-полимераза II вместе с [[T14|TFIIF]], затем [[T15|TFIIE]] и [[T16|TFIIH]]. Вместе они образуют [[T17|преинициаторный комплекс]].","[[T18|Белки-активаторы]], связанные с [[T19|энхансерами]], ускоряют сборку комплекса; посредником между ними и полимеразой служит крупный комплекс [[T20|медиатор]].","Белки-репрессоры, напротив, мешают сборке — например, конкурируют с активаторами за участок ДНК."],"paragraphs":["Общие факторы нужны для транскрипции всех генов, транскрибируемых РНК-полимеразой II; активаторы и репрессоры у разных генов разные. Поэтому от регуляторных белков зависит, как часто начинается транскрипция данного гена, а место начала и последовательность РНК задаёт промотор этой транскрипционной единицы.","В клетке на промоторе нужны и белки, изменяющие хроматин: ДНК упакована в нуклеосомы. Подробно регуляция транскрипции — семинар 11 и курс «Молекулярная биология».",{"h":"Дальше в курсе «Молекулярная биология»"},"Чем различаются энхансер и промотор — [[https://fresll.github.io/molbio/seminar-6-route.html#enhancer|МБ, семинар 6, шаг 9]]; как факторы и коактиваторы связывают контакт энхансера с транскрипцией — [[https://fresll.github.io/molbio/seminar-6-route.html#coactivators|МБ, семинар 6, шаг 12]]."],"conditions":"Схема шага — модель вкладки 2: без активатора инициация в модели редкая; это качественная оценка.","sources":["Alberts2022"],"quiz":{"id":"S9-L08","question":"В клетке нет белка-активатора гена, а общие факторы и медиатор есть. Что ожидается в модели?","options":[{"id":"S9-L08-1","text":"Транскрипция начинается в другом месте гена","correct":false,"feedback":"Место начала задают элементы промотора, а не активатор."},{"id":"S9-L08-2","text":"Транскрипция начинается реже, но с той же точки +1","correct":true,"feedback":"Активатор ускоряет сборку комплекса; место и направление начала задаёт промотор."},{"id":"S9-L08-3","text":"Синтезируется РНК другой последовательности","correct":false,"feedback":"Последовательность РНК задаёт матрица; активатор влияет на частоту инициации."}]},"widget":{"kind":"dna","title":"","s":{"title":"Активатор и медиатор","status":"Схема качественная","modes_label":"Что показать","modes":["все белки","нет активатора"],"scene":"s2b","args":[["tata",{}],["tata",{"act":false}]],"L":{"s2_prom":"Промотор","s2_prom_tata":"с TATA-боксом","s2_prom_inr":"без TATA-бокса (Inr и DPE)","s2k_title":"Белки транскрипции: нажмите на гнездо, чтобы вынуть белок","s2k_hint":"TFIID в этой модели всегда на месте. Вынутый белок возвращается нажатием в лотке.","s2k_tfiid":"TFIID","s2k_tfiih":"TFIIH","s2k_act":"Белок-активатор","s2k_med":"Медиатор","s2k_xrn":"5′→3′-экзонуклеаза (XRN2)","s2_pA":"А. Промотор: сборка преинициаторного комплекса","s2_pB":"Б. Транскрипционная единица: от точки +1 до терминации","s2_e_act":"активатор","s2_e_med":"медиатор","s2_lbl_enh":"энхансер","s2_lbl_tata":"TATA-бокс","s2_lbl_3end":"3′-конец пре-мРНК","s2_lbl_norna":"Цепи ДНК не расплетены: синтез РНК не начинается","s2_lbl_term_near":"терминация","s2_lbl_term_far":"терминация дальше, чем в норме","s2_lbl_tss":"+1 — начало транскрипции","s2_lbl_aug":"ATG — место будущего старт-кодона (начало трансляции, семинар 10)","s2_st_ok":"РНК-полимераза II ушла с промотора и синтезирует РНК","s2_st_rare":"Комплекс собирается редко: инициация редкая","s2_st_closed":"Без TFIIH комплекс на промоторе неполный: цепи ДНК у точки +1 не расплетены","s2_r_pic":"Преинициаторный комплекс","s2_r_pic_s":"общие факторы и РНК-полимераза II на промоторе","s2_v_pic_yes":"собирается часто","s2_v_pic_rare":"собирается редко","s2_r_open":"Цепи ДНК у точки +1 расплетены","s2_v_yes":"да","s2_v_no":"нет","s2_r_rna":"Синтез РНК","s2_r_rna_s":"частота инициации (в модели кач е место терминации.","s2_cap_rare_near":"Без активатора или медиатора общие факторы и полимераза собираются на промоторе редко: в модели инициация редкая. Каждая начатая РНК та же — с той же точки +1 и того же направления.","s2_cap_rare_near_z":"В этой модели регуляторные белки меняют частоту инициации, но не место её начала и не последовательность РНК.","s2_cap_rare_far":"Инициация редкая (нет активатора или медиатора), а без 5′→3′-экзонуклеазы полимераза отделяется от ДНК дальше места расщепления, чем в норме.","s2_cap_rare_far_z":"Частоту инициации и место терминации определяют разные белки.","s2_cap_closed":"Без TFIIH на промоторе собирается неполный комплекс (TFIID, TFIIA, TFIIB, РНК-полимераза II с TFIIF, TFIIE), но цепи ДНК у точки +1 не расплетаются: матричная цепь недоступна, и синтез РНК не начинается.","s2_cap_closed_z":"Сборка комплекса на промоторе ещё не означает начала транскрипции: нужно открыть матрицу и освободить полимеразу от промотора.","s2_v_pic_part":"неполный: без TFIIH"},"notes":["Комплекс собирается часто.","Без активатора комплекс собирается редко: инициация редкая."],"static":["Комплекс собирается часто."]}},"exam_quiz":{"id":"S9-E04","question":"Какой белок первым связывается с промотором при сборке преинициаторного комплекса?","options":[{"id":"S9-E04-1","text":"TFIID","correct":true,"feedback":"TFIID узнаёт TATA-бокс или другие элементы промотора; затем присоединяются остальные общие факторы и полимераза."},{"id":"S9-E04-2","text":"TFIIH","correct":false,"feedback":"TFIIH присоединяется последним: он расплетает ДНК и фосфорилирует C-концевой домен."},{"id":"S9-E04-3","text":"РНК-полимераза II","correct":false,"feedback":"РНК-полимераза II сама промотор не узнаёт; её привлекают общие факторы."}]}},{"id":"escape-elongation","section":1,"questions":[2],"title":"От инициации к элонгации: расплетание ДНК и C-концевой домен","keywords":["TFIIH","расплетание","серин 5","уход с промотора","элонгация","факторы элонгации"],"lead":["Уже известно: на промоторе собран преинициаторный комплекс (БИО-9·8).","Новое: что нужно, чтобы полимераза начала синтез и ушла с промотора."],"mechanism":["TFIIH, используя энергию АТФ, расплетает двойную спираль у точки +1, и матричная цепь становится доступной: полимераза синтезирует первые нуклеотиды РНК — так завершается [[T58|инициация]].","Киназа в составе TFIIH фосфорилирует серин 5 в повторах C-концевого домена; полимераза отделяется от общих факторов и уходит с промотора.","При [[T59|элонгации]] полимераза движется по гену, РНК растёт от 5′ к 3′; короткий участок спирали РНК–ДНК внутри пузырька — около девяти пар нуклеотидов, позади полимеразы РНК отходит, а ДНК восстанавливает двойную спираль.","Факторы элонгации помогают полимеразе проходить нуклеосомы и снижают вероятность её отделения раньше конца гена; по ходу элонгации фосфорилируется серин 2 C-концевого домена."],"paragraphs":["Сборка комплекса ещё не означает начала синтеза: без TFIIH неполный комплекс стоит на промоторе, а РНК не синтезируется.","С фосфорилированным C-концевым доменом связываются ферменты кэпирования, белки сплайсинга и образования 3′-конца — поэтому процессинг идёт во время транскрипции (раздел 3)."],"conditions":"Схема шага — модель вкладки 2: без TFIIH процесс останавливается на втором этапе.","sources":["Alberts2022"],"quiz":{"id":"S9-L09","question":"Какое событие сопровождает уход РНК-полимеразы II с промотора?","options":[{"id":"S9-L09-1","text":"Присоединение поли(А)-хвоста к РНК","correct":false,"feedback":"Поли(А)-хвост добавляется к 3′-концу пре-мРНК после её расщепления, в конце гена."},{"id":"S9-L09-2","text":"Связывание TFIID с TATA-боксом","correct":false,"feedback":"Это первый шаг сборки комплекса, а не ухода с промотора."},{"id":"S9-L09-3","text":"Фосфорилирование серина 5 C-концевого домена киназой TFIIH","correct":true,"feedback":"Фосфорилирование освобождает полимеразу от общих факторов, и начинается элонгация."}]},"widget":{"kind":"dna","title":"","s":{"title":"Расплетание ДНК, чем в норме","s2_cap_ok_near_tata":"TFIID связывается с TATA-боксом, к нему присоединяются TFIIB, РНК-полимераза II с TFIIF, затем TFIIE и TFIIH; активатор, связанный с энхансером, через медиатор ускоряет сборку. TFIIH расплетает ДНК у точки +1 и фосфорилирует C-концевой домен полимеразы — она уходит с промотора. После AAUAAA пре-мРНК расщепляется; полимераза ещё некоторое время синтезирует РНК и отделяется от ДНК.","s2_cap_ok_near_tata_z":"РНК-полимераза II сама промотор не узнаёт: место и направление начала задают общие факторы, связанные с промотором.","s2_cap_ok_near_inr":"Промотор без TATA-бокса: TFIID узнаёт другие последовательности у точки +1 (Inr и DPE) своими субъединицами TAF. Комплекс собирается, точка начала и направление синтеза заданы, транскрипция идёт как с TATA-содержащего промотора.","s2_cap_ok_near_inr_z":"TATA-бокс — один из элементов промотора, а не обязательная его часть: у многих генов человека его нет.","s2_cap_ok_far_tata":"Без 5′→3′-экзонуклеазы расщепление после AAUAAA проходит, и 3′-конец пре-мРНК там же, где в норме. Но фрагмент РНК на полимеразе не разрушается, и полимераза отделяется от ДНК дальше, чем в норме: терминация сохраняется, но задерживается.","s2_cap_ok_far_tata_z":"Положение 3′-конца мРНК задаёт расщепление, а не место, где полимераза покидает ДНК; терминация — отдельный, более поздний этап.","s2_cap_ok_far_inr":"Промотор без TATA-бокса работает (TFIID узнаёт Inr и DPE). Без 5′→3′-экзонуклеазы 3′-конец пре-мРНК там же, где в норме, но полимераза отделяется от ДНК дальше, чем в норме.","s2_cap_ok_far_inr_z":"Положение 3′-конца мРНК задаёт расщепление, а не место терминации.","s2_cap_rare_near":"Без активатора или медиатора общие факторы и полимераза собираются на промоторе редко: в модели инициация редкая. Каждая начатая РНК та же — с той же точки +1 и того же направления.","s2_cap_rare_near_z":"В этой модели регуляторные белки меняют частоту инициации, но не место её начала и не последовательность РНК.","s2_cap_rare_far":"Инициация редкая (нет активатора или медиатора), а без 5′→3′-экзонуклеазы полимераза отделяется от ДНК дальше места расщепления, чем в норме.","s2_cap_rare_far_z":"Частоту инициации и место терминации определяют разные белки.","s2_cap_closed":"Без TFIIH на промоторе собирается неполный комплекс (TFIID, TFIIA, TFIIB, РНК-полимераза II с TFIIF, TFIIE), но цепи ДНК у точки +1 не расплетаются: матричная цепь недоступна, и синтез РНК не начинается.","s2_cap_closed_z":"Сборка комплекса на промоторе ещё не означает начала транскрипции: нужно открыть матрицу и освободить полимеразу от промотора.","s2_v_pic_part":"неполный: без TFIIH"},"notes":["Цепи расплетены, полимераза ушла с промотора.","Комплекс собран, но цепи не расплетены: РНК нет."],"static":["Цепи расплетены, полимераза ушла с промотора."]}},"exam_quiz":{"id":"S9-E05","question":"Что происходит с ДНК позади движущейся РНК-полимеразы во время элонгации?","options":[{"id":"S9-E05-1","text":"ДНК остаётся расплетённой до конца гена","correct":false,"feedback":"Расплетён только короткий участок у полимеразы — пузырёк транскрипции."},{"id":"S9-E05-2","text":"Цепи ДНК вновь соединяются в двойную спираль, а РНК отходит от матрицы","correct":true,"feedback":"Спарены с матрицей лишь около девяти нуклеотидов РНК внутри пузырька."},{"id":"S9-E05-3","text":"РНК остаётся спаренной с матрицей по всей длине","correct":false,"feedback":"Позади полимеразы РНК отделяется от матрицы, и ДНК восстанавливает двойную спираль."}]}},{"id":"termination","section":1,"questions":[2],"title":"Терминация РНК-полимеразы II связана с расщеплением 3′-конца","keywords":["сигнал полиаденилирования","расщепление","терминация","5′→3′-экзонуклеаза","торпедная модель","аллостерическая модель"],"lead":["Уже известно: полимераза движется по гену, РНК растёт (БИО-9·9).","Новое: где кончается пре-мРНК и где полимераза покидает ДНК — разные места."],"mechanism":["После того как полимераза транскрибирует [[T25|сигнал AAUAAA]], факторы расщепления и полиаденилирования разрезают пре-мРНК в 10–30 нуклеотидах ниже; к этому [[T26|концу]] добавляется поли(А)-хвост.","Полимераза при этом не останавливается: она продолжает синтез ещё на сотни нуклеотидов и больше.","Белки образования 3′-конца изменяют полимеразу и замедляют её (аллостерическая модель); а РНК, синтезированную после места расщепления, не защищённую кэпом, разрушает [[T28|5′→3′-экзонуклеаза]] и, догнав полимеразу, способствует её отделению (торпедная модель). В клетке, по-видимому, работают оба механизма.","Поэтому положение 3′-конца мРНК определяет расщепление, а не место [[T27|терминации]]."],"paragraphs":["Единой последовательности-«терминатора», на которой РНК-полимераза II мгновенно отделялась бы от ДНК, нет: терминация — растянутый процесс ниже места расщепления.","Если не работает экзонуклеаза, 3′-конец пре-мРНК прежний, а полимераза отделяется от ДНК дальше по гену. Если не происходит расщепления, нет и поли(А)-хвоста, а полимераза идёт далеко за ген."],"conditions":"Схема шага — модель вкладки 2; расстояния условные.","sources":["Alberts2022","Song2026"],"quiz":{"id":"S9-L10","question":"Что определяет положение 3′-конца мРНК?","options":[{"id":"S9-L10-1","text":"Место расщепления пре-мРНК ниже сигнала AAUAAA","correct":true,"feedback":"К концу, созданному расщеплением, добавляется поли(А)-хвост; полимераза отделяется от ДНК позже."},{"id":"S9-L10-2","text":"Место, где РНК-полимераза II отделяется от ДНК","correct":false,"feedback":"Полимераза отделяется дальше по гену, уже после расщепления."},{"id":"S9-L10-3","text":"Последовательность-терминатор, на которой полимераза останавливается","correct":false,"feedback":"Такой последовательности у РНК-полимеразы II нет: терминация связана с расщеплением и экзонуклеазой."}]},"widget":{"kind":"dna","title":"","s":{"title":"Расщепление и терминация","status":"Схема качественная · расстояния условные","modes_label":"Что показать","modes":["экзонуклеаза есть","нет экзонуклеазы"],"scene":"s2b","args":[["tata",{}
