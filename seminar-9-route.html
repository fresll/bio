ватор, связанный с энхансером, через медиатор ускоряет сборку. TFIIH расплетает ДНК у точки +1 и фосфорилирует C-концевой домен полимеразы — она уходит с промотора. После AAUAAA пре-мРНК расщепляется; полимераза ещё некоторое время синтезирует РНК и отделяется от ДНК.","s2_cap_ok_near_tata_z":"РНК-полимераза II сама промотор не узнаёт: место и направление начала задают общие факторы, связанные с промотором.","s2_cap_ok_near_inr":"Промотор без TATA-бокса: TFIID узнаёт другие последовательности у точки +1 (Inr и DPE) своими субъединицами TAF. Комплекс собирается, точка начала и направление синтеза заданы, транскрипция идёт как с TATA-содержащего промотора.","s2_cap_ok_near_inr_z":"TATA-бокс — один из элементов промотора, а не обязательная его часть: у многих генов человека его нет.","s2_cap_ok_far_tata":"Без 5′→3′-экзонуклеазы расщепление после AAUAAA проходит, и 3′-конец пре-мРНК там же, где в норме. Но фрагмент РНК на полимеразе не разрушается, и полимераза отделяется от ДНК дальше, чем в норме: терминация сохраняется, но задерживается.","s2_cap_ok_far_tata_z":"Положение 3′-конца мРНК задаёт расщепление, а не место, где полимераза покидает ДНК; терминация — отдельный, более поздний этап.","s2_cap_ok_far_inr":"Промотор без TATA-бокса работает (TFIID узнаёт Inr и DPE). Без 5′→3′-экзонуклеазы 3′-конец пре-мРНК там же, где в норме, но полимераза отделяется от ДНК дальше, чем в норме.","s2_cap_ok_far_inr_z":"Положение 3′-конца мРНК задаёт расщепление, а не место терминации.","s2_cap_rare_near":"Без активатора или медиатора общие факторы и полимераза собираются на промоторе редко: в модели инициация редкая. Каждая начатая РНК та же — с той же точки +1 и того же направления.","s2_cap_rare_near_z":"В этой модели регуляторные белки меняют частоту инициации, но не место её начала и не последовательность РНК.","s2_cap_rare_far":"Инициация редкая (нет активатора или медиатора), а без 5′→3′-экзонуклеазы полимераза отделяется от ДНК дальше места расщепления, чем в норме.","s2_cap_rare_far_z":"Частоту инициации и место терминации определяют разные белки.","s2_cap_closed":"Без TFIIH на промоторе собирается неполный комплекс (TFIID, TFIIA, TFIIB, РНК-полимераза II с TFIIF, TFIIE), но цепи ДНК у точки +1 не расплетаются: матричная цепь недоступна, и синтез РНК не начинается.","s2_cap_closed_z":"Сборка комплекса на промоторе ещё не означает начала транскрипции: нужно открыть матрицу и освободить полимеразу от промотора.","s2_v_pic_part":"неполный: без TFIIH"},"notes":["3′-конец — в месте расщепления; полимераза отделяется вскоре за ним.","3′-конец там же, но полимераза отделяется намного дальше."],"static":["3′-конец — в месте расщепления; полимераза отделяется вскоре за ним."]}},"exam_quiz":{"id":"S9-E06","question":"Где РНК-полимераза II отделяется от ДНК по отношению к месту расщепления пре-мРНК?","options":[{"id":"S9-E06-1","text":"Точно в месте расщепления","correct":false,"feedback":"3′-конец пре-мРНК задаёт расщепление; полимераза к этому моменту уже ушла дальше."},{"id":"S9-E06-2","text":"На сигнале AAUAAA, ещё до расщепления","correct":false,"feedback":"Сигнал AAUAAA сначала должен быть транскрибирован; расщепление идёт ниже него, а терминация — ещё дальше."},{"id":"S9-E06-3","text":"Ниже по ходу транскрипции: после расщепления она ещё продолжает синтез","correct":true,"feedback":"РНК за местом расщепления разрушается 5′→3′-экзонуклеазой, и полимераза отделяется позже."}]}},{"id":"promoter-proximal","section":1,"questions":[2],"title":"Начатый синтез не всегда становится полным транскриптом","keywords":["пауза у промотора","продуктивная элонгация","преждевременная терминация","Integrator"],"lead":["Уже известно: после ухода с промотора полимераза переходит к элонгации (БИО-9·9).","Новое: у животных этот переход — не автоматический; многие начатые синтезы прекращаются у промотора."],"mechanism":["Синтезировав 20–100 нуклеотидов, РНК-полимераза II обычно останавливается у промотора — это [[T22|пауза]]; её стабилизируют специальные белки.","Из паузы возможны два исхода: переход к продуктивной элонгации (для этого киназа фосфорилирует полимеразу и белки паузы) или преждевременное прекращение синтеза.","Преждевременное прекращение у промотора оказалось широко распространённым: его осуществляет комплекс Integrator, который разрезает растущую РНК, вместе с фосфатазой, снимающей фосфаты, нужные для элонгации.","Отрезанная [[T23|короткая РНК]] быстро разрушается в ядре. Поэтому число начатых синтезов больше числа полных транскриптов."],"paragraphs":["Как это узнали: в клетках человека и других животных останавливали инициацию и измеряли, сколько времени полимеразы остаются у промоторов; другим способом показали, что полимеразы у промотора сменяются быстрее, чем уходят в элонгацию. Значит, часть их прекращает синтез у промотора.","Граница вывода: это сводка многих работ в обзоре; доля прекращающих синтез полимераз различается у разных генов и не измерена здесь для какого-либо конкретного гена.","Связанная модель — в практикуме: вопрос 2, уровень «Продвинутый» (поток молекул РНК-полимеразы II: инициация, пауза, продуктивная элонгация); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Данные — клетки животных и человека; сводка в обзоре.","sources":["Song2026"],"quiz":{"id":"S9-L11","question":"Что из перечисленного согласуется с широко распространённым преждевременным прекращением синтеза у промоторов?","options":[{"id":"S9-L11-1","text":"Каждый начатый синтез обязательно даёт полную пре-мРНК","correct":false,"feedback":"Это противоречит данным: многие начатые синтезы прекращаются у промотора."},{"id":"S9-L11-2","text":"Число начатых синтезов РНК больше числа полных транскриптов","correct":true,"feedback":"Часть полимераз прекращает синтез после паузы, и их короткие РНК разрушаются."},{"id":"S9-L11-3","text":"Пауза у промотора возникает только при повреждении ДНК","correct":false,"feedback":"Пауза — обычный этап транскрипции многих генов животных."}]},"widget":{"kind":"dna","title":"","s":{"title":"Начатые и завершённые транскрипты (условные числа)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["контроль","мало полимераз переходит к элонгации"],"scene":"a2","args":[[2,0.9,0],[2,0.25,0]],"L":{"s2a_prob":"Начатый синтез РНК не всегда доходит до конца гена: РНК-полимераза II после начала синтеза делает паузу, и часть полимераз прекращает синтез у промотора или позже. Почему число начатых транскриптов не равно числу завершённых и как по наблюдениям различить причины, если завершённых мало?","s2a_ki":"Частота инициации (условно)","s2a_u_min":"в мин","s2a_ki_05":"0,5","s2a_ki_1":"1","s2a_ki_2":"2","s2a_pr":"Переходят к продуктивной элонгации после паузы","s2a_u_pc":"%","s2a_pr_25":"25 %","s2a_pr_50":"50 %","s2a_pr_90":"90 %","s2a_pl":"Из перешедших прекращают синтез в теле гена","s2a_pl_0":"0 %","s2a_pl_40":"40 %","s2a_pl_75":"75 %","s2a_note":"Наблюдение — 30 мин от начала активности гена. Все значения — учебные допущения модели, а не измеренные константы: прохождение гена — 10 мин, полимеразы, прекращающие синтез в теле гена, останавливаются на его середине. Числа — средние ожидаемые, округлённые до целых.","s2a_pA":"А. Ген через {m} мин","s2a_pA_mask":"А. Ген через {m} мин: известно только число завершённых РНК","s2a_pB":"Б. Исходы начатых синтезов (условные числа)","s2a_lbl_prom":"промотор","s2a_lbl_body":"тело гена","s2a_lbl_end":"конец гена","s2a_lbl_short":"коротких РНК у промотора: {n}","s2a_lbl_lost":"прекращено в теле гена: {n}","s2a_lbl_done":"завершено: {n}","s2a_lbl_maskobs":"Завершено {n} транскриптов; в контроле — {k}","s2a_lbl_sum":"{a} начато = {b} у промотора + {c} в теле гена + {d} на гене сейчас + {e} завершено","s2a_bar_init":"начато","s2a_bar_prom":"прекращено\nу промотора","s2a_bar_lost":"прекращено\nв теле гена","s2a_bar_ongene":"на гене\nсейчас","s2a_bar_done":"завершено","s2a_bar_ctrl":"контроль","s2a_r_init":"Начато синтезов","s2a_r_init_s":"за 30 мин","s2a_r_prom":"Прекращено у промотора","s2a_r_lost":"Прекращено в теле гена","s2a_r_ongene":"На гене сейчас","s2a_r_done":"Завершено полных транскриптов","s2a_r_done_s":"за 30 мин","s2a_r_ctrl":"Завершено в контроле","s2a_v_n":"{n}","s2a_cap_ctrl":"Контроль модели: частота инициации — 2 в минуту, 90 % полимераз после паузы переходят к продуктивной элонгации, в теле гена синтез не прекращается. За 30 мин завершено {d} транскриптов — меньше, чем начато: часть полимераз ещё на гене, часть прекратила синтез у промотора.","s2a_cap_ctrl_z":"Даже без нарушений число завершённых РНК меньше числа начатых: синтез занимает время, а часть начатых синтезов непродуктивна.","s2a_cap_init":"Инициация стала реже, а доля продуктивных прежняя: все счётчики уменьшились пропорционально. Завершено {d} (в контроле {k}); коротких РНК у промотора почти нет.","s2a_cap_init_z":"При редкой инициации мало и начатых, и прекращённых синтезов: соотношение между ними не меняется.","s2a_cap_init_mix":"Изменено несколько условий сразу: инициация реже, и ещё ослаблен другой этап. Завершено {d} (в контроле {k}).","s2a_cap_init_mix_z":"При нескольких нарушениях их вклады перемножаются; чтобы отделить их, нужны счётчики разных этапов.","s2a_cap_pause":"Начатых синтезов столько же, но большинство полимераз прекращает синтез у промотора после паузы: коротких РНК много, завершено лишь {d} (в контроле {k}).","s2a_cap_pause_z":"Инициация не гарантирует полного транскрипта: решающим может быть переход от паузы к продуктивной элонгации.","s2a_cap_pause_mix":"Ослаблены два этапа после инициации: переход от паузы и продолжение синтеза в теле гена. Завершено {d} (в контроле {k}).","s2a_cap_pause_mix_z":"Короткие РНК у промотора и прекращённые в теле гена — разные признаки двух этапов.","s2a_cap_body":"Инициация и паузы как в контроле, но большинство продуктивных полимераз прекращает синтез в теле гена: много незавершённых РНК середины гена, завершено {d} (в контроле {k}).","s2a_cap_body_z":"Потеря продуктивности после ухода от промотора не видна по числу начатых синтезов и коротких РНК.","s2a_cap_mask":"Обратная задача: известно только число завершённых транскриптов. Значения параметров скрыты.","s2a_cap_mask_z":"Подумайте, сколько разных сочетаний условий дают такой же итог.","s2a_take":"Число завершённых транскриптов зависит от трёх независимых этапов: частоты инициации, перехода от паузы к продуктивной элонгации и продолжения синтеза до конца гена; их доли перемножаются. Одинаково малое число завершённых РНК могут дать разные причины, поэтому одно это число на причину не указывает. Различить их можно по дополнительным наблюдениям: числу начатых синтезов, количеству коротких РНК у промотора и незавершённых РНК в теле гена.","s2a_lim":"Все значения модели — учебные допущения: частоты, доли и время прохождения гена не измерены для какого-либо гена. Модель не показывает, что инициация идёт вспышками, что пауза длится разное время у разных генов, что прекратившая синтез полимераза может уйти с ДНК или быть разрушена, и что короткие РНК быстро разрушаются в ядре (в модели они считаются, а не наблюдаются напрямую). Модель не показывает и регуляцию, меняющую эти доли, — это семинар 11 и курс «Молекулярная биология».","s2a_new":"У животных и человека РНК-полимераза II, синтезировав 20–100 нуклеотидов, обычно останавливается у промотора (пауза). Дальше возможны два исхода: полимераза переходит к продуктивной элонгации или прекращает синтез тут же, и короткая РНК разрушается. Оказалось, что такое преждевременное прекращение у промотора — не редкая ошибка, а широко распространённый исход: за его счёт меняется, сколько начатых синтезов становятся полными транскриптами. Отрезает растущую РНК и освобождает полимеразу специальный белковый комплекс (Integrator), работающий вместе с фосфатазой.","s2a_how":"в клетках человека и других животных останавливали инициацию и измеряли, сколько времени полимеразы остаются у промоторов; другим способом показали, что полимеразы у промотора сменяются быстрее, чем уходят в элонгацию, — значит, часть их прекращает синтез. Это сводка многих работ в обзоре; доли для конкретных генов различаются.","s2a_tl_note":"Шкала — время наблюдения, по 5 мин на этап. Все числа на схеме — условные средние, округлённые до целых.","s2a_tl_1":"0–5 мин: начинается инициация; часть полимераз после паузы прекращает синтез у промотора.","s2a_tl_2":"5–10 мин: продуктивные полимеразы движутся по гену; часть их может прекратить синтез на середине гена.","s2a_tl_3":"10–15 мин: первые полимеразы дошли до конца гена — появились первые завершённые транскрипты; с этого момента число полимераз на гене постоянно.","s2a_tl_4":"15–20 мин: сколько полимераз начинает синтез, столько его завершает или прекращает; завершённые транскрипты накапливаются.","s2a_tl_5":"20–25 мин: счётчики растут с постоянной скоростью.","s2a_tl_6":"25–30 мин: итог; в каждый момент начато = прекращено у промотора + прекращено в гене + на гене + завершено.","s2a_ms":"Через {m} мин:"},"notes":["За 30 мин начато 60 синтезов, завершено 36.","Начато столько же, но 45 синтезов прекратились у промотора; завершено 10."],"static":["За 30 мин начато 60 синтезов, завершено 36."]}},"level":"adv"},{"id":"few-complete","section":1,"questions":[2],"title":"Мало завершённых транскриптов — разные причины","keywords":["обратная задача","частота инициации","пауза","потеря продуктивности","дополнительное наблюдение"],"lead":["Уже известно: путь от инициации до полного транскрипта включает несколько этапов (БИО-9·11).","Новое: одинаково малое число завершённых РНК могут дать разные нарушения, и одного этого числа недостаточно для вывода."],"mechanism":["В учебной модели число транскриптов, завершённых за время наблюдения t (больше 10 мин), = частота инициации × доля, перешедшая после паузы к продуктивной элонгации, × доля, дошедшая до конца гена, × (t − 10 мин): первые 10 мин полимеразы ещё проходят ген. В контроле за 30 мин: 2 в минуту × 0,9 × 1 × 20 мин = 36; за первые 10 мин — ни одного.","Около 10 завершённых за 30 мин (в контроле 36) дают каждое из трёх нарушений по отдельности — редкая инициация (0,5 в минуту), переход от паузы лишь у 25 % полимераз, прекращение синтеза в теле гена у 75 % продуктивных полимераз — и их сочетания (например, инициация 1 в минуту и переход от паузы у 50 % полимераз).","Если нарушение одно, различить причины помогают счётчики других этапов: число начатых синтезов (15 против 60), короткие РНК у промотора (45 при нарушении перехода от паузы, 6 при прекращении в теле гена) и незавершённые РНК середины гена.","В каждый момент начато = прекращено у промотора + прекращено в теле гена + на гене сейчас + завершено: молекулы не возникают и не исчезают без перехода."],"paragraphs":["Все числа модели — учебные допущения, а не измеренные константы: время прохождения гена (10 мин) и доли подобраны так, чтобы итоги были сопоставимы.","Это общий принцип семинара: один и тот же наблюдаемый результат может возникнуть при нарушении разных процессов, поэтому вывод о причине требует наблюдения, по которому гипотезы предсказывают разное.","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель 2а; принцип этапов — по учебнику и обзору о терминации.","sources":["Alberts2022","Song2026"],"quiz":{"id":"S9-L12","question":"Завершённых транскриптов мало, число начатых синтезов как в контроле, коротких РНК у промотора тоже как в контроле. Какая причина вероятнее в модели?","options":[{"id":"S9-L12-1","text":"Редкая инициация","correct":false,"feedback":"При редкой инициации число начатых синтезов было бы снижено."},{"id":"S9-L12-2","text":"Нарушение перехода от паузы к элонгации","correct":false,"feedback":"Тогда коротких РНК у промотора было бы намного больше."},{"id":"S9-L12-3","text":"Прекращение синтеза в теле гена","correct":true,"feedback":"Инициация и переход от паузы в норме; остаётся более поздний этап."}]},"widget":{"kind":"dna","title":"","s":{"title":"Три причины — одинаковый итог (условные числа)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["редкая инициация","мало переходит от паузы","прекращение в теле гена"],"scene":"a2","args":[[0.5,0.9,0],[2,0.25,0],[2,0.9,0.75]],"L":{"s2a_prob":"Начатый синтез РНК не всегда доходит до конца гена: РНК-полимераза II после начала синтеза делает паузу, и часть полимераз прекращает синтез у промотора или позже. Почему число начатых транскриптов не равно числу завершённых и как по наблюдениям различить причины, если завершённых мало?","s2a_ki":"Частота инициации (условно)","s2a_u_min":"в мин","s2a_ki_05":"0,5","s2a_ki_1":"1","s2a_ki_2":"2","s2a_pr":"Переходят к продуктивной элонгации после паузы","s2a_u_pc":"%","s2a_pr_25":"25 %","s2a_pr_50":"50 %","s2a_pr_90":"90 %","s2a_pl":"Из перешедших прекращают синтез в теле гена","s2a_pl_0":"0 %","s2a_pl_40":"40 %","s2a_pl_75":"75 %","s2a_note":"Наблюдение — 30 мин от начала активности гена. Все значения — учебные допущения модели, а не измеренные константы: прохождение гена — 10 мин, полимеразы, прекращающие синтез в теле гена, останавливаются на его середине. Числа — средние ожидаемые, округлённые до целых.","s2a_pA":"А. Ген через {m} мин","s2a_pA_mask":"А. Ген через {m} мин: известно только число завершённых РНК","s2a_pB":"Б. Исходы начатых синтезов (условные числа)","s2a_lbl_prom":"промотор","s2a_lbl_body":"тело гена","s2a_lbl_end":"конец гена","s2a_lbl_short":"коротких РНК у промотора: {n}","s2a_lbl_lost":"прекращено в теле гена: {n}","s2a_lbl_done":"завершено: {n}","s2a_lbl_maskobs":"Завершено {n} транскриптов; в контроле — {k}","s2a_lbl_sum":"{a} начато = {b} у промотора + {c} в теле гена + {d} на гене сейчас + {e} завершено","s2a_bar_init":"начато","s2a_bar_prom":"прекращено\nу промотора","s2a_bar_lost":"прекращено\nв теле гена","s2a_bar_ongene":"на гене\nсейчас","s2a_bar_done":"завершено","s2a_bar_ctrl":"контроль","s2a_r_init":"Начато синтезов","s2a_r_init_s":"за 30 мин","s2a_r_prom":"Прекращено у промотора","s2a_r_lost":"Прекращено в теле гена","s2a_r_ongene":"На гене сейчас","s2a_r_done":"Завершено полных транскриптов","s2a_r_done_s":"за 30 мин","s2a_r_ctrl":"Завершено в контроле","s2a_v_n":"{n}","s2a_cap_ctrl":"Контроль модели: частота инициации — 2 в минуту, 90 % полимераз после паузы переходят к продуктивной элонгации, в теле гена синтез не прекращается. За 30 мин завершено {d} транскриптов — меньше, чем начато: часть полимераз ещё на гене, часть прекратила синтез у промотора.","s2a_cap_ctrl_z":"Даже без нарушений число завершённых РНК меньше числа начатых: синтез занимает время, а часть начатых синтезов непродуктивна.","s2a_cap_init":"Инициация стала реже, а доля продуктивных прежняя: все счётчики уменьшились пропорционально. Завершено {d} (в контроле {k}); коротких РНК у промотора почти нет.","s2a_cap_init_z":"При редкой инициации мало и начатых, и прекращённых синтезов: соотношение между ними не меняется.","s2a_cap_init_mix":"Изменено несколько условий сразу: инициация реже, и ещё ослаблен другой этап. Завершено {d} (в контроле {k}).","s2a_cap_init_mix_z":"При нескольких нарушениях их вклады перемножаются; чтобы отделить их, нужны счётчики разных этапов.","s2a_cap_pause":"Начатых синтезов столько же, но большинство полимераз прекращает синтез у промотора после паузы: коротких РНК много, завершено лишь {d} (в контроле {k}).","s2a_cap_pause_z":"Инициация не гарантирует полного транскрипта: решающим может быть переход от паузы к продуктивной элонгации.","s2a_cap_pause_mix":"Ослаблены два этапа после инициации: переход от паузы и продолжение синтеза в теле гена. Завершено {d} (в контроле {k}).","s2a_cap_pause_mix_z":"Короткие РНК у промотора и прекращённые в теле гена — разные признаки двух этапов.","s2a_cap_body":"Инициация и паузы как в контроле, но большинство продуктивных полимераз прекращает синтез в теле гена: много незавершённых РНК середины гена, завершено {d} (в контроле {k}).","s2a_cap_body_z":"Потеря продуктивности после ухода от промотора не видна по числу начатых синтезов и коротких РНК.","s2a_cap_mask":"Обратная задача: известно только число завершённых транскриптов. Значения параметров скрыты.","s2a_cap_mask_z":"Подумайте, сколько разных сочетаний условий дают такой же итог.","s2a_take":"Число завершённых транскриптов зависит от трёх независимых этапов: частоты инициации, перехода от паузы к продуктивной элонгации и продолжения синтеза до конца гена; их доли перемножаются. Одинаково малое число завершённых РНК могут дать разные причины, поэтому одно это число на причину не указывает. Различить их можно по дополнительным наблюдениям: числу начатых синтезов, количеству коротких РНК у промотора и незавершённых РНК в теле гена.","s2a_lim":"Все значения модели — учебные допущения: частоты, доли и время прохождения гена не измерены для какого-либо гена. Модель не показывает, что инициация идёт вспышками, что пауза длится разное время у разных генов, что прекратившая синтез полимераза может уйти с ДНК или быть разрушена, и что короткие РНК быстро разрушаются в ядре (в модели они считаются, а не наблюдаются напрямую). Модель не показывает и регуляцию, меняющую эти доли, — это семинар 11 и курс «Молекулярная биология».","s2a_new":"У животных и человека РНК-полимераза II, синтезировав 20–100 нуклеотидов, обычно останавливается у промотора (пауза). Дальше возможны два исхода: полимераза переходит к продуктивной элонгации или прекращает синтез тут же, и короткая РНК разрушается. Оказалось, что такое преждевременное прекращение у промотора — не редкая ошибка, а широко распространённый исход: за его счёт меняется, сколько начатых синтезов становятся полными транскриптами. Отрезает растущую РНК и освобождает полимеразу специальный белковый комплекс (Integrator), работающий вместе с фосфатазой.","s2a_how":"в клетках человека и других животных останавливали инициацию и измеряли, сколько времени полимеразы остаются у промоторов; другим способом показали, что полимеразы у промотора сменяются быстрее, чем уходят в элонгацию, — значит, часть их прекращает синтез. Это сводка многих работ в обзоре; доли для конкретных генов различаются.","s2a_tl_note":"Шкала — время наблюдения, по 5 мин на этап. Все числа на схеме — условные средние, округлённые до целых.","s2a_tl_1":"0–5 мин: начинается инициация; часть полимераз после паузы прекращает синтез у промотора.","s2a_tl_2":"5–10 мин: продуктивные полимеразы движутся по гену; часть их может прекратить синтез на середине гена.","s2a_tl_3":"10–15 мин: первые полимеразы дошли до конца гена — появились первые завершённые транскрипты; с этого момента число полимераз на гене постоянно.","s2a_tl_4":"15–20 мин: сколько полимераз начинает синтез, столько его завершает или прекращает; завершённые транскрипты накапливаются.","s2a_tl_5":"20–25 мин: счётчики растут с постоянной скоростью.","s2a_tl_6":"25–30 мин: итог; в каждый момент начато = прекращено у промотора + прекращено в гене + на гене + завершено.","s2a_ms":"Через {m} мин:"},"notes":["Начато 15, завершено 9.","Начато 60, у промотора прекращено 45, завершено 10.","Начато 60, в теле гена прекращено 34, завершено 9."],"static":["Начато 15, завершено 9."]}},"level":"adv"},{"id":"primary-transcript","section":2,"questions":[3],"title":"Первичный транскрипт и котранскрипционный процессинг","keywords":["первичный транскрипт","пре-мРНК","процессинг","котранскрипционный процессинг","зрелая мРНК"],"lead":["Уже известно: C-концевой домен РНК-полимеразы II связывает белки процессинга (БИО-9·9).","Новое: пре-мРНК созревает в ядре в три основных события, и большая их часть идёт во время транскрипции.","Раздел относится к вопросу 10 коллоквиума 2 (предварительный список) и вопросу 20 зачёта."],"mechanism":["[[T30|Пре-мРНК]] повторяет организацию гена: содержит экзоны и интроны и ещё не служит матрицей для трансляции.","[[T62|Процессинг пре-мРНК]] — совокупность реакций, превращающих её в [[T65|зрелую мРНК]]: кэпирование 5′-конца, сплайсинг (удаление интронов и соединение экзонов), расщепление 3′-конца и [[T64|полиаденилирование]].","Эти события в значительной мере сопряжены с транскрипцией ([[T63|котранскрипционный процессинг]]): белки процессинга связываются с C-концевым доменом и получают доступ к РНК по мере её выхода из полимеразы.","Поэтому процессинг — не обязательно цепочка операций после завершения синтеза: кэп присоединяется к растущей РНК, многие интроны удаляются, пока полимераза транскрибирует дальние участки гена."],"paragraphs":["Интроны у млекопитающих составляют около 90 % длины пре-мРНК и удаляются в ядре. Сплайсинг многих из них начинается, пока полимераза ещё транскрибирует ген: сплайсосома собирается на растущей РНК. Насколько быстро удаляется каждый интрон, различается у разных интронов и генов (БИО-9·18).","Зрелая мРНК вместе с белками образует мРНП и только тогда экспортируется ([[T66|ядерный экспорт мРНК]]). Процессинг не равен экспорту: созревшая мРНК без рецептора экспорта остаётся в ядре."],"conditions":"Схема шага — модель вкладки 3; порядок этапов на шкале — учебный, в клетке они перекрываются во времени.","sources":["Alberts2022","Shine2024"],"quiz":{"id":"S9-L13","question":"Какое утверждение о процессинге пре-мРНК верно?","options":[{"id":"S9-L13-1","text":"Многие события процессинга идут во время транскрипции, ещё до её окончания","correct":true,"feedback":"Кэп присоединяется к растущей РНК, многие интроны удаляются котранскрипционно."},{"id":"S9-L13-2","text":"Процессинг начинается только после того, как полимераза покинула ДНК","correct":false,"feedback":"Белки процессинга связаны с полимеразой и работают по ходу синтеза."},{"id":"S9-L13-3","text":"Процессинг пре-мРНК идёт в цитоплазме, после экспорта","correct":false,"feedback":"Кэпирование, сплайсинг и образование 3′-конца проходят в ядре."}]},"widget":{"kind":"dna","title":"","s":{"title":"Процессинг во время транскрипции","status":"Схема качественная","modes_label":"Что показать","modes":["все детали на месте"],"scene":"s3b","args":[[{}]],"L":{"s3k_title":"Белки процессинга и экспорта: нажмите на гнездо, чтобы вынуть деталь","s3k_hint":"Вынутая деталь возвращается нажатием в лотке.","s3k_cap":"Ферменты кэпирования","s3k_spl":"Сплайсосома","s3k_cpa":"Факторы расщепления и поли­аденили­рования","s3k_exp":"Рецептор экспорта мРНК (NXF1–NXT1)","s3_ctrl_note":"Ген из трёх экзонов и двух интронов транскрибирует РНК-полимераза II клетки человека. Предскажите, где окажется РНК этого гена и в каком виде. Длины участков на схеме условные.","s3_pN":"Ядро","s3_pC":"Цитоплазма","s3_e_spl":"сплайсосома","s3_e_cap":"ферменты кэпирования","s3_lbl_lariat":"интрон в виде лассо","s3_lbl_tr":"зрелая мРНК в цитоплазме — матрица для трансляции","s3_lbl_done":"транскрипция гена завершена","s3_lbl_deg5":"РНК без кэпа: после обработки 5′-конца разрушается; синтез может обрываться рано","s3_lbl_nospl":"интроны не удалены: РНК задерживается в ядре и разрушается","s3_lbl_nocpa":"3′-конец не образован: РНК задерживается в ядре и разрушается","s3_lbl_noexp":"зрелая мРНК накапливается в ядре: рецептора экспорта нет","s3_r_cap":"Кэп на 5′-конце","s3_r_cap_s":"7-метилгуанозин, связанный 5′–5′","s3_v_cap_yes":"есть","s3_v_cap_no":"нет","s3_r_intr":"Интроны","s3_v_intr_no":"удалены","s3_v_intr_yes":"остались","s3_v_na":"—","s3_r_3":"3′-конец","s3_r_3_s":"расщепление после AAUAAA и поли(А)","s3_v_3_yes":"расщеплён, есть поли(А)-хвост","s3_v_3_no":"не расщеплён, поли(А) нет","s3_r_where":"Где РНК этого гена","s3_v_where_cyt":"в цитоплазме","s3_v_where_nuc":"только в ядре","s3_v_where_none":"почти нет нигде","s3_r_fate":"Что с ней дальше","s3_v_fate_tr":"матрица для трансляции","s3_v_fate_ret":"задержана в ядре и разрушается","s3_v_fate_nuc":"накапливается в ядре","s3_v_fate_deg5":"разрушается сразу после начала синтеза","s3_cap_ok":"Процессинг идёт во время транскрипции: кэп присоединяется к 5′-концу, как только он выходит из РНК-полимеразы; первый интрон удаляется, пока полимераза ещё транскрибирует дальние участки гена; после AAUAAA пре-мРНК расщепляется и получает поли(А)-хвост. Зрелая мРНК с белками (мРНП) связывается с рецептором экспорта и выходит через ядерную пору.","s3_cap_ok_z":"Белки, присоединённые при кэпировании, сплайсинге и образовании 3′-конца, отличают зрелую мРНК от промежуточных продуктов: из ядра выходит в основном она.","s3_cap_nocap":"Без ферментов кэпирования 5′-конец РНК остаётся трифосфатным и не защищён: после того как ферменты ядерного контроля качества изменят его, такие РНК быстро становятся субстратом 5′→3′-экзонуклеазы и разрушаются; синтез их может обрываться вскоре после начала. Зрелой мРНК этого гена нет ни в ядре, ни в цитоплазме.","s3_cap_nocap_z":"Кэп защищает 5′-конец; связанный с ним кэп-связывающий комплекс помогает дальнейшему процессингу и экспорту, а в цитоплазме кэп нужен для инициации трансляции.","s3_cap_nospl":"Без сплайсосомы интроны остаются в РНК; кэп и поли(А)-хвост в модели есть. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_z":"РНК с неудалёнными интронами в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nospl_cpa":"Без сплайсосомы интроны остаются в РНК, а без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_cpa_z":"РНК с неудалёнными интронами и без поли(А)-хвоста в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nocpa":"Без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост; полимераза продолжает синтез дальше по ДНК. Первый интрон удалён, а удаление последнего связано с образованием 3′-конца, и в модели он остаётся. Такая РНК задерживается в ядре и разрушается.","s3_cap_nocpa_z":"Поли(А)-хвост не закодирован в гене: его добавляет поли(А)-полимераза после расщепления. Без расщепления нет и хвоста.","s3_cap_noexp":"Процессинг прошёл полностью: у мРНК есть кэп и поли(А)-хвост, интроны удалены. Но без рецептора экспорта мРНП не проходит через ядерную пору и накапливается в ядре; в цитоплазме мРНК этого гена нет.","s3_cap_noexp_z":"Зрелость мРНК необходима для экспорта, но не достаточна: нужен ещё рецептор экспорта. Экспорт мРНП идёт без сигнала ядерной локализации и импортина — иначе, чем импорт белков в ядро.","s3_v_intr_part":"первый удалён, последний остался"},"notes":["Кэп, сплайсинг, 3′-конец и экспорт — мРНК в цитоплазме."],"static":["Кэп, сплайсинг, 3′-конец и экспорт — мРНК в цитоплазме."]}}},{"id":"capping","section":2,"questions":[3],"title":"Кэпирование 5′-конца","keywords":["кэп","7-метилгуанозин","5′–5′-связь","ферменты кэпирования","защита от экзонуклеаз"],"lead":["Уже известно: первый нуклеотид РНК несёт три фосфата.","Новое: как этот конец превращается в кэп и зачем он нужен."],"mechanism":["Когда РНК-полимераза II синтезировала около 20 нуклеотидов РНК и её 5′-конец выходит из полимеразы, [[T32|ферменты кэпирования]], связанные с C-концевым доменом (фосфорилированным по серину 5), модифицируют её 5′-конец.","РНК-трифосфатаза удаляет концевой фосфат, гуанилилтрансфераза присоединяет ГМФ (из ГТФ) необычной 5′–5′-трифосфатной связью, метилтрансфераза метилирует гуанин по атому азота в положении 7.","[[T31|Кэп]] защищает 5′-конец от 5′→3′-экзонуклеаз; в ядре с ним связывается кэп-связывающий комплекс, который помогает дальнейшему процессингу и экспорту; в цитоплазме кэп нужен для инициации трансляции.","У РНК без кэпа 5′-конец остаётся трифосфатным; ферменты ядерного контроля качества изменяют его, после чего РНК разрушается от 5′-конца, а синтез таких РНК может обрываться вскоре после начала."],"paragraphs":["Кэп из 7-метилгуанозина отличает мРНК от РНК, синтезированных РНК-полимеразами I и III: их транскрипты такого кэпа не получают (5′-конец некоторых транскриптов РНК-полимеразы III модифицирован иначе).","Кэп и поли(А)-хвост не закодированы в гене: их присоединяют ферменты процессинга."],"co акторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_cpa_z":"РНК с неудалёнными интронами и без поли(А)-хвоста в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nocpa":"Без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост; полимераза продолжает синтез дальше по ДНК. Первый интрон удалён, а удаление последнего связано с образованием 3′-конца, и в модели он остаётся. Такая РНК задерживается в ядре и разрушается.","s3_cap_nocpa_z":"Поли(А)-хвост не закодирован в гене: его добавляет поли(А)-полимераза после расщепления. Без расщепления нет и хвоста.","s3_cap_noexp":"Процессинг прошёл полностью: у мРНК есть кэп и поли(А)-хвост, интроны удалены. Но без рецептора экспорта мРНП не проходит через ядерную пору и накапливается в ядре; в цитоплазме мРНК этого гена нет.","s3_cap_noexp_z":"Зрелость мРНК необходима для экспорта, но не достаточна: нужен ещё рецептор экспорта. Экспорт мРНП идёт без сигнала ядерной локализации и импортина — иначе, чем импорт белков в ядро.","s3_v_intr_part":"первый удалён, последний остался"},"notes":["мРНК созревает и выходит в цитоплазму.","РНК без кэпа разрушается вскоре после начала синтеза."],"static":["мРНК созревает и выходит в цитоплазму."]}},"exam_quiz":{"id":"S9-E07","question":"Когда пре-мРНК получает кэп?","options":[{"id":"S9-E07-1","text":"Во время транскрипции, когда синтезировано около 20 нуклеотидов РНК","correct":true,"feedback":"Ферменты кэпирования связаны с фосфорилированным C-концевым доменом и действуют на растущую РНК."},{"id":"S9-E07-2","text":"После окончания транскрипции и сплайсинга","correct":false,"feedback":"Кэпирование — первая модификация пре-мРНК, задолго до окончания синтеза."},{"id":"S9-E07-3","text":"В цитоплазме, перед трансляцией","correct":false,"feedback":"Кэп присоединяется в ядре; в цитоплазму выходит уже кэпированная мРНК."}]}},{"id":"splicing","section":2,"questions":[3,4],"title":"Сплайсинг: границы интрона, сплайсосома и лассо","keywords":["интрон","экзон","сайты сплайсинга","точка ветвления","сплайсосома","малые ядерные РНК","лассо"],"lead":["Уже известно: пре-мРНК содержит интроны.","Новое: как сплайсосома узнаёт интрон и удаляет его."],"mechanism":["[[T35|Интрон]] обычно начинается с GU (5′-[[T38|сайт сплайсинга]]) и заканчивается AG (3′-сайт); внутри него, недалеко от 3′-сайта, — аденозин точки ветвления.","[[T36|Сплайсосома]] — пять малых ядерных РНК (U1, U2, U4, U5, U6) и множество белков. U1 спаривается с 5′-сайтом, U2 — с участком точки ветвления; так узнаются границы интрона.","Первая реакция: 2′-OH аденозина точки ветвления атакует 5′-сайт, и 5′-конец интрона присоединяется к нему, образуя [[T37|лассо]]. Вторая реакция: освободившийся 3′-OH экзона атакует 3′-сайт, экзоны соединяются, интрон уходит в виде лассо.","Обе реакции — переэтерификации (одна связь заменяется другой), поэтому отдельный фермент-лигаза не нужен; каталитический центр сплайсосомы образуют её РНК. АТФ тратится на перестройки сплайсосомы, которые проверяют правильность сайтов."],"paragraphs":["На месте соединения экзонов сплайсосома оставляет [[T41|комплекс соединения экзонов]] — белки, которые отмечают завершённый сплайсинг и участвуют в экспорте.","Порядок удаления интронов не обязательно совпадает с их порядком в гене; часть интронов удаляется уже после окончания синтеза, но всё равно в ядре (сверх программы — БИО-9·18)."],"conditions":"Схема шага — модель вкладки 3; длины условные.","sources":["Alberts2022"],"quiz":{"id":"S9-L15","question":"Почему для соединения экзонов при сплайсинге пре-мРНК не нужна отдельная ДНК- или РНК-лигаза?","options":[{"id":"S9-L15-1","text":"Экзоны соединяет поли(А)-полимераза","correct":false,"feedback":"Поли(А)-полимераза добавляет адениловые остатки к 3′-концу, экзоны она не соединяет."},{"id":"S9-L15-2","text":"Экзоны не соединяются: они остаются отдельными молекулами","correct":false,"feedback":"После сплайсинга экзоны образуют одну непрерывную молекулу мРНК."},{"id":"S9-L15-3","text":"Обе реакции — переэтерификации: одна фосфодиэфирная связь заменяется другой","correct":true,"feedback":"Число связей не меняется; новая связь между экзонами образуется за счёт разрыва связи на 3′-сайте."}]},"widget":{"kind":"dna","title":"","s":{"title":"Сплайсосома есть / нет","status":"Схема качественная","modes_label":"Что показать","modes":["сплайсосома есть","нет сплайсосомы"],"scene":"s3b","args":[[{}],[{"spl":false}]],"L":{"s3k_title":"Белки процессинга и экспорта: нажмите на гнездо, чтобы вынуть деталь","s3k_hint":"Вынутая деталь возвращается нажатием в лотке.","s3k_cap":"Ферменты кэпирования","s3k_spl":"Сплайсосома","s3k_cpa":"Факторы расщепления и поли­аденили­рования","s3k_exp":"Рецептор экспорта мРНК (NXF1–NXT1)","s3_ctrl_note":"Ген из трёх экзонов и двух интронов транскрибирует РНК-полимераза II клетки человека. Предскажите, где окажется РНК этого гена и в каком виде. Длины участков на схеме условные.","s3_pN":"Ядро","s3_pC":"Цитоплазма","s3_e_spl":"сплайсосома","s3_e_cap":"ферменты кэпирования","s3_lbl_lariat":"интрон в виде лассо","s3_lbl_tr":"зрелая мРНК в цитоплазме — матрица для трансляции","s3_lbl_done":"транскрипция гена завершена","s3_lbl_deg5":"РНК без кэпа: после обработки 5′-конца разрушается; синтез может обрываться рано","s3_lbl_nospl":"интроны не удалены: РНК задерживается в ядре и разрушается","s3_lbl_nocpa":"3′-конец не образован: РНК задерживается в ядре и разрушается","s3_lbl_noexp":"зрелая мРНК накапливается в ядре: рецептора экспорта нет","s3_r_cap":"Кэп на 5′-конце","s3_r_cap_s":"7-метилгуанозин, связанный 5′–5′","s3_v_cap_yes":"есть","s3_v_cap_no":"нет","s3_r_intr":"Интроны","s3_v_intr_no":"удалены","s3_v_intr_yes":"остались","s3_v_na":"—","s3_r_3":"3′-конец","s3_r_3_s":"расщепление после AAUAAA и поли(А)","s3_v_3_yes":"расщеплён, есть поли(А)- ся.","s3_cap_nospl_cpa_z":"РНК с неудалёнными интронами и без поли(А)-хвоста в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nocpa":"Без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост; полимераза продолжает синтез дальше по ДНК. Первый интрон удалён, а удаление последнего связано с образованием 3′-конца, и в модели он остаётся. Такая РНК задерживается в ядре и разрушается.","s3_cap_nocpa_z":"Поли(А)-хвост не закодирован в гене: его добавляет поли(А)-полимераза после расщепления. Без расщепления нет и хвоста.","s3_cap_noexp":"Процессинг прошёл полностью: у мРНК есть кэп и поли(А)-хвост, интроны удалены. Но без рецептора экспорта мРНП не проходит через ядерную пору и накапливается в ядре; в цитоплазме мРНК этого гена нет.","s3_cap_noexp_z":"Зрелость мРНК необходима для экспорта, но не достаточна: нужен ещё рецептор экспорта. Экспорт мРНП идёт без сигнала ядерной локализации и импортина — иначе, чем импорт белков в ядро.","s3_v_intr_part":"первый удалён, последний остался"},"notes":["Интроны удалены, мРНК в цитоплазме.","Интроны остались: РНК задерживается в ядре и разрушается."],"static":["Интроны удалены, мРНК в цитоплазме."]}}},{"id":"three-prime-end","section":2,"questions":[3],"title":"3′-конец: расщепление и полиаденилирование","keywords":["AAUAAA","CPSF","CstF","расщепление","поли(А)-полимераза","поли(А)-хвост"],"lead":["Уже известно: 3′-конец пре-мРНК задаёт расщепление (БИО-9·10).","Новое: как образуется поли(А)-хвост и зачем он нужен."],"mechanism":["[[T42|Факторы расщепления и полиаденилирования]] узнают сигнал AAUAAA (CPSF) и участок ниже места расщепления (CstF) и разрезают пре-мРНК.","Поли(А)-полимераза присоединяет к свободному 3′-OH по одному адениловому остатку из АТФ; матрица ей не нужна, поэтому [[T43|поли(А)-хвост]] в гене не закодирован.","Белки, связывающиеся с хвостом, ограничивают его длину — около 200 остатков.","Поли(А)-хвост с белками защищает 3′-конец, участвует в экспорте мРНК и усиливает инициацию трансляции."],"paragraphs":["Без расщепления нет и хвоста: РНК продолжается за сигналом, полимераза уходит далеко по ДНК, а такая РНК задерживается в ядре и разрушается.","У многих генов несколько сигналов полиаденилирования; выбор одного из них меняет длину 3′-НТО (альтернативное полиаденилирование — семинар 11)."],"conditions":"Схема шага — модель вкладки 3.","sources":["Alberts2022"],"quiz":{"id":"S9-L16","question":"Почему поли(А)-хвост не закодирован в гене?","options":[{"id":"S9-L16-1","text":"Поли(А)-полимераза присоединяет адениловые остатки без матрицы","correct":true,"feedback":"Хвост синтезируется после расщепления без участия ДНК."},{"id":"S9-L16-2","text":"Хвост закодирован в последнем интроне и вырезается сплайсингом","correct":false,"feedback":"Интроны удаляются из пре-мРНК; хвост к ним отношения не имеет."},{"id":"S9-L16-3","text":"Его синтезирует РНК-полимераза II по матричной цепи","correct":false,"feedback":"Тогда хвост был бы закодирован в гене; на деле его добавляет поли(А)-полимераза."}]},"widget":{"kind":"dna","title":"","s":{"title":"3′-конец образован / не образован","status":"Схема качественная","modes_label":"Что показать","modes":["все факторы на месте","нет факторов расщепления"],"scene":"s3b","args":[[{}],[{"cpa":false}]],"L":{"s3k_title":"Белки процессинга и экспорта: нажмите на гнездо, чтобы вынуть деталь","s3k_hint":"Вынутая деталь возвращается нажатием в лотке.","s3k_cap":"Ферменты кэпирования","s3k_spl":"Сплайсосома","s3k_cpa":"Факторы расщепления и поли­аденили­рования","s3k_exp":"Рецептор экспорта мРНК (NXF1–NXT1)","s3_ctrl_note":"Ген из трёх экзонов и двух интронов транскрибирует РНК-полимераза II клетки человека. Предскажите, где окажется РНК этого гена и в каком виде. Длины участков на схеме условные.","s3_pN":"Ядро","s3_pC":"Цитоплазма","s3_e_spl":"сплайсосома","s3_e_cap":"ферменты кэпирования","s3_lbl_lariat":"интрон в виде лассо","s3_lbl_tr":"зрелая мРНК z":"Кэп защищает 5′-конец; связанный с ним кэп-связывающий комплекс помогает дальнейшему процессингу и экспорту, а в цитоплазме кэп нужен для инициации трансляции.","s3_cap_nospl":"Без сплайсосомы интроны остаются в РНК; кэп и поли(А)-хвост в модели есть. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_z":"РНК с неудалёнными интронами в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nospl_cpa":"Без сплайсосомы интроны остаются в РНК, а без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_cpa_z":"РНК с неудалёнными интронами и без поли(А)-хвоста в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nocpa":"Без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост; полимераза продолжает синтез дальше по ДНК. Первый интрон удалён, а удаление последнего связано с образованием 3′-конца, и в модели он остаётся. Такая РНК задерживается в ядре и разрушается.","s3_cap_nocpa_z":"Поли(А)-хвост не закодирован в гене: его добавляет поли(А)-полимераза после расщепления. Без расщепления нет и хвоста.","s3_cap_noexp":"Процессинг прошёл полностью: у мРНК есть кэп и поли(А)-хвост, интроны удалены. Но без рецептора экспорта мРНП не проходит через ядерную пору и накапливается в ядре; в цитоплазме мРНК этого гена нет.","s3_cap_noexp_z":"Зрелость мРНК необходима для экспорта, но не достаточна: нужен ещё рецептор экспорта. Экспорт мРНП идёт без сигнала ядерной локализации и импортина — иначе, чем импорт белков в ядро.","s3_v_intr_part":"первый удалён, последний остался"},"notes":["Расщепление и поли(А): мРНК выходит в цитоплазму.","Нет расщепления и хвоста: РНК задерживается в ядре."],"static":["Расщепление и поли(А): мРНК выходит в цитоплазму."]}},"exam_quiz":{"id":"S9-E08","question":"Какую роль играет последовательность AAUAAA в пре-мРНК?","options":[{"id":"S9-E08-1","text":"Это начало поли(А)-хвоста, закодированного в гене","correct":false,"feedback":"Поли(А)-хвост в гене не закодирован: его добавляет поли(А)-полимераза после расщепления."},{"id":"S9-E08-2","text":"Это сигнал: в 10–30 нуклеотидах ниже неё пре-мРНК разрезается, и к новому 3′-концу добавляется поли(А)-хвост","correct":true,"feedback":"Сигнал узнают факторы расщепления и полиаденилирования."},{"id":"S9-E08-3","text":"На ней РНК-полимераза отделяется от ДНК","correct":false,"feedback":"Терминация происходит позже, ниже места расщепления."}]}},{"id":"export","section":2,"questions":[3],"title":"Зрелая мРНК, мРНП и ядерный экспорт","keywords":["мРНП","ядерный контроль","экзосома","рецептор экспорта NXF1–NXT1","ядерная пора","экспорт ≠ импорт"],"lead":["Уже известно: белки входят в ядро через ядерную пору при помощи сигнала ядерной локализации, импортина и Ran ([[https://fresll.github.io/bio/seminar-3-route.html#nls-importin|вспомнить семинар 3]]).","Новое: мРНК выходит из ядра иначе — как мРНП; основной путь — с рецептором NXF1–NXT1, без сигнала ядерной локализации и без Ran."],"mechanism":["На мРНК во время процессинга собираются белки — на кэпе, на соединениях экзонов, на поли(А)-хвосте; вместе с ними она образует [[T53|мРНП]].","Белки, присоединённые при процессинге, привлекают [[T54|рецептор экспорта мРНК NXF1–NXT1]]; он взаимодействует с неструктурированными FG-повторами белков [[T55|ядерной поры]], и мРНП проходит через канал.","На цитоплазматической стороне поры АТФ-зависимая РНК-хеликаза снимает с мРНП рецептор и часть белков, и мРНП не может вернуться: экспорт однонаправленный.","Транскрипты без кэпа, с неудалёнными интронами или без правильного 3′-конца задерживаются в ядре и разрушаются ядерной экзосомой (3′→5′-экзонуклеазы)."],"paragraphs":["Значительная часть синтезированной в ядре РНК из ядра не выходит: интроны, участки за местом расщепления и дефектные транскрипты разрушаются в ядре.","Поэтому транскрипционная активность гена не равна количеству его мРНК в цитоплазме: между ними — процессинг, ядерный контроль и экспорт."],"conditions":"Схема шага — модель вкладки 3: ядерная оболочка — две мембраны с порой.","sources":["Alberts2022","Petrovic2026"],"quiz":{"id":"S9-L17","question":"Чем экспорт мРНК из ядра отличается от импорта белка в ядро?","options":[{"id":"S9-L17-1","text":"Ничем: мРНК несёт сигнал ядерной локализации, и её переносит импортин","correct":false,"feedback":"Сигнал ядерной локализации и импортин переносят белки в ядро, а не мРНК из ядра."},{"id":"S9-L17-2","text":"мРНП выходит с рецептором NXF1–NXT1 без сигнала ядерной локализации и без Ran; направление задаёт хеликаза у поры","correct":true,"feedback":"Импорт белка использует сигнал ядерной локализации, импортин и градиент Ran-ГТФ; экспорт мРНК устроен иначе."},{"id":"S9-L17-3","text":"мРНК выходит, пробивая ядерную оболочку между порами","correct":false,"feedback":"Обмен макромолекулами между ядром и цитоплазмой идёт через ядерные поры."}]},"widget":{"kind":"dna","title":"","s":{"title":"Рецептор экспорта есть / нет","status":"Схема качественная","modes_label":"Что показать","modes":["рецептор есть","нет рецептора экспорта"],"scene":"s3b","args":[[{}],[{"exp":false}]],"L":{"s3k_title":"Белки процессинга и экспорта: нажмите на гнездо, чтобы вынуть деталь","s3k_hint":"Вынутая деталь возвращается нажатием в лотке.","s3k_cap":"Ферменты кэпирования","s3k_spl":"Сплайсосома","s3k_cpa":"Факторы расщепления и поли­аденили­рования","s3k_exp":"Рецептор экспорта мРНК (NXF1–NXT1)","s3_ctrl_note":"Ген из трёх экзонов и двух интронов транскрибирует РНК-полимераза II клетки человека. Предскажите, где окажется РНК этого гена и в каком виде. Длины участков на схеме условные.","s3_pN":"Ядро","s3_pC":"Цитоплазма","s3_e_spl":"сплайсосома","s3_e_cap":"ферменты кэпирования","s3_lbl_lariat":"интрон в виде лассо","s3_lbl_tr":"зрелая мРНК в цито  защищает 5′-конец; связанный с ним кэп-связывающий комплекс помогает дальнейшему процессингу и экспорту, а в цитоплазме кэп нужен для инициации трансляции.","s3_cap_nospl":"Без сплайсосомы интроны остаются в РНК; кэп и поли(А)-хвост в модели есть. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_z":"РНК с неудалёнными интронами в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nospl_cpa":"Без сплайсосомы интроны остаются в РНК, а без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.","s3_cap_nospl_cpa_z":"РНК с неудалёнными интронами и без поли(А)-хвоста в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.","s3_cap_nocpa":"Без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост; полимераза продолжает синтез дальше по ДНК. Первый интрон удалён, а удаление последнего связано с образованием 3′-конца, и в модели он остаётся. Такая РНК задерживается в ядре и разрушается.","s3_cap_nocpa_z":"Поли(А)-хвост не закодирован в гене: его добавляет поли(А)-полимераза после расщепления. Без расщепления нет и хвоста.","s3_cap_noexp":"Процессинг прошёл полностью: у мРНК есть кэп и поли(А)-хвост, интроны удалены. Но без рецептора экспорта мРНП не проходит через ядерную пору и накапливается в ядре; в цитоплазме мРНК этого гена нет.","s3_cap_noexp_z":"Зрелость мРНК необходима для экспорта, но не достаточна: нужен ещё рецептор экспорта. Экспорт мРНП идёт без сигнала ядерной локализации и импортина — иначе, чем импорт белков в ядро.","s3_v_intr_part":"первый удалён, последний остался"},"notes":["Зрелая мРНК выходит в цитоплазму.","Зрелая мРНК накапливается в ядре."],"static":["Зрелая мРНК выходит в цитоплазму."]}},"exam_quiz":{"id":"S9-E09","question":"Какая РНК белок-кодирующего гена выходит из ядра в цитоплазму?","options":[{"id":"S9-E09-1","text":"Любая РНК, как только её синтез завершён","correct":false,"feedback":"Неправильно обработанные РНК в основном задерживаются в ядре и разрушаются."},{"id":"S9-E09-2","text":"Пре-мРНК: сплайсинг идёт в цитоплазме","correct":false,"feedback":"Сплайсинг идёт в ядре; в цитоплазму выходит уже зрелая мРНК."},{"id":"S9-E09-3","text":"Зрелая мРНК в составе мРНП — с кэпом, без интронов, с поли(А)-хвостом — при участии рецептора экспорта","correct":true,"feedback":"Белки, присоединённые при процессинге, отличают зрелую мРНК; рецептор экспорта проводит мРНП через пору."}]}},{"id":"post-transcriptional","section":2,"questions":[3],"title":"Часть интронов удаляется уже после окончания транскрипции","keywords":["посттранскрипционный сплайсинг","РНК на хроматине","задержанный интрон","удержание в ядре"],"lead":["Уже известно: многие интроны удаляются во время транскрипции (БИО-9·13).","Новое: заметная доля интронов удаляется позже, и от этого зависит, когда мРНК выйдет в цитоплазму."],"mechanism":["В клетках млекопитающих 27–40 % интронов ещё присутствуют в уже полиаденилированной РНК, связанной с хроматином: они удаляются после окончания синтеза, пока РНК остаётся у места транскрипции.","В клетках человека линии K562 медиана времени полужизни мРНК на хроматине — около 50 мин, а для мРНК части генов оценка — 170 мин и больше.","РНК с так называемыми задержанными интронами удерживается в ядре, пока интрон не будет удалён; иначе её разрушают в ядре.","Так задержка сплайсинга определяет, когда и сколько мРНК выходит в цитоплазму, — ещё одна ступень между транскрипцией и цитоплазматической мРНК."],"paragraphs":["Как это узнали: РНК клеток разделяли на фракции — связанную с хроматином, ядерную и цитоплазматическую — и определяли, какие интроны в каждой ещё есть; время полужизни в хроматиновой фракции оценивали по кинетике метки, встроенной в новосинтезированную РНК, с помощью модели — это оценки для генов, а не наблюдение отдельных молекул.","Граница вывода: это сводка многих работ в обзоре; доли и времена различаются между типами клеток и генами, а для одного гена их надо измерять отдельно.","Связанная модель — в практикуме: вопрос 3, уровень «Продвинутый» (пулы РНК в ядре и цитоплазме); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Данные — клетки млекопитающих (в том числе линия K562 человека); сводка в обзоре.","sources":["Choquet2025"],"quiz":{"id":"S9-L18","question":"РНК гена полиаденилирована, но содержит один задержанный интрон. Что с ней будет по этим данным?","options":[{"id":"S9-L18-1","text":"Она выйдет в цитоплазму, и интрон удалят там","correct":false,"feedback":"Сплайсинг мРНК завершается в ядре; транскрипт с интроном удерживается."},{"id":"S9-L18-2","text":"Её уже нельзя сплайсировать: сплайсинг возможен только во время транскрипции","correct":false,"feedback":"Часть интронов удаляется после окончания синтеза."},{"id":"S9-L18-3","text":"Она останется в ядре, пока интрон не будет удалён, или будет разрушена в ядре","correct":true,"feedback":"Задержанный интрон удерживает транскрипт в ядре."}]},"widget":{"kind":"dna","title":"","s":{"title":"Пулы РНК в ядре и цитоплазме (условные числа)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["контроль","замедлен процессинг"],"scene":"a3","args":[["10","0.3","0.2"],["10","0.03","0.2"]],"L":{"s3a_prob":"Транскрипция идёт, но мРНК в цитоплазме мало. В учебной модели РНК гена разделена на три пула, которые сменяют друг друга: пре-мРНК в ядре, зрелая мРНК в ядре, мРНК в цитоплазме; каждая молекула в каждый момент находится в одном пуле (в клетке процессинг во многом идёт во время транскрипции, и модель это упрощает). Как по количеству РНК в ядре и в цитоплазме отличить замедление процессинга от замедления экспорта и от снижения синтеза?","s3a_s":"Синтез пре-мРНК (условно)","s3a_s_10":"10 в мин","s3a_s_4":"4 в мин","s3a_kp":"Процессинг: созревает за минуту","s3a_kp_30":"30 % пре-мРНК","s3a_kp_3":"3 %","s3a_ke":"Экспорт: выходит за минуту","s3a_ke_20":"20 % зрелых ядерных мРНК","s3a_ke_2":"2 %","s3a_note":"Наблюдение — 60 мин от начала синтеза, шаг модели — 1 мин. Разрушается за минуту: 5 % пре-мРНК, 2 % зрелых мРНК в ядре и 2 % в цитоплазме. Все значения — учебные допущения, а не измеренные величины; в модели ни одна молекула не возникает и не исчезает без перехода — синтезировано = сумма пулов + разрушено. Пулы — балансовое учебное представление состояний РНК, а не хронология процессинга одной молекулы: в клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции.","s3a_pN":"Ядро · через {m} мин","s3a_pC":"Цитоплазма","s3a_pB":"Б. Пулы во времени (условные единицы)","s3a_pool_pre":"пре-мРНК","s3a_pool_nuc":"зрелая мРНК в ядре","s3a_pool_cyt":"мРНК в цитоплазме","s3a_lbl_syn":"синтез {s}/мин","s3a_lbl_proc":"процессинг","s3a_lbl_k":"{k} % в мин","s3a_lbl_exp":"экспорт {k} % в мин","s3a_lbl_dn":"разрушено в ядре: {n}","s3a_lbl_dc":"разрушено в цитоплазме: {n}","s3a_lbl_ctrl":"контроль","s3a_leg":"янтарная — пре-мРНК · фиолетовая — зрелая в ядре · зелёная — в цитоплазме","s3a_leg_mask":"зелёная — мРНК в цитоплазме · пунктир — контроль","s3a_r_tot":"Синтезировано пре-мРНК","s3a_r_tot_s":"за 60 мин","s3a_r_pre":"Пре-мРНК в ядре","s3a_r_nuc":"Зрелая мРНК в ядре","s3a_r_cyt":"мРНК в цитоплазме","s3a_r_cyt_s":"через 60 мин","s3a_r_ctrl":"мРНК в цитоплазме в контроле","s3a_r_deg":"Разрушено","s3a_r_deg_s":"в ядре + в цитоплазме","s3a_v_n":"{n}","s3a_v_deg":"{a} + {b}","s3a_cap_ctrl":"Контроль модели: пре-мРНК созревает быстрее, чем разрушается, и зрелая мРНК быстро выходит в цитоплазму. Через 60 мин в цитоплазме {c} молекул; в ядре их немного.","s3a_cap_ctrl_z":"Даже без нарушений не вся синтезированная РНК доходит до цитоплазмы: часть разрушается в ядре.","s3a_cap_proc":"Процессинг замедлен в 10 раз: пре-мРНК накапливается в ядре и чаще разрушается, не успев созреть. Зрелой мРНК в ядре мало, в цитоплазме — {c} (в контроле {k}).","s3a_cap_proc_z":"Признак замедленного процессинга — избыток пре-мРНК в ядре при малом количестве зрелой мРНК.","s3a_cap_exp":"Экспорт замедлен в 10 раз: процессинг идёт нормально, и зрелая мРНК накапливается в ядре. В цитоплазме — {c} (в контроле {k}).","s3a_cap_exp_z":"Признак замедленного экспорта — избыток зрелой мРНК в ядре при нормальном количестве пре-мРНК.","s3a_cap_tx":"Синтез снижен в 2,5 раза: все пулы уменьшились почти пропорционально. В цитоплазме — {c} (в контроле {k}); избытка ни пре-мРНК, ни зрелой мРНК в ядре нет.","s3a_cap_tx_z":"Если ни один ядерный пул не накапливается, причину ищут до процессинга — в синтезе.","s3a_cap_mix":"Изменено несколько условий сразу. В цитоплазме — {c} (в контроле {k}); вклады этапов перемножаются.","s3a_cap_mix_z":"Чтобы отделить вклады нескольких нарушений, нужны все три пула и скорость синтеза.","s3a_cap_mask":"Обратная задача: известно только количество мРНК в цитоплазме. Переключатели скрыты.","s3a_cap_mask_z":"Сколько разных причин дают такой же итог?","s3a_take":"Количество мРНК в цитоплазме определяется не только транскрипцией: каждая молекула проходит процессинг и экспорт и на каждом этапе может разрушиться. Одинаково мало цитоплазматической мРНК дают сниженный синтез, замедленный процессинг и замедленный экспорт; различить их можно по ядерным пулам: при замедленном процессинге накапливается пре-мРНК, при замедленном экспорте — зрелая мРНК в ядре, при сниженном синтезе не накапливается ни то ни другое.","s3a_lim":"Это балансовая модель состояний РНК, а не буквальная хронология процессинга одной молекулы: в реальной клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции. Все доли и скорости модели — учебные допущения, не измеренные для какого-либо гена. Модель не показывает, что процессинг идёт в несколько этапов и во время транскрипции, что разные интроны удаляются с разной скоростью, что зрелая мРНК в цитоплазме разрушается с разной скоростью у разных генов (время жизни мРНК — курс «Молекулярная биология»), и что клетка может регулировать задержку РНК в ядре.","s3a_new":"Не все интроны удаляются во время транскрипции. В клетках млекопитающих 27–40 % интронов ещё присутствуют в уже полиаденилированной РНК, связанной с хроматином: они удаляются после окончания синтеза, пока РНК остаётся у места транскрипции. В клетках человека линии K562 медиана времени полужизни мРНК на хроматине — около 50 мин, а для мРНК части генов оценка — 170 мин и больше. РНК с так называемыми задержанными интронами удерживается в ядре, пока интрон не будет удалён; иначе её разрушают в ядре. Так задержка сплайсинга определяет, когда и сколько мРНК выйдет в цитоплазму.","s3a_how":"разделили РНК клеток на фракции — связанную с хроматином, ядерную и цитоплазматическую — и определили, какие интроны в каждой ещё есть; время пребывания на хроматине измеряли по метке, встроенной в новосинтезированную РНК. Это сводка многих работ в обзоре; доли и времена различаются между типами клеток и генами.","s3a_tl_note":"Шкала — время наблюдения, по 10 мин на этап. Числа на схеме — условные, округлённые до целых.","s3a_tl_1":"0–10 мин: синтезируется пре-мРНК; часть её уже созрела.","s3a_tl_2":"10–20 мин: зрелая мРНК выходит в цитоплазму.","s3a_tl_3":"20–30 мин: ядерные пулы приближаются к постоянному уровню; пул перед замедленным этапом растёт дольше.","s3a_tl_4":"30–40 мин: мРНК в цитоплазме продолжает накапливаться.","s3a_tl_5":"40–50 мин: распад идёт всё время — разрушенных молекул всё больше.","s3a_tl_6":"50–60 мин: итог; синтезировано = пре-мРНК + зрелая в ядре + в цитоплазме + разрушено.","s3a_ms":"Через {m} мин:","s3a_ms_dn":"разрушено в ядре","s3a_ms_dc":"разрушено в цитоплазме"},"notes":["В цитоплазме 254 мРНК, в ядре немного.","Пре-мРНК накапливается в ядре (124), в цитоплазме около 100."],"static":["В цитоплазме 254 мРНК, в ядре немного."]}},"level":"adv"},{"id":"little-cytoplasmic","section":2,"questions":[3],"title":"Мало мРНК в цитоплазме — разные причины","keywords":["обратная задача","пулы РНК","сохранение числа молекул","процессинг","экспорт","синтез"],"lead":["Уже известно: между синтезом РНК и мРНК в цитоплазме — процессинг и экспорт (БИО-9·17).","Новое: по количеству РНК в разных компартментах можно отличить, какой этап замедлен."],"mechanism":["В учебной модели каждая молекула находится в одном пуле: пре-мРНК в ядре → зрелая мРНК в ядре → мРНК в цитоплазме; из каждого пула часть молекул разрушается. Синтезировано = сумма пулов + разрушено.","Около 100 мРНК в цитоплазме через 60 мин (в контроле 254) дают три разных нарушения: замедленный в 10 раз процессинг, замедленный в 10 раз экспорт и сниженный в 2,5 раза синтез.","Молекулы накапливаются в пуле перед замедленным этапом: при замедленном процессинге — пре-мРНК (124 против 29), при замедленном экспорте — зрелая мРНК в ядре (193 против 39).","При сниженном синтезе не накапливается ни один ядерный пул, а новых пре-мРНК за 10 мин меньше (40 против 100)."],"paragraphs":["Все доли и скорости — учебные допущения, а не измеренные величины; модель показывает логику вывода, а не свойства конкретного гена.","Тот же принцип, что в разделе 2: одинаковый наблюдаемый результат может возникнуть при нарушении разных процессов, а различает их наблюдение, по которому гипотезы предсказывают разное.","Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель 3а; правила — по учебнику и обзору о посттранскрипционном сплайсинге.","sources":["Alberts2022","Choquet2025"],"quiz":{"id":"S9-L19","question":"мРНК гена в цитоплазме мало; пре-мРНК в ядре как в контроле, а зрелой мРНК в ядре в 5 раз больше. Какой этап замедлен в модели?","options":[{"id":"S9-L19-1","text":"Экспорт","correct":true,"feedback":"Зрелая мРНК накапливается перед экспортом, а процессинг идёт нормально."},{"id":"S9-L19-2","text":"Процессинг","correct":false,"feedback":"Тогда накапливалась бы пре-мРНК, а зрелой мРНК было бы меньше."},{"id":"S9-L19-3","text":"Синтез","correct":false,"feedback":"При сниженном синтезе ядерные пулы не растут, а уменьшаются."}]},"widget":{"kind":"dna","title":"","s":{"title":"Три причины — одинаковый итог (условные числа)","status":"Учебная модель · условные значения","modes_label":"Что показать","modes":["замедлен процессинг","замедлен экспорт","снижен синтез"],"scene":"a3","args":[["10","0.03","0.2"],["10","0.3","0.02"],["4","0.3","0.2"]],"L":{"s3a_prob":"Транскрипция идёт, но мРНК в цитоплазме мало. В учебной модели РНК гена разделена на три пула, которые сменяют друг друга: пре-мРНК в ядре, зрелая мРНК в ядре, мРНК в цитоплазме; каждая молекула в каждый момент находится в одном пуле (в клетке процессинг во многом идёт во время транскрипции, и модель это упрощает). Как по количеству РНК в ядре и в цитоплазме отличить замедление процессинга от замедления экспорта и от снижения синтеза?","s3a_s":"Синтез пре-мРНК (условно)","s3a_s_10":"10 в мин","s3a_s_4":"4 в мин","s3a_kp":"Процессинг: созревает за минуту","s3a_kp_30":"30 % пре-мРНК","s3a_kp_3":"3 %","s3a_ke":"Экспорт: выходит за минуту","s3a_ke_20":"20 % зрелых ядерных мРНК","s3a_ke_2":"2 %","s3a_note":"Наблюдение — 60 мин от начала синтеза, шаг модели — 1 мин. Разрушается за минуту: 5 % пре-мРНК, 2 % зрелых мРНК в ядре и 2 % в цитоплазме. Все значения — учебные допущения, а не измеренные величины; в модели ни одна молекула не возникает и не исчезает без перехода — синтезировано = сумма пулов + разрушено. Пулы — балансовое учебное представление состояний РНК, а не хронология процессинга одной молекулы: в клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции.","s3a_pN":"Ядро · через {m} мин","s3a_pC":"Цитоплазма","s3a_pB":"Б. Пулы во времени (условные единицы)","s3a_pool_pre":"пре-мРНК","s3a_pool_nuc":"зрелая мРНК в ядре","s3a_pool_cyt":"мРНК в цитоплазме","s3a_lbl_syn":"синтез {s}/мин","s3a_lbl_proc":"процессинг","s3a_lbl_k":"{k} % в мин","s3a_lbl_exp":"экспорт {k} % в мин","s3a_lbl_dn":"разрушено в ядре: {n}","s3a_lbl_dc":"разрушено в цитоплазме: {n}","s3a_lbl_ctrl":"контроль","s3a_leg":"янтарная — пре-мРНК · фиолетовая — зрелая в ядре · зелёная — в цитоплазме","s3a_leg_mask":"зелёная — мРНК в цитоплазме · пунктир — контроль","s3a_r_tot":"Синтезировано пре-мРНК","s3a_r_tot_s":"за 60 мин","s3a_r_pre":"Пре-мРНК в ядре","s3a_r_nuc":"Зрелая мРНК в ядре","s3a_r_cyt":"мРНК в цитоплазме","s3a_r_cyt_s":"через 60 мин","s3a_r_ctrl":"мРНК в цитоплазме в контроле","s3a_r_deg":"Разрушено","s3a_r_deg_s":"в ядре + в цитоплазме","s3a_v_n":"{n}","s3a_v_deg":"{a} + {b}","s3a_cap_ctrl":"Контроль модели: пре-мРНК созревает быстрее, чем разрушается, и зрелая мРНК быстро выходит в цитоплазму. Через 60 мин в цитоплазме {c} молекул; в ядре их немного.","s3a_cap_ctrl_z":"Даже без нарушений не вся синтезированная РНК доходит до цитоплазмы: часть разрушается в ядре.","s3a_cap_proc":"Процессинг замедлен в 10 раз: пре-мРНК накапливается в ядре и чаще разрушается, не успев созреть. Зрелой мРНК в ядре мало, в цитоплазме — {c} (в контроле {k}).","s3a_cap_proc_z":"Признак замедленного процессинга — избыток пре-мРНК в ядре при малом количестве зрелой мРНК.","s3a_cap_exp":"Экспорт замедлен в 10 раз: процессинг идёт нормально, и зрелая мРНК накапливается в ядре. В цитоплазме — {c} (в контроле {k}).","s3a_cap_exp_z":"Признак замедленного экспорта — избыток зрелой мРНК в ядре при нормальном количестве пре-мРНК.","s3a_cap_tx":"Синтез снижен в 2,5 раза: все пулы уменьшились почти пропорционально. В цитоплазме — {c} (в контроле {k}); избытка ни пре-мРНК, ни зрелой мРНК в ядре нет.","s3a_cap_tx_z":"Если ни один ядерный пул не накапливается, причину ищут до процессинга — в синтезе.","s3a_cap_mix":"Изменено несколько условий сразу. В цитоплазме — {c} (в контроле {k}); вклады этапов перемножаются.","s3a_cap_mix_z":"Чтобы отделить вклады нескольких нарушений, нужны все три пула и скорость синтеза.","s3a_cap_mask":"Обратная задача: известно только количество мРНК в цитоплазме. Переключатели скрыты.","s3a_cap_mask_z":"Сколько разных причин дают такой же итог?","s3a_take":"Количество мРНК в цитоплазме определяется не только транскрипцией: каждая молекула проходит процессинг и экспорт и на каждом этапе может разрушиться. Одинаково мало цитоплазматической мРНК дают сниженный синтез, замедленный процессинг и замедленный экспорт; различить их можно по ядерным пулам: при замедленном процессинге накапливается пре-мРНК, при замедленном экспорте — зрелая мРНК в ядре, при сниженном синтезе не накапливается ни то ни другое.","s3a_lim":"Это балансовая модель состояний РНК, а не буквальная хронология процессинга одной молекулы: в реальной клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции. Все доли и скорости модели — учебные допущения, не измеренные для какого-либо гена. Модель не показывает, что процессинг идёт в несколько этапов и во время транскрипции, что разные интроны удаляются с разной скоростью, что зрелая мРНК в цитоплазме разрушается с разной скоростью у разных генов (время жизни мРНК — курс «Молекулярная биология»), и что клетка может регулировать задержку РНК в ядре.","s3a_new":"Не все интроны удаляются во время транскрипции. В клетках млекопитающих 27–40 % интронов ещё присутствуют в уже полиаденилированной РНК, связанной с хроматином: они удаляются после окончания синтеза, пока РНК остаётся у места транскрипции. В клетках человека линии K562 медиана времени полужизни мРНК на хроматине — около 50 мин, а для мРНК части генов оценка — 170 мин и больше. РНК с так называемыми задержанными интронами удерживается в ядре, пока интрон не будет удалён; иначе её разрушают в ядре. Так задержка сплайсинга определяет, когда и сколько мРНК выйдет в цитоплазму.","s3a_how":"разделили РНК клеток на фракции — связанную с хроматином, ядерную и цитоплазматическую — и определили, какие интроны в каждой ещё есть; время пребывания на хроматине измеряли по метке, встроенной в новосинтезированную РНК. Это сводка многих работ в обзоре; доли и времена различаются между типами клеток и генами.","s3a_tl_note":"Шкала — время наблюдения, по 10 мин на этап. Числа на схеме — условные, округлённые до целых.","s3a_tl_1":"0–10 мин: синтезируется пре-мРНК; часть её уже созрела.","s3a_tl_2":"10–20 мин: зрелая мРНК выходит в цитоплазму.","s3a_tl_3":"20–30 мин: ядерные пулы приближаются к постоянному уровню; пул перед замедленным этапом растёт дольше.","s3a_tl_4":"30–40 мин: мРНК в цитоплазме продолжает накапливаться.","s3a_tl_5":"40–50 мин: распад идёт всё время — разрушенных молекул всё больше.","s3a_tl_6":"50–60 мин: итог; синтезировано = пре-мРНК + зрелая в ядре + в цитоплазме + разрушено.","s3a_ms":"Через {m} мин:","s3a_ms_dn":"разрушено в ядре","s3a_ms_dc":"разрушено в цитоплазме"},"notes":["Накапливается пре-мРНК; в цитоплазме около 100.","Накапливается зрелая мРНК в ядре; в цитоплазме около 100.","Ни один ядерный пул не растёт; в цитоплазме около 100."],"static":["Накапливается пре-мРНК; в цитоплазме около 100."]}},"level":"adv"},{"id":"exon-utr","section":3,"questions":[4],"title":"Экзон, интрон, кодирующая область и нетранслируемые области","keywords":["экзон","интрон","кодирующая область","5′-НТО","3′-НТО","старт-кодон","стоп-кодон"],"lead":["Уже известно: при сплайсинге интроны удаляются, экзоны соединяются (БИО-9·15).","Новое: экзон — не то же самое, что кодирующая последовательность.","Раздел относится к вопросу 11 коллоквиума 2 (предварительный список) и вопросу 25 зачёта."],"mechanism":["[[T34|Экзон]] — участок гена, последовательность которого сохраняется в зрелой РНК после сплайсинга; [[T35|интрон]] удаляется.","Зрелая мРНК от 5′ к 3′: кэп, [[T47|5′-нетранслируемая область]], [[T45|кодирующая область]] (от [[T49|старт-кодона]] до [[T50|стоп-кодона]]), [[T48|3′-нетранслируемая область]], поли(А)-хвост.","Границы экзонов задают сайты сплайсинга, а границы кодирующей области — старт- и стоп-кодоны. Поэтому первый и последний экзоны обычно целиком или частично нетранслируемые, а интроны встречаются и внутри нетранслируемых областей.","Экзоны есть и у генов, вовсе не кодирующих белок (например, генов длинных некодирующих РНК)."],"paragraphs":["Нетранслируемые области не кодируют аминокислоты, но содержат последовательности, от которых зависят стабильность мРНК, её место в цитоплазме и эффективность трансляции; у многих генов человека 3′-НТО длиннее кодирующей области.","Поэтому изменение экзона не обязательно меняет белок: оно может прийтись на нетранслируемую область."],"conditions":"Схема шага — модель вкладки 4: условный ген из пяти экзонов, длины условные.","sources":["Alberts2022"],"quiz":{"id":"S9-L20","question":"Первый экзон гена целиком относится к 5′-НТО. Что из этого следует?","options":[{"id":"S9-L20-1","text":"Это ошибка разметки: такой участок — интрон","correct":false,"feedback":"Интрон удаляется при сплайсинге; этот участок остаётся в зрелой мРНК, значит, это экзон."},{"id":"S9-L20-2","text":"Экзон не обязательно кодирует аминокислоты","correct":true,"feedback":"Экзон определяется сплайсингом: он сохраняется в зрелой мРНК, кодирует ли он белок или нет."},{"id":"S9-L20-3","text":"Трансляция начинается с первого нуклеотида экзона 1","correct":false,"feedback":"Трансляция начинается со старт-кодона, который здесь находится в следующем экзоне."}]},"widget":{"kind":"dna","title":"","s":{"title":"Экзоны и нетранслируемые области","status":"Схема качественная · длины условные","modes_label":"Что показать","modes":["все экзоны"],"scene":"s4b","args":[["inc","prox"]],"L":{"s4_e3":"Экзон 3","s4_e3_inc":"включён","s4_e3_skip":"пропущен","s4_ss":"5′-сайт сплайсинга интрона 1","s4_ss_prox":"ближний","s4_ss_dist":"дальний","s4_ctrl_note":"Ген один и тот же; меняется только то, какие сайты сплайсинга использованы при созревании пре-мРНК. У интрона 1 два возможных 5′-сайта: ближний — у самого конца экзона 1 и дальний — на 35 нуклеотидов ниже по ходу транскрипции, внутри интрона. Длина экзона 3 — 63 нуклеотида (кратна трём). Длины участков условные.","s4_pA":"А. Пре-мРНК (организация как в гене) и выбранные соединения экзонов","s4_pB":"Б. Зрелая мРНК","s4_pC":"В. Белок (схема; синтез белка — семинар 10)","s4_lbl_stop":"стоп","s4_lbl_e1":"экзон из одной 5′-НТО","s4_lbl_e3":"альтернативный экзон","s4_lbl_utr5":"5′-НТО: {n} нт","s4_lbl_cds":"кодирующая область: {n} нт","s4_lbl_utr3":"3′-НТО: {n} нт","s4_lbl_prot_inc":"{n} аминокислот; тёмный участок кодирует экзон 3","s4_lbl_prot_skip":"{n} аминокислот: нет внутреннего участка из 21 аминокислоты; начало и конец те же","s4_r_ex":"Экзоны в зрелой мРНК","s4_v_ex":"{e}","s4_r_utr5":"5′-нетранслируемая область","s4_v_nt":"{n} нт","s4_r_cds":"Кодирующая область","s4_r_cds_s":"от старт-кодона до стоп-кодона","s4_v_cds":"{n} нт, {c} кодонов","s4_r_prot":"Белок","s4_v_prot_inc":"{n} аминокислот","s4_v_prot_skip":"{n} аминокислот, без участка экзона 3","s4_r_dna":"Последовательность гена","s4_v_dna":"та же во всех вариантах","s4_cap_inc_prox":"Используются все экзоны и ближний 5′-сайт интрона 1. Экзон 1 целиком нетранслируемый, экзон 2 содержит конец 5′-НТО и старт-кодон, экзон 4 — стоп-кодон и начало 3′-НТО, экзон 5 — остальную 3′-НТО.","s4_cap_inc_prox_z":"Экзон — участок гена, который сохраняется в зрелой мРНК, а не обязательно кодирующий: в этом гене экзоны 1 и 5 целиком нетранслируемые, а экзоны 2 и 4 — частично.","s4_cap_skip_prox":"Экзон 3 пропущен: экзон 2 соединён прямо с экзоном 4. Длина экзона 3 кратна трём, поэтому без него кодирующая область короче на 21 кодон, а начало и конец белка те же; внутреннего участка из 21 аминокислоты нет.","s4_cap_skip_prox_z":"Альтернативный сплайсинг меняет состав зрелой мРНК, а последовательность гена остаётся прежней.","s4_cap_inc_dist":"Использован дальний 5′-сайт интрона 1: участок, который при ближнем сайте удалялся с интроном, остался в экзоне 1. Удлинилась только 5′-НТО; кодирующая область и белок не изменились.","s4_cap_inc_dist_z":"Не каждое изменение состава зрелой мРНК меняет белок: изменения в нетранслируемых областях последовательность аминокислот не затрагивают.","s4_cap_skip_dist":"Сразу два альтернативных выбора: 5′-НТО длиннее (дальний 5′-сайт интрона 1), а экзон 3 пропущен — белок короче на внутренний участок из 21 аминокислоты.","s4_cap_skip_dist_z":"Альтернативные события в одной пре-мРНК могут сочетаться; каждое затрагивает свой участок зрелой мРНК."},"notes":["Экзон 1 — 5′-НТО; старт-кодон — в экзоне 2; стоп-кодон — в экзоне 4; экзон 5 — 3′-НТО."],"static":["Экзон 1 — 5′-НТО; старт-кодон — в экзоне 2; стоп-кодон — в экзоне 4; экзон 5 — 3′-НТО."]}},"exam_quiz":{"id":"S9-E10","question":"Какой участок зрелой мРНК кодирует аминокислоты белка?","options":[{"id":"S9-E10-1","text":"Кодирующая область — от старт-кодона до стоп-кодона","correct":true,"feedback":"5′- и 3′-нетранслируемые области аминокислоты не кодируют."},{"id":"S9-E10-2","text":"Все экзоны целиком","correct":false,"feedback":"Первый и последний экзоны обычно целиком или частично нетранслируемые."},{"id":"S9-E10-3","text":"Вся мРНК от кэпа до поли(А)-хвоста","correct":false,"feedback":"Кэп, нетранслируемые области и поли(А)-хвост в белок не транслируются."}]}},{"id":"alternative-splicing","section":3,"questions":[4],"title":"Альтернативный сплайсинг: разные мРНК одного гена","keywords":["альтернативный сплайсинг","кассетный экзон","альтернативный сайт сплайсинга","удержание интрона","изоформы"],"lead":["Уже известно: сплайсосома узнаёт сайты сплайсинга (БИО-9·15).","Новое: в пре-мРНК одного гена могут использоваться разные сайты, и тогда из разных её молекул образуются разные зрелые мРНК."],"mechanism":["[[T67|Альтернативный сплайсинг]] — образование разных зрелых мРНК из пре-мРНК одной транскрипционной единицы за счёт разного выбора сайтов сплайсинга.","Основные варианты: включение или пропуск экзона ([[T51|альтернативный экзон]]); выбор альтернативного 5′- или 3′-сайта (экзон длиннее или короче); удержание интрона; взаимоисключающие экзоны.","Каждая молекула пре-мРНК сплайсируется одним способом, но разные молекулы — по-разному; поэтому в клетке одновременно может быть несколько вариантов, а может быть и один.","Выбор зависит от последовательностей пре-мРНК, которые усиливают или подавляют использование сайта, и от связывающихся с ними белков; их набор различается в тканях."],"paragraphs":["Альтернативный сплайсинг найден у большинства многоинтронных генов человека (по полногеномным оценкам — более 95 %); учебник отмечает, что эта цифра, вероятно, завышена: многие варианты образуются редко и могут не иметь функции.","Последовательность ДНК при этом не меняется: разные мРНК — результат обработки одной и той же пре-мРНК."],"conditions":"Схема шага — модель вкладки 4.","sources":["Alberts2022","Choquet2025"],"quiz":{"id":"S9-L21","question":"В двух тканях из одного гена получаются мРНК с экзоном 3 и без него. Что при этом верно?","options":[{"id":"S9-L21-1","text":"В одной из тканей экзон 3 утрачен из ДНК","correct":false,"feedback":"Для пропуска экзона изменение ДНК не нужно."},{"id":"S9-L21-2","text":"В тканях транскрибируются разные гены","correct":false,"feedback":"Обе мРНК образуются из пре-мРНК одного гена."},{"id":"S9-L21-3","text":"Последовательность гена одинакова; различается выбор сайтов сплайсинга в молекулах пре-мРНК этого гена","correct":true,"feedback":"Альтернативный сплайсинг меняет состав зрелой мРНК без изменения ДНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Включение и пропуск экзона 3","status":"Схема качественная · длины условные","modes_label":"Что показать","modes":["экзон 3 включён","экзон 3 пропущен"],"scene":"s4b","args":[["inc","prox"],["skip","prox"]],"L":{"s4_e3":"Экзон 3","s4_e3_inc":"включён","s4_e3_skip":"пропущен","s4_ss":"5′-сайт сплайсинга интрона 1","s4_ss_prox":"ближний","s4_ss_dist":"дальний","s4_ctrl_note":"Ген один и тот же; меняется только то, какие сайты сплайсинга использованы при созревании пре-мРНК. У интрона 1 два возможных 5′-сайта: ближний — у самого конца экзона 1 и дальний — на 35 нуклеотидов ниже по ходу транскрипции, внутри интрона. Длина экзона 3 — 63 нуклеотида (кратна трём). Длины участков условные.","s4_pA":"А. Пре-мРНК (организация как в гене) и выбранные соединения экзонов","s4_pB":"Б. Зрелая мРНК","s4_pC":"В. Белок (схема; синтез белка — семинар 10)","s4_lbl_stop":"стоп","s4_lbl_e1":"экзон из одной 5′-НТО","s4_lbl_e3":"альтернативный экзон","s4_lbl_utr5":"5′-НТО: {n} нт","s4_lbl_cds":"кодирующая область: {n} нт","s4_lbl_utr3":"3′-НТО: {n} нт","s4_lbl_prot_inc":"{n} аминокислот; тёмный участок кодирует экзон 3","s4_lbl_prot_skip":"{n} аминокислот: нет внутреннего участка из 21 аминокислоты; начало и конец те же","s4_r_ex":"Экзоны в зрелой мРНК","s4_v_ex":"{e}","s4_r_utr5":"5′-нетранслируемая область","s4_v_nt":"{n} нт","s4_r_cds":"Кодирующая область","s4_r_cds_s":"от старт-кодона до стоп-кодона","s4_v_cds":"{n} нт, {c} кодонов","s4_r_prot":"Белок","s4_v_prot_inc":"{n} аминокислот","s4_v_prot_skip":"{n} аминокислот, без участка экзона 3","s4_r_dna":"Последовательность гена","s4_v_dna":"та же во всех вариантах","s4_cap_inc_prox":"Используются все экзоны и ближний 5′-сайт интрона 1. Экзон 1 целиком нетранслируемый, экзон 2 содержит конец 5′-НТО и старт-кодон, экзон 4 — стоп-кодон и начало 3′-НТО, экзон 5 — остальную 3′-НТО.","s4_cap_inc_prox_z":"Экзон — участок гена, который сохраняется в зрелой мРНК, а не обязательно кодирующий: в этом гене экзоны 1 и 5 целиком нетранслируемые, а экзоны 2 и 4 — частично.","s4_cap_skip_prox":"Экзон 3 пропущен: экзон 2 соединён прямо с экзоном 4. Длина экзона 3 кратна трём, поэтому без него кодирующая область короче на 21 кодон, а начало и конец белка те же; внутреннего участка из 21 аминокислоты нет.","s4_cap_skip_prox_z":"Альтернативный сплайсинг меняет состав зрелой мРНК, а последовательность гена остаётся прежней.","s4_cap_inc_dist":"Использован дальний 5′-сайт интрона 1: участок, который при ближнем сайте удалялся с интроном, остался в экзоне 1. Удлинилась только 5′-НТО; кодирующая область и белок не изменились.","s4_c
