<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-9.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Транскрипция и процессинг пре-мРНК: от транскрипционной единицы к зрелой мРНК</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-transcription-unit"><div class="eyebrow">Матричная и кодирующая цепи ДНК и ориентация транскрипционной единицы · шаг 1 из 26</div><h2>Транскрипция и транскрипционная единица</h2><p class="lead">Уже известно: две цепи ДНК комплементарны и антипараллельны, и каждая может служить матрицей (<a href="https://fresll.github.io/bio/seminar-7-route.html#double-helix">вспомнить БИО-7·2</a>); изменение последовательности ДНК копируется в РНК, если находится в транскрибируемом участке (<a href="https://fresll.github.io/bio/seminar-8-route.html#exit-to-gene">вспомнить БИО-8·26</a>). Новое: при транскрипции копируется не весь геном и не обе цепи, а определённый участок одной цепи. Раздел относится к вопросу 8 коллоквиума 2 (предварительный список) и вопросу 19 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Синтез вправо: матрица — нижняя цепь; РНК совпадает с верхней (T вместо U).</div><ol class="mech"><li><a href="#ns-g-S9-T01">Транскрипция</a> — синтез РНК на матрице ДНК; его осуществляет ДНК-зависимая РНК-полимераза. Матричная ДНК при этом не изменяется.</li><li><a href="#ns-g-S9-T02">Транскрипционная единица</a> — участок ДНК, с которого синтезируется определённая РНК: от точки начала транскрипции до области терминации. Её транскрипцию обеспечивает <a href="#ns-g-S9-T08">промотор</a>, расположенный у начала единицы и задающий направление синтеза.</li><li>Нуклеотид ДНК, против которого стоит первый нуклеотид РНК, — <a href="#ns-g-S9-T09">точка начала транскрипции</a> (+1).</li><li>РНК, синтезированная с транскрипционной единицы, — первичный транскрипт; у белок-кодирующих генов эукариот это <a href="#ns-g-S9-T30">пре-мРНК</a>, которая ещё пройдёт процессинг (раздел 3).</li></ol><p>В отличие от репликации, транскрибируется лишь часть генома, и многие участки — многократно: с активного гена одна молекула РНК-полимеразы может начинать синтез, пока предыдущая ещё не закончила. Поэтому с одного гена образуется множество одинаковых молекул РНК.</p><p>Ошибки транскрипции случаются чаще, чем ошибки репликации (у РНК-полимеразы — около одной на 10⁴ нуклеотидов), но затрагивают только одну молекулу РНК и не передаются дочерним клеткам.</p><p>РНК-полимеразе не нужна затравка: она начинает новую цепь сама, присоединяя рибонуклеотиды по матрице.</p><div class="static-quiz"><h3>Чем транскрипция отличается от репликации ДНК?</h3><ol><li><b>А.</b> Копируется участок одной цепи — транскрипционная единица, а продуктом служит РНК <i>(верный вариант)</i><br><span class="expl">При транскрипции матрицей служит одна цепь определённого участка, а синтезируется РНК; при репликации копируются обе цепи всего генома.</span></li><li><b>Б.</b> Копируются обе цепи всего генома, но из рибонуклеотидов <i>(неверный вариант)</i><br><span class="expl">Обе цепи всего генома копируются при репликации; транскрипция считывает отдельные участки одной цепи.</span></li><li><b>В.</b> Для начала синтеза нужна РНК-затравка, как у ДНК-полимеразы <i>(неверный вариант)</i><br><span class="expl">РНК-полимераза начинает цепь без затравки; затравка нужна ДНК-полимеразе.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 1: участок ДНК 12 пар нуклеотидов, последовательность условная.</p></details></article><article class="card print-unit" id="ns-template-coding"><div class="eyebrow">Матричная и кодирующая цепи ДНК и ориентация транскрипционной единицы · шаг 2 из 26</div><h2>Матричная и кодирующая цепи: что с чем совпадает</h2><p class="lead">Уже известно: новый нуклеотид присоединяется к 3′-OH растущей цепи (<a href="https://fresll.github.io/bio/seminar-7-route.html#polymerase-rule">вспомнить БИО-7·4</a>). Новое: то же правило у РНК-полимеразы определяет, как РНК связана с каждой из двух цепей ДНК.</p><div class="note"><strong>Что показывает схема.</strong> Верхняя цепь совпадает с РНК (T вместо U): она кодирующая.</div><ol class="mech"><li>РНК удлиняется от 5′- к 3′-концу: каждый новый рибонуклеотид присоединяется к 3′-OH растущей цепи.</li><li>Поэтому РНК-полимераза движется вдоль <a href="#ns-g-S9-T03">матричной цепи</a> в направлении 3′→5′: РНК комплементарна ей и антипараллельна.</li><li>Вторая цепь — <a href="#ns-g-S9-T04">кодирующая</a>: она комплементарна матричной и потому совпадает с РНК, если заменить T на U.</li><li>Пары при транскрипции: A матрицы — U в РНК, T — A, G — C, C — G.</li></ol><p>Сравнивать цепи нужно в одном направлении — от 5′ к 3′. Если читать слева направо обе цепи ДНК и РНК, не учитывая их концов, РНК может не совпасть ни с одной из цепей.</p><p>Последовательности генов в базах данных записывают по кодирующей цепи от 5′ к 3′: по такой записи сразу видна последовательность РНК (с заменой T на U).</p><p>Пример: матрица 3′-TACGGAATT-5′ — РНК 5′-AUGCCUUAA-3′ — кодирующая цепь 5′-ATGCCTTAA-3′.</p><div class="static-quiz"><h3>Кодирующая цепь участка гена — 5′-GATTC-3′. Какой будет РНК?</h3><ol><li><b>А.</b> 5′-CUAAG-3′ <i>(неверный вариант)</i><br><span class="expl">Это последовательность, комплементарная кодирующей цепи, да ещё без учёта направления цепей; РНК не комплементарна кодирующей цепи, а совпадает с ней.</span></li><li><b>Б.</b> 5′-GAUUC-3′ <i>(верный вариант)</i><br><span class="expl">РНК совпадает с кодирующей цепью, если T заменить на U.</span></li><li><b>В.</b> 3′-CUAAG-5′ <i>(неверный вариант)</i><br><span class="expl">Комплементарна кодирующей цепи матричная цепь ДНК (3′-CTAAG-5′), а не РНК; РНК совпадает с кодирующей.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 1; переключатель меняет цепь, которую сравнивают с РНК.</p></details></article><article class="card print-unit" id="ns-orientation"><div class="eyebrow">Матричная и кодирующая цепи ДНК и ориентация транскрипционной единицы · шаг 3 из 26</div><h2>Какая цепь служит матрицей, задаёт ориентация транскрипционной единицы</h2><p class="lead">Уже известно: матрица антипараллельна РНК, а РНК растёт от 5′ к 3′. Новое: от промотора зависит, в какую сторону пойдёт синтез, а значит — какая из двух цепей станет матрицей.</p><div class="note"><strong>Что показывает схема.</strong> Синтез вправо: верхняя цепь совпадает с РНК — она кодирующая.</div><ol class="mech"><li>Промотор асимметричен: связавшиеся с ним общие факторы ориентируют РНК-полимеразу II, и синтез идёт от точки +1 в одну сторону.</li><li>При синтезе вправо матрицей служит цепь, ориентированная 3′→5′ слева направо; при синтезе влево — другая цепь.</li><li>Поэтому для одной транскрипционной единицы матрица одна, но у соседних единиц матрицами могут быть разные цепи одной молекулы ДНК.</li><li>Нельзя назвать одну цепь всей хромосомы матричной или кодирующей: это роли цепи по отношению к конкретной единице.</li></ol><p>Обратная задача решается так: найдите цепь, совпадающую с РНК при чтении от 5′ к 3′ (с заменой U на T) — это кодирующая цепь; матрица — другая, а направление синтеза указывает положение 5′-конца РНК.</p><p>В геноме человека гены, соседние на хромосоме, нередко транскрибируются в противоположных направлениях; встречаются и единицы, частично перекрывающиеся на разных цепях.</p><div class="static-quiz"><h3>Два соседних гена одной хромосомы транскрибируются навстречу друг другу. Что можно сказать об их матрицах?</h3><ol><li><b>А.</b> Матрица одна и та же: у хромосомы одна матричная цепь <i>(неверный вариант)</i><br><span class="expl">Матричную цепь задаёт ориентация каждой единицы; постоянной матричной цепи у хромосомы нет.</span></li><li><b>Б.</b> Встречная транскрипция невозможна: РНК-полимеразы столкнутся <i>(неверный вариант)</i><br><span class="expl">Встречно ориентированные гены обычны; столкновение возможно лишь там, где единицы перекрываются, и не делает их существование невозможным.</span></li><li><b>В.</b> Матрицы — разные цепи одной молекулы ДНК <i>(верный вариант)</i><br><span class="expl">При противоположных направлениях синтеза антипараллельность требует разных матриц.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 1: тот же участок при двух ориентациях промотора.</p></details></article><article class="card print-unit" id="ns-two-units"><div class="eyebrow">Матричная и кодирующая цепи ДНК и ориентация транскрипционной единицы · шаг 4 из 26</div><h2>Две перекрывающиеся транскрипционные единицы на одном участке ДНК</h2><p class="lead">Уже известно: матрицу задаёт ориентация конкретной единицы (БИО-9·3). Новое: что получится, если две единицы на одном коротком участке перекрываются, и как по РНК восстановить матрицу.</p><div class="note"><strong>Что показывает схема.</strong> Единица II встречная: её матрица — верхняя цепь, а для единицы I верхняя цепь кодирующая, в том числе в участке перекрывания.</div><ol class="mech"><li>Если единицы I и II ориентированы навстречу, у I матрица — одна цепь, у II — другая. Там, где единицы перекрываются, одни и те же нуклеотиды цепи служат матрицей для одной единицы и кодирующей цепью для другой, а РНК двух единиц в этом участке комплементарны друг другу.</li><li>Если ориентация одинакова, матрица у обеих единиц одна и та же цепь.</li><li>По РНК и направлению синтеза матрица восстанавливается однозначно: она комплементарна РНК и антипараллельна ей, а её 3′-конец стоит напротив 5′-конца РНК.</li><li>Для одной единицы обе цепи сразу матрицей быть не могут: РНК растёт 5′→3′ и антипараллельна только одной цепи.</li></ol><p>Обратная задача модели: РНК 5′-AAGCAUUCGGACUAUC-3′, синтез справа налево. Нижняя цепь от правого края участка к середине, прочитанная от 5′ к 3′, совпадает с РНК (U → T); значит, матрица — верхняя цепь, 3′-TTCGTAAGCCTGATAG-5′.</p><p>Модель условная: единицы по 16 нуклеотидов, перекрываются на 6 пар, промоторы показаны только прямоугольниками. Она не показывает, мешают ли две единицы друг другу, — об этом следующий шаг.</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>РНК 5′-GGCU-3′ синтезирована при движении РНК-полимеразы справа налево. Как записать её матрицу от 3′ к 5′?</h3><ol><li><b>А.</b> 3′-CCGA-5′ <i>(верный вариант)</i><br><span class="expl">Напротив 5′-G РНК стоит C у 3′-конца матрицы; матрица комплементарна РНК и антипараллельна ей.</span></li><li><b>Б.</b> 3′-GGCT-5′ <i>(неверный вариант)</i><br><span class="expl">Это последовательность РНК с T вместо U — кодирующая цепь, а не матрица.</span></li><li><b>В.</b> 5′-CCGA-3′ <i>(неверный вариант)</i><br><span class="expl">Буквы верные, но концы перепутаны: у матрицы 3′-конец напротив 5′-конца РНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Учебная модель с условной последовательностью; правила — по учебнику Alberts et al.</p></details></article><article class="card print-unit" id="ns-interference"><div class="eyebrow">Матричная и кодирующая цепи ДНК и ориентация транскрипционной единицы · шаг 5 из 26</div><h2>По полногеномным данным перекрывающиеся встречные единицы чаще активны согласованно, чем подавляют друг друга</h2><p class="lead">Уже известно: на одном участке ДНК могут быть единицы противоположной ориентации (БИО-9·4). Новое: обе цепи генома человека транскрибируются во многих участках, и у большинства перекрывающихся пар единиц активность изменяется согласованно, а не противоположно.</p><div class="note"><strong>Что показывает схема.</strong> Единица I: матрица — нижняя цепь.</div><ol class="mech"><li>По оценке полногеномной работы, около четверти активных точек начала транскрипции в изученных клетках человека относится к встречным промоторам — промоторам на противоположных цепях, направленным навстречу друг другу; найдено также более 5000 пар, в которых длинная некодирующая РНК перекрывается с белок-кодирующим геном.</li><li>Давно предполагали, что встречно движущиеся РНК-полимеразы будут мешать друг другу и вытеснять белки с промоторов — транскрипционная интерференция.</li><li>Анализ тысяч перекрывающихся пар показал, что у большинства активность обеих единиц изменяется согласованно, а не противоположно.</li><li>Для встречных промоторов полногеномные данные противоречивы: в части работ найдено ослабление экспрессии, в части — нет. Сильное подавление одной единицы другой показано для отдельных генов; почему одни участки чувствительны к интерференции, а другие нет, — открытый вопрос.</li></ol><p>Как это узнали: сравнивали, как меняется количество РНК обеих единиц в тысячах пар перекрывающихся генов в разных клетках и условиях. Согласованное изменение — это корреляция: оно не доказывает, что единицы вовсе не влияют друг на друга, и не исключает подавления в отдельных генах.</p><p>Граница вывода: работа — обзор-перспектива по данным многих исследований; она не устанавливает механизм, а ставит вопрос, почему интерференция проявляется только в части участков.</p><p>Связанная модель — в практикуме: вопрос 1, уровень «Продвинутый» (две перекрывающиеся транскрипционные единицы); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>В двух перекрывающихся встречных единицах активность изменяется согласованно в разных тканях. Какой вывод допустим?</h3><ol><li><b>А.</b> Единицы транскрибируются с одной матричной цепи <i>(неверный вариант)</i><br><span class="expl">У встречных единиц матрицы — разные цепи; согласованность активности этого не меняет.</span></li><li><b>Б.</b> Активность единиц связана положительно, но есть ли между ними интерференция и насколько она сильна, это наблюдение не показывает <i>(верный вариант)</i><br><span class="expl">Согласованность — корреляция: обе единицы могут зависеть от общих регуляторов, а подавление одной единицы другой может скрываться за общим усилением транскрипции участка. Чтобы проверить интерференцию, меняют транскрипцию одной единицы и измеряют активность другой.</span></li><li><b>В.</b> Доказано, что одна единица активирует другую <i>(неверный вариант)</i><br><span class="expl">Корреляция не устанавливает причину: обе единицы могут зависеть от общих регуляторов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41588-026-02536-8">Fischer M., Hoffmann S. Transcriptional interference revisited. Nat Genet. 2026;58:974–983</a></li><li><a href="https://doi.org/10.1038/s41588-024-02025-w">Wiechens E., Vigliotti F., Siniuk K. et al. Gene regulation by convergent promoters. Nat Genet. 2025;57:206–217</a></li></ul><p>Данные — клетки и ткани человека, анализ транскриптов; сводка в перспективной статье, доля встречных промоторов — по полногеномной работе на клетках человека.</p></details></article><article class="card print-unit" id="ns-rna-polymerases"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 6 из 26</div><h2>Три РНК-полимеразы ядра и РНК-полимераза II</h2><p class="lead">Уже известно: РНК-полимераза синтезирует РНК 5′→3′ по матричной цепи (БИО-9·2). Новое: в ядре эукариот три РНК-полимеразы, и транскрипты разных классов синтезирует разная полимераза. Раздел относится к вопросам 8 и 9 коллоквиума 2 (предварительный список) и вопросу 19 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Полный цикл: сборка на промоторе, элонгация, расщепление и терминация.</div><ol class="mech"><li>РНК-полимераза I синтезирует в ядрышке общий предшественник рРНК, из которого образуются 18S, 5,8S и 28S рРНК.</li><li><a href="#ns-g-S9-T07">РНК-полимераза II</a> транскрибирует все белок-кодирующие гены (синтезирует пре-мРНК) и гены многих некодирующих РНК, в том числе большинства малых ядерных РНК и предшественников микроРНК.</li><li>РНК-полимераза III синтезирует тРНК, 5S рРНК и другие короткие РНК.</li><li>У РНК-полимеразы II есть <a href="#ns-g-S9-T21">C-концевой домен</a> — повторы из семи аминокислот (у человека 52). Его фосфорилирование меняется по ходу транскрипции, и с ним связываются белки процессинга.</li></ol><p>Каждая полимераза узнаёт промоторы своего типа при участии собственного набора общих факторов транскрипции. Дальше в семинаре речь идёт только о РНК-полимеразе II.</p><p>Кэп, сплайсинг сплайсосомой и поли(А)-хвост характерны для транскриптов РНК-полимеразы II; транскрипты РНК-полимераз I и III проходят иной процессинг.</p><div class="static-quiz"><h3>Какая РНК-полимераза синтезирует пре-мРНК белок-кодирующих генов?</h3><ol><li><b>А.</b> РНК-полимераза I <i>(неверный вариант)</i><br><span class="expl">РНК-полимераза I синтезирует предшественник рРНК в ядрышке.</span></li><li><b>Б.</b> РНК-полимераза III <i>(неверный вариант)</i><br><span class="expl">РНК-полимераза III синтезирует тРНК, 5S рРНК и другие короткие РНК.</span></li><li><b>В.</b> РНК-полимераза II <i>(верный вариант)</i><br><span class="expl">РНК-полимераза II транскрибирует все белок-кодирующие гены.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 2.</p></details></article><article class="card print-unit" id="ns-promoter-start"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 7 из 26</div><h2>Промотор и точка начала транскрипции: +1 — не старт-кодон</h2><p class="lead">Уже известно: промотор задаёт начало и направление синтеза (БИО-9·3). Новое: из каких элементов состоит промотор РНК-полимеразы II и чем начало транскрипции отличается от начала трансляции.</p><div class="note"><strong>Что показывает схема.</strong> TFIID связывается с TATA-боксом.</div><ol class="mech"><li><a href="#ns-g-S9-T08">Промотор</a> — участок ДНК, включающий точку начала транскрипции (+1) и прилегающие последовательности, с которыми связываются <a href="#ns-g-S9-T60">общие факторы транскрипции</a>.</li><li>Один из элементов промотора — <a href="#ns-g-S9-T10">TATA-бокс</a>, обычно примерно за 30 нуклеотидов до точки +1. Он есть не у всех промоторов: у многих генов человека его нет.</li><li>Положение начала задают и другие элементы: <a href="#ns-g-S9-T11">инициаторный элемент (Inr)</a> у самой точки +1, DPE после неё, а также последовательности, которые узнаёт TFIIB.</li><li><a href="#ns-g-S9-T09">Точка +1</a> — начало РНК; <a href="#ns-g-S9-T24">старт-кодон</a> находится дальше по гену. Участок РНК между ними не транслируется.</li></ol><p>Поэтому удаление участка промотора нарушает начало транскрипции, хотя кодирующая последовательность не изменена, а изменение старт-кодона не меняет места начала транскрипции.</p><p>Начало транскрипции и начало трансляции — разные события разных машин: первое — РНК-полимераза II и общие факторы на ДНК, второе — рибосома на мРНК (семинар 10).</p><div class="static-quiz"><h3>В гене человека нет TATA-бокса. Какое утверждение верно?</h3><ol><li><b>А.</b> Начало транскрипции может задаваться другими элементами промотора, которые узнаёт TFIID <i>(верный вариант)</i><br><span class="expl">TATA-бокс — лишь один из элементов; Inr, DPE и другие последовательности тоже задают положение начала.</span></li><li><b>Б.</b> Такой ген не может транскрибироваться РНК-полимеразой II <i>(неверный вариант)</i><br><span class="expl">Многие гены, транскрибируемые РНК-полимеразой II, не имеют TATA-бокса.</span></li><li><b>В.</b> Транскрипция начнётся со старт-кодона ATG <i>(неверный вариант)</i><br><span class="expl">ATG — сигнал начала трансляции; место начала транскрипции задаёт промотор.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 2: промотор с TATA-боксом и без него.</p></details></article><article class="card print-unit" id="ns-pic-assembly"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 8 из 26</div><h2>Сборка преинициаторного комплекса: общие факторы, активаторы и медиатор</h2><p class="lead">Уже известно: РНК-полимераза II промотор сама не узнаёт. Новое: как на промоторе собирается комплекс и как регуляторные белки меняют частоту инициации.</p><div class="note"><strong>Что показывает схема.</strong> Комплекс собирается часто.</div><ol class="mech"><li>Сборку начинает <a href="#ns-g-S9-T12">TFIID</a>: его TATA-связывающий белок узнаёт TATA-бокс, другие субъединицы — другие элементы промотора; TFIID изгибает ДНК.</li><li>Затем присоединяются <a href="#ns-g-S9-T13">TFIIB</a> (он ориентирует полимеразу и задаёт направление синтеза) и <a href="#ns-g-S9-T61">TFIIA</a>, РНК-полимераза II вместе с <a href="#ns-g-S9-T14">TFIIF</a>, затем <a href="#ns-g-S9-T15">TFIIE</a> и <a href="#ns-g-S9-T16">TFIIH</a>. Вместе они образуют <a href="#ns-g-S9-T17">преинициаторный комплекс</a>.</li><li><a href="#ns-g-S9-T18">Белки-активаторы</a>, связанные с <a href="#ns-g-S9-T19">энхансерами</a>, ускоряют сборку комплекса; посредником между ними и полимеразой служит крупный комплекс <a href="#ns-g-S9-T20">медиатор</a>.</li><li>Белки-репрессоры, напротив, мешают сборке — например, конкурируют с активаторами за участок ДНК.</li></ol><p>Общие факторы нужны для транскрипции всех генов, транскрибируемых РНК-полимеразой II; активаторы и репрессоры у разных генов разные. Поэтому от регуляторных белков зависит, как часто начинается транскрипция данного гена, а место начала и последовательность РНК задаёт промотор этой транскрипционной единицы.</p><p>В клетке на промоторе нужны и белки, изменяющие хроматин: ДНК упакована в нуклеосомы. Подробно регуляция транскрипции — семинар 11 и курс «Молекулярная биология».</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Чем различаются энхансер и промотор — <a href="https://fresll.github.io/molbio/seminar-6-route.html#enhancer">МБ, семинар 6, шаг 9</a>; как факторы и коактиваторы связывают контакт энхансера с транскрипцией — <a href="https://fresll.github.io/molbio/seminar-6-route.html#coactivators">МБ, семинар 6, шаг 12</a>.</p><div class="static-quiz"><h3>В клетке нет белка-активатора гена, а общие факторы и медиатор есть. Что ожидается в модели?</h3><ol><li><b>А.</b> Транскрипция начинается в другом месте гена <i>(неверный вариант)</i><br><span class="expl">Место начала задают элементы промотора, а не активатор.</span></li><li><b>Б.</b> Транскрипция начинается реже, но с той же точки +1 <i>(верный вариант)</i><br><span class="expl">Активатор ускоряет сборку комплекса; место и направление начала задаёт промотор.</span></li><li><b>В.</b> Синтезируется РНК другой последовательности <i>(неверный вариант)</i><br><span class="expl">Последовательность РНК задаёт матрица; активатор влияет на частоту инициации.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 2: без активатора инициация в модели редкая; это качественная оценка.</p></details></article><article class="card print-unit" id="ns-escape-elongation"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 9 из 26</div><h2>От инициации к элонгации: расплетание ДНК и C-концевой домен</h2><p class="lead">Уже известно: на промоторе собран преинициаторный комплекс (БИО-9·8). Новое: что нужно, чтобы полимераза начала синтез и ушла с промотора.</p><div class="note"><strong>Что показывает схема.</strong> Цепи расплетены, полимераза ушла с промотора.</div><ol class="mech"><li>TFIIH, используя энергию АТФ, расплетает двойную спираль у точки +1, и матричная цепь становится доступной: полимераза синтезирует первые нуклеотиды РНК — так завершается <a href="#ns-g-S9-T58">инициация</a>.</li><li>Киназа в составе TFIIH фосфорилирует серин 5 в повторах C-концевого домена; полимераза отделяется от общих факторов и уходит с промотора.</li><li>При <a href="#ns-g-S9-T59">элонгации</a> полимераза движется по гену, РНК растёт от 5′ к 3′; короткий участок спирали РНК–ДНК внутри пузырька — около девяти пар нуклеотидов, позади полимеразы РНК отходит, а ДНК восстанавливает двойную спираль.</li><li>Факторы элонгации помогают полимеразе проходить нуклеосомы и снижают вероятность её отделения раньше конца гена; по ходу элонгации фосфорилируется серин 2 C-концевого домена.</li></ol><p>Сборка комплекса ещё не означает начала синтеза: без TFIIH неполный комплекс стоит на промоторе, а РНК не синтезируется.</p><p>С фосфорилированным C-концевым доменом связываются ферменты кэпирования, белки сплайсинга и образования 3′-конца — поэтому процессинг идёт во время транскрипции (раздел 3).</p><div class="static-quiz"><h3>Какое событие сопровождает уход РНК-полимеразы II с промотора?</h3><ol><li><b>А.</b> Присоединение поли(А)-хвоста к РНК <i>(неверный вариант)</i><br><span class="expl">Поли(А)-хвост добавляется к 3′-концу пре-мРНК после её расщепления, в конце гена.</span></li><li><b>Б.</b> Связывание TFIID с TATA-боксом <i>(неверный вариант)</i><br><span class="expl">Это первый шаг сборки комплекса, а не ухода с промотора.</span></li><li><b>В.</b> Фосфорилирование серина 5 C-концевого домена киназой TFIIH <i>(верный вариант)</i><br><span class="expl">Фосфорилирование освобождает полимеразу от общих факторов, и начинается элонгация.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 2: без TFIIH процесс останавливается на втором этапе.</p></details></article><article class="card print-unit" id="ns-termination"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 10 из 26</div><h2>Терминация РНК-полимеразы II связана с расщеплением 3′-конца</h2><p class="lead">Уже известно: полимераза движется по гену, РНК растёт (БИО-9·9). Новое: где кончается пре-мРНК и где полимераза покидает ДНК — разные места.</p><div class="note"><strong>Что показывает схема.</strong> 3′-конец — в месте расщепления; полимераза отделяется вскоре за ним.</div><ol class="mech"><li>После того как полимераза транскрибирует <a href="#ns-g-S9-T25">сигнал AAUAAA</a>, факторы расщепления и полиаденилирования разрезают пре-мРНК в 10–30 нуклеотидах ниже; к этому <a href="#ns-g-S9-T26">концу</a> добавляется поли(А)-хвост.</li><li>Полимераза при этом не останавливается: она продолжает синтез ещё на сотни нуклеотидов и больше.</li><li>Белки образования 3′-конца изменяют полимеразу и замедляют её (аллостерическая модель); а РНК, синтезированную после места расщепления, не защищённую кэпом, разрушает <a href="#ns-g-S9-T28">5′→3′-экзонуклеаза</a> и, догнав полимеразу, способствует её отделению (торпедная модель). В клетке, по-видимому, работают оба механизма.</li><li>Поэтому положение 3′-конца мРНК определяет расщепление, а не место <a href="#ns-g-S9-T27">терминации</a>.</li></ol><p>Единой последовательности-«терминатора», на которой РНК-полимераза II мгновенно отделялась бы от ДНК, нет: терминация — растянутый процесс ниже места расщепления.</p><p>Если не работает экзонуклеаза, 3′-конец пре-мРНК прежний, а полимераза отделяется от ДНК дальше по гену. Если не происходит расщепления, нет и поли(А)-хвоста, а полимераза идёт далеко за ген.</p><div class="static-quiz"><h3>Что определяет положение 3′-конца мРНК?</h3><ol><li><b>А.</b> Место расщепления пре-мРНК ниже сигнала AAUAAA <i>(верный вариант)</i><br><span class="expl">К концу, созданному расщеплением, добавляется поли(А)-хвост; полимераза отделяется от ДНК позже.</span></li><li><b>Б.</b> Место, где РНК-полимераза II отделяется от ДНК <i>(неверный вариант)</i><br><span class="expl">Полимераза отделяется дальше по гену, уже после расщепления.</span></li><li><b>В.</b> Последовательность-терминатор, на которой полимераза останавливается <i>(неверный вариант)</i><br><span class="expl">Такой последовательности у РНК-полимеразы II нет: терминация связана с расщеплением и экзонуклеазой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41580-026-01005-8">Song A., Hu M., Chen F. X. Mechanisms of transcription termination across the coding and noncoding loci of the genome. Nat Rev Mol Cell Biol. 2026</a></li></ul><p>Схема шага — модель вкладки 2; расстояния условные.</p></details></article><article class="card print-unit" id="ns-promoter-proximal"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 11 из 26</div><h2>Начатый синтез не всегда становится полным транскриптом</h2><p class="lead">Уже известно: после ухода с промотора полимераза переходит к элонгации (БИО-9·9). Новое: у животных этот переход — не автоматический; многие начатые синтезы прекращаются у промотора.</p><div class="note"><strong>Что показывает схема.</strong> За 30 мин начато 60 синтезов, завершено 36.</div><ol class="mech"><li>Синтезировав 20–100 нуклеотидов, РНК-полимераза II обычно останавливается у промотора — это <a href="#ns-g-S9-T22">пауза</a>; её стабилизируют специальные белки.</li><li>Из паузы возможны два исхода: переход к продуктивной элонгации (для этого киназа фосфорилирует полимеразу и белки паузы) или преждевременное прекращение синтеза.</li><li>Преждевременное прекращение у промотора оказалось широко распространённым: его осуществляет комплекс Integrator, который разрезает растущую РНК, вместе с фосфатазой, снимающей фосфаты, нужные для элонгации.</li><li>Отрезанная <a href="#ns-g-S9-T23">короткая РНК</a> быстро разрушается в ядре. Поэтому число начатых синтезов больше числа полных транскриптов.</li></ol><p>Как это узнали: в клетках человека и других животных останавливали инициацию и измеряли, сколько времени полимеразы остаются у промоторов; другим способом показали, что полимеразы у промотора сменяются быстрее, чем уходят в элонгацию. Значит, часть их прекращает синтез у промотора.</p><p>Граница вывода: это сводка многих работ в обзоре; доля прекращающих синтез полимераз различается у разных генов и не измерена здесь для какого-либо конкретного гена.</p><p>Связанная модель — в практикуме: вопрос 2, уровень «Продвинутый» (поток молекул РНК-полимеразы II: инициация, пауза, продуктивная элонгация); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>Что из перечисленного согласуется с широко распространённым преждевременным прекращением синтеза у промоторов?</h3><ol><li><b>А.</b> Каждый начатый синтез обязательно даёт полную пре-мРНК <i>(неверный вариант)</i><br><span class="expl">Это противоречит данным: многие начатые синтезы прекращаются у промотора.</span></li><li><b>Б.</b> Число начатых синтезов РНК больше числа полных транскриптов <i>(верный вариант)</i><br><span class="expl">Часть полимераз прекращает синтез после паузы, и их короткие РНК разрушаются.</span></li><li><b>В.</b> Пауза у промотора возникает только при повреждении ДНК <i>(неверный вариант)</i><br><span class="expl">Пауза — обычный этап транскрипции многих генов животных.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-026-01005-8">Song A., Hu M., Chen F. X. Mechanisms of transcription termination across the coding and noncoding loci of the genome. Nat Rev Mol Cell Biol. 2026</a></li></ul><p>Данные — клетки животных и человека; сводка в обзоре.</p></details></article><article class="card print-unit" id="ns-few-complete"><div class="eyebrow">Инициация, элонгация и терминация транскрипции · шаг 12 из 26</div><h2>Мало завершённых транскриптов — разные причины</h2><p class="lead">Уже известно: путь от инициации до полного транскрипта включает несколько этапов (БИО-9·11). Новое: одинаково малое число завершённых РНК могут дать разные нарушения, и одного этого числа недостаточно для вывода.</p><div class="note"><strong>Что показывает схема.</strong> Начато 15, завершено 9.</div><ol class="mech"><li>В учебной модели число транскриптов, завершённых за время наблюдения t (больше 10 мин), = частота инициации × доля, перешедшая после паузы к продуктивной элонгации, × доля, дошедшая до конца гена, × (t − 10 мин): первые 10 мин полимеразы ещё проходят ген. В контроле за 30 мин: 2 в минуту × 0,9 × 1 × 20 мин = 36; за первые 10 мин — ни одного.</li><li>Около 10 завершённых за 30 мин (в контроле 36) дают каждое из трёх нарушений по отдельности — редкая инициация (0,5 в минуту), переход от паузы лишь у 25 % полимераз, прекращение синтеза в теле гена у 75 % продуктивных полимераз — и их сочетания (например, инициация 1 в минуту и переход от паузы у 50 % полимераз).</li><li>Если нарушение одно, различить причины помогают счётчики других этапов: число начатых синтезов (15 против 60), короткие РНК у промотора (45 при нарушении перехода от паузы, 6 при прекращении в теле гена) и незавершённые РНК середины гена.</li><li>В каждый момент начато = прекращено у промотора + прекращено в теле гена + на гене сейчас + завершено: молекулы не возникают и не исчезают без перехода.</li></ol><p>Все числа модели — учебные допущения, а не измеренные константы: время прохождения гена (10 мин) и доли подобраны так, чтобы итоги были сопоставимы.</p><p>Это общий принцип семинара: один и тот же наблюдаемый результат может возникнуть при нарушении разных процессов, поэтому вывод о причине требует наблюдения, по которому гипотезы предсказывают разное.</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Завершённых транскриптов мало, число начатых синтезов как в контроле, коротких РНК у промотора тоже как в контроле. Какая причина вероятнее в модели?</h3><ol><li><b>А.</b> Редкая инициация <i>(неверный вариант)</i><br><span class="expl">При редкой инициации число начатых синтезов было бы снижено.</span></li><li><b>Б.</b> Нарушение перехода от паузы к элонгации <i>(неверный вариант)</i><br><span class="expl">Тогда коротких РНК у промотора было бы намного больше.</span></li><li><b>В.</b> Прекращение синтеза в теле гена <i>(верный вариант)</i><br><span class="expl">Инициация и переход от паузы в норме; остаётся более поздний этап.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41580-026-01005-8">Song A., Hu M., Chen F. X. Mechanisms of transcription termination across the coding and noncoding loci of the genome. Nat Rev Mol Cell Biol. 2026</a></li></ul><p>Учебная модель 2а; принцип этапов — по учебнику и обзору о терминации.</p></details></article><article class="card print-unit" id="ns-primary-transcript"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 13 из 26</div><h2>Первичный транскрипт и котранскрипционный процессинг</h2><p class="lead">Уже известно: C-концевой домен РНК-полимеразы II связывает белки процессинга (БИО-9·9). Новое: пре-мРНК созревает в ядре в три основных события, и большая их часть идёт во время транскрипции. Раздел относится к вопросу 10 коллоквиума 2 (предварительный список) и вопросу 20 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Кэп, сплайсинг, 3′-конец и экспорт — мРНК в цитоплазме.</div><ol class="mech"><li><a href="#ns-g-S9-T30">Пре-мРНК</a> повторяет организацию гена: содержит экзоны и интроны и ещё не служит матрицей для трансляции.</li><li><a href="#ns-g-S9-T62">Процессинг пре-мРНК</a> — совокупность реакций, превращающих её в <a href="#ns-g-S9-T65">зрелую мРНК</a>: кэпирование 5′-конца, сплайсинг (удаление интронов и соединение экзонов), расщепление 3′-конца и <a href="#ns-g-S9-T64">полиаденилирование</a>.</li><li>Эти события в значительной мере сопряжены с транскрипцией (<a href="#ns-g-S9-T63">котранскрипционный процессинг</a>): белки процессинга связываются с C-концевым доменом и получают доступ к РНК по мере её выхода из полимеразы.</li><li>Поэтому процессинг — не обязательно цепочка операций после завершения синтеза: кэп присоединяется к растущей РНК, многие интроны удаляются, пока полимераза транскрибирует дальние участки гена.</li></ol><p>Интроны у млекопитающих составляют около 90 % длины пре-мРНК и удаляются в ядре. Сплайсинг многих из них начинается, пока полимераза ещё транскрибирует ген: сплайсосома собирается на растущей РНК. Насколько быстро удаляется каждый интрон, различается у разных интронов и генов (БИО-9·18).</p><p>Зрелая мРНК вместе с белками образует мРНП и только тогда экспортируется (<a href="#ns-g-S9-T66">ядерный экспорт мРНК</a>). Процессинг не равен экспорту: созревшая мРНК без рецептора экспорта остаётся в ядре.</p><div class="static-quiz"><h3>Какое утверждение о процессинге пре-мРНК верно?</h3><ol><li><b>А.</b> Многие события процессинга идут во время транскрипции, ещё до её окончания <i>(верный вариант)</i><br><span class="expl">Кэп присоединяется к растущей РНК, многие интроны удаляются котранскрипционно.</span></li><li><b>Б.</b> Процессинг начинается только после того, как полимераза покинула ДНК <i>(неверный вариант)</i><br><span class="expl">Белки процессинга связаны с полимеразой и работают по ходу синтеза.</span></li><li><b>В.</b> Процессинг пре-мРНК идёт в цитоплазме, после экспорта <i>(неверный вариант)</i><br><span class="expl">Кэпирование, сплайсинг и образование 3′-конца проходят в ядре.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41580-024-00706-2">Shine M., Gordon J., Schärfen L., Zigackova D., Herzel L., Neugebauer K. M. Co-transcriptional gene regulation in eukaryotes and prokaryotes. Nat Rev Mol Cell Biol. 2024;25:534–554</a></li></ul><p>Схема шага — модель вкладки 3; порядок этапов на шкале — учебный, в клетке они перекрываются во времени.</p></details></article><article class="card print-unit" id="ns-capping"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 14 из 26</div><h2>Кэпирование 5′-конца</h2><p class="lead">Уже известно: первый нуклеотид РНК несёт три фосфата. Новое: как этот конец превращается в кэп и зачем он нужен.</p><div class="note"><strong>Что показывает схема.</strong> мРНК созревает и выходит в цитоплазму.</div><ol class="mech"><li>Когда РНК-полимераза II синтезировала около 20 нуклеотидов РНК и её 5′-конец выходит из полимеразы, <a href="#ns-g-S9-T32">ферменты кэпирования</a>, связанные с C-концевым доменом (фосфорилированным по серину 5), модифицируют её 5′-конец.</li><li>РНК-трифосфатаза удаляет концевой фосфат, гуанилилтрансфераза присоединяет ГМФ (из ГТФ) необычной 5′–5′-трифосфатной связью, метилтрансфераза метилирует гуанин по атому азота в положении 7.</li><li><a href="#ns-g-S9-T31">Кэп</a> защищает 5′-конец от 5′→3′-экзонуклеаз; в ядре с ним связывается кэп-связывающий комплекс, который помогает дальнейшему процессингу и экспорту; в цитоплазме кэп нужен для инициации трансляции.</li><li>У РНК без кэпа 5′-конец остаётся трифосфатным; ферменты ядерного контроля качества изменяют его, после чего РНК разрушается от 5′-конца, а синтез таких РНК может обрываться вскоре после начала.</li></ol><p>Кэп из 7-метилгуанозина отличает мРНК от РНК, синтезированных РНК-полимеразами I и III: их транскрипты такого кэпа не получают (5′-конец некоторых транскриптов РНК-полимеразы III модифицирован иначе).</p><p>Кэп и поли(А)-хвост не закодированы в гене: их присоединяют ферменты процессинга.</p><div class="static-quiz"><h3>Какая связь соединяет кэп с первым нуклеотидом мРНК?</h3><ol><li><b>А.</b> Обычная 3′–5′-фосфодиэфирная <i>(неверный вариант)</i><br><span class="expl">Такая связь соединяет нуклеотиды внутри цепи; кэп присоединён иначе.</span></li><li><b>Б.</b> 5′–5′-трифосфатная <i>(верный вариант)</i><br><span class="expl">Гуанилилтрансфераза присоединяет ГМФ к 5′-концу «головой к голове».</span></li><li><b>В.</b> Пептидная <i>(неверный вариант)</i><br><span class="expl">Пептидная связь соединяет аминокислоты в белке.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 3.</p></details></article><article class="card print-unit" id="ns-splicing"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 15 из 26</div><h2>Сплайсинг: границы интрона, сплайсосома и лассо</h2><p class="lead">Уже известно: пре-мРНК содержит интроны. Новое: как сплайсосома узнаёт интрон и удаляет его.</p><div class="note"><strong>Что показывает схема.</strong> Интроны удалены, мРНК в цитоплазме.</div><ol class="mech"><li><a href="#ns-g-S9-T35">Интрон</a> обычно начинается с GU (5′-<a href="#ns-g-S9-T38">сайт сплайсинга</a>) и заканчивается AG (3′-сайт); внутри него, недалеко от 3′-сайта, — аденозин точки ветвления.</li><li><a href="#ns-g-S9-T36">Сплайсосома</a> — пять малых ядерных РНК (U1, U2, U4, U5, U6) и множество белков. U1 спаривается с 5′-сайтом, U2 — с участком точки ветвления; так узнаются границы интрона.</li><li>Первая реакция: 2′-OH аденозина точки ветвления атакует 5′-сайт, и 5′-конец интрона присоединяется к нему, образуя <a href="#ns-g-S9-T37">лассо</a>. Вторая реакция: освободившийся 3′-OH экзона атакует 3′-сайт, экзоны соединяются, интрон уходит в виде лассо.</li><li>Обе реакции — переэтерификации (одна связь заменяется другой), поэтому отдельный фермент-лигаза не нужен; каталитический центр сплайсосомы образуют её РНК. АТФ тратится на перестройки сплайсосомы, которые проверяют правильность сайтов.</li></ol><p>На месте соединения экзонов сплайсосома оставляет <a href="#ns-g-S9-T41">комплекс соединения экзонов</a> — белки, которые отмечают завершённый сплайсинг и участвуют в экспорте.</p><p>Порядок удаления интронов не обязательно совпадает с их порядком в гене; часть интронов удаляется уже после окончания синтеза, но всё равно в ядре (сверх программы — БИО-9·18).</p><div class="static-quiz"><h3>Почему для соединения экзонов при сплайсинге пре-мРНК не нужна отдельная ДНК- или РНК-лигаза?</h3><ol><li><b>А.</b> Экзоны соединяет поли(А)-полимераза <i>(неверный вариант)</i><br><span class="expl">Поли(А)-полимераза добавляет адениловые остатки к 3′-концу, экзоны она не соединяет.</span></li><li><b>Б.</b> Экзоны не соединяются: они остаются отдельными молекулами <i>(неверный вариант)</i><br><span class="expl">После сплайсинга экзоны образуют одну непрерывную молекулу мРНК.</span></li><li><b>В.</b> Обе реакции — переэтерификации: одна фосфодиэфирная связь заменяется другой <i>(верный вариант)</i><br><span class="expl">Число связей не меняется; новая связь между экзонами образуется за счёт разрыва связи на 3′-сайте.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-9.html#q3">Вопрос 3 →</a> <a href="seminar-9.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 3; длины условные.</p></details></article><article class="card print-unit" id="ns-three-prime-end"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 16 из 26</div><h2>3′-конец: расщепление и полиаденилирование</h2><p class="lead">Уже известно: 3′-конец пре-мРНК задаёт расщепление (БИО-9·10). Новое: как образуется поли(А)-хвост и зачем он нужен.</p><div class="note"><strong>Что показывает схема.</strong> Расщепление и поли(А): мРНК выходит в цитоплазму.</div><ol class="mech"><li><a href="#ns-g-S9-T42">Факторы расщепления и полиаденилирования</a> узнают сигнал AAUAAA (CPSF) и участок ниже места расщепления (CstF) и разрезают пре-мРНК.</li><li>Поли(А)-полимераза присоединяет к свободному 3′-OH по одному адениловому остатку из АТФ; матрица ей не нужна, поэтому <a href="#ns-g-S9-T43">поли(А)-хвост</a> в гене не закодирован.</li><li>Белки, связывающиеся с хвостом, ограничивают его длину — около 200 остатков.</li><li>Поли(А)-хвост с белками защищает 3′-конец, участвует в экспорте мРНК и усиливает инициацию трансляции.</li></ol><p>Без расщепления нет и хвоста: РНК продолжается за сигналом, полимераза уходит далеко по ДНК, а такая РНК задерживается в ядре и разрушается.</p><p>У многих генов несколько сигналов полиаденилирования; выбор одного из них меняет длину 3′-НТО (альтернативное полиаденилирование — семинар 11).</p><div class="static-quiz"><h3>Почему поли(А)-хвост не закодирован в гене?</h3><ol><li><b>А.</b> Поли(А)-полимераза присоединяет адениловые остатки без матрицы <i>(верный вариант)</i><br><span class="expl">Хвост синтезируется после расщепления без участия ДНК.</span></li><li><b>Б.</b> Хвост закодирован в последнем интроне и вырезается сплайсингом <i>(неверный вариант)</i><br><span class="expl">Интроны удаляются из пре-мРНК; хвост к ним отношения не имеет.</span></li><li><b>В.</b> Его синтезирует РНК-полимераза II по матричной цепи <i>(неверный вариант)</i><br><span class="expl">Тогда хвост был бы закодирован в гене; на деле его добавляет поли(А)-полимераза.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 3.</p></details></article><article class="card print-unit" id="ns-export"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 17 из 26</div><h2>Зрелая мРНК, мРНП и ядерный экспорт</h2><p class="lead">Уже известно: белки входят в ядро через ядерную пору при помощи сигнала ядерной локализации, импортина и Ran (<a href="https://fresll.github.io/bio/seminar-3-route.html#nls-importin">вспомнить семинар 3</a>). Новое: мРНК выходит из ядра иначе — как мРНП; основной путь — с рецептором NXF1–NXT1, без сигнала ядерной локализации и без Ran.</p><div class="note"><strong>Что показывает схема.</strong> Зрелая мРНК выходит в цитоплазму.</div><ol class="mech"><li>На мРНК во время процессинга собираются белки — на кэпе, на соединениях экзонов, на поли(А)-хвосте; вместе с ними она образует <a href="#ns-g-S9-T53">мРНП</a>.</li><li>Белки, присоединённые при процессинге, привлекают <a href="#ns-g-S9-T54">рецептор экспорта мРНК NXF1–NXT1</a>; он взаимодействует с неструктурированными FG-повторами белков <a href="#ns-g-S9-T55">ядерной поры</a>, и мРНП проходит через канал.</li><li>На цитоплазматической стороне поры АТФ-зависимая РНК-хеликаза снимает с мРНП рецептор и часть белков, и мРНП не может вернуться: экспорт однонаправленный.</li><li>Транскрипты без кэпа, с неудалёнными интронами или без правильного 3′-конца задерживаются в ядре и разрушаются ядерной экзосомой (3′→5′-экзонуклеазы).</li></ol><p>Значительная часть синтезированной в ядре РНК из ядра не выходит: интроны, участки за местом расщепления и дефектные транскрипты разрушаются в ядре.</p><p>Поэтому транскрипционная активность гена не равна количеству его мРНК в цитоплазме: между ними — процессинг, ядерный контроль и экспорт.</p><div class="static-quiz"><h3>Чем экспорт мРНК из ядра отличается от импорта белка в ядро?</h3><ol><li><b>А.</b> Ничем: мРНК несёт сигнал ядерной локализации, и её переносит импортин <i>(неверный вариант)</i><br><span class="expl">Сигнал ядерной локализации и импортин переносят белки в ядро, а не мРНК из ядра.</span></li><li><b>Б.</b> мРНП выходит с рецептором NXF1–NXT1 без сигнала ядерной локализации и без Ran; направление задаёт хеликаза у поры <i>(верный вариант)</i><br><span class="expl">Импорт белка использует сигнал ядерной локализации, импортин и градиент Ran-ГТФ; экспорт мРНК устроен иначе.</span></li><li><b>В.</b> мРНК выходит, пробивая ядерную оболочку между порами <i>(неверный вариант)</i><br><span class="expl">Обмен макромолекулами между ядром и цитоплазмой идёт через ядерные поры.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41580-025-00881-w">Petrovic S., Mobbs G. W., Hoelz A. Structure, function and assembly of nuclear pore complexes. Nat Rev Mol Cell Biol. 2026;27:35–54</a></li></ul><p>Схема шага — модель вкладки 3: ядерная оболочка — две мембраны с порой.</p></details></article><article class="card print-unit" id="ns-post-transcriptional"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 18 из 26</div><h2>Часть интронов удаляется уже после окончания транскрипции</h2><p class="lead">Уже известно: многие интроны удаляются во время транскрипции (БИО-9·13). Новое: заметная доля интронов удаляется позже, и от этого зависит, когда мРНК выйдет в цитоплазму.</p><div class="note"><strong>Что показывает схема.</strong> В цитоплазме 254 мРНК, в ядре немного.</div><ol class="mech"><li>В клетках млекопитающих 27–40 % интронов ещё присутствуют в уже полиаденилированной РНК, связанной с хроматином: они удаляются после окончания синтеза, пока РНК остаётся у места транскрипции.</li><li>В клетках человека линии K562 медиана времени полужизни мРНК на хроматине — около 50 мин, а для мРНК части генов оценка — 170 мин и больше.</li><li>РНК с так называемыми задержанными интронами удерживается в ядре, пока интрон не будет удалён; иначе её разрушают в ядре.</li><li>Так задержка сплайсинга определяет, когда и сколько мРНК выходит в цитоплазму, — ещё одна ступень между транскрипцией и цитоплазматической мРНК.</li></ol><p>Как это узнали: РНК клеток разделяли на фракции — связанную с хроматином, ядерную и цитоплазматическую — и определяли, какие интроны в каждой ещё есть; время полужизни в хроматиновой фракции оценивали по кинетике метки, встроенной в новосинтезированную РНК, с помощью модели — это оценки для генов, а не наблюдение отдельных молекул.</p><p>Граница вывода: это сводка многих работ в обзоре; доли и времена различаются между типами клеток и генами, а для одного гена их надо измерять отдельно.</p><p>Связанная модель — в практикуме: вопрос 3, уровень «Продвинутый» (пулы РНК в ядре и цитоплазме); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>РНК гена полиаденилирована, но содержит один задержанный интрон. Что с ней будет по этим данным?</h3><ol><li><b>А.</b> Она выйдет в цитоплазму, и интрон удалят там <i>(неверный вариант)</i><br><span class="expl">Сплайсинг мРНК завершается в ядре; транскрипт с интроном удерживается.</span></li><li><b>Б.</b> Её уже нельзя сплайсировать: сплайсинг возможен только во время транскрипции <i>(неверный вариант)</i><br><span class="expl">Часть интронов удаляется после окончания синтеза.</span></li><li><b>В.</b> Она останется в ядре, пока интрон не будет удалён, или будет разрушена в ядре <i>(верный вариант)</i><br><span class="expl">Задержанный интрон удерживает транскрипт в ядре.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-025-00836-z">Choquet K., Patop I. L., Churchman L. S. The regulation and function of post-transcriptional RNA splicing. Nat Rev Genet. 2025;26:378–394</a></li></ul><p>Данные — клетки млекопитающих (в том числе линия K562 человека); сводка в обзоре.</p></details></article><article class="card print-unit" id="ns-little-cytoplasmic"><div class="eyebrow">Котранскрипционный процессинг пре-мРНК и ядерный экспорт · шаг 19 из 26</div><h2>Мало мРНК в цитоплазме — разные причины</h2><p class="lead">Уже известно: между синтезом РНК и мРНК в цитоплазме — процессинг и экспорт (БИО-9·17). Новое: по количеству РНК в разных компартментах можно отличить, какой этап замедлен.</p><div class="note"><strong>Что показывает схема.</strong> Накапливается пре-мРНК; в цитоплазме около 100.</div><ol class="mech"><li>В учебной модели каждая молекула находится в одном пуле: пре-мРНК в ядре → зрелая мРНК в ядре → мРНК в цитоплазме; из каждого пула часть молекул разрушается. Синтезировано = сумма пулов + разрушено.</li><li>Около 100 мРНК в цитоплазме через 60 мин (в контроле 254) дают три разных нарушения: замедленный в 10 раз процессинг, замедленный в 10 раз экспорт и сниженный в 2,5 раза синтез.</li><li>Молекулы накапливаются в пуле перед замедленным этапом: при замедленном процессинге — пре-мРНК (124 против 29), при замедленном экспорте — зрелая мРНК в ядре (193 против 39).</li><li>При сниженном синтезе не накапливается ни один ядерный пул, а новых пре-мРНК за 10 мин меньше (40 против 100).</li></ol><p>Все доли и скорости — учебные допущения, а не измеренные величины; модель показывает логику вывода, а не свойства конкретного гена.</p><p>Тот же принцип, что в разделе 2: одинаковый наблюдаемый результат может возникнуть при нарушении разных процессов, а различает их наблюдение, по которому гипотезы предсказывают разное.</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>мРНК гена в цитоплазме мало; пре-мРНК в ядре как в контроле, а зрелой мРНК в ядре в 5 раз больше. Какой этап замедлен в модели?</h3><ol><li><b>А.</b> Экспорт <i>(верный вариант)</i><br><span class="expl">Зрелая мРНК накапливается перед экспортом, а процессинг идёт нормально.</span></li><li><b>Б.</b> Процессинг <i>(неверный вариант)</i><br><span class="expl">Тогда накапливалась бы пре-мРНК, а зрелой мРНК было бы меньше.</span></li><li><b>В.</b> Синтез <i>(неверный вариант)</i><br><span class="expl">При сниженном синтезе ядерные пулы не растут, а уменьшаются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41576-025-00836-z">Choquet K., Patop I. L., Churchman L. S. The regulation and function of post-transcriptional RNA splicing. Nat Rev Genet. 2025;26:378–394</a></li></ul><p>Учебная модель 3а; правила — по учебнику и обзору о посттранскрипционном сплайсинге.</p></details></article><article class="card print-unit" id="ns-exon-utr"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 20 из 26</div><h2>Экзон, интрон, кодирующая область и нетранслируемые области</h2><p class="lead">Уже известно: при сплайсинге интроны удаляются, экзоны соединяются (БИО-9·15). Новое: экзон — не то же самое, что кодирующая последовательность. Раздел относится к вопросу 11 коллоквиума 2 (предварительный список) и вопросу 25 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Экзон 1 — 5′-НТО; старт-кодон — в экзоне 2; стоп-кодон — в экзоне 4; экзон 5 — 3′-НТО.</div><ol class="mech"><li><a href="#ns-g-S9-T34">Экзон</a> — участок гена, последовательность которого сохраняется в зрелой РНК после сплайсинга; <a href="#ns-g-S9-T35">интрон</a> удаляется.</li><li>Зрелая мРНК от 5′ к 3′: кэп, <a href="#ns-g-S9-T47">5′-нетранслируемая область</a>, <a href="#ns-g-S9-T45">кодирующая область</a> (от <a href="#ns-g-S9-T49">старт-кодона</a> до <a href="#ns-g-S9-T50">стоп-кодона</a>), <a href="#ns-g-S9-T48">3′-нетранслируемая область</a>, поли(А)-хвост.</li><li>Границы экзонов задают сайты сплайсинга, а границы кодирующей области — старт- и стоп-кодоны. Поэтому первый и последний экзоны обычно целиком или частично нетранслируемые, а интроны встречаются и внутри нетранслируемых областей.</li><li>Экзоны есть и у генов, вовсе не кодирующих белок (например, генов длинных некодирующих РНК).</li></ol><p>Нетранслируемые области не кодируют аминокислоты, но содержат последовательности, от которых зависят стабильность мРНК, её место в цитоплазме и эффективность трансляции; у многих генов человека 3′-НТО длиннее кодирующей области.</p><p>Поэтому изменение экзона не обязательно меняет белок: оно может прийтись на нетранслируемую область.</p><div class="static-quiz"><h3>Первый экзон гена целиком относится к 5′-НТО. Что из этого следует?</h3><ol><li><b>А.</b> Это ошибка разметки: такой участок — интрон <i>(неверный вариант)</i><br><span class="expl">Интрон удаляется при сплайсинге; этот участок остаётся в зрелой мРНК, значит, это экзон.</span></li><li><b>Б.</b> Экзон не обязательно кодирует аминокислоты <i>(верный вариант)</i><br><span class="expl">Экзон определяется сплайсингом: он сохраняется в зрелой мРНК, кодирует ли он белок или нет.</span></li><li><b>В.</b> Трансляция начинается с первого нуклеотида экзона 1 <i>(неверный вариант)</i><br><span class="expl">Трансляция начинается со старт-кодона, который здесь находится в следующем экзоне.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 4: условный ген из пяти экзонов, длины условные.</p></details></article><article class="card print-unit" id="ns-alternative-splicing"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 21 из 26</div><h2>Альтернативный сплайсинг: разные мРНК одного гена</h2><p class="lead">Уже известно: сплайсосома узнаёт сайты сплайсинга (БИО-9·15). Новое: в пре-мРНК одного гена могут использоваться разные сайты, и тогда из разных её молекул образуются разные зрелые мРНК.</p><div class="note"><strong>Что показывает схема.</strong> Все пять экзонов в мРНК; белок 110 аминокислот.</div><ol class="mech"><li><a href="#ns-g-S9-T67">Альтернативный сплайсинг</a> — образование разных зрелых мРНК из пре-мРНК одной транскрипционной единицы за счёт разного выбора сайтов сплайсинга.</li><li>Основные варианты: включение или пропуск экзона (<a href="#ns-g-S9-T51">альтернативный экзон</a>); выбор альтернативного 5′- или 3′-сайта (экзон длиннее или короче); удержание интрона; взаимоисключающие экзоны.</li><li>Каждая молекула пре-мРНК сплайсируется одним способом, но разные молекулы — по-разному; поэтому в клетке одновременно может быть несколько вариантов, а может быть и один.</li><li>Выбор зависит от последовательностей пре-мРНК, которые усиливают или подавляют использование сайта, и от связывающихся с ними белков; их набор различается в тканях.</li></ol><p>Альтернативный сплайсинг найден у большинства многоинтронных генов человека (по полногеномным оценкам — более 95 %); учебник отмечает, что эта цифра, вероятно, завышена: многие варианты образуются редко и могут не иметь функции.</p><p>Последовательность ДНК при этом не меняется: разные мРНК — результат обработки одной и той же пре-мРНК.</p><div class="static-quiz"><h3>В двух тканях из одного гена получаются мРНК с экзоном 3 и без него. Что при этом верно?</h3><ol><li><b>А.</b> В одной из тканей экзон 3 утрачен из ДНК <i>(неверный вариант)</i><br><span class="expl">Для пропуска экзона изменение ДНК не нужно.</span></li><li><b>Б.</b> В тканях транскрибируются разные гены <i>(неверный вариант)</i><br><span class="expl">Обе мРНК образуются из пре-мРНК одного гена.</span></li><li><b>В.</b> Последовательность гена одинакова; различается выбор сайтов сплайсинга в молекулах пре-мРНК этого гена <i>(верный вариант)</i><br><span class="expl">Альтернативный сплайсинг меняет состав зрелой мРНК без изменения ДНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41576-025-00836-z">Choquet K., Patop I. L., Churchman L. S. The regulation and function of post-transcriptional RNA splicing. Nat Rev Genet. 2025;26:378–394</a></li></ul><p>Схема шага — модель вкладки 4.</p></details></article><article class="card print-unit" id="ns-what-changes"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 22 из 26</div><h2>Что меняется в белке при альтернативном сплайсинге, а что нет</h2><p class="lead">Уже известно: разные мРНК одного гена образуются без изменения ДНК (БИО-9·21). Новое: изменится ли белок, зависит от того, какой участок мРНК затронут.</p><div class="note"><strong>Что показывает схема.</strong> 5′-НТО 115 нт, белок прежний — 110 аминокислот.</div><ol class="mech"><li>Если альтернативный выбор касается нетранслируемой области (например, длины 5′-НТО), кодирующая область и белок не меняются.</li><li>Если пропускается кодирующий экзон, длина которого кратна трём, белок короче на внутренний участок, а начало и конец сохраняются (здесь это правило дано готовым; рамка считывания — семинар 10).</li><li>Если длина пропущенного участка не кратна трём или вариант вносит стоп-кодон, белок изменяется сильнее или его почти нет — это разбирается в семинаре 10.</li><li>Поэтому разные мРНК одного гена могут кодировать одинаковый белок, разные варианты белка или не давать устойчивого белка.</li></ol><p>Обнаружение варианта мРНК ещё не доказывает, что в клетке есть соответствующий вариант белка: для этого белок нужно найти отдельно.</p><p>Состав зрелой мРНК, а с ним и белок, может измениться и без изменения кодонов — если изменён сам сайт сплайсинга на границе экзона и интрона; такие изменения подробно разбираются в курсе «Молекулярная биология».</p><p>Вопрос «на каком этапе изменение меняет белковый продукт» (зачёт, вопрос 25): изменение последовательности кодирующей области или выбора экзонов при сплайсинге может изменить белок; изменение только в нетранслируемых областях последовательность белка не меняет.</p><div class="static-quiz"><h3>При альтернативном сплайсинге использован другой 5′-сайт интрона 1, и 5′-НТО стала на 35 нуклеотидов длиннее. Что с белком?</h3><ol><li><b>А.</b> Белок тот же: изменилась только нетранслируемая область <i>(верный вариант)</i><br><span class="expl">Старт-кодон и кодирующая область не затронуты.</span></li><li><b>Б.</b> Белок длиннее на 35 аминокислот <i>(неверный вариант)</i><br><span class="expl">35 нуклеотидов добавились до старт-кодона и аминокислот не кодируют.</span></li><li><b>В.</b> Белка не будет: сдвинулась рамка <i>(неверный вариант)</i><br><span class="expl">Рамку задаёт старт-кодон; изменение перед ним её не сдвигает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li></ul><p>Схема шага — модель вкладки 4.</p></details></article><article class="card print-unit" id="ns-bound-proteins"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 23 из 26</div><h2>Белки, связанные рядом с экзоном, меняют его включение</h2><p class="lead">Уже известно: выбор сайтов сплайсинга зависит от белков, связывающихся с пре-мРНК (БИО-9·21). Новое: таких белков больше, чем считали, и важно, с какой стороны экзона белок связан.</p><div class="note"><strong>Что показывает схема.</strong> Обе клетки: все мРНК с экзоном 3.</div><ol class="mech"><li>Проверили 718 РНК-связывающих белков человека: каждый по очереди закрепляли на искусственной пре-мРНК рядом с альтернативным экзоном.</li><li>58 белков повышали включение экзона в зрелую мРНК, и среди них были белки, о роли которых в сплайсинге раньше не знали.</li><li>Для 41 из них результат зависел от того, с какой стороны экзона белок связан: 26 действовали только из интрона за экзоном, 15 — только из интрона перед ним; ещё 17 — с обеих сторон.</li><li>Значит, включение экзона определяется не только самим экзоном, но и набором белков у его границ — а этот набор различается в клетках.</li></ol><p>Как это узнали: в клетках человека линии HEK293T белок принудительно связывали с искусственной пре-мРНК и измеряли долю мРНК с экзоном. Искусственное закрепление показывает, что белок может повысить включение, но не то, где и когда он делает это в природе.</p><p>Граница вывода: одна линия клеток и репортёрная пре-мРНК; для нескольких белков авторы затем показали влияние на сотни природных событий сплайсинга, но это не переносится автоматически на все гены и ткани.</p><p>Связанная модель — в практикуме: вопрос 4, уровень «Продвинутый» (две клетки с разным набором белков, влияющих на выбор сайтов сплайсинга); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>Белок повышает включение экзона, только если закреплён в интроне за экзоном. Что из этого следует?</h3><ol><li><b>А.</b> Белок изменяет последовательность ДНК гена <i>(неверный вариант)</i><br><span class="expl">Белок действует на пре-мРНК; ДНК не меняется.</span></li><li><b>Б.</b> Действие белка на выбор экзона зависит от места его связывания с пре-мРНК <i>(верный вариант)</i><br><span class="expl">Один и тот же белок влияет или не влияет в зависимости от положения.</span></li><li><b>В.</b> Белок не участвует в сплайсинге <i>(неверный вариант)</i><br><span class="expl">Он повышает включение экзона, то есть влияет на сплайсинг.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41587-023-02014-0">Schmok J. C., Jain M., Street L. A. et al. Large-scale evaluation of the ability of RNA-binding proteins to activate exon inclusion. Nat Biotechnol. 2024;42:1429–1441</a></li></ul><p>Данные — клетки человека HEK293T, искусственная пре-мРНК.</p></details></article><article class="card print-unit" id="ns-two-cells"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 24 из 26</div><h2>Разные мРНК двух клеток при одинаковом гене</h2><p class="lead">Уже известно: включение экзона зависит от белков у его границ (БИО-9·23). Новое: как рассуждать, когда мРНК двух клеток различаются, и что нужно, чтобы исключить изменение ДНК.</p><div class="note"><strong>Что показывает схема.</strong> Клетка Б: по 50 молекул с экзоном 3 и без него.</div><ol class="mech"><li>В учебной модели две клетки с одним геном различаются двумя белками: репрессором включения экзона 3 и белком, активирующим дальний 3′-сайт последнего интрона (интрона 4).</li><li>При большом количестве репрессора экзон 3 пропускается (белок короче на внутренний участок из 21 аминокислоты); активатор дальнего 3′-сайта укорачивает 3′-НТО (460 → 310 нт), не меняя белка.</li><li>Если репрессора мало, в одной клетке есть оба варианта; если много или нет — один. Альтернативный сплайсинг не обязательно даёт несколько продуктов в каждой клетке.</li><li>То же различие мРНК могла бы дать мутация сайта сплайсинга. Различает гипотезы последовательность гена: при регуляции она одинакова, при мутации — изменена.</li></ol><p>Обратная задача модели: в клетке А все мРНК с экзоном 3 и длинной 3′-НТО, в клетке Б — без экзона 3 и с короткой 3′-НТО; гены не сравнивали. Вывод «ДНК изменена» не следует: такие же мРНК модель даёт при одинаковом гене и разном наборе белков.</p><p>Мутации сайтов сплайсинга и их последствия подробно разбираются в курсе «Молекулярная биология»; регуляция количества и вариантов продукта — семинар 11.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>В двух клетках доли мРНК с экзоном 3 разные. Какое наблюдение отличит различие регуляторных белков от мутации сайта сплайсинга?</h3><ol><li><b>А.</b> Сравнение долей изоформ мРНК <i>(неверный вариант)</i><br><span class="expl">Это наблюдение уже есть, и обе гипотезы его объясняют.</span></li><li><b>Б.</b> Сравнение длины белка <i>(неверный вариант)</i><br><span class="expl">Длина белка — следствие состава мРНК; при обеих гипотезах она одна и та же.</span></li><li><b>В.</b> Сравнение последовательности гена в двух клетках <i>(верный вариант)</i><br><span class="expl">Две гипотезы предсказывают разное только для ДНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7 «Control of Gene Expression»; Chapter 12 «Intracellular Organization and Protein Sorting» (nuclear transport)</li><li><a href="https://doi.org/10.1038/s41587-023-02014-0">Schmok J. C., Jain M., Street L. A. et al. Large-scale evaluation of the ability of RNA-binding proteins to activate exon inclusion. Nat Biotechnol. 2024;42:1429–1441</a></li></ul><p>Учебная модель 4а; доли изоформ условные.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Альтернативный сплайсинг: одна пре-мРНК — разные зрелые мРНК · шаг 25 из 26</div><h2>Сводная задача: по какому наблюдению находят этап, на котором изменился путь к мРНК</h2><p class="lead">Объединим четыре вопроса. Для одного гена в клетках человека можно измерить число начатых синтезов, короткие РНК у промотора, пре-мРНК и зрелую мРНК в ядре, мРНК в цитоплазме и её экзонный состав. Задача — для каждого этапа пути от ДНК к цитоплазматической мРНК назвать сочетание наблюдений, которое на него указывает, и не делать вывода сильнее, чем позволяют данные.</p><div class="note"><strong>Что показывает схема.</strong> Синтез 10 в минуту: в цитоплазме 254 мРНК через 60 мин.</div><ol class="mech"><li>Инициация: реже начинается синтез — меньше начатых синтезов, а все последующие пулы уменьшаются почти пропорционально; ни один промежуточный продукт не накапливается.</li><li>Продолжение синтеза: начатых синтезов столько же, но больше коротких РНК у промотора или незавершённых РНК в теле гена.</li><li>Процессинг: накапливается пре-мРНК (с интронами или без образованного 3′-конца), а РНК без кэпа быстро разрушается.</li><li>Экспорт: в ядре накапливается зрелая мРНК с кэпом, без интронов и с поли(А)-хвостом.</li><li>Сплайсинг другого варианта: меняется экзонный состав мРНК. В модели вкладки 4 общее количество мРНК при этом прежнее, но в клетке изоформы могут разрушаться с разной скоростью, поэтому признак — состав, а не количество.</li></ol><p>Общее правило: молекулы накапливаются перед замедленным этапом; если не накапливается ни один пул, а всё меньше пропорционально, уменьшено поступление — инициация.</p><p>Изменённый экзонный состав мРНК ещё н
