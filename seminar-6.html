ерить прогноз", "a_scen_t": "Контрастные сценарии", "a_mh_t": "Подсказки к модели", "a_lim_t": "Чего модель не показывает", "a_new_t": "Новые данные и как это установили", "a_how_t": "Как это установили:", "rd_model": "Показания учебной модели; числа условные.", "ms_head": "Показания", "amode_t": "Режим", "amode_e": "Исследование", "amode_m": "Модель", "amk_t": "Сцена", "amk_1": "Модель 1", "amode_note": "Переключатели показывают предсказания учебной модели, а не доказательство.", "b_pre_t": "Перед задачей", "b_expl_t": "Научное объяснение", "b_pass_t": "Зачем это знать и научная проблема", "b_why_t": "Зачем это знать", "b_prob_t": "Научная проблема", "t1_title": "Клеточный цикл: фазы, переходы и контрольные точки", "t1_idea": "Переход в следующую фазу цикла происходит не через заданное время, а когда выполнены условия: есть сигнал роста, ДНК удвоена и не повреждена. Контрольная точка задерживает переход; задержка — не гибель", "t1_why": "Неделящаяся клетка может быть задержанной, покоящейся или погибающей. По количеству ДНК в ядре и признакам митоза можно найти переход, на котором стоит цикл, и понять, что клетке не позволило идти дальше", "t1_problem": "Как клетка не начинает удваивать повреждённую ДНК и не делит хромосомы, удвоение которых не закончено?", "t1_cond": "Фибробласты человека в культуре. Наблюдаем один цикл одной клетки от начала фазы G1. Можно менять четыре условия: есть ли в среде митоген и когда его убирают; есть ли повреждение ДНК и в какой фазе; завершено ли удвоение ДНК; работают ли контрольные точки. Показания: пройденные фазы, переход, на котором стоит цикл, количество ДНК в ядре, состояние клетки (деление, задержка, покой)", "t1_s1_title": "Фаза по количеству ДНК", "t1_s1_cond": "В культуре три клетки. В ядре клетки А — 2c ДНК, клетки Б — 3c, клетки В — 4c. Хромосомы ни в одной клетке не конденсированы, ядерная оболочка не разобрана", "t1_s1_q": "В какой фазе находится клетка Б?", "t1_s1_o1": "В фазе S", "t1_s1_x1": "Да: удвоение ДНК идёт, но не закончено — количество между 2c и 4c", "t1_s1_o2": "В фазе G2", "t1_s1_x2": "В G2 удвоение закончено: 4c, как у клетки В", "t1_s1_o3": "В фазе M", "t1_s1_x3": "В митозе хромосомы конденсированы, а здесь их не видно", "t1_s1_h1": "Чем 3c отличается от 2c и 4c?", "t1_s1_h2": "В какой фазе количество ДНК растёт?", "t1_s1_h3": "Промежуточное количество ДНК бывает только во время удвоения", "t1_s1_e": "Количество ДНК указывает, удвоена ли ДНК, а признаки митоза — началось ли деление. Клетку А в G1 по количеству ДНК не отличить от клетки в покое G0", "t1_s2_title": "Какой комплекс нужен для перехода", "t1_s2_cond": "Вещество подавляет активность только комплекса циклин B–CDK1. Остальные комплексы работают. Наблюдаем клетку от начала G1", "t1_s2_q": "Где остановится цикл и сколько ДНК будет в ядре?", "t1_s2_o1": "Перед митозом; 4c", "t1_s2_x1": "Да: циклин B–CDK1 нужен для входа в митоз, а удвоение ДНК запускают другие комплексы", "t1_s2_o2": "Перед S-фазой; 2c", "t1_s2_x2": "Переход G1/S запускают циклин D–CDK4/6 и циклин E–CDK2, они работают", "t1_s2_o3": "В анафазе; 4c", "t1_s2_x3": "Без активного циклин B–CDK1 клетка не войдёт в митоз", "t1_s2_h1": "Какой переход запускает каждый комплекс?", "t1_s2_h2": "Какой комплекс работает позже всех?", "t1_s2_h3": "Циклин B–CDK1 переводит клетку из G2 в митоз", "t1_s2_e": "Каждый переход запускает свой комплекс циклин-CDK; подавление одного из них останавливает цикл перед тем переходом, который этот комплекс запускает", "t1_s3_title": "Митоген убран до и после точки рестрикции", "t1_s3_cond": "В первой культуре митоген убрали в начале G1, во второй — после того, как клетки прошли точку рестрикции. Других изменений нет", "t1_s3_q": "Что произойдёт с клетками двух культур?", "t1_s3_o1": "Первые выйдут в G0, вторые разделятся", "t1_s3_x1": "Да: после точки рестрикции вход в S-фазу от митогена не зависит", "t1_s3_o2": "Обе культуры выйдут в G0", "t1_s3_x2": "Вторая культура уже прошла точку рестрикции: её клетки завершат цикл", "t1_s3_o3": "Клетки первой культуры погибнут", "t1_s3_x3": "Без митогена клетка переходит в покой, а не погибает", "t1_s3_h1": "Что изменится после точки рестрикции?", "t1_s3_h2": "Нужен ли митоген клетке, которая её прошла?", "t1_s3_h3": "Точка рестрикции — переключатель: после неё переход G1/S происходит и без митогена", "t1_s3_e": "Митоген нужен до точки рестрикции; после неё ключевой переход уже произошёл, и клетка завершает цикл. Покой G0 — выход из цикла, а не гибель", "t1_s4_title": "Повреждение ДНК в G2", "t1_s4_cond": "В фазе G2, после удвоения ДНК, в ней возникли разрывы. Контрольные точки работают. Через сутки смотрим на клетку", "t1_s4_q": "Что будет с клеткой через сутки, если повреждение не исправлено?", "t1_s4_o1": "Стоит перед митозом, ДНК 4c, жива", "t1_s4_x1": "Да: переход G2/M задержан; задержка — ещё не гибель", "t1_s4_o2": "Разделилась на две клетки с разрывами", "t1_s4_x2": "Так было бы при выключенной контрольной точке", "t1_s4_o3": "Погибла: повреждение ДНК убивает сразу", "t1_s4_x3": "Повреждение вызывает задержку; дальнейший исход зависит от репарации", "t1_s4_h1": "Удвоена ли уже ДНК?", "t1_s4_h2": "Какой переход следующий после G2?", "t1_s4_h3": "Контрольная точка задерживает вход в митоз", "t1_s4_e": "Повреждение ДНК не само останавливает цикл: остановку вызывает цепь ответа. Перед митозом она не даёт фосфатазе снять тормозящую фосфатную группу с CDK1, поэтому циклин B–CDK1 не активируется. Если повреждение исправят, цикл продолжится; если нет — возможны необратимая остановка или апоптоз, но это уже другой процесс", "t1_s5_title": "Удвоение не завершено, контрольные точки выключены", "t1_s5_cond": "Удвоение ДНК не завершилось: часть хромосомы осталась неудвоенной. Контрольные точки выключены", "t1_s5_q": "Что произойдёт?", "t1_s5_o1": "Митоз вовремя, но хромосомы рвутся", "t1_s5_x1": "Да: неудвоенный участок связывает сестринские хроматиды; в анафазе между ними остаётся мостик, и хромосома разрывается", "t1_s5_o2": "Цикл остановится перед митозом", "t1_s5_x2": "Остановку дала бы контрольная точка, а она выключена", "t1_s5_o3": "Клетка вернётся в G1 доудваивать ДНК", "t1_s5_x3": "Повторного входа в S для доудвоения нет: удвоение завершается в S и G2, а не после возврата в G1", "t1_s5_h1": "Что делает контрольная точка при неполном удвоении?", "t1_s5_h2": "Что будет, если её нет?", "t1_s5_h3": "Неудвоенный участок — общая для двух хроматид двойная спираль", "t1_s5_e": "Контрольная точка не исправляет дефект, а не пропускает клетку дальше, пока дефект есть. Без неё цикл идёт вовремя, но незавершённое удвоение превращается в разрывы хромосом у дочерних клеток", "t1_s6_title": "Фаза по активности комплексов", "t1_s6_cond": "В ядре клетки 4c ДНК, хромосомы не конденсированы. Комплекс циклин A–CDK2 активен; циклин B–CDK1 накоплен, но ещё неактивен; циклин E–CDK2 уже не активен", "t1_s6_q": "В какой фазе клетка?", "t1_s6_o1": "В G2, перед входом в митоз", "t1_s6_x1": "Да: ДНК удвоена, циклин B–CDK1 накоплен, но ещё не активирован", "t1_s6_o2": "В начале G1, сразу после деления", "t1_s6_x2": "В G1 ДНК не удвоена, а циклин A–CDK2 не активен", "t1_s6_o3": "В метафазе митоза", "t1_s6_x3": "В митозе циклин B–CDK1 активен, а хромосомы конденсированы", "t1_s6_h1": "Какой комплекс работает в S и G2?", "t1_s6_h2": "Что должно произойти с циклин B–CDK1 для входа в митоз?", "t1_s6_h3": "Накопленный, но неактивный циклин B–CDK1 — признак G2", "t1_s6_e": "Сочетание активных и неактивных комплексов указывает фазу так же, как количество ДНК; два признака вместе надёжнее одного", "t1_inv_cond": "Через сутки после действия вещества клетки культуры не делятся. В ядрах количество ДНК между 2c и 4c, хромосомы не конденсированы, каспазы не активны, мембраны не повреждены", "t1_inv_q": "Какое сочетание условий модели даёт такую картину?", "t1_inv_o1": "Удвоение не завершено, контрольные точки работают", "t1_inv_x1": "Да: клетки стоят перед митозом с частично удвоенной ДНК", "t1_inv_o2": "Повреждение ДНК в G1, контрольные точки работают", "t1_inv_x2": "Тогда клетки стояли бы перед S-фазой с 2c ДНК", "t1_inv_o3": "Митоген убран в начале G1", "t1_inv_x3": "Тогда клетки вышли бы в G0 с 2c ДНК", "t1_inv_e": "Количество ДНК указывает переход: 2c — перед S или в G0, между 2c и 4c — удвоение не завершено, 4c — перед митозом", "t1_lim": "Модель показывает один цикл одной клетки и качественные исходы. В клетке контрольная точка действует и внутри S-фазы, сила ответа зависит от числа повреждений, а длительность фаз — от типа клеток. Как именно удваивается ДНК, разбирается в <a href=\"seminar-7-route.html\" target=\"_blank\" rel=\"noopener\">семинаре 7</a>, как исправляются повреждения — в <a href=\"seminar-8-route.html\" target=\"_blank\" rel=\"noopener\">семинаре 8</a>", "t2_title": "Митоз: веретено, прикрепление хромосом и разделение хроматид", "t2_idea": "Хроматиды расходятся, только когда все хромосомы прикреплены к двум полюсам и когезин разрезан. Один неприкреплённый кинетохор задерживает анафазу во всей клетке; цитокинез — отдельный этап, без него получается одна клетка с двумя ядрами", "t2_why": "Ошибка распределения хромосом меняет их число в дочерних клетках. По тому, где задержан митоз и сколько ядер и хромосом получилось, можно найти нарушенный этап", "t2_problem": "Как клетка распределяет поровну десятки хромосом, если прикрепление каждой хромосомы к веретену возникает случайно?", "t2_cond": "Условная клетка животного с 2n = 4: две пары хромосом (у человека 2n = 46). Клетка прошла S-фазу: в ней 4 хромосомы по две хроматиды, 8 хроматид, 4c ДНК. Наблюдаем митоз под микроскопом; хромосомы и микротрубочки окрашены. Можно менять: веретено (обычное или разрушено веществом), прикрепление одной хромосомы (правильное или обоими кинетохорами к одному полюсу), контрольную точку сборки веретена (работает или выключена), миозин II сократительного кольца (работает или заблокирован)", "t2_s1_title": "Когда в клетке восемь хромосом? (шкала этапов)", "t2_s1_cond": "Митоз условной клетки 2n = 4 идёт нормально. Шкала этапов: профаза, прометафаза, метафаза, анафаза, телофаза, цитокинез", "t2_s1_q": "На каком этапе в клетке впервые восемь хромосом, каждая из одной хроматиды?", "t2_s1_o1": "В анафазе", "t2_s1_x1": "Да: когезин разрезан, центромеры разделились, каждая хроматида стала хромосомой", "t2_s1_o2": "В метафазе", "t2_s1_x2": "В метафазе хроматиды ещё связаны когезином: хромосом четыре", "t2_s1_o3": "После цитокинеза", "t2_s1_x3": "После цитокинеза в каждой клетке снова четыре хромосомы", "t2_s1_h1": "Как считать хромосомы — по хроматидам или по центромерам?", "t2_s1_h2": "Когда разделяются центромеры?", "t2_s1_h3": "До цитокинеза все восемь хромосом в одной клетке", "t2_s1_e": "Число хромосом определяют по центромерам. В анафазе на клетку приходится 4n4c; деление клетки возвращает в каждую дочернюю клетку 2n2c", "t2_s2_title": "Вещество разрушило микротрубочки", "t2_s2_cond": "В среду добавили вещество, разрушающее микротрубочки. Контрольная точка сборки веретена работает. Клетка входит в митоз", "t2_s2_q": "Что произойдёт с клеткой?", "t2_s2_o1": "Митоз остановится: хромосомы не выстроятся", "t2_s2_x1": "Да: кинетохоры не прикреплены, и их сигнал не разрешает анафазу", "t2_s2_o2": "Клетка разделится и без веретена деления", "t2_s2_x2": "Без микротрубочек хромосомы не перемещаются, а контрольная точка не разрешает анафазу", "t2_s2_o3": "Клетка сразу погибнет", "t2_s2_x3": "Это задержка в митозе; клетка жива", "t2_s2_h1": "Что прикрепляет хромосомы к полюсам?", "t2_s2_h2": "Что делает неприкреплённый кинетохор?", "t2_s2_h3": "Сигнал неприкреплённых кинетохоров тормозит APC/C", "t2_s2_e": "Так действуют вещества, разрушающие микротрубочки: клетка задерживается в митозе на часы, потому что ни одна хромосома не прикреплена", "t2_s3_title": "Синтелическое прикрепление, контрольная точка работает", "t2_s3_cond": "Оба кинетохора одной хромосомы прикрепились к одному полюсу. Остальные хромосомы биориентированы. Контрольная точка работает", "t2_s3_q": "Чем закончится митоз?", "t2_s3_o1": "Задержкой, затем делением на 4 и 4", "t2_s3_x1": "Да: ненатянутое прикрепление исправляется, а до исправления анафаза задержана", "t2_s3_o2": "Делением на 5 и 3 без задержки", "t2_s3_x2": "Контрольная точка работает и не разрешает анафазу до исправления", "t2_s3_o3": "Остановкой митоза навсегда", "t2_s3_x3": "Неправильное прикрепление обычно исправляется, после чего анафаза разрешается", "t2_s3_h1": "Есть ли натяжение у такой хромосомы?", "t2_s3_h2": "Что происходит с ненатянутым прикреплением?", "t2_s3_h3": "Пока прикрепление исправляется, кинетохор временно свободен и даёт сигнал", "t2_s3_e": "Прикрепление идёт методом проб и ошибок; контрольная точка даёт время на исправление, задерживая анафазу", "t2_s4_title": "Миозин II заблокирован", "t2_s4_cond": "После анафазы миозин II сократительного кольца заблокирован. Остальное в норме", "t2_s4_q": "Что образуется и сколько хромосом в клетке и в каждом ядре?", "t2_s4_o1": "Одна клетка, два ядра по 4 хромосомы", "t2_s4_x1": "Да: в клетке 8 хромосом и 4c ДНК, в каждом ядре — 4 хромосомы и 2c", "t2_s4_o2": "Две клетки по 4 хромосомы", "t2_s4_x2": "Без сокращения кольца цитоплазма не делится", "t2_s4_o3": "Одна клетка с одним ядром из 4 хромосом", "t2_s4_x3": "Хроматиды разошлись и собрались в два ядра", "t2_s4_h1": "Какой этап выполняет сократительное кольцо?", "t2_s4_h2": "Сколько ядер собирается в телофазе?", "t2_s4_h3": "Считайте отдельно на клетку и на ядро", "t2_s4_e": "Разделение ядра и разделение цитоплазмы — разные этапы: без цитокинеза получается двуядерная клетка, и запись n/c зависит от единицы подсчёта", "t2_s5_title": "Ошибок нет, контрольная точка выключена", "t2_s5_cond": "Все хромосомы биориентированы. Контрольная точка сборки веретена выключена", "t2_s5_q": "Как пройдёт митоз?", "t2_s5_o1": "Нормально: 4 и 4 хромосомы", "t2_s5_x1": "Да: контрольная точка меняет исход только тогда, когда есть неприкреплённый кинетохор", "t2_s5_o2": "С ошибкой: 5 и 3 хромосомы", "t2_s5_x2": "Ошибки прикрепления нет — распределять неправильно нечего", "t2_s5_o3": "Митоз остановится", "t2_s5_x3": "Остановку даёт работающая контрольная точка, а не выключенная", "t2_s5_h1": "Что контролирует контрольная точка?", "t2_s5_h2": "Есть ли здесь неприкреплённые кинетохоры?", "t2_s5_h3": "Без ошибки прикрепления контрольной точке нечего задерживать", "t2_s5_e": "Контрольная точка — страховка: при правильном прикреплении её выключение незаметно, а при ошибке без неё хромосомы распределяются неправильно", "t2_inv_cond": "После митоза условной клетки 2n = 4 видна одна крупная клетка с двумя ядрами; в каждом ядре 4 хромосомы, задержки перед анафазой не было", "t2_inv_q": "Какой этап нарушен?", "t2_inv_o1": "Цитокинез", "t2_inv_x1": "Да: хроматиды разошлись поровну, ядра собрались, но цитоплазма не разделилась", "t2_inv_o2": "Прикрепление хромосом к веретену", "t2_inv_x2": "Тогда числа хромосом в ядрах различались бы или была бы задержка", "t2_inv_o3": "Разрезание когезина", "t2_inv_x3": "Хроматиды разошлись: когезин был разрезан", "t2_inv_e": "Два ядра с полными наборами указывают на этап после расхождения хроматид", "t2_lim": "Правило «обе хроматиды хромосомы, прикреплённой обоими кинетохорами к одному полюсу, уходят к этому полюсу» — допущение модели: в клетке исход бывает разным. Модель не показывает, что происходит с клеткой после ошибки. Меротелическое прикрепление разобрано в «Объяснениях» (<a href=\"seminar-6-route.html#biorientation\" target=\"_blank\" rel=\"noopener\">«Как хромосома прикрепляется к обоим полюсам?»</a>), а независимость прикрепления, разрезания когезина и контроля — на продвинутом уровне (A2)", "t3_title": "Мейоз и митоз: число хромосом, количество ДНК, гомологи и хроматиды", "t3_idea": "Митоз и мейоз начинаются с одной и той же удвоенной ДНК, но выполняют разные задачи: митоз разделяет сестринские хроматиды и сохраняет набор, мейоз I разделяет гомологи и уменьшает набор вдвое, мейоз II разделяет хроматиды без новой S-фазы", "t3_why": "Подсчёт хромосом и ДНК — способ понять, что происходит с клеткой. Но запись имеет смысл только вместе с моментом и единицей подсчёта: одна и та же запись 2n2c бывает у клетки в G1 и у клетки в анафазе мейоза II", "t3_problem": "Как из одной диплоидной клетки получаются четыре гаплоидные, если ДНК удваивается только один раз?", "t3_cond": "Клетки человека: n = 23, в соматической клетке 46 хромосом. Для схем ориентации бивалентов — условный организм с n = 3. Каждый подсчёт относится к указанному моменту и указанной единице — клетке или ядру", "t3_s1_title": "Анафаза митоза до цитокинеза", "t3_s1_cond": "Клетка человека в анафазе митоза; цитокинез ещё не начался. Считаем на всю клетку", "t3_s1_q": "Сколько в клетке хромосом и какова запись n/c?", "t3_s1_o1": "92 хромосомы; 4n4c", "t3_s1_x1": "Да: центромеры разделились, и каждая из 92 хроматид стала хромосомой", "t3_s1_o2": "46 хромосом; 2n4c", "t3_s1_x2": "Так в метафазе: до разделения центромер хроматиды одной хромосомы считаются вместе", "t3_s1_o3": "46 хромосом; 2n2c", "t3_s1_x3": "Так будет в каждой дочерней клетке после цитокинеза", "t3_s1_h1": "По чему считают хромосомы?", "t3_s1_h2": "Сколько центромер стало после разделения хроматид?", "t3_s1_h3": "Клетка ещё одна: все центромеры в ней", "t3_s1_e": "В одной клетке число хромосом меняется только при разделении центромер (анафаза) и при цитокинезе; количество ДНК — при S-фазе и цитокинезе", "t3_s2_title": "Клетка или ядро: телофаза", "t3_s2_cond": "Клетка человека в поздней телофазе митоза: вокруг каждого набора собралась ядерная оболочка, цитокинез ещё не закончился", "t3_s2_q": "Какие записи верны?", "t3_s2_o1": "Клетка — 4n4c, каждое ядро — 2n2c", "t3_s2_x1": "Да: обе записи верны, если указана единица подсчёта", "t3_s2_o2": "Клетка — 2n2c, каждое ядро — 1n1c", "t3_s2_x2": "Митоз не уменьшает набор: в каждом ядре 46 хромосом", "t3_s2_o3": "Клетка и ядро — 2n4c", "t3_s2_x3": "Хроматиды уже разошлись: в каждом ядре хромосомы из одной хроматиды", "t3_s2_h1": "Сколько ядер в клетке?", "t3_s2_h2": "Сколько хромосом в каждом ядре?", "t3_s2_h3": "На клетку приходятся оба ядра", "t3_s2_e": "Запись n/c без указания единицы подсчёта неоднозначна; до цитокинеза клетка содержит два будущих ядра", "t3_s3_title": "Пахитена: сколько хромосом у бивалентов", "t3_s3_cond": "Сперматоцит I порядка человека в пахитене профазы I: гомологи соединены по всей длине", "t3_s3_q": "Какова запись n/c на клетку?", "t3_s3_o1": "2n4c: 46 хромосом, 23 бивалента", "t3_s3_x1": "Да: гомологи сближены, но не слиты; ДНК удвоена", "t3_s3_o2": "23 хромосомы: бивалент — одна хромосома", "t3_s3_x2": "Бивалент — две хромосомы; считать надо центромеры, их 46", "t3_s3_o3": "2n2c: ДНК ещё не удвоена", "t3_s3_x3": "ДНК удвоена до мейоза: в каждой хромосоме две хроматиды", "t3_s3_h1": "Сколько центромер в одном биваленте?", "t3_s3_h2": "Удвоена ли ДНК перед мейозом?", "t3_s3_h3": "Синапсис не меняет числа хромосом", "t3_s3_e": "Число хромосом уменьшается не при синапсисе, а при расхождении гомологов в анафазе I и последующем цитокинезе", "t3_s4_title": "Что меняет кроссинговер", "t3_s4_cond": "В паре гомологов произошёл один обмен между несестринскими хроматидами", "t3_s4_q": "Что изменилось в хромосомах этой пары?", "t3_s4_o1": "Сестринские хроматиды стали различаться", "t3_s4_x1": "Да: в каждом гомологе одна хроматида несёт участок другого гомолога", "t3_s4_o2": "Число хромосом в паре уменьшилось вдвое", "t3_s4_x2": "Обмен участками не меняет числа хромосом и хроматид", "t3_s4_o3": "Гомологи разделились", "t3_s4_x3": "Наоборот: хиазма удерживает гомологи вместе до анафазы I", "t3_s4_h1": "Между какими хроматидами идёт обмен?", "t3_s4_h2": "Сколько хроматид участвует в одном обмене?", "t3_s4_h3": "Обмен затрагивает по одной хроматиде каждого гомолога", "t3_s4_e": "Кроссинговер создаёт новые сочетания аллелей и связывает гомологи; количества хромосом и ДНК он не меняет", "t3_s5_title": "Ориентация бивалентов", "t3_s5_cond": "Условный организм с n = 3. В метафазе I каждый бивалент можно повернуть так, чтобы к полюсу 1 был обращён материнский или отцовский гомолог. Кроссинговера нет", "t3_s5_q": "Сколько разных по набору хромосом гамет может образоваться?", "t3_s5_o1": "Восемь: 2³", "t3_s5_x1": "Да: каждая из трёх пар ориентируется независимо, по два варианта на пару", "t3_s5_o2": "Два: материнский и отцовский набор", "t3_s5_x2": "Пары ориентируются независимо, поэтому наборы смешанные", "t3_s5_o3": "Шесть: по числу хромосом", "t3_s5_x3": "Число вариантов — два в степени числа пар", "t3_s5_h1": "Сколько вариантов ориентации у одной пары?", "t3_s5_h2": "Зависит ли ориентация одной пары от другой?", "t3_s5_h3": "Перемножьте варианты всех пар", "t3_s5_e": "Независимое расхождение гомологов и кроссинговер — два разных источника разнообразия гамет", "t3_s6_title": "Клетка с 23 хромосомами по две хроматиды", "t3_s6_cond": "В клетке человека 23 хромосомы, каждая из двух хроматид", "t3_s6_q": "Что это за клетка?", "t3_s6_o1": "Клетка после мейоза I", "t3_s6_x1": "Да: 1n2c — гомологи разошлись, а хроматиды ещё вместе", "t3_s6_o2": "Дочерняя клетка после митоза", "t3_s6_x2": "Митоз сохраняет набор: 46 хромосом по одной хроматиде", "t3_s6_o3": "Гамета после мейоза II", "t3_s6_x3": "В гамете хромосомы из одной хроматиды: 1n1c", "t3_s6_h1": "Какой набор хромосом — диплоидный или гаплоидный?", "t3_s6_h2": "Разошлись ли уже хроматиды?", "t3_s6_h3": "Гаплоидный набор с удвоенными хромосомами бывает только после мейоза I и до анафазы II", "t3_s6_e": "Между мейозом I и мейозом II нет S-фазы; мейоз II разделит хроматиды, и запись станет 1n1c", "t3_s7_title": "Сперматогенез и оогенез (конструктор «пол»)", "t3_s7_cond": "Сравниваем мейоз сперматоцита I порядка и ооцита I порядка человека", "t3_s7_q": "Чем различаются итоги мейоза?", "t3_s7_o1": "Четыре сперматиды против одной яйцеклетки", "t3_s7_x1": "Да: у ооцита деления неравные, лишние наборы уходят в полярные тельца", "t3_s7_o2": "Яйцеклетка получает 46 хромосом", "t3_s7_x2": "Обе гаметы гаплоидны: 23 хромосомы", "t3_s7_o3": "У ооцита мейоз идёт без второго деления", "t3_s7_x3": "Мейоз II у ооцита есть; он завершается после оплодотворения", "t3_s7_h1": "Как делится цитоплазма у ооцита?", "t3_s7_h2": "Что такое полярное тельце?", "t3_s7_h3": "Сравните число функциональных гамет", "t3_s7_e": "Хромосомные события у мужчин и женщин одни и те же; различаются сроки, остановки и деление цитоплазмы", "t3_inv_cond": "Про клетку человека известно только: 46 хромосом, каждая из одной хроматиды, 2c ДНК", "t3_inv_q": "Можно ли однозначно сказать, на какой стадии клетка?", "t3_inv_o1": "Нет: например, G1 или анафаза II", "t3_inv_x1": "Да: запись 2n2c на клетку совпадает, например, у клетки в G1 и у клетки в анафазе мейоза II", "t3_inv_o2": "Да: это клетка в фазе G1 цикла", "t3_inv_x2": "Такую же запись даёт анафаза II до цитокинеза", "t3_inv_o3": "Да: это гамета", "t3_inv_x3": "В гамете 23 хромосомы", "t3_inv_e": "Чтобы определить стадию, нужны ещё признаки: конденсированы ли хромосомы, есть ли веретено, есть ли гомологи в наборе", "t3_lim": "Подсчёт n/c не учитывает ДНК митохондрий. Стадии показаны без ошибок распределения; ошибки и их связь с возрастом — продвинутый уровень A3 и «Объяснения» (<a href=\"seminar-6-route.html#cohesion-age\" target=\"_blank\" rel=\"noopener\">«Почему в ооцитах с возрастом сестринские хроматиды расходятся раньше времени?»</a>)", "t4_title": "Гибель клетки: апоптоз и некротическая гибель (некроз)", "t4_idea": "Апоптоз и некротическая гибель различаются механизмом и последовательностью признаков: при апоптозе каспазы разбирают клетку при неповреждённой мембране, при некротической гибели отказ ионного и энергетического гомеостаза приводит к набуханию и разрыву мембраны. Один признак, особенно поздний, тип гибели не определяет", "t4_why": "От типа гибели зависят последствия для ткани: апоптотические клетки обычно удаляются без воспаления, некротическая гибель вызывает воспаление и повреждает соседние клетки", "t4_problem": "По каким наблюдениям и в какой момент можно отличить упорядоченную разборку клетки от её разрушения?", "t4_cond": "Т-лимфоциты человека: в ткани лимфатического узла (рядом есть макрофаги) или в культуре (фагоцитов нет); в этих клетках внешний путь апоптоза идёт без участия митохондрий. Причина гибели: энергетический отказ (вещество останавливает дыхательную цепь, в среде нет глюкозы), выход цитохрома c из митохондрий или связывание рецептора смерти лигандом. Пробы — ранняя и поздняя. Показания: объём клетки, мембрана, каспазы, ядро, фосфатидилсерин снаружи, АТФ, воспаление", "t4_s1_title": "Выход цитохрома c: ранняя проба в ткани", "t4_s1_cond": "В Т-лимфоцитах в ткани лимфатического узла из митохондрий в цитозоль вышел цитохром c. Ранняя проба", "t4_s1_q": "Какие признаки будут в ранней пробе?", "t4_s1_o1": "Клетка уменьшается, каспазы активны, мембрана не повреждена", "t4_s1_x1": "Да: цитохром c запускает сборку апоптосомы и каскад каспаз", "t4_s1_o2": "Клетка набухает, а её мембрана уже разорвана", "t4_s1_x2": "Так выглядит некротическая гибель, а не апоптоз", "t4_s1_o3": "Изменений нет: цитохром c безвреден", "t4_s1_x3": "В цитозоле цитохром c запускает апоптоз", "t4_s1_h1": "Что делает цитохром c в цитозоле?", "t4_s1_h2": "Какие ферменты разбирают клетку при апоптозе?", "t4_s1_h3": "При апоптозе мембрана долго остаётся неповреждённой", "t4_s1_e": "Апоптоз — упорядоченная разборка клетки каспазами при сохранённой мембране", "t4_s2_title": "Энергетический отказ: что видно первым", "t4_s2_cond": "Т-лимфоциты в культуре: вещество остановило дыхательную цепь, глюкозы в среде нет. Ранняя проба", "t4_s2_q": "Что увидим в ранней пробе?", "t4_s2_o1": "Набухание при неповреждённой мембране, АТФ резко снижен", "t4_s2_x1": "Да: насос остановился, ионы и вода входят в клетку", "t4_s2_o2": "Сморщивание и активные каспазы", "t4_s2_x2": "Каспазы не активируются при резкой нехватке АТФ", "t4_s2_o3": "Мембрана уже разорвана, а АТФ остаётся в норме", "t4_s2_x3": "В ранней пробе мембрана ещё не повреждена, а АТФ уже снижен", "t4_s2_h1": "Что потребляет Na⁺/K⁺-насос?", "t4_s2_h2": "Что войдёт в клетку, если насос остановится?", "t4_s2_h3": "За ионами по осмотическому градиенту входит вода", "t4_s2_e": "Некротическая гибель при энергетическом отказе начинается с потери ионного гомеостаза; разрыв мембраны наступает позже", "t4_s3_title": "Энергетический отказ: поздняя проба в ткани", "t4_s3_cond": "То же нарушение, но клетки в ткани. Поздняя проба", "t4_s3_q": "Почему в ткани вокруг погибших клеток появилось воспаление?", "t4_s3_o1": "Мембрана разорвалась, содержимое вышло наружу", "t4_s3_x1": "Да: внутриклеточные молекулы во внеклеточной среде служат сигналом повреждения", "t4_s3_o2": "Каспазы активировали иммунные клетки", "t4_s3_x2": "Каспазы здесь не активны", "t4_s3_o3": "Макрофаги поглотили клетки при неповреждённой мембране", "t4_s3_x3": "Так удаляются апоптотические клетки, без воспаления", "t4_s3_h1": "Что с мембраной в поздней пробе?", "t4_s3_h2": "Где оказывается содержимое клетки?", "t4_s3_h3": "Иммунные клетки узнают внутриклеточные молекулы вне клеток", "t4_s3_e": "Последствия некротической гибели для ткани определяет выход содержимого клетки", "t4_s4_title": "Апоптоз в культуре: поздняя проба (конструктор «нет фагоцитов»)", "t4_s4_cond": "Выход цитохрома c в клетках в культуре, где нет фагоцитов. Поздняя проба: у многих клеток нарушена мембрана", "t4_s4_q": "Какое измерение отличит эту картину от некротической гибели?", "t4_s4_o1": "Активность каспаз в ранней пробе", "t4_s4_x1": "Да: при апоптозе каспазы активны до потери мембраны", "t4_s4_o2": "Состояние мембраны в ранней пробе", "t4_s4_x2": "В ранней пробе мембрана не повреждена при обоих типах", "t4_s4_o3": "Запас АТФ в поздней пробе", "t4_s4_x3": "В поздней пробе АТФ снижен при обоих типах", "t4_s4_h1": "Чем поздняя картина апоптоза в культуре похожа на некротическую гибель?", "t4_s4_h2": "Какой признак апоптоза появляется рано?", "t4_s4_h3": "Нужна проба до потери мембраны", "t4_s4_e": "Апоптотические клетки, которых никто не поглотил, позднее теряют мембрану — это вторичный некроз. Поэтому важен момент наблюдения", "t4_s5_title": "Рецептор смерти или цитохром c", "t4_s5_cond": "В двух культурах клетки погибают: в одной сигнал пришёл через рецептор смерти, в другой — из митохондрий. Ранняя проба в обеих", "t4_s5_q": "Можно ли по признакам ранней пробы — объёму, мембране, активности исполнительных каспаз, ядру — различить пути?", "t4_s5_o1": "Нет: признаки апоптоза одинаковы", "t4_s5_x1": "Да: оба пути сходятся на исполнительных каспазах", "t4_s5_o2": "Да: при рецепторном пути мембрана рвётся", "t4_s5_x2": "Мембрана не повреждена при обоих путях апоптоза", "t4_s5_o3": "Да: при митохондриальном пути каспазы не нужны", "t4_s5_x3": "Оба пути работают через каспазы", "t4_s5_h1": "Где сходятся два пути?", "t4_s5_h2": "Какие каспазы дают признаки апоптоза?", "t4_s5_h3": "Различаются инициаторные каспазы, а не признаки", "t4_s5_e": "Наблюдаемые признаки говорят о механизме исполнения (исполнительные каспазы), а не о пути запуска; для пути нужно отдельное измерение — какая инициаторная каспаза активна", "t4_inv_cond": "У клеток в ранней пробе: объём уменьшен, на мембране пузыри, фосфатидилсерин на наружной стороне, мембрана не повреждена, исполнительные каспазы активны", "t4_inv_q": "Чего по этим данным сказать нельзя?", "t4_inv_o1": "Каким путём запущен апоптоз", "t4_inv_x1": "Да: внешний и внутренний пути дают одинаковые признаки", "t4_inv_o2": "Что клетки разбирают каспазы", "t4_inv_x2": "Активность исполнительных каспаз измерена: это известно", "t4_inv_o3": "Не повреждена ли мембрана", "t4_inv_x3": "Мембрана не повреждена по условию", "t4_inv_e": "Каждое наблюдение отвечает на свой вопрос; путь запуска требует отдельного измерения", "t4_lim": "Модель показывает два типа гибели и вторичный некроз; регулируемые формы некротической гибели и выживание клеток с активными каспазами — продвинутый уровень A4. Сроки проб условны", "fin_title": "Задержка, ошибка распределения, иное количество ДНК или гибель?", "fin_cond": "Четыре культуры клеток с разными нарушениями. Для каждой отметьте, какие измерения нужны, чтобы найти нарушенный этап, и только затем — вывод. Измерений можно отметить не больше указанного числа", "fin_c1_cond": "Культура фибробластов через сутки после действия вещества, повреждающего ДНК: клеток столько же, сколько было; мембраны не повреждены, каспазы не активны", "fin_c1_lim": "1", "fin_c1_m1": "Количество ДНК в ядре", "fin_c1_m2": "Активность каспаз", "fin_c1_m3": "Число ядер в клетке", "fin_c1_m4": "Конденсация хромосом", "fin_c1_c1": "Задержка цикла перед митозом", "fin_c1_c1_x": "Да: ДНК удвоена, митоза нет; признаков гибели нет", "fin_c1_c2": "Задержка цикла перед S-фазой", "fin_c1_c2_x": "Тогда в ядрах было бы 2c", "fin_c1_c3": "Покой G0", "fin_c1_c3_x": "В покое G0 ДНК не удвоена: 2c", "fin_c1_c4": "Гибель клеток путём апоптоза", "fin_c1_c4_x": "Каспазы не активны, а клеток не стало меньше", "fin_c1_c5": "Данных недостаточно", "fin_c2_cond": "В культуре после действия вещества появились крупные клетки, в каждой 4c ДНК; каспазы не активны", "fin_c2_lim": "1", "fin_c2_m1": "Число ядер в клетке", "fin_c2_m2": "Количество ДНК в каждом ядре", "fin_c2_m3": "Количество ДНК на клетку", "fin_c2_m4": "Активность каспаз", "fin_c2_c1": "Не произошёл цитокинез", "fin_c2_c1_x": "Да: два ядра по 2c — хроматиды разошлись, а клетка не разделилась", "fin_c2_c2": "Задержка цикла перед митозом", "fin_c2_c2_x": "Тогда было бы одно ядро с 4c", "fin_c2_c3": "Ошибка распределения хромосом", "fin_c2_c3_x": "Каждое ядро получило полный набор", "fin_c2_c4": "Данных недостаточно", "fin_c2_c4_x": "ДНК на клетку", "fin_c3_cond": "Число клеток в культуре снижается; в поздней пробе у большинства клеток нарушена мембрана", "fin_c3_lim": "2", "fin_c3_m1": "Активность каспаз в ранней пробе", "fin_c3_m2": "Запас АТФ в ранней пробе", "fin_c3_m3": "Мембрана в ранней пробе", "fin_c3_m4": "Форма клеток в поздней пробе", "fin_c3_c1": "Апоптоз, затем вторичный некроз", "fin_c3_c2": "Некротическая гибель при энергетическом отказе", "fin_c3_c3": "Регулируемая некротическая гибель", "fin_c3_c4": "Данных недостаточно", "fin_c3_xall": "Сравните ранние признаки с моделью вкладки 4 и продвинутого уровня A4", "fin_c4_cond": "Условная клетка с 2n = 4 разделилась; дочерние клетки содержат 5 и 3 хромосомы", "fin_c4_lim": "1", "fin_c4_m1": "Останавливается ли митоз этих клеток, если разрушить микротрубочки", "fin_c4_m2": "Что видно в анафазе", "fin_c4_m3": "Количество ДНК до деления", "fin_c4_m4": "Активность каспаз", "fin_c4_c1": "Меротелическое прикрепление при работающей контрольной точке", "fin_c4_c1_x": "Да: кинетохор был связан с обоими полюсами и сигнала не давал; хроматида отстала в анафазе", "fin_c4_c2": "Неприкреплённая хромосома при выключенной контрольной точке", "fin_c4_c2_x": "Контрольная точка работает: митоз останавливается при разрушенных микротрубочках", "fin_c4_c3": "Не произошёл цитокинез", "fin_c4_c3_x": "Образовались две клетки", "fin_c4_c4": "Данных недостаточно", "fin_c4_c4_x": "ДНК до деления", "a1_title": "Разрешение перехода — несколько условий, а не таймер", "a1_q": "Почему длительность цикла не постоянна и чем задержка отличается от остановки навсегда?", "a1_cond": "Учебная машина состояний, 30 условных интервалов. В G1 клетка растёт на заданную величину за интервал, пока есть ростовой сигнал; при росте 6 условных единиц (у.е.) пройдена точка рестрикции. Если сигнал пропал раньше, клетка переходит в покой G0. После точки рестрикции переход в S разрешён, если нет контрольного сигнала повреждения. Удвоение ДНК занимает заданное число интервалов; ДНК в ядре растёт от 2c до 4c. G2 длится не меньше 2 интервалов; переход в M разрешён, если удвоение завершено и нет контрольного сигнала. Митоз — 2 интервала, затем деление. Повреждение действует с заданного интервала заданное время или не устраняется. Контрольная точка в модели проверяет только переходы G1/S и G2/M", "a1_s1_q": "Клетка растёт вдвое быстрее, остальное как в норме. Когда она разделится?", "a1_s1_o1": "Раньше: к концу 13-го интервала", "a1_s1_x1": "Да: порог готовности достигнут на 3 интервала раньше; S, G2 и M не изменились", "a1_s1_o2": "Так же, к концу 16-го", "a1_s1_x2": "Цикл в модели — не таймер: переход G1/S разрешает готовность", "a1_s1_o3": "Позже: рост мешает удвоению", "a1_s1_x3": "Скорость роста не влияет на длительность удвоения ДНК", "a1_s2_q": "Ростовой сигнал пропадает на 4-м интервале, а в другом прогоне — на 9-м. Что будет?", "a1_s2_o1": "В первом покой G0, во втором — деление вовремя", "a1_s2_x1": "Да: к 9-му интервалу точка рестрикции пройдена", "a1_s2_o2": "В обоих случаях клетка перейдёт в покой G0", "a1_s2_x2": "После точки рестрикции сигнал больше не нужен", "a1_s2_o3": "В обоих — деление позже", "a1_s2_x3": "Сигнал нужен только до точки рестрикции", "a1_s3_kind": "Наблюдение", "a1_s3_obs": "«Повреждение в G2 на интервалах 13–16 при работающей и при выключенной контрольной точке». Студент сравнивает две траектории: с точкой — 3 интервала ожидания перед митозом, деление к концу 19-го; без точки — деление вовремя, к концу 16-го, с отметкой «неустранённое повреждение».", "a1_s3_e": "Контрольная точка задерживает переход и оставляет время на репарацию; её выключение не ускоряет цикл, а пропускает дефект", "a1_s4_cond": "Повреждение в G2 не устраняется", "a1_s4_q": "Что изменится?", "a1_s4_o1": "Клетка стоит перед митозом до конца наблюдения", "a1_s4_x1": "Да: условие перехода не выполняется; модель не говорит, погибнет ли клетка", "a1_s4_o2": "Клетка погибает на 17-м интервале наблюдения", "a1_s4_x2": "Гибели в модели нет: длительная остановка — другое состояние", "a1_s4_o3": "Клетка делится с опозданием", "a1_s4_x3": "Повреждение не устраняется, и разрешения перехода нет", "a1_s5_kind": "Объяснение", "a1_s5_e": "Цикл в модели — машина состояний: каждый переход открывается, только когда выполнены его условия. Поэтому длительность цикла меняется вместе с готовностью клетки, а задержка не означает гибели", "a1_inv_q": "Деление наступило на 3 интервала позже обычного (к концу 19-го). Какие условия модели это объясняют?", "a1_inv_o1": "Повреждение в G1 или в G2 при работающей точке", "a1_inv_x1": "Да: оба дают ожидание 3 интервала; различить помогает, в какой фазе стояла клетка и было ли ДНК 2c или 4c", "a1_inv_o2": "Только замедленное удвоение ДНК в S-фазе", "a1_inv_x2": "Удвоение за 10 интервалов даёт опоздание на 4, а не на 3 интервала", "a1_inv_o3": "Выключенная контрольная точка", "a1_inv_x3": "Без точки ожидания нет: деление вовремя", "a1_lim": "Реальную кинетику активности комплексов циклин-CDK, контроль внутри S-фазы, репарацию ДНК, необратимую остановку и гибель. Пороги и длительности — допущения, а не измеренные величины", "a1_new_data": "Нужны ли разные циклины для удвоения ДНК и для митоза? На делящихся дрожжах сравнили комплекс CDK с циклином фазы S и комплекс с циклином митоза. Около двух третей изученных участков фосфорилирования в белках-мишенях оба комплекса фосфорилировали одинаково; около 4 % участков комплекс фазы S фосфорилировал меньше чем на 30 %. Он начинал митоз, но не завершал его, а после удаления фосфатазы у полюса веретена проводил клетку через весь митоз. Вывод работы: порядок событий цикла задаётся в основном ростом общей активности CDK — ранним событиям достаточно меньшей активности, поздним нужна большая. Это похоже на пороги машины состояний: событие наступает, когда достигнут его порог. Работа выполнена на дрожжах; у человека комплексов больше", "a2_title": "Прикрепление, разрешение разделения и контроль — независимые условия", "a2_q": "Если в дочерней клетке лишняя хромосома, можно ли по ней одной сказать, что нарушилось?", "a2_cond": "Условная клетка с 2n = 4 (пары A и B; у человека 2n = 46) в митозе перед анафазой: 4 хромосомы по две хроматиды. Три независимых переключателя: прикрепление (всё правильно / одна хромосома не прикреплена / у одной хромосомы один кинетохор связан с обоими полюсами — меротелическое прикрепление); разрешение разделения хроматид (когезин можно разрезать / нельзя); контроль перехода к анафазе (работает / обойдён). Правила модели: сигнал «ждать» дают только кинетохоры без микротрубочек; хроматиды неприкреплённой хромосомы при обходе контроля остаются на месте и обе попадают в одну дочернюю клетку; отстающая хроматида при меротелическом прикреплении может попасть в любую дочернюю клетку", "a2_s1_q": "У одной хромосомы один кинетохор связан с обоими полюсами (меротелическое прикрепление); когезин можно разрезать; контроль работает. Будет ли задержка перед анафазой?", "a2_s1_o1": "Нет: кинетохор прикреплён, сигнала нет", "a2_s1_x1": "Да: анафаза начинается вовремя; отстающая хроматида может попасть в любую клетку", "a2_s1_o2": "Да: контроль видит любую ошибку прикрепления", "a2_s1_x2": "Сигнал дают только кинетохоры без микротрубочек", "a2_s1_o3": "Да, пока прикрепление не исправится", "a2_s1_x3": "Меротелический кинетохор не освобождается и сигнала не даёт", "a2_s2_q": "Все хромосомы прикреплены правильно, но вещество подавляет сепаразу. Что будет видно под микроскопом через час?", "a2_s2_o1": "Хромосомы на экваторе, хроматиды связаны", "a2_s2_x1": "Да: разрешение на анафазу есть, но когезин не разрезан", "a2_s2_o2": "Хроматиды у полюсов, клетка не делится", "a2_s2_x2": "Без сепаразы хроматиды не расходятся", "a2_s2_o3": "Хромосомы разбросаны, не выстроены", "a2_s2_x3": "Прикрепление и выстраивание от сепаразы не зависят", "a2_s3_kind": "Наблюдение без вопроса", "a2_s3_obs": "студент сравнивает одну хромосому без микротрубочек при работающем и при обойдённом контроле: в первом случае анафаза задержана (прометафаза), во втором — анафаза начинается, а хроматиды неприкреплённой хромосомы остаются на месте.", "a2_s3_e": "Контроль меняет исход только тогда, когда есть кинетохор без микротрубочек", "a2_s4_cond": "Меротелическое прикрепление; сравним работающий и обойдённый контроль", "a2_s4_q": "Что изменится?", "a2_s4_o1": "Исходы одинаковы при обоих положениях", "a2_s4_x1": "Да: меротелический кинетохор сигнала не даёт, и контролю нечего задерживать", "a2_s4_o2": "При работающем контроле ошибки не будет", "a2_s4_x2": "Контроль не отличает меротелическое прикрепление от правильного", "a2_s4_o3": "При обойдённом контроле клетка остановится", "a2_s4_x3": "Обход контроля не останавливает, а разрешает анафазу", "a2_s5_kind": "Объяснение", "a2_s5_e": "Прикрепление, разрешение разделения и контроль перехода — три независимых условия. Нормальное распределение требует всех трёх; задержка возникает, когда контроль работает и есть кинетохор без микротрубочек; ошибка распределения — когда контроль обойдён или не видит неправильного прикрепления", "a2_inv_q": "Одна дочерняя клетка получила 5 хромосом. Что известно о причине?", "a2_inv_o1": "Только то, что разделение шло с ошибкой", "a2_inv_x1": "Да: так бывает и при обойдённом контроле, и при меротелическом прикреплении; нужны данные о контроле и о виде анафазы", "a2_inv_o2": "Что контроль перехода был обойдён", "a2_inv_x2": "При меротелическом прикреплении ошибка возникает и при работающем контроле", "a2_inv_o3": "Когезин не разрезался", "a2_inv_x3": "Тогда хроматиды не разошлись бы, и лишней хромосомы в одной клетке не получилось бы", "a2_lim": "Исправление неправильных прикреплений во времени, силы в веретене, то, что происходит с клетками после ошибки (их задержку или гибель), и различия между хромосомами. Правила распределения — допущения модели", "a2_new_data": "Сколько микротрубочек держит кинетохор клетки человека? В метафазных веретёнах клеток человека линии HeLa проследили в электронном микроскопе каждую микротрубочку. Кинетохорное волокно состояло в среднем примерно из девяти микротрубочек, а не из нескольких десятков; число не зависело от положения хромосомы в веретене. До полюса доходила лишь примерно половина микротрубочек волокна, остальные заканчивались в теле веретена, часть из них — вплотную к другим микротрубочкам. Значит, связь кинетохора с полюсом не обязательно прямая; силы в работе не измеряли. Изучены опухолевые клетки одной линии", "a3_title": "Одна удвоенная ДНК — две разные задачи: митоз и мейоз", "a3_q": "Из одной и той же клетки после S-фазы получаются либо две клетки с полным набором, либо четыре с половинным. Что делает разницу?", "a3_cond": "Условная клетка с 2n = 4: пары гомологов A и B; в каждой паре материнский (m) и отцовский (p) гомолог; после S-фазы каждый гомолог состоит из двух хроматид — 2n4c. Можно провести митоз или мейоз. В метафазе I ориентацию каждого бивалента задаёт переключатель: какой гомолог обращён к полюсу 1. Можно включить кроссинговер в паре A (один обмен между несестринскими хроматидами). Между мейозом I и мейозом II S-фазы нет. Подсчёт n/c — на клетку", "a3_s1_q": "Клетка после S-фазы (2n4c) делится митозом. Что получат дочерние клетки?", "a3_s1_o1": "Обе — Am Ap Bm Bp, 2n2c", "a3_s1_x1": "Да: каждая хромосома отдаёт по хроматиде в каждую клетку", "a3_s1_o2": "Одна — Am Bm, другая — Ap Bp", "a3_s1_x2": "Так расходятся гомологи в мейозе I, а не хроматиды в митозе", "a3_s1_o3": "Обе — 1n1c", "a3_s1_x3": "Митоз сохраняет набор хромосом", "a3_s2_q": "Та же клетка делится мейозом; ориентация: пара A — m к полюсу 1, пара B — p к полюсу 1. Что будет после мейоза I?", "a3_s2_o1": "Клетки Am Bp и Ap Bm, обе 1n2c", "a3_s2_x1": "Да: к каждому полюсу отошло по одному гомологу каждой пары, хроматиды ещё вместе", "a3_s2_o2": "Клетки Am Ap и Bm Bp, обе 1n2c", "a3_s2_x2": "Каждая клетка получает по хромосоме из каждой пары, а не целую пару", "a3_s2_o3": "Клетки 2n2c", "a3_s2_x3": "В мейозе I число хромосом уменьшается вдвое", "a3_s3_kind": "Наблюдение", "a3_s3_obs": "студент перебирает все четыре сочетания ориентаций; счётчик наборов гамет останавливается на четырёх.", "a3_s3_e": "Число вариантов — 2ⁿ: у человека 2²³; кроссинговер добавляет новые варианты внутри хромосом", "a3_s4_cond": "Включим кроссинговер в паре A", "a3_s4_q": "Что изменится?", "a3_s4_o1": "Гаметы из одной клетки станут разными", "a3_s4_x1": "Да: сестринские хроматиды гомолога A после обмена различаются", "a3_s4_o2": "Изменится число хромосом в гаметах", "a3_s4_x2": "Обмен участками не меняет числа хромосом", "a3_s4_o3": "Ничего не изменится", "a3_s4_x3": "Изменится состав хромосомы A в части гамет", "a3_s5_kind": "Объяснение", "a3_s5_e": "Одна и та же удвоенная ДНК распределяется по-разному: в митозе сестринские кинетохоры смотрят в разные стороны, в мейозе I — в одну, и расходятся гомологи; мейоз II без S-фазы разделяет хроматиды. Поэтому после мейоза 1n1c, а после митоза 2n2c", "a3_inv_q": "В клетке 2 хромосомы, каждая из двух хроматид, — Am и Bp. Какой момент?", "a3_inv_o1": "После мейоза I или метафаза II", "a3_inv_x1": "Да: 1n2c — гаплоидный набор с удвоенными хромосомами", "a3_inv_o2": "После митоза условной клетки", "a3_inv_x2": "После митоза обе копии каждой пары: Am Ap Bm Bp", "a3_inv_o3": "После мейоза II", "a3_inv_x3": "После мейоза II хромосомы из одной хроматиды: 1n1c", "a3_lim": "Ошибки распределения, неравное деление цитоплазмы в оогенезе, ориентацию в мейозе II (она фиксирована), положение и число обменов в разных хромосомах", "a3_new_data": "Почему в ооцитах с возрастом сестринские хроматиды расходятся раньше времени? В мейозе I когезин у центромер защищает белок шугошин. В ооцитах человека, полученных при лечении бесплодия, белок шугошин 2 образовывал «мостик» между двумя сестринскими центромерами. У женщин 30 лет и моложе мостик был почти у всех пар хроматид, а у большинства женщин 36 лет и старше его не было на большинстве пар; в метафазе II у женщин старше 35 лет резко учащались одиночные хроматиды. Подавление киназы, необходимой для удержания шугошина 2, в ооцитах молодых женщин давало сходную картину, но эта киназа действует не только на шугошин 2. Неясно, что первично: исчезновение мостика может быть и следствием потери самого когезина. Одиночная хроматида может попасть и в яйцеклетку, и в полярное тельце — так возникают яйцеклетки с лишней или недостающей хромосомой. Ооцитов изучено немного; у анеуплоидии есть и другие причины", "a4_title": "Почему одного признака гибели недостаточно", "a4_q": "В поздней пробе у клеток нарушена мембрана. Какие ещё наблюдения и в какой момент нужны, чтобы назвать тип гибели?", "a4_cond": "Четыре сценария в культуре клеток (фагоцитов нет), интервалы 0–10 (условные). Для каждого известны временные ряды: доля клеток с неповреждённой мембраной (%), активность каспаз (у.е., 0–100), запас АТФ (% от исходного), форма клеток. Правило чтения: мембрана «не повреждена» при доле ≥ 90 %, каспазы «активны» при ≥ 20 у.е., АТФ «сохраняется» при ≥ 70 %, «снижен» — 30–69 %, «резко снижен» — < 30 % (допущения модели). Ранняя проба — интервал 2 (до разрыва мембраны при любом сценарии), поздняя — интервал 9", "a4_s1_q": "Известна только поздняя проба мембраны: нарушена. Какие сценарии ей соответствуют?", "a4_s1_o1": "Три сценария гибели", "a4_s1_x1": "Да: и апоптоз без фагоцитов, и оба некротических сценария к интервалу 9 теряют мембрану", "a4_s1_o2": "Только некротическая гибель", "a4_s1_x2": "Апоптотические клетки без фагоцитов позднее тоже теряют мембрану", "a4_s1_o3": "Только апоптоз", "a4_s1_x3": "Некротические сценарии теряют мембрану ещё раньше", "a4_s2_cond": "Добавим раннюю пробу каспаз", "a4_s2_q": "Что изменится?", "a4_s2_o1": "Апоптоз отделится от некротических сценариев", "a4_s2_x1": "Да: каспазы активны только при апоптозе и в сценарии выживания", "a4_s2_o2": "Сразу различатся все четыре сценария", "a4_s2_x2": "Энергетический отказ и регулируемая гибель обе без каспаз", "a4_s2_o3": "Ничего не прибавится", "a4_s2_x3": "Ранние каспазы делят сценарии на две группы", "a4_s3_kind": "Наблюдение", "a4_s3_obs": "студент добавляет ранний АТФ и видит, что энергетический отказ отделяется от регулируемой некротической гибели.", "a4_s3_e": "Ранний резкий спад АТФ указывает на энергетический отказ; при регулируемой некротической гибели запас АТФ сначала сохраняется", "a4_s4_q": "Каспазы в ранней пробе активны. Значит ли это, что клетки погибнут?", "a4_s4_o1": "Нет: нужна поздняя проба мембраны", "a4_s4_x1": "Да: в одном сценарии каспазы активны, но клетки выживают", "a4_s4_o2": "Да: каспазы — признак гибели", "a4_s4_x2": "В модели есть сценарий выживания с активными каспазами", "a4_s4_o3": "Нет: нужен ранний АТФ", "a4_s4_x3": "В ранней пробе АТФ сохраняется и при апоптозе, и при выживании", "a4_s5_kind": "Объяснение", "a4_s5_e": "Каждый признак отвечает на свой вопрос: каспазы — о программе разборки, АТФ — об энергетическом гомеостазе, мембрана — о том, завершилась ли гибель и сохранён ли барьер. Различение требует сочетания признаков и момента наблюдения", "a4_inv_q": "Дан поздний результат «мембрана нарушена». Какого измерения не хватает?", "a4_inv_o1": "Ранних каспаз и раннего АТФ", "a4_inv_x1": "Да: одного из них мало — каждое отделяет только один сценарий", "a4_inv_o2": "Поздних каспаз", "a4_inv_x2": "Поздние каспазы при апоптозе снижаются и хуже различают сценарии", "a4_inv_o3": "Поздней формы клеток в культуре", "a4_inv_x3": "В поздней пробе остатки клеток набухают во всех сценариях гибели", "a4_lim": "Молекулярные пути регулируемой некротической гибели, клетки в ткани с фагоцитами и воспалением, причины разной чувствительности клеток. Ряды условны; в клетке сроки зависят от причины и типа клеток. В модели у выживающих клеток активность каспаз ниже — для наглядности; в эксперименте уровни у выживших и погибших клеток перекрываются", "a4_new_data": "Всегда ли активные исполнительные каспазы означают гибель? В клетках человека линии HeLa синтез исполнительной каспазы-3 включали в заданной дозе и следили за её активностью в каждой клетке. При большой дозе погибали все клетки, при очень малой — выживали все. При промежуточных дозах, убивавших 15–30 % клеток, остальные 70–85 % выживали, хотя каспаза в них была активна. Ни скорость нарастания, ни пик, ни суммарная активность каспазы не позволяли точно предсказать исход для отдельной клетки. Выживание после активации каспаз называют анастазом; выжившие клетки могут нести повреждения ДНК", "s6_wait": "Результат откроется после ответа", "s6_g1": "G1", "s6_s": "S", "s6_g2": "G2", "s6_m": "M", "s6_g0": "G0", "s6_interphase": "интерфаза: G1, S, G2", "s6_R": "точка рестрикции", "s6_centrosome": "центросома", "s6_dna": "ДНК в ядре", "s6_t1_daughters": "две клетки 2n2c", "s6_t1_defect": "дочерние клетки получили дефект", "s6_g1s": "G1/S", "s6_g2m": "G2/M", "s6_ma": "метафаза → анафаза", "s6_checks": "что проверяется", "s6_exec": "исполнитель", "s6_c_growth": "сигнал роста", "s6_c_dna_ok": "ДНК не повреждена", "s6_c_repl": "удвоение завершено", "s6_c_kin": "все кинетохоры прикреплены", "s6_cD": "циклин D–CDK4/6", "s6_cE": "циклин E–CDK2", "s6_cA": "циклин A–CDK2", "s6_cB": "циклин B–CDK1", "s6_activity": "активность (условно)", "s6_chain_g1s": "Повреждение ДНК: ответ перед S-фазой", "s6_chain_g2m": "Повреждение ДНК: ответ перед митозом", "s6_sensor": "датчик", "s6_p53": "p53", "s6_p21": "p21", "s6_kinases": "сигнальные киназы", "s6_ppase": "фосфатаза CDK1", "s6_ppase_off": "фосфатаза, активирующая CDK1, заторможена", "s6_stop_g1s": "циклин E–CDK2 и A–CDK2 заторможены: клетка стоит перед S", "s6_stop_g2m": "циклин B–CDK1 с тормозящей фосфатной группой: клетка стоит перед митозом", "s6_break": "разрыв ДНК", "s6_p53_n1": "Датчики узнают повреждение", "s6_before_s": "стоит перед S", "s6_before_m": "стоит перед митозом", "s6_out_repair": "репарация — цикл продолжается", "s6_out_arrest": "необратимая остановка", "s6_out_apo": "апоптоз", "s6_outside": "внеклеточная среда", "s6_mitogen": "митоген", "s6_receptor": "рецептор", "s6_feedback": "положительная обратная связь", "s6_scf": "цепь убиквитина (SCF)", "s6_fragments": "фрагменты циклина", "s6_switch_g0": "Сигнал пропал до точки рестрикции — переход в G0", "s6_switch_after": "После точки рестрикции цикл идёт без митогена", "s6_switch_degrade": "Циклин помечен и разрушен — комплекс предыдущей фазы распался", "s6_sites": "280 участков фосфорилирования", "s6_same   Object.keys(SCENES).forEach(k => { $('sc' + k).hidden = k !== cur; });
  document.querySelectorAll('#tabs .tab').forEach(b => { const on = +b.dataset.q === qn; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll('#levelSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lvl)));
  /* рецензия v1.3, Н-17: на продвинутом уровне вместо строки «Здесь — …» — вопрос системного исследования (ключи qa1–qa4) */
  /* v1.1 (рецензия Р-29): номер и формулировка вопроса коллоквиума под строкой вопроса (ключи qc1–qc4) */
  { const qc = $('qcol'); if (qc) { qc.hidden = !TEXTS['qc' + qn]; if (TEXTS['qc' + qn]) qc.textContent = t('qc' + qn); } }
  $('qline').textContent = (lvl === 'a' && TEXTS['qa' + qn]) ? t('qa' + qn) : t('q' + qn);   /* семинар 11: на продвинутом уровне — «Вопрос K. » + название исследования (s11_aK_title) */
  /* ссылки на страницу объяснений seminar-N-route.html: общая и к текущему вопросу (первый шаг его раздела).
     Адрес — ключ route_url, id шагов-входов разделов — ключ route_entries (через пробел); без route_url кнопок нет. */
  if (TEXTS.route_url){
    const ent = String(TEXTS.route_entries || '').split(/\s+/).filter(Boolean);
    $('routeAll').href = TEXTS.route_url + '#home';
    $('routeQ').hidden = !ent[qn - 1];
    if (ent[qn - 1]){ $('routeQ').href = TEXTS.route_url + '#' + ent[qn - 1]; $('routeQ').textContent = t('route_q') + ' ' + qn; }
  }
  modelBar();
  POE.on = false; poeRender();
  SCENES[cur].update();
  fitStage();
}
/* возврат со страницы объяснений по ссылке seminar-N.html#q1…#q4 открывает нужный вопрос */
function fromHash(){ const s = urlState(); if (!s) return; if (s.q !== qn || s.l !== lvl || s.m !== amode || s.k !== amk){ qn = s.q; lvl = s.l; amode = s.m; amk = s.k; show(); } }
/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){
  const sc = $('scenes'); if (!sc) return;
  const top = sc.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--avail', Math.max(340, Math.floor(window.innerHeight - top - 10)) + 'px');
}
function initNav(){
  $('tabs').innerHTML = [1, 2, 3, 4].map(n => `<button class="tab" role="tab" data-q="${n}"><span class="n">${n}</span><span>${t('tab' + n)}</span></button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => navGo(+b.dataset.q, lvl));
  /* вкладки с клавиатуры (WAI-ARIA Tabs, аудит UI-02; из общего каркаса 14.11.2026): стрелки по кругу, Home, End; фокус остаётся на выбранной вкладке */
  $('tabs').addEventListener('keydown', e => { const L = Array.from(document.querySelectorAll('#tabs .tab')), i = L.indexOf(document.activeElement); if (i < 0) return;
    const j = e.key === 'ArrowRight' ? (i + 1) % L.length : e.key === 'ArrowLeft' ? (i + L.length - 1) % L.length : e.key === 'Home' ? 0 : e.key === 'End' ? L.length - 1 : -1;
    if (j < 0) return; e.preventDefault(); navGo(+L[j].dataset.q, lvl); L[j].focus(); });
  document.querySelectorAll('#levelSeg button').forEach(b => b.onclick = () => navGo(qn, b.dataset.l));
  const mb = $('mbar');
  if (mb){ mb.innerHTML = `<div class="grp"><span>${t('amode_t')}</span><div class="seg" id="amodeSeg"><button data-m="e">${t('amode_e')}</button><button data-m="m">${t('amode_m')}</button></div></div><div class="grp"><span>${t('amk_t')}</span><div class="seg" id="amkSeg"></div></div><p class="small mnote">${t('amode_note')}</p>`;
    mb.querySelectorAll('#amodeSeg button').forEach(b => b.onclick = () => { amode = b.dataset.m; amk = 1; show(); syncUrl(false); }); }
  $('poeBtn').onclick = () => { POE.on = true; POE.i = 0; POE.pick = null; POE.shown = false; Object.keys(POE.res).forEach(k => { if (k.startsWith(cur + ':')) delete POE.res[k]; }); POE_FOCUS = { sel: '.q' }; poeSetup(); };
  $('capT').onchange = () => { document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !$('capT').checked); if (POE.on) poeRender(); };
  $('legendBtn').onclick = () => { const lgm = $('lgM'); if (lgm) lgm.hidden = !(lvl === 'a' && amode === 'm'); try { $('legendDlg').showModal(); } catch(e){ $('legendDlg').setAttribute('open', ''); } };
  $('legendClose').onclick = () => { try { $('legendDlg').close(); } catch(e){ $('legendDlg').removeAttribute('open'); } };
  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ navGo(+e.key, lvl); }
    if (e.key === 'b' || e.key === 'и'){ navGo(qn, lvl === 'b' ? 'a' : 'b'); } });
  $('srcList').innerHTML = Object.keys(TEXTS).filter(k => /^src_\d/.test(k)).sort().map(k => `<li>${TEXTS[k]}</li>`).join('');
  let last = performance.now();
  const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  /* вкладка браузера скрыта: воспроизведение останавливается и после возврата само не возобновляется */
  document.addEventListener('visibilitychange', () => { if (document.hidden) leaveScene(cur); });
  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));
}

/* ===== навигация (каркас 26.10.2026, из ревизии сайта 3.9): адрес вопроса и уровня, история, возврат, телефон,
   «↓ К выводу», клавиатура, переход между семинарами. Тексты — ключи to_take, zoom_hint, zoom_out, sn_* ===== */
/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;
   переход по истории браузера восстанавливает вопрос и уровень */
function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); if (q !== qn) amk = 1; qn = q; lvl = l; show(); syncUrl(push); }
window.addEventListener('popstate', fromHash);
/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */
const revShow0 = show;
show = function(){ revShow0(); revAfterShow(); };
function revAfterShow(){
  const a = $('routeQ');
  if (a && a.getAttribute('href')){
    const h = a.getAttribute('href'), i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);
    let b = (i < 0 ? h : h.slice(0, i)).replace(/([?&])level=adv(?=&|$)/, '$1').replace(/\?&/, '?').replace(/[?&]+$/, '');
    if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';
    a.setAttribute('href', b + hash);
  }
  revLevelLinks();
  revTakeSoon(); revLater();
}
/* уровень сложности передаётся в ссылки на соседние семинары и в общий вход «Объяснения» (аудит 06.11.2026, NAV-LEVEL) */
function revWithLevel(h){
  const i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);
  let b = (i < 0 ? h : h.slice(0, i)).replace(/([?&])level=adv(?=&|$)/, '$1').replace(/\?&/, '?').replace(/[?&]+$/, '');
  if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';
  return b + hash;
}
function revLevelLinks(){
  document.querySelectorAll('#semNav a.sn-prev, #semNav a.sn-next, #routeAll').forEach(a => {
    const h = a.getAttribute('href'); if (h) a.setAttribute('href', revWithLevel(h));

}
/* справки молекул с клавиатуры: фокус, роль кнопки, доступное имя, Enter/Space (в семинарах, где этого не было);
   невидимые на схеме элементы (неприменённый препарат и т. п.) исключаются из порядка Tab */
function revVisible(e, stop){ for (let x = e; x && x !== stop; x = x.parentElement){ const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return false; } return true; }
function revA11y(){
  const sc = document.querySelector('#scenes .scene:not([hidden])'); if (!sc) return;
  const seen = new Set();   /* с клавиатуры — одна кнопка на каждую структуру, мышью и пальцем — любая деталь */
  sc.querySelectorAll('[data-g]').forEach(e => {
    if (!e.dataset.g) return;
    if (!e.hasAttribute('aria-label')){ const n = TEXTS['gn_' + e.dataset.g] || (e.textContent || '').trim(); if (n) e.setAttribute('aria-label', n); }
    if (e.hasAttribute('tabindex') && !e.dataset.rev) return;   /* фокус задан разметкой страницы — не трогаем */
    if (!e.dataset.rev){ e.dataset.rev = '1'; if (!e.hasAttribute('role')) e.setAttribute('role', 'button'); }
    const vis = revVisible(e, sc) && !seen.has(e.dataset.g), ti = vis ? '0' : '-1'; if (vis) seen.add(e.dataset.g);
    if (e.getAttribute('tabindex') !== ti) e.setAttribute('tabindex', ti);
    if (vis) e.removeAttribute('aria-hidden'); else e.setAttribute('aria-hidden', 'true');
  });
}
let revA11yT = 0;
function revLater(){ if (!revA11yT) revA11yT = setTimeout(() => { revA11yT = 0; revA11y(); revTake(); }, 250); }
/* «↓ К выводу»: на компьютере правая колонка прокручивается отдельно; кнопка видна, пока вывод ниже видимой части */
let revTakeT = 0;
function revTakeSoon(){ if (revTakeT) return; revTakeT = requestAnimationFrame(() => { revTakeT = 0; revTake(); }); }
function revTake(){
  const desk = !window.matchMedia || matchMedia('(min-width:1001px)').matches;
  document.querySelectorAll('#scenes .scene:not([hidden]) .side').forEach(sd => {
    const b = sd.querySelector('.totake'), tk = sd.querySelector('.take'); if (!b || !tk) return;
    const on = desk && !tk.hidden && sd.scrollHeight > sd.clientHeight + 8
      && tk.getBoundingClientRect().top > sd.getBoundingClientRect().bottom - 2;   /* кнопка не ложится на начало вывода (рецензия v1.0, R37) */
    if (b.hidden === on) b.hidden = !on;

}
function revInit(){
  /* кнопка «К выводу» в каждой правой колонке */
  document.querySelectorAll('#scenes .side').forEach(sd => {
    const tk = sd.querySelector('.take'); if (!tk || sd.querySelector('.totake')) return;
    tk.setAttribute('tabindex', '-1');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost totake'; b.hidden = true; b.textContent = t('to_take');
    b.onclick = () => { sd.scrollTo({ top: sd.scrollTop + tk.getBoundingClientRect().top - sd.getBoundingClientRect().top - 8, behavior: 'smooth' }); tk.focus({ preventScroll: true }); };
    sd.appendChild(b);
    sd.addEventListener('scroll', revTakeSoon, { passive: true });
  });
  window.addEventListener('resize', revTakeSoon);
  /* подсказка над увеличенной схемой; на телефоне схема по умолчанию увеличена — подписи читаются без ручного увеличения */
  document.querySelectorAll('#scenes .stage').forEach(st => {

    const p = document.createElement('p'); p.className = 'zhint'; p.textContent = t('zoom_hint'); st.insertBefore(p, zw);

  if (false && window.matchMedia && matchMedia('(max-width:700px)').matches)
    document.querySelectorAll('#scenes .zoombtn').forEach(b => { if (b.getAttribute('aria-pressed') !== 'true'){ b.click();
      const zw = b.closest('.stage').querySelector('.zwrap');   /* увеличенная схема по умолчанию открывается с левого верхнего угла */
      requestAnimationFrame(() => requestAnimationFrame(() => { zw.scrollLeft = 0; zw.scrollTop = 0; })); } });
  /* клавиатура: Enter/Space на молекуле открывает справку (если у страницы нет собственного обработчика) */
  revA11y();
  new MutationObserver(revLater).observe($('scenes'), { childList: true, subtree: true });
  ['input', 'change', 'click'].forEach(ev => document.addEventListener(ev, revLater, true));
  $('scenes').addEventListener('keydown', e => {
    if (e.defaultPrevented || (e.key !== 'Enter' && e.key !== ' ')) return;
    const g = e.target.closest && e.target.closest('[data-g]'); if (!g || !g.dataset.g) return;
    const sec = g.closest('.scene'); if (!sec) return;
    e.preventDefault(); showInfo(sec.id.slice(2), g.dataset.g);
  });
  /* переход к предыдущему и следующему семинару */
  const nav = $('semNav');
  if (nav && TEXTS.sn_aria){
    const abs = !/^(fresll\.github\.io|edu\.mazunin\.science)$/.test(location.hostname) ? 'https://fresll.github.io/bio/' : '', fx = /[?&]fixed(=|&|$)/.test(location.search) ? '?fixed' : '';
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let h = '';
    if (TEXTS.sn_prev_n) h += `<a class="sn-prev" href="${abs}seminar-${TEXTS.sn_prev_n}.html${fx}"><span class="sn-k">${esc(t('sn_prev_k'))} ${TEXTS.sn_prev_n}</span><span class="sn-t">${esc(TEXTS.sn_prev_t)}</span></a>`;

      h += TEXTS.sn_next_ready === '1' ? `<a class="sn-next" href="${abs}seminar-${TEXTS.sn_next_n}.html${fx}">${inner}</a>` : `<div class="sn-soon">${inner}</div>`;
    }
    /* завершающие действия раздела (аудит 06.11.2026, одобрено автором): карта коллоквиума и возврат в раздел */
    /* семинар 12 — последний семинар первого семестра: вместо следующего семинара — «Второй семестр · готовится» (07, разд. 1) */

    if (TEXTS.sn_map_href) h = `<a class="sn-map" href="${abs}${TEXTS.sn_map_href}"><span class="sn-k">${esc(TEXTS.sn_map_k)}</span><span class="sn-t">${esc(TEXTS.sn_map_t)}</span><span class="sn-l">${esc(TEXTS.sn_map_l)}</span></a>` + h;
