авлении 5′→3′ и антипараллельна матрице.","s1_cap_all_z":"Последовательность новой цепи однозначно задана матрицей: новая цепь совпадает с другой цепью исходной молекулы, поэтому каждая из двух цепей может служить матрицей, и копия воспроизводит исходную информацию.","s1_cap_dda":"Вместо dATP в среде аналог без 3′-OH. Он встаёт напротив первого T матрицы за затравкой, но к нему нельзя присоединить следующий нуклеотид: у аналога нет 3′-OH. Цепь обрывается — {n} нуклеотидов, считая затравку.","s1_cap_dda_z":"Обрыв происходит точно напротив определённого основания матрицы, поэтому по длине продукта можно определить, где в матрице стоит T. На этом основан метод определения последовательности ДНК обрывом цепей.","s1_cap_nog":"В среде нет dGTP. Напротив первого C матрицы за затравкой нужен G; в этой модели полимераза присоединяет только комплементарный нуклеотид, поэтому синтез останавливается перед этим положением — {n} нуклеотидов, считая затравку.","s1_cap_nog_z":"Комплементарность ограничивает выбор: напротив C подходит только G. Полимераза изредка всё же присоединяет некомплементарный нуклеотид; как такие ошибки исправляются — семинар 8.","s1_cap_par":"Затравка уложена параллельно матрице: напротив 3′-конца матрицы оказался её 3′-конец. В двойной спирали цепи антипараллельны, поэтому такая затравка в модели не образует пар с матрицей, и у полимеразы нет спаренного с матрицей 3′-OH — синтез не начинается.","s1_cap_par_z":"Для копирования нужны оба свойства молекулы: комплементарность оснований и антипараллельность цепей.","s1_lbl_notpl":"матрицы нет","s1_lbl_notpl_pr":"матрицы нет: затравке не с чем спариться","s1_lbl_nopr":"затравки нет: полимеразе нечего удлинять","s1_lbl_nopol":"ДНК-полимеразы нет: нуклеотиды не присоединяются","s1_cap_notpl":"Матрицы нет. Затравке не с чем спариться, и нет основания, которое задало бы следующий нуклеотид: синтез не начинается.","s1_cap_notpl_z":"Последовательность новой цепи задаёт матрица; без матрицы копировать нечего.","s1_cap_nopr":"Затравки нет. ДНК-полимераза удлиняет только спаренный 3′-OH-конец и не начинает цепь сама, поэтому синтез не начинается.","s1_cap_nopr_z":"Поэтому синтез новой цепи ДНК начинается с короткой затравки: к её 3′-OH-концу полимераза присоединяет первый нуклеотид.","s1_cap_nopol":"Затравка спарена с матрицей, нуклеотиды в среде есть, но ДНК-полимеразы нет: фосфодиэфирные связи не образуются, цепь не удлиняется.","s1_cap_nopol_z":"Комплементарность определяет, какой нуклеотид подходит; присоединяет его фермент — ДНК-полимераза."},"notes":["Все dNTP есть: синтез доходит до конца матрицы.","Нет dGTP: синтез останавливается перед первым C матрицы за затравкой — напротив C нужен G."],"static":["Все dNTP есть: синтез доходит до конца матрицы."]}}},{"id":"chain-terminator","section":0,"questions":[1],"title":"Нуклеотид без 3′-OH обрывает цепь","keywords":["аналог нуклеотида","дидезоксинуклеотид","обрыв цепи","3′-OH"],"lead":["Если полимераза присоединит нуклеотид без 3′-OH, следующий нуклеотид присоединить будет не к чему — цепь оборвётся.","Такой обрыв происходит точно напротив комплементарного основания матрицы и поэтому «показывает», что стоит в матрице."],"mechanism":["[[T04|Аналог нуклеотида без 3′-OH]] (например, дидезоксинуклеотид) несёт обычное основание и спаривается как обычный нуклеотид.","Полимераза включает его напротив комплементарного основания матрицы.","У включённого аналога нет 3′-OH: следующую фосфодиэфирную связь образовать нельзя, и цепь обрывается.","Длина оборванной цепи указывает положение соответствующего основания в матрице."],"paragraphs":["Обрыв цепи — прямое следствие двух правил: комплементарности (аналог встаёт только напротив своего партнёра) и роста от 3′-OH (после аналога рост невозможен).","На этом принципе основан метод определения последовательности ДНК обрывом цепей и действие ряда противовирусных аналогов нуклеозидов, которые обрывают синтез вирусной ДНК. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма."],"conditions":"Схема качественная: в модели весь dATP заменён аналогом, поэтому обрыв происходит у первого T матрицы за затравкой; длины условные.","sources":["Alberts2022"],"quiz":{"id":"S7-L05","question":"В смесь вместо dCTP добавлен аналог dCTP без 3′-OH. Где оборвётся новая цепь?","options":[{"id":"S7-L05-1","text":"Напротив первого C матрицы","correct":false,"feedback":"Напротив C матрицы встаёт G, а не C; аналог C встанет напротив G."},{"id":"S7-L05-2","text":"Сразу после включения аналога напротив первого G матрицы","correct":true,"feedback":"Аналог C спаривается с G; после его включения 3′-OH нет, и цепь обрывается."},{"id":"S7-L05-3","text":"Цепь не оборвётся: основание аналога обычное","correct":false,"feedback":"Основание обычное, поэтому аналог включается, но у него нет 3′-OH — следующий нуклеотид присоединить нельзя."}]},"widget":{"kind":"dna","title":"","s":{"title":"Обрыв цепи аналогом без 3′-OH","status":"Схема качественная · последовательность условная","modes_label":"Нуклеотиды","modes":["все четыре dNTP","вместо dATP — аналог"],"scene":"s1b","args":[["1","all","anti"],["1","dda","anti"]],"L":{"s1_mat":"Матрица","s1_mat_1":"цепь 1","s1_mat_2":"цепь 2","s1_nuc":"Нуклеотиды в среде","s1_nuc_all":"все четыре dNTP","s1_nuc_dda":"вместо dATP — аналог без 3′-OH","s1_nuc_nog":"нет dGTP","s1_ori":"Затравка","s1_ori_anti":"антипараллельна матрице","s1_ori_par":"параллельна матрице","s1_lbl_tpl":"матрица — цепь {m} (записана 3′→5′ слева направо)","s1_lbl_primer":"затравка (короткая ДНК; в клетке затравка — РНК)","s1_lbl_new":"новая цепь","s1_lbl_pol":"ДНК-полимераза","s1_lbl_no3oh":"аналог: нет 3′-OH","s1_lbl_needG":"напротив C нужен G — dGTP нет","s1_lbl_par":"затравка параллельна матрице: пары не образуются","s1_lbl_pool":"Нуклеотиды в среде (dNTP):","s1_lbl_pool_dda":"A — аналог без 3′-OH","s1_lbl_pool_nog":"dGTP нет","s1_lbl_hb":"пунктир — водородные связи: в паре A–T две, в паре G–C три (схема, не масштаб)","s1_r_pairs":"Пары оснований с матрицей","s1_v_pairs":"A–T и G–C","s1_v_nopairs":"не образуются","s1_r_len":"Длина новой цепи","s1_r_len_s":"из 12 нуклеотидов, считая 3 нуклеотида затравки","s1_v_len":"{n}","s1_r_seq":"Последовательность новой цепи","s1_r_seq_s":"звёздочка — аналог без 3′-OH","s1_v_none":"нет","s1_r_stop":"Синтез","s1_v_stop_none":"дошёл до конца матрицы","s1_v_stop_dda":"оборвался после аналога напротив первого T матрицы за затравкой","s1_v_stop_noG":"остановился перед первым C матрицы за затравкой","s1_v_stop_nostart":"не начался","s1_r_same":"Новая цепь совпадает","s1_v_same":"с цепью {m} исходной молекулы","s1_cap_all":"Матрица — цепь {m}. Напротив каждого основания матрицы ДНК-полимераза присоединяет комплементарный нуклеотид: напротив A — T, напротив T — A, напротив G — C, напротив C — G. Новая цепь растёт от 3′-OH затравки в направлении 5′→3′ и антипараллельна матрице.","s1_cap_all_z":"Последовательность новой цепи однозначно задана матрицей: новая цепь совпадает с другой цепью исходной молекулы, поэтому каждая из двух цепей может служить матрицей, и копия воспроизводит исходную информацию.","s1_cap_dda":"Вместо dATP в среде аналог без 3′-OH. Он встаёт напротив первого T матрицы за затравкой, но к нему нельзя присоединить следующий нуклеотид: у аналога нет 3′-OH. Цепь обрывается — {n} нуклеотидов, считая затравку.","s1_cap_dda_z":"Обрыв происходит точно напротив определённого основания матрицы, поэтому по длине продукта можно определить, где в матрице стоит T. На этом основан метод определения последовательности ДНК обрывом цепей.","s1_cap_nog":"В среде нет dGTP. Напротив первого C матрицы за затравкой нужен G; в этой модели полимераза присоединяет только комплементарный нуклеотид, поэтому синтез останавливается перед этим положением — {n} нуклеотидов, считая затравку.","s1_cap_nog_z":"Комплементарность ограничивает выбор: напротив C подходит только G. Полимераза изредка всё же присоединяет некомплементарный нуклеотид; как такие ошибки исправляются — семинар 8.","s1_cap_par":"Затравка уложена параллельно матрице: напротив 3′-конца матрицы оказался её 3′-конец. В двойной спирали цепи антипараллельны, поэтому такая затравка в модели не образует пар с матрицей, и у полимеразы нет спаренного с матрицей 3′-OH — синтез не начинается.","s1_cap_par_z":"Для копирования нужны оба свойства молекулы: комплементарность оснований и антипараллельность цепей.","s1_lbl_notpl":"матрицы нет","s1_lbl_notpl_pr":"матрицы нет: затравке не с чем спариться","s1_lbl_nopr":"затравки нет: полимеразе нечего удлинять","s1_lbl_nopol":"ДНК-полимеразы нет: нуклеотиды не присоединяются","s1_cap_notpl":"Матрицы нет. Затравке не с чем спариться, и нет основания, которое задало бы следующий нуклеотид: синтез не начинается.","s1_cap_notpl_z":"Последовательность новой цепи задаёт матрица; без матрицы копировать нечего.","s1_cap_nopr":"Затравки нет. ДНК-полимераза удлиняет только спаренный 3′-OH-конец и не начинает цепь сама, поэтому синтез не начинается.","s1_cap_nopr_z":"Поэтому синтез новой цепи ДНК начинается с короткой затравки: к её 3′-OH-концу полимераза присоединяет первый нуклеотид.","s1_cap_nopol":"Затравка спарена с матрицей, нуклеотиды в среде есть, но ДНК-полимеразы нет: фосфодиэфирные связи не образуются, цепь не удлиняется.","s1_cap_nopol_z":"Комплементарность определяет, какой нуклеотид подходит; присоединяет его фермент — ДНК-полимераза."},"notes":["Все dNTP: синтез доходит до конца матрицы.","Вместо dATP — аналог без 3′-OH: обрыв сразу после аналога напротив первого T матрицы за затравкой."],"static":["Все dNTP: синтез доходит до конца матрицы."]}}},{"id":"four-substrates","section":0,"questions":[1],"title":"Хватит ли исправной полимеразы, чтобы скопировать ДНК?","keywords":["dNTP","субстрат","запас dNTP","ограничивающий ресурс"],"lead":["Уже известно: ДНК-полимераза удлиняет затравку от 3′-OH, присоединяя нуклеотид, комплементарный основанию матрицы (БИО-7·4).","Новое: синтезу нужны не только фермент, матрица и затравка, но и все четыре субстрата — dATP, dTTP, dGTP и dCTP. Каждый незаменим."],"mechanism":["Напротив каждого основания матрицы полимераза присоединяет один определённый нуклеотид: напротив A — T, напротив C — G.","Субстрат реакции — дезоксирибонуклеозидтрифосфат; энергию для связи даёт его собственный трифосфат.","Другой dNTP не может заменить нужный без ошибки, поэтому каждый из четырёх dNTP — отдельное необходимое условие синтеза.","Исправность фермента — необходимое, но не достаточное условие: без нужного субстрата полимераза не продвигается."],"paragraphs":["Свободные dNTP клетки — общий [[T35|запас]], из которого строят новые цепи все вилки сразу. В клетках, где этот запас мал, репликационные вилки движутся медленнее; при промежуточной нехватке сильнее страдают отдельные трудно копируемые участки генома, а не весь геном сразу.","Если изменить условие и убрать один dNTP, ферменты останутся исправными, а синтез всё равно остановится — на первом месте, где нужен недостающий нуклеотид (следующий шаг).","Важно различать «фермент не работает» и «ферменту не из чего строить»: внешне оба случая дают недостроенную цепь, но причины и способы их различить разные (третий шаг этого раздела).","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: одна матрица из 12 нуклеотидов, затравка из 3, исправная полимераза; запас dNTP показан качественно («в достатке», «мало», «нет»). Связь запаса dNTP со скоростью вилок — по обзору литературы; скорость модель не рассчитывает.","sources":["Alberts2022","Saxena2022"],"quiz":{"id":"S7-L30","question":"Полимераза исправна, затравка спарена с матрицей, но в среде нет dCTP. Что ограничивает синтез?","options":[{"id":"S7-L30-1","text":"Нехватка энергии: без dCTP полимераза не получает энергии и для других нуклеотидов","correct":false,"feedback":"Энергию для каждой связи даёт трифосфат присоединяемого нуклеотида; dATP, dTTP и dGTP присоединяются, пока они нужны матрице."},{"id":"S7-L30-2","text":"Дефект фермента: полимераза без dCTP повреждается","correct":false,"feedback":"Полимераза остаётся исправной: если вернуть dCTP, синтез продолжится."},{"id":"S7-L30-3","text":"Нехватка субстрата: напротив G матрицы нужен C, и другим dNTP его не заменить","correct":true,"feedback":"Фермент исправен; не хватает одного из четырёх необходимых субстратов."}]},"widget":{"kind":"dna","title":"","s":{"title":"Все ферменты работают — хватит ли этого?","status":"Учебная схема · запас dNTP показан качественно","modes_label":"Запас dNTP","modes":["все четыре dNTP в достатке","нет dCTP"],"scene":"a1","args":[["all","C","no"],["absent","C","no"]],"L":{"s1a_av":"Запас dNTP","s1a_av_all":"все четыре в достатке","s1a_av_absent":"одного нет","s1a_av_low":"одного мало","s1a_x":"Какого dNTP","s1a_x_A":"dATP","s1a_x_T":"dTTP","s1a_x_G":"dGTP","s1a_x_C":"dCTP","s1a_xnote":"Все четыре dNTP в достатке — выбирать недостающий нечего.","s1a_rest":"Отсутствовавший dNTP снова добавлен","s1a_rest_no":"нет","s1a_rest_yes":"да","s1a_rnote":"Восстанавливать нечего: этот переключатель работает, когда одного dNTP нет.","s1a_lbl_head":"учебная схема · полимераза исправна · запас dNTP показан качественно","s1a_lbl_primer":"затравка (3 нуклеотида)","s1a_lbl_pol":"ДНК-полимераза","s1a_lbl_need":"нужен {N}","s1a_lbl_paused":"здесь синтез был остановлен","s1a_lbl_slow":"жёлтая рамка — позиции, где нужен dNTP, которого мало","s1a_lbl_pool":"Запас dNTP в среде (уровень качественный, не концентрация)","s1a_lbl_foot":"Скорость синтеза и длительность ожидания модель не рассчитывает.","s1a_r_pos":"Положение полимеразы","s1a_r_pos_s":"длина цепи вместе с затравкой","s1a_v_pos":"{n} из 12 нуклеотидов","s1a_r_next":"Следующий нужный нуклеотид","s1a_v_next":"{L} — {N}","s1a_v_next_none":"нет: цепь достроена до конца матрицы","s1a_r_len":"Присоединено после затравки","s1a_r_len_s":"из 9 возможных","s1a_v_len":"{k} из 9","s1a_r_state":"Синтез в этой модели","s1a_v_done":"дошёл до конца матрицы","s1a_v_stop":"остановлен: нужного dNTP нет","s1a_v_stop_m":"остановлен","s1a_v_resumed":"продолжился и дошёл до конца","s1a_v_slow":"дошёл до конца; задержки возможны","s1a_cap_done":"Все четыре dNTP в достатке: полимераза присоединяет нуклеотид за нуклеотидом к 3′-OH и доходит до конца матрицы — добавлено 9 нуклеотидов.","s1a_cap_done_z":"Это исходное состояние: фермент исправен, матрица и затравка на месте, субстрат есть.","s1a_cap_stop":"Нет {N}: синтез остановился перед позицией {p} — напротив этого основания матрицы встаёт только нуклеотид, который присоединяется из {N}. 3′-OH последнего нуклеотида цепи сохранён.","s1a_cap_stop_z":"Фермент исправен, но для продолжения нужен конкретный субстрат; место остановки задаёт последовательность матрицы.","s1a_cap_resumed":"{N} снова в среде: синтез продолжился от того же 3′-OH, на котором остановился перед позицией {q}, и дошёл до конца матрицы.","s1a_cap_resumed_z":"Нехватка субстрата в этой модели обратима — в отличие от обрыва цепи аналогом без 3′-OH.","s1a_cap_slow":"{N} мало, но он есть: в этой модели цепь достраивается до конца; на позициях, где нужен {N}, возможна задержка.","s1a_cap_slow_z":"Снижение запаса не равно отсутствию: насколько замедлится синтез, зависит от кинетики реакции, и модель этого не рассчитывает.","s1a_cap_mask":"Наблюдение: синтез остановился. Какой запас dNTP был в среде, пока не показано.","s1a_cap_mask_z":"Определите по матрице, какие варианты запаса совместимы с этим наблюдением.","s1a_tl_note":"Порядок этапов — учебная модель; время шкалы условное, скорость синтеза модель не рассчитывает.","s1a_tl_1":"Затравка спарена с матрицей; её 3′-OH доступен полимеразе.","s1a_tl_2":"Полимераза присоединяет к 3′-OH dNTP, комплементарный основанию матрицы.","s1a_tl_3":"Цепь растёт 5′→3′, пока в среде есть нужный dNTP.","s1a_tl_done":"Все четыре dNTP есть: цепь достроена до конца матрицы.","s1a_tl_stop":"Нужного dNTP нет: полимераза стоит перед этой позицией, 3′-OH цепи сохранён.","s1a_tl_res":"dNTP вернули: синтез продолжается с того же 3′-OH.","s1a_tl_low":"dNTP мало: цепь достраивается, но на позициях, где он нужен, возможна задержка.","s1a_take":"Исправный фермент — необходимое, но не достаточное условие синтеза: нужен и субстрат. Без одного dNTP цепь в модели останавливается на первой позиции, где он нужен, и это место задаёт матрица. Если субстрат вернуть, синтез продолжается от того же 3′-OH; аналог без 3′-OH, напротив, обрывает цепь. Снижение запаса означает лишь возможное замедление, а не мгновенную остановку. Ошибки при копировании — тема следующего семинара."},"notes":["Все четыре dNTP в достатке: полимераза доходит до конца матрицы.","Нет dCTP: полимераза исправна, но остановилась перед первой позицией, где нужен C."],"static":["Все четыре dNTP в достатке: полимераза доходит до конца матрицы."]}},"level":"adv"},{"id":"first-missing","section":0,"questions":[1],"title":"Почему синтез останавливается именно там, где нужен недостающий dNTP?","keywords":["место остановки","последовательность матрицы","dNTP","обратная задача"],"lead":["Уже известно: без одного dNTP синтез не идёт дальше места, где этот нуклеотид нужен.","Новое: место остановки задаёт последовательность матрицы — и по месту остановки можно рассуждать о том, каких dNTP не было."],"mechanism":["Полимераза движется по матрице и присоединяет нуклеотиды по одному.","Пока матрица требует имеющиеся dNTP, цепь растёт.","Первая позиция, где нужен отсутствующий нуклеотид, становится местом остановки; 3′-OH последнего присоединённого нуклеотида при этом цел.","Если отсутствует другой dNTP, место остановки другое: в учебной матрице без dATP цепь останавливается перед позицией 5, без dGTP — перед 7, без dTTP — перед 8."],"paragraphs":["Если изменить условие и убрать два dNTP сразу, остановка произойдёт на первой позиции, где нужен любой из них: второй недостающий нуклеотид на наблюдение не влияет.","Отсюда обратная задача. Наблюдение «синтез остановился перед позицией 7, где нужен G» говорит больше, чем кажется: dCTP и dATP были (они нужны раньше и уже встроены), dGTP не было. А про dTTP, который нужен только позже, по этому наблюдению сказать ничего нельзя.","Здесь изучается только ограничение субстратом. Что происходит, если напротив основания встаёт неправильный нуклеотид, и как такие ошибки исправляются, — семинар 8.","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: остановка дискретна и происходит перед первой позицией, где нужен отсутствующий dNTP; встраивание неправильных нуклеотидов не рассматривается.","sources":["Alberts2022"],"quiz":{"id":"S7-L31","question":"Новая цепь должна расти так: A T G | C A C G T A G C T (до черты — затравка). Синтез остановился перед позицией 5. Чего точно не было в среде?","options":[{"id":"S7-L31-1","text":"dATP: на позиции 5 впервые после затравки нужен A","correct":true,"feedback":"На позиции 4 нужен C — он встроен; на позиции 5 нужен A — его не было."},{"id":"S7-L31-2","text":"dCTP: C встречается в новой цепи чаще других нуклеотидов","correct":false,"feedback":"dCTP был: C на позиции 4 уже встроен. Место остановки задаёт первая позиция, где нужен отсутствующий нуклеотид, а не частота."},{"id":"S7-L31-3","text":"dATP и dGTP: оба нужны после затравки, оба отсутствовали","correct":false,"feedback":"Об отсутствии dGTP по этому наблюдению сказать нельзя: G нужен только на позиции 7, после места остановки."}]},"widget":{"kind":"dna","title":"","s":{"title":"Место остановки задаёт матрица","status":"Учебная схема · позиции считаются с затравкой","modes_label":"Какого dNTP нет","modes":["нет dATP","нет dGTP","нет dTTP"],"scene":"a1","args":[["absent","A","no"],["absent","G","no"],["absent","T","no"]],"L":{"s1a_av":"Запас dNTP","s1a_av_all":"все четыре в достатке","s1a_av_absent":"одного нет","s1a_av_low":"одного мало","s1a_x":"Какого dNTP","s1a_x_A":"dATP","s1a_x_T":"dTTP","s1a_x_G":"dGTP","s1a_x_C":"dCTP","s }, и дошёл до конца матрицы.","s1a_cap_resumed_z":"Нехватка субстрата в этой модели обратима — в отличие от обрыва цепи аналогом без 3′-OH.","s1a_cap_slow":"{N} мало, но он есть: в этой модели цепь достраивается до конца; на позициях, где нужен {N}, возможна задержка.","s1a_cap_slow_z":"Снижение запаса не равно отсутствию: насколько замедлится синтез, зависит от кинетики реакции, и модель этого не рассчитывает.","s1a_cap_mask":"Наблюдение: синтез остановился. Какой запас dNTP был в среде, пока не показано.","s1a_cap_mask_z":"Определите по матрице, какие варианты запаса совместимы с этим наблюдением.","s1a_tl_note":"Порядок этапов — учебная модель; время шкалы условное, скорость синтеза модель не рассчитывает.","s1a_tl_1":"Затравка спарена с матрицей; её 3′-OH доступен полимеразе.","s1a_tl_2":"Полимераза присоединяет к 3′-OH dNTP, комплементарный основанию матрицы.","s1a_tl_3":"Цепь растёт 5′→3′, пока в среде есть нужный dNTP.","s1a_tl_done":"Все четыре dNTP есть: цепь достроена до конца матрицы.","s1a_tl_stop":"Нужного dNTP нет: полимераза стоит перед этой позицией, 3′-OH цепи сохранён.","s1a_tl_res":"dNTP вернули: синтез продолжается с того же 3′-OH.","s1a_tl_low":"dNTP мало: цепь достраивается, но на позициях, где он нужен, возможна задержка.","s1a_take":"Исправный фермент — необходимое, но не достаточное условие синтеза: нужен и субстрат. Без одного dNTP цепь в модели останавливается на первой позиции, где он нужен, и это место задаёт матрица. Если субстрат вернуть, синтез продолжается от того же 3′-OH; аналог без 3′-OH, напротив, обрывает цепь. Снижение запаса означает лишь возможное замедление, а не мгновенную остановку. Ошибки при копировании — тема следующего семинара."},"notes":["Нет dATP: остановка перед позицией 5.","Нет dGTP: остановка перед позицией 7.","Нет dTTP: остановка перед позицией 8."],"static":["Нет dATP: остановка перед позицией 5."]}},"level":"adv"},{"id":"substrate-vs-terminator","section":0,"questions":[1],"title":"Как отличить нехватку dNTP от обрыва цепи аналогом без 3′-OH?","keywords":["аналог без 3′-OH","обратимость","нехватка субстрата","замедление"],"lead":["Уже известно: аналог нуклеотида без 3′-OH обрывает цепь (БИО-7·5).","Новое: нехватка dNTP тоже останавливает синтез, но остановка обратима — 3′-OH остаётся."],"mechanism":["При нехватке dNTP последний присоединённый нуклеотид обычный, его 3′-OH цел.","Если нужный dNTP вернуть, полимераза присоединит его к тому же 3′-OH и продолжит синтез.","Аналог без 3′-OH встраивается в цепь, но следующую связь образовать не к чему: возвращение обычных dNTP цепь не удлиняет.","Если нужного dNTP не «нет», а «мало», в учебной модели синтез доходит до конца; на позициях, где нужен этот нуклеотид, возможна задержка."],"paragraphs":["Различающее наблюдение — что будет, если вернуть недостающий субстрат: при нехватке dNTP цепь продолжает расти, при обрыве аналогом — нет.","«Мало» и «нет» — разные условия. Насколько замедлится синтез при малом запасе, зависит от кинетики реакции; это не простая пропорция, и модель её не рассчитывает.","Как это узнали: в клетках, где нарушен синтез dNTP или их баланс, репликационные вилки замедляются. Это показывает связь запаса dNTP со скоростью вилок, но не задаёт формулы этой зависимости.","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: восстановление запаса идеализировано — синтез продолжается сразу; в клетке длительная остановка вилки имеет и другие последствия, которые рассматриваются в курсе «Молекулярная биология».","sources":["Alberts2022","Saxena2022"],"quiz":{"id":"S7-L32","question":"Синтез остановился. Затем в среду добавили все четыре dNTP, и цепь продолжила расти. Что было причиной остановки?","options":[{"id":"S7-L32-1","text":"Встраивание аналога без 3′-OH в последнюю позицию цепи","correct":false,"feedback":"После аналога цепь не удлиняется и при добавлении dNTP: нет 3′-OH."},{"id":"S7-L32-2","text":"Нехватка одного из dNTP: 3′-OH оставался свободным","correct":true,"feedback":"Последний нуклеотид был обычным, его 3′-OH цел: цепь удлинилась от того же конца, значит, не хватало только субстрата."},{"id":"S7-L32-3","text":"Временное повреждение полимеразы, которое прошло само","correct":false,"feedback":"Неисправная полимераза не начала бы работать от одного лишь добавления dNTP."}]},"widget":{"kind":"dna","title":"","s":{"title":"Нехватка субстрата обратима","status":"Учебная схема · запас dNTP показан качественно","modes_label":"Запас dGTP","modes":["нет dGTP","dGTP снова добавлен","dGTP мало"],"scene":"a1","args":[["absent","G","no"],["absent","G","yes"],["low","G","no"]],"L":{"s1a_av":"Запас dNTP","s1a_av_all":"все четыре в достатке","s1a_av_absent":"одного нет","s1a_av_low":"одного мало","s1a_x":"Какого dNTP","s1a_x_A":"dATP","s1a_x_T":"dTTP","s1a_x_G":"dGTP","s1a_x_C":"dCTP","s1a_xnote":"Все четыре dNTP в достатке — выбирать недостающий нечего.","s1a_rest":"Отсутствовавший dNTP снова добавлен","s1a_rest_no":"нет","s1a_rest_yes":"да","s1a_rnote":"Восстанавливать нечего: этот переключатель работает, когда одного dNTP нет.","s1a_lbl_head":"учебная схема · полимераза исправна · запас dNTP показан качественно","s1a_lbl_primer":"затравка (3 нуклеотида)","s1a_lbl_pol":"ДНК-полимераза","s1a_lbl_need":"нужен {N}","s1a_lbl_paused":"здесь синтез был остановлен","s1a_lbl_slow":"жёлтая рамка — позиции, где нужен dNTP, которого мало","s1a_lbl_pool":"Запас dNTP в среде (уровень качественный, не концентрация)","s1a_lbl_foot":"Скорость синтеза и длительность ожидания модель не рассчитывает.","s1a_r_pos":"Положение полимеразы","s1a_r_pos_s":"длина цепи вместе с затравкой","s1a_v_pos":"{n} из 12 нуклеотидов","s1a_r_next":"Следующий нужный нуклеотид","s1a_v_next":"{L} — {N}","s1a_v_next_none":"нет: цепь достроена до конца матрицы","s1a_r_len":"Присоединено после затравки","s1a_r_len_s":"из 9 возможных","s1a_v_len":"{k} из 9","s1a_r_state":"Синтез в этой модели","s1a_v_done":"дошёл до конца матрицы","s1a_v_stop":"остановлен: нужного dNTP нет","s1a_v_stop_m":"остановлен","s1a_v_resumed":"продолжился и дошёл до конца","s1a_v_slow":"дошёл до конца; задержки возможны","s1a_cap_done":"Все четыре dNTP в достатке: полимераза присоединяет нуклеотид за нуклеотидом к 3′-OH и доходит до конца матрицы — добавлено 9 нуклеотидов.","s1a_cap_done_z":"Это исходное состояние: фермент исправен, матрица и затравка на месте, субстрат есть.","s1a_cap_stop":"Нет {N}: синтез остановился перед позицией {p} — напротив этого основания матрицы встаёт только нуклеотид, который присоединяется из {N}. 3′-OH последнего нуклеотида цепи сохранён.","s1a_cap_stop_z":"Фермент исправен, но для продолжения нужен конкретный субстрат; место остановки задаёт последовательность матрицы.","s1a_cap_resumed":"{N} снова в среде: синтез продолжился от того же 3′-OH, на котором остановился перед позицией {q}, и дошёл до конца матрицы.","s1a_cap_resumed_z":"Нехватка субстрата в этой модели обратима — в отличие от обрыва цепи аналогом без 3′-OH.","s1a_cap_slow":"{N} мало, но он есть: в этой модели цепь достраивается до конца; на позициях, где нужен {N}, возможна задержка.","s1a_cap_slow_z":"Снижение запаса не равно отсутствию: насколько замедлится синтез, зависит от кинетики реакции, и модель этого не рассчитывает.","s1a_cap_mask":"Наблюдение: синтез остановился. Какой запас dNTP был в среде, пока не показано.","s1a_cap_mask_z":"Определите по матрице, какие варианты запаса совместимы с этим наблюдением.","s1a_tl_note":"Порядок этапов — учебная модель; время шкалы условное, скорость синтеза модель не рассчитывает.","s1a_tl_1":"Затравка спарена с матрицей; её 3′-OH доступен полимеразе.","s1a_tl_2":"Полимераза присоединяет к 3′-OH dNTP, комплементарный основанию матрицы.","s1a_tl_3":"Цепь растёт 5′→3′, пока в среде есть нужный dNTP.","s1a_tl_done":"Все четыре dNTP есть: цепь достроена до конца матрицы.","s1a_tl_stop":"Нужного dNTP нет: полимераза стоит перед этой позицией, 3′-OH цепи сохранён.","s1a_tl_res":"dNTP вернули: синтез продолжается с того же 3′-OH.","s1a_tl_low":"dNTP мало: цепь достраивается, но на позициях, где он нужен, возможна задержка.","s1a_take":"Исправный фермент — необходимое, но не достаточное условие синтеза: нужен и субстрат. Без одного dNTP цепь в модели останавливается на первой позиции, где он нужен, и это место задаёт матрица. Если субстрат вернуть, синтез продолжается от того же 3′-OH; аналог без 3′-OH, напротив, обрывает цепь. Снижение запаса означает лишь возможное замедление, а не мгновенную остановку. Ошибки при копировании — тема следующего семинара."},"notes":["Нет dGTP: остановка перед позицией 7; 3′-OH цел.","dGTP вернули: синтез продолжился от того же 3′-OH до конца матрицы.","dGTP мало: цепь достроена; на позициях, где нужен G, возможна задержка."],"static":["Нет dGTP: остановка перед позицией 7; 3′-OH цел."]}},"level":"adv"},{"id":"semiconservative","section":1,"questions":[2],"title":"Строение молекулы предсказывает полуконсервативность","keywords":["полуконсервативная репликация","матрица","дочерняя молекула"],"lead":["Если каждая цепь служит матрицей (БИО-7·3), то каждая дочерняя молекула получит одну старую цепь и одну новую. Такой способ копирования называют полуконсервативным.","Это второй пункт минимального результата и первая часть вопроса 2 коллоквиума 2 (предварительный список)."],"mechanism":["Цепи родительской молекулы расходятся в репликационной вилке.","К каждой старой цепи по правилам комплементарности достраивается новая.","Каждая дочерняя двойная спираль состоит из одной старой (сохранённой) и одной новой цепи.","Обе дочерние молекулы по последовательности совпадают с родительской, если при копировании не возникло ошибок."],"paragraphs":["Слово «полуконсервативная» означает, что сохраняется половина родительской молекулы — одна цепь в каждой дочерней. Строение молекулы предсказывает этот способ, но само по себе не исключает другие мыслимые — консервативный (одна дочерняя молекула целиком старая, другая целиком новая) и дисперсный (старый и новый материал перемешан внутри цепей). Выбор между ними сделал эксперимент: ДНК бактерий, выросших на среде с тяжёлым изотопом азота ¹⁵N, после одного удвоения на среде с ¹⁴N имела промежуточную плотность (это исключает консервативный способ), а после второго — наполовину промежуточную и наполовину лёгкую (это исключает дисперсный).","Старая цепь сохраняет в дочерней молекуле свои химические метки, например метилирование цитозинов; по ним метки восстанавливаются на новой цепи.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как после репликации полуметилированная ДНК снова становится метилированной на обеих цепях — [[https://fresll.github.io/molbio/seminar-6-route.html#maintenance|МБ, семинар 6, шаг 3]]; почему метилирование убывает, если его не восстанавливать, — [[https://fresll.github.io/molbio/seminar-6-route.html#passive-loss|МБ, семинар 6, шаг 4]]."],"conditions":"Схема качественная: длины и время условные.","sources":["Alberts2022","Meselson1958"],"quiz":{"id":"S7-L08","question":"Почему дочерняя молекула ДНК содержит одну старую и одну новую цепь?","options":[{"id":"S7-L08-1","text":"Старые цепи после копирования снова соединяются друг с другом","correct":false,"feedback":"В полуконсервативном способе старые цепи не соединяются вновь: каждая остаётся в паре со своей новой цепью."},{"id":"S7-L08-2","text":"Каждая старая цепь служит матрицей и остаётся спаренной с построенной на ней новой цепью","correct":true,"feedback":"Новая цепь строится напротив старой и образует с ней двойную спираль — так получается полуконсервативность."},{"id":"S7-L08-3","text":"Новые цепи собирают из кусков старых","correct":false,"feedback":"Новая цепь синтезируется из нуклеотидов среды; старый и новый материал внутри цепей не перемешиваются."}]},"widget":{"kind":"dna","title":"","s":{"title":"Состав дочерних молекул в пузырьке","status":"Схема качественная · длины и время условные","modes_label":"Время","modes":["до начала","вилки разошлись"],"scene":"s2b","args":[["1","2",0],["1","2",1]],"L":{"s2_ori":"Точки начала на участке","s2_ori_1":"одна","s2_ori_3":"три","s2_fork":"Вилок от точки начала","s2_fork_2":"две","s2_fork_1":"одна (мысленный эксперимент)","s2_t":"Время (условные шаги)","s2_t_0":"до начала","s2_t_1":"1","s2_t_2":"2","s2_t_3":"3","s2_lbl_seg":"участок хромосомной ДНК; длина и время условные","s2_lbl_ori":"точка начала репликации","s2_lbl_fork":"вилка","s2_lbl_replicons":"репликоны: участки, копируемые от одной точки начала","s2_lbl_onefork":"одна вилка: ДНК по другую сторону от точки начала не копируется","s2_lbl_onefork3":"по одной вилке от каждой точки начала: участок левее первой точки начала не копируется","s2_lbl_daughters":"дочерние молекулы скопированного участка:","s2_lbl_semi":"в каждой — одна старая (тёмная) и одна новая (светлая) цепь","s2_r_forks":"Работающих вилок","s2_v_forks":"{n}","s2_r_copied":"Скопировано","s2_r_copied_s":"доля участка; условные единицы","s2_v_pct":"{n} %","s2_r_met":"Встречи вилок соседних точек начала","s2_v_met":"{n}","s2_v_nomet":"нет","s2_r_daughter":"Дочерняя молекула","s2_v_semi":"старая + новая цепь","s2_v_none":"ещё нет","s2_cap_0":"До начала репликации участок — родительская двойная спираль. Репликация начнётся в точке начала (ориджине): здесь собираются белки инициации и расплетают ДНК.","s2_cap_0_z":"Репликация начинается не в любом месте, а в точках начала; у эукариот их узнаёт комплекс узнавания точки начала (ORC).","s2_cap_1":"От точки начала в противоположные стороны расходятся две репликационные вилки; между ними — пузырёк репликации. Внутри пузырька каждая старая цепь уже спарена с новой; снаружи — родительская двойная спираль. Скопировано {n} % участка.","s2_cap_1_z":"Матрицей служит каждая из двух цепей, поэтому каждая дочерняя молекула получает одну старую и одну новую цепь: так строение двойной спирали предсказывает полуконсервативность.","s2_cap_1done":"Две вилки прошли весь участок: получились две дочерние молекулы, в каждой — одна старая и одна новая цепь.","s2_cap_1done_z":"Две вилки от одной точки начала одновременно копируют ДНК по обе стороны от неё; каждая проходит только свою часть участка.","s2_cap_one":"Мысленный эксперимент: от точки начала идёт только одна вилка. Скопировано {n} %: участок по другую сторону от точки начала в этой модели не копируется.","s2_cap_one_z":"Две вилки, расходящиеся в обе стороны, копируют ДНК по обе стороны от точки начала; одна вилка копирует только одну сторону.","s2_cap_3":"Три точки начала, от каждой — две вилки. Скопировано {n} % участка.","s2_cap_3_z":"Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.","s2_cap_3done":"Вилки соседних точек начала встретились, пузырьки слились, и весь участок скопирован за один шаг — втрое быстрее, чем от одной точки начала.","s2_cap_3done_z":"Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.","s2_ori_own":"расставить самому","s2_pos":"Места точек начала (нажмите, чтобы поставить или убрать точку)","s2_pos_n":"{i}","s2_r_full":"Время полного копирования участка","s2_r_full_s":"расчёт модели, в условных шагах: вилка проходит 90 условных единиц за шаг","s2_v_full":"{n}","s2_v_full_inf":"участок не скопируется полностью","s2_cap_own":"Точек начала: {k}, от каждой — две вилки. Скопировано {n} % участка; полное копирование в этой модели занимает {s} (в условных шагах).","s2_cap_own_z":"Время копирования задаёт самый длинный путь одной вилки: чем больше точек начала и чем ровнее они расставлены, тем быстрее скопирован весь участок (в модели скорость вилок одинакова).","s2_cap_own1":"Мысленный эксперимент: по одной вилке от каждой точки начала. Скопировано {n} %; участок левее первой точки начала не копируется.","s2_cap_own1_z":"Одна вилка копирует ДНК только в одну сторону от точки начала, поэтому участок левее первой точки начала остаётся нескопированным; две вилки копируют ДНК по обе стороны от точки начала.","s2_v_full_more":"{n} — больше трёх ходов переключателя «Время»"},"notes":["До начала: родительская двойная спираль.","Внутри пузырька каждая старая цепь спарена с новой: каждая дочерняя молекула — старая + новая цепь."],"static":["Внутри пузырька каждая старая цепь спарена с новой: каждая дочерняя молекула — старая + новая цепь."]}}},{"id":"origin-bubble","section":1,"questions":[2],"title":"Точка начала репликации: пузырёк и две вилки","keywords":["точка начала репликации","ориджин","ORC","пузырёк репликации","двунаправленная репликация"],"lead":["Репликация начинается не в любом месте молекулы, а в [[T14|точках начала репликации]] (ориджинах).","От каждой точки начала в противоположные стороны расходятся две [[T16|репликационные вилки]]; участок между ними — [[T15|пузырёк репликации]]."],"mechanism":["Белки-инициаторы связываются с точкой начала; у эукариот её узнаёт комплекс узнавания точки начала репликации (ORC).","В точке начала активируются две хеликазы, загруженные на неё ещё до S-фазы (шаг БИО-7·11); двойная спираль расплетается, образуется пузырёк.","На двух краях пузырька работают две вилки; они движутся в противоположные стороны — репликация двунаправленная.","Внутри пузырька ДНК уже скопирована, снаружи остаётся родительская двойная спираль."],"paragraphs":["Двунаправленность важна количественно: две вилки копируют ДНК по обе стороны от точки начала одновременно, и при той же скорости вилок участок копируется вдвое быстрее, чем копировала бы одна вилка.","Хромосома кишечной палочки — одна кольцевая молекула ДНК длиной 4,6 млн пар нуклеотидов — имеет одну точку начала; две вилки, расходящиеся от неё со скоростью около 1000 нуклеотидов в секунду, встречаются примерно на противоположной стороне кольца. У эукариот вилки движутся примерно в 20 раз медленнее (около 50 нуклеотидов в секунду по оценке учебника), а молекулы ДНК намного длиннее — поэтому точек начала много (следующий шаг).","Двойную спираль в точке начала у эукариот расплетают не белки ORC, а собранная на точке начала хеликаза (раздел 4)."],"conditions":"Схема качественная; скорости вилок — оценки учебника для E. coli и клеток эукариот (по удлинению меченых участков ДНК, авторадиография); в клетке скорость вилок может меняться.","sources":["Alberts2022"],"quiz":{"id":"S7-L09","question":"Сколько репликационных вилок образуется от одной точки начала и куда они движутся?","options":[{"id":"S7-L09-1","text":"Одна, от 5′-конца к 3′-концу хромосомы","correct":false,"feedback":"От точки начала образуются две вилки; направление синтеза 5′→3′ относится к новым цепям, а не к движению вилки по хромосоме."},{"id":"S7-L09-2","text":"Две, навстречу друг другу","correct":false,"feedback":"Навстречу друг другу движутся вилки соседних точек начала; вилки одной точки начала расходятся."},{"id":"S7-L09-3","text":"Две, в противоположные стороны","correct":true,"feedback":"Репликация от точки начала двунаправленная: две вилки на краях пузырька расходятся."}]},"widget":{"kind":"dna","title":"","s":{"title":"Две вилки или одна","status":"Схема качественная · длины и время условные","modes_label":"Вилок от точки начала","modes":["две вилки","одна вилка (мысленный эксперимент)"],"scene":"s2b","args":[["1","2",3],["1","1",3]],"L":{"s2_ori":"Точки начала на участке","s2_ori_1":"одна","s2_ori_3":"три","s2_fork":"Вилок от точки начала","s2_fork_2":"две","s2_fork_1":"одна (мысленный эксперимент)","s2_t":"Время (условные шаги)","s2_t_0":"до начала","s2_t_1":"1","s2_t_2":"2","s2_t_3":"3","s2_lbl_seg":"участок хромосомной ДНК; длина и время условные","s2_lbl_ori":"точка начала репликации","s2_lbl_fork":"вилка","s2_lbl_replicons":"репликоны: участки, копируемые от одной точки начала","s2_lbl_onefork":"одна вилка: ДНК по другую сторону от точки начала не копируется","s2_lbl_onefork3":"по одной вилке от каждой точки начала: участок левее первой точки начала не копируется","s2_lbl_daughters":"дочерние молекулы скопированного участка:","s2_lbl_semi":"в каждой — одна старая (тёмная) и одна новая (светлая) цепь","s2_r_forks":"Работающих вилок","s2_v_forks":"{n}","s2_r_copied":"Скопировано","s2_r_copied_s":"доля участка; условные единицы","s2_v_pct":"{n} %","s2_r_met":"Встречи вилок соседних точек начала","s2_v_met":"{n}","s2_v_nomet":"нет","s2_r_daughter":"Дочерняя молекула","s2_v_semi":"старая + новая цепь","s2_v_none":"ещё нет","s2_cap_0":"До начала репликации участок — родительская двойная спираль. Репликация начнётся в точке начала (ориджине): здесь собираются белки инициации и расплетают ДНК.","s2_cap_0_z":"Репликация начинается не в любом месте, а в точках начала; у эукариот их узнаёт комплекс узнавания точки начала (ORC).","s2_cap_1":"От точки начала в противоположные стороны расходятся две репликационные вилки; между ними — пузырёк репликации. Внутри пузырька каждая старая цепь уже спарена с новой; снаружи — родительская двойная спираль. Скопировано {n} % участка.","s2_cap_1_z":"Матрицей служит каждая из двух цепей, поэтому каждая дочерняя молекула получает одну старую и одну новую цепь: так строение двойной спирали предсказывает полуконсервативность.","s2_cap_1done":"Две вилки прошли весь участок: получились две дочерние молекулы, в каждой — одна старая и одна новая цепь.","s2_cap_1done_z":"Две вилки от одной точки начала одновременно копируют ДНК по обе стороны от неё; каждая проходит только свою часть участка.","s2_cap_one":"Мысленный эксперимент: от точки начала идёт только одна вилка. Скопировано {n} %: участок по другую сторону от точки начала в этой модели не копируется.","s2_cap_one_z":"Две вилки, расходящиеся в обе стороны, копируют ДНК по обе стороны от точки начала; одна вилка копирует только одну сторону.","s2_cap_3":"Три точки начала, от каждой — две вилки. Скопировано {n} % участка.","s2_cap_3_z":"Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.","s2_cap_3done":"Вилки соседних точек начала встретились, пузырьки слились, и весь участок скопирован за один шаг — втрое быстрее, чем от одной точки начала.","s2_cap_3done_z":"Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.","s2_ori_own":"расставить самому","s2_pos":"Места точек начала (нажмите, чтобы поставить или убрать точку)","s2_pos_n":"{i}","s2_r_full":"Время полного копирования участка","s2_r_full_s":"расчёт модели, в условных шагах: вилка проходит 90 условных единиц за шаг","s2_v_full":"{n}","s2_v_full_inf":"участок не скопируется полностью","s2_cap_own":"Точек начала: {k}, от каждой — две вилки. Скопировано {n} % участка; полное копирование в этой модели занимает {s} (в условных шагах).","s2_cap_own_z":"Время копирования задаёт самый длинный путь одной вилки: чем больше точек начала и чем ровнее они расставлены, тем быстрее скопирован весь участок (в модели скорость вилок одинакова).","s2_cap_own1":"Мысленный эксперимент: по одной вилке от каждой точки начала. Скопировано {n} %; участок левее первой точки начала не копируется.","s2_cap_own1_z":"Одна вилка копирует ДНК только в одну сторону от точки начала, поэтому участок левее первой точки начала остаётся нескопированным; две вилки копируют ДНК по обе стороны от точки начала.","s2_v_full_more":"{n} — больше трёх ходов переключателя «Время»"},"notes":["Две вилки за три шага скопировали весь участок.","Одна вилка за то же время скопировала только часть участка по одну сторону от точки начала."],"static":["Одна вилка за то же время скопировала только часть участка по одну сторону от точки начала."]}}},{"id":"replicon","section":1,"questions":[2],"title":"Репликон и множество точек начала","keywords":["репликон","точки начала","S-фаза","время репликации"],"lead":["[[T17|Репликон]] — участок ДНК, который копируется от одной точки начала.","Длинная молекула эукариотической ДНК разделена на множество репликонов: вилки соседних точек начала встречаются, и скопированные участки сливаются."],"mechanism":["В каждой хромосоме много точек начала; по оценке учебника, в клетке человека при каждом делении используется около 30–50 тысяч точек начала, а потенциальных точек начала в несколько раз больше (по разным оценкам — в 3–10 раз); такие оценки зависят от типа клеток и метода.","От каждой точки начала расходятся две вилки.","Встречные вилки соседних точек начала встречаются, пузырьки сливаются, и новые цепи соседних репликонов соединяются.","Точки начала запускаются не одновременно, а в разное время на протяжении S-фазы; каждая — не более одного раза за S-фазу."],"paragraphs":["Множество точек начала сокращает время копирования длинной молекулы, но скорость каждой вилки при этом не растёт: увеличивается число вилок, работающих одновременно.",{"h":"Сверх программы: почему каждая точка начала используется один раз"},"Каждый участок должен быть скопирован ровно один раз за цикл. До S-фазы — с конца митоза и в G1 — на участке ДНК собирается неактивная хеликаза: участок подготовлен к запуску. Это подготовка (лицензирование) точки начала. В S-фазе часть подготовленных точек запускается: хеликаза активируется и начинает расплетать ДНК. Новых точек в S-фазе не подготавливается, а точка, через которую прошла вилка, теряет подготовку; поэтому каждая точка используется не более одного раза. Сверх программы — на коллоквиуме и зачёте не требуется.",{"details":"Справка (необязательно): какие белки в этом участвуют","text":"Подготовку проводят комплекс узнавания точки начала (ORC) и белки Cdc6 и Cdt1: они загружают на ДНК две кольцевые хеликазы MCM (белки поддержания минихромосом). При запуске к MCM присоединяются Cdc45 и комплекс GINS, и образуется активная хеликаза CMG (комплекс Cdc45–MCM–GINS). Названия белков для решения заданий не нужны."},"S-фаза клетки млекопитающего длится около 8 часов. Порядок активации точек начала связан с состоянием хроматина: по обобщению литературы, большинство активных генов копируется в начале S-фазы, а неактивные гены и повторяющиеся последовательности — позже."],"conditions":"Числа — по учебнику (клетки человека); схема качественная.","sources":["Alberts2022","Jackson1998","Stillman2025"],"quiz":{"id":"S7-L10","question":"Зачем эукариотической хромосоме много точек начала, если вилки от этого не ускоряются?","options":[{"id":"S7-L10-1","text":"Одновременно работает больше вилок, и длинная молекула копируется за время S-фазы","correct":true,"feedback":"Время копирования сокращается за счёт числа вилок, а не их скорости."},{"id":"S7-L10-2","text":"Каждый участок копируется несколько раз для надёжности","correct":false,"feedback":"Каждый участок копируется ровно один раз; повторное копирование не допускается."},{"id":"S7-L10-3","text":"Вилки соседних точек начала ускоряют друг друга","correct":false,"feedback":"Вилки соседних точек начала не ускоряют друг друга; встретившись, вилки завершают синтез."}]},"widget":{"kind":"dna","title":"","s":{"title":"Одна или три точки начала","status":"Схема качественная · длины и время условные","modes_label":"Точки начала","modes":["одна точка начала","три точки начала"],"scene":"s2b","args":[["1","2",1],["3","2",1]],"L":{"s2_ori":"Точки начала на участке","s2_ori_1":"одна","s2_ori_3":"три","s2_fork":"Вилок от точки начала","s2_fork_2":"две","s2_fork_1":"одна (мысленный эксперимент)","s2_t":"Время (условные шаги)","s2_t_0":"до начала","s2_t_1":"1","s2_t_2":"2","s2_t_3":"3","s2_lbl_seg":"участок хромосомной ДНК; длина и время условные","s2_lbl_ori":"точка начала репликации","s2_lbl_fork":"вилка","s2_lbl_replicons":"репликоны: участки, копируемые от одной точки начала","s2_lbl_onefork":"одна вилка: ДНК по другую сторону от точки начала не копируется","s2_lbl_onefork3":"по одной вилке от каждой точки начала: участок левее первой точки начала не копируется","s2_lbl_daughters":"дочерние молекулы скопированного участка:","s2_lbl_semi":"в каждой — одна старая (тёмная) и одна новая (светлая) цепь","s2_r_forks":"Работающих вилок","s2_v_forks":"{n}","s2_r_copied":"Скопировано","s2_r_copied_s":"доля участка; условные единицы","s2_v_pct":"{n} %","s2_r_met":"Встречи вилок соседних точек начала","s2_v_met":"{n}","s2_v_nomet":"нет","s2_r_daughter":"Дочерняя молекула","s2_v_semi":"старая + новая цепь","s2_v_none":"ещё нет","s2_cap_0":"До начала репликации участок — родительская двойная спираль. Репликация начнётся в точке начала (ориджине): здесь собираются белки инициации и расплетают ДНК.","s2_cap_0_z":"Репликация начинается не в любом месте, а в точках начала; у эукариот их узнаёт комплекс узнавания точки начала (ORC).","s2_cap_1":"От точки начала в противоположные стороны расходятся две репликационные вилки; между ними — пузырёк репликации. Внутри пузырька каждая старая цепь уже спарена с новой; снаружи — родительская двойная спираль. Скопировано {n} % участка.","s2_cap_1_z":"Матрицей служит каждая из двух цепей, поэтому каждая дочерняя молекула получает одну старую и одну новую цепь: так строение двойной спирали предсказывает полуконсервативность.","s2_cap_1done":"Две вилки прошли весь участок: получились две дочерние молекулы, в каждой — одна старая и одна новая цепь.","s2_cap_1done_z":"Две вилки от одной точки начала одновременно копируют ДНК по обе стороны от неё; каждая проходит только свою часть участка.","s2_cap_one":"Мысленный эксперимент: от точки начала идёт только одна вилка. Скопировано {n} %: участок по другую сторону от точки начала в этой модели не копируется.","s2_cap_one_z":"Две вилки, расходящиеся в обе стороны, копируют ДНК по обе стороны от точки начала; одна вилка копирует только одну сторону.","s2_cap_3":"Три точки начала, от каждой — две вилки. Скопировано {n} % участка.","s2_cap_3_z":"Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.","s2_cap_3done":"Вилки соседних точек начала встретились, пузырьки слились, и весь участок скопирован за один шаг — втрое быстрее, чем от одной точки начала.","s2_cap_3done_z":"Участок, который копируется от одной точки начала, — репликон. Множество точек начала сокращает время копирования длинной молекулы за счёт числа вилок, а не их ускорения; в модели скорость каждой вилки одна и та же.","s2_ori_own":"расставить самому","s2_pos":"Места точек начала (нажмите, чтобы поставить или убрать точку)","s2_pos_n":"{i}","s2_r_full":"Время полного копирования участка","s2_r_full_s":"расчёт модели, в условных шагах: вилка проходит 90 условных единиц за шаг","s2_v_full":"{n}","s2_v_full_inf":"участок не скопируется полностью","s2_cap_own":"Точек начала: {k}, от каждой — две вилки. Скопировано {n} % участка; полное копирование в этой модели занимает {s} (в условных шагах).","s2_cap_own_z":"Время копирования задаёт самый длинный путь одной вилки: чем больше точек начала и чем ровнее они расставлены, тем быстрее скопирован весь участок (в модели скорость вилок одинакова).","s2_cap_own1":"Мысленный эксперимент: по одной вилке от каждой точки начала. Скопировано {n} %; участок левее первой точки начала не копируется.","s2_cap_own1_z":"Одна вилка копирует ДНК только в одну сторону от точки начала, поэтому участок левее первой точки начала остаётся нескопированным; две вилки копируют ДНК по обе стороны от точки начала.","s2_v_full_more":"{n} — больше трёх ходов переключателя «Время»"},"notes":["Одна точка начала за один шаг скопировала треть участка.","Три точки начала за тот же шаг: вилки соседних точек начала встретились, весь участок скопирован."],"static":["Три точки начала за тот же шаг: вилки соседних точек начала встретились, весь участок скопирован."]}}},{"id":"licensed-vs-fired","section":1,"questions":[2],"title":"Чем подготовленная точка начала отличается от запущенной?","keywords":["подготовка точек начала","запуск точки начала","резервная точка начала","S-фаза"],"lead":["Уже известно: в хромосоме человека много точек начала, от каждой расходятся две вилки (БИО-7·11).","Новое: подготовка (лицензирование) точки начала и её запуск — разные события, разделённые во времени; подготовленных точек больше, чем запускается, и какие из них запустятся, в каждой клетке решается заново."],"mechanism":["До S-фазы на участке ДНК собирается неактивная хеликаза: участок подготовлен к возможному запуску. Это подготовка (лицензирование) точки начала; белки этого процесса перечислены в необязательной справке шага БИО-7·11 и здесь не нужны.","В S-фазе часть подготовленных точек запускается и даёт по две вилки; какие именно — во многом случайно.","Другие подготовленные точки остаются неактивными; их копирует вилка соседней точки начала, и вместе с участком точка теряет подготовку.","В S-фазе новые точки не подготавливаются; поэтому скопированный участок в ту же S-фазу второй раз не копируется."],"paragraphs":["По оценкам для клеток млекопитающих, подготовленных точек в несколько раз больше, чем запускается (по разным оценкам — в 3–10 раз); точная кратность зависит от типа клеток и способа оценки. В обычной S-фазе большинство из них остаются [[T36|резервными]].","Запрет на подготовку новых точек в S-фазе защищает от повторного копирования участков: если бы точки начала подготавливались заново на уже скопированной ДНК, эти участки удваивались бы лишний раз.","Какие из подготовленных точек запустятся в конкретной клетке, во многом случайно: одна и та же точка может работать в одной клетке и оставаться резервной в другой. Поэтому «резервная» — не особый вид точки, а её судьба в данной клетке и данной S-фазе.","У клеток человека нет точек начала с единой последовательностью. Когда запуски репликации определили на отдельных молекулах ДНК, большинство из них оказались рассеянными по геному, и каждое такое место используется редко. Поэтому схема с точками A, В и Б — учебная модель, а не карта хромосомы.","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Схема — учебная модель участка хромосомы, а не карта реальных точек начала: места и время запуска заданы правилами модели. Наборы запущенных точек в режиме «разные клетки» условные; одинаковая подготовка точек во всех клетках — упрощение. Данные о рассеянных запусках получены на культивируемых клетках человека одним методом — чтением отдельных молекул ДНК; доля таких запусков зависит от метода. Белки подготовки точек начала здесь не рассматриваются.","sources":["Alberts2022","Blow2011","Carrington2025"],"quiz":{"id":"S7-L33","question":"Резервную точку начала скопировала проходящая вилка. Может ли эта точка запуститься позже в той же S-фазе?","options":[{"id":"S7-L33-1","text":"Да: подготовленная точка запускается обязательно, раньше или позже","correct":false,"feedback":"Большинство подготовленных точек в обычной S-фазе так и остаются неиспользованными."},{"id":"S7-L33-2","text":"Да, если соседняя вилка остановится","correct":false,"feedback":"Резервная точка может помочь остановленной вилке, только пока сама ещё не скопирована."},{"id":"S7-L33-3","text":"Нет: она потеряла подготовку, а новые точки в S-фазе не появляются","correct":true,"feedback":"Это и предотвращает повторное копирование участка в одном цикле."}]},"widget":{"kind":"dna","title":"","s":{"title":"Обычный ход: резерв не используется","status":"Учебная схема · к концу S-фазы · единицы условные","modes_label":"Что показать","modes":["точка Б близко","точка Б далеко","разные клетки"],"scene":"a2","args":[["near","none","yes","yes"],["far","none","yes","yes"],["cells"]],"L":{"s2a_view":"Что показать","s2a_view_one":"одна клетка","s2a_view_cells":"разные клетки","s2a_vnote":"«Разные клетки»: задержек нет — сравниваются только наборы точек, запущенных в начале S-фазы. Остальные переключатели относятся к одной клетке.","s2a_geom":"Соседняя точка начала Б","s2a_geom_near":"близко (8 ед.)","s2a_geom_far":"далеко (16 ед.)","s2a_stall":"Ход вилок","s2a_stall_none":"без задержек","s2a_stall_one":"остановилась вилка от A","s2a_stall_two":"остановились обе встречные","s2a_prep":"Точки В (и Г) подготовлены до S-фазы","s2a_prep_yes":"да","s2a_prep_no":"нет","s2a_fire":"Резервная точка у остановленной вилки — в этой клетке","s2a_fire_yes":"запустилась","s2a_fire_no":"не запустилась","s2a_fnote2":"Вилки не останавливались — исход запуска у остановленной вилки здесь не нужен: точки, через которые прошла вилка, в этой S-фазе уже не запустятся.","s2a_fnote":"Резервные точки не подготовлены до S-фазы — запускать нечего; в S-фазе новые точки начала не подготавливаются.","s2a_lbl_head":"учебная схема · к концу S-фазы (шаг {T}) · единицы условные","s2a_lbl_B":"Б","s2a_lbl_head_g1":"учебная схема · до S-фазы: точки подготовлены, ни одна не запущена","s2a_lbl_head_t":"учебная схема · шаг {k} из {T} · единицы условные","s2a_lbl_head_cells":"учебная схема · одни и те же точки в четырёх клетках · S-фаза","s2a_lbl_head_cells_g1":"учебная схема · одни и те же точки в четырёх клетках · до S-фазы","s2a_c_g1":"до S-фазы, все клетки","s2a_c_cell":"S-фаза, клетка {i}","s2a_c_key1":"▲ — запущена в этой клетке; △ — подготовлена до S-фазы","s2a_c_key2":"△ пунктиром — в этой клетке не запущена: её скопировала проходящая вилка","s2a_lbl_foot_cells":"Наборы условные; одинаковая подготовка во всех клетках — упрощение.","s2a_lbl_stall":"вилка остановилась","s2a_lbl_out":"за точкой Б — соседний участок","s2a_lbl_len":"моделируемый участок между A и Б: {L} условных единиц","s2a_lbl_key1":"▲ — запущенная в этой клетке; △ — подготовленная, не запущенная","s2a_lbl_key2":"△ пунктиром — скопирована проходящей вилкой; ✕ — не подготовлена","s2a_lbl_key3":"светло-синие линии — скопированная ДНК; красная рамка — не скопировано","s2a_lbl_foot":"Учебная модель, не карта хромосомы: места и время запуска заданы её правилами.","s2a_d_none":"не подготовлена","s2a_d_wait":"подготовлена, не запущена","s2a_d_passive":"скопирована проходящей вилкой","s2a_d_fired":"запущена","s2a_d_mask":"не показано","s2a_r_done":"Участок скопирован к концу S-фазы","s2a_r_done_s":"окно S-фазы в модели — {T} условных шагов","s2a_v_done":"полностью, к шагу {t}","s2a_v_gap":"нет: не скопировано {g} из {L} ед.","s2a_r_close":"Чем закрыт промежуток у остановленной вилки","s2a_v_close_normal":"задержек нет — вилки встретились","s2a_v_close_opposite":"встречной вилкой точки Б","s2a_v_close_reserve":"вилками резервной точки","s2a_v_close_none":"не закрыт","s2a_v_close_mask":"не показано","s2a_r_res":"Точки В и Г","s2a_r_res_s":"В — отметка 4; Г (отметка 12) — только при дальней точке Б","s2a_r_lic":"Подготовлено до S-фазы","s2a_v_lic":"в каждой клетке — A, В, Г, Б","s2a_r_fired":"Запущено в начале S-фазы","s2a_r_fired_s":"наборы условные","s2a_v_fired":"клетка {i}: {list}","s2a_r_fixed":"Есть ли точка, резервная во всех клетках","s2a_v_fixed_no":"в этом условном наборе — нет: каждая запущена хотя бы в одной клетке","s2a_cap_cells":"До S-фазы во всех четырёх клетках подготовлены одни и те же точки. В S-фазе в каждой клетке запустилась только часть из них, и в разных клетках — разная; остальные скопировали проходящие вилки.","s2a_cap_cells_z":"Подготовка (лицензирование) и запуск — разные события. Резервной точка бывает в конкретной клетке, а не навсегда: какие из подготовленных точек запустятся, во многом случайно; в клетке точки различаются вероятностью запуска.","s2a_cap_norm":"Вилки от A и Б встретились, участок скопирован к шагу {t}. Резервные точки, через которые прошла вилка, скопированы вместе с участком и в этой S-фазе уже не запустятся.","s2a_cap_norm_np":"Вилки от A и Б встретились, участок скопирован к шагу {t}. Точки В и Г в этой клетке не были подготовлены, но в обычном ходе они и не понадобились.","s2a_cap_norm_np_z":"Без задержек участок копируют вилки точек, запущенных в начале S-фазы.","s2a_cap_norm_z":"Подготовленных точек больше, чем запускается. Какие из них запустятся, а какие останутся резервными, в каждой клетке решается заново (режим «разные клетки»).","s2a_cap_one_opp":"Вилка от A остановилась, но встречная вилка от Б дошла до неё: участок скопирован к шагу {t}, позже, чем без задержки.","s2a_cap_one_opp_z":"Отсутствие резерва ещё не означает недокопированный участок: встречная вилка может закрыть промежуток, если успевает.","s2a_cap_one_res":"Вилка от A остановилась; в этой клетке ближайшая подготовленная точка запустилась и дала две вилки: одна дошла до остановленной, другая встретила вилку от Б. Участок скопирован к шагу {t}.","s2a_cap_one_res_z":"Резервная точка даёт новые вилки рядом с задержкой, но в клетке её запуск случаен и не обязателен. В этой модели остановленная вилка не возобновляется; в клетке остановленная вилка иногда может продолжить движение.","s2a_cap_one_fail":"Вилка от A остановилась, резервная точка не запустилась или не была подготовлена, а точка Б далеко: встречная вилка не успевает до конца S-фазы, часть участка остаётся нескопированной.","s2a_cap_one_fail_z":"Встречной вилки достаточно не всегда: важны расстояние и время.","s2a_cap_two_fail":"Обе встречные вилки остановились, резерв не сработал: промежуток между ними скопировать некому.","s2a_cap_two_fail_z":"Новую точку начала в S-фазе подготовить нельзя. Если остановленные вилки не возобновятся, скопировать промежуток в этой S-фазе может только точка, подготовленная заранее.","s2a_cap_two_res":"Обе встречные вилки остановились; в промежутке запустилась подготовленная точка {res}, её вилки скопировали промежуток к шагу {t}.","s2a_cap_two_res2":"Обе встречные вилки остановились; в промежутке запустились подготовленные точки {res}, их вилки скопировали промежуток к шагу {t}.","s2a_cap_two_res_z":"Помощь возможна, только если подготовленная точка лежит в нескопированном промежутке; в клетке это вероятно, но не гарантировано.","s2a_cap_mask":"Наблюдение к концу S-фазы — на схеме. Состояние резервных точек и переключатели пока не показаны.","s2a_cap_mask_z":"Сначала решите, какие причины совместимы с наблюдением.","s2a_tl_note":"Шкала — условные шаги модели, а не минуты; шаг 0 — до S-фазы. Последний этап шкалы совпадает со статичной схемой.","s2a_tl_step":"Шаг {k} из {m}","s2a_tl_g1":"До S-фазы точки A, Б и резервные точки подготовлены; ни одна ещё не запущена.","s2a_tl_g1_no":"До S-фазы подготовлены только A и Б; на месте В (Г) точка не подготовлена.","s2a_tl_start":"Начало S-фазы: в этой клетке запустились A и Б, от каждой расходятся две вилки.","s2a_tl_move":"Вилки продолжают движение; новые точки в S-фазе не подготавливаются.","s2a_tl_stall":"Вилка от A остановилась; участок за ней пока не скопирован (в модели вилка не возобновляется).","s2a_tl_stall2":"Остановились обе встречные вилки; промежуток между ними не скопирован (в модели вилки не возобновляются).","s2a_tl_fire":"Подготовленная точка в нескопированном промежутке запустилась и дала две вилки. В клетке это случайное, а не обязательное событие.","s2a_tl_nofire":"Подготовленная точка в промежутке в этой клетке не запустилась: запуск возможен, но не обязателен.","s2a_tl_noprep":"Подготовленной точки в промежутке нет, а новые точки в S-фазе не подготавливаются.","s2a_tl_passive":"Вилка прошла через резервную точку: точка скопирована и в этой S-фазе уже не запустится.","s2a_tl_done":"Вилки встретились: участок скопирован полностью.","s2a_tl_after":"Участок уже скопирован; S-фаза продолжается на других участках хромосомы.","s2a_tl_wait":"К промежутку не идёт ни одна вилка: скопировать его некому.","s2a_tl_gap":"Конец S-фазы: часть участка осталась нескопированной.","s2a_tl_c1":"До S-фазы в каждой клетке подготовлены одни и те же точки — A, В, Г и Б.","s2a_tl_c2":"S-фаза: в каждой клетке запустилась часть подготовленных точек, в разных клетках — разная.","s2a_take":"Точки начала подготавливаются до S-фазы, и их больше, чем запускается; какие из них запустятся, в каждой клетке во многом случайно. Подготовленные, но не запущенные точки копируются проходящими вилками и в той же S-фазе уже не запускаются. Если вилка остановилась, промежуток может закрыть встречная вилка — если успевает — или вилки резервной точки, если та в этой клетке запустится. Когда остановились обе встречные вилки и они не возобновляются, помочь может только подготовленная точка между ними. Резерв повышает вероятность полного копирования, но не гарантирует его. Что происходит с остановленной вилкой и какие сигналы при этом возникают, рассматривает курс «Молекулярная биология»."},"notes":["Вилки встретились; точка В скопирована проходящей вилкой и в этой клетке не запустилась.","Вилки встретились позже; точки В и Г скопированы проходящими вилками.","Одни и те же подготовленные точки в четырёх клетках: в каждой запустилась своя часть (наборы условные)."],"static":["Вилки встретились; точка В скопирована проходящей вилкой и в этой клетке не запустилась."]}},"level":"adv"},{"id":"dormant-rescue","section":1,"questions":[2],"title":"Как резервная точка начала помогает, если вилка остановилась?","keywords":["остановленная вилка","резервная точка начала","встречная вилка","полнота копирования"],"lead":["Уже известно: участок между двумя точками начала копируют вилки, идущие навстречу друг другу.","Новое: если вилка останавливается, промежуток за ней могут закрыть два разных механизма — встречная вилка или вилки резервной точки."],"mechanism":["[[T37|Вилка останавливается]], например при нехватке dNTP или встрече с препятствием на матрице.","Встречная вилка соседней точки начала продолжает движение и может дойти до остановленной.","Резервная точка, которая лежит в ещё не скопированном промежутке, может запуститься и дать две новые вилки — может, но не обязана. В этой модели остановленная вилка не возобновляется; в клетке остановленная вилка иногда может продолжить движение.","По простой расчётной модели авторов обзора: чем медленнее идут вилки, тем дольше подготовленные точки остаются нескопированными — и тем вероятнее, что какая-то из них запустится. В клетке запуск дополнительно регулируется."],"paragraphs":["Встречная вилка и резервная точка — разные способы закрыть промежуток. Не каждую встречную вилку следует считать «пробуждением резерва»: она пришла от точки начала, запущенной в обычном порядке.","Если изменить условие и отодвинуть соседнюю точку начала, встречной вилке понадобится больше времени. В модели при дальней точке Б и без резерва она не успевает до конца S-фазы, и часть участка остаётся нескопированной.","Как это узнали: в клетках, где вилки замедлили, работает больше точек начала, и расположены они ближе друг к другу. Клетки с уменьшенным количеством подготовленных точек в обычных условиях реплицируются почти нормально, но при замедлении вилок запускают меньше резервных точек, медленнее проходят S-фазу и хуже выживают.","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: скорость вилок задана постоянной (1 условная единица за шаг) — это правило модели, а не свойство клетки: в клетке скорость вилок меняется, и единой формулы её связи с числом запусков нет. Окно S-фазы — 10 шагов. Переключатель задаёт исход для одной клетки: резервная точка у остановленной вилки на шаге 3 запустилась или нет; в клетке её запуск вероятностный. Остановленная вилка в модели не возобновляется.","sources":["Blow2011","Alver2014","Saxena2022"],"quiz":{"id":"S7-L34","question":"Вилка остановилась, соседняя точка начала близко, резервных точек нет. Что, скорее всего, произойдёт с промежутком за остановленной вилкой?","options":[{"id":"S7-L34-1","text":"Его скопирует встречная вилка, если успеет до конца S-фазы","correct":true,"feedback":"Встречная вилка — первый способ закрыть промежуток; её успех зависит от расстояния и времени."},{"id":"S7-L34-2","text":"Он останется нескопированным: без резерва помочь некому","correct":false,"feedback":"Встречная вилка продолжает движение и может дойти до остановленной."},{"id":"S7-L34-3","text":"В S-фазе на этом месте будет подготовлена новая точка начала","correct":false,"feedback":"Новые точки в S-фазе не подготавливаются."}]},"widget":{"kind":"dna","title":"","s":{"title":"Остановилась одна вилка","status":"Учебная схема · к концу S-фазы · единицы условные","modes_label":"Чем закрыт промежуток","modes":["встречная вилка","резервная точка","точка Б далеко, резерва нет"],"scene":"a2","args":[["near","one","yes","no"],["near","one","yes","yes"],["far","one","no","no"]],"L":{"s2a_view":"Что показать","s2a_view_one":"одна клетка","s2a_view_cells":"разные клетки","s2a_vnote":"«Разные клетки»: задержек нет — сравниваются только наборы точек, запущенных в начале S-фазы. Остальные переключатели относятся к одной клетке.","s2a_geom":"Соседняя точка начала Б","s2a_geom_near":"близко (8 ед.)","s2a_geom_far":"далеко (16 ед.)","s2a_stall":"Ход вилок","s2a_stall_none":"без задержек","s2a_stall_one":"остановилась вилка от A","s2a_stall_two":"остановились обе встречные","s2a_prep":"Точки В (и Г) подготовлены до S-фазы","s2a_prep_yes":"да","s2a_prep_no":"нет","s2a_fire":"Резервная точка у остановленной вилки — в этой клетке","s2a_fire_yes":"запустилась","s2a_fire_no":"не запустилась","s2a_fnote2":"Вилки не останавливались — исход запуска у остановленной вилки здесь не нужен: точки, через которые прошла вилка, в этой S-фазе уже не запустятся.","s2a_fnote":"Резервные точки не подготовлены до S-фазы — запускать нечего; в S-фазе новые точки начала не подготавливаются.","s2a_lbl_head":"учебная схема · к концу S-фазы (шаг {T}) · единицы условные","s2a_lbl_B":"Б","s2a_lbl_head_g1":"учебная схема · до S-фазы: точки подготовлены, ни одна не запущена","s2a_lbl_head_t":"учебная схема · шаг {k} из {T} · единицы условные","s2a_lbl_head_cells":"учебная схема · одни и те же точки в четырёх клетках · S-фаза","s2a_lbl_head_cells_g1":"учебная схема · одни и те же точки в четырёх клетках · до S-фазы","s2a_c_g1":"до S-фазы, все клетки","s2a_c_cell":"S-фаза, клетка {i}","s2a_c_key1":"▲ — запущена в этой клетке; △ — подготовлена до S-фазы","s2a_c_key2":"△ пунктиром — в этой клетке не запущена: её скопировала проходящая вилка","s2a_lbl_foot_cells":"Наборы условные; одинаковая подготовка во всех клетках — упрощение.","s2a_lbl_stall":"вилка остановилась","s2a_lbl_out":"за точкой Б — соседний участок","s2a_lbl_len":"моделируемый участок между A и Б: {L} условных единиц","s2a_lbl_key1":"▲ — запущенная в этой клетке; △ — подготовленная, не запущенная","s2a_lbl_key2":"△ пунктиром — скопирована проходящей вилкой; ✕ — не подготовлена","s2a_lbl_key3":"светло-синие линии — скопированная ДНК; красная рамка — не скопировано","s2a_lbl_foot":"Учебная модель, не карта хромосомы: места и время запуска заданы её правилами.","s2a_d_none":"не подготовлена","s2a_d_wait":"подготовлена, не запущена","s2a_d_passive":"скопирована проходящей вилкой","s2a_d_fired":"запущена","s2a_d_mask":"не показано","s2a_r_done":"Участок скопирован к концу S-фазы","s2a_r_done_s":"окно S-фазы в модели — {T} условных шагов","s2a_v_done":"полностью, к шагу {t}","s2a_v_gap":"нет: не скопировано {g} из {L} ед.","s2a_r_close":"Чем закрыт промежуток у остановленной вилки","s2a_v_close_normal":"задержек нет — вилки встретились","s2a_v_close_opposite":"встречной вилкой точки Б","s2a_v_close_reserve":"вилками резервной точки","s2a_v_close_none":"не закрыт","s2a_v_close_mask":"не показано","s2a_r_res":"Точки В и Г","s2a_r_res_s":"В — отметка 4; Г (отметка 12) — только при дальней точке Б","s2a_r_lic":"Подготовлено до S-фазы","s2a_v_lic":"в каждой клетке — A, В, Г, Б","s2a_r_fired":"Запущено в начале S-фазы","s2a_r_fired_s":"наборы условные","s2a_v_fired":"клетка {i}: {list}","s2a_r_fixed":"Есть ли точка, резервная во всех клетках","s2a_v_fixed_no":"в этом условном наборе — нет: каждая запущена хотя бы в одной клетке","s2a_cap_cells":"До S-фазы во всех четырёх клетках подготовлены одни и те же точки. В S-фазе в каждой клетке запустилась только часть из них, и в разных клетках — разная; остальные скопировали проходящие вилки.","s2a_cap_cells_z":"Подготовка (лицензирование) и запуск — разные события. Резервной точка бывает в конкретной клетке, а не навсегда: какие из подготовленных точек запустятся, во многом случайно; в клетке точки различаются вероятностью запуска.","s2a_cap_norm":"Вилки от A и Б встретились, участок скопирован к шагу {t}. Резервные точки, через которые прошла вилка, скопированы вместе с участком и в этой S-фазе уже не запустятся.","s2a_cap_norm_np":"Вилки от A и Б встретились, участок скопирован к шагу {t}. Точки В и Г в этой клетке не были подготовлены, но в обычном ходе они и не понадобились.","s2a_cap_norm_np_z":"Без задержек участок копируют вилки точек, запущенных в начале S-фазы.","s2a_cap_norm_z":"Подготовленных точек больше, чем запускается. Какие из них запустятся, а какие останутся резервными, в каждой клетке решается заново (режим «разные клетки»).","s2a_cap_one_opp":"Вилка от A остановилась, но встречная вилка от Б дошла до неё: участок скопирован к шагу {t}, позже, чем без задержки.","s2a_cap_one_opp_z":"Отсутствие резерва ещё не означает недокопированный участок: встречная вилка может закрыть промежуток, если успевает.","s2a_cap_one_res":"Вилка от A остановилась; в этой клетке ближайшая подготовленная точка запустилась и дала две вилки: одна дошла до остановленной, другая встретила вилку от Б. Участок скопирован к шагу {t}.","s2a_cap_one_res_z":"Резервная точка даёт новые вилки рядом с задержкой, но в клетке её запуск случаен и не обязателен. В этой модели остановленная вилка не возобновляется; в клетке остановленная вилка иногда может продолжить движение.","s2a_cap_one_fail":"Вилка от A остановилась, резервная точка не запустилась или не была подготовлена, а точка Б далеко: встречная вилка не успевает до конца S-фазы, часть участка остаётся нескопированной.","s2a_cap_one_fail_z":"Встречной вилки достаточно не всегда: важны расстояние и время.","s2a_cap_two_fail":"Обе встречные вилки остановились, резерв не сработал: промежуток между ними скопировать некому.","s2a_cap_two_fail_z":"Новую точку начала в S-фазе подготовить нельзя. Если остановленные вилки не возобновятся, скопировать промежуток в этой S-фазе может только точка, подготовленная заранее.","s2a_cap_two_res":"Обе встречные вилки остановились; в промежутке запустилась подготовленная точка {res}, её вилки скопировали промежуток к шагу {t}.","s2a_cap_two_res2":"Обе встречные вилки остановились; в промежутке запустились подготовленные точки {res}, их вилки скопировали промежуток к шагу {t}.","s2a_cap_two_res_z":"Помощь возможна, только если подготовленная точка лежит в нескопированном промежутке; в клетке это вероятно, но не гарантировано.","s2a_cap_mask":"Наблюдение к концу S-фазы — на схеме. Состояние резервных точек и переключатели пока не показаны.","s2a_cap_mask_z":"Сначала решите, какие причины совместимы с наблюдением.","s2a_tl_note":"Шкала — условные шаги модели, а не минуты; шаг 0 — до S-фазы. Последний этап шкалы совпадает со статичной схемой.","s2a_tl_step":"Шаг {k} из {m}","s2a_tl_g1":"До S-фазы точки A, Б и резервные точки подготовлены; ни одна ещё не запущена.","s2a_tl_g1_no":"До S-фазы подготовлены только A и Б; на месте В (Г) точка не подготовлена.","s2a_tl_start":"Начало S-фазы: в этой клетке запустились A и Б, от каждой расходятся две вилки.","s2a_tl_move":"Вилки продолжают движение; новые точки в S-фазе не подготавливаются.","s2a_tl_stall":"Вилка от A остановилась; участок за ней пока не скопирован (в модели вилка не возобновляется).","s2a_tl_stall2":"Остановились обе встречные вилки; промежуток между ними не скопирован (в модели вилки не возобновляются).","s2a_tl_fire":"Подготовленная точка в нескопированном промежутке запустилась и дала две вилки. В клетке это случайное, а не обязательное событие.","s2a_tl_nofire":"Подготовленная точка в промежутке в этой клетке не запустилась: запуск возможен, но не обязателен.","s2a_tl_noprep":"Подготовленной точки в промежутке нет, а новые точки в S-фазе не подготавливаются.","s2a_tl_passive":"Вилка прошла через резервную точку: точка скопирована и в этой S-фазе уже не запустится.","s2a_tl_done":"Вилки встретились: участок скопирован полностью.","s2a_tl_after":"Участок уже скопирован; S-фаза продолжается на других участках хромосомы.","s2a_tl_wait":"К промежутку не идёт ни одна вилка: скопировать его некому.","s2a_tl_gap":"Конец S-фазы: часть участка осталась нескопированной.","s2a_tl_c1":"До S-фазы в каждой клетке подготовлены одни и те же точки — A, В, Г и Б.","s2a_tl_c2":"S-фаза: в каждой клетке запустилась часть подготовленных точек, в разных клетках — разная.","s2a_take":"Точки начала подготавливаются до S-фазы, и их больше, чем запускается; какие из них запустятся, в каждой клетке во многом случайно. Подготовленные, но не запущенные точки копируются проходящими вилками и в той же S-фазе уже не запускаются. Если вилка остановилась, промежуток может закрыть встречная вилка — если успевает — или вилки резервной точки, если та в этой клетке запустится. Когда остановились обе встречные вилки и они не возобновляются, помочь может только подготовленная точка между ними. Резерв повышает вероятность полного копирования, но не гарантирует его. Что происходит с остановленной вилкой и какие сигналы при этом возникают, рассматривает курс «Молекулярная биология»."},"notes":["Промежуток закрыла встречная вилка от Б — к шагу 6.","Запустилась точка В: её вилки закрыли промежуток к шагу 5.","Точка Б далеко, резерва нет: к концу S-фазы участок 2–6 не скопирован."],"static":["Промежуток закрыла встречная вилка от Б — к шагу 6."]}},"level":"adv"},{"id":"reserve-limits","section":1,"questions":[2],"title":"Когда резерв незаменим, а когда и он не помогает?","keywords":["две остановленные вилки","плотность точек начала","недокопированный участок","границы модели"],"lead":["Уже известно: одну остановленную вилку может заменить встречная.","Новое: если обе встречные вилки остановились и не возобновляют движение, начать копирование промежутка в той же S-фазе может только точка начала, подготовленная внутри него заранее."],"mechanism":["Две встречные вилки остановились — если они не возобновятся, к промежутку между ними больше не идёт ни одна вилка.","Новую точку начала в S-фазе подготовить нельзя.","Если в промежутке есть ещё не скопированная подготовленная точка, она может запуститься и скопировать промежуток.","Если такой точки нет или она не запустилась, промежуток к концу S-фазы остаётся нескопированным."],"paragraphs":["Отсюда смысл избытка подготовленных точек: чем их больше, тем вероятнее, что между двумя остановленными вилками найдётся хотя бы одна. В расчётной модели репликации участка хромосомы защиту от двойной остановки определяет плотность подготовленных точек, а не частота их запуска.","Обратная задача. Наблюдение «к концу S-фазы между двумя отметками остался нескопированный участок» совместимо с несколькими причинами: резервная точка не была подготовлена или была подготовлена, но не запустилась. Различить их помогло бы независимое наблюдение — состояние точки до начала S-фазы.","Модель не обещает универсальной помощи: резервной точки в нужном месте может не оказаться, её запуск вероятностный. У мышей с уменьшенным количеством подготовленных точек чаще возникают повреждения ДНК и опухоли — это показывает значение резерва для сохранности генома, но не делает его гарантией.","Резервная точка — способ начать новые вилки внутри такого промежутка, но не единственный способ его закрыть: в клетке остановленная вилка иногда возобновляет движение, а недокопированные участки иногда достраиваются позже. Как это происходит, рассматривает курс «Молекулярная биология».","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: одна рез
