 id="ns-unwinding"><div class="eyebrow">От репликационной вилки к клетке · шаг 24 из 30</div><h2>Расплетание: хеликаза, SSB и топоизомераза</h2><p class="lead">Чтобы цепи стали матрицами, двойную спираль нужно расплести, одноцепочечную ДНК — удержать в выпрямленном виде, а напряжение впереди вилки — снять. Эти три операции выполняют три разных белка.</p><div class="note"><strong>Что показывает схема.</strong> Без SSB на матрице отстающей цепи образуются шпильки; новый фрагмент не начат.</div><ol class="mech"><li>Хеликаза — кольцо из шести субъединиц — движется по одной цепи и, гидролизуя АТФ, раздвигает пары оснований; эукариотическая хеликаза CMG движется по матрице ведущей цепи.</li><li>SSB кооперативно связываются с одноцепочечной ДНК: каждая молекула предпочитает садиться рядом с уже связанной. Так они выпрямляют матрицу и не дают образоваться шпилькам из случайно комплементарных участков.</li><li>Шпильки особенно часты на матрице отстающей цепи; если их не убрать, они мешают ДНК-полимеразе.</li><li>Расплетание закручивает ДНК впереди вилки; топоизомераза I временно разрывает одну цепь и даёт ДНК повернуться, топоизомераза II разрывает обе цепи.</li></ol><p>SSB не расплетают ДНК: они связываются с одноцепочечной ДНК, которую образовала хеликаза. Поэтому без SSB вилка расплетена, но матрица отстающей цепи образует шпильки.</p><p>Топоизомеразы восстанавливают разорванную связь сами; в отличие от нуклеаз, они не оставляют разрывов.</p><div class="static-quiz"><h3>Что произойдёт с матрицей отстающей цепи без SSB?</h3><ol><li><b>А.</b> ДНК перестанет расплетаться <i>(неверный вариант)</i><br><span class="expl">Расплетает хеликаза; SSB связываются с уже расплетённой ДНК.</span></li><li><b>Б.</b> Впереди вилки накопится напряжение <i>(неверный вариант)</i><br><span class="expl">Напряжение снимает топоизомераза, а не SSB.</span></li><li><b>В.</b> Образуются шпильки, которые мешают полимеразе <i>(верный вариант)</i><br><span class="expl">SSB выпрямляют одноцепочечную ДНК; без них случайно комплементарные участки спариваются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>По учебнику; схема качественная.</p></details></article><article class="card print-unit" id="ns-missing-component"><div class="eyebrow">От репликационной вилки к клетке · шаг 25 из 30</div><h2>По промежуточному продукту определить, какого белка нет</h2><p class="lead">Каждый белок вилки выполняет одну операцию, и без него остаётся свой промежуточный продукт. По продукту можно определить, чего не хватает. Это сценарий практикума вопроса 4.</p><div class="note"><strong>Что показывает схема.</strong> Без нуклеаз: фрагменты полной длины с РНК-затравками, не сшиты.</div><ol class="mech"><li>Короткие отрезки ДНК, не доходящие до предыдущих фрагментов, и отставание ведущей цепи — без погрузчика зажима: полимераза без зажима быстро отходит от матрицы.</li><li>Фрагменты полной длины с РНК на 5′-концах, не сшитые между собой, — без нуклеаз удаления затравок.</li><li>Фрагменты без РНК, бреши заполнены, но цепь не сплошная — разрывы: нет ДНК-лигазы.</li><li>Шпильки на одноцепочечной матрице отстающей цепи и задержка нового фрагмента — без SSB.</li></ol><p>Чтобы определить отсутствующий белок, сначала посмотрите, сколько синтезировано (полная ли длина фрагментов), затем — есть ли РНК, затем — бреши или разрывы. Каждый следующий этап созревания возможен только после предыдущего: лигаза не сшивает фрагменты, пока не удалены затравки и не заполнены бреши.</p><h3>Чего модель не показывает</h3><p>Схема показывает исход отсутствия одного компонента в идеализированной вилке. В клетке без многих из этих белков репликация не идёт вовсе, и клетка погибает; промежуточные продукты наблюдают в экспериментах на очищенных белках или при частичном выключении белка.</p><div class="static-quiz"><h3>Фрагменты отстающей цепи полной длины, РНК удалена, бреши заполнены, но цепь не сплошная. Чего не хватает?</h3><ol><li><b>А.</b> ДНК-лигазы <i>(верный вариант)</i><br><span class="expl">Остались разрывы — не хватает одной фосфодиэфирной связи; её образует лигаза.</span></li><li><b>Б.</b> Нуклеаз удаления затравок <i>(неверный вариант)</i><br><span class="expl">Без нуклеаз на 5′-концах фрагментов осталась бы РНК.</span></li><li><b>В.</b> Погрузчика зажима <i>(неверный вариант)</i><br><span class="expl">Без погрузчика фрагменты были бы короткими, с брешами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Учебная модель по учебнику; числа и длины на схеме условные.</p></details></article><article class="card print-unit" id="ns-s-phase-2c4c"><div class="eyebrow">От репликационной вилки к клетке · шаг 26 из 30</div><h2>Что меняется в клетке за S-фазу: количество ДНК или число хромосом?</h2><p class="lead">Уже известно из семинара 6: клеточный цикл — G1, S, G2, митоз; в S-фазе копируется ДНК. Новое: связать работу реплисомы с тем, что происходит в клетке, — с количеством ДНК и строением хромосом.</p><div class="note"><strong>Что показывает схема.</strong> G1: 2c, 46 хромосом по одной хроматиде.</div><ol class="mech"><li>В G1 диплоидная соматическая клетка человека содержит 46 хромосом; каждая — одна <a href="#ns-g-S7-T42">хроматида</a>, одна двухцепочечная молекула ДНК. Количество ядерной ДНК — 2c.</li><li>В S-фазе каждая из 46 молекул копируется полуконсервативно; количество ДНК растёт от 2c к 4c.</li><li>В G2 — 4c и по-прежнему 46 хромосом, но каждая состоит из двух сестринских хроматид.</li><li>В митозе сестринские хроматиды расходятся, и каждая дочерняя клетка получает 46 хромосом по одной хроматиде — 2c.</li></ol><p>Удваивается <a href="#ns-g-S7-T45">количество ДНК</a>, а не число хромосом. Фраза «после S-фазы в клетке 92 хромосомы» смешивает два уровня: молекул ДНК (хроматид) после S-фазы 92, а хромосом — 46.</p><p>По количеству ДНК 2c нельзя отличить клетку в G1 от клетки в G0: в обоих состояниях ДНК не удвоена.</p><p>Репликация завершается до митоза: разделить можно только то, что уже скопировано.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Клетка человека прошла S-фазу и находится в G2. Сколько в ней хромосом и сколько молекул ядерной ДНК?</h3><ol><li><b>А.</b> 92 хромосомы и 92 молекулы ДНК <i>(неверный вариант)</i><br><span class="expl">Сестринские хроматиды остаются в одной хромосоме до их расхождения в митозе.</span></li><li><b>Б.</b> 46 хромосом и 46 молекул ДНК <i>(неверный вариант)</i><br><span class="expl">После S-фазы каждая молекула ДНК скопирована — их вдвое больше.</span></li><li><b>В.</b> 46 хромосом и 92 молекулы ДНК <i>(верный вариант)</i><br><span class="expl">Удвоились молекулы ДНК — по две сестринские хроматиды в каждой хромосоме; хромосом по-прежнему 46.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Нормальная диплоидная соматическая клетка человека; c — количество ДНК гаплоидного набора. Митохондриальная ДНК не учитывается.</p></details></article><article class="card print-unit" id="ns-tissue-states"><div class="eyebrow">От репликационной вилки к клетке · шаг 27 из 30</div><h2>Почему одним клеткам организма репликация нужна сейчас, а другим — нет?</h2><p class="lead">Уже известно: репликация ядерной ДНК — событие клеточного цикла. Новое: нужна ли репликация, зависит от состояния клетки и от того, обновляется ли ткань.</p><div class="note"><strong>Что показывает схема.</strong> Предшественники крови: многие клетки копируют ДНК.</div><ol class="mech"><li>Эпителий тонкой кишки обновляется постоянно: делящиеся клетки находятся в криптах, а дифференцированные клетки поднимаются на ворсинки и там уже не делятся.</li><li>Клетки крови постоянно образуются в костном мозге из делящихся клеток-предшественников.</li><li>Зрелые нейроны не делятся: они находятся вне цикла, в состоянии <a href="#ns-g-S7-T41">G0</a>, и ядерный геном не копируется.</li><li>Неделящаяся клетка не «выключена»: в ней идут транскрипция, синтез белка и репарация ДНК.</li></ol><p>В одном органе бывают и делящиеся, и неделящиеся клетки; поэтому нельзя приписывать всей ткани одно состояние или одну частоту деления.</p><p>Отсутствие репликации всего ядерного генома не означает, что клетка совсем не синтезирует ДНК. Как это узнали: в нейронах, полученных из стволовых клеток человека и больше не делящихся, меченые нуклеотиды за сутки встраивались в ДНК там, где шла репарация; чаще всего — примерно в 61 тысяче коротких участков, вместе занимающих около 1,6 % генома.</p><p>Стволовые клетки крови делятся редко, а часто делятся их потомки — клетки-предшественники; поэтому в модели «предшественники крови» — набор делящихся клеток.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Какое утверждение о зрелом нейроне верно?</h3><ol><li><b>А.</b> Геном не копируется, но транскрипция и репарация ДНК идут <i>(верный вариант)</i><br><span class="expl">Отсутствие репликации не означает отсутствия других процессов с ДНК.</span></li><li><b>Б.</b> ДНК-полимеразы и dNTP нейрону больше не нужны совсем <i>(неверный вариант)</i><br><span class="expl">При репарации ДНК-полимераза достраивает участки ДНК — для этого нужны и фермент, и dNTP.</span></li><li><b>В.</b> Нейрон в G0 не синтезирует ни РНК, ни белки <i>(неверный вариант)</i><br><span class="expl">G0 — состояние вне клеточного цикла, а не отсутствие жизнедеятельности.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1126/science.abb9032">Reid D. A., Reed P. J., Schlachetzki J. C. M. et al. Incorporation of a nucleoside analog maps genome repair sites in postmitotic human neurons. Science. 2021;372:91–94</a></li></ul><p>Три примера клеток — иллюстрации, а не универсальные правила; условные наборы клеток не являются измерениями тканей. Как переход из фазы в фазу регулируется — семинар 6 и курс «Молекулярная биология».</p></details></article><article class="card print-unit" id="ns-dna-distribution"><div class="eyebrow">От репликационной вилки к клетке · шаг 28 из 30</div><h2>Что можно и чего нельзя узнать из распределения клеток по количеству ДНК?</h2><p class="lead">Уже известно: в G1 — 2c, в S — между 2c и 4c, в G2 и митозе — 4c. Новое: по снимку набора клеток можно сказать, сколько клеток копирует ДНК сейчас, но не всё о том, как ткань обновляется.</p><div class="note"><strong>Что показывает схема.</strong> Крипта: 3 клетки в S-фазе, 2 — с 4c.</div><ol class="mech"><li><a href="#ns-g-S7-T47">Распределение</a> показывает, сколько клеток имеют 2c, сколько — промежуточное количество, сколько — 4c.</li><li>Клетки с промежуточным количеством ДНК сейчас в S-фазе; с 4c — в G2 или митозе.</li><li>Клетки с 2c могут быть и в G1, и в G0: по количеству ДНК их не различить.</li><li>Доля клеток в S-фазе зависит и от доли делящихся клеток, и от длительности S-фазы.</li></ol><p>Поэтому по одному снимку нельзя рассчитать скорость обновления ткани: для этого нужны длительности фаз и наблюдение за клетками во времени.</p><p>Обратная задача: тип ткани не указан. Все клетки набора имеют 2c ДНК. В рамках учебной модели это означает, что ни у одной клетки сейчас нет промежуточного между 2c и 4c количества ДНК, характерного для S-фазы. Однако по одному количеству ДНК нельзя отличить G0 от G1 и определить, какие клетки вступят в S-фазу и будут делиться позднее.</p><p>Как это узнали: количество ДНК в каждой клетке измеряют по яркости красителя, который связывается с ДНК. Как устроен этот метод, для решения задачи знать не нужно.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>В наборе клеток крипты 3 из 12 клеток в S-фазе. Какой вывод корректен?</h3><ol><li><b>А.</b> Эпителий кишки обновляется на четверть каждые сутки <i>(неверный вариант)</i><br><span class="expl">Доля клеток в S-фазе не равна доле обновления за сутки: важны длительности фаз.</span></li><li><b>Б.</b> Четверть клеток копирует ДНК; скорость обновления по снимку не узнать <i>(верный вариант)</i><br><span class="expl">Снимок даёт доли клеток в один момент, а не время.</span></li><li><b>В.</b> Остальные 9 клеток набора не делятся и в цикл не вступят <i>(неверный вариант)</i><br><span class="expl">Клетки с 2c могут быть в G1, а клетки с 4c — в G2 или митозе: они тоже делящиеся.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Условные наборы из 12 клеток; числа подобраны для примера и не являются измерениями тканей.</p></details></article><article class="card print-unit" id="ns-system-map"><div class="eyebrow">От репликационной вилки к клетке · шаг 29 из 30</div><h2>Как клетка завершает копирование ДНК: карта зависимостей</h2><p class="lead">Уже известно из четырёх продвинутых шагов: синтез ограничивают субстрат, работа вилок, созревание цепей и состояние клетки. Новое: свести их в одну карту и увидеть, что одинаковый итог может иметь разные причины.</p><div class="note"><strong>Что показывает схема.</strong> Нарушений нет: дочерние молекулы готовы.</div><ol class="mech"><li>Ресурсы (dNTP) и подготовленные до S-фазы точки начала — условия работы вилок.</li><li>Работа вилок даёт новые цепи, которые затем созревают.</li><li>Готовые, непрерывные дочерние молекулы — в норме условие перехода клетки к митозу.</li><li>Нужна ли репликация вообще, зависит от того, находится ли клетка в цикле.</li></ol><p>Стрелки карты — зависимости, а не последовательность реакций: запас dNTP и работа вилок существуют одновременно, точки начала подготавливаются до S-фазы, а созревание фрагментов идёт вслед за вилкой.</p><p>Незавершённое копирование — общий итог разных ограничений: нехватки dNTP, остановки вилок без резерва, незавершённого созревания. Чтобы назвать причину, нужно второе, различающее наблюдение: где остановился синтез и какой нуклеотид там нужен; есть ли нескопированный промежуток и были ли рядом подготовленные точки; что осталось в новой цепи.</p><p>Скопировать — ещё не значит скопировать без ошибок. Насколько точно копируется ДНК и как исправляются ошибки — семинар 8.</p><p>Карта есть и в практикуме: уровень «Продвинутый», внизу страницы, с итоговым вопросом.</p><div class="static-quiz"><h3>В двух моделях наблюдается незавершённое копирование ДНК. Почему по одному этому наблюдению нельзя назвать единственную причину?</h3><ol><li><b>А.</b> Причина всегда одна — неисправный фермент <i>(неверный вариант)</i><br><span class="expl">В моделях 1–3 все ферменты исправны, а копирование всё равно не завершается.</span></li><li><b>Б.</b> Незавершённое копирование всегда означает, что клетка вне цикла <i>(неверный вариант)</i><br><span class="expl">Клетка вне цикла не начинает репликацию вовсе — это другое наблюдение.</span></li><li><b>В.</b> Один итог дают разные ограничения; их различают по промежуточным продуктам <i>(верный вариант)</i><br><span class="expl">Нехватка dNTP, остановка вилок без резерва и незавершённое созревание приводят к одному итогу разными путями.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-7.html#q1">Вопрос 1 →</a> <a href="seminar-7.html#q2">Вопрос 2 →</a> <a href="seminar-7.html#q3">Вопрос 3 →</a> <a href="seminar-7.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.004">Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314</a></li><li><a href="https://doi.org/10.1016/j.tibs.2011.05.002">Blow J. J., Ge X. Q., Jackson D. A. How dormant origins promote complete genome replication. Trends Biochem Sci. 2011;36:405–414</a></li></ul><p>Карта условная: она не показывает скоростей и вероятностей, только зависимости между условиями четырёх моделей.</p></details></article><article class="card print-unit" id="ns-exit-fidelity"><div class="eyebrow">От репликационной вилки к клетке · шаг 30 из 30</div><h2>Что дальше: насколько точно копируется ДНК</h2><p class="lead">Реплисома копирует обе цепи. Следующий вопрос — насколько точно. Комплементарность задаёт, какой нуклеотид встанет напротив матрицы; как исправляются ошибки, разбирается на следующем семинаре.</p><div class="note"><strong>Что показывает схема.</strong> Работающая вилка: обе цепи копируются, фрагменты созревают за вилкой; насколько точно копируется ДНК — на семинаре 8.</div><ol class="mech"><li>Точность копирования складывается из нескольких уровней: выбор нуклеотида по комплементарности, исправление ошибок самой полимеразой и исправление ошибок после репликации.</li><li>Почему затравка — РНК и почему её удаляют, тоже связано с точностью: этот вопрос продолжается на семинаре 8.</li><li>Почему копирование концов линейных хромосом представляет отдельную проблему, разберём в семинаре 8.</li></ol><p>Следующий семинар курса — «Сохранность генома: три уровня точности и цена ошибки».</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как после репликации полуметилированная ДНК снова становится метилированной на обеих цепях — <a href="https://fresll.github.io/molbio/seminar-6-route.html#maintenance">МБ, семинар 6, шаг 3</a>.</p><div class="static-quiz"><h3>Какой вопрос о репликации остаётся на следующий семинар?</h3><ol><li><b>А.</b> Почему отстающая цепь синтезируется фрагментами <i>(неверный вариант)</i><br><span class="expl">Это разобрано в разделе 3 этого семинара.</span></li><li><b>Б.</b> Как исправляются ошибки копирования <i>(верный вариант)</i><br><span class="expl">Корректура и репарация — тема семинара 8.</span></li><li><b>В.</b> Откуда начинается репликация <i>(неверный вариант)</i><br><span class="expl">Точки начала разобраны в разделе 2 этого семинара.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Обзорный шаг; подробности — на семинаре 8.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S7-T01"><dt>Матрица</dt><dd>Цепь ДНК, по которой строится новая цепь: напротив каждого её основания встаёт комплементарный нуклеотид. При репликации матрицей служит каждая из двух родительских цепей.</dd></div><div id="ns-g-S7-T02"><dt>Новая (дочерняя) цепь ДНК</dt><dd>Цепь, которую ДНК-полимераза строит по матрице в направлении 5′→3′; она комплементарна и антипараллельна матрице.</dd></div><div id="ns-g-S7-T03"><dt>Затравка (праймер)</dt><dd>Короткий участок нуклеиновой кислоты, спаренный с матрицей, со свободным 3′-OH, к которому ДНК-полимераза присоединяет первый нуклеотид. При репликации затравки — короткие молекулы РНК, их синтезирует праймаза.</dd></div><div id="ns-g-S7-T04"><dt>Аналог нуклеотида без 3′-OH</dt><dd>Нуклеотид, у которого в сахаре нет 3′-гидроксильной группы (например, дидезоксинуклеотид). Он встаёт напротив комплементарного основания, но следующий нуклеотид присоединить нельзя, и цепь обрывается.</dd></div><div id="ns-g-S7-T05"><dt>Дезоксирибонуклеозидтрифосфаты (dNTP)</dt><dd>dATP, dTTP, dGTP и dCTP — субстраты ДНК-полимеразы. При присоединении нуклеотида к цепи отщепляется пирофосфат, и в цепи остаётся один фосфат.</dd></div><div id="ns-g-S7-T06"><dt>Водородные связи пар оснований</dt><dd>Связи между основаниями двух цепей: в паре A–T две, в паре G–C три. Они определяют, какие основания образуют пару (комплементарность).</dd></div><div id="ns-g-S7-T07"><dt>ДНК-полимераза</dt><dd>Фермент, который присоединяет дезоксирибонуклеотиды к 3′-OH растущей цепи по матрице; синтезирует цепь только в направлении 5′→3′ и не начинает её без затравки.</dd></div><div id="ns-g-S7-T11"><dt>Реплисома</dt><dd>Комплекс белков, работающий в репликационной вилке: хеликаза, ДНК-полимеразы, праймаза, зажим и его погрузчик, белки, связывающие одноцепочечную ДНК, и другие белки, которые к ним присоединяются.</dd></div><div id="ns-g-S7-T13"><dt>Двойная спираль (дуплекс)</dt><dd>Две антипараллельные комплементарные цепи ДНК, закрученные вокруг общей оси; основания внутри, сахаро-фосфатный остов снаружи.</dd></div><div id="ns-g-S7-T14"><dt>Точка начала репликации (ориджин)</dt><dd>Участок ДНК, где начинается репликация: здесь собираются белки инициации и образуются две репликационные вилки. У эукариот точки начала узнаёт комплекс ORC.</dd></div><div id="ns-g-S7-T15"><dt>Пузырёк репликации</dt><dd>Участок между двумя вилками, расходящимися от одной точки начала: внутри него ДНК уже скопирована, снаружи — родительская двойная спираль.</dd></div><div id="ns-g-S7-T16"><dt>Репликационная вилка</dt><dd>Y-образная область, где родительская двойная спираль расплетается и обе цепи копируются; движется вдоль ДНК вместе с комплексом белков — реплисомой.</dd></div><div id="ns-g-S7-T17"><dt>Репликон</dt><dd>Участок ДНК, который копируется от одной точки начала репликации.</dd></div><div id="ns-g-S7-T18"><dt>ДНК-хеликаза</dt><dd>Фермент, который движется по ДНК и разделяет цепи двойной спирали за счёт гидролиза АТФ. У эукариот репликативная хеликаза — комплекс CMG (Cdc45–MCM–GINS).</dd></div><div id="ns-g-S7-T19"><dt>Белки, связывающие одноцепочечную ДНК (SSB; у эукариот RPA)</dt><dd>Белки, которые кооперативно связываются с одноцепочечной ДНК, выпрямляют её и не дают образовываться шпилькам и восстанавливаться двойной спирали.</dd></div><div id="ns-g-S7-T20"><dt>Праймаза</dt><dd>РНК-полимераза, которая синтезирует короткие РНК-затравки на матрице и начинает синтез без готовой затравки (ей не нужен готовый 3′-конец). У эукариот работает в комплексе с ДНК-полимеразой α, которая удлиняет затравку короткой ДНК.</dd></div><div id="ns-g-S7-T21"><dt>Скользящий зажим (PCNA)</dt><dd>PCNA — ядерный антиген пролиферирующих клеток. Белковое кольцо, охватывающее ДНК и удерживающее полимеразу на матрице при движении; освобождает полимеразу, когда та заканчивает фрагмент и доходит до предыдущего.</dd></div><div id="ns-g-S7-T22"><dt>Погрузчик зажима (RFC)</dt><dd>RFC — репликационный фактор C. Белковый комплекс, который размыкает кольцо зажима и надевает его на ДНК у конца затравки, гидролизуя АТФ.</dd></div><div id="ns-g-S7-T23"><dt>Нуклеазы удаления затравки</dt><dd>Ферменты, которые удаляют РНК-затравки фрагментов Оказаки. У бактерий затравку удаляют нуклеазы, узнающие РНК в гибриде РНК–ДНК; у эукариот полимераза δ, достраивая следующий фрагмент, отгибает затравку в одноцепочечный лоскут, и его срезает флэп-эндонуклеаза FEN1.</dd></div><div id="ns-g-S7-T24"><dt>ДНК-лигаза</dt><dd>Фермент, который соединяет 3′-OH одного фрагмента с 5′-фосфатом соседнего фосфодиэфирной связью; у эукариот использует энергию АТФ.</dd></div><div id="ns-g-S7-T25"><dt>ДНК-топоизомераза</dt><dd>Фермент, который снимает напряжение витков двойной спирали впереди вилки, временно разрывая и снова соединяя одну (тип I) или обе (тип II) цепи.</dd></div><div id="ns-g-S7-T26"><dt>Разрыв цепи</dt><dd>Отсутствие одной фосфодиэфирной связи между соседними нуклеотидами одной цепи; все нуклеотиды на месте. Разрыв сшивает ДНК-лигаза.</dd></div><div id="ns-g-S7-T27"><dt>Фрагмент Оказаки</dt><dd>Короткий отрезок новой ДНК отстающей цепи с РНК-затравкой на 5′-конце; у эукариот 100–200 нуклеотидов, у бактерий 1000–2000.</dd></div><div id="ns-g-S7-T28"><dt>Ведущая цепь</dt><dd>Новая цепь, которая растёт в направлении движения вилки и синтезируется непрерывно.</dd></div><div id="ns-g-S7-T29"><dt>Отстающая цепь</dt><dd>Новая цепь, которая растёт против направления движения вилки и синтезируется короткими фрагментами Оказаки.</dd></div><div id="ns-g-S7-T30"><dt>ДНК-полимераза α</dt><dd>Полимераза, связанная с праймазой: удлиняет РНК-затравку коротким участком ДНК (около 20 нуклеотидов); корректирующей активности у неё нет.</dd></div><div id="ns-g-S7-T31"><dt>ДНК-полимераза δ</dt><dd>Основная полимераза отстающей цепи у эукариот: удлиняет затравки вместе с зажимом PCNA и при подходе к предыдущему фрагменту вытесняет его 5′-конец.</dd></div><div id="ns-g-S7-T32"><dt>ДНК-полимераза ε</dt><dd>Основная полимераза ведущей цепи у эукариот, связанная с хеликазой CMG.</dd></div><div id="ns-g-S7-T35"><dt>Запас dNTP</dt><dd>Свободные dATP, dTTP, dGTP и dCTP в клетке, из которых ДНК-полимераза строит новую цепь. Для синтеза нужен каждый из четырёх: недостающий нуклеотид другим не заменяется без ошибки. Нехватка dNTP замедляет движение репликационных вилок.</dd></div><div id="ns-g-S7-T36"><dt>Резервная точка начала репликации</dt><dd>Точка начала, подготовленная к запуску до S-фазы, которая в данной клетке в начале S-фазы не запустилась. Если её скопирует проходящая вилка, в этой S-фазе она уже не запустится. Если соседняя вилка задержалась, а точка ещё не скопирована, она может запуститься и дать две новые вилки, но не обязательно. Резервной точка бывает не навсегда: какие из подготовленных точек запустятся, во многом случайно, и в другой клетке та же точка может работать. В S-фазе новые точки начала не подготавливаются.</dd></div><div id="ns-g-S7-T37"><dt>Остановленная репликационная вилка</dt><dd>Вилка, которая перестала продвигаться — например, при нехватке dNTP или встрече с препятствием на матрице. Нескопированный участок за ней может закрыть встречная вилка или вилки резервной точки начала.</dd></div><div id="ns-g-S7-T39"><dt>Брешь в новой цепи</dt><dd>Промежуток в новой цепи, где нет нуклеотидов, — например, после удаления РНК-затравки. Брешь заполняет ДНК-полимераза; лигаза соединяет только соседние нуклеотиды, между которыми промежутка нет.</dd></div><div id="ns-g-S7-T41"><dt>Состояние G0</dt><dd>Состояние клетки вне клеточного цикла: клетка не готовится к делению, ядерная ДНК не копируется (2c). Многие клетки могут вернуться из G0 в цикл; зрелые нейроны и клетки ворсинки кишки не делятся.</dd></div><div id="ns-g-S7-T42"><dt>Хроматида</dt><dd>Одна двухцепочечная молекула ДНК хромосомы вместе с белками. После S-фазы хромосома состоит из двух сестринских хроматид — двух одинаковых молекул ДНК, полученных при репликации.</dd></div><div id="ns-g-S7-T45"><dt>Количество ядерной ДНК (c)</dt><dd>c — количество ДНК гаплоидного набора хромосом. В диплоидной соматической клетке человека в G1 и G0 — 2c, после S-фазы (G2, митоз до расхождения хроматид) — 4c, в S-фазе — между 2c и 4c.</dd></div><div id="ns-g-S7-T47"><dt>Распределение клеток по количеству ДНК</dt><dd>Число клеток набора с 2c, с промежуточным количеством и с 4c в один момент. По нему видно, сколько клеток сейчас в S-фазе и в G2 или митозе, но нельзя отличить G0 от G1 и нельзя рассчитать скорость обновления ткани.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 7 · Репликация ДНК: от комплементарности оснований к работе репликационной вилки — объяснения","home_eyebrow":"Семинар 7 · самостоятельная подготовка","home_h1":"Репликация ДНК:\nот комплементарности оснований к работе репликационной вилки","home_lead":"Строение двойной спирали подсказывает механизм копирования: от комплементарности — к тому, почему две цепи копируются по-разному, и к тому, по какому продукту узнают недостающий фермент.","start":"Начать с комплементарности →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"8 сценариев (по одному на каждый вопрос 1–4 на базовом и продвинутом уровне): предсказание, вмешательство и разбор каждого ответа. Пройдите их после объяснений раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 1.6, 12 ноября 2026 г. · Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} из {n}","jump_label":"Перейти к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Правильные ответы","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения помогают читать схемы и формулировать вывод. Подчёркнутые в тексте шагов термины ведут к этому словарю.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Двенадцать вопросов базового уровня разделов 1–4. После ответа откройте разбор. Если механизм остался непонятен, вернитесь к объяснению.","exam_note":"Это повторение ключевых связей, а не гарантия освоения всей темы. Результаты показаны в оглавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 8 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Переключатели показывают предсказания учебной модели, а не доказательство: её правила заданы заранее, а основания и границы правил — в шагах «Объяснений»; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Репликация ДНК: от комплементарности оснований к работе репликационной вилки","stats":[["4 вопроса","от комплементарности до белков вилки"],["Объяснения","с вопросами для самопроверки"],["2 уровня","базовый — к коллоквиуму и зачёту, продвинутый — системные исследования сверх программы"]],"num_fmt":"БИО-7·{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Все семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →"},"lessons":[{"id":"nucleotide-chain","section":0,"questions":[1],"title":"Из чего построена цепь ДНК и почему у неё есть направление","keywords":["нуклеотид","дезоксирибоза","фосфодиэфирная связь","5′-конец","3′-конец"],"lead":["Чтобы понять, как ДНК копируется, сначала нужно увидеть, из чего построена одна цепь и почему у неё два разных конца.","Это первая часть вопроса 1 коллоквиума 2 (предварительный список) и вопроса 13 зачёта."],"mechanism":["Нуклеотид ДНК — дезоксирибоза, фосфатная группа и азотистое основание: аденин (A), гуанин (G), цитозин (C) или тимин (T).","Соседние нуклеотиды соединены фосфодиэфирной связью: фосфат связывает 3′-углерод сахара одного нуклеотида с 5′-углеродом сахара следующего.","Сахаро-фосфатный остов повторяется, а основания выступают в сторону; порядок оснований и есть записанная в цепи информация.","Концы цепи различаются: на 5′-конце свободен 5′-углерод сахара (обычно он несёт фосфатную группу), на 3′-конце — 3′-OH-группа сахара; последовательность записывают от 5′ к 3′."],"paragraphs":["Все нуклеотиды цепи связаны одинаково — через сахаро-фосфатный остов, — поэтому любая последовательность оснований допустима: остов не ограничивает, какое основание стоит следующим. Информация заключена только в порядке оснований.","Направление цепи задаёт остов, а не основания. Один конец — 5′-углерод сахара (обычно с фосфатом), другой — гидроксил при 3′-углероде. Это различие станет главным в разделах 3 и 4: новый нуклеотид присоединяется только к 3′-OH.","Аденин и гуанин — пурины (два кольца), цитозин и тимин — пиримидины (одно кольцо). В РНК вместо дезоксирибозы — рибоза, вместо тимина — урацил (U)."],"conditions":"Схема шага показывает цепи и основания условно: это не химические формулы; длина цепи и последовательность выбраны для примера.","sources":["Alberts2022"],"quiz":{"id":"S7-L01","question":"Чем 5′-конец цепи ДНК отличается от 3′-конца?","options":[{"id":"S7-L01-1","text":"На 5′-конце свободен 5′-углерод сахара (обычно с фосфатом), на 3′-конце — 3′-OH-группа сахара","correct":true,"feedback":"Концы различаются по нумерации атомов сахара в остове; именно к 3′-OH присоединяется следующий нуклеотид."},{"id":"S7-L01-2","text":"На 5′-конце — пурин, на 3′-конце — пиримидин","correct":false,"feedback":"Основание на конце может быть любым; направление цепи задаёт остов, а не основания."},{"id":"S7-L01-3","text":"Концы одинаковы, направление выбрано для записи условно","correct":false,"feedback":"Концы химически различны, поэтому у цепи есть направление, и цепи двойной спирали антипараллельны."}]},"widget":{"kind":"dna","title":"","s":{"title":"Строение цепи и её направление","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["нуклеотид","участок цепи: 5′- и 3′-концы","затравка антипараллельна матрице","затравка параллельна матрице"],"scene":"s1b","args":[["nt"],["chain"],["1","all","anti"],["1","all","par"]],"L":{"s1_mat":"Матрица","s1_mat_1":"цепь 1","s1_mat_2":"цепь 2","s1_nuc":"Нуклеотиды в среде","s1_nuc_all":"все четыре dNTP","s1_nuc_dda":"вместо dATP — аналог без 3′-OH","s1_nuc_nog":"нет dGTP","s1_ori":"Затравка","s1_ori_anti":"антипараллельна матрице","s1_ori_par":"параллельна матрице","s1_lbl_tpl":"матрица — цепь {m} (записана 3′→5′ слева направо)","s1_lbl_primer":"затравка (короткая ДНК; в клетке затравка — РНК)","s1_lbl_new":"новая цепь","s1_lbl_pol":"ДНК-полимераза","s1_lbl_no3oh":"аналог: нет 3′-OH","s1_lbl_needG":"напротив C нужен G — dGTP нет","s1_lbl_par":"затравка параллельна матрице: пары не образуются","s1_lbl_pool":"Нуклеотиды в среде (dNTP):","s1_lbl_pool_dda":"A — аналог без 3′-OH","s1_lbl_pool_nog":"dGTP нет","s1_lbl_hb":"пунктир — водородные связи: в паре A–T две, в паре G–C три (схема, не масштаб)","s1_r_pairs":"Пары оснований с матрицей","s1_v_pairs":"A–T и G–C","s1_v_nopairs":"не образуются","s1_r_len":"Длина новой цепи","s1_r_len_s":"из 12 нуклеотидов, считая 3 нуклеотида затравки","s1_v_len":"{n}","s1_r_seq":"Последовательность новой цепи","s1_r_seq_s":"звёздочка — аналог без 3′-OH","s1_v_none":"нет","s1_r_stop":"Синтез","s1_v_stop_none":"дошёл до конца матрицы","s1_v_stop_dda":"оборвался после аналога напротив первого T матрицы за затравкой","s1_v_stop_noG":"остановился перед первым C матрицы за затравкой","s1_v_stop_nostart":"не начался","s1_r_same":"Новая цепь совпадает","s1_v_same":"с цепью {m} исходной молекулы","s1_cap_all":"Матрица — цепь {m}. Напротив каждого основания матрицы ДНК-полимераза присоединяет комплементарный нуклеотид: напротив A — T, напротив T — A, напротив G — C, напротив C — G. Новая цепь растёт от 3′-OH затравки в направлении 5′→3′ и антипараллельна матрице.","s1_cap_all_z":"Последовательность новой цепи однозначно задана матрицей: новая цепь совпадает с другой цепью исходной молекулы, поэтому каждая из двух цепей может служить матрицей, и копия воспроизводит исходную информацию.","s1_cap_dda":"Вместо dATP в среде аналог без 3′-OH. Он встаёт напротив первого T матрицы за затравкой, но к нему нельзя присоединить следующий нуклеотид: у аналога нет 3′-OH. Цепь обрывается — {n} нуклеотидов, считая затравку.","s1_cap_dda_z":"Обрыв происходит точно напротив определённого основания матрицы, поэтому по длине продукта можно определить, где в матрице стоит T. На этом основан метод определения последовательности ДНК обрывом цепей.","s1_cap_nog":"В среде нет dGTP. Напротив первого C матрицы за затравкой нужен G; в этой модели полимераза присоединяет только комплементарный нуклеотид, поэтому синтез останавливается перед этим положением — {n} нуклеотидов, считая затравку.","s1_cap_nog_z":"Комплементарность ограничивает выбор: напротив C подходит только G. Полимераза изредка всё же присоединяет некомплементарный нуклеотид; как такие ошибки исправляются — семинар 8.","s1_cap_par":"Затравка уложена параллельно матрице: напротив 3′-конца матрицы оказался её 3′-конец. В двойной спирали цепи антипараллельны, поэтому такая затравка в модели не образует пар с матрицей, и у полимеразы нет спаренного с матрицей 3′-OH — синтез не начинается.","s1_cap_par_z":"Для копирования нужны оба свойства молекулы: комплементарность оснований и антипараллельность цепей.","s1_lbl_notpl":"матрицы нет","s1_lbl_notpl_pr":"матрицы нет: затравке не с чем спариться","s1_lbl_nopr":"затравки нет: полимеразе нечего удлинять","s1_lbl_nopol":"ДНК-полимеразы нет: нуклеотиды не присоединяются","s1_cap_notpl":"Матрицы нет. Затравке не с чем спариться, и нет основания, которое задало бы следующий нуклеотид: синтез не начинается.","s1_cap_notpl_z":"Последовательность новой цепи задаёт матрица; без матрицы копировать нечего.","s1_cap_nopr":"Затравки нет. ДНК-полимераза удлиняет только спаренный 3′-OH-конец и не начинает цепь сама, поэтому синтез не начинается.","s1_cap_nopr_z":"Поэтому синтез новой цепи ДНК начинается с короткой затравки: к её 3′-OH-концу полимераза присоединяет первый нуклеотид.","s1_cap_nopol":"Затравка спарена с матрицей, нуклеотиды в среде есть, но ДНК-полимеразы нет: фосфодиэфирные связи не образуются, цепь не удлиняется.","s1_cap_nopol_z":"Комплементарность определяет, какой нуклеотид подходит; присоединяет его фермент — ДНК-полимераза.","st_head_nt":"схема строения нуклеотида · не химическая формула","st_head_chain":"схема участка цепи из двух нуклеотидов · не химическая формула","st_head_helix":"схема двойной спирали · пропорции условные","st_base":"азотистое основание (здесь — аденин)","st_sugar":"дезоксирибоза: атомы углерода 1′–5′","st_phos":"фосфатная группа (P)","st_nt_note":"Основание присоединено к 1′-углероду, фосфат — к 5′-углероду; у 3′-углерода — группа OH.","st_bond1":"фосфодиэфирная связь:","st_bond2":"3′-C — P — 5′-C","st_end5":"5′-конец (у 5′-углерода — фосфат)","st_end3":"3′-конец (свободная группа 3′-OH)","st_helix_bb":"линии — сахаро-фосфатные остовы двух цепей","st_helix_pairs":"поперечные отрезки — пары оснований A–T и G–C внутри спирали","st_helix_anti":"цепи антипараллельны: напротив 5′-конца одной — 3′-конец другой","st_foot":"Условная схема: размеры и углы не в масштабе; атомы водорода не показаны.","st_foot_helix":"Условная схема: размеры, углы и число пар на виток не в масштабе."},"notes":["Нуклеотид: дезоксирибоза с атомами углерода 1′–5′, фосфат у 5′-углерода, основание у 1′-углерода, OH у 3′-углерода.","Фосфат соединяет 3′-углерод одного сахара с 5′-углеродом следующего; у цепи два разных конца — 5′ и 3′.","Затравка лежит антипараллельно матрице: её 3′-OH обращён к непрочитанной части матрицы, и новая цепь растёт 5′→3′.","Затравка параллельна матрице: пары не образуются, спаренного 3′-OH нет — синтез не начинается."],"static":["Нуклеотид: дезоксирибоза с атомами углерода 1′–5′, фосфат у 5′-углерода, основание у 1′-углерода, OH у 3′-углерода."],"scenes":["sst","sst","s1b","s1b"]}}},{"id":"double-helix","section":0,"questions":[1],"title":"Как две цепи держатся вместе: комплементарность и антипараллельность","keywords":["двойная спираль","комплементарность","антипараллельность","водородные связи","правила Чаргаффа"],"lead":["Две цепи ДНК соединены основаниями, причём не любыми: A всегда стоит напротив T, G — напротив C. Это и есть [[T06|комплементарность]].","Цепи направлены навстречу друг другу — антипараллельны. Оба свойства нужны, чтобы одна цепь однозначно задавала другую."],"mechanism":["В [[T13|двойной спирали]] основания обращены внутрь, сахаро-фосфатные остовы — наружу.","Пары: A–T с двумя водородными связями, G–C с тремя. В каждой паре один пурин и один пиримидин, поэтому ширина спирали одинакова по всей длине.","Напротив 5′-конца одной цепи стоит 3′-конец другой — цепи антипараллельны.","Две цепи удерживаются водородными связями между спаренными основаниями: в паре A–T две связи, в паре G–C три; пары уложены стопкой внутри спирали, а сахаро-фосфатный остов — снаружи."],"paragraphs":["Из комплементарности следуют правила Чаргаффа: в двуцепочечной ДНК количество A равно количеству T, количество G — количеству C, а сумма пуринов (A + G) равна сумме пиримидинов (T + C).","На один виток спирали приходится около 10,4 пары оснований, расстояние между соседними парами — 0,34 нм (по данным для ДНК в растворе). В пробирке длинную ДНК в солевом растворе обычно удаётся разделить на цепи лишь при температурах, близких к кипению воды; точная температура зависит от длины молекулы, доли пар G–C и концентрации солей. В клетке цепи локально разделяют специальные белки — хеликазы (раздел 4).","Правильность комплементарной цепи проверяют по двум признакам: верно ли подобраны пары оснований и верно ли указаны концы 5′ и 3′. Комплементарную цепь тоже записывают от 5′ к 3′, то есть в обратном порядке: для 5′-AGTC-3′ комплементарна 5′-GACT-3′."],"conditions":"Число пар на виток — для ДНК в растворе (B-форма); схема шага не масштабна.","sources":["Alberts2022"],"quiz":{"id":"S7-L02","question":"В двуцепочечной ДНК 30 % оснований — аденин. Сколько процентов составляет гуанин?","options":[{"id":"S7-L02-1","text":"30 %","correct":false,"feedback":"Аденину равен тимин, а не гуанин: A = T, G = C."},{"id":"S7-L02-2","text":"20 %","correct":true,"feedback":"A = T, значит, A + T = 60 %; на G + C остаётся 40 %, а G = C, — по 20 %."},{"id":"S7-L02-3","text":"70 %","correct":false,"feedback":"70 % приходится на все остальные основания — T, G и C вместе; гуанин — половина от G + C."}]},"widget":{"kind":"dna","title":"","s":{"title":"Двойная спираль и пары оснований","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["двойная спираль","матрица — цепь 1","матрица — цепь 2"],"scene":"s1b","args":[["helix"],["1","all","anti"],["2","all","anti"]],"L":{"s1_mat":"Матрица","s1_mat_1":"цепь 1","s1_mat_2":"цепь 2","s1_nuc":"Нуклеотиды в среде","s1_nuc_all":"все четыре dNTP","s1_nuc_dda":"вместо dATP — аналог без 3′-OH","s1_nuc_nog":"нет dGTP","s1_ori":"Затравка","s1_ori_anti":"антипараллельна матрице","s1_ori_par":"параллельна матрице","s1_lbl_tpl":"матрица — цепь {m} (записана 3′→5′ слева направо)","s1_lbl_primer":"затравка (короткая ДНК; в клетке затравка — РНК)","s1_lbl_new":"новая цепь","s1_lbl_pol":"ДНК-полимераза","s1_lbl_no3oh":"аналог: нет 3′-OH","s1_lbl_needG":"напротив C нужен G — dGTP нет","s1_lbl_par":"затравка параллельна матрице: пары не образуются","s1_lbl_pool":"Нуклеотиды в среде (dNTP):","s1_lbl_pool_dda":"A — аналог без 3′-OH","s1_lbl_pool_nog":"dGTP нет","s1_lbl_hb":"пунктир — водородные связи: в паре A–T две, в паре G–C три (схема, не масштаб)","s1_r_pairs":"Пары оснований с матрицей","s1_v_pairs":"A–T и G–C","s1_v_nopairs":"не образуются","s1_r_len":"Длина новой цепи","s1_r_len_s":"из 12 нуклеотидов, считая 3 нуклеотида затравки","s1_v_len":"{n}","s1_r_seq":"Последовательность новой цепи","s1_r_seq_s":"звёздочка — аналог без 3′-OH","s1_v_none":"нет","s1_r_stop":"Синтез","s1_v_stop_none":"дошёл до конца матрицы","s1_v_stop_dda":"оборвался после аналога напротив первого T матрицы за затравкой","s1_v_stop_noG":"остановился перед первым C матрицы за затравкой","s1_v_stop_nostart":"не начался","s1_r_same":"Новая цепь совпадает","s1_v_same":"с цепью {m} исходной молекулы","s1_cap_all":"Матрица — цепь {m}. Напротив каждого основания матрицы ДНК-полимераза присоединяет комплементарный нуклеотид: напротив A — T, напротив T — A, напротив G — C, напротив C — G. Новая цепь растёт от 3′-OH затравки в направлении 5′→3′ и антипараллельна матрице.","s1_cap_all_z":"Последовательность новой цепи однозначно задана матрицей: новая цепь совпадает с другой цепью исходной молекулы, поэтому каждая из двух цепей может служить матрицей, и копия воспроизводит исходную информацию.","s1_cap_dda":"Вместо dATP в среде аналог без 3′-OH. Он встаёт напротив первого T матрицы за затравкой, но к нему нельзя присоединить следующий нуклеотид: у аналога нет 3′-OH. Цепь обрывается — {n} нуклеотидов, считая затравку.","s1_cap_dda_z":"Обрыв происходит точно напротив определённого основания матрицы, поэтому по длине продукта можно определить, где в матрице стоит T. На этом основан метод определения последовательности ДНК обрывом цепей.","s1_cap_nog":"В среде нет dGTP. Напротив первого C матрицы за затравкой нужен G; в этой модели полимераза присоединяет только комплементарный нуклеотид, поэтому синтез останавливается перед этим положением — {n} нуклеотидов, считая затравку.","s1_cap_nog_z":"Комплементарность ограничивает выбор: напротив C подходит только G. Полимераза изредка всё же присоединяет некомплементарный нуклеотид; как такие ошибки исправляются — семинар 8.","s1_cap_par":"Затравка уложена параллельно матрице: напротив 3′-конца матрицы оказался её 3′-конец. В двойной спирали цепи антипараллельны, поэтому такая затравка в модели не образует пар с матрицей, и у полимеразы нет спаренного с матрицей 3′-OH — синтез не начинается.","s1_cap_par_z":"Для копирования нужны оба свойства молекулы: комплементарность оснований и антипараллельность цепей.","s1_lbl_notpl":"матрицы нет","s1_lbl_notpl_pr":"матрицы нет: затравке не с чем спариться","s1_lbl_nopr":"затравки нет: полимеразе нечего удлинять","s1_lbl_nopol":"ДНК-полимеразы нет: нуклеотиды не присоединяются","s1_cap_notpl":"Матрицы нет. Затравке не с чем спариться, и нет основания, которое задало бы следующий нуклеотид: синтез не начинается.","s1_cap_notpl_z":"Последовательность новой цепи задаёт матрица; без матрицы копировать нечего.","s1_cap_nopr":"Затравки нет. ДНК-полимераза удлиняет только спаренный 3′-OH-конец и не начинает цепь сама, поэтому синтез не начинается.","s1_cap_nopr_z":"Поэтому синтез новой цепи ДНК начинается с короткой затравки: к её 3′-OH-концу полимераза присоединяет первый нуклеотид.","s1_cap_nopol":"Затравка спарена с матрицей, нуклеотиды в среде есть, но ДНК-полимеразы нет: фосфодиэфирные связи не образуются, цепь не удлиняется.","s1_cap_nopol_z":"Комплементарность определяет, какой нуклеотид подходит; присоединяет его фермент — ДНК-полимераза.","st_head_nt":"схема строения нуклеотида · не химическая формула","st_head_chain":"схема участка цепи из двух нуклеотидов · не химическая формула","st_head_helix":"схема двойной спирали · пропорции условные","st_base":"азотистое основание (здесь — аденин)","st_sugar":"дезоксирибоза: атомы углерода 1′–5′","st_phos":"фосфатная группа (P)","st_nt_note":"Основание присоединено к 1′-углероду, фосфат — к 5′-углероду; у 3′-углерода — группа OH.","st_bond1":"фосфодиэфирная связь:","st_bond2":"3′-C — P — 5′-C","st_end5":"5′-конец (у 5′-углерода — фосфат)","st_end3":"3′-конец (свободная группа 3′-OH)","st_helix_bb":"линии — сахаро-фосфатные остовы двух цепей","st_helix_pairs":"поперечные отрезки — пары оснований A–T и G–C внутри спирали","st_helix_anti":"цепи антипараллельны: напротив 5′-конца одной — 3′-конец другой","st_foot":"Условная схема: размеры и углы не в масштабе; атомы водорода не показаны.","st_foot_helix":"Условная схема: размеры, углы и число пар на виток не в масштабе."},"notes":["Две антипараллельные цепи закручены в спираль: остовы снаружи, пары оснований внутри.","Напротив каждого основания цепи 1 стоит комплементарное; в паре A–T две водородные связи, в паре G–C три.","Если матрица — цепь 2, по тем же правилам получается цепь 1: каждая цепь задаёт другую."],"static":["Две антипараллельные цепи закручены в спираль: остовы снаружи, пары оснований внутри."],"scenes":["sst","s1b","s1b"]}}},{"id":"template-principle","section":0,"questions":[1],"title":"Почему каждая цепь — матрица для другой","keywords":["матрица","матричный синтез","репликация","комплементарность"],"lead":["Если одна цепь однозначно задаёт другую, то для копирования достаточно разделить цепи и достроить к каждой комплементарную.","Так строение двойной спирали подсказывает механизм копирования — ответ на первый пункт минимального результата семинара."],"mechanism":["Обозначим цепи S и S′. Цепь S служит [[T01|матрицей]] для новой цепи S′, а цепь S′ — для новой цепи S.","Напротив каждого основания матрицы встаёт комплементарный нуклеотид; [[T02|новая цепь]] антипараллельна матрице.","В результате получаются две двойные спирали, последовательность которых совпадает с исходной.","Тот же матричный принцип действует при транскрипции (ДНК → РНК) и трансляции (мРНК → белок)."],"paragraphs":["Копирование воспроизводимо, а не случайно, потому что выбор каждого нуклеотида ограничен основанием матрицы: напротив C подходит только G, напротив A — только T. Последовательность новой цепи задана заранее, и при повторном копировании воспроизводится та же последовательность.","Отсюда и «запас» информации: она записана дважды — в каждой из двух цепей. Если одна цепь повреждена, исходную последовательность можно восстановить по другой; на этом основана репарация ДНК (семинар 8).","Комплементарность делает точное копирование возможным, но не гарантирует его: ДНК-полимераза изредка присоединяет некомплементарный нуклеотид. Как такие ошибки исправляются — тема семинара 8."],"conditions":"Схема качественная; ошибки копирования в модели не показаны.","sources":["Alberts2022"],"quiz":{"id":"S7-L03","question":"Цепь ДНК 5′-ATGC-3′ служит матрицей. Какая цепь будет синтезирована?","options":[{"id":"S7-L03-1","text":"5′-TACG-3′","correct":false,"feedback":"Пары подобраны верно, но цепь записана в той же ориентации, что и матрица; антипараллельную цепь записывают в обратном порядке."},{"id":"S7-L03-2","text":"5′-ATGC-3′","correct":false,"feedback":"Новая цепь комплементарна матрице, а не повторяет её; копия, совпадающая с этой цепью, получится на следующем шаге — по новой цепи."},{"id":"S7-L03-3","text":"5′-GCAT-3′","correct":true,"feedback":"Комплементарная цепь антипараллельна: напротив 5′-A…C-3′ стоит 3′-T…G-5′, а записанная от 5′ к 3′ она читается как GCAT."}]},"widget":{"kind":"dna","title":"","s":{"title":"Копирование цепи 1 и цепи 2","status":"Схема качественная · последовательность условная","modes_label":"Матрица","modes":["матрица — цепь 1","матрица — цепь 2"],"scene":"s1b","args":[["1","all","anti"],["2","all","anti"]],"L":{"s1_mat":"Матрица","s1_mat_1":"цепь 1","s1_mat_2":"цепь 2","s1_nuc":"Нуклеотиды в среде","s1_nuc_all":"все четыре dNTP","s1_nuc_dda":"вместо dATP — аналог без 3′-OH","s1_nuc_nog":"нет dGTP","s1_ori":"Затравка","s1_ori_anti":"антипараллельна матрице","s1_ori_par":"параллельна матрице","s1_lbl_tpl":"матрица — цепь {m} (записана 3′→5′ слева направо)","s1_lbl_primer":"затравка (короткая ДНК; в клетке затравка — РНК)","s1_lbl_new":"новая цепь","s1_lbl_pol":"ДНК-полимераза","s1_lbl_no3oh":"аналог: нет 3′-OH","s1_lbl_needG":"напротив C нужен G — dGTP нет","s1_lbl_par":"затравка параллельна матрице: пары не образуются","s1_lbl_pool":"Нуклеотиды в среде (dNTP):","s1_lbl_pool_dda":"A — аналог без 3′-OH","s1_lbl_pool_nog":"dGTP нет","s1_lbl_hb":"пунктир — водородные связи: в паре A–T две, в паре G–C три (схема, не масштаб)","s1_r_pairs":"Пары оснований с матрицей","s1_v_pairs":"A–T и G–C","s1_v_nopairs":"не образуются","s1_r_len":"Длина новой цепи","s1_r_len_s":"из 12 нуклеотидов, считая 3 нуклеотида затравки","s1_v_len":"{n}","s1_r_seq":"Последовательность новой цепи","s1_r_seq_s":"звёздочка — аналог без 3′-OH","s1_v_none":"нет","s1_r_stop":"Синтез","s1_v_stop_none":"дошёл до конца матрицы","s1_v_stop_dda":"оборвался после аналога напротив первого T матрицы за затравкой","s1_v_stop_noG":"остановился перед первым C матрицы за затравкой","s1_v_stop_nostart":"не начался","s1_r_same":"Новая цепь совпадает","s1_v_same":"с цепью {m} исходной молекулы","s1_cap_all":"Матрица — цепь {m}. Напротив каждого основания матрицы ДНК-полимераза присоединяет комплементарный нуклеотид: напротив A — T, напротив T — A, напротив G — C, напротив C — G. Новая цепь растёт от 3′-OH затравки в направлении 5′→3′ и антипараллельна матрице.","s1_cap_all_z":"Последовательность новой цепи однозначно задана матрицей: новая цепь совпадает с другой цепью исходной молекулы, поэтому каждая из двух цепей может служить матрицей, и копия воспроизводит исходную информацию.","s1_cap_dda":"Вместо dATP в среде аналог без 3′-OH. Он встаёт напротив первого T матрицы за затравкой, но к нему нельзя присоединить следующий нуклеотид: у аналога нет 3′-OH. Цепь обрывается — {n} нуклеотидов, считая затравку.","s1_cap_dda_z":"Обрыв происходит точно напротив определённого основания матрицы, поэтому по длине продукта можно определить, где в матрице стоит T. На этом основан метод определения последовательности ДНК обрывом цепей.","s1_cap_nog":"В среде нет dGTP. Напротив первого C матрицы за затравкой нужен G; в этой модели полимераза присоединяет только комплементарный нуклеотид, поэтому синтез останавливается перед этим положением — {n} нуклеотидов, считая затравку.","s1_cap_nog_z":"Комплементарность ограничивает выбор: напротив C подходит только G. Полимераза изредка всё же присоединяет некомплементарный нуклеотид; как такие ошибки исправляются — семинар 8.","s1_cap_par":"Затравка уложена параллельно матрице: напротив 3′-конца матрицы оказался её 3′-конец. В двойной спирали цепи антипараллельны, поэтому такая затравка в модели не образует пар с матрицей, и у полимеразы нет спаренного с матрицей 3′-OH — синтез не начинается.","s1_cap_par_z":"Для копирования нужны оба свойства молекулы: комплементарность оснований и антипараллельность цепей.","s1_lbl_notpl":"матрицы нет","s1_lbl_notpl_pr":"матрицы нет: затравке не с чем спариться","s1_lbl_nopr":"затравки нет: полимеразе нечего удлинять","s1_lbl_nopol":"ДНК-полимеразы нет: нуклеотиды не присоединяются","s1_cap_notpl":"Матрицы нет. Затравке не с чем спариться, и нет основания, которое задало бы следующий нуклеотид: синтез не начинается.","s1_cap_notpl_z":"Последовательность новой цепи задаёт матрица; без матрицы копировать нечего.","s1_cap_nopr":"Затравки нет. ДНК-полимераза удлиняет только спаренный 3′-OH-конец и не начинает цепь сама, поэтому синтез не начинается.","s1_cap_nopr_z":"Поэтому синтез новой цепи ДНК начинается с короткой затравки: к её 3′-OH-концу полимераза присоединяет первый нуклеотид.","s1_cap_nopol":"Затравка спарена с матрицей, нуклеотиды в среде есть, но ДНК-полимеразы нет: фосфодиэфирные связи не образуются, цепь не удлиняется.","s1_cap_nopol_z":"Комплементарность определяет, какой нуклеотид подходит; присоединяет его фермент — ДНК-полимераза."},"notes":["По цепи 1 строится цепь, совпадающая с цепью 2.","По цепи 2 строится цепь, совпадающая с цепью 1: последовательность воспроизводится."],"static":["По цепи 1 строится цепь, совпадающая с цепью 2."]}}},{"id":"polymerase-rule","section":0,"questions":[1],"title":"Что нужно ДНК-полимеразе: матрица, затравка с 3′-OH и нуклеотиды","keywords":["ДНК-полимераза","dNTP","затравка","3′-OH","5′→3′","пирофосфат"],"lead":["Копирует ДНК фермент [[T07|ДНК-полимераза]]. Ей нужны три вещи: матрица, цепь, спаренная с матрицей, со свободным 3′-OH, и [[T05|нуклеотиды]] в форме трифосфатов.","Из этих требований следуют главные свойства репликации, разобранные в разделах 3 и 4."],"mechanism":["Субстрат — дезоксирибонуклеозидтрифосфат (dATP, dTTP, dGTP, dCTP) с тремя фосфатами.","3′-OH растущей цепи присоединяет α-фосфат нового нуклеотида; образуется фосфодиэфирная связь, а два концевых фосфата уходят в виде пирофосфата.","Поэтому новая цепь растёт только в направлении 5′→3′, а матрица читается в направлении 3′→5′.","Начать цепь «с нуля» ДНК-полимераза не может: ей нужна [[T03|затравка]] — участок со спаренным с матрицей 3′-концом."],"paragraphs":["Энергия для каждой фосфодиэфирной связи заключена в самом субстрате — в связях трифосфата; гидролиз отщеплённого пирофосфата делает реакцию практически необратимой.","Полимераза присоединяет нуклеотид, когда он образует правильную пару с основанием матрицы. Так комплементарность превращается в правило работы фермента.","В клетке затравки — короткие молекулы РНК; их синтезирует праймаза, которая начинает синтез без готовой затравки — ей не нужен готовый 3′-конец (раздел 3)."],"conditions":"Схема качественная: показан один шаг удлинения; структура активного центра не изображена.","sources":["Alberts2022"],"quiz":{"id":"S7-L04","question":"В пробирке есть одноцепочечная ДНК-матрица, ДНК-полимераза и все четыре dNTP, но нет затравки. Что произойдёт?","options":[{"id":"S7-L04-1","text":"Синтез не начнётся: ДНК-полимеразе нужен спаренный с матрицей 3′-OH","correct":true,"feedback":"ДНК-полимераза только удлиняет цепь; начать новую цепь она не может."},{"id":"S7-L04-2","text":"Полимераза начнёт цепь с 3′-конца матрицы","correct":false,"feedback":"Ни с одного места полимераза не начинает цепь без затравки; начинать синтез может праймаза — РНК-полимераза."},{"id":"S7-L04-3","text":"Синтез пойдёт в направлении 3′→5′","correct":false,"feedback":"Направление синтеза всегда 5′→3′: нуклеотид пр
