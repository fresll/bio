ом.","s4a_cap_M":"Митоз до расхождения хроматид: 4c; 46 хромосом из двух сестринских хроматид.","s4a_cap_M_z":"Разделить можно только то, что уже скопировано.","s4a_cap_D":"После деления: две клетки, в каждой 2c и 46 хромосом по одной хроматиде.","s4a_cap_D_z":"Сестринские хроматиды разошлись, и каждая дочерняя клетка получила полный геном.","s4a_cap_nodiv_villus":"Клетки ворсинки не делятся: ядерной ДНК 2c, ядерный геном не копируется. Новые клетки ворсинки приходят из крипты.","s4a_cap_nodiv_villus_z":"Обновление ткани обеспечивают делящиеся клетки крипты, а не клетки ворсинки.","s4a_cap_nodiv_neuron":"Зрелые нейроны не делятся: ядерной ДНК 2c, ядерный геном не копируется. При этом идут транскрипция, синтез белка и репарация ДНК.","s4a_cap_nodiv_neuron_z":"Отсутствие репликации не означает, что клетка не синтезирует ДНК совсем: при репарации небольшие участки синтезируются заново.","s4a_cap_pop_blood":"Условный набор делящихся предшественников крови: {b} из 12 клеток копируют ядерную ДНК.","s4a_cap_pop_blood_z":"Делящихся клеток много — этим поддерживается образование клеток крови.","s4a_cap_pop_crypt":"Условный набор клеток крипты: {b} из 12 клеток копируют ядерную ДНК.","s4a_cap_pop_crypt_z":"Деление клеток в криптах обновляет эпителий кишки.","s4a_cap_pop_villus":"Условный набор клеток ворсинки: все 12 клеток 2c, ни одна не копирует ядерную ДНК.","s4a_cap_pop_villus_z":"Клетки ворсинки — дифференцированные, неделящиеся; они обновляются за счёт крипты.","s4a_cap_pop_neuron":"Условный набор зрелых нейронов: все 12 клеток 2c, ни одна не копирует ядерную ДНК.","s4a_cap_pop_neuron_z":"По одному этому снимку не отличить неделящиеся клетки от делящихся, которые сейчас в G1.","s4a_cap_mask":"Наблюдение: распределение 12 клеток по количеству ДНК. Тип ткани не указан.","s4a_cap_mask_z":"Решите, что можно заключить из одного этого распределения, а что нельзя.","s4a_tl_note":"Время шкалы условное: реальные длительности фаз не показаны.","s4a_tl_G1":"G1: 46 хромосом, каждая из одной хроматиды; количество ДНК 2c.","s4a_tl_S":"S: ядерная ДНК копируется; количество ДНК между 2c и 4c, хромосом по-прежнему 46.","s4a_tl_G2":"G2: копирование завершено; 46 хромосом по две хроматиды, 4c.","s4a_tl_M":"Митоз: 46 хромосом по две хроматиды; затем сестринские хроматиды расходятся в дочерние клетки.","s4a_tl_D":"Две клетки: в каждой 46 хромосом и 2c.","s4a_tl_G0":"G0: клетка вышла из цикла; 2c, ядерный геном не копируется.","s4a_tl_pop":"Набор клеток в один момент: распределение по количеству ДНК.","s4a_take":"Репликация ядерной ДНК — событие клеточного цикла: в S-фазе количество ДНК растёт от 2c до 4c, а число хромосом остаётся 46 до расхождения сестринских хроматид. Одним клеткам организма репликация нужна сейчас — делящимся предшественникам крови и клеткам крипт, которые обновляют ткань; другим — нет: клетки ворсинки и зрелые нейроны не делятся. Неделящаяся клетка при этом не «выключена»: в ней идут транскрипция, синтез белка и репарация ДНК. По одному распределению клеток по количеству ДНК нельзя рассчитать скорость обновления ткани и нельзя отличить G0 от G1. Как клетка переходит из фазы в фазу — семинар 6."},"notes":["G1: 2c, 46 хромосом по одной хроматиде.","S: копирование идёт, ДНК между 2c и 4c, хромосом 46.","G2: 4c, 46 хромосом по две хроматиды.","После деления: две клетки по 2c и 46 хромосом."],"static":["G1: 2c, 46 хромосом по одной хроматиде."]}},"level":"adv"},{"id":"tissue-states","section":3,"questions":[4],"title":"Почему одним клеткам организма репликация нужна сейчас, а другим — нет?","keywords":["клеточное обновление","крипта","ворсинка","нейрон","G0"],"lead":["Уже известно: репликация ядерной ДНК — событие клеточного цикла.","Новое: нужна ли репликация, зависит от состояния клетки и от того, обновляется ли ткань."],"mechanism":["Эпителий тонкой кишки обновляется постоянно: делящиеся клетки находятся в криптах, а дифференцированные клетки поднимаются на ворсинки и там уже не делятся.","Клетки крови постоянно образуются в костном мозге из делящихся клеток-предшественников.","Зрелые нейроны не делятся: они находятся вне цикла, в состоянии [[T41|G0]], и ядерный геном не копируется.","Неделящаяся клетка не «выключена»: в ней идут транскрипция, синтез белка и репарация ДНК."],"paragraphs":["В одном органе бывают и делящиеся, и неделящиеся клетки; поэтому нельзя приписывать всей ткани одно состояние или одну частоту деления.","Отсутствие репликации всего ядерного генома не означает, что клетка совсем не синтезирует ДНК. Как это узнали: в нейронах, полученных из стволовых клеток человека и больше не делящихся, меченые нуклеотиды за сутки встраивались в ДНК там, где шла репарация; чаще всего — примерно в 61 тысяче коротких участков, вместе занимающих около 1,6 % генома.","Стволовые клетки крови делятся редко, а часто делятся их потомки — клетки-предшественники; поэтому в модели «предшественники крови» — набор делящихся клеток.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Три примера клеток — иллюстрации, а не универсальные правила; условные наборы клеток не являются измерениями тканей. Как переход из фазы в фазу регулируется — семинар 6 и курс «Молекулярная биология».","sources":["Alberts2022","Reid2021"],"quiz":{"id":"S7-L40","question":"Какое утверждение о зрелом нейроне верно?","options":[{"id":"S7-L40-1","text":"Геном не копируется, но транскрипция и репарация ДНК идут","correct":true,"feedback":"Отсутствие репликации не означает отсутствия других процессов с ДНК."},{"id":"S7-L40-2","text":"ДНК-полимеразы и dNTP нейрону больше не нужны совсем","correct":false,"feedback":"При репарации ДНК-полимераза достраивает участки ДНК — для этого нужны и фермент, и dNTP."},{"id":"S7-L40-3","text":"Нейрон в G0 не синтезирует ни РНК, ни белки","correct":false,"feedback":"G0 — состояние вне клеточного цикла, а не отсутствие жизнедеятельности."}]},"widget":{"kind":"dna","title":"","s":{"title":"Разные клетки — уже содержит две молекулы.","s4a_cap_G2":"G2: 4c; 46 хромосом, в каждой две сестринские хроматиды — две одинаковые молекулы ДНК.","s4a_cap_G2_z":"Удвоилось количество ДНК, а не число хромосом.","s4a_cap_M":"Митоз до расхождения хроматид: 4c; 46 хромосом из двух сестринских хроматид.","s4a_cap_M_z":"Разделить можно только то, что уже скопировано.","s4a_cap_D":"После деления: две клетки, в каждой 2c и 46 хромосом по одной хроматиде.","s4a_cap_D_z":"Сестринские хроматиды разошлись, и каждая дочерняя клетка получила полный геном.","s4a_cap_nodiv_villus":"Клетки ворсинки не делятся: ядерной ДНК 2c, ядерный геном не копируется. Новые клетки ворсинки приходят из крипты.","s4a_cap_nodiv_villus_z":"Обновление ткани обеспечивают делящиеся клетки крипты, а не клетки ворсинки.","s4a_cap_nodiv_neuron":"Зрелые нейроны не делятся: ядерной ДНК 2c, ядерный геном не копируется. При этом идут транскрипция, синтез белка и репарация ДНК.","s4a_cap_nodiv_neuron_z":"Отсутствие репликации не означает, что клетка не синтезирует ДНК совсем: при репарации небольшие участки синтезируются заново.","s4a_cap_pop_blood":"Условный набор делящихся предшественников крови: {b} из 12 клеток копируют ядерную ДНК.","s4a_cap_pop_blood_z":"Делящихся клеток много — этим поддерживается образование клеток крови.","s4a_cap_pop_crypt":"Условный набор клеток крипты: {b} из 12 клеток копируют ядерную ДНК.","s4a_cap_pop_crypt_z":"Деление клеток в криптах обновляет эпителий кишки.","s4a_cap_pop_villus":"Условный набор клеток ворсинки: все 12 клеток 2c, ни одна не копирует ядерную ДНК.","s4a_cap_pop_villus_z":"Клетки ворсинки — дифференцированные, неделящиеся; они обновляются за счёт крипты.","s4a_cap_pop_neuron":"Условный набор зрелых нейронов: все 12 клеток 2c, ни одна не копирует ядерную ДНК.","s4a_cap_pop_neuron_z":"По одному этому снимку не отличить неделящиеся клетки от делящихся, которые сейчас в G1.","s4a_cap_mask":"Наблюдение: распределение 12 клеток по количеству ДНК. Тип ткани не указан.","s4a_cap_mask_z":"Решите, что можно заключить из одного этого распределения, а что нельзя.","s4a_tl_note":"Время шкалы условное: реальные длительности фаз не показаны.","s4a_tl_G1":"G1: 46 хромосом, каждая из одной хроматиды; количество ДНК 2c.","s4a_tl_S":"S: ядерная ДНК копируется; количество ДНК между 2c и 4c, хромосом по-прежнему 46.","s4a_tl_G2":"G2: копирование завершено; 46 хромосом по две хроматиды, 4c.","s4a_tl_M":"Митоз: 46 хромосом по две хроматиды; затем сестринские хроматиды расходятся в дочерние клетки.","s4a_tl_D":"Две клетки: в каждой 46 хромосом и 2c.","s4a_tl_G0":"G0: клетка вышла из цикла; 2c, ядерный геном не копируется.","s4a_tl_pop":"Набор клеток в один момент: распределение по количеству ДНК.","s4a_take":"Репликация ядерной ДНК — событие клеточного цикла: в S-фазе количество ДНК растёт от 2c до 4c, а число хромосом остаётся 46 до расхождения сестринских хроматид. Одним клеткам организма репликация нужна сейчас — делящимся предшественникам крови и клеткам крипт, которые обновляют ткань; другим — нет: клетки ворсинки и зрелые нейроны не делятся. Неделящаяся клетка при этом не «выключена»: в ней идут транскрипция, синтез белка и репарация ДНК. По одному распределению клеток по количеству ДНК нельзя рассчитать скорость обновления ткани и нельзя отличить G0 от G1. Как клетка переходит из фазы в фазу — семинар 6."},"notes":["Предшественники крови: многие клетки копируют ДНК.","Крипта: часть клеток в S-фазе — источник обновления эпителия.","Ворсинка: клетки не делятся, все 2c.","Зрелые нейроны: не делятся, все 2c."],"static":["Предшественники крови: многие клетки копируют ДНК."]}},"level":"adv"},{"id":"dna-distribution","section":3,"questions":[4],"title":"Что можно и чего нельзя узнать из распределения клеток по количеству ДНК?","keywords":["распределение по количеству ДНК","доля клеток в S-фазе","G0 и G1","границы вывода"],"lead":["Уже известно: в G1 — 2c, в S — между 2c и 4c, в G2 и митозе — 4c.","Новое: по снимку набора клеток можно сказать, сколько клеток копирует ДНК сейчас, но не всё о том, как ткань обновляется."],"mechanism":["[[T47|Распределение]] показывает, сколько клеток имеют 2c, сколько — промежуточное количество, сколько — 4c.","Клетки с промежуточным количеством ДНК сейчас в S-фазе; с 4c — в G2 или митозе.","Клетки с 2c могут быть и в G1, и в G0: по количеству ДНК их не различить.","Доля клеток в S-фазе зависит и от доли делящихся клеток, и от длительности S-фазы."],"paragraphs":["Поэтому по одному снимку нельзя рассчитать скорость обновления ткани: для этого нужны длительности фаз и наблюдение за клетками во времени.","Обратная задача: тип ткани не указан. Все клетки набора имеют 2c ДНК. В рамках учебной модели это означает, что ни у одной клетки сейчас нет промежуточного между 2c и 4c количества ДНК, характерного для S-фазы. Однако по одному количеству ДНК нельзя отличить G0 от G1 и определить, какие клетки вступят в S-фазу и будут делиться позднее.","Как это узнали: количество ДНК в каждой клетке измеряют по яркости красителя, который связывается с ДНК. Как устроен этот метод, для решения задачи знать не нужно.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Условные наборы из 12 клеток; числа подобраны для примера и не являются измерениями тканей.","sources":["Alberts2022"],"quiz":{"id":"S7-L41","question":"В наборе клеток крипты 3 из 12 клеток в S-фазе. Какой вывод корректен?","options":[{"id":"S7-L41-1","text":"Эпителий кишки обновляется на четверть каждые сутки","correct":false,"feedback":"Доля клеток в S-фазе не равна доле обновления за сутки: важны длительности фаз."},{"id":"S7-L41-2","text":"Четверть клеток копирует ДНК; скорость обновления по снимку не узнать","correct":true,"feedback":"Снимок даёт доли клеток в один момент, а не время."},{"id":"S7-L41-3","text":"Остальные 9 клеток набора не делятся и в цикл не вступят","correct":false,"feedback":"Клетки с 2c могут быть в G1, а клетки с 4c — в G2 или митозе: они тоже делящиеся."}]},"widget":{"kind":"dna","title":"","s":{"title":"Снимок набора клеток","status":"Учебная схема · условные наборы из 12 клеток","modes_label":"Набор","modes":["крипта","ворсинка","тип ткани не указан"],"scene":"a4","args":[["crypt","pop","G1"],["villus","pop","G1"],["neuron","pop","G1","mask"]],"L":{"s4a_ctx":"Клетки","s4a_ctx_blood":"предшественники крови","s4a_ctx_crypt":"кишка: крипта","s4a_ctx_villus":"кишка: ворсинка","s4a_ctx_neuron":"зрелые нейроны","s4a_view":"Показать","s4a_view_cell":"одну клетку","s4a_view_pop":"набор клеток","s4a_ph":"Состояние клетки","s4a_ph_G0":"G0","s4a_ph_G1":"G1","s4a_ph_S":"S","s4a_ph_G2":"G2","s4a_ph_M":"митоз до расхождения хроматид","s4a_ph_D":"после деления","s4a_pnote_pop":"В наборе клеток состояние не выбирается: клетки находятся в разных фазах.","s4a_pnote_pop_nodiv":"В наборе клеток состояние не выбирается: все клетки набора вне цикла (G0).","s4a_pnote_nodiv":"Эти клетки в модели не делятся и находятся вне цикла (G0); другие состояния недоступны.","s4a_lbl_ctx_blood":"предшественники клеток крови (большинство делится) · учебная схема","s4a_lbl_ctx_crypt":"кишка: клетки крипты (большинство делится) · учебная схема","s4a_lbl_ctx_villus":"кишка: клетки ворсинки (не делятся) · учебная схема","s4a_lbl_ctx_neuron":"зрелые нейроны · учебная схема","s4a_lbl_ctx_mask":"тип ткани не указан · учебная схема","s4a_lbl_cyc":"клеточный цикл","s4a_lbl_two":"в ядре 46 хромосом; показаны две","s4a_lbl_two_cells":"две дочерние клетки, в каждой 46 хромосом","s4a_lbl_s_mid":"пунктир — часть хроматиды, ещё не скопированная","s4a_lbl_dna":"количество ядерной ДНК","s4a_lbl_between":"между 2c и 4c","s4a_lbl_nodiv":"клетка вне цикла: ядерный геном не копируется","s4a_lbl_foot":"Диплоидная соматическая клетка человека; c — ДНК гаплоидного набора.","s4a_pop_2c":"2c: {n}","s4a_pop_mid":"между 2c и 4c (S-фаза): {n}","s4a_pop_4c":"4c (G2 и митоз): {n}","s4a_lbl_hist":"число клеток по количеству ДНК","s4a_lbl_foot_pop":"Условны  каждая хромосома уже содержит две молекулы.","s4a_cap_G2":"G2: 4c; 46 хромосом, в каждой две сестринские хроматиды — две одинаковые молекулы ДНК.","s4a_cap_G2_z":"Удвоилось количество ДНК, а не число хромосом.","s4a_cap_M":"Митоз до расхождения хроматид: 4c; 46 хромосом из двух сестринских хроматид.","s4a_cap_M_z":"Разделить можно только то, что уже скопировано.","s4a_cap_D":"После деления: две клетки, в каждой 2c и 46 хромосом по одной хроматиде.","s4a_cap_D_z":"Сестринские хроматиды разошлись, и каждая дочерняя клетка получила полный геном.","s4a_cap_nodiv_villus":"Клетки ворсинки не делятся: ядерной ДНК 2c, ядерный геном не копируется. Новые клетки ворсинки приходят из крипты.","s4a_cap_nodiv_villus_z":"Обновление ткани обеспечивают делящиеся клетки крипты, а не клетки ворсинки.","s4a_cap_nodiv_neuron":"Зрелые нейроны не делятся: ядерной ДНК 2c, ядерный геном не копируется. При этом идут транскрипция, синтез белка и репарация ДНК.","s4a_cap_nodiv_neuron_z":"Отсутствие репликации не означает, что клетка не синтезирует ДНК совсем: при репарации небольшие участки синтезируются заново.","s4a_cap_pop_blood":"Условный набор делящихся предшественников крови: {b} из 12 клеток копируют ядерную ДНК.","s4a_cap_pop_blood_z":"Делящихся клеток много — этим поддерживается образование клеток крови.","s4a_cap_pop_crypt":"Условный набор клеток крипты: {b} из 12 клеток копируют ядерную ДНК.","s4a_cap_pop_crypt_z":"Деление клеток в криптах обновляет эпителий кишки.","s4a_cap_pop_villus":"Условный набор клеток ворсинки: все 12 клеток 2c, ни одна не копирует ядерную ДНК.","s4a_cap_pop_villus_z":"Клетки ворсинки — дифференцированные, неделящиеся; они обновляются за счёт крипты.","s4a_cap_pop_neuron":"Условный набор зрелых нейронов: все 12 клеток 2c, ни одна не копирует ядерную ДНК.","s4a_cap_pop_neuron_z":"По одному этому снимку не отличить неделящиеся клетки от делящихся, которые сейчас в G1.","s4a_cap_mask":"Наблюдение: распределение 12 клеток по количеству ДНК. Тип ткани не указан.","s4a_cap_mask_z":"Решите, что можно заключить из одного этого распределения, а что нельзя.","s4a_tl_note":"Время шкалы условное: реальные длительности фаз не показаны.","s4a_tl_G1":"G1: 46 хромосом, каждая из одной хроматиды; количество ДНК 2c.","s4a_tl_S":"S: ядерная ДНК копируется; количество ДНК между 2c и 4c, хромосом по-прежнему 46.","s4a_tl_G2":"G2: копирование завершено; 46 хромосом по две хроматиды, 4c.","s4a_tl_M":"Митоз: 46 хромосом по две хроматиды; затем сестринские хроматиды расходятся в дочерние клетки.","s4a_tl_D":"Две клетки: в каждой 46 хромосом и 2c.","s4a_tl_G0":"G0: клетка вышла из цикла; 2c, ядерный геном не копируется.","s4a_tl_pop":"Набор клеток в один момент: распределение по количеству ДНК.","s4a_take":"Репликация ядерной ДНК — событие клеточного цикла: в S-фазе количество ДНК растёт от 2c до 4c, а число хромосом остаётся 46 до расхождения сестринских хроматид. Одним клеткам организма репликация нужна сейчас — делящимся предшественникам крови и клеткам крипт, которые обновляют ткань; другим — нет: клетки ворсинки и зрелые нейроны не делятся. Неделящаяся клетка при этом не «выключена»: в ней идут транскрипция, синтез белка и репарация ДНК. По одному распределению клеток по количеству ДНК нельзя рассчитать скорость обновления ткани и нельзя отличить G0 от G1. Как клетка переходит из фазы в фазу — семинар 6."},"notes":["Крипта: 3 клетки в S-фазе, 2 — с 4c.","Ворсинка: все клетки 2c.","Все клетки 2c, ткань не указана: G0 от G1 по этому распределению не отличить."],"static":["Крипта: 3 клетки в S-фазе, 2 — с 4c."]}},"level":"adv"},{"id":"system-map","section":3,"questions":[1,2,3,4],"title":"Как клетка завершает копирование ДНК: карта зависимостей","keywords":["системная карта","зависимости","незавершённое копирование","различающее наблюдение"],"lead":["Уже известно из четырёх продвинутых шагов: синтез ограничивают субстрат, работа вилок, созревание цепей и состояние клетки.","Новое: свести их в одну карту и увидеть, что одинаковый итог может иметь разные причины."],"mechanism":["Ресурсы (dNTP) и подготовленные до S-фазы точки начала — условия работы вилок.","Работа вилок даёт новые цепи, которые затем созревают.","Готовые, непрерывные дочерние молекулы — в норме условие перехода клетки к митозу.","Нужна ли репликация вообще, зависит от того, находится ли клетка в цикле."],"paragraphs":["Стрелки карты — зависимости, а не последовательность реакций: запас dNTP и работа вилок существуют одновременно, точки начала подготавливаются до S-фазы, а созревание фрагментов идёт вслед за вилкой.","Незавершённое копирование — общий итог разных ограничений: нехватки dNTP, остановки вилок без резерва, незавершённого созревания. Чтобы назвать причину, нужно второе, различающее наблюдение: где остановился синтез и какой нуклеотид там нужен; есть ли нескопированный промежуток и были ли рядом подготовленные точки; что осталось в новой цепи.","Скопировать — ещё не значит скопировать без ошибок. Насколько точно копируется ДНК и как исправляются ошибки — семинар 8.","Карта есть и в практикуме: уровень «Продвинутый», внизу страницы, с итоговым вопросом."],"conditions":"Карта условная: она не показывает скоростей и вероятностей, только зависимости между условиями четырёх моделей.","sources":["Alberts2022","Saxena2022","Blow2011"],"quiz":{"id":"S7-L42","question":"В двух моделях наблюдается незавершённое копирование ДНК. Почему по одному этому наблюдению нельзя назвать единственную причину?","options":[{"id":"S7-L42-1","text":"Причина всегда одна — неисправный фермент","correct":false,"feedback":"В моделях 1–3 все ферменты исправны, а копирование всё равно не завершается."},{"id":"S7-L42-2","text":"Незавершённое копирование всегда означает, что клетка вне цикла","correct":false,"feedback":"Клетка вне цикла не начинает репликацию вовсе — это другое наблюдение."},{"id":"S7-L42-3","text":"Один итог дают разные ограничения; их различают по промежуточным продуктам","correct":true,"feedback":"Нехватка dNTP, остановка вилок без резерва и незавершённое созревание приводят к одному итогу разными путями."}]},"widget":{"kind":"dna","title":"","s":{"title":"Карта зависимостей","status":"Учебная схема · стрелки — зависимости, а не последовательность реакций","modes_label":"Нарушение","modes":["нарушений нет","нет dNTP","вилки остановились, резерва нет","созревание не завершено","клетка вне цикла"],"scene":"amap","args":[["none"],["dntp"],["reserve"],["mature"],["g0"]],"L":{"amap_t":"Как клетка завершает копирование ДНК","amap_hit":"здесь действует выбранное нарушение","amap_lead":"Карта связывает четыре продвинутые модели. Стрелки показывают зависимости, а не последовательность реакций: ресурсы и вилки работают одновременно, точки начала подготавливаются до S-фазы, созревание фрагментов идёт вслед за вилкой.","amap_f":"Нарушение","amap_f_none":"нет","amap_f_dntp":"нет dNTP (модель 1)","amap_f_reserve":"вилки остановились, резерва нет (модель 2)","amap_f_mature":"созревание не завершено (модель 3)","amap_f_g0":"клетка вне цикла (модель 4)","amap_head":"карта зависимостей · учебная схема","amap_n_res":"Ресурсы|dNTP","amap_n_ori":"Точки начала,|подготовленные|до S-фазы","amap_n_fork":"Работа вилок","amap_n_mat":"Синтез и созревание|новых цепей","amap_n_done":"Готовые дочерние|молекулы ДНК","amap_n_cyc":"Клеточный цикл,|обновление ткани","amap_out_ok":"Копирование завершено: в норме клетка может переходить к митозу","amap_out_incomplete":"Копирование не завершено","amap_out_none":"Копирование не начинается — для неделящейся клетки это норма","amap_alt_none":"Нарушений нет: dNTP в достатке, вилки движутся, при задержке есть подготовленные точки, фрагменты созревают — дочерние молекулы готовы, в норме клетка может перейти к митозу.","amap_alt_dntp":"Нет одного dNTP: ферменты исправны, но вилки не могут продолжить синтез там, где нужен этот нуклеотид. Итог: копирование не завершено.","amap_alt_reserve":"Две встречные вилки остановились и в модели не возобновляются, а подготовленной точки между ними нет или она в этой клетке не запустилась: промежуток скопировать некому. Итог: копирование не завершено.","amap_alt_mature":"Вилки прошли весь участок, но в новых цепях остались РНК, бреши или разрывы. Итог: дочерние молекулы не готовы.","amap_alt_g0":"Клетка вне цикла (зрелый нейрон, клетка ворсинки): репликация ядерной ДНК не начинается. Это не нарушение, а состояние клетки.","amap_note":"Схема условная: она не показывает скорости и вероятности, только зависимости между условиями из четырёх моделей.","amap_q":"В двух моделях наблюдается незавершённое копирование ДНК. Почему по одному этому наблюдению нельзя сразу назвать единственную причину?","amap_hint_t":"Подсказка","amap_h1":"Сравните модели 1 и 2: что в каждой из них показывает, почему копирование не завершилось?","amap_o1":"Один итог дают разные ограничения; их различает второе наблюдение — место остановки, промежуток или состав цепи","amap_o2":"Причина всегда одна — неисправный фермент вилки; нехватка dNTP или резерва к такому итогу не приводит","amap_o3":"Незавершённое копирование всегда означает, что клетка вышла из цикла и больше не будет делиться","amap_w2":"В моделях 1–3 все ферменты исправны, а копирование всё равно не завершается: ограничением служат субстрат, геометрия вилок и незавершённые операции.","amap_w3":"Клетка вне цикла не начинает репликацию вовсе — это другое наблюдение, а не незавершённое копирование.","amap_e":"Незавершённое копирование — общий итог нескольких разных ограничений. Чтобы назвать причину, нужно второе, различающее наблюдение: где остановился синтез и какой нуклеотид там нужен; где остался нескопированный промежуток и были ли рядом подготовленные точки; что осталось в новой цепи — РНК, бреши или разрывы."},"notes":["Нарушений нет: дочерние молекулы готовы.","Нет dNTP: вилки не продолжают синтез — копирование не завершено.","Две вилки остановились, резерва нет — промежуток не скопирован.","Вилки прошли, но новые цепи не непрерывны.","Клетка вне цикла: репликация не начинается — это норма для неделящейся клетки."],"static":["Нарушений нет: дочерние молекулы готовы."]}},"level":"adv"},{"id":"exit-fidelity","section":3,"questions":[4],"title":"Что дальше: насколько точно копируется ДНК","keywords":["точность репликации","корректура","репарация","семинар 8"],"lead":["Реплисома копирует обе цепи. Следующий вопрос — насколько точно.","Комплементарность задаёт, какой нуклеотид встанет напротив матрицы; как исправляются ошибки, разбирается на следующем семинаре."],"mechanism":["Точность копирования складывается из нескольких уровней: выбор нуклеотида по комплементарности, исправление ошибок самой полимеразой и исправление ошибок после репликации.","Почему затравка — РНК и почему её удаляют, тоже связано с точностью: этот вопрос продолжается на семинаре 8.","Почему копирование концов линейных хромосом представляет отдельную проблему, разберём в семинаре 8."],"paragraphs":["Следующий семинар курса — «Сохранность генома: три уровня точности и цена ошибки».",{"h":"Дальше в курсе «Молекулярная биология»"},"Как после репликации полуметилированная ДНК снова становится метилированной на обеих цепях — [[https://fresll.github.io/molbio/seminar-6-route.html#maintenance|МБ, семинар 6, шаг 3]]."],"conditions":"Обзорный шаг; подробности — на семинаре 8.","sources":["Alberts2022"],"quiz":{"id":"S7-L26","question":"Какой вопрос о репликации остаётся на следующий семинар?","options":[{"id":"S7-L26-1","text":"Почему отстающая цепь синтезируется фрагментами","correct":false,"feedback":"Это разобрано в разделе 3 этого семинара."},{"id":"S7-L26-2","text":"Как исправляются ошибки копирования","correct":true,"feedback":"Корректура и репарация — тема семинара 8."},{"id":"S7-L26-3","text":"Откуда начинается репликация","correct":false,"feedback":"Точки начала разобраны в разделе 2 этого семинара."}]},"widget":{"kind":"dna","title":"","s":{"title":"Реплисома в сборе: копирование идёт","status":"Схема качественная · длины условные","modes_label":"Состав","modes":["полный набор"],"scene":"s4b","args":[["none"]],"L":{"s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s4_off":"Какой компонент убран","s4_off_none":"ничего (полный набор)","s4_off_ssb":"белки SSB","s4_off_rfc":"погрузчик зажима","s4_off_nuc":"нуклеазы удаления затравок","s4_lbl_head":"реплисома у правой вилки; длины условные","s4_lbl_gap":"бреши","s4_lbl_hp":"шпильки в одноцепочечной матрице","s4_lbl_off_none":"полный набор: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются","s4_lbl_off_ssb":"без SSB: на матрице отстающей цепи шпильки, новый фрагмент не начат","s4_lbl_off_rfc":"без погрузчика зажима: зажим не надет, полимеразы синтезируют короткие отрезки","s4_lbl_off_nuc":"без нуклеаз: РНК-затравки остаются, фрагменты не сшиты","s4_lbl_off_q":"какой компонент убран? — определите по продукту","s4_lbl_status":"учебная модель: исход отсутствия одного компонента","s4_r_lead":"Ведущая цепь","s4_v_lead_ok":"растёт непрерывно вслед за вилкой","s4_v_lead_slow":"отстаёт от вилки: полимераза часто отходит от матрицы","s4_r_lag":"Отстающая цепь","s4_v_lag_mature":"фрагменты созревают и сшиваются","s4_v_lag_blocked":"новый фрагмент не синтезируется","s4_v_lag_short":"короткие отрезки, между ними бреши","s4_v_lag_primers":"фрагменты полной длины с РНК-затравками, не сшиты","s4_r_ss":"Одноцепочечная матрица у вилки","s4_r_ss_s":"участок, ещё не скопированный","s4_v_ss_short":"покрыта SSB, выпрямлена","s4_v_ss_hairpin":"образует шпильки","s4_cap_none":"Полный набор. Хеликаза расплетает ДНК, топоизомераза впереди вилки снимает напряжение, SSB покрывают одноцепочечную матрицу. Ведущая цепь растёт непрерывно; на отстающей праймаза синтезирует затравки, полимераза δ с зажимом удлиняет фрагмент, нуклеазы удаляют затравки, лигаза сшивает фрагменты.","s4_cap_none_z":"У каждого белка вилки своя операция; если одного не хватает, вилка оставляет характерный промежуточный продукт — по нему и определяют, чего не хватает.","s4_cap_ssb":"Без SSB одноцепочечная матрица отстающей цепи не выпрямлена: случайно комплементарные короткие участки спариваются и образуют шпильки. Шпильки мешают ДНК-полимеразе, и новый фрагмент Оказаки не синтезируется.","s4_cap_ssb_z":"SSB не синтезируют и не расплетают ДНК: они кооперативно связываются с одноцепочечной ДНК, которую образовала хеликаза, и держат её в форме, удобной для полимеразы.","s4_cap_rfc":"Без погрузчика зажим не надевается на ДНК. Полимераза без зажима синтезирует лишь короткий отрезок и отходит от матрицы: ведущая цепь отстаёт от вилки, фрагменты отстающей цепи короткие и не доходят до предыдущих — между ними бреши.","s4_cap_rfc_z":"Зажим не синтезирует ДНК; он удерживает полимеразу на матрице, а надевает его погрузчик с затратой АТФ.","s4_cap_nuc":"Без нуклеаз удаления затравок фрагменты Оказаки синтезированы полностью: каждый доходит до РНК-затравки на 5′-конце предыдущего. Но затравка остаётся в цепи. При нормальном созревании РНК-затравку удаляют, её место заполняют ДНК, и только затем лигаза сшивает разрыв между двумя участками ДНК; здесь фрагменты остаются несшитыми.","s4_cap_nuc_z":"Лигаза в норме сшивает разрыв между 3′-OH одного участка ДНК и 5′-фосфатом соседнего; РНК-затравку перед этим удаляют, а её место заполняют ДНК."},"notes":["Работающая вилка: обе цепи копируются, фрагменты созревают за вилкой; насколько точно копируется ДНК — на семинаре 8."],"static":["Работающая вилка: обе цепи копируются, фрагменты созревают за вилкой; насколько точно копируется ДНК — на семинаре 8."]}}}],"sections":[{"title":"Комплементарность и матричный принцип","entry":"template-principle","sub":"Почему строение двойной спирали делает возможным точное копирование"},{"title":"Полуконсервативная репликация: точка начала и две вилки","entry":"origin-bubble","sub":"Как дочерние молекулы получают старую и новую цепь и откуда начинается копирование"},{"title":"Ведущая и отстающая цепи","entry":"fork-asymmetry","sub":"Почему одна новая цепь растёт непрерывно, а другая — фрагментами"},{"title":"От репликационной вилки к клетке","entry":"replisome","sub":"Базовый уровень — белки репликационной вилки, их функции и промежуточные продукты, по которым видно, какого из них нет; сверх программы — когда клетка копирует ДНК в клеточном цикле и что это значит для обновления тканей"}],"glossary":[{"id":"S7-T01","term":"Матрица","section":0,"def":"Цепь ДНК, по которой строится новая цепь: напротив каждого её основания встаёт комплементарный нуклеотид. При репликации матрицей служит каждая из двух родительских цепей."},{"id":"S7-T02","term":"Новая (дочерняя) цепь ДНК","section":0,"def":"Цепь, которую ДНК-полимераза строит по матрице в направлении 5′→3′; она комплементарна и антипараллельна матрице."},{"id":"S7-T03","term":"Затравка (праймер)","section":0,"def":"Короткий участок нуклеиновой кислоты, спаренный с матрицей, со свободным 3′-OH, к которому ДНК-полимераза присоединяет первый нуклеотид. При репликации затравки — короткие молекулы РНК, их синтезирует праймаза."},{"id":"S7-T04","term":"Аналог нуклеотида без 3′-OH","section":0,"def":"Нуклеотид, у которого в сахаре нет 3′-гидроксильной группы (например, дидезоксинуклеотид). Он встаёт напротив комплементарного основания, но следующий нуклеотид присоединить нельзя, и цепь обрывается."},{"id":"S7-T05","term":"Дезоксирибонуклеозидтрифосфаты (dNTP)","section":0,"def":"dATP, dTTP, dGTP и dCTP — субстраты ДНК-полимеразы. При присоединении нуклеотида к цепи отщепляется пирофосфат, и в цепи остаётся один фосфат."},{"id":"S7-T06","term":"Водородные связи пар оснований","section":0,"def":"Связи между основаниями двух цепей: в паре A–T две, в паре G–C три. Они определяют, какие основания образуют пару (комплементарность)."},{"id":"S7-T07","term":"ДНК-полимераза","section":0,"def":"Фермент, который присоединяет дезоксирибонуклеотиды к 3′-OH растущей цепи по матрице; синтезирует цепь только в направлении 5′→3′ и не начинает её без затравки."},{"id":"S7-T11","term":"Реплисома","section":3,"def":"Комплекс белков, работающий в репликационной вилке: хеликаза, ДНК-полимеразы, праймаза, зажим и его погрузчик, белки, связывающие одноцепочечную ДНК, и другие белки, которые к ним присоединяются."},{"id":"S7-T13","term":"Двойная спираль (дуплекс)","section":0,"def":"Две антипараллельные комплементарные цепи ДНК, закрученные вокруг общей оси; основания внутри, сахаро-фосфатный остов снаружи."},{"id":"S7-T14","term":"Точка начала репликации (ориджин)","section":1,"def":"Участок ДНК, где начинается репликация: здесь собираются белки инициации и образуются две репликационные вилки. У эукариот точки начала узнаёт комплекс ORC."},{"id":"S7-T15","term":"Пузырёк репликации","section":1,"def":"Участок между двумя вилками, расходящимися от одной точки начала: внутри него ДНК уже скопирована, снаружи — родительская двойная спираль."},{"id":"S7-T16","term":"Репликационная вилка","section":1,"def":"Y-образная область, где родительская двойная спираль расплетается и обе цепи копируются; движется вдоль ДНК вместе с комплексом белков — реплисомой."},{"id":"S7-T17","term":"Репликон","section":1,"def":"Участок ДНК, который копируется от одной точки начала репликации."},{"id":"S7-T18","term":"ДНК-хеликаза","section":3,"def":"Фермент, который движется по ДНК и разделяет цепи двойной спирали за счёт гидролиза АТФ. У эукариот репликативная хеликаза — комплекс CMG (Cdc45–MCM–GINS)."},{"id":"S7-T19","term":"Белки, связывающие одноцепочечную ДНК (SSB; у эукариот RPA)","section":3,"def":"Белки, которые кооперативно связываются с одноцепочечной ДНК, выпрямляют её и не дают образовываться шпилькам и восстанавливаться двойной спирали."},{"id":"S7-T20","term":"Праймаза","section":2,"def":"РНК-полимераза, которая синтезирует короткие РНК-затравки на матрице и начинает синтез без готовой затравки (ей не нужен готовый 3′-конец). У эукариот работает в комплексе с ДНК-полимеразой α, которая удлиняет затравку короткой ДНК."},{"id":"S7-T21","term":"Скользящий зажим (PCNA)","section":2,"def":"PCNA — ядерный антиген пролиферирующих клеток. Белковое кольцо, охватывающее ДНК и удерживающее полимеразу на матрице при движении; освобождает полимеразу, когда та заканчивает фрагмент и доходит до предыдущего."},{"id":"S7-T22","term":"Погрузчик зажима (RFC)","section":2,"def":"RFC — репликационный фактор C. Белковый комплекс, который размыкает кольцо зажима и надевает его на ДНК у конца затравки, гидролизуя АТФ."},{"id":"S7-T23","term":"Нуклеазы удаления затравки","section":2,"def":"Ферменты, которые удаляют РНК-затравки фрагментов Оказаки. У бактерий затравку удаляют нуклеазы, узнающие РНК в гибриде РНК–ДНК; у эукариот полимераза δ, достраивая следующий фрагмент, отгибает затравку в одноцепочечный лоскут, и его срезает флэп-эндонуклеаза FEN1."},{"id":"S7-T24","term":"ДНК-лигаза","section":2,"def":"Фермент, который соединяет 3′-OH одного фрагмента с 5′-фосфатом соседнего фосфодиэфирной связью; у эукариот использует энергию АТФ."},{"id":"S7-T25","term":"ДНК-топоизомераза","section":3,"def":"Фермент, который снимает напряжение витков двойной спирали впереди вилки, временно разрывая и снова соединяя одну (тип I) или обе (тип II) цепи."},{"id":"S7-T26","term":"Разрыв цепи","section":2,"def":"Отсутствие одной фосфодиэфирной связи между соседними нуклеотидами одной цепи; все нуклеотиды на месте. Разрыв сшивает ДНК-лигаза."},{"id":"S7-T27","term":"Фрагмент Оказаки","section":2,"def":"Короткий отрезок новой ДНК отстающей цепи с РНК-затравкой на 5′-конце; у эукариот 100–200 нуклеотидов, у бактерий 1000–2000."},{"id":"S7-T28","term":"Ведущая цепь","section":2,"def":"Новая цепь, которая растёт в направлении движения вилки и синтезируется непрерывно."},{"id":"S7-T29","term":"Отстающая цепь","section":2,"def":"Новая цепь, которая растёт против направления движения вилки и синтезируется короткими фрагментами Оказаки."},{"id":"S7-T30","term":"ДНК-полимераза α","section":2,"def":"Полимераза, связанная с праймазой: удлиняет РНК-затравку коротким участком ДНК (около 20 нуклеотидов); корректирующей активности у неё нет."},{"id":"S7-T31","term":"ДНК-полимераза δ","section":2,"def":"Основная полимераза отстающей цепи у эукариот: удлиняет затравки вместе с зажимом PCNA и при подходе к предыдущему фрагменту вытесняет его 5′-конец."},{"id":"S7-T32","term":"ДНК-полимераза ε","section":2,"def":"Основная полимераза ведущей цепи у эукариот, связанная с хеликазой CMG."},{"id":"S7-T35","term":"Запас dNTP","section":0,"def":"Свободные dATP, dTTP, dGTP и dCTP в клетке, из которых ДНК-полимераза строит новую цепь. Для синтеза нужен каждый из четырёх: недостающий нуклеотид другим не заменяется без ошибки. Нехватка dNTP замедляет движение репликационных вилок."},{"id":"S7-T36","term":"Резервная точка начала репликации","section":1,"def":"Точка начала, подготовленная к запуску до S-фазы, которая в данной клетке в начале S-фазы не запустилась. Если её скопирует проходящая вилка, в этой S-фазе она уже не запустится. Если соседняя вилка задержалась, а точка ещё не скопирована, она может запуститься и дать две новые вилки, но не обязательно. Резервной точка бывает не навсегда: какие из подготовленных точек запустятся, во многом случайно, и в другой клетке та же точка может работать. В S-фазе новые точки начала не подготавливаются."},{"id":"S7-T37","term":"Остановленная репликационная вилка","section":1,"def":"Вилка, которая перестала продвигаться — например, при нехватке dNTP или встрече с препятствием на матрице. Нескопированный участок за ней может закрыть встречная вилка или вилки резервной точки начала."},{"id":"S7-T39","term":"Брешь в новой цепи","section":2,"def":"Промежуток в новой цепи, где нет нуклеотидов, — например, после удаления РНК-затравки. Брешь заполняет ДНК-полимераза; лигаза соединяет только соседние нуклеотиды, между которыми промежутка нет."},{"id":"S7-T41","term":"Состояние G0","section":3,"def":"Состояние клетки вне клеточного цикла: клетка не готовится к делению, ядерная ДНК не копируется (2c). Многие клетки могут вернуться из G0 в цикл; зрелые нейроны и клетки ворсинки кишки не делятся."},{"id":"S7-T42","term":"Хроматида","section":3,"def":"Одна двухцепочечная молекула ДНК хромосомы вместе с белками. После S-фазы хромосома состоит из двух сестринских хроматид — двух одинаковых молекул ДНК, полученных при репликации."},{"id":"S7-T45","term":"Количество ядерной ДНК (c)","section":3,"def":"c — количество ДНК гаплоидного набора хромосом. В диплоидной соматической клетке человека в G1 и G0 — 2c, после S-фазы (G2, митоз до расхождения хроматид) — 4c, в S-фазе — между 2c и 4c."},{"id":"S7-T47","term":"Распределение клеток по количеству ДНК","section":3,"def":"Число клеток набора с 2c, с промежуточным количеством и с 4c в один момент. По нему видно, сколько клеток сейчас в S-фазе и в G2 или митозе, но нельзя отличить G0 от G1 и нельзя рассчитать скорость обновления ткани."}],"sources":{"Alberts2022":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»","doi":"","pmid":""},"Meselson1958":{"url":"https://doi.org/10.1073/pnas.44.7.671","cite":"Meselson M., Stahl F. W. The replication of DNA in Escherichia coli. Proc Natl Acad Sci USA. 1958;44:671–682","doi":"10.1073/pnas.44.7.671","pmid":"16590258"},"Jackson1998":{"url":"https://doi.org/10.1083/jcb.140.6.1285","cite":"Jackson D. A., Pombo A. Replicon clusters are stable units of chromosome structure: evidence that nuclear organization contributes to the efficient activation and propagation of S phase in human cells. J Cell Biol. 1998;140:1285–1295","doi":"10.1083/jcb.140.6.1285","pmid":"9508763"},"Smith2012":{"url":"https://doi.org/10.1038/nature10895","cite":"Smith D. J., Whitehouse I. Intrinsic coupling of lagging-strand synthesis to chromatin assembly. Nature. 2012;483:434–438","doi":"10.1038/nature10895","pmid":"22419157"},"Saxena2022":{"url":"https://doi.org/10.1016/j.molcel.2022.05.004","cite":"Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314","doi":"10.1016/j.molcel.2022.05.004","pmid":"35714587"},"Carrington2025":{"url":"https://doi.org/10.1186/s13059-025-03591-w","cite":"Carrington J. T., Wilson R. H. C., de La Vega E., Thiyagarajan S., Barker T., Catchpole L., Durrant A., Knitlhoffer V., Watkins C., Gharbi K., Nieduszynski C. A. Most human DNA replication initiation is dispersed throughout the genome with only a minority within previously identified initiation zones. Genome Biol. 2025;26:122","doi":"10.1186/s13059-025-03591-w","pmid":"40346587"},"Stillman2025":{"url":"https://doi.org/10.1038/s41594-025-01587-5","cite":"Stillman B., Diffley J. F. X., Iwasa J. H. Mechanisms for licensing origins of DNA replication in eukaryotic cells. Nat Struct Mol Biol. 2025;32:1143–1153","doi":"10.1038/s41594-025-01587-5","pmid":"40588663"},"Blow2011":{"url":"https://doi.org/10.1016/j.tibs.2011.05.002","cite":"Blow J. J., Ge X. Q., Jackson D. A. How dormant origins promote complete genome replication. Trends Biochem Sci. 2011;36:405–414","doi":"10.1016/j.tibs.2011.05.002","pmid":"21641805"},"Alver2014":{"url":"https://doi.org/10.1016/j.dnarep.2014.03.012","cite":"Alver R. C., Chadha G. S., Blow J. J. The contribution of dormant origins to genome stability: from cell biology to human genetics. DNA Repair (Amst). 2014;19:182–189","doi":"10.1016/j.dnarep.2014.03.012","pmid":"24767947"},"Reid2021":{"url":"https://doi.org/10.1126/science.abb9032","cite":"Reid D. A., Reed P. J., Schlachetzki J. C. M. et al. Incorporation of a nucleoside analog maps genome repair sites in postmitotic human neurons. Science. 2021;372:91–94","doi":"10.1126/science.abb9032","pmid":"33795458"}},"questions":["Комплементарность","Точка начала и две вилки","Ведущая и отстающая цепи","От репликационной вилки к клетке"],"exam_ids":["nucleotide-chain","double-helix","template-principle","semiconservative","origin-bubble","replicon","fork-asymmetry","bubble-roles","lagging-primers","replisome","unwinding","missing-component"],"practice_url":"seminar-7.html","open_questions":[]};
/* Объяснения к семинару 7. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => s.replace(/(шаге? )?БИО-7·(\d+)((?:, 7·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
const rt = s => stepRefs(esc(s)).replace(/\[\[(T\d{2,3})\|([^\]]+)\]\]/g, (_, id, t) => `<a class="gl" href="#glossary-S7-${id}" data-gloss="S7-${id}">${t}</a>`)
  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */
const ncap = s => esc(s).replace(/Ca(?=²⁺)/g, '<span style="text-transform:none">Ca</span>');
const plain = s => String(s).replace(/\[\[(T\d{2,3}|https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, '$2');

/* ---------- хранение: один ключ, шаги и итоговая проверка раздельно ---------- */
const KEY = 'bio-s7-explanations-v1-progress';
let store = {v: 1, steps: {}, exam: {}}, state = {}, current = 'home';
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.v === 1) store = {v: 1, steps: raw.steps || {}, exam: raw.exam || {}, last: raw.last || null};
} catch (e) {}
/* ревизия вопроса (quiz.rev, по умолчанию 1): после содержательной правки вопроса rev увеличивают, и прежняя отметка не засчитывается;
   записи шагов, которых больше нет, не учитываются. Записи без rev считаются rev 1 — прежний прогресс сохраняется. */
const qrev = l => l.quiz.rev || 1;
(function () {
  const cur = {}; CONTENT.lessons.forEach(l => { cur[l.id] = qrev(l); });
  ['steps', 'exam'].forEach(k => Object.keys(store[k]).forEach(id => { const r = store[k][id]; if (!(id in cur) || !r || (r.rev || 1) !== cur[id]) delete store[k][id]; }));
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} renderNav(); };
/* v1.8: запоминаем, где читатель остановился. iPhone и встроенные браузеры при возврате в приложение перезагружают страницу по исходному адресу
   (без #шаг) — раньше после этого открывалась начальная страница, а шаг приходилось искать заново. Теперь шаг и положение прокрутки восстанавливаются
   (если прошло меньше 14 дней); кнопка начальной страницы в шапке по-прежнему открывает начало. */
const LAST_TTL = 14 * 24 * 3600 * 1000;
/* пишется только поле last в свежих данных хранилища: так запись положения не затирает прогресс, изменённый в другой вкладке или сброшенный */
const saveLast = (id, y) => { store.last = {id: id, y: y || 0, t: Date.now()}; try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); const base = raw && raw.v === 1 ? raw : {v: 1, steps: {}, exam: {}}; base.last = store.last; localStorage.setItem(KEY, JSON.stringify(base)); } catch (e) {} };
const rememberScroll = () => { if (store.last) saveLast(store.last.id, Math.round(window.scrollY || 0)); };
let scrollTimer = 0;
window.addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(rememberScroll, 250); }, {passive: true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') rememberScroll(); });
window.addEventListener('pagehide', rememberScroll);
const lessonById = id => CONTENT.lessons.find(x => x.id === id);
const lessonIndex = id => CONTENT.lessons.findIndex(x => x.id === id);
const stepsDone = () => CONTENT.lessons.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;

/* ---------- порядок вариантов: перемешивается при открытии страницы; ?fixed — постоянный порядок ---------- */
const params = new URLSearchParams(location.search);
const FIXQ = params.has('fixed') ? '?fixed' : '';  /* каркас с 23.10.2026 (из сем. 7 v3.8, аудит A09): ссылки на практикум сохраняют ?fixed */
const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');
const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => ORDER[l.id] || (ORDER[l.id] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id));
const optById = (l, id) => l.quiz.options.find(o => o.id === id);
const EXAM_IDS = SHUFFLE ? shuffled(CONTENT.exam_ids) : CONTENT.exam_ids.slice();
const LETTERS = ['А', 'Б', 'В'];

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};

function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {

    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;

/* =====================================================================
   s0_figs_dna.js — детали схем семинара 7 (ДНК и репликация). Общие для практикума и «Объяснений».
   Условности (как в колоде занятия): тёмно-синяя цепь — старая (матрица), светло-синяя — новая,
   оранжевая — РНК-затравка; красный — дефект или убранная деталь. Это схемы, не химические формулы.
   Белки вилки: хеликаза — зелёное кольцо; ДНК-полимераза — фиолетовая; зажим PCNA — бирюзовое кольцо;
   погрузчик зажима — коричневый; SSB/RPA — жёлтые овалы; праймаза — оранжево-коричневая; лигаза — розовая;
   нуклеазы удаления затравки — серо-синие; топоизомераза — тёмно-фиолетовая.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t() в сценах).
   Группы data-g — для справки по детали (термины словаря: gn_<g>, g_<g>).
   ===================================================================== */
const DN = (function () {
  const C = { old: '#1F3B73', neu: '#8DB4E2', neuD: '#4F86C6', rna: '#E8912A', rung: '#B9C4D2', red: '#C0392B',
    hel: '#2E9B57', pol: '#7C4DBE', pcna: '#1F8A8A', rfc: '#8A5A12', ssb: '#F2C230', prim: '#C96A1E',
    lig: '#D9579B', nuc: '#5E6E80', topo: '#3B2F63', grey: '#7A8899', ink: '#1E2733', ori: '#2E9B57', light: '#9DB0C8' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* наконечник 3′-конца растущей цепи: dir = +1 вправо, −1 влево */
  function head(x, y, dir, col, s = 7) {
    return `<path d="M${f(x + dir * s)},${f(y)} L${f(x - dir * s * .6)},${f(y - s)} L${f(x - dir * s * .6)},${f(y + s)} Z" fill="${col}"/>`;
  }
  /* концевая подпись 5′ / 3′ */
  function end(x, y, txt, anchor = 'middle', col = C.ink) {
    return `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="12" font-weight="600" fill="${col}" style="text-anchor:${anchor}">${txt}</text>`;
  }
  /* поперечные «ступеньки» пар оснований */
  function rungs(x1, x2, ya, yb, step = 14, col = C.rung) {
    let s = ''; for (let x = x1; x <= x2 + .01; x += step) s += line(x, ya, x, yb, col, 2.6, 'stroke-linecap="butt"');
    return s;
  }
  /* цепь: отрезок с необязательным наконечником на 3′-конце */
  function strand(x1, x2, y, col, o = {}) {
    let s = line(x1, y, x2, y, col, o.w || 6, o.dash ? `stroke-dasharray="${o.dash}"` : '');
    if (o.grow === 1) s += head(x2 + 4, y, 1, col);
    if (o.grow === -1) s += head(x1 - 4, y, -1, col);
    return s;
  }
  /* основание в рамке с буквой (вкладка 1) */
  function base(x, y, L, col, o = {}) {
    const fill = o.fill || '#fff', st = o.stroke || col;
    return `<rect x="${f(x - 13)}" y="${f(y - 13)}" width="26" height="26" rx="5" fill="${fill}" stroke="${st}" stroke-width="${o.sw || 2}"/>` +
      `<text class="lbl" x="${f(x)}" y="${f(y + 5)}" font-size="15" font-weight="700" fill="${o.ink || C.ink}">${L}</text>`;
  }
  /* белки вилки */
  const helicase = (x, y, r = 17, op = 1) => G('helicase', `<g opacity="${op}">` + Array.from({ length: 6 }, (_, i) => {
      const a = i / 6 * 2 * Math.PI; return `<circle cx="${f(x + Math.cos(a) * r * .62)}" cy="${f(y + Math.sin(a) * r * .62)}" r="${f(r * .42)}" fill="${C.hel}" stroke="#1d6b3c" stroke-width="1"/>`;
    }).join('') + `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r * .28)}" fill="#fff"/></g>`);
  const polymerase = (x, y, w = 40, h = 26, g = 'polymerase', col = C.pol) => G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${w}" height="${h}" rx="${h / 2}" fill="${col}" stroke="#4b2d80" stroke-width="1.2" opacity=".92"/>`);
  /* аудит Codex A22 (v1.4): кольцо зажима охватывает дуплекс «новая цепь — матрица»; yT — уровень матрицы (без него — прежний рисунок) */
  const clamp = (x, y, op = 1, yT) => yT == null ? G('pcna', `<ellipse cx="${f(x)}" cy="${f(y)}" rx="7" ry="15" fill="none" stroke="${C.pcna}" stroke-width="5" opacity="${op}"/>`)
    : G('pcna', `<ellipse cx="${f(x)}" cy="${f((y + yT) / 2)}" rx="8" ry="${f(Math.abs(yT - y) / 2 + 10)}" fill="none" stroke="${C.pcna}" stroke-width="5" opacity="${op}"/>`);
  const loader = (x, y) => G('rfc', `<path d="M${f(x - 14)},${f(y + 10)} L${f(x - 9)},${f(y - 10)} L${f(x + 9)},${f(y - 10)} L${f(x + 14)},${f(y + 10)} Z" fill="${C.rfc}" stroke="#5a3a0b" stroke-width="1"/>`);
  const ssb = (x1, x2, y, step = 22) => { let s = ''; for (let x = x1; x <= x2 + .01; x += step) s += `<ellipse cx="${f(x)}" cy="${f(y)}" rx="8" ry="5.5" fill="${C.ssb}" stroke="#8a6d00" stroke-width=".9"/>`; return G('ssb', s); };
  const primase = (x, y) => G('primase', `<path d="M${f(x)},${f(y - 13)} L${f(x + 14)},${f(y)} L${f(x)},${f(y + 13)} L${f(x - 14)},${f(y)} Z" fill="${C.prim}" stroke="#7a3f0e" stroke-width="1"/>`);
  const ligase = (x, y) => G('ligase', `<circle cx="${f(x)}" cy="${f(y)}" r="10" fill="${C.lig}" stroke="#8b2d5f" stroke-width="1.2"/>`);
  const nuclease = (x, y) => G('fen1', `<path d="M${f(x - 11)},${f(y + 8)} Q${f(x)},${f(y - 16)} ${f(x + 11)},${f(y + 8)} Z" fill="${C.nuc}" stroke="#36404b" stroke-width="1"/>`);
  const topo = (x, y) => G('topo', `<rect x="${f(x - 12)}" y="${f(y - 18)}" width="24" height="36" rx="9" fill="${C.topo}" opacity=".9"/>`);
  /* зачёркивание убранной детали */
  const cross = (x, y, r = 12) => `<path d="M${f(x - r)},${f(y - r)} L${f(x + r)},${f(y + r)} M${f(x + r)},${f(y - r)} L${f(x - r)},${f(y + r)}" stroke="${C.red}" stroke-width="3" stroke-linecap="round"/>`;
  /* шпилька одноцепочечной ДНК (без SSB) */
  /* аудит Codex A29 (v1.4): шпилька — участок одноцепочечной матрицы выходит из линии, два комплементарных отрезка спарены (стебель
     с парами оснований), на вершине — неспаренная петля. up = 1 — вверх от линии, −1 — вниз. Линия матрицы под шпилькой стирается. */
  const hairpin = (x, y, up = 1, col = C.old) => { const w = 12, h = 22, yy = y - up * h;
    return `<rect x="${f(x - 3)}" y="${f(y - 4)}" width="${w + 6}" height="8" fill="var(--surface)"/>` +
      line(x + 2, y - up * 7, x + w - 2, y - up * 7, C.rung, 2) + line(x + 2, y - up * 15, x + w - 2, y - up * 15, C.rung, 2) +
      `<path d="M${f(x - 3)},${f(y)} L${f(x)},${f(y)} L${f(x)},${f(yy)} A${f(w / 2 + 3)},${f(w / 2 + 3)} 0 1 ${up > 0 ? 1 : 0} ${f(x + w)},${f(yy)} L${f(x + w)},${f(y)} L${f(x + w + 3)},${f(y)}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`; };
  /* точка начала репликации — зелёный треугольник под ДНК */
  const origin = (x, y, on = true) => G('origin', `<path d="M${f(x)},${f(y)} l-7,12 l14,0 z" fill="${on ? C.ori : '#fff'}" stroke="${C.ori}" stroke-width="1.6"/>`);
  /* затравка РНК на цепи (отрезок) */
  const primer = (x1, x2, y) => G('primer', line(x1, y, x2, y, C.rna, 6));
  /* разрыв (одноцепочечный) — маленькая щель с меткой */
  const nick = (x, y) => G('nick', `<rect x="${f(x - 2.5)}" y="${f(y - 6)}" width="5" height="12" fill="#fff"/>` + `<path d="M${f(x)},${f(y - 13)} l0,-7" stroke="${C.red}" stroke-width="1.6"/>`);
  return { C, f, G, line, head, end, rungs, strand, base, helicase, polymerase, clamp, loader, ssb, primase, ligase, nuclease, topo, cross, hairpin, origin, primer, nick };
})();
/* =====================================================================
   s0_figs_dna_adv.js — продвинутый уровень семинара 7 (v1.3, архитектура MAZUNIN_EDU_BIO v2.0, ТЗ семинара 7 v1.0):
   четыре системных исследования. Модели — чистые функции условий; рисунок только отображает состояние модели.
     a1 — ограничивающий ресурс: доступность dNTP при исправной полимеразе;
     a2 — резервные (подготовленные, в норме неактивные) точки начала;
     a3 — завершённость: продвижение вилок ≠ готовность дочерних молекул (два соседних участка);
     a4 — молекула → клетка → ткань: S-фаза, 2c/4c, 46 хромосом, условные популяции;
     amap — итоговая карта зависимостей (не пятая вкладка).
   Все модели — учебные схемы: дискретные правила, условные единицы; числа не измерены (см. «Научный паспорт»).
   Русского текста здесь нет: подписи — через t().
   ===================================================================== */

/* ---------- a1: ограничивающий ресурс ---------- */
DN.a1 = (function(){
  const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
  const TPL = 'TACGTGCATCGA';                       /* та же матрица, что в базовой модели 1б (цепь 1, слева 3′) */
  const NEW = TPL.split('').map(c => PAIR[c]).join('');   /* ATGCACGTAGCT; затравка — первые 3 */
  const NP = 3, NAME = { A: 'dATP', T: 'dTTP', G: 'dGTP', C: 'dCTP' };
  /* av: all — все четыре dNTP в достатке; absent — выбранного dNTP нет; low — выбранного мало.
     x — выбранный dNTP (A/T/G/C); rest: 'yes' — отсутствовавший dNTP снова добавлен (остальные условия те же). */
  function model(av, x, rest){
    const o = { av, x, rest, tpl: TPL, full: NEW, n: 12, state: 'done', next: null, pauseAt: null, slow: [] };
    if (av === 'absent'){
      let i = NP; while (i < 12 && NEW[i] !== x) i++;
      if (i < 12){
        if (rest === 'yes'){ o.state = 'resumed'; o.pauseAt = i; }
        else { o.n = i; o.state = 'stop'; o.next = x; }
      }
    }
    if (av === 'low'){ o.state = 'slow'; for (let i = NP; i < 12; i++) if (NEW[i] === x) o.slow.push(i); }
    o.added = o.n - NP;
    return o;
  }
  const X = i => 50 + 40 * i, YT = 86, YTB = 116, YNB = 170, YN = 200;
  function draw(o, t, mask){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s1a_lbl_head')}</text>`;
    s += DN.G('template', DN.strand(X(0) - 14, X(11) + 14, YT, C.old) + TPL.split('').map((L, i) => DN.line(X(i), YT, X(i), YTB - 13, C.old, 3) + DN.base(X(i), YTB, L, C.old)).join(''));
    s += DN.end(X(0) - 28, YT + 4, '3′') + DN.end(X(11) + 28, YT + 4, '5′');
    /* затравка + новая цепь до позиции n */
    s += DN.G('primer', DN.strand(X(0) - 14, X(NP - 1) + 10, YN, C.neuD));
    if (o.n > NP) s += DN.G('newstrand', DN.strand(X(NP - 1) + 10, X(o.n - 1) + 10, YN, C.neu, { grow: o.n < 12 ? 1 : 0 }));
    for (let i = 0; i < o.n; i++){
      const L = NEW[i], slow = !mask && o.slow.includes(i);
      s += DN.line(X(i), YN, X(i), YNB + 13, i < NP ? C.neuD : C.neu, 3) + DN.G(i < NP ? 'primer' : 'newstrand', DN.base(X(i), YNB, L, i < NP ? '#5E6E80' : C.neuD, slow ? { stroke: '#B7791F', sw: 3 } : {}));
    }
    s += DN.end(X(0) - 28, YN + 4, '5′') + (o.n < 12 ? '' : DN.end(X(11) + 24, YN + 4, '3′'));
    s += `<text class="lbl-l" x="${X(0) - 14}" y="${YN + (o.n < 7 ? 44 : 26)}" font-size="12">${t('s1a_lbl_primer')}</text>`;
    /* полимераза: у позиции n (в конце — после последнего нуклеотида) */
    const px = o.n < 12 ? X(o.n) - 6 : X(11) + 62;
    s += DN.polymerase(px, YN, 44, 28);
    s += `<text class="lbl" x="${Math.min(px, 548)}" y="${YN + 28}" font-size="11.5">${t('s1a_lbl_pol')}</text>`;
    if (o.state === 'stop' && !mask){
      s += `<rect x="${X(o.n) - 16}" y="${YNB - 16}" width="32" height="32" rx="6" fill="none" stroke="${C.red}" stroke-width="2.4" stroke-dasharray="5 3"/>`;
      s += `<text class="lbl" x="${X(o.n)}" y="${YNB - 26}" font-size="12" fill="${C.red}">${t('s1a_lbl_need', { N: NAME[o.next] })}</text>`;
    }
    if (o.state === 'stop' && mask)
      s += `<rect x="${X(o.n) - 16}" y="${YNB - 16}" width="32" height="32" rx="6" fill="none" stroke="${C.grey}" stroke-width="2" stroke-dasharray="5 3"/>`;
    if (o.state === 'resumed') s += `<path d="M${X(o.pauseAt) - 20},${YN + 58} l0,-46" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="3 2" fill="none"/>` +
      `<text class="lbl-l" x="${X(o.pauseAt) - 14}" y="${YN + 60}" font-size="11.5" fill="${C.grey}">${t('s1a_lbl_paused')}</text>`;
    if (o.state === 'slow' && !mask) s += `<text class="lbl-l" x="${X(0) - 14}" y="${YN + 60}" font-size="11.5" fill="#8a5a12">${t('s1a_lbl_slow')}</text>`;
    /* запас dNTP: четыре резервуара; уровень — качественный (в достатке / мало / нет) */
    s += `<text class="lbl-l" x="40" y="292" font-size="12.5">${t('s1a_lbl_pool')}</text>`;
    ['A', 'T', 'G', 'C'].forEach((L, i) => {
      const x = 92 + i * 92, y0 = 306, h = 58, w = 46;
      const lvl = mask ? null : (o.av === 'absent' && o.x === L && o.rest !== 'yes') ? 0 : (o.av === 'low' && o.x === L) ? .22 : 1;
      let g = `<rect x="${x - w / 2}" y="${y0}" width="${w}" height="${h}" rx="6" fill="#fff" stroke="${C.neuD}" stroke-width="2"/>`;
      if (lvl == null) g += `<text class="lbl" x="${x}" y="${y0 + h / 2}" font-size="20" font-weight="700" fill="${C.grey}">?</text>`;
      else {
        if (lvl > 0) g += `<rect x="${x - w / 2 + 3}" y="${(y0 + h - 3 - (h - 6) * lvl).toFixed(1)}" width="${w - 6}" height="${((h - 6) * lvl).toFixed(1)}" rx="4" fill="${C.neu}" opacity=".85"/>`;
        if (lvl === 0) g += DN.cross(x, y0 + h / 2, 13);
      }
      s += DN.G('pool', g) + `<text class="lbl" x="${x}" y="${y0 + h + 14}" font-size="12.5" font-weight="700">${NAME[L]}</text>`;
    });
    s += `<text class="area" x="14" y="406">${t('s1a_lbl_foot')}</text>`;
    return s;
  }
  /* v1.4, шкала этапов: кадр в момент T (этапы 1 — затравка, 2 — первый нуклеотид, 3 — рост цепи, 4 — исход; при «снова добавлен»:
     4 — остановка, 5 — продолжение). Конечный кадр совпадает со статичной схемой; скорость синтеза модель не рассчитывает. */
  function frame(o, T){
    const nf = o.state === 'resumed' ? o.pauseAt : o.n, k = Math.ceil(T - 1e-9);
    const g = n => Object.assign({}, o, { n, state: 'grow', added: n - NP });
    if (k <= 1) return g(NP);
    if (k === 2) return g(Math.min(NP + 1, nf));
    if (k === 3) return g(Math.min(nf, NP + 1 + Math.round((nf - NP - 1) * Math.min(1, T - 2))));
    if (o.state === 'resumed'){
      if (k === 4) return Object.assign({}, o, { n: o.pauseAt, state: 'stop', next: o.x, added: o.pauseAt - NP });
      if (T < 5 - 1e-9) return Object.assign(g(o.pauseAt + Math.round((12 - o.pauseAt) * (T - 4))), { state: 'grow' });
    }
    return o;
  }
  return { model, draw, frame, NAME, NEW, TPL, NP, view: (a, t, T) => draw(T == null ? model(...a) : frame(model(...a), T), t, a[3] === 'mask') };
})();

/* ---------- a2: резервные точки начала ---------- */
DN.a2 = (function(){
  /* v1.4 (решение автора 11.11.2026): подготовка (лицензирование) и запуск — разные события; статус «запущенная» или «резервная»
     точке не закреплён — в каждой клетке он решается заново, во многом случайно. Модель показывает одну клетку с заданным исходом.
     Участок между точками A (x = 0) и Б (x = L), которые в этой клетке запустились в начале S-фазы: L = 8 («близко») или 16 («далеко»),
     условные единицы. Подготовленные, но не запущенные в начале S-фазы точки: В (x = 4) и при L = 16 ещё Г (x = 12) (v1.4: нейтральные имена вместо «Р1/Р2» — «резервная» не вид точки, а исход в клетке).
     Скорость вилки — 1 ед. за условный шаг (правило модели, не измерение); окно S-фазы — 10 шагов.
     Задержка: вилка A→ останавливается при x = 2 (шаг 2); при двух задержках ещё вилка ←Б при x = L − 2.
     Исход «в этой клетке резервная точка запустилась» (fire = yes): на шаге 3 у остановленной вилки запускается ближайшая подготовленная,
     ещё не скопированная точка в нескопированном промежутке. fire = no — та же точка в этой клетке не запустилась (в клетке запуск
     вероятностный, обязательным он не бывает). Скопированная точка не запускается. Остановленная вилка в модели не возобновляется. */
  const T_END = 10, DT = .5;
  function model(geom, stall, prep, fire){
    const L = geom === 'far' ? 16 : 8, dorm = geom === 'far' ? [4, 12] : [4];
    if (prep !== 'yes') fire = 'no';
    const N = L / DT, cov = new Array(N).fill(-1);   /* cov[i] — шаг, когда ячейка [i·DT, (i+1)·DT) скопирована; −1 — нет */
    const stops = { A: stall !== 'none' ? 2 : null, B: stall === 'two' ? L - 2 : null };
    const forks = [{ id: 'A', x: 0, dir: 1, stop: stops.A, alive: true }, { id: 'B', x: L, dir: -1, stop: stops.B, alive: true }];
    const ds = dorm.map(x => ({ x, st: prep === 'yes' ? 'wait' : 'none', t: null }));
    const snap = tm => ({ tm, f: forks.map(f => ({ x: f.x, dir: f.dir, alive: f.alive, stopped: !!f.stopped, born: f.born })) });
    const hist = [snap(0)];   /* положения вилок после каждого полушага — для пошагового хода и анимации */
    let done = null;

      const tm = step * DT;
      /* запуск резерва (шаг 3) — исход «в этой клетке запустилась» */
      if (Math.abs(tm - 3) < 1e-9 && fire === 'yes'){
        forks.filter(f => f.stopped).forEach(f => {
          const cand = ds.filter(d => d.st === 'wait' && cov[cellAt(d.x)] < 0 && cov[cellAt(d.x - DT)] < 0)
            .filter(d => { /* в промежутке по ходу остановленной вилки до первой скопированной ячейки */
              const a = Math.min(f.x, d.x), b = Math.max(f.x, d.x);
              for (let i = cellAt(a + 1e-6); i < cellAt(b - 1e-6); i++) if (cov[i] >= 0) return false; return (d.x - f.x) * f.dir > 0; })
            .sort((p, q) => Math.abs(p.x - f.x) - Math.abs(q.x - f.x));
          if (cand.length){ const d = cand[0]; d.st = 'fired'; d.t = tm;
            forks.push({ id: 'R' + d.x, x: d.x, dir: -1, alive: true, born: tm }, { id: 'R' + d.x, x: d.x, dir: 1, alive: true, born: tm }); }
        });
      }
      forks.forEach(f => {
        if (!f.alive || f.born === tm) return;   /* новые вилки резервной точки начинают движение со следующего шага */
        if (f.stop != null && Math.abs(f.x - f.stop) < 1e-9){ f.alive = false; f.stopped = true; return; }
        const i = f.dir > 0 ? cellAt(f.x) : cellAt(f.x) - 1;
        if (i < 0 || i >= N || cov[i] >= 0){ f.alive = false; return; }   /* край участка или встреча со скопированной ДНК */
        cov[i] = tm; f.x += f.dir * DT;
      });
      ds.forEach(d => { if (d.st === 'wait' && cov[cellAt(d.x)] >= 0 && cov[cellAt(d.x - DT)] >= 0) { d.st = 'passive'; d.t = tm; } });

    for (let i = 0; i <= N; i++){ const un = i < N && cov[i] < 0; if (un && g0 == null) g0 = i * DT; if (!un && g0 != null){ gaps.push([g0, i * DT]); g0 = null; } }
    const copied = cov.filter(c => c >= 0).length / N;

    if (k === 2 && o.stall !== 'none') return o.stall === 'two' ? 'stall2' : 'stall';
    if (k === 3 && o.stall !== 'none') return o.dorm.some(d => d.st === 'fired') ? 'fire' : o.prep !== 'yes' ? 'noprep' : 'nofire';

  function draw(o, t, mask, m){
    const C = DN.C, sx = x => X0 + x / 16 * W, fin = m == null || m >= o.T_END - 1e-9, g1 = !fin && m <= 1e-9;
    const cov = fin ? o.cov : o.cov.map(c => c >= 0 && c <= m + 1e-9 ? c : -1);
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${fin ? t('s2a_lbl_head', { T: o.T_END }) : g1 ? t('s2a_lbl_head_g1') : t('s2a_lbl_head_t', { k: Math.ceil(m - 1e-9), T: o.T_END })}</text>`;
    /* участок: родительская ДНК (две тёмные линии); скопированное — с новыми цепями */

    /* скопированные ячейки — светло-синие новые цепи снаружи («пузырьки») */
    let run = null; const segs = [];
    for (let i = 0; i <= cov.length; i++){ const c = i < cov.length && cov[i] >= 0; if (c && run == null) run = i; if (!c && run != null){ segs.push([run * .5, i * .5]); run = null; } }
    /* пошаговый ход: вилки между полушагами — продолжение отрезка до текущего положения вилки */
    const fx = [];
    if (!fin && !g1){
      const i0 = Math.min(o.hist.length - 1, Math.floor(m / DT + 1e-9)), h0 = o.hist[i0], h1 = o.hist[Math.min(o.hist.length - 1, i0 + 1)];
      h0.f.forEach((f, j) => { if (f.born != null && f.born > m + 1e-9) return;
        const nx = h1.f[j], moving = f.alive && nx && (nx.x !== f.x), x = moving ? f.x + f.dir * Math.min(DT, m - h0.tm) : f.x;

    /* движущиеся вилки (только в пошаговом ходе): клин по направлению движения */
    fx.forEach(([x, d]) => { const X = sx(x); s += DN.G('fork', `<path d="M${(X - d * 4).toFixed(1)},${Y - 30} L${(X + d * 9).toFixed(1)},${Y} L${(X - d * 4).toFixed(1)},${Y + 30}" fill="none" stroke="${C.old}" stroke-width="2.6" stroke-linejoin="round"/>`); });

    /* точки A и Б: до S-фазы — подготовлены (контур), в S-фазе — запущены в этой клетке */

      else if (st === 'none') s += DN.G('dormant', `<path d="M${x - 6},${Y + 32} l12,12 M${x + 6},${Y + 32} l-12,12" stroke="${C.grey}" stroke-width="2"/>`);
      else s += DN.G('dormant', `<path d="M${x},${Y + 30} l-7,12 l14,0 z" fill="${st === 'fired' ? C.ori : '#fff'}" stroke="${C.ori}" stroke-width="1.6" ${st === 'passive' ? 'stroke-dasharray="3 2"' : ''}/>`);

      `<text class="lbl" x="${(sx(0) + sx(o.L)) / 2}" y="${Y + 106}" font-size="11.5" fill="${C.grey}">${t('s2a_lbl_len', { L: o.L })}</text>`;
    /* обозначения */
    ['s2a_lbl_key1', 's2a_lbl_key2', 's2a_lbl_key3'].forEach((k, i) => { s += `<text class="lbl-l" x="14" y="${54 + i * 19}" font-size="12">${t(k)}</text>`; });

  /* «Разные клетки»: одни и те же подготовленные точки — разный набор запущенных. Наборы условные (пример, не измерение):

     схема помещается в экран телефона целиком, без увеличения и прокрутки, подписи ~12 px. Широкий экран — без изменений. */

/* ---------- a3: завершённость двух соседних участков ---------- */
DN.a3 = (function(){
  /* Операции созревания (учебная модель; в клетке удаление затравки и заполнение бреши сопряжены):
     0 — продвижение вилок (покрытие матрицы), 1 — удаление РНК-затравок, 2 — заполнение брешей, 3 — лигирование.
     d — не выполненная (задержанная) операция участка: none / fork / rem / fill / lig.
     Операции выполняются по порядку: задержка одной не отменяет сделанного раньше и не даёт выполнить следующие. */
  const ORD = ['fork', 'rem', 'fill', 'lig'];
  const stageOf = d => d === 'none' ? 4 : ORD.indexOf(d);
  function region(d){
    const k = stageOf(d);
    return { d, stage: k, covered: k >= 1, primers: k <= 1, gaps: k === 2, nicks: k === 3, ready: k === 4 };
  }
  function model(dA, dB){
    const A = region(dA), B = region(dB);
    const junction = A.ready && B.ready ? 'sealed' : (A.covered && B.covered ? 'open' : 'apart');
    return { A, B, junction, ready: A.ready && B.ready, block: [A, B].filter(r => !r.ready).map(r => r.d) };
  }
  const YP = 150, YN = 176;
  function strandOf(r, x0, x1, t){
    const C = DN.C, n = 3, w = (x1 - x0) / n, pl = 16;   /* три фрагмента; затравка 16 px у 5′-конца (слева) */
    let s = '';
    if (r.hidden)   /* обратная задача: состояние новой цепи не показано, дано только описание наблюдения */
      return s + `<path d="M${x0},${YN} L${x1},${YN}" stroke="${C.grey}" stroke-width="5" stroke-dasharray="10 8"/>` +
        `<text class="lbl" x="${(x0 + x1) / 2}" y="${YN + 26}" font-size="12" fill="${C.grey}">${t('s3a_lbl_blur')}</text>`;
    for (let i = 0; i < n; i++){
      const a = x0 + i * w, b = a + w;
      if (r.stage === 0 && i === 0) continue;   /* левая часть ещё не скопирована: вилка идёт влево, фрагменты растут 5′→3′ вправо — от вилки */
      if (r.ready){ if (i === 0) s += DN.G('newstrand', DN.line(x0, YN, x1, YN, C.neu, 6)); continue; }
      const dna0 = (r.stage <= 1) ? a + pl : (r.stage === 2 ? a + pl : a);   /* после заполнения бреши ДНК начинается от стыка */
      if (r.stage <= 1) s += DN.primer(a + 1.5, a + pl, YN);
      s += DN.G(i === 0 ? 'newstrand' : 'okazaki', DN.line(dna0 + (r.stage === 2 ? 0 : 1.5), YN, b - 1.5, YN, C.neu, 6));

    s += `<text class="lbl" x="300" y="372" font-size="13.5" font-weight="700" fill="${o.ready || mask ? C.ink : C.red}">${st}</text>`;

/* ---------- итоговая карта: зависимости, а не линейная последовательность реакций ---------- */
DN.amap = (function(){
  const NODES = [   /* [id, x, y, w] */

  const HIT = { dntp: ['res', 'fork'], reserve: ['ori', 'fork'], mature: ['mat'], g0: ['cyc'] };

    EDGES.forEach(([a, b]) => { const A = N[a], B = N[b];
      const red = o.hit.includes(a) && o.hit.includes(b);
      let x1, y1, x2, y2;
      if (narrow) { x1 = A[1]; y1 = A[2] + H2; x2 = B[1] + (A[1] - B[1]) * 0.35; y2 = B[2] - H2; }
      else { x1 = A[1] + (B[1] > A[1] ? A[3] / 2 : 0); y1 = A[2] + (B[1] > A[1] ? 0 : H2); x2 = B[1] - (B[1] > A[1] ? B[3] / 2 : 0); y2 = B[2] - (B[1] > A[1] ? 0 : H2); }
      s += `<path d="M${x1},${y1} L${x2},${y2}" stroke="${red ? C.red : C.grey}" stroke-width="${red ? 3 : 1.8}" fill="none" marker-end="url(#a_amap)"/>`; });

      /* v1.4 (паспорт v1.3-5): у каждого узла — доступное имя; при включённом нарушении — пометка «нарушено» */
      s += `<g role="img" aria-label="${t('amap_n_' + id).split('|').join(' ')}${hit ? ' — ' + t('amap_hit') : ''}">`;
      s += `<rect x="${x - w / 2}" y="${y - H2}" width="${w}" height="${2 * H2}" rx="10" fill="${hit ? '#FBECEA' : '#fff'}" stroke="${hit ? C.red : C.old}" stroke-width="${hit ? 2.4 : 1.6}"/>`;
      const lines = t('amap_n_' + id).split('|');
      lines.forEach((ln, i) => { s += `<text class="lbl" x="${x}" y="${y + (i - (lines.length - 1) / 2) * LH}" font-size="${FS}" aria-hidden="true">${ln}</text>`; }); s += '</g>'; });
    { const col = o.out === 'ok' ? C.ink : o.out === 'none' ? C.old : C.red, txt = t('amap_out_' + o.out);
      /* на узком экране итог — в две строки: по двоеточию или тире */
      const k = txt.search(/: | — /), parts = narrow && k > 0 ? [txt.slice(0, k + (txt[k] === ':' ? 1 : 2)), txt.slice(k + (txt[k] === ':' ? 2 : 3))] : [txt];

/* Модели и рисунки вкладки 1 (общие для практикума и «Объяснений»); подписи — через функцию t, переданную вызывающим. */
/* ---- вкладка 1, базовый уровень: модель и рисунок (общие для практикума и «Объяснений») ---- */

    return DN.G('hbond', d.map(dx => DN.line(x + dx, YTB + 15, x + dx, YNB - 15, DN.C.grey, 1.6, 'stroke-dasharray="3 2"')).join('')); }
  function draw(o, t){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    /* необязательные поля кадра (только практикум, конструктор и анимация; без них рисунок как в v1.1):
