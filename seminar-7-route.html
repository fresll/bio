ервная точка (отметка 4); при дальней точке Б — две (отметки 4 и 12). Что происходит с остановленными вилками и какие сигналы при этом возникают, рассматривается в курсе «Молекулярная биология».","sources":["Blow2011","Alver2014","Saxena2022"],"quiz":{"id":"S7-L35","question":"Обе встречные вилки остановились. Между ними есть подготовленная, ещё не скопированная точка начала. Что предсказывает модель?","options":[{"id":"S7-L35-1","text":"Ничего: резерв помогает, только если одна из вилок продолжает двигаться","correct":false,"feedback":"Именно при двух остановленных вилках резерв незаменим."},{"id":"S7-L35-2","text":"Она может запуститься и скопировать промежуток; это вероятно, но не гарантировано","correct":true,"feedback":"Только подготовленная точка внутри промежутка может его скопировать."},{"id":"S7-L35-3","text":"Её запуск не нужен: остановленные вилки возобновятся сами","correct":false,"feedback":"Модель не рассматривает возобновление остановленных вилок; и в клетке оно не гарантировано."}]},"widget":{"kind":"dna","title":"","s":{"title":"Остановились обе встречные вилки","status":"Учебная схема · к концу S-фазы · единицы условные","modes_label":"Резерв","modes":["резерва нет","резервная точка запустилась"],"scene":"a2","args":[["near","two","no","no"],["near","two","yes","yes"]],"L":{"s2a_view":"Что показать","s2a_view_one":"одна клетка","s2a_view_cells":"разные клетки","s2a_vnote":"«Разные клетки»: задержек нет — сравниваются только наборы точек, запущенных в начале S-фазы. Остальные переключатели относятся к одной клетке.","s2a_geom":"Соседняя точка начала Б","s2a_geom_near":"близко (8 ед.)","s2a_geom_far":"далеко (16 ед.)","s2a_stall":"Ход вилок","s2a_stall_none":"без задержек","s2a_stall_one":"остановилась вилка от A","s2a_stall_two":"остановились обе встречные","s2a_prep":"Точки В (и Г) подготовлены до S-фазы","s2a_prep_yes":"да","s2a_prep_no":"нет","s2a_fire":"Резервная точка у остановленной вилки — в этой клетке","s2a_fire_yes":"запустилась","s2a_fire_no":"не запустилась","s2a_fnote2":"Вилки не останавливались — исход запуска у остановленной вилки здесь не нужен: точки, через которые прошла вилка, в этой S-фазе уже не запустятся.","s2a_fnote":"Резервные точки не подготовлены до S-фазы — запускать нечего; в S-фазе новые точки начала не подготавливаются.","s2a_lbl_head":"учебная схема · к концу S-фазы (шаг {T}) · единицы условные","s2a_lbl_B":"Б","s2a_lbl_head_g1":"учебная схема · до S-фазы: точки подготовлены, ни одна не запущена","s2a_lbl_head_t":"учебная схема · шаг {k} из {T} · единицы условные","s2a_lbl_head_cells":"учебная схема · одни и те же точки в четырёх клетках · S-фаза","s2a_lbl_head_cells_g1":"учебная схема · одни и те же точки в четырёх клетках · до S-фазы","s2a_c_g1":"до S-фазы, все клетки","s2a_c_cell":"S-фаза, клетка {i}","s2a_c_key1":"▲ — запущена в этой клетке; △ — подготовлена до S-фазы","s2a_c_key2":"△ пунктиром — в этой клетке не запущена: её скопировала проходящая вилка","s2a_lbl_foot_cells":"Наборы условные; одинаковая подготовка во всех клетках — упрощение.","s2a_lbl_stall":"вилка остановилась","s2a_lbl_out":"за точкой Б — соседний участок","s2a_lbl_len":"моделируемый участок между A и Б: {L} условных единиц","s2a_lbl_key1":"▲ — запущенная в этой клетке; △ — подготовленная, не запущенная","s2a_lbl_key2":"△ пунктиром — скопирована проходящей вилкой; ✕ — не подготовлена","s2a_lbl_key3":"светло-синие линии — скопированная ДНК; красная рамка — не скопировано","s2a_lbl_foot":"Учебная модель, не карта хромосомы: места и время запуска заданы её правилами.","s2a_d_none":"не подготовлена","s2a_d_wait":"подготовлена, не запущена","s2a_d_passive":"скопирована проходящей вилкой","s2a_d_fired":"запущена","s2a_d_mask":"не показано","s2a_r_done":"Участок скопирован к концу S-фазы","s2a_r_done_s":"окно S-фазы в модели — {T} условных шагов","s2a_v_done":"полностью, к шагу {t}","s2a_v_gap":"нет: не скопировано {g} из {L} ед.","s2a_r_close":"Чем закрыт промежуток у остановленной вилки","s2a_v_close_normal":"задержек нет — вилки встретились","s2a_v_close_opposite":"встречной вилкой точки Б","s2a_v_close_reserve":"вилками резервной точки","s2a_v_close_none":"не закрыт","s2a_v_close_mask":"не показано","s2a_r_res":"Точки В и Г","s2a_r_res_s":"В — отметка 4; Г (отметка 12) — только при дальней точке Б","s2a_r_lic":"Подготовлено до S-фазы","s2a_v_lic":"в каждой клетке — A, В, Г, Б","s2a_r_fired":"Запущено в начале S-фазы","s2a_r_fired_s":"наборы условные","s2a_v_fired":"клетка {i}: {list}","s2a_r_fixed":"Есть ли точка, резервная во всех клетках","s2a_v_fixed_no":"в этом условном наборе — нет: каждая запущена хотя бы в одной клетке","s2a_cap_cells":"До S-фазы во всех четырёх клетках подготовлены одни и те же точки. В S-фазе в каждой клетке запустилась только часть из них, и в разных клетках — разная; остальные скопировали проходящие вилки.","s2a_cap_cells_z":"Подготовка (лицензирование) и запуск — разные события. Резервной точка бывает в конкретной клетке, а не навсегда: какие из подготовленных точек запустятся, во многом случайно; в клетке точки различаются вероятностью запуска.","s2a_cap_norm":"Вилки от A и Б встретились, участок скопирован к шагу {t}. Резервные точки, через которые прошла вилка, скопированы вместе с участком и в этой S-фазе уже не запустятся.","s2a_cap_norm_np":"Вилки от A и Б встретились, участок скопирован к шагу {t}. Точки В и Г в этой клетке не были подготовлены, но в обычном ходе они и не понадобились.","s2a_cap_norm_np_z":"Без задержек участок копируют вилки точек, запущенных в начале S-фазы.","s2a_cap_norm_z":"Подготовленных точек больше, чем запускается. Какие из них запустятся, а какие останутся резервными, в каждой клетке решается заново (режим «разные клетки»).","s2a_cap_one_opp":"Вилка от A остановилась, но встречная вилка от Б дошла до неё: участок скопирован к шагу {t}, позже, чем без задержки.","s2a_cap_one_opp_z":"Отсутствие резерва ещё не означает недокопированный участок: встречная вилка может закрыть промежуток, если успевает.","s2a_cap_one_res":"Вилка от A остановилась; в этой клетке ближайшая подготовленная точка запустилась и дала две вилки: одна дошла до остановленной, другая встретила вилку от Б. Участок скопирован к шагу {t}.","s2a_cap_one_res_z":"Резервная точка даёт новые вилки рядом с задержкой, но в клетке её запуск случаен и не обязателен. В этой модели остановленная вилка не возобновляется; в клетке остановленная вилка иногда может продолжить движение.","s2a_cap_one_fail":"Вилка от A остановилась, резервная точка не запустилась или не была подготовлена, а точка Б далеко: встречная вилка не успевает до конца S-фазы, часть участка остаётся нескопированной.","s2a_cap_one_fail_z":"Встречной вилки достаточно не всегда: важны расстояние и время.","s2a_cap_two_fail":"Обе встречные вилки остановились, резерв не сработал: промежуток между ними скопировать некому.","s2a_cap_two_fail_z":"Новую точку начала в S-фазе подготовить нельзя. Если остановленные вилки не возобновятся, скопировать промежуток в этой S-фазе может только точка, подготовленная заранее.","s2a_cap_two_res":"Обе встречные вилки остановились; в промежутке запустилась подготовленная точка {res}, её вилки скопировали промежуток к шагу {t}.","s2a_cap_two_res2":"Обе встречные вилки остановились; в промежутке запустились подготовленные точки {res}, их вилки скопировали промежуток к шагу {t}.","s2a_cap_two_res_z":"Помощь возможна, только если подготовленная точка лежит в нескопированном промежутке; в клетке это вероятно, но не гарантировано.","s2a_cap_mask":"Наблюдение к концу S-фазы — на схеме. Состояние резервных точек и переключатели пока не показаны.","s2a_cap_mask_z":"Сначала решите, какие причины совместимы с наблюдением.","s2a_tl_note":"Шкала — условные шаги модели, а не минуты; шаг 0 — до S-фазы. Последний этап шкалы совпадает со статичной схемой.","s2a_tl_step":"Шаг {k} из {m}","s2a_tl_g1":"До S-фазы точки A, Б и резервные точки подготовлены; ни одна ещё не запущена.","s2a_tl_g1_no":"До S-фазы подготовлены только A и Б; на месте В (Г) точка не подготовлена.","s2a_tl_start":"Начало S-фазы: в этой клетке запустились A и Б, от каждой расходятся две вилки.","s2a_tl_move":"Вилки продолжают движение; новые точки в S-фазе не подготавливаются.","s2a_tl_stall":"Вилка от A остановилась; участок за ней пока не скопирован (в модели вилка не возобновляется).","s2a_tl_stall2":"Остановились обе встречные вилки; промежуток между ними не скопирован (в модели вилки не возобновляются).","s2a_tl_fire":"Подготовленная точка в нескопированном промежутке запустилась и дала две вилки. В клетке это случайное, а не обязательное событие.","s2a_tl_nofire":"Подготовленная точка в промежутке в этой клетке не запустилась: запуск возможен, но не обязателен.","s2a_tl_noprep":"Подготовленной точки в промежутке нет, а новые точки в S-фазе не подготавливаются.","s2a_tl_passive":"Вилка прошла через резервную точку: точка скопирована и в этой S-фазе уже не запустится.","s2a_tl_done":"Вилки встретились: участок скопирован полностью.","s2a_tl_after":"Участок уже скопирован; S-фаза продолжается на других участках хромосомы.","s2a_tl_wait":"К промежутку не идёт ни одна вилка: скопировать его некому.","s2a_tl_gap":"Конец S-фазы: часть участка осталась нескопированной.","s2a_tl_c1":"До S-фазы в каждой клетке подготовлены одни и те же точки — A, В, Г и Б.","s2a_tl_c2":"S-фаза: в каждой клетке запустилась часть подготовленных точек, в разных клетках — разная.","s2a_take":"Точки начала подготавливаются до S-фазы, и их больше, чем запускается; какие из них запустятся, в каждой клетке во многом случайно. Подготовленные, но не запущенные точки копируются проходящими вилками и в той же S-фазе уже не запускаются. Если вилка остановилась, промежуток может закрыть встречная вилка — если успевает — или вилки резервной точки, если та в этой клетке запустится. Когда остановились обе встречные вилки и они не возобновляются, помочь может только подготовленная точка между ними. Резерв повышает вероятность полного копирования, но не гарантирует его. Что происходит с остановленной вилкой и какие сигналы при этом возникают, рассматривает курс «Молекулярная биология»."},"notes":["Резерва нет: промежуток 2–6 скопировать некому.","Точка В в промежутке запустилась: её вилки скопировали промежуток к шагу 5."],"static":["Резерва нет: промежуток 2–6 скопировать некому."]}},"level":"adv"},{"id":"fork-asymmetry","section":2,"questions":[3],"title":"Почему одна новая цепь растёт непрерывно, а другая — фрагментами","keywords":["ведущая цепь","отстающая цепь","антипараллельность","5′→3′","фрагменты Оказаки"],"lead":["В вилке копируются обе матрицы одновременно, но новые цепи растут по-разному: одна непрерывно, другая короткими отрезками.","Это третий пункт минимального результата: причина — сочетание двух правил, известных из раздела 1."],"mechanism":["Матрицы антипараллельны: одна идёт в вилку 3′-концом вперёд, другая — 5′-концом.","ДНК-полимераза наращивает цепь только 5′→3′, то есть читает матрицу 3′→5′.","На одной матрице направление роста совпадает с движением вилки: [[T28|ведущая цепь]] растёт непрерывно вслед за хеликазой.","На другой матрице рост направлен против движения вилки: [[T29|отстающая цепь]] синтезируется короткими [[T27|фрагментами Оказаки]], каждый — от новой затравки у вилки к предыдущему фрагменту."],"paragraphs":["В вилке, где обе матрицы копируются одновременно (у бактерий и в ядре эукариот), асимметрия неизбежна и не зависит от организма: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′. Поэтому фрагменты Оказаки есть и у бактерий, и у эукариот; различается только их длина — 1000–2000 нуклеотидов у бактерий и 100–200 у эукариот.","Вилка продвигается по обеим матрицам с одной средней скоростью, но на каждом участке синтез отстающей цепи начинается позже: его приходится начинать заново каждый раз, когда вилка освобождает новый участок матрицы."],"conditions":"Схема качественная: длины фрагментов и число шагов условные.","sources":["Alberts2022"],"quiz":{"id":"S7-L15","question":"Почему отстающая цепь синтезируется фрагментами?","options":[{"id":"S7-L15-1","text":"Полимераза отстающей цепи синтезирует цепь в направлении 3′→5′","correct":false,"feedback":"Все ДНК-полимеразы синтезируют цепь только 5′→3′; поэтому и нужны фрагменты."},{"id":"S7-L15-2","text":"Матрица отстающей цепи повреждена и копируется кусками","correct":false,"feedback":"Матрица не повреждена; прерывистость следует из направления синтеза относительно хода вилки."},{"id":"S7-L15-3","text":"Её рост 5′→3′ направлен против движения вилки, и каждый новый участок матрицы приходится начинать с новой затравки","correct":true,"feedback":"Антипараллельность матриц и правило 5′→3′ делают непрерывный синтез на этой матрице невозможным."}]},"widget":{"kind":"dna","title":"","s":{"title":"Ведущая и отстающая цепи у вилки","status":"Схема качественная · длины условные","modes_label":"Ход вилки","modes":["шаг 1","шаг 3"],"scene":"s3b","args":[["right","1","syn"],["right","3","syn"]],"L":{"s3_side":"Вилка","s3_side_r":"правая (движется вправо)","s3_side_l":"левая (движется влево)","s3_step":"Ход вилки (условные шаги)","s3_step_1":"1","s3_step_2":"2","s3_step_3":"3","s3_mat":"Отстающая цепь","s3_mat_syn":"синтез фрагментов","s3_mat_rem":"затравки удалены","s3_mat_fill":"бреши заполнены","s3_mat_lig":"фрагменты сшиты","s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s3_r_lead":"Ведущая цепь строится на","s3_r_lag":"Отстающая цепь строится на","s3_v_on":"цепи {m}","s3_r_frag":"Отдельных фрагментов Оказаки","s3_r_frag_s":"на схеме; число условное","s3_v_n":"{n}","s3_r_rna":"РНК-затравок на отстающей цепи","s3_r_nick":"Между фрагментами","s3_r_nick_s":"брешь — не хватает нуклеотидов; разрыв — не хватает одной связи","s3_v_frags":"фрагменты с затравками","s3_v_gaps":"бреши: {n}","s3_v_nicks":"разрывы: {n}","s3_v_cont":"цепь непрерывна","s3_cap_syn":"Вилка: {side}. Новая цепь растёт только 5′→3′, а матрицы антипараллельны. На цепи {l} рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно. На цепи {m} рост направлен против хода вилки: каждый фрагмент начинается с новой РНК-затравки у вилки и растёт к предыдущему.","s3_cap_syn_z":"Асимметрия неизбежна: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′, а не из особенностей какого-то организма.","s3_cap_rem":"Созревание отстающей цепи начинается с удаления затравок: нуклеазы удаляют РНК-затравки фрагментов; на их месте остаются бреши. У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего в лоскут, его срезает флэп-эндонуклеаза FEN1, и сразу остаётся разрыв.","s3_cap_rem_z":"РНК не может оставаться в ДНК: затравки удаляются, а их место заполняется ДНК.","s3_cap_fill":"Затем ДНК-полимераза заполнила бреши, наращивая 3′-конец соседнего фрагмента. Все нуклеотиды на месте, но между фрагментами не хватает одной фосфодиэфирной связи — разрывы.","s3_cap_fill_z":"Последнюю связь между соседними фрагментами полимераза образовать не может; это делает ДНК-лигаза.","s3_cap_lig":"В конце ДНК-лигаза соединила 3′-OH одного фрагмента с 5′-фосфатом соседнего; у эукариот она использует энергию АТФ. Отстающая цепь стала непрерывной.","s3_cap_lig_z":"Удалить РНК, достроить ДНК и сшить остов — три этапа созревания фрагментов Оказаки."},"notes":["Ведущая цепь растёт к вилке непрерывно; на отстающей — фрагменты с затравками.","Вилка прошла три шага: ведущая цепь удлинилась, на отстающей добавились новые фрагменты."],"static":["Вилка прошла три шага: ведущая цепь удлинилась, на отстающей добавились новые фрагменты."]}}},{"id":"bubble-roles","section":2,"questions":[2,3],"title":"Одна и та же матрица — ведущая у одной вилки и отстающая у другой","keywords":["пузырёк репликации","две вилки","ведущая цепь","отстающая цепь"],"lead":["От точки начала расходятся две вилки в противоположные стороны. Что происходит с одной и той же матрицей у двух вилок?","Ответ связывает вопросы 2 и 3 коллоквиума: двунаправленность и асимметрию вилки."],"mechanism":["На каждой матрице новая цепь растёт в одном и том же направлении — 5′→3′.","Вилки одной точки начала движутся в противоположные стороны.","Поэтому у одной вилки рост на данной матрице совпадает с её ходом (ведущая цепь), а у другой — противоположен (отстающая).","В каждой половине пузырька обе матрицы копируются: одна непрерывно, другая фрагментами."],"paragraphs":["«Ведущая» и «отстающая» — свойства новой цепи относительно хода конкретной вилки, а не свойства матрицы. На одной матрице по обе стороны от точки начала образуются и ведущая, и отстающая цепи.","Одна и та же родительская цепь служит матрицей ведущей цепи у одной вилки и фрагментов отстающей цепи у другой. Все новые участки растут 5′→3′, и у каждого фрагмента Оказаки своя затравка. При встрече вилок соседних репликонов новые цепи соединяются."],"conditions":"Схема качественная: показаны вилки, отходящие от одной точки начала.","sources":["Alberts2022"],"quiz":{"id":"S7-L16","question":"У правой вилки новая цепь на цепи 2 — отстающая. Какая новая цепь на цепи 2 у левой вилки той же точки начала?","options":[{"id":"S7-L16-1","text":"Ведущая","correct":true,"feedback":"Левая вилка движется в обратную сторону, поэтому рост 5′→3′ на цепи 2 совпадает с её ходом."},{"id":"S7-L16-2","text":"Тоже отстающая","correct":false,"feedback":"Роль новой цепи зависит от направления хода вилки; у вилок, расходящихся в разные стороны, роли меняются."},{"id":"S7-L16-3","text":"Цепь 2 у левой вилки не копируется","correct":false,"feedback":"Каждая вилка копирует обе матрицы."}]},"widget":{"kind":"dna","title":"","s":{"title":"Две вилки одной точки начала","status":"Схема качественная · длины условные","modes_label":"Вилка","modes":["правая вилка","левая вилка"],"scene":"s3b","args":[["right","2","syn"],["left","2","syn"]],"L":{"s3_side":"Вилка","s3_side_r":"правая (движется вправо)","s3_side_l":"левая (движется влево)","s3_step":"Ход вилки (условные шаги)","s3_step_1":"1","s3_step_2":"2","s3_step_3":"3","s3_mat":"Отстающая цепь","s3_mat_syn":"синтез фрагментов","s3_mat_rem":"затравки удалены","s3_mat_fill":"бреши заполнены","s3_mat_lig":"фрагменты сшиты","s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s3_r_lead":"Ведущая цепь строится на","s3_r_lag":"Отстающая цепь строится на","s3_v_on":"цепи {m}","s3_r_frag":"Отдельных фрагментов Оказаки","s3_r_frag_s":"на схеме; число условное","s3_v_n":"{n}","s3_r_rna":"РНК-затравок на отстающей цепи","s3_r_nick":"Между фрагментами","s3_r_nick_s":"брешь — не хватает нуклеотидов; разрыв — не хватает одной связи","s3_v_frags":"фрагменты с затравками","s3_v_gaps":"бреши: {n}","s3_v_nicks":"разрывы: {n}","s3_v_cont":"цепь непрерывна","s3_cap_syn":"Вилка: {side}. Новая цепь растёт только 5′→3′, а матрицы антипараллельны. На цепи {l} рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно. На цепи {m} рост направлен против хода вилки: каждый фрагмент начинается с новой РНК-затравки у вилки и растёт к предыдущему.","s3_cap_syn_z":"Асимметрия неизбежна: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′, а не из особенностей какого-то организма.","s3_cap_rem":"Созревание отстающей цепи начинается с удаления затравок: нуклеазы удаляют РНК-затравки фрагментов; на их месте остаются бреши. У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего в лоскут, его срезает флэп-эндонуклеаза FEN1, и сразу остаётся разрыв.","s3_cap_rem_z":"РНК не может оставаться в ДНК: затравки удаляются, а их место заполняется ДНК.","s3_cap_fill":"Затем ДНК-полимераза заполнила бреши, наращивая 3′-конец соседнего фрагмента. Все нуклеотиды на месте, но между фрагментами не хватает одной фосфодиэфирной связи — разрывы.","s3_cap_fill_z":"Последнюю связь между соседними фрагментами полимераза образовать не может; это делает ДНК-лигаза.","s3_cap_lig":"В конце ДНК-лигаза соединила 3′-OH одного фрагмента с 5′-фосфатом соседнего; у эукариот она использует энергию АТФ. Отстающая цепь стала непрерывной.","s3_cap_lig_z":"Удалить РНК, достроить ДНК и сшить остов — три этапа созревания фрагментов Оказаки."},"notes":["Правая вилка: на цепи 1 — ведущая, на цепи 2 — отстающая.","Левая вилка: на цепи 1 — отстающая, на цепи 2 — ведущая."],"static":["Левая вилка: на цепи 1 — отстающая, на цепи 2 — ведущая."]}}},{"id":"lagging-primers","section":2,"questions":[3],"title":"Каждому фрагменту Оказаки — своя затравка","keywords":["праймаза","РНК-затравка","полимераза α","отстающая цепь"],"lead":["ДНК-полимераза не начинает цепь без затравки, поэтому каждый фрагмент отстающей цепи начинается с короткой молекулы РНК.","Затравки синтезирует [[T20|праймаза]] — РНК-полимераза, которая начинает синтез без готовой затравки: ей не нужен готовый 3′-конец."],"mechanism":["Хеликаза освобождает у вилки новый участок матрицы отстающей цепи.","Праймаза синтезирует на нём РНК-затравку; у эукариот затравки около 10 нуклеотидов, они образуются через каждые 100–200 нуклеотидов.","У эукариот праймаза работает в комплексе с [[T30|ДНК-полимеразой α]], которая удлиняет затравку коротким участком ДНК (около 20 нуклеотидов).","Дальше фрагмент удлиняет [[T31|ДНК-полимераза δ]], пока не дойдёт до предыдущего фрагмента."],"paragraphs":["Ведущей цепи затравка нужна один раз — в начале, у точки начала репликации; дальше её непрерывно удлиняет [[T32|ДНК-полимераза ε]]. Отстающей цепи затравка нужна для каждого фрагмента.","У полимеразы α нет корректирующей активности; её участок затем в основном заменяется при созревании фрагмента (шаг «Созревание фрагментов Оказаки»)."],"conditions":"Длины затравок и интервалы — для клеток эукариот по учебнику; схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S7-L17","question":"Сколько РНК-затравок нужно ведущей и отстающей цепи при синтезе длинного участка?","options":[{"id":"S7-L17-1","text":"По одной на каждую цепь","correct":false,"feedback":"Отстающая цепь начинается заново много раз, и каждый раз нужна затравка."},{"id":"S7-L17-2","text":"Ведущей — одна, отстающей — по одной на каждый фрагмент","correct":true,"feedback":"Ведущая цепь растёт непрерывно от одной затравки; каждый фрагмент отстающей начинается со своей."},{"id":"S7-L17-3","text":"Ни одной: ДНК-полимераза сама начинает цепь","correct":false,"feedback":"ДНК-полимераза удлиняет только спаренный 3′-конец; начинает синтез праймаза."}]},"widget":{"kind":"dna","title":"","s":{"title":"Новые затравки на отстающей цепи","status":"Схема качественная · длины условные","modes_label":"Ход вилки","modes":["шаг 1","шаг 2"],"scene":"s3b","args":[["right","1","syn"],["right","2","syn"]],"L":{"s3_side":"Вилка","s3_side_r":"правая (движется вправо)","s3_side_l":"левая (движется влево)","s3_step":"Ход вилки (условные шаги)","s3_step_1":"1","s3_step_2":"2","s3_step_3":"3","s3_mat":"Отстающая цепь","s3_mat_syn":"синтез фрагментов","s3_mat_rem":"затравки удалены","s3_mat_fill":"бреши заполнены","s3_mat_lig":"фрагменты сшиты","s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s3_r_lead":"Ведущая цепь строится на","s3_r_lag":"Отстающая цепь строится на","s3_v_on":"цепи {m}","s3_r_frag":"Отдельных фрагментов Оказаки","s3_r_frag_s":"на схеме; число условное","s3_v_n":"{n}","s3_r_rna":"РНК-затравок на отстающей цепи","s3_r_nick":"Между фрагментами","s3_r_nick_s":"брешь — не хватает нуклеотидов; разрыв — не хватает одной связи","s3_v_frags":"фрагменты с затравками","s3_v_gaps":"бреши: {n}","s3_v_nicks":"разрывы: {n}","s3_v_cont":"цепь непрерывна","s3_cap_syn":"Вилка: {side}. Новая цепь растёт только 5′→3′, а матрицы антипараллельны. На цепи {l} рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно. На цепи {m} рост направлен против хода вилки: каждый фрагмент начинается с новой РНК-затравки у вилки и растёт к предыдущему.","s3_cap_syn_z":"Асимметрия неизбежна: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′, а не из особенностей какого-то организма.","s3_cap_rem":"Созревание отстающей цепи начинается с удаления затравок: нуклеазы удаляют РНК-затравки фрагментов; на их месте остаются бреши. У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего в лоскут, его срезает флэп-эндонуклеаза FEN1, и сразу остаётся разрыв.","s3_cap_rem_z":"РНК не может оставаться в ДНК: затравки удаляются, а их место заполняется ДНК.","s3_cap_fill":"Затем ДНК-полимераза заполнила бреши, наращивая 3′-конец соседнего фрагмента. Все нуклеотиды на месте, но между фрагментами не хватает одной фосфодиэфирной связи — разрывы.","s3_cap_fill_z":"Последнюю связь между соседними фрагментами полимераза образовать не может; это делает ДНК-лигаза.","s3_cap_lig":"В конце ДНК-лигаза соединила 3′-OH одного фрагмента с 5′-фосфатом соседнего; у эукариот она использует энергию АТФ. Отстающая цепь стала непрерывной.","s3_cap_lig_z":"Удалить РНК, достроить ДНК и сшить остов — три этапа созревания фрагментов Оказаки."},"notes":["На отстающей цепи у вилки — свежая затравка (оранжевая) и новый фрагмент.","Вилка продвинулась: праймаза синтезировала ещё одну затравку, начался ещё один фрагмент."],"static":["Вилка продвинулась: праймаза синтезировала ещё одну затравку, начался ещё один фрагмент."]}}},{"id":"sliding-clamp","section":2,"questions":[3],"title":"Зажим и его погрузчик: как полимераза остаётся на матрице","keywords":["скользящий зажим","PCNA","погрузчик зажима","RFC","процессивность"],"lead":["Сама по себе ДНК-полимераза синтезирует лишь короткий отрезок и отходит от матрицы. Удерживает её [[T21|скользящий зажим]] — белковое кольцо вокруг ДНК.","Надевает зажим на ДНК [[T22|погрузчик зажима]], расходуя АТФ."],"mechanism":["Погрузчик (у эукариот — RFC, репликационный фактор C) размыкает кольцо зажима (PCNA — ядерный антиген пролиферирующих клеток) и надевает его на ДНК у 3′-конца затравки.","Полимераза связывается с зажимом; кольцо скользит вдоль ДНК вместе с ней.","Закончив фрагмент у 5′-конца предыдущего, полимераза освобождается от зажима и отходит от матрицы.","На отстающей цепи для каждого нового фрагмента погрузчик надевает новый зажим; на ведущей полимераза и зажим связаны долго."],"paragraphs":["Зажим удерживает полимеразу, пока она синтезирует фрагмент, и отпускает её, когда фрагмент закончен. Это нужно отстающей цепи, где синтез много раз начинается заново.","Без зажима или без погрузчика полимераза остаётся непроцессивной: продукты получаются короткими (раздел 4)."],"conditions":"По учебнику; схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S7-L18","question":"Зачем отстающей цепи погрузчик зажима при каждом фрагменте?","options":[{"id":"S7-L18-1","text":"Погрузчик синтезирует затравку для каждого фрагмента","correct":false,"feedback":"Затравку синтезирует праймаза; погрузчик надевает на ДНК зажим."},{"id":"S7-L18-2","text":"Погрузчик сшивает фрагменты","correct":false,"feedback":"Фрагменты сшивает ДНК-лигаза."},{"id":"S7-L18-3","text":"Закончив фрагмент, полимераза освобождается, и для следующего фрагмента нужен новый зажим","correct":true,"feedback":"Зажим отпускает полимеразу у двуцепочечного участка; новый фрагмент начинается с новой загрузки зажима."}]},"widget":{"kind":"dna","title":"","s":{"title":"Погрузчик надевает зажим; полимераза δ с зажимом на новом фрагменте","status":"Схема качественная","modes_label":"Что показать","modes":["погрузчик раскрывает кольцо","кольцо на ДНК","кольцо замкнуто","на отстающей цепи"],"scene":"s3b","args":[["open"],["load"],["closed"],["right","2","syn"]],"L":{"s3_side":"Вилка","s3_side_r":"правая (движется вправо)","s3_side_l":"левая (движется влево)","s3_step":"Ход вилки (условные шаги)","s3_step_1":"1","s3_step_2":"2","s3_step_3":"3","s3_mat":"Отстающая цепь","s3_mat_syn":"синтез фрагментов","s3_mat_rem":"затравки удалены","s3_mat_fill":"бреши заполнены","s3_mat_lig":"фрагменты сшиты","s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s3_r_lead":"Ведущая цепь строится на","s3_r_lag":"Отстающая цепь строится на","s3_v_on":"цепи {m}","s3_r_frag":"Отдельных фрагментов Оказаки","s3_r_frag_s":"на схеме; число условное","s3_v_n":"{n}","s3_r_rna":"РНК-затравок на отстающей цепи","s3_r_nick":"Между фрагментами","s3_r_nick_s":"брешь — не хватает нуклеотидов; разрыв — не хватает одной связи","s3_v_frags":"фрагменты с затравками","s3_v_gaps":"бреши: {n}","s3_v_nicks":"разрывы: {n}","s3_v_cont":"цепь непрерывна","s3_cap_syn":"Вилка: {side}. Новая цепь растёт только 5′→3′, а матрицы антипараллельны. На цепи {l} рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно. На цепи {m} рост направлен против хода вилки: каждый фрагмент начинается с новой РНК-затравки у вилки и растёт к предыдущему.","s3_cap_syn_z":"Асимметрия неизбежна: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′, а не из особенностей какого-то организма.","s3_cap_rem":"Созревание отстающей цепи начинается с удаления затравок: нуклеазы удаляют РНК-затравки фрагментов; на их месте остаются бреши. У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего в лоскут, его срезает флэп-эндонуклеаза FEN1, и сразу остаётся разрыв.","s3_cap_rem_z":"РНК не может оставаться в ДНК: затравки удаляются, а их место заполняется ДНК.","s3_cap_fill":"Затем ДНК-полимераза заполнила бреши, наращивая 3′-конец соседнего фрагмента. Все нуклеотиды на месте, но между фрагментами не хватает одной фосфодиэфирной связи — разрывы.","s3_cap_fill_z":"Последнюю связь между соседними фрагментами полимераза образовать не может; это делает ДНК-лигаза.","s3_cap_lig":"В конце ДНК-лигаза соединила 3′-OH одного фрагмента с 5′-фосфатом соседнего; у эукариот она использует энергию АТФ. Отстающая цепь стала непрерывной.","s3_cap_lig_z":"Удалить РНК, достроить ДНК и сшить остов — три этапа созревания фрагментов Оказаки.","rfc_head":"схема загрузки зажима · по учебнику · условная","rfc_lbl_3end":"3′-конец новой цепи","rfc_lbl_rfc":"погрузчик зажима (RFC)","rfc_lbl_open":"раскрытое кольцо зажима (PCNA)","rfc_lbl_atp":"расходует АТФ","rfc_lbl_load":"кольцо надевается на дуплекс у 3′-конца","rfc_lbl_closed":"кольцо замкнуто вокруг ДНК","rfc_lbl_left":"погрузчик ушёл","rfc_cap_open":"1. Погрузчик связывает зажим и раскрывает кольцо.","rfc_cap_load":"2. Раскрытое кольцо надевается на ДНК там, где затравка спарена с матрицей.","rfc_cap_closed":"3. Кольцо замыкается, погрузчик уходит; полимераза δ связывается с зажимом.","rfc_foot":"Условная схема: форма и размер белков не в масштабе."},"notes":["Погрузчик (коричневый) связывает зажим и раскрывает кольцо, расходуя АТФ.","Раскрытое кольцо надевается на ДНК там, где 3′-конец затравки спарен с матрицей.","Кольцо замкнуто вокруг дуплекса; погрузчик уходит, полимераза δ связывается с зажимом.","На отстающей цепи полимераза δ (фиолетовая) с зажимом PCNA (бирюзовое кольцо) удлиняет самый новый фрагмент; для следующего фрагмента погрузчик надевает новый зажим."],"static":["Кольцо замкнуто вокруг дуплекса; погрузчик уходит, полимераза δ связывается с зажимом."],"scenes":["srfc","srfc","srfc","s3b"]}}},{"id":"okazaki-maturation","section":2,"questions":[3],"title":"Созревание фрагментов Оказаки: удалить РНК, достроить, сшить","keywords":["созревание фрагментов Оказаки","FEN1","лоскут","разрыв","ДНК-лигаза"],"lead":["Чтобы отстающая цепь стала непрерывной ДНК, РНК-затравки нужно удалить, место затравки заполнить ДНК, а фрагменты сшить.","Три этапа созревания — сценарий практикума вопроса 3."],"mechanism":["В простейшей схеме [[T23|нуклеазы]] удаляют РНК-затравку с 5′-конца фрагмента, и на её месте остаётся брешь.","ДНК-полимераза заполняет брешь, наращивая 3′-конец соседнего фрагмента.","Остаётся [[T26|разрыв]] — не хватает одной фосфодиэфирной связи; его сшивает [[T24|ДНК-лигаза]], у эукариот с затратой АТФ.","У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего фрагмента в лоскут, его срезает флэп-эндонуклеаза FEN1 (флэп-эндонуклеаза 1), и сразу остаётся разрыв; у бактерий затравку удаляют нуклеазы, узнающие РНК в гибриде РНК–ДНК."],"paragraphs":["Различайте брешь и разрыв: в бреши не хватает нуклеотидов, её заполняет ДНК-полимераза; в разрыве все нуклеотиды на месте, но между соседними не хватает одной связи — её образует лигаза.","Пара «полимераза + лигаза» завершает не только созревание фрагментов Оказаки, но и все виды эксцизионной репарации (семинар 8)."],"conditions":"Механизм удаления затравок у эукариот — по введению работы Smith, Whitehouse (2012), со ссылкой авторов; у бактерий — по учебнику. Три этапа на схеме — дидактическое упрощение: у эукариот удаление затравки, синтез ДНК и обработка вытесненного участка сопряжены, и длительно существующей бреши у каждого фрагмента может не быть. Обязательный итог — РНК-затравок нет, цепь ДНК непрерывна. Схема качественная.","sources":["Alberts2022","Smith2012"],"quiz":{"id":"S7-L19","question":"Затравки удалены, бреши заполнены. Что ещё нужно, чтобы отстающая цепь стала непрерывной?","options":[{"id":"S7-L19-1","text":"Сшить разрывы ДНК-лигазой","correct":true,"feedback":"Все нуклеотиды на месте, но между фрагментами не хватает одной связи; её образует лигаза."},{"id":"S7-L19-2","text":"Заполнить бреши ДНК-полимеразой","correct":false,"feedback":"Бреши уже заполнены; осталась одна связь между фрагментами."},{"id":"S7-L19-3","text":"Синтезировать новые затравки","correct":false,"feedback":"Затравки нужны для начала фрагментов; созревание идёт уже после синтеза."}]},"widget":{"kind":"dna","title":"","s":{"title":"Созревание фрагментов Оказаки","status":"Схема качественная","modes_label":"Этап","modes":["синтез","затравки удалены","бреши заполнены","сшито"],"scene":"s3b","args":[["right","2","syn"],["right","2","rem"],["right","2","fill"],["right","2","lig"]],"L":{"s3_side":"Вилка","s3_side_r":"правая (движется вправо)","s3_side_l":"левая (движется влево)","s3_step":"Ход вилки (условные шаги)","s3_step_1":"1","s3_step_2":"2","s3_step_3":"3","s3_mat":"Отстающая цепь","s3_mat_syn":"синтез фрагментов","s3_mat_rem":"затравки удалены","s3_mat_fill":"бреши заполнены","s3_mat_lig":"фрагменты сшиты","s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s3_r_lead":"Ведущая цепь строится на","s3_r_lag":"Отстающая цепь строится на","s3_v_on":"цепи {m}","s3_r_frag":"Отдельных фрагментов Оказаки","s3_r_frag_s":"на схеме; число условное","s3_v_n":"{n}","s3_r_rna":"РНК-затравок на отстающей цепи","s3_r_nick":"Между фрагментами","s3_r_nick_s":"брешь — не хватает нуклеотидов; разрыв — не хватает одной связи","s3_v_frags":"фрагменты с затравками","s3_v_gaps":"бреши: {n}","s3_v_nicks":"разрывы: {n}","s3_v_cont":"цепь непрерывна","s3_cap_syn":"Вилка: {side}. Новая цепь растёт только 5′→3′, а матрицы антипараллельны. На цепи {l} рост 5′→3′ совпадает с ходом вилки — ведущая цепь растёт непрерывно. На цепи {m} рост направлен против хода вилки: каждый фрагмент начинается с новой РНК-затравки у вилки и растёт к предыдущему.","s3_cap_syn_z":"Асимметрия неизбежна: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′, а не из особенностей какого-то организма.","s3_cap_rem":"Созревание отстающей цепи начинается с удаления затравок: нуклеазы удаляют РНК-затравки фрагментов; на их месте остаются бреши. У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего в лоскут, его срезает флэп-эндонуклеаза FEN1, и сразу остаётся разрыв.","s3_cap_rem_z":"РНК не может оставаться в ДНК: затравки удаляются, а их место заполняется ДНК.","s3_cap_fill":"Затем ДНК-полимераза заполнила бреши, наращивая 3′-конец соседнего фрагмента. Все нуклеотиды на месте, но между фрагментами не хватает одной фосфодиэфирной связи — разрывы.","s3_cap_fill_z":"Последнюю связь между соседними фрагментами полимераза образовать не может; это делает ДНК-лигаза.","s3_cap_lig":"В конце ДНК-лигаза соединила 3′-OH одного фрагмента с 5′-фосфатом соседнего; у эукариот она использует энергию АТФ. Отстающая цепь стала непрерывной.","s3_cap_lig_z":"Удалить РНК, достроить ДНК и сшить остов — три этапа созревания фрагментов Оказаки."},"notes":["Фрагменты с РНК-затравками на 5′-концах.","Затравки удалены нуклеазами — на их месте бреши.","Бреши заполнены ДНК — остались разрывы.","Лигаза сшила разрывы — отстающая цепь непрерывна."],"static":["Лигаза сшила разрывы — отстающая цепь непрерывна."]}}},{"id":"synthesis-vs-ready","section":2,"questions":[3],"title":"Вилка прошла участок — готова ли новая цепь?","keywords":["прохождение вилки","покрытие матрицы","зрелая цепь ДНК","созревание фрагментов"],"lead":["Уже известно: отстающая цепь собирается из фрагментов Оказаки, которые созревают — удаление затравок, заполнение брешей, сшивание (БИО-7·19).","Новое: прохождение вилки, покрытие матрицы продуктами синтеза (ДНК и РНК-затравками) и зрелая непрерывная цепь ДНК — разные состояния."],"mechanism":["Когда вилка прошла участок, на матрице уже сформированы фрагменты новой цепи, но их 5′-концы ещё представлены РНК-затравками: матрица покрыта продуктами синтеза — ДНК и РНК, а не одной ДНК.","В модели после удаления затравок на их месте остаются [[T39|бреши]] — промежутки без нуклеотидов.","После заполнения брешей соседние участки ДНК стоят вплотную, но между ними остаются разрывы — нет одной связи.","Только после сшивания разрывов лигазой новая цепь становится непрерывной ДНК."],"paragraphs":["В модели операции идут одна за другой: задержка одной не отменяет сделанного раньше, а следующие за ней не выполняются. В основе порядка — свойства ферментов: лигаза соединяет соседние нуклеотиды, между которыми нет промежутка, — незаполненную брешь она не сшивает. В клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут идти сопряжённо (БИО-7·19); раздельные стадии модели нужны, чтобы различать РНК, брешь и разрыв.","Если изменить условие и задержать удаление затравок, вилка участок пройдёт и матрица будет занята фрагментами, но часть новой цепи останется РНК, и цепь не готова. Поэтому различают три состояния: вилка прошла участок; матрица покрыта продуктами синтеза — ДНК и РНК; новая цепь — зрелая непрерывная ДНК.","Одиночный разрыв одной цепи не следует называть двуцепочечным разрывом ДНК: вторая цепь в этом месте не разорвана.","Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель. Удаление затравки, синтез ДНК и обработка вытесненного участка в клетке могут происходить сопряжённо. На схеме эти операции разведены, чтобы различать РНК, брешь и разрыв; обязательный конечный результат — отсутствие РНК-затравок и непрерывность ДНК. Число фрагментов и длины условные.","sources":["Alberts2022"],"quiz":{"id":"S7-L36","question":"Вилка прошла участок, затравки удалены, бреши заполнены ДНК. Готова ли новая цепь?","options":[{"id":"S7-L36-1","text":"Да: вилка прошла, и бреши заполнены ДНК","correct":false,"feedback":"Это необходимо, но недостаточно: между соседними участками ДНК ещё нет связей — цепь не непрерывна."},{"id":"S7-L36-2","text":"Нет: сначала нужно ещё раз удалить затравки","correct":false,"feedback":"Затравки уже удалены по условию; осталось сшивание."},{"id":"S7-L36-3","text":"Нет: остались разрывы, их сшивает лигаза","correct":true,"feedback":"Последняя операция — сшивание; до неё цепь не непрерывна."}]},"widget":{"kind":"dna","title":"","s":{"title":"Созревание новой цепи по шагам (участок Б)","status":"Учебная схема · операции разведены условно","modes_label":"Стадия на участке Б","modes":["вилка прошла","затравки удалены","бреши заполнены","разрывы сшиты"],"scene":"a3","args":[["none","rem"],["none","fill"],["none","lig"],["none","none"]],"L":{"s3a_dA":"Участок A: не выполнено","s3a_dB":"Участок Б: не выполнено","s3a_d_none":"всё выполнено","s3a_d_fork":"продвижение вилки","s3a_d_rem":"удаление затравок","s3a_d_fill":"заполнение брешей","s3a_d_lig":"сшивание","s3a_ctrl_note":"В модели операции разведены и идут по порядку: продвижение вилки → удаление РНК-затравок → заполнение брешей → сшивание лигазой; задержанная операция не отменяет сделанного раньше, а следующие за ней в модели не выполняются. В клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут происходить сопряжённо; на схеме они разведены, чтобы различать РНК, брешь и разрыв. Обязательный конечный результат — РНК-затравок нет, цепь ДНК непрерывна.","s3a_lbl_head":"учебная схема · два соседних участка · одна новая цепь из фрагментов","s3a_lbl_A":"Участок A","s3a_lbl_B":"Участок Б","s3a_lbl_junc":"стык участков","s3a_lbl_blur":"состояние новой цепи не показано","s3a_k_rna":"РНК-затравка","s3a_k_dna":"новая ДНК","s3a_k_old":"матрица","s3a_k_nick":"разрыв (не сшито)","s3a_k_gap":"брешь (нет нуклеотидов)","s3a_lbl_ready":"Новая цепь на этом отрезке готова","s3a_lbl_notready":"Ещё не готово","s3a_lbl_obs":"Наблюдение","s3a_lbl_foot":"Вторая новая цепь не показана; длины условные.","s3a_r_A":"Участок A","s3a_r_B":"Участок Б","s3a_v_cov_full":"вилка прошла весь участок","s3a_v_cov_part":"вилка прошла не весь участок","s3a_v_rna":"РНК-затравки остались","s3a_v_gaps":"есть бреши","s3a_v_nicks":"есть разрывы","s3a_v_cont":"новая цепь непрерывна","s3a_v_blur":"вилка прошла весь участок; новая цепь не стала непрерывной; подробности не показаны","s3a_r_all":"Обе дочерние молекулы готовы","s3a_r_all_s":"правило: вилки прошли оба участка, а новые цепи стали непрерывной ДНК — без РНК, брешей и разрывов, стык сшит","s3a_v_all_yes":"да","s3a_v_all_no":"нет","s3a_v_all_mask":"определите по схеме","s3a_r_block":"Что не выполнено","s3a_v_block":"{ops}","s3a_op_fork":"продвижение вилки по участку","s3a_op_rem":"удаление РНК-затравок","s3a_op_fill":"заполнение брешей","s3a_op_lig":"сшивание разрывов лигазой","s3a_and":"и","s3a_cap_ready":"На обоих участках вилка прошла, затравки удалены, бреши заполнены ДНК, разрывы сшиты; сшит и стык участков. Новые цепи обеих дочерних молекул на этом отрезке — непрерывная ДНК.","s3a_cap_ready_z":"Готовность — свойство всего отрезка: её проверяют по всем участкам и стыкам.","s3a_cap_one":"Один участок готов, на другом не выполнено: {ops}. Отрезок в целом ещё не готов, а стык участков не сшит.","s3a_cap_one_z":"Завершённость одного участка не означает готовности всей молекулы.","s3a_cap_both":"Ни один участок не готов: не выполнено {ops}.","s3a_cap_both_same":"Ни один участок не готов: на обоих не выполнено {ops}.","s3a_cap_both_z":"Узких мест может быть несколько; каждое нужно найти отдельно.","s3a_cap_mask":"Наблюдение — на схеме. Какая операция не выполнена, пока не показано.","s3a_cap_mask_z":"Определите это по промежуточному продукту.","s3a_tl_note":"Порядок операций — учебная модель: в клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут идти сопряжённо. Время шкалы условное.","s3a_tl_1":"Вилка проходит участок; на матрице — фрагменты отстающей новой цепи, их 5′-концы ещё представлены РНК-затравками.","s3a_tl_2":"РНК-затравки удалены; на их месте бреши.","s3a_tl_3":"Бреши заполнены ДНК; между фрагментами остались разрывы.","s3a_tl_4":"Лигаза сшивает разрывы; новая цепь участка непрерывна. Участок с задержанной операцией дальше не продвигается.","s3a_tl_5":"Стык сшит, только когда готовы оба соседних участка.","s3a_take":"Прохождение вилки, покрытие матрицы продуктами синтеза — фрагментами ДНК с РНК-затравками — и зрелая непрерывная цепь ДНК — разные характеристики. Вилка может пройти весь участок, а новая цепь ещё будет содержать РНК-затравки, бреши или разрывы. Отрезок хромосомы удвоен только тогда, когда все участки и стыки между ними доведены до непрерывной ДНК без РНК. Узкое место определяют по промежуточному продукту: оранжевая РНК — не удалены затравки, пустая брешь — не заполнены бреши, узкий разрыв — не выполнено сшивание. Раздельные этапы — условность модели: в клетке эти операции могут идти сопряжённо."},"notes":["Вилка прошла: на матрице фрагменты ДНК с РНК-затравками.","Затравки удалены — на их месте бреши.","Бреши заполнены — остались разрывы.","Разрывы сшиты: цепь непрерывна, отрезок готов."],"static":["Вилка прошла: на матрице фрагменты ДНК с РНК-затравками."]}},"level":"adv"},{"id":"many-replicons","section":2,"questions":[3],"title":"Почему готовность хромосомы определяется всеми её участками?","keywords":["несколько участков","стык участков","общий статус","узкое место"],"lead":["Уже известно: хромосому человека копируют многие точки начала одновременно (БИО-7·11).","Новое: дочерняя молекула готова, только когда готовы все её участки и сшиты стыки между ними."],"mechanism":["Каждый участок завершается своей последовательностью операций.","Встреча вилок соседних участков оставляет стык; его тоже сшивает лигаза.","Если хотя бы один участок не завершён, вся молекула не готова — и это определяет общий результат.","Узкое место — та операция, без которой не может закончиться последний незавершённый участок."],"paragraphs":["Готовность — свойство системы, а не отдельной операции. Успешно выполненная стадия на одном участке ещё не означает завершения всей цепочки взаимозависимых операций.","Если изменить условие так, что на участке A всё готово, а на участке Б задержано п зок в целом ещё не готов, а стык участков не сшит.","s3a_cap_one_z":"Завершённость одного участка не означает готовности всей молекулы.","s3a_cap_both":"Ни один участок не готов: не выполнено {ops}.","s3a_cap_both_same":"Ни один участок не готов: на обоих не выполнено {ops}.","s3a_cap_both_z":"Узких мест может быть несколько; каждое нужно найти отдельно.","s3a_cap_mask":"Наблюдение — на схеме. Какая операция не выполнена, пока не показано.","s3a_cap_mask_z":"Определите это по промежуточному продукту.","s3a_tl_note":"Порядок операций — учебная модель: в клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут идти сопряжённо. Время шкалы условное.","s3a_tl_1":"Вилка проходит участок; на матрице — фрагменты отстающей новой цепи, их 5′-концы ещё представлены РНК-затравками.","s3a_tl_2":"РНК-затравки удалены; на их месте бреши.","s3a_tl_3":"Бреши заполнены ДНК; между фрагментами остались разрывы.","s3a_tl_4":"Лигаза сшивает разрывы; новая цепь участка непрерывна. Участок с задержанной операцией дальше не продвигается.","s3a_tl_5":"Стык сшит, только когда готовы оба соседних участка.","s3a_take":"Прохождение вилки, покрытие матрицы продуктами синтеза — фрагментами ДНК с РНК-затравками — и зрелая непрерывная цепь ДНК — разные характеристики. Вилка может пройти весь участок, а новая цепь ещё будет содержать РНК-затравки, бреши или разрывы. Отрезок хромосомы удвоен только тогда, когда все участки и стыки между ними доведены до непрерывной ДНК без РНК. Узкое место определяют по промежуточному продукту: оранжевая РНК — не удалены затравки, пустая брешь — не заполнены бреши, узкий разрыв — не выполнено сшивание. Раздельные этапы — условность модели: в клетке эти операции могут идти сопряжённо."},"notes":["Оба участка готовы, стык сшит.","На Б вилка не дошла: отрезок не готов.","На Б остались разрывы: отрезок не готов, стык не сшит.","Не готовы оба участка: два узких места."],"static":["Оба участка готовы, стык сшит."]}},"level":"adv"},{"id":"find-unfinished","section":2,"questions":[3],"title":"Как по промежуточному продукту найти незавершённую операцию?","keywords":["промежуточный продукт","обратная задача","РНК-затравка","брешь","разрыв"],"lead":["Уже известно: по продукту можно определить, какого белка не хватает вилке (БИО-7·25).","Новое: наблюдение «цепь не непрерывна» совместимо с несколькими причинами; различают их по виду промежуточного продукта."],"mechanism":["Остались участки РНК — не выполнено удаление затравок.","Есть промежутки без нуклеотидов — не заполнены бреши.","Соседние участки ДНК стоят вплотную, но не соединены — не выполнено сшивание.","Вилка прошла не весь участок — часть матрицы ещё не скопирована."],"paragraphs":["Одно наблюдение («вилок нет, цепь не непрерывна») не позволяет назвать единственную причину: нужна вторая, различающая характеристика продукта.","Найдя узкое место, полезно проверить, хватит ли одной операции. Если на участке бреши, после их заполнения останутся разрывы, и понадобится ещё сшивание.","Разрыв, оставшийся после незавершённого созревания, и повреждение ДНК — разные вещи; как клетка обнаруживает и исправляет повреждения, — семинар 8.","Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: операции созревания разведены условно, как в БИО-7·20; промежуточные продукты показаны схематично, без методов их обнаружения.","sources":["Alberts2022"],"quiz":{"id":"S7-L38","question":"На участке нет РНК, но между фрагментами пустые промежутки. Что нужно сделать, чтобы цепь стала непрерывной?","options":[{"id":"S7-L38-1","text":"Только сшить: лигаза соединит фрагменты через промежутки","correct":false,"feedback":"Лигаза соединяет соседние нуклеотиды; брешь сначала нужно заполнить."},{"id":"S7-L38-2","text":"Заполнить бреши, а затем сшить оставшиеся разрывы","correct":true,"feedback":"Брешь заполняет ДНК-полимераза; лигаза сшивает разрыв, который остаётся после этого."},{"id":"S7-L38-3","text":"Снова удалить затравки","correct":false,"feedback":"РНК уже нет — затравки удалены."}]},"widget":{"kind":"dna","title":"","s":{"title":"Что осталось на участке Б?","status":"Учебная схема · операции разведены условно","modes_label":"Промежуточный продукт","modes":["РНК-затравки","бреши","разрывы"],"scene":"a3","args":[["none","rem"],["none","fill"],["none","lig"]],"L":{"s3a_dA":"Участок A: не выполнено","s3a_dB":"Участок Б: не выполнено","s3a_d_none":"всё выполнено","s3a_d_fork":"продвижение вилки","s3a_d_rem":"удаление затравок","s3a_d_fill":"заполнение брешей","s3a_d_lig":"сшивание","s3a_ctrl_note":"В модели операции разведены и идут по порядку: продвижение вилки → удаление РНК-затравок → заполнение брешей → сшивание лигазой; задержанная операция не отменяет сделанного раньше, а следующие за ней в модели не выполняются. В клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут происходить сопряжённо; на схеме они разведены, чтобы различать РНК, брешь и разрыв. Обязательный конечный результат — РНК-затравок нет, цепь ДНК непрерывна.","s3a_lbl_head":"учебная схема · два соседних участка · одна новая цепь из фрагментов","s3a_lbl_A":"Участок A","s3a_lbl_B":"Участок Б","s3a_lbl_junc":"стык участков","s3a_lbl_blur":"состояние новой цепи не показано","s3a_k_rna":"РНК-затравка","s3a_k_dna":"новая ДНК","s3a_k_old":"матрица","s3a_k_nick":"разрыв (не сшито)","s3a_k_gap":"брешь (нет нуклеотидов)","s3a_lbl_ready":"Новая цепь на этом отрезке готова","s3a_lbl_notready":"Ещё не готово","s3a_lbl_obs":"Наблюдение","s3a_lbl_foot":"Вторая новая цепь не показана; длины условные.","s3a_r_A":"Участок A","s3a_r_B":"Участок Б","s3a_v_cov_full":"вилка прошла весь участок","s3a_v_cov_part":"вилка прошла не весь участок","s3a_v_rna":"РНК-затравки остались","s3a_v_gaps":"есть бреши","s3a_v_nicks":"есть разрывы","s3a_v_cont":"новая цепь непрерывна","s3a_v_blur":"вилка прошла весь участок; новая цепь не стала непрерывной; подробности не показаны","s3a_r_all":"Обе дочерние молекулы готовы","s3a_r_all_s":"правило: вилки прошли оба участка, а новые цепи стали непрерывной ДНК — без РНК, брешей и разрывов, стык сшит","s3a_v_all_yes":"да","s3a_v_all_no":"нет","s3a_v_all_mask":"определите по схеме","s3a_r_block":"Что не выполнено","s3a_v_block":"{ops}","s3a_op_fork":"продвижение вилки по участку","s3a_op_rem":"удаление РНК-затравок","s3a_op_fill":"заполнение брешей","s3a_op_lig":"сшивание разрывов лигазой","s3a_and":"и","s3a_cap_ready":"На обоих участках вилка прошла, затравки удалены, бреши заполнены ДНК, разрывы сшиты; сшит и стык участков. Новые цепи обеих дочерних молекул на этом отрезке — непрерывная ДНК.","s3a_cap_ready_z":"Готовность — свойство всего отрезка: её проверяют по всем участкам и стыкам.","s3a_cap_one":"Один участок готов, на другом не выполнено: {ops}. Отрезок в целом ещё не готов, а стык участков не сшит.","s3a_cap_one_z":"Завершённость одного участка не означает готовности всей молекулы.","s3a_cap_both":"Ни один участок не готов: не выполнено {ops}.","s3a_cap_both_same":"Ни один участок не готов: на обоих не выполнено {ops}.","s3a_cap_both_z":"Узких мест может быть несколько; каждое нужно найти отдельно.","s3a_cap_mask":"Наблюдение — на схеме. Какая операция не выполнена, пока не показано.","s3a_cap_mask_z":"Определите это по промежуточному продукту.","s3a_tl_note":"Порядок операций — учебная модель: в клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут идти сопряжённо. Время шкалы условное.","s3a_tl_1":"Вилка проходит участок; на матрице — фрагменты отстающей новой цепи, их 5′-концы ещё представлены РНК-затравками.","s3a_tl_2":"РНК-затравки удалены; на их месте бреши.","s3a_tl_3":"Бреши заполнены ДНК; между фрагментами остались разрывы.","s3a_tl_4":"Лигаза сшивает разрывы; новая цепь участка непрерывна. Участок с задержанной операцией дальше не продвигается.","s3a_tl_5":"Стык сшит, только когда готовы оба соседних участка.","s3a_take":"Прохождение вилки, покрытие матрицы продуктами синтеза — фрагментами ДНК с РНК-затравками — и зрелая непрерывная цепь ДНК — разные характеристики. Вилка может пройти весь участок, а новая цепь ещё будет содержать РНК-затравки, бреши или разрывы. Отрезок хромосомы удвоен только тогда, когда все участки и стыки между ними доведены до непрерывной ДНК без РНК. Узкое место определяют по промежуточному продукту: оранжевая РНК — не удалены затравки, пустая брешь — не заполнены бреши, узкий разрыв — не выполнено сшивание. Раздельные этапы — условность модели: в клетке эти операции могут идти сопряжённо."},"notes":["Оранжевая РНК: не удалены затравки.","Пустые бреши: не заполнены промежутки.","Узкие разрывы: не выполнено сшивание."],"static":["Оранжевая РНК: не удалены затравки."]}},"level":"adv"},{"id":"replisome","section":3,"questions":[4],"title":"Реплисома: белки вилки и операция каждого","keywords":["реплисома","хеликаза","праймаза","ДНК-полимераза","зажим","лигаза","топоизомераза"],"lead":["У вилки работает не одна ДНК-полимераза, а комплекс белков — [[T11|реплисома]]; у каждого белка своя операция.","Это четвёртый пункт минимального результата: зная операцию белка, можно предсказать, какой промежуточный продукт останется без него."],"mechanism":["[[T18|Хеликаза]] расплетает двойную спираль с затратой АТФ; [[T25|топоизомераза]] впереди вилки снимает напряжение от расплетания.","[[T19|Белки SSB]] покрывают одноцепочечную матрицу и выпрямляют её.","[[T20|Праймаза]] синтезирует РНК-затравки; [[T32|полимераза ε]] удлиняет ведущую цепь, [[T31|полимераза δ]] — фрагменты отстающей.","[[T21|Зажим]] удерживает полимеразу на матрице, надевает его [[T22|погрузчик]]; [[T23|нуклеазы]] удаляют затравки, [[T24|ДНК-лигаза]] сшивает фрагменты."],"paragraphs":["Все эти белки синтезируются в цитоплазме и, как другие ядерные белки, попадают в ядро через ядерные поры по сигналу ядерной локализации ([[https://fresll.github.io/bio/seminar-3-route.html#nls-importin|вспомнить БИО-3·31]]).","Операции белков удобно запомнить по продукту, который остаётся без каждого из них: без нуклеаз — фрагменты с РНК-затравками, без лигазы — фрагменты с разрывами, без погрузчика — короткие отрезки с брешами."],"conditions":"По учебнику; схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S7-L23","question":"Какой белок вилки, охватывая ДНК кольцом, удерживает ДНК-полимеразу на матрице?","options":[{"id":"S7-L23-1","text":"Хеликаза","correct":false,"feedback":"Хеликаза расплетает ДНК впереди полимеразы и связана с полимеразой в реплисоме, но кольцо, которое охватывает ДНК и скользит вместе с полимеразой, — зажим."},{"id":"S7-L23-2","text":"Скользящий зажим (PCNA)","correct":true,"feedback":"Кольцо зажима охватывает ДНК и скользит вместе с полимеразой."},{"id":"S7-L23-3","text":"Белки SSB","correct":false,"feedback":"SSB связываются с одноцепочечной матрицей, а не с полимеразой."}]},"widget":{"kind":"dna","title":"","s":{"title":"Реплисома у вилки","status":"Схема качественная · длины условные","modes_label":"Состав","modes":["полный набор"],"scene":"s4b","args":[["none"]],"L":{"s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s4_off":"Какой компонент убран","s4_off_none":"ничего (полный набор)","s4_off_ssb":"белки SSB","s4_off_rfc":"погрузчик зажима","s4_off_nuc":"нуклеазы удаления затравок","s4_lbl_head":"реплисома у правой вилки; длины условные","s4_lbl_gap":"бреши","s4_lbl_hp":"шпильки в одноцепочечной матрице","s4_lbl_off_none":"полный набор: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются","s4_lbl_off_ssb":"без SSB: на матрице отстающей цепи шпильки, новый фрагмент не начат","s4_lbl_off_rfc":"без погрузчика зажима: зажим не надет, полимеразы синтезируют короткие отрезки","s4_lbl_off_nuc":"без нуклеаз: РНК-затравки остаются, фрагменты не сшиты","s4_lbl_off_q":"какой компонент убран? — определите по продукту","s4_lbl_status":"учебная модель: исход отсутствия одного компонента","s4_r_lead":"Ведущая цепь","s4_v_lead_ok":"растёт непрерывно вслед за вилкой","s4_v_lead_slow":"отстаёт от вилки: полимераза часто отходит от матрицы","s4_r_lag":"Отстающая цепь","s4_v_lag_mature":"фрагменты созревают и сшиваются","s4_v_lag_blocked":"новый фрагмент не синтезируется","s4_v_lag_short":"короткие отрезки, между ними бреши","s4_v_lag_primers":"фрагменты полной длины с РНК-затравками, не сшиты","s4_r_ss":"Одноцепочечная матрица у вилки","s4_r_ss_s":"участок, ещё не скопированный","s4_v_ss_short":"покрыта SSB, выпрямлена","s4_v_ss_hairpin":"образует шпильки","s4_cap_none":"Полный набор. Хеликаза расплетает ДНК, топоизомераза впереди вилки снимает напряжение, SSB покрывают одноцепочечную матрицу. Ведущая цепь растёт непрерывно; на отстающей праймаза синтезирует затравки, полимераза δ с зажимом удлиняет фрагмент, нуклеазы удаляют затравки, лигаза сшивает фрагменты.","s4_cap_none_z":"У каждого белка вилки своя операция; если одного не хватает, вилка оставляет характерный промежуточный продукт — по нему и определяют, чего не хватает.","s4_cap_ssb":"Без SSB одноцепочечная матрица отстающей цепи не выпрямлена: случайно комплементарные короткие участки спариваются и образуют шпильки. Шпильки мешают ДНК-полимеразе, и новый фрагмент Оказаки не синтезируется.","s4_cap_ssb_z":"SSB не синтезируют и не расплетают ДНК: они кооперативно связываются с одноцепочечной ДНК, которую образовала хеликаза, и держат её в форме, удобной для полимеразы.","s4_cap_rfc":"Без погрузчика зажим не надевается на ДНК. Полимераза без зажима синтезирует лишь короткий отрезок и отходит от матрицы: ведущая цепь отстаёт от вилки, фрагменты отстающей цепи короткие и не доходят до предыдущих — между ними бреши.","s4_cap_rfc_z":"Зажим не синтезирует ДНК; он удерживает полимеразу на матрице, а надевает его погрузчик с затратой АТФ.","s4_cap_nuc":"Без нуклеаз удаления затравок фрагменты Оказаки синтезированы полностью: каждый доходит до РНК-затравки на 5′-конце предыдущего. Но затравка остаётся в цепи. При нормальном созревании РНК-затравку удаляют, её место заполняют ДНК, и только затем лигаза сшивает разрыв между двумя участками ДНК; здесь фрагменты остаются несшитыми.","s4_cap_nuc_z":"Лигаза в норме сшивает разрыв между 3′-OH одного участка ДНК и 5′-фосфатом соседнего; РНК-затравку перед этим удаляют, а её место заполняют ДНК."},"notes":["Все белки вилки на месте: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются."],"static":["Все белки вилки на месте: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются."]}}},{"id":"unwinding","section":3,"questions":[4],"title":"Расплетание: хеликаза, SSB и топоизомераза","keywords":["хеликаза","SSB","шпилька","топоизомераза","сверхспирализация"],"lead":["Чтобы цепи стали матрицами, двойную спираль нужно расплести, одноцепочечную ДНК — удержать в выпрямленном виде, а напряжение впереди вилки — снять.","Эти три операции выполняют три разных белка."],"mechanism":["Хеликаза — кольцо из шести субъединиц — движется по одной цепи и, гидролизуя АТФ, раздвигает пары оснований; эукариотическая хеликаза CMG движется по матрице ведущей цепи.","SSB кооперативно связываются с одноцепочечной ДНК: каждая молекула предпочитает садиться рядом с уже связанной. Так они выпрямляют матрицу и не дают образоваться шпилькам из случайно комплементарных участков.","Шпильки особенно часты на матрице отстающей цепи; если их не убрать, они мешают ДНК-полимеразе.","Расплетание закручивает ДНК впереди вилки; топоизомераза I временно разрывает одну цепь и даёт ДНК повернуться, топоизомераза II разрывает обе цепи."],"paragraphs":["SSB не расплетают ДНК: они связываются с одноцепочечной ДНК, которую образовала хеликаза. Поэтому без SSB вилка расплетена, но матрица отстающей цепи образует шпильки.","Топоизомеразы восстанавливают разорванную связь сами; в отличие от нуклеаз, они не оставляют разрывов."],"conditions":"По учебнику; схема качественная.","sources":["Alberts2022"],"quiz":{"id":"S7-L24","question":"Что произойдёт с матрицей отстающей цепи без SSB?","options":[{"id":"S7-L24-1","text":"ДНК перестанет расплетаться","correct":false,"feedback":"Расплетает хеликаза; SSB связываются с уже расплетённой ДНК."},{"id":"S7-L24-2","text":"Впереди вилки накопится напряжение","correct":false,"feedback":"Напряжение снимает топоизомераза, а не SSB."},{"id":"S7-L24-3","text":"Образуются шпильки, которые мешают полимеразе","correct":true,"feedback":"SSB выпрямляют одноцепочечную ДНК; без них случайно комплементарные участки спариваются."}]},"widget":{"kind":"dna","title":"","s":{"title":"SSB на матрице отстающей цепи","status":"Схема качественная · длины условные","modes_label":"Убрано","modes":["полный набор","без SSB"],"scene":"s4b","args":[["none"],["ssb"]],"L":{"s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s4_off":"Какой компонент убран","s4_off_none":"ничего (полный набор)","s4_off_ssb":"белки SSB","s4_off_rfc":"погрузчик зажима","s4_off_nuc":"нуклеазы удаления затравок","s4_lbl_head":"реплисома у правой вилки; длины условные","s4_lbl_gap":"бреши","s4_lbl_hp":"шпильки в одноцепочечной матрице","s4_lbl_off_none":"полный набор: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются","s4_lbl_off_ssb":"без SSB: на матрице отстающей цепи шпильки, новый фрагмент не начат","s4_lbl_off_rfc":"без погрузчика зажима: зажим не надет, полимеразы синтезируют короткие отрезки","s4_lbl_off_nuc":"без нуклеаз: РНК-затравки остаются, фрагменты не сшиты","s4_lbl_off_q":"какой компонент убран? — определите по продукту","s4_lbl_status":"учебная модель: исход отсутствия одного компонента","s4_r_lead":"Ведущая цепь","s4_v_lead_ok":"растёт непрерывно вслед за вилкой","s4_v_lead_slow":"отстаёт от вилки: полимераза часто отходит от матрицы","s4_r_lag":"Отстающая цепь","s4_v_lag_mature":"фрагменты созревают и сшиваются","s4_v_lag_blocked":"новый фрагмент не синтезируется","s4_v_lag_short":"короткие отрезки, между ними бреши","s4_v_lag_primers":"фрагменты полной длины с РНК-затравками, не сшиты","s4_r_ss":"Одноцепочечная матрица у вилки","s4_r_ss_s":"участок, ещё не скопированный","s4_v_ss_short":"покрыта SSB, выпрямлена","s4_v_ss_hairpin":"образует шпильки","s4_cap_none":"Полный набор. Хеликаза расплетает ДНК, топоизомераза впереди вилки снимает напряжение, SSB покрывают одноцепочечную матрицу. Ведущая цепь растёт непрерывно; на отстающей праймаза синтезирует затравки, полимераза δ с зажимом удлиняет фрагмент, нуклеазы удаляют затравки, лигаза сшивает фрагменты.","s4_cap_none_z":"У каждого белка вилки своя операция; если одного не хватает, вилка оставляет характерный промежуточный продукт — по нему и определяют, чего не хватает.","s4_cap_ssb":"Без SSB одноцепочечная матрица отстающей цепи не выпрямлена: случайно комплементарные короткие участки спариваются и образуют шпильки. Шпильки мешают ДНК-полимеразе, и новый фрагмент Оказаки не синтезируется.","s4_cap_ssb_z":"SSB не синтезируют и не расплетают ДНК: они кооперативно связываются с одноцепочечной ДНК, которую образовала хеликаза, и держат её в форме, удобной для полимеразы.","s4_cap_rfc":"Без погрузчика зажим не надевается на ДНК. Полимераза без зажима синтезирует лишь короткий отрезок и отходит от матрицы: ведущая цепь отстаёт от вилки, фрагменты отстающей цепи короткие и не доходят до предыдущих — между ними бреши.","s4_cap_rfc_z":"Зажим не синтезирует ДНК; он удерживает полимеразу на матрице, а надевает его погрузчик с затратой АТФ.","s4_cap_nuc":"Без нуклеаз удаления затравок фрагменты Оказаки синтезированы полностью: каждый доходит до РНК-затравки на 5′-конце предыдущего. Но затравка остаётся в цепи. При нормальном созревании РНК-затравку удаляют, её место заполняют ДНК, и только затем лигаза сшивает разрыв между двумя участками ДНК; здесь фрагменты остаются несшитыми.","s4_cap_nuc_z":"Лигаза в норме сшивает разрыв между 3′-OH одного участка ДНК и 5′-фосфатом соседнего; РНК-затравку перед этим удаляют, а её место заполняют ДНК."},"notes":["Одноцепочечная матрица у вилки покрыта SSB и выпрямлена.","Без SSB на матрице отстающей цепи образуются шпильки; новый фрагмент не начат."],"static":["Без SSB на матрице отстающей цепи образуются шпильки; новый фрагмент не начат."]}}},{"id":"missing-component","section":3,"questions":[4],"title":"По промежуточному продукту определить, какого белка нет","keywords":["промежуточный продукт","погрузчик зажима","нуклеазы","лигаза","бреши","разрывы"],"lead":["Каждый белок вилки выполняет одну операцию, и без него остаётся свой промежуточный продукт. По продукту можно определить, чего не хватает.","Это сценарий практикума вопроса 4."],"mechanism":["Короткие отрезки ДНК, не доходящие до предыдущих фрагментов, и отставание ведущей цепи — без погрузчика зажима: полимераза без зажима быстро отходит от матрицы.","Фрагменты полной длины с РНК на 5′-концах, не сшитые между собой, — без нуклеаз удаления затравок.","Фрагменты без РНК, бреши заполнены, но цепь не сплошная — разрывы: нет ДНК-лигазы.","Шпильки на одноцепочечной матрице отстающей цепи и задержка нового фрагмента — без SSB."],"paragraphs":["Чтобы определить отсутствующий белок, сначала посмотрите, сколько синтезировано (полная ли длина фрагментов), затем — есть ли РНК, затем — бреши или разрывы. Каждый следующий этап созревания возможен только после предыдущего: лигаза не сшивает фрагменты, пока не удалены затравки и не заполнены бреши.",{"h":"Чего модель не показывает"},"Схема показывает исход отсутствия одного компонента в идеализированной вилке. В клетке без многих из этих белков репликация не идёт вовсе, и клетка погибает; промежуточные продукты наблюдают в экспериментах на очищенных белках или при частичном выключении белка."],"conditions":"Учебная модель по учебнику; числа и длины на схеме условные.","sources":["Alberts2022"],"quiz":{"id":"S7-L25","question":"Фрагменты отстающей цепи полной длины, РНК удалена, бреши заполнены, но цепь не сплошная. Чего не хватает?","options":[{"id":"S7-L25-1","text":"ДНК-лигазы","correct":true,"feedback":"Остались разрывы — не хватает одной фосфодиэфирной связи; её образует лигаза."},{"id":"S7-L25-2","text":"Нуклеаз удаления затравок","correct":false,"feedback":"Без нуклеаз на 5′-концах фрагментов осталась бы РНК."},{"id":"S7-L25-3","text":"Погрузчика зажима","correct":false,"feedback":"Без погрузчика фрагменты были бы короткими, с брешами."}]},"widget":{"kind":"dna","title":"","s":{"title":"Какой компонент убран","status":"Учебная модель · длины условные","modes_label":"Убрано","modes":["полный набор","без погрузчика","без нуклеаз"],"scene":"s4b","args":[["none"],["rfc"],["nuc"]],"L":{"s3_lbl_head":"репликационная вилка; длины фрагментов и шаги условные","s3_lbl_s1":"цепь 1","s3_lbl_s2":"цепь 2","s3_lbl_move":"движение вилки","s3_lbl_lead":"ведущая цепь — непрерывно, к вилке","s3_lbl_lag":"отстающая цепь — фрагментами, от вилки","s3_lbl_mat_syn":"у каждого фрагмента — своя РНК-затравка на 5′-конце","s3_lbl_mat_rem":"затравки удалены нуклеазами: на их месте бреши","s3_lbl_mat_fill":"бреши заполнены ДНК; между фрагментами остались разрывы","s3_lbl_mat_lig":"лигаза сшила разрывы: отстающая цепь непрерывна","s3_lbl_status":"схема качественная; фрагменты на схеме короче и меньше их числа в клетке","s4_off":"Какой компонент убран","s4_off_none":"ничего (полный набор)","s4_off_ssb":"белки SSB","s4_off_rfc":"погрузчик зажима","s4_off_nuc":"нуклеазы удаления затравок","s4_lbl_head":"реплисома у правой вилки; длины условные","s4_lbl_gap":"бреши","s4_lbl_hp":"шпильки в одноцепочечной матрице","s4_lbl_off_none":"полный набор: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются","s4_lbl_off_ssb":"без SSB: на матрице отстающей цепи шпильки, новый фрагмент не начат","s4_lbl_off_rfc":"без погрузчика зажима: зажим не надет, полимеразы синтезируют короткие отрезки","s4_lbl_off_nuc":"без нуклеаз: РНК-затравки остаются, фрагменты не сшиты","s4_lbl_off_q":"какой компонент убран? — определите по продукту","s4_lbl_status":"учебная модель: исход отсутствия одного компонента","s4_r_lead":"Ведущая цепь","s4_v_lead_ok":"растёт непрерывно вслед за вилкой","s4_v_lead_slow":"отстаёт от вилки: полимераза часто отходит от матрицы","s4_r_lag":"Отстающая цепь","s4_v_lag_mature":"фрагменты созревают и сшиваются","s4_v_lag_blocked":"новый фрагмент не синтезируется","s4_v_lag_short":"короткие отрезки, между ними бреши","s4_v_lag_primers":"фрагменты полной длины с РНК-затравками, не сшиты","s4_r_ss":"Одноцепочечная матрица у вилки","s4_r_ss_s":"участок, ещё не скопированный","s4_v_ss_short":"покрыта SSB, выпрямлена","s4_v_ss_hairpin":"образует шпильки","s4_cap_none":"Полный набор. Хеликаза расплетает ДНК, топоизомераза впереди вилки снимает напряжение, SSB покрывают одноцепочечную матрицу. Ведущая цепь растёт непрерывно; на отстающей праймаза синтезирует затравки, полимераза δ с зажимом удлиняет фрагмент, нуклеазы удаляют затравки, лигаза сшивает фрагменты.","s4_cap_none_z":"У каждого белка вилки своя операция; если одного не хватает, вилка оставляет характерный промежуточный продукт — по нему и определяют, чего не хватает.","s4_cap_ssb":"Без SSB одноцепочечная матрица отстающей цепи не выпрямлена: случайно комплементарные короткие участки спариваются и образуют шпильки. Шпильки мешают ДНК-полимеразе, и новый фрагмент Оказаки не синтезируется.","s4_cap_ssb_z":"SSB не синтезируют и не расплетают ДНК: они кооперативно связываются с одноцепочечной ДНК, которую образовала хеликаза, и держат её в форме, удобной для полимеразы.","s4_cap_rfc":"Без погрузчика зажим не надевается на ДНК. Полимераза без зажима синтезирует лишь короткий отрезок и отходит от матрицы: ведущая цепь отстаёт от вилки, фрагменты отстающей цепи короткие и не доходят до предыдущих — между ними бреши.","s4_cap_rfc_z":"Зажим не синтезирует ДНК; он удерживает полимеразу на матрице, а надевает его погрузчик с затратой АТФ.","s4_cap_nuc":"Без нуклеаз удаления затравок фрагменты Оказаки синтезированы полностью: каждый доходит до РНК-затравки на 5′-конце предыдущего. Но затравка остаётся в цепи. При нормальном созревании РНК-затравку удаляют, её место заполняют ДНК, и только затем лигаза сшивает разрыв между двумя участками ДНК; здесь фрагменты остаются несшитыми.","s4_cap_nuc_z":"Лигаза в норме сшивает разрыв между 3′-OH одного участка ДНК и 5′-фосфатом соседнего; РНК-затравку перед этим удаляют, а её место заполняют ДНК."},"notes":["Полный набор: фрагменты созревают и сшиваются.","Без погрузчика зажима: короткие отрезки с брешами, ведущая цепь отстаёт от вилки.","Без нуклеаз: фрагменты полной длины с РНК-затравками, не сшиты."],"static":["Без нуклеаз: фрагменты полной длины с РНК-затравками, не сшиты."]}}},{"id":"s-phase-2c4c","section":3,"questions":[4],"title":"Что меняется в клетке за S-фазу: количество ДНК или число хромосом?","keywords":["S-фаза","2c","4c","хроматида","46 хромосом"],"lead":["Уже известно из семинара 6: клеточный цикл — G1, S, G2, митоз; в S-фазе копируется ДНК.","Новое: связать работу реплисомы с тем, что происходит в клетке, — с количеством ДНК и строением хромосом."],"mechanism":["В G1 диплоидная соматическая клетка человека содержит 46 хромосом; каждая — одна [[T42|хроматида]], одна двухцепочечная молекула ДНК. Количество ядерной ДНК — 2c.","В S-фазе каждая из 46 молекул копируется полуконсервативно; количество ДНК растёт от 2c к 4c.","В G2 — 4c и по-прежнему 46 хромосом, но каждая состоит из двух сестринских хроматид.","В митозе сестринские хроматиды расходятся, и каждая дочерняя клетка получает 46 хромосом по одной хроматиде — 2c."],"paragraphs":["Удваивается [[T45|количество ДНК]], а не число хромосом. Фраза «после S-фазы в клетке 92 хромосомы» смешивает два уровня: молекул ДНК (хроматид) после S-фазы 92, а хромосом — 46.","По количеству ДНК 2c нельзя отличить клетку в G1 от клетки в G0: в обоих состояниях ДНК не удвоена.","Репликация завершается до митоза: разделить можно только то, что уже скопировано.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Нормальная диплоидная соматическая клетка человека; c — количество ДНК гаплоидного набора. Митохондриальная ДНК не учитывается.","sources":["Alberts2022"],"quiz":{"id":"S7-L39","question":"Клетка человека прошла S-фазу и находится в G2. Сколько в ней хромосом и сколько молекул ядерной ДНК?","options":[{"id":"S7-L39-1","text":"92 хромосомы и 92 молекулы ДНК","correct":false,"feedback":"Сестринские хроматиды остаются в одной хромосоме до их расхождения в митозе."},{"id":"S7-L39-2","text":"46 хромосом и 46 молекул ДНК","correct":false,"feedback":"После S-фазы каждая молекула ДНК скопирована — их вдвое больше."},{"id":"S7-L39-3","text":"46 хромосом и 92 молекулы ДНК","correct":true,"feedback":"Удвоились молекулы ДНК — по две сестринские хроматиды в каждой хромосоме; хромосом по-прежнему 46."}]},"widget":{"kind":"dna","title":"","s":{"title":"Одна клетка за цикл","status":"Учебная схема · нормальная диплоидная клетка","modes_label":"Состояние","modes":["G1","S","G2","после де
