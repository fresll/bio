<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-7.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Репликация ДНК: от комплементарности оснований к работе репликационной вилки</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-nucleotide-chain"><div class="eyebrow">Комплементарность и матричный принцип · шаг 1 из 30</div><h2>Из чего построена цепь ДНК и почему у неё есть направление</h2><p class="lead">Чтобы понять, как ДНК копируется, сначала нужно увидеть, из чего построена одна цепь и почему у неё два разных конца. Это первая часть вопроса 1 коллоквиума 2 (предварительный список) и вопроса 13 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Нуклеотид: дезоксирибоза с атомами углерода 1′–5′, фосфат у 5′-углерода, основание у 1′-углерода, OH у 3′-углерода.</div><ol class="mech"><li>Нуклеотид ДНК — дезоксирибоза, фосфатная группа и азотистое основание: аденин (A), гуанин (G), цитозин (C) или тимин (T).</li><li>Соседние нуклеотиды соединены фосфодиэфирной связью: фосфат связывает 3′-углерод сахара одного нуклеотида с 5′-углеродом сахара следующего.</li><li>Сахаро-фосфатный остов повторяется, а основания выступают в сторону; порядок оснований и есть записанная в цепи информация.</li><li>Концы цепи различаются: на 5′-конце свободен 5′-углерод сахара (обычно он несёт фосфатную группу), на 3′-конце — 3′-OH-группа сахара; последовательность записывают от 5′ к 3′.</li></ol><p>Все нуклеотиды цепи связаны одинаково — через сахаро-фосфатный остов, — поэтому любая последовательность оснований допустима: остов не ограничивает, какое основание стоит следующим. Информация заключена только в порядке оснований.</p><p>Направление цепи задаёт остов, а не основания. Один конец — 5′-углерод сахара (обычно с фосфатом), другой — гидроксил при 3′-углероде. Это различие станет главным в разделах 3 и 4: новый нуклеотид присоединяется только к 3′-OH.</p><p>Аденин и гуанин — пурины (два кольца), цитозин и тимин — пиримидины (одно кольцо). В РНК вместо дезоксирибозы — рибоза, вместо тимина — урацил (U).</p><div class="static-quiz"><h3>Чем 5′-конец цепи ДНК отличается от 3′-конца?</h3><ol><li><b>А.</b> На 5′-конце свободен 5′-углерод сахара (обычно с фосфатом), на 3′-конце — 3′-OH-группа сахара <i>(верный вариант)</i><br><span class="expl">Концы различаются по нумерации атомов сахара в остове; именно к 3′-OH присоединяется следующий нуклеотид.</span></li><li><b>Б.</b> На 5′-конце — пурин, на 3′-конце — пиримидин <i>(неверный вариант)</i><br><span class="expl">Основание на конце может быть любым; направление цепи задаёт остов, а не основания.</span></li><li><b>В.</b> Концы одинаковы, направление выбрано для записи условно <i>(неверный вариант)</i><br><span class="expl">Концы химически различны, поэтому у цепи есть направление, и цепи двойной спирали антипараллельны.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема шага показывает цепи и основания условно: это не химические формулы; длина цепи и последовательность выбраны для примера.</p></details></article><article class="card print-unit" id="ns-double-helix"><div class="eyebrow">Комплементарность и матричный принцип · шаг 2 из 30</div><h2>Как две цепи держатся вместе: комплементарность и антипараллельность</h2><p class="lead">Две цепи ДНК соединены основаниями, причём не любыми: A всегда стоит напротив T, G — напротив C. Это и есть <a href="#ns-g-S7-T06">комплементарность</a>. Цепи направлены навстречу друг другу — антипараллельны. Оба свойства нужны, чтобы одна цепь однозначно задавала другую.</p><div class="note"><strong>Что показывает схема.</strong> Две антипараллельные цепи закручены в спираль: остовы снаружи, пары оснований внутри.</div><ol class="mech"><li>В <a href="#ns-g-S7-T13">двойной спирали</a> основания обращены внутрь, сахаро-фосфатные остовы — наружу.</li><li>Пары: A–T с двумя водородными связями, G–C с тремя. В каждой паре один пурин и один пиримидин, поэтому ширина спирали одинакова по всей длине.</li><li>Напротив 5′-конца одной цепи стоит 3′-конец другой — цепи антипараллельны.</li><li>Две цепи удерживаются водородными связями между спаренными основаниями: в паре A–T две связи, в паре G–C три; пары уложены стопкой внутри спирали, а сахаро-фосфатный остов — снаружи.</li></ol><p>Из комплементарности следуют правила Чаргаффа: в двуцепочечной ДНК количество A равно количеству T, количество G — количеству C, а сумма пуринов (A + G) равна сумме пиримидинов (T + C).</p><p>На один виток спирали приходится около 10,4 пары оснований, расстояние между соседними парами — 0,34 нм (по данным для ДНК в растворе). В пробирке длинную ДНК в солевом растворе обычно удаётся разделить на цепи лишь при температурах, близких к кипению воды; точная температура зависит от длины молекулы, доли пар G–C и концентрации солей. В клетке цепи локально разделяют специальные белки — хеликазы (раздел 4).</p><p>Правильность комплементарной цепи проверяют по двум признакам: верно ли подобраны пары оснований и верно ли указаны концы 5′ и 3′. Комплементарную цепь тоже записывают от 5′ к 3′, то есть в обратном порядке: для 5′-AGTC-3′ комплементарна 5′-GACT-3′.</p><div class="static-quiz"><h3>В двуцепочечной ДНК 30 % оснований — аденин. Сколько процентов составляет гуанин?</h3><ol><li><b>А.</b> 30 % <i>(неверный вариант)</i><br><span class="expl">Аденину равен тимин, а не гуанин: A = T, G = C.</span></li><li><b>Б.</b> 20 % <i>(верный вариант)</i><br><span class="expl">A = T, значит, A + T = 60 %; на G + C остаётся 40 %, а G = C, — по 20 %.</span></li><li><b>В.</b> 70 % <i>(неверный вариант)</i><br><span class="expl">70 % приходится на все остальные основания — T, G и C вместе; гуанин — половина от G + C.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Число пар на виток — для ДНК в растворе (B-форма); схема шага не масштабна.</p></details></article><article class="card print-unit" id="ns-template-principle"><div class="eyebrow">Комплементарность и матричный принцип · шаг 3 из 30</div><h2>Почему каждая цепь — матрица для другой</h2><p class="lead">Если одна цепь однозначно задаёт другую, то для копирования достаточно разделить цепи и достроить к каждой комплементарную. Так строение двойной спирали подсказывает механизм копирования — ответ на первый пункт минимального результата семинара.</p><div class="note"><strong>Что показывает схема.</strong> По цепи 1 строится цепь, совпадающая с цепью 2.</div><ol class="mech"><li>Обозначим цепи S и S′. Цепь S служит <a href="#ns-g-S7-T01">матрицей</a> для новой цепи S′, а цепь S′ — для новой цепи S.</li><li>Напротив каждого основания матрицы встаёт комплементарный нуклеотид; <a href="#ns-g-S7-T02">новая цепь</a> антипараллельна матрице.</li><li>В результате получаются две двойные спирали, последовательность которых совпадает с исходной.</li><li>Тот же матричный принцип действует при транскрипции (ДНК → РНК) и трансляции (мРНК → белок).</li></ol><p>Копирование воспроизводимо, а не случайно, потому что выбор каждого нуклеотида ограничен основанием матрицы: напротив C подходит только G, напротив A — только T. Последовательность новой цепи задана заранее, и при повторном копировании воспроизводится та же последовательность.</p><p>Отсюда и «запас» информации: она записана дважды — в каждой из двух цепей. Если одна цепь повреждена, исходную последовательность можно восстановить по другой; на этом основана репарация ДНК (семинар 8).</p><p>Комплементарность делает точное копирование возможным, но не гарантирует его: ДНК-полимераза изредка присоединяет некомплементарный нуклеотид. Как такие ошибки исправляются — тема семинара 8.</p><div class="static-quiz"><h3>Цепь ДНК 5′-ATGC-3′ служит матрицей. Какая цепь будет синтезирована?</h3><ol><li><b>А.</b> 5′-TACG-3′ <i>(неверный вариант)</i><br><span class="expl">Пары подобраны верно, но цепь записана в той же ориентации, что и матрица; антипараллельную цепь записывают в обратном порядке.</span></li><li><b>Б.</b> 5′-ATGC-3′ <i>(неверный вариант)</i><br><span class="expl">Новая цепь комплементарна матрице, а не повторяет её; копия, совпадающая с этой цепью, получится на следующем шаге — по новой цепи.</span></li><li><b>В.</b> 5′-GCAT-3′ <i>(верный вариант)</i><br><span class="expl">Комплементарная цепь антипараллельна: напротив 5′-A…C-3′ стоит 3′-T…G-5′, а записанная от 5′ к 3′ она читается как GCAT.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема качественная; ошибки копирования в модели не показаны.</p></details></article><article class="card print-unit" id="ns-polymerase-rule"><div class="eyebrow">Комплементарность и матричный принцип · шаг 4 из 30</div><h2>Что нужно ДНК-полимеразе: матрица, затравка с 3′-OH и нуклеотиды</h2><p class="lead">Копирует ДНК фермент <a href="#ns-g-S7-T07">ДНК-полимераза</a>. Ей нужны три вещи: матрица, цепь, спаренная с матрицей, со свободным 3′-OH, и <a href="#ns-g-S7-T05">нуклеотиды</a> в форме трифосфатов. Из этих требований следуют главные свойства репликации, разобранные в разделах 3 и 4.</p><div class="note"><strong>Что показывает схема.</strong> Все dNTP есть: синтез доходит до конца матрицы.</div><ol class="mech"><li>Субстрат — дезоксирибонуклеозидтрифосфат (dATP, dTTP, dGTP, dCTP) с тремя фосфатами.</li><li>3′-OH растущей цепи присоединяет α-фосфат нового нуклеотида; образуется фосфодиэфирная связь, а два концевых фосфата уходят в виде пирофосфата.</li><li>Поэтому новая цепь растёт только в направлении 5′→3′, а матрица читается в направлении 3′→5′.</li><li>Начать цепь «с нуля» ДНК-полимераза не может: ей нужна <a href="#ns-g-S7-T03">затравка</a> — участок со спаренным с матрицей 3′-концом.</li></ol><p>Энергия для каждой фосфодиэфирной связи заключена в самом субстрате — в связях трифосфата; гидролиз отщеплённого пирофосфата делает реакцию практически необратимой.</p><p>Полимераза присоединяет нуклеотид, когда он образует правильную пару с основанием матрицы. Так комплементарность превращается в правило работы фермента.</p><p>В клетке затравки — короткие молекулы РНК; их синтезирует праймаза, которая начинает синтез без готовой затравки — ей не нужен готовый 3′-конец (раздел 3).</p><div class="static-quiz"><h3>В пробирке есть одноцепочечная ДНК-матрица, ДНК-полимераза и все четыре dNTP, но нет затравки. Что произойдёт?</h3><ol><li><b>А.</b> Синтез не начнётся: ДНК-полимеразе нужен спаренный с матрицей 3′-OH <i>(верный вариант)</i><br><span class="expl">ДНК-полимераза только удлиняет цепь; начать новую цепь она не может.</span></li><li><b>Б.</b> Полимераза начнёт цепь с 3′-конца матрицы <i>(неверный вариант)</i><br><span class="expl">Ни с одного места полимераза не начинает цепь без затравки; начинать синтез может праймаза — РНК-полимераза.</span></li><li><b>В.</b> Синтез пойдёт в направлении 3′→5′ <i>(неверный вариант)</i><br><span class="expl">Направление синтеза всегда 5′→3′: нуклеотид присоединяется к 3′-OH.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема качественная: показан один шаг удлинения; структура активного центра не изображена.</p></details></article><article class="card print-unit" id="ns-chain-terminator"><div class="eyebrow">Комплементарность и матричный принцип · шаг 5 из 30</div><h2>Нуклеотид без 3′-OH обрывает цепь</h2><p class="lead">Если полимераза присоединит нуклеотид без 3′-OH, следующий нуклеотид присоединить будет не к чему — цепь оборвётся. Такой обрыв происходит точно напротив комплементарного основания матрицы и поэтому «показывает», что стоит в матрице.</p><div class="note"><strong>Что показывает схема.</strong> Все dNTP: синтез доходит до конца матрицы.</div><ol class="mech"><li><a href="#ns-g-S7-T04">Аналог нуклеотида без 3′-OH</a> (например, дидезоксинуклеотид) несёт обычное основание и спаривается как обычный нуклеотид.</li><li>Полимераза включает его напротив комплементарного основания матрицы.</li><li>У включённого аналога нет 3′-OH: следующую фосфодиэфирную связь образовать нельзя, и цепь обрывается.</li><li>Длина оборванной цепи указывает положение соответствующего основания в матрице.</li></ol><p>Обрыв цепи — прямое следствие двух правил: комплементарности (аналог встаёт только напротив своего партнёра) и роста от 3′-OH (после аналога рост невозможен).</p><p>На этом принципе основан метод определения последовательности ДНК обрывом цепей и действие ряда противовирусных аналогов нуклеозидов, которые обрывают синтез вирусной ДНК. Клинический пример приводится для демонстрации патофизиологического значения клеточного механизма.</p><div class="static-quiz"><h3>В смесь вместо dCTP добавлен аналог dCTP без 3′-OH. Где оборвётся новая цепь?</h3><ol><li><b>А.</b> Напротив первого C матрицы <i>(неверный вариант)</i><br><span class="expl">Напротив C матрицы встаёт G, а не C; аналог C встанет напротив G.</span></li><li><b>Б.</b> Сразу после включения аналога напротив первого G матрицы <i>(верный вариант)</i><br><span class="expl">Аналог C спаривается с G; после его включения 3′-OH нет, и цепь обрывается.</span></li><li><b>В.</b> Цепь не оборвётся: основание аналога обычное <i>(неверный вариант)</i><br><span class="expl">Основание обычное, поэтому аналог включается, но у него нет 3′-OH — следующий нуклеотид присоединить нельзя.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема качественная: в модели весь dATP заменён аналогом, поэтому обрыв происходит у первого T матрицы за затравкой; длины условные.</p></details></article><article class="card print-unit" id="ns-four-substrates"><div class="eyebrow">Комплементарность и матричный принцип · шаг 6 из 30</div><h2>Хватит ли исправной полимеразы, чтобы скопировать ДНК?</h2><p class="lead">Уже известно: ДНК-полимераза удлиняет затравку от 3′-OH, присоединяя нуклеотид, комплементарный основанию матрицы (БИО-7·4). Новое: синтезу нужны не только фермент, матрица и затравка, но и все четыре субстрата — dATP, dTTP, dGTP и dCTP. Каждый незаменим.</p><div class="note"><strong>Что показывает схема.</strong> Все четыре dNTP в достатке: полимераза доходит до конца матрицы.</div><ol class="mech"><li>Напротив каждого основания матрицы полимераза присоединяет один определённый нуклеотид: напротив A — T, напротив C — G.</li><li>Субстрат реакции — дезоксирибонуклеозидтрифосфат; энергию для связи даёт его собственный трифосфат.</li><li>Другой dNTP не может заменить нужный без ошибки, поэтому каждый из четырёх dNTP — отдельное необходимое условие синтеза.</li><li>Исправность фермента — необходимое, но не достаточное условие: без нужного субстрата полимераза не продвигается.</li></ol><p>Свободные dNTP клетки — общий <a href="#ns-g-S7-T35">запас</a>, из которого строят новые цепи все вилки сразу. В клетках, где этот запас мал, репликационные вилки движутся медленнее; при промежуточной нехватке сильнее страдают отдельные трудно копируемые участки генома, а не весь геном сразу.</p><p>Если изменить условие и убрать один dNTP, ферменты останутся исправными, а синтез всё равно остановится — на первом месте, где нужен недостающий нуклеотид (следующий шаг).</p><p>Важно различать «фермент не работает» и «ферменту не из чего строить»: внешне оба случая дают недостроенную цепь, но причины и способы их различить разные (третий шаг этого раздела).</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Полимераза исправна, затравка спарена с матрицей, но в среде нет dCTP. Что ограничивает синтез?</h3><ol><li><b>А.</b> Нехватка энергии: без dCTP полимераза не получает энергии и для других нуклеотидов <i>(неверный вариант)</i><br><span class="expl">Энергию для каждой связи даёт трифосфат присоединяемого нуклеотида; dATP, dTTP и dGTP присоединяются, пока они нужны матрице.</span></li><li><b>Б.</b> Дефект фермента: полимераза без dCTP повреждается <i>(неверный вариант)</i><br><span class="expl">Полимераза остаётся исправной: если вернуть dCTP, синтез продолжится.</span></li><li><b>В.</b> Нехватка субстрата: напротив G матрицы нужен C, и другим dNTP его не заменить <i>(верный вариант)</i><br><span class="expl">Фермент исправен; не хватает одного из четырёх необходимых субстратов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.004">Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314</a></li></ul><p>Учебная модель: одна матрица из 12 нуклеотидов, затравка из 3, исправная полимераза; запас dNTP показан качественно («в достатке», «мало», «нет»). Связь запаса dNTP со скоростью вилок — по обзору литературы; скорость модель не рассчитывает.</p></details></article><article class="card print-unit" id="ns-first-missing"><div class="eyebrow">Комплементарность и матричный принцип · шаг 7 из 30</div><h2>Почему синтез останавливается именно там, где нужен недостающий dNTP?</h2><p class="lead">Уже известно: без одного dNTP синтез не идёт дальше места, где этот нуклеотид нужен. Новое: место остановки задаёт последовательность матрицы — и по месту остановки можно рассуждать о том, каких dNTP не было.</p><div class="note"><strong>Что показывает схема.</strong> Нет dATP: остановка перед позицией 5.</div><ol class="mech"><li>Полимераза движется по матрице и присоединяет нуклеотиды по одному.</li><li>Пока матрица требует имеющиеся dNTP, цепь растёт.</li><li>Первая позиция, где нужен отсутствующий нуклеотид, становится местом остановки; 3′-OH последнего присоединённого нуклеотида при этом цел.</li><li>Если отсутствует другой dNTP, место остановки другое: в учебной матрице без dATP цепь останавливается перед позицией 5, без dGTP — перед 7, без dTTP — перед 8.</li></ol><p>Если изменить условие и убрать два dNTP сразу, остановка произойдёт на первой позиции, где нужен любой из них: второй недостающий нуклеотид на наблюдение не влияет.</p><p>Отсюда обратная задача. Наблюдение «синтез остановился перед позицией 7, где нужен G» говорит больше, чем кажется: dCTP и dATP были (они нужны раньше и уже встроены), dGTP не было. А про dTTP, который нужен только позже, по этому наблюдению сказать ничего нельзя.</p><p>Здесь изучается только ограничение субстратом. Что происходит, если напротив основания встаёт неправильный нуклеотид, и как такие ошибки исправляются, — семинар 8.</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Новая цепь должна расти так: A T G | C A C G T A G C T (до черты — затравка). Синтез остановился перед позицией 5. Чего точно не было в среде?</h3><ol><li><b>А.</b> dATP: на позиции 5 впервые после затравки нужен A <i>(верный вариант)</i><br><span class="expl">На позиции 4 нужен C — он встроен; на позиции 5 нужен A — его не было.</span></li><li><b>Б.</b> dCTP: C встречается в новой цепи чаще других нуклеотидов <i>(неверный вариант)</i><br><span class="expl">dCTP был: C на позиции 4 уже встроен. Место остановки задаёт первая позиция, где нужен отсутствующий нуклеотид, а не частота.</span></li><li><b>В.</b> dATP и dGTP: оба нужны после затравки, оба отсутствовали <i>(неверный вариант)</i><br><span class="expl">Об отсутствии dGTP по этому наблюдению сказать нельзя: G нужен только на позиции 7, после места остановки.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Учебная модель: остановка дискретна и происходит перед первой позицией, где нужен отсутствующий dNTP; встраивание неправильных нуклеотидов не рассматривается.</p></details></article><article class="card print-unit" id="ns-substrate-vs-terminator"><div class="eyebrow">Комплементарность и матричный принцип · шаг 8 из 30</div><h2>Как отличить нехватку dNTP от обрыва цепи аналогом без 3′-OH?</h2><p class="lead">Уже известно: аналог нуклеотида без 3′-OH обрывает цепь (БИО-7·5). Новое: нехватка dNTP тоже останавливает синтез, но остановка обратима — 3′-OH остаётся.</p><div class="note"><strong>Что показывает схема.</strong> Нет dGTP: остановка перед позицией 7; 3′-OH цел.</div><ol class="mech"><li>При нехватке dNTP последний присоединённый нуклеотид обычный, его 3′-OH цел.</li><li>Если нужный dNTP вернуть, полимераза присоединит его к тому же 3′-OH и продолжит синтез.</li><li>Аналог без 3′-OH встраивается в цепь, но следующую связь образовать не к чему: возвращение обычных dNTP цепь не удлиняет.</li><li>Если нужного dNTP не «нет», а «мало», в учебной модели синтез доходит до конца; на позициях, где нужен этот нуклеотид, возможна задержка.</li></ol><p>Различающее наблюдение — что будет, если вернуть недостающий субстрат: при нехватке dNTP цепь продолжает расти, при обрыве аналогом — нет.</p><p>«Мало» и «нет» — разные условия. Насколько замедлится синтез при малом запасе, зависит от кинетики реакции; это не простая пропорция, и модель её не рассчитывает.</p><p>Как это узнали: в клетках, где нарушен синтез dNTP или их баланс, репликационные вилки замедляются. Это показывает связь запаса dNTP со скоростью вилок, но не задаёт формулы этой зависимости.</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Синтез остановился. Затем в среду добавили все четыре dNTP, и цепь продолжила расти. Что было причиной остановки?</h3><ol><li><b>А.</b> Встраивание аналога без 3′-OH в последнюю позицию цепи <i>(неверный вариант)</i><br><span class="expl">После аналога цепь не удлиняется и при добавлении dNTP: нет 3′-OH.</span></li><li><b>Б.</b> Нехватка одного из dNTP: 3′-OH оставался свободным <i>(верный вариант)</i><br><span class="expl">Последний нуклеотид был обычным, его 3′-OH цел: цепь удлинилась от того же конца, значит, не хватало только субстрата.</span></li><li><b>В.</b> Временное повреждение полимеразы, которое прошло само <i>(неверный вариант)</i><br><span class="expl">Неисправная полимераза не начала бы работать от одного лишь добавления dNTP.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.004">Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314</a></li></ul><p>Учебная модель: восстановление запаса идеализировано — синтез продолжается сразу; в клетке длительная остановка вилки имеет и другие последствия, которые рассматриваются в курсе «Молекулярная биология».</p></details></article><article class="card print-unit" id="ns-semiconservative"><div class="eyebrow">Полуконсервативная репликация: точка начала и две вилки · шаг 9 из 30</div><h2>Строение молекулы предсказывает полуконсервативность</h2><p class="lead">Если каждая цепь служит матрицей (БИО-7·3), то каждая дочерняя молекула получит одну старую цепь и одну новую. Такой способ копирования называют полуконсервативным. Это второй пункт минимального результата и первая часть вопроса 2 коллоквиума 2 (предварительный список).</p><div class="note"><strong>Что показывает схема.</strong> Внутри пузырька каждая старая цепь спарена с новой: каждая дочерняя молекула — старая + новая цепь.</div><ol class="mech"><li>Цепи родительской молекулы расходятся в репликационной вилке.</li><li>К каждой старой цепи по правилам комплементарности достраивается новая.</li><li>Каждая дочерняя двойная спираль состоит из одной старой (сохранённой) и одной новой цепи.</li><li>Обе дочерние молекулы по последовательности совпадают с родительской, если при копировании не возникло ошибок.</li></ol><p>Слово «полуконсервативная» означает, что сохраняется половина родительской молекулы — одна цепь в каждой дочерней. Строение молекулы предсказывает этот способ, но само по себе не исключает другие мыслимые — консервативный (одна дочерняя молекула целиком старая, другая целиком новая) и дисперсный (старый и новый материал перемешан внутри цепей). Выбор между ними сделал эксперимент: ДНК бактерий, выросших на среде с тяжёлым изотопом азота ¹⁵N, после одного удвоения на среде с ¹⁴N имела промежуточную плотность (это исключает консервативный способ), а после второго — наполовину промежуточную и наполовину лёгкую (это исключает дисперсный).</p><p>Старая цепь сохраняет в дочерней молекуле свои химические метки, например метилирование цитозинов; по ним метки восстанавливаются на новой цепи.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как после репликации полуметилированная ДНК снова становится метилированной на обеих цепях — <a href="https://fresll.github.io/molbio/seminar-6-route.html#maintenance">МБ, семинар 6, шаг 3</a>; почему метилирование убывает, если его не восстанавливать, — <a href="https://fresll.github.io/molbio/seminar-6-route.html#passive-loss">МБ, семинар 6, шаг 4</a>.</p><div class="static-quiz"><h3>Почему дочерняя молекула ДНК содержит одну старую и одну новую цепь?</h3><ol><li><b>А.</b> Старые цепи после копирования снова соединяются друг с другом <i>(неверный вариант)</i><br><span class="expl">В полуконсервативном способе старые цепи не соединяются вновь: каждая остаётся в паре со своей новой цепью.</span></li><li><b>Б.</b> Каждая старая цепь служит матрицей и остаётся спаренной с построенной на ней новой цепью <i>(верный вариант)</i><br><span class="expl">Новая цепь строится напротив старой и образует с ней двойную спираль — так получается полуконсервативность.</span></li><li><b>В.</b> Новые цепи собирают из кусков старых <i>(неверный вариант)</i><br><span class="expl">Новая цепь синтезируется из нуклеотидов среды; старый и новый материал внутри цепей не перемешиваются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1073/pnas.44.7.671">Meselson M., Stahl F. W. The replication of DNA in Escherichia coli. Proc Natl Acad Sci USA. 1958;44:671–682</a></li></ul><p>Схема качественная: длины и время условные.</p></details></article><article class="card print-unit" id="ns-origin-bubble"><div class="eyebrow">Полуконсервативная репликация: точка начала и две вилки · шаг 10 из 30</div><h2>Точка начала репликации: пузырёк и две вилки</h2><p class="lead">Репликация начинается не в любом месте молекулы, а в <a href="#ns-g-S7-T14">точках начала репликации</a> (ориджинах). От каждой точки начала в противоположные стороны расходятся две <a href="#ns-g-S7-T16">репликационные вилки</a>; участок между ними — <a href="#ns-g-S7-T15">пузырёк репликации</a>.</p><div class="note"><strong>Что показывает схема.</strong> Одна вилка за то же время скопировала только часть участка по одну сторону от точки начала.</div><ol class="mech"><li>Белки-инициаторы связываются с точкой начала; у эукариот её узнаёт комплекс узнавания точки начала репликации (ORC).</li><li>В точке начала активируются две хеликазы, загруженные на неё ещё до S-фазы (шаг БИО-7·11); двойная спираль расплетается, образуется пузырёк.</li><li>На двух краях пузырька работают две вилки; они движутся в противоположные стороны — репликация двунаправленная.</li><li>Внутри пузырька ДНК уже скопирована, снаружи остаётся родительская двойная спираль.</li></ol><p>Двунаправленность важна количественно: две вилки копируют ДНК по обе стороны от точки начала одновременно, и при той же скорости вилок участок копируется вдвое быстрее, чем копировала бы одна вилка.</p><p>Хромосома кишечной палочки — одна кольцевая молекула ДНК длиной 4,6 млн пар нуклеотидов — имеет одну точку начала; две вилки, расходящиеся от неё со скоростью около 1000 нуклеотидов в секунду, встречаются примерно на противоположной стороне кольца. У эукариот вилки движутся примерно в 20 раз медленнее (около 50 нуклеотидов в секунду по оценке учебника), а молекулы ДНК намного длиннее — поэтому точек начала много (следующий шаг).</p><p>Двойную спираль в точке начала у эукариот расплетают не белки ORC, а собранная на точке начала хеликаза (раздел 4).</p><div class="static-quiz"><h3>Сколько репликационных вилок образуется от одной точки начала и куда они движутся?</h3><ol><li><b>А.</b> Одна, от 5′-конца к 3′-концу хромосомы <i>(неверный вариант)</i><br><span class="expl">От точки начала образуются две вилки; направление синтеза 5′→3′ относится к новым цепям, а не к движению вилки по хромосоме.</span></li><li><b>Б.</b> Две, навстречу друг другу <i>(неверный вариант)</i><br><span class="expl">Навстречу друг другу движутся вилки соседних точек начала; вилки одной точки начала расходятся.</span></li><li><b>В.</b> Две, в противоположные стороны <i>(верный вариант)</i><br><span class="expl">Репликация от точки начала двунаправленная: две вилки на краях пузырька расходятся.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема качественная; скорости вилок — оценки учебника для E. coli и клеток эукариот (по удлинению меченых участков ДНК, авторадиография); в клетке скорость вилок может меняться.</p></details></article><article class="card print-unit" id="ns-replicon"><div class="eyebrow">Полуконсервативная репликация: точка начала и две вилки · шаг 11 из 30</div><h2>Репликон и множество точек начала</h2><p class="lead"><a href="#ns-g-S7-T17">Репликон</a> — участок ДНК, который копируется от одной точки начала. Длинная молекула эукариотической ДНК разделена на множество репликонов: вилки соседних точек начала встречаются, и скопированные участки сливаются.</p><div class="note"><strong>Что показывает схема.</strong> Три точки начала за тот же шаг: вилки соседних точек начала встретились, весь участок скопирован.</div><ol class="mech"><li>В каждой хромосоме много точек начала; по оценке учебника, в клетке человека при каждом делении используется около 30–50 тысяч точек начала, а потенциальных точек начала в несколько раз больше (по разным оценкам — в 3–10 раз); такие оценки зависят от типа клеток и метода.</li><li>От каждой точки начала расходятся две вилки.</li><li>Встречные вилки соседних точек начала встречаются, пузырьки сливаются, и новые цепи соседних репликонов соединяются.</li><li>Точки начала запускаются не одновременно, а в разное время на протяжении S-фазы; каждая — не более одного раза за S-фазу.</li></ol><p>Множество точек начала сокращает время копирования длинной молекулы, но скорость каждой вилки при этом не растёт: увеличивается число вилок, работающих одновременно.</p><h3>Сверх программы: почему каждая точка начала используется один раз</h3><p>Каждый участок должен быть скопирован ровно один раз за цикл. До S-фазы — с конца митоза и в G1 — на участке ДНК собирается неактивная хеликаза: участок подготовлен к запуску. Это подготовка (лицензирование) точки начала. В S-фазе часть подготовленных точек запускается: хеликаза активируется и начинает расплетать ДНК. Новых точек в S-фазе не подготавливается, а точка, через которую прошла вилка, теряет подготовку; поэтому каждая точка используется не более одного раза. Сверх программы — на коллоквиуме и зачёте не требуется.</p><details><summary>Справка (необязательно): какие белки в этом участвуют</summary><p>Подготовку проводят комплекс узнавания точки начала (ORC) и белки Cdc6 и Cdt1: они загружают на ДНК две кольцевые хеликазы MCM (белки поддержания минихромосом). При запуске к MCM присоединяются Cdc45 и комплекс GINS, и образуется активная хеликаза CMG (комплекс Cdc45–MCM–GINS). Названия белков для решения заданий не нужны.</p></details><p>S-фаза клетки млекопитающего длится около 8 часов. Порядок активации точек начала связан с состоянием хроматина: по обобщению литературы, большинство активных генов копируется в начале S-фазы, а неактивные гены и повторяющиеся последовательности — позже.</p><div class="static-quiz"><h3>Зачем эукариотической хромосоме много точек начала, если вилки от этого не ускоряются?</h3><ol><li><b>А.</b> Одновременно работает больше вилок, и длинная молекула копируется за время S-фазы <i>(верный вариант)</i><br><span class="expl">Время копирования сокращается за счёт числа вилок, а не их скорости.</span></li><li><b>Б.</b> Каждый участок копируется несколько раз для надёжности <i>(неверный вариант)</i><br><span class="expl">Каждый участок копируется ровно один раз; повторное копирование не допускается.</span></li><li><b>В.</b> Вилки соседних точек начала ускоряют друг друга <i>(неверный вариант)</i><br><span class="expl">Вилки соседних точек начала не ускоряют друг друга; встретившись, вилки завершают синтез.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1083/jcb.140.6.1285">Jackson D. A., Pombo A. Replicon clusters are stable units of chromosome structure: evidence that nuclear organization contributes to the efficient activation and propagation of S phase in human cells. J Cell Biol. 1998;140:1285–1295</a></li><li><a href="https://doi.org/10.1038/s41594-025-01587-5">Stillman B., Diffley J. F. X., Iwasa J. H. Mechanisms for licensing origins of DNA replication in eukaryotic cells. Nat Struct Mol Biol. 2025;32:1143–1153</a></li></ul><p>Числа — по учебнику (клетки человека); схема качественная.</p></details></article><article class="card print-unit" id="ns-licensed-vs-fired"><div class="eyebrow">Полуконсервативная репликация: точка начала и две вилки · шаг 12 из 30</div><h2>Чем подготовленная точка начала отличается от запущенной?</h2><p class="lead">Уже известно: в хромосоме человека много точек начала, от каждой расходятся две вилки (БИО-7·11). Новое: подготовка (лицензирование) точки начала и её запуск — разные события, разделённые во времени; подготовленных точек больше, чем запускается, и какие из них запустятся, в каждой клетке решается заново.</p><div class="note"><strong>Что показывает схема.</strong> Вилки встретились; точка В скопирована проходящей вилкой и в этой клетке не запустилась.</div><ol class="mech"><li>До S-фазы на участке ДНК собирается неактивная хеликаза: участок подготовлен к возможному запуску. Это подготовка (лицензирование) точки начала; белки этого процесса перечислены в необязательной справке шага БИО-7·11 и здесь не нужны.</li><li>В S-фазе часть подготовленных точек запускается и даёт по две вилки; какие именно — во многом случайно.</li><li>Другие подготовленные точки остаются неактивными; их копирует вилка соседней точки начала, и вместе с участком точка теряет подготовку.</li><li>В S-фазе новые точки не подготавливаются; поэтому скопированный участок в ту же S-фазу второй раз не копируется.</li></ol><p>По оценкам для клеток млекопитающих, подготовленных точек в несколько раз больше, чем запускается (по разным оценкам — в 3–10 раз); точная кратность зависит от типа клеток и способа оценки. В обычной S-фазе большинство из них остаются <a href="#ns-g-S7-T36">резервными</a>.</p><p>Запрет на подготовку новых точек в S-фазе защищает от повторного копирования участков: если бы точки начала подготавливались заново на уже скопированной ДНК, эти участки удваивались бы лишний раз.</p><p>Какие из подготовленных точек запустятся в конкретной клетке, во многом случайно: одна и та же точка может работать в одной клетке и оставаться резервной в другой. Поэтому «резервная» — не особый вид точки, а её судьба в данной клетке и данной S-фазе.</p><p>У клеток человека нет точек начала с единой последовательностью. Когда запуски репликации определили на отдельных молекулах ДНК, большинство из них оказались рассеянными по геному, и каждое такое место используется редко. Поэтому схема с точками A, В и Б — учебная модель, а не карта хромосомы.</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Резервную точку начала скопировала проходящая вилка. Может ли эта точка запуститься позже в той же S-фазе?</h3><ol><li><b>А.</b> Да: подготовленная точка запускается обязательно, раньше или позже <i>(неверный вариант)</i><br><span class="expl">Большинство подготовленных точек в обычной S-фазе так и остаются неиспользованными.</span></li><li><b>Б.</b> Да, если соседняя вилка остановится <i>(неверный вариант)</i><br><span class="expl">Резервная точка может помочь остановленной вилке, только пока сама ещё не скопирована.</span></li><li><b>В.</b> Нет: она потеряла подготовку, а новые точки в S-фазе не появляются <i>(верный вариант)</i><br><span class="expl">Это и предотвращает повторное копирование участка в одном цикле.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1016/j.tibs.2011.05.002">Blow J. J., Ge X. Q., Jackson D. A. How dormant origins promote complete genome replication. Trends Biochem Sci. 2011;36:405–414</a></li><li><a href="https://doi.org/10.1186/s13059-025-03591-w">Carrington J. T., Wilson R. H. C., de La Vega E., Thiyagarajan S., Barker T., Catchpole L., Durrant A., Knitlhoffer V., Watkins C., Gharbi K., Nieduszynski C. A. Most human DNA replication initiation is dispersed throughout the genome with only a minority within previously identified initiation zones. Genome Biol. 2025;26:122</a></li></ul><p>Схема — учебная модель участка хромосомы, а не карта реальных точек начала: места и время запуска заданы правилами модели. Наборы запущенных точек в режиме «разные клетки» условные; одинаковая подготовка точек во всех клетках — упрощение. Данные о рассеянных запусках получены на культивируемых клетках человека одним методом — чтением отдельных молекул ДНК; доля таких запусков зависит от метода. Белки подготовки точек начала здесь не рассматриваются.</p></details></article><article class="card print-unit" id="ns-dormant-rescue"><div class="eyebrow">Полуконсервативная репликация: точка начала и две вилки · шаг 13 из 30</div><h2>Как резервная точка начала помогает, если вилка остановилась?</h2><p class="lead">Уже известно: участок между двумя точками начала копируют вилки, идущие навстречу друг другу. Новое: если вилка останавливается, промежуток за ней могут закрыть два разных механизма — встречная вилка или вилки резервной точки.</p><div class="note"><strong>Что показывает схема.</strong> Промежуток закрыла встречная вилка от Б — к шагу 6.</div><ol class="mech"><li><a href="#ns-g-S7-T37">Вилка останавливается</a>, например при нехватке dNTP или встрече с препятствием на матрице.</li><li>Встречная вилка соседней точки начала продолжает движение и может дойти до остановленной.</li><li>Резервная точка, которая лежит в ещё не скопированном промежутке, может запуститься и дать две новые вилки — может, но не обязана. В этой модели остановленная вилка не возобновляется; в клетке остановленная вилка иногда может продолжить движение.</li><li>По простой расчётной модели авторов обзора: чем медленнее идут вилки, тем дольше подготовленные точки остаются нескопированными — и тем вероятнее, что какая-то из них запустится. В клетке запуск дополнительно регулируется.</li></ol><p>Встречная вилка и резервная точка — разные способы закрыть промежуток. Не каждую встречную вилку следует считать «пробуждением резерва»: она пришла от точки начала, запущенной в обычном порядке.</p><p>Если изменить условие и отодвинуть соседнюю точку начала, встречной вилке понадобится больше времени. В модели при дальней точке Б и без резерва она не успевает до конца S-фазы, и часть участка остаётся нескопированной.</p><p>Как это узнали: в клетках, где вилки замедлили, работает больше точек начала, и расположены они ближе друг к другу. Клетки с уменьшенным количеством подготовленных точек в обычных условиях реплицируются почти нормально, но при замедлении вилок запускают меньше резервных точек, медленнее проходят S-фазу и хуже выживают.</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Вилка остановилась, соседняя точка начала близко, резервных точек нет. Что, скорее всего, произойдёт с промежутком за остановленной вилкой?</h3><ol><li><b>А.</b> Его скопирует встречная вилка, если успеет до конца S-фазы <i>(верный вариант)</i><br><span class="expl">Встречная вилка — первый способ закрыть промежуток; её успех зависит от расстояния и времени.</span></li><li><b>Б.</b> Он останется нескопированным: без резерва помочь некому <i>(неверный вариант)</i><br><span class="expl">Встречная вилка продолжает движение и может дойти до остановленной.</span></li><li><b>В.</b> В S-фазе на этом месте будет подготовлена новая точка начала <i>(неверный вариант)</i><br><span class="expl">Новые точки в S-фазе не подготавливаются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.tibs.2011.05.002">Blow J. J., Ge X. Q., Jackson D. A. How dormant origins promote complete genome replication. Trends Biochem Sci. 2011;36:405–414</a></li><li><a href="https://doi.org/10.1016/j.dnarep.2014.03.012">Alver R. C., Chadha G. S., Blow J. J. The contribution of dormant origins to genome stability: from cell biology to human genetics. DNA Repair (Amst). 2014;19:182–189</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.004">Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314</a></li></ul><p>Учебная модель: скорость вилок задана постоянной (1 условная единица за шаг) — это правило модели, а не свойство клетки: в клетке скорость вилок меняется, и единой формулы её связи с числом запусков нет. Окно S-фазы — 10 шагов. Переключатель задаёт исход для одной клетки: резервная точка у остановленной вилки на шаге 3 запустилась или нет; в клетке её запуск вероятностный. Остановленная вилка в модели не возобновляется.</p></details></article><article class="card print-unit" id="ns-reserve-limits"><div class="eyebrow">Полуконсервативная репликация: точка начала и две вилки · шаг 14 из 30</div><h2>Когда резерв незаменим, а когда и он не помогает?</h2><p class="lead">Уже известно: одну остановленную вилку может заменить встречная. Новое: если обе встречные вилки остановились и не возобновляют движение, начать копирование промежутка в той же S-фазе может только точка начала, подготовленная внутри него заранее.</p><div class="note"><strong>Что показывает схема.</strong> Резерва нет: промежуток 2–6 скопировать некому.</div><ol class="mech"><li>Две встречные вилки остановились — если они не возобновятся, к промежутку между ними больше не идёт ни одна вилка.</li><li>Новую точку начала в S-фазе подготовить нельзя.</li><li>Если в промежутке есть ещё не скопированная подготовленная точка, она может запуститься и скопировать промежуток.</li><li>Если такой точки нет или она не запустилась, промежуток к концу S-фазы остаётся нескопированным.</li></ol><p>Отсюда смысл избытка подготовленных точек: чем их больше, тем вероятнее, что между двумя остановленными вилками найдётся хотя бы одна. В расчётной модели репликации участка хромосомы защиту от двойной остановки определяет плотность подготовленных точек, а не частота их запуска.</p><p>Обратная задача. Наблюдение «к концу S-фазы между двумя отметками остался нескопированный участок» совместимо с несколькими причинами: резервная точка не была подготовлена или была подготовлена, но не запустилась. Различить их помогло бы независимое наблюдение — состояние точки до начала S-фазы.</p><p>Модель не обещает универсальной помощи: резервной точки в нужном месте может не оказаться, её запуск вероятностный. У мышей с уменьшенным количеством подготовленных точек чаще возникают повреждения ДНК и опухоли — это показывает значение резерва для сохранности генома, но не делает его гарантией.</p><p>Резервная точка — способ начать новые вилки внутри такого промежутка, но не единственный способ его закрыть: в клетке остановленная вилка иногда возобновляет движение, а недокопированные участки иногда достраиваются позже. Как это происходит, рассматривает курс «Молекулярная биология».</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Обе встречные вилки остановились. Между ними есть подготовленная, ещё не скопированная точка начала. Что предсказывает модель?</h3><ol><li><b>А.</b> Ничего: резерв помогает, только если одна из вилок продолжает двигаться <i>(неверный вариант)</i><br><span class="expl">Именно при двух остановленных вилках резерв незаменим.</span></li><li><b>Б.</b> Она может запуститься и скопировать промежуток; это вероятно, но не гарантировано <i>(верный вариант)</i><br><span class="expl">Только подготовленная точка внутри промежутка может его скопировать.</span></li><li><b>В.</b> Её запуск не нужен: остановленные вилки возобновятся сами <i>(неверный вариант)</i><br><span class="expl">Модель не рассматривает возобновление остановленных вилок; и в клетке оно не гарантировано.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.tibs.2011.05.002">Blow J. J., Ge X. Q., Jackson D. A. How dormant origins promote complete genome replication. Trends Biochem Sci. 2011;36:405–414</a></li><li><a href="https://doi.org/10.1016/j.dnarep.2014.03.012">Alver R. C., Chadha G. S., Blow J. J. The contribution of dormant origins to genome stability: from cell biology to human genetics. DNA Repair (Amst). 2014;19:182–189</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.004">Saxena S., Zou L. Hallmarks of DNA replication stress. Mol Cell. 2022;82:2298–2314</a></li></ul><p>Учебная модель: одна резервная точка (отметка 4); при дальней точке Б — две (отметки 4 и 12). Что происходит с остановленными вилками и какие сигналы при этом возникают, рассматривается в курсе «Молекулярная биология».</p></details></article><article class="card print-unit" id="ns-fork-asymmetry"><div class="eyebrow">Ведущая и отстающая цепи · шаг 15 из 30</div><h2>Почему одна новая цепь растёт непрерывно, а другая — фрагментами</h2><p class="lead">В вилке копируются обе матрицы одновременно, но новые цепи растут по-разному: одна непрерывно, другая короткими отрезками. Это третий пункт минимального результата: причина — сочетание двух правил, известных из раздела 1.</p><div class="note"><strong>Что показывает схема.</strong> Вилка прошла три шага: ведущая цепь удлинилась, на отстающей добавились новые фрагменты.</div><ol class="mech"><li>Матрицы антипараллельны: одна идёт в вилку 3′-концом вперёд, другая — 5′-концом.</li><li>ДНК-полимераза наращивает цепь только 5′→3′, то есть читает матрицу 3′→5′.</li><li>На одной матрице направление роста совпадает с движением вилки: <a href="#ns-g-S7-T28">ведущая цепь</a> растёт непрерывно вслед за хеликазой.</li><li>На другой матрице рост направлен против движения вилки: <a href="#ns-g-S7-T29">отстающая цепь</a> синтезируется короткими <a href="#ns-g-S7-T27">фрагментами Оказаки</a>, каждый — от новой затравки у вилки к предыдущему фрагменту.</li></ol><p>В вилке, где обе матрицы копируются одновременно (у бактерий и в ядре эукариот), асимметрия неизбежна и не зависит от организма: она следует из антипараллельности цепей и единого для всех ДНК-полимераз правила 5′→3′. Поэтому фрагменты Оказаки есть и у бактерий, и у эукариот; различается только их длина — 1000–2000 нуклеотидов у бактерий и 100–200 у эукариот.</p><p>Вилка продвигается по обеим матрицам с одной средней скоростью, но на каждом участке синтез отстающей цепи начинается позже: его приходится начинать заново каждый раз, когда вилка освобождает новый участок матрицы.</p><div class="static-quiz"><h3>Почему отстающая цепь синтезируется фрагментами?</h3><ol><li><b>А.</b> Полимераза отстающей цепи синтезирует цепь в направлении 3′→5′ <i>(неверный вариант)</i><br><span class="expl">Все ДНК-полимеразы синтезируют цепь только 5′→3′; поэтому и нужны фрагменты.</span></li><li><b>Б.</b> Матрица отстающей цепи повреждена и копируется кусками <i>(неверный вариант)</i><br><span class="expl">Матрица не повреждена; прерывистость следует из направления синтеза относительно хода вилки.</span></li><li><b>В.</b> Её рост 5′→3′ направлен против движения вилки, и каждый новый участок матрицы приходится начинать с новой затравки <i>(верный вариант)</i><br><span class="expl">Антипараллельность матриц и правило 5′→3′ делают непрерывный синтез на этой матрице невозможным.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема качественная: длины фрагментов и число шагов условные.</p></details></article><article class="card print-unit" id="ns-bubble-roles"><div class="eyebrow">Ведущая и отстающая цепи · шаг 16 из 30</div><h2>Одна и та же матрица — ведущая у одной вилки и отстающая у другой</h2><p class="lead">От точки начала расходятся две вилки в противоположные стороны. Что происходит с одной и той же матрицей у двух вилок? Ответ связывает вопросы 2 и 3 коллоквиума: двунаправленность и асимметрию вилки.</p><div class="note"><strong>Что показывает схема.</strong> Левая вилка: на цепи 1 — отстающая, на цепи 2 — ведущая.</div><ol class="mech"><li>На каждой матрице новая цепь растёт в одном и том же направлении — 5′→3′.</li><li>Вилки одной точки начала движутся в противоположные стороны.</li><li>Поэтому у одной вилки рост на данной матрице совпадает с её ходом (ведущая цепь), а у другой — противоположен (отстающая).</li><li>В каждой половине пузырька обе матрицы копируются: одна непрерывно, другая фрагментами.</li></ol><p>«Ведущая» и «отстающая» — свойства новой цепи относительно хода конкретной вилки, а не свойства матрицы. На одной матрице по обе стороны от точки начала образуются и ведущая, и отстающая цепи.</p><p>Одна и та же родительская цепь служит матрицей ведущей цепи у одной вилки и фрагментов отстающей цепи у другой. Все новые участки растут 5′→3′, и у каждого фрагмента Оказаки своя затравка. При встрече вилок соседних репликонов новые цепи соединяются.</p><div class="static-quiz"><h3>У правой вилки новая цепь на цепи 2 — отстающая. Какая новая цепь на цепи 2 у левой вилки той же точки начала?</h3><ol><li><b>А.</b> Ведущая <i>(верный вариант)</i><br><span class="expl">Левая вилка движется в обратную сторону, поэтому рост 5′→3′ на цепи 2 совпадает с её ходом.</span></li><li><b>Б.</b> Тоже отстающая <i>(неверный вариант)</i><br><span class="expl">Роль новой цепи зависит от направления хода вилки; у вилок, расходящихся в разные стороны, роли меняются.</span></li><li><b>В.</b> Цепь 2 у левой вилки не копируется <i>(неверный вариант)</i><br><span class="expl">Каждая вилка копирует обе матрицы.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-7.html#q2">Вопрос 2 →</a> <a href="seminar-7.html#q3">Вопрос 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Схема качественная: показаны вилки, отходящие от одной точки начала.</p></details></article><article class="card print-unit" id="ns-lagging-primers"><div class="eyebrow">Ведущая и отстающая цепи · шаг 17 из 30</div><h2>Каждому фрагменту Оказаки — своя затравка</h2><p class="lead">ДНК-полимераза не начинает цепь без затравки, поэтому каждый фрагмент отстающей цепи начинается с короткой молекулы РНК. Затравки синтезирует <a href="#ns-g-S7-T20">праймаза</a> — РНК-полимераза, которая начинает синтез без готовой затравки: ей не нужен готовый 3′-конец.</p><div class="note"><strong>Что показывает схема.</strong> Вилка продвинулась: праймаза синтезировала ещё одну затравку, начался ещё один фрагмент.</div><ol class="mech"><li>Хеликаза освобождает у вилки новый участок матрицы отстающей цепи.</li><li>Праймаза синтезирует на нём РНК-затравку; у эукариот затравки около 10 нуклеотидов, они образуются через каждые 100–200 нуклеотидов.</li><li>У эукариот праймаза работает в комплексе с <a href="#ns-g-S7-T30">ДНК-полимеразой α</a>, которая удлиняет затравку коротким участком ДНК (около 20 нуклеотидов).</li><li>Дальше фрагмент удлиняет <a href="#ns-g-S7-T31">ДНК-полимераза δ</a>, пока не дойдёт до предыдущего фрагмента.</li></ol><p>Ведущей цепи затравка нужна один раз — в начале, у точки начала репликации; дальше её непрерывно удлиняет <a href="#ns-g-S7-T32">ДНК-полимераза ε</a>. Отстающей цепи затравка нужна для каждого фрагмента.</p><p>У полимеразы α нет корректирующей активности; её участок затем в основном заменяется при созревании фрагмента (шаг «Созревание фрагментов Оказаки»).</p><div class="static-quiz"><h3>Сколько РНК-затравок нужно ведущей и отстающей цепи при синтезе длинного участка?</h3><ol><li><b>А.</b> По одной на каждую цепь <i>(неверный вариант)</i><br><span class="expl">Отстающая цепь начинается заново много раз, и каждый раз нужна затравка.</span></li><li><b>Б.</b> Ведущей — одна, отстающей — по одной на каждый фрагмент <i>(верный вариант)</i><br><span class="expl">Ведущая цепь растёт непрерывно от одной затравки; каждый фрагмент отстающей начинается со своей.</span></li><li><b>В.</b> Ни одной: ДНК-полимераза сама начинает цепь <i>(неверный вариант)</i><br><span class="expl">ДНК-полимераза удлиняет только спаренный 3′-конец; начинает синтез праймаза.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Длины затравок и интервалы — для клеток эукариот по учебнику; схема качественная.</p></details></article><article class="card print-unit" id="ns-sliding-clamp"><div class="eyebrow">Ведущая и отстающая цепи · шаг 18 из 30</div><h2>Зажим и его погрузчик: как полимераза остаётся на матрице</h2><p class="lead">Сама по себе ДНК-полимераза синтезирует лишь короткий отрезок и отходит от матрицы. Удерживает её <a href="#ns-g-S7-T21">скользящий зажим</a> — белковое кольцо вокруг ДНК. Надевает зажим на ДНК <a href="#ns-g-S7-T22">погрузчик зажима</a>, расходуя АТФ.</p><div class="note"><strong>Что показывает схема.</strong> Кольцо замкнуто вокруг дуплекса; погрузчик уходит, полимераза δ связывается с зажимом.</div><ol class="mech"><li>Погрузчик (у эукариот — RFC, репликационный фактор C) размыкает кольцо зажима (PCNA — ядерный антиген пролиферирующих клеток) и надевает его на ДНК у 3′-конца затравки.</li><li>Полимераза связывается с зажимом; кольцо скользит вдоль ДНК вместе с ней.</li><li>Закончив фрагмент у 5′-конца предыдущего, полимераза освобождается от зажима и отходит от матрицы.</li><li>На отстающей цепи для каждого нового фрагмента погрузчик надевает новый зажим; на ведущей полимераза и зажим связаны долго.</li></ol><p>Зажим удерживает полимеразу, пока она синтезирует фрагмент, и отпускает её, когда фрагмент закончен. Это нужно отстающей цепи, где синтез много раз начинается заново.</p><p>Без зажима или без погрузчика полимераза остаётся непроцессивной: продукты получаются короткими (раздел 4).</p><div class="static-quiz"><h3>Зачем отстающей цепи погрузчик зажима при каждом фрагменте?</h3><ol><li><b>А.</b> Погрузчик синтезирует затравку для каждого фрагмента <i>(неверный вариант)</i><br><span class="expl">Затравку синтезирует праймаза; погрузчик надевает на ДНК зажим.</span></li><li><b>Б.</b> Погрузчик сшивает фрагменты <i>(неверный вариант)</i><br><span class="expl">Фрагменты сшивает ДНК-лигаза.</span></li><li><b>В.</b> Закончив фрагмент, полимераза освобождается, и для следующего фрагмента нужен новый зажим <i>(верный вариант)</i><br><span class="expl">Зажим отпускает полимеразу у двуцепочечного участка; новый фрагмент начинается с новой загрузки зажима.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>По учебнику; схема качественная.</p></details></article><article class="card print-unit" id="ns-okazaki-maturation"><div class="eyebrow">Ведущая и отстающая цепи · шаг 19 из 30</div><h2>Созревание фрагментов Оказаки: удалить РНК, достроить, сшить</h2><p class="lead">Чтобы отстающая цепь стала непрерывной ДНК, РНК-затравки нужно удалить, место затравки заполнить ДНК, а фрагменты сшить. Три этапа созревания — сценарий практикума вопроса 3.</p><div class="note"><strong>Что показывает схема.</strong> Лигаза сшила разрывы — отстающая цепь непрерывна.</div><ol class="mech"><li>В простейшей схеме <a href="#ns-g-S7-T23">нуклеазы</a> удаляют РНК-затравку с 5′-конца фрагмента, и на её месте остаётся брешь.</li><li>ДНК-полимераза заполняет брешь, наращивая 3′-конец соседнего фрагмента.</li><li>Остаётся <a href="#ns-g-S7-T26">разрыв</a> — не хватает одной фосфодиэфирной связи; его сшивает <a href="#ns-g-S7-T24">ДНК-лигаза</a>, у эукариот с затратой АТФ.</li><li>У эукариот удаление и достройка совмещены: полимераза δ, достраивая фрагмент, отгибает затравку предыдущего фрагмента в лоскут, его срезает флэп-эндонуклеаза FEN1 (флэп-эндонуклеаза 1), и сразу остаётся разрыв; у бактерий затравку удаляют нуклеазы, узнающие РНК в гибриде РНК–ДНК.</li></ol><p>Различайте брешь и разрыв: в бреши не хватает нуклеотидов, её заполняет ДНК-полимераза; в разрыве все нуклеотиды на месте, но между соседними не хватает одной связи — её образует лигаза.</p><p>Пара «полимераза + лигаза» завершает не только созревание фрагментов Оказаки, но и все виды эксцизионной репарации (семинар 8).</p><div class="static-quiz"><h3>Затравки удалены, бреши заполнены. Что ещё нужно, чтобы отстающая цепь стала непрерывной?</h3><ol><li><b>А.</b> Сшить разрывы ДНК-лигазой <i>(верный вариант)</i><br><span class="expl">Все нуклеотиды на месте, но между фрагментами не хватает одной связи; её образует лигаза.</span></li><li><b>Б.</b> Заполнить бреши ДНК-полимеразой <i>(неверный вариант)</i><br><span class="expl">Бреши уже заполнены; осталась одна связь между фрагментами.</span></li><li><b>В.</b> Синтезировать новые затравки <i>(неверный вариант)</i><br><span class="expl">Затравки нужны для начала фрагментов; созревание идёт уже после синтеза.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li><li><a href="https://doi.org/10.1038/nature10895">Smith D. J., Whitehouse I. Intrinsic coupling of lagging-strand synthesis to chromatin assembly. Nature. 2012;483:434–438</a></li></ul><p>Механизм удаления затравок у эукариот — по введению работы Smith, Whitehouse (2012), со ссылкой авторов; у бактерий — по учебнику. Три этапа на схеме — дидактическое упрощение: у эукариот удаление затравки, синтез ДНК и обработка вытесненного участка сопряжены, и длительно существующей бреши у каждого фрагмента может не быть. Обязательный итог — РНК-затравок нет, цепь ДНК непрерывна. Схема качественная.</p></details></article><article class="card print-unit" id="ns-synthesis-vs-ready"><div class="eyebrow">Ведущая и отстающая цепи · шаг 20 из 30</div><h2>Вилка прошла участок — готова ли новая цепь?</h2><p class="lead">Уже известно: отстающая цепь собирается из фрагментов Оказаки, которые созревают — удаление затравок, заполнение брешей, сшивание (БИО-7·19). Новое: прохождение вилки, покрытие матрицы продуктами синтеза (ДНК и РНК-затравками) и зрелая непрерывная цепь ДНК — разные состояния.</p><div class="note"><strong>Что показывает схема.</strong> Вилка прошла: на матрице фрагменты ДНК с РНК-затравками.</div><ol class="mech"><li>Когда вилка прошла участок, на матрице уже сформированы фрагменты новой цепи, но их 5′-концы ещё представлены РНК-затравками: матрица покрыта продуктами синтеза — ДНК и РНК, а не одной ДНК.</li><li>В модели после удаления затравок на их месте остаются <a href="#ns-g-S7-T39">бреши</a> — промежутки без нуклеотидов.</li><li>После заполнения брешей соседние участки ДНК стоят вплотную, но между ними остаются разрывы — нет одной связи.</li><li>Только после сшивания разрывов лигазой новая цепь становится непрерывной ДНК.</li></ol><p>В модели операции идут одна за другой: задержка одной не отменяет сделанного раньше, а следующие за ней не выполняются. В основе порядка — свойства ферментов: лигаза соединяет соседние нуклеотиды, между которыми нет промежутка, — незаполненную брешь она не сшивает. В клетке удаление затравки, синтез ДНК и обработка вытесненного участка могут идти сопряжённо (БИО-7·19); раздельные стадии модели нужны, чтобы различать РНК, брешь и разрыв.</p><p>Если изменить условие и задержать удаление затравок, вилка участок пройдёт и матрица будет занята фрагментами, но часть новой цепи останется РНК, и цепь не готова. Поэтому различают три состояния: вилка прошла участок; матрица покрыта продуктами синтеза — ДНК и РНК; новая цепь — зрелая непрерывная ДНК.</p><p>Одиночный разрыв одной цепи не следует называть двуцепочечным разрывом ДНК: вторая цепь в этом месте не разорвана.</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Вилка прошла участок, затравки удалены, бреши заполнены ДНК. Готова ли новая цепь?</h3><ol><li><b>А.</b> Да: вилка прошла, и бреши заполнены ДНК <i>(неверный вариант)</i><br><span class="expl">Это необходимо, но недостаточно: между соседними участками ДНК ещё нет связей — цепь не непрерывна.</span></li><li><b>Б.</b> Нет: сначала нужно ещё раз удалить затравки <i>(неверный вариант)</i><br><span class="expl">Затравки уже удалены по условию; осталось сшивание.</span></li><li><b>В.</b> Нет: остались разрывы, их сшивает лигаза <i>(верный вариант)</i><br><span class="expl">Последняя операция — сшивание; до неё цепь не непрерывна.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Учебная модель. Удаление затравки, синтез ДНК и обработка вытесненного участка в клетке могут происходить сопряжённо. На схеме эти операции разведены, чтобы различать РНК, брешь и разрыв; обязательный конечный результат — отсутствие РНК-затравок и непрерывность ДНК. Число фрагментов и длины условные.</p></details></article><article class="card print-unit" id="ns-many-replicons"><div class="eyebrow">Ведущая и отстающая цепи · шаг 21 из 30</div><h2>Почему готовность хромосомы определяется всеми её участками?</h2><p class="lead">Уже известно: хромосому человека копируют многие точки начала одновременно (БИО-7·11). Новое: дочерняя молекула готова, только когда готовы все её участки и сшиты стыки между ними.</p><div class="note"><strong>Что показывает схема.</strong> Оба участка готовы, стык сшит.</div><ol class="mech"><li>Каждый участок завершается своей последовательностью операций.</li><li>Встреча вилок соседних участков оставляет стык; его тоже сшивает лигаза.</li><li>Если хотя бы один участок не завершён, вся молекула не готова — и это определяет общий результат.</li><li>Узкое место — та операция, без которой не может закончиться последний незавершённый участок.</li></ol><p>Готовность — свойство системы, а не отдельной операции. Успешно выполненная стадия на одном участке ещё не означает завершения всей цепочки взаимозависимых операций.</p><p>Если изменить условие так, что на участке A всё готово, а на участке Б задержано продвижение вилки, общий статус — «не готово», хотя участок A можно считать полностью удвоенным.</p><p>Перед делением клетке нужно скопировать все участки всех 46 хромосом: в норме незавершённое копирование задерживает вход в митоз (семинар 6).</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>На участке A новая цепь непрерывна, на участке Б остались разрывы. Что верно для отрезка в целом?</h3><ol><li><b>А.</b> Отрезок не готов: на участке Б и на стыке нужно сшивание <i>(верный вариант)</i><br><span class="expl">Общий результат определяет незавершённый участок.</span></li><li><b>Б.</b> Отрезок готов наполовину — этого достаточно для деления <i>(неверный вариант)</i><br><span class="expl">Для деления нужны полностью скопированные и непрерывные молекулы.</span></li><li><b>В.</b> Отрезок готов: разрывы не мешают считать ДНК удвоенной <i>(неверный вариант)</i><br><span class="expl">Цепь с разрывами ещё не непрерывна; удвоение завершается сшиванием.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Учебная модель: два соседних участка одной хромосомы; на каждом можно задержать одну операцию. Операции созревания разведены условно, как в БИО-7·20.</p></details></article><article class="card print-unit" id="ns-find-unfinished"><div class="eyebrow">Ведущая и отстающая цепи · шаг 22 из 30</div><h2>Как по промежуточному продукту найти незавершённую операцию?</h2><p class="lead">Уже известно: по продукту можно определить, какого белка не хватает вилке (БИО-7·25). Новое: наблюдение «цепь не непрерывна» совместимо с несколькими причинами; различают их по виду промежуточного продукта.</p><div class="note"><strong>Что показывает схема.</strong> Оранжевая РНК: не удалены затравки.</div><ol class="mech"><li>Остались участки РНК — не выполнено удаление затравок.</li><li>Есть промежутки без нуклеотидов — не заполнены бреши.</li><li>Соседние участки ДНК стоят вплотную, но не соединены — не выполнено сшивание.</li><li>Вилка прошла не весь участок — часть матрицы ещё не скопирована.</li></ol><p>Одно наблюдение («вилок нет, цепь не непрерывна») не позволяет назвать единственную причину: нужна вторая, различающая характеристика продукта.</p><p>Найдя узкое место, полезно проверить, хватит ли одной операции. Если на участке бреши, после их заполнения останутся разрывы, и понадобится ещё сшивание.</p><p>Разрыв, оставшийся после незавершённого созревания, и повреждение ДНК — разные вещи; как клетка обнаруживает и исправляет повреждения, — семинар 8.</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>На участке нет РНК, но между фрагментами пустые промежутки. Что нужно сделать, чтобы цепь стала непрерывной?</h3><ol><li><b>А.</b> Только сшить: лигаза соединит фрагменты через промежутки <i>(неверный вариант)</i><br><span class="expl">Лигаза соединяет соседние нуклеотиды; брешь сначала нужно заполнить.</span></li><li><b>Б.</b> Заполнить бреши, а затем сшить оставшиеся разрывы <i>(верный вариант)</i><br><span class="expl">Брешь заполняет ДНК-полимераза; лигаза сшивает разрыв, который остаётся после этого.</span></li><li><b>В.</b> Снова удалить затравки <i>(неверный вариант)</i><br><span class="expl">РНК уже нет — затравки удалены.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>Учебная модель: операции созревания разведены условно, как в БИО-7·20; промежуточные продукты показаны схематично, без методов их обнаружения.</p></details></article><article class="card print-unit" id="ns-replisome"><div class="eyebrow">От репликационной вилки к клетке · шаг 23 из 30</div><h2>Реплисома: белки вилки и операция каждого</h2><p class="lead">У вилки работает не одна ДНК-полимераза, а комплекс белков — <a href="#ns-g-S7-T11">реплисома</a>; у каждого белка своя операция. Это четвёртый пункт минимального результата: зная операцию белка, можно предсказать, какой промежуточный продукт останется без него.</p><div class="note"><strong>Что показывает схема.</strong> Все белки вилки на месте: ведущая цепь непрерывна, фрагменты отстающей созревают и сшиваются.</div><ol class="mech"><li><a href="#ns-g-S7-T18">Хеликаза</a> расплетает двойную спираль с затратой АТФ; <a href="#ns-g-S7-T25">топоизомераза</a> впереди вилки снимает напряжение от расплетания.</li><li><a href="#ns-g-S7-T19">Белки SSB</a> покрывают одноцепочечную матрицу и выпрямляют её.</li><li><a href="#ns-g-S7-T20">Праймаза</a> синтезирует РНК-затравки; <a href="#ns-g-S7-T32">полимераза ε</a> удлиняет ведущую цепь, <a href="#ns-g-S7-T31">полимераза δ</a> — фрагменты отстающей.</li><li><a href="#ns-g-S7-T21">Зажим</a> удерживает полимеразу на матрице, надевает его <a href="#ns-g-S7-T22">погрузчик</a>; <a href="#ns-g-S7-T23">нуклеазы</a> удаляют затравки, <a href="#ns-g-S7-T24">ДНК-лигаза</a> сшивает фрагменты.</li></ol><p>Все эти белки синтезируются в цитоплазме и, как другие ядерные белки, попадают в ядро через ядерные поры по сигналу ядерной локализации (<a href="https://fresll.github.io/bio/seminar-3-route.html#nls-importin">вспомнить БИО-3·31</a>).</p><p>Операции белков удобно запомнить по продукту, который остаётся без каждого из них: без нуклеаз — фрагменты с РНК-затравками, без лигазы — фрагменты с разрывами, без погрузчика — короткие отрезки с брешами.</p><div class="static-quiz"><h3>Какой белок вилки, охватывая ДНК кольцом, удерживает ДНК-полимеразу на матрице?</h3><ol><li><b>А.</b> Хеликаза <i>(неверный вариант)</i><br><span class="expl">Хеликаза расплетает ДНК впереди полимеразы и связана с полимеразой в реплисоме, но кольцо, которое охватывает ДНК и скользит вместе с полимеразой, — зажим.</span></li><li><b>Б.</b> Скользящий зажим (PCNA) <i>(верный вариант)</i><br><span class="expl">Кольцо зажима охватывает ДНК и скользит вместе с полимеразой.</span></li><li><b>В.</b> Белки SSB <i>(неверный вариант)</i><br><span class="expl">SSB связываются с одноцепочечной матрицей, а не с полимеразой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapters 4 «DNA, Chromosomes, and Genomes», 5 «DNA Replication, Repair, and Recombination», 17 «The Cell Cycle», 22 «Stem Cells in Tissue Homeostasis and Regeneration»</li></ul><p>По учебнику; схема качественная.</p></details></article><article class="card print-unit"
