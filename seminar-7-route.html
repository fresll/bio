    s += DN.helicase(X(FX + 4), (yD1 + yD2) / 2, 16);
    s += `<path d="M${X(FX + 46)},${(yD1 + yD2) / 2 - 34} l${R ? 30 : -30},0" stroke="${C.hel}" stroke-width="3"/><path d="M${X(FX + 82)},${(yD1 + yD2) / 2 - 34} l${R ? -9 : 9},-6 l0,12 z" fill="${C.hel}"/><text class="lbl" x="${X(FX + 64)}" y="${(yD1 + yD2) / 2 - 50}" font-size="12">${t('s3_lbl_move')}</text>`;
    /* ведущая цепь: непрерывная, растёт к вилке; лежит на матрице цепи 2 у правой вилки (внизу), на цепи 1 у левой (вверху) */
    const leadY = R ? yNT : yNB, lagY = R ? yNB : yNT;
    /* необязательные поля кадра (только практикум, анимация; без них рисунок как в v1.1): leadU — доля длины ведущей цепи;
       newU — самый новый фрагмент отстающей цепи: < 0 — ещё нет, 0 — только затравка, 0…1 — достраивается */
    const leadEnd = o.leadU == null ? FX - 44 : 20 + Math.max(.04, o.leadU) * (FX - 64);
    s += DN.G('leading', DN.line(X(20), leadY, X(leadEnd), leadY, C.neu, 6) + DN.head(X(leadEnd + 4), leadY, R ? 1 : -1, C.neu));
    s += DN.polymerase(X(leadEnd - 14), leadY + (leadY === yNT ? 14 : -14), 40, 24, 'polepsilon');
    s += `<text class="lbl" x="${X(190)}" y="${leadY === yNT ? 172 : 228}" font-size="12.5" font-weight="600">${t('s3_lbl_lead')}</text>`;
    /* отстающая цепь: фрагменты, каждый растёт от вилки назад; самый новый — у вилки */
    const last = FX - 50;   /* 5′-конец самого нового фрагмента (ближе к вилке) */
    let fr = '';
    for (let i = 0; i < o.nFrag; i++) {
      const a = last - i * FL, b = a - FL;                /* фрагмент от a (5′, у вилки) к b (3′); законченный фрагмент доходит до 5′-конца более старого (аудит Codex A21, v1.4) */
      if (a < 30) break;
      const bb = Math.max(24, b), isNew = i === 0;
      const prL = 18;
      if (o.mat === 'syn' && isNew && o.newU != null && o.newU < 1) {
        if (o.newU >= 0) { const e3 = (a - prL) - ((a - prL) - (bb + 30)) * o.newU; fr += DN.primer(X(a), X(a - prL), lagY) + (o.newU > .02 ? DN.G('okazaki', DN.line(X(a - prL), lagY, X(e3), lagY, C.neu, 6) + DN.head(X(e3 - 4), lagY, R ? -1 : 1, C.neu)) : ''); }
      } else if (o.mat === 'syn') {
        fr += DN.primer(X(a), X(a - prL), lagY) + DN.G('okazaki', DN.line(X(a - prL), lagY, X(bb + (isNew ? 30 : 0)), lagY, C.neu, 6) + (isNew ? DN.head(X(bb + 26), lagY, R ? -1 : 1, C.neu) : ''));
      } else if (o.mat === 'rem') {
        fr += DN.G('okazaki', DN.line(X(a - prL), lagY, X(bb), lagY, C.neu, 6));
        if (i < o.nFrag - 1 || bb > 30) { /* брешь на месте затравки следующего (более старого) фрагмента не показываем у края */ }
      } else {
        if (o.mat !== 'lig') fr += DN.G('okazaki', DN.line(X(a), lagY, X(bb), lagY, C.neu, 6));   /* после сшивания — одна непрерывная линия ниже (И-16, A21) */
      }
      if (o.mat === 'fill' && i > 0) fr += DN.nick(X(a), lagY);   /* разрыв — на стыке фрагментов, без промежутка */
      if (o.mat === 'rem' && i > 0) fr += DN.nuclease(X(a + 4), lagY + (lagY === yNT ? 18 : -18));
    }
    if (o.mat === 'fill') fr += DN.ligase(X(last - FL + 8), lagY + (lagY === yNT ? 20 : -20));
    if (o.mat === 'lig') fr = DN.G('lagging', DN.line(X(last), lagY, X(Math.max(24, last - o.nFrag * FL)), lagY, C.neu, 6)) + fr;
    s += fr;
    /* полимераза δ с зажимом на самом новом фрагменте и праймаза у вилки (только в синтезе) */
    if (o.mat === 'syn') {
      const inw = lagY === yNT ? 1 : -1;   /* сторона «внутрь вилки» */
      /* полимераза δ с зажимом — у растущего 3′-конца самого нового фрагмента; до начала его синтеза — не на матрице */
      const pd = o.newU == null || o.newU >= 1 ? last - FL + 36 : o.newU > 0 ? (last - 18) - ((last - 18) - (last - FL + 46)) * o.newU - 10 : null;
      if (pd != null) s += DN.polymerase(X(pd), lagY + inw * 14, 40, 24, 'poldelta') + DN.clamp(X(pd + 28), lagY, 1, lagY === yNT ? yT : yB);
      s += DN.primase(X(FX - 36), lagY + inw * 20);
    }
    s += `<text class="lbl" x="${X(190)}" y="${lagY === yNT ? 172 : 228}" font-size="12.5" font-weight="600">${t('s3_lbl_lag')}</text>`;
    /* подпись состояния отстающей цепи */
    s += `<text class="lbl" x="300" y="372" font-size="12.5">${t('s3_lbl_mat_' + o.mat)}</text>`;
    s += `<text class="area" x="14" y="406">${t('s3_lbl_status')}</text>`;
    return s;
  }
  return { model, draw, view: (a, t) => draw(model(...a), t) };
})();

/* Модели и рисунки вкладки 4 (общие для практикума и «Объяснений»). */
/* ---- 4b: реплисома у правой вилки (как во вкладке 3: цепь 1 вверху — матрица ведущей цепи, цепь 2 внизу — матрица отстающей).
   Переключатель — какой компонент убран: none / ssb / rfc (погрузчик зажима; без него зажим не надет) / nuc (нуклеазы удаления затравок).
   Хеликаза, праймаза, лигаза и топоизомераза на схеме есть всегда.
   Исходы — качественная учебная модель по MBoC7 (с. 258–268); длины условные. ---- */
DN.s4b = (function(){
  const ssEnd = FX => FX - 38;
  function model(off){
    const o = { off };
    o.FX = 440;
    o.lead = off === 'rfc' ? 'slow' : 'ok';
    o.lag = { none: 'mature', ssb: 'blocked', rfc: 'short', nuc: 'primers' }[off];
    o.ss = off === 'ssb' ? 'hairpin' : 'short';
    return o;
  }
  function draw(o, t){
    const C = DN.C, FX = o.FX;
    const yT = 100, yB = 300, yNT = 128, yNB = 272, yD1 = 188, yD2 = 212, yM = (yD1 + yD2) / 2;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('s4_lbl_head')}</text>`;
    /* родительская двойная спираль и матрицы */
    s += DN.G('template', DN.line(FX + 24, yD1, 590, yD1, C.old, 6) + DN.line(FX + 24, yD2, 590, yD2, C.old, 6)) + DN.rungs(FX + 30, 584, yD1 + 4, yD2 - 4, 14);
    s += DN.G('template', `<path d="M${FX + 24},${yD1} Q${FX},${yD1} ${FX - 30},${yT} L20,${yT}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/><path d="M${FX + 24},${yD2} Q${FX},${yD2} ${FX - 30},${yB} L20,${yB}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>`);
    s += DN.end(10, yT - 12, '3′', 'start') + `<text class="lbl-l" x="30" y="${yT - 12}" font-size="12">${t('s3_lbl_s1')}</text>` + DN.end(10, yB + 18, '5′', 'start') + `<text class="lbl-l" x="30" y="${yB + 18}" font-size="12">${t('s3_lbl_s2')}</text>`;
    s += DN.end(592, yD1 - 12, '5′', 'end') + DN.end(592, yD2 + 18, '3′', 'end');
    /* топоизомераза впереди вилки, хеликаза в точке расхождения */
    s += DN.topo(FX + 70, yM) + DN.helicase(FX + 4, yM, 16);
    s += `<path d="M${FX + 84},${yM - 40} l30,0" stroke="${C.hel}" stroke-width="3"/><path d="M${FX + 120},${yM - 40} l-9,-6 l0,12 z" fill="${C.hel}"/><text class="lbl" x="${FX + 100}" y="${yM - 54}" font-size="12">${t('s3_lbl_move')}</text>`;
    /* необязательное поле кадра upTo (только практикум, анимация по этапам паспорта 4.2; без него рисунок как в v1.1):
       1 — расплетание; 2 — + SSB (или шпильки без SSB); 3 — + синтез обеих цепей до созревания; 4 — всё */
    const U = o.upTo == null ? 9 : o.upTo;
    const yL = yNB, up = -1, pr = (x5) => DN.primer(x5, x5 - 18, yL), dna = (x5, x3, g = 'okazaki') => DN.G(g, DN.line(x5, yL, x3, yL, C.neu, 6));
    const tip = x => DN.head(x - 4, yL, -1, C.neu);
    if (U <= 2) {
      if (U === 2 && o.off === 'ssb') s += DN.G('hairpin', DN.hairpin(300, yB, 1) + DN.hairpin(352, yB, 1)) + `<text class="lbl" x="${340}" y="${yB + 22}" font-size="11.5" fill="${C.red}">${t('s4_lbl_hp')}</text>`;
      else if (U === 2) s += DN.ssb(40, ssEnd(FX), yB - 12, 18);
    } else {
    /* ведущая цепь */
    const lag = U === 3 && (o.lag === 'mature' || o.lag === 'primers') ? 'primers3' : o.lag;
    const leadEnd = o.lead === 'ok' ? FX - 44 : FX - 170;
    s += DN.G('leading', DN.line(20, yNT, leadEnd, yNT, C.neu, 6) + DN.head(leadEnd + 4, yNT, 1, C.neu));
    s += DN.polymerase(leadEnd - 14, yNT + 14, 40, 24, 'polepsilon');
    if (o.lead === 'ok') s += DN.clamp(leadEnd + 14, yNT, 1, yT);
    /* отстающая цепь (растёт справа налево, от вилки): слева направо — старые фрагменты, справа — самый новый у вилки.
       Полный набор: сшитый участок | разрыв (лигаза) | фрагмент X | лоскут с затравкой X срезает нуклеаза | фрагмент Y с затравкой |
       одноцепочечная матрица, которую копирует полимераза δ (фрагмент Z) | затравка Z | одноцепочечная матрица под SSB у вилки. */
    if (lag === 'mature') {
      s += dna(100, 20, 'lagging') + DN.ligase(104, yL - 22);
      s += dna(190, 108) + DN.G('primer', `<path d="M190,${yL} q8,-4 14,-16" fill="none" stroke="${C.rna}" stroke-width="5" stroke-linecap="round"/>`) + DN.nuclease(206, yL + up * 30);
      s += dna(262, 194) + pr(280);
      s += DN.ssb(296, 312, yB - 12, 16);
      s += dna(360, 322) + tip(322) + pr(378) + DN.polymerase(340, yL + up * 16, 40, 24, 'poldelta') + DN.clamp(318, yL, 1, yB);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
    } else if (lag === 'blocked') {
      /* аудит Codex A06 (v1.4): SSB нет у работающей вилки — фрагменты, синтезированные раньше, созрели и сшиты (как в CASE_SPEC:
         полной длины, без РНК, сшиты); у вилки на матрице шпильки, новый фрагмент не начат */
      s += dna(262, 20, 'lagging');
      s += DN.G('hairpin', DN.hairpin(300, yB, 1) + DN.hairpin(352, yB, 1));
      s += DN.polymerase(300, yL + up * 18, 40, 24, 'poldelta');
    } else if (lag === 'short') {
      for (const x5 of [100, 190, 280, 378]) s += pr(x5) + dna(x5 - 18, x5 - 52);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
      s += DN.polymerase(300, yL + up * 30, 40, 24, 'poldelta');
      s += `<text class="lbl" x="150" y="${yL - 18}" font-size="11.5" fill="${C.red}">${t('s4_lbl_gap')}</text>`;
    } else if (lag === 'primers') {
      for (const [x5, x3] of [[100, 20], [190, 104], [280, 194], [378, 284]]) s += pr(x5) + dna(x5 - 18, x3);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
      s += DN.ligase(102, yL - 22);   /* лигаза есть, но сшить фрагменты не может (Р-33) */
    } else if (lag === 'primers3') {   /* кадр этапа 3: фрагменты синтезированы, затравки ещё не удалены; полимераза δ с зажимом — на самом новом (И-02) */
      for (const [x5, x3] of [[100, 20], [190, 104], [280, 194]]) s += pr(x5) + dna(x5 - 18, x3);
      s += dna(360, 322) + tip(322) + pr(378) + DN.polymerase(340, yL + up * 16, 40, 24, 'poldelta') + DN.clamp(318, yL, 1, yB);
      s += DN.ssb(384, ssEnd(FX), yB - 12, 18);
    }
    s += DN.primase(FX - 44, yL + up * 24);
    if (o.off === 'rfc') s += DN.loader(360, yL + up * 52) + DN.cross(360, yL + up * 52, 12);
    else s += DN.loader(360, yL + up * 52);
    if (o.off === 'nuc' && !o.masked) s += DN.nuclease(240, yL + up * 30) + DN.cross(240, yL + up * 26, 10);
    if (o.off === 'ssb') s += `<text class="lbl" x="${340}" y="${yB + 22}" font-size="11.5" fill="${C.red}">${t('s4_lbl_hp')}</text>`;
    }
    if (U === 9) s += `<text class="lbl" x="300" y="368" font-size="12.5">${t(o.masked ? 's4_lbl_off_q' : 's4_lbl_off_' + o.off)}</text>`;   /* подпись исхода — только в конечном кадре (И-04) */
    s += `<text class="area" x="14" y="406">${t('s4_lbl_status')}</text>`;
    return s;
  }
  return { model, draw, view: (a, t) => draw(model(...a), t) };
})();

/* =====================================================================
   s0_figs_dna_struct.js — структурные вставки «Объяснений» (v1.4, аудит Codex A24).
   DN.sst  — строение: нуклеотид (сахар с нумерацией атомов углерода, фосфат, основание), участок цепи (фосфодиэфирная связь,
             5′- и 3′-концы), двойная спираль (два антипараллельных остова, пары оснований). Схемы условные: это не химические
             формулы — названия веществ подписаны, формул рядом нет.
   DN.srfc — работа погрузчика зажима: раскрывает кольцо → надевает его на дуплекс затравка–матрица у 3′-конца затравки →
             кольцо замкнуто, погрузчик уходит, полимераза δ связывается с зажимом.
   Русского текста здесь нет: подписи — через t().
   ===================================================================== */
DN.sst = (function(){
  const f = DN.f;
  /* сахар-пентагон: вершины — O (вверху), C1′ (справа), C2′, C3′ (внизу), C4′ (слева); C5′ — над C4′ снаружи кольца */
  const ANG = { O: -90, c1: -18, c2: 54, c3: 126, c4: 198 };
  const P = (cx, cy, r, a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  function sugar(cx, cy, t, num){
    const C = DN.C, r = 26, v = ['O', 'c1', 'c2', 'c3', 'c4'].map(k => P(cx, cy, r, ANG[k]));
    let s = `<path d="M${v.map(p => f(p[0]) + ',' + f(p[1])).join(' L')} Z" fill="#FFF4E0" stroke="#B7791F" stroke-width="2.2"/>`;
    s += `<text class="lbl" x="${f(v[0][0])}" y="${f(v[0][1] - 9)}" font-size="11" fill="#8a5a12">O</text>`;
    if (num){ [['c1', '1′', 12, -2], ['c2', '2′', 10, 10], ['c3', '3′', 8, 14], ['c4', '4′', -13, -2]].forEach(([k, l, dx, dy]) => {
      const p = P(cx, cy, r, ANG[k]); s += `<text class="lbl" x="${f(p[0] + dx)}" y="${f(p[1] + dy)}" font-size="11" fill="#8a5a12">${l}</text>`; }); }
    return { s, v };
  }
  /* нуклеотид: фосфат (кружок P) — C5′ — сахар — основание (прямоугольник у C1′); 3′-OH у C3′ */
  function nucleotide(cx, cy, t, o = {}){
    const C = DN.C, { s: sg, v } = sugar(cx, cy, t, o.num), c4 = v[4], c5 = [c4[0] - 8, c4[1] - 30], c1 = v[1], c3 = v[3];
    let s = '';
    s += DN.line(c4[0], c4[1], c5[0], c5[1], '#B7791F', 2.2);
    if (o.num) s += `<text class="lbl" x="${f(c5[0] + 12)}" y="${f(c5[1] + 2)}" font-size="11" fill="#8a5a12">5′</text>`;
    if (o.phos !== false){ const px = c5[0] - 30, py = c5[1] - 14;
      s += DN.line(c5[0], c5[1], px, py, C.old, 2.2) + `<circle cx="${f(px)}" cy="${f(py)}" r="12" fill="#E7ECF5" stroke="${C.old}" stroke-width="2"/><text class="lbl" x="${f(px)}" y="${f(py)}" font-size="12" font-weight="700" fill="${C.old}">P</text>`; }
    s += sg;
    s += DN.line(c1[0], c1[1], c1[0] + 30, c1[1], '#7A8899', 2.2) + `<rect x="${f(c1[0] + 30)}" y="${f(c1[1] - 14)}" width="40" height="28" rx="5" fill="#EEF3FA" stroke="${C.neuD}" stroke-width="2"/><text class="lbl" x="${f(c1[0] + 50)}" y="${f(c1[1])}" font-size="13" font-weight="700" fill="${C.neuD}">${o.base || 'A'}</text>`;
    if (o.oh) s += DN.line(c3[0], c3[1], c3[0] - 14, c3[1] + 18, '#B7791F', 2.2) + `<text class="lbl-l" x="${f(c3[0] - 42)}" y="${f(c3[1] + 28)}" font-size="12" font-weight="700" fill="#8a5a12">3′-OH</text>`;
    return { s, c3, c5 };
  }
  function draw(mode, t){
    const C = DN.C;
    let s = `<rect x="0" y="0" width="600" height="420" fill="var(--surface)"/>`;
    s += `<text class="area" x="14" y="24">${t('st_head_' + mode)}</text>`;
    if (mode === 'nt'){
      const n = nucleotide(250, 200, t, { num: true, oh: true, base: 'A' });
      s += n.s;
      s += `<text class="lbl-l" x="318" y="150" font-size="12.5">${t('st_base')}</text>`;
      s += `<text class="lbl-l" x="285" y="252" font-size="12.5">${t('st_sugar')}</text>`;
      s += `<text class="lbl-l" x="70" y="118" font-size="12.5">${t('st_phos')}</text>`;
      s += `<text class="lbl-l" x="40" y="330" font-size="12">${t('st_nt_note')}</text>`;
    } else if (mode === 'chain'){
      /* два нуклеотида: фосфат соединяет 3′-углерод сахара верхнего с 5′-углеродом сахара нижнего */
      const a = nucleotide(250, 120, t, { num: true, base: 'G' }), b = nucleotide(258, 290, t, { num: true, oh: true, base: 'C', phos: false });
      s += a.s + b.s;
      const px = 196, py = 205;
      s += DN.line(a.c3[0], a.c3[1], px, py, C.old, 2.4) + DN.line(px, py, b.c5[0], b.c5[1], C.old, 2.4) +
        `<circle cx="${px}" cy="${py}" r="12" fill="#E7ECF5" stroke="${C.old}" stroke-width="2"/><text class="lbl" x="${px}" y="${py}" font-size="12" font-weight="700" fill="${C.old}">P</text>`;
      s += `<path d="M150,${py} L180,${py}" stroke="${C.grey}" stroke-width="1.2"/><text class="lbl-l" x="20" y="${py - 9}" font-size="12">${t('st_bond1')}</text><text class="lbl-l" x="20" y="${py + 9}" font-size="12">${t('st_bond2')}</text>`;
      s += `<text class="lbl-l" x="300" y="52" font-size="12.5" font-weight="700">${t('st_end5')}</text><path d="M296,56 L232,76" stroke="${C.grey}" stroke-width="1.2"/>`;
      s += `<text class="lbl-l" x="300" y="372" font-size="12.5" font-weight="700">${t('st_end3')}</text><path d="M296,368 L262,346" stroke="${C.grey}" stroke-width="1.2"/>`;
      s += `<path d="M560,70 L560,330" stroke="${C.neuD}" stroke-width="2"/><path d="M560,336 l-6,-12 l12,0 z" fill="${C.neuD}"/><text class="lbl" x="530" y="200" font-size="12" fill="${C.neuD}">5′→3′</text>`;
    } else {
      /* двойная спираль: два остова — синусоиды со сдвигом на половину периода; между ними пары оснований */
      const x0 = 70, x1 = 530, yc = 205, A = 62, per = 230, Y = (x, ph) => yc + A * Math.sin(2 * Math.PI * (x - x0) / per + ph + Math.PI / 2);   /* концы цепей — в верхней и нижней точках: подписи 5′/3′ не совпадают */
      const path = ph => { let d = ''; for (let x = x0; x <= x1; x += 4) d += (x === x0 ? 'M' : ' L') + f(x) + ',' + f(Y(x, ph)); return d; };
      let rungs = '';
      for (let x = x0 + 10; x < x1; x += 18){ const y1 = Y(x, 0), y2 = Y(x, Math.PI); if (Math.abs(y1 - y2) < 18) continue;
        const front = Math.cos(2 * Math.PI * (x - x0) / per + Math.PI / 2) > 0;
        rungs += DN.line(x, Math.min(y1, y2) + 5, x, Math.max(y1, y2) - 5, front ? '#7A8899' : C.rung, front ? 2.6 : 2); }
      s += DN.G('pair', rungs);
      s += DN.G('strand', `<path d="${path(0)}" fill="none" stroke="${C.old}" stroke-width="6" stroke-linecap="round"/>`);
      s += DN.G('strand', `<path d="${path(Math.PI)}" fill="none" stroke="${C.neuD}" stroke-width="6" stroke-linecap="round"/>`);
      s += DN.end(x0 - 18, Y(x0, 0) + 4, '5′') + DN.end(x1 + 18, Y(x1, 0) + 4, '3′');
      s += DN.end(x0 - 18, Y(x0, Math.PI) + 4, '3′') + DN.end(x1 + 18, Y(x1, Math.PI) + 4, '5′');
      s += `<text class="lbl" x="300" y="${yc + A + 40}" font-size="12.5">${t('st_helix_bb')}</text>`;
      s += `<text class="lbl" x="300" y="${yc + A + 60}" font-size="12.5">${t('st_helix_pairs')}</text>`;
      s += `<text class="lbl" x="300" y="${yc - A - 30}" font-size="12.5">${t('st_helix_anti')}</text>`;
    }
    s += `<text class="area" x="14" y="406">${t(mode === 'helix' ? 'st_foot_helix' : 'st_foot')}</text>`;
    return s;
  }
  return { draw, view: (a, t) => draw(a[0], t) };
})();

  const ring = (x, y, ry, open) => { const C = DN.C, rx = 9;
    if (!open) return DN.G('pcna', `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${rx}" ry="${f(ry)}" fill="none" stroke="${C.pcna}" stroke-width="6"/>`);

})();
