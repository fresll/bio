вание и удаление тоже меняют количество белка.</span></li><li><b>Б.</b> Количество белка определяется и синтезом, и удалением <i>(верный вариант)</i><br><span class="expl">Поэтому одинаковый синтез может давать разное количество белка.</span></li><li><b>В.</b> Количество белка всегда пропорционально количеству мРНК <i>(неверный вариант)</i><br><span class="expl">Эффективность трансляции и удаление белка нарушают пропорциональность.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-10.html#q1">Вопрос 1 →</a> <a href="seminar-10.html#q2">Вопрос 2 →</a> <a href="seminar-10.html#q3">Вопрос 3 →</a> <a href="seminar-10.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Переход к следующему семинару.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S10-T01"><dt>Трансляция</dt><dd>Синтез полипептида на рибосоме по матрице мРНК в соответствии с генетическим кодом. У эукариот белок-кодирующие мРНК транслируются в цитоплазме (а также на рибосомах, связанных с мембраной эндоплазматического ретикулума); мРНК считывается от 5′- к 3′-концу, полипептид растёт от N- к C-концу.</dd></div><div id="ns-g-S10-T02"><dt>Генетический код</dt><dd>Соответствие между кодонами мРНК и аминокислотами (или сигналом терминации). Код триплетный, однозначный, вырожденный и почти универсальный: в митохондриях и у некоторых организмов значение отдельных кодонов иное.</dd></div><div id="ns-g-S10-T03"><dt>Кодон</dt><dd>Последовательность из трёх нуклеотидов мРНК, соответствующая одной аминокислоте или сигналу терминации. Из 64 кодонов 61 смысловой и 3 стоп-кодона.</dd></div><div id="ns-g-S10-T04"><dt>Старт-кодон</dt><dd>Кодон AUG, с которого начинается трансляция; он кодирует метионин и задаёт рамку считывания. Его узнаёт антикодон инициаторной тРНК.</dd></div><div id="ns-g-S10-T05"><dt>Стоп-кодон</dt><dd>Кодон UAA, UAG или UGA, не соответствующий ни одной аминокислоте: ему не комплементарна ни одна тРНК; его в A-сайте узнаёт белковый фактор терминации, и синтез полипептида заканчивается.</dd></div><div id="ns-g-S10-T06"><dt>Рамка считывания</dt><dd>Разбиение нуклеотидной последовательности на последовательные неперекрывающиеся кодоны. Для трансляции рамку задаёт старт-кодон; она продолжается до стоп-кодона.</dd></div><div id="ns-g-S10-T07"><dt>Вырожденность генетического кода</dt><dd>Свойство кода: большинство аминокислот кодируется несколькими кодонами (от двух до шести); только метионин и триптофан — одним. Кодоны-синонимы чаще всего различаются третьим нуклеотидом.</dd></div><div id="ns-g-S10-T08"><dt>Синонимичная замена</dt><dd>Замена нуклеотида, при которой новый кодон кодирует ту же аминокислоту. Последовательность белка не меняется, но замена может влиять на сплайсинг, стабильность мРНК и эффективность трансляции.</dd></div><div id="ns-g-S10-T09"><dt>Миссенс-замена</dt><dd>Замена нуклеотида, при которой кодон начинает кодировать другую аминокислоту.</dd></div><div id="ns-g-S10-T10"><dt>Нонсенс-замена</dt><dd>Замена нуклеотида, превращающая смысловой кодон в стоп-кодон; синтез полипептида обрывается раньше обычного (преждевременный стоп-кодон).</dd></div><div id="ns-g-S10-T11"><dt>Сдвиг рамки считывания</dt><dd>Изменение рамки после вставки или делеции числа нуклеотидов, не кратного трём, в кодирующей области: все кодоны ниже места изменения читаются иначе, и вскоре обычно встречается стоп-кодон.</dd></div><div id="ns-g-S10-T12"><dt>Делеция</dt><dd>Утрата одного или нескольких нуклеотидов последовательности. Делеция числа нуклеотидов, кратного трём, в кодирующей области рамку не сдвигает.</dd></div><div id="ns-g-S10-T13"><dt>мРНК (матрица трансляции)</dt><dd>Зрелая матричная РНК: кэп, 5′-нетранслируемая область, кодирующая область от старт-кодона до стоп-кодона, 3′-нетранслируемая область и поли(А)-хвост. Последовательность кодирующей области определяет последовательность аминокислот белка.</dd></div><div id="ns-g-S10-T14"><dt>Полипептид</dt><dd>Цепь аминокислот, соединённых пептидными связями; на рибосоме растёт от N-конца (свободная аминогруппа) к C-концу (карбоксильная группа).</dd></div><div id="ns-g-S10-T15"><dt>Пептидная связь</dt><dd>Амидная связь между карбоксильной группой одной аминокислоты и аминогруппой следующей. На рибосоме образуется переносом растущей цепи с тРНК в P-сайте на аминокислоту тРНК в A-сайте.</dd></div><div id="ns-g-S10-T16"><dt>Транспортная РНК (тРНК)</dt><dd>Короткая РНК длиной около 80 нуклеотидов (чаще всего 76) — адаптер между кодоном и аминокислотой. Вторичная структура — «клеверный лист», пространственная — L-образная; на одном конце — антикодон, на другом — 3′-конец CCA, к которому присоединяется аминокислота.</dd></div><div id="ns-g-S10-T17"><dt>Антикодон</dt><dd>Три нуклеотида тРНК, спаривающиеся с кодоном мРНК антипараллельно: первый нуклеотид кодона (5′) спаривается с третьим нуклеотидом антикодона. В третьей позиции кодона допускаются неканонические пары (качание).</dd></div><div id="ns-g-S10-T18"><dt>Качание (неоднозначное спаривание)</dt><dd>Допущение неканонических пар (например, G·U) между третьим нуклеотидом кодона и первым нуклеотидом антикодона. Позволяет одной тРНК узнавать несколько кодонов-синонимов.</dd></div><div id="ns-g-S10-T19"><dt>Аминокислота на тРНК</dt><dd>Аминокислота, присоединённая сложноэфирной связью к 3′-концевому аденозину тРНК. Рибосома не проверяет, какую аминокислоту несёт тРНК: проверяется только спаривание антикодона с кодоном.</dd></div><div id="ns-g-S10-T22"><dt>Аминоацил-тРНК-синтетаза</dt><dd>Фермент, который присоединяет определённую аминокислоту ко всем тРНК, соответствующим кодонам этой аминокислоты, узнавая и аминокислоту, и тРНК. В цитозоле клеток человека для каждой из 20 аминокислот — своя синтетаза. Многие синтетазы обладают корректирующей активностью.</dd></div><div id="ns-g-S10-T23"><dt>Аминоацилирование тРНК</dt><dd>Присоединение аминокислоты к 3′-концу тРНК аминоацил-тРНК-синтетазой; идёт в два этапа: активация аминокислоты АТФ (аминоациладенилат) и перенос аминокислоты на тРНК.</dd></div><div id="ns-g-S10-T24"><dt>Аминоацил-тРНК</dt><dd>тРНК, к 3′-концу которой присоединена аминокислота. Энергия её сложноэфирной связи используется при образовании пептидной связи.</dd></div><div id="ns-g-S10-T25"><dt>Корректирующая активность синтетазы</dt><dd>Способность аминоацил-тРНК-синтетазы гидролизовать ошибочно активированную аминокислоту или ошибочно присоединённую к тРНК аминокислоту; резко снижает частоту ошибок аминоацилирования.</dd></div><div id="ns-g-S10-T26"><dt>Рибосома</dt><dd>Комплекс рРНК и белков, синтезирующий полипептид по мРНК. Рибосома эукариот (80S) состоит из малой (40S) и большой (60S) субчастиц; в ней три участка связывания тРНК — A, P и E.</dd></div><div id="ns-g-S10-T27"><dt>Малая субчастица рибосомы (40S)</dt><dd>Субчастица, связывающая мРНК; в ней находится декодирующий центр, где проверяется спаривание антикодона с кодоном.</dd></div><div id="ns-g-S10-T28"><dt>Большая субчастица рибосомы (60S)</dt><dd>Субчастица, в которой находится пептидилтрансферазный центр, образованный рРНК, и туннель, через который выходит растущая цепь.</dd></div><div id="ns-g-S10-T32"><dt>Пептидилтрансферазный центр</dt><dd>Каталитический центр большой субчастицы рибосомы, где образуется пептидная связь; образован рРНК (рибосома — рибозим).</dd></div><div id="ns-g-S10-T33"><dt>Инициаторная тРНК</dt><dd>Особая тРНК, несущая метионин, с которой начинается трансляция; её узнают факторы инициации, и в начале синтеза она находится в P-сайте напротив старт-кодона. В A-сайт не поступает.</dd></div><div id="ns-g-S10-T35"><dt>Окружение старт-кодона</dt><dd>Нуклеотиды вокруг AUG, от которых зависит, узнает ли его сканирующая малая субчастица; у позвоночных наиболее важны пурин в положении −3 и G в положении +4.</dd></div><div id="ns-g-S10-T36"><dt>Факторы инициации трансляции</dt><dd>Белки, обеспечивающие сборку рибосомы на старт-кодоне: связывание с кэпом (комплекс eIF4F), доставку инициаторной тРНК (eIF2 с ГТФ), сканирование и присоединение большой субчастицы.</dd></div><div id="ns-g-S10-T38"><dt>Фактор элонгации eEF1A</dt><dd>Белок, который в комплексе с ГТФ доставляет аминоацил-тРНК в A-сайт; гидролиз ГТФ после правильного спаривания позволяет тРНК занять положение для образования пептидной связи.</dd></div><div id="ns-g-S10-T39"><dt>Фактор элонгации eEF2</dt><dd>Белок, который за счёт гидролиза ГТФ обеспечивает транслокацию — сдвиг рибосомы на один кодон.</dd></div><div id="ns-g-S10-T40"><dt>Транслокация</dt><dd>Перемещение рибосомы по мРНК на один кодон (три нуклеотида) к 3′-концу; тРНК переходят из A- в P-сайт и из P- в E-сайт, и A-сайт освобождается для следующего кодона.</dd></div><div id="ns-g-S10-T42"><dt>Фактор терминации eRF1</dt><dd>Белок, похожий по форме на тРНК, который узнаёт все три стоп-кодона в A-сайте и вызывает гидролиз связи полипептида с тРНК; действует вместе с eRF3.</dd></div><div id="ns-g-S10-T43"><dt>Полисома (полирибосома)</dt><dd>мРНК, которую одновременно транслируют несколько рибосом, движущихся одна за другой.</dd></div><div id="ns-g-S10-T45"><dt>Полноразмерный полипептид</dt><dd>Полипептид, синтез которого закончился на обычном стоп-кодоне.</dd></div><div id="ns-g-S10-T46"><dt>Укороченный продукт</dt><dd>Полипептид, синтез которого закончился раньше обычного — например, на преждевременном стоп-кодоне; может разрушаться или сохраняться и сохранять часть функций.</dd></div><div id="ns-g-S10-T47"><dt>Сворачивание белка</dt><dd>Образование пространственной структуры полипептида; определяется последовательностью аминокислот, начинается ещё во время трансляции и у многих белков идёт при участии шаперонов.</dd></div><div id="ns-g-S10-T48"><dt>Домен белка</dt><dd>Участок полипептида, сворачивающийся в устойчивую структуру относительно независимо от остальной цепи; часто выполняет отдельную функцию.</dd></div><div id="ns-g-S10-T50"><dt>Гидрофобный участок на поверхности</dt><dd>Участок из неполярных аминокислот, который в свёрнутом белке обычно спрятан внутри. Открытые гидрофобные участки — признак несвёрнутой или неправильно свёрнутой цепи; их связывают шапероны.</dd></div><div id="ns-g-S10-T53"><dt>Шаперон Hsp70</dt><dd>Белок теплового шока массой около 70 кДа; связывает короткие гидрофобные участки несвёрнутых цепей — в том числе выходящих из рибосомы — и с затратой АТФ помогает им свернуться, предотвращая слипание.</dd></div><div id="ns-g-S10-T54"><dt>Молекулярные шапероны</dt><dd>Белки, которые помогают другим белкам правильно свернуться и предотвращают их агрегацию, но не входят в состав готового белка и не задают его структуру. Шаперонины (в цитозоле — TRiC/CCT, в митохондриях — Hsp60) образуют полость, в которой сворачиваются отдельные белки.</dd></div><div id="ns-g-S10-T55"><dt>Посттрансляционные модификации</dt><dd>Изменения белка после синтеза (или во время него): отщепление N-концевого метионина, присоединение фосфатных групп, олигосахаридов, липидов, протеолитическое расщепление и другие.</dd></div><div id="ns-g-S10-T56"><dt>Контроль качества белков</dt><dd>Совокупность процессов, которые узнают неправильно свёрнутые или неполные белки и либо помогают им свернуться (шапероны), либо направляют их на разрушение.</dd></div><div id="ns-g-S10-T57"><dt>Убиквитин и полиубиквитиновая цепь</dt><dd>Небольшой белок, который ферменты E1, E2 и E3 ковалентно присоединяют к белку-мишени. Цепь из нескольких молекул убиквитина — сигнал для разрушения белка протеасомой.</dd></div><div id="ns-g-S10-T58"><dt>Убиквитинлигаза (E3)</dt><dd>Фермент, который узнаёт белок-мишень и вместе с E2 переносит на него убиквитин; от E3 зависит, какой белок будет помечен.</dd></div><div id="ns-g-S10-T59"><dt>Протеасома</dt><dd>Крупный белковый комплекс (26S), который разворачивает белки, помеченные полиубиквитиновой цепью, и расщепляет их на короткие пептиды внутри полого цилиндра.</dd></div><div id="ns-g-S10-T60"><dt>Агрегат белков</dt><dd>Скопление слипшихся несвёрнутых или неправильно свёрнутых белков; может нарушать работу клетки.</dd></div><div id="ns-g-S10-T62"><dt>Протеостаз</dt><dd>Поддержание набора и количества правильно свёрнутых белков клетки за счёт согласованной работы синтеза, сворачивания, транспорта и разрушения белков. Подробно — в курсе «Молекулярная биология», семинар 11.</dd></div><div id="ns-g-S10-T63"><dt>Мутация</dt><dd>Наследуемое изменение последовательности ДНК. Отличается от ошибки трансляции: ошибка трансляции затрагивает отдельные молекулы белка и не меняет ни ДНК, ни мРНК.</dd></div><div id="ns-g-S10-T64"><dt>Редактирование РНК</dt><dd>Изменение последовательности РНК после транскрипции (например, замена A на I или C на U); может менять значение кодона без изменения ДНК.</dd></div><div id="ns-g-S10-T65"><dt>Ошибка трансляции</dt><dd>Включение в полипептид аминокислоты, не соответствующей кодону: из-за ошибки аминоацилирования тРНК или ошибки декодирования на рибосоме.</dd></div></dl></section></noscript>

ями ([[https://fresll.github.io/bio/seminar-9-route.html#exit-to-translation|вспомнить БИО-9·26]]).","Новое: как по последовательности нуклеотидов мРНК синтезируется последовательность аминокислот.","Раздел относится к вопросу 12 коллоквиума 2 (предварительный список) и вопросу 21 зачёта."],"mechanism":["[[T01|Трансляция]] — синтез полипептида на рибосоме по матрице мРНК в соответствии с генетическим кодом.","Участники: [[T13|мРНК]] — матрица; [[T26|рибосома]] — место синтеза, катализирующее образование пептидных связей; [[T16|тРНК]] — адаптеры, приносящие аминокислоты; [[T22|аминоацил-тРНК-синтетазы]] — ферменты, соединяющие аминокислоты с тРНК; белковые факторы инициации, элонгации и терминации.","мРНК считывается от 5′- к 3′-концу, а [[T14|полипептид]] растёт от N-конца к C-концу: первая аминокислота (метионин старт-кодона) оказывается на N-конце.","Белок-кодирующие мРНК эукариот транслируются в цитоплазме — на свободных рибосомах или на рибосомах, связанных с мембраной эндоплазматического ретикулума (семинар 4)."],"paragraphs":["Между нуклеотидом и аминокислотой нет прямого химического соответствия: связь между ними обеспечивает адаптер — тРНК, — и фермент, который присоединяет к этому адаптеру аминокислоту (раздел 2).","Трансляция — тоже матричный синтез, но, в отличие от репликации и транскрипции, матрица и продукт химически разные: последовательность нуклеотидов переводится в последовательность аминокислот."],"conditions":"Схема шага — модель вкладки 1: условная мРНК из девяти смысловых кодонов и стоп-кодона.","sources":["Alberts2022"],"quiz":{"id":"S10-L01","question":"В каком направлении рибосома считывает мРНК и в каком растёт полипептид?","options":[{"id":"S10-L01-1","text":"мРНК — от 5′ к 3′, полипептид — от N- к C-концу","correct":true,"feedback":"Старт-кодон ближе к 5′-концу; каждая новая аминокислота присоединяется к C-концу цепи."},{"id":"S10-L01-2","text":"мРНК — от 3′ к 5′, полипептид — от C- к N-концу","correct":false,"feedback":"Оба направления указаны наоборот."},{"id":"S10-L01-3","text":"мРНК — от 5′ к 3′, полипептид — от C- к N-концу","correct":false,"feedback":"Новые аминокислоты присоединяются к C-концу, поэтому первым синтезируется N-конец."}]},"widget":{"kind":"dna","title":"","s":{"title":"мРНК и полипептид","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["исходная мРНК"],"scene":"s1b","args":[["none"]],"L":{"s1_ch":"Изменение в кодоне 3 (GAA)","s1_ch_none":"нет","s1_ch_syn":"GAA→GAG","s1_ch_mis":"GAA→GUA","s1_ch_non":"GAA→UAA","s1_ch_ins1":"вставка C","s1_ch_del1":"делеция A","s1_ch_del3":"делеция GAA","s1_ctrl_note":"Цитоплазма клетки человека; полипептид — после одного полного прохода рибосомы. Условная мРНК записана от 5′ к 3′, начиная со старт-кодона. Меняется только кодон 3: замена одного нуклеотида, вставка C после его первого нуклеотида, делеция его второго нуклеотида или всех трёх. Модель показывает изменённую последовательность мРНК, но не то, как изменение возникло: мутация ДНК, ошибка транскрипции и редактирование РНК — разные процессы. Полипептиды рассчитаны по стандартному генетическому коду.","s1_pA":"А. мРНК (5′→3′): кодоны в рамке считывания","s1_pB":"Б. Полипептид (N→C)","s1_pC":"В. Что изменилось","s1_lbl_norm":"норма","s1_lbl_alt":"изменение","s1_lbl_hidden":"откроется после ответа","s1_lbl_start":"старт","s1_lbl_dir":"рибосома читает мРНК 5′→3′; полипептид растёт от N- к C-концу","s1_sum_none":"Изменений нет: {n} аминокислот от метионина до стоп-кодона UAA","s1_sum_syn":"GAA → GAG: глутаминовая кислота → глутаминовая кислота\nпоследовательность полипептида та же","s1_sum_mis":"GAA → GUA: глутаминовая кислота → валин\nодна аминокислота заменена, длина прежняя ({m})","s1_sum_non":"GAA → UAA: смысловой кодон стал стоп-кодоном\nполипептид длиной {m} вместо {n} аминокислот","s1_sum_ins1":"Вставка C: рамка сдвинута, новые кодоны ниже места вставки\nи стоп-кодон UGA; длина {m} вместо {n} аминокислот","s1_sum_del1":"Делеция A: рамка сдвинута, новые кодоны ниже места делеции\nи стоп-кодон UAG; длина {m} вместо {n} аминокислот","s1_sum_del3":"Делеция GAA: рамка сохранена, нет одной глутаминовой кислоты\nдлина {m} вместо {n} аминокислот, остальная последовательность прежняя","s1_r_codon":"Кодон 3","s1_v_codon":"{a} → {b}","s1_v_codon_none":"без изменений","s1_v_codon_ins1":"GCAA… (вставка C)","s1_v_codon_del1":"GA… (делеция A)","s1_v_codon_del3":"удалён целиком","s1_r_len":"Длина полипептида","s1_r_len_s":"аминокислот: норма → изменение","s1_v_len":"{n} → {m}","s1_r_changed":"Новые или заменённые остатки","s1_r_changed_s":"в изменённом полипептиде","s1_v_changed":"{n}","s1_r_frame":"Рамка ниже изменения","s1_v_frame_kept":"сохранена","s1_v_frame_shift":"сдвинута","s1_r_kind":"Тип изменения","s1_v_kind_none":"нет","s1_v_kind_syn":"синонимичная замена","s1_v_kind_mis":"миссенс-замена","s1_v_kind_non":"нонсенс-замена","s1_v_kind_ins1":"вставка со сдвигом рамки","s1_v_kind_del1":"делеция со сдвигом рамки","s1_v_kind_del3":"делеция без сдвига рамки","s1_cap_none":"Исходная мРНК: старт-кодон AUG задаёт рамку считывания, и девять смысловых кодонов читаются подряд по три до стоп-кодона UAA. Полипептид — девять аминокислот от N-конца (метионин) к C-концу.","s1_cap_none_z":"Рамка считывания — разбиение кодирующей области мРНК на кодоны, начиная со старт-кодона: кодоны не перекрываются и читаются без пропусков.","s1_cap_syn":"GAA → GAG: оба кодона кодируют глутаминовую кислоту, последовательность полипептида не изменилась — синонимичная замена.","s1_cap_syn_z":"Код вырожден: большинство аминокислот кодируется несколькими кодонами, которые чаще всего различаются третьим нуклеотидом. Синонимичная замена не меняет аминокислоту, но может влиять на количество мРНК и белка (продвинутый уровень).","s1_cap_mis":"GAA → GUA: в позиции 3 валин вместо глутаминовой кислоты, остальные аминокислоты и длина прежние — миссенс-замена.","s1_cap_mis_z":"Замена первого или второго нуклеотида кодона обычно меняет аминокислоту. Как это скажется на белке, зависит от свойств аминокислоты и её места в белке; по одной схеме этого не определить.","s1_cap_non":"GAA → UAA: кодон глутаминовой кислоты стал стоп-кодоном. Синтез заканчивается после второй аминокислоты — нонсенс-замена: полипептид из двух аминокислот вместо девяти.","s1_cap_non_z":"Преждевременный стоп-кодон обрывает синтез полипептида. Что происходит с укороченным продуктом, рассмотрено в вопросе 4.","s1_cap_ins1":"Вставка C после первого нуклеотида кодона 3: ниже этого места кодоны разбиты по-другому (GCA, AUG, GUU, AGG), и пятый кодон, считая от места вставки (седьмой от старт-кодона), — стоп-кодон UGA. Аминокислоты 3–6 новые, полипептид короче нормы.","s1_cap_ins1_z":"Вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон.","s1_cap_del1":"Делеция второго нуклеотида кодона 3: рамка сдвинута, и ниже кодоны читаются как GAU, GGU, затем стоп-кодон UAG. Полипептид Met–Ala–Asp–Gly.","s1_cap_del1_z":"Делеция одного нуклеотида сдвигает рамку так же, как вставка: меняется разбиение на кодоны всей последовательности ниже места изменения.","s1_cap_del3":"Делеция всего кодона 3 (GAA): рамка сохранена, в полипептиде нет глутаминовой кислоты, остальная последовательность прежняя — восемь аминокислот вместо девяти.","s1_cap_del3_z":"Изменение длины на число нуклеотидов, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты, а последовательность за местом изменения сохраняется.","s1_tl_1":"Малая субчастица рибосомы находит старт-кодон AUG; он задаёт рамку считывания.","s1_tl_2":"Рибосома считывает мРНК от 5′- к 3′-концу по одному кодону, без пропусков и перекрываний.","s1_tl_3":"Каждому смысловому кодону соответствует одна аминокислота; она присоединяется к C-концу растущей цепи.","s1_tl_4":"Стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается."},"notes":["Девять смысловых кодонов от AUG до стоп-кодона UAA; полипептид — девять аминокислот."],"static":["Девять смысловых кодонов от AUG до стоп-кодона UAA; полипептид — девять аминокислот."]},"zoomNarrow":true}},{"id":"genetic-code","section":0,"questions":[1],"title":"Генетический код: кодон, стоп-кодоны и вырожденность","keywords":["генетический код","кодон","триплетность","вырожденность","однозначность","стоп-кодон","старт-кодон AUG"],"lead":["Уже известно: мРНК состоит из четырёх нуклеотидов — A, U, G, C.","Новое: какому сочетанию нуклеотидов соответствует каждая из 20 аминокислот."],"mechanism":["[[T02|Генетический код]] триплетный: [[T03|кодон]] — три нуклеотида мРНК. Из 4³ = 64 кодонов 61 кодирует аминокислоты, а UAA, UAG и UGA — [[T05|стоп-кодоны]].","[[T04|AUG]] кодирует метионин и служит старт-кодоном; внутренние кодоны AUG тоже кодируют метионин.","Код однозначен: каждый кодон соответствует одной аминокислоте или сигналу терминации (редкое исключение — перекодирование: например, UGA в особом окружении мРНК кодирует селеноцистеин).","Код [[T07|вырожден]]: большинство аминокислот кодируется несколькими кодонами (до шести); одним кодоном — только метионин и триптофан. Кодоны-синонимы чаще всего различаются третьим нуклеотидом.","Код почти универсален: у большинства организмов он одинаков, но в митохондриях и у некоторых организмов значение отдельных кодонов иное; например, в митохондриях человека UGA кодирует триптофан."],"paragraphs":[{"details":"Генетический код: кодоны мРНК (5′→3′) каждой аминокислоты","text":"Ala — GCU, GCC, GCA, GCG; Arg — CGU, CGC, CGA, CGG, AGA, AGG; Asn — AAU, AAC; Asp — GAU, GAC; Cys — UGU, UGC; Gln — CAA, CAG; Glu — GAA, GAG; Gly — GGU, GGC, GGA, GGG; His — CAU, CAC; Ile — AUU, AUC, AUA; Leu — UUA, UUG, CUU, CUC, CUA, CUG; Lys — AAA, AAG; Met — AUG (старт-кодон); Phe — UUU, UUC; Pro — CCU, CCC, CCA, CCG; Ser — UCU, UCC, UCA, UCG, AGU, AGC; Thr — ACU, ACC, ACA, ACG; Trp — UGG; Tyr — UAU, UAC; Val — GUU, GUC, GUA, GUG; стоп-кодоны — UAA, UAG, UGA."},"Почему третий нуклеотид менее важен: при спаривании кодона с антикодоном в третьей позиции допускаются неканонические пары (раздел 2), и одна тРНК может узнавать несколько кодонов-синонимов.","Пользуйтесь таблицей кода (она есть во вкладке 1 практикума): первый нуклеотид кодона — строка, второй — столбец, третий — строка внутри ячейки. Тот же код по аминокислотам — в раскрываемом блоке выше."],"conditions":"Таблица кода — стандартный ядерный код; код митохондрий в моделях не используется.","sources":["Alberts2022"],"quiz":{"id":"S10-L02","question":"Почему замена третьего нуклеотида кодона часто не меняет аминокислоту?","options":[{"id":"S10-L02-1","text":"Третий нуклеотид кодона рибосома вообще не считывает","correct":false,"feedback":"Третий нуклеотид считывается, но в нём допускаются неканонические пары с антикодоном."},{"id":"S10-L02-2","text":"Кодоны-синонимы обычно различаются именно третьим нуклеотидом","correct":true,"feedback":"Это следствие вырожденности кода; но не всегда — у некоторых аминокислот синонимов только два или замена даёт стоп-кодон."},{"id":"S10-L02-3","text":"Третий нуклеотид кодона не входит в состав мРНК","correct":false,"feedback":"Все три нуклеотида кодона — часть мРНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Синонимичная и миссенс-замена","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["GAA → GAG","GAA → GUA"],"scene":"s1b","args":[["syn"],["mis"]],"L":{"s1_ch":"Изменение в кодоне 3 (GAA)","s1_ch_none":"нет","s1_ch_syn":"GAA→GAG","s1_ch_mis":"GAA→GUA","s1_ch_non":"GAA→UAA","s1_ch_ins1":"вставка C","s1_ch_del1":"делеция A","s1_ch_del3":"делеция GAA","s1_ctrl_note":"Цитоплазма клетки человека; полипептид — после одного полного прохода рибосомы. Условная мРНК записана от 5′ к 3′, начиная со старт-кодона. Меняется только кодон 3: замена одного нуклеотида, вставка C после его первого нуклеотида, делеция его второго нуклеотида или всех трёх. Модель показывает изменённую последовательность мРНК, но не то, как изменение возникло: мутация ДНК, ошибка транскрипции и редактирование РНК — разные процессы. Полипептиды рассчитаны по стандартному генетическому коду.","s1_pA":"А. мРНК (5′→3′): кодоны в рамке считывания","s1_pB":"Б. Полипептид (N→C)","s1_pC":"В. Что изменилось","s1_lbl_norm":"норма","s1_lbl_alt":"изменение","s1_lbl_hidden":"откроется после ответа","s1_lbl_start":"старт","s1_lbl_dir":"рибосома читает мРНК 5′→3′; полипептид растёт от N- к C-концу","s1_sum_none":"Изменений нет: {n} аминокислот от метионина до стоп-кодона UAA","s1_sum_syn":"GAA → GAG: глутаминовая кислота → глутаминовая кислота\nпоследовательность полипептида та же","s1_sum_mis":"GAA → GUA: глутаминовая кислота → валин\nодна аминокислота заменена, длина прежняя ({m})","s1_sum_non":"GAA → UAA: смысловой кодон стал стоп-кодоном\nполипептид длиной {m} вместо {n} аминокислот","s1_sum_ins1":"Вставка C: рамка сдвинута, новые кодоны ниже места вставки\nи стоп-кодон UGA; длина {m} вместо {n} аминокислот","s1_sum_del1":"Делеция A: рамка сдвинута, новые кодоны ниже места делеции\nи стоп-кодон UAG; длина {m} вместо {n} аминокислот","s1_sum_del3":"Делеция GAA: рамка сохранена, нет одной глутаминовой кислоты\nдлина {m} вместо {n} аминокислот, остальная последовательность прежняя","s1_r_codon":"Кодон 3","s1_v_codon":"{a} → {b}","s1_v_codon_none":"без изменений","s1_v_codon_ins1":"GCAA… (вставка C)","s1_v_codon_del1":"GA… (делеция A)","s1_v_codon_del3":"удалён целиком","s1_r_len":"Длина полипептида","s1_r_len_s":"аминокислот: норма → изменение","s1_v_len":"{n} → {m}","s1_r_changed":"Новые или заменённые остатки","s1_r_changed_s":"в изменённом полипептиде","s1_v_changed":"{n}","s1_r_frame":"Рамка ниже изменения","s1_v_frame_kept":"сохранена","s1_v_frame_shift":"сдвинута","s1_r_kind":"Тип изменения","s1_v_kind_none":"нет","s1_v_kind_syn":"синонимичная замена","s1_v_kind_mis":"миссенс-замена","s1_v_kind_non":"нонсенс-замена","s1_v_kind_ins1":"вставка со сдвигом рамки","s1_v_kind_del1":"делеция со сдвигом рамки","s1_v_kind_del3":"делеция без сдвига рамки","s1_cap_none":"Исходная мРНК: старт-кодон AUG задаёт рамку считывания, и девять смысловых кодонов читаются подряд по три до стоп-кодона UAA. Полипептид — девять аминокислот от N-конца (метионин) к C-концу.","s1_cap_none_z":"Рамка считывания — разбиение кодирующей области мРНК на кодоны, начиная со старт-кодона: кодоны не перекрываются и читаются без пропусков.","s1_cap_syn":"GAA → GAG: оба кодона кодируют глутаминовую кислоту, последовательность полипептида не изменилась — синонимичная замена.","s1_cap_syn_z":"Код вырожден: большинство аминокислот кодируется несколькими кодонами, которые чаще всего различаются третьим нуклеотидом. Синонимичная замена не меняет аминокислоту, но может влиять на количество мРНК и белка (продвинутый уровень).","s1_cap_mis":"GAA → GUA: в позиции 3 валин вместо глутаминовой кислоты, остальные аминокислоты и длина прежние — миссенс-замена.","s1_cap_mis_z":"Замена первого или второго нуклеотида кодона обычно меняет аминокислоту. Как это скажется на белке, зависит от свойств аминокислоты и её места в белке; по одной схеме этого не определить.","s1_cap_non":"GAA → UAA: кодон глутаминовой кислоты стал стоп-кодоном. Синтез заканчивается после второй аминокислоты — нонсенс-замена: полипептид из двух аминокислот вместо девяти.","s1_cap_non_z":"Преждевременный стоп-кодон обрывает синтез полипептида. Что происходит с укороченным продуктом, рассмотрено в вопросе 4.","s1_cap_ins1":"Вставка C после первого нуклеотида кодона 3: ниже этого места кодоны разбиты по-другому (GCA, AUG, GUU, AGG), и пятый кодон, считая от места вставки (седьмой от старт-кодона), — стоп-кодон UGA. Аминокислоты 3–6 новые, полипептид короче нормы.","s1_cap_ins1_z":"Вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон.","s1_cap_del1":"Делеция второго нуклеотида кодона 3: рамка сдвинута, и ниже кодоны читаются как GAU, GGU, затем стоп-кодон UAG. Полипептид Met–Ala–Asp–Gly.","s1_cap_del1_z":"Делеция одного нуклеотида сдвигает рамку так же, как вставка: меняется разбиение на кодоны всей последовательности ниже места изменения.","s1_cap_del3":"Делеция всего кодона 3 (GAA): рамка сохранена, в полипептиде нет глутаминовой кислоты, остальная последовательность прежняя — восемь аминокислот вместо девяти.","s1_cap_del3_z":"Изменение длины на число нуклеотидов, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты, а последовательность за местом изменения сохраняется.","s1_tl_1":"Малая субчастица рибосомы находит старт-кодон AUG; он задаёт рамку считывания.","s1_tl_2":"Рибосома считывает мРНК от 5′- к 3′-концу по одному кодону, без пропусков и перекрываний.","s1_tl_3":"Каждому смысловому кодону соответствует одна аминокислота; она присоединяется к C-концу растущей цепи.","s1_tl_4":"Стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается."},"notes":["GAA и GAG кодируют глутаминовую кислоту — полипептид тот же.","GUA кодирует валин — заменена одна аминокислота."],"static":["GAA и GAG кодируют глутаминовую кислоту — полипептид тот же."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E01","question":"Сколько кодонов в стандартном генетическом коде кодируют аминокислоты?","options":[{"id":"S10-E01-1","text":"61 из 64: три оставшиеся — стоп-кодоны","correct":true,"feedback":"UAA, UAG и UGA не кодируют аминокислот; AUG кодирует метионин и служит старт-кодоном."},{"id":"S10-E01-2","text":"64: каждый кодон кодирует аминокислоту","correct":false,"feedback":"Три кодона — стоп-кодоны; им не соответствует ни одна тРНК."},{"id":"S10-E01-3","text":"20: по одному на аминокислоту","correct":false,"feedback":"Код вырожден: большинство аминокислот кодируется несколькими кодонами."}]}},{"id":"reading-frame","section":0,"questions":[1],"title":"Рамка считывания задаёт старт-кодон","keywords":["рамка считывания","неперекрываемость","три возможные рамки","старт-кодон","открытая рамка"],"lead":["Уже известно: кодон — три нуклеотида.","Новое: одну и ту же последовательность можно разбить на кодоны тремя способами; какой из них используется, определяет старт-кодон."],"mechanism":["[[T06|Рамка считывания]] — разбиение последовательности на последовательные кодоны. У любой последовательности три возможные рамки в одном направлении.","При трансляции рамку задаёт старт-кодон: начиная с AUG кодоны читаются подряд, без пропусков и перекрываний, до стоп-кодона.","Рибосома сохраняет рамку, потому что при каждом цикле сдвигается по мРНК ровно на три нуклеотида (раздел 3).","Старт-кодон определяется при инициации: обычно это первый AUG от 5′-конца в благоприятном нуклеотидном окружении (раздел 3)."],"paragraphs":["Пример: последовательность …GCCAUGGCUGAAUGG… в рамке от AUG читается как AUG GCU GAA UGG (Met–Ala–Glu–Trp); сдвинутые на один и на два нуклеотида рамки дали бы совсем другие кодоны.","Число нуклеотидов кодирующей области от первого нуклеотида старт-кодона до последнего нуклеотида стоп-кодона кратно трём."],"conditions":"Схема шага — модель вкладки 1.","sources":["Alberts2022"],"quiz":{"id":"S10-L03","question":"Последовательность 5′-…GCAUGUUCUAAG…-3′. Где начинается рамка, в которой транслируется белок, и какие кодоны идут первыми?","options":[{"id":"S10-L03-1","text":"С первого нуклеотида G: GCA UGU UCU AAG — аланин, цистеин","correct":false,"feedback":"Рамка трансляции начинается со старт-кодона, а не с начала записанной последовательности."},{"id":"S10-L03-2","text":"С любого нуклеотида: рамка определяется случайно","correct":false,"feedback":"Рамку задаёт старт-кодон, узнанный при инициации."},{"id":"S10-L03-3","text":"С AUG: AUG UUC UAA — метионин, фенилаланин, стоп","correct":true,"feedback":"Рамку задаёт старт-кодон; дальше кодоны читаются подряд по три."}]},"widget":{"kind":"dna","title":"","s":{"title":"Рамка от старт-кодона","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["исходная мРНК"],"scene":"s1b","args":[["none"]],"L":{"s1_ch":"Изменение в кодоне 3 (GAA)","s1_ch_none":"нет","s1_ch_syn":"GAA→GAG","s1_ch_mis":"GAA→GUA","s1_ch_non":"GAA→UAA","s1_ch_ins1":"вставка C","s1_ch_del1":"делеция A","s1_ch_del3":"делеция GAA","s1_ctrl_note":"Цитоплазма клетки человека; полипептид — после одного полного прохода рибосомы. Условная мРНК записана от 5′ к 3′, начиная со старт-кодона. Меняется только кодон 3: замена одного нуклеотида, вставка C после его первого нуклеотида, делеция его второго нуклеотида или всех трёх. Модель показывает изменённую последовательность мРНК, но не то, как изменение возникло: мутация ДНК, ошибка транскрипции и редактирование РНК — разные процессы. Полипептиды рассчитаны по стандартному генетическому коду.","s1_pA":"А. мРНК (5′→3′): кодоны в рамке считывания","s1_pB":"Б. Полипептид (N→C)","s1_pC":"В. Что изменилось","s1_lbl_norm":"норма","s1_lbl_alt":"изменение","s1_lbl_hidden":"откроется после ответа","s1_lbl_start":"старт","s1_lbl_dir":"рибосома читает мРНК 5′→3′; полипептид растёт от N- к C-концу","s1_sum_none":"Изменений нет: {n} аминокислот от метионина до стоп-кодона UAA","s1_sum_syn":"GAA → GAG: глутаминовая кислота → глутаминовая кислота\nпоследовательность полипептида та же","s1_sum_mis":"GAA → GUA: глутаминовая кислота → валин\nодна аминокислота заменена, длина прежняя ({m})","s1_sum_non":"GAA → UAA: смысловой кодон стал стоп-кодоном\nполипептид длиной {m} вместо {n} аминокислот","s1_sum_ins1":"Вставка C: рамка сдвинута, новые кодоны ниже места вставки\nи стоп-кодон UGA; длина {m} вместо {n} аминокислот","s1_sum_del1":"Делеция A: рамка сдвинута, новые кодоны ниже места делеции\nи стоп-кодон UAG; длина {m} вместо {n} аминокислот","s1_sum_del3":"Делеция GAA: рамка сохранена, нет одной глутаминовой кислоты\nдлина {m} вместо {n} аминокислот, остальная последовательность прежняя","s1_r_codon":"Кодон 3","s1_v_codon":"{a} → {b}","s1_v_codon_none":"без изменений","s1_v_codon_ins1":"GCAA… (вставка C)","s1_v_codon_del1":"GA… (делеция A)","s1_v_codon_del3":"удалён целиком","s1_r_len":"Длина полипептида","s1_r_len_s":"аминокислот: норма → изменение","s1_v_len":"{n} → {m}","s1_r_changed":"Новые или заменённые остатки","s1_r_changed_s":"в изменённом полипептиде","s1_v_changed":"{n}","s1_r_frame":"Рамка ниже изменения","s1_v_frame_kept":"сохранена","s1_v_frame_shift":"сдвинута","s1_r_kind":"Тип изменения","s1_v_kind_none":"нет","s1_v_kind_syn":"синонимичная замена","s1_v_kind_mis":"миссенс-замена","s1_v_kind_non":"нонсенс-замена","s1_v_kind_ins1":"вставка со сдвигом рамки","s1_v_kind_del1":"делеция со сдвигом рамки","s1_v_kind_del3":"делеция без сдвига рамки","s1_cap_none":"Исходная мРНК: старт-кодон AUG задаёт рамку считывания, и девять смысловых кодонов читаются подряд по три до стоп-кодона UAA. Полипептид — девять аминокислот от N-конца (метионин) к C-концу.","s1_cap_none_z":"Рамка считывания — разбиение кодирующей области мРНК на кодоны, начиная со старт-кодона: кодоны не перекрываются и читаются без пропусков.","s1_cap_syn":"GAA → GAG: оба кодона кодируют глутаминовую кислоту, последовательность полипептида не изменилась — синонимичная замена.","s1_cap_syn_z":"Код вырожден: большинство аминокислот кодируется несколькими кодонами, которые чаще всего различаются третьим нуклеотидом. Синонимичная замена не меняет аминокислоту, но может влиять на количество мРНК и белка (продвинутый уровень).","s1_cap_mis":"GAA → GUA: в позиции 3 валин вместо глутаминовой кислоты, остальные аминокислоты и длина прежние — миссенс-замена.","s1_cap_mis_z":"Замена первого или второго нуклеотида кодона обычно меняет аминокислоту. Как это скажется на белке, зависит от свойств аминокислоты и её места в белке; по одной схеме этого не определить.","s1_cap_non":"GAA → UAA: кодон глутаминовой кислоты стал стоп-кодоном. Синтез заканчивается после второй аминокислоты — нонсенс-замена: полипептид из двух аминокислот вместо девяти.","s1_cap_non_z":"Преждевременный стоп-кодон обрывает синтез полипептида. Что происходит с укороченным продуктом, рассмотрено в вопросе 4.","s1_cap_ins1":"Вставка C после первого нуклеотида кодона 3: ниже этого места кодоны разбиты по-другому (GCA, AUG, GUU, AGG), и пятый кодон, считая от места вставки (седьмой от старт-кодона), — стоп-кодон UGA. Аминокислоты 3–6 новые, полипептид короче нормы.","s1_cap_ins1_z":"Вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон.","s1_cap_del1":"Делеция второго нуклеотида кодона 3: рамка сдвинута, и ниже кодоны читаются как GAU, GGU, затем стоп-кодон UAG. Полипептид Met–Ala–Asp–Gly.","s1_cap_del1_z":"Делеция одного нуклеотида сдвигает рамку так же, как вставка: меняется разбиение на кодоны всей последовательности ниже места изменения.","s1_cap_del3":"Делеция всего кодона 3 (GAA): рамка сохранена, в полипептиде нет глутаминовой кислоты, остальная последовательность прежняя — восемь аминокислот вместо девяти.","s1_cap_del3_z":"Изменение длины на число нуклеотидов, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты, а последовательность за местом изменения сохраняется.","s1_tl_1":"Малая субчастица рибосомы находит старт-кодон AUG; он задаёт рамку считывания.","s1_tl_2":"Рибосома считывает мРНК от 5′- к 3′-концу по одному кодону, без пропусков и перекрываний.","s1_tl_3":"Каждому смысловому кодону соответствует одна аминокислота; она присоединяется к C-концу растущей цепи.","s1_tl_4":"Стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается."},"notes":["Кодоны прочитаны подряд от AUG до UAA; нуклеотиды после стоп-кодона не транслируются."],"static":["Кодоны прочитаны подряд от AUG до UAA; нуклеотиды после стоп-кодона не транслируются."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E02","question":"Что задаёт рамку считывания мРНК при трансляции?","options":[{"id":"S10-E02-1","text":"Первый нуклеотид мРНК, стоящий сразу после кэпа","correct":false,"feedback":"Начало мРНК — 5′-нетранслируемая область; рибосома проходит её, не синтезируя белок."},{"id":"S10-E02-2","text":"Старт-кодон: от него кодоны читаются подряд","correct":true,"feedback":"Поэтому вставка или делеция числа нуклеотидов, не кратного трём, сдвигает всю последовательность кодонов ниже места изменения."},{"id":"S10-E02-3","text":"Стоп-кодон: от него кодоны читаются к 5′-концу","correct":false,"feedback":"мРНК читается от 5′ к 3′, от старт-кодона к стоп-кодону."}]}},{"id":"sequence-changes","section":0,"questions":[1],"title":"Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции","keywords":["синонимичная замена","миссенс-замена","нонсенс-замена","сдвиг рамки","вставка","делеция","мутация","редактирование РНК"],"lead":["Уже известно: мутация — изменение последовательности ДНК, которое копируется при репликации ([[https://fresll.github.io/bio/seminar-8-route.html#error-damage-mutation|вспомнить БИО-8·1]]).","Новое: что изменение последовательности кодирующей области делает с полипептидом."],"mechanism":["[[T08|Синонимичная замена]]: новый кодон кодирует ту же аминокислоту — последовательность полипептида не меняется.","[[T09|Миссенс-замена]]: кодон начинает кодировать другую аминокислоту. Последствия для функции зависят от свойств аминокислоты и её места в белке.","[[T10|Нонсенс-замена]]: смысловой кодон становится стоп-кодоном — синтез обрывается раньше, получается укороченный продукт (раздел 4).","Вставка или [[T12|делеция]] числа нуклеотидов, не кратного трём, вызывает [[T11|сдвиг рамки]]: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон. Изменение длины, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты."],"paragraphs":["Различайте уровни. Изменение последовательности мРНК в модели — это следствие: оно может быть вызвано [[T63|мутацией]] ДНК (передаётся дочерним клеткам и есть во всех мРНК этого гена), ошибкой транскрипции (одна молекула мРНК) или [[T64|редактированием РНК]] (изменением РНК после транскрипции). Ошибка трансляции (раздел 2) меняет отдельные молекулы белка, не затрагивая ни ДНК, ни мРНК.","Синонимичная замена не обязательно биологически нейтральна: она может нарушить сигнал сплайсинга, изменить стабильность мРНК или скорость трансляции.","мРНК с преждевременным стоп-кодоном часто разрушается до того, как синтезирует много белка (нонсенс-опосредованный распад мРНК; подробнее — в курсе «Молекулярная биология»)."],"conditions":"Схема шага — модель вкладки 1: изменения одного кодона условной мРНК.","sources":["Alberts2022"],"quiz":{"id":"S10-L04","question":"В кодирующей области вставлены три нуклеотида точно между двумя кодонами. Что произойдёт?","options":[{"id":"S10-L04-1","text":"Добавится одна аминокислота; рамка ниже сохранится","correct":true,"feedback":"Если вставка не образовала стоп-кодона, остальная последовательность прежняя."},{"id":"S10-L04-2","text":"Рамка сдвинется, и стоп-кодон появится раньше","correct":false,"feedback":"Три нуклеотида — один кодон; рамка не сдвигается."},{"id":"S10-L04-3","text":"Все аминокислоты после вставки изменятся","correct":false,"feedback":"Это последствие сдвига рамки, которого здесь нет."}]},"widget":{"kind":"dna","title":"","s":{"title":"Нонсенс-замена, сдвиг рамки и делеция кодона","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["GAA → UAA","вставка C","делеция A","делеция GAA"],"scene":"s1b","args":[["non"],["ins1"],["del1"],["del3"]],"L":{"s1_ch":"Изменение в кодоне 3 (GAA)","s1_ch_none":"нет","s1_ch_syn":"GAA→GAG","s1_ch_mis":"GAA→GUA","s1_ch_non":"GAA→UAA","s1_ch_ins1":"вставка C","s1_ch_del1":"делеция A","s1_ch_del3":"делеция GAA","s1_ctrl_note":"Цитоплазма клетки человека; полипептид — после одного полного прохода рибосомы. Условная мРНК записана от 5′ к 3′, начиная со старт-кодона. Меняется только кодон 3: замена одного нуклеотида, вставка C после его первого нуклеотида, делеция его второго нуклеотида или всех трёх. Модель показывает изменённую последовательность мРНК, но не то, как изменение возникло: мутация ДНК, ошибка транскрипции и редактирование РНК — разные процессы. Полипептиды рассчитаны по стандартному генетическому коду.","s1_pA":"А. мРНК (5′→3′): кодоны в рамке считывания","s1_pB":"Б. Полипептид (N→C)","s1_pC":"В. Что изменилось","s1_lbl_norm":"норма","s1_lbl_alt":"изменение","s1_lbl_hidden":"откроется после ответа","s1_lbl_start":"старт","s1_lbl_dir":"рибосома читает мРНК 5′→3′; полипептид растёт от N- к C-концу","s1_sum_none":"Изменений нет: {n} аминокислот от метионина до стоп-кодона UAA","s1_sum_syn":"GAA → GAG: глутаминовая кислота → глутаминовая кислота\nпоследовательность полипептида та же","s1_sum_mis":"GAA → GUA: глутаминовая кислота → валин\nодна аминокислота заменена, длина прежняя ({m})","s1_sum_non":"GAA → UAA: смысловой кодон стал стоп-кодоном\nполипептид длиной {m} вместо {n} аминокислот","s1_sum_ins1":"Вставка C: рамка сдвинута, новые кодоны ниже места вставки\nи стоп-кодон UGA; длина {m} вместо {n} аминокислот","s1_sum_del1":"Делеция A: рамка сдвинута, новые кодоны ниже места делеции\nи стоп-кодон UAG; длина {m} вместо {n} аминокислот","s1_sum_del3":"Делеция GAA: рамка сохранена, нет одной глутаминовой кислоты\nдлина {m} вместо {n} аминокислот, остальная последовательность прежняя","s1_r_codon":"Кодон 3","s1_v_codon":"{a} → {b}","s1_v_codon_none":"без изменений","s1_v_codon_ins1":"GCAA… (вставка C)","s1_v_codon_del1":"GA… (делеция A)","s1_v_codon_del3":"удалён целиком","s1_r_len":"Длина полипептида","s1_r_len_s":"аминокислот: норма → изменение","s1_v_len":"{n} → {m}","s1_r_changed":"Новые или заменённые остатки","s1_r_changed_s":"в изменённом полипептиде","s1_v_changed":"{n}","s1_r_frame":"Рамка ниже изменения","s1_v_frame_kept":"сохранена","s1_v_frame_shift":"сдвинута","s1_r_kind":"Тип изменения","s1_v_kind_none":"нет","s1_v_kind_syn":"синонимичная замена","s1_v_kind_mis":"миссенс-замена","s1_v_kind_non":"нонсенс-замена","s1_v_kind_ins1":"вставка со сдвигом рамки","s1_v_kind_del1":"делеция со сдвигом рамки","s1_v_kind_del3":"делеция без сдвига рамки","s1_cap_none":"Исходная мРНК: старт-кодон AUG задаёт рамку считывания, и девять смысловых кодонов читаются подряд по три до стоп-кодона UAA. Полипептид — девять аминокислот от N-конца (метионин) к C-концу.","s1_cap_none_z":"Рамка считывания — разбиение кодирующей области мРНК на кодоны, начиная со старт-кодона: кодоны не перекрываются и читаются без пропусков.","s1_cap_syn":"GAA → GAG: оба кодона кодируют глутаминовую кислоту, последовательность полипептида не изменилась — синонимичная замена.","s1_cap_syn_z":"Код вырожден: большинство аминокислот кодируется несколькими кодонами, которые чаще всего различаются третьим нуклеотидом. Синонимичная замена не меняет аминокислоту, но может влиять на количество мРНК и белка (продвинутый уровень).","s1_cap_mis":"GAA → GUA: в позиции 3 валин вместо глутаминовой кислоты, остальные аминокислоты и длина прежние — миссенс-замена.","s1_cap_mis_z":"Замена первого или второго нуклеотида кодона обычно меняет аминокислоту. Как это скажется на белке, зависит от свойств аминокислоты и её места в белке; по одной схеме этого не определить.","s1_cap_non":"GAA → UAA: кодон глутаминовой кислоты стал стоп-кодоном. Синтез заканчивается после второй аминокислоты — нонсенс-замена: полипептид из двух аминокислот вместо девяти.","s1_cap_non_z":"Преждевременный стоп-кодон обрывает синтез полипептида. Что происходит с укороченным продуктом, рассмотрено в вопросе 4.","s1_cap_ins1":"Вставка C после первого нуклеотида кодона 3: ниже этого места кодоны разбиты по-другому (GCA, AUG, GUU, AGG), и пятый кодон, считая от места вставки (седьмой от старт-кодона), — стоп-кодон UGA. Аминокислоты 3–6 новые, полипептид короче нормы.","s1_cap_ins1_z":"Вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон.","s1_cap_del1":"Делеция второго нуклеотида кодона 3: рамка сдвинута, и ниже кодоны читаются как GAU, GGU, затем стоп-кодон UAG. Полипептид Met–Ala–Asp–Gly.","s1_cap_del1_z":"Делеция одного нуклеотида сдвигает рамку так же, как вставка: меняется разбиение на кодоны всей последовательности ниже места изменения.","s1_cap_del3":"Делеция всего кодона 3 (GAA): рамка сохранена, в полипептиде нет глутаминовой кислоты, остальная последовательность прежняя — восемь аминокислот вместо девяти.","s1_cap_del3_z":"Изменение длины на число нуклеотидов, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты, а последовательность за местом изменения сохраняется.","s1_tl_1":"Малая субчастица рибосомы находит старт-кодон AUG; он задаёт рамку считывания.","s1_tl_2":"Рибосома считывает мРНК от 5′- к 3′-концу по одному кодону, без пропусков и перекрываний.","s1_tl_3":"Каждому смысловому кодону соответствует одна аминокислота; она присоединяется к C-концу растущей цепи.","s1_tl_4":"Стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается."},"notes":["Стоп-кодон UAA обрывает синтез после второй аминокислоты.","Вставка одного нуклеотида сдвигает рамку: новые кодоны и стоп-кодон UGA.","Делеция одного нуклеотида тоже сдвигает рамку.","Делеция трёх нуклеотидов кодона убирает одну аминокислоту без сдвига рамки."],"static":["Стоп-кодон UAA обрывает синтез после второй аминокислоты."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E03","question":"В кодирующей области удалены два нуклеотида. Что, скорее всего, произойдёт с полипептидом?","options":[{"id":"S10-E03-1","text":"Полипептид станет короче на две аминокислоты, остальное не изменится","correct":false,"feedback":"Без сдвига рамки было бы при делеции трёх нуклеотидов."},{"id":"S10-E03-2","text":"Ничего не изменится: генетический код вырожден","correct":false,"feedback":"Вырожденность смягчает часть замен, но не сдвиг рамки."},{"id":"S10-E03-3","text":"Рамка сдвинется: ниже места делеции аминокислоты изменятся, и вскоре встретится стоп-кодон","correct":true,"feedback":"Два не кратно трём."}]}},{"id":"same-number-of-changes","section":0,"questions":[1],"title":"Одинаковое число изменённых нуклеотидов — разные последствия для полипептида","keywords":["положение относительно рамки","третья позиция","сдвиг рамки у начала и у конца","делеция внутри кодона","обратная задача"],"lead":["Уже известно: типы изменений и их последствия (БИО-10·4).","Новое: от чего зависит, насколько изменится полипептид при изменении одного или трёх нуклеотидов."],"mechanism":["Замена третьего нуклеотида синонимична не всегда: у аланина (GCN) годится любой нуклеотид, у лизина — только A или G (AAU и AAC кодируют аспарагин), а UGG → UGA превращает кодон триптофана в стоп-кодон.","Сдвиг рамки меняет только кодоны ниже места изменения. У начала кодирующей области полипептид обрывается почти сразу; у конца новая рамка может пройти за прежний стоп-кодон в 3′-нетранслируемую область, и полипептид становится длиннее.","Делеция или вставка трёх нуклеотидов внутри кодона затрагивает два соседних кодона: две аминокислоты заменяются одной (или тремя), иногда возникает стоп-кодон.","По последовательности аминокислот нельзя однозначно восстановить мРНК: у лейцина, серина и аргинина синонимы различаются даже первым нуклеотидом."],"paragraphs":["Обратная задача модели: две мРНК различаются в семи нуклеотидах в четырёх кодонах (UCC/AGC — серин, UUA/CUG — лейцин, AGG/CGU — аргинин, ACA/ACC — треонин), а полипептид одинаков. Разные мРНК обычно транскрибированы с разных последовательностей ДНК; одинаковый белок объясняется вырожденностью кода, и вывод «одинаковый белок — одинаковая ДНК» неверен.","Функциональную активность белка по числу изменённых аминокислот не предсказать: одна замена в активном центре может выключить фермент, а несколько замен на поверхности — почти не сказаться. Модель активность не рассчитывает.","Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: условная мРНК из 12 смысловых кодонов; полипептиды рассчитаны по стандартному коду.","sources":["Alberts2022"],"quiz":{"id":"S10-L05","question":"Делеция трёх нуклеотидов начинается со второго нуклеотида кодона. Что произойдёт?","options":[{"id":"S10-L05-1","text":"Рамка сдвинется, все аминокислоты дальше новые","correct":false,"feedback":"Удалено три нуклеотида — рамка ниже сохраняется."},{"id":"S10-L05-2","text":"Рамка сохранится, но вместо двух аминокислот будет одна","correct":true,"feedback":"Оставшиеся нуклеотиды двух кодонов образуют один новый кодон."},{"id":"S10-L05-3","text":"Исчезнет ровно одна аминокислота, остальные не изменятся","correct":false,"feedback":"Так бывает, только если делеция совпадает с целым кодоном."}]},"widget":{"kind":"dna","title":"","s":{"title":"Одинаковое число изменений","status":"Учебная модель · последовательность условная","modes_label":"Что показать","modes":["+1 у начала","+1 у конца","−3 внутри кодона","обратная задача"],"scene":"a1","args":[["ins1","s3","1","C"],["ins1","s11","1","C"],["del3","s7","2","A"],["inv"]],"L":{"s1_lbl_hidden":"откроется после ответа","a1_pA":"А. мРНК (5′→3′): норма и изменённая; рамки — прочитанные кодоны","a1_pB":"Б. Полипептиды (N→C) и итог","a1_lbl_n":"норма","a1_lbl_a":"изменение","a1_lbl_site":"кодон {k}","a1_lbl_window":"показаны кодоны начиная с {k}-го; кодоны до него не изменены","a1_sum_same":"Нуклеотид заменён на такой же — изменения нет","a1_sum_syn":"Синонимичная замена в кодоне {k}: полипептид тот же","a1_sum_mis":"Миссенс-замена в кодоне {k}: одна аминокислота другая, длина та же ({m})","a1_sum_non":"Нонсенс-замена в кодоне {k}: длина {m} вместо {n} аминокислот","a1_sum_stoploss":"Стоп-кодон утрачен: считывание продолжилось, длина {m} вместо {n} аминокислот","a1_sum_fs":"Сдвиг рамки в кодоне {k}: длина {m} вместо {n} аминокислот,\nновых или заменённых остатков — {d}","a1_sum_fs0":"Сдвиг рамки в кодоне {k} сразу образовал стоп-кодон:\nдлина {m} вместо {n} аминокислот, новых остатков нет","a1_sum_inframe_ins":"Вставка без сдвига рамки: длина {m} вместо {n} аминокислот;\nновых или заменённых остатков — {d}, дальше последовательность прежняя","a1_sum_inframe_del":"Делеция без сдвига рамки: длина {m} вместо {n} аминокислот;\nновых или заменённых остатков — {d}, дальше последовательность прежняя","a1_sum_inframe_stop":"Изменение длины кратно трём, но возник стоп-кодон:\nдлина {m} вместо {n} аминокислот","a1_pAi":"А. Две мРНК (5′→3′): красным — нуклеотиды мРНК 2, отличные от мРНК 1","a1_pBi":"Б. Полипептид, рассчитанный по обеим мРНК","a1_lbl_m1":"мРНК 1","a1_lbl_m2":"мРНК 2","a1_lbl_ndiff":"различающихся нуклеотидов: {n}","a1_lbl_samepep":"последовательность аминокислот одна и та же"},"notes":["Вставка после первого нуклеотида кодона 3: полипептид из пяти аминокислот.","Та же вставка в кодоне 11: новая рамка проходит в 3′-НТО — 14 аминокислот вместо 12.","Делеция CUA: из GCU AUA остаётся GUA — валин вместо аланина и изолейцина.","Две мРНК, один полипептид."],"static":["Вставка после первого нуклеотида кодона 3: полипептид из пяти аминокислот."]},"zoomNarrow":true},"level":"adv"},{"id":"synonymous-not-neutral","section":0,"questions":[1],"title":"Синонимичные кодоны могут менять количество белка в десятки раз","keywords":["синонимичные кодоны","стабильность мРНК","количество белка","клетки человека"],"lead":["Уже известно: синонимичная замена не меняет последовательность аминокислот (БИО-10·4).","Новое: набор кодонов-синонимов влияет на количество белка, синтезируемого с мРНК."],"mechanism":["В клетках человека сравнили 12 вариантов последовательности, кодирующей один и тот же флуоресцентный белок; варианты различались только кодонами-синонимами.","Яркость клеток, по которой судили о количестве белка, различалась почти в 50 раз; один вариант вообще не дал заметного белка.","Важнее оказалось, какие кодоны заменены, а не сколько: вариант, отличавшийся от исходного в 78 кодонах, давал почти столько же белка.","Яркость вариантов коррелировала со стабильностью мРНК, предсказанной по составу кодонов; вариант без заметного белка авторы объясняют уже другими свойствами последовательности (например, структурой РНК). Кроме того, для 955 мРНК, введённых в эмбрионы рыбы данио, стабильность, предсказанная по составу кодонов, значимо, но слабо коррелировала с измеренной скоростью распада."],"paragraphs":["Как это узнали: в клетки человека вводили варианты гена с разными наборами кодонов-синонимов и измеряли свечение белка.","Граница вывода: в вариантах менялось много кодонов сразу, поэтому о последствиях одной синонимичной замены в конкретном гене эти данные прямо не говорят. Они показывают, что «синонимичная» не значит «неважная» для количества белка.","Связанная модель — в практикуме: вопрос 1, уровень «Продвинутый» (одинаковое число изменений — разные последствия); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Клетки человека линии 293T и эмбрионы рыбы данио; варианты гена флуоресцентного белка.","sources":["Diez2022"],"quiz":{"id":"S10-L06","question":"Два варианта гена кодируют один белок, но различаются кодонами-синонимами; белка с одного из них в клетке в 10 раз меньше. Какое объяснение согласуется с данными этого шага?","options":[{"id":"S10-L06-1","text":"Синонимичные кодоны на самом деле кодируют другие аминокислоты","correct":false,"feedback":"Синонимы по определению кодируют ту же аминокислоту."},{"id":"S10-L06-2","text":"Это невозможно: синонимичные замены всегда биологически нейтральны","correct":false,"feedback":"Данные показывают обратное: набор синонимов влияет на количество белка."},{"id":"S10-L06-3","text":"Состав кодонов связан со стабильностью мРНК, а с ней — с количеством белка","correct":true,"feedback":"Последовательность аминокислот та же; данные согласуются с различием в количестве матрицы и белка, но это корреляция, а не доказательство механизма."}]},"widget":{"kind":"dna","title":"","s":{"title":"Синонимичная замена","status":"Учебная модель · последовательность условная","modes_label":"Что показать","modes":["синонимичная замена"],"scene":"a1","args":[["sub","s7","3","A"]],"L":{"s1_lbl_hidden":"откроется после ответа","a1_pA":"А. мРНК (5′→3′): норма и изменённая; рамки — прочитанные кодоны","a1_pB":"Б. Полипептиды (N→C) и итог","a1_lbl_n":"норма","a1_lbl_a":"изменение","a1_lbl_site":"кодон {k}","a1_lbl_window":"показаны кодоны начиная с {k}-го; кодоны до него не изменены","a1_sum_same":"Нуклеотид заменён на такой же — изменения нет","a1_sum_syn":"Синонимичная замена в кодоне {k}: полипептид тот же","a1_sum_mis":"Миссенс-замена в кодоне {k}: одна аминокислота другая, длина та же ({m})","a1_sum_non":"Нонсенс-замена в кодоне {k}: длина {m} вместо {n} аминокислот","a1_sum_stoploss":"Стоп-кодон утрачен: считывание продолжилось, длина {m} вместо {n} аминокислот","a1_sum_fs":"Сдвиг рамки в кодоне {k}: длина {m} вместо {n} аминокислот,\nновых или заменённых остатков — {d}","a1_sum_fs0":"Сдвиг рамки в кодоне {k} сразу образовал стоп-кодон:\nдлина {m} вместо {n} аминокислот, новых остатков нет","a1_sum_inframe_ins":"Вставка без сдвига рамки: длина {m} вместо {n} аминокислот;\nновых или заменённых остатков — {d}, дальше последовательность прежняя","a1_sum_inframe_del":"Делеция без сдвига рамки: длина {m} вместо {n} аминокислот;\nновых или заменённых остатков — {d}, дальше последовательность прежняя","a1_sum_inframe_stop":"Изменение длины кратно трём, но возник стоп-кодон:\nдлина {m} вместо {n} аминокислот","a1_pAi":"А. Две мРНК (5′→3′): красным — нуклеотиды мРНК 2, отличные от мРНК 1","a1_pBi":"Б. Полипептид, рассчитанный по обеим мРНК","a1_lbl_m1":"мРНК 1","a1_lbl_m2":"мРНК 2","a1_lbl_ndiff":"различающихся нуклеотидов: {n}","a1_lbl_samepep":"последовательность аминокислот одна и та же"},"notes":["GCU → GCA: аланин остаётся аланином; модель не показывает влияния на количество белка."],"static":["GCU → GCA: аланин остаётся аланином; модель не показывает влияния на количество белка."]},"zoomNarrow":true},"level":"adv"},{"id":"trna-structure","section":1,"questions":[2],"title":"тРНК — адаптер между кодоном и аминокислотой","keywords":["тРНК","клеверный лист","L-форма","антикодон","акцепторный конец","CCA","адаптер"],"lead":["Уже известно: между нуклеотидом и аминокислотой нет прямого химического соответствия (БИО-10·1).","Новое: молекула-посредник, у которой один конец «читает» кодон, а другой несёт аминокислоту."],"mechanism":["[[T16|тРНК]] — короткая РНК длиной около 80 нуклеотидов (чаще всего 76). Внутримолекулярные пары оснований образуют вторичную структуру «клеверный лист», которая сворачивается в компактную L-образную молекулу.","На одном конце L-образной молекулы — [[T17|антикодон]]: три нуклеотида, спаривающиеся с кодоном мРНК.","На другом конце — акцепторный 3′-конец с последовательностью CCA; к концевому аденозину присоединяется [[T19|аминокислота]].","Антикодон и акцепторный конец разнесены на противоположные концы молекулы, поэтому аминокислота в узнавании кодона не участвует."],"paragraphs":["тРНК синтезируется РНК-полимеразой III и проходит процессинг; многие её нуклеотиды химически модифицированы, в том числе в антикодоне, что расширяет возможности спаривания.","Для одной аминокислоты может быть несколько разных тРНК; у человека видов тРНК с разными антикодонами меньше, чем смысловых кодонов, — одна тРНК может узнавать несколько кодонов-синонимов (БИО-10·8)."],"conditions":"Схема шага — модель вкладки 2: условная тРНК изолейцина.","sources":["Alberts2022"],"quiz":{"id":"S10-L07","question":"Почему тРНК называют адаптером?","options":[{"id":"S10-L07-1","text":"Один конец спаривается с кодоном, другой несёт аминокислоту","correct":true,"feedback":"тРНК сопоставляет последовательность нуклеотидов и последовательность аминокислот."},{"id":"S10-L07-2","text":"Она катализирует образование пептидной связи в рибосоме","correct":false,"feedback":"Пептидную связь образует рРНК большой субчастицы рибосомы."},{"id":"S10-L07-3","text":"Она переносит мРНК из ядра в цитоплазму через пору","correct":false,"feedback":"Экспорт мРНК — другой процесс (семинар 9)."}]},"widget":{"kind":"dna","title":"","s":{"title":"тРНК изолейцина","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["заряженная тРНК"],"scene":"s2b","args":[["on","on","AUC"]],"L":{"s1_lbl_hidden":"откроется после ответа","s2_syn":"Изолейцил-тРНК-синтетаза","s2_atp":"АТФ","s2_on":"есть","s2_off":"нет","s2_cod":"Кодон мРНК в A-сайте","s2_cod_AUC":"AUC","s2_cod_AUU":"AUU","s2_cod_GUC":"GUC","s2_ctrl_note":"Цитоплазма клетки человека. Одна условная тРНК изолейцина с антикодоном 5′-GAU-3′ (на схеме записан 3′→5′ над кодоном). Изолейцил-тРНК-синтетазу и АТФ можно убрать; синтетаза валина и тРНК валина в модели есть всегда. Какой аминокислоте соответствует кодон — по таблице генетического кода. Модель показывает правила, а не скорость реакций.","s2_pA":"А. Аминоацилирование: синтетаза соединяет изолейцин с тРНК","s2_pB":"Б. Декодирование: антикодон и кодон в A-сайте рибосомы","s2_pC":"В. Аминокислота, включённая в полипептид на этом кодоне","s2_lbl_syn":"изолейцил-тРНК-синтетаза","s2_lbl_atp":"АТФ","s2_lbl_step_ok":"1) Ile + АТФ → Ile-АМФ + PPᵢ\n2) Ile-АМФ + тРНК → Ile-тРНК + АМФ","s2_lbl_step_nosyn":"синтетазы нет:\nизолейцин к тРНК не присоединяется","s2_lbl_step_noatp":"нет АТФ:\nизолейцин не активируется","s2_lbl_trna_ile":"тРНК изолейцина","s2_lbl_uncharged":"3′-конец свободен","s2_lbl_acc_far":"антикодон и 3′-конец —\nна противоположных\nконцах тРНК","s2_lbl_codon":"кодон {c}","s2_lbl_ac_ile":"антикодон тРНК Ile","s2_lbl_ac_val":"антикодон тРНК Val","s2_lbl_wobble":"в третьей позиции кодона —\nпара G·U (качание)","s2_lbl_wc":"три канонические пары","s2_lbl_inc_none":"аминокислота не доставлена: на этом кодоне синтез не продолжается","s2_lbl_inc_Ile":"изолейцин: его принесла тРНК изолейцина","s2_lbl_inc_Val":"валин: кодон GUC декодирует тРНК валина","s2_r_act":"Изолейцин активирован","s2_r_act_s":"образован изолейциладенилат","s2_r_charged":"тРНК изолейцина","s2_v_charged":"несёт изолейцин","s2_v_free":"без аминокислоты","s2_r_pair":"Спаривание с тРНК изолейцина","s2_r_pair_s":"кодон {c}","s2_v_pair_wc":"три канонические пары","s2_v_pair_wb":"допускается: G·U в третьей позиции","s2_v_pair_val":"не допускается в первой позиции","s2_r_inc":"Включено в полипептид","s2_v_inc_Ile":"изолейцин","s2_v_inc_Val":"валин","s2_v_inc_none":"ничего","s2_cap_ok_wc":"Синтетаза в два этапа соединила изолейцин с 3′-концом тРНК изолейцина. Антикодон этой тРНК образует с кодоном AUC три канонические пары, и в полипептид включается изолейцин.","s2_cap_ok_wc_z":"Соответствие кодона и аминокислоты устанавливается в два этапа: синтетаза соединяет аминокислоту со «своей» тРНК, рибосома проверяет спаривание антикодона с кодоном.","s2_cap_ok_wb":"Кодон AUU тоже кодирует изолейцин. В третьей позиции кодона U спаривается с G первой позиции антикодона — неканоническая пара G·U допускается, и та же тРНК приносит изолейцин.","s2_cap_ok_wb_z":"Качание: строгое спаривание требуется в первых двух позициях кодона, а в третьей допускаются неканонические пары. Поэтому одна тРНК может узнавать несколько кодонов-синонимов, и видов тРНК меньше, чем смысловых кодонов.","s2_cap_ok_val":"Кодон GUC: в первой позиции против G стоит U антикодона тРНК изолейцина — в этой позиции неканоническая пара не допускается, и тРНК изолейцина не удерживается. Кодон декодирует тРНК валина, и включается валин.","s2_cap_ok_val_z":"Отбор тРНК на рибосоме идёт по спариванию антикодона с кодоном, строже всего — в первых двух позициях. Кодон валина не зависит от синтетазы изолейцина.","s2_cap_nosyn_ile":"Без изолейцил-тРНК-синтетазы тРНК изолейцина остаётся без аминокислоты: её антикодон по-прежнему соответствует кодону, но доставлять ей нечего, и на кодоне изолейцина синтез не продолжается.","s2_cap_nosyn_ile_z":"Для каждой аминокислоты в цитозоле клеток человека есть своя синтетаза; она соединяет аминокислоту со всеми тРНК этой аминокислоты. Без неё кодоны этой аминокислоты не декодируются.","s2_cap_noatp_ile":"Без АТФ изолейцин не активируется (не образуется изолейциладенилат) и не присоединяется к тРНК. Аминоацил-тРНК нет — синтез на кодоне изолейцина не продолжается.","s2_cap_noatp_ile_z":"Аминоацилирование требует энергии АТФ: она запасается в сложноэфирной связи аминокислоты с тРНК и затем используется при образовании пептидной связи.","s2_cap_noatp_val":"Без АТФ не заряжается ни одна тРНК, в том числе тРНК валина: на кодоне GUC синтез тоже не продолжается.","s2_cap_noatp_val_z":"АТФ нужен всем аминоацил-тРНК-синтетазам, а сама синтетаза специфична к одной аминокислоте.","s2_tl_1":"Синтетаза связывает аминокислоту и АТФ и образует аминоациладенилат.","s2_tl_1v":"Без синтетазы изолейцина тРНК изолейцина не заряжается; тРНК валина заряжает своя синтетаза.","s2_tl_2":"Аминокислота переносится на 3′-конец тРНК (CCA); получается аминоацил-тРНК.","s2_tl_2v":"тРНК изолейцина остаётся незаряженной; тРНК валина заряжает своя синтетаза (на схеме не показана).","s2_tl_3":"Аминоацил-тРНК входит в A-сайт; антикодон спаривается с кодоном антипараллельно, в третьей позиции допускается пара G·U.","s2_tl_3v":"Против G первой позиции кодона GUC у тРНК изолейцина стоит U: в первой позиции пара G·U не допускается, тРНК изолейцина не удерживается, и кодон декодирует тРНК валина.","s2_tl_4":"Аминокислота включается в полипептид; рибосома проверяет пару кодон — антикодон, но не аминокислоту.","s2_tl_stop_syn":"Остановка на этапе 1: без изолейцил-тРНК-синтетазы изолейцин не присоединяется к тРНК — тРНК изолейцина остаётся незаряженной.","s2_tl_stop_atp":"Остановка на этапе 1: без АТФ аминокислота не активируется — ни одна тРНК не заряжается.","s2_lbl_same_codon":"тот же кодон"},"notes":["Антикодон — внизу, изолейцин — на 3′-конце CCA."],"static":["Антикодон — внизу, изолейцин — на 3′-конце CCA."]},"zoomNarrow":true}},{"id":"codon-anticodon","section":1,"questions":[2],"title":"Спаривание кодона и антикодона: антипараллельность и качание","keywords":["антипараллельность","качание","пара G·U","первая позиция антикодона","кодоны-синонимы"],"lead":["Уже известно: комплементарные цепи нуклеиновых кислот антипараллельны ([[https://fresll.github.io/bio/seminar-7-route.html#double-helix|вспомнить БИО-7·2]]).","Новое: как антикодон узнаёт кодон и почему одна тРНК может узнавать несколько кодонов."],"mechanism":["Кодон и антикодон спариваются антипараллельно: первый нуклеотид кодона (у его 5′-конца) спаривается с третьим нуклеотидом антикодона (у его 3′-конца), а третий нуклеотид кодона — с первым нуклеотидом антикодона.","Пример: кодон 5′-AUC-3′ и антикодон 5′-GAU-3′; записанный над кодоном от 3′ к 5′, антикодон читается как UAG.","В первых двух позициях кодона допускаются только канонические пары; в третьей возможны неканонические, например G·U — [[T18|качание]].","Поэтому тРНК с G в первой позиции антикодона узнаёт кодоны, оканчивающиеся на C и на U, а кодоны-синонимы чаще всего различаются третьим нуклеотидом."],"paragraphs":["Строгость в первых двух позициях обеспечивает декодирующий центр малой субчастицы рибосомы: его рРНК проверяет геометрию пар в этих позициях (раздел 3).","Записывая антикодон, указывайте концы: «антикодон GAU» без концов легко прочитать в неверном направлении."],"conditions":"Схема шага — модель вкладки 2: кодоны AUC, AUU и GUC против антикодона тРНК изолейцина.","sources":["Alberts2022"],"quiz":{"id":"S10-L08","question":"Антикодон тРНК 5′-GAU-3′. С каким кодоном он образует пары, если в третьей позиции кодона допускается пара G·U?","options":[{"id":"S10-L08-1","text":"Только с GAU","correct":false,"feedback":"Антикодон не совпадает с кодоном, а комплементарен ему и антипараллелен."},{"id":"S10-L08-2","text":"С AUC и с AUU","correct":true,"feedback":"G первой позиции антикодона спаривается с C и, при качании, с U третьей позиции кодона."},{"id":"S10-L08-3","text":"С AUC и с GUC","correct":false,"feedback":"В первой позиции кодона неканоническая пара не допускается: GUC — кодон валина."}]},"widget":{"kind":"dna","title":"","s":{"title":"Кодон и антикодон","status":"Схема качественная · последовательность условная","modes_label":"Что показать","modes":["AUC","AUU","GUC"],"scene":"s2b","args":[["on","on","AUC"],["on","on","AUU"],["on","on","GUC"]],"L":{"s1_lbl_hidden":"откроется после ответа","s2_syn":"Изолейцил-тРНК-синтетаза","s2_atp":"АТФ","s2_on":"есть","s2_off":"нет","s2_cod":"Кодон мРНК в A-сайте","s2_cod_AUC":"AUC","s2_cod_AUU":"AUU","s2_cod_GUC":"GUC","s2_ctrl_note":"Цитоплазма клетки человека. Одна условная тРНК изолейцина с антикодоном 5′-GAU-3′ (на схеме записан 3′→5′ над кодоном). Изолейцил-тРНК-синтетазу и АТФ можно убрать; синтетаза валина и тРНК валина в модели есть всегда. Какой аминокислоте соответствует кодон — по таблице генетического кода. Модель показывает правила, а не скорость реакций.","s2_pA":"А. Аминоацилирование: синтетаза соединяет изолейцин с тРНК","s2_pB":"Б. Декодирование: антикодон и кодон в A-сайте рибосомы","s2_pC":"В. Аминокислота, включённая в полипептид на этом кодоне","s2_lbl_syn":"изолейцил-тРНК-синтетаза","s2_lbl_atp":"АТФ","s2_lbl_step_ok":"1) Ile + АТФ → Ile-АМФ + PPᵢ\n2) Ile-АМФ + тРНК → Ile-тРНК + АМФ","s2_lbl_step_nosyn":"синтетазы нет:\nизолейцин к тРНК не присоединяется","s2_lbl_step_noatp":"нет АТФ:\nизолейцин не активируется","s2_lbl_trna_ile":"тРНК изолейцина","s2_lbl_uncharged":"3′-конец свободен","s2_lbl_acc_far":"антикодон и 3′-конец —\nна противоположных\nконцах тРНК","s2_lbl_codon":"кодон {c}","s2_lbl_ac_ile":"антикодон тРНК Ile","s2_lbl_ac_val":"антикодон тРНК Val","s2_lbl_wobble":"в третьей позиции кодона —\nпара G·U (качание)","s2_lbl_wc":"три канонические пары","s2_lbl_inc_none":"аминокислота не доставлена: на этом кодоне синтез не продолжается","s2_lbl_inc_Ile":"изолейцин: его принесла тРНК изолейцина","s2_lbl_inc_Val":"валин: кодон GUC декодирует тРНК валина","s2_r_act":"Изолейцин активирован","s2_r_act_s":"образован изолейциладенилат","s2_r_charged":"тРНК изолейцина","s2_v_charged":"несёт изолейцин","s2_v_free":"без аминокислоты","s2_r_pair":"Спаривание с т илат) и не присоединяется к тРНК. Аминоацил-тРНК нет — синтез на кодоне изолейцина не продолжается.","s2_cap_noatp_ile_z":"Аминоацилирование требует энергии АТФ: она запасается в сложноэфирной связи аминокислоты с тРНК и затем используется при образовании пептидной связи.","s2_cap_noatp_val":"Без АТФ не заряжается ни одна тРНК, в том числе тРНК валина: на кодоне GUC синтез тоже не продолжается.","s2_cap_noatp_val_z":"АТФ нужен всем аминоацил-тРНК-синтетазам, а сама синтетаза специфична к одной аминокислоте.","s2_tl_1":"Синтетаза связывает аминокислоту и АТФ и образует аминоациладенилат.","s2_tl_1v":"Без синтетазы изолейцина тРНК изолейцина не заряжается; тРНК валина заряжает своя синтетаза.","s2_tl_2":"Аминокислота переносится на 3′-конец тРНК (CCA); получается аминоацил-тРНК.","s2_tl_2v":"тРНК изолейцина остаётся незаряженной; тРНК валина заряжает своя синтетаза (на схеме не показана).","s2_tl_3":"Аминоацил-тРНК входит в A-сайт; антикодон спаривается с кодоном антипараллельно, в третьей позиции допускается пара G·U.","s2_tl_3v":"Против G первой позиции кодона GUC у тРНК изолейцина стоит U: в первой позиции пара G·U не допускается, тРНК изолейцина не удерживается, и кодон декодирует тРНК валина.","s2_tl_4":"Аминокислота включается в полипептид; рибосома проверяет пару кодон — антикодон, но не аминокислоту.","s2_tl_stop_syn":"Остановка на этапе 1: без изолейцил-тРНК-синтетазы изолейцин не присоединяется к тРНК — тРНК изолейцина остаётся незаряженной.","s2_tl_stop_atp":"Остановка на этапе 1: без АТФ аминокислота не активируется — ни одна тРНК не заряжается.","s2_lbl_same_codon":"тот же кодон"},"notes":["Три канонические пары.","В третьей позиции кодона — пара G·U: тРНК изолейцина узнаёт и AUU.","В первой позиции — несовпадение: кодон декодирует тРНК валина."],"static":["Три канонические пары."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E04","question":"Кодон мРНК 5′-GCA-3′. Какой антикодон спаривается с ним по каноническим правилам (запись 5′→3′)?","options":[{"id":"S10-E04-1","text":"5′-UGC-3′","correct":true,"feedback":"Антикодон антипараллелен кодону: первый нуклеотид кодона (G) спаривается с третьим нуклеотидом антикодона (C)."},{"id":"S10-E04-2","text":"5′-CGU-3′","correct":false,"feedback":"Это комплементарная последовательность, записанная без учёта антипараллельности (3′→5′)."},{"id":"S10-E04-3","text":"5′-GCA-3′","correct":false,"feedback":"Это сам кодон, а не комплементарный ему антикодон."}]}},{"id":"synthetases","section":1,"questions":[2],"title":"Аминоацил-тРНК-синтетазы соединяют аминокислоту с тРНК","keywords":["аминоацил-тРНК-синтетаза","аминоацилирование","аминоациладенилат","АТФ","корректирующая активность","специфичность"],"lead":["Уже известно: аминокислота присоединяется к 3′-концу тРНК (БИО-10·7).","Новое: какой фермент это делает и за счёт чего аминокислота соединяется именно со «своей» тРНК."],"mechanism":["[[T22|Аминоацил-тРНК-синтетаза]] катализирует [[T23|аминоацилирование]] тРНК в два этапа: аминокислота + АТФ → аминоациладенилат + пирофосфат; затем аминокислота переносится на 3′-концевой аденозин тРНК, освобождается АМФ.","Образуется [[T24|аминоацил-тРНК]]: энергия её сложноэфирной связи затем используется при образовании пептидной связи на рибосоме.","В цитозоле клеток человека для каждой из 20 аминокислот есть своя синтетаза; она присоединяет аминокислоту ко всем тРНК, соответствующим её кодонам. В митохондриях — отдельный набор синтетаз.","Синтетаза узнаёт и аминокислоту, и тРНК — по антикодону, акцепторному стеблю и другим участкам. Многие синтетазы обладают [[T25|корректирующей активностью]]: ошибочно активированная или ошибочно присоединённая аминокислота гидролизуется."],"paragraphs":["Точность аминоацилирования высокая: синтетазы ошибаются примерно один раз на 40 000 присоединений. Особенно трудно различить сходные аминокислоты — например, изолейцин и валин, различающиеся одной метильной группой; здесь работает корректирующая активность.","Без синтетазы своей аминокислоты тРНК остаётся без аминокислоты, и кодоны этой аминокислоты не декодируются; остальные синтетазы при этом работают."],"conditions":"Схема шага — модель вкладки 2: синтетаза изолейцина и АТФ можно убрать.","sources":["Alberts2022"],"quiz":{"id":"S10-L09","question":"Что нужно, чтобы образовалась изолейцил-тРНК?","options":[{"id":"S10-L09-1","text":"Изолейцин, тРНК, рибосома и ГТФ","correct":false,"feedback":"Аминоацилирование идёт вне рибосомы, его катализирует синтетаза."},{"id":"S10-L09-2","text":"Изолейцин, тРНК, фактор элонгации и ГТФ","correct":false,"feedback":"Энергию для аминоацилирования даёт АТФ."},{"id":"S10-L09-3","text":"Изолейцин, тРНК, своя синтетаза и АТФ","correct":true,"feedback":"АТФ активирует аминокислоту (аминоациладенилат), синтетаза переносит её на тРНК."}]},"widget":{"kind":"dna","title":"","s":{"title":"Аминоацилирование","status":"Схема качественная","modes_label":"Что показать","modes":["всё есть","нет синтетазы","нет АТФ"],"scene":"s2b","args":[["on","on","AUC"],["off","on","AUC"],["on","off","AUC"]],"L":{"s1_lbl_hidden":"откроется после ответа","s2_syn":"Изолейцил-тРНК-синтетаза","s2_atp":"АТФ","s2_on":"есть","s2_off":"нет","s2_cod":"Кодон мРНК в A-сайте","s2_cod_AUC":"AUC","s2_cod_AUU":"AUU","s2_cod_GUC":"GUC","s2_ctrl_note":"Цитоплазма клетки человека. Одна условная тРНК изолейцина с антикодоном 5′-GAU-3′ (на схеме записан 3′→5′ над кодоном). Изолейцил-тРНК-синтетазу и АТФ можно убрать; синтетаза валина и тРНК валина в модели есть всегда. Какой аминокислоте соответствует кодон — по таблице генетического кода. Модель показывает правила, а не скорость реакций.","s2_pA":"А. Аминоацилирование: синтетаза соединяет изолейцин с тРНК","s2_pB":"Б. Декодирование: антикодон и кодон в A-сайте рибосомы","s2_pC":"В. Аминокислота, включённая в полипептид на этом кодоне","s2_lbl_syn":"изолейцил-тРНК-синтетаза","s2_lbl_atp":"АТФ","s2_lbl_step_ok":"1) Ile + АТФ → Ile-АМФ + PPᵢ\n2) Ile-АМФ + тРНК → Ile-тРНК + АМФ","s2_lbl_step_nosyn":"синтетазы нет:\nизолейцин к тРНК не присоединяется","s2_lbl_step_noatp":"нет АТФ:\nизолейцин не активируется","s2_lbl_trna_ile":"тРНК изолейцина","s2_lbl_uncharged":"3′-конец свободен","s2_lbl_acc_far":"антикодон и 3′-конец —\nна противоположных\nконцах тРНК","s2_lbl_codon":"кодон {c}","s2_lbl_ac_ile":"антикодон тРНК Ile","s2_lbl_ac_val":"антикодон тРНК Val","s2_lbl_wobble":"в третьей позиции кодона —\nпара G·U (качание)","s2_lbl_wc":"три канонические пары","s2_lbl_inc_none":"аминокислота не доставлена: на этом кодоне синтез не продолжается","s2_lbl_inc_Ile":"изолейцин: его принесла тРНК изолейцина","s2_lbl_inc_Val":"валин: кодон GUC декодирует тРНК валина","s2_r_act":"Изолейцин активирован","s2_r_act_s":"образован изолейциладенилат","s2_r_charged":"тРНК изолейцина","s2_v_charged":"несёт изолейцин","s2_v_free":"без аминокислоты","s2_r_pair":"Спаривание с тРНК изолейцина","s2_r_pair_s":"кодон {c}","s2_v_pair_wc":"три канонические пары","s2_v_pair_wb":"допускается: G·U в третьей позиции","s2_v_pair_val":"не допускается в первой позиции","s2_r_inc":"Включено в полипептид","s2_v_inc_Ile":"изолейцин","s2_v_inc_Val":"валин","s2_v_inc_none":"ничего","s2_cap_ok_wc":"Синтетаза в два этапа соединила изолейцин с 3′-концом тРНК изолейцина. Антикодон этой тРНК образует с кодоном AUC три канонические пары, и в полипептид включается изолейцин.","s2_cap_ok_wc_z":"Соответствие кодона и аминокислоты устанавливается в два этапа: синтетаза соединяет аминокислоту со «своей» тРНК, рибосома проверяет спаривание антикодона с кодоном.","s2_cap_ok_wb":"Кодон AUU тоже кодирует изолейцин. В третьей позиции кодона U спаривается с G первой позиции антикодона — неканоническая пара G·U допускается, и та же тРНК приносит изолейцин.","s2_cap_ok_wb_z":"Качание: строгое спаривание требуется в первых двух позициях кодона, а в третьей допускаются неканонические пары. Поэтому одна тРНК может узнавать несколько кодонов-синонимов, и видов тРНК меньше, чем смысловых кодонов.","s2_cap_ok_val":"Кодон GUC: в первой позиции против G стоит U антикод
