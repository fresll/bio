\nкатализ — нет","s4_r_len":"Длина продукта","s4_r_len_s":"аминокислот","s4_v_len":"{n}","s4_r_dom":"Свёрнутые домены","s4_v_dom_0":"нет","s4_v_dom_1":"домен 1","s4_v_dom_2":"оба","s4_r_exp":"Гидрофобные участки снаружи","s4_r_exp_s":"признак, по которому узнаётся несвёрнутая цепь","s4_r_fate":"Что происходит с продуктом","s4_v_fate_stays":"сохраняется","s4_v_fate_degraded":"разрушается в протеасоме","s4_v_fate_accum":"накапливается","s4_r_act":"Функции белка","s4_v_act_full":"обе","s4_v_act_partial":"только связывание","s4_v_act_none":"нет","s4_cap_norm":"Обычный стоп-кодон: синтезированы 420 аминокислот. Домен 1 свернулся, пока синтезировался домен 2; после терминации свернулся домен 2. Белок выполняет обе функции.","s4_cap_norm_z":"Сворачивание начинается во время трансляции: часть цепи, вышедшая из рибосомы, может свернуться раньше, чем синтезирован C-конец. Шапероны, связанные с рибосомой, помогают этому.","s4_cap_link":"Стоп-кодон в кодоне 195: полипептид из 194 аминокислот освобождается так же, как при обычной терминации. Домен 1 уже свернулся, домена 2 нет: продукт укорочен, но устойчив и сохраняет связывание партнёра без катализа.","s4_cap_link_z":"Укороченный продукт не обязательно разрушается и не обязательно утрачивает все функции: это зависит от того, какие части белка успели синтезироваться и свернуться.","s4_cap_d1_on":"Стоп-кодон в кодоне 120: освобождена цепь из 119 аминокислот — часть домена 1. Она не может свернуться, гидрофобные участки остаются снаружи. Их связывают шапероны; когда свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и продукт разрушает протеасома.","s4_cap_d1_on_z":"Системы контроля качества узнают белок не по длине, а по признакам неправильного сворачивания — например, по открытым гидрофобным участкам.","s4_cap_d1_off":"Тот же укороченный продукт при подавленной протеасоме: убиквитинлигаза присоединяет к несвёрнутым цепям полиубиквитин, но протеасома их не разрушает — помеченные цепи накапливаются и могут слипаться в агрегаты.","s4_cap_d1_off_z":"Количество белка в клетке определяется и синтезом, и удалением: при нарушенном удалении накапливается и тот продукт, который функции не выполняет.","s4_cap_d1_noe3":"Тот же укороченный продукт без убиквитинлигазы E3: цепь не получает метку убиквитина, протеасома её не узнаёт — несвёрнутые цепи без метки накапливаются и могут слипаться в агрегаты.","s4_cap_d1_noe3_z":"Протеасома разрушает белки, помеченные полиубиквитином; метку присоединяет убиквитинлигаза. Без неё нарушен первый шаг пути, без протеасомы — последний; итог в модели один — накопление, но цепи различаются меткой.","s4_lbl_noe3":"нет убиквитинлигазы E3","s4_lbl_accum_e3":"цепи без метки убиквитина накапливаются и могут образовывать агрегаты","s4_tl_1":"Растущая цепь выходит из рибосомы через туннель большой субчастицы.","s4_tl_2":"Домен 1 начинает сворачиваться, выходя из туннеля большой субчастицы, — ещё во время синтеза домена 2.","s4_tl_2b":"Синтезирована цепь домена 1 и соединительного участка; домен 2 не синтезируется.","s4_tl_2n":"Синтезирована только часть домена 1: такой фрагмент свернуться не может.","s4_tl_3":"Стоп-кодон в A-сайте — фактор терминации освобождает полипептид; вышедшие из туннеля домены сворачиваются.","s4_tl_4":"Несвёрнутую цепь с открытыми гидрофобными участками связывают шапероны Hsp70.","s4_tl_5":"Если свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и протеасома её разрушает.","s4_tl_5n":"Без убиквитинлигазы или протеасомы цепь не разрушается: несвёрнутые цепи накапливаются и могут образовывать агрегаты.","s4_tl_5p":"Убиквитинлигаза присоединяет цепь убиквитина, но протеасома подавлена: помеченные цепи не разрушаются и накапливаются.","s4_tl_5e":"Без убиквитинлигазы цепь не получает метку убиквитина и не разрушается: несвёрнутые цепи накапливаются.","s4_pBg":"Б. Растущая цепь у рибосомы","s4_lbl_e3":"E3"},"notes":["Домен 1 свернулся во время синтеза домена 2."],"static":["Домен 1 свернулся во время синтеза домена 2."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E11","question":"Как действуют молекулярные шапероны?","options":[{"id":"S10-E11-1","text":"Задают пространственную структуру белка вместо его последовательности","correct":false,"feedback":"Структуру определяет последовательность аминокислот."},{"id":"S10-E11-2","text":"Помогают цепи свернуться, не задавая её структуры","correct":true,"feedback":"Структура белка определяется его последовательностью; шапероны предотвращают неправильное сворачивание и слипание."},{"id":"S10-E11-3","text":"Разрушают все белки с гидрофобными участками","correct":false,"feedback":"Разрушение — функция убиквитин-протеасомной системы; шапероны помогают сворачиванию."}]}},{"id":"ptm","section":3,"questions":[4],"title":"Посттрансляционные модификации и созревание белка","keywords":["посттрансляционные модификации","отщепление метионина","фосфорилирование","гликозилирование","протеолитическое созревание","сборка комплексов"],"lead":["Уже известно: белки, направляемые в эндоплазматический ретикулум, гликозилируются и проходят аппарат Гольджи (семинар 4).","Новое: синтезированный и свёрнутый полипептид может стать функционально активным белком только после дополнительных изменений."],"mechanism":["[[T55|Посттрансляционные модификации]] — изменения белка во время синтеза или после него.","N-концевой метионин у многих белков отщепляется вскоре после синтеза.","К белку могут присоединяться фосфатные группы (фосфорилирование), олигосахариды (гликозилирование в эндоплазматическом ретикулуме и аппарате Гольджи), липиды; некоторые белки активируются после протеолитического расщепления.","Многие белки работают только в составе комплекса из нескольких субъединиц: одна свёрнутая субъединица ещё не активный белок."],"paragraphs":["Модификации и сборка — ещё одна причина, по которой количество синтезированного полипептида не равно количеству функционально активного белка.","Подробности модификаций в секреторном пути — семинар 4; регуляция активности белков фосфорилированием — далее в курсе."],"conditions":"Обзорный шаг; в моделях семинара модификации не изображены.","sources":["Alberts2022"],"quiz":{"id":"S10-L21","question":"Полипептид синтезирован и свернулся, но фермент неактивен. Какая причина возможна?","options":[{"id":"S10-L21-1","text":"Ошибка в самом генетическом коде клетки","correct":false,"feedback":"Код при трансляции не меняется."},{"id":"S10-L21-2","text":"Полипептид синтезирован от C- к N-концу","correct":false,"feedback":"Синтез всегда идёт от N- к C-концу."},{"id":"S10-L21-3","text":"Не хватает модификации или партнёров по комплексу","correct":true,"feedback":"Многим белкам для активности нужны модификации или сборка с другими субъединицами."}]},"widget":{"kind":"dna","title":"","s":{"title":"Полноразмерный свёрнутый белок","status":"Схема качественная · белок условный","modes_label":"Что показать","modes":["обычный стоп"],"scene":"s4b","args":[["norm","on"]],"L":{"s4_stopc":"Стоп-кодон","s4_stop_norm":"обычный (421)","s4_stop_d1":"кодон 120","s4_stop_link":"кодон 195","s4_ups":"Убиквитин-протеасомная система","s4_ups_on":"работает","s4_ups_off":"подавлена (E3 действует)","s4_ctrl_note":"Цитозоль клетки человека. Условный белок из 420 аминокислот: домен 1 (остатки 1–180) связывает партнёра, домен 2 (201–420) катализирует реакцию; между ними — соединительный участок. Преждевременный стоп-кодон стоит в кодоне 120 (внутри домена 1) или 195 (после домена 1). Панель В — состояние продукта через несколько часов после синтеза (время условное). В модели рассматривается только белок; что происходит с мРНК, модель не показывает.","s4_pA":"А. Кодирующая область мРНК: домены белка и стоп-кодон","s4_pB":"Б. Продукт сразу после терминации","s4_pC":"В. Продукт в клетке через несколько часов","s4_lbl_d1":"домен 1","s4_lbl_d2":"домен 2","s4_lbl_stop":"стоп-кодон {k}","s4_lbl_normstop":"обычный стоп-кодон — после кодона 420","s4_lbl_cotrans":"домен 1 сворачивается ещё во время синтеза домена 2","s4_lbl_d1s":"1","s4_lbl_d2s":"2","s4_lbl_len":"{n} аминокислот","s4_lbl_prod_norm":"оба домена свёрнуты","s4_lbl_prod_d1":"ни один домен не свёрнут;\nгидрофобные участки снаружи","s4_lbl_prod_link":"домен 1 свёрнут;\nдомена 2 нет","s4_lbl_ub":"полиубиквитин","s4_lbl_prot":"протеасома","s4_lbl_pept":"короткие пептиды","s4_lbl_noups":"протеасома подавлена (E3 действует)","s4_lbl_accum":"помеченные убиквитином цепи накапливаются и могут образовывать агрегаты","s4_lbl_act_full":"связывание партнёра — есть\nкатализ — есть","s4_lbl_act_partial":"связывание партнёра — есть\nкатализ — нет","s4_r_len":"Длина продукта","s4_r_len_s":"аминокислот","s4_v_len":"{n}","s4_r_dom":"Свёрнутые домены","s4_v_dom_0":"нет","s4_v_dom_1":"домен 1","s4_v_dom_2":"оба","s4_r_exp":"Гидрофобные участки снаружи","s4_r_exp_s":"признак, по которому узнаётся несвёрнутая цепь","s4_r_fate":"Что происходит с продуктом","s4_v_fate_stays":"сохраняется","s4_v_fate_degraded":"разрушается в протеасоме","s4_v_fate_accum":"накапливается","s4_r_act":"Функции белка","s4_v_act_full":"обе","s4_v_act_partial":"только связывание","s4_v_act_none":"нет","s4_cap_norm":"Обычный стоп-кодон: синтезированы 420 аминокислот. Домен 1 свернулся, пока синтезировался домен 2; после терминации свернулся домен 2. Белок выполняет обе функции.","s4_cap_norm_z":"Сворачивание начинается во время трансляции: часть цепи, вышедшая из рибосомы, может свернуться раньше, чем синтезирован C-конец. Шапероны, связанные с рибосомой, помогают этому.","s4_cap_link":"Стоп-кодон в кодоне 195: полипептид из 194 аминокислот освобождается так же, как при обычной терминации. Домен 1 уже свернулся, домена 2 нет: продукт укорочен, но устойчив и сохраняет связывание партнёра без катализа.","s4_cap_link_z":"Укороченный продукт не обязательно разрушается и не обязательно утрачивает все функции: это зависит от того, какие части белка успели синтезироваться и свернуться.","s4_cap_d1_on":"Стоп-кодон в кодоне 120: освобождена цепь из 119 аминокислот — часть домена 1. Она не может свернуться, гидрофобные участки остаются снаружи. Их связывают шапероны; когда свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и продукт разрушает протеасома.","s4_cap_d1_on_z":"Системы контроля качества узнают белок не по длине, а по признакам неправильного сворачивания — например, по открытым гидрофобным участкам.","s4_cap_d1_off":"Тот же укороченный продукт при подавленной протеасоме: убиквитинлигаза присоединяет к несвёрнутым цепям полиубиквитин, но протеасома их не разрушает — помеченные цепи накапливаются и могут слипаться в агрегаты.","s4_cap_d1_off_z":"Количество белка в клетке определяется и синтезом, и удалением: при нарушенном удалении накапливается и тот продукт, который функции не выполняет.","s4_cap_d1_noe3":"Тот же укороченный продукт без убиквитинлигазы E3: цепь не получает метку убиквитина, протеасома её не узнаёт — несвёрнутые цепи без метки накапливаются и могут слипаться в агрегаты.","s4_cap_d1_noe3_z":"Протеасома разрушает белки, помеченные полиубиквитином; метку присоединяет убиквитинлигаза. Без неё нарушен первый шаг пути, без протеасомы — последний; итог в модели один — накопление, но цепи различаются меткой.","s4_lbl_noe3":"нет убиквитинлигазы E3","s4_lbl_accum_e3":"цепи без метки убиквитина накапливаются и могут образовывать агрегаты","s4_tl_1":"Растущая цепь выходит из рибосомы через туннель большой субчастицы.","s4_tl_2":"Домен 1 начинает сворачиваться, выходя из туннеля большой субчастицы, — ещё во время синтеза домена 2.","s4_tl_2b":"Синтезирована цепь домена 1 и соединительного участка; домен 2 не синтезируется.","s4_tl_2n":"Синтезирована только часть домена 1: такой фрагмент свернуться не может.","s4_tl_3":"Стоп-кодон в A-сайте — фактор терминации освобождает полипептид; вышедшие из туннеля домены сворачиваются.","s4_tl_4":"Несвёрнутую цепь с открытыми гидрофобными участками связывают шапероны Hsp70.","s4_tl_5":"Если свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и протеасома её разрушает.","s4_tl_5n":"Без убиквитинлигазы или протеасомы цепь не разрушается: несвёрнутые цепи накапливаются и могут образовывать агрегаты.","s4_tl_5p":"Убиквитинлигаза присоединяет цепь убиквитина, но протеасома подавлена: помеченные цепи не разрушаются и накапливаются.","s4_tl_5e":"Без убиквитинлигазы цепь не получает метку убиквитина и не разрушается: несвёрнутые цепи накапливаются.","s4_pBg":"Б. Растущая цепь у рибосомы","s4_lbl_e3":"E3"},"notes":["Свёрнутый полноразмерный белок — исходная точка созревания."],"static":["Свёрнутый полноразмерный белок — исходная точка созревания."]},"zoomNarrow":true}},{"id":"quality-control","section":3,"questions":[4],"title":"Контроль качества: шапероны, убиквитин и протеасома","keywords":["контроль качества","убиквитин","E1","E2","E3","протеасома 26S","агрегаты","протеостаз"],"lead":["Уже известно: белки клетки удаляют убиквитин-протеасомная система и аутофагия (семинар 5).","Новое: что происходит с полипептидом, который не удалось свернуть."],"mechanism":["[[T56|Контроль качества белков]] начинается с шаперонов: они связывают открытые гидрофобные участки и дают цепи возможность свернуться повторно.","Если свернуть цепь не удаётся, [[T58|убиквитинлигаза]] вместе с ферментами E1 и E2 присоединяет к ней цепь [[T57|убиквитина]].","Полиубиквитинированный белок разворачивает и расщепляет [[T59|протеасома]] (26S) на короткие пептиды.","Если удаление не справляется, неправильно свёрнутые белки накапливаются и могут образовывать [[T60|агрегаты]], нарушающие работу клетки."],"paragraphs":["Узнаётся не длина белка, а признаки неправильного сворачивания: укороченный, но свёрнутый продукт может сохраняться, а полноразмерный неправильно свёрнутый — разрушаться.","Количество белка в клетке определяется балансом синтеза и удаления; поддержание набора правильно свёрнутых белков называют [[T62|протеостазом]] (курс «Молекулярная биология»)."],"conditions":"Схема шага — модель вкладки 4.","sources":["Alberts2022"],"quiz":{"id":"S10-L22","question":"Что произойдёт с несвёрнутым полипептидом, если протеасома подавлена, а убиквитинлигаза действует?","options":[{"id":"S10-L22-1","text":"Он накопится с меткой убиквитина и может образовать агрегаты","correct":true,"feedback":"Убиквитинлигаза метит цепь, но без протеасомы помеченная цепь не разрушается; подавление удаления не исправляет дефекта сворачивания."},{"id":"S10-L22-2","text":"Он со временем свернётся правильно","correct":false,"feedback":"Протеасома не участвует в сворачивании."},{"id":"S10-L22-3","text":"Его разрушит рибосома после синтеза","correct":false,"feedback":"Рибосома синтезирует белки, а не разрушает их."}]},"widget":{"kind":"dna","title":"","s":{"title":"Несвёрнутый продукт","status":"Схема качественная · белок условный","modes_label":"Что показать","modes":["протеасома работает","протеасома подавлена (E3 действует)"],"scene":"s4b","args":[["d1","on"],["d1","off"]],"L":{"s4_stopc":"Стоп-кодон","s4_stop_norm":"обычный (421)","s4_stop_d1":"кодон 120","s4_stop_link":"кодон 195","s4_ups":"Убиквитин-протеасомная система","s4_ups_on":"работает","s4_ups_off":"подавлена (E3 действует)","s4_ctrl_note":"Цитозоль клетки человека. Условный белок из 420 аминокислот: домен 1 (остатки 1–180) связывает партнёра, домен 2 (201–420) катализирует реакцию; между ними — соединительный участок. Преждевременный стоп-кодон стоит в кодоне 120 (внутри домена 1) или 195 (после домена 1). Панель В — состояние продукта через несколько часов после синтеза (время условное). В модели рассматривается только белок; что происходит с мРНК, модель не показывает.","s4_pA":"А. Кодирующая область мРНК: домены белка и стоп-кодон","s4_pB":"Б. Продукт сразу после терминации","s4_pC":"В. Продукт в клетке через несколько часов","s4_lbl_d1":"домен 1","s4_lbl_d2":"домен 2","s4_lbl_stop":"стоп-кодон {k}","s4_lbl_normstop":"обычный стоп-кодон — после кодона 420","s4_lbl_cotrans":"домен 1 сворачивается ещё во время синтеза домена 2","s4_lbl_d1s":"1","s4_lbl_d2s":"2","s4_lbl_len":"{n} аминокислот","s4_lbl_prod_norm":"оба домена свёрнуты","s4_lbl_prod_d1":"ни один домен не свёрнут;\nгидрофобные участки снаружи","s4_lbl_prod_link":"домен 1 свёрнут;\nдомена 2 нет","s4_lbl_ub":"полиубиквитин","s4_lbl_prot":"протеасома","s4_lbl_pept":"короткие пептиды","s4_lbl_noups":"протеасома подавлена (E3 действует)","s4_lbl_accum":"помеченные убиквитином цепи накапливаются и могут образовывать агрегаты","s4_lbl_act_full":"связывание партнёра — есть\nкатализ — есть","s4_lbl_act_partial":"связывание партнёра — есть\nкатализ — нет","s4_r_len":"Длина продукта","s4_r_len_s":"аминокислот","s4_v_len":"{n}","s4_r_dom":"Свёрнутые домены","s4_v_dom_0":"нет","s4_v_dom_1":"домен 1","s4_v_dom_2":"оба","s4_r_exp":"Гидрофобные участки снаружи","s4_r_exp_s":"признак, по которому узнаётся несвёрнутая цепь","s4_r_fate":"Что происходит с продуктом","s4_v_fate_stays":"сохраняется","s4_v_fate_degraded":"разрушается в протеасоме","s4_v_fate_accum":"накапливается","s4_r_act":"Функции белка","s4_v_act_full":"обе","s4_v_act_partial":"только связывание","s4_v_act_none":"нет","s4_cap_norm":"Обычный стоп-кодон: синтезированы 420 аминокислот. Домен 1 свернулся, пока синтезировался домен 2; после терминации свернулся домен 2. Белок выполняет обе функции.","s4_cap_norm_z":"Сворачивание начинается во время трансляции: часть цепи, вышедшая из рибосомы, может свернуться раньше, чем синтезирован C-конец. Шапероны, связанные с рибосомой, помогают этому.","s4_cap_link":"Стоп-кодон в кодоне 195: полипептид из 194 аминокислот освобождается так же, как при обычной терминации. Домен 1 уже свернулся, домена 2 нет: продукт укорочен, но устойчив и сохраняет связывание партнёра без катализа.","s4_cap_link_z":"Укороченный продукт не обязательно разрушается и не обязательно утрачивает все функции: это зависит от того, какие части белка успели синтезироваться и свернуться.","s4_cap_d1_on":"Стоп-кодон в кодоне 120: освобождена цепь из 119 аминокислот — часть домена 1. Она не может свернуться, гидрофобные участки остаются снаружи. Их связывают шапероны; когда свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и продукт разрушает протеасома.","s4_cap_d1_on_z":"Системы контроля качества узнают белок не по длине, а по признакам неправильного сворачивания — например, по открытым гидрофобным участкам.","s4_cap_d1_off":"Тот же укороченный продукт при подавленной протеасоме: убиквитинлигаза присоединяет к несвёрнутым цепям полиубиквитин, но протеасома их не разрушает — помеченные цепи накапливаются и могут слипаться в агрегаты.","s4_cap_d1_off_z":"Количество белка в клетке определяется и синтезом, и удалением: при нарушенном удалении накапливается и тот продукт, который функции не выполняет.","s4_cap_d1_noe3":"Тот же укороченный продукт без убиквитинлигазы E3: цепь не получает метку убиквитина, протеасома её не узнаёт — несвёрнутые цепи без метки накапливаются и могут слипаться в агрегаты.","s4_cap_d1_noe3_z":"Протеасома разрушает белки, помеченные полиубиквитином; метку присоединяет убиквитинлигаза. Без неё нарушен первый шаг пути, без протеасомы — последний; итог в модели один — накопление, но цепи различаются меткой.","s4_lbl_noe3":"нет убиквитинлигазы E3","s4_lbl_accum_e3":"цепи без метки убиквитина накапливаются и могут образовывать агрегаты","s4_tl_1":"Растущая цепь выходит из рибосомы через туннель большой субчастицы.","s4_tl_2":"Домен 1 начинает сворачиваться, выходя из туннеля большой субчастицы, — ещё во время синтеза домена 2.","s4_tl_2b":"Синтезирована цепь домена 1 и соединительного участка; домен 2 не синтезируется.","s4_tl_2n":"Синтезирована только часть домена 1: такой фрагмент свернуться не может.","s4_tl_3":"Стоп-кодон в A-сайте — фактор терминации освобождает полипептид; вышедшие из туннеля домены сворачиваются.","s4_tl_4":"Несвёрнутую цепь с открытыми гидрофобными участками связывают шапероны Hsp70.","s4_tl_5":"Если свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и протеасома её разрушает.","s4_tl_5n":"Без убиквитинлигазы или протеасомы цепь не разрушается: несвёрнутые цепи накапливаются и могут образовывать агрегаты.","s4_tl_5p":"Убиквитинлигаза присоединяет цепь убиквитина, но протеасома подавлена: помеченные цепи не разрушаются и накапливаются.","s4_tl_5e":"Без убиквитинлигазы цепь не получает метку убиквитина и не разрушается: несвёрнутые цепи накапливаются.","s4_pBg":"Б. Растущая цепь у рибосомы","s4_lbl_e3":"E3"},"notes":["Цепь помечена убиквитином и разрушена.","Цепи помечены убиквитином, но не разрушены и накапливаются."],"static":["Цепь помечена убиквитином и разрушена."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E12","question":"Что служит сигналом для разрушения белка протеасомой?","options":[{"id":"S10-E12-1","text":"Сама по себе длина полипептида","correct":false,"feedback":"Узнаётся не длина, а признаки неправильного сворачивания или особые последовательности."},{"id":"S10-E12-2","text":"Присоединённая к белку молекула АТФ","correct":false,"feedback":"АТФ расходуется протеасомой при разворачивании белка, но меткой для разрушения служит полиубиквитиновая цепь."},{"id":"S10-E12-3","text":"Цепь из нескольких молекул убиквитина","correct":true,"feedback":"Убиквитинлигаза узнаёт белок-мишень, например неправильно свёрнутый, и метит его."}]}},{"id":"synthesized-vs-active","section":3,"questions":[4],"title":"Синтезированный, полноразмерный и функционально активный белок — разные показатели","keywords":["синтезировано","полноразмерный","сохранившийся белок","активный белок","баланс","обратная задача"],"lead":["Уже известно: преждевременная терминация, сворачивание и контроль качества (БИО-10·19–10·22).","Новое: как эти процессы вместе разделяют четыре показателя и почему одинаковая активность может скрывать разные механизмы."],"mechanism":["Синтезировано S полипептидов; часть синтезов завершается преждевременно, остальные дают полноразмерные цепи.","Часть полноразмерных цепей сворачивается неправильно; система контроля качества удаляет часть аномальных форм, а правильно свёрнутый белок постоянно обновляется.","Сумма всех форм — сохранившихся и удалённых — равна числу синтезированных полипептидов.","Функционально активен только правильно свёрнутый и не удалённый белок; количество белка и активность могут изменяться в разные стороны."],"paragraphs":["Обратная задача модели: в двух клетках одинаковая активность (18), но белка 19 и 81. Клетка 1 синтезирует вдвое меньше и быстро обновляет белок; в клетке 2 70 % цепей сворачиваются неправильно и почти не удаляются. Вывод «мало активности — значит мало синтеза» неверен без измерения количества белка и его форм.","Модель условная: доли заданы, числа округлены до целых; укороченные и неправильно свёрнутые формы в ней неактивны.","Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: условный период, 100 или 50 синтезированных полипептидов.","sources":["Alberts2022"],"quiz":{"id":"S10-L23","question":"Белка в клетке много, а его активность низкая. Какое объяснение согласуется с этим?","options":[{"id":"S10-L23-1","text":"Белок в этой клетке мало синтезируется","correct":false,"feedback":"Тогда белка было бы мало."},{"id":"S10-L23-2","text":"Много белка неправильно свёрнуто и не удаляется","correct":true,"feedback":"Неактивные формы увеличивают количество белка, но не активность."},{"id":"S10-L23-3","text":"Белок в этой клетке быстро разрушается","correct":false,"feedback":"Тогда белка тоже было бы мало."}]},"widget":{"kind":"dna","title":"","s":{"title":"Четыре показателя","status":"Учебная модель · доли условные","modes_label":"Что показать","modes":["хорошие условия","плохое сворачивание и слабый контроль","обратная задача"],"scene":"a4","args":[["100","0","0.9","0.8","0.2"],["100","0","0.3","0.1","0.2"],["pair","open"]],"L":{"a4_pA":"А. Путь {s} условных молекул: от синтеза к сохранившемуся белку","a4_r1":"синтез","a4_r2":"длина","a4_r3":"сворач.","a4_r4":"итог","a4_lbl_hidden":"путь молекул не исследован","a4_lg_S":"синтезированные","a4_lg_F":"полноразмерные","a4_lg_T":"укороченные","a4_lg_N":"правильно свёрнутые","a4_lg_M":"неправильно свёрнутые","a4_lg_D":"удалённые","a4_bl_S":"синтезировано","a4_bl_F":"полноразмерных","a4_bl_R":"сохранилось\nбелка","a4_bl_A":"функционально\nактивно","a4_bl_M":"неправильно\nсвёрнуто","a4_pB":"Б. Четыре разных показателя","a4_b_S":"Синтезировано","a4_b_F":"Полноразмерных","a4_b_R":"Сохранилось белка","a4_b_A":"Функционально активно","a4_b_M":"Неправильно свёрнуто","a4_pP":"Две клетки с одинаковой активностью белка","a4_lbl_cellA":"Клетка 1","a4_lbl_cellB":"Клетка 2","a4_lbl_pair_m":"синтез, сворачивание и удаление в клетках не исследованы"},"notes":["Синтезировано 100, активно 72.","Синтезировано 100, белка 87, активно 24.","Одинаковая активность — разное количество белка."],"static":["Синтезировано 100, активно 72."]},"zoomNarrow":true},"level":"adv"},{"id":"cotranslational-assembly","section":3,"questions":[4],"title":"Субъединицы белкового комплекса начинают собираться ещё во время трансляции","keywords":["сборка комплекса","котрансляционная сборка","субъединицы","шаперонин","клетки человека"],"lead":["Уже известно: многим белкам для активности нужны партнёры по комплексу (БИО-10·21).","Новое: сборка комплекса может начинаться, пока обе субъединицы ещё синтезируются на рибосомах."],"mechanism":["Каталитическое ядро фермента, который метилирует РНК, образуют две субъединицы. Растущая цепь одной из них связывается с растущей цепью другой, пока обе ещё на рибосомах.","В клетках человека при снижении количества одной субъединицы количество белка другой резко падало, хотя её мРНК не менялась; подавление протеасомы и лизосом белок не возвращало.","В сборке участвует субъединица цитозольного шаперонина (CCT4): без неё количество обеих субъединиц снижалось.","Значит, количество полноразмерного белка и его активность могут зависеть от того, удаётся ли сборка с партнёром уже во время синтеза."],"paragraphs":["Как это узнали: в клетках человека снижали количество одной субъединицы и измеряли белок и мРНК другой; выделяли рибосомы, ещё синтезирующие одну субъединицу, и проверяли, связана ли с ними мРНК другой.","Граница вывода: работа показывает, что сборка начинается во время трансляции, но какая доля комплексов собирается таким путём, в работе не определено: с белком-партнёром в цитоплазме было совмещено лишь около 5 % молекул мРНК. Почему без партнёра белок другой субъединицы не накапливается, если не из-за протеасомы и лизосом, остаётся неясным.","Связанная модель — в практикуме: вопрос 4, уровень «Продвинутый» (синтезированный, полноразмерный и функционально активный белок); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Клетки человека (линии HEK293, HeLa, A549).","sources":["Wu2026"],"quiz":{"id":"S10-L24","question":"Количество субъединицы А в клетке упало, хотя её мРНК не изменилась; одновременно снижено количество партнёра Б. Какой вывод допустим?","options":[{"id":"S10-L24-1","text":"Снизилась транскрипция гена А в этих клетках","correct":false,"feedback":"мРНК А не изменилась."},{"id":"S10-L24-2","text":"Доказано, что белок А разрушает протеасома","correct":false,"feedback":"В работе подавление протеасомы белок не возвращало."},{"id":"S10-L24-3","text":"Количество белка зависит и от сборки с партнёром","correct":true,"feedback":"Это совместимо с котрансляционной сборкой; механизм нужно проверять отдельно."}]},"widget":{"kind":"dna","title":"","s":{"title":"Синтезированный и активный белок","status":"Учебная модель · доли условные","modes_label":"Что показать","modes":["хорошие условия"],"scene":"a4","args":[["100","0","0.9","0.8","0.2"]],"L":{"a4_pA":"А. Путь {s} условных молекул: от синтеза к сохранившемуся белку","a4_r1":"синтез","a4_r2":"длина","a4_r3":"сворач.","a4_r4":"итог","a4_lbl_hidden":"путь молекул не исследован","a4_lg_S":"синтезированные","a4_lg_F":"полноразмерные","a4_lg_T":"укороченные","a4_lg_N":"правильно свёрнутые","a4_lg_M":"неправильно свёрнутые","a4_lg_D":"удалённые","a4_bl_S":"синтезировано","a4_bl_F":"полноразмерных","a4_bl_R":"сохранилось\nбелка","a4_bl_A":"функционально\nактивно","a4_bl_M":"неправильно\nсвёрнуто","a4_pB":"Б. Четыре разных показателя","a4_b_S":"Синтезировано","a4_b_F":"Полноразмерных","a4_b_R":"Сохранилось белка","a4_b_A":"Функционально активно","a4_b_M":"Неправильно свёрнуто","a4_pP":"Две клетки с одинаковой активностью белка","a4_lbl_cellA":"Клетка 1","a4_lbl_cellB":"Клетка 2","a4_lbl_pair_m":"синтез, сворачивание и удаление в клетках не исследованы"},"notes":["Модель вкладки 4: активного белка меньше, чем синтезированного."],"static":["Модель вкладки 4: активного белка меньше, чем синтезированного."]},"zoomNarrow":true},"level":"adv"},{"id":"integration","section":3,"questions":[1,2,3,4],"title":"Сводная задача: на каком этапе изменение меняет белковый продукт","keywords":["от гена к белку","этапы","наблюдения","пределы вывода"],"lead":["Объединим четыре вопроса и семинар 9. Путь от гена к функционально активному белку: транскрипция → процессинг → трансляция (код и рамка, аминоацилирование, рибосомный цикл) → сворачивание, модификации и сборка → контроль качества и удаление.","Задача — для каждого этапа назвать наблюдение, которое на него указывает, и не делать вывода сильнее, чем позволяют данные."],"mechanism":["Изменение последовательности ДНК (мутация) есть во всех мРНК этого гена: одна и та же замена или сдвиг рамки у всех молекул белка, транслированных с них.","Нарушение сплайсинга ([[https://fresll.github.io/bio/seminar-9-route.html#splicing|вспомнить БИО-9·15]]): если выпадает экзон, длина которого кратна трём, белок короче на участок без сдвига рамки; если не кратна — рамка ниже места изменения сдвигается, и обычно вскоре встречается стоп-кодон. Причиной может быть изменение сигнала сплайсинга в интроне — тогда кодирующие последовательности экзонов не изменены.","Ошибка аминоацилирования: замена одного типа на местах одной аминокислоты в части молекул многих белков; последовательности генов не изменены.","Ошибка декодирования: редкие разрозненные замены в разных местах.","Ограничение инициации или элонгации: меньше завершённых полипептидов при той же последовательности; различает их число и распределение рибосом на мРНК.","Нарушение сворачивания или контроля качества: полипептид нормальной длины и последовательности, но мало активного белка; количество белка может быть и малым, и большим."],"paragraphs":["Общее правило: одинаковое наблюдаемое (например, мало активного белка) может иметь разные молекулярные причины; различают их наблюдения, по которым гипотезы предсказывают разное.","Правильная последовательность кодонов мРНК — необходимое, но не достаточное условие функционально полноценного белка: важны точность аминоацилирования, работа рибосомы, сворачивание и удаление продукта."],"conditions":"Мысленная задача по моделям вкладок 1–4; числа условные.","sources":["Alberts2022"],"quiz":{"id":"S10-L25","question":"У пациента в белке одна и та же замена аминокислоты во всех молекулах, а в других белках замен нет. Что вероятнее?","options":[{"id":"S10-L25-1","text":"Изменение последовательности гена","correct":true,"feedback":"Одна и та же замена во всех молекулах одного белка указывает на изменение матрицы; ошибка аминоацилирования могла бы дать однотипные замены в разных белках, в части молекул."},{"id":"S10-L25-2","text":"Ошибка аминоацилирования тРНК","correct":false,"feedback":"Тогда замены были бы в части молекул и во многих белках."},{"id":"S10-L25-3","text":"Ошибки декодирования на рибосоме","correct":false,"feedback":"Они редкие и разрозненные, а не одинаковые во всех молекулах."}]},"widget":{"kind":"dna","title":"","s":{"title":"Распределение замен","status":"Учебная модель · частоты условные","modes_label":"Что показать","modes":["изменён кодон","ошибка аминоацилирования"],"scene":"a2","args":[["on","norm","gene"],["off","norm","norm"]],"L":{"a2_pA":"А. мРНК (5′→3′)","a2_lbl_mrna_hidden":"последовательность мРНК и гена не исследована","a2_lbl_ile":"Ile","a2_pB":"Б. 10 молекул продукта (красным — замены)","a2_lbl_mol":"{n}","a2_lbl_count":"В. Итог. Замен: {n} · на местах изолейцина: {i} · в других местах: {o}","a2_lbl_inv":"В. Итог. В позиции 6 валин вместо изолейцина в {n} из 10 молекул; другие позиции не исследованы","a2_lbl_pool":"тРНК изолейцина после аминоацилирования (условно 10 молекул; доля с валином — допущение модели)"},"notes":["Одна замена во всех молекулах.","Замены на местах одной аминокислоты в части молекул."],"static":["Одна замена во всех молекулах."]},"zoomNarrow":true}},{"id":"exit-to-regulation","section":3,"questions":[1,2,3,4],"title":"Что дальше: регуляция количества белка","keywords":["количество белка","регуляция экспрессии","инициация трансляции","семинар 11"],"lead":["Количество функционально активного белка зависит от многих этапов: транскрипции, процессинга, времени жизни мРНК, трансляции, сворачивания и удаления.","Как клетка регулирует эти этапы и почему клетки с одинаковым геномом содержат разные белки — тема следующего семинара."],"mechanism":["Количество белка в клетке определяется соотношением скорости его синтеза и скорости удаления.","Синтез регулируется на уровне транскрипции, процессинга, экспорта и трансляции (прежде всего инициации); удаление — на уровне мРНК и белка.","Периоды полужизни белков различаются от минут до многих дней и дольше."],"paragraphs":["В семинаре 11 — регуляция транскрипции, доступность хроматина, посттранскрипционная регуляция и микроРНК.",{"h":"Дальше в курсе «Молекулярная биология»"},"Программы ответа на стресс и подавление инициации трансляции — [[https://fresll.github.io/molbio/seminar-10-route.html|МБ, семинар 10]]; протеостаз, шапероны и убиквитин-протеасомная система — [[https://fresll.github.io/molbio/seminar-11-route.html|МБ, семинар 11]]; нонсенс-опосредованный распад мРНК и время жизни мРНК — МБ, семинар 13 (в разработке)."],"conditions":"Переход к следующему семинару.","sources":["Alberts2022"],"quiz":{"id":"S10-L26","question":"Какое утверждение верно?","options":[{"id":"S10-L26-1","text":"Количество белка определяется только транскрипцией","correct":false,"feedback":"Трансляция, сворачивание и удаление тоже меняют количество белка."},{"id":"S10-L26-2","text":"Количество белка определяется и синтезом, и удалением","correct":true,"feedback":"Поэтому одинаковый синтез может давать разное количество белка."},{"id":"S10-L26-3","text":"Количество белка всегда пропорционально количеству мРНК","correct":false,"feedback":"Эффективность трансляции и удаление белка нарушают пропорциональность."}]},"widget":{"kind":"dna","title":"","s":{"title":"Синтез и удаление","status":"Учебная модель · доли условные","modes_label":"Что показать","modes":["медленное обновление","быстрое обновление"],"scene":"a4","args":[["100","0","0.9","0.8","0.2"],["100","0","0.9","0.8","0.6"]],"L":{"a4_pA":"А. Путь {s} условных молекул: от синтеза к сохранившемуся белку","a4_r1":"синтез","a4_r2":"длина","a4_r3":"сворач.","a4_r4":"итог","a4_lbl_hidden":"путь молекул не исследован","a4_lg_S":"синтезированные","a4_lg_F":"полноразмерные","a4_lg_T":"укороченные","a4_lg_N":"правильно свёрнутые","a4_lg_M":"неправильно свёрнутые","a4_lg_D":"удалённые","a4_bl_S":"синтезировано","a4_bl_F":"полноразмерных","a4_bl_R":"сохранилось\nбелка","a4_bl_A":"функционально\nактивно","a4_bl_M":"неправильно\nсвёрнуто","a4_pB":"Б. Четыре разных показателя","a4_b_S":"Синтезировано","a4_b_F":"Полноразмерных","a4_b_R":"Сохранилось белка","a4_b_A":"Функционально активно","a4_b_M":"Неправильно свёрнуто","a4_pP":"Две клетки с одинаковой активностью белка","a4_lbl_cellA":"Клетка 1","a4_lbl_cellB":"Клетка 2","a4_lbl_pair_m":"синтез, сворачивание и удаление в клетках не исследованы"},"notes":["Удаляется 20 % правильно свёрнутого белка: активно 72.","Удаляется 60 %: активно 36."],"static":["Удаляется 20 % правильно свёрнутого белка: активно 72."]},"zoomNarrow":true}}],"sections":[{"title":"Генетический код и рамка считывания","entry":"translation-overview","sub":"Как последовательность кодонов мРНК определяет последовательность аминокислот и почему одинаковое число изменённых нуклеотидов даёт разные последствия"},{"title":"тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты","entry":"trna-structure","sub":"Почему правильное спаривание кодона и антикодона ещё не гарантирует правильной аминокислоты"},{"title":"Рибосомный цикл: инициация, элонгация, терминация","entry":"ribosome","sub":"Как тРНК и растущая цепь перемещаются по участкам A, P и E и почему больше рибосом не всегда означает больше белка"},{"title":"Завершение синтеза и состояние белкового продукта","entry":"release-truncated","sub":"Почему число синтезированных молекул белка не равно числу функционально активных"}],"glossary":[{"id":"S10-T01","term":"Трансляция","section":0,"def":"Синтез полипептида на рибосоме по матрице мРНК в соответствии с генетическим кодом. У эукариот белок-кодирующие мРНК транслируются в цитоплазме (а также на рибосомах, связанных с мембраной эндоплазматического ретикулума); мРНК считывается от 5′- к 3′-концу, полипептид растёт от N- к C-концу."},{"id":"S10-T02","term":"Генетический код","section":0,"def":"Соответствие между кодонами мРНК и аминокислотами (или сигналом терминации). Код триплетный, однозначный, вырожденный и почти универсальный: в митохондриях и у некоторых организмов значение отдельных кодонов иное."},{"id":"S10-T03","term":"Кодон","section":0,"def":"Последовательность из трёх нуклеотидов мРНК, соответствующая одной аминокислоте или сигналу терминации. Из 64 кодонов 61 смысловой и 3 стоп-кодона."},{"id":"S10-T04","term":"Старт-кодон","section":0,"def":"Кодон AUG, с которого начинается трансляция; он кодирует метионин и задаёт рамку считывания. Его узнаёт антикодон инициаторной тРНК."},{"id":"S10-T05","term":"Стоп-кодон","section":0,"def":"Кодон UAA, UAG или UGA, не соответствующий ни одной аминокислоте: ему не комплементарна ни одна тРНК; его в A-сайте узнаёт белковый фактор терминации, и синтез полипептида заканчивается."},{"id":"S10-T06","term":"Рамка считывания","section":0,"def":"Разбиение нуклеотидной последовательности на последовательные неперекрывающиеся кодоны. Для трансляции рамку задаёт старт-кодон; она продолжается до стоп-кодона."},{"id":"S10-T07","term":"Вырожденность генетического кода","section":0,"def":"Свойство кода: большинство аминокислот кодируется несколькими кодонами (от двух до шести); только метионин и триптофан — одним. Кодоны-синонимы чаще всего различаются третьим нуклеотидом."},{"id":"S10-T08","term":"Синонимичная замена","section":0,"def":"Замена нуклеотида, при которой новый кодон кодирует ту же аминокислоту. Последовательность белка не меняется, но замена может влиять на сплайсинг, стабильность мРНК и эффективность трансляции."},{"id":"S10-T09","term":"Миссенс-замена","section":0,"def":"Замена нуклеотида, при которой кодон начинает кодировать другую аминокислоту."},{"id":"S10-T10","term":"Нонсенс-замена","section":0,"def":"Замена нуклеотида, превращающая смысловой кодон в стоп-кодон; синтез полипептида обрывается раньше обычного (преждевременный стоп-кодон)."},{"id":"S10-T11","term":"Сдвиг рамки считывания","section":0,"def":"Изменение рамки после вставки или делеции числа нуклеотидов, не кратного трём, в кодирующей области: все кодоны ниже места изменения читаются иначе, и вскоре обычно встречается стоп-кодон."},{"id":"S10-T12","term":"Делеция","section":0,"def":"Утрата одного или нескольких нуклеотидов последовательности. Делеция числа нуклеотидов, кратного трём, в кодирующей области рамку не сдвигает."},{"id":"S10-T13","term":"мРНК (матрица трансляции)","section":0,"def":"Зрелая матричная РНК: кэп, 5′-нетранслируемая область, кодирующая область от старт-кодона до стоп-кодона, 3′-нетранслируемая область и поли(А)-хвост. Последовательность кодирующей области определяет последовательность аминокислот белка."},{"id":"S10-T14","term":"Полипептид","section":0,"def":"Цепь аминокислот, соединённых пептидными связями; на рибосоме растёт от N-конца (свободная аминогруппа) к C-концу (карбоксильная группа)."},{"id":"S10-T15","term":"Пептидная связь","section":2,"def":"Амидная связь между карбоксильной группой одной аминокислоты и аминогруппой следующей. На рибосоме образуется переносом растущей цепи с тРНК в P-сайте на аминокислоту тРНК в A-сайте."},{"id":"S10-T16","term":"Транспортная РНК (тРНК)","section":0,"def":"Короткая РНК длиной около 80 нуклеотидов (чаще всего 76) — адаптер между кодоном и аминокислотой. Вторичная структура — «клеверный лист», пространственная — L-образная; на одном конце — антикодон, на другом — 3′-конец CCA, к которому присоединяется аминокислота."},{"id":"S10-T17","term":"Антикодон","section":1,"def":"Три нуклеотида тРНК, спаривающиеся с кодоном мРНК антипараллельно: первый нуклеотид кодона (5′) спаривается с третьим нуклеотидом антикодона. В третьей позиции кодона допускаются неканонические пары (качание)."},{"id":"S10-T18","term":"Качание (неоднозначное спаривание)","section":1,"def":"Допущение неканонических пар (например, G·U) между третьим нуклеотидом кодона и первым нуклеотидом антикодона. Позволяет одной тРНК узнавать несколько кодонов-синонимов."},{"id":"S10-T19","term":"Аминокислота на тРНК","section":1,"def":"Аминокислота, присоединённая сложноэфирной связью к 3′-концевому аденозину тРНК. Рибосома не проверяет, какую аминокислоту несёт тРНК: проверяется только спаривание антикодона с кодоном."},{"id":"S10-T22","term":"Аминоацил-тРНК-синтетаза","section":0,"def":"Фермент, который присоединяет определённую аминокислоту ко всем тРНК, соответствующим кодонам этой аминокислоты, узнавая и аминокислоту, и тРНК. В цитозоле клеток человека для каждой из 20 аминокислот — своя синтетаза. Многие синтетазы обладают корректирующей активностью."},{"id":"S10-T23","term":"Аминоацилирование тРНК","section":1,"def":"Присоединение аминокислоты к 3′-концу тРНК аминоацил-тРНК-синтетазой; идёт в два этапа: активация аминокислоты АТФ (аминоациладенилат) и перенос аминокислоты на тРНК."},{"id":"S10-T24","term":"Аминоацил-тРНК","section":1,"def":"тРНК, к 3′-концу которой присоединена аминокислота. Энергия её сложноэфирной связи используется при образовании пептидной связи."},{"id":"S10-T25","term":"Корректирующая активность синтетазы","section":1,"def":"Способность аминоацил-тРНК-синтетазы гидролизовать ошибочно активированную аминокислоту или ошибочно присоединённую к тРНК аминокислоту; резко снижает частоту ошибок аминоацилирования."},{"id":"S10-T26","term":"Рибосома","section":0,"def":"Комплекс рРНК и белков, синтезирующий полипептид по мРНК. Рибосома эукариот (80S) состоит из малой (40S) и большой (60S) субчастиц; в ней три участка связывания тРНК — A, P и E."},{"id":"S10-T27","term":"Малая субчастица рибосомы (40S)","section":2,"def":"Субчастица, связывающая мРНК; в ней находится декодирующий центр, где проверяется спаривание антикодона с кодоном."},{"id":"S10-T28","term":"Большая субчастица рибосомы (60S)","section":2,"def":"Субчастица, в которой находится пептидилтрансферазный центр, образованный рРНК, и туннель, через который выходит растущая цепь."},{"id":"S10-T32","term":"Пептидилтрансферазный центр","section":2,"def":"Каталитический центр большой субчастицы рибосомы, где образуется пептидная связь; образован рРНК (рибосома — рибозим)."},{"id":"S10-T33","term":"Инициаторная тРНК","section":2,"def":"Особая тРНК, несущая метионин, с которой начинается трансляция; её узнают факторы инициации, и в начале синтеза она находится в P-сайте напротив старт-кодона. В A-сайт не поступает."},{"id":"S10-T35","term":"Окружение старт-кодона","section":2,"def":"Нуклеотиды вокруг AUG, от которых зависит, узнает ли его сканирующая малая субчастица; у позвоночных наиболее важны пурин в положении −3 и G в положении +4."},{"id":"S10-T36","term":"Факторы инициации трансляции","section":2,"def":"Белки, обеспечивающие сборку рибосомы на старт-кодоне: связывание с кэпом (комплекс eIF4F), доставку инициаторной тРНК (eIF2 с ГТФ), сканирование и присоединение большой субчастицы."},{"id":"S10-T38","term":"Фактор элонгации eEF1A","section":2,"def":"Белок, который в комплексе с ГТФ доставляет аминоацил-тРНК в A-сайт; гидролиз ГТФ после правильного спаривания позволяет тРНК занять положение для образования пептидной связи."},{"id":"S10-T39","term":"Фактор элонгации eEF2","section":2,"def":"Белок, который за счёт гидролиза ГТФ обеспечивает транслокацию — сдвиг рибосомы на один кодон."},{"id":"S10-T40","term":"Транслокация","section":2,"def":"Перемещение рибосомы по мРНК на один кодон (три нуклеотида) к 3′-концу; тРНК переходят из A- в P-сайт и из P- в E-сайт, и A-сайт освобождается для следующего кодона."},{"id":"S10-T42","term":"Фактор терминации eRF1","section":2,"def":"Белок, похожий по форме на тРНК, который узнаёт все три стоп-кодона в A-сайте и вызывает гидролиз связи полипептида с тРНК; действует вместе с eRF3."},{"id":"S10-T43","term":"Полисома (полирибосома)","section":2,"def":"мРНК, которую одновременно транслируют несколько рибосом, движущихся одна за другой."},{"id":"S10-T45","term":"Полноразмерный полипептид","section":3,"def":"Полипептид, синтез которого закончился на обычном стоп-кодоне."},{"id":"S10-T46","term":"Укороченный продукт","section":3,"def":"Полипептид, синтез которого закончился раньше обычного — например, на преждевременном стоп-кодоне; может разрушаться или сохраняться и сохранять часть функций."},{"id":"S10-T47","term":"Сворачивание белка","section":3,"def":"Образование пространственной структуры полипептида; определяется последовательностью аминокислот, начинается ещё во время трансляции и у многих белков идёт при участии шаперонов."},{"id":"S10-T48","term":"Домен белка","section":3,"def":"Участок полипептида, сворачивающийся в устойчивую структуру относительно независимо от остальной цепи; часто выполняет отдельную функцию."},{"id":"S10-T50","term":"Гидрофобный участок на поверхности","section":3,"def":"Участок из неполярных аминокислот, который в свёрнутом белке обычно спрятан внутри. Открытые гидрофобные участки — признак несвёрнутой или неправильно свёрнутой цепи; их связывают шапероны."},{"id":"S10-T53","term":"Шаперон Hsp70","section":3,"def":"Белок теплового шока массой около 70 кДа; связывает короткие гидрофобные участки несвёрнутых цепей — в том числе выходящих из рибосомы — и с затратой АТФ помогает им свернуться, предотвращая слипание."},{"id":"S10-T54","term":"Молекулярные шапероны","section":3,"def":"Белки, которые помогают другим белкам правильно свернуться и предотвращают их агрегацию, но не входят в состав готового белка и не задают его структуру. Шаперонины (в цитозоле — TRiC/CCT, в митохондриях — Hsp60) образуют полость, в которой сворачиваются отдельные белки."},{"id":"S10-T55","term":"Посттрансляционные модификации","section":3,"def":"Изменения белка после синтеза (или во время него): отщепление N-концевого метионина, присоединение фосфатных групп, олигосахаридов, липидов, протеолитическое расщепление и другие."},{"id":"S10-T56","term":"Контроль качества белков","section":3,"def":"Совокупность процессов, которые узнают неправильно свёрнутые или неполные белки и либо помогают им свернуться (шапероны), либо направляют их на разрушение."},{"id":"S10-T57","term":"Убиквитин и полиубиквитиновая цепь","section":3,"def":"Небольшой белок, который ферменты E1, E2 и E3 ковалентно присоединяют к белку-мишени. Цепь из нескольких молекул убиквитина — сигнал для разрушения белка протеасомой."},{"id":"S10-T58","term":"Убиквитинлигаза (E3)","section":3,"def":"Фермент, который узнаёт белок-мишень и вместе с E2 переносит на него убиквитин; от E3 зависит, какой белок будет помечен."},{"id":"S10-T59","term":"Протеасома","section":3,"def":"Крупный белковый комплекс (26S), который разворачивает белки, помеченные полиубиквитиновой цепью, и расщепляет их на короткие пептиды внутри полого цилиндра."},{"id":"S10-T60","term":"Агрегат белков","section":3,"def":"Скопление слипшихся несвёрнутых или неправильно свёрнутых белков; может нарушать работу клетки."},{"id":"S10-T62","term":"Протеостаз","section":3,"def":"Поддержание набора и количества правильно свёрнутых белков клетки за счёт согласованной работы синтеза, сворачивания, транспорта и разрушения белков. Подробно — в курсе «Молекулярная биология», семинар 11."},{"id":"S10-T63","term":"Мутация","section":0,"def":"Наследуемое изменение последовательности ДНК. Отличается от ошибки трансляции: ошибка трансляции затрагивает отдельные молекулы белка и не меняет ни ДНК, ни мРНК."},{"id":"S10-T64","term":"Редактирование РНК","section":0,"def":"Изменение последовательности РНК после транскрипции (например, замена A на I или C на U); может менять значение кодона без изменения ДНК."},{"id":"S10-T65","term":"Ошибка трансляции","section":1,"def":"Включение в полипептид аминокислоты, не соответствующей кодону: из-за ошибки аминоацилирования тРНК или ошибки декодирования на рибосоме."}],"sources":{"Alberts2022":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»","doi":"","pmid":""},"Diez2022":{"url":"https://doi.org/10.1038/s41598-022-15526-7","cite":"Diez M., Medina-Muñoz S. G., Castellano L. A., da Silva Pescador G., Wu Q., Bazzini A. A. iCodon customizes gene expression based on the codon composition. Sci Rep. 2022;12:12126","doi":"10.1038/s41598-022-15526-7","pmid":"35840631"},"Zheng2023":{"url":"https://doi.org/10.1073/pnas.2309714120","cite":"Zheng W.-Q., Zhang J.-H., Li Z.-H. et al. Mammalian mitochondrial translation infidelity leads to oxidative stress–induced cell cycle arrest and cardiomyopathy. Proc Natl Acad Sci USA. 2023;120:e2309714120","doi":"10.1073/pnas.2309714120","pmid":"37669377"},"BritoQuerido2024":{"url":"https://doi.org/10.1038/s41580-023-00624-9","cite":"Brito Querido J., Díaz-López I., Ramakrishnan V. The molecular basis of translation initiation and its regulation in eukaryotes. Nat Rev Mol Cell Biol. 2024;25:168–186","doi":"10.1038/s41580-023-00624-9","pmid":""},"Janzen2004":{"url":"https://doi.org/10.1093/nar/gkh791","cite":"Janzen D. M., Geballe A. P. The effect of eukaryotic release factor depletion on translation termination in human cell lines. Nucleic Acids Res. 2004;32:4491–4502","doi":"10.1093/nar/gkh791","pmid":"15326224"},"Wu2026":{"url":"https://doi.org/10.1073/pnas.2517258123","cite":"Wu X., Zhang H., Huang L. et al. Cotranslational assembly directs the biogenesis of the m6A methyltransferase complex. Proc Natl Acad Sci USA. 2026;123:e2517258123","doi":"10.1073/pnas.2517258123","pmid":"41481436"}},"questions":["Код и рамка считывания","тРНК и аминоацилирование","Рибосомный цикл","Состояние продукта"],"exam_ids":["genetic-code","reading-frame","sequence-changes","codon-anticodon","synthetases","two-steps","ribosome","initiation","elongation-cycle","termination-polysome","folding-chaperones","quality-control"],"practice_url":"seminar-10.html","open_questions":[]};
/* Объяснения к семинару 10. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => s.replace(/(шаге? )?БИО-10·(\d+)((?:, 10·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
const rt = s => stepRefs(esc(s)).replace(/\[\[(T\d{2,3})\|([^\]]+)\]\]/g, (_, id, t) => `<a class="gl" href="#glossary-S10-${id}" data-gloss="S10-${id}">${t}</a>`)
  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */

/* v1.8: запоминаем, где читатель остановился. iPhone и встроенные браузеры при возврате в приложение перезагружают страницу по исходному адресу

const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');

const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);

const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {

  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};
const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;

/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);

function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

/* ---------- оглавление ---------- */
const hay = l => [l.title, l.lead.join(' '), l.paragraphs.map(p => typeof p === 'string' ? p : p.h || ((p.details || '') + ' ' + (p.text || ''))).join(' '), l.quiz.question, ...(l.keywords || [])].join(' ').toLowerCase();
function renderNav() {

  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  const BL = CONTENT.lessons.filter(l => l.level !== 'adv'), nb = BL.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;   /* базовые шаги (курс «Биология», А1-22) */

    `<div class="exam-stat">${esc(U.exam_stat_label)}: <b>${exOk} ${esc(U.of)} ${CONTENT.exam_ids.length}</b>${exTries ? ` · ${esc(fmt(U.exam_tries, {n: exTries}))}` : ''}</div>` +
    (U.base_progress && BL.length < N ? `<div class="base-stat">${esc(U.base_progress)}: <b>${nb} ${esc(U.of)} ${BL.length}</b></div>` : '') +
    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {

    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${ncap(s.title)}</div>` + ls.map(l => {

function navigate(id) {

  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  saveLast(want, 0);
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);

function renderLesson(l) {

  const nb = U.next_base ? CONTENT.lessons.findIndex((x, k) => k > i && x.level !== 'adv') : -1;
  const nbBtn = nb > i + 1 ? `<button id="nextbase">${esc(U.next_base)}</button>` : '';

    `<nav class="jump" aria-label="${esc(U.jump_label)}"><a href="#" data-jump="widget">${esc(U.jump_scheme)}</a><a href="#" data-jump="reading">${esc(U.jump_text)}</a><a href="#" data-jump="quiz-${l.id}">${esc(U.jump_quiz)}</a><a href="#" data-jump="src-${l.id}">${esc(U.jump_src)}</a></nav>` +
    `<section class="widget" id="widget" aria-labelledby="widget-title"><div class="status" id="widget-status"></div><h2 id="widget-title"></h2><div id="widget-controls"></div>${U.zoom_in ? `<button type="button" class="zoom-btn" id="widget-zoom" aria-pressed="false" aria-controls="widget-drawing">${esc(U.zoom_in)}</button>` : ''}<div id="widget-drawing"></div><div id="widget-result" aria-live="polite"></div></section>` +
    `<h2>${esc(U.what_happens)}</h2><div class="mechanism">${l.mechanism.map(x => `<div>${rt(x)}</div>`).join('')}</div>` +
    `<div class="reading" id="reading">${paragraphsHtml(l)}</div>` +
    `` +

    `<div class="next-row"><button id="prev"${i === 0 ? ' disabled' : ''}>${esc(U.prev)}</button>${nbBtn}<button class="primary" id="next">${esc(i < N - 1 ? U.next : U.to_exam)}</button></div><footer>${esc(U.footer_lesson)}</footer>`;
  if (nb > i + 1) $('nextbase').onclick = () => navigate(CONTENT.lessons[nb].id);

  $('next').onclick = () => navigate(i < N - 1 ? CONTENT.lessons[i + 1].id : 'exam');

  bindQuiz(l); initWidget(l);
  /* каркас с 23.10.2026 (из сем. 9; включается ключами ui.zoom_in/zoom_out/zoom_area, как «Увеличить схему» в практикумах): на телефоне схему можно увеличить и прокручивать в её рамке */
  const zb = $('widget-zoom');

  if (zb && l.widget && l.widget.zoomNarrow && window.matchMedia && matchMedia('(max-width:700px)').matches) zb.click();
}
function initWidget(l) {

}

/* =====================================================================
   s0_gn.js — общие детали схем семинара 9 «Транскрипция и процессинг пре-мРНК». Общие для практикума и «Объяснений».
   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;
   оранжевая — РНК; фиолетовый овал — РНК-полимераза II; на генах и мРНК: тёмная заливка — кодирующий участок,
   светлая — нетранслируемая область (НТО), тонкая линия — интрон; красный кружок m⁷G — кэп; «AAAA» — поли(А)-хвост.
   Ядерная оболочка — две мембраны (каждая — липидный бислой) с ядерной порой. Это схемы, не химические формулы.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t()). Группы data-g — справка (gn_<g>, g_<g>).
   GN.seq — преобразования последовательностей (чистые функции, проверяются тестом tests9/models.mjs).
   ===================================================================== */
const GN = (function () {
  const C = { tpl: '#1F3B73', cod: '#8AA0BF', rna: '#E8912A', rnaL: '#F6D7AE', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',
    bad: '#C0392B', warn: '#C77700', ok: '#2E9B57', pol: '#7C4DBE', tfd: '#2C7FB8', tfb: '#4E9AC7', tfh: '#1F8A8A', tfo: '#6C8FB0',
    med: '#8A5A12', act: '#B85C00', cap: '#B03A2E', cpa: '#3D5A99', spl: '#2E9B57', exp: '#1F8A8A', xrn: '#6A3FA0',
    cds: '#4F86C6', utr: '#BBD0EA', mem: '#9C8F6E', memH: '#C9B98F', panel: '#F4F7FA', line: '#D3DAE3', nuc: '#FBF8F1', cyt: '#F3F7FB' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* подпись: anchor m — по центру, l — слева, r — справа; o.w — жирность, o.size, o.col; o.bg — белая подложка.
     Цвет повторён в style: правило оболочки «Объяснений» .widget svg text{fill:var(--ink)} перекрывало атрибут fill,
     и цветные подписи (красные замены, зелёный старт-кодон) в «Объяснениях» становились чёрными (семинар 10, v1.0). */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a};fill:${o.col || C.ink}"${o.it ? ' font-style="italic"' : ''}${o.mono ? ' font-family="ui-monospace,Menlo,Consolas,monospace"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function textN(x, y, s, o = {}) { return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join(''); }
  function panel(x, y, w, h, title, fill) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${fill || C.panel}" stroke="${C.line}"/>` + (title ? text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted }) : '');
  }
  function arrow(x1, y1, x2, y2, col = C.muted, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
    const p1 = [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], p2 = [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)];
    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* белок: скруглённый прямоугольник с короткой подписью; o.op — непрозрачность (полупрозрачный — этап не начат или деталь вынута) */
  function blob(x, y, w, h, col, g, label, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2)}" fill="${col}" opacity="${o.op != null ? o.op : .93}" stroke="#fff" stroke-width="1.5"${o.dash ? ' stroke-dasharray="4 3"' : ''}/>` +
      (label ? (() => { const op = o.dash ? 1 : Math.min(1, (o.op != null ? o.op : .93) / .93), tx = text(x, y + 1, label, { size: o.size || 12, w: 700, col: '#fff' });
        return op < .9 ? `<g opacity="${f(op)}">${tx}</g>` : tx; })() : ''));   /* v1.2 (рецензия интерактива И-13): без «призраков» подписей у ещё не появившихся факторов */
  }
  /* красный крест: этап, на котором процесс остановился */
  function cross(x, y, r = 9) { return `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`; }

  /* ---------- последовательности ---------- */
  const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G', U: 'A' };
  const seq = {
    comp: s => s.split('').map(c => PAIR[c]).join(''),          /* комплементарная цепь, записанная под исходной (в обратной ориентации) */
    rev: s => s.split('').reverse().join(''),
    revcomp: s => seq.rev(seq.comp(s)),                          /* комплементарная цепь, записанная 5′→3′ */
    toRNA: s => s.replace(/T/g, 'U'),
    /* единица транскрипции на участке: top — верхняя цепь 5′→3′ слева направо; u = { a, b, dir: '+' (вправо) | '-' (влево) } */
    unit(top, u) {
      const part = top.slice(u.a, u.b + 1);
      const tplStrand = u.dir === '+' ? 'bot' : 'top', codStrand = u.dir === '+' ? 'top' : 'bot';
      const rna = seq.toRNA(u.dir === '+' ? part : seq.revcomp(part));             /* РНК 5′→3′ */
      const tpl35 = u.dir === '+' ? seq.comp(part) : seq.rev(part);                 /* матрица, записанная 3′→5′ (по ходу синтеза) */
      return { tplStrand, codStrand, rna, tpl35, len: part.length };
    },
  };

  /* ---------- двойная цепь ДНК с буквами ----------
     d: { x, y, dx, top, bot (bot — комплементарна top), tplStrand: 'top' | 'bot' | null, from, to — выделенный участок,
          lbl: true — концевые 5′/3′, size — размер букв, bubble: [a, b] — расплетённый участок (цепи расходятся) } */
  function duplex(d) {
    const n = d.top.length, dx = d.dx || 30, x0 = d.x, y = d.y, gap = d.gap || 26, X = i => x0 + i * dx;
    const sz = d.size || 14, bw = Math.min(22, dx - 4), bh = sz + 6;
    const colT = d.tplStrand === 'top' ? C.tpl : C.cod, colB = d.tplStrand === 'bot' ? C.tpl : C.cod;
    const gT = d.tplStrand === 'top' ? 'template' : d.tplStrand ? 'coding' : 'dna', gB = d.tplStrand === 'bot' ? 'template' : d.tplStrand ? 'coding' : 'dna';
    const bub = d.bubble, open = i => bub && i >= bub[0] && i <= bub[1];
    const yT = i => y - gap - (open(i) ? (d.open || 10) : 0), yB = i => y + gap + (open(i) ? (d.open || 10) : 0);
    let s = '';
    /* остовы: ломаная, чтобы показать расплетённый участок */
    const pathOf = yy => { let p = `M${f(X(0) - dx * .45)},${f(yy(0))}`; for (let i = 0; i < n; i++) p += ` L${f(X(i))},${f(yy(i))}`; return p + ` L${f(X(n - 1) + dx * .45)},${f(yy(n - 1))}`; };
    s += G(gT, `<path d="${pathOf(yT)}" fill="none" stroke="${colT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    s += G(gB, `<path d="${pathOf(yB)}" fill="none" stroke="${colB}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    for (let i = 0; i < n; i++) {
      const x = X(i), hl = d.from != null && i >= d.from && i <= d.to;
      if (!open(i)) s += line(x, yT(i) + bh / 2 + 3, x, yB(i) - bh / 2 - 3, C.rung, 1.4, 'stroke-dasharray="2.5 2.5"');
      s += baseL(x, yT(i) + (bh / 2 + 3), d.top[i], hl ? 'hl' : null, bw, bh, sz) + baseL(x, yB(i) - (bh / 2 + 3), d.bot[i], hl ? 'hl' : null, bw, bh, sz);
    }
    if (d.lbl !== false) {
      const ls = { size: 12.5, w: 700 };
      s += text(X(0) - dx * .45 - 6, yT(0), '5′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yT(n - 1), '3′', Object.assign({ a: 'l' }, ls));
      s += text(X(0) - dx * .45 - 6, yB(0), '3′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yB(n - 1), '5′', Object.assign({ a: 'l' }, ls));
    }
    return s;
  }
