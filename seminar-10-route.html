она тРНК изолейцина — в этой позиции неканоническая пара не допускается, и тРНК изолейцина не удерживается. Кодон декодирует тРНК валина, и включается валин.","s2_cap_ok_val_z":"Отбор тРНК на рибосоме идёт по спариванию антикодона с кодоном, строже всего — в первых двух позициях. Кодон валина не зависит от синтетазы изолейцина.","s2_cap_nosyn_ile":"Без изолейцил-тРНК-синтетазы тРНК изолейцина остаётся без аминокислоты: её антикодон по-прежнему соответствует кодону, но доставлять ей нечего, и на кодоне изолейцина синтез не продолжается.","s2_cap_nosyn_ile_z":"Для каждой аминокислоты в цитозоле клеток человека есть своя синтетаза; она соединяет аминокислоту со всеми тРНК этой аминокислоты. Без неё кодоны этой аминокислоты не декодируются.","s2_cap_noatp_ile":"Без АТФ изолейцин не активируется (не образуется изолейциладенилат) и не присоединяется к тРНК. Аминоацил-тРНК нет — синтез на кодоне изолейцина не продолжается.","s2_cap_noatp_ile_z":"Аминоацилирование требует энергии АТФ: она запасается в сложноэфирной связи аминокислоты с тРНК и затем используется при образовании пептидной связи.","s2_cap_noatp_val":"Без АТФ не заряжается ни одна тРНК, в том числе тРНК валина: на кодоне GUC синтез тоже не продолжается.","s2_cap_noatp_val_z":"АТФ нужен всем аминоацил-тРНК-синтетазам, а сама синтетаза специфична к одной аминокислоте.","s2_tl_1":"Синтетаза связывает аминокислоту и АТФ и образует аминоациладенилат.","s2_tl_1v":"Без синтетазы изолейцина тРНК изолейцина не заряжается; тРНК валина заряжает своя синтетаза.","s2_tl_2":"Аминокислота переносится на 3′-конец тРНК (CCA); получается аминоацил-тРНК.","s2_tl_2v":"тРНК изолейцина остаётся незаряженной; тРНК валина заряжает своя синтетаза (на схеме не показана).","s2_tl_3":"Аминоацил-тРНК входит в A-сайт; антикодон спаривается с кодоном антипараллельно, в третьей позиции допускается пара G·U.","s2_tl_3v":"Против G первой позиции кодона GUC у тРНК изолейцина стоит U: в первой позиции пара G·U не допускается, тРНК изолейцина не удерживается, и кодон декодирует тРНК валина.","s2_tl_4":"Аминокислота включается в полипептид; рибосома проверяет пару кодон — антикодон, но не аминокислоту.","s2_tl_stop_syn":"Остановка на этапе 1: без изолейцил-тРНК-синтетазы изолейцин не присоединяется к тРНК — тРНК изолейцина остаётся незаряженной.","s2_tl_stop_atp":"Остановка на этапе 1: без АТФ аминокислота не активируется — ни одна тРНК не заряжается.","s2_lbl_same_codon":"тот же кодон"},"notes":["Изолейцин присоединён к тРНК.","Без синтетазы тРНК остаётся без аминокислоты.","Без АТФ изолейцин не активируется."],"static":["Изолейцин присоединён к тРНК."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E05","question":"Какую реакцию катализирует аминоацил-тРНК-синтетаза?","options":[{"id":"S10-E05-1","text":"Образует пептидную связь между двумя аминокислотами","correct":false,"feedback":"Пептидную связь образует пептидилтрансферазный центр рибосомы."},{"id":"S10-E05-2","text":"Присоединяет аминокислоту к 3′-концу своей тРНК","correct":true,"feedback":"Сначала образуется аминоациладенилат, затем аминокислота переносится на тРНК."},{"id":"S10-E05-3","text":"Спаривает антикодон тРНК с кодоном мРНК","correct":false,"feedback":"Спаривание антикодона с кодоном происходит в декодирующем центре рибосомы."}]}},{"id":"two-steps","section":1,"questions":[2],"title":"Соответствие кодона и аминокислоты закрепляется при аминоацилировании","keywords":["два этапа","декодирование","аминокислоту рибосома не проверяет","ошибка аминоацилирования","ошибка декодирования"],"lead":["Уже известно: синтетаза соединяет аминокислоту с тРНК, антикодон спаривается с кодоном (БИО-10·8, 10·9).","Новое: на каком из этих этапов проверяется, та ли аминокислота встанет в белок."],"mechanism":["Первый этап — аминоацилирование: синтетаза узнаёт и аминокислоту, и тРНК.","Второй этап — декодирование на рибосоме: проверяется только спаривание антикодона с кодоном, а не аминокислота на другом конце тРНК.","Поэтому если тРНК заряжена неправильной аминокислотой, рибосома встроит её туда, где антикодон спаривается с кодоном.","Итоговая точность трансляции зависит от обоих этапов; в целом ошибается примерно одна аминокислота на 10 000."],"paragraphs":["Ошибки разных этапов различаются по характеру. Ошибка аминоацилирования систематическая по типу: одна и та же замена (например, валин вместо изолейцина) встречается на местах этой аминокислоты во многих белках. Ошибка декодирования разрозненная: разные места, разные аминокислоты.","Эти ошибки не меняют ни ДНК, ни мРНК: они затрагивают отдельные молекулы белка ([[T65|ошибка трансляции]]) и, в отличие от мутации, не передаются дочерним клеткам."],"conditions":"Мысленный эксперимент по модели вкладки 2.","sources":["Alberts2022"],"quiz":{"id":"S10-L10","question":"Почему ошибку синтетазы рибосома не исправляет?","options":[{"id":"S10-L10-1","text":"Рибосома проверяет только пару кодон — антикодон, а она правильная","correct":true,"feedback":"Аминокислоту рибосома не проверяет; ошибку исправляет корректирующая активность синтетазы."},{"id":"S10-L10-2","text":"Рибосома заменяет аминокислоту при транслокации","correct":false,"feedback":"При транслокации рибосома сдвигается на кодон; аминокислоту она не проверяет."},{"id":"S10-L10-3","text":"Синтетазы не ошибаются, поэтому такой тРНК не бывает","correct":false,"feedback":"Синтетазы изредка ошибаются, а рибосома не проверяет аминокислоту."}]},"widget":{"kind":"dna","title":"","s":{"title":"Ошибка аминоацилирования","status":"Учебная модель · частоты условные","modes_label":"Что показать","modes":["синтетаза с коррекцией","без коррекции"],"scene":"a2","args":[["on","norm","norm"],["off","norm","norm"]],"L":{"a2_pA":"А. мРНК (5′→3′)","a2_lbl_mrna_hidden":"последовательность мРНК и гена не исследована","a2_lbl_ile":"Ile","a2_pB":"Б. 10 молекул продукта (красным — замены)","a2_lbl_mol":"{n}","a2_lbl_count":"В. Итог. Замен: {n} · на местах изолейцина: {i} · в других местах: {o}","a2_lbl_inv":"В. Итог. В позиции 6 валин вместо изолейцина в {n} из 10 молекул; другие позиции не исследованы","a2_lbl_pool":"тРНК изолейцина после аминоацилирования (условно 10 молекул; доля с валином — допущение модели)"},"notes":["Замен нет.","Валин на местах изолейцина в части молекул."],"static":["Замен нет."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E06","question":"Синтетаза ошибочно присоединила к тРНК лейцина метионин. Что произойдёт на рибосоме?","options":[{"id":"S10-E06-1","text":"Рибосома отбракует такую тРНК","correct":false,"feedback":"Антикодон тРНК правильный, и проверка спаривания проходит."},{"id":"S10-E06-2","text":"тРНК спарится с кодоном метионина","correct":false,"feedback":"Антикодон определяет, с каким кодоном спарится тРНК; он остался антикодоном тРНК лейцина."},{"id":"S10-E06-3","text":"Метионин встанет на место лейцина","correct":true,"feedback":"Рибосома проверяет пару кодон — антикодон, а не аминокислоту. Поэтому соответствие кодона и аминокислоты закрепляется при аминоацилировании."}]}},{"id":"mischarged-trna","section":1,"questions":[2],"title":"Правильное спаривание не гарантирует правильной аминокислоты: три источника одной замены","keywords":["ошибочно заряженная тРНК","изменение мРНК","ошибка декодирования","распределение замен","обратная задача"],"lead":["Уже известно: аминокислоту на тРНК рибосома не проверяет (БИО-10·10).","Новое: как по распределению замен в продуктах отличить ошибку нуклеиновой кислоты, ошибку аминоацилирования и ошибку декодирования — и где такой вывод заканчивается."],"mechanism":["Изменение последовательности мРНК (например, AUC → GUC в кодоне 6) даёт одну и ту же замену в одной позиции у всех молекул, транслированных с этой мРНК.","Ошибка аминоацилирования (валин на тРНК изолейцина при нарушенной коррекции) может вызывать однотипные замены в разных белках, содержащих изолейцин, — в части молекул, если при трансляции используется неправильно аминоацилированная тРНК.","Ошибка декодирования даёт разрозненные замены — в разных местах, разные аминокислоты.","Корректирующая активность синтетаз удаляет большую часть ошибочно присоединённых аминокислот, поэтому не всякая ошибка активации доходит до белка."],"paragraphs":["Обратная задача модели: в части молекул белка в позиции 6 стоит валин вместо изолейцина, а другие позиции не исследованы. Это совместимо и с ошибкой синтетазы, и с изменением одной из двух копий гена, и (реже) со случайными ошибками. Различат их распределение валина по другим местам изолейцина и в других белках, последовательность мРНК и гена, активность синтетазы.","Модель условная: частоты ошибок увеличены во много раз, чтобы их было видно на десяти молекулах.","Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: 10 условных молекул из 11 аминокислот; изолейцин — в позициях 3, 6 и 10.","sources":["Alberts2022"],"quiz":{"id":"S10-L11","question":"Во многих белках клетки встречается одна и та же замена: валин на местах изолейцина, в части молекул. Последовательности генов не изменены. Какая причина наиболее вероятна?","options":[{"id":"S10-L11-1","text":"Мутация гена одного из этих белков","correct":false,"feedback":"Мутация одного гена не объясняет замены во многих белках, а гены не изменены."},{"id":"S10-L11-2","text":"Нарушена корректирующая активность синтетазы","correct":true,"feedback":"Замена одного типа на местах одной аминокислоты во многих белках указывает на ошибку аминоацилирования."},{"id":"S10-L11-3","text":"Случайные ошибки декодирования на рибосоме","correct":false,"feedback":"Ошибки декодирования разрозненные: разные места и разные аминокислоты."}]},"widget":{"kind":"dna","title":"","s":{"title":"Три источника замены","status":"Учебная модель · частоты условные","modes_label":"Что показать","modes":["изменён кодон 6","без коррекции","ошибки декодирования","обратная задача"],"scene":"a2","args":[["on","norm","gene"],["off","norm","norm"],["on","low","norm"],["off","norm","norm","inv"]],"L":{"a2_pA":"А. мРНК (5′→3′)","a2_lbl_mrna_hidden":"последовательность мРНК и гена не исследована","a2_lbl_ile":"Ile","a2_pB":"Б. 10 молекул продукта (красным — замены)","a2_lbl_mol":"{n}","a2_lbl_count":"В. Итог. Замен: {n} · на местах изолейцина: {i} · в других местах: {o}","a2_lbl_inv":"В. Итог. В позиции 6 валин вместо изолейцина в {n} из 10 молекул; другие позиции не исследованы","a2_lbl_pool":"тРНК изолейцина после аминоацилирования (условно 10 молекул; доля с валином — допущение модели)"},"notes":["Валин в позиции 6 у всех молекул.","Валин на местах изолейцина в части молекул.","Разрозненные разные замены.","Валин в позиции 6 в части молекул; другие позиции не исследованы."],"static":["Валин в позиции 6 у всех молекул."]},"zoomNarrow":true},"level":"adv"},{"id":"editing-mitochondria","section":1,"questions":[2],"title":"Без корректирующей активности синтетазы серин встаёт на места треонина в белках митохондрий","keywords":["корректирующая активность","митохондрии","треонил-тРНК-синтетаза","серин","клетки мыши"],"lead":["Уже известно: корректирующая активность синтетазы удаляет ошибочно присоединённые аминокислоты (БИО-10·9).","Новое: что происходит, если корректирующий центр синтетазы выключить, — на примере митохондрий."],"mechanism":["В клетках мыши в корректирующем центре митохондриальной треонил-тРНК-синтетазы заменили две аминокислоты.","Около 3,4 % митохондриальной тРНК треонина оказалось ошибочно заряжено серином; в клетках с нормальным ферментом такой тРНК не нашли.","Рибосомы митохондрий встраивали серин на места треонина: в 10 исследованных белках, синтезируемых в митохондриях, на 81 кодон треонина нашли 16 замен — в 7 белках (авторы оценивают долю замен примерно в 20 % и просят осторожности: исследованных участков белков немного).","Работа дыхательной цепи нарушалась, клетки делились медленнее и чаще задерживались в фазе G0/G1; у мышей с таким дефектом в сердце развивалась кардиомиопатия."],"paragraphs":["Как это узнали: в клетках мыши изменили ген синтетазы и определили, какие аминокислоты стоят в белках митохондрий; у мышей дефект создали только в клетках сердца.","Граница вывода: работа показывает, что ошибочно заряженная тРНК используется рибосомой, когда коррекция нарушена, и что митохондриям нужна высокая точность трансляции. Она не говорит, сколько таких ошибок бывает в норме, и описывает одну синтетазу в одной системе.","Связанная модель — в практикуме: вопрос 2, уровень «Продвинутый» (правильное спаривание не гарантирует правильной аминокислоты); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Фибробласты мыши (линия NIH3T3) и мыши с дефектом в клетках сердца.","sources":["Zheng2023"],"quiz":{"id":"S10-L12","question":"Почему серин оказался именно на местах треонина?","options":[{"id":"S10-L12-1","text":"Изменились кодоны треонина в мРНК","correct":false,"feedback":"Изменён ген синтетазы, а не кодоны белков."},{"id":"S10-L12-2","text":"Рибосома путает кодоны треонина и серина","correct":false,"feedback":"Ошибка возникла при аминоацилировании, а не при декодировании."},{"id":"S10-L12-3","text":"Серин присоединялся к тРНК треонина","correct":true,"feedback":"Рибосома проверяет антикодон, а не аминокислоту."}]},"widget":{"kind":"dna","title":"","s":{"title":"Ошибка аминоацилирования в модели","status":"Учебная модель · частоты условные","modes_label":"Что показать","modes":["без коррекции"],"scene":"a2","args":[["off","norm","norm"]],"L":{"a2_pA":"А. мРНК (5′→3′)","a2_lbl_mrna_hidden":"последовательность мРНК и гена не исследована","a2_lbl_ile":"Ile","a2_pB":"Б. 10 молекул продукта (красным — замены)","a2_lbl_mol":"{n}","a2_lbl_count":"В. Итог. Замен: {n} · на местах изолейцина: {i} · в других местах: {o}","a2_lbl_inv":"В. Итог. В позиции 6 валин вместо изолейцина в {n} из 10 молекул; другие позиции не исследованы","a2_lbl_pool":"тРНК изолейцина после аминоацилирования (условно 10 молекул; доля с валином — допущение модели)"},"notes":["Модель вкладки 2: валин на тРНК изолейцина встаёт на места изолейцина."],"static":["Модель вкладки 2: валин на тРНК изолейцина встаёт на места изолейцина."]},"zoomNarrow":true},"level":"adv"},{"id":"ribosome","section":2,"questions":[3],"title":"Рибосома: две субчастицы и три участка связывания тРНК","keywords":["рибосома 80S","малая субчастица 40S","большая субчастица 60S","рРНК","A-сайт","P-сайт","E-сайт","рибозим"],"lead":["Уже известно: рибосомы состоят из рРНК и белков; рРНК синтезируется, а субчастицы рибосом собираются в ядрышке.","Новое: как устроена рибосома и где в ней происходит декодирование и образование пептидной связи.","Раздел относится к вопросу 13 коллоквиума 2 (предварительный список) и вопросу 22 зачёта."],"mechanism":["[[T26|Рибосома]] эукариот (80S) состоит из [[T27|малой (40S)]] и [[T28|большой (60S)]] субчастиц; каждая — комплекс рРНК и многих белков. Вне трансляции субчастицы разделены и объединяются на мРНК при инициации.","В малой субчастице находится декодирующий центр: здесь антикодон тРНК спаривается с кодоном, и рРНК проверяет правильность пар в первых двух позициях.","В большой субчастице находится [[T32|пептидилтрансферазный центр]]: его образует рРНК — рибосома является рибозимом. Растущая цепь выходит через туннель большой субчастицы.","Три участка связывания тРНК при записи мРНК 5′→3′ слева направо расположены так: [[g:siteE|E]] — [[g:siteP|P]] — [[g:siteA|A]] (в отечественных учебниках — Е-, П- и А-сайты, или центры: П — пептидильный, А — аминоацильный). В A-сайт входит аминоацил-тРНК, в P-сайте находится тРНК с растущей цепью, через E-сайт тРНК без аминокислоты покидает рибосому."],"paragraphs":["Рибосомные белки в основном находятся на поверхности и стабилизируют структуру рРНК; химию образования пептидной связи обеспечивает рРНК.","Обозначения сайтов: A — аминоацильный, P — пептидильный (от пептидил-тРНК), E — выходной."],"conditions":"Схема шага — модель вкладки 3: рибосома на мРНК 5′…AUG CAC UGG GAA UGA…3′.","sources":["Alberts2022"],"quiz":{"id":"S10-L13","question":"В каком порядке расположены участки связывания тРНК, если мРНК записана от 5′ к 3′ слева направо?","options":[{"id":"S10-L13-1","text":"E — P — A","correct":true,"feedback":"A-сайт ближе к 3′-концу: в него входит тРНК для следующего кодона."},{"id":"S10-L13-2","text":"A — P — E","correct":false,"feedback":"Порядок обратный: следующий кодон находится с 3′-стороны, над ним — A-сайт."},{"id":"S10-L13-3","text":"P — A — E","correct":false,"feedback":"Растущая цепь на тРНК в P-сайте, новая аминоацил-тРНК — в A-сайте с 3′-стороны, E — с 5′-стороны."}]},"widget":{"kind":"dna","title":"","s":{"title":"Рибосома на мРНК","status":"Схема качественная","modes_label":"Что показать","modes":["вход в A","транслокация"],"scene":"s3b","args":[["2","all"],["4","all"]],"L":{"s3_st":"Этап","s3_st_1":"1 инициация","s3_st_2":"2 вход в A","s3_st_3":"3 пептидная связь","s3_st_4":"4 транслокация","s3_st_5":"5 стоп в A","s3_st_6":"6 терминация","s3_comp":"Детали","s3_comp_all":"все есть","s3_comp_noeef2":"нет eEF2","s3_comp_noerf1":"нет eRF1","s3_ctrl_note":"Цитоплазма клетки человека. мРНК: 5′…AUG CAC UGG GAA UGA…3′ (метионин, гистидин, триптофан, глутаминовая кислота, стоп-кодон). Этапы — моменты одного прохода рибосомы в учебной последовательности: 1 — рибосома собрана на старт-кодоне; 2–4 — первый цикл элонгации; 5 — ещё два таких цикла пройдены; 6 — терминация. eEF2 — фактор транслокации, eRF1 — фактор терминации; их можно убрать.","s3_pA":"А. Рибосома 80S на мРНК: участки E, P и A","s3_pB":"Б. Что происходит на этом этапе","s3_lbl_large":"большая субчастица (60S)","s3_lbl_small":"малая субчастица (40S)","s3_lbl_released":"полипептид освобождён","s3_lbl_noeef2":"нет eEF2: в модели транслокации нет","s3_lbl_noerf1":"нет eRF1: в модели стоп-кодон не узнан","s3_lbl_shift":"сдвиг на один кодон к 3′-концу","s3_ev_s1":"Инициация: малая субчастица с инициаторной Met-тРНК нашла\nстарт-кодон AUG, присоединилась большая субчастица.\nИнициаторная тРНК — в P-сайте, A-сайт свободен.","s3_ev_s2":"Вход аминоацил-тРНК: в свободный A-сайт вошла His-тРНК,\nеё антикодон спарился с кодоном CAC.\nМетионин — на тРНК в P-сайте.","s3_ev_s3":"Пептидная связь: метионин перенесён с тРНК в P-сайте\nна аминогруппу гистидина тРНК в A-сайте. Цепь Met–His —\nна тРНК в A-сайте; тРНК в P-сайте без аминокислоты.","s3_ev_s4":"Транслокация: рибосома сдвинулась на три нуклеотида к 3′-концу.\nтРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте\n(затем покинет рибосому); A-сайт свободен для кодона UGG.","s3_ev_s5":"Ещё два цикла элонгации добавили триптофан\nи глутаминовую кислоту. В A-сайте стоп-кодон UGA:\nтРНК, спаривающейся с ним, нет.","s3_ev_s6":"Терминация: eRF1 занял A-сайт; связь цепи с тРНК\nгидролизована, полипептид Met–His–Trp–Glu освобождён.\nЗатем субчастицы рибосомы разойдутся.","s3_ev_transloc":"В модели без eEF2 рибосома за время наблюдения не сдвигается:\nцепь Met–His остаётся на тРНК в A-сайте, кодон UGG\nне попадает в A-сайт, и цикл элонгации не повторяется.","s3_ev_term":"В модели без eRF1 стоп-кодон за время наблюдения\nне узнаётся: цепь Met–His–Trp–Glu остаётся связанной\nс тРНК в P-сайте, полипептид не освобождается.","s3_r_E":"E-сайт","s3_r_P":"P-сайт","s3_r_A":"A-сайт","s3_v_raw":"{s}","s3_v_empty":"свободен","s3_v_trna_aa":"{i} {a}-тРНК","s3_v_trna_chain":"тРНК {a} с цепью из {n} аминокислот","s3_v_trna_free":"{i} тРНК {a} без аминокислоты","s3_v_ini":"инициаторная","s3_v_erf1":"фактор терминации eRF1","s3_r_chain":"Полипептид","s3_r_chain_s":"где находится цепь","s3_v_chain_P":"{n} — на тРНК в P-сайте","s3_v_chain_A":"{n} — на тРНК в A-сайте","s3_v_chain_free":"{n} — освобождён","s3_r_codon":"Кодон в P-сайте","s3_r_codon_s":"номер кодона от старт-кодона","s3_v_codon":"{k}: {c}","s3_cap_s1":"Рибосома собрана на старт-кодоне: инициаторная тРНК с метионином спарена с AUG в P-сайте, A-сайт свободен и находится над следующим кодоном.","s3_cap_s1_z":"Инициаторная тРНК — единственная, которая входит в рибосому через P-сайт; все остальные аминоацил-тРНК, в том числе с метионином для внутренних кодонов AUG, входят в A-сайт.","s3_cap_s2":"Аминоацил-тРНК вошла в A-сайт: её доставляет фактор элонгации eEF1A вместе с ГТФ; удерживается только та тРНК, антикодон которой спарен с кодоном.","s3_cap_s2_z":"На этом этапе рибосома проверяет спаривание антикодона с кодоном — дважды, до и после гидролиза ГТФ; неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.","s3_cap_s3":"Пептидная связь: растущая цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте. Цепь удлинилась на один остаток у C-конца.","s3_cap_s3_z":"Реакцию катализирует пептидилтрансферазный центр большой субчастицы, образованный рРНК (рибосома — рибозим). Поэтому полипептид растёт от N- к C-концу.","s3_cap_s4":"Транслокация: рибосома продвинулась на один кодон к 3′-концу мРНК; тРНК из A-сайта перешла в P-сайт, из P-сайта — в E-сайт.","s3_cap_s4_z":"Сдвиг ровно на три нуклеотида сохраняет рамку считывания. Транслокацию обеспечивает фактор элонгации eEF2 за счёт гидролиза ГТФ.","s3_cap_s5":"После ещё двух циклов цепь из четырёх аминокислот — на тРНК в P-сайте, а в A-сайте стоп-кодон UGA. Ни одна тРНК не спаривается со стоп-кодоном.","s3_cap_s5_z":"Цикл элонгации одинаков для каждого кодона: вход аминоацил-тРНК, пептидная связь, транслокация.","s3_cap_s6":"Стоп-кодон в A-сайте узнаёт белковый фактор терминации eRF1. Связь цепи с тРНК гидролизуется (акцептором становится вода), и полипептид освобождается.","s3_cap_s6_z":"eRF1 узнаёт все три стоп-кодона; по форме он напоминает тРНК. После терминации субчастицы рибосомы расходятся и используются снова.","s3_cap_transloc":"В модели без фактора транслокации eEF2 за время наблюдения цикл не продолжается после образования пептидной связи: цепь — на тРНК в A-сайте, следующий кодон в A-сайт не попадает.","s3_cap_transloc_z":"Пока A-сайт занят, следующая аминоацил-тРНК войти не может: каждый шаг цикла зависит от завершения предыдущего. Остановка — допущение модели: в пробирке без факторов элонгации синтез возможен, но очень медленный, неэффективный и неточный.","s3_cap_term":"В модели без фактора терминации eRF1 стоп-кодон за время наблюдения остаётся в A-сайте, а полный полипептид — связанным с тРНК в P-сайте: он не освобождается, и рибосома не высвобождается.","s3_cap_term_z":"Нормальную терминацию запускает белковый фактор, а не тРНК. В клетках человека при нехватке eRF1 усиливается прочитывание стоп-кодона (англ. readthrough): тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется. Модель показывает только задержку освобождения полипептида.","s3_tl_1":"Инициация","s3_tl_2":"Вход аминоацил-тРНК в A-сайт","s3_tl_3":"Пептидная связь","s3_tl_4":"Транслокация","s3_tl_5":"Ещё два цикла; стоп-кодон в A-сайте","s3_tl_6":"Терминация","s3_tl_stop_eef2":"Остановка на этапе 4: в модели без eEF2 за время наблюдения транслокации нет — цепь Met–His остаётся на тРНК в A-сайте (в пробирке без факторов элонгации синтез идёт, но очень медленно и неточно).","s3_tl_stop_erf1":"Остановка на этапе 6: в модели без eRF1 за время наблюдения стоп-кодон UGA не узнаётся — полипептид остаётся на тРНК в P-сайте (в клетке возможно и прочитывание стоп-кодона).","s3_ev_cycW":"Ещё один цикл элонгации: Trp-тРНК входит в A-сайт\n(кодон UGG), пептидная связь, транслокация.","s3_ev_cycE":"Ещё один цикл элонгации: Glu-тРНК входит в A-сайт\n(кодон GAA), пептидная связь, транслокация."},"notes":["Аминоацил-тРНК в A-сайте, метионин на тРНК в P-сайте.","тРНК с цепью — в P, тРНК без аминокислоты — в E."],"static":["Аминоацил-тРНК в A-сайте, метионин на тРНК в P-сайте."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E07","question":"Где находится пептидилтрансферазный центр рибосомы и из чего он образован?","options":[{"id":"S10-E07-1","text":"В большой субчастице; его образует рРНК","correct":true,"feedback":"Рибосома — рибозим: каталитический центр образован РНК."},{"id":"S10-E07-2","text":"В малой субчастице; его образуют рибосомные белки","correct":false,"feedback":"В малой субчастице — декодирующий центр; пептидная связь образуется в большой."},{"id":"S10-E07-3","text":"В A-сайте; его образует аминоацил-тРНК","correct":false,"feedback":"A-сайт — участок связывания тРНК, а катализ обеспечивает рРНК большой субчастицы."}]}},{"id":"initiation","section":2,"questions":[3],"title":"Инициация: малая субчастица находит старт-кодон, инициаторная тРНК — в P-сайте","keywords":["инициация","кэп","eIF4F","сканирование","окружение старт-кодона","инициаторная тРНК","eIF2","рибосома 80S"],"lead":["Уже известно: зрелая мРНК несёт 5′-кэп и поли(А)-хвост ([[https://fresll.github.io/bio/seminar-9-route.html#capping|вспомнить БИО-9·14]]).","Новое: как рибосома находит старт-кодон и почему инициаторная тРНК оказывается в P-сайте."],"mechanism":["[[T33|Инициаторная тРНК]] с метионином вместе с фактором инициации eIF2 и ГТФ и другими [[T36|факторами инициации]] связывается с малой субчастицей ещё до её присоединения к мРНК.","Комплекс eIF4F узнаёт 5′-кэп и привлекает малую субчастицу к 5′-концу мРНК; поли(А)-связывающий белок, взаимодействуя с eIF4G, сближает концы мРНК и повышает эффективность инициации.","Малая субчастица движется по 5′-нетранслируемой области от 5′ к 3′ (сканирование); хеликаза eIF4A расплетает вторичную структуру.","Когда антикодон инициаторной тРНК спаривается со старт-кодоном AUG, сканирование останавливается, факторы уходят, присоединяется большая субчастица — образуется рибосома 80S. Инициаторная тРНК находится в P-сайте, A-сайт свободен для первой элонгаторной аминоацил-тРНК."],"paragraphs":["Узнавание старт-кодона зависит от [[T35|окружения]]: у позвоночных наиболее важны пурин (A или G) в положении −3 и G в положении +4 (A в AUG — положение +1). В слабом окружении часть малых субчастиц проходит первый AUG и начинает трансляцию со следующего.","Инициаторная тРНК отличается по последовательности от тРНК, несущей метионин для внутренних кодонов AUG: её узнают факторы инициации, и в A-сайт она не поступает.","Инициация — наиболее регулируемый этап трансляции: изменяя её, клетка меняет количество синтезируемого белка (семинар 11)."],"conditions":"Схема шага — модель вкладки 3, этап 1.","sources":["Alberts2022"],"quiz":{"id":"S10-L14","question":"Малая субчастица сканирует 5′-нетранслируемую область. Что остановит её на старт-кодоне?","options":[{"id":"S10-L14-1","text":"Связывание фактора терминации с мРНК","correct":false,"feedback":"Фактор терминации узнаёт стоп-кодоны в конце синтеза."},{"id":"S10-L14-2","text":"Спаривание антикодона инициаторной тРНК с AUG","correct":true,"feedback":"Инициаторная тРНК уже связана с малой субчастицей; узнавание AUG останавливает сканирование."},{"id":"S10-L14-3","text":"Первый же кодон после кэпа, каким бы он ни был","correct":false,"feedback":"Сканирование идёт до AUG, обычно первого в благоприятном окружении."}]},"widget":{"kind":"dna","title":"","s":{"title":"Рибосома на старт-кодоне","status":"Схема качественная","modes_label":"Что показать","modes":["инициация"],"scene":"s3b","args":[["1","all"]],"L":{"s3_st":"Этап","s3_st_1":"1 инициация","s3_st_2":"2 вход в A","s3_st_3":"3 пептидная связь","s3_st_4":"4 транслокация","s3_st_5":"5 стоп в A","s3_st_6":"6 терминация","s3_comp":"Детали","s3_comp_all":"все есть","s3_comp_noeef2":"нет eEF2","s3_comp_noerf1":"нет eRF1","s3_ctrl_note":"Цитоплазма клетки человека. мРНК: 5′…AUG CAC UGG GAA UGA…3′ (метионин, гистидин, триптофан, глутаминовая кислота, стоп-кодон). Этапы — моменты одного прохода рибосомы в учебной последовательности: 1 — рибосома собрана на старт-кодоне; 2–4 — первый цикл элонгации; 5 — ещё два таких цикла пройдены; 6 — терминация. eEF2 — фактор транслокации, eRF1 — фактор терминации; их можно убрать.","s3_pA":"А. Рибосома 80S на мРНК: участки E, P и A","s3_pB":"Б. Что происходит на этом этапе","s3_lbl_large":"большая субчастица (60S)","s3_lbl_small":"малая субчастица (40S)","s3_lbl_released":"полипептид освобождён","s3_lbl_noeef2":"нет eEF2: в модели транслокации нет","s3_lbl_noerf1":"нет eRF1: в модели стоп-кодон не узнан","s3_lbl_shift":"сдвиг на один кодон к 3′-концу","s3_ev_s1":"Инициация: малая субчастица с инициаторной Met-тРНК нашла\nстарт-кодон AUG, присоединилась большая субчастица.\nИнициаторная тРНК — в P-сайте, A-сайт свободен.","s3_ev_s2":"Вход аминоацил-тРНК: в свободный A-сайт вошла His-тРНК,\nеё антикодон спарился с кодоном CAC.\nМетионин — на тРНК в P-сайте.","s3_ev_s3":"Пептидная связь: метионин перенесён с тРНК в P-сайте\nна аминогруппу гистидина тРНК в A-сайте. Цепь Met–His —\nна тРНК в A-сайте; тРНК в P-сайте без аминокислоты.","s3_ev_s4":"Транслокация: рибосома сдвинулась на три нуклеотида к 3′-концу.\nтРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте\n(затем покинет рибосому); A-сайт свободен для кодона UGG.","s3_ev_s5":"Ещё два цикла элонгации добавили триптофан\nи глутаминовую кислоту. В A-сайте стоп-кодон UGA:\nтРНК, спаривающейся с ним, нет.","s3_ev_s6":"Терминация: eRF1 занял A-сайт; связь цепи с тРНК\nгидролизована, полипептид Met–His–Trp–Glu освобождён.\nЗатем субчастицы рибосомы разойдутся.","s3_ev_transloc":"В модели без eEF2 рибосома за время наблюдения не сдвигается:\nцепь Met–His остаётся на тРНК в A-сайте, кодон UGG\nне попадает в A-сайт, и цикл элонгации не повторяется.","s3_ev_term":"В модели без eRF1 стоп-кодон за время наблюдения\nне узнаётся: цепь Met–His–Trp–Glu остаётся связанной\nс тРНК в P-сайте, полипептид не освобождается.","s3_r_E":"E-сайт","s3_r_P":"P-сайт","s3_r_A":"A-сайт","s3_v_raw":"{s}","s3_v_empty":"свободен","s3_v_trna_aa":"{i} {a}-тРНК","s3_v_trna_chain":"тРНК {a} с цепью из {n} аминокислот","s3_v_trna_free":"{i} тРНК {a} без аминокислоты","s3_v_ini":"инициаторная","s3_v_erf1":"фактор терминации eRF1","s3_r_chain":"Полипептид","s3_r_chain_s":"где находится цепь","s3_v_chain_P":"{n} — на тРНК в P-сайте","s3_v_chain_A":"{n} — на тРНК в A-сайте","s3_v_chain_free":"{n} — освобождён","s3_r_codon":"Кодон в P-сайте","s3_r_codon_s":"номер кодона от старт-кодона","s3_v_codon":"{k}: {c}","s3_cap_s1":"Рибосома собрана на старт-кодоне: инициаторная тРНК с метионином спарена с AUG в P-сайте, A-сайт свободен и находится над следующим кодоном.","s3_cap_s1_z":"Инициаторная тРНК — единственная, которая входит в рибосому через P-сайт; все остальные аминоацил-тРНК, в том числе с метионином для внутренних кодонов AUG, входят в A-сайт.","s3_cap_s2":"Аминоацил-тРНК вошла в A-сайт: её доставляет фактор элонгации eEF1A вместе с ГТФ; удерживается только та тРНК, антикодон которой спарен с кодоном.","s3_cap_s2_z":"На этом этапе рибосома проверяет спаривание антикодона с кодоном — дважды, до и после гидролиза ГТФ; неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.","s3_cap_s3":"Пептидная связь: растущая цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте. Цепь удлинилась на один остаток у C-конца.","s3_cap_s3_z":"Реакцию катализирует пептидилтрансферазный центр большой субчастицы, образованный рРНК (рибосома — рибозим). Поэтому полипептид растёт от N- к C-концу.","s3_cap_s4":"Транслокация: рибосома продвинулась на один кодон к 3′-концу мРНК; тРНК из A-сайта перешла в P-сайт, из P-сайта — в E-сайт.","s3_cap_s4_z":"Сдвиг ровно на три нуклеотида сохраняет рамку считывания. Транслокацию обеспечивает фактор элонгации eEF2 за счёт гидролиза ГТФ.","s3_cap_s5":"После ещё двух циклов цепь из четырёх аминокислот — на тРНК в P-сайте, а в A-сайте стоп-кодон UGA. Ни одна тРНК не спаривается со стоп-кодоном.","s3_cap_s5_z":"Цикл элонгации одинаков для каждого кодона: вход аминоацил-тРНК, пептидная связь, транслокация.","s3_cap_s6":"Стоп-кодон в A-сайте узнаёт белковый фактор терминации eRF1. Связь цепи с тРНК гидролизуется (акцептором становится вода), и полипептид освобождается.","s3_cap_s6_z":"eRF1 узнаёт все три стоп-кодона; по форме он напоминает тРНК. После терминации субчастицы рибосомы расходятся и используются снова.","s3_cap_transloc":"В модели без фактора транслокации eEF2 за время наблюдения цикл не продолжается после образования пептидной связи: цепь — на тРНК в A-сайте, следующий кодон в A-сайт не попадает.","s3_cap_transloc_z":"Пока A-сайт занят, следующая аминоацил-тРНК войти не может: каждый шаг цикла зависит от завершения предыдущего. Остановка — допущение модели: в пробирке без факторов элонгации синтез возможен, но очень медленный, неэффективный и неточный.","s3_cap_term":"В модели без фактора терминации eRF1 стоп-кодон за время наблюдения остаётся в A-сайте, а полный полипептид — связанным с тРНК в P-сайте: он не освобождается, и рибосома не высвобождается.","s3_cap_term_z":"Нормальную терминацию запускает белковый фактор, а не тРНК. В клетках человека при нехватке eRF1 усиливается прочитывание стоп-кодона (англ. readthrough): тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется. Модель показывает только задержку освобождения полипептида.","s3_tl_1":"Инициация","s3_tl_2":"Вход аминоацил-тРНК в A-сайт","s3_tl_3":"Пептидная связь","s3_tl_4":"Транслокация","s3_tl_5":"Ещё два цикла; стоп-кодон в A-сайте","s3_tl_6":"Терминация","s3_tl_stop_eef2":"Остановка на этапе 4: в модели без eEF2 за время наблюдения транслокации нет — цепь Met–His остаётся на тРНК в A-сайте (в пробирке без факторов элонгации синтез идёт, но очень медленно и неточно).","s3_tl_stop_erf1":"Остановка на этапе 6: в модели без eRF1 за время наблюдения стоп-кодон UGA не узнаётся — полипептид остаётся на тРНК в P-сайте (в клетке возможно и прочитывание стоп-кодона).","s3_ev_cycW":"Ещё один цикл элонгации: Trp-тРНК входит в A-сайт\n(кодон UGG), пептидная связь, транслокация.","s3_ev_cycE":"Ещё один цикл элонгации: Glu-тРНК входит в A-сайт\n(кодон GAA), пептидная связь, транслокация."},"notes":["Инициаторная Met-тРНК в P-сайте напротив AUG; A-сайт свободен."],"static":["Инициаторная Met-тРНК в P-сайте напротив AUG; A-сайт свободен."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E08","question":"В какой участок рибосомы попадает инициаторная тРНК?","options":[{"id":"S10-E08-1","text":"В A-сайт, как все аминоацил-тРНК","correct":false,"feedback":"Инициаторную тРНК доставляют факторы инициации, и она оказывается в P-сайте."},{"id":"S10-E08-2","text":"В P-сайт, напротив старт-кодона","correct":true,"feedback":"Все остальные аминоацил-тРНК входят через A-сайт."},{"id":"S10-E08-3","text":"В E-сайт","correct":false,"feedback":"E-сайт — участок выхода тРНК без аминокислоты."}]}},{"id":"elongation-cycle","section":2,"questions":[3],"title":"Цикл элонгации: вход в A-сайт, пептидная связь, транслокация","keywords":["элонгация","eEF1A","проверка спаривания","пептидная связь","пептидил-тРНК","транслокация","eEF2","N→C"],"lead":["Уже известно: инициаторная тРНК в P-сайте, A-сайт свободен (БИО-10·14).","Новое: повторяющийся цикл, который удлиняет полипептид на одну аминокислоту."],"mechanism":["1. Вход: фактор элонгации [[T38|eEF1A]] с ГТФ доставляет аминоацил-тРНК в A-сайт. Удерживается только тРНК, антикодон которой спарен с кодоном; рибосома проверяет пару дважды — до и после гидролиза ГТФ, — и неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.","2. [[T15|Пептидная связь]]: аминогруппа аминокислоты в A-сайте атакует связь растущей цепи с тРНК в P-сайте. Цепь переносится на тРНК в A-сайте и удлиняется на один остаток у C-конца; тРНК в P-сайте остаётся без аминокислоты.","3. [[T40|Транслокация]]: фактор [[T39|eEF2]] за счёт гидролиза ГТФ сдвигает рибосому на один кодон (три нуклеотида) к 3′-концу. тРНК с цепью переходит из A- в P-сайт, тРНК без аминокислоты — из P- в E-сайт и затем покидает рибосому.","A-сайт освобождается над следующим кодоном, и цикл повторяется. Сдвиг ровно на три нуклеотида сохраняет рамку считывания."],"paragraphs":["Энергия для образования пептидной связи запасена в сложноэфирной связи аминоацил-тРНК; ГТФ расходуют факторы элонгации — на точность отбора и на направленное движение рибосомы.","Рибосома эукариот присоединяет несколько аминокислот в секунду; синтез большинства белков занимает от 20 секунд до нескольких минут."],"conditions":"Схема шага — модель вкладки 3, этапы 2–4.","sources":["Alberts2022"],"quiz":{"id":"S10-L15","question":"Сразу после образования пептидной связи где находится растущая цепь?","options":[{"id":"S10-L15-1","text":"На тРНК в P-сайте","correct":false,"feedback":"До образования связи — да; после — цепь на тРНК в A-сайте."},{"id":"S10-L15-2","text":"На тРНК в E-сайте","correct":false,"feedback":"В E-сайт попадает тРНК без аминокислоты."},{"id":"S10-L15-3","text":"На тРНК в A-сайте","correct":true,"feedback":"Цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте; затем транслокация переведёт эту тРНК в P-сайт."}]},"widget":{"kind":"dna","title":"","s":{"title":"Цикл элонгации","status":"Схема качественная","modes_label":"Что показать","modes":["вход в A","пептидная связь","транслокация"],"scene":"s3b","args":[["2","all"],["3","all"],["4","all"]],"L":{"s3_st":"Этап","s3_st_1":"1 инициация","s3_st_2":"2 вход в A","s3_st_3":"3 пептидная связь","s3_st_4":"4 транслокация","s3_st_5":"5 стоп в A","s3_st_6":"6 терминация","s3_comp":"Детали","s3_comp_all":"все есть","s3_comp_noeef2":"нет eEF2","s3_comp_noerf1":"нет eRF1","s3_ctrl_note":"Цитоплазма клетки человека. мРНК: 5′…AUG CAC UGG GAA UGA…3′ (метионин, гистидин, триптофан, глутаминовая кислота, стоп-кодон). Этапы — моменты одного прохода рибосомы в учебной последовательности: 1 — рибосома собрана на старт-кодоне; 2–4 — первый цикл элонгации; 5 — ещё два таких цикла пройдены; 6 — терминация. eEF2 — фактор транслокации, eRF1 — фактор терминации; их можно убрать.","s3_pA":"А. Рибосома 80S на мРНК: участки E, P и A","s3_pB":"Б. Что происходит на этом этапе","s3_lbl_large":"большая субчастица (60S)","s3_lbl_small":"малая субчастица (40S)","s3_lbl_released":"полипептид освобождён","s3_lbl_noeef2":"нет eEF2: в модели транслокации нет","s3_lbl_noerf1":"нет eRF1: в модели стоп-кодон не узнан","s3_lbl_shift":"сдвиг на один кодон к 3′-концу","s3_ev_s1":"Инициация: малая субчастица с инициаторной Met-тРНК нашла\nстарт-кодон AUG, присоединилась большая субчастица.\nИнициаторная тРНК — в P-сайте, A-сайт свободен.","s3_ev_s2":"Вход аминоацил-тРНК: в свободный A-сайт вошла His-тРНК,\nеё антикодон спарился с кодоном CAC.\nМетионин — на тРНК в P-сайте.","s3_ev_s3":"Пептидная связь: метионин перенесён с тРНК в P-сайте\nна аминогруппу гистидина тРНК в A-сайте. Цепь Met–His —\nна тРНК в A-сайте; тРНК в P-сайте без аминокислоты.","s3_ev_s4":"Транслокация: рибосома сдвинулась на три нуклеотида к 3′-концу.\nтРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте\n(затем покинет рибосому); A-сайт свободен для кодона UGG.","s3_ev_s5":"Ещё два цикла элонгации добавили триптофан\nи глутаминовую кислоту. В A-сайте стоп-кодон UGA:\nтРНК, спаривающейся с ним, нет.","s3_ev_s6":"Терминация: eRF1 занял A-сайт; связь цепи с тРНК\nгидролизована, полипептид Met–His–Trp–Glu освобождён.\nЗатем субчастицы рибосомы разойдутся.","s3_ev_transloc":"В модели без eEF2 рибосома за время наблюдения не сдвигается:\nцепь Met–His остаётся на тРНК в A-сайте, кодон UGG\nне попадает в A-сайт, и цикл элонгации не повторяется.","s3_ev_term":"В модели без eRF1 стоп-кодон за время наблюдения\nне узнаётся: цепь Met–His–Trp–Glu остаётся связанной\nс тРНК в P-сайте, полипептид не освобождается.","s3_r_E":"E-сайт","s3_r_P":"P-сайт","s3_r_A":"A-сайт","s3_v_raw":"{s}","s3_v_empty":"свободен","s3_v_trna_aa":"{i} {a}-тРНК","s3_v_trna_chain":"тРНК {a} с цепью из {n} аминокислот","s3_v_trna_free":"{i} тРНК {a} без аминокислоты","s3_v_ini":"инициаторная","s3_v_erf1":"фактор терминации eRF1","s3_r_chain":"Полипептид","s3_r_chain_s":"где находится цепь","s3_v_chain_P":"{n} — на тРНК в P-сайте","s3_v_chain_A":"{n} — на тРНК в A-сайте","s3_v_chain_free":"{n} — освобождён","s3_r_codon":"Кодон в P-сайте","s3_r_codon_s":"номер кодона от старт-кодона","s3_v_codon":"{k}: {c}","s3_cap_s1":"Рибосома собрана на старт-кодоне: инициаторная тРНК с метионином спарена с AUG в P-сайте, A-сайт свободен и находится над следующим кодоном.","s3_cap_s1_z":"Инициаторная тРНК — единственная, которая входит в рибосому через P-сайт; все остальные аминоацил-тРНК, в том числе с метионином для внутренних кодонов AUG, входят в A-сайт.","s3_cap_s2":"Аминоацил-тРНК вошла в A-сайт: её доставляет фактор элонгации eEF1A вместе с ГТФ; удерживается только та тРНК, антикодон которой спарен с кодоном.","s3_cap_s2_z":"На этом этапе рибосома проверяет спаривание антикодона с кодоном — дважды, до и после гидролиза ГТФ; неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.","s3_cap_s3":"Пептидная связь: растущая цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте. Цепь удлинилась на один остаток у C-конца.","s3_cap_s3_z":"Реакцию катализирует пептидилтрансферазный центр большой субчастицы, образованный рРНК (рибосома — рибозим). Поэтому полипептид растёт от N- к C-концу.","s3_cap_s4":"Транслокация: рибосома продвинулась на один кодон к 3′-концу мРНК; тРНК из A-сайта перешла в P-сайт, из P-сайта — в E-сайт.","s3_cap_s4_z":"Сдвиг ровно на три нуклеотида сохраняет рамку считывания. Транслокацию обеспечивает фактор элонгации eEF2 за счёт гидролиза ГТФ.","s3_cap_s5":"После ещё двух циклов цепь из четырёх аминокислот — на тРНК в P-сайте, а в A-сайте стоп-кодон UGA. Ни одна тРНК не спаривается со стоп-кодоном.","s3_cap_s5_z":"Цикл элонгации одинаков для каждого кодона: вход аминоацил-тРНК, пептидная связь, транслокация.","s3_cap_s6":"Стоп-кодон в A-сайте узнаёт белковый фактор терминации eRF1. Связь цепи с тРНК гидролизуется (акцептором становится вода), и полипептид освобождается.","s3_cap_s6_z":"eRF1 узнаёт все три стоп-кодона; по форме он напоминает тРНК. После терминации субчастицы рибосомы расходятся и используются снова.","s3_cap_transloc":"В модели без фактора транслокации eEF2 за время наблюдения цикл не продолжается после образования пептидной связи: цепь — на тРНК в A-сайте, следующий кодон в A-сайт не попадает.","s3_cap_transloc_z":"Пока A-сайт занят, следующая аминоацил-тРНК войти не может: каждый шаг цикла зависит от завершения предыдущего. Остановка — допущение модели: в пробирке без факторов элонгации синтез возможен, но очень медленный, неэффективный и неточный.","s3_cap_term":"В модели без фактора терминации eRF1 стоп-кодон за время наблюдения остаётся в A-сайте, а полный полипептид — связанным с тРНК в P-сайте: он не освобождается, и рибосома не высвобождается.","s3_cap_term_z":"Нормальную терминацию запускает белковый фактор, а не тРНК. В клетках человека при нехватке eRF1 усиливается прочитывание стоп-кодона (англ. readthrough): тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется. Модель показывает только задержку освобождения полипептида.","s3_tl_1":"Инициация","s3_tl_2":"Вход аминоацил-тРНК в A-сайт","s3_tl_3":"Пептидная связь","s3_tl_4":"Транслокация","s3_tl_5":"Ещё два цикла; стоп-кодон в A-сайте","s3_tl_6":"Терминация","s3_tl_stop_eef2":"Остановка на этапе 4: в модели без eEF2 за время наблюдения транслокации нет — цепь Met–His остаётся на тРНК в A-сайте (в пробирке без факторов элонгации синтез идёт, но очень медленно и неточно).","s3_tl_stop_erf1":"Остановка на этапе 6: в модели без eRF1 за время наблюдения стоп-кодон UGA не узнаётся — полипептид остаётся на тРНК в P-сайте (в клетке возможно и прочитывание стоп-кодона).","s3_ev_cycW":"Ещё один цикл элонгации: Trp-тРНК входит в A-сайт\n(кодон UGG), пептидная связь, транслокация.","s3_ev_cycE":"Ещё один цикл элонгации: Glu-тРНК входит в A-сайт\n(кодон GAA), пептидная связь, транслокация."},"notes":["His-тРНК вошла в A-сайт.","Цепь Met–His на тРНК в A-сайте.","Сдвиг на кодон: тРНК с цепью в P, без аминокислоты — в E."],"static":["His-тРНК вошла в A-сайт."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E09","question":"Как перемещаются тРНК относительно рибосомы при транслокации?","options":[{"id":"S10-E09-1","text":"Из P-сайта в A-сайт, из E-сайта в P-сайт","correct":false,"feedback":"Транслокация переводит тРНК с цепью из A- в P-сайт."},{"id":"S10-E09-2","text":"Из E-сайта в A-сайт, из A-сайта в P-сайт","correct":false,"feedback":"В A-сайт входит новая аминоацил-тРНК; тРНК из E-сайта покидает рибосому."},{"id":"S10-E09-3","text":"Из A-сайта в P-сайт, из P-сайта в E-сайт","correct":true,"feedback":"Рибосома сдвигается на один кодон к 3′-концу мРНК, и A-сайт освобождается."}]}},{"id":"termination-polysome","section":2,"questions":[3],"title":"Терминация и полисома","keywords":["стоп-кодон","фактор терминации eRF1","eRF3","гидролиз пептидил-тРНК","рециклинг","полисома"],"lead":["Уже известно: стоп-кодонам не соответствует ни одна тРНК с полностью комплементарным антикодоном (БИО-10·2).","Новое: что происходит, когда стоп-кодон оказывается в A-сайте."],"mechanism":["Стоп-кодон в A-сайте узнаёт белковый [[T42|фактор терминации eRF1]]; по форме он напоминает тРНК и узнаёт все три стоп-кодона. Он действует вместе с eRF3, связывающим ГТФ.","Пептидилтрансферазный центр присоединяет к пептидил-тРНК воду вместо аминокислоты: связь полипептида с тРНК гидролизуется, и полипептид освобождается.","Затем рибосома отделяется от мРНК, субчастицы расходятся и используются в новых циклах трансляции.","Одну мРНК одновременно транслируют несколько рибосом — [[T43|полисома]]; соседние рибосомы могут располагаться всего примерно через 80 нуклеотидов друг от друга. Так с одной мРНК за то же время синтезируется гораздо больше белка."],"paragraphs":["В модели без фактора терминации полипептид за время наблюдения остаётся связанным с тРНК в P-сайте, и рибосома не освобождается. В клетках человека при нехватке eRF1 усиливается и прочитывание стоп-кодона: тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется; этот исход модель не показывает.","Преждевременный стоп-кодон узнаётся так же, как обычный, — освобождается укороченный полипептид (раздел 4)."],"conditions":"Схема шага — модель вкладки 3, этапы 5–6.","sources":["Alberts2022","Janzen2004"],"quiz":{"id":"S10-L16","question":"Что присоединяется к пептидил-тРНК при терминации вместо аминокислоты?","options":[{"id":"S10-L16-1","text":"Вода: связь цепи с тРНК гидролизуется","correct":true,"feedback":"Поэтому C-конец полипептида освобождается от тРНК."},{"id":"S10-L16-2","text":"Особая аминокислота, кодируемая стоп-кодоном","correct":false,"feedback":"Стоп-кодон не кодирует аминокислоту."},{"id":"S10-L16-3","text":"ГТФ, который присоединяется к цепи","correct":false,"feedback":"ГТФ связывает eRF3; к цепи присоединяется вода."}]},"widget":{"kind":"dna","title":"","s":{"title":"Терминация","status":"Схема качественная","modes_label":"Что показать","modes":["стоп в A","терминация","нет eRF1 (модель)"],"scene":"s3b","args":[["5","all"],["6","all"],["6","noerf1"]],"L":{"s3_st":"Этап","s3_st_1":"1 инициация","s3_st_2":"2 вход в A","s3_st_3":"3 пептидная связь","s3_st_4":"4 транслокация","s3_st_5":"5 стоп в A","s3_st_6":"6 терминация","s3_comp":"Детали","s3_comp_all":"все есть","s3_comp_noeef2":"нет eEF2","s3_comp_noerf1":"нет eRF1","s3_ctrl_note":"Цитоплазма клетки человека. мРНК: 5′…AUG CAC UGG GAA UGA…3′ (метионин, гистидин, триптофан, глутаминовая кислота, стоп-кодон). Этапы — моменты одного прохода рибосомы в учебной последовательности: 1 — рибосома собрана на старт-кодоне; 2–4 — первый цикл элонгации; 5 — ещё два таких цикла пройдены; 6 — терминация. eEF2 — фактор транслокации, eRF1 — фактор терминации; их можно убрать.","s3_pA":"А. Рибосома 80S на мРНК: участки E, P и A","s3_pB":"Б. Что происходит на этом этапе","s3_lbl_large":"большая субчастица (60S)","s3_lbl_small":"малая субчастица (40S)","s3_lbl_released":"полипептид освобождён","s3_lbl_noeef2":"нет eEF2: в модели транслокации нет","s3_lbl_noerf1":"нет eRF1: в модели стоп-кодон не узнан","s3_lbl_shift":"сдвиг на один кодон к 3′-концу","s3_ev_s1":"Инициация: малая субчастица с инициаторной Met-тРНК нашла\nстарт-кодон AUG, присоединилась большая субчастица.\nИнициаторная тРНК — в P-сайте, A-сайт свободен.","s3_ev_s2":"Вход аминоацил-тРНК: в свободный A-сайт вошла His-тРНК,\nеё антикодон спарился с кодоном CAC.\nМетионин — на тРНК в P-сайте.","s3_ev_s3":"Пептидная связь: метионин перенесён с тРНК в P-сайте\nна аминогруппу гистидина тРНК в A-сайте. Цепь Met–His —\nна тРНК в A-сайте; тРНК в P-сайте без аминокислоты.","s3_ev_s4":"Транслокация: рибосома сдвинулась на три нуклеотида к 3′-концу.\nтРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте\n(затем покинет рибосому); A-сайт свободен для кодона UGG.","s3_ev_s5":"Ещё два цикла элонгации добавили триптофан\nи глутаминовую кислоту. В A-сайте стоп-кодон UGA:\nтРНК, спаривающейся с ним, нет.","s3_ev_s6":"Терминация: eRF1 занял A-сайт; связь цепи с тРНК\nгидролизована, полипептид Met–His–Trp–Glu освобождён.\nЗатем субчастицы рибосомы разойдутся.","s3_ev_transloc":"В модели без eEF2 рибосома за время наблюдения не сдвигается:\nцепь Met–His остаётся на тРНК в A-сайте, кодон UGG\nне попадает в A-сайт, и цикл элонгации не повторяется.","s3_ev_term":"В модели без eRF1 стоп-кодон за время наблюдения\nне узнаётся: цепь Met–His–Trp–Glu остаётся связанной\nс тРНК в P-сайте, полипептид не освобождается.","s3_r_E":"E-сайт","s3_r_P":"P-сайт","s3_r_A":"A-сайт","s3_v_raw":"{s}","s3_v_empty":"свободен","s3_v_trna_aa":"{i} {a}-тРНК","s3_v_trna_chain":"тРНК {a} с цепью из {n} аминокислот","s3_v_trna_free":"{i} тРНК {a} без аминокислоты","s3_v_ini":"инициаторная","s3_v_erf1":"фактор терминации eRF1","s3_r_chain":"Полипептид","s3_r_chain_s":"где находится цепь","s3_v_chain_P":"{n} — на тРНК в P-сайте","s3_v_chain_A":"{n} — на тРНК в A-сайте","s3_v_chain_free":"{n} — освобождён","s3_r_codon":"Кодон в P-сайте","s3_r_codon_s":"номер кодона от старт-кодона","s3_v_codon":"{k}: {c}","s3_cap_s1":"Рибосома собрана на старт-кодоне: инициаторная тРНК с метионином спарена с AUG в P-сайте, A-сайт свободен и находится над следующим кодоном.","s3_cap_s1_z":"Инициаторная тРНК — единственная, которая входит в рибосому через P-сайт; все остальные аминоацил-тРНК, в том числе с метионином для внутренних кодонов AUG, входят в A-сайт.","s3_cap_s2":"Аминоацил-тРНК вошла в A-сайт: её доставляет фактор элонгации eEF1A вместе с ГТФ; удерживается только та тРНК, антикодон которой спарен с кодоном.","s3_cap_s2_z":"На этом этапе рибосома проверяет спаривание антикодона с кодоном — дважды, до и после гидролиза ГТФ; неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.","s3_cap_s3":"Пептидная связь: растущая цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте. Цепь удлинилась на один остаток у C-конца.","s3_cap_s3_z":"Реакцию катализирует пептидилтрансферазный центр большой субчастицы, образованный рРНК (рибосома — рибозим). Поэтому полипептид растёт от N- к C-концу.","s3_cap_s4":"Транслокация: рибосома продвинулась на один кодон к 3′-концу мРНК; тРНК из A-сайта перешла в P-сайт, из P-сайта — в E-сайт.","s3_cap_s4_z":"Сдвиг ровно на три нуклеотида сохраняет рамку считывания. Транслокацию обеспечивает фактор элонгации eEF2 за счёт гидролиза ГТФ.","s3_cap_s5":"После ещё двух циклов цепь из четырёх аминокислот — на тРНК в P-сайте, а в A-сайте стоп-кодон UGA. Ни одна тРНК не спаривается со стоп-кодоном.","s3_cap_s5_z":"Цикл элонгации одинаков для каждого кодона: вход аминоацил-тРНК, пептидная связь, транслокация.","s3_cap_s6":"Стоп-кодон в A-сайте узнаёт белковый фактор терминации eRF1. Связь цепи с тРНК гидролизуется (акцептором становится вода), и полипептид освобождается.","s3_cap_s6_z":"eRF1 узнаёт все три стоп-кодона; по форме он напоминает тРНК. После терминации субчастицы рибосомы расходятся и используются снова.","s3_cap_transloc":"В модели без фактора транслокации eEF2 за время наблюдения цикл не продолжается после образования пептидной связи: цепь — на тРНК в A-сайте, следующий кодон в A-сайт не попадает.","s3_cap_transloc_z":"Пока A-сайт занят, следующая аминоацил-тРНК войти не может: каждый шаг цикла зависит от завершения предыдущего. Остановка — допущение модели: в пробирке без факторов элонгации синтез возможен, но очень медленный, неэффективный и неточный.","s3_cap_term":"В модели без фактора терминации eRF1 стоп-кодон за время наблюдения остаётся в A-сайте, а полный полипептид — связанным с тРНК в P-сайте: он не освобождается, и рибосома не высвобождается.","s3_cap_term_z":"Нормальную терминацию запускает белковый фактор, а не тРНК. В клетках человека при нехватке eRF1 усиливается прочитывание стоп-кодона (англ. readthrough): тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется. Модель показывает только задержку освобождения полипептида.","s3_tl_1":"Инициация","s3_tl_2":"Вход аминоацил-тРНК в A-сайт","s3_tl_3":"Пептидная связь","s3_tl_4":"Транслокация","s3_tl_5":"Ещё два цикла; стоп-кодон в A-сайте","s3_tl_6":"Терминация","s3_tl_stop_eef2":"Остановка на этапе 4: в модели без eEF2 за время наблюдения транслокации нет — цепь Met–His остаётся на тРНК в A-сайте (в пробирке без факторов элонгации синтез идёт, но очень медленно и неточно).","s3_tl_stop_erf1":"Остановка на этапе 6: в модели без eRF1 за время наблюдения стоп-кодон UGA не узнаётся — полипептид остаётся на тРНК в P-сайте (в клетке возможно и прочитывание стоп-кодона).","s3_ev_cycW":"Ещё один цикл элонгации: Trp-тРНК входит в A-сайт\n(кодон UGG), пептидная связь, транслокация.","s3_ev_cycE":"Ещё один цикл элонгации: Glu-тРНК входит в A-сайт\n(кодон GAA), пептидная связь, транслокация."},"notes":["Стоп-кодон UGA в A-сайте.","eRF1 в A-сайте; полипептид освобождён.","В модели без eRF1 полипептид за время наблюдения остаётся на тРНК в P-сайте."],"static":["Стоп-кодон UGA в A-сайте."]},"zoomNarrow":true},"exam_quiz":{"id":"S10-E10","question":"Что узнаёт стоп-кодон в A-сайте?","options":[{"id":"S10-E10-1","text":"Белковый фактор терминации","correct":true,"feedback":"Ни одна тРНК не спаривается со стоп-кодоном; фактор терминации вызывает гидролиз связи полипептида с тРНК."},{"id":"S10-E10-2","text":"Особая стоп-тРНК без аминокислоты","correct":false,"feedback":"Таких тРНК нет: стоп-кодон узнаёт белок."},{"id":"S10-E10-3","text":"Малая субчастица без участия других белков","correct":false,"feedback":"Для терминации нужен фактор терминации."}]}},{"id":"ribosome-flow","section":2,"questions":[3],"title":"Больше рибосом на мРНК — не всегда больше белка","keywords":["полисома","частота инициации","медленный кодон","очередь рибосом","баланс","обратная задача"],"lead":["Уже известно: одну мРНК транслируют несколько рибосом (БИО-10·16).","Новое: от чего зависит число рибосом на мРНК и число завершённых полипептидов и почему они могут меняться в разные стороны."],"mechanism":["Число рибосом, начавших синтез, равно сумме завершивших синтез и ещё находящихся на мРНК.","Поток завершённых полипептидов определяется самым медленным этапом: инициацией или прохождением участка мРНК, где рибосомы задерживаются (например, кодона, для которого мало аминоацил-тРНК).","Если ограничивает инициация, рибосом на мРНК мало и они распределены редко. Если ограничивает элонгация на участке, рибосомы скапливаются перед ним и дольше остаются на мРНК, а завершённых полипептидов меньше; начало мРНК оказывается занятым, и часть возможных инициаций не состоится. Число рибосом на мРНК при этом может и вырасти (в модели — 9 вместо 7 при инициации раз в 16 ед.), и уменьшиться (9 вместо 12 при инициации раз в 8 ед.).","Поэтому по числу рибосом на мРНК нельзя напрямую судить о количестве синтезируемого белка; это не универсальный количественный закон."],"paragraphs":["Обратная задача модели: в двух клетках за одно время завершено по 15 полипептидов. В клетке с редкой инициацией на мРНК 3 рибосомы, распределённые редко; в клетке с нехваткой аминоацил-тРНК для кодона 80 — 9 рибосом, 8 из них до этого кодона, и многие инициации не состоялись. Различить причины помогают число и распределение рибосом и проверка — добавление нужной аминоацил-тРНК ускорит синтез только во второй клетке.","Модель детерминированная и условная: время в условных единицах, рибосома занимает 10 кодонов, все рибосомы одинаковы.","Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей."],"conditions":"Учебная модель: кодирующая область 120 кодонов, наблюдение — 600 условных единиц времени.","sources":["Alberts2022"],"quiz":{"id":"S10-L17","question":"На мРНК стало вдвое больше рибосом, а завершённых полипептидов — меньше. Что наиболее вероятно?","options":[{"id":"S10-L17-1","text":"Инициация стала чаще, белка станет больше","correct":false,"feedback":"Тогда росло бы и число завершённых полипептидов."},{"id":"S10-L17-2","text":"Рибосомы задерживаются на участке мРНК","correct":true,"feedback":"При ограничении элонгации рибосомы дольше остаются на мРНК, но реже завершают синтез."},{"id":"S10-L17-3","text":"Инициация стала реже, чем раньше","correct":false,"feedback":"Тогда рибосом на мРНК стало бы меньше."}]},"widget":{"kind":"dna","title":"","s":{"title":"Поток рибосом","status":"Учебная модель · время условное","modes_label":"Что показать","modes":["редкая инициация","мало аминоацил-тРНК для кодона 80","обратная задача"],"scene":"a3","args":[["32","1","1"],["16","22","1"],["pair","open"]],"L":{"a3_pA":"А. Полисома в момент наблюдения: рибосомы на мРНК","a3_lbl_start":"старт","a3_lbl_stop":"стоп","a3_lbl_slow":"кодон 80","a3_lbl_hidden":"расположение рибосом не исследовано","a3_lbl_scale":"каждый серый прямоугольник — рибосома (10 кодонов); 5′ слева, 3′ справа","a3_pB":"Б. Итоги за время наблюдения","a3_b_init":"инициаций","a3_b_on":"на мРНК","a3_b_done":"завершено","a3_b_missed":"пропущено\nинициаций","a3_lbl_cellA":"Клетка 1","a3_lbl_cellB":"Клетка 2","a3_lbl_pair":"завершено {d} · рибосом на мРНК: {n} (до кодона 80 — {u}) · пропущено инициаций: {m}","a3_lbl_pair_m":"завершено полипептидов: {d}"},"notes":["Рибосом мало, распределены редко; завершено 15.","Очередь перед кодоном 80; на мРНК 9 рибосом, завершено 15.","Две клетки: одинаковое число завершённых полипептидов, разное расположение рибосом."],"static":["Рибосом мало, распределены редко; завершено 15."]},"zoomNarrow":true},"level":"adv"},{"id":"initiation-diversity","section":2,"questions":[3],"title":"Инициация — самый разнообразный и наиболее регулируемый этап трансляции","keywords":["инициация","eIF4F","5′-НТО","расстояние от кэпа до AUG","разные пути инициации"],"lead":["Уже известно: малая субчастица привлекается к кэпу и сканирует 5′-НТО (БИО-10·14).","Новое: элонгация и терминация у разных мРНК идут с общим набором факторов, а инициация — разными путями."],"mechanism":["Инициация — наиболее регулируемый и самый разнообразный этап трансляции: элонгацию и терминацию мРНК проходят с общим набором факторов, а для инициации могут использовать разные наборы.","По строению комплекса малой субчастицы человека с факторами инициации на мРНК связанный с кэпом комплекс eIF4F располагается со стороны 5′-конца мРНК. Чтобы старт-кодон оказался в P-сайте, он должен отстоять от 5′-конца не менее чем примерно на 40 нуклеотидов.","Обычная 5′-НТО длиннее: медиана её длины у человека — 218 нуклеотидов, у пекарских дрожжей — 53.","мРНК с очень короткой 5′-НТО (около 4 % белок-кодирующих генов несут особые элементы для такой инициации), по-видимому, начинают трансляцию другим путём."],"paragraphs":["Как это узнали: обзор обобщает структурные работы, в которых определили пространственное строение комплекса малой субчастицы рибосомы человека с факторами инициации и мРНК, и биохимические данные о минимальном расстоянии от кэпа до старт-кодона.","Граница вывода: в других работах трансляция начиналась и с AUG, стоящего всего в двух нуклеотидах от кэпа, поэтому вопрос о минимальном расстоянии не решён окончательно. Обзор описывает механизм, но не измеряет, насколько часто инициация ограничивает синтез конкретного белка.","Связанная модель — в практикуме: вопрос 3, уровень «Продвинутый» (поток рибосом по мРНК); в ней есть переключатели, сценарий и обратная задача."],"conditions":"Обзор структурных и биохимических данных (клетки и белки человека и дрожжей).","sources":["BritoQuerido2024"],"quiz":{"id":"S10-L18","question":"Чем инициация отличается от элонгации и терминации по набору факторов?","options":[{"id":"S10-L18-1","text":"Для инициации факторы белковой природы не нужны","correct":false,"feedback":"Инициацию обеспечивают многочисленные факторы инициации (eIF)."},{"id":"S10-L18-2","text":"Набор факторов одинаков, различается только скорость","correct":false,"feedback":"Наборы факторов инициации у разных мРНК могут различаться, а у элонгации — нет."},{"id":"S10-L18-3","text":"Для инициации разные мРНК используют разные наборы факторов","correct":true,"feedback":"Элонгацию и терминацию все мРНК проходят с общим набором факторов; инициация — самый разнообразный этап."}]},"widget":{"kind":"dna","title":"","s":{"title":"Инициация в модели","status":"Схема качественная","modes_label":"Что показать","modes":["инициация"],"scene":"s3b","args":[["1","all"]],"L":{"s3_st":"Этап","s3_st_1":"1 инициация","s3_st_2":"2 вход в A","s3_st_3":"3 пептидная связь","s3_st_4":"4 транслокация","s3_st_5":"5 стоп в A","s3_st_6":"6 терминация","s3_comp":"Детали","s3_comp_all":"все есть","s3_comp_noeef2":"нет eEF2","s3_comp_noerf1":"нет eRF1","s3_ctrl_note":"Цитоплазма клетки человека. мРНК: 5′…AUG CAC UGG GAA UGA…3′ (метионин, гистидин, триптофан, глутаминовая кислота, стоп-кодон). Этапы — моменты одного прохода рибосомы в учебной последовательности: 1 — рибосома собрана на старт-кодоне; 2–4 — первый цикл элонгации; 5 — ещё два таких цикла пройдены; 6 — терминация. eEF2 — фактор транслокации, eRF1 — фактор терминации; их можно убрать.","s3_pA":"А. Рибосома 80S на мРНК: участки E, P и A","s3_pB":"Б. Что происходит на этом этапе","s3_lbl_large":"большая субчастица (60S)","s3_lbl_small":"малая субчастица (40S)","s3_lbl_released":"полипептид освобождён","s3_lbl_noeef2":"нет eEF2: в модели транслокации нет","s3_lbl_noerf1":"нет eRF1: в модели стоп-кодон не узнан","s3_lbl_shift":"сдвиг на один кодон к 3′-концу","s3_ev_s1":"Инициация: малая субчастица с инициаторной Met-тРНК нашла\nстарт-кодон AUG, присоединилась большая субчастица.\nИнициаторная тРНК — в P-сайте, A-сайт свободен.","s3_ev_s2":"Вход аминоацил-тРНК: в свободный A-сайт вошла His-тРНК,\nеё антикодон спарился с кодоном CAC.\nМетионин — на тРНК в P-сайте.","s3_ev_s3":"Пептидная связь: метионин перенесён с тРНК в P-сайте\nна аминогруппу гистидина тРНК в A-сайте. Цепь Met–His —\nна тРНК в A-сайте; тРНК в P-сайте без аминокислоты.","s3_ev_s4":"Транслокация: рибосома сдвинулась на три нуклеотида к 3′-концу.\nтРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте\n(затем покинет рибосому); A-сайт свободен для кодона UGG.","s3_ev_s5":"Ещё два цикла элонгации добавили триптофан\nи глутаминовую кислоту. В A-сайте стоп-кодон UGA:\nтРНК, спаривающейся с ним, нет.","s3_ev_s6":"Терминация: eRF1 занял A-сайт; связь цепи с тРНК\nгидролизована, полипептид Met–His–Trp–Glu освобождён.\nЗатем субчастицы рибосомы разойдутся.","s3_ev_transloc":"В модели без eEF2 рибосома за время наблюдения не сдвигается:\nцепь Met–His остаётся на тРНК в A-сайте, кодон UGG\nне попадает в A-сайт, и цикл элонгации не повторяется.","s3_ev_term":"В модели без eRF1 стоп-кодон за время наблюдения\nне узнаётся: цепь Met–His–Trp–Glu остаётся связанной\nс тРНК в P-сайте, полипептид не освобождается.","s3_r_E":"E-сайт","s3_r_P":"P-сайт","s3_r_A":"A-сайт","s3_v_raw":"{s}","s3_v_empty":"свободен","s3_v_trna_aa":"{i} {a}-тРНК","s3_v_trna_chain":"тРНК {a} с цепью из {n} аминокислот","s3_v_trna_free":"{i} тРНК {a} без аминокислоты","s3_v_ini":"инициаторная","s3_v_erf1":"фактор терминации eRF1","s3_r_chain":"Полипептид","s3_r_chain_s":"где находится цепь","s3_v_chain_P":"{n} — на тРНК в P-сайте","s3_v_chain_A":"{n} — на тРНК в A-сайте","s3_v_chain_free":"{n} — освобождён","s3_r_codon":"Кодон в P-сайте","s3_r_codon_s":"номер кодона от старт-кодона","s3_v_codon":"{k}: {c}","s3_cap_s1":"Рибосома собрана на старт-кодоне: инициаторная тРНК с метионином спарена с AUG в P-сайте, A-сайт свободен и находится над следующим кодоном.","s3_cap_s1_z":"Инициаторная тРНК — единственная, которая входит в рибосому через P-сайт; все остальные аминоацил-тРНК, в том числе с метионином для внутренних кодонов AUG, входят в A-сайт.","s3_cap_s2":"Аминоацил-тРНК вошла в A-сайт: её доставляет фактор элонгации eEF1A вместе с ГТФ; удерживается только та тРНК, антикодон которой спарен с кодоном.","s3_cap_s2_z":"На этом этапе рибосома проверяет спаривание антикодона с кодоном — дважды, до и после гидролиза ГТФ; неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.","s3_cap_s3":"Пептидная связь: растущая цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте. Цепь удлинилась на один остаток у C-конца.","s3_cap_s3_z":"Реакцию катализирует пептидилтрансферазный центр большой субчастицы, образованный рРНК (рибосома — рибозим). Поэтому полипептид растёт от N- к C-концу.","s3_cap_s4":"Транслокация: рибосома продвинулась на один кодон к 3′-концу мРНК; тРНК из A-сайта перешла в P-сайт, из P-сайта — в E-сайт.","s3_cap_s4_z":"Сдвиг ровно на три нуклеотида сохраняет рамку считывания. Транслокацию обеспечивает фактор элонгации eEF2 за счёт гидролиза ГТФ.","s3_cap_s5":"После ещё двух циклов цепь из четырёх аминокислот — на тРНК в P-сайте, а в A-сайте стоп-кодон UGA. Ни одна тРНК не спаривается со стоп-кодоном.","s3_cap_s5_z":"Цикл элонгации одинаков для каждого кодона: вход аминоацил-тРНК, пептидная связь, транслокация.","s3_cap_s6":"Стоп-кодон в A-сайте узнаёт белковый фактор терминации eRF1. Связь цепи с тРНК гидролизуется (акцептором становится вода), и полипептид освобождается.","s3_cap_s6_z":"eRF1 узнаёт все три стоп-кодона; по форме он напоминает тРНК. После терминации субчастицы рибосомы расходятся и используются снова.","s3_cap_transloc":"В модели без фактора транслокации eEF2 за время наблюдения цикл не продолжается после образования пептидной связи: цепь — на тРНК в A-сайте, следующий кодон в A-сайт не попадает.","s3_cap_transloc_z":"Пока A-сайт занят, следующая аминоацил-тРНК войти не может: каждый шаг цикла зависит от завершения предыдущего. Остановка — допущение модели: в пробирке без факторов элонгации синтез возможен, но очень медленный, неэффективный и неточный.","s3_cap_term":"В модели без фактора терминации eRF1 стоп-кодон за время наблюдения остаётся в A-сайте, а полный полипептид — связанным с тРНК в P-сайте: он не освобождается, и рибосома не высвобождается.","s3_cap_term_z":"Нормальную терминацию запускает белковый фактор, а не тРНК. В клетках человека при нехватке eRF1 усиливается прочитывание стоп-кодона (англ. readthrough): тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется. Модель показывает только задержку освобождения полипептида.","s3_tl_1":"Инициация","s3_tl_2":"Вход аминоацил-тРНК в A-сайт","s3_tl_3":"Пептидная связь","s3_tl_4":"Транслокация","s3_tl_5":"Ещё два цикла; стоп-кодон в A-сайте","s3_tl_6":"Терминация","s3_tl_stop_eef2":"Остановка на этапе 4: в модели без eEF2 за время наблюдения транслокации нет — цепь Met–His остаётся на тРНК в A-сайте (в пробирке без факторов элонгации синтез идёт, но очень медленно и неточно).","s3_tl_stop_erf1":"Остановка на этапе 6: в модели без eRF1 за время наблюдения стоп-кодон UGA не узнаётся — полипептид остаётся на тРНК в P-сайте (в клетке возможно и прочитывание стоп-кодона).","s3_ev_cycW":"Ещё один цикл элонгации: Trp-тРНК входит в A-сайт\n(кодон UGG), пептидная связь, транслокация.","s3_ev_cycE":"Ещё один цикл элонгации: Glu-тРНК входит в A-сайт\n(кодон GAA), пептидная связь, транслокация."},"notes":["Инициаторная тРНК в P-сайте напротив AUG."],"static":["Инициаторная тРНК в P-сайте напротив AUG."]},"zoomNarrow":true},"level":"adv"},{"id":"release-truncated","section":3,"questions":[4],"title":"Полноразмерный и укороченный продукт","keywords":["освобождение полипептида","полноразмерный продукт","укороченный продукт","преждевременный стоп-кодон"],"lead":["Уже известно: стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается (БИО-10·16).","Новое: что получается, если стоп-кодон встретился раньше обычного.","Раздел относится к вопросу 13 коллоквиума 2 (предварительный список) и вопросу 25 зачёта."],"mechanism":["Преждевременный стоп-кодон (после нонсенс-замены или сдвига рамки) узнаётся фактором терминации так же, как обычный: освобождается [[T46|укороченный полипептид]].","[[T45|Полноразмерный полипептид]] — продукт, синтез которого закончился на обычном стоп-кодоне.","Будет ли укороченный продукт работать и сохранится ли он, зависит от того, какие части белка успели синтезироваться и свернуться: продукт без одного домена может быть устойчивым и частично активным, а оборванный посреди домена — не свернуться и разрушиться.","Не каждый укороченный белок разрушается и не каждый полностью теряет активность."],"paragraphs":["В клетке мРНК с преждевременным стоп-кодоном часто разрушается (нонсенс-опосредованный распад мРНК), и укороченного белка образуется мало. Насколько эффективно это происходит, зависит от положения стоп-кодона и от других особенностей мРНК, поэтому преждевременный стоп-кодон не гарантирует ни отсутствия белка, ни его присутствия (подробнее — курс «Молекулярная биология»).","В модели вкладки 4 рассматривается только белок."],"conditions":"Схема шага — модель вкладки 4: условный белок из двух доменов (420 аминокислот).","sources":["Alberts2022"],"quiz":{"id":"S10-L19","question":"Стоп-кодон появился внутри кодирующей области. Как освобождается укороченный полипептид?","options":[{"id":"S10-L19-1","text":"Стоп-кодон в A-сайте узнаёт фактор терминации","correct":true,"feedback":"Для рибосомы преждевременный стоп-кодон не отличается от обычного."},{"id":"S10-L19-2","text":"Его отрезает протеаза от полноразмерного белка","correct":false,"feedback":"Полноразмерный белок здесь не синтезируется: синтез обрывается."},{"id":"S10-L19-3","text":"Рибосома не может освободить укороченную цепь","correct":false,"feedback":"Цепь освобождается при терминации."}]},"widget":{"kind":"dna","title":"","s":{"title":"Положение стоп-кодона","status":"Схема качественная · белок условный","modes_label":"Что показать","modes":["обычный стоп","стоп в кодоне 195","стоп в кодоне 120"],"scene":"s4b","args":[["norm","on"],["link","on"],["d1","on"]],"L":{"s4_stopc":"Стоп-кодон","s4_stop_norm":"обычный (421)","s4_stop_d1":"кодон 120","s4_stop_link":"кодон 195","s4_ups":"Убиквитин-протеасомная система","s4_ups_on":"работает","s4_ups_off":"подавлена (E3 действует)","s4_ctrl_note":"Цитозоль клетки человека. Условный белок из 420 аминокислот: домен 1 (остатки 1–180) связывает партнёра, домен 2 (201–420) катализирует реакцию; между ними — соединительный участок. Преждевременный стоп-кодон стоит в кодоне 120 (внутри домена 1) или 195 (после домена 1). Панель В — состояние продукта через несколько часов после синтеза (время условное). В модели рассматривается только белок; что происходит с мРНК, модель не показывает.","s4_pA":"А. Кодирующая область мРНК: домены белка и стоп-кодон","s4_pB":"Б. Продукт сразу после терминации","s4_pC":"В. Продукт в клетке через несколько часов","s4_lbl_d1":"домен 1","s4_lbl_d2":"домен 2","s4_lbl_stop":"стоп-кодон {k}","s4_lbl_normstop":"обычный стоп-кодон — после кодона 420","s4_lbl_cotrans":"домен 1 сворачивается ещё во время синтеза домена 2","s4_lbl_d1s":"1","s4_lbl_d2s":"2","s4_lbl_len":"{n} аминокислот","s4_lbl_prod_norm":"оба домена свёрнуты","s4_lbl_prod_d1":"ни один домен не свёрнут;\nгидрофобные участки снаружи","s4_lbl_prod_link":"домен 1 свёрнут;\nдомена 2 нет","s4_lbl_ub":"полиубиквитин","s4_lbl_prot":"протеасома","s4_lbl_pept":"короткие пептиды","s4_lbl_noups":"протеасома подавлена (E3 действует)","s4_lbl_accum":"помеченные убиквитином цепи накапливаются и могут образовывать агрегаты","s4_lbl_act_full":"связывание партнёра — есть\nкатализ — есть","s4_lbl_act_partial":"связывание партнёра — есть\nкатализ — нет","s4_r_len":"Длина продукта","s4_r_len_s":"аминокислот","s4_v_len":"{n}","s4_r_dom":"Свёрнутые домены","s4_v_dom_0":"нет","s4_v_dom_1":"домен 1","s4_v_dom_2":"оба","s4_r_exp":"Гидрофобные участки снаружи","s4_r_exp_s":"признак, по которому узнаётся несвёрнутая цепь","s4_r_fate":"Что происходит с продуктом","s4_v_fate_stays":"сохраняется","s4_v_fate_degraded":"разрушается в протеасоме","s4_v_fate_accum":"накапливается","s4_r_act":"Функции белка","s4_v_act_full":"обе","s4_v_act_partial":"только связывание","s4_v_act_none":"нет","s4_cap_norm":"Обычный стоп-кодон: синтезированы 420 аминокислот. Домен 1 свернулся, пока синтезировался домен 2; после терминации свернулся домен 2. Белок выполняет обе функции.","s4_cap_norm_z":"Сворачивание начинается во время трансляции: часть цепи, вышедшая из рибосомы, может свернуться раньше, чем синтезирован C-конец. Шапероны, связанные с рибосомой, помогают этому.","s4_cap_link":"Стоп-кодон в кодоне 195: полипептид из 194 аминокислот освобождается так же, как при обычной терминации. Домен 1 уже свернулся, домена 2 нет: продукт укорочен, но устойчив и сохраняет связывание партнёра без катализа.","s4_cap_link_z":"Укороченный продукт не обязательно разрушается и не обязательно утрачивает все функции: это зависит от того, какие части белка успели синтезироваться и свернуться.","s4_cap_d1_on":"Стоп-кодон в кодоне 120: освобождена цепь из 119 аминокислот — часть домена 1. Она не может свернуться, гидрофобные участки остаются снаружи. Их связывают шапероны; когда свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и продукт разрушает протеасома.","s4_cap_d1_on_z":"Системы контроля качества узнают белок не по длине, а по признакам неправильного сворачивания — например, по открытым гидрофобным участкам.","s4_cap_d1_off":"Тот же укороченный продукт при подавленной протеасоме: убиквитинлигаза присоединяет к несвёрнутым цепям полиубиквитин, но протеасома их не разрушает — помеченные цепи накапливаются и могут слипаться в агрегаты.","s4_cap_d1_off_z":"Количество белка в клетке определяется и синтезом, и удалением: при нарушенном удалении накапливается и тот продукт, который функции не выполняет.","s4_cap_d1_noe3":"Тот же укороченный продукт без убиквитинлигазы E3: цепь не получает метку убиквитина, протеасома её не узнаёт — несвёрнутые цепи без метки накапливаются и могут слипаться в агрегаты.","s4_cap_d1_noe3_z":"Протеасома разрушает белки, помеченные полиубиквитином; метку присоединяет убиквитинлигаза. Без неё нарушен первый шаг пути, без протеасомы — последний; итог в модели один — накопление, но цепи различаются меткой.","s4_lbl_noe3":"нет убиквитинлигазы E3","s4_lbl_accum_e3":"цепи без метки убиквитина накапливаются и могут образовывать агрегаты","s4_tl_1":"Растущая цепь выходит из рибосомы через туннель большой субчастицы.","s4_tl_2":"Домен 1 начинает сворачиваться, выходя из туннеля большой субчастицы, — ещё во время синтеза домена 2.","s4_tl_2b":"Синтезирована цепь домена 1 и соединительного участка; домен 2 не синтезируется.","s4_tl_2n":"Синтезирована только часть домена 1: такой фрагмент свернуться не может.","s4_tl_3":"Стоп-кодон в A-сайте — фактор терминации освобождает полипептид; вышедшие из туннеля домены сворачиваются.","s4_tl_4":"Несвёрнутую цепь с открытыми гидрофобными участками связывают шапероны Hsp70.","s4_tl_5":"Если свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и протеасома её разрушает.","s4_tl_5n":"Без убиквитинлигазы или протеасомы цепь не разрушается: несвёрнутые цепи накапливаются и могут образовывать агрегаты.","s4_tl_5p":"Убиквитинлигаза присоединяет цепь убиквитина, но протеасома подавлена: помеченные цепи не разрушаются и накапливаются.","s4_tl_5e":"Без убиквитинлигазы цепь не получает метку убиквитина и не разрушается: несвёрнутые цепи накапливаются.","s4_pBg":"Б. Растущая цепь у рибосомы","s4_lbl_e3":"E3"},"notes":["Оба домена свёрнуты — белок активен.","Домен 1 свёрнут, домена 2 нет: продукт устойчив, сохраняет связывание.","Домен 1 не завершён: цепь не свёрнута и разрушается."],"static":["Оба домена свёрнуты — белок активен."]},"zoomNarrow":true}},{"id":"folding-chaperones","section":3,"questions":[4],"title":"Сворачивание белка начинается ещё во время синтеза","keywords":["сворачивание","котрансляционное сворачивание","домен","шапероны","Hsp70","шаперонины","гидрофобные участки"],"lead":["Уже известно: последовательность аминокислот определяет пространственную структуру белка.","Новое: когда и с чьей помощью новый полипептид принимает рабочую структуру."],"mechanism":["[[T47|Сворачивание]] начинается, когда цепь выходит из туннеля рибосомы: N-концевой [[T48|домен]] может свернуться, пока синтезируется C-концевая часть, — котрансляционно.","Многим белкам для правильного сворачивания нужны [[T54|молекулярные шапероны]]: они не задают структуру, а связывают несвёрнутые участки и мешают цепи слипаться с другими цепями.","[[T53|Hsp70]], часть которых связана с рибосомой, связывают короткие гидрофобные участки выходящей цепи и с затратой АТФ помогают ей свернуться.","Шаперонины (в цитозоле — TRiC/CCT, в митохондриях — Hsp60) образуют полость, в которой сворачиваются отдельные белки, например актин и тубулин."],"paragraphs":["В правильно свёрнутом белке гидрофобные аминокислоты в основном спрятаны внутри. [[T50|Гидрофобный участок на поверхности]] — признак несвёрнутой или неправильно свёрнутой цепи.","Белки, синтезируемые на мембране эндоплазматического ретикулума, сворачиваются в его полости при участии своих шаперонов (семинар 4)."],"conditions":"Схема шага — модель вкладки 4.","sources":["Alberts2022"],"quiz":{"id":"S10-L20","question":"Верно ли, что сворачивание белка всегда начинается только после окончания трансляции?","options":[{"id":"S10-L20-1","text":"Да: свернуться может только полный полипептид","correct":false,"feedback":"Домены сворачиваются относительно независимо, по мере выхода из рибосомы."},{"id":"S10-L20-2","text":"Нет: N-концевой домен сворачивается ещё во время синтеза","correct":true,"feedback":"Сворачивание начинается при выходе цепи из рибосомы."},{"id":"S10-L20-3","text":"Да: шапероны не допускают сворачивания во время синтеза","correct":false,"feedback":"Шапероны связывают выходящую цепь, чтобы она свернулась правильно, а не чтобы задержать сворачивание."}]},"widget":{"kind":"dna","title":"","s":{"title":"Домены и сворачивание","status":"Схема качественная · белок условный","modes_label":"Что показать","modes":["обычный стоп"],"scene":"s4b","args":[["norm","on"]],"L":{"s4_stopc":"Стоп-кодон","s4_stop_norm":"обычный (421)","s4_stop_d1":"кодон 120","s4_stop_link":"кодон 195","s4_ups":"Убиквитин-протеасомная система","s4_ups_on":"работает","s4_ups_off":"подавлена (E3 действует)","s4_ctrl_note":"Цитозоль клетки человека. Условный белок из 420 аминокислот: домен 1 (остатки 1–180) связывает партнёра, домен 2 (201–420) катализирует реакцию; между ними — соединительный участок. Преждевременный стоп-кодон стоит в кодоне 120 (внутри домена 1) или 195 (после домена 1). Панель В — состояние продукта через несколько часов после синтеза (время условное). В модели рассматривается только белок; что происходит с мРНК, модель не показывает.","s4_pA":"А. Кодирующая область мРНК: домены белка и стоп-кодон","s4_pB":"Б. Продукт сразу после терминации","s4_pC":"В. Продукт в клетке через несколько часов","s4_lbl_d1":"домен 1","s4_lbl_d2":"домен 2","s4_lbl_stop":"стоп-кодон {k}","s4_lbl_normstop":"обычный стоп-кодон — после кодона 420","s4_lbl_cotrans":"домен 1 сворачивается ещё во время синтеза домена 2","s4_lbl_d1s":"1","s4_lbl_d2s":"2","s4_lbl_len":"{n} аминокислот","s4_lbl_prod_norm":"оба домена свёрнуты","s4_lbl_prod_d1":"ни один домен не свёрнут;\nгидрофобные участки снаружи","s4_lbl_prod_link":"домен 1 свёрнут;\nдомена 2 нет","s4_lbl_ub":"полиубиквитин","s4_lbl_prot":"протеасома","s4_lbl_pept":"короткие пептиды","s4_lbl_noups":"протеасома подавлена (E3 действует)","s4_lbl_accum":"помеченные убиквитином цепи накапливаются и могут образовывать агрегаты","s4_lbl_act_full":"связывание партнёра — есть\nкатализ — есть","s4_lbl_act_partial":"связывание партнёра — есть
