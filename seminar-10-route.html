<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-10.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Трансляция: от кодона мРНК к функционально активному белку</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-translation-overview"><div class="eyebrow">Генетический код и рамка считывания · шаг 1 из 26</div><h2>Трансляция: что, где и по какой матрице синтезируется</h2><p class="lead">Уже известно: зрелая мРНК выходит из ядра; её кодирующая область лежит между 5′- и 3′-нетранслируемыми областями (<a href="https://fresll.github.io/bio/seminar-9-route.html#exit-to-translation">вспомнить БИО-9·26</a>). Новое: как по последовательности нуклеотидов мРНК синтезируется последовательность аминокислот. Раздел относится к вопросу 12 коллоквиума 2 (предварительный список) и вопросу 21 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Девять смысловых кодонов от AUG до стоп-кодона UAA; полипептид — девять аминокислот.</div><ol class="mech"><li><a href="#ns-g-S10-T01">Трансляция</a> — синтез полипептида на рибосоме по матрице мРНК в соответствии с генетическим кодом.</li><li>Участники: <a href="#ns-g-S10-T13">мРНК</a> — матрица; <a href="#ns-g-S10-T26">рибосома</a> — место синтеза, катализирующее образование пептидных связей; <a href="#ns-g-S10-T16">тРНК</a> — адаптеры, приносящие аминокислоты; <a href="#ns-g-S10-T22">аминоацил-тРНК-синтетазы</a> — ферменты, соединяющие аминокислоты с тРНК; белковые факторы инициации, элонгации и терминации.</li><li>мРНК считывается от 5′- к 3′-концу, а <a href="#ns-g-S10-T14">полипептид</a> растёт от N-конца к C-концу: первая аминокислота (метионин старт-кодона) оказывается на N-конце.</li><li>Белок-кодирующие мРНК эукариот транслируются в цитоплазме — на свободных рибосомах или на рибосомах, связанных с мембраной эндоплазматического ретикулума (семинар 4).</li></ol><p>Между нуклеотидом и аминокислотой нет прямого химического соответствия: связь между ними обеспечивает адаптер — тРНК, — и фермент, который присоединяет к этому адаптеру аминокислоту (раздел 2).</p><p>Трансляция — тоже матричный синтез, но, в отличие от репликации и транскрипции, матрица и продукт химически разные: последовательность нуклеотидов переводится в последовательность аминокислот.</p><div class="static-quiz"><h3>В каком направлении рибосома считывает мРНК и в каком растёт полипептид?</h3><ol><li><b>А.</b> мРНК — от 5′ к 3′, полипептид — от N- к C-концу <i>(верный вариант)</i><br><span class="expl">Старт-кодон ближе к 5′-концу; каждая новая аминокислота присоединяется к C-концу цепи.</span></li><li><b>Б.</b> мРНК — от 3′ к 5′, полипептид — от C- к N-концу <i>(неверный вариант)</i><br><span class="expl">Оба направления указаны наоборот.</span></li><li><b>В.</b> мРНК — от 5′ к 3′, полипептид — от C- к N-концу <i>(неверный вариант)</i><br><span class="expl">Новые аминокислоты присоединяются к C-концу, поэтому первым синтезируется N-конец.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 1: условная мРНК из девяти смысловых кодонов и стоп-кодона.</p></details></article><article class="card print-unit" id="ns-genetic-code"><div class="eyebrow">Генетический код и рамка считывания · шаг 2 из 26</div><h2>Генетический код: кодон, стоп-кодоны и вырожденность</h2><p class="lead">Уже известно: мРНК состоит из четырёх нуклеотидов — A, U, G, C. Новое: какому сочетанию нуклеотидов соответствует каждая из 20 аминокислот.</p><div class="note"><strong>Что показывает схема.</strong> GAA и GAG кодируют глутаминовую кислоту — полипептид тот же.</div><ol class="mech"><li><a href="#ns-g-S10-T02">Генетический код</a> триплетный: <a href="#ns-g-S10-T03">кодон</a> — три нуклеотида мРНК. Из 4³ = 64 кодонов 61 кодирует аминокислоты, а UAA, UAG и UGA — <a href="#ns-g-S10-T05">стоп-кодоны</a>.</li><li><a href="#ns-g-S10-T04">AUG</a> кодирует метионин и служит старт-кодоном; внутренние кодоны AUG тоже кодируют метионин.</li><li>Код однозначен: каждый кодон соответствует одной аминокислоте или сигналу терминации (редкое исключение — перекодирование: например, UGA в особом окружении мРНК кодирует селеноцистеин).</li><li>Код <a href="#ns-g-S10-T07">вырожден</a>: большинство аминокислот кодируется несколькими кодонами (до шести); одним кодоном — только метионин и триптофан. Кодоны-синонимы чаще всего различаются третьим нуклеотидом.</li><li>Код почти универсален: у большинства организмов он одинаков, но в митохондриях и у некоторых организмов значение отдельных кодонов иное; например, в митохондриях человека UGA кодирует триптофан.</li></ol><details><summary>Генетический код: кодоны мРНК (5′→3′) каждой аминокислоты</summary><p>Ala — GCU, GCC, GCA, GCG; Arg — CGU, CGC, CGA, CGG, AGA, AGG; Asn — AAU, AAC; Asp — GAU, GAC; Cys — UGU, UGC; Gln — CAA, CAG; Glu — GAA, GAG; Gly — GGU, GGC, GGA, GGG; His — CAU, CAC; Ile — AUU, AUC, AUA; Leu — UUA, UUG, CUU, CUC, CUA, CUG; Lys — AAA, AAG; Met — AUG (старт-кодон); Phe — UUU, UUC; Pro — CCU, CCC, CCA, CCG; Ser — UCU, UCC, UCA, UCG, AGU, AGC; Thr — ACU, ACC, ACA, ACG; Trp — UGG; Tyr — UAU, UAC; Val — GUU, GUC, GUA, GUG; стоп-кодоны — UAA, UAG, UGA.</p></details><p>Почему третий нуклеотид менее важен: при спаривании кодона с антикодоном в третьей позиции допускаются неканонические пары (раздел 2), и одна тРНК может узнавать несколько кодонов-синонимов.</p><p>Пользуйтесь таблицей кода (она есть во вкладке 1 практикума): первый нуклеотид кодона — строка, второй — столбец, третий — строка внутри ячейки. Тот же код по аминокислотам — в раскрываемом блоке выше.</p><div class="static-quiz"><h3>Почему замена третьего нуклеотида кодона часто не меняет аминокислоту?</h3><ol><li><b>А.</b> Третий нуклеотид кодона рибосома вообще не считывает <i>(неверный вариант)</i><br><span class="expl">Третий нуклеотид считывается, но в нём допускаются неканонические пары с антикодоном.</span></li><li><b>Б.</b> Кодоны-синонимы обычно различаются именно третьим нуклеотидом <i>(верный вариант)</i><br><span class="expl">Это следствие вырожденности кода; но не всегда — у некоторых аминокислот синонимов только два или замена даёт стоп-кодон.</span></li><li><b>В.</b> Третий нуклеотид кодона не входит в состав мРНК <i>(неверный вариант)</i><br><span class="expl">Все три нуклеотида кодона — часть мРНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Таблица кода — стандартный ядерный код; код митохондрий в моделях не используется.</p></details></article><article class="card print-unit" id="ns-reading-frame"><div class="eyebrow">Генетический код и рамка считывания · шаг 3 из 26</div><h2>Рамка считывания задаёт старт-кодон</h2><p class="lead">Уже известно: кодон — три нуклеотида. Новое: одну и ту же последовательность можно разбить на кодоны тремя способами; какой из них используется, определяет старт-кодон.</p><div class="note"><strong>Что показывает схема.</strong> Кодоны прочитаны подряд от AUG до UAA; нуклеотиды после стоп-кодона не транслируются.</div><ol class="mech"><li><a href="#ns-g-S10-T06">Рамка считывания</a> — разбиение последовательности на последовательные кодоны. У любой последовательности три возможные рамки в одном направлении.</li><li>При трансляции рамку задаёт старт-кодон: начиная с AUG кодоны читаются подряд, без пропусков и перекрываний, до стоп-кодона.</li><li>Рибосома сохраняет рамку, потому что при каждом цикле сдвигается по мРНК ровно на три нуклеотида (раздел 3).</li><li>Старт-кодон определяется при инициации: обычно это первый AUG от 5′-конца в благоприятном нуклеотидном окружении (раздел 3).</li></ol><p>Пример: последовательность …GCCAUGGCUGAAUGG… в рамке от AUG читается как AUG GCU GAA UGG (Met–Ala–Glu–Trp); сдвинутые на один и на два нуклеотида рамки дали бы совсем другие кодоны.</p><p>Число нуклеотидов кодирующей области от первого нуклеотида старт-кодона до последнего нуклеотида стоп-кодона кратно трём.</p><div class="static-quiz"><h3>Последовательность 5′-…GCAUGUUCUAAG…-3′. Где начинается рамка, в которой транслируется белок, и какие кодоны идут первыми?</h3><ol><li><b>А.</b> С первого нуклеотида G: GCA UGU UCU AAG — аланин, цистеин <i>(неверный вариант)</i><br><span class="expl">Рамка трансляции начинается со старт-кодона, а не с начала записанной последовательности.</span></li><li><b>Б.</b> С любого нуклеотида: рамка определяется случайно <i>(неверный вариант)</i><br><span class="expl">Рамку задаёт старт-кодон, узнанный при инициации.</span></li><li><b>В.</b> С AUG: AUG UUC UAA — метионин, фенилаланин, стоп <i>(верный вариант)</i><br><span class="expl">Рамку задаёт старт-кодон; дальше кодоны читаются подряд по три.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 1.</p></details></article><article class="card print-unit" id="ns-sequence-changes"><div class="eyebrow">Генетический код и рамка считывания · шаг 4 из 26</div><h2>Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции</h2><p class="lead">Уже известно: мутация — изменение последовательности ДНК, которое копируется при репликации (<a href="https://fresll.github.io/bio/seminar-8-route.html#error-damage-mutation">вспомнить БИО-8·1</a>). Новое: что изменение последовательности кодирующей области делает с полипептидом.</p><div class="note"><strong>Что показывает схема.</strong> Стоп-кодон UAA обрывает синтез после второй аминокислоты.</div><ol class="mech"><li><a href="#ns-g-S10-T08">Синонимичная замена</a>: новый кодон кодирует ту же аминокислоту — последовательность полипептида не меняется.</li><li><a href="#ns-g-S10-T09">Миссенс-замена</a>: кодон начинает кодировать другую аминокислоту. Последствия для функции зависят от свойств аминокислоты и её места в белке.</li><li><a href="#ns-g-S10-T10">Нонсенс-замена</a>: смысловой кодон становится стоп-кодоном — синтез обрывается раньше, получается укороченный продукт (раздел 4).</li><li>Вставка или <a href="#ns-g-S10-T12">делеция</a> числа нуклеотидов, не кратного трём, вызывает <a href="#ns-g-S10-T11">сдвиг рамки</a>: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон. Изменение длины, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты.</li></ol><p>Различайте уровни. Изменение последовательности мРНК в модели — это следствие: оно может быть вызвано <a href="#ns-g-S10-T63">мутацией</a> ДНК (передаётся дочерним клеткам и есть во всех мРНК этого гена), ошибкой транскрипции (одна молекула мРНК) или <a href="#ns-g-S10-T64">редактированием РНК</a> (изменением РНК после транскрипции). Ошибка трансляции (раздел 2) меняет отдельные молекулы белка, не затрагивая ни ДНК, ни мРНК.</p><p>Синонимичная замена не обязательно биологически нейтральна: она может нарушить сигнал сплайсинга, изменить стабильность мРНК или скорость трансляции.</p><p>мРНК с преждевременным стоп-кодоном часто разрушается до того, как синтезирует много белка (нонсенс-опосредованный распад мРНК; подробнее — в курсе «Молекулярная биология»).</p><div class="static-quiz"><h3>В кодирующей области вставлены три нуклеотида точно между двумя кодонами. Что произойдёт?</h3><ol><li><b>А.</b> Добавится одна аминокислота; рамка ниже сохранится <i>(верный вариант)</i><br><span class="expl">Если вставка не образовала стоп-кодона, остальная последовательность прежняя.</span></li><li><b>Б.</b> Рамка сдвинется, и стоп-кодон появится раньше <i>(неверный вариант)</i><br><span class="expl">Три нуклеотида — один кодон; рамка не сдвигается.</span></li><li><b>В.</b> Все аминокислоты после вставки изменятся <i>(неверный вариант)</i><br><span class="expl">Это последствие сдвига рамки, которого здесь нет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 1: изменения одного кодона условной мРНК.</p></details></article><article class="card print-unit" id="ns-same-number-of-changes"><div class="eyebrow">Генетический код и рамка считывания · шаг 5 из 26</div><h2>Одинаковое число изменённых нуклеотидов — разные последствия для полипептида</h2><p class="lead">Уже известно: типы изменений и их последствия (БИО-10·4). Новое: от чего зависит, насколько изменится полипептид при изменении одного или трёх нуклеотидов.</p><div class="note"><strong>Что показывает схема.</strong> Вставка после первого нуклеотида кодона 3: полипептид из пяти аминокислот.</div><ol class="mech"><li>Замена третьего нуклеотида синонимична не всегда: у аланина (GCN) годится любой нуклеотид, у лизина — только A или G (AAU и AAC кодируют аспарагин), а UGG → UGA превращает кодон триптофана в стоп-кодон.</li><li>Сдвиг рамки меняет только кодоны ниже места изменения. У начала кодирующей области полипептид обрывается почти сразу; у конца новая рамка может пройти за прежний стоп-кодон в 3′-нетранслируемую область, и полипептид становится длиннее.</li><li>Делеция или вставка трёх нуклеотидов внутри кодона затрагивает два соседних кодона: две аминокислоты заменяются одной (или тремя), иногда возникает стоп-кодон.</li><li>По последовательности аминокислот нельзя однозначно восстановить мРНК: у лейцина, серина и аргинина синонимы различаются даже первым нуклеотидом.</li></ol><p>Обратная задача модели: две мРНК различаются в семи нуклеотидах в четырёх кодонах (UCC/AGC — серин, UUA/CUG — лейцин, AGG/CGU — аргинин, ACA/ACC — треонин), а полипептид одинаков. Разные мРНК обычно транскрибированы с разных последовательностей ДНК; одинаковый белок объясняется вырожденностью кода, и вывод «одинаковый белок — одинаковая ДНК» неверен.</p><p>Функциональную активность белка по числу изменённых аминокислот не предсказать: одна замена в активном центре может выключить фермент, а несколько замен на поверхности — почти не сказаться. Модель активность не рассчитывает.</p><p>Проверьте себя в практикуме: вопрос 1, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Делеция трёх нуклеотидов начинается со второго нуклеотида кодона. Что произойдёт?</h3><ol><li><b>А.</b> Рамка сдвинется, все аминокислоты дальше новые <i>(неверный вариант)</i><br><span class="expl">Удалено три нуклеотида — рамка ниже сохраняется.</span></li><li><b>Б.</b> Рамка сохранится, но вместо двух аминокислот будет одна <i>(верный вариант)</i><br><span class="expl">Оставшиеся нуклеотиды двух кодонов образуют один новый кодон.</span></li><li><b>В.</b> Исчезнет ровно одна аминокислота, остальные не изменятся <i>(неверный вариант)</i><br><span class="expl">Так бывает, только если делеция совпадает с целым кодоном.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Учебная модель: условная мРНК из 12 смысловых кодонов; полипептиды рассчитаны по стандартному коду.</p></details></article><article class="card print-unit" id="ns-synonymous-not-neutral"><div class="eyebrow">Генетический код и рамка считывания · шаг 6 из 26</div><h2>Синонимичные кодоны могут менять количество белка в десятки раз</h2><p class="lead">Уже известно: синонимичная замена не меняет последовательность аминокислот (БИО-10·4). Новое: набор кодонов-синонимов влияет на количество белка, синтезируемого с мРНК.</p><div class="note"><strong>Что показывает схема.</strong> GCU → GCA: аланин остаётся аланином; модель не показывает влияния на количество белка.</div><ol class="mech"><li>В клетках человека сравнили 12 вариантов последовательности, кодирующей один и тот же флуоресцентный белок; варианты различались только кодонами-синонимами.</li><li>Яркость клеток, по которой судили о количестве белка, различалась почти в 50 раз; один вариант вообще не дал заметного белка.</li><li>Важнее оказалось, какие кодоны заменены, а не сколько: вариант, отличавшийся от исходного в 78 кодонах, давал почти столько же белка.</li><li>Яркость вариантов коррелировала со стабильностью мРНК, предсказанной по составу кодонов; вариант без заметного белка авторы объясняют уже другими свойствами последовательности (например, структурой РНК). Кроме того, для 955 мРНК, введённых в эмбрионы рыбы данио, стабильность, предсказанная по составу кодонов, значимо, но слабо коррелировала с измеренной скоростью распада.</li></ol><p>Как это узнали: в клетки человека вводили варианты гена с разными наборами кодонов-синонимов и измеряли свечение белка.</p><p>Граница вывода: в вариантах менялось много кодонов сразу, поэтому о последствиях одной синонимичной замены в конкретном гене эти данные прямо не говорят. Они показывают, что «синонимичная» не значит «неважная» для количества белка.</p><p>Связанная модель — в практикуме: вопрос 1, уровень «Продвинутый» (одинаковое число изменений — разные последствия); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>Два варианта гена кодируют один белок, но различаются кодонами-синонимами; белка с одного из них в клетке в 10 раз меньше. Какое объяснение согласуется с данными этого шага?</h3><ol><li><b>А.</b> Синонимичные кодоны на самом деле кодируют другие аминокислоты <i>(неверный вариант)</i><br><span class="expl">Синонимы по определению кодируют ту же аминокислоту.</span></li><li><b>Б.</b> Это невозможно: синонимичные замены всегда биологически нейтральны <i>(неверный вариант)</i><br><span class="expl">Данные показывают обратное: набор синонимов влияет на количество белка.</span></li><li><b>В.</b> Состав кодонов связан со стабильностью мРНК, а с ней — с количеством белка <i>(верный вариант)</i><br><span class="expl">Последовательность аминокислот та же; данные согласуются с различием в количестве матрицы и белка, но это корреляция, а не доказательство механизма.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41598-022-15526-7">Diez M., Medina-Muñoz S. G., Castellano L. A., da Silva Pescador G., Wu Q., Bazzini A. A. iCodon customizes gene expression based on the codon composition. Sci Rep. 2022;12:12126</a></li></ul><p>Клетки человека линии 293T и эмбрионы рыбы данио; варианты гена флуоресцентного белка.</p></details></article><article class="card print-unit" id="ns-trna-structure"><div class="eyebrow">тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты · шаг 7 из 26</div><h2>тРНК — адаптер между кодоном и аминокислотой</h2><p class="lead">Уже известно: между нуклеотидом и аминокислотой нет прямого химического соответствия (БИО-10·1). Новое: молекула-посредник, у которой один конец «читает» кодон, а другой несёт аминокислоту.</p><div class="note"><strong>Что показывает схема.</strong> Антикодон — внизу, изолейцин — на 3′-конце CCA.</div><ol class="mech"><li><a href="#ns-g-S10-T16">тРНК</a> — короткая РНК длиной около 80 нуклеотидов (чаще всего 76). Внутримолекулярные пары оснований образуют вторичную структуру «клеверный лист», которая сворачивается в компактную L-образную молекулу.</li><li>На одном конце L-образной молекулы — <a href="#ns-g-S10-T17">антикодон</a>: три нуклеотида, спаривающиеся с кодоном мРНК.</li><li>На другом конце — акцепторный 3′-конец с последовательностью CCA; к концевому аденозину присоединяется <a href="#ns-g-S10-T19">аминокислота</a>.</li><li>Антикодон и акцепторный конец разнесены на противоположные концы молекулы, поэтому аминокислота в узнавании кодона не участвует.</li></ol><p>тРНК синтезируется РНК-полимеразой III и проходит процессинг; многие её нуклеотиды химически модифицированы, в том числе в антикодоне, что расширяет возможности спаривания.</p><p>Для одной аминокислоты может быть несколько разных тРНК; у человека видов тРНК с разными антикодонами меньше, чем смысловых кодонов, — одна тРНК может узнавать несколько кодонов-синонимов (БИО-10·8).</p><div class="static-quiz"><h3>Почему тРНК называют адаптером?</h3><ol><li><b>А.</b> Один конец спаривается с кодоном, другой несёт аминокислоту <i>(верный вариант)</i><br><span class="expl">тРНК сопоставляет последовательность нуклеотидов и последовательность аминокислот.</span></li><li><b>Б.</b> Она катализирует образование пептидной связи в рибосоме <i>(неверный вариант)</i><br><span class="expl">Пептидную связь образует рРНК большой субчастицы рибосомы.</span></li><li><b>В.</b> Она переносит мРНК из ядра в цитоплазму через пору <i>(неверный вариант)</i><br><span class="expl">Экспорт мРНК — другой процесс (семинар 9).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 2: условная тРНК изолейцина.</p></details></article><article class="card print-unit" id="ns-codon-anticodon"><div class="eyebrow">тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты · шаг 8 из 26</div><h2>Спаривание кодона и антикодона: антипараллельность и качание</h2><p class="lead">Уже известно: комплементарные цепи нуклеиновых кислот антипараллельны (<a href="https://fresll.github.io/bio/seminar-7-route.html#double-helix">вспомнить БИО-7·2</a>). Новое: как антикодон узнаёт кодон и почему одна тРНК может узнавать несколько кодонов.</p><div class="note"><strong>Что показывает схема.</strong> Три канонические пары.</div><ol class="mech"><li>Кодон и антикодон спариваются антипараллельно: первый нуклеотид кодона (у его 5′-конца) спаривается с третьим нуклеотидом антикодона (у его 3′-конца), а третий нуклеотид кодона — с первым нуклеотидом антикодона.</li><li>Пример: кодон 5′-AUC-3′ и антикодон 5′-GAU-3′; записанный над кодоном от 3′ к 5′, антикодон читается как UAG.</li><li>В первых двух позициях кодона допускаются только канонические пары; в третьей возможны неканонические, например G·U — <a href="#ns-g-S10-T18">качание</a>.</li><li>Поэтому тРНК с G в первой позиции антикодона узнаёт кодоны, оканчивающиеся на C и на U, а кодоны-синонимы чаще всего различаются третьим нуклеотидом.</li></ol><p>Строгость в первых двух позициях обеспечивает декодирующий центр малой субчастицы рибосомы: его рРНК проверяет геометрию пар в этих позициях (раздел 3).</p><p>Записывая антикодон, указывайте концы: «антикодон GAU» без концов легко прочитать в неверном направлении.</p><div class="static-quiz"><h3>Антикодон тРНК 5′-GAU-3′. С каким кодоном он образует пары, если в третьей позиции кодона допускается пара G·U?</h3><ol><li><b>А.</b> Только с GAU <i>(неверный вариант)</i><br><span class="expl">Антикодон не совпадает с кодоном, а комплементарен ему и антипараллелен.</span></li><li><b>Б.</b> С AUC и с AUU <i>(верный вариант)</i><br><span class="expl">G первой позиции антикодона спаривается с C и, при качании, с U третьей позиции кодона.</span></li><li><b>В.</b> С AUC и с GUC <i>(неверный вариант)</i><br><span class="expl">В первой позиции кодона неканоническая пара не допускается: GUC — кодон валина.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 2: кодоны AUC, AUU и GUC против антикодона тРНК изолейцина.</p></details></article><article class="card print-unit" id="ns-synthetases"><div class="eyebrow">тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты · шаг 9 из 26</div><h2>Аминоацил-тРНК-синтетазы соединяют аминокислоту с тРНК</h2><p class="lead">Уже известно: аминокислота присоединяется к 3′-концу тРНК (БИО-10·7). Новое: какой фермент это делает и за счёт чего аминокислота соединяется именно со «своей» тРНК.</p><div class="note"><strong>Что показывает схема.</strong> Изолейцин присоединён к тРНК.</div><ol class="mech"><li><a href="#ns-g-S10-T22">Аминоацил-тРНК-синтетаза</a> катализирует <a href="#ns-g-S10-T23">аминоацилирование</a> тРНК в два этапа: аминокислота + АТФ → аминоациладенилат + пирофосфат; затем аминокислота переносится на 3′-концевой аденозин тРНК, освобождается АМФ.</li><li>Образуется <a href="#ns-g-S10-T24">аминоацил-тРНК</a>: энергия её сложноэфирной связи затем используется при образовании пептидной связи на рибосоме.</li><li>В цитозоле клеток человека для каждой из 20 аминокислот есть своя синтетаза; она присоединяет аминокислоту ко всем тРНК, соответствующим её кодонам. В митохондриях — отдельный набор синтетаз.</li><li>Синтетаза узнаёт и аминокислоту, и тРНК — по антикодону, акцепторному стеблю и другим участкам. Многие синтетазы обладают <a href="#ns-g-S10-T25">корректирующей активностью</a>: ошибочно активированная или ошибочно присоединённая аминокислота гидролизуется.</li></ol><p>Точность аминоацилирования высокая: синтетазы ошибаются примерно один раз на 40 000 присоединений. Особенно трудно различить сходные аминокислоты — например, изолейцин и валин, различающиеся одной метильной группой; здесь работает корректирующая активность.</p><p>Без синтетазы своей аминокислоты тРНК остаётся без аминокислоты, и кодоны этой аминокислоты не декодируются; остальные синтетазы при этом работают.</p><div class="static-quiz"><h3>Что нужно, чтобы образовалась изолейцил-тРНК?</h3><ol><li><b>А.</b> Изолейцин, тРНК, рибосома и ГТФ <i>(неверный вариант)</i><br><span class="expl">Аминоацилирование идёт вне рибосомы, его катализирует синтетаза.</span></li><li><b>Б.</b> Изолейцин, тРНК, фактор элонгации и ГТФ <i>(неверный вариант)</i><br><span class="expl">Энергию для аминоацилирования даёт АТФ.</span></li><li><b>В.</b> Изолейцин, тРНК, своя синтетаза и АТФ <i>(верный вариант)</i><br><span class="expl">АТФ активирует аминокислоту (аминоациладенилат), синтетаза переносит её на тРНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 2: синтетаза изолейцина и АТФ можно убрать.</p></details></article><article class="card print-unit" id="ns-two-steps"><div class="eyebrow">тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты · шаг 10 из 26</div><h2>Соответствие кодона и аминокислоты закрепляется при аминоацилировании</h2><p class="lead">Уже известно: синтетаза соединяет аминокислоту с тРНК, антикодон спаривается с кодоном (БИО-10·8, 10·9). Новое: на каком из этих этапов проверяется, та ли аминокислота встанет в белок.</p><div class="note"><strong>Что показывает схема.</strong> Замен нет.</div><ol class="mech"><li>Первый этап — аминоацилирование: синтетаза узнаёт и аминокислоту, и тРНК.</li><li>Второй этап — декодирование на рибосоме: проверяется только спаривание антикодона с кодоном, а не аминокислота на другом конце тРНК.</li><li>Поэтому если тРНК заряжена неправильной аминокислотой, рибосома встроит её туда, где антикодон спаривается с кодоном.</li><li>Итоговая точность трансляции зависит от обоих этапов; в целом ошибается примерно одна аминокислота на 10 000.</li></ol><p>Ошибки разных этапов различаются по характеру. Ошибка аминоацилирования систематическая по типу: одна и та же замена (например, валин вместо изолейцина) встречается на местах этой аминокислоты во многих белках. Ошибка декодирования разрозненная: разные места, разные аминокислоты.</p><p>Эти ошибки не меняют ни ДНК, ни мРНК: они затрагивают отдельные молекулы белка (<a href="#ns-g-S10-T65">ошибка трансляции</a>) и, в отличие от мутации, не передаются дочерним клеткам.</p><div class="static-quiz"><h3>Почему ошибку синтетазы рибосома не исправляет?</h3><ol><li><b>А.</b> Рибосома проверяет только пару кодон — антикодон, а она правильная <i>(верный вариант)</i><br><span class="expl">Аминокислоту рибосома не проверяет; ошибку исправляет корректирующая активность синтетазы.</span></li><li><b>Б.</b> Рибосома заменяет аминокислоту при транслокации <i>(неверный вариант)</i><br><span class="expl">При транслокации рибосома сдвигается на кодон; аминокислоту она не проверяет.</span></li><li><b>В.</b> Синтетазы не ошибаются, поэтому такой тРНК не бывает <i>(неверный вариант)</i><br><span class="expl">Синтетазы изредка ошибаются, а рибосома не проверяет аминокислоту.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Мысленный эксперимент по модели вкладки 2.</p></details></article><article class="card print-unit" id="ns-mischarged-trna"><div class="eyebrow">тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты · шаг 11 из 26</div><h2>Правильное спаривание не гарантирует правильной аминокислоты: три источника одной замены</h2><p class="lead">Уже известно: аминокислоту на тРНК рибосома не проверяет (БИО-10·10). Новое: как по распределению замен в продуктах отличить ошибку нуклеиновой кислоты, ошибку аминоацилирования и ошибку декодирования — и где такой вывод заканчивается.</p><div class="note"><strong>Что показывает схема.</strong> Валин в позиции 6 у всех молекул.</div><ol class="mech"><li>Изменение последовательности мРНК (например, AUC → GUC в кодоне 6) даёт одну и ту же замену в одной позиции у всех молекул, транслированных с этой мРНК.</li><li>Ошибка аминоацилирования (валин на тРНК изолейцина при нарушенной коррекции) может вызывать однотипные замены в разных белках, содержащих изолейцин, — в части молекул, если при трансляции используется неправильно аминоацилированная тРНК.</li><li>Ошибка декодирования даёт разрозненные замены — в разных местах, разные аминокислоты.</li><li>Корректирующая активность синтетаз удаляет большую часть ошибочно присоединённых аминокислот, поэтому не всякая ошибка активации доходит до белка.</li></ol><p>Обратная задача модели: в части молекул белка в позиции 6 стоит валин вместо изолейцина, а другие позиции не исследованы. Это совместимо и с ошибкой синтетазы, и с изменением одной из двух копий гена, и (реже) со случайными ошибками. Различат их распределение валина по другим местам изолейцина и в других белках, последовательность мРНК и гена, активность синтетазы.</p><p>Модель условная: частоты ошибок увеличены во много раз, чтобы их было видно на десяти молекулах.</p><p>Проверьте себя в практикуме: вопрос 2, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Во многих белках клетки встречается одна и та же замена: валин на местах изолейцина, в части молекул. Последовательности генов не изменены. Какая причина наиболее вероятна?</h3><ol><li><b>А.</b> Мутация гена одного из этих белков <i>(неверный вариант)</i><br><span class="expl">Мутация одного гена не объясняет замены во многих белках, а гены не изменены.</span></li><li><b>Б.</b> Нарушена корректирующая активность синтетазы <i>(верный вариант)</i><br><span class="expl">Замена одного типа на местах одной аминокислоты во многих белках указывает на ошибку аминоацилирования.</span></li><li><b>В.</b> Случайные ошибки декодирования на рибосоме <i>(неверный вариант)</i><br><span class="expl">Ошибки декодирования разрозненные: разные места и разные аминокислоты.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Учебная модель: 10 условных молекул из 11 аминокислот; изолейцин — в позициях 3, 6 и 10.</p></details></article><article class="card print-unit" id="ns-editing-mitochondria"><div class="eyebrow">тРНК и аминоацилирование: где закрепляется соответствие кодона и аминокислоты · шаг 12 из 26</div><h2>Без корректирующей активности синтетазы серин встаёт на места треонина в белках митохондрий</h2><p class="lead">Уже известно: корректирующая активность синтетазы удаляет ошибочно присоединённые аминокислоты (БИО-10·9). Новое: что происходит, если корректирующий центр синтетазы выключить, — на примере митохондрий.</p><div class="note"><strong>Что показывает схема.</strong> Модель вкладки 2: валин на тРНК изолейцина встаёт на места изолейцина.</div><ol class="mech"><li>В клетках мыши в корректирующем центре митохондриальной треонил-тРНК-синтетазы заменили две аминокислоты.</li><li>Около 3,4 % митохондриальной тРНК треонина оказалось ошибочно заряжено серином; в клетках с нормальным ферментом такой тРНК не нашли.</li><li>Рибосомы митохондрий встраивали серин на места треонина: в 10 исследованных белках, синтезируемых в митохондриях, на 81 кодон треонина нашли 16 замен — в 7 белках (авторы оценивают долю замен примерно в 20 % и просят осторожности: исследованных участков белков немного).</li><li>Работа дыхательной цепи нарушалась, клетки делились медленнее и чаще задерживались в фазе G0/G1; у мышей с таким дефектом в сердце развивалась кардиомиопатия.</li></ol><p>Как это узнали: в клетках мыши изменили ген синтетазы и определили, какие аминокислоты стоят в белках митохондрий; у мышей дефект создали только в клетках сердца.</p><p>Граница вывода: работа показывает, что ошибочно заряженная тРНК используется рибосомой, когда коррекция нарушена, и что митохондриям нужна высокая точность трансляции. Она не говорит, сколько таких ошибок бывает в норме, и описывает одну синтетазу в одной системе.</p><p>Связанная модель — в практикуме: вопрос 2, уровень «Продвинутый» (правильное спаривание не гарантирует правильной аминокислоты); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>Почему серин оказался именно на местах треонина?</h3><ol><li><b>А.</b> Изменились кодоны треонина в мРНК <i>(неверный вариант)</i><br><span class="expl">Изменён ген синтетазы, а не кодоны белков.</span></li><li><b>Б.</b> Рибосома путает кодоны треонина и серина <i>(неверный вариант)</i><br><span class="expl">Ошибка возникла при аминоацилировании, а не при декодировании.</span></li><li><b>В.</b> Серин присоединялся к тРНК треонина <i>(верный вариант)</i><br><span class="expl">Рибосома проверяет антикодон, а не аминокислоту.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.2309714120">Zheng W.-Q., Zhang J.-H., Li Z.-H. et al. Mammalian mitochondrial translation infidelity leads to oxidative stress–induced cell cycle arrest and cardiomyopathy. Proc Natl Acad Sci USA. 2023;120:e2309714120</a></li></ul><p>Фибробласты мыши (линия NIH3T3) и мыши с дефектом в клетках сердца.</p></details></article><article class="card print-unit" id="ns-ribosome"><div class="eyebrow">Рибосомный цикл: инициация, элонгация, терминация · шаг 13 из 26</div><h2>Рибосома: две субчастицы и три участка связывания тРНК</h2><p class="lead">Уже известно: рибосомы состоят из рРНК и белков; рРНК синтезируется, а субчастицы рибосом собираются в ядрышке. Новое: как устроена рибосома и где в ней происходит декодирование и образование пептидной связи. Раздел относится к вопросу 13 коллоквиума 2 (предварительный список) и вопросу 22 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Аминоацил-тРНК в A-сайте, метионин на тРНК в P-сайте.</div><ol class="mech"><li><a href="#ns-g-S10-T26">Рибосома</a> эукариот (80S) состоит из <a href="#ns-g-S10-T27">малой (40S)</a> и <a href="#ns-g-S10-T28">большой (60S)</a> субчастиц; каждая — комплекс рРНК и многих белков. Вне трансляции субчастицы разделены и объединяются на мРНК при инициации.</li><li>В малой субчастице находится декодирующий центр: здесь антикодон тРНК спаривается с кодоном, и рРНК проверяет правильность пар в первых двух позициях.</li><li>В большой субчастице находится <a href="#ns-g-S10-T32">пептидилтрансферазный центр</a>: его образует рРНК — рибосома является рибозимом. Растущая цепь выходит через туннель большой субчастицы.</li><li>Три участка связывания тРНК при записи мРНК 5′→3′ слева направо расположены так: [[g:siteE|E]] — [[g:siteP|P]] — [[g:siteA|A]] (в отечественных учебниках — Е-, П- и А-сайты, или центры: П — пептидильный, А — аминоацильный). В A-сайт входит аминоацил-тРНК, в P-сайте находится тРНК с растущей цепью, через E-сайт тРНК без аминокислоты покидает рибосому.</li></ol><p>Рибосомные белки в основном находятся на поверхности и стабилизируют структуру рРНК; химию образования пептидной связи обеспечивает рРНК.</p><p>Обозначения сайтов: A — аминоацильный, P — пептидильный (от пептидил-тРНК), E — выходной.</p><div class="static-quiz"><h3>В каком порядке расположены участки связывания тРНК, если мРНК записана от 5′ к 3′ слева направо?</h3><ol><li><b>А.</b> E — P — A <i>(верный вариант)</i><br><span class="expl">A-сайт ближе к 3′-концу: в него входит тРНК для следующего кодона.</span></li><li><b>Б.</b> A — P — E <i>(неверный вариант)</i><br><span class="expl">Порядок обратный: следующий кодон находится с 3′-стороны, над ним — A-сайт.</span></li><li><b>В.</b> P — A — E <i>(неверный вариант)</i><br><span class="expl">Растущая цепь на тРНК в P-сайте, новая аминоацил-тРНК — в A-сайте с 3′-стороны, E — с 5′-стороны.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 3: рибосома на мРНК 5′…AUG CAC UGG GAA UGA…3′.</p></details></article><article class="card print-unit" id="ns-initiation"><div class="eyebrow">Рибосомный цикл: инициация, элонгация, терминация · шаг 14 из 26</div><h2>Инициация: малая субчастица находит старт-кодон, инициаторная тРНК — в P-сайте</h2><p class="lead">Уже известно: зрелая мРНК несёт 5′-кэп и поли(А)-хвост (<a href="https://fresll.github.io/bio/seminar-9-route.html#capping">вспомнить БИО-9·14</a>). Новое: как рибосома находит старт-кодон и почему инициаторная тРНК оказывается в P-сайте.</p><div class="note"><strong>Что показывает схема.</strong> Инициаторная Met-тРНК в P-сайте напротив AUG; A-сайт свободен.</div><ol class="mech"><li><a href="#ns-g-S10-T33">Инициаторная тРНК</a> с метионином вместе с фактором инициации eIF2 и ГТФ и другими <a href="#ns-g-S10-T36">факторами инициации</a> связывается с малой субчастицей ещё до её присоединения к мРНК.</li><li>Комплекс eIF4F узнаёт 5′-кэп и привлекает малую субчастицу к 5′-концу мРНК; поли(А)-связывающий белок, взаимодействуя с eIF4G, сближает концы мРНК и повышает эффективность инициации.</li><li>Малая субчастица движется по 5′-нетранслируемой области от 5′ к 3′ (сканирование); хеликаза eIF4A расплетает вторичную структуру.</li><li>Когда антикодон инициаторной тРНК спаривается со старт-кодоном AUG, сканирование останавливается, факторы уходят, присоединяется большая субчастица — образуется рибосома 80S. Инициаторная тРНК находится в P-сайте, A-сайт свободен для первой элонгаторной аминоацил-тРНК.</li></ol><p>Узнавание старт-кодона зависит от <a href="#ns-g-S10-T35">окружения</a>: у позвоночных наиболее важны пурин (A или G) в положении −3 и G в положении +4 (A в AUG — положение +1). В слабом окружении часть малых субчастиц проходит первый AUG и начинает трансляцию со следующего.</p><p>Инициаторная тРНК отличается по последовательности от тРНК, несущей метионин для внутренних кодонов AUG: её узнают факторы инициации, и в A-сайт она не поступает.</p><p>Инициация — наиболее регулируемый этап трансляции: изменяя её, клетка меняет количество синтезируемого белка (семинар 11).</p><div class="static-quiz"><h3>Малая субчастица сканирует 5′-нетранслируемую область. Что остановит её на старт-кодоне?</h3><ol><li><b>А.</b> Связывание фактора терминации с мРНК <i>(неверный вариант)</i><br><span class="expl">Фактор терминации узнаёт стоп-кодоны в конце синтеза.</span></li><li><b>Б.</b> Спаривание антикодона инициаторной тРНК с AUG <i>(верный вариант)</i><br><span class="expl">Инициаторная тРНК уже связана с малой субчастицей; узнавание AUG останавливает сканирование.</span></li><li><b>В.</b> Первый же кодон после кэпа, каким бы он ни был <i>(неверный вариант)</i><br><span class="expl">Сканирование идёт до AUG, обычно первого в благоприятном окружении.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 3, этап 1.</p></details></article><article class="card print-unit" id="ns-elongation-cycle"><div class="eyebrow">Рибосомный цикл: инициация, элонгация, терминация · шаг 15 из 26</div><h2>Цикл элонгации: вход в A-сайт, пептидная связь, транслокация</h2><p class="lead">Уже известно: инициаторная тРНК в P-сайте, A-сайт свободен (БИО-10·14). Новое: повторяющийся цикл, который удлиняет полипептид на одну аминокислоту.</p><div class="note"><strong>Что показывает схема.</strong> His-тРНК вошла в A-сайт.</div><ol class="mech"><li>1. Вход: фактор элонгации <a href="#ns-g-S10-T38">eEF1A</a> с ГТФ доставляет аминоацил-тРНК в A-сайт. Удерживается только тРНК, антикодон которой спарен с кодоном; рибосома проверяет пару дважды — до и после гидролиза ГТФ, — и неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.</li><li>2. <a href="#ns-g-S10-T15">Пептидная связь</a>: аминогруппа аминокислоты в A-сайте атакует связь растущей цепи с тРНК в P-сайте. Цепь переносится на тРНК в A-сайте и удлиняется на один остаток у C-конца; тРНК в P-сайте остаётся без аминокислоты.</li><li>3. <a href="#ns-g-S10-T40">Транслокация</a>: фактор <a href="#ns-g-S10-T39">eEF2</a> за счёт гидролиза ГТФ сдвигает рибосому на один кодон (три нуклеотида) к 3′-концу. тРНК с цепью переходит из A- в P-сайт, тРНК без аминокислоты — из P- в E-сайт и затем покидает рибосому.</li><li>A-сайт освобождается над следующим кодоном, и цикл повторяется. Сдвиг ровно на три нуклеотида сохраняет рамку считывания.</li></ol><p>Энергия для образования пептидной связи запасена в сложноэфирной связи аминоацил-тРНК; ГТФ расходуют факторы элонгации — на точность отбора и на направленное движение рибосомы.</p><p>Рибосома эукариот присоединяет несколько аминокислот в секунду; синтез большинства белков занимает от 20 секунд до нескольких минут.</p><div class="static-quiz"><h3>Сразу после образования пептидной связи где находится растущая цепь?</h3><ol><li><b>А.</b> На тРНК в P-сайте <i>(неверный вариант)</i><br><span class="expl">До образования связи — да; после — цепь на тРНК в A-сайте.</span></li><li><b>Б.</b> На тРНК в E-сайте <i>(неверный вариант)</i><br><span class="expl">В E-сайт попадает тРНК без аминокислоты.</span></li><li><b>В.</b> На тРНК в A-сайте <i>(верный вариант)</i><br><span class="expl">Цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте; затем транслокация переведёт эту тРНК в P-сайт.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 3, этапы 2–4.</p></details></article><article class="card print-unit" id="ns-termination-polysome"><div class="eyebrow">Рибосомный цикл: инициация, элонгация, терминация · шаг 16 из 26</div><h2>Терминация и полисома</h2><p class="lead">Уже известно: стоп-кодонам не соответствует ни одна тРНК с полностью комплементарным антикодоном (БИО-10·2). Новое: что происходит, когда стоп-кодон оказывается в A-сайте.</p><div class="note"><strong>Что показывает схема.</strong> Стоп-кодон UGA в A-сайте.</div><ol class="mech"><li>Стоп-кодон в A-сайте узнаёт белковый <a href="#ns-g-S10-T42">фактор терминации eRF1</a>; по форме он напоминает тРНК и узнаёт все три стоп-кодона. Он действует вместе с eRF3, связывающим ГТФ.</li><li>Пептидилтрансферазный центр присоединяет к пептидил-тРНК воду вместо аминокислоты: связь полипептида с тРНК гидролизуется, и полипептид освобождается.</li><li>Затем рибосома отделяется от мРНК, субчастицы расходятся и используются в новых циклах трансляции.</li><li>Одну мРНК одновременно транслируют несколько рибосом — <a href="#ns-g-S10-T43">полисома</a>; соседние рибосомы могут располагаться всего примерно через 80 нуклеотидов друг от друга. Так с одной мРНК за то же время синтезируется гораздо больше белка.</li></ol><p>В модели без фактора терминации полипептид за время наблюдения остаётся связанным с тРНК в P-сайте, и рибосома не освобождается. В клетках человека при нехватке eRF1 усиливается и прочитывание стоп-кодона: тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется; этот исход модель не показывает.</p><p>Преждевременный стоп-кодон узнаётся так же, как обычный, — освобождается укороченный полипептид (раздел 4).</p><div class="static-quiz"><h3>Что присоединяется к пептидил-тРНК при терминации вместо аминокислоты?</h3><ol><li><b>А.</b> Вода: связь цепи с тРНК гидролизуется <i>(верный вариант)</i><br><span class="expl">Поэтому C-конец полипептида освобождается от тРНК.</span></li><li><b>Б.</b> Особая аминокислота, кодируемая стоп-кодоном <i>(неверный вариант)</i><br><span class="expl">Стоп-кодон не кодирует аминокислоту.</span></li><li><b>В.</b> ГТФ, который присоединяется к цепи <i>(неверный вариант)</i><br><span class="expl">ГТФ связывает eRF3; к цепи присоединяется вода.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li><li><a href="https://doi.org/10.1093/nar/gkh791">Janzen D. M., Geballe A. P. The effect of eukaryotic release factor depletion on translation termination in human cell lines. Nucleic Acids Res. 2004;32:4491–4502</a></li></ul><p>Схема шага — модель вкладки 3, этапы 5–6.</p></details></article><article class="card print-unit" id="ns-ribosome-flow"><div class="eyebrow">Рибосомный цикл: инициация, элонгация, терминация · шаг 17 из 26</div><h2>Больше рибосом на мРНК — не всегда больше белка</h2><p class="lead">Уже известно: одну мРНК транслируют несколько рибосом (БИО-10·16). Новое: от чего зависит число рибосом на мРНК и число завершённых полипептидов и почему они могут меняться в разные стороны.</p><div class="note"><strong>Что показывает схема.</strong> Рибосом мало, распределены редко; завершено 15.</div><ol class="mech"><li>Число рибосом, начавших синтез, равно сумме завершивших синтез и ещё находящихся на мРНК.</li><li>Поток завершённых полипептидов определяется самым медленным этапом: инициацией или прохождением участка мРНК, где рибосомы задерживаются (например, кодона, для которого мало аминоацил-тРНК).</li><li>Если ограничивает инициация, рибосом на мРНК мало и они распределены редко. Если ограничивает элонгация на участке, рибосомы скапливаются перед ним и дольше остаются на мРНК, а завершённых полипептидов меньше; начало мРНК оказывается занятым, и часть возможных инициаций не состоится. Число рибосом на мРНК при этом может и вырасти (в модели — 9 вместо 7 при инициации раз в 16 ед.), и уменьшиться (9 вместо 12 при инициации раз в 8 ед.).</li><li>Поэтому по числу рибосом на мРНК нельзя напрямую судить о количестве синтезируемого белка; это не универсальный количественный закон.</li></ol><p>Обратная задача модели: в двух клетках за одно время завершено по 15 полипептидов. В клетке с редкой инициацией на мРНК 3 рибосомы, распределённые редко; в клетке с нехваткой аминоацил-тРНК для кодона 80 — 9 рибосом, 8 из них до этого кодона, и многие инициации не состоялись. Различить причины помогают число и распределение рибосом и проверка — добавление нужной аминоацил-тРНК ускорит синтез только во второй клетке.</p><p>Модель детерминированная и условная: время в условных единицах, рибосома занимает 10 кодонов, все рибосомы одинаковы.</p><p>Проверьте себя в практикуме: вопрос 3, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>На мРНК стало вдвое больше рибосом, а завершённых полипептидов — меньше. Что наиболее вероятно?</h3><ol><li><b>А.</b> Инициация стала чаще, белка станет больше <i>(неверный вариант)</i><br><span class="expl">Тогда росло бы и число завершённых полипептидов.</span></li><li><b>Б.</b> Рибосомы задерживаются на участке мРНК <i>(верный вариант)</i><br><span class="expl">При ограничении элонгации рибосомы дольше остаются на мРНК, но реже завершают синтез.</span></li><li><b>В.</b> Инициация стала реже, чем раньше <i>(неверный вариант)</i><br><span class="expl">Тогда рибосом на мРНК стало бы меньше.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Учебная модель: кодирующая область 120 кодонов, наблюдение — 600 условных единиц времени.</p></details></article><article class="card print-unit" id="ns-initiation-diversity"><div class="eyebrow">Рибосомный цикл: инициация, элонгация, терминация · шаг 18 из 26</div><h2>Инициация — самый разнообразный и наиболее регулируемый этап трансляции</h2><p class="lead">Уже известно: малая субчастица привлекается к кэпу и сканирует 5′-НТО (БИО-10·14). Новое: элонгация и терминация у разных мРНК идут с общим набором факторов, а инициация — разными путями.</p><div class="note"><strong>Что показывает схема.</strong> Инициаторная тРНК в P-сайте напротив AUG.</div><ol class="mech"><li>Инициация — наиболее регулируемый и самый разнообразный этап трансляции: элонгацию и терминацию мРНК проходят с общим набором факторов, а для инициации могут использовать разные наборы.</li><li>По строению комплекса малой субчастицы человека с факторами инициации на мРНК связанный с кэпом комплекс eIF4F располагается со стороны 5′-конца мРНК. Чтобы старт-кодон оказался в P-сайте, он должен отстоять от 5′-конца не менее чем примерно на 40 нуклеотидов.</li><li>Обычная 5′-НТО длиннее: медиана её длины у человека — 218 нуклеотидов, у пекарских дрожжей — 53.</li><li>мРНК с очень короткой 5′-НТО (около 4 % белок-кодирующих генов несут особые элементы для такой инициации), по-видимому, начинают трансляцию другим путём.</li></ol><p>Как это узнали: обзор обобщает структурные работы, в которых определили пространственное строение комплекса малой субчастицы рибосомы человека с факторами инициации и мРНК, и биохимические данные о минимальном расстоянии от кэпа до старт-кодона.</p><p>Граница вывода: в других работах трансляция начиналась и с AUG, стоящего всего в двух нуклеотидах от кэпа, поэтому вопрос о минимальном расстоянии не решён окончательно. Обзор описывает механизм, но не измеряет, насколько часто инициация ограничивает синтез конкретного белка.</p><p>Связанная модель — в практикуме: вопрос 3, уровень «Продвинутый» (поток рибосом по мРНК); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>Чем инициация отличается от элонгации и терминации по набору факторов?</h3><ol><li><b>А.</b> Для инициации факторы белковой природы не нужны <i>(неверный вариант)</i><br><span class="expl">Инициацию обеспечивают многочисленные факторы инициации (eIF).</span></li><li><b>Б.</b> Набор факторов одинаков, различается только скорость <i>(неверный вариант)</i><br><span class="expl">Наборы факторов инициации у разных мРНК могут различаться, а у элонгации — нет.</span></li><li><b>В.</b> Для инициации разные мРНК используют разные наборы факторов <i>(верный вариант)</i><br><span class="expl">Элонгацию и терминацию все мРНК проходят с общим набором факторов; инициация — самый разнообразный этап.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00624-9">Brito Querido J., Díaz-López I., Ramakrishnan V. The molecular basis of translation initiation and its regulation in eukaryotes. Nat Rev Mol Cell Biol. 2024;25:168–186</a></li></ul><p>Обзор структурных и биохимических данных (клетки и белки человека и дрожжей).</p></details></article><article class="card print-unit" id="ns-release-truncated"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 19 из 26</div><h2>Полноразмерный и укороченный продукт</h2><p class="lead">Уже известно: стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается (БИО-10·16). Новое: что получается, если стоп-кодон встретился раньше обычного. Раздел относится к вопросу 13 коллоквиума 2 (предварительный список) и вопросу 25 зачёта.</p><div class="note"><strong>Что показывает схема.</strong> Оба домена свёрнуты — белок активен.</div><ol class="mech"><li>Преждевременный стоп-кодон (после нонсенс-замены или сдвига рамки) узнаётся фактором терминации так же, как обычный: освобождается <a href="#ns-g-S10-T46">укороченный полипептид</a>.</li><li><a href="#ns-g-S10-T45">Полноразмерный полипептид</a> — продукт, синтез которого закончился на обычном стоп-кодоне.</li><li>Будет ли укороченный продукт работать и сохранится ли он, зависит от того, какие части белка успели синтезироваться и свернуться: продукт без одного домена может быть устойчивым и частично активным, а оборванный посреди домена — не свернуться и разрушиться.</li><li>Не каждый укороченный белок разрушается и не каждый полностью теряет активность.</li></ol><p>В клетке мРНК с преждевременным стоп-кодоном часто разрушается (нонсенс-опосредованный распад мРНК), и укороченного белка образуется мало. Насколько эффективно это происходит, зависит от положения стоп-кодона и от других особенностей мРНК, поэтому преждевременный стоп-кодон не гарантирует ни отсутствия белка, ни его присутствия (подробнее — курс «Молекулярная биология»).</p><p>В модели вкладки 4 рассматривается только белок.</p><div class="static-quiz"><h3>Стоп-кодон появился внутри кодирующей области. Как освобождается укороченный полипептид?</h3><ol><li><b>А.</b> Стоп-кодон в A-сайте узнаёт фактор терминации <i>(верный вариант)</i><br><span class="expl">Для рибосомы преждевременный стоп-кодон не отличается от обычного.</span></li><li><b>Б.</b> Его отрезает протеаза от полноразмерного белка <i>(неверный вариант)</i><br><span class="expl">Полноразмерный белок здесь не синтезируется: синтез обрывается.</span></li><li><b>В.</b> Рибосома не может освободить укороченную цепь <i>(неверный вариант)</i><br><span class="expl">Цепь освобождается при терминации.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 4: условный белок из двух доменов (420 аминокислот).</p></details></article><article class="card print-unit" id="ns-folding-chaperones"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 20 из 26</div><h2>Сворачивание белка начинается ещё во время синтеза</h2><p class="lead">Уже известно: последовательность аминокислот определяет пространственную структуру белка. Новое: когда и с чьей помощью новый полипептид принимает рабочую структуру.</p><div class="note"><strong>Что показывает схема.</strong> Домен 1 свернулся во время синтеза домена 2.</div><ol class="mech"><li><a href="#ns-g-S10-T47">Сворачивание</a> начинается, когда цепь выходит из туннеля рибосомы: N-концевой <a href="#ns-g-S10-T48">домен</a> может свернуться, пока синтезируется C-концевая часть, — котрансляционно.</li><li>Многим белкам для правильного сворачивания нужны <a href="#ns-g-S10-T54">молекулярные шапероны</a>: они не задают структуру, а связывают несвёрнутые участки и мешают цепи слипаться с другими цепями.</li><li><a href="#ns-g-S10-T53">Hsp70</a>, часть которых связана с рибосомой, связывают короткие гидрофобные участки выходящей цепи и с затратой АТФ помогают ей свернуться.</li><li>Шаперонины (в цитозоле — TRiC/CCT, в митохондриях — Hsp60) образуют полость, в которой сворачиваются отдельные белки, например актин и тубулин.</li></ol><p>В правильно свёрнутом белке гидрофобные аминокислоты в основном спрятаны внутри. <a href="#ns-g-S10-T50">Гидрофобный участок на поверхности</a> — признак несвёрнутой или неправильно свёрнутой цепи.</p><p>Белки, синтезируемые на мембране эндоплазматического ретикулума, сворачиваются в его полости при участии своих шаперонов (семинар 4).</p><div class="static-quiz"><h3>Верно ли, что сворачивание белка всегда начинается только после окончания трансляции?</h3><ol><li><b>А.</b> Да: свернуться может только полный полипептид <i>(неверный вариант)</i><br><span class="expl">Домены сворачиваются относительно независимо, по мере выхода из рибосомы.</span></li><li><b>Б.</b> Нет: N-концевой домен сворачивается ещё во время синтеза <i>(верный вариант)</i><br><span class="expl">Сворачивание начинается при выходе цепи из рибосомы.</span></li><li><b>В.</b> Да: шапероны не допускают сворачивания во время синтеза <i>(неверный вариант)</i><br><span class="expl">Шапероны связывают выходящую цепь, чтобы она свернулась правильно, а не чтобы задержать сворачивание.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 4.</p></details></article><article class="card print-unit" id="ns-ptm"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 21 из 26</div><h2>Посттрансляционные модификации и созревание белка</h2><p class="lead">Уже известно: белки, направляемые в эндоплазматический ретикулум, гликозилируются и проходят аппарат Гольджи (семинар 4). Новое: синтезированный и свёрнутый полипептид может стать функционально активным белком только после дополнительных изменений.</p><div class="note"><strong>Что показывает схема.</strong> Свёрнутый полноразмерный белок — исходная точка созревания.</div><ol class="mech"><li><a href="#ns-g-S10-T55">Посттрансляционные модификации</a> — изменения белка во время синтеза или после него.</li><li>N-концевой метионин у многих белков отщепляется вскоре после синтеза.</li><li>К белку могут присоединяться фосфатные группы (фосфорилирование), олигосахариды (гликозилирование в эндоплазматическом ретикулуме и аппарате Гольджи), липиды; некоторые белки активируются после протеолитического расщепления.</li><li>Многие белки работают только в составе комплекса из нескольких субъединиц: одна свёрнутая субъединица ещё не активный белок.</li></ol><p>Модификации и сборка — ещё одна причина, по которой количество синтезированного полипептида не равно количеству функционально активного белка.</p><p>Подробности модификаций в секреторном пути — семинар 4; регуляция активности белков фосфорилированием — далее в курсе.</p><div class="static-quiz"><h3>Полипептид синтезирован и свернулся, но фермент неактивен. Какая причина возможна?</h3><ol><li><b>А.</b> Ошибка в самом генетическом коде клетки <i>(неверный вариант)</i><br><span class="expl">Код при трансляции не меняется.</span></li><li><b>Б.</b> Полипептид синтезирован от C- к N-концу <i>(неверный вариант)</i><br><span class="expl">Синтез всегда идёт от N- к C-концу.</span></li><li><b>В.</b> Не хватает модификации или партнёров по комплексу <i>(верный вариант)</i><br><span class="expl">Многим белкам для активности нужны модификации или сборка с другими субъединицами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Обзорный шаг; в моделях семинара модификации не изображены.</p></details></article><article class="card print-unit" id="ns-quality-control"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 22 из 26</div><h2>Контроль качества: шапероны, убиквитин и протеасома</h2><p class="lead">Уже известно: белки клетки удаляют убиквитин-протеасомная система и аутофагия (семинар 5). Новое: что происходит с полипептидом, который не удалось свернуть.</p><div class="note"><strong>Что показывает схема.</strong> Цепь помечена убиквитином и разрушена.</div><ol class="mech"><li><a href="#ns-g-S10-T56">Контроль качества белков</a> начинается с шаперонов: они связывают открытые гидрофобные участки и дают цепи возможность свернуться повторно.</li><li>Если свернуть цепь не удаётся, <a href="#ns-g-S10-T58">убиквитинлигаза</a> вместе с ферментами E1 и E2 присоединяет к ней цепь <a href="#ns-g-S10-T57">убиквитина</a>.</li><li>Полиубиквитинированный белок разворачивает и расщепляет <a href="#ns-g-S10-T59">протеасома</a> (26S) на короткие пептиды.</li><li>Если удаление не справляется, неправильно свёрнутые белки накапливаются и могут образовывать <a href="#ns-g-S10-T60">агрегаты</a>, нарушающие работу клетки.</li></ol><p>Узнаётся не длина белка, а признаки неправильного сворачивания: укороченный, но свёрнутый продукт может сохраняться, а полноразмерный неправильно свёрнутый — разрушаться.</p><p>Количество белка в клетке определяется балансом синтеза и удаления; поддержание набора правильно свёрнутых белков называют <a href="#ns-g-S10-T62">протеостазом</a> (курс «Молекулярная биология»).</p><div class="static-quiz"><h3>Что произойдёт с несвёрнутым полипептидом, если протеасома подавлена, а убиквитинлигаза действует?</h3><ol><li><b>А.</b> Он накопится с меткой убиквитина и может образовать агрегаты <i>(верный вариант)</i><br><span class="expl">Убиквитинлигаза метит цепь, но без протеасомы помеченная цепь не разрушается; подавление удаления не исправляет дефекта сворачивания.</span></li><li><b>Б.</b> Он со временем свернётся правильно <i>(неверный вариант)</i><br><span class="expl">Протеасома не участвует в сворачивании.</span></li><li><b>В.</b> Его разрушит рибосома после синтеза <i>(неверный вариант)</i><br><span class="expl">Рибосома синтезирует белки, а не разрушает их.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Схема шага — модель вкладки 4.</p></details></article><article class="card print-unit" id="ns-synthesized-vs-active"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 23 из 26</div><h2>Синтезированный, полноразмерный и функционально активный белок — разные показатели</h2><p class="lead">Уже известно: преждевременная терминация, сворачивание и контроль качества (БИО-10·19–10·22). Новое: как эти процессы вместе разделяют четыре показателя и почему одинаковая активность может скрывать разные механизмы.</p><div class="note"><strong>Что показывает схема.</strong> Синтезировано 100, активно 72.</div><ol class="mech"><li>Синтезировано S полипептидов; часть синтезов завершается преждевременно, остальные дают полноразмерные цепи.</li><li>Часть полноразмерных цепей сворачивается неправильно; система контроля качества удаляет часть аномальных форм, а правильно свёрнутый белок постоянно обновляется.</li><li>Сумма всех форм — сохранившихся и удалённых — равна числу синтезированных полипептидов.</li><li>Функционально активен только правильно свёрнутый и не удалённый белок; количество белка и активность могут изменяться в разные стороны.</li></ol><p>Обратная задача модели: в двух клетках одинаковая активность (18), но белка 19 и 81. Клетка 1 синтезирует вдвое меньше и быстро обновляет белок; в клетке 2 70 % цепей сворачиваются неправильно и почти не удаляются. Вывод «мало активности — значит мало синтеза» неверен без измерения количества белка и его форм.</p><p>Модель условная: доли заданы, числа округлены до целых; укороченные и неправильно свёрнутые формы в ней неактивны.</p><p>Проверьте себя в практикуме: вопрос 4, уровень «Продвинутый» — там эта модель с переключателями, сценарием и обратной задачей.</p><div class="static-quiz"><h3>Белка в клетке много, а его активность низкая. Какое объяснение согласуется с этим?</h3><ol><li><b>А.</b> Белок в этой клетке мало синтезируется <i>(неверный вариант)</i><br><span class="expl">Тогда белка было бы мало.</span></li><li><b>Б.</b> Много белка неправильно свёрнуто и не удаляется <i>(верный вариант)</i><br><span class="expl">Неактивные формы увеличивают количество белка, но не активность.</span></li><li><b>В.</b> Белок в этой клетке быстро разрушается <i>(неверный вариант)</i><br><span class="expl">Тогда белка тоже было бы мало.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Учебная модель: условный период, 100 или 50 синтезированных полипептидов.</p></details></article><article class="card print-unit" id="ns-cotranslational-assembly"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 24 из 26</div><h2>Субъединицы белкового комплекса начинают собираться ещё во время трансляции</h2><p class="lead">Уже известно: многим белкам для активности нужны партнёры по комплексу (БИО-10·21). Новое: сборка комплекса может начинаться, пока обе субъединицы ещё синтезируются на рибосомах.</p><div class="note"><strong>Что показывает схема.</strong> Модель вкладки 4: активного белка меньше, чем синтезированного.</div><ol class="mech"><li>Каталитическое ядро фермента, который метилирует РНК, образуют две субъединицы. Растущая цепь одной из них связывается с растущей цепью другой, пока обе ещё на рибосомах.</li><li>В клетках человека при снижении количества одной субъединицы количество белка другой резко падало, хотя её мРНК не менялась; подавление протеасомы и лизосом белок не возвращало.</li><li>В сборке участвует субъединица цитозольного шаперонина (CCT4): без неё количество обеих субъединиц снижалось.</li><li>Значит, количество полноразмерного белка и его активность могут зависеть от того, удаётся ли сборка с партнёром уже во время синтеза.</li></ol><p>Как это узнали: в клетках человека снижали количество одной субъединицы и измеряли белок и мРНК другой; выделяли рибосомы, ещё синтезирующие одну субъединицу, и проверяли, связана ли с ними мРНК другой.</p><p>Граница вывода: работа показывает, что сборка начинается во время трансляции, но какая доля комплексов собирается таким путём, в работе не определено: с белком-партнёром в цитоплазме было совмещено лишь около 5 % молекул мРНК. Почему без партнёра белок другой субъединицы не накапливается, если не из-за протеасомы и лизосом, остаётся неясным.</p><p>Связанная модель — в практикуме: вопрос 4, уровень «Продвинутый» (синтезированный, полноразмерный и функционально активный белок); в ней есть переключатели, сценарий и обратная задача.</p><div class="static-quiz"><h3>Количество субъединицы А в клетке упало, хотя её мРНК не изменилась; одновременно снижено количество партнёра Б. Какой вывод допустим?</h3><ol><li><b>А.</b> Снизилась транскрипция гена А в этих клетках <i>(неверный вариант)</i><br><span class="expl">мРНК А не изменилась.</span></li><li><b>Б.</b> Доказано, что белок А разрушает протеасома <i>(неверный вариант)</i><br><span class="expl">В работе подавление протеасомы белок не возвращало.</span></li><li><b>В.</b> Количество белка зависит и от сборки с партнёром <i>(верный вариант)</i><br><span class="expl">Это совместимо с котрансляционной сборкой; механизм нужно проверять отдельно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.2517258123">Wu X., Zhang H., Huang L. et al. Cotranslational assembly directs the biogenesis of the m6A methyltransferase complex. Proc Natl Acad Sci USA. 2026;123:e2517258123</a></li></ul><p>Клетки человека (линии HEK293, HeLa, A549).</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 25 из 26</div><h2>Сводная задача: на каком этапе изменение меняет белковый продукт</h2><p class="lead">Объединим четыре вопроса и семинар 9. Путь от гена к функционально активному белку: транскрипция → процессинг → трансляция (код и рамка, аминоацилирование, рибосомный цикл) → сворачивание, модификации и сборка → контроль качества и удаление. Задача — для каждого этапа назвать наблюдение, которое на него указывает, и не делать вывода сильнее, чем позволяют данные.</p><div class="note"><strong>Что показывает схема.</strong> Одна замена во всех молекулах.</div><ol class="mech"><li>Изменение последовательности ДНК (мутация) есть во всех мРНК этого гена: одна и та же замена или сдвиг рамки у всех молекул белка, транслированных с них.</li><li>Нарушение сплайсинга (<a href="https://fresll.github.io/bio/seminar-9-route.html#splicing">вспомнить БИО-9·15</a>): если выпадает экзон, длина которого кратна трём, белок короче на участок без сдвига рамки; если не кратна — рамка ниже места изменения сдвигается, и обычно вскоре встречается стоп-кодон. Причиной может быть изменение сигнала сплайсинга в интроне — тогда кодирующие последовательности экзонов не изменены.</li><li>Ошибка аминоацилирования: замена одного типа на местах одной аминокислоты в части молекул многих белков; последовательности генов не изменены.</li><li>Ошибка декодирования: редкие разрозненные замены в разных местах.</li><li>Ограничение инициации или элонгации: меньше завершённых полипептидов при той же последовательности; различает их число и распределение рибосом на мРНК.</li><li>Нарушение сворачивания или контроля качества: полипептид нормальной длины и последовательности, но мало активного белка; количество белка может быть и малым, и большим.</li></ol><p>Общее правило: одинаковое наблюдаемое (например, мало активного белка) может иметь разные молекулярные причины; различают их наблюдения, по которым гипотезы предсказывают разное.</p><p>Правильная последовательность кодонов мРНК — необходимое, но не достаточное условие функционально полноценного белка: важны точность аминоацилирования, работа рибосомы, сворачивание и удаление продукта.</p><div class="static-quiz"><h3>У пациента в белке одна и та же замена аминокислоты во всех молекулах, а в других белках замен нет. Что вероятнее?</h3><ol><li><b>А.</b> Изменение последовательности гена <i>(верный вариант)</i><br><span class="expl">Одна и та же замена во всех молекулах одного белка указывает на изменение матрицы; ошибка аминоацилирования могла бы дать однотипные замены в разных белках, в части молекул.</span></li><li><b>Б.</b> Ошибка аминоацилирования тРНК <i>(неверный вариант)</i><br><span class="expl">Тогда замены были бы в части молекул и во многих белках.</span></li><li><b>В.</b> Ошибки декодирования на рибосоме <i>(неверный вариант)</i><br><span class="expl">Они редкие и разрозненные, а не одинаковые во всех молекулах.</span></li></ol></div><p class="practice-row">Сводная задача использует материал всех четырёх вопросов практикума. <a href="seminar-10.html#q1">Вопрос 1 →</a> <a href="seminar-10.html#q2">Вопрос 2 →</a> <a href="seminar-10.html#q3">Вопрос 3 →</a> <a href="seminar-10.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton &amp; Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»</li></ul><p>Мысленная задача по моделям вкладок 1–4; числа условные.</p></details></article><article class="card print-unit" id="ns-exit-to-regulation"><div class="eyebrow">Завершение синтеза и состояние белкового продукта · шаг 26 из 26</div><h2>Что дальше: регуляция количества белка</h2><p class="lead">Количество функционально активного белка зависит от многих этапов: транскрипции, процессинга, времени жизни мРНК, трансляции, сворачивания и удаления. Как клетка регулирует эти этапы и почему клетки с одинаковым геномом содержат разные белки — тема следующего семинара.</p><div class="note"><strong>Что показывает схема.</strong> Удаляется 20 % правильно свёрнутого белка: активно 72.</div><ol class="mech"><li>Количество белка в клетке определяется соотношением скорости его синтеза и скорости удаления.</li><li>Синтез регулируется на уровне транскрипции, процессинга, экспорта и трансляции (прежде всего инициации); удаление — на уровне мРНК и белка.</li><li>Периоды полужизни белков различаются от минут до многих дней и дольше.</li></ol><p>В семинаре 11 — регуляция транскрипции, доступность хроматина, посттранскрипционная регуляция и микроРНК.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Программы ответа на стресс и подавление инициации трансляции — <a href="https://fresll.github.io/molbio/seminar-10-route.html">МБ, семинар 10</a>; протеостаз, шапероны и убиквитин-протеасомная система — <a href="https://fresll.github.io/molbio/seminar-11-route.html">МБ, семинар 11</a>; нонсенс-опосредованный распад мРНК и время жизни мРНК — МБ, семинар 13 (в разработке).</p><div class="static-quiz"><h3>Какое утверждение верно?</h3><ol><li><b>А.</b> Количество белка определяется только транскрипцией <i>(неверный вариант)</i><br><span class="expl">Трансляция, сворачи
