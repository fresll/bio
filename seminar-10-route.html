})();

GN.a2 = (function () {
  const { C, f, text, textN, panel, G } = GN, K = GN.code;
  const CDS = 'AUGGCCAUCGAAAAGAUCUUCGGCCAUAUUGACUAA';   /* Met Ala Ile Glu Lys Ile Phe Gly His Ile Asp стоп */
  const ILE = [3, 6, 10], NMOL = 10;
  /* учебная выборка: где в 10 молекулах оказался валин из Val-тРНК^Ile (20 % из 30 мест изолейцина) */
  const MIS = [[0, 3], [1, 10], [3, 6], [4, 3], [6, 10], [8, 6]];
  /* разрозненные ошибки декодирования: молекула, позиция, включённая аминокислота (близкородственная тРНК) */
  const DEC = [[2, 5, 'N'], [5, 7, 'L'], [7, 9, 'Q'], [9, 4, 'D']];   /* v1.1 (Р-22): все четыре — несовпадение в третьей позиции кодона (K→N на AAG, а не K→R)*/
  function model(edit, dec, mrna) {
    const base = K.translate(CDS, 0).aa;
    const seq = mrna === 'gene' ? CDS.slice(0, 15) + 'GUC' + CDS.slice(18) : CDS;   /* кодон 6: AUC → GUC */
    const tpl = K.translate(seq, 0).aa;
    const mol = Array.from({ length: NMOL }, () => tpl.slice());
    if (edit === 'off') MIS.forEach(([r, p]) => { if (tpl[p - 1] === 'I') mol[r][p - 1] = 'V'; });
    if (dec === 'low') DEC.forEach(([r, p, a]) => { mol[r][p - 1] = a; });
    const cells = []; let atIle = 0, other = 0;
    mol.forEach((m, r) => m.forEach((a, i) => { if (a !== base[i]) { cells.push([r, i + 1, a]); if (ILE.includes(i + 1)) atIle++; else other++; } }));
    const pos = [...new Set(cells.map(c => c[1]))].sort((a, b) => a - b);
    const allSame = pos.length === 1 && cells.length === NMOL;
    const kinds = [...new Set(cells.map(c => base[c[1] - 1] + '>' + c[2]))];
    const valTrna = edit === 'off' ? 20 : 0;   /* условная доля тРНК^Ile, несущих валин, % */
    return { edit, dec, mrna, base, mol, cells, n: cells.length, atIle, other, pos, kinds, allSame, valTrna, seq, key: [edit, dec, mrna].join('_') };
  }
  function draw(o, t, mode) {
    /* mode: 'inv' — обратная задача: исследована только позиция 6 (остальные позиции и мРНК скрыты) */
    let s = panel(16, 14, 568, 92, t('a2_pA'));
    const tr = K.translate(o.seq, 0);
    const row = GN.ntRow(60, 64, o.seq, { tr, cell: 11.8, gap: 3, size: 12, mark: o.mrna === 'gene' ? [{ k: 'sub', i: 15 }] : [] });
    s += mode === 'inv' ? text(300, 66, t('a2_lbl_mrna_hidden'), { size: 12, it: true, col: C.muted }) : row.svg;
    if (mode !== 'inv') ILE.forEach(p => { s += text(row.X((p - 1) * 3) + 1.5 * 11.8, 92, t('a2_lbl_ile'), { size: 10, col: '#1F3B73', w: 700 }); });
    s += panel(16, 114, 568, 248, t('a2_pB'));
    const A3 = K.A3, bw = 40, x0 = 92, y0 = 150;
    for (let i = 0; i < o.base.length; i++) s += text(x0 + i * (bw + 3) + bw / 2, y0 - 2, String(i + 1), { size: 10, col: ILE.includes(i + 1) ? '#1F3B73' : C.muted, w: ILE.includes(i + 1) ? 700 : 500 });
    let mols = '';
    o.mol.forEach((m, r) => {
      const y = y0 + 18 + r * 19.5;
      mols += text(40, y, t('a2_lbl_mol', { n: r + 1 }), { a: 'l', size: 10, col: C.muted });
      m.forEach((a, i) => {
        const ch = a !== o.base[i], xx = x0 + i * (bw + 3);
        if (mode === 'inv' && i !== 5) { mols += `<rect x="${f(xx)}" y="${f(y - 8)}" width="${bw}" height="16" rx="8" fill="#F4F6F9" stroke="#D3DAE3" stroke-width=".8"/>` + text(xx + bw / 2, y + .5, '?', { size: 9.5, col: '#9AA3AE' }); return; }
        mols += `<rect x="${f(xx)}" y="${f(y - 8)}" width="${bw}" height="16" rx="8" fill="${ch ? '#F6C9C3' : '#E7EEF7'}" stroke="${ch ? C.bad : '#B8C8DD'}" stroke-width="${ch ? 1.4 : .8}"/>` +
          text(xx + bw / 2, y + .5, A3[a], { size: 9.5, w: ch ? 700 : 500, col: ch ? '#8E2A1F' : '#3C5070' });
      });
    });
    s += G('polypeptide', mols);
    s += panel(16, 370, 568, 38, '');
    s += mode === 'inv' ? text(300, 389, t('a2_lbl_inv', { n: o.mol.filter(m => m[5] !== o.base[5]).length }), { size: 11.5, w: 700, col: C.bad })
      : text(300, 389, t('a2_lbl_count', { n: o.n, i: o.atIle, o: o.other }), { size: 11.5, w: 700, col: o.n ? C.bad : C.ink });
    return s;
  }
  const view = (a, t) => draw(model(a[0], a[1], a[2]), t, a[3]);
  return { model, draw, view, CDS, ILE, MIS, DEC, NMOL };
})();
/* =====================================================================
   s0_gn_s3.js — вкладка 3 «Рибосомный цикл трансляции»: базовая сцена 3b и исследование 3a.
   3b (MBoC7, с. 365–375, рис. 6–68, 6–69, 6–73, 6–76): мРНК 5′…AUG CAC UGG GAA UGA…3′; рибосома 80S с участками E, P, A
   (слева направо при записи мРНК 5′→3′). Этапы (учебная последовательность моментов, не временная шкала):
   1 — инициация: инициаторная Met-тРНК в P-сайте напротив AUG, A-сайт свободен;
   2 — вход аминоацил-тРНК (His-тРНК) в A-сайт; 3 — пептидная связь: цепь переходит с тРНК в P-сайте на аминокислоту
   тРНК в A-сайте; 4 — транслокация на один кодон (три нуклеотида) к 3′-концу: тРНК из A — в P, из P — в E;
   5 — ещё два цикла: в A-сайте стоп-кодон UGA; 6 — терминация: фактор терминации eRF1 в A-сайте, полипептид освобождён.
   Детали: все компоненты / нет фактора транслокации eEF2 / нет фактора терминации eRF1.
   3a — условный поток рибосом по одной мРНК (детерминированная модель с дискретным временем, сим. sim()).
   ===================================================================== */
GN.s3b = (function () {
  const { C, f, text, textN, panel, G, line, arrow, cross } = GN, A3 = GN.code.A3;
  const COD = ['AUG', 'CAC', 'UGG', 'GAA', 'UGA'], AA = ['M', 'H', 'W', 'E'];
  const AC = { M: 'UAC', H: 'GUG', W: 'ACC', E: 'CUU' };   /* антикодоны, записанные 3′→5′ над кодоном */
  const tr = (aa, chain, ini) => ({ aa, chain: chain || [], ini: !!ini });   /* тРНК: для какой аминокислоты, что несёт */
  /* состояние на этапе st (1–6) при наборе деталей comp: 'all' | 'noeef2' | 'noerf1' */
  function model(st, comp) {
    st = +st;
    let s = st, block = null;
    if (comp === 'noeef2' && st >= 4) { s = 3; block = 'transloc'; }
    if (comp === 'noerf1' && st === 6) { s = 5; block = 'term'; }
    let pP = 0, E = null, P = null, A = null, free = null, erf = false;
    if (s === 1) { P = tr('M', ['M'], 1); }
    if (s === 2) { P = tr('M', ['M'], 1); A = tr('H', ['H']); }
    if (s === 3) { P = tr('M', [], 1); A = tr('H', ['M', 'H']); }
    if (s === 4) { pP = 1; E = tr('M', [], 1); P = tr('H', ['M', 'H']); }
    if (s === 5) { pP = 3; E = tr('W', []); P = tr('E', ['M', 'H', 'W', 'E']); }
    if (s === 6) { pP = 3; P = tr('E', []); erf = true; free = ['M', 'H', 'W', 'E']; }
    const chainOn = free ? 'free' : (A && A.chain.length > 1) || (A && P && !P.chain.length && A.chain.length) ? 'A' : 'P';
    const chain = free || (chainOn === 'A' ? A.chain : P ? P.chain : []);
    return { st, comp, s, block, pP, E, P, A, erf, free, chain, chainOn, state: block ? block : 's' + s, key: st + '_' + comp };
  }
  /* рисунок тРНК в рибосоме: столбик с антикодоном внизу (над кодоном) и 3′-концом вверху */
  function trnaV(x, yb, o, ac) {
    const col = o.ini ? '#1F6E5A' : '#2C7FB8';
    let r = `<rect x="${f(x - 13)}" y="${f(yb - 98)}" width="26" height="80" rx="9" fill="${col}" opacity=".8"/>` +
      `<rect x="${f(x - 22)}" y="${f(yb - 22)}" width="44" height="18" rx="6" fill="#fff" stroke="${col}" stroke-width="1.4"/>` +
      text(x, yb - 12.5, ac, { size: 12, w: 700, col: '#1F3B73', mono: true }) +
      /* v1.2.1 (аудит S10-06, И-19): ориентация антикодона — 3′ слева, 5′ справа, над кодоном 5′→3′ (антипараллельно) */
      G('anticodon', text(x - 19, yb - 27, '3′', { size: 9, w: 700, col: C.muted }) + text(x + 19, yb - 27, '5′', { size: 9, w: 700, col: C.muted }));
    return G(o.ini ? 'trnai' : 'trna', r);
  }
  function bead(x, y, a, cls) {
    return `<circle cx="${f(x)}" cy="${f(y)}" r="13" fill="${cls === 'new' ? '#E8912A' : '#6A8FC4'}" stroke="#fff" stroke-width="1.5"/>` + text(x, y + .5, A3[a], { size: 9.5, w: 700, col: '#fff' });
  }
  /* цепь на тРНК: от 3′-конца тРНК вверх через туннель большой субчастицы; N-конец — дальше всего от тРНК */
  function chainUp(x, ytop, chain) {
    let r = '';
    chain.slice().reverse().forEach((a, i) => { r += bead(x + i * 9, ytop - 12 - i * 25, a, i === 0 && chain.length > 1 ? 'new' : 'old'); });
    if (chain.length) r += text(x + (chain.length - 1) * 9 + 18, ytop - 12 - (chain.length - 1) * 25, 'N', { a: 'l', size: 12, w: 700 });
    return G('polypeptide', r);
  }
  function draw(o, t) {
    let s = panel(16, 14, 568, 300, t('s3_pA'));
    const cw = 66, x0 = 300 - (o.pP + .5) * cw, ym = 262;   /* P-сайт — по центру схемы */
    const X = i => x0 + i * cw;
    /* субчастицы рибосомы */
    s += G('large', `<path d="M${f(X(o.pP - 1) - 22)},${f(ym - 40)} Q${f(X(o.pP - 1) - 30)},${f(ym - 168)} ${f(300)},${f(ym - 172)} Q${f(X(o.pP + 2) + 30)},${f(ym - 168)} ${f(X(o.pP + 2) + 22)},${f(ym - 40)} Z" fill="#DCE5F0" stroke="#9FB2CB" stroke-width="1.5"/>`);
    s += G('small', `<path d="M${f(X(o.pP - 1) - 26)},${f(ym + 8)} Q${f(300)},${f(ym + 56)} ${f(X(o.pP + 2) + 26)},${f(ym + 8)} Z" fill="#C9D6E8" stroke="#9FB2CB" stroke-width="1.5"/>`);
    s += text(X(o.pP + 2) + 30, ym - 150, t('s3_lbl_large'), { a: 'l', size: 10.5, col: C.muted }) + text(X(o.pP + 2) + 30, ym + 30, t('s3_lbl_small'), { a: 'l', size: 10.5, col: C.muted });
    /* участки E, P, A — над кодонами pP−1, pP, pP+1; буквы — под кодонами, чтобы не перекрываться растущей цепью */
    ['E', 'P', 'A'].forEach((k, j) => { const x = X(o.pP - 1 + j) + cw / 2;
      s += G('site' + k, `<rect x="${f(x - 30)}" y="${f(ym - 128)}" width="60" height="112" rx="8" fill="#fff" fill-opacity=".35" stroke="#9FB2CB" stroke-dasharray="4 3"/>` + text(x, ym + 27, k, { size: 13, w: 800, col: '#1F3B73' })); });
    /* мРНК: кодоны */
    s += G('mrna', line(20, ym, 580, ym, C.rna, 2.2));
    COD.forEach((c, i) => { const x = X(i);
      if (x < 22 || x + cw > 580) return;
      s += G(i === 0 ? 'startc' : c === 'UGA' ? 'stopc' : 'codon', `<rect x="${f(x + 4)}" y="${f(ym - 10)}" width="${cw - 8}" height="20" rx="4" fill="${i === 0 ? '#E2F3E8' : c === 'UGA' ? '#FBE3E0' : '#FFF5E8'}" stroke="${i === 0 ? C.ok : c === 'UGA' ? C.bad : C.rna}"/>` +
        text(x + cw / 2, ym + .5, c, { size: 12.5, w: 700, col: '#8A4B00', mono: true })); });
    s += text(24, ym + 24, '5′', { a: 'l', size: 11, w: 700, col: C.muted }) + text(576, ym + 24, '3′', { a: 'r', size: 11, w: 700, col: C.muted });
    /* тРНК и фактор терминации */
    const site = (k, j) => X(o.pP - 1 + j) + cw / 2;
    const pos = { E: site('E', 0), P: site('P', 1), A: site('A', 2) };
    ['E', 'P', 'A'].forEach(k => { const v = o[k]; if (!v) return; s += trnaV(pos[k], ym - 6, v, AC[v.aa]); });
    if (o.erf) s += G('erf1', `<rect x="${f(pos.A - 14)}" y="${f(ym - 104)}" width="28" height="98" rx="10" fill="#B85C00" opacity=".9"/>` + text(pos.A, ym - 56, 'eRF1', { size: 9.5, w: 800, col: '#fff' }));
    if (o.E && o.s >= 4) s += arrow(pos.E - 18, ym - 112, pos.E - 52, ym - 132, C.muted, 1.8, '3 3');
    /* полипептид */
    if (o.chainOn === 'P' && o.P) s += chainUp(pos.P, ym - 104, o.P.chain);
    if (o.chainOn === 'A' && o.A) s += chainUp(pos.A, ym - 104, o.A.chain);
    /* v1.1 (Р-05): аминокислота на 3′-конце аминоацил-тРНК в A-сайте, пока цепь ещё на тРНК в P-сайте */
    if (o.chainOn === 'P' && o.A && o.A.chain.length === 1) s += G('aa', bead(pos.A, ym - 116, o.A.chain[0], 'old'));
    if (o.free) { let r = ''; o.free.forEach((a, i) => { r += bead(420 + i * 30, 46, a, 'old'); });
      s += G('polypeptide', r) + text(404, 46, 'N', { a: 'r', size: 12, w: 700 }) + text(420 + (o.free.length - 1) * 30 + 18, 46, 'C', { a: 'l', size: 12, w: 700 }) + text(470, 72, t('s3_lbl_released'), { size: 10.5, col: C.muted }); }
    if (o.block === 'transloc') s += cross(pos.A + 40, ym - 70, 9) + text(36, ym - 196, t('s3_lbl_noeef2'), { a: 'l', size: 11, w: 700, col: C.bad });
    if (o.block === 'term') s += cross(pos.A, ym - 64, 9) + text(36, ym - 196, t('s3_lbl_noerf1'), { a: 'l', size: 11, w: 700, col: C.bad });
    if (o.s === 4 && !o.block) s += arrow(300 - 40, ym - 180, 300 + 40, ym - 180, '#1F3B73', 2.2) + text(300, ym - 194, t('s3_lbl_shift'), { size: 10.5, w: 700, col: '#1F3B73' });
    /* панель Б: что произошло на этом этапе */
    s += panel(16, 322, 568, 86, t('s3_pB'));
    s += textN(300, 356, t('s3_ev_' + o.state), { size: 12, col: C.ink });
    return s;
  }
  const view = (a, t) => draw(model(a[0], a[1]), t);
  return { model, draw, view, COD, AC, _: { trnaV, bead, chainUp } };   /* _ — детали рисунка для кадров анимации (s0_go_s3.js, v1.1.3) */
})();

GN.a3 = (function () {
  const { C, f, text, textN, panel, G, line } = GN;
  /* Условный поток рибосом (учебная модель, единицы времени условные):
     кодирующая область L = 120 кодонов; рибосома занимает F = 10 кодонов и не обгоняет соседнюю;
     время на кодоне — step (обычный кодон) или slow (кодон 80, для которого мало аминоацил-тРНК);
     инициация возможна раз в ki единиц; если начало мРНК занято, инициация ждёт (одна отложенная),
     следующая возможность в это время пропускается («пропущена»). Наблюдение — момент T = 600. */
  const L = 120, F = 10, S = 80, T = 600;
  function sim(ki, slow, step, Tend = T) {
    ki = +ki; slow = +slow; step = +step;
    const dwell = p => p === S ? slow : step;
    let rib = [], init = 0, done = 0, missed = 0, pending = false, firstDone = null;
    for (let t = 1; t <= Tend; t++) {
      /* рибосомы от 3′-конца к 5′-концу */
      const next = [];
      for (let i = 0; i < rib.length; i++) {
        const r = rib[i]; r.rem -= 1;
        if (r.rem <= 0) {
          if (r.p === L) { done++; if (firstDone == null) firstDone = t; continue; }   /* стоп-кодон: полипептид освобождён */
          const ahead = next.length ? next[next.length - 1] : null;
          if (ahead && ahead.p - (r.p + 1) < F) r.rem = 0;               /* впереди рибосома: ждёт */
          else { r.p += 1; r.rem = dwell(r.p); }
        }
        next.push(r);
      }
      rib = next;
      if (t % ki === 0) { if (pending) missed++; pending = true; }
      const last = rib.length ? rib[rib.length - 1] : null;
      if (pending && (!last || last.p - 1 >= F)) { rib.push({ p: 1, rem: dwell(1) }); init++; pending = false; }
    }
    const up = rib.filter(r => r.p <= S).length, down = rib.length - up;
    const waiting = rib.filter(r => r.rem <= 0 || r.p === S).length;
    return { ki, slow, step, init, done, on: rib.length, missed, up, down, waiting, pos: rib.map(r => r.p), firstDone, key: [ki, slow, step].join('_') };
  }
  function model(ki, slow, step) { return sim(ki, slow, step); }
  function draw(o, t, mode) {
    /* mode: 'mask' — показаны только показания «завершено» (обратная задача: распределение рибосом скрыто) */
    let s = panel(16, 14, 568, 170, t('a3_pA'));
    const x0 = 40, x1 = 560, Xc = p => x0 + (p - .5) * (x1 - x0) / L, y = 112;
    s += G('mrna', line(x0 - 14, y, x1 + 14, y, C.rna, 3)) + text(x0 - 18, y, '5′', { a: 'r', size: 11, w: 700, col: C.muted }) + text(x1 + 18, y, '3′', { a: 'l', size: 11, w: 700, col: C.muted });
