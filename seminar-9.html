направлении — это нижняя цепь. Верхняя цепь совпадает с РНК (T вместо U): это кодирующая цепь.", "s1_cap_r_same_z": "Последовательность РНК находят по кодирующей цепи (замена T на U), а не по матричной: так записывают последовательности генов.", "s1_cap_r_comp": "Промотор слева, синтез идёт вправо; матрица — нижняя цепь. Нижняя цепь, прочитанная от 5′ к 3′, комплементарна РНК: напротив каждого её нуклеотида в РНК стоит комплементарный, а направления цепей противоположны.", "s1_cap_r_comp_z": "Сравнивать цепи нужно в одном направлении — от 5′ к 3′. Если читать обе слева направо, РНК не совпадёт ни с одной цепью.", "s1_cap_l_same": "Промотор справа: синтез идёт влево, и матрицей стала верхняя цепь — она ориентирована от 3′ к 5′ справа налево. Нижняя цепь, прочитанная от 5′ к 3′, совпадает с РНК (T вместо U) — теперь кодирующая она.", "s1_cap_l_same_z": "Матричной или кодирующей цепь бывает не сама по себе, а по отношению к конкретной транскрипционной единице.", "s1_cap_l_comp": "Промотор справа, синтез идёт влево; матрица — верхняя цепь. Верхняя цепь комплементарна РНК и антипараллельна ей.", "s1_cap_l_comp_z": "Ориентацию задаёт промотор: от него зависит и место начала синтеза, и то, какая цепь станет матрицей.", "s1_cap_mask": "Обратная задача: известна РНК; промотор и направление синтеза скрыты.", "s1_cap_mask_z": "Найдите цепь, которая совпадает с РНК при чтении от 5′ к 3′ (с заменой U на T): матрица — другая цепь.", "s1b_take": "РНК синтезируется от 5′ к 3′ и комплементарна матричной цепи, антипараллельной ей; поэтому РНК совпадает с кодирующей цепью, если T заменить на U. Какая из двух цепей станет матричной, задаёт ориентация промотора конкретной транскрипционной единицы: при другой ориентации матрицей служит другая цепь того же участка ДНК.", "s1t_note": "Порядок этапов — учебная модель. Длина участка (12 пар нуклеотидов) и скорость синтеза на схеме условные; РНК показана рядом с матрицей, хотя в клетке позади РНК-полимеразы она отходит от ДНК.", "s1t_1": "Связывание у промотора: общие факторы транскрипции и РНК-полимераза II собираются на промоторе; промотор задаёт точку начала (+1) и направление синтеза.", "s1t_2_r": "Начало синтеза: у точки +1 цепи ДНК расходятся; первые рибонуклеотиды спариваются с нуклеотидами матричной (нижней) цепи — затравка не нужна.", "s1t_2_l": "Начало синтеза: у точки +1 цепи ДНК расходятся; первые рибонуклеотиды спариваются с нуклеотидами матричной (верхней) цепи — затравка не нужна.", "s1t_3_r": "Элонгация: РНК-полимераза движется вправо; каждый новый нуклеотид присоединяется к 3′-концу РНК, а вдоль матрицы полимераза движется от её 3′- к 5′-концу.", "s1t_3_l": "Элонгация: РНК-полимераза движется влево; каждый новый нуклеотид присоединяется к 3′-концу РНК, а вдоль матрицы полимераза движется от её 3′- к 5′-концу.", "s1t_4": "РНК синтезирована: её последовательность от 5′ к 3′ совпадает с кодирующей цепью (T вместо U).", "p1b_1_q": "Условия: участок ДНК на схеме, промотор слева, РНК-полимераза II движется вправо. Какая цепь будет матричной?", "p1b_1_o1": "Нижняя: она ориентирована от 3′ к 5′ по ходу синтеза", "p1b_1_o2": "Верхняя: она записана от 5′ к 3′, как РНК", "p1b_1_o3": "Любая: матрица определяется случайно", "p1b_1_e": "РНК растёт от 5′ к 3′, а матрица антипараллельна ей. При синтезе вправо матрица должна идти от 3′ к 5′ слева направо — это нижняя цепь. Верхняя совпадает с РНК и потому кодирующая.", "p1b_1_w2": "Именно потому, что верхняя цепь ориентирована так же, как РНК, она не может быть её матрицей: матрица и РНК антипараллельны. Верхняя — кодирующая цепь.", "p1b_1_w3": "Цепь не выбирается случайно: её определяет ориентация промотора, на котором собираются общие факторы и РНК-полимераза.", "p1b_2_q": "Тот же участок ДНК, но промотор теперь справа, и синтез идёт влево. Что изменится?", "p1b_2_o1": "Матричной станет верхняя цепь, РНК будет другой последовательности", "p1b_2_o2": "Матрицей останется нижняя цепь, изменится только направление синтеза", "p1b_2_o3": "Получится та же РНК, только записанная справа налево", "p1b_2_e": "При синтезе влево матрица должна идти от 3′ к 5′ справа налево — это верхняя цепь. РНК теперь совпадает с нижней цепью (T вместо U), и её последовательность другая.", "p1b_2_w2": "Если бы нижняя цепь осталась матрицей, РНК-полимераза двигалась бы вдоль неё от 5′ к 3′, а это невозможно: вдоль матрицы полимераза всегда движется от 3′ к 5′.", "p1b_2_w3": "Переписать ту же РНК в обратном порядке нельзя: у неё 5′- и 3′-концы. Новая РНК комплементарна другой цепи.", "p1b_3_q": "Синтез идёт влево. Нижнюю цепь прочитали от 5′ к 3′ и сравнили с РНК. Каким будет результат?", "p1b_3_o1": "Совпадёт с РНК, если T заменить на U: нижняя цепь — кодирующая", "p1b_3_o2": "Будет комплементарна РНК: нижняя цепь — матричная", "p1b_3_o3": "Не совпадёт и не будет комплементарна: последовательности не связаны", "p1b_3_e": "При синтезе влево матрица — верхняя цепь; РНК комплементарна ей и потому совпадает с нижней (кодирующей) цепью, прочитанной в том же направлении, от 5′ к 3′.", "p1b_3_w2": "Комплементарна РНК матричная цепь, а при синтезе влево матрица — верхняя. Нижняя теперь кодирующая.", "p1b_3_w3": "Обе цепи ДНК связаны с РНК: одна комплементарна ей, другая совпадает (T вместо U). Важно сравнивать их от 5′ к 3′.", "p1b_4_q": "Известна РНК 5′-AUGCCUAAGGUC-3′, синтезированная с другого участка ДНК (12 п. н.) — он показан на схеме. Промотор и направление синтеза скрыты. Что служило матрицей?", "p1b_4_o1": "Нижняя цепь; синтез шёл слева направо", "p1b_4_o2": "Верхняя цепь; синтез шёл справа налево", "p1b_4_o3": "По одной последовательности РНК это определить нельзя", "p1b_4_e": "Верхняя цепь, прочитанная от 5′ к 3′ (слева направо), — ATGCCTAAGGTC: она совпадает с РНК с заменой U на T, значит, кодирующая. Матрица — нижняя цепь, а 5′-конец РНК находится слева: синтез шёл слева направо.", "p1b_4_w2": "Сравните верхнюю цепь с РНК в одном направлении: от 5′ к 3′ она совпадает с РНК (U вместо T). Совпадает кодирующая цепь, а не матричная.", "p1b_4_w3": "Здесь последовательности достаточно: участок короткий и известны обе цепи. Если цепь совпадает с РНК при чтении от 5′ к 3′, матрица — вторая цепь, а направление синтеза задаёт положение 5′-конца РНК.", "p1b_4_h1": "Прочитайте верхнюю цепь от её 5′-конца — он слева.", "p1b_4_h2": "Цепь, совпадающая с РНК, — кодирующая; матрица — другая.", "s1_pA_inv": "А. Участок ДНК из обратной задачи (другой участок, 12 п. н.)", "s1_cap_inv": "Обратная задача решена: на этом участке верхняя цепь совпадает с РНК 5′-AUGCCUAAGGUC-3′ (T вместо U) — она кодирующая. Матрица — нижняя цепь; 5′-конец РНК слева, значит, синтез шёл слева направо, а промотор этой единицы — слева.", "s1_cap_inv_z": "Матрицу находят по РНК: цепь, совпадающая с РНК при чтении от 5′ к 3′, — кодирующая; матрица — вторая, комплементарная ей цепь.", "s2_prom": "Промотор", "s2_prom_tata": "с TATA-боксом", "s2_prom_inr": "без TATA-бокса (Inr и DPE)", "s2k_title": "Белки транскрипции: нажмите на гнездо, чтобы вынуть белок", "s2k_hint": "TFIID в этой модели всегда на месте. Вынутый белок возвращается нажатием в лотке.", "s2k_tfiid": "TFIID", "s2k_tfiih": "TFIIH", "s2k_act": "Белок-активатор", "s2k_med": "Медиатор", "s2k_xrn": "5′→3′-экзонуклеаза (XRN2)", "s2_pA": "А. Промотор: сборка преинициаторного комплекса", "s2_pB": "Б. Транскрипционная единица: от точки +1 до терминации", "s2_e_act": "активатор", "s2_e_med": "медиатор", "s2_lbl_enh": "энхансер", "s2_lbl_tata": "TATA-бокс", "s2_lbl_3end": "3′-конец пре-мРНК", "s2_lbl_norna": "Цепи ДНК не расплетены: синтез РНК не начинается", "s2_lbl_term_near": "терминация", "s2_lbl_term_far": "терминация дальше, чем в норме", "s2_lbl_tss": "+1 — начало транскрипции", "s2_lbl_aug": "ATG — место будущего старт-кодона (начало трансляции, семинар 10)", "s2_st_ok": "РНК-полимераза II ушла с промотора и синтезирует РНК", "s2_st_rare": "Комплекс собирается редко: инициация редкая", "s2_st_closed": "Без TFIIH комплекс на промоторе неполный: цепи ДНК у точки +1 не расплетены", "s2_r_pic": "Преинициаторный комплекс", "s2_r_pic_s": "общие факторы и РНК-полимераза II на промоторе", "s2_v_pic_yes": "собирается часто", "s2_v_pic_rare": "собирается редко", "s2_r_open": "Цепи ДНК у точки +1 расплетены", "s2_v_yes": "да", "s2_v_no": "нет", "s2_r_rna": "Синтез РНК", "s2_r_rna_s": "частота инициации (в модели качественно)", "s2_v_rna_many": "частая", "s2_v_rna_few": "редкая", "s2_v_rna_none": "не начинается", "s2_r_start": "Где начинается РНК", "s2_v_start": "в точке +1, раньше места старт-кодона", "s2_r_3end": "3′-конец пре-мРНК", "s2_v_3end": "в месте расщепления за AAUAAA", "s2_v_none": "—", "s2_r_term": "Терминация", "s2_v_term_near": "вскоре за местом расщепления", "s2_v_term_far": "дальше по ДНК, чем в норме", "s2_cap_ok_near_tata": "TFIID связывается с TATA-боксом, к нему присоединяются TFIIB, РНК-полимераза II с TFIIF, затем TFIIE и TFIIH; активатор, связанный с энхансером, через медиатор ускоряет сборку. TFIIH расплетает ДНК у точки +1 и фосфорилирует C-концевой домен полимеразы — она уходит с промотора. После AAUAAA пре-мРНК расщепляется; полимераза ещё некоторое время синтезирует РНК и отделяется от ДНК.", "s2_cap_ok_near_tata_z": "РНК-полимераза II сама промотор не узнаёт: место и направление начала задают общие факторы, связанные с промотором.", "s2_cap_ok_near_inr": "Промотор без TATA-бокса: TFIID узнаёт другие последовательности у точки +1 (Inr и DPE) своими субъединицами TAF. Комплекс собирается, точка начала и направление синтеза заданы, транскрипция идёт как с TATA-содержащего промотора.", "s2_cap_ok_near_inr_z": "TATA-бокс — один из элементов промотора, а не обязательная его часть: у многих генов человека его нет.", "s2_cap_ok_far_tata": "Без 5′→3′-экзонуклеазы расщепление после AAUAAA проходит, и 3′-конец пре-мРНК там же, где в норме. Но фрагмент РНК на полимеразе не разрушается, и полимераза отделяется от ДНК дальше, чем в норме: терминация сохраняется, но задерживается.", "s2_cap_ok_far_tata_z": "Положение 3′-конца мРНК задаёт расщепление, а не место, где полимераза покидает ДНК; терминация — отдельный, более поздний этап.", "s2_cap_ok_far_inr": "Промотор без TATA-бокса работает (TFIID узнаёт Inr и DPE). Без 5′→3′-экзонуклеазы 3′-конец пре-мРНК там же, где в норме, но полимераза отделяется от ДНК дальше, чем в норме.", "s2_cap_ok_far_inr_z": "Положение 3′-конца мРНК задаёт расщепление, а не место терминации.", "s2_cap_rare_near": "Без активатора или медиатора общие факторы и полимераза собираются на промоторе редко: в модели инициация редкая. Каждая начатая РНК та же — с той же точки +1 и того же направления.", "s2_cap_rare_near_z": "В этой модели регуляторные белки меняют частоту инициации, но не место её начала и не последовательность РНК.", "s2_cap_rare_far": "Инициация редкая (нет активатора или медиатора), а без 5′→3′-экзонуклеазы полимераза отделяется от ДНК дальше места расщепления, чем в норме.", "s2_cap_rare_far_z": "Частоту инициации и место терминации определяют разные белки.", "s2_cap_closed": "Без TFIIH на промоторе собирается неполный комплекс (TFIID, TFIIA, TFIIB, РНК-полимераза II с TFIIF, TFIIE), но цепи ДНК у точки +1 не расплетаются: матричная цепь недоступна, и синтез РНК не начинается.", "s2_cap_closed_z": "Сборка комплекса на промоторе ещё не означает начала транскрипции: нужно открыть матрицу и освободить полимеразу от промотора.", "s2b_take": "Промотор задаёт точку начала транскрипции (+1) и её направление; РНК-полимеразу II к нему привлекают общие факторы транскрипции (TFIID узнаёт TATA-бокс или другие элементы промотора), а активаторы и медиатор ускоряют сборку комплекса. TFIIH расплетает ДНК и, фосфорилируя C-концевой домен, освобождает полимеразу для элонгации. Начало транскрипции (+1) не совпадает с началом трансляции (старт-кодоном). 3′-конец пре-мРНК задаёт её расщепление после AAUAAA; полимераза отделяется от ДНК позже, дальше по гену.", "s2t_note": "Порядок этапов — учебная модель; длительности этапов и расстояния на схеме условные. Кэпирование и сплайсинг идут во время элонгации — вкладка 3.", "s2t_1_tata": "Сборка преинициаторного комплекса: TFIID связывается с TATA-боксом, рядом присоединяются TFIIB и TFIIA, затем РНК-полимераза II с TFIIF, TFIIE и TFIIH; медиатор связывает комплекс с активатором.", "s2t_1_inr": "Сборка преинициаторного комплекса на промоторе без TATA-бокса: TFIID узнаёт последовательности Inr и DPE; рядом присоединяются TFIIB и TFIIA, затем РНК-полимераза II с TFIIF, TFIIE и TFIIH.", "s2t_2": "Расплетание: TFIIH раскрывает двойную спираль у точки +1, и матричная цепь становится доступна.", "s2t_stop": "Остановка: без TFIIH цепи ДНК не расплетены — синтез РНК не начинается.", "s2t_3": "Уход с промотора: синтезировав короткую РНК, полимераза после фосфорилирования серина 5 C-концевого домена (его выполняет TFIIH) отходит от общих факторов и переходит к элонгации.", "s2t_4": "Элонгация: полимераза движется по гену, РНК растёт от 5′ к 3′; по ходу синтеза к ней присоединяются факторы процессинга.", "s2t_5": "Расщепление: после транскрипции сигнала AAUAAA пре-мРНК разрезается ниже по цепи; к её свободному 3′-концу будет присоединён поли(А)-хвост.", "s2t_6_near": "Терминация: полимераза продолжает синтез, замедляется; 5′→3′-экзонуклеаза разрушает РНК, оставшуюся на полимеразе, и полимераза отделяется от ДНК.", "s2t_6_far": "Терминация задержана: фрагмент РНК на полимеразе не разрушается экзонуклеазой, и полимераза отделяется от ДНК дальше, чем в норме.", "p2b_1_q": "Условия: ген человека, его транскрибирует РНК-полимераза II; в его промоторе нет TATA-бокса, но есть элементы Inr и DPE. Начнётся ли транскрипция?", "p2b_1_o1": "Да: TFIID узнаёт другие элементы промотора, и комплекс собирается", "p2b_1_o2": "Нет: без TATA-бокса TFIID не связывается с промотором", "p2b_1_o3": "Да, но в случайном месте гена", "p2b_1_e": "TATA-бокс — лишь один из элементов, которые узнаёт TFIID; у промоторов без него точку начала задают Inr, DPE и другие последовательности. Комплекс собирается, начало и направление синтеза определены.", "p2b_1_w2": "TATA-бокс есть не у всех промоторов РНК-полимеразы II; субъединицы TAF комплекса TFIID узнают и другие элементы промотора.", "p2b_1_w3": "Место начала задаёт промотор: TFIID связывается с его элементами у точки +1, и случайного начала нет.", "p2b_2_q": "В ядре нет TFIIH; остальные общие факторы и полимераза есть. Что произойдёт на промоторе?", "p2b_2_o1": "Неполный комплекс соберётся, но цепи ДНК не расплетутся, и РНК не будет", "p2b_2_o2": "Комплекс не соберётся: TFIID не свяжется с промотором", "p2b_2_o3": "РНК начнёт синтезироваться, но не отделится от ДНК", "p2b_2_e": "TFIIH присоединяется к комплексу на промоторе последним; он раскрывает двойную спираль у точки +1 и фосфорилирует C-концевой домен. Без него комплекс неполный, матрица остаётся закрытой, и синтез не начинается.", "p2b_2_w2": "TFIID связывается с промотором первым и от TFIIH не зависит; без TFIIH не хватает следующего этапа — расплетания.", "p2b_2_w3": "Чтобы РНК начала синтезироваться, матричная цепь должна быть доступна, а это делает TFIIH.", "p2b_3_q": "В клетке нет белка-активатора, который связывается с энхансером этого гена; общие факторы и полимераза есть. Что изменится?", "p2b_3_o1": "Запусков станет меньше, но каждая РНК начнётся с той же точки +1", "p2b_3_o2": "Транскрипция станет невозможной: без активатора полимераза не узнаёт промотор", "p2b_3_o3": "РНК станет короче: активатор нужен для элонгации", "p2b_3_e": "Активатор через медиатор ускоряет сборку комплекса на промоторе. Без него комплекс собирается редко, инициация редкая; начало и последовательность РНК задаёт промотор и не меняются.", "p2b_3_w2": "Промотор узнают общие факторы; без активатора сборка идёт, но редко. В модели это редкая инициация, а не её отсутствие.", "p2b_3_w3": "Активатор действует на сборку комплекса у промотора; длина РНК в модели от него не зависит.", "p2b_4_q": "Все белки на месте. Где начинается молекула РНК относительно места будущего старт-кодона ATG?", "p2b_4_o1": "В точке +1, раньше старт-кодона: начало РНК не кодирует аминокислоты", "p2b_4_o2": "Точно на старт-кодоне: транскрипция начинается с ATG", "p2b_4_o3": "В TATA-боксе: с него РНК-полимераза начинает синтез", "p2b_4_e": "Транскрипция начинается в точке +1, которую задаёт промотор; старт-кодон находится дальше, и участок РНК между ними не транслируется. Начало транскрипции и начало трансляции — разные точки разных процессов.", "p2b_4_w2": "ATG — сигнал для рибосомы (начало трансляции), а не для РНК-полимеразы; РНК начинается раньше.", "p2b_4_w3": "TATA-бокс расположен перед точкой +1 и в РНК не копируется: с ним связывается TFIID.", "p2b_5_q": "Все общие факторы и РНК-полимераза II на месте, но нет 5′→3′-экзонуклеазы XRN2, разрушающей РНК за местом расщепления. Что произойдёт?", "p2b_5_o1": "3′-конец пре-мРНК будет там же, а полимераза отделится от ДНК дальше, чем в норме", "p2b_5_o2": "Пре-мРНК станет длиннее: её конец там, где отделилась полимераза", "p2b_5_o3": "Расщепления не будет, и поли(А)-хвост не добавится", "p2b_5_e": "Расщепление после AAUAAA проходит без экзонуклеазы, поэтому 3′-конец пре-мРНК прежний. Экзонуклеаза ускоряет терминацию: без неё фрагмент РНК на полимеразе не разрушается, и полимераза отделяется дальше; терминация сохраняется, но задерживается.", "p2b_5_w2": "Конец пре-мРНК задаёт место расщепления, а не место, где полимераза покидает ДНК.", "p2b_5_w3": "Расщепление выполняют факторы расщепления и полиаденилирования; экзонуклеаза действует уже после разреза.", "s2_v_pic_part": "неполный: без TFIIH", "s3k_title": "Белки процессинга и экспорта: нажмите на гнездо, чтобы вынуть деталь", "s3k_hint": "Вынутая деталь возвращается нажатием в лотке.", "s3k_cap": "Ферменты кэпирования", "s3k_spl": "Сплайсосома", "s3k_cpa": "Факторы расщепления и поли­аденили­рования", "s3k_exp": "Рецептор экспорта мРНК (NXF1–NXT1)", "s3_ctrl_note": "Ген из трёх экзонов и двух интронов транскрибирует РНК-полимераза II клетки человека. Предскажите, где окажется РНК этого гена и в каком виде. Длины участков на схеме условные.", "s3_pN": "Ядро", "s3_pC": "Цитоплазма", "s3_e_spl": "сплайсосома", "s3_e_cap": "ферменты кэпирования", "s3_lbl_lariat": "интрон в виде лассо", "s3_lbl_tr": "зрелая мРНК в цитоплазме — матрица для трансляции", "s3_lbl_done": "транскрипция гена завершена", "s3_lbl_deg5": "РНК без кэпа разрушается от 5′-конца; синтез часто обрывается рано", "s3_lbl_nospl": "интроны не удалены: РНК задерживается в ядре и разрушается", "s3_lbl_nocpa": "3′-конец не образован: РНК задерживается в ядре и разрушается", "s3_lbl_noexp": "зрелая мРНК накапливается в ядре: рецептора экспорта нет", "s3_r_cap": "Кэп на 5′-конце", "s3_r_cap_s": "7-метилгуанозин, связанный 5′–5′", "s3_v_cap_yes": "есть", "s3_v_cap_no": "нет", "s3_r_intr": "Интроны", "s3_v_intr_no": "удалены", "s3_v_intr_yes": "остались", "s3_v_na": "—", "s3_r_3": "3′-конец", "s3_r_3_s": "расщепление после AAUAAA и поли(А)", "s3_v_3_yes": "расщеплён, есть поли(А)-хвост", "s3_v_3_no": "не расщеплён, поли(А) нет", "s3_r_where": "Где РНК этого гена", "s3_v_where_cyt": "в цитоплазме", "s3_v_where_nuc": "только в ядре", "s3_v_where_none": "почти нет нигде", "s3_r_fate": "Что с ней дальше", "s3_v_fate_tr": "матрица для трансляции", "s3_v_fate_ret": "задержана в ядре и разрушается", "s3_v_fate_nuc": "накапливается в ядре", "s3_v_fate_deg5": "разрушается сразу после начала синтеза", "s3_cap_ok": "Процессинг идёт во время транскрипции: кэп присоединяется к 5′-концу, как только он выходит из РНК-полимеразы; первый интрон удаляется, пока полимераза ещё транскрибирует дальние участки гена; после AAUAAA пре-мРНК расщепляется и получает поли(А)-хвост. Зрелая мРНК с белками (мРНП) связывается с рецептором экспорта и выходит через ядерную пору.", "s3_cap_ok_z": "Белки, присоединённые при кэпировании, сплайсинге и образовании 3′-конца, отличают зрелую мРНК от промежуточных продуктов: из ядра выходит в основном она.", "s3_cap_nocap": "Без ферментов кэпирования 5′-конец РНК не защищён: такие РНК быстро становятся субстратом 5′→3′-экзонуклеазы и разрушаются, а синтез их часто обрывается вскоре после начала. Зрелой мРНК этого гена нет ни в ядре, ни в цитоплазме.", "s3_cap_nocap_z": "Кэп защищает 5′-конец; связанный с ним кэп-связывающий комплекс помогает дальнейшему процессингу и экспорту, а в цитоплазме кэп нужен для инициации трансляции.", "s3_cap_nospl": "Без сплайсосомы интроны остаются в РНК; кэп и поли(А)-хвост в модели есть. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.", "s3_cap_nospl_z": "РНК с неудалёнными интронами в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.", "s3_cap_nospl_cpa": "Без сплайсосомы интроны остаются в РНК, а без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост. Такая РНК не распознаётся как зрелая: она задерживается в ядре и разрушается.", "s3_cap_nospl_cpa_z": "РНК с неудалёнными интронами и без поли(А)-хвоста в основном задерживается в ядре и разрушается; поэтому с неё обычно не синтезируется белок.", "s3_cap_nocpa": "Без факторов расщепления и полиаденилирования пре-мРНК не разрезается после AAUAAA и не получает поли(А)-хвост; полимераза продолжает синтез дальше по ДНК. Первый интрон удалён, а удаление последнего связано с образованием 3′-конца, и в модели он остаётся. Такая РНК задерживается в ядре и разрушается.", "s3_cap_nocpa_z": "Поли(А)-хвост не закодирован в гене: его добавляет поли(А)-полимераза после расщепления. Без расщепления нет и хвоста.", "s3_cap_noexp": "Процессинг прошёл полностью: у мРНК есть кэп и поли(А)-хвост, интроны удалены. Но без рецептора экспорта мРНП не проходит через ядерную пору и накапливается в ядре; в цитоплазме мРНК этого гена нет.", "s3_cap_noexp_z": "Зрелость мРНК необходима для экспорта, но не достаточна: нужен ещё рецептор экспорта. Экспорт мРНП идёт без сигнала ядерной локализации и импортина — иначе, чем импорт белков в ядро.", "s3b_take": "Процессинг пре-мРНК в значительной мере сопряжён с транскрипцией: кэп присоединяется к растущей РНК, многие интроны удаляются ещё до окончания синтеза, 3′-конец образуется расщеплением после AAUAAA и полиаденилированием без матрицы. Из ядра выходит мРНП зрелой мРНК, связанный с рецептором экспорта; РНК без кэпа, с неудалёнными интронами или без 3′-конца задерживается в ядре и разрушается. Поэтому синтез РНК ещё не означает появления мРНК в цитоплазме.", "s3t_note": "Порядок этапов — учебная модель: в клетке они перекрываются во времени, и часть интронов удаляется уже после завершения синтеза. Длительности этапов не измерены.", "s3t_1": "Кэпирование: когда РНК-полимераза II синтезировала около 20 нуклеотидов РНК и её 5′-конец выходит из фермента, ферменты кэпирования, связанные с её C-концевым доменом, присоединяют 7-метилгуанозин 5′–5′-связью.", "s3t_2": "Сплайсинг во время транскрипции: сплайсосома собирается на границах интрона 1 и удаляет его, пока полимераза транскрибирует следующие участки гена; интрон освобождается в виде лассо, экзоны соединяются.", "s3t_3": "Образование 3′-конца: после транскрипции AAUAAA факторы расщепления и полиаденилирования разрезают пре-мРНК; поли(А)-полимераза без матрицы добавляет около 200 адениловых остатков.", "s3t_4": "Экспорт: рецептор экспорта NXF1–NXT1, привлечённый белками процессинга, проводит мРНП через ядерную пору в цитоплазму.", "s3t_5": "В цитоплазме: зрелая мРНК — матрица для трансляции (семинар 10).", "s3t_stop_nocap": "Остановка: у РНК без кэпа 5′-конец удаляют другие ферменты, и её разрушает 5′→3′-экзонуклеаза XRN2 вскоре после начала синтеза.", "s3t_stop_nospl": "Остановка: интроны не удалены — РНК задерживается в ядре и разрушается, в цитоплазму не выходит.", "s3t_stop_nocpa": "Остановка: пре-мРНК не расщеплена и не полиаденилирована — задерживается в ядре и разрушается.", "s3t_stop_noexp": "Остановка: зрелая мРНК не проходит через ядерную пору без рецептора экспорта.", "p3b_1_q": "Условия: клетка человека, все белки процессинга работают, но нет рецептора экспорта мРНК NXF1–NXT1. Где через некоторое время будет мРНК этого гена и какой она будет?", "p3b_1_o1": "Зрелая — с кэпом, без интронов, с поли(А) — в ядре; в цитоплазме её нет", "p3b_1_o2": "В цитоплазме: её перенесёт импортин, узнающий сигнал ядерной локализации", "p3b_1_o3": "В ядре без поли(А)-хвоста: его добавляют только при экспорте", "p3b_1_e": "Процессинг от рецептора экспорта не зависит: мРНК созревает. Но выйти через пору мРНП может только вместе с рецептором экспорта, поэтому зрелая мРНК накапливается в ядре.", "p3b_1_w2": "Импортин и сигнал ядерной локализации переносят белки в ядро, а не мРНК из ядра; экспорт мРНП идёт другим путём — через рецептор NXF1–NXT1, без Ran.", "p3b_1_w3": "Поли(А)-хвост добавляется в ядре, сразу после расщепления пре-мРНК, ещё до экспорта.", "p3b_2_q": "Нет сплайсосомы; кэпирование и образование 3′-конца проходят. Где окажется РНК этого гена?", "p3b_2_o1": "Останется в ядре с интронами и будет разрушена", "p3b_2_o2": "Выйдет в цитоплазму, и рибосомы будут транслировать её вместе с интронами", "p3b_2_o3": "Не получит кэпа: кэп присоединяется после сплайсинга", "p3b_2_e": "РНК с неудалёнными интронами в основном задерживается в ядре и разрушается; к поре она не попадает.", "p3b_2_w2": "Из ядра выходит в основном мРНП зрелой мРНК; РНК с интронами большей частью задерживается и разрушается — поэтому с неё обычно не синтезируется белок.", "p3b_2_w3": "Кэп присоединяется первым, когда синтезировано около 20 нуклеотидов РНК, задолго до сплайсинга.", "p3b_3_q": "Нет факторов расщепления и полиаденилирования. Что будет с 3′-концом РНК и где она окажется?", "p3b_3_o1": "Разреза после AAUAAA не будет, поли(А)-хвост не добавится; РНК задержится в ядре", "p3b_3_o2": "Поли(А)-хвост добавится к тому месту, где полимераза покинет ДНК", "p3b_3_o3": "Ничего не изменится: поли(А)-хвост закодирован в гене", "p3b_3_e": "3′-конец пре-мРНК образуется расщеплением, и только к этому концу поли(А)-полимераза добавляет хвост. Без расщепления нет хвоста, полимераза уходит дальше по ДНК, а РНК не экспортируется.", "p3b_3_w2": "Хвост добавляется к концу, созданному расщеплением; место терминации полимеразы его не задаёт.", "p3b_3_w3": "Поли(А)-полимераза работает без матрицы, поэтому хвост в гене не закодирован.", "p3b_4_q": "Все детали на месте. Когда в этой модели удаляется первый интрон?", "p3b_4_o1": "Во время транскрипции: полимераза ещё синтезирует дальние участки гена", "p3b_4_o2": "Только после того, как синтез всей пре-мРНК завершён", "p3b_4_o3": "В цитоплазме, после экспорта мРНК", "p3b_4_e": "Сплайсосома собирается на интроне, как только он синтезирован, и многие интроны удаляются котранскрипционно. Часть интронов удаляется позже, но тоже в ядре, до экспорта.", "p3b_4_w2": "Процессинг идёт и до окончания транскрипции: кэпирование и многие события сплайсинга происходят во время синтеза.", "p3b_4_w3": "Сплайсинг пре-мРНК завершается в ядре; в цитоплазму выходит уже зрелая мРНК.", "p3b_5_q": "Нет ферментов кэпирования. Что будет с РНК этого гена?", "p3b_5_o1": "Её 5′-конец разрушается экзонуклеазой, зрелой мРНК почти не будет", "p3b_5_o2": "Кэп присоединится позже, в цитоплазме", "p3b_5_o3": "мРНК созреет и выйдет из ядра, просто без кэпа", "p3b_5_e": "Без кэпа 5′-конец не защищён: такая РНК быстро становится субстратом 5′→3′-экзонуклеазы и разрушается, а синтез её часто обрывается рано. Без кэпа не идут и следующие этапы — экспорт и инициация трансляции.", "p3b_5_w2": "Кэпирование — событие в ядре, связанное с ранней транскрипцией; в цитоплазме кэп к мРНК не присоединяется.", "p3b_5_w3": "Кэп нужен и для защиты, и для экспорта: РНК без него разрушается.", "s3_v_intr_part": "первый удалён, последний остался", "s4_e3": "Экзон 3", "s4_e3_inc": "включён", "s4_e3_skip": "пропущен", "s4_ss": "5′-сайт сплайсинга интрона 1", "s4_ss_prox": "ближний", "s4_ss_dist": "дальний", "s4_ctrl_note": "Ген один и тот же; меняется только то, какие сайты сплайсинга использованы при созревании пре-мРНК. У интрона 1 два возможных 5′-сайта: ближний — у самого конца экзона 1 и дальний — на 35 нуклеотидов ниже по ходу транскрипции, внутри интрона. Длина экзона 3 — 63 нуклеотида (кратна трём). Длины участков условные.", "s4_pA": "А. Ген (пре-мРНК той же организации) и выбранные соединения экзонов", "s4_pB": "Б. Зрелая мРНК", "s4_pC": "В. Белок (схема; синтез белка — семинар 10)", "s4_lbl_stop": "стоп", "s4_lbl_e1": "экзон из одной 5′-НТО", "s4_lbl_e3": "альтернативный экзон", "s4_lbl_utr5": "5′-НТО: {n} нт", "s4_lbl_cds": "кодирующая область: {n} нт", "s4_lbl_utr3": "3′-НТО: {n} нт", "s4_lbl_prot_inc": "{n} аминокислот; тёмный участок кодирует экзон 3", "s4_lbl_prot_skip": "{n} аминокислот: нет внутреннего участка из 21 аминокислоты; начало и конец те же", "s4_r_ex": "Экзоны в зрелой мРНК", "s4_v_ex": "{e}", "s4_r_utr5": "5′-нетранслируемая область", "s4_v_nt": "{n} нт", "s4_r_cds": "Кодирующая область", "s4_r_cds_s": "от старт-кодона до стоп-кодона", "s4_v_cds": "{n} нт, {c} кодонов", "s4_r_prot": "Белок", "s4_v_prot_inc": "{n} аминокислот", "s4_v_prot_skip": "{n} аминокислот, без участка экзона 3", "s4_r_dna": "Последовательность гена", "s4_v_dna": "та же во всех вариантах", "s4_cap_inc_prox": "Используются все экзоны и ближний 5′-сайт интрона 1. Экзон 1 целиком нетранслируемый, экзон 2 содержит конец 5′-НТО и старт-кодон, экзон 4 — стоп-кодон и начало 3′-НТО, экзон 5 — остальную 3′-НТО.", "s4_cap_inc_prox_z": "Экзон — участок гена, который сохраняется в зрелой мРНК, а не обязательно кодирующий: в этом гене экзоны 1 и 5 целиком нетранслируемые, а экзоны 2 и 4 — частично.", "s4_cap_skip_prox": "Экзон 3 пропущен: экзон 2 соединён прямо с экзоном 4. Длина экзона 3 кратна трём, поэтому без него кодирующая область короче на 21 кодон, а начало и конец белка те же; внутреннего участка из 21 аминокислоты нет.", "s4_cap_skip_prox_z": "Альтернативный сплайсинг меняет состав зрелой мРНК, а последовательность гена остаётся прежней.", "s4_cap_inc_dist": "Использован дальний 5′-сайт интрона 1: участок, который при ближнем сайте удалялся с интроном, остался в экзоне 1. Удлинилась только 5′-НТО; кодирующая область и белок не изменились.", "s4_cap_inc_dist_z": "Не каждое изменение состава зрелой мРНК меняет белок: изменения в нетранслируемых областях последовательность аминокислот не затрагивают.", "s4_cap_skip_dist": "Сразу два альтернативных выбора: 5′-НТО длиннее (дальний 5′-сайт интрона 1), а экзон 3 пропущен — белок короче на внутренний участок из 21 аминокислоты.", "s4_cap_skip_dist_z": "Альтернативные события в одной пре-мРНК могут сочетаться; каждое затрагивает свой участок зрелой мРНК.", "s4b_take": "Экзон — участок гена, сохраняющийся в зрелой мРНК; интрон удаляется при сплайсинге. Экзоны не равны кодирующей последовательности: первый и последний экзоны обычно содержат нетранслируемые области (5′-НТО и 3′-НТО), а границы кодирующей области задают старт- и стоп-кодоны. При альтернативном сплайсинге из одной пре-мРНК образуются разные зрелые мРНК без изменения ДНК: пропуск кодирующего экзона меняет белок, а изменение нетранслируемой области — нет.", "s4t_note": "Порядок этапов — учебная модель; каждая молекула пре-мРНК сплайсируется одним способом. Длины участков условные.", "s4t_1": "Транскрипция: пре-мРНК повторяет организацию гена — экзоны и интроны в том же порядке.", "s4t_2": "Узнавание сайтов сплайсинга: малые ядерные РНК и белки сплайсосомы узнают 5′- и 3′-сайты интронов (GU…AG); здесь выбирается, какие сайты будут использованы.", "s4t_3_inc": "Соединение экзонов: удалены четыре интрона, экзоны 1–2–3–4–5 соединены.", "s4t_3_skip": "Соединение экзонов: экзон 2 соединён прямо с экзоном 4 — экзон 3 удалён вместе с соседними интронами.", "s4t_4": "Зрелая мРНК: кэп, 5′-НТО, кодирующая область, 3′-НТО, поли(А)-хвост; белок — по кодирующей области (семинар 10).", "p4b_1_q": "Условия: в части клеток экзон 3 пропускается при сплайсинге; ДНК гена во всех клетках одинакова. Что получится?", "p4b_1_o1": "мРНК короче на 63 нт, белок короче на 21 аминокислоту внутри; ген не изменён", "p4b_1_o2": "Белок оборвётся сразу после участка экзона 2", "p4b_1_o3": "В ДНК этих клеток экзон 3 утрачен", "p4b_1_e": "Экзон 2 соединяется прямо с экзоном 4. Длина экзона 3 кратна трём, поэтому без него сохраняются начало и конец белка, нет только внутреннего участка. Это изменение зрелой мРНК, а не гена.", "p4b_1_w2": "По условию длина экзона 3 кратна трём: после его пропуска рамка не сдвигается: кодоны экзона 4 остаются прежними, и белок не обрывается.", "p4b_1_w3": "ДНК по условию одинакова; альтернативный сплайсинг меняет состав зрелой мРНК, а не гена.", "p4b_2_q": "Все экзоны включены, но использован дальний 5′-сайт сплайсинга интрона 1 (на 35 нуклеотидов ниже по ходу транскрипции, чем ближний). Изменится ли белок?", "p4b_2_o1": "Нет: удлинится только 5′-нетранслируемая область", "p4b_2_o2": "Да: белок станет длиннее на участок из начала интрона 1", "p4b_2_o3": "Да: из-за длинного экзона 1 сдвинется старт-кодон", "p4b_2_e": "Экзон 1 целиком относится к 5′-НТО, старт-кодон — в экзоне 2. Дополнительный участок оказывается до старт-кодона, поэтому кодирующая область и белок прежние.", "p4b_2_w2": "Участок встал перед старт-кодоном, в нетранслируемую область: аминокислоты он не кодирует.", "p4b_2_w3": "Старт-кодон находится в экзоне 2 и не перемещается; меняется только расстояние от кэпа до него.", "p4b_3_q": "Экзон 1 этого гена не содержит ни одного кодона белка. Почему его называют экзоном?", "p4b_3_o1": "Он сохраняется в зрелой мРНК: экзон определяется сплайсингом, а не тем, кодирует ли он белок", "p4b_3_o2": "Это ошибка: экзон по определению кодирует аминокислоты", "p4b_3_o3": "Это интрон, который удаляется в части клеток", "p4b_3_e": "Экзон — участок, остающийся в зрелой РНК после сплайсинга. Первый и последний экзоны часто целиком или частично нетранслируемые; бывают и гены, экзоны которых вообще не кодируют белок.", "p4b_3_w2": "Понятия «экзон» и «кодирующая последовательность» не совпадают: границы экзонов задают сайты сплайсинга, а кодирующей области — старт- и стоп-кодоны.", "p4b_3_w3": "Экзон 1 сохраняется в зрелой мРНК во всех вариантах; удаляются только интроны.", "p4b_4_q": "Вариант: экзон 3 пропущен, дальний 5′-сайт интрона 1. Где в зрелой мРНК 3′-нетранслируемая область?", "p4b_4_o1": "Часть экзона 4 после стоп-кодона и весь экзон 5", "p4b_4_o2": "Интрон 4: он не кодирует белок", "p4b_4_o3": "Только поли(А)-хвост", "p4b_4_e": "3′-НТО начинается после стоп-кодона в экзоне 4 и продолжается в экзоне 5 до места расщепления; поли(А)-хвост добавляется к ней после расщепления и в гене не закодирован.", "p4b_4_w2": "Интрон удаляется при сплайсинге и в зрелую мРНК не входит; нетранслируемые области — части экзонов.", "p4b_4_w3": "Поли(А)-хвост следует за 3′-НТО; сама 3′-НТО — часть последовательности экзонов.", "a_prob_t": "Исследование", "a_lim_t": "Чего модель не показывает", "a_new_t": "Новые данные и как это установили", "a_how_t": "Как это установили:", "hint_btn": "Подсказка {i} из {n}", "hint_n": "Подсказка {i}.", "s1a_prob": "На участке ДНК 30 пар нуклеотидов две условные транскрипционные единицы, которые в середине участка перекрываются. Может ли один и тот же участок цепи ДНК быть матричным для одной единицы и кодирующим для другой? Как по готовой РНК восстановить матрицу?", "s1a_sel": "Выбрана единица", "s1a_sel_I": "I", "s1a_sel_II": "II", "s1a_dir": "Ориентация единицы II", "s1a_dir_opp": "встречная к I (синтез влево)", "s1a_dir_same": "как у I (синтез вправо, промотор внутри единицы I)", "s1a_note": "Единица I: промотор слева, синтез вправо. Единицы I и II перекрываются на 6 пар нуклеотидов в середине участка. Последовательность условная; РНК, матрица и направление вычисляются по правилам комплементарности и антипараллельности. Длина единиц (16 нуклеотидов) условная.", "s1a_pA": "А. Участок ДНК, две транскрипционные единицы и РНК выбранной", "s1a_pA_mask": "А. Участок ДНК: промоторы и единицы не показаны", "s1a_pB": "Б. Матрица и РНК каждой единицы", "s1a_lbl_unit_I": "единица I", "s1a_lbl_unit_II": "единица II", "s1a_lbl_overlap": "перекрывание: {n} п. н.", "s1a_lbl_row": "{u}: матрица — {s} цепь, синтез {d}", "s1a_lbl_rna": "РНК 5′-{r}-3′ · матрица 3′-{m}-5′", "s1a_lbl_given": "Дано: РНК 5′-{r}-3′", "s1a_lbl_given_dir": "Синтез шёл справа налево; единица находится на этом участке.", "s1a_lbl_maskq": "Найдите матричную цепь и запишите её от 3′ к 5′.", "s1a_v_top": "верхняя", "s1a_v_bot": "нижняя", "s1a_v_dir_r": "слева направо", "s1a_v_dir_l": "справа налево", "s1a_r_tpl": "Матричная цепь", "s1a_r_tpl_s": "для единицы: {u}", "s1a_r_dirg": "Направление синтеза РНК", "s1a_r_rna": "РНК", "s1a_r_rna_s": "от 5′ к 3′", "s1a_v_seq": "5′-{s}-3′", "s1a_r_m35": "Матрица", "s1a_r_m35_s": "записана от 3′ к 5′, в направлении движения РНК-полимеразы", "s1a_v_m35": "3′-{s}-5′", "s1a_r_same": "Матрица у единиц I и II", "s1a_v_same_yes": "одна и та же цепь", "s1a_v_same_no": "разные цепи", "s1a_cap_I_opp": "Единица I транскрибируется вправо, её матрица — нижняя цепь. Единица II встречная: её матрица — верхняя цепь. В участке перекрывания одни и те же нуклеотиды верхней цепи служат матрицей для единицы II и кодирующей цепью для единицы I.", "s1a_cap_I_opp_z": "Статус «матричная» или «кодирующая» относится к транскрипционной единице, а не к цепи всей хромосомы и даже не к участку цепи.", "s1a_cap_II_opp": "Выбрана единица II: промотор справа, синтез влево. Её матрица — верхняя цепь, а РНК совпадает с нижней цепью, прочитанной от 5′ к 3′ (справа налево), с заменой T на U. В участке перекрывания РНК единиц I и II комплементарны друг другу.", "s1a_cap_II_opp_z": "Чтобы найти РНК встречной единицы, нижнюю цепь читают от её 5′-конца — справа налево.", "s1a_cap_I_same": "Единица II ориентирована так же, как I, и её промотор лежит внутри единицы I: у обеих матрица — нижняя цепь. Для обеих единиц верхняя цепь — кодирующая.", "s1a_cap_I_same_z": "Перекрывание единиц одной ориентации — частный случай: в геноме встречаются перекрывания обеих ориентаций.", "s1a_cap_II_same": "Единица II теперь транскрибируется вправо: её матрица — нижняя цепь, как у единицы I, и РНК совпадает с верхней цепью (T вместо U).", "s1a_cap_II_same_z": "Матрицу задаёт ориентация промотора, поэтому при смене ориентации меняются и матрица, и последовательность РНК.", "s1a_cap_mask": "Обратная задача: известны РНК и направление синтеза; промоторы скрыты.", "s1a_cap_mask_z": "Сначала найдите на участке последовательность, совпадающую с РНК при чтении от 5′ к 3′ (U → T), — это кодирующая цепь.", "s1a_take": "Обе цепи одного участка ДНК могут служить матрицей — каждая для своей транскрипционной единицы, даже там, где единицы перекрываются, но не для одной и той же единицы одновременно: направление синтеза РНК (5′→3′) и антипараллельность задают единственную матрицу. Поэтому цепь хромосомы и даже отдельный её участок нельзя назвать кодирующими или матричными вообще — только по отношению к определённой единице. По РНК и направлению синтеза матрица восстанавливается однозначно: это цепь, комплементарная РНК и антипараллельная ей.", "s1a_lim": "Модель не показывает настоящих промоторов (их последовательности длиннее и сложнее) и не показывает, мешают ли две встречные единицы друг другу и что происходит с комплементарными участками двух РНК. Длина единиц и последовательность условные; процессинг РНК здесь не учитывается.", "s1a_new": "В геноме человека обе цепи транскрибируются во многих участках. По современным оценкам, около четверти генов человека имеют рядом промотор, направленный навстречу, а пар, в которых длинная некодирующая РНК перекрывается с белок-кодирующим геном, найдено более 5000. Ожидали, что встречная транскрипция будет подавлять соседний ген (это назвали транскрипционной интерференцией). Однако у большинства перекрывающихся пар активность обеих единиц изменяется согласованно, а не противоположно; для встречных промоторов полногеномные данные противоречивы (в части работ найдено ослабление, в части — нет), а сильное подавление показано для отдельных генов.", "s1a_how": "сравнили, как меняется количество РНК обеих единиц в тысячах пар перекрывающихся генов в разных клетках и условиях. Согласованное изменение — корреляция, а не доказательство отсутствия влияния: отдельные гены могут подавлять друг друга.", "s1a_tl_note": "Порядок этапов — учебная модель; длина единиц и последовательность условные.", "s1a_tl_1": "Промотор выбранной единицы: на нём собираются общие факторы и РНК-полимераза II; он задаёт точку начала и направление синтеза.", "s1a_tl_2_r": "Синтез идёт вправо: матрица — нижняя цепь, полимераза движется вдоль неё от 3′ к 5′.", "s1a_tl_2_l": "Синтез идёт влево: матрица — верхняя цепь, полимераза движется вдоль неё от 3′ к 5′, справа налево.", "s1a_tl_3": "РНК синтезирована: она комплементарна матрице и совпадает с кодирующей цепью единицы (T вместо U).", "s1a_tl_4_opp": "Сравнение: у единиц I и II матрицы на разных цепях; в участке перекрывания одна цепь — матрица для II и кодирующая для I.", "s1a_tl_4_same": "Сравнение: у единиц I и II матрица — одна и та же нижняя цепь.", "p1a_1_q": "Условия: единицы I и II перекрываются в середине участка; единица II встречная (промотор справа, синтез влево). Какая цепь служит матрицей единице II в участке перекрывания?", "p1a_1_o1": "Верхняя — та, что в этом же участке кодирующая для единицы I", "p1a_1_o2": "Нижняя, как у единицы I: в участке перекрывания матрица общая", "p1a_1_o3": "Обе сразу, по половине каждой", "p1a_1_e": "При синтезе влево матрица должна идти от 3′ к 5′ справа налево — это верхняя цепь, в том числе в участке перекрывания. Для единицы I те же нуклеотиды верхней цепи — кодирующая цепь.", "p1a_1_w2": "Матрицу задаёт ориентация промотора конкретной единицы; у перекрывающегося участка нет общей матрицы для единиц разной ориентации.", "p1a_1_w3": "Для одной единицы матрица одна: РНК растёт 5′→3′ и антипараллельна только одной цепи.", "p1a_1_h1": "В какую сторону растёт 3′-конец РНК единицы II?", "p1a_1_h2": "Матрица антипараллельна РНК: у неё 3′-конец там, где у РНК 5′-конец.", "p1a_2_q": "Ориентацию единицы II изменили: теперь её промотор лежит внутри единицы I, и синтез идёт вправо. Что станет её матрицей?", "p1a_2_o1": "Нижняя цепь, как у единицы I, и РНК будет другой последовательности", "p1a_2_o2": "Верхняя цепь: матрица участка не меняется", "p1a_2_o3": "Та же РНК, что и раньше, только записанная в обратном порядке", "p1a_2_e": "При синтезе вправо матрица — нижняя цепь; РНК теперь совпадает с верхней цепью (T вместо U) и отличается от прежней.", "p1a_2_w2": "Матрица зависит от ориентации единицы, а не от участка ДНК: при синтезе вправо верхняя цепь ориентирована так же, как РНК, и быть матрицей не может.", "p1a_2_w3": "РНК с новой матрицы — копия другой цепи, и прочитать её «в обратном порядке» нельзя: у неё свои 5′- и 3′-концы.", "p1a_2_h1": "Сравните с единицей I: она тоже транскрибируется вправо.", "p1a_3_q": "В участке перекрывания единица I транскрибируется вправо, единица II — влево. Чем служит верхняя цепь этого участка?", "p1a_3_o1": "Кодирующей цепью для единицы I и матричной — для единицы II", "p1a_3_o2": "Только кодирующей: она записана от 5′ к 3′ слева направо", "p1a_3_o3": "Матричной для обеих единиц: участок общий", "p1a_3_e": "«Кодирующая» и «матричная» — роли цепи по отношению к определённой транскрипционной единице. В участке перекрывания одни и те же нуклеотиды верхней цепи играют обе роли — для разных единиц, а РНК двух единиц в этом участке комплементарны друг другу.", "p1a_3_w2": "Порядок записи 5′→3′ слева направо — условность рисунка; роль цепи задаёт промотор единицы.", "p1a_3_w3": "Для единицы I верхняя цепь ориентирована так же, как её РНК (5′→3′ вправо), и матрицей быть не может.", "p1a_4_q": "Дана РНК 5′-GGCUAACGUAUG-3′, синтез шёл справа налево. Какая цепь и какой участок служили матрицей?", "p1a_4_o1": "Верхняя цепь, участок у левого края", "p1a_4_o2": "Нижняя цепь, участок у левого края", "p1a_4_o3": "Верхняя цепь, участок у правого края", "p1a_4_e": "Прочитайте нижнюю цепь у левого края справа налево (от её 5′-конца): GGCTAACGTATG — это последовательность РНК (U → T). Значит, нижняя цепь здесь кодирующая, матрица — верхняя цепь, а 5′-конец РНК справа: синтез шёл справа налево.", "p1a_4_w2": "Нижняя цепь этого участка совпадает с РНК (U → T) — она кодирующая; матрицей служит комплементарная ей верхняя цепь.", "p1a_4_w3": "У правого края ни одна цепь не совпадает с этой РНК. Найдите GGCTAACGTATG, читая каждую цепь от её 5′-конца.", "p1a_4_h1": "Найдите на участке последовательность GGCTAACGTATG, читая каждую цепь от её 5′-конца.", "p1a_4_h2": "Цепь, совпадающая с РНК, — кодирующая.", "p1a_5_q": "Та же РНК 5′-GGCUAACGUAUG-3′. Как записать её матрицу от 3′ к 5′, в направлении движения РНК-полимеразы?", "p1a_5_o1": "3′-CCGATTGCATAC-5′", "p1a_5_o2": "3′-GGCTAACGTATG-5′", "p1a_5_o3": "5′-CCGATTGCATAC-3′", "p1a_5_e": "Напротив 5′-конца РНК стоит 3′-конец матрицы: G — C, G — C, C — G, U — A и далее. Матрица комплементарна РНК (U ↔ A) и антипараллельна ей; это верхняя цепь у левого края участка, прочитанная справа налево.", "p1a_5_w2": "Это сама РНК с T вместо U, то есть кодирующая цепь, да ещё с перепутанными концами: она не комплементарна РНК.", "p1a_5_w3": "Буквы верные, а концы перепутаны: цепь, комплементарная РНК, должна иметь 3′-конец напротив 5′-конца РНК.", "p1a_5_h1": "Подберите к каждому нуклеотиду РНК комплементарный, начиная с 5′-конца РНК.", "p1a_5_h2": "Первый нуклеотид матрицы стоит у её 3′-конца.", "s2a_prob": "Начатый синтез РНК не всегда доходит до конца гена: РНК-полимераза II после начала синтеза делает паузу, и часть полимераз прекращает синтез у промотора или позже. Почему число начатых транскриптов не равно числу завершённых и как по наблюдениям различить причины, если завершённых мало?", "s2a_ki": "Частота инициации (условно)", "s2a_u_min": "в мин", "s2a_ki_05": "0,5", "s2a_ki_1": "1", "s2a_ki_2": "2", "s2a_pr": "Переходят к продуктивной элонгации после паузы", "s2a_u_pc": "%", "s2a_pr_25": "25 %", "s2a_pr_50": "50 %", "s2a_pr_90": "90 %", "s2a_pl": "Из перешедших прекращают синтез в теле гена", "s2a_pl_0": "0 %", "s2a_pl_40": "40 %", "s2a_pl_75": "75 %", "s2a_note": "Наблюдение — 30 мин от начала активности гена. Все значения — учебные допущения модели, а не измеренные константы: прохождение гена — 10 мин, полимеразы, прекращающие синтез в теле гена, останавливаются на его середине. Числа — средние ожидаемые, округлённые до целых.", "s2a_pA": "А. Ген через {m} мин", "s2a_pA_mask": "А. Ген через {m} мин: известно только число завершённых РНК", "s2a_pB": "Б. Исходы начатых синтезов (условные числа)", "s2a_lbl_prom": "промотор", "s2a_lbl_body": "тело гена", "s2a_lbl_end": "конец гена", "s2a_lbl_short": "коротких РНК у промотора: {n}", "s2a_lbl_lost": "прекращено в теле гена: {n}", "s2a_lbl_done": "завершено: {n}", "s2a_lbl_maskobs": "Завершено {n} транскриптов; в контроле — {k}", "s2a_lbl_sum": "{a} начато = {b} у промотора + {c} в теле гена + {d} на гене сейчас + {e} завершено", "s2a_bar_init": "начато", "s2a_bar_prom": "прекращено\nу промотора", "s2a_bar_lost": "прекращено\nв теле гена", "s2a_bar_ongene": "на гене\nсейчас", "s2a_bar_done": "завершено", "s2a_bar_ctrl": "контроль", "s2a_r_init": "Начато синтезов", "s2a_r_init_s": "за 30 мин", "s2a_r_prom": "Прекращено у промотора", "s2a_r_lost": "Прекращено в теле гена", "s2a_r_ongene": "На гене сейчас", "s2a_r_done": "Завершено полных транскриптов", "s2a_r_done_s": "за 30 мин", "s2a_r_ctrl": "Завершено в контроле", "s2a_v_n": "{n}", "s2a_cap_ctrl": "Контроль модели: частота инициации — 2 в минуту, 90 % полимераз после паузы переходят к продуктивной элонгации, в теле гена синтез не прекращается. За 30 мин завершено {d} транскриптов — меньше, чем начато: часть полимераз ещё на гене, часть прекратила синтез у промотора.", "s2a_cap_ctrl_z": "Даже без нарушений число завершённых РНК меньше числа начатых: синтез занимает время, а часть начатых синтезов непродуктивна.", "s2a_cap_init": "Инициация стала реже, а доля продуктивных прежняя: все счётчики уменьшились пропорционально. Завершено {d} (в контроле {k}); коротких РНК у промотора почти нет.", "s2a_cap_init_z": "При редкой инициации мало и начатых, и прекращённых синтезов: соотношение между ними не меняется.", "s2a_cap_init_mix": "Изменено несколько условий сразу: инициация реже, и ещё ослаблен другой этап. Завершено {d} (в контроле {k}).", "s2a_cap_init_mix_z": "При нескольких нарушениях их вклады перемножаются; чтобы отделить их, нужны счётчики разных этапов.", "s2a_cap_pause": "Начатых синтезов столько же, но большинство полимераз прекращает синтез у промотора после паузы: коротких РНК много, завершено лишь {d} (в контроле {k}).", "s2a_cap_pause_z": "Инициация не гарантирует полного транскрипта: решающим может быть переход от паузы к продуктивной элонгации.", "s2a_cap_pause_mix": "Ослаблены два этапа после инициации: переход от паузы и продолжение синтеза в теле гена. Завершено {d} (в контроле {k}).", "s2a_cap_pause_mix_z": "Короткие РНК у промотора и прекращённые в теле гена — разные признаки двух этапов.", "s2a_cap_body": "Инициация и паузы как в контроле, но большинство продуктивных полимераз прекращает синтез в теле гена: много незавершённых РНК середины гена, завершено {d} (в контроле {k}).", "s2a_cap_body_z": "Потеря продуктивности после ухода от промотора не видна по числу начатых синтезов и коротких РНК.", "s2a_cap_mask": "Обратная задача: известно только число завершённых транскриптов. Значения параметров скрыты.", "s2a_cap_mask_z": "Подумайте, сколько разных сочетаний условий дают такой же итог.", "s2a_take": "Число завершённых транскриптов зависит от трёх независимых этапов: частоты инициации, перехода от паузы к продуктивной элонгации и продолжения синтеза до конца гена; их доли перемножаются. Одинаково малое число завершённых РНК могут дать разные причины, поэтому одно это число на причину не указывает. Различить их можно по дополнительным наблюдениям: числу начатых синтезов, количеству коротких РНК у промотора и незавершённых РНК в теле гена.", "s2a_lim": "Все значения модели — учебные допущения: частоты, доли и время прохождения гена не измерены для какого-либо гена. Модель не показывает, что инициация идёт вспышками, что пауза длится разное время у разных генов, что прекратившая синтез полимераза может уйти с ДНК или быть разрушена, и что короткие РНК быстро разрушаются в ядре (в модели они считаются, а не наблюдаются напрямую). Модель не показывает и регуляцию, меняющую эти доли, — это семинар 11 и курс «Молекулярная биология».", "s2a_new": "У животных и человека РНК-полимераза II, синтезировав 20–100 нуклеотидов, обычно останавливается у промотора (пауза). Дальше возможны два исхода: полимераза переходит к продуктивной элонгации или прекращает синтез тут же, и короткая РНК разрушается. Оказалось, что такое преждевременное прекращение у промотора — не редкая ошибка, а широко распространённый исход: за его счёт меняется, сколько начатых синтезов становятся полными транскриптами. Отрезает растущую РНК и освобождает полимеразу специальный белковый комплекс (Integrator), работающий вместе с фосфатазой.", "s2a_how": "в клетках человека и других животных останавливали инициацию и измеряли, сколько времени полимеразы остаются у промоторов; другим способом показали, что полимеразы у промотора сменяются быстрее, чем уходят в элонгацию, — значит, часть их прекращает синтез. Это сводка многих работ в обзоре; доли для конкретных генов различаются.", "s2a_tl_note": "Шкала — время наблюдения, по 5 мин на этап. Все числа на схеме — условные средние, округлённые до целых.", "s2a_tl_1": "0–5 мин: начинается инициация; часть полимераз после паузы прекращает синтез у промотора.", "s2a_tl_2": "5–10 мин: продуктивные полимеразы движутся по гену; часть их может прекратить синтез на середине гена.", "s2a_tl_3": "10–15 мин: первые полимеразы дошли до конца гена — появились первые завершённые транскрипты; с этого момента число полимераз на гене постоянно.", "s2a_tl_4": "15–20 мин: сколько полимераз начинает синтез, столько его завершает или прекращает; завершённые транскрипты накапливаются.", "s2a_tl_5": "20–25 мин: счётчики растут с постоянной скоростью.", "s2a_tl_6": "25–30 мин: итог; в каждый момент начато = прекращено у промотора + прекращено в гене + на гене + завершено.", "p2a_1_q": "Условия: частота инициации — 2 в минуту, после паузы к продуктивной элонгации переходят 90 % полимераз, в теле гена синтез не прекращается; за 30 мин завершено 36 транскриптов. Переходить стали только 25 %. Что изменится?", "p2a_1_o1": "Начато столько же (60), завершено около 10, коротких РНК у промотора — 45", "p2a_1_o2": "Начато меньше, а завершённых столько же", "p2a_1_o3": "Ничего не изменится: инициация осталась прежней", "p2a_1_e": "Частота инициации прежняя, поэтому начато 60. Но к продуктивной элонгации переходит в 3,6 раза меньше полимераз, и завершённых около 10; остальные прекращают синтез у промотора.", "p2a_1_w2": "Пауза наступает после инициации: число начатых синтезов от неё не зависит, а число полных транскриптов — зависит.", "p2a_1_w3": "Начатый синтез ещё не означает полного транскрипта: от перехода от паузы к элонгации зависит, будет ли транскрипт полным.", "p2a_1_h1": "Какие счётчики зависят от того, что происходит после паузы?", "p2a_2_q": "Контроль: частота инициации — 2 в минуту, после паузы к продуктивной элонгации переходят 90 % полимераз, в теле гена синтез не прекращается. Частоту инициации снизили до 0,5 в минуту; остальное без изменений. Каким будет итог за 30 мин?", "p2a_2_o1": "Начато и завершено в 4 раза меньше (15 и 9); остальные счётчики — примерно во столько же раз (показания округлены)", "p2a_2_o2": "Начато 15, а завершено, как прежде, 36", "p2a_2_o3": "Начато 15, и коротких РНК у промотора стало больше", "p2a_2_e": "Доли этапов прежние, поэтому все потоки уменьшаются в одно и то же число раз — во столько, во сколько реже инициация.", "p2a_2_w2": "Завершиться может только начатый синтез: завершённых не бывает больше, чем позволяет число начатых.", "p2a_2_w3": "Доля прекращающих синтез у промотора не изменилась, а начатых синтезов меньше — значит, и коротких РНК меньше.", "p2a_3_q": "Контроль: частота инициации — 2 в минуту, после паузы к продуктивной элонгации переходят 90 % полимераз. Новое условие: из перешедших к продуктивной элонгации 75 % прекращают синтез в теле гена. Что покажут счётчики за 30 мин?", "p2a_3_o1": "Начато 60, у промотора — 6, как в контроле; прекращено в теле гена — 34; завершено 9", "p2a_3_o2": "Много коротких РНК у промотора, как при нарушении перехода от паузы", "p2a_3_o3": "Начато 15: прекращение в теле гена снижает частоту инициации", "p2a_3_e": "Инициация и пауза не затронуты, поэтому начато и коротких РНК — как в контроле. Синтез обрывается позже, и это видно по незавершённым РНК середины гена.", "p2a_3_w2": "Короткие РНК у промотора образуются до перехода к элонгации; здесь нарушен более поздний этап.", "p2a_3_w3": "В модели этапы независимы: прекращение синтеза в теле гена не меняет частоту инициации.", "p2a_4_q": "За 30 мин завершено около 10 транскриптов, в контроле — 36. Значения параметров скрыты. Какой вывод допустим?", "p2a_4_o1": "Причину по этому числу назвать нельзя: так же мало завершённых при редкой инициации, при нарушении перехода от паузы, при прекращении синтеза в теле гена и при их сочетаниях", "p2a_4_o2": "Инициация снижена: завершённых мало, значит, мало и начатых синтезов", "p2a_4_o3": "Нарушена терминация: полные транскрипты не освобождаются", "p2a_4_e": "В модели около 10 завершённых дают разные условия: каждое из трёх нарушений по отдельности и их сочетания (например, инициация 1 в минуту и переход от паузы у 50 % полимераз). Одно число завершённых РНК на причину не указывает; нужны счётчики других этапов.", "p2a_4_w2": "Мало завершённых бывает и при прежнем числе начатых синтезов — если синтез прекращается после паузы или в теле гена.", "p2a_4_w3": "В модели терминация не меняется; полные транскрипты считаются завершёнными, когда полимераза дошла до конца гена.", "p2a_4_h1": "Сколько завершённых транскриптов было бы при частоте инициации 0,5 в минуту? А если после паузы к продуктивной элонгации переходят только 25 % полимераз?", "p2a_4_h2": "Сравните, что предсказывает каждая из трёх причин для числа начатых синтезов и коротких РНК у промотора.", "p2a_5_q": "Известно, что нарушение одно. Какие два наблюдения позволят различить три причины, которые дают около 10 завершённых транскриптов?", "p2a_5_o1": "Число начатых синтезов и число коротких РНК у промотора", "p2a_5_o2": "Число завершённых транскриптов в двух повторах наблюдения", "p2a_5_o3": "Только число полимераз на гене сейчас", "p2a_5_e": "Число начатых отделяет редкую инициацию (15 против 60). Короткие РНК у промотора отделяют нарушение перехода от паузы (45) от прекращения в теле гена (6). Счётчик незавершённых РНК в теле гена подтверждает третью причину.", "p2a_5_w2": "Повтор того же наблюдения даст то же число: оно одинаково при всех трёх причинах.", "p2a_5_w3": "Полимераз на гене мало при всех трёх причинах; это наблюдение одно их не разделяет.", "p2a_5_h1": "Найдите в показаниях счётчик, который отличает одну причину от двух других.", "p2a_5_h2": "Затем — счётчик, который разделит оставшиеся две.", "s3a_prob": "Транскрипция идёт, но мРНК в цитоплазме мало. В учебной модели РНК гена разделена на три пула, которые сменяют друг друга: пре-мРНК в ядре, зрелая мРНК в ядре, мРНК в цитоплазме; каждая молекула в каждый момент находится в одном пуле (в клетке процессинг во многом идёт во время транскрипции, и модель это упрощает). Как по количеству РНК в ядре и в цитоплазме отличить замедление процессинга от замедления экспорта и от снижения синтеза?", "s3a_s": "Синтез пре-мРНК (условно)", "s3a_s_10": "10 в мин", "s3a_s_4": "4 в мин", "s3a_kp": "Процессинг: созревает за минуту", "s3a_kp_30": "30 % пре-мРНК", "s3a_kp_3": "3 %", "s3a_ke": "Экспорт: выходит за минуту", "s3a_ke_20": "20 % зрелых ядерных мРНК", "s3a_ke_2": "2 %", "s3a_note": "Наблюдение — 60 мин от начала синтеза, шаг модели — 1 мин. Разрушается за минуту: 5 % пре-мРНК, 2 % зрелых мРНК в ядре и 2 % в цитоплазме. Все значения — учебные допущения, а не измеренные величины; в модели ни одна молекула не возникает и не исчезает без перехода — синтезировано = сумма пулов + разрушено. Пулы — балансовое учебное представление состояний РНК, а не хронология процессинга одной молекулы: в клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции.", "s3a_pN": "Ядро · через {m} мин", "s3a_pC": "Цитоплазма", "s3a_pB": "Б. Пулы во времени (условные единицы)", "s3a_pool_pre": "пре-мРНК", "s3a_pool_nuc": "зрелая мРНК в ядре", "s3a_pool_cyt": "мРНК в цитоплазме", "s3a_lbl_syn": "синтез {s}/мин", "s3a_lbl_proc": "процессинг", "s3a_lbl_k": "{k} % в мин", "s3a_lbl_exp": "экспорт {k} % в мин", "s3a_lbl_dn": "разрушено в ядре: {n}", "s3a_lbl_dc": "разрушено в цитоплазме: {n}", "s3a_lbl_ctrl": "контроль", "s3a_leg": "янтарная — пре-мРНК · фиолетовая — зрелая в ядре · зелёная — в цитоплазме", "s3a_leg_mask": "зелёная — мРНК в цитоплазме · пунктир — контроль", "s3a_r_tot": "Синтезировано пре-мРНК", "s3a_r_tot_s": "за 60 мин", "s3a_r_pre": "Пре-мРНК в ядре", "s3a_r_nuc": "Зрелая мРНК в ядре", "s3a_r_cyt": "мРНК в цитоплазме", "s3a_r_cyt_s": "через 60 мин", "s3a_r_ctrl": "мРНК в цитоплазме в контроле", "s3a_r_deg": "Разрушено", "s3a_r_deg_s": "в ядре + в цитоплазме", "s3a_v_n": "{n}", "s3a_v_deg": "{a} + {b}", "s3a_cap_ctrl": "Контроль модели: пре-мРНК созревает быстрее, чем разрушается, и зрелая мРНК быстро выходит в цитоплазму. Через 60 мин в цитоплазме {c} молекул; в ядре их немного.", "s3a_cap_ctrl_z": "Даже без нарушений не вся синтезированная РНК доходит до цитоплазмы: часть разрушается в ядре.", "s3a_cap_proc": "Процессинг замедлен в 10 раз: пре-мРНК накапливается в ядре и чаще разрушается, не успев созреть. Зрелой мРНК в ядре мало, в цитоплазме — {c} (в контроле {k}).", "s3a_cap_proc_z": "Признак замедленного процессинга — избыток пре-мРНК в ядре при малом количестве зрелой мРНК.", "s3a_cap_exp": "Экспорт замедлен в 10 раз: процессинг идёт нормально, и зрелая мРНК накапливается в ядре. В цитоплазме — {c} (в контроле {k}).", "s3a_cap_exp_z": "Признак замедленного экспорта — избыток зрелой мРНК в ядре при нормальном количестве пре-мРНК.", "s3a_cap_tx": "Синтез снижен в 2,5 раза: все пулы уменьшились почти пропорционально. В цитоплазме — {c} (в контроле {k}); избытка ни пре-мРНК, ни зрелой мРНК в ядре нет.", "s3a_cap_tx_z": "Если ни один ядерный пул не накапливается, причину ищут до процессинга — в синтезе.", "s3a_cap_mix": "Изменено несколько условий сразу. В цитоплазме — {c} (в контроле {k}); вклады этапов перемножаются.", "s3a_cap_mix_z": "Чтобы отделить вклады нескольких нарушений, нужны все три пула и скорость синтеза.", "s3a_cap_mask": "Обратная задача: известно только количество мРНК в цитоплазме. Переключатели скрыты.", "s3a_cap_mask_z": "Сколько разных причин дают такой же итог?", "s3a_take": "Количество мРНК в цитоплазме определяется не только транскрипцией: каждая молекула проходит процессинг и экспорт и на каждом этапе может разрушиться. Одинаково мало цитоплазматической мРНК дают сниженный синтез, замедленный процессинг и замедленный экспорт; различить их можно по ядерным пулам: при замедленном процессинге накапливается пре-мРНК, при замедленном экспорте — зрелая мРНК в ядре, при сниженном синтезе не накапливается ни то ни другое.", "s3a_lim": "Это балансовая модель состояний РНК, а не буквальная хронология процессинга одной молекулы: в реальной клетке кэпирование и многие события сплайсинга происходят ещё во время транскрипции. Все доли и скорости модели — учебные допущения, не измеренные для какого-либо гена. Модель не показывает, что процессинг идёт в несколько этапов и во время транскрипции, что разные интроны удаляются с разной скоростью, что зрелая мРНК в цитоплазме разрушается с разной скоростью у разных генов (время жизни мРНК — курс «Молекулярная биология»), и что клетка может регулировать задержку РНК в ядре.", "s3a_new": "Не все интроны удаляются во время транскрипции. В клетках млекопитающих 27–40 % интронов ещё присутствуют в уже полиаденилированной РНК, связанной с хроматином: они удаляются после окончания синтеза, пока РНК остаётся у места транскрипции. В клетках человека линии K562 медиана времени полужизни мРНК на хроматине — около 50 мин, а мРНК некоторых генов остаются на хроматине 170 мин и дольше. РНК с так называемыми задержанными интронами удерживается в ядре, пока интрон не будет удалён; иначе её разрушают в ядре. Так задержка сплайсинга определяет, когда и сколько мРНК выйдет в цитоплазму.", "s3a_how": "разделили РНК клеток на фракции — связанную с хроматином, ядерную и цитоплазматическую — и определили, какие интроны в каждой ещё есть; время пребывания на хроматине измеряли по метке, встроенной в новосинтезированную РНК. Это сводка многих работ в обзоре; доли и времена различаются между типами клеток и генами.", "s3a_tl_note": "Шкала — время наблюдения, по 10 мин на этап. Числа на схеме — условные, округлённые до целых.", "s3a_tl_1": "0–10 мин: синтезируется пре-мРНК; часть её уже созрела.", "s3a_tl_2": "10–20 мин: зрелая мРНК выходит в цитоплазму.", "s3a_tl_3": "20–30 мин: ядерные пулы приближаются к постоянному уровню; пул перед замедленным этапом растёт дольше.", "s3a_tl_4": "30–40 мин: мРНК в цитоплазме продолжает накапливаться.", "s3a_tl_5": "40–50 мин: распад идёт всё время — разрушенных молекул всё больше.", "s3a_tl_6": "50–60 мин: итог; синтезировано = пре-мРНК + зрелая в ядре + в цитоплазме + разрушено.", "p3a_1_q": "Условия: синтез 10 в минуту, процессинг 30 %, экспорт 20 % за минуту; через 60 мин в цитоплазме 254 мРНК. Экспорт замедлили до 2 % в минуту. Что изменится?", "p3a_1_o1": "Зрелой мРНК в ядре станет около 190, в цитоплазме — около 100; пре-мРНК — как в контроле", "p3a_1_o2": "Накопится пре-мРНК: экспорт нужен для её созревания", "p3a_1_o3": "Изменится только цитоплазма: ядерные пулы останутся прежними", "p3a_1_e": "Процессинг не затронут, поэтому пре-мРНК столько же. Зрелая мРНК выходит медленнее и накапливается в ядре; в цитоплазму попадает меньше.", "p3a_1_w2": "Процессинг идёт до экспорта и от него в модели не зависит: пре-мРНК созревает как прежде.", "p3a_1_w3": "Молекулы, не вышедшие из ядра, не исчезают: они остаются в ядерном пуле, пока не выйдут или не разрушатся.", "p3a_1_h1": "Какой пул стоит непосредственно перед замедленным этапом?", "p3a_2_q": "Контроль: синтез 10 пре-мРНК в минуту, процессинг 30 %, экспорт 20 % за минуту. Процессинг замедлили до 3 % в минуту (в 10 раз). Что покажут пулы через 60 мин?", "p3a_2_o1": "Пре-мРНК около 120, зрелой в ядре около 17, в цитоплазме около 100", "p3a_2_o2": "Зрелой мРНК в ядре станет больше: она дольше остаётся там", "p3a_2_o3": "Цитоплазматической мРНК станет больше: созревшие молекулы надёжнее", "p3a_2_e": "Перед замедленным этапом накапливается пре-мРНК, и больше её разрушается, не успев созреть. Зрелой мРНК образуется меньше — меньше её и в ядре, и в цитоплазме.", "p3a_2_w2": "Зрелая мРНК образуется из пре-мРНК; при замедленном процессинге её поступление снижается, а не растёт.", "p3a_2_w3": "В цитоплазму выходит только зрелая мРНК; если её образуется меньше, меньше и в цитоплазме.", "p3a_3_q": "Контроль: синтез 10 пре-мРНК в минуту, процессинг 30 %, экспорт 20 % за минуту. Синтез снизили до 4 в минуту. Что изменится через 60 мин?", "p3a_3_o1": "Все пулы уменьшатся примерно в 2,5 раза; ни один ядерный пул не накопится", "p3a_3_o2": "Пре-мРНК накопится, как при замедленном процессинге", "p3a_3_o3": "Цитоплазма не изменится: экспорт прежний", "p3a_3_e": "Доли этапов прежние, поэтому каждый пул уменьшается во столько же раз, во сколько снижен синтез: 11, 16 и около 100 молекул.", "p3a_3_w2": "Пре-мРНК накапливается, когда замедлен её выход в следующий пул; здесь меньше её поступление.", "p3a_3_w3": "Экспорт выводит долю зрелых мРНК; если зрелых меньше, меньше выходит и в цитоплазму.", "p3a_4_q": "Через 60 мин в цитоплазме около 100 мРНК, в контроле — 254. Переключатели скрыты. Какой вывод допустим?", "p3a_4_o1": "Причину назвать нельзя: так же дают сниженный синтез, замедленный процессинг и замедленный экспорт", "p3a_4_o2": "Нарушен экспорт: мРНК не выходит из ядра", "p3a_4_o3": "Снижена транскрипция: мРНК мало, значит, мало и синтеза", "p3a_4_e": "В модели около 100 цитоплазматических мРНК дают три разных нарушения. По цитоплазме причину не установить; нужны ядерные пулы или скорость синтеза.", "p3a_4_w2": "Такой же итог дают замедленный процессинг и сниженный синтез; без ядерных пулов экспорт не выделить.", "p3a_4_w3": "Транскрипционная активность не равна количеству мРНК в цитоплазме: при нормальном синтезе мРНК может задерживаться в ядре.", "p3a_4_h1": "Сколько мРНК было бы в цитоплазме при экспорте 2 %, при процессинге 3 % и при синтезе 4 в минуту?", "p3a_5_q": "Какое наблюдение отличит замедленный экспорт от замедленного процессинга?", "p3a_5_o1": "Что накапливается в ядре: зрелая мРНК (экспорт) или пре-мРНК (процессинг)", "p3a_5_o2": "Количество мРНК в цитоплазме через 60 мин", "p3a_5_o3": "Скорость синтеза пре-мРНК", "p3a_5_e": "Молекулы задерживаются в пуле перед замедленным этапом: при замедленном экспорте — зрелая мРНК в ядре (около 190), при замедленном процессинге — пре-мРНК (около 120).", "p3a_5_w2": "В цитоплазме в обоих случаях около 100 мРНК: это наблюдение их не разделяет.", "p3a_5_w3": "Синтез в обоих случаях прежний; он отделяет только третью причину — сниженную транскрипцию.", "p3a_5_h1": "Перед каким пулом стоит каждый из двух этапов?", "s4a_prob": "В двух типах клеток один и тот же ген (вкладка 4). В каждой клетке свой набор РНК-связывающих белков, которые меняют выбор сайтов сплайсинга. Какие зрелые мРНК образуются в каждой клетке и можно ли по различию мРНК заключить, что различается ДНК?", "s4a_r1_A": "Клетка А: репрессор включения экзона 3", "s4a_r1_B": "Клетка Б: репрессор включения экзона 3", "s4a_r2_A": "Клетка А: белок, активирующий дальний 3′-сайт интрона 4", "s4a_r2_B": "Клетка Б: белок, активирующий дальний 3′-сайт интрона 4", "s4a_r1_hi": "много", "s4a_r1_lo": "мало", "s4a_r1_no": "нет", "s4a_r2_no": "нет", "s4a_r2_yes": "есть", "s4a_note": "В каждой клетке 100 условных молекул пре-мРНК; каждая молекула сплайсируется одним способом. Доли молекул с экзоном 3 (без репрессора — 100 %, при малом его количестве — 50 %, при большом — 0 %) — учебные допущения. Белок, активирующий дальний 3′-сайт сплайсинга интрона 4 (расположенный ниже по ходу транскрипции, внутри экзона 5), делает этот сайт используемым: начало экзона 5 удаляется вместе с интроном, 3′-НТО становится короче (310 вместо 460 нт).", "s4a_pA": "А. Ген — одинаковая последовательность в клетках А и Б", "s4a_pB": "Б. Клетка А: зрелые мРНК", "s4a_pC": "В. Клетка Б: зрелые мРНК", "s4a_lbl_gene": "та же пре-мРНК в обеих клетках", "s4a_lbl_iso": "{n} из 100 молекул\nбелок {a} аминокислот, 3′-НТО {u} нт", "s4a_lbl_reg": "репрессор экзона 3: {a}\nактиватор дальнего 3′-сайта: {b}", "s4a_v_r1_hi": "много", "s4a_v_r1_lo": "мало", "s4a_v_r1_no": "нет", "s4a_v_r2_no": "нет", "s4a_v_r2_yes": "есть", "s4a_lbl_one": "в этой клетке один вид зрелой мРНК", "s4a_lbl_two": "в этой клетке два вида зрелой мРНК", "s4a_r_A": "Клетка А", "s4a_r_B": "Клетка Б", "s4a_v_cell": "с экзоном 3: {i}, без него: {s}; 3′-НТО {u} нт", "s4a_r_prot": "Белок в клетках А и Б", "s4a_r_utr": "3′-НТО в клетках А и Б", "s4a_v_diff": "различается", "s4a_v_nodiff": "одинаков", "s4a_r_gene": "Последовательность гена", "s4a_v_gene": "одинакова в обеих клетках", "s4a_cap_same": "Набор белков в клетках одинаков, и зрелые мРНК одинаковы.", "s4a_cap_same_z": "Меняйте белки в одной из клеток и сравнивайте результаты.", "s4a_cap_prot": "Клетки различаются только репрессором включения экзона 3: мРНК с экзоном 3 и без него представлены в разных долях, и белок в клетках различается внутренним участком. Ген одинаков.", "s4a_cap_prot_z": "Разные продукты одной транскрипционной единицы возникают без изменения ДНК — при разном наборе белков, участвующих в выборе сайтов сплайсинга.", "s4a_cap_utr": "Клетки различаются белком, активирующим дальний 3′-сайт интрона 4: 3′-НТО в них разной длины, а белок одинаков.", "s4a_cap_utr_z": "Изменение зрелой мРНК не всегда меняет белок: здесь меняется только нетранслируемая область.", "s4a_cap_both": "Клетки различаются обоими белками: в них разные доли мРНК с экзоном 3 и разная длина 3′-НТО.", "s4a_cap_both_z": "Одна пре-мРНК может давать несколько вариантов, но клетка не обязательно образует все: набор вариантов зависит от белков клетки.", "s4a_cap_mask": "Обратная задача: видны только зрелые мРНК двух клеток. Переключатели скрыты; последовательность гена в двух клетках не исследована.", "s4a_cap_mask_z": "Что, кроме изменения гена, могло бы дать такое различие мРНК?", "s4a_take": "Одна транскрипционная единица может давать разные зрелые мРНК: в разных клетках одна и та же пре-мРНК сплайсируется по-разному, потому что различаются белки, участвующие в выборе сайтов сплайсинга. Разница может касаться кодирующей области (белок меняется) или только нетранслируемой (белок прежний). Клетка не обязательно образует несколько вариантов. Различие мРНК двух клеток само по себе не доказывает различия ДНК: чтобы его исключить, сравнивают последовательности гена.", "s4a_lim": "Модель не показывает конкретных РНК-связывающих белков и мест их связывания, конкуренции активаторов и подавляющих белков, связи выбора сайта с транскрипцией и того, что вариант с изменённой рамкой может разрушаться (семинар 10, курс «Молекулярная биология»). Длину 3′-НТО в клетках меняет и выбор места расщепления и полиаденилирования (альтернативное полиаденилирование); в модели показан только выбор 3′-сайта сплайсинга. Доли изоформ — учебные допущения. Мутация в сайте сплайсинга тоже меняет состав мРНК — подробно это разбирается в курсе «Молекулярная биология».", "s4a_new": "Включением экзона в зрелую мРНК управляют белки, которые связываются с пре-мРНК рядом с ним. Это проверили на 718 РНК-связывающих белках человека: каждый по очереди закрепляли на искусственной пре-мРНК рядом с альтернативным экзоном. 58 белков повышали включение экзона, и среди них были белки, о роли которых в сплайсинге раньше не знали. Для 41 из них результат зависел от того, с какой стороны экзона белок связан: 26 действовали только из интрона за экзоном, 15 — только из интрона перед ним, ещё 17 — с обеих сторон.", "s4a_how": "в клетках человека линии HEK293T белок принудительно связывали с искусственной пре-мРНК и измеряли долю мРНК с экзоном. Искусственное закрепление показывает, что белок может повысить включение, но не то, где и когда он делает это в природе.", "s4a_tl_note": "Порядок этапов — учебная модель; доли изоформ условные.", "s4a_tl_1": "Транскрипция: в обеих клетках синтезируется одна и та же пре-мРНК.", "s4a_tl_2": "Белки клеток: в каждой клетке свой набор РНК-связывающих белков, которые присоединяются к пре-мРНК у сайтов сплайсинга.", "s4a_tl_3": "Сплайсинг в клетке А: каждая молекула пре-мРНК сплайсируется одним способом.", "s4a_tl_4": "Сплайсинг в клетке Б: варианты зависят от её набора белков.", "p4a_1_q": "Условия: в обеих клетках нет репрессора экзона 3 и нет белка, активирующего дальний 3′-сайт интрона 4. В клетке Б появилось много репрессора. Что изменится?", "p4a_1_o1": "В клетке Б все мРНК без экзона 3; белок короче на 21 аминокислоту; ген не изменён", "p4a_1_o2": "В клетке Б не будет мРНК этого гена", "p4a_1_o3": "В клетке Б 3′-НТО станет короче, а белок прежним", "p4a_1_e": "Репрессор, связанный с пре-мРНК у границ экзона 3, закрывает сплайсосоме доступ к его сайтам сплайсинга, и экзон 3 удаляется вместе с соседними интронами. Остальные экзоны соединяются, мРНК образуется, но без участка экзона 3.", "p4a_1_w2": "Репрессор влияет на выбор одного экзона; транскрипция и сплайсинг остальных интронов идут как прежде.", "p4a_1_w3": "Длину 3′-НТО в модели задаёт другой белок — активатор дальнего 3′-сайта интрона 4.", "p4a_1_h1": "Какой экзон зависит от репрессора?", "p4a_2_q": "Исходные условия: в обеих клетках нет ни репрессора экзона 3, ни белка, активирующего дальний 3′-сайт интрона 4. В клетке Б появился белок, активирующий этот сайт. Что изменится?", "p4a_2_o1": "3′-НТО в клетке Б короче (310 нт), белок тот же", "p4a_2_o2": "Белок в клетке Б короче: изменился последний экзон", "p4a_2_o3": "В клетке Б пропускается экзон 3", "p4a_2_e": "Используется дальний 3′-сайт интрона 4: начало экзона 5 удаляется вместе с интроном. Экзон 5 целиком нетранслируемый, поэтому меняется только 3′-НТО.", "p4a_2_w2": "Стоп-кодон находится в экзоне 4; экзон 5 — нетранслируемая область, и белок не меняется.", "p4a_2_w3": "Репрессора экзона 3 в клетке Б нет, и экзон включается.", "p4a_3_q": "В клетке Б репрессора экзона 3 мало. Сколько видов мРНК этого гена в одной клетке Б и почему?", "p4a_3_o1": "Два: часть молекул пре-мРНК сплайсируется с экзоном 3, часть — без него", "p4a_3_o2": "Один: в каждой молекуле мРНК половина экзона 3", "p4a_3_o3": "Один: для всех молекул пре-мРНК клетки используется один вариант", "p4a_3_e": "Каждая молекула пре-мРНК сплайсируется одним способом, но разные молекулы — по-разному. При малом количестве репрессора в клетке одновременно есть оба варианта. А клетка А в этой модели образует один вариант.", "p4a_3_w2": "Экзон либо входит в мРНК, либо удаляется целиком; «половины экзона» не бывает.", "p4a_3_w3": "Выбор сайтов идёт для каждой молекулы пре-мРНК отдельно; в одной клетке могут быть разные варианты.", "p4a_4_q": "Клетка А: все мРНК с экзоном 3 и длинной 3′-НТО. Клетка Б: все мРНК без экзона 3 и с короткой 3′-НТО. Последовательности гена в двух клетках не сравнивали. Следует ли из этих наблюдений, что ДНК в клетке Б изменена?", "p4a_4_o1": "Нет: такие же мРНК даёт и разный набор белков, влияющих на сплайсинг", "p4a_4_o2": "Да: экзон не может исчезнуть из мРНК без изменения гена", "p4a_4_o3": "Да: в клетке Б изменены и экзон 3, и экзон 5", "p4a_4_e": "В модели обе особенности клетки Б дают её белки — много репрессора экзона 3 и активатор дальнего 3′-сайта — при той же последовательности гена. Различие мРНК совместимо с одинаковой ДНК, поэтому вывод об изменении гена из него не следует. Одинаковый ген — одна из возможных гипотез, а не установленный факт для этих клеток.", "p4a_4_w2": "Пропуск экзона — обычный результат альтернативного сплайсинга той же пре-мРНК.", "p4a_4_w3": "Два различия мРНК не означают двух мутаций: в модели их дают два белка клетки Б при неизменном гене.", "p4a_4_h1": "Какие два белка в модели меняют состав мРНК?", "p4a_4_h2": "Можно ли в модели получить такие же мРНК, не меняя гена?", "p4a_5_q": "Последовательность гена в клетках А и Б по-прежнему не известна. Какое наблюдение отличит различие регуляторных белков от мутации сайта сплайсинга в клетке Б?", "p4a_5_o1": "Сравнить последовательность гена в двух клетках", "p4a_5_o2": "Сравнить доли изоформ мРНК в двух клетках", "p4a_5_o3": "Сравнить длину белка в двух клетках", "p4a_5_e": "Обе гипотезы предсказывают одинаковое различие мРНК и белка. Различаются они предсказанием о ДНК: при мутации последовательность гена в клетке Б изменена, при различии белков — одинакова.", "p4a_5_w2": "Доли изоформ одинаково меняются при обеих гипотезах; это наблюдение их не разделяет.", "p4a_5_w3": "Длина белка — следствие состава мРНК; при обеих гипотезах она одна и та же.", "p4a_5_h1": "Найдите наблюдение, по которому две гипотезы предсказывают разное.", "c1_title": "Транскрипция гена начинается, но полных транскриптов мало", "c1_obs": "Условия: модель 2а, 30 мин наблюдения. В контроле частота инициации — 2 в минуту, 90 % полимераз после паузы продолжают синтез, синтез в теле гена не прекращается. В образце завершено около 10 транскриптов против 36 в контроле. Причина одна из трёх; какая — определите по измерениям.", "c1_c_init": "Инициация редкая (частота инициации снижена)", "c1_c_pause": "После паузы к продуктивной элонгации переходит мало полимераз", "c1_c_body": "Синтез часто прекращается в теле гена", "c1_m_init": "Число начатых синтезов за 30 мин", "c1_m_short": "Короткие РНК у промотора", "c1_m_lost": "РНК, синтез которых прекратился в теле гена", "c1_m_done": "Завершённые транскрипты", "c1_v_init_v60": "60", "c1_v_init_v15": "15", "c1_v_short_v6": "6", "c1_v_short_v2": "2", "c1_v_short_v45": "45", "c1_v_lost_v0": "0", "c1_v_lost_v34": "34", "c1_v_done_v36": "36", "c1_v_done_v10": "9–10", "c1_k_init": "Что измеряется: сколько синтезов РНК началось за время наблюдения. Метод в учебной модели не задан: значение — предсказание модели 2а. Чего не говорит: сколько из них стали полными транскриптами.", "c1_k_short": "Что измеряется: сколько синтезов прекратилось у промотора после паузы (короткие РНК). Метод не задан; в клетке короткие РНК быстро разрушаются, и их число оценивают косвенно. Значение — предсказание модели 2а.", "c1_k_lost": "Что измеряется: сколько синтезов прекратилось в теле гена. Метод не задан: значение — предсказание модели 2а. Чего не говорит: почему синтез прекратился.", "c1_k_done": "Что измеряется: сколько полных транскриптов завершено. Значение — предсказание модели 2а; при всех трёх причинах оно почти одинаково.", "c1_w_init": "При этой причине начато лишь 15 синтезов против 60; коротких РНК у промотора 2 против 6, в теле гена синтез не прекращается, завершено 9 против 36: доли исходов прежние — снижена частота инициации.", "c1_w_pause": "При этой причине начато столько же синтезов, сколько в контроле (60), но коротких РНК у промотора 45 против 6: большинство полимераз прекращает синтез после паузы.", "c1_w_body": "При этой причине начатых синтезов и коротких РНК столько же, сколько в контроле, но 34 синтеза прекратились в теле гена: нарушено продолжение элонгации.", "c1_after": "Одно число завершённых транскриптов не указывает на причину: каждая причина оставляет свой след на своём этапе. На схеме — модель с найденной причиной.", "c1_src": "Правила модели — по учебнику и обзору о терминации транскрипции (см. «Источники» внизу страницы). Значения та
