 "tl_again": "↺ Ещё раз", "tl_back": "◀ Шаг", "tl_fwd": "Шаг ▶", "tl_reset": "Сначала", "tl_note": "Порядок этапов — учебная модель. Длительность этапов условная, не измерена.", "rd_final": "Показания — итог выбранных условий, как на последнем этапе шкалы.", "predict_note": "Условие изменено. Предскажите, что произойдёт, и нажмите «▶ Запустить» или выберите этап на шкале — подпись появится после запуска.", "predict_reads": "Показания появятся после запуска.", "tl_step0": "Этап {k} из {m}", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Что измеряется", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а получено «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Какое измерение их разделит?", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Какое измерение их разделит?", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Чтобы из предложенных объяснений осталось одно, достаточно, например, измерений: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Начать заново", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента. Список причин здесь задан заранее, в реальной работе его нет.", "gn_transcription": "Транскрипция", "g_transcription": "Синтез РНК на матрице ДНК, который осуществляет ДНК-зависимая РНК-полимераза. РНК удлиняется от 5′- к 3′-концу и комплементарна матричной цепи ДНК.", "gn_tunit": "Транскрипционная единица", "g_tunit": "Участок ДНК, с которого синтезируется определённая РНК (первичный транскрипт): от точки начала транскрипции до области терминации. Её транскрипцию обеспечивает промотор, расположенный у начала единицы и задающий направление синтеза; сам промотор в общем случае не транскрибируется.", "gn_template": "Матричная цепь ДНК", "g_template": "Цепь ДНК, комплементарная синтезируемой РНК и антипараллельная ей; РНК-полимераза движется вдоль неё в направлении 3′→5′. Какая цепь станет матричной, зависит от ориентации конкретной транскрипционной единицы.", "gn_coding": "Кодирующая цепь ДНК", "g_coding": "Цепь ДНК, комплементарная матричной; её последовательность, прочитанная от 5′ к 3′, совпадает с последовательностью РНК, если T заменить на U. Последовательности генов принято записывать по кодирующей цепи.", "gn_dna": "Двухцепочечная ДНК", "g_dna": "Две антипараллельные комплементарные цепи ДНК. На схеме цепь матрицы выбранной единицы выделена тёмным цветом.", "gn_rna": "РНК (растущая цепь)", "g_rna": "Цепь рибонуклеотидов, синтезируемая РНК-полимеразой; в ней U вместо T. Новый нуклеотид присоединяется к 3′-OH-концу растущей цепи.", "gn_pol2": "РНК-полимераза II", "g_pol2": "Фермент ядра эукариот, который транскрибирует белок-кодирующие гены (и гены многих некодирующих РНК). Не узнаёт промотор сама: её привлекают общие факторы транскрипции. Имеет C-концевой домен, с которым связываются факторы процессинга.", "gn_promoter": "Промотор", "g_promoter": "Участок ДНК у начала транскрипционной единицы, с которым связываются общие факторы транскрипции и РНК-полимераза; задаёт точку начала транскрипции и её направление, а тем самым — какая цепь станет матричной.", "gn_tss": "Точка начала транскрипции (+1)", "g_tss": "Нуклеотид ДНК, против которого стоит первый нуклеотид РНК. Нуклеотиды, расположенные перед ней, обозначают отрицательными номерами, после неё — положительными. Не совпадает со старт-кодоном.", "gn_tata": "TATA-бокс", "g_tata": "Последовательность, богатая A и T, примерно за 30 нуклеотидов до точки начала транскрипции у части промоторов РНК-полимеразы II; её узнаёт TATA-связывающий белок в составе TFIID. Есть не у всех промоторов.", "gn_inr": "Инициаторный элемент (Inr) и нижележащий элемент промотора (DPE)", "g_inr": "Последовательности промотора РНК-полимеразы II у точки +1 (Inr) и после неё (DPE), которые узнают субъединицы TFIID; у промоторов без TATA-бокса задают положение начала транскрипции.", "gn_tfiid": "TFIID", "g_tfiid": "Общий фактор транскрипции из TATA-связывающего белка и связанных с ним субъединиц (TAF). Первым связывается с промотором — с TATA-боксом или другими его элементами — и начинает сборку преинициаторного комплекса.", "gn_tfiib": "TFIIB", "g_tfiib": "Общий фактор транскрипции, связывающийся рядом с TATA-связывающим белком; ориентирует РНК-полимеразу II на промоторе и тем самым задаёт направление транскрипции.", "gn_tfiif": "TFIIF", "g_tfiif": "Общий фактор транскрипции, который присоединяется вместе с РНК-полимеразой II и стабилизирует её связь с TFIIB и TBP; привлекает TFIIE и TFIIH.", "gn_tfiie": "TFIIE", "g_tfiie": "Общий фактор транскрипции, который привлекает TFIIH к преинициаторному комплексу и регулирует его.", "gn_tfiih": "TFIIH", "g_tfiih": "Общий фактор транскрипции с хеликазной и киназной активностями: расплетает ДНК у точки начала транскрипции и фосфорилирует серин 5 повторов C-концевого домена РНК-полимеразы II, освобождая её от промотора. Участвует также в репарации ДНК.", "gn_pic": "Преинициаторный комплекс", "g_pic": "Комплекс общих факторов транскрипции (TFIID, TFIIA, TFIIB, TFIIE, TFIIF, TFIIH) и РНК-полимеразы II, собранный на промоторе перед началом синтеза РНК.", "gn_activator": "Белок-активатор транскрипции", "g_activator": "Регуляторный белок, связывающийся с определённой последовательностью ДНК (часто в энхансере) и ускоряющий сборку преинициаторного комплекса на промоторе — через медиатор и белки, изменяющие хроматин.", "gn_enhancer": "Энхансер", "g_enhancer": "Регуляторный участок ДНК, с которым связываются белки-активаторы; может находиться далеко от промотора, до или после гена, и действует на промотор через сближение участков ДНК.", "gn_mediator": "Медиатор", "g_mediator": "Крупный белковый комплекс (более 30 субъединиц), связывающий белки-активаторы с РНК-полимеразой II и общими факторами транскрипции; необходим для активированной транскрипции большинства генов.", "gn_ctd": "C-концевой домен РНК-полимеразы II", "g_ctd": "«Хвост» крупнейшей субъединицы РНК-полимеразы II из повторов семи аминокислот (у человека 52 повтора). Фосфорилирование серина 5 сопровождает уход с промотора, серина 2 — элонгацию; фосфорилированный домен связывает факторы кэпирования, сплайсинга и образования 3′-конца.", "gn_pause": "Пауза у промотора", "g_pause": "Остановка РНК-полимеразы II вскоре после начала синтеза (у животных — после 20–100 нуклеотидов). После паузы полимераза либо переходит к продуктивной элонгации, либо прекращает синтез.", "gn_shortrna": "Короткая РНК у промотора", "g_shortrna": "РНК длиной в десятки нуклеотидов, синтез которой прекратился у промотора после паузы; быстро разрушается в ядре.", "gn_aug": "Место старт-кодона", "g_aug": "Последовательность ATG в кодирующей цепи (AUG в мРНК), с которой начинается трансляция. Находится после точки начала транскрипции; участок РНК перед ним — 5′-нетранслируемая область.", "gn_pas": "Сигнал полиаденилирования AAUAAA", "g_pas": "Последовательность пре-мРНК (AATAAA в кодирующей цепи ДНК), которую узнаёт фактор специфичности расщепления и полиаденилирования; в 10–30 нуклеотидах ниже по цепи пре-мРНК разрезается.", "gn_cleave": "Место расщепления", "g_cleave": "Место, где пре-мРНК разрезается при образовании 3′-конца; к образовавшемуся 3′-концу присоединяется поли(А)-хвост. Определяет положение 3′-конца мРНК.", "gn_termination": "Терминация транскрипции", "g_termination": "Завершение синтеза: РНК-полимераза отделяется от ДНК и РНК. У РНК-полимеразы II терминация следует за расщеплением пре-мРНК и происходит ниже места расщепления.", "gn_xrn2": "5′→3′-экзорибонуклеаза XRN2", "g_xrn2": "Фермент, разрушающий РНК от незащищённого 5′-конца. После расщепления пре-мРНК разрушает фрагмент РНК, оставшийся на полимеразе, и способствует терминации; разрушает и РНК, не получившие функционального кэпа, после удаления их 5′-конца другими ферментами.", "gn_downrna": "РНК за местом расщепления", "g_downrna": "Фрагмент РНК, синтезированный после места расщепления; не входит в мРНК, не имеет кэпа и разрушается.", "gn_premrna": "Пре-мРНК (первичный транскрипт)", "g_premrna": "Продукт транскрипции белок-кодирующего гена до завершения процессинга; повторяет организацию гена — содержит экзоны и интроны.", "gn_cap": "Кэп", "g_cap": "7-метилгуанозин, присоединённый к первому нуклеотиду РНК 5′–5′-трифосфатной связью. Защищает 5′-конец от экзонуклеаз; через кэп-связывающие белки участвует в процессинге, экспорте мРНК и инициации трансляции.", "gn_capenz": "Ферменты кэпирования", "g_capenz": "Три фермента, связанные с C-концевым доменом РНК-полимеразы II: РНК-трифосфатаза удаляет концевой фосфат, гуанилилтрансфераза присоединяет ГМФ 5′–5′-связью, метилтрансфераза метилирует гуанин по N7.", "gn_ppp": "Трифосфат на 5′-конце", "g_ppp": "Три фосфатные группы первого нуклеотида РНК, как в момент начала синтеза; такой 5′-конец не защищён кэпом.", "gn_exon": "Экзон", "g_exon": "Участок гена, последовательность которого сохраняется в зрелой РНК после сплайсинга. Может содержать кодирующую последовательность, нетранслируемую область или то и другое.", "gn_intron": "Интрон", "g_intron": "Участок гена и пре-мРНК между экзонами, удаляемый при сплайсинге; обычно начинается с GU и заканчивается AG.", "gn_spliceosome": "Сплайсосома", "g_spliceosome": "Комплекс пяти малых ядерных РНК (U1, U2, U4, U5, U6) и множества белков, который узнаёт границы интронов и удаляет интрон двумя реакциями переэтерификации, соединяя экзоны.", "gn_lariat": "Лассо (лариат)", "g_lariat": "Форма, в которой освобождается удалённый интрон: его 5′-конец соединён с аденозином точки ветвления внутри интрона. Затем лассо раскрывается и разрушается.", "gn_ss5": "Сайты сплайсинга", "g_ss5": "Последовательности на границах интрона, которые узнаёт сплайсосома: 5′-сайт (начало интрона, GU) и 3′-сайт (конец интрона, AG), а также точка ветвления.", "gn_altss": "Альтернативный сайт сплайсинга", "g_altss": "Один из нескольких сайтов сплайсинга, которые может использовать сплайсосома на одной границе экзона; выбор сайта меняет длину экзона в зрелой мРНК.", "gn_junction": "Соединение экзонов", "g_junction": "Связь между концами двух экзонов, образующаяся при сплайсинге; соседние в зрелой мРНК экзоны не обязательно соседние в гене.", "gn_ejc": "Комплекс соединения экзонов", "g_ejc": "Белки, которые сплайсосома оставляет на мРНК рядом с каждым соединением экзонов; отмечают завершённый сплайсинг и участвуют в экспорте и дальнейших этапах.", "gn_cpsf": "Факторы расщепления и полиаденилирования", "g_cpsf": "Белковые комплексы (CPSF узнаёт AAUAAA, CstF — участок ниже места расщепления), которые разрезают пре-мРНК и привлекают поли(А)-полимеразу.", "gn_polya": "Поли(А)-хвост", "g_polya": "Цепочка адениловых остатков (около 200) на 3′-конце мРНК; её присоединяет поли(А)-полимераза без матрицы, поэтому в гене она не закодирована. Защищает 3′-конец, участвует в экспорте и трансляции.", "gn_readthrough": "РНК без расщепления 3′-конца", "g_readthrough": "Продолжение РНК за сигналом полиаденилирования, когда расщепления не было; такая РНК не получает поли(А)-хвост и задерживается в ядре.", "gn_cds": "Кодирующая область", "g_cds": "Участок зрелой мРНК от старт-кодона до стоп-кодона, последовательность кодонов которого задаёт аминокислотную последовательность белка.", "gn_utr": "Нетранслируемая область (НТО)", "g_utr": "Участок зрелой мРНК, который не кодирует аминокислоты: 5′-НТО — от кэпа до старт-кодона, 3′-НТО — от стоп-кодона до поли(А)-хвоста. Содержит регуляторные последовательности.", "gn_utr5": "5′-нетранслируемая область", "g_utr5": "Участок зрелой мРНК от кэпа до старт-кодона; не кодирует аминокислоты. Входит в первый экзон (иногда и в следующие).", "gn_utr3": "3′-нетранслируемая область", "g_utr3": "Участок зрелой мРНК от стоп-кодона до поли(А)-хвоста; не кодирует аминокислоты, содержит последовательности, влияющие на стабильность, локализацию и трансляцию мРНК.", "gn_startc": "Старт-кодон", "g_startc": "Кодон AUG (ATG в кодирующей цепи), с которого рибосома начинает трансляцию; граница 5′-НТО и кодирующей области.", "gn_stopc": "Стоп-кодон", "g_stopc": "Кодон UAA, UAG или UGA, на котором заканчивается трансляция; граница кодирующей области и 3′-НТО.", "gn_altexon": "Альтернативный экзон", "g_altexon": "Экзон, который входит в зрелую мРНК не всегда: в одних молекулах пре-мРНК он сохраняется, в других удаляется вместе с соседними интронами.", "gn_protein": "Белок (схема)", "g_protein": "Полипептид, синтезируемый по кодирующей области мРНК; на схеме участки окрашены по экзонам, которые их кодируют. Синтез белка — семинар 10.", "gn_mrnp": "мРНП (матричный рибонуклеопротеид)", "g_mrnp": "Комплекс мРНК с белками, присоединившимися при кэпировании, сплайсинге и образовании 3′-конца; в таком виде мРНК экспортируется из ядра.", "gn_nxf1": "Рецептор экспорта мРНК (NXF1–NXT1)", "g_nxf1": "Белок из двух субъединиц, который связывается с мРНП зрелой мРНК и взаимодействует с FG-повторами белков ядерной поры, проводя мРНП в цитоплазму; работает без Ran и без сигнала ядерной локализации. На цитоплазматической стороне поры хеликаза снимает с мРНП часть белков, и обратно в ядро мРНП не возвращается.", "gn_npc": "Ядерная пора", "g_npc": "Белковый комплекс (ядерный поровый комплекс) в ядерной оболочке, через канал которого идёт обмен макромолекулами между ядром и цитоплазмой; канал заполнен неструктурированными участками белков с FG-повторами.", "gn_envelope": "Ядерная оболочка", "g_envelope": "Две мембраны (каждая — липидный йсинг", "g_altsplicing": "Образование из одной пре-мРНК разных зрелых мРНК за счёт выбора разных сайтов сплайсинга: включения или пропуска экзонов, альтернативных 5′- и 3′-сайтов, удержания интронов.", "gn_overlap": "Участок перекрывания транскрипционных единиц", "g_overlap": "Участок ДНК, который входит в две транскрипционные единицы. Для каждой единицы матрицей служит цепь, ориентированная от 3′ к 5′ по направлению её синтеза: у встречных единиц это разные цепи участка, у единиц одной ориентации — одна и та же цепь.", "src_01": "Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»; Chapter 7; Chapter 12", "src_02": "Shine M., Gordon J., Schärfen L., Zigackova D., Herzel L., Neugebauer K. M. Co-transcriptional gene regulation in eukaryotes and prokaryotes. Nat Rev Mol Cell Biol. 2024;25:534–554. doi:10.1038/s41580-024-00706-2", "src_03": "Petrovic S., Mobbs G. W., Hoelz A. Structure, function and assembly of nuclear pore complexes. Nat Rev Mol Cell Biol. 2026;27:35–54. doi:10.1038/s41580-025-00881-w", "src_04": "Fischer M., Hoffmann S. Transcriptional interference revisited. Nat Genet. 2026;58:974–983. doi:10.1038/s41588-026-02536-8", "src_05": "Song A., Hu M., Chen F. X. Mechanisms of transcription termination across the coding and noncoding loci of the genome. Nat Rev Mol Cell Biol. 2026. doi:10.1038/s41580-026-01005-8", "src_06": "Choquet K., Patop I. L., Churchman L. S. The regulation and function of post-transcriptional RNA splicing. Nat Rev Genet. 2025;26:378–394. doi:10.1038/s41576-025-00836-z", "src_07": "Schmok J. C., Jain M., Street L. A., Tankka A. T., Schafer D., Her H.-L., Elmsaouri S., Gosztyla M. L., Boyle E. A., Jagannatha P., Luo E.-C., Kwon E. J., Jovanovic M., Yeo G. W. Large-scale evaluation of the ability of RNA-binding proteins to activate exon inclusion. Nat Biotechnol. 2024;42:1429–1441. doi:10.1038/s41587-023-02014-0"};
function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');

function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}

</defs>`; }

function blotHTML(rows, lanes){
  if (!lanes.length) return `<p class="small">${t('blot_empty')}</p>`;
  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;
  h += `<div class="lanes">` + lanes.map(L => `<div class="head">${L.h1}<br>${L.h2 || '&nbsp;'}</div>`).join('') + `</div>`;
  h += `<div class="film"><div class="lanes">` + lanes.map(L => `<div>` + L.v.map(v => `<div class="cell"><div class="band" style="opacity:${(0.04 + 0.96 * clamp(v)).toFixed(2)}"></div></div>`).join('') + `</div>`).join('') + `</div></div>`;
  return h + `</div></div></div>`;
}

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

const SCENES = {};
/* Перерисовка схемы заменяет все узлы SVG. Фокус, стоявший на детали или на кнопке «Метод», возвращается на новый узел
   с тем же data-g, чтобы клавиатура не терялась во время воспроизведения (технический аудит v1.6, ТА-05). */
function keepFocus(svg){
  const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(svg, 'innerHTML', { configurable: true, get(){ return d.get.call(this); }, set(v){
    const a = document.activeElement, g = a && a !== svg && svg.contains(a) ? a.getAttribute('data-g') : null;
    d.set.call(this, v);
    if (g){ const n = svg.querySelector('[data-g="' + g + '"]'); if (n){ if (!n.hasAttribute('tabindex')) n.setAttribute('tabindex', '0'); try { n.focus({ preventScroll: true }); } catch (e) {} } }
  } });
}

  const zb = sec.querySelector('.zoombtn');

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };

/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){

  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 'v21';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */

const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }

  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }

}
function poeIdx(i, K = cur){

}

/* =====================================================================
   s0_gn_nbh.js — v1.1.1 (Code, паспорт интерактива: «заголовок „пре-“ / „мРНК“ — неразрывный дефис»).
   Браузер переносит строку после дефиса, и «пре-» оставалось в конце строки, а «мРНК» уходило на следующую
   (h1 практикума на 768 px, заголовки и абзацы «Объяснений» на телефоне — тест tests9/hyphen.mjs).
   Тексты не меняются: при выводе слово «пре-…» оборачивается в <span class="nbh"> с white-space: nowrap,
   поэтому textContent, таблица текстов, реестр откатов и поиск по странице прежние. Схемы SVG не затрагиваются.
   Файл подключается и к практикуму (src/s*.js), и к «Объяснениям» (s0_gn*.js → widgets.js).
   ===================================================================== */
(function () {
  if (typeof document === 'undefined' || !document.body || typeof MutationObserver === 'undefined') return;   /* модели в node (tests9) — без документа */
  const SPLIT = /(пре-[А-Яа-яЁё]+)/;
  const skip = el => !el || (el.closest && el.closest('.nbh, script, style, textarea, svg'));
  function fix(root) {
    if (!root || root.nodeType !== 1 || skip(root)) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.indexOf('пре-') < 0 || skip(n.parentNode) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const list = []; let n; while ((n = tw.nextNode())) list.push(n);
    for (const nd of list) {
      const parts = nd.nodeValue.split(SPLIT); if (parts.length < 2) continue;
      const fr = document.createDocumentFragment();
      parts.forEach((p, i) => { if (!p) return;
        if (i % 2) { const s = document.createElement('span'); s.className = 'nbh'; s.style.whiteSpace = 'nowrap'; s.textContent = p; fr.appendChild(s); }
        else fr.appendChild(document.createTextNode(p)); });
      nd.parentNode.replaceChild(fr, nd);
    }
  }
  fix(document.body);
  new MutationObserver(ms => { for (const m of ms) for (const a of m.addedNodes) {
    if (a.nodeType === 3) { if (a.nodeValue.indexOf('пре-') >= 0) fix(a.parentNode); } else if (a.nodeType === 1 && !(a.closest && a.closest('svg'))) fix(a); } })
    .observe(document.body, { childList: true, subtree: true });
})();

    s += G('tunit', arrow(X(MU.b), 250, X(MU.a) - 8, 250, C.ink, 3)) + text((X(MU.a) + X(MU.b)) / 2, 237, t('s1a_lbl_unit_inv'), { size: 12, w: 700, col: C.ink });
    s += panel(16, 294, 568, 116, t('s1a_pB_inv'));
    s += text(30, 336, t('s1a_lbl_row', { u: t('s1a_lbl_unit_inv'), s: t('s1a_v_' + MU.tplStrand), d: t('s1a_v_dir_l') }), { a: 'l', size: 12.5, w: 700, col: C.ink });
    s += text(30, 354, t('s1a_lbl_rna', { r: MU.rna, m: MU.tpl35 }), { a: 'l', size: 12, col: '#8A4B00', mono: true });
    s += text(30, 386, t('s1a_lbl_inv_note'), { a: 'l', size: 12, col: C.muted });
    return s;
  }
  function draw(o, t, mask, T) {
    if (mask === 'IIIs') return solved(o, t);
    if (T == null) return panelA(o, t, mask) + panelB(o, t, mask);
    /* анимация (продвинутая шкала): 1 — промотор выбранной единицы; 2 — синтез первой половины; 3 — вся РНК; 4 — сравнение двух единиц */
    const kk = T < 1 ? 0 : T < 2 ? Math.round((T - 1) * o.cur.len / 2) : T < 3 ? Math.round(o.cur.len / 2 + (T - 2) * o.cur.len / 2) : o.cur.len;
    return panelA(o, t, false, kk) + (T >= 3 ? panelB(o, t) : panel(16, 294, 568, 116, t('s1a_pB')));
  }
  const stageKeys = o => ['s1a_tl_1', 's1a_tl_2_' + (o.cur.dir === '+' ? 'r' : 'l'), 's1a_tl_3', 's1a_tl_4_' + (o.same ? 'same' : 'opp')];
  const view = (a, t) => draw(model(a[0], a[1]), t, a[2] === 'mask');
  return { TOP, BOT, MU, units, model, draw, stageKeys, view };
})();

/* =====================================================================
   s0_gn_s2.js — вкладка 2 «Инициация, элонгация и терминация транскрипции» (базовая сцена 2b).
   Модель (MBoC7, с. 332–335, 339, 348–349; Song et al. 2026): общие факторы и РНК-полимераза II собираются на промоторе —
   TFIID узнаёт TATA-бокс или, у промоторов без него, другие элементы (Inr, DPE); TFIIH расплетает ДНК у точки +1 и фосфорилирует
   Ser5 C-концевого домена — полимераза уходит с промотора; активатор и медиатор ускоряют сборку (без них инициация редкая);
   после транскрипции сигнала AAUAAA пре-мРНК расщепляется, полимераза продолжает синтез, 5′→3′-экзонуклеаза (XRN2) разрушает
   оставшийся фрагмент РНК и способствует терминации. Положение 3′-конца пре-мРНК задаёт расщепление, а не место терминации.
   Модель качественная: «частая / редкая» инициация — не измеренные величины.
   ===================================================================== */
GN.s2b = (function () {
  const { C, text, textN, panel, blob, line, f, G, arrow, cross, ease } = GN;
  const YD = 150;   /* панель А: двойная цепь промоторной области */
  const XS = 340;   /* точка +1 на панели А */
  /* prom: 'tata' | 'inr'; P: { tfiih, act, med, xrn } — детали на месте */
  function model(prom, P) {
    P = Object.assign({ tfiih: true, act: true, med: true, xrn: true }, P || {});
    const open = P.tfiih, rare = !(P.act && P.med);
    const state = !open ? 'closed' : rare ? 'rare' : 'ok';
    return { prom, P, open, rare, state, rna: !open ? 'none' : rare ? 'few' : 'many', term: P.xrn ? 'near' : 'far' };
  }
  function dna(x1, x2, y, bub) {
    const g = 3.5;
    if (!bub) return G('dna', line(x1, y - g, x2, y - g, C.tpl, 3) + line(x1, y + g, x2, y + g, C.cod, 3));
    const [b1, b2] = bub, h = 9;
    return G('dna', `<path d="M${f(x1)},${f(y - g)} L${f(b1)},${f(y - g)} Q${f(b1 + 8)},${f(y - g - h)} ${f((b1 + b2) / 2)},${f(y - g - h)} Q${f(b2 - 8)},${f(y - g - h)} ${f(b2)},${f(y - g)} L${f(x2)},${f(y - g)}" fill="none" stroke="${C.cod}" stroke-width="3"/>` +
      `<path d="M${f(x1)},${f(y + g)} L${f(b1)},${f(y + g)} Q${f(b1 + 8)},${f(y + g + h)} ${f((b1 + b2) / 2)},${f(y + g + h)} Q${f(b2 - 8)},${f(y + g + h)} ${f(b2)},${f(y + g)} L${f(x2)},${f(y + g)}" fill="none" stroke="${C.tpl}" stroke-width="3"/>`);
  }
  /* an — анимация: { show: 0…1 — сборка, open: bool, pol: 'pic' | 'gone' } */
  function panelA(o, t, an) {
    let s = panel(16, 22, 568, 196, t('s2_pA'));
    const asm = an ? an.asm : 1, open = an ? an.open : false, polHere = an ? an.pol === 'pic' : o.state === 'closed';
    s += dna(36, 564, YD, open ? [XS - 22, XS + 22] : null);
    /* энхансер и активатор */
    s += G('enhancer', `<rect x="56" y="${f(YD - 9)}" width="56" height="18" rx="4" fill="#F4E3CF" stroke="${C.act}" stroke-width="1.4"/>`) + text(84, YD + 24, t('s2_lbl_enh'), { size: 11.5, col: C.muted });
    s += blob(84, YD - 26, 74, 24, C.act, 'activator', t('s2_e_act'), { op: o.P.act ? .93 * asm : .25, dash: !o.P.act, size: 10.5 });
    /* элементы промотора */
    if (o.prom === 'tata') s += G('tata', `<rect x="${f(XS - 92)}" y="${f(YD - 9)}" width="40" height="18" rx="4" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.4"/>`) + text(XS - 72, YD + 24, t('s2_lbl_tata'), { size: 11.5, col: C.muted });
    else s += G('inr', `<rect x="${f(XS - 12)}" y="${f(YD - 9)}" width="24" height="18" rx="4" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.4"/><rect x="${f(XS + 44)}" y="${f(YD - 9)}" width="28" height="18" rx="4" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.4"/>`) +
      text(XS - 4, YD + 24, 'Inr', { a: 'r', size: 11.5, col: C.muted }) /* v1.1.2: левее вертикали стрелки +1 (линия перечёркивала подпись) */ + text(XS + 58, YD + 24, 'DPE', { size: 11.5, col: C.muted });
    s += G('tss', `<path d="M${f(XS)},${f(YD + 8)} L${f(XS)},${f(YD + 34)} L${f(XS + 26)},${f(YD + 34)}" fill="none" stroke="${C.ink}" stroke-width="2"/><path d="M${f(XS + 33)},${f(YD + 34)} l-8,-4 l0,8 z" fill="${C.ink}"/>`) + text(XS - 6, YD + 42, '+1', { a: 'r', size: 12, w: 700 });
    /* преинициаторный комплекс: TFIID — первым, затем B, Pol II с F, E, H */
    const op = (k, full) => full ? .93 * ease(asm * 4 - k) : .25;
    const xD = o.prom === 'tata' ? XS - 72 : XS + 18;
    s += blob(xD, YD - 24, 64, 26, C.tfd, 'tfiid', 'TFIID', { op: op(0, true), size: 11.5 });
    s += blob(o.prom === 'tata' ? XS - 30 : XS - 30, YD - 24, 30, 24, C.tfb, 'tfiib', 'B', { op: op(1, true) });
    /* v1.2 (рецензия интерактива И-14): TFIIA — рядом с TFIID (MBoC7, рис. 6–15); подпись «без TFIIH» его называет */
    s += blob(o.prom === 'tata' ? XS - 118 : XS - 59, YD - 24, 26, 24, '#7FA9CF', 'tfiia', 'A', { op: op(.5, true) });
    if (polHere || (an && an.pol === 'pic')) {
      s += GN.pol2(XS + 4, YD - 58, t, { op: op(2, true), w: 70, h: 36 });
      s += blob(XS + 58, YD - 62, 28, 24, C.tfo, 'tfiif', 'F', { op: op(2.3, true) });
      s += blob(XS + 82, YD - 38, 28, 24, C.tfo, 'tfiie', 'E', { op: op(2.6, true) });
    }
    if (polHere) s += blob(XS + 96, YD - 72, 54, 26, C.tfh, 'tfiih', 'TFIIH', { op: o.P.tfiih ? op(3, true) : .25, dash: !o.P.tfiih, size: 11 });
    /* медиатор — мост между активатором и РНК-полимеразой II */
    s += blob(200, 72, 128, 30, C.med, 'mediator', t('s2_e_med'), { op: o.P.med ? .9 * asm : .25, dash: !o.P.med, size: 11.5 });
    if (o.P.med && o.P.act && asm > .9) s += line(100, YD - 38, 150, 86, C.med, 1.6, 'stroke-dasharray="3 3"') + (polHere ? line(262, 82, XS - 22, YD - 66, C.med, 1.6, 'stroke-dasharray="3 3"') : line(262, 88, XS - 36, YD - 38, C.med, 1.6, 'stroke-dasharray="3 3"'));   /* v1.1 (рецензия Р-42): связь медиатора с комплексом на промоторе и в конечном кадре */
    if (!an) {
      const k = 's2_st_' + o.state;
      if (o.state === 'closed') s += cross(XS, YD, 10);
      s += text(300, 206, t(k), { size: 12.5, w: 600, col: o.state === 'ok' ? C.ok : o.state === 'rare' ? C.warn : C.bad });
    }
    return s;
  }
  /* панель Б: транскрипционная единица от +1 до места терминации */
  const YG = 330, XP = 64, XAUG = 112, XPAS = 400, XCUT = 432, XT = { near: 486, far: 566 };
  /* an: { pol: x | null — положение полимеразы; cut: bool; xrn: 0…1; free: bool — полимераза отделилась } */
  function panelB(o, t, an) {
    let s = panel(16, 228, 568, 182, t('s2_pB'));
    s += G('dna', line(36, YG, 564, YG, C.tpl, 3));
    s += G('tss', line(XP, YG - 12, XP, YG + 12, C.ink, 2)) + text(XP, YG + 26, '+1', { size: 12, w: 700 });
    s += G('aug', line(XAUG, YG - 8, XAUG, YG + 8, C.cds, 3)) + text(XAUG, YG + 26, 'ATG', { size: 11.5, w: 700, col: C.cds });
    s += G('pas', `<rect x="${f(XPAS - 18)}" y="${f(YG - 7)}" width="36" height="14" rx="3" fill="#FCE7CF" stroke="${C.rna}" stroke-width="1.2"/>`) + text(XPAS, YG + 26, 'AATAAA', { size: 11, w: 700, col: '#8A4B00' });
    s += G('cleave', line(XCUT, YG - 10, XCUT, YG + 10, C.cpa, 2, 'stroke-dasharray="2 2"'));
    /* v1.1.2 (Code): подпись — над линией гена (на y = 384 ложилась на «+1 — начало транскрипции») */
    if (!an && o.state === 'closed') return s + text(300, 296, t('s2_lbl_norna'), { size: 13, w: 600, col: C.bad }) + labelsB(t);
    const pol = an ? an.pol : null, cut = an ? an.cut : true, free = an ? an.free : true;
    const yR = YG - 34;
    if (!cut) {
      if (pol != null && pol - 30 > XP + 4) s += G('rna', line(XP, yR, pol - 30, yR, C.rna, 4)) + (pol - 30 > XP + 14 ? GN.G('cap', `<circle cx="${f(XP - 4)}" cy="${f(yR)}" r="6" fill="${C.cap}"/>`) : '');   /* v1.2, И-01: РНК — только видимой длины; кэп — не сразу (около 20 нт, MBoC7, с. 338) */
    } else {
      /* пре-мРНК отделена с 3′-концом в месте расщепления */
      s += G('premrna', line(XP, yR - 22, XCUT, yR - 22, C.rna, 4)) + GN.G('cap', `<circle cx="${f(XP - 4)}" cy="${f(yR - 22)}" r="6" fill="${C.cap}"/>`) +
        text(XCUT + 6, yR - 22, t('s2_lbl_3end'), { a: 'l', size: 11.5, w: 600, col: '#8A4B00' });
      /* фрагмент за местом расщепления на полимеразе; его разрушает XRN2 */
      const xEnd = free ? XT[o.term] : pol, eat = an ? an.xrn : 1;
      if (o.P.xrn) {
        const xa = XCUT + (xEnd - 30 - XCUT) * eat;
        if (xEnd - 30 > xa + 2) s += G('downrna', line(xa, yR, xEnd - 30, yR, C.rna, 3, 'stroke-dasharray="3 2"'));
        s += blob(Math.min(xa, xEnd - 62), yR, 44, 20, C.xrn, 'xrn2', 'XRN2', { size: 10.5 });
      } else if (xEnd - 30 > XCUT) s += G('downrna', line(XCUT + 4, yR, xEnd - 30, yR, C.rna, 3, 'stroke-dasharray="3 2"'));
    }
    if (pol != null || !an) {
      const xp = an ? pol : XT[o.term];
      const off = free ? -22 : 0;
      s += GN.pol2(Math.min(xp, 546), YG - 4 + off, t, { op: free ? .55 : .93 });
      /* v1.1.2 (Code): «терминация дальше, чем в норме» выходила за поле схемы — правый край у x = 578, строкой ниже «AATAAA» */
      if (free) s += o.term === 'near' ? text(Math.min(xp, 546), YG + 30, t('s2_lbl_term_near'), { size: 11.5, w: 600, col: C.ok }) : text(578, YG + 48, t('s2_lbl_term_far'), { a: 'r', size: 11.5, w: 600, col: C.warn });
    }
    return s + labelsB(t);
  }
  const labelsB = t => text(XP - 20, 382, t('s2_lbl_tss'), { a: 'l', size: 11.5, col: C.muted }) + text(XP - 20, 399, t('s2_lbl_aug'), { a: 'l', size: 11.5, col: C.cds });
  function draw(o, t) { return panelA(o, t) + panelB(o, t); }
  /* этапы: 1 сборка ПИК; 2 расплетание у +1; 3 уход с промотора; 4 элонгация; 5 расщепление после AAUAAA; 6 терминация */
  function plan(o) {
    const keys = ['s2t_1_' + o.prom, 's2t_2', 's2t_3', 's2t_4', 's2t_5', 's2t_6_' + o.term];
    return { keys, end: o.open ? 6 : 2, stopKey: o.open ? null : 's2t_stop' };
  }
  function frame(o, T, t) {
    const end = plan(o).end;
    if (T >= end - 1e-6) return draw(o, t);
    if (T < 1) return panelA(o, t, { asm: T, open: false, pol: 'pic' }) + panelB(o, t, { pol: null, cut: false, free: false, xrn: 0 }).replace(/<g class="clickable" data-g="(premrna|downrna|xrn2)">[\s\S]*?<\/g>/g, '');
    if (T < 2) return panelA(o, t, { asm: 1, open: o.open && T > 1.3, pol: 'pic' }) + emptyB(o, t);
    if (T < 3) { const u = ease(T - 2); return panelA(o, t, { asm: 1, open: true, pol: 'gone' }) + panelB(o, t, { pol: XP + 30 + u * 40, cut: false, free: false, xrn: 0 }); }   /* v1.2, И-01: полимераза ушла с промотора — в панели А её нет */
    if (T < 4) { const u = ease(T - 3); return panelA(o, t, { asm: 1, open: false, pol: 'gone' }) + panelB(o, t, { pol: XP + 70 + u * (XCUT + 20 - XP - 70), cut: false, free: false, xrn: 0 }); }
    if (T < 5) { const u = ease(T - 4); return panelA(o, t, { asm: 1, open: false, pol: 'gone' }) + panelB(o, t, { pol: XCUT + 20 + u * 16, cut: u > .4, free: false, xrn: 0 }); }
    const u = ease(T - 5), xe = XT[o.term];
    return panelA(o, t, { asm: 1, open: false, pol: 'gone' }) + panelB(o, t, { pol: XCUT + 36 + u * (xe - XCUT - 36), cut: true, free: u > .95, xrn: o.P.xrn ? u : 0 });
  }
  const emptyB = (o, t) => panelB(o, t, { pol: null, cut: false, free: false, xrn: 0 }).replace(/<g class="clickable" data-g="(premrna|downrna|xrn2)">[\s\S]*?<\/g>/g, '');
  const view = (a, t) => draw(model(a[0], a[1]), t);
  return { model, draw, frame, plan, view };
})();

/* =====================================================================
   s0_gn_s3.js — вкладка 3 «Котранскрипционный процессинг пре-мРНК и ядерный экспорт» (базовая сцена 3b).
   Модель (MBoC7, с. 336–351, 742; Shine et al. 2024; Petrovic et al. 2026): кэп присоединяется, когда синтезировано около 20 нт РНК (MBoC7, с. 338)
   выходит из РНК-полимеразы II; интроны удаляются сплайсосомой, многие — ещё во время транскрипции; после AAUAAA пре-мРНК
   расщепляется, поли(А)-полимераза без матрицы добавляет поли(А)-хвост; мРНК с белками (мРНП) связывается с рецептором экспорта
   (NXF1–NXT1) и выходит через ядерную пору — без сигнала ядерной локализации, импортина и Ran. Дефектные транскрипты задерживаются
   в ядре и разрушаются; РНК без кэпа разрушается 5′→3′-экзонуклеазой. Модель качественная; порядок этапов — учебный:
   в клетке этапы перекрываются во времени.
   ===================================================================== */
GN.s3b = (function () {
  const { C, text, textN, panel, blob, line, f, G, arrow, cross, ease, envelope, mrna, gene } = GN;
  const YG = 150, XG = 64, YE = 292;
  const GP = [{ w: 22, kind: 'utr', g: 'exon' }, { w: 38, kind: 'cds', lab: '1', g: 'exon' }, { w: 92, kind: 'intron', g: 'intron' }, { w: 60, kind: 'cds', lab: '2', g: 'exon' }, { w: 92, kind: 'intron', g: 'intron' }, { w: 46, kind: 'cds', lab: '3', g: 'exon' }, { w: 32, kind: 'utr', g: 'exon' }];
  const XEND = XG + 382, XPAS = XEND - 14, XCUT = XEND;
  const ORDER = ['cap', 'spl', 'cpa', 'exp'];
  /* P: { cap, spl, cpa, exp } — детали на месте; исход — по первой недостающей детали в порядке этапов */
  function model(P) {
    P = Object.assign({ cap: true, spl: true, cpa: true, exp: true }, P || {});
    const miss = ORDER.find(k => !P[k]) || null;
    const state = miss ? 'no' + miss : 'ok';
    /* v1.1.3 (Code): исход (где окажется РНК) — по первой недостающей детали, а свойства самой РНК — по всем вынутым деталям:
       без факторов 3′-конца нет расщепления и поли(А) и тогда, когда первой вынута сплайсосома (в v1.1 модель рисовала поли(А)) */
    const cap = !!P.cap, spliced = cap && !!P.spl, polya = cap && !!P.cpa;
    return { P, miss, state, cap, spliced, keepLast: spliced && !P.cpa, polya, readthrough: cap && !P.cpa,   /* keepLast — v1.1 (рецензия Р-39): удаление последнего интрона стимулируют расщепление и поли(А) (Choquet et al. 2025) */
      where: miss === 'cap' ? 'none' : miss ? 'nuc' : 'cyt', fate: { ok: 'tr', nocap: 'deg5', nospl: 'ret', nocpa: 'ret', noexp: 'nuc' }[miss ? 'no' + miss : 'ok'] };
  }
  const MP = (sp, keepLast) => sp && keepLast ? [{ w: 40, kind: 'utr', g: 'utr' }, { w: 45, kind: 'cds', lab: '1', g: 'exon' }, { w: 45, kind: 'cds', lab: '2', g: 'exon' }, { w: 46, kind: 'intron', g: 'intron' }, { w: 40, kind: 'cds', lab: '3', g: 'exon' }, { w: 30, kind: 'utr', g: 'utr' }] : sp ? [{ w: 40, kind: 'utr', g: 'utr' }, { w: 50, kind: 'cds', lab: '1', g: 'exon' }, { w: 50, kind: 'cds', lab: '2', g: 'exon' }, { w: 50, kind: 'cds', lab: '3', g: 'exon' }, { w: 30, kind: 'utr', g: 'utr' }]
    : [{ w: 40, kind: 'utr', g: 'utr' }, { w: 40, kind: 'cds', lab: '1', g: 'exon' }, { w: 46, kind: 'intron', g: 'intron' }, { w: 40, kind: 'cds', lab: '2', g: 'exon' }, { w: 46, kind: 'intron', g: 'intron' }, { w: 40, kind: 'cds', lab: '3', g: 'exon' }, { w: 30, kind: 'utr', g: 'utr' }];
  function frameBase(t) {
    let s = `<rect x="16" y="22" width="568" height="${f(YE - 22)}" rx="10" fill="${C.nuc}" stroke="${C.line}"/>` + `<rect x="16" y="${f(YE)}" width="568" height="${f(410 - YE)}" rx="10" fill="${C.cyt}" stroke="${C.line}"/>`;
    s += text(28, 38, t('s3_pN'), { a: 'l', size: 14, w: 700, col: C.muted }) + text(28, YE + 34, t('s3_pC'), { a: 'l', size: 14, w: 700, col: C.muted });
    s += envelope(16, 584, YE, 286, 326);
    s += gene(XG, YG, GP, { post: 70 });
    s += G('pas', `<rect x="${f(XPAS - 12)}" y="${f(YG + 14)}" width="24" height="12" rx="3" fill="#FCE7CF" stroke="${C.rna}" stroke-width="1"/>`) + text(XPAS, YG + 36, 'AATAAA', { size: 10.5, w: 700, col: '#8A4B00' });
    return s;
  }
  /* мРНП: мРНК с белками; o.recep — рецептор экспорта на мРНП */
  function mrnp(x, y, o, t, extra = {}) {
    let s = mrna(x, y, MP(o.spliced, o.keepLast), { cap: o.cap, ppp: !o.cap, pa: o.polya, tail: o.readthrough ? 70 : 0 });

        `<g clip-path="url(#clip3bN)">${mrnp(xs, YN, o, t)}</g><g clip-path="url(#clip3bC)">${mrnp(xs, YC, o, t)}</g>` + line(PX, YN, PX, YC, C.rna, 3) +

    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));
    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */
    chips.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));
      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */
    const Td = T > 1e-9 && T < stop - 1e-9 && Math.abs(T - Math.round(T)) < 1e-9 ? T - 1e-6 : T;
    o.render(Td);
  }
  const api = {
    get T() { return st.T; }, get playing() { return st.on; }, get end() { return st.stop; },
    config(keys, stop, stopKey, opt = {}) {
      st.speed = opt.speed || 1.5; st.halt = !!opt.halt; st.keys = keys; st.n = keys.length; st.stop = stop; st.stopKey = stopKey; st.on = false; st.text = '';
      st.stepKey = opt.stepKey || 'tl_step'; st.off = opt.off || 0;
      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');
      chips.querySelectorAll('button').forEach((b, i) => b.onclick = () => { st.on = false; api.seek(i + 1); });
    },
    seek(T) { st.until = null; st.T = Math.max(0, Math.min(st.stop, T)); paint(); },
    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
    play(fromStart, until) {
      if (fromStart || st.T >= st.stop - 1e-6) st.T = 0;
      st.until = until != null && until < st.stop ? until : null;
      if (calm.matches) {   /* без движения: ответ показывается сразу, кнопка идёт по одному этапу */
        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => CASE.on ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —
   сначала прогноз, потом явный запуск («▶ Запустить», шаг или кнопка этапа). Как только шкала ушла с нуля, итог виден. */
function predictHold(K){ const sc = $('sc' + K); if (!sc) return; sc.classList.add('predict');
  /* рецензия v1.4, п. 8: кнопки этапов без исхода в доступном имени, пока прогноз не сделан */
  sc.querySelectorAll('.tlc').forEach(b => { if (!b.dataset.al) b.dataset.al = b.getAttribute('aria-label') || ''; b.setAttribute('aria-label', (b.dataset.al.split(':')[0] || '').trim());
    if (b.disabled) { b.dataset.no = '1'; b.disabled = false; } });   /* семинар 8, v1.2 (рецензия И-15): до запуска кружки одинаковы — недоступные не выдают место остановки */
  const c = $('capbox' + K), r = $('reads' + K); if (c) c.dataset.predict = t('predict_note'); if (r) r.dataset.predict = t('predict_reads'); }
function predictDone(K, T){ if (T > 1e-6) { const sc = $('sc' + K); if (sc && sc.classList.contains('predict')) { sc.classList.remove('predict');
  sc.querySelectorAll('.tlc').forEach(b => { if (b.dataset.al != null) { b.setAttribute('aria-label', b.dataset.al); delete b.dataset.al; } if (b.dataset.no) { b.disabled = true; delete b.dataset.no; } }); } } }

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typeof fitStage === 'function') fitStage(); });

/* =====================================================================
   s0_range.js — бегунок величины (общий компонент курса «Биология», v1.6 семинара 3).
   По образцу бегунков «Молекулярной биологии» (rangeHTML: подпись — величина, вывод — значение с единицами;
   засечки измеренных значений как в сцене s2b семинара 1 МБ).
   Возможности: засечки измеренных значений с подписями под шкалой; прилипание к засечке в пределах 3 % шкалы;
   ступенчатый режим (только измеренные положения); логарифмическая или своя шкала; штриховка участков
   «интерполяция модели / не измерено» между засечками. Блокировку в шаге «предскажите» даёт poeLock
   (s9_wip.js): бегунок — элемент input внутри панели переключателей.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
const RX = (function () {
  const SP = {}, N = 1000;
  const lg = Math.log10;
  /* положение на шкале p ∈ [0, 1] ↔ значение величины */
  function toP(sp, v) {
    if (sp.map) return clamp(sp.map[0](v));
    if (sp.log) return clamp((lg(v) - lg(sp.min)) / (lg(sp.max) - lg(sp.min)));
    return clamp((v - sp.min) / (sp.max - sp.min));
  }
  function toV(sp, p) {
    if (sp.map) return sp.map[1](p);
    if (sp.log) return Math.pow(10, lg(sp.min) + p * (lg(sp.max) - lg(sp.min)));
    return sp.min + p * (sp.max - sp.min);
  }
  const num = (v, d) => (d == null ? String(v) : v.toFixed(d)).replace('.', ',').replace('-', '−');
  function fmtV(sp, v) { return sp.fmt ? sp.fmt(v) : num(v, sp.dec != null ? sp.dec : 0); }
  function round(sp, v) { if (!sp.round) return v; const r = sp.round(v); return r; }
  /* место на дорожке: центр бегунка ходит от 11 px до (ширина − 11 px) */
  const at = p => `calc(11px + ${(p * 100).toFixed(2)}% - ${(p * 22).toFixed(2)}px)`;

  function html(id, sp) {
    SP[id] = sp; sp.id = id;
    const steps = !!sp.stepped, marks = sp.marks || [];
    const v0 = sp.val != null ? sp.val : steps ? marks[0][0] : sp.min, sep = sp.glue ? '' : ' ';
    sp.v = v0;
    const iv = steps ? marks.findIndex(m => m[0] === v0) : Math.round(toP(sp, v0) * N);
    let h = `<div class="rx${steps ? ' rxstep' : ''}" id="${id}W"><div class="row"><label for="${id}">${t(sp.k)}</label><output id="${id}O">${fmtV(sp, v0)}${sep}${t(sp.unit)}</output></div>`;
    h += `<div class="rxtrack">`;
    if (!steps) (sp.hatch || []).forEach(([a, b]) => { const pa = toP(sp, a), pb = toP(sp, b), l = Math.min(pa, pb), r = Math.max(pa, pb);
      h += `<i class="rxh" style="left:${at(l)};width:calc(${((r - l) * 100).toFixed(2)}% - ${((r - l) * 22).toFixed(2)}px)"></i>`; });
    h += `<input type="range" id="${id}" min="0" max="${steps ? marks.length - 1 : N}" step="1" value="${iv}" aria-valuetext="${fmtV(sp, v0)}${sep}${t(sp.unit)}">`;
    const pm = (v, i) => steps ? (marks.length > 1 ? i / (marks.length - 1) : 0) : toP(sp, v);
    const two = marks.some(m => m[3]);   /* близкие засечки: подпись во втором ряду */
    h += `</div><div class="rxticks${two ? ' two' : ''}" aria-hidden="true">` + marks.map(([v, , short, row], i) => { const p = pm(v, i);
      return `<span class="rxt${row ? ' r1' : ''}" style="left:${at(p)}" data-p="${p.toFixed(3)}"><i></i>${short ? t(short) : fmtV(sp, v)}</span>`; }).join('') + `</div>`;
    const leg = marks.filter(m => m[1]).map(([v, k]) => `<li><b>${fmtV(sp, v)}${sep}${t(sp.unit)}</b> — ${t(k)}</li>`).join('') +
      (sp.hatchKey ? `<li class="rxhl"><i class="rxsw"></i>${t(sp.hatchKey)}</li>` : '');
    if (leg) h += `<ul class="rxleg">${leg}</ul>`;
    return h + `</div>`;
  }
  /* обработчик: прилипание, вывод значения; fn вызывается после пересчёта */
  function bind(id, fn) {
    const sp = SP[id], e = $(id);
    /* клавиатура: стрелка переходит к следующей засечке или на 2 % шкалы (без прилипания, иначе из засечки не уйти) */
    if (!sp.stepped) e.addEventListener('keydown', ev => {
      const dir = ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? 1 : ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -1 : 0;
      if (!dir) return;
      ev.preventDefault();
      const p = +e.value / N, stp = 0.02;
      let q = clamp(p + dir * stp);
      (sp.marks || []).forEach(([mv]) => { const pm = toP(sp, mv); if (dir > 0 ? pm > p + 1e-4 && pm < q : pm < p - 1e-4 && pm > q) q = pm; });
      e.value = Math.round(q * N); sp._kb = true; e.dispatchEvent(new Event('input', { bubbles: true })); sp._kb = false;
    });
    e.addEventListener('input', () => {
      if (e.disabled) { set(id, sp.v); return; }   /* шаг сценария «предскажите»: заблокированный бегунок состояние не меняет (семинар 7, v1.2) */
      if (sp.stepped) { sp.v = sp.marks[+e.value][0]; }
      else {
        let p = +e.value / N, v = round(sp, toV(sp, p));
        const snap = sp.snap != null ? sp.snap : 0.03;
        let best = null; if (!sp._kb) (sp.marks || []).forEach(([mv]) => { const d = Math.abs(toP(sp, mv) - p); if (d <= snap && (!best || d < best.d)) best = { d, mv }; });
        if (best) { v = best.mv; e.value = Math.round(toP(sp, v) * N); }
        else if (sp._kb) { const m = (sp.marks || []).find(([mv]) => Math.abs(toP(sp, mv) - p) < 1e-3); if (m) v = m[0]; }
        sp.v = v;
      }
      out(sp); if (fn) fn(sp.v);
    });
    out(sp);
  }
  function out(sp) {
    const s = fmtV(sp, sp.v) + (sp.glue ? '' : ' ') + t(sp.unit), o = $(sp.id + 'O'), e = $(sp.id);
    if (o) o.textContent = s; if (e) e.setAttribute('aria-valuetext', s);
    const W = $(sp.id + 'W'); if (W) W.querySelectorAll('.rxt').forEach((x, i) => x.classList.toggle('on', (sp.marks[i] || [])[0] === sp.v));
  }
  /* поставить значение (из сценария или из анимации); ступенчатый бегунок — ближайшее измеренное положение */
  function set(id, v) {
    const sp = SP[id], e = $(id);
    if (sp.stepped) { let bi = 0; sp.marks.forEach(([mv], i) => { if (Math.abs(mv - v) < Math.abs(sp.marks[bi][0] - v)) bi = i; }); sp.v = sp.marks[bi][0]; if (e) e.value = bi; }
    else { (sp.marks || []).forEach(([mv]) => { if (Math.abs(toP(sp, mv) - toP(sp, v)) < 1e-4) v = mv; });   /* ошибка округления при пересчёте время ↔ значение */
      if (sp.round && !(sp.marks || []).some(([mv]) => mv === v)) v = sp.round(v);
      sp.v = v; if (e) e.value = Math.round(toP(sp, v) * N); }
    out(sp); return sp.v;
  }
  const get = id => SP[id].v;
  const spec = id => SP[id];
  /* значение на засечке? (для показаний «измерено» и для тестов) */
  const onMark = id => (SP[id].marks || []).some(([mv]) => mv === SP[id].v);
  return { html, bind, set, get, spec, onMark, toP, toV, fmtV, num };
})();
window.RX = RX;

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (граница с занятием, R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   Вкладка 1. Матричная и кодирующая цепи ДНК.
   1b — базовый: ориентация транскрипционной единицы (→ / ←) × цепь для сравнения с РНК (верхняя / нижняя). Модель — GN.s1b.

   «предскажите → проверьте → объясните» с обратной задачей (флаг mask), лестница подсказок p{K}_{i}_h1…h3,
   раскрываемые блоки «Чего модель не показывает» и «Новые данные и как это установили». Числа — учебные допущения.
   ===================================================================== */
const ADV = {};
function advMasked(K){ const st = (typeof poeMasked === 'function') ? poeMasked(K) : null; return !!(st && st.mask); }
const advPill = (k, v, cls = 'np') => `<span class="pill ${cls}">${t(k, v)}</span>`;
function advStrip(K, note){
  const view = stageView(K);
  let frame = () => '', mode = 'end', sig = null;
  const tl = timeStrip(K, { note, steps: true, render(T){ const s = $('svg' + K); if (s) s.innerHTML = defs(K) + frame(T); predictDone(K, T); }, onEnd: view.back });
  window['TL' + K.toUpperCase()] = tl;
  const z = $('tl' + K + 'z'); if (z) z.addEventListener('click', () => predictHold(K));
  return {
    tl,
    hold(){ mode = 'hold'; }, go(){ mode = 'play'; }, K,
    show(keys, f, opt = {}, masked = false){
      frame = masked ? () => f(null) : T => f(T >= tl.end - 1e-6 ? null : T);
      const s2 = JSON.stringify([keys, opt.key || '', opt.stop, opt.stopKey]);
      const changed = s2 !== sig;
      if (changed){ sig = s2; tl.config(keys, opt.stop != null ? opt.stop : keys.length, opt.stopKey || null, Object.assign({ speed: 1.3 }, opt)); }
      if (masked) tl.seek(tl.end);
      else if (mode === 'end') { if (changed) tl.seek(tl.end); else if (!tl.playing) tl.redraw(); }
      else if (mode === 'hold') { tl.seek(0); predictHold(K); }
      else { tl.play(true); view.reveal(300); }
      mode = 'end';
    },
  };
}

(function(){

    const r = _pr.apply(this, arguments);
    if (!POE.on) return r;
    const box = $('poe' + cur), si = poeIdx(POE.i), P = `p${cur}_${si + 1}`;
    if (!box || !((P + '_h1') in TEXTS) || POE.shown) return r;
    if (HINT.key !== P) HINT = { key: P, n: 0 };
    const hs = []; for (let i = 1; i <= 3; i++) if ((P + '_h' + i) in TEXTS) hs.push(t(P + '_h' + i));
    const shown = hs.slice(0, HINT.n).map((h, i) => `<p class="small hint"><b>${t('hint_n', { i: i + 1 })}</b> ${h}</p>`).join('');
    box.querySelector('.opts').insertAdjacentHTML('afterend', shown + (HINT.n < hs.length ? `<button class="btn ghost" id="poeHint">${t('hint_btn', { i: HINT.n + 1, n: hs.length })}</button>` : ''));
    const b = $('poeHint'); if (b) b.onclick = () => { HINT.n++; POE_FOCUS = { id: 'poeHint' }; poeRender(); };
    return r;
  };
})();

/* рецензия v1.0, Р-01: в шаге «предскажите» ответ не должен быть виден до выбора варианта.
   Флаг шага hide: true — схема и показания закрыты до «Показать на схеме»; mask: true — схема видна (это наблюдение
   обратной задачи), но скрыт переключатель с нажатым положением; подпись схемы сцена рисует нейтральной (POE_MASKED). */
function poeMasked(K){ if (!(POE.on && cur === K && !POE.shown)) return null; const st = SCENES[K].poe[poeIdx(POE.i, K)]; return st || null; }
function poeHide(K){ const sec = $('sc' + K); if (!sec) return; const st = poeMasked(K), hide = !!(st && st.hide), mask = !!(st && st.mask);
  sec.classList.toggle('poehide', hide); sec.classList.toggle('poemask', mask);
  const zw = sec.querySelector('.zwrap'); if (zw) { zw.dataset.hide = t('poe_hidden');
    /* рецензия интерактива, И-05: закрытая схема недоступна и диктору, и клавиатуре */
    zw.inert = hide; if (hide) zw.setAttribute('aria-hidden', 'true'); else zw.removeAttribute('aria-hidden'); }
  /* шкала этапов базового уровня в шагах hide и mask: кнопки отключены (в моделях блокирует modelReads) */
  const tl = $('tl' + K); if (tl && !(typeof MODEL !== 'undefined' && MODEL[K])) { const shut = hide || mask; if (shut && typeof TLS !== 'undefined' && TLS[K]) { TLS[K].halt(); TLS[K].seek(TLS[K].end); }   /* v1.2 (рецензия И-06): наблюдение — конечный кадр, а не остановленный промежуточный */
    tl.querySelectorAll('button, input').forEach(e => { e.disabled = shut || e.classList.contains('no'); }); }
  const r = $('reads' + K); if (r && hide) r.hidden = true; else if (r && !(typeof MODEL !== 'undefined' && MODEL[K])) r.hidden = false; }
Object.keys(SCENES).forEach(K => { const u = SCENES[K].update; SCENES[K].update = function(){ u(); poeHide(K); }; });
(function(){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments); Object.keys(SCENES).forEach(poeHide); return r; }; })();
/* рецензия v1.0, Р-35б: плавающая кнопка «↓ К выводу» ложилась на панель переключателей. Кнопка стоит в начале правой колонки
   и уходит вверх вместе с ней: на переключатели и показания она не ложится (v1.2) */
(function(){ const _ri = revInit; revInit = function(){ const r = _ri.apply(this, arguments);
  document.querySelectorAll('#scenes .side').forEach(sd => { const b = sd.querySelector('.totake'); if (b){ b.classList.add('inline'); sd.insertBefore(b, sd.firstChild); } });
  return r; }; })();

/* =====================================================================
   s9z_case.js — режим «Найти причину» (движок из семинара 7 v1.5; случаи семинара 8 — паспорт интерактива, 4.5; v1.1.2+).
   Образец со скрытой причиной; студент выбирает измерения. Задача решена, только если данные оставляют одно объяснение:
   верная догадка без данных не засчитывается. causes — варианты объяснения; truths — причины, которые может получить образец.
   В семинаре 9 образец получает одну из трёх причин случайно; «Начать заново» выбирает другую.
   Ситуации не из колоды занятия (R49). Логика (caseFits, caseMinimal) — чистые функции; все подписи — через t().
   ===================================================================== */
const CASE_SPEC = {
  /* случай 1, вкладка 2, продвинутый уровень: завершённых транскриптов мало (модель 2а; Song et al. 2026). Значения — модель 2а за 30 мин:
     контроль 2/мин, 90 %, 0 %; init — 0,5/мин; pause — 25 % после паузы; body — 75 % прекращают синтез в теле гена */
  '2a': { id: 'c1', causes: ['init', 'pause', 'body'], meth: {
    init: { ctrl: 'v60', init: 'v15', pause: 'v60', body: 'v60' },
    short: { ctrl: 'v6', init: 'v2', pause: 'v45', body: 'v6' },
    lost: { ctrl: 'v0', init: 'v0', pause: 'v0', body: 'v34' },
    done: { ctrl: 'v36', init: 'v10', pause: 'v10', body: 'v10' },
  } },
  /* случай 2, вкладка 3, продвинутый уровень: мало мРНК в цитоплазме (модель 3а за 60 мин; Choquet et al. 2025) */
  '3a': { id: 'c2', causes: ['proc', 'exp', 'tx'], meth: {
    pre: { ctrl: 'v29', proc: 'v124', exp: 'v29', tx: 'v11' },
    nuc: { ctrl: 'v39', proc: 'v16_17', exp: 'v193', tx: 'v16_17' },   /* v1.1 (рецензия Р-07): 17 и 16 — разница округления, одно значение */
    cyt: { ctrl: 'v254', proc: 'v100', exp: 'v100', tx: 'v100' },
    syn: { ctrl: 'v100', proc: 'v100', exp: 'v100', tx: 'v40' },
  } },
};
/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (caseFits(spec, set, truth).length !== 1) continue;
    if (set.length < any.length) any = set;
    if (set.every(m => spec.meth[m][truth] !== spec.meth[m].ctrl) && (!best || set.length < best.length)) best = set;
  }
  return best || any;
}
window.CASE_LOGIC = { CASE_SPEC, caseFits, caseMinimal };

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };
(function(){
  const url = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`);
  Object.keys(CASE_SPEC).forEach(K => {
    const sec = $('sc' + K);
    sec.querySelector('.side').insertAdjacentHTML('afterbegin', `<div class="panel case" id="case${K}" hidden></div>`);
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', `<div class="veil" aria-hidden="true"><b>${t('case_veil')}</b><span>${t('case_veil_s')}</span></div>`);
  });
  const val = (S, m, v) => t(`${S.id}_v_${m}_${v}`);
  /* решение проверяется и после выбора объяснения, и после каждого измерения */
  function settle(K, S){
    if (!CASE.solved && CASE.done.length && CASE.guess === CASE.truth && caseFits(S, CASE.done, CASE.truth).length === 1){
      CASE.solved = true; $('sc' + K).classList.add('casedone'); SCENES[K].caseShow(CASE.truth);
    }
  }
  const ctl = (S, m) => { const k = `${S.id}_v_${m}_${S.meth[m].ctrl}`; return t(TEXTS[k + '_c'] ? k + '_c' : k); };   /* в строке контроля «как в контроле» не годится */
  function start(K, seed){
    const S = CASE_SPEC[K];
    /* порядок измерений и объяснений перемешивается, как в сценариях; ?fixed — постоянный порядок */
    const mix = a => { a = a.slice(); if (!url.has('fixed')) for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const TR = S.truths || S.causes;
    Object.assign(CASE, { on: true, K, seed, truth: TR[seed % TR.length], done: [], guess: null, solved: false, open: null, mo: mix(Object.keys(S.meth)), co: mix(S.causes) });
    POE.on = false; poeRender();
    const sec = $('sc' + K); sec.classList.add('casemode'); sec.classList.remove('casedone');
    SCENES[K].caseShow(null); render(); sync();
    if (window.matchMedia && matchMedia('(max-width:1000px)').matches) $('case' + K).scrollIntoView({ block: 'start' });
  }
  function exit(){
    if (!CASE.on) return;
    const K = CASE.K, sec = $('sc' + K); CASE.on = false;
    sec.classList.remove('casemode', 'casedone'); $('case' + K).hidden = true; $('case' + K).innerHTML = '';
    SCENES[K].caseShow(null); SCENES[K].update(); sync();
  }
  function verdict(S){
    const g = CASE.guess; if (!g) return '';
    if (CASE.solved) return '';
    const fits = caseFits(S, CASE.done, CASE.truth);
    if (!CASE.done.length) return `<p class="cv warn">${t('case_need')}</p>`;
    if (!fits.includes(g)){
      const m = CASE.done.find(x => S.meth[x][g] !== S.meth[x][CASE.truth]);
      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
    }
    return `<p class="cv warn">${t(fits.length === 2 ? 'case_more1' : 'case_more', { n: fits.length - 1 })}</p>`;
  }
  function render(){
    const K = CASE.K, S = CASE_SPEC[K], box = $('case' + K); box.hidden = false;
    let h = `<div class="k">${t('case_k')}</div><h3 class="ct">${t(S.id + '_title')}</h3>${TEXTS[S.id + '_tag'] ? `<p class="ctag">${t(S.id + '_tag')}</p>` : ''}<p class="co">${t(S.id + '_obs')}</p><p class="cnote">${t('case_note')}</p>`;
    h += `<div class="ch">${t('case_meas')}</div><div class="cm">`;
    CASE.mo.forEach(m => {
      const on = CASE.done.includes(m), open = CASE.open === m;
      h += `<div class="crow${on ? ' on' : ''}"><button type="button" class="cmb" data-m="${m}"${on ? ' aria-pressed="true"' : ''}${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_m_${m}`)}</button>` +
        `<button type="button" class="cq" data-q="${m}" aria-expanded="${open}" aria-label="${t('case_meth')}: ${esc(t(`${S.id}_m_${m}`))}">${t('case_meth')}</button>` +
        (on ? `<div class="cres"><span>${t('case_ctrl')}: ${ctl(S, m)}</span><b>${t('case_sample')}: ${val(S, m, S.meth[m][CASE.truth])}</b></div>` : '') +
        (open ? `<p class="cmeth">${t(`${S.id}_k_${m}`)}</p>` : '') + `</div>`;
    });
    h += `</div><div class="ch">${t('case_why')}</div><div class="cc">`;
    CASE.co.forEach(c => {
      const right = CASE.solved && c === CASE.truth;
      h += `<button type="button" class="ccb${CASE.guess === c ? ' picked' : ''}${right ? ' right' : ''}" data-c="${c}"${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_c_${c}`)}</button>`;
    });
    h += `</div><div role="status">${verdict(S)}</div>`;
    if (CASE.solved){
      const min = caseMinimal(S, CASE.truth);
      const flat = Object.keys(S.meth).filter(m => new Set(S.causes.map(c => S.meth[m][c])).size === 1);
      h += `<div class="cdone" role="status"><b>${t('case_ok')}</b><p>${t(`${S.id}_w_${CASE.truth}`)}</p>` +
        (TEXTS[S.id + '_after'] ? `<p class="cmin">${t(S.id + '_after')}</p>` : '') +
        `<p class="cmin">${t('case_used', { n: CASE.done.length, k: min.length })} ${t('case_enough', { m: min.map(x => '«' + t(`${S.id}_m_${x}`) + '»').join(', ') })}</p>` +
        flat.map(m => `<p class="cmin">${t('case_flat', { m: t(`${S.id}_m_${m}`) })}</p>`).join('') +
        `<p class="cmin"><a href="${t(S.id + '_link_h')}">${t(S.id + '_link_t')}</a></p></div>`;
    }
    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;
    box.innerHTML = h;
    const keep = sel => { const e = $('case' + K).querySelector(sel); if (e && !e.disabled) e.focus({ preventScroll: true }); };   /* панель перестраивается: фокус не теряется */
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      const TR = S.truths || S.causes;
      if (!url.has('fixed') && TR.length > 1) do { seed = Math.floor(Math.random() * 9973); } while (TR[seed % TR.length] === CASE.truth);   /* семинар 8: при одной верной причине — тот же случай заново */
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur] || !SCENES[cur].caseShow; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
if (!TEXTS.route_url) document.querySelector('.routes').hidden = true;
/* «← Раздел …: семинары»: адрес берётся из ключа home_href (например, section-2.html#seminars; без ключа — index.html рядом);
   на сайте ссылка относительная, в сохранённом файле — на адрес сайта (аудит 06.11.2026, LINK-001) */
(function(){
  const a = $('homeLink'); if (!a) return;
  if (TEXTS.home_href) a.setAttribute('href', TEXTS.home_href);
  if (!/^(fresll\.github\.io|edu\.mazunin\.science)$/.test(location.hostname)) a.href = 'https://fresll.github.io/bio/' + (a.getAttribute('href') || '').replace(/^\.\//, '');
})();
window.addEventListener('hashchange', fromHash);
initNav(); fromHash(); show(); revInit();

</script>
