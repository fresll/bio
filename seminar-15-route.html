ждения живёт вместе с обоими родителями"],"static":["Полоса генома H. elevatus: 99 % как у H. pardalinus, 1 % — 44 острова, в 32 из них участки от H. melpomene; сеть трёх видов"],"scene":"s15_r_elevatus","L":{"r15_el_h_genome":"99 % генома","r15_ct_flow":"поток генов","r15_el_el":"H. elevatus","r15_el_1pct":"около 1 %","r15_el_shared":"общее с H. pardalinus (поток генов)","r15_el_isl":"острова расхождения","r15_el_99":"около 99 % генома сделано сходным с H. pardalinus потоком генов","r15_el_h_islands":"44 острова","r15_el_44":"44 острова расхождения (около 1 %); в 32 из них — участки от H. melpomene","r15_el_traits":"окраска; форма крыла; кормовое растение; феромоны; выбор партнёра","r15_el_mel":"от H. melpomene","r15_el_other":"остальные острова","r15_el_h_species":"Три вида","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_el_bridge":"перемычка: участки от H. melpomene","r15_el_age":"H. elevatus возник около 180 тыс. лет назад (137–216 тыс.)"}}},"adv_kind":"Новые данные"},{"id":"integration","num":32,"section":4,"questions":[1,2,3,4],"title":"Итоговая задача: от наблюдения к выводу","keywords":["Гомология","Ортологи","Клада","Интрогрессия","Неполная сортировка линий","Постзиготический барьер"],"lead":["Сходство, рисунок дерева, несовпадение деревьев и отсутствие гибридов — наблюдения; родство, история обмена генами и барьер — выводы, и для каждого нужны свои данные."],"mechanism":["Четыре наблюдения практикума: (I) ген вида 1 сходен с геном вида 2 на 95 %, с геном вида 3 — на 80 %: [[T03|гомология]] вероятна, но о родстве видов по этому судить нельзя, пока не установлено, что сравниваются [[T05|ортологи]], и не проверены выравнивание и другие гены; (II) два рисунка с разным порядком кончиков — одно дерево, если совпадают [[T21|клады]], корень и подпись длины ветви; (III) по 2000 участкам 400 деревьев (Л, М) против 100 (К, М) — избыток одного несовпадающего типа указывает на [[T41|интрогрессию]] (или структуру предковых популяций), а не на одну [[T38|неполную сортировку]]; (IV) гибриды первого поколения нормальны, а их потомки часто гибнут — [[T56|постзиготический барьер]], вероятно рецессивная [[T57|несовместимость Добжанского–Мёллера]]."],"paragraphs":["Общий порядок: (1) назвать уровень наблюдения — сходство, рисунок, доля деревьев, жизнеспособность; (2) перечислить совместимые объяснения; (3) указать данные, дающие каждому объяснению положительный признак; (4) если данных нет, сказать «по этим данным различить нельзя».","<b>На практикуме.<\/b> Итоговая задача под вкладкой 4."],"conditions":"Схема качественная · четыре ситуации условны.","sources":["src_01","src_02","src_09"],"base":"БИО-15·5, БИО-15·10, БИО-15·19, БИО-15·27","quiz":{"id":"S15-L32","question":"Почему избыток деревьев (Л, М) над (К, М) указывает на обмен генами?","options":[{"id":"S15-L32-1","text":"Деревья (Л, М) всегда самые частые","correct":false,"feedback":"Самые частые — деревья, совпадающие с деревом видов"},{"id":"S15-L32-2","text":"Без обмена их было бы поровну","correct":true,"feedback":"При одной неполной сортировке два несовпадающих типа равны, а интрогрессия добавляет деревья одного типа; похожий избыток может дать и структура предковых популяций"},{"id":"S15-L32-3","text":"Избыток показывает ошибку дерева видов","correct":false,"feedback":"Дерево видов подтверждает большинство участков; избыток касается несовпадающих"}]},"widget":{"kind":"dna","title":"","s":{"title":"От наблюдения к выводу","status":"Схема качественная · четыре ситуации условны","modes_label":"Ситуация","modes":["I","II","III","IV"],"args":[{"case":"I"},{"case":"II"},{"case":"III"},{"case":"IV"}],"notes":["Сходство — наблюдение; родство — по дереву ортологов","Внешняя группа не у корня — корень перенесён, клады другие","Избыток (Л, М) — обмен генами","Барьер после зиготы, вероятно рецессивный"],"static":["Четыре карточки «наблюдение → вывод → что проверить»"],"scene":"s15_int","L":{"fin_f1":"Ситуация I: сходство гена вида 1 с генами видов 2 и 3","fin_i_g1":"ген вида 1","fin_i_g2":"ген вида 2","fin_i_g3":"ген вида 3","fin_i_note":"Сходство — доля совпадающих позиций выравнивания","fin_f2":"Ситуация II: внешняя группа внутри группы изучаемых видов","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","fin_f3":"Ситуация III: деревья 2000 участков генома","t3_bar_KL":"совпадает: (К, Л)","t3_bar_LM":"не совпадает: (Л, М)","t3_bar_KM":"не совпадает: (К, М)","fin_iii_note":"Число деревьев каждого типа из 2000 участков","fin_f4":"Ситуация IV: гибриды первого поколения и их потомки","fin_iv_f1":"гибриды F1: нормальны","fin_iv_f2":"потомки гибридов","fin_iv_ok":"все жизнеспособны","fin_iv_dead":"многие гибнут (✕)"}}}},{"id":"links","num":33,"section":4,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":[],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},{"ul":["[[seminar-12-route.html#reconstruction|семинар 12: «Как реконструируют свойства LUCA»]] — гомология, ортологи и паралоги","[[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]] — почему история гена отличается от истории линии","[[seminar-12-route.html#gene-transfer|семинар 12: «Перенос генов в ядро и импорт белков»]] — слияние линий при эндосимбиозе","[[seminar-13-route.html#drift|семинар 13: «Генетический дрейф: случайная выборка копий»]] и [[seminar-13-route.html#census-effective|семинар 13: «Фактическая и эффективная численность»]] — почему копии генов сливаются случайно ие и интрогрессия»]], [[seminar-16-route.html#locus-vs-population|семинар 16: «История участка и история популяции — не одно и то же»]]"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Почему дыхательный аппарат зависит от двух геномов — [[https://edu.mazunin.science/seminar-9-route.html#dual-genome|«Молекулярная биология», семинар 9]] — продолжает БИО-15·30","Почему эффект FOXO зависит от паралога и ткани — [[https://edu.mazunin.science/seminar-6-route.html#foxo-paralogs|«Молекулярная биология», семинар 6]] — продолжает БИО-15·3","Как разделяют ядерный и митохондриальный вклад в дефект — [[https://edu.mazunin.science/seminar-9-route.html#genetic-tests|«Молекулярная биология», семинар 9]] — продолжает БИО-15·30"]}],"conditions":"","sources":[],"service":true,"quiz":{"id":"S15-L33","question":"Где в курсе разбирается, как дерево гена может не совпасть с деревом линий из-за переноса и потерь генов?","options":[{"id":"S15-L33-1","text":"В теме о мейозе","correct":false,"feedback":"Там — как расходятся гомологичные хромосомы: [[seminar-6-route.html#meiosis-one|семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»]]; история генов и линий разбирается в другом месте."},{"id":"S15-L33-2","text":"В теме о происхождении клетки","correct":true,"feedback":"История гена и история линии расходятся из-за дупликаций, потерь и переноса: [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]]."},{"id":"S15-L33-3","text":"В теме о популяционной генетике","correct":false,"feedback":"Там — частоты аллелей, дрейф и поток генов; несовпадение деревьев генов и линий из-за переноса — [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]]."}]}}],"sections":[{"title":"Что сравниваем","entry":"phylo-what","sub":"Что сравниваем","label":"Тема 1","integr":false},{"title":"Как читать дерево","entry":"tree-parts","sub":"Как читать дерево","label":"Тема 2","integr":false},{"title":"Дерево гена и дерево видов","entry":"gene-species-tree","sub":"Дерево гена и дерево видов","label":"Тема 3","integr":false},{"title":"Виды и видообразование","entry":"why-species","sub":"Виды и видообразование","label":"Тема 4","integr":false},{"title":"Итог","entry":"integration","sub":"От наблюдения к выводу","label":"Итог","integr":true}],"glossary":[{"id":"S15-T01","term":"Филогенетика","section":0,"def":"Раздел биологии, восстанавливающий родственные связи организмов, популяций и генов по их современным и ископаемым признакам."},{"id":"S15-T02","term":"Филогенетическое дерево","section":0,"def":"Схема родства линий, на которой ветви расходятся от общих предков (узлов дерева); строится по различиям последовательностей генов (с помощью моделей их изменения) или признаков и является моделью, а не наблюдением."},{"id":"S15-T03","term":"Гомология","section":0,"def":"Сходство, обусловленное общим происхождением; гомологичные гены происходят от общего предкового гена. В этом семинаре: гомология либо есть, либо нет и не выражается процентом сходства."},{"id":"S15-T04","term":"Аналогия","section":0,"def":"Сходство признаков по функции или форме без общего происхождения данного признака."},{"id":"S15-T05","term":"Ортологи","section":0,"def":"Гомологичные гены разных линий, разошедшиеся при разделении линий. В этом семинаре: сравнивают гены разных видов, разошедшиеся при разделении видов."},{"id":"S15-T06","term":"Паралоги","section":0,"def":"Гомологичные гены, возникшие при дупликации в одной линии. В этом семинаре: после разделения видов паралоги оказываются и в разных видах."},{"id":"S15-T07","term":"Дупликация гена","section":0,"def":"Возникновение второй копии гена в геноме."},{"id":"S15-T08","term":"Дерево гена","section":0,"def":"Схема родства последовательностей одного гена у разных организмов; может не совпадать с деревом клеточных линий. В этом семинаре: дерево гена или участка генома сравнивают с деревом видов."},{"id":"S15-T09","term":"Множественное выравнивание","section":0,"def":"Расположение нескольких последовательностей одна под другой так, чтобы в каждом столбце стояли позиции предположительно общего происхождения."},{"id":"S15-T10","term":"Позиционная гомология","section":0,"def":"Общее происхождение отдельных позиций последовательностей от одной позиции предковой последовательности; каждый столбец выравнивания — гипотеза о ней."},{"id":"S15-T11","term":"Пропуск","section":0,"def":"Знак «—» в выравнивании, обозначающий, что в этой последовательности в данной позиции нет нуклеотида или аминокислоты из-за вставки в другой последовательности или делеции в этой."},{"id":"S15-T12","term":"Вставка и делеция","section":0,"def":"Добавление или утрата одного или нескольких нуклеотидов."},{"id":"S15-T13","term":"Модель замен","section":0,"def":"Вероятностное описание того, как и с какой частотой одни нуклеотиды или аминокислоты заменяются другими; позволяет учесть невидимые повторные замены."},{"id":"S15-T14","term":"Насыщение","section":0,"def":"Потеря информации при сильном расхождении: повторные замены в одной позиции не видны, и различия растут медленнее времени."},{"id":"S15-T15","term":"Внешняя группа","section":0,"def":"Вид или группа, отделившиеся раньше сравниваемых; по ней определяют предковое состояние и неравенство скоростей. В этом семинаре: по внешней группе ставят корень дерева."},{"id":"S15-T16","term":"Структурно расходящийся участок","section":0,"def":"Участок генома, устроенный у одной линии иначе, чем у сравниваемых (перестроенный, удвоенный, повторяющийся или без соответствия), и поэтому не выравнивающийся один к одному."},{"id":"S15-T17","term":"Кончик (лист) дерева","section":1,"def":"Конечная точка дерева, соответствующая включённому в анализ виду, популяции или последовательности."},{"id":"S15-T18","term":"Внутренний узел","section":1,"def":"Точка ветвления дерева, изображающая реконструируемого общего предка отходящих от неё линий."},{"id":"S15-T19","term":"Ветвь","section":1,"def":"Линия дерева между двумя узлами или между узлом и кончиком."},{"id":"S15-T20","term":"Топология","section":1,"def":"Порядок соединения ветвей дерева, без учёта их длин и расположения на рисунке."},{"id":"S15-T21","term":"Клада","section":1,"def":"Группа, включающая общего предка и всех его потомков (монофилетическая группа)."},{"id":"S15-T22","term":"Сестринские группы","section":1,"def":"Две линии, отходящие от одного узла дерева и поэтому более близкие друг к другу, чем к любой другой линии."},{"id":"S15-T23","term":"Последний общий предок","section":1,"def":"Самый поздний узел дерева, от которого происходят обе сравниваемые линии; по его возрасту судят о родстве."},{"id":"S15-T24","term":"Корень дерева","section":1,"def":"Самый древний узел, от которого происходят все линии дерева; задаёт направление от предков к потомкам."},{"id":"S15-T25","term":"Некорневое дерево","section":1,"def":"Дерево, показывающее отношения линий без указания, какой узел древнее."},{"id":"S15-T26","term":"Длина ветви","section":1,"def":"Число замен на сайт (или время) вдоль ветви дерева; что означает длина, подписывают на каждом дереве. В этом семинаре: на кладограмме длина ветви ничего не означает."},{"id":"S15-T27","term":"Кладограмма","section":1,"def":"Изображение дерева, на котором длины ветвей ничего не означают."},{"id":"S15-T28","term":"Филограмма","section":1,"def":"Изображение дерева, на котором длина ветви пропорциональна числу замен на сайт."},{"id":"S15-T29","term":"Хронограмма","section":1,"def":"Изображение дерева, на котором длина ветви пропорциональна времени."},{"id":"S15-T30","term":"Общий производный признак","section":1,"def":"Состояние признака, отличное от предкового и общее для нескольких линий; по таким признакам выделяют клады."},{"id":"S15-T31","term":"Предковое состояние","section":1,"def":"Состояние признака у общего предка; обычно определяется по внешней группе."},{"id":"S15-T32","term":"Бутстрэп-поддержка","section":1,"def":"Доля деревьев с данной кладой среди деревьев, построенных по псевдовыборкам столбцов выравнивания, выбранных с возвращением; мера устойчивости клады к случайной выборке данных."},{"id":"S15-T33","term":"Политомия","section":1,"def":"Узел дерева с тремя и более дочерними ветвями."},{"id":"S15-T34","term":"Притяжение длинных ветвей","section":1,"def":"Систематическая ошибка, при которой быстро изменяющиеся линии ошибочно объединяются из-за параллельных и обратных замен."},{"id":"S15-T35","term":"Доля совпадающих деревьев (фактор согласованности)","section":1,"def":"Доля деревьев отдельных участков генома, в которых есть данная клада дерева видов."},{"id":"S15-T36","term":"Дерево видов","section":2,"def":"Схема порядка разделения популяций и видов."},{"id":"S15-T37","term":"Коалесценция","section":2,"def":"Слияние двух генных линий при прослеживании назад во времени: момент, когда две копии гена происходят от одной копии-предка."},{"id":"S15-T38","term":"Неполная сортировка линий","section":2,"def":"Сохранение нескольких предковых генных линий через последовательные разделения популяций, из-за которого дерево участка генома может не совпадать с деревом видов."},{"id":"S15-T39","term":"Предковый полиморфизм","section":2,"def":"Существование нескольких вариантов участка генома в предковой популяции до разделения видов."},{"id":"S15-T40","term":"Эффективная численность (Ne)","section":2,"def":"Численность идеальной популяции, в которой дрейф шёл бы с той же скоростью, что в реальной."},{"id":"S15-T41","term":"Интрогрессия","section":2,"def":"Включение наследственного материала одной линии в генофонд другой через гибридизацию и последующие возвратные скрещивания."},{"id":"S15-T42","term":"Гибридизация","section":2,"def":"Скрещивание особей разных видов или генетически различающихся популяций."},{"id":"S15-T43","term":"Возвратное скрещивание","section":2,"def":"Скрещивание гибрида с особью одного из родительских видов или популяций."},{"id":"S15-T44","term":"Горизонтальный перенос генов","section":2,"def":"Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями."},{"id":"S15-T45","term":"Филогенетическая сеть","section":2,"def":"Изображение истории линий в виде дерева с дополнительными перемычками, по которым часть генома переходила из линии в линию."},{"id":"S15-T46","term":"Адаптивная интрогрессия","section":2,"def":"Интрогрессия варианта, частота которого у линии-получателя выросла под действием положительного отбора."},{"id":"S15-T47","term":"Рекомбинация","section":2,"def":"Образование новых сочетаний аллелей при мейозе: при кроссинговере и независимом расхождении хромосом."},{"id":"S15-T48","term":"Вид","section":3,"def":"Основная единица классификации и эволюционной истории; совокупность популяций, обособленная от других по свойству, которое задаёт выбранная концепция вида."},{"id":"S15-T49","term":"Концепция вида","section":3,"def":"Представление о том, какое свойство делает линию видом."},{"id":"S15-T50","term":"Критерии разграничения видов","section":3,"def":"Наблюдаемые признаки и данные, по которым оценивают обособленность линии."},{"id":"S15-T51","term":"Биологическая концепция вида","section":3,"def":"Вид — группа скрещивающихся популяций, репродуктивно изолированная от других таких групп."},{"id":"S15-T52","term":"Филогенетическая концепция вида","section":3,"def":"Вид — наименьшая монофилетическая или диагностируемая группа организмов."},{"id":"S15-T53","term":"Экологическая концепция вида","section":3,"def":"Вид — линия, обособленность которой от других линий определяется прежде всего различием экологических ниш, а не репродуктивной изоляцией."},{"id":"S15-T54","term":"Репродуктивная изоляция","section":3,"def":"Совокупное снижение эффективного потока генов между линиями вследствие барьеров до и после образования зиготы."},{"id":"S15-T55","term":"Презиготический барьер","section":3,"def":"Барьер, препятствующий образованию гибридной зиготы: различия в месте и времени размножения, поведении, строении половых органов, взаимодействии гамет."},{"id":"S15-T56","term":"Постзиготический барьер","section":3,"def":"Барьер, проявляющийся после образования гибридной зиготы: нежизнеспособность или бесплодие гибридов и их потомков."},{"id":"S15-T57","term":"Несовместимость Добжанского–Мёллера","section":3,"def":"Снижение жизнеспособности или плодовитости гибрида из-за взаимодействия вариантов разных генов, независимо закрепившихся в разных линиях и впервые встретившихся у гибрида."},{"id":"S15-T58","term":"Эпистаз","section":3,"def":"Зависимость эффекта варианта одного гена от вариантов других генов."},{"id":"S15-T59","term":"Усиление изоляции","section":3,"def":"Усиление отбором барьеров до образования зиготы, когда гибриды менее приспособлены."},{"id":"S15-T60","term":"Гибридная зона","section":3,"def":"Область контакта двух популяций или видов, где образуются и живут гибриды."},{"id":"S15-T61","term":"Видообразование","section":3,"def":"Процесс возникновения эволюционно обособленных линий."},{"id":"S15-T62","term":"Аллопатрическое видообразование","section":3,"def":"Расхождение популяций, разделённых пространственным барьером."},{"id":"S15-T63","term":"Перипатрическое видообразование","section":3,"def":"Случай аллопатрического видообразования, при котором новую изолированную популяцию основывает небольшое число особей из крупной предковой популяции."},{"id":"S15-T64","term":"Парапатрическое видообразование","section":3,"def":"Расхождение соседних популяций с соприкасающимися ареалами, обменивающихся генами в зоне контакта."},{"id":"S15-T65","term":"Симпатрическое видообразование","section":3,"def":"Расхождение популяций без пространственного барьера, на одной территории."},{"id":"S15-T66","term":"Вторичный контакт","section":3,"def":"Встреча популяций, расходившихся в изоляции, после исчезновения пространственного барьера."},{"id":"S15-T67","term":"Поток генов","section":3,"def":"Перенос генетических вариантов между популяциями с мигрирующими особями или гаметами."},{"id":"S15-T68","term":"Дивергентный отбор","section":3,"def":"Отбор, благоприятствующий разным вариантам или значениям признака в разных популяциях или средах."},{"id":"S15-T69","term":"Гибридное видообразование","section":3,"def":"Возникновение эволюционно обособленной линии гибридного происхождения, репродуктивно изолированной от родительских линий."},{"id":"S15-T70","term":"Полиплоидия","section":3,"def":"Увеличение числа наборов хромосом в клетке больше двух."},{"id":"S15-T71","term":"Остров расхождения","section":3,"def":"Участок генома, различающийся между популяциями или видами на фоне участков, сближенных потоком генов."},{"id":"S15-T72","term":"Митохондриально-ядерная несовместимость","section":3,"def":"Несовместимость гибрида, при которой продукты ядерных генов одного вида плохо работают с продуктами митохондриальных генов другого."},{"id":"S15-T73","term":"Морфологическая концепция вида","section":3,"def":"Вид — группа организмов, отличающаяся от других по строению; применима к ископаемым и бесполым организмам, но границы видов по строению бывают произвольными."},{"id":"S15-T74","term":"Сходство последовательностей","section":0,"def":"Доля совпадающих позиций в выравнивании двух последовательностей; измеряемая величина, а не мера родства."}],"sources":{"src_01":{"url":"","cite":"Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014","doi":"","pmid":""},"src_02":{"url":"https://doi.org/10.1093/molbev/msae214","cite":"Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214","doi":"10.1093/molbev/msae214","pmid":""},"src_03":{"url":"https://doi.org/10.1038/s41576-020-0233-0","cite":"Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444","doi":"10.1038/s41576-020-0233-0","pmid":""},"src_04":{"url":"https://doi.org/10.1093/molbev/msae177","cite":"Redelings B.D. et al. Insertions and deletions: computational methods, evolutionary dynamics, and biological applications. Mol Biol Evol 2024; 41: msae177","doi":"10.1093/molbev/msae177","pmid":""},"src_05":{"url":"https://doi.org/10.1101/gr.278993.124","cite":"Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256","doi":"10.1101/gr.278993.124","pmid":""},"src_06":{"url":"https://doi.org/10.1038/s41586-025-08816-3","cite":"Yoo D. et al. Complete sequencing of ape genomes. Nature 2025; 641: 401–418","doi":"10.1038/s41586-025-08816-3","pmid":""},"src_07":{"url":"https://doi.org/10.1126/science.adj9201","cite":"Rossi M. et al. Adaptive introgression of a visual preference gene. Science 2024; 383: 1368–1373","doi":"10.1126/science.adj9201","pmid":""},"src_08":{"url":"https://doi.org/10.1073/pnas.2309168121","cite":"Groh J.S., Coop G. The temporal and genomic scale of selection following hybridization. Proc Natl Acad Sci USA 2024; 121: e2309168121","doi":"10.1073/pnas.2309168121","pmid":""},"src_09":{"url":"https://doi.org/10.1038/s41586-023-06895-8","cite":"Moran B.M. et al. A lethal mitonuclear incompatibility in complex I of natural hybrids. Nature 2024; 626: 119–127","doi":"10.1038/s41586-023-06895-8","pmid":""},"src_10":{"url":"https://doi.org/10.1038/s41586-024-07263-w","cite":"Rosser N. et al. Hybrid speciation driven by multilocus introgression of ecological traits. Nature 2024; 628: 811–817","doi":"10.1038/s41586-024-07263-w","pmid":""},"src_11":{"url":"https://doi.org/10.1038/s41579-025-01255-x","cite":"Uraki R. et al. SARS-CoV-2 variants: biology, pathogenicity, immunity, and control. Nat Rev Microbiol 2026; 24: 8–28","doi":"10.1038/s41579-025-01255-x","pmid":""},"src_12":{"url":"https://doi.org/10.1371/journal.pgen.1005860","cite":"Shapiro B.J., Leducq J.-B., Mallet J. What is speciation? PLoS Genet 2016; 12: e1005860","doi":"10.1371/journal.pgen.1005860","pmid":""},"src_13":{"url":"https://doi.org/10.1098/rstb.2008.0076","cite":"Butlin R.K., Galindo J., Grahame J.W. Sympatric, parapatric or allopatric: the most important way to classify speciation? Philos Trans R Soc B 2008; 363: 2997–3007","doi":"10.1098/rstb.2008.0076","pmid":""},"src_14":{"url":"https://doi.org/10.1002/bies.20745","cite":"Templeton A.R. The reality and importance of founder speciation in evolution. BioEssays 2008; 30: 470–479","doi":"10.1002/bies.20745","pmid":""}},"questions":["Что сравниваем","Как читать дерево","Дерево гена и дерево видов","Виды и видообразование"],"exam_ids":["homology","ortho-para","root-outgroup","branch-length","support","ils","introgression","species-concepts","postzygotic","geographic-modes"],"practice_url":"seminar-15.html","open_questions":[]};
/* Объяснения к семинару 15. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => String(s).replace(/БИО-(\d+)·(\d+)–(\d+)·(\d+)/g, (m, n, a, n2, b) => n !== n2 || +b < +a ? m : 'БИО-' + n + '·' + Array.from({length: b - a + 1}, (_, i) => +a + i).join(', БИО-' + n + '·'))
  .replace(/(БИО-(\d+)·\d+)((?:, \2·\d+)+)/g, (m, a, n, rest) => a + rest.replace(/, (\d+)·/g, ', БИО-$1·'))   /* выпуск 3.1 (Н3-04): диапазон «БИО-N·a–N·b» и короткий список «БИО-N·a, N·b» — ссылки на каждый шаг */
  .replace(/(шаге? )?БИО-15·(\d+)((?:, 15·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
/* семинар 11, v1.1.7: курсив названий генов (<i>lacZ</i>) — после экранирования разрешён только тег <i> без атрибутов;
   семинар 12: и <b> без атрибутов (полужирные названия звеньев в БИО-12·9, 04) */
const XSEM = /^(fresll\.github\.io|edu\.mazunin\.science)$/.test(location.hostname) ? '' : 'https://fresll.github.io/bio/';   /* финальный аудит 20.11.2026 */
const rt = s => stepRefs(esc(s)).replace(/&lt;i&gt;([^&<]{1,80}?)&lt;\/i&gt;/g, '<i>$1</i>').replace(/&lt;b&gt;([^&<]{1,80}?)&lt;\/b&gt;/g, '<b>$1</b>').replace(/\[\[(T\d{2,3})\|([^\]]+)\]\]/g, (_, id, t) => `<a class="gl" href="#glossary-S15-${id}" data-gloss="S15-${id}">${t}</a>`)
  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`)
  /* финальный аудит 20.11.2026 (B-01, B-05): ссылка внутри курса [[seminar-N-route.html#id|текст]] — относительная, в той же вкладке;
     в сохранённом файле — адрес сайта (как LINK-001) */
  .replace(/\[\[((?:seminar-\d+(?:-route)?|index|section-\d+)\.html(?:#[\w-]+)?)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="xsem" href="${XSEM}${u}">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */
const ncap = s => esc(s).replace(/Ca(?=²⁺)/g, '<span style="text-transform:none">Ca</span>');
const plain = s => String(s).replace(/\[\[(T\d{2,3}|https?:\/\/[^|\]\s]+|(?:seminar-\d+(?:-route)?|index|section-\d+)\.html(?:#[\w-]+)?)\|([^\]]+)\]\]/g, '$2');

/* ---------- хранение: один ключ, шаги и итоговая проверка раздельно ---------- */
const KEY = 'bio-s15-explanations-v1-progress';
let store = {v: 1, steps: {}, exam: {}}, state = {}, current = 'home';
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.v === 1) store = {v: 1, steps: raw.steps || {}, exam: raw.exam || {}, last: raw.last || null};
} catch (e) {}
/* ревизия вопроса (quiz.rev, по умолчанию 1): после содержательной правки вопроса rev увеличивают, и прежняя отметка не засчитывается;
   записи шагов, которых больше нет, не учитываются. Записи без rev считаются rev 1 — прежний прогресс сохраняется. */
const qrev = l => (l.quiz && l.quiz.rev) || 1;
(function () {
  const cur = {}; CONTENT.lessons.forEach(l => { cur[l.id] = qrev(l); });
  ['steps', 'exam'].forEach(k => Object.keys(store[k]).forEach(id => { const r = store[k][id]; if (!(id in cur) || !r || (r.rev || 1) !== cur[id]) delete store[k][id]; }));
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} renderNav(); };
/* v1.8: запоминаем, где читатель остановился. iPhone и встроенные браузеры при возврате в приложение перезагружают страницу по исходному адресу
   (без #шаг) — раньше после этого открывалась начальная страница, а шаг приходилось искать заново. Теперь шаг и положение прокрутки восстанавливаются
   (если прошло меньше 14 дней); кнопка начальной страницы в шапке по-прежнему открывает начало. */
const LAST_TTL = 14 * 24 * 3600 * 1000;
/* пишется только поле last в свежих данных хранилища: так запись положения не затирает прогресс, изменённый в другой вкладке или сброшенный */

const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => { const k = l.quiz.id || l.id; return ORDER[k] || (ORDER[k] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id)); };   /* семинар 9, v1.1: порядок — по id вопроса (у итоговой проверки свои вопросы) */

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {

function levelBars(rows, w = 640) {

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

function renderNav() {

  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  const BL = CONTENT.lessons.filter(l => l.level !== 'adv'), nb = BL.filter(l => store.steps[l.id] && store.steps[l.id].correct).length;   /* базовые шаги (курс «Биология», А1-22) */

    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {

    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${ncap(s.title)}</div>` + ls.map(l => {

}
function navigate(id) {
  let target = id, anchor = '';
  if (id.indexOf('glossary-') === 0) { anchor = id.slice(9); target = 'glossary'; }
  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  saveLast(want, 0);
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);
  else if (target === 'exam') renderExam(); else if (target === 'all') renderAll(); else renderLesson(lessonById(target));
  if (anchor) { const el = $('g-' + anchor); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
  else window.scrollTo({top: 0, behavior: 'instant'});
  if (!anchor) $('main').focus({preventScroll: true});
  document.title = (lessonById(target) ? lessonById(target).title + ' — ' : '') + U.page_title;
}

}

  return `<section class="quiz" id="${scope}-${l.id}" aria-labelledby="${scope}-${l.id}-q"><div class="eyebrow">${esc(U.quiz_eyebrow)}</div><h3 id="${scope}-${l.id}-q">${rt(q.question)}</h3>` +

function bindQuiz(l, scope = 'quiz') {
  const boxEl = $(`${scope}-${l.id}`); let last = null;
  boxEl.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
    const id = b.dataset.answer, o = optById(l, id), ok = !!o.correct;
    boxEl.querySelectorAll('[data-answer]').forEach(x => { x.classList.remove('correct', 'wrong'); x.setAttribute('aria-pressed', String(x === b)); });
    b.classList.add(ok ? 'correct' : 'wrong');
    boxEl.querySelector('.quiz-feedback').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${esc(ok ? U.fb_ok : U.fb_bad)}</strong> ${rt(o.feedback)}` +
      (scope === 'exam' ? `<p><button data-return="${l.id}">${esc(U.open_expl)}</button></p>` : '') + `</div>`;
    const rec = (scope === 'exam' ? store.exam : store.steps);

function renderLesson(l) {

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 760 px) во всех «Объяснениях».
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 720 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:760px)') : null;
  let busy = false, queued = false;
  function fitPhone() {
    queued = false;
    const d = document.getElementById('widget-drawing'); if (!d) return;
    const sv = d.querySelector('svg'); if (!sv) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); d.style.removeProperty('--p5w'); return; }
    busy = true;
    try {
      const cur = sv.getBoundingClientRect().width, flatW = d.clientWidth;
      if (!cur || !flatW) return;
      const k = flatW / cur; let min = Infinity;
      ts.forEach(t => {
        const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
        const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
        if (px > 0 && px < min) min = px;
        t.classList.toggle('p5-small', px < 7);
      });
      if (min < Infinity) d.style.setProperty('--p5w', Math.ceil(Math.min(1800, Math.max(720, flatW * 11.2 / min))) + 'px');
    } finally { setTimeout(() => { busy = false; }, 0); }
  }
  const later = () => { if (busy || queued) return; queued = true; requestAnimationFrame(fitPhone); };
  function arm() {
    const main = document.getElementById('main') || document.body;
    new MutationObserver(later).observe(main, { childList: true, subtree: true });
    document.addEventListener('click', e => { if (e.target && e.target.id === 'widget-zoom') later(); }, true);
    window.addEventListener('resize', later);
    later();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
})();
/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +

  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:

    if (o.n && String(s).length > o.n) return TN(x, y, wrap(String(s), o.n), o);
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle', sz = o.size || 13, col = o.col || C.ink;
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${sz}" font-weight="${o.w || 500}" fill="${col}" style="text-anchor:${a};dominant-baseline:central;fill:${col}"${o.it ? ' font-style="italic"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * sz * .6 + 8, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - sz * .75)}" width="${f(wd)}" height="${f(sz * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function wrap(s, n) { const out = []; let cur = ''; for (const w of s.split(/\s+/)) { if ((cur + ' ' + w).trim().length > n && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); } if (cur) out.push(cur); return out.join('\n'); }
  function TN(x, y, s, o = {}) { const L = String(s).split('\n'), sz = o.size || 13, y0 = o.vc ? y - (L.length - 1) * sz * 1.22 / 2 : y; return L.map((ln, i) => T(x, y0 + i * sz * 1.22, ln, Object.assign({}, o, { n: 0 }))).join(''); }
  const title = (s, x = 12, y = 16) => T(x, y, s, { a: 'l', size: 14, w: 700, col: C.muted });
  const panel = (x, y, s) => T(x, y, s, { a: 'l', size: 15, w: 800, col: C.ink });   /* буква панели: А, Б, В */
  function line(x1, y1, x2, y2, col, w = 2, extra = '') { return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`; }
  function arrow(x1, y1, x2, y2, col = C.ink, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8 + w;
    const p1 = [x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)], p2 = [x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)];
    return line(x1, y1, x2 - Math.cos(a) * s * .6, y2 - Math.sin(a) * s * .6, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* дуговая стрелка (цикл): от (x1,y1) к (x2,y2) с изгибом k (доля длины, знак — сторона) */
  function carrow(x1, y1, x2, y2, k = .3, col = C.ink, w = 2.2, dash = '') {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, cx = mx - dy * k, cy = my + dx * k;
    const a = Math.atan2(y2 - cy, x2 - cx), s = 8 + w;
    const p1 = [x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)], p2 = [x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)];
    const ex = x2 - Math.cos(a) * s * .6, ey = y2 - Math.sin(a) * s * .6;
    return `<path d="M${f(x1)},${f(y1)} Q${f(cx)},${f(cy)} ${f(ex)},${f(ey)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  function larrow(x1, y1, x2, y2, label, col = C.ink, o = {}) {
    return arrow(x1, y1, x2, y2, col, o.w || 2.4, o.dash || '') + (label ? T((x1 + x2) / 2 + (o.dx || 0), (y1 + y2) / 2 + (o.dy == null ? -12 : o.dy), label, { size: o.size || 12, w: 600, col, bg: true, n: o.n }) : '');
  }
  const cross = (x, y, r = 9) => `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`;
  /* плашка «откроется после ответа» на месте скрытого результата */
  function waitBox(x, y, w, h, label) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="8" fill="#EEF1F4" stroke="${C.line}" stroke-dasharray="5 4"/>` + (label ? T(x + w / 2, y + h / 2, label, { size: 11.5, col: C.muted, it: true, n: Math.max(12, Math.floor(w / 7)), vc: true }) : '');
  }
  /* метка-плашка (например, «следствие модели»): текст в рамке */
  function tag(x, y, s, col = C.warn, o = {}) {
    const sz = o.size || 11.5, wd = String(s).length * sz * .58 + 14;
    return `<rect x="${f(x - wd / 2)}" y="${f(y - sz)}" width="${f(wd)}" height="${f(sz * 2)}" rx="${f(sz)}" fill="#fff" stroke="${col}" stroke-width="1.4"/>` + T(x, y, s, { size: sz, w: 700, col });
  }
  /* строка показаний под схемой: [[название, значение, хорошо?], …] — текст + цвет */
  function readout(x, y, rows, o = {}) {
    const lh = o.lh || 18; let s = '';
    rows.forEach(([k, v, good], i) => { s += T(x, y + i * lh, k + ':', { a: 'l', size: o.size || 11.5, w: 600, col: C.muted }) + T(x + (o.kw || 150), y + i * lh, v, { a: 'l', size: o.size || 11.5, w: 700, col: good == null ? C.ink : good ? C.ok : C.bad }); });
    return s;
  }

  /* ---------- стороны мембраны: просвет / снаружи — сверху, цитозоль — снизу (10, разд. 0) */
  function sides(y, o = {}) {
    const x0 = o.x0 || 0, x1 = o.x1 || 600, top = o.top == null ? 26 : o.top, bot = o.bot || 420;   /* интеграция: top: 0 допустим (агенты t1, t3) */
    let s = `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${f(y - top)}" fill="${C.lumen}"/>` + `<rect x="${x0}" y="${f(y)}" width="${x1 - x0}" height="${f(bot - y)}" fill="${C.cyto}"/>`;
    if (o.up) s += G(o.gUp || 'lumen', T(x0 + 10, top + 14, o.up, { a: 'l', size: 12, w: 700, col: '#3E6A9A', it: true }));
    if (o.down) s += G(o.gDown || 'cyto', T(x0 + 10, bot - 14, o.down, { a: 'l', size: 12, w: 700, col: '#8A7344', it: true }));
    return s;
  }
  /* горизонтальная мембрана (бислой BF) на уровне y с разрывами gaps = [[xa, xb], …] (места белков, проходящих мембрану) */
  function memH(x0, x1, y, gaps = [], g = 'er_mem') {
    const seg = []; let a = x0;
    gaps.slice().sort((p, q) => p[0] - q[0]).forEach(([ga, gb]) => { if (ga > a) seg.push([a, ga]); a = Math.max(a, gb); });
    if (a < x1) seg.push([a, x1]);
    return G(g, seg.map(([p, q]) => BF.bilayerPts([[p, y], [q, y]])).join(''));
  }
  const MH = BF.MEM.h;   /* толщина бислоя */
  /* замкнутый компартмент из бислоя по точкам (носитель, цистерна, эндосома) с заливкой просвета */
  function closedMem(pts, fill = C.lumen, g = null) {
    const d = 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' Z';
    return G(g, `<path d="${d}" fill="${fill}"/>` + BF.bilayerPts(pts, { closed: true }));
  }
  const roundRectPts = (x, y, w, h, r, n = 8) => {
    const P = [], arc = (cx, cy, a0) => { for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; P.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
    arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI); return P;
  };
  const circlePts = (cx, cy, R, n = 48) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  /* носитель (транспортный пузырёк) из бислоя; coat — 'copii' | 'copi' | 'clath' | null — оболочка снаружи (цитозольная сторона) */
  function carrier(cx, cy, R = 18, coat = null, inner = '', g = 'carrier') {
    let s = closedMem(circlePts(cx, cy, R), C.lumen) + inner;
    /* интеграция (агенты t2, t3, a34): BF.coatRing сам отступает от бислоя — радиус носителя R без добавки; группа справки ретромера — retromer */
    if (coat) s += G(coat === 'retro' ? 'retromer' : coat, BF.coatRing(cx, cy, R, C[coat] || coat, Math.max(10, Math.round(R * .7))));
    return G(g, s);
  }

  /* ---------- синтез: рибосома, мРНК, цепь (вкладка 1) */
  /* рибосома: большая субъединица сверху (выход туннеля — к мембране), малая снизу на мРНК; возвращает точку выхода туннеля */
  function ribosome(cx, cy, k = 1, o = {}) {
    const s = `<ellipse cx="${f(cx)}" cy="${f(cy - 13 * k)}" rx="${f(30 * k)}" ry="${f(19 * k)}" fill="${C.riboL}"/>` +
      `<ellipse cx="${f(cx)}" cy="${f(cy + 12 * k)}" rx="${f(23 * k)}" ry="${f(11 * k)}" fill="${C.riboS}"/>` +
      (o.slow ? `<circle cx="${f(cx + 26 * k)}" cy="${f(cy - 26 * k)}" r="${f(7 * k)}" fill="#fff" stroke="${C.warn}" stroke-width="1.6"/>` + line(cx + 26 * k, cy - 30 * k, cx + 26 * k, cy - 26 * k, C.warn, 1.6) + line(cx + 26 * k, cy - 26 * k, cx + 29 * k, cy - 24 * k, C.warn, 1.6) : '');
    return { s: G(o.g || 'ribo', s), x: cx, y: cy - 32 * k, mrnaY: cy + 22 * k };
  }
  /* мРНК: горизонтальная линия с засечками */
  function mrna(x0, x1, y, g = 'mrna') {
    let s = line(x0, y, x1, y, C.mrna, 3.2);
    for (let x = x0 + 6; x < x1; x += 10) s += line(x, y, x, y + 5, C.mrna, 1.6);
    return G(g, s);
  }
  /* растущая цепь по точкам pts (от рибосомы к N-концу); o.sig — доля длины у N-конца, закрашенная как сигнал (0 — нет);
     o.sigG — группа справки сигнала; o.wave — амплитуда волны (0 — прямая); o.col — цвет; o.dash — штрих (белок вне пути) */
  function chain(pts, o = {}) {
    const amp = o.wave == null ? 3.2 : o.wave, wl = 14, col = o.col || C.chain, w = o.w || 3.2;
    const seg = []; let L = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
    const at = l => { let i = 0; while (i < seg.length - 1 && l > seg[i]) { l -= seg[i]; i++; } const u = seg[i] ? Math.min(1, l / seg[i]) : 0, a = pts[i], b = pts[i + 1]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, (b[0] - a[0]) / (seg[i] || 1), (b[1] - a[1]) / (seg[i] || 1)]; };
    const path = (l0, l1) => { const q = []; for (let l = l0; l <= l1 + .01; l += 1.5) { const [x, y, tx, ty] = at(Math.min(l, L)); const off = Math.sin(l / wl * 2 * Math.PI) * amp; q.push(f(x - ty * off) + ',' + f(y + tx * off)); } return 'M' + q.join(' L'); };
    const P = (d, c) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
    const ls = L * (1 - (o.sig || 0));
    let s = G(o.g || 'chain', P(path(0, ls), col));
    if (o.sig) s += G(o.sigG || 'sig', P(path(ls, L), C.sig));
    return s;
  }
  /* SRP: частица с гидрофобным карманом (зелёная), k — масштаб */
  const srp = (cx, cy, k = 1, g = 'srp') => G(g, `<path d="M${f(cx - 26 * k)},${f(cy + 6 * k)} C${f(cx - 26 * k)},${f(cy - 15 * k)} ${f(cx - 6 * k)},${f(cy - 17 * k)} ${f(cx)},${f(cy - 5 * k)} C${f(cx + 6 * k)},${f(cy - 17 * k)} ${f(cx + 26 * k)},${f(cy - 15 * k)} ${f(cx + 26 * k)},${f(cy + 6 * k)} C${f(cx + 17 * k)},${f(cy + 15 * k)} ${f(cx - 17 * k)},${f(cy + 15 * k)} ${f(cx - 26 * k)},${f(cy + 6 * k)} Z" fill="${C.srp}" stroke="#1B5E3A" stroke-width="1"/>`);
  /* рецептор SRP: две цепи в мембране (y — середина бислоя), головка в цитозоле (снизу) */
  const srpR = (x, y, g = 'srpr') => G(g, `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 2)}" width="12" height="${f(MH + 4)}" rx="3" fill="${C.srpr}"/>` +
    `<path d="M${f(x - 16)},${f(y + MH / 2 + 4)} Q${f(x)},${f(y + MH / 2 + 22)} ${f(x + 16)},${f(y + MH / 2 + 4)}" fill="none" stroke="${C.srpr}" stroke-width="6" stroke-linecap="round"/>`);
  /* транслокон Sec61: две половины поперёк мембраны (y — середина бислоя); o.open — канал открыт; o.plug — пробка закрывает канал
     (со стороны просвета); o.gate — латеральные ворота приоткрыты (сигнал уходит в бислой справа); o.off — звено выключено */
  function sec61(x, y, o = {}) {
    const gap = o.open ? 12 : 4, w = 13, h = MH + 14, y0 = y - h / 2, col = o.off ? C.grey : C.sec61;
    let s = `<rect x="${f(x - gap / 2 - w)}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>` +
      `<rect x="${f(x + gap / 2 + (o.gate ? 4 : 0))}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>`;
    if (o.plug) s += G('plug', `<rect x="${f(x - gap / 2 - 2)}" y="${f(y0 + 1)}" width="${f(gap + 4)}" height="7" rx="3" fill="${C.plug}" stroke="${col}" stroke-width="1"/>`);
    return G('sec61', s) + (o.off ? cross(x, y0 - 12, 7) : '');
  }
  /* сигнальная пептидаза: белок мембраны с активным центром со стороны просвета (сверху); o.off — нет фермента (штрих) */
  function spase(x, y, o = {}) {
    if (o.off) return G('spase', `<rect x="${f(x - 7)}" y="${f(y - MH / 2 - 14)}" width="14" height="${f(MH + 14)}" rx="4" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>`) + cross(x, y - MH / 2 - 20, 6);
    return G('spase', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 4)}" width="12" height="${f(MH + 8)}" rx="3" fill="${C.spase}"/>` +
      `<path d="M${f(x - 9)},${f(y - MH / 2 - 16)} L${f(x)},${f(y - MH / 2 - 6)} L${f(x + 9)},${f(y - MH / 2 - 16)}" fill="none" stroke="${C.spase}" stroke-width="3.2" stroke-linecap="round"/>`);
  }

  /* ---------- гликаны и метка (условные знаки, без формул) */
  const sq = (x, y, u, c = C.glcnac) => `<rect x="${f(x - u / 2)}" y="${f(y - u / 2)}" width="${f(u)}" height="${f(u)}" fill="${c}"/>`;
  const ci = (x, y, u, c = C.man) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u / 2)}" fill="${c}"/>`;
  const tri = (x, y, u, c = C.glc) => `<path d="M${f(x)},${f(y - u * .55)} L${f(x + u * .55)},${f(y + u * .45)} L${f(x - u * .55)},${f(y + u * .45)} Z" fill="${c}"/>`;
  const pmark = (x, y, u) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u * .62)}" fill="${C.phos}"/>` + `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(u * .85)}" font-weight="800" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">P</text>`;
  /* N-гликан на аспарагине в точке (x, y), растёт в сторону dir (−1 — вверх). o.glc — число глюкоз (0–3); o.trim — маннозы укорочены
     (сигнал к удалению); o.p — метка M6P ('P' на маннозе) | 'glcnacP' — промежуточная (GlcNAc-P на маннозе); o.complex — сложный
     (аппарат Гольджи: концевые ветви другими знаками); u — размер знака */
  function glycan(x, y, dir = -1, o = {}, g = 'glycan') {
    const u = o.u || 7, st = u * 1.35, Y = i => y + dir * st * i;
    let s = line(x, y, x, Y(3), '#555', 1.4) + line(x, Y(3), x - st, Y(4), '#555', 1.4) + line(x, Y(3), x + st, Y(4), '#555', 1.4);
    s += sq(x, Y(1), u) + sq(x, Y(2), u) + ci(x, Y(3), u);
    if (o.complex) { s += sq(x - st, Y(4), u, '#6B8E23') + sq(x + st, Y(4), u, '#6B8E23') + ci(x - st, Y(5), u * .9, '#E8B4C8') + ci(x + st, Y(5), u * .9, '#E8B4C8'); return G(g, s); }
    s += ci(x - st, Y(4), u) + ci(x + st, Y(4), u);
    if (!o.trim) { s += line(x - st, Y(4), x - st, Y(5), '#555', 1.2) + ci(x - st, Y(5), u); }
    for (let i = 0; i < (o.glc || 0); i++) s += tri(x - st, Y(6 + i), u);
    if (o.p) {
      const px = x + st + u * .9, py = Y(4) + dir * u * .5;
      s += line(x + st, Y(4), px, py, '#555', 1.2);
      if (o.p === 'glcnacP') s += sq(px + u * 1.1, py + dir * u * .5, u * .9) + G('m6p', pmark(px, py, u)); else s += G('m6p', pmark(px, py, u));
    }
    return G(g, s);
  }

  /* ---------- шапероны, контроль качества, удаление */
  const bip = (x, y, k = 1, g = 'bip') => G(g, `<path d="M${f(x - 12 * k)},${f(y - 9 * k)} A13,13 0 1 0 ${f(x + 12 * k)},${f(y - 9 * k)}" fill="none" stroke="${C.chap}" stroke-width="${f(6 * k)}" stroke-linecap="round"/>`);
  const pdi = (x, y, g = 'pdi') => G(g, `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7" fill="${C.pdi}"/>`);   /* интеграция (агент t2): без текста 7,5 px — подпись PDI ставит сцена */
  /* калнексин: белок мембраны ЭПР (y — середина бислоя) с лектиновой головкой в просвете (сверху) */
  const calnexin = (x, y, g = 'cnx') => G(g, `<rect x="${f(x - 4)}" y="${f(y - MH / 2 - 2)}" width="8" height="${f(MH + 4)}" rx="3" fill="${C.chap}"/>` +
    line(x, y - MH / 2 - 2, x, y - MH / 2 - 16, C.chap, 3) + `<path d="M${f(x - 14)},${f(y - MH / 2 - 16)} A14,10 0 0 1 ${f(x + 14)},${f(y - MH / 2 - 16)} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
  /* убиквитин: цепочка из n малых кружков */
  const ub = (x, y, n = 4, dx = 7, g = 'ub') => G(g, Array.from({ length: n }, (_, i) => `<circle cx="${f(x + i * dx)}" cy="${f(y - (i % 2) * 3)}" r="3.4" fill="${C.ub}"/>`).join(''));
  /* протеасома: бочонок в цитозоле */
  const proteasome = (x, y, g = 'prot') => G(g, [0, 1, 2, 3].map(i => `<rect x="${f(x - 16)}" y="${f(y - 20 + i * 10)}" width="32" height="9" rx="4" fill="${i % 3 ? C.protL : C.prot}"/>`).join(''));
  /* канал удаления (ERAD) в мембране ЭПР */
  const eradCh = (x, y, g = 'erad_ch') => G(g, `<rect x="${f(x - 14)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/><rect x="${f(x + 4)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/>`);

  /* ---------- мембранные белки (в бислое) */
  /* однопроходный белок: трансмембранный сегмент в бислое (y — середина), N-домен (глобула) с одной стороны, C-хвост с другой.
     o.inv — обратная ориентация (N-домен в цитозоле, A4); o.col; o.dom — размер домена; o.lig — связан лиганд; o.bad — участок связывания

   «Объяснений» (10: сцены s15_t1…t4). Детали — общий компонент «Дерево» (TRF) и примитивы S4F/POPF; числа — модели TR, HO, AL,
   GT, DM, GEO (эталон models_check.py). Контракт: GN.<сцена>.mk(t) → функции рисования; GN.<сцена>.view(args, t) → SVG 600 × 420.
   Русского текста здесь нет: все подписи — через t(). Под каждым деревом — строка «Длина ветви: …» (AT-11).
   ===================================================================== */
const S15 = (function(){
  const F = S4F, f = F.f, C = TRF.C;
  const T = (x, y, s, o = {}) => F.T(x, y, s, Object.assign({ size: 12 }, o, { size: Math.max(11, o.size || 12) }));
  const LB = (x, y, s, o = {}) => POPF.LB(x, y, s, o);
  const G = (g, s) => (typeof POP_G2T !== 'undefined' && POP_G2T[g]) ? F.G(g, s) : s;
  const head = (s, t) => T(12, 16, s, { a: 'l', size: 13, w: 700, col: C.muted });
  const dec = (x, d) => (+x).toFixed(d).replace('.', ',').replace(/^-/, '−');
  /* доли: две цифры; меньше 0,01 — значащие (07, 3.4: «0,0001») */
  const share = x => x >= .01 || x === 0 ? dec(x, 2) : String(+x.toPrecision(1)).replace('.', ',');
  const treeT = (t, mode, extra) => Object.assign({ out: t('tr_out'), cap: t('tr_len_' + mode), spec: t('tr_spec'), dup: t('tr_dup'), loss: t('tr_loss'),
    ring: t('tr_ring'), rot: t('tr_rot'), root: t('tr_rootspot'), scale: mode === 'time' ? t('tr_scale_time') : t('tr_scale_subst') }, extra || {});

        cols.forEach((c, j) => { const v = c === 'Р' ? 0 : CH[k][c], hlr = o.stg === 3 && (k === 'п1' || k === 'п2') && v === 1;

/* ---------------------------------------------------------------- вкладка 4 «Виды и видообразование» (модели DM, GEO; EVO_визуальный_словарь, разд. 7) */

    (document.body || document.documentElement).insertAdjacentHTML('afterbegin', `<svg id="dmDefs" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden"><defs>` +

  /* значок особи с двумя локусами: верхняя половина — A/a, нижняя — B/b (штриховка); каждая половина — два аллеля (слева, справа) */
  function ind(x, y, r, g, o = {}){

    const al = [g[0], g[1], g[2], g[3]], fill = (ch, low) => low ? (ch === 'B' ? 'url(#dmHA)' : 'url(#dmHa)') : (ch === 'A' ? A : a);

    s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="none" stroke="${o.bad ? C.bad : '#1B2631'}" stroke-width="${o.bad ? 2.6 : 1}"/><line x1="${f(x - r)}" y1="${f(y)}" x2="${f(x + r)}" y2="${f(y)}" stroke="#fff" stroke-width="1"/><line x1="${f(x)}" y1="${f(y - r)}" x2="${f(x)}" y2="${f(y + r)}" stroke="#fff" stroke-width=".8"/>`;
    if (o.lab !== false) s += T(x, y + r + 11, g, { size: 11.5, w: 800, col: o.bad ? C.bad : C.ink });
    return `<g><title>${g}</title>${s}</g>`;
  }
  return { ind, mount, A, a };
})();
