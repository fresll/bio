яние признака предковое."],"mechanism":["[[T24|Корень]] — самый древний узел дерева. [[T25|Некорневое дерево]] показывает отношения линий, но не направление времени. [[T15|Внешняя группа]] — линия вне изучаемой группы, связанная с ней более древним предком; корень ставят на ветвь между ней и изучаемой группой. Перенос корня на другую ветвь сохраняет некорневое дерево, но меняет клады — то есть гипотезу о родстве. По внешней группе определяют и [[T31|предковое состояние]] признака: состояние у внешней группы считают предковым, другое — производным. Клады выделяют по [[T30|общим производным признакам]]; общие предковые состояния и признаки одного вида порядка ветвлений не показывают."],"paragraphs":["Пример: признак есть у К, Л и М, а у Н и внешней группы его нет — К, Л и М объединяет общее производное состояние; если у Л, М и Н нет признака, который есть только у К, это общее предковое состояние, и оно не объединяет Л, М и Н. Без внешней группы или иного допущения (например, о равномерных часах) корень не определён: у некорневого дерева из пяти видов семь возможных мест для корня.","<b>На практикуме.<\/b> Вкладка 2, шаги 2.3 и 2.5.","<b>Ограничения.<\/b> Неверно выбранная или слишком далёкая внешняя группа, а также сильно различающиеся скорости замен могут исказить положение корня."],"conditions":"Расчёт по модели · признаки и виды условны.","sources":["src_01","src_02"],"base":"БИО-15·10; вспомнить [[seminar-14-route.html#uneven-clock|семинар 14: «Почему часы идут неравномерно»]]","quiz":{"id":"S15-L11","question":"У Л, М и Н нет признака, который есть только у К. Объединяет ли это Л, М и Н?","options":[{"id":"S15-L11-1","text":"Да: у них общее отсутствие признака","correct":false,"feedback":"Отсутствие, как у внешней группы, — предковое состояние; оно не показывает родства"},{"id":"S15-L11-2","text":"Нет: это общее предковое состояние","correct":true,"feedback":"Кладу выделяют по общим производным состояниям"},{"id":"S15-L11-3","text":"Да, если их больше, чем видов с признаком","correct":false,"feedback":"Число видов не важно: важно, какое состояние предковое"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как корень и внешняя группа задают направление и клады?","status":"Расчёт по модели · признаки и виды условны","modes_label":"Корень","modes":["корень на Р","корень на М","без внешней группы","сборка по признакам"],"args":[{"panel":"tree","root":"Р"},{"panel":"tree","root":"М"},{"panel":"tree","outgroup":false},{"panel":"build"}],"notes":["Клады: К+Л; Н+П; К+Л+М; К+Л+М+Н+П","Клады: К+Л; Н+П; Н+П+Р; К+Л+Н+П+Р — гипотеза изменилась","Некорневое дерево: корень по этим данным не определён","(((К,Л),М),Н) — 5 изменений; любое другое — 6 и больше"],"static":["Дерево с корнем на ветви Р и на ветви М; некорневое дерево; таблица признаков и собранное дерево"],"scene":"s15_t2","L":{"t2_a_head":"Дерево пяти видов с внешней группой Р (условно)","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","t2_a_head_in":"Некорневое дерево пяти видов: внешней группы нет","t2_b_head":"Признаки п1–п5 видов К, Л, М, Н и внешней группы Р (условно)","t2_b_score":"Изменений на дереве: {n}","t2_b_count":"4 вида — 15 возможных корневых деревьев"}},"zoomNarrow":true},"exam_quiz":{"id":"S15-E04","question":"Зачем нужна внешняя группа?","options":[{"id":"S15-E04-1","text":"Чтобы поставить корень","correct":true,"feedback":"И определить предковые состояния"},{"id":"S15-E04-2","text":"Чтобы увеличить поддержку","correct":false,"feedback":"Внешняя группа нужна для направления, а не для поддержки"},{"id":"S15-E04-3","text":"Чтобы выровнять последовательности","correct":false,"feedback":"Выравнивание делают и без неё"}]}},{"id":"branch-length","num":12,"section":1,"questions":[2],"title":"Длина ветви: ничего, замены или время","keywords":["Кладограмма","Филограмма","Длина ветви","Хронограмма"],"lead":["Одну топологию рисуют тремя способами, и смысл длины ветви задаёт только подпись под деревом."],"mechanism":["На [[T27|кладограмме]] длина ветви ничего не означает. На [[T28|филограмме]] [[T26|длина ветви]] пропорциональна числу замен на сайт (сайт — одна позиция выравнивания) вдоль ветви; кончики могут оказаться на разном расстоянии от корня, потому что скорость замен в линиях разная. На [[T29|хронограмме]] длина ветви — время; все современные кончики на одном расстоянии от корня. Переход от замен ко времени требует калибровки и модели часов."],"paragraphs":["Длинная ветвь на филограмме означает много замен в этой линии, а не большой возраст вида: у двух сестринских видов общий предок один, и разделились они одновременно.","<b>На практикуме.<\/b> Вкладка 2, шаг 2.4: при переключении режимов топология не меняется.","<b>Ограничения.<\/b> На хронограмме внутренние узлы — оценки с интервалом, а не точные даты."],"conditions":"Схема качественная · длины ветвей условны.","sources":["src_01","src_11"],"base":"БИО-15·10; вспомнить [[seminar-14-route.html#accumulation|семинар 14: «Различия накапливаются со временем»]]","quiz":{"id":"S15-L12","question":"На хронограмме все кончики на одном расстоянии от корня. Почему?","options":[{"id":"S15-L12-1","text":"Все виды накопили одинаковое число замен","correct":false,"feedback":"Это хронограмма, а не филограмма: замены здесь не показаны"},{"id":"S15-L12-2","text":"Длина ветви на этом рисунке ничего не означает","correct":false,"feedback":"Так на кладограмме; на хронограмме длина — время"},{"id":"S15-L12-3","text":"Все современные линии прошли от корня одно время","correct":true,"feedback":"Длина здесь — время"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что означает длина ветви?","status":"Схема качественная · длины ветвей условны","modes_label":"Длина ветви","modes":["кладограмма","филограмма","хронограмма"],"args":[{"panel":"tree","len":"none"},{"panel":"tree","len":"subst"},{"panel":"tree","len":"time"}],"notes":["Длины ничего не означают","От корня до кончиков 0,15–0,19 замены на сайт","До каждого кончика 12 млн лет"],"static":["Одна топология в трёх режимах длины ветви с подписью смысла длины"],"scene":"s15_t2","L":{"t2_a_head":"Дерево пяти видов с внешней группой Р (условно)","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","tr_len_subst":"Длина ветви: замены на сайт","tr_len_time":"Длина ветви: время, млн лет","tr_scale_time":"2 млн лет"}}},"exam_quiz":{"id":"S15-E05","question":"Что означает длина ветви на филограмме?","options":[{"id":"S15-E05-1","text":"Возраст современного вида","correct":false,"feedback":"Кончики — современные виды; возраст по длине не читают"},{"id":"S15-E05-2","text":"Число замен на сайт","correct":true,"feedback":"На хронограмме — время"},{"id":"S15-E05-3","text":"Ничего не означает","correct":false,"feedback":"Так на кладограмме"}]}},{"id":"support","num":13,"section":1,"questions":[2],"title":"Поддержка ветви и неопределённость","keywords":["Бутстрэп-поддержка","Политомия","Притяжение длинных ветвей"],"lead":["Одни и те же данные совместимы с несколькими близкими деревьями, поэтому у ветвей указывают поддержку — и её тоже нужно читать правильно."],"mechanism":["При [[T32|бутстрэп-анализе]] столбцы выравнивания многократно отбирают случайно с возвращением, по каждой псевдовыборке заново строят дерево и считают, в какой доле деревьев есть клада. Поддержка 90 % значит, что клада воспроизвелась в 90 % таких деревьев. Это устойчивость к случайной выборке данных, а не вероятность того, что клада истинна. [[T33|Политомия]] — узел с тремя и более ветвями; обычно она означает, что данных для порядка ветвлений не хватает, реже — что линии разошлись почти одновременно; по рисунку эти случаи не различить. [[T34|Притяжение длинных ветвей]] — систематическая ошибка: быстро изменяющиеся линии ошибочно объединяются из-за параллельных и обратных замен, не учтённых моделью."],"paragraphs":["Бутстрэп не учитывает ошибок в выборе генов, видов, выравнивания и модели: систематически неверное дерево может иметь высокую поддержку. Надёжность оценивают по нескольким признакам: устойчивость топологии при смене модели и состава выборки, согласие независимых генов, отсутствие артефактов выравнивания, соответствие другим данным. Число возможных деревьев быстро растёт с числом видов (БИО-15·15), поэтому дерево ищут вычислительными методами, а не перебором.","<b>На практикуме.<\/b> Вкладка 2, шаг 2.6.","<b>Ограничения.<\/b> Порог надёжной поддержки условен и зависит от метода."],"conditions":"Схема качественная · псевдовыборки и проценты условны.","sources":["src_01","src_03"],"base":"БИО-15·11","quiz":{"id":"S15-L13","question":"Поддержка клады — 98 %. Может ли клада быть неверной?","options":[{"id":"S15-L13-1","text":"Может, если в данных есть систематическая ошибка","correct":true,"feedback":"Бутстрэп оценивает только случайную изменчивость выборки"},{"id":"S15-L13-2","text":"Нет: 98 % — почти полная уверенность","correct":false,"feedback":"Это доля повторов анализа, а не вероятность истинности"},{"id":"S15-L13-3","text":"Нет, если выравнивание длинное и чистое","correct":false,"feedback":"Длинное выравнивание уменьшает случайную ошибку, но не систематическую"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что показывает бутстрэп и чего не показывает?","status":"Схема качественная · псевдовыборки и проценты условны","modes_label":"Что показываем","modes":["псевдовыборки","поддержка","политомия","длинные ветви"],"args":[{"v":"resample"},{"v":"support"},{"v":"polytomy"},{"v":"lba"}],"notes":["Столбцы отбирают случайно с возвращением","Доля деревьев с кладой — поддержка","Порядок ветвлений не определён","Быстрые линии ошибочно объединяются"],"static":["Выравнивание, три псевдовыборки и три дерева; узел-политомия; две длинные ветви, ошибочно объединённые"],"scene":"s15_r_bootstrap","L":{"t2_bs_head_resample":"Бутстрэп: столбцы выравнивания отбирают случайно с возвращением","t2_bs_aln":"столбцы выравнивания 1–6","t2_bs_with":"выбор с возвращением: столбец может попасть в псевдовыборку несколько раз или не попасть","t2_bs_root":"деревья укоренены по внешней группе Р (на рисунке не показана)","t2_bs_ps":"псевдовыборка {i}","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","t2_bs_yes":"К+Л+М есть","t2_bs_no":"К+Л+М нет","t2_bs_head_support":"Поддержка: доля деревьев псевдовыборок с кладой К+Л+М","t2_bs_res":"Клада К+Л+М есть в 2 из 3 псевдовыборок; при 100 псевдовыборках — в 62 (условно)","t2_bs_head_polytomy":"Политомия: порядок ветвлений не определён","t2_bs_poly":"Узел с тремя ветвями: данных для порядка ветвлений не хватает","t2_bs_head_lba":"Длинные ветви: быстрые линии ошибочно объединяются","t2_bs_true":"истинное дерево","t2_bs_false":"реконструкция: ложное объединение","tr_len_subst":"Длина ветви: замены на сайт","t2_bs_lba":"Быстрые линии Л и Н ошибочно объединяются: систематическая ошибка, которую высокая поддержка не исключает"}},"zoomNarrow":true},"exam_quiz":{"id":"S15-E06","question":"Что показывает бутстрэп-поддержка?","options":[{"id":"S15-E06-1","text":"Вероятность истинности клады","correct":false,"feedback":"Это не вероятность истинности"},{"id":"S15-E06-2","text":"Долю генов с кладой","correct":false,"feedback":"Это другая величина — доля совпадающих деревьев"},{"id":"S15-E06-3","text":"Устойчивость клады к выборке данных","correct":true,"feedback":"Долю повторов анализа с этой кладой"}]}},{"id":"concordance","num":14,"section":1,"questions":[2],"title":"Поддержка 1,0 и доля согласных генов","keywords":["Доля совпадающих деревьев (фактор согласованности)"],"lead":["Ветвь дерева может иметь максимальную поддержку, хотя её подтверждает лишь малая доля деревьев отдельных генов."],"mechanism":["По геномам 363 видов птиц построено дерево; шесть крупных групп имеют максимальную поддержку — апостериорная вероятность 1,0. Для каждой группы посчитали ещё [[T35|долю совпадающих деревьев]] — долю деревьев отдельных генов, в которых эта группа есть. У древненёбных птиц (страусы, нанду, тинаму и родственники) она 100 %, а у новой группы Elementaves — 0,1 %: группа есть целиком лишь в 43 деревьях из 63 000. Если же для Elementaves смотреть на четвёрки видов, порядок ветвления совпадает с деревом видов в 33,9 % случаев — около нижнего предела в 1/3, который даёт неполная сортировка при очень короткой ветви. Поддержка растёт с объёмом данных: уже при 200 генах у 86,7 % ветвей (животные) и 94,3 % (растения) бутстрэп выше 95 %. Доля совпадающих деревьев не растёт: она определяется историей видов — длиной ветви и численностью предков."],"paragraphs":["Почему 0,1 % настолько меньше 33,9 %: соседние ветви тоже очень короткие, и в большинстве деревьев генов подгруппы Elementaves сами не собраны вместе, а ошибки построения деревьев отдельных генов это усиливают. Малая доля согласных генов не значит, что группы нет: при быстром ветвлении большинство генов сохраняет историю, отличную от дерева видов. Значит, дерево видов может быть надёжным, но мало предсказывать историю отдельного гена или признака.","<b>Как это узнали.<\/b> Для тысяч участков генома построили отдельные деревья и посчитали, в какой доле есть каждая группа дерева видов.","<b>Граница вывода.<\/b> Доля совпадающих деревьев не показывает, какая часть несовпадений вызвана неполной сортировкой, обменом генами или ошибками построения.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 2."],"conditions":"Схема по данным работы, упрощённая · доли измерены; кривая — расчёт по формуле.","sources":["src_02"],"base":"БИО-15·13","level":"adv","next_base":"gene-species-tree","quiz":{"id":"S15-L14","question":"Почему с ростом числа генов поддержка растёт, а доля совпадающих деревьев — нет?","options":[{"id":"S15-L14-1","text":"Новые гены добавляют несовпадения","correct":false,"feedback":"Гены не добавляют несовпадений: они точнее показывают их долю"},{"id":"S15-L14-2","text":"Доля — свойство истории видов","correct":true,"feedback":"Больше генов — точнее её оценка, но не больше сама доля"},{"id":"S15-L14-3","text":"Поддержку завышают ошибки выравнивания","correct":false,"feedback":"Поддержка растёт закономерно: случайная ошибка выборки уменьшается"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем поддержка отличается от доли согласных генов?","status":"Схема по данным работы, упрощённая · доли измерены; кривая — расчёт по формуле","modes_label":"Группа","modes":["древненёбные","Elementaves","кривая","больше данных"],"args":[{"clade":"palaeo"},{"clade":"element"},{"panel":"curve"},{"panel":"data"}],"notes":["Поддержка 1,0; доля согласных генов 100 %","Поддержка 1,0; группа целиком — 0,1 %, по четвёркам — 33,9 %","Короткая ветвь опускает долю к 1/3; ниже — из-за распада подгрупп в деревьях генов","При 200 генах бутстрэп выше 95 % у 86,7 % и 94,3 % ветвей"],"static":["Два столбика поддержки и доли согласных генов для двух групп птиц; кривая доли от длины ветви"],"scene":"s15_a2","L":{"a2_p1_t":"Три величины","a2_p1_q2":"древненёбные птицы (страусы, нанду, тинаму и другие)","a2_p1_q4":"поддержка","a2_p1_q5":"доля деревьев генов, где группа есть целиком","a2_p1_q7":"доля четвёрок видов, где порядок ветвления как в дереве видов","a2_p1_q3":"новая группа Elementaves","a2_p1_q6":"группа есть в 43 из 63 000 деревьев генов","a2_p2_t":"Почему так бывает","a2_ax_x":"T — длина внутренней ветви, единицы 2Ne поколений (логарифмическая шкала)","a2_ax_y":"доля совпадающих деревьев","a2_p2_q1":"Elementaves, четвёрки видов — 33,9 %","a2_p2_q2":"расчёт по формуле; у самых коротких ветвей дерева птиц около 0,01 таких единиц, у самых длинных — 8,71; по трём видам доля не бывает меньше примерно 1/3","a2_p3_t":"Больше данных","a2_pts_m":"животные: доля ветвей с бутстрэп-поддержкой выше 95 % при 200 генах","a2_pts_p":"растения: доля ветвей с бутстрэп-поддержкой выше 95 % при 200 генах","a2_p3_q1":"поддержка растёт с объёмом данных, доля совпадающих деревьев — нет"}}},"adv_kind":"Новые данные"},{"id":"tree-count","num":15,"section":1,"questions":[2],"title":"Сколько возможно деревьев","keywords":[],"lead":["Даже для десятка видов возможных деревьев больше, чем секунд в году."],"mechanism":["Для трёх видов существует 3 корневых бинарных дерева, для четырёх — 15, для пяти — 105, для шести — 945, для десяти — 34 459 425, для двадцати — около 8,2·10²¹. Каждый новый вид можно присоединить к любой ветви уже существующего дерева, поэтому число деревьев для n видов равно произведению нечётных чисел от 1 до 2n − 3. Перебрать все деревья можно лишь для немногих видов; для больших наборов дерево ищут вычислительными методами, проверяя не все варианты."],"paragraphs":["Модель объясняет, почему поиск лучшего дерева — отдельная задача и почему разные программы могут прийти к разным деревьям при одних данных.","<b>Граница вывода.<\/b> Это число бинарных деревьев; модель ничего не говорит о том, какие из них лучше объясняют данные.","<b>На практикуме.<\/b> Вкладка 2, шаг 2.5: для четырёх видов — 15 деревьев."],"conditions":"Расчёт по модели · точные значения.","sources":["src_01"],"base":"БИО-15·11, БИО-15·13","level":"adv","next_base":"gene-species-tree","quiz":{"id":"S15-L15","question":"Сколько корневых бинарных деревьев для пяти видов?","options":[{"id":"S15-L15-1","text":"15","correct":false,"feedback":"15 — для четырёх видов"},{"id":"S15-L15-2","text":"120","correct":false,"feedback":"120 — число перестановок пяти видов; деревьев меньше: поворот ветвей не даёт нового дерева"},{"id":"S15-L15-3","text":"105","correct":true,"feedback":"1 · 3 · 5 · 7 = 105"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько возможно деревьев?","status":"Расчёт по модели · точные значения","modes_label":"Число видов","modes":["3 вида","4 вида","5 видов","10 и 20 видов"],"args":[{"n":3},{"n":4},{"n":5},{"n":[10,20]}],"notes":["3 дерева","15 деревьев","105 деревьев","10 видов — 34 459 425; 20 — около 8,2·10²¹"],"static":["Все три дерева трёх видов; 15 деревьев четырёх видов мелко; число для 5, 10 и 20 видов"],"scene":"s15_r_treecount","L":{"r15_tc_h":"Сколько возможно корневых деревьев","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_tc_n3":"3 вида — 3 корневых дерева","r15_tc_s4":"4 вида","r15_tc_n":"{s} — {n} корневых деревьев","r15_tc_add":"присоединение нового вида к каждой ветви (кружки — 5 мест)","r15_tc_mult":"3 × 5 = 15; 15 × 7 = 105","r15_tc_s5":"5 видов","r15_tc_rule":"все корневые деревья: каждый новый вид можно присоединить к любой ветви","r15_tc_x":"число видов","r15_tc_y":"число корневых деревьев (логарифмическая шкала)","r15_tc_s10":"10 видов","r15_tc_20":"20 видов — около 8,2·10²¹"}},"zoomNarrow":true},"adv_kind":"Исследование модели"},{"id":"gene-species-tree","num":16,"section":2,"questions":[3],"title":"Дерево гена и дерево видов","keywords":["Дерево гена","Дерево видов","Паралоги","Неполная сортировка линий","Интрогрессия","Горизонтальный перенос генов"],"lead":["Дерево одного участка генома описывает историю его копий; дерево видов — историю разделения популяций. Они не обязаны совпадать."],"mechanism":["[[T08|Дерево гена]] строят по последовательностям одного участка; [[T36|дерево видов]] описывает порядок разделения популяций и видов. Причины несовпадения разные: дупликации и потери копий (если сохранились разные [[T06|паралоги]], их дерево легко принять за дерево видов); [[T38|неполная сортировка линий]]; [[T41|интрогрессия]] через гибридизацию; [[T44|горизонтальный перенос генов]] вне размножения, особенно у бактерий и архей; рекомбинация внутри участка и ошибки построения деревьев."],"paragraphs":["Одно несовпадение может иметь любую из этих причин и само по себе не доказывает ни интрогрессии, ни ошибки. Даже при надёжном дереве видов большинство деревьев генов может иметь другую топологию: по модели при внутренней ветви 0,1 единицы 2Ne поколений не совпадают 60 % деревьев (БИО-15·17; пример с птицами — БИО-15·14, сверх программы). Поэтому дерево видов оценивают по многим участкам генома и явно моделируют процессы, порождающие несовпадения.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.1; «Найти причину» III.","<b>Ограничения.<\/b> Деление на «дерево гена» и «дерево видов» удобно, но при обмене генами история генома в целом — уже не одно дерево (БИО-15·20)."],"conditions":"Схема качественная · четыре условные причины.","sources":["src_01","src_02","src_03"],"base":"БИО-15·3, БИО-15·13; вспомнить [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]]","quiz":{"id":"S15-L16","question":"Дерево одного гена объединяет Л и М, а виды-сёстры — К и Л. Что можно сказать по одному этому дереву?","options":[{"id":"S15-L16-1","text":"Причину по одному дереву не назвать","correct":true,"feedback":"Так могут проявиться дупликация и потеря, неполная сортировка, интрогрессия или перенос"},{"id":"S15-L16-2","text":"Произошла интрогрессия между Л и М","correct":false,"feedback":"Интрогрессия — одна из нескольких причин; нужны данные по многим участкам"},{"id":"S15-L16-3","text":"Дерево видов неверно","correct":false,"feedback":"Одно дерево гена не опровергает дерева видов"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему дерево гена может не совпадать с деревом видов?","status":"Схема качественная · четыре условные причины","modes_label":"Причина","modes":["дупликация и потеря","неполная сортировка","интрогрессия","перенос"],"args":[{"c":"dl"},{"c":"ils"},{"c":"intro"},{"c":"hgt"}],"notes":["Сохранились разные копии: дерево паралогов","Линии слились глубже предка К и Л","Участок перешёл через гибридов","Ген перешёл вне размножения"],"static":["Четыре панели: дерево видов ((К,Л),М) и дерево гена (Л,М), разные причины несовпадения"],"scene":"s15_r_causes","L":{"r15_cs_h_dl":"Дупликация и потеря","tr_len_none":"Длина ветви: ничего не означает","tr_out":"внешняя группа","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_cs_dl":"Сохранились разные копии после дупликации (квадрат) и утрат (крест): дерево сравниваемых генов — дерево паралогов","r15_cs_h_ils":"Неполная сортировка","tr_net":"гибридизация","tr_coal":"слияние двух линий копий","tr_past":"прошлое","tr_now":"сейчас","t3_len_cap":"Длина ветви: время, поколения (условно)","r15_cs_ils":"Линии слились глубже предка К и Л","r15_cs_h_intro":"Интрогрессия","r15_cs_intro":"Участок перешёл через гибридов (перемычка — гибридизация)","r15_cs_h_hgt":"Горизонтальный перенос","r15_cs_donor":"донор","r15_cs_hgt":"Ген перешёл вне размножения (стрелка — перенос)"}},"zoomNarrow":true}},{"id":"ils","num":17,"section":2,"questions":[3],"title":"Неполная сортировка линий","keywords":["Коалесценция","Эффективная численность (Ne)","Неполная сортировка линий","Предковый полиморфизм"],"lead":["Копии гена в популяции имеют общих предков в прошлом; если между двумя разделениями видов они не успели слиться в одну линию, порядок их слияния оказывается случайным."],"mechanism":["Если проследить две копии гена назад, рано или поздно они сходятся к одной копии-предку — это [[T37|коалесценция]] (слияние генных линий). В популяции с [[T40|эффективной численностью]] Ne две копии сливаются в среднем за 2Ne поколений. Пусть виды К и Л разделились недавно, а М — раньше, и между двумя разделениями прошло t поколений. Если за эти t поколений линии К и Л не слились, все три линии доходят до общего предка трёх видов, где первыми сливаются любые две из трёх с равной вероятностью. Тогда дерево участка может не совпасть с деревом видов, и чем больше t по сравнению с 2Ne, тем реже это случается. Это и есть [[T38|неполная сортировка линий]] — следствие сохранения [[T39|предкового полиморфизма]] через последовательные разделения популяций."],"paragraphs":[{"details":"Формула и расчёт","text":"При этом дерево участка совпадает с деревом видов с вероятностью 1 − (2/3)·e^(−T), а каждое из двух несовпадающих деревьев встречается с вероятностью (1/3)·e^(−T); здесь T = t/(2Ne), e — основание натуральных логарифмов."},"Неполная сортировка — не ошибка метода, а ожидаемое свойство генеалогий. Она часта, когда разделения видов шли быстро одно за другим (малое t) или предковые популяции были велики (большое Ne). Расчёт по модели: при t = 10 000 поколений и Ne = 10 000 (T = t/(2Ne) = 0,5) несовпадающих деревьев 40 %; при t = 160 000 (T = 8) — 0,02 %; при t = 40 000 и Ne = 50 000 (T = 0,4) — 45 %. У человека, шимпанзе и гориллы деревья заметной части генома не совпадают с деревом видов: разделения этих линий разделяет короткий промежуток при большой численности предков.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.2–3.4.","<b>Ограничения.<\/b> Формула — для трёх видов, одной копии от каждого и постоянной численности; рекомбинация внутри участка и отбор не учтены."],"conditions":"Расчёт по модели · t и Ne условны.","sources":["src_01","src_02","src_05"],"base":"БИО-15·16; вспомнить [[seminar-13-route.html#drift|семинар 13: «Генетический дрейф: случайная выборка копий»]] и [[seminar-13-route.html#census-effective|семинар 13: «Фактическая и эффективная численность»]]","quiz":{"id":"S15-L17","question":"При какой истории неполная сортировка наиболее часта?","options":[{"id":"S15-L17-1","text":"Медленные разделения при малой численности","correct":false,"feedback":"Тогда T велико: линии успевают слиться, деревья совпадают"},{"id":"S15-L17-2","text":"Быстрые разделения при большой численности предков","correct":true,"feedback":"T = t/(2Ne) мало, линии не успевают слиться"},{"id":"S15-L17-3","text":"Любая: от времени она не зависит","correct":false,"feedback":"Доля несовпадений быстро падает с ростом t"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как длина ветви и численность определяют долю несовпадений?","status":"Расчёт по модели · число поколений и численность условны","modes_label":"Условия","modes":["t 10 000","t 40 000","t 160 000","Ne 50 000"],"args":[{"t":10000,"Ne":10000},{"t":40000,"Ne":10000},{"t":160000,"Ne":10000},{"t":40000,"Ne":50000}],"notes":["T = 0,5: не совпадают 40 %","T = 2: не совпадают 9 %","T = 8: не совпадают 0,02 %","T = 0,4: не совпадают 45 %"],"static":["Трубки видов с линиями гена и столбики долей трёх типов деревьев для четырёх сочетаний t и Ne"],"scene":"s15_t3","L":{"t3_pA":"А","t3_a_head":"Дерево видов и линии гена: t = {t}, Ne = {ne}","t3_mode_ils":"неполная сортировка","tr_net":"гибридизация","tr_coal":"слияние двух линий копий","tr_past":"прошлое","tr_now":"сейчас","t3_len_cap":"Длина ветви: время, поколения (условно)","t3_pB":"Б","t3_b_head":"Доли деревьев локусов (модель)","t3_bar_KL":"совпадает: (К, Л)","t3_bar_LM":"не совпадает: (Л, М)","t3_bar_KM":"не совпадает: (К, М)","t3_icons":"100 участков, повтор {r}: круг (К, Л), ромб (Л, М), треугольник (К, М)","t3_icons_n":"{a} / {b} / {c}"}}},"exam_quiz":{"id":"S15-E07","question":"Что такое неполная сортировка линий?","options":[{"id":"S15-E07-1","text":"Сохранение предкового полиморфизма","correct":true,"feedback":"Поэтому деревья генов могут не совпадать с деревом видов"},{"id":"S15-E07-2","text":"Ошибка построения дерева гена","correct":false,"feedback":"Это не ошибка, а свойство генеалогий"},{"id":"S15-E07-3","text":"Перенос генов между видами через гибридов","correct":false,"feedback":"Это интрогрессия или горизонтальный перенос"}]}},{"id":"introgression","num":18,"section":2,"questions":[3],"title":"Интрогрессия","keywords":["Интрогрессия","Гибридизация","Возвратное скрещивание","Рекомбинация"],"lead":["Участок генома одного вида может войти в генофонд другого через гибридов и их дальнейшее размножение."],"mechanism":["[[T41|Интрогрессия]] — включение наследственного материала одной линии в генофонд другой через [[T42|гибридизацию]] и последующие [[T43|возвратные скрещивания]] гибридов с одним из родительских видов. В каждом поколении [[T47|рекомбинация]] разбивает участки, полученные от другого вида, на всё более короткие фрагменты; отбор и дрейф меняют их частоту. У перенесённого участка дерево объединяет вид-получатель с видом-донором: история участка повторяет путь обмена, а не порядок разделения видов."],"paragraphs":["Интрогрессия может переносить полезные варианты (адаптивная интрогрессия, БИО-15·21), а может вносить варианты, снижающие приспособленность гибридов, — их удаляет отбор (БИО-15·22). Гибридизация распространена у растений и встречается у многих животных; у человека известна интрогрессия от неандертальцев и денисовцев ([[seminar-16-route.html#admixture|семинар 16: «Смешение и интрогрессия»]]).","<b>На практикуме.<\/b> Вкладка 3, шаг 3.5.","<b>Ограничения.<\/b> В модели практикума обмен один и в одну сторону, а перенесённые участки всегда имеют дерево получателя с донором — это упрощение."],"conditions":"Схема качественная · доля обмена условна.","sources":["src_01","src_05","src_08"],"base":"БИО-15·16; вспомнить [[seminar-13-route.html#sources|семинар 13: «Мутации, рекомбинация и поток генов: источники и переносчики изменчивости»]]","quiz":{"id":"S15-L18","question":"Чем интрогрессия отличается от гибридизации?","options":[{"id":"S15-L18-1","text":"Это одно и то же: оба слова означают скрещивание видов","correct":false,"feedback":"Гибридизация — скрещивание; интрогрессия — закрепление перенесённых участков в генофонде вида"},{"id":"S15-L18-2","text":"Интрогрессия идёт без скрещивания, как горизонтальный перенос","correct":false,"feedback":"Без скрещивания идёт горизонтальный перенос; интрогрессия идёт через гибридов и возвратные скрещивания"},{"id":"S15-L18-3","text":"Гибридизация — событие, интрогрессия — её след в генофонде","correct":true,"feedback":"Интрогрессия — возможное следствие гибридизации через многие поколения; гибридизация не всегда к ней ведёт"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как участок переходит из вида в вид?","status":"Схема качественная · поколения условны","modes_label":"Этап","modes":["гибрид","возвратные скрещивания","дробление участков","дерево участка"],"args":[{"g":"F1"},{"g":"bc"},{"g":"gen20"},{"g":"tree"}],"notes":["У гибрида по половине генома от каждого вида","Возвратные скрещивания уменьшают долю донора","Рекомбинация дробит участки донора","Дерево перенесённого участка объединяет Л с М"],"static":["Хромосомы гибрида и его потомков с убывающими и дробящимися участками донора; дерево перенесённого участка"],"scene":"s15_r_introgression","L":{"r15_in_h_F1":"Гибрид","r15_in_L":"хромосома от Л","r15_in_M":"хромосома от М","r15_in_half":"у гибрида по половине генома от каждого вида","r15_in_legL":"вид-получатель Л","r15_in_legM":"участок донора М","r15_in_h_bc":"Возвратные скрещивания","r15_in_bc1":"после 1-го возвратного","r15_in_bc2":"после 2-го возвратного","r15_in_h_gen20":"Дробление участков","r15_in_g20":"через 20 поколений","r15_in_h_tree":"Дерево участка","tr_len_none":"Длина ветви: ничего не означает","tr_out":"внешняя группа","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_in_treecap":"дерево участка (Л, М)"}},"zoomNarrow":true},"exam_quiz":{"id":"S15-E08","question":"Что такое интрогрессия?","options":[{"id":"S15-E08-1","text":"Скрещивание особей двух разных видов","correct":false,"feedback":"Это гибридизация; интрогрессия — её возможное следствие"},{"id":"S15-E08-2","text":"Включение чужих участков в генофонд вида","correct":true,"feedback":"Через гибриды и возвратные скрещивания"},{"id":"S15-E08-3","text":"Удвоение гена в одной линии","correct":false,"feedback":"Это дупликация"}]}},{"id":"ils-vs-introgression","num":19,"section":2,"questions":[3],"title":"Как различают неполную сортировку и интрогрессию","keywords":["Неполная сортировка линий","Интрогрессия"],"lead":["Обе причины дают несовпадающие деревья, но по-разному: неполная сортировка — два несовпадающих типа поровну, интрогрессия — избыток одного."],"mechanism":["При одной [[T38|неполной сортировке]] два несовпадающих типа деревьев трёх видов — (Л, М) и (К, М) — равновероятны. [[T41|Интрогрессия]] из М в Л добавляет деревья (Л, М); доли двух других типов при этом немного уменьшаются. Поэтому по многим участкам генома сравнивают доли двух несовпадающих типов: равные доли совместимы с неполной сортировкой, избыток одного типа указывает на обмен генами между соответствующими видами. Расчёт по модели (t = 40 000 поколений, Ne = 10 000, доля обмена 0,1): без обмена — 91 % совпадающих, по 4,5 % каждого несовпадающего типа; с обменом — 82 %, 14 % и 4 %."],"paragraphs":["Для различения нужно много участков: по 100 участкам случайные колебания легко дают 9 против 6 и без обмена генами. На этой идее основаны методы поиска обмена генами по геномам. Дополнительный признак — длина перенесённых участков: после недавней гибридизации они длинные, со временем рекомбинация дробит их. Избыток одного типа может дать и структура предковых популяций, поэтому вывод об интрогрессии — модельный.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.4–3.6; «Найти причину» III.","<b>Ограничения.<\/b> При очень короткой внутренней ветви почти все деревья и так не совпадают, и избыток одного типа заметить труднее."],"conditions":"Расчёт по модели · 1000 и 100 участков; параметры условны.","sources":["src_02","src_05"],"base":"БИО-15·17, БИО-15·18","quiz":{"id":"S15-L19","question":"По 3000 участкам: (Л, М) — 300, (К, М) — 290. Что вероятнее?","options":[{"id":"S15-L19-1","text":"Одна неполная сортировка","correct":true,"feedback":"Два несовпадающих типа почти поровну"},{"id":"S15-L19-2","text":"Интрогрессия между Л и М","correct":false,"feedback":"Избытка (Л, М) нет: 300 и 290 при 3000 участках практически равны"},{"id":"S15-L19-3","text":"Ошибка дерева видов","correct":false,"feedback":"Совпадающих деревьев большинство; дерево видов этим не опровергается"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются доли несовпадающих деревьев при двух причинах?","status":"Расчёт по модели · доля обмена 0,1 условна","modes_label":"Режим","modes":["без обмена","с обменом","100 участков"],"args":[{"t":40000,"Ne":10000,"gamma":0},{"t":40000,"Ne":10000,"gamma":0.1},{"t":40000,"Ne":10000,"gamma":0.1,"sample":true}],"notes":["0,91 / 0,045 / 0,045 — два несовпадающих типа поровну","0,82 / 0,14 / 0,04 — избыток (Л, М); другие типы немного меньше","100 участков: 85 / 9 / 6 — по малой выборке не различить"],"static":["Столбики долей трёх типов деревьев без обмена и с обменом; ряд из 100 значков участков"],"scene":"s15_t3","L":{"t3_pA":"А","t3_a_head":"Дерево видов и линии гена: t = {t}, Ne = {ne}","t3_mode_ils":"неполная сортировка","tr_net":"гибридизация","tr_coal":"слияние двух линий копий","tr_past":"прошлое","tr_now":"сейчас","t3_len_cap":"Длина ветви: время, поколения (условно)","t3_pB":"Б","t3_b_head":"Доли деревьев локусов (модель)","t3_bar_KL":"совпадает: (К, Л)","t3_bar_LM":"не совпадает: (Л, М)","t3_bar_KM":"не совпадает: (К, М)","t3_icons":"100 участков, повтор {r}: круг (К, Л), ромб (Л, М), треугольник (К, М)","t3_icons_n":"{a} / {b} / {c}","t3_mode_net":"обмен генами из М в Л"}}}},{"id":"tree-or-network","num":20,"section":2,"questions":[3],"title":"Дерево или сеть","keywords":["Филогенетическая сеть"],"lead":["Разделение линий остаётся в основном ветвящимся процессом, но обмен генами добавляет к дереву перемычки."],"mechanism":["Если обмен генами между линиями заметен, историю удобнее изображать [[T45|филогенетической сетью]] — деревом с дополнительными перемычками, по которым часть генома переходила из линии в линию. Слияние линий происходит и при эндосимбиозе (происхождение митохондрий) и при гибридном видообразовании. Но сеть не означает, что реконструкция невозможна: основная часть генома обычно следует дереву видов, а перемычки описывают долю и направление обмена."],"paragraphs":["Надёжный вывод о расхождении линий строят на трёх уровнях: наблюдение (различаются последовательности, деревья участков не совпадают), модельный вывод (вероятно определённое дерево, направление и доля обмена генами), историческое объяснение (предложенная история лучше альтернатив согласует генетические, географические и экологические данные).","<b>На практикуме.<\/b> Вкладка 3, режим обмена генами (перемычка).","<b>Ограничения.<\/b> Чем больше перемычек допускает модель, тем больше данных нужно, чтобы их оценить."],"conditions":"Схема качественная · сеть условна.","sources":["src_01","src_05","src_10"],"base":"БИО-15·18; вспомнить [[seminar-12-route.html#gene-transfer|семинар 12: «Перенос генов в ядро и импорт белков»]]","quiz":{"id":"S15-L20","question":"Есть обмен генами между линиями. Значит ли это, что дерево видов теряет смысл?","options":[{"id":"S15-L20-1","text":"Да: история становится случайной","correct":false,"feedback":"Обмен генами — не случайность; его долю и направление оценивают"},{"id":"S15-L20-2","text":"Нет: его дополняют перемычками обмена","correct":true,"feedback":"Основная часть генома следует дереву, перемычки описывают обмен"},{"id":"S15-L20-3","text":"Да: виды сливаются в один","correct":false,"feedback":"Обмен частью генома не означает слияния видов (БИО-15·31)"}]},"widget":{"kind":"dna","title":"","s":{"title":"Когда историю изображают сетью?","status":"Схема качественная · сеть условна","modes_label":"Изображение","modes":["дерево","сеть с перемычкой","три уровня вывода"],"args":[{"v":"tree"},{"v":"net"},{"v":"levels"}],"notes":["Основная часть генома следует дереву","Перемычка — часть генома перешла из линии в линию","Наблюдение → модельный вывод → историческое объяснение"],"static":["Дерево и то же дерево с одной перемычкой; три уровня вывода"],"scene":"s15_r_network","L":{"r15_nw_h_tree":"Дерево видов","tr_net":"гибридизация","tr_past":"прошлое","tr_now":"сейчас","t3_len_cap":"Длина ветви: время, поколения (условно)","r15_nw_sp":"дерево видов ((К, Л), М)","r15_nw_h_net":"Сеть с перемычкой","r15_nw_bridge":"перемычка: из М в Л, доля участков 0,1 (условно)","r15_nw_h_levels":"Три уровня вывода","r15_nw_obs":"наблюдение","r15_nw_model":"модельный вывод","r15_nw_hist":"историческое объяснение"}}}},{"id":"preference-introgression","num":21,"section":2,"questions":[3],"title":"Ген предпочтения перешёл между видами бабочек","keywords":["Адаптивная интрогрессия"],"lead":["При гибридизации вид может получить от другого не только окраску, но и предпочтение партнёра с такой окраской."],"mechanism":["Три вида бабочек Heliconius: H. timareta по геному ближе к H. cydno, но живёт вместе с H. melpomene и, как она, имеет красный рисунок крыльев (у H. cydno он белый). Красный рисунок H. timareta получила от H. melpomene через [[T46|адаптивную интрогрессию]]. Оказалось, что так же перешёл и участок хромосомы 18 с геном regucalcin1, связанным с предпочтением красных самок. На этом участке дерево объединяет H. timareta с H. melpomene, хотя по геному в целом она ближе к H. cydno. Самцы H. timareta и H. melpomene одинаково предпочитают красных самок (разница долей времени ухаживания 0,025, интервал от −0,039 до 0,087), а по сравнению с H. cydno — на 0,74 и 0,71 сильнее."],"paragraphs":["Из 200 генов участка только у regucalcin1 экспрессия в ткани глаз и мозга различалась во всех сравнениях популяций с разным предпочтением; аллель H. cydno экспрессировался примерно вдвое сильнее. Выключение гена генным редактированием в части клеток у H. melpomene снизило ухаживание за самкой своего вида, но не полёт и питание; предпочтение окраски в этом эксперименте не проверяли. У гибридов участок объясняет лишь часть различия предпочтения между видами.","<b>Как это узнали.<\/b> Предпочтение измерили в экспериментах с выбором самок; участок нашли у гибридов; перенос между видами показали по геномам популяций; ген выделили по экспрессии и проверили выключением у H. melpomene.","<b>Граница вывода.<\/b> Механизм действия гена неизвестен; выключение было мозаичным и у части особей ухудшило выживаемость и полёт; другие гены тоже вносят вклад. Это бабочки: на других животных вывод не переносят.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 3."],"conditions":"Схема по данным работы, упрощённая · разницы долей измерены с 95 % интервалами.","sources":["src_07"],"base":"БИО-15·18, БИО-15·19","level":"adv","next_base":"why-species","quiz":{"id":"S15-L21","question":"Почему дерево участка regucalcin1 не совпадает с деревом видов?","options":[{"id":"S15-L21-1","text":"Неполная сортировка линий в предках бабочек","correct":false,"feedback":"Несовпадение именно на участке, связанном с признаком, и признак общий — так проявляется интрогрессия"},{"id":"S15-L21-2","text":"Ошибка выравнивания участка хромосомы 18","correct":false,"feedback":"Несовпадение повторяется в разных популяциях и совпадает с участком, связанным с поведением"},{"id":"S15-L21-3","text":"Участок перешёл от H. melpomene","correct":true,"feedback":"Его история повторяет путь обмена"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как ген предпочтения перешёл между видами?","status":"Схема по данным работы, упрощённая · разницы долей измерены с 95 % интервалами","modes_label":"Что показываем","modes":["геном в целом","участок regucalcin1","предпочтение самцов"],"args":[{"panel":"A","region":"genome"},{"panel":"A","region":"reg"},{"panel":"B"}],"notes":["По геному H. timareta ближе к H. cydno","На участке regucalcin1 — ближе к H. melpomene","Самцы H. timareta и H. melpomene одинаково предпочитают красных самок"],"static":["Два дерева трёх видов бабочек — по геному и по участку гена; три отрезка разниц предпочтения с интервалами"],"scene":"s15_a3","L":{"a3_p1_t":"Два дерева","a3_p1_q2":"геном в целом","a3_p1_q3":"участок гена regucalcin1","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","a3_reg_sw":"дерево участка — в положении «участок гена regucalcin1»","a3_p1_q4":"по данным работы, упрощённо","a3_p2_t":"Предпочтение красных самок","a3_d1":"H. timareta − H. cydno","a3_ci":"{v} (от {lo} до {hi})","a3_d2":"H. melpomene − H. cydno","a3_d3":"H. timareta − H. melpomene","a3_ax":"разница долей времени ухаживания (95 % интервал)","a3_p2_q1":"87 самцов"}}},"adv_kind":"Новые данные"},{"id":"hybrid-selection","num":22,"section":2,"questions":[3],"title":"Что отбор делает с чужими участками после гибридизации","keywords":["Рекомбинация"],"lead":["После гибридизации отбор сильнее всего удаляет участки другого вида в первые поколения, пока они ещё длинные."],"mechanism":["У гибридов участки генома каждого родительского вида поначалу длинные; [[T47|рекомбинация]] в каждом поколении дробит их. Пока участки длинные, вредный для гибрида вариант тянет за собой много соседней ДНК, и отбор против него меняет долю «чужого» происхождения на большом протяжении хромосомы. Сравнив, как доля происхождения от другого вида меняется вдоль генома в крупном и мелком масштабе, авторы оценили: в гибридных популяциях рыб-меченосцев и павианов около 20 %, а у современного человека (участки неандертальского происхождения) около 10–20 % изменчивости этой доли в крупном масштабе связано с систематическим отбором против перенесённых вариантов; это нижние оценки."],"paragraphs":["Это согласуется с сильным отбором против гибридов ранних поколений: интрогрессия — не только перенос полезного, но и удаление несовместимого. В участках с частой рекомбинацией «чужая» ДНК сохраняется лучше: там вредный вариант быстрее отделяется от соседей.","<b>Как это узнали.<\/b> Применили к опубликованным геномам гибридных популяций математическое разложение сигнала по масштабам (вейвлет-анализ) и сравнили с ожидаемым при одном дрейфе.","<b>Граница вывода.<\/b> Оценки в мелком масштабе ненадёжны из-за ограничений методов определения происхождения участков; отбор показан статистически, без названия конкретных генов.","<b>На практикуме.<\/b> Связано с вкладками 3 и 4 (несовместимость у гибридов)."],"conditions":"Схема по данным работы, упрощённая · доли — нижние оценки из работы.","sources":["src_08"],"base":"БИО-15·18; вспомнить [[seminar-6-route.html#crossing-over|семинар 6: «Кроссинговер и хиазмы: обмен и связь»]]","level":"adv","next_base":"why-species","quiz":{"id":"S15-L22","question":"Почему отбор против чужих участков сильнее всего в первые поколения после гибридизации?","options":[{"id":"S15-L22-1","text":"Участки длинные: вредный вариант тянет соседей","correct":true,"feedback":"Рекомбинация потом дробит участки, и отбор затрагивает меньше соседей"},{"id":"S15-L22-2","text":"Гибридов первых поколений больше всего в популяции","correct":false,"feedback":"Число гибридов здесь не главное: важна длина участков"},{"id":"S15-L22-3","text":"Позже вредные варианты становятся полезными","correct":false,"feedback":"Работа об этом не говорит; меняется длина участков, а не свойства вариантов"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что отбор делает с перенесёнными участками?","status":"Схема по данным работы, упрощённая · поколения и длины условны","modes_label":"Поколение","modes":["поколение 1","поколение 10","поколение 100","частая и редкая рекомбинация"],"args":[{"g":1},{"g":10},{"g":100},{"rec":true}],"notes":["Участки длинные: отбор против вредного варианта удаляет много соседней ДНК","Участки короче","Участки мелкие: отбор затрагивает мало соседей","Там, где рекомбинация частая, чужая ДНК сохраняется лучше"],"static":["Хромосомы гибридной популяции в поколения 1, 10, 100: участки другого вида дробятся, рядом с вредным вариантом исчезают"],"scene":"s15_r_hybridsel","L":{"r15_hs_h":"Отбор против перенесённых участков","r15_hs_before":"до отбора","r15_hs_bad":"вредный вариант","r15_hs_after":"после отбора","r15_hs_gone":"удалено отбором","r15_hs_rm_1":"участки длинные: удалено отбором много соседней ДНК","r15_hs_other":"участок другого вида","r15_hs_rm_10":"участки короче","r15_hs_rm_100":"участки мелкие: отбор затрагивает мало соседей","r15_hs_h_rec":"Частая и редкая рекомбинация","r15_hs_fast":"частая рекомбинация","r15_hs_slow":"редкая рекомбинация","r15_hs_keep":"там, где рекомбинация частая, чужая ДНК сохраняется лучше"}},"zoomNarrow":true},"adv_kind":"Новые данные"},{"id":"why-species","num":23,"section":3,"questions":[4],"title":"Зачем нужно понятие вида","keywords":["Вид","Видообразование","Концепция вида","Критерии разграничения видов"],"lead":["Расхождение линий — непрерывный процесс, а вид — единица, которую нужно определить, чтобы считать, сравнивать и называть."],"mechanism":["[[T48|Вид]] — основная единица классификации живых организмов и эволюционной истории. [[T61|Видообразование]] — процесс возникновения эволюционно обособленных линий. Так как расхождение постепенно, на одном его этапе две линии ещё обмениваются генами, на другом уже нет; граница «один вид — два вида» проводится по выбранному свойству. Это свойство задаёт [[T49|концепция вида]], а данные, по которым его оценивают, — [[T50|критерии разграничения]]."],"paragraphs":["Различие концепции и критериев важно: концепция отвечает на вопрос «что делает линию видом», критерий — «как это проверить у этих организмов». Разногласие разных критериев часто означает незавершённое расхождение или продолжающийся поток генов, а не ошибку.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.1.","<b>Ограничения.<\/b> Одной концепции, применимой ко всем организмам и задачам, нет."],"conditions":"Схема качественная · этапы расхождения условны.","sources":["src_01"],"base":"БИО-15·20","quiz":{"id":"S15-L23","question":"Чем концепция вида отличается от критерия разграничения?","options":[{"id":"S15-L23-1","text":"Ничем: это синонимы","correct":false,"feedback":"Это разные вопросы: о свойстве и о данных"},{"id":"S15-L23-2","text":"Концепция — что делает линию видом, критерий — как проверить","correct":true,"feedback":"Например, изоляция и данные о скрещивании"},{"id":"S15-L23-3","text":"Концепция нужна для животных, критерий — для растений","correct":false,"feedback":"И то и другое применяют ко всем организмам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему граница вида — вопрос концепции?","status":"Схема качественная · этапы условны","modes_label":"Этап","modes":["одна популяция","частичная изоляция","два вида"],"args":[{"s":1},{"s":2},{"s":3}],"notes":["Скрещиваются свободно","Поток генов снижен, но не прерван","Изоляция полная: по биологической концепции — два вида"],"static":["Две популяции на трёх этапах расхождения с толщиной стрелки потока генов"],"scene":"s15_r_continuum","L":{"r15_ct_h":"Граница вида: по какому свойству?","r15_ct_1":"одна популяция","r15_ct_2":"частичная изоляция","r15_ct_3":"два вида","r15_ct_flow":"поток генов","r15_ct_q":"по какому свойству?","r15_ct_part":"частичная изоляция","r15_ct_border":"граница вида"}}}},{"id":"species-concepts","num":24,"section":3,"questions":[4],"title":"Концепции вида и их границы","keywords":["Биологическая концепция вида","Репродуктивная изоляция","Филогенетическая концепция вида","Экологическая концепция вида","Морфологическая концепция вида"],"lead":["Разные концепции вида опираются на разные свойства — скрещивание, родство, нишу — и поэтому применимы к разным организмам."],"mechanism":["[[T51|Биологическая концепция]] определяет вид как группу скрещивающихся популяций, [[T54|репродуктивно изолированную]] от других таких групп; она удобна для современных организмов с половым размножением, но неприменима к бесполым формам и ископаемым. [[T52|Филогенетическая концепция]] выделяет наименьшие монофилетические (или диагностируемые) группы; она работает с любыми организмами, но результат зависит от выборки признаков и способа реконструкции дерева. [[T53|Экологическая концепция]] связывает обособленность вида прежде всего с экологическими различиями — с нишей, отличной от ниш других линий, а не с репродуктивной изоляцией; поэтому её используют и при изучении организмов без полового размножения, в том числе бактерий. [[T73|Морфологическая концепция]] выделяет виды по различиям в строении; она применима к ископаемым и к бесполым организмам, но граница между видами по строению бывает произвольной, а виды-двойники по строению не различаются."],"paragraphs":["Морфология, кариотип, геномы и география — источники данных, которые при разграничении видов сопоставляют; при изучении ископаемых другого критерия, кроме строения, обычно нет. Близкие виды бывают почти неразличимы по строению (виды-двойники), а внутри одного вида изменчивость строения бывает велика. Филогенетическая концепция, применённая строго, может разделить на виды популяции, которые свободно скрещиваются.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.1.","<b>Ограничения.<\/b> Совпадение выводов по разным концепциям делает разграничение надёжным; расхождение требует объяснения."],"conditions":"Схема качественная · три линии данных.","sources":["src_01","src_12"],"base":"БИО-15·23","quiz":{"id":"S15-L24","question":"К каким организмам биологическая концепция неприменима?","options":[{"id":"S15-L24-1","text":"К организмам, живущим на одной территории","correct":false,"feedback":"На одной территории изоляцию как раз можно проверить"},{"id":"S15-L24-2","text":"К близким видам с половым размножением","correct":false,"feedback":"Для близких видов с половым размножением она применима"},{"id":"S15-L24-3","text":"К размножающимся только бесполым путём","correct":true,"feedback":"У них нет скрещивания, по которому определяют изоляцию"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что учитывает каждая концепция вида?","status":"Схема качественная · примеры условны","modes_label":"Концепция","modes":["морфологическая","биологическая","филогенетическая","экологическая","виды-двойники"],"args":[{"panel":"concepts","c":"morph"},{"panel":"concepts","c":"bio"},{"panel":"concepts","c":"phylo"},{"panel":"concepts","c":"eco"},{"panel":"concepts","c":"twins"}],"notes":["Вид — группа, отличающаяся по строению; годится для ископаемых","Вид — изолированная группа скрещивающихся популяций","Вид — наименьшая монофилетическая группа","Вид — линия, обособленная прежде всего по экологической нише","По строению не различить; по скрещиванию и геномам — два вида"],"static":["Четыре концепции вида как линии данных и случай видов-двойников"],"scene":"s15_t4","L":{"t4_c_head":"Две формы комаров в одних водоёмах","t4_form1":"форма 1","t4_form2":"форма 2","t4_row_morph":"строение","r15_cc_morph":"строение; годится и для ископаемых","t4_row_mate":"скрещивание","t4_row_gen":"родство по геномам","t4_row_niche":"экологическая ниша","r15_cc_bio":"скрещивание; изоляция","r15_cc_phylo":"монофилетическая группа; геном","r15_cc_eco":"ниша, отличная от ниш других линий","t4_row_morph_v":"не различаются","t4_row_mate_v":"изолированы","t4_row_gen_v":"две монофилетические группы"}}},"exam_quiz":{"id":"S15-E03","question":"Какая концепция вида применима к ископаемым?","options":[{"id":"S15-E03-1","text":"Биологическая","correct":false,"feedback":"Скрещивание ископаемых форм проверить нельзя"},{"id":"S15-E03-2","text":"Никакая из концепций","correct":false,"feedback":"Морфологическая и филогенетическая применимы к ископаемым"},{"id":"S15-E03-3","text":"Морфологическая","correct":true,"feedback":"По строению; у ископаемых скрещивание не проверить"}]}},{"id":"prezygotic","num":25,"section":3,"questions":[4],"title":"Барьеры до образования зиготы","keywords":["Репродуктивная изоляция","Презиготический барьер"],"lead":["Большинство барьеров между видами действуют ещё до того, как образуется гибридная зигота."],"mechanism":["[[T54|Репродуктивная изоляция]] — совокупное снижение эффективного потока генов между линиями вследствие барьеров. [[T55|Презиготические барьеры]] действуют до образования зиготы: различия в месте размножения, во времени размножения (временная изоляция), в поведении и выборе партнёра (поведенческая), в строении половых органов (механическая), во взаимодействии гамет (гаметическая)."],"paragraphs":["Примеры: у зимних пядениц Inurois punctigera в холодных районах Японии две популяции размножаются в начале и в конце зимы и генетически обособлены (по биологической и филогенетической концепциям — разные виды), а на юге, где зима мягче, разрыва во времени размножения и обособления нет. У наземных улиток одна мутация меняет направление закручивания раковины, и особи с разной закруткой не могут спариваться. Изоляция может быть неполной и различаться по направлению скрещивания.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.2; «Найти причину» IV.","<b>Ограничения.<\/b> Классификация по времени действия не объясняет происхождения барьера: различие сроков размножения может возникнуть как побочный результат адаптации."],"conditions":"Схема качественная · примеры по учебнику.","sources":["src_01"],"base":"БИО-15·24","quiz":{"id":"S15-L25","question":"Пыльца одного вида не прорастает на рыльце другого. Какой это барьер?","options":[{"id":"S15-L25-1","text":"Презиготический, гаметический","correct":true,"feedback":"Оплодотворения не происходит, зигота не образуется"},{"id":"S15-L25-2","text":"Постзиготический","correct":false,"feedback":"Постзиготические барьеры действуют после образования зиготы; здесь её нет"},{"id":"S15-L25-3","text":"Не барьер: опыление произошло","correct":false,"feedback":"Опыление — ещё не оплодотворение; барьер действует на этапе гамет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие барьеры действуют до образования зиготы?","status":"Схема качественная · примеры по учебнику","modes_label":"Барьер","modes":["место","время","поведение","строение","гаметы"],"args":[{"b":"habitat"},{"b":"time"},{"b":"behavior"},{"b":"mechanical"},{"b":"gametic"}],"notes":["Размножаются в разных местах","Размножаются в разное время","Не реагируют на сигнал другой популяции","Строение половых органов не совпадает","Гаметы не сливаются"],"static":["Пять барьеров до образования зиготы показаны отдельными рисунками"],"scene":"s15_r_barriers","L":{"r15_br_h_habitat":"Место","r15_br_p1":"популяция 1","r15_br_p2":"популяция 2","r15_br_hab":"разные местообитания","r15_br_nozyg":"зигота не образуется","r15_br_h_time":"Время","r15_br_spring":"весна","r15_br_autumn":"осень","r15_br_h_behavior":"Поведение","r15_br_sig":"брачный сигнал","r15_br_h_mechanical":"Строение","r15_br_right":"правая закрутка","r15_br_left":"левая закрутка","r15_br_shell":"закрутка раковины: половые отверстия не совпадают","r15_br_h_gametic":"Гаметы","r15_br_gam":"гаметы"}},"zoomNarrow":true}},{"id":"postzygotic","num":26,"section":3,"questions":[4],"title":"Барьеры после образования зиготы","keywords":["Постзиготический барьер","Усиление изоляции","Гибридная зона"],"lead":["Если гибрид всё же образовался, барьер может проявиться в его жизнеспособности, плодовитости или у его потомков."],"mechanism":["[[T56|Постзиготические барьеры]] проявляются после оплодотворения: гибрид погибает на ранних стадиях, вырастает, но бесплоден, или его потомки имеют сниженную жизнеспособность и плодовитость. Бесплодие гибрида часто связано с мейозом: если хромосомы родительских видов различаются по строению или числу, гомологичные хромосомы плохо спариваются и неправильно расходятся, и гаметы получаются несбалансированными. Причиной может быть и несовместимость генов (БИО-15·27), в том числе ядерных генов и митохондрий (БИО-15·30)."],"paragraphs":["Если гибриды менее приспособлены, отбор может поддерживать признаки, уменьшающие скрещивание видов, — это [[T59|усиление изоляции]]: постзиготический барьер ведёт к усилению презиготического. Но контакт видов может кончиться и устойчивой [[T60|гибридной зоной]] или интрогрессией.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.3–4.5.","<b>Ограничения.<\/b> Барьеры обычно складываются из многих компонентов; один барьер редко бывает полным."],"conditions":"Схема качественная · этапы развития гибрида условны.","sources":["src_01"],"base":"БИО-15·25; вспомнить [[seminar-6-route.html#meiosis-one|семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»]]","quiz":{"id":"S15-L26","question":"Гибриды двух видов здоровы, но бесплодны. Какой это барьер?","options":[{"id":"S15-L26-1","text":"Презиготический","correct":false,"feedback":"Презиготические барьеры не дают образоваться зиготе"},{"id":"S15-L26-2","text":"Постзиготический","correct":true,"feedback":"Зигота образовалась, барьер проявился в плодовитости гибрида"},{"id":"S15-L26-3","text":"Никакой: гибриды живут","correct":false,"feedback":"Бесплодный гибрид не передаёт генов: поток генов прерван"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как проявляются барьеры после образования зиготы?","status":"Схема качественная · этапы условны","modes_label":"Этап","modes":["гибель гибрида","бесплодие","потомки гибридов","усиление изоляции"],"args":[{"s":"inviable"},{"s":"sterile"},{"s":"F2"},{"s":"reinforce"}],"notes":["Гибрид гибнет на ранней стадии","Гибрид жив, но гаметы несбалансированы","Гибриды F1 нормальны, гибнет часть F2","Если гибриды хуже, отбор усиливает изоляцию до образования зиготы"],"static":["Линия развития гибрида с точками действия барьеров после образования зиготы; стрелка усиления изоляции"],"scene":"s15_r_postzygotic","L":{"r15_pz_h_inviable":"Гибель гибрида","r15_pz_zyg":"зигота","r15_pz_emb":"зародыш","r15_pz_adult":"взрослый гибрид","r15_pz_h_sterile":"Бесплодие","r15_pz_meio":"мейоз","r15_pz_unbal":"несбалансированные гаметы","r15_pz_h_F2":"Потомки гибридов","r15_pz_h_reinforce":"Усиление изоляции","r15_pz_sel":"отбор против гибридов","r15_pz_pre":"изоляция до зиготы усиливается"}},"zoomNarrow":true},"exam_quiz":{"id":"S15-E09","question":"Что такое постзиготический барьер?","options":[{"id":"S15-E09-1","text":"Разные сроки размножения популяций","correct":false,"feedback":"Это барьер до образования зиготы"},{"id":"S15-E09-2","text":"Географическое разделение","correct":false,"feedback":"Это условие аллопатрии; различия в местообитании внутри одной территории — уже барьер до образования зиготы"},{"id":"S15-E09-3","text":"Гибель или бесплодие гибридов","correct":true,"feedback":"Барьер после образования зиготы"}]}},{"id":"dobzhansky-muller","num":27,"section":3,"questions":[4],"title":"Модель Добжанского–Мёллера","keywords":["Несовместимость Добжанского–Мёллера","Эпистаз"],"lead":["Несовместимость у гибридов может возникнуть без того, чтобы какая-то из линий проходила через вредный генотип."],"mechanism":["[[T57|Несовместимость Добжанского–Мёллера]] — отрицательное взаимодействие ([[T58|эпистаз]]) вариантов разных генов, независимо закрепившихся в разных линиях и впервые встретившихся у гибрида. У предка генотип aabb. В популяции 1 закрепляется новый аллель A, в популяции 2 — новый аллель B. В каждой популяции новый аллель встречается только с предковым аллелем другого гена, и все генотипы на пути (Aabb, AAbb; aaBb, aaBB) жизнеспособны. Сочетание A с B возникает впервые у гибрида — и снижает его жизнеспособность или плодовитость: до гибридизации таких генотипов не было, и отбор на них не действовал."],"paragraphs":["Если бы обе замены произошли в одной популяции, на пути был бы генотип с A и B вместе — несовместимый; отбор против него сильный, и такой путь маловероятен. Поэтому такие несовместимости накапливаются главным образом в изолированных популяциях. В зависимости от доминирования несовместимость проявляется уже у гибрида первого поколения или только у его потомков (в модели практикума при рецессивной несовместимости F1 жизнеспособен, а в F2 несовместимы 5/16 потомков: AABb, AABB, AaBB). Ту же модель ещё раньше, в начале XX века, описал У. Бейтсон, поэтому её называют и несовместимостью Бейтсона — Добжанского — Мёллера.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.3–4.5.","<b>Ограничения.<\/b> Модель — два гена и одна несовместимость; у реальных видов их много, и они могут затрагивать три гена и больше."],"conditions":"Расчёт по модели · жизнеспособность 0,1 условна.","sources":["src_09"],"base":"БИО-15·26","quiz":{"id":"S15-L27","question":"Почему несовместимые аллели не удалил отбор в родительских популяциях?","options":[{"id":"S15-L27-1","text":"Отбор не действует на аллели","correct":false,"feedback":"Действует; но несовместимое сочетание в популяциях не возникало"},{"id":"S15-L27-2","text":"Аллели появились сразу у гибрида","correct":false,"feedback":"Аллели возникли и закрепились в разных популяциях до гибридизации"},{"id":"S15-L27-3","text":"Там они не встречались вместе","correct":true,"feedback":"Каждый новый аллель сочетался только с предковым аллелем другого гена"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как несовместимость возникает без вредного промежуточного генотипа?","status":"Расчёт по модели · жизнеспособность 0,1 условна","modes_label":"Режим","modes":["разные популяции","одна популяция","доминантная","рецессивная"],"args":[{"panel":"dm","where":"separate"},{"panel":"dm","where":"one"},{"panel":"dm","where":"separate","regime":"dominant","show":"F2"},{"panel":"dm","where":"separate","regime":"recessive","show":"F2"}],"notes":["Все генотипы на путях жизнеспособны","На пути AABb — жизнеспособность 0,1","F1 0,1; несовместимых F2 9/16; выживает 0,49","F1 1; несовместимых F2 5/16; выживает 0,72"],"static":["Пути генотипов в двух популяциях и в одной; гибрид и таблица F2 для доминантной и рецессивной несовместимости"],"scene":"s15_t4","L":{"t4_a_head_sep":"Замены в разных популяциях: пути генотипов, гибрид, потомки гибридов","t4_pop1":"популяция 1","t4_pop2":"популяция 2","t4_f1":"гибрид F1","t4_viab_v":"жизнеспособность {v}","t4_a_head_one":"Обе замены в одной популяции: сначала A, потом B","t4_one_res":"Первый генотип с A и B на пути — AABb: жизнеспособность 0,1","t4_f2":"Потомки гибридов F2: в ячейке — доля генотипа и под ней жизнеспособность"}},"zoomNarrow":true}},{"id":"geographic-modes","num":28,"section":3,"questions":[4],"title":"Географические режимы видообразования","keywords":["Аллопатрическое видообразование","Поток генов","Перипатрическое видообразование","Парапатрическое видообразование","Дивергентный отбор","Симпатрическое видообразование"],"lead":["Географические термины описывают, где находятся расходящиеся популяции, но не называют генетического механизма расхождения."],"mechanism":["При [[T62|аллопатрическом видообразовании]] [[T67|поток генов]] прерван пространственным барьером; в каждой популяции накапливаются свои различия под действием мутаций, дрейфа и отбора. [[T63|Перипатрическое видообразование]] — случай аллопатрии, когда новую изолированную популяцию основывает небольшое число особей из крупной предковой популяции; дрейф в такой популяции может изменить частоты аллелей и действие отбора. Видообразование через событие основания считают редким. При [[T64|парапатрическом]] расхождении соседние популяции соприкасаются и обмениваются генами; [[T68|дивергентный отбор]] поддерживает различия, а в зоне контакта частоты меняются плавно (клин). [[T65|Симпатрическое видообразование]] идёт без пространственного барьера: эффективный поток генов уменьшают специализация на разных ресурсах, выбор партнёра, сроки размножения или хромосомные изменения."],"paragraphs":["После аллопатрии возможен [[T66|вторичный контакт]]: линии могут слиться, образовать гибридную зону, обменяться частью генома или сохранить изоляцию, если барьеры уже сложились. В действительности режимы образуют непрерывный ряд, а поток генов меняется во времени; поэтому в объяснении видообразования отдельно называют пространственную историю популяций, величину и направление потока генов, экологические различия, генетические барьеры и характер вторичного контакта.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.6–4.7.","<b>Ограничения.<\/b> Схемы режимов условны; по одной карте ареалов механизм не определить."],"conditions":"Схема качественная · карты условны.","sources":["src_01","src_12","src_13","src_14"],"base":"БИО-15·27; вспомнить [[seminar-13-route.html#combined|семинар 13: «Совместное действие: отбор против потока генов и против дрейфа»]]","quiz":{"id":"S15-L28","question":"Что описывает термин «аллопатрия»?","options":[{"id":"S15-L28-1","text":"Пространственное разделение популяций","correct":true,"feedback":"Он говорит о географии, а не о генетическом механизме"},{"id":"S15-L28-2","text":"Механизм несовместимости генов","correct":false,"feedback":"Несовместимость — генетический механизм; география её не называет"},{"id":"S15-L28-3","text":"Расхождение на одной территории","correct":false,"feedback":"Это симпатрия"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что описывают географические режимы?","status":"Схема качественная · карты условны","modes_label":"Режим","modes":["аллопатрия","перипатрия","парапатрия","симпатрия"],"args":[{"panel":"geo","map":"allo"},{"panel":"geo","map":"peri"},{"panel":"geo","map":"para"},{"panel":"geo","map":"sym"}],"notes":["Пространственный барьер","Малая группа на периферии","Ареалы соприкасаются","Один ареал; поток генов ограничен специализацией"],"static":["Четыре условные карты географических режимов; стрелки потока генов одинаковы"],"scene":"s15_t4","L":{"t4_b_head_allo":"Аллопатрия: барьер между ареалами","t4_m_barrier":"барьер","t4_b_flow":"поток генов задаётся переключателем; при пространственном барьере он равен нулю","t4_b_neutral":"Нейтральный локус: различие популяций через 500 поколений","t4_b_local":"Локус под местным отбором: частота местного варианта","t4_b_m_bar":"поток генов прерван барьером","t4_b_head_peri":"Перипатрия: малая группа на периферии, отделённая барьером","t4_m_periph":"периферическая группа","t4_b_head_para":"Парапатрия: ареалы соприкасаются","t4_m_contact":"зона контакта","t4_v_about":"около {v}","t4_b_m":"доля мигрантов m = {m}; стрелка — поток генов из большой соседней популяции","t4_b_head_symp":"Симпатрия: один ареал, два типа ресурсов","t4_m_res":"треугольники вершиной вверх и вниз — два ресурса"}}},"exam_quiz":{"id":"S15-E10","question":"Что описывает термин «симпатрия»?","options":[{"id":"S15-E10-1","text":"Расхождение без пространственного барьера","correct":true,"feedback":"На одной территории"},{"id":"S15-E10-2","text":"Генетический механизм изоляции","correct":false,"feedback":"Географические термины механизма не называют"},{"id":"S15-E10-3","text":"Слияние двух видов","correct":false,"feedback":"Слияние — один из исходов контакта, а не режим расхождения"}]}},{"id":"speciation-gene-flow","num":29,"section":3,"questions":[4],"title":"Видообразование при потоке генов","keywords":["Поток генов","Дивергентный отбор","Остров расхождения","Гибридное видообразование","Полиплоидия"],"lead":["Поток генов сглаживает различия популяций, но там, где действует дивергентный отбор, различия могут сохраняться и при обмене генами."],"mechanism":["[[T67|Поток генов]] противодействует расхождению: расчёт по модели «материк — остров» — если каждое поколение 1 % особей популяции составляют мигранты из большой соседней популяции, нейтральное различие с ней за 500 поколений сокращается примерно до 0,007 от исходного, а в локусе под местным отбором частота местного варианта остаётся 0,91 (у мигрантов — 0,1); при 10 % мигрантов она падает до 0,33. Дрейф в модели не учтён. Поэтому при умеренном потоке генов различия сохраняются в участках под [[T68|дивергентным отбором]] и в сцепленных с ними участках — [[T71|островах расхождения]] — на фоне остального генома, сближенного потоком генов. Гибридизация может и создавать новые линии: [[T69|гибридное видообразование]] — возникновение обособленной линии гибридного происхождения, изолированной от родительских. У растений оно часто сопровождается удвоением наборов хромосом ([[T70|полиплоидия]]), которое сразу создаёт барьер с родительскими видами."],"paragraphs":["Чтобы признать вид гибридным без изменения числа хромосом, нужно показать три вещи: изоляцию гибридной линии от родительских, генетические следы гибридизации и то, что изоляция возникла вследствие гибридизации. Одного обнаружения примеси недостаточно.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.6.","<b>Ограничения.<\/b> В модели поток генов односторонний (из большой соседней популяции) и постоянен, а отбор действует на один локус."],"conditions":"Расчёт по модели · доли мигрантов и приспособленности условны.","sources":["src_01","src_10"],"base":"БИО-15·28","quiz":{"id":"S15-L29","question":"При умеренном потоке генов где сохраняются различия популяций?","options":[{"id":"S15-L29-1","text":"Во всём геноме одинаково","correct":false,"feedback":"Нейтральные участки сближаются потоком генов"},{"id":"S15-L29-2","text":"В участках под дивергентным отбором и рядом с ними","correct":true,"feedback":"Там отбор противодействует сглаживанию различий"},{"id":"S15-L29-3","text":"Нигде: поток генов стирает любые различия","correct":false,"feedback":"Местный отбор удерживает различия в своих участках"}]},"widget":{"kind":"dna","title":"","s":{"title":"Где сохраняются различия при потоке генов?","status":"Расчёт по модели «материк — остров» · доля мигрантов и приспособленности условны; дрейф не учтён","modes_label":"Доля мигрантов","modes":["m 0","m 0,001","m 0,01","m 0,1"],"args":[{"panel":"flow","m":0},{"panel":"flow","m":0.001},{"panel":"flow","m":0.01},{"panel":"flow","m":0.1}],"notes":["1 и 1,0","0,61 и 0,99","около 0,007 и 0,91","0 и 0,33"],"static":["Два столбика — нейтральное различие и частота местного варианта — для четырёх значений m"],"scene":"s15_t4","L":{"t4_b_head_para":"Парапатрия: ареалы соприкасаются","t4_m_contact":"зона контакта","t4_b_flow":"поток генов задаётся переключателем; при пространственном барьере он равен нулю","t4_b_neutral":"Нейтральный локус: различие популяций через 500 поколений","t4_b_local":"Локус под местным отбором: частота местного варианта","t4_b_m":"доля мигрантов m = {m}; стрелка — поток генов из большой соседней популяции","t4_v_about":"около {v}"}}}},{"id":"mitonuclear","num":30,"section":3,"questions":[4],"title":"Несовместимость ядерных генов и митохондрий у гибридов рыб","keywords":["Митохондриально-ядерная несовместимость"],"lead":["Модель Добжанского–Мёллера найдена в природе на молекулярном уровне: ядерные гены одного вида несовместимы с митохондриями другого."],"mechanism":["Два близких вида рыб-меченосцев разошлись около 250 000 поколений назад и около 100 поколений назад начали скрещиваться в природе. У 943 лабораторных гибридов второго поколения (все с митохондриями одного вида) гомозиготы по ядерному участку другого вида с геном ndufs5 почти отсутствовали — 0,1 % вместо ожидаемых 25 %, а с геном ndufa13 — 3 % вместо 25 %. Белки этих генов в комплексе I дыхательной цепи соприкасаются с белками, закодированными митохондриальной ДНК: это [[T72|митохондриально-ядерная несовместимость]]. Оценка коэффициента отбора против несовместимого генотипа — 0,996 и 0,91; несовместимость почти рецессивна, поэтому гибриды первого поколения жизнеспособны."],"paragraphs":["Зародыши с несовместимым ndufs5 не развиваются дальше первых 7 дней беременности (она длится 21–28 дней), с несовместимым ndufa13 — гибнут вскоре после рождения. Оба гена быстро изменялись в линии одного из видов. Митохондрии одного вида при древней гибридизации перешли к третьему виду, и у его гибридов, по-видимому, действует та же несовместимость: несовместимость может переноситься интрогрессией.","<b>Как это узнали.<\/b> У гибридов определили происхождение каждого участка генома, нашли участки, где одного сочетания почти нет, проследили развитие зародышей и измерили работу комплекса I.","<b>Граница вывода.<\/b> Это два вида рыб и два гена; по прежним работам, у этих видов могут быть ещё десятки несовместимостей. На других животных и на человека числа не переносят.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 4.","<b>Дальше в курсе «Молекулярная биология».<\/b> Почему дыхательный аппарат зависит от двух геномов — [[https://edu.mazunin.science/seminar-9-route.html#dual-genome|«Молекулярная биология», семинар 9]]; как разделяют ядерный и митохондриальный вклад в дефект — [[https://edu.mazunin.science/seminar-9-route.html#genetic-tests|«Молекулярная биология», семинар 9]]."],"conditions":"Схема по данным работы, упрощённая · доли и оценки отбора измерены.","sources":["src_09"],"base":"БИО-15·27; вспомнить [[seminar-14-route.html#mtdna|семинар 14: «Митохондриальная ДНК как отдельный случай»]]","level":"adv","next_base":"integration","quiz":{"id":"S15-L30","question":"Почему гибриды первого поколения выживают, а часть гибридов второго — нет?","options":[{"id":"S15-L30-1","text":"У первого поколения нет митохондрий","correct":false,"feedback":"Митохондрии есть у всех гибридов"},{"id":"S15-L30-2","text":"Во втором поколении выше мутационная нагрузка","correct":false,"feedback":"Работа показывает конкретную несовместимость двух генов с митохондриями, а не общую нагрузку"},{"id":"S15-L30-3","text":"Несовместимость почти рецессивна","correct":true,"feedback":"Гибнут гомозиготы по ядерному участку другого вида, появляющиеся во втором поколении"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как несовместимы ядерные гены и митохондрии у гибридов рыб?","status":"Схема по данным работы, упрощённая · доли и оценки измерены","modes_label":"Ген","modes":["ndufs5","ndufa13","когда гибнут"],"args":[{"gene":"ndufs5"},{"gene":"ndufa13"},{"panel":"C"}],"notes":["0,1 % вместо 25 %; отбор 0,996","3 % вместо 25 %; отбор 0,91","ndufs5 — гибель зародыша; ndufa13 — вскоре после рождения"],"static":["Столбики ожидаемой и наблюдаемой доли гомозигот для двух генов; условный контур комплекса I; шкала развития"],"scene":"s15_a4","L":{"a4_p1_t":"Генотипы F2","a4_p1_q2":"ndufs5 (хромосома 13)","a4_p1_q4":"гомозиготы по участку X. birchmanni при митохондриях X. malinche","a4_exp":"ожидается {v}","a4_obs":"наблюдается {v}","a4_p1_q5":"гетерозиготы","a4_p1_q7":"жизнеспособны","a4_p1_q6":"гомозиготы X. malinche","a4_n":"943 гибрида F2, митохондрии X. malinche","a4_p1_q3":"ndufa13 (хромосома 6)","a4_p3_t":"Когда гибнут","a4_gest":"беременность 21–28 дней","a4_birth":"рождение","a4_d5":"ndufs5: не дальше 7 дней","a4_d13":"ndufa13: вскоре после рождения","a4_cplx":"комплекс I дыхательной цепи (схема)","a4_mt":"белки, закодированные в митохондриальной ДНК","a4_cplx_note":"белки ядерных генов касаются белков, закодированных в митохондриальной ДНК"}}},"adv_kind":"Новые данные"},{"id":"hybrid-species","num":31,"section":3,"questions":[4],"title":"Вид гибридного происхождения при постоянном обмене генами","keywords":["Поток генов","Остров расхождения"],"lead":["Вид может сохраняться сотни тысяч лет, хотя 99 % его генома постоянно сближается обменом генами с другим видом."],"mechanism":["Бабочка Heliconius elevatus возникла около 180 тыс. лет назад (интервал оценки 137–216 тыс.) как вид гибридного происхождения и живёт вместе с обоими родительскими видами. С H. pardalinus у неё продолжается [[T67|поток генов]], который сближает около 99 % генома: по большинству участков H. elevatus не отличается от H. pardalinus, и деревья участков объединяют их в 93,2 % окон генома. Различия сохраняются примерно в 1 % генома — в 44 [[T71|островах расхождения]]; в 32 из них есть участки, полученные от другого родительского вида, H. melpomene (вклад H. melpomene в геном — около 0,7 %). В островах — гены окраски, формы крыла, выбора кормового растения, половых феромонов и выбора партнёра."],"paragraphs":["Эти признаки удерживают H. elevatus на собственном адаптивном пике и позволяют ей сосуществовать с обоими родителями; по оценке авторов, вид существует не менее 720 000 поколений. Авторы относят свою работу к немногим, где выполнены строгие критерии гибридного видообразования.","<b>Как это узнали.<\/b> Прочитали геномы бабочек трёх видов из многих популяций, оценили поток генов и время расхождения моделями, а признаки, различающие виды, нашли скрещиваниями.","<b>Граница вывода.<\/b> Время и доли — модельные оценки с интервалами; убедительных примеров гибридного видообразования у животных немного, и каждый требует такой проверки.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.6 (поток генов и местный отбор)."],"conditions":"Схема по данным работы, упрощённая · доли и время — оценки с интервалами.","sources":["src_10"],"base":"БИО-15·29, БИО-15·19","level":"adv","next_base":"integration","quiz":{"id":"S15-L31","question":"Как вид сохраняется, если 99 % генома сближается обменом генами?","options":[{"id":"S15-L31-1","text":"Различия держатся в 1 % генома под отбором","correct":true,"feedback":"44 острова с генами окраски, выбора партнёра и экологии противостоят потоку генов"},{"id":"S15-L31-2","text":"Обмен генами идёт только с H. melpomene","correct":false,"feedback":"Наоборот: обмен идёт с H. pardalinus, а с H. melpomene его почти нет"},{"id":"S15-L31-3","text":"Вид не сохраняется: он сливается с H. pardalinus","correct":false,"feedback":"По оценке авторов, вид обособлен не менее 720 000 поколений"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как гибридный вид сохраняется при потоке генов?","status":"Схема по данным работы, упрощённая · доли и время — оценки с интервалами","modes_label":"Что показываем","modes":["99 % генома","44 острова","три вида"],"args":[{"v":"genome"},{"v":"islands"},{"v":"species"}],"notes":["Около 99 % генома сближено обменом с H. pardalinus","44 острова (около 1 %); в 32 из них — участки от H. melpomene","Сеть: вид гибридного происхо
