<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-15.html">← Вернуться к семинару</a> · <a href="section-3.html">Раздел III</a> · <a href="index.html">Все разделы</a></p><h1>Филогенетика и видообразование: от сходства последовательностей к истории линий</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-phylo-what"><div class="eyebrow">Что сравниваем · шаг 1 из 33</div><h2>Что реконструирует филогенетика</h2><p class="lead">Прошлое не наблюдают: последовательности и признаки современных организмов — наблюдение, а история их расхождения — реконструкция по этим данным.</p><div class="note"><strong>Что показывает схема.</strong> Пять этапов от последовательностей к дереву с поддержкой; на каждом — допущение</div><p><a href="#ns-g-S15-T01">Филогенетика</a> восстанавливает родственные связи организмов, популяций и генов. Её результат — <a href="#ns-g-S15-T02">филогенетическое дерево</a>: схема, на которой линии расходятся от общих предков. Между данными и деревом несколько шагов, и каждый — допущение: какие объекты сравнивать; что у них общего происхождения (<a href="#ns-g-S15-T03">гомология</a>); какие позиции последовательностей соответствуют друг другу; как последовательности меняются; какое дерево лучше объясняет различия; насколько оно надёжно. Поэтому дерево — модель, а не запись прошлого.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-12-route.html#luca">семинар 12: «LUCA: последний, а не первый»</a> и <a href="seminar-12-route.html#four-statuses">семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»</a></p><p>Дерево показывает порядок расхождения линий, а не лестницу от «низших» организмов к «высшим». Все современные линии прошли одинаковое время от общего предка; различаются скорость и направление их изменений. Процент совпадающих позиций помогает подобрать последовательности для сравнения, но сам по себе родства не измеряет: он зависит от скорости замен, длины последовательности, выравнивания и от того, что сравнивают.</p><p><b>На практикуме.</b> Вкладки 1–4: шкала этапов на вкладке 2 показывает путь от данных к дереву.</p><p><b>Ограничения.</b> Дерево описывает только включённые в анализ линии; вымершие линии, не оставившие потомков, на нём обычно не видны.</p><div class="static-quiz"><h3>Что из перечисленного — наблюдение?</h3><ol><li><b>А.</b> Последовательности гена у пяти видов <i>(верный вариант)</i><br><span class="expl">Их прочитали; дерево по ним — реконструкция</span></li><li><b>Б.</b> Порядок расхождения пяти видов <i>(неверный вариант)</i><br><span class="expl">Порядок расхождения выводят по данным с допущениями — это реконструкция</span></li><li><b>В.</b> Последовательность гена их общего предка <i>(неверный вариант)</i><br><span class="expl">Предка не прочитать: его последовательность восстанавливают по потомкам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-0233-0">Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444</a></li></ul><p>Схема качественная · этапы — учебная последовательность.</p></details></article><article class="card print-unit" id="ns-homology"><div class="eyebrow">Что сравниваем · шаг 2 из 33</div><h2>Гомология: общее происхождение, а не процент сходства</h2><p class="lead">Сходство измеряют, гомологию выводят: два гена либо происходят от одного предкового гена, либо нет.</p><div class="note"><strong>Что показывает схема.</strong> Четыре панели: процент сходства, общий предок двух генов, аналогичные крылья, независимое возникновение одной замены на дереве</div><p><a href="#ns-g-S15-T03">Гомология</a> — общее происхождение признаков или последовательностей от одного предкового состояния. Это утверждение о происхождении, а не число; <a href="#ns-g-S15-T74">сходство последовательностей</a> — доля совпадающих позиций выравнивания — его основание, но не мера: выражение «гомологичны на 80 %» смешивает родство с процентом совпадающих позиций. Сходство без общего происхождения данного признака — <a href="#ns-g-S15-T04">аналогия</a>: крылья птицы и насекомого похожи по функции, но возникли независимо. На уровне последовательностей одна и та же замена тоже может возникнуть независимо в разных линиях — такое совпадение не говорит о родстве.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-phylo-what">«Что реконструирует филогенетика»</a>; вспомнить <a href="seminar-12-route.html#reconstruction">семинар 12: «Как реконструируют свойства LUCA»</a></p><p>Пример из медицины. У разных вариантов вируса SARS-CoV-2 одни и те же замены в белке шипа (например, N501Y) возникали неоднократно и независимо. Совпадение позиции у двух вариантов поэтому не доказывает, что один произошёл от другого: это проверяют по дереву многих позиций генома. Гомологию генов признают, когда сходство выше ожидаемого случайно и его лучше объясняет общее происхождение; надёжнее всего — по дереву генного семейства.</p><p><b>На практикуме.</b> Вкладка 1, шаг 1.1.</p><p><b>Ограничения.</b> Порога сходства, после которого гены гомологичны, нет: давно разошедшиеся гомологичные гены могут быть сходны слабо.</p><div class="static-quiz"><h3>Два белка сходны на 30 %, и у обоих одинаковое строение активного центра. Что из этого — вывод о происхождении?</h3><ol><li><b>А.</b> Белки гомологичны на 30 %, как показывает сравнение <i>(неверный вариант)</i><br><span class="expl">Гомология не бывает частичной: процент описывает сходство</span></li><li><b>Б.</b> Белки гомологичны, если сходство объясняется общим предком <i>(верный вариант)</i><br><span class="expl">Гомология — вывод о происхождении; сходство — его основание</span></li><li><b>В.</b> Белки аналогичны, потому что сходство мало <i>(неверный вариант)</i><br><span class="expl">Малое сходство не исключает общего происхождения: гены могли давно разойтись</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41579-025-01255-x">Uraki R. et al. SARS-CoV-2 variants: biology, pathogenicity, immunity, and control. Nat Rev Microbiol 2026; 24: 8–28</a></li></ul><p>Схема качественная · примеры условны.</p></details></article><article class="card print-unit" id="ns-ortho-para"><div class="eyebrow">Что сравниваем · шаг 3 из 33</div><h2>Ортологи и паралоги: какое событие в общем узле</h2><p class="lead">Гомологичные гены делят на ортологи и паралоги по одному признаку — какое событие произошло в их общем узле.</p><div class="note"><strong>Что показывает схема.</strong> Дерево генного семейства с узлами-событиями; выбранная пара и её общий узел</div><p><a href="#ns-g-S15-T05">Ортологи</a> — гомологичные гены, линии которых разошлись при разделении видов. <a href="#ns-g-S15-T06">Паралоги</a> — гомологичные гены, разошедшиеся после <a href="#ns-g-S15-T07">дупликации гена</a>. Различие видно на <a href="#ns-g-S15-T08">дереве гена</a> — схеме родства всех копий семейства: если в общем узле двух генов дупликация, они паралоги, если разделение видов — ортологи. Гены разных видов могут быть паралогами: если ген удвоился до разделения видов, копия α одного вида и копия β другого разошлись в узле дупликации.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-homology">«Гомология: общее происхождение, а не процент сходства»</a>; вспомнить <a href="seminar-14-route.html#duplication">семинар 14: «Дупликация: как возникает копия гена»</a> и <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a></p><p>Простой выбор «самого похожего гена» не устанавливает ортологии: ближайшим совпадением может оказаться паралог, если ортолог утрачен или изменялся быстрее. Поэтому ортологию проверяют по дереву всего семейства, положению дупликаций и распределению копий между видами. Для дерева видов берут ортологи: различия между паралогами накопились со времени дупликации, а не со времени разделения видов. Ортологи часто сохраняют сходную функцию, но не обязательно; паралоги могут разделить функцию предка или приобрести новую.</p><p><b>На практикуме.</b> Вкладка 1, шаги 1.2–1.3.</p><p><b>Ограничения.</b> При многих дупликациях и потерях одно семейство содержит сложное сочетание ортологов и паралогов; ошибки здесь искажают и дерево видов.</p><div class="static-quiz"><h3>Ген удвоился у общего предка видов 1 и 2. Копия α вида 1 и копия β вида 2 — это…</h3><ol><li><b>А.</b> Ортологи <i>(неверный вариант)</i><br><span class="expl">Ортологи разошлись при разделении видов; у α и β общий узел — дупликация</span></li><li><b>Б.</b> Не гомологи <i>(неверный вариант)</i><br><span class="expl">Обе копии происходят от одного предкового гена</span></li><li><b>В.</b> Паралоги <i>(верный вариант)</i><br><span class="expl">Их общий узел — дупликация</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-0233-0">Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444</a></li></ul><p>Схема качественная · дерево гена условно.</p></details></article><article class="card print-unit" id="ns-alignment"><div class="eyebrow">Что сравниваем · шаг 4 из 33</div><h2>Выравнивание — гипотеза о соответствии позиций</h2><p class="lead">Прежде чем считать различия, последовательности ставят одна под другой; каждый столбец — предположение, что буквы в нём произошли от одной позиции предка.</p><div class="note"><strong>Что показывает схема.</strong> Две строки нуклеотидов с пропуском в трёх положениях; число несовпадений 0, 4, 5</div><p><a href="#ns-g-S15-T09">Множественное выравнивание</a> располагает последовательности так, чтобы сравниваемые столбцы соответствовали позициям общего происхождения — это <a href="#ns-g-S15-T10">позиционная гомология</a>. Если последовательности разной длины, в одну вставляют <a href="#ns-g-S15-T11">пропуск</a> (знак «—»). Пропуск обозначает <a href="#ns-g-S15-T12">вставку или делецию</a>, но по двум последовательностям нельзя сказать, что из двух: направление изменения определяют по <a href="#ns-g-S15-T15">внешней группе</a> — линии, отделившейся раньше. От расстановки пропусков зависит, какие буквы окажутся в одном столбце, а значит, и число различий.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-homology">«Гомология: общее происхождение, а не процент сходства»</a>; вспомнить <a href="seminar-14-route.html#change-types">семинар 14: «Типы изменений: замена, вставка и делеция, структурные изменения»</a></p><p>Пример: последовательности ATGGCTACCTGA и ATGGCACCTGA. Если поставить пропуск после 5-й буквы второй, несовпадений нет; если в конце — их пять, сходство падает со 100 % до 54,5 %. Обычно принимают выравнивание, требующее меньше всего событий, но при сильно различающихся последовательностях несколько выравниваний бывают почти равноценны.</p><p><b>На практикуме.</b> Вкладка 1, шаги 1.4–1.6.</p><p><b>Ограничения.</b> Учебный пример короткий; в настоящих данных десятки последовательностей и тысячи столбцов, и программы выравнивания расставляют пропуски по-разному.</p><div class="static-quiz"><h3>Что предполагает каждый столбец выравнивания?</h3><ol><li><b>А.</b> Буквы в нём происходят от одной позиции предка <i>(верный вариант)</i><br><span class="expl">Выравнивание — гипотеза о позиционной гомологии</span></li><li><b>Б.</b> Буквы в нём одинаковы у всех последовательностей <i>(неверный вариант)</i><br><span class="expl">В столбце могут быть разные буквы: они и есть различия</span></li><li><b>В.</b> Столбец соответствует одному кодону гена <i>(неверный вариант)</i><br><span class="expl">Столбец — одна позиция; кодон занимает три столбца</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/molbev/msae177">Redelings B.D. et al. Insertions and deletions: computational methods, evolutionary dynamics, and biological applications. Mol Biol Evol 2024; 41: msae177</a></li></ul><p>Расчёт по модели · последовательности условны.</p></details></article><article class="card print-unit" id="ns-alignment-matters"><div class="eyebrow">Что сравниваем · шаг 5 из 33</div><h2>Почему выравнивание не нейтральная операция</h2><p class="lead">Ошибки выравнивания и скрытые повторные замены переходят в дерево, поэтому выводы проверяют на устойчивость.</p><div class="note"><strong>Что показывает схема.</strong> Позиция с возвратной заменой; кривая различия от числа замен с пределом 75 %; два выравнивания и два дерева</div><p>Разные выравнивания одних и тех же последовательностей могут дать разные деревья: столбец, поставленный неверно, предполагает ложную гомологию позиций. Кроме того, наблюдаемое различие меньше числа произошедших замен: позиция могла измениться несколько раз или вернуться к исходной букве. При долгом расхождении наступает <a href="#ns-g-S15-T14">насыщение</a>: различие двух последовательностей ДНК не превышает примерно 75 % — столько различаются и случайные последовательности из четырёх букв. <a href="#ns-g-S15-T13">Модели замен</a> учитывают скрытые изменения: разную частоту нуклеотидов, более частые транзиции, разную скорость в разных позициях, долю неизменяемых позиций.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-alignment">«Выравнивание — гипотеза о соответствии позиций»</a>; вспомнить <a href="seminar-14-route.html#dnds-limits">семинар 14: «Чего dN/dS не показывает»</a></p><p>Поэтому сомнительно выровненные участки исключают или анализируют несколькими способами, а вывод проверяют при разных выравниваниях, моделях и наборах видов. Процент сходства годится как грубая подсказка только для близких последовательностей, для которых выравнивание однозначно и насыщения нет.</p><p><b>На практикуме.</b> Вкладка 1, шаг 1.5.</p><p><b>Ограничения.</b> Модели замен — упрощения; неверная модель тоже может исказить дерево.</p><div class="static-quiz"><h3>Две последовательности различаются в 70 % позиций. Что сказать о числе замен?</h3><ol><li><b>А.</b> Замен было ровно 70 на 100 позиций <i>(неверный вариант)</i><br><span class="expl">Видимое различие меньше числа замен: повторные замены в одной позиции не видны</span></li><li><b>Б.</b> Их было больше, и оценка ненадёжна <i>(верный вариант)</i><br><span class="expl">При таком различии много скрытых повторных замен; близко к насыщению</span></li><li><b>В.</b> Последовательности не гомологичны <i>(неверный вариант)</i><br><span class="expl">Сильное расхождение не исключает гомологии; это вопрос происхождения</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-0233-0">Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444</a></li></ul><p>Схема качественная · кривая насыщения условна.</p></details></article><article class="card print-unit" id="ns-ape-alignable"><div class="eyebrow">Что сравниваем · шаг 6 из 33</div><h2>Сколько генома удаётся выровнять</h2><p class="lead">Привычный процент сходства геномов описывает только ту их часть, которую удалось выровнять.</p><div class="note"><strong>Что показывает схема.</strong> Полоса генома: выровненная часть и невыровненная 12,5–27,3 %; столбики однонуклеотидных и пропусковых различий</div><p>Геномы шести видов человекообразных обезьян прочитали вместе с повторами (74 % хромосом собраны от конца до конца без разрывов) и выровняли попарно и с геномом человека. У разных пар видов от 12,5 до 27,3 % генома не выровнялось или выровнялось не один к одному: такие участки вносят пропуски. Различия по пропускам — вставкам, делециям, перестройкам — затронули в 5–15 раз больше мегабаз, чем однонуклеотидные различия; часть этого — следствие трудностей выравнивания повторов. В среднем 327 млн пар нуклеотидов (около 10 %) на линию составили <a href="#ns-g-S15-T16">структурно расходящиеся участки</a>: центромеры, короткие плечи акроцентрических хромосом, концевой гетерохроматин, участки сегментных дупликаций.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-alignment">«Выравнивание — гипотеза о соответствии позиций»</a>, шаг <a href="#ns-alignment-matters">«Почему выравнивание не нейтральная операция»</a></p><p>Сравнения последовательностей оказались богаче различиями, чем считали раньше. Процент сходства по выровненным столбцам не противоречит этому: он описывает только сопоставленную часть.</p><p><b>Как это узнали.</b> Геномы прочитали длинными прочтениями и собрали большую часть хромосом без разрывов; затем отдельно учли участки, которые выравниваются плохо или не один к одному.</p><p><b>Граница вывода.</b> Невыровненная доля — не доля различий: в неё попадают и сходные, но перестроенные или повторяющиеся участки. Часть невыровненного — следствие трудностей выравнивания повторов.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 1.</p><div class="static-quiz"><h3>Почему процент сходства геномов не описывает всех различий?</h3><ol><li><b>А.</b> Его считают только по генам, а не по геному <i>(неверный вариант)</i><br><span class="expl">Сравнивали геномы целиком; дело в выравнивании</span></li><li><b>Б.</b> Он учитывает только вставки и делеции <i>(неверный вариант)</i><br><span class="expl">Наоборот: в процент входят несовпадения выровненных столбцов</span></li><li><b>В.</b> Его считают только по выровненной части <i>(верный вариант)</i><br><span class="expl">Невыровненные участки в него не входят</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-025-08816-3">Yoo D. et al. Complete sequencing of ape genomes. Nature 2025; 641: 401–418</a></li></ul><p>Схема по данным работы, упрощённая · доли и кратности измерены.</p></details></article><article class="card print-unit" id="ns-indels"><div class="eyebrow">Что сравниваем · шаг 7 из 33</div><h2>Вставки и делеции: сильный признак и главный источник неопределённости</h2><p class="lead">Вставки и делеции — частые изменения; общая вставка хорошо указывает на родство, но где именно поставить пропуск, однозначно решить нельзя.</p><div class="note"><strong>Что показывает схема.</strong> Три последовательности с общей вставкой у двух; два равноценных места пропуска (ATGGCTA-CTGA и ATGGCTAC-TGA); три выравнивания и итоговое дерево</div><p>После однонуклеотидных замен вставки и делеции — второй по значению источник наследственной изменчивости: у людей это от 16 до 25 % всех вариантов генома. Одинаковая вставка в одном и том же месте у двух последовательностей вряд ли возникла дважды независимо, поэтому общие вставки и делеции сильнее указывают на родство, чем общие замены. Но это требует точной расстановки пропусков, а большинство программ выравнивания ставят их недостаточно точно, и результат зависит от параметров программы и от дерева, которым она пользуется при сборке выравнивания. Неоднозначность выравнивания нельзя устранить полностью даже при идеальном способе оценки.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-alignment">«Выравнивание — гипотеза о соответствии позиций»</a></p><p>Поэтому всё чаще анализируют не одно «лучшее» выравнивание, а набор почти равноценных и проверяют, меняется ли вывод.</p><p><b>Как это узнали.</b> Обзор сравнивает методы работы со вставками и делециями и их влияние на выравнивание, дерево и оценки отбора.</p><p><b>Граница вывода.</b> Доля вставок и делеций — для генома человека; у других видов она иная.</p><p><b>На практикуме.</b> Вкладка 1, шаги 1.4–1.6.</p><div class="static-quiz"><h3>Почему общая вставка в одном месте — сильный признак родства?</h3><ol><li><b>А.</b> Такая вставка там же вряд ли возникла дважды <i>(верный вариант)</i><br><span class="expl">При верной расстановке пропуска совпадение почти наверняка унаследовано</span></li><li><b>Б.</b> Вставки вообще не возникают повторно <i>(неверный вариант)</i><br><span class="expl">Возникают, но одинаковая вставка в одном месте — маловероятное совпадение</span></li><li><b>В.</b> Вставки всегда выровнены точно и однозначно <i>(неверный вариант)</i><br><span class="expl">Наоборот: расстановка пропусков — главный источник неопределённости</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-15.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1093/molbev/msae177">Redelings B.D. et al. Insertions and deletions: computational methods, evolutionary dynamics, and biological applications. Mol Biol Evol 2024; 41: msae177</a></li></ul><p>Схема по данным обзора, упрощённая · доля — для геномов людей.</p></details></article><article class="card print-unit" id="ns-tree-parts"><div class="eyebrow">Как читать дерево · шаг 8 из 33</div><h2>Части дерева</h2><p class="lead">У дерева несколько частей, и каждая означает своё: кончики — современные линии, внутренние узлы — их реконструируемые предки.</p><div class="note"><strong>Что показывает схема.</strong> Дерево К, Л, М, Н, П с внешней группой Р; подписи частей; клады скобками</div><p><a href="#ns-g-S15-T17">Кончики</a> (листья) дерева — включённые в анализ виды, популяции или последовательности. <a href="#ns-g-S15-T18">Внутренние узлы</a> — реконструируемые общие предки; <a href="#ns-g-S15-T19">ветви</a> соединяют узлы. <a href="#ns-g-S15-T21">Клада</a> — предок и все его потомки; группа, исключающая часть потомков общего предка, кладой не является. Две линии, отходящие от одного узла, — <a href="#ns-g-S15-T22">сестринские группы</a>: они ближе друг к другу, чем к любой другой линии. <a href="#ns-g-S15-T20">Топология</a> — порядок соединения ветвей; она и несёт гипотезу о родстве.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-phylo-what">«Что реконструирует филогенетика»</a></p><p>Внутренний узел на дереве со временем обозначает предковую популяцию или линию, а не обязательно конкретный известный ископаемый вид.</p><p><b>На практикуме.</b> Вкладка 2: показание «Клады» перечисляет все клады дерева.</p><p><b>Ограничения.</b> Учебное дерево строго ветвится; при гибридизации и переносе генов история не сводится к дереву (шаг <a href="#ns-tree-or-network">«Дерево или сеть»</a>).</p><div class="static-quiz"><h3>Что изображает внутренний узел дерева?</h3><ol><li><b>А.</b> Ископаемый вид, найденный в раскопках <i>(неверный вариант)</i><br><span class="expl">Ископаемое может быть близко к узлу, но узел — гипотеза, а не находка</span></li><li><b>Б.</b> Реконструируемого общего предка <i>(верный вариант)</i><br><span class="expl">Его не наблюдают, а выводят из данных о потомках</span></li><li><b>В.</b> Самый развитый вид группы <i>(неверный вариант)</i><br><span class="expl">Узел — предок; развитость дерево не изображает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li></ul><p>Схема качественная · виды условны.</p></details></article><article class="card print-unit" id="ns-common-ancestor"><div class="eyebrow">Как читать дерево · шаг 9 из 33</div><h2>Родство определяет общий предок, а не соседство кончиков</h2><p class="lead">Два вида тем ближе, чем позже жил их последний общий предок; ни соседство на рисунке, ни число узлов между ними этого не показывают.</p><div class="note"><strong>Что показывает схема.</strong> Дерево с обведёнными узлами — общими предками выбранных пар</div><p>Родство на дереве определяют по <a href="#ns-g-S15-T23">последнему общему предку</a>: если общий предок М и К жил позже, чем общий предок М и Н, то М ближе к К. Распространённые ошибки чтения: судить по соседству кончиков, по числу узлов между ними, по положению «вверху» или «справа». Кончики — современные виды; ни один не происходит от другого, у них общие предки. Поэтому «человек произошёл от шимпанзе» — неверное чтение дерева: у человека и шимпанзе общий предок.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-tree-parts">«Части дерева»</a></p><p>Пример: от внешней группы Р до вида Н на рисунке три узла, а до вида К — четыре, но Р одинаково родствен им обоим: у Р со всеми видами внутренней группы один общий предок — корень. Пример из медицины: у варианта Альфа вируса SARS-CoV-2 ветвь на дереве длиннее, чем у его современников. Это означает, что в этой линии быстрее накапливались замены (вероятнее всего, в организме человека с длительной инфекцией), а не то, что Альфа — предок других вариантов.</p><p><b>На практикуме.</b> Вкладка 2, шаги 2.1 и 2.7.</p><p><b>Ограничения.</b> Дерево говорит о родстве только включённых видов: добавление других видов может изменить картину.</p><div class="static-quiz"><h3>На дереве кончик шимпанзе стоит рядом с кончиком человека. Что из этого следует?</h3><ol><li><b>А.</b> Шимпанзе — предок человека, раз стоит рядом <i>(неверный вариант)</i><br><span class="expl">Оба — современные виды с общим предком</span></li><li><b>Б.</b> Человек — самый развитый вид на этом дереве <i>(неверный вариант)</i><br><span class="expl">Дерево не ранжирует виды</span></li><li><b>В.</b> Ничего: родство читают по общему узлу <i>(верный вариант)</i><br><span class="expl">Родство читают по узлам, а не по соседству кончиков</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41579-025-01255-x">Uraki R. et al. SARS-CoV-2 variants: biology, pathogenicity, immunity, and control. Nat Rev Microbiol 2026; 24: 8–28</a></li></ul><p>Схема качественная · виды условны.</p></details></article><article class="card print-unit" id="ns-rotation"><div class="eyebrow">Как читать дерево · шаг 10 из 33</div><h2>Поворот ветвей не меняет дерева</h2><p class="lead">Одно и то же дерево можно нарисовать многими способами: ветви у каждого узла можно поменять местами.</p><div class="note"><strong>Что показывает схема.</strong> Три рисунка одного дерева с разным порядком кончиков и одинаковым списком клад</div><p>Поворот ветвей вокруг <a href="#ns-g-S15-T18">внутреннего узла</a> меняет порядок кончиков на рисунке, но не меняет <a href="#ns-g-S15-T20">топологии</a> — порядка ветвлений и набора клад. У дерева из n видов n − 1 внутренний узел, и у каждого ветви можно повернуть: одних рисунков одного дерева много. Поэтому сравнивают не рисунки, а списки <a href="#ns-g-S15-T21">клад</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-tree-parts">«Части дерева»</a>, шаг <a href="#ns-common-ancestor">«Родство определяет общий предок, а не соседство кончиков»</a></p><p>Удобно представлять дерево как подвеску из нитей: её можно вращать у каждого узла, а связи остаются прежними.</p><p><b>На практикуме.</b> Вкладка 2, шаг 2.2: после любого числа поворотов список клад тот же.</p><p><b>Ограничения.</b> Поворот не меняет и длин ветвей; меняет только расположение на рисунке.</p><div class="static-quiz"><h3>Как проверить, что два рисунка изображают одно дерево?</h3><ol><li><b>А.</b> Сравнить списки клад <i>(верный вариант)</i><br><span class="expl">При одинаковых кладах и корне — одно дерево</span></li><li><b>Б.</b> Сравнить порядок кончиков сверху вниз <i>(неверный вариант)</i><br><span class="expl">Порядок меняется поворотом ветвей</span></li><li><b>В.</b> Сравнить число кончиков <i>(неверный вариант)</i><br><span class="expl">Одно и то же число видов может быть связано по-разному</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели · список клад до и после поворота.</p></details></article><article class="card print-unit" id="ns-root-outgroup"><div class="eyebrow">Как читать дерево · шаг 11 из 33</div><h2>Корень и внешняя группа; сборка дерева по признакам</h2><p class="lead">Корень задаёт направление от предка к потомкам; его ставят по внешней группе, и по ней же определяют, какое состояние признака предковое.</p><div class="note"><strong>Что показывает схема.</strong> Дерево с корнем на ветви Р и на ветви М; некорневое дерево; таблица признаков и собранное дерево</div><p><a href="#ns-g-S15-T24">Корень</a> — самый древний узел дерева. <a href="#ns-g-S15-T25">Некорневое дерево</a> показывает отношения линий, но не направление времени. <a href="#ns-g-S15-T15">Внешняя группа</a> — линия вне изучаемой группы, связанная с ней более древним предком; корень ставят на ветвь между ней и изучаемой группой. Перенос корня на другую ветвь сохраняет некорневое дерево, но меняет клады — то есть гипотезу о родстве. По внешней группе определяют и <a href="#ns-g-S15-T31">предковое состояние</a> признака: состояние у внешней группы считают предковым, другое — производным. Клады выделяют по <a href="#ns-g-S15-T30">общим производным признакам</a>; общие предковые состояния и признаки одного вида порядка ветвлений не показывают.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-rotation">«Поворот ветвей не меняет дерева»</a>; вспомнить <a href="seminar-14-route.html#uneven-clock">семинар 14: «Почему часы идут неравномерно»</a></p><p>Пример: признак есть у К, Л и М, а у Н и внешней группы его нет — К, Л и М объединяет общее производное состояние; если у Л, М и Н нет признака, который есть только у К, это общее предковое состояние, и оно не объединяет Л, М и Н. Без внешней группы или иного допущения (например, о равномерных часах) корень не определён: у некорневого дерева из пяти видов семь возможных мест для корня.</p><p><b>На практикуме.</b> Вкладка 2, шаги 2.3 и 2.5.</p><p><b>Ограничения.</b> Неверно выбранная или слишком далёкая внешняя группа, а также сильно различающиеся скорости замен могут исказить положение корня.</p><div class="static-quiz"><h3>У Л, М и Н нет признака, который есть только у К. Объединяет ли это Л, М и Н?</h3><ol><li><b>А.</b> Да: у них общее отсутствие признака <i>(неверный вариант)</i><br><span class="expl">Отсутствие, как у внешней группы, — предковое состояние; оно не показывает родства</span></li><li><b>Б.</b> Нет: это общее предковое состояние <i>(верный вариант)</i><br><span class="expl">Кладу выделяют по общим производным состояниям</span></li><li><b>В.</b> Да, если их больше, чем видов с признаком <i>(неверный вариант)</i><br><span class="expl">Число видов не важно: важно, какое состояние предковое</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/molbev/msae214">Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214</a></li></ul><p>Расчёт по модели · признаки и виды условны.</p></details></article><article class="card print-unit" id="ns-branch-length"><div class="eyebrow">Как читать дерево · шаг 12 из 33</div><h2>Длина ветви: ничего, замены или время</h2><p class="lead">Одну топологию рисуют тремя способами, и смысл длины ветви задаёт только подпись под деревом.</p><div class="note"><strong>Что показывает схема.</strong> Одна топология в трёх режимах длины ветви с подписью смысла длины</div><p>На <a href="#ns-g-S15-T27">кладограмме</a> длина ветви ничего не означает. На <a href="#ns-g-S15-T28">филограмме</a> <a href="#ns-g-S15-T26">длина ветви</a> пропорциональна числу замен на сайт (сайт — одна позиция выравнивания) вдоль ветви; кончики могут оказаться на разном расстоянии от корня, потому что скорость замен в линиях разная. На <a href="#ns-g-S15-T29">хронограмме</a> длина ветви — время; все современные кончики на одном расстоянии от корня. Переход от замен ко времени требует калибровки и модели часов.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-rotation">«Поворот ветвей не меняет дерева»</a>; вспомнить <a href="seminar-14-route.html#accumulation">семинар 14: «Различия накапливаются со временем»</a></p><p>Длинная ветвь на филограмме означает много замен в этой линии, а не большой возраст вида: у двух сестринских видов общий предок один, и разделились они одновременно.</p><p><b>На практикуме.</b> Вкладка 2, шаг 2.4: при переключении режимов топология не меняется.</p><p><b>Ограничения.</b> На хронограмме внутренние узлы — оценки с интервалом, а не точные даты.</p><div class="static-quiz"><h3>На хронограмме все кончики на одном расстоянии от корня. Почему?</h3><ol><li><b>А.</b> Все виды накопили одинаковое число замен <i>(неверный вариант)</i><br><span class="expl">Это хронограмма, а не филограмма: замены здесь не показаны</span></li><li><b>Б.</b> Длина ветви на этом рисунке ничего не означает <i>(неверный вариант)</i><br><span class="expl">Так на кладограмме; на хронограмме длина — время</span></li><li><b>В.</b> Все современные линии прошли от корня одно время <i>(верный вариант)</i><br><span class="expl">Длина здесь — время</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41579-025-01255-x">Uraki R. et al. SARS-CoV-2 variants: biology, pathogenicity, immunity, and control. Nat Rev Microbiol 2026; 24: 8–28</a></li></ul><p>Схема качественная · длины ветвей условны.</p></details></article><article class="card print-unit" id="ns-support"><div class="eyebrow">Как читать дерево · шаг 13 из 33</div><h2>Поддержка ветви и неопределённость</h2><p class="lead">Одни и те же данные совместимы с несколькими близкими деревьями, поэтому у ветвей указывают поддержку — и её тоже нужно читать правильно.</p><div class="note"><strong>Что показывает схема.</strong> Выравнивание, три псевдовыборки и три дерева; узел-политомия; две длинные ветви, ошибочно объединённые</div><p>При <a href="#ns-g-S15-T32">бутстрэп-анализе</a> столбцы выравнивания многократно отбирают случайно с возвращением, по каждой псевдовыборке заново строят дерево и считают, в какой доле деревьев есть клада. Поддержка 90 % значит, что клада воспроизвелась в 90 % таких деревьев. Это устойчивость к случайной выборке данных, а не вероятность того, что клада истинна. <a href="#ns-g-S15-T33">Политомия</a> — узел с тремя и более ветвями; обычно она означает, что данных для порядка ветвлений не хватает, реже — что линии разошлись почти одновременно; по рисунку эти случаи не различить. <a href="#ns-g-S15-T34">Притяжение длинных ветвей</a> — систематическая ошибка: быстро изменяющиеся линии ошибочно объединяются из-за параллельных и обратных замен, не учтённых моделью.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-root-outgroup">«Корень и внешняя группа; сборка дерева по признакам»</a></p><p>Бутстрэп не учитывает ошибок в выборе генов, видов, выравнивания и модели: систематически неверное дерево может иметь высокую поддержку. Надёжность оценивают по нескольким признакам: устойчивость топологии при смене модели и состава выборки, согласие независимых генов, отсутствие артефактов выравнивания, соответствие другим данным. Число возможных деревьев быстро растёт с числом видов (шаг <a href="#ns-tree-count">«Сколько возможно деревьев»</a>), поэтому дерево ищут вычислительными методами, а не перебором.</p><p><b>На практикуме.</b> Вкладка 2, шаг 2.6.</p><p><b>Ограничения.</b> Порог надёжной поддержки условен и зависит от метода.</p><div class="static-quiz"><h3>Поддержка клады — 98 %. Может ли клада быть неверной?</h3><ol><li><b>А.</b> Может, если в данных есть систематическая ошибка <i>(верный вариант)</i><br><span class="expl">Бутстрэп оценивает только случайную изменчивость выборки</span></li><li><b>Б.</b> Нет: 98 % — почти полная уверенность <i>(неверный вариант)</i><br><span class="expl">Это доля повторов анализа, а не вероятность истинности</span></li><li><b>В.</b> Нет, если выравнивание длинное и чистое <i>(неверный вариант)</i><br><span class="expl">Длинное выравнивание уменьшает случайную ошибку, но не систематическую</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-0233-0">Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444</a></li></ul><p>Схема качественная · псевдовыборки и проценты условны.</p></details></article><article class="card print-unit" id="ns-concordance"><div class="eyebrow">Как читать дерево · шаг 14 из 33</div><h2>Поддержка 1,0 и доля согласных генов</h2><p class="lead">Ветвь дерева может иметь максимальную поддержку, хотя её подтверждает лишь малая доля деревьев отдельных генов.</p><div class="note"><strong>Что показывает схема.</strong> Два столбика поддержки и доли согласных генов для двух групп птиц; кривая доли от длины ветви</div><p>По геномам 363 видов птиц построено дерево; шесть крупных групп имеют максимальную поддержку — апостериорная вероятность 1,0. Для каждой группы посчитали ещё <a href="#ns-g-S15-T35">долю совпадающих деревьев</a> — долю деревьев отдельных генов, в которых эта группа есть. У древненёбных птиц (страусы, нанду, тинаму и родственники) она 100 %, а у новой группы Elementaves — 0,1 %: группа есть целиком лишь в 43 деревьях из 63 000. Если же для Elementaves смотреть на четвёрки видов, порядок ветвления совпадает с деревом видов в 33,9 % случаев — около нижнего предела в 1/3, который даёт неполная сортировка при очень короткой ветви. Поддержка растёт с объёмом данных: уже при 200 генах у 86,7 % ветвей (животные) и 94,3 % (растения) бутстрэп выше 95 %. Доля совпадающих деревьев не растёт: она определяется историей видов — длиной ветви и численностью предков.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-support">«Поддержка ветви и неопределённость»</a></p><p>Почему 0,1 % настолько меньше 33,9 %: соседние ветви тоже очень короткие, и в большинстве деревьев генов подгруппы Elementaves сами не собраны вместе, а ошибки построения деревьев отдельных генов это усиливают. Малая доля согласных генов не значит, что группы нет: при быстром ветвлении большинство генов сохраняет историю, отличную от дерева видов. Значит, дерево видов может быть надёжным, но мало предсказывать историю отдельного гена или признака.</p><p><b>Как это узнали.</b> Для тысяч участков генома построили отдельные деревья и посчитали, в какой доле есть каждая группа дерева видов.</p><p><b>Граница вывода.</b> Доля совпадающих деревьев не показывает, какая часть несовпадений вызвана неполной сортировкой, обменом генами или ошибками построения.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 2.</p><div class="static-quiz"><h3>Почему с ростом числа генов поддержка растёт, а доля совпадающих деревьев — нет?</h3><ol><li><b>А.</b> Новые гены добавляют несовпадения <i>(неверный вариант)</i><br><span class="expl">Гены не добавляют несовпадений: они точнее показывают их долю</span></li><li><b>Б.</b> Доля — свойство истории видов <i>(верный вариант)</i><br><span class="expl">Больше генов — точнее её оценка, но не больше сама доля</span></li><li><b>В.</b> Поддержку завышают ошибки выравнивания <i>(неверный вариант)</i><br><span class="expl">Поддержка растёт закономерно: случайная ошибка выборки уменьшается</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1093/molbev/msae214">Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214</a></li></ul><p>Схема по данным работы, упрощённая · доли измерены; кривая — расчёт по формуле.</p></details></article><article class="card print-unit" id="ns-tree-count"><div class="eyebrow">Как читать дерево · шаг 15 из 33</div><h2>Сколько возможно деревьев</h2><p class="lead">Даже для десятка видов возможных деревьев больше, чем секунд в году.</p><div class="note"><strong>Что показывает схема.</strong> Все три дерева трёх видов; 15 деревьев четырёх видов мелко; число для 5, 10 и 20 видов</div><p>Для трёх видов существует 3 корневых бинарных дерева, для четырёх — 15, для пяти — 105, для шести — 945, для десяти — 34 459 425, для двадцати — около 8,2·10²¹. Каждый новый вид можно присоединить к любой ветви уже существующего дерева, поэтому число деревьев для n видов равно произведению нечётных чисел от 1 до 2n − 3. Перебрать все деревья можно лишь для немногих видов; для больших наборов дерево ищут вычислительными методами, проверяя не все варианты.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-root-outgroup">«Корень и внешняя группа; сборка дерева по признакам»</a>, шаг <a href="#ns-support">«Поддержка ветви и неопределённость»</a></p><p>Модель объясняет, почему поиск лучшего дерева — отдельная задача и почему разные программы могут прийти к разным деревьям при одних данных.</p><p><b>Граница вывода.</b> Это число бинарных деревьев; модель ничего не говорит о том, какие из них лучше объясняют данные.</p><p><b>На практикуме.</b> Вкладка 2, шаг 2.5: для четырёх видов — 15 деревьев.</p><div class="static-quiz"><h3>Сколько корневых бинарных деревьев для пяти видов?</h3><ol><li><b>А.</b> 15 <i>(неверный вариант)</i><br><span class="expl">15 — для четырёх видов</span></li><li><b>Б.</b> 120 <i>(неверный вариант)</i><br><span class="expl">120 — число перестановок пяти видов; деревьев меньше: поворот ветвей не даёт нового дерева</span></li><li><b>В.</b> 105 <i>(верный вариант)</i><br><span class="expl">1 · 3 · 5 · 7 = 105</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-15.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели · точные значения.</p></details></article><article class="card print-unit" id="ns-gene-species-tree"><div class="eyebrow">Дерево гена и дерево видов · шаг 16 из 33</div><h2>Дерево гена и дерево видов</h2><p class="lead">Дерево одного участка генома описывает историю его копий; дерево видов — историю разделения популяций. Они не обязаны совпадать.</p><div class="note"><strong>Что показывает схема.</strong> Четыре панели: дерево видов ((К,Л),М) и дерево гена (Л,М), разные причины несовпадения</div><p><a href="#ns-g-S15-T08">Дерево гена</a> строят по последовательностям одного участка; <a href="#ns-g-S15-T36">дерево видов</a> описывает порядок разделения популяций и видов. Причины несовпадения разные: дупликации и потери копий (если сохранились разные <a href="#ns-g-S15-T06">паралоги</a>, их дерево легко принять за дерево видов); <a href="#ns-g-S15-T38">неполная сортировка линий</a>; <a href="#ns-g-S15-T41">интрогрессия</a> через гибридизацию; <a href="#ns-g-S15-T44">горизонтальный перенос генов</a> вне размножения, особенно у бактерий и архей; рекомбинация внутри участка и ошибки построения деревьев.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-ortho-para">«Ортологи и паралоги: какое событие в общем узле»</a>, шаг <a href="#ns-support">«Поддержка ветви и неопределённость»</a>; вспомнить <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a></p><p>Одно несовпадение может иметь любую из этих причин и само по себе не доказывает ни интрогрессии, ни ошибки. Даже при надёжном дереве видов большинство деревьев генов может иметь другую топологию: по модели при внутренней ветви 0,1 единицы 2Ne поколений не совпадают 60 % деревьев (шаг <a href="#ns-ils">«Неполная сортировка линий»</a>; пример с птицами — шаг <a href="#ns-concordance">«Поддержка 1,0 и доля согласных генов»</a>, сверх программы). Поэтому дерево видов оценивают по многим участкам генома и явно моделируют процессы, порождающие несовпадения.</p><p><b>На практикуме.</b> Вкладка 3, шаг 3.1; «Найти причину» III.</p><p><b>Ограничения.</b> Деление на «дерево гена» и «дерево видов» удобно, но при обмене генами история генома в целом — уже не одно дерево (шаг <a href="#ns-tree-or-network">«Дерево или сеть»</a>).</p><div class="static-quiz"><h3>Дерево одного гена объединяет Л и М, а виды-сёстры — К и Л. Что можно сказать по одному этому дереву?</h3><ol><li><b>А.</b> Причину по одному дереву не назвать <i>(верный вариант)</i><br><span class="expl">Так могут проявиться дупликация и потеря, неполная сортировка, интрогрессия или перенос</span></li><li><b>Б.</b> Произошла интрогрессия между Л и М <i>(неверный вариант)</i><br><span class="expl">Интрогрессия — одна из нескольких причин; нужны данные по многим участкам</span></li><li><b>В.</b> Дерево видов неверно <i>(неверный вариант)</i><br><span class="expl">Одно дерево гена не опровергает дерева видов</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/molbev/msae214">Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214</a></li><li><a href="https://doi.org/10.1038/s41576-020-0233-0">Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444</a></li></ul><p>Схема качественная · четыре условные причины.</p></details></article><article class="card print-unit" id="ns-ils"><div class="eyebrow">Дерево гена и дерево видов · шаг 17 из 33</div><h2>Неполная сортировка линий</h2><p class="lead">Копии гена в популяции имеют общих предков в прошлом; если между двумя разделениями видов они не успели слиться в одну линию, порядок их слияния оказывается случайным.</p><div class="note"><strong>Что показывает схема.</strong> Трубки видов с линиями гена и столбики долей трёх типов деревьев для четырёх сочетаний t и Ne</div><p>Если проследить две копии гена назад, рано или поздно они сходятся к одной копии-предку — это <a href="#ns-g-S15-T37">коалесценция</a> (слияние генных линий). В популяции с <a href="#ns-g-S15-T40">эффективной численностью</a> Ne две копии сливаются в среднем за 2Ne поколений. Пусть виды К и Л разделились недавно, а М — раньше, и между двумя разделениями прошло t поколений. Если за эти t поколений линии К и Л не слились, все три линии доходят до общего предка трёх видов, где первыми сливаются любые две из трёх с равной вероятностью. Тогда дерево участка может не совпасть с деревом видов, и чем больше t по сравнению с 2Ne, тем реже это случается. Это и есть <a href="#ns-g-S15-T38">неполная сортировка линий</a> — следствие сохранения <a href="#ns-g-S15-T39">предкового полиморфизма</a> через последовательные разделения популяций.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-gene-species-tree">«Дерево гена и дерево видов»</a>; вспомнить <a href="seminar-13-route.html#drift">семинар 13: «Генетический дрейф: случайная выборка копий»</a> и <a href="seminar-13-route.html#census-effective">семинар 13: «Фактическая и эффективная численность»</a></p><details><summary>Формула и расчёт</summary><p>При этом дерево участка совпадает с деревом видов с вероятностью 1 − (2/3)·e^(−T), а каждое из двух несовпадающих деревьев встречается с вероятностью (1/3)·e^(−T); здесь T = t/(2Ne), e — основание натуральных логарифмов.</p></details><p>Неполная сортировка — не ошибка метода, а ожидаемое свойство генеалогий. Она часта, когда разделения видов шли быстро одно за другим (малое t) или предковые популяции были велики (большое Ne). Расчёт по модели: при t = 10 000 поколений и Ne = 10 000 (T = t/(2Ne) = 0,5) несовпадающих деревьев 40 %; при t = 160 000 (T = 8) — 0,02 %; при t = 40 000 и Ne = 50 000 (T = 0,4) — 45 %. У человека, шимпанзе и гориллы деревья заметной части генома не совпадают с деревом видов: разделения этих линий разделяет короткий промежуток при большой численности предков.</p><p><b>На практикуме.</b> Вкладка 3, шаги 3.2–3.4.</p><p><b>Ограничения.</b> Формула — для трёх видов, одной копии от каждого и постоянной численности; рекомбинация внутри участка и отбор не учтены.</p><div class="static-quiz"><h3>При какой истории неполная сортировка наиболее часта?</h3><ol><li><b>А.</b> Медленные разделения при малой численности <i>(неверный вариант)</i><br><span class="expl">Тогда T велико: линии успевают слиться, деревья совпадают</span></li><li><b>Б.</b> Быстрые разделения при большой численности предков <i>(верный вариант)</i><br><span class="expl">T = t/(2Ne) мало, линии не успевают слиться</span></li><li><b>В.</b> Любая: от времени она не зависит <i>(неверный вариант)</i><br><span class="expl">Доля несовпадений быстро падает с ростом t</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/molbev/msae214">Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Расчёт по модели · t и Ne условны.</p></details></article><article class="card print-unit" id="ns-introgression"><div class="eyebrow">Дерево гена и дерево видов · шаг 18 из 33</div><h2>Интрогрессия</h2><p class="lead">Участок генома одного вида может войти в генофонд другого через гибридов и их дальнейшее размножение.</p><div class="note"><strong>Что показывает схема.</strong> Хромосомы гибрида и его потомков с убывающими и дробящимися участками донора; дерево перенесённого участка</div><p><a href="#ns-g-S15-T41">Интрогрессия</a> — включение наследственного материала одной линии в генофонд другой через <a href="#ns-g-S15-T42">гибридизацию</a> и последующие <a href="#ns-g-S15-T43">возвратные скрещивания</a> гибридов с одним из родительских видов. В каждом поколении <a href="#ns-g-S15-T47">рекомбинация</a> разбивает участки, полученные от другого вида, на всё более короткие фрагменты; отбор и дрейф меняют их частоту. У перенесённого участка дерево объединяет вид-получатель с видом-донором: история участка повторяет путь обмена, а не порядок разделения видов.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-gene-species-tree">«Дерево гена и дерево видов»</a>; вспомнить <a href="seminar-13-route.html#sources">семинар 13: «Мутации, рекомбинация и поток генов: источники и переносчики изменчивости»</a></p><p>Интрогрессия может переносить полезные варианты (адаптивная интрогрессия, шаг <a href="#ns-preference-introgression">«Ген предпочтения перешёл между видами бабочек»</a>), а может вносить варианты, снижающие приспособленность гибридов, — их удаляет отбор (шаг <a href="#ns-hybrid-selection">«Что отбор делает с чужими участками после гибридизации»</a>). Гибридизация распространена у растений и встречается у многих животных; у человека известна интрогрессия от неандертальцев и денисовцев (<a href="seminar-16-route.html#admixture">семинар 16: «Смешение и интрогрессия»</a>).</p><p><b>На практикуме.</b> Вкладка 3, шаг 3.5.</p><p><b>Ограничения.</b> В модели практикума обмен один и в одну сторону, а перенесённые участки всегда имеют дерево получателя с донором — это упрощение.</p><div class="static-quiz"><h3>Чем интрогрессия отличается от гибридизации?</h3><ol><li><b>А.</b> Это одно и то же: оба слова означают скрещивание видов <i>(неверный вариант)</i><br><span class="expl">Гибридизация — скрещивание; интрогрессия — закрепление перенесённых участков в генофонде вида</span></li><li><b>Б.</b> Интрогрессия идёт без скрещивания, как горизонтальный перенос <i>(неверный вариант)</i><br><span class="expl">Без скрещивания идёт горизонтальный перенос; интрогрессия идёт через гибридов и возвратные скрещивания</span></li><li><b>В.</b> Гибридизация — событие, интрогрессия — её след в генофонде <i>(верный вариант)</i><br><span class="expl">Интрогрессия — возможное следствие гибридизации через многие поколения; гибридизация не всегда к ней ведёт</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li><li><a href="https://doi.org/10.1073/pnas.2309168121">Groh J.S., Coop G. The temporal and genomic scale of selection following hybridization. Proc Natl Acad Sci USA 2024; 121: e2309168121</a></li></ul><p>Схема качественная · доля обмена условна.</p></details></article><article class="card print-unit" id="ns-ils-vs-introgression"><div class="eyebrow">Дерево гена и дерево видов · шаг 19 из 33</div><h2>Как различают неполную сортировку и интрогрессию</h2><p class="lead">Обе причины дают несовпадающие деревья, но по-разному: неполная сортировка — два несовпадающих типа поровну, интрогрессия — избыток одного.</p><div class="note"><strong>Что показывает схема.</strong> Столбики долей трёх типов деревьев без обмена и с обменом; ряд из 100 значков участков</div><p>При одной <a href="#ns-g-S15-T38">неполной сортировке</a> два несовпадающих типа деревьев трёх видов — (Л, М) и (К, М) — равновероятны. <a href="#ns-g-S15-T41">Интрогрессия</a> из М в Л добавляет деревья (Л, М); доли двух других типов при этом немного уменьшаются. Поэтому по многим участкам генома сравнивают доли двух несовпадающих типов: равные доли совместимы с неполной сортировкой, избыток одного типа указывает на обмен генами между соответствующими видами. Расчёт по модели (t = 40 000 поколений, Ne = 10 000, доля обмена 0,1): без обмена — 91 % совпадающих, по 4,5 % каждого несовпадающего типа; с обменом — 82 %, 14 % и 4 %.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-ils">«Неполная сортировка линий»</a>, шаг <a href="#ns-introgression">«Интрогрессия»</a></p><p>Для различения нужно много участков: по 100 участкам случайные колебания легко дают 9 против 6 и без обмена генами. На этой идее основаны методы поиска обмена генами по геномам. Дополнительный признак — длина перенесённых участков: после недавней гибридизации они длинные, со временем рекомбинация дробит их. Избыток одного типа может дать и структура предковых популяций, поэтому вывод об интрогрессии — модельный.</p><p><b>На практикуме.</b> Вкладка 3, шаги 3.4–3.6; «Найти причину» III.</p><p><b>Ограничения.</b> При очень короткой внутренней ветви почти все деревья и так не совпадают, и избыток одного типа заметить труднее.</p><div class="static-quiz"><h3>По 3000 участкам: (Л, М) — 300, (К, М) — 290. Что вероятнее?</h3><ol><li><b>А.</b> Одна неполная сортировка <i>(верный вариант)</i><br><span class="expl">Два несовпадающих типа почти поровну</span></li><li><b>Б.</b> Интрогрессия между Л и М <i>(неверный вариант)</i><br><span class="expl">Избытка (Л, М) нет: 300 и 290 при 3000 участках практически равны</span></li><li><b>В.</b> Ошибка дерева видов <i>(неверный вариант)</i><br><span class="expl">Совпадающих деревьев большинство; дерево видов этим не опровергается</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1093/molbev/msae214">Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Расчёт по модели · 1000 и 100 участков; параметры условны.</p></details></article><article class="card print-unit" id="ns-tree-or-network"><div class="eyebrow">Дерево гена и дерево видов · шаг 20 из 33</div><h2>Дерево или сеть</h2><p class="lead">Разделение линий остаётся в основном ветвящимся процессом, но обмен генами добавляет к дереву перемычки.</p><div class="note"><strong>Что показывает схема.</strong> Дерево и то же дерево с одной перемычкой; три уровня вывода</div><p>Если обмен генами между линиями заметен, историю удобнее изображать <a href="#ns-g-S15-T45">филогенетической сетью</a> — деревом с дополнительными перемычками, по которым часть генома переходила из линии в линию. Слияние линий происходит и при эндосимбиозе (происхождение митохондрий) и при гибридном видообразовании. Но сеть не означает, что реконструкция невозможна: основная часть генома обычно следует дереву видов, а перемычки описывают долю и направление обмена.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-introgression">«Интрогрессия»</a>; вспомнить <a href="seminar-12-route.html#gene-transfer">семинар 12: «Перенос генов в ядро и импорт белков»</a></p><p>Надёжный вывод о расхождении линий строят на трёх уровнях: наблюдение (различаются последовательности, деревья участков не совпадают), модельный вывод (вероятно определённое дерево, направление и доля обмена генами), историческое объяснение (предложенная история лучше альтернатив согласует генетические, географические и экологические данные).</p><p><b>На практикуме.</b> Вкладка 3, режим обмена генами (перемычка).</p><p><b>Ограничения.</b> Чем больше перемычек допускает модель, тем больше данных нужно, чтобы их оценить.</p><div class="static-quiz"><h3>Есть обмен генами между линиями. Значит ли это, что дерево видов теряет смысл?</h3><ol><li><b>А.</b> Да: история становится случайной <i>(неверный вариант)</i><br><span class="expl">Обмен генами — не случайность; его долю и направление оценивают</span></li><li><b>Б.</b> Нет: его дополняют перемычками обмена <i>(верный вариант)</i><br><span class="expl">Основная часть генома следует дереву, перемычки описывают обмен</span></li><li><b>В.</b> Да: виды сливаются в один <i>(неверный вариант)</i><br><span class="expl">Обмен частью генома не означает слияния видов (шаг <a href="#ns-hybrid-species">«Вид гибридного происхождения при постоянном обмене генами»</a>)</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li><li><a href="https://doi.org/10.1038/s41586-024-07263-w">Rosser N. et al. Hybrid speciation driven by multilocus introgression of ecological traits. Nature 2024; 628: 811–817</a></li></ul><p>Схема качественная · сеть условна.</p></details></article><article class="card print-unit" id="ns-preference-introgression"><div class="eyebrow">Дерево гена и дерево видов · шаг 21 из 33</div><h2>Ген предпочтения перешёл между видами бабочек</h2><p class="lead">При гибридизации вид может получить от другого не только окраску, но и предпочтение партнёра с такой окраской.</p><div class="note"><strong>Что показывает схема.</strong> Два дерева трёх видов бабочек — по геному и по участку гена; три отрезка разниц предпочтения с интервалами</div><p>Три вида бабочек Heliconius: H. timareta по геному ближе к H. cydno, но живёт вместе с H. melpomene и, как она, имеет красный рисунок крыльев (у H. cydno он белый). Красный рисунок H. timareta получила от H. melpomene через <a href="#ns-g-S15-T46">адаптивную интрогрессию</a>. Оказалось, что так же перешёл и участок хромосомы 18 с геном regucalcin1, связанным с предпочтением красных самок. На этом участке дерево объединяет H. timareta с H. melpomene, хотя по геному в целом она ближе к H. cydno. Самцы H. timareta и H. melpomene одинаково предпочитают красных самок (разница долей времени ухаживания 0,025, интервал от −0,039 до 0,087), а по сравнению с H. cydno — на 0,74 и 0,71 сильнее.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-introgression">«Интрогрессия»</a>, шаг <a href="#ns-ils-vs-introgression">«Как различают неполную сортировку и интрогрессию»</a></p><p>Из 200 генов участка только у regucalcin1 экспрессия в ткани глаз и мозга различалась во всех сравнениях популяций с разным предпочтением; аллель H. cydno экспрессировался примерно вдвое сильнее. Выключение гена генным редактированием в части клеток у H. melpomene снизило ухаживание за самкой своего вида, но не полёт и питание; предпочтение окраски в этом эксперименте не проверяли. У гибридов участок объясняет лишь часть различия предпочтения между видами.</p><p><b>Как это узнали.</b> Предпочтение измерили в экспериментах с выбором самок; участок нашли у гибридов; перенос между видами показали по геномам популяций; ген выделили по экспрессии и проверили выключением у H. melpomene.</p><p><b>Граница вывода.</b> Механизм действия гена неизвестен; выключение было мозаичным и у части особей ухудшило выживаемость и полёт; другие гены тоже вносят вклад. Это бабочки: на других животных вывод не переносят.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 3.</p><div class="static-quiz"><h3>Почему дерево участка regucalcin1 не совпадает с деревом видов?</h3><ol><li><b>А.</b> Неполная сортировка линий в предках бабочек <i>(неверный вариант)</i><br><span class="expl">Несовпадение именно на участке, связанном с признаком, и признак общий — так проявляется интрогрессия</span></li><li><b>Б.</b> Ошибка выравнивания участка хромосомы 18 <i>(неверный вариант)</i><br><span class="expl">Несовпадение повторяется в разных популяциях и совпадает с участком, связанным с поведением</span></li><li><b>В.</b> Участок перешёл от H. melpomene <i>(верный вариант)</i><br><span class="expl">Его история повторяет путь обмена</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.adj9201">Rossi M. et al. Adaptive introgression of a visual preference gene. Science 2024; 383: 1368–1373</a></li></ul><p>Схема по данным работы, упрощённая · разницы долей измерены с 95 % интервалами.</p></details></article><article class="card print-unit" id="ns-hybrid-selection"><div class="eyebrow">Дерево гена и дерево видов · шаг 22 из 33</div><h2>Что отбор делает с чужими участками после гибридизации</h2><p class="lead">После гибридизации отбор сильнее всего удаляет участки другого вида в первые поколения, пока они ещё длинные.</p><div class="note"><strong>Что показывает схема.</strong> Хромосомы гибридной популяции в поколения 1, 10, 100: участки другого вида дробятся, рядом с вредным вариантом исчезают</div><p>У гибридов участки генома каждого родительского вида поначалу длинные; <a href="#ns-g-S15-T47">рекомбинация</a> в каждом поколении дробит их. Пока участки длинные, вредный для гибрида вариант тянет за собой много соседней ДНК, и отбор против него меняет долю «чужого» происхождения на большом протяжении хромосомы. Сравнив, как доля происхождения от другого вида меняется вдоль генома в крупном и мелком масштабе, авторы оценили: в гибридных популяциях рыб-меченосцев и павианов около 20 %, а у современного человека (участки неандертальского происхождения) около 10–20 % изменчивости этой доли в крупном масштабе связано с систематическим отбором против перенесённых вариантов; это нижние оценки.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-introgression">«Интрогрессия»</a>; вспомнить <a href="seminar-6-route.html#crossing-over">семинар 6: «Кроссинговер и хиазмы: обмен и связь»</a></p><p>Это согласуется с сильным отбором против гибридов ранних поколений: интрогрессия — не только перенос полезного, но и удаление несовместимого. В участках с частой рекомбинацией «чужая» ДНК сохраняется лучше: там вредный вариант быстрее отделяется от соседей.</p><p><b>Как это узнали.</b> Применили к опубликованным геномам гибридных популяций математическое разложение сигнала по масштабам (вейвлет-анализ) и сравнили с ожидаемым при одном дрейфе.</p><p><b>Граница вывода.</b> Оценки в мелком масштабе ненадёжны из-за ограничений методов определения происхождения участков; отбор показан статистически, без названия конкретных генов.</p><p><b>На практикуме.</b> Связано с вкладками 3 и 4 (несовместимость у гибридов).</p><div class="static-quiz"><h3>Почему отбор против чужих участков сильнее всего в первые поколения после гибридизации?</h3><ol><li><b>А.</b> Участки длинные: вредный вариант тянет соседей <i>(верный вариант)</i><br><span class="expl">Рекомбинация потом дробит участки, и отбор затрагивает меньше соседей</span></li><li><b>Б.</b> Гибридов первых поколений больше всего в популяции <i>(неверный вариант)</i><br><span class="expl">Число гибридов здесь не главное: важна длина участков</span></li><li><b>В.</b> Позже вредные варианты становятся полезными <i>(неверный вариант)</i><br><span class="expl">Работа об этом не говорит; меняется длина участков, а не свойства вариантов</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-15.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.2309168121">Groh J.S., Coop G. The temporal and genomic scale of selection following hybridization. Proc Natl Acad Sci USA 2024; 121: e2309168121</a></li></ul><p>Схема по данным работы, упрощённая · доли — нижние оценки из работы.</p></details></article><article class="card print-unit" id="ns-why-species"><div class="eyebrow">Виды и видообразование · шаг 23 из 33</div><h2>Зачем нужно понятие вида</h2><p class="lead">Расхождение линий — непрерывный процесс, а вид — единица, которую нужно определить, чтобы считать, сравнивать и называть.</p><div class="note"><strong>Что показывает схема.</strong> Две популяции на трёх этапах расхождения с толщиной стрелки потока генов</div><p><a href="#ns-g-S15-T48">Вид</a> — основная единица классификации живых организмов и эволюционной истории. <a href="#ns-g-S15-T61">Видообразование</a> — процесс возникновения эволюционно обособленных линий. Так как расхождение постепенно, на одном его этапе две линии ещё обмениваются генами, на другом уже нет; граница «один вид — два вида» проводится по выбранному свойству. Это свойство задаёт <a href="#ns-g-S15-T49">концепция вида</a>, а данные, по которым его оценивают, — <a href="#ns-g-S15-T50">критерии разграничения</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-tree-or-network">«Дерево или сеть»</a></p><p>Различие концепции и критериев важно: концепция отвечает на вопрос «что делает линию видом», критерий — «как это проверить у этих организмов». Разногласие разных критериев часто означает незавершённое расхождение или продолжающийся поток генов, а не ошибку.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.1.</p><p><b>Ограничения.</b> Одной концепции, применимой ко всем организмам и задачам, нет.</p><div class="static-quiz"><h3>Чем концепция вида отличается от критерия разграничения?</h3><ol><li><b>А.</b> Ничем: это синонимы <i>(неверный вариант)</i><br><span class="expl">Это разные вопросы: о свойстве и о данных</span></li><li><b>Б.</b> Концепция — что делает линию видом, критерий — как проверить <i>(верный вариант)</i><br><span class="expl">Например, изоляция и данные о скрещивании</span></li><li><b>В.</b> Концепция нужна для животных, критерий — для растений <i>(неверный вариант)</i><br><span class="expl">И то и другое применяют ко всем организмам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li></ul><p>Схема качественная · этапы расхождения условны.</p></details></article><article class="card print-unit" id="ns-species-concepts"><div class="eyebrow">Виды и видообразование · шаг 24 из 33</div><h2>Концепции вида и их границы</h2><p class="lead">Разные концепции вида опираются на разные свойства — скрещивание, родство, нишу — и поэтому применимы к разным организмам.</p><div class="note"><strong>Что показывает схема.</strong> Четыре концепции вида как линии данных и случай видов-двойников</div><p><a href="#ns-g-S15-T51">Биологическая концепция</a> определяет вид как группу скрещивающихся популяций, <a href="#ns-g-S15-T54">репродуктивно изолированную</a> от других таких групп; она удобна для современных организмов с половым размножением, но неприменима к бесполым формам и ископаемым. <a href="#ns-g-S15-T52">Филогенетическая концепция</a> выделяет наименьшие монофилетические (или диагностируемые) группы; она работает с любыми организмами, но результат зависит от выборки признаков и способа реконструкции дерева. <a href="#ns-g-S15-T53">Экологическая концепция</a> связывает обособленность вида прежде всего с экологическими различиями — с нишей, отличной от ниш других линий, а не с репродуктивной изоляцией; поэтому её используют и при изучении организмов без полового размножения, в том числе бактерий. <a href="#ns-g-S15-T73">Морфологическая концепция</a> выделяет виды по различиям в строении; она применима к ископаемым и к бесполым организмам, но граница между видами по строению бывает произвольной, а виды-двойники по строению не различаются.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-why-species">«Зачем нужно понятие вида»</a></p><p>Морфология, кариотип, геномы и география — источники данных, которые при разграничении видов сопоставляют; при изучении ископаемых другого критерия, кроме строения, обычно нет. Близкие виды бывают почти неразличимы по строению (виды-двойники), а внутри одного вида изменчивость строения бывает велика. Филогенетическая концепция, применённая строго, может разделить на виды популяции, которые свободно скрещиваются.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.1.</p><p><b>Ограничения.</b> Совпадение выводов по разным концепциям делает разграничение надёжным; расхождение требует объяснения.</p><div class="static-quiz"><h3>К каким организмам биологическая концепция неприменима?</h3><ol><li><b>А.</b> К организмам, живущим на одной территории <i>(неверный вариант)</i><br><span class="expl">На одной территории изоляцию как раз можно проверить</span></li><li><b>Б.</b> К близким видам с половым размножением <i>(неверный вариант)</i><br><span class="expl">Для близких видов с половым размножением она применима</span></li><li><b>В.</b> К размножающимся только бесполым путём <i>(верный вариант)</i><br><span class="expl">У них нет скрещивания, по которому определяют изоляцию</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1371/journal.pgen.1005860">Shapiro B.J., Leducq J.-B., Mallet J. What is speciation? PLoS Genet 2016; 12: e1005860</a></li></ul><p>Схема качественная · три линии данных.</p></details></article><article class="card print-unit" id="ns-prezygotic"><div class="eyebrow">Виды и видообразование · шаг 25 из 33</div><h2>Барьеры до образования зиготы</h2><p class="lead">Большинство барьеров между видами действуют ещё до того, как образуется гибридная зигота.</p><div class="note"><strong>Что показывает схема.</strong> Пять барьеров до образования зиготы показаны отдельными рисунками</div><p><a href="#ns-g-S15-T54">Репродуктивная изоляция</a> — совокупное снижение эффективного потока генов между линиями вследствие барьеров. <a href="#ns-g-S15-T55">Презиготические барьеры</a> действуют до образования зиготы: различия в месте размножения, во времени размножения (временная изоляция), в поведении и выборе партнёра (поведенческая), в строении половых органов (механическая), во взаимодействии гамет (гаметическая).</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-species-concepts">«Концепции вида и их границы»</a></p><p>Примеры: у зимних пядениц Inurois punctigera в холодных районах Японии две популяции размножаются в начале и в конце зимы и генетически обособлены (по биологической и филогенетической концепциям — разные виды), а на юге, где зима мягче, разрыва во времени размножения и обособления нет. У наземных улиток одна мутация меняет направление закручивания раковины, и особи с разной закруткой не могут спариваться. Изоляция может быть неполной и различаться по направлению скрещивания.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.2; «Найти причину» IV.</p><p><b>Ограничения.</b> Классификация по времени действия не объясняет происхождения барьера: различие сроков размножения может возникнуть как побочный результат адаптации.</p><div class="static-quiz"><h3>Пыльца одного вида не прорастает на рыльце другого. Какой это барьер?</h3><ol><li><b>А.</b> Презиготический, гаметический <i>(верный вариант)</i><br><span class="expl">Оплодотворения не происходит, зигота не образуется</span></li><li><b>Б.</b> Постзиготический <i>(неверный вариант)</i><br><span class="expl">Постзиготические барьеры действуют после образования зиготы; здесь её нет</span></li><li><b>В.</b> Не барьер: опыление произошло <i>(неверный вариант)</i><br><span class="expl">Опыление — ещё не оплодотворение; барьер действует на этапе гамет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li></ul><p>Схема качественная · примеры по учебнику.</p></details></article><article class="card print-unit" id="ns-postzygotic"><div class="eyebrow">Виды и видообразование · шаг 26 из 33</div><h2>Барьеры после образования зиготы</h2><p class="lead">Если гибрид всё же образовался, барьер может проявиться в его жизнеспособности, плодовитости или у его потомков.</p><div class="note"><strong>Что показывает схема.</strong> Линия развития гибрида с точками действия барьеров после образования зиготы; стрелка усиления изоляции</div><p><a href="#ns-g-S15-T56">Постзиготические барьеры</a> проявляются после оплодотворения: гибрид погибает на ранних стадиях, вырастает, но бесплоден, или его потомки имеют сниженную жизнеспособность и плодовитость. Бесплодие гибрида часто связано с мейозом: если хромосомы родительских видов различаются по строению или числу, гомологичные хромосомы плохо спариваются и неправильно расходятся, и гаметы получаются несбалансированными. Причиной может быть и несовместимость генов (шаг <a href="#ns-dobzhansky-muller">«Модель Добжанского–Мёллера»</a>), в том числе ядерных генов и митохондрий (шаг <a href="#ns-mitonuclear">«Несовместимость ядерных генов и митохондрий у гибридов рыб»</a>).</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-prezygotic">«Барьеры до образования зиготы»</a>; вспомнить <a href="seminar-6-route.html#meiosis-one">семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»</a></p><p>Если гибриды менее приспособлены, отбор может поддерживать признаки, уменьшающие скрещивание видов, — это <a href="#ns-g-S15-T59">усиление изоляции</a>: постзиготический барьер ведёт к усилению презиготического. Но контакт видов может кончиться и устойчивой <a href="#ns-g-S15-T60">гибридной зоной</a> или интрогрессией.</p><p><b>На практикуме.</b> Вкладка 4, шаги 4.3–4.5.</p><p><b>Ограничения.</b> Барьеры обычно складываются из многих компонентов; один барьер редко бывает полным.</p><div class="static-quiz"><h3>Гибриды двух видов здоровы, но бесплодны. Какой это барьер?</h3><ol><li><b>А.</b> Презиготический <i>(неверный вариант)</i><br><span class="expl">Презиготические ба
