рьеры не дают образоваться зиготе</span></li><li><b>Б.</b> Постзиготический <i>(верный вариант)</i><br><span class="expl">Зигота образовалась, барьер проявился в плодовитости гибрида</span></li><li><b>В.</b> Никакой: гибриды живут <i>(неверный вариант)</i><br><span class="expl">Бесплодный гибрид не передаёт генов: поток генов прерван</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li></ul><p>Схема качественная · этапы развития гибрида условны.</p></details></article><article class="card print-unit" id="ns-dobzhansky-muller"><div class="eyebrow">Виды и видообразование · шаг 27 из 33</div><h2>Модель Добжанского–Мёллера</h2><p class="lead">Несовместимость у гибридов может возникнуть без того, чтобы какая-то из линий проходила через вредный генотип.</p><div class="note"><strong>Что показывает схема.</strong> Пути генотипов в двух популяциях и в одной; гибрид и таблица F2 для доминантной и рецессивной несовместимости</div><p><a href="#ns-g-S15-T57">Несовместимость Добжанского–Мёллера</a> — отрицательное взаимодействие (<a href="#ns-g-S15-T58">эпистаз</a>) вариантов разных генов, независимо закрепившихся в разных линиях и впервые встретившихся у гибрида. У предка генотип aabb. В популяции 1 закрепляется новый аллель A, в популяции 2 — новый аллель B. В каждой популяции новый аллель встречается только с предковым аллелем другого гена, и все генотипы на пути (Aabb, AAbb; aaBb, aaBB) жизнеспособны. Сочетание A с B возникает впервые у гибрида — и снижает его жизнеспособность или плодовитость: до гибридизации таких генотипов не было, и отбор на них не действовал.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-postzygotic">«Барьеры после образования зиготы»</a></p><p>Если бы обе замены произошли в одной популяции, на пути был бы генотип с A и B вместе — несовместимый; отбор против него сильный, и такой путь маловероятен. Поэтому такие несовместимости накапливаются главным образом в изолированных популяциях. В зависимости от доминирования несовместимость проявляется уже у гибрида первого поколения или только у его потомков (в модели практикума при рецессивной несовместимости F1 жизнеспособен, а в F2 несовместимы 5/16 потомков: AABb, AABB, AaBB). Ту же модель ещё раньше, в начале XX века, описал У. Бейтсон, поэтому её называют и несовместимостью Бейтсона — Добжанского — Мёллера.</p><p><b>На практикуме.</b> Вкладка 4, шаги 4.3–4.5.</p><p><b>Ограничения.</b> Модель — два гена и одна несовместимость; у реальных видов их много, и они могут затрагивать три гена и больше.</p><div class="static-quiz"><h3>Почему несовместимые аллели не удалил отбор в родительских популяциях?</h3><ol><li><b>А.</b> Отбор не действует на аллели <i>(неверный вариант)</i><br><span class="expl">Действует; но несовместимое сочетание в популяциях не возникало</span></li><li><b>Б.</b> Аллели появились сразу у гибрида <i>(неверный вариант)</i><br><span class="expl">Аллели возникли и закрепились в разных популяциях до гибридизации</span></li><li><b>В.</b> Там они не встречались вместе <i>(верный вариант)</i><br><span class="expl">Каждый новый аллель сочетался только с предковым аллелем другого гена</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-023-06895-8">Moran B.M. et al. A lethal mitonuclear incompatibility in complex I of natural hybrids. Nature 2024; 626: 119–127</a></li></ul><p>Расчёт по модели · жизнеспособность 0,1 условна.</p></details></article><article class="card print-unit" id="ns-geographic-modes"><div class="eyebrow">Виды и видообразование · шаг 28 из 33</div><h2>Географические режимы видообразования</h2><p class="lead">Географические термины описывают, где находятся расходящиеся популяции, но не называют генетического механизма расхождения.</p><div class="note"><strong>Что показывает схема.</strong> Четыре условные карты географических режимов; стрелки потока генов одинаковы</div><p>При <a href="#ns-g-S15-T62">аллопатрическом видообразовании</a> <a href="#ns-g-S15-T67">поток генов</a> прерван пространственным барьером; в каждой популяции накапливаются свои различия под действием мутаций, дрейфа и отбора. <a href="#ns-g-S15-T63">Перипатрическое видообразование</a> — случай аллопатрии, когда новую изолированную популяцию основывает небольшое число особей из крупной предковой популяции; дрейф в такой популяции может изменить частоты аллелей и действие отбора. Видообразование через событие основания считают редким. При <a href="#ns-g-S15-T64">парапатрическом</a> расхождении соседние популяции соприкасаются и обмениваются генами; <a href="#ns-g-S15-T68">дивергентный отбор</a> поддерживает различия, а в зоне контакта частоты меняются плавно (клин). <a href="#ns-g-S15-T65">Симпатрическое видообразование</a> идёт без пространственного барьера: эффективный поток генов уменьшают специализация на разных ресурсах, выбор партнёра, сроки размножения или хромосомные изменения.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-dobzhansky-muller">«Модель Добжанского–Мёллера»</a>; вспомнить <a href="seminar-13-route.html#combined">семинар 13: «Совместное действие: отбор против потока генов и против дрейфа»</a></p><p>После аллопатрии возможен <a href="#ns-g-S15-T66">вторичный контакт</a>: линии могут слиться, образовать гибридную зону, обменяться частью генома или сохранить изоляцию, если барьеры уже сложились. В действительности режимы образуют непрерывный ряд, а поток генов меняется во времени; поэтому в объяснении видообразования отдельно называют пространственную историю популяций, величину и направление потока генов, экологические различия, генетические барьеры и характер вторичного контакта.</p><p><b>На практикуме.</b> Вкладка 4, шаги 4.6–4.7.</p><p><b>Ограничения.</b> Схемы режимов условны; по одной карте ареалов механизм не определить.</p><div class="static-quiz"><h3>Что описывает термин «аллопатрия»?</h3><ol><li><b>А.</b> Пространственное разделение популяций <i>(верный вариант)</i><br><span class="expl">Он говорит о географии, а не о генетическом механизме</span></li><li><b>Б.</b> Механизм несовместимости генов <i>(неверный вариант)</i><br><span class="expl">Несовместимость — генетический механизм; география её не называет</span></li><li><b>В.</b> Расхождение на одной территории <i>(неверный вариант)</i><br><span class="expl">Это симпатрия</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1371/journal.pgen.1005860">Shapiro B.J., Leducq J.-B., Mallet J. What is speciation? PLoS Genet 2016; 12: e1005860</a></li><li><a href="https://doi.org/10.1098/rstb.2008.0076">Butlin R.K., Galindo J., Grahame J.W. Sympatric, parapatric or allopatric: the most important way to classify speciation? Philos Trans R Soc B 2008; 363: 2997–3007</a></li><li><a href="https://doi.org/10.1002/bies.20745">Templeton A.R. The reality and importance of founder speciation in evolution. BioEssays 2008; 30: 470–479</a></li></ul><p>Схема качественная · карты условны.</p></details></article><article class="card print-unit" id="ns-speciation-gene-flow"><div class="eyebrow">Виды и видообразование · шаг 29 из 33</div><h2>Видообразование при потоке генов</h2><p class="lead">Поток генов сглаживает различия популяций, но там, где действует дивергентный отбор, различия могут сохраняться и при обмене генами.</p><div class="note"><strong>Что показывает схема.</strong> Два столбика — нейтральное различие и частота местного варианта — для четырёх значений m</div><p><a href="#ns-g-S15-T67">Поток генов</a> противодействует расхождению: расчёт по модели «материк — остров» — если каждое поколение 1 % особей популяции составляют мигранты из большой соседней популяции, нейтральное различие с ней за 500 поколений сокращается примерно до 0,007 от исходного, а в локусе под местным отбором частота местного варианта остаётся 0,91 (у мигрантов — 0,1); при 10 % мигрантов она падает до 0,33. Дрейф в модели не учтён. Поэтому при умеренном потоке генов различия сохраняются в участках под <a href="#ns-g-S15-T68">дивергентным отбором</a> и в сцепленных с ними участках — <a href="#ns-g-S15-T71">островах расхождения</a> — на фоне остального генома, сближенного потоком генов. Гибридизация может и создавать новые линии: <a href="#ns-g-S15-T69">гибридное видообразование</a> — возникновение обособленной линии гибридного происхождения, изолированной от родительских. У растений оно часто сопровождается удвоением наборов хромосом (<a href="#ns-g-S15-T70">полиплоидия</a>), которое сразу создаёт барьер с родительскими видами.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-geographic-modes">«Географические режимы видообразования»</a></p><p>Чтобы признать вид гибридным без изменения числа хромосом, нужно показать три вещи: изоляцию гибридной линии от родительских, генетические следы гибридизации и то, что изоляция возникла вследствие гибридизации. Одного обнаружения примеси недостаточно.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.6.</p><p><b>Ограничения.</b> В модели поток генов односторонний (из большой соседней популяции) и постоянен, а отбор действует на один локус.</p><div class="static-quiz"><h3>При умеренном потоке генов где сохраняются различия популяций?</h3><ol><li><b>А.</b> Во всём геноме одинаково <i>(неверный вариант)</i><br><span class="expl">Нейтральные участки сближаются потоком генов</span></li><li><b>Б.</b> В участках под дивергентным отбором и рядом с ними <i>(верный вариант)</i><br><span class="expl">Там отбор противодействует сглаживанию различий</span></li><li><b>В.</b> Нигде: поток генов стирает любые различия <i>(неверный вариант)</i><br><span class="expl">Местный отбор удерживает различия в своих участках</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41586-024-07263-w">Rosser N. et al. Hybrid speciation driven by multilocus introgression of ecological traits. Nature 2024; 628: 811–817</a></li></ul><p>Расчёт по модели · доли мигрантов и приспособленности условны.</p></details></article><article class="card print-unit" id="ns-mitonuclear"><div class="eyebrow">Виды и видообразование · шаг 30 из 33</div><h2>Несовместимость ядерных генов и митохондрий у гибридов рыб</h2><p class="lead">Модель Добжанского–Мёллера найдена в природе на молекулярном уровне: ядерные гены одного вида несовместимы с митохондриями другого.</p><div class="note"><strong>Что показывает схема.</strong> Столбики ожидаемой и наблюдаемой доли гомозигот для двух генов; условный контур комплекса I; шкала развития</div><p>Два близких вида рыб-меченосцев разошлись около 250 000 поколений назад и около 100 поколений назад начали скрещиваться в природе. У 943 лабораторных гибридов второго поколения (все с митохондриями одного вида) гомозиготы по ядерному участку другого вида с геном ndufs5 почти отсутствовали — 0,1 % вместо ожидаемых 25 %, а с геном ndufa13 — 3 % вместо 25 %. Белки этих генов в комплексе I дыхательной цепи соприкасаются с белками, закодированными митохондриальной ДНК: это <a href="#ns-g-S15-T72">митохондриально-ядерная несовместимость</a>. Оценка коэффициента отбора против несовместимого генотипа — 0,996 и 0,91; несовместимость почти рецессивна, поэтому гибриды первого поколения жизнеспособны.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-dobzhansky-muller">«Модель Добжанского–Мёллера»</a>; вспомнить <a href="seminar-14-route.html#mtdna">семинар 14: «Митохондриальная ДНК как отдельный случай»</a></p><p>Зародыши с несовместимым ndufs5 не развиваются дальше первых 7 дней беременности (она длится 21–28 дней), с несовместимым ndufa13 — гибнут вскоре после рождения. Оба гена быстро изменялись в линии одного из видов. Митохондрии одного вида при древней гибридизации перешли к третьему виду, и у его гибридов, по-видимому, действует та же несовместимость: несовместимость может переноситься интрогрессией.</p><p><b>Как это узнали.</b> У гибридов определили происхождение каждого участка генома, нашли участки, где одного сочетания почти нет, проследили развитие зародышей и измерили работу комплекса I.</p><p><b>Граница вывода.</b> Это два вида рыб и два гена; по прежним работам, у этих видов могут быть ещё десятки несовместимостей. На других животных и на человека числа не переносят.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 4.</p><p><b>Дальше в курсе «Молекулярная биология».</b> Почему дыхательный аппарат зависит от двух геномов — <a href="https://edu.mazunin.science/seminar-9-route.html#dual-genome">«Молекулярная биология», семинар 9</a>; как разделяют ядерный и митохондриальный вклад в дефект — <a href="https://edu.mazunin.science/seminar-9-route.html#genetic-tests">«Молекулярная биология», семинар 9</a>.</p><div class="static-quiz"><h3>Почему гибриды первого поколения выживают, а часть гибридов второго — нет?</h3><ol><li><b>А.</b> У первого поколения нет митохондрий <i>(неверный вариант)</i><br><span class="expl">Митохондрии есть у всех гибридов</span></li><li><b>Б.</b> Во втором поколении выше мутационная нагрузка <i>(неверный вариант)</i><br><span class="expl">Работа показывает конкретную несовместимость двух генов с митохондриями, а не общую нагрузку</span></li><li><b>В.</b> Несовместимость почти рецессивна <i>(верный вариант)</i><br><span class="expl">Гибнут гомозиготы по ядерному участку другого вида, появляющиеся во втором поколении</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-023-06895-8">Moran B.M. et al. A lethal mitonuclear incompatibility in complex I of natural hybrids. Nature 2024; 626: 119–127</a></li></ul><p>Схема по данным работы, упрощённая · доли и оценки отбора измерены.</p></details></article><article class="card print-unit" id="ns-hybrid-species"><div class="eyebrow">Виды и видообразование · шаг 31 из 33</div><h2>Вид гибридного происхождения при постоянном обмене генами</h2><p class="lead">Вид может сохраняться сотни тысяч лет, хотя 99 % его генома постоянно сближается обменом генами с другим видом.</p><div class="note"><strong>Что показывает схема.</strong> Полоса генома H. elevatus: 99 % как у H. pardalinus, 1 % — 44 острова, в 32 из них участки от H. melpomene; сеть трёх видов</div><p>Бабочка Heliconius elevatus возникла около 180 тыс. лет назад (интервал оценки 137–216 тыс.) как вид гибридного происхождения и живёт вместе с обоими родительскими видами. С H. pardalinus у неё продолжается <a href="#ns-g-S15-T67">поток генов</a>, который сближает около 99 % генома: по большинству участков H. elevatus не отличается от H. pardalinus, и деревья участков объединяют их в 93,2 % окон генома. Различия сохраняются примерно в 1 % генома — в 44 <a href="#ns-g-S15-T71">островах расхождения</a>; в 32 из них есть участки, полученные от другого родительского вида, H. melpomene (вклад H. melpomene в геном — около 0,7 %). В островах — гены окраски, формы крыла, выбора кормового растения, половых феромонов и выбора партнёра.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-speciation-gene-flow">«Видообразование при потоке генов»</a>, шаг <a href="#ns-ils-vs-introgression">«Как различают неполную сортировку и интрогрессию»</a></p><p>Эти признаки удерживают H. elevatus на собственном адаптивном пике и позволяют ей сосуществовать с обоими родителями; по оценке авторов, вид существует не менее 720 000 поколений. Авторы относят свою работу к немногим, где выполнены строгие критерии гибридного видообразования.</p><p><b>Как это узнали.</b> Прочитали геномы бабочек трёх видов из многих популяций, оценили поток генов и время расхождения моделями, а признаки, различающие виды, нашли скрещиваниями.</p><p><b>Граница вывода.</b> Время и доли — модельные оценки с интервалами; убедительных примеров гибридного видообразования у животных немного, и каждый требует такой проверки.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.6 (поток генов и местный отбор).</p><div class="static-quiz"><h3>Как вид сохраняется, если 99 % генома сближается обменом генами?</h3><ol><li><b>А.</b> Различия держатся в 1 % генома под отбором <i>(верный вариант)</i><br><span class="expl">44 острова с генами окраски, выбора партнёра и экологии противостоят потоку генов</span></li><li><b>Б.</b> Обмен генами идёт только с H. melpomene <i>(неверный вариант)</i><br><span class="expl">Наоборот: обмен идёт с H. pardalinus, а с H. melpomene его почти нет</span></li><li><b>В.</b> Вид не сохраняется: он сливается с H. pardalinus <i>(неверный вариант)</i><br><span class="expl">По оценке авторов, вид обособлен не менее 720 000 поколений</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-15.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-024-07263-w">Rosser N. et al. Hybrid speciation driven by multilocus introgression of ecological traits. Nature 2024; 628: 811–817</a></li></ul><p>Схема по данным работы, упрощённая · доли и время — оценки с интервалами.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог · шаг 32 из 33</div><h2>Итоговая задача: от наблюдения к выводу</h2><p class="lead">Сходство, рисунок дерева, несовпадение деревьев и отсутствие гибридов — наблюдения; родство, история обмена генами и барьер — выводы, и для каждого нужны свои данные.</p><div class="note"><strong>Что показывает схема.</strong> Четыре карточки «наблюдение → вывод → что проверить»</div><p>Четыре наблюдения практикума: (I) ген вида 1 сходен с геном вида 2 на 95 %, с геном вида 3 — на 80 %: <a href="#ns-g-S15-T03">гомология</a> вероятна, но о родстве видов по этому судить нельзя, пока не установлено, что сравниваются <a href="#ns-g-S15-T05">ортологи</a>, и не проверены выравнивание и другие гены; (II) два рисунка с разным порядком кончиков — одно дерево, если совпадают <a href="#ns-g-S15-T21">клады</a>, корень и подпись длины ветви; (III) по 2000 участкам 400 деревьев (Л, М) против 100 (К, М) — избыток одного несовпадающего типа указывает на <a href="#ns-g-S15-T41">интрогрессию</a> (или структуру предковых популяций), а не на одну <a href="#ns-g-S15-T38">неполную сортировку</a>; (IV) гибриды первого поколения нормальны, а их потомки часто гибнут — <a href="#ns-g-S15-T56">постзиготический барьер</a>, вероятно рецессивная <a href="#ns-g-S15-T57">несовместимость Добжанского–Мёллера</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-alignment-matters">«Почему выравнивание не нейтральная операция»</a>, шаг <a href="#ns-rotation">«Поворот ветвей не меняет дерева»</a>, шаг <a href="#ns-ils-vs-introgression">«Как различают неполную сортировку и интрогрессию»</a>, шаг <a href="#ns-dobzhansky-muller">«Модель Добжанского–Мёллера»</a></p><p>Общий порядок: (1) назвать уровень наблюдения — сходство, рисунок, доля деревьев, жизнеспособность; (2) перечислить совместимые объяснения; (3) указать данные, дающие каждому объяснению положительный признак; (4) если данных нет, сказать «по этим данным различить нельзя».</p><p><b>На практикуме.</b> Итоговая задача под вкладкой 4.</p><div class="static-quiz"><h3>Почему избыток деревьев (Л, М) над (К, М) указывает на обмен генами?</h3><ol><li><b>А.</b> Деревья (Л, М) всегда самые частые <i>(неверный вариант)</i><br><span class="expl">Самые частые — деревья, совпадающие с деревом видов</span></li><li><b>Б.</b> Без обмена их было бы поровну <i>(верный вариант)</i><br><span class="expl">При одной неполной сортировке два несовпадающих типа равны, а интрогрессия добавляет деревья одного типа; похожий избыток может дать и структура предковых популяций</span></li><li><b>В.</b> Избыток показывает ошибку дерева видов <i>(неверный вариант)</i><br><span class="expl">Дерево видов подтверждает большинство участков; избыток касается несовпадающих</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-15.html#q1">Вопрос 1 →</a> <a href="seminar-15.html#q2">Вопрос 2 →</a> <a href="seminar-15.html#q3">Вопрос 3 →</a> <a href="seminar-15.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/molbev/msae214">Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214</a></li><li><a href="https://doi.org/10.1038/s41586-023-06895-8">Moran B.M. et al. A lethal mitonuclear incompatibility in complex I of natural hybrids. Nature 2024; 626: 119–127</a></li></ul><p>Схема качественная · четыре ситуации условны.</p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог · шаг 33 из 33</div><h2>Связи и что дальше</h2><p class="lead"></p><ol class="mech"></ol><h3>Что понадобилось из прежних семинаров</h3><ul><li><a href="seminar-12-route.html#reconstruction">семинар 12: «Как реконструируют свойства LUCA»</a> — гомология, ортологи и паралоги</li><li><a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a> — почему история гена отличается от истории линии</li><li><a href="seminar-12-route.html#gene-transfer">семинар 12: «Перенос генов в ядро и импорт белков»</a> — слияние линий при эндосимбиозе</li><li><a href="seminar-13-route.html#drift">семинар 13: «Генетический дрейф: случайная выборка копий»</a> и <a href="seminar-13-route.html#census-effective">семинар 13: «Фактическая и эффективная численность»</a> — почему копии генов сливаются случайно и как это зависит от численности</li><li><a href="seminar-13-route.html#combined">семинар 13: «Совместное действие: отбор против потока генов и против дрейфа»</a> — поток генов и местный отбор</li><li><a href="seminar-14-route.html#change-types">семинар 14: «Типы изменений: замена, вставка и делеция, структурные изменения»</a> — что обозначает пропуск</li><li><a href="seminar-14-route.html#accumulation">семинар 14: «Различия накапливаются со временем»</a> — длина ветви в заменах</li><li><a href="seminar-6-route.html#meiosis-one">семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»</a> — почему гибриды бывают бесплодны</li></ul><h3>Где это понадобится дальше в разделе</h3><ul><li>шаг <a href="#ns-introgression">«Интрогрессия»</a>, шаг <a href="#ns-ils-vs-introgression">«Как различают неполную сортировку и интрогрессию»</a> → <a href="seminar-16-route.html#admixture">семинар 16: «Смешение и интрогрессия»</a> — у современных неафриканцев около 2 % генома отнесено к неандертальскому происхождению</li><li>шаг <a href="#ns-introgression">«Интрогрессия»</a>, шаг <a href="#ns-ils-vs-introgression">«Как различают неполную сортировку и интрогрессию»</a> → <a href="seminar-16-route.html#locus-vs-population">семинар 16: «История участка и история популяции — не одно и то же»</a> — общий участок двух популяций объясняют неполной сортировкой, интрогрессией или отбором и различают по длине участка и времени расхождения его копий</li><li>шаг <a href="#ns-species-concepts">«Концепции вида и их границы»</a> → <a href="seminar-16-route.html#early-homo">семинар 16: «Ранний Homo и проблема определения рода»</a> — границу рода, как и границу вида, проводят по набору признаков, и разные наборы дают разные границы</li><li>шаг <a href="#ns-tree-or-network">«Дерево или сеть»</a> → <a href="seminar-16-route.html#archaic-lineages">семинар 16: «Неандертальцы и денисовцы как генетические линии»</a> — родственные линии человека обменивались генами, поэтому их историю изображают деревом с дугами обмена</li></ul><h3>Что дальше в курсе</h3><ul><li><a href="seminar-16-route.html">семинар 16: «Эволюция человека и эволюционная медицина: от ископаемых и геномов к отбору в организме»</a> — интрогрессия от неандертальцев и денисовцев, деревья и сети в истории человека; продолжает шаг <a href="#ns-introgression">«Интрогрессия»</a>, шаг <a href="#ns-ils-vs-introgression">«Как различают неполную сортировку и интрогрессию»</a>, шаг <a href="#ns-tree-or-network">«Дерево или сеть»</a></li><li>Шаги-продолжения: <a href="seminar-16-route.html#archaic-lineages">семинар 16: «Неандертальцы и денисовцы как генетические линии»</a>, <a href="seminar-16-route.html#admixture">семинар 16: «Смешение и интрогрессия»</a>, <a href="seminar-16-route.html#locus-vs-population">семинар 16: «История участка и история популяции — не одно и то же»</a></li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Почему дыхательный аппарат зависит от двух геномов — <a href="https://edu.mazunin.science/seminar-9-route.html#dual-genome">«Молекулярная биология», семинар 9</a> — продолжает шаг <a href="#ns-mitonuclear">«Несовместимость ядерных генов и митохондрий у гибридов рыб»</a></li><li>Почему эффект FOXO зависит от паралога и ткани — <a href="https://edu.mazunin.science/seminar-6-route.html#foxo-paralogs">«Молекулярная биология», семинар 6</a> — продолжает шаг <a href="#ns-ortho-para">«Ортологи и паралоги: какое событие в общем узле»</a></li><li>Как разделяют ядерный и митохондриальный вклад в дефект — <a href="https://edu.mazunin.science/seminar-9-route.html#genetic-tests">«Молекулярная биология», семинар 9</a> — продолжает шаг <a href="#ns-mitonuclear">«Несовместимость ядерных генов и митохондрий у гибридов рыб»</a></li></ul><div class="static-quiz"><h3>Где в курсе разбирается, как дерево гена может не совпасть с деревом линий из-за переноса и потерь генов?</h3><ol><li><b>А.</b> В теме о мейозе <i>(неверный вариант)</i><br><span class="expl">Там — как расходятся гомологичные хромосомы: <a href="seminar-6-route.html#meiosis-one">семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»</a>; история генов и линий разбирается в другом месте.</span></li><li><b>Б.</b> В теме о происхождении клетки <i>(верный вариант)</i><br><span class="expl">История гена и история линии расходятся из-за дупликаций, потерь и переноса: <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a>.</span></li><li><b>В.</b> В теме о популяционной генетике <i>(неверный вариант)</i><br><span class="expl">Там — частоты аллелей, дрейф и поток генов; несовпадение деревьев генов и линий из-за переноса — <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a>.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-15.html#q1">Вопрос 1 →</a> <a href="seminar-15.html#q2">Вопрос 2 →</a> <a href="seminar-15.html#q3">Вопрос 3 →</a> <a href="seminar-15.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S15-T01"><dt>Филогенетика</dt><dd>Раздел биологии, восстанавливающий родственные связи организмов, популяций и генов по их современным и ископаемым признакам.</dd></div><div id="ns-g-S15-T02"><dt>Филогенетическое дерево</dt><dd>Схема родства линий, на которой ветви расходятся от общих предков (узлов дерева); строится по различиям последовательностей генов (с помощью моделей их изменения) или признаков и является моделью, а не наблюдением.</dd></div><div id="ns-g-S15-T03"><dt>Гомология</dt><dd>Сходство, обусловленное общим происхождением; гомологичные гены происходят от общего предкового гена. В этом семинаре: гомология либо есть, либо нет и не выражается процентом сходства.</dd></div><div id="ns-g-S15-T04"><dt>Аналогия</dt><dd>Сходство признаков по функции или форме без общего происхождения данного признака.</dd></div><div id="ns-g-S15-T05"><dt>Ортологи</dt><dd>Гомологичные гены разных линий, разошедшиеся при разделении линий. В этом семинаре: сравнивают гены разных видов, разошедшиеся при разделении видов.</dd></div><div id="ns-g-S15-T06"><dt>Паралоги</dt><dd>Гомологичные гены, возникшие при дупликации в одной линии. В этом семинаре: после разделения видов паралоги оказываются и в разных видах.</dd></div><div id="ns-g-S15-T07"><dt>Дупликация гена</dt><dd>Возникновение второй копии гена в геноме.</dd></div><div id="ns-g-S15-T08"><dt>Дерево гена</dt><dd>Схема родства последовательностей одного гена у разных организмов; может не совпадать с деревом клеточных линий. В этом семинаре: дерево гена или участка генома сравнивают с деревом видов.</dd></div><div id="ns-g-S15-T09"><dt>Множественное выравнивание</dt><dd>Расположение нескольких последовательностей одна под другой так, чтобы в каждом столбце стояли позиции предположительно общего происхождения.</dd></div><div id="ns-g-S15-T10"><dt>Позиционная гомология</dt><dd>Общее происхождение отдельных позиций последовательностей от одной позиции предковой последовательности; каждый столбец выравнивания — гипотеза о ней.</dd></div><div id="ns-g-S15-T11"><dt>Пропуск</dt><dd>Знак «—» в выравнивании, обозначающий, что в этой последовательности в данной позиции нет нуклеотида или аминокислоты из-за вставки в другой последовательности или делеции в этой.</dd></div><div id="ns-g-S15-T12"><dt>Вставка и делеция</dt><dd>Добавление или утрата одного или нескольких нуклеотидов.</dd></div><div id="ns-g-S15-T13"><dt>Модель замен</dt><dd>Вероятностное описание того, как и с какой частотой одни нуклеотиды или аминокислоты заменяются другими; позволяет учесть невидимые повторные замены.</dd></div><div id="ns-g-S15-T14"><dt>Насыщение</dt><dd>Потеря информации при сильном расхождении: повторные замены в одной позиции не видны, и различия растут медленнее времени.</dd></div><div id="ns-g-S15-T15"><dt>Внешняя группа</dt><dd>Вид или группа, отделившиеся раньше сравниваемых; по ней определяют предковое состояние и неравенство скоростей. В этом семинаре: по внешней группе ставят корень дерева.</dd></div><div id="ns-g-S15-T16"><dt>Структурно расходящийся участок</dt><dd>Участок генома, устроенный у одной линии иначе, чем у сравниваемых (перестроенный, удвоенный, повторяющийся или без соответствия), и поэтому не выравнивающийся один к одному.</dd></div><div id="ns-g-S15-T17"><dt>Кончик (лист) дерева</dt><dd>Конечная точка дерева, соответствующая включённому в анализ виду, популяции или последовательности.</dd></div><div id="ns-g-S15-T18"><dt>Внутренний узел</dt><dd>Точка ветвления дерева, изображающая реконструируемого общего предка отходящих от неё линий.</dd></div><div id="ns-g-S15-T19"><dt>Ветвь</dt><dd>Линия дерева между двумя узлами или между узлом и кончиком.</dd></div><div id="ns-g-S15-T20"><dt>Топология</dt><dd>Порядок соединения ветвей дерева, без учёта их длин и расположения на рисунке.</dd></div><div id="ns-g-S15-T21"><dt>Клада</dt><dd>Группа, включающая общего предка и всех его потомков (монофилетическая группа).</dd></div><div id="ns-g-S15-T22"><dt>Сестринские группы</dt><dd>Две линии, отходящие от одного узла дерева и поэтому более близкие друг к другу, чем к любой другой линии.</dd></div><div id="ns-g-S15-T23"><dt>Последний общий предок</dt><dd>Самый поздний узел дерева, от которого происходят обе сравниваемые линии; по его возрасту судят о родстве.</dd></div><div id="ns-g-S15-T24"><dt>Корень дерева</dt><dd>Самый древний узел, от которого происходят все линии дерева; задаёт направление от предков к потомкам.</dd></div><div id="ns-g-S15-T25"><dt>Некорневое дерево</dt><dd>Дерево, показывающее отношения линий без указания, какой узел древнее.</dd></div><div id="ns-g-S15-T26"><dt>Длина ветви</dt><dd>Число замен на сайт (или время) вдоль ветви дерева; что означает длина, подписывают на каждом дереве. В этом семинаре: на кладограмме длина ветви ничего не означает.</dd></div><div id="ns-g-S15-T27"><dt>Кладограмма</dt><dd>Изображение дерева, на котором длины ветвей ничего не означают.</dd></div><div id="ns-g-S15-T28"><dt>Филограмма</dt><dd>Изображение дерева, на котором длина ветви пропорциональна числу замен на сайт.</dd></div><div id="ns-g-S15-T29"><dt>Хронограмма</dt><dd>Изображение дерева, на котором длина ветви пропорциональна времени.</dd></div><div id="ns-g-S15-T30"><dt>Общий производный признак</dt><dd>Состояние признака, отличное от предкового и общее для нескольких линий; по таким признакам выделяют клады.</dd></div><div id="ns-g-S15-T31"><dt>Предковое состояние</dt><dd>Состояние признака у общего предка; обычно определяется по внешней группе.</dd></div><div id="ns-g-S15-T32"><dt>Бутстрэп-поддержка</dt><dd>Доля деревьев с данной кладой среди деревьев, построенных по псевдовыборкам столбцов выравнивания, выбранных с возвращением; мера устойчивости клады к случайной выборке данных.</dd></div><div id="ns-g-S15-T33"><dt>Политомия</dt><dd>Узел дерева с тремя и более дочерними ветвями.</dd></div><div id="ns-g-S15-T34"><dt>Притяжение длинных ветвей</dt><dd>Систематическая ошибка, при которой быстро изменяющиеся линии ошибочно объединяются из-за параллельных и обратных замен.</dd></div><div id="ns-g-S15-T35"><dt>Доля совпадающих деревьев (фактор согласованности)</dt><dd>Доля деревьев отдельных участков генома, в которых есть данная клада дерева видов.</dd></div><div id="ns-g-S15-T36"><dt>Дерево видов</dt><dd>Схема порядка разделения популяций и видов.</dd></div><div id="ns-g-S15-T37"><dt>Коалесценция</dt><dd>Слияние двух генных линий при прослеживании назад во времени: момент, когда две копии гена происходят от одной копии-предка.</dd></div><div id="ns-g-S15-T38"><dt>Неполная сортировка линий</dt><dd>Сохранение нескольких предковых генных линий через последовательные разделения популяций, из-за которого дерево участка генома может не совпадать с деревом видов.</dd></div><div id="ns-g-S15-T39"><dt>Предковый полиморфизм</dt><dd>Существование нескольких вариантов участка генома в предковой популяции до разделения видов.</dd></div><div id="ns-g-S15-T40"><dt>Эффективная численность (Ne)</dt><dd>Численность идеальной популяции, в которой дрейф шёл бы с той же скоростью, что в реальной.</dd></div><div id="ns-g-S15-T41"><dt>Интрогрессия</dt><dd>Включение наследственного материала одной линии в генофонд другой через гибридизацию и последующие возвратные скрещивания.</dd></div><div id="ns-g-S15-T42"><dt>Гибридизация</dt><dd>Скрещивание особей разных видов или генетически различающихся популяций.</dd></div><div id="ns-g-S15-T43"><dt>Возвратное скрещивание</dt><dd>Скрещивание гибрида с особью одного из родительских видов или популяций.</dd></div><div id="ns-g-S15-T44"><dt>Горизонтальный перенос генов</dt><dd>Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями.</dd></div><div id="ns-g-S15-T45"><dt>Филогенетическая сеть</dt><dd>Изображение истории линий в виде дерева с дополнительными перемычками, по которым часть генома переходила из линии в линию.</dd></div><div id="ns-g-S15-T46"><dt>Адаптивная интрогрессия</dt><dd>Интрогрессия варианта, частота которого у линии-получателя выросла под действием положительного отбора.</dd></div><div id="ns-g-S15-T47"><dt>Рекомбинация</dt><dd>Образование новых сочетаний аллелей при мейозе: при кроссинговере и независимом расхождении хромосом.</dd></div><div id="ns-g-S15-T48"><dt>Вид</dt><dd>Основная единица классификации и эволюционной истории; совокупность популяций, обособленная от других по свойству, которое задаёт выбранная концепция вида.</dd></div><div id="ns-g-S15-T49"><dt>Концепция вида</dt><dd>Представление о том, какое свойство делает линию видом.</dd></div><div id="ns-g-S15-T50"><dt>Критерии разграничения видов</dt><dd>Наблюдаемые признаки и данные, по которым оценивают обособленность линии.</dd></div><div id="ns-g-S15-T51"><dt>Биологическая концепция вида</dt><dd>Вид — группа скрещивающихся популяций, репродуктивно изолированная от других таких групп.</dd></div><div id="ns-g-S15-T52"><dt>Филогенетическая концепция вида</dt><dd>Вид — наименьшая монофилетическая или диагностируемая группа организмов.</dd></div><div id="ns-g-S15-T53"><dt>Экологическая концепция вида</dt><dd>Вид — линия, обособленность которой от других линий определяется прежде всего различием экологических ниш, а не репродуктивной изоляцией.</dd></div><div id="ns-g-S15-T54"><dt>Репродуктивная изоляция</dt><dd>Совокупное снижение эффективного потока генов между линиями вследствие барьеров до и после образования зиготы.</dd></div><div id="ns-g-S15-T55"><dt>Презиготический барьер</dt><dd>Барьер, препятствующий образованию гибридной зиготы: различия в месте и времени размножения, поведении, строении половых органов, взаимодействии гамет.</dd></div><div id="ns-g-S15-T56"><dt>Постзиготический барьер</dt><dd>Барьер, проявляющийся после образования гибридной зиготы: нежизнеспособность или бесплодие гибридов и их потомков.</dd></div><div id="ns-g-S15-T57"><dt>Несовместимость Добжанского–Мёллера</dt><dd>Снижение жизнеспособности или плодовитости гибрида из-за взаимодействия вариантов разных генов, независимо закрепившихся в разных линиях и впервые встретившихся у гибрида.</dd></div><div id="ns-g-S15-T58"><dt>Эпистаз</dt><dd>Зависимость эффекта варианта одного гена от вариантов других генов.</dd></div><div id="ns-g-S15-T59"><dt>Усиление изоляции</dt><dd>Усиление отбором барьеров до образования зиготы, когда гибриды менее приспособлены.</dd></div><div id="ns-g-S15-T60"><dt>Гибридная зона</dt><dd>Область контакта двух популяций или видов, где образуются и живут гибриды.</dd></div><div id="ns-g-S15-T61"><dt>Видообразование</dt><dd>Процесс возникновения эволюционно обособленных линий.</dd></div><div id="ns-g-S15-T62"><dt>Аллопатрическое видообразование</dt><dd>Расхождение популяций, разделённых пространственным барьером.</dd></div><div id="ns-g-S15-T63"><dt>Перипатрическое видообразование</dt><dd>Случай аллопатрического видообразования, при котором новую изолированную популяцию основывает небольшое число особей из крупной предковой популяции.</dd></div><div id="ns-g-S15-T64"><dt>Парапатрическое видообразование</dt><dd>Расхождение соседних популяций с соприкасающимися ареалами, обменивающихся генами в зоне контакта.</dd></div><div id="ns-g-S15-T65"><dt>Симпатрическое видообразование</dt><dd>Расхождение популяций без пространственного барьера, на одной территории.</dd></div><div id="ns-g-S15-T66"><dt>Вторичный контакт</dt><dd>Встреча популяций, расходившихся в изоляции, после исчезновения пространственного барьера.</dd></div><div id="ns-g-S15-T67"><dt>Поток генов</dt><dd>Перенос генетических вариантов между популяциями с мигрирующими особями или гаметами.</dd></div><div id="ns-g-S15-T68"><dt>Дивергентный отбор</dt><dd>Отбор, благоприятствующий разным вариантам или значениям признака в разных популяциях или средах.</dd></div><div id="ns-g-S15-T69"><dt>Гибридное видообразование</dt><dd>Возникновение эволюционно обособленной линии гибридного происхождения, репродуктивно изолированной от родительских линий.</dd></div><div id="ns-g-S15-T70"><dt>Полиплоидия</dt><dd>Увеличение числа наборов хромосом в клетке больше двух.</dd></div><div id="ns-g-S15-T71"><dt>Остров расхождения</dt><dd>Участок генома, различающийся между популяциями или видами на фоне участков, сближенных потоком генов.</dd></div><div id="ns-g-S15-T72"><dt>Митохондриально-ядерная несовместимость</dt><dd>Несовместимость гибрида, при которой продукты ядерных генов одного вида плохо работают с продуктами митохондриальных генов другого.</dd></div><div id="ns-g-S15-T73"><dt>Морфологическая концепция вида</dt><dd>Вид — группа организмов, отличающаяся от других по строению; применима к ископаемым и бесполым организмам, но границы видов по строению бывают произвольными.</dd></div><div id="ns-g-S15-T74"><dt>Сходство последовательностей</dt><dd>Доля совпадающих позиций в выравнивании двух последовательностей; измеряемая величина, а не мера родства.</dd></div></dl></section></noscript>

на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: восемь сценариев и итоговая задача","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите результат, откройте схему и сопоставьте её с разбором. Переключатели показывают предсказания учебной модели, а не результат эксперимента: правила модели заданы заранее, а их основания и границы — в шагах «Объяснений».","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Шаг относится ко всем вкладкам практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Филогенетика и видообразование: от сходства последовательностей к истории линий","num_fmt":"Тема {n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Раздел III","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →","base_prep":"Базовая подготовка","back_base":"← Вернуться к базовому шагу","viewed_label":"Просмотрено шагов","viewed":"просмотрен","stats":[["4 темы","что сравниваем; как читать дерево; дерево гена и дерево видов; виды и видообразование"],["33 шага","24 базовых — к коллоквиуму, 8 — сверх программы"],["10 вопросов","самопроверка по базовому уровню"]],"all_sections":"Все разделы","short_route":"Если времени мало: десять шагов, по которым построена самопроверка →"},"lessons":[{"id":"phylo-what","num":1,"section":0,"questions":[1],"title":"Что реконструирует филогенетика","keywords":["Филогенетика","Филогенетическое дерево","Гомология"],"lead":["Прошлое не наблюдают: последовательности и признаки современных организмов — наблюдение, а история их расхождения — реконструкция по этим данным."],"mechanism":["[[T01|Филогенетика]] восстанавливает родственные связи организмов, популяций и генов. Её результат — [[T02|филогенетическое дерево]]: схема, на которой линии расходятся от общих предков. Между данными и деревом несколько шагов, и каждый — допущение: какие объекты сравнивать; что у них общего происхождения ([[T03|гомология]]); какие позиции последовательностей соответствуют друг другу; как последовательности меняются; какое дерево лучше объясняет различия; насколько оно надёжно. Поэтому дерево — модель, а не запись прошлого."],"paragraphs":["Дерево показывает порядок расхождения линий, а не лестницу от «низших» организмов к «высшим». Все современные линии прошли одинаковое время от общего предка; различаются скорость и направление их изменений. Процент совпадающих позиций помогает подобрать последовательности для сравнения, но сам по себе родства не измеряет: он зависит от скорости замен, длины последовательности, выравнивания и от того, что сравнивают.","<b>На практикуме.<\/b> Вкладки 1–4: шкала этапов на вкладке 2 показывает путь от данных к дереву.","<b>Ограничения.<\/b> Дерево описывает только включённые в анализ линии; вымершие линии, не оставившие потомков, на нём обычно не видны."],"conditions":"Схема качественная · этапы — учебная последовательность.","sources":["src_01","src_03"],"base":"вспомнить [[seminar-12-route.html#luca|семинар 12: «LUCA: последний, а не первый»]] и [[seminar-12-route.html#four-statuses|семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»]]","quiz":{"id":"S15-L01","question":"Что из перечисленного — наблюдение?","options":[{"id":"S15-L01-1","text":"Последовательности гена у пяти видов","correct":true,"feedback":"Их прочитали; дерево по ним — реконструкция"},{"id":"S15-L01-2","text":"Порядок расхождения пяти видов","correct":false,"feedback":"Порядок расхождения выводят по данным с допущениями — это реконструкция"},{"id":"S15-L01-3","text":"Последовательность гена их общего предка","correct":false,"feedback":"Предка не прочитать: его последовательность восстанавливают по потомкам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как от данных приходят к дереву?","status":"Схема качественная · этапы — учебная последовательность","modes_label":"Этап","modes":["данные","гомология","выравнивание","модель и дерево","поддержка"],"args":[{"step":1},{"step":2},{"step":3},{"step":4},{"step":5}],"notes":["Наблюдение: последовательности современных видов","Гомология: отбирают ортологи; паралог серым","Выравнивание: столбцы — гипотеза о соответствии позиций","Модель замен и выбор дерева","Поддержка: насколько дерево устойчиво к выборке данных"],"static":["Пять этапов от последовательностей к дереву с поддержкой; на каждом — допущение"],"scene":"s15_r_pipeline","L":{"r15_pipe_h":"От данных к дереву (этапы — учебная последовательность)","r15_pipe_1":"данные","r15_pipe_2":"гомология","r15_pipe_3":"выравнивание","r15_pipe_4":"модель и дерево","r15_pipe_5":"поддержка","r15_pipe_seq":"последовательности видов К, Л, М","r15_pipe_para":"паралог (серый, не берётся)","r15_pipe_hom":"гомологичные гены","r15_pipe_cols":"столбцы выравнивания","r15_pipe_model":"модель замен → дерево","tr_len_none":"Длина ветви: ничего не означает","tr_out":"внешняя группа","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_pipe_sup":"число у узла — поддержка ветви, % (условно)"}},"zoomNarrow":true}},{"id":"homology","num":2,"section":0,"questions":[1],"title":"Гомология: общее происхождение, а не процент сходства","keywords":["Гомология","Сходство последовательностей","Аналогия"],"lead":["Сходство измеряют, гомологию выводят: два гена либо происходят от одного предкового гена, либо нет."],"mechanism":["[[T03|Гомология]] — общее происхождение признаков или последовательностей от одного предкового состояния. Это утверждение о происхождении, а не число; [[T74|сходство последовательностей]] — доля совпадающих позиций выравнивания — его основание, но не мера: выражение «гомологичны на 80 %» смешивает родство с процентом совпадающих позиций. Сходство без общего происхождения данного признака — [[T04|аналогия]]: крылья птицы и насекомого похожи по функции, но возникли независимо. На уровне последовательностей одна и та же замена тоже может возникнуть независимо в разных линиях — такое совпадение не говорит о родстве."],"paragraphs":["Пример из медицины. У разных вариантов вируса SARS-CoV-2 одни и те же замены в белке шипа (например, N501Y) возникали неоднократно и независимо. Совпадение позиции у двух вариантов поэтому не доказывает, что один произошёл от другого: это проверяют по дереву многих позиций генома. Гомологию генов признают, когда сходство выше ожидаемого случайно и его лучше объясняет общее происхождение; надёжнее всего — по дереву генного семейства.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.1.","<b>Ограничения.<\/b> Порога сходства, после которого гены гомологичны, нет: давно разошедшиеся гомологичные гены могут быть сходны слабо."],"conditions":"Схема качественная · примеры условны.","sources":["src_01","src_11"],"base":"БИО-15·1; вспомнить [[seminar-12-route.html#reconstruction|семинар 12: «Как реконструируют свойства LUCA»]]","quiz":{"id":"S15-L02","question":"Два белка сходны на 30 %, и у обоих одинаковое строение активного центра. Что из этого — вывод о происхождении?","options":[{"id":"S15-L02-1","text":"Белки гомологичны на 30 %, как показывает сравнение","correct":false,"feedback":"Гомология не бывает частичной: процент описывает сходство"},{"id":"S15-L02-2","text":"Белки гомологичны, если сходство объясняется общим предком","correct":true,"feedback":"Гомология — вывод о происхождении; сходство — его основание"},{"id":"S15-L02-3","text":"Белки аналогичны, потому что сходство мало","correct":false,"feedback":"Малое сходство не исключает общего происхождения: гены могли давно разойтись"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем гомология отличается от сходства и аналогии?","status":"Схема качественная · примеры условны","modes_label":"Случай","modes":["сходство","гомология","аналогия","повторное возникновение замены"],"args":[{"c":"sim"},{"c":"hom"},{"c":"ana"},{"c":"conv"}],"notes":["Сходство измеряют процентом совпадений","Гомология — общее происхождение: да или нет","Аналогия — сходство без общего происхождения признака","Одинаковая замена возникла в двух линиях независимо"],"static":["Четыре панели: процент сходства, общий предок двух генов, аналогичные крылья, независимое возникновение одной замены на дереве"],"scene":"s15_r_homology","L":{"r15_hom_h_sim":"Сходство: процент совпадений","r15_hom_pct":"сходство 83 % (10 из 12 столбцов, условно)","r15_hom_h_hom":"Гомология: общий предковый ген","r15_hom_g1":"ген вида 1","r15_hom_g2":"ген вида 2","tr_len_none":"Длина ветви: ничего не означает","tr_out":"внешняя группа","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_hom_anc":"общий предковый ген","r15_hom_h_ana":"Аналогия: сходство без общего происхождения признака","r15_hom_bird":"крыло птицы","r15_hom_insect":"крыло насекомого","r15_hom_ana":"Крылья птицы и насекомого сходны по функции, но крыло как признак возникло независимо","r15_hom_h_conv":"Повторное возникновение замены","r15_hom_v1":"вариант 1","r15_hom_v2":"вариант 2","r15_hom_same":"одна и та же замена","r15_hom_indep":"независимо","r15_hom_conv_n":"одинаковое состояние у Л и Н — не признак родства"}}},"exam_quiz":{"id":"S15-E01","question":"Что такое гомология?","options":[{"id":"S15-E01-1","text":"Общее происхождение от предка","correct":true,"feedback":"Это вывод о происхождении, а не процент"},{"id":"S15-E01-2","text":"Сходство последовательностей больше 50 %","correct":false,"feedback":"Порога сходства для гомологии нет"},{"id":"S15-E01-3","text":"Одинаковая функция у генов разных видов","correct":false,"feedback":"Функция может совпадать и без общего происхождения"}]}},{"id":"ortho-para","num":3,"section":0,"questions":[1],"title":"Ортологи и паралоги: какое событие в общем узле","keywords":["Ортологи","Паралоги","Дупликация гена","Дерево гена"],"lead":["Гомологичные гены делят на ортологи и паралоги по одному признаку — какое событие произошло в их общем узле."],"mechanism":["[[T05|Ортологи]] — гомологичные гены, линии которых разошлись при разделении видов. [[T06|Паралоги]] — гомологичные гены, разошедшиеся после [[T07|дупликации гена]]. Различие видно на [[T08|дереве гена]] — схеме родства всех копий семейства: если в общем узле двух генов дупликация, они паралоги, если разделение видов — ортологи. Гены разных видов могут быть паралогами: если ген удвоился до разделения видов, копия α одного вида и копия β другого разошлись в узле дупликации."],"paragraphs":["Простой выбор «самого похожего гена» не устанавливает ортологии: ближайшим совпадением может оказаться паралог, если ортолог утрачен или изменялся быстрее. Поэтому ортологию проверяют по дереву всего семейства, положению дупликаций и распределению копий между видами. Для дерева видов берут ортологи: различия между паралогами накопились со времени дупликации, а не со времени разделения видов. Ортологи часто сохраняют сходную функцию, но не обязательно; паралоги могут разделить функцию предка или приобрести новую.","<b>На практикуме.<\/b> Вкладка 1, шаги 1.2–1.3.","<b>Ограничения.<\/b> При многих дупликациях и потерях одно семейство содержит сложное сочетание ортологов и паралогов; ошибки здесь искажают и дерево видов."],"conditions":"Схема качественная · дерево гена условно.","sources":["src_01","src_03"],"base":"БИО-15·2; вспомнить [[seminar-14-route.html#duplication|семинар 14: «Дупликация: как возникает копия гена»]] и [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]]","quiz":{"id":"S15-L03","question":"Ген удвоился у общего предка видов 1 и 2. Копия α вида 1 и копия β вида 2 — это…","options":[{"id":"S15-L03-1","text":"Ортологи","correct":false,"feedback":"Ортологи разошлись при разделении видов; у α и β общий узел — дупликация"},{"id":"S15-L03-2","text":"Не гомологи","correct":false,"feedback":"Обе копии происходят от одного предкового гена"},{"id":"S15-L03-3","text":"Паралоги","correct":true,"feedback":"Их общий узел — дупликация"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какое событие в общем узле делает гены ортологами или паралогами?","status":"Расчёт по модели · дерево гена условно","modes_label":"Дупликация","modes":["после разделения видов","до разделения видов","пара разных видов"],"args":[{"panel":"tree","mode":"dup_after"},{"panel":"tree","mode":"dup_before"},{"panel":"tree","mode":"dup_before","pair":["α1","β2"]}],"notes":["Г1–Г2а, Г1–Г2б — ортологи; Г2а–Г2б — паралоги","α1–α2, β1–β2 — ортологи; остальные пары — паралоги","α1 и β2 — паралоги, хотя гены разных видов"],"static":["Дерево генного семейства с узлами-событиями; выбранная пара и её общий узел"],"scene":"s15_t1","L":{"t1_a_head_after":"Дерево гена: у вида 1 одна копия, у вида 2 — две (условно)","t1_tip":"{g} · вид {sp}","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","t1_rel_para":"паралоги","t1_a_head_before":"Дерево гена: копии α и β у обоих видов (условно)","t1_rel_ortho":"ортологи"}}},"exam_quiz":{"id":"S15-E02","question":"Что такое паралоги?","options":[{"id":"S15-E02-1","text":"Любые гены разных видов","correct":false,"feedback":"Гены разных видов бывают и ортологами, и паралогами"},{"id":"S15-E02-2","text":"Гены, разошедшиеся после дупликации","correct":true,"feedback":"В их общем узле — дупликация"},{"id":"S15-E02-3","text":"Гены с разной функцией в одном геноме","correct":false,"feedback":"Функция не определяет, паралоги это или ортологи"}]}},{"id":"alignment","num":4,"section":0,"questions":[1],"title":"Выравнивание — гипотеза о соответствии позиций","keywords":["Множественное выравнивание","Позиционная гомология","Пропуск","Вставка и делеция","Внешняя группа"],"lead":["Прежде чем считать различия, последовательности ставят одна под другой; каждый столбец — предположение, что буквы в нём произошли от одной позиции предка."],"mechanism":["[[T09|Множественное выравнивание]] располагает последовательности так, чтобы сравниваемые столбцы соответствовали позициям общего происхождения — это [[T10|позиционная гомология]]. Если последовательности разной длины, в одну вставляют [[T11|пропуск]] (знак «—»). Пропуск обозначает [[T12|вставку или делецию]], но по двум последовательностям нельзя сказать, что из двух: направление изменения определяют по [[T15|внешней группе]] — линии, отделившейся раньше. От расстановки пропусков зависит, какие буквы окажутся в одном столбце, а значит, и число различий."],"paragraphs":["Пример: последовательности ATGGCTACCTGA и ATGGCACCTGA. Если поставить пропуск после 5-й буквы второй, несовпадений нет; если в конце — их пять, сходство падает со 100 % до 54,5 %. Обычно принимают выравнивание, требующее меньше всего событий, но при сильно различающихся последовательностях несколько выравниваний бывают почти равноценны.","<b>На практикуме.<\/b> Вкладка 1, шаги 1.4–1.6.","<b>Ограничения.<\/b> Учебный пример короткий; в настоящих данных десятки последовательностей и тысячи столбцов, и программы выравнивания расставляют пропуски по-разному."],"conditions":"Расчёт по модели · последовательности условны.","sources":["src_01","src_04"],"base":"БИО-15·2; вспомнить [[seminar-14-route.html#change-types|семинар 14: «Типы изменений: замена, вставка и делеция, структурные изменения»]]","quiz":{"id":"S15-L04","question":"Что предполагает каждый столбец выравнивания?","options":[{"id":"S15-L04-1","text":"Буквы в нём происходят от одной позиции предка","correct":true,"feedback":"Выравнивание — гипотеза о позиционной гомологии"},{"id":"S15-L04-2","text":"Буквы в нём одинаковы у всех последовательностей","correct":false,"feedback":"В столбце могут быть разные буквы: они и есть различия"},{"id":"S15-L04-3","text":"Столбец соответствует одному кодону гена","correct":false,"feedback":"Столбец — одна позиция; кодон занимает три столбца"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как расстановка пропуска меняет число различий?","status":"Расчёт по модели · последовательности условны","modes_label":"Пропуск","modes":["после 5-й буквы","в начале","в конце","внешняя группа"],"args":[{"panel":"align","mode":"gap6"},{"panel":"align","mode":"gap1"},{"panel":"align","mode":"gapend"},{"panel":"align","mode":"gap6","outgroup":true}],"notes":["0 несовпадений, 100 %","4 несовпадения, 63,6 %","5 несовпадений, 54,5 %","У внешней группы в столбце 6 буква есть: вероятнее делеция у вида 2"],"static":["Две строки нуклеотидов с пропуском в трёх положениях; число несовпадений 0, 4, 5"],"scene":"s15_t1","L":{"t1_b_head":"Выравнивание: вид 1 — 12 букв, вид 2 — 11 букв (условно)","t1_b_sp1":"вид 1","t1_b_sp2":"вид 2","t1_b_out":"внешняя группа","t1_b_indel":"у внешней группы буква есть: вероятнее делеция у вида 2"}},"zoomNarrow":true}},{"id":"alignment-matters","num":5,"section":0,"questions":[1],"title":"Почему выравнивание не нейтральная операция","keywords":["Насыщение","Модель замен"],"lead":["Ошибки выравнивания и скрытые повторные замены переходят в дерево, поэтому выводы проверяют на устойчивость."],"mechanism":["Разные выравнивания одних и тех же последовательностей могут дать разные деревья: столбец, поставленный неверно, предполагает ложную гомологию позиций. Кроме того, наблюдаемое различие меньше числа произошедших замен: позиция могла измениться несколько раз или вернуться к исходной букве. При долгом расхождении наступает [[T14|насыщение]]: различие двух последовательностей ДНК не превышает примерно 75 % — столько различаются и случайные последовательности из четырёх букв. [[T13|Модели замен]] учитывают скрытые изменения: разную частоту нуклеотидов, более частые транзиции, разную скорость в разных позициях, долю неизменяемых позиций."],"paragraphs":["Поэтому сомнительно выровненные участки исключают или анализируют несколькими способами, а вывод проверяют при разных выравниваниях, моделях и наборах видов. Процент сходства годится как грубая подсказка только для близких последовательностей, для которых выравнивание однозначно и насыщения нет.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.5.","<b>Ограничения.<\/b> Модели замен — упрощения; неверная модель тоже может исказить дерево."],"conditions":"Схема качественная · кривая насыщения условна.","sources":["src_01","src_03"],"base":"БИО-15·4; вспомнить [[seminar-14-route.html#dnds-limits|семинар 14: «Чего dN/dS не показывает»]]","quiz":{"id":"S15-L05","question":"Две последовательности различаются в 70 % позиций. Что сказать о числе замен?","options":[{"id":"S15-L05-1","text":"Замен было ровно 70 на 100 позиций","correct":false,"feedback":"Видимое различие меньше числа замен: повторные замены в одной позиции не видны"},{"id":"S15-L05-2","text":"Их было больше, и оценка ненадёжна","correct":true,"feedback":"При таком различии много скрытых повторных замен; близко к насыщению"},{"id":"S15-L05-3","text":"Последовательности не гомологичны","correct":false,"feedback":"Сильное расхождение не исключает гомологии; это вопрос происхождения"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему наблюдаемое различие меньше числа замен?","status":"Схема качественная · кривая насыщения условна","modes_label":"Что скрыто","modes":["повторная замена","кривая насыщения","два выравнивания — два дерева"],"args":[{"v":"multi"},{"v":"curve"},{"v":"trees"}],"notes":["Две замены в одной позиции не видны","Наблюдаемое различие растёт медленнее числа замен и не превышает около 75 %","Разные выравнивания одних последовательностей — разные деревья"],"static":["Позиция с возвратной заменой; кривая различия от числа замен с пределом 75 %; два выравнивания и два дерева"],"scene":"s15_r_saturation","L":{"r15_sat_h_multi":"Повторная замена","r15_sat_anc":"предок","r15_sat_desc":"потомок","r15_sat_aga":"A → G → A","r15_sat_zero":"видимых различий 0, замен — 2","r15_sat_h_curve":"Кривая насыщения","r15_sat_lim":"предел около 75 %","r15_sat_x":"число замен на позицию","r15_sat_y":"наблюдаемое различие","r15_sat_cond":"кривая условна: равные частоты замен между четырьмя нуклеотидами","r15_sat_h_trees":"Два выравнивания — два дерева","r15_sat_a1":"выравнивание 1","r15_sat_a2":"выравнивание 2","tr_len_none":"Длина ветви: ничего не означает","tr_out":"внешняя группа","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_sat_t1":"дерево 1","r15_sat_t2":"дерево 2"}}}},{"id":"ape-alignable","num":6,"section":0,"questions":[1],"title":"Сколько генома удаётся выровнять","keywords":["Структурно расходящийся участок"],"lead":["Привычный процент сходства геномов описывает только ту их часть, которую удалось выровнять."],"mechanism":["Геномы шести видов человекообразных обезьян прочитали вместе с повторами (74 % хромосом собраны от конца до конца без разрывов) и выровняли попарно и с геномом человека. У разных пар видов от 12,5 до 27,3 % генома не выровнялось или выровнялось не один к одному: такие участки вносят пропуски. Различия по пропускам — вставкам, делециям, перестройкам — затронули в 5–15 раз больше мегабаз, чем однонуклеотидные различия; часть этого — следствие трудностей выравнивания повторов. В среднем 327 млн пар нуклеотидов (около 10 %) на линию составили [[T16|структурно расходящиеся участки]]: центромеры, короткие плечи акроцентрических хромосом, концевой гетерохроматин, участки сегментных дупликаций."],"paragraphs":["Сравнения последовательностей оказались богаче различиями, чем считали раньше. Процент сходства по выровненным столбцам не противоречит этому: он описывает только сопоставленную часть.","<b>Как это узнали.<\/b> Геномы прочитали длинными прочтениями и собрали большую часть хромосом без разрывов; затем отдельно учли участки, которые выравниваются плохо или не один к одному.","<b>Граница вывода.<\/b> Невыровненная доля — не доля различий: в неё попадают и сходные, но перестроенные или повторяющиеся участки. Часть невыровненного — следствие трудностей выравнивания повторов.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 1."],"conditions":"Схема по данным работы, упрощённая · доли и кратности измерены.","sources":["src_06"],"base":"БИО-15·4, БИО-15·5","level":"adv","next_base":"tree-parts","quiz":{"id":"S15-L06","question":"Почему процент сходства геномов не описывает всех различий?","options":[{"id":"S15-L06-1","text":"Его считают только по генам, а не по геному","correct":false,"feedback":"Сравнивали геномы целиком; дело в выравнивании"},{"id":"S15-L06-2","text":"Он учитывает только вставки и делеции","correct":false,"feedback":"Наоборот: в процент входят несовпадения выровненных столбцов"},{"id":"S15-L06-3","text":"Его считают только по выровненной части","correct":true,"feedback":"Невыровненные участки в него не входят"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какую часть генома удаётся выровнять?","status":"Схема по данным работы, упрощённая · разброс по сравнениям пар видов","modes_label":"Доля невыровненного","modes":["12,5 %","27,3 %","пропуски и замены"],"args":[{"unal":12.5},{"unal":27.3},{"panel":"B"}],"notes":["Наименьшая доля по парам видов — 12,5 %","Наибольшая — 27,3 %","Пропуски затрагивают в 5–15 раз больше мегабаз, чем замены"],"static":["Полоса генома: выровненная часть и невыровненная 12,5–27,3 %; столбики однонуклеотидных и пропусковых различий"],"scene":"s15_a1","L":{"a1_p1_t":"Что выровнено","a1_p1_q1":"геном одного вида","a1_p1_q2":"выровнено один к одному","a1_unal":"не выровнено: {v} %","a1_p1_q3":"не выровнено или не один к одному (пропуски)","a1_p1_q8":"здесь считают однонуклеотидные различия и процент сходства","a1_p1_q5":"наименьшая в работе — 12,5 %","a1_p1_q6":"наибольшая — 27,3 %","a1_p1_q7":"разброс по сравнениям разных пар видов, включая далёкие; значения для отдельных пар — в приложениях к работе, на схеме не показаны","a1_p2_t":"Два вида различий","a1_p2_q1":"однонуклеотидные различия","a1_p2_q2":"различия по пропускам — вставкам, делециям, перестройкам","a1_p2_q3":"в 5 раз больше","a1_p2_q4":"в 15 раз больше","a1_p2_q5":"столбики относительные: единица — мегабазы, затронутые однонуклеотидными различиями"}}},"adv_kind":"Новые данные"},{"id":"indels","num":7,"section":0,"questions":[1],"title":"Вставки и делеции: сильный признак и главный источник неопределённости","keywords":[],"lead":["Вставки и делеции — частые изменения; общая вставка хорошо указывает на родство, но где именно поставить пропуск, однозначно решить нельзя."],"mechanism":["После однонуклеотидных замен вставки и делеции — второй по значению источник наследственной изменчивости: у людей это от 16 до 25 % всех вариантов генома. Одинаковая вставка в одном и том же месте у двух последовательностей вряд ли возникла дважды независимо, поэтому общие вставки и делеции сильнее указывают на родство, чем общие замены. Но это требует точной расстановки пропусков, а большинство программ выравнивания ставят их недостаточно точно, и результат зависит от параметров программы и от дерева, которым она пользуется при сборке выравнивания. Неоднозначность выравнивания нельзя устранить полностью даже при идеальном способе оценки."],"paragraphs":["Поэтому всё чаще анализируют не одно «лучшее» выравнивание, а набор почти равноценных и проверяют, меняется ли вывод.","<b>Как это узнали.<\/b> Обзор сравнивает методы работы со вставками и делециями и их влияние на выравнивание, дерево и оценки отбора.","<b>Граница вывода.<\/b> Доля вставок и делеций — для генома человека; у других видов она иная.","<b>На практикуме.<\/b> Вкладка 1, шаги 1.4–1.6."],"conditions":"Схема по данным обзора, упрощённая · доля — для геномов людей.","sources":["src_04"],"base":"БИО-15·4","level":"adv","next_base":"tree-parts","quiz":{"id":"S15-L07","question":"Почему общая вставка в одном месте — сильный признак родства?","options":[{"id":"S15-L07-1","text":"Такая вставка там же вряд ли возникла дважды","correct":true,"feedback":"При верной расстановке пропуска совпадение почти наверняка унаследовано"},{"id":"S15-L07-2","text":"Вставки вообще не возникают повторно","correct":false,"feedback":"Возникают, но одинаковая вставка в одном месте — маловероятное совпадение"},{"id":"S15-L07-3","text":"Вставки всегда выровнены точно и однозначно","correct":false,"feedback":"Наоборот: расстановка пропусков — главный источник неопределённости"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему общая вставка — сильный признак, а пропуск — неопределённость?","status":"Схема по данным обзора, упрощённая · последовательности условны","modes_label":"Случай","modes":["общая вставка","два места пропуска","набор выравниваний"],"args":[{"v":"shared"},{"v":"ambig"},{"v":"ensemble"}],"notes":["Одинаковая вставка в одном месте вряд ли возникла дважды","Пропуск можно поставить в два равноценных места","Вывод проверяют на наборе почти равноценных выравниваний"],"static":["Три последовательности с общей вставкой у двух; два равноценных места пропуска (ATGGCTA-CTGA и ATGGCTAC-TGA); три выравнивания и итоговое дерево"],"scene":"s15_r_indels","L":{"r15_ind_h_shared":"Общая вставка — сильный признак","r15_ind_sp":"вид {i}","tr_out":"внешняя группа","r15_ind_outno":"вставки нет","r15_ind_shared":"общая вставка у видов 1 и 2: одинаковая вставка в одном месте вряд ли возникла дважды","r15_ind_h_ambig":"Пропуск: два равноценных места","r15_ind_here":"пропуск здесь","r15_ind_or":"или здесь","r15_ind_ambig":"оба места дают одинаковое число несовпадений: выбор места — допущение","r15_ind_h_ensemble":"Набор почти равноценных выравниваний","r15_ind_aln":"выравнивание {i}","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_ind_robust":"вывод устойчив? — проверяют на всех выравниваниях"}},"zoomNarrow":true},"adv_kind":"Новые данные"},{"id":"tree-parts","num":8,"section":1,"questions":[2],"title":"Части дерева","keywords":["Кончик (лист) дерева","Внутренний узел","Ветвь","Клада","Сестринские группы","Топология"],"lead":["У дерева несколько частей, и каждая означает своё: кончики — современные линии, внутренние узлы — их реконструируемые предки."],"mechanism":["[[T17|Кончики]] (листья) дерева — включённые в анализ виды, популяции или последовательности. [[T18|Внутренние узлы]] — реконструируемые общие предки; [[T19|ветви]] соединяют узлы. [[T21|Клада]] — предок и все его потомки; группа, исключающая часть потомков общего предка, кладой не является. Две линии, отходящие от одного узла, — [[T22|сестринские группы]]: они ближе друг к другу, чем к любой другой линии. [[T20|Топология]] — порядок соединения ветвей; она и несёт гипотезу о родстве."],"paragraphs":["Внутренний узел на дереве со временем обозначает предковую популяцию или линию, а не обязательно конкретный известный ископаемый вид.","<b>На практикуме.<\/b> Вкладка 2: показание «Клады» перечисляет все клады дерева.","<b>Ограничения.<\/b> Учебное дерево строго ветвится; при гибридизации и переносе генов история не сводится к дереву (БИО-15·20)."],"conditions":"Схема качественная · виды условны.","sources":["src_01"],"base":"БИО-15·1","quiz":{"id":"S15-L08","question":"Что изображает внутренний узел дерева?","options":[{"id":"S15-L08-1","text":"Ископаемый вид, найденный в раскопках","correct":false,"feedback":"Ископаемое может быть близко к узлу, но узел — гипотеза, а не находка"},{"id":"S15-L08-2","text":"Реконструируемого общего предка","correct":true,"feedback":"Его не наблюдают, а выводят из данных о потомках"},{"id":"S15-L08-3","text":"Самый развитый вид группы","correct":false,"feedback":"Узел — предок; развитость дерево не изображает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Из чего состоит дерево?","status":"Схема качественная · виды условны","modes_label":"Часть дерева","modes":["части дерева","клады","сестринские группы"],"args":[{"panel":"tree","show":"parts"},{"panel":"tree","show":"clades"},{"panel":"tree","show":"sisters"}],"notes":["Кончики — современные виды; узлы — реконструируемые предки","Клада — предок и все потомки: К+Л; Н+П; К+Л+М; К+Л+М+Н+П","Сестринские группы отходят от одного узла"],"static":["Дерево К, Л, М, Н, П с внешней группой Р; подписи частей; клады скобками"],"scene":"s15_t2","L":{"t2_a_head":"Дерево пяти видов с внешней группой Р (условно)","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт","r15_pt_tip":"кончик","r15_pt_node":"внутренний узел","r15_pt_branch":"ветвь","r15_pt_root":"корень","r15_pt_sis":"сестринские: К и Л; Н и П; К+Л и М"}}}},{"id":"common-ancestor","num":9,"section":1,"questions":[2],"title":"Родство определяет общий предок, а не соседство кончиков","keywords":["Последний общий предок"],"lead":["Два вида тем ближе, чем позже жил их последний общий предок; ни соседство на рисунке, ни число узлов между ними этого не показывают."],"mechanism":["Родство на дереве определяют по [[T23|последнему общему предку]]: если общий предок М и К жил позже, чем общий предок М и Н, то М ближе к К. Распространённые ошибки чтения: судить по соседству кончиков, по числу узлов между ними, по положению «вверху» или «справа». Кончики — современные виды; ни один не происходит от другого, у них общие предки. Поэтому «человек произошёл от шимпанзе» — неверное чтение дерева: у человека и шимпанзе общий предок."],"paragraphs":["Пример: от внешней группы Р до вида Н на рисунке три узла, а до вида К — четыре, но Р одинаково родствен им обоим: у Р со всеми видами внутренней группы один общий предок — корень. Пример из медицины: у варианта Альфа вируса SARS-CoV-2 ветвь на дереве длиннее, чем у его современников. Это означает, что в этой линии быстрее накапливались замены (вероятнее всего, в организме человека с длительной инфекцией), а не то, что Альфа — предок других вариантов.","<b>На практикуме.<\/b> Вкладка 2, шаги 2.1 и 2.7.","<b>Ограничения.<\/b> Дерево говорит о родстве только включённых видов: добавление других видов может изменить картину."],"conditions":"Схема качественная · виды условны.","sources":["src_01","src_11"],"base":"БИО-15·8","quiz":{"id":"S15-L09","question":"На дереве кончик шимпанзе стоит рядом с кончиком человека. Что из этого следует?","options":[{"id":"S15-L09-1","text":"Шимпанзе — предок человека, раз стоит рядом","correct":false,"feedback":"Оба — современные виды с общим предком"},{"id":"S15-L09-2","text":"Человек — самый развитый вид на этом дереве","correct":false,"feedback":"Дерево не ранжирует виды"},{"id":"S15-L09-3","text":"Ничего: родство читают по общему узлу","correct":true,"feedback":"Родство читают по узлам, а не по соседству кончиков"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как читать родство по общему предку?","status":"Схема качественная · виды условны","modes_label":"Пара","modes":["М и К","М и Н","Р и Н","Р и К"],"args":[{"panel":"tree","mrca":["М","К"]},{"panel":"tree","mrca":["М","Н"]},{"panel":"tree","mrca":["Р","Н"]},{"panel":"tree","mrca":["Р","К"]}],"notes":["Общий предок М и К — узел клады К+Л+М","Общий предок М и Н — узел всей внутренней группы","Р и Н: общий предок — корень (на пути 3 узла)","Р и К: тот же корень (на пути 4 узла)"],"static":["Дерево с обведёнными узлами — общими предками выбранных пар"],"scene":"s15_t2","L":{"t2_a_head":"Дерево пяти видов с внешней группой Р (условно)","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт"}}}},{"id":"rotation","num":10,"section":1,"questions":[2],"title":"Поворот ветвей не меняет дерева","keywords":["Внутренний узел","Топология","Клада"],"lead":["Одно и то же дерево можно нарисовать многими способами: ветви у каждого узла можно поменять местами."],"mechanism":["Поворот ветвей вокруг [[T18|внутреннего узла]] меняет порядок кончиков на рисунке, но не меняет [[T20|топологии]] — порядка ветвлений и набора клад. У дерева из n видов n − 1 внутренний узел, и у каждого ветви можно повернуть: одних рисунков одного дерева много. Поэтому сравнивают не рисунки, а списки [[T21|клад]]."],"paragraphs":["Удобно представлять дерево как подвеску из нитей: её можно вращать у каждого узла, а связи остаются прежними.","<b>На практикуме.<\/b> Вкладка 2, шаг 2.2: после любого числа поворотов список клад тот же.","<b>Ограничения.<\/b> Поворот не меняет и длин ветвей; меняет только расположение на рисунке."],"conditions":"Расчёт по модели · список клад до и после поворота.","sources":["src_01"],"base":"БИО-15·8, БИО-15·9","quiz":{"id":"S15-L10","question":"Как проверить, что два рисунка изображают одно дерево?","options":[{"id":"S15-L10-1","text":"Сравнить списки клад","correct":true,"feedback":"При одинаковых кладах и корне — одно дерево"},{"id":"S15-L10-2","text":"Сравнить порядок кончиков сверху вниз","correct":false,"feedback":"Порядок меняется поворотом ветвей"},{"id":"S15-L10-3","text":"Сравнить число кончиков","correct":false,"feedback":"Одно и то же число видов может быть связано по-разному"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему поворот ветвей не меняет дерева?","status":"Расчёт по модели · список клад до и после поворота","modes_label":"Поворот","modes":["исходный","поворот узла К+Л+М","поворот всех узлов"],"args":[{"panel":"tree","rot":[]},{"panel":"tree","rot":[[0,0]]},{"panel":"tree","rot":"all"}],"notes":["К, Л, М, Н, П, Р","М, К, Л, Н, П, Р — клады те же","Р, П, Н, М, Л, К — клады те же"],"static":["Три рисунка одного дерева с разным порядком кончиков и одинаковым списком клад"],"scene":"s15_t2","L":{"t2_a_head":"Дерево пяти видов с внешней группой Р (условно)","tr_out":"внешняя группа","tr_len_none":"Длина ветви: ничего не означает","tr_spec":"разделение видов","tr_dup":"дупликация","tr_loss":"утрата копии","tr_ring":"общий предок выбранной пары","tr_rot":"повернуть ветви у этого узла","tr_rootspot":"возможное место корня","tr_scale_subst":"0,05 замены на сайт"}}}},{"id":"root-outgroup","num":11,"section":1,"questions":[2],"title":"Корень и внешняя группа; сборка дерева по признакам","keywords":["Корень дерева","Некорневое дерево","Внешняя группа","Предковое состояние","Общий производный признак"],"lead":["Корень задаёт направление от предка к потомкам; его ставят по внешней группе, и по ней же определяют, какое состо
