актериального типа. Мембраны и деление: внутренняя мембрана сохраняет бактериальные свойства, органеллы делятся, но под контролем клетки. Перенос генов и импорт белков: большинство белков митохондрий кодирует ядро. Производные органеллы у анаэробных эукариот: эукариоты, изначально лишённые митохондрий, не найдены.","Ни двойная мембрана, ни собственная ДНК по отдельности эндосимбиоз не доказывают: две мембраны есть и у ядра, а геном у части производных митохондрий утрачен. Родство с конкретной группой бактерий показывают только деревья генов. Надёжность вывода — в согласии независимых линий."],"conditions":"","sources":["src_01","src_02"],"quiz":{"id":"S12-L36","question":"Какая линия данных указывает, от какой именно группы бактерий произошли митохондрии?","options":[{"id":"S12-L36-1","text":"Двойная мембрана органеллы","correct":false,"feedback":"Две мембраны не называют донора и есть у ядра"},{"id":"S12-L36-2","text":"Собственная кольцевая ДНК органеллы","correct":false,"feedback":"Наличие ДНК само по себе не указывает группу бактерий"},{"id":"S12-L36-3","text":"Деревья митохондриальных генов","correct":true,"feedback":"Верно: остальные линии говорят о бактериальном происхождении вообще"}]}},{"id":"gene-transfer","num":37,"section":4,"questions":[4],"title":"Перенос генов в ядро и импорт белков","keywords":["Деление (протоклетки)","Митохондриальная ДНК (мтДНК)","Промотор","Сигнал импорта","Эндосимбиотический перенос гена","Ядро"],"lead":[],"mechanism":[],"paragraphs":["Эндосимбиотический перенос гена — функциональный перенос гена из генома эндосимбионта или органеллы в ядерный геном. Встраивания фрагмента ДНК органеллы в ядерную ДНК недостаточно: ядерная копия должна экспрессироваться, а если белок работает в органелле, — кодировать сигнал импорта. У многих белков митохондрий это N-концевая последовательность, которая отщепляется после импорта; импорт обеспечивают транслоказы мембран (вспомнить [[https://fresll.github.io/bio/seminar-3-route.html#address-principle|БИО-3·26]]). Пока работают обе копии, утрата органеллярной не нарушает функцию; утрата не мгновенна и не обязательна. Переносы генов из митохондрий в ядро происходили и в недавней эволюции: у многих растений ядерный ген кодирует митохондриальный белок, гомолог которого у близких видов ещё закодирован в митохондриальной ДНК. В линиях, где митохондриальный генетический код отличается от стандартного (вспомнить [[https://fresll.github.io/bio/seminar-10-route.html#genetic-code|БИО-10·2]]), перенесённый ген должен ещё и читаться по стандартному коду. Значительная часть генов предка митохондрии не перенесена, а утрачена.","Последовательность «встраивание — приобретение промотора и сигнала импорта — две работающие копии — утрата органеллярной копии» — условная модель функциональных этапов, а не универсальная история: у разных генов и в разных линиях порядок этапов может различаться.","Небольшая часть генов остаётся в митохондриальной ДНК. Обсуждают трудность импорта очень гидрофобных мембранных белков и выгоду регуляции экспрессии прямо в органелле; ни одна гипотеза не объясняет распределение генов во всех линиях. Митохондрии современных эукариот разнообразны: в одних линиях митохондриальная ДНК кодирует десятки белков, в других — несколько; гидрогеносомы и митосомы многих линий генома не имеют. Поэтому митохондрии называют полуавтономными органеллами."],"conditions":"","sources":["src_01","src_02","src_17"],"quiz":{"id":"S12-L37","question":"Что нужно, чтобы ядерная копия заменила митохондриальный ген?","options":[{"id":"S12-L37-1","text":"Экспрессия копии и её сигнал импорта","correct":true,"feedback":"Верно: ядерная копия должна экспрессироваться, а кодируемый белок — нести сигнал импорта"},{"id":"S12-L37-2","text":"Одно встраивание копии в ядерную ДНК","correct":false,"feedback":"Без экспрессии и сигнала белок не окажется в митохондрии"},{"id":"S12-L37-3","text":"Утрата митохондриальной копии гена","correct":false,"feedback":"Утрата без работающей ядерной копии нарушит функцию"}]}},{"id":"asgard","num":38,"section":4,"questions":[4],"title":"Архейный компонент: асгардархеи и химерный геном","keywords":["Археи","Асгардархеи (Asgard Archaea)","Наблюдение (статус утверждения)","FECA (First Eukaryotic Common Ancestor)"],"lead":[],"mechanism":[],"paragraphs":["Ядерная линия эукариот возникла внутри архей; наиболее близкие известные группы относятся к асгардархеям (Asgard Archaea), впервые обнаруженным по фрагментам ДНК из донных отложений. Их геномы содержат гомологи эукариотических белков актиновой системы, комплексов ESCRT (эндосомных сортирующих комплексов, необходимых для транспорта), участвующих в изменении формы мембран, и убиквитиноподобной модификации белков. Филогеномные реконструкции указывают на преобладающий вклад асгардархей в большинство консервативных функциональных систем эукариот.","Но гомолог гена ещё не работающая система. Первая асгардархея, выращенная в лаборатории после многолетних попыток, удваивается раз в две–три недели, образует длинные ветвящиеся выросты мембраны и растёт, разлагая аминокислоты, вместе с микроорганизмами-партнёрами, потребляющими водород, — бактерией и другой археей. У другой, позже выращенной асгардархеи показано, что в теле клетки и в выростах проходят нити из белка — гомолога актина; это наблюдение. Что эти нити формируют и поддерживают выросты, как актин у эукариот, — предположение авторов о функции, прямо оно не проверено. По размерам и сложности обе асгардархеи остаются прокариотами. Это современные родственники клетки-хозяина, а не FECA.","Геном эукариот химерный: в нём есть гены архейного происхождения (особенно в информационных системах), гены бактериального предка митохондрии (особенно связанные с превращением энергии и сборкой железо-серных кластеров) и гены других бактерий; затем гены терялись, удваивались и включались в общие регуляторные сети. Это тенденция, а не строгое правило: для многих семейств глубокое происхождение определить трудно."],"conditions":"","sources":["src_04","src_36","src_35","src_01","src_06"],"quiz":{"id":"S12-L38","question":"Что показывают гомологи эукариотических белков у асгардархей?","options":[{"id":"S12-L38-1","text":"Что у асгардархей есть ядро и эндомембраны","correct":false,"feedback":"Ядра у асгардархей нет"},{"id":"S12-L38-2","text":"Родство асгардархей и клетки-хозяина эукариот","correct":true,"feedback":"Верно. Гомологи показывают родство, но не наличие у асгардархей работающих эукариотических систем"},{"id":"S12-L38-3","text":"Что асгардархеи — предки митохондрий эукариот","correct":false,"feedback":"Предок митохондрии — бактерия"}]},"exam_quiz":{"id":"S12-E11","question":"Из генов какого происхождения складывается геном эукариот?","options":[{"id":"S12-E11-1","text":"Одного архейного: эукариоты — ветвь архей","correct":false,"feedback":"Гены предка митохондрии и других бактерий тоже есть."},{"id":"S12-E11-2","text":"Архей, предка митохондрии и других бактерий","correct":true,"feedback":"Верно: геном эукариот химерный — информационные системы в основном архейного происхождения, часть генов — от предка митохондрии и других бактерий (БИО-12·38)."},{"id":"S12-E11-3","text":"Бактериального: все гены — от предка митохондрии","correct":false,"feedback":"Информационные системы эукариот в основном архейного происхождения."}]}},{"id":"scenarios","num":39,"section":4,"questions":[4],"title":"Конкурирующие сценарии: ядро, эндомембраны, фагоцитоз, митохондрия","keywords":["Археи","Бактерии","LECA (Last Eukaryotic Common Ancestor)","Фагоцитоз","Фн","Эндосимбиоз"],"lead":[],"mechanism":[],"paragraphs":["Общепринятая часть большинства современных моделей невелика: клетка-хозяин принадлежала к архейной линии, предок митохондрии был бактерией, их объединение произошло до LECA. Последовательность событий спорна. Водородная и синтрофные гипотезы начинают с метаболического партнёрства археи и бактерии — синтрофии, взаимозависимого обмена метаболитами. Модель «изнутри наружу» выводит цитоплазму и эндомембраны из выростов архейной клетки вокруг бактерий-партнёров; тело археи становится будущим ядром. Модель «сначала фагоцитоз» допускает появление части мембранной и цитоскелетной сложности и активного захвата частиц до приобретения бактерии. Гипотезы ранней и поздней митохондрии различаются положением эндосимбиоза относительно ядра, эндомембран и фагоцитоза.","Ядерная оболочка состоит из двух мембран, непрерывна с эндоплазматическим ретикулумом и пронизана порами (вспомнить [[https://fresll.github.io/bio/seminar-3-route.html#envelope-pore|БИО-3·23]]); это связывает происхождение ядра с эндомембранной системой, но совместимо с несколькими механизмами. Одна из гипотез связывает преимущество разделения ядра и цитоплазмы с интронами: созревание РНК требует времени и могло конфликтовать с немедленной трансляцией (вспомнить [[https://fresll.github.io/bio/seminar-9-route.html#splicing|БИО-9·15]]). Из неё не следует, что ядро возникло «для защиты» генома. Каждый сценарий должен объяснить контакт партнёров, обмен метаболитами, импорт белков, согласование деления и перестройку мембран."],"conditions":"","sources":["src_02","src_19","src_05"],"quiz":{"id":"S12-L39","question":"Что общего у гипотез ранней и поздней митохондрии?","options":[{"id":"S12-L39-1","text":"Одинаковый порядок появления ядра и митохондрии","correct":false,"feedback":"Именно в этом они расходятся"},{"id":"S12-L39-2","text":"Захват бактерии хозяином путём фагоцитоза","correct":false,"feedback":"Фагоцитоз предполагают не все сценарии"},{"id":"S12-L39-3","text":"Архейный хозяин, предок митохондрии из бактерий","correct":true,"feedback":"Верно: спор идёт о порядке событий"}]},"exam_quiz":{"id":"S12-E12","question":"Какое утверждение об эукариогенезе сейчас установлено надёжнее остальных?","options":[{"id":"S12-E12-1","text":"Ядро клетки возникло раньше митохондрии","correct":false,"feedback":"Порядок появления ядра и митохондрии — предмет обсуждения: данные его не устанавливают (БИО-12·39)."},{"id":"S12-E12-2","text":"Хозяин захватил предка митохондрии фагоцитозом","correct":false,"feedback":"Это одна из гипотез; имеющиеся данные её не устанавливают (БИО-12·39)."},{"id":"S12-E12-3","text":"Митохондрия — от бактерии, хозяин — от архей","correct":true,"feedback":"Верно: происхождение митохондрии от бактерии и архейное происхождение хозяина поддержаны независимыми линиями данных; порядок остальных событий остаётся предметом обсуждения (БИО-12·36, ·39)."}]}},{"id":"t4-review","num":40,"section":4,"questions":[4],"title":"Разбор заданий вкладки 4","keywords":["LECA (Last Eukaryotic Common Ancestor)","Наблюдение (статус утверждения)","Сигнал импорта","FECA (First Eukaryotic Common Ancestor)"],"lead":[],"mechanism":[],"paragraphs":["Панель «Линии данных» показывает разницу между принципом и деталями: бактериальное происхождение митохондрий поддерживают несколько независимых линий, родство с альфа-протеобактериями — только деревья генов, а о порядке появления ядра и митохондрии эти данные не говорят ничего. Выключив деревья генов, легко увидеть, что бактериальное происхождение остаётся поддержанным, а конкретный донор — нет.","Конструктор переноса гена показывает два условия замены органеллярного гена ядерным — экспрессию и сигнал импорта — и типичную обратную задачу: если белка в митохондрии нет, причиной может быть любое из двух нарушений; различает их наблюдение, есть ли белок в цитозоле. Карточка с асгардархеей напоминает: современный организм — родственник клетки-хозяина, а не предок и не FECA; FECA и LECA — состояния прошлого."],"conditions":"","sources":[],"quiz":{"id":"S12-L40","question":"Белка М в митохондрии нет, ядерная копия гена есть, органеллярная утрачена, в цитозоле белок М найден. Какая причина вероятна?","options":[{"id":"S12-L40-1","text":"Ядерный белок не несёт сигнала импорта","correct":true,"feedback":"Верно: белок синтезируется, но не импортируется"},{"id":"S12-L40-2","text":"Ядерная копия гена не экспрессируется","correct":false,"feedback":"Тогда белка не было бы и в цитозоле"},{"id":"S12-L40-3","text":"Нарушен импорт всех белков в митохондрию","correct":false,"feedback":"Тогда пострадали бы и другие функции; по условию импорт работает"}]}},{"id":"a4","num":41,"section":4,"questions":[4],"title":"Как независимые свидетельства меняют уверенность","keywords":["Гомология","LECA (Last Eukaryotic Common Ancestor)","Митохондрия","Реконструкция (статус утверждения)","Ядро"],"lead":[],"mechanism":[],"paragraphs":["Исследование 4 сопоставляет восемь групп свидетельств и шесть утверждений. Родство митохондриальных генов с альфа-протеобактериями и бактериальный тип митохондриального аппарата синтеза белка вместе убедительно поддерживают эндосимбиотическое происхождение митохондрий. Гомология информационных систем эукариот и архей и гены асгардархей вместе поддерживают архейного хозяина. Наличие митохондрий или их производных у всех изученных эукариот поддерживает присутствие митохондрии у LECA. Сходство эндомембран у всех эукариот говорит, что они были у LECA, но не о порядке их появления.","Утверждения о порядке событий — «ядро и эндомембраны появились до митохондрии» или «митохондрия была первой» — получают лишь слабую поддержку, пока в модель не включены датировки дупликаций генов (БИО-12·42). Даже тогда вывод зависит от допущений метода. Обратная задача: две гипотезы различили бы согласованные датировки разными методами, обнаружение современных архей с внутренними мембранами или способностью к захвату частиц, согласованная реконструкция набора генов ранних ветвей. Если таких данных недостаточно, правильный ответ — «порядок событий остаётся предметом обсуждения»."],"conditions":"","sources":[],"base":"БИО-12·36, БИО-12·38, БИО-12·39","level":"adv","next_base":"next","quiz":{"id":"S12-L41","question":"Почему убедительность вывода об эндосимбиозе не переносится на порядок событий эукариогенеза?","options":[{"id":"S12-L41-1","text":"Потому что сам эндосимбиоз не доказан","correct":false,"feedback":"Эндосимбиоз поддержан независимыми линиями данных"},{"id":"S12-L41-2","text":"Данные говорят об участниках, а не о порядке","correct":true,"feedback":"Верно. Свидетельства об эндосимбиозе говорят о происхождении участников, но не о последовательности событий"},{"id":"S12-L41-3","text":"Потому что порядок событий уже известен точно","correct":false,"feedback":"Порядок остаётся предметом обсуждения"}]}},{"id":"a4-results","num":42,"section":4,"questions":[4],"title":"Новые данные: датированные дупликации генов","keywords":["LECA (Last Eukaryotic Common Ancestor)","Степень поддержки (вывода)","Фагоцитоз","Эндосимбиоз"],"lead":[],"mechanism":[],"paragraphs":["Многие гены, необходимые ядру, цитоскелету и мембранному транспорту, у эукариот образуют семейства родственных копий, возникших при дупликациях до LECA. Если оценить время дупликаций, можно оценить, когда появились связанные с ними функции. Исследователи сделали это с помощью молекулярных часов. По их оценке, линия хозяина отделилась от ближайших родственников среди асгардархей около 3,05–2,79 млрд лет назад, линия предка митохондрии от альфа-протеобактерий — около 2,37–2,13 млрд лет назад, LECA существовал около 1,80–1,67 млрд лет назад; стволовая линия эукариот существовала, таким образом, более миллиарда лет. Дупликации генов цитоскелета, мембранного транспорта, эндомембран, фагоцитоза и ядра в основном пришлись на интервал 3,0–2,25 млрд лет назад — до митохондриального эндосимбиоза. Авторы делают вывод в пользу сложного архейного хозяина и поздней митохондрии и считают, что гипотезы ранней митохондрии можно отвергнуть.","Как к этому относиться. Это сильный новый довод, полученный на многих семействах генов. Но все даты — модельные оценки, зависящие от выбора генов, калибровок и модели скоростей замен; разные анализы давали для LECA оценки примерно от 1,9 до 0,95 млрд лет назад. Время дупликации гена не равно времени, когда связанная с ним функция начала работать в клетке. Поэтому в практикуме степень поддержки этого вывода — «поддержано, но зависит от допущений»."],"conditions":"","sources":["src_05"],"base":"БИО-12·35, БИО-12·39. См. также: БИО-12·34, БИО-12·41","level":"adv","next_base":"next","quiz":{"id":"S12-L42","question":"Почему датировки дупликаций — не окончательное доказательство порядка событий?","options":[{"id":"S12-L42-1","text":"Дупликации генов у эукариот не происходят","correct":false,"feedback":"Дупликации — частое событие эволюции генов"},{"id":"S12-L42-2","text":"Эукариоты моложе одного миллиарда лет","correct":false,"feedback":"Ископаемые эукариоты старше 1,6 млрд лет"},{"id":"S12-L42-3","text":"Даты — модельные оценки с допущениями","correct":true,"feedback":"Верно. Они зависят от калибровок и допущений, а время дупликации гена не равно времени появления функции"}]}},{"id":"r4","num":43,"section":4,"questions":[4],"title":"Не только две клетки: другие бактериальные доноры","keywords":["LECA (Last Eukaryotic Common Ancestor)","FECA (First Eukaryotic Common Ancestor)","Эндосимбиоз","Эукариогенез"],"lead":[],"mechanism":[],"paragraphs":["Архейный хозяин и бактериальный предок митохондрии — общепризнанные участники эукариогенеза. Но в геноме LECA есть и гены, родственные генам других бактерий. Одна из недавних реконструкций происхождения генных семейств LECA обнаружила несколько волн переноса генов от разных бактериальных групп — помимо альфа-протеобактерий, прежде всего от миксококков и планктомицетов; часть переносов, по оценке авторов, могла предшествовать митохондриальному эндосимбиозу. Небольшая доля семейств — около 4,5 % — имеет на деревьях ближайших родственников среди вирусов, так что возможен и перенос генов при участии вирусов. Другая группа исследователей тоже находит вклад многих бактериальных групп, но считает его разрозненными переносами без признаков дополнительного эндосимбиоза. Расхождение показывает, насколько выводы зависят от выборки геномов и методов. Обзоры добавляют ещё одну тонкость: у эукариот, по сути, две стволовые линии со своими начальными точками: линия хозяина (архейный FECA) и линия будущей митохондрии (митохондриальный FECA).",{"h":"Дальше в курсе «Молекулярная биология»"},"Митохондриальный геном, импорт белков в митохондрии и контроль их качества в клетках человека — [[https://fresll.github.io/molbio/seminar-9.html|семинар 9 «Митохондрии как энергетический, сигнальный и генетический узел»]] и [[https://fresll.github.io/molbio/seminar-12.html|семинар 12 «Селективная аутофагия и контроль качества органелл»]]."],"conditions":"","sources":["src_06","src_04","src_02"],"base":"БИО-12·38","level":"adv","next_base":"next","badge":"сверх программы · научное дополнение","quiz":{"id":"S12-L43","question":"Две группы по-разному объясняют бактериальные гены LECA, не связанные с митохондрией. Что из этого следует?","options":[{"id":"S12-L43-1","text":"Вопрос пока остаётся открытым","correct":true,"feedback":"Верно: вывод зависит от выборки геномов и методов"},{"id":"S12-L43-2","text":"Одна из групп точно ошиблась","correct":false,"feedback":"Расхождение ещё не указывает, кто прав"},{"id":"S12-L43-3","text":"Других бактериальных генов нет","correct":false,"feedback":"Обе группы их находят; спор — об их происхождении"}]}},{"id":"integration","num":44,"section":5,"questions":[1,2,3,4],"title":"Минимальная клеточная система: итоговая задача семестра","keywords":["Воспроизводство","Граница (системы)","Изменчивость","Наблюдение (статус утверждения)"],"lead":[],"mechanism":[],"paragraphs":["Итоговая задача собирает механизмы семестра в одну карту из девяти функциональных блоков: мембранная граница; транспорт и обмен; доступность энергетических ресурсов; каталитические реакции; наследственная информация; воспроизведение информационных молекул; производство функциональных компонентов; воспроизводство системы; наследуемая изменчивость. Студент выбирает три–четыре связанных блока. Для трёх предложенных наборов вопросов пять: какие функциональные зависимости между ними существуют; какие функции необходимы в заданных условиях; какие условия недостаточны для конкретного результата; какие изменения системы нарушат наследуемое воспроизводство; какие данные позволят проверить объяснение. Для собственного связного набора — три общих вопроса: о зависимостях, о недостающем условии и о нарушениях.","Главная граница: карта показывает зависимости в работе современной системы, а не порядок, в котором компоненты возникали. Рассуждение завершается цепью «наблюдение → допустимый вывод → альтернативная гипотеза → различающее свидетельство». Полная задача — в практикуме (итоговая задача)."],"conditions":"","sources":[],"base":"БИО-12·2, БИО-12·5, БИО-12·20; вспомнить семинары 1–11","level":"adv","next_base":"next","quiz":{"id":"S12-L44","question":"Стрелка на карте «наследственная информация → производство функциональных компонентов» означает…","options":[{"id":"S12-L44-1","text":"…что информация возникла раньше белков","correct":false,"feedback":"Карта не показывает исторический порядок"},{"id":"S12-L44-2","text":"…что синтез белков зависит от информации","correct":true,"feedback":"Верно: в работающей клетке синтез белков зависит от наследственной информации. Это функциональная зависимость"},{"id":"S12-L44-3","text":"…что белки не влияют на хранение информации","correct":false,"feedback":"Ферменты копируют и репарируют ДНК — зависимость взаимная"}]}},{"id":"next","num":45,"section":5,"questions":[1,2,3,4],"title":"Что дальше: второй семестр и старшие курсы","keywords":["Вариант"],"lead":[],"mechanism":[],"paragraphs":["Этот семинар завершает первый семестр. Во втором семестре курс переходит к механизмам эволюции: популяционной генетике — как изменяются частоты наследуемых вариантов в популяциях; механизмам микроэволюции — отбору, дрейфу, потоку генов; молекулярной эволюции генов и геномов; методам построения филогенетических деревьев и молекулярным часам; эволюции организмов и человека. Здесь эти темы затронуты только там, где без них нельзя понять происхождение клетки.","На старших курсах эволюционные принципы понадобятся в молекулярной биологии (происхождение генных семейств, митохондрий и систем контроля качества), в клинической биоинформатике (сравнение последовательностей и оценка гомологии вариантов) и в геномной медицине (митохондриальное наследование, перенос генов устойчивости у бактерий). Эти связи — добровольное продолжение, а не задание первого курса."],"conditions":"","sources":[],"quiz":{"id":"S12-L45","question":"Какая тема из этого семинара будет подробно изучаться во втором семестре?","options":[{"id":"S12-L45-1","text":"Строение и проницаемость плазматической мембраны","correct":false,"feedback":"Это тема первого семестра"},{"id":"S12-L45-2","text":"Синтез белка на рибосоме и генетический код","correct":false,"feedback":"Это тема первого семестра"},{"id":"S12-L45-3","text":"Филогенетические деревья и молекулярные часы","correct":true,"feedback":"Верно: методы их построения подробно разбирают во втором семестре"}]}},{"id":"links","num":46,"section":5,"questions":[1,2,3,4],"title":"Где эта тема в курсе","keywords":["АТФ (аденозинтрифосфат)","АТФ-синтаза","Граница (системы)","Деление (протоклетки)","Изменчивость","Порог ошибок"],"lead":[],"mechanism":[],"paragraphs":["Назад. Семинар 1 — мембрана и граница: бислой, проницаемость, градиенты (темы 1–2). Семинар 2 — цитоскелет: гомологи актина и тубулина у прокариот и асгардархей (тема 4). [[https://fresll.github.io/bio/seminar-3-route.html|Семинар 3]] и семинар 4 — адресация белков и путь секретируемого белка: сигналы импорта и транслоказы, эндомембраны (тема 4). [[https://fresll.github.io/bio/seminar-5-route.html|Семинар 5]] — энергетика: протонный градиент и АТФ-синтаза (тема 3). Семинар 6 — цикл и деление (деление протоклеток и органелл). [[https://fresll.github.io/bio/seminar-7-route.html|Семинары 7]]–[[https://fresll.github.io/bio/seminar-8-route.html|8]] — копирование ДНК, точность и мутации (порог ошибок, изменчивость). [[https://fresll.github.io/bio/seminar-9-route.html|Семинары 9]]–[[https://fresll.github.io/bio/seminar-10-route.html|10]] — транскрипция, процессинг и трансляция: рибосома как рибозим, генетический код, интроны и ядро (темы 2, 4). [[https://fresll.github.io/bio/seminar-11-route.html|Семинар 11]] — регуляция экспрессии: малые РНК и архейное происхождение белков Argonaute (тема 4).","Вперёд. Второй семестр — механизмы эволюции (БИО-12·45). Курс «Молекулярная биология»: семинары 7–9 (ресурсы, метаболические потоки, митохондрии), 11–12 (контроль качества белков и органелл)."],"conditions":"","sources":[]}],"sections":[{"title":"Введение","entry":"four-statuses","sub":"Наблюдение, возможность, реконструкция; как система работает и как она возникла","label":"Введение","integr":true},{"title":"Признаки живого и химические предпосылки","entry":"life-criteria","sub":"Живая система и химические предпосылки: что есть у объекта и что показал эксперимент","label":"Тема 1","integr":false},{"title":"РНК, катализ и протоклетка","entry":"rna-dual","sub":"РНК и протоклетка: почему копирующейся молекулы мало","label":"Тема 2","integr":false},{"title":"LUCA и основные клеточные линии","entry":"luca","sub":"LUCA: что можно восстановить по современным геномам","label":"Тема 3","integr":false},{"title":"Эукариогенез и митохондрии","entry":"eukaryote","sub":"Эукариотическая клетка: что доказано и что остаётся гипотезой","label":"Тема 4","integr":false},{"title":"Итог семестра","entry":"integration","sub":"Итоговая задача семестра и связи с курсом","label":"Итог","integr":true}],"glossary":[{"id":"S12-T01","term":"Абиогенный синтез","section":1,"def":"Образование органических соединений без участия живых организмов."},{"id":"S12-T02","term":"Автокаталитическая сеть","section":1,"def":"Набор химических реакций, продукты которого прямо или косвенно ускоряют образование компонентов той же сети."},{"id":"S12-T03","term":"Автономная живая система","section":1,"def":"Система, которая сама обеспечивает себя превращениями вещества и энергии, строит собственный аппарат воспроизводства и воспроизводится, сохраняя наследуемые различия."},{"id":"S12-T04","term":"Активация мономера","section":1,"def":"Перевод мономера в реакционноспособное состояние, облегчающее образование связи с другим мономером."},{"id":"S12-T05","term":"Активированный нуклеотид","section":1,"def":"Нуклеотид, содержащий реакционноспособную группу (например, фосфат, замкнутый в кольцо на рибозе, или фосфат, связанный с уходящей группой), за счёт которой нуклеотид присоединяется к цепи без внешнего источника энергии."},{"id":"S12-T06","term":"Альфа-протеобактерии","section":4,"def":"Группа бактерий, к которой принадлежал предок митохондрий."},{"id":"S12-T07","term":"Амфифил","section":2,"def":"Молекула, содержащая гидрофильную и гидрофобную части; в воде амфифилы самопроизвольно образуют мицеллы, бислои и везикулы."},{"id":"S12-T08","term":"Археи","section":3,"def":"Одна из двух первичных линий клеточной жизни; безъядерные клетки, отличающиеся от бактерий строением мембранных липидов, оболочек и информационных систем."},{"id":"S12-T09","term":"Асгардархеи (Asgard Archaea)","section":3,"def":"Группа архей, наиболее близкая к ядерной линии эукариот; в их геномах есть гомологи многих эукариотических белков."},{"id":"S12-T10","term":"АТФ (аденозинтрифосфат)","section":3,"def":"Нуклеотид, энергия гидролиза которого используется во многих процессах клетки."},{"id":"S12-T11","term":"АДФ (аденозиндифосфат)","section":3,"def":"Продукт гидролиза АТФ и субстрат его синтеза."},{"id":"S12-T12","term":"АТФ-синтаза","section":3,"def":"Мембранный ферментный комплекс: протоны, проходящие по градиенту через его ротор, вращают его, и каталитическая часть синтезирует АТФ из АДФ и фосфата."},{"id":"S12-T13","term":"Бактерии","section":3,"def":"Одна из двух первичных линий клеточной жизни; безъядерные клетки, отличающиеся от архей строением мембранных липидов, оболочек и информационных систем."},{"id":"S12-T14","term":"Вариант","section":1,"def":"Одна из различающихся форм воспроизводящейся системы или молекулы в популяции."},{"id":"S12-T15","term":"Везикула","section":1,"def":"Замкнутый пузырёк, ограниченный бислоем амфифилов и содержащий внутри водную среду."},{"id":"S12-T16","term":"Вертикальное наследование","section":3,"def":"Передача генов от родительской клетки или организма потомкам."},{"id":"S12-T17","term":"Вироид","section":1,"def":"Короткая кольцевая молекула РНК, заражающая растения; собственных белков не кодирует и копируется ферментами клетки хозяина."},{"id":"S12-T18","term":"Воспроизводство","section":1,"def":"Образование системой подобных себе систем."},{"id":"S12-T19","term":"Гидрогеносома","section":4,"def":"Органелла, производная митохондрии, участвующая в анаэробном энергетическом обмене и обычно образующая водород."},{"id":"S12-T20","term":"Гомология","section":3,"def":"Сходство, обусловленное общим происхождением; гомологичные гены происходят от общего предкового гена."},{"id":"S12-T21","term":"Горизонтальный перенос генов","section":3,"def":"Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями."},{"id":"S12-T22","term":"Граница (системы)","section":1,"def":"Структура, отделяющая систему от среды и удерживающая её компоненты; у клеток — плазматическая мембрана."},{"id":"S12-T23","term":"Деление (протоклетки)","section":1,"def":"Разделение компартмента на дочерние с распределением содержимого между ними."},{"id":"S12-T24","term":"Дерево гена","section":3,"def":"Схема родства последовательностей одного гена у разных организмов; может не совпадать с деревом клеточных линий."},{"id":"S12-T25","term":"Дерево клеточных линий","section":3,"def":"Схема преемственности клеточного воспроизводства, построенная по многим генам."},{"id":"S12-T26","term":"Дифференциальное воспроизводство","section":1,"def":"Различие вариантов по ожидаемому числу потомков."},{"id":"S12-T27","term":"Дупликация гена","section":4,"def":"Возникновение второй копии гена в геноме."},{"id":"S12-T28","term":"Естественный отбор","section":1,"def":"Изменение наследственного состава популяции, при котором варианты, оставляющие в данной среде больше потомков, увеличивают свою долю; требует изменчивости, наследственности и дифференциального воспроизводства."},{"id":"S12-T29","term":"Жирная кислота","section":2,"def":"Карбоновая кислота с длинной углеводородной цепью; в моделях протоклеток образует бислойные везикулы."},{"id":"S12-T30","term":"Изменчивость","section":1,"def":"Существование различающихся вариантов в популяции."},{"id":"S12-T31","term":"Калибровка","section":3,"def":"Привязка узла дерева к возрасту, известному по ископаемым остаткам или изотопным данным; используется в молекулярных часах."},{"id":"S12-T32","term":"Компартмент","section":1,"def":"Ограниченное пространство, удерживающее взаимодействующие молекулы рядом: минеральная пора, капля или мембранная везикула."},{"id":"S12-T33","term":"Комплексы SMC","section":3,"def":"Белковые комплексы поддержания структуры хромосом (когезин, конденсины, SMC5/6), организующие ДНК с затратой АТФ."},{"id":"S12-T34","term":"Концентрирование","section":1,"def":"Повышение местного содержания вещества (высыхание, замерзание, адсорбция, удержание в порах и везикулах)."},{"id":"S12-T35","term":"Линии, не оставившие потомков","section":3,"def":"Эволюционные линии, существовавшие в прошлом и угасшие; на дереве современных организмов они не отражаются."},{"id":"S12-T36","term":"Липидный бислой","section":2,"def":"Двойной слой амфифильных молекул, гидрофобные части которых обращены друг к другу; основа клеточных мембран."},{"id":"S12-T37","term":"Липосома","section":1,"def":"Искусственная везикула, ограниченная бислоем фосфолипидов."},{"id":"S12-T38","term":"LECA (Last Eukaryotic Common Ancestor)","section":3,"def":"Последний общий предок всех современных эукариот."},{"id":"S12-T39","term":"LUCA (Last Universal Common Ancestor)","section":3,"def":"Последний универсальный общий предок всех современных клеточных линий; узел дерева, предковая популяция и реконструируемый набор свойств."},{"id":"S12-T40","term":"Матрица (РНК-матрица)","section":1,"def":"Цепь нуклеиновой кислоты, по которой по принципу комплементарности строится новая цепь. Подробнее — семинар 7."},{"id":"S12-T41","term":"Митосома","section":4,"def":"Сильно редуцированная органелла, производная митохондрии; не синтезирует АТФ, у многих линий участвует в сборке железо-серных кластеров."},{"id":"S12-T42","term":"Митохондриальная ДНК (мтДНК)","section":4,"def":"Собственная ДНК митохондрий; у человека кодирует 13 белков и 24 РНК."},{"id":"S12-T43","term":"Митохондрия","section":1,"def":"Органелла эукариотической клетки с двумя мембранами и собственной ДНК, в которой происходят окисление субстратов и синтез АТФ."},{"id":"S12-T44","term":"Мицелла","section":2,"def":"Шарообразное скопление амфифилов, гидрофобные части которых обращены внутрь."},{"id":"S12-T45","term":"Мобильный генетический элемент","section":3,"def":"Участок ДНК, способный перемещаться в геноме или между клетками (плазмида, транспозон, геном бактериофага)."},{"id":"S12-T46","term":"Молекулярные часы","section":3,"def":"Статистическая модель, связывающая число замен в последовательностях со временем, прошедшим от общего предка."},{"id":"S12-T47","term":"Наблюдение (статус утверждения)","section":1,"def":"Утверждение, установленное непосредственно: измерено, увидено или получено в эксперименте."},{"id":"S12-T48","term":"Накопление","section":1,"def":"Рост количества вещества, когда его образование и поступление превышают разрушение и вынос."},{"id":"S12-T49","term":"Направленная эволюция","section":2,"def":"Лабораторный метод: многократный отбор из смеси вариантов молекул тех, что выполняют нужную функцию, их размножение и внесение новых изменений."},{"id":"S12-T50","term":"Наследственность","section":1,"def":"Передача различий между системами следующему циклу воспроизводства."},{"id":"S12-T51","term":"Не следует из данных (статус утверждения)","section":1,"def":"Вывод, который имеющиеся данные не обосновывают: данных недостаточно, или вывод подменяет одно утверждение другим."},{"id":"S12-T52","term":"Обмен веществ","section":1,"def":"Совокупность превращений вещества и энергии в системе, включая синтез и распад."},{"id":"S12-T53","term":"Образование (вещества)","section":1,"def":"Появление вещества в реакции или его поступление извне."},{"id":"S12-T54","term":"Ортологи","section":3,"def":"Гомологичные гены разных линий, разошедшиеся при разделении линий."},{"id":"S12-T55","term":"Паразитическая РНК","section":2,"def":"В моделях — молекула РНК, которую копирует общий катализатор, но которая сама не выполняет полезной для системы функции."},{"id":"S12-T56","term":"Паралоги","section":3,"def":"Гомологичные гены, возникшие при дупликации в одной линии."},{"id":"S12-T57","term":"Поддержание внутренней среды","section":1,"def":"Сохранение системой внутреннего состава, отличающегося от состава среды."},{"id":"S12-T58","term":"Показанная возможность (статус утверждения)","section":1,"def":"Утверждение о том, что процесс может идти без участия живых систем, если он воспроизведён в эксперименте при заданных условиях."},{"id":"S12-T59","term":"Полимеризация","section":1,"def":"Соединение мономеров в цепь."},{"id":"S12-T60","term":"Порог ошибок","section":2,"def":"Область значений точности копирования и длины последовательности, за которой полезная последовательность перестаёт устойчиво поддерживаться отбором; положение порога зависит от параметров системы."},{"id":"S12-T61","term":"Потеря гена","section":3,"def":"Исчезновение гена в эволюционной линии; после потери ген отсутствует у всех потомков этой линии."},{"id":"S12-T62","term":"Промотор","section":4,"def":"Участок ДНК у начала гена, на котором собираются общие факторы транскрипции и РНК-полимераза; задаёт точку начала и направление транскрипции. Подробнее — семинар 9."},{"id":"S12-T63","term":"Протоклетка","section":2,"def":"Предполагаемый компартмент, в котором граница связана с внутренними реакциями и воспроизведением."},{"id":"S12-T64","term":"Протондвижущая сила","section":3,"def":"Электрохимическая разность потенциалов протонов на мембране."},{"id":"S12-T65","term":"Протонный насос","section":3,"def":"Мембранный белковый комплекс, переносящий протоны против градиента."},{"id":"S12-T66","term":"Разобщитель","section":3,"def":"Вещество, переносящее протоны через мембрану в обход АТФ-синтазы и разряжающее протонный градиент."},{"id":"S12-T67","term":"Реконструкция (статус утверждения)","section":1,"def":"Утверждение о прошлом (историческая гипотеза или модель), выведенное из наблюдений с помощью допущений."},{"id":"S12-T68","term":"Репликатор","section":1,"def":"Наследуемая информационная структура, копии которой образуются в репликативной системе."},{"id":"S12-T69","term":"Рибозим","section":1,"def":"Молекула РНК, обладающая каталитической активностью."},{"id":"S12-T70","term":"Рибозим-полимераза","section":2,"def":"Рибозим, полученный направленной эволюцией, который удлиняет цепь РНК по матрице."},{"id":"S12-T71","term":"Рибосома","section":1,"def":"Комплекс рРНК и белков, синтезирующий белок по мРНК; состоит из малой и большой субчастиц. Подробнее — семинар 10."},{"id":"S12-T72","term":"Связь функции с ростом (в протоклетке)","section":2,"def":"Зависимость роста и деления компартмента от функции молекулы внутри него; условие отбора протоклеток."},{"id":"S12-T73","term":"Сигнал импорта","section":4,"def":"Участок белка (у многих белков митохондрий — N-концевая последовательность), по которому белок узнают транслоказы органеллы. Подробнее — семинар 3."},{"id":"S12-T74","term":"Синтрофия","section":4,"def":"Взаимозависимый обмен метаболитами, при котором совместная деятельность партнёров делает реакции энергетически возможными или более выгодными."},{"id":"S12-T75","term":"Сохранение (вещества)","section":1,"def":"Существование вещества без разрушения до следующего звена превращений."},{"id":"S12-T76","term":"Степень поддержки (вывода)","section":4,"def":"Оценка силы совокупности свидетельств в пользу утверждения: от «данных в поддержку нет» до «убедительно поддержано»."},{"id":"S12-T77","term":"Транслоказа внешней мембраны","section":4,"def":"Белковый комплекс внешней мембраны митохондрии, через который импортируются белки. Подробнее — семинар 3."},{"id":"S12-T78","term":"Фагоцитоз","section":4,"def":"Захват крупных частиц клеткой с перестройкой мембраны и актинового цитоскелета."},{"id":"S12-T79","term":"Фн","section":4,"def":"Неорганический фосфат."},{"id":"S12-T80","term":"FECA (First Eukaryotic Common Ancestor)","section":4,"def":"Раннее реконструируемое состояние стволовой линии эукариот."},{"id":"S12-T81","term":"Хемиосмос","section":3,"def":"Сопряжение потока ионов через мембрану по электрохимическому градиенту с синтезом АТФ."},{"id":"S12-T82","term":"Химерный геном","section":4,"def":"Геном, сформированный из генов разного происхождения; у эукариот — архейного, бактериального и неясного."},{"id":"S12-T83","term":"Химическое обогащение","section":1,"def":"Изменение состава смеси за счёт разной скорости образования или разной устойчивости веществ, без передачи различий следующим циклам."},{"id":"S12-T84","term":"Цепь переноса электронов","section":3,"def":"Набор белковых комплексов мембраны, которые передают электроны от доноров к конечному акцептору и за счёт этого переносят протоны через мембрану."},{"id":"S12-T85","term":"Эндосимбиоз","section":4,"def":"Длительное сожительство организма внутри клетки другого организма."},{"id":"S12-T86","term":"Эндосимбиотический перенос гена","section":4,"def":"Функциональный перенос гена из генома эндосимбионта или органеллы в ядерный геном."},{"id":"S12-T87","term":"Эукариогенез","section":4,"def":"Исторический процесс формирования эукариотической клеточной организации от FECA до LECA."},{"id":"S12-T88","term":"Ядро","section":3,"def":"Отделённый ядерной оболочкой компартмент эукариотической клетки, в котором находятся хромосомы и идут репликация и транскрипция. Подробнее — семинар 3."},{"id":"S12-T89","term":"Ядерная оболочка","section":4,"def":"Две мембраны вокруг ядра; наружная продолжается в мембрану эндоплазматического ретикулума; обе прерываются ядерными порами. Подробнее — семинар 3."},{"id":"S12-T90","term":"Ядерная пора","section":4,"def":"Отверстие в ядерной оболочке, занятое белковым комплексом, через который вещества избирательно проходят между ядром и цитоплазмой. Подробнее — семинар 3."},{"id":"S12-T91","term":"Эндомембранная система","section":4,"def":"Внутренние мембраны эукариотической клетки — ядерная оболочка, эндоплазматический ретикулум, аппарат Гольджи, эндосомы и лизосомы, — связанные потоками мембранных пузырьков. Подробнее — семинар 3."}],"sources":{"src_01":{"url":"","cite":"Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022","doi":"","pmid":""},"src_02":{"url":"https://doi.org/10.1038/s41559-022-01733-y","cite":"Mills D. B., Boyle R. A., Daines S. J. et al. Eukaryogenesis and oxygen in Earth history. Nat. Ecol. Evol. 2022; 6: 520–532","doi":"10.1038/s41559-022-01733-y","pmid":""},"src_03":{"url":"https://doi.org/10.1038/s41559-024-02461-1","cite":"Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666","doi":"10.1038/s41559-024-02461-1","pmid":""},"src_04":{"url":"https://doi.org/10.1038/s41586-025-09960-6","cite":"Tobiasson V., Luo J., Wolf Y. I., Koonin E. V. Dominant contribution of Asgard archaea to eukaryogenesis. Nature 2026; 650: 141–149","doi":"10.1038/s41586-025-09960-6","pmid":""},"src_05":{"url":"https://doi.org/10.1038/s41586-025-09808-z","cite":"Kay C. J., Spang A., Szöllősi G. J., Pisani D., Williams T. A., Donoghue P. C. J. Dated gene duplications elucidate the evolutionary assembly of eukaryotes. Nature 2026; 650: 129–140","doi":"10.1038/s41586-025-09808-z","pmid":""},"src_06":{"url":"https://doi.org/10.1038/s41586-026-1 /* Объяснения к семинару 12. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => s.replace(/(шаге? )?БИО-12·(\d+)((?:, 12·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
/* семинар 11, v1.1.7: курсив названий генов (<i>lacZ</i>) — после экранирования разрешён только тег <i> без атрибутов;
   семинар 12: и <b> без атрибутов (полужирные названия звеньев в БИО-12·9, 04) */
const rt = s => stepRefs(esc(s)).replace(/&lt;i&gt;([^&<]{1,80}?)&lt;\/i&gt;/g, '<i>$1</i>').replace(/&lt;b&gt;([^&<]{1,80}?)&lt;\/b&gt;/g, '<b>$1</b>').replace(/\[\[(T\d{2,3})\|([^\]]+)\]\]/g, (_, id, t) => `<a class="gl" href="#glossary-S12-${id}" data-gloss="S12-${id}">${t}</a>`)
  /* каркас с 23.10.2026 (из сем. 9): внешняя ссылка [[https://…|текст]] открывается в новой вкладке */
  .replace(/\[\[(https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, (_, u, t) => `<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`);
/* каркас с 23.10.2026 (из сем. 9): в заглавных надписях (CSS uppercase) символ «Ca» не должен превращаться в «CA» */
const ncap = s => esc(s).replace(/Ca(?=²⁺)/g, '<span style="text-transform:none">Ca</span>');
const plain = s => String(s).replace(/\[\[(T\d{2,3}|https?:\/\/[^|\]\s]+)\|([^\]]+)\]\]/g, '$2');

/* ---------- хранение: один ключ, шаги и итоговая проверка раздельно ---------- */
const KEY = 'bio-s12-explanations-v1-progress';
let store = {v: 1, steps: {}, exam: {}}, state = {}, current = 'home';
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.v === 1) store = {v: 1, steps: raw.steps || {}, exam: raw.exam || {}, last: raw.last || null};
} catch (e) {}
/* ревизия вопроса (quiz.rev, по умолчанию 1): после содержательной правки вопроса rev увеличивают, и прежняя отметка не засчитывается;
   записи шагов, которых больше нет, не учитываются. Записи без rev считаются rev 1 — прежний прогресс сохраняется. */
const qrev = l => (l.quiz && l.quiz.rev) || 1;
(function () {
  const cur = {}; CONTENT.lessons.forEach(l => { cur[l.id] = qrev(l); });
  ['steps', 'exam'].forEach(k => Object.keys(store[k]).forEach(id => { const r = store[k][id]; if (!(id in cur) || !r || (r.rev || 1) !== cur[id]) delete store[k][id]; }));

function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {

/* =====================================================================
   s0_gn.js — общие детали схем семинара 9 «Транскрипция и процессинг пре-мРНК». Общие для практикума и «Объяснений».
   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;
   оранжевая — РНК; фиолетовый овал — РНК-полимераза II; на генах и мРНК: тёмная заливка — кодирующий участок,
   светлая — нетранслируемая область (НТО), тонкая линия — интрон; красный кружок m⁷G — кэп; «AAAA» — поли(А)-хвост.
   Ядерная оболочка — две мембраны (каждая — липидный бислой) с ядерной порой. Это схемы, не химические формулы.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t()). Группы data-g — справка (gn_<g>, g_<g>).
   GN.seq — преобразования последовательностей (чистые функции, проверяются тестом tests9/models.mjs).
   ===================================================================== */
const GN = (function () {
  const C = { tpl: '#1F3B73', cod: '#8AA0BF', rna: '#E8912A', rnaL: '#F6D7AE', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',
    bad: '#C0392B', warn: '#C77700', ok: '#2E9B57', pol: '#7C4DBE', tfd: '#2C7FB8', tfb: '#4E9AC7', tfh: '#1F8A8A', tfo: '#6C8FB0',
    med: '#8A5A12', act: '#B85C00', cap: '#B03A2E', cpa: '#3D5A99', spl: '#2E9B57', exp: '#1F8A8A', xrn: '#6A3FA0',
    cds: '#4F86C6', utr: '#BBD0EA', mem: '#9C8F6E', memH: '#C9B98F', panel: '#F4F7FA', line: '#D3DAE3', nuc: '#FBF8F1', cyt: '#F3F7FB' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* подпись: anchor m — по центру, l — слева, r — справа; o.w — жирность, o.size, o.col; o.bg — белая подложка.
     Цвет повторён в style: правило оболочки «Объяснений» .widget svg text{fill:var(--ink)} перекрывало атрибут fill,
     и цветные подписи (красные замены, зелёный старт-кодон) в «Объяснениях» становились чёрными (семинар 10, v1.0). */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a};fill:${o.col || C.ink}"${o.it ? ' font-style="italic"' : ''}${o.mono ? ' font-family="ui-monospace,Menlo,Consolas,monospace"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function textN(x, y, s, o = {}) { return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join(''); }
  function panel(x, y, w, h, title, fill) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${fill || C.panel}" stroke="${C.line}"/>` + (title ? text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted }) : '');
  }
  function arrow(x1, y1, x2, y2, col = C.muted, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
    const p1 = [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], p2 = [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)];
    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* белок: скруглённый прямоугольник с короткой подписью; o.op — непрозрачность (полупрозрачный — этап не начат или деталь вынута) */
  function blob(x, y, w, h, col, g, label, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2)}" fill="${col}" opacity="${o.op != null ? o.op : .93}" stroke="#fff" stroke-width="1.5"${o.dash ? ' stroke-dasharray="4 3"' : ''}/>` +
      (label ? (() => { const op = o.dash ? 1 : Math.min(1, (o.op != null ? o.op : .93) / .93), tx = text(x, y + 1, label, { size: o.size || 12, w: 700, col: '#fff' });
        return op < .9 ? `<g opacity="${f(op)}">${tx}</g>` : tx; })() : ''));   /* v1.2 (рецензия интерактива И-13): без «призраков» подписей у ещё не появившихся факторов */
  }
  /* красный крест: этап, на котором процесс остановился */
  function cross(x, y, r = 9) { return `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`; }

  /* ---------- последовательности ---------- */
  const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G', U: 'A' };
  const seq = {
    comp: s => s.split('').map(c => PAIR[c]).join(''),          /* комплементарная цепь, записанная под исходной (в обратной ориентации) */
    rev: s => s.split('').reverse().join(''),
    revcomp: s => seq.rev(seq.comp(s)),                          /* комплементарная цепь, записанная 5′→3′ */
    toRNA: s => s.replace(/T/g, 'U'),
    /* единица транскрипции на участке: top — верхняя цепь 5′→3′ слева направо; u = { a, b, dir: '+' (вправо) | '-' (влево) } */
    unit(top, u) {
      const part = top.slice(u.a, u.b + 1);
      const tplStrand = u.dir === '+' ? 'bot' : 'top', codStrand = u.dir === '+' ? 'top' : 'bot';
      const rna = seq.toRNA(u.dir === '+' ? part : seq.revcomp(part));             /* РНК 5′→3′ */
      const tpl35 = u.dir === '+' ? seq.comp(part) : seq.rev(part);                 /* матрица, записанная 3′→5′ (по ходу синтеза) */
      return { tplStrand, codStrand, rna, tpl35, len: part.length };
    },
  };

  /* ---------- двойная цепь ДНК с буквами ----------
     d: { x, y, dx, top, bot (bot — комплементарна top), tplStrand: 'top' | 'bot' | null, from, to — выделенный участок,
          lbl: true — концевые 5′/3′, size — размер букв, bubble: [a, b] — расплетённый участок (цепи расходятся) } */
  function duplex(d) {
    const n = d.top.length, dx = d.dx || 30, x0 = d.x, y = d.y, gap = d.gap || 26, X = i => x0 + i * dx;
    const sz = d.size || 14, bw = Math.min(22, dx - 4), bh = sz + 6;
    const colT = d.tplStrand === 'top' ? C.tpl : C.cod, colB = d.tplStrand === 'bot' ? C.tpl : C.cod;
    const gT = d.tplStrand === 'top' ? 'template' : d.tplStrand ? 'coding' : 'dna', gB = d.tplStrand === 'bot' ? 'template' : d.tplStrand ? 'coding' : 'dna';
    const bub = d.bubble, open = i => bub && i >= bub[0] && i <= bub[1];
    const yT = i => y - gap - (open(i) ? (d.open || 10) : 0), yB = i => y + gap + (open(i) ? (d.open || 10) : 0);
    let s = '';
    /* остовы: ломаная, чтобы показать расплетённый участок */
    const pathOf = yy => { let p = `M${f(X(0) - dx * .45)},${f(yy(0))}`; for (let i = 0; i < n; i++) p += ` L${f(X(i))},${f(yy(i))}`; return p + ` L${f(X(n - 1) + dx * .45)},${f(yy(n - 1))}`; };
    s += G(gT, `<path d="${pathOf(yT)}" fill="none" stroke="${colT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    s += G(gB, `<path d="${pathOf(yB)}" fill="none" stroke="${colB}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    for (let i = 0; i < n; i++) {
      const x = X(i), hl = d.from != null && i >= d.from && i <= d.to;
      if (!open(i)) s += line(x, yT(i) + bh / 2 + 3, x, yB(i) - bh / 2 - 3, C.rung, 1.4, 'stroke-dasharray="2.5 2.5"');
      s += baseL(x, yT(i) + (bh / 2 + 3), d.top[i], hl ? 'hl' : null, bw, bh, sz) + baseL(x, yB(i) - (bh / 2 + 3), d.bot[i], hl ? 'hl' : null, bw, bh, sz);
    }
    if (d.lbl !== false) {
