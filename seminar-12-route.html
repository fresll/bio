<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-12.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Как появилась клетка: данные и модели</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-four-statuses"><div class="eyebrow">Введение · шаг 1 из 46</div><h2>Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных</h2><p class="lead"></p><ol class="mech"></ol><p>Как изучать событие, которое произошло около четырёх миллиардов лет назад и которое нельзя повторить? Учёные располагают тремя видами материала. Первый — наблюдения: свойства современных клеток и геномов, состав древних пород и метеоритов, результаты экспериментов. Второй — экспериментально показанные возможности: в лаборатории удаётся воспроизвести отдельные процессы, например образование органических молекул или копирование РНК, при условиях, которые задал экспериментатор. Третий — реконструкции: утверждения о прошлом — модели и исторические гипотезы, которые выводят из наблюдений с помощью допущений. Четвёртая категория — выводы, которые из имеющихся данных не следуют: для них данных недостаточно, или они подменяют одно утверждение другим. Эти четыре статуса используются во всём семинаре.</p><p>Главное правило семинара: возможность процесса в эксперименте не доказывает, что именно этот процесс происходил при возникновении жизни. Реконструкция может быть очень убедительной, если её поддерживают несколько независимых линий данных, и слабой, если она держится на одном допущении.</p><div class="static-quiz"><h3>В образцах астероида найдены азотистые основания. Какая это категория?</h3><ol><li><b>А.</b> Наблюдение <i>(верный вариант)</i><br><span class="expl">Верно: наличие молекул в образце измерено. Вывод о том, что такие молекулы стали материалом первых генов Земли, — уже не наблюдение</span></li><li><b>Б.</b> Показанная возможность <i>(неверный вариант)</i><br><span class="expl">Показанная возможность — процесс, воспроизведённый в эксперименте. Здесь сообщается о самой находке в природном образце — это наблюдение. Вывод, что основания образовались без участия живых систем, — уже реконструкция по условиям образца и контрольным пробам</span></li><li><b>В.</b> Реконструкция <i>(неверный вариант)</i><br><span class="expl">Реконструкция — утверждение о прошлом. Найденные молекулы — данные, а не объяснение</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-function-origin"><div class="eyebrow">Введение · шаг 2 из 46</div><h2>Как система работает и как она возникла — разные вопросы</h2><p class="lead"></p><ol class="mech"></ol><p>Современная клетка состоит из взаимозависимых систем. Геном не копируется без ферментов и мономеров, ферменты синтезируются по генам на рибосомах, рибосомы работают внутри мембранного компартмента, который поддерживает нужный состав среды (вспомнить семинар 1, <a href="https://fresll.github.io/bio/seminar-10-route.html#ribosome">БИО-10·13</a>). Из этой взаимозависимости часто делают неверный вывод: раз сейчас всё нужно одновременно, всё и возникло одновременно, в современном виде. Это не так. Взаимозависимость описывает работу системы сейчас, а не историю её сборки: компоненты могли появляться постепенно, сначала выполнять другие функции и лишь позже стать незаменимыми.</p><p>Вторая ловушка — представлять эволюцию как движение к заранее заданной цели, к современной клетке. Эволюционные изменения не направлены к будущему результату: в каждом поколении сохранялись варианты, которые в данных условиях воспроизводились лучше. Поэтому вопрос «зачем возникла мембрана» лучше заменять вопросами «какое преимущество давала граница в тех условиях» и «какие данные это показывают».</p><div class="static-quiz"><h3>Утверждение: «Мембрана, геном и рибосома не работают друг без друга, значит, они возникли одновременно». Что в нём неверно?</h3><ol><li><b>А.</b> Ничего: сложные системы возникают сразу целиком <i>(неверный вариант)</i><br><span class="expl">Эволюционные изменения обычно постепенны; одновременное появление сложной системы потребовало бы отдельного доказательства</span></li><li><b>Б.</b> Взаимозависимость не говорит о порядке появления <i>(верный вариант)</i><br><span class="expl">Верно. Из современной взаимозависимости не следует одновременное возникновение: компоненты могли появляться постепенно. Описание работы клетки сейчас не равно описанию её истории</span></li><li><b>В.</b> Неверно, что эти три системы зависят друг от друга <i>(неверный вариант)</i><br><span class="expl">Взаимозависимость реальна — неверен вывод о происхождении</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1098/rstb.2024.0292">Carbonell P., Peretó J. Before LUCA: unearthing the chemical roots of metabolism. Phil. Trans. R. Soc. B 2025; 380: 20240292</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-life-criteria"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 3 из 46</div><h2>Признаки живых систем и почему нет единственного определения</h2><p class="lead"></p><ol class="mech"></ol><p>Для известных клеточных организмов обычно называют такие признаки: клеточная организация с границей, отделяющей систему от среды; обмен веществ — совокупность превращений вещества и энергии; воспроизводство собственной организации; наследственность и изменчивость; поддержание относительного постоянства внутренней среды. Каждый признак по отдельности встречается и в неживой природе: кристалл растёт, сохраняя структуру; пламя поддерживается притоком вещества и энергии; жирнокислотные везикулы подходящего состава самопроизвольно собираются, а в отдельных экспериментах делились при механическом воздействии. Поэтому значение имеет не отдельный признак, а их функциональное сочетание.</p><p>Единого универсального определения жизни нет. В исследованиях происхождения жизни часто используют рабочее определение: жизнь — самоподдерживающаяся химическая система, способная к дарвиновской эволюции. Это соглашение, а не закон природы. Вирусы и вироиды несут наследственную информацию и изменяются под действием отбора, но воспроизводятся только с помощью клетки; отнести их к живому или нет — вопрос выбранного определения. Наблюдения о них от этого выбора не меняются.</p><div class="static-quiz"><h3>Какое утверждение о признаках живых систем верно?</h3><ol><li><b>А.</b> Достаточно обмена веществ с притоком энергии <i>(неверный вариант)</i><br><span class="expl">Превращения вещества за счёт внешней энергии идут и в неживых системах, например в автокаталитических сетях; одного этого признака мало</span></li><li><b>Б.</b> Достаточно способности расти и затем делиться <i>(неверный вариант)</i><br><span class="expl">Растут и делятся и неживые структуры, например жирнокислотные везикулы; без наследственности и собственного аппарата воспроизводства это не живая система</span></li><li><b>В.</b> Живое отличает сочетание признаков, а не один <i>(верный вариант)</i><br><span class="expl">Верно. Каждый признак по отдельности встречается и вне живого; живую систему отличает их функциональное сочетание: граница, обмен веществ, собственный аппарат воспроизводства, наследственность и изменчивость</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://astrobiology.nasa.gov/research/life-detection/about/">NASA Astrobiology. Life Detection: About (рабочее определение жизни). URL: https://astrobiology.nasa.gov/research/life-detection/about/ (проверено 16.11.2026)</a></li><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1371/journal.pbio.3003780">Krupovic M., Koonin E. V. The selfish ribosome. PLoS Biol. 2026; 24: e3003780</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-selection"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 4 из 46</div><h2>Условия естественного отбора</h2><p class="lead"></p><ol class="mech"></ol><p>Способность к дарвиновской эволюции характеризует не отдельную неизменную особь, а популяцию воспроизводящихся систем. Для естественного отбора необходимы три условия: изменчивость — существуют различающиеся варианты; наследственность — хотя бы часть различий передаётся следующим поколениям; дифференциальное воспроизводство — наследуемые различия влияют на ожидаемое число потомков. При выполнении всех трёх условий варианты, оставляющие в данной среде больше потомков, в среднем увеличивают свою долю.</p><p>Важно слово «в среднем»: в небольшой популяции полезный вариант может быть утрачен случайно, поэтому отбор повышает вероятность закрепления варианта, но не гарантирует его. Естественный отбор — один из механизмов эволюции, но не единственный; другие разбирают во втором семестре.</p><p>Те же три условия действуют не только в популяциях организмов, но и в популяции клеток внутри организма: в опухоли клоны различаются скоростью деления, различия наследуются при делении, и состав опухоли изменяется (вспомнить <a href="https://fresll.github.io/bio/seminar-8-route.html#error-damage-mutation">БИО-8·1</a>).</p><div class="static-quiz"><h3>Варианты различаются и оставляют разное число потомков, но потомки не наследуют особенность родителей. Будет ли действовать отбор?</h3><ol><li><b>А.</b> Нет: различие не наследуется потомками <i>(верный вариант)</i><br><span class="expl">Верно. Без наследования доля варианта не растёт. Все три условия необходимы одновременно</span></li><li><b>Б.</b> Да: достаточно разного числа потомков <i>(неверный вариант)</i><br><span class="expl">Если потомки не похожи на родителей, преимущество родителя не переходит к следующему поколению</span></li><li><b>В.</b> Да, но медленнее, чем при наследовании <i>(неверный вариант)</i><br><span class="expl">Без наследования доля варианта в среднем вообще не изменяется</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li></ul><p></p></details></article><article class="card print-unit" id="ns-replicator"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 5 из 46</div><h2>Репликатор, компартмент и автономная система</h2><p class="lead"></p><ol class="mech"></ol><p>Наследственная преемственность требует копирования информации. Репликатором называют наследуемую информационную структуру, копии которой образуются в репликативной системе; стадии копирования могут выполнять другие компоненты системы. В клетке молекулы ДНК копирует комплекс ферментов (вспомнить <a href="https://fresll.github.io/bio/seminar-7-route.html#system-map">БИО-7·29</a>); геном вируса копируется ферментами заражённой клетки. В моделях ранней эволюции предполагают, что первые репликаторы были проще и могли служить матрицами для собственного копирования.</p><p>Репликатор ещё не является автономной живой системой. Сам по себе он не обеспечивает себя мономерами и энергией, не удерживает продукты своей работы и не строит аппарат копирования. Компартмент — ограниченное пространство, например липидная везикула, — удерживает взаимодействующие молекулы рядом и связывает их действие с ростом и делением всей системы. Но и одной границы недостаточно: рост и деление оболочки должны быть согласованы с копированием внутренних компонентов. Клетка — минимальная известная система, в которой наследственный материал, синтез белка, обмен веществ и воспроизводство объединены в общий цикл. Её автономность относительна: любая клетка зависит от притока вещества и энергии.</p><div class="static-quiz"><h3>Чем репликатор отличается от автономной живой системы?</h3><ol><li><b>А.</b> Репликатор не может изменяться при копировании, а система может <i>(неверный вариант)</i><br><span class="expl">Ошибки копирования создают наследуемую изменчивость репликаторов</span></li><li><b>Б.</b> Он не обеспечивает себя веществами и аппаратом <i>(верный вариант)</i><br><span class="expl">Верно. Репликатор копируется в репликативной системе, но сам не обеспечивает себя веществами, энергией и аппаратом копирования. Автономная система объединяет копирование с обменом веществ, границей и воспроизводством</span></li><li><b>В.</b> Репликатор всегда крупнее любой клетки <i>(неверный вариант)</i><br><span class="expl">Размер здесь ни при чём; различие — в наборе функций</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-early-earth"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 6 из 46</div><h2>Ранняя Земля: много сред, а не одна</h2><p class="lead"></p><ol class="mech"></ol><p>Земля сформировалась около 4,54 млрд лет назад. Условия на ранней Земле менялись: планета остывала, продолжались вулканизм и падения крупных тел. Изотопный состав древнейших кристаллов циркона совместим с существованием жидкой воды и остывшей коры около 4,4 млрд лет назад. Свободного кислорода в атмосфере было крайне мало, но её общий состав — доли метана, аммиака, водорода, углекислого газа и азота — восстанавливают косвенно, и он остаётся предметом обсуждения. Поэтому выражение «условия ранней Земли» обозначает не одну газовую смесь, а множество местных сред: водоёмы суши, геотермальные поля, лёд, минеральные поверхности, гидротермальные источники.</p><p>Даты ранней истории получены разными способами и различаются надёжностью: возраст Земли измерен радиометрически, условия среды — по минералам и изотопам, следы жизни — по ископаемым остаткам и химическим следам организмов (одни из древнейших убедительных — в породах возрастом около 3,48 млрд лет), а возраст общих предков — моделями молекулярной эволюции (БИО-12·34).</p><div class="static-quiz"><h3>Почему нельзя говорить об одной «атмосфере ранней Земли» как об установленном факте?</h3><ol><li><b>А.</b> Потому что атмосферы у Земли тогда ещё не было <i>(неверный вариант)</i><br><span class="expl">Атмосфера была; не установлен её точный состав</span></li><li><b>Б.</b> Потому что состав атмосферы был таким же, как сейчас <i>(неверный вариант)</i><br><span class="expl">Свободного кислорода было крайне мало; состав сильно отличался от современного</span></li><li><b>В.</b> Состав известен косвенно, и со временем он менялся <i>(верный вариант)</i><br><span class="expl">Верно. Общий состав атмосферы восстанавливают косвенно, а в разное время и в разных местах условия различались. Поэтому эксперимент с одной газовой смесью моделирует одну из возможных сред</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.3390/life15030399">Mulkidjanian A. Y., Dibrova D. V., Bychkov A. Y. Origin of the RNA world in cold Hadean geothermal fields enriched in zinc and potassium. Life 2025; 15: 399</a></li><li><a href="https://doi.org/10.1038/35051550">Wilde S. A., Valley J. W., Peck W. H., Graham C. M. Evidence from detrital zircons for the existence of continental crust and oceans on the Earth 4.4 Gyr ago. Nature 2001; 409: 175–178</a></li><li><a href="https://doi.org/10.1038/ncomms15263">Djokic T., Van Kranendonk M. J., Campbell K. A., Walter M. R., Ward C. R. Earliest signs of life on land preserved in ca. 3.5 Ga hot spring deposits. Nat. Commun. 2017; 8: 15263</a></li><li><a href="https://doi.org/10.1038/s41559-024-02461-1">Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-abiogenic"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 7 из 46</div><h2>Абиогенный синтез: что показал эксперимент и чего не показал</h2><p class="lead"></p><ol class="mech"></ol><p>Абиогенный синтез — образование органических соединений без участия живых организмов. Классический эксперимент середины XX века: через смесь метана, аммиака, водорода и водяного пара в замкнутом стеклянном приборе многократно пропускали электрические разряды, продукты собирались в воде; среди них хроматографией обнаружили аминокислоты. Эксперимент показал, что органические соединения могут образовываться абиогенно при заданном составе газов и источнике энергии.</p><p>Чего он не показал. Он не доказал, что вся атмосфера ранней Земли имела такой состав: состав газов задал экспериментатор. Поэтому его результат подтверждает возможность такого источника органики лишь в местных восстановительных средах. Он не показал и следующих звеньев — накопления, активации, полимеризации — и тем более возникновения клетки. Образование аминокислот — не возникновение жизни.</p><p>При оценке любого эксперимента абиогенного синтеза задают четыре вопроса: какие вещества и условия заданы? Что непосредственно обнаружено? Какие дополнительные операции понадобились — высушивание, очистка, смена среды? Какое звено пути он показывает?</p><div class="static-quiz"><h3>Какой вывод из эксперимента с разрядами в газовой смеси допустим?</h3><ol><li><b>А.</b> Аминокислоты могут образовываться абиогенно <i>(верный вариант)</i><br><span class="expl">Верно: при заданном составе газов и электрических разрядах. Это показанная возможность</span></li><li><b>Б.</b> Атмосфера ранней Земли имела именно такой состав <i>(неверный вариант)</i><br><span class="expl">Состав газов в эксперименте задан, а не измерен на ранней Земле</span></li><li><b>В.</b> Так на ранней Земле возникли первые клетки <i>(неверный вариант)</i><br><span class="expl">В эксперименте обнаружены отдельные молекулы, а не клетки и даже не полимеры</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.3390/life14101345">Schopf J. W. Pioneers of origin of life studies — Darwin, Oparin, Haldane, Miller, Oró — and the oldest known records of life. Life 2024; 14: 1345</a></li><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li></ul><p></p></details></article><article class="card print-unit" id="ns-sources"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 8 из 46</div><h2>Источники органических молекул</h2><p class="lead"></p><ol class="mech"></ol><p>Органические соединения могли поступать на раннюю Землю несколькими путями: атмосферно-поверхностный синтез (разряды, ультрафиолетовое излучение, нагрев при ударах); геохимический синтез в породах и гидротермальных системах, где минералы и ионы переходных металлов участвуют в переносе электронов; внеземная доставка с метеоритами, кометами и межпланетной пылью. Количественный вклад каждого источника неизвестен.</p><p>Органика внеземного происхождения — наблюдение. В образцах астероида Рюгу, доставленных на Землю с минимальным загрязнением, найдены все пять канонических азотистых оснований нуклеиновых кислот: аденин, гуанин, цитозин, тимин и урацил. По условиям образца и контрольным пробам заключают, что предшественники наследственных молекул образуются во внеземных средах без участия жизни. Но то, что именно они стали материалом первых земных систем, не доказано. Обнаружение космической органики не подтверждает и гипотезу переноса жизни между небесными телами: найдены молекулы, а не живые системы, и сама эта гипотеза лишь переносит вопрос о происхождении жизни в другое место.</p><div class="static-quiz"><h3>Найдены азотистые основания в образцах астероида. Что из этого не следует?</h3><ol><li><b>А.</b> Что основания образуются без живых систем <i>(неверный вариант)</i><br><span class="expl">Это допустимая реконструкция: она следует из условий образца и контрольных проб</span></li><li><b>Б.</b> Что жизнь занесена на Землю из космоса <i>(верный вариант)</i><br><span class="expl">Верно. Найдены молекулы, а не живые системы</span></li><li><b>В.</b> Что в астероиде есть органические вещества <i>(неверный вариант)</i><br><span class="expl">Это наблюдение</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41550-026-02791-z">Koga T., Oba Y., Takano Y. et al. A complete set of canonical nucleobases in the carbonaceous asteroid (162173) Ryugu. Nat. Astron. 2026; 10: 655–663</a></li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-chain"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 9 из 46</div><h2>От молекулы к цепи: образование, накопление, концентрирование, активация, полимеризация</h2><p class="lead"></p><ol class="mech"></ol><p>Получить молекулу в реакции — лишь первое звено. Дальше нужно объяснить каждое из следующих: &lt;b&gt;образование&lt;/b&gt; — появление вещества в реакции или его поступление извне; &lt;b&gt;сохранение&lt;/b&gt; — вещество не разрушается до следующего звена; &lt;b&gt;накопление&lt;/b&gt; — количество растёт, только если синтез и поступление превышают разрушение и вынос; &lt;b&gt;концентрирование&lt;/b&gt; — повышение местного содержания, без которого молекулы редко встречаются; &lt;b&gt;активация&lt;/b&gt; — перевод мономера в реакционноспособное состояние, облегчающее образование связи; &lt;b&gt;полимеризация&lt;/b&gt; — соединение мономеров в цепь.</p><p>Каждое звено имеет свои трудности. Вода — среда переноса веществ, но она же способствует гидролизу многих связей. Механизмы концентрирования — высыхание и циклы увлажнения, замерзание (растворённые вещества вытесняются в жидкие каналы между кристаллами льда), адсорбция на минералах, удержание в порах и везикулах — тоже ограничены: минерал может связывать вещество слишком прочно, при таянии вещества снова разбавляются. Поэтому гипотеза о среде происхождения жизни должна объяснять не только концентрирование, но и совместимость всех звеньев в одних условиях. Выражение «строительные блоки жизни» означает доступность молекул, но не их будущую биологическую функцию.</p><div class="static-quiz"><h3>Мономер сконцентрирован при замерзании, но не активирован. Что ограничивает образование цепи?</h3><ol><li><b>А.</b> Низкая концентрация мономера в каналах льда <i>(неверный вариант)</i><br><span class="expl">Концентрация по условию высокая</span></li><li><b>Б.</b> Мономер не образуется в водоёме <i>(неверный вариант)</i><br><span class="expl">Мономер есть и накоплен</span></li><li><b>В.</b> Нет активации: гидролиз связи преобладает <i>(верный вариант)</i><br><span class="expl">Верно. Без активации связь между мономерами в воде не образуется устойчиво. Концентрирование увеличивает частоту встреч, активация даёт энергию для образования связи</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li><li><a href="https://doi.org/10.1038/s41557-025-01830-y">Attwater J., Augustin T. L., Curran J. F. et al. Trinucleotide substrates under pH–freeze–thaw cycles enable open-ended exponential RNA replication by a polymerase ribozyme. Nat. Chem. 2025; 17: 1129–1137</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-enrichment"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 10 из 46</div><h2>Химическое обогащение и естественный отбор</h2><p class="lead"></p><ol class="mech"></ol><p>В системе с ограниченными реагентами одни продукты могут образовываться быстрее или быть устойчивее других, и их доля возрастает. Такой процесс называют химическим обогащением. Состав смеси при этом изменяется направленно, но это ещё не естественный отбор. Для отбора нужны воспроизведение системы или её состава и передача различий следующему циклу: дочерняя система должна наследовать особенность родительской. В двух учебных случаях вкладки 1 различие видно по источнику новых молекул. При обогащении они образуются из веществ среды с постоянной скоростью, а не копируются с имеющихся, поэтому предел, к которому приходит состав, задают условия: скорости образования и разрушения. Если часть раствора перенести в новый водоём с теми же условиями, доля устойчивой молекулы там придёт к тому же значению, что и при старте с равного соотношения, — прежний состав не сохраняется. При отборе новые варианты — копии имеющихся, и после такого же переноса доля успешного варианта продолжает расти от достигнутого значения: перенесённый состав служит исходной точкой. Копирование — способ наследования в этой учебной модели, а не единственно возможный: в общем случае для отбора нужны наследуемые различия, влияющие на воспроизводство.</p><p>Это различие важно для моделей «сначала метаболизм». Сети химических реакций, в которых продукты ускоряют образование компонентов той же сети, — автокаталитические сети — могут при постоянном притоке вещества и энергии поддерживать свой состав. Но автокатализ и наследственность — разные свойства: если после переноса части смеси в среду с другим притоком состав сети перестраивается и становится таким же, как у сети, запущенной в этой среде с нуля, различия между сетями не наследуются и отбираться не могут. Отдельные реакции и фрагменты таких сетей без ферментов воспроизведены в эксперименте; передача свойств сети следующим циклам без генетического полимера не показана.</p><div class="static-quiz"><h3>Чем химическое обогащение отличается от естественного отбора?</h3><ol><li><b>А.</b> Состав задают условия среды, а не состав предков <i>(верный вариант)</i><br><span class="expl">Верно. Состав меняется из-за разной устойчивости или скорости образования и после переноса снова приходит к тому же значению. Отбор требует наследуемых различий, влияющих на воспроизводство</span></li><li><b>Б.</b> При обогащении состав смеси не меняется <i>(неверный вариант)</i><br><span class="expl">Меняется: доля устойчивого продукта растёт</span></li><li><b>В.</b> Обогащение возможно только у живых систем с генами <i>(неверный вариант)</i><br><span class="expl">Наоборот, это химический процесс, не требующий наследования</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1098/rstb.2024.0292">Carbonell P., Peretó J. Before LUCA: unearthing the chemical roots of metabolism. Phil. Trans. R. Soc. B 2025; 380: 20240292</a></li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-t1-review"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 11 из 46</div><h2>Разбор заданий вкладки 1</h2><p class="lead"></p><ol class="mech"></ol><p>Задания вкладки 1 построены на одном приёме: отделить то, что наблюдается, от того, что из этого выводят. Пограничные объекты — вироид, выделенная митохондрия, липосома с искусственным геномом, автокаталитическая сеть — показывают, что у каждого из них есть часть признаков живого, но не их функциональное сочетание. Переключение определения меняет только классификацию, а не свойства.</p><p>Цепь «образование → сохранение → … → полимеризация» показывает, почему эксперимент, показавший одно звено, не объясняет остальных: мономер может образовываться и не накапливаться; накапливаться и не концентрироваться; концентрироваться и не соединяться в цепь без активации. Наконец, изменение состава смеси само по себе ещё не отбор: проверочный вопрос — сохраняется ли перенесённый состав и передаётся ли следующему циклу (тогда различия наследуются) или приток тянет его к пределу, заданному условиями. Тот же вопрос отделяет автокаталитическую сеть от наследственной системы.</p><p>Основной критерий для любого вывода на этой вкладке: что именно обнаружено и при каких условиях, заданных экспериментатором или природой.</p><div class="static-quiz"><h3>В липосоме идут синтез белка, копирование ДНК и синтез фосфолипидов, деления нет. Какой вывод допустим?</h3><ol><li><b>А.</b> Получена живая клетка с искусственным геномом <i>(неверный вариант)</i><br><span class="expl">Нет деления и собственного аппарата синтеза белка</span></li><li><b>Б.</b> Функции совместимы в одном компартменте <i>(верный вариант)</i><br><span class="expl">Верно. Показана совместимость нескольких функций, но самовоспроизводящейся системы нет: наблюдение не переходит в вывод о живой клетке</span></li><li><b>В.</b> Так на Земле возникла первая клетка <i>(неверный вариант)</i><br><span class="expl">Система собрана из современных ферментов; об истории она не говорит</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a1"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 12 из 46</div><h2>Возможность процесса и историческая необходимость</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·1, БИО-12·7, БИО-12·9</p><p>Исследование 1 предлагает распределить утверждения по тем же четырём статусам, что и на вкладках: наблюдение, показанная возможность, реконструкция и вывод, который не следует из данных. Одна и та же карточка свидетельства может порождать утверждения разных статусов. «Аминокислоты могут ускорять образование коротких цепей РНК» — показанная возможность; «первые цепи РНК на Земле образовались в высыхающих водоёмах с аминокислотами» — реконструкция, историческая гипотеза, совместимая с данными, но ими не доказанная; «находка оснований в астероиде доказывает, что первые гены Земли построены из них» и «устройство рибосомы доказывает, что был этап без белков» — выводы, которые не следуют из данных: они выдают совместимость за доказательство.</p><p>Обратная задача: два сценария — наземные геотермальные поля и щелочные гидротермальные источники — совместимы с одними лабораторными результатами. Уверенность в одном из них повышают не выход реакции в лаборатории и не время появления гипотезы, а данные о том, существовали ли такие среды, были ли в них исходные вещества и источники активации и проходят ли все звенья в одних условиях. Если таких данных нет, правильный ответ — «оба сценария совместимы с данными».</p><div class="static-quiz"><h3>Как правильно сформулировать результат эксперимента, в котором реакция прошла при заданных условиях?</h3><ol><li><b>А.</b> «Так и было на ранней Земле миллиарды лет назад» <i>(неверный вариант)</i><br><span class="expl">Это историческое утверждение; эксперимент его не устанавливает</span></li><li><b>Б.</b> «Других путей не было и быть не могло» <i>(неверный вариант)</i><br><span class="expl">Эксперимент ничего не говорит о других путях</span></li><li><b>В.</b> «Процесс может идти при таких условиях» <i>(верный вариант)</i><br><span class="expl">Верно: формулировка не выходит за пределы данных</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a1-results"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 13 из 46</div><h2>Новые данные: аминокислоты ускоряют образование РНК</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·1, БИО-12·9. См. также: БИО-12·12</p><p>В современной клетке РНК участвует в синтезе белка из аминокислот (вспомнить <a href="https://fresll.github.io/bio/seminar-10-route.html#translation-overview">БИО-10·1</a>). Недавно показали химическую связь в обратном направлении. Раствор активированных нуклеотидов — с фосфатом, замкнутым в кольцо на рибозе, — высушивали в щелочной среде при комнатной температуре. Без аминокислот заметную долю коротких цепей давал только гуаниновый нуклеотид. Добавление аминокислот, например валина, повышало выход цепей для остальных нуклеотидов — для цитидинового примерно в 120 раз, — и доли четырёх нуклеотидов в цепях сближались. Цепи оставались короткими — до семи нуклеотидов. Авторы объясняют эффект кислотно-основным катализом: аминогруппа аминокислоты помогает образованию связи между нуклеотидами.</p><p>Почему это интересно: если почти все цепи построены из одного нуклеотида, в смеси нет комплементарных партнёров и мало разнообразия последовательностей; при сближении долей четырёх нуклеотидов становятся возможными спаривание цепей и копирование по матрице. Чего результат не показывает: активированные нуклеотиды подавал экспериментатор; цепи в несколько раз короче известных рибозимов; где и когда подобные реакции происходили и происходили ли вообще — не установлено.</p><div class="static-quiz"><h3>Какой статус у утверждения «аминокислоты могут без ферментов ускорять образование цепей РНК»?</h3><ol><li><b>А.</b> Показанная возможность <i>(верный вариант)</i><br><span class="expl">Верно. Процесс воспроизведён в эксперименте при заданных условиях. Утверждение о том, что так было на ранней Земле, было бы уже реконструкцией</span></li><li><b>Б.</b> Наблюдение <i>(неверный вариант)</i><br><span class="expl">Наблюдение — рост выхода цепей в конкретной пробе. Обобщение «могут ускорять» — утверждение о возможности процесса</span></li><li><b>В.</b> Реконструкция <i>(неверный вариант)</i><br><span class="expl">Утверждение не говорит о прошлом: в нём нет «было» или «образовались»</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41467-025-60359-3">Rout S. K., Wunnava S., Krepl M., Cassone G., Šponer J. E., Mast C. B., Powner M. W., Braun D. Amino acids catalyse RNA formation under ambient alkaline conditions. Nat. Commun. 2025; 16: 5193</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-r1"><div class="eyebrow">Признаки живого и химические предпосылки · шаг 14 из 46</div><h2>Как отличают внеземную органику от земного загрязнения</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·1, БИО-12·8</p><p>Главная трудность изучения органики метеоритов — загрязнение земным веществом, в котором много продуктов жизни. Поэтому особенно ценны образцы, доставленные космическими аппаратами прямо с астероидов: их отбирают и хранят в условиях, сводящих загрязнение к минимуму. В образцах астероида Рюгу измеряли содержание азотистых оснований и сравнивали с контрольными пробами, прошедшими те же операции. Найдены все пять оснований нуклеиновых кислот; соотношение пуриновых и пиримидиновых оснований различается у разных метеоритов и астероидов, и авторы связывают это с разными условиями химии на родительских телах.</p><p>Для метеоритов, упавших на Землю, используют другие признаки внеземного происхождения: молекулы и структурные изомеры, которые в организмах не встречаются, и особый изотопный состав. Ни один признак сам по себе не решающий — надёжен вывод, на который указывают несколько независимых признаков.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как клетка поддерживает состав и границы своих компартментов и как устроены сигналы о ресурсах — <a href="https://fresll.github.io/molbio/seminar-1.html">семинар 1 «Компартменты, локальные условия и обмен»</a> и <a href="https://fresll.github.io/molbio/seminar-7.html">семинар 7 «Интеграция сигналов о ресурсном состоянии: mTORC1, AMPK и лизосомная переработка»</a>; метаболические потоки — <a href="https://fresll.github.io/molbio/seminar-8.html">семинар 8 «Метаболические потоки, биосинтез и редокс-состояние»</a>.</p><div class="static-quiz"><h3>Почему образцы, доставленные с астероида, ценнее метеорита, найденного на Земле?</h3><ol><li><b>А.</b> В них больше органических веществ <i>(неверный вариант)</i><br><span class="expl">Количество органики не главное; важна уверенность в её происхождении</span></li><li><b>Б.</b> Они меньше подвергались земному загрязнению <i>(верный вариант)</i><br><span class="expl">Верно: это снижает вероятность, что найденная органика земного происхождения</span></li><li><b>В.</b> Метеориты, упавшие на Землю, вообще не содержат органики <i>(неверный вариант)</i><br><span class="expl">Многие углистые метеориты содержат органические вещества</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41550-026-02791-z">Koga T., Oba Y., Takano Y. et al. A complete set of canonical nucleobases in the carbonaceous asteroid (162173) Ryugu. Nat. Astron. 2026; 10: 655–663</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-rna-dual"><div class="eyebrow">РНК, катализ и протоклетка · шаг 15 из 46</div><h2>Информационные и каталитические свойства РНК. Рибозимы</h2><p class="lead"></p><ol class="mech"></ol><p>Среди современных биологических молекул РНК выделяется тем, что может выполнять две функции. Последовательность нуклеотидов служит матрицей: по ней по принципу комплементарности строится новая цепь (вспомнить <a href="https://fresll.github.io/bio/seminar-7-route.html#template-principle">БИО-7·3</a>, <a href="https://fresll.github.io/bio/seminar-9-route.html#orientation">БИО-9·3</a>). Одноцепочечная РНК сворачивается в сложную пространственную структуру, которая определяется последовательностью; свёрнутая молекула может связывать субстраты и катализировать реакции. Каталитические молекулы РНК называют рибозимами. Многие рибозимы, как и некоторые белки, используют ионы металлов в активном центре, что расширяет их возможности.</p><p>Рибозимы есть и в современных клетках: самосплайсирующиеся интроны, РНК рибонуклеазы P, рибозимы в геномах некоторых вироидов. Главный пример — рибосома: центр, в котором образуется пептидная связь, образован рибосомной РНК, а белки рибосомы стабилизируют структуру (вспомнить <a href="https://fresll.github.io/bio/seminar-10-route.html#ribosome">БИО-10·13</a>). Однако белки-ферменты в современных клетках катализируют гораздо больше разных реакций и обычно быстрее, чем рибозимы.</p><div class="static-quiz"><h3>Какое наблюдение показывает, что РНК может быть катализатором в современной клетке?</h3><ol><li><b>А.</b> мРНК переносит информацию от гена к рибосоме <i>(неверный вариант)</i><br><span class="expl">Это информационная, а не каталитическая функция</span></li><li><b>Б.</b> РНК легко гидролизуется в воде, в отличие от ДНК <i>(неверный вариант)</i><br><span class="expl">Это свойство ограничивает гипотезу, а не показывает катализ</span></li><li><b>В.</b> Центр синтеза пептидной связи образован рРНК <i>(верный вариант)</i><br><span class="expl">Верно. Пептидная связь в рибосоме образуется в центре, образованном рибосомной РНК: это рибозим в каждой клетке</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li></ul><p></p></details></article><article class="card print-unit" id="ns-rna-world"><div class="eyebrow">РНК, катализ и протоклетка · шаг 16 из 46</div><h2>Гипотеза мира РНК: доводы и ограничения</h2><p class="lead"></p><ol class="mech"></ol><p>Гипотеза мира РНК — семейство моделей, предполагающих ранний этап, на котором РНК или родственные ей полимеры выполняли центральные информационные и каталитические функции; ДНК и белки взяли на себя большую часть этих функций позже. Доводы: двойственность РНК; рибозимы в современных клетках как возможное наследие раннего этапа; РНК-природа каталитического центра рибосомы.</p><p>Ограничения: РНК подвержена гидролизу, особенно при некоторых значениях pH, температуре и в присутствии двухвалентных катионов; химическое разнообразие её нуклеотидов меньше, чем разнообразие боковых групп аминокислот; предбиологический синтез нуклеотидов и их полимеризация трудны; наконец, главная экспериментальная трудность — копирование достаточно длинных последовательностей с приемлемой точностью. Устройство рибосомы согласуется с древней ролью РНК, но не доказывает, что существовал этап совсем без белков. Поэтому мир РНК — гипотеза, а не исторически доказанный этап; рассматриваются и модели, в которых РНК с самого начала работала вместе с пептидами.</p><div class="static-quiz"><h3>Какое утверждение о гипотезе мира РНК корректно?</h3><ol><li><b>А.</b> Она согласуется с данными, но не доказана <i>(верный вариант)</i><br><span class="expl">Верно. Гипотеза опирается на двойственность РНК и согласуется с устройством рибосомы, но существование такого этапа не доказано</span></li><li><b>Б.</b> Она доказана: центр рибосомы — это рибозим <i>(неверный вариант)</i><br><span class="expl">Строение рибосомы согласуется с гипотезой, но не доказывает этапа без белков</span></li><li><b>В.</b> Она опровергнута: РНК в воде неустойчива <i>(неверный вариант)</i><br><span class="expl">Неустойчивость — ограничение, которое гипотеза должна объяснить, а не опровержение</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-rna-copy"><div class="eyebrow">РНК, катализ и протоклетка · шаг 17 из 46</div><h2>Копирование РНК в эксперименте: от удлинения цепи к замкнутому циклу</h2><p class="lead"></p><ol class="mech"></ol><p>Природные рибозимы не копируют длинные РНК. Рибозимы-полимеразы получают направленной эволюцией в пробирке (БИО-12·23). Результаты удобно расположить по ступеням. Первая — рибозим удлиняет цепь по матрице. Вторая — многократное копирование обеих цепей коротких РНК: в системе, где цепи разделяли нагреванием в кислой среде, а при замораживании вещества концентрировались более чем в 200 раз, рибозим достраивал цепи из активированных фрагментов по три нуклеотида и экспоненциально размножал обе цепи нескольких РНК, включая фрагмент самого себя. Третья — рибозим длиной 45 нуклеотидов синтезировал собственную последовательность и, в отдельной реакции, комплементарную цепь из активированных олигонуклеотидов — с выходом около 0,2 % за 72 дня.</p><p>Четвёртая ступень — замкнутый цикл, в котором копия сама служит матрицей, субстраты образуются в той же системе и всё работает без участия экспериментатора, — не получена. Поэтому корректно говорить о рибозиме, «способном к синтезу самого себя в организованной экспериментальной системе», но не об автономно самовоспроизводящейся молекуле. Значение экспериментов в другом: сложная функция копирования умещается в сравнительно короткой последовательности, а обе стадии потенциального цикла химически достижимы.</p><div class="static-quiz"><h3>Чем матричное копирование отличается от замкнутого самовоспроизведения?</h3><ol><li><b>А.</b> Ничем: если копия цепи получена, цикл уже замкнут <i>(неверный вариант)</i><br><span class="expl">Копия одной цепи — ещё не воспроизведение всей системы</span></li><li><b>Б.</b> Система сама воспроизводит матрицу и катализатор <i>(верный вариант)</i><br><span class="expl">Верно. При замкнутом самовоспроизведении копия сама становится матрицей, а система воспроизводит свой катализатор и субстраты без участия экспериментатора</span></li><li><b>В.</b> При копировании по матрице не нужны субстраты <i>(неверный вариант)</i><br><span class="expl">Субстраты нужны в обоих случаях</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41557-025-01830-y">Attwater J., Augustin T. L., Curran J. F. et al. Trinucleotide substrates under pH–freeze–thaw cycles enable open-ended exponential RNA replication by a polymerase ribozyme. Nat. Chem. 2025; 17: 1129–1137</a></li><li><a href="https://doi.org/10.1126/science.adt2760">Gianni E., Kwok S. L. Y., Wan C. J. K. et al. A small polymerase ribozyme that can synthesize itself and its complementary strand. Science 2026; 391: 1022–1028</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-alternatives"><div class="eyebrow">РНК, катализ и протоклетка · шаг 18 из 46</div><h2>Не только РНК: пептиды и сети реакций</h2><p class="lead"></p><ol class="mech"></ol><p>Ограничения «чистого» мира РНК привели к моделям, где РНК с самого начала взаимодействовала с аминокислотами и пептидами. В экспериментах аминокислоты, присоединённые к неканоническим нуклеозидам РНК, служили началом коротких пептидов, которые синтезировались прямо на РНК. В другой системе аминокислоты в активированной форме без ферментов, в воде при нейтральном pH, присоединялись к концевой рибозе РНК, после чего на РНК образовывались короткие пептиды. Это возможные предшественники аминоацилирования (вспомнить <a href="https://fresll.github.io/bio/seminar-10-route.html#synthetases">БИО-10·9</a>), но не генетический код и не рибосома: соответствия кодонов и аминокислот в этих экспериментах нет.</p><p>Модели «сначала метаболизм» предполагают, что до генов могли существовать сети реакций, поддерживаемые минералами, металлами и химическими градиентами. Их сильная сторона — объяснение снабжения веществом и энергией; слабая — механизм устойчивой передачи сложной организации без генетического полимера (БИО-12·10, БИО-12·24). Модели «сначала гены» лучше объясняют наследуемые различия, но требуют химического обеспечения копирования. Современный подход ищет не «первую молекулу», а то, как наследование, обмен веществ и компартментализация стали совместимы.</p><div class="static-quiz"><h3>Почему присоединение аминокислоты к РНК без ферментов не равно возникновению генетического кода?</h3><ol><li><b>А.</b> Аминокислоты не присоединяются к РНК без ферментов <i>(неверный вариант)</i><br><span class="expl">Присоединяются — это и показано</span></li><li><b>Б.</b> Генетический код возник только позже LUCA <i>(неверный вариант)</i><br><span class="expl">Код был уже у LUCA</span></li><li><b>В.</b> Нет правила соответствия РНК и аминокислоты <i>(верный вариант)</i><br><span class="expl">Верно. Код — это правило соответствия между последовательностью и выбором аминокислоты, а не просто химическая связь</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-022-04676-3">Müller F., Escobar L., Xu F. et al. A prebiotically plausible scenario of an RNA–peptide world. Nature 2022; 605: 279–284</a></li><li><a href="https://doi.org/10.1038/s41586-025-09388-y">Singh J., Thoma B., Whitaker D. et al. Thioester-mediated RNA aminoacylation and peptidyl-RNA synthesis in water. Nature 2025; 644: 933–944</a></li><li><a href="https://doi.org/10.1098/rstb.2024.0292">Carbonell P., Peretó J. Before LUCA: unearthing the chemical roots of metabolism. Phil. Trans. R. Soc. B 2025; 380: 20240292</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-protocell"><div class="eyebrow">РНК, катализ и протоклетка · шаг 19 из 46</div><h2>Компартмент и протоклетка</h2><p class="lead"></p><ol class="mech"></ol><p>Амфифильные молекулы — содержащие гидрофильную и гидрофобную части — в воде самопроизвольно собираются в мицеллы, бислои и замкнутые везикулы; при этом гидрофобные участки оказываются скрыты от воды (вспомнить семинар 1). Самосборка не требует генетической программы. В моделях ранних клеток используют более простые амфифилы, чем современные фосфолипиды, — жирные кислоты. Жирнокислотные везикулы удерживают полимеры и пропускают часть малых молекул: в экспериментах мембраны из жирных кислот и их производных определённого состава пропускали внутрь активированные нуклеотиды (обычные нуклеотиды — значительно медленнее или совсем не проходили), и затравка внутри удлинялась; в контрольных везикулах из фосфолипида POPC удлинения затравки не обнаружено. Такие везикулы растут, включая новые жирные кислоты, а в лаборатории их делили механическим продавливанием через узкие поры. При каждом таком делении часть содержимого выходила из везикул (около 40 % метки): эксперимент показал рост и механически вызванное деление, но не полное сохранение содержимого. Продавливание через поры — искусственный экспериментальный приём, а не установленный механизм деления первых протоклеток. Их устойчивость сильно зависит от pH, солей и двухвалентных катионов.</p><p>Протоклеткой в строгом смысле называют не любую везикулу, а компартмент, в котором граница связана с внутренней химией и воспроизведением. Для этого нужны поступление субстратов, сохранение полимеров, рост оболочки, деление и передача функционального состава дочерним везикулам. В лаборатории показаны отдельные этапы; полный цикл, в котором мембрана, обмен веществ и наследование поддерживают друг друга много поколений, не воспроизведён. Синтетические системы из современных молекул — липосома, где одновременно работают синтез белка, копирование ДНК и синтез фосфолипидов, — проверяют совместимость функций, но не моделируют возникновение жизни.</p><div class="static-quiz"><h3>Почему везикула с РНК внутри — ещё не протоклетка?</h3><ol><li><b>А.</b> Её рост может не зависеть от содержимого <i>(верный вариант)</i><br><span class="expl">Верно. Рост и деление везикулы могут не зависеть от того, что происходит внутри, а протоклетку определяет связь границы с внутренней химией и воспроизведением</span></li><li><b>Б.</b> Везикулы из жирных кислот не делятся <i>(неверный вариант)</i><br><span class="expl">В эксперименте они росли и делились при продавливании через поры; дело не в способности делиться, а в связи с содержимым</span></li><li><b>В.</b> В ней нет ДНК, а есть только РНК-матрица <i>(неверный вариант)</i><br><span class="expl">Наличие ДНК не определяет протоклетку</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature07018">Mansy S. S., Schrum J. P., Krishnamurthy M., Tobé S., Treco D. A., Szostak J. W. Template-directed synthesis of a genetic polymer in a model protocell. Nature 2008; 454: 122–125</a></li><li><a href="https://doi.org/10.1126/science.1089904">Hanczyc M. M., Fujikawa S. M., Szostak J. W. Experimental models of primitive cellular compartments: encapsulation, growth, and division. Science 2003; 302: 618–622</a></li><li><a href="https://doi.org/10.3390/life15030399">Mulkidjanian A. Y., Dibrova D. V., Bychkov A. Y. Origin of the RNA world in cold Hadean geothermal fields enriched in zinc and potassium. Life 2025; 15: 399</a></li><li><a href="https://doi.org/10.1038/s41467-026-69531-9">Restrepo Sierra A. M., Ramirez Gomez F., van Tongeren M., Sierra Heras L., Danelon C. A synthetic cell with integrated DNA self-replication and lipid biosynthesis. Nat. Commun. 2026; 17: 2727</a></li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-coupling"><div class="eyebrow">РНК, катализ и протоклетка · шаг 20 из 46</div><h2>Связь функции с ростом и отбор протоклеток</h2><p class="lead"></p><ol class="mech"></ol><p>Если молекула внутри компартмента ускоряет процесс, способствующий росту везикулы, например образование мембранных амфифилов или поступление субстратов, преимущество получает весь компартмент. При делении часть внутренних молекул передаётся дочерним везикулам, и возникает связь между молекулярным вариантом и числом потомков системы. Такую связь функции внутренней молекулы с ростом компартмента будем называть связью функции с ростом (её не следует путать с хемиосмотическим сопряжением, БИО-12·29). Это условие отбора протоклеток: наследуемые внутренние различия должны влиять на число дочерних компартментов.</p><p>Препятствия. При делении содержимое распределяется случайно, и дочерняя везикула может не получить редкий катализатор. Рост оболочки должен быть согласован с копированием содержимого. Возможны паразитические репликаторы, которые используют общий катализатор, но не способствуют росту: компартменты ограничивают их распространение, но не устраняют проблему полностью. Математические модели показывают принципиальную возможность отбора протоклеток, но не устанавливают историческую последовательность событий; порядок, в котором функции оказались связаны друг с другом, неизвестен.</p><div class="static-quiz"><h3>Что нужно, чтобы отбор действовал на протоклетки, а не только на отдельные молекулы?</h3><ol><li><b>А.</b> Мембрана должна быть непроницаемой для всех веществ <i>(неверный вариант)</i><br><span class="expl">Непроницаемая мембрана не пропускала бы субстраты</span></li><li><b>Б.</b> Свойство молекулы должно влиять на рост протоклетки <i>(верный вариант)</i><br><span class="expl">Верно. Наследуемое свойство внутренней молекулы должно влиять на рост и деление компартмента</span></li><li><b>В.</b> Молекул внутри должно быть как можно больше <i>(неверный вариант)</i><br><span class="expl">Количество само по себе не связывает свойство молекулы с размножением системы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1371/journal.pbio.3003544">Nunes Palmeira R., Colnaghi M., Pomiankowski A., Lane N. Selection for growth drives the emergence of genetic heredity in protocells. PLoS Biol. 2026; 24: e3003544</a></li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-t2-review"><div class="eyebrow">РНК, катализ и протоклетка · шаг 21 из 46</div><h2>Разбор заданий вкладки 2</h2><p class="lead"></p><ol class="mech"></ol><p>Конструктор протоклетки показывает, что каждый компонент нужен для своего звена: без нуклеотидов нет копий, без жирных кислот нет роста и деления, без мембраны копии рассеиваются. Но главный урок — в состояниях «все компоненты есть, связи функции с ростом нет» и «связь есть». В первом случае РНК копируется, везикулы делятся, а отбора вариантов РНК на уровне везикул нет: размножение системы не зависит от того, что внутри. Во втором свойство молекулы влияет на рост оболочки, и выполняются все три условия отбора.</p><p>Обратная задача показывает типичный путь рассуждения: если копирование, удержание, рост и деление в норме, а число потомков от варианта РНК не зависит, не хватает либо связи функции с ростом, либо самой функциональной РНК — например, если её всюду вытеснил паразит. Классификация экспериментов по ступеням копирования напоминает, что копирование коротких РНК — ещё не самовоспроизведение полимеразы.</p><div class="static-quiz"><h3>Все компоненты протоклетки есть, но свойства РНК не влияют на рост оболочки. Что наблюдается?</h3><ol><li><b>А.</b> Копирование РНК внутри везикул останавливается <i>(неверный вариант)</i><br><span class="expl">Копирование не зависит от связи функции с ростом</span></li><li><b>Б.</b> Везикулы перестают расти и делиться <i>(неверный вариант)</i><br><span class="expl">Деление зависит от роста оболочки и внешнего воздействия, а не от связи функции с ростом</span></li><li><b>В.</b> Везикулы делятся, но отбора вариантов РНК нет <i>(верный вариант)</i><br><span class="expl">Верно. Копирование, рост и деление есть, а размножение везикул от варианта РНК не зависит</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a2"><div class="eyebrow">РНК, катализ и протоклетка · шаг 22 из 46</div><h2>Почему одного репликатора недостаточно</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·5, БИО-12·17, БИО-12·20</p><p>В исследовании 2 в каждой условной протоклетке есть рибозим-полимераза, которая копирует другой, функциональный рибозим; функциональный рибозим ускоряет рост мембраны. Если ошибка в каждой позиции возникает с вероятностью μ, копия участка длиной L безошибочна с вероятностью p = (1 − μ)^L. При μ = 0,01 и L = 10 это около 0,90; при μ = 0,1 и L = 30 — около 0,04. Модель показывает три вещи. Первая: чем длиннее необходимый участок и ниже точность, тем реже копия сохраняет функцию. Вторая: компартмент без связи функции с ростом не помогает — полимераза есть в каждой системе, поэтому системы с испорченной копией тоже растут и делятся, и ошибки постепенно вытесняют функцию (при μ = 0,03 и L = 30 через 10 циклов доля функциональных систем около 0,03). Третья: при связи функции с ростом системы без работающего катализатора не растут, и доля функциональных систем снижается от 1 и приближается к p сверху, не опускаясь ниже p (в том же примере p около 0,40, доля через 10 циклов около 0,41). Если бы копировать себя могла только сама функциональная молекула, испорченная копия вообще не размножалась бы — компартмент уже этим ограничивал бы ошибки; модель рассматривает случай с отдельной полимеразой.</p><p>Главный вывод модели: точность копирования задаёт предел, к которому при отборе приближается доля функциональных систем, а результат при одной и той же точности определяют условия компартментализации. При μ = 0,03 и L = 30 доля функциональных систем — около 0,03 без компартмента, около 0,03 в компартменте без связи функции с ростом и около 0,41 при такой связи. Отсюда — ответ на обратную задачу: если две системы с одинаковым рибозимом и одинаковой точностью копирования различаются устойчивостью, причиной могут быть отсутствие связи функции с ростом, утечка продукта или неудержание самого репликатора; различают эти причины измерения скорости роста, удержания продукта и удержания меченой РНК, а не подсчёт систем в конце.</p><p>Числа в модели условные; порог ошибок — не универсальная константа: он зависит от длины, допустимых замен и силы отбора.</p><div class="static-quiz"><h3>В модели со связью функции с ростом доля функциональных систем снижается от 1 к p. Почему она не остаётся равной 1?</h3><ol><li><b>А.</b> Отбор отсеивает ошибки и не исправляет их <i>(верный вариант)</i><br><span class="expl">Верно. Отбор не даёт нефункциональным системам размножаться, но ошибки возникают при каждом копировании заново</span></li><li><b>Б.</b> Потому что в среде не хватает нуклеотидов <i>(неверный вариант)</i><br><span class="expl">Ресурсы в модели не ограничены</span></li><li><b>В.</b> Функциональные системы со временем гибнут <i>(неверный вариант)</i><br><span class="expl">В модели системы не погибают</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a2-results"><div class="eyebrow">РНК, катализ и протоклетка · шаг 23 из 46</div><h2>Новые данные: копирование по матрице внутри модельной протоклетки</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·5, БИО-12·19. См. также: БИО-12·22</p><p>Может ли граница одновременно удерживать репликатор и пропускать к нему мономеры? Современные мембраны из фосфолипидов почти непроницаемы для заряженных молекул, и клетки транспортируют нуклеотиды белками-переносчиками. В эксперименте внутрь везикул из жирных кислот и их производных поместили короткую цепь ДНК — матрицу с затравкой — и добавили активированные нуклеотиды снаружи. Нуклеотиды проходили через мембрану без белков (в везикулах диаметром около 100 нм их концентрации выравнивались наполовину примерно за 12 часов) и внутри присоединялись к затравке по матрице без ферментов; через сутки полноразмерных продуктов было примерно столько же, сколько в той же реакции в растворе. Матрица и затравка из везикул не выходили. В везикулах из фосфолипидов удлинения затравки не было.</p><p>Этот результат связывает две функции границы, о которых говорит исследование 2: удержание репликатора и снабжение его мономерами. Ограничения: копировалась одна короткая однородная матрица, нуклеотиды были химически изменены, копия не становилась новой матрицей, деления везикул и передачи копий дочерним системам не было. Мембраны такого состава — экспериментальная модель; из чего состояли мембраны первых клеток, неизвестно.</p><div class="static-quiz"><h3>Что показал эксперимент с копированием по матрице внутри везикул?</h3><ol><li><b>А.</b> Получена самовоспроизводящаяся протоклетка <i>(неверный вариант)</i><br><span class="expl">Нет: копировалась одна короткая матрица, копия не служила новой матрицей, а деления везикул не было</span></li><li><b>Б.</b> Граница удерживала матрицу и пропускала мономеры <i>(верный вариант)</i><br><span class="expl">Верно. Активированные нуклеотиды проходили через мембрану из жирных кислот, а матрица с затравкой оставалась внутри, и копирование шло без ферментов</span></li><li><b>В.</b> Фосфолипидные мембраны пропускают нуклеотиды лучше <i>(неверный вариант)</i><br><span class="expl">Наоборот: в везикулах из фосфолипидов удлинения затравки не было</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature07018">Mansy S. S., Schrum J. P., Krishnamurthy M., Tobé S., Treco D. A., Szostak J. W. Template-directed synthesis of a genetic polymer in a model protocell. Nature 2008; 454: 122–125</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-r2"><div class="eyebrow">РНК, катализ и протоклетка · шаг 24 из 46</div><h2>Пределы наследственности без генов: модель протоклеток</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·10, БИО-12·18, БИО-12·20</p><p>Могли ли протоклетки накапливать сложность обмена веществ ещё до генов? Математическая модель рассматривала протоклетки, растущие за счёт превращения водорода и углекислого газа в органические вещества, в которых нуклеотиды служили простыми катализаторами без ферментов. Результат оказался неожиданным. Рост протоклеток ускорялся, только если нуклеотиды ускоряли общий процесс, питающий всю сеть, — фиксацию углекислого газа. Сильное ускорение одной ветви, например синтеза аминокислот, отнимало углерод у жирных кислот, нужных для роста мембраны, и замедляло рост, а при конкуренции разных каталитических функций рост прекращался. Ускорение синтеза самих нуклеотидов приводило к их накоплению в ущерб росту протоклеток.</p><p>Вывод модели: полезен катализ, который поддерживает сбалансированный поток вещества через всю систему; «больше катализа» не значит «лучше». Это перекликается с исследованием 2: функция молекулы должна приносить пользу всей системе, а не только себе. Статус — теоретическая модель с упрощёнными правилами деления; экспериментального воспроизведения такого перехода нет.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как устроены современные мембранные системы и контроль качества белков и органелл — <a href="https://fresll.github.io/molbio/seminar-11.html">семинар 11 «Протеостаз, убиквитин-протеасомная система, ERAD и аутофагический поток»</a> и <a href="https://fresll.github.io/molbio/seminar-12.html">семинар 12 «Селективная аутофагия и контроль качества органелл»</a>.</p><div class="static-quiz"><h3>Почему в модели сильное ускорение синтеза аминокислот замедляло рост протоклеток?</h3><ol><li><b>А.</b> Аминокислоты разрушали мембрану клетки <i>(неверный вариант)</i><br><span class="expl">В модели этого правила нет</span></li><li><b>Б.</b> Нуклеотиды переставали образовываться совсем <i>(неверный вариант)</i><br><span class="expl">Дело в балансе потоков между ветвями сети</span></li><li><b>В.</b> Углерод уходил от синтеза жирных кислот <i>(верный вариант)</i><br><span class="expl">Верно. Углерод уходил на аминокислоты, и не хватало жирных кислот для роста мембраны: поток вещества разбалансировался</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1098/rspb.2022.1469">Nunes Palmeira R., Colnaghi M., Harrison S. A., Pomiankowski A., Lane N. The limits of metabolic heredity in protocells. Proc. R. Soc. B 2022; 289: 20221469</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-luca"><div class="eyebrow">LUCA и основные клеточные линии · шаг 25 из 46</div><h2>LUCA: последний, а не первый</h2><p class="lead"></p><ol class="mech"></ol><p>LUCA (Last Universal Common Ancestor, последний универсальный общий предок) — реконструируемый последний общий предок всех современных клеточных линий. Полезно различать три связанных понятия. Филогенетический узел — точка на дереве, где сходятся линии всех современных клеток. Предковая популяция — реальные организмы того времени, вероятно обменивавшиеся генами. Реконструируемый набор генов и свойств — статистический вывод по современным геномам, а не прочитанная последовательность древнего генома.</p><p>LUCA — не первая жизнь и не обязательно одна клетка. До него могли существовать другие наследственные и клеточные системы, линии которых угасли или не оставили потомков среди современных организмов. Общее происхождение современной клеточной жизни подтверждает глубокое сходство её информационных систем: почти универсальный генетический код, синтез белка на рибосомах, тРНК, сходные принципы транскрипции, АТФ как универсальный переносчик энергии. Поэтому ко времени LUCA клеточная организация была уже значительно сложнее любых протоклеточных моделей. Ископаемых остатков, которые можно отнести к LUCA, нет.</p><div class="static-quiz"><h3>Что означает выражение «геном LUCA»?</h3><ol><li><b>А.</b> Реконструкцию набора генов по современным геномам <i>(верный вариант)</i><br><span class="expl">Верно. Это вероятностная реконструкция набора генных семейств: древний геном не прочитан, его восстанавливают с допущениями</span></li><li><b>Б.</b> Последовательность ДНК, прочитанную в древних породах <i>(неверный вариант)</i><br><span class="expl">ДНК такого возраста не сохраняется</span></li><li><b>В.</b> Геном самой первой живой клетки на Земле <i>(неверный вариант)</i><br><span class="expl">LUCA — не первая клетка</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-024-02461-1">Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666</a></li><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li></ul><p></p></details></article><article class="card print-unit" id="ns-reconstruction"><div class="eyebrow">LUCA и основные клеточные линии · шаг 26 из 46</div><h2>Как реконструируют свойства LUCA</h2><p class="lead"></p><ol class="mech"></ol><p>Простого пересечения списков генов бактерий и архей недостаточно: широко распространённый ген мог быть унаследован от общего предка, перенесён позднее или независимо утрачен в нескольких линиях. Реконструкция включает несколько этапов: выделяют семейства гомологичных генов — генов общего происхождения; различают ортологи (разошлись при разделении линий) и паралоги (возникли при дупликации гена в одной линии); строят дерево каждого семейства; сопоставляют дерево гена с деревом клеточных линий; оценивают вероятности присутствия гена у предка, его потерь, дупликаций и переносов.</p><p>Вывод надёжнее, когда согласованный сигнал дают многие компоненты одной системы: древность аппарата трансляции поддерживает не один ген, а комплекс из рибосомных РНК, белков и факторов трансляции. Присутствие одного широко распространённого фермента — слабый довод в пользу того, что у LUCA был весь соответствующий метаболический путь. Итог — вероятностная реконструкция, чувствительная к выборке геномов и допущениям модели.</p><div class="static-quiz"><h3>Почему «ген есть у бактерий и архей» не доказывает, что он был у LUCA?</h3><ol><li><b>А.</b> Потому что у LUCA вообще не было генов <i>(неверный вариант)</i><br><span class="expl">Гены у LUCA были; вопрос — какие именно</span></li><li><b>Б.</b> Ген мог попасть в одну из этих групп позже переносом <i>(верный вариант)</i><br><span class="expl">Верно: путём горизонтального переноса. Распределение совместимо с разными историями</span></li><li><b>В.</b> Потому что бактерии и археи не родственны друг другу <i>(неверный вариант)</i><br><span class="expl">Они родственны через LUCA; дело в возможности переноса</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-024-02461-1">Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666</a></li><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li></ul><p></p></details></article><article class="card print-unit" id="ns-hgt"><div class="eyebrow">LUCA и основные клеточные линии · шаг 27 из 46</div><h2>Горизонтальный перенос, потери, дупликации: история гена и история линии</h2><p class="lead"></p><ol class="mech"></ol><p>Клетки происходят от клеток-предков, поэтому историю основных линий изображают деревом — это вертикальное наследование. Горизонтальным переносом генов называют передачу наследственного материала вне связи «родитель — потомок». У бактерий изучены три механизма: трансформация — поглощение свободной ДНК из среды; трансдукция — перенос ДНК бактериофагами; конъюгация — передача ДНК, часто плазмид, при контакте клеток. Археи тоже обмениваются генами.</p><p>Поэтому нужно различать дерево клеточных линий, отражающее преемственность клеточного воспроизводства, и дерево отдельного гена, которое может с ним не совпадать. На возможный перенос указывают несовпадение деревьев, необычное распределение генного семейства по дереву видов и отличие состава последовательности от окружающего генома. Сравнение методов показало, что при многих геномах распределение генного семейства («есть/нет») по дереву видов само становится сильным свидетельством переноса, а согласование дерева гена с деревом видов — ещё одно, не всегда более надёжное. Ни один признак не достаточен сам по себе: сходные картины дают потери генов, скрытая паралогия — незамеченные копии древней дупликации — и ошибки построения дерева. Консервативные гены информационных систем лучше сохраняют вертикальный сигнал; гены обмена веществ и устойчивости к антибиотикам переносятся чаще.</p><div class="static-quiz"><h3>Дерево гена не совпадает с деревом клеточных линий. Какой вывод допустим?</h3><ol><li><b>А.</b> Перенос гена этим уже доказан окончательно <i>(неверный вариант)</i><br><span class="expl">Несовпадение — довод, а не доказательство</span></li><li><b>Б.</b> Дерево клеточных линий построено неверно, его надо исправить <i>(неверный вариант)</i><br><span class="expl">Дерево клеток строят по многим генам; один несовпадающий ген его не опровергает</span></li><li><b>В.</b> Возможен перенос, но есть и другие объяснения <i>(верный вариант)</i><br><span class="expl">Верно. Такую же картину могут дать потери, скрытая паралогия или ошибки дерева; нужен вывод из нескольких свидетельств</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1093/molbev/msaf166">Mishra S., Lercher M. J. Horizontal gene transfer inference: gene presence–absence outperforms gene trees. Mol. Biol. Evol. 2025; 42: msaf166</a></li><li><a href="https://doi.org/10.1038/s41576-023-00688-5">Keeling P. J. Horizontal gene transfer in eukaryotes: aligning theory with data. Nat. Rev. Genet. 2024; 25: 416–430</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-luca-core"><div class="eyebrow">LUCA и основные клеточные линии · шаг 28 из 46</div><h2>Что о LUCA известно уверенно, а что спорно</h2><p class="lead"></p><ol class="mech"></ol><p>Надёжнее всего у LUCA реконструируются генетический код, рибосомный синтез белка, тРНК и основные процессы работы с РНК: эти системы общие для всех линий и поддерживаются множеством согласованных компонентов. LUCA, вероятно, имел геном из ДНК, но состав его аппарата репликации реконструируется менее уверенно: бактерии и археи используют разные репликативные белки. Широкое распространение гомологичных АТФ-синтаз указывает на мембранное энергетическое сопряжение у LUCA или его близких предков. Менее определённы состав мембранных липидов (бактерии и археи различаются их строением), экология, температурный режим и полный набор путей обмена веществ.</p><p>Оценки числа генов LUCA различаются в десятки раз: в одних работах — около 80 белковых семейств, присутствующих почти у всех, в других — более 1500 семейств, в одной из недавних — около 2600 белков, что сравнимо с современными прокариотами. Различие вызвано разными допущениями о потерях и переносах. Есть и реконструкции, по которым обмен веществ LUCA был ферментативно неполным, а недостающие реакции обеспечивала среда. Вопрос о том, насколько LUCA был метаболически самостоятелен, остаётся открытым.</p><div class="static-quiz"><h3>Какое свойство LUCA реконструируется наиболее уверенно?</h3><ol><li><b>А.</b> Генетический код и рибосомный синтез белка <i>(верный вариант)</i><br><span class="expl">Верно: и
