наследственность — хотя бы часть различий передаётся следующим поколениям; дифференциальное воспроизводство — наследуемые различия влияют на ожидаемое число потомков. При выполнении всех трёх условий варианты, оставляющие в данной среде больше потомков, в среднем увеличивают свою долю.","Важно слово «в среднем»: в небольшой популяции полезный вариант может быть утрачен случайно, поэтому отбор повышает вероятность закрепления варианта, но не гарантирует его. Естественный отбор — один из механизмов эволюции, но не единственный; другие разбирают во втором семестре.","Те же три условия действуют не только в популяциях организмов, но и в популяции клеток внутри организма: в опухоли клоны различаются скоростью деления, различия наследуются при делении, и состав опухоли изменяется (вспомнить [[https://fresll.github.io/bio/seminar-8-route.html#error-damage-mutation|БИО-8·1]])."],"conditions":"","sources":["src_01"],"quiz":{"id":"S12-L04","question":"Варианты различаются и оставляют разное число потомков, но потомки не наследуют особенность родителей. Будет ли действовать отбор?","options":[{"id":"S12-L04-1","text":"Нет: различие не наследуется потомками","correct":true,"feedback":"Верно. Без наследования доля варианта не растёт. Все три условия необходимы одновременно"},{"id":"S12-L04-2","text":"Да: достаточно разного числа потомков","correct":false,"feedback":"Если потомки не похожи на родителей, преимущество родителя не переходит к следующему поколению"},{"id":"S12-L04-3","text":"Да, но медленнее, чем при наследовании","correct":false,"feedback":"Без наследования доля варианта в среднем вообще не изменяется"}]}},{"id":"replicator","num":5,"section":1,"questions":[1],"title":"Репликатор, компартмент и автономная система","keywords":["Везикула","Воспроизводство","Деление (протоклетки)","Компартмент","Матрица (РНК-матрица)","Обмен веществ"],"lead":[],"mechanism":[],"paragraphs":["Наследственная преемственность требует копирования информации. Репликатором называют наследуемую информационную структуру, копии которой образуются в репликативной системе; стадии копирования могут выполнять другие компоненты системы. В клетке молекулы ДНК копирует комплекс ферментов (вспомнить [[https://fresll.github.io/bio/seminar-7-route.html#system-map|БИО-7·29]]); геном вируса копируется ферментами заражённой клетки. В моделях ранней эволюции предполагают, что первые репликаторы были проще и могли служить матрицами для собственного копирования.","Репликатор ещё не является автономной живой системой. Сам по себе он не обеспечивает себя мономерами и энергией, не удерживает продукты своей работы и не строит аппарат копирования. Компартмент — ограниченное пространство, например липидная везикула, — удерживает взаимодействующие молекулы рядом и связывает их действие с ростом и делением всей системы. Но и одной границы недостаточно: рост и деление оболочки должны быть согласованы с копированием внутренних компонентов. Клетка — минимальная известная система, в которой наследственный материал, синтез белка, обмен веществ и воспроизводство объединены в общий цикл. Её автономность относительна: любая клетка зависит от притока вещества и энергии."],"conditions":"","sources":["src_01","src_14"],"quiz":{"id":"S12-L05","question":"Чем репликатор отличается от автономной живой системы?","options":[{"id":"S12-L05-1","text":"Репликатор не может изменяться при копировании, а система может","correct":false,"feedback":"Ошибки копирования создают наследуемую изменчивость репликаторов"},{"id":"S12-L05-2","text":"Он не обеспечивает себя веществами и аппаратом","correct":true,"feedback":"Верно. Репликатор копируется в репликативной системе, но сам не обеспечивает себя веществами, энергией и аппаратом копирования. Автономная система объединяет копирование с обменом веществ, границей и воспроизводством"},{"id":"S12-L05-3","text":"Репликатор всегда крупнее любой клетки","correct":false,"feedback":"Размер здесь ни при чём; различие — в наборе функций"}]}},{"id":"early-earth","num":6,"section":1,"questions":[1],"title":"Ранняя Земля: много сред, а не одна","keywords":[],"lead":[],"mechanism":[],"paragraphs":["Земля сформировалась около 4,54 млрд лет назад. Условия на ранней Земле менялись: планета остывала, продолжались вулканизм и падения крупных тел. Изотопный состав древнейших кристаллов циркона совместим с существованием жидкой воды и остывшей коры около 4,4 млрд лет назад. Свободного кислорода в атмосфере было крайне мало, но её общий состав — доли метана, аммиака, водорода, углекислого газа и азота — восстанавливают косвенно, и он остаётся предметом обсуждения. Поэтому выражение «условия ранней Земли» обозначает не одну газовую смесь, а множество местных сред: водоёмы суши, геотермальные поля, лёд, минеральные поверхности, гидротермальные источники.","Даты ранней истории получены разными способами и различаются надёжностью: возраст Земли измерен радиометрически, условия среды — по минералам и изотопам, следы жизни — по ископаемым остаткам и химическим следам организмов (одни из древнейших убедительных — в породах возрастом около 3,48 млрд лет), а возраст общих предков — моделями молекулярной эволюции (БИО-12·34)."],"conditions":"","sources":["src_33","src_30","src_31","src_03"],"widget":{"kind":"s12time","title":"","s":{"title":"Ранняя история Земли и жизни: измерения и модели","status":"Точки — измеренные возрасты; полоса — модельная оценка (БИО-12·34)"}},"quiz":{"id":"S12-L06","question":"Почему нельзя говорить об одной «атмосфере ранней Земли» как об установленном факте?","options":[{"id":"S12-L06-1","text":"Потому что атмосферы у Земли тогда ещё не было","correct":false,"feedback":"Атмосфера была; не установлен её точный состав"},{"id":"S12-L06-2","text":"Потому что состав атмосферы был таким же, как сейчас","correct":false,"feedback":"Свободного кислорода было крайне мало; состав сильно отличался от современного"},{"id":"S12-L06-3","text":"Состав известен косвенно, и со временем он менялся","correct":true,"feedback":"Верно. Общий состав атмосферы восстанавливают косвенно, а в разное время и в разных местах условия различались. Поэтому эксперимент с одной газовой смесью моделирует одну из возможных сред"}]}},{"id":"abiogenic","num":7,"section":1,"questions":[1],"title":"Абиогенный синтез: что показал эксперимент и чего не показал","keywords":["Абиогенный синтез","Образование (вещества)"],"lead":[],"mechanism":[],"paragraphs":["Абиогенный синтез — образование органических соединений без участия живых организмов. Классический эксперимент середины XX века: через смесь метана, аммиака, водорода и водяного пара в замкнутом стеклянном приборе многократно пропускали электрические разряды, продукты собирались в воде; среди них хроматографией обнаружили аминокислоты. Эксперимент показал, что органические соединения могут образовываться абиогенно при заданном составе газов и источнике энергии.","Чего он не показал. Он не доказал, что вся атмосфера ранней Земли имела такой состав: состав газов задал экспериментатор. Поэтому его результат подтверждает возможность такого источника органики лишь в местных восстановительных средах. Он не показал и следующих звеньев — накопления, активации, полимеризации — и тем более возникновения клетки. Образование аминокислот — не возникновение жизни.","При оценке любого эксперимента абиогенного синтеза задают четыре вопроса: какие вещества и условия заданы? Что непосредственно обнаружено? Какие дополнительные операции понадобились — высушивание, очистка, смена среды? Какое звено пути он показывает?"],"conditions":"","sources":["src_26","src_01"],"quiz":{"id":"S12-L07","question":"Какой вывод из эксперимента с разрядами в газовой смеси допустим?","options":[{"id":"S12-L07-1","text":"Аминокислоты могут образовываться абиогенно","correct":true,"feedback":"Верно: при заданном составе газов и электрических разрядах. Это показанная возможность"},{"id":"S12-L07-2","text":"Атмосфера ранней Земли имела именно такой состав","correct":false,"feedback":"Состав газов в эксперименте задан, а не измерен на ранней Земле"},{"id":"S12-L07-3","text":"Так на ранней Земле возникли первые клетки","correct":false,"feedback":"В эксперименте обнаружены отдельные молекулы, а не клетки и даже не полимеры"}]}},{"id":"sources","num":8,"section":1,"questions":[1],"title":"Источники органических молекул","keywords":["Наблюдение (статус утверждения)"],"lead":[],"mechanism":[],"paragraphs":["Органические соединения могли поступать на раннюю Землю несколькими путями: атмосферно-поверхностный синтез (разряды, ультрафиолетовое излучение, нагрев при ударах); геохимический синтез в породах и гидротермальных системах, где минералы и ионы переходных металлов участвуют в переносе электронов; внеземная доставка с метеоритами, кометами и межпланетной пылью. Количественный вклад каждого источника неизвестен.","Органика внеземного происхождения — наблюдение. В образцах астероида Рюгу, доставленных на Землю с минимальным загрязнением, найдены все пять канонических азотистых оснований нуклеиновых кислот: аденин, гуанин, цитозин, тимин и урацил. По условиям образца и контрольным пробам заключают, что предшественники наследственных молекул образуются во внеземных средах без участия жизни. Но то, что именно они стали материалом первых земных систем, не доказано. Обнаружение космической органики не подтверждает и гипотезу переноса жизни между небесными телами: найдены молекулы, а не живые системы, и сама эта гипотеза лишь переносит вопрос о происхождении жизни в другое место."],"conditions":"","sources":["src_07","src_14"],"quiz":{"id":"S12-L08","question":"Найдены азотистые основания в образцах астероида. Что из этого не следует?","options":[{"id":"S12-L08-1","text":"Что основания образуются без живых систем","correct":false,"feedback":"Это допустимая реконструкция: она следует из условий образца и контрольных проб"},{"id":"S12-L08-2","text":"Что жизнь занесена на Землю из космоса","correct":true,"feedback":"Верно. Найдены молекулы, а не живые системы"},{"id":"S12-L08-3","text":"Что в астероиде есть органические вещества","correct":false,"feedback":"Это наблюдение"}]}},{"id":"chain","num":9,"section":1,"questions":[1],"title":"От молекулы к цепи: образование, накопление, концентрирование, активация, полимеризация","keywords":["Везикула","Концентрирование","Накопление","Образование (вещества)","Полимеризация","Сохранение (вещества)"],"lead":[],"mechanism":[],"paragraphs":["Получить молекулу в реакции — лишь первое звено. Дальше нужно объяснить каждое из следующих: <b>образование<\/b> — появление вещества в реакции или его поступление извне; <b>сохранение<\/b> — вещество не разрушается до следующего звена; <b>накопление<\/b> — количество растёт, только если синтез и поступление превышают разрушение и вынос; <b>концентрирование<\/b> — повышение местного содержания, без которого молекулы редко встречаются; <b>активация<\/b> — перевод мономера в реакционноспособное состояние, облегчающее образование связи; <b>полимеризация<\/b> — соединение мономеров в цепь.","Каждое звено имеет свои трудности. Вода — среда переноса веществ, но она же способствует гидролизу многих связей. Механизмы концентрирования — высыхание и циклы увлажнения, замерзание (растворённые вещества вытесняются в жидкие каналы между кристаллами льда), адсорбция на минералах, удержание в порах и везикулах — тоже ограничены: минерал может связывать вещество слишком прочно, при таянии вещества снова разбавляются. Поэтому гипотеза о среде происхождения жизни должна объяснять не только концентрирование, но и совместимость всех звеньев в одних условиях. Выражение «строительные блоки жизни» означает доступность молекул, но не их будущую биологическую функцию."],"conditions":"","sources":["src_14","src_09"],"quiz":{"id":"S12-L09","question":"Мономер сконцентрирован при замерзании, но не активирован. Что ограничивает образование цепи?","options":[{"id":"S12-L09-1","text":"Низкая концентрация мономера в каналах льда","correct":false,"feedback":"Концентрация по условию высокая"},{"id":"S12-L09-2","text":"Мономер не образуется в водоёме","correct":false,"feedback":"Мономер есть и накоплен"},{"id":"S12-L09-3","text":"Нет активации: гидролиз связи преобладает","correct":true,"feedback":"Верно. Без активации связь между мономерами в воде не образуется устойчиво. Концентрирование увеличивает частоту встреч, активация даёт энергию для образования связи"}]},"exam_quiz":{"id":"S12-E02","question":"Эксперимент показал образование нуклеотидов в заданных условиях. Какое звено этим не объяснено?","options":[{"id":"S12-E02-1","text":"Образование мономеров в самой реакции","correct":false,"feedback":"Именно оно показано."},{"id":"S12-E02-2","text":"Накопление, активация, полимеризация","correct":true,"feedback":"Верно: эксперимент абиогенного синтеза показывает одно звено — образование вещества; накопление, концентрирование, активацию и полимеризацию нужно показывать отдельно (БИО-12·9)."},{"id":"S12-E02-3","text":"Никакое: показан весь путь до цепей","correct":false,"feedback":"Каждое звено требует отдельного объяснения."}]}},{"id":"enrichment","num":10,"section":1,"questions":[1],"title":"Химическое обогащение и естественный отбор","keywords":["Вариант","Воспроизводство","Естественный отбор","Наследственность","Образование (вещества)"],"lead":[],"mechanism":[],"paragraphs":["В системе с ограниченными реагентами одни продукты могут образовываться быстрее или быть устойчивее других, и их доля возрастает. Такой процесс называют химическим обогащением. Состав смеси при этом изменяется направленно, но это ещё не естественный отбор. Для отбора нужны воспроизведение системы или её состава и передача различий следующему циклу: дочерняя система должна наследовать особенность родительской. В двух учебных случаях вкладки 1 различие видно по источнику новых молекул. При обогащении они образуются из веществ среды с постоянной скоростью, а не копируются с имеющихся, поэтому предел, к которому приходит состав, задают условия: скорости образования и разрушения. Если часть раствора перенести в новый водоём с теми же условиями, доля устойчивой молекулы там придёт к тому же значению, что и при старте с равного соотношения, — прежний состав не сохраняется. При отборе новые варианты — копии имеющихся, и после такого же переноса доля успешного варианта продолжает расти от достигнутого значения: перенесённый состав служит исходной точкой. Копирование — способ наследования в этой учебной модели, а не единственно возможный: в общем случае для отбора нужны наследуемые различия, влияющие на воспроизводство.","Это различие важно для моделей «сначала метаболизм». Сети химических реакций, в которых продукты ускоряют образование компонентов той же сети, — автокаталитические сети — могут при постоянном притоке вещества и энергии поддерживать свой состав. Но автокатализ и наследственность — разные свойства: если после переноса части смеси в среду с другим притоком состав сети перестраивается и становится таким же, как у сети, запущенной в этой среде с нуля, различия между сетями не наследуются и отбираться не могут. Отдельные реакции и фрагменты таких сетей без ферментов воспроизведены в эксперименте; передача свойств сети следующим циклам без генетического полимера не показана."],"conditions":"","sources":["src_15","src_14"],"quiz":{"id":"S12-L10","question":"Чем химическое обогащение отличается от естественного отбора?","options":[{"id":"S12-L10-1","text":"Состав задают условия среды, а не состав предков","correct":true,"feedback":"Верно. Состав меняется из-за разной устойчивости или скорости образования и после переноса снова приходит к тому же значению. Отбор требует наследуемых различий, влияющих на воспроизводство"},{"id":"S12-L10-2","text":"При обогащении состав смеси не меняется","correct":false,"feedback":"Меняется: доля устойчивого продукта растёт"},{"id":"S12-L10-3","text":"Обогащение возможно только у живых систем с генами","correct":false,"feedback":"Наоборот, это химический процесс, не требующий наследования"}]},"exam_quiz":{"id":"S12-E03","question":"Доля устойчивой молекулы в смеси растёт; автокаталитическая сеть поддерживает свой состав при притоке веществ. Что нужно проверить, чтобы говорить в этих случаях о наследственности и отборе?","options":[{"id":"S12-E03-1","text":"Как быстро растёт доля молекулы","correct":false,"feedback":"Скорость не отличает обогащение от отбора."},{"id":"S12-E03-2","text":"Ускоряет ли сеть сама своё образование","correct":false,"feedback":"Автокатализ есть и без наследственности: состав может задаваться только притоком."},{"id":"S12-E03-3","text":"Сохранится ли состав после переноса","correct":true,"feedback":"Верно: при обогащении и в сети без наследственности новые молекулы образуются из веществ среды, и после переноса состав приходит к значению, заданному условиями. Для отбора нужны наследуемые различия, влияющие на воспроизводство: перенесённый состав должен сохраняться и передаваться следующему циклу. В учебной модели вкладки 1 наследование реализовано копированием вариантов, но прямое копирование молекул — не универсальное требование: в теоретических моделях обсуждают и наследование состава протоклеток (БИО-12·10)."}]}},{"id":"t1-review","num":11,"section":1,"questions":[1],"title":"Разбор заданий вкладки 1","keywords":["Автокаталитическая сеть","Вироид","Липосома","Митохондрия","Образование (вещества)","Полимеризация"],"lead":[],"mechanism":[],"paragraphs":["Задания вкладки 1 построены на одном приёме: отделить то, что наблюдается, от того, что из этого выводят. Пограничные объекты — вироид, выделенная митохондрия, липосома с искусственным геномом, автокаталитическая сеть — показывают, что у каждого из них есть часть признаков живого, но не их функциональное сочетание. Переключение определения меняет только классификацию, а не свойства.","Цепь «образование → сохранение → … → полимеризация» показывает, почему эксперимент, показавший одно звено, не объясняет остальных: мономер может образовываться и не накапливаться; накапливаться и не концентрироваться; концентрироваться и не соединяться в цепь без активации. Наконец, изменение состава смеси само по себе ещё не отбор: проверочный вопрос — сохраняется ли перенесённый состав и передаётся ли следующему циклу (тогда различия наследуются) или приток тянет его к пределу, заданному условиями. Тот же вопрос отделяет автокаталитическую сеть от наследственной системы.","Основной критерий для любого вывода на этой вкладке: что именно обнаружено и при каких условиях, заданных экспериментатором или природой."],"conditions":"","sources":[],"quiz":{"id":"S12-L11","question":"В липосоме идут синтез белка, копирование ДНК и синтез фосфолипидов, деления нет. Какой вывод допустим?","options":[{"id":"S12-L11-1","text":"Получена живая клетка с искусственным геномом","correct":false,"feedback":"Нет деления и собственного аппарата синтеза белка"},{"id":"S12-L11-2","text":"Функции совместимы в одном компартменте","correct":true,"feedback":"Верно. Показана совместимость нескольких функций, но самовоспроизводящейся системы нет: наблюдение не переходит в вывод о живой клетке"},{"id":"S12-L11-3","text":"Так на Земле возникла первая клетка","correct":false,"feedback":"Система собрана из современных ферментов; об истории она не говорит"}]}},{"id":"a1","num":12,"section":1,"questions":[1],"title":"Возможность процесса и историческая необходимость","keywords":["Наблюдение (статус утверждения)","Не следует из данных (статус утверждения)","Образование (вещества)","Показанная возможность (статус утверждения)","Реконструкция (статус утверждения)"],"lead":[],"mechanism":[],"paragraphs":["Исследование 1 предлагает распределить утверждения по тем же четырём статусам, что и на вкладках: наблюдение, показанная возможность, реконструкция и вывод, который не следует из данных. Одна и та же карточка свидетельства может порождать утверждения разных статусов. «Аминокислоты могут ускорять образование коротких цепей РНК» — показанная возможность; «первые цепи РНК на Земле образовались в высыхающих водоёмах с аминокислотами» — реконструкция, историческая гипотеза, совместимая с данными, но ими не доказанная; «находка оснований в астероиде доказывает, что первые гены Земли построены из них» и «устройство рибосомы доказывает, что был этап без белков» — выводы, которые не следуют из данных: они выдают совместимость за доказательство.","Обратная задача: два сценария — наземные геотермальные поля и щелочные гидротермальные источники — совместимы с одними лабораторными результатами. Уверенность в одном из них повышают не выход реакции в лаборатории и не время появления гипотезы, а данные о том, существовали ли такие среды, были ли в них исходные вещества и источники активации и проходят ли все звенья в одних условиях. Если таких данных нет, правильный ответ — «оба сценария совместимы с данными»."],"conditions":"","sources":[],"base":"БИО-12·1, БИО-12·7, БИО-12·9","level":"adv","next_base":"rna-dual","widget":{"kind":"s12status","title":"","s":{"title":"Статус утверждения","status":"Те же четыре статуса — в исследовании 1","L":{"s12_status_obs":"Наблюдение","s12_status_obs_d":"Установлено непосредственно: измерено, увидено или получено в эксперименте","s12_status_poss":"Показанная возможность","s12_status_poss_d":"Показано, что процесс может идти без участия живых систем: он воспроизведён в эксперименте при заданных условиях. Это не значит, что так было в прошлом","s12_status_rec":"Реконструкция","s12_status_rec_d":"Утверждение о прошлом (историческая гипотеза или модель), выведенное из наблюдений с помощью допущений; может быть обосновано сильно или слабо","s12_status_open":"Не следует из данных","s12_status_open_d":"Имеющиеся данные такой вывод не обосновывают: данных недостаточно, или вывод подменяет одно утверждение другим","s12_status_note":"Статус — не оценка важности утверждения. Наблюдение может быть скромным, а реконструкция — очень убедительной, если её поддерживают несколько независимых линий данных. Если утверждение противоречит наблюдению, это видно по самому наблюдению; статус показывает, на чём утверждение основано","s12_status_t":"Статус утверждения"},"ex":{"obs":"Пептидилтрансферазный центр рибосомы образован РНК","poss":"Жирнокислотные везикулы могут расти и делиться без ферментов","rec":"Первые клетки были ограничены мембранами из жирных кислот","open":"Устройство рибосомы доказывает, что был этап эволюции совсем без белков"}}},"quiz":{"id":"S12-L12","question":"Как правильно сформулировать результат эксперимента, в котором реакция прошла при заданных условиях?","options":[{"id":"S12-L12-1","text":"«Так и было на ранней Земле миллиарды лет назад»","correct":false,"feedback":"Это историческое утверждение; эксперимент его не устанавливает"},{"id":"S12-L12-2","text":"«Других путей не было и быть не могло»","correct":false,"feedback":"Эксперимент ничего не говорит о других путях"},{"id":"S12-L12-3","text":"«Процесс может идти при таких условиях»","correct":true,"feedback":"Верно: формулировка не выходит за пределы данных"}]}},{"id":"a1-results","num":13,"section":1,"questions":[1],"title":"Новые данные: аминокислоты ускоряют образование РНК","keywords":["Рибозим"],"lead":[],"mechanism":[],"paragraphs":["В современной клетке РНК участвует в синтезе белка из аминокислот (вспомнить [[https://fresll.github.io/bio/seminar-10-route.html#translation-overview|БИО-10·1]]). Недавно показали химическую связь в обратном направлении. Раствор активированных нуклеотидов — с фосфатом, замкнутым в кольцо на рибозе, — высушивали в щелочной среде при комнатной температуре. Без аминокислот заметную долю коротких цепей давал только гуаниновый нуклеотид. Добавление аминокислот, например валина, повышало выход цепей для остальных нуклеотидов — для цитидинового примерно в 120 раз, — и доли четырёх нуклеотидов в цепях сближались. Цепи оставались короткими — до семи нуклеотидов. Авторы объясняют эффект кислотно-основным катализом: аминогруппа аминокислоты помогает образованию связи между нуклеотидами.","Почему это интересно: если почти все цепи построены из одного нуклеотида, в смеси нет комплементарных партнёров и мало разнообразия последовательностей; при сближении долей четырёх нуклеотидов становятся возможными спаривание цепей и копирование по матрице. Чего результат не показывает: активированные нуклеотиды подавал экспериментатор; цепи в несколько раз короче известных рибозимов; где и когда подобные реакции происходили и происходили ли вообще — не установлено."],"conditions":"","sources":["src_08"],"base":"БИО-12·1, БИО-12·9. См. также: БИО-12·12","level":"adv","next_base":"rna-dual","quiz":{"id":"S12-L13","question":"Какой статус у утверждения «аминокислоты могут без ферментов ускорять образование цепей РНК»?","options":[{"id":"S12-L13-1","text":"Показанная возможность","correct":true,"feedback":"Верно. Процесс воспроизведён в эксперименте при заданных условиях. Утверждение о том, что так было на ранней Земле, было бы уже реконструкцией"},{"id":"S12-L13-2","text":"Наблюдение","correct":false,"feedback":"Наблюдение — рост выхода цепей в конкретной пробе. Обобщение «могут ускорять» — утверждение о возможности процесса"},{"id":"S12-L13-3","text":"Реконструкция","correct":false,"feedback":"Утверждение не говорит о прошлом: в нём нет «было» или «образовались»"}]}},{"id":"r1","num":14,"section":1,"questions":[1],"title":"Как отличают внеземную органику от земного загрязнения","keywords":["Компартмент"],"lead":[],"mechanism":[],"paragraphs":["Главная трудность изучения органики метеоритов — загрязнение земным веществом, в котором много продуктов жизни. Поэтому особенно ценны образцы, доставленные космическими аппаратами прямо с астероидов: их отбирают и хранят в условиях, сводящих загрязнение к минимуму. В образцах астероида Рюгу измеряли содержание азотистых оснований и сравнивали с контрольными пробами, прошедшими те же операции. Найдены все пять оснований нуклеиновых кислот; соотношение пуриновых и пиримидиновых оснований различается у разных метеоритов и астероидов, и авторы связывают это с разными условиями химии на родительских телах.","Для метеоритов, упавших на Землю, используют другие признаки внеземного происхождения: молекулы и структурные изомеры, которые в организмах не встречаются, и особый изотопный состав. Ни один признак сам по себе не решающий — надёжен вывод, на который указывают несколько независимых признаков.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как клетка поддерживает состав и границы своих компартментов и как устроены сигналы о ресурсах — [[https://fresll.github.io/molbio/seminar-1.html|семинар 1 «Компартменты, локальные условия и обмен»]] и [[https://fresll.github.io/molbio/seminar-7.html|семинар 7 «Интеграция сигналов о ресурсном состоянии: mTORC1, AMPK и лизосомная переработка»]]; метаболические потоки — [[https://fresll.github.io/molbio/seminar-8.html|семинар 8 «Метаболические потоки, биосинтез и редокс-состояние»]]."],"conditions":"","sources":["src_07"],"base":"БИО-12·1, БИО-12·8","level":"adv","next_base":"rna-dual","badge":"сверх программы · научное дополнение","quiz":{"id":"S12-L14","question":"Почему образцы, доставленные с астероида, ценнее метеорита, найденного на Земле?","options":[{"id":"S12-L14-1","text":"В них больше органических веществ","correct":false,"feedback":"Количество органики не главное; важна уверенность в её происхождении"},{"id":"S12-L14-2","text":"Они меньше подвергались земному загрязнению","correct":true,"feedback":"Верно: это снижает вероятность, что найденная органика земного происхождения"},{"id":"S12-L14-3","text":"Метеориты, упавшие на Землю, вообще не содержат органики","correct":false,"feedback":"Многие углистые метеориты содержат органические вещества"}]}},{"id":"rna-dual","num":15,"section":2,"questions":[2],"title":"Информационные и каталитические свойства РНК. Рибозимы","keywords":["Вироид","Рибозим","Рибосома"],"lead":[],"mechanism":[],"paragraphs":["Среди современных биологических молекул РНК выделяется тем, что может выполнять две функции. Последовательность нуклеотидов служит матрицей: по ней по принципу комплементарности строится новая цепь (вспомнить [[https://fresll.github.io/bio/seminar-7-route.html#template-principle|БИО-7·3]], [[https://fresll.github.io/bio/seminar-9-route.html#orientation|БИО-9·3]]). Одноцепочечная РНК сворачивается в сложную пространственную структуру, которая определяется последовательностью; свёрнутая молекула может связывать субстраты и катализировать реакции. Каталитические молекулы РНК называют рибозимами. Многие рибозимы, как и некоторые белки, используют ионы металлов в активном центре, что расширяет их возможности.","Рибозимы есть и в современных клетках: самосплайсирующиеся интроны, РНК рибонуклеазы P, рибозимы в геномах некоторых вироидов. Главный пример — рибосома: центр, в котором образуется пептидная связь, образован рибосомной РНК, а белки рибосомы стабилизируют структуру (вспомнить [[https://fresll.github.io/bio/seminar-10-route.html#ribosome|БИО-10·13]]). Однако белки-ферменты в современных клетках катализируют гораздо больше разных реакций и обычно быстрее, чем рибозимы."],"conditions":"","sources":["src_01"],"quiz":{"id":"S12-L15","question":"Какое наблюдение показывает, что РНК может быть катализатором в современной клетке?","options":[{"id":"S12-L15-1","text":"мРНК переносит информацию от гена к рибосоме","correct":false,"feedback":"Это информационная, а не каталитическая функция"},{"id":"S12-L15-2","text":"РНК легко гидролизуется в воде, в отличие от ДНК","correct":false,"feedback":"Это свойство ограничивает гипотезу, а не показывает катализ"},{"id":"S12-L15-3","text":"Центр синтеза пептидной связи образован рРНК","correct":true,"feedback":"Верно. Пептидная связь в рибосоме образуется в центре, образованном рибосомной РНК: это рибозим в каждой клетке"}]}},{"id":"rna-world","num":16,"section":2,"questions":[2],"title":"Гипотеза мира РНК: доводы и ограничения","keywords":["Полимеризация","Рибозим"],"lead":[],"mechanism":[],"paragraphs":["Гипотеза мира РНК — семейство моделей, предполагающих ранний этап, на котором РНК или родственные ей полимеры выполняли центральные информационные и каталитические функции; ДНК и белки взяли на себя большую часть этих функций позже. Доводы: двойственность РНК; рибозимы в современных клетках как возможное наследие раннего этапа; РНК-природа каталитического центра рибосомы.","Ограничения: РНК подвержена гидролизу, особенно при некоторых значениях pH, температуре и в присутствии двухвалентных катионов; химическое разнообразие её нуклеотидов меньше, чем разнообразие боковых групп аминокислот; предбиологический синтез нуклеотидов и их полимеризация трудны; наконец, главная экспериментальная трудность — копирование достаточно длинных последовательностей с приемлемой точностью. Устройство рибосомы согласуется с древней ролью РНК, но не доказывает, что существовал этап совсем без белков. Поэтому мир РНК — гипотеза, а не исторически доказанный этап; рассматриваются и модели, в которых РНК с самого начала работала вместе с пептидами."],"conditions":"","sources":["src_01","src_14"],"quiz":{"id":"S12-L16","question":"Какое утверждение о гипотезе мира РНК корректно?","options":[{"id":"S12-L16-1","text":"Она согласуется с данными, но не доказана","correct":true,"feedback":"Верно. Гипотеза опирается на двойственность РНК и согласуется с устройством рибосомы, но существование такого этапа не доказано"},{"id":"S12-L16-2","text":"Она доказана: центр рибосомы — это рибозим","correct":false,"feedback":"Строение рибосомы согласуется с гипотезой, но не доказывает этапа без белков"},{"id":"S12-L16-3","text":"Она опровергнута: РНК в воде неустойчива","correct":false,"feedback":"Неустойчивость — ограничение, которое гипотеза должна объяснить, а не опровержение"}]},"exam_quiz":{"id":"S12-E04","question":"Главная экспериментальная трудность гипотезы мира РНК?","options":[{"id":"S12-E04-1","text":"Точное копирование длинных цепей РНК","correct":true,"feedback":"Верно: главная экспериментальная трудность — копирование достаточно длинных последовательностей с приемлемой точностью (БИО-12·16)."},{"id":"S12-E04-2","text":"Отсутствие рибозимов в живой природе","correct":false,"feedback":"Рибозимы в природе есть."},{"id":"S12-E04-3","text":"РНК не может служить матрицей для копий","correct":false,"feedback":"Может: по последовательности РНК, как по матрице, строится комплементарная цепь (БИО-12·15)."}]}},{"id":"rna-copy","num":17,"section":2,"questions":[2],"title":"Копирование РНК в эксперименте: от удлинения цепи к замкнутому циклу","keywords":["Рибозим"],"lead":[],"mechanism":[],"paragraphs":["Природные рибозимы не копируют длинные РНК. Рибозимы-полимеразы получают направленной эволюцией в пробирке (БИО-12·23). Результаты удобно расположить по ступеням. Первая — рибозим удлиняет цепь по матрице. Вторая — многократное копирование обеих цепей коротких РНК: в системе, где цепи разделяли нагреванием в кислой среде, а при замораживании вещества концентрировались более чем в 200 раз, рибозим достраивал цепи из активированных фрагментов по три нуклеотида и экспоненциально размножал обе цепи нескольких РНК, включая фрагмент самого себя. Третья — рибозим длиной 45 нуклеотидов синтезировал собственную последовательность и, в отдельной реакции, комплементарную цепь из активированных олигонуклеотидов — с выходом около 0,2 % за 72 дня.","Четвёртая ступень — замкнутый цикл, в котором копия сама служит матрицей, субстраты образуются в той же системе и всё работает без участия экспериментатора, — не получена. Поэтому корректно говорить о рибозиме, «способном к синтезу самого себя в организованной экспериментальной системе», но не об автономно самовоспроизводящейся молекуле. Значение экспериментов в другом: сложная функция копирования умещается в сравнительно короткой последовательности, а обе стадии потенциального цикла химически достижимы."],"conditions":"","sources":["src_09","src_10"],"quiz":{"id":"S12-L17","question":"Чем матричное копирование отличается от замкнутого самовоспроизведения?","options":[{"id":"S12-L17-1","text":"Ничем: если копия цепи получена, цикл уже замкнут","correct":false,"feedback":"Копия одной цепи — ещё не воспроизведение всей системы"},{"id":"S12-L17-2","text":"Система сама воспроизводит матрицу и катализатор","correct":true,"feedback":"Верно. При замкнутом самовоспроизведении копия сама становится матрицей, а система воспроизводит свой катализатор и субстраты без участия экспериментатора"},{"id":"S12-L17-3","text":"При копировании по матрице не нужны субстраты","correct":false,"feedback":"Субстраты нужны в обоих случаях"}]},"exam_quiz":{"id":"S12-E05","question":"Что воспроизведено в экспериментах с рибозимами-полимеразами?","options":[{"id":"S12-E05-1","text":"Замкнутый автономный цикл самовоспроизведения","correct":false,"feedback":"Не получен: циклы задаёт экспериментатор, а субстраты подаются извне (БИО-12·17)."},{"id":"S12-E05-2","text":"Отдельные ступени копирования РНК рибозимами","correct":true,"feedback":"Верно: в экспериментах получены отдельные ступени — удлинение цепи, копирование обеих цепей коротких РНК, синтез собственной последовательности; замкнутый цикл без участия экспериментатора не получен (БИО-12·17)."},{"id":"S12-E05-3","text":"Синтез рибозимов из неорганических веществ","correct":false,"feedback":"Не показан: рибозимы-полимеразы получают направленной эволюцией из готовых молекул РНК (БИО-12·17)."}]}},{"id":"alternatives","num":18,"section":2,"questions":[2],"title":"Не только РНК: пептиды и сети реакций","keywords":["Компартмент","Обмен веществ","Рибосома"],"lead":[],"mechanism":[],"paragraphs":["Ограничения «чистого» мира РНК привели к моделям, где РНК с самого начала взаимодействовала с аминокислотами и пептидами. В экспериментах аминокислоты, присоединённые к неканоническим нуклеозидам РНК, служили началом коротких пептидов, которые синтезировались прямо на РНК. В другой системе аминокислоты в активированной форме без ферментов, в воде при нейтральном pH, присоединялись к концевой рибозе РНК, после чего на РНК образовывались короткие пептиды. Это возможные предшественники аминоацилирования (вспомнить [[https://fresll.github.io/bio/seminar-10-route.html#synthetases|БИО-10·9]]), но не генетический код и не рибосома: соответствия кодонов и аминокислот в этих экспериментах нет.","Модели «сначала метаболизм» предполагают, что до генов могли существовать сети реакций, поддерживаемые минералами, металлами и химическими градиентами. Их сильная сторона — объяснение снабжения веществом и энергией; слабая — механизм устойчивой передачи сложной организации без генетического полимера (БИО-12·10, БИО-12·24). Модели «сначала гены» лучше объясняют наследуемые различия, но требуют химического обеспечения копирования. Современный подход ищет не «первую молекулу», а то, как наследование, обмен веществ и компартментализация стали совместимы."],"conditions":"","sources":["src_21","src_22","src_15"],"quiz":{"id":"S12-L18","question":"Почему присоединение аминокислоты к РНК без ферментов не равно возникновению генетического кода?","options":[{"id":"S12-L18-1","text":"Аминокислоты не присоединяются к РНК без ферментов","correct":false,"feedback":"Присоединяются — это и показано"},{"id":"S12-L18-2","text":"Генетический код возник только позже LUCA","correct":false,"feedback":"Код был уже у LUCA"},{"id":"S12-L18-3","text":"Нет правила соответствия РНК и аминокислоты","correct":true,"feedback":"Верно. Код — это правило соответствия между последовательностью и выбором аминокислоты, а не просто химическая связь"}]}},{"id":"protocell","num":19,"section":2,"questions":[2],"title":"Компартмент и протоклетка","keywords":["Амфифил","Везикула","Граница (системы)","Деление (протоклетки)","Компартмент","Липосома"],"lead":[],"mechanism":[],"paragraphs":["Амфифильные молекулы — содержащие гидрофильную и гидрофобную части — в воде самопроизвольно собираются в мицеллы, бислои и замкнутые везикулы; при этом гидрофобные участки оказываются скрыты от воды (вспомнить семинар 1). Самосборка не требует генетической программы. В моделях ранних клеток используют более простые амфифилы, чем современные фосфолипиды, — жирные кислоты. Жирнокислотные везикулы удерживают полимеры и пропускают часть малых молекул: в экспериментах мембраны из жирных кислот и их производных определённого состава пропускали внутрь активированные нуклеотиды (обычные нуклеотиды — значительно медленнее или совсем не проходили), и затравка внутри удлинялась; в контрольных везикулах из фосфолипида POPC удлинения затравки не обнаружено. Такие везикулы растут, включая новые жирные кислоты, а в лаборатории их делили механическим продавливанием через узкие поры. При каждом таком делении часть содержимого выходила из везикул (около 40 % метки): эксперимент показал рост и механически вызванное деление, но не полное сохранение содержимого. Продавливание через поры — искусственный экспериментальный приём, а не установленный механизм деления первых протоклеток. Их устойчивость сильно зависит от pH, солей и двухвалентных катионов.","Протоклеткой в строгом смысле называют не любую везикулу, а компартмент, в котором граница связана с внутренней химией и воспроизведением. Для этого нужны поступление субстратов, сохранение полимеров, рост оболочки, деление и передача функционального состава дочерним везикулам. В лаборатории показаны отдельные этапы; полный цикл, в котором мембрана, обмен веществ и наследование поддерживают друг друга много поколений, не воспроизведён. Синтетические системы из современных молекул — липосома, где одновременно работают синтез белка, копирование ДНК и синтез фосфолипидов, — проверяют совместимость функций, но не моделируют возникновение жизни."],"conditions":"","sources":["src_28","src_27","src_33","src_13","src_14"],"quiz":{"id":"S12-L19","question":"Почему везикула с РНК внутри — ещё не протоклетка?","options":[{"id":"S12-L19-1","text":"Её рост может не зависеть от содержимого","correct":true,"feedback":"Верно. Рост и деление везикулы могут не зависеть от того, что происходит внутри, а протоклетку определяет связь границы с внутренней химией и воспроизведением"},{"id":"S12-L19-2","text":"Везикулы из жирных кислот не делятся","correct":false,"feedback":"В эксперименте они росли и делились при продавливании через поры; дело не в способности делиться, а в связи с содержимым"},{"id":"S12-L19-3","text":"В ней нет ДНК, а есть только РНК-матрица","correct":false,"feedback":"Наличие ДНК не определяет протоклетку"}]}},{"id":"coupling","num":20,"section":2,"questions":[2],"title":"Связь функции с ростом и отбор протоклеток","keywords":["Амфифил","Вариант","Везикула","Компартмент","Образование (вещества)","Репликатор"],"lead":[],"mechanism":[],"paragraphs":["Если молекула внутри компартмента ускоряет процесс, способствующий росту везикулы, например образование мембранных амфифилов или поступление субстратов, преимущество получает весь компартмент. При делении часть внутренних молекул передаётся дочерним везикулам, и возникает связь между молекулярным вариантом и числом потомков системы. Такую связь функции внутренней молекулы с ростом компартмента будем называть связью функции с ростом (её не следует путать с хемиосмотическим сопряжением, БИО-12·29). Это условие отбора протоклеток: наследуемые внутренние различия должны влиять на число дочерних компартментов.","Препятствия. При делении содержимое распределяется случайно, и дочерняя везикула может не получить редкий катализатор. Рост оболочки должен быть согласован с копированием содержимого. Возможны паразитические репликаторы, которые используют общий катализатор, но не способствуют росту: компартменты ограничивают их распространение, но не устраняют проблему полностью. Математические модели показывают принципиальную возможность отбора протоклеток, но не устанавливают историческую последовательность событий; порядок, в котором функции оказались связаны друг с другом, неизвестен."],"conditions":"","sources":["src_23","src_14"],"quiz":{"id":"S12-L20","question":"Что нужно, чтобы отбор действовал на протоклетки, а не только на отдельные молекулы?","options":[{"id":"S12-L20-1","text":"Мембрана должна быть непроницаемой для всех веществ","correct":false,"feedback":"Непроницаемая мембрана не пропускала бы субстраты"},{"id":"S12-L20-2","text":"Свойство молекулы должно влиять на рост протоклетки","correct":true,"feedback":"Верно. Наследуемое свойство внутренней молекулы должно влиять на рост и деление компартмента"},{"id":"S12-L20-3","text":"Молекул внутри должно быть как можно больше","correct":false,"feedback":"Количество само по себе не связывает свойство молекулы с размножением системы"}]},"exam_quiz":{"id":"S12-E06","question":"При каком условии возможен естественный отбор протоклеток?","options":[{"id":"S12-E06-1","text":"Протоклетки содержат много молекул РНК","correct":false,"feedback":"Количество не связывает свойство с размножением."},{"id":"S12-E06-2","text":"Мембрана протоклеток построена из фосфолипидов","correct":false,"feedback":"Состав мембраны не определяет условие отбора."},{"id":"S12-E06-3","text":"Внутренние различия влияют на число потомков","correct":true,"feedback":"Верно: отбор протоклеток требует, чтобы наследуемые внутренние различия влияли на число дочерних компартментов, — это связь функции с ростом (БИО-12·20)."}]}},{"id":"t2-review","num":21,"section":2,"questions":[2],"title":"Разбор заданий вкладки 2","keywords":["Вариант","Деление (протоклетки)"],"lead":[],"mechanism":[],"paragraphs":["Конструктор протоклетки показывает, что каждый компонент нужен для своего звена: без нуклеотидов нет копий, без жирных кислот нет роста и деления, без мембраны копии рассеиваются. Но главный урок — в состояниях «все компоненты есть, связи функции с ростом нет» и «связь есть». В первом случае РНК копируется, везикулы делятся, а отбора вариантов РНК на уровне везикул нет: размножение системы не зависит от того, что внутри. Во втором свойство молекулы влияет на рост оболочки, и выполняются все три условия отбора.","Обратная задача показывает типичный путь рассуждения: если копирование, удержание, рост и деление в норме, а число потомков от варианта РНК не зависит, не хватает либо связи функции с ростом, либо самой функциональной РНК — например, если её всюду вытеснил паразит. Классификация экспериментов по ступеням копирования напоминает, что копирование коротких РНК — ещё не самовоспроизведение полимеразы."],"conditions":"","sources":[],"quiz":{"id":"S12-L21","question":"Все компоненты протоклетки есть, но свойства РНК не влияют на рост оболочки. Что наблюдается?","options":[{"id":"S12-L21-1","text":"Копирование РНК внутри везикул останавливается","correct":false,"feedback":"Копирование не зависит от связи функции с ростом"},{"id":"S12-L21-2","text":"Везикулы перестают расти и делиться","correct":false,"feedback":"Деление зависит от роста оболочки и внешнего воздействия, а не от связи функции с ростом"},{"id":"S12-L21-3","text":"Везикулы делятся, но отбора вариантов РНК нет","correct":true,"feedback":"Верно. Копирование, рост и деление есть, а размножение везикул от варианта РНК не зависит"}]}},{"id":"a2","num":22,"section":2,"questions":[2],"title":"Почему одного репликатора недостаточно","keywords":["Компартмент","Порог ошибок","Репликатор","Рибозим","Рибозим-полимераза"],"lead":[],"mechanism":[],"paragraphs":["В исследовании 2 в каждой условной протоклетке есть рибозим-полимераза, которая копирует другой, функциональный рибозим; функциональный рибозим ускоряет рост мембраны. Если ошибка в каждой позиции возникает с вероятностью μ, копия участка длиной L безошибочна с вероятностью p = (1 − μ)^L. При μ = 0,01 и L = 10 это около 0,90; при μ = 0,1 и L = 30 — около 0,04. Модель показывает три вещи. Первая: чем длиннее необходимый участок и ниже точность, тем реже копия сохраняет функцию. Вторая: компартмент без связи функции с ростом не помогает — полимераза есть в каждой системе, поэтому системы с испорченной копией тоже растут и делятся, и ошибки постепенно вытесняют функцию (при μ = 0,03 и L = 30 через 10 циклов доля функциональных систем около 0,03). Третья: при связи функции с ростом системы без работающего катализатора не растут, и доля функциональных систем снижается от 1 и приближается к p сверху, не опускаясь ниже p (в том же примере p около 0,40, доля через 10 циклов около 0,41). Если бы копировать себя могла только сама функциональная молекула, испорченная копия вообще не размножалась бы — компартмент уже этим ограничивал бы ошибки; модель рассматривает случай с отдельной полимеразой.","Главный вывод модели: точность копирования задаёт предел, к которому при отборе приближается доля функциональных систем, а результат при одной и той же точности определяют условия компартментализации. При μ = 0,03 и L = 30 доля функциональных систем — около 0,03 без компартмента, около 0,03 в компартменте без связи функции с ростом и около 0,41 при такой связи. Отсюда — ответ на обратную задачу: если две системы с одинаковым рибозимом и одинаковой точностью копирования различаются устойчивостью, причиной могут быть отсутствие связи функции с ростом, утечка продукта или неудержание самого репликатора; различают эти причины измерения скорости роста, удержания продукта и удержания меченой РНК, а не подсчёт систем в конце.","Числа в модели условные; порог ошибок — не универсальная константа: он зависит от длины, допустимых замен и силы отбора."],"conditions":"","sources":[],"base":"БИО-12·5, БИО-12·17, БИО-12·20","level":"adv","next_base":"luca","quiz":{"id":"S12-L22","question":"В модели со связью функции с ростом доля функциональных систем снижается от 1 к p. Почему она не остаётся равной 1?","options":[{"id":"S12-L22-1","text":"Отбор отсеивает ошибки и не исправляет их","correct":true,"feedback":"Верно. Отбор не даёт нефункциональным системам размножаться, но ошибки возникают при каждом копировании заново"},{"id":"S12-L22-2","text":"Потому что в среде не хватает нуклеотидов","correct":false,"feedback":"Ресурсы в модели не ограничены"},{"id":"S12-L22-3","text":"Функциональные системы со временем гибнут","correct":false,"feedback":"В модели системы не погибают"}]}},{"id":"a2-results","num":23,"section":2,"questions":[2],"title":"Новые данные: копирование по матрице внутри модельной протоклетки","keywords":["Везикула","Граница (системы)","Матрица (РНК-матрица)","Репликатор"],"lead":[],"mechanism":[],"paragraphs":["Может ли граница одновременно удерживать репликатор и пропускать к нему мономеры? Современные мембраны из фосфолипидов почти непроницаемы для заряженных молекул, и клетки транспортируют нуклеотиды белками-переносчиками. В эксперименте внутрь везикул из жирных кислот и их производных поместили короткую цепь ДНК — матрицу с затравкой — и добавили активированные нуклеотиды снаружи. Нуклеотиды проходили через мембрану без белков (в везикулах диаметром около 100 нм их концентрации выравнивались наполовину примерно за 12 часов) и внутри присоединялись к затравке по матрице без ферментов; через сутки полноразмерных продуктов было примерно столько же, сколько в той же реакции в растворе. Матрица и затравка из везикул не выходили. В везикулах из фосфолипидов удлинения затравки не было.","Этот результат связывает две функции границы, о которых говорит исследование 2: удержание репликатора и снабжение его мономерами. Ограничения: копировалась одна короткая однородная матрица, нуклеотиды были химически изменены, копия не становилась новой матрицей, деления везикул и передачи копий дочерним системам не было. Мембраны такого состава — экспериментальная модель; из чего состояли мембраны первых клеток, неизвестно."],"conditions":"","sources":["src_28"],"base":"БИО-12·5, БИО-12·19. См. также: БИО-12·22","level":"adv","next_base":"luca","quiz":{"id":"S12-L23","question":"Что показал эксперимент с копированием по матрице внутри везикул?","options":[{"id":"S12-L23-1","text":"Получена самовоспроизводящаяся протоклетка","correct":false,"feedback":"Нет: копировалась одна короткая матрица, копия не служила новой матрицей, а деления везикул не было"},{"id":"S12-L23-2","text":"Граница удерживала матрицу и пропускала мономеры","correct":true,"feedback":"Верно. Активированные нуклеотиды проходили через мембрану из жирных кислот, а матрица с затравкой оставалась внутри, и копирование шло без ферментов"},{"id":"S12-L23-3","text":"Фосфолипидные мембраны пропускают нуклеотиды лучше","correct":false,"feedback":"Наоборот: в везикулах из фосфолипидов удлинения затравки не было"}]}},{"id":"r2","num":24,"section":2,"questions":[2],"title":"Пределы наследственности без генов: модель протоклеток","keywords":[],"lead":[],"mechanism":[],"paragraphs":["Могли ли протоклетки накапливать сложность обмена веществ ещё до генов? Математическая модель рассматривала протоклетки, растущие за счёт превращения водорода и углекислого газа в органические вещества, в которых нуклеотиды служили простыми катализаторами без ферментов. Результат оказался неожиданным. Рост протоклеток ускорялся, только если нуклеотиды ускоряли общий процесс, питающий всю сеть, — фиксацию углекислого газа. Сильное ускорение одной ветви, например синтеза аминокислот, отнимало углерод у жирных кислот, нужных для роста мембраны, и замедляло рост, а при конкуренции разных каталитических функций рост прекращался. Ускорение синтеза самих нуклеотидов приводило к их накоплению в ущерб росту протоклеток.","Вывод модели: полезен катализ, который поддерживает сбалансированный поток вещества через всю систему; «больше катализа» не значит «лучше». Это перекликается с исследованием 2: функция молекулы должна приносить пользу всей системе, а не только себе. Статус — теоретическая модель с упрощёнными правилами деления; экспериментального воспроизведения такого перехода нет.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как устроены современные мембранные системы и контроль качества белков и органелл — [[https://fresll.github.io/molbio/seminar-11.html|семинар 11 «Протеостаз, убиквитин-протеасомная система, ERAD и аутофагический поток»]] и [[https://fresll.github.io/molbio/seminar-12.html|семинар 12 «Селективная аутофагия и контроль качества органелл»]]."],"conditions":"","sources":["src_12"],"base":"БИО-12·10, БИО-12·18, БИО-12·20","level":"adv","next_base":"luca","badge":"сверх программы · научное дополнение","quiz":{"id":"S12-L24","question":"Почему в модели сильное ускорение синтеза аминокислот замедляло рост протоклеток?","options":[{"id":"S12-L24-1","text":"Аминокислоты разрушали мембрану клетки","correct":false,"feedback":"В модели этого правила нет"},{"id":"S12-L24-2","text":"Нуклеотиды переставали образовываться совсем","correct":false,"feedback":"Дело в балансе потоков между ветвями сети"},{"id":"S12-L24-3","text":"Углерод уходил от синтеза жирных кислот","correct":true,"feedback":"Верно. Углерод уходил на аминокислоты, и не хватало жирных кислот для роста мембраны: поток вещества разбалансировался"}]}},{"id":"luca","num":25,"section":3,"questions":[3],"title":"LUCA: последний, а не первый","keywords":["АТФ (аденозинтрифосфат)","LUCA (Last Universal Common Ancestor)","Рибосома"],"lead":[],"mechanism":[],"paragraphs":["LUCA (Last Universal Common Ancestor, последний универсальный общий предок) — реконструируемый последний общий предок всех современных клеточных линий. Полезно различать три связанных понятия. Филогенетический узел — точка на дереве, где сходятся линии всех современных клеток. Предковая популяция — реальные организмы того времени, вероятно обменивавшиеся генами. Реконструируемый набор генов и свойств — статистический вывод по современным геномам, а не прочитанная последовательность древнего генома.","LUCA — не первая жизнь и не обязательно одна клетка. До него могли существовать другие наследственные и клеточные системы, линии которых угасли или не оставили потомков среди современных организмов. Общее происхождение современной клеточной жизни подтверждает глубокое сходство её информационных систем: почти универсальный генетический код, синтез белка на рибосомах, тРНК, сходные принципы транскрипции, АТФ как универсальный переносчик энергии. Поэтому ко времени LUCA клеточная организация была уже значительно сложнее любых протоклеточных моделей. Ископаемых остатков, которые можно отнести к LUCA, нет."],"conditions":"","sources":["src_03","src_01"],"quiz":{"id":"S12-L25","question":"Что означает выражение «геном LUCA»?","options":[{"id":"S12-L25-1","text":"Реконструкцию набора генов по современным геномам","correct":true,"feedback":"Верно. Это вероятностная реконструкция набора генных семейств: древний геном не прочитан, его восстанавливают с допущениями"},{"id":"S12-L25-2","text":"Последовательность ДНК, прочитанную в древних породах","correct":false,"feedback":"ДНК такого возраста не сохраняется"},{"id":"S12-L25-3","text":"Геном самой первой живой клетки на Земле","correct":false,"feedback":"LUCA — не первая клетка"}]},"exam_quiz":{"id":"S12-E07","question":"Чем LUCA отличается от первых форм жизни?","options":[{"id":"S12-E07-1","text":"До LUCA могли быть линии без потомков","correct":true,"feedback":"Верно: LUCA — последний общий предок современных клеток; до него могли существовать другие системы, линии которых не оставили потомков (БИО-12·25)."},{"id":"S12-E07-2","text":"LUCA и есть самая первая живая система","correct":false,"feedback":"Это последний общий предок современных клеток, а не первая жизнь."},{"id":"S12-E07-3","text":"LUCA жил позже, чем первые эукариоты","correct":false,"feedback":"Все современные клетки, включая эукариот, — потомки LUCA."}]}},{"id":"reconstruction","num":26,"section":3,"questions":[3],"title":"Как реконструируют свойства LUCA","keywords":["Дерево гена","LUCA (Last Universal Common Ancestor)","Ортологи","Паралоги","Реконструкция (статус утверждения)"],"lead":[],"mechanism":[],"paragraphs":["Простого пересечения списков генов бактерий и архей недостаточно: широко распространённый ген мог быть унаследован от общего предка, перенесён позднее или независимо утрачен в нескольких линиях. Реконструкция включает несколько этапов: выделяют семейства гомологичных генов — генов общего происхождения; различают ортологи (разошлись при разделении линий) и паралоги (возникли при дупликации гена в одной линии); строят дерево каждого семейства; сопоставляют дерево гена с деревом клеточных линий; оценивают вероятности присутствия гена у предка, его потерь, дупликаций и переносов.","Вывод надёжнее, когда согласованный сигнал дают многие компоненты одной системы: древность аппарата трансляции поддерживает не один ген, а комплекс из рибосомных РНК, белков и факторов трансляции. Присутствие одного широко распространённого фермента — слабый довод в пользу того, что у LUCA был весь соответствующий метаболический путь. Итог — вероятностная реконструкция, чувствительная к выборке геномов и допущениям модели."],"conditions":"","sources":["src_03","src_01"],"quiz":{"id":"S12-L26","question":"Почему «ген есть у бактерий и архей» не доказывает, что он был у LUCA?","options":[{"id":"S12-L26-1","text":"Потому что у LUCA вообще не было генов","correct":false,"feedback":"Гены у LUCA были; вопрос — какие именно"},{"id":"S12-L26-2","text":"Ген мог попасть в одну из этих групп позже переносом","correct":true,"feedback":"Верно: путём горизонтального переноса. Распределение совместимо с разными историями"},{"id":"S12-L26-3","text":"Потому что бактерии и археи не родственны друг другу","correct":false,"feedback":"Они родственны через LUCA; дело в возможности переноса"}]},"exam_quiz":{"id":"S12-E08","question":"Какие процессы ограничивают реконструкцию свойств LUCA?","options":[{"id":"S12-E08-1","text":"Точечные мутации, накопленные в генах","correct":false,"feedback":"Мутации — сырьё для различий, но главная трудность — история генов."},{"id":"S12-E08-2","text":"Перенос, потери и дупликации генов","correct":true,"feedback":"Верно: широко распространённый ген мог быть унаследован от общего предка, перенесён позднее или независимо утрачен; поэтому реконструкция вероятностная (БИО-12·26, ·27)."},{"id":"S12-E08-3","text":"Малое число современных бактерий","correct":false,"feedback":"Современных бактерий множество."}]}},{"id":"hgt","num":27,"section":3,"questions":[3],"title":"Горизонтальный перенос, потери, дупликации: история гена и история линии","keywords":["Археи","Вертикальное наследование","Деление (протоклетки)","Дерево клеточных линий","Паралоги"],"lead":[],"mechanism":[],"paragraphs":["Клетки происходят от клеток-предков, поэтому историю основных линий изображают деревом — это вертикальное наследование. Горизонтальным переносом генов называют передачу наследственного материала вне связи «родитель — потомок». У бактерий изучены три механизма: трансформация — поглощение свободной ДНК из среды; трансдукция — перенос ДНК бактериофагами; конъюгация — передача ДНК, часто плазмид, при контакте клеток. Археи тоже обмениваются генами.","Поэтому нужно различать дерево клеточных линий, отражающее преемственность клеточного воспроизводства, и дерево отдельного гена, которое может с ним не совпадать. На возможный перенос указывают несовпадение деревьев, необычное распределение генного семейства по дереву видов и отличие состава последовательности от окружающего генома. Сравнение методов показало, что при многих геномах распределение генного семейства («есть/нет») по дереву видов само становится сильным свидетельством переноса, а согласование дерева гена с деревом видов — ещё одно, не всегда более надёжное. Ни один признак не достаточен сам по себе: сходные картины дают потери генов, скрытая паралогия — незамеченные копии древней дупликации — и ошибки построения дерева. Консервативные гены информационных систем лучше сохраняют вертикальный сигнал; гены обмена веществ и устойчивости к антибиотикам переносятся чаще."],"conditions":"","sources":["src_01","src_16","src_17"],"quiz":{"id":"S12-L27","question":"Дерево гена не совпадает с деревом клеточных линий. Какой вывод допустим?","options":[{"id":"S12-L27-1","text":"Перенос гена этим уже доказан окончательно","correct":false,"feedback":"Несовпадение — довод, а не доказательство"},{"id":"S12-L27-2","text":"Дерево клеточных линий построено неверно, его надо исправить","correct":false,"feedback":"Дерево клеток строят по многим генам; один несовпадающий ген его не опровергает"},{"id":"S12-L27-3","text":"Возможен перенос, но есть и другие объяснения","correct":true,"feedback":"Верно. Такую же картину могут дать потери, скрытая паралогия или ошибки дерева; нужен вывод из нескольких свидетельств"}]},"exam_quiz":{"id":"S12-E09","question":"Перенос гена от бактерии к архее изменяет положение археи на дереве клеток?","options":[{"id":"S12-E09-1","text":"Да: на дереве клеток архея окажется среди бактерий","correct":false,"feedback":"История одного гена не равна истории линии."},{"id":"S12-E09-2","text":"Да, если перенесённый ген очень важный","correct":false,"feedback":"Важность гена не меняет преемственность клеточного воспроизводства."},{"id":"S12-E09-3","text":"Нет: дерево клеток строят по многим генам","correct":true,"feedback":"Верно: дерево клеточных линий отражает преемственность клеточного воспроизводства и строится по многим генам; перенос меняет историю одного гена, а не положение линии (БИО-12·27)."}]}},{"id":"luca-core","num":28,"section":3,"questions":[3],"title":"Что о LUCA известно уверенно, а что спорно","keywords":["Археи","АТФ (аденозинтрифосфат)","Бактерии","LUCA (Last Universal Common Ancestor)","Обмен веществ"],"lead":[],"mechanism":[],"paragraphs":["Надёжнее всего у LUCA реконструируются генетический код, рибосомный синтез белка, тРНК и основные процессы работы с РНК: эти системы общие для всех линий и поддерживаются множеством согласованных компонентов. LUCA, вероятно, имел геном из ДНК, но состав его аппарата репликации реконструируется менее уверенно: бактерии и археи используют разные репликативные белки. Широкое распространение гомологичных АТФ-синтаз указывает на мембранное энергетическое сопряжение у LUCA или его близких предков. Менее определённы состав мембранных липидов (бактерии и археи различаются их строением), экология, температурный режим и полный набор путей обмена веществ.","Оценки числа генов LUCA различаются в десятки раз: в одних работах — около 80 белковых семейств, присутствующих почти у всех, в других — более 1500 семейств, в одной из недавних — около 2600 белков, что сравнимо с современными прокариотами. Различие вызвано разными допущениями о потерях и переносах. Есть и реконструкции, по которым обмен веществ LUCA был ферментативно неполным, а недостающие реакции обеспечивала среда. Вопрос о том, насколько LUCA был метаболически самостоятелен, остаётся открытым."],"conditions":"","sources":["src_03","src_29"],"quiz":{"id":"S12-L28","question":"Какое свойство LUCA реконструируется наиболее уверенно?","options":[{"id":"S12-L28-1","text":"Генетический код и рибосомный синтез белка","correct":true,"feedback":"Верно: их поддерживают многие согласованные компоненты"},{"id":"S12-L28-2","text":"Состав и строение мембранных липидов клетки","correct":false,"feedback":"Это одно из самых спорных свойств"},{"id":"S12-L28-3","text":"Температура среды, в которой он обитал","correct":false,"feedback":"Экология LUCA реконструируется модельно и неуверенно"}]}},{"id":"chemiosmosis","num":29,"section":3,"questions":[3],"title":"Хемиосмос: механизм и его древность","keywords":["АТФ (аденозинтрифосфат)","АДФ (аденозиндифосфат)","Хемиосмос","Цепь переноса электронов"],"lead":[],"mechanism":[],"paragraphs":["Хемиосмос — сопряжение потока ионов через мембрану по электрохимическому градиенту с синтезом АТФ. При дыхании цепь переноса электронов переносит протоны через мембрану и создаёт протондвижущую силу — разность концентраций протонов (разность pH) и электрических потенциалов (вспомнить семинар 5). Протоны возвращаются через АТФ-синтазу и вращают её мембранный ротор; вращение изменяет конформацию каталитических субъединиц, и из АДФ и фосфата образуется АТФ. Если протоны проходят через мембрану в обход синтазы, градиент разряжается и синтез АТФ падает.","У бактерий и архей есть гомологичные роторные АТФ-синтазы. Широкое распространение хемиосмотического сопряжения поддерживает его древнее происхождение — это сильный сравнительный вывод. Где и как механизм возник — другой вопрос. По одной из гипотез, в щелочных гидротермальных источниках перепад концентраций протонов между щелочной жидкостью и более кислой водой древнего океана возникал на тонких минеральных перегородках. Но природный градиент — лишь источник энергии: механизм, который мог бы сопрягать его с синтезом АТФ, не показан. Это одна из конкурирующих гипотез."],"conditions":"","sources":["src_01","src_03","src_14"],"quiz":{"id":"S12-L29","question":"Что поддерживает вывод о древности хемиосмоса?","options":[{"id":"S12-L29-1","text":"Щелочные источники существуют и сейчас","correct":false,"feedback":"Существование среды не показывает, что в ней возник механизм"},{"id":"S12-L29-2","text":"Гомологичные АТФ-синтазы у бактерий и архей","correct":true,"feedback":"Верно: роторные АТФ-синтазы обеих групп гомологичны. Это сравнительно-биологический довод"},{"id":"S12-L29-3","text":"АТФ используется всеми клетками как переносчик энергии","correct":false,"feedback":"Это довод в пользу общего происхождения, но не конкретно хемиосмоса"}]}},{"id":"bacteria-archaea","num":30,"section":3,"questions":[3],"title":"Бактерии и археи: самое глубокое разделение клеточной жизни","keywords":["Археи","Бактерии","Деление (протоклетки)","Митохондрия"],"lead":[],"mechanism":[],"paragraphs":["Наиболее глубокое разделение современной клеточной жизни проходит между бактериями и археями; его впервые выявило сравнение рибосомных РНК. Клетки обеих групп обычно невелики, не имеют оформленного ядра и размножаются делением, но различаются строением мембранных липидов, клеточных оболочек и информационных систем. Аппарат транскрипции и часть белков упаковки ДНК у архей по ряду признаков ближе к эукариотическим, чем к бактериальным. Термин «прокариоты» удобно описывает безъядерную организацию, но не означает единую ветвь, противопоставленную эукариотам. Многие археи живут не в экстремальных условиях, а в почве, океане, донных отложениях и организмах животных.","Историческая трёхдоменная схема выделяла бактерии, археи и эукариоты как три самостоятельные ветви. Большинство современных филогеномных анализов поддерживает двухдоменную модель: первичные линии — бактерии и археи, а ядерная линия эукариот возникла внутри архей, ближе всего к асгардархеям. Митохондрия при этом — вклад бактерий (тема 4). Различия бактерий и клеток человека лежат в основе избирательного действия многих антибиотиков; сходство бактериальных и митохондриальных рибосом может объяснять часть побочных эффектов отдельных препаратов."],"conditions":"","sources":["src_01","src_04"],"quiz":{"id":"S12-L30","question":"Где на дереве двухдоменной модели находится ядерная линия эукариот?","options":[{"id":"S12-L30-1","text":"Внутри бактерий, у альфа-протеобактерий","correct":false,"feedback":"Альфа-протеобактерии — родственники предка митохондрии, а не ядерной линии"},{"id":"S12-L30-2","text":"Третьей первичной ветвью, отдельно от них","correct":false,"feedback":"Так изображала трёхдоменная схема; большинство современных филогеномных анализов её не поддерживает"},{"id":"S12-L30-3","text":"Внутри архей, ближе всего к асгардархеям","correct":true,"feedback":"Верно"}]}},{"id":"t3-review","num":31,"section":3,"questions":[3],"title":"Разбор заданий вкладки 3","keywords":["Деление (протоклетки)","Дерево гена","LUCA (Last Universal Common Ancestor)","Наблюдение (статус утверждения)","Реконструкция (статус утверждения)","Хемиосмос"],"lead":[],"mechanism":[],"paragraphs":["На вкладке 3 две разные истории гена дают одинаковые списки линий: «был у LUCA и потерян в линии Б3» и «возник в общем предке архей и эукариот и перенесён от А1 к общему предку Б1 и Б2». Отсюда главное правило: присутствие или отсутствие гена у современных организмов — наблюдение, а было ли оно у предка — вероятностный вывод. В таком небольшом дереве различает истории дерево гена: при вертикальном наследовании гены Б1 и Б2 стоят на бактериальной ветви, при переносе — рядом с геном донора. Но и дерево может ввести в заблуждение, поэтому вывод проверяют несколькими методами; при сотнях геномов сильным свидетельством становится и само распределение гена по дереву видов.","Обратная задача добавляет третий случай: у одной линии две копии гена в разных местах дерева — собственная, унаследованная вертикально, и перенесённая. Одна клеточная линия может нести гены с разной историей. Задания с хемиосмосом напоминают, что вывод о свойствах LUCA — реконструкция по распространению гомологичных систем, а не наблюдение."],"conditions":"","sources":[],"quiz":{"id":"S12-L31","question":"В условном дереве из шести линий ген есть у двух бактериальных линий, у архей и у эукариот. Что можно сказать о гене у LUCA без дерева гена?","options":[{"id":"S12-L31-1","text":"Нельзя решить по одному лишь распределению","correct":true,"feedback":"Верно. Распределение совместимо и с наследованием и потерями, и с переносом"},{"id":"S12-L31-2","text":"Ген был у LUCA и сохранился почти у всех","correct":false,"feedback":"Это одна из совместимых историй, но не единственная"},{"id":"S12-L31-3","text":"Гена у LUCA не было: его нет у одной линии","correct":false,"feedback":"Это тоже лишь одна из возможностей"}]}},{"id":"a3","num":32,"section":3,"questions":[3],"title":"Одно распределение — разные истории","keywords":["Археи","Бактерии","Деление (протоклетки)","Дерево гена","LUCA (Last Universal Common Ancestor)"],"lead":[],"mechanism":[],"paragraphs":["В исследовании 3 ген Т есть у бактерии Б2, у архей А1, А2 и у эукариот, и отсутствует у Б1 и Б3. Три истории дают это распределение: наследование от LUCA с двумя независимыми потерями; возникновение у архей и перенос к Б2; древняя дупликация, после которой Б2 сохранила одну копию, а археи и эукариоты — другую. Свидетельства изменяют уверенность по-разному. Дерево гена отделяет перенос от двух других историй. Данные о гомологии — нашлись ли у линий вторые копии того же семейства — отделяют дупликацию от наследования. Геномное окружение гена — расположение на мобильном генетическом элементе, необычный состав нуклеотидов — независимо поддерживает перенос и понижает уверенность в обеих древних историях, но со временем состав перенесённого гена выравнивается. Независимые признаки, например соседние гены того же пути, сходные с архейными, тоже повышают уверенность в переносе.","Ни одно свидетельство не является абсолютно достаточным; уверенность растёт, когда несколько независимых свидетельств указывают в одну сторону. И главное: перенос гена к Б2 не делает Б2 археей — история гена не равна истории клеточной линии."],"conditions":"","sources":[],"base":"БИО-12·26, БИО-12·27","level":"adv","next_base":"eukaryote","quiz":{"id":"S12-L32","question":"Какая пара историй даёт похожие деревья гена?","options":[{"id":"S12-L32-1","text":"Наследование с потерями и перенос","correct":false,"feedback":"При переносе ген получателя лежит рядом с геном донора — деревья разные"},{"id":"S12-L32-2","text":"Наследование с потерями и древняя дупликация","correct":true,"feedback":"Верно: если разные линии сохранили разные копии древней дупликации, паралоги могут выглядеть как ортологи"},{"id":"S12-L32-3","text":"Все три истории дают одинаковые деревья гена","correct":false,"feedback":"Перенос даёт отличающееся дерево"}]}},{"id":"a3-results","num":33,"section":3,"questions":[3],"title":"Новые данные: комплекс, который терялся больше тридцати раз","keywords":["Деление (протоклетки)","Комплексы SMC","LECA (Last Eukaryotic Common Ancestor)","Реконструкция (статус утверждения)"],"lead":[],"mechanism":[],"paragraphs":["Хромосомы эукариот организуют белковые комплексы SMC — белки поддержания структуры хромосом. Когезин удерживает сестринские хроматиды вместе от репликации до анафазы, конденсины уплотняют хромосомы перед делением (вспомнить семинар 6, [[https://fresll.github.io/bio/seminar-7-route.html#s-phase-2c4c|БИО-7·26]]). У большинства прокариот один такой комплекс, у эукариот обычно четыре. Сравнив геномы множества эукариот, исследователи пришли к выводу, что у LECA уже были все четыре комплекса. Один из них, конденсин II, затем утрачивался независимо не менее 30 раз в разных ветвях эукариот. Значит, отсутствие конденсина II у современного организма почти ничего не говорит о его предках: распределение «у одних есть, у других нет» здесь создано в основном потерями.","Работа показывает и пределы таких выводов. Конденсин II считали отсутствующим у грибов, но его нашли у одного рода грибов; сохранился ли он от предка или получен переносом, однозначного ответа деревья белков не дали. Отсутствие гена в неполностью прочитанном геноме может быть ложным, поэтому утрату комплекса признавали, только если не найдены все его особые субъединицы. Авторы предполагают также, что исходный комплекс удвоился ещё у архейных предков эукариот, — это реконструкция со слабой статистической поддержкой глубоких ветвей."],"conditions":"","sources":["src_18"],"base":"БИО-12·26, БИО-12·27. См. также: БИО-12·32","level":"adv","next_base":"eukaryote","quiz":{"id":"S12-L33","question":"Почему отсутствие конденсина II у организма — слабый довод о его предках?","options":[{"id":"S12-L33-1","text":"Конденсина II никогда не было у эукариот","correct":false,"feedback":"Он был у LECA и есть у многих современных эукариот"},{"id":"S12-L33-2","text":"Все эукариоты получили его путём переноса","correct":false,"feedback":"По данным работы, распределение создано в основном потерями"},{"id":"S12-L33-3","text":"Комплекс многократно и независимо терялся","correct":true,"feedback":"Верно. К тому же отсутствие гена в неполностью прочитанном геноме может быть ложным"}]}},{"id":"r3","num":34,"section":3,"questions":[3],"title":"Как датируют LUCA и почему это модель","keywords":["АТФ (аденозинтрифосфат)","АТФ-синтаза","LUCA (Last Universal Common Ancestor)"],"lead":[],"mechanism":[],"paragraphs":["Возраст LUCA оценивают молекулярными часами — статистическими моделями, связывающими число замен в последовательностях со временем. Модели допускают разные скорости замен в разных ветвях и привязываются к нескольким узлам дерева с известным минимальным возрастом — по ископаемым остаткам микроорганизмов и изотопным данным (калибровки). В одном из недавних анализов использовали гены, удвоившиеся ещё до LUCA: обе копии есть у современных организмов, и их общее дерево позволяет укоренить и датировать узел LUCA. Центральная оценка — около 4,2 млрд лет, интервал — примерно 4,09–4,33 млрд лет. Та же работа реконструирует LUCA как анаэробный организм прокариотного уровня сложности, с компонентами защиты от вирусов, входивший в сообщество других микроорганизмов.","Почему это модель. Дата зависит от выбранных генов, калибровок и модели изменения скоростей замен; это количественная гипотеза, а не геологическое измерение. Она не противоречит тому, что одни из древнейших убедительных следов жизни найдены в породах возрастом около 3,48 млрд лет: даты получены разными методами, а ископаемая летопись ранней жизни фрагментарна — древние породы нагревались и деформировались.",{"h":"Дальше в курсе «Молекулярная биология»"},"Как устроены митохондриальная энергетика, мембранный потенциал и АТФ-синтаза в клетках человека — [[https://fresll.github.io/molbio/seminar-9.html|семинар 9 «Митохондрии как энергетический, сигнальный и генетический узел»]]."],"conditions":"","sources":["src_03","src_31"],"base":"БИО-12·6, БИО-12·25","level":"adv","next_base":"eukaryote","badge":"сверх программы · научное дополнение","quiz":{"id":"S12-L34","question":"LUCA оценён в 4,2 млрд лет, а одни из древнейших убедительных следов жизни — 3,48 млрд лет. Противоречие ли это?","options":[{"id":"S12-L34-1","text":"Нет: методы разные, летопись неполна","correct":true,"feedback":"Верно. Даты получены разными методами, а ископаемая летопись ранней жизни фрагментарна"},{"id":"S12-L34-2","text":"Да: одна из двух дат неверна","correct":false,"feedback":"Модельная оценка и минимальный возраст по ископаемым не обязаны совпадать"},{"id":"S12-L34-3","text":"Нет: обе даты измерены одним методом","correct":false,"feedback":"Методы разные: модель молекулярной эволюции и анализ пород"}]}},{"id":"eukaryote","num":35,"section":4,"questions":[4],"title":"Эукариотическая клетка; FECA и LECA","keywords":["Археи","АТФ (аденозинтрифосфат)","Бактерии","LECA (Last Eukaryotic Common Ancestor)","FECA (First Eukaryotic Common Ancestor)","Эукариогенез"],"lead":[],"mechanism":[],"paragraphs":["Эукариотическую клетку отличает сочетание взаимосвязанных систем: геном заключён в ядре; транспорт организован эндомембранной системой; форму и движение поддерживает развитый цитоскелет с моторными белками; основную часть аэробного синтеза АТФ обеспечивают митохондрии, у многих анаэробных линий преобразованные в гидрогеносомы или митосомы (вспомнить семинар 2, [[https://fresll.github.io/bio/seminar-3-route.html#envelope-pore|БИО-3·23]], семинар 5). Бактерии и археи тоже обладают внутренней организацией: у них есть гомологи белков цитоскелета, специализированные мембраны; особенность эукариот — интеграция этих функций в единую архитектуру. Размеры клеток и геномов частично перекрываются и сами по себе не надёжный признак.","FECA (First Eukaryotic Common Ancestor) — раннее реконструируемое состояние стволовой линии эукариот; LECA (Last Eukaryotic Common Ancestor) — последний общий предок всех современных эукариот. Между ними формировались признаки эукариотической клетки. LECA уже был сложной клеткой с ядром, эндомембранами, цитоскелетом и митохондрией, поэтому промежуточные стадии реконструируют по геномам, клеточной биологии и ископаемым, а не ищут среди современных «примитивных» эукариот. Древнейшие несомненные ископаемые эукариоты — одноклеточные, из пород немного старше 1635 млн лет; многоклеточные формы известны уже из пород возрастом около 1635 млн лет. Эти даты задают лишь минимальный возраст эукариогенеза."],"conditions":"","sources":["src_02","src_01","src_32"],"quiz":{"id":"S12-L35","question":"Почему промежуточные стадии эукариогенеза не ищут среди современных эукариот?","options":[{"id":"S12-L35-1","text":"Современные эукариоты не родственны друг другу","correct":false,"feedback":"Они родственны через LECA"},{"id":"S12-L35-2","text":"Все они — потомки LECA — уже сложной клетки","correct":true,"feedback":"Верно: представителей стадий до LECA среди современных эукариот нет"},{"id":"S12-L35-3","text":"Промежуточные стадии уже найдены у бактерий","correct":false,"feedback":"Бактерии — другая первичная линия"}]},"exam_quiz":{"id":"S12-E10","question":"Чем FECA отличается от LECA?","options":[{"id":"S12-E10-1","text":"FECA — начало линии, LECA — общий предок","correct":true,"feedback":"Верно: FECA — раннее состояние стволовой линии эукариот, LECA — последний общий предок всех современных эукариот, уже сложная клетка с митохондрией (БИО-12·35)."},{"id":"S12-E10-2","text":"Это два названия одного и того же предка","correct":false,"feedback":"Разные точки стволовой линии."},{"id":"S12-E10-3","text":"FECA — это современная асгардархея","correct":false,"feedback":"FECA — состояние прошлого, а не современный организм."}]}},{"id":"endosymbiosis","num":36,"section":4,"questions":[4],"title":"Почему митохондрии происходят от бактерии: независимые линии данных","keywords":["Бактерии","Деление (протоклетки)","Эндосимбиоз","Ядро"],"lead":[],"mechanism":[],"paragraphs":["Эндосимбиотическая теория объясняет происхождение митохондрий от бактерии, длительно интегрировавшейся с клеткой-хозяином; предок митохондрии принадлежал к альфа-протеобактериям, хотя точное положение его ближайших современных родственников уточняется. Вывод опирается на согласие нескольких линий данных. Деревья генов: гены митохондриальной ДНК и ядерные гены многих митохондриальных белков ближе всего к генам альфа-протеобактерий. Собственный геном и аппарат экспрессии: митохондрии сохраняют небольшую ДНК (у человека — 16 569 пар нуклеотидов, 13 белков и 24 РНК, нужных для их синтеза), рибосомы и факторы трансляции б
