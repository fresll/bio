х поддерживают многие согласованные компоненты</span></li><li><b>Б.</b> Состав и строение мембранных липидов клетки <i>(неверный вариант)</i><br><span class="expl">Это одно из самых спорных свойств</span></li><li><b>В.</b> Температура среды, в которой он обитал <i>(неверный вариант)</i><br><span class="expl">Экология LUCA реконструируется модельно и неуверенно</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-024-02461-1">Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666</a></li><li><a href="https://doi.org/10.1126/sciadv.aef3128">Mrnjavac N., Hoffmann N. K., Schlikker M. L. et al. Intermediate stages in the origin of metabolism at a phosphorylating hydrothermal vent. Sci. Adv. 2026; 12: eaef3128</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-chemiosmosis"><div class="eyebrow">LUCA и основные клеточные линии · шаг 29 из 46</div><h2>Хемиосмос: механизм и его древность</h2><p class="lead"></p><ol class="mech"></ol><p>Хемиосмос — сопряжение потока ионов через мембрану по электрохимическому градиенту с синтезом АТФ. При дыхании цепь переноса электронов переносит протоны через мембрану и создаёт протондвижущую силу — разность концентраций протонов (разность pH) и электрических потенциалов (вспомнить семинар 5). Протоны возвращаются через АТФ-синтазу и вращают её мембранный ротор; вращение изменяет конформацию каталитических субъединиц, и из АДФ и фосфата образуется АТФ. Если протоны проходят через мембрану в обход синтазы, градиент разряжается и синтез АТФ падает.</p><p>У бактерий и архей есть гомологичные роторные АТФ-синтазы. Широкое распространение хемиосмотического сопряжения поддерживает его древнее происхождение — это сильный сравнительный вывод. Где и как механизм возник — другой вопрос. По одной из гипотез, в щелочных гидротермальных источниках перепад концентраций протонов между щелочной жидкостью и более кислой водой древнего океана возникал на тонких минеральных перегородках. Но природный градиент — лишь источник энергии: механизм, который мог бы сопрягать его с синтезом АТФ, не показан. Это одна из конкурирующих гипотез.</p><div class="static-quiz"><h3>Что поддерживает вывод о древности хемиосмоса?</h3><ol><li><b>А.</b> Щелочные источники существуют и сейчас <i>(неверный вариант)</i><br><span class="expl">Существование среды не показывает, что в ней возник механизм</span></li><li><b>Б.</b> Гомологичные АТФ-синтазы у бактерий и архей <i>(верный вариант)</i><br><span class="expl">Верно: роторные АТФ-синтазы обеих групп гомологичны. Это сравнительно-биологический довод</span></li><li><b>В.</b> АТФ используется всеми клетками как переносчик энергии <i>(неверный вариант)</i><br><span class="expl">Это довод в пользу общего происхождения, но не конкретно хемиосмоса</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1038/s41559-024-02461-1">Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666</a></li><li><a href="https://doi.org/10.1146/annurev-ecolsys-110421-101509">Harrison S. A., Rammu H., Liu F., Halpern A., Nunes Palmeira R., Lane N. Life as a guide to its own origins. Annu. Rev. Ecol. Evol. Syst. 2023; 54: 327–350</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-bacteria-archaea"><div class="eyebrow">LUCA и основные клеточные линии · шаг 30 из 46</div><h2>Бактерии и археи: самое глубокое разделение клеточной жизни</h2><p class="lead"></p><ol class="mech"></ol><p>Наиболее глубокое разделение современной клеточной жизни проходит между бактериями и археями; его впервые выявило сравнение рибосомных РНК. Клетки обеих групп обычно невелики, не имеют оформленного ядра и размножаются делением, но различаются строением мембранных липидов, клеточных оболочек и информационных систем. Аппарат транскрипции и часть белков упаковки ДНК у архей по ряду признаков ближе к эукариотическим, чем к бактериальным. Термин «прокариоты» удобно описывает безъядерную организацию, но не означает единую ветвь, противопоставленную эукариотам. Многие археи живут не в экстремальных условиях, а в почве, океане, донных отложениях и организмах животных.</p><p>Историческая трёхдоменная схема выделяла бактерии, археи и эукариоты как три самостоятельные ветви. Большинство современных филогеномных анализов поддерживает двухдоменную модель: первичные линии — бактерии и археи, а ядерная линия эукариот возникла внутри архей, ближе всего к асгардархеям. Митохондрия при этом — вклад бактерий (тема 4). Различия бактерий и клеток человека лежат в основе избирательного действия многих антибиотиков; сходство бактериальных и митохондриальных рибосом может объяснять часть побочных эффектов отдельных препаратов.</p><div class="static-quiz"><h3>Где на дереве двухдоменной модели находится ядерная линия эукариот?</h3><ol><li><b>А.</b> Внутри бактерий, у альфа-протеобактерий <i>(неверный вариант)</i><br><span class="expl">Альфа-протеобактерии — родственники предка митохондрии, а не ядерной линии</span></li><li><b>Б.</b> Третьей первичной ветвью, отдельно от них <i>(неверный вариант)</i><br><span class="expl">Так изображала трёхдоменная схема; большинство современных филогеномных анализов её не поддерживает</span></li><li><b>В.</b> Внутри архей, ближе всего к асгардархеям <i>(верный вариант)</i><br><span class="expl">Верно</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1038/s41586-025-09960-6">Tobiasson V., Luo J., Wolf Y. I., Koonin E. V. Dominant contribution of Asgard archaea to eukaryogenesis. Nature 2026; 650: 141–149</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-t3-review"><div class="eyebrow">LUCA и основные клеточные линии · шаг 31 из 46</div><h2>Разбор заданий вкладки 3</h2><p class="lead"></p><ol class="mech"></ol><p>На вкладке 3 две разные истории гена дают одинаковые списки линий: «был у LUCA и потерян в линии Б3» и «возник в общем предке архей и эукариот и перенесён от А1 к общему предку Б1 и Б2». Отсюда главное правило: присутствие или отсутствие гена у современных организмов — наблюдение, а было ли оно у предка — вероятностный вывод. В таком небольшом дереве различает истории дерево гена: при вертикальном наследовании гены Б1 и Б2 стоят на бактериальной ветви, при переносе — рядом с геном донора. Но и дерево может ввести в заблуждение, поэтому вывод проверяют несколькими методами; при сотнях геномов сильным свидетельством становится и само распределение гена по дереву видов.</p><p>Обратная задача добавляет третий случай: у одной линии две копии гена в разных местах дерева — собственная, унаследованная вертикально, и перенесённая. Одна клеточная линия может нести гены с разной историей. Задания с хемиосмосом напоминают, что вывод о свойствах LUCA — реконструкция по распространению гомологичных систем, а не наблюдение.</p><div class="static-quiz"><h3>В условном дереве из шести линий ген есть у двух бактериальных линий, у архей и у эукариот. Что можно сказать о гене у LUCA без дерева гена?</h3><ol><li><b>А.</b> Нельзя решить по одному лишь распределению <i>(верный вариант)</i><br><span class="expl">Верно. Распределение совместимо и с наследованием и потерями, и с переносом</span></li><li><b>Б.</b> Ген был у LUCA и сохранился почти у всех <i>(неверный вариант)</i><br><span class="expl">Это одна из совместимых историй, но не единственная</span></li><li><b>В.</b> Гена у LUCA не было: его нет у одной линии <i>(неверный вариант)</i><br><span class="expl">Это тоже лишь одна из возможностей</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a3"><div class="eyebrow">LUCA и основные клеточные линии · шаг 32 из 46</div><h2>Одно распределение — разные истории</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·26, БИО-12·27</p><p>В исследовании 3 ген Т есть у бактерии Б2, у архей А1, А2 и у эукариот, и отсутствует у Б1 и Б3. Три истории дают это распределение: наследование от LUCA с двумя независимыми потерями; возникновение у архей и перенос к Б2; древняя дупликация, после которой Б2 сохранила одну копию, а археи и эукариоты — другую. Свидетельства изменяют уверенность по-разному. Дерево гена отделяет перенос от двух других историй. Данные о гомологии — нашлись ли у линий вторые копии того же семейства — отделяют дупликацию от наследования. Геномное окружение гена — расположение на мобильном генетическом элементе, необычный состав нуклеотидов — независимо поддерживает перенос и понижает уверенность в обеих древних историях, но со временем состав перенесённого гена выравнивается. Независимые признаки, например соседние гены того же пути, сходные с архейными, тоже повышают уверенность в переносе.</p><p>Ни одно свидетельство не является абсолютно достаточным; уверенность растёт, когда несколько независимых свидетельств указывают в одну сторону. И главное: перенос гена к Б2 не делает Б2 археей — история гена не равна истории клеточной линии.</p><div class="static-quiz"><h3>Какая пара историй даёт похожие деревья гена?</h3><ol><li><b>А.</b> Наследование с потерями и перенос <i>(неверный вариант)</i><br><span class="expl">При переносе ген получателя лежит рядом с геном донора — деревья разные</span></li><li><b>Б.</b> Наследование с потерями и древняя дупликация <i>(верный вариант)</i><br><span class="expl">Верно: если разные линии сохранили разные копии древней дупликации, паралоги могут выглядеть как ортологи</span></li><li><b>В.</b> Все три истории дают одинаковые деревья гена <i>(неверный вариант)</i><br><span class="expl">Перенос даёт отличающееся дерево</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a3-results"><div class="eyebrow">LUCA и основные клеточные линии · шаг 33 из 46</div><h2>Новые данные: комплекс, который терялся больше тридцати раз</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·26, БИО-12·27. См. также: БИО-12·32</p><p>Хромосомы эукариот организуют белковые комплексы SMC — белки поддержания структуры хромосом. Когезин удерживает сестринские хроматиды вместе от репликации до анафазы, конденсины уплотняют хромосомы перед делением (вспомнить семинар 6, <a href="https://fresll.github.io/bio/seminar-7-route.html#s-phase-2c4c">БИО-7·26</a>). У большинства прокариот один такой комплекс, у эукариот обычно четыре. Сравнив геномы множества эукариот, исследователи пришли к выводу, что у LECA уже были все четыре комплекса. Один из них, конденсин II, затем утрачивался независимо не менее 30 раз в разных ветвях эукариот. Значит, отсутствие конденсина II у современного организма почти ничего не говорит о его предках: распределение «у одних есть, у других нет» здесь создано в основном потерями.</p><p>Работа показывает и пределы таких выводов. Конденсин II считали отсутствующим у грибов, но его нашли у одного рода грибов; сохранился ли он от предка или получен переносом, однозначного ответа деревья белков не дали. Отсутствие гена в неполностью прочитанном геноме может быть ложным, поэтому утрату комплекса признавали, только если не найдены все его особые субъединицы. Авторы предполагают также, что исходный комплекс удвоился ещё у архейных предков эукариот, — это реконструкция со слабой статистической поддержкой глубоких ветвей.</p><div class="static-quiz"><h3>Почему отсутствие конденсина II у организма — слабый довод о его предках?</h3><ol><li><b>А.</b> Конденсина II никогда не было у эукариот <i>(неверный вариант)</i><br><span class="expl">Он был у LECA и есть у многих современных эукариот</span></li><li><b>Б.</b> Все эукариоты получили его путём переноса <i>(неверный вариант)</i><br><span class="expl">По данным работы, распределение создано в основном потерями</span></li><li><b>В.</b> Комплекс многократно и независимо терялся <i>(верный вариант)</i><br><span class="expl">Верно. К тому же отсутствие гена в неполностью прочитанном геноме может быть ложным</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.celrep.2025.115855">van Hooff J. J. E., Raas M. W. D., Tromer E. C., Eme L. Repeated duplications and losses shaped SMC complex evolution from archaeal ancestors to modern eukaryotes. Cell Rep. 2025; 44: 115855</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-r3"><div class="eyebrow">LUCA и основные клеточные линии · шаг 34 из 46</div><h2>Как датируют LUCA и почему это модель</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·6, БИО-12·25</p><p>Возраст LUCA оценивают молекулярными часами — статистическими моделями, связывающими число замен в последовательностях со временем. Модели допускают разные скорости замен в разных ветвях и привязываются к нескольким узлам дерева с известным минимальным возрастом — по ископаемым остаткам микроорганизмов и изотопным данным (калибровки). В одном из недавних анализов использовали гены, удвоившиеся ещё до LUCA: обе копии есть у современных организмов, и их общее дерево позволяет укоренить и датировать узел LUCA. Центральная оценка — около 4,2 млрд лет, интервал — примерно 4,09–4,33 млрд лет. Та же работа реконструирует LUCA как анаэробный организм прокариотного уровня сложности, с компонентами защиты от вирусов, входивший в сообщество других микроорганизмов.</p><p>Почему это модель. Дата зависит от выбранных генов, калибровок и модели изменения скоростей замен; это количественная гипотеза, а не геологическое измерение. Она не противоречит тому, что одни из древнейших убедительных следов жизни найдены в породах возрастом около 3,48 млрд лет: даты получены разными методами, а ископаемая летопись ранней жизни фрагментарна — древние породы нагревались и деформировались.</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Как устроены митохондриальная энергетика, мембранный потенциал и АТФ-синтаза в клетках человека — <a href="https://fresll.github.io/molbio/seminar-9.html">семинар 9 «Митохондрии как энергетический, сигнальный и генетический узел»</a>.</p><div class="static-quiz"><h3>LUCA оценён в 4,2 млрд лет, а одни из древнейших убедительных следов жизни — 3,48 млрд лет. Противоречие ли это?</h3><ol><li><b>А.</b> Нет: методы разные, летопись неполна <i>(верный вариант)</i><br><span class="expl">Верно. Даты получены разными методами, а ископаемая летопись ранней жизни фрагментарна</span></li><li><b>Б.</b> Да: одна из двух дат неверна <i>(неверный вариант)</i><br><span class="expl">Модельная оценка и минимальный возраст по ископаемым не обязаны совпадать</span></li><li><b>В.</b> Нет: обе даты измерены одним методом <i>(неверный вариант)</i><br><span class="expl">Методы разные: модель молекулярной эволюции и анализ пород</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-024-02461-1">Moody E. R. R., Álvarez-Carretero S., Mahendrarajah T. A. et al. The nature of the last universal common ancestor and its impact on the early Earth system. Nat. Ecol. Evol. 2024; 8: 1654–1666</a></li><li><a href="https://doi.org/10.1038/ncomms15263">Djokic T., Van Kranendonk M. J., Campbell K. A., Walter M. R., Ward C. R. Earliest signs of life on land preserved in ca. 3.5 Ga hot spring deposits. Nat. Commun. 2017; 8: 15263</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-eukaryote"><div class="eyebrow">Эукариогенез и митохондрии · шаг 35 из 46</div><h2>Эукариотическая клетка; FECA и LECA</h2><p class="lead"></p><ol class="mech"></ol><p>Эукариотическую клетку отличает сочетание взаимосвязанных систем: геном заключён в ядре; транспорт организован эндомембранной системой; форму и движение поддерживает развитый цитоскелет с моторными белками; основную часть аэробного синтеза АТФ обеспечивают митохондрии, у многих анаэробных линий преобразованные в гидрогеносомы или митосомы (вспомнить семинар 2, <a href="https://fresll.github.io/bio/seminar-3-route.html#envelope-pore">БИО-3·23</a>, семинар 5). Бактерии и археи тоже обладают внутренней организацией: у них есть гомологи белков цитоскелета, специализированные мембраны; особенность эукариот — интеграция этих функций в единую архитектуру. Размеры клеток и геномов частично перекрываются и сами по себе не надёжный признак.</p><p>FECA (First Eukaryotic Common Ancestor) — раннее реконструируемое состояние стволовой линии эукариот; LECA (Last Eukaryotic Common Ancestor) — последний общий предок всех современных эукариот. Между ними формировались признаки эукариотической клетки. LECA уже был сложной клеткой с ядром, эндомембранами, цитоскелетом и митохондрией, поэтому промежуточные стадии реконструируют по геномам, клеточной биологии и ископаемым, а не ищут среди современных «примитивных» эукариот. Древнейшие несомненные ископаемые эукариоты — одноклеточные, из пород немного старше 1635 млн лет; многоклеточные формы известны уже из пород возрастом около 1635 млн лет. Эти даты задают лишь минимальный возраст эукариогенеза.</p><div class="static-quiz"><h3>Почему промежуточные стадии эукариогенеза не ищут среди современных эукариот?</h3><ol><li><b>А.</b> Современные эукариоты не родственны друг другу <i>(неверный вариант)</i><br><span class="expl">Они родственны через LECA</span></li><li><b>Б.</b> Все они — потомки LECA — уже сложной клетки <i>(верный вариант)</i><br><span class="expl">Верно: представителей стадий до LECA среди современных эукариот нет</span></li><li><b>В.</b> Промежуточные стадии уже найдены у бактерий <i>(неверный вариант)</i><br><span class="expl">Бактерии — другая первичная линия</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-022-01733-y">Mills D. B., Boyle R. A., Daines S. J. et al. Eukaryogenesis and oxygen in Earth history. Nat. Ecol. Evol. 2022; 6: 520–532</a></li><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1126/sciadv.adk3208">Miao L., Yin Z., Knoll A. H., Qu Y., Zhu M. 1.63-billion-year-old multicellular eukaryotes from the Chuanlinggou Formation in North China. Sci. Adv. 2024; 10: eadk3208</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-endosymbiosis"><div class="eyebrow">Эукариогенез и митохондрии · шаг 36 из 46</div><h2>Почему митохондрии происходят от бактерии: независимые линии данных</h2><p class="lead"></p><ol class="mech"></ol><p>Эндосимбиотическая теория объясняет происхождение митохондрий от бактерии, длительно интегрировавшейся с клеткой-хозяином; предок митохондрии принадлежал к альфа-протеобактериям, хотя точное положение его ближайших современных родственников уточняется. Вывод опирается на согласие нескольких линий данных. Деревья генов: гены митохондриальной ДНК и ядерные гены многих митохондриальных белков ближе всего к генам альфа-протеобактерий. Собственный геном и аппарат экспрессии: митохондрии сохраняют небольшую ДНК (у человека — 16 569 пар нуклеотидов, 13 белков и 24 РНК, нужных для их синтеза), рибосомы и факторы трансляции бактериального типа. Мембраны и деление: внутренняя мембрана сохраняет бактериальные свойства, органеллы делятся, но под контролем клетки. Перенос генов и импорт белков: большинство белков митохондрий кодирует ядро. Производные органеллы у анаэробных эукариот: эукариоты, изначально лишённые митохондрий, не найдены.</p><p>Ни двойная мембрана, ни собственная ДНК по отдельности эндосимбиоз не доказывают: две мембраны есть и у ядра, а геном у части производных митохондрий утрачен. Родство с конкретной группой бактерий показывают только деревья генов. Надёжность вывода — в согласии независимых линий.</p><div class="static-quiz"><h3>Какая линия данных указывает, от какой именно группы бактерий произошли митохондрии?</h3><ol><li><b>А.</b> Двойная мембрана органеллы <i>(неверный вариант)</i><br><span class="expl">Две мембраны не называют донора и есть у ядра</span></li><li><b>Б.</b> Собственная кольцевая ДНК органеллы <i>(неверный вариант)</i><br><span class="expl">Наличие ДНК само по себе не указывает группу бактерий</span></li><li><b>В.</b> Деревья митохондриальных генов <i>(верный вариант)</i><br><span class="expl">Верно: остальные линии говорят о бактериальном происхождении вообще</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1038/s41559-022-01733-y">Mills D. B., Boyle R. A., Daines S. J. et al. Eukaryogenesis and oxygen in Earth history. Nat. Ecol. Evol. 2022; 6: 520–532</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-gene-transfer"><div class="eyebrow">Эукариогенез и митохондрии · шаг 37 из 46</div><h2>Перенос генов в ядро и импорт белков</h2><p class="lead"></p><ol class="mech"></ol><p>Эндосимбиотический перенос гена — функциональный перенос гена из генома эндосимбионта или органеллы в ядерный геном. Встраивания фрагмента ДНК органеллы в ядерную ДНК недостаточно: ядерная копия должна экспрессироваться, а если белок работает в органелле, — кодировать сигнал импорта. У многих белков митохондрий это N-концевая последовательность, которая отщепляется после импорта; импорт обеспечивают транслоказы мембран (вспомнить <a href="https://fresll.github.io/bio/seminar-3-route.html#address-principle">БИО-3·26</a>). Пока работают обе копии, утрата органеллярной не нарушает функцию; утрата не мгновенна и не обязательна. Переносы генов из митохондрий в ядро происходили и в недавней эволюции: у многих растений ядерный ген кодирует митохондриальный белок, гомолог которого у близких видов ещё закодирован в митохондриальной ДНК. В линиях, где митохондриальный генетический код отличается от стандартного (вспомнить <a href="https://fresll.github.io/bio/seminar-10-route.html#genetic-code">БИО-10·2</a>), перенесённый ген должен ещё и читаться по стандартному коду. Значительная часть генов предка митохондрии не перенесена, а утрачена.</p><p>Последовательность «встраивание — приобретение промотора и сигнала импорта — две работающие копии — утрата органеллярной копии» — условная модель функциональных этапов, а не универсальная история: у разных генов и в разных линиях порядок этапов может различаться.</p><p>Небольшая часть генов остаётся в митохондриальной ДНК. Обсуждают трудность импорта очень гидрофобных мембранных белков и выгоду регуляции экспрессии прямо в органелле; ни одна гипотеза не объясняет распределение генов во всех линиях. Митохондрии современных эукариот разнообразны: в одних линиях митохондриальная ДНК кодирует десятки белков, в других — несколько; гидрогеносомы и митосомы многих линий генома не имеют. Поэтому митохондрии называют полуавтономными органеллами.</p><div class="static-quiz"><h3>Что нужно, чтобы ядерная копия заменила митохондриальный ген?</h3><ol><li><b>А.</b> Экспрессия копии и её сигнал импорта <i>(верный вариант)</i><br><span class="expl">Верно: ядерная копия должна экспрессироваться, а кодируемый белок — нести сигнал импорта</span></li><li><b>Б.</b> Одно встраивание копии в ядерную ДНК <i>(неверный вариант)</i><br><span class="expl">Без экспрессии и сигнала белок не окажется в митохондрии</span></li><li><b>В.</b> Утрата митохондриальной копии гена <i>(неверный вариант)</i><br><span class="expl">Утрата без работающей ядерной копии нарушит функцию</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1038/s41559-022-01733-y">Mills D. B., Boyle R. A., Daines S. J. et al. Eukaryogenesis and oxygen in Earth history. Nat. Ecol. Evol. 2022; 6: 520–532</a></li><li><a href="https://doi.org/10.1038/s41576-023-00688-5">Keeling P. J. Horizontal gene transfer in eukaryotes: aligning theory with data. Nat. Rev. Genet. 2024; 25: 416–430</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-asgard"><div class="eyebrow">Эукариогенез и митохондрии · шаг 38 из 46</div><h2>Архейный компонент: асгардархеи и химерный геном</h2><p class="lead"></p><ol class="mech"></ol><p>Ядерная линия эукариот возникла внутри архей; наиболее близкие известные группы относятся к асгардархеям (Asgard Archaea), впервые обнаруженным по фрагментам ДНК из донных отложений. Их геномы содержат гомологи эукариотических белков актиновой системы, комплексов ESCRT (эндосомных сортирующих комплексов, необходимых для транспорта), участвующих в изменении формы мембран, и убиквитиноподобной модификации белков. Филогеномные реконструкции указывают на преобладающий вклад асгардархей в большинство консервативных функциональных систем эукариот.</p><p>Но гомолог гена ещё не работающая система. Первая асгардархея, выращенная в лаборатории после многолетних попыток, удваивается раз в две–три недели, образует длинные ветвящиеся выросты мембраны и растёт, разлагая аминокислоты, вместе с микроорганизмами-партнёрами, потребляющими водород, — бактерией и другой археей. У другой, позже выращенной асгардархеи показано, что в теле клетки и в выростах проходят нити из белка — гомолога актина; это наблюдение. Что эти нити формируют и поддерживают выросты, как актин у эукариот, — предположение авторов о функции, прямо оно не проверено. По размерам и сложности обе асгардархеи остаются прокариотами. Это современные родственники клетки-хозяина, а не FECA.</p><p>Геном эукариот химерный: в нём есть гены архейного происхождения (особенно в информационных системах), гены бактериального предка митохондрии (особенно связанные с превращением энергии и сборкой железо-серных кластеров) и гены других бактерий; затем гены терялись, удваивались и включались в общие регуляторные сети. Это тенденция, а не строгое правило: для многих семейств глубокое происхождение определить трудно.</p><div class="static-quiz"><h3>Что показывают гомологи эукариотических белков у асгардархей?</h3><ol><li><b>А.</b> Что у асгардархей есть ядро и эндомембраны <i>(неверный вариант)</i><br><span class="expl">Ядра у асгардархей нет</span></li><li><b>Б.</b> Родство асгардархей и клетки-хозяина эукариот <i>(верный вариант)</i><br><span class="expl">Верно. Гомологи показывают родство, но не наличие у асгардархей работающих эукариотических систем</span></li><li><b>В.</b> Что асгардархеи — предки митохондрий эукариот <i>(неверный вариант)</i><br><span class="expl">Предок митохондрии — бактерия</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-025-09960-6">Tobiasson V., Luo J., Wolf Y. I., Koonin E. V. Dominant contribution of Asgard archaea to eukaryogenesis. Nature 2026; 650: 141–149</a></li><li><a href="https://doi.org/10.1038/s41586-019-1916-6">Imachi H., Nobu M. K., Nakahara N. et al. Isolation of an archaeon at the prokaryote–eukaryote interface. Nature 2020; 577: 519–525</a></li><li><a href="https://doi.org/10.1038/s41586-022-05550-y">Rodrigues-Oliveira T., Wollweber F., Ponce-Toledo R. I. et al. Actin cytoskeleton and complex cell architecture in an Asgard archaeon. Nature 2023; 613: 332–339</a></li><li>Alberts B., Heald R., Johnson A. et al. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022</li><li><a href="https://doi.org/10.1038/s41586-026-10639-9">Bernabeu M., Manzano-Morales S., Marcet-Houben M. et al. Gene ancestries reveal diverse microbial associations during eukaryogenesis. Nature 2026; 656: 399–405</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-scenarios"><div class="eyebrow">Эукариогенез и митохондрии · шаг 39 из 46</div><h2>Конкурирующие сценарии: ядро, эндомембраны, фагоцитоз, митохондрия</h2><p class="lead"></p><ol class="mech"></ol><p>Общепринятая часть большинства современных моделей невелика: клетка-хозяин принадлежала к архейной линии, предок митохондрии был бактерией, их объединение произошло до LECA. Последовательность событий спорна. Водородная и синтрофные гипотезы начинают с метаболического партнёрства археи и бактерии — синтрофии, взаимозависимого обмена метаболитами. Модель «изнутри наружу» выводит цитоплазму и эндомембраны из выростов архейной клетки вокруг бактерий-партнёров; тело археи становится будущим ядром. Модель «сначала фагоцитоз» допускает появление части мембранной и цитоскелетной сложности и активного захвата частиц до приобретения бактерии. Гипотезы ранней и поздней митохондрии различаются положением эндосимбиоза относительно ядра, эндомембран и фагоцитоза.</p><p>Ядерная оболочка состоит из двух мембран, непрерывна с эндоплазматическим ретикулумом и пронизана порами (вспомнить <a href="https://fresll.github.io/bio/seminar-3-route.html#envelope-pore">БИО-3·23</a>); это связывает происхождение ядра с эндомембранной системой, но совместимо с несколькими механизмами. Одна из гипотез связывает преимущество разделения ядра и цитоплазмы с интронами: созревание РНК требует времени и могло конфликтовать с немедленной трансляцией (вспомнить <a href="https://fresll.github.io/bio/seminar-9-route.html#splicing">БИО-9·15</a>). Из неё не следует, что ядро возникло «для защиты» генома. Каждый сценарий должен объяснить контакт партнёров, обмен метаболитами, импорт белков, согласование деления и перестройку мембран.</p><div class="static-quiz"><h3>Что общего у гипотез ранней и поздней митохондрии?</h3><ol><li><b>А.</b> Одинаковый порядок появления ядра и митохондрии <i>(неверный вариант)</i><br><span class="expl">Именно в этом они расходятся</span></li><li><b>Б.</b> Захват бактерии хозяином путём фагоцитоза <i>(неверный вариант)</i><br><span class="expl">Фагоцитоз предполагают не все сценарии</span></li><li><b>В.</b> Архейный хозяин, предок митохондрии из бактерий <i>(верный вариант)</i><br><span class="expl">Верно: спор идёт о порядке событий</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-022-01733-y">Mills D. B., Boyle R. A., Daines S. J. et al. Eukaryogenesis and oxygen in Earth history. Nat. Ecol. Evol. 2022; 6: 520–532</a></li><li><a href="https://doi.org/10.1186/s12915-014-0076-2">Baum D. A., Baum B. An inside-out origin for the eukaryotic cell. BMC Biol. 2014; 12: 76</a></li><li><a href="https://doi.org/10.1038/s41586-025-09808-z">Kay C. J., Spang A., Szöllősi G. J., Pisani D., Williams T. A., Donoghue P. C. J. Dated gene duplications elucidate the evolutionary assembly of eukaryotes. Nature 2026; 650: 129–140</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-t4-review"><div class="eyebrow">Эукариогенез и митохондрии · шаг 40 из 46</div><h2>Разбор заданий вкладки 4</h2><p class="lead"></p><ol class="mech"></ol><p>Панель «Линии данных» показывает разницу между принципом и деталями: бактериальное происхождение митохондрий поддерживают несколько независимых линий, родство с альфа-протеобактериями — только деревья генов, а о порядке появления ядра и митохондрии эти данные не говорят ничего. Выключив деревья генов, легко увидеть, что бактериальное происхождение остаётся поддержанным, а конкретный донор — нет.</p><p>Конструктор переноса гена показывает два условия замены органеллярного гена ядерным — экспрессию и сигнал импорта — и типичную обратную задачу: если белка в митохондрии нет, причиной может быть любое из двух нарушений; различает их наблюдение, есть ли белок в цитозоле. Карточка с асгардархеей напоминает: современный организм — родственник клетки-хозяина, а не предок и не FECA; FECA и LECA — состояния прошлого.</p><div class="static-quiz"><h3>Белка М в митохондрии нет, ядерная копия гена есть, органеллярная утрачена, в цитозоле белок М найден. Какая причина вероятна?</h3><ol><li><b>А.</b> Ядерный белок не несёт сигнала импорта <i>(верный вариант)</i><br><span class="expl">Верно: белок синтезируется, но не импортируется</span></li><li><b>Б.</b> Ядерная копия гена не экспрессируется <i>(неверный вариант)</i><br><span class="expl">Тогда белка не было бы и в цитозоле</span></li><li><b>В.</b> Нарушен импорт всех белков в митохондрию <i>(неверный вариант)</i><br><span class="expl">Тогда пострадали бы и другие функции; по условию импорт работает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a4"><div class="eyebrow">Эукариогенез и митохондрии · шаг 41 из 46</div><h2>Как независимые свидетельства меняют уверенность</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·36, БИО-12·38, БИО-12·39</p><p>Исследование 4 сопоставляет восемь групп свидетельств и шесть утверждений. Родство митохондриальных генов с альфа-протеобактериями и бактериальный тип митохондриального аппарата синтеза белка вместе убедительно поддерживают эндосимбиотическое происхождение митохондрий. Гомология информационных систем эукариот и архей и гены асгардархей вместе поддерживают архейного хозяина. Наличие митохондрий или их производных у всех изученных эукариот поддерживает присутствие митохондрии у LECA. Сходство эндомембран у всех эукариот говорит, что они были у LECA, но не о порядке их появления.</p><p>Утверждения о порядке событий — «ядро и эндомембраны появились до митохондрии» или «митохондрия была первой» — получают лишь слабую поддержку, пока в модель не включены датировки дупликаций генов (БИО-12·42). Даже тогда вывод зависит от допущений метода. Обратная задача: две гипотезы различили бы согласованные датировки разными методами, обнаружение современных архей с внутренними мембранами или способностью к захвату частиц, согласованная реконструкция набора генов ранних ветвей. Если таких данных недостаточно, правильный ответ — «порядок событий остаётся предметом обсуждения».</p><div class="static-quiz"><h3>Почему убедительность вывода об эндосимбиозе не переносится на порядок событий эукариогенеза?</h3><ol><li><b>А.</b> Потому что сам эндосимбиоз не доказан <i>(неверный вариант)</i><br><span class="expl">Эндосимбиоз поддержан независимыми линиями данных</span></li><li><b>Б.</b> Данные говорят об участниках, а не о порядке <i>(верный вариант)</i><br><span class="expl">Верно. Свидетельства об эндосимбиозе говорят о происхождении участников, но не о последовательности событий</span></li><li><b>В.</b> Потому что порядок событий уже известен точно <i>(неверный вариант)</i><br><span class="expl">Порядок остаётся предметом обсуждения</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-a4-results"><div class="eyebrow">Эукариогенез и митохондрии · шаг 42 из 46</div><h2>Новые данные: датированные дупликации генов</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·35, БИО-12·39. См. также: БИО-12·34, БИО-12·41</p><p>Многие гены, необходимые ядру, цитоскелету и мембранному транспорту, у эукариот образуют семейства родственных копий, возникших при дупликациях до LECA. Если оценить время дупликаций, можно оценить, когда появились связанные с ними функции. Исследователи сделали это с помощью молекулярных часов. По их оценке, линия хозяина отделилась от ближайших родственников среди асгардархей около 3,05–2,79 млрд лет назад, линия предка митохондрии от альфа-протеобактерий — около 2,37–2,13 млрд лет назад, LECA существовал около 1,80–1,67 млрд лет назад; стволовая линия эукариот существовала, таким образом, более миллиарда лет. Дупликации генов цитоскелета, мембранного транспорта, эндомембран, фагоцитоза и ядра в основном пришлись на интервал 3,0–2,25 млрд лет назад — до митохондриального эндосимбиоза. Авторы делают вывод в пользу сложного архейного хозяина и поздней митохондрии и считают, что гипотезы ранней митохондрии можно отвергнуть.</p><p>Как к этому относиться. Это сильный новый довод, полученный на многих семействах генов. Но все даты — модельные оценки, зависящие от выбора генов, калибровок и модели скоростей замен; разные анализы давали для LECA оценки примерно от 1,9 до 0,95 млрд лет назад. Время дупликации гена не равно времени, когда связанная с ним функция начала работать в клетке. Поэтому в практикуме степень поддержки этого вывода — «поддержано, но зависит от допущений».</p><div class="static-quiz"><h3>Почему датировки дупликаций — не окончательное доказательство порядка событий?</h3><ol><li><b>А.</b> Дупликации генов у эукариот не происходят <i>(неверный вариант)</i><br><span class="expl">Дупликации — частое событие эволюции генов</span></li><li><b>Б.</b> Эукариоты моложе одного миллиарда лет <i>(неверный вариант)</i><br><span class="expl">Ископаемые эукариоты старше 1,6 млрд лет</span></li><li><b>В.</b> Даты — модельные оценки с допущениями <i>(верный вариант)</i><br><span class="expl">Верно. Они зависят от калибровок и допущений, а время дупликации гена не равно времени появления функции</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-025-09808-z">Kay C. J., Spang A., Szöllősi G. J., Pisani D., Williams T. A., Donoghue P. C. J. Dated gene duplications elucidate the evolutionary assembly of eukaryotes. Nature 2026; 650: 129–140</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-r4"><div class="eyebrow">Эукариогенез и митохондрии · шаг 43 из 46</div><h2>Не только две клетки: другие бактериальные доноры</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·38</p><p>Архейный хозяин и бактериальный предок митохондрии — общепризнанные участники эукариогенеза. Но в геноме LECA есть и гены, родственные генам других бактерий. Одна из недавних реконструкций происхождения генных семейств LECA обнаружила несколько волн переноса генов от разных бактериальных групп — помимо альфа-протеобактерий, прежде всего от миксококков и планктомицетов; часть переносов, по оценке авторов, могла предшествовать митохондриальному эндосимбиозу. Небольшая доля семейств — около 4,5 % — имеет на деревьях ближайших родственников среди вирусов, так что возможен и перенос генов при участии вирусов. Другая группа исследователей тоже находит вклад многих бактериальных групп, но считает его разрозненными переносами без признаков дополнительного эндосимбиоза. Расхождение показывает, насколько выводы зависят от выборки геномов и методов. Обзоры добавляют ещё одну тонкость: у эукариот, по сути, две стволовые линии со своими начальными точками: линия хозяина (архейный FECA) и линия будущей митохондрии (митохондриальный FECA).</p><h3>Дальше в курсе «Молекулярная биология»</h3><p>Митохондриальный геном, импорт белков в митохондрии и контроль их качества в клетках человека — <a href="https://fresll.github.io/molbio/seminar-9.html">семинар 9 «Митохондрии как энергетический, сигнальный и генетический узел»</a> и <a href="https://fresll.github.io/molbio/seminar-12.html">семинар 12 «Селективная аутофагия и контроль качества органелл»</a>.</p><div class="static-quiz"><h3>Две группы по-разному объясняют бактериальные гены LECA, не связанные с митохондрией. Что из этого следует?</h3><ol><li><b>А.</b> Вопрос пока остаётся открытым <i>(верный вариант)</i><br><span class="expl">Верно: вывод зависит от выборки геномов и методов</span></li><li><b>Б.</b> Одна из групп точно ошиблась <i>(неверный вариант)</i><br><span class="expl">Расхождение ещё не указывает, кто прав</span></li><li><b>В.</b> Других бактериальных генов нет <i>(неверный вариант)</i><br><span class="expl">Обе группы их находят; спор — об их происхождении</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-026-10639-9">Bernabeu M., Manzano-Morales S., Marcet-Houben M. et al. Gene ancestries reveal diverse microbial associations during eukaryogenesis. Nature 2026; 656: 399–405</a></li><li><a href="https://doi.org/10.1038/s41586-025-09960-6">Tobiasson V., Luo J., Wolf Y. I., Koonin E. V. Dominant contribution of Asgard archaea to eukaryogenesis. Nature 2026; 650: 141–149</a></li><li><a href="https://doi.org/10.1038/s41559-022-01733-y">Mills D. B., Boyle R. A., Daines S. J. et al. Eukaryogenesis and oxygen in Earth history. Nat. Ecol. Evol. 2022; 6: 520–532</a></li></ul><p></p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог семестра · шаг 44 из 46</div><h2>Минимальная клеточная система: итоговая задача семестра</h2><p class="lead"></p><ol class="mech"></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-12·2, БИО-12·5, БИО-12·20; вспомнить семинары 1–11</p><p>Итоговая задача собирает механизмы семестра в одну карту из девяти функциональных блоков: мембранная граница; транспорт и обмен; доступность энергетических ресурсов; каталитические реакции; наследственная информация; воспроизведение информационных молекул; производство функциональных компонентов; воспроизводство системы; наследуемая изменчивость. Студент выбирает три–четыре связанных блока. Для трёх предложенных наборов вопросов пять: какие функциональные зависимости между ними существуют; какие функции необходимы в заданных условиях; какие условия недостаточны для конкретного результата; какие изменения системы нарушат наследуемое воспроизводство; какие данные позволят проверить объяснение. Для собственного связного набора — три общих вопроса: о зависимостях, о недостающем условии и о нарушениях.</p><p>Главная граница: карта показывает зависимости в работе современной системы, а не порядок, в котором компоненты возникали. Рассуждение завершается цепью «наблюдение → допустимый вывод → альтернативная гипотеза → различающее свидетельство». Полная задача — в практикуме (итоговая задача).</p><div class="static-quiz"><h3>Стрелка на карте «наследственная информация → производство функциональных компонентов» означает…</h3><ol><li><b>А.</b> …что информация возникла раньше белков <i>(неверный вариант)</i><br><span class="expl">Карта не показывает исторический порядок</span></li><li><b>Б.</b> …что синтез белков зависит от информации <i>(верный вариант)</i><br><span class="expl">Верно: в работающей клетке синтез белков зависит от наследственной информации. Это функциональная зависимость</span></li><li><b>В.</b> …что белки не влияют на хранение информации <i>(неверный вариант)</i><br><span class="expl">Ферменты копируют и репарируют ДНК — зависимость взаимная</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-next"><div class="eyebrow">Итог семестра · шаг 45 из 46</div><h2>Что дальше: второй семестр и старшие курсы</h2><p class="lead"></p><ol class="mech"></ol><p>Этот семинар завершает первый семестр. Во втором семестре курс переходит к механизмам эволюции: популяционной генетике — как изменяются частоты наследуемых вариантов в популяциях; механизмам микроэволюции — отбору, дрейфу, потоку генов; молекулярной эволюции генов и геномов; методам построения филогенетических деревьев и молекулярным часам; эволюции организмов и человека. Здесь эти темы затронуты только там, где без них нельзя понять происхождение клетки.</p><p>На старших курсах эволюционные принципы понадобятся в молекулярной биологии (происхождение генных семейств, митохондрий и систем контроля качества), в клинической биоинформатике (сравнение последовательностей и оценка гомологии вариантов) и в геномной медицине (митохондриальное наследование, перенос генов устойчивости у бактерий). Эти связи — добровольное продолжение, а не задание первого курса.</p><div class="static-quiz"><h3>Какая тема из этого семинара будет подробно изучаться во втором семестре?</h3><ol><li><b>А.</b> Строение и проницаемость плазматической мембраны <i>(неверный вариант)</i><br><span class="expl">Это тема первого семестра</span></li><li><b>Б.</b> Синтез белка на рибосоме и генетический код <i>(неверный вариант)</i><br><span class="expl">Это тема первого семестра</span></li><li><b>В.</b> Филогенетические деревья и молекулярные часы <i>(верный вариант)</i><br><span class="expl">Верно: методы их построения подробно разбирают во втором семестре</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог семестра · шаг 46 из 46</div><h2>Где эта тема в курсе</h2><p class="lead"></p><ol class="mech"></ol><p>Назад. Семинар 1 — мембрана и граница: бислой, проницаемость, градиенты (темы 1–2). Семинар 2 — цитоскелет: гомологи актина и тубулина у прокариот и асгардархей (тема 4). <a href="https://fresll.github.io/bio/seminar-3-route.html">Семинар 3</a> и семинар 4 — адресация белков и путь секретируемого белка: сигналы импорта и транслоказы, эндомембраны (тема 4). <a href="https://fresll.github.io/bio/seminar-5-route.html">Семинар 5</a> — энергетика: протонный градиент и АТФ-синтаза (тема 3). Семинар 6 — цикл и деление (деление протоклеток и органелл). <a href="https://fresll.github.io/bio/seminar-7-route.html">Семинары 7</a>–<a href="https://fresll.github.io/bio/seminar-8-route.html">8</a> — копирование ДНК, точность и мутации (порог ошибок, изменчивость). <a href="https://fresll.github.io/bio/seminar-9-route.html">Семинары 9</a>–<a href="https://fresll.github.io/bio/seminar-10-route.html">10</a> — транскрипция, процессинг и трансляция: рибосома как рибозим, генетический код, интроны и ядро (темы 2, 4). <a href="https://fresll.github.io/bio/seminar-11-route.html">Семинар 11</a> — регуляция экспрессии: малые РНК и архейное происхождение белков Argonaute (тема 4).</p><p>Вперёд. Второй семестр — механизмы эволюции (БИО-12·45). Курс «Молекулярная биология»: семинары 7–9 (ресурсы, метаболические потоки, митохондрии), 11–12 (контроль качества белков и органелл).</p><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S12-T01"><dt>Абиогенный синтез</dt><dd>Образование органических соединений без участия живых организмов.</dd></div><div id="ns-g-S12-T02"><dt>Автокаталитическая сеть</dt><dd>Набор химических реакций, продукты которого прямо или косвенно ускоряют образование компонентов той же сети.</dd></div><div id="ns-g-S12-T03"><dt>Автономная живая система</dt><dd>Система, которая сама обеспечивает себя превращениями вещества и энергии, строит собственный аппарат воспроизводства и воспроизводится, сохраняя наследуемые различия.</dd></div><div id="ns-g-S12-T04"><dt>Активация мономера</dt><dd>Перевод мономера в реакционноспособное состояние, облегчающее образование связи с другим мономером.</dd></div><div id="ns-g-S12-T05"><dt>Активированный нуклеотид</dt><dd>Нуклеотид, содержащий реакционноспособную группу (например, фосфат, замкнутый в кольцо на рибозе, или фосфат, связанный с уходящей группой), за счёт которой нуклеотид присоединяется к цепи без внешнего источника энергии.</dd></div><div id="ns-g-S12-T06"><dt>Альфа-протеобактерии</dt><dd>Группа бактерий, к которой принадлежал предок митохондрий.</dd></div><div id="ns-g-S12-T07"><dt>Амфифил</dt><dd>Молекула, содержащая гидрофильную и гидрофобную части; в воде амфифилы самопроизвольно образуют мицеллы, бислои и везикулы.</dd></div><div id="ns-g-S12-T08"><dt>Археи</dt><dd>Одна из двух первичных линий клеточной жизни; безъядерные клетки, отличающиеся от бактерий строением мембранных липидов, оболочек и информационных систем.</dd></div><div id="ns-g-S12-T09"><dt>Асгардархеи (Asgard Archaea)</dt><dd>Группа архей, наиболее близкая к ядерной линии эукариот; в их геномах есть гомологи многих эукариотических белков.</dd></div><div id="ns-g-S12-T10"><dt>АТФ (аденозинтрифосфат)</dt><dd>Нуклеотид, энергия гидролиза которого используется во многих процессах клетки.</dd></div><div id="ns-g-S12-T11"><dt>АДФ (аденозиндифосфат)</dt><dd>Продукт гидролиза АТФ и субстрат его синтеза.</dd></div><div id="ns-g-S12-T12"><dt>АТФ-синтаза</dt><dd>Мембранный ферментный комплекс: протоны, проходящие по градиенту через его ротор, вращают его, и каталитическая часть синтезирует АТФ из АДФ и фосфата.</dd></div><div id="ns-g-S12-T13"><dt>Бактерии</dt><dd>Одна из двух первичных линий клеточной жизни; безъядерные клетки, отличающиеся от архей строением мембранных липидов, оболочек и информационных систем.</dd></div><div id="ns-g-S12-T14"><dt>Вариант</dt><dd>Одна из различающихся форм воспроизводящейся системы или молекулы в популяции.</dd></div><div id="ns-g-S12-T15"><dt>Везикула</dt><dd>Замкнутый пузырёк, ограниченный бислоем амфифилов и содержащий внутри водную среду.</dd></div><div id="ns-g-S12-T16"><dt>Вертикальное наследование</dt><dd>Передача генов от родительской клетки или организма потомкам.</dd></div><div id="ns-g-S12-T17"><dt>Вироид</dt><dd>Короткая кольцевая молекула РНК, заражающая растения; собственных белков не кодирует и копируется ферментами клетки хозяина.</dd></div><div id="ns-g-S12-T18"><dt>Воспроизводство</dt><dd>Образование системой подобных себе систем.</dd></div><div id="ns-g-S12-T19"><dt>Гидрогеносома</dt><dd>Органелла, производная митохондрии, участвующая в анаэробном энергетическом обмене и обычно образующая водород.</dd></div><div id="ns-g-S12-T20"><dt>Гомология</dt><dd>Сходство, обусловленное общим происхождением; гомологичные гены происходят от общего предкового гена.</dd></div><div id="ns-g-S12-T21"><dt>Горизонтальный перенос генов</dt><dd>Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями.</dd></div><div id="ns-g-S12-T22"><dt>Граница (системы)</dt><dd>Структура, отделяющая систему от среды и удерживающая её компоненты; у клеток — плазматическая мембрана.</dd></div><div id="ns-g-S12-T23"><dt>Деление (протоклетки)</dt><dd>Разделение компартмента на дочерние с распределением содержимого между ними.</dd></div><div id="ns-g-S12-T24"><dt>Дерево гена</dt><dd>Схема родства последовательностей одного гена у разных организмов; может не совпадать с деревом клеточных линий.</dd></div><div id="ns-g-S12-T25"><dt>Дерево клеточных линий</dt><dd>Схема преемственности клеточного воспроизводства, построенная по многим генам.</dd></div><div id="ns-g-S12-T26"><dt>Дифференциальное воспроизводство</dt><dd>Различие вариантов по ожидаемому числу потомков.</dd></div><div id="ns-g-S12-T27"><dt>Дупликация гена</dt><dd>Возникновение второй копии гена в геноме.</dd></div><div id="ns-g-S12-T28"><dt>Естественный отбор</dt><dd>Изменение наследственного состава популяции, при котором варианты, оставляющие в данной среде больше потомков, увеличивают свою долю; требует изменчивости, наследственности и дифференциального воспроизводства.</dd></div><div id="ns-g-S12-T29"><dt>Жирная кислота</dt><dd>Карбоновая кислота с длинной углеводородной цепью; в моделях протоклеток образует бислойные везикулы.</dd></div><div id="ns-g-S12-T30"><dt>Изменчивость</dt><dd>Существование различающихся вариантов в популяции.</dd></div><div id="ns-g-S12-T31"><dt>Калибровка</dt><dd>Привязка узла дерева к возрасту, известному по ископаемым остаткам или изотопным данным; используется в молекулярных часах.</dd></div><div id="ns-g-S12-T32"><dt>Компартмент</dt><dd>Ограниченное пространство, удерживающее взаимодействующие молекулы рядом: минеральная пора, капля или мембранная везикула.</dd></div><div id="ns-g-S12-T33"><dt>Комплексы SMC</dt><dd>Белковые комплексы поддержания структуры хромосом (когезин, конденсины, SMC5/6), организующие ДНК с затратой АТФ.</dd></div><div id="ns-g-S12-T34"><dt>Концентрирование</dt><dd>Повышение местного содержания вещества (высыхание, замерзание, адсорбция, удержание в порах и везикулах).</dd></div><div id="ns-g-S12-T35"><dt>Линии, не оставившие потомков</dt><dd>Эволюционные линии, существовавшие в прошлом и угасшие; на дереве современных организмов они не отражаются.</dd></div><div id="ns-g-S12-T36"><dt>Липидный бислой</dt><dd>Двойной слой амфифильных молекул, гидрофобные части которых обращены друг к другу; основа клеточных мембран.</dd></div><div id="ns-g-S12-T37"><dt>Липосома</dt><dd>Искусственная везикула, ограниченная бислоем фосфолипидов.</dd></div><div id="ns-g-S12-T38"><dt>LECA (Last Eukaryotic Common Ancestor)</dt><dd>Последний общий предок всех современных эукариот.</dd></div><div id="ns-g-S12-T39"><dt>LUCA (Last Universal Common Ancestor)</dt><dd>Последний универсальный общий предок всех современных клеточных линий; узел дерева, предковая популяция и реконструируемый набор свойств.</dd></div><div id="ns-g-S12-T40"><dt>Матрица (РНК-матрица)</dt><dd>Цепь нуклеиновой кислоты, по которой по принципу комплементарности строится новая цепь. Подробнее — семинар 7.</dd></div><div id="ns-g-S12-T41"><dt>Митосома</dt><dd>Сильно редуцированная органелла, производная митохондрии; не синтезирует АТФ, у многих линий участвует в сборке железо-серных кластеров.</dd></div><div id="ns-g-S12-T42"><dt>Митохондриальная ДНК (мтДНК)</dt><dd>Собственная ДНК митохондрий; у человека кодирует 13 белков и 24 РНК.</dd></div><div id="ns-g-S12-T43"><dt>Митохондрия</dt><dd>Органелла эукариотической клетки с двумя мембранами и собственной ДНК, в которой происходят окисление субстратов и синтез АТФ.</dd></div><div id="ns-g-S12-T44"><dt>Мицелла</dt><dd>Шарообразное скопление амфифилов, гидрофобные части которых обращены внутрь.</dd></div><div id="ns-g-S12-T45"><dt>Мобильный генетический элемент</dt><dd>Участок ДНК, способный перемещаться в геноме или между клетками (плазмида, транспозон, геном бактериофага).</dd></div><div id="ns-g-S12-T46"><dt>Молекулярные часы</dt><dd>Статистическая модель, связывающая число замен в последовательностях со временем, прошедшим от общего предка.</dd></div><div id="ns-g-S12-T47"><dt>Наблюдение (статус утверждения)</dt><dd>Утверждение, установленное непосредственно: измерено, увидено или получено в эксперименте.</dd></div><div id="ns-g-S12-T48"><dt>Накопление</dt><dd>Рост количества вещества, когда его образование и поступление превышают разрушение и вынос.</dd></div><div id="ns-g-S12-T49"><dt>Направленная эволюция</dt><dd>Лабораторный метод: многократный отбор из смеси вариантов молекул тех, что выполняют нужную функцию, их размножение и внесение новых изменений.</dd></div><div id="ns-g-S12-T50"><dt>Наследственность</dt><dd>Передача различий между системами следующему циклу воспроизводства.</dd></div><div id="ns-g-S12-T51"><dt>Не следует из данных (статус утверждения)</dt><dd>Вывод, который имеющиеся данные не обосновывают: данных недостаточно, или вывод подменяет одно утверждение другим.</dd></div><div id="ns-g-S12-T52"><dt>Обмен веществ</dt><dd>Совокупность превращений вещества и энергии в системе, включая синтез и распад.</dd></div><div id="ns-g-S12-T53"><dt>Образование (вещества)</dt><dd>Появление вещества в реакции или его поступление извне.</dd></div><div id="ns-g-S12-T54"><dt>Ортологи</dt><dd>Гомологичные гены разных линий, разошедшиеся при разделении линий.</dd></div><div id="ns-g-S12-T55"><dt>Паразитическая РНК</dt><dd>В моделях — молекула РНК, которую копирует общий катализатор, но которая сама не выполняет полезной для системы функции.</dd></div><div id="ns-g-S12-T56"><dt>Паралоги</dt><dd>Гомологичные гены, возникшие при дупликации в одной линии.</dd></div><div id="ns-g-S12-T57"><dt>Поддержание внутренней среды</dt><dd>Сохранение системой внутреннего состава, отличающегося от состава среды.</dd></div><div id="ns-g-S12-T58"><dt>Показанная возможность (статус утверждения)</dt><dd>Утверждение о том, что процесс может идти без участия живых систем, если он воспроизведён в эксперименте при заданных условиях.</dd></div><div id="ns-g-S12-T59"><dt>Полимеризация</dt><dd>Соединение мономеров в цепь.</dd></div><div id="ns-g-S12-T60"><dt>Порог ошибок</dt><dd>Область значений точности копирования и длины последовательности, за которой полезная последовательность перестаёт устойчиво поддерживаться отбором; положение порога зависит от параметров системы.</dd></div><div id="ns-g-S12-T61"><dt>Потеря гена</dt><dd>Исчезновение гена в эволюционной линии; после потери ген отсутствует у всех потомков этой линии.</dd></div><div id="ns-g-S12-T62"><dt>Промотор</dt><dd>Участок ДНК у начала гена, на котором собираются общие факторы транскрипции и РНК-полимераза; задаёт точку начала и направление транскрипции. Подробнее — семинар 9.</dd></div><div id="ns-g-S12-T63"><dt>Протоклетка</dt><dd>Предполагаемый компартмент, в котором граница связана с внутренними реакциями и воспроизведением.</dd></div><div id="ns-g-S12-T64"><dt>Протондвижущая сила</dt><dd>Электрохимическая разность потенциалов протонов на мембране.</dd></div><div id="ns-g-S12-T65"><dt>Протонный насос</dt><dd>Мембранный белковый комплекс, переносящий протоны против градиента.</dd></div><div id="ns-g-S12-T66"><dt>Разобщитель</dt><dd>Вещество, переносящее протоны через мембрану в обход АТФ-синтазы и разряжающее протонный градиент.</dd></div><div id="ns-g-S12-T67"><dt>Реконструкция (статус утверждения)</dt><dd>Утверждение о прошлом (историческая гипотеза или модель), выведенное из наблюдений с помощью допущений.</dd></div><div id="ns-g-S12-T68"><dt>Репликатор</dt><dd>Наследуемая информационная структура, копии которой образуются в репликативной системе.</dd></div><div id="ns-g-S12-T69"><dt>Рибозим</dt><dd>Молекула РНК, обладающая каталитической активностью.</dd></div><div id="ns-g-S12-T70"><dt>Рибозим-полимераза</dt><dd>Рибозим, полученный направленной эволюцией, который удлиняет цепь РНК по матрице.</dd></div><div id="ns-g-S12-T71"><dt>Рибосома</dt><dd>Комплекс рРНК и белков, синтезирующий белок по мРНК; состоит из малой и большой субчастиц. Подробнее — семинар 10.</dd></div><div id="ns-g-S12-T72"><dt>Связь функции с ростом (в протоклетке)</dt><dd>Зависимость роста и деления компартмента от функции молекулы внутри него; условие отбора протоклеток.</dd></div><div id="ns-g-S12-T73"><dt>Сигнал импорта</dt><dd>Участок белка (у многих белков митохондрий — N-концевая последовательность), по которому белок узнают транслоказы органеллы. Подробнее — семинар 3.</dd></div><div id="ns-g-S12-T74"><dt>Синтрофия</dt><dd>Взаимозависимый обмен метаболитами, при котором совместная деятельность партнёров делает реакции энергетически возможными или более выгодными.</dd></div><div id="ns-g-S12-T75"><dt>Сохранение (вещества)</dt><dd>Существование вещества без разрушения до следующего звена превращений.</dd></div><div id="ns-g-S12-T76"><dt>Степень поддержки (вывода)</dt><dd>Оценка силы совокупности свидетельств в пользу утверждения: от «данных в поддержку нет» до «убедительно поддержано».</dd></div><div id="ns-g-S12-T77"><dt>Транслоказа внешней мембраны</dt><dd>Белковый комплекс внешней мембраны митохондрии, через который импортируются белки. Подробнее — семинар 3.</dd></div><div id="ns-g-S12-T78"><dt>Фагоцитоз</dt><dd>Захват крупных частиц клеткой с перестройкой мембраны и актинового цитоскелета.</dd></div><div id="ns-g-S12-T79"><dt>Фн</dt><dd>Неорганический фосфат.</dd></div><div id="ns-g-S12-T80"><dt>FECA (First Eukaryotic Common Ancestor)</dt><dd>Раннее реконструируемое состояние стволовой линии эукариот.</dd></div><div id="ns-g-S12-T81"><dt>Хемиосмос</dt><dd>Сопряжение потока ионов через мембрану по электрохимическому градиенту с синтезом АТФ.</dd></div><div id="ns-g-S12-T82"><dt>Химерный геном</dt><dd>Геном, сформированный из генов разного происхождения; у эукариот — архейного, бактериального и неясного.</dd></div><div id="ns-g-S12-T83"><dt>Химическое обогащение</dt><dd>Изменение состава смеси за счёт разной скорости образования или разной устойчивости веществ, без передачи различий следующим циклам.</dd></div><div id="ns-g-S12-T84"><dt>Цепь переноса электронов</dt><dd>Набор белковых комплексов мембраны, которые передают электроны от доноров к конечному акцептору и за счёт этого переносят протоны через мембрану.</dd></div><div id="ns-g-S12-T85"><dt>Эндосимбиоз</dt><dd>Длительное сожительство организма внутри клетки другого организма.</dd></div><div id="ns-g-S12-T86"><dt>Эндосимбиотический перенос гена</dt><dd>Функциональный перенос гена из генома эндосимбионта или органеллы в ядерный геном.</dd></div><div id="ns-g-S12-T87"><dt>Эукариогенез</dt><dd>Исторический процесс формирования эукариотической клеточной организации от FECA до LECA.</dd></div><div id="ns-g-S12-T88"><dt>Ядро</dt><dd>Отделённый ядерной оболочкой компартмент эукариотической клетки, в котором находятся хромосомы и идут репликация и транскрипция. Подробнее — семинар 3.</dd></div><div id="ns-g-S12-T89"><dt>Ядерная оболочка</dt><dd>Две мембраны вокруг ядра; наружная продолжается в мембрану эндоплазматического ретикулума; обе прерываются ядерными порами. Подробнее — семинар 3.</dd></div><div id="ns-g-S12-T90"><dt>Ядерная пора</dt><dd>Отверстие в ядерной оболочке, занятое белковым комплексом, через который вещества избирательно проходят между ядром и цитоплазмой. Подробнее — семинар 3.</dd></div><div id="ns-g-S12-T91"><dt>Эндомембранная система</dt><dd>Внутренние мембраны эукариотической клетки — ядерная оболочка, эндоплазматический ретикулум, аппарат Гольджи, эндосомы и лизосомы, — связанные потоками мембранных пузырьков. Подробнее — семинар 3.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 12 · Как появилась клетка: данные и модели · Объяснения","home_eyebrow":"Семинар 12 · самостоятельная подготовка · Объяснения","home_h1":"Как появилась клетка: данные и модели\nПроисхождение клетки","home_lead":"Предыдущие одиннадцать семинаров разбирали, как устроена и работает клетка: мембраны и транспорт, адресация белков, энергетика, деление, копирование и реализация наследственной информации. Здесь вопрос другой: каким образом система химических процессов могла приобрести свойства, необходимые для наследуемого воспроизводства и биологической эволюции? События, о которых идёт речь, нельзя наблюдать, поэтому на каждом шаге различаются четыре вида утверждений: наблюдение, показанная в эксперименте возможность, реконструкция и выводы, которые из данных не следуют. Страница разделена на четыре темы в порядке вкладок практикума. В каждой теме сначала идут базовые шаги — они нужны для коллоквиума и зачёта, — затем разбор заданий практикума, продвинутое исследование и добровольные научные дополнения с пометкой «сверх программы». В конце — итоговая задача семестра и связь со вторым семестром","start":"Начать с введения →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; самопроверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"Восемь сценариев (по одному на каждую вкладку на базовом и продвинутом уровне) и итоговая задача семестра: предсказание, наблюдение на схеме и разбор каждого ответа. Пройдите их после объяснений темы.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 1.2.1, 16 ноября 2026 г. · Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры","footer_lesson":"Версия 1.2.1, 16 ноября 2026 г. · Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры","step_of":"шаг {i} из {n}","jump_label":"Перейти к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Понимание проверено","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"понимание проверено","notdone":"не просмотрен","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения терминов, которые встречаются на схемах и в шагах. Термины прошлых семинаров даны кратко, с указанием опубликованного семинара, где они разобраны подробнее.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Двенадцать вопросов базового уровня, по три на каждую тему. После ответа откройте разбор. Если механизм о быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →","base_prep":"Базовая подготовка","back_base":"← Вернуться к базовому шагу","viewed_label":"Просмотрено шагов","viewed":"просмотрен"},"lessons":[{"id":"four-statuses","num":1,"section":0,"questions":[1,2,3,4],"title":"Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных","keywords":["Образование (вещества)","Реконструкция (статус утверждения)"],"lead":[],"mechanism":[],"paragraphs":["Как изучать событие, которое произошло около четырёх миллиардов лет назад и которое нельзя повторить? Учёные располагают тремя видами материала. Первый — наблюдения: свойства современных клеток и геномов, состав древних пород и метеоритов, результаты экспериментов. Второй — экспериментально показанные возможности: в лаборатории удаётся воспроизвести отдельные процессы, например образование органических молекул или копирование РНК, при условиях, которые задал экспериментатор. Третий — реконструкции: утверждения о прошлом — модели и исторические гипотезы, которые выводят из наблюдений с помощью допущений. Четвёртая категория — выводы, которые из имеющихся данных не следуют: для них данных недостаточно, или они подменяют одно утверждение другим. Эти четыре статуса используются во всём семинаре.","Главное правило семинара: возможность процесса в эксперименте не доказывает, что именно этот процесс происходил при возникновении жизни. Реконструкция может быть очень убедительной, если её поддерживают несколько независимых линий данных, и слабой, если она держится на одном допущении."],"conditions":"","sources":["src_01","src_14"],"widget":{"kind":"s12status","title":"","s":{"title":"Статус утверждения","status":"Один набор статусов на весь семинар","L":{"s12_status_obs":"Наблюдение","s12_status_obs_d":"Установлено непосредственно: измерено, увидено или получено в эксперименте","s12_status_poss":"Показанная возможность","s12_status_poss_d":"Показано, что процесс может идти без участия живых систем: он воспроизведён в эксперименте при заданных условиях. Это не значит, что так было в прошлом","s12_status_rec":"Реконструкция","s12_status_rec_d":"Утверждение о прошлом (историческая гипотеза или модель), выведенное из наблюдений с помощью допущений; может быть обосновано сильно или слабо","s12_status_open":"Не следует из данных","s12_status_open_d":"Имеющиеся данные такой вывод не обосновывают: данных недостаточно, или вывод подменяет одно утверждение другим","s12_status_note":"Статус — не оценка важности утверждения. Наблюдение может быть скромным, а реконструкция — очень убедительной, если её поддерживают несколько независимых линий данных. Если утверждение противоречит наблюдению, это видно по самому наблюдению; статус показывает, на чём утверждение основано","s12_status_t":"Статус утверждения"},"ex":{"obs":"В образцах астероида найдены азотистые основания","poss":"Аминокислоты могут ускорять образование коротких цепей РНК","rec":"Первые цепи РНК на Земле образовались в высыхающих щелочных водоёмах с аминокислотами","open":"Находка доказывает, что первые гены Земли построены из оснований, доставленных астероидами"}}},"quiz":{"id":"S12-L01","question":"В образцах астероида найдены азотистые основания. Какая это категория?","options":[{"id":"S12-L01-1","text":"Наблюдение","correct":true,"feedback":"Верно: наличие молекул в образце измерено. Вывод о том, что такие молекулы стали материалом первых генов Земли, — уже не наблюдение"},{"id":"S12-L01-2","text":"Показанная возможность","correct":false,"feedback":"Показанная возможность — процесс, воспроизведённый в эксперименте. Здесь сообщается о самой находке в природном образце — это наблюдение. Вывод, что основания образовались без участия живых систем, — уже реконструкция по условиям образца и контрольным пробам"},{"id":"S12-L01-3","text":"Реконструкция","correct":false,"feedback":"Реконструкция — утверждение о прошлом. Найденные молекулы — данные, а не объяснение"}]}},{"id":"function-origin","num":2,"section":0,"questions":[1,2,3,4],"title":"Как система работает и как она возникла — разные вопросы","keywords":["Вариант","Граница (системы)","Компартмент","Рибосома"],"lead":[],"mechanism":[],"paragraphs":["Современная клетка состоит из взаимозависимых систем. Геном не копируется без ферментов и мономеров, ферменты синтезируются по генам на рибосомах, рибосомы работают внутри мембранного компартмента, который поддерживает нужный состав среды (вспомнить семинар 1, [[https://fresll.github.io/bio/seminar-10-route.html#ribosome|БИО-10·13]]). Из этой взаимозависимости часто делают неверный вывод: раз сейчас всё нужно одновременно, всё и возникло одновременно, в современном виде. Это не так. Взаимозависимость описывает работу системы сейчас, а не историю её сборки: компоненты могли появляться постепенно, сначала выполнять другие функции и лишь позже стать незаменимыми.","Вторая ловушка — представлять эволюцию как движение к заранее заданной цели, к современной клетке. Эволюционные изменения не направлены к будущему результату: в каждом поколении сохранялись варианты, которые в данных условиях воспроизводились лучше. Поэтому вопрос «зачем возникла мембрана» лучше заменять вопросами «какое преимущество давала граница в тех условиях» и «какие данные это показывают»."],"conditions":"","sources":["src_01","src_15"],"widget":{"kind":"s12origin","title":"","s":{"title":"Как система работает и как она возникла","status":"Схема качественная: порядок появления компонентов неизвестен"}},"quiz":{"id":"S12-L02","question":"Утверждение: «Мембрана, геном и рибосома не работают друг без друга, значит, они возникли одновременно». Что в нём неверно?","options":[{"id":"S12-L02-1","text":"Ничего: сложные системы возникают сразу целиком","correct":false,"feedback":"Эволюционные изменения обычно постепенны; одновременное появление сложной системы потребовало бы отдельного доказательства"},{"id":"S12-L02-2","text":"Взаимозависимость не говорит о порядке появления","correct":true,"feedback":"Верно. Из современной взаимозависимости не следует одновременное возникновение: компоненты могли появляться постепенно. Описание работы клетки сейчас не равно описанию её истории"},{"id":"S12-L02-3","text":"Неверно, что эти три системы зависят друг от друга","correct":false,"feedback":"Взаимозависимость реальна — неверен вывод о происхождении"}]}},{"id":"life-criteria","num":3,"section":1,"questions":[1],"title":"Признаки живых систем и почему нет единственного определения","keywords":["Вироид","Воспроизводство","Деление (протоклетки)","Изменчивость","Наследственность","Обмен веществ"],"lead":[],"mechanism":[],"paragraphs":["Для известных клеточных организмов обычно называют такие признаки: клеточная организация с границей, отделяющей систему от среды; обмен веществ — совокупность превращений вещества и энергии; воспроизводство собственной организации; наследственность и изменчивость; поддержание относительного постоянства внутренней среды. Каждый признак по отдельности встречается и в неживой природе: кристалл растёт, сохраняя структуру; пламя поддерживается притоком вещества и энергии; жирнокислотные везикулы подходящего состава самопроизвольно собираются, а в отдельных экспериментах делились при механическом воздействии. Поэтому значение имеет не отдельный признак, а их функциональное сочетание.","Единого универсального определения жизни нет. В исследованиях происхождения жизни часто используют рабочее определение: жизнь — самоподдерживающаяся химическая система, способная к дарвиновской эволюции. Это соглашение, а не закон природы. Вирусы и вироиды несут наследственную информацию и изменяются под действием отбора, но воспроизводятся только с помощью клетки; отнести их к живому или нет — вопрос выбранного определения. Наблюдения о них от этого выбора не меняются."],"conditions":"","sources":["src_34","src_01","src_25"],"quiz":{"id":"S12-L03","question":"Какое утверждение о признаках живых систем верно?","options":[{"id":"S12-L03-1","text":"Достаточно обмена веществ с притоком энергии","correct":false,"feedback":"Превращения вещества за счёт внешней энергии идут и в неживых системах, например в автокаталитических сетях; одного этого признака мало"},{"id":"S12-L03-2","text":"Достаточно способности расти и затем делиться","correct":false,"feedback":"Растут и делятся и неживые структуры, например жирнокислотные везикулы; без наследственности и собственного аппарата воспроизводства это не живая система"},{"id":"S12-L03-3","text":"Живое отличает сочетание признаков, а не один","correct":true,"feedback":"Верно. Каждый признак по отдельности встречается и вне живого; живую систему отличает их функциональное сочетание: граница, обмен веществ, собственный аппарат воспроизводства, наследственность и изменчивость"}]},"exam_quiz":{"id":"S12-E01","question":"Какое свойство отличает автономную живую систему от вироида?","options":[{"id":"S12-E01-1","text":"Обмен веществ и синтез белков","correct":true,"feedback":"Верно: наследственность у вироида есть — различия передаются копиям, но превращения веществ и синтез белка обеспечивает клетка растения (БИО-12·3, ·5)."},{"id":"S12-E01-2","text":"Наследственность и изменчивость","correct":false,"feedback":"У вироида они есть — различия передаются копиям."},{"id":"S12-E01-3","text":"Наличие молекул РНК в составе","correct":false,"feedback":"РНК есть у обоих."}]}},{"id":"selection","num":4,"section":1,"questions":[1],"title":"Условия естественного отбора","keywords":["Вариант","Воспроизводство","Дифференциальное воспроизводство","Естественный отбор","Изменчивость","Наследственность"],"lead":[],"mechanism":[],"paragraphs":["Способность к дарвиновской эволюции характеризует не отдельную неизменную особь, а популяцию воспроизводящихся систем. Для естественного отбора необходимы три условия: изменчивость — существуют различающиеся варианты;
