  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }

}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* семинар 11: ключи текстов шага — ключи документов v1.1 (s11_t1_s1_q, _o1…_o4, _e, _w2…_w4, _h1…_h3, _obs, _cond) */
function poeKey(K, si){ const S = SCENES[K], st = S.poe[si]; return st.key || (S.pfx ? S.pfx + (si + 1) : `p${K}_${si + 1}`); }

/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */

   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */

/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.

/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */

/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;

function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;

  } catch (e) {}
}

/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */
const revShow0 = show;
show = function(){ revShow0(); revAfterShow(); };
function revAfterShow(){
  const a = $('routeQ');

    const h = a.getAttribute('href'), i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);
    let b = (i < 0 ? h : h.slice(0, i)).replace(/([?&])level=adv(?=&|$)/, '$1').replace(/\?&/, '?').replace(/[?&]+$/, '');
    if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';

/* справки молекул с клавиатуры: фокус, роль кнопки, доступное имя, Enter/Space (в семинарах, где этого не было);

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 700 px или низкий экран) во всех практикумах.
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 760 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:700px), (max-height:500px)') : null;
  let queued = false;
  function fitStage(st) {
    const sv = st.querySelector('svg'), zw = st.querySelector('.zwrap'); if (!sv || !zw) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); st.style.removeProperty('--p5w'); return; }
    const cur = sv.getBoundingClientRect().width, flatW = zw.clientWidth; if (!cur || !flatW) return;
    const k = Math.min(1, flatW / cur); let min = Infinity;
    ts.forEach(t => {
      const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
      const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
      if (px > 0 && px < min) min = px;
      t.classList.toggle('p5-small', px < 7);
    });
    if (min < Infinity) st.style.setProperty('--p5w', Math.ceil(Math.min(1800, Math.max(760, flatW * 11.2 / min))) + 'px');
  }
  function fitAll() { queued = false; document.querySelectorAll('#scenes .stage').forEach(st => { if (st.offsetParent) fitStage(st); }); }
  const later = () => { if (queued) return; queued = true; requestAnimationFrame(fitAll); };
  function arm() {
    const sc = document.getElementById('scenes') || document.body;
    new MutationObserver(later).observe(sc, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
    document.addEventListener('click', later, true);
    window.addEventListener('resize', later);
    later();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
})();

   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;

        (p.lab ? text(xx + p.w / 2, y + .5, p.lab, { size: 11.5, w: 700, col: p.kind === 'cds' ? '#fff' : C.tpl }) : ''));
      else if (p.lab) s += text(xx + p.w / 2, y + 22, p.lab, { size: 11, col: C.muted });
      xx += p.w;
    }
    return s;
  }
  /* столбик диаграммы (условные числа): подпись снизу, число сверху */
  function bar(x, y0, w, h, col, lab, val, o = {}) {
    return `<rect x="${f(x)}" y="${f(y0 - h)}" width="${f(w)}" height="${f(Math.max(h, 0))}" rx="3" fill="${col}" opacity="${o.op || .9}"/>` +
      text(x + w / 2, y0 - h - 10, val, { size: 13, w: 700 }) + textN(x + w / 2, y0 + 14, lab, { size: 11.5, col: C.muted });

/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */

    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +

  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —

/* =====================================================================

(function () {

/* =====================================================================
   s0_oc_s9_go.js — планы этапов анимаций семинара 12 (07, разд. 4; этап 1, Code). План — init (кадр до начала), st (состояние
   на каждом этапе), keys (подписи этапов), stop (последний достижимый этап), stopKey (подпись остановки), stepKey (как называть
   этап), note (подпись под шкалой). Состояния — объекты того же вида, что выход моделей OC.*, их рисует та же функция, что
   статичную схему; конечный кадр (T = stop) — сама статичная схема (тест tests12/frames12.mjs). null — у панели нет анимации.
   Анимации — только механизмы современных клеток (хемиосмос, перенос гена в ядро) и учебные модели (цепь звеньев, популяция,
   протоклетка, ген на дереве); «возникновение жизни», «захват митохондрии», панель FECA → LECA не анимируются (07, разд. 0, 4).
   ===================================================================== */
(function () {
  const A = (o, x) => Object.assign({}, o, x);
  /* ---- А1: цепь звеньев (вкладка 1, панель Б): этап i выполняет звенья 1…i; остановка на последнем выполненном звене ---- */
  const LV = [0, 1, 1, 2, 3, 3, 4];
  OC.s1b.plan = o => {
    const pre = o.links.findIndex(v => !v), n = pre < 0 ? 6 : pre;
    const part = i => A(o, { links: o.links.map((v, j) => v && j < i), level: Math.min(o.level, LV[i]), concHigh: o.concHigh && i >= 4, chains: o.chains && i >= 6, activ: o.activ && i >= 5, accum: o.accum && i >= 3 });
    const keys = [1, 2, 3, 4, 5, 6].map(i => 's12_tl1_' + i);
    if (!n) return { init: part(0), keys, stop: 1, stopKey: 's12_t1_' + o.key, st: [o] };
    return { init: part(0), keys, stop: n, stopKey: n < 6 ? 's12_t1_' + o.key : null, st: [1, 2, 3, 4, 5, 6].map(i => part(i)) };
  };
  /* ---- А2: популяция (вкладка 1, панель В): пять циклов; этап i — доли циклов 0…i ---- */
  OC.s1v.plan = o => {
    if (o.compare || !o.series) return null;
    const k = o.mode === 'enrichment' ? (o.transfer ? 's12_tl1v_reset' : 's12_tl1v_enrich') : o.key === 'v_sel_transfer' ? 's12_tl1v_seltr' : o.key === 'v_sel' ? 's12_tl1v_sel' : o.key === 'v_noher' ? 's12_tl1v_noher' : 's12_tl1v_nodiff';
    const part = i => A(o, { series: o.series.slice(0, i + 1), cyc: i });
    return { init: part(0), keys: [1, 2, 3, 4, 5].map(() => k), stop: 5, stopKey: null, st: [1, 2, 3, 4, 5].map(part), stepKey: o.transfer ? 's12_tl_cycle_tr' : 's12_tl_cycle' };
  };
  /* ---- Б1: цикл протоклетки (вкладка 2, панель А) — для cap_coupled; для cap_all этапа 3 нет ---- */
  OC.s2b.plan = o => {
    if (o.key !== 'cap_coupled' && o.key !== 'cap_all') return null;
    const stg = o.key === 'cap_coupled' ? [1, 2, 3, 4, 5, 6] : [1, 2, 4, 5, 6];
    return { init: A(o, { stg: 0 }), keys: stg.map(i => 's12_tl2_' + i), stop: stg.length, stopKey: null, st: stg.map(i => A(o, { stg: i })) };
  };
  /* ---- В1: хемиосмос (вкладка 3, панель Б; механизм современных клеток) ---- */
  OC.s3c.plan = o => {
    if (!o.pump) return null;
    const S = i => A(o, { stg: i }), note = 's12_tl3_note';
    if (!o.atpSynthase) return { init: S(0), keys: ['s12_tl3_1', 's12_tl3_2'], stop: 2, stopKey: 's12_t3_' + o.key, st: [S(1), S(2)], note };
    const keys = o.uncoupler ? ['s12_tl3_1', 's12_tl3_2', 's12_tl3_3u', 's12_tl3_4u'] : ['s12_tl3_1', 's12_tl3_2', 's12_tl3_3', 's12_tl3_4'];
    return { init: S(0), keys, stop: 4, stopKey: null, st: [S(1), S(2), S(3), S(4)], note };
  };
  /* ---- В2: ген на дереве (вкладка 3, панель А; учебная модель — условное дерево, события заданы правилами) ---- */
  OC.s3b.plan = (o, S) => {
    if (S && S.bare) return null;
    const vert = OC.s3b({ atLUCA: o.atLUCA }), loss = OC.s3b({ atLUCA: o.atLUCA, lossB3: o.lossB3 });
    const E = (has, ev) => A(o, { has, evOrigin: true, evLoss: !!ev.loss, evHgt: !!ev.hgt, noGT: !ev.gt });
    const none = { B1: 0, B2: 0, B3: 0, A1: 0, A2: 0, E: 0 };
    const st = [E(none, {})], keys = [o.atLUCA ? 's12_tl3t_1' : 's12_tl3t_1a'];
    st.push(E(vert.has, {})); keys.push(o.atLUCA ? 's12_tl3t_2' : 's12_tl3t_2a');
    if (o.atLUCA && o.lossB3) { st.push(E(loss.has, { loss: 1 })); keys.push('s12_tl3t_3'); }
    if (o.hgtA1toB12) { st.push(E(o.has, { loss: o.lossB3, hgt: 1 })); keys.push('s12_tl3t_4'); }
    st.push(o); keys.push('s12_tl3t_5');
    return { init: A(o, { has: none, evOrigin: false, evLoss: false, evHgt: false, noGT: true }), keys, stop: keys.length, stopKey: null, st, note: 's12_tl3t_note' };
  };
  /* ---- Г1: перенос гена в ядро (вкладка 4, панель Б): n_orig → n_silent → n_both → n_transfer (условная модель этапов) ---- */
  OC.s4b.plan = o => {
    const stop = { n_silent: 2, n_both: 4, n_transfer: 5 }[o.key];
    if (!stop) return null;
    const orig = OC.s4b({ organellarCopy: 'kept' }), silent = OC.s4b({ nuclearCopy: 1, organellarCopy: 'kept' }), both = OC.s4b({ nuclearCopy: 1, promoter: 1, signal: 1, organellarCopy: 'kept' }), tr = OC.s4b({ nuclearCopy: 1, promoter: 1, signal: 1, organellarCopy: 'lost' });
    return { init: orig, keys: [1, 2, 3, 4, 5].map(i => 's12_tl4_' + i), stop, stopKey: stop < 5 ? 's12_t4_' + o.key : null, st: [silent, silent, both, both, tr].slice(0, stop - 1).concat([o]), note: 's12_tl4_note' };
  };
})();

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (ограничение 07, разд. 4; R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   s0y_oc_ui.js — помощники сцен семинара 12 (статичная версия v1.1-с): вкладка из нескольких панелей (А, Б, В) с одной

   ===================================================================== */
const ST_KEYS = ['obs', 'poss', 'rec', 'open'];

function statusHTML(sel, head){

    ST_KEYS.map(k => `<div class="stc st_${k}${sel === k ? ' on' : ''}" title="${t('s12_status_' + k + '_d')}"><b>${t('s12_status_' + k)}</b><small>${t('s12_status_' + k + '_d')}</small></div>`).join('') +
    `</div></div>`;   /* пакет 4: s12_status_note — в окне «О модели» */
}
/* какой статус назван в тексте варианта (шаг, где ответ — название статуса) */
const statusOf = s => { s = String(s).replace(/[«».]/g, '').trim(); return ST_KEYS.find(k => t('s12_status_' + k) === s) || null; };
/* шкала этапов вкладки (этап 1): план берётся у текущей панели (OC.*.plan); у панели без анимации шкала скрыта.
   Правило (07, разд. 4; промпт, этап 1): анимация только рисует модель — кадр этапа рисует та же функция, что статичную схему,
   конечный кадр — статичная схема; после смены условия — кадр «до начала» и пауза для прогноза; после ответа в сценарии — запуск. */
function ocAnim(K, cfg){
  const view = stageView(K); let P = null, sig = null, armed = false, hold = false;
  const frameAt = T => {
    if (cfg.masked()) return cfg.maskDraw();
    const o = cfg.cur(); if (!P) P = cfg.plan(o);
    if (!P || T >= P.stop - 1e-9) return cfg.draw(o);
    if (T <= 1e-9) return cfg.draw(P.init);
    const i = Math.min(P.st.length - 1, Math.max(0, Math.ceil(T) - 1)), u = T - i, prev = i ? P.st[i - 1] : P.init;
    return cfg.draw(u < .5 ? prev : P.st[i]);
  };
  const tl = timeStrip(K, { note: 'tl_note', steps: true, render(T){ const e = $('svg' + K); if (e) e.innerHTML = defs(K) + frameAt(T); predictDone(K, T); }, onEnd: view.back });
  const el = $('tl' + K);
  return { tl, frameAt, get plan(){ return P; },
    sync(){
      const o = cfg.cur(); P = cfg.masked() ? null : cfg.plan(o);
      el.hidden = !P;
      if (!P) { $('sc' + K).classList.remove('predict'); armed = hold = false; sig = null; $('svg' + K).innerHTML = defs(K) + (cfg.masked() ? cfg.maskDraw() : cfg.draw(o)); return; }
      el.querySelector('.tlnote').textContent = t(P.note || 'tl_note');
      const s = JSON.stringify([P.keys, P.stop, P.stopKey, P.stepKey]);
      if (s !== sig) { sig = s; tl.config(P.keys, P.stop, P.stopKey, { speed: 1.4, stepKey: P.stepKey || 'tl_step' }); if (!armed && !hold) tl.seek(tl.end); }
      if (armed) { armed = false; hold = false; tl.play(true); view.reveal(300); }
      else if (hold) { hold = false; tl.seek(0); predictHold(K); }
      else if (!tl.playing) tl.redraw();

}
/* вкладка с панелями: cfg = { P: 's12_t1', panels: { A: { ctrl, ids, model, draw, mask, reads, cap }, … }, poe, after } */
function ocTab(K, cfg){
  const sec = layout(K), pans = Object.keys(cfg.panels);

  $('ctrl' + K).innerHTML = (pans.length > 1 ? segHTML('pn' + K, 's12_panel', pans.map(p => [p, 's12_pan_' + p]), pan) : '') +
    pans.map(p => `<div class="pctl" id="pc${K}${p}">${cfg.panels[p].ctrl()}</div>`).join('');   /* пакет 4: s12_hist_note — строка статуса на схеме, s12_ctrl_note — в окне «О модели» */
  taskFrame(K, cfg.P);

  const A = ocAnim(K, { cur: () => cfg.panels[pan].model(S), plan: o => cfg.panels[pan].plan ? cfg.panels[pan].plan(o, S) : null, draw: o => cfg.panels[pan].draw(o, t, S), masked, maskDraw: () => S.caseHide ? cfg.panels[pan].mask(t, S) : cfg.panels[pan].mask(t, S) });
  window['STATIC' + K.toUpperCase()] = draw;
  /* пакет 4: вкладка без шкалы этапов (cfg.cmp) — строка «Схема сравнивает состояния…» под схемой, пока шкала скрыта */

  pans.forEach(p => { const Pn = cfg.panels[p]; if (Pn.wire) Pn.wire(upd, S); else if (Pn.ids) wire(Pn.ids, upd); });
  /* шаги: после ответа — состояние apply(); если ответ — название статуса, он выделяется в «Статусе утверждения» */

  /* «Найти причину» (этап 1): до решения образец скрыт (veil), после — его состояние на панели случая; выход — норма */
  const caseShow = cfg.case ? c => { const on = typeof CASE !== 'undefined' && CASE.on && CASE.K === K;

/* пакет 4 (20.11.2026): единый экран практикума по образцу семинаров 3, 7–10. «Правила модели», «Чего модель не показывает»,

   и уходит вверх вместе с ней: на переключатели и показания она не ложится (v1.2) */
(function(){ const _ri = revInit; revInit = function(){ const r = _ri.apply(this, arguments);
  document.querySelectorAll('#scenes .side').forEach(sd => { const b = sd.querySelector('.totake'); if (b){ b.classList.add('inline'); sd.insertBefore(b, sd.firstChild); } });
  return r; }; })();

/* =====================================================================
   s9z_case.js — режим «Найти причину» (движок семинаров 7–10 без изменений логики; случаи семинара 12 — 07, разд. 4; этап 1, Code). Имя файла задаёт порядок сборки (после s9_wip.js), а не номер семинара.
   Образец со скрытой причиной; студент выбирает измерения. Задача решена, только если данные оставляют одно объяснение:
   верная догадка без данных не засчитывается. causes — варианты объяснения; образец получает одну из них случайно,
   «Начать заново» выбирает другую. Ситуации — собственные (R49). Логика (caseFits, caseMinimal) — чистые функции;
   значения рассчитываются моделями (CASE_SPEC ниже) и проверяются тестами tests12/models.mjs и tests12/case12.mjs; все подписи — через t().
   ===================================================================== */
/* Семинар 12 (этап 1, Code): случаи case1–case4 — 07, разд. 4 (вкладки 1–4). Показания образца для каждой причины и контроля
   рассчитываются моделями (OC.case1…case4 — s0_oc_m.js), а не записаны таблицей; однозначность (caseMinimal) проверяет
   tests12/case12.mjs. Чужие ситуации не используются (07, разд. 4). */
const CASE_SPEC = (function () {
  const mk = (id, C, meth) => { const S = { id, causes: Object.keys(C.causes), truths: C.truths, meth: {} }, ctl = C.ctrl();
    meth.forEach(m => { S.meth[m] = { ctrl: ctl[m] }; S.causes.forEach(c => { S.meth[m][c] = C.read(c)[m]; }); });
    return S; };
  return {
    '1b': mk('c1', OC.case1, ['formed', 'accum', 'conc', 'chains']),
    '2b': mk('c2', OC.case2, ['copies', 'growth', 'dep', 'rz', 'par']),
    '3b': mk('c3', OC.case3, ['grad', 'atp']),
    '4b': mk('c4', OC.case4, ['mito', 'cyt', 'nc', 'oc']),
  };
})();
/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (caseFits(spec, set, truth).length !== 1) continue;
    if (set.length < any.length) any = set;
    if (set.every(m => spec.meth[m][truth] !== spec.meth[m].ctrl) && (!best || set.length < best.length)) best = set;
  }
  return best || any;
}
window.CASE_LOGIC = { CASE_SPEC, caseFits, caseMinimal };

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };
(function(){
  const url = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`);
  Object.keys(CASE_SPEC).forEach(K => {
    const sec = $('sc' + K);
    sec.querySelector('.side').insertAdjacentHTML('afterbegin', `<div class="panel case" id="case${K}" hidden></div>`);
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', `<div class="veil" aria-hidden="true"><b>${t('case_veil')}</b><span>${t('case_veil_s')}</span></div>`);
  });
  const val = (S, m, v) => { const k = `${S.id}_v_${m}_${v}`; return t(k in TEXTS ? k : 'case_v_' + v); };   /* семинар 12: значения «да/нет/…» — общие ключи case_v_* */
  /* решение проверяется и после выбора объяснения, и после каждого измерения */
  function settle(K, S){
    if (!CASE.solved && CASE.done.length && CASE.guess === CASE.truth && caseFits(S, CASE.done, CASE.truth).length === 1){
      CASE.solved = true; $('sc' + K).classList.add('casedone'); SCENES[K].caseShow(CASE.truth);
    }
  }
  const ctl = (S, m) => val(S, m, S.meth[m].ctrl);   /* в строке контроля «как в контроле» не годится */
  function start(K, seed){
    const S = CASE_SPEC[K];
    /* порядок измерений и объяснений перемешивается, как в сценариях; ?fixed — постоянный порядок */
    const mix = a => { a = a.slice(); if (!url.has('fixed')) for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const TR = S.truths || S.causes;
    Object.assign(CASE, { on: true, K, seed, truth: TR[seed % TR.length], done: [], guess: null, solved: false, open: null, mo: mix(Object.keys(S.meth)), co: mix(S.causes) });
    POE.on = false; poeRender();
    const sec = $('sc' + K); sec.classList.add('casemode'); sec.classList.remove('casedone');
    SCENES[K].caseShow(null); render(); sync();
    if (window.matchMedia && matchMedia('(max-width:1000px)').matches) $('case' + K).scrollIntoView({ block: 'start' });
  }
  function exit(){
    if (!CASE.on) return;
    const K = CASE.K, sec = $('sc' + K); CASE.on = false;
    sec.classList.remove('casemode', 'casedone'); $('case' + K).hidden = true; $('case' + K).innerHTML = '';
    SCENES[K].caseShow(null); SCENES[K].update(); sync();
  }
  function verdict(S){
    const g = CASE.guess; if (!g) return '';
    if (CASE.solved) return '';
    const fits = caseFits(S, CASE.done, CASE.truth);
    if (!CASE.done.length) return `<p class="cv warn">${t('case_need')}</p>`;
    if (!fits.includes(g)){
      const m = CASE.done.find(x => S.meth[x][g] !== S.meth[x][CASE.truth]);
      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
    }
    return `<p class="cv warn">${t(fits.length === 2 ? 'case_more1' : 'case_more', { n: fits.length - 1 })}</p>`;
  }
  function render(){
    const K = CASE.K, S = CASE_SPEC[K], box = $('case' + K); box.hidden = false;
    let h = `<div class="k">${t('case_k')}</div><h3 class="ct">${t(S.id + '_title')}</h3>${TEXTS[S.id + '_tag'] ? `<p class="ctag">${t(S.id + '_tag')}</p>` : ''}${p4Cond(K, false)}<p class="co">${t(S.id + '_obs')}</p><p class="cnote">${t('case_note')}</p>`;
    h += `<div class="ch">${t('case_meas')}</div><div class="cm">`;
    CASE.mo.forEach(m => {
      const on = CASE.done.includes(m), open = CASE.open === m;
      h += `<div class="crow${on ? ' on' : ''}"><button type="button" class="cmb" data-m="${m}"${on ? ' aria-pressed="true"' : ''}${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_m_${m}`)}</button>` +
        `<button type="button" class="cq" data-q="${m}" aria-expanded="${open}" aria-label="${t('case_meth')}: ${esc(t(`${S.id}_m_${m}`))}">${t('case_meth')}</button>` +
        (on ? `<div class="cres"><span>${t('case_ctrl')}: ${ctl(S, m)}</span><b>${t('case_sample')}: ${val(S, m, S.meth[m][CASE.truth])}</b></div>` : '') +
        (open ? `<p class="cmeth">${t(`${S.id}_k_${m}`)}</p>` : '') + `</div>`;
    });
    h += `</div><div class="ch">${t('case_why')}</div><div class="cc">`;
    CASE.co.forEach(c => {
      const right = CASE.solved && c === CASE.truth;
      h += `<button type="button" class="ccb${CASE.guess === c ? ' picked' : ''}${right ? ' right' : ''}" data-c="${c}"${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_c_${c}`)}</button>`;
    });
    h += `</div><div role="status">${verdict(S)}</div>`;
    if (CASE.solved){
      const min = caseMinimal(S, CASE.truth);
      const flat = Object.keys(S.meth).filter(m => new Set(S.causes.map(c => S.meth[m][c])).size === 1);
      h += `<div class="cdone" role="status"><b>${t('case_ok')}</b><p>${t(`${S.id}_w_${CASE.truth}`)}</p>` +
        (TEXTS[S.id + '_after'] ? `<p class="cmin">${t(S.id + '_after')}</p>` : '') +
        `<p class="cmin">${t('case_used', { n: CASE.done.length, k: min.length })} ${t('case_enough', { m: min.map(x => '«' + t(`${S.id}_m_${x}`) + '»').join(', ') })}</p>` +
        flat.map(m => `<p class="cmin">${t('case_flat', { m: t(`${S.id}_m_${m}`) })}</p>`).join('') +
        `<p class="cmin"><a href="${t(S.id + '_link_h')}">${t(S.id + '_link_t')}</a></p></div>`;
    }
    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;
    box.innerHTML = h;
    const keep = sel => { const e = $('case' + K).querySelector(sel); if (e && !e.disabled) e.focus({ preventScroll: true }); };   /* панель перестраивается: фокус не теряется */
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      const TR = S.truths || S.causes;
      if (!url.has('fixed') && TR.length > 1) do { seed = Math.floor(Math.random() * 9973); } while (TR[seed % TR.length] === CASE.truth);   /* семинар 8: при одной верной причине — тот же случай заново */
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur] || !SCENES[cur].caseShow; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });

/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
if (!TEXTS.route_url) document.querySelector('.routes').hidden = true;
/* «← Раздел …: семинары»: адрес берётся из ключа home_href (например, section-2.html#seminars; без ключа — index.html рядом);
   на сайте ссылка относительная, в сохранённом файле — на адрес сайта (аудит 06.11.2026, LINK-001) */
(function(){
  const a = $('homeLink'); if (!a) return;
  if (TEXTS.home_href) a.setAttribute('href', TEXTS.home_href);
  if (!/^(fresll\.github\.io|edu\.mazunin\.science)$/.test(location.hostname)) a.href = 'https://fresll.github.io/bio/' + (a.getAttribute('href') || '').replace(/^\.\//, '');
})();
window.addEventListener('hashchange', fromHash);
initNav(); fromHash(); show(); revInit();

</script>
