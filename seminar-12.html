<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.qcol{color:var(--muted);font-size:13.5px;margin:2px 0 0;max-width:90ch;flex-basis:100%;order:9}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий «предскажите и проверьте» */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
/* v1.1.6: варианты итогового вопроса (блок .intbox) — тот же вид, что у вариантов шагов (прежде были кнопки браузера без стиля) */
.poe .opts,.intbox .opts{display:grid;gap:6px}
.poe .opt,.intbox .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L,.intbox .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked,.intbox .opt.picked{border-color:var(--ink)}
.poe .opt.right,.intbox .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick,.intbox .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex,.intbox .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled,.intbox .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tlrow{display:flex;gap:10px;align-items:center}
.tlplay{white-space:nowrap;min-width:116px;padding-top:7px;padding-bottom:7px}
.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

/* режим «Найти причину» (прототип) */
.veil{display:none}
.casemode .side>.panel:not(.case),.casemode .totake{display:none!important}
/* v1.1.6: шкала этапов скрыта во всём режиме «Найти причину»: после решения схема показывает образец, а шкала — план контрольной сцены (подпись «Этап 4 из 4…» противоречила образцу) */
.casemode .stage .tl,.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}
.case .k{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}
.co{margin:0 0 10px;font-size:15px;line-height:1.4}
.ch{margin:12px 0 6px;font-weight:700;font-size:14px}
.cm,.cc{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.cq{font:600 12.5px var(--f-body);padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}
.kh{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */
:root{--nucbg:#F3EEF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}
.rxtrack input{position:relative;z-index:1;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}
.mcond p{margin:0;font-size:14.5px}
.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (ограничение 07, разд. 4; R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.poe .hint{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface)}
.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.amapgrid svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.amapq{margin-top:12px}.amapq .opts{display:grid;gap:6px}.amapq .opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.amapq .opt.right{border-color:#2E9B57;background:#EEF8F1}.amapq .opt.wrongpick{border-color:#C0392B;background:#FBECEA}.amapq .opt .L{font-weight:700}
@media (max-width:700px){.amapgrid{grid-template-columns:minmax(0,1fr)}}

/* ---- семинар 8, интерактив (Claude Code, 12.11.2026): из семинара 7 v1.5 ---- */
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}
.tlrow:has(.tlstep) .tlchips{flex-wrap:wrap}
.tlrow:has(.tlstep) .tlplay{min-width:0}
@media (max-width:1000px){.tlrow:has(.tlstep) .tlchips{flex-basis:100%}}   /* рецензия v1.4, п. 9: на компьютере ряд шкалы в одну строку — схема крупнее */
.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}
.scene.predict .panel.cap::before,.scene.predict .panel.reads::before{content:attr(data-predict);display:block;font-weight:600;color:var(--ink)}
.scene.predict .panel.cap,.scene.predict .panel.reads{position:relative}
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
/* рецензия v1.4, п. 7: до запуска шкала не показывает, где остановится процесс */
.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}
.scene.predict .tlr{--stop:100% !important}
.scene.predict .tlc.no{cursor:pointer}   /* v1.2 (рецензия И-15) */

/* v1.2.1 (аудит S9-06, рецензия И-03): телефон — ключевые числа 2а/3а текущего кадра строкой под схемой, без прокрутки увеличенной схемы.
   Скрыта до ответа в сценарии (poehide), в «Найти причину» до решения и до запуска шкалы (predict); на широком экране не нужна. */
.mstrip{display:none}
@media (max-width:700px){ .mstrip{display:flex;flex-wrap:wrap;gap:2px 12px;margin:8px 2px 2px;font-size:14px;line-height:1.35;color:var(--ink,#15202B)}
  .mstrip b{font-variant-numeric:tabular-nums} .mstrip .mh{width:100%;font-size:12.5px;color:var(--muted,#5B6B7F)} }
.poehide .mstrip,.predict .mstrip,.casemode:not(.casedone) .mstrip{visibility:hidden}
/* v1.2.1 (аудит S10-07): подпись перехода над схемой после ответа */
.psw{margin:0 0 8px;padding:7px 12px;background:#FFF5E8;border-left:3px solid #E8912A;border-radius:0 8px 8px 0;font-size:14px;line-height:1.4;color:var(--ink,#15202B)}
.psw[hidden]{display:none}
/* ===== семинар 11 (Code, B0): подзаголовок, показания и условия в шаге сценария, правила модели, ссылка «К объяснению» ===== */
header .ttl{min-width:0}
header .psub{margin:2px 0 0;font-size:16px;color:var(--muted);font-weight:500}

.advx .rules li{margin:3px 0;font-size:14.5px}
.routeln{margin:10px 2px 2px}
.routeln a{font-weight:600}
.aprob p{margin:6px 0 0}
.take.none{display:none!important}
.scene .fewrap{grid-column:1/-1;margin-top:10px}
.fepanels{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fepanels svg{flex:1 1 280px;max-width:420px;background:var(--surface);border-radius:10px}
.fecap{font-size:15.5px;border-left:4px solid var(--mtor);padding-left:10px}
.feq{margin:10px 0}
.intbox{margin-top:12px}

.intcase{border-top:1px solid var(--line);padding:10px 0}

/* пакет 4 финального аудита (20.11.2026): окно «О модели» — общий компонент (patches/p4_model_dialog.md) */
#modelDlg{max-height:85vh;overflow:auto}

.model-body ul{margin:0 0 8px;padding-left:20px}
@media (max-width:600px){#modelDlg{max-width:calc(100vw - 24px);padding:14px}}
/* пакет 4, семинары 11–12: нумерованные правила в окне; строка статуса модели на схеме (.mstat, как в семинаре 3) —
   кнопки над схемой справа на компьютере нет, поэтому без отступа справа; схема по-прежнему помещается в окно;
   строка «Схема сравнивает состояния…» под схемой без шкалы этапов; задача и условия на первом экране сценария и в случае */
.model-body ol{margin:0 0 8px;padding-left:22px}
.model-body li{margin:2px 0}
.stage>.mstat{padding-right:12px}
.stage:has(.mstat):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 34px)!important}
.stage:has(.mstat):has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 182px)!important}
.cmpnote{margin:0;padding:6px 12px 8px;font-size:12px;color:var(--muted)}
.cmpnote[hidden]{display:none}
.poe .ptask{margin:4px 0 6px;font-size:15px;line-height:1.45}
.case .pcond{margin:6px 0 4px;font-size:14px}

/* сведение пакета 4 (20.11.2026): «Статус утверждения» — ячейки (раньше без стилей: термин сливался с определением, выбранная ячейка не выделялась) */
.stcells{display:grid;gap:6px;margin-top:6px}
.stc{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.stc b{display:block;font-size:14.5px}
.stc small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.stc.on{border-color:var(--on);box-shadow:inset 3px 0 0 var(--on);background:var(--on-soft)}

/* сведение пакета 4 (20.11.2026): длинная плашка показания переносится внутри строки, а не уходит за край колонки и не закрывает подпись */
@media (min-width:701px){.read:has(> .pill){grid-template-columns:max-content minmax(0,1fr)}.read > .pill{white-space:normal;justify-self:end;text-align:right}}

/* пакет 7 (20.11.2026): ссылка на раздел — отдельной строкой под переходом между семинарами */
.semnav .sn-sec{grid-column:1/-1;text-align:center}

/* пакет 5 (20.11.2026): телефон — подписи < 7 px скрыты до увеличения; ширина увеличенной схемы — по самой мелкой подписи (≥ 11 px) */
@media (max-width:700px), (max-height:500px){
  .stage.zoomed svg{width:var(--p5w,760px)!important}
}

/* 3.0.2 (21.11.2026): телефон — как в «Молекулярной биологии»: подписи не скрываются; схема открывается увеличенной;
   «Показать схему целиком» вписывает её во всю ширину экрана (ограничение высотой окна — только для компьютера и проектора) */
@media (max-width:700px){#scenes .stage:not(.zoomed) svg{max-height:none!important}}
</style>

и, а не результат эксперимента и не реконструкцию событий прошлого. Числа на схемах условные: они показывают, как изменяется величина при заданных правилах модели", "s12_hist_note": "Схема показывает логику рассуждения. Она не изображает, как события происходили на самом деле", "s12_status_obs": "Наблюдение", "s12_status_obs_d": "Установлено непосредственно: измерено, увидено или получено в эксперименте", "s12_status_poss": "Показанная возможность", "s12_status_poss_d": "Показано, что процесс может идти без участия живых систем: он воспроизведён в эксперименте при заданных условиях. Это не значит, что так было в прошлом", "s12_status_rec": "Реконструкция", "s12_status_rec_d": "Утверждение о прошлом (историческая гипотеза или модель), выведенное из наблюдений с помощью допущений; может быть обосновано сильно или слабо", "s12_status_open": "Не следует из данных", "s12_status_open_d": "Имеющиеся данные такой вывод не обосновывают: данных недостаточно, или вывод подменяет одно утверждение другим", "s12_status_note": "Статус — не оценка важности утверждения. Наблюдение может быть скромным, а реконструкция — очень убедительной, если её поддерживают несколько независимых линий данных. Если утверждение противоречит наблюдению, это видно по самому наблюдению; статус показывает, на чём утверждение основано", "s12_t1_title": "1. Живая система и химические предпосылки: что есть у объекта и что показал эксперимент", "s12_t1_cond": "Панель А. Пять объектов описаны наблюдаемыми свойствами; названия даны, оценки свойств — по описанию объекта. Панель Б. Учебная модель пути от органической молекулы к короткой цепи в одном водоёме ранней Земли; время наблюдения — много циклов притока и разрушения. Панель В. Учебная модель популяции из двух вариантов систем; наблюдается доля варианта А через пять циклов воспроизводства. Числа на панелях Б и В условные", "s12_t1_rules": "1. <i>Панель Б.</i> Мономер образуется, если есть синтез в водоёме или поступление извне. Он накапливается, только если поступление больше разрушения и выноса. Высокая локальная концентрация достигается, если мономер накапливается и действует механизм концентрирования. В модели короткие цепи образуются, только если концентрация высокая и мономер активирован; без активации в воде образовавшиеся связи гидролизуются быстрее, чем образуются.\n2. <i>Панель В.</i> Если варианты различаются, различие передаётся потомкам и вариант А оставляет в среднем в 1,5 раза больше потомков, чем вариант Б, доля варианта А растёт от цикла к циклу. Если хотя бы одно из трёх условий не выполнено, доля варианта А в среднем не изменяется.\n3. <i>Режим «Две молекулы разной устойчивости».</i> Молекулы X и Y образуются в водоёме с одинаковой скоростью; Y разрушается в три раза быстрее X. Молекулы не копируются. Доля X растёт и приближается к постоянному значению 0,75, которое задают скорости образования и разрушения. Если пятую часть раствора перенести в новый водоём с теми же условиями, доля X там снова приближается к 0,75 — с какого бы состава ни начинали. Новые молекулы X и Y образуются из веществ среды с постоянной скоростью, а не копируются с имеющихся, поэтому перенесённый состав со временем «забывается»: предел задают скорости образования и разрушения. При отборе (правило 2) новые варианты — копии имеющихся, и после такого же переноса доля варианта А продолжает расти от достигнутого значения: перенесённый состав служит исходной точкой.", "s12_t1_obj_cell": "Клетка бактерии", "s12_t1_obj_viroid": "Вироид", "s12_t1_obj_viroid_d": "Вироид — короткая кольцевая молекула РНК, заражающая растения; собственных белков не кодирует, копируется ферментами клетки растения", "s12_t1_obj_mito": "Митохондрия, выделенная из клетки", "s12_t1_obj_mito_d": "Митохондрия, выделенная из клетки и помещённая в раствор с субстратами окисления: синтезирует АТФ, содержит собственную ДНК и рибосомы, но большинство её белков кодирует ядро клетки; новые митохондрии образуются только делением в клетке и передаются дочерним клеткам при её делении", "s12_t1_obj_lipo": "Липосома с искусственным геномом", "s12_t1_obj_lipo_d": "Липосома с искусственным геномом: внутри работают синтез белка готовыми рибосомами из набора, копирование собственной ДНК и синтез фосфолипидов; деления не происходит", "s12_t1_obj_net": "Автокаталитическая сеть в проточном сосуде", "s12_t1_obj_net_d": "Автокаталитическая сеть в проточном сосуде (условный объект): при постоянном притоке веществ продукты сети ускоряют образование её же компонентов; границы нет", "s12_t1_prop_bound": "Граница, отделяющая систему от среды", "s12_t1_prop_metab": "Обмен веществ: превращения веществ за счёт внешних источников вещества и энергии", "s12_t1_prop_transl": "Собственный аппарат синтеза белка: система сама кодирует и строит его", "s12_t1_prop_repro": "Воспроизводство: система сама образует подобные себе системы", "s12_t1_prop_hered": "Наследственность: различия между системами передаются следующему циклу", "s12_t1_prop_homeo": "Поддержание внутренней среды, отличающейся от внешней", "s12_t1_b_none": "Мономер не образуется в водоёме и не поступает в него. Дальше цепь не продолжается", "s12_t1_b_decay": "Мономер образуется, но разрушается и выносится быстрее, чем поступает. Его количество не растёт", "s12_t1_b_accum": "Мономер накапливается: поступление превышает разрушение. Но он распределён по всему объёму, и встречи молекул редки", "s12_t1_b_conc": "Концентрация мономера высокая. Но без активации связь между мономерами в воде не сохраняется: цепи не образуются", "s12_t1_b_poly": "Мономер накоплен, сконцентрирован и активирован — в модели образуются короткие цепи. Модель не говорит, какой из механизмов действовал на ранней Земле", "s12_t1_v_sel": "Варианты различаются, различие передаётся потомкам и влияет на их число. Доля варианта А растёт — это естественный отбор в модели", "s12_t1_v_noher": "Вариант А оставляет больше потомков, но потомки не наследуют его особенность: каждый новый член популяции с равной вероятностью оказывается А или Б. Доля А не растёт", "s12_t1_v_nodiff": "Варианты различаются и передают различие, но оставляют одинаковое число потомков. Доля А в среднем не изменяется", "s12_t1_v_novar": "Все системы одинаковы — отбирать не из чего", "s12_t1_v_enrich": "Доля устойчивой молекулы X растёт: Y разрушается быстрее. Состав изменился без копирования и без наследования — это химическое обогащение", "s12_t1_v_reset": "В новом водоёме доля X снова приближается к 0,75 — к тому же пределу, что и при старте 1 : 1. Новые молекулы образуются из веществ среды, а не копируются с имеющихся, поэтому перенесённый состав «забывается»: предел задают скорости образования и разрушения", "s12_t1_v_sel_transfer": "После переноса доля варианта А продолжает расти от 0,88: потомки копируют родителей, и состав следующего цикла зависит от состава предыдущего. Так отбор отличается от обогащения", "s12_t1_s1_q": "Вироид копируется только ферментами клетки растения, собственных белков не кодирует; варианты его последовательности различаются и при копировании передаются копиям. Каких свойств из таблицы ему не хватает, чтобы быть автономной живой системой?", "s12_t1_s1_o1": "Собственного обмена веществ и аппарата синтеза белка", "s12_t1_s1_o2": "Наследственности: РНК без белков не передаёт информацию", "s12_t1_s1_o3": "Ничего: он копируется и изменяется, значит, он живой", "s12_t1_s1_o4": "Только границы, отделяющей его от клетки растения", "s12_t1_s1_e": "Верно. Наследственность у вироида есть: различия последовательностей передаются копиям. Но превращения веществ, синтез белка и сами ферменты копирования обеспечивает клетка растения, поэтому воспроизводится он только с её помощью. По рабочему определению вироид не самоподдерживающаяся система, хотя его линии могут изменяться под действием отбора", "s12_t1_s1_w2": "Последовательность РНК служит матрицей для копий, поэтому различия между вариантами передаются. Недостаёт не наследственности, а собственного аппарата, который это копирование выполняет", "s12_t1_s1_w3": "Копирование и изменчивость — лишь часть признаков. Для автономной живой системы нужны ещё собственный обмен веществ и аппарат воспроизводства; у вироида их выполняет клетка хозяина", "s12_t1_s1_w4": "Мембрана удержала бы молекулу, но не дала бы ей ферментов копирования и синтеза белка. Одна граница не превращает репликатор в живую систему", "s12_t1_s1_h1": "Кто в описании вироида выполняет копирование?", "s12_t1_s1_h2": "Сравните строку вироида со строкой клетки бактерии", "s12_t1_s1_h3": "Чего нет у самой молекулы, но есть у клетки растения?", "s12_t1_s2_q": "Переключите определение на широкое. Что изменилось на схеме?", "s12_t1_s2_o1": "Только вывод, свойства прежние", "s12_t1_s2_o2": "Появились обмен веществ и синтез белка", "s12_t1_s2_o3": "Вироид стал автономной системой", "s12_t1_s2_o4": "Ничего не изменилось на схеме", "s12_t1_s2_e": "Верно. Отнести вироид к живому или неживому — вопрос принятого определения. Наблюдения — что вироид копируется в клетке, не кодирует белков, наследует различия — от определения не зависят. Поэтому спор об определении не меняет научных фактов об объекте", "s12_t1_s2_w2": "Определение не изменяет свойства объекта. Свойства на схеме остались прежними; изменилась только классификация", "s12_t1_s2_w3": "Автономность — наблюдаемое свойство: вироид по-прежнему копируется только в клетке. Широкое определение просто не требует автономности", "s12_t1_s2_w4": "Изменился вывод в столбце «Вывод». Обратите внимание, что изменился только он", "s12_t1_s2_h1": "Какие ячейки таблицы зависят от определения?", "s12_t1_s2_h2": "Сравните строку свойств до и после переключения", "s12_t1_s2_h3": "Свойства наблюдают, а классификацию выбирают", "s12_t1_s3_q": "Выделенная митохондрия в растворе с субстратами синтезирует АТФ, у неё есть собственная ДНК и рибосомы, но большинство её белков синтезируется в цитозоле клетки по генам ядра. Почему её не считают автономной живой системой?", "s12_t1_s3_o1": "Без белков, кодируемых ядром, она не может воспроизводиться сама", "s12_t1_s3_o2": "У неё нет собственной ДНК, а без ДНК нет наследственности", "s12_t1_s3_o3": "У неё нет обмена веществ: АТФ образуется без превращений веществ", "s12_t1_s3_o4": "Она происходит от бактерии, а потомки симбионтов неживые", "s12_t1_s3_e": "Верно. Митохондрия сохраняет мембраны, обмен веществ и часть аппарата синтеза белка, но большинство необходимых ей белков синтезируется в цитозоле и импортируется. Поэтому делиться и сохранять свой состав она может только в клетке. Это признак глубокой интеграции бывшего симбионта с клеткой (вкладка 4)", "s12_t1_s3_w2": "Собственная ДНК у митохондрий человека есть; она кодирует несколько белков и РНК аппарата их синтеза. Дело не в отсутствии ДНК, а в том, что большинство белков кодирует ядро", "s12_t1_s3_w3": "Синтез АТФ при окислении субстратов — обмен веществ. Его наблюдают и у выделенных митохондрий", "s12_t1_s3_w4": "Происхождение не определяет, живая ли система сейчас. Вывод опирается на наблюдаемое свойство: зависимость от белков, кодируемых ядром", "s12_t1_s3_h1": "Где синтезируется большинство белков митохондрии?", "s12_t1_s3_h2": "Сравните столбцы «Собственный аппарат» и «Воспроизводство»", "s12_t1_s3_h3": "Без каких белков митохондрия не может делиться и сохранять свой состав?", "s12_t1_s4_q": "В липосоме одновременно идут синтез белка, копирование её ДНК и синтез фосфолипидов; все ферменты и рибосомы получены из современных клеток. Деления нет. Какой статус у утверждения «Эта система воспроизводит путь, которым возникла первая клетка»?", "s12_t1_s4_o1": "Не следует из данных", "s12_t1_s4_o2": "Наблюдение", "s12_t1_s4_o3": "Показанная возможность", "s12_t1_s4_o4": "Реконструкция", "s12_t1_s4_e": "Верно. Наблюдение — три процесса в одной липосоме. Оно показывает, что эти функции совместимы в одном компартменте. Но система собрана из готовых современных ферментов, деления и передачи состава дочерним системам нет; синтезированных липидов не хватало для заметного роста мембраны. О пути, которым возникла первая клетка, такой эксперимент ничего не говорит", "s12_t1_s4_w2": "Наблюдение — сами процессы. Утверждение же говорит об истории первой клетки, а это уже вывод, и из этих данных он не следует", "s12_t1_s4_w3": "Показана возможность совместной работы трёх процессов в одном компартменте. Возможность возникновения клетки без готовых ферментов этим экспериментом не показана", "s12_t1_s4_w4": "Реконструкцию предка строят сравнением геномов современных организмов. Искусственная липосома собрана из современных компонентов и предка не реконструирует", "s12_t1_s4_h1": "Откуда взяты ферменты и рибосомы?", "s12_t1_s4_h2": "Сравните строку липосомы со строкой клетки по столбцу «Воспроизводство»", "s12_t1_s4_h3": "Совместимость функций ещё не путь их возникновения", "s12_t1_s5_q": "В водоёме мономер образуется под действием электрических разрядов, но ультрафиолетовое излучение и гидролиз разрушают его быстрее, чем он образуется. Что будет с количеством мономера?", "s12_t1_s5_o1": "Не будет расти: убыль больше", "s12_t1_s5_o2": "Будет расти: синтез идёт постоянно", "s12_t1_s5_o3": "Будут образовываться короткие цепи", "s12_t1_s5_o4": "Мономер не образуется вообще", "s12_t1_s5_e": "Верно. Мономер появляется и разрушается. Накопление требует, чтобы образование и поступление превышали разрушение и вынос. Образование вещества и его накопление — разные звенья, и эксперимент, показавший образование, не показывает накопления", "s12_t1_s5_w2": "Количество растёт, только если поступление превышает убыль. Здесь убыль больше", "s12_t1_s5_w3": "Цепи требуют накопления, концентрирования и активации. Ни одно из этих звеньев здесь не выполнено", "s12_t1_s5_w4": "Синтез идёт — мономер появляется. Он не накапливается, потому что быстро разрушается", "s12_t1_s5_h1": "Что важнее для количества — скорость синтеза или разница синтеза и разрушения?", "s12_t1_s5_h2": "Посмотрите на звено «Накопление»", "s12_t1_s5_h3": "Что в условии больше — приход мономера или его убыль?", "s12_t1_s6_q": "Мономер накапливается, а при замерзании водоёма растворённые вещества вытесняются в жидкие каналы между кристаллами льда. Образуются ли цепи?", "s12_t1_s6_o1": "Нет: мономер не активирован, связь не сохраняется", "s12_t1_s6_o2": "Да: при высокой концентрации молекулы соединяются", "s12_t1_s6_o3": "Нет: при замерзании реакции прекращаются полностью", "s12_t1_s6_o4": "Да, но только длинные цепи, без коротких", "s12_t1_s6_e": "Верно. Концентрирование повышает частоту встреч молекул, но для образования связи мономер должен находиться в реакционноспособной, активированной форме. В воде без активации гидролиз связи преобладает над её образованием (правило модели)", "s12_t1_s6_w2": "Частые встречи не создают связь сами по себе: образование связи между нуклеотидами в воде требует энергии, которую даёт активация мономера", "s12_t1_s6_w3": "Во льду жидкие каналы между кристаллами сохраняются, и в них вещества сконцентрированы. Препятствие в модели — отсутствие активации", "s12_t1_s6_w4": "В модели без активации цепей нет совсем", "s12_t1_s6_h1": "Какое звено после концентрирования ещё не выполнено?", "s12_t1_s6_h2": "Чем активированный мономер отличается от обычного?", "s12_t1_s6_h3": "Связь между мономерами в воде легко гидролизуется", "s12_t1_s7_card": "В образцах астероида, доставленных на Землю с минимальным загрязнением, найдены все пять азотистых оснований нуклеиновых кислот", "s12_t1_s7_q": "Какой вывод из этой находки допустим?", "s12_t1_s7_o1": "Основания образуются и вне Земли, без живых систем", "s12_t1_s7_o2": "Жизнь была занесена на Землю из космоса", "s12_t1_s7_o3": "Первые гены Земли построены из оснований астероидов", "s12_t1_s7_o4": "Основания в образце — загрязнение земными организмами", "s12_t1_s7_e": "Верно. Наблюдение — основания в образцах астероида; их абиогенное образование — допустимая реконструкция: она следует из условий образца и контроля загрязнения. Какой вклад внеземное вещество внесло в химию ранней Земли и использовалось ли оно в первых наследственных системах, — открытый вопрос: количественный вклад разных источников неизвестен", "s12_t1_s7_w2": "Найдены отдельные молекулы, а не живые системы. Гипотеза переноса жизни между небесными телами из этой находки не следует и, кроме того, лишь переносит вопрос о происхождении жизни в другое место", "s12_t1_s7_w3": "Это историческое утверждение, которого находка не устанавливает. Основания могли образовываться и на самой Земле", "s12_t1_s7_w4": "Образцы были доставлены с минимальным риском земного загрязнения, и это проверяли контрольными пробами; это условие исследования, а не произвольное предположение", "s12_t1_s7_h1": "Что здесь измерено?", "s12_t1_s7_h2": "Какое звено цепи эта находка показывает?", "s12_t1_s7_h3": "Наличие молекулы — не её историческая роль", "s12_t1_s8_q": "В водоёме доля устойчивой молекулы X за пять циклов выросла с 0,50 до 0,61. Пятую часть раствора перенесли в новый водоём с теми же условиями. Чем это изменение отличается от естественного отбора?", "s12_t1_s8_o1": "Состав в новом водоёме не наследуется от старого", "s12_t1_s8_o2": "Ничем: состав изменился в пользу устойчивой молекулы", "s12_t1_s8_o3": "Ничем, если наблюдать дольше пяти циклов", "s12_t1_s8_o4": "Отбор бывает только у клеток, а здесь молекулы", "s12_t1_s8_e": "Верно. Изменение состава вызвано разной устойчивостью молекул — это химическое обогащение. В новом водоёме доля X снова приближается к 0,75, как и при старте 1 : 1: состав задают скорости образования и разрушения. При отборе варианты копируются, и после такого же переноса доля варианта А продолжает расти от достигнутого значения", "s12_t1_s8_w2": "Изменение состава может иметь разные причины. Для отбора нужны воспроизводство и передача различий; обогащение их не требует", "s12_t1_s8_w3": "При продолжении доля X приближается к 0,75 и перестаёт расти, а после переноса снова идёт к тому же пределу. Длительность наблюдения не создаёт наследования", "s12_t1_s8_w4": "Отбор возможен у любых воспроизводящихся систем с наследуемыми различиями, в том числе у молекул РНК в эксперименте. Здесь нет именно копирования и наследования", "s12_t1_s8_h1": "Что происходит с долей X после переноса?", "s12_t1_s8_h2": "Сравните с переносом при отборе (кнопка на панели В)", "s12_t1_s8_h3": "Откуда берутся новые молекулы X: копируются с имеющихся или образуются из среды?", "s12_t1_s9_q": "Через много циклов состав сети во втором сосуде изменился и стал таким же, как в третьем сосуде, где сеть с этим притоком запустили с нуля. Что из этого следует?", "s12_t1_s9_o1": "Состав сети задаёт приток, а не предыдущий состав", "s12_t1_s9_o2": "Сеть наследует свой состав, потому что ускоряет себя", "s12_t1_s9_o3": "Во втором сосуде произошёл отбор лучшей сети", "s12_t1_s9_o4": "Сеть стала живой: её состав подстроился под приток", "s12_t1_s9_e": "Верно. Автокатализ поддерживает сам себя, пока есть приток веществ, и сеть может воспроизводить свой состав. Но если состав определяется условиями, а не передаётся от исходной сети, наследственности нет: различия между сетями не сохраняются и не могут отбираться. Автокатализ — возможная ступень к живому, но ещё не наследственная система", "s12_t1_s9_w2": "Самоускорение поддерживает образование компонентов, но в эксперименте состав определился притоком: сеть второго сосуда стала такой же, как сеть, запущенная с нуля", "s12_t1_s9_w3": "Для отбора нужны варианты, которые передают свои различия. Здесь состав перестроился под новый приток независимо от того, каким он был", "s12_t1_s9_w4": "Изменение состава при смене условий не делает систему живой: у сети нет границы, собственного аппарата воспроизводства и наследственности", "s12_t1_s9_h1": "С чем совпал состав сети во втором сосуде?", "s12_t1_s9_h2": "Сохранила ли сеть что-то от исходного состава?", "s12_t1_s9_h3": "Наследственность — передача различий независимо от условий", "s12_t1_inv_obs": "Доля варианта А на циклах 0–5: 0,50; 0,50; 0,50; 0,50; 0,50; 0,50. Вариант А оставляет в каждом цикле больше потомков, чем Б", "s12_t1_inv_q": "Какое условие отбора не выполнено?", "s12_t1_inv_o1": "Потомкам не передаётся особенность", "s12_t1_inv_o2": "Варианты не различаются между собой", "s12_t1_inv_o3": "Нет дифференциального воспроизводства", "s12_t1_inv_o4": "Не хватает данных, чтобы ответить", "s12_t1_inv_e": "Верно. При дифференциальном воспроизводстве и наследовании доля А росла бы. Раз вариант А размножается лучше, а доля не растёт, различие не передаётся потомкам", "s12_t1_inv_w2": "По условию А оставляет больше потомков, значит, варианты различаются", "s12_t1_inv_w3": "Дифференциальное воспроизводство есть по условию: А оставляет больше потомков", "s12_t1_inv_w4": "Данных достаточно: из трёх условий два выполнены по условию, остаётся одно", "s12_t1_inv_h1": "Какие условия заданы явно?", "s12_t1_inv_h2": "Что осталось непроверенным?", "s12_t1_inv_h3": "Различие должно не только возникнуть, но и передаться", "s12_t1_limits": "Модель не показывает, какой состав имела атмосфера ранней Земли, в каком водоёме возникла жизнь и какие механизмы концентрирования действовали на самом деле. Таблица свойств — учебная: в живой природе есть организмы, у которых отдельные свойства выражены слабо или утрачены, например внутриклеточные симбионты с сильно уменьшенным геномом. Числа на панелях условные", "s12_t1_how": "В классическом эксперименте абиогенного синтеза использовали замкнутый стеклянный прибор: смесь метана, аммиака, водорода и водяного пара многократно пропускали через электрические разряды; продукты конденсировались в воде. Уже через сутки работы прибора в воде накапливались окрашенные продукты; хроматографией среди них обнаружили аминокислоты. Эксперимент показал химическую возможность при заданном составе газов; он не устанавливает, что такой была вся атмосфера ранней Земли.", "s12_t1_def": "Рабочее определение: самоподдерживающаяся химическая система, способная к дарвиновской эволюции", "s12_t1_net_card": "Сеть реакций в проточном сосуде: продукты ускоряют образование собственных компонентов. Содержимое сосуда разделили на два новых сосуда. В первый поступают те же вещества, что прежде, во второй — смесь с другим соотношением исходных веществ", "s12_t2_title": "2. РНК и протоклетка: почему копирующейся молекулы мало", "s12_t2_cond": "Панель А. Учебная модель протоклетки: везикула из жирных кислот, внутри — молекула РНК-матрицы и рибозим, копирующий РНК. Снаружи — активированные нуклеотиды и жирные кислоты. Наблюдаются: образование копий, рост оболочки, деление, содержимое дочерних везикул и их число через несколько циклов. Порядок событий в модели — допущение. Панель Б. Четыре уровня воспроизведения РНК и описание лабораторной системы", "s12_t2_rules": "1. Копии РНК образуются, если есть матрица, рибозим-полимераза и нуклеотиды внутри. В экспериментах мембраны из жирных кислот и их производных определённого состава пропускали внутрь активированные нуклеотиды (обычные нуклеотиды — значительно медленнее или совсем не проходили), и затравка внутри удлинялась; в контрольных везикулах из фосфолипида POPC удлинения затравки не обнаружено. В модели это свойство экспериментальных жирнокислотных мембран приписано оболочке протоклетки — допущение модели.\n2. Без мембраны копии и рибозим рассеиваются в растворе; копирование возможно, но продукты не остаются вместе, и системы, которая могла бы размножаться, нет.\n3. Оболочка растёт, если снаружи есть жирные кислоты. Выросшая везикула делится при внешнем воздействии. В эксперименте везикулы из жирных кислот росли, включая жирные кислоты из мицелл, и делились при механическом продавливании через узкие поры; при каждом таком делении часть содержимого выходила из везикул (около 40 % метки), так что полного сохранения содержимого эксперимент не показал. Продавливание через поры — искусственный экспериментальный приём, а не установленный механизм деления первых протоклеток. Деление при внешнем воздействии в модели — допущение.\n4. При делении содержимое распределяется между дочерними везикулами случайно; при малом числе молекул часть дочерних везикул не получает рибозим.\n5. Без связи функции с ростом все везикулы растут и делятся одинаково, независимо от того, какая РНК внутри: свойства РНК не влияют на число потомков.\n6. При связи функции с ростом везикулы с функциональной РНК растут быстрее и делятся в каждом цикле, а везикулы без неё — через цикл.\n7. Паразитическая РНК копируется рибозимом быстрее функциональной и ничего не катализирует. В общем растворе она вытесняет функциональную РНК; в везикулах при связи функции с ростом везикулы, где паразит вытеснил функциональную РНК, делятся реже.\n8. Паразит без связи функции с ростом: в везикулах паразит вытесняет функциональную РНК так же, как в растворе, — рост везикул от РНК не зависит, и системы с паразитом не отстают.", "s12_t2_cap_all": "Все компоненты есть: РНК копируется, везикула растёт и делится. Но размножение везикулы не зависит от того, какая РНК внутри: отбор вариантов РНК на уровне везикул не действует", "s12_t2_cap_coupled": "Функциональная РНК ускоряет рост оболочки: везикулы с ней делятся чаще. Теперь свойство молекулы влияет на число потомков системы — возможен отбор протоклеток", "s12_t2_cap_nomem": "Без мембраны копии образуются, но рассеиваются. Продукт рибозима достаётся всем молекулам раствора, и связи между вариантом РНК и его размножением нет", "s12_t2_cap_nopol": "Без рибозима-полимеразы копии не образуются. Везикула растёт и делится, но дочерние везикулы получают всё меньше РНК", "s12_t2_cap_nonuc": "Нет активированных нуклеотидов — нечего присоединять. Копирование останавливается, хотя рибозим и матрица на месте", "s12_t2_cap_nofa": "Нет жирных кислот — оболочка не растёт, деления нет. Копии накапливаются в одной везикуле", "s12_t2_cap_paras_open": "В общем растворе паразитическая РНК копируется быстрее и вытесняет функциональную", "s12_t2_cap_paras_nocoup": "Внутри везикул паразит копируется быстрее и вытесняет функциональную РНК. Рост везикул от РНК не зависит, поэтому системы с паразитом не отстают: одна граница паразита не ограничивает", "s12_t2_cap_paras_comp": "В везикулах, где паразит вытеснил функциональную РНК, оболочка растёт медленнее, и они делятся реже. Связь функции с ростом ограничивает распространение паразита, но не устраняет его", "s12_t2_s1_card": "Две функции одной молекулы", "s12_t2_s1_q": "Какие два свойства РНК лежат в основе гипотезы мира РНК?", "s12_t2_s1_o1": "Она служит матрицей и может катализировать реакции", "s12_t2_s1_o2": "Она переносит информацию от ДНК к белку в клетке", "s12_t2_s1_o3": "Она устойчивее ДНК и поэтому лучше хранит информацию", "s12_t2_s1_o4": "Она построена из аминокислот и поэтому катализирует", "s12_t2_s1_e": "Верно. Последовательность нуклеотидов служит матрицей для копирования, а свёрнутая молекула может катализировать реакции. Обе функции наблюдаются у современных РНК: матричная — при копировании и транскрипции, каталитическая — у рибозимов, в том числе в пептидилтрансферазном центре рибосомы. Гипотеза предполагает, что на раннем этапе одна и та же молекула могла выполнять обе функции; это предположение, а не наблюдение", "s12_t2_s1_w2": "Перенос информации в современной клетке — довод только о хранении и передаче информации. Гипотеза опирается и на каталитическую способность РНК", "s12_t2_s1_w3": "Наоборот: РНК легче гидролизуется, чем ДНК. Это одно из ограничений гипотезы", "s12_t2_s1_w4": "РНК — полимер нуклеотидов. Катализ ей обеспечивают пространственная структура и связанные ионы металлов", "s12_t2_s1_h1": "Чем РНК похожа на ДНК и чем — на белок?", "s12_t2_s1_h2": "Вспомните рибозимы", "s12_t2_s1_h3": "Одна функция — информационная, другая — каталитическая", "s12_t2_s2_q": "Все компоненты на месте, связи функции с ростом нет. Будут ли везикулы с более активным вариантом рибозима размножаться чаще других?", "s12_t2_s2_o1": "Нет: рост везикулы от свойств РНК не зависит", "s12_t2_s2_o2": "Да: активный рибозим делает больше копий", "s12_t2_s2_o3": "Нет: без этой связи РНК вообще не копируется", "s12_t2_s2_o4": "Да: их дочерние везикулы получают больше РНК", "s12_t2_s2_e": "Верно. Рибозим копирует РНК, везикулы растут за счёт жирных кислот и делятся под внешним воздействием, но свойства РНК не влияют на рост оболочки. Поэтому вариант рибозима не изменяет число потомков системы, и отбор протоклеток по этому варианту невозможен", "s12_t2_s2_w2": "Больше копий внутри — но не больше везикул. Число потомков системы определяется ростом и делением оболочки, а они от рибозима не зависят", "s12_t2_s2_w3": "Копирование от неё не зависит: копии образуются. Связь функции с ростом соединяет свойства РНК с размножением везикулы", "s12_t2_s2_w4": "Количество РНК в дочерней везикуле не ускоряет её деление в этой модели", "s12_t2_s2_h1": "От чего зависит рост оболочки?", "s12_t2_s2_h2": "Влияет ли РНК на жирные кислоты?", "s12_t2_s2_h3": "Отбор систем требует, чтобы вариант изменял число потомков системы", "s12_t2_s3_q": "Функциональная РНК ускоряет образование мембранных амфифилов. Что изменится в популяции везикул?", "s12_t2_s3_o1": "Доля везикул с функциональной РНК станет выше", "s12_t2_s3_o2": "Все везикулы начнут делиться одинаково быстрее", "s12_t2_s3_o3": "Ничего: деление вызывает внешнее воздействие", "s12_t2_s3_o4": "Функциональная РНК будет копироваться быстрее", "s12_t2_s3_e": "Верно. Теперь свойство молекулы влияет на рост и деление всей системы. Варианты различаются, различие передаётся дочерним везикулам вместе с РНК (хотя и случайно), и они оставляют разное число потомков — выполнены условия естественного отбора на уровне протоклеток", "s12_t2_s3_w2": "Ускорение получают только везикулы, в которых есть функциональная РНК: продукт остаётся внутри своей мембраны", "s12_t2_s3_w3": "Внешнее воздействие делит выросшую везикулу; быстрее растущая везикула раньше достигает размера, при котором делится", "s12_t2_s3_w4": "Скорость копирования в модели одинакова; изменяется рост оболочки, а не копирование", "s12_t2_s3_h1": "Где остаётся продукт функциональной РНК?", "s12_t2_s3_h2": "Сравните везикулы с функциональной РНК и без неё", "s12_t2_s3_h3": "Какие три условия отбора теперь выполнены?", "s12_t2_s4_q": "Мембраны нет, всё остальное прежнее. Что будет с функциональной РНК, продукт которой полезен?", "s12_t2_s4_o1": "Продукт рассеется и достанется всем молекулам", "s12_t2_s4_o2": "Она будет копироваться быстрее остальных молекул", "s12_t2_s4_o3": "Копирование остановится без мембраны вокруг молекул", "s12_t2_s4_o4": "Она вытеснит все остальные молекулы", "s12_t2_s4_e": "Верно. В общем растворе продукт функциональной РНК доступен любой молекуле, в том числе той, что ничего не катализирует. Без границы нет системы, которая получила бы преимущество, и связь «вариант → число потомков» разрывается", "s12_t2_s4_w2": "Копирование в модели не зависит от функции молекулы. Без границы функция не влияет и на размножение", "s12_t2_s4_w3": "Копирование возможно и в растворе: матрица, рибозим и нуклеотиды есть. Исчезает удержание продуктов", "s12_t2_s4_w4": "Для этого её преимущество должно доставаться ей самой. В открытом растворе его получают все", "s12_t2_s4_h1": "Кто получает продукт реакции в открытом растворе?", "s12_t2_s4_h2": "Что делает граница с продуктами?", "s12_t2_s4_h3": "Компартмент связывает функцию молекулы с её размножением", "s12_t2_s5_q": "Появилась паразитическая РНК: её копирует рибозим, но сама она ничего не катализирует. Связь функции с ростом есть. Где паразит распространится сильнее?", "s12_t2_s5_o1": "В растворе", "s12_t2_s5_o2": "В везикулах", "s12_t2_s5_o3": "Одинаково", "s12_t2_s5_o4": "Нигде", "s12_t2_s5_e": "Верно. Короткий паразит копируется быстрее. В растворе он использует общий рибозим и нуклеотиды и вытесняет функциональную РНК. В везикулах при связи функции с ростом система, где паразит вытеснил функциональную РНК, растёт и делится медленнее, и доля таких систем снижается. Полностью проблему паразитов компартменты не устраняют, а без связи функции с ростом одна граница их не ограничивает", "s12_t2_s5_w2": "Концентрация рибозима в везикуле высокая, но везикула с паразитом теряет преимущество в росте и делится реже, чем везикулы с функциональной РНК", "s12_t2_s5_w3": "Правила копирования одинаковы, но отбор систем действует только при наличии границы и связи функции с ростом", "s12_t2_s5_w4": "Паразит использует чужой рибозим — так же, как вирус использует ферменты клетки", "s12_t2_s5_h1": "Что получает паразит в растворе?", "s12_t2_s5_h2": "Что происходит с везикулой, где паразит вытеснил функциональную РНК?", "s12_t2_s5_h3": "Отбор на уровне систем ограничивает паразитов", "s12_t2_s6_q": "Жирных кислот снаружи нет. Что произойдёт?", "s12_t2_s6_o1": "Копии накопятся, деления нет", "s12_t2_s6_o2": "Везикула разделится на несколько меньших", "s12_t2_s6_o3": "Копирование РНК остановится", "s12_t2_s6_o4": "Везикула лопнет от избытка РНК", "s12_t2_s6_e": "Верно. Рост оболочки требует новых амфифилов. Без роста нет деления, и копии РНК не передаются новым системам. Копирование и размножение компартмента — разные процессы, которые должны быть согласованы", "s12_t2_s6_w2": "Деление без роста уменьшало бы объём каждой следующей везикулы; в модели деление требует роста оболочки", "s12_t2_s6_w3": "Копирование зависит от нуклеотидов, а не от жирных кислот: копии образуются", "s12_t2_s6_w4": "Модель этого не предусматривает; наблюдаемое показание — отсутствие роста и деления", "s12_t2_s6_h1": "Из чего строится оболочка?", "s12_t2_s6_h2": "Что нужно для деления?", "s12_t2_s6_h3": "Какие звенья цикла протоклетки зависят от жирных кислот, а какие — нет?", "s12_t2_s7_q": "На какую ступень поставить эту систему?", "s12_t2_s7_o1": "На ступень 2: копируются обе цепи коротких РНК", "s12_t2_s7_o2": "На ступень 4: копируется фрагмент самого рибозима", "s12_t2_s7_o3": "На ступень 1: это лишь удлинение одной цепи", "s12_t2_s7_o4": "Ни на какую: замораживания на ранней Земле не было", "s12_t2_s7_e": "Верно. Копирование обеих цепей коротких РНК и фрагмента рибозима — важный шаг. Но замкнутый цикл требует, чтобы копировалась вся полимераза, копия служила новой матрицей, а субстраты образовывались в той же системе. Нагревание, замораживание и подачу активированных фрагментов обеспечивает экспериментатор", "s12_t2_s7_w2": "Фрагмент — не вся полимераза. Кроме того, ступень 4 требует, чтобы система работала без участия экспериментатора", "s12_t2_s7_w3": "Здесь копируются обе цепи и многократно — это больше, чем удлинение одной цепи", "s12_t2_s7_w4": "Применимость условий к ранней Земле — отдельный вопрос. Ступень определяется тем, что воспроизведено в эксперименте", "s12_t2_s7_h1": "Копируется ли вся полимераза?", "s12_t2_s7_h2": "Кто разделяет цепи и подаёт субстраты?", "s12_t2_s7_h3": "Ступень 4 — без участия экспериментатора", "s12_t2_inv_obs": "Копии РНК — есть; копии удерживаются — да; оболочка растёт — да; деление — да; дочерние везикулы получают РНК — случайно; число потомков зависит от варианта РНК — нет", "s12_t2_inv_q": "Какие две неисправности могли дать такие показания?", "s12_t2_inv_o1": "Нет связи функции РНК с ростом оболочки", "s12_t2_inv_o2": "Паразит вытеснил функциональную РНК везде", "s12_t2_inv_o3": "Нет мембраны: копии рассеиваются в растворе", "s12_t2_inv_o4": "Нет рибозима-полимеразы, копирующего РНК", "s12_t2_inv_o5": "Нет жирных кислот для роста оболочки", "s12_t2_inv_x1": "Верно. Копирование, удержание, рост и деление работают; не хватает связи между свойством молекулы и размножением системы", "s12_t2_inv_x2": "Верно. Если ни в одной везикуле нет функциональной РНК, вариантов, различающихся по росту, нет — число потомков от РНК не зависит даже при связи функции с ростом. На панели этот случай отдельным положением переключателей не показан", "s12_t2_inv_x3": "Копии удерживаются — значит, граница есть", "s12_t2_inv_x4": "Копии образуются — значит, полимераза есть", "s12_t2_inv_x5": "Оболочка растёт и делится — жирные кислоты поступают", "s12_t2_inv_h1": "Какие показания нормальные?", "s12_t2_inv_h2": "Что нужно, чтобы вариант РНК влиял на число потомков?", "s12_t2_inv_h3": "Проверьте по правилам 5–8, при каких условиях число потомков зависит от РНК", "s12_t2_limits": "Модель не воспроизводит химическую эволюцию на ранней Земле и не утверждает, что первые наследственные молекулы были именно РНК. Порядок, в котором появлялись мембрана, копирование и связь функции с ростом, неизвестен: возможны и другие сценарии, в том числе с ранними сетями реакций без генетического полимера и с участием пептидов. Деление выросшей везикулы при внешнем воздействии — допущение модели: в лаборатории везикулы делили механическим продавливанием через поры, и это не доказывает, как делились первые протоклетки. Проницаемость оболочки для активированных нуклеотидов показана для экспериментальных мембран определённого состава, а состав мембран первых клеток неизвестен. Это не протокол получения самовоспроизводящейся системы", "s12_t2_how": "Рибозимы-полимеразы в природе не найдены: их получают направленной эволюцией в пробирке. Берут огромную смесь молекул РНК со случайными последовательностями, отбирают те, что выполняют нужную реакцию, размножают их и повторяют отбор много раз, внося новые изменения. Так получены рибозимы, удлиняющие цепь РНК по матрице.", "s12_t2_card_b": "Рибозим-полимераза многократно копирует обе цепи нескольких коротких РНК, в том числе фрагмент самого себя. Цепи разделяют нагреванием в кислой среде, а при последующем замораживании вещества концентрируются, и рибозим достраивает цепи из активированных фрагментов по три нуклеотида. Циклы задаёт экспериментатор", "s12_t3_title": "3. LUCA: что можно восстановить по современным геномам", "s12_t3_cond": "Панель А. Условное дерево шести современных клеточных линий: три бактериальные (Б1, Б2, Б3), две архейные (А1, А2) и ядерная линия эукариот (Э) внутри архей рядом с А2. Узел LUCA — в основании. Пунктир до LUCA — линии, не оставившие потомков. Длины ветвей не означают время; это не реконструкция реальной истории. Наблюдение — есть ли ген Р в геномах современных линий. Панель Б. Учебная модель мембраны с протонным насосом и АТФ-синтазой; наблюдаются разность концентраций протонов и синтез АТФ. Панель В. Свойства LUCA с качественной оценкой уверенности", "s12_t3_rules": "1. Ген, возникший в узле, наследуется всеми потомками этого узла, кроме линий, в которых он потерян (вертикальное наследование).\n2. Потеря в ветви означает отсутствие гена у всех линий, отходящих от этой ветви.\n3. При переносе копия гена донора встраивается в геном получателя; на дереве гена она располагается рядом с геном донора, а не там, где получатель стоит на дереве клеток. Если у получателя уже есть свой ген, перенесённая копия становится второй. Перенос в общего предка Б1 и Б2 наследуют обе эти линии.\n4. Хемиосмос: насос переносит протоны наружу, создавая разность концентраций протонов и электрический потенциал на мембране; протоны возвращаются через АТФ-синтазу, вращают её ротор, и каталитическая часть синтезирует АТФ. Разобщитель переносит протоны в обход АТФ-синтазы и разряжает разность.", "s12_t3_g_vert": "Ген возник до LUCA и унаследован всеми линиями. Дерево гена повторяет дерево клеток", "s12_t3_g_loss": "Ген был у LUCA и потерян в линии Б3. Распределение: Б1, Б2, А1, А2, Э. Дерево гена у оставшихся линий совпадает с деревом клеток", "s12_t3_g_hgt": "Ген возник в общем предке архей и эукариот и перенесён от А1 к общему предку Б1 и Б2. Распределение то же — Б1, Б2, А1, А2, Э, — но на дереве гена гены Б1 и Б2 оказываются рядом с геном А1", "s12_t3_g_arch": "Ген возник в общем предке архей и эукариот и не переносился. У бактерий его нет", "s12_t3_g_both": "Ген был у LUCA и потерян в линии Б3, а Б1 и Б2 получили вторую копию за счёт переноса от А1. На дереве гена у Б1 и Б2 по две ветви в разных местах", "s12_t3_g_vert_hgt": "Ген есть у всех линий; у Б1 и Б2 к собственной копии добавилась перенесённая от А1", "s12_t3_c_norm": "Насос переносит протоны наружу; они возвращаются через АТФ-синтазу, и синтезируется АТФ", "s12_t3_c_nopump": "Нет насоса — нет разности концентраций протонов. Синтезировать АТФ за счёт разности нечем", "s12_t3_c_noatps": "Разность концентраций протонов есть, но нет АТФ-синтазы — энергия градиента не превращается в энергию связей АТФ", "s12_t3_c_leak": "Разобщитель пропускает протоны в обход АТФ-синтазы: разность разряжается, синтез АТФ резко снижается, хотя насос работает", "s12_t3_c_noatps_leak": "АТФ-синтазы нет, а разобщитель разряжает разность, которую создаёт насос. Энергия переноса протонов рассеивается в виде тепла", "s12_t3_s1_q": "Почему LUCA нельзя считать первой живой системой?", "s12_t3_s1_o1": "До него могли быть линии, не оставившие потомков", "s12_t3_s1_o2": "Он первая клетка: от него произошли все клетки", "s12_t3_s1_o3": "Он жил позже появления первых эукариот", "s12_t3_s1_o4": "Он известен по ископаемой клетке из древних пород", "s12_t3_s1_e": "Верно. LUCA определяют по современным организмам: это узел, в котором сходятся их линии, — последний общий предок современных клеток. Всё, что было раньше и не оставило потомков, на дереве современных линий не отражается. Поэтому LUCA мог быть далеко не первой эволюционирующей системой и даже не первой клеткой", "s12_t3_s1_w2": "От LUCA произошли все современные клетки. Это не исключает, что до него существовали клетки, чьи линии угасли", "s12_t3_s1_w3": "Все современные клетки, включая эукариот, — потомки LUCA; значит, эукариоты возникли позже него", "s12_t3_s1_w4": "Ископаемых остатков, которые можно отнести к LUCA, нет. Его свойства выводят сравнением современных геномов", "s12_t3_s1_h1": "По каким организмам определяют LUCA?", "s12_t3_s1_h2": "Что обозначают пунктирные линии?", "s12_t3_s1_h3": "Последний общий предок ≠ первый организм", "s12_t3_s2_q": "Ген Р был у LUCA и потерян в линии Б3. У каких современных линий он будет найден?", "s12_t3_s2_o1": "У Б1, Б2, А1, А2 и Э, без Б3", "s12_t3_s2_o2": "У всех шести: ген был у LUCA", "s12_t3_s2_o3": "Только у архей и у эукариот", "s12_t3_s2_o4": "У Б1, Б2, Б3, А1 и А2", "
