s12_t3_s2_e": "Верно. Ген унаследован всеми потомками LUCA, кроме ветви, где он потерян; потеря в линии Б3 убирает ген только у неё", "s12_t3_s2_w2": "Наличие у предка не гарантирует сохранения у всех потомков: потерянный ген исчезает у всех линий этой ветви", "s12_t3_s2_w3": "Б1 и Б2 отходят от бактериальной ветви отдельно от Б3 и сохраняют ген", "s12_t3_s2_w4": "Потеря произошла в линии Б3, а не в линии эукариот: у Э ген сохранился", "s12_t3_s2_h1": "Где на дереве потеря?", "s12_t3_s2_h2": "Какие линии отходят от этой ветви?", "s12_t3_s2_h3": "Потеря действует только на ветвь, где она произошла", "s12_t3_s3_q": "Теперь ген Р возник в общем предке архей и эукариот и был перенесён от А1 к общему предку Б1 и Б2. Сравните распределение гена с предыдущим случаем", "s12_t3_s3_o1": "Список тот же, история — другая", "s12_t3_s3_o2": "Ген будет только у А1, Б1 и Б2", "s12_t3_s3_o3": "Ген будет у всех трёх бактерий", "s12_t3_s3_o4": "Сравнить нельзя без дерева гена", "s12_t3_s3_e": "Верно. Две разные истории — «был у LUCA и потерян в Б3» и «возник у архей и перенесён к бактериям» — дают одно и то же наблюдаемое распределение: Б1, Б2, А1, А2, Э. По самому распределению в этом дереве нельзя решить, был ли ген у LUCA", "s12_t3_s3_w2": "Ген возник в общем предке архей и эукариот, поэтому есть у А1, А2 и Э; перенос добавил его к Б1 и Б2", "s12_t3_s3_w3": "Перенос затронул общего предка Б1 и Б2; Б3 отошла раньше и гена не получила", "s12_t3_s3_w4": "Распределение — это список линий, у которых ген есть; его можно сравнить и без дерева гена. Дерево понадобится, чтобы различить истории", "s12_t3_s3_h1": "Где ген возник и куда попал?", "s12_t3_s3_h2": "Выпишите линии с геном в обоих случаях", "s12_t3_s3_h3": "Сравните, где ген возник, а не только у кого он есть", "s12_t3_s4_q": "Какое наблюдение поможет различить истории «был у LUCA и потерян» и «возник у архей и перенесён к Б1 и Б2»?", "s12_t3_s4_o1": "Положение генов Б1 и Б2 на дереве гена", "s12_t3_s4_o2": "Подсчёт числа линий, у которых есть ген", "s12_t3_s4_o3": "Поиск ископаемых остатков клеток LUCA", "s12_t3_s4_o4": "Никакое: истории различить невозможно", "s12_t3_s4_e": "Верно. При вертикальном наследовании гены Б1 и Б2 стоят на бактериальной ветви дерева гена. При переносе они оказываются рядом с геном донора, внутри архейной группы. Признак не абсолютен: дерево гена может быть построено с ошибкой, а при древних событиях сигнал ослабевает. Когда изучены сотни геномов, сильным свидетельством становится и само распределение гена по дереву видов; поэтому вывод проверяют несколькими методами", "s12_t3_s4_w2": "Число линий одинаково в обеих историях — это и есть исходная трудность", "s12_t3_s4_w3": "Таких остатков нет; кроме того, ген в ископаемых не сохраняется", "s12_t3_s4_w4": "В этом условном дереве из шести линий по распределению — невозможно; дерево гена даёт дополнительное, хотя и не безошибочное, свидетельство", "s12_t3_s4_h1": "Чем различаются истории на дереве гена?", "s12_t3_s4_h2": "Где окажется ген получателя после переноса?", "s12_t3_s4_h3": "Сравните дерево гена с деревом клеток", "s12_t3_s5_q": "В мембрану добавлен разобщитель — молекула, переносящая протоны через бислой. Что произойдёт с синтезом АТФ?", "s12_t3_s5_o1": "Резко снизится, хотя насос работает", "s12_t3_s5_o2": "Увеличится: протоны движутся через мембрану быстрее", "s12_t3_s5_o3": "Не изменится: насос продолжает работать", "s12_t3_s5_o4": "Остановятся и синтез АТФ, и насос", "s12_t3_s5_e": "Верно. Протоны возвращаются в обход АТФ-синтазы, и разность концентраций разряжается. АТФ-синтаза синтезирует АТФ за счёт потока протонов через свой ротор. Если протоны проходят через мембрану другим путём, поток через синтазу уменьшается. Это показывает, что синтез АТФ сопряжён именно с разностью концентраций протонов на мембране", "s12_t3_s5_w2": "Быстрее движутся протоны в обход синтазы; энергия рассеивается в виде тепла", "s12_t3_s5_w3": "Насос создаёт разность, но синтаза использует её, только если протоны проходят через неё", "s12_t3_s5_w4": "В модели насос продолжает работать; снижается синтез АТФ", "s12_t3_s5_h1": "Каким путём протоны возвращаются в цитоплазму?", "s12_t3_s5_h2": "Что вращает ротор синтазы?", "s12_t3_s5_h3": "Обходной путь разряжает разность концентраций", "s12_t3_s6_card": "Роторные АТФ-синтазы есть и у бактерий, и у архей; их субъединицы гомологичны", "s12_t3_s6_q": "Какой статус у утверждения «У LUCA было хемиосмотическое сопряжение»?", "s12_t3_s6_o1": "Реконструкция", "s12_t3_s6_o2": "Наблюдение", "s12_t3_s6_o3": "Показанная возможность", "s12_t3_s6_o4": "Не следует из данных", "s12_t3_s6_e": "Верно. Наблюдение — гомологичные АТФ-синтазы у обеих групп. Вывод о LUCA делают, предполагая, что система унаследована от общего предка, а не распространилась позднее. Поэтому это реконструкция с уверенностью от средней до высокой. Распространение гомологичных синтаз — сильный довод; менее уверенно реконструируются ион (протоны или другие ионы), тип насоса и свойства мембраны", "s12_t3_s6_w2": "Белков LUCA не существует; изучают белки современных организмов", "s12_t3_s6_w3": "Эксперимент с современным белком показывает, как работает синтаза, но не то, была ли она у LUCA", "s12_t3_s6_w4": "Распространение гомологичных синтаз у бактерий и архей — сильный сравнительный довод в пользу этого вывода. Неопределённы детали: ион, насос, мембрана", "s12_t3_s6_h1": "Что наблюдают у современных организмов?", "s12_t3_s6_h2": "Какое допущение превращает наблюдение в вывод о предке?", "s12_t3_s6_h3": "Свойства LUCA выводят, а не наблюдают", "s12_t3_s7_q": "Разные исследования оценивают число генов LUCA от нескольких десятков до примерно двух с половиной тысяч. Что из этого следует?", "s12_t3_s7_o1": "Оценка зависит от метода и его допущений", "s12_t3_s7_o2": "Одно из исследований ошибочно, остальные верны", "s12_t3_s7_o3": "Верна наименьшая оценка: она самая осторожная", "s12_t3_s7_o4": "Геном LUCA прочитали по древней ДНК", "s12_t3_s7_e": "Верно. Число генов LUCA выводят, сопоставляя деревья генов с деревом клеточных линий и учитывая переносы, потери и дупликации. Разные допущения и разный набор геномов дают разные ответы. Выражение «геном LUCA» обозначает вероятностную реконструкцию, а не прочитанную последовательность", "s12_t3_s7_w2": "Различие вызвано разными допущениями, а не обязательно ошибкой одного из исследований", "s12_t3_s7_w3": "Наименьшая оценка учитывает только гены, присутствующие почти у всех линий, и не учитывает гены, утраченные в отдельных линиях", "s12_t3_s7_w4": "ДНК такого возраста не сохраняется; используют только современные последовательности", "s12_t3_s7_h1": "Как получают число генов LUCA?", "s12_t3_s7_h2": "Что учитывают и что не учитывают разные методы?", "s12_t3_s7_h3": "Могут ли два корректных расчёта дать разные числа?", "s12_t3_inv_obs": "Ген есть у всех шести линий. На дереве гена Б1 и Б2 представлены двумя копиями каждая: одна — на бактериальной ветви, другая — внутри архейной группы рядом с А1", "s12_t3_inv_q": "Какая история объясняет эти данные?", "s12_t3_inv_o1": "Ген был у LUCA; Б1 и Б2 получили копию от А1", "s12_t3_inv_o2": "Ген возник у архей и перенесён ко всем бактериям", "s12_t3_inv_o3": "Ген удвоился в общем предке Б1 и Б2 после LUCA", "s12_t3_inv_o4": "Для ответа не хватает данных о дереве", "s12_t3_inv_e": "Верно. Копии на бактериальной ветви унаследованы вертикально; копии рядом с А1 — след переноса. Одна линия может нести гены с разной историей", "s12_t3_inv_w2": "Тогда все бактериальные гены лежали бы внутри архейной группы, а у Б1 и Б2 не было бы копий на бактериальной ветви", "s12_t3_inv_w3": "Копии от дупликации лежали бы рядом друг с другом на бактериальной ветви, а не одна из них — среди архей", "s12_t3_inv_w4": "Положение двух копий на дереве гена различает истории; для учебного дерева данных достаточно. В реальном анализе вывод проверяют несколькими методами", "s12_t3_inv_h1": "Где лежит каждая копия гена Б1?", "s12_t3_inv_h2": "Какая копия ведёт себя как вертикальная?", "s12_t3_inv_h3": "Одна копия — своя, другая — перенесённая", "s12_t3_limits": "Дерево условное: шесть линий вместо тысяч, длины ветвей не означают время, а события переноса и потери заданы правилами модели. При тысячах геномов распределение гена по дереву видов само становится важным свидетельством. Модель не показывает, где жил LUCA, каким был его метаболизм и как возник хемиосмос. Гипотеза о природном градиенте протонов в щелочных гидротермальных источниках — одна из конкурирующих; механизм, сопрягавший такой градиент с синтезом АТФ, не показан", "s12_t3_how": "Как узнают, был ли ген у LUCA. Для каждого семейства гомологичных генов строят дерево по последовательностям и сопоставляют его с деревом клеточных линий. Модель оценивает, какие сочетания событий — наследование, потери, дупликации, переносы — лучше объясняют расхождения, и рассчитывает вероятность того, что ген был у предка. Вывод надёжнее, когда согласованный сигнал дают многие компоненты одной системы, например белки и РНК рибосомы. Сравнение методов выявления горизонтального переноса показало, что при многих геномах распределение генного семейства по дереву видов («есть/нет») выявляет перенос надёжнее, чем согласование дерева гена с деревом видов.", "s12_t4_title": "4. Эукариотическая клетка: что доказано и что остаётся гипотезой", "s12_t4_cond": "Панель А. Пять линий данных о происхождении митохондрий у современных эукариот и три утверждения. Переключатели включают и выключают линии данных; модель показывает, какую поддержку получает каждое утверждение. Панель Б. Учебная модель переноса гена из митохондриальной ДНК в ядерную; объект — клетка современного эукариота, наблюдается, есть ли белок в митохондрии через много поколений клеток. Панель В. Отрезок от FECA до LECA с общепринятыми и спорными положениями", "s12_t4_rules": "1. <i>Панель А.</i> Утверждение получает статус «согласуются независимые линии данных», если его поддерживают не менее двух включённых линий из разных групп; «поддержано одной линией» — если одна; «данные с выводом согласуются, но его не поддерживают» — если поддерживающих линий нет, но включена хотя бы одна согласующаяся; «эти данные вывода не касаются» — если нет ни поддерживающих, ни согласующихся. Связь «согласуется» в подсчёт поддержки не входит.\n2. <i>Панель Б.</i> Белок М есть в митохондрии, если сохранена органеллярная копия или если ядерная копия есть, у неё есть промотор и сигнал импорта. Функция сохранена, если белок М есть в митохондрии. Встроенная копия без промотора не экспрессируется; белок без сигнала импорта остаётся в цитозоле.\n3. <i>Границы панели Б.</i> Приобретение ядерной копией промотора и сигнала импорта, период работы двух копий и утрата органеллярной копии — условная эволюционная модель функционального переноса гена. Порядок этих этапов у разных генов и в разных линиях может различаться; модель не утверждает универсальной исторической последовательности.", "s12_t4_line_L1": "Деревья генов: гены митохондриальной ДНК и ядерные гены многих митохондриальных белков ближе всего к генам альфа-протеобактерий", "s12_t4_line_L1_grp": "филогенетические данные", "s12_t4_line_L2": "Собственная ДНК и рибосомы бактериального типа", "s12_t4_line_L2_grp": "геном и аппарат экспрессии", "s12_t4_line_L3": "Две мембраны; внутренняя мембрана сохраняет бактериальные свойства; органеллы делятся", "s12_t4_line_L3_grp": "строение и деление", "s12_t4_line_L4": "Большинство белков митохондрий кодирует ядро; они импортируются по адресным сигналам", "s12_t4_line_L4_grp": "перенос генов и импорт белков", "s12_t4_line_L5": "У эукариот, живущих без кислорода, найдены органеллы, производные митохондрий (гидрогеносомы, митосомы); эукариоты, изначально лишённые митохондрий, не найдены", "s12_t4_line_L5_grp": "сравнение линий эукариот", "s12_t4_claim_C1": "Митохондрия произошла от бактерии-эндосимбионта", "s12_t4_claim_C2": "Ближайшие родственники предка митохондрии — альфа-протеобактерии", "s12_t4_claim_C3": "Митохондрия появилась раньше ядра", "s12_t4_a_all": "Три независимые линии поддерживают бактериальное происхождение. Конкретную группу бактерий указывают только деревья генов. О порядке появления ядра и митохондрии эти данные ничего не говорят", "s12_t4_a_noL1": "Без деревьев генов бактериальное происхождение по-прежнему поддерживают геном и рибосомы, строение и деление. Но от какой именно бактерии — уже не определить", "s12_t4_a_onlyL1": "Деревья генов указывают на альфа-протеобактерий, но вывод держится на одной линии данных", "s12_t4_a_L2L4": "Рибосомы бактериального типа поддерживают бактериальное происхождение; импорт белков с этим согласуется, но сам донора не указывает", "s12_t4_a_L4L5": "Импорт белков, кодируемых ядром, с бактериальным происхождением митохондрий согласуется, но сам его не доказывает. Производные митохондрий у анаэробов не указывают, от кого произошла органелла и когда появилось ядро", "s12_t4_n_orig": "Ген работает в митохондрии, как у бактерии-предка", "s12_t4_n_silent": "Копия гена встроилась в ядерную ДНК, но без промотора не транскрибируется. Ген в митохондрии по-прежнему необходим", "s12_t4_n_nosig": "Ядерная копия экспрессируется, но белок без сигнала импорта остаётся в цитозоле. Функцию в митохондрии обеспечивает органеллярная копия", "s12_t4_n_both": "Обе копии работают: белок поступает и из митохондриальной, и из ядерной копии. Утрата органеллярной копии теперь не нарушит функцию", "s12_t4_n_transfer": "Органеллярная копия утрачена, белок синтезируется в цитозоле по ядерному гену и импортируется. Перенос гена завершён", "s12_t4_n_lost_none": "Органеллярная копия утрачена, а копии в ядре нет: гена М в клетке не осталось, функция нарушена", "s12_t4_n_lost_silent": "Органеллярная копия утрачена, а ядерная не экспрессируется: белка М в митохондрии нет, функция нарушена", "s12_t4_n_lost_nosig": "Органеллярная копия утрачена, ядерный белок не импортируется: функция нарушена", "s12_t4_s1_q": "Чем LECA отличается от FECA?", "s12_t4_s1_o1": "LECA — предок нынешних эукариот, FECA — начало линии", "s12_t4_s1_o2": "Это два названия одного и того же предка эукариот", "s12_t4_s1_o3": "LECA — первая эукариотическая клетка, FECA — последняя", "s12_t4_s1_o4": "FECA — современная архея, самая близкая к эукариотам", "s12_t4_s1_e": "Верно. LECA — последний общий предок всех современных эукариот, уже сложная клетка с митохондрией; FECA — раннее состояние стволовой линии эукариот после её отделения. Между FECA и LECA формировались признаки эукариотической клетки. Современные эукариоты — потомки LECA, поэтому промежуточные стадии реконструируют косвенно: среди современных организмов их представителей нет", "s12_t4_s1_w2": "Это разные точки: начало и конец стволовой линии. Между ними прошло время, за которое сформировались ядро, эндомембраны и другие признаки", "s12_t4_s1_w3": "Наоборот: FECA — первое состояние линии, LECA — последний общий предок современных эукариот", "s12_t4_s1_w4": "FECA — состояние прошлого, а не современный организм. Современные археи — родственники, а не предки", "s12_t4_s1_h1": "Что означают слова First и Last?", "s12_t4_s1_h2": "Кто потомки LECA?", "s12_t4_s1_h3": "Начало и конец стволовой линии", "s12_t4_s2_q": "Какие утверждения поддержаны этими данными и насколько?", "s12_t4_s2_o1": "C1 — несколькими линиями, C2 — одной, C3 — нет", "s12_t4_s2_o2": "Все три утверждения доказаны одинаково надёжно", "s12_t4_s2_o3": "Все три — гипотезы: события прошлого не наблюдали", "s12_t4_s2_o4": "C1 и C3 поддержаны несколькими линиями, C2 — нет", "s12_t4_s2_e": "Верно. Бактериальное происхождение митохондрий поддерживают деревья генов, бактериальный тип генома и рибосом, строение и деление органелл. Родство именно с альфа-протеобактериями показывают только деревья генов. Порядок появления ядра и митохондрии из этих данных не следует: они описывают происхождение органеллы, а не последовательность событий", "s12_t4_s2_w2": "C3 говорит о порядке событий, а ни одна из линий порядка не устанавливает", "s12_t4_s2_w3": "Бактериальное происхождение поддерживают независимые линии данных — это надёжный вывод, а не произвольное предположение", "s12_t4_s2_w4": "C2 поддержан деревьями генов; C3 не поддержан ни одной линией", "s12_t4_s2_h1": "Какие линии касаются каждого утверждения?", "s12_t4_s2_h2": "Какая линия указывает конкретную группу бактерий?", "s12_t4_s2_h3": "Говорит ли хоть одна линия о ядре?", "s12_t4_s3_q": "Выключите деревья генов. Что произойдёт с утверждениями C1 и C2?", "s12_t4_s3_o1": "C1 сохранит поддержку, C2 — нет", "s12_t4_s3_o2": "Оба утверждения потеряют поддержку", "s12_t4_s3_o3": "Ничего не изменится", "s12_t4_s3_o4": "C1 потеряет поддержку, а C2 останется", "s12_t4_s3_e": "Верно. Бактериальное происхождение по-прежнему поддерживают геном, рибосомы и строение органелл. Но эти признаки общие для многих бактерий и не указывают конкретную группу. Только деревья генов говорят, от кого произошла органелла", "s12_t4_s3_w2": "C1 поддерживают ещё две независимые линии", "s12_t4_s3_w3": "C2 опирался только на деревья генов", "s12_t4_s3_w4": "Наоборот: C2 держался только на деревьях генов", "s12_t4_s3_h1": "Какие линии остались?", "s12_t4_s3_h2": "Указывают ли они группу бактерий?", "s12_t4_s3_h3": "Общий признак бактерий не называет донора", "s12_t4_s4_q": "Ядерная копия гена М экспрессируется, но в ней нет участка, кодирующего сигнал импорта, а органеллярная копия утрачена. Что будет с функцией белка М в митохондрии?", "s12_t4_s4_o1": "Нарушится: белок не импортируется", "s12_t4_s4_o2": "Сохранится: ген теперь есть в ядре", "s12_t4_s4_o3": "Сохранится: митохондрия синтезирует белок сама", "s12_t4_s4_o4": "Белок будет поступать в ядро", "s12_t4_s4_e": "Верно. Белок синтезируется в цитозоле, но без сигнала импорта там и остаётся. Для замены органеллярного гена ядерная копия должна и экспрессироваться, и кодировать белок с сигналом импорта. Поэтому простое встраивание фрагмента митохондриальной ДНК в ядро ещё не перенос гена", "s12_t4_s4_w2": "Наличие гена в ядре не доставляет белок в митохондрию; нужен сигнал импорта", "s12_t4_s4_w3": "Органеллярная копия утрачена: синтезировать белок М в митохондрии не по чему", "s12_t4_s4_w4": "Без сигнала белок остаётся в цитозоле; сигнал ядерной локализации здесь не задан", "s12_t4_s4_h1": "Что нужно белку, чтобы попасть в митохондрию?", "s12_t4_s4_h2": "Есть ли этот участок у ядерной копии?", "s12_t4_s4_h3": "Экспрессия + сигнал", "s12_t4_s5_q": "Обе копии гена работают. Что произойдёт, если органеллярная копия будет утрачена?", "s12_t4_s5_o1": "Функция белка сохранится", "s12_t4_s5_o2": "Функция нарушится сразу", "s12_t4_s5_o3": "Копия не может быть утрачена", "s12_t4_s5_o4": "Исчезнут обе копии гена", "s12_t4_s5_e": "Верно. Белок поступит из ядерной копии. Пока работают обе копии, утрата одной не нарушает функцию — так перенос может завершиться. Утрата органеллярной копии не мгновенна и не обязательна: у разных эукариот в митохондриях сохранились разные наборы генов", "s12_t4_s5_w2": "Ядерная копия экспрессируется и кодирует сигнал импорта — белок поступает из цитозоля", "s12_t4_s5_w3": "Утрата возможна; так часть генов бывшего симбионта оказалась в ядре, а многие другие гены были утрачены без переноса", "s12_t4_s5_w4": "Модель этого не предусматривает: утрачивается только органеллярная копия", "s12_t4_s5_h1": "Сколько источников белка М у клетки?", "s12_t4_s5_h2": "Что останется после утраты одной копии?", "s12_t4_s5_h3": "Что поставляет белок М в митохондрию, если органеллярной копии нет?", "s12_t4_s6_card": "Первая асгардархея, выращенная в лаборатории, делится очень медленно, образует длинные ветвящиеся выросты мембраны и растёт, разлагая аминокислоты, вместе с микроорганизмами-партнёрами, потребляющими водород, — бактерией и другой археей. В её геноме есть гены, родственные генам эукариот", "s12_t4_s6_card_t": "Асгардархея в культуре", "s12_t4_s6_q": "Кем эта асгардархея приходится клетке-хозяину, принявшей предка митохондрии?", "s12_t4_s6_o1": "Современным родственником, а не предком", "s12_t4_s6_o2": "Самой клеткой-хозяином, дожившей до наших дней", "s12_t4_s6_o3": "FECA: она стоит в начале линии эукариот", "s12_t4_s6_o4": "Никем: её гены не связаны с генами эукариот", "s12_t4_s6_e": "Верно. Наблюдение — свойства современного организма. Сходство генов поддерживает архейное происхождение клетки-хозяина, а тесное партнёрство с другими микроорганизмами делает правдоподобным партнёрство и в прошлом. Но современная архея прошла собственную долгую эволюцию и не равна предку; её экология не восстанавливает экологию хозяина", "s12_t4_s6_w2": "Хозяин жил, по модельным оценкам, около двух миллиардов лет назад или раньше; современная асгардархея — его дальний родственник", "s12_t4_s6_w3": "FECA — состояние прошлого на стволовой линии эукариот. Современный организм не может быть FECA, даже если он ему родствен", "s12_t4_s6_w4": "В её геноме есть гены, родственные генам эукариот; на этом и основан вывод о родстве с клеткой-хозяином", "s12_t4_s6_h1": "Это организм прошлого или современный?", "s12_t4_s6_h2": "Что здесь наблюдение, а что вывод?", "s12_t4_s6_h3": "Родственник ≠ предок", "s12_t4_s7_q": "Переключите гипотезу. Что изменилось в рамке «Общепринято»?", "s12_t4_s7_o1": "Ничего: меняется только порядок событий", "s12_t4_s7_o2": "Изменилось происхождение клетки-хозяина", "s12_t4_s7_o3": "У LECA исчезла митохондрия в этой гипотезе", "s12_t4_s7_o4": "Рамка исчезла: об этом ничего не известно", "s12_t4_s7_e": "Верно. Конкурирующие гипотезы расходятся в порядке появления митохондрии, ядра, эндомембран и фагоцитоза — он меняется в пунктирных цепочках. Общие для них положения — архейный хозяин, бактериальный предок митохондрии, объединение до LECA — сохраняются в любой гипотезе. Правильный ответ на вопрос о порядке сейчас — «предмет обсуждения», а не выбор одной гипотезы", "s12_t4_s7_w2": "Происхождение хозяина из архейной линии общее для обеих гипотез", "s12_t4_s7_w3": "Митохондрия у LECA есть в обеих гипотезах", "s12_t4_s7_w4": "Общепринятые положения не зависят от выбора гипотезы о порядке событий", "s12_t4_s7_h1": "Какие элементы на панели пунктирные?", "s12_t4_s7_h2": "Что общего у обеих цепочек?", "s12_t4_s7_h3": "Спор идёт о порядке, а не о происхождении участников", "s12_t4_inv_obs": "Белок М в митохондрии — нет; функция — нарушена; органеллярная копия — утрачена; копия гена в ядерной ДНК — есть", "s12_t4_inv_q": "Какие причины совместимы с этими показаниями и что их различит?", "s12_t4_inv_o1": "Нет промотора или сигнала; проверить цитозоль", "s12_t4_inv_o2": "Только отсутствие промотора: других причин нет", "s12_t4_inv_o3": "Нарушен импорт всех белков в митохондрию клетки", "s12_t4_inv_o4": "Причины не различить никаким наблюдением", "s12_t4_inv_e": "Верно. Ядерная копия либо не экспрессируется, либо кодирует белок без сигнала импорта; обе причины дают одинаковые показания в митохондрии. Если белок М находят в цитозоле, ядерная копия экспрессируется, но белок не импортируется; если белка нет нигде, копия не экспрессируется", "s12_t4_inv_w2": "Отсутствие сигнала импорта даёт те же показания в митохондрии; одной причины по этим данным не выбрать", "s12_t4_inv_w3": "По условию импорт белков работает; к тому же это нарушило бы много функций, а не одну", "s12_t4_inv_w4": "Две причины действительно совместимы с показаниями, но их различает наблюдение белка в цитозоле", "s12_t4_inv_h1": "Какие два условия нужны ядерной копии?", "s12_t4_inv_h2": "Где окажется белок без сигнала импорта?", "s12_t4_inv_h3": "Ищите белок там, где он мог бы застрять", "s12_t4_limits": "Модель не показывает, когда и в какой среде произошёл эндосимбиоз, сколько партнёров в нём участвовало и как предок митохондрии оказался внутри хозяина. Митохондрии современных эукариот различаются: у одних линий в митохондриальной ДНК сохранились десятки генов, у других — несколько; гидрогеносомы и митосомы многих линий генома не имеют. В линиях, где митохондриальный генетический код отличается от стандартного (вспомнить: <a href=\"seminar-10-route.html#genetic-code\" target=\"_blank\" rel=\"noopener\">семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»</a>), ядерная копия должна ещё и читаться по стандартному коду. Перенос гена в модели — схема, а не запись реального события", "s12_t4_how": "Родство митохондрий с альфа-протеобактериями установили, сравнивая последовательности генов. Для гена рибосомной РНК или белка митохондрии подбирают гомологи у многих бактерий, выравнивают последовательности и строят дерево. Если митохондриальный ген на дереве оказывается внутри группы альфа-протеобактерий или рядом с ней, это указывает на общего предка; какое из двух положений точнее, до сих пор обсуждается. Вывод проверяют на многих генах и разными методами: древние переносы и потери затрудняют поиск ближайшей ветви.", "s12_t4_how_code": "Генетический код митохондрий позвоночных отличается от стандартного. Например, кодон UGA в стандартном коде — стоп-кодон, а в митохондриях позвоночных он кодирует триптофан. Поэтому ген, перенесённый из митохондриальной ДНК в ядро, мог бы читаться по-другому: там, где в митохондрии стоит триптофан, рибосома цитозоля остановила бы синтез белка", "s12_a_note": "Модель условная. Она показывает логику рассуждения и не воспроизводит действительную химическую или биологическую историю", "s12_a1_title": "Исследование 1. Что показал эксперимент и чего он не показал", "s12_a1_base": "Четыре статуса утверждений — те же, что на вкладках базового уровня:\n1. <b>Наблюдение</b> — непосредственно установлено измерением или экспериментом.\n2. <b>Показанная возможность</b> — процесс воспроизведён в эксперименте при заданных условиях; это не значит, что так было в прошлом.\n3. <b>Реконструкция</b> — утверждение о прошлом (историческая гипотеза или модель), выведенное из наблюдений с помощью допущений; данные с ним совместимы, но не доказывают его окончательно.\n4. <b>Не следует из данных</b> — приведённые данные такой вывод не обосновывают: он подменяет одно утверждение другим или требует данных, которых нет.\nОдно и то же явление может описываться утверждениями разных статусов", "s12_a1_card_rna_t": "абиогенный синтез", "s12_a1_card_rna": "При высушивании щелочного раствора при комнатной температуре аминокислоты ускоряли соединение активированных нуклеотидов в короткие цепи РНК, до семи нуклеотидов. Активированные нуклеотиды подавал экспериментатор", "s12_a1_card_space_t": "внеземная органика", "s12_a1_card_space": "В образцах астероида, доставленных на Землю с минимальным загрязнением, найдены все пять азотистых оснований нуклеиновых кислот; контрольные пробы, прошедшие те же операции, оснований не содержали", "s12_a1_card_vesicle_t": "самосборка", "s12_a1_card_vesicle": "Жирные кислоты в воде самопроизвольно образуют замкнутые везикулы; в эксперименте такие везикулы росли при добавлении жирных кислот и делились, когда их механически продавливали через узкие поры; часть содержимого при каждом делении выходила наружу", "s12_a1_card_metal_t": "каталитические свойства", "s12_a1_card_metal": "Фосфит на металлическом палладии в воде без ферментов превращал АМФ в АДФ; концентрация фосфита в эксперименте выше, чем в изученных природных породах", "s12_a1_card_ribo_t": "современные системы", "s12_a1_card_ribo": "Пептидилтрансферазный центр рибосомы, где образуется пептидная связь, образован рибосомной РНК", "s12_a1_st1": "В образцах астероида найдены азотистые основания", "s12_a1_st1_k": "наблюдение", "s12_a1_st2": "Азотистые основания в образцах астероида образовались без участия живых систем", "s12_a1_st2_k": "реконструкция", "s12_a1_st3": "Находка доказывает, что первые гены Земли построены из оснований, доставленных астероидами", "s12_a1_st3_k": "не следует из данных", "s12_a1_st4": "Аминокислоты могут ускорять образование коротких цепей РНК", "s12_a1_st4_k": "показанная возможность", "s12_a1_st5": "Первые цепи РНК на Земле образовались в высыхающих щелочных водоёмах с аминокислотами", "s12_a1_st5_k": "реконструкция", "s12_a1_st6": "Пептидилтрансферазный центр рибосомы образован РНК", "s12_a1_st6_k": "наблюдение", "s12_a1_st7": "Устройство рибосомы доказывает, что был этап эволюции совсем без белков", "s12_a1_st7_k": "не следует из данных", "s12_a1_st8": "Жирнокислотные везикулы могут расти и делиться без ферментов", "s12_a1_st8_k": "показанная возможность", "s12_a1_st9": "Первые клетки были ограничены мембранами из жирных кислот", "s12_a1_st9_k": "реконструкция", "s12_a1_st10": "Эксперимент с фосфитом показывает, что обмен веществ возник в гидротермальных источниках", "s12_a1_st10_k": "не следует из данных", "s12_a1_scen1": "Одна и та же реакция — два прочтения", "s12_a1_scen1_d": "утверждения 4 и 5 опираются на одну карточку; первое — показанная возможность, второе — реконструкция. Модель подсвечивает общую карточку и различие формулировок: «могут» и «образовались»", "s12_a1_scen2": "Наблюдение и неверный вывод", "s12_a1_scen2_d": "утверждения 6 и 7 — одна карточка; наблюдение о рибосоме совместимо с древней ролью РНК, но не доказывает этапа без белков", "s12_a1_scen3": "Гипотеза и подмена", "s12_a1_scen3_d": "утверждения 5 и 3 — обе об истории; первая называет возможный путь, вторая выдаёт находку за его доказательство", "s12_a1_pred": "До того как раскрыть ответы, отметьте: сколько из десяти утверждений, по-вашему, можно отнести к наблюдениям? Сколько — к выводам, которые не следуют из данных?", "s12_a1_s1_q": "Какой статус у утверждения «Аминокислоты могут ускорять образование коротких цепей РНК»?", "s12_a1_s1_o1": "Показанная возможность", "s12_a1_s1_o2": "Наблюдение", "s12_a1_s1_o3": "Реконструкция", "s12_a1_s1_o4": "Не следует из данных", "s12_a1_s1_e": "Верно. Процесс воспроизведён в лаборатории при заданных условиях: высушивание, щелочная среда, активированные нуклеотиды. Утверждение говорит, что так может быть, а не что так было", "s12_a1_s1_w2": "Наблюдение в эксперименте — рост выхода цепей в конкретных условиях. Обобщение «аминокислоты могут ускорять» — это уже утверждение о возможности процесса", "s12_a1_s1_w3": "Утверждение не говорит о прошлом Земли; оно описывает, что возможно химически", "s12_a1_s1_w4": "Этот вывод прямо следует из результата эксперимента, если сохранить слово «могут» и условия", "s12_a1_s1_h1": "Говорит ли утверждение о прошлом?", "s12_a1_s1_h2": "Что сделано в эксперименте?", "s12_a1_s1_h3": "«Может» и «было» — разные статусы", "s12_a1_s2_q": "«Первые цепи РНК на Земле образовались в высыхающих щелочных водоёмах с аминокислотами». Статус?", "s12_a1_s2_o1": "Реконструкция", "s12_a1_s2_o2": "Показанная возможность", "s12_a1_s2_o3": "Наблюдение", "s12_a1_s2_o4": "Не следует из данных", "s12_a1_s2_e": "Верно. Утверждение о прошлом совместимо с экспериментом, но не доказано им: нужно ещё показать, что такие водоёмы существовали, что в них были активированные нуклеотиды и что цепи сохранялись и удлинялись. Гипотеза законна, если её так и называть", "s12_a1_s2_w2": "Эксперимент показал возможность реакции, а не то, где и когда она происходила", "s12_a1_s2_w3": "Событий четырёхмиллиардной давности никто не наблюдал", "s12_a1_s2_w4": "Как гипотеза утверждение допустимо: данные с ним совместимы, и оно не выдаёт себя за доказанное. Недопустимым было бы сказать, что эксперимент это доказывает", "s12_a1_s2_h1": "О каком времени говорит утверждение?", "s12_a1_s2_h2": "Выдаёт ли оно себя за доказанное?", "s12_a1_s2_h3": "Совместимо, но не доказано", "s12_a1_s3_q": "«Устройство рибосомы доказывает, что был этап эволюции совсем без белков». Статус?", "s12_a1_s3_o1": "Не следует из данных", "s12_a1_s3_o2": "Наблюдение", "s12_a1_s3_o3": "Реконструкция", "s12_a1_s3_o4": "Показанная возможность", "s12_a1_s3_e": "Верно. То, что пептидная связь образуется в центре из РНК, согласуется с древней ролью РНК в становлении трансляции. Но из этого не следует, что белков или пептидов не было совсем: РНК могла с самого начала работать вместе с короткими пептидами", "s12_a1_s3_w2": "Наблюдение — строение каталитического центра. Слово «доказывает» превращает его в вывод о прошлом, который из строения не следует", "s12_a1_s3_w3": "Гипотеза «был этап без белков» существует, но здесь она подана как доказанная, причём на основании, которое её не доказывает", "s12_a1_s3_w4": "Утверждение говорит не о том, что возможно, а о том, что было", "s12_a1_s3_h1": "Что именно наблюдают в рибосоме?", "s12_a1_s3_h2": "Что добавляет слово «доказывает»?", "s12_a1_s3_h3": "Согласуется ≠ доказывает", "s12_a1_s4_q": "Без аминокислот заметную долю цепей давал только гуаниновый нуклеотид, а с аминокислотами доли четырёх нуклеотидов сблизились. Что это добавляет?", "s12_a1_s4_o1": "Стали возможны спаривание и копирование по матрице", "s12_a1_s4_o2": "Это доказывает, что первые РНК были богаты гуанином", "s12_a1_s4_o3": "Это показывает, что аминокислоты возникли раньше РНК", "s12_a1_s4_o4": "Ничего нового: важен только общий выход цепей", "s12_a1_s4_e": "Верно. Если почти все цепи построены из одного нуклеотида, в смеси нет комплементарных партнёров и мало разнообразия последовательностей; при сближении долей четырёх нуклеотидов становятся возможными спаривание цепей и копирование по матрице. Результат делает реакцию интереснее для моделей происхождения, но не говорит, происходила ли она", "s12_a1_s4_w2": "Результат касается выхода реакции в эксперименте, а не состава первых РНК", "s12_a1_s4_w3": "Последовательность возникновения веществ эксперимент не устанавливает", "s12_a1_s4_w4": "Для образования двухцепочечных участков и копирования состав цепей существен", "s12_a1_s4_h1": "Зачем цепям разные нуклеотиды?", "s12_a1_s4_h2": "Что нужно для спаривания цепей?", "s12_a1_s4_h3": "Возможность стала полезнее, но осталась возможностью", "s12_a1_inv_q": "Два сценария совместимы с одними и теми же лабораторными результатами (короткие цепи РНК образуются при концентрировании и активации нуклеотидов): <b>С1</b> — высыхающие водоёмы наземных геотермальных полей; <b>С2</b> — пористые постройки щелочных гидротермальных источников на дне океана. Какие дополнительные данные повысили бы уверенность в одном из сценариев?", "s12_a1_inv_o1": "Существовала ли такая среда на ранней Земле в нужное время", "s12_a1_inv_o2": "Проходят ли все звенья цепи в условиях одной среды", "s12_a1_inv_o3": "Есть ли в среде исходные вещества и источник активации", "s12_a1_inv_o4": "В каком сценарии эксперимент дал больший выход цепей", "s12_a1_inv_o5": "Какой сценарий был предложен раньше другого", "s12_a1_inv_o6": "Воспроизводится ли реакция при многих повторах", "s12_a1_inv_x1": "Верно. Сценарий требует, чтобы его среда существовала; геохимические данные о древних породах повышают или понижают его правдоподобие", "s12_a1_inv_x2": "Верно. Сценарий, в котором синтез, накопление, активация и полимеризация требуют несовместимых условий, слабее сценария с совместимыми звеньями", "s12_a1_inv_x3": "Верно. Без исходных веществ и активации цепь не начнётся", "s12_a1_inv_x4": "Выход в лаборатории зависит от выбранных экспериментатором условий и не говорит, какая среда существовала", "s12_a1_inv_x5": "Время появления гипотезы не влияет на её доказательность", "s12_a1_inv_x6": "Повторение подтверждает воспроизводимость реакции, но не различает сценарии: она одинаково совместима с обоими", "s12_a1_inv_end": "Если таких данных нет, правильный ответ — «оба сценария совместимы с имеющимися данными»; выбирать один из них нет оснований", "s12_a1_concl": "Возможность процесса и историческая необходимость этого процесса — разные утверждения. Эксперимент переводит утверждение из категории «неизвестно, возможно ли» в категорию «возможно при таких условиях»; переход к утверждению «так было» требует других данных", "s12_a1_limits": "Модель не оценивает, какой сценарий происхождения жизни верен. Статусы — инструмент для чтения утверждений; граница между «показанной возможностью» и «реконструкцией» проходит по тому, о чём говорит утверждение — о возможном или о прошлом, — а не по важности результата", "s12_a1_new": "<b>Аминокислоты ускоряют образование РНК.</b> В современной клетке РНК участвует в синтезе белка из аминокислот. Недавно показали связь в обратном направлении. Раствор активированных нуклеотидов — с фосфатом, замкнутым в кольцо на рибозе, — высушивали в щелочной среде при комнатной температуре. Без аминокислот заметную долю цепей давал только гуаниновый нуклеотид, остальные — следовые количества. Добавление аминокислот, например валина, увеличивало выход цепей для цитидинового нуклеотида примерно в 120 раз, для аденинового — в 50 раз; доли четырёх нуклеотидов сблизились. Цепи оставались короткими — до семи нуклеотидов. Авторы объясняют действие аминокислот кислотно-основным катализом.\nЧто это значит. Показано, что аминокислоты могут без ферментов ускорять образование цепей РНК. Чего это не значит. Активированные нуклеотиды подавал экспериментатор; цепи в несколько раз короче известных рибозимов; эксперимент не показывает, где и когда такие реакции происходили", "s12_a1_how": "Выход цепей измеряли так: продукты реакции растворяли, разделяли по размеру и массе и считали, сколько образовалось цепей каждой длины и состава. Сравнивали пробы с аминокислотой и без неё при одинаковых условиях.", "s12_a1_mh1": "Есть ли в утверждении слово о прошлом («были», «образовались», «возник»)?", "s12_a1_mh2": "Что непосредственно измерено?", "s12_a1_mh3": "Добавляет ли формулировка больше, чем показывают данные?", "s12_a2_title": "Исследование 2. Репликатор, катализ и компартмент: когда возникает устойчивое наследуемое воспроизводство", "s12_a2_base": "Если при копировании ошибка в каждой позиции возникает с вероятностью μ и ошибки независимы, копия участка длиной L не содержит ни одной ошибки с вероятностью p = (1 − μ)^L. В модели функция катализатора сохраняется, только если копия необходимого участка безошибочна. Это допущение модели: в реальных молекулах часть замен функцию не нарушает", "s12_a2_scen1": "Функции порознь", "s12_a2_scen1_d": "компартмент есть, связи функции с ростом нет — доля функциональных систем падает так же, как доля функциональных молекул в растворе", "s12_a2_scen2": "Функции вместе", "s12_a2_scen2_d": "компартмент и связь функции с ростом — доля снижается к p, но не ниже p", "s12_a2_scen3": "Одна точность — три компартмента", "s12_a2_scen3_d": "μ = 0,03, L = 30 при трёх условиях: без компартмента, компартмент без связи функции с ростом, компартмент со связью", "s12_a2_scen4": "Слишком много ошибок", "s12_a2_scen4_d": "μ = 0,1, L = 60 — даже при связи функции с ростом функциональных систем почти не прибавляется", "s12_a2_pred": "Сначала предскажите: при μ = 0,03 и L = 30 доля систем с работающим катализатором через 10 циклов будет выше при связи функции с ростом или без неё? Во сколько примерно раз?", "s12_a2_rules": "1. Без ресурсов копирования нет; системы не растут и не делятся. Показания: «—», подпись «копирования нет».\n2. Без компартмента функциональные и испорченные молекулы копируются одинаково: доля функциональных молекул после n циклов равна ((1 + p)/2)^n. С компартментом, но без связи функции с ростом все системы растут и делятся одинаково, и доля систем с работающим катализатором изменяется так же.\n3. С компартментом и связью функции с ростом системы с работающим катализатором делятся каждый цикл, а системы без него не растут: функциональных систем становится F·(1 + p), нефункциональных прибавляется F·(1 − p). Доля функциональных систем снижается от 1 и стремится к p сверху; ниже p она не опускается.", "s12_a2_cap_sep": "Граница есть, но полезная функция не влияет на размножение своей системы: системы с испорченной копией делятся так же часто. Ошибки копирования накапливаются, и функциональных систем становится всё меньше", "s12_a2_cap_tog": "Системы с работающим катализатором делятся, системы без него — нет. Ошибки по-прежнему возникают, но не вытесняют функцию из популяции", "s12_a2_cap_same_mu": "Точность копирования одна и та же, а доля функциональных систем — 0,03, 0,03 и 0,41. Различие создают не ошибки, а то, удерживается ли репликатор вместе с продуктом и связана ли его функция с воспроизводством системы", "s12_a2_cap_err": "Безошибочная копия почти не получается: функциональная система практически не оставляет функциональных потомков. Длинный необходимый участок при такой точности не сохраняется", "s12_a2_s1_q": "При μ = 0,01 увеличьте L с 10 до 60. Как изменится доля систем с катализатором при связи функции с ростом?", "s12_a2_s1_o1": "Снизится с 0,90 примерно до 0,55", "s12_a2_s1_o2": "Не изменится: точность та же", "s12_a2_s1_o3": "Увеличится: длинный работает лучше", "s12_a2_s1_o4": "Упадёт до нуля за 10 циклов", "s12_a2_s1_e": "Верно. Чем длиннее необходимый участок, тем реже копия безошибочна: вероятность (1 − μ)^L падает с ростом L. При низкой точности копирования длина последовательности, которую можно устойчиво передавать, ограничена", "s12_a2_s1_w2": "Точность на нуклеотид та же, но позиций, где может возникнуть ошибка, стало в 6 раз больше", "s12_a2_s1_w3": "В модели польза катализатора не зависит от длины; длина влияет только на вероятность ошибки", "s12_a2_s1_w4": "При μ = 0,01 и L = 60 безошибочна больше половины копий", "s12_a2_s1_h1": "Что зависит от L в формуле?", "s12_a2_s1_h2": "Сколько позиций должно скопироваться без ошибки?", "s12_a2_s1_h3": "Больше позиций — меньше вероятность безошибочной копии", "s12_a2_s2_q": "μ = 0,03, L = 30. Включите компартмент, но не связь функции с ростом. Что происходит с долей функциональных систем?", "s12_a2_s2_o1": "Падает до 0,03 — так же, как и вне компартмента", "s12_a2_s2_o2": "Держится около p: граница удерживает катализатор", "s12_a2_s2_o3": "Растёт: в компартменте выше концентрация", "s12_a2_s2_o4": "Не определена: системы перестают делиться", "s12_a2_s2_e": "Верно. Полимераза есть в каждой системе, поэтому системы с испорченной копией тоже копируют РНК, растут и делятся. Если полезная функция не ускоряет рост своей системы, функциональные и нефункциональные системы делятся одинаково, и ошибки копирования постепенно вытесняют функцию. Граница помогает, только когда связывает функцию молекулы с размножением системы", "s12_a2_s2_w2": "Удержание есть, но системы с испорченной копией делятся так же часто, как функциональные", "s12_a2_s2_w3": "В модели концентрация не влияет на отбор; без связи функции с ростом отбора систем нет", "s12_a2_s2_w4": "Деление происходит; оно просто не зависит от функции", "s12_a2_s2_h1": "От чего зависит деление системы без связи функции с ростом?", "s12_a2_s2_h2": "Сравните два столбца долей в таблице", "s12_a2_s2_h3": "Граница + связь функции с ростом", "s12_a2_s3_q": "Почему в модели при связи функции с ростом доля функциональных систем не остаётся равной 1, а снижается к p?", "s12_a2_s3_o1": "Ошибки появляются в каждом цикле заново", "s12_a2_s3_o2": "Потому что нуклеотидов в среде не хватает", "s12_a2_s3_o3": "Потому что модель построена с ошибкой", "s12_a2_s3_o4": "Потому что функциональные системы гибнут", "s12_a2_s3_e": "Верно. Каждая функциональная система при делении с вероятностью 1 − p даёт одного нефункционального потомка; отбор не даёт таким потомкам размножаться, но и не превращает их обратно в функциональные. Поэтому доля систем с катализатором снижается и приближается к вероятности безошибочной копии p сверху; ниже p она не опускается", "s12_a2_s3_w2": "Ресурсы в модели не ограничены", "s12_a2_s3_w3": "Это следствие правил модели: ошибки возникают в каждом цикле и не исправляются", "s12_a2_s3_w4": "В модели системы не гибнут; нефункциональные просто не делятся", "s12_a2_s3_h1": "Откуда берутся нефункциональные системы?", "s12_a2_s3_h2": "Может ли отбор превратить ошибочную копию в правильную?", "s12_a2_s3_h3": "Перечитайте правило 3: что прибавляется к нефункциональным системам в каждом цикле?", "s12_a2_s4_q": "Утверждение: «При частоте ошибок 0,1 никакой репликатор не может сохраняться». Верно ли оно?", "s12_a2_s4_o1": "Нет: короткий участок сохраняется", "s12_a2_s4_o2": "Да: 0,1 — универсальный порог ошибок", "s12_a2_s4_o3": "Да, если участок длиннее нуклеотида", "s12_a2_s4_o4": "Нет: ошибки на функцию не влияют", "s12_a2_s4_e": "Верно. В модели при μ = 0,1 участок из 10 нуклеотидов сохраняется примерно у трети систем. Порог ошибок — не универсальная константа: он зависит от того, сколько позиций должно скопироваться без ошибки, сколько замен функция выдерживает и насколько сильно отбор отсеивает нефункциональные варианты", "s12_a2_s4_w2": "Число 0,1 в модели — порядок величины для лабораторных рибозимов, а не физическая константа", "s12_a2_s4_w3": "При L = 10 доля функциональных систем около 0,36 — функция сохраняется", "s12_a2_s4_w4": "При μ = 0,1 и L = 60 функция почти не сохраняется — ошибки влияют сильно", "s12_a2_s4_h1": "Найдите строку μ = 0,1, L = 10", "s12_a2_s4_h2": "От каких допущений зависит результат?", "s12_a2_s4_h3": "Порог — свойство системы, а не число природы", "s12_a2_inv_q": "Две условные системы содержат одинаковый рибозим; точность копирования в них одинакова (μ = 0,03, L = 30). В системе 1 доля систем с работающим рибозимом через 10 циклов около 0,41, в системе 2 — около 0,03. Какие условия могут объяснить различие?", "s12_a2_inv_o1": "В системе 2 функция не связана с ростом", "s12_a2_inv_o2": "В системе 2 продукт уходит к соседям", "s12_a2_inv_o3": "В системе 2 РНК не удерживается внутри", "s12_a2_inv_o4": "Разная точность копирования в двух системах", "s12_a2_inv_o5": "Разная длина одинакового рибозима", "s12_a2_inv_o6": "В системе 2 меньше нуклеотидов в среде", "s12_a2_inv_x1": "Верно. Без связи функции с ростом системы с испорченной копией делятся так же часто, и доля функциональных падает даже при умеренной точности", "s12_a2_inv_x2": "Верно. Если мембрана не удерживает продукт рибозима, преимущество получает не только носитель функции", "s12_a2_inv_x3": "Верно. Если рибозим и его копии выходят из компартмента, система не передаёт их дочерним системам, и копирование идёт как в общем растворе", "s12_a2_inv_x4": "По условию точность одинакова; различие объясняют условия удержания и воспроизводства", "s12_a2_inv_x5": "Рибозим по условию одинаковый, значит, и длина необходимого участка одна", "s12_a2_inv_x6": "Ресурсы в модели не ограничены; при одинаковой точности доля функциональных систем от запаса нуклеотидов не зависит", "s12_a2_inv_end": "Одно и то же показание — низкая доля функциональных систем — может иметь разные причины даже при одинаковой точности копирования. Различают их измерения промежуточных величин: роста, удержания продукта и удержания репликатора", "s12_a2_inv2_q": "Какие измерения различат эти причины?", "s12_a2_inv2_o1": "Скорость роста систем с рибозимом и без", "s12_a2_inv2_o2": "Остаётся ли продукт внутри системы", "s12_a2_inv2_o3": "Остаётся ли меченая РНК в везикуле", "s12_a2_inv2_o4": "Частота ошибок в прочитанных копиях", "s12_a2_inv2_o5": "Число систем в последнем цикле", "s12_a2_inv2_x1": "Верно: при связи функции с ростом первые растут быстрее", "s12_a2_inv2_x2": "Верно: это проверяет удержание продукта", "s12_a2_inv2_x3": "Верно: это проверяет удержание самого репликатора", "s12_a2_inv2_x4": "Точность по условию одинакова; это измерение причин не различит", "s12_a2_inv2_x5": "Это тот же показатель, который нужно объяснить; он не различает причины", "s12_a2_concl": "Отдельный репликатор не образует устойчиво воспроизводящейся системы: нужны точность копирования, достаточная для длины необходимой последовательности, удержание продуктов и связь функции с размножением системы. Модель показывает необходимость сочетания функций, но не порядок, в котором они возникли", "s12_a2_limits": "Модель не воспроизводит действительную химическую эволюцию и не утверждает, что первые репликаторы были рибозимами. Число 0,1 — порядок величины для рибозимов, полученных в лаборатории, а не измерение древних молекул. Допущение «любая ошибка выключает функцию» упрощает реальность: часть замен функцию не нарушает. Полимераза в модели отделена от копируемого рибозима и не изменяется; если бы копировать себя могла только сама функциональная молекула, испорченная копия не размножалась бы, и компартмент уже этим ограничивал бы ошибки. Деление систем, поступление ресурсов и одна копия за цикл — условия модели. Это не описание способа получить самовоспроизводящуюся систему", "s12_a2_new": "<b>Копирование по матрице внутри модельной протоклетки.</b> Исследователи поместили внутрь везикул из жирных кислот и их производных короткую цепь ДНК — матрицу с затравкой — и добавили активированные нуклеотиды снаружи. Нуклеотиды проходили через мембрану без белков-переносчиков (в везикулах диаметром около 100 нм их концентрации внутри и снаружи выравнивались наполовину примерно за 12 часов) и внутри присоединялись к затравке по матрице без ферментов. Через сутки полноразмерных продуктов в везикулах было примерно столько же, сколько в такой же реакции в растворе. Матрица и затравка из везикул не выходили. В везикулах из фосфолипидов, похожих на современные мембраны, удлинения затравки не было: эти мембраны не пропускали активированные нуклеотиды.\nЧто это значит. Граница может удерживать репликатор и при этом пропускать к нему «строительный материал» — так в одном эксперименте сочетаются удержание и снабжение. Чего это не значит. Копировалась одна короткая однородная матрица, использовались химически изменённые нуклеотиды, а копия не становилась новой матрицей; деления везикул и передачи копий дочерним системам в этом эксперименте не было. Это не самовоспроизводящаяся протоклетка и не реконструкция ранних мембран", "s12_a2_how": "Затравку метили радиоактивным фосфором и после реакции разделяли продукты по длине электрофорезом: по полосам видно, на сколько нуклеотидов удлинилась затравка. Ту же реакцию проводили в растворе без везикул и в везикулах из фосфолипидов (контроли), а отдельно проверяли, не выходят ли из везикул меченые олигонуклеотиды.", "s12_a3_title": "Исследование 3. Один и тот же список линий — несколько историй гена", "s12_a3_base": "Ортологи — гены разных линий, разошедшиеся при разделении линий; паралоги — копии, возникшие при дупликации гена в одной линии. Если в предке было две копии-паралога, а разные потомки сохранили разные копии, гены потомков можно ошибочно принять за ортологи. Геномное окружение гена — соседние гены и участки хромосомы, в которой ген расположен", "s12_a3_h1": "Наследование и потери", "s12_a3_h1_d": "ген был у LUCA; потерян независимо в линиях Б1 и Б3", "s12_a3_h2": "Перенос", "s12_a3_h2_d": "ген возник в общем предке архей и эукариот; одна копия перенесена к Б2", "s12_a3_h3": "Дупликация и разные копии", "s12_a3_h3_d": "у LUCA были два паралога, Т-α и Т-β; бактерия Б2 сохранила Т-α, археи и эукариоты — Т-β; в Б1 и Б3 обе копии потеряны", "s12_a3_e1": "Дерево гена Т", "s12_a3_e1_o1": "ген Б2 лежит внутри группы архей рядом с А1", "s12_a3_e1_o2": "ген Б2 отделён от архейных генов у основания дерева", "s12_a3_e2": "Сходство последовательностей", "s12_a3_e2_o1": "ген Б2 сходен с генами архей сильнее, чем ожидалось бы для столь далёких линий", "s12_a3_e3": "Геномное окружение гена", "s12_a3_e3_o1": "ген Б2 находится на мобильном генетическом элементе; состав нуклеотидов отличается от окружающего генома", "s12_a3_e4": "Данные о гомологии", "s12_a3_e4_o1": "у Б2 и у архей найден второй, отдалённо сходный ген того же семейства", "s12_a3_e5": "Независимые признаки", "s12_a3_e5_o1": "соседние гены того же пути у Б2 тоже сходны с архейными", "s12_a3_scen1": "Распределение одно — деревья разные", "s12_a3_scen1_d": "модель показывает дерево гена для h1 и для h2 рядом", "s12_a3_scen2": "Дерево одно — истории разные", "s12_a3_scen2_d": "дерево, где ген Б2 отделён у основания, совместимо и с h1, и с h3", "s12_a3_pred": "Какие из трёх историй совместимы с распределением «есть у Б2, А1, А2, Э; нет у Б1, Б3»?", "s12_a3_table_note": "Стрелки показывают направление, а не силу. Каждое свидетельство может ввести в заблуждение: дерево бывает построено с ошибкой, состав нуклеотидов перенесённого гена со временем выравнивается с окружающим геномом, отдалённое сходство бывает случайным", "s12_a3_cap_trees": "В истории наследования ген Б2 отделён от архейных генов у основания дерева; в истории переноса он лежит среди архейных генов", "s12_a3_cap_para": "Если разные линии сохранили разные копии древней дупликации, дерево гена похоже на дерево клеток, хотя гены — не ортологи", "s12_a3_s1_q": "Раскройте свидетельство e3: ген Б2 находится на мобильном генетическом элементе, состав нуклеотидов отличается от окружающего генома. Что это меняет?", "s12_a3_s1_o1": "Делает перенос вероятнее, но не доказывает", "s12_a3_s1_o2": "Доказывает перенос: других объяснений нет", "s12_a3_s1_o3": "Опровергает перенос: гены там не живут", "s12_a3_s1_o4": "Ничего: окружение гена не связано с историей", "s12_a3_s1_e": "Верно. Мобильные элементы часто переносят гены между линиями, а необычный состав нуклеотидов указывает на недавнее приобретение. При древнем наследовании или древней дупликации такое окружение не ожидается. Но ген мог попасть на мобильный элемент и позже, внутри своей линии; поэтому вывод остаётся вероятностным", "s12_a3_s1_w2": "Это довод в пользу переноса, а не доказательство: каждое отдельное свидетельство может иметь другое объяснение", "s12_a3_s1_w3": "Наоборот, такое окружение часто связано с переносом: мобильные элементы несут гены", "s12_a3_s1_w4": "Свидетельство различает истории: оно ожидаемо при переносе и не ожидаемо при древнем наследовании", "s12_a3_s1_h1": "Что переносят мобильные элементы?", "s12_a3_s1_h2": "Почему состав нуклеотидов может отличаться?", "s12_a3_s1_h3": "Повышает ≠ доказывает", "s12_a3_s2_q": "Свидетельство e1: ген Б2 отделён от архейных генов у основания дерева. Какие истории остаются?", "s12_a3_s2_o1": "Наследование с потерями и дупликация", "s12_a3_s2_o2": "Только наследование с потерями в Б1 и Б3", "s12_a3_s2_o3": "Только перенос от архей к линии Б2", "s12_a3_s2_o4": "Все три истории в равной степени", "s12_a3_s2_e": "Верно. Такое дерево ожидается, если ген Б2 разошёлся с архейными генами в самом начале, — так и при вертикальном наследовании, и при древней дупликации; перенос становится менее вероятным. Различить две оставшиеся истории помогут данные о гомологии (e4): есть ли у линий вторые копии того же семейства", "s12_a3_s2_w2": "Дупликация с сохранением разных копий даёт похожее дерево", "s12_a3_s2_w3": "При переносе ген Б2 лежал бы среди архейных генов", "s12_a3_s2_w4": "Перенос с таким деревом согласуется хуже", "s12_a3_s2_h1": "Где лежит ген Б2 на дереве в каждой истории?", "s12_a3_s2_h2": "Какая история даёт похожее на h1 дерево?", "s12_a3_s2_h3": "Паралоги маскируются под ортологи", "s12_a3_s3_q": "Какое утверждение об истории гена Т и истории клеточных линий верно?", "s12_a3_s3_o1": "Перенос гена к Б2 не делает линию Б2 археей", "s12_a3_s3_o2": "Если ген Б2 архейный, Б2 надо отнести к археям", "s12_a3_s3_o3": "Дерево клеток строят по одному любому гену", "s12_a3_s3_o4": "История гена всегда повторяет историю линии", "s12_a3_s3_e": "Верно. История гена может не совпадать с историей линий. Дерево клеточных линий отражает преемственность клеточного воспроизводства; дерево отдельного гена может с ним расходиться. Б2 остаётся бактерией, даже если один из её генов получен от архей", "s12_a3_s3_w2": "Положение линии на дереве клеток определяют многие гены, а не один", "s12_a3_s3_w3": "Его строят по многим генам, особенно по консервативным генам информационных систем", "s12_a3_s3_w4": "Перенос, потери и дупликации делают истории генов разными", "s12_a3_s3_h1": "Что отражает дерево клеток?", "s12_a3_s3_h2": "Сколько генов определяют положение линии?", "s12_a3_s3_h3": "Ген ≠ линия", "s12_a3_inv_q": "Дерево гена Т уже показало, что ген Б2 отделён от архейных генов у основания дерева: остаются наследование с потерями (h1) и древняя дупликация (h3). Какое свидетельство различит эти две истории?", "s12_a3_inv_o1": "Есть ли у линий вторые копии семейства", "s12_a3_inv_o2": "Ещё одно дерево гена Т, построенное другим методом", "s12_a3_inv_o3": "Геномное окружение гена Б2 на его хромосоме", "s12_a3_inv_o4": "Соседние гены того же пути у линии Б2", "s12_a3_inv_e": "Верно. При древней дупликации у линий должны находиться следы второй копии того же семейства (e4); при простом наследовании с потерями — нет. Дерево гена h1 и h3 не различает, а геномное окружение и соседние гены одинаково понижают уверенность в обеих историях", "s12_a3_inv_w2": "Дерево гена при h1 и h3 выглядит одинаково: ген Б2 отделён от архейных у основания. Другой метод этого не изменит", "s12_a3_inv_w3": "Мобильный элемент и необычный состав нуклеотидов говорили бы о переносе, а h1 и h3 по этому признаку не различаются", "s12_a3_inv_w4": "Если соседние гены тоже архейные, это довод за перенос; между h1 и h3 он не различает", "s12_a3_concl": "Одна современная картина распределения генов совместима с несколькими историями. Уверенность в истории растёт, когда несколько независимых свидетельств указывают в одну сторону; вывод о предке остаётся вероятностным. Историю гена нельзя подменять историей вида или клеточной линии", "s12_a3_limits": "Условное дерево не является реконструкцией реальной ранней эволюции. Модель не учитывает статистических методов построения деревьев и оценки переносов. При сотнях геномов само распределение гена по дереву видов становится сильным свидетельством переноса или потерь. Стрелки влияния свидетельств — качественные", "s12_a3_new": "<b>Комплекс, который терялся больше тридцати раз.</b> Хромосомы эукариот организуют комплексы SMC (белки поддержания структуры хромосом); к ним относятся когезин, удерживающий сестринские хроматиды вместе, и конденсины, уплотняющие хромосомы перед делением. У большинства прокариот один такой комплекс, у эукариот обычно четыре. Сравнив геномы множества эукариот, исследователи пришли к выводу, что у LECA были все четыре комплекса. Один из них, конденсин II, затем независимо утрачивался не менее 30 раз в разных ветвях эукариот. Поэтому отсутствие конденсина II у организма — наблюдение, которое почти ничего не говорит о его предках.\nПример неоднозначности: у грибов конденсин II считали отсутствующим, но его нашли у одного рода грибов. Это может быть сохранившееся наследство предка или приобретение путём переноса; построенные деревья белков не позволили однозначно выбрать. Ещё одно ограничение: в неполностью прочитанном геноме ген может быть не найден, хотя он есть, — поэтому утрату комплекса признавали, только если не найдены все его особые субъединицы.\nКак это связано с исследованием. Распределение «у одних есть, у других нет» здесь в основном объясняется многократными потерями, а не поздним приобретением. Авторы также предполагают, что исходный комплекс удвоился ещё у архейных предков эукариот, — это реконструкция с невысокой статистической поддержкой глубоких ветвей", "s12_a3_how": "Для каждого белка искали гомологи в геномах сотен эукариот; затем отмечали на дереве эукариот, где комплекс есть и где нет, и находили наименьшее число событий, объясняющих картину.", "s12_a4_title": "Исследование 4. Что установлено о происхождении эукариотической клетки, а что остаётся гипотезой", "s12_a4_base": "Гипотезы о порядке событий:\n- <b>Гипотеза ранней митохондрии</b>: приобретение митохондрии предшествовало ядру и эндомембранам и сделало возможным усложнение клетки; к ним относятся водородная и синтрофные гипотезы, начинающие с обмена метаболитами между археей и бактерией.\n- <b>Гипотеза поздней митохондрии</b>: сложный архейный хозяин уже имел элементы ядра, эндомембран и цитоскелета до приобретения митохондрии; часть вариантов допускает захват бактерии фагоцитозом («сначала фагоцитоз»).\n- <b>Модель «изнутри наружу»</b>: цитоплазма и эндомембраны возникли из выростов архейной клетки вокруг бактерий-партнёров; тело археи стало будущим ядром.\nСинтрофия — взаимозависимый обмен метаболитами, при котором совместная деятельность партнёров делает реакции энергетически возможными или более выгодными. Дупликация гена до LECA оставляет у современных эукариот две родственные копии; если датировать время дупликации, можно оценить, когда появилась функция, связанная с одной из копий. Время событий на дереве генов оценивают молекулярными часами: по числу замен в последовательностях, привязав несколько узлов дерева к известному возрасту (калибровки); результат зависит от выбранных калибровок и модели скоростей замен", "s12_a4_e1": "филогенетическое родство митохондриальных генов с генами альфа-протеобактерий", "s12_a4_e2": "организация митохондриальных мембран (две мембраны; внутренняя — с бактериальными свойствами)", "s12_a4_e3": "особенности митохондриальных матричных процессов: собственная ДНК, рибосомы и факторы трансляции бактериального типа", "s12_a4_e4": "гомология белков информационных систем эукариот и архей (транскрипция, трансляция, упаковка ДНК)", "s12_a4_e5": "асгардархеи: в геномах — гомологи эукариотических белков актиновой системы, мембранного ремоделирования и убиквитиноподобной модификации; культивированные клетки имеют выросты мембраны; в теле клетки и в выростах одной из культур найдены нити гомолога актина (наблюдение), а их роль в формировании выростов — предположение авторов; по размеру и сложности клетки остаются прокариотами", "s12_a4_e6": "сравнение эндомембранных компартментов: у всех изученных групп эукариот сходный основной набор; он реконструируется у LECA", "s12_a4_e7": "различия между современными линиями эукариот: у всех есть митохондрии или их производные; эукариоты, изначально лишённые митохондрий, не найдены", "s12_a4_e8": "датировки дупликаций генов: дупликации генов цитоскелета, мембранного транспорта, эндомембран и ядра в основном датируются временем до появления генов, связанных с митохондрией", "s12_a4_v1": "Митохондрии произошли от альфа-протеобактериального эндосимбионта", "s12_a4_v2": "Клетка-хозяин принадлежала к архейной линии, близкой к асгардархеям", "s12_a4_v3": "Митохондрия была у LECA", "s12_a4_v4": "Ядро, эндомембраны и цитоскелет в основном возникли до митохондрии", "s12_a4_v5": "Митохондрия появилась раньше и стала условием усложнения клетки", "s12_a4_v6": "Хозяин захватил предка митохондрии фагоцитозом", "s12_a4_scen1": "Принцип и порядок", "s12_a4_scen1_d": "включены e1–e7", "s12_a4_scen2": "Новые данные о порядке", "s12_a4_scen2_d": "добавлено e8", "s12_a4_rule1_n": "Ослаблено новыми данными", "s12_a4_rule1": "есть «↓ (зависит от модели)» и нет ни одного «↑» любого вида", "s12_a4_rule2_n": "Данных в поддержку нет", "s12_a4_rule2": "нет ни одного «↑» любого вида", "s12_a4_rule3_n": "Поддержано, но зависит от допущений", "s12_a4_rule3": "среди опор есть «↑ (зависит от модели)»", "s12_a4_rule4_n": "Убедительно поддержано", "s12_a4_rule4": "«↑» от двух или более включённых свидетельств, среди них хотя бы одно «↑» без пометок; второй опорой может быть и «↑ слабо»", "s12_a4_rule5_n": "Поддержано, но зависит от допущений", "s12_a4_rule5": "«↑ слабо» от двух или более свидетельств и ни одного «↑» без пометок", "s12_a4_rule6_n": "Поддержано одним свидетельством", "s12_a4_rule6": "одно «↑» без пометок", "s12_a4_rule7_n": "Совместимо с данными, не доказано", "s12_a4_rule7": "одно «↑ слабо»", "s12_a4_pred": "Прежде чем включить свидетельства: какие утверждения, по-вашему, окажутся поддержаны сильнее всего?", "s12_a4_rules": "1. «Ослаблено новыми данными» — есть «↓ (зависит от модели)» и нет ни одного «↑» любого вида;\n2. «Данных в поддержку нет» — нет ни одного «↑» любого вида;\n3. «Поддержано, но зависит от допущений» — среди опор есть «↑ (зависит от модели)»;\n4. «Убедительно поддержано» — «↑» от двух или более включённых свидетельств, среди них хотя бы одно «↑» без пометок; второй опорой может быть и «↑ слабо»;\n5. «Поддержано, но зависит от допущений» — «↑ слабо» от двух или более свидетельств и ни одного «↑» без пометок;\n6. «Поддержано одним свидетельством» — одно «↑» без пометок;\n7. «Совместимо с данными, не доказано» — одно «↑ слабо».", "s12_a4_e6_note": "Это свидетельство говорит о LECA, но не о порядке событий до него", "s12_a4_cap_principle": "Происхождение митохондрии от бактерии и архейное происхождение хозяина поддержаны независимыми данными. Порядок событий этими данными не установлен", "s12_a4_cap_order": "Датировки дупликаций сдвигают оценку в пользу поздней митохондрии. Но датировки получены моделью молекулярных часов: другие калибровки или допущения могут изменить вывод", "s12_a4_s1_q": "Включите только e7: у всех изученных эукариот есть митохондрии или их производные. Какие утверждения это затрагивает?", "s12_a4_s1_o1": "Поддерживает v3; порядка событий никак не касается", "s12_a4_s1_o2": "Поддерживает v5: митохондрия была самой ранней", "s12_a4_s1_o3": "Поддерживает v1: указывает на альфа-протеобактерий", "s12_a4_s1_o4": "Ничего: производные митохондрий — другие органеллы", "s12_a4_s1_e": "Верно. Если у всех линий есть митохондрии или их производные, а исходно безмитохондриальных эукариот нет, проще всего объяснить это тем, что митохондрия была у общего предка — LECA. Но LECA — конец стволовой линии: о том, что появилось раньше, ядро или митохондрия, это свидетельство не говорит", "s12_a4_s1_w2": "Митохондрия у LECA не означает, что она появилась раньше ядра: LECA уже имел и ядро, и эндомембраны", "s12_a4_s1_w3": "Распределение органелл по линиям эукариот не говорит, от какой группы бактерий они произошли; это показывают деревья генов (e1)", "s12_a4_s1_w4": "Гидрогеносомы и митосомы — производные митохондрий; их распространение — довод о митохондрии у LECA", "s12_a4_s1_h1": "О каком времени говорит это свидетельство — о LECA или раньше?", "s12_a4_s1_h2": "Что объясняет митохондрии у всех линий?", "s12_a4_s1_h3": "LECA — конец стволовой линии", "s12_a4_s2_q": "Включены e1–e7 без e8. Какова степень поддержки утверждения «Ядро, эндомембраны и цитоскелет в основном возникли до митохондрии»?", "s12_a4_s2_o1": "Совместимо с данными, не доказано", "s12_a4_s2_o2": "Убедительно поддержано", "s12_a4_s2_o3": "Ослаблено новыми данными", "s12_a4_s2_o4": "Поддержано одним свидетельством", "s12_a4_s2_e": "Верно. Свидетельства e1–e7 убедительно говорят о происхождении участников и о том, что у LECA была митохондрия. О порядке событий они ничего не говорят, кроме слабого довода от асгардархей. Это и есть главный методический урок: убедительность принципа не переносится на последовательность событий", "s12_a4_s2_w2": "Ни одно из свидетельств e1–e7 прямо не датирует события", "s12_a4_s2_w3": "Данных против этого утверждения среди e1–e7 нет", "s12_a4_s2_w4": "Единственная опора — асгардархеи (e5), и она слабая: гомологи белков не показывают, когда появились работающие системы", "s12_a4_s2_h1": "Какие свидетельства говорят о времени?", "s12_a4_s2_h2": "Что говорит e6 о порядке?", "s12_a4_s2_h3": "Принцип ≠ хронология", "s12_a4_s3_q": "Включите e8 (датировки дупликаций). Почему утверждение v4 получает степень «поддержано, но зависит от допущений», а не «убедительно поддержано»?", "s12_a4_s3_o1": "Все даты дала одна модель с калибровками", "s12_a4_s3_o2": "Дупликации не связаны с функциями клетки", "s12_a4_s3_o3": "Датировки противоречат эндосимбиозу", "s12_a4_s3_o4": "Это свидетельство признано неверным", "s12_a4_s3_e": "Верно. Это сильный и новый довод, но он опирается на модель молекулярных часов: скорость накопления замен и калибровки по ископаемым и геохимии задаются допущениями; другие допущения могут изменить порядок. Независимого подтверждения другим типом данных пока нет", "s12_a4_s3_w2": "Многие дуплицированные гены связаны именно с ядром, эндомембранами и цитоскелетом — поэтому их датировки и информативны", "s12_a4_s3_w3": "Датировки касаются порядка событий, а не самого эндосимбиоза", "s12_a4_s3_w4": "Свидетельство не объявляется неверным; оно оценивается с учётом допущений, на которых построено", "s12_a4_s3_h1": "Каким способом получены датировки?", "s12_a4_s3_h2": "Есть ли подтверждение другим типом данных?", "s12_a4_s3_h3": "Какое правило на странице даёт степень «поддержано, но зависит от допущений»?", "s12_a4_inv_q": "Две гипотезы — ранней и поздней митохондрии — совместимы со свидетельствами e1–e7. Какие наблюдения могли бы различить их?", "s12_a4_inv_o1": "Согласованные датировки разными методами", "s12_a4_inv_o2": "Фагоцитоз у архей, близких к эукариотам", "s12_a4_inv_o3": "Порядок появления семейств генов до LECA", "s12_a4_inv_o4": "Число мембран у современных митохондрий", "s12_a4_inv_o5": "Число генов в митохондриальной ДНК человека", "s12_a4_inv_o6": "Мнение большинства специалистов", "s12_a4_inv_x1": "Верно. Если разные методы датирования согласованно показывают порядок появления генов ядра, эндомембран и генов митохондриального происхождения, уверенность растёт", "s12_a4_inv_x2": "Верно. Такая находка показала бы, что сложность возможна без митохондрии; она не доказала бы историю, но сделала бы гипотезу поздней митохондрии правдоподобнее", "s12_a4_inv_x3": "Верно. Согласованная реконструкция порядка появления многих независимых семейств генов до LECA повысила бы уверенность в порядке событий", "s12_a4_inv_x4": "Две мембраны есть у митохондрий при любой из гипотез", "s12_a4_inv_x5": "Состав мтДНК одной современной линии отражает поздние потери и переносы, а не порядок событий до LECA", "s12_a4_inv_x6": "Согласие исследователей не заменяет данных", "s12_a4_inv_end": "Если различающих наблюдений недостаточно, правильный научный ответ — «порядок событий остаётся предметом обсуждения». Произвольный выбор одной гипотезы — не вывод", "s12_a4_concl": "Свидетельства могут убедительно поддерживать сам факт эндосимбиотического происхождения митохондрий, не устанавливая с сопоставимой уверенностью точный порядок формирования остальных структур эукариотической клетки", "s12_a4_limits": "Модель не изображает реальную хронологию эукариогенеза. Стрелки влияния и правила статуса — учебные; в науке оценка доказательности сложнее и включает статистические меры. Модель не приписывает гипотетическому предку определённого набора органелл: она показывает только, что из данных следует и что нет", "s12_a4_new": "<b>Датировки дупликаций генов и порядок событий.</b> Многие гены, необходимые ядру, цитоскелету и мембранному транспорту, у эукариот представлены семействами родственных копий, возникших при дупликациях до LECA. Исследователи оценили время этих дупликаций с помощью молекулярных часов — модели, связывающей число замен в последовательностях со временем, — и калибровок по ископаемым и геохимическим данным. По их оценке, линия хозяина отделилась от ближайших родственников среди асгардархей около 3,05–2,79 млрд лет назад, линия предка митохондрии от альфа-протеобактерий — около 2,37–2,13 млрд лет назад, LECA существовал около 1,80–1,67 млрд лет назад. Дупликации генов цитоскелета, мембранного транспорта, эндомембран, фагоцитоза и ядра в основном пришлись на интервал 3,0–2,25 млрд лет назад, то есть до митохондриального эндосимбиоза. Авторы считают, что это позволяет отвергнуть гипотезы ранней митохондрии и поддерживает последовательность «сначала усложнённая архея, затем митохондрия».\nКак к этому относиться. Это сильный новый довод, но все даты — модельные оценки; они зависят от выбора генов, калибровок и модели скоростей замен. Время дупликации гена не равно времени, когда связанная с ним функция начала работать в клетке. Поэтому вопрос о порядке событий остаётся предметом обсуждения", "s12_a4_how": "Молекулярные часы: по дереву генов и числу замен на ветвях модель рассчитывает, сколько времени прошло между узлами дерева; несколько узлов привязывают к возрасту по ископаемым или изотопным данным (калибровки). Результат — интервал вероятных значений.", "s12_int_border": "Карта показывает, как блоки зависят друг от друга в работающей современной клетке. Она не показывает, в каком порядке эти блоки возникали в истории жизни", "s12_int_cond": "Условная минимальная клетка живёт в среде, где есть органические мономеры, но нет готового АТФ. Наблюдение — сохраняет ли популяция таких клеток наследуемое воспроизводство в течение многих поколений. Выберите три–четыре связанных блока. Пять вопросов — для одного из трёх предложенных наборов; для собственного связного набора — три общих вопроса", "s12_int_edge_note": "Многие зависимости взаимны: ферменты нужны для копирования ДНК, а ДНК — для синтеза ферментов. Взаимность описывает работу системы, а не порядок её возникновения", "s12_int_B1": "Мембранная граница", "s12_int_B1_d": "липидный бислой, избирательная проницаемость, компартменты", "s12_int_B2": "Транспорт и обмен со средой", "s12_int_B2_d": "каналы, переносчики, насосы, эндоцитоз, экзоцитоз", "s12_int_B3": "Доступность энергетических ресурсов", "s12_int_B3_d": "АТФ, протонный градиент, АТФ-синтаза", "s12_int_B4": "Каталитические реакции", "s12_int_B4_d": "ферменты, рибозимы, рибосома как рибозим", "s12_int_B5": "Наследственная информация", "s12_int_B5_d": "ДНК, ген, генетический код", "s12_int_B6": "Воспроизведение информационных молекул", "s12_int_B6_d": "репликация, точность копирования, репарация", "s12_int_B7": "Производство функциональных компонентов", "s12_int_B7_d": "транскрипция, процессинг, трансляция, адресация, регуляция", "s12_int_B8": "Воспроизводство системы", "s12_int_B8_d": "клеточный цикл, деление, распределение хромосом и органелл", "s12_int_B9": "Наследуемая изменчивость", "s12_int_B9_d": "мутации, ошибки копирования, передача различий потомкам", "s12_int_INT_E1": "удерживает молекулы рядом", "s12_int_INT_E2": "поставляет субстраты", "s12_int_INT_E3": "даёт энергию", "s12_int_INT_E4": "ускоряет реакции", "s12_int_INT_E5": "служит матрицей", "s12_int_INT_E6": "копии для дочерних систем", "s12_int_INT_E7": "белки, липиды, ферменты", "s12_int_INT_E8": "передаёт информацию и различия", "s12_int_INT_E9": "ошибки копирования создают варианты", "s12_int_INT_E10": "различия влияют на число потомков (условие отбора)", "s12_int_unlinked": "Выбранные блоки не связаны между собой стрелками; добавьте промежуточный блок", "s12_int_set1": "B1–B2–B3–B7", "s12_int_set2": "B5–B6–B8–B9", "s12_int_set3": "B3–B4–B6–B8", "s12_int_q1_t": "Зависимости", "s12_int_q1_q": "Какая зависимость между выбранными блоками верна для работающей клетки?", "s12_int_q1_o1": "Блоки взаимно обеспечивают работу друг друга", "s12_int_q1_o2": "Граница возникла раньше остальных блоков", "s12_int_q1_o3": "Транспорт через границу обходится без энергии", "s12_int_q1_o4": "Производство компонентов не зависит от границы", "s12_int_q1_e": "Верно. Производство компонентов строит белки границы и транспорта, а транспорт и энергия обеспечивают производство субстратами и АТФ: зависимость взаимная", "s12_int_q1_w2": "Карта не показывает порядок возникновения", "s12_int_q1_w3": "Активный транспорт расходует АТФ или градиент (<a href=\"seminar-1-route.html#bio-1-19\" target=\"_blank\" rel=\"noopener\">семинар 1</a>)", "s12_int_q1_w4": "Без границы субстраты и продукты не удерживаются рядом, и производство теряет обеспечение", "s12_int_q2_t": "Необходимые функции", "s12_int_q2_q": "В среде нет готового АТФ. Какая функция становится необходимой в этих условиях?", "s12_int_q2_o1": "Собственный синтез АТФ в клетке", "s12_int_q2_o2": "Никакая: клетке АТФ не нужен вовсе", "s12_int_q2_o3": "Вторая мембрана вокруг первой", "s12_int_q2_o4": "Больше копий ДНК в каждой клетке", "s12_int_q2_e": "Верно: без поступления АТФ его нужно синтезировать — например, протонным насосом и АТФ-синтазой", "s12_int_q2_w2": "АТФ расходуется на транспорт и синтез", "s12_int_q2_w3": "Вторая мембрана не даёт энергии", "s12_int_q2_w4": "Число копий ДНК не влияет на обеспечение клетки энергией", "s12_int_q3_t": "Недостающее условие", "s12_int_q3_q": "ДНК копируется, но новые системы не появляются. Какого условия не хватает?", "s12_int_q3_o1": "Деления с передачей копий потомкам", "s12_int_q3_o2": "Ещё более точного копирования ДНК", "s12_int_q3_o3": "Изменчивости при копировании ДНК", "s12_int_q3_o4": "Притока нуклеотидов в систему извне", "s12_int_q3_e": "Верно: копии должны распределяться между потомками, иначе новые системы не образуются", "s12_int_q3_w2": "Точность влияет на качество копий, но без деления все копии остаются в одной системе", "s12_int_q3_w3": "Изменчивость — условие отбора; новых систем она не создаёт", "s12_int_q3_w4": "Копирование по условию идёт — нуклеотидов хватает; не хватает распределения копий между потомками", "s12_int_q4_t": "Нарушения", "s12_int_q4_q": "Какое изменение нарушит наследуемое воспроизводство популяции?", "s12_int_q4_o1": "Ошибки почти во всех копиях генов", "s12_int_q4_o2": "Повышение точности копирования генов", "s12_int_q4_o3": "Редкие мутации, не нарушающие функции", "s12_int_q4_o4": "Увеличение скорости роста оболочки", "s12_int_q4_e": "Верно: если точность копирования упала настолько, что почти все копии необходимых генов несут ошибки, у потомков не сохраняется работоспособный набор генов и наследственная информация теряется (исследование 2)", "s12_int_q4_w2": "Это сохраняет информацию лучше", "s12_int_q4_w3": "Такие мутации — материал изменчивости", "s12_int_q4_w4": "Ускорение роста само по себе не разрушает наследственную информацию", "s12_int_q5_t": "Проверка объяснения", "s12_int_q5_q": "Какие данные проверят объяснение, что синтез АТФ в этой клетке идёт за счёт протонного градиента?", "s12_int_q5_o1": "Влияние разобщителя на синтез АТФ", "s12_int_q5_o2": "Высокое содержание АТФ в клетке", "s12_int_q5_o3": "Способность клетки к делению пополам", "s12_int_q5_o4": "Наличие у клетки мембраны", "s12_int_q5_e": "Верно: если синтез АТФ падает при добавлении разобщителя и прекращается без АТФ-синтазы, это различает хемиосмос и другие пути (вкладка 3)", "s12_int_q5_w2": "Количество АТФ не говорит, каким путём он образуется", "s12_int_q5_w3": "Деление не указывает путь синтеза АТФ", "s12_int_q5_w4": "Мембрана есть у любой клетки; она не показывает, за счёт чего синтезируется АТФ", "s12_int_other_note": "Для этого набора вопросы о необходимой функции и о проверке объяснения не заданы; выберите один из предложенных наборов", "s12_int_twist": "Уберите блок B8 «Воспроизводство системы». Какие блоки ещё работают и что теряется?", "s12_int_twist_ans": "Обмен веществ, синтез компонентов и даже копирование ДНК могут продолжаться, но новые системы не образуются и различия не передаются следующим поколениям — нет условий отбора. Это граница, которую на вкладке 1 видно на примере липосомы с геномом", "s12_int_chain_1_obs": "В образцах астероида найдены азотистые основания", "s12_int_chain_1_concl": "Основания образовались вне Земли без участия живых систем (реконструкция по условиям образца)", "s12_int_chain_1_alt": "Основания в образце — земное загрязнение", "s12_int_chain_1_ev": "Сравнение с контрольными пробами, прошедшими те же операции; доставка с минимальным загрязнением", "s12_int_chain_2_obs": "Рибозим копирует обе цепи коротких РНК при циклах замораживания", "s12_int_chain_2_concl": "Многократное копирование коротких РНК рибозимом возможно", "s12_int_chain_2_alt": "Копирование идёт без участия рибозима", "s12_int_chain_2_ev": "Контроль без рибозима в тех же условиях", "s12_int_chain_3_obs": "Гомологичные АТФ-синтазы есть у бактерий и архей", "s12_int_chain_3_concl": "Хемиосмос был у LUCA или его близких предков", "s12_int_chain_3_alt": "АТФ-синтаза распространилась между группами переносом после LUCA", "s12_int_chain_3_ev": "Совпадает ли дерево генов субъединиц синтазы с деревом клеточных линий", "s12_int_chain_4_obs": "Гены митохондриальной ДНК ближе всего к генам альфа-протеобактерий", "s12_int_chain_4_concl": "Предок митохондрии принадлежал к альфа-протеобактериям", "s12_int_chain_4_alt": "Гены митохондрии получены от альфа-протеобактерий переносом, а сама органелла — другого происхождения", "s12_int_chain_4_ev": "Согласие многих генов митохондрии и бактериального аппарата их экспрессии (несколько независимых линий)", "s12_int_chain_open": "Наблюдение: у всех изученных эукариот есть митохондрии или органеллы, производные от митохондрий. Сформулируйте допустимый вывод, альтернативную гипотезу и различающее свидетельство", "s12_int_chain_open_ans": "Вывод: митохондрия была у LECA. Альтернатива: митохондрии приобретены разными линиями эукариот независимо после LECA. Раз
