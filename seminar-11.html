пления лактозы; без него T стало бы 5", "s11_a1_s3_w3": "Лактозы мало, и при глюкозе её поступления не хватает, чтобы освободить оператор", "s11_a1_s3_w4": "Базальная транскрипция сохраняется: 0,1", "s11_a1_s3_h1": "Сколько путей действия глюкозы в правилах модели?", "s11_a1_s3_h2": "Что происходит с индуктором при малом количестве лактозы и глюкозе?", "s11_a1_s3_h3": "Оба множителя уменьшились", "s11_a1_s4_q": "У мутанта без репрессора в среде только глюкоза. Предскажите транскрипцию", "s11_a1_s4_o1": "10: оператор свободен, но положительной регуляции нет", "s11_a1_s4_o2": "100: репрессора нет", "s11_a1_s4_o3": "0,1: лактозы нет", "s11_a1_s4_o4": "1: базальная", "s11_a1_s4_e": "Верно. Этот мутант даёт ту же интенсивность, что дикий тип при избытке лактозы с глюкозой, — по другой причине: репрессора нет вовсе", "s11_a1_s4_w2": "Отсутствие репрессора снимает только отрицательную регуляцию", "s11_a1_s4_w3": "Без репрессора лактоза не нужна", "s11_a1_s4_w4": "Базальная транскрипция в модели — при занятом операторе; здесь репрессора нет, и оператор свободен", "s11_a1_s4_h1": "Есть ли что-то, что занимает оператор?", "s11_a1_s4_h2": "Есть ли CAP–цАМФ на ДНК при глюкозе?", "s11_a1_s4_h3": "f = 1, a = 0,1", "s11_a1_s5_obs": "Культуры 1 и 2: оператор свободен всё время, CAP–цАМФ на ДНК нет, транскрипция 10 из 100. Состав среды неизвестен", "s11_a1_s5_q": "Причины могут различаться. Какие дополнительные данные позволят их установить?", "s11_a1_s5_o1": "Состав среды, количество цАМФ в клетке, а также результат удаления глюкозы и, отдельно, удаления лактозы", "s11_a1_s5_o2": "Состояние оператора", "s11_a1_s5_o3": "Связан ли CAP с ДНК", "s11_a1_s5_o4": "Повторное измерение интенсивности транскрипции в тех же условиях", "s11_a1_s5_e": "Верно. Те же показания дают: дикий тип с избытком лактозы и глюкозой; мутант без CAP с избытком лактозы; мутант без репрессора с глюкозой; двойной мутант без репрессора и без CAP. Если убрать глюкозу, у дикого типа и мутанта без репрессора транскрипция вырастет до 100, у мутанта без CAP и двойного мутанта останется 10. Если, сохранив глюкозу, убрать лактозу, у дикого типа и мутанта без CAP транскрипция упадёт до 0,1, у мутанта без репрессора и двойного мутанта останется 10. Сочетание двух проверок различает все четыре варианта; цАМФ у мутанта без CAP в среде без глюкозы высокий, хотя CAP на ДНК нет", "s11_a1_s5_w2": "Оно одинаково во всех вариантах — свободен", "s11_a1_s5_w3": "Во всех вариантах — не связан. Это наблюдение не различает причины", "s11_a1_s5_w4": "Повтор подтвердит одинаковый результат, но не причину", "s11_a1_s5_h1": "Сколько сочетаний условий и штаммов дают 10?", "s11_a1_s5_h2": "Какие изменения среды по-разному подействуют на эти сочетания?", "s11_a1_s5_h3": "Одного изменения среды мало", "s11_a1_s6_q": "Какой вывод следует из исследования?", "s11_a1_s6_o1": "Освобождённый оператор показывает, что репрессия снята, но не позволяет предсказать интенсивность транскрипции без данных о положительной регуляции и количестве индуктора", "s11_a1_s6_o2": "Транскрипция оперона всегда либо полная, либо отсутствует", "s11_a1_s6_o3": "Глюкоза действует только через цАМФ", "s11_a1_s6_o4": "Положительная регуляция важнее отрицательной", "s11_a1_s6_e": "Верно. Интенсивность — итог нескольких независимых событий, и одинаковый итог совместим с разными их сочетаниями", "s11_a1_s6_w2": "В модели есть промежуточные уровни: 0,1; 1; 5; 10; 50; 100", "s11_a1_s6_w3": "При малом количестве лактозы глюкоза уменьшает и поступление лактозы: транскрипция падает в 500 раз, а не в 10", "s11_a1_s6_w4": "Без снятия репрессии транскрипция остаётся на базальном уровне (не выше 1 из 100) при любой положительной регуляции", "s11_a2_title": "Две клетки, одна ДНК: доступный участок и транскрипция", "s11_a2_cond": "Две условные клетки человека — клетка 1 и клетка 2 — с одинаковой последовательностью ДНК. Изучают регуляторный участок гена W. Измеряют доступность участка и количество вновь синтезированной РНК гена W за час (транскрипцию). Общие факторы транскрипции, медиатор и РНК-полимераза II есть в обеих клетках", "s11_a2_rules": "1. Участок доступен, если он исходно доступен или есть пионерный фактор (он связывается с нуклеосомной ДНК и способствует открытию участка).\n2. Активный T связывается только с доступным участком. Неактивный T не связывается.\n3. Транскрипция гена W идёт (100 условных единиц), только если T связан с участком; иначе — нет.", "s11_a2_limits": "Модель двоичная: доступность и транскрипция в клетке изменяются постепенно. Пионерные факторы в модели всегда открывают участок; в клетке их связывание зависит от последовательности и от состояния хроматина, и открытие нередко требует других белков. Модель не показывает модификации гистонов, репрессоры и то, как доступность поддерживается после деления клетки", "s11_a2_new": "Ацетилирование гистонов давно связывают с активной транскрипцией, но что из них причина, а что следствие, долго не было проверено напрямую. В дрожжевых клетках быстро прекращали работу РНК-полимеразы II и смотрели, сохранится ли ацетилирование. Бо́льшая часть ацетилирования гистонов исчезла: оно зависело от самой транскрипции. Ацетилтрансферазы, привлечённые активаторами к промоторам, без транскрипции гистоны не ацетилировали, а количество связанной ацетилтрансферазы плохо предсказывало ацетилирование. Быстрое деацетилирование после остановки транскрипции наблюдали и в эмбриональных стволовых клетках мыши. Значит, ацетилирование гистонов — не только причина, но во многом и следствие транскрипции", "s11_a2_route": "К объяснению → БИО-11·14", "s11_a2_s1_q": "Предскажите показания обеих клеток в исходном состоянии", "s11_a2_s1_o1": "В обеих транскрипции нет: в клетке 1 участок закрыт, в клетке 2 он доступен, но T неактивен", "s11_a2_s1_o2": "В клетке 2 транскрипция есть: участок доступен", "s11_a2_s1_o3": "В клетке 1 транскрипция есть: T активен", "s11_a2_s1_o4": "В обеих транскрипция есть", "s11_a2_s1_e": "Верно. Одинаковый итог — отсутствие транскрипции — получен по разным причинам: в клетке 1 не хватает доступности, в клетке 2 — активного фактора", "s11_a2_s1_w2": "Доступность — необходимое, но не достаточное условие: неактивный T с участком не связывается", "s11_a2_s1_w3": "Активный фактор не связывается с закрытым участком (в модели T не пионерный)", "s11_a2_s1_w4": "Ни в одной клетке не выполнены оба условия", "s11_a2_s1_h1": "Какие два условия нужны для транскрипции?", "s11_a2_s1_h2": "Какое условие не выполнено в каждой клетке?", "s11_a2_s1_h3": "Причины разные, итог одинаковый", "s11_a2_s2_q": "В клетке 1 появился пионерный фактор. Что изменится?", "s11_a2_s2_o1": "Участок станет доступным, T свяжется, транскрипция начнётся", "s11_a2_s2_o2": "Ничего: пионерный фактор не активирует транскрипцию", "s11_a2_s2_o3": "Участок станет доступным, но транскрипции не будет", "s11_a2_s2_o4": "Транскрипция начнётся и без открытия участка", "s11_a2_s2_e": "Верно. Пионерный фактор способствует открытию участка, после чего с ним может связаться активный T", "s11_a2_s2_w2": "Сам по себе он в модели транскрипцию не активирует, но делает участок доступным для T", "s11_a2_s2_w3": "В клетке 1 T активен, поэтому после открытия участка транскрипция начнётся", "s11_a2_s2_w4": "T связывается только с доступным участком", "s11_a2_s2_h1": "Чего не хватало клетке 1?", "s11_a2_s2_h2": "Что делает пионерный фактор?", "s11_a2_s2_h3": "Оба условия выполнены", "s11_a2_s3_q": "В клетке 1 есть пионерный фактор, но фактора T нет. Предскажите показания", "s11_a2_s3_o1": "Участок доступен, транскрипции нет", "s11_a2_s3_o2": "Участок закрыт, транскрипции нет", "s11_a2_s3_o3": "Участок доступен, транскрипция есть", "s11_a2_s3_o4": "Участок закрыт, транскрипция есть", "s11_a2_s3_e": "Верно. Открыть участок — не значит запустить транскрипцию; для неё нужен ещё и активатор на участке", "s11_a2_s3_w2": "Пионерный фактор открывает участок и без T", "s11_a2_s3_w3": "В модели транскрипция требует связанного T", "s11_a2_s3_w4": "Невозможно в этой модели: T не связывается с закрытым участком", "s11_a2_s3_h1": "Зависит ли действие пионерного фактора от T?", "s11_a2_s3_h2": "Что нужно для транскрипции, кроме доступности?", "s11_a2_s3_h3": "Доступность без активатора", "s11_a2_s4_q": "В клетку 2 поступил сигнал, переводящий T в активную форму. Что изменится?", "s11_a2_s4_o1": "T свяжется с доступным участком, транскрипция начнётся; доступность не изменится", "s11_a2_s4_o2": "Сначала участок должен открыться", "s11_a2_s4_o3": "Ничего не изменится", "s11_a2_s4_o4": "Участок закроется", "s11_a2_s4_e": "Верно. В клетке 2 не хватало только активного фактора", "s11_a2_s4_w2": "Он уже доступен", "s11_a2_s4_w3": "Активный T связывается с доступным участком", "s11_a2_s4_w4": "В модели активация T не изменяет упаковку", "s11_a2_s4_h1": "Какое условие изменил сигнал?", "s11_a2_s4_h2": "Было ли выполнено второе условие?", "s11_a2_s4_h3": "Доступен и активен", "s11_a2_s5_obs": "Регуляторный участок гена доступен. Вновь синтезированной РНК этого гена нет", "s11_a2_s5_q": "Какие условия следует проверить в первую очередь?", "s11_a2_s5_o1": "Есть ли нужный фактор транскрипции, активен ли он и связан ли с участком; нет ли на участке репрессора; есть ли на промоторе аппарат транскрипции", "s11_a2_s5_o2": "Только доступность промотора — участок мог закрыться", "s11_a2_s5_o3": "Последовательность ДНК участка — он мог исчезнуть", "s11_a2_s5_o4": "Ничего: доступный участок всегда транскрибируется, значит, ошибка измерения", "s11_a2_s5_e": "Верно. Доступность — только первое условие. Если бы измеряли не вновь синтезированную, а зрелую мРНК или белок, список причин был бы шире: процессинг и распад мРНК, трансляция и распад белка", "s11_a2_s5_w2": "По показаниям участок доступен", "s11_a2_s5_w3": "Клетки с одинаковой ДНК; последовательность не изменялась", "s11_a2_s5_w4": "Доступный участок без активного фактора не транскрибируется (так в исходной клетке 2)", "s11_a2_s5_h1": "Какие события в модели идут после доступности?", "s11_a2_s5_h2": "Что измерено — вновь синтезированная РНК или зрелая мРНК?", "s11_a2_s5_h3": "Проверьте фактор и аппарат", "s11_a2_s6_q": "Можно ли по высокой доступности регуляторного участка предсказать высокую экспрессию гена?", "s11_a2_s6_o1": "Нет: доступность — необходимое, но не достаточное условие; нужны ещё активный фактор, его связывание и аппарат транскрипции", "s11_a2_s6_o2": "Да: доступный участок всегда транскрибируется", "s11_a2_s6_o3": "Нет: доступность не влияет на транскрипцию", "s11_a2_s6_o4": "Да, если ДНК одинакова", "s11_a2_s6_e": "Верно. Это модель заданного механизма, а не правило для всех генов: у некоторых генов есть и другие условия, а измерения доступности и транскрипции в клетке часто связаны лишь частично", "s11_a2_s6_w2": "В исходной клетке 2 и в клетке 1 с пионерным фактором, но без T, участок доступен, а транскрипции нет", "s11_a2_s6_w3": "Без доступности активный T не связывается (исходная клетка 1)", "s11_a2_s6_w4": "ДНК одинакова в обеих клетках, а транскрипция различается", "s11_a3_title": "Один сигнал, две клетки: регуляторная специфичность", "s11_a3_cond": "Две условные дифференцированные клетки одного организма — клетка А и клетка Б. Геном одинаков; рецептор к сигналу S есть и работает в обеих. Сигнал S активирует фактор транскрипции R. Изучают два гена: ген 1 (энхансер Э1 содержит участок связывания R) и ген 2 (энхансер Э2 содержит участки связывания R и фактора-партнёра Q). Измеряют транскрипцию обоих генов через час после действия сигнала", "s11_a3_rules": "1. Без сигнала R неактивен; транскрипция обоих генов базальная (5).\n2. Ген 1 транскрибируется с высокой интенсивностью (100), если R активен, Э1 доступен и передача от Э1 работает.\n3. Ген 2 — высокая интенсивность, если R активен, Э2 доступен, Q есть и передача от Э2 работает (R без Q с Э2 не связывается прочно — правило модели).\n4. Иначе транскрипция гена базальная (5).", "s11_a3_limits": "Модель показывает два гена и два фактора. Не показано, как возникли различия доступности энхансеров — в ходе развития клеток, под действием других факторов и модификаций хроматина. Не показаны сигнальные пути внутри клетки, обратные связи, репрессоры и посттранскрипционная регуляция. Модель демонстрирует принцип регуляторной специфичности, а не устройство генных регуляторных сетей", "s11_a3_new": "Даже один энхансер может состоять из нескольких участков с разной ролью. В клетках опухоли молочной железы человека глюкокортикоидный рецептор после действия гормона связывался с четырьмя участками перед геном <i>DDIT4</i>. Три из них были нужны для усиления транскрипции и по-разному влияли на ацетилирование гистонов и на \"вспышки\" транскрипции — периоды частой инициации, разделённые паузами (на их частоту и величину); четвёртый, наоборот, подавлял транскрипцию, и гормон снимал это подавление. После гормона промотор гена чаще контактировал с активными участками. Ответ на гормон различался и между соседними клетками одной культуры; авторы предполагают, что это связано с разным использованием четырёх участков", "s11_a3_how": "В клетках двух типов мыши — опухолевых клетках молочной железы и клетках гипофиза — до и после действия синтетического глюкокортикоида определили доступные участки хроматина по всему геному и участки, с которыми связался глюкокортикоидный рецептор. У глюкокортикоидов рецептор находится внутри клетки и, связав гормон, сам служит фактором транскрипции; в модели сигнал, рецептор и фактор R показаны отдельно. До 95 % новых участков связывания рецептора приходилось на участки, доступные ещё до гормона. Доступные участки двух типов клеток совпадали лишь примерно на 30 %, а общими для обоих типов оказались лишь около 11 % участков связывания рецептора. Значит, где связывается фактор, по-видимому, во многом определяется доступностью хроматина, заранее различной в клетках разных типов; само связывание рецептора дополнительно увеличивает доступность участка", "s11_a3_route": "К объяснению → БИО-11·21", "s11_a3_s1_q": "В обе клетки поступил сигнал S. Предскажите транскрипцию генов 1 и 2", "s11_a3_s1_o1": "Клетка А: ген 1 — высокая, ген 2 — базальная; клетка Б — наоборот", "s11_a3_s1_o2": "В обеих клетках оба гена — высокая: сигнал и рецептор одинаковы", "s11_a3_s1_o3": "В обеих клетках ответа нет: геном одинаков", "s11_a3_s1_o4": "Клетка А: оба гена; клетка Б: ни один", "s11_a3_s1_e": "Верно. R активен в обеих клетках, но в клетке А доступен только Э1, а в клетке Б доступен Э2 и есть партнёр Q. Одинаковый сигнал — разные профили транскрипции", "s11_a3_s1_w2": "Одинаковы сигнал, рецептор и фактор R, но не доступность энхансеров и не набор партнёров", "s11_a3_s1_w3": "Одинаковый геном не означает одинаковой экспрессии", "s11_a3_s1_w4": "В клетке Б Э2 доступен и есть Q — ген 2 транскрибируется", "s11_a3_s1_h1": "Чем различаются клетки, если рецепторы и R одинаковы?", "s11_a3_s1_h2": "Сравните доступность Э1 и Э2", "s11_a3_s1_h3": "Какому энхансеру нужен партнёр Q?", "s11_a3_s2_q": "В клетке А энхансер Э2 стал доступным. Изменится ли транскрипция гена 2?", "s11_a3_s2_o1": "Нет: без партнёра Q фактор R не связывается с Э2 прочно", "s11_a3_s2_o2": "Да, станет высокой: Э2 доступен", "s11_a3_s2_o3": "Транскрипция гена 1 снизится", "s11_a3_s2_o4": "Да, но только если появится второй сигнал", "s11_a3_s2_e": "Верно. Доступность Э2 — необходимое условие, но гену 2 нужен ещё фактор Q, которого в клетке А нет. Различие клеток определяется не одним уровнем", "s11_a3_s2_w2": "Не хватает Q (правило 3)", "s11_a3_s2_w3": "Состояние Э1 и передача от него не изменились", "s11_a3_s2_w4": "Сигнал тот же; не хватает партнёра Q", "s11_a3_s2_h1": "Каких условий требует ген 2?", "s11_a3_s2_h2": "Все ли они выполнены в клетке А?", "s11_a3_s2_h3": "Партнёр Q", "s11_a3_s3_q": "В клетке А открыт Э2 и появился фактор Q. Что покажет модель?", "s11_a3_s3_o1": "Оба гена — высокая транскрипция", "s11_a3_s3_o2": "Ген 1 станет базальным: R перейдёт на Э2", "s11_a3_s3_o3": "Ген 2 останется базальным", "s11_a3_s3_o4": "Клетка А станет клеткой Б", "s11_a3_s3_e": "Верно. Теперь клетка А отвечает на сигнал так же, как клетка Б по гену 2, сохранив ответ по гену 1. Профиль ответа задан набором доступных энхансеров и партнёров", "s11_a3_s3_w2": "В модели R связывается с обоими доступными энхансерами", "s11_a3_s3_w3": "Все условия для гена 2 выполнены", "s11_a3_s3_w4": "Клетка Б не транскрибирует ген 1: Э1 в ней закрыт. Профили по-прежнему различаются", "s11_a3_s3_h1": "Какие условия для гена 2 теперь выполнены?", "s11_a3_s3_h2": "Изменилось ли что-то для гена 1?", "s11_a3_s3_h3": "Проверьте оба гена", "s11_a3_s4_q": "В клетке Б R и Q связаны с доступным Э2, но передача от Э2 к промотору гена 2 нарушена. Какой будет транскрипция гена 2?", "s11_a3_s4_o1": "Базальной", "s11_a3_s4_o2": "Высокой: R и Q на энхансере", "s11_a3_s4_o3": "Транскрипции не будет вовсе", "s11_a3_s4_o4": "Высокой станет транскрипция гена 1", "s11_a3_s4_e": "Верно. Связывание факторов с энхансером не равно активации: действие должно быть передано на аппарат транскрипции промотора", "s11_a3_s4_w2": "Без передачи на промотор энхансер не увеличивает транскрипцию", "s11_a3_s4_w3": "Промотор доступен и аппарат на месте — базальная транскрипция сохраняется", "s11_a3_s4_w4": "Э1 в клетке Б закрыт", "s11_a3_s4_h1": "Что происходит после связывания факторов с энхансером?", "s11_a3_s4_h2": "Какая деталь вкладки 3 передаёт действие?", "s11_a3_s4_h3": "Связывание ≠ активация", "s11_a3_s5_obs": "Сигнал S поступил в обе клетки, рецепторы работают. Клетка 3: ген 1 — высокая, ген 2 — базальная. Клетка 4: оба гена — базальная", "s11_a3_s5_q": "Какие регуляторные уровни могут объяснить различие клетки 4 и клетки 3?", "s11_a3_s5_o1": "Несколько, и одних этих показаний недостаточно: в клетке 4 могут быть закрыты энхансеры, отсутствовать партнёр Q, быть нарушена передача на промоторы или R может не активироваться (например, из-за отсутствия или модификации самого R)", "s11_a3_s5_o2": "Только недоступность Э1", "s11_a3_s5_o3": "Различие на уровне рецептора", "s11_a3_s5_o4": "Клетка 4 отличается последовательностью ДНК", "s11_a3_s5_e": "Верно. Все эти варианты совместимы с показаниями. Различают их дополнительные наблюдения: доступность Э1 и Э2, связан ли R с энхансерами, есть ли Q, есть ли РНК-полимераза II на промоторах. Если бы измеряли белок, а не транскрипцию, добавились бы посттранскрипционные уровни", "s11_a3_s5_w2": "Это один из вариантов; данные не исключают другие", "s11_a3_s5_w3": "По условию рецепторы работают в обеих клетках", "s11_a3_s5_w4": "Клетки одного организма; геном одинаков", "s11_a3_s5_h1": "Сколько условий нужно для высокой транскрипции гена 1?", "s11_a3_s5_h2": "Какое из них может не выполняться в клетке 4?", "s11_a3_s5_h3": "Вариантов несколько", "s11_a3_s6_q": "Почему различие клеток нельзя объяснить действием одного фактора транскрипции?", "s11_a3_s6_o1": "Потому что транскрипция каждого гена зависит от сочетания условий: доступности энхансера, активности фактора, наличия партнёров и передачи на промотор; один и тот же фактор в разных клетках действует на разные гены", "s11_a3_s6_o2": "Потому что в разных клетках разные гены", "s11_a3_s6_o3": "Потому что факторы транскрипции не связаны с дифференцировкой", "s11_a3_s6_o4": "Потому что сигнал в разных клетках разный", "s11_a3_s6_e": "Верно. Модель показывает принцип регуляторной специфичности. Реальные клетки различаются сотнями регуляторных белков и тысячами доступных участков; их взаимодействия образуют регуляторные сети", "s11_a3_s6_w2": "Геном одинаков, различается экспрессия", "s11_a3_s6_w3": "Связаны, но действуют совместно", "s11_a3_s6_w4": "По условию сигнал одинаков", "s11_a4_title": "Баланс синтеза и распада: мРНК, белок, активность во времени", "s11_a4_cond": "Объект — мРНК и белок условного гена в клетке человека. Время отсчитывают от момента начала транскрипции гена (режим \"Начало транскрипции\") или от изменения одного или нескольких параметров (режим \"Изменение параметра\"). Числа молекул и значения параметров условные: они выбраны для наглядности, а не измерены", "s11_a4_eq": "- M — число молекул мРНК в клетке (условные молекулы); P — число молекул белка.\n- s — синтез мРНК, молекул в час.\n- τM — среднее время существования молекулы мРНК, ч (время полужизни t½ = 0,693 · τM).\n- r — эффективность трансляции: молекул белка, синтезируемых на одной мРНК за час.\n- τP — среднее время существования молекулы белка, ч.\n- α — доля активных молекул белка (0–1); активный белок A = α · P.", "s11_a4_limits": "В модели каждая молекула распадается с постоянной вероятностью; у реальных белков распад может зависеть от возраста молекулы, её сворачивания и состояния клетки. Не учтены деление клетки (оно тоже уменьшает количество молекул на клетку), задержки процессинга и экспорта мРНК, регуляция трансляции во времени. Значения параметров условные; у реальных мРНК клеток млекопитающих медиана времени полужизни измеряется часами, у белков время полужизни — от минут до многих часов и дольше", "s11_a4_new": "В четырёх линиях клеток человека остановили трансляцию и через разные промежутки времени измеряли количество каждого белка. Из 11 747 белков 1 017 оказались короткоживущими — половина их молекул разрушалась не более чем за 8 ч. Такие белки в среднем менее многочисленны и менее устойчивы при нагревании. У 103 белков устойчивость различалась между линиями клеток; укороченные формы двух белков, синтезируемые в отдельных линиях, разрушались быстрее полноразмерных. Значит, время существования одного и того же белка зависит от клетки и от его формы — это ещё одна причина, по которой одинаковое количество мРНК не означает одинакового количества белка", "s11_a4_route": "К объяснению → БИО-11·29", "s11_a4_s1_q": "Через 10 ч после начала транскрипции гена какая доля стационарного количества достигнута для мРНК и для белка?", "s11_a4_s1_o1": "мРНК — около 86 %, белок — около 24 %", "s11_a4_s1_o2": "Обе — около 50 %", "s11_a4_s1_o3": "Обе — 100 %: синтез идёт с первой минуты", "s11_a4_s1_o4": "Белок — больше, чем мРНК: каждая мРНК даёт много белка", "s11_a4_s1_e": "Верно. мРНК существует в среднем 5 ч и быстро выходит на стационарный уровень; белок живёт дольше (20 ч) и к тому же синтезируется на мРНК, количество которой ещё растёт. Переходное состояние мРНК и белка длится разное время", "s11_a4_s1_w2": "Скорость выхода на стационарный уровень определяется временем существования молекул; у мРНК и белка оно разное", "s11_a4_s1_w3": "Количество растёт, пока синтез превышает распад", "s11_a4_s1_w4": "Доля от стационарного уровня у белка меньше: он медленнее приближается к своему стационарному уровню", "s11_a4_s1_h1": "Какая молекула живёт дольше?", "s11_a4_s1_h2": "От чего зависит скорость выхода на стационарный уровень?", "s11_a4_s1_h3": "M(10) = 100·(1 − e^(−2))", "s11_a4_s2_q": "Белок стал разрушаться быстрее: τP = 5 ч вместо 20. Что изменится?", "s11_a4_s2_o1": "Стационарное количество белка уменьшится в 4 раза (до 2 500), а выходить на него белок будет быстрее: половину — примерно за 8 ч вместо 19", "s11_a4_s2_o2": "Уменьшится стационарное количество, время выхода не изменится", "s11_a4_s2_o3": "Уменьшится количество мРНК", "s11_a4_s2_o4": "Количество белка не изменится: синтез прежний", "s11_a4_s2_e": "Верно. Чем быстрее распад, тем ниже стационарный уровень и тем быстрее он достигается", "s11_a4_s2_w2": "Время выхода зависит от времени существования белка: при τP = 5 ч оно короче", "s11_a4_s2_w3": "Распад белка не влияет на мРНК в этой модели", "s11_a4_s2_w4": "P* = r · M* · τP: при меньшем τP меньше и P*", "s11_a4_s2_h1": "По какой формуле считается P*?", "s11_a4_s2_h2": "Что происходит с половиной времени выхода?", "s11_a4_s2_h3": "Сравните графики", "s11_a4_s3_obs": "Клетка А: мРНК 100, белок 10 000. Клетка Б: мРНК 100, белок 4 000. Клетка В: мРНК 100, белок 4 000", "s11_a4_s3_q": "Количество мРНК во всех трёх клетках одинаково, а белка в клетках Б и В в 2,5 раза меньше, чем в клетке А. Какие механизмы могут это объяснять?", "s11_a4_s3_o1": "Сниженная эффективность трансляции, ускоренный распад белка или их сочетание", "s11_a4_s3_o2": "Только сниженная трансляция", "s11_a4_s3_o3": "Сниженная транскрипция гена", "s11_a4_s3_o4": "Ошибка измерения: при одинаковой мРНК белок одинаков", "s11_a4_s3_e": "Верно. При одинаковой мРНК белок определяется трансляцией и распадом белка. В модели клетка Б отличается от А средним временем существования белка (8 ч вместо 20), клетка В — трансляцией (2 молекулы белка на одну мРНК в час вместо 5). По этим показаниям их не различить", "s11_a4_s3_w2": "Тот же результат даёт ускоренный распад белка", "s11_a4_s3_w3": "Тогда мРНК было бы меньше", "s11_a4_s3_w4": "Количество мРНК не определяет количество белка однозначно", "s11_a4_s3_h1": "Какие параметры влияют на белок, но не на мРНК?", "s11_a4_s3_h2": "Сколько вариантов дают 4 000?", "s11_a4_s3_h3": "P* = r · M* · τP", "s11_a4_s4_cond": "Клетки Б и В: мРНК 100, белок 4 000 в стационарном состоянии. В клетке Б белок разрушается быстрее (8 ч вместо 20), в клетке В он медленнее синтезируется (2 молекулы на мРНК в час вместо 5)", "s11_a4_s4_q": "Какое наблюдение НЕ поможет отличить клетку Б от клетки В?", "s11_a4_s4_o1": "Количество мРНК и белка в стационарном состоянии", "s11_a4_s4_o2": "Синтез нового белка за час", "s11_a4_s4_o3": "Скорость убыли белка после остановки трансляции", "s11_a4_s4_o4": "Количество белка через 10 ч после начала транскрипции гена", "s11_a4_s4_e": "Верно. Оно одинаково: 100 и 4 000. Различают клетки: синтез нового белка за час (Б — 500, В — 200); убыль белка после остановки трансляции (в Б половина белка исчезает примерно за 5,5 ч, в В — за 14 ч); ход накопления после начала транскрипции гена (через 10 ч в Б — 46 % стационарного уровня, в В — 24 %)", "s11_a4_s4_w2": "Различает: в клетке Б — 500 молекул в час, в клетке В — 200", "s11_a4_s4_w3": "Различает: половина белка исчезает примерно за 5,5 ч в Б и за 14 ч в В", "s11_a4_s4_w4": "Различает: около 1 850 в Б и около 950 в В", "s11_a4_s4_h1": "Какие величины у клеток одинаковы?", "s11_a4_s4_h2": "Что зависит от скорости синтеза, а что от распада?", "s11_a4_s4_h3": "Ищите одинаковое", "s11_a4_s5_q": "Клетка А: белка 10 000 молекул, активны 40 % из них. Клетка Б: белка 4 000 молекул, активны все. Сравните количество активного белка", "s11_a4_s5_o1": "Активного белка в обеих — 4 000, но молекул белка в клетке А в 2,5 раза больше", "s11_a4_s5_o2": "В клетке А активного белка больше: белка больше", "s11_a4_s5_o3": "Активность не зависит от доли активных молекул", "s11_a4_s5_o4": "В клетке А активного белка меньше", "s11_a4_s5_e": "Верно. Количество белка и его активность — разные величины. Одинаковая активность может получаться при разном количестве белка", "s11_a4_s5_w2": "Активны лишь 40 % молекул: 10 000 × 0,4 = 4 000", "s11_a4_s5_w3": "Активный белок = доля × количество", "s11_a4_s5_w4": "Его столько же — 4 000", "s11_a4_s5_h1": "Как считается активный белок?", "s11_a4_s5_h2": "Сколько молекул активно в клетке А?", "s11_a4_s5_h3": "A = α · P", "s11_a4_s6_q": "Синтез мРНК удвоили, а время её существования уменьшили вдвое. Что будет со стационарными уровнями?", "s11_a4_s6_o1": "Не изменятся: M* = 40 × 2,5 = 100, белок — 10 000. Изменился оборот: мРНК обновляется вдвое быстрее", "s11_a4_s6_o2": "мРНК станет вдвое больше", "s11_a4_s6_o3": "мРНК станет вдвое меньше", "s11_a4_s6_o4": "мРНК не изменится, белок удвоится", "s11_a4_s6_e": "Верно. Одинаковое количество мРНК может поддерживаться при разной скорости её синтеза и распада. По одному измерению количества скорость транскрипции не определить", "s11_a4_s6_w2": "Удвоенный синтез компенсируется вдвое более быстрым распадом", "s11_a4_s6_w3": "См. формулу M* = s · τM", "s11_a4_s6_w4": "Белок зависит от M*, которое не изменилось", "s11_a4_s6_h1": "Чему равно M*?", "s11_a4_s6_h2": "Изменились оба сомножителя", "s11_a4_s6_h3": "40 × 2,5", "s11_a4_s7_q": "Что следует из сравнения клетки с быстрым распадом белка и клетки с медленным синтезом белка при одинаковом количестве белка?", "s11_a4_s7_o1": "Одинаково низкое количество белка может быть следствием медленного синтеза или быстрого распада; различить их позволяют измерения скоростей и хода изменений во времени", "s11_a4_s7_o2": "Низкий белок всегда означает низкую трансляцию", "s11_a4_s7_o3": "Низкий белок всегда означает быстрый распад", "s11_a4_s7_o4": "Количество белка определяет его активность", "s11_a4_s7_e": "Верно. Стационарное количество — итог двух потоков; причину показывают сами потоки и динамика", "s11_a4_s7_w2": "Тот же низкий белок даёт ускоренный распад при прежней трансляции", "s11_a4_s7_w3": "Тот же низкий белок даёт сниженная трансляция при прежнем распаде", "s11_a4_s7_w4": "При разной доле активных молекул одинаковое количество белка даёт разную активность", "s11_int_title": "Итоговая задача. От хроматина до активного белка: что могло измениться?", "s11_int_cond": "Исследовали ген V в клетках одного типа: в случаях 1–3 — до и после воздействия на клетки, в случаях 4–5 — в двух линиях клеток одного типа (их сравнивают между собой). Измерения выполнены, когда все величины перестали изменяться, и рассчитаны на одинаковое число клеток. Шесть наблюдений: (1) доступность промотора и энхансера — относительный сигнал измерения доступности, нормированный на исходное состояние; (2) занятость гена РНК-полимеразой II — сигнал связывания Pol II на гене (паузы и скорость элонгации меняют его, поэтому это не то же самое, что поток синтеза); (3) вновь синтезированная РНК гена V за час — поток синтеза; (4) зрелая мРНК в цитоплазме; (5) количество белка V; (6) функциональная активность белка V в расчёте на клетку. В клетке различие может возникнуть в нескольких процессах сразу; здесь для каждого случая отметьте все механизмы, каждый из которых сам по себе способен объяснить весь профиль наблюдений без дополнительных неописанных изменений, и одно дополнительное исследование, которое лучше всего различит их", "s11_int_note": "Числа в случаях условные. В реальном эксперименте воздействие обычно изменяет несколько процессов сразу, поэтому выводы ещё менее однозначны", "s11_int_route": "К объяснению → БИО-11·32", "s11_int_c1_obs": "(1) снижена в 4 раза; (2) снижена в 4 раза; (3) в 4 раза меньше; (4) в 4 раза меньше; (5) в 4 раза меньше; (6) в 4 раза меньше", "s11_int_c1_m1": "Уплотнение хроматина промотора или энхансера", "s11_int_c1_m2": "Отсутствие или неактивность активатора: доступность снизилась вследствие того, что активатор перестал связываться и транскрипции стало меньше", "s11_int_c1_m3": "Метилирование CpG-островка промотора", "s11_int_c1_n1": "Ускоренный распад мРНК", "s11_int_c1_n1_why": "Тогда вновь синтезированной РНК было бы столько же", "s11_int_c1_n2": "Сниженная трансляция", "s11_int_c1_n2_why": "Тогда мРНК была бы прежней", "s11_int_c1_x1": "Проследить, что изменяется раньше после воздействия — доступность или связывание активатора с энхансером; проверить метилирование промотора; затем направленно изменить активатор или его участок связывания и проверить, меняются ли доступность и транскрипция", "s11_int_c1_x2": "измерить время существования белка", "s11_int_c1_x2_why": "белок изменился пропорционально мРНК; распад белка здесь ничего не объясняет", "s11_int_c1_expl": "Доступность и транскрипция изменились одинаково. По одним итоговым данным нельзя сказать, что из них причина: доступность может быть и причиной, и следствием прекращения связывания активатора (исследование 2). Что изменилось раньше, подсказывает направление, но не доказывает причину: её проверяют направленным изменением активатора или его участка", "s11_int_c2_obs": "(1) без изменений; (2) без изменений; (3) столько же; (4) в 5 раз меньше; (5) в 5 раз меньше; (6) в 5 раз меньше", "s11_int_c2_m1": "Нарушение процессинга пре-мРНК (сплайсинга или образования 3′-конца) с распадом незрелой РНК в ядре (<a href=\"https://fresll.github.io/bio/seminar-9-route.html#primary-transcript\" target=\"_blank\" rel=\"noopener\">вспомнить БИО-9·13</a>)", "s11_int_c2_m2": "Нарушение экспорта мРНК из ядра", "s11_int_c2_m3": "Ускоренный распад зрелой мРНК в цитоплазме, например из-за белка, связавшегося с 3′-НТО и ускоряющего её распад", "s11_int_c2_n1": "Снижение транскрипции", "s11_int_c2_n1_why": "вновь синтезированной РНК столько же", "s11_int_c2_n2": "Ускоренный распад белка", "s11_int_c2_n2_why": "тогда мРНК была бы прежней", "s11_int_c2_x1": "Сравнить количество мРНК гена V в ядре и в цитоплазме и измерить время существования зрелой мРНК", "s11_int_c2_x2": "Измерить доступность хроматина", "s11_int_c2_x2_why": "она не изменилась", "s11_int_c2_expl": "Синтез РНК прежний, а зрелой мРНК меньше: изменился путь от вновь синтезированной РНК до зрелой мРНК в цитоплазме или стабильность зрелой мРНК. Три механизма совместимы; различить их позволяют места накопления РНК и её время существования", "s11_int_c3_obs": "(1)–(4) без изменений; (5) в 2 раза меньше; (6) в 2 раза меньше", "s11_int_c3_m1": "Сниженная эффективность трансляции — например, подавление инициации или действие микроРНК без распада мРНК (<a href=\"https://fresll.github.io/bio/seminar-10-route.html#initiation\" target=\"_blank\" rel=\"noopener\">вспомнить БИО-10·14</a>)", "s11_int_c3_m2": "Ускоренный распад белка убиквитин-протеасомной системой", "s11_int_c3_m3": "Нарушение сворачивания белка с последующим распадом (<a href=\"https://fresll.github.io/bio/seminar-10-route.html#folding-chaperones\" target=\"_blank\" rel=\"noopener\">вспомнить БИО-10·20</a>)", "s11_int_c3_n1": "Снижение транскрипции", "s11_int_c3_n1_why": "мРНК прежняя", "s11_int_c3_x1": "Измерить синтез нового белка V за час и убыль белка после остановки трансляции", "s11_int_c3_x2": "Измерить количество мРНК ещё раз", "s11_int_c3_x2_why": "оно уже известно и одинаково", "s11_int_c3_expl": "Как в исследовании 4: одинаковая мРНК, меньше белка. Различают синтез и распад", "s11_int_c4_obs": "(1)–(5) одинаковы; (6) во второй линии в 4 раза меньше", "s11_int_c4_m1": "Замена аминокислоты в активном центре из-за мутации в гене (<a href=\"https://fresll.github.io/bio/seminar-8-route.html#error-damage-mutation\" target=\"_blank\" rel=\"noopener\">вспомнить БИО-8·1</a> и <a href=\"https://fresll.github.io/bio/seminar-10-route.html#sequence-changes\" target=\"_blank\" rel=\"noopener\">БИО-10·4</a>)", "s11_int_c4_m2": "Неправильное сворачивание без ускоренного распада", "s11_int_c4_m3": "Отсутствие активирующей модификации (например, фосфорилирования)", "s11_int_c4_m4": "Связывание ингибитора или отсутствие партнёра", "s11_int_c4_n1": "Ускоренный распад белка", "s11_int_c4_n1_why": "количество белка прежнее", "s11_int_c4_x1": "Определить последовательность гена V и его мРНК и сравнить модификации и активность одинакового количества белка", "s11_int_c4_x2": "Измерить количество белка другим способом", "s11_int_c4_x2_why": "количество уже одинаково; различается активность на молекулу", "s11_int_c4_expl": "Количество белка не изменилось — изменилась функция одной молекулы. Причины лежат и в последовательности (мутация), и в состоянии готового белка", "s11_int_c5_obs": "(1) одинакова в расчёте на одну копию гена; (2)–(6) во второй линии в 2 раза больше", "s11_int_c5_m1": "Увеличение числа копий гена V в геноме (удвоение участка хромосомы; <a href=\"https://fresll.github.io/bio/seminar-7-route.html#s-phase-2c4c\" target=\"_blank\" rel=\"noopener\">вспомнить БИО-7·26</a> и <a href=\"https://fresll.github.io/bio/seminar-8-route.html#error-damage-mutation\" target=\"_blank\" rel=\"noopener\">БИО-8·1</a>)", "s11_int_c5_m2": "Более частая инициация транскрипции на прежнем числе копий — например, из-за более активного активатора", "s11_int_c5_n1": "Замедление распада мРНК", "s11_int_c5_n1_why": "вновь синтезированной РНК стало больше; при одном только замедлении распада она была бы прежней", "s11_int_c5_x1": "Определить число копий гена V в ДНК клеток", "s11_int_c5_x2": "Измерить активность белка на молекулу", "s11_int_c5_x2_why": "она прежняя: активность выросла вместе с количеством", "s11_int_c5_expl": "Увеличение начинается с транскрипции. Причина — либо больше копий гена, либо больше инициаций на каждой копии; число копий проверяют по ДНК", "s11_int_final_q": "Почему конечный результат экспрессии — количество и активность белка — не позволяет восстановить состояние всех предшествующих этапов?", "s11_int_final_o1": "Потому что одинаковый итог получается при разных сочетаниях изменений на разных уровнях; чтобы установить причину, нужно измерять промежуточные этапы и их скорости", "s11_int_final_o2": "Потому что белок не зависит от предшествующих этапов", "s11_int_final_o3": "Можно восстановить: каждому результату соответствует одна причина", "s11_int_final_o4": "Потому что измерения неточны", "s11_int_final_e": "Верно. Экспрессия гена — многоуровневая динамическая система: каждый уровень может изменяться независимо, а изменения одних уровней компенсируют или маскируют изменения других", "s11_int_final_w2": "Зависит, но не однозначно", "s11_int_final_w3": "Случаи 1–5 показывают, что один и тот же профиль часто объясняют несколько разных причин", "s11_int_final_w4": "Даже точные измерения итога не различают причины — нужны данные о промежуточных этапах", "s11_int_h1": "Какие наблюдения не изменились?", "s11_int_h2": "Что изменилось бы при каждом механизме из списка?", "s11_int_h3": "Механизм подходит, если сам по себе объясняет и изменённые, и неизменённые наблюдения", "s11_c_no": "нет", "s11_c_yes": "есть", "s11_rd_mask": "Показания — на схеме; переключатели скрыты до ответа.", "s11_lv_basal": "базальная", "s11_lv_mod": "умеренная", "s11_lv_high": "высокая", "s11_lv_null": "—", "s11_v_occ": "занят", "s11_v_free": "свободен", "s11_v_half": "свободен половину времени", "s11_v_nocap": "белка CAP нет", "s11_v_much": "много", "s11_v_little": "мало", "s11_v_glc_yes": "есть", "s11_v_glc_no": "нет", "s11_c1_lac": "Лактоза", "s11_c1_glc": "Глюкоза", "s11_k1_lacI": "репрессор LacI", "s11_k1_cap": "белок CAP", "s11_rd1_op": "Оператор", "s11_rd1_cap": "CAP–цАМФ на ДНК", "s11_rd1_camp": "цАМФ в клетке", "s11_rd1_tx": "Интенсивн   for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();

   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов

/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,

/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;

function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };

function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); if (q !== qn) amk = 1; qn = q; lvl = l; show(); syncUrl(push); }

/* справки молекул с клавиатуры: фокус, роль кнопки, доступное имя, Enter/Space (в семинарах, где этого не было);

function revVisible(e, stop){ for (let x = e; x && x !== stop; x = x.parentElement){ const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return false; } return true; }
function revA11y(){

/* =====================================================================

   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;

const GN = (function () {
  const C = { tpl: '#1F3B73', cod: '#8AA0BF', rna: '#E8912A', rnaL: '#F6D7AE', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',

    med: '#8A5A12', act: '#B85C00', cap: '#B03A2E', cpa: '#3D5A99', spl: '#2E9B57', exp: '#1F8A8A', xrn: '#6A3FA0',
    cds: '#4F86C6', utr: '#BBD0EA', mem: '#9C8F6E', memH: '#C9B98F', panel: '#F4F7FA', line: '#D3DAE3', nuc: '#FBF8F1', cyt: '#F3F7FB' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {

  }

     Цвет повторён в style: правило оболочки «Объяснений» .widget svg text{fill:var(--ink)} перекрывало атрибут fill,
     и цветные подписи (красные замены, зелёный старт-кодон) в «Объяснениях» становились чёрными (семинар 10, v1.0). */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a};fill:${o.col || C.ink}"${o.it ? ' font-style="italic"' : ''}${o.mono ? ' font-family="ui-monospace,Menlo,Consolas,monospace"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function textN(x, y, s, o = {}) { return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join(''); }
  function panel(x, y, w, h, title, fill) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${fill || C.panel}" stroke="${C.line}"/>` + (title ? text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted }) : '');
  }

    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;

/* =====================================================================
   s0_gn_nbh.js — v1.1.1 (Code, паспорт интерактива: «заголовок „пре-“ / „мРНК“ — неразрывный дефис»).
   Браузер переносит строку после дефиса, и «пре-» оставалось в конце строки, а «мРНК» уходило на следующую
   (h1 практикума на 768 px, заголовки и абзацы «Объяснений» на телефоне — тест tests9/hyphen.mjs).
   Тексты не меняются: при выводе слово «пре-…» оборачивается в <span class="nbh"> с white-space: nowrap,
   поэтому textContent, таблица текстов, реестр откатов и поиск по странице прежние. Схемы SVG не затрагиваются.
   Файл подключается и к практикуму (src/s*.js), и к «Объяснениям» (s0_gn*.js → widgets.js).
   ===================================================================== */
(function () {
  if (typeof document === 'undefined' || !document.body || typeof MutationObserver === 'undefined') return;   /* модели в node (tests9) — без документа */
  const SPLIT = /(пре-[А-Яа-яЁё]+)/;
  const skip = el => !el || (el.closest && el.closest('.nbh, script, style, textarea, svg'));
  function fix(root) {
    if (!root || root.nodeType !== 1 || skip(root)) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.indexOf('пре-') < 0 || skip(n.parentNode) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const list = []; let n; while ((n = tw.nextNode())) list.push(n);
    for (const nd of list) {
      const parts = nd.nodeValue.split(SPLIT); if (parts.length < 2) continue;
      const fr = document.createDocumentFragment();
      parts.forEach((p, i) => { if (!p) return;
        if (i % 2) { const s = document.createElement('span'); s.className = 'nbh'; s.style.whiteSpace = 'nowrap'; s.textContent = p; fr.appendChild(s); }
        else fr.appendChild(document.createTextNode(p)); });
      nd.parentNode.replaceChild(fr, nd);
    }
  }
  fix(document.body);
  new MutationObserver(ms => { for (const m of ms) for (const a of m.addedNodes) {
    if (a.nodeType === 3) { if (a.nodeValue.indexOf('пре-') >= 0) fix(a.parentNode); } else if (a.nodeType === 1 && !(a.closest && a.closest('svg'))) fix(a); } })
    .observe(document.body, { childList: true, subtree: true });
})();

    L.forEach(([, k], j) => { s += text(300 + j * 110, 56, t('s11_d1a_tab_L', { l: t(k) }), { size: 12, w: 700 }); });
    a1.VARS.slice().sort((a, b) => ['s11_str_wt', 's11_str_noI', 's11_str_noC', 's11_str_noIC'].indexOf(a[0]) - ['s11_str_wt', 's11_str_noI', 's11_str_noC', 's11_str_noIC'].indexOf(b[0])).forEach(([k, st], i) => { const y = 110 + i * 66;
      s += line(20, y - 34, 580, y - 34, C.line, 1) + text(28, y, t(k), { a: 'l', size: 13, w: 600 });
      L.forEach(([Lv], j) => { const g = GN.a1(Object.assign({ L: Lv, glc: 1 }, st)), n = GN.a1(Object.assign({ L: Lv, glc: 0 }, st)); s += text(300 + j * 110, y, nf(g.T) + ' / ' + nf(n.T), { size: 14, w: 700 }); }); });
    return s + text(300, 390, t('s11_d1a_tab_note'), { size: 11, col: C.muted });
  };
  a1.view = (args, t) => args[0] === 'tab' ? a1.tab(t) : a1.draw(GN.a1(args[0]), t);
  /* обратная задача A1 (03, шаг 5): до ответа — одинаковые показания двух культур; после — четыре варианта, совместимые с ними,
     и две проверки: убрать глюкозу; убрать лактозу, сохранив глюкозу. Все числа — GN.a1 (лактоза «много», глюкоза есть). */
  a1.VARS = [['s11_str_wt', {}], ['s11_str_noC', { cap: 0 }], ['s11_str_noI', { lacI: 0 }], ['s11_str_noIC', { lacI: 0, cap: 0 }]];
  a1.inv = (t, after) => {
    let s = panel(8, 8, 584, 402, t(after ? 's11_d1a_inv2' : 's11_d1a_inv1'));
    if (!after) {
      const c1 = GN.a1({ L: 'много', glc: 1 }), c2 = GN.a1({ L: 'много', glc: 1, cap: 0 });
      s += text(340, 70, t('s11_d1_cult1'), { size: 13, w: 700 }) + text(490, 70, t('s11_d1_cult2'), { size: 13, w: 700 });
      [['s11_rd1_op', o => t(o.op === 'free' ? 's11_v_free_all' : 's11_v_occ')], ['s11_rd1_cap', o => t(o.capDNA ? 'pill_yes' : 'pill_no')], ['s11_rda1_T', o => t('s11_v_of100', { n: nf(o.T) })], ['s11_rda1_med', () => t('s11_v_unknown')]]
        .forEach(([k, fn], i) => { const y = 112 + i * 44; s += line(24, y - 22, 576, y - 22, C.line, 1) + text(28, y, t(k), { a: 'l', size: 13 }) + text(340, y, fn(c1), { size: 13, w: 600 }) + text(490, y, fn(c2), { size: 13, w: 600 }); });
      return s;
    }
    const cols = [['s11_d1a_now', {}], ['s11_d1a_noglc', { glc: 0 }], ['s11_d1a_nolac', { L: 'нет' }]];
    cols.forEach(([k], j) => { s += textN(300 + j * 110, 58, t(k), { size: 12, w: 700 }); });
    a1.VARS.forEach(([k, st], i) => { const y = 120 + i * 62;
      s += line(20, y - 30, 580, y - 30, C.line, 1) + textN(28, y - 6, t(k), { a: 'l', size: 13, w: 600 });
      cols.forEach(([, ch], j) => { const o = GN.a1(Object.assign({ L: 'много', glc: 1 }, st, ch)); s += text(300 + j * 110, y, nf(o.T), { size: 15, w: 700, col: o.T >= 100 ? '#8A4B00' : o.T < 1 ? C.muted : C.ink }); }); });
    s += textN(300, 378, t('s11_d1a_inv_note'), { size: 11.5, col: C.muted });
    return s;
  };
})();

/* =====================================================================
   s0_gn_s2.js — схемы вкладки 2 (хроматин; 02, 2.3; 03, исследование 2; 07, разд. 3). Нуклеосома — гистоновый октамер
   (цилиндр), обвитый ДНК; отростки — гистоновые хвосты; «Ac» — ацетилированный лизин; «me» — метилированный CpG.
   Панель А — ген X: линкерная ДНК с участком активатора, нуклеосома на промоторе (TATA-бокс, точка начала транскрипции),
   начало гена X; детали конструктора. Панель Б — три показания. A2: две клетки с одинаковой ДНК.
   ===================================================================== */
(function () {
  const { C, f, G, text, textN, line, arrow, cross, panel } = GN;
  const K2 = { oct: '#E7D9C3', octS: '#8C6D46', act: '#D97706', rem: '#1F8A8A', hat: '#8A5A12', pic: '#7C4DBE', ac: '#2E7D32', me: '#263238', pio: '#2C7FB8', tf: '#E8912A', rna: '#E8912A' };
  /* перенос подписи по словам: строки не длиннее n знаков */
  const wrap = (s, n) => { const out = []; let cur = ''; for (const w of String(s).split(' ')) { if (cur && (cur + ' ' + w).length > n) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; } if (cur) out.push(cur); return out.join('\n'); };
  const dna = (x1, x2, y, g = 'linker') => G(g, line(x1, y - 3.2, x2, y - 3.2, C.tpl, 2.4) + line(x1, y + 3.2, x2, y + 3.2, C.tpl, 2.4));
  /* нуклеосома: октамер с двумя витками ДНК и хвостами; ac — метки Ac на хвостах; o.ghost — бледная (сдвинута или уходит) */
  function nuc(x, y, o = {}) {
    const op = o.ghost ? .35 : 1;
    let s = `<g opacity="${op}">` + G('nucleosome', `<rect x="${f(x - 30)}" y="${f(y - 18)}" width="60" height="36" rx="11" fill="${K2.oct}" stroke="${K2.octS}" stroke-width="1.4"/>` +
      `<path d="M${f(x - 34)},${f(y + 4)} C${f(x - 20)},${f(y + 24)} ${f(x + 20)},${f(y - 22)} ${f(x + 34)},${f(y - 2)}" fill="none" stroke="${C.tpl}" stroke-width="3"/>` +
      `<path d="M${f(x - 34)},${f(y - 6)} C${f(x - 20)},${f(y + 14)} ${f(x + 20)},${f(y - 30)} ${f(x + 34)},${f(y - 12)}" fill="none" stroke="${C.tpl}" stroke-width="3" opacity=".75"/>`);
    let tl = '';
    [-16, 0, 16].forEach((dx, i) => { tl += `<path d="M${f(x + dx)},${f(y - 18)} q${i % 2 ? 6 : -6},-8 0,-14" fill="none" stroke="${K2.octS}" stroke-width="1.6"/>`; });
    s += G('tails', tl);
    if (o.ac) s += G('ac', [-16, 16].map(dx => `<rect x="${f(x + dx - 10)}" y="${f(y - 48)}" width="20" height="13" rx="3" fill="${K2.ac}"/>` + text(x + dx, y - 41.5, 'Ac', { size: 9, w: 700, col: '#fff' })).join(''));
    return s + '</g>';
  }
  const meMark = (x, y) => `<line x1="${f(x)}" y1="${f(y + 4)}" x2="${f(x)}" y2="${f(y + 12)}" stroke="${K2.me}" stroke-width="1.4"/><circle cx="${f(x)}" cy="${f(y + 16)}" r="5.5" fill="${K2.me}"/>` + text(x, y + 16.5, 'me', { size: 6.5, w: 700, col: '#fff' });
  function prot(x, y, w, h, col, g, lab, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2.2)}" fill="${o.absent ? '#fff' : col}" opacity="${o.absent ? .6 : .95}" stroke="${o.absent ? col : '#fff'}" stroke-width="1.5"${o.absent ? ' stroke-dasharray="4 3"' : ''}/>` +
      textN(x, y + .5 - (String(lab).split('\n').length - 1) * (o.size || 10) * .62, lab, { size: o.size || 10, w: 700, col: o.absent ? col : '#fff' }));
  }
  /* covered — TATA-бокс под нуклеосомой: подпись под ДНК, иначе её закрыла бы нуклеосома */
  const tata = (x1, x2, y, covered) => G('tata', `<rect x="${f(x1)}" y="${f(y - 10)}" width="${f(x2 - x1)}" height="20" rx="3" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.3"/>` + text((x1 + x2) / 2, covered ? y + 24 : y + .5, 'TATA', { size: 9, w: 700, col: C.tpl }));
  const tss = (x, y) => G('tss', `<path d="M${f(x)},${f(y - 8)} L${f(x)},${f(y - 24)} L${f(x + 26)},${f(y - 24)}" fill="none" stroke="${C.ink}" stroke-width="2.2"/><path d="M${f(x + 33)},${f(y - 24)} l-8,-4.5 l0,9 z" fill="${C.ink}"/>`);
  /* панель Б: показания (строки), rows — [[ключ подписи, значение, выделить]] */
  function readsPanel(x, y, w, h, title, rows) {
    let s = panel(x, y, w, h, title);
    const cw = (w - 24) / rows.length;
    rows.forEach(([k, v, hl], i) => { const cx = x + 12 + i * cw;
      s += `<rect x="${f(cx + 3)}" y="${f(y + 30)}" width="${f(cw - 6)}" height="${f(h - 42)}" rx="8" fill="${hl ? '#FCEBC4' : '#fff'}" stroke="${hl ? '#C77700' : C.line}" stroke-width="${hl ? 2 : 1.1}"/>` +
        textN(cx + cw / 2, y + 42, wrap(k, 20), { size: 11.5, col: C.muted }) + textN(cx + cw / 2, y + h - 20, v, { size: 14, w: 700, col: hl ? '#8A4B00' : C.ink }); });
    return s;
  }
  Object.assign(GN, { nuc, prot, tata, tss, readsPanel, wrap, dna2: dna });   /* общие детали для вкладок 3 и 4 */
  const s2b = GN.s2b;
  s2b.reads = (o, t) => [[t('s11_rd2_acc'), t(o.acc ? 's11_v2_open' : 's11_v2_closed'), o.acc], [t('s11_rd2_ac'), t(o.ac ? 's11_v2_yes' : 's11_v2_no'), o.ac], [t('s11_rd2_tx'), t('s11_v2_tx_' + o.tx), o.tx !== 'none']];
  s2b.draw = (o, t, opt = {}) => {
    const Y = 212;
    let s = panel(8, 8, 584, 292, t('s11_d2_pA'), C.nuc);
    s += dna(16, 586, Y);
    /* участок активатора в линкерной ДНК */
    s += G('site', `<rect x="128" y="${Y - 8}" width="38" height="16" rx="3" fill="#CDEBD6" stroke="#2E9B57" stroke-width="1.4"/>`) + text(147, Y + 24, t('s11_d2_site'), { size: 10, col: C.muted });
    s += nuc(64, Y);
    /* промотор: TATA-бокс и точка начала транскрипции; нуклеосома на промоторе или сдвинутая */
    s += tata(222, 256, Y, !o.acc) + tss(304, Y);
    s += text(326, Y + 24, t('s11_d2_geneX'), { size: 10.5, w: 700, col: C.tpl });
    s += nuc(o.acc ? 372 : 258, Y, { ac: o.ac });
    s += nuc(476, Y) + nuc(556, Y);
    if (o.me === 'body') s += G('mecpg', [426, 512, 534].map(x => meMark(x, Y)).join(''));
    if (o.me === 'prom') s += G('mecpg', [222, 270, 300].map(x => meMark(x, Y)).join(''));
    /* детали конструктора */
    const recruited = o.aBound != null ? o.aBound : o.me !== 'prom';   /* aBound — активатор уже связан (кадры этапа 1) */
    s += o.A ? (recruited ? prot(147, Y - 32, 74, 26, K2.act, 'activator', t('s11_d2_act')) : prot(84, 118, 74, 26, K2.act, 'activator', t('s11_d2_act')))
             : prot(147, Y - 32, 74, 26, K2.act, 'activator', t('s11_d2_act'), { absent: true });
    const xR = 214, xH = 342, yP = 108;
    s += prot(xR, yP, 104, 30, K2.rem, 'remodeler', t('s11_d2_rem'), { absent: !o.R });
    if (o.R) s += G('atp', `<circle cx="${xR - 66}" cy="${yP}" r="11" fill="#F6C343" stroke="#9A7400"/>` + text(xR - 66, yP + .5, 'АТФ', { size: 7.5, w: 700, col: '#5A4300' }));
    s += prot(xH, yP, 118, 30, K2.hat, 'hat', t('s11_d2_hat'), { absent: !o.H, size: 9.5 });
    if (o.A && recruited) { if (o.R) s += line(160, Y - 46, xR - 10, yP + 16, K2.act, 1.6, 'stroke-dasharray="3 3"'); if (o.H) s += line(176, Y - 40, xH - 40, yP + 16, K2.act, 1.6, 'stroke-dasharray="3 3"'); }
    /* общие факторы и РНК-полимераза II: на доступном промоторе — собраны, иначе — в нуклеоплазме */
    const bound = o.G && o.acc;
    s += bound ? prot(250, Y - 34, 100, 34, K2.pic, 'pic', t('s11_d2_pic'), { size: 9 }) : prot(500, 108, 112, 34, K2.pic, 'pic', t('s11_d2_pic'), { size: 9, absent: !o.G });
    /* РНК */
    if (o.tx !== 'none') s += G('pic', line(300, Y + 40, o.tx === 'high' ? 470 : 380, Y + 40, K2.rna, o.tx === 'high' ? 7 : 2.6) + `<path d="M${o.tx === 'high' ? 478 : 386},${Y + 40} l-9,-6 l0,12 z" fill="${K2.rna}"/>`) + text(o.tx === 'high' ? 390 : 345, Y + 62, t('s11_d2_rna'), { size: 10.5, col: C.muted });
    else s += cross(330, Y + 44, 8);
    s += readsPanel(8, 312, 584, 98, t('s11_d2_pB'), s2b.reads(o, t));
    return s;
  };
  /* обратная задача (02, шаг 6): видны только показания (модель: активатор, ремоделирование, аппарат, без ацетилтрансферазы) */
  s2b.mask = t => panel(8, 8, 584, 292, t('s11_d2_mask'), C.nuc) + text(300, 150, t('s11_d2_mask_note'), { size: 13, col: C.muted }) +
    readsPanel(8, 312, 584, 98, t('s11_d2_pB'), s2b.reads(GN.s2b({ A: 1, R: 1, H: 0, G: 1, me: 'none' }), t)).replace(/<rect([^>]*)fill="#FCEBC4"/g, '<rect$1fill="#FCEBC4"');
  s2b.view = (args, t) => args[0] === 'mask' ? s2b.mask(t) : s2b.draw(GN.s2b(args[0]), t);

  /* ---------- A2: две клетки ---------- */
  const a2 = GN.a2;
  a2.cell = (y0, o, t, title) => {
    let s = panel(8, y0, 584, 196, title, C.nuc);
    const Y = y0 + 120;
    s += dna(16, 470, Y);
    s += text(118, Y + 26, t('s11_d2a_site'), { size: 10.5, col: C.muted });
    if (!o.open0 && !o.pio) s += nuc(118, Y);
    else { s += G('site', `<rect x="96" y="${Y - 8}" width="44" height="16" rx="3" fill="#CDEBD6" stroke="#2E9B57" stroke-width="1.4"/>`); if (!o.open0) s += nuc(48, Y, { ghost: true }); }
    if (o.pio) s += prot(118, Y - 60, 122, 26, K2.pio, 'pioneer', t('s11_d2a_pio'));
    /* фактор T: нет / неактивен (серый, вне ДНК) / активен (на участке, если участок доступен) */
    if (o.T === 'none') s += prot(250, y0 + 58, 70, 26, K2.tf, 'tf', 'T', { absent: true, size: 12 });
    else if (o.T === 'inactive') s += G('tf', `<rect x="215" y="${y0 + 45}" width="70" height="26" rx="12" fill="#BCC4CE" stroke="#fff" stroke-width="1.5"/>` + text(250, y0 + 58.5, 'T', { size: 12, w: 700, col: '#556171' }));
    else s += (o.bound != null ? o.bound : o.acc) ? prot(118, Y - 30, 52, 24, K2.tf, 'tf', 'T', { size: 12 }) : prot(250, y0 + 58, 70, 26, K2.tf, 'tf', 'T', { size: 12 });   /* bound — T уже связан (кадры этапа 2) */
    if (o.T === 'active' && !o.acc) s += cross(178, Y - 30, 7);
    /* промотор с аппаратом транскрипции */
    s += G('promoter', `<rect x="262" y="${Y - 10}" width="56" height="20" rx="4" fill="#E3ECF7" stroke="${C.tpl}" stroke-width="1.3"/>` + text(290, Y + .5, t('s11_d3_prom'), { size: 9, w: 700, col: C.tpl })) + tss(366, Y) + prot(312, Y - 34, 100, 30, K2.pic, 'pic', t('s11_d2_pic'), { size: 9 });
    if (o.rna) s += G('pic', line(370, Y + 30, 456, Y + 30, K2.rna, 6) + `<path d="M464,${Y + 30} l-9,-6 l0,12 z" fill="${K2.rna}"/>`);
    else s += cross(400, Y + 30, 7);
    /* показания клетки */
    s += `<rect x="482" y="${y0 + 34}" width="102" height="150" rx="8" fill="#fff" stroke="${C.line}"/>` +
      textN(533, y0 + 54, t('s11_rda2_acc'), { size: 10.5, col: C.muted }) + text(533, y0 + 82, t(o.acc ? 's11_v2_open' : 's11_v2a_closed'), { size: 12.5, w: 700, col: o.acc ? '#8A4B00' : C.ink }) +
      textN(533, y0 + 116, wrap(t('s11_rda2_rna'), 13), { size: 10.5, col: C.muted }) + text(533, y0 + 166, t(o.rna ? 's11_v2_yes' : 's11_v2_no'), { size: 12.5, w: 700, col: o.rna ? '#8A4B00' : C.ink });
    return s;
  };
  a2.draw = (c1, c2, t) => a2.cell(8, c1, t, t('s11_d2a_c1')) + a2.cell(214, c2, t, t('s11_d2a_c2'));
  /* обратная задача (03, шаг 5): участок доступен, вновь синтезированной РНК нет — только показания */
  a2.mask = t => panel(8, 8, 584, 402, t('s11_d2a_mask'), C.nuc) + textN(300, 170, t('s11_d2a_mask_r'), { size: 15, w: 700 }) + textN(300, 250, t('s11_d2a_mask_q'), { size: 12, col: C.muted });
  a2.view = (args, t) => args[0] === 'mask' ? a2.mask(t) : a2.draw(GN.a2(args[0]), GN.a2(args[1]), t);
})();

/* =====================================================================
   s0_gn_s3.js — схемы вкладки 3 (энхансер, промотор, сигнал; 02, 3.3; 03, исследование 3; 07, разд. 3).
   Сближение энхансера и промотора — пунктирная петля, одинаковая во всех состояниях (без «сворачивания»; 07, разд. 4):
   петля не изображается как обязательный механизм (подпись s11_t3_loop_note). Сигнал и рецептор — у мембраны (бислой).
   ===================================================================== */
(function () {
  const { C, f, G, text, textN, line, arrow, cross, panel, bilayer, nuc, prot, tata, tss, readsPanel, wrap, dna2 } = GN;
  const K3 = { tf: '#E8912A', tfOff: '#BCC4CE', med: '#8A5A12', pic: '#7C4DBE', rec: '#1F8A8A', sig: '#C2185B', enh: '#F3E1C7', q: '#B0418A', rna: '#E8912A' };
  const sig = (x, y) => G('signal', `<path d="M${f(x)},${f(y - 9)} l8,9 l-8,9 l-8,-9 z" fill="${K3.sig}"/>`);
  const receptor = (x, y, on) => G('receptor', `<rect x="${f(x - 11)}" y="${f(y - 20)}" width="22" height="40" rx="8" fill="${K3.rec}" stroke="#fff" stroke-width="1.4"/>`) + (on ? sig(x, y - 30) : '');
  /* фактор T: активный — цветной, неактивный — серый, нет — пунктир */
  function tf(x, y, st, lab = 'T', g = 'tf') {
    if (st === 'none') return prot(x, y, 46, 26, K3.tf, g, lab, { absent: true, size: 12 });
    if (st === 'inactive') return G(g, `<rect x="${f(x - 23)}" y="${f(y - 13)}" width="46" height="26" rx="12" fill="${K3.tfOff}" stroke="#fff" stroke-width="1.5"/>` + text(x, y + .5, lab, { size: 12, w: 700, col: '#556171' }));
    return prot(x, y, 46, 26, K3.tf, g, lab, { size: 12 });
  }
  const s3b = GN.s3b;
  s3b.reads = (o, t) => [[t('s11_rd3_T'), t('s11_v3_T_' + o.Tstate), o.Tstate === 'active'], [t('s11_rd3_Tb'), t(o.Tbound ? 'pill_yes' : 'pill_no'), o.Tbound],
    [t('s11_rd3_med'), t(o.medProm ? 'pill_yes' : 'pill_no'), o.medProm], [t('s11_rd3_tx'), t('s11_v3_tx_' + o.level), o.level === 'high']];
  s3b.draw = (o, t) => {
    let s = panel(8, 8, 584, 292, '', C.nuc);
    s += text(20, 26, t('s11_d3_pA'), { a: 'l', size: 13.5, w: 700, col: C.muted });
    /* мембрана клетки, рецептор и сигнал */
    s += bilayer(290, 560, 52, { g: 'membrane' }) + receptor(330, 52, o.S) + text(362, 30, t(o.S ? 's11_d3_sig_on' : 's11_d3_sig_off'), { a: 'l', size: 11, col: C.muted });
    const Y = 222, xE = 150, xP = 330;
    /* ДНК: энхансер слева, пунктирная петля между энхансером и промотором (условное сближение), промотор и ген Y справа */
    s += dna2(16, 200, Y, 'enhancer') + dna2(300, 586, Y, 'promoter');

(function () {

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.

   всегда в практикуме, а на странице «Объяснений» не используется.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */
const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {

    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */

      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */

    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
