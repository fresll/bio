    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => CASE.on ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —
   сначала прогноз, потом явный запуск («▶ Запустить», шаг или кнопка этапа). Как только шкала ушла с нуля, итог виден. */
function predictHold(K){ const sc = $('sc' + K); if (!sc) return; sc.classList.add('predict');
  /* рецензия v1.4, п. 8: кнопки этапов без исхода в доступном имени, пока прогноз не сделан */
  sc.querySelectorAll('.tlc').forEach(b => { if (!b.dataset.al) b.dataset.al = b.getAttribute('aria-label') || ''; b.setAttribute('aria-label', (b.dataset.al.split(':')[0] || '').trim());
    if (b.disabled) { b.dataset.no = '1'; b.disabled = false; } });   /* семинар 8, v1.2 (рецензия И-15): до запуска кружки одинаковы — недоступные не выдают место остановки */
  const c = $('capbox' + K), r = $('reads' + K); if (c) c.dataset.predict = t('predict_note'); if (r) r.dataset.predict = t('predict_reads'); }
function predictDone(K, T){ if (T > 1e-6) { const sc = $('sc' + K); if (sc && sc.classList.contains('predict')) { sc.classList.remove('predict');
  sc.querySelectorAll('.tlc').forEach(b => { if (b.dataset.al != null) { b.setAttribute('aria-label', b.dataset.al); delete b.dataset.al; } if (b.dataset.no) { b.disabled = true; delete b.dataset.no; } }); } } }

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typeof fitStage === 'function') fitStage(); });

/* =====================================================================
   s0_motion_s11.js — поэтапная анимация сцен семинара 11 (этап 1, Code) поверх движка timeStrip (s0_motion.js).
   Правило (промпт, этап 1; 07, разд. 9, п. 4): анимация только рисует модель. plan(o) возвращает этапы: для каждого — подпись и
   состояние модели на этом этапе (объект того же вида, что выход GN.*, — его рисует та же функция draw, что статичную схему).
   Кадр T ∈ (i−1, i]: первая половина — состояние предыдущего этапа, вторая — этапа i (или функция u → состояние для плавной
   части, например роста мРНК). Конечный кадр (T = stop) — draw(o), то есть ровно статичная схема. Остановка раньше конца — stop < n.
   ===================================================================== */
function stageAnim(K, cfg) {
  const view = stageView(K);
  let P = null, sig = null, armed = false, hold = false;
  const frameAt = T => {
    if (cfg.masked && cfg.masked()) return cfg.maskDraw();
    const o = cfg.cur(); if (!P) P = cfg.plan(o);
    if (T >= P.stop - 1e-9) return cfg.draw(o);
    if (T <= 1e-9) return cfg.draw(P.init);
    const i = Math.min(P.st.length - 1, Math.max(0, Math.ceil(T) - 1)), u = T - i, st = P.st[i], prev = i ? P.st[i - 1] : P.init;
    const S = typeof st === 'function' ? st(u) : (u < .5 ? (typeof prev === 'function' ? prev(1) : prev) : st);
    return cfg.draw(S);
  };
  const tl = timeStrip(K, { note: cfg.note, steps: cfg.steps, render(T){ const e = $('svg' + K); if (e) e.innerHTML = defs(K) + frameAt(T); predictDone(K, T); }, onEnd: view.back });
  return {
    tl, frameAt, get plan(){ return P; },
    /* вызывается из update() сцены: пересчитать план; после смены условия — кадр «до начала» и пауза для прогноза;
       после ответа в сценарии — запуск с начала; иначе — конечный кадр (статичная схема) */
    sync(){
      const o = cfg.cur(); P = cfg.plan(o);
      const s = JSON.stringify([P.keys, P.stop, P.stopKey, cfg.masked && cfg.masked()]);
      if (s !== sig) { sig = s; tl.config(P.keys, P.stop, P.stopKey, { speed: cfg.speed || 1.5 }); if (!armed && !hold) tl.seek(tl.end); }
      if (cfg.masked && cfg.masked()) { armed = hold = false; tl.seek(tl.end); return; }
      if (armed) { armed = false; hold = false; tl.play(true); view.reveal(300); }
      else if (hold) { hold = false; tl.seek(0); predictHold(K); }
      else if (!tl.playing) tl.redraw();
    },
    arm(){ armed = true; }, hold(){ hold = true; },
  };
}
/* фон этапа: светлая подложка области схемы, где идёт процесс этапа (рисуется под деталями) */
GN.halo = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#FFF3C4" opacity=".55"/>`;

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (граница с занятием, R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   s0z_ui.js — общие помощники сцен семинара 11 (статичная версия v1.1-с, Code): плашки показаний, строка ключевых показаний
   для телефона, блок «Задача» с условиями (видны до ответа — 07, разд. 1), раскрываемые блоки «Правила модели»,
   «Чего модель не показывает», «Как это установили», «Новые данные», ссылка «К объяснению», лестница подсказок h1–h3.
   Тексты — ключи документов v1.1 (s11_tK_…, s11_aK_…). Схемы рисуют чистые функции GN.<сцена>.draw (s0_gn_s*.js).
   ===================================================================== */
const pl = (k, v, cls = 'np') => `<span class="pill ${cls}">${t(k, v)}</span>`;
const maskOf = K => (typeof poeMasked === 'function' && poeMasked(K)) || null;   /* шаг сценария с hide/mask до ответа */
function mstripSet(K, head, items){
  let e = $('ms' + K);
  if (!e){ const zw = $('sc' + K).querySelector('.zwrap'); zw.insertAdjacentHTML('afterend', `<p class="mstrip" id="ms${K}" aria-hidden="true"></p>`); e = $('ms' + K); }
  e.innerHTML = `<span class="mh">${head}</span>` + items.map(([l, v]) => `<span>${l}: <b>${v}</b></span>`).join('');
}
function segNA(id, off){ $(id).querySelectorAll('button').forEach(b => { b.classList.toggle('na', !!off); b.disabled = !!off; b.setAttribute('aria-disabled', String(!!off)); }); }
/* многострочный текст правил (строки «1. …» или «- …») → список */
function listHTML(s){ const L = String(s).split('\n').filter(Boolean);
  if (L.length < 2) return `<p>${s}</p>`;
  const num = /^\d+\.\s/.test(L[0]); return `<${num ? 'ol' : 'ul'} class="rules">` + L.map(x => `<li>${x.replace(/^(\d+\.|-)\s+/, '')}</li>`).join('') + `</${num ? 'ol' : 'ul'}>`; }
const det = (titleKey, body, cls = '') => `<details class="panel advx ${cls}"><summary>${t(titleKey)}</summary>${body}</details>`;
/* блок «Задача» над переключателями: задача и условия — до ответа (prefix — 's11_t1' или 's11_a1') */
function taskFrame(K, P){
  const ctrl = $('ctrl' + K);
  const task = (P + '_task') in TEXTS ? `<p>${t(P + '_task')}</p>` : '';
  ctrl.insertAdjacentHTML('beforebegin', `<div class="panel aprob" id="task${K}"><b class="k">${t(/a\d$/.test(P) ? 'a_prob_t' : 'b_task_t')}</b>${task}<p class="small"><b>${t('b_cond_t')}</b> ${t(P + '_cond')}</p></div>`);
}
/* раскрываемые блоки под показаниями; blocks — [[ключ заголовка, ключ текста или функция], …]; в конце — «К объяснению» */
function moreFrame(K, P, blocks){
  const side = $('sc' + K).querySelector('.side'), take = side.querySelector('.take');
  let h = '';
  for (const [tk, body, cls] of blocks) { const b = typeof body === 'function' ? body() : (body in TEXTS ? (/_rules$|_eq$/.test(body) ? listHTML(t(body)) : `<p>${t(body)}</p>`) : '');
    if (b) h += det(tk, b, cls || ''); }
  if ((P + '_route') in TEXTS) h += `<p class="small routeln"><a id="rl${K}" href="#">${t(P + '_route')}</a></p>`;
  (take || side.lastElementChild).insertAdjacentHTML('afterend', h);
  if (take && !$('take' + K).textContent) take.classList.add('none');   /* блока «Вывод» в документах семинара 11 нет (класс, а не hidden: poeRender управляет hidden) */
}
/* ссылка «К объяснению → БИО-11·k»: адрес — страница «Объяснений», якорь — шаг k (номера — 02, 03) */
function routeLinks(map){ for (const K in map) { const a = $('rl' + K); if (a && TEXTS.route_url) a.href = TEXTS.route_url + '#' + map[K]; } }
const advReads = (K, html) => { $('reads' + K).innerHTML = `<p class="small rdnote">${t('rd_model')}</p>` + html; };
const baseReads = (K, html) => { $('reads' + K).innerHTML = html; };
/* подпись перехода над схемой (шаг с полем note), как в семинаре 10 v1.2.1 */
(function(){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments);
  document.querySelectorAll('.psw').forEach(e => { e.hidden = true; });
  if (POE.on && POE.shown) { const st = SCENES[cur].poe[poeIdx(POE.i)];
    if (st && st.note) { let e = $('psw' + cur);
      if (!e) { $('sc' + cur).querySelector('.stage').insertAdjacentHTML('afterbegin', `<p class="psw" id="psw${cur}" role="status"></p>`); e = $('psw' + cur); }
      e.textContent = t(st.note); e.hidden = false; } }
  return r; }; })();
/* лестница подсказок h1–h3 (02, вводная часть): ключи <шаг>_h1…_h3; подсказки не содержат буквы верного варианта */
(function(){
  const _pr = poeRender; let HINT = { key: '', n: 0 };
  poeRender = function(){
    const r = _pr.apply(this, arguments);
    if (!POE.on) return r;
    const box = $('poe' + cur), si = poeIdx(POE.i), P = poeKey(cur, si), S = SCENES[cur];
    const hk = i => (P + '_h' + i) in TEXTS ? P + '_h' + i : (S.hints && (S.hints + '_h' + i) in TEXTS ? S.hints + '_h' + i : null);
    if (!box || !hk(1) || POE.shown) return r;
    if (HINT.key !== P) HINT = { key: P, n: 0 };
    const hs = []; for (let i = 1; i <= 3; i++) if (hk(i)) hs.push(t(hk(i)));
    const shown = hs.slice(0, HINT.n).map((h, i) => `<p class="small hint"><b>${t('hint_n', { i: i + 1 })}</b> ${h}</p>`).join('');
    box.querySelector('.opts').insertAdjacentHTML('afterend', shown + (HINT.n < hs.length ? `<button class="btn ghost" id="poeHint">${t('hint_btn', { i: HINT.n + 1, n: hs.length })}</button>` : ''));
    const b = $('poeHint'); if (b) b.onclick = () => { HINT.n++; POE_FOCUS = { id: 'poeHint' }; poeRender(); };
    return r;
  };
})();
/* кнопка «↓ К выводу» не нужна, если блока «Вывод» нет (в документах семинара 11 его нет) */
(function(){ const _ri = revInit; revInit = function(){ const r = _ri.apply(this, arguments);
  document.querySelectorAll('#scenes .side').forEach(sd => { const tk = sd.querySelector('.take'), b = sd.querySelector('.totake'); if (b && tk && tk.classList.contains('none')) b.remove(); });
  return r; }; })();

/* =====================================================================
   Вкладка 1. Оперон: отрицательная и положительная регуляция транскрипции (02, вкладка 1; модель GN.s1b — 07, разд. 2.1).
   Переключатели «Лактоза», «Глюкоза»; конструктор: репрессор LacI (убран = удалён ген lacI), белок CAP.
   Шаги 1–7 (02, 1.5–1.10): флаги hide, mask, last — как в документе. Статичная версия v1.1-с: анимацию добавляет этап 1.
   Граница с аудиторным занятием (06, разд. 4, строка 1): мутант, не связывающий индуктор, не используется.
   ===================================================================== */
(function(){
  const K = '1b', M = GN.s1b;
  layout(K); window.MODEL1B = M;
  const parts = { lacI: true, cap: true };
  let inv = false;
  const kit = kitMake(K, { parts, title: 'k_title', hint: 'k_hint', changed: () => { A.hold(); SCENES[K].update(); },
    slots: [{ id: 'lacI', k: 's11_k1_lacI' }, { id: 'cap', k: 's11_k1_cap' }] });
  $('ctrl' + K).innerHTML = segHTML('s1b_lac', 's11_c1_lac', [['0', 's11_c_no'], ['1', 's11_c_yes']], '0') +
    segHTML('s1b_glc', 's11_c1_glc', [['0', 's11_c_no'], ['1', 's11_c_yes']], '0') + `<div id="kit${K}"></div>` +
    `<p class="small">${t('s11_ctrl_note')}</p>`;
  taskFrame(K, 's11_t1');
  moreFrame(K, 's11_t1', [['b_rules_t', 's11_t1_rules'], ['b_lim_t', 's11_t1_limits'], ['b_how_t', 's11_t1_how']]);
  const cur = () => M({ lac: +segVal('s1b_lac'), glc: +segVal('s1b_glc'), lacI: parts.lacI ? 1 : 0, cap: parts.cap ? 1 : 0 });
  let caseC = null;   /* «Найти причину»: показать образец с причиной caseC (схема модели A1 — с долей времени свободного оператора) */
  const masked = () => inv || !!caseC || !!(maskOf(K) && maskOf(K).mask);
  window.STATIC1B = () => defs(K) + (masked() ? M.mask(t) : M.draw(cur(), t));
  /* этап 1 (Code): шкала этапов и анимация — кадры по плану GN.1b.plan (s0_go_s11.js), конечный кадр = статичная схема */
  const A = stageAnim(K, { cur, draw: o => M.draw(o, t), plan: M.plan, masked, maskDraw: () => caseC ? GN.a1.draw(GN.a1(Object.assign({ glc: 0, lacI: 1, cap: 1, lacY: 1 }, GN.case1.causes[caseC])), t) : M.mask(t), note: 'tl_note' });
  window.TL1B = A.tl;
  function update(){
    if (!(typeof POE !== 'undefined' && POE.on)) inv = false;
    kit.render();
    A.sync();
    if (caseC){ const r = GN.case1.read(caseC); baseReads(K, ''); setCap(K, 'c1_w_' + caseC); mstripSet(K, t('ms_head'), []); return; }
    if (masked()){ baseReads(K, `<p class="small">${t('s11_rd_mask')}</p>`); setCap(K, 's11_t1_cap_mask'); mstripSet(K, t('ms_head'), []); return; }

/* =====================================================================

   «Продвинутый»: пять случаев (порядок перемешивается на сайте), в каждом — выбор всех совместимых механизмов (чекбоксы)
   и одного дополнительного исследования; после проверки — объяснение случая. Итоговый вопрос (s11_int_final) — последним.
   ===================================================================== */
(function(){
  const box = document.createElement('section'); box.className = 'panel intbox'; box.id = 'intBox'; box.hidden = true;
  $('scenes').insertAdjacentElement('afterend', box);
  const RND = typeof POE_RND !== 'undefined' && POE_RND, sh = (n, k) => RND ? poeShuffle(n, k + '/' + POE_SEED) : [...Array(n).keys()];

  const st = {}; let hint = 0, fin = null;
  function caseHTML(c){
    const k = c.key, S = st[k] || (st[k] = { picked: new Set(), extra: null, res: null });
    const mech = [...Array(c.m).keys()].map(i => 'm' + (i + 1)).concat([...Array(c.n).keys()].map(i => 'n' + (i + 1)));
    const mo = sh(mech.length, k + '/m').map(i => mech[i]), xo = sh(1 + c.x, k + '/x').map(i => 'x' + (i + 1));
    const r = S.res;

      `<p class="k">${t('s11_int_mech')}</p>` + mo.map(m => { const okm = m[0] === 'm';
        return `<label class="chk${r ? (okm ? ' good' : S.picked.has(m) ? ' bad' : '') : ''}"><input type="checkbox" data-m="${m}"${S.picked.has(m) ? ' checked' : ''}${r ? ' disabled' : ''}> <span>${t(k + '_' + m)}</span>` +
          (r && !okm && S.picked.has(m) ? `<small>${t(k + '_' + m + '_why')}</small>` : '') + (r ? `<small class="v">${t(okm ? 's11_int_ok' : 's11_int_no')}</small>` : '') + `</label>`; }).join('') +
      `<p class="k">${t('s11_int_extra')}</p>` + xo.map(x => `<label class="chk${r ? (x === 'x1' ? ' good' : S.extra === x ? ' bad' : '') : ''}"><input type="radio" name="x_${k}" data-x="${x}"${S.extra === x ? ' checked' : ''}${r ? ' disabled' : ''}> <span>${t(k + '_' + x)}</span>` +
        (r && x !== 'x1' && S.extra === x ? `<small>${t(k + '_' + x + '_why')}</small>` : '') + `</label>`).join('');
    if (!r) h += `<div class="btns"><button class="btn" data-chk="${k}"${S.picked.size && S.extra ? '' : ' disabled'}>${t('s11_int_check')}</button></div>`;
    else h += `<p class="ex"><b>${t(r.mech === 'ok' && r.extra === 'ok' ? 's11_int_right' : r.mech === 'partial' ? 's11_int_partial' : 's11_int_wrong')}</b> ${t(k + '_expl')}</p>`;
    return h + `</div>`;
  }
  function render(){
    const L = ['А', 'Б', 'В', 'Г'], P = 's11_int_final', fo = sh(4, 'int/final');
    let h = `<h3>${t('s11_int_title')}</h3><p class="small intreco">${t('s11_int_reco')}</p><p>${t('s11_int_cond')}</p>` +   /* рекомендация без блокировки (решение автора 16.11.2026, п. 6) */
      `<div class="btns">` + (hint < 3 ? `<button class="btn ghost" id="intHint">${t('hint_btn', { i: hint + 1, n: 3 })}</button>` : '') + `</div>` +
      [1, 2, 3].slice(0, hint).map(i => `<p class="small hint"><b>${t('hint_n', { i })}</b> ${t('s11_int_h' + i)}</p>`).join('') +
      ord.map(i => caseHTML(cases[i])).join('') +

/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
