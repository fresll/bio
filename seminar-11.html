<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Биология», 1–2 семестры">
<title>Семинар 11 · Регуляция экспрессии генов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.qcol{color:var(--muted);font-size:13.5px;margin:2px 0 0;max-width:90ch;flex-basis:100%;order:9}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
/* v1.1.6: варианты итогового вопроса (блок .intbox) — тот же вид, что у вариантов шагов (прежде были кнопки браузера без стиля) */
.poe .opts,.intbox .opts{display:grid;gap:6px}
.poe .opt,.intbox .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L,.intbox .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked,.intbox .opt.picked{border-color:var(--ink)}
.poe .opt.right,.intbox .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick,.intbox .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex,.intbox .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled,.intbox .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

lg_mem": "мембрана — липидный бислой; мембранные белки (пермеаза, рецептор) — в мембране", "lg_nuc": "нуклеосома — гистоновый октамер (цилиндр), обвитый ДНК; отростки — гистоновые хвосты; «Ac» — ацетилированный лизин; «me» — метилированный CpG", "lg_ub": "красные кружки — цепь убиквитина; серый цилиндр — протеасома; «P» — фосфатная группа", "lg_red": "красный крест ✕ — событие не происходит; пунктирная петля — сближение энхансера и промотора (условно)", "lg_click": "детали схемы открывают справку: нажмите на белок, участок ДНК или молекулу", "lg_model": "Переключатели показывают предсказания учебной модели, а не результат эксперимента: правила модели заданы заранее, их основания и границы — в «Объяснениях». Числа на схемах условные.", "teacher_t": "Источники", "src_t_st": "Источники", "teacher_1": "Страница — интерактивный семинар для самостоятельной подготовки. Базовый уровень требуется на коллоквиуме и зачёте; продвинутый уровень — четыре добровольных исследования и итоговая задача.", "teacher_2": "Модели учебные: правила заданы явно (раскрываемый блок «Правила модели»), числа условные.", "teacher_3": "Источники — учебник и работы в полном тексте.", "b_task_t": "Задача", "b_cond_t": "Условия:", "b_rules_t": "Правила модели", "b_lim_t": "Чего модель не показывает", "b_how_t": "Как это установили", "b_new_t": "Новые данные", "b_newhow_t": "Новые данные и как это установили", "b_howq_t": "Как это установили?", "b_eq_t": "Переменные, уравнения, единицы", "b_route": "{t}", "k_title": "Конструктор: нажмите на деталь, чтобы убрать её; нажмите на неё в лотке, чтобы вернуть", "k_on": "на месте", "k_empty": "нет", "k_fixed": "закреплена", "k_first": "Убраны несколько деталей.", "k_hint": "Исход определяется правилами модели (блок «Правила модели»).", "hint_btn": "Подсказка {i} из {n}", "hint_n": "Подсказка {i}.", "rd_t": "Показания модели", "poe_hidden": "Схема откроется после ответа: сначала выберите вариант и нажмите «Показать на схеме».", "m_hidden": "Показания откроются после ответа", "a_prob_t": "Исследование", "a_lim_t": "Чего модель не показывает", "a_new_t": "Новые данные и как это установили", "a_how_t": "Как это установили:", "rd_model": "Показания учебной модели; числа условные.", "ms_head": "Показания", "amode_t": "Режим", "amode_e": "Исследование", "amode_m": "Модель", "amk_t": "Сцена", "amk_1": "Модель 1", "amode_note": "Переключатели показывают предсказания учебной модели, а не доказательство.", "s11_ctrl_note": "Переключатели показывают предсказания учебной модели, а не результат эксперимента. Числа на схеме условные: они показывают, во сколько раз изменилась величина при заданных правилах модели", "s11_t1_title": "1. Оперон: как белок на ДНК и малая молекула задают интенсивность транскрипции", "s11_t1_task": "Предскажите, занят ли оператор и с какой интенсивностью транскрибируется lac-оперон при разных сочетаниях сахаров в среде, а также после удаления репрессора или белка-активатора катаболитных генов (CAP). Затем проверьте предсказание на схеме.", "s11_t1_cond": "Объект — клетки кишечной палочки <i>Escherichia coli</i> в жидкой питательной среде. В среде может быть лактоза, глюкоза, оба сахара или ни одного. Схема показывает состояние оперона в одной клетке после того, как установилась интенсивность транскрипции в новой среде. Лактоза в модели в избытке: её достаточно, чтобы при отсутствии мутаций освободить оператор (это условие модели; в клетке при глюкозе лактоза поступает хуже)", "s11_t1_rules": "1. Если репрессор есть и лактозы нет, репрессор связан с оператором большую часть времени: транскрипция базальная.\n2. Если лактоза есть, из неё в клетке образуется аллолактоза; она связывается с репрессором, и репрессор отделяется от оператора.\n3. Если глюкозы нет, в клетке много циклического аденозинмонофосфата (цАМФ); комплекс CAP–цАМФ связывается с ДНК рядом с промотором и облегчает связывание РНК-полимеразы. Если глюкоза есть, цАМФ мало, CAP с ДНК не связан.\n4. Оператор свободен и CAP–цАМФ связан — транскрипция высокая; оператор свободен, а CAP не связан — умеренная (в модели в 10 раз ниже высокой); оператор занят — базальная (в модели не выше 1 % от высокой).", "s11_t1_cap_00": "Лактозы нет: репрессор связан с оператором. Комплекс CAP–цАМФ на ДНК есть, но РНК-полимераза транскрибирует оперон лишь изредка — базальная транскрипция", "s11_t1_cap_0G": "Лактозы нет: оператор занят репрессором. Глюкоза есть: цАМФ мало, CAP с ДНК не связан. Транскрипция базальная", "s11_t1_cap_LG": "Аллолактоза сняла репрессор с оператора. Но глюкоза есть, цАМФ мало, CAP–цАМФ на ДНК нет, а без активатора промотор lac-оперона инициирует транскрипцию неэффективно. Транскрипция умеренная", "s11_t1_cap_L0": "Оператор свободен, комплекс CAP–цАМФ связан рядом с промотором. Транскрипция высокая", "s11_t1_cap_noI_0": "Гена репрессора нет: оператор свободен и без лактозы. CAP–цАМФ связан — транскрипция высокая", "s11_t1_cap_noI_G": "Гена репрессора нет: оператор свободен. Глюкоза есть, CAP не связан — транскрипция умеренная", "s11_t1_cap_noC_0": "Белка CAP нет. Лактозы нет — оператор занят репрессором. Транскрипция базальная", "s11_t1_cap_noC_L": "Белка CAP нет. Оператор свободен, но положительной регуляции нет ни при каком количестве глюкозы — транскрипция умеренная", "s11_t1_cap_noIC": "Нет ни репрессора, ни CAP: оператор свободен всегда, положительной регуляции нет — транскрипция умеренная", "s11_t1_limits": "Модель показывает один главный оператор; у lac-оперона есть ещё два дополнительных, и репрессор может связывать два оператора одновременно, образуя петлю ДНК. Модель не показывает, как образуется аллолактоза. Глюкоза действует на оперон не только через цАМФ: при транспорте глюкозы белок системы её переноса подавляет пермеазу лактозы, и лактоза поступает в клетку хуже; поэтому в клетке при глюкозе оператор может в значительной мере оставаться занятым — в модели этого не происходит, потому что лактоза задана в избытке. Уровни транскрипции в модели — три ступени; в живой клетке интенсивность изменяется непрерывно и различается у разных штаммов", "s11_t1_how": "Устройство регуляции оперона установили сочетанием генетических и биохимических исследований. Позже вклад двух регуляторов разделили: вместо лактозы в среду добавляли синтетический индуктор, который не расщепляется ферментами бактерии, и отдельно — цАМФ. Так можно независимо изменять активность репрессора и активатора. Оказалось, что зависимость транскрипции от двух сигналов сложнее простого правила \"нужны оба условия одновременно\"", "s11_t1_route": "К объяснению → БИО-11·3–6", "s11_t1_s1_q": "В среде нет ни лактозы, ни глюкозы. Комплекс CAP–цАМФ связан с ДНК рядом с промотором. Какой будет транскрипция lac-оперона?", "s11_t1_s1_o1": "Базальная: оператор занят репрессором", "s11_t1_s1_o2": "Высокая: активатор связан с ДНК", "s11_t1_s1_o3": "Умеренная: глюкозы нет, поэтому клетке нужны другие сахара", "s11_t1_s1_o4": "Транскрипции нет совсем", "s11_t1_s1_e": "Верно. Активатор на ДНК есть, но репрессор на операторе препятствует транскрипции; без индуктора отрицательная регуляция не снята. Поэтому положительный сигнал (отсутствие глюкозы) сам по себе не приводит к транскрипции", "s11_t1_s1_w2": "Активатор облегчает связывание РНК-полимеразы, но не снимает репрессор с оператора. Пока репрессор связан, транскрипция остаётся базальной", "s11_t1_s1_w3": "Интенсивность определяется не потребностью клетки, а тем, какие белки связаны с ДНК. Оператор занят — транскрипция базальная", "s11_t1_s1_w4": "Репрессия неполная: изредка РНК-полимераза транскрибирует оперон, и в клетке есть небольшое количество его продуктов. Это базальная транскрипция", "s11_t1_s1_h1": "Что связано с оператором, если в клетке нет индуктора?", "s11_t1_s1_h2": "Какое из двух регуляторных событий на схеме препятствует транскрипции?", "s11_t1_s1_h3": "Активатор помогает РНК-полимеразе, но не может убрать репрессор", "s11_t1_s2_q": "В среде есть и лактоза, и глюкоза. Что будет с оператором и с транскрипцией?", "s11_t1_s2_o1": "Оператор свободен, транскрипция умеренная", "s11_t1_s2_o2": "Оператор свободен, транскрипция высокая", "s11_t1_s2_o3": "Оператор занят: глюкоза не даёт репрессору отделиться", "s11_t1_s2_o4": "Транскрипции нет: клетка использует глюкозу", "s11_t1_s2_e": "Верно. Аллолактоза сняла репрессор, но при глюкозе в клетке мало цАМФ, CAP не связан с ДНК, и без активатора промотор инициирует транскрипцию неэффективно. Снятие репрессии не означает максимальной транскрипции", "s11_t1_s2_w2": "Свободный оператор — необходимое, но не достаточное условие высокой транскрипции. Не хватает комплекса CAP–цАМФ", "s11_t1_s2_w3": "В модели лактоза задана в избытке, и её хватает, чтобы снять репрессор и при глюкозе. В клетке глюкоза уменьшает поступление лактозы, поэтому при меньшем количестве лактозы оператор может в значительной мере оставаться занятым (продвинутый уровень, исследование 1)", "s11_t1_s2_w4": "Транскрипция есть, но умеренная. Модель описывает белки на ДНК, а не предпочтения клетки", "s11_t1_s2_h1": "Какие два события на ДНК нужны для высокой транскрипции?", "s11_t1_s2_h2": "Сравните количество цАМФ в клетке с глюкозой и без неё", "s11_t1_s2_h3": "Репрессор снят, а активатора на ДНК нет", "s11_t1_s3_q": "Какая молекула, связываясь с репрессором LacI, освобождает оператор, когда в среде есть лактоза?", "s11_t1_s3_o1": "Аллолактоза — изомер лактозы, образующийся в клетке", "s11_t1_s3_o2": "Лактоза", "s11_t1_s3_o3": "Глюкоза", "s11_t1_s3_o4": "цАМФ", "s11_t1_s3_e": "Верно. Аллолактоза связывается с репрессором и изменяет его конформацию; сродство репрессора к оператору резко снижается. Аллолактоза — физиологический индуктор lac-оперона", "s11_t1_s3_w2": "Лактоза поступает в клетку, но с репрессором связывается её изомер аллолактоза. Лактозу называют индуктором условно: она служит источником индуктора", "s11_t1_s3_w3": "Глюкоза с репрессором не связывается; она снижает количество цАМФ и поступление лактозы в клетку", "s11_t1_s3_w4": "цАМФ связывается с белком CAP, а не с репрессором; это положительная регуляция", "s11_t1_s3_h1": "Какой белок изменяет конформацию при связывании индуктора?", "s11_t1_s3_h2": "Индуктор — малая молекула, образующаяся из лактозы в клетке", "s11_t1_s3_h3": "Ищите изомер лактозы", "s11_t1_s4_q": "У мутантной бактерии удалён ген репрессора <i>lacI</i>. В среде нет ни лактозы, ни глюкозы. Какой будет транскрипция оперона?", "s11_t1_s4_o1": "Высокая", "s11_t1_s4_o2": "Базальная: нет лактозы", "s11_t1_s4_o3": "Умеренная: без репрессора регуляция нарушена", "s11_t1_s4_o4": "Транскрипции нет: без регуляторного белка оперон не работает", "s11_t1_s4_e": "Верно. Без репрессора оператор свободен независимо от лактозы, а без глюкозы комплекс CAP–цАМФ связан с ДНК. Мутант транскрибирует оперон без индуктора", "s11_t1_s4_w2": "Лактоза нужна только для того, чтобы снять репрессор. Если репрессора нет, снимать нечего", "s11_t1_s4_w3": "Положительная регуляция у мутанта сохранена: без глюкозы CAP–цАМФ связан, и транскрипция высокая", "s11_t1_s4_w4": "Репрессор только подавляет транскрипцию. Его удаление снимает подавление", "s11_t1_s4_h1": "Что делает репрессор в норме?", "s11_t1_s4_h2": "Есть ли у мутанта что-то, что может занять оператор?", "s11_t1_s4_h3": "Без репрессора оператор свободен всегда; осталось оценить CAP", "s11_t1_s5_q": "У мутантной бактерии нет белка CAP. В среде есть лактоза, глюкозы нет. Какой будет транскрипция оперона?", "s11_t1_s5_o1": "Умеренная", "s11_t1_s5_o2": "Высокая: глюкозы нет, цАМФ много", "s11_t1_s5_o3": "Базальная: без активатора оперон не транскрибируется", "s11_t1_s5_o4": "Такая же, как у нормальной бактерии в этой среде", "s11_t1_s5_e": "Верно. Аллолактоза сняла репрессор, но без CAP положительной регуляции нет, даже если цАМФ в клетке много. Мутант не достигает высокой транскрипции ни в какой среде", "s11_t1_s5_w2": "цАМФ действует через CAP. Без белка CAP высокое количество цАМФ не изменяет транскрипцию оперона", "s11_t1_s5_w3": "Без активатора промотор инициирует транскрипцию неэффективно, но инициирует. При свободном операторе транскрипция умеренная, а не базальная", "s11_t1_s5_w4": "У нормальной бактерии в этой среде CAP–цАМФ связан, и транскрипция высокая; у мутанта — умеренная", "s11_t1_s5_h1": "Что связывает цАМФ?", "s11_t1_s5_h2": "Оцените отдельно оператор и положительную регуляцию", "s11_t1_s5_h3": "Оператор свободен, активатора нет", "s11_t1_s6_obs": "Культура 1: оператор свободен, CAP–цАМФ на ДНК нет, транскрипция умеренная, в среде есть глюкоза. Культура 2: оператор свободен, CAP–цАМФ на ДНК нет, транскрипция умеренная, глюкозы в среде нет", "s11_t1_s6_q": "Какое объяснение для культуры 2 совместимо с правилами модели?", "s11_t1_s6_o1": "У бактерий культуры 2 нет белка CAP", "s11_t1_s6_o2": "В культуре 2 нет лактозы", "s11_t1_s6_o3": "В культуре 2 удалён ген репрессора", "s11_t1_s6_o4": "Обе культуры в одинаковых условиях", "s11_t1_s6_e": "Верно. Без глюкозы цАМФ много, но CAP на ДНК нет — значит, нет самого белка CAP (или он не способен связать цАМФ; в модели эта мутация не показана). Для культуры 1 достаточно глюкозы в среде", "s11_t1_s6_w2": "Тогда оператор был бы занят репрессором (если ген репрессора не удалён). Показания говорят, что оператор свободен", "s11_t1_s6_w3": "Удаление репрессора освобождает оператор, но без глюкозы CAP–цАМФ был бы связан, и транскрипция стала бы высокой", "s11_t1_s6_w4": "Условия разные: в культуре 2 глюкозы нет. Одинаковый результат получен по разным причинам", "s11_t1_s6_h1": "Чем отличаются условия культур?", "s11_t1_s6_h2": "Почему CAP может не быть на ДНК при большом количестве цАМФ?", "s11_t1_s6_h3": "Проверьте, какой детали конструктора не хватает", "s11_t1_s7_q": "Почему lac-оперон — полезная учебная модель, но не схема устройства генов человека?", "s11_t1_s7_o1": "Гены человека, как правило, имеют собственные промоторы и транскрибируются отдельно, ДНК упакована в хроматин, а регуляторные участки могут находиться далеко от промотора", "s11_t1_s7_o2": "У человека нет регуляторных белков, связывающихся с ДНК", "s11_t1_s7_o3": "Гены человека транскрибируются постоянно и не регулируются", "s11_t1_s7_o4": "Оперон — устаревшая модель, её выводы неверны", "s11_t1_s7_e": "Верно. Принцип общий: регуляторный белок связывается с определённой последовательностью ДНК, а его активность изменяется малой молекулой или сигналом. Но оперонов у человека, как правило, нет, большинство мРНК содержит одну основную кодирующую область, а доступность промотора зависит от хроматина (вкладка 2)", "s11_t1_s7_w2": "Такие белки есть: факторы транскрипции, активаторы и репрессоры (вкладка 3)", "s11_t1_s7_w3": "Экспрессия генов человека регулируется на многих уровнях; об этом весь семинар", "s11_t1_s7_w4": "Выводы для бактерий верны и подтверждены. Ограничение в другом: модель нельзя переносить на эукариотические гены без изменений", "s11_t1_s7_h1": "Сколько генов транскрибируется с одного промотора в опероне?", "s11_t1_s7_h2": "Чем ДНК в ядре отличается от ДНК бактерии?", "s11_t1_s7_h3": "Подумайте о хроматине и удалённых регуляторных участках", "s11_t2_title": "2. Хроматин: доступность промотора и транскрипция", "s11_t2_task": "Соберите на промоторе условного гена X аппарат, необходимый для транскрипции, и определите, какой вклад вносит каждая деталь: что сделает промотор доступным, что увеличит интенсивность транскрипции, что её прекратит.", "s11_t2_cond": "Объект — ген X в ядре условной клетки человека; это тканеспецифический ген, его промотор беден динуклеотидами CpG и содержит TATA-бокс. В исходном состоянии промотор гена X закрыт нуклеосомой, а участок связывания активатора находится в линкерной ДНК между нуклеосомами и доступен. Промотор гена X становится доступным только при участии комплекса ремоделирования хроматина (условие модели). Схема показывает состояние через час после сборки деталей", "s11_t2_cap_A": "Активатор связан со своим участком, но комплекса ремоделирования и ацетилтрансферазы нет. Промотор закрыт, транскрипции нет", "s11_t2_rules": "1. В модели комплекс ремоделирования и ацетилтрансфераза сами последовательность ДНК не узнают: к промотору гена X их привлекает активатор (у разных комплексов в клетке механизмы адресации различаются).\n2. Комплекс ремоделирования за счёт энергии АТФ сдвигает нуклеосому — промотор становится доступным.\n3. Ацетилтрансфераза ацетилирует гистоны у промотора. Ацетилированные остатки лизина узнают белки, в том числе субъединицы общих факторов транскрипции и комплексов ремоделирования; в модели это увеличивает интенсивность транскрипции доступного промотора.\n4. Транскрипция возможна только на доступном промоторе при наличии общих факторов транскрипции и РНК-полимеразы II.\n5. Метилированные CpG промотора связывают белки, узнающие метилированный CpG; они привлекают деацетилазы гистонов. В модели промотор с метилированными CpG остаётся закрыт при любом наборе деталей (допущение модели). Метилирование CpG в транскрибируемой части гена в модели транскрипцию не изменяет.", "s11_t2_cap_noA": "Активатора нет: комплекс ремоделирования и ацетилтрансфераза не привлечены к гену X. Промотор закрыт нуклеосомой, транскрипции нет", "s11_t2_cap_AH": "В модели (по классической схеме) ацетилтрансфераза, привлечённая активатором, ацетилирует гистоны у промотора, но нуклеосома остаётся на промоторе: её сдвигает только комплекс ремоделирования. Транскрипции нет", "s11_t2_cap_AR_noG": "Нуклеосома сдвинута, промотор доступен, но общих факторов транскрипции и РНК-полимеразы II нет. Транскрипции нет", "s11_t2_cap_ARG": "Промотор доступен, общие факторы и РНК-полимераза II собираются на нём. Без ацетилирования гистонов транскрипция низкая", "s11_t2_cap_ARH_noG": "Промотор доступен, гистоны ацетилированы, но нет общих факторов и РНК-полимеразы II. Транскрипции нет", "s11_t2_cap_full": "Активатор привлёк комплекс ремоделирования и ацетилтрансферазу; промотор доступен, аппарат транскрипции собирается часто. Транскрипция высокая", "s11_t2_cap_meP": "CpG промотора метилированы: их связывают белки, привлекающие деацетилазы гистонов. Промотор остаётся закрыт, транскрипции нет", "s11_t2_cap_meB_note": "Метилирование CpG в транскрибируемой части гена в модели транскрипцию не изменяет; у многих активно транскрибируемых генов оно выше, чем в соседних участках", "s11_t2_limits": "Модель описывает один условный тканеспецифический ген, промотор которого открывается только при участии комплекса ремоделирования. У многих генов, особенно с промоторами в CpG-островках, неметилированный промотор обычно свободен от нуклеосом, а некоторые факторы транскрипции способны связываться с ДНК, намотанной на нуклеосому, и способствовать её открытию. Модель не показывает метилирование гистонов, варианты гистонов, деацетилирование как отдельную деталь и то, как модификации сохраняются при делении клетки. Ацетилирование в модели — причина увеличения транскрипции; в клетке значительная часть ацетилирования гистонов зависит от самой транскрипции (продвинутый уровень, исследование 2)", "s11_t2_how": "Доступность участка хроматина оценивают по тому, насколько легко его ДНК расщепляет фермент — нуклеаза, добавленная к ядрам: ДНК, закрытая нуклеосомой или плотно связанными белками, расщепляется хуже. Такие измерения по всему геному показали, что доступные участки различаются в клетках разных типов, а сильнее всего доступны промоторы и энхансеры. Но доступный участок не обязательно транскрибируется: это показывает отдельное измерение синтеза РНК", "s11_t2_route": "К объяснению → БИО-11·10–13", "s11_t2_s1_q": "Собраны активатор, ацетилтрансфераза гистонов, общие факторы транскрипции и РНК-полимераза II. Комплекса ремоделирования нет. Что покажет модель?", "s11_t2_s1_o1": "Гистоны ацетилированы, промотор закрыт, транскрипции нет", "s11_t2_s1_o2": "Гистоны ацетилированы — транскрипция высокая", "s11_t2_s1_o3": "Ацетилирования нет: ацетилтрансфераза не может работать без комплекса ремоделирования", "s11_t2_s1_o4": "Транскрипция низкая: общие факторы собираются на нуклеосоме", "s11_t2_s1_e": "Верно. В модели гена X нуклеосому с промотора сдвигает только комплекс ремоделирования. Ацетилирование есть, а транскрипции нет: ацетилирование само по себе не означает активной транскрипции. Модель следует классической схеме, в которой ацетилтрансфераза действует и без транскрипции; в дрожжах показано, что привлечённые к промотору ацетилтрансферазы без транскрипции гистоны почти не ацетилируют (продвинутый уровень, исследование 2)", "s11_t2_s1_w2": "Ацетилирование облегчает сборку аппарата на доступном промоторе. Если промотор закрыт нуклеосомой, сборки нет", "s11_t2_s1_w3": "Ацетилтрансферазу привлекает активатор, и в модели она ацетилирует гистоны независимо от комплекса ремоделирования", "s11_t2_s1_w4": "Общие факторы транскрипции и РНК-полимераза II не собираются на промоторе, упакованном в нуклеосому", "s11_t2_s1_h1": "Что физически закрывает промотор?", "s11_t2_s1_h2": "Какая деталь в модели сдвигает нуклеосому?", "s11_t2_s1_h3": "Ацетилирование есть, а нуклеосома на месте", "s11_t2_s2_q": "Добавили комплекс ремоделирования хроматина. Все четыре детали на месте. Что изменится?", "s11_t2_s2_o1": "Промотор станет доступным, транскрипция — высокой", "s11_t2_s2_o2": "Промотор станет доступным, но транскрипция не начнётся: нужна ещё одна деталь", "s11_t2_s2_o3": "Нуклеосома будет удалена из всего гена X", "s11_t2_s2_o4": "Изменится последовательность ДНК промотора", "s11_t2_s2_e": "Верно. Комплекс ремоделирования, привлечённый активатором, за счёт энергии АТФ сдвигает нуклеосому; ацетилированные гистоны облегчают сборку аппарата транскрипции", "s11_t2_s2_w2": "Все необходимые детали уже есть: доступный промотор, общие факторы и РНК-полимераза II", "s11_t2_s2_w3": "Модель показывает только промотор. Комплекс ремоделирования изменяет положение и состав отдельных нуклеосом, а не всего хроматина гена", "s11_t2_s2_w4": "Ремоделирование изменяет положение нуклеосом, а не последовательность нуклеотидов", "s11_t2_s2_h1": "Каких условий не хватало, пока не было комплекса ремоделирования?", "s11_t2_s2_h2": "Что делает комплекс ремоделирования с нуклеосомой?", "s11_t2_s2_h3": "Доступный промотор плюс аппарат транскрипции", "s11_t2_s3_q": "Из полного набора убрали ацетилтрансферазу гистонов. Какой станет транскрипция?", "s11_t2_s3_o1": "Низкой", "s11_t2_s3_o2": "Высокой: промотор доступен", "s11_t2_s3_o3": "Транскрипции не будет: без ацетилирования промотор закрывается", "s11_t2_s3_o4": "Транскрипция не изменится: ацетилирование не влияет на хроматин", "s11_t2_s3_e": "Верно. Промотор доступен, и аппарат транскрипции может собраться. Но без ацетилирования он собирается реже: ацетилированные лизины узнают субъединицы общих факторов транскрипции и комплексов ремоделирования", "s11_t2_s3_w2": "Доступность промотора делает транскрипцию возможной, но её интенсивность зависит и от других условий", "s11_t2_s3_w3": "В модели нуклеосому сдвигает комплекс ремоделирования; он на месте, промотор доступен", "s11_t2_s3_w4": "Ацетилирование нейтрализует положительный заряд лизина и служит участком связывания других белков; в модели оно увеличивает частоту сборки аппарата", "s11_t2_s3_h1": "Что из показаний изменится, а что останется прежним?", "s11_t2_s3_h2": "Какие белки узнают ацетилированные гистоны?", "s11_t2_s3_h3": "Промотор открыт, а аппарат собирается реже", "s11_t2_s4_q": "Комплекс ремоделирования, ацетилтрансфераза, общие факторы и РНК-полимераза II в ядре есть, а активатора гена X нет. Что покажет модель?", "s11_t2_s4_o1": "Промотор закрыт, транскрипции нет", "s11_t2_s4_o2": "Промотор доступен: комплекс ремоделирования в ядре есть", "s11_t2_s4_o3": "Транскрипция низкая: аппарат собирается без активатора", "s11_t2_s4_o4": "Транскрипция высокая: все ферменты на месте", "s11_t2_s4_e": "Верно. В модели комплекс ремоделирования и ацетилтрансфераза сами последовательность ДНК не узнают: к гену X их привлекает активатор, связанный со своим участком. Без активатора они на ген X не попадают", "s11_t2_s4_w2": "Ферменты, изменяющие хроматин, действуют там, куда их привлекли. Наличие фермента в ядре не означает его действия на конкретном гене", "s11_t2_s4_w3": "Аппарат не может собраться на промоторе, закрытом нуклеосомой", "s11_t2_s4_w4": "На месте только в ядре, но не на гене X", "s11_t2_s4_h1": "Узнаёт ли комплекс ремоделирования определённую последовательность ДНК?", "s11_t2_s4_h2": "Кто направляет его к гену X?", "s11_t2_s4_h3": "Без активатора ферменты не привлечены", "s11_t2_s5_q": "Набор полный. Метилированы динуклеотиды CpG в транскрибируемой части гена X, а CpG промотора не метилированы. Что предсказывает модель?", "s11_t2_s5_o1": "Транскрипция высокая, как без метилирования", "s11_t2_s5_o2": "Транскрипции нет: метилирование ДНК выключает гены", "s11_t2_s5_o3": "Транскрипция низкая: метилирование всегда снижает её вдвое", "s11_t2_s5_o4": "Изменится последовательность гена: метильная группа заменяет цитозин", "s11_t2_s5_e": "Верно. Действие метилирования ДНК зависит от его расположения. Устойчивое подавление транскрипции связано с метилированием промоторов, особенно CpG-островков; метилирование транскрибируемой части часто встречается у активных генов", "s11_t2_s5_w2": "Метилирование ДНК — не универсальный выключатель. Важно, какой участок метилирован", "s11_t2_s5_w3": "Постоянного множителя нет. В модели метилирование тела гена транскрипцию не изменяет", "s11_t2_s5_w4": "Метилирование присоединяет метильную группу к цитозину; последовательность нуклеотидов не изменяется", "s11_t2_s5_h1": "Где расположены метилированные CpG?", "s11_t2_s5_h2": "Сравните промотор и транскрибируемую часть гена", "s11_t2_s5_h3": "Переключите метилирование в промотор и сравните", "s11_t2_s6_obs": "Промотор доступен. Ацетилирование гистонов у промотора: нет. Транскрипция низкая. Метилирования нет", "s11_t2_s6_q": "Какой набор деталей соответствует этим показаниям?", "s11_t2_s6_o1": "Активатор, комплекс ремоделирования, общие факторы и РНК-полимераза II; ацетилтрансферазы нет", "s11_t2_s6_o2": "Полный набор деталей", "s11_t2_s6_o3": "Нет активатора", "s11_t2_s6_o4": "Нет общих факторов и РНК-полимеразы II", "s11_t2_s6_e": "Верно. Промотор доступен — значит, активатор привлёк комплекс ремоделирования. Транскрипция есть — значит, есть аппарат. Ацетилирования нет — нет ацетилтрансферазы, поэтому транскрипция низкая", "s11_t2_s6_w2": "При полном наборе гистоны ацетилированы, транскрипция высокая", "s11_t2_s6_w3": "Без активатора промотор остался бы закрыт", "s11_t2_s6_w4": "Тогда транскрипции не было бы вовсе", "s11_t2_s6_h1": "Какое показание говорит о комплексе ремоделирования?", "s11_t2_s6_h2": "Почему транскрипция есть, но низкая?", "s11_t2_s6_h3": "Ацетилирования нет", "s11_t2_s7_q": "Что можно утверждать о доступности промотора по этой модели?", "s11_t2_s7_o1": "Это необходимое, но не достаточное условие транскрипции", "s11_t2_s7_o2": "Это достаточное условие: доступный промотор всегда транскрибируется", "s11_t2_s7_o3": "Доступность не влияет на транскрипцию", "s11_t2_s7_o4": "Доступность и транскрипция — одно и то же", "s11_t2_s7_e": "Верно. Без доступного промотора аппарат не собирается (без комплекса ремоделирования или без активатора), а доступный промотор без аппарата транскрипции не транскрибируется. Интенсивность зависит ещё и от модификаций гистонов (без ацетилтрансферазы она ниже)", "s11_t2_s7_w2": "В модели есть доступный промотор без транскрипции (нет общих факторов и РНК-полимеразы II)", "s11_t2_s7_w3": "Закрытый промотор в модели не транскрибируется никогда", "s11_t2_s7_w4": "Доступность — свойство участка хроматина, транскрипция — синтез РНК. Их измеряют разными способами, и они не всегда совпадают", "s11_t2_s7_h1": "Был ли в модели доступный промотор без транскрипции?", "s11_t2_s7_h2": "Была ли транскрипция при закрытом промоторе?", "s11_t2_s7_h3": "Необходимость и достаточность — разные утверждения", "s11_t3_title": "3. Энхансер и промотор: от сигнала к транскрипции гена", "s11_t3_task": "Определите, при каких условиях сигнал, поступивший в клетку, усилит транскрипцию гена Y, и какое наблюдение доказывает, что этот энхансер регулирует именно этот ген.", "s11_t3_cond": "Объект — ген Y в условной клетке человека; рецепторы к сигналу есть и работают (вспомнить: семинар 1). Энхансер гена Y расположен в 120 тысячах пар нуклеотидов от промотора. Сигнал переводит фактор транскрипции T в активную форму, способную связаться с энхансером. Промотор гена Y доступен. Схема показывает состояние через час после действия сигнала", "s11_t3_cap_on": "Активный T связан с доступным энхансером и через медиатор увеличивает частоту сборки аппарата на промоторе. Транскрипция высокая", "s11_t3_loop_note": "Сближение энхансера и промотора изображено условно. В модели оно существует и без сигнала и само по себе транскрипцию не изменяет", "s11_t3_rules": "1. Без сигнала фактор T неактивен и с энхансером не связывается.\n2. Активный T связывается только с доступным энхансером.\n3. Активатор на энхансере увеличивает частоту сборки аппарата на промоторе через медиатор; без медиатора у гена Y инициации транскрипции нет (в клетке медиатор необходим для транскрипции большинства генов РНК-полимеразы II).\n4. Без активатора на энхансере доступный промотор с полным аппаратом транскрибируется с базальной интенсивностью.\n5. Без общих факторов и РНК-полимеразы II транскрипции нет.", "s11_t3_cap_noG": "Нет общих факторов транскрипции и РНК-полимеразы II — транскрипции нет", "s11_t3_cap_noMed": "T связан с энхансером, но без медиатора аппарат транскрипции на промоторе не собирается. Транскрипции нет", "s11_t3_cap_noMed0": "Медиатора нет, фактор T с энхансером не связан. Аппарат транскрипции не собирается — транскрипции нет", "s11_t3_cap_noT": "Фактора T в клетке нет: энхансер не действует. Транскрипция базальная", "s11_t3_cap_noS": "Сигнала нет: фактор T неактивен и с энхансером не связан. Промотор доступен — транскрипция базальная. Энхансер и промотор сближены, но это транскрипцию не увеличивает", "s11_t3_cap_closed": "Сигнал есть, T активен, но энхансер упакован в нуклеосомы: T с ним не связывается. Энхансер есть в геноме, но не действует. Транскрипция базальная", "s11_t3_limits": "У реальных генов бывает несколько энхансеров и на каждом — несколько разных факторов транскрипции; эффект определяется их сочетанием. Модель не показывает репрессоры, коактиваторы, изменяющие хроматин, и то, от чего зависит, на какой из соседних промоторов действует энхансер. Сближение изображено условно: устойчивая петля ДНК — лишь один из обсуждаемых способов связи энхансера с промотором. Сигнальный путь от рецептора до фактора T свёрнут в одну стрелку", "s11_t3_how": "Что участок действительно регулирует ген, проверяют, удаляя или изменяя его последовательность в геноме и измеряя транскрипцию гена. Положение участков в ядре изучают, наблюдая меченые участки ДНК в живых клетках. Такие наблюдения показали, что транскрипция гена может идти, хотя энхансер не находится к нему ближе обычного, и что при активации энхансера расстояние до промотора иногда даже увеличивается", "s11_t3_route": "К объяснению → БИО-11·16–20", "s11_t3_s1_q": "Сигнала нет. Энхансер доступен, на схеме он изображён рядом с промотором. Какой будет транскрипция гена Y?", "s11_t3_s1_o1": "Базальная", "s11_t3_s1_o2": "Высокая: энхансер рядом с промотором", "s11_t3_s1_o3": "Транскрипции нет", "s11_t3_s1_o4": "Высокая: энхансер доступен", "s11_t3_s1_e": "Верно. Без сигнала фактор T неактивен и с энхансером не связан. Близость энхансера к промотору в модели существует и без сигнала и транскрипцию не увеличивает", "s11_t3_s1_w2": "Близость в пространстве — не активация. Энхансер действует через связанный с ним активатор", "s11_t3_s1_w3": "Доступный промотор с полным аппаратом транскрибируется на базальном уровне и без активатора на энхансере", "s11_t3_s1_w4": "Доступный энхансер без связанного активного фактора транскрипцию не увеличивает", "s11_t3_s1_h1": "Что делает сигнал с фактором T?", "s11_t3_s1_h2": "Кто должен быть на энхансере, чтобы он действовал?", "s11_t3_s1_h3": "Без сигнала T неактивен", "s11_t3_s2_q": "Сигнал есть, фактор T активен. Энхансер гена Y в этой клетке упакован в нуклеосомы. Что покажет модель?", "s11_t3_s2_o1": "T не связан с энхансером, транскрипция базальная", "s11_t3_s2_o2": "T связан, транскрипция высокая: сигнал есть", "s11_t3_s2_o3": "Транскрипции нет", "s11_t3_s2_o4": "Сигнал откроет энхансер", "s11_t3_s2_e": "Верно. Последовательность энхансера есть в геноме, но в этой клетке недоступна. Наличие энхансера в ДНК не гарантирует активации гена", "s11_t3_s2_w2": "Активный фактор связывается только с доступным участком (правило 2)", "s11_t3_s2_w3": "Промотор доступен и аппарат на месте — базальная транскрипция сохраняется", "s11_t3_s2_w4": "В модели сигнал изменяет активность фактора T, а не упаковку энхансера. Некоторые факторы транскрипции способны связываться с нуклеосомной ДНК (продвинутый уровень, исследование 2), но фактор T модели к ним не относится", "s11_t3_s2_h1": "С каким участком может связаться активный T?", "s11_t3_s2_h2": "Чем этот энхансер отличается от доступного энхансера?", "s11_t3_s2_h3": "Последовательность есть, доступности нет", "s11_t3_s3_q": "Сигнал есть, энхансер доступен, все детали на месте. Что изменится по сравнению с клеткой, в которой энхансер упакован в нуклеосомы?", "s11_t3_s3_o1": "T свяжется с энхансером, транскрипция станет высокой", "s11_t3_s3_o2": "T свяжется с промотором вместо энхансера", "s11_t3_s3_o3": "Транскрипция станет высокой без связывания T: сигнал действует прямо на РНК-полимеразу", "s11_t3_s3_o4": "Изменится последовательность энхансера", "s11_t3_s3_e": "Верно. Активный T на энхансере через медиатор увеличивает частоту сборки общих факторов транскрипции и РНК-полимеразы II на промоторе", "s11_t3_s3_w2": "T узнаёт свою последовательность в энхансере. С промотором связываются общие факторы транскрипции", "s11_t3_s3_w3": "Сигнал изменяет активность фактора T; на РНК-полимеразу T действует через медиатор и коактиваторы", "s11_t3_s3_w4": "Связывание белка не изменяет последовательность ДНК", "s11_t3_s3_h1": "Чем это состояние отличается от состояния с закрытым энхансером?", "s11_t3_s3_h2": "Через какой комплекс T действует на РНК-полимеразу?", "s11_t3_s3_h3": "Активный фактор плюс доступный энхансер", "s11_t3_s4_q": "Из полного набора убрали медиатор. T связан с энхансером. Какой будет транскрипция?", "s11_t3_s4_o1": "Транскрипции нет", "s11_t3_s4_o2": "Высокая: T на энхансере", "s11_t3_s4_o3": "Базальная", "s11_t3_s4_o4": "Высокая: медиатор нужен только для сближения энхансера и промотора", "s11_t3_s4_e": "Верно. Медиатор передаёт действие активаторов на РНК-полимеразу II и общие факторы транскрипции; для инициации транскрипции у большинства генов РНК-полимеразы II он необходим", "s11_t3_s4_w2": "Связывание активатора — только первый этап. Его действие на аппарат передаёт медиатор", "s11_t3_s4_w3": "В модели без медиатора аппарат на промоторе гена Y не собирается даже на базальном уровне", "s11_t3_s4_w4": "Медиатор — посредник между регуляторными белками и РНК-полимеразой, а не просто \"мостик\" для сближения участков ДНК", "s11_t3_s4_h1": "Где находится медиатор на схеме?", "s11_t3_s4_h2": "Между какими белками он посредник?", "s11_t3_s4_h3": "Без посредника сигнал от T не доходит до аппарата", "s11_t3_s5_q": "Без сигнала энхансер и промотор на схеме сближены, а транскрипция гена Y остаётся базальной. Какой вывод следует?", "s11_t3_s5_o1": "Пространственная близость энхансера и промотора сама по себе не доказывает, что энхансер активирует ген", "s11_t3_s5_o2": "Энхансер не нужен для транскрипции гена Y", "s11_t3_s5_o3": "Каждый энхансер действует через устойчивую петлю ДНК", "s11_t3_s5_o4": "Близость энхансера и промотора всегда означает активный ген", "s11_t3_s5_e": "Верно. Близость может существовать и у неактивного гена; описаны и случаи, когда при активации энхансера расстояние до промотора увеличивалось. Поэтому близость — наблюдение, а не доказательство действия", "s11_t3_s5_w2": "При сигнале и доступном энхансере транскрипция высокая; без связанного с энхансером T она только базальная", "s11_t3_s5_w3": "Петля — один из возможных способов сближения. Механизм действия энхансеров изучен не полностью, и устойчивая петля не обязательна для каждого энхансера", "s11_t3_s5_w4": "Без сигнала близость есть, а транскрипция базальная", "s11_t3_s5_h1": "Сравните схему без сигнала и с сигналом", "s11_t3_s5_h2": "Изменилась ли близость энхансера и промотора?", "s11_t3_s5_h3": "Близость есть в обоих случаях", "s11_t3_s6_obs": "Сигнал есть. Фактор T активен и связан с энхансером. Транскрипции гена Y нет", "s11_t3_s6_q": "Чего может не хватать, и какое дополнительное наблюдение позволит выбрать между вариантами?", "s11_t3_s6_o1": "Медиатора или общих факторов транскрипции и РНК-полимеразы II; различит наличие медиатора на промоторе", "s11_t3_s6_o2": "Энхансер недоступен", "s11_t3_s6_o3": "Сигнала нет", "s11_t3_s6_o4": "Промотор закрыт нуклеосомой", "s11_t3_s6_e": "Верно. Оба варианта совместимы с показаниями. Без медиатора РНК-полимераза II на промотор не попадает, поэтому её отсутствие одинаково в обоих случаях и их не различает. Различает наличие медиатора на промоторе: его нет в первом случае и он есть во втором. Вывод из одних исходных показаний неоднозначен", "s11_t3_s6_w2": "Тогда T не был бы связан с энхансером", "s11_t3_s6_w3": "Тогда T не был бы активен", "s11_t3_s6_w4": "По условию задачи промотор гена Y доступен", "s11_t3_s6_h1": "Какие детали модели участвуют после связывания T?", "s11_t3_s6_h2": "Сколько вариантов совместимы с показаниями?", "s11_t3_s6_h3": "Какой белковый комплекс между T и аппаратом транскрипции можно обнаружить на промоторе?", "s11_t3_s7_q": "Какое наблюдение показывает, что энхансер действительно регулирует ген Y?", "s11_t3_s7_o1": "Удаление или инактивация энхансера снижает транскрипцию гена Y при прочих равных условиях", "s11_t3_s7_o2": "Энхансер и промотор находятся рядом в ядре", "s11_t3_s7_o3": "В геноме есть последовательность энхансера", "s11_t3_s7_o4": "На энхансере ацетилированы гистоны", "s11_t3_s7_e": "Верно. Это функциональная проверка: изменяют энхансер и измеряют транскрипцию. Она показывает, что энхансер необходим, но не показывает, каким именно путём он действует", "s11_t3_s7_w2": "Близость — корреляция, а не доказательство: без сигнала она есть, а транскрипция базальная", "s11_t3_s7_w3": "Последовательность есть во всех клетках, но в уплотнённом хроматине энхансер не действует", "s11_t3_s7_w4": "Ацетилирование сопутствует активным энхансерам, но не доказывает, какой ген они регулируют", "s11_t3_s7_h1": "Как проверить, что одно событие вызывает другое?", "s11_t3_s7_h2": "Что нужно изменить и что измерить?", "s11_t3_s7_h3": "Измените энхансер, оставив остальное прежним", "s11_t4_title": "4. От мРНК к функционально активному белку: где ещё регулируется экспрессия", "s11_t4_task": "Определите, как изменятся количество мРНК, синтез белка, количество белка и количество активного белка, если на мРНК действует микроРНК или малая интерферирующая РНК, если белок узнаёт убиквитинлигаза или если не происходит активирующее фосфорилирование.", "s11_t4_cond": "Объект — мРНК условного гена Z и её белковый продукт в цитоплазме клетки человека. Транскрипция гена Z постоянна: 20 новых молекул мРНК в час. Показания сняты, когда количества мРНК и белка перестали изменяться (через неделю после изменения условий). Числа молекул условные", "s11_t4_rules": "- Среднее время существования молекулы (τ) — среднее время от её синтеза до распада; время полужизни (время, за которое распадается половина молекул) ≈ 0,7 × τ.\n- мРНК = синтез мРНК × среднее время существования мРНК; синтез белка = мРНК × число белковых молекул, синтезируемых на одной мРНК в час; белок = синтез белка × среднее время существования белка.\n- Исходно: синтез мРНК 20 в час, время существования мРНК 5 ч, 5 молекул белка на мРНК в час, время существования белка 20 ч → мРНК 100, синтез белка 500 в час, белок 10 000.\n- микроРНК: время существования мРНК 5 → 2 ч, трансляция 5 → 4 молекулы на мРНК в час.\n- малая интерферирующая РНК: время существования мРНК 5 → 0,5 ч.\n- убиквитинлигаза: время существования белка 20 → 8 ч.\n- без киназы активны 10 % молекул белка Z, с киназой — 100 % (условное допущение).", "s11_t4_cap_base": "Синтез и распад мРНК уравновешены: в клетке около 100 молекул мРНК, хотя каждая существует в среднем 5 ч. Белка — 10 000 молекул, все активны", "s11_t4_cap_mir": "микроРНК в комплексе с AGO частично спаривается с участком 3′-НТО. мРНК быстрее деаденилируется и разрушается (её в 2,5 раза меньше), а каждая оставшаяся молекула транслируется хуже. Белка в 3,1 раза меньше", "s11_t4_cap_si": "Полностью комплементарная направляющая РНК позволяет AGO2 разрезать мРНК посередине спаренного участка. мРНК в 10 раз меньше, белка тоже", "s11_t4_cap_e3": "Убиквитинлигаза присоединяет к белку Z цепь убиквитина, протеасома разрушает его быстрее: среднее время существования белка 8 ч вместо 20, белка 4 000 молекул", "s11_t4_cap_nokin": "Количество белка прежнее, но без фосфорилирования активны только 10 % молекул. Количество белка и его активность — разные величины", "s11_t4_cap_multi": "Изменено несколько процессов: их эффекты перемножаются по правилам модели", "s11_t4_limits": "Модель не показывает, как микроРНК образуются и попадают в комплекс с AGO, и не учитывает, что одна микроРНК действует на сотни разных мРНК, а одна мРНК может нести участки нескольких микроРНК. Константы модели условные. Время полужизни реальных мРНК в клетках млекопитающих — от минут до многих часов (в эмбриональных стволовых клетках мыши медиана около 7 ч), белков — от минут до многих часов и дольше. Активность белка в модели зависит от одного фосфорилирования; у реальных белков её изменяют и другие модификации, связывание лигандов, партнёров и правильное сворачивание", "s11_t4_how": "Вклад стабильности мРНК и трансляции разделили, сравнивая в одних и тех же клетках, насколько при появлении или удалении микроРНК изменяется количество мРНК-мишеней и насколько — синтез их белка. Такие сравнения в клетках разных типов показали: вскоре после появления микроРНК заметно подавление трансляции, а в установившемся состоянии бо́льшая часть подавления (от 66 % до более чем 90 %) объясняется уменьшением количества мРНК", "s11_t4_route": "К объяснению → БИО-11·23–28", "s11_t4_s1_q": "На мРНК гена Z действует микроРНК, частично комплементарная участку в 3′-нетранслируемой области (3′-НТО). Что произойдёт?", "s11_t4_s1_o1": "мРНК станет меньше, и каждая её молекула будет транслироваться хуже; белка станет меньше сильнее, чем мРНК", "s11_t4_s1_o2": "AGO разрежет мРНК посередине спаренного участка", "s11_t4_s1_o3": "Ген Z перестанет транскрибироваться", "s11_t4_s1_o4": "мРНК не изменится, изменится только белок", "s11_t4_s1_e": "Верно. Комплекс микроРНК с белком Argonaute (AGO) привлекает ферменты деаденилирования и белки, подавляющие трансляцию. В модели мРНК меньше в 2,5 раза, белка — в 3,1 раза. В клетках млекопитающих в стационарном состоянии бо́льшая часть подавления объясняется ускоренным распадом мРНК", "s11_t4_s1_w2": "Разрезание требует высокой комплементарности, особенно в центральной части дуплекса; при частичном спаривании микроРНК мишень обычно не разрезается", "s11_t4_s1_w3": "микроРНК действует на мРНК в цитоплазме; синтез мРНК в модели прежний — 20 молекул в час", "s11_t4_s1_w4": "В модели изменяются оба этапа: стабильность и трансляция. Подавление только трансляции возможно, но для микроРНК у млекопитающих это не основной итог в стационарном состоянии", "s11_t4_s1_h1": "Насколько полно спаривается микроРНК с мишенью?", "s11_t4_s1_h2": "Какие ферменты привлекает AGO при частичном спаривании?", "s11_t4_s1_h3": "Изменяются и стабильность, и трансляция", "s11_t4_s2_q": "В клетку ввели малую интерферирующую РНК, полностью комплементарную участку кодирующей области мРНК гена Z. Что покажет модель?", "s11_t4_s2_o1": "мРНК и белка станет примерно в 10 раз меньше", "s11_t4_s2_o2": "мРНК не изменится: малые РНК подавляют только трансляцию", "s11_t4_s2_o3": "Белок изменится, а мРНК нет", "s11_t4_s2_o4": "Изменится последовательность гена Z", "s11_t4_s2_e": "Верно. AGO2 разрезает мишень напротив нуклеотидов 10–11 направляющей РНК; фрагменты разрушаются экзонуклеазами, а комплекс может разрезать следующие молекулы. На этом основаны лекарства — малые интерферирующие РНК", "s11_t4_s2_w2": "При полной комплементарности AGO2 разрезает мРНК", "s11_t4_s2_w3": "Разрезанная мРНК разрушается — её становится меньше, и белка тоже", "s11_t4_s2_w4": "Малая интерферирующая РНК действует на мРНК, а не на ДНК", "s11_t4_s2_h1": "Чем малая интерферирующая РНК отличается от микроРНК по спариванию?", "s11_t4_s2_h2": "Какой белок разрезает мишень?", "s11_t4_s2_h3": "Разрезанная мРНК быстро разрушается", "s11_t4_s3_q": "Белок Z стала узнавать убиквитинлигаза, и среднее время существования белка сократилось с 20 до 8 ч. Какие из четырёх столбиков изменятся?", "s11_t4_s3_o1": "Только „белок“ и „активный белок“: по 4 000 молекул вместо 10 000", "s11_t4_s3_o2": "Все четыре: меньше белка — значит, меньше мРНК", "s11_t4_s3_o3": "„Синтез белка“, „белок“ и „активный белок“", "s11_t4_s3_o4": "Ни один: белок исчезнет полностью", "s11_t4_s3_e": "Верно. Убиквитинлигаза присоединяет к белку цепь убиквитина, которую узнаёт протеасома. Распад белка ускорился, а мРНК и трансляция не затронуты: белок = синтез белка × время существования = 500 × 8", "s11_t4_s3_w2": "Убиквитинлигаза действует на белок, а не на мРНК: мРНК прежняя", "s11_t4_s3_w3": "Синтез определяется мРНК и трансляцией, они не изменились", "s11_t4_s3_w4": "Белок синтезируется и разрушается; новое стационарное количество — 4 000 молекул", "s11_t4_s3_h1": "На какой этап действует убиквитинлигаза?", "s11_t4_s3_h2": "Какие показания не изменятся?", "s11_t4_s3_h3": "Синтез прежний, распад быстрее", "s11_t4_s4_q": "В клетке нет киназы, которая фосфорилирует белок Z. Что изменится?", "s11_t4_s4_o1": "Количество белка прежнее, активного белка в 10 раз меньше", "s11_t4_s4_o2": "Белка станет в 10 раз меньше", "s11_t4_s4_o3": "Ничего не изменится", "s11_t4_s4_o4": "мРНК станет меньше", "s11_t4_s4_e": "Верно. В модели фосфорилирование переводит белок Z в активную форму. Количество молекул не изменилось, а функция — да", "s11_t4_s4_w2": "Фосфорилирование в модели не изменяет синтез и распад белка Z", "s11_t4_s4_w3": "Изменится активность: без фосфорилирования активны 10 % молекул", "s11_t4_s4_w4": "Фосфорилирование белка не изменяет количество его мРНК", "s11_t4_s4_h1": "Что в модели делает фосфорилирование?", "s11_t4_s4_h2": "Сравните столбики \"белок\" и \"активный белок\"", "s11_t4_s4_h3": "Количество ≠ активность", "s11_t4_s5_q": "Каждая молекула мРНК гена Z существует в среднем 5 ч, но количество мРНК в клетке остаётся равным 100. Почему?", "s11_t4_s5_o1": "Синтез и распад мРНК идут одновременно с равной скоростью: стационарное состояние", "s11_t4_s5_o2": "Молекулы мРНК в стационарном состоянии не разрушаются", "s11_t4_s5_o3": "Синтез мРНК остановился", "s11_t4_s5_o4": "Количество мРНК не зависит от её распада", "s11_t4_s5_e": "Верно. За час образуется 20 молекул и разрушается столько же (100 молекул / 5 ч). Постоянное количество — не отсутствие оборота, а равновесие двух потоков", "s11_t4_s5_w2": "Разрушаются, но столько же синтезируется", "s11_t4_s5_w3": "Тогда мРНК исчезла бы за несколько часов", "s11_t4_s5_w4": "Зависит: при более быстром распаде (под действием микроРНК или малой интерферирующей РНК) мРНК меньше", "s11_t4_s5_h1": "Сколько молекул образуется за час?", "s11_t4_s5_h2": "Сколько разрушается за час, если их 100 и каждая живёт 5 ч?", "s11_t4_s5_h3": "Два потока равны", "s11_t4_s6_obs": "мРНК в клетке — в 2,5 раза меньше, чем в исходном состоянии. Синтез белка — в 3,1 раза меньше. Белка — в 3,1 раза меньше. Активного белка столько же, сколько белка", "s11_t4_s6_q": "Какое изменение модели даёт такие показания?", "s11_t4_s6_o1": "микроРНК, частично комплементарная участку 3′-НТО", "s11_t4_s6_o2": "Малая интерферирующая РНК", "s11_t4_s6_o3": "Убиквитинлигаза", "s11_t4_s6_o4": "Снижение транскрипции гена Z", "s11_t4_s6_e": "Верно. Белок уменьшился сильнее, чем мРНК: снизилась и стабильность мРНК, и эффективность трансляции каждой её молекулы", "s11_t4_s6_w2": "Она уменьшает мРНК и белок одинаково, в модели — в 10 раз", "s11_t4_s6_w3": "Она не изменяет мРНК и синтез белка", "s11_t4_s6_w4": "Тогда белок изменился бы во столько же раз, что и мРНК, — если трансляция прежняя. Здесь синтез белка на одну мРНК тоже снизился", "s11_t4_s6_h1": "Во сколько раз изменились мРНК и белок?", "s11_t4_s6_h2": "Что значит, что белок уменьшился сильнее мРНК?", "s11_t4_s6_h3": "Изменились два этапа сразу", "s11_t4_s7_q": "Что можно утверждать по одному измерению количества мРНК гена Z?", "s11_t4_s7_o1": "Только итог соотношения синтеза и распада мРНК: ни скорость транскрипции, ни количество и активность белка по нему однозначно не определить", "s11_t4_s7_o2": "Скорость транскрипции гена", "s11_t4_s7_o3": "Количество белка", "s11_t4_s7_o4": "Активность белка", "s11_t4_s7_e": "Верно. Одинаковое количество мРНК совместимо с разной трансляцией и разным распадом белка, а одинаковое количество белка — с разной активностью", "s11_t4_s7_w2": "То же количество мРНК получается при медленном синтезе и медленном распаде или при быстром синтезе и быстром распаде", "s11_t4_s7_w3": "Белок зависит ещё от трансляции и распада белка (убиквитинлигаза, микроРНК)", "s11_t4_s7_w4": "Активность зависит и от модификаций (без киназы активны 10 % молекул)", "s11_t4_s7_h1": "От каких двух потоков зависит количество мРНК?", "s11_t4_s7_h2": "Что происходит между мРНК и активным белком?", "s11_t4_s7_h3": "Одно измерение — один итог", "s11_t4_fe_title": "Научное дополнение. Железо и синтез ферритина: одна мРНК — разный синтез белка", "s11_t4_fe_cond": "Объект — две мРНК в цитоплазме клетки человека: мРНК ферритина — белка, запасающего железо, и мРНК рецептора трансферрина — белка, через который клетка получает железо. Сравниваются два состояния клетки: железа недостаточно и железа достаточно. Схема качественная: она показывает, какие молекулы связаны и какие процессы идут, без чисел", "s11_t4_fe_note": "Переключатель показывает предсказания учебной схемы, а не результат эксперимента", "s11_t4_fe_sw": "Железо в клетке: недостаточно / достаточно", "s11_t4_fe_cap_low": "Железа недостаточно. IRP связаны с IRE обеих мРНК. На мРНК ферритина IRP в 5′-НТО препятствует инициации трансляции: ферритин почти не синтезируется. На мРНК рецептора трансферрина IRP в 3′-НТО защищают её от расщепления: мРНК устойчива, рецептор синтезируется, и клетка получает больше железа", "s11_t4_fe_cap_high": "Железа достаточно. IRP1 содержит железосерный кластер и не связывает IRE, IRP2 разрушается протеасомой. мРНК ферритина транслируется: количество мРНК то же, а синтез ферритина выше. мРНК рецептора трансферрина расщепляется и разрушается: рецептора синтезируется меньше", "s11_t4_fe_cmp": "Один и тот же белок, связываясь с одинаковыми по устройству элементами мРНК, действует по-разному в зависимости от положения элемента: в 5′-НТО — подавляет трансляцию, в 3′-НТО — защищает мРНК от расщепления. Поэтому при недостатке железа ферритина синтезируется мало, а рецептора трансферрина много, при достатке — наоборот", "s11_t4_fe_limits": "Схема показывает два крайних состояния; количество мРНК и белков на ней не измерено. Распад IRP2 зависит не только от железа, но и от кислорода. IRE есть и в мРНК других белков обмена железа", "s11_t4_fe_route": "К объяснению → БИО-11·30", "s11_t4_fe_q_q": "В клетке было недостаточно железа, затем железа стало достаточно. Предскажите, что произойдёт с мРНК ферритина и синтезом ферритина", "s11_t4_fe_q_o1": "Количество мРНК ферритина существенно не изменится, синтез ферритина увеличится", "s11_t4_fe_q_o2": "Увеличится транскрипция гена ферритина, поэтому станет больше мРНК и белка", "s11_t4_fe_q_o3": "мРНК ферритина станет устойчивее, как мРНК рецептора трансферрина при недостатке железа", "s11_t4_fe_q_o4": "Ферритин начнёт быстрее разрушаться протеасомой", "s11_t4_fe_q_e": "Верно. IRP отделяется от IRE в 5′-НТО, и трансляция начинается. При сопоставимом количестве мРНК интенсивность синтеза белка может различаться вследствие посттранскрипционной регуляции", "s11_t4_fe_q_w2": "На схеме количество мРНК ферритина в обоих состояниях одинаково; изменяется инициация трансляции", "s11_t4_fe_q_w3": "Связывание IRP защищает от расщепления мРНК рецептора трансферрина, у которой IRE в 3′-НТО. У мРНК ферритина IRE в 5′-НТО, и связывание IRP влияет на трансляцию", "s11_t4_fe_q_w4": "Протеасомой разрушается не ферритин, а один из регуляторных белков — IRP2; ферритина синтезируется больше", "s11_adv_note": "Это учебная модель с явно заданными правилами. Числа условные: они получены по правилам модели, а не измерены в эксперименте. Модель показывает принцип и не предсказывает поведение конкретного гена", "s11_a1_title": "Два входа — один выход: интенсивность транскрипции lac-оперона", "s11_a1_cond": "Объект — культуры кишечной палочки: дикий тип и мутанты без репрессора LacI или без белка CAP. Среда: лактозы нет, мало или много; глюкоза есть или нет. Измеряют интенсивность транскрипции оперона в условных единицах (максимум — 100) после того, как она установилась", "s11_a1_rules": "1. Индуктор в клетке: лактозы нет → индуктора нет; мало лактозы без глюкозы → индуктора мало; мало лактозы с глюкозой → индуктора нет (глюкоза уменьшает поступление лактозы); много лактозы → индуктора много (при избытке лактозы в модели глюкоза не мешает освободить оператор).\n2. Доля времени, когда оператор свободен (f): без репрессора — 1; индуктора нет — 0,01; мало — 0,5; много — 1.\n3. Положительная регуляция (a): CAP есть и глюкозы нет — 1; иначе — 0,1.\n4. Интенсивность транскрипции T = 100 × f × a.", "s11_a1_status": "Оператор свободен {f×100} % времени · CAP–цАМФ на ДНК: {да/нет} · транскрипция {T} из 100", "s11_a1_limits": "Модель использует три ступени количества индуктора и фиксированные множители; реальная зависимость непрерывна и различается у штаммов. Не показаны три оператора и петля ДНК и неодинаковое поведение отдельных клеток в культуре. Не показана положительная обратная связь: пермеаза синтезируется с самого оперона и ускоряет поступление индуктора, поэтому чем сильнее транскрибируется оперон, тем больше индуктора в клетке. В модели количество индуктора задано условием, и глюкоза сразу оставляет клетку почти без него; у бактерий каждое отдельное действие глюкозы невелико, а сильное подавление развивается постепенно, за несколько поколений, потому что эти действия усиливаются через обратную связь. Модель не оценивает, какой путь действия глюкозы вносит больший вклад: это продолжают обсуждать", "s11_a1_new": "В клетки 23 штаммов — природных изолятов кишечной палочки (один из них относится к близкому виду) и двух лабораторных штаммов — встроили одинаковый ген светящегося белка под контролем промотора lac-оперона. Затем в среду с глюкозой добавляли в разных сочетаниях синтетический индуктор, не расщепляемый бактерией, и цАМФ: так независимо меняли активность репрессора и активатора. Правило, по которому два сигнала определяют транскрипцию, у штаммов различалось. Сильнее всего различалось, насколько транскрипция зависит только от индуктора: один индуктор давал у разных штаммов от 18 до 83 % максимальной транскрипции, а у части штаммов она слабо зависела от цАМФ. Простое правило \"транскрипция высокая только при обоих условиях\" не описывает и лабораторный штамм: зависимость оказалась промежуточной между \"оба условия\" и \"хотя бы одно\". Перенос генов оперона с геном репрессора из природных штаммов в лабораторный показал, что правило зависит и от этих генов, и от остального генома", "s11_a1_how": "Почему глюкоза подавляет lac-оперон так сильно, если каждое её действие по отдельности невелико? Бактерии выращивали на глицерине в присутствии синтетического индуктора, меченного радиоактивным углеродом и не расщепляемого бактерией. Измеряли два показателя: количество индуктора внутри клеток и активность β-галактозидазы — по ней судили о синтезе ферментов оперона. Чтобы оценить только одно действие глюкозы — уменьшение поступления индуктора, — синтез белка останавливали антибиотиком: тогда количество пермеазы в клетке не может измениться. В таких условиях глюкоза снижала количество индуктора в клетках не более чем в 6 раз. Затем глюкозу добавили к растущей культуре без антибиотика. В первые минуты количество индуктора в клетках снизилось примерно в 3 раза, а активность β-галактозидазы не изменилась; затем оба показателя медленно снижались, и за несколько поколений активность фермента уменьшилась примерно в 900 раз. Снижение цАМФ замедляло синтез ферментов лишь примерно в 3 раза, а ускорение роста увеличивало их разбавление между дочерними клетками примерно в 2 раза. Расчёт по кинетической модели показал, что небольшие эффекты складываются в сильное подавление через положительную обратную связь: меньше индуктора — меньше новой пермеазы — ещё меньше индуктора. Если обратную связь разорвать — у мутантов, транскрибирующих оперон без индуктора, или при избытке индуктора, который проникает в клетку и без пермеазы, — глюкоза оперон почти не подавляет. Вывод относится к искусственному индуктору; как глюкоза действует при росте на лактозе и какой путь вносит главный вклад, продолжают изучать", "s11_a1_route": "К объяснению → БИО-11·7; положительная обратная связь — БИО-11·8", "s11_a1_s1_q": "Дикий тип, много лактозы, есть глюкоза. Оператор свободен всё время. Предскажите интенсивность транскрипции", "s11_a1_s1_o1": "10 из 100", "s11_a1_s1_o2": "100 из 100: оператор свободен", "s11_a1_s1_o3": "1 из 100: глюкоза подавляет оперон полностью", "s11_a1_s1_o4": "50 из 100: два условия из двух выполнены наполовину", "s11_a1_s1_e": "Верно. Репрессия снята полностью (f = 1), но при глюкозе CAP–цАМФ не связан (a = 0,1). Снятие репрессии — необходимое, но не достаточное условие максимальной транскрипции", "s11_a1_s1_w2": "Без положительной регуляции свободный оператор даёт только десятую часть максимума", "s11_a1_s1_w3": "В модели при избытке лактозы глюкоза не возвращает репрессор на оператор; она лишь лишает оперон положительной регуляции", "s11_a1_s1_w4": "Правило модели — произведение, а не среднее: 100 × 1 × 0,1 = 10", "s11_a1_s1_h1": "Какое из двух событий выполнено, а какое нет?", "s11_a1_s1_h2": "Чему равно a при глюкозе?", "s11_a1_s1_h3": "T = 100 × f × a", "s11_a1_s2_q": "Лактозы мало, глюкозы нет. Чего ожидать?", "s11_a1_s2_o1": "Около 50: оператор свободен лишь половину времени, CAP–цАМФ связан", "s11_a1_s2_o2": "100: глюкозы нет, а лактоза есть", "s11_a1_s2_o3": "0,1: лактозы мало, оперон выключен", "s11_a1_s2_o4": "10: как при избытке лактозы с глюкозой", "s11_a1_s2_e": "Верно. Индуктора мало, и репрессор снимается не полностью. Регуляция в модели не двоичная: промежуточные количества индуктора дают промежуточную интенсивность", "s11_a1_s2_w2": "Лактоза есть, но её мало, и оператор свободен лишь часть времени", "s11_a1_s2_w3": "Индуктора хватает, чтобы освобождать оператор половину времени", "s11_a1_s2_w4": "Там не хватало положительной регуляции, здесь — индуктора", "s11_a1_s2_h1": "Сколько индуктора в клетке?", "s11_a1_s2_h2": "Какая доля времени оператор свободен?", "s11_a1_s2_h3": "f = 0,5, a = 1", "s11_a1_s3_q": "Дикий тип, лактозы мало; в среду без глюкозы добавили глюкозу. Во сколько раз изменится транскрипция и почему?", "s11_a1_s3_o1": "Упадёт в 500 раз (с 50 до 0,1): глюкоза уменьшает и положительную регуляцию, и поступление лактозы", "s11_a1_s3_o2": "В 10 раз: глюкоза действует только через цАМФ", "s11_a1_s3_o3": "Не изменится: лактоза есть", "s11_a1_s3_o4": "Упадёт до нуля", "s11_a1_s3_e": "Верно. В модели глюкоза действует двумя путями: CAP теряет цАМФ (в 10 раз) и индуктора в клетке становится меньше — оператор снова занят (в 50 раз). Так и у бактерий: при транспорте глюкозы белок её системы переноса подавляет пермеазу лактозы и фермент синтеза цАМФ", "s11_a1_s3_w2": "В модели есть и второй путь — уменьшение посту
