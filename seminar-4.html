      s += station(t, x.kind, x0, x1, { hdr, rec: x.rec, ligs: x.kind === 'pm', absent: P.final && !x.rec && i > 0, resp: pmFinal && x.rec ? respOf(R) : null, respWait: pmFinal && x.rec && wResp });
    });
    /* стрелки пути рецептора между станциями; задержан в ЭПР — путь прерван */
    [0, 1].forEach(i => { const x1 = X[i][1] + 3, x2 = X[i + 1][0] - 3, stop = P.address === 'er_retained' && P.final, dim = stop || (wAll && P.final);
      s += F.arrow(x1, Y, x2, Y, dim ? C.grey : C.ink, 2, dim ? '4 3' : '') + (stop && !wAll && i === 0 ? F.cross((x1 + x2) / 2, Y - 18, 6) : ''); });
    /* метки под станциями: ошибка встраивания — с ЭПР; задержка; участок / звено вне модели — у поверхности */
    if (P.st[0].rec && P.inv) s += G('rec_a4', F.tag(135, 286, t('s4_a4_inv'), C.bad, { size: 10.5 }));
    if (!P.final) return s;
    if (P.address === 'er_retained') s += F.tag(94, 98, t('s4_a4g_retained'), C.warn, { size: 10.5 });   /* в просвете ЭПР — над рецептором (условие шага А4.1) */
    /* участок не сформирован — под последней станцией, где есть рецептор (задержан в ЭПР — под ЭПР или рядом с меткой ориентации) */
    if (P.bad && !wAll) s += G('rec_a4', F.tag(P.st[2].rec ? 486 : P.inv ? 380 : 135, 286, t('s4_a4_site'), C.bad, { size: 10.5 }));
    else if (R.ligand_binding && !R.response && !wResp && !wAll) s += F.tag(486, 286, t('s4_a4_beyond'), C.bad, { size: 10.5 });
    if (wAll) return s + F.waitBox(10, 300, 580, 60, t('s4_hidden')) + F.waitBox(30, 364, 560, 44, t('s4_hidden'));
    s += a4reads(t, 16, 312, R, [0, 1, 2]) + a4reads(t, 316, 312, R, [3, 4], { hide: wResp ? [4] : [] });
    /* Б: два других груза идут нормально (условие изменено только для рецептора; 03, A4) */
    s += F.panel(10, 374, t('s4_pan_B')) + G('hydro', F.hydrolase(42, 374, { r: 6 })) + T(56, 374, t('s4_a4g_hyd') + ': ' + t('s4_a4g_norm'), { a: 'l', size: 11.5, w: 600 });
    s += F.solProt(42, 396, C.sec, 6, 'constit') + T(56, 396, t('s4_a4g_sec') + ': ' + t('s4_a4g_norm'), { a: 'l', size: 11.5, w: 600 });
    return s;
  }
  const CASE = c => c[2] === 'N_cytosol' ? 's4_a4g_m_inv' : !on(c[1]) ? 's4_a4g_m_site' : !on(c[3]) ? 's4_a4g_m_beyond' : c[0] === 'er_retained' ? 's4_a4g_m_er' : 's4_a4g_m_ok';
  /* два случая рядом: ЭПР и поверхность (шаг А4.2) */
  function a4cmp(t, cases, o) {
    let s = F.title(t('s4_a4g_title_cmp'), 12, 16);
    cases.forEach((c, i) => {
      const x0 = 6 + i * 300, P = a4path(c), R = P.R, cx = x0 + 144;
      s += F.panel(x0 + 2, 33, t(i ? 's4_pan_B' : 's4_pan_A')) + T(x0 + 22, 33, t('s4_a4g_case', { i: i + 1 }) + ': ' + t(CASE(c)), { a: 'l', size: 12, w: 700 });
      s += station(t, 'er', x0, x0 + 128, { hdr: t(HDR.er), rec: P.st[0].rec });
      s += F.arrow(x0 + 131, Y, x0 + 157, Y, C.ink, 2);
      if (o.wait) s += T(x0 + 224, 50, t(HDR.pm), { size: 11.5, w: 700, col: C.muted }) + F.waitBox(x0 + 160, TOP, 128, BOT - TOP, t('s4_hidden'));
      else s += station(t, 'pm', x0 + 160, x0 + 288, { hdr: t(HDR.pm), rec: P.st[2].rec, ligs: true, resp: respOf(R) });
      if (P.inv) s += G('rec_a4', F.tag(cx, 286, t('s4_a4_inv'), C.bad, { size: 10.5 }));
      else if (P.bad) s += G('rec_a4', F.tag(cx, 286, t('s4_a4_site'), C.bad, { size: 10.5 }));
      s += o.wait ? F.waitBox(x0 + 6, 300, 276, 92, t('s4_hidden')) : a4reads(t, x0 + 8, 308, R, [0, 1, 2, 3, 4], { kw: 120, lh: 17, size: 11 });
    });
    return s + `<line x1="300" y1="24" x2="300" y2="400" stroke="${C.line}" stroke-width="1.2"/>`;
  }
  /* три случая рядом (только поверхность): обратная задача после ответа */
  function a4cmp3(t, cases) {
    let s = F.title(t('s4_a4g_title_cmp3'), 12, 16);
    cases.forEach((c, i) => {
      const x0 = 4 + i * 198, x1 = x0 + 194, P = a4path(c), R = P.R;
      s += F.panel(x0 + 2, 40, t(['s4_pan_A', 's4_pan_B', 's4_pan_V'][i])) + T(x0 + 20, 40, t(CASE(c)), { a: 'l', size: 11.5, w: 700 });
      s += station(t, 'pm', x0, x1, { rec: P.st[2].rec, ligs: true, resp: respOf(R) });
      s += a4reads(t, x0 + 8, 300, R, [1, 3, 0, 4], { kw: 110, lh: 18, size: 11 });
    });
    return s;
  }
  /* обратная задача до ответа: рецептор на поверхности, ответа нет; ориентация и связывание не проверены */
  function a4invq(t) {
    const R = { on_surface: true, response: false };
    let s = F.title(t('s4_a4g_title_inv'), 12, 16) + station(t, 'pm', 200, 400, { hdr: t(HDR.pm), hideOri: true });
    return s + a4reads(t, 150, 306, R, [0, 4, 1, 2, 3], { nm: [1, 2, 3], kw: 140 });
  }
  GN.s4_a4 = {
    layout: (args, stg) => a4path(args, stg),
    view(args, t) {
      const a = args || [], o = ext(a);
      if (a[0] === 'cmp') return a4cmp(t, o.cases, o);
      if (a[0] === 'cmp3') return a4cmp3(t, o.cases);
      if (a[0] === 'invq') return a4invq(t);
      return a4one(t, a, o);
    },
  };
})();

/* =====================================================================
   s4g_int.js — сцена GN.s4_int «Карта пути: какое наблюдение ближе к какому этапу» (10, ·27 integration; 04, БИО-4·27;
   модель OC.int — 07, 3.8). Та же функция рисует итоговую задачу практикума (s7z_int.js) и шаг «Объяснений» ·27.
   view([mode, o]):
     mode 'map' — этапы слева направо: вход в ЭПР → сворачивание и проверка → выход из ЭПР → аппарат Гольджи (метка M6P) →
       транс-сеть (направление) → адрес и ориентация; над каждым этапом — «ближайшее наблюдение» (10, ·27: сигнал отщеплён,
       N-гликан · задержан с шаперонами · — · M6P на гидролазе · где найден груз · N-домен снаружи);
     mode 'end' — ближайшие наблюдения бледные, подсвечены конечные наблюдения «нет в среде» и «нет функции»; от «нет в среде» —
       стрелки к трём этапам (вход, сворачивание, выход), от «нет функции» — к сворачиванию (участок не сформирован) и к адресу
       и ориентации (критерий 10, ·27: не менее трёх стрелок из «нет в среде»);
     o.hl — список наблюдений OC.INT_OBS, чьи этапы выделяются (итоговая задача: измерение, выбранное верно);
     o.endHl — 'medium' | 'func' — выделенное конечное наблюдение (итоговая задача, случаи 2 и 3).
   Этапы — учебное деление (10, ·27, границы). Русского текста здесь нет.
   ===================================================================== */
(function () {
  const F = S4F, C = F.C, f = F.f, T = F.T;
  const N = 6, X = i => 52 + i * 99.2, BW = 86, SY0 = 142, SY1 = 208, NY0 = 42, NY1 = 106;
  /* наблюдение OC.INT_OBS → этап, к которому оно ближе всего (10, ·27; 04, ·27) */
  const OBS_STAGE = { in_er: 0, retained_er: 1, m6p: 3, in_medium: 4, in_lysosome: 4, on_surface: 4, n_outside: 5, ligand_binds: 5 };
  const END = { medium: { cx: 210, to: [0, 1, 2], key: 's4_int_e1' }, func: { cx: 470, to: [1, 5], key: 's4_int_e2' } };
  const box = (x0, y0, w, h, fill, stroke, sw = 1.4, dash = '') => `<rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  GN.s4_int = { OBS_STAGE, view(args, t) {
    const mode = (args && args[0]) || 'map', o = Object.assign({}, (args && args[1]) || {}), endM = mode === 'end';
    const hlSt = new Set((o.hl || []).map(k => OBS_STAGE[k]).filter(v => v != null));
    let s = '';
    /* ближайшие наблюдения (над этапами) */
    let near = T(10, 26, t('s4_int_near') + ':', { a: 'l', size: 12, w: 700, col: C.muted });
    for (let i = 0; i < N; i++) {
      const x0 = X(i) - BW / 2, on = hlSt.has(i);
      near += box(x0, NY0, BW, NY1 - NY0, on ? '#FFF3C4' : '#F7F8FA', on ? C.warn : C.line, on ? 2 : 1.2) +
        F.TN(X(i), (NY0 + NY1) / 2, F.wrap(t('s4_int_o' + (i + 1)), 12), { size: 11, w: 600, vc: true, col: C.ink }) +
        F.line(X(i), NY1 + 2, X(i), SY0 - 3, C.grey, 1.4, 'stroke-dasharray="2 3"');
    }
    s += endM ? `<g opacity=".35">${near}</g>` : near;
    /* этапы пути (слева направо) */
    for (let i = 0; i < N; i++) {
      const x0 = X(i) - BW / 2, on = hlSt.has(i);
      s += box(x0, SY0, BW, SY1 - SY0, '#fff', on ? C.warn : C.ink, on ? 2.4 : 1.6) +
        F.TN(X(i), (SY0 + SY1) / 2, F.wrap(t('s4_int_st' + (i + 1)), 12), { size: 11, w: 700, vc: true });
      if (i < N - 1) s += F.arrow(X(i) + BW / 2 + 1, (SY0 + SY1) / 2, X(i + 1) - BW / 2 - 1, (SY0 + SY1) / 2, C.ink, 1.8);
    }
    /* конечные наблюдения (режим 'end') */
    if (endM) {
      s += F.TN(10, 316, F.wrap(t('s4_int_end'), 11), { a: 'l', size: 12, w: 700, col: C.muted });
      Object.entries(END).forEach(([k, E]) => {
        const on = !o.endHl || o.endHl === k, w = 140, y0 = 304;
        let q = box(E.cx - w / 2, y0, w, 40, on ? '#FDECEA' : '#F7F8FA', on ? C.bad : C.line, on ? 2 : 1.2) + T(E.cx, y0 + 20, t(E.key), { size: 12, w: 700, col: on ? C.bad : C.muted });
        E.to.forEach((j, n) => { const sx = E.cx + (n - (E.to.length - 1) / 2) * 22; q += F.arrow(sx, y0 - 2, X(j) + (k === 'func' && j === 1 ? 16 : 0), SY1 + 4, on ? C.bad : C.grey, 1.8); });
        s += on ? q : `<g opacity=".45">${q}</g>`;
      });
    }
    return s;
  } };
})();

/* =====================================================================
   s4g_r.js — сцены семинара 4, которые рисуются только на странице «Объяснений» (10, разд. А и Б; агент r):
   ·1 s4_r_ribopool, ·2 s4_r_signal, ·7 s4_r_nac, ·8 s4_r_routes, ·15 s4_r_glycodata, ·21 s4_r_lyset, ·26 s4_r_tgndata, ·28 s4_r_measures.
   Контракт — как у сцен практикума (s4_figs.js): GN.<имя>.view(args, t) → SVG 600 × 420; args — args режима из паспорта 10;
   подписи — только t(ключ): ключи L паспорта (s4p/texts_route_L.py, `<сцена>_<ключ>`) и дополнения s4p/texts_ui_r.py;
   в «Объяснениях» t берёт их из S.L шага (route_keys.json собирает ключи, которые сцена запрашивает во всех режимах).
   Числа: ·15 — из args режима (паспорт 10 = 04: 65 и 51 %, одна серия измерений, HEK293); ·28 — только OC.int_profile / OC.int_min_sets.
   Рисунок — только то, что в паспорте 10, тексте шага 04 и выписках полных текстов (ИС/семинар 4/статьи); научных фактов не добавлено.
   Мембраны — бислой BF (S4F.memH, closedMem); просвет и внеклеточная сторона сверху, цитозоль снизу. Русского текста здесь нет.
   Решения — tools_s4/решения_r.md.
   ===================================================================== */
(function () {
  const { C, f, G, T, line, arrow, carrow, cross, tag, memH, MH, closedMem, roundRectPts, circlePts, carrier,
    ribosome, mrna, chain, srp, srpR, sec61, glycan, bip, hydrolase, solProt, cisterna, axes, tri } = S4F;
  const K = (sc, t) => (k, v) => t('s4_r_' + sc + '_' + k, v);
  const rect = (x, y, w, h, fill, o = {}) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${o.rx == null ? 6 : o.rx}" fill="${fill}"${o.st ? ` stroke="${o.st}" stroke-width="${o.sw || 1.4}"` : ''}${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}${o.op ? ` opacity="${o.op}"` : ''}/>`;
  const ell = (x, y, rx, ry, fill, o = {}) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"${o.st ? ` stroke="${o.st}" stroke-width="${o.sw || 1.4}"` : ''}${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
  const lead = (x1, y1, x2, y2, col = C.muted) => line(x1, y1, x2, y2, col, 1.1);
  const sideUp = (x, y, s, a = 'l') => G('lumen', T(x, y, s, { a, size: 12, w: 700, col: '#3E6A9A', it: true }));
  const sideDn = (x, y, s, a = 'l') => G('cyto', T(x, y, s, { a, size: 12, w: 700, col: '#8A7344', it: true }));
  const lab = (x, y, s, o = {}) => T(x, y, s, Object.assign({ size: 12, w: 600 }, o));
  /* субъединицы рибосомы отдельно (те же формы и размеры, что в S4F.ribosome при k = 1) */
  const subL = (x, y) => G('ribo', ell(x, y, 30, 19, C.riboL));
  const subS = (x, y) => G('ribo', ell(x, y, 23, 11, C.riboS));
  /* свёрнутый растворимый белок: светлая глобула с цепью того же цвета внутри */
  const folded = (x, y, col, g = 'cargo') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="15" fill="#fff" stroke="${col}" stroke-width="2"/>` + chain([[x - 9, y + 5], [x - 3, y - 7], [x + 3, y + 6], [x + 9, y - 5]], { col, w: 2.4, wave: 1.6 }));
  /* белок мембраны из двух половин в бислое (y — середина бислоя) */
  const tm2 = (x, y, col, o = {}) => {
    const h = MH + (o.ext || 8), y0 = y - h / 2;
    if (o.ghost) return rect(x - 11, y0, 22, h, 'none', { st: C.grey, dash: '4 3', rx: 4 });
    return rect(x - 11, y0, 10, h, col, { rx: 4 }) + rect(x + 1, y0, 10, h, col, { rx: 4 });
  };

  /* ---------- ·1 one-ribosome: общий пул субъединиц; цитозольный белок; секретируемый белок; окончание синтеза ----------
     Критерий 10: в режимах 1 и 2 рибосомы — одна фигура одного размера (S4F.ribosome, k = 1); отличие — только сигнал и положение. */
  GN.s4_r_ribopool = { view(args, t) {
    const m = args[0], l = K('ribopool', t), X0 = 236, MY = 112, RX = [330, 430, 530];
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 }) + rect(X0, 0, 600 - X0, MY, C.lumen, { rx: 0 });
    s += sideUp(590, 16, l('lum'), 'r') + sideDn(12, 406, l('cyt'));
    /* общий пул: большие и малые субъединицы в цитозоле */
    s += rect(14, 150, 194, 124, '#fff', { st: C.line, dash: '5 4', op: '.9', rx: 12 });
    s += subL(64, 186) + subL(158, 186) + subS(64, 238) + subS(158, 238) + subS(111, 212);
    s += lab(111, 292, l('pool'), { n: 20, size: 12 });
    const attached = m !== 'cyt';
    const gaps = attached ? RX.map(x => [x - 20, x + 20]) : [];
    s += memH(X0, 600, MY, gaps);
    s += lab(X0 - 8, MY, l('er'), { a: 'r' });
    if (!attached) {
      /* режим 1: полирибосома в цитозоле; цепи без сигнала остаются в цитозоле */
      const cy = 292, my = cy + 22;
      s += mrna(262, 586, my);
      [26, 52, 80].forEach((len, i) => { const x = RX[i], R = ribosome(x, cy, 1);
        s += chain([[x, R.y + 2], [x + 6, R.y - len * .5], [x - 4, R.y - len]]) + R.s; });
      s += lab(424, my + 22, l('mrna_c'));
      s += arrow(210, 236, 296, 272, C.muted, 2);
      return s;
    }
    /* режимы 2 и 3: те же рибосомы прикреплены к мембране; цепи уходят в просвет через транслокон */
    const cy = MY + 46, my = cy + 22, done = m === 'end';
    s += mrna(262, 586, my);
    const lens = [16, 38, 62];
    RX.forEach((x, i) => {
      if (done && i === 2) { s += sec61(x, MY, { plug: true }); return; }
      const R = ribosome(x, cy, 1), top = MY - 10, len = lens[i];
      const pts = [[x, R.y + 2], [x, top], [x + 8, top - len]];
      const L = (R.y + 2 - top) + Math.hypot(8, len);
      s += chain(pts, { sig: 12 / L }) + sec61(x, MY, { open: true }) + R.s;
    });
    s += lab(424, my + 20, l('mrna_s'));
    if (!done) {
      /* подпись сигнала — у N-конца цепи третьей рибосомы */
      s += lab(246, 34, l('sig'), { a: 'l' }) + lead(300, 42, 335, 76);
      s += arrow(210, 196, 294, 162, C.muted, 2);
      return s;
    }
    /* режим 3: рибосома закончила синтез — субъединицы отделились от мембраны и возвращаются в пул; мРНК остаётся у мембраны */
    s += folded(532, MY - 48, C.chain);
    s += subL(534, 248) + subS(534, 282);
    s += carrow(500, 268, 212, 246, -.22, C.muted, 2.2);
    s += lab(356, 330, l('back'));
    return s;
  } };

  /* ---------- ·2 er-signal: цепь кружками (N → C); гидрофобный центр закрашен, заряженные — со знаком «+» ----------
     режимы: секретируемый белок; сигнал удалён; сигнал присоединён к цитозольному белку (цепь другого цвета, сигнал — того же цвета). */
  GN.s4_r_signal = { view(args, t) {
    const m = args[0], l = K('signal', t), Y = 124, R = 8.2, D = 19, X = i => 84 + i * D;
    const nPlus = 2, nHyd = 9, nSig = nPlus + nHyd, nMat = 7;
    const matCol = m === 'fus' ? C.fn : C.chain, ghost = m === 'del';
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 });
    /* сигнал */
    let sg = '';
    for (let i = 0; i < nSig; i++) {
      const x = X(i), hyd = i >= nPlus;
      if (ghost) { sg += `<circle cx="${f(x)}" cy="${Y}" r="${R}" fill="none" stroke="${C.grey}" stroke-width="1.4" stroke-dasharray="3 2.5"/>`; continue; }
      sg += `<circle cx="${f(x)}" cy="${Y}" r="${R}" fill="${hyd ? C.sig : '#fff'}" stroke="${C.sig}" stroke-width="2"/>`;
      if (!hyd) sg += `<text x="${f(x)}" y="${Y + .5}" font-size="13" font-weight="800" fill="${C.sig}" style="text-anchor:middle;dominant-baseline:central;fill:${C.sig}">+</text>`;
    }
    s += line(X(0), Y, X(nSig + nMat - 1), Y, ghost ? C.line : '#9AA6B6', 2) ;
    s += G('sig', sg);
    /* зрелая часть белка */
    let mt = '';
    for (let i = nSig; i < nSig + nMat; i++) mt += `<circle cx="${f(X(i))}" cy="${Y}" r="${R}" fill="#fff" stroke="${matCol}" stroke-width="2"/>`;
    const xe = X(nSig + nMat - 1) + R;
    mt += chain([[xe, Y], [520, Y]], { col: matCol, wave: 3 });
    s += G('chain', mt);
    s += lab(528, Y, l('c'), { a: 'l', size: 11.5 });
    const xm = (X(nSig) - R + 520) / 2;
    s += lab(xm, Y + 30, m === 'fus' ? l('cytp') : l('secp'), { col: matCol, w: 700 });
    if (ghost) {
      /* сигнал удалён: штриховой контур и зачёркивание */
      s += rect(X(0) - 14, Y - 16, X(nSig - 1) - X(0) + 28, 32, 'none', { st: C.bad, dash: '5 4', rx: 10 });
      s += line(X(0) - 10, Y + 12, X(nSig - 1) + 10, Y - 12, C.bad, 2, 'stroke-dasharray="6 4"');
      s += lab(X(nSig), Y - 26, l('n'), { size: 11.5 });
    } else {
      s += lab(X(0) - 14, Y, l('n'), { a: 'r', size: 11.5 });
      /* скобки: положительно заряженные (сверху) и гидрофобный центр (снизу) */
      const b1a = X(0) - R, b1b = X(nPlus - 1) + R, b2a = X(nPlus) - R, b2b = X(nSig - 1) + R;
      s += `<path d="M${f(b1a)},${Y - 14} L${f(b1a)},${Y - 20} L${f(b1b)},${Y - 20} L${f(b1b)},${Y - 14}" fill="none" stroke="${C.sig}" stroke-width="1.4"/>`;
      s += lab(b1a - 10, Y - 34, l('plus'), { a: 'l', size: 11.5, col: C.sig });
      s += `<path d="M${f(b2a)},${Y + 14} L${f(b2a)},${Y + 20} L${f(b2b)},${Y + 20} L${f(b2b)},${Y + 14}" fill="none" stroke="${C.sig}" stroke-width="1.4"/>`;
      s += lab((b2a + b2b) / 2, Y + 36, l('hyd'), { size: 11.5, col: C.sig, n: 34 });
    }
    /* ячейка «место белка»: участок мембраны ЭПР, просвет сверху, цитозоль снизу */
    const bx = 330, bw = 250, by = 222, bh = 176, my = by + 84;
    s += lab(bx - 10, by + 14, l('place'), { a: 'r', w: 700 });
    s += rect(bx, by, bw, my - by, C.lumen, { rx: 0 }) + rect(bx, my, bw, by + bh - my, C.cyto, { rx: 0 });
    s += memH(bx, bx + bw, my) + rect(bx, by, bw, bh, 'none', { st: C.line, rx: 0 });
    s += sideUp(bx + 8, by + 16, l('p_er')) + sideDn(bx + 8, by + bh - 14, l('p_cyt'));
    const inEr = m !== 'del', gx = 520, gy = inEr ? by + 46 : my + 46;
    s += folded(gx, gy, matCol);
    s += arrow(gx, Y + 18, gx, by - 6, C.muted, 2);
    /* вывод режима */
    if (m === 'del') s += tag(160, 300, l('need'), C.bad, { size: 12 });
    if (m === 'fus') s += tag(160, 300, l('suff'), C.ok, { size: 12 });
    return s;
  } };

  /* ---------- ·7 nac-gatekeeper: выход туннеля рибосомы; NAC (центральная часть, якорь, гибкий участок), SRP, цепь ----------
     по данным работы (src_02): центральная часть NAC у выхода туннеля не допускает SRP к цепи; гибкий участок держит SRP рядом;
     выходящий сигнал ЭПР ослабляет связь центральной части NAC с рибосомой; SRP связывает сигнал, NAC остаётся на рибосоме.
     Критерий 10: в режиме 1 SRP не касается цепи. */
  GN.s4_r_nac = { view(args, t) {
    const m = args[0], l = K('nac', t), EX = 300, EY = 190, NAC = '#0E7C86', NACL = '#BFE3E6';
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 });
    /* рибосома: большая субъединица с туннелем, малая под ней */
    s += G('ribo', ell(300, 372, 132, 36, C.riboS) + ell(300, 282, 170, 92, C.riboL));
    s += line(EX, 318, EX, EY + 2, '#2B3647', 15);
    s += sideDn(12, 406, t('s4_r_ribopool_cyt'));
    /* выход туннеля */
    s += lab(206, 262, l('exit'), { col: '#fff', size: 12 }) + line(246, 250, EX - 10, EY + 8, '#fff', 1.1);
    /* цепь */
    if (m === 'nosig') s += chain([[EX, 316], [EX, EY + 2], [272, 184], [246, 160], [236, 122]], { wave: 0, w: 3.4 });
    const sigPts = m === 'sig' ? [[EX, 316], [EX, EY + 2], [298, 160], [290, 116]] : [[EX, 316], [EX, EY + 2], [302, 162], [306, 132]];
    if (m !== 'nosig') { let L = 0; for (let i = 1; i < sigPts.length; i++) L += Math.hypot(sigPts[i][0] - sigPts[i - 1][0], sigPts[i][1] - sigPts[i - 1][1]); s += chain(sigPts, { wave: 0, w: 3.4, sig: 30 / L }); }
    /* NAC: центральная часть — у выхода (1) / отошла (2, 3: штриховой контур); якорь — на поверхности рибосомы справа */
    const core = m === 'nosig' ? [EX, 170] : m === 'sig' ? [352, 160] : [384, 158];
    const knob = [404, 206];
    s += G('chap', line(core[0] + 20, core[1] + 10, knob[0], knob[1], NAC, 4) + `<circle cx="${knob[0]}" cy="${knob[1]}" r="6" fill="${NAC}"/>`);
    /* SRP: рядом, на гибком участке NAC (1, 2) / у выхода туннеля, связана с сигналом (3) */
    const sp = m === 'srp' ? [306, 120] : [478, 112], k = 1.45;
    const uba = m === 'srp' ? [338, 112] : [452, 122];
    const tailPts = []; const ca = [core[0] + 10, core[1] - 16];
    for (let i = 0; i <= 20; i++) { const u = i / 20, x = ca[0] + (uba[0] - ca[0]) * u, y = ca[1] + (uba[1] - ca[1]) * u - Math.sin(u * Math.PI) * 26; const off = Math.sin(u * Math.PI * 4) * 3; tailPts.push(f(x) + ',' + f(y + off)); }
    s += G('chap', `<path d="M${tailPts.join(' L')}" fill="none" stroke="${NAC}" stroke-width="2.6" stroke-linecap="round"/>` + `<circle cx="${uba[0]}" cy="${uba[1]}" r="5.5" fill="${NAC}"/>`);
    s += srp(sp[0], sp[1], k);
    s += G('chap', m === 'nosig' ? ell(core[0], core[1], 34, 20, NAC) : ell(core[0], core[1], 34, 20, NACL, { st: NAC, sw: 2, dash: '5 3' }));
    s += lab(core[0], core[1], l('nac'), { col: m === 'nosig' ? '#fff' : NAC, w: 800, size: 13 });
    /* подписи */
    s += lab(446, 178, l('anchor'), { a: 'l', size: 11.5 }) + lead(444, 182, knob[0] + 6, knob[1] - 4);
    if (m === 'srp') {
      s += lab(sp[0] - 46, sp[1] - 2, l('srp'), { a: 'r', w: 700, col: C.srpr });
      s += lab(500, 64, l('tail'), { size: 11.5, n: 20 }) + lead(466, 88, 372, 102);
      s += lab(250, 150, l('sig'), { a: 'r', col: C.sig }) + lead(254, 150, 300, 140, C.sig);
    } else {
      s += lab(sp[0], sp[1] + 34, l('srp'), { w: 700, col: C.srpr });
      s += lab(470, 40, l('tail'), { size: 11.5, n: 22 }) + lead(446, 64, 420, 96);
      if (m === 'nosig') s += lab(236, 104, l('nosig'));
      else s += lab(250, 112, l('sig'), { a: 'r', col: C.sig }) + lead(254, 114, 286, 124, C.sig);
    }
    return s;
  } };

  /* ---------- ·8 other-routes: три пути в ЭПР (панели А, Б, В); активная панель — в полном цвете, остальные приглушены ---------- */
  GN.s4_r_routes = { view(args, t) {
    const m = args[0], l = K('routes', t), MY = 140;
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 }) + S4F.sides(MY, { top: 30 });
    s += memH(0, 600, MY, [[78, 122], [278, 350], [456, 484], [545, 559]]);
    s += line(200, 30, 200, 420, C.line, 1.4, 'stroke-dasharray="5 4"') + line(400, 30, 400, 420, C.line, 1.4, 'stroke-dasharray="5 4"');
    const head = (x0, L, key) => S4F.panel(x0 + 6, 16, L) + lab(x0 + 24, 16, l(key), { a: 'l', size: 11.5, w: 700 });
    const P = {};
    /* А: во время синтеза — SRP, рецептор SRP, Sec61; рибосома на транслоконе, цепь уходит в просвет */
    {
      let q = head(0, 'А', 'co');
      const R = ribosome(100, MY + 40, 1);
      q += mrna(60, 176, MY + 62);
      q += chain([[100, R.y + 2], [100, MY - 10], [108, MY - 52]], { sig: .16 }) + sec61(100, MY, { open: true }) + R.s;
      q += srpR(36, MY) + srp(36, MY + 44, .75);
      q += lab(36, MY + 66, l('srp'), { size: 11, w: 700, col: C.srpr });
      q += lab(36, MY - 46, l('srpr'), { size: 11, n: 9, col: C.srpr }) + lead(36, MY - 25, 36, MY - 11);
      q += lab(156, MY - 30, l('sec61'), { size: 11, col: C.sec61 }) + lead(144, MY - 24, 116, MY - 14);
      P.A = q;
    }
    /* Б: после синтеза — готовый белок с шаперонами цитозоля, Sec61 с комплексом Sec62–Sec63, BiP в просвете */
    {
      let q = head(200, 'Б', 'post');
      const cp = [[300, MY - 66], [300, MY - 8], [300, MY + 22], [286, MY + 56], [306, MY + 92], [282, MY + 126], [300, MY + 160], [278, MY + 196]];
      q += chain(cp.slice().reverse(), { sig: .1, wave: 2.6 });
      q += sec61(300, MY, { open: true }) + tm2(338, MY, '#5E7FA8');
      q += bip(300, MY - 26, .9) + bip(300, MY - 54, .9);
      q += lab(344, MY - 44, l('bip'), { a: 'l', size: 11.5, col: C.chap, w: 700 }) + lead(342, MY - 44, 318, MY - 36);
      q += lab(352, MY + 30, l('sec6263'), { size: 11, n: 9, col: '#3F5F88' });
      [[286, MY + 58], [304, MY + 124]].forEach(([x, y]) => { q += G('chap', `<path d="M${x - 10},${y - 8} A11,11 0 1 0 ${x + 10},${y - 8}" fill="none" stroke="${C.chap}" stroke-width="4" stroke-linecap="round"/>`); });
      q += lab(352, MY + 112, l('chapc'), { size: 11, n: 10, col: C.chap });
      P.B = q;
    }
    /* В: C-концевой якорь — рибосома отделена от цепи; гидрофобный C-конец захвачен фактором доставки → встраивающий комплекс */
    {
      let q = head(400, 'В', 'ta');
      /* рибосома после синтеза — отдельно от цепи (критерий 10) */
      const R = ribosome(520, 372, 1);
      q += mrna(484, 560, 394) + R.s;
      q += lab(520, 318, l('ribo'), { size: 11, n: 14 });
      /* свободная цепь (N → C): у C-конца — гидрофобный сегмент (красный), его держит фактор доставки */
      q += chain([[418, 300], [436, 280], [420, 262], [444, 250], [468, 262]], { wave: 2.4 });
      q += line(468, 262, 488, 250, C.sig, 5);
      q += G('chap', `<path d="M480,238 Q495,230 503,247 Q497,265 482,261" fill="none" stroke="#0D6E73" stroke-width="5" stroke-linecap="round"/>`);
      q += lab(440, 222, l('fac'), { size: 11, n: 9, col: '#0D6E73' });
      q += arrow(492, 230, 473, MY + 16, C.muted, 2);
      /* встраивающий комплекс мембраны ЭПР и встроенный белок: сегмент в бислое, C-конец — в просвете, основная часть — в цитозоле */
      q += tm2(470, MY, '#6C7A89');
      q += lab(462, MY - 46, l('ins'), { size: 11, n: 12 }) + lead(467, MY - 26, 469, MY - 15);
      q += rect(548.5, MY - MH / 2 - 3, 7, MH + 6, C.sig, { rx: 2 });
      q += chain([[552, MY + MH / 2 + 2], [566, MY + 30], [546, MY + 52], [568, MY + 72]], { wave: 0, w: 3 });
      q += lab(556, MY - 46, l('ta'), { size: 11, n: 10, col: C.sig }) + lead(554, MY - 26, 552, MY - 13);
      q += lab(556, MY + 100, l('bulk'), { size: 11, n: 12 });
      P.C = q;
    }
    ['A', 'B', 'C'].forEach(k => { s += k === m ? P[k] : `<g opacity=".35">${P[k]}</g>`; });
    s += sideUp(8, 44, l('lum')) + sideDn(8, 406, l('cyt'));
    return s;
  } };

  /* ---------- ·15 glyco-data (src_03, Guay et al. 2023): две цепи с отмеченными гликанами + доля выхода в среду ----------
     args: [белок, доля выхода, %] — числа только из паспорта 10 (= 04): α1-антитрипсин 65, антитромбин 51 (одна серия, HEK293);
     вариант с заменой — без числа (null): чаще повторно получает глюкозу → повторный возврат к калнексину (качественно). */
  GN.s4_r_glycodata = { view(args, t) {
    const [m, pct] = args, l = K('glycodata', t), MY = 300, XW = 392, CY = 196, XN = 40, XC = 360;
    let s = rect(0, 0, 600, 420, '#fff', { rx: 0 }) + rect(0, 0, XW, MY, C.lumen, { rx: 0 }) + rect(0, MY, XW, 420 - MY, C.cyto, { rx: 0 });
    s += memH(0, XW, MY, m === 'at3' ? [[292, 312]] : [[68, 88], [292, 312]]);
    s += sideUp(12, 50, t('s4_r_ribopool_lum')) + sideDn(10, 406, t('s4_r_ribopool_cyt'));
    const name = m === 'at3' ? l('at3') : m === 'var' ? l('var') : l('aat');
    s += lab(12, 22, name, { a: 'l', size: 14, w: 800, col: m === 'var' ? C.bad : C.chain });
    /* цепь N → C; положения гликанов условные: у α1-антитрипсина первый гликан — в первых ~50 аминокислотах, у антитромбина — дальше */
    s += chain([[XN, CY], [XC, CY]], { wave: 2.6 });
    s += lab(XN - 4, CY + 22, t('s4_r_signal_n'), { size: 11 }) + lab(XC + 4, CY + 22, t('s4_r_signal_c'), { size: 11 });
    const x50 = XN + (XC - XN) * 50 / 400;
    s += `<path d="M${XN},${CY - 12} L${XN},${CY - 18} L${f(x50)},${CY - 18} L${f(x50)},${CY - 12}" fill="none" stroke="${C.muted}" stroke-width="1.4"/>`;
    s += lab(XN - 6, CY - 32, l('n50'), { a: 'l', size: 11.5, col: C.muted });
    /* калнексин — белок мембраны ЭПР с лектиновой головкой в просвете (выше обычного: головка достаёт до гликана) */
    const cnx = (x, top) => G('cnx', rect(x - 4, MY - MH / 2 - 2, 8, MH + 4, C.chap, { rx: 3 }) + line(x, MY - MH / 2 - 2, x, top + 10, C.chap, 3) +
      `<path d="M${x - 16},${top + 10} A16,11 0 0 1 ${x + 16},${top + 10} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
    if (m === 'at3') {
      s += glycan(204, CY - 4, -1, { glc: 0, u: 6 }) + glycan(284, CY - 4, -1, { glc: 0, u: 6 });
      s += bip(62, CY, 1.05) + bip(96, CY, 1.05);
      s += lab(80, CY + 40, l('bip'), { w: 700, col: C.chap });
      s += cnx(302, 254) + lab(302, 234, l('cnx'), { size: 11.5, col: C.chap });
    } else {
      /* гликан у N-конца смотрит вниз — к головке калнексина (связан через концевую глюкозу) */
      s += glycan(78, CY + 4, 1, { glc: 1, u: 6 }) + glycan(284, CY - 4, -1, { glc: 0, u: 6 });
      s += cnx(78, 254) + lab(66, 280, l('cnx'), { a: 'r', size: 11, col: C.chap });
      s += cnx(302, 254);
      if (m === 'var') {
        /* замена аминокислоты в цепи и повторные циклы связывания с калнексином */
        s += `<path d="M196,${CY - 11} L200,${CY - 3} L209,${CY - 3} L202,${CY + 3} L205,${CY + 12} L196,${CY + 6} L187,${CY + 12} L190,${CY + 3} L183,${CY - 3} L192,${CY - 3} Z" fill="${C.bad}"/>`;
        s += carrow(94, 238, 136, 252, -.45, C.bad, 2) + carrow(136, 262, 96, 270, -.45, C.bad, 2);
        s += lab(206, 256, l('cycle'), { size: 11.5, col: C.bad, n: 20 });
      }
    }
    /* правая часть: доля выхода в среду (столбец) или повторное глюкозилирование (вариант) */
    const BX = 452, BY = 286, BH = 190;
    if (pct != null) {
      const A = axes(BX, BY, 110, BH, 100, [0, 50, 100], '%');
      s += A.s + rect(BX + 26, BY - A.H(pct), 56, A.H(pct), C.sec, { rx: 2 });
      s += lab(BX + 54, BY - A.H(pct) - 14, pct + ' %', { size: 15, w: 800 });
      s += lab(BX + 54, BY + 16, l('sec'), { size: 12, w: 700 });
      s += lab(BX + 54, BY + 36, l('series'), { size: 11.5, col: C.muted, it: true });
    } else {
      const gx = 500, gy = 178;
      s += glycan(gx, gy + 34, -1, { glc: 1, u: 7 });
      s += carrow(gx + 40, gy - 30, gx + 40, gy + 50, -.6, C.bad, 2.2) + carrow(gx - 40, gy + 50, gx - 40, gy - 30, -.6, C.bad, 2.2);
      s += lab(gx, gy + 96, l('reglc'), { size: 12.5, w: 700, col: C.bad, n: 18 });
    }
    s += lab(500, 370, l('cell'), { size: 11, col: C.muted, n: 26 });
    return s;
  } };

  /* ---------- ·21 lyset (src_04, Richards et al. 2022): фермент метки в аппарате Гольджи с LYSET и без него ----------
     внеклеточная среда — сверху, над плазматической мембраной; цитозоль — снизу; просвет цистерн и лизосомы — внутри мембран.
     Критерий 10: мРНК фермента не изображается (её количество не меняется) — на схеме её нет ни в одном режиме. */
  GN.s4_r_lyset = { view(args, t) {
    const ko = args[0] === 'ko', l = K('lyset', t), PM = 74, ENZ = '#11707A', LYS = '#E0A800';
    let s = rect(0, 0, 600, 420, C.cyto, { rx: 0 }) + rect(0, 0, 600, PM, C.lumen, { rx: 0 });
    s += memH(0, 600, PM, [], 'pm') + sideUp(10, 18, l('medium')) + sideDn(10, 406, t('s4_r_ribopool_cyt'));
    /* аппарат Гольджи: три цистерны; в средней (широкой) — фермент метки и LYSET в мембране, активная часть фермента в просвете */
    const gx = 170;
    s += cisterna(gx, 130, 220, 28) + cisterna(gx, 196, 240, 28) + cisterna(gx, 264, 256, 56);
    s += lab(96, 96, l('golgi'), { w: 700 });
    const ex = 128, ey = 264 + 28;   /* нижняя мембрана нижней (широкой) цистерны */
    if (!ko) {
      s += G('tagenz', rect(ex - 3.5, ey - MH / 2 - 2, 7, MH + 4, ENZ, { rx: 3 }) + rect(ex - 18, ey - MH / 2 - 16, 36, 14, ENZ, { rx: 6 }));
      s += G('tagenz', rect(ex + 22, ey - MH / 2 - 3, 9, MH + 6, LYS, { rx: 3 }) + rect(ex + 17, ey - MH / 2 - 9, 19, 8, LYS, { rx: 3 }));
      s += lab(84, 340, l('ptr'), { col: ENZ, w: 700 }) + lead(100, 328, ex - 2, ey + 12, ENZ);
      s += lab(200, 340, l('lyset'), { col: '#9A7400', w: 700 }) + lead(192, 328, ex + 27, ey + 12, '#9A7400');
    } else {
      s += rect(ex - 18, ey - MH / 2 - 16, 36, 14 + MH + 18, 'none', { st: C.grey, dash: '4 3', rx: 6 });
      s += rect(ex + 17, ey - MH / 2 - 9, 19, MH + 15, 'none', { st: C.grey, dash: '4 3', rx: 4 }) + cross(ex + 26, ey - 26, 6);
      s += lab(200, 340, l('lyset'), { col: C.muted, w: 700 }) + lead(192, 328, ex + 27, ey + 12, C.muted);
    }
    /* лизосома */
    const LX = 470, LY = 250, LR = 62;
    s += closedMem(circlePts(LX, LY, LR), C.lumen, 'lyso')   /* С-13 */ + lab(LX, LY + LR + 22, l('lys'), { w: 700 });
    /* не зависят от M6P: гидролаза без M6P-пути (другой цвет) и мембранный белок лизосомы — в лизосоме в обоих режимах */
    s += G('hydro', `<circle cx="${LX + 22}" cy="${LY + 26}" r="7" fill="#E9C46A" stroke="#8A6D0B" stroke-width="1"/>`);
    s += G('tm', rect(LX + LR - (MH + 6) / 2, LY - 4.5, MH + 6, 9, '#6B8E23', { rx: 3 }));
    s += lab(552, 352, l('indep'), { size: 11.5, n: 11 }) + lead(540, 338, LX + 27, LY + 31) + lead(560, 338, LX + LR + 4, LY + 8);
    if (!ko) {
      /* норма: гидролазы получают метку и уходят в лизосомы (в лизосоме метка снята) */
      [[LX - 26, LY - 14], [LX - 4, LY - 34], [LX + 6, LY + 2], [LX - 28, LY + 22]].forEach(([x, y]) => { s += hydrolase(x, y); });
      s += carrier(346, 176, 15, null, hydrolase(344, 178, { tag: true, r: 6 }));
      s += arrow(288, 140, 324, 166, C.ink, 2.2) + arrow(366, 186, LX - LR + 2, LY - 22, C.ink, 2.2);
      s += lab(356, 124, l('hyd_m6p'), { size: 11.5, n: 14 });
    } else {
      /* без LYSET: фермент метки уходит в лизосому и разрушается; гидролазы без метки уходят в среду */
      s += hydrolase(LX - 10, LY - 20);

const TOP0 = 0.01;
const T1G = (function () {

  const sec61Ghost = (x, y) => G('sec61', `<rect x="${f(x - 15)}" y="${f(y - MH / 2 - 7)}" width="30" height="${f(MH + 14)}" rx="5" fill="none" stroke="${C.grey}" stroke-dasharray="4 3"/>`) + cross(x, y, 8);

  function outcome(o) {
    const p = o.parts || {}, cargo = o.cargo || 'secreted';

     P — геометрия: MY — середина бислоя; x0, x1 — края мембраны; RX, SX, PX — рецептор SRP, Sec61, сигнальная пептидаза;

  function path(P, s, t) {

    const startR = P.st, dockR = [P.SX, MY + 48], recR = [P.RX + 45, MY + 95], finR = [P.SX, MY + 64];
    const srpBound = [startR[0] + 6, startR[1] - 58], srpRec = [P.RX, MY + 46], srpGone = P.srpBack;
    /* какой «финал» (статичная схема) */
    let F = null;

    const gaps = [[P.SX - 22, P.SX + 22]];

    if (sigInMem) gaps.push([P.SX + 23, P.SX + 33]);

    if (!secOn) back += sec61Ghost(P.SX, MY);
    else back += sec61(P.SX, MY, { open: secOpen, plug: !secOpen, gate: !fin && stg === 5 && secOpen, off: blocked });
    lab += T(P.SX + 26, MY - 46, tN(blocked && secOn ? 'sec61_blocked' : 'sec61'), { a: 'l', size: 11.5, w: 600, col: C.sec61 });
    /* сигнальная пептидаза: активный центр со стороны просвета (10, ·4) */
    back += spase(P.PX, MY, { off: !spOn });
    lab += TN(P.PX + 15, MY - 80, S4F.wrap(tN('spase'), 12), { size: 11.5, w: 600, col: C.spase });

    /* ---------- рибосома, мРНК, цепь, SRP по кадрам ---------- */
    const riboAt = (xy, slowSign) => {
      const r = ribosome(xy[0], xy[1], 1, {});
      let s = mrna(xy[0] - 62, xy[0] + 62, xy[1] + 24) + r.s;
      lab += T(xy[0], xy[1] + 40, t(P.mlab || 's4_t1b_mrna'), { size: 11.5, col: C.mrna, w: 600 });
      lab += T(xy[0], xy[1] + 57, tN('ribo'), { size: 11.5, col: C.riboL, w: 600 });
      if (slowSign === 'slow' || slowSign === 'fast') {
        if (slowSign === 'slow') s += `<g>${clock(xy[0] + 27, xy[1] - 27)}</g>`;
        lab += T(xy[0], xy[1] + 75, tN(slowSign), { size: 11.5, w: 700, col: slowSign === 'slow' ? C.warn : C.ok });
      } else if (slowSign === 'wait') lab += waitBox(xy[0] - 85, xy[1] + 68, 170, 22, t('s4_hidden'));
      return { s, ex: r.x, ey: r.y };
    };
    const srpFree = xy => (srpOn ? srp(xy[0], xy[1]) : srpGhost(xy[0], xy[1])) + T(xy[0] + 32, xy[1], tN('srp'), { a: 'l', size: 12, w: 700, col: C.srp });
    const sigLabel = (x, y, key, a = 'l') => TN(x, y, S4F.wrap(tN(key), 15), { a, size: 11.5, w: 600, col: C.sig });
    let R;
    const stage = fin ? -1 : stg;
    if (!fin && (stage === 0 || stage === 1 || (stage >= 2 && !sigOn))) {
      /* Э1.1 (или кадр «до начала»): рибосома в цитозоле, из туннеля выходит начало цепи */
      R = riboAt(startR, null);
      if (stage >= 1) {
        const pts = [[R.ex, R.ey], [R.ex, R.ey - 22]];
        fore += sigOn ? chainS(pts, 22, { col }) : chain(pts, { col });
        if (sigOn && !(P.noSigLabelPre && wait)) lab += sigLabel(R.ex + 14, R.ey - 26, 'sig');
      }
      fore += srpFree(P.srpF);
    } else if (!fin && stage === 2) {
      /* Э1.2: SRP связывает сигнал и рибосому, синтез замедлен */
      R = riboAt(startR, o.focus === 's4' && wait ? 'wait' : 'slow');
      fore += chainS([[R.ex, R.ey], [R.ex + 2, R.ey - 24]], 24, { col }) + srp(srpBound[0], srpBound[1]);
      lab += T(srpBound[0] - 32, srpBound[1] + 2, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }) + gtp(srpBound[0], srpBound[1] - 26, t);
      lab += sigLabel(R.ex + 40, R.ey - 6, 'sig');
    } else if (!fin && stage === 3) {
      /* Э1.3: комплекс SRP с рибосомой связан с рецептором SRP (10, ·3: стрелка рибосома → рецептор) */
      R = riboAt(recR, 'slow');
      fore += chainS([[R.ex, R.ey], [R.ex - 14, R.ey - 6], [srpRec[0] + 6, srpRec[1] + 6]], 30, { col }) + srp(srpRec[0], srpRec[1]);
      lab += T(srpRec[0] - 32, srpRec[1] + 22, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }) + gtp(srpRec[0] - 45, srpRec[1] + 2, t) + gtp(P.RX - 34, MY + 22, t);
      back += arrow(startR[0] + 44, startR[1] - 8, recR[0] - 40, recR[1] + 2, C.muted, 2, '5 4');
    } else if (!fin && stage === 4) {
      /* Э1.4: рецептор передаёт рибосому транслокону; сигнал входит в транслокон (стрелка рецептор → транслокон) */
      R = riboAt(dockR, 'slow');
      if (srpOn && srprOn) fore += srp(srpRec[0], srpRec[1]) + T(srpRec[0] - 32, srpRec[1] + 22, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }) + gtp(srpRec[0] - 45, srpRec[1] + 2, t) + gtp(P.RX - 34, MY + 22, t);
      if (secOn && !blocked) fore += chainS([[R.ex, R.ey], [R.ex, top - 2]], 26, { col, wave: 1.6 });
      else fore += chainS([[R.ex, R.ey], [R.ex - 6, R.ey + 2]], 6, { col, wave: 0 });
      if (secOn && !blocked) lab += TN(P.SX, MY - 76, S4F.wrap(tN('sig'), 15), { size: 11.5, w: 600, col: C.sig }) + line(P.SX, MY - 50, P.SX, top - 10, C.muted, 1);
      fore += arrow(P.RX + 20, MY + 22, P.SX - 26, MY + 18, C.muted, 2);
    } else if (!fin && stage === 5) {
      /* Э1.5: SRP и рецептор отделились (стрелка «в цитозоль, к новому циклу»); цепь проходит в просвет */
      R = riboAt(dockR, 'fast');
      const gx = P.SX + 28;
      fore += chainS([[R.ex, R.ey], [P.SX, top - 4], [P.SX - 14, MY - 40], [P.SX + 4, MY - 56], [gx - 8, top - 8], [gx, top + 2], [gx, bot + 3]], MH + 9, { col, wave: 1.8 });
      lab += T(gx + 2, bot + 12, tN('n'), { a: 'l', size: 11, w: 700, col: C.sig });
      fore += srpFree0(srpGone) + arrow(srpRec[0] - 20, srpRec[1] + 16, srpGone[0] + 30, srpGone[1] - 12, C.srp, 2.2);
      lab += T(srpGone[0], srpGone[1] + 30, tN('recycle'), { size: 11.5, w: 600, col: C.srp });
    } else if (!fin && stage === 6) {
      F = 'normal';
    }
    function srpFree0(xy) { return srp(xy[0], xy[1]) + T(xy[0] - 32, xy[1], tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp }); }

    /* ---------- конечные состояния (статичная схема; Э1.6 нормального пути = статичная схема) ---------- */
    if (F) {
      const bl = P.blobL, bc = P.blobC;
      if (F === 'normal' || F === 'tethered') {
        R = riboAt(finR, null);
        const gx = P.SX + 28;
        if (F === 'normal') {
          fore += chain(coil(bl[0], bl[1], 24, -.4), { col, wave: 1.4 }) + G('sig', line(gx, top + 1, gx, bot - 1, C.sig, 3.4));
          lab += T(bl[0], bl[1] + 38, cargoName, { size: 12, w: 700, col }) + TN(gx + 10, MY + 28, S4F.wrap(tN('cleaved'), 15), { a: 'l', size: 11.5, w: 600, col: C.sig });
        } else {
          const cp = coil(bl[0], bl[1], 24, -.4).reverse();
          const pts = cp.concat([[bl[0] + 40, bl[1] + 10], [gx - 10, MY - 46], [gx, top - 4], [gx, top + 1], [gx, bot + 3]]);
          fore += chainS(pts, MH + 7, { col, wave: 1.4 });
          lab += T(bl[0], bl[1] + 38, cargoName, { size: 12, w: 700, col }) + TN(gx + 10, MY + 28, S4F.wrap(tN(o.inv === 'post' ? 'notcut' : 'inmem'), 15), { a: 'l', size: 11.5, w: 600, col: C.sig });
          if (o.inv === 'post') fore += cross(gx, top - 7, 6);
          if (o.inv ? o.inv === 'post' : !spOn) lab += tag(P.PX + 15, MY - 112, t('s4_model_note'), C.warn);
        }
        fore += srpFree(srpGone);
      } else if (F === 'blocked') {
        R = riboAt(dockR, null);
        const cp = coil(bc[0], bc[1], 22, -1.2);
        const pts = [[R.ex, R.ey], [R.ex - 24, R.ey + 3], [bc[0] + 40, bc[1] - 26]].concat(cp).concat([[bc[0] - 44, bc[1] + 2]]);
        fore += chainS(pts, 22, { col, wave: 1.4 });
        lab += T(bc[0], bc[1] + 36, cargoName, { size: 12, w: 700, col }) + T(bc[0] - 52, bc[1] + 2, tN('kept'), { a: 'r', size: 11.5, w: 600, col: C.sig });
        fore += srpFree(P.srpF2);
      } else if (F === 'nosec61') {
        R = riboAt(recR, null);
        fore += srp(srpRec[0], srpRec[1]) + T(srpRec[0] - 32, srpRec[1] + 22, tN('srp'), { a: 'r', size: 12, w: 700, col: C.srp });
        const c2 = [recR[0] + 92, recR[1] - 6], cp = coil(c2[0], c2[1], 20, 3.2);
        const pts = [[R.ex, R.ey], [R.ex + 26, R.ey - 4], [c2[0] - 20, c2[1] - 10]].concat(cp).concat([[c2[0] + 20, c2[1] + 30]]);
        fore += chainS(pts, 22, { col, wave: 1.4 });
        lab += T(c2[0], c2[1] - 34, cargoName, { size: 12, w: 700, col }) + T(c2[0] + 22, c2[1] + 46, tN('kept'), { size: 11.5, w: 600, col: C.sig });
      } else {
        /* свободная рибосома: актин, сигнал убран, или нет SRP / рецептора SRP (синтез заканчивается в цитозоле) */
        R = riboAt(startR, null);
        const bf = P.blobF, cp = coil(bf[0], bf[1], 22, 1.6);
        const red = F === 'nosrp';
        const pts = [[R.ex, R.ey], [R.ex, bf[1] + 30]].concat(cp).concat([[bf[0] - 38, bf[1] - 18]]);
        fore += red ? chainS(pts, 22, { col, wave: 1.4 }) : chain(pts, { col, wave: 1.4 });
        lab += T(bf[0] + 32, bf[1] + 6, cargoName, { a: 'l', size: 12, w: 700, col });
        if (red) lab += T(bf[0] - 46, bf[1] - 26, tN('kept'), { a: 'r', size: 11.5, w: 600, col: C.sig });
        if (s.nosig) lab += G('sig', `<path d="M${f(bf[0] - 38)},${f(bf[1] - 18)} L${f(bf[0] - 52)},${f(bf[1] - 30)}" stroke="${C.sig}" stroke-width="2" stroke-dasharray="3 3" fill="none"/>`) + cross(bf[0] - 56, bf[1] - 36, 6);
        fore += srpFree(P.srpF);
      }
    }
    /* до ответа исход не рисуется: плашка на месте результата (просвет и цитозоль — оба возможны) */
    if (wait && P.waitL) lab += waitBox(P.waitL[0], P.waitL[1], P.waitL[2], P.waitL[3], t('s4_hidden'));
    return back + (R ? R.s : '') + fore + lab;
  }
  function clock(x, y) {
    return `<circle cx="${f(x)}" cy="${f(y)}" r="7" fill="#fff" stroke="${C.warn}" stroke-width="1.6"/>` + line(x, y - 4.5, x, y, C.warn, 1.6) + line(x, y, x + 3, y + 2, C.warn, 1.6);
  }
  return { C, ACT, LUMT, CYTT, outcome, path, coil, chainS, plen, gtp };
})();

/* ---------- GN.s4_t1b: панель Б практикума и ·3 «Объяснений» ---------- */
GN.s4_t1b = (function () {

/* ---------- GN.s4_t1a: панель А практикума (шаги 1.1–1.2) ---------- */
GN.s4_t1a = (function () {
  const { C, f, G, T, TN, line, memH, waitBox } = S4F;
  const PA = { MY: 150, x0: 230, x1: 600, RX: 375, SX: 452, PX: 536, st: [306, 300], srpF: [470, 214], srpF2: [470, 214], srpBack: [330, 262], blobL: [320, 62], blobC: [306, 205], blobF: [306, 200],

  function two(o, t) {

    /* фон: цитозоль на всём поле; просвет ЭПР — над мембраной в правой части схемы (02, шаг 1.1) */
    let s = `<rect x="0" y="0" width="600" height="420" fill="${C.cyto}"/>` + G('lumen', `<rect x="${PA.x0}" y="0" width="${600 - PA.x0}" height="${PA.MY}" fill="${C.lumen}"/>`);
    s += G('lumen', T(PA.x0 + 10, 14, t('s4_t1b_lum'), { a: 'l', size: 12, w: 700, col: T1G.LUMT, it: true })) + G('cyto', T(10, 406, t('s4_t1b_cyt'), { a: 'l', size: 12, w: 700, col: T1G.CYTT, it: true }));
    /* альбумин — по этапам Э1.1–Э1.6 (та же функция, что панель Б) */
    s += T1G.path(PA, { stg: stg === 6 ? 'fin' : stg, kind: 'normal', o: { cargo: 'secreted', sec61: 'open', spase: true, parts: {}, wait: o.wait } }, t);
    /* актин: свободная рибосома, цепь без сигнала; к концу синтеза — белок в цитозоле */
    const ax = 100, ay = 300;
    const r = S4F.ribosome(ax, ay, 1, {});
    s += S4F.mrna(ax - 62, ax + 62, ay + 24) + r.s;
    s += T(ax, ay + 40, t('s4_t1a_mrna_act'), { size: 11.5, col: C.mrna, w: 600 }) + T(ax, ay + 57, t('s4_t1b_ribo'), { size: 11.5, col: C.riboL, w: 600 });
    const done = stg === 'fin' || stg === 6;
    if (done) { const cp = T1G.coil(ax, 205, 22, 1.6); s += S4F.chain([[r.x, r.y], [r.x, 235]].concat(cp), { col: T1G.ACT, wave: 1.4 }); s += T(ax + 32, 211, t('s4_t1b_act'), { a: 'l', size: 12, w: 700, col: T1G.ACT }); }
    else if (stg >= 1) { const L = Math.min(56, 14 + 8 * stg); s += S4F.chain([[r.x, r.y], [r.x, r.y - L]], { col: T1G.ACT }); }
    return s;
  }
  /* начало цепи: кружки — аминокислоты, закрашены неполярные (02, шаг 1.2); после ответа — гидрофобный центр и два других сигнала */
  const ROWS = [
    { k: 's4_t1b_alb', pat: 'o+HHHHHHHHHoooo' },
    { k: 's4_t1a_other', pat: '+o+HHHHHHHHHHoo' },
    { k: 's4_t1a_other', pat: 'o+ooHHHHHHHHooo' },

  function sig(o, t) {

    const x0 = 150, dx = 22, rr = 9;

      if (i && !rev) return;
      const y = 80 + i * 106, n = R.pat.length, a = R.pat.indexOf('H'), b = R.pat.lastIndexOf('H');
      s += T(x0 - 10, y - 30, t(R.k), { a: 'l', size: 12.5, w: 700, col: i ? C.ink : C.chain });
      s += T(x0 - 18, y, t('s4_t1a_n'), { a: 'r', size: 11.5, w: 600, col: C.muted });
      if (rev) s += `<rect x="${f(x0 + a * dx - 13)}" y="${f(y - 14)}" width="${f((b - a) * dx + 26)}" height="28" rx="14" fill="#FBE3C8"/>`;
      let ch = line(x0, y, x0 + (n - 1) * dx, y, C.chain, 2.4) + line(x0 + (n - 1) * dx + rr, y, 556, y, C.chain, 3.2);
      for (let j = 0; j < n; j++) { const c = R.pat[j], x = x0 + j * dx, H = c === 'H';
        ch += `<circle cx="${f(x)}" cy="${f(y)}" r="${rr}" fill="${H ? C.sig : '#fff'}" stroke="${C.sig}" stroke-width="1.6"/>`;
        if (c === '+') ch += T(x, y + .5, '+', { size: 12, w: 800, col: C.sig }); }
      s += G('sig', ch) + T(512, y - 20, t('s4_t1a_rest'), { size: 11.5, col: C.muted, w: 600 });
      if (rev) { const xa = x0 + a * dx - 9, xb = x0 + b * dx + 9;
        s += line(xa, y + 19, xb, y + 19, '#B0652A', 2) + line(xa, y + 19, xa, y + 14, '#B0652A', 2) + line(xb, y + 19, xb, y + 14, '#B0652A', 2);
        s += i ? T((xa + xb) / 2, y + 33, t('s4_t1a_hyd_s'), { size: 11.5, w: 700, col: '#8C4A12' }) : TN((xa + xb) / 2, y + 33, S4F.wrap(t('s4_t1a_hyd'), 30), { size: 11.5, w: 700, col: '#8C4A12' }); }
    });

    s += `<circle cx="26" cy="372" r="7" fill="${C.sig}" stroke="${C.sig}" stroke-width="1.2"/>` + T(40, 372, t('s4_t1a_legend'), { a: 'l', size: 11.5, col: C.ink }) + T(40, 392, t('s4_t1a_cond'), { a: 'l', size: 11, col: C.muted, it: true });
    return s;
  }
  function view(args, t) { const [mode = 'two', o = {}] = args || []; return mode === 'sig' ? sig(o, t) : two(o, t); }
  return { view, P: PA };
})();

/* ---------- GN.s4_t1c: встраивание мембранного белка (·5; MBoC7 с. 709–711, рис. 12–26 — 12–28) ---------- */

      s += plus((b + c) / 2 - 12, cy + 72) + plus((b + c) / 2 + 12, cy + 72) + plus(a - 30, bot + 22);

      s += TN((b + c) / 2, cy + 86, S4F.wrap(t('s4_t1c_plus'), 26), { size: 11.5, w: 600, col: C.chain });

})();

/* ---------- GN.s4_r_sec61: разрез транслокона Sec61 (·4; MBoC7 с. 704–706, рис. 12–22, 12–23) ---------- */
GN.s4_r_sec61 = (function () {
  const { C, f, G, T, TN, line, arrow, cross, sides, memH, MH, ribosome, mrna, chain, spase } = S4F;
  const MY = 200, X = 300, HW = 28, HH = MH + 30;
  /* крупный Sec61: две половины поперёк бислоя; open — канал раскрыт; gate — латеральные ворота (справа) раскрыты */
  function big(o) {
    const gap = o.open ? 18 : 4, y0 = MY - HH / 2, gx = o.gate ? 10 : 0;
    let s = `<rect x="${f(X - gap / 2 - HW)}" y="${f(y0)}" width="${HW}" height="${HH}" rx="9" fill="${C.sec61}"/>` +
      `<rect x="${f(X + gap / 2 + gx)}" y="${f(y0)}" width="${HW}" height="${HH}" rx="9" fill="${C.sec61}"/>`;
    return G('sec61', s);
  }
  const plugAt = (x, y, w) => G('plug', `<rect x="${f(x - w / 2)}" y="${f(y - 5)}" width="${f(w)}" height="10" rx="4" fill="${C.plug}" stroke="${C.sec61}" stroke-width="1.2"/>`);
  function view(args, t) {
    const m = (args || [])[0] || 'closed';
    const L = k => t('s4_r_sec61_' + k), top = MY - MH / 2, bot = MY + MH / 2, y0 = MY - HH / 2, y1 = MY + HH / 2;
    let s = sides(MY, { top: TOP0, up: L('lum'), down: L('cyt') });
    const SP = 452;
    const gaps = [m === 'gate' || m === 'transfer' ? [X - 38, X + 52] : [X - 34, X + 34]]; if (m !== 'closed') gaps.push([SP - 8, SP + 8]);
    if (m === 'transfer') gaps.push([X + 44, X + 58]);
    s += memH(0, 600, MY, gaps);
    const open = m === 'gate' || m === 'transfer';
    s += big({ open, gate: open });
    s += T(X - HW - 20, y1 + 8, L('name'), { a: 'r', size: 12, w: 700, col: C.sec61 });
    if (m !== 'closed') s += spase(SP, MY, {}) + TN(SP + 14, MY - 70, S4F.wrap(L('spase'), 12), { a: 'l', size: 11.5, w: 700, col: C.spase });
    if (m === 'closed' || m === 'end') {
      s += plugAt(X, y0 + 8, 24) + T(X + 40, y0 - 12, L('plug'), { a: 'l', size: 12, w: 700, col: C.sec61 }) + line(X + 37, y0 - 8, X + 10, y0 + 4, C.muted, 1);
    }
    if (m === 'closed') {
      /* кальций просвета не выходит в цитозоль: канал закрыт пробкой (MBoC7 с. 706) */
      [[X - 40, 70], [X - 18, 96], [X + 6, 64], [X - 62, 104]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="5" fill="#9DB8E0" stroke="${C.sec61}" stroke-width="1"/>`; });
      s += arrow(X - 20, 112, X - 4, y0 - 6, C.muted, 2, '4 3') + cross(X - 10, 140, 7);
      s += T(X - 82, 70, L('ca'), { a: 'r', size: 12, w: 700, col: C.ink });
      s += ribosome(X - 170, 320, 1.2).s + mrna(X - 245, X - 95, 349);
      s += T(X - 170, 372, L('ribo'), { size: 11.5, w: 600, col: C.riboL });
      return s;
    }
    const k = 1.5, rcy = m === 'end' ? 300 : y1 + 2 + 32 * k;
    const R = ribosome(X, rcy, k);
    s += mrna(X - 92, X + 92, rcy + 22 * k + 2) + R.s + T(X - 50 * k - 8, rcy, L('ribo'), { a: 'r', size: 11.5, w: 600, col: C.riboL });
    if (m === 'gate') {
      /* сигнал в латеральных воротах: петля цепи в канале, N-конец обращён к цитозолю; пробка смещена */
      const gx = X + 9 + 5;
      s += chain([[X, R.y], [X - 3, y0 + 10], [X + 4, y0 - 4], [gx, y0 + 6], [gx, y1 - 2]], { sig: .5, wave: 1.2 });
      s += plugAt(X - 46, y0 - 26, 24) + T(X - 64, y0 - 26, L('plug'), { a: 'r', size: 12, w: 700, col: C.sec61 });
      s += T(X + 52, y1 + 16, L('n'), { a: 'l', size: 11.5, w: 700, col: C.sig }) + line(X + 49, y1 + 12, gx + 3, y1, C.muted, 1);
      s += T(X + 60, y0 - 14, L('gate'), { a: 'l', size: 12, w: 700, col: C.sec61 }) + line(X + 57, y0 - 10, X + 20, y0 + 8, C.muted, 1);
      return s;
    }
    if (m === 'transfer') {
      /* цепь проходит по мере синтеза; сигнал ушёл в бислой и отщеплён со стороны просвета */
      const gx = X + 51;
      s += chain([[X, R.y], [X + 2, y0 - 2], [X - 22, 120], [X + 10, 80], [X + 44, 112], [gx - 2, top - 8]], { wave: 1.6 });
      s += G('sig', line(gx, top + 1, gx, bot - 1, C.sig, 3.4)) + T(gx + 10, bot + 14, L('n'), { a: 'l', size: 11.5, w: 700, col: C.sig });
      s += `<g>${scissors(SP - 20, top - 14)}</g>` + line(SP - 30, top - 12, gx + 6, top - 9, C.spase, 1.2, 'stroke-dasharray="3 2"');
      s += arrow(X - 38, 165, X - 38, 96, C.chain, 2) + TN(X - 48, 125, S4F.wrap(L('elong'), 18), { a: 'r', size: 11.5, w: 600, col: C.chain });
      s += plugAt(X - 80, 162, 24) + T(X - 98, 162, L('plug'), { a: 'r', size: 12, w: 700, col: C.sec61 });
      return s;
    }
    /* окончание синтеза: белок в просвете, C-конец прошёл; канал закрыт пробкой; рибосома отходит */
    const cp = T1G.coil(X - 6, 92, 30, .4, 1.8);
    s += chain(cp.concat([[X + 40, 120]]), { wave: 1.4 }) + T(X + 46, 122, L('c'), { a: 'l', size: 11.5, w: 700, col: C.chain });
    return s;
  }
  function scissors(x, y) {
    const c = S4F.C.spase;
    return `<circle cx="${f(x - 5)}" cy="${f(y + 6)}" r="3.4" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="${f(x + 5)}" cy="${f(y + 6)}" r="3.4" fill="none" stroke="${c}" stroke-width="1.6"/>` +
      line(x - 3, y + 3, x + 6, y - 9, c, 1.6) + line(x + 3, y + 3, x - 6, y - 9, c, 1.6);
  }
  return { view };
})();

  function gly(x, y, dir = -1, o = {}) {

      : `<path d="M${f(X)},${f(Yy - u * .55)} L${f(X + u * .55)},${f(Yy + u * .45)} L${f(X - u * .55)},${f(Yy + u * .45)} Z" fill="none" stroke="${GH}" stroke-width="1.3" stroke-dasharray="2.2 1.6"/>`;

      L(xb, Y(4), xb1, Y(5)) + L(xb, Y(4), xb2, Y(5)) + (tr ? '' : L(xb1, Y(5), xb1, Y(6)) + L(xb2, Y(5), xb2, Y(6)));
    s += F.sq(x, Y(1), u) + F.sq(x, Y(2), u) + F.ci(x, Y(3), u) + F.ci(xa, Y(4), u) + F.ci(xa, Y(5), u) + F.ci(xb, Y(4), u) + F.ci(xb1, Y(5), u) + F.ci(xb2, Y(5), u);

     однопроходный мембранный белок — трансмембранный сегмент (ТМ) в бислое, домен с N-гликаном в просвете, короткий C-хвост в цитозоле.

  const SUBF = { a: PFILL, b: '#CFE6C6' };

  const tmSeg = (x, y, noTail) => G('tm', `<g data-part="tm"><rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${C.chain}"/></g>`) + (noTail ? '' :

  const subER = (k, x, y0, stalk, domS) => `<g data-sub="${k}" data-y0="${f(y0)}"><g data-part="dom">${domS}</g>` +

  function t2a(m, o, t) {

  /* =================== ·10 glycan-timer — GN.s4_t2b =================== */

  /* =================== s4_t4b: ориентация сохраняется (ЭПР → носитель → плазматическая мембрана) =================== */
  const FX = [10, 210, 410], FW = 180, FY0 = 40, FY1 = 352, YM = 214;

  function frameBox(i, t, title) {

  function fER(t, o, inv) {

    if (k >= 2 && !inv && !o.hideGly) s += T(300, 24, t('s4_t4b_same'), { size: 12.5, w: 700, col: '#3E6A9A' });
    if (o.hideGly) s += F.tag(300, 24, t('s4_t4b_glyWait'), C.muted, { size: 11.5 });   /* шаг 4.4 до ответа: гликаны в кадрах 2–3 не нарисованы */
    if (inv && o.after) s += F.tag(300, 24, t('s4_t4b_inv_after'), C.ok, { size: 11.5 });

  /* =================== s4_t4c: три груза — адрес, положение, где работает (OC.b4) =================== */

  function panelC(t, o) {
    const cx = 500, cy = 182;
    let s = `<rect x="${PX[2] + 1}" y="110" width="${PW - 2}" height="140" fill="${C.cyto}"/>` + T(PX[2] + 10, 238, t('lbl_cytosol'), { a: 'l', size: 12, w: 700, col: '#8A7344', it: true });
    /* лизосома — компартмент в цитозоле; «кислая среда» — подпись её просвета (внутри) */
    s += G('lyso', F.closedMem(ellPts(cx, cy, 62, 40), C.lumen)) + T(cx, 122, t('s4_t4a_lysoC'), { size: 11.5, w: 600, col: C.muted });
    s += dots([[cx - 30, cy - 10], [cx - 8, cy - 4], [cx + 16, cy - 12], [cx + 34, cy - 4]], C.hydro, 4.4, o.names ? 'catd' : 'hydro') + T(cx, cy + 13, t('s4_t4c_acid'), { size: 11, w: 700, col: C.bad });
    return s;
  }
  GN.s4_t4c = { view(args, t) {
    const act = (args && args[0]) || 'A', o = Object.assign({}, (args && args[1]) || {});

/* =====================================================================
   s5_a0.js — общие помощники продвинутого уровня семинара 4 (03, вводная часть; 07, разд. 5) для исследований И1–И4.
   API (описание — tools_s2/решения_a12.md, разд. «API s5_a0.js»):
     advBase(K, P)        — блок «Новая опора» (P_new) над «Задачей» и заметка s2_adv_note под переключателями (03, вводная часть);
     advMore(P, card)     — блоки под показаниями для ocTab({ more }): «Правила модели» (P_rules), «Научное объяснение» (P_expl; заголовок — a_expl_t),
                            «Новые данные» (P_data[, P_data2]), «Как это установили» (P_how [+ карточка метода card: ключи card, card_items]),
                            «Чего модель не показывает» (P_limits); блок без текста не выводится;
     advWait(K)           — true, пока в шаге сценария на сцене K ответ не дан (07, 4.0: показания и таблицы исходов скрыты);
     advHalt(K)           — остановить идущую анимацию сцены K (смена шага; иначе мелькает кадр результата);
     advStep(K, key, pre, apply) — шаг сценария сцены K с метаданными документа (ocStep) и остановкой анимации перед pre;
                            ключ шага-ссылки 03 («Шаг 4 — обратная задача») переводится через OCALIAS;
     advSeg(id, label, pairs, v) — переключатель segHTML, pairs — [[значение, ключ подписи], …].
   В практикуме нет пометки «сверх программы», фамилий и годов (03, вводная часть).
   ===================================================================== */
function advBase(K, P){
  const tk = $('task' + K), paras = String(t(P + '_new')).split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');
  tk.insertAdjacentHTML('beforebegin', `<div class="panel aprob anew" id="new${K}"><b class="k">${t('a_base_t')}</b>${paras}</div>`);
  $('ctrl' + K).insertAdjacentHTML('beforeend', `<p class="small">${t('s4_adv_note')}</p>`);
}
function advMore(P, card){
  const has = k => k in TEXTS && TEXTS[k];
  const M = [['b_rules_t', P + '_rules'], ['a_expl_t', P + '_expl'], ['b_new_t', () => [P + '_data', P + '_data2'].filter(has).map(k => `<p>${t(k)}</p>`).join('')]];
  M.push(['b_how_t', () => (has(P + '_how') ? `<p>${t(P + '_how')}</p>` : '') + (card && has(card) ? `<p><b>${t(card)}</b></p>` + listHTML(t(card + '_items')) : '')]);
  M.push(['b_lim_t', P + '_limits']);
  return M;
}
const advWait = K => typeof POE !== 'undefined' && POE.on && cur === K && !POE.shown;
function advHalt(K){ if (typeof TLS !== 'undefined' && TLS[K]) TLS[K].halt(); }
function advStep(K, key, pre, apply){
  const k = (typeof OCALIAS !== 'undefined' && OCALIAS[key]) || key;
  return ocStep(k, { pre(S){ advHalt(K); S.after = null; if (pre) pre(S); }, apply(S){ S.after = null; if (apply) apply(S); } });
}
const advSeg = (id, label, pairs, v) => segHTML(id, label, pairs, v);

/* s5_b0.js — единый вид паспорта вкладки базового уровня (интеграция, решение С-12): одинаково на вкладках 1–4 и как на
   продвинутом уровне (s7_a*.js). Главная идея (02: tK_idea) — в блоке «Вывод»: ядро скрывает его в сценарии до ответа
   (главная идея вкладок прямо называет ответы шагов — AT-05); «Зачем это знать» (tK_why) и «Научная проблема» (tK_problem) —
   свёрнутый блок над «Задачей». Условия tK_cond — блок «Задача» (taskFrame). */
function baseIdea(K, P){

/* =====================================================================
   s6_t1.js — вкладка 1 базового уровня «Начальный адрес: сигнальная последовательность, SRP и транслокон Sec61»
   (02, вкладка 1; модель OC.b1 — 07, 3.1; конструктор — по OC.a1(srp=false) и OC.b1, 07, разд. 5; этапы — 12, Э1.1–Э1.6). Агент t1.
   Панель А — GN.s4_t1a: «две рибосомы» (шаг 1.1: альбумин и актин) и «начало цепи альбумина» (шаг 1.2);
   панель Б — GN.s4_t1b: груз × транслокон × сигнальная пептидаза (02, «Управляющие параметры») и конструктор деталей
   (SRP, рецептор SRP, Sec61, сигнальная пептидаза, сигнал; рибосома и мРНК закреплены — 02, «Конструктор»).
   Анимация (07, разд. 5): этапы Э1.1–Э1.6 с подписями 12 (texts_motion_t1.py); при убранной детали или закрытом транслоконе
   шкала останавливается на этапе остановки модели (12, «Остановки»: SRP / рецептор — после Э1.1; Sec61 закрыт — после Э1.4;
   Sec61 убран — после Э1.3, передача транслокону невозможна; без сигнальной пептидазы — Э1.6 не выполняется). Без сигнала
   (актин, сигнал убран) этапов нет: подписи 12 описывают путь с сигналом — схема статичная.
   До ответа (07, AT-05): показания скрыты (s9y_s4.js), исход не рисуется (o.wait), анимации нет (plan → null); после ответа —
   запуск этапов, конечный кадр = статичная схема (AT-04). Порядок шагов фиксирован (s9y_s4.js), варианты перемешиваются ядром.

   ===================================================================== */

  const modelB = S => ({ cargo: segVal('t1_cargo'), sec61: segVal('t1_sec61'), spase: segVal('t1_spase') === 'yes', parts: Object.assign({}, parts),

  const T = ocTab(K, { P: 't1',

    svg.querySelectorAll('[data-g]').forEach(e => { if (L.includes(e.dataset.g)) { e.classList.remove('clickable'); e.removeAttribute('data-g'); e.removeAttribute('tabindex'); } }); }
  const _si = showInfo;
  showInfo = function(key, g){ const L = key === K ? noInfoNow() : null;
    if (L && L.includes(g)) { const box = $('info' + key); box.hidden = false; box.innerHTML = `<b class="k">${t('info_t')}</b><p>${t('s4_info_after')}</p>`; return; }
    return _si.apply(this, arguments); };
  const _upd = T4.update;
  T4.update = function(){ if (!(typeof POE !== 'undefined' && POE.on)) T4.S.gly = false; _upd(); stripInfo(); };
  (function(){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments); stripInfo(); return r; }; })();
  /* кадр шкалы этапов перерисовывает схему — разметка справки снимается и в нём */
  if (T4.A && T4.A.tl) { const _r = T4.A.tl.redraw; if (_r) T4.A.tl.redraw = function(){ const x = _r.apply(this, arguments); stripInfo(); return x; }; }
})();

/* =====================================================================
   s7_a1.js — продвинутый уровень, исследование A1 «Почему вход в ЭПР определяет, какие изменения доступны белку дальше?»
   (03, A1; модель OC.a1 — 07, разд. 3.2; живая модель — 07, разд. 6). «Новая опора» (a1_new), условия (a1_cond), живая модель:
   три переключателя (сигнал, SRP и рецептор SRP, Sec61) × два груза на одной схеме (панели А и Б — GN.s4_a1, s4g_a12.js),
   шаги a1_s1…a1_s3 и обратная задача a1_inv (OC.a1_inverse), «Чего модель не показывает», «Новые данные» (свёрнуто), «К объяснению»
   → #early-decision. Карточки метода и режима «Эксперимент» нет (07, разд. 6). Анимация — один этап (12, Э-A1.1 / Э-A1.2).
   До ответа шага: состояние звеньев видно (условие шага), исход и показания закрыты (07, AT-05).
   ===================================================================== */
(function(){
  const K = '1a', P = 'a1';
  const bit = id => segVal(id) === '1';
  function model(S){
    return { sig: bit('a1_sig'), srp: bit('a1_srp'), sec: bit('a1_sec'), wait: advWait(K), after: S.after || null };
  }
  const args = (m, stg) => [m.sig ? 1 : 0, m.srp ? 1 : 0, m.sec ? 1 : 0,
    Object.assign({ wait: m.wait, cmp: m.after === 'cmp', inv: m.after === 'inv' ? { show: !m.wait } : null }, stg != null ? { stg } : {})];
  /* один этап: исход учебной модели (12, Э-A1.1 при входе, Э-A1.2 при выключенном звене); кадр 0 — до запуска (исход закрыт) */
  function plan(m){
    if (m.wait || m.after) return null;
    return { init: Object.assign({}, m, { stg: 0 }), keys: [m.sig && m.srp && m.sec ? 'a1_tl_1' : 'a1_tl_2'], stop: 1, stopKey: null, st: [Object.assign({}, m, { stg: 1 })] };
  }
  const place = (r, cargo) => r.place === 'er_lumen' ? t('s4_a1_p_lum') : r.place === 'er_membrane' ? t('s4_a1_p_mem') : t('s4_a1_p_cyt');
  const next = r => r.next_route === 'secretion' ? t('s4_a1_n_sec') : r.next_route === 'plasma_membrane' ? t('s4_a1_n_pm') : t('s4_v_dash');
  function reads(m){
    if (m.wait) return [];   /* до ответа исходы скрыты, в том числе в строке показаний под схемой (07, AT-05; T-UI-1) */
    if (m.after === 'inv') { const inv = OC.a1_inverse();
      return [[t('a1_rd_obs'), t('a1_rd_obs_v'), false]].concat([['signal', 's4_a1_inv_sig'], ['srp', 's4_a1_inv_srp'], ['sec61', 's4_a1_inv_sec']].map(([k, key]) => [t(key), t('a1_rd_inv', { v: yn(inv.others_enter[k]) }), inv.others_enter[k]])); }
    if (m.after === 'cmp') return [['sig', [false, true, true]], ['srp', [true, false, true]], ['sec', [true, true, false]]].map(([k, v]) => {
      const A = OC.a1(v[0], v[1], v[2], 'soluble'), B = OC.a1(v[0], v[1], v[2], 'membrane');
      return [t('s4_a1_c_' + k), t('a1_rd_cmp', { a: place(A), b: B.note ? t('a1_rd_note', { p: place(B) }) : place(B), g: yn(A.n_glycan || B.n_glycan), s: yn(A.disulfide || B.disulfide) }), false]; });
    const R = [];
    [['A', 'soluble'], ['B', 'membrane']].forEach(([p, cargo]) => {
      const r = OC.a1(m.sig, m.srp, m.sec, cargo), lab = k => t('s4_pan_' + p) + ' · ' + t(k);
      R.push([lab('s4_a1_place'), r.note ? t('a1_rd_note', { p: place(r) }) : place(r), r.entered], [lab('s4_a1_glyc'), yn(r.n_glycan), r.n_glycan],
        [lab('s4_a1_ss'), yn(r.disulfide), r.disulfide], [lab('s4_a1_next'), next(r), r.entered]);
    });
    return [R[0], R[4], R[1], R[2], R[3], R[5], R[6], R[7]];   /* строка под схемой (телефон): место А и место Б */
  }
  const seg2 = (id, key, v1, v0) => advSeg(id, key, [['1', v1], ['0', v0]], '1');
  const T = ocTab(K, { P,
    more: [['b_lim_t', P + '_limits'], ['b_new_t', () => String(t(P + '_new_data')).split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('')]],
    panels: {
      A: { ctrl: () => seg2('a1_sig', 'a1_c_sig', 'a1_v_sig1', 'a1_v_sig0') + seg2('a1_srp', 'a1_c_srp', 'a1_v_srp1', 'a1_v_srp0') + seg2('a1_sec', 'a1_c_sec', 'a1_v_sec1', 'a1_v_sec0'),
        wire(upd, S){ wire(['a1_sig', 'a1_srp', 'a1_sec'], () => { S.after = null; upd(); }); },   /* своё условие студента — выход из сравнения шага */
        model,
        draw: o => GN.s4_a1.view(args(o, o.stg), t), mask: () => '',
        plan,
        reads,
        cap: m => m.after === 'cmp' ? P + '_cap_cmp' : m.after === 'inv' ? P + '_cap_inv' : P + '_cap' },
    },
    poe: [
      advStep(K, P + '_s1', S => set(1, 1, 1), S => set(1, 1, 1)),
      /* шаг 2: до ответа — одно звено выключено (сигнал), исход закрыт; после — таблица трёх нарушений */
      advStep(K, P + '_s2', S => set(0, 1, 1), S => { set(0, 1, 1); S.after = 'cmp'; }),
      /* шаг 3: условие шага — «три разных нарушения дают одинаковые показания» (показаны в шаге 2), поэтому таблица видна до ответа */
      advStep(K, P + '_s3', S => { set(0, 1, 1); S.after = 'cmp'; }, S => { set(0, 1, 1); S.after = 'cmp'; }),
      advStep(K, P + '_inv', S => { set(1, 1, 1); S.after = 'inv'; }, S => { set(1, 1, 1); S.after = 'inv'; }),
    ] });
  function set(a, b, c){ segSet('a1_sig', String(a)); segSet('a1_srp', String(b)); segSet('a1_sec', String(c)); }
  advBase(K, P);
  /* под переключателями одна общая строка продвинутого уровня (03): строка базового уровня s4_ctrl_note не повторяется */
  [...$('ctrl' + K).querySelectorAll('p.small')].filter(p => p.textContent === t('s4_ctrl_note')).forEach(p => p.remove());
  /* «Вывод» — главная идея исследования (03, a1_idea); в сценарии до ответа скрыт ядром (poeRender) */
  { const tk = $('take' + K); tk.textContent = t(P + '_idea'); tk.parentElement.classList.remove('none'); }
  routeLinks({ [K]: 'early-decision' });
  T.pfx = P + '_s';
})();

/* =====================================================================
   s7_a2.js — продвинутый уровень, исследование A2 «Почему рост синтеза не обязательно увеличивает выход готового белка?»
   (03, A2; модель OC.a2 — 07, разд. 3.4, точные дроби; живая модель — 07, разд. 6). Бегунок «вход» 0–200 (шаг 10), переключатели
   «доля повторных попыток» {0,15; 0,45}, «доля дефектных» {0,05; 0,24}, «ёмкость» {120; 72}. Анимация по интервалам 1–4 (кадр = интервал,
   подписи — 12, Э-A2.k с числами OC.a2; конечный кадр = статика). Строка баланса в каждом кадре (GN.s4_a2, s4g_a12.js).
   Шаги a2_s1…a2_s4 и обратная задача a2_inv; шаг 3 — вход 150, 150, 100, 100 (switch_to_100); шаг 4 и обратная задача — сравнение
   условий на одной схеме. «Чего модель не показывает», «Новые данные» (свёрнуто), «К объяснению» → #flux-capacity.
   ===================================================================== */
(function(){
  const K = '2a', P = 'a2';
  const fq = v => S4F.num(v, 2);
  const cur = () => ({ I: +$('a2_I').value, q: +segVal('a2_q'), e: +segVal('a2_e'), C: +segVal('a2_C') });
  /* условия сравнения: шаг 4 (03, А2.4) и три клетки обратной задачи (03, a2_inv_q; 07, 3.4: inv_low_input, inv_low_capacity, inv_high_defect) */
  const CMP4 = () => [60, 150].map(i => ({ I: i, q: .45, e: .05, C: 120, lab: t('a2_g_in', { i }), par: t('s4_a2_cap') }));
  const CELLS = [{ I: 60, q: .15, e: .05, C: 120 }, { I: 100, q: .15, e: .05, C: 72 }, { I: 75, q: .15, e: .24, C: 120 }];
  const maxS = list => Math.max(0, ...list.map(c => OC.F.val(OC.a2(c.I, c.q, c.e, c.C).total.S_end)));
  function model(S){
    const c = cur(), wait = advWait(K), after = S.after || null;
    $('a2_IO').textContent = t('a2_c_I_v', { v: c.I });
    let a;
    if (after === 'cmp4') a = { cmp: CMP4(), head: t('s4_a2_c_qe', { q: fq(.45), e: fq(.05) }) };
    else if (after === 'inv') a = { cmp: CELLS.map((x, i) => Object.assign({}, x, { lab: t('a2_g_cell', { k: i + 1 }), labT: wait ? t('a2_g_cell', { k: i + 1 }) : t('s4_a2_cell' + (i + 1)), par: t('a2_g_par' + (i + 1)) })), show: ['out'] };
    else if (after === 'sw') a = { I: [150, 150, 100, 100], q: c.q, e: c.e, C: c.C };   /* 07, 3.4: switch_to_100 */
    else a = { I: c.I, q: c.q, e: c.e, C: c.C };
    /* шкалы: как в «Объяснениях» (0–160 и 0–300 у.е.); при больших значениях бегунка — 0–200 и 0–700 */
    const list = a.cmp || [a], maxI = Math.max(...list.map(x => Math.max(...[].concat(x.I))));
    a.cmax = maxI > 160 ? 200 : 160; a.qmax = maxS(list) > 300 ? 700 : 300;
    return { a, wait, after };
  }
  const args = (m, stg) => Object.assign({}, m.a, { wait: m.wait }, stg != null ? { stg } : {});
  /* этапы = интервалы 1–4 (12, Э-A2.k: «Интервал k: вошло I, вышли …, удалены …, не проверены к концу интервала …» — числа OC.a2);
     текст подписи с числами кладётся в таблицу текстов под ключом условия (шкала этапов берёт подпись по ключу) */
  function plan(m){
    if (m.wait || m.a.cmp) return null;
    const a = m.a, r = OC.a2(a.I, a.q, a.e, a.C), id = 'a2_tl_' + [].concat(a.I).join('_') + '_' + a.q + '_' + a.e + '_' + a.C;
    const keys = r.rows.map(x => { const k = id + '_' + x.k; TEXTS[k] = t('a2_tl_k', { k: x.k, i: OC.F.fmt(x.I), o: OC.F.fmt(x.out), r: OC.F.fmt(x.removed), h: OC.F.fmt(x.S_end) }); return k; });
    return { init: Object.assign({}, m, { stg: 0 }), keys, stop: 4, stopKey: null, stepKey: 'a2_tl_step', st: [1, 2, 3, 4].map(k => Object.assign({}, m, { stg: k })) };
  }
  const F = OC.F;
  function reads(m){
    if (m.wait) return [];   /* до ответа исходы скрыты, в том числе в строке под схемой (07, AT-05; T-UI-1) */
    if (m.a.cmp) return m.a.cmp.map(c => { const r = OC.a2(c.I, c.q, c.e, c.C).rows[3];
      return [c.labT || c.lab, t('a2_rd_g', { o: F.fmt(r.out), r: F.fmt(r.removed), d: F.fmt(F.sub(r.S_end, r.S_start)), q: F.fmt(r.S_end) }), F.val(r.S_end) === 0]; });
    const a = m.a, r = OC.a2(a.I, a.q, a.e, a.C).rows[3], d = F.sub(r.S_end, r.S_start);
    return [[t('a2_rd_out'), F.fmt(r.out), true], [t('a2_rd_q'), F.fmt(r.S_end), F.val(r.S_end) === 0], [t('a2_rd_in'), F.fmt(r.I), true],
      [t('a2_rd_rem'), F.fmt(r.removed), true], [t('a2_rd_d'), F.fmt(d), F.val(d) === 0],
      [t('a2_rd_bal'), t('a2_bal_s', { s: F.fmt(r.S_start), i: F.fmt(r.I), o: F.fmt(r.out), r: F.fmt(r.removed), h: F.fmt(r.S_end) }), true]];
  }
  const slider = () => `<div class="slider"><div class="row"><label for="a2_I">${t('a2_c_I')}</label><output id="a2_IO">${t('a2_c_I_v', { v: 60 })}</output></div>` +
    `<input type="range" id="a2_I" min="0" max="200" step="10" value="60" aria-label="${t('a2_c_I')}"></div>`;
  const T = ocTab(K, { P,
    more: [['b_lim_t', P + '_limits'], ['b_new_t', () => String(t(P + '_new_data')).split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('')]],
    panels: {
      A: { ctrl: () => slider() + advSeg('a2_q', 'a2_c_q', [['0.15', 'a2_v_q15'], ['0.45', 'a2_v_q45']], '0.15') +
          advSeg('a2_e', 'a2_c_e', [['0.05', 'a2_v_e05'], ['0.24', 'a2_v_e24']], '0.05') + advSeg('a2_C', 'a2_c_C', [['120', 'a2_v_C120'], ['72', 'a2_v_C72']], '120'),
        wire(upd, S){ wire(['a2_I', 'a2_q', 'a2_e', 'a2_C'], () => { S.after = null; upd(); }); },   /* своё условие студента — выход из сценария шага */
        model,
        draw: o => GN.s4_a2.view(args(o, o.stg), t), mask: () => '',
        plan,
        reads,
        cap: m => m.after === 'cmp4' ? P + '_cap_cmp' : m.after === 'inv' ? P + '_cap_inv' : P + '_cap' },
    },
    poe: [
      advStep(K, P + '_s1', S => set(60, .15, .05, 120), S => set(60, .15, .05, 120)),
      advStep(K, P + '_s2', S => set(150, .15, .05, 120), S => set(150, .15, .05, 120)),
      advStep(K, P + '_s3', S => { set(150, .15, .05, 120); S.after = 'sw'; }, S => { set(150, .15, .05, 120); S.after = 'sw'; }),
      advStep(K, P + '_s4', S => { set(150, .45, .05, 120); S.after = 'cmp4'; }, S => { set(150, .45, .05, 120); S.after = 'cmp4'; }),
      advStep(K, P + '_inv', S => { set(60, .15, .05, 120); S.after = 'inv'; }, S => { set(60, .15, .05, 120); S.after = 'inv'; }),
    ] });
  function set(I, q, e, C){ $('a2_I').value = I; segSet('a2_q', String(q)); segSet('a2_e', String(e)); segSet('a2_C', String(C)); }
  advBase(K, P);
  [...$('ctrl' + K).querySelectorAll('p.small')].filter(p => p.textContent === t('s4_ctrl_note')).forEach(p => p.remove());
  { const tk = $('take' + K); tk.textContent = t(P + '_idea'); tk.parentElement.classList.remove('none'); }
  routeLinks({ [K]: 'flux-capacity' });
  T.pfx = P + '_s';
})();

/* =====================================================================
   s7_a3.js — продвинутый уровень, исследование A3 «Метка необходима, но не достаточна» (03, A3; модель OC.a3, OC.a3_uptake —
   07, 3.6; живая модель — 07, разд. 6). Сцена GN.s4_a3 (s4g_a34.js) — та же, что в «Объяснениях» (·20 label-not-enough).
   Состав (как образец С2, s5_a3.js): «Новая опора» (a3_new), условия (a3_cond), переключатели «метка × рецептор × M6P-независимая
   гидролаза» и «наблюдение: распределение / добавить в среду гидролазу с меткой» (a3_uptake), анимация «сразу после синтеза →
   позднее» (12, Э-A3.1–Э-A3.2), шаги a3_s1…a3_s4, обратная задача a3_inv, «Чего модель не показывает» (a3_limits), «Новые данные»
   (a3_new_data, свёрнуто), «К объяснению» → #label-not-enough, вывод — главная идея (a3_idea).
   До ответа (02, разд. 0; AT-05): точка «позднее», индикатор M6P, результат захвата скрыты (o.wait); шаг А3.2 и обратная задача —
   две клетки рядом (нет метки | нет рецептора); обратная задача до ответа — наблюдение без причины и без M6P.
   ===================================================================== */
(function(){
  const K = '3a', P = 'a3';
  const YN = [['1', 's4_v_yes'], ['0', 's4_v_no']];
  const val = id => segVal(id) === '1';
  function model(S){
    const wait = advWait(K);
    if (S.after === 'cmp') return { kind: 'cmp', wait };
    if (S.after === 'inv') return { kind: wait ? 'inv' : 'cmp', wait: false };
    if (segVal('a3_obs') === 'up') return { kind: 'uptake', wait };
    return { kind: 'one', label: val('a3_lab'), rec: val('a3_rec'), ind: val('a3_ind'), wait };
  }
  const args = o => o.kind === 'one' ? [+o.label, +o.rec, +o.ind, { wait: o.wait, stg: o.stg }] : [o.kind, { wait: o.wait }];
  const draw = o => GN.s4_a3.view(args(o), t);
  const uv = n => t('a3_rd_val', { n: S4F.num(n) });
  function reads(o){
    if (o.kind === 'uptake') return o.wait ? [] : [[t('a3_rd_up_nolab'), t('s4_a3_capt'), OC.a3_uptake(true) === 'captured_to_lysosome'], [t('a3_rd_up_norec'), t('s4_a3_stay'), OC.a3_uptake(false) === 'captured_to_lysosome']];
    if (o.kind === 'cmp' || o.kind === 'inv') {
      const D = GN.s4_a3.data([o.kind, {}]), R = [];
      if (o.kind === 'inv') { const g = D.groups[0]; return [[t('a3_rd_el'), uv(g.endolys), g.endolys > 0], [t('a3_rd_med'), uv(g.medium), g.medium === 0]]; }
      const cn = g => t(!g.cell.label ? 's4_a3g_c_nolab' : 's4_a3g_c_norec');
      if (o.wait) return R;
      D.groups.forEach(g => R.push([t('a3_rd_two', { c: cn(g), k: t('s4_a3_m6p_med') }), t(g.m6p_on_secreted ? 's4_c_yes' : 's4_c_no'), g.m6p_on_secreted]));
      D.groups.forEach(g => R.push([t('a3_rd_two', { c: cn(g), k: t('s4_a3_medium') }), uv(g.medium), g.medium === 0]));
      return R;
    }
    const E = OC.a3(o.label, o.rec, o.ind, 'early'), L = OC.a3(o.label, o.rec, o.ind, 'late');
    const R = [[t('a3_rd_early'), uv(E.golgi), true]];
    if (o.wait) return R;
    return [[t('a3_rd_el'), uv(L.endolys), L.endolys > 0], [t('a3_rd_med'), uv(L.medium), L.medium < 50], [t('a3_rd_gol'), uv(L.golgi), L.golgi === 0], R[0],
      [t('s4_a3_m6p_med'), t(L.m6p_on_secreted ? 's4_c_yes' : 's4_c_no'), L.m6p_on_secreted]];
  }
  function cap(o){
    if (o.wait) return 'a3_cap_wait';
    if (o.kind === 'uptake') return 'a3_cap_up';
    if (o.kind === 'cmp') return 'a3_cap_cmp';
    if (o.kind === 'inv') return 'a3_cap_wait';
    if (o.ind) return 'a3_cap_ind';

   верная догадка без данных не засчитывается. causes — варианты объяснения; образец получает одну из них случайно,

/* Семинар 2: случаи «Найти причину» вкладок (02, разд. 6; 07, разд. 4.1–4.4) регистрируют сцены вкладок в CASE_REG
   (s0c_case_reg.js): CASE_REG[K] = { id, causes, meth: { измерение: { ctrl, <причина>: значение } } } — значения из моделей OC.*.
   Однозначность (caseMinimal) проверяет tests2/case2.mjs. Ситуации очного занятия не используются (06, разд. 5). */
const CASE_SPEC = CASE_REG;

function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;

    if (caseFits(spec, set, truth).length !== 1) continue;
    if (set.length < any.length) any = set;
    if (set.every(m => spec.meth[m][truth] !== spec.meth[m].ctrl) && (!best || set.length < best.length)) best = set;
  }
  return best || any;
}

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };

      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
