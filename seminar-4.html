    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;
    box.innerHTML = h;
    const keep = sel => { const e = $('case' + K).querySelector(sel); if (e && !e.disabled) e.focus({ preventScroll: true }); };   /* панель перестраивается: фокус не теряется */
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      const TR = S.truths || S.causes;
      if (!url.has('fixed') && TR.length > 1) do { seed = Math.floor(Math.random() * 9973); } while (TR[seed % TR.length] === CASE.truth);   /* семинар 8: при одной верной причине — тот же случай заново */
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur] || !SCENES[cur].caseShow; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

/* =====================================================================
   s9zz_p4.js — пакет 4 финальных правок 1 семестра (20.11.2026): единый экран практикума по образцу семинаров 3 и 7–10
   (промпт, разд. 5; ТЗ_пакет4_практикум.md; таблица «Пакет4_снятые_тексты_куда_перенесены.md»). Один и тот же файл в С4, С5, С6.
   Подключается последним из сцен (имя после s9z_*), когда все сцены уже построены:
   — базовый уровень: снимаются «Зачем это знать и научная проблема» (#ideaK), блок «Задача / Условия» (#taskK; условия —
     в первом экране сценария, ключ tK_cond), «Научное объяснение» (дублирует «Объяснение:» шагов сценария);
   — оба уровня: «Чего модель не показывает» — в окно «О модели» (текст переносится дословно из блока), строки статуса
     под переключателями (s4_ctrl_note, s4_adv_note, a_model_note) — одной строкой под схемой (ключи p4_status_b / p4_status_a);
   — вкладки без шкалы этапов (служебный ключ p4_cmp_tabs): строка cmp_note под схемой, пока шкала скрыта;
   — кнопка «Найти причину» — в строке вопроса (С5, С6: случай вкладки из caseLink → P4_CASE; С4: случай итоговой задачи
     на вкладке 4 — блок #finCase, показан только при вкладке 4, s7z_int.js);
   — окно «О модели» (patches/p4_model_dialog.md, п. 4 — дословно; modelInfo — здесь).
   Модели, исходы, показания и ключи сценариев не меняются. Русского текста здесь нет.
   ===================================================================== */
const P4 = (function(){
  const has = k => k in TEXTS && TEXTS[k] !== '';
  const base = K => /^\db$/.test(K);
  const LIM = {};
  const NOTES = ['s4_ctrl_note', 's4_adv_note', 'a_model_note'].filter(has).map(k => t(k).trim());
  const CMP = String(TEXTS.p4_cmp_tabs || '').split(/\s+/).filter(Boolean);
  const isSum = (d, keys) => { const s = d.querySelector(':scope > summary'); return !!s && keys.some(k => has(k) && s.textContent.trim() === t(k).trim()); };
  const cmpSync = K => { const e = $('cmp' + K); if (!e) return; const tl = $('tl' + K); e.hidden = !!tl && !tl.hidden; };
  Object.keys(SCENES).forEach(K => {
    const sc = $('sc' + K); if (!sc) return;
    const side = sc.querySelector('.side'), st = sc.querySelector('.stage'), ctrl = $('ctrl' + K);
    side.querySelectorAll('details').forEach(d => {
      if (isSum(d, ['b_lim_t'])) { LIM[K] = [...d.children].filter(x => x.tagName !== 'SUMMARY').map(x => x.outerHTML); d.remove(); }
      else if (isSum(d, base(K) ? ['b_pass_t', 'b_expl_t'] : ['b_obs_t'])) d.remove();
    });
    if (base(K)) ['idea', 'task'].forEach(p => { const e = $(p + K); if (e) e.remove(); });
    if (ctrl) ctrl.querySelectorAll('p.small').forEach(p => { if (NOTES.includes(p.textContent.trim())) p.remove(); });
    if (st) {
      const sk = base(K) ? 'p4_status_b' : 'p4_status_a';
      if (has(sk)) st.insertAdjacentHTML('beforeend', `<p class="stnote" id="stn${K}">${t(sk)}</p>`);
      if (CMP.includes(K) && has('cmp_note')) {
        st.insertAdjacentHTML('beforeend', `<p class="stnote cmpnote" id="cmp${K}" hidden>${t('cmp_note')}</p>`);
        const tl = $('tl' + K); if (tl) new MutationObserver(() => cmpSync(K)).observe(tl, { attributes: true, attributeFilter: ['hidden'] });
        cmpSync(K);
      }
    }
  });
  /* «Найти причину» — в строке вопроса */
  const CASES = window.P4_CASE || (window.P4_CASE = {});
  if (window.FIN4 && $('fin')) ['4b', '4a'].forEach(K => { CASES[K] = { go(){ const e = $('finCase') || $('fin'); if (!e) return;
    try { e.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (_) { e.scrollIntoView(); }
    e.setAttribute('tabindex', '-1'); setTimeout(() => { try { e.focus({ preventScroll: true }); } catch (_) {} }, 350); } }; });
  let cb = $('caseBtn');
  if (!cb) { $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`); cb = $('caseBtn'); }
  const cbOrig = cb.onclick;
  cb.onclick = e => { const c = CASES[cur]; if (c) return c.go(); if (cbOrig) return cbOrig.call(cb, e); };
  const caseSync = () => { const c = CASES[cur];
    if (c) { cb.hidden = false; if (c.title) cb.title = c.title; else cb.removeAttribute('title'); }
    else { if (!cbOrig) cb.hidden = true; cb.removeAttribute('title'); } };
  const _show = show; show = function(){ const r = _show.apply(this, arguments); caseSync(); Object.keys(SCENES).forEach(cmpSync); if (typeof fitStage === 'function') fitStage(); return r; };   /* кнопка в строке вопроса может перенести строку: место под схему пересчитывается */
  /* условия вкладки (tK_cond) — в первом экране сценария базового уровня, до ответа */
  const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments);
    if (POE.on && POE.i === 0 && base(cur)) { const k = 't' + qn + '_cond', box = $('poe' + cur);
      if (box && has(k) && !box.querySelector('.tcond')) { const h = box.querySelector('.k'); if (h) h.insertAdjacentHTML('afterend', `<p class="small pcond tcond"><b>${t('b_cond_t')}</b> ${t(k)}</p>`); } }
    return r; };
  /* окно «О модели»: статус и «Чего модель не показывает» текущей вкладки и уровня; правил и методов в практикуме С4–С6 нет */
  function modelInfo(){
    return { status: [t(base(cur) ? 'lg_model' : (has('a_model_note') ? 'a_model_note' : 's4_adv_note'))], rules: [], limits: LIM[cur] || [], how: [] };
  }
  function renderModelDlg() {
    const I = modelInfo() || {}, sec = (h, a) => (a && a.length) ? `<h4>${h}</h4>` + a.map(x => /^\s*<(ul|ol|p|div)/.test(x) ? x : `<p>${x}</p>`).join('') : '';
    $('modelBody').innerHTML = (I.status || []).map(x => `<p class="model-status">${x}</p>`).join('') +
      sec(TEXTS.model_rules, I.rules) + sec(TEXTS.model_limits, I.limits) + sec(TEXTS.model_how, I.how);
  }
  $('modelBtn').onclick = () => { renderModelDlg(); try { $('modelDlg').showModal(); } catch(e){ $('modelDlg').setAttribute('open', ''); } $('modelDlg').scrollTop = 0; };   /* окно открывается с начала */
  $('modelClose').onclick = () => { try { $('modelDlg').close(); } catch(e){ $('modelDlg').removeAttribute('open'); } };
  return { LIM, modelInfo, caseSync, cmpSync };
})();
