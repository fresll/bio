одель 1", "amode_note": "Переключатели показывают предсказания учебной модели, а не доказательство.", "b_pre_t": "Перед задачей", "b_expl_t": "Научное объяснение", "b_pass_t": "Зачем это знать и научная проблема", "b_why_t": "Зачем это знать", "b_prob_t": "Научная проблема", "t1_title": "Начальный адрес: сигнальная последовательность, SRP и транслокон Sec61", "t1_idea": "Рибосомы в цитозоле и на мембране ЭПР одинаковы. Куда пойдёт белок, определяет участок его собственной цепи — сигнальная последовательность — и три звена, которые её используют: SRP, рецептор SRP и транслокон Sec61", "t1_why": "Почти все белки, которые клетка выделяет (гормоны, ферменты, антитела, белки плазмы крови), и все трансмембранные белки плазматической мембраны начинают путь здесь. Если белок не вошёл в ЭПР, все последующие этапы — сворачивание с помощью шаперонов ЭПР, гликозилирование, сортировка — для него недоступны", "t1_problem": "Как клетка направляет к мембране ЭПР именно те рибосомы, которые синтезируют секретируемые и мембранные белки, если сами рибосомы одинаковы?", "t1_cond": "Клетка печени человека. Наблюдаем во время синтеза и через несколько минут после него. Белки: альбумин — белок плазмы крови, который клетка печени секретирует; актин — белок цитоскелета, который работает в цитозоле; конструкция «актин с присоединённой сигнальной последовательностью альбумина»", "t1_s1_title": "Одна рибосома — два белка", "t1_s1_cond": "Рибосомы клетки печени начинают синтез двух белков: альбумина и актина. На схеме обе рибосомы находятся в цитозоле, цепи ещё короткие", "t1_s1_q": "Где окажутся эти белки после синтеза?", "t1_s1_o1": "Альбумин — в просвете ЭПР, актин — в цитозоле", "t1_s1_x1": "Да. Различие задано в начале цепи альбумина: там есть сигнальная последовательность ЭПР", "t1_s1_o2": "Оба белка — в цитозоле: рибосомы находятся в цитозоле", "t1_s1_x2": "Начало синтеза в цитозоле одинаково для обоих белков; рибосома, синтезирующая альбумин, во время синтеза прикрепляется к мембране ЭПР", "t1_s1_o3": "Оба белка — в просвете ЭПР: белки синтезируются на одинаковых рибосомах", "t1_s1_x3": "Одинаковые рибосомы не означают одинаковый путь: адрес задаёт цепь, а не рибосома", "t1_s1_h1": "Вспомните, что различается у двух белков, если рибосомы одинаковы", "t1_s1_h2": "Посмотрите на начало цепи (N-конец)", "t1_s1_h3": "Начало цепи альбумина гидрофобно и узнаётся в цитозоле как адрес ЭПР", "t1_s1_e": "Адрес записан в самой цепи. Сигнальная последовательность выходит из рибосомы первой, поэтому путь белка определяется в начале синтеза", "t1_s2_title": "Что делает начало цепи адресом", "t1_s2_cond": "На схеме увеличено начало цепи альбумина. Закрашены неполярные (гидрофобные) аминокислоты", "t1_s2_q": "Какое свойство этого участка важно для его узнавания?", "t1_s2_o1": "Центральный участок из восьми и более гидрофобных аминокислот", "t1_s2_x1": "Да: сигналы разных белков различаются по последовательности, но у всех есть гидрофобный центр", "t1_s2_o2": "Точный порядок аминокислот, одинаковый у всех белков ЭПР", "t1_s2_x2": "Порядок у разных белков разный; сигналы с одним назначением часто взаимозаменяемы", "t1_s2_o3": "Положительный заряд всего участка", "t1_s2_x3": "Группа положительно заряженных аминокислот — признак сигнала ядерной локализации, а не сигнала ЭПР", "t1_s2_h1": "Сравните закрашенные кружки с остальными", "t1_s2_h2": "Вспомните, какие участки белка «прячутся» от воды", "t1_s2_h3": "Карман SRP, который связывает сигнал, гидрофобный", "t1_s2_e": "Узнавание основано на физическом свойстве участка — гидрофобности, — а не на точной последовательности", "t1_s3_title": "Достаточно ли сигнала? (конструктор)", "t1_s3_cond": "К началу цепи актина присоединили сигнальную последовательность альбумина. Остальная цепь актина не изменилась", "t1_s3_q": "Где окажется такой белок?", "t1_s3_o1": "В просвете ЭПР", "t1_s3_x1": "Да: сигнал ЭПР достаточен, чтобы направить в ЭПР белок, который в норме работает в цитозоле", "t1_s3_o2": "В цитозоле: актин — цитозольный белок", "t1_s3_x2": "Путь определяет сигнал в начале цепи; остальная цепь его не отменяет", "t1_s3_o3": "В ядре: присоединённый участок нарушит сворачивание", "t1_s3_x3": "Сигнал ЭПР не содержит сигнала ядерной локализации; он направляет цепь в ЭПР", "t1_s3_h1": "Чем начало новой цепи отличается от начала обычного актина?", "t1_s3_h2": "Что узнаёт SRP — весь белок или начало цепи?", "t1_s3_h3": "SRP узнаёт сигнал независимо от того, какая цепь идёт за ним", "t1_s3_e": "Сигнал необходим (без него альбумин остался бы в цитозоле) и достаточен (с ним в ЭПР попадает даже актин)", "t1_s4_title": "Что происходит с синтезом, когда SRP связала сигнал", "t1_s4_cond": "SRP связалась с сигнальной последовательностью альбумина, вышедшей из рибосомы. Рибосома ещё в цитозоле", "t1_s4_q": "Как изменится синтез альбумина до встречи рибосомы с мембраной ЭПР?", "t1_s4_o1": "Замедлится до передачи рибосомы транслокону", "t1_s4_x1": "Да: SRP занимает на рибосоме место связывания факторов удлинения цепи; предполагается, что замедление оставляет время для передачи рибосомы на мембрану, пока цепь не закончена", "t1_s4_o2": "Остановится полностью и больше не возобновится", "t1_s4_x2": "Синтез замедляется и продолжается с обычной скоростью после передачи рибосомы транслокону", "t1_s4_o3": "Ускорится: SRP поставляет энергию для синтеза", "t1_s4_x3": "SRP не поставляет энергию для синтеза; её ГТФ-связывающий участок делает цикл направленным", "t1_s4_h1": "Вспомните, к какому месту рибосомы присоединяется второй конец SRP", "t1_s4_h2": "Что произойдёт, если цепь будет закончена в цитозоле?", "t1_s4_h3": "Предполагается, что замедление оставляет время дойти до мембраны, пока цепь не закончена", "t1_s4_e": "SRP соединяет узнавание сигнала с замедлением синтеза; рецептор SRP связывает комплекс на мембране; транслокон принимает цепь; SRP и рецептор возвращаются", "t1_s5_title": "Транслокон заблокирован (конструктор)", "t1_s5_cond": "В клетке все звенья работают, кроме транслокона Sec61: его канал не открывается. Наблюдаем альбумин после окончания синтеза", "t1_s5_q": "Где будет альбумин и что будет с его сигнальной последовательностью?", "t1_s5_o1": "В цитозоле; сигнальная последовательность сохранится", "t1_s5_x1": "Да: цепь не прошла в просвет, а сигнальная пептидаза работает со стороны просвета", "t1_s5_o2": "В просвете ЭПР без сигнальной последовательности", "t1_s5_x2": "Чтобы оказаться в просвете, цепь должна пройти через канал транслокона", "t1_s5_o3": "В просвете ЭПР с сохранённой сигнальной последовательностью", "t1_s5_x3": "Сохранение сигнала в просвете возможно при отсутствии сигнальной пептидазы (шаг 1.6), а не при закрытом транслоконе", "t1_s5_h1": "Через что цепь проходит в просвет?", "t1_s5_h2": "Где находится активный центр сигнальной пептидазы?", "t1_s5_h3": "Если цепь не прошла мембрану, отщеплять сигнал некому", "t1_s5_e": "Узнавание сигнала и доставка к мембране ещё не означают перенос: транслокон — отдельное звено", "t1_s6_title": "Сигнальной пептидазы нет (конструктор)", "t1_s6_cond": "Транслокон работает, а сигнальной пептидазы в клетке нет. Наблюдаем альбумин после окончания синтеза", "t1_s6_q": "Что ожидается в этой модели?", "t1_s6_o1": "Белок в просвете, но прикреплён к мембране несрезанным сигналом", "t1_s6_x1": "Да: перенос и отщепление сигнала — разные звенья", "t1_s6_o2": "Белок останется в цитозоле: он не пройдёт через транслокон", "t1_s6_x2": "Перенос через транслокон не зависит от сигнальной пептидазы", "t1_s6_o3": "Белок будет перенесён и свободно растворён в просвете, как обычно", "t1_s6_x3": "Без отщепления гидрофобный сигнал остаётся в бислое", "t1_s6_h1": "Что делает сигнальная пептидаза?", "t1_s6_h2": "Куда уходит сигнал из латеральных ворот транслокона?", "t1_s6_h3": "Сигнал уходит в бислой и в норме там отщепляется", "t1_s6_e": "Каждое звено проверяется отдельно: вход цепи в ЭПР и отщепление сигнала — разные события", "t1_inv_cond": "Белки этой клетки переносятся в ЭПР только во время синтеза. В ЭПР обнаружен белок, на котором сохранилась сигнальная последовательность. Остальные секретируемые белки этой клетки обрабатываются нормально", "t1_inv_q": "Какое звено, вероятнее всего, не сработало для этого белка?", "t1_inv_o1": "Отщепление сигнала сигнальной пептидазой", "t1_inv_x1": "Да: белок вошёл в ЭПР, значит, в рамках модели SRP, рецептор SRP и транслокон сработали", "t1_inv_o2": "Узнавание сигнала частицей SRP в цитозоле", "t1_inv_x2": "Без узнавания белок не попал бы в ЭПР", "t1_inv_o3": "Открытие канала транслокона Sec61", "t1_inv_x3": "Белок прошёл в ЭПР, значит, транслокон открывался", "t1_inv_e": "Наблюдение «белок в ЭПР» исключает звенья до переноса. Обычная обработка других белков говорит против общей поломки сигнальной пептидазы; возможно, изменён участок цепи рядом с местом отщепления этого белка. Чтобы различить эти варианты, нужно прочитать последовательность сигнала", "t1_limits": "Модель не показывает перенос белков в ЭПР после окончания синтеза и встраивание белков с якорем у C-конца — такие пути существуют (страница «Объяснения»). Не показано, как рибосома синтезирует цепь (<a href=\"seminar-10-route.html#elongation-cycle\" target=\"_blank\" rel=\"noopener\">семинар 10</a>), и что происходит с белком, оставшимся в цитозоле. Число рибосом и длина цепи условные", "t2_title": "Созревание и контроль качества в ЭПР", "t2_idea": "Войти в ЭПР ещё не значит быть готовым к выходу. Белок выходит из ЭПР, только если он свёрнут, а комплекс — только если собран. Несвернувшийся белок задерживается и получает повторные попытки; белок, который так и не свернулся, удаляется", "t2_why": "Контроль качества избирателен: он задерживает и удаляет не все молекулы, а несвернувшиеся. Поэтому белок может синтезироваться, войти в ЭПР — и всё равно не дойти до места работы", "t2_problem": "По какому признаку в ЭПР различаются белок, готовый к выходу, ещё не свернувшийся белок и окончательно дефектный?", "t2_cond": "Клетка человека в культуре. Наблюдаем дважды: вскоре после синтеза (ранняя точка) и через время, за которое нормальный белок успевает покинуть ЭПР (поздняя точка). Белки: А — растворимый секретируемый белок; Б — рецептор из двух субъединиц α и β, обе синтезируются; В — тот же рецептор, но субъединица β в клетке не синтезируется; Г — вариант белка А с заменой одной аминокислоты, который сворачивается медленно", "t2_s1_title": "Вошёл — значит готов?", "t2_s1_cond": "Ранняя точка. Все четыре белка (А, Б, В, Г) только что вошли в просвет ЭПР", "t2_s1_q": "Чем различаются четыре белка в этот момент по показаниям схемы?", "t2_s1_o1": "Почти ничем: все в просвете, с гликаном и с шаперонами", "t2_s1_x1": "Да: в ранней точке вход в ЭПР одинаков; различия проявляются позже", "t2_s1_o2": "Белок Г уже удалён, а остальные три вышли из ЭПР", "t2_s1_x2": "За время ранней точки нормальные белки ещё не успели свернуться и выйти, а удаление начинается после повторных попыток", "t2_s1_o3": "Белки В и Г не получили N-гликан, остальные получили", "t2_s1_x3": "N-гликан присоединяется при входе в ЭПР независимо от того, свернётся ли белок", "t2_s1_h1": "Что происходит с каждой цепью сразу после входа?", "t2_s1_h2": "Зависит ли присоединение олигосахарида от будущего сворачивания?", "t2_s1_h3": "Различия между белками — в том, свернутся ли они и соберутся ли", "t2_s1_e": "Наличие гликана показывает, что белок вошёл в ЭПР, но не показывает, что он готов к выходу", "t2_s2_title": "Повторная попытка", "t2_s2_cond": "Белок Г связан с калнексином. Фермент отщепил последнюю глюкозу с его гликана, но белок ещё не свернулся", "t2_s2_q": "Что произойдёт с белком дальше?", "t2_s2_o1": "Глюкоза будет присоединена вновь, и белок снова свяжется с калнексином", "t2_s2_x1": "Да: несвернувшийся белок получает повторную попытку", "t2_s2_o2": "Белок выйдет из ЭПР, потому что глюкозы на гликане больше нет", "t2_s2_x2": "Выходит только свёрнутый белок; фермент возвращает глюкозу несвёрнутому", "t2_s2_o3": "Белок сразу уйдёт в цитозоль на удаление", "t2_s2_x3": "Удаление начинается после многих попыток, когда укорачиваются маннозные ветви гликана", "t2_s2_h1": "Что означает одна глюкоза на гликане?", "t2_s2_h2": "Какой фермент присоединяет глюкозу только к несвёрнутому белку?", "t2_s2_h3": "Глюкоза возвращается только несвёрнутым белкам", "t2_s2_e": "Гликан служит меткой состояния: по нему белок либо отпускается, либо возвращается к калнексину", "t2_s3_title": "Нет партнёрной субъединицы", "t2_s3_cond": "Случай В. Субъединица α свернулась правильно, но субъединица β в клетке не синтезируется. Поздняя точка", "t2_s3_q": "Где будет субъединица α?", "t2_s3_o1": "В ЭПР, связанной с шаперонами; со временем — удалена", "t2_s3_x1": "Да: выходят только собранные комплексы", "t2_s3_o2": "На поверхности клетки, без партнёрной субъединицы", "t2_s3_x2": "Несобранная субъединица задерживается шаперонами ЭПР и до поверхности не доходит", "t2_s3_o3": "В аппарате Гольджи, где к ней присоединится β", "t2_s3_x3": "Сборка комплекса — условие выхода из ЭПР, она проходит в ЭПР", "t2_s3_h1": "Какое условие выхода выполнено, а какое нет?", "t2_s3_h2": "Свёрнута ли α? Собран ли комплекс?", "t2_s3_h3": "Для комплексов условие выхода — сборка", "t2_s3_e": "Правильно свёрнутая, но несобранная субъединица задерживается. Например, у рецептора T-лимфоцитов и у ацетилхолинового рецептора так разрушается большая часть вновь синтезированных субъединиц", "t2_s4_title": "Медленно сворачивающийся вариант", "t2_s4_cond": "Случай Г. Вариант белка А с заменой одной аминокислоты сворачивается медленнее. Поздняя точка", "t2_s4_q": "Какой исход ожидается в модели?", "t2_s4_o1": "Часть молекул свернётся и выйдет, часть будет удалена", "t2_s4_x1": "Да: контроль качества избирателен — он работает с каждой молекулой отдельно", "t2_s4_o2": "Все молекулы будут удалены", "t2_s4_x2": "Вариант сворачивается медленнее, но часть молекул успевает свернуться за отведённое время", "t2_s4_o3": "Все молекулы выйдут: замена одной аминокислоты незначительна", "t2_s4_x3": "Медленное сворачивание продлевает пребывание в цикле проверки; часть молекул не успевает свернуться", "t2_s4_h1": "Касается ли контроль качества всей популяции молекул сразу?", "t2_s4_h2": "Что происходит с гликаном, пока белок остаётся несвёрнутым?", "t2_s4_h3": "Чем медленнее сворачивание, тем большая доля молекул попадает на удаление", "t2_s4_e": "Удаление — не уничтожение всех новых молекул, а отбор несвернувшихся", "t2_s5_title": "Белок ЭПР ускользнул", "t2_s5_cond": "Шаперон BiP — собственный белок ЭПР с сигналом KDEL на C-конце. Одна молекула BiP попала в носитель с COP-II и оказалась в аппарате Гольджи", "t2_s5_q": "Что произойдёт с этой молекулой BiP?", "t2_s5_o1": "KDEL-рецептор свяжет её и вернёт в ЭПР в носителе с COP-I", "t2_s5_x1": "Да: возврат по KDEL сохраняет белки ЭПР в ЭПР", "t2_s5_o2": "Она будет секретирована: из аппарата Гольджи обратного пути нет", "t2_s5_x2": "Обратный путь есть: носители с COP-I возвращают белки в ЭПР", "t2_s5_o3": "Она будет удалена как дефектный белок", "t2_s5_x3": "BiP свёрнут правильно; он не дефектный, а ускользнувший", "t2_s5_h1": "Что означает сигнал KDEL?", "t2_s5_h2": "Какая оболочка у носителей обратного направления?", "t2_s5_h3": "KDEL-рецептор связывает белок в аппарате Гольджи и отпускает в ЭПР", "t2_s5_e": "Возврат по сигналу KDEL — часть порядка в ЭПР: ускользнувшие белки ЭПР возвращаются, а не теряются", "t2_inv_cond": "Через час после синтеза субъединица α рецептора обнаружена в ЭПР, связанной с калнексином. Субъединицы β в клетке нет", "t2_inv_q": "Какой вывод допустим?", "t2_inv_o1": "Задержку объясняет отсутствие β; свёрнута ли α, неизвестно", "t2_inv_x1": "Да: несобранная субъединица задерживается даже свёрнутой", "t2_inv_o2": "Субъединица α неправильно свёрнута и потому задержана", "t2_inv_x2": "Это возможно, но данные этого не доказывают: отсутствие партнёра уже объясняет задержку", "t2_inv_o3": "В клетке не работает сигнальная последовательность α", "t2_inv_x3": "α находится в ЭПР, значит, вход сработал", "t2_inv_e": "Чтобы проверить, свёрнута ли сама α, нужно другое наблюдение: например, выйдет ли α из ЭПР, если в клетке появится β", "t2_limits": "Модель не показывает ответ клетки на перегрузку ЭПР, слипание задержанных белков и работу протеасомы (<a href=\"seminar-5-route.html#proteasome-26s\" target=\"_blank\" rel=\"noopener\">семинар 5</a>). Доли выхода и удаления условные; время наблюдения задано двумя точками", "t3_title": "Метка маннозо-6-фосфат и доставка лизосомной гидролазы", "t3_idea": "Лизосомная гидролаза проходит ЭПР и аппарат Гольджи вместе с секретируемыми белками. От них её отличает метка — маннозо-6-фосфат (M6P) на гликане. Метку узнаёт рецептор M6P в транс-сети; в кислой эндосоме рецептор отпускает гидролазу и возвращается за новой", "t3_why": "Без доставки гидролаз лизосома не может расщеплять макромолекулы. Путь гидролазы показывает общий принцип: адрес — это пара «метка + рецептор» и условия, при которых рецептор связывает и отпускает груз", "t3_problem": "Как гидролаза отделяется от множества секретируемых белков, идущих тем же путём, и почему один рецептор переносит много молекул?", "t3_cond": "Фибробласт человека в культуре. Груз А — гидролаза катепсин D (расщепляет белки в лизосоме). Груз Б — те молекулы катепсина D, которые прошли транс-сеть, не связавшись с рецептором. Груз В — мембранный белок лизосомы. Наблюдаем путь от цис-сети аппарата Гольджи до лизосомы", "t3_s1_title": "Почему метку получает гидролаза, а не секретируемый белок рядом", "t3_s1_cond": "В цис-сети аппарата Гольджи находятся катепсин D и секретируемый гликопротеин. N-гликаны у них одинакового строения", "t3_s1_q": "Почему фермент метки ставит M6P только на катепсин D?", "t3_s1_o1": "Фермент узнаёт участок на поверхности белковой части гидролазы", "t3_s1_x1": "Да: гликаны одинаковы, различается белок", "t3_s1_o2": "У катепсина D особый гликан, полученный в ЭПР", "t3_s1_x2": "В ЭПР все белки получают одинаковый олигосахарид", "t3_s1_o3": "Метку получают все гликопротеины, но секретируемый белок её теряет", "t3_s1_x3": "Метку ставят только на белки, которые фермент узнаёт по белковой поверхности", "t3_s1_h1": "Если гликаны одинаковы, где искать различие?", "t3_s1_h2": "Фермент метки имеет два участка: один связывает гликан, другой — белок", "t3_s1_h3": "Узнавание идёт по белковому участку гидролазы", "t3_s1_e": "Метку ставит фермент, узнающий белок, а несёт её гликан. M6P — фосфорилированный сахар, а не фосфорилированная аминокислота", "t3_s2_title": "Где рецептор связывает и где отпускает", "t3_s2_cond": "Рецептор M6P находится в мембране транс-сети. В транс-сети pH около 6,5–6,7, в эндосоме — около 6", "t3_s2_q": "Где рецептор свяжет катепсин D и где отпустит?", "t3_s2_o1": "Свяжет в транс-сети, отпустит в эндосоме", "t3_s2_x1": "Да: в более кислой среде эндосомы рецептор отделяется от M6P", "t3_s2_o2": "Свяжет в эндосоме, отпустит в лизосоме", "t3_s2_x2": "В эндосому гидролаза приходит уже связанной; рецептор M6P в лизосому не переходит", "t3_s2_o3": "Свяжет в цис-сети, отпустит в транс-сети", "t3_s2_x3": "В цис-сети метка только ставится; связывание с рецептором и упаковка — в транс-сети", "t3_s2_h1": "Сравните pH двух компартментов", "t3_s2_h2": "Рецептор переносит гидролазу из одного компартмента в другой", "t3_s2_h3": "Связывание — при менее кислом pH, отделение — при более кислом", "t3_s2_e": "Связывание и отделение задаются pH: каждый компартмент имеет свою среду, и от неё зависит прочность связи рецептора с меткой", "t3_s3_title": "Что делает рецептор после отделения гидролазы", "t3_s3_cond": "Рецептор отпустил катепсин D в эндосоме", "t3_s3_q": "Что произойдёт с рецептором?", "t3_s3_o1": "Вернётся в транс-сеть и свяжет новую гидролазу", "t3_s3_x1": "Да: один рецептор переносит много молекул за много циклов", "t3_s3_o2": "Перейдёт вместе с гидролазой в лизосому и разрушится", "t3_s3_x2": "Рецептор возвращается; если бы он разрушался, на каждую гидролазу нужен был бы новый рецептор", "t3_s3_o3": "Уйдёт на поверхность клетки и останется там", "t3_s3_x3": "Часть рецепторов бывает на поверхности, но основной путь — возврат в транс-сеть", "t3_s3_h1": "Вспомните рециркуляцию рецепторов в семинаре 3", "t3_s3_h2": "Хватило бы клетке рецепторов, если бы каждый работал один раз?", "t3_s3_h3": "Возврат рецептора — условие повторного использования", "t3_s3_e": "Метка, рецептор, кислая среда эндосомы и возврат рецептора — четыре разных условия одного пути", "t3_s4_title": "Молекулы, прошедшие мимо рецепторов (груз Б)", "t3_s4_cond": "Часть молекул катепсина D с меткой прошла транс-сеть, не связавшись с рецептором", "t3_s4_q": "Где окажутся эти молекулы?", "t3_s4_o1": "Выйдут в среду; часть вернут рецепторы M6P на поверхности", "t3_s4_x1": "Да: на плазматической мембране тоже есть рецепторы M6P", "t3_s4_o2": "Останутся в транс-сети до появления свободных рецепторов", "t3_s4_x2": "Белок, не отобранный в другие направления, уходит конститутивным путём", "t3_s4_o3": "Будут расщеплены в среде вокруг клетки и повредят соседние клетки", "t3_s4_x3": "Во внеклеточной среде pH около 7,4, и гидролазы, работающие в кислой среде, там малоактивны", "t3_s4_h1": "Куда уходят белки из транс-сети, если их ничто не отобрало?", "t3_s4_h2": "Где ещё в клетке есть рецепторы M6P?", "t3_s4_h3": "Рецептор-опосредованный эндоцитоз возвращает гидролазу в эндосомы", "t3_s4_e": "Обходной путь через поверхность возвращает часть ушедших гидролаз", "t3_s5_title": "Мембранный белок лизосомы (груз В)", "t3_s5_cond": "Мембранный белок лизосомы проходит ЭПР и аппарат Гольджи. Метки M6P у него нет", "t3_s5_q": "Как он попадает в лизосому?", "t3_s5_o1": "По сигналу в цитозольной части белка", "t3_s5_x1": "Да: мембранным белкам лизосом M6P не нужна", "t3_s5_o2": "Никак: без M6P белки в лизосому не попадают", "t3_s5_x2": "M6P нужна растворимым гидролазам, а не всем белкам лизосомы", "t3_s5_o3": "Его втягивает в лизосому гидролаза с меткой", "t3_s5_x3": "Белки лизосомы доставляются независимо друг от друга", "t3_s5_h1": "Нужна ли метка M6P белку, который сам встроен в мембрану носителя?", "t3_s5_h2": "Какая часть мембранного белка обращена в цитозоль?", "t3_s5_h3": "Сигнал — в цитозольном хвосте", "t3_s5_e": "Путь к лизосоме не один: растворимые гидролазы — с M6P, мембранные белки — по сигналам в цитозольной части", "t3_inv_cond": "Катепсин D с меткой M6P обнаружен в эндосомах всё ещё связанным с рецептором M6P. В транс-сети свободных рецепторов становится всё меньше", "t3_inv_q": "Какое условие пути, вероятнее всего, нарушено?", "t3_inv_o1": "Закисление эндосомы", "t3_inv_x1": "Да: отделение зависит от кислой среды эндосомы", "t3_inv_o2": "Постановка метки", "t3_inv_x2": "Метка есть: гидролаза связана с рецептором именно через M6P", "t3_inv_o3": "Связывание рецептора с меткой в транс-сети", "t3_inv_x3": "Связывание произошло: гидролаза пришла в эндосому вместе с рецептором", "t3_inv_e": "Модель предсказывает и следствие: рецепторы, не отпустившие гидролазу, не возвращаются свободными, и новые молекулы катепсина D всё больше уходят в среду. Это предсказание модели, а не наблюдение данной задачи", "t3_limits": "Модель не показывает активацию гидролазы в лизосоме, пути доставки гидролаз без M6P в некоторых типах клеток и защиту лизосомы от собственных ферментов (<a href=\"seminar-5-route.html#double-protection\" target=\"_blank\" rel=\"noopener\">семинар 5</a>). Значения pH — приблизительные; доля молекул, проходящих мимо рецепторов, условная", "t4_title": "Транс-сеть аппарата Гольджи: три направления груза", "t4_idea": "Из транс-сети груз уходит в трёх направлениях: к эндосомам (по метке и рецептору), в секреторные гранулы (по способности собираться в скопления) и к плазматической мембране (без особого сигнала). Адрес, положение относительно мембраны и место работы белка — три разные характеристики", "t4_why": "Белок может быть доставлен по адресу и всё равно не работать — если неверна его ориентация в мембране или он не созрел. Чтобы найти причину, нужно различать эти характеристики", "t4_problem": "По каким признакам транс-сеть распределяет груз и почему мембранный белок оказывается на поверхности в той же ориентации, в какой встроился в ЭПР?", "t4_cond": "Фибробласт человека в культуре — неполяризованная клетка. Три груза одновременно: фибронектин (растворимый белок; после секреции встраивается во внеклеточный матрикс), рецептор липопротеинов низкой плотности (рецептор ЛПНП — мембранный белок плазматической мембраны; его N-концевой участок связывает частицы ЛПНП, C-концевой хвост — в цитозоле), катепсин D (лизосомная гидролаза). Наблюдаем путь от транс-сети до конечного адреса", "t4_s1_title": "Куда пойдёт каждый груз", "t4_s1_cond": "Три груза находятся в транс-сети одного фибробласта", "t4_s1_q": "Как распределятся фибронектин, рецептор ЛПНП и катепсин D?", "t4_s1_o1": "Фибронектин и рецептор ЛПНП — к поверхности, катепсин D — к эндосомам", "t4_s1_x1": "Да: катепсин D отбирает рецептор M6P, остальные уходят к поверхности", "t4_s1_o2": "Все три груза — к плазматической мембране клетки", "t4_s1_x2": "Катепсин D несёт M6P и отбирается рецептором к эндосомам", "t4_s1_o3": "Фибронектин — в гранулы, рецептор — к поверхности, катепсин D — к эндосомам", "t4_s1_x3": "Фибробласт секретирует фибронектин непрерывно; гранулы регулируемой секреции есть у специализированных секреторных клеток", "t4_s1_h1": "У какого груза есть метка, которую узнаёт рецептор?", "t4_s1_h2": "Нужен ли особый сигнал для конститутивного пути?", "t4_s1_h3": "Фибронектин не запасается в клетке, а выходит по мере синтеза", "t4_s1_e": "Признаки различаются: метка и рецептор для гидролазы; отсутствие особого сигнала для конститутивного пути; встроенность в мембрану для рецептора ЛПНП — он идёт в мембране носителя", "t4_s2_title": "Признак, по которому груз попадает в гранулу", "t4_s2_cond": "Для сравнения: в клетке поджелудочной железы, вырабатывающей пищеварительные ферменты, такие ферменты накапливаются в гранулах и выделяются после сигнала", "t4_s2_q": "Какой признак отличает белки, попадающие в секреторные гранулы?", "t4_s2_o1": "Способность собираться в плотные скопления", "t4_s2_x1": "Да: скопления упаковываются в гранулы", "t4_s2_o2": "Метка M6P на гликане белка", "t4_s2_x2": "M6P направляет гидролазы к эндосомам", "t4_s2_o3": "Встроенность в мембрану транспортного носителя", "t4_s2_x3": "Ферменты в гранулах растворимы; встроенные белки идут в мембране носителя", "t4_s2_h1": "Чем содержимое гранулы отличается от содержимого обычного носителя?", "t4_s2_h2": "Гранулы плотные — продукт в них сконцентрирован", "t4_s2_h3": "В кислой среде транс-сети с высоким Ca²⁺ белки гранул собираются в скопления", "t4_s2_e": "Регулируемая секреция есть не во всех клетках; признак — физическое свойство груза, а не метка", "t4_s3_title": "Где окажется связывающий участок рецептора ЛПНП", "t4_s3_cond": "Рецептор ЛПНП встроился в мембрану ЭПР N-концевым доменом в просвет. Носитель с ним слился с плазматической мембраной", "t4_s3_q": "Где теперь его N-концевой домен?", "t4_s3_o1": "Снаружи клетки", "t4_s3_x1": "Да: просвет носителя при экзоцитозе открывается наружу", "t4_s3_o2": "В цитозоле: при слиянии мембрана выворачивается", "t4_s3_x2": "Слияние не меняет ориентацию белков: просветная сторона становится наружной", "t4_s3_o3": "В просвете аппарата Гольджи", "t4_s3_x3": "Носитель уже слился с плазматической мембраной", "t4_s3_h1": "Какой стороне мембраны соответствует просвет ЭПР?", "t4_s3_h2": "Проследите ориентацию на каждом этапе: ЭПР → носитель → плазматическая мембрана", "t4_s3_h3": "Ориентация задаётся при встраивании и сохраняется", "t4_s3_e": "Поэтому рецептор ЛПНП может связывать частицы ЛПНП во внеклеточной среде: его связывающий домен с самого начала был на «внешней» (просветной) стороне", "t4_s4_title": "С какой стороны гликаны", "t4_s4_cond": "N-гликаны присоединены к рецептору ЛПНП в ЭПР и перестроены в аппарате Гольджи", "t4_s4_q": "С какой стороны плазматической мембраны находятся гликаны рецептора?", "t4_s4_o1": "Снаружи клетки", "t4_s4_x1": "Да: гликаны присоединяются в просвете, а просветная сторона становится наружной", "t4_s4_o2": "В цитозоле", "t4_s4_x2": "В цитозоле N-гликаны не присоединяются: ферменты работают со стороны просвета", "t4_s4_o3": "С обеих сторон", "t4_s4_x3": "Гликаны есть только у участков, побывавших в просвете", "t4_s4_h1": "Где работает фермент, присоединяющий олигосахарид?", "t4_s4_h2": "Куда обращён просвет после экзоцитоза?", "t4_s4_h3": "Гликаны — признак просветной (наружной) стороны", "t4_s4_e": "Расположение гликанов подтверждает правило сохранения ориентации", "t4_s5_title": "Адрес, положение и место работы", "t4_s5_cond": "Сравните три груза на конечных адресах", "t4_s5_q": "Какое утверждение верно для всех трёх грузов?", "t4_s5_o1": "Каждому нужны верные адрес, ориентация и созревание", "t4_s5_x1": "Да: доставка — необходимое, но не достаточное условие", "t4_s5_o2": "Если белок доставлен по адресу, он работает", "t4_s5_x2": "Белок может быть на месте, но неверно ориентирован или не созрел", "t4_s5_o3": "Все три работают в одной и той же среде", "t4_s5_x3": "Фибронектин — во внеклеточном матриксе, рецептор — на поверхности, катепсин D — в кислой лизосоме", "t4_s5_h1": "Где работает каждый груз?", "t4_s5_h2": "Что, кроме адреса, нужно рецептору ЛПНП?", "t4_s5_h3": "Три условия: адрес, ориентация, созревание", "t4_s5_e": "Отсутствие секреции, отсутствие функции и неверный адрес — разные наблюдения", "t4_inv_cond": "Рецептор ЛПНП обнаружен в мембранах ЭПР и аппарата Гольджи, но не на поверхности клетки. Фибронектин той же клетки секретируется нормально", "t4_inv_q": "Какой вывод допустим?", "t4_inv_o1": "Нарушен путь именно рецептора ЛПНП, а не весь конститутивный путь", "t4_inv_x1": "Да: нормальная секреция фибронектина показывает, что общий путь к поверхности работает", "t4_inv_o2": "Не работает конститутивный путь к поверхности клетки", "t4_inv_x2": "Тогда и фибронектин не секретировался бы", "t4_inv_o3": "Не работает рецептор M6P в транс-сети этой клетки", "t4_inv_x3": "Рецептор M6P не участвует в доставке рецептора ЛПНП", "t4_inv_e": "Чтобы различить задержку из-за сворачивания и остановку на другом этапе, нужно узнать, где именно рецептор накапливается и связан ли он с шаперонами ЭПР", "t4_limits": "Модель описывает неполяризованную клетку. Она не показывает разделение путей к апикальной и базолатеральной мембране в поляризованных клетках (например, в эпителии), сборку фибронектина во внеклеточном матриксе и секрецию белков в обход аппарата Гольджи. Формы носителей условные", "fin_title": "Белок есть, но работает не там: на каком этапе прервался путь?", "fin_cond": "Одна схема пути: рибосома → вход в ЭПР → сворачивание и проверка → выход → аппарат Гольджи (метка M6P у гидролаз) → транс-сеть → адрес и ориентация. В каждом случае дано одно известное наблюдение. Можно заказать не больше указанного числа дополнительных измерений. Если данных недостаточно, правильный ответ — «данных недостаточно»", "fin_obs1": "Белок в ЭПР (сигнал отщеплён, есть N-гликан)", "fin_obs2": "Белок задержан в ЭПР с шаперонами", "fin_obs3": "M6P на белке", "fin_obs4": "Белок в среде", "fin_obs5": "Белок в лизосомах", "fin_obs6": "Белок на поверхности", "fin_obs7": "N-концевой домен доступен снаружи", "fin_obs8": "Связывается меченый лиганд", "fin_expl": "Конечное наблюдение («нет в среде», «нет ответа») совместимо с разными этапами. Измерение рядом с этапом — отщеплён ли сигнал, задержан ли белок, есть ли M6P, доступен ли домен снаружи — сужает выбор. Если измерений меньше, чем нужно, честный ответ — «данных недостаточно»", "fin_c1_cond": "Гидролаза обнаружена в среде вокруг клеток. Совместимые причины: метка M6P не ставится; рецептор M6P не работает", "fin_c1_lim": "1 измерение", "fin_c1_q": "Какое одно измерение различит причины?", "fin_c1_o1": "Есть ли M6P на гидролазе из среды", "fin_c1_x1": "Да: при дефекте метки M6P нет, при дефекте рецептора — есть", "fin_c1_o2": "Есть ли гидролаза в ЭПР клеток", "fin_c1_x2": "В обоих случаях гидролаза проходит ЭПР одинаково", "fin_c1_o3": "Сколько гидролазы накопилось в среде", "fin_c1_x3": "Гидролаза в среде есть при обоих дефектах; её количество не указывает причину", "fin_c2_cond": "Секретируемого белка нет в среде. Совместимые причины: белок не вошёл в ЭПР; белок не свернулся и задержан в ЭПР", "fin_c2_lim": "1 измерение", "fin_c2_q": "Какое одно измерение различит причины?", "fin_c2_o1": "Находится ли белок в ЭПР", "fin_c2_x1": "Да: при нарушении входа белка в ЭПР нет; при задержке он там есть", "fin_c2_o2": "Есть ли на белке метка M6P", "fin_c2_x2": "M6P — метка гидролаз; для секретируемого белка это измерение ничего не различает", "fin_c2_o3": "Доступен ли N-концевой домен снаружи", "fin_c2_x3": "Секретируемый белок растворим и не встроен в мембрану", "fin_c3_cond": "Рецептор плазматической мембраны есть на поверхности, ответа на лиганд нет. Совместимые причины: обратная ориентация в мембране; лиганд-связывающий участок не сформирован; нарушение за пределами модели (передача сигнала внутрь клетки)", "fin_c3_lim": "сначала 1, затем 2 измерения", "fin_c3a_note": "одно измерение — «связывается ли лиганд»; результат: «не связывается»", "fin_c3a_q": "Какой вывод корректен?", "fin_c3a_o1": "Данных недостаточно: так проявляются обе причины", "fin_c3a_x1": "Да: нужно ещё одно измерение", "fin_c3a_o2": "Рецептор встроен в обратной ориентации", "fin_c3a_x2": "Это одна из двух совместимых причин", "fin_c3a_o3": "Нарушена передача сигнала внутрь клетки", "fin_c3a_x3": "Тогда лиганд связывался бы", "fin_c3b_note": "разрешено второе измерение", "fin_c3b_q": "Какое измерение добавить?", "fin_c3b_o1": "Доступен ли N-концевой домен снаружи", "fin_c3b_x1": "Да: при обратной ориентации — нет, при несформированном участке — да", "fin_c3b_o2": "Есть ли рецептор на поверхности", "fin_c3b_x2": "Это уже известно", "fin_c3b_o3": "Есть ли на рецепторе M6P", "fin_c3b_x3": "M6P не относится к рецепторам плазматической мембраны", "a1_title": "Почему вход в ЭПР определяет, какие изменения доступны белку дальше?", "a1_idea": "Вход в ЭПР — не просто первый шаг пути. От него зависит, какие изменения вообще доступны белку: N-гликозилирование и дисульфидные связи возможны только в ЭПР. Для мембранного белка при входе задаётся ещё и его положение в мембране", "a1_new": "Мембранный белок этой задачи имеет на N-конце отщепляемую сигнальную последовательность, а дальше — один гидрофобный сегмент, который останавливает перенос цепи и остаётся в мембране. Его N-концевой домен несёт участки N-гликозилирования и цистеины", "a1_cond": "Клетка человека в культуре. Наблюдаем два белка после окончания синтеза: растворимый секретируемый белок (панель А) и однопроходный белок плазматической мембраны (панель Б). Оба переносятся в ЭПР только во время синтеза", "a1_s1_title": "норма", "a1_s1_q": "Все три звена работают. Где окажутся оба белка и какие изменения они получат?", "a1_s1_o1": "А в просвете, Б в мембране N-доменом в просвет", "a1_s1_x1": "Да: просвет ЭПР — место N-гликозилирования и образования дисульфидных связей", "a1_s1_o2": "Оба белка в просвете ЭПР в растворённом виде", "a1_s1_x2": "Гидрофобный сегмент мембранного белка останавливает перенос и остаётся в бислое", "a1_s1_o3": "А в просвете, Б в мембране N-доменом в цитозоль", "a1_s1_x3": "N-концевой сигнал начинает перенос N-домена в просвет; сегмент останавливает перенос остальной цепи", "a1_s1_h1": "Чем мембранный белок отличается от растворимого?", "a1_s1_h2": "Какая часть мембранного белка проходит через транслокон первой?", "a1_s1_h3": "Сигнал переносит N-домен в просвет, сегмент остаётся в бислое", "a1_s2_title": "сопоставимые условия: одно звено выключено", "a1_s2_q": "Выключите по очереди сигнал, SRP с рецептором и транслокон. Как меняются показания панелей А и Б?", "a1_s2_o1": "Всегда одинаково: оба белка в цитозоле, без N-гликана и S–S", "a1_s2_x1": "Да: любое из трёх звеньев необходимо для входа, а вход — для изменений в ЭПР", "a1_s2_o2": "Без транслокона белки окажутся в просвете, но без гликана", "a1_s2_x2": "Без транслокона цепь не проходит мембрану", "a1_s2_o3": "Без SRP растворимый белок войдёт в ЭПР, мембранный — нет", "a1_s2_x3": "В предпосылках задачи оба белка зависят от доставки во время синтеза", "a1_s2_h1": "Есть ли у этих белков другой путь в ЭПР по условию?", "a1_s2_h2": "Где работает фермент, присоединяющий олигосахарид?", "a1_s2_h3": "В восстановительной среде цитозоля дисульфидные связи почти не образуются", "a1_s3_title": "вывод", "a1_s3_q": "Три разных нарушения дают одинаковые показания. Что это означает для наблюдателя?", "a1_s3_o1": "По этим показаниям нельзя указать, какое звено не сработало", "a1_s3_x1": "Да: нужны дополнительные наблюдения", "a1_s3_o2": "Нарушение всегда в сигнальной последовательности: она первая в цепи", "a1_s3_x2": "Сигнал — первое звено по времени, но не единственное возможное место нарушения", "a1_s3_o3": "Нарушение всегда в транслоконе: он последний перед входом", "a1_s3_x3": "Модель даёт одинаковый исход для всех трёх звеньев", "a1_s3_h1": "Сравните показания при трёх нарушениях", "a1_s3_h2": "Можно ли по одинаковым показаниям отличить одну причину от другой?", "a1_s3_h3": "Нужны наблюдения, которые различаются при разных звеньях", "a1_inv_q": "Белок синтезирован, в ЭПР его нет. Назовите две разные группы причин и наблюдение, которое их различит", "a1_inv_o1": "Изменён сигнал — или общее звено; различают их другие белки клетки", "a1_inv_x1": "Да: общие звенья — SRP, рецептор SRP и транслокон; при изменённом сигнале одного белка другие секретируемые белки входят в ЭПР, при поломке общего звена — нет", "a1_inv_o2": "Белок не свернулся — или удалён; различает их наличие гликана", "a1_inv_x2": "Эти причины относятся к белку, который уже вошёл в ЭПР", "a1_inv_o3": "Изменён сигнал — или нет сигнальной пептидазы; различает их размер", "a1_inv_x3": "Без сигнальной пептидазы белок всё равно входит в ЭПР", "a1_inv_e": "Это наблюдение не различает SRP и транслокон между собой; для этого нужно знать, доставляется ли рибосома к мембране", "a1_limits": "Перенос в ЭПР после синтеза и белки с якорем у C-конца исключены предпосылкой. Не показано, что происходит с белком, оставшимся в цитозоле (в клетке такие белки обычно разрушаются)", "a1_new_data": "<b>Кто стоит у выхода из рибосомы до SRP.</b> Частиц SRP в клетке гораздо меньше, чем рибосом. У выхода из туннеля почти каждой рибосомы в начале синтеза находится белковый комплекс NAC. Его центральная часть занимает место SRP у выхода туннеля и препятствует связыванию SRP с цепями без сигнала ЭПР; гибкий участок NAC при этом связывает SRP рядом с рибосомой. Когда из туннеля выходит гидрофобная сигнальная последовательность ЭПР, связь центральной части NAC с рибосомой ослабевает, и SRP связывает сигнал. Цепи белков цитозоля и митохондрий этого не вызывают.\n<b>Что уточняет эта работа?</b> По модели авторов, узнавание сигнала двухступенчатое: сначала NAC, затем SRP, и две ступени повышают точность доставки в ЭПР именно белков ЭПР. У нематоды с нарушенной связью NAC и SRP уровень секретируемого белка-репортёра (белка, по количеству которого судят о секреции) был ниже, а признаки нарушения работы ЭПР и цитозоля усиливались", "a2_title": "Почему рост синтеза не обязательно увеличивает выход готового белка?", "a2_idea": "Если ЭПР может проверить сворачивание ограниченного числа молекул за единицу времени, то увеличение синтеза сверх этого предела не увеличивает выход готового белка, а приводит к накоплению молекул в ЭПР", "a2_new": "Учебная модель. За интервал в ЭПР входит определённое количество белка (у.е. — условные единицы). ЭПР выполняет не больше 120 проверок сворачивания за интервал. Молекула, свернувшаяся с первой попытки, требует одной проверки; молекула, которой нужна повторная попытка, — двух; окончательно дефектная — двух, после чего удаляется. Молекулы, которых не успели проверить, остаются в ЭПР до следующего интервала. Баланс: очередь в начале + вход = вышли готовыми + удалены + не проверены к концу", "a2_cond": "Клетка, секретирующая один белок. Обычно повторная попытка нужна 15 % молекул (доля 0,15), окончательно дефектны 5 % (доля 0,05). Наблюдаем 4 интервала", "a2_s1_title": "низкая нагрузка", "a2_s1_q": "Вход 60 у.е. за интервал. Сколько белка выйдет готовым за интервал?", "a2_s1_o1": "57 у.е.; удалены 3; непроверенных нет", "a2_s1_x1": "Да: нагрузка 72 проверки меньше ёмкости 120; выходят все недефектные молекулы", "a2_s1_o2": "60 у.е.", "a2_s1_x2": "Дефектные молекулы (0,05 от 60, то есть 3 у.е.) удаляются, а не выходят", "a2_s1_o3": "48 у.е.: часть молекул остаётся необработанной", "a2_s1_x3": "При ёмкости 120 повторные попытки успевают в том же интервале", "a2_s1_h1": "Посчитайте нагрузку: сколько проверок нужно 60 у.е.?", "a2_s1_h2": "Средняя молекула требует 1 + 0,15 + 0,05 = 1,2 проверки", "a2_s1_h3": "72 < 120 — все молекулы обработаны; выход = 0,95 × 60", "a2_s2_title": "высокая нагрузка, сопоставимое условие", "a2_s2_q": "Вход вырос до 150 у.е. Что изменится?", "a2_s2_o1": "Выйдут 95, а 50 у.е. останутся непроверенными", "a2_s2_x1": "Да: за интервал можно обработать не больше 120 / 1,2 = 100 у.е.; удалены 5 у.е., а очередь непроверенных за четыре интервала вырастет до 200", "a2_s2_o2": "Выйдут 142,5 у.е.: весь вход без дефектных", "a2_s2_x2": "Так было бы без предела ёмкости", "a2_s2_o3": "Выйдут 57 у.е., а остальное будет удалено", "a2_s2_x3": "Удаляется доля дефектных среди обработанных — 5 у.е.; необработанные молекулы остаются в очереди, а не удаляются", "a2_s2_h1": "Сколько молекул ЭПР может обработать за интервал?", "a2_s2_h2": "Что происходит с молекулами, которые не успели проверить?", "a2_s2_h3": "Они переходят в следующий интервал как очередь", "a2_s3_title": "перегрузка и снижение входа", "a2_s3_q": "При перегрузке вход снизили со 150 до 100 у.е. (с третьего интервала). Что произойдёт с выходом?", "a2_s3_o1": "Выход останется 95 у.е.; очередь перестанет расти", "a2_s3_x1": "Да: обработка и так шла на пределе 100 у.е.; новые 100 у.е. за интервал обрабатываются полностью, и очередь остаётся на уровне 100", "a2_s3_o2": "Выход уменьшится пропорционально входу — до 63 у.е.", "a2_s3_x2": "Выход ограничен ёмкостью, а не входом, пока вход не меньше предела", "a2_s3_o3": "Выход вырастет, потому что ЭПР разгрузится от очереди", "a2_s3_x3": "Очередь в 100 у.е. продолжает занимать ёмкость", "a2_s3_h1": "Сколько у.е. ЭПР обрабатывает за интервал при обычных долях?", "a2_s3_h2": "Хватает ли ёмкости, чтобы обработать и новый вход, и очередь?", "a2_s3_h3": "Предел обработки — 100 у.е.; новый вход тоже 100", "a2_s4_title": "доля повторных попыток", "a2_s4_q": "Доля молекул с повторной попыткой выросла с 0,15 до 0,45. Сравните вход 60 и вход 150", "a2_s4_o1": "При входе 60 — без изменений, при входе 150 — падение до 76", "a2_s4_x1": "Да: доля повторных попыток сказывается только у предела ёмкости; при входе 150 непроверенными к концу интервала остаются 70 у.е.", "a2_s4_o2": "При любом входе выход упадёт в 0,45 / 0,15 = 3 раза", "a2_s4_x2": "Повторная попытка не уничтожает молекулу, а лишь занимает ёмкость", "a2_s4_o3": "При любом входе выход останется прежним: 57 и 95", "a2_s4_x3": "При высокой нагрузке каждая повторная попытка отнимает проверку у новой молекулы", "a2_s4_h1": "Сколько проверок требует средняя молекула при доле 0,45?", "a2_s4_h2": "Превышает ли нагрузка ёмкость 120 при входе 60? при входе 150?", "a2_s4_h3": "1 + 0,45 + 0,05 = 1,5 проверки; 60 × 1,5 = 90 < 120", "a2_inv_q": "В трёх клетках выход одинаков — 57 у.е. за интервал. Клетка 1: вход 60. Клетка 2: ёмкость 72, вход 100. Клетка 3: доля дефектных 0,24, вход 75. Какие два наблюдения различат все три клетки, если вход измерить нельзя?", "a2_inv_o1": "Накопление в ЭПР и удаляемый белок", "a2_inv_x1": "Да: клетка 2 — накопление 40 у.е. за интервал; клетка 3 — удаляется 18 у.е.; клетка 1 — оба показателя малы (0 и 3)", "a2_inv_o2": "Только выход готового белка за интервал", "a2_inv_x2": "Он одинаков во всех трёх клетках", "a2_inv_o3": "Только количество удаляемого белка", "a2_inv_x3": "Оно одинаково в клетках 1 и 2 (3 у.е.)", "a2_inv_e": "Если бы вход можно было измерить, он один различил бы клетки (60, 100 и 75 у.е.)", "a2_limits": "В клетке ёмкость ЭПР не постоянна: при накоплении несвернувшихся белков клетка увеличивает ёмкость ЭПР и снижает вход новых белков (это изучают в курсе «Молекулярная биология»). В модели молекулы, не успевшие пройти проверку, остаются в очереди сколь угодно долго и не удаляются; в клетке долго несвёрнутый белок теряет маннозы гликана и направляется на удаление. В модели нет слипания белков и различий между белками; «стоимость» попыток и ёмкость — допущения, а не измеренные величины", "a2_new_data": "<b>Выходит ли из ЭПР каждая молекула нормального белка?</b> Исследовали два белка плазмы крови — α1-антитрипсин и антитромбин, — которые синтезировались с введённых генов в клетках почки эмбриона человека (линия HEK293). Даже нормальные формы выходили из клеток не полностью: в одной из серий измерений в среду поступило около 65 % синтезированного α1-антитрипсина и около 51 % антитромбина. Белки без участков N-гликозилирования в среде не обнаруживались. Варианты обоих белков, связанные с наследственными болезнями (в основном с заменами аминокислот), чаще, чем нормальные, повторно получали глюкозу на гликане; отсюда следует, что они, вероятно, чаще вновь связывались с калнексином или кальретикулином.\n<b>Что уточняет эта работа?</b> Доля молекул, которым нужна повторная попытка (параметр модели), — свойство конкретного белка и его варианта: замена одной аминокислоты её повышает. Измерения проведены не в клетках печени, где эти белки синтезируются в норме; клетки печени секретируют их эффективнее", "a3_title": "Метка необходима, но не достаточна", "a3_idea": "Метка M6P нужна гидролазе для доставки, но одной метки мало: нужен рецептор, который её узнаёт. Дефекты метки и рецептора дают одинаковую внешнюю картину; различить их можно только дополнительными наблюдениями", "a3_new": "Рецептор M6P узнаёт фосфат на маннозе гликана, а не любую фосфатную группу белка. Рецепторы M6P есть не только в транс-сети, но и на плазматической мембране: они захватывают гидролазы с меткой из среды и доставляют их в лизосомы", "a3_cond": "Фибробласты человека в культуре. Прослеживаем партию из 100 условных молекул гидролазы: сразу после синтеза и позднее", "a3_s1_title": "норма", "a3_s1_q": "Метка ставится, рецептор работает. Как распределится партия позднее?", "a3_s1_o1": "85 у.е. в эндосомах и лизосомах, 15 в среде", "a3_s1_x1": "Да: часть молекул проходит мимо рецепторов; доля условная", "a3_s1_o2": "100 у.е. в лизосомах, в среде ничего нет", "a3_s1_x2": "В модели часть молекул проходит транс-сеть, не связавшись с рецептором", "a3_s1_o3": "100 у.е. всё ещё в аппарате Гольджи", "a3_s1_x3": "Так выглядит партия сразу после синтеза, а не позднее", "a3_s1_h1": "Все ли молекулы с меткой встречают свободный рецептор в транс-сети?", "a3_s1_h2": "Куда уходят молекулы, не связавшиеся с рецептором?", "a3_s1_h3": "Доля, проходящая мимо рецепторов, в модели — 15 у.е.", "a3_s2_title": "два сопоставимых условия", "a3_s2_q": "Выключите метку (рецептор работает). Затем верните метку и выключите рецептор. Сравните", "a3_s2_o1": "В обоих случаях 100 у.е. в среде; различается M6P на них", "a3_s2_x1": "Да: одинаковый исход, разные причины; без метки M6P на гидролазе из среды нет, без рецептора — есть", "a3_s2_o2": "Без метки — в среде, без рецептора — в аппарате Гольджи", "a3_s2_x2": "Не связавшись с рецептором, гидролаза уходит конститутивным путём", "a3_s2_o3": "Без рецептора — в лизосомах, потому что метка достаточна", "a3_s2_x3": "Метку должен узнать рецептор; без него метка не превращается в адрес", "a3_s2_h1": "Куда уходит белок из транс-сети, если его не отобрал рецептор?", "a3_s2_h2": "Что измерить на гидролазе из среды?", "a3_s2_h3": "Метка либо есть, либо нет — это и различает причины", "a3_s3_title": "различающий эксперимент", "a3_s3_q": "В среду обеих клеток добавили нормальную гидролазу с меткой. Что произойдёт?", "a3_s3_o1": "Захватят только клетки с дефектом метки", "a3_s3_x1": "Да: у клеток с дефектом метки рецепторы на поверхности исправны", "a3_s3_o2": "Обе клетки захватят её одинаково", "a3_s3_x2": "Захват из среды идёт через рецептор M6P", "a3_s3_o3": "Не захватит ни одна: из среды гидролаза не входит", "a3_s3_x3": "Рецептор-опосредованный эндоцитоз доставляет её в эндосомы", "a3_s3_h1": "Есть ли рецепторы M6P на поверхности клеток?", "a3_s3_h2": "В какой из двух клеток эти рецепторы исправны?", "a3_s3_h3": "Добавленная гидролаза метку уже несёт", "a3_s4_title": "гидролаза без M6P-пути", "a3_s4_q": "Включите «гидролаза доставляется без M6P» и выключите метку", "a3_s4_o1": "Распределение останется 85/15", "a3_s4_x1": "Да: путь M6P — не единственный путь к лизосоме", "a3_s4_o2": "100 у.е. в среде, как у обычной гидролазы", "a3_s4_x2": "Эта гидролаза не зависит от метки M6P", "a3_s4_o3": "100 у.е. в лизосомах, в среде ничего", "a3_s4_x3": "Доля, уходящая в среду, в модели одинакова для обоих путей", "a3_s4_h1": "Нужна ли такой гидролазе метка M6P?", "a3_s4_h2": "Что изменится от выключения метки для белка, который её не использует?", "a3_s4_h3": "Сравните с распределением в норме", "a3_inv_q": "В среде вокруг клеток много гидролазы, в лизосомах её мало. Какое наблюдение нужно, чтобы отличить дефект метки от дефекта рецептора, и почему одной картины распределения недостаточно?", "a3_inv_o1": "Проверить M6P на гидролазе из среды", "a3_inv_x1": "Да: распределение одинаково при обоих дефектах; различает их наличие метки (или захват добавленной гидролазы с меткой)", "a3_inv_o2": "Измерить, сколько гидролазы накопилось в среде", "a3_inv_x2": "При обоих дефектах её одинаково много", "a3_inv_o3": "Проверить, проходит ли гидролаза через ЭПР", "a3_inv_x3": "Гидролаза проходит ЭПР одинаково при обоих дефектах", "a3_inv_e": "Модель не диагностирует болезнь: гидролаза в среде — наблюдение, совместимое с несколькими причинами", "a3_limits": "Возврат ушедших гидролаз с поверхности в распределении не учтён; доли условные. Не показаны другие рецепторы, доставляющие гидролазы без M6P, и различия между типами клеток", "a3_new_data": "<b>Для метки нужен не только фермент.</b> Найден белок мембраны аппарата Гольджи — LYSET (фактор транспорта лизосомных ферментов). По модели авторов, он связывается с ферментом, ставящим метку M6P, и удерживает его в аппарате Гольджи. Без LYSET фермент метки уходит в лизосомы и разрушается там, хотя количество его мРНК почти не меняется; метки на гидролазах почти нет, гидролазы уходят в среду, а в лизосомах накапливается непереваренный материал. Гидролазы, которые доставляются без M6P, и мембранные белки лизосом при этом не страдают. Ген нашли, когда искали гены, нужные вирусам для заражения: многим вирусам для входа в клетку нужны лизосомные протеазы.\n<b>Что уточняет эта работа?</b> «Метка не ставится» может иметь разные причины: дефект самого фермента или его неправильное расположение в клетке. Варианты LYSET, найденные у людей с наследственным нарушением, сходным с болезнью при дефекте фермента метки, не восстанавливали сортировку в клетках без LYSET. У мышей без LYSET были признаки нарушения сортировки — в клетках и в сыворотке крови, — но явных клинических проявлений не было", "a4_title": "Доставка и ориентация — независимые условия работы", "a4_idea": "Чтобы рецептор работал, должны выполняться три независимых условия: правильный адрес, правильная ориентация в мембране и завершённое созревание. Если рецептор на поверхности, но ответа нет, причин может быть несколько", "a4_new": "Ориентация мембранного белка задаётся при встраивании в ЭПР и при почковании и слиянии мембран не меняется. Ошибка ориентации в этой модели — отдельное нарушение встраивания (N-концевой домен оказался в цитозоле), а не следствие транспорта", "a4_cond": "Клетка человека в культуре. Рецептор плазматической мембраны связывает внешний лиганд N-концевым доменом. На схеме одновременно идут три груза; меняем условия только для рецептора", "a4_s1_title": "адрес", "a4_s1_q": "Рецептор задержан в ЭПР. Что покажут показания и что будет с двумя другими грузами?", "a4_s1_o1": "Рецептора на поверхности нет; два других груза в норме", "a4_s1_x1": "Да: условие изменено только для одного груза", "a4_s1_o2": "Ни один из трёх грузов не дойдёт до своего адреса", "a4_s1_x2": "Задержка одного белка не останавливает весь поток", "a4_s1_o3": "Рецептор на поверхности, но не связывает лиганд", "a4_s1_x3": "Задержанный в ЭПР рецептор до поверхности не доходит", "a4_s1_h1": "Какое условие изменено и для какого груза?", "a4_s1_h2": "Зависит ли путь двух других грузов от этого рецептора?", "a4_s1_h3": "Задержанный в ЭПР белок на поверхность не попадает", "a4_s2_title": "созревание и ориентация — два сопоставимых условия", "a4_s2_q": "Сравните два случая: (1) адрес и ориентация верны, лиганд-связывающий участок не сформирован; (2) адрес верен, рецептор встроен в обратной ориентации", "a4_s2_o1": "Различает их доступность N-концевого домена снаружи", "a4_s2_x1": "Да", "a4_s2_o2": "Различает их наличие рецептора на поверхности", "a4_s2_x2": "В модели транспорт не зависит от ориентации; ориентация сохраняется и на поверхности", "a4_s2_o3": "Их не различает ни одно из двух наблюдений", "a4_s2_x3": "Доступность N-домена снаружи различает их", "a4_s2_h1": "Какая часть рецептора снаружи в каждом случае?", "a4_s2_h2": "Что из двух наблюдений — связывание лиганда или доступность домена — даёт разный результат?", "a4_s2_h3": "В случае 2 снаружи C-хвост", "a4_s3_title": "звено вне модели", "a4_s3_q": "Рецептор на поверхности, N-домен снаружи, лиганд связывается, а ответа нет. Где искать причину?", "a4_s3_o1": "За пределами модели: в передаче сигнала", "a4_s3_x1": "Да: все три условия модели выполнены", "a4_s3_o2": "В ориентации рецептора в мембране", "a4_s3_x2": "N-домен снаружи и лиганд связывается — ориентация верна", "a4_s3_o3": "В адресе рецептора в клетке", "a4_s3_x3": "Рецептор на поверхности", "a4_s3_h1": "Какие три условия модели проверяют показания?", "a4_s3_h2": "Все ли три выполнены?", "a4_s3_h3": "Ответ клетки включает и звенья, которых в модели нет", "a4_inv_q": "Рецептор обнаружен на поверхности клетки, но ответа на лиганд нет. Можно ли сразу считать причиной неправильную ориентацию? Какие наблюдения нужны?", "a4_inv_o1": "Нет: нужны доступность N-домена и связывание лиганда", "a4_inv_x1": "Да: нужны два наблюдения — доступен ли N-концевой домен снаружи и связывается ли лиганд; если разрешено одно, ответ — «данных недостаточно»", "a4_inv_o2": "Да: рецептор на поверхности, значит, неверна ориентация", "a4_inv_x2": "Тот же результат дают несформированный участок и нарушение передачи сигнала", "a4_inv_o3": "Нет: достаточно измерить количество рецептора", "a4_inv_x3": "Количество не говорит ни об ориентации, ни о созревании", "a4_limits": "В клетке белок с ошибкой встраивания часто задерживается контролем качества; модель рассматривает случай, когда он дошёл до поверхности. Передача сигнала внутрь клетки не моделируется. Разделение путей в поляризованных клетках не показано", "a4_new_data": "<b>Как в транс-сети отбираются растворимые белки без рецептора.</b> Для секретируемых белков не найдено общего участка последовательности, по которому их отбирал бы рецептор, как рецептор M6P отбирает гидролазы. Для части таких белков найден другой механизм: насос мембраны транс-сети кратковременно закачивает Ca²⁺ в её просвет; белок Cab45 связывает Ca²⁺, объединяется в олигомеры и захватывает определённые секретируемые белки (среди них белки внеклеточного матрикса); их упаковывают в пузырьки, мембрана которых богата липидом сфингомиелином. Образование гранул регулируемой секреции объясняют слипанием белков семейства гранинов в кислой среде с высоким Ca²⁺; это распространённая модель.\n<b>Что уточняет эта работа?</b> Представление о конститутивной секреции «по умолчанию» дополняется: часть растворимых белков отбирается активно, но без классического рецептора. Многое ещё не установлено, например откуда поступает Ca²⁺", "gn_ribo": "Рибосома", "g_ribo": "Частица из рибосомных РНК и белков, на которой синтезируется белок; рибосомы, синтезирующие белки секреторного пути, на время синтеза прикреплены к мембране грЭПР.", "gn_mrna": "Матричная РНК (мРНК)", "g_mrna": "РНК, последовательность которой определяет порядок аминокислот синтезируемого белка.", "gn_chain": "Полипептидная цепь", "g_chain": "Цепь аминокислот, соединённых пептидными связями; растёт от N-конца к C-концу.", "gn_sig": "Сигнальная последовательность ЭПР (сигнальный пептид)", "g_sig": "Участок аминокислотной цепи, обычно на N-конце, с центральной частью из восьми и более неполярных аминокислот; направляет растущую цепь в ЭПР; после переноса обычно отщепляется.", "gn_srp": "Частица распознавания сигнала (SRP)", "g_srp": "Рибонуклеопротеин цитозоля из шести белков и одной РНК; связывает сигнальную последовательность ЭПР у выхода из рибосомы, замедляет синтез и доставляет рибосому к рецептору SRP.", "gn_srpr": "Рецептор SRP", "g_srpr": "Белковый комплекс мембраны грЭПР (у животных — из двух цепей), который связывает SRP с рибосомой и передаёт рибосому транслокону; синонимы — SRP-рецептор, белок стыковки.", "gn_sec61": "Транслокон Sec61", "g_sec61": "Белковый комплекс мембраны ЭПР из трёх субъединиц с водным каналом, через который цепь проходит в просвет; имеет пробку, закрывающую канал, и латеральные ворота для выхода гидрофобных участков в бислой; синоним — белок-транслокатор.", "gn_plug": "Транслокон Sec61", "g_plug": "Белковый комплекс мембраны ЭПР из трёх субъединиц с водным каналом, через который цепь проходит в просвет; имеет пробку, закрывающую канал, и латеральные ворота для выхода гидрофобных участков в бислой; синоним — белок-транслокатор.", "gn_spase": "Сигнальная пептидаза", "g_spase": "Фермент мембраны ЭПР, активный центр которого обращён в просвет; отщепляет сигнальную последовательность от переносимой цепи.", "gn_er_mem": "Гранулярный эндоплазматический ретикулум (грЭПР)", "g_er_mem": "Область эндоплазматического ретикулума, мембрана которой покрыта рибосомами со стороны цитозоля; здесь синтезируются и переносятся в ЭПР секретируемые, мембранные и лизосомные белки; мембрана ЭПР непрерывна с наружной ядерной мембраной.", "gn_polysome": "Полирибосома (полисома)", "g_polysome": "мРНК вместе с несколькими рибосомами, которые одновременно её транслируют.", "gn_albumin": "Альбумин", "g_albumin": "Основной белок плазмы крови; синтезируется и секретируется клетками печени.", "gn_actin": "Актин", "g_actin": "Белок цитоскелета, образующий нити (микрофиламенты) в цитозоле.", "gn_lumen": "Просвет ЭПР", "g_lumen": "Внутреннее пространство ЭПР, единое для всей сети и непрерывное с пространством между мембранами ядерной оболочки; по расположению относительно мембраны соответствует внеклеточной среде.", "gn_bilayer": "Липидный бислой", "g_bilayer": "Два слоя липидных молекул, гидрофобные хвосты которых обращены друг к другу, а гидрофильные головки — к водной среде; основа клеточных мембран.", "gn_tm": "Трансмембранный сегмент", "g_tm": "Гидрофобная α-спираль полипептидной цепи, пересекающая липидный бислой.", "gn_mcargo": "Топология мембранного белка", "g_mcargo": "Расположение участков мембранного белка по разные стороны мембраны; задаётся при встраивании в мембрану ЭПР и сохраняется при почковании и слиянии мембран.", "gn_glycan": "N-гликозилирование", "g_glycan": "Присоединение заранее собранного олигосахарида к аспарагину в последовательности Asn–X–Ser/Thr в просвете ЭПР; образующаяся углеводная цепь — N-гликан.", "gn_glycoprot": "Гликопротеин", "g_glycoprot": "Белок, к которому ковалентно присоединены углеводные цепи.", "gn_chap": "Шапероны", "g_chap": "Белки, которые связывают несвёрнутые или неправильно свёрнутые участки других белков, предотвращают их слипание и помогают им свернуться.", "gn_bip": "BiP", "g_bip": "Шаперон семейства Hsp70 в просвете ЭПР; связывает открытые гидрофобные участки цепей, используя энергию гидролиза АТФ.", "gn_pdi": "Протеиндисульфидизомераза (PDI)", "g_pdi": "Фермент просвета ЭПР, образующий, разрывающий и перестраивающий дисульфидные связи между остатками цистеина.", "gn_cnx": "Калнексин и кальретикулин", "g_cnx": "Шапероны ЭПР, связывающие гликопротеины с одной оставшейся глюкозой на N-гликане (лектины); калнексин — мембранный белок, кальретикулин — растворимый.", "gn_glcase": "Глюкозилтрансфераза ЭПР", "g_glcase": "Фермент просвета ЭПР, присоединяющий одну глюкозу к N-гликану ещё не свернувшегося белка, после чего белок вновь связывается с калнексином или кальретикулином.", "gn_mannosidase": "Маннозидазы ЭПР", "g_mannosidase": "Ферменты ЭПР, отщепляющие концевые остатки маннозы от N-гликана; гликан с укороченными маннозными ветвями служит признаком белка, который долго не сворачивается.", "gn_eres": "Участок выхода из ЭПР", "g_eres": "Свободный от рибосом участок мембраны ЭПР, где собирается оболочка COP-II и отпочковываются носители к аппарату Гольджи.", "gn_copii": "COP-II", "g_copii": "Оболочка (COP — белки оболочки) транспортных носителей, переносящих белки из грЭПР в цис-сеть аппарата Гольджи.", "gn_kdelr": "KDEL-рецептор", "g_kdelr": "Мембранный белок аппарата Гольджи и промежуточных мембран, который связывает растворимые белки ЭПР с сигналом KDEL на C-конце и возвращает их в ЭПР в носителях с COP-I.", "gn_copi": "COP-I", "g_copi": "Оболочка транспортных носителей, переносящих белки из аппарата Гольджи обратно в ЭПР и между цистернами аппарата Гольджи от транс- к цис-стороне.", "gn_kdel": "Сигнал возврата KDEL", "g_kdel": "Последовательность из четырёх аминокислот (у многих белков Lys–Asp–Glu–Leu) на C-конце растворимых белков ЭПР; её связывает KDEL-рецептор, который возвращает эти белки в ЭПР.", "gn_erad_ch": "Канал удаления (канал ретротранслокации)", "g_erad_ch": "Белковый канал мембраны ЭПР, через который несвернувшиеся белки переносятся из просвета ЭПР в цитозоль для разрушения.", "gn_ub": "Убиквитин", "g_ub": "Небольшой белок, который присоединяется к другим белкам как метка; цепочка убиквитина направляет белок в прот триновые пузырьки уходят от плазматической мембраны и от транс-сети аппарата Гольджи.", "gn_endo": "Эндосома", "g_endo": "Мембранный компартмент, принимающий материал из транс-сети и из эндоцитоза; по мере созревания закисляется; поздние эндосомы созревают в лизосомы.", "gn_retromer": "Ретромер", "g_retromer": "Белковый комплекс оболочки носителей, которые возвращают мембранные белки, в том числе рецептор M6P, из эндосом в транс-сеть аппарата Гольджи.", "gn_lyso": "Лизосома", "g_lyso": "Мембранная органелла с кислой средой и гидролазами, в которой расщепляются макромолекулы.", "gn_pm": "Плазматическая мембрана", "g_pm": "Мембрана, отделяющая цитоплазму клетки от внеклеточной среды.", "gn_out": "Внеклеточная среда", "g_out": "Пространство вне клетки; по расположению относительно мембраны ему соответствует просвет ЭПР, аппарата Гольджи и транспортных носителей.", "gn_constit": "Конститутивная секреция", "g_constit": "Непрерывная доставка белков и липидов из транс-сети аппарата Гольджи к плазматической мембране и выделение растворимых белков без внешнего сигнала; есть во всех клетках.", "gn_carrier": "Транспортный носитель", "g_carrier": "Мембранный пузырёк или трубочка, которые образуются почкованием от мембраны одного компартмента и сливаются с мембраной другого, перенося груз.", "gn_granule": "Секреторная гранула", "g_granule": "Мембранный пузырёк, образующийся в транс-сети аппарата Гольджи, в котором концентрированный продукт хранится до сигнала к экзоцитозу.", "gn_fusion": "Экзоцитоз", "g_fusion": "Слияние мембраны носителя с плазматической мембраной, при котором содержимое носителя выходит во внеклеточную среду, а его мембрана становится частью плазматической мембраны.", "gn_catd": "Лизосомная гидролаза", "g_catd": "Фермент, расщепляющий макромолекулы в кислой среде лизосомы; растворимые гидролазы синтезируются на грЭПР и доставляются по пути с меткой M6P.", "gn_hydro": "Лизосомная гидролаза", "g_hydro": "Фермент, расщепляющий макромолекулы в кислой среде лизосом function plotLines(cv, series, o){

  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });

  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();

}

  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
