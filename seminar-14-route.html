<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-14.html">← Вернуться к семинару</a> · <a href="section-3.html">Раздел III</a> · <a href="index.html">Все разделы</a></p><h1>Молекулярная эволюция генов и геномов</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-four-concepts"><div class="eyebrow">От мутации к замещению · шаг 1 из 30</div><h2>Мутационное событие, вариант, полиморфизм, замещение</h2><p class="lead">Изменение возникает в одной молекуле ДНК одной клетки, а различие между видами — это изменение, которое есть у всех особей вида. Между этими событиями — история варианта в популяции.</p><div class="note"><strong>Что показывает схема.</strong> Событие в клетке зародышевой линии → вариант у потомка → полиморфизм в популяции → закрепление и различие видов</div><p><a href="#ns-g-S14-T01">Мутационное событие</a> — однократное изменение последовательности ДНК в одной клетке. У животных с рано обособленной зародышевой линией, в том числе у человека, в следующие поколения переходят изменения клеток <a href="#ns-g-S14-T06">зародышевой линии</a>; <a href="#ns-g-S14-T07">соматические мутации</a> остаются в клетках тела и потомкам не передаются. Потомок, получивший изменение, несёт <a href="#ns-g-S14-T02">вариант</a> — наблюдаемое состояние последовательности; в популяции из N диплоидных особей новая копия — одна из 2N. Пока в популяции сосуществуют прежний и новый варианты, это <a href="#ns-g-S14-T03">полиморфизм</a>. Частота варианта меняется дрейфом и отбором; если она доходит до 1, вариант <a href="#ns-g-S14-T05">закрепился</a>, и прежнее состояние сменилось новым — произошло <a href="#ns-g-S14-T04">замещение</a>. Различия между видами складываются из замещений, накопленных в каждой линии после их расхождения.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a> и <a href="seminar-13-route.html#fixation">семинар 13: «Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a></p><p>Большинство новых вариантов исчезает в первые поколения, даже если они не влияют на приспособленность: нейтральная копия закрепляется с вероятностью, равной её начальной частоте 1/(2N). Поэтому мутационное событие ещё не означает различия между видами. По одной выборке видно состояние последовательности, но не момент события: вариант мог возникнуть много поколений назад. Отличить полиморфизм от замещения можно только по выборке из популяций обоих видов.</p><p><b>На практикуме.</b> Вкладка 1: выравнивание двух видов, шкала «возник → редкий → частый → закрепился или потерян» и 10 повторов истории новой копии.</p><p><b>Ограничения.</b> У бактерий и большинства одноклеточных разделения на зародышевую линию и клетки тела нет: изменение передаётся потомкам при делении клетки; у вирусов — при копировании генома. У растений и многих беспозвоночных зародышевая линия обособляется поздно, и изменения клеток тела могут попасть в половые клетки.</p><div class="static-quiz"><h3>У трёх из десяти обследованных особей вида в позиции гена G, у остальных — A. Что это?</h3><ol><li><b>А.</b> Полиморфизм <i>(верный вариант)</i><br><span class="expl">В популяции сосуществуют два варианта</span></li><li><b>Б.</b> Замещение <i>(неверный вариант)</i><br><span class="expl">Замещение — вариант, закрепившийся у всех; здесь вариантов два</span></li><li><b>В.</b> Мутационное событие <i>(неверный вариант)</i><br><span class="expl">Видно состояние последовательности; когда произошло событие, по выборке не сказать</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Схема качественная · число особей и поколений условно.</p></details></article><article class="card print-unit" id="ns-change-types"><div class="eyebrow">От мутации к замещению · шаг 2 из 30</div><h2>Типы изменений: замена, вставка и делеция, структурные изменения</h2><p class="lead">Изменения различаются по масштабу — от одного нуклеотида до целых хромосом — и по тому, как они возникают.</p><div class="note"><strong>Что показывает схема.</strong> Четыре масштаба изменений: замена, вставка и делеция, изменение тандемного повтора, структурный вариант</div><p><a href="#ns-g-S14-T10">Однонуклеотидная замена</a> меняет одно основание на другое: <a href="#ns-g-S14-T16">транзиция</a> — пурин на пурин или пиримидин на пиримидин, <a href="#ns-g-S14-T17">трансверсия</a> — пурин на пиримидин или наоборот. <a href="#ns-g-S14-T11">Вставки и делеции</a> добавляют или удаляют несколько нуклеотидов; в кодирующей последовательности вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания. <a href="#ns-g-S14-T12">Структурные варианты</a> — крупные (обычно больше 50–100 пар нуклеотидов) делеции, дупликации, инверсии и перемещения участков; к ним относятся и изменения числа копий участка генома. Особенно часто меняется число звеньев в <a href="#ns-g-S14-T13">тандемных повторах</a> — участках, где короткая последовательность повторяется подряд много раз: при репликации полимераза может проскальзывать.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-four-concepts">«Мутационное событие, вариант, полиморфизм, замещение»</a>; вспомнить <a href="seminar-10-route.html#sequence-changes">семинар 10: «Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции»</a></p><p>Одно и то же изменение описывают по нескольким признакам сразу: масштаб, механизм возникновения (ошибка репликации, повреждение основания, неравный кроссинговер, перемещение мобильного элемента), положение (кодирующая последовательность, интрон, регуляторный участок), последствие для продукта и последствие для приспособленности. Последние два признака — разные (шаг <a href="#ns-effects">«Функциональный и селективный эффект»</a>).</p><p><b>На практикуме.</b> Вкладка 1, продвинутый уровень: изменения в тандемных повторах составляют почти половину новых мутаций у ребёнка.</p><p><b>Ограничения.</b> Порог, с которого изменение называют структурным, зависит от метода; его указывают в каждой работе.</p><div class="static-quiz"><h3>Замена аденина на гуанин — это…</h3><ol><li><b>А.</b> Трансверсия <i>(неверный вариант)</i><br><span class="expl">Трансверсия — замена пурина на пиримидин или наоборот</span></li><li><b>Б.</b> Транзиция <i>(верный вариант)</i><br><span class="expl">Оба основания — пурины</span></li><li><b>В.</b> Структурный вариант <i>(неверный вариант)</i><br><span class="expl">Структурные варианты — изменения крупных участков</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41586-025-08922-2">Porubsky D. et al. Human de novo mutation rates from a four-generation pedigree reference. Nature 2025; 643: 427–436</a></li><li><a href="https://doi.org/10.1016/j.tig.2021.06.015">Hollox E.J., Zuccherato L.W., Tucci S. Genome structural variation in human evolution. Trends Genet 2022; 38: 45–58</a></li></ul><p>Схема качественная · длины участков условны.</p></details></article><article class="card print-unit" id="ns-mutation-rate"><div class="eyebrow">От мутации к замещению · шаг 3 из 30</div><h2>Скорость мутаций: что считают и на что делят</h2><p class="lead">Скорость мутаций описывает возникновение новых вариантов; её нельзя путать со скоростью, с которой накапливаются различия между видами.</p><div class="note"><strong>Что показывает схема.</strong> Скорость мутаций — по родословным; скорость замещений — по сравнению видов</div><p><a href="#ns-g-S14-T08">Скорость мутаций</a> выражают числом новых изменений на нуклеотид (или на геном) за поколение либо за год. У человека её измеряют прямо: сравнивают геномы родителей и детей и находят изменения, которых нет у родителей. Однонуклеотидных замен в клетках зародышевой линии возникает около 1,2 на 100 млн нуклеотидов за поколение; при 3,2 млрд нуклеотидов гаплоидного генома это несколько десятков новых замен на каждую гамету. <a href="#ns-g-S14-T09">Скорость замещений</a> — число закрепившихся различий на сайт за единицу времени в одной линии; её оценивают, сравнивая виды. Для нейтральных изменений в простой модели эти скорости совпадают (шаг <a href="#ns-neutral-theory">«Нейтральная теория: скорость замещений равна скорости мутаций»</a>), для остальных — нет: вредные варианты возникают, но почти не закрепляются.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-four-concepts">«Мутационное событие, вариант, полиморфизм, замещение»</a>, шаг <a href="#ns-change-types">«Типы изменений: замена, вставка и делеция, структурные изменения»</a></p><p>Небольшая скорость на нуклеотид даёт заметное число изменений на геном, потому что геном велик. Скорость мутаций различается между видами, участками генома, типами изменений; у человека число новых мутаций растёт с возрастом отца. В экспериментах накопления мутаций линии каждое поколение начинают от одной особи: отбор почти не действует, и изменения копятся; затем геномы читают и считают изменения.</p><p><b>На практикуме.</b> Вкладка 1: конструктор показывает, что возникший вариант закрепляется редко.</p><p><b>Ограничения.</b> Сравнение видов само по себе не даёт скорости мутаций: оно показывает уже закрепившиеся различия, на которые повлияли отбор и дрейф.</p><div class="static-quiz"><h3>Чем скорость мутаций отличается от скорости замещений?</h3><ol><li><b>А.</b> Ничем: это два названия одной величины <i>(неверный вариант)</i><br><span class="expl">Совпадают они только для нейтральных изменений в простой модели</span></li><li><b>Б.</b> Скорость замещений всегда выше скорости мутаций <i>(неверный вариант)</i><br><span class="expl">Обычно наоборот: вредные изменения возникают, но не закрепляются</span></li><li><b>В.</b> Первая — о возникновении вариантов, вторая — о закреплении <i>(верный вариант)</i><br><span class="expl">Между ними стоят дрейф и отбор</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41586-025-08922-2">Porubsky D. et al. Human de novo mutation rates from a four-generation pedigree reference. Nature 2025; 643: 427–436</a></li></ul><p>Схема качественная · скорость — порядок величины для человека (измерение по семьям).</p></details></article><article class="card print-unit" id="ns-spectrum"><div class="eyebrow">От мутации к замещению · шаг 4 из 30</div><h2>Спектр мутаций и мутационное смещение</h2><p class="lead">Разные изменения возникают с разной частотой — ещё до того, как на них подействует отбор.</p><div class="note"><strong>Что показывает схема.</strong> Столбики относительных частот классов изменений: C→T в CG выше остальных</div><p><a href="#ns-g-S14-T14">Спектр мутаций</a> — набор относительных частот разных типов изменений. Он неравномерен: транзиции возникают чаще трансверсий; метилированный цитозин в сочетании CG при самопроизвольном дезаминировании превращается в тимин, поэтому замена C на T в CG — одна из самых частых; вставки и делеции особенно часты в тандемных повторах. Систематическое неравенство частот возникновения разных изменений называют <a href="#ns-g-S14-T15">мутационным смещением</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-change-types">«Типы изменений: замена, вставка и делеция, структурные изменения»</a>; вспомнить <a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a></p><p>Спектр зависит от участка генома, ткани, пола и возраста родителя, воздействий среды и различается между видами. Мутационное смещение влияет на то, какие варианты чаще поступают в популяцию; если одно и то же изменение возникает часто, оно может появиться независимо в разных линиях. Мутации возникают без связи с тем, полезны ли они: частота возникновения изменения не говорит о его пользе.</p><p><b>На практикуме.</b> Вкладка 1, шаг 1.5.</p><p><b>Ограничения.</b> Спектр, измеренный по закрепившимся различиям между видами, искажён отбором; спектр возникновения измеряют по родословным и в экспериментах накопления мутаций.</p><div class="static-quiz"><h3>Почему замена C на T в CG возникает часто?</h3><ol><li><b>А.</b> Метилированный цитозин при дезаминировании даёт тимин <i>(верный вариант)</i><br><span class="expl">Это частое самопроизвольное изменение</span></li><li><b>Б.</b> Отбор поддерживает такие замены в популяции <i>(неверный вариант)</i><br><span class="expl">Речь о возникновении, а не о закреплении</span></li><li><b>В.</b> Тимин в этом сочетании полезнее цитозина <i>(неверный вариант)</i><br><span class="expl">Частота возникновения не связана с пользой</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41586-025-08922-2">Porubsky D. et al. Human de novo mutation rates from a four-generation pedigree reference. Nature 2025; 643: 427–436</a></li><li><a href="https://doi.org/10.1098/rstb.2022.0055">Cano A.V. et al. Mutation bias and the predictability of evolution. Phil Trans R Soc B 2023; 378: 20220055</a></li></ul><p>Схема качественная · соотношение частот условно.</p></details></article><article class="card print-unit" id="ns-effects"><div class="eyebrow">От мутации к замещению · шаг 5 из 30</div><h2>Функциональный и селективный эффект</h2><p class="lead">Что вариант делает с продуктом гена и что он делает с вкладом носителя в следующие поколения — разные вопросы.</p><div class="note"><strong>Что показывает схема.</strong> Активность фермента 100 % и 50 %, вклад в следующее поколение одинаков</div><p><a href="#ns-g-S14-T18">Функциональный эффект</a> — измеримое изменение молекулы, клетки или признака: например, активность фермента снизилась вдвое. <a href="#ns-g-S14-T19">Селективный эффект</a> — изменение вклада носителя в следующие поколения; его выражают <a href="#ns-g-S14-T20">коэффициентом отбора</a> s. Первый не определяет второй: при избыточности функции, при доминировании нормальной копии или в определённой среде заметное изменение продукта может почти не менять выживания и числа потомков. И наоборот, небольшое изменение регуляции может оказаться важным в определённом возрасте или среде.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-four-concepts">«Мутационное событие, вариант, полиморфизм, замещение»</a>; вспомнить <a href="seminar-10-route.html#synonymous-not-neutral">семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»</a></p><p>Селективный эффект зависит от генетического фона, среды, пола и возраста, от доминирования и от действия гена на несколько признаков. Варианты образуют непрерывный ряд эффектов, а не три строгие группы «вредные — нейтральные — полезные». Будет ли вариант с малым s вести себя как нейтральный, зависит ещё и от численности популяции (шаг <a href="#ns-nearly-neutral">«Почти нейтральная теория: значение численности»</a>).</p><p><b>На практикуме.</b> Вкладка 1, шаг 1.6.</p><p><b>Ограничения.</b> Коэффициент отбора для отдельного варианта в природе измерить трудно; в моделях он — параметр.</p><div class="static-quiz"><h3>Вариант снижает активность фермента, но не меняет выживания и числа потомков. Его селективный эффект…</h3><ol><li><b>А.</b> Отрицательный: продукт хуже <i>(неверный вариант)</i><br><span class="expl">Отрицательный функциональный эффект не означает отрицательного селективного</span></li><li><b>Б.</b> Близок к нулю в этих условиях <i>(верный вариант)</i><br><span class="expl">Изменился продукт, но не вклад в следующие поколения</span></li><li><b>В.</b> Положительный: фермент экономится <i>(неверный вариант)</i><br><span class="expl">Данных о большем числе потомков нет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1016/j.ajhg.2022.10.016">Dhindsa R.S. et al. A minimal role for synonymous variation in human disease. Am J Hum Genet 2022; 109: 2105–2109</a></li></ul><p>Схема качественная · активность и вклад условны.</p></details></article><article class="card print-unit" id="ns-dnm-family"><div class="eyebrow">От мутации к замещению · шаг 6 из 30</div><h2>Сколько новых мутаций получает ребёнок</h2><p class="lead">Если прочитать геном почти целиком, включая повторы, новых мутаций у ребёнка оказывается заметно больше прежних оценок.</p><div class="note"><strong>Что показывает схема.</strong> Накопительный столбик новых мутаций на одного ребёнка: 74,5 → 81,9 → 147,2 → 151,6; у детей 98–206</div><p>В семье из четырёх поколений (28 человек) геномы прочитали пятью разными методами, в том числе длинными прочтениями, и собрали почти целиком. У каждого ребёнка нашлось от 98 до 206 новых мутаций в сумме от обоих родителей; в среднем 74,5 однонуклеотидной замены (примерно по 37 от каждого родителя — как и следует из скорости мутаций, шаг <a href="#ns-mutation-rate">«Скорость мутаций: что считают и на что делят»</a>), 7,4 вставки и делеции вне повторов, 65,3 изменения в тандемных повторах (включая структурные варианты, возникшие в повторах) и 4,4 изменения в <a href="#ns-g-S14-T22">центромерах</a>. Прежние оценки около 60–70 касались в основном однонуклеотидных замен вне трудных для прочтения участков. Около 16 % новых однонуклеотидных замен возникли <a href="#ns-g-S14-T21">после оплодотворения</a> — у зародыша, а не в половых клетках родителей.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-change-types">«Типы изменений: замена, вставка и делеция, структурные изменения»</a>, шаг <a href="#ns-mutation-rate">«Скорость мутаций: что считают и на что делят»</a></p><p>Из мелких изменений зародышевой линии около 81 % возникло на отцовской копии; число новых мутаций росло примерно на 1,55 за каждый год возраста отца. Изменения после оплодотворения не унаследованы от родителей, отцовского преобладания у них нет, и они есть не во всех клетках человека.</p><p><b>Как это узнали.</b> Прочитали геномы всех членов семьи и сравнивали каждого ребёнка с родителями, проверяя передачу изменений следующему поколению.</p><p><b>Граница вывода.</b> Это одна семья; сумма средних по классам (около 152) — расчёт; работа не показывает, влияют ли эти изменения на признаки.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 1.</p><div class="static-quiz"><h3>Почему новая оценка числа мутаций выше прежней около 60–70?</h3><ol><li><b>А.</b> Люди этой семьи мутируют чаще других <i>(неверный вариант)</i><br><span class="expl">Работа не сравнивает семьи; разница — в том, что считали</span></li><li><b>Б.</b> Ошибки прочтения завысили счёт новых мутаций <i>(неверный вариант)</i><br><span class="expl">Изменения проверяли разными методами и передачей следующему поколению</span></li><li><b>В.</b> Посчитаны изменения в повторах и трудных участках <i>(верный вариант)</i><br><span class="expl">Их удалось прочитать длинными прочтениями</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-025-08922-2">Porubsky D. et al. Human de novo mutation rates from a four-generation pedigree reference. Nature 2025; 643: 427–436</a></li></ul><p>Схема по данным работы, упрощённая · числа измерены в одной семье; сумма — расчёт.</p></details></article><article class="card print-unit" id="ns-one-substitution"><div class="eyebrow">От мутации к замещению · шаг 7 из 30</div><h2>Сколько вариантов возникает на одно замещение</h2><p class="lead">За каждым различием между видами стоят тысячи вариантов, которые возникли и исчезли.</p><div class="note"><strong>Что показывает схема.</strong> Тысячи значков возникших копий, один закрепившийся; число растёт с N</div><p>Новая нейтральная копия закрепляется с вероятностью 1/(2N). Значит, в среднем на одно нейтральное замещение приходится 2N возникших копий: при 10 000 особях — 20 000, при миллионе — 2 миллиона. Если на сайт за поколение возникает μ нейтральных мутаций, то на одном сайте одно замещение происходит в среднем раз в 1/μ поколений: при μ = 10⁻⁸ — раз в 100 млн поколений. Для гена из 1000 сайтов — раз в 100 тыс. поколений.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-four-concepts">«Мутационное событие, вариант, полиморфизм, замещение»</a>, шаг <a href="#ns-mutation-rate">«Скорость мутаций: что считают и на что делят»</a></p><p>Модель показывает, почему мутационное событие и замещение — события разного масштаба: событий много, замещений мало. Вредные варианты добавляют событий, но почти не добавляют замещений; полезные закрепляются чаще нейтральных, но и их большинство исчезает (вкладка 1: при 1000 особях полезный на 1 % вариант закрепляется примерно в 1 % случаев).</p><p><b>Граница вывода.</b> Это вывод учебной модели с условной численностью и μ; в реальных популяциях численность меняется, а отбор действует и на соседние участки.</p><p><b>На практикуме.</b> Вкладка 1 (повторы), вкладка 2 (нейтральная теория).</p><div class="static-quiz"><h3>Сколько новых нейтральных копий в среднем приходится на одно замещение в популяции из 5000 особей?</h3><ol><li><b>А.</b> 10 000 <i>(верный вариант)</i><br><span class="expl">2N = 10 000</span></li><li><b>Б.</b> 5 000 <i>(неверный вариант)</i><br><span class="expl">Копий локуса в популяции 2N, а не N</span></li><li><b>В.</b> Одну <i>(неверный вариант)</i><br><span class="expl">Одна из 10 000 копий закрепляется; остальные исчезают</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-14.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · условные N и μ.</p></details></article><article class="card print-unit" id="ns-neutral-theory"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 8 из 30</div><h2>Нейтральная теория: скорость замещений равна скорости мутаций</h2><p class="lead">Если большинство закрепившихся молекулярных различий нейтрально, скорость их накопления не зависит от численности популяции.</p><div class="note"><strong>Что показывает схема.</strong> Столбик новых копий растёт, столбик вероятности падает, произведение постоянно — 10⁻⁵</div><p><a href="#ns-g-S14-T23">Нейтральная теория молекулярной эволюции</a> утверждает, что большинство замещений в последовательностях — закрепление <a href="#ns-g-S14-T24">нейтральных вариантов</a> <a href="#ns-g-S14-T25">генетическим дрейфом</a>, а не положительным отбором. Расчёт: в популяции из N диплоидных особей за поколение на сайт возникает 2N·μ новых нейтральных копий (μ — скорость нейтральных мутаций на сайт за поколение); каждая закрепляется с вероятностью 1/(2N); их произведение — μ. Скорость нейтральных замещений равна скорости нейтральных мутаций и не зависит от N: в большой популяции копий возникает больше, но каждая закрепляется реже.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-mutation-rate">«Скорость мутаций: что считают и на что делят»</a>, шаг <a href="#ns-one-substitution">«Сколько вариантов возникает на одно замещение»</a>; вспомнить <a href="seminar-13-route.html#drift">семинар 13: «Генетический дрейф: случайная выборка копий»</a></p><p>Теория не утверждает, что отбора нет. Вредные изменения возникают постоянно, и их удаляет <a href="#ns-g-S14-T28">очищающий отбор</a>; они почти не дают замещений. Полезные изменения <a href="#ns-g-S14-T29">положительный отбор</a> доводит до закрепления быстрее дрейфа; спор нейтралистов и селекционистов — о том, насколько они часты. Нейтральная теория служит нулевой моделью: если различия отклоняются от её предсказаний, это повод искать отбор. Одну из самых высоких скоростей накопления различий среди участков ядерного генома показывают <a href="#ns-g-S14-T38">псевдогены</a> — утратившие функцию копии генов: изменения в них почти все нейтральны.</p><p><b>На практикуме.</b> Вкладка 2, режим «Нейтральная теория», шаг 2.1.</p><p><b>Ограничения.</b> Численность меняет не скорость нейтральных замещений, а то, сколько вариантов одновременно есть в популяции и сколько поколений требуется до закрепления.</p><div class="static-quiz"><h3>В популяции в 10 раз больше особей. Как изменится скорость нейтральных замещений?</h3><ol><li><b>А.</b> Вырастет в 10 раз <i>(неверный вариант)</i><br><span class="expl">Каждая копия закрепляется в 10 раз реже</span></li><li><b>Б.</b> Не изменится <i>(верный вариант)</i><br><span class="expl">Новых копий в 10 раз больше, шанс каждой в 10 раз меньше</span></li><li><b>В.</b> Уменьшится в 10 раз <i>(неверный вариант)</i><br><span class="expl">Новых копий возникает в 10 раз больше</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · ген из 1000 сайтов и μ = 10⁻⁸ условны.</p></details></article><article class="card print-unit" id="ns-nearly-neutral"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 9 из 30</div><h2>Почти нейтральная теория: значение численности</h2><p class="lead">Слабовредный вариант в малой популяции ведёт себя почти как нейтральный, в большой — удаляется отбором.</p><div class="note"><strong>Что показывает схема.</strong> Кривая кратности шанса от 2Ns с полосой почти нейтральных; точки для N = 100 и 10 000</div><p><a href="#ns-g-S14-T26">Почти нейтральная теория</a> рассматривает варианты со слабым эффектом. Если |s| не больше 1/(2Ne) (см. <a href="seminar-13-route.html#fixation">семинар 13: «Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a>), где Ne — <a href="#ns-g-S14-T27">эффективная численность</a>, частоту варианта определяет главным образом дрейф, и шанс его закрепления почти такой же, как у нейтрального. В модели вариант с s = −0,001: при 100 особях порог 1/(2N) = 0,005 выше |s|, и шанс закрепления — 0,90 от нейтрального; при 10 000 особях порог 0,00005 ниже |s|, и шанс — около 4·10⁻⁸ от нейтрального.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-effects">«Функциональный и селективный эффект»</a>, шаг <a href="#ns-neutral-theory">«Нейтральная теория: скорость замещений равна скорости мутаций»</a>; вспомнить <a href="seminar-13-route.html#census-effective">семинар 13: «Фактическая и эффективная численность»</a></p><p>Поэтому один и тот же вариант может быть почти нейтральным в одном виде и вредным в другом. У видов с длинным поколением численность обычно меньше, чем у видов с коротким; у них большая доля слабовредных изменений ведёт себя как нейтральные. Это одно из объяснений, почему у некоторых белков различия накапливаются пропорционально годам, а не поколениям. Граница «почти нейтрального» условна: шанс закрепления меняется с величиной 2Ne·s плавно.</p><p><b>На практикуме.</b> Вкладка 2, панель «Почти нейтральный вариант», шаг 2.2; вкладка 1, шаг 1.4.</p><p><b>Ограничения.</b> В модели Ne равна N и постоянна; в природе численность меняется, и s зависит от среды.</p><div class="static-quiz"><h3>При каком условии вариант с s = −0,0001 ведёт себя почти как нейтральный?</h3><ol><li><b>А.</b> При любой численности: эффект слишком мал для отбора <i>(неверный вариант)</i><br><span class="expl">При Ne в миллион 2Ne·s = −200, и отбор эффективен</span></li><li><b>Б.</b> Только если популяция бесконечна <i>(неверный вариант)</i><br><span class="expl">В бесконечной популяции дрейфа нет, и даже слабый отбор удаляет вариант</span></li><li><b>В.</b> Если эффективная численность не больше 5000 <i>(верный вариант)</i><br><span class="expl">Тогда 1/(2Ne) не меньше 0,0001</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели · s и N условны.</p></details></article><article class="card print-unit" id="ns-syn-nonsyn"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 10 из 30</div><h2>Синонимичные и несинонимичные замены и сайты</h2><p class="lead">Вырожденность генетического кода позволяет сравнивать в одном гене изменения, которые меняют аминокислоту, и изменения, которые её не меняют.</p><div class="note"><strong>Что показывает схема.</strong> Для каждой позиции кодона — три возможные замены, отмеченные как синонимичные, несинонимичные или к стоп-кодону</div><p><a href="#ns-g-S14-T30">Синонимичная замена</a> меняет <a href="#ns-g-S14-T71">кодон</a>, но не аминокислоту; <a href="#ns-g-S14-T31">несинонимичная замена</a> меняет аминокислоту. Возможностей для них в гене не поровну: из трёх возможных замен в третьей позиции кодона часто все или большинство синонимичны, в первой и второй — почти все несинонимичны. Поэтому каждую позицию кодона делят на доли: <a href="#ns-g-S14-T32">синонимичный сайт</a> — доля возможных замен, не меняющих аминокислоту, <a href="#ns-g-S14-T33">несинонимичный сайт</a> — остальная доля. В модели практикума замены, ведущие к стоп-кодону, при подсчёте не учитываются. В гене обычно около четверти сайтов синонимичны и около трёх четвертей — несинонимичны.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-10-route.html#genetic-code">семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»</a> и <a href="seminar-10-route.html#sequence-changes">семинар 10: «Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции»</a></p><p>В условной последовательности практикума из 12 кодонов (36 нуклеотидов) синонимичных сайтов 8,33, несинонимичных — 27,67. Различия двух последовательностей относят к синонимичным или несинонимичным, сверяясь с генетическим кодом для каждого кодона: важно, меняется ли аминокислота, а не номер позиции.</p><p><b>На практикуме.</b> Вкладка 2, режим «dN/dS», шаг 2.3.</p><p><b>Ограничения.</b> Если в одном кодоне различаются две или три позиции, отнести различие к одному классу можно только с допущениями о порядке замен; в модели таких кодонов нет.</p><div class="static-quiz"><h3>Почему синонимичных сайтов в гене меньше, чем несинонимичных?</h3><ol><li><b>А.</b> Большинство возможных замен меняет аминокислоту <i>(верный вариант)</i><br><span class="expl">Синонимичны в основном замены в третьей позиции</span></li><li><b>Б.</b> Синонимичных кодонов в коде слишком мало <i>(неверный вариант)</i><br><span class="expl">Синонимичных кодонов много; мало возможных замен, сохраняющих аминокислоту</span></li><li><b>В.</b> Отбор удаляет синонимичные сайты из генов <i>(неверный вариант)</i><br><span class="expl">Сайты — возможности замен, они не удаляются отбором</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по генетическому коду · последовательность условна.</p></details></article><article class="card print-unit" id="ns-dnds-read"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 11 из 30</div><h2>Показатель dN/dS: как читать</h2><p class="lead">Отношение несинонимичных различий на сайт к синонимичным различиям на сайт показывает, как закреплялись два класса изменений в одном гене.</p><div class="note"><strong>Что показывает схема.</strong> Два ряда по 12 кодонов; оливковые кружки и пурпурные ромбы различий; dN/dS для четырёх вариантов вида Y</div><p><a href="#ns-g-S14-T34">dN</a> — число несинонимичных различий, делённое на число несинонимичных сайтов; <a href="#ns-g-S14-T35">dS</a> — число синонимичных различий, делённое на число синонимичных сайтов. Их отношение <a href="#ns-g-S14-T36">dN/dS</a> (обозначают и ω) читают так: меньше 1 — изменения аминокислот закреплялись реже синонимичных, что ожидается при очищающем отборе; около 1 — совместимо с тем, что изменения аминокислот закреплялись так же, как нейтральные; больше 1 — изменения аминокислот закреплялись чаще синонимичных, что совместимо с положительным отбором. В модели практикума: 3 синонимичных и 1 несинонимичное различие на 8,33 и 27,67 сайта дают dS = 0,36, dN = 0,036, dN/dS = 0,10.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-neutral-theory">«Нейтральная теория: скорость замещений равна скорости мутаций»</a>, шаг <a href="#ns-syn-nonsyn">«Синонимичные и несинонимичные замены и сайты»</a></p><p>Синонимичные различия служат мерой нейтральных изменений в том же гене: у них та же скорость мутаций и та же история популяции. Если синонимичных различий нет, отношение не определено. У большинства изученных генов dN/dS заметно меньше 1: большинство изменений аминокислот вредно. Значения больше 1 находят чаще всего в генах, участвующих в «гонке вооружений» хозяина и возбудителя, в генах размножения и в недавно дуплицированных генах.</p><p><b>На практикуме.</b> Вкладка 2, шаги 2.4–2.6.</p><p><b>Ограничения.</b> Подсчёт практикума не учитывает повторных замен в одном сайте: при больших различиях они занижают dS.</p><div class="static-quiz"><h3>dN = 0,03, dS = 0,06. Что можно сказать?</h3><ol><li><b>А.</b> 2: изменения аминокислот закреплялись чаще <i>(неверный вариант)</i><br><span class="expl">Делят dN на dS, а не наоборот</span></li><li><b>Б.</b> 0,5: изменения аминокислот закреплялись вдвое реже <i>(верный вариант)</i><br><span class="expl">Это совместимо с очищающим отбором</span></li><li><b>В.</b> Ген нейтрален: оба числа слишком малы <i>(неверный вариант)</i><br><span class="expl">Важно отношение, а не величина каждого</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели · последовательности и числа сайтов условные.</p></details></article><article class="card print-unit" id="ns-dnds-limits"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 12 из 30</div><h2>Чего dN/dS не показывает</h2><p class="lead">Отношение — среднее по гену и по всему времени расхождения; одно число может скрывать разные истории.</p><div class="note"><strong>Что показывает схема.</strong> Четыре ограничения dN/dS в четырёх панелях</div><p>Ограничения показателя: (1) усреднение: значение меньше 1 по гену не исключает положительного отбора в немногих кодонах или на одной ветви дерева, а значение около 1 может складываться из кодонов под очищающим и под положительным отбором; (2) допущение о нейтральности синонимичных замен: часть их влияет на сплайсинг, устойчивость РНК и скорость трансляции, а в высокоэкспрессируемых генах проявляется <a href="#ns-g-S14-T39">неравное использование синонимичных кодонов</a> — признак отбора на синонимичных позициях; (3) <a href="#ns-g-S14-T37">насыщение</a>: при сильном расхождении одна позиция меняется повторно, видна лишь итоговая разница, и dS занижается; (4) при очень близких последовательностях различий слишком мало, и оценка неустойчива; (5) сравнивать нужно <a href="#ns-g-S14-T40">ортологи</a>, а не паралоги — копии, разошедшиеся при дупликации: их различия накоплены с момента дупликации, возможно в период ослабленного отбора, и описывают другую историю.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-dnds-read">«Показатель dN/dS: как читать»</a></p><p>Поэтому для поиска отбора используют модели, оценивающие показатель отдельно для кодонов и ветвей, и сравнивают различия между видами с полиморфизмом внутри вида. Значение около 1 само по себе не говорит, что ген не испытывает отбора: такое же среднее даёт ген, утрачивающий функцию, и ген со смесью давлений.</p><p><b>На практикуме.</b> Вкладка 2, панель «Чего не показывает», шаги 2.5–2.6, «Найти причину» II.</p><p><b>Ограничения.</b> Показатель описывает закрепившиеся изменения; он не измеряет, насколько вреден или полезен отдельный вариант.</p><div class="static-quiz"><h3>dN/dS гена равно 0,3. Можно ли исключить положительный отбор?</h3><ol><li><b>А.</b> Да: среднее значение меньше 1 <i>(неверный вариант)</i><br><span class="expl">Меньше 1 — среднее; отдельные кодоны могут иметь больше 1</span></li><li><b>Б.</b> Да, если сравниваемые последовательности очень длинные <i>(неверный вариант)</i><br><span class="expl">Длина уточняет среднее, но не показывает распределения по кодонам</span></li><li><b>В.</b> Нет: он мог действовать на немногие кодоны <i>(верный вариант)</i><br><span class="expl">Нельзя: среднее по гену это скрывает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/molbev/msae224">Shen X. et al. Further evidence for strong nonneutrality of yeast synonymous mutations. Mol Biol Evol 2024; 41: msae224</a></li></ul><p>Схема качественная · значения кодонов условны.</p></details></article><article class="card print-unit" id="ns-synonymous-debate"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 13 из 30</div><h2>Вредны ли синонимичные мутации</h2><p class="lead">Измерение у дрожжей поставило под сомнение нейтральность синонимичных мутаций; результат оспорен, спор не закрыт.</p><div class="note"><strong>Что показывает схема.</strong> Три одинаково оформленные позиции спора о дрожжах и полоса данных о человеке; итог — спор не закрыт</div><p>Утверждение: в 21 ген дрожжей вносили по одной однонуклеотидной замене и измеряли приспособленность мутантов в общей смеси с исходным штаммом. Из 1866 синонимичных мутантов 75,9 % оказались значимо вредными — почти та же доля, что у несинонимичных (75,8 %). Возражение: для каждого гена не было исходного штамма, полученного тем же путём; повторы были техническими, а не независимыми; побочные мутации при получении штаммов могли сделать нейтральные замены «вредными». Ответ авторов утверждения: прочитаны 603 генома — ошибочных разрезов при редактировании нет, но у 26,7 % из 580 прочитанных мутантов есть побочные мутации; в повторе по 11 генам с независимыми смесями и своим исходным штаммом для каждого гена значимо не нейтральны 86,5 % синонимичных мутаций; вместе с прежними данными по шести генам, где влияние побочных мутаций пренебрежимо мало, — 76,9 % из 1621. Спор о дрожжах не закрыт.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-syn-nonsyn">«Синонимичные и несинонимичные замены и сайты»</a>, шаг <a href="#ns-dnds-limits">«Чего dN/dS не показывает»</a></p><p>У человека картина другая: в большой выборке участников британского биобанка редкие синонимичные варианты оказались связаны хотя бы с одним из 4911 признаков только в 2 генах из 18 762, миссенс-варианты — в 27, а варианты, обрывающие белок, — в 55. Синонимичные варианты у человека в целом встречаются чаще несинонимичных, что ожидается, если отбор против них слабее. Известны и отдельные синонимичные варианты, вызывающие заболевания, — чаще всего через нарушение сплайсинга.</p><p><b>Как это узнали.</b> Приспособленность мутантов дрожжей считали по изменению их долей в смеси за двое суток; у людей сравнивали, как часто редкие варианты гена встречаются у людей с признаком и без него.</p><p><b>Граница вывода.</b> Измерения у дрожжей сделаны в лабораторных условиях для 21 гена; перенос на другие организмы и на природу не следует. Если синонимичные замены не нейтральны, dS перестаёт быть мерой нейтральных изменений.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 2.</p><div class="static-quiz"><h3>Почему спор о дрожжах важен для показателя dN/dS?</h3><ol><li><b>А.</b> dS принимают за меру нейтральных изменений <i>(верный вариант)</i><br><span class="expl">Если синонимичные замены вредны, отношение искажается</span></li><li><b>Б.</b> Потому что dN/dS считают только для дрожжей <i>(неверный вариант)</i><br><span class="expl">Показатель используют для любых кодирующих последовательностей</span></li><li><b>В.</b> Потому что спор показал, что генетический код у дрожжей другой <i>(неверный вариант)</i><br><span class="expl">Спор — о приспособленности, а не о коде</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-022-04823-w">Shen X., Song S., Li C., Zhang J. Synonymous mutations in representative yeast genes are mostly strongly nonneutral. Nature 2022; 606: 725–731</a></li><li><a href="https://doi.org/10.1038/s41586-023-05865-4">Kruglyak L. et al. Insufficient evidence for non-neutrality of synonymous mutations. Nature 2023; 616: E8–E9</a></li><li><a href="https://doi.org/10.1093/molbev/msae224">Shen X. et al. Further evidence for strong nonneutrality of yeast synonymous mutations. Mol Biol Evol 2024; 41: msae224</a></li><li><a href="https://doi.org/10.1016/j.ajhg.2022.10.016">Dhindsa R.S. et al. A minimal role for synonymous variation in human disease. Am J Hum Genet 2022; 109: 2105–2109</a></li></ul><p>Схема трёх опубликованных позиций и одного наблюдения у человека · ни одна позиция не выделена.</p></details></article><article class="card print-unit" id="ns-site-average"><div class="eyebrow">Нейтральная эволюция и dN/dS · шаг 14 из 30</div><h2>Среднее по гену скрывает отбор в отдельных кодонах</h2><p class="lead">Немногие кодоны под положительным отбором не поднимают среднее по гену выше 1.</p><div class="note"><strong>Что показывает схема.</strong> 100 ячеек-кодонов двух цветов и шкала среднего с отметкой 1</div><p>Условный ген из 100 кодонов: в 95 кодонах изменения аминокислот закрепляются в 10 раз реже синонимичных (ω = 0,1), в 5 кодонах — в 5 раз чаще (ω = 5). Если числа сайтов в кодонах одинаковы, среднее по гену (95 × 0,1 + 5 × 5) / 100 = 0,345. По одному этому числу ген выглядит как ген под очищающим отбором, хотя в пяти кодонах действовал положительный.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-dnds-read">«Показатель dN/dS: как читать»</a>, шаг <a href="#ns-dnds-limits">«Чего dN/dS не показывает»</a></p><p>Так устроены, например, гены белков, распознающих чужеродные молекулы: в участке узнавания несинонимичные замены закрепляются чаще синонимичных, а в остальной части гена — реже. Чтобы найти такие кодоны, используют модели, в которых у разных кодонов своё значение показателя, и сравнивают, насколько хорошо разные модели описывают данные.</p><p><b>Граница вывода.</b> Расчёт по модели с условными числами; в реальных генах доли кодонов и значения показателя оценивают по данным, а для коротких последовательностей оценки по отдельным кодонам ненадёжны.</p><p><b>На практикуме.</b> Вкладка 2, шаг 2.5.</p><div class="static-quiz"><h3>Если в той же модели положительный отбор действует не на 5, а на 20 кодонов (ω = 5), среднее будет…</h3><ol><li><b>А.</b> 0,345, как прежде <i>(неверный вариант)</i><br><span class="expl">Вклад кодонов под положительным отбором вырос</span></li><li><b>Б.</b> 1,08 — больше 1 <i>(верный вариант)</i><br><span class="expl">(80 × 0,1 + 20 × 5) / 100 = 1,08</span></li><li><b>В.</b> 5 <i>(неверный вариант)</i><br><span class="expl">Среднее учитывает и 80 кодонов с ω = 0,1</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-14.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели · 95 и 5 кодонов, ω = 0,1 и 5 — условные числа.</p></details></article><article class="card print-unit" id="ns-accumulation"><div class="eyebrow">Молекулярные часы · шаг 15 из 30</div><h2>Различия накапливаются со временем</h2><p class="lead">Если нейтральные замены накапливаются с постоянной скоростью, число различий двух последовательностей растёт пропорционально времени, прошедшему от их общего предка.</p><div class="note"><strong>Что показывает схема.</strong> Дерево К–Л, ветви по 0,012 замены на сайт, отметка 6 млн лет с подписью «известно условно», показание r = 0,002</div><p><a href="#ns-g-S14-T42">Молекулярные часы</a> опираются на нейтральную теорию: скорость нейтральных замещений равна скорости нейтральных мутаций; если она постоянна, различия растут равномерно. После расхождения двух видов замены накапливаются в обеих линиях, поэтому доля различающихся сайтов d = 2rT, где r — скорость замещений на сайт за единицу времени в одной линии, T — время от расхождения. Отсюда T = d / (2r). На филогенетическом дереве <a href="#ns-g-S14-T49">длина ветви</a> — число замен на сайт в этой линии.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-neutral-theory">«Нейтральная теория: скорость замещений равна скорости мутаций»</a>; вспомнить <a href="seminar-12-route.html#r3">семинар 12: «Как датируют LUCA и почему это модель»</a></p><p>Пример модели: виды разошлись 6 млн лет назад и различаются в 2,4 % сайтов (d = 0,024) — значит, скорость в каждой линии 0,002 на сайт за миллион лет; по ней можно датировать другие узлы. Для часов лучше подходят изменения, близкие к нейтральным (синонимичные позиции, некодирующие участки); последовательности под сильным отбором меняются неравномерно.</p><p><b>На практикуме.</b> Вкладка 3, шаг 3.1.</p><p><b>Ограничения.</b> При больших различиях одна позиция меняется повторно, и d растёт медленнее времени (насыщение); для дальних сравнений нужны поправки.</p><div class="static-quiz"><h3>Различие двух видов вдвое больше, чем у другой пары, а скорость в линиях та же. Что можно сказать о времени расхождения?</h3><ol><li><b>А.</b> Примерно вдвое меньше <i>(неверный вариант)</i><br><span class="expl">Больше различий при той же скорости — больше времени</span></li><li><b>Б.</b> Такое же, как у другой пары <i>(неверный вариант)</i><br><span class="expl">Различия растут со временем; при той же скорости вдвое больше различий — вдвое больше время</span></li><li><b>В.</b> Примерно вдвое больше <i>(верный вариант)</i><br><span class="expl">При постоянной скорости T пропорционально d</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-14.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · d и r условны.</p></details></article><article class="card print-unit" id="ns-calibration"><div class="eyebrow">Молекулярные часы · шаг 16 из 30</div><h2>Калибровка: откуда берутся годы</h2><p class="lead">Последовательности дают только число замен; чтобы перевести его в годы, нужна <a href="#ns-g-S14-T43">калибровка</a> — узел дерева с независимо известным возрастом.</p><div class="note"><strong>Что показывает схема.</strong> Без калибровки — только дерево; с ископаемым — интервал для узла К–Л</div><p>Число различий d — произведение скорости на время, и по одному произведению нельзя найти оба множителя: малое время при большой скорости и большое время при малой скорости дают одно и то же d. Без калибровки получают дерево и относительные длины ветвей, но не годы. Калибровку берут из ископаемых (обычно они задают нижнюю границу возраста узла: линия не моложе находки), из геологических событий (разделение суши, появление острова) или из дат образцов (для вирусов и бактерий). По калибровочному узлу находят скорость r = d / (2T), затем применяют её к другим узлам.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-accumulation">«Различия накапливаются со временем»</a></p><p>В модели практикума: ископаемое показывает, что линии К и Н разошлись 14–18 млн лет назад, d(К,Н) = 0,064, отсюда r = 0,00178–0,00229 и время узла К–Л — 5,25–6,75 млн лет. Возраст калибровки известен с неопределённостью, и она переходит в оценку. Даже при очень длинных последовательностях неопределённость дат остаётся, потому что её главный источник — калибровки.</p><p><b>На практикуме.</b> Вкладка 3, шаги 3.2–3.3.</p><p><b>Ограничения.</b> Калибровка верна, только если ископаемое отнесено к правильной линии, а возраст слоя определён верно.</p><div class="static-quiz"><h3>Что даст анализ очень длинных последовательностей без калибровки?</h3><ol><li><b>А.</b> Дерево в заменах на сайт, но не даты <i>(верный вариант)</i><br><span class="expl">Длина уточняет d, но не разделяет скорость и время</span></li><li><b>Б.</b> Точные даты расхождения видов <i>(неверный вариант)</i><br><span class="expl">Без внешнего возраста годы не определить</span></li><li><b>В.</b> Ничего: без дат нет и дерева <i>(неверный вариант)</i><br><span class="expl">Дерево и относительные расстояния получают и без калибровки</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-14.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · возраст калибровки и d условны.</p></details></article><article class="card print-unit" id="ns-uneven-clock"><div class="eyebrow">Молекулярные часы · шаг 17 из 30</div><h2>Почему часы идут неравномерно</h2><p class="lead">Скорость замещений различается между линиями, генами и участками генома; часы с одной скоростью для всех ветвей — допущение.</p><div class="note"><strong>Что показывает схема.</strong> Дерево с удлинённой ветвью Л и расстояниями до внешней группы</div><p>Скорость зависит от <a href="#ns-g-S14-T48">времени поколения</a> (за год у видов с коротким поколением проходит больше поколений), от скорости мутаций, которая сама различается между видами, от численности — через долю почти нейтральных изменений (шаг <a href="#ns-nearly-neutral">«Почти нейтральная теория: значение численности»</a>) — и от давления отбора на участок. <a href="#ns-g-S14-T44">Строгие часы</a> принимают одну скорость для всех ветвей; <a href="#ns-g-S14-T45">нестрогие часы</a> позволяют скоростям различаться и оценивают их вместе с датами. Неравенство скоростей выявляет <a href="#ns-g-S14-T47">внешняя группа</a> — вид, отделившийся раньше: при равных скоростях два вида от неё одинаково далеки.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-nearly-neutral">«Почти нейтральная теория: значение численности»</a>, шаг <a href="#ns-accumulation">«Различия накапливаются со временем»</a></p><p>Пример модели: виды К и Л разошлись 6 млн лет назад, в линии Л скорость вдвое выше, чем в линии К; строгие часы с одной скоростью дали бы 9 млн лет. Расстояния до внешней группы М — 0,048 и 0,060: линия Л ушла дальше. У некоторых белков позвоночных различия растут пропорционально годам, а не поколениям; почти нейтральная теория объясняет это тем, что у видов с длинным поколением численность меньше.</p><p><b>На практикуме.</b> Вкладка 3, шаг 3.5; «Найти причину» III.</p><p><b>Ограничения.</b> Если скорость меняется в линии плавно, внешняя группа показывает только суммарную разницу.</p><div class="static-quiz"><h3>От внешней группы вид К отстоит на 0,05, вид Л — на 0,07. Что это значит?</h3><ol><li><b>А.</b> Вид Л возник раньше вида К <i>(неверный вариант)</i><br><span class="expl">Оба вида — современные; время от общего предка у них одно</span></li><li><b>Б.</b> В линии Л замены копились быстрее <i>(верный вариант)</i><br><span class="expl">При равных скоростях расстояния были бы равны</span></li><li><b>В.</b> Внешняя группа для сравнения выбрана неверно <i>(неверный вариант)</i><br><span class="expl">Это возможно, но прямой вывод из данных — неравенство скоростей</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-14.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · скорости и времена условны.</p></details></article><article class="card print-unit" id="ns-interval"><div class="eyebrow">Молекулярные часы · шаг 18 из 30</div><h2>Интервал вместо даты</h2><p class="lead">Результат молекулярной датировки — <a href="#ns-g-S14-T46">интервал оценки</a>; его ширина показывает, насколько надёжна дата.</p><div class="note"><strong>Что показывает схема.</strong> Полосы интервалов узла К–Л для трёх вариантов калибровки</div><p>В оценку времени складываются неопределённости калибровок, модели скоростей, модели замен, выбора генов и видов. Поэтому дату сообщают интервалом (например, 95 %-м интервалом), а не одним числом. Замена одной калибровки другой сдвигает интервал; согласованная дополнительная калибровка сужает его. В модели практикума: по ископаемому — 5,25–6,75, по геологическому событию — 5,0–6,0, по обеим — 5,25–6,0 млн лет.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-calibration">«Калибровка: откуда берутся годы»</a>, шаг <a href="#ns-uneven-clock">«Почему часы идут неравномерно»</a></p><p>Даты, полученные разными работами, сравнивают с учётом калибровок и моделей; совпадение интервалов не доказывает правильности обоих, а расхождение указывает, где искать причину. Молекулярные часы не заменяют палеонтологических и геологических данных: они переводят различия в годы только через них.</p><p><b>На практикуме.</b> Вкладка 3, шаг 3.4; полоса «интервал оценки».</p><p><b>Ограничения.</b> В модели интервал получается простым переносом границ калибровки; в реальных расчётах распределения возрастов, скоростей и времён оцениваются совместно.</p><div class="static-quiz"><h3>Две калибровки дают для узла 4–6 и 5–7 млн лет. Если они согласуются, интервал по обеим…</h3><ol><li><b>А.</b> 4–7 млн лет <i>(неверный вариант)</i><br><span class="expl">Объединение интервалов не учитывает, что верны обе калибровки</span></li><li><b>Б.</b> Ровно 5,5 млн лет <i>(неверный вариант)</i><br><span class="expl">Обе калибровки сами заданы интервалами</span></li><li><b>В.</b> 5–6 млн лет <i>(верный вариант)</i><br><span class="expl">Время должно быть совместимо с обеими</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-14.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · интервалы условны.</p></details></article><article class="card print-unit" id="ns-somatic-lifespan"><div class="eyebrow">Молекулярные часы · шаг 19 из 30</div><h2>Скорость мутаций в клетках тела и продолжительность жизни</h2><p class="lead">Скорость мутирования клеток тела различается у видов млекопитающих примерно в 17 раз и связана с продолжительностью их жизни.</p><div class="note"><strong>Что показывает схема.</strong> Точечная диаграмма 15 видов в логарифмических осях</div><p>Геномы стволовых клеток кишечника прочитаны у 16 видов млекопитающих; в сравнение скоростей вошли 15 видов, у которых известен возраст особей. За год в клетке накапливается от 47 (человек) до 796 (мышь) однонуклеотидных замен на геном. Чем короче жизнь вида, тем выше скорость: обратная величина продолжительности жизни объясняет 82 % различий между видами. К концу жизни в клетке набирается сопоставимое число замен — в среднем около 3200 (95 %-й доверительный интервал 2684–3729), хотя продолжительность жизни различается в 30 раз, а масса тела — в 40 000. Жираф и голый землекоп живут примерно одинаково (24–25 лет) и накапливают около 99 и 93 замен в год при различии массы в 23 000 раз.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-mutation-rate">«Скорость мутаций: что считают и на что делят»</a>, шаг <a href="#ns-uneven-clock">«Почему часы идут неравномерно»</a></p><p>Это <a href="#ns-g-S14-T07">соматические мутации</a>: потомкам они не передаются, и скорость молекулярных часов работа не измеряет. Она показывает другое: скорость мутирования — признак, различающийся у видов; авторы предполагают, что она ограничена в эволюции, — это гипотеза. Связь корреляционная: что именно ограничивает накопление мутаций, работа не устанавливает.</p><p><b>Как это узнали.</b> Читали геномы отдельных крипт — потомства одной стволовой клетки — и считали изменения, общие для клеток крипты и отсутствующие в других тканях.</p><p><b>Граница вывода.</b> Одна ткань, 16 видов (скорости — по 15); продолжать связь за пределы измеренных видов нельзя.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 3.</p><div class="static-quiz"><h3>Почему по этой работе нельзя сказать, что часы у мыши идут в 17 раз быстрее?</h3><ol><li><b>А.</b> Измерены мутации клеток тела, а не половых <i>(верный вариант)</i><br><span class="expl">Соматические мутации потомкам не передаются</span></li><li><b>Б.</b> Потому что мышь живёт слишком недолго <i>(неверный вариант)</i><br><span class="expl">Продолжительность жизни — часть результата, а не причина ограничения</span></li><li><b>В.</b> Потому что измерения в работе неточны <i>(неверный вариант)</i><br><span class="expl">Дело не в точности, а в том, что измерено</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-14.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-022-04618-z">Cagan A. et al. Somatic mutation rates scale with lifespan across mammals. Nature 2022; 604: 517–524</a></li></ul><p>Схема по данным работы, упрощённая · точки измерены; линия не проводится.</p></details></article><article class="card print-unit" id="ns-two-calibrations"><div class="eyebrow">Молекулярные часы · шаг 20 из 30</div><h2>Две калибровки: сдвиг и сужение интервала</h2><p class="lead">Калибровки задают не только дату, но и её неопределённость.</p><div class="note"><strong>Что показывает схема.</strong> Две полосы скоростей на одной оси: перекрываются или нет</div><p>Для узла К–Л по ископаемому получается 5,25–6,75 млн лет, по геологическому событию — 5,0–6,0. Скорость, совместимая с обеими калибровками сразу, — только 0,0020–0,00229 на сайт за миллион лет, и время сужается до 5,25–6,0. Если бы калибровки противоречили друг другу (общей части скоростей нет), это означало бы, что одна из них неверна или что скорость в линиях различается.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-calibration">«Калибровка: откуда берутся годы»</a>, шаг <a href="#ns-interval">«Интервал вместо даты»</a></p><p>Поэтому в работах приводят список калибровок и проверяют, как меняется результат, если убрать каждую из них. Добавление калибровок, а не удлинение последовательностей — главный путь сузить интервал, если различия уже измерены точно.</p><p><b>Граница вывода.</b> Расчёт по модели строгих часов с условными числами; в реальных расчётах калибровки задают распределениями вероятностей возраста.</p><p><b>На практикуме.</b> Вкладка 3, переключатель «Калибровка».</p><div class="static-quiz"><h3>Калибровка 1 даёт скорость 0,001–0,002, калибровка 2 — 0,003–0,004. Что это значит?</h3><ol><li><b>А.</b> Нужно взять среднюю скорость — 0,0025 на сайт <i>(неверный вариант)</i><br><span class="expl">Среднее не согласуется ни с одной калибровкой</span></li><li><b>Б.</b> Калибровки противоречат или скорости разные <i>(верный вариант)</i><br><span class="expl">Общей скорости нет</span></li><li><b>В.</b> Интервал оценки времени сузится <i>(неверный вариант)</i><br><span class="expl">Сужается только общая часть, а её нет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-14.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li></ul><p>Расчёт по модели · калибровки и d условны.</p></details></article><article class="card print-unit" id="ns-duplication"><div class="eyebrow">Откуда берутся новые гены · шаг 21 из 30</div><h2>Дупликация: как возникает копия гена</h2><p class="lead">Большинство новых генов — копии существующих; путь появления копии оставляет в геноме следы.</p><div class="note"><strong>Что показывает схема.</strong> Три пути возникновения копии гена</div><p><a href="#ns-g-S14-T50">Дупликация гена</a> создаёт вторую копию; копии, возникшие при дупликации в одной линии, — <a href="#ns-g-S14-T41">паралоги</a>. <a href="#ns-g-S14-T51">Неравный кроссинговер</a>: гомологичные хромосомы выравниваются со сдвигом по повторяющимся участкам, и одна хроматида получает две копии участка, другая — делецию; копия стоит рядом с исходной и сохраняет интроны. <a href="#ns-g-S14-T52">Ретропозиция</a>: зрелая мРНК (уже без интронов) обратно транскрибируется, ДНК-копия встраивается в другое место генома; такая копия без регуляторных участков часто не транскрибируется. <a href="#ns-g-S14-T53">Полногеномная дупликация</a> удваивает все гены сразу; в начале эволюции позвоночных геном удваивался целиком, у растений это особенно частое событие.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a> и <a href="seminar-12-route.html#reconstruction">семинар 12: «Как реконструируют свойства LUCA»</a></p><p>Дупликации отдельных генов возникают часто: у одной нематоды — около 1,2 на 10 млн генов за поколение, чаще, чем замена в отдельном нуклеотиде гена. Изменения числа копий затрагивают у людей больше нуклеотидов, чем однонуклеотидные варианты.</p><p><b>На практикуме.</b> Вкладка 4, панель «Как возникла копия», шаг 4.1.</p><p><b>Ограничения.</b> Через много миллионов лет копии расходятся, и путь их возникновения восстанавливают с допущениями.</p><div class="static-quiz"><h3>Копия гена стоит рядом с исходной и содержит те же интроны. Вероятный путь возникновения…</h3><ol><li><b>А.</b> Ретропозиция <i>(неверный вариант)</i><br><span class="expl">Ретрокопия не имеет интронов и обычно стоит в другом месте</span></li><li><b>Б.</b> Горизонтальный перенос <i>(неверный вариант)</i><br><span class="expl">Копия собственного гена рядом с исходной — признак дупликации</span></li><li><b>В.</b> Неравный кроссинговер <i>(верный вариант)</i><br><span class="expl">Участок удвоился на месте вместе с интронами</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1016/j.tig.2021.06.016">Kuzmin E., Taylor J.S., Boone C. Retention of duplicated genes in evolution. Trends Genet 2022; 38: 59–72</a></li><li><a href="https://doi.org/10.1038/s41586-026-10629-x">Zhu Y. et al. Whole-genome duplication shaped cell-type evolution in the vertebrate brain. Nature 2026</a></li></ul><p>Схема качественная · длины участков условны.</p></details></article><article class="card print-unit" id="ns-copy-outcomes"><div class="eyebrow">Откуда берутся новые гены · шаг 22 из 30</div><h2>Что происходит с копиями: четыре исхода</h2><p class="lead">Дупликация создаёт материал, но не функцию; дальнейшее зависит от отбора, дрейфа и случая.</p><div class="note"><strong>Что показывает схема.</strong> Дерево копий с четырьмя исходами в четырёх линиях</div><p>Самый частый исход — <a href="#ns-g-S14-T54">утрата функции</a> одной копией: изменения, выключающие одну из двух одинаковых копий, почти не удаляются отбором, и копия становится псевдогеном или исчезает. Копии сохраняются, если: важна доза продукта — <a href="#ns-g-S14-T55">сохранение дозы</a>, обе работают как предковый ген; копии поделили части предковой функции (места или время работы) — <a href="#ns-g-S14-T56">разделение функций</a>, и теперь нужны обе; одна копия приобрела свойство, которого не было у предка, — <a href="#ns-g-S14-T57">новая функция</a>. Исходы — не стадии одной последовательности и не равновероятны.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-duplication">«Дупликация: как возникает копия гена»</a>; вспомнить <a href="seminar-13-route.html#polymorphism">семинар 13: «Как сохраняется полиморфизм»</a></p><p>Пример модели: предковый ген работал в печени и в почке; у потомка первая копия работает только в печени, вторая — только в почке — разделение функций. Сохранившиеся копии нередко частично взаимозаменяемы: выключение одной компенсирует другая. Дупликацию часто описывают как источник новшеств, но новая функция — лишь один из исходов.</p><p><b>На практикуме.</b> Вкладка 4, «Дерево копий», шаги 4.2–4.3.</p><p><b>Ограничения.</b> На дереве видны только сохранившиеся копии; утраченные полностью приходится реконструировать.</p><div class="static-quiz"><h3>После дупликации обе копии работают в тех же тканях, что и предковый ген, и их выключение по одной снижает количество продукта. Это…</h3><ol><li><b>А.</b> Сохранение дозы <i>(верный вариант)</i><br><span class="expl">Обе копии делают то же, и важно их суммарное количество</span></li><li><b>Б.</b> Разделение функций <i>(неверный вариант)</i><br><span class="expl">Тогда каждая копия работала бы только в части тканей</span></li><li><b>В.</b> Новая функция <i>(неверный вариант)</i><br><span class="expl">Нового свойства нет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1016/j.tig.2021.06.016">Kuzmin E., Taylor J.S., Boone C. Retention of duplicated genes in evolution. Trends Genet 2022; 38: 59–72</a></li></ul><p>Схема качественная · части функции условны; исходы показаны параллельно.</p></details></article><article class="card print-unit" id="ns-de-novo"><div class="eyebrow">Откуда берутся новые гены · шаг 23 из 30</div><h2>Гены из некодирующей ДНК</h2><p class="lead">Не все новые гены — копии: некоторые возникают из последовательностей, которые у предков не кодировали белок.</p><div class="note"><strong>Что показывает схема.</strong> Выравнивание четырёх видов: общий стоп-кодон и открытая рамка у вида 1</div><p><a href="#ns-g-S14-T58">Ген de novo</a> возникает из некодирующей последовательности: в ней появляется <a href="#ns-g-S14-T60">открытая рамка считывания</a> — участок от старт-кодона до стоп-кодона без промежуточных стоп-кодонов, — и последовательность начинает транскрибироваться. Признак такого происхождения — у близких видов в той же позиции генома есть сходная последовательность, но рамка прервана, а сходного гена-предшественника нет. Транскрибируемый участок, возникший из последовательности, не бывшей геном, и содержащий транслируемую рамку, функция которой ещё не доказана, называют <a href="#ns-g-S14-T59">протогеном</a>.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-duplication">«Дупликация: как возникает копия гена»</a>; вспомнить <a href="seminar-10-route.html#genetic-code">семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»</a></p><p>У человека тысячи молодых транслируемых рамок, большей частью без доказанной функции; около 7000 из них предложены для включения в справочники генов и будут систематически проверены. Чтобы считать рамку белок-кодирующим геном, нужны надёжная модель транскрипта, целая рамка, признаки сохранения в эволюции и данные о белке. Большинство протогенов, вероятно, нейтральны и могут исчезнуть; часть приобретает функцию.</p><p><b>На практикуме.</b> Вкладка 4, карточка «ген из некодирующей ДНК», шаг 4.4.</p><p><b>Ограничения.</b> Отсутствие гена у других видов может означать и его утрату в их линиях, и неполноту сборки их геномов.</p><div class="static-quiz"><h3>Что нужно, чтобы считать молодую рамку считывания геном?</h3><ol><li><b>А.</b> Достаточно, что она транскрибируется <i>(неверный вариант)</i><br><span class="expl">Транскрибируются и многие некодирующие участки</span></li><li><b>Б.</b> Данные о транскрипте, рамке, белке и функции <i>(верный вариант)</i><br><span class="expl">Одной транскрипции мало</span></li><li><b>В.</b> Достаточно, что её нет у других видов <i>(неверный вариант)</i><br><span class="expl">Это признак молодости, но не функции</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41559-023-02014-y">Broeils L.A., Ruiz-Orera J., Snel B., Hubner N., van Heesch S. Evolution and implications of de novo genes in humans. Nat Ecol Evol 2023; 7: 804–815</a></li></ul><p>Схема качественная · последовательности условны.</p></details></article><article class="card print-unit" id="ns-transposons"><div class="eyebrow">Откуда берутся новые гены · шаг 24 из 30</div><h2>Мобильные элементы</h2><p class="lead">Около половины генома человека — последовательности мобильных элементов, распространявшихся копированием.</p><div class="note"><strong>Что показывает схема.</strong> Два механизма перемещения и три исхода вставки</div><p><a href="#ns-g-S14-T61">Мобильный генетический элемент</a> — последовательность, способная перемещаться или копироваться в новые места генома. <a href="#ns-g-S14-T63">ДНК-транспозоны</a> перемещаются как ДНК при участии фермента транспозазы; <a href="#ns-g-S14-T62">ретротранспозоны</a> копируются через РНК и обратную транскрипцию, поэтому их копии множатся. Вставка может нарушить ген или регуляторный участок, а участки элементов служат местами неравного кроссинговера и перестроек. Большинство вставок нейтрально или вредно для хозяина.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-13-route.html#conflict">семинар 13: «Внутригеномные конфликты»</a></p><p>Изредка последовательность элемента используется хозяином в новой роли — <a href="#ns-g-S14-T64">кооптация</a>: по осторожным оценкам, не менее четверти предполагаемых регуляторных участков генома человека происходит от мобильных элементов. Распространение элемента и его последующее использование хозяином — разные события: элемент распространяется потому, что копируется, а не «для» новшеств. Около половины мобильных элементов генома человека встроились уже в линии приматов.</p><p><b>На практикуме.</b> Вкладка 4, карточка «мобильный элемент», шаг 4.5.</p><p><b>Ограничения.</b> Большинство копий элементов в геноме человека повреждено и не способно перемещаться.</p><div class="static-quiz"><h3>Чем ретротранспозон отличается от ДНК-транспозона?</h3><ol><li><b>А.</b> Не может встраиваться в геном хозяина <i>(неверный вариант)</i><br><span class="expl">Встраивается, но через ДНК-копию с РНК</span></li><li><b>Б.</b> Всегда полезен для организма-хозяина <i>(неверный вариант)</i><br><span class="expl">Большинство вставок нейтрально или вредно</span></li><li><b>В.</b> Копируется через РНК и обратную транскрипцию <i>(верный вариант)</i><br><span class="expl">Поэтому его копии множатся</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-023-00652-3">Feschotte C. Transposable elements: McClintock’s legacy revisited. Nat Rev Genet 2023; 24: 797–800</a></li><li><a href="https://doi.org/10.1038/s41576-026-00980-0">Feschotte C. Transposable elements as catalysts of evolutionary innovation. Nat Rev Genet 2026</a></li></ul><p>Схема качественная · длины элементов условны.</p></details></article><article class="card print-unit" id="ns-hgt-eukaryotes"><div class="eyebrow">Откуда берутся новые гены · шаг 25 из 30</div><h2>Горизонтальный перенос генов у эукариот</h2><p class="lead">Перенос генов редок по сравнению с наследованием от предков даже у бактерий и архей, а в ядерных геномах эукариот — ещё реже; каждый случай требует проверки.</p><div class="note"><strong>Что показывает схема.</strong> Три проверки, отличающие перенос от загрязнения</div><p><a href="#ns-g-S14-T65">Горизонтальный перенос генов</a> — передача генетического материала вне связи «родитель — потомок». Чтобы перенос закрепился, должна пройти цепь маловероятных событий: ДНК попадает в клетку, встраивается в геном, ген транскрибируется, белок правильно сворачивается и работает; у многоклеточных ДНК должна ещё попасть в клетки зародышевой линии. Последнее условие — вариант с перенесённым геном должен <a href="#ns-g-S14-T05">закрепиться</a> в популяции, чаще всего под действием отбора: перенос, как и мутация, — событие, а не замещение. Поэтому даже у бактерий перенесённые гены — меньшинство по сравнению с унаследованными от предков, а в ядерных геномах эукариот их обычно ещё меньше. Отдельный случай — <a href="#ns-g-S14-T66">эндосимбиотический перенос</a> генов из митохондрий и пластид в ядро.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a> и <a href="seminar-12-route.html#gene-transfer">семинар 12: «Перенос генов в ядро и импорт белков»</a></p><p>Ген бактериального типа в геноме эукариоты может оказаться и загрязнением образца, и ошибкой сборки. Перенос признают, если ген встроен среди генов хозяина (с соседними эукариотическими генами, часто с интронами), найден в независимых образцах вида и на дереве генов стоит внутри определённой группы доноров.</p><p><b>На практикуме.</b> Вкладка 4, карточка «горизонтальный перенос»; «Найти причину» IV.</p><p><b>Ограничения.</b> Утраты генов в нескольких линиях могут дать картину, похожую на перенос; различают их по полноте выборки видов.</p><div class="static-quiz"><h3>Ген бактериального типа найден только в одной из трёх сборок генома вида и на участке без генов эукариотического типа. Вероятнее всего, это…</h3><ol><li><b>А.</b> Загрязнение образца <i>(верный вариант)</i><br><span class="expl">Настоящий перенос был бы встроен среди генов хозяина и повторялся бы в сборках</span></li><li><b>Б.</b> Горизонтальный перенос <i>(неверный вариант)</i><br><span class="expl">Признаков встраивания нет</span></li><li><b>В.</b> Перенос из митохондрии <i>(неверный вариант)</i><br><span class="expl">Митохондриальные гены в ядре стоят среди генов хозяина и есть у всех особей</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-023-00688-5">Keeling P.J. Horizontal gene transfer in eukaryotes: aligning theory with data. Nat Rev Genet 2024; 25: 416–430</a></li></ul><p>Схема качественная · дерево условно.</p></details></article><article class="card print-unit" id="ns-mtdna"><div class="eyebrow">Откуда берутся новые гены · шаг 26 из 30</div><h2>Митохондриальная ДНК как отдельный случай</h2><p class="lead"><a href="#ns-g-S14-T67">Митохондриальная ДНК</a> наследуется иначе, чем ядерная, и поэтому рассказывает только часть истории популяции.</p><div class="note"><strong>Что показывает схема.</strong> Родословная с материнской передачей мтДНК и клетка
