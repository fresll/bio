нейтральных изменений","correct":true,"feedback":"Если синонимичные замены вредны, отношение искажается"},{"id":"S14-L13-2","text":"Потому что dN/dS считают только для дрожжей","correct":false,"feedback":"Показатель используют для любых кодирующих последовательностей"},{"id":"S14-L13-3","text":"Потому что спор показал, что генетический код у дрожжей другой","correct":false,"feedback":"Спор — о приспособленности, а не о коде"}]},"widget":{"kind":"dna","title":"","s":{"title":"По каким данным расходятся стороны в споре о синонимичных мутациях?","status":"Схема трёх опубликованных позиций и одного наблюдения · ни одна позиция не выделена","modes_label":"Позиция","modes":["утверждение","возражение","ответ","человек"],"args":[{"pos":"claim"},{"pos":"objection"},{"pos":"reply"},{"pos":"human"}],"notes":["75,9 % из 1866 синонимичных значимо вредны","Нет парных контролей; технические повторы; побочные мутации","603 генома: побочные мутации у 26,7 %; повтор по 11 генам — 86,5 %; вместе с прежними — 76,9 % из 1621","Связь с признаками: синонимичные — 2 гена, миссенс — 27, обрывающие белок — 55"],"static":["Три одинаково оформленные позиции спора о дрожжах и полоса данных о человеке; итог — спор не закрыт"],"scene":"s14_a2","L":{"a2_head":"Позиции в споре о синонимичных мутациях дрожжей (оформлены одинаково)","a2_claim_t":"Утверждение","a2_objection_t":"Возражение","a2_reply_t":"Ответ","a2_claim":"Из 1866 синонимичных мутантов 75,9 % значимо вредны — почти как несинонимичных (75,8 %). Медиана приспособленности: синонимичных 0,989, несинонимичных 0,988, со стоп-кодоном 0,940","a2_b_head":"Человек: гены, связанные хотя бы с одним признаком, по редким вариантам (4911 признаков)","a2_h1_s":"обрывающим белок","a2_of":"{n} из 18 762","a2_h2_s":"миссенс","a2_h3_s":"синонимичным","a2_h4":"наблюдение в одной большой выборке людей","a2_objection":"Не было исходных штаммов, полученных тем же путём для каждого гена; повторы были техническими, а не независимыми; побочные мутации при получении штаммов могли сделать нейтральные замены «вредными». Проверка малых эффектов отдельным измерением роста дала значения около 1","a2_reply":"Прочитано 603 генома: ошибочных разрезов при редактировании нет, но у 26,7 % из 580 прочитанных мутантов есть побочные мутации. Повтор с четырьмя независимыми смесями и своим исходным штаммом для каждого гена; в повторе по 11 генам значимо не нейтральны 86,5 % синонимичных; вместе с прежними данными по шести генам, где влияние побочных мутаций пренебрежимо мало, — 76,9 % из 1621 синонимичных и 77,0 % из 5386 несинонимичных","a2_open":"Спор о дрожжах не закрыт. У человека редкие синонимичные варианты связаны с признаками гораздо реже, чем миссенс-варианты и варианты, обрывающие белок"}}},"adv_kind":"Утверждение и возражение"},{"id":"site-average","num":14,"section":1,"questions":[2],"title":"Среднее по гену скрывает отбор в отдельных кодонах","keywords":[],"lead":["Немногие кодоны под положительным отбором не поднимают среднее по гену выше 1."],"mechanism":["Условный ген из 100 кодонов: в 95 кодонах изменения аминокислот закрепляются в 10 раз реже синонимичных (ω = 0,1), в 5 кодонах — в 5 раз чаще (ω = 5). Если числа сайтов в кодонах одинаковы, среднее по гену (95 × 0,1 + 5 × 5) / 100 = 0,345. По одному этому числу ген выглядит как ген под очищающим отбором, хотя в пяти кодонах действовал положительный."],"paragraphs":["Так устроены, например, гены белков, распознающих чужеродные молекулы: в участке узнавания несинонимичные замены закрепляются чаще синонимичных, а в остальной части гена — реже. Чтобы найти такие кодоны, используют модели, в которых у разных кодонов своё значение показателя, и сравнивают, насколько хорошо разные модели описывают данные.","<b>Граница вывода.<\/b> Расчёт по модели с условными числами; в реальных генах доли кодонов и значения показателя оценивают по данным, а для коротких последовательностей оценки по отдельным кодонам ненадёжны.","<b>На практикуме.<\/b> Вкладка 2, шаг 2.5."],"conditions":"Расчёт по модели · 95 и 5 кодонов, ω = 0,1 и 5 — условные числа.","sources":["src_01"],"base":"БИО-14·11, БИО-14·12","level":"adv","next_base":"accumulation","quiz":{"id":"S14-L14","question":"Если в той же модели положительный отбор действует не на 5, а на 20 кодонов (ω = 5), среднее будет…","options":[{"id":"S14-L14-1","text":"0,345, как прежде","correct":false,"feedback":"Вклад кодонов под положительным отбором вырос"},{"id":"S14-L14-2","text":"1,08 — больше 1","correct":true,"feedback":"(80 × 0,1 + 20 × 5) / 100 = 1,08"},{"id":"S14-L14-3","text":"5","correct":false,"feedback":"Среднее учитывает и 80 кодонов с ω = 0,1"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как среднее по гену скрывает отбор в кодонах?","status":"Расчёт по модели · условные числа","modes_label":"Кодоны под положительным отбором","modes":["5 из 100","20 из 100"],"args":[{"pos":5},{"pos":20}],"notes":["Среднее 0,345 — меньше 1","Среднее 1,08 — больше 1"],"static":["100 ячеек-кодонов двух цветов и шкала среднего с отметкой 1"],"scene":"s14_r_mix","L":{"r_mix_head":"100 кодонов: {k} под положительным отбором (ω = 5), остальные — под очищающим (ω = 0,1)","r_mix_pur":"кодоны ω = 0,1","r_mix_pos":"кодоны ω = 5","r_mix_mean":"среднее по гену {v}"},"after":[1],"after_hint":"после ответа"}},"adv_kind":"Исследование модели"},{"id":"accumulation","num":15,"section":2,"questions":[3],"title":"Различия накапливаются со временем","keywords":["Молекулярные часы","Длина ветви"],"lead":["Если нейтральные замены накапливаются с постоянной скоростью, число различий двух последовательностей растёт пропорционально времени, прошедшему от их общего предка."],"mechanism":["[[T42|Молекулярные часы]] опираются на нейтральную теорию: скорость нейтральных замещений равна скорости нейтральных мутаций; если она постоянна, различия растут равномерно. После расхождения двух видов замены накапливаются в обеих линиях, поэтому доля различающихся сайтов d = 2rT, где r — скорость замещений на сайт за единицу времени в одной линии, T — время от расхождения. Отсюда T = d / (2r). На филогенетическом дереве [[T49|длина ветви]] — число замен на сайт в этой линии."],"paragraphs":["Пример модели: виды разошлись 6 млн лет назад и различаются в 2,4 % сайтов (d = 0,024) — значит, скорость в каждой линии 0,002 на сайт за миллион лет; по ней можно датировать другие узлы. Для часов лучше подходят изменения, близкие к нейтральным (синонимичные позиции, некодирующие участки); последовательности под сильным отбором меняются неравномерно.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.1.","<b>Ограничения.<\/b> При больших различиях одна позиция меняется повторно, и d растёт медленнее времени (насыщение); для дальних сравнений нужны поправки."],"conditions":"Расчёт по модели · d и r условны.","sources":["src_01","src_02"],"base":"БИО-14·8; вспомнить [[seminar-12-route.html#r3|семинар 12: «Как датируют LUCA и почему это модель»]]","quiz":{"id":"S14-L15","question":"Различие двух видов вдвое больше, чем у другой пары, а скорость в линиях та же. Что можно сказать о времени расхождения?","options":[{"id":"S14-L15-1","text":"Примерно вдвое меньше","correct":false,"feedback":"Больше различий при той же скорости — больше времени"},{"id":"S14-L15-2","text":"Такое же, как у другой пары","correct":false,"feedback":"Различия растут со временем; при той же скорости вдвое больше различий — вдвое больше время"},{"id":"S14-L15-3","text":"Примерно вдвое больше","correct":true,"feedback":"При постоянной скорости T пропорционально d"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как различия растут со временем?","status":"Расчёт по модели · различия и время условны","modes_label":"Расчёт","modes":["d = 2rT","r по известному времени"],"args":[{"mode":"basic","show":"formula"},{"mode":"basic","show":"rate"}],"notes":["Замены копятся в обеих линиях: d = 2rT","r = 0,024 / (2 × 6) = 0,002 на сайт за миллион лет"],"static":["Дерево К–Л, ветви по 0,012 замены на сайт, отметка 6 млн лет с подписью «известно условно», показание r = 0,002"],"scene":"s14_t3","L":{"t3_r_head":"Скорость по известному времени: виды К и Л","t3_sp_K":"вид К","t3_sp_L":"вид Л","t3_r_anc":"общий предок","t3_ax_ma":"млн лет назад","t3_r_known":"6 млн лет назад — известно условно, без неопределённости","t3_r_d":"Различия К и Л: d = 0,024 (2,4 % сайтов)","t3_r_formula":"Замены копятся в обеих линиях: d = 2rT","t3_bl_subs":"длина ветви — замены на сайт","t3_r_branch":"0,012 замены на сайт","t3_r_rate":"r = 0,002 на сайт за миллион лет в каждой линии"}}}},{"id":"calibration","num":16,"section":2,"questions":[3],"title":"Калибровка: откуда берутся годы","keywords":["Калибровка"],"lead":["Последовательности дают только число замен; чтобы перевести его в годы, нужна [[T43|калибровка]] — узел дерева с независимо известным возрастом."],"mechanism":["Число различий d — произведение скорости на время, и по одному произведению нельзя найти оба множителя: малое время при большой скорости и большое время при малой скорости дают одно и то же d. Без калибровки получают дерево и относительные длины ветвей, но не годы. Калибровку берут из ископаемых (обычно они задают нижнюю границу возраста узла: линия не моложе находки), из геологических событий (разделение суши, появление острова) или из дат образцов (для вирусов и бактерий). По калибровочному узлу находят скорость r = d / (2T), затем применяют её к другим узлам."],"paragraphs":["В модели практикума: ископаемое показывает, что линии К и Н разошлись 14–18 млн лет назад, d(К,Н) = 0,064, отсюда r = 0,00178–0,00229 и время узла К–Л — 5,25–6,75 млн лет. Возраст калибровки известен с неопределённостью, и она переходит в оценку. Даже при очень длинных последовательностях неопределённость дат остаётся, потому что её главный источник — калибровки.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.2–3.3.","<b>Ограничения.<\/b> Калибровка верна, только если ископаемое отнесено к правильной линии, а возраст слоя определён верно."],"conditions":"Расчёт по модели · возраст калибровки и d условны.","sources":["src_01","src_02"],"base":"БИО-14·15","quiz":{"id":"S14-L16","question":"Что даст анализ очень длинных последовательностей без калибровки?","options":[{"id":"S14-L16-1","text":"Дерево в заменах на сайт, но не даты","correct":true,"feedback":"Длина уточняет d, но не разделяет скорость и время"},{"id":"S14-L16-2","text":"Точные даты расхождения видов","correct":false,"feedback":"Без внешнего возраста годы не определить"},{"id":"S14-L16-3","text":"Ничего: без дат нет и дерева","correct":false,"feedback":"Дерево и относительные расстояния получают и без калибровки"}]},"widget":{"kind":"dna","title":"","s":{"title":"Зачем нужна калибровка?","status":"Расчёт по модели · возраст калибровки условен","modes_label":"Калибровка","modes":["нет","ископаемое"],"args":[{"cal":"none"},{"cal":"cal1"}],"notes":["Дерево в заменах на сайт; времени нет","r = 0,00178–0,00229; К–Л — 5,25–6,75 млн лет"],"static":["Без калибровки — только дерево; с ископаемым — интервал для узла К–Л"],"scene":"s14_t3","L":{"t3_c_head":"Дерево видов К, Л, М, Н (строгие часы; числа условные)","t3_sp_K":"вид К","t3_sp_L":"вид Л","t3_sp_M":"вид М","t3_sp_N":"вид Н","t3_ax_subs":"замены на сайт","t3_bl_subs":"длина ветви — замены на сайт","t3_b_head":"Шкала времени, млн лет назад: узел К–Л","t3_none":"время не определено: дерево есть, калибровки нет","t3_ax_ma":"млн лет назад","t3_bl_ma":"длина ветви — млн лет","t3_cal1_lab":"ископаемое: К–Н, 14–18 млн лет","t3_m_cal1":"ископаемое","t3_interval":"интервал оценки"}}}},{"id":"uneven-clock","num":17,"section":2,"questions":[3],"title":"Почему часы идут неравномерно","keywords":["Время поколения","Строгие часы","Нестрогие часы","Внешняя группа"],"lead":["Скорость замещений различается между линиями, генами и участками генома; часы с одной скоростью для всех ветвей — допущение."],"mechanism":["Скорость зависит от [[T48|времени поколения]] (за год у видов с коротким поколением проходит больше поколений), от скорости мутаций, которая сама различается между видами, от численности — через долю почти нейтральных изменений (БИО-14·9) — и от давления отбора на участок. [[T44|Строгие часы]] принимают одну скорость для всех ветвей; [[T45|нестрогие часы]] позволяют скоростям различаться и оценивают их вместе с датами. Неравенство скоростей выявляет [[T47|внешняя группа]] — вид, отделившийся раньше: при равных скоростях два вида от неё одинаково далеки."],"paragraphs":["Пример модели: виды К и Л разошлись 6 млн лет назад, в линии Л скорость вдвое выше, чем в линии К; строгие часы с одной скоростью дали бы 9 млн лет. Расстояния до внешней группы М — 0,048 и 0,060: линия Л ушла дальше. У некоторых белков позвоночных различия растут пропорционально годам, а не поколениям; почти нейтральная теория объясняет это тем, что у видов с длинным поколением численность меньше.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.5; «Найти причину» III.","<b>Ограничения.<\/b> Если скорость меняется в линии плавно, внешняя группа показывает только суммарную разницу."],"conditions":"Расчёт по модели · скорости и времена условны.","sources":["src_01","src_02"],"base":"БИО-14·9, БИО-14·15","quiz":{"id":"S14-L17","question":"От внешней группы вид К отстоит на 0,05, вид Л — на 0,07. Что это значит?","options":[{"id":"S14-L17-1","text":"Вид Л возник раньше вида К","correct":false,"feedback":"Оба вида — современные; время от общего предка у них одно"},{"id":"S14-L17-2","text":"В линии Л замены копились быстрее","correct":true,"feedback":"При равных скоростях расстояния были бы равны"},{"id":"S14-L17-3","text":"Внешняя группа для сравнения выбрана неверно","correct":false,"feedback":"Это возможно, но прямой вывод из данных — неравенство скоростей"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как неравные скорости искажают оценку?","status":"Расчёт по модели · скорости условны","modes_label":"Скорости","modes":["равные","Л вдвое быстрее","внешняя группа"],"args":[{"mode":"uneven","v":"equal"},{"mode":"uneven","v":"fast"},{"mode":"uneven","v":"outgroup"}],"notes":["Равные скорости: d(К,Л) = 0,024, оценка 6 млн лет; d(К,М) = d(Л,М) = 0,048","Линия Л вдвое быстрее: строгие часы дали бы 9","Расстояния до М — 0,048 и 0,060"],"static":["Дерево с удлинённой ветвью Л и расстояниями до внешней группы"],"scene":"s14_t3","L":{"t3_u_head":"Неравные скорости: К и Л разошлись 6 млн лет назад, М — внешняя группа","t3_u_K":"К","t3_u_L":"Л","t3_u_M":"М — внешняя группа","t3_u_scale":"0,012 замены на сайт","t3_bl_subs":"длина ветви — замены на сайт","t3_u_est6":"строгие часы: {T} млн лет — совпадает с истинным временем 6","t3_u_Lf":"Л (скорость вдвое выше)","t3_u_est9":"строгие часы с одной скоростью 0,002 дали бы {T} млн лет вместо 6"}}},"exam_quiz":{"id":"S14-E07","question":"Что такое внешняя группа?","options":[{"id":"S14-E07-1","text":"Вид, отделившийся раньше сравниваемых","correct":true,"feedback":"По ней определяют предковое состояние и неравенство скоростей"},{"id":"S14-E07-2","text":"Вид с другим генетическим кодом","correct":false,"feedback":"Код у сравниваемых видов один"},{"id":"S14-E07-3","text":"Популяция мигрантов","correct":false,"feedback":"Это понятие популяционной генетики, а не дерева"}]}},{"id":"interval","num":18,"section":2,"questions":[3],"title":"Интервал вместо даты","keywords":["Интервал оценки"],"lead":["Результат молекулярной датировки — [[T46|интервал оценки]]; его ширина показывает, насколько надёжна дата."],"mechanism":["В оценку времени складываются неопределённости калибровок, модели скоростей, модели замен, выбора генов и видов. Поэтому дату сообщают интервалом (например, 95 %-м интервалом), а не одним числом. Замена одной калибровки другой сдвигает интервал; согласованная дополнительная калибровка сужает его. В модели практикума: по ископаемому — 5,25–6,75, по геологическому событию — 5,0–6,0, по обеим — 5,25–6,0 млн лет."],"paragraphs":["Даты, полученные разными работами, сравнивают с учётом калибровок и моделей; совпадение интервалов не доказывает правильности обоих, а расхождение указывает, где искать причину. Молекулярные часы не заменяют палеонтологических и геологических данных: они переводят различия в годы только через них.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.4; полоса «интервал оценки».","<b>Ограничения.<\/b> В модели интервал получается простым переносом границ калибровки; в реальных расчётах распределения возрастов, скоростей и времён оцениваются совместно."],"conditions":"Расчёт по модели · интервалы условны.","sources":["src_02"],"base":"БИО-14·16, БИО-14·17","quiz":{"id":"S14-L18","question":"Две калибровки дают для узла 4–6 и 5–7 млн лет. Если они согласуются, интервал по обеим…","options":[{"id":"S14-L18-1","text":"4–7 млн лет","correct":false,"feedback":"Объединение интервалов не учитывает, что верны обе калибровки"},{"id":"S14-L18-2","text":"Ровно 5,5 млн лет","correct":false,"feedback":"Обе калибровки сами заданы интервалами"},{"id":"S14-L18-3","text":"5–6 млн лет","correct":true,"feedback":"Время должно быть совместимо с обеими"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему результат — интервал?","status":"Расчёт по модели · интервалы условны","modes_label":"Калибровки","modes":["ископаемое","геологическое событие","обе"],"args":[{"cal":"cal1"},{"cal":"cal2"},{"cal":"both"}],"notes":["5,25–6,75 млн лет","5,0–6,0 млн лет","5,25–6,0 млн лет — общая часть"],"static":["Полосы интервалов узла К–Л для трёх вариантов калибровки"],"scene":"s14_t3","L":{"t3_c_head":"Дерево видов К, Л, М, Н (строгие часы; числа условные)","t3_sp_K":"вид К","t3_sp_L":"вид Л","t3_sp_M":"вид М","t3_sp_N":"вид Н","t3_ax_ma":"млн лет назад","t3_bl_ma":"длина ветви — млн лет","t3_cal1_lab":"ископаемое: К–Н, 14–18 млн лет","t3_b_head":"Шкала времени, млн лет назад: узел К–Л","t3_m_cal1":"ископаемое","t3_interval":"интервал оценки","t3_cal2_lab":"геологическое событие: К–М, 10–12 млн лет","t3_m_cal2":"геологическое событие","t3_m_both":"обе"}}}},{"id":"somatic-lifespan","num":19,"section":2,"questions":[3],"title":"Скорость мутаций в клетках тела и продолжительность жизни","keywords":["Соматическая мутация"],"lead":["Скорость мутирования клеток тела различается у видов млекопитающих примерно в 17 раз и связана с продолжительностью их жизни."],"mechanism":["Геномы стволовых клеток кишечника прочитаны у 16 видов млекопитающих; в сравнение скоростей вошли 15 видов, у которых известен возраст особей. За год в клетке накапливается от 47 (человек) до 796 (мышь) однонуклеотидных замен на геном. Чем короче жизнь вида, тем выше скорость: обратная величина продолжительности жизни объясняет 82 % различий между видами. К концу жизни в клетке набирается сопоставимое число замен — в среднем около 3200 (95 %-й доверительный интервал 2684–3729), хотя продолжительность жизни различается в 30 раз, а масса тела — в 40 000. Жираф и голый землекоп живут примерно одинаково (24–25 лет) и накапливают около 99 и 93 замен в год при различии массы в 23 000 раз."],"paragraphs":["Это [[T07|соматические мутации]]: потомкам они не передаются, и скорость молекулярных часов работа не измеряет. Она показывает другое: скорость мутирования — признак, различающийся у видов; авторы предполагают, что она ограничена в эволюции, — это гипотеза. Связь корреляционная: что именно ограничивает накопление мутаций, работа не устанавливает.","<b>Как это узнали.<\/b> Читали геномы отдельных крипт — потомства одной стволовой клетки — и считали изменения, общие для клеток крипты и отсутствующие в других тканях.","<b>Граница вывода.<\/b> Одна ткань, 16 видов (скорости — по 15); продолжать связь за пределы измеренных видов нельзя.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 3."],"conditions":"Схема по данным работы, упрощённая · точки измерены; линия не проводится.","sources":["src_08"],"base":"БИО-14·3, БИО-14·17","level":"adv","next_base":"duplication","quiz":{"id":"S14-L19","question":"Почему по этой работе нельзя сказать, что часы у мыши идут в 17 раз быстрее?","options":[{"id":"S14-L19-1","text":"Измерены мутации клеток тела, а не половых","correct":true,"feedback":"Соматические мутации потомкам не передаются"},{"id":"S14-L19-2","text":"Потому что мышь живёт слишком недолго","correct":false,"feedback":"Продолжительность жизни — часть результата, а не причина ограничения"},{"id":"S14-L19-3","text":"Потому что измерения в работе неточны","correct":false,"feedback":"Дело не в точности, а в том, что измерено"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как скорость соматических мутаций связана с продолжительностью жизни?","status":"Схема по данным работы, упрощённая · линия не проводится","modes_label":"Виды","modes":["все виды","жираф и голый землекоп","мышь и человек"],"args":[{"sel":"all"},{"sel":["giraffe","naked_mole_rat"]},{"sel":["mouse","human"]}],"notes":["15 видов; скорость тем выше, чем короче жизнь","99 и 93 замены в год при различии массы в 23 000 раз","796 и 47 в год; к концу жизни около 2900 и 3900"],"static":["Точечная диаграмма 15 видов в логарифмических осях"],"scene":"s14_a3","L":{"a3_head":"Мутации клеток тела и продолжительность жизни: 15 видов, линия не проводится","a3_x":"продолжительность жизни, лет","log_scale":"логарифмическая шкала","a3_y":"замен на геном клетки в год","a3_sp1":"мышь","a3_sp2":"крыса","a3_sp3":"хорёк","a3_sp4":"кошка","a3_sp5":"собака","a3_sp6":"кролик","a3_sp7":"тигр","a3_sp8":"корова","a3_sp9":"лев","a3_sp10":"лошадь","a3_sp11":"кошачий лемур","a3_sp12":"жираф","a3_sp13":"голый землекоп","a3_sp14":"гвереца","a3_sp15":"человек","s4_hidden":"откроется после ответа","a3_end":"в среднем около 3200 замен на геном клетки (95 %-й доверительный интервал 2684–3729); у разных видов — различие примерно втрое, хотя продолжительность жизни различается в 30 раз, а масса тела — в 40 000 раз","a3_leg":"замен в год / продолжительность жизни, лет","a3_calc":"расчёт (скорость × продолжительность жизни): мышь 796 × 3,68 ≈ 2930; человек 47,1 × 83,67 ≈ 3940"}},"zoomNarrow":true},"adv_kind":"Новые данные"},{"id":"two-calibrations","num":20,"section":2,"questions":[3],"title":"Две калибровки: сдвиг и сужение интервала","keywords":[],"lead":["Калибровки задают не только дату, но и её неопределённость."],"mechanism":["Для узла К–Л по ископаемому получается 5,25–6,75 млн лет, по геологическому событию — 5,0–6,0. Скорость, совместимая с обеими калибровками сразу, — только 0,0020–0,00229 на сайт за миллион лет, и время сужается до 5,25–6,0. Если бы калибровки противоречили друг другу (общей части скоростей нет), это означало бы, что одна из них неверна или что скорость в линиях различается."],"paragraphs":["Поэтому в работах приводят список калибровок и проверяют, как меняется результат, если убрать каждую из них. Добавление калибровок, а не удлинение последовательностей — главный путь сузить интервал, если различия уже измерены точно.","<b>Граница вывода.<\/b> Расчёт по модели строгих часов с условными числами; в реальных расчётах калибровки задают распределениями вероятностей возраста.","<b>На практикуме.<\/b> Вкладка 3, переключатель «Калибровка»."],"conditions":"Расчёт по модели · калибровки и d условны.","sources":["src_02"],"base":"БИО-14·16, БИО-14·18","level":"adv","next_base":"duplication","quiz":{"id":"S14-L20","question":"Калибровка 1 даёт скорость 0,001–0,002, калибровка 2 — 0,003–0,004. Что это значит?","options":[{"id":"S14-L20-1","text":"Нужно взять среднюю скорость — 0,0025 на сайт","correct":false,"feedback":"Среднее не согласуется ни с одной калибровкой"},{"id":"S14-L20-2","text":"Калибровки противоречат или скорости разные","correct":true,"feedback":"Общей скорости нет"},{"id":"S14-L20-3","text":"Интервал оценки времени сузится","correct":false,"feedback":"Сужается только общая часть, а её нет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как две калибровки сдвигают и сужают интервал?","status":"Расчёт по модели · условные числа","modes_label":"Калибровки","modes":["согласованные","противоречащие"],"args":[{"ok":true},{"ok":false}],"notes":["Общая часть скоростей 0,0020–0,00229 → 5,25–6,0 млн лет","Скорости 0,001–0,002 и 0,003–0,004 не пересекаются"],"static":["Две полосы скоростей на одной оси: перекрываются или нет"],"scene":"s14_r_calib2","L":{"r_calib2_head":"Скорости по двум калибровкам на одной оси","r_calib2_x":"скорость, замен на сайт за млн лет","r_calib2_c1":"скорости по калибровке 1","r_calib2_c2":"по калибровке 2","r_calib2_common":"общая часть","r_calib2_none":"общей части нет: калибровки противоречат или скорости в линиях разные"},"after":[1],"after_hint":"после ответа"}},"adv_kind":"Исследование модели"},{"id":"duplication","num":21,"section":3,"questions":[4],"title":"Дупликация: как возникает копия гена","keywords":["Дупликация гена","Паралоги","Неравный кроссинговер","Ретропозиция","Полногеномная дупликация"],"lead":["Большинство новых генов — копии существующих; путь появления копии оставляет в геноме следы."],"mechanism":["[[T50|Дупликация гена]] создаёт вторую копию; копии, возникшие при дупликации в одной линии, — [[T41|паралоги]]. [[T51|Неравный кроссинговер]]: гомологичные хромосомы выравниваются со сдвигом по повторяющимся участкам, и одна хроматида получает две копии участка, другая — делецию; копия стоит рядом с исходной и сохраняет интроны. [[T52|Ретропозиция]]: зрелая мРНК (уже без интронов) обратно транскрибируется, ДНК-копия встраивается в другое место генома; такая копия без регуляторных участков часто не транскрибируется. [[T53|Полногеномная дупликация]] удваивает все гены сразу; в начале эволюции позвоночных геном удваивался целиком, у растений это особенно частое событие."],"paragraphs":["Дупликации отдельных генов возникают часто: у одной нематоды — около 1,2 на 10 млн генов за поколение, чаще, чем замена в отдельном нуклеотиде гена. Изменения числа копий затрагивают у людей больше нуклеотидов, чем однонуклеотидные варианты.","<b>На практикуме.<\/b> Вкладка 4, панель «Как возникла копия», шаг 4.1.","<b>Ограничения.<\/b> Через много миллионов лет копии расходятся, и путь их возникновения восстанавливают с допущениями."],"conditions":"Схема качественная · длины участков условны.","sources":["src_01","src_09","src_10"],"base":"вспомнить [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]] и [[seminar-12-route.html#reconstruction|семинар 12: «Как реконструируют свойства LUCA»]]","quiz":{"id":"S14-L21","question":"Копия гена стоит рядом с исходной и содержит те же интроны. Вероятный путь возникновения…","options":[{"id":"S14-L21-1","text":"Ретропозиция","correct":false,"feedback":"Ретрокопия не имеет интронов и обычно стоит в другом месте"},{"id":"S14-L21-2","text":"Горизонтальный перенос","correct":false,"feedback":"Копия собственного гена рядом с исходной — признак дупликации"},{"id":"S14-L21-3","text":"Неравный кроссинговер","correct":true,"feedback":"Участок удвоился на месте вместе с интронами"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как возникает копия гена?","status":"Схема качественная · длины условны","modes_label":"Механизм","modes":["неравный кроссинговер","ретропозиция","удвоение генома"],"args":[{"panel":"origin","m":"uec"},{"panel":"origin","m":"retro"},{"panel":"origin","m":"wgd"}],"notes":["Копия рядом и с интронами","Копия без интронов, в другом месте","Удвоены все гены"],"static":["Три пути возникновения копии гена"],"scene":"s14_t4","L":{"t4_m_uec":"неравный кроссинговер","t4_o_head":"Как возникла копия гена: {m}","t4_o_homol":"Гомологичные хромосомы в мейозе выровнены со сдвигом по повтору","t4_o_chrA":"хроматида 1","t4_o_chrB":"хроматида 2","t4_o_shift":"обмен со сдвигом","t4_o_res1":"после обмена","t4_o_near":"две копии рядом","t4_o_res2":"после обмена","t4_o_del":"делеция","t4_o_uec_note":"Копия рядом с исходной, у копии те же экзоны и интроны","t4_m_retro":"ретропозиция","t4_o_chr1":"хромосома 1","t4_o_splice":"транскрипция и удаление интронов","t4_o_mrna":"зрелая мРНК","t4_o_rt":"обратная транскрипция","t4_o_cdna":"ДНК-копия без интронов","t4_o_ins":"встраивание в другое место","t4_o_chr2":"хромосома 2","t4_o_retro_note":"Копия без интронов, в другом месте генома, на конце — участок из многих A","t4_m_wgd":"удвоение генома","t4_o_before":"до удвоения: два набора","t4_o_after":"после удвоения: все хромосомы удвоены","t4_o_wgd_note":"Копии получают все гены сразу; каждая копия сохраняет интроны"}},"zoomNarrow":true},"exam_quiz":{"id":"S14-E09","question":"Что такое ортологи?","options":[{"id":"S14-E09-1","text":"Копии гена, разошедшиеся после дупликации в одной линии","correct":false,"feedback":"Это паралоги"},{"id":"S14-E09-2","text":"Гены, полученные горизонтальным переносом","correct":false,"feedback":"Перенесённые гены не наследуются от общего предка видов"},{"id":"S14-E09-3","text":"Гены видов, разошедшиеся при видообразовании","correct":true,"feedback":"Их и сравнивают при расчёте dN/dS"}]}},{"id":"copy-outcomes","num":22,"section":3,"questions":[4],"title":"Что происходит с копиями: четыре исхода","keywords":["Утрата функции копией","Сохранение дозы","Разделение функций","Новая функция"],"lead":["Дупликация создаёт материал, но не функцию; дальнейшее зависит от отбора, дрейфа и случая."],"mechanism":["Самый частый исход — [[T54|утрата функции]] одной копией: изменения, выключающие одну из двух одинаковых копий, почти не удаляются отбором, и копия становится псевдогеном или исчезает. Копии сохраняются, если: важна доза продукта — [[T55|сохранение дозы]], обе работают как предковый ген; копии поделили части предковой функции (места или время работы) — [[T56|разделение функций]], и теперь нужны обе; одна копия приобрела свойство, которого не было у предка, — [[T57|новая функция]]. Исходы — не стадии одной последовательности и не равновероятны."],"paragraphs":["Пример модели: предковый ген работал в печени и в почке; у потомка первая копия работает только в печени, вторая — только в почке — разделение функций. Сохранившиеся копии нередко частично взаимозаменяемы: выключение одной компенсирует другая. Дупликацию часто описывают как источник новшеств, но новая функция — лишь один из исходов.","<b>На практикуме.<\/b> Вкладка 4, «Дерево копий», шаги 4.2–4.3.","<b>Ограничения.<\/b> На дереве видны только сохранившиеся копии; утраченные полностью приходится реконструировать."],"conditions":"Схема качественная · части функции условны; исходы показаны параллельно.","sources":["src_01","src_09"],"base":"БИО-14·21; вспомнить [[seminar-13-route.html#polymorphism|семинар 13: «Как сохраняется полиморфизм»]]","quiz":{"id":"S14-L22","question":"После дупликации обе копии работают в тех же тканях, что и предковый ген, и их выключение по одной снижает количество продукта. Это…","options":[{"id":"S14-L22-1","text":"Сохранение дозы","correct":true,"feedback":"Обе копии делают то же, и важно их суммарное количество"},{"id":"S14-L22-2","text":"Разделение функций","correct":false,"feedback":"Тогда каждая копия работала бы только в части тканей"},{"id":"S14-L22-3","text":"Новая функция","correct":false,"feedback":"Нового свойства нет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что происходит с копиями?","status":"Схема качественная · части функции условны; исходы не равновероятны","modes_label":"Исход","modes":["утрата функции","доза","разделение функций","новая функция"],"args":[{"o":"loss"},{"o":"dosage"},{"o":"subfunc"},{"o":"neofunc"}],"notes":["Одна копия выключена: псевдоген","Обе копии как предковый ген","Копии поделили части функции","Одна копия с новым свойством"],"static":["Дерево копий с четырьмя исходами в четырёх линиях"],"scene":"s14_r_copies","L":{"t4_t_head":"Дерево копий: предковый ген G и четыре линии потомков (схема качественная)","t4_lg_f1":"часть функции 1","t4_lg_f2":"часть функции 2","t4_lg_new":"новая функция","t4_lg_x":"утрата","t4_t_f1_t":"часть функции 1 (круг)","t4_t_f2_t":"часть функции 2 (треугольник)","t4_t_anc":"предковый ген","t4_t_dup":"дупликация","t4_t_loss_t":"утрата функции (крест)","t4_out_loss":"утрата функции одной копией","t4_t_pseudo":"псевдоген","t4_out_dosage":"сохранение обеих копий (доза)","t4_t_lost_t":"утраченная часть функции (пунктир)","t4_out_subfunc":"разделение функций","t4_t_new_t":"новая функция (ромб)","t4_out_neofunc":"новая функция","t4_t_note":"Исходы показаны параллельно; это не стадии и не равновероятные события: чаще всего одна копия утрачивает функцию"}}},"exam_quiz":{"id":"S14-E08","question":"Что такое псевдоген?","options":[{"id":"S14-E08-1","text":"Новый ген из некодирующей ДНК","correct":false,"feedback":"Это ген de novo"},{"id":"S14-E08-2","text":"Копия гена, утратившая функцию","correct":true,"feedback":"Изменения в нём почти все нейтральны"},{"id":"S14-E08-3","text":"Любой мобильный генетический элемент","correct":false,"feedback":"Псевдоген — копия гена, а не элемента"}]}},{"id":"de-novo","num":23,"section":3,"questions":[4],"title":"Гены из некодирующей ДНК","keywords":["Ген de novo","Открытая рамка считывания","Протоген"],"lead":["Не все новые гены — копии: некоторые возникают из последовательностей, которые у предков не кодировали белок."],"mechanism":["[[T58|Ген de novo]] возникает из некодирующей последовательности: в ней появляется [[T60|открытая рамка считывания]] — участок от старт-кодона до стоп-кодона без промежуточных стоп-кодонов, — и последовательность начинает транскрибироваться. Признак такого происхождения — у близких видов в той же позиции генома есть сходная последовательность, но рамка прервана, а сходного гена-предшественника нет. Транскрибируемый участок, возникший из последовательности, не бывшей геном, и содержащий транслируемую рамку, функция которой ещё не доказана, называют [[T59|протогеном]]."],"paragraphs":["У человека тысячи молодых транслируемых рамок, большей частью без доказанной функции; около 7000 из них предложены для включения в справочники генов и будут систематически проверены. Чтобы считать рамку белок-кодирующим геном, нужны надёжная модель транскрипта, целая рамка, признаки сохранения в эволюции и данные о белке. Большинство протогенов, вероятно, нейтральны и могут исчезнуть; часть приобретает функцию.","<b>На практикуме.<\/b> Вкладка 4, карточка «ген из некодирующей ДНК», шаг 4.4.","<b>Ограничения.<\/b> Отсутствие гена у других видов может означать и его утрату в их линиях, и неполноту сборки их геномов."],"conditions":"Схема качественная · последовательности условны.","sources":["src_01","src_11"],"base":"БИО-14·21; вспомнить [[seminar-10-route.html#genetic-code|семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»]]","quiz":{"id":"S14-L23","question":"Что нужно, чтобы считать молодую рамку считывания геном?","options":[{"id":"S14-L23-1","text":"Достаточно, что она транскрибируется","correct":false,"feedback":"Транскрибируются и многие некодирующие участки"},{"id":"S14-L23-2","text":"Данные о транскрипте, рамке, белке и функции","correct":true,"feedback":"Одной транскрипции мало"},{"id":"S14-L23-3","text":"Достаточно, что её нет у других видов","correct":false,"feedback":"Это признак молодости, но не функции"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как ген возникает из некодирующей ДНК?","status":"Схема качественная · последовательности условны","modes_label":"Рамка","modes":["закрыта","открыта","протоген или ген"],"args":[{"st":"closed"},{"st":"open"},{"st":"gene"}],"notes":["У предка в этой позиции рамка прервана","В линии вида 1 рамка открылась","Без данных о функции — протоген"],"static":["Выравнивание четырёх видов: общий стоп-кодон и открытая рамка у вида 1"],"scene":"s14_r_denovo","L":{"t4_s_head_denovo":"Ген из некодирующей ДНК: та же позиция у четырёх видов","t4_s_sp":"вид {i}","t4_s_stop_234":"стоп-кодон у видов 2–4","t4_s_closed":"У предка в этой позиции рамка прервана","t4_s_open":"открытая рамка","t4_s_opened":"рамка открылась в линии вида 1","t4_s_tx":"транскрипция","t4_s_tl":"трансляция","t4_s_fn":"функция не доказана","t4_s_proto":"без данных о функции — протоген; функция доказана — ген de novo"}},"zoomNarrow":true}},{"id":"transposons","num":24,"section":3,"questions":[4],"title":"Мобильные элементы","keywords":["Мобильный генетический элемент","ДНК-транспозон","Ретротранспозон","Кооптация"],"lead":["Около половины генома человека — последовательности мобильных элементов, распространявшихся копированием."],"mechanism":["[[T61|Мобильный генетический элемент]] — последовательность, способная перемещаться или копироваться в новые места генома. [[T63|ДНК-транспозоны]] перемещаются как ДНК при участии фермента транспозазы; [[T62|ретротранспозоны]] копируются через РНК и обратную транскрипцию, поэтому их копии множатся. Вставка может нарушить ген или регуляторный участок, а участки элементов служат местами неравного кроссинговера и перестроек. Большинство вставок нейтрально или вредно для хозяина."],"paragraphs":["Изредка последовательность элемента используется хозяином в новой роли — [[T64|кооптация]]: по осторожным оценкам, не менее четверти предполагаемых регуляторных участков генома человека происходит от мобильных элементов. Распространение элемента и его последующее использование хозяином — разные события: элемент распространяется потому, что копируется, а не «для» новшеств. Около половины мобильных элементов генома человека встроились уже в линии приматов.","<b>На практикуме.<\/b> Вкладка 4, карточка «мобильный элемент», шаг 4.5.","<b>Ограничения.<\/b> Большинство копий элементов в геноме человека повреждено и не способно перемещаться."],"conditions":"Схема качественная · длины элементов условны.","sources":["src_01","src_12","src_18"],"base":"вспомнить [[seminar-13-route.html#conflict|семинар 13: «Внутригеномные конфликты»]]","quiz":{"id":"S14-L24","question":"Чем ретротранспозон отличается от ДНК-транспозона?","options":[{"id":"S14-L24-1","text":"Не может встраиваться в геном хозяина","correct":false,"feedback":"Встраивается, но через ДНК-копию с РНК"},{"id":"S14-L24-2","text":"Всегда полезен для организма-хозяина","correct":false,"feedback":"Большинство вставок нейтрально или вредно"},{"id":"S14-L24-3","text":"Копируется через РНК и обратную транскрипцию","correct":true,"feedback":"Поэтому его копии множатся"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как перемещаются мобильные элементы и к чему это ведёт?","status":"Схема качественная · длины условны","modes_label":"Элемент","modes":["ДНК-транспозон","ретротранспозон","последствия вставки"],"args":[{"te":"dna"},{"te":"retro"},{"te":"fx"}],"notes":["Перемещается как ДНК","Копируется через РНК — копии множатся","Чаще нейтрально или вредно; изредка — кооптация"],"static":["Два механизма перемещения и три исхода вставки"],"scene":"s14_r_te","L":{"t4_s_head_te_dna":"Мобильный элемент: ДНК-транспозон перемещается","t4_s_dnate":"ДНК-транспозон","t4_s_tpase":"транспозаза","t4_s_cutpaste":"ДНК-транспозон: вырезание и встраивание в новое место","t4_s_head_te":"Мобильный элемент: вставка ретротранспозона в интрон","t4_s_te":"ретротранспозон","t4_s_rna":"РНК-копия → обратная транскрипция → новая копия","t4_s_intron":"вставка в интроне","t4_s_head_te_fx":"Мобильный элемент: последствия вставки в интрон","t4_s_fx1":"без последствий","t4_s_fx2":"нарушение гена","t4_s_fx3":"использование как регуляторного участка (редко)","t4_s_fx_note":"Распространение элемента и его использование организмом — разные события"}},"zoomNarrow":true},"exam_quiz":{"id":"S14-E10","question":"Что такое кооптация?","options":[{"id":"S14-E10-1","text":"Использование готовой последовательности по-новому","correct":true,"feedback":"Например, участка мобильного элемента как регуляторного"},{"id":"S14-E10-2","text":"Копирование мобильного элемента через РНК","correct":false,"feedback":"Это свойство ретротранспозонов"},{"id":"S14-E10-3","text":"Перенос гена из митохондрии в ядро","correct":false,"feedback":"Это эндосимбиотический перенос"}]}},{"id":"hgt-eukaryotes","num":25,"section":3,"questions":[4],"title":"Горизонтальный перенос генов у эукариот","keywords":["Горизонтальный перенос генов","Закрепление","Эндосимбиотический перенос генов"],"lead":["Перенос генов редок по сравнению с наследованием от предков даже у бактерий и архей, а в ядерных геномах эукариот — ещё реже; каждый случай требует проверки."],"mechanism":["[[T65|Горизонтальный перенос генов]] — передача генетического материала вне связи «родитель — потомок». Чтобы перенос закрепился, должна пройти цепь маловероятных событий: ДНК попадает в клетку, встраивается в геном, ген транскрибируется, белок правильно сворачивается и работает; у многоклеточных ДНК должна ещё попасть в клетки зародышевой линии. Последнее условие — вариант с перенесённым геном должен [[T05|закрепиться]] в популяции, чаще всего под действием отбора: перенос, как и мутация, — событие, а не замещение. Поэтому даже у бактерий перенесённые гены — меньшинство по сравнению с унаследованными от предков, а в ядерных геномах эукариот их обычно ещё меньше. Отдельный случай — [[T66|эндосимбиотический перенос]] генов из митохондрий и пластид в ядро."],"paragraphs":["Ген бактериального типа в геноме эукариоты может оказаться и загрязнением образца, и ошибкой сборки. Перенос признают, если ген встроен среди генов хозяина (с соседними эукариотическими генами, часто с интронами), найден в независимых образцах вида и на дереве генов стоит внутри определённой группы доноров.","<b>На практикуме.<\/b> Вкладка 4, карточка «горизонтальный перенос»; «Найти причину» IV.","<b>Ограничения.<\/b> Утраты генов в нескольких линиях могут дать картину, похожую на перенос; различают их по полноте выборки видов."],"conditions":"Схема качественная · дерево условно.","sources":["src_13"],"base":"вспомнить [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]] и [[seminar-12-route.html#gene-transfer|семинар 12: «Перенос генов в ядро и импорт белков»]]","quiz":{"id":"S14-L25","question":"Ген бактериального типа найден только в одной из трёх сборок генома вида и на участке без генов эукариотического типа. Вероятнее всего, это…","options":[{"id":"S14-L25-1","text":"Загрязнение образца","correct":true,"feedback":"Настоящий перенос был бы встроен среди генов хозяина и повторялся бы в сборках"},{"id":"S14-L25-2","text":"Горизонтальный перенос","correct":false,"feedback":"Признаков встраивания нет"},{"id":"S14-L25-3","text":"Перенос из митохондрии","correct":false,"feedback":"Митохондриальные гены в ядре стоят среди генов хозяина и есть у всех особей"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как отличить перенос гена от загрязнения?","status":"Схема качественная · дерево условно","modes_label":"Проверка","modes":["путь переноса","проверка сборки","дерево генов"],"args":[{"v":"path"},{"v":"assembly"},{"v":"tree"}],"notes":["Перенос — цепь маловероятных событий","Встроен ли ген среди генов хозяина","С какими организмами ген стоит на дереве"],"static":["Три проверки, отличающие перенос от загрязнения"],"scene":"s14_r_hgt","L":{"r_hgt_path":"Путь переноса","r_hgt_p1":"донор","r_hgt_p2":"ДНК попадает в клетку","r_hgt_p3":"встраивается","r_hgt_p4":"транскрибируется","r_hgt_assembly":"Проверка сборки","r_hgt_host":"соседние гены хозяина","r_hgt_gene":"ген бактериального типа","r_hgt_bact":"участок только с бактериальными генами — признак загрязнения","r_hgt_samples":"ген есть в независимых образцах того же вида — признак переноса","r_hgt_tree":"Дерево генов","r_hgt_t_b1":"бактерия 1","r_hgt_t_b2":"бактерия 2 (группа доноров)","r_hgt_t_x":"ген эукариоты 2 — внутри группы доноров","r_hgt_t_e1":"эукариота 1","r_hgt_t_e2":"эукариота 3","r_tree_len":"длина ветви условна"},"after":[1],"after_hint":"после ответа"}}},{"id":"mtdna","num":26,"section":3,"questions":[4],"title":"Митохондриальная ДНК как отдельный случай","keywords":["Митохондриальная ДНК (мтДНК)","Гетероплазмия"],"lead":["[[T67|Митохондриальная ДНК]] наследуется иначе, чем ядерная, и поэтому рассказывает только часть истории популяции."],"mechanism":["МтДНК человека — кольцевая молекула из 16 569 пар нуклеотидов, кодирующая 13 белков, 22 тРНК и 2 рРНК; в клетке много её копий. Она передаётся по материнской линии и практически не рекомбинирует, поэтому вся молекула наследуется как одна единица. Скорость накопления замен в ней выше, чем в большинстве ядерных участков. Если в клетке сосуществуют копии мтДНК разных вариантов, это [[T68|гетероплазмия]]; доли вариантов могут различаться между клетками, тканями и поколениями."],"paragraphs":["Быстрое накопление различий удобно для изучения недавней истории, но при глубоком расхождении приводит к насыщению. Одна митохондриальная линия отражает только материнскую линию и может не совпадать с историей ядерного генома. Пороговые эффекты гетероплазмии и их значение для клетки разбираются в курсе «Молекулярная биология».","<b>На практикуме.<\/b> Не моделируется.","<b>Ограничения.<\/b> У разных организмов наследование мтДНК различно: известны отцовское и двуродительское наследование.","<b>Дальше в курсе «Молекулярная биология».<\/b> Как наследование и сегрегация меняют распределение вариантов мтДНК — [[https://edu.mazunin.science/seminar-9-route.html#segregation|«Молекулярная биология», семинар 9]]."],"conditions":"Схема качественная · число копий условно.","sources":["src_15"],"base":"БИО-14·1; вспомнить [[seminar-12-route.html#gene-transfer|семинар 12: «Перенос генов в ядро и импорт белков»]]","quiz":{"id":"S14-L26","question":"Почему мтДНК наследуется как одна единица?","options":[{"id":"S14-L26-1","text":"Потому что молекула очень маленькая","correct":false,"feedback":"Размер не мешает рекомбинации; дело в её отсутствии"},{"id":"S14-L26-2","text":"Она практически не рекомбинирует","correct":true,"feedback":"Варианты в разных её участках передаются вместе"},{"id":"S14-L26-3","text":"Потому что в клетке мало её копий","correct":false,"feedback":"Копий в клетке много"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем мтДНК отличается по наследованию?","status":"Схема качественная · число копий условно","modes_label":"Свойство","modes":["материнская передача","без рекомбинации","гетероплазмия"],"args":[{"p":"maternal"},{"p":"norecomb"},{"p":"hetero"}],"notes":["МтДНК передаётся от матери","Варианты всей молекулы наследуются вместе","В клетке могут быть копии разных вариантов"],"static":["Родословная с материнской передачей мтДНК и клетка с гетероплазмией"],"scene":"s14_r_mtdna","L":{"r_mt_maternal":"Материнская передача","r_mt_mother":"мать","r_mt_father":"отец","r_mt_kids":"потомки","r_mt_norecomb":"Без рекомбинации","r_mt_genome":"кольцевая мтДНК 16 569 п. н.","r_mt_together":"варианты передаются вместе","r_mt_hetero":"Гетероплазмия","r_mt_wt":"копия исходного варианта","r_mt_var":"копия другого варианта","r_mt_mix":"копии разных вариантов в клетке"}}}},{"id":"wgd-brain","num":27,"section":3,"questions":[4],"title":"Что происходило с копиями генов в мозге позвоночных","keywords":["Маркер типа клеток"],"lead":["После удвоений генома копии генов чаще делили между собой типы клеток мозга, чем приобретали новые."],"mechanism":["У позвоночных геном удваивался целиком в начале их эволюции и ещё раз у предков челюстных позвоночных. Сравнили, маркерами каких типов клеток мозга служат копии генов у человека, мыши, ящерицы и миноги (с ланцетником для сравнения), и реконструировали состояние у их общего предка; брали группы копий, пара которых есть хотя бы у трёх видов из четырёх. Копии, оставшиеся от удвоений генома, чаще копий от отдельных дупликаций служат [[T70|маркерами типов клеток]]. Изменения того, маркерами каких типов клеток служат копии (2693 группы паралогов), примерно на 78 % объясняются разделением функций предкового гена, на 21 % — новой функцией одной копии, менее чем на 1 % — тем, что ни одна копия больше не служит маркером этого типа клеток."],"paragraphs":["По уровню экспрессии авторы находят и признаки отбора на дозу. Работа поддерживает модель, в которой копии после дупликации частично утрачивают функции и дополняют друг друга.","<b>Как это узнали.<\/b> Прочитали РНК отдельных клеток мозга у нескольких видов, разделили клетки на типы и для каждой пары копий определили, маркером каких типов она служит.","<b>Граница вывода.<\/b> Авторы допускают, что их способ может легче обнаруживать разделение функций, чем новую функцию; «маркер» — не то же, что «работает в клетке»: ген может работать в клетке и не быть её отличительным; копии, утраченные полностью, в анализ не попадают; состояние предка — реконструкция.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 4."],"conditions":"Схема по данным работы, упрощённая · доли — реконструкция.","sources":["src_10"],"base":"БИО-14·21, БИО-14·22","level":"adv","next_base":"integration","quiz":{"id":"S14-L27","question":"Противоречит ли эта работа тому, что чаще всего одна копия утрачивает функцию?","options":[{"id":"S14-L27-1","text":"Да: утрат менее 1 %","correct":false,"feedback":"Менее 1 % — среди изменений у сохранившихся копий"},{"id":"S14-L27-2","text":"Да: новая функция встречается чаще всего","correct":false,"feedback":"Чаще всего — разделение функций"},{"id":"S14-L27-3","text":"Нет: в анализ вошли только сохранившиеся копии","correct":true,"feedback":"Не противоречит: «утрата» в работе — когда ни одна копия больше не служит маркером данного типа клеток"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что происходило с копиями генов в мозге позвоночных?","status":"Схема по данным работы, упрощённая · доли — реконструкция по использованию копий как маркеров","modes_label":"Исход","modes":["разделение функций","новая функция","утрата"],"args":[{"o":"subfunc"},{"o":"neofunc"},{"o":"loss"}],"notes":["Около 78 % изменений","Около 21 % изменений","Менее 1 % изменений"],"static":["Три полосы долей исходов и пример на дереве копий"],"scene":"s14_a4","L":{"a4_head":"Копии как маркеры типов клеток мозга: исходы изменений (2693 группы паралогов)","a4_oc1":"разделение функций","a4_v_subfunc":"около 78 %","a4_oc2":"новая функция","a4_v_neofunc":"около 21 %","a4_oc3":"утрата","a4_v_loss":"менее 1 %","t4_out_subfunc":"разделение функций","a4_ex":"Пример на дереве копий: {o}","a4_ex_note_subfunc":"копии поделили типы клеток предкового гена","a4_b_head":"Откуда копии: число групп","a4_b1":"от удвоения генома — 1872","a4_b2":"от отдельных дупликаций — 1050","a4_b339":"339 групп входят в оба набора","a4_b3":"2693 — все группы паралогов; две полосы — группы, отнесённые к удвоению генома или к отдельным дупликациям","a4_b4":"доли исходов в обоих наборах близки","t4_out_neofunc":"новая функция","a4_ex_note_neofunc":"у копии — новый тип клеток","t4_out_loss":"утрата функции одной копией","a4_ex_note_loss":"ни одна копия больше не служит маркером этого типа клеток"}}},"adv_kind":"Новые данные"},{"id":"osmotroph-hgt","num":28,"section":3,"questions":[4],"title":"Перенос генов при переходе эукариот к питанию всасыванием","keywords":["Осмотрофия"],"lead":["У четырёх групп эукариот, независимо перешедших к одному способу питания, заметная часть общего набора генов несёт признаки переноса."],"mechanism":["[[T69|Осмотрофия]] — питание всасыванием растворённых веществ, часто после внеклеточного переваривания, без захвата частиц. К ней независимо перешли грибы и три другие группы эукариот, внешне похожие на грибы. Реконструировали эволюцию генов этих групп: эти группы возникли, по оценке, около 1000–720 млн лет назад или несколько раньше; набор генов, общий для осмотрофов, обогащён генами обмена веществ. Не менее 20 % этого набора несут признаки, совместимые с горизонтальным переносом; 166 деревьев генов поддерживают переносы между неродственными группами осмотрофов, в частности между грибами и одной из грибоподобных групп."],"paragraphs":["Работа подтверждает, что у эукариот перенос генов возможен и может участвовать в сходных приспособлениях разных линий.","<b>Как это узнали.<\/b> Строили деревья генов и сравнивали их с деревом видов: ген, стоящий на дереве рядом с далёкой группой, — кандидат на перенос; кандидатов проверяли на ошибки построения деревьев и загрязнение.","<b>Граница вывода.<\/b> «Признаки, совместимые с переносом», — реконструкция; даты — оценка часов с интервалом; что перенос вызвал переход к осмотрофии, работа не доказывает.","<b>На практикуме.<\/b> Продвинутый уровень не моделирует; связь — «Найти причину» IV."],"conditions":"Схема по данным работы, упрощённая · даты — оценка модели.","sources":["src_14"],"base":"БИО-14·25","level":"adv","next_base":"integration","quiz":{"id":"S14-L28","question":"Почему переносы в этой работе названы «совместимыми с переносом»?","options":[{"id":"S14-L28-1","text":"Перенос выведен из деревьев, а не увиден","correct":true,"feedback":"Перенос реконструирован по данным"},{"id":"S14-L28-2","text":"Потому что сами гены в геномах не найдены","correct":false,"feedback":"Гены найдены; их происхождение реконструировано"},{"id":"S14-L28-3","text":"Потому что осмотрофия — это вид болезни","correct":false,"feedback":"Осмотрофия — способ питания"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как найден перенос генов у осмотрофов?","status":"Схема по данным работы, упрощённая · переносы — реконструкция","modes_label":"Вид","modes":["четыре группы","общий набор генов","дерево с переносом"],"args":[{"v":"groups"},{"v":"toolkit"},{"v":"tree"}],"notes":["Четыре группы независимо перешли к осмотрофии","Не менее 20 % общего набора — признаки переноса","Ген стоит рядом с далёкой группой — кандидат на перенос"],"static":["Дерево эукариот с четырьмя группами осмотрофов и стрелками переносов"],"scene":"s14_r_osmo","L":{"r_osmo_groups":"Четыре группы","r_osmo_fungi":"грибы","r_osmo_o1":"неосмотрофы 1","r_osmo_g1":"грибоподобная группа 1","r_osmo_o2":"неосмотрофы 2","r_osmo_g2":"грибоподобная группа 2","r_osmo_o3":"неосмотрофы 3","r_osmo_g3":"грибоподобная группа 3","r_osmo_o4":"неосмотрофы 4","r_osmo_sptree":"дерево видов (схема)","r_tree_len":"длина ветви условна","r_osmo_leg_o":"осмотрофы","r_osmo_leg_n":"не осмотрофы","r_osmo_toolkit":"Общий набор генов","r_osmo_hgt20":"не менее 20 % общего набора — признаки переноса","r_osmo_166":"166 деревьев генов поддерживают переносы между неродственными осмотрофами","r_osmo_tree":"Дерево с переносом","r_osmo_gf1":"ген гриба 1","r_osmo_gf2":"ген гриба 2","r_osmo_gg2":"ген группы 2 — среди генов грибов","r_osmo_go1":"ген неосмотрофа","r_osmo_gg1":"ген грибоподобной группы 1","r_osmo_go2":"ген другого неосмотрофа","r_osmo_gtree":"дерево гена (схема)"}},"zoomNarrow":true},"adv_kind":"Новые данные"},{"id":"integration","num":29,"section":4,"questions":[1,2,3,4],"title":"Итоговая задача: что объясняет различие?","keywords":[],"lead":["Наблюдаемое различие последовательностей само не называет своей причины: нужно назвать совместимые объяснения и данные, которые их различают."],"mechanism":["Четыре наблюдения практикума: (I) одинаковые различия у всех обследованных особей двух видов — замещения; линию каждого показывает внешняя группа; (II) dN/dS = 0,1 — преобладает очищающий отбор, положительный в отдельных кодонах не исключён; (III) дерево четырёх видов в заменах на сайт без датированных событий — время расхождения определить нельзя, нужна калибровка; (IV) копия гена без интронов, на другой хромосоме, с преждевременным стоп-кодоном — ретропозиция и утрата функции (псевдоген); работает ли копия — по транскрипции, когда возник стоп-кодон — по близким видам."],"paragraphs":["Общий порядок: (1) назвать уровень наблюдения — вариант, полиморфизм, замещение, отношение, дата, число копий; (2) перечислить совместимые объяснения; (3) указать минимальные данные, дающие каждому объяснению положительный признак; (4) если данных нет, сказать «по этим данным различить нельзя».","<b>На практикуме.<\/b> Итоговая задача под вкладкой 4."],"conditions":"Схема качественная · четыре ситуации условны.","sources":["src_01","src_02","src_09"],"base":"БИО-14·1, БИО-14·11, БИО-14·18, БИО-14·22","quiz":{"id":"S14-L29","question":"Почему при dN/dS = 0,1 нельзя исключить положительный отбор?","options":[{"id":"S14-L29-1","text":"Можно: значение много меньше 1","correct":false,"feedback":"Среднее не показывает распределения по кодонам"},{"id":"S14-L29-2","text":"Он мог действовать на немногие кодоны","correct":true,"feedback":"Среднее по гену это скрывает"},{"id":"S14-L29-3","text":"Можно, если гены ортологичны","correct":false,"feedback":"Ортология нужна для сравнения, но не исключает отбора в кодонах"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что объясняет различие?","status":"Схема качественная · ситуации условны","modes_label":"Ситуация","modes":["I","II","III","IV"],"args":[{"case":1,"route":true},{"case":2,"route":true},{"case":3,"route":true},{"case":4,"route":true}],"notes":["Одинаковые различия у всех особей — замещения","0,1 — очищающий отбор; отдельные кодоны не исключены","Дерево без датированного узла — времени нет","Ретрокопия со стоп-кодоном — псевдоген; работает ли — по транскрипции"],"static":["Четыре карточки наблюдений с объяснениями и данными"],"scene":"s14_int","L":{"fin_f1":"Ситуация I: два вида, 30 особей каждого (показаны по три)","fin_i_row":"вид {sp} · особь {i}","fin_i_note":"У всех 30 особей каждого вида — одни и те же различия","fin_r_expl":"Совместимые объяснения:","fin_e_subst":"Замещения: различия закреплены в обоих видах","fin_r_data":"Данные для проверки:","fin_r_nodata":"не нужны","fin_f2":"Ситуация II: dN/dS гена по сравнению двух видов","fin_ii_note":"Среднее по гену: отдельные кодоны не видны","fin_e_purif":"Преобладает очищающий отбор; положительный отбор в отдельных кодонах не исключён","fin_d_codons":"Оценки по отдельным кодонам","fin_f3":"Ситуация III: дерево четырёх видов в заменах на сайт","t3_sp_K":"вид К","t3_sp_L":"вид Л","t3_sp_M":"вид М","t3_sp_N":"вид Н","t3_bl_subs":"длина ветви — замены на сайт","fin_iii_note":"Датированных узлов нет","fin_e_nodate":"Время расхождения по этим данным определить нельзя","fin_d_calib":"Калибровка: узел с независимо известным возрастом","fin_r_none":"Без этих данных верен и ответ «по этим данным различить нельзя».","fin_f4":"Ситуация IV: вторая копия гена","t4_o_chr1":"хромосома 1","t4_o_orig":"исходная копия: экзоны и интроны","t4_o_chr2":"хромосома 2","fin_iv_new":"новая копия: без интронов, на другой хромосоме","t4_s_stop":"стоп-кодон","fin_iv_note":"Без интронов, на другой хромосоме, в рамке — преждевременный стоп-кодон","fin_e_retro":"Ретропозиция; копия утратила функцию (псевдоген)","fin_d_tx":"Транскрипция копии","fin_d_close":"Есть ли такой же стоп-кодон у близких видов"}}}},{"id":"links","num":30,"section":4,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":[],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},{"ul":["[[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]] — откуда берётся изменение последовательности","[[seminar-10-route.html#sequence-changes|семинар 10: «Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции»]] — какие бывают замены","[[seminar-10-route.html#synonymous-not-neutral|семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»]] — почему нейтральность синонимичных замен — допущение","[[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]] — откуда новые гены","[[seminar-12-route.html#r3|семинар 12: «Как датируют LUCA и почему это модель»]] — часы как модель","[[seminar-13-route.html#fixation|семинар 13: «Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»]] — почему большинство вариантов исчезает"]},{"h":"Где это понадобится дальше в разделе"},{"ul":["БИО-14·21 → [[seminar-15-route.html#ortho-para|семинар 15: «Ортологи и паралоги: какое событие в общем узле»]] — паралоги расходятся после дупликации гена, ортологи — при разделении видов","БИО-14·21 → [[seminar-16-route.html#gene-culture|семинар 16: «Генно-культурная коэволюция: молоко и крахмал»]] — число копий гена амилазы слюны различается между популяциями и связано с количеством фермента в слюне","БИО-14·15 → [[seminar-15-route.html#branch-length|семинар 15: «Длина ветви: ничего, замены или время»]] — на филограмме длина ветви пропорциональна числу замен на сайт вдоль ветви","БИО-14·12 → [[seminar-15-route.html#alignment-matters|семинар 15: «Почему выравнивание не нейтральная операция»]] — наблюдаемое различие меньше числа произошедших замен, и ошибки выравнивания переходят в дерево","БИО-14·26 → [[seminar-16-route.html#molecular-past|семинар 16: «Какие молекулярные данные говорят о прошлом»]] — прошлое из генома не считывают, а реконструируют через модель наследования; митохондриальная ДНК даёт генеалогию одного участка","БИО-14·25 → [[seminar-16-route.html#amr|семинар 16: «Устойчивость к антимикробным препаратам»]] — у бактерий источник устойчивости — не только мутации, но и горизонтальный перенос генов, прежде всего с плазмидами"]},{"h":"Что дальше в курсе"},{"ul":["[[seminar-15-route.html|семинар 15: «Филогенетика, виды и видообразование»]] — как по различиям последовательностей строят и читают деревья, почему дерево гена может не совпадать с деревом видов; продолжает БИО-14·15, БИО-14·21","Шаги-продолжения: [[seminar-15-route.html#branch-length|семинар 15: «Длина ветви: ничего, замены или время»]], [[seminar-15-route.html#ortho-para|семинар 15: «Ортологи и паралоги: какое событие в общем узле»]], [[seminar-15-route.html#gene-species-tree|семинар 15: «Дерево гена и дерево видов»]]"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Почему эффект гетероплазмии может проявляться нелинейно — [[https://edu.mazunin.science/seminar-9-route.html#heteroplasmy-threshold|«Молекулярная биология», семинар 9]]","Почему одинаковая гетероплазмия не означает одинакового числа копий дикого типа — [[https://edu.mazunin.science/seminar-9-route.html#copy-number|«Молекулярная биология», семинар 9]] — продолжает БИО-14·26","Соматические мутации и клональная эволюция — «Молекулярная биология», раздел III/IV (в разработке) — продолжает БИО-14·19","Как наследование и сегрегация меняют распределение вариантов мтДНК — [[https://edu.mazunin.science/seminar-9-route.html#segregation|«Молекулярная биология», семинар 9]] — продолжает БИО-14·26"]}],"conditions":"","sources":[],"service":true,"quiz":{"id":"S14-L30","question":"Где в курсе разбирается, почему синонимичная замена может быть не нейтральной?","options":[{"id":"S14-L30-1","text":"В теме о закреплении изменения при репликации","correct":false,"feedback":"Там — как изменение становится мутацией: [[seminar-8-route.html#fixation|семинар 8: «Как изменение закрепляется при репликации»]]; о синонимичных кодонах — [[seminar-10-route.html#synonymous-not-neutral|семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»]]."},{"id":"S14-L30-2","text":"В теме о генетическом коде и трансляции","correct":true,"feedback":"Синонимичные кодоны могут менять скорость трансляции и количество белка: [[seminar-10-route.html#synonymous-not-neutral|семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»]]."},{"id":"S14-L30-3","text":"В теме о переносе генов между линиями","correct":false,"feedback":"Там — история генов и линий: [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]]; о синонимичных кодонах — [[seminar-10-route.html#genetic-code|семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»]]."}]}}],"sections":[{"title":"От мутации к замещению","entry":"four-concepts","sub":"От мутации к замещению","label":"Тема 1","integr":false},{"title":"Нейтральная эволюция и dN/dS","entry":"neutral-theory","sub":"Нейтральная эволюция и dN/dS","label":"Тема 2","integr":false},{"title":"Молекулярные часы","entry":"accumulation","sub":"Молекулярные часы","label":"Тема 3","integr":false},{"title":"Откуда берутся новые гены","entry":"duplication","sub":"Откуда берутся новые гены","label":"Тема 4","integr":false},{"title":"Итог","entry":"integration","sub":"Что объясняет различие?","label":"Итог","integr":true}],"glossary":[{"id":"S14-T01","term":"Мутационное событие","section":0,"def":"Однократное изменение последовательности ДНК в одной клетке; начало истории варианта."},{"id":"S14-T02","term":"Вариант","section":0,"def":"Наблюдаемое состояние последовательности ДНК в данном участке у клетки или особи. В семинаре 12 вариантом названа одна из различающихся форм воспроизводящейся системы ([[seminar-12-route.html#selection|семинар 12: «Условия естественного отбора»]]); вариант последовательности — её частный случай."},{"id":"S14-T03","term":"Полиморфизм","section":0,"def":"Существование в популяции двух и более аллелей локуса с заметной частотой. В этом семинаре: речь о вариантах участка генома, а не только об аллелях одного локуса."},{"id":"S14-T04","term":"Замещение","section":0,"def":"Закрепление в популяции нового варианта вместо прежнего; различия между видами складываются из замещений."},{"id":"S14-T05","term":"Закрепление","section":0,"def":"Рост частоты варианта в популяции до единицы, когда других вариантов участка не остаётся; не путать с закреплением изменения ДНК при репликации."},{"id":"S14-T06","term":"Зародышевая линия","section":0,"def":"Клетки, от которых происходят половые клетки; их изменения передаются потомкам."},{"id":"S14-T07","term":"Соматическая мутация","section":0,"def":"Изменение ДНК в клетке тела; передаётся дочерним клеткам; у животных с обособленной зародышевой линией, в том числе у человека, потомкам организма не передаётся."},{"id":"S14-T08","term":"Скорость мутаций","section":0,"def":"Число новых изменений на нуклеотид или на геном за поколение либо за год."},{"id":"S14-T09","term":"Скорость замещений","section":0,"def":"Число закрепившихся различий на сайт за единицу времени в одной линии."},{"id":"S14-T10","term":"Однонуклеотидная замена","section":0,"def":"Замена одного нуклеотида другим."},{"id":"S14-T11","term":"Вставка и делеция","section":0,"def":"Добавление или утрата одного или нескольких нуклеотидов."},{"id":"S14-T12","term":"Структурный вариант","section":0,"def":"Изменение крупного участка генома: делеция, дупликация, инверсия, перемещение, изменение числа копий участка."},{"id":"S14-T13","term":"Тандемный повтор","section":0,"def":"Участок, в котором короткая последовательность повторяется подряд много раз; число повторов часто меняется."},{"id":"S14-T14","term":"Спектр мутаций","section":0,"def":"Относительные частоты разных типов изменений, возникающих в геноме."},{"id":"S14-T15","term":"Мутационное смещение","section":0,"def":"Систематическое неравенство частот возникновения разных изменений."},{"id":"S14-T16","term":"Транзиция","section":0,"def":"Замена пурина на пурин или пиримидина на пиримидин."},{"id":"S14-T17","term":"Трансверсия","section":0,"def":"Замена пурина на пиримидин или пиримидина на пурин."},{"id":"S14-T18","term":"Функциональный эффект","section":0,"def":"Измеримое изменение молекулы, клетки или признака, вызванное вариантом."},{"id":"S14-T19","term":"Селективный эффект","section":0,"def":"Изменение вклада носителя варианта в следующие поколения."},{"id":"S14-T20","term":"Коэффициент отбора (s)","section":0,"def":"Относительная разница приспособленности сравниваемых генотипов. В моделях отбора против генотипа s = 1 − w, и s > 0 означает сниженную приспособленность; при описании изменения частоты варианта s > 0 означает рост его частоты под действием отбора, s < 0 — снижение. Какое соглашение принято, сказано в шаге."},{"id":"S14-T21","term":"Мутация после оплодотворения","section":0,"def":"Изменение, возникшее в клетке зародыша; есть только в части клеток организма."},{"id":"S14-T22","term":"Центромера","section":0,"def":"Участок хромосомы, на котором собирается кинетохор — место прикрепления нитей веретена при делении; состоит из длинных повторов."},{"id":"S14-T23","term":"Нейтральная теория молекулярной эволюции","section":1,"def":"Теория, по которой большинство замещений в последовательностях — закрепление нейтральных вариантов дрейфом; скорость нейтральных замещений равна скорости нейтральных мутаций."},{"id":"S14-T24","term":"Нейтральный вариант","section":1,"def":"Вариант, не влияющий на приспособленность носителя. В этом семинаре: нейтральность варианта оценивают для данных условий."},{"id":"S14-T25","term":"Генетический дрейф","section":1,"def":"Случайные изменения частот аллелей из-за конечного числа копий генов, переданных следующему поколению."},{"id":"S14-T26","term":"Почти нейтральная теория","section":1,"def":"Дополнение нейтральной теории: варианты со слабым эффектом (|s| не больше 1/(2Ne)) меняют частоту главным образом дрейфом, поэтому то, что с ними происходит, зависит от численности популяции."},{"id":"S14-T27","term":"Эффективная численность (Ne)","section":1,"def":"Численность идеальной популяции, в которой дрейф шёл бы с той же скоростью, что в реальной."},{"id":"S14-T28","term":"Очищающий отбор","section":1,"def":"Отбор, удаляющий вредные варианты; другое название — отрицательный отбор."},{"id":"S14-T29","term":"Положительный отбор","section":1,"def":"Отбор, повышающий частоту полезных вариантов."},{"id":"S14-T30","term":"Синонимичная замена","section":1,"def":"Замена нуклеотида, при которой новый кодон кодирует ту же аминокислоту."},{"id":"S14-T31","term":"Несинонимичная замена","section":1,"def":"Замена нуклеотида, меняющая кодируемую аминокислоту."},{"id":"S14-T32","term":"Синонимичный сайт","section":1,"def":"Доля позиции кодона, приходящаяся на возможные замены, не меняющие аминокислоту."},{"id":"S14-T33","term":"Несинонимичный сайт","section":1,"def":"Доля позиции кодона, приходящаяся на возможные замены, меняющие аминокислоту."},{"id":"S14-T34","term":"dN","section":1,"def":"Число несинонимичных различий, делённое на число несинонимичных сайтов."},{"id":"S14-T35","term":"dS","section":1,"def":"Число синонимичных различий, делённое на число синонимичных сайтов."},{"id":"S14-T36","term":"dN/dS (ω)","section":1,"def":"Отношение dN к dS; меньше 1 — изменения аминокислот закреплялись реже синонимичных, больше 1 — чаще."},{"id":"S14-T37","term":"Насыщение","section":1,"def":"Потеря информации при сильном расхождении: повторные замены в одной позиции не видны, и различия растут медленнее времени."},{"id":"S14-T38","term":"Псевдоген","section":1,"def":"Копия гена, утратившая функцию; изменения в ней почти все нейтральны."},{"id":"S14-T39","term":"Неравное использование синонимичных кодонов","section":1,"def":"Преобладание одних синонимичных кодонов над другими, особенно в высокоэкспрессируемых генах."},{"id":"S14-T40","term":"Ортологи","section":1,"def":"Гомологичные гены разных линий, разошедшиеся при разделении линий. В этом семинаре: сравнивают гены разных видов, разошедшиеся при разделении видов."},{"id":"S14-T41","term":"Паралоги","section":3,"def":"Гомологичные гены, возникшие при дупликации в одной линии."},{"id":"S14-T42","term":"Молекулярные часы","section":2,"def":"Статистическая модель, связывающая число замен в последовательностях со временем, прошедшим от общего предка."},{"id":"S14-T43","term":"Калибровка","section":2,"def":"Привязка узла дерева к возрасту, известному по ископаемым остаткам или изотопным данным; используется в молекулярных часах. В этом семинаре: по калибровке число замен переводят в годы."},{"id":"S14-T44","term":"Строгие часы","section":2,"def":"Модель с одной скоростью замен для всех ветвей дерева."},{"id":"S14-T45","term":"Нестрогие часы","section":2,"def":"Модели, в которых скорость замен различается между ветвями и оценивается вместе с датами."},{"id":"S14-T46","term":"Интервал оценки","section":2,"def":"Диапазон значений, совместимых с данными и допущениями модели при заданной вероятности."},{"id":"S14-T47","term":"Внешняя группа","section":2,"def":"Вид или группа, отделившиеся раньше сравниваемых; по ней определяют предковое состояние и неравенство скоростей."},{"id":"S14-T48","term":"Время поколения","section":2,"def":"Средний возраст родителей при рождении потомков."},{"id":"S14-T49","term":"Длина ветви","section":2,"def":"Число замен на сайт (или время) вдоль ветви дерева; что означает длина, подписывают на каждом дереве."},{"id":"S14-T50","term":"Дупликация гена","section":3,"def":"Возникновение второй копии гена в геноме."},{"id":"S14-T51","term":"Неравный кроссинговер","section":3,"def":"Обмен участками между гомологичными хромосомами, выровненными со сдвигом; одна хроматида получает дупликацию, другая — делецию."},{"id":"S14-T52","term":"Ретропозиция","section":3,"def":"Возникновение копии гена обратной транскрипцией зрелой мРНК и встраиванием ДНК-копии в геном; копия не содержит интронов."},{"id":"S14-T53","term":"Полногеномная дупликация","section":3,"def":"Удвоение всех хромосом генома; другое название — удвоение генома."},{"id":"S14-T54","term":"Утрата функции копией","section":3,"def":"Исход дупликации, при котором одна копия накапливает выключающие изменения и становится псевдогеном или исчезает."},{"id":"S14-T55","term":"Сохранение дозы","section":3,"def":"Исход дупликации, при котором обе копии сохраняются, потому что важно суммарное количество продукта."},{"id":"S14-T56","term":"Разделение функций","section":3,"def":"Исход дупликации, при котором копии делят части функции предкового гена (места или время работы); другое название — субфункционализация."},{"id":"S14-T57","term":"Новая функция","section":3,"def":"Исход дупликации, при котором одна копия приобретает свойство, которого не было у предкового гена; другое название — неофункционализация."},{"id":"S14-T58","term":"Ген de novo","section":3,"def":"Ген, возникший из последовательности, которая у предков не кодировала белок."},{"id":"S14-T59","term":"Протоген","section":3,"def":"Транскрибируемый участок, возникший из последовательности, не бывшей геном, с транслируемой рамкой считывания; функция не доказана."},{"id":"S14-T60","term":"Открытая рамка считывания","section":3,"def":"Участок от старт-кодона до стоп-кодона без промежуточных стоп-кодонов."},{"id":"S14-T61","term":"Мобильный генетический элемент","section":3,"def":"Участок ДНК, способный перемещаться в геноме или между клетками (плазмида, транспозон, геном бактериофага). В этом семинаре: речь об элементах, которые перемещаются или копируются в новые места генома."},{"id":"S14-T62","term":"Ретротранспозон","section":3,"def":"Мобильный элемент, копирующийся через РНК и обратную транскрипцию."},{"id":"S14-T63","term":"ДНК-транспозон","section":3,"def":"Мобильный элемент, перемещающийся как ДНК при участии транспозазы."},{"id":"S14-T64","term":"Кооптация","section":3,"def":"Использование существующей последовательности или функции в новой роли."},{"id":"S14-T65","term":"Горизонтальный перенос генов","section":3,"def":"Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями."},{"id":"S14-T66","term":"Эндосимбиотический перенос генов","section":3,"def":"Перенос генов из генома митохондрии или пластиды в ядерный геном."},{"id":"S14-T67","term":"Митохондриальная ДНК (мтДНК)","section":3,"def":"Собственная ДНК митохондрий; у человека кодирует 13 белков и 24 РНК. В этом семинаре: у человека это кольцевая молекула из 16 569 пар нуклеотидов; её 24 РНК — 22 тРНК и 2 рРНК."},{"id":"S14-T68","term":"Гетероплазмия","section":3,"def":"Сосуществование в клетке копий митохондриальной ДНК разных вариантов."},{"id":"S14-T69","term":"Осмотрофия","section":3,"def":"Питание всасыванием растворённых веществ, часто после внеклеточного переваривания, без захвата частиц."},{"id":"S14-T70","term":"Маркер типа клеток","section":3,"def":"Ген, работающий преимущественно в определённом типе клеток и позволяющий его распознать."},{"id":"S14-T71","term":"Кодон","section":1,"def":"Последовательность из трёх нуклеотидов мРНК, соответствующая аминокислоте или сигналу окончания трансляции."}],"sources":{"src_01":{"url":"","cite":"Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014","doi":"","pmid":""},"src_02":{"url":"https://doi.org/10.1038/nrg.2015.8","cite":"dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80","doi":"10.1038/nrg.2015.8","pmid":""},"src_03":{"url":"https://doi.org/10.1038/s41586-025-08922-2","cite":"Porubsky D. et al. Human de novo mutation rates from a four-generation pedigree reference. Nature 2025; 643: 427–436","doi":"10.1038/s41586-025-08922-2","pmid":""},"src_04":{"url":"https://doi.org/10.1038/s41586-022-04823-w","cite":"Shen X., Song S., Li C., Zhang J. Synonymous mutations in representative yeast genes are mostly strongly nonneutral. Nature 2022; 606: 725–731","doi":"10.1038/s41586-022-04823-w","pmid":""},"src_05":{"url":"https://doi.org/10.1038/s41586-023-05865-4","cite":"Kruglyak L. et al. Insufficient evidence for non-neutrality of synonymous mutations. Nature 2023; 616: E8–E9","doi":"10.1038/s41586-023-05865-4","pmid":""},"src_06":{"url":"https://doi.org/10.1093/molbev/msae224","cite":"Shen X. et al. Further evidence for strong nonneutrality of yeast synonymous mutations. Mol Biol Evol 2024; 41: msae224","doi":"10.1093/molbev/msae224","pmid":""},"src_07":{"url":"https://doi.org/10.1016/j.ajhg.2022.10.016","cite":"Dhindsa R.S. et al. A minimal role for synonymous variation in human disease. Am J Hum Genet 2022; 109: 2105–2109","doi":"10.1016/j.ajhg.2022.10.016","pmid":""},"src_08":{"url":"https://doi.org/10.1038/s41586-022-04618-z","cite":"Cagan A. et al. Somatic mutation rates scale with lifespan across mammals. Nature 2022; 604: 517–524","doi":"10.1038/s41586-022-04618-z","pmid":""},"src_09":{"url":"https://doi.org/10.1016/j.tig.2021.06.016","cite":"Kuzmin E., Taylor J.S., Boone C. Retention of duplicated genes in evolution. Trends Genet 2022; 38: 59–72","doi":"10.1016/j.tig.2021.06.016","pmid":""},"src_10":{"url":"https://doi.org/10.1038/s41586-026-10629-x","cite":"Zhu Y. et al. Whole-genome duplication shaped cell-type evolution in the vertebrate brain. Nature 2026","doi":"10.1038/s41586-026-10629-x","pmid":""},"src_11":{"url":"https://doi.org/10.1038/s41559-023-02014-y","cite":"Broeils L.A., Ruiz-Orera J., Snel B., Hubner N., van Heesch S. Evolution and implications of de novo genes in humans. Nat Ecol Evol 2023; 7: 804–815","doi":"10.1038/s41559-023-02014-y","pmid":""},"src_12":{"url":"https://doi.org/10.1038/s41576-023-00652-3","cite":"Feschotte C. Transposable elements: McClintock’s legacy revisited. Nat Rev Genet 2023; 24: 797–800","doi":"10.1038/s41576-023-00652-3","pmid":""},"src_13":{"url":"https://doi.org/10.1038/s41576-023-00688-5","cite":"Keeling P.J. Horizontal gene transfer in eukaryotes: aligning theory with data. Nat Rev Genet 2024; 25: 416–430","doi":"10.1038/s41576-023-00688-5","pmid":""},"src_14":{"url":"https://doi.org/10.1038/s41559-026-03054-w","cite":"Ocaña-Pallarès E. et al. Signatures of gene transfer in the parallel evolution of osmotrophic specialization in eukaryotes. Nat Ecol Evol 2026","doi":"10.1038/s41559-026-03054-w","pmid":""},"src_15":{"url":"https://doi.org/10.1038/nrg3966","cite":"Stewart J.B., Chinnery P.F. The dynamics of mitochondrial DNA heteroplasmy: implications for human health and disease. Nat Rev Genet 2015; 16: 530–542","doi":"10.1038/nrg3966","pmid":""},"src_16":{"url":"https://doi.org/10.1098/rstb.2022.0055","cite":"Cano A.V. et al. Mutation bias and the predictability of evolution. Phil Trans R Soc B 2023; 378: 20220055","doi":"10.1098/rstb.2022.0055","pmid":""},"src_17":{"url":"https://doi.org/10.1016/j.tig.2021.06.015","cite":"Hollox E.J., Zuccherato L.W., Tucci S. Genome structural variation in human evolution. Trends Genet 2022; 38: 45–58","doi":"10.1016/j.tig.2021.06.015","pmid":""},"src_18":{"url":"https://doi.org/10.1038/s41576-026-00980-0","cite":"Feschotte C. Transposable elements as catalysts of evolutionary innovation. Nat Rev Genet 2026","doi":"10.1038/s41576-026-00980-0","pmid":""}},"questions":["От мутации к замещению","Нейтральная эволюция и dN/dS","Молекулярные часы","Откуда берутся новые гены"],"exam_ids":["four-concepts","mutation-rate","spectrum","neutral-theory","dnds-read","dnds-limits","uneven-clock","duplication","copy
