с гетероплазмией</div><p>МтДНК человека — кольцевая молекула из 16 569 пар нуклеотидов, кодирующая 13 белков, 22 тРНК и 2 рРНК; в клетке много её копий. Она передаётся по материнской линии и практически не рекомбинирует, поэтому вся молекула наследуется как одна единица. Скорость накопления замен в ней выше, чем в большинстве ядерных участков. Если в клетке сосуществуют копии мтДНК разных вариантов, это <a href="#ns-g-S14-T68">гетероплазмия</a>; доли вариантов могут различаться между клетками, тканями и поколениями.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-four-concepts">«Мутационное событие, вариант, полиморфизм, замещение»</a>; вспомнить <a href="seminar-12-route.html#gene-transfer">семинар 12: «Перенос генов в ядро и импорт белков»</a></p><p>Быстрое накопление различий удобно для изучения недавней истории, но при глубоком расхождении приводит к насыщению. Одна митохондриальная линия отражает только материнскую линию и может не совпадать с историей ядерного генома. Пороговые эффекты гетероплазмии и их значение для клетки разбираются в курсе «Молекулярная биология».</p><p><b>На практикуме.</b> Не моделируется.</p><p><b>Ограничения.</b> У разных организмов наследование мтДНК различно: известны отцовское и двуродительское наследование.</p><p><b>Дальше в курсе «Молекулярная биология».</b> Как наследование и сегрегация меняют распределение вариантов мтДНК — <a href="https://edu.mazunin.science/seminar-9-route.html#segregation">«Молекулярная биология», семинар 9</a>.</p><div class="static-quiz"><h3>Почему мтДНК наследуется как одна единица?</h3><ol><li><b>А.</b> Потому что молекула очень маленькая <i>(неверный вариант)</i><br><span class="expl">Размер не мешает рекомбинации; дело в её отсутствии</span></li><li><b>Б.</b> Она практически не рекомбинирует <i>(верный вариант)</i><br><span class="expl">Варианты в разных её участках передаются вместе</span></li><li><b>В.</b> Потому что в клетке мало её копий <i>(неверный вариант)</i><br><span class="expl">Копий в клетке много</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrg3966">Stewart J.B., Chinnery P.F. The dynamics of mitochondrial DNA heteroplasmy: implications for human health and disease. Nat Rev Genet 2015; 16: 530–542</a></li></ul><p>Схема качественная · число копий условно.</p></details></article><article class="card print-unit" id="ns-wgd-brain"><div class="eyebrow">Откуда берутся новые гены · шаг 27 из 30</div><h2>Что происходило с копиями генов в мозге позвоночных</h2><p class="lead">После удвоений генома копии генов чаще делили между собой типы клеток мозга, чем приобретали новые.</p><div class="note"><strong>Что показывает схема.</strong> Три полосы долей исходов и пример на дереве копий</div><p>У позвоночных геном удваивался целиком в начале их эволюции и ещё раз у предков челюстных позвоночных. Сравнили, маркерами каких типов клеток мозга служат копии генов у человека, мыши, ящерицы и миноги (с ланцетником для сравнения), и реконструировали состояние у их общего предка; брали группы копий, пара которых есть хотя бы у трёх видов из четырёх. Копии, оставшиеся от удвоений генома, чаще копий от отдельных дупликаций служат <a href="#ns-g-S14-T70">маркерами типов клеток</a>. Изменения того, маркерами каких типов клеток служат копии (2693 группы паралогов), примерно на 78 % объясняются разделением функций предкового гена, на 21 % — новой функцией одной копии, менее чем на 1 % — тем, что ни одна копия больше не служит маркером этого типа клеток.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-duplication">«Дупликация: как возникает копия гена»</a>, шаг <a href="#ns-copy-outcomes">«Что происходит с копиями: четыре исхода»</a></p><p>По уровню экспрессии авторы находят и признаки отбора на дозу. Работа поддерживает модель, в которой копии после дупликации частично утрачивают функции и дополняют друг друга.</p><p><b>Как это узнали.</b> Прочитали РНК отдельных клеток мозга у нескольких видов, разделили клетки на типы и для каждой пары копий определили, маркером каких типов она служит.</p><p><b>Граница вывода.</b> Авторы допускают, что их способ может легче обнаруживать разделение функций, чем новую функцию; «маркер» — не то же, что «работает в клетке»: ген может работать в клетке и не быть её отличительным; копии, утраченные полностью, в анализ не попадают; состояние предка — реконструкция.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 4.</p><div class="static-quiz"><h3>Противоречит ли эта работа тому, что чаще всего одна копия утрачивает функцию?</h3><ol><li><b>А.</b> Да: утрат менее 1 % <i>(неверный вариант)</i><br><span class="expl">Менее 1 % — среди изменений у сохранившихся копий</span></li><li><b>Б.</b> Да: новая функция встречается чаще всего <i>(неверный вариант)</i><br><span class="expl">Чаще всего — разделение функций</span></li><li><b>В.</b> Нет: в анализ вошли только сохранившиеся копии <i>(верный вариант)</i><br><span class="expl">Не противоречит: «утрата» в работе — когда ни одна копия больше не служит маркером данного типа клеток</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-026-10629-x">Zhu Y. et al. Whole-genome duplication shaped cell-type evolution in the vertebrate brain. Nature 2026</a></li></ul><p>Схема по данным работы, упрощённая · доли — реконструкция.</p></details></article><article class="card print-unit" id="ns-osmotroph-hgt"><div class="eyebrow">Откуда берутся новые гены · шаг 28 из 30</div><h2>Перенос генов при переходе эукариот к питанию всасыванием</h2><p class="lead">У четырёх групп эукариот, независимо перешедших к одному способу питания, заметная часть общего набора генов несёт признаки переноса.</p><div class="note"><strong>Что показывает схема.</strong> Дерево эукариот с четырьмя группами осмотрофов и стрелками переносов</div><p><a href="#ns-g-S14-T69">Осмотрофия</a> — питание всасыванием растворённых веществ, часто после внеклеточного переваривания, без захвата частиц. К ней независимо перешли грибы и три другие группы эукариот, внешне похожие на грибы. Реконструировали эволюцию генов этих групп: эти группы возникли, по оценке, около 1000–720 млн лет назад или несколько раньше; набор генов, общий для осмотрофов, обогащён генами обмена веществ. Не менее 20 % этого набора несут признаки, совместимые с горизонтальным переносом; 166 деревьев генов поддерживают переносы между неродственными группами осмотрофов, в частности между грибами и одной из грибоподобных групп.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-hgt-eukaryotes">«Горизонтальный перенос генов у эукариот»</a></p><p>Работа подтверждает, что у эукариот перенос генов возможен и может участвовать в сходных приспособлениях разных линий.</p><p><b>Как это узнали.</b> Строили деревья генов и сравнивали их с деревом видов: ген, стоящий на дереве рядом с далёкой группой, — кандидат на перенос; кандидатов проверяли на ошибки построения деревьев и загрязнение.</p><p><b>Граница вывода.</b> «Признаки, совместимые с переносом», — реконструкция; даты — оценка часов с интервалом; что перенос вызвал переход к осмотрофии, работа не доказывает.</p><p><b>На практикуме.</b> Продвинутый уровень не моделирует; связь — «Найти причину» IV.</p><div class="static-quiz"><h3>Почему переносы в этой работе названы «совместимыми с переносом»?</h3><ol><li><b>А.</b> Перенос выведен из деревьев, а не увиден <i>(верный вариант)</i><br><span class="expl">Перенос реконструирован по данным</span></li><li><b>Б.</b> Потому что сами гены в геномах не найдены <i>(неверный вариант)</i><br><span class="expl">Гены найдены; их происхождение реконструировано</span></li><li><b>В.</b> Потому что осмотрофия — это вид болезни <i>(неверный вариант)</i><br><span class="expl">Осмотрофия — способ питания</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-14.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41559-026-03054-w">Ocaña-Pallarès E. et al. Signatures of gene transfer in the parallel evolution of osmotrophic specialization in eukaryotes. Nat Ecol Evol 2026</a></li></ul><p>Схема по данным работы, упрощённая · даты — оценка модели.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог · шаг 29 из 30</div><h2>Итоговая задача: что объясняет различие?</h2><p class="lead">Наблюдаемое различие последовательностей само не называет своей причины: нужно назвать совместимые объяснения и данные, которые их различают.</p><div class="note"><strong>Что показывает схема.</strong> Четыре карточки наблюдений с объяснениями и данными</div><p>Четыре наблюдения практикума: (I) одинаковые различия у всех обследованных особей двух видов — замещения; линию каждого показывает внешняя группа; (II) dN/dS = 0,1 — преобладает очищающий отбор, положительный в отдельных кодонах не исключён; (III) дерево четырёх видов в заменах на сайт без датированных событий — время расхождения определить нельзя, нужна калибровка; (IV) копия гена без интронов, на другой хромосоме, с преждевременным стоп-кодоном — ретропозиция и утрата функции (псевдоген); работает ли копия — по транскрипции, когда возник стоп-кодон — по близким видам.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-four-concepts">«Мутационное событие, вариант, полиморфизм, замещение»</a>, шаг <a href="#ns-dnds-read">«Показатель dN/dS: как читать»</a>, шаг <a href="#ns-interval">«Интервал вместо даты»</a>, шаг <a href="#ns-copy-outcomes">«Что происходит с копиями: четыре исхода»</a></p><p>Общий порядок: (1) назвать уровень наблюдения — вариант, полиморфизм, замещение, отношение, дата, число копий; (2) перечислить совместимые объяснения; (3) указать минимальные данные, дающие каждому объяснению положительный признак; (4) если данных нет, сказать «по этим данным различить нельзя».</p><p><b>На практикуме.</b> Итоговая задача под вкладкой 4.</p><div class="static-quiz"><h3>Почему при dN/dS = 0,1 нельзя исключить положительный отбор?</h3><ol><li><b>А.</b> Можно: значение много меньше 1 <i>(неверный вариант)</i><br><span class="expl">Среднее не показывает распределения по кодонам</span></li><li><b>Б.</b> Он мог действовать на немногие кодоны <i>(верный вариант)</i><br><span class="expl">Среднее по гену это скрывает</span></li><li><b>В.</b> Можно, если гены ортологичны <i>(неверный вариант)</i><br><span class="expl">Ортология нужна для сравнения, но не исключает отбора в кодонах</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-14.html#q1">Вопрос 1 →</a> <a href="seminar-14.html#q2">Вопрос 2 →</a> <a href="seminar-14.html#q3">Вопрос 3 →</a> <a href="seminar-14.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nrg.2015.8">dos Reis M., Donoghue P.C.J., Yang Z. Bayesian molecular clock dating of species divergences in the genomics era. Nat Rev Genet 2016; 17: 71–80</a></li><li><a href="https://doi.org/10.1016/j.tig.2021.06.016">Kuzmin E., Taylor J.S., Boone C. Retention of duplicated genes in evolution. Trends Genet 2022; 38: 59–72</a></li></ul><p>Схема качественная · четыре ситуации условны.</p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог · шаг 30 из 30</div><h2>Связи и что дальше</h2><p class="lead"></p><ol class="mech"></ol><h3>Что понадобилось из прежних семинаров</h3><ul><li><a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a> — откуда берётся изменение последовательности</li><li><a href="seminar-10-route.html#sequence-changes">семинар 10: «Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции»</a> — какие бывают замены</li><li><a href="seminar-10-route.html#synonymous-not-neutral">семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»</a> — почему нейтральность синонимичных замен — допущение</li><li><a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a> — откуда новые гены</li><li><a href="seminar-12-route.html#r3">семинар 12: «Как датируют LUCA и почему это модель»</a> — часы как модель</li><li><a href="seminar-13-route.html#fixation">семинар 13: «Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a> — почему большинство вариантов исчезает</li></ul><h3>Где это понадобится дальше в разделе</h3><ul><li>шаг <a href="#ns-duplication">«Дупликация: как возникает копия гена»</a> → <a href="seminar-15-route.html#ortho-para">семинар 15: «Ортологи и паралоги: какое событие в общем узле»</a> — паралоги расходятся после дупликации гена, ортологи — при разделении видов</li><li>шаг <a href="#ns-duplication">«Дупликация: как возникает копия гена»</a> → <a href="seminar-16-route.html#gene-culture">семинар 16: «Генно-культурная коэволюция: молоко и крахмал»</a> — число копий гена амилазы слюны различается между популяциями и связано с количеством фермента в слюне</li><li>шаг <a href="#ns-accumulation">«Различия накапливаются со временем»</a> → <a href="seminar-15-route.html#branch-length">семинар 15: «Длина ветви: ничего, замены или время»</a> — на филограмме длина ветви пропорциональна числу замен на сайт вдоль ветви</li><li>шаг <a href="#ns-dnds-limits">«Чего dN/dS не показывает»</a> → <a href="seminar-15-route.html#alignment-matters">семинар 15: «Почему выравнивание не нейтральная операция»</a> — наблюдаемое различие меньше числа произошедших замен, и ошибки выравнивания переходят в дерево</li><li>шаг <a href="#ns-mtdna">«Митохондриальная ДНК как отдельный случай»</a> → <a href="seminar-16-route.html#molecular-past">семинар 16: «Какие молекулярные данные говорят о прошлом»</a> — прошлое из генома не считывают, а реконструируют через модель наследования; митохондриальная ДНК даёт генеалогию одного участка</li><li>шаг <a href="#ns-hgt-eukaryotes">«Горизонтальный перенос генов у эукариот»</a> → <a href="seminar-16-route.html#amr">семинар 16: «Устойчивость к антимикробным препаратам»</a> — у бактерий источник устойчивости — не только мутации, но и горизонтальный перенос генов, прежде всего с плазмидами</li></ul><h3>Что дальше в курсе</h3><ul><li><a href="seminar-15-route.html">семинар 15: «Филогенетика, виды и видообразование»</a> — как по различиям последовательностей строят и читают деревья, почему дерево гена может не совпадать с деревом видов; продолжает шаг <a href="#ns-accumulation">«Различия накапливаются со временем»</a>, шаг <a href="#ns-duplication">«Дупликация: как возникает копия гена»</a></li><li>Шаги-продолжения: <a href="seminar-15-route.html#branch-length">семинар 15: «Длина ветви: ничего, замены или время»</a>, <a href="seminar-15-route.html#ortho-para">семинар 15: «Ортологи и паралоги: какое событие в общем узле»</a>, <a href="seminar-15-route.html#gene-species-tree">семинар 15: «Дерево гена и дерево видов»</a></li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Почему эффект гетероплазмии может проявляться нелинейно — <a href="https://edu.mazunin.science/seminar-9-route.html#heteroplasmy-threshold">«Молекулярная биология», семинар 9</a></li><li>Почему одинаковая гетероплазмия не означает одинакового числа копий дикого типа — <a href="https://edu.mazunin.science/seminar-9-route.html#copy-number">«Молекулярная биология», семинар 9</a> — продолжает шаг <a href="#ns-mtdna">«Митохондриальная ДНК как отдельный случай»</a></li><li>Соматические мутации и клональная эволюция — «Молекулярная биология», раздел III/IV (в разработке) — продолжает шаг <a href="#ns-somatic-lifespan">«Скорость мутаций в клетках тела и продолжительность жизни»</a></li><li>Как наследование и сегрегация меняют распределение вариантов мтДНК — <a href="https://edu.mazunin.science/seminar-9-route.html#segregation">«Молекулярная биология», семинар 9</a> — продолжает шаг <a href="#ns-mtdna">«Митохондриальная ДНК как отдельный случай»</a></li></ul><div class="static-quiz"><h3>Где в курсе разбирается, почему синонимичная замена может быть не нейтральной?</h3><ol><li><b>А.</b> В теме о закреплении изменения при репликации <i>(неверный вариант)</i><br><span class="expl">Там — как изменение становится мутацией: <a href="seminar-8-route.html#fixation">семинар 8: «Как изменение закрепляется при репликации»</a>; о синонимичных кодонах — <a href="seminar-10-route.html#synonymous-not-neutral">семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»</a>.</span></li><li><b>Б.</b> В теме о генетическом коде и трансляции <i>(верный вариант)</i><br><span class="expl">Синонимичные кодоны могут менять скорость трансляции и количество белка: <a href="seminar-10-route.html#synonymous-not-neutral">семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»</a>.</span></li><li><b>В.</b> В теме о переносе генов между линиями <i>(неверный вариант)</i><br><span class="expl">Там — история генов и линий: <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a>; о синонимичных кодонах — <a href="seminar-10-route.html#genetic-code">семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»</a>.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-14.html#q1">Вопрос 1 →</a> <a href="seminar-14.html#q2">Вопрос 2 →</a> <a href="seminar-14.html#q3">Вопрос 3 →</a> <a href="seminar-14.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S14-T01"><dt>Мутационное событие</dt><dd>Однократное изменение последовательности ДНК в одной клетке; начало истории варианта.</dd></div><div id="ns-g-S14-T02"><dt>Вариант</dt><dd>Наблюдаемое состояние последовательности ДНК в данном участке у клетки или особи. В семинаре 12 вариантом названа одна из различающихся форм воспроизводящейся системы (<a href="seminar-12-route.html#selection">семинар 12: «Условия естественного отбора»</a>); вариант последовательности — её частный случай.</dd></div><div id="ns-g-S14-T03"><dt>Полиморфизм</dt><dd>Существование в популяции двух и более аллелей локуса с заметной частотой. В этом семинаре: речь о вариантах участка генома, а не только об аллелях одного локуса.</dd></div><div id="ns-g-S14-T04"><dt>Замещение</dt><dd>Закрепление в популяции нового варианта вместо прежнего; различия между видами складываются из замещений.</dd></div><div id="ns-g-S14-T05"><dt>Закрепление</dt><dd>Рост частоты варианта в популяции до единицы, когда других вариантов участка не остаётся; не путать с закреплением изменения ДНК при репликации.</dd></div><div id="ns-g-S14-T06"><dt>Зародышевая линия</dt><dd>Клетки, от которых происходят половые клетки; их изменения передаются потомкам.</dd></div><div id="ns-g-S14-T07"><dt>Соматическая мутация</dt><dd>Изменение ДНК в клетке тела; передаётся дочерним клеткам; у животных с обособленной зародышевой линией, в том числе у человека, потомкам организма не передаётся.</dd></div><div id="ns-g-S14-T08"><dt>Скорость мутаций</dt><dd>Число новых изменений на нуклеотид или на геном за поколение либо за год.</dd></div><div id="ns-g-S14-T09"><dt>Скорость замещений</dt><dd>Число закрепившихся различий на сайт за единицу времени в одной линии.</dd></div><div id="ns-g-S14-T10"><dt>Однонуклеотидная замена</dt><dd>Замена одного нуклеотида другим.</dd></div><div id="ns-g-S14-T11"><dt>Вставка и делеция</dt><dd>Добавление или утрата одного или нескольких нуклеотидов.</dd></div><div id="ns-g-S14-T12"><dt>Структурный вариант</dt><dd>Изменение крупного участка генома: делеция, дупликация, инверсия, перемещение, изменение числа копий участка.</dd></div><div id="ns-g-S14-T13"><dt>Тандемный повтор</dt><dd>Участок, в котором короткая последовательность повторяется подряд много раз; число повторов часто меняется.</dd></div><div id="ns-g-S14-T14"><dt>Спектр мутаций</dt><dd>Относительные частоты разных типов изменений, возникающих в геноме.</dd></div><div id="ns-g-S14-T15"><dt>Мутационное смещение</dt><dd>Систематическое неравенство частот возникновения разных изменений.</dd></div><div id="ns-g-S14-T16"><dt>Транзиция</dt><dd>Замена пурина на пурин или пиримидина на пиримидин.</dd></div><div id="ns-g-S14-T17"><dt>Трансверсия</dt><dd>Замена пурина на пиримидин или пиримидина на пурин.</dd></div><div id="ns-g-S14-T18"><dt>Функциональный эффект</dt><dd>Измеримое изменение молекулы, клетки или признака, вызванное вариантом.</dd></div><div id="ns-g-S14-T19"><dt>Селективный эффект</dt><dd>Изменение вклада носителя варианта в следующие поколения.</dd></div><div id="ns-g-S14-T20"><dt>Коэффициент отбора (s)</dt><dd>Относительная разница приспособленности сравниваемых генотипов. В моделях отбора против генотипа s = 1 − w, и s &gt; 0 означает сниженную приспособленность; при описании изменения частоты варианта s &gt; 0 означает рост его частоты под действием отбора, s &lt; 0 — снижение. Какое соглашение принято, сказано в шаге.</dd></div><div id="ns-g-S14-T21"><dt>Мутация после оплодотворения</dt><dd>Изменение, возникшее в клетке зародыша; есть только в части клеток организма.</dd></div><div id="ns-g-S14-T22"><dt>Центромера</dt><dd>Участок хромосомы, на котором собирается кинетохор — место прикрепления нитей веретена при делении; состоит из длинных повторов.</dd></div><div id="ns-g-S14-T23"><dt>Нейтральная теория молекулярной эволюции</dt><dd>Теория, по которой большинство замещений в последовательностях — закрепление нейтральных вариантов дрейфом; скорость нейтральных замещений равна скорости нейтральных мутаций.</dd></div><div id="ns-g-S14-T24"><dt>Нейтральный вариант</dt><dd>Вариант, не влияющий на приспособленность носителя. В этом семинаре: нейтральность варианта оценивают для данных условий.</dd></div><div id="ns-g-S14-T25"><dt>Генетический дрейф</dt><dd>Случайные изменения частот аллелей из-за конечного числа копий генов, переданных следующему поколению.</dd></div><div id="ns-g-S14-T26"><dt>Почти нейтральная теория</dt><dd>Дополнение нейтральной теории: варианты со слабым эффектом (|s| не больше 1/(2Ne)) меняют частоту главным образом дрейфом, поэтому то, что с ними происходит, зависит от численности популяции.</dd></div><div id="ns-g-S14-T27"><dt>Эффективная численность (Ne)</dt><dd>Численность идеальной популяции, в которой дрейф шёл бы с той же скоростью, что в реальной.</dd></div><div id="ns-g-S14-T28"><dt>Очищающий отбор</dt><dd>Отбор, удаляющий вредные варианты; другое название — отрицательный отбор.</dd></div><div id="ns-g-S14-T29"><dt>Положительный отбор</dt><dd>Отбор, повышающий частоту полезных вариантов.</dd></div><div id="ns-g-S14-T30"><dt>Синонимичная замена</dt><dd>Замена нуклеотида, при которой новый кодон кодирует ту же аминокислоту.</dd></div><div id="ns-g-S14-T31"><dt>Несинонимичная замена</dt><dd>Замена нуклеотида, меняющая кодируемую аминокислоту.</dd></div><div id="ns-g-S14-T32"><dt>Синонимичный сайт</dt><dd>Доля позиции кодона, приходящаяся на возможные замены, не меняющие аминокислоту.</dd></div><div id="ns-g-S14-T33"><dt>Несинонимичный сайт</dt><dd>Доля позиции кодона, приходящаяся на возможные замены, меняющие аминокислоту.</dd></div><div id="ns-g-S14-T34"><dt>dN</dt><dd>Число несинонимичных различий, делённое на число несинонимичных сайтов.</dd></div><div id="ns-g-S14-T35"><dt>dS</dt><dd>Число синонимичных различий, делённое на число синонимичных сайтов.</dd></div><div id="ns-g-S14-T36"><dt>dN/dS (ω)</dt><dd>Отношение dN к dS; меньше 1 — изменения аминокислот закреплялись реже синонимичных, больше 1 — чаще.</dd></div><div id="ns-g-S14-T37"><dt>Насыщение</dt><dd>Потеря информации при сильном расхождении: повторные замены в одной позиции не видны, и различия растут медленнее времени.</dd></div><div id="ns-g-S14-T38"><dt>Псевдоген</dt><dd>Копия гена, утратившая функцию; изменения в ней почти все нейтральны.</dd></div><div id="ns-g-S14-T39"><dt>Неравное использование синонимичных кодонов</dt><dd>Преобладание одних синонимичных кодонов над другими, особенно в высокоэкспрессируемых генах.</dd></div><div id="ns-g-S14-T40"><dt>Ортологи</dt><dd>Гомологичные гены разных линий, разошедшиеся при разделении линий. В этом семинаре: сравнивают гены разных видов, разошедшиеся при разделении видов.</dd></div><div id="ns-g-S14-T41"><dt>Паралоги</dt><dd>Гомологичные гены, возникшие при дупликации в одной линии.</dd></div><div id="ns-g-S14-T42"><dt>Молекулярные часы</dt><dd>Статистическая модель, связывающая число замен в последовательностях со временем, прошедшим от общего предка.</dd></div><div id="ns-g-S14-T43"><dt>Калибровка</dt><dd>Привязка узла дерева к возрасту, известному по ископаемым остаткам или изотопным данным; используется в молекулярных часах. В этом семинаре: по калибровке число замен переводят в годы.</dd></div><div id="ns-g-S14-T44"><dt>Строгие часы</dt><dd>Модель с одной скоростью замен для всех ветвей дерева.</dd></div><div id="ns-g-S14-T45"><dt>Нестрогие часы</dt><dd>Модели, в которых скорость замен различается между ветвями и оценивается вместе с датами.</dd></div><div id="ns-g-S14-T46"><dt>Интервал оценки</dt><dd>Диапазон значений, совместимых с данными и допущениями модели при заданной вероятности.</dd></div><div id="ns-g-S14-T47"><dt>Внешняя группа</dt><dd>Вид или группа, отделившиеся раньше сравниваемых; по ней определяют предковое состояние и неравенство скоростей.</dd></div><div id="ns-g-S14-T48"><dt>Время поколения</dt><dd>Средний возраст родителей при рождении потомков.</dd></div><div id="ns-g-S14-T49"><dt>Длина ветви</dt><dd>Число замен на сайт (или время) вдоль ветви дерева; что означает длина, подписывают на каждом дереве.</dd></div><div id="ns-g-S14-T50"><dt>Дупликация гена</dt><dd>Возникновение второй копии гена в геноме.</dd></div><div id="ns-g-S14-T51"><dt>Неравный кроссинговер</dt><dd>Обмен участками между гомологичными хромосомами, выровненными со сдвигом; одна хроматида получает дупликацию, другая — делецию.</dd></div><div id="ns-g-S14-T52"><dt>Ретропозиция</dt><dd>Возникновение копии гена обратной транскрипцией зрелой мРНК и встраиванием ДНК-копии в геном; копия не содержит интронов.</dd></div><div id="ns-g-S14-T53"><dt>Полногеномная дупликация</dt><dd>Удвоение всех хромосом генома; другое название — удвоение генома.</dd></div><div id="ns-g-S14-T54"><dt>Утрата функции копией</dt><dd>Исход дупликации, при котором одна копия накапливает выключающие изменения и становится псевдогеном или исчезает.</dd></div><div id="ns-g-S14-T55"><dt>Сохранение дозы</dt><dd>Исход дупликации, при котором обе копии сохраняются, потому что важно суммарное количество продукта.</dd></div><div id="ns-g-S14-T56"><dt>Разделение функций</dt><dd>Исход дупликации, при котором копии делят части функции предкового гена (места или время работы); другое название — субфункционализация.</dd></div><div id="ns-g-S14-T57"><dt>Новая функция</dt><dd>Исход дупликации, при котором одна копия приобретает свойство, которого не было у предкового гена; другое название — неофункционализация.</dd></div><div id="ns-g-S14-T58"><dt>Ген de novo</dt><dd>Ген, возникший из последовательности, которая у предков не кодировала белок.</dd></div><div id="ns-g-S14-T59"><dt>Протоген</dt><dd>Транскрибируемый участок, возникший из последовательности, не бывшей геном, с транслируемой рамкой считывания; функция не доказана.</dd></div><div id="ns-g-S14-T60"><dt>Открытая рамка считывания</dt><dd>Участок от старт-кодона до стоп-кодона без промежуточных стоп-кодонов.</dd></div><div id="ns-g-S14-T61"><dt>Мобильный генетический элемент</dt><dd>Участок ДНК, способный перемещаться в геноме или между клетками (плазмида, транспозон, геном бактериофага). В этом семинаре: речь об элементах, которые перемещаются или копируются в новые места генома.</dd></div><div id="ns-g-S14-T62"><dt>Ретротранспозон</dt><dd>Мобильный элемент, копирующийся через РНК и обратную транскрипцию.</dd></div><div id="ns-g-S14-T63"><dt>ДНК-транспозон</dt><dd>Мобильный элемент, перемещающийся как ДНК при участии транспозазы.</dd></div><div id="ns-g-S14-T64"><dt>Кооптация</dt><dd>Использование существующей последовательности или функции в новой роли.</dd></div><div id="ns-g-S14-T65"><dt>Горизонтальный перенос генов</dt><dd>Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями.</dd></div><div id="ns-g-S14-T66"><dt>Эндосимбиотический перенос генов</dt><dd>Перенос генов из генома митохондрии или пластиды в ядерный геном.</dd></div><div id="ns-g-S14-T67"><dt>Митохондриальная ДНК (мтДНК)</dt><dd>Собственная ДНК митохондрий; у человека кодирует 13 белков и 24 РНК. В этом семинаре: у человека это кольцевая молекула из 16 569 пар нуклеотидов; её 24 РНК — 22 тРНК и 2 рРНК.</dd></div><div id="ns-g-S14-T68"><dt>Гетероплазмия</dt><dd>Сосуществование в клетке копий митохондриальной ДНК разных вариантов.</dd></div><div id="ns-g-S14-T69"><dt>Осмотрофия</dt><dd>Питание всасыванием растворённых веществ, часто после внеклеточного переваривания, без захвата частиц.</dd></div><div id="ns-g-S14-T70"><dt>Маркер типа клеток</dt><dd>Ген, работающий преимущественно в определённом типе клеток и позволяющий его распознать.</dd></div><div id="ns-g-S14-T71"><dt>Кодон</dt><dd>Последовательность из трёх нуклеотидов мРНК, соответствующая аминокислоте или сигналу окончания трансляции.</dd></div></dl></section></noscript>

ort_route":"Если времени мало: десять шагов, по которым построена самопроверка →"},"lessons":[{"id":"four-concepts","num":1,"section":0,"questions":[1],"title":"Мутационное событие, вариант, полиморфизм, замещение","keywords":["Мутационное событие","Зародышевая линия","Соматическая мутация","Вариант","Полиморфизм","Закрепление"],"lead":["Изменение возникает в одной молекуле ДНК одной клетки, а различие между видами — это изменение, которое есть у всех особей вида. Между этими событиями — история варианта в популяции."],"mechanism":["[[T01|Мутационное событие]] — однократное изменение последовательности ДНК в одной клетке. У животных с рано обособленной зародышевой линией, в том числе у человека, в следующие поколения переходят изменения клеток [[T06|зародышевой линии]]; [[T07|соматические мутации]] остаются в клетках тела и потомкам не передаются. Потомок, получивший изменение, несёт [[T02|вариант]] — наблюдаемое состояние последовательности; в популяции из N диплоидных особей новая копия — одна из 2N. Пока в популяции сосуществуют прежний и новый варианты, это [[T03|полиморфизм]]. Частота варианта меняется дрейфом и отбором; если она доходит до 1, вариант [[T05|закрепился]], и прежнее состояние сменилось новым — произошло [[T04|замещение]]. Различия между видами складываются из замещений, накопленных в каждой линии после их расхождения."],"paragraphs":["Большинство новых вариантов исчезает в первые поколения, даже если они не влияют на приспособленность: нейтральная копия закрепляется с вероятностью, равной её начальной частоте 1/(2N). Поэтому мутационное событие ещё не означает различия между видами. По одной выборке видно состояние последовательности, но не момент события: вариант мог возникнуть много поколений назад. Отличить полиморфизм от замещения можно только по выборке из популяций обоих видов.","<b>На практикуме.<\/b> Вкладка 1: выравнивание двух видов, шкала «возник → редкий → частый → закрепился или потерян» и 10 повторов истории новой копии.","<b>Ограничения.<\/b> У бактерий и большинства одноклеточных разделения на зародышевую линию и клетки тела нет: изменение передаётся потомкам при делении клетки; у вирусов — при копировании генома. У растений и многих беспозвоночных зародышевая линия обособляется поздно, и изменения клеток тела могут попасть в половые клетки."],"conditions":"Схема качественная · число особей и поколений условно.","sources":["src_01","src_02"],"base":"вспомнить [[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]] и [[seminar-13-route.html#fixation|семинар 13: «Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»]]","quiz":{"id":"S14-L01","question":"У трёх из десяти обследованных особей вида в позиции гена G, у остальных — A. Что это?","options":[{"id":"S14-L01-1","text":"Полиморфизм","correct":true,"feedback":"В популяции сосуществуют два варианта"},{"id":"S14-L01-2","text":"Замещение","correct":false,"feedback":"Замещение — вариант, закрепившийся у всех; здесь вариантов два"},{"id":"S14-L01-3","text":"Мутационное событие","correct":false,"feedback":"Видно состояние последовательности; когда произошло событие, по выборке не сказать"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются событие, вариант, полиморфизм и замещение?","status":"Схема качественная · число особей и поколений условно","modes_label":"Уровень","modes":["событие","вариант","полиморфизм","замещение"],"args":[{"lvl":"event"},{"lvl":"variant"},{"lvl":"poly"},{"lvl":"subst"}],"notes":["Изменение произошло в одной молекуле одной клетки","Потомок несёт вариант — одну копию из 2N","В популяции сосуществуют два варианта","Вариант закрепился: различие между видами"],"static":["Событие в клетке зародышевой линии → вариант у потомка → полиморфизм в популяции → закрепление и различие видов"],"scene":"s14_r_four","L":{"r_four_event":"событие","r_four_variant":"вариант","r_four_poly":"полиморфизм","r_four_subst":"замещение","r_four_cell":"клетка зародышевой линии","r_four_one":"изменение в одной молекуле ДНК","r_four_child":"потомок","r_four_var":"вариант — одна копия из 2N","r_four_pop":"популяция","r_four_freq":"частота варианта меняется","r_four_fixed":"закрепился","r_four_sp2":"вид 2","r_four_sp1":"вид 1","r_four_diff":"различие видов"}}},"exam_quiz":{"id":"S14-E01","question":"Что такое замещение?","options":[{"id":"S14-E01-1","text":"Закрепление нового варианта","correct":true,"feedback":"Различия между видами складываются из замещений"},{"id":"S14-E01-2","text":"Любое мутационное событие в ДНК","correct":false,"feedback":"Событие — начало; большинство вариантов исчезает"},{"id":"S14-E01-3","text":"Сосуществование двух вариантов","correct":false,"feedback":"Это полиморфизм"}]}},{"id":"change-types","num":2,"section":0,"questions":[1],"title":"Типы изменений: замена, вставка и делеция, структурные изменения","keywords":["Однонуклеотидная замена","Транзиция","Трансверсия","Вставка и делеция","Структурный вариант","Тандемный повтор"],"lead":["Изменения различаются по масштабу — от одного нуклеотида до целых хромосом — и по тому, как они возникают."],"mechanism":["[[T10|Однонуклеотидная замена]] меняет одно основание на другое: [[T16|транзиция]] — пурин на пурин или пиримидин на пиримидин, [[T17|трансверсия]] — пурин на пиримидин или наоборот. [[T11|Вставки и делеции]] добавляют или удаляют несколько нуклеотидов; в кодирующей последовательности вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания. [[T12|Структурные варианты]] — крупные (обычно больше 50–100 пар нуклеотидов) делеции, дупликации, инверсии и перемещения участков; к ним относятся и изменения числа копий участка генома. Особенно часто меняется число звеньев в [[T13|тандемных повторах]] — участках, где короткая последовательность повторяется подряд много раз: при репликации полимераза может проскальзывать."],"paragraphs":["Одно и то же изменение описывают по нескольким признакам сразу: масштаб, механизм возникновения (ошибка репликации, повреждение основания, неравный кроссинговер, перемещение мобильного элемента), положение (кодирующая последовательность, интрон, регуляторный участок), последствие для продукта и последствие для приспособленности. Последние два признака — разные (БИО-14·5).","<b>На практикуме.<\/b> Вкладка 1, продвинутый уровень: изменения в тандемных повторах составляют почти половину новых мутаций у ребёнка.","<b>Ограничения.<\/b> Порог, с которого изменение называют структурным, зависит от метода; его указывают в каждой работе."],"conditions":"Схема качественная · длины участков условны.","sources":["src_01","src_03","src_17"],"base":"БИО-14·1; вспомнить [[seminar-10-route.html#sequence-changes|семинар 10: «Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции»]]","quiz":{"id":"S14-L02","question":"Замена аденина на гуанин — это…","options":[{"id":"S14-L02-1","text":"Трансверсия","correct":false,"feedback":"Трансверсия — замена пурина на пиримидин или наоборот"},{"id":"S14-L02-2","text":"Транзиция","correct":true,"feedback":"Оба основания — пурины"},{"id":"S14-L02-3","text":"Структурный вариант","correct":false,"feedback":"Структурные варианты — изменения крупных участков"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие бывают изменения по масштабу?","status":"Схема качественная · длины условны","modes_label":"Изменение","modes":["замена","вставка и делеция","тандемный повтор","структурный вариант"],"args":[{"t":"snv"},{"t":"indel"},{"t":"tr"},{"t":"sv"}],"notes":["Одно основание заменено другим","Добавлены или утрачены нуклеотиды; не кратно трём — сдвиг рамки","Число звеньев повтора изменилось","Изменён крупный участок генома"],"static":["Четыре масштаба изменений: замена, вставка и делеция, изменение тандемного повтора, структурный вариант"],"scene":"s14_r_types","L":{"r_types_snv":"Замена","r_types_src":"исходная последовательность","r_types_mut":"изменённая","r_types_ts":"C→T — транзиция (пурин на пурин, пиримидин на пиримидин)","r_types_tv":"трансверсия — пурин на пиримидин или наоборот","r_types_indel":"Вставка и делеция","r_types_ins":"вставка","r_types_del":"делеция","r_types_fs":"Вставка или делеция не кратна трём — сдвиг рамки","r_types_tr":"Тандемный повтор","r_types_unit":"Звено повтора CAG: стало на одно больше","r_types_sv":"Структурный вариант","r_types_sdel":"делеция участка","r_types_sdup":"дупликация участка","r_types_inv":"инверсия"}},"zoomNarrow":true}},{"id":"mutation-rate","num":3,"section":0,"questions":[1],"title":"Скорость мутаций: что считают и на что делят","keywords":["Скорость мутаций","Скорость замещений"],"lead":["Скорость мутаций описывает возникновение новых вариантов; её нельзя путать со скоростью, с которой накапливаются различия между видами."],"mechanism":["[[T08|Скорость мутаций]] выражают числом новых изменений на нуклеотид (или на геном) за поколение либо за год. У человека её измеряют прямо: сравнивают геномы родителей и детей и находят изменения, которых нет у родителей. Однонуклеотидных замен в клетках зародышевой линии возникает около 1,2 на 100 млн нуклеотидов за поколение; при 3,2 млрд нуклеотидов гаплоидного генома это несколько десятков новых замен на каждую гамету. [[T09|Скорость замещений]] — число закрепившихся различий на сайт за единицу времени в одной линии; её оценивают, сравнивая виды. Для нейтральных изменений в простой модели эти скорости совпадают (БИО-14·8), для остальных — нет: вредные варианты возникают, но почти не закрепляются."],"paragraphs":["Небольшая скорость на нуклеотид даёт заметное число изменений на геном, потому что геном велик. Скорость мутаций различается между видами, участками генома, типами изменений; у человека число новых мутаций растёт с возрастом отца. В экспериментах накопления мутаций линии каждое поколение начинают от одной особи: отбор почти не действует, и изменения копятся; затем геномы читают и считают изменения.","<b>На практикуме.<\/b> Вкладка 1: конструктор показывает, что возникший вариант закрепляется редко.","<b>Ограничения.<\/b> Сравнение видов само по себе не даёт скорости мутаций: оно показывает уже закрепившиеся различия, на которые повлияли отбор и дрейф."],"conditions":"Схема качественная · скорость — порядок величины для человека (измерение по семьям).","sources":["src_01","src_03"],"base":"БИО-14·1, БИО-14·2","quiz":{"id":"S14-L03","question":"Чем скорость мутаций отличается от скорости замещений?","options":[{"id":"S14-L03-1","text":"Ничем: это два названия одной величины","correct":false,"feedback":"Совпадают они только для нейтральных изменений в простой модели"},{"id":"S14-L03-2","text":"Скорость замещений всегда выше скорости мутаций","correct":false,"feedback":"Обычно наоборот: вредные изменения возникают, но не закрепляются"},{"id":"S14-L03-3","text":"Первая — о возникновении вариантов, вторая — о закреплении","correct":true,"feedback":"Между ними стоят дрейф и отбор"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем скорость мутаций отличается от скорости замещений?","status":"Схема качественная · скорость — порядок величины для человека","modes_label":"Что сравнивают","modes":["родители и ребёнок","на нуклеотид и на геном","между видами"],"args":[{"v":"trio"},{"v":"scale"},{"v":"species"}],"notes":["Скорость мутаций измеряют, сравнивая геномы родителей и детей","Малая скорость на нуклеотид — десятки изменений на большой геном","Сравнение видов показывает замещения, а не скорость мутаций"],"static":["Скорость мутаций — по родословным; скорость замещений — по сравнению видов"],"scene":"s14_r_rates","L":{"r_rates_f":"отец","r_rates_m":"мать","r_rates_c":"ребёнок","r_rates_new":"новое изменение: его нет ни у отца, ни у матери","r_rates_pernt":"около 1,2 на 100 млн нуклеотидов","r_rates_pergam":"несколько десятков на гамету","r_rates_sp1":"вид 1","r_rates_sp2":"вид 2","r_rates_fixed":"закрепившиеся различия","r_tree_len":"длина ветви условна"}}},"exam_quiz":{"id":"S14-E02","question":"Почему мутации клеток тела не участвуют в различиях между видами?","options":[{"id":"S14-E02-1","text":"Они всегда вредны для клетки","correct":false,"feedback":"Многие нейтральны; дело в передаче"},{"id":"S14-E02-2","text":"Они не передаются потомкам","correct":true,"feedback":"В следующие поколения переходят изменения зародышевой линии"},{"id":"S14-E02-3","text":"Они не изменяют последовательность ДНК","correct":false,"feedback":"Изменяют, но только в клетках тела"}]}},{"id":"spectrum","num":4,"section":0,"questions":[1],"title":"Спектр мутаций и мутационное смещение","keywords":["Спектр мутаций","Мутационное смещение"],"lead":["Разные изменения возникают с разной частотой — ещё до того, как на них подействует отбор."],"mechanism":["[[T14|Спектр мутаций]] — набор относительных частот разных типов изменений. Он неравномерен: транзиции возникают чаще трансверсий; метилированный цитозин в сочетании CG при самопроизвольном дезаминировании превращается в тимин, поэтому замена C на T в CG — одна из самых частых; вставки и делеции особенно часты в тандемных повторах. Систематическое неравенство частот возникновения разных изменений называют [[T15|мутационным смещением]]."],"paragraphs":["Спектр зависит от участка генома, ткани, пола и возраста родителя, воздействий среды и различается между видами. Мутационное смещение влияет на то, какие варианты чаще поступают в популяцию; если одно и то же изменение возникает часто, оно может появиться независимо в разных линиях. Мутации возникают без связи с тем, полезны ли они: частота возникновения изменения не говорит о его пользе.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.5.","<b>Ограничения.<\/b> Спектр, измеренный по закрепившимся различиям между видами, искажён отбором; спектр возникновения измеряют по родословным и в экспериментах накопления мутаций."],"conditions":"Схема качественная · соотношение частот условно.","sources":["src_01","src_03","src_16"],"base":"БИО-14·2; вспомнить [[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]]","quiz":{"id":"S14-L04","question":"Почему замена C на T в CG возникает часто?","options":[{"id":"S14-L04-1","text":"Метилированный цитозин при дезаминировании даёт тимин","correct":true,"feedback":"Это частое самопроизвольное изменение"},{"id":"S14-L04-2","text":"Отбор поддерживает такие замены в популяции","correct":false,"feedback":"Речь о возникновении, а не о закреплении"},{"id":"S14-L04-3","text":"Тимин в этом сочетании полезнее цитозина","correct":false,"feedback":"Частота возникновения не связана с пользой"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему одни изменения возникают чаще других?","status":"Схема качественная · соотношения условны","modes_label":"Спектр","modes":["спектр","C→T в CG","транзиции и трансверсии"],"args":[{"panel":"spectrum","view":"all"},{"panel":"spectrum","view":"cpg"},{"panel":"spectrum","view":"tstv"}],"notes":["Разные изменения возникают с разной частотой","Метилированный C в CG при дезаминировании даёт T","Транзиции возникают чаще трансверсий"],"static":["Столбики относительных частот классов изменений: C→T в CG выше остальных"],"scene":"s14_t1","L":{"t1_p_head":"Новые изменения: родитель и ребёнок (последовательность условная)","t1_p_par":"родитель","t1_p_kid":"ребёнок","t1_p_cg":"C→T в CG","t1_p_cnt":"Счётчик классов изменений (условно)","t1_p_y":"относительная частота на сайт","t1_p_cpg":"C→T в CG","t1_p_ts":"другие транзиции","t1_p_tv":"трансверсии","t1_p_spec":"спектр мутаций","t1_p_tstv":"Транзиции возникают чаще трансверсий"}}},"exam_quiz":{"id":"S14-E04","question":"Что такое мутационное смещение?","options":[{"id":"S14-E04-1","text":"Неравная частота возникновения разных изменений","correct":true,"feedback":"Например, C на T в CG возникает часто"},{"id":"S14-E04-2","text":"Предпочтение отбором полезных изменений","correct":false,"feedback":"Это действие отбора, а не возникновение"},{"id":"S14-E04-3","text":"Сдвиг рамки считывания","correct":false,"feedback":"Это последствие вставки или делеции"}]}},{"id":"effects","num":5,"section":0,"questions":[1],"title":"Функциональный и селективный эффект","keywords":["Функциональный эффект","Селективный эффект","Коэффициент отбора (s)"],"lead":["Что вариант делает с продуктом гена и что он делает с вкладом носителя в следующие поколения — разные вопросы."],"mechanism":["[[T18|Функциональный эффект]] — измеримое изменение молекулы, клетки или признака: например, активность фермента снизилась вдвое. [[T19|Селективный эффект]] — изменение вклада носителя в следующие поколения; его выражают [[T20|коэффициентом отбора]] s. Первый не определяет второй: при избыточности функции, при доминировании нормальной копии или в определённой среде заметное изменение продукта может почти не менять выживания и числа потомков. И наоборот, небольшое изменение регуляции может оказаться важным в определённом возрасте или среде."],"paragraphs":["Селективный эффект зависит от генетического фона, среды, пола и возраста, от доминирования и от действия гена на несколько признаков. Варианты образуют непрерывный ряд эффектов, а не три строгие группы «вредные — нейтральные — полезные». Будет ли вариант с малым s вести себя как нейтральный, зависит ещё и от численности популяции (БИО-14·9).","<b>На практикуме.<\/b> Вкладка 1, шаг 1.6.","<b>Ограничения.<\/b> Коэффициент отбора для отдельного варианта в природе измерить трудно; в моделях он — параметр."],"conditions":"Схема качественная · активность и вклад условны.","sources":["src_01","src_07"],"base":"БИО-14·1; вспомнить [[seminar-10-route.html#synonymous-not-neutral|семинар 10: «Синонимичные кодоны могут менять количество белка в десятки раз»]]","quiz":{"id":"S14-L05","question":"Вариант снижает активность фермента, но не меняет выживания и числа потомков. Его селективный эффект…","options":[{"id":"S14-L05-1","text":"Отрицательный: продукт хуже","correct":false,"feedback":"Отрицательный функциональный эффект не означает отрицательного селективного"},{"id":"S14-L05-2","text":"Близок к нулю в этих условиях","correct":true,"feedback":"Изменился продукт, но не вклад в следующие поколения"},{"id":"S14-L05-3","text":"Положительный: фермент экономится","correct":false,"feedback":"Данных о большем числе потомков нет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем функциональный эффект отличается от селективного?","status":"Схема качественная · числа условны","modes_label":"Эффект","modes":["активность фермента","вклад в поколение"],"args":[{"panel":"effect","view":"function"},{"panel":"effect","view":"fitness"}],"notes":["Функциональный эффект: активность снижена вдвое","Селективный эффект: вклад в следующее поколение не изменился"],"static":["Активность фермента 100 % и 50 %, вклад в следующее поколение одинаков"],"scene":"s14_t1","L":{"t1_f_head":"Функциональный и селективный эффект (числа условные)","t1_f_no":"без варианта","t1_f_yes":"с вариантом (одна копия)","t1_f_act":"Активность фермента в пробирке","t1_f_fit":"Вклад в следующее поколение","t1_f_same":"одинаковый у обеих особей"}}}},{"id":"dnm-family","num":6,"section":0,"questions":[1],"title":"Сколько новых мутаций получает ребёнок","keywords":["Центромера","Мутация после оплодотворения"],"lead":["Если прочитать геном почти целиком, включая повторы, новых мутаций у ребёнка оказывается заметно больше прежних оценок."],"mechanism":["В семье из четырёх поколений (28 человек) геномы прочитали пятью разными методами, в том числе длинными прочтениями, и собрали почти целиком. У каждого ребёнка нашлось от 98 до 206 новых мутаций в сумме от обоих родителей; в среднем 74,5 однонуклеотидной замены (примерно по 37 от каждого родителя — как и следует из скорости мутаций, БИО-14·3), 7,4 вставки и делеции вне повторов, 65,3 изменения в тандемных повторах (включая структурные варианты, возникшие в повторах) и 4,4 изменения в [[T22|центромерах]]. Прежние оценки около 60–70 касались в основном однонуклеотидных замен вне трудных для прочтения участков. Около 16 % новых однонуклеотидных замен возникли [[T21|после оплодотворения]] — у зародыша, а не в половых клетках родителей."],"paragraphs":["Из мелких изменений зародышевой линии около 81 % возникло на отцовской копии; число новых мутаций росло примерно на 1,55 за каждый год возраста отца. Изменения после оплодотворения не унаследованы от родителей, отцовского преобладания у них нет, и они есть не во всех клетках человека.","<b>Как это узнали.<\/b> Прочитали геномы всех членов семьи и сравнивали каждого ребёнка с родителями, проверяя передачу изменений следующему поколению.","<b>Граница вывода.<\/b> Это одна семья; сумма средних по классам (около 152) — расчёт; работа не показывает, влияют ли эти изменения на признаки.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 1."],"conditions":"Схема по данным работы, упрощённая · числа измерены в одной семье; сумма — расчёт.","sources":["src_03"],"base":"БИО-14·2, БИО-14·3","level":"adv","next_base":"neutral-theory","quiz":{"id":"S14-L06","question":"Почему новая оценка числа мутаций выше прежней около 60–70?","options":[{"id":"S14-L06-1","text":"Люди этой семьи мутируют чаще других","correct":false,"feedback":"Работа не сравнивает семьи; разница — в том, что считали"},{"id":"S14-L06-2","text":"Ошибки прочтения завысили счёт новых мутаций","correct":false,"feedback":"Изменения проверяли разными методами и передачей следующему поколению"},{"id":"S14-L06-3","text":"Посчитаны изменения в повторах и трудных участках","correct":true,"feedback":"Их удалось прочитать длинными прочтениями"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько новых мутаций получает ребёнок, если считать всё?","status":"Схема по данным работы, упрощённая · числа на одного ребёнка от обоих родителей, измерены в одной семье","modes_label":"Что считаем","modes":["замены","+ вставки и делеции","+ повторы","+ центромеры"],"args":[{"level":1},{"level":2},{"level":3},{"level":4}],"notes":["74,5","81,9","147,2","151,6 — сумма средних, расчёт"],"static":["Накопительный столбик новых мутаций на одного ребёнка: 74,5 → 81,9 → 147,2 → 151,6; у детей 98–206"],"scene":"s14_a1","L":{"a1_head":"Что считаем: новые мутации на одного ребёнка (от обоих родителей), средние","a1_y":"новых мутаций на ребёнка","a1_s1":"однонуклеотидные замены","a1_lab1":"у разных детей этой семьи — от 98 до 206","a1_lab2":"прежние оценки по коротким прочтениям — около 60–70: в основном однонуклеотидные замены вне трудных участков","a1_b_head":"Откуда","a1_b_post":"16 % новых однонуклеотидных замен — после оплодотворения (у зародыша)","a1_b_germ":"остальные — в клетках зародышевой линии родителей","a1_b_pat":"мелкие изменения зародышевой линии: от кого из родителей","a1_b_father":"от отца","a1_b_mother":"от матери","a1_s2":"вставки и делеции вне повторов","a1_s3":"изменения в тандемных повторах","a1_s4":"изменения в центромерах","a1_lab3":"сумма средних — расчёт по числам работы"}}},"adv_kind":"Новые данные"},{"id":"one-substitution","num":7,"section":0,"questions":[1],"title":"Сколько вариантов возникает на одно замещение","keywords":[],"lead":["За каждым различием между видами стоят тысячи вариантов, которые возникли и исчезли."],"mechanism":["Новая нейтральная копия закрепляется с вероятностью 1/(2N). Значит, в среднем на одно нейтральное замещение приходится 2N возникших копий: при 10 000 особях — 20 000, при миллионе — 2 миллиона. Если на сайт за поколение возникает μ нейтральных мутаций, то на одном сайте одно замещение происходит в среднем раз в 1/μ поколений: при μ = 10⁻⁸ — раз в 100 млн поколений. Для гена из 1000 сайтов — раз в 100 тыс. поколений."],"paragraphs":["Модель показывает, почему мутационное событие и замещение — события разного масштаба: событий много, замещений мало. Вредные варианты добавляют событий, но почти не добавляют замещений; полезные закрепляются чаще нейтральных, но и их большинство исчезает (вкладка 1: при 1000 особях полезный на 1 % вариант закрепляется примерно в 1 % случаев).","<b>Граница вывода.<\/b> Это вывод учебной модели с условной численностью и μ; в реальных популяциях численность меняется, а отбор действует и на соседние участки.","<b>На практикуме.<\/b> Вкладка 1 (повторы), вкладка 2 (нейтральная теория)."],"conditions":"Расчёт по модели · условные N и μ.","sources":["src_01","src_02"],"base":"БИО-14·1, БИО-14·3","level":"adv","next_base":"neutral-theory","quiz":{"id":"S14-L07","question":"Сколько новых нейтральных копий в среднем приходится на одно замещение в популяции из 5000 особей?","options":[{"id":"S14-L07-1","text":"10 000","correct":true,"feedback":"2N = 10 000"},{"id":"S14-L07-2","text":"5 000","correct":false,"feedback":"Копий локуса в популяции 2N, а не N"},{"id":"S14-L07-3","text":"Одну","correct":false,"feedback":"Одна из 10 000 копий закрепляется; остальные исчезают"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько вариантов возникает на одно замещение?","status":"Расчёт по модели · условные численность и скорость мутаций","modes_label":"Популяция","modes":["N = 10 000","N = 1 000 000","один сайт"],"args":[{"N":10000.0},{"N":1000000.0},{"site":true}],"notes":["На одно замещение — 20 000 возникших копий","На одно замещение — 2 000 000 возникших копий","На одном сайте при μ = 10⁻⁸ — одно замещение в 100 млн поколений"],"static":["Тысячи значков возникших копий, один закрепившийся; число растёт с N"],"scene":"s14_r_onesub","L":{"r_onesub_arose":"возникло копий: {n} (2N)","r_onesub_one":"закрепилась одна","r_onesub_each10k":"каждый кружок — 10 000 возникших копий","r_onesub_site":"Один сайт: μ = 10⁻⁸ нейтральных мутаций за поколение","r_onesub_gax":"млн поколений","r_onesub_gens":"одно замещение в 100 млн поколений","r_onesub_avg":"в среднем: замещения на сайте случайны во времени"}}},"adv_kind":"Исследование модели"},{"id":"neutral-theory","num":8,"section":1,"questions":[2],"title":"Нейтральная теория: скорость замещений равна скорости мутаций","keywords":["Нейтральная теория молекулярной эволюции","Нейтральный вариант","Генетический дрейф","Очищающий отбор","Положительный отбор","Псевдоген"],"lead":["Если большинство закрепившихся молекулярных различий нейтрально, скорость их накопления не зависит от численности популяции."],"mechanism":["[[T23|Нейтральная теория молекулярной эволюции]] утверждает, что большинство замещений в последовательностях — закрепление [[T24|нейтральных вариантов]] [[T25|генетическим дрейфом]], а не положительным отбором. Расчёт: в популяции из N диплоидных особей за поколение на сайт возникает 2N·μ новых нейтральных копий (μ — скорость нейтральных мутаций на сайт за поколение); каждая закрепляется с вероятностью 1/(2N); их произведение — μ. Скорость нейтральных замещений равна скорости нейтральных мутаций и не зависит от N: в большой популяции копий возникает больше, но каждая закрепляется реже."],"paragraphs":["Теория не утверждает, что отбора нет. Вредные изменения возникают постоянно, и их удаляет [[T28|очищающий отбор]]; они почти не дают замещений. Полезные изменения [[T29|положительный отбор]] доводит до закрепления быстрее дрейфа; спор нейтралистов и селекционистов — о том, насколько они часты. Нейтральная теория служит нулевой моделью: если различия отклоняются от её предсказаний, это повод искать отбор. Одну из самых высоких скоростей накопления различий среди участков ядерного генома показывают [[T38|псевдогены]] — утратившие функцию копии генов: изменения в них почти все нейтральны.","<b>На практикуме.<\/b> Вкладка 2, режим «Нейтральная теория», шаг 2.1.","<b>Ограничения.<\/b> Численность меняет не скорость нейтральных замещений, а то, сколько вариантов одновременно есть в популяции и сколько поколений требуется до закрепления."],"conditions":"Расчёт по модели · ген из 1000 сайтов и μ = 10⁻⁸ условны.","sources":["src_01","src_02"],"base":"БИО-14·3, БИО-14·7; вспомнить [[seminar-13-route.html#drift|семинар 13: «Генетический дрейф: случайная выборка копий»]]","quiz":{"id":"S14-L08","question":"В популяции в 10 раз больше особей. Как изменится скорость нейтральных замещений?","options":[{"id":"S14-L08-1","text":"Вырастет в 10 раз","correct":false,"feedback":"Каждая копия закрепляется в 10 раз реже"},{"id":"S14-L08-2","text":"Не изменится","correct":true,"feedback":"Новых копий в 10 раз больше, шанс каждой в 10 раз меньше"},{"id":"S14-L08-3","text":"Уменьшится в 10 раз","correct":false,"feedback":"Новых копий возникает в 10 раз больше"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему скорость нейтральных замещений не зависит от N?","status":"Расчёт по модели · ген из 1000 сайтов и скорость мутаций 10⁻⁸ условны","modes_label":"Численность","modes":["N = 10⁴","N = 10⁵","N = 10⁶"],"args":[{"mode":"neutral","N":10000.0},{"mode":"neutral","N":100000.0},{"mode":"neutral","N":1000000.0}],"notes":["0,2 × 5·10⁻⁵ = 10⁻⁵","2 × 5·10⁻⁶ = 10⁻⁵","20 × 5·10⁻⁷ = 10⁻⁵"],"static":["Столбик новых копий растёт, столбик вероятности падает, произведение постоянно — 10⁻⁵"],"scene":"s14_t2","L":{"t2_n_head":"Популяция за одно поколение: условный ген из L = 1000 сайтов; на ген — 2N·μ·L и μ·L","t2_n_new":"новых нейтральных копий в гене за поколение","t2_n_pfix":"вероятность закрепления каждой","t2_n_sub":"замещений в гене за поколение","log_scale":"логарифмическая шкала","t2_n_cols12":"первые два столбика","t2_n_cond":"Условия: L = 1000 сайтов (условно); 10⁻⁸ нейтральных мутаций на сайт за поколение (условно).","t2_n_gens":"При любой численности — одно замещение в гене за 100 000 поколений"}}},"exam_quiz":{"id":"S14-E03","question":"От чего, по нейтральной теории, зависит скорость нейтральных замещений?","options":[{"id":"S14-E03-1","text":"От численности популяции","correct":false,"feedback":"Численность не входит в итог"},{"id":"S14-E03-2","text":"От силы положительного отбора в популяции","correct":false,"feedback":"Нейтральные варианты отбору не подвержены"},{"id":"S14-E03-3","text":"От скорости нейтральных мутаций","correct":true,"feedback":"Она с ней совпадает"}]}},{"id":"nearly-neutral","num":9,"section":1,"questions":[2],"title":"Почти нейтральная теория: значение численности","keywords":["Почти нейтральная теория","Эффективная численность (Ne)"],"lead":["Слабовредный вариант в малой популяции ведёт себя почти как нейтральный, в большой — удаляется отбором."],"mechanism":["[[T26|Почти нейтральная теория]] рассматривает варианты со слабым эффектом. Если |s| не больше 1/(2Ne) (см. [[seminar-13-route.html#fixation|семинар 13: «Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»]]), где Ne — [[T27|эффективная численность]], частоту варианта определяет главным образом дрейф, и шанс его закрепления почти такой же, как у нейтрального. В модели вариант с s = −0,001: при 100 особях порог 1/(2N) = 0,005 выше |s|, и шанс закрепления — 0,90 от нейтрального; при 10 000 особях порог 0,00005 ниже |s|, и шанс — около 4·10⁻⁸ от нейтрального."],"paragraphs":["Поэтому один и тот же вариант может быть почти нейтральным в одном виде и вредным в другом. У видов с длинным поколением численность обычно меньше, чем у видов с коротким; у них большая доля слабовредных изменений ведёт себя как нейтральные. Это одно из объяснений, почему у некоторых белков различия накапливаются пропорционально годам, а не поколениям. Граница «почти нейтрального» условна: шанс закрепления меняется с величиной 2Ne·s плавно.","<b>На практикуме.<\/b> Вкладка 2, панель «Почти нейтральный вариант», шаг 2.2; вкладка 1, шаг 1.4.","<b>Ограничения.<\/b> В модели Ne равна N и постоянна; в природе численность меняется, и s зависит от среды."],"conditions":"Расчёт по модели · s и N условны.","sources":["src_01"],"base":"БИО-14·5, БИО-14·8; вспомнить [[seminar-13-route.html#census-effective|семинар 13: «Фактическая и эффективная численность»]]","quiz":{"id":"S14-L09","question":"При каком условии вариант с s = −0,0001 ведёт себя почти как нейтральный?","options":[{"id":"S14-L09-1","text":"При любой численности: эффект слишком мал для отбора","correct":false,"feedback":"При Ne в миллион 2Ne·s = −200, и отбор эффективен"},{"id":"S14-L09-2","text":"Только если популяция бесконечна","correct":false,"feedback":"В бесконечной популяции дрейфа нет, и даже слабый отбор удаляет вариант"},{"id":"S14-L09-3","text":"Если эффективная численность не больше 5000","correct":true,"feedback":"Тогда 1/(2Ne) не меньше 0,0001"}]},"widget":{"kind":"dna","title":"","s":{"title":"Когда слабовредный вариант ведёт себя как нейтральный?","status":"Расчёт по модели · коэффициент отбора −0,001 условен","modes_label":"Численность","modes":["N = 100","N = 10 000","кривая"],"args":[{"N":100},{"N":10000},{"curve":true}],"notes":["2Ns = −0,2; шанс 0,90 от нейтрального","2Ns = −20; шанс 4·10⁻⁸ от нейтрального","Кривая шанса от 2Ns; полоса |2Ns| ≤ 1 — почти нейтральные"],"static":["Кривая кратности шанса от 2Ns с полосой почти нейтральных; точки для N = 100 и 10 000"],"scene":"s14_r_nearly","L":{"r_nearly_head":"Шанс закрепления, кратный нейтральному, при разных 2Ns","r_nearly_band":"почти нейтральный: |2Ns| ≤ 1, то есть |s| ≤ 1/(2N) — порог","r_nearly_x":"2Ns","r_nearly_y":"шанс закрепления, кратный нейтральному","log_scale":"логарифмическая шкала","r_nearly_rm":"← отбор удаляет"}}}},{"id":"syn-nonsyn","num":10,"section":1,"questions":[2],"title":"Синонимичные и несинонимичные замены и сайты","keywords":["Синонимичная замена","Кодон","Несинонимичная замена","Синонимичный сайт","Несинонимичный сайт"],"lead":["Вырожденность генетического кода позволяет сравнивать в одном гене изменения, которые меняют аминокислоту, и изменения, которые её не меняют."],"mechanism":["[[T30|Синонимичная замена]] меняет [[T71|кодон]], но не аминокислоту; [[T31|несинонимичная замена]] меняет аминокислоту. Возможностей для них в гене не поровну: из трёх возможных замен в третьей позиции кодона часто все или большинство синонимичны, в первой и второй — почти все несинонимичны. Поэтому каждую позицию кодона делят на доли: [[T32|синонимичный сайт]] — доля возможных замен, не меняющих аминокислоту, [[T33|несинонимичный сайт]] — остальная доля. В модели практикума замены, ведущие к стоп-кодону, при подсчёте не учитываются. В гене обычно около четверти сайтов синонимичны и около трёх четвертей — несинонимичны."],"paragraphs":["В условной последовательности практикума из 12 кодонов (36 нуклеотидов) синонимичных сайтов 8,33, несинонимичных — 27,67. Различия двух последовательностей относят к синонимичным или несинонимичным, сверяясь с генетическим кодом для каждого кодона: важно, меняется ли аминокислота, а не номер позиции.","<b>На практикуме.<\/b> Вкладка 2, режим «dN/dS», шаг 2.3.","<b>Ограничения.<\/b> Если в одном кодоне различаются две или три позиции, отнести различие к одному классу можно только с допущениями о порядке замен; в модели таких кодонов нет."],"conditions":"Расчёт по генетическому коду · последовательность условна.","sources":["src_01"],"base":"вспомнить [[seminar-10-route.html#genetic-code|семинар 10: «Генетический код: кодон, стоп-кодоны и вырожденность»]] и [[seminar-10-route.html#sequence-changes|семинар 10: «Изменения последовательности: синонимичные, миссенс- и нонсенс-замены, вставки и делеции»]]","quiz":{"id":"S14-L10","question":"Почему синонимичных сайтов в гене меньше, чем несинонимичных?","options":[{"id":"S14-L10-1","text":"Большинство возможных замен меняет аминокислоту","correct":true,"feedback":"Синонимичны в основном замены в третьей позиции"},{"id":"S14-L10-2","text":"Синонимичных кодонов в коде слишком мало","correct":false,"feedback":"Синонимичных кодонов много; мало возможных замен, сохраняющих аминокислоту"},{"id":"S14-L10-3","text":"Отбор удаляет синонимичные сайты из генов","correct":false,"feedback":"Сайты — возможности замен, они не удаляются отбором"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько синонимичных и несинонимичных сайтов в кодоне?","status":"Расчёт по генетическому коду · последовательность условна","modes_label":"Кодон","modes":["GCT (Ala)","AAA (Lys)","12 кодонов"],"args":[{"codon":"GCT"},{"codon":"AAA"},{"seq":true}],"notes":["GCT: третья позиция синонимична целиком — 1 синонимичный сайт","AAA: в третьей позиции одна из трёх замен синонимична — ⅓ сайта","12 кодонов: 8,33 синонимичных и 27,67 несинонимичных сайта"],"static":["Для каждой позиции кодона — три возможные замены, отмеченные как синонимичные, несинонимичные или к стоп-кодону"],"scene":"s14_r_sites","L":{"r_sites_codon":"Кодон {c} ({aa})","r_sites_pos":"позиция {p}","r_sites_s":"синонимичных сайтов: {v}","r_sites_syn":"синонимичная","r_sites_non":"несинонимичная","r_sites_stop":"к стоп-кодону — не учитывается","r_sites_seq":"12 кодонов вида X: синонимичных / несинонимичных сайтов в каждом","t2_d_x":"вид X","r_sites_tot":"синонимичных сайтов {s}, несинонимичных {n}","r_sites_each":"в каждой позиции кодона — три возможные замены"}},"zoomNarrow":true}},{"id":"dnds-read","num":11,"section":1,"questions":[2],"title":"Показатель dN/dS: как читать","keywords":["dN","dS","dN/dS (ω)"],"lead":["Отношение несинонимичных различий на сайт к синонимичным различиям на сайт показывает, как закреплялись два класса изменений в одном гене."],"mechanism":["[[T34|dN]] — число несинонимичных различий, делённое на число несинонимичных сайтов; [[T35|dS]] — число синонимичных различий, делённое на число синонимичных сайтов. Их отношение [[T36|dN/dS]] (обозначают и ω) читают так: меньше 1 — изменения аминокислот закреплялись реже синонимичных, что ожидается при очищающем отборе; около 1 — совместимо с тем, что изменения аминокислот закреплялись так же, как нейтральные; больше 1 — изменения аминокислот закреплялись чаще синонимичных, что совместимо с положительным отбором. В модели практикума: 3 синонимичных и 1 несинонимичное различие на 8,33 и 27,67 сайта дают dS = 0,36, dN = 0,036, dN/dS = 0,10."],"paragraphs":["Синонимичные различия служат мерой нейтральных изменений в том же гене: у них та же скорость мутаций и та же история популяции. Если синонимичных различий нет, отношение не определено. У большинства изученных генов dN/dS заметно меньше 1: большинство изменений аминокислот вредно. Значения больше 1 находят чаще всего в генах, участвующих в «гонке вооружений» хозяина и возбудителя, в генах размножения и в недавно дуплицированных генах.","<b>На практикуме.<\/b> Вкладка 2, шаги 2.4–2.6.","<b>Ограничения.<\/b> Подсчёт практикума не учитывает повторных замен в одном сайте: при больших различиях они занижают dS."],"conditions":"Расчёт по модели · последовательности и числа сайтов условные.","sources":["src_01"],"base":"БИО-14·8, БИО-14·10","quiz":{"id":"S14-L11","question":"dN = 0,03, dS = 0,06. Что можно сказать?","options":[{"id":"S14-L11-1","text":"2: изменения аминокислот закреплялись чаще","correct":false,"feedback":"Делят dN на dS, а не наоборот"},{"id":"S14-L11-2","text":"0,5: изменения аминокислот закреплялись вдвое реже","correct":true,"feedback":"Это совместимо с очищающим отбором"},{"id":"S14-L11-3","text":"Ген нейтрален: оба числа слишком малы","correct":false,"feedback":"Важно отношение, а не величина каждого"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как читать dN/dS?","status":"Расчёт по модели · последовательности условны","modes_label":"Режим","modes":["меньше 1","около 1","больше 1","не определён"],"args":[{"mode":"dnds","y":"lt1"},{"mode":"dnds","y":"eq1"},{"mode":"dnds","y":"gt1"},{"mode":"dnds","y":"nan"}],"notes":["dS 0,36; dN 0,036; dN/dS 0,10","dS 0,26; dN 0,25; dN/dS 0,97","dS 0,13; dN 0,28; dN/dS 2,16","dS = 0: показатель не определён"],"static":["Два ряда по 12 кодонов; оливковые кружки и пурпурные ромбы различий; dN/dS для четырёх вариантов вида Y"],"scene":"s14_t2","L":{"t2_y_lt1":"меньше 1","t2_d_head":"Счётчик замен: 12 кодонов вида X и вида Y · {m}","t2_d_x":"вид X","t2_d_y":"вид Y","t2_d_syn_t":"синонимичное различие в кодоне {i}","t2_d_non_t":"несинонимичное различие в кодоне {i}","t2_d_nsyn":"синонимичных различий: {n}","t2_d_nnon":"несинонимичных различий: {n}","t2_d_ssites":"синонимичных сайтов","t2_d_nsites":"несинонимичных сайтов","t2_d_ds":"dS = синонимичных различий / синонимичных сайтов","t2_d_dn":"dN = несинонимичных различий / несинонимичных сайтов","t2_d_w_lt1":"меньше 1","t2_d_w":"dN/dS","t2_g_head":"Чего не показывает","t2_g_lt1":"Среднее по гену меньше 1 не исключает положительного отбора в отдельных кодонах.","t2_g_all":"Показатель опирается на допущение, что синонимичные замены нейтральны.","t2_y_eq1":"около 1","t2_d_w_eq1":"около 1","t2_g_eq1":"Значение около 1 совместимо и с ослаблением отбора, и со смесью очищающего и положительного отбора в разных кодонах.","t2_y_gt1":"больше 1","t2_d_w_gt1":"больше 1","t2_g_gt1":"Одно синонимичное различие: оценка неустойчива; нужны длинные последовательности и отдельные модели для кодонов и ветвей.","t2_y_nan":"нет синонимичных различий","t2_d_nan":"показатель не определён","t2_g_nan":""}},"zoomNarrow":true},"exam_quiz":{"id":"S14-E05","question":"Что такое очищающий отбор?","options":[{"id":"S14-E05-1","text":"Распространение полезных вариантов","correct":false,"feedback":"Это положительный отбор"},{"id":"S14-E05-2","text":"Удаление вредных вариантов","correct":true,"feedback":"Он замедляет замещения в важных участках"},{"id":"S14-E05-3","text":"Удаление повторов из генома","correct":false,"feedback":"Отбор действует на варианты, а не на повторы как класс"}]}},{"id":"dnds-limits","num":12,"section":1,"questions":[2],"title":"Чего dN/dS не показывает","keywords":["Неравное использование синонимичных кодонов","Насыщение","Ортологи"],"lead":["Отношение — среднее по гену и по всему времени расхождения; одно число может скрывать разные истории."],"mechanism":["Ограничения показателя: (1) усреднение: значение меньше 1 по гену не исключает положительного отбора в немногих кодонах или на одной ветви дерева, а значение около 1 может складываться из кодонов под очищающим и под положительным отбором; (2) допущение о нейтральности синонимичных замен: часть их влияет на сплайсинг, устойчивость РНК и скорость трансляции, а в высокоэкспрессируемых генах проявляется [[T39|неравное использование синонимичных кодонов]] — признак отбора на синонимичных позициях; (3) [[T37|насыщение]]: при сильном расхождении одна позиция меняется повторно, видна лишь итоговая разница, и dS занижается; (4) при очень близких последовательностях различий слишком мало, и оценка неустойчива; (5) сравнивать нужно [[T40|ортологи]], а не паралоги — копии, разошедшиеся при дупликации: их различия накоплены с момента дупликации, возможно в период ослабленного отбора, и описывают другую историю."],"paragraphs":["Поэтому для поиска отбора используют модели, оценивающие показатель отдельно для кодонов и ветвей, и сравнивают различия между видами с полиморфизмом внутри вида. Значение около 1 само по себе не говорит, что ген не испытывает отбора: такое же среднее даёт ген, утрачивающий функцию, и ген со смесью давлений.","<b>На практикуме.<\/b> Вкладка 2, панель «Чего не показывает», шаги 2.5–2.6, «Найти причину» II.","<b>Ограничения.<\/b> Показатель описывает закрепившиеся изменения; он не измеряет, насколько вреден или полезен отдельный вариант."],"conditions":"Схема качественная · значения кодонов условны.","sources":["src_01","src_06"],"base":"БИО-14·11","quiz":{"id":"S14-L12","question":"dN/dS гена равно 0,3. Можно ли исключить положительный отбор?","options":[{"id":"S14-L12-1","text":"Да: среднее значение меньше 1","correct":false,"feedback":"Меньше 1 — среднее; отдельные кодоны могут иметь больше 1"},{"id":"S14-L12-2","text":"Да, если сравниваемые последовательности очень длинные","correct":false,"feedback":"Длина уточняет среднее, но не показывает распределения по кодонам"},{"id":"S14-L12-3","text":"Нет: он мог действовать на немногие кодоны","correct":true,"feedback":"Нельзя: среднее по гену это скрывает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чего dN/dS не показывает?","status":"Схема качественная · значения условны","modes_label":"Ограничение","modes":["усреднение","синонимичные не нейтральны","насыщение","паралоги"],"args":[{"lim":"avg"},{"lim":"syn"},{"lim":"sat"},{"lim":"para"}],"notes":["Среднее меньше 1 при немногих кодонах больше 1","Если синонимичные замены не нейтральны, dS искажён","Две замены в одной позиции видны как одна или ни одной","Паралоги расходились с момента дупликации: их отношение описывает другую историю"],"static":["Четыре ограничения dN/dS в четырёх панелях"],"scene":"s14_r_limits","L":{"r_lim_t_avg":"Усреднение","r_lim_mean":"среднее {v}","r_lim_codons":"кодоны гена: ω по кодонам (условно)","r_lim_t_syn":"Синонимичные не нейтральны","r_lim_synsel":"Синонимичная позиция под отбором: dS занижен — отношение искажено","r_lim_t_sat":"Насыщение","r_lim_anc":"предок","r_lim_mid":"промежуточно","r_lim_now":"сейчас","r_lim_rep":"повторная замена: C → G","r_lim_vis":"видимое различие: нет","r_lim_satx":"Две замены в одной позиции видны как одна или ни одной","r_lim_t_para":"Паралоги","t4_t_dup":"дупликация","r_lim_gene":"ген {g}, вид {sp}","r_lim_ortho":"ортологи","r_lim_para":"паралоги","r_tree_len":"длина ветви условна"}}},"exam_quiz":{"id":"S14-E06","question":"Что такое насыщение при сравнении последовательностей?","options":[{"id":"S14-E06-1","text":"Полное совпадение последовательностей","correct":false,"feedback":"Наоборот, насыщение бывает при сильном расхождении"},{"id":"S14-E06-2","text":"Слишком большое число кодонов в сравниваемом гене","correct":false,"feedback":"Длина гена здесь ни при чём"},{"id":"S14-E06-3","text":"Невидимые повторные замены в одной позиции","correct":true,"feedback":"Различия растут медленнее времени"}]}},{"id":"synonymous-debate","num":13,"section":1,"questions":[2],"title":"Вредны ли синонимичные мутации","keywords":[],"lead":["Измерение у дрожжей поставило под сомнение нейтральность синонимичных мутаций; результат оспорен, спор не закрыт."],"mechanism":["Утверждение: в 21 ген дрожжей вносили по одной однонуклеотидной замене и измеряли приспособленность мутантов в общей смеси с исходным штаммом. Из 1866 синонимичных мутантов 75,9 % оказались значимо вредными — почти та же доля, что у несинонимичных (75,8 %). Возражение: для каждого гена не было исходного штамма, полученного тем же путём; повторы были техническими, а не независимыми; побочные мутации при получении штаммов могли сделать нейтральные замены «вредными». Ответ авторов утверждения: прочитаны 603 генома — ошибочных разрезов при редактировании нет, но у 26,7 % из 580 прочитанных мутантов есть побочные мутации; в повторе по 11 генам с независимыми смесями и своим исходным штаммом для каждого гена значимо не нейтральны 86,5 % синонимичных мутаций; вместе с прежними данными по шести генам, где влияние побочных мутаций пренебрежимо мало, — 76,9 % из 1621. Спор о дрожжах не закрыт."],"paragraphs":["У человека картина другая: в большой выборке участников британского биобанка редкие синонимичные варианты оказались связаны хотя бы с одним из 4911 признаков только в 2 генах из 18 762, миссенс-варианты — в 27, а варианты, обрывающие белок, — в 55. Синонимичные варианты у человека в целом встречаются чаще несинонимичных, что ожидается, если отбор против них слабее. Известны и отдельные синонимичные варианты, вызывающие заболевания, — чаще всего через нарушение сплайсинга.","<b>Как это узнали.<\/b> Приспособленность мутантов дрожжей считали по изменению их долей в смеси за двое суток; у людей сравнивали, как часто редкие варианты гена встречаются у людей с признаком и без него.","<b>Граница вывода.<\/b> Измерения у дрожжей сделаны в лабораторных условиях для 21 гена; перенос на другие организмы и на природу не следует. Если синонимичные замены не нейтральны, dS перестаёт быть мерой нейтральных изменений.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 2."],"conditions":"Схема трёх опубликованных позиций и одного наблюдения у человека · ни одна позиция не выделена.","sources":["src_04","src_05","src_06","src_07"],"base":"БИО-14·10, БИО-14·12","level":"adv","next_base":"accumulation","quiz":{"id":"S14-L13","question":"Почему спор о дрожжах важен для показателя dN/dS?","options":[{"id":"S14-L13-1","text":"dS принимают за меру
