ых строк много, пропусков много, и программы выравнивания расставляют их по-разному", "t1_how": "Деление гомологичных генов на ортологи и паралоги предложено во второй половине XX века, когда стали сравнивать последовательности генов разных видов. Что выравнивание — гипотеза, показали, сравнив выравнивания одних и тех же последовательностей разными программами: деревья по ним получались разными", "t1_s1_title": "Гомология — да или нет", "t1_s1_cond": "Ген Т у вида 1 и вида 2 выровнен; в 82 из 100 столбцов буквы совпадают", "t1_s1_q": "Как правильно описать эти гены?", "t1_s1_o1": "Сходны на 82 %; гомологичны ли — вывод о происхождении", "t1_s1_x1": "Да: сходство измеряют, а гомология — утверждение, что гены произошли от одного предкового гена", "t1_s1_o2": "Гомологичны на 82 %", "t1_s1_x2": "Гомология не бывает частичной: общее происхождение либо есть, либо нет. Процент — это сходство", "t1_s1_o3": "Гомологичны, потому что сходство больше половины", "t1_s1_x3": "Порога сходства для гомологии нет: сходство бывает и без общего происхождения, а родственные гены после долгого расхождения могут стать мало сходны", "t1_s1_h1": "Что из этого измерено, а что выведено?", "t1_s1_h2": "Может ли происхождение быть общим на 82 %?", "t1_s1_h3": "Гомология — общее происхождение; процент — сходство", "t1_s1_e": "Гомология — общее происхождение признака или последовательности от предкового состояния. Сходство — измеряемая доля совпадений; оно зависит от времени расхождения, скорости замен и выравнивания. Сходство без общего происхождения — аналогия", "t1_s2_title": "Ортологи и паралоги: какое событие в общем узле", "t1_s2_cond": "Дерево гена: у вида 1 одна копия гена (Г1), у вида 2 — две (Г2а и Г2б). Круг на узле — разделение видов, квадрат — дупликация", "t1_s2_q": "Как связаны Г2а и Г2б?", "t1_s2_o1": "Паралоги: их общий узел — дупликация", "t1_s2_x1": "Да: две копии возникли при удвоении гена в линии вида 2", "t1_s2_o2": "Ортологи: оба гена из одного вида", "t1_s2_x2": "Ортологи разошлись при разделении видов. Здесь общий узел — квадрат, то есть дупликация", "t1_s2_o3": "Аналоги: они не похожи на Г1", "t1_s2_x3": "Аналогия — сходство без общего происхождения. Г2а и Г2б происходят от одного гена", "t1_s2_h1": "Найдите узел, где сходятся линии Г2а и Г2б", "t1_s2_h2": "Какой значок стоит на этом узле?", "t1_s2_h3": "Квадрат — дупликация, круг — разделение видов", "t1_s2_e": "Ортологи и паралоги различаются не степенью сходства и не тем, в каких видах лежат гены, а событием в их общем узле: разделение видов — ортологи, дупликация — паралоги. Г1 ортологичен обеим копиям вида 2", "t1_s3_title": "Конструктор: дупликация до разделения видов", "t1_s3_cond": "Ген удвоился у общего предка видов 1 и 2, а потом виды разделились. У каждого вида есть копии α и β", "t1_s3_q": "α1 у вида 1 и β2 у вида 2 — какие это гены?", "t1_s3_o1": "Паралоги, хотя лежат в разных видах", "t1_s3_x1": "Да: их общий узел — дупликация у общего предка", "t1_s3_o2": "Ортологи: гены разных видов", "t1_s3_x2": "Гены разных видов могут быть паралогами: важен не вид, а событие в общем узле. Здесь это дупликация", "t1_s3_o3": "Ни те ни другие: гомологии нет", "t1_s3_x3": "Обе копии происходят от одного предкового гена, значит, гомологичны", "t1_s3_h1": "Проследите линии α1 и β2 к корню", "t1_s3_h2": "Что произошло в узле, где они встретились?", "t1_s3_h3": "Общий узел — квадрат", "t1_s3_e": "В этом семействе две пары ортологов (α1–α2, β1–β2) и четыре пары паралогов. Если сравнивать α1 с β2, различия между ними накопились со времени дупликации, а не со времени разделения видов: для дерева видов берут ортологи", "t1_s4_title": "Сколько различий между последовательностями", "t1_s4_cond": "Последовательность вида 1 — ATGGCTACCTGA (12 букв), вида 2 — ATGGCACCTGA (11 букв). Чтобы поставить их одна под другой, в последовательности вида 2 нужен пропуск", "t1_s4_q": "Сколько различий между последовательностями?", "t1_s4_o1": "Зависит от того, где поставить пропуск", "t1_s4_x1": "Да: при пропуске после 5-й буквы — 0 несовпадений, в конце — 5. Одно выравнивание не следует из другого", "t1_s4_o2": "Одно: вторая последовательность короче на букву", "t1_s4_x2": "Разница в длине говорит о вставке или делеции, но число несовпадающих столбцов зависит от выравнивания", "t1_s4_o3": "Пять: так показывает выравнивание с пропуском в конце", "t1_s4_x3": "Это одно из возможных выравниваний. Пропуск после 5-й буквы даёт 0 несовпадений", "t1_s4_h1": "Передвиньте пропуск", "t1_s4_h2": "Сравните число несовпадений в трёх положениях", "t1_s4_h3": "Выравнивание — гипотеза о том, какие позиции соответствуют друг другу", "t1_s4_e": "Выравнивание — гипотеза о позиционной гомологии: каждый столбец предполагает, что буквы произошли от одной позиции предка. Сходство и число различий считают по уже принятому выравниванию", "t1_s5_title": "Изменение условий задачи: какое выравнивание принять", "t1_s5_cond": "Те же последовательности. Сравниваем три расстановки пропуска", "t1_s5_q": "Какое выравнивание объясняет данные меньшим числом событий?", "t1_s5_o1": "Пропуск после 5-й буквы: одно событие — вставка или делеция", "t1_s5_x1": "Да: остальные требуют, кроме этого события, ещё 4–5 замен", "t1_s5_o2": "Пропуск в конце: последовательности не разрываются внутри", "t1_s5_x2": "Пропуск внутри не нарушает правил; при пропуске в конце нужны ещё 5 замен", "t1_s5_o3": "Любое: на дерево выравнивание не влияет", "t1_s5_x3": "Разные выравнивания одних и тех же последовательностей могут дать разные деревья", "t1_s5_h1": "Сколько замен нужно, чтобы получить каждую расстановку?", "t1_s5_h2": "Пропуск — одно событие, каждое несовпадение — ещё одна замена", "t1_s5_h3": "Сравните: 1 + 0, 1 + 4, 1 + 5", "t1_s5_e": "Программы выравнивания ищут расстановку, которая требует меньше всего изменений по заданным правилам. При сильно различающихся последовательностях несколько выравниваний бывают почти равноценны; тогда сомнительные участки исключают или проверяют вывод на разных выравниваниях", "t1_s6_title": "Вставка или делеция", "t1_s6_cond": "В выравнивании последовательность вида 2 короче на одну букву: в столбце 6 у неё пропуск", "t1_s6_q": "Что произошло: вставка в линии вида 1 или делеция в линии вида 2?", "t1_s6_o1": "По двум последовательностям не определить", "t1_s6_x1": "Да: нужна последовательность вида вне этой пары — внешней группы", "t1_s6_o2": "Делеция у вида 2: его последовательность короче", "t1_s6_x2": "Короче — состояние сейчас. Если у предка буквы не было, это вставка у вида 1", "t1_s6_o3": "Вставка у вида 1: длинная последовательность новее", "t1_s6_x3": "Длина не показывает направления изменения; его определяет сравнение с предковым состоянием", "t1_s6_h1": "Что было у общего предка видов 1 и 2?", "t1_s6_h2": "Как узнать предковое состояние?", "t1_s6_h3": "Сравните с видом, отделившимся раньше", "t1_s6_e": "Пропуск обозначает вставку или делецию, не указывая, что из двух. Направление изменения определяют по внешней группе — линии, отделившейся раньше; это та же логика, что при постановке корня дерева (вкладка 2)", "t2_title": "Как читать дерево", "t2_rules": "Дерево — гипотеза о порядке расхождения линий. Кончики — современные виды; внутренние узлы — их реконструируемые общие предки; корень — самый древний узел. Родство определяет последний общий предок: чем он моложе, тем ближе родство. Поворот ветвей у узла не меняет дерева; перенос корня меняет гипотезу о родстве. Длина ветви означает то, что написано под деревом. Виды, признаки и длины ветвей условные", "t2_lim": "Модель не показывает, как дерево вычисляют по последовательностям, и не оценивает поддержку ветвей. В ней нет вымерших линий, гибридизации и переноса генов — дерево строго ветвится. Признаки в таблице сборки условные и не противоречат друг другу; в настоящих данных противоречия обычны", "t2_how": "Правило объединять виды по общим производным признакам, используя внешнюю группу, сформулировали в середине XX века. Тогда же поняли, что число возможных деревьев быстро растёт с числом видов, поэтому дерево ищут вычислительными методами. Ошибки чтения деревьев изучали, давая студентам задачи на сравнение рисунков", "t2_s1_title": "С кем М в более близком родстве", "t2_s1_cond": "Дерево пяти видов с внешней группой Р. На рисунке кончик М стоит рядом с кончиком Н", "t2_s1_q": "С кем М в более близком родстве — с К или с Н?", "t2_s1_o1": "С К: их общий предок моложе", "t2_s1_x1": "Да: К и М объединяет клада К+Л+М, а общий предок М и Н — предок всей группы", "t2_s1_o2": "С Н: кончики стоят рядом", "t2_s1_x2": "Соседство кончиков на рисунке не означает родства: порядок кончиков меняется поворотом ветвей", "t2_s1_o3": "Ни с кем: М — предок К и Л", "t2_s1_x3": "Кончики — современные виды; ни один не предок другого. Предок — узел дерева", "t2_s1_h1": "Найдите узел, где сходятся линии М и К", "t2_s1_h2": "Найдите узел, где сходятся линии М и Н", "t2_s1_h3": "Какой из двух узлов ближе к кончикам?", "t2_s1_e": "Родство читают по узлам: два вида ближе, если их последний общий предок жил позже. Положение кончиков на рисунке, их соседство и порядок слева направо родства не показывают", "t2_s2_title": "Поворот ветвей", "t2_s2_cond": "Ветви у узла клады К+Л+М повернули: теперь сверху вниз — М, К, Л, Н, П", "t2_s2_q": "Изменилась ли гипотеза о родстве?", "t2_s2_o1": "Нет: клады те же, изменился только рисунок", "t2_s2_x1": "Да: поворот у узла меняет порядок кончиков, но не порядок ветвлений", "t2_s2_o2": "Да: теперь М стоит рядом с К, а не с Н", "t2_s2_x2": "Соседство кончиков не меняет родства: М был ближе к К и до поворота", "t2_s2_o3": "Да: М теперь наверху, значит, он самый развитый", "t2_s2_x3": "Верх и низ рисунка ничего не означают. Дерево — не лестница от «низших» к «высшим»: все кончики — современные виды, прошедшие одинаковое время от общего предка", "t2_s2_h1": "Сравните списки клад до и после", "t2_s2_h2": "Какие кончики объединяет каждый узел?", "t2_s2_h3": "Поворот похож на вращение подвески вокруг нити", "t2_s2_e": "Одно и то же дерево можно нарисовать многими способами: у каждого внутреннего узла ветви можно поменять местами. Информацию несёт только порядок ветвлений — топология", "t2_s3_title": "Корень и внешняя группа", "t2_s3_cond": "Корень перенесли с ветви внешней группы Р на ветвь вида М. Разветвления между кончиками остались прежними", "t2_s3_q": "Что изменилось?", "t2_s3_o1": "Гипотеза о родстве: изменились клады и общие предки", "t2_s3_x1": "Да: появились клады Н+П+Р и К+Л+Н+П+Р, а клады К+Л+М и К+Л+М+Н+П исчезли", "t2_s3_o2": "Ничего: это тот же рисунок, повёрнутый иначе", "t2_s3_x2": "Поворот не меняет клад; перенос корня меняет, какой узел старше и какие группы происходят от одного предка", "t2_s3_o3": "Только длины ветвей, но не родство", "t2_s3_x3": "Длины тех же ветвей сохранились; изменились направление от предка к потомкам и клады", "t2_s3_h1": "Сравните списки клад", "t2_s3_h2": "Какой узел теперь самый древний?", "t2_s3_h3": "Некорневое дерево одно и то же, корневые — разные", "t2_s3_e": "Корень задаёт направление от предка к потомкам. Его ставят по внешней группе — линии вне изучаемой группы, связанной с ней более древним предком. Без внешней группы или иного допущения корень по самим разветвлениям не определяется", "t2_s4_title": "Что означает длина ветви", "t2_s4_cond": "Под деревом: «Длина ветви: замены на сайт». Ветвь вида П (0,06) длиннее ветви вида Н (0,04)", "t2_s4_q": "Что означает более длинная ветвь П?", "t2_s4_o1": "В линии П накопилось больше замен", "t2_s4_x1": "Да: длина ветви здесь — число замен на сайт вдоль ветви", "t2_s4_o2": "П — более древний вид, чем Н", "t2_s4_x2": "Н и П — современные виды с общим предком; древнее ни один из них", "t2_s4_o3": "П отделился от общего предка раньше Н", "t2_s4_x3": "Н и П отделились в одном узле — одновременно; длина ветви здесь — замены, а не время", "t2_s4_h1": "Прочитайте подпись под деревом", "t2_s4_h2": "Где на рисунке узел, от которого отходят Н и П?", "t2_s4_h3": "Переключите режим на «время»", "t2_s4_e": "Одна топология рисуется тремя способами: кладограмма (длины ничего не означают), филограмма (замены на сайт), хронограмма (время). Неравные длины на филограмме означают разную скорость замен в линиях, а не разный возраст видов", "t2_s5_title": "Соберите дерево по признакам", "t2_s5_cond": "Пять признаков у видов К, Л, М, Н и внешней группы. 0 — состояние как у внешней группы (предковое), 1 — другое (производное). п1: 1 у К, Л, М; п2: 1 у К, Л; п3: 1 только у Н; п4: 1 только у К; п5: 1 у всех четырёх", "t2_s5_q": "Какое дерево объясняет таблицу меньшим числом изменений?", "t2_s5_o1": "(((К, Л), М), Н)", "t2_s5_x1": "Да: К и Л объединяет п2, к ним добавляется М по п1. Всего 5 изменений", "t2_s5_o2": "((Л, М, Н), К): у трёх видов нет п4", "t2_s5_x2": "Отсутствие п4 — предковое состояние, как у внешней группы; общие предковые состояния родства не показывают", "t2_s5_o3": "К отдельно: только у него есть п4", "t2_s5_x3": "Признак одного вида родства с другими не показывает: он возник в линии К", "t2_s5_h1": "Какие признаки есть у двух или трёх видов, но не у всех?", "t2_s5_h2": "Объединяйте по общим производным состояниям", "t2_s5_h3": "п3, п4 и п5 для порядка ветвлений ничего не дают", "t2_s5_e": "Группы на дереве выделяют по общим производным состояниям; предковые состояния и признаки одного вида порядка ветвлений не показывают. Направление изменения признака задаёт внешняя группа — так же, как корень дерева", "t2_s6_title": "Поддержка ветви", "t2_s6_cond": "У узла клады К+Л+М стоит число 62. Подпись: «бутстрэп-поддержка, %»", "t2_s6_q": "Что означает 62?", "t2_s6_o1": "В 62 % повторных выборок клада получилась снова", "t2_s6_x1": "Да: это устойчивость клады к повторной выборке данных", "t2_s6_o2": "Клада верна с вероятностью 62 %", "t2_s6_x2": "Бутстрэп не оценивает вероятность того, что клада истинна; систематическая ошибка может дать и высокую поддержку", "t2_s6_o3": "Кладу поддерживают 62 % генов в наборе данных", "t2_s6_x3": "Бутстрэп пересчитывает столбцы одного набора данных. Доля генов с той же кладой — другая величина", "t2_s6_h1": "Что многократно отбирают при бутстрэп-анализе?", "t2_s6_h2": "Что считают по каждой псевдовыборке?", "t2_s6_h3": "Это доля повторов, а не вероятность истины", "t2_s6_e": "Поддержка показывает, насколько клада устойчива к случайной выборке данных при той же процедуре анализа. Она не учитывает ошибок выбора генов, выравнивания и модели. Политомия — узел с тремя и более ветвями — обычно означает, что данных для порядка ветвлений не хватает", "t2_s7_title": "Число узлов на пути", "t2_s7_cond": "На исходном рисунке от внешней группы Р до кончика Н — три внутренних узла, а до кончика К — четыре", "t2_s7_q": "С кем Р в более близком родстве — с Н или с К?", "t2_s7_o1": "Одинаково: общий предок у них один — корень", "t2_s7_x1": "Да: Р отделился раньше всех; общий предок Р и любого вида внутренней группы — корень дерева", "t2_s7_o2": "С Н: на пути от Р до Н меньше узлов", "t2_s7_x2": "Число узлов на пути зависит от того, сколько ветвлений было внутри группы, а не от родства с Р", "t2_s7_o3": "С К: на рисунке К стоит ближе к корню", "t2_s7_x3": "Положение кончика на рисунке меняется поворотом ветвей и родства не показывает", "t2_s7_h1": "Где сходятся линии Р и Н? А Р и К?", "t2_s7_h2": "Это один и тот же узел?", "t2_s7_h3": "Сравнивают возраст общего предка, а не число узлов на пути", "t2_s7_e": "Подсчёт узлов между кончиками — распространённая ошибка чтения дерева. Внутри клады К+Л+М было больше ветвлений, чем внутри Н+П, но это не делает К дальше от Р", "t3_title": "Дерево гена и дерево видов", "t3_rules": "Три вида: К и Л разделились позже, М отделился раньше. От каждого вида берём одну копию участка генома и прослеживаем её назад. В общем предке К и Л линии копий могут слиться, а могут дойти несливавшимися до общего предка всех трёх — тогда порядок слияния случаен. Доля деревьев, совпадающих с деревом видов, равна 1 − (2/3)·e^(−T), каждого из двух несовпадающих — (1/3)·e^(−T); T = t/(2Ne): t — число поколений между двумя разделениями видов, Ne — эффективная численность предковой популяции. В режиме обмена генами доля 0,1 участков перешла из М в Л при гибридизации; у таких участков дерево (Л, М) — допущение модели. Числа поколений, численности и доля обмена условные", "t3_lim": "Модель не учитывает рекомбинацию внутри участка, отбор, дупликации и потери копий, ошибки построения деревьев и того, что численность меняется со временем. В ней один эпизод обмена генами в одну сторону. Локусы в модели независимы", "t3_how": "Формулу вывели в конце XX века из теории слияния генных линий в популяции; затем её проверили на геномах, где для тысяч участков построены отдельные деревья. Несовпадение деревьев разных участков у человека, шимпанзе и гориллы обнаружили, сравнив их полные геномы", "t3_s1_title": "Дерево участка и дерево видов", "t3_s1_cond": "Дерево видов: К и Л — ближайшие родственники, М отделился раньше. Дерево одного участка генома объединяет Л и М. Поддержка этого дерева высокая", "t3_s1_q": "Значит ли это, что дерево видов неверно?", "t3_s1_o1": "Нет: история участка может отличаться от истории видов", "t3_s1_x1": "Да: дерево участка описывает происхождение его копий, а не порядок разделения видов", "t3_s1_o2": "Да: дерево видов надо перестроить по этому участку", "t3_s1_x2": "Одно дерево участка не заменяет дерева видов: другие участки могут показать другую историю", "t3_s1_o3": "Да, если поддержка дерева участка высокая", "t3_s1_x3": "Высокая поддержка значит, что история этого участка восстановлена надёжно. Она всё равно может не совпадать с историей видов", "t3_s1_h1": "Что описывает дерево одного участка?", "t3_s1_h2": "Обязаны ли копии гена сливаться в том же порядке, в каком делились виды?", "t3_s1_h3": "Сравните с другими участками", "t3_s1_e": "Дерево гена — история копий одного участка, дерево видов — история разделения популяций. Они не обязаны совпадать: копии могут слиться в другом порядке, участок мог перейти между видами, а ген — удвоиться и утратиться в разных линиях", "t3_s2_title": "Конструктор: длина внутренней ветви", "t3_s2_cond": "Эффективная численность предков — 10 000. Между двумя разделениями видов прошло 10 000 поколений. Затем этот промежуток увеличиваем до 160 000 поколений", "t3_s2_q": "Как изменится доля деревьев, не совпадающих с деревом видов?", "t3_s2_o1": "Упадёт почти до нуля", "t3_s2_x1": "Да: с 0,40 до 0,0002. За долгий промежуток линии почти наверняка сливаются в общем предке К и Л", "t3_s2_o2": "Не изменится: время не влияет на историю копий", "t3_s2_x2": "Чем дольше промежуток, тем больше шансов, что линии К и Л сольются до следующего разделения", "t3_s2_o3": "Вырастет: за долгое время накопится больше различий", "t3_s2_x3": "Число различий растёт, но порядок слияния копий от этого не зависит; несовпадений становится меньше", "t3_s2_h1": "В какой популяции должны слиться линии К и Л, чтобы дерево совпало?", "t3_s2_h2": "Как длина промежутка влияет на шанс слиться?", "t3_s2_h3": "T = t/(2Ne): при t = 160 000 и Ne = 10 000 T = 8", "t3_s2_e": "Неполная сортировка линий особенно часта, когда разделения видов следуют быстро одно за другим. Чем длиннее внутренняя ветвь дерева видов, тем реже деревья участков с ним расходятся", "t3_s3_title": "Изменение условий задачи: численность предков", "t3_s3_cond": "Промежуток между разделениями — 40 000 поколений. Эффективную численность предков увеличиваем с 10 000 до 50 000", "t3_s3_q": "Как изменится доля несовпадающих деревьев?", "t3_s3_o1": "Вырастет: в большой популяции линии сливаются дольше", "t3_s3_x1": "Да: с 0,09 до 0,45. В большой популяции две копии реже происходят от одной родительской копии", "t3_s3_o2": "Упадёт: в большой популяции слабее дрейф", "t3_s3_x2": "Слабый дрейф и есть причина: линии дольше не сливаются, и сохраняется предковый полиморфизм", "t3_s3_o3": "Не изменится: численность меняет частоты, а не деревья", "t3_s3_x3": "История копий — тоже результат дрейфа: от численности зависит, как быстро линии сливаются", "t3_s3_h1": "От чего зависит, как быстро две копии находят общего предка?", "t3_s3_h2": "Вспомните, как сила дрейфа зависит от численности", "t3_s3_h3": "T = 40 000/(2·50 000) = 0,4", "t3_s3_e": "Неполная сортировка — следствие сохранения предкового полиморфизма. Её доля зависит от длины внутренней ветви в единицах 2Ne поколений: короткий промежуток и большая численность дают много несовпадающих деревьев", "t3_s4_title": "Два несовпадающих типа", "t3_s4_cond": "Только неполная сортировка, без обмена генами. Деревья локусов бывают трёх типов: (К, Л), (Л, М), (К, М)", "t3_s4_q": "Как соотносятся доли деревьев (Л, М) и (К, М)?", "t3_s4_o1": "Равны", "t3_s4_x1": "Да: при неполной сортировке две несливавшиеся линии К и Л попадают в общий предок всех трёх видов на равных", "t3_s4_o2": "(Л, М) больше: Л ближе к М", "t3_s4_x2": "Л и К одинаково близки к М: у них общий предок с М — один и тот же узел", "t3_s4_o3": "(К, М) больше: К дальше от Л", "t3_s4_x3": "К и Л — сестринские виды; ни один не «дальше» от М", "t3_s4_h1": "Что происходит с линиями, которые не слились в общем предке К и Л?", "t3_s4_h2": "Есть ли у какой-то пары преимущество в общем предке всех трёх?", "t3_s4_h3": "В общем предке трёх видов первыми могут слиться любые две линии из трёх", "t3_s4_e": "Равенство двух несовпадающих типов совместимо с одной неполной сортировкой. Избыток одного типа указывает на другой процесс — обмен генами или структуру предковых популяций", "t3_s5_title": "Режим обмена генами", "t3_s5_cond": "Включён обмен генами: часть участков генома вида М перешла в вид Л при гибридизации. t = 40 000 поколений, Ne = 10 000", "t3_s5_q": "Что отличает этот режим от неполной сортировки?", "t3_s5_o1": "Деревьев (Л, М) больше, чем деревьев (К, М)", "t3_s5_x1": "Да: 0,14 против 0,04. У участков, перешедших из М в Л, дерево (Л, М)", "t3_s5_o2": "Деревьев (К, Л) стало больше, чем было", "t3_s5_x2": "Совпадающих стало меньше: 0,82 вместо 0,91", "t3_s5_o3": "Несовпадающие деревья вовсе исчезли", "t3_s5_x3": "Неполная сортировка продолжается; к ней добавились перешедшие участки", "t3_s5_h1": "Какое дерево у участка, полученного видом Л от вида М?", "t3_s5_h2": "Сильно ли изменилась доля (К, М)?", "t3_s5_h3": "Сравните столбики (Л, М) и (К, М)", "t3_s5_e": "Интрогрессия — перенос участков генома одного вида в генофонд другого через гибридизацию и возвратные скрещивания. Она даёт избыток одного несовпадающего типа деревьев, а доли двух других типов немного уменьшаются; неполная сортировка — два несовпадающих типа поровну. Избыток может дать и структура предковых популяций, поэтому вывод об обмене генами — модельный", "t3_s6_title": "Сто участков", "t3_s6_cond": "По 100 участкам генома: 85 деревьев (К, Л), 9 — (Л, М), 6 — (К, М)", "t3_s6_q": "Был ли обмен генами между М и Л?", "t3_s6_o1": "По этим данным различить нельзя", "t3_s6_x1": "Да: 9 и 6 из 100 — в пределах случайных колебаний. Нужно больше участков", "t3_s6_o2": "Был: деревьев (Л, М) больше", "t3_s6_x2": "При 100 участках такая разница бывает и без обмена: в повторах без обмена — 7 и 8, 4 и 8, 5 и 2", "t3_s6_o3": "Не было: доли (Л, М) и (К, М) почти равны", "t3_s6_x3": "Эта выборка получена в режиме с обменом генами: ожидалось 14 и 4 из 100, но выборка мала", "t3_s6_h1": "Насколько различаются выборки из 100 участков в одном режиме?", "t3_s6_h2": "Переключите повторы 1–5 в обоих режимах", "t3_s6_h3": "Сравните с ожидаемыми долями модели", "t3_s6_e": "Неполную сортировку и интрогрессию различают по многим участкам генома: по малому числу участков случайные колебания скрывают избыток одного типа", "t4_title": "Виды и видообразование", "t4_rules": "Несовместимость: у предка генотип aabb. В популяции 1 закрепляется новый аллель A, в популяции 2 — новый аллель B. Новые аллели совместимы с предковыми; сочетание A с B снижает жизнеспособность до 0,1. При доминантной несовместимости достаточно одной копии A и одной B, при рецессивной нужна гомозигота по одному из новых аллелей. Доли генотипов F2 — по законам Менделя для двух несцепленных локусов. Поток генов: каждое поколение доля m особей популяции — мигранты из большой соседней популяции, частоты в которой не меняются. Нейтральный аллель в начале есть у всех особей популяции и отсутствует у мигрантов; локус под местным отбором — модель семинара 1 раздела «Эволюция» (приспособленности 1; 0,9; 0,8; у мигрантов частота местного варианта всегда 0,1). Жизнеспособность, доли мигрантов и приспособленности условные", "t4_lim": "В модели два локуса и одна несовместимость; в природе барьер обычно складывается из многих несовместимостей и других барьеров. Модель не показывает, как отбор или дрейф закрепили новые аллели, и не учитывает сцепления. Карты не описывают настоящих ареалов. Поток генов в модели идёт в одну сторону и постоянен; дрейф не учтён: при конечной численности нейтральное различие не исчезает полностью, а устанавливается на уровне равновесия дрейфа и потока", "t4_how": "Модель несовместимости, не требующую вредного промежуточного генотипа, предложили в первой половине XX века. Её проверяли, скрещивая близкие виды в лаборатории и находя гены, сочетания которых у гибридов снижают жизнеспособность или плодовитость. Поток генов между популяциями оценивают по частотам аллелей и по геномам", "t4_s1_title": "Сколько здесь видов", "t4_s1_cond": "Две формы комаров живут в одних водоёмах. По строению их не различить. В смешанных группах спаривания между формами почти не происходят; по геномам каждая форма — отдельная группа, произошедшая от своего общего предка", "t4_s1_q": "Сколько здесь видов?", "t4_s1_o1": "Два — по скрещиванию и родству, хотя строение одно", "t4_s1_x1": "Да: по биологической и филогенетической концепциям — два вида; по строению различий нет", "t4_s1_o2": "Один: по строению эти формы не различить", "t4_s1_x2": "Строение — лишь один источник данных. Близкие виды бывают почти неразличимы по строению", "t4_s1_o3": "Нельзя сказать без ископаемых остатков", "t4_s1_x3": "Для современных организмов ископаемые не нужны: есть данные о скрещивании и геномах", "t4_s1_h1": "Какие данные здесь есть?", "t4_s1_h2": "Что считает видом биологическая концепция? А филогенетическая?", "t4_s1_h3": "Совпадают ли выводы по скрещиванию и по геномам?", "t4_s1_e": "Концепция вида — представление о том, какое свойство делает линию видом; критерии — данные, по которым его оценивают. Биологическая концепция требует репродуктивной изоляции, филогенетическая — отдельной монофилетической или диагностируемой группы, морфологическая — различий в строении. Здесь критерии расходятся: строение одно, а скрещивание и родство указывают на два вида. Такие виды называют видами-двойниками; вывод зависит от того, какие данные доступны и какая концепция применима к объекту", "t4_s2_title": "Барьер до или после образования зиготы", "t4_s2_cond": "В одной реке две популяции рыб нерестятся в разное время: одна весной, другая осенью", "t4_s2_q": "Что это за барьер?", "t4_s2_o1": "Временной, до образования зиготы", "t4_s2_x1": "Да: при разных сроках размножения встреча гамет невозможна", "t4_s2_o2": "После образования зиготы: гибриды не выживают", "t4_s2_x2": "О гибридах здесь ничего не известно: зиготы не образуются, потому что сроки нереста не совпадают", "t4_s2_o3": "Не барьер: популяции живут в одной реке", "t4_s2_x3": "Общая территория не означает скрещивания: сроки размножения разделяют популяции не хуже расстояния", "t4_s2_h1": "Образуются ли здесь гибридные зиготы?", "t4_s2_h2": "Какие барьеры действуют до оплодотворения?", "t4_s2_h3": "Время размножения — один из них", "t4_s2_e": "Барьеры до образования зиготы — различия в месте и времени размножения, поведении и выборе партнёра, строении половых органов, взаимодействии гамет. Барьеры после — нежизнеспособность и бесплодие гибридов и их потомков. Классификация по времени действия не объясняет происхождения барьера", "t4_s3_title": "Несовместимость без вредного промежуточного генотипа", "t4_s3_cond": "У предка генотип aabb. В популяции 1 закрепился новый аллель A, в популяции 2 — новый аллель B. У гибрида AaBb жизнеспособность снижена", "t4_s3_q": "Почему A и B закрепились, хотя их сочетание снижает жизнеспособность?", "t4_s3_o1": "В своей популяции каждый был только с предковым аллелем", "t4_s3_x1": "Да: A жил с b, B — с a. Сочетание A с B впервые возникло у гибрида", "t4_s3_o2": "Отбор заранее развёл их по разным популяциям", "t4_s3_x2": "Отбор не действует заранее: он действует только на существующие генотипы. A и B оказались в разных популяциях независимо", "t4_s3_o3": "Каждый аллель вреден сам по себе, но очень слабо", "t4_s3_x3": "В модели Aabb, AAbb, aaBb и aaBB полностью жизнеспособны; снижает жизнеспособность только сочетание A с B", "t4_s3_h1": "С какими аллелями встречался A в популяции 1?", "t4_s3_h2": "Был ли в популяции 1 генотип с A и B вместе?", "t4_s3_h3": "Сравните жизнеспособность на обоих путях", "t4_s3_e": "Модель Добжанского–Мёллера объясняет, как возникает постзиготический барьер: варианты, закрепившиеся в разных линиях, впервые встречаются у гибрида; такие генотипы до гибридизации не возникали, и отбор на них не действовал. Ни одна линия при этом не проходит через вредный генотип", "t4_s4_title": "Конструктор: обе замены в одной популяции", "t4_s4_cond": "Переключите: обе замены — сначала A, потом B — происходят в популяции 1", "t4_s4_q": "Насколько вероятен такой путь?", "t4_s4_o1": "Маловероятен: на пути AABb с жизнеспособностью 0,1", "t4_s4_x1": "Да: как только появляется B рядом с A, жизнеспособность падает, и отбор против таких генотипов сильный", "t4_s4_o2": "Так же вероятен: каждый шаг меняет один аллель", "t4_s4_x2": "Каждый шаг мал, но шаг AAbb → AABb создаёт несовместимое сочетание", "t4_s4_o3": "Так же вероятен, если A и B возникнут разом", "t4_s4_x3": "Одновременное появление ничего не меняет: носитель A и B всё равно несовместим", "t4_s4_h1": "Пройдите путь по шагам", "t4_s4_h2": "На каком шаге впервые есть и A, и B?", "t4_s4_h3": "Какова его жизнеспособность?", "t4_s4_e": "Поэтому несовместимые варианты накапливаются главным образом в разных, изолированных популяциях: в одной популяции отбор против сочетания, снижающего жизнеспособность, сильный, и такой путь маловероятен; пройти его можно лишь случайно, например в очень малой популяции", "t4_s5_title": "Изменение условий задачи: рецессивная несовместимость", "t4_s5_cond": "Теперь жизнеспособность снижена, только если особь гомозиготна по одному из новых аллелей и несёт второй", "t4_s5_q": "Где проявится несовместимость?", "t4_s5_o1": "У части потомков гибридов, в F2", "t4_s5_x1": "Да: F1 AaBb жизнеспособен; в F2 несовместимы 5/16 потомков (AABb, AABB, AaBB), выживает 0,72", "t4_s5_o2": "Уже у гибридов F1: в них есть и A, и B", "t4_s5_x2": "При рецессивной несовместимости одной копии каждого нового аллеля недостаточно", "t4_s5_o3": "Нигде: рецессивные эффекты не проявляются", "t4_s5_x3": "Рецессивный эффект проявляется у гомозигот; в F2 они появляются", "t4_s5_h1": "Какой генотип у F1?", "t4_s5_h2": "Есть ли в F1 гомозиготы по A или B?", "t4_s5_h3": "В F2 расщепление — 9 генотипов", "t4_s5_e": "В зависимости от доминирования барьер проявляется уже у гибридов первого поколения или только у их потомков. Это тоже барьер после образования зиготы", "t4_s6_title": "Поток генов", "t4_s6_cond": "Каждое поколение 1 % особей популяции — мигранты из большой соседней популяции. Один локус нейтрален, другой — под местным отбором; у мигрантов местного варианта мало (частота 0,1)", "t4_s6_q": "Что будет с различием популяций через 500 поколений?", "t4_s6_o1": "Нейтральное почти исчезнет, а под отбором сохранится", "t4_s6_x1": "Да: нейтральное различие около 0,007; частота местного варианта 0,91", "t4_s6_o2": "Сохранится везде: 1 % — мало", "t4_s6_x2": "За 500 поколений даже 1 % мигрантов сглаживает различия нейтральных частот: за поколение различие умножается на 1 − m", "t4_s6_o3": "Исчезнет везде: поток генов стирает различия", "t4_s6_x3": "Местный отбор удерживает различие в своём локусе: при m = 0,01 частота местного варианта 0,91", "t4_s6_h1": "Что противодействует потоку генов в нейтральном локусе?", "t4_s6_h2": "А в локусе под отбором?", "t4_s6_h3": "Сдвиньте бегунок на 0,1", "t4_s6_e": "Поток генов противодействует расхождению. При умеренном потоке различия сохраняются в участках генома под дивергентным отбором и в сцепленных с ними участках; при сильном потоке стираются и они", "t4_s7_title": "Расхождение на одной территории", "t4_s7_cond": "Две формы насекомых живут на одном участке, обмениваются генами, но развиваются на разных растениях и спариваются на них же", "t4_s7_q": "Возможно ли расхождение без пространственного барьера?", "t4_s7_o1": "Возможно, если отбор и выбор партнёра снижают поток генов", "t4_s7_x1": "Да: специализация на ресурсе и спаривание на нём уменьшают эффективный поток генов", "t4_s7_o2": "Невозможно: без барьера популяции сольются", "t4_s7_x2": "Сольются, если поток генов велик, а различающего отбора нет. Здесь есть оба механизма, снижающих поток", "t4_s7_o3": "Возможно всегда: общая территория ускоряет расхождение", "t4_s7_x3": "Общая территория не ускоряет расхождение, а затрудняет его: поток генов сильнее, чем у разделённых популяций", "t4_s7_h1": "Что снижает эффективный поток генов на одной территории?", "t4_s7_h2": "Сравните показания при m = 0,01 и 0,1", "t4_s7_h3": "Географический режим не называет механизма", "t4_s7_e": "Аллопатрия, перипатрия, парапатрия и симпатрия описывают расположение популяций, а не генетический механизм. Расхождение возможно при любом режиме, если дивергентный отбор, выбор партнёра или хромосомные изменения уменьшают эффективный поток генов", "c2_obs": "Два рисунка дерева видов К, Л, М, Н, П, Р: порядок кончиков сверху вниз на первом — К, Л, М, Н, П, Р, на втором — Р, П, Н, Л, К, М", "c2_c1": "То же дерево, ветви повёрнуты", "c2_c2": "То же некорневое дерево, другой корень", "c2_c3": "Другая топология", "c2_c4": "То же дерево, другой режим длины ветви", "c2_m1": "Списки клад обоих рисунков", "c2_r1_1": "одинаковы", "c2_r1_2": "различаются", "c2_r1_3": "различаются", "c2_r1_4": "одинаковы", "c2_m2": "Где на втором рисунке внешняя группа", "c2_r2_1": "у корня", "c2_r2_2": "не у корня", "c2_r2_3": "у корня", "c2_r2_4": "у корня", "c2_m3": "Подписи длины ветви под рисунками", "c2_r3_1": "одинаковы", "c2_r3_2": "одинаковы", "c2_r3_3": "одинаковы", "c2_r3_4": "различаются", "c2_m4": "Разбиения без учёта корня", "c2_r4_1": "одинаковы", "c2_r4_2": "одинаковы", "c2_r4_3": "различаются", "c2_r4_4": "одинаковы", "c2_after": "Порядок кончиков на рисунке не говорит, одно это дерево или разные. Сравнивают клады, положение корня и подпись длины ветви", "c3_obs": "Дерево видов ((К, Л), М) построено по геномам и надёжно. Дерево одного гена объединяет Л и М", "c3_c1": "Неполная сортировка линий", "c3_c2": "Интрогрессия из М в Л", "c3_c3": "Ошибка построения дерева гена", "c3_c4": "Скрытая паралогия: сравниваются разные копии гена", "c3_m1": "Доли трёх типов деревьев по 1000 участкам", "c3_r1_1": "910 / 45 / 45", "c3_r1_2": "819 / 140 / 41 (округлено)", "c3_r1_3": "910 / 45 / 45", "c3_r1_4": "910 / 45 / 45", "c3_m2": "Устойчивость дерева гена к другому выравниванию и другой модели замен", "c3_r2_1": "устойчиво", "c3_r2_2": "устойчиво", "c3_r2_3": "меняется", "c3_r2_4": "устойчиво", "c3_m3": "Число копий гена у каждого вида и дерево всего генного семейства", "c3_r3_1": "по одной копии", "c3_r3_2": "по одной копии", "c3_r3_3": "по одной копии", "c3_r3_4": "у одного или нескольких видов — две копии; сравнивались копии от дупликации", "c3_m4": "Длина внутренней ветви дерева видов (t и Ne)", "c3_r4_1": "короткая", "c3_r4_2": "любая", "c3_r4_3": "любая", "c3_r4_4": "любая", "c3_after": "Одно несовпадение дерева гена с деревом видов не называет причины. Нужны доли двух несовпадающих типов по многим участкам, поддержка дерева гена и проверка, что сравниваются ортологи", "c4_obs": "Две популяции лягушек много поколений жили порознь. После того как их ареалы снова соприкоснулись, гибридов в природе почти нет", "c4_c1": "Временной барьер: разные сроки размножения", "c4_c2": "Поведенческий барьер: самки не отвечают на брачный зов самцов другой популяции", "c4_c3": "Гаметический барьер: спаривание есть, оплодотворения нет", "c4_c4": "Постзиготический барьер: гибриды гибнут на ранних стадиях", "c4_m1": "Сроки размножения популяций", "c4_r1_1": "не совпадают", "c4_r1_2": "совпадают", "c4_r1_3": "совпадают", "c4_r1_4": "совпадают", "c4_m2": "Реакция самок на зов самцов другой популяции", "c4_r2_1": "—", "c4_r2_2": "нет реакции", "c4_r2_3": "есть", "c4_r2_4": "есть", "c4_m3": "Искусственное оплодотворение икры спермой другой популяции", "c4_r3_1": "оплодотворение есть", "c4_r3_2": "оплодотворение есть", "c4_r3_3": "оплодотворения почти нет", "c4_r3_4": "оплодотворение есть", "c4_m4": "Выживание гибридных зародышей до метаморфоза", "c4_r4_1": "выживают", "c4_r4_2": "выживают", "c4_r4_3": "—", "c4_r4_4": "гибнут", "c4_after": "Отсутствие гибридов в природе — наблюдение; какой барьер его создаёт, выясняют отдельными проверками для каждого этапа: встреча, спаривание, оплодотворение, развитие гибрида", "a1_title": "Сколько генома удаётся выровнять", "a1_src": "Yoo D. et al. Complete sequencing of ape genomes. Nature 2025; 641: 401–418. DOI 10.1038/s41586-025-08816-3 (полный текст, PMC12058530; разделы «Divergence and selection», рис. 2).", "a1_cond": "Геномы шести видов человекообразных обезьян (шимпанзе, бонобо, горилла, два вида орангутанов, сиаманг) прочитаны вместе с повторами; около трёх четвертей хромосом (74 %) собраны от конца до конца без разрывов. Их сравнили между собой и с полным геномом человека. В сравнении выравнивали не отдельный ген, а геномы целиком", "a1_p1_t": "Что выровнено", "a1_p1_q1": "геном одного вида", "a1_p1_q2": "выровнено один к одному", "a1_p1_q3": "не выровнено или не один к одному (пропуски)", "a1_p1_q4": "Доля невыровненного", "a1_p1_q5": "наименьшая в работе — 12,5 %", "a1_p1_q6": "наибольшая — 27,3 %", "a1_p1_q7": "разброс по сравнениям разных пар видов, включая далёкие; значения для отдельных пар — в приложениях к работе, на схеме не показаны", "a1_p1_q8": "здесь считают однонуклеотидные различия и процент сходства", "a1_p2_t": "Два вида различий", "a1_p2_q1": "однонуклеотидные различия", "a1_p2_q2": "различия по пропускам — вставкам, делециям, перестройкам", "a1_p2_q3": "в 5 раз больше", "a1_p2_q4": "в 15 раз больше", "a1_p2_q5": "столбики относительные: единица — мегабазы, затронутые однонуклеотидными различиями", "a1_p3_t": "Структурно расходящиеся участки", "a1_p3_q1": "в среднем 327 млн пар нуклеотидов — около 10 % генома одной линии", "a1_p3_q2": "участки, устроенные у линии иначе, чем у других", "a1_status": "Модель по данным одной работы; доли и кратности измерены, полосы — схема", "a1_s1_q": "Сходство геномов человека и шимпанзе часто называют очень высоким. По какой части генома считают такой процент?", "a1_s1_o1": "По выровненной: остальное в него не входит", "a1_s1_x1": "Да: в этой работе у разных пар видов от 12,5 до 27,3 % генома не выровнялось один к одному", "a1_s1_o2": "По всему геному: иначе процент неверен", "a1_s1_x2": "Процент сходства считают по выровненным столбцам; где выравнивания нет, сравнивать нечего", "a1_s1_o3": "По генам: остальная ДНК вообще не сравнивается", "a1_s1_x3": "Сравнивали геномы целиком, включая повторы; часть генома не выровнялась, гены здесь ни при чём", "a1_s1_e": "Процент сходства — свойство выравнивания: его считают по столбцам, где обе последовательности сопоставлены. Чем больше участков не удаётся выровнять, тем больше различий процент не учитывает", "a1_s2_q": "Что охватывает больше генома — однонуклеотидные различия или различия по пропускам?", "a1_s2_o1": "Пропуски: в 5–15 раз больше мегабаз", "a1_s2_x1": "Да: вставки, делеции и перестройки в быстро меняющихся участках затрагивают намного больше последовательности; часть пропусков — следствие трудностей выравнивания повторов", "a1_s2_o2": "Однонуклеотидные: их больше всего по числу", "a1_s2_x2": "По числу событий замен много, но каждая затрагивает одну пару нуклеотидов; пропуски охватывают длинные участки", "a1_s2_o3": "Одинаково: это одни и те же различия", "a1_s2_x3": "Это разные классы различий; в работе их считали отдельно", "a1_s2_e": "Различия между геномами — это не только замены букв. Длинные вставки, делеции, дупликации и инверсии меняют больше последовательности, чем однонуклеотидные замены, но в процент сходства по выравниванию не входят", "a1_s3_q": "Значит ли это, что прежние оценки сходства неверны?", "a1_s3_o1": "Нет: они верны для выровненной части генома", "a1_s3_x1": "Да: прежний процент описывает выровненную часть; новые данные добавили то, что раньше не удавалось прочитать и выровнять", "a1_s3_o2": "Да: сходство геномов на самом деле около 75 %", "a1_s3_x2": "Невыровненная доля не равна доле различий: в ней есть и сходные участки, которые не удалось сопоставить один к одному", "a1_s3_o3": "Да: геномы обезьян прочитаны с ошибками", "a1_s3_x3": "Геномы прочитаны с высокой точностью; дело в том, что считать сходством", "a1_new": "Когда геномы человекообразных обезьян прочитали почти полностью, вместе с повторами, оказалось, что у разных пар видов от 12,5 до 27,3 % генома не выравнивается один к одному. Различия по пропускам — вставкам, делециям, перестройкам — затрагивают в 5–15 раз больше мегабаз, чем однонуклеотидные; часть из них связана с трудностями выравнивания повторов. Поэтому привычный процент сходства описывает только выровненную часть геномов", "a1_how": "Геномы прочитали длинными прочтениями; 74 % хромосом собрали от конца до конца без разрывов, остальные разрывы — в основном в повторах генов рибосомной РНК. Затем выровняли геномы попарно и отдельно учли участки, которые выравниваются плохо или не один к одному", "a1_lim": "Модель не показывает значений для отдельных пар видов и не разделяет причины, по которым участок не выровнялся: быстрые изменения, перестройки или трудности выравнивания повторов. Невыровненная доля — не доля различий", "a2_title": "Поддержка и согласие генов", "a2_src": "Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214. DOI 10.1093/molbev/msae214 (полный текст; с. 4, ур. 1–2; рис. 2; раздел «An Example from Birds», рис. 4).", "a2_cond": "По геномам 363 видов птиц построено дерево. У шести крупных групп поддержка максимальная (апостериорная вероятность 1,0 — одна из мер поддержки). Для каждой группы посчитали ещё одну величину — долю деревьев отдельных генов, в которых эта группа есть", "a2_p1_t": "Три величины", "a2_p1_q1": "Группа", "a2_p1_q2": "древненёбные птицы (страусы, нанду, тинаму и другие)", "a2_p1_q3": "новая группа Elementaves", "a2_p1_q4": "поддержка", "a2_p1_q5": "доля деревьев генов, где группа есть целиком", "a2_p1_q6": "группа есть в 43 из 63 000 деревьев генов", "a2_p1_q7": "доля четвёрок видов, где порядок ветвления как в дереве видов", "a2_p2_t": "Почему так бывает", "a2_p2_q1": "Elementaves, четвёрки видов — 33,9 %", "a2_p2_q2": "расчёт по формуле; у самых коротких ветвей дерева птиц около 0,01 таких единиц, у самых длинных — 8,71; по трём видам доля не бывает меньше примерно 1/3", "a2_p3_t": "Больше данных", "a2_p3_q1": "поддержка растёт с объёмом данных, доля совпадающих деревьев — нет", "a2_status": "Модель по данным одной работы; доли измерены, кривая — расчёт по формуле", "a2_s1_q": "У обеих групп поддержка 1,0. Что ожидать для доли деревьев генов, в которых группа есть?", "a2_s1_o1": "Она может быть любой — от почти 0 до 100 %", "a2_s1_x1": "Да: у древненёбных 100 %, у Elementaves 0,1 % — 43 дерева из 63 000", "a2_s1_o2": "Около 100 % у обеих: поддержка максимальна", "a2_s1_x2": "Поддержка говорит, насколько надёжно определено дерево видов, а не какая доля генов с ним согласна", "a2_s1_o3": "Около 50 %: генов «за» и «против» поровну", "a2_s1_x3": "Доля определяется историей видов — длиной ветви и численностью, а не равновесием «за» и «против»", "a2_s1_e": "Поддержка ветви и доля совпадающих деревьев генов — разные величины. Первая показывает уверенность в дереве видов, вторая — какая часть генома имеет ту же историю", "a2_s2_q": "По четвёркам видов порядок ветвления Elementaves совпадает в 33,9 % случаев, а целиком группа есть лишь в 0,1 % деревьев генов. Почему вторая доля намного меньше?", "a2_s2_o1": "В деревьях генов распадаются и её подгруппы", "a2_s2_x1": "Да: соседние ветви тоже очень короткие, и в большинстве деревьев генов подгруппы Elementaves сами не собраны вместе", "a2_s2_o2": "Группа выделена ошибочно, хотя поддержка высока", "a2_s2_x2": "Авторы подчёркивают: малая доля согласных генов не значит, что группы нет", "a2_s2_o3": "Неполная сортировка даёт меньше 1/3 совпадений", "a2_s2_x3": "По трём видам неполная сортировка не опускает долю ниже примерно 1/3 — это и видно по четвёркам (33,9 %)", "a2_s2_e": "Две причины складываются. Быстрое ветвление (короткие ветви) опускает долю согласных деревьев к 1/3. Требование, чтобы в дереве гена вся многовидовая группа была собрана целиком, снижает её ещё сильнее: при коротких соседних ветвях подгруппы в деревьях генов перемешиваются, а ошибки построения деревьев отдельных генов это усиливают", "a2_s3_q": "Число генов в анализе увеличили с 200 до 2000. Что изменится?", "a2_s3_o1": "Поддержка вырастет, доля согласных генов — нет", "a2_s3_x1": "Да: доля — свойство истории видов; от числа генов зависит только точность её оценки", "a2_s3_o2": "Обе величины вырастут вместе с числом генов", "a2_s3_x2": "Доля совпадающих деревьев не растёт с объёмом данных: она определяется длиной ветви", "a2_s3_o3": "Обе величины останутся прежними", "a2_s3_x3": "Поддержка растёт с объёмом данных: уже при 200 генах почти у всех ветвей она выше 95 %", "a2_new": "В дереве 363 видов птиц шесть крупных групп имеют максимальную поддержку. Но доля деревьев отдельных генов, в которых группа есть целиком, у древненёбных птиц — 100 %, а у новой группы Elementaves — 0,1 % (43 дерева из 63 000); по четвёркам видов — 33,9 %, около нижнего предела. Поддержка растёт с объёмом данных, а доля согласных генов отражает историю видов: при быстром ветвлении она мала, даже если дерево видов верно", "a2_how": "Для каждого из тысяч участков генома построили отдельное дерево и посчитали, в какой доле деревьев есть каждая группа дерева видов; поддержку дерева видов оценили обычными методами", "a2_lim": "Модель не показывает, какая доля несовпадений вызвана неполной сортировкой, а какая — обменом генами или ошибками построения деревьев отдельных генов. Кривая на панели Б — для трёх видов; для многовидовых групп доля деревьев, где группа есть целиком, может быть сколь угодно малой. Доля деревьев генов не оценивает вероятность того, что группа существует", "a3_title": "Ген предпочтения перешёл между видами", "a3_src": "Rossi M. et al. Adaptive introgression of a visual preference gene. Science 2024; 383: 1368–1373. DOI 10.1126/science.adj9201 (полный текст, PMC7616200; рис. 1–4).", "a3_cond": "Три вида бабочек Heliconius. H. timareta по геному ближе к H. cydno, но живёт вместе с H. melpomene и, как она, имеет красный рисунок крыльев; у H. cydno рисунок белый. Самцам в эксперименте с выбором предлагали двух самок — красную и белую — и измеряли долю времени ухаживания за красной", "a3_p1_t": "Два дерева", "a3_p1_q1": "Участок", "a3_p1_q2": "геном в целом", "a3_p1_q3": "участок гена regucalcin1", "a3_p1_q4": "по данным работы, упрощённо", "a3_p2_t": "Предпочтение красных самок", "a3_p2_q1": "87 самцов", "a3_p3_t": "Один ген", "a3_p3_q1": "в области 200 генов только у regucalcin1 экспрессия в ткани глаз и мозга различалась во всех сравнениях популяций с красным и белым предпочтением; аллель H. cydno экспрессируется примерно в 2 раза сильнее", "a3_status": "Модель по данным одной работы; разницы долей измерены с 95 % интервалами", "a3_s1_q": "H. timareta по геному ближе к H. cydno. Каким окажется дерево участка гена regucalcin1?", "a3_s1_o1": "(H. timareta, H. melpomene): по обмену генами", "a3_s1_x1": "Да: этот участок H. timareta получила от H. melpomene при гибридизации", "a3_s1_o2": "(H. timareta, H. cydno): как дерево видов", "a3_s1_x2": "Так выглядит большая часть генома; на участке regucalcin1 дерево другое", "a3_s1_o3": "Любым: деревья участков случайны", "a3_s1_x3": "Деревья участков различаются, но здесь несовпадение повторяется в разных популяциях и совпадает с участком, связанным с предпочтением", "a3_s1_e": "На участке, перешедшем при гибридизации, дерево объединяет виды по обмену генами, а не по родству. Это пример интрогрессии полезного варианта", "a3_s2_q": "Предпочтения у самцов H. timareta и H. melpomene различаются?", "a3_s2_o1": "Практически нет: разница 0,025, интервал включает 0", "a3_s2_x1": "Да: оба вида одинаково предпочитают красных самок; у H. cydno предпочтение намного слабее", "a3_s2_o2": "Да: H. timareta предпочитает красных сильнее", "a3_s2_x2": "Разница 0,025 мала, а её интервал от −0,039 до 0,087 включает ноль", "a3_s2_o3": "Да: у H. melpomene предпочтения нет", "a3_s2_x3": "У H. melpomene предпочтение красных сильнее, чем у H. cydno, на 0,713", "a3_s2_e": "Один и тот же участок генома, полученный одним видом от другого, вносит заметный вклад в одинаковое предпочтение у обоих видов. Это часть признака: у гибридов этот участок объясняет примерно треть разницы родительских видов", "a3_s3_q": "Можно ли сказать, что предпочтение определяет только regucalcin1?", "a3_s3_o1": "Нет: вклад других генов тоже вероятен", "a3_s3_x1": "Да: авторы прямо пишут, что другие гены тоже участвуют", "a3_s3_o2": "Да: выключение гена снизило ухаживание", "a3_s3_x2": "Выключение у H. melpomene снизило ухаживание за самкой своего вида; предпочтение окраски при этом не проверяли, и это не показывает, что ген единственный", "a3_s3_o3": "Да: других генов в этом участке хромосомы нет", "a3_s3_x3": "В участке около 200 генов; regucalcin1 выделен по экспрессии, остальные не исключены как вклад в признак", "a3_new": "Бабочки H. timareta получили от H. melpomene при гибридизации не только участок, определяющий красный рисунок крыльев, но и участок с геном regucalcin1, связанным с предпочтением красных самок. На этом участке дерево объединяет H. timareta с H. melpomene, хотя по геному она ближе к H. cydno. Когда ген выключили генным редактированием в части клеток у H. melpomene, самцы реже ухаживали за самкой своего вида, а летали и питались как обычно; предпочтение окраски в этом эксперименте не проверяли", "a3_how": "Предпочтение самцов измерили в экспериментах с выбором; у гибридов нашли участок хромосомы, связанный с предпочтением; по геномам популяций показали, что этот участок перешёл между видами; ген выделили по экспрессии в ткани глаз и мозга и проверили его выключением у H. melpomene", "a3_lim": "Модель не показывает, как ген влияет на зрение и поведение: механизм неизвестен. Выключение было неполным (мозаичным) и сделано у H. melpomene, а у части особей ухудшились выживаемость и полёт. Данные относятся к бабочкам; переносить их на других животных нельзя", "a4_title": "Несовместимость ядерных генов и митохондрий", "a4_src": "Moran B.M. et al. A lethal mitonuclear incompatibility in complex I of natural hybrids. Nature 2024; 626: 119–127. DOI 10.1038/s41586-023-06895-8 (полный текст, PMC10830419; рис. 1, 2, 5; раздел «Mapping mitonuclear incompatibilities»).", "a4_cond": "Два близких вида рыб-меченосцев (Xiphophorus birchmanni и X. malinche) разошлись около 250 000 поколений назад (различие около 0,5 % на пару нуклеотидов) и около 100 поколений назад начали скрещиваться в природе. В лаборатории получили 943 гибрида второго поколения (F2); у всех митохондрии от X. malinche. Если гены не взаимодействуют, ожидаемая доля гомозигот по ядерному участку X. birchmanni — 25 %", "a4_p1_t": "Генотипы F2", "a4_p1_q1": "Ген", "a4_p1_q2": "ndufs5 (хромосома 13)", "a4_p1_q3": "ndufa13 (хромосома 6)", "a4_p1_q4": "гомозиготы по участку X. birchmanni при митохондриях X. malinche", "a4_p1_q5": "гетерозиготы", "a4_p1_q6": "гомозиготы X. malinche", "a4_p1_q7": "жизнеспособны", "a4_p2_t": "Сила отбора", "a4_p2_q1": "почти рецессивная", "a4_p3_t": "Когда гибнут", "a4_status": "Модель по данным одной работы; доли и оценки измерены, схема комплекса упрощена", "a4_s1_q": "Сколько гомозигот по ядерному участку X. birchmanni у гена ndufs5 найдено среди 943 гибридов с митохондриями X. malinche?", "a4_s1_o1": "Почти ни одной: 0,1 % вместо 25 %", "a4_s1_x1": "Да: такие особи почти не выживают", "a4_s1_o2": "Около 25 %: так по законам Менделя", "a4_s1_x2": "25 % — ожидание без взаимодействия генов; наблюдение показывает, что эти генотипы гибнут", "a4_s1_o3": "Около 12 %: половина гибнет", "a4_s1_x3": "Отбор почти полный: оценка коэффициента отбора — 0,996", "a4_s1_e": "Ядерный аллель одного вида плохо работает с митохондриями другого: их белки взаимодействуют в комплексе I. Это несовместимость Добжанского–Мёллера между ядерным и митохондриальным геномами", "a4_s2_q": "Гибриды первого поколения (F1) гетерозиготны по этим генам. Выживают ли они?", "a4_s2_o1": "Да: несовместимость почти рецессивна", "a4_s2_x1": "Да: F1 жизнеспособны; гибнут гомозиготы, появляющиеся в F2", "a4_s2_o2": "Нет: несовместимый аллель есть уже у F1", "a4_s2_x2": "Одной копии недостаточно: коэффициент доминирования около 0,1", "a4_s2_o3": "Нет: у F1 нет митохондрий", "a4_s2_x3": "Митохондрии есть у всех; у этих гибридов они от X. malinche", "a4_s2_e": "Как в базовой модели с рецессивной несовместимостью: барьер проявляется у потомков гибридов, а не у самих гибридов", "a4_s3_q": "Переносимы ли эти числа на гибриды других животных или на людей?", "a4_s3_o1": "Нет: это два вида рыб и два гена", "a4_s3_x1": "Да: работа показывает механизм на одном примере; у других видов гены и сила отбора другие", "a4_s3_o2": "Да: комплекс I есть у всех животных", "a4_s3_x2": "Общность комплекса I не означает одинаковых несовместимостей: они зависят от того, какие замены накопили виды", "a4_s3_o3": "Да, если виды тоже разошлись недавно", "a4_s3_x3": "Время расхождения не определяет, какие гены окажутся несовместимыми", "a4_new": "У гибридов двух видов рыб-меченосцев найдена несовместимость ядерных генов с митохондриями. Гомозиготы по ядерным участкам одного вида с генами ndufs5 и ndufa13 при митохондриях другого почти не выживают: 0,1 % и 3 % вместо ожидаемых 25 %. Белки этих генов в комплексе I дыхательной цепи соприкасаются с белками, закодированными митохондриальной ДНК. У гибридов первого поколения несовместимость не проявляется. Митохондрии X. malinche, а вероятно, и ядерный ген ndufs5 при древней гибридизации перешли к третьему виду, X. cortezi, — и у его гибридов с X. birchmanni, по-видимому, действует та же несовместимость", "a4_how": "У сотен гибридов второго поколения и у гибридов из природы определили происхождение каждого участка генома и нашли участки, где одного сочетания почти нет. Затем проследили развитие зародышей с разными генотипами и измерили работу комплекса I", "a4_lim": "Модель не показывает всех несовместимостей этих видов (по прежним работам, их может быть десятки) и не показывает, почему гены быстро изменялись. Данные получены на рыбах; на других животных и на человека их не переносят", "fin_title": "От наблюдения к выводу", "fin_cond": "Четыре наблюдения. Для каждого выберите вывод, который следует из данных, и данные, нужные для проверки. Если данных недостаточно, выберите «по этим данным нельзя»", "fin_s1_obs": "Ген вида 1 сходен с геном вида 2 на 95 %, а с геном вида 3 — на 80 %", "fin_s2_obs": "На рисунке дерева внешняя группа оказалась внутри группы изучаемых видов: её ветвь отходит от узла, объединяющего её с двумя видами", "fin_s3_obs": "По 2000 участкам генома: 1500 деревьев (К, Л), 400 — (Л, М), 100 — (К, М)", "fin_s4_obs": "Гибриды двух популяций в первом поколении нормальны, а среди их потомков многие гибнут", "fin_s1_x": "Процент сходства — наблюдение. Чтобы судить о родстве видов, нужно убедиться, что сравниваются ортологи, проверить выравнивание и посмотреть на многие гены: одно сходство родства не доказывает", "fin_s2_x": "Внешняя группа должна отходить от корня. Если её ветвь отходит от узла внутри группы, корень поставлен на другую ветвь: клады — и гипотеза родства — изменились, хотя разбиения некорневого дерева могут быть прежними", "fin_s3_x": "При неполной сортировке два несовпадающих типа встречаются поровну. Четырёхкратный избыток (Л, М) при 2000 участков не объяснить случайностью: вероятнее обмен генами между Л и М, хотя похожий избыток может дать и структура предковых популяций; вывод — модельный", "fin_s4_x": "Барьер действует после образования зиготы и проявляется только у потомков гибридов — так ведёт себя рецессивная несовместимость. Какие локусы её создают, показывают генотипы погибших и выживших", "src_01": "Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014", "src_02": "Lanfear R., Hahn M.W. The meaning and measure of concordance factors in phylogenomics. Mol Biol Evol 2024; 41: msae214. doi:10.1093/molbev/msae214", "src_03": "Kapli P., Yang Z., Telford M.J. Phylogenetic tree building in the genomic age. Nat Rev Genet 2020; 21: 428–444. doi:10.1038/s41576-020-0233-0", "src_04": "Redelings B.D. et al. Insertions and deletions: computational methods, evolutionary dynamics, and biological applications. Mol Biol Evol 2024; 41: msae177. doi:10.1093/molbev/msae177", "src_05": "Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256. doi:10.1101/gr.278993.124", "src_06": "Yoo D. et al. Complete sequencing of ape genomes. Nature 2025; 641: 401–418. doi:10.1038/s41586-025-08816-3", "src_07": "Rossi M. et al. Adaptive introgression of a visual preference gene. Science 2024; 383: 1368–1373. doi:10.1126/science.adj9201", "src_08": "Groh J.S., Coop G. The temporal and genomic scale of selection following hybridization. Proc Natl Acad Sci USA 2024; 121: e2309168121. doi:10.1073/pnas.2309168121", "src_09": "Moran B.M. et al. A lethal mitonuclear incompatibility in complex I of natural hybrids. Nature 2024; 626: 119–127. doi:10.1038/s41586-023-06895-8", "src_10": "Rosser N. et al. Hybrid speciation driven by multilocus introgression of ecological traits. Nature 2024; 628: 811–817. doi:10.1038/s41586-024-07263-w", "src_11": "Uraki R. et al. SARS-CoV-2 variants: biology, pathogenicity, immunity, and control. Nat Rev Microbiol 2026; 24: 8–28. doi:10.1038/s41579-025-01255-x", "src_12": "Shapiro B.J., Leducq J.-B., Mallet J. What is speciation? PLoS Genet 2016; 12: e1005860. doi:10.1371/journal.pgen.1005860", "src_13": "Butlin R.K., Galindo J., Grahame J.W. Sympatric, parapatric or allopatric: the most important way to classify speciation? Philos Trans R Soc B 2008; 363: 2997–3007. doi:10.1098/rstb.2008.0076", "src_14": "Templeton A.R. The reality and importance of founder speciation in evolution. BioEssays 2008; 30: 470–479. doi:10.1002/bies.20745", "gn_tree_tip": "Кончик (лист) дерева", "g_tree_tip": "Конечная точка дерева, соответствующая включённому в анализ виду, популяции или последовательности.", "gn_tree_node": "Внутренний узел", "g_tree_node": "Точка ветвления дерева, изображающая реконструируемого общего предка отходящих от неё линий.", "gn_tree_mrca": "Последний общий предок", "g_tree_mrca": "Самый поздний узел дерева, от которого происходят обе сравниваемые линии; по его возрасту судят о родстве.", "gn_tree_branch": "Ветвь", "g_tree_branch": "Линия дерева между двумя узлами или между узлом и кончиком.", "gn_tree_root": "Корень дерева", "g_tree_root": "Самый древний узел, от которого происходят все линии дерева; задаёт направление от предков к потомкам.", "gn_tree_out": "Внешняя группа", "g_tree_out": "Вид или группа, отделившиеся раньше сравниваемых; по ней определяют предковое состояние и неравенство скоростей. В этом семинаре: по внешней группе ставят корень дерева.", "gn_clade_br": "Клада", "g_clade_br": "Группа, включающая общего предка и всех его потомков (монофилетическая группа).", "gn_clade_row": "Клада", "g_clade_row": "Группа, включающая общего предка и всех его потомков (монофилетическая группа).", "gn_len_cap": "Длина ветви", "g_len_cap": "Число замен на сайт (или время) вдоль ветви дерева; что означает длина, подписывают на каждом дереве. В этом семинаре: на кладограмме длина ветви ничего не означает.", "gn_len_scale": "Длина ветви", "g_len_scale": "Число замен на сайт (или время) вдоль ветви дерева; что означает длина, подписывают на каждом дереве. В этом семинаре: на кладограмме длина ветви ничего не означает.", "gn_root_spot": "Некорневое дерево", "g_root_spot": "Дерево, показывающее отношения линий без указания, какой узел древнее.", "gn_support": "Бутстрэп-поддержка", "g_support": "Доля деревьев с данной кладой среди деревьев, построенных по псевдовыборкам столбцов выравнивания, выбранных с возвращением; мера устойчивости клады к случайной выборке данных.", "gn_char_table": "Предковое состояние", "g_char_table": "Состояние признака у общего предка; обычно определяется по внешней группе.", "gn_build_field": "Общий производный признак", "g_build_field": "Состояние признака, отличное от предкового и общее для нескольких линий; по таким признакам выделяют клады.", "gn_node_spec": "Ортологи", "g_node_spec": "Гомологичные гены разных линий, разошедшиеся при разделении линий. В этом семинаре: сравнивают гены разных видов, разошедшиеся при разделении видов.", "gn_node_dup": "Дупликация гена", "g_node_dup": "Возникновение второй копии гена в геноме.", "gn_node_loss": "Дупликация гена", "g_node_loss": "Возникновение второй копии гена в геноме.", "gn_rel_label": "Ортологи", "g_rel_label": "Гомологичные гены разных линий, разошедшиеся при разделении линий. В этом семинаре: сравнивают гены разных видов, разошедшиеся при разделении видов.", "gn_seq_row": "Множественное выравнивание", "g_seq_row": "Расположение нескольких последовательностей одна под другой так, чтобы в каждом столбце стояли позиции предположительно общего происхождения.", "gn_aln_col": "Позиционная гомология", " function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });

  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));

function urlState(){

  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
