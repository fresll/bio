:1,"def":"Фаза митоза, в которой разбирается ядерная оболочка, а микротрубочки прикрепляются к кинетохорам."},{"id":"S6-T33","term":"Метафаза","section":1,"def":"Фаза митоза, в которой все хромосомы выстроены в экваториальной плоскости — метафазной пластинке."},{"id":"S6-T34","term":"Анафаза","section":1,"def":"Фаза митоза, в которой сестринские хроматиды разделяются и расходятся к полюсам (анафаза A) и полюса раздвигаются (анафаза B)."},{"id":"S6-T35","term":"Телофаза","section":1,"def":"Последняя фаза митоза: хромосомы деконденсируются, вокруг каждого набора собирается ядерная оболочка."},{"id":"S6-T36","term":"Цитокинез","section":1,"def":"Разделение цитоплазмы после разделения ядра; в животной клетке — сужением сократительного кольца."},{"id":"S6-T37","term":"Сократительное кольцо","section":1,"def":"Кольцо из актиновых филаментов и миозина II в коре делящейся клетки; его сужение образует борозду деления."},{"id":"S6-T38","term":"Биориентация","section":1,"def":"Прикрепление сестринских кинетохоров к микротрубочкам противоположных полюсов."},{"id":"S6-T39","term":"Синтелическое прикрепление","section":1,"def":"Неправильное прикрепление, при котором оба сестринских кинетохора связаны с одним полюсом."},{"id":"S6-T40","term":"Меротелическое прикрепление","section":1,"def":"Неправильное прикрепление, при котором один кинетохор связан с микротрубочками обоих полюсов."},{"id":"S6-T41","term":"Контрольная точка сборки веретена","section":1,"def":"Механизм, задерживающий анафазу, пока хотя бы один кинетохор не прикреплён к микротрубочкам."},{"id":"S6-T42","term":"Секурин","section":1,"def":"Белок-ингибитор сепаразы; разрушается после мечения APC/C перед анафазой."},{"id":"S6-T43","term":"Сепараза","section":1,"def":"Протеаза, разрезающая когезин в анафазе."},{"id":"S6-T44","term":"Ядерная ламина","section":0,"def":"Сеть белков-ламинов под внутренней мембраной ядерной оболочки; в митозе разбирается после фосфорилирования."},{"id":"S6-T45","term":"Хромосома","section":1,"def":"Молекула ДНК с белками; после S-фазы — две сестринские хроматиды, связанные когезином; число хромосом равно числу центромер."},{"id":"S6-T46","term":"Гаплоидный набор (n)","section":2,"def":"Один набор хромосом, по одной из каждой пары; у человека n = 23."},{"id":"S6-T47","term":"Количество ДНК (c)","section":2,"def":"Количество ДНК нереплицированного гаплоидного набора; запись n/c указывает число хромосом и количество ДНК в выбранной единице подсчёта."},{"id":"S6-T48","term":"Гомологичные хромосомы","section":2,"def":"Материнская и отцовская копии одной хромосомы с одинаковым набором генов."},{"id":"S6-T49","term":"Мейоз","section":2,"def":"Два последовательных деления после одного удвоения ДНК, в результате которых из диплоидной клетки образуются гаплоидные."},{"id":"S6-T50","term":"Мейоз I","section":2,"def":"Первое (редукционное) деление мейоза: расходятся гомологичные хромосомы."},{"id":"S6-T51","term":"Мейоз II","section":2,"def":"Второе (эквационное) деление мейоза, без предшествующего удвоения ДНК: расходятся сестринские хроматиды."},{"id":"S6-T52","term":"Профаза I","section":2,"def":"Длительная первая фаза мейоза I со стадиями лептотены, зиготены, пахитены, диплотены и диакинеза; в ней проходят синапсис и кроссинговер."},{"id":"S6-T53","term":"Синапсис (конъюгация)","section":2,"def":"Тесное соединение гомологичных хромосом по всей длине в профазе I."},{"id":"S6-T54","term":"Синаптонемный комплекс","section":2,"def":"Белковая структура, удерживающая гомологи рядом в зиготене и пахитене."},{"id":"S6-T55","term":"Бивалент","section":2,"def":"Пара соединённых гомологичных хромосом в мейозе I; содержит четыре хроматиды."},{"id":"S6-T56","term":"Кроссинговер","section":2,"def":"Обмен участками между несестринскими хроматидами гомологичных хромосом в профазе I."},{"id":"S6-T57","term":"Хиазма","section":2,"def":"Видимое место кроссинговера, в котором гомологи остаются связанными до анафазы I."},{"id":"S6-T58","term":"Шугошин","section":2,"def":"Белок, защищающий когезин у центромер от сепаразы в мейозе I."},{"id":"S6-T59","term":"Независимое расхождение гомологов","section":2,"def":"Независимая от других пар ориентация каждого бивалента в метафазе I; даёт 2ⁿ вариантов набора хромосом в гаметах."},{"id":"S6-T60","term":"Сперматогенез","section":2,"def":"Образование сперматозоидов; мейоз одного сперматоцита I порядка даёт четыре сперматиды."},{"id":"S6-T61","term":"Оогенез","section":2,"def":"Образование яйцеклеток; мейоз ооцита I порядка с неравными делениями даёт одну яйцеклетку и полярные тельца."},{"id":"S6-T62","term":"Полярное тельце","section":2,"def":"Маленькая клетка, отделяющаяся от ооцита при неравном делении мейоза и уносящая лишний набор хромосом."},{"id":"S6-T63","term":"Анеуплоидия","section":2,"def":"Изменение числа хромосом на одну или несколько, не кратное гаплоидному набору."},{"id":"S6-T64","term":"Апоптоз","section":0,"def":"Регулируемая гибель клетки, выполняемая каспазами: клетка уменьшается и распадается на окружённые мембраной фрагменты, которые поглощаются фагоцитами, обычно без воспаления."},{"id":"S6-T65","term":"Некротическая гибель (некроз)","section":3,"def":"Гибель клетки с набуханием и разрывом плазматической мембраны; содержимое выходит наружу и вызывает воспаление."},{"id":"S6-T66","term":"Регулируемая некротическая гибель","section":3,"def":"Некротическая гибель, которую выполняют белки самой клетки, разрушающие плазматическую мембрану (например, некроптоз и пироптоз)."},{"id":"S6-T67","term":"Каспазы","section":3,"def":"Протеазы, расщепляющие белки после остатка аспарагиновой кислоты; выполняют апоптоз."},{"id":"S6-T68","term":"Инициаторная каспаза","section":3,"def":"Каспаза, активирующаяся при сближении молекул на белковом комплексе и запускающая исполнительные каспазы."},{"id":"S6-T69","term":"Исполнительная каспаза","section":3,"def":"Каспаза, расщепляющая множество белков клетки и вызывающая признаки апоптоза."},{"id":"S6-T70","term":"Цитохром c","section":3,"def":"Белок межмембранного пространства митохондрии, переносящий электроны в дыхательной цепи; в цитозоле запускает сборку апоптосомы."},{"id":"S6-T71","term":"Апоптосома","section":3,"def":"Кольцевой белковый комплекс цитозоля, собирающийся при участии цитохрома c и активирующий каспазу-9."},{"id":"S6-T72","term":"Белки семейства BCL-2","section":3,"def":"Белки, регулирующие проницаемость наружной мембраны митохондрии во внутреннем пути апоптоза."},{"id":"S6-T73","term":"Рецептор смерти","section":3,"def":"Рецептор плазматической мембраны, который после связывания лиганда активирует каспазу-8 и запускает внешний путь апоптоза."},{"id":"S6-T74","term":"Фосфатидилсерин","section":3,"def":"Фосфолипид внутреннего слоя плазматической мембраны; при апоптозе выходит на наружную сторону и служит сигналом для фагоцитов."},{"id":"S6-T75","term":"Апоптотические тельца","section":3,"def":"Окружённые мембраной фрагменты апоптотической клетки."},{"id":"S6-T76","term":"Вторичный некроз","section":3,"def":"Потеря целостности мембраны апоптотической клеткой, которую не поглотили фагоциты."},{"id":"S6-T77","term":"Na⁺/K⁺-насос","section":3,"def":"Мембранный белок, который с затратой АТФ выкачивает Na⁺ из клетки и закачивает K⁺; поддерживает ионный состав и объём клетки."},{"id":"S6-T78","term":"Воспаление","section":3,"def":"Защитная реакция ткани на повреждение и инфекцию с привлечением иммунных клеток."},{"id":"S6-T79","term":"Митотическая катастрофа","section":0,"def":"Механизм, который вызывает гибель или необратимую остановку деления клетки, не способной завершить митоз из-за повреждения ДНК, нарушений веретена или отказа контрольных точек."},{"id":"S6-T80","term":"Сенесценция (клеточное старение)","section":0,"def":"Устойчивая остановка деления живой клетки, например после неустранённого повреждения ДНК."},{"id":"S6-T81","term":"Межмембранное пространство митохондрии","section":3,"def":"Пространство между наружной и внутренней мембранами митохондрии."},{"id":"S6-T82","term":"Плазматическая мембрана","section":1,"def":"Мембрана, окружающая клетку и отделяющая цитоплазму от внеклеточной среды."},{"id":"S6-T83","term":"Ядерная оболочка","section":1,"def":"Две мембраны, окружающие ядро; пронизана ядерными порами; в митозе большинства животных клеток разбирается."},{"id":"S6-T84","term":"Ядрышко","section":1,"def":"Область ядра, где образуются рибосомы; исчезает в начале митоза и появляется снова в телофазе."},{"id":"S6-T85","term":"Хроматин","section":1,"def":"Комплекс ДНК с белками в ядре."},{"id":"S6-T86","term":"Ооцит","section":2,"def":"Женская половая клетка, вступившая в мейоз; ооцит I порядка — до завершения мейоза I, ооцит II порядка — после него."},{"id":"S6-T87","term":"Сперматоцит","section":2,"def":"Мужская половая клетка, вступившая в мейоз; сперматоцит I порядка — до мейоза I, II порядка — после него."},{"id":"S6-T88","term":"Диплоидная клетка","section":2,"def":"Клетка с двумя гаплоидными наборами хромосом (2n); у человека 46 хромосом."},{"id":"S6-T89","term":"Анастаз","section":3,"def":"Выживание клетки после активации исполнительных каспаз."},{"id":"S6-T90","term":"Митоз","section":1,"def":"Разделение ядра, при котором каждая дочерняя клетка получает по одной сестринской хроматиде каждой хромосомы; набор хромосом сохраняется."},{"id":"S6-T91","term":"Гамета","section":2,"def":"Половая клетка (сперматозоид или яйцеклетка) с гаплоидным набором хромосом."},{"id":"S6-T92","term":"Убиквитин","section":0,"def":"Небольшой белок, который присоединяется к другим белкам как метка; цепь убиквитина направляет белок на разрушение в протеасоме."},{"id":"S6-T93","term":"Повреждение ДНК","section":0,"def":"Изменение строения ДНК (например, разрыв цепи), которое узнают белки-датчики клетки."},{"id":"S6-T94","term":"Фагоцит","section":3,"def":"Клетка, поглощающая частицы и другие клетки, например макрофаг."},{"id":"S6-T95","term":"Митохондрия","section":3,"def":"Органоид с двумя мембранами, в котором синтезируется большая часть АТФ клетки."},{"id":"S6-T96","term":"Ядро","section":0,"def":"Органоид, окружённый ядерной оболочкой и содержащий хромосомы."},{"id":"S6-T97","term":"Отстающая хроматида","section":1,"def":"Хроматида, которая в анафазе отстаёт от остальных, например при меротелическом прикреплении."},{"id":"S6-T98","term":"Сперматида","section":2,"def":"Гаплоидная клетка (1n1c), образовавшаяся после мейоза II и превращающаяся в сперматозоид."},{"id":"S6-T99","term":"Двуядерная клетка","section":1,"def":"Клетка с двумя ядрами; образуется, если после разделения ядра не произошёл цитокинез."}],"sources":{"src_01":{"url":"","cite":"Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)","doi":"","pmid":""},"src_02":{"url":"https://doi.org/10.1038/s41418-017-0012-4","cite":"Galluzzi L., Vitale I., Aaronson S.A., et al. Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018. Cell Death Differ. 2018;25(3):486–541","doi":"10.1038/s41418-017-0012-4","pmid":""},"src_03":{"url":"https://doi.org/10.3389/fcell.2020.614040","cite":"Okada Y., Numata T., Sabirov R.Z., et al. Cell death induction and protection by activation of ubiquitously expressed anion/cation channels. Part 1: roles of VSOR/VRAC in cell volume regulation, release of double-edged signals and apoptotic/necrotic cell death. Front Cell Dev Biol. 2021;8:614040","doi":"10.3389/fcell.2020.614040","pmid":""},"src_04":{"url":"https://doi.org/10.1038/ncomms14128","cite":"Rogers C., Fernandes-Alnemri T., Mayes L., Alnemri D., Cingolani G., Alnemri E.S. Cleavage of DFNA5 by caspase-3 during apoptosis mediates progression to secondary necrotic/pyroptotic cell death. Nat Commun. 2017;8:14128","doi":"10.1038/ncomms14128","pmid":""},"src_05":{"url":"https://doi.org/10.1038/s41586-022-04798-8","cite":"Basu S., Greenwood J., Jones A.W., Nurse P. Core control principles of the eukaryotic cell cycle. Nature. 2022;607(7918):381–386","doi":"10.1038/s41586-022-04798-8","pmid":""},"src_06":{"url":"https://doi.org/10.7554/eLife.75459","cite":"Kiewisz R., Fabig G., Conway W., Baum D., Needleman D., Müller-Reichert T. Three-dimensional structure of kinetochore-fibers in human mitotic spindles. eLife. 2022;11:e75459","doi":"10.7554/eLife.75459","pmid":""},"src_07":{"url":"https://doi.org/10.1016/j.cub.2023.11.061","cite":"Mihalas B.P., Pieper G.H., Aboelenain M., et al., Marston A.L. Age-dependent loss of cohesion protection in human oocytes. Curr Biol. 2024;34(1):117–131.e5","doi":"10.1016/j.cub.2023.11.061","pmid":""},"src_08":{"url":"https://doi.org/10.1073/pnas.2216531120","cite":"Nano M., Mondo J.A., Harwood J., Balasanyan V., Montell D.J. Cell survival following direct executioner-caspase activation. Proc Natl Acad Sci USA. 2023;120(4):e2216531120","doi":"10.1073/pnas.2216531120","pmid":""}},"questions":["Клеточный цикл","Митоз","Мейоз","Гибель клетки"],"exam_ids":["cycle-phases","cyclin-cdk","mitosis-phases","sac-separase","counting-n-c","homologs-synapsis","meiosis-one","sex-differences","division-death-balance","mito-pathway"],"practice_url":"seminar-6.html","open_questions":[]};
/* Объяснения к семинару 6. Без внешних библиотек и сетевых запросов.
   Тексты берутся из CONTENT (шаги, словарь, интерфейс); в коде нет учебных формулировок. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = CONTENT.ui;
const W = {};
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
const nb = ' ';
const pct = n => (100 * n).toFixed(1).replace('.', ',') + nb + '%';
const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
/* Ссылки на словарь: [[T03|текст]] → якорь словаря */
/* v1.8: номера шагов БИО-N·k больше не показываются в заголовке шага, поэтому ссылки на них в тексте превращаются в ссылки на шаг по названию */
const stepRefs = s => s.replace(/(шаге? )?БИО-6·(\d+)((?:, 6·\d+)*)/g, (m, pre, a, rest) => {
  const nums = [a].concat(rest.match(/\d+/g) || []);
  const links = nums.map(n => { const l = CONTENT.lessons.find(x => x.num === Number(n)); return l ? `<a class="stepref" href="#${l.id}">«${esc(l.title)}»</a>` : null; });
  if (links.some(x => !x)) return m;
  return (pre || 'шаг ') + links.join(', ' + (pre ? '' : 'шаг '));
});
/* семинар 11, v1.1.7: курсив названий генов (<i>lacZ</i>) — после экранирования разрешён только тег <i> без атрибутов;
   семинар 12: и <b> без атрибутов (полужирные названия звеньев в БИО-12·9, 04) */

const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

function navigate(id) {

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;
    return `<path d="M${x - 2},${y1} Q${x - 7},${ym} ${x - 2},${y2}" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */
  function profile(y0, feats, x0 = 6, x1 = 594){
    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        const b0 = Math.atan2(yn - cyb, xl - f.c) + 2 * Math.PI, b1 = Math.atan2(yn - cyb, xr - f.c);
        for (let a = b0; a >= b1; a -= Math.PI / 48) P.push([f.c + R * Math.cos(a), cyb + R * Math.sin(a)]);
        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }
    flatTo(x1); return P;
  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → аппарат Гольджи (COP-II), 'gerr' — аппарат Гольджи → ЭПР (COP-I), 'intra' — между цистернами аппарата Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).
     rm: 'none' | 'coat' (нет белков оболочки) | 'uncoat' (оболочка не снимается) | 'snare' (нет SNARE на носителе).
     Возвращает { s: SVG, a: точки для подписей }. Русского текста нет. */
  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);
    /* носитель возврата к поверхности */
    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');

      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* дуговая стрелка (цикл): от (x1,y1) к (x2,y2) с изгибом k (доля длины, знак — сторона) */
  function carrow(x1, y1, x2, y2, k = .3, col = C.ink, w = 2.2, dash = '') {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, cx = mx - dy * k, cy = my + dx * k;
    const a = Math.atan2(y2 - cy, x2 - cx), s = 8 + w;
    const p1 = [x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)], p2 = [x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)];
    const ex = x2 - Math.cos(a) * s * .6, ey = y2 - Math.sin(a) * s * .6;
    return `<path d="M${f(x1)},${f(y1)} Q${f(cx)},${f(cy)} ${f(ex)},${f(ey)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  function larrow(x1, y1, x2, y2, label, col = C.ink, o = {}) {
    return arrow(x1, y1, x2, y2, col, o.w || 2.4, o.dash || '') + (label ? T((x1 + x2) / 2 + (o.dx || 0), (y1 + y2) / 2 + (o.dy == null ? -12 : o.dy), label, { size: o.size || 12, w: 600, col, bg: true, n: o.n }) : '');
  }
  const cross = (x, y, r = 9) => `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`;
  /* плашка «откроется после ответа» на месте скрытого результата */
  function waitBox(x, y, w, h, label) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="8" fill="#EEF1F4" stroke="${C.line}" stroke-dasharray="5 4"/>` + (label ? T(x + w / 2, y + h / 2, label, { size: 11.5, col: C.muted, it: true, n: Math.max(12, Math.floor(w / 7)), vc: true }) : '');
  }
  /* метка-плашка (например, «следствие модели»): текст в рамке */
  function tag(x, y, s, col = C.warn, o = {}) {
    const sz = o.size || 11.5, wd = String(s).length * sz * .58 + 14;
    return `<rect x="${f(x - wd / 2)}" y="${f(y - sz)}" width="${f(wd)}" height="${f(sz * 2)}" rx="${f(sz)}" fill="#fff" stroke="${col}" stroke-width="1.4"/>` + T(x, y, s, { size: sz, w: 700, col });
  }
  /* строка показаний под схемой: [[название, значение, хорошо?], …] — текст + цвет */
  function readout(x, y, rows, o = {}) {
    const lh = o.lh || 18; let s = '';
    rows.forEach(([k, v, good], i) => { s += T(x, y + i * lh, k + ':', { a: 'l', size: o.size || 11.5, w: 600, col: C.muted }) + T(x + (o.kw || 150), y + i * lh, v, { a: 'l', size: o.size || 11.5, w: 700, col: good == null ? C.ink : good ? C.ok : C.bad }); });
    return s;
  }

  /* ---------- стороны мембраны: просвет / снаружи — сверху, цитозоль — снизу (10, разд. 0) */
  function sides(y, o = {}) {
    const x0 = o.x0 || 0, x1 = o.x1 || 600, top = o.top == null ? 26 : o.top, bot = o.bot || 420;   /* интеграция: top: 0 допустим (агенты t1, t3) */
    let s = `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${f(y - top)}" fill="${C.lumen}"/>` + `<rect x="${x0}" y="${f(y)}" width="${x1 - x0}" height="${f(bot - y)}" fill="${C.cyto}"/>`;
    if (o.up) s += G(o.gUp || 'lumen', T(x0 + 10, top + 14, o.up, { a: 'l', size: 12, w: 700, col: '#3E6A9A', it: true }));
    if (o.down) s += G(o.gDown || 'cyto', T(x0 + 10, bot - 14, o.down, { a: 'l', size: 12, w: 700, col: '#8A7344', it: true }));
    return s;
  }
  /* горизонтальная мембрана (бислой BF) на уровне y с разрывами gaps = [[xa, xb], …] (места белков, проходящих мембрану) */
  function memH(x0, x1, y, gaps = [], g = 'er_mem') {
    const seg = []; let a = x0;
    gaps.slice().sort((p, q) => p[0] - q[0]).forEach(([ga, gb]) => { if (ga > a) seg.push([a, ga]); a = Math.max(a, gb); });
    if (a < x1) seg.push([a, x1]);
    return G(g, seg.map(([p, q]) => BF.bilayerPts([[p, y], [q, y]])).join(''));
  }
  const MH = BF.MEM.h;   /* толщина бислоя */
  /* замкнутый компартмент из бислоя по точкам (носитель, цистерна, эндосома) с заливкой просвета */
  function closedMem(pts, fill = C.lumen, g = null) {
    const d = 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' Z';
    return G(g, `<path d="${d}" fill="${fill}"/>` + BF.bilayerPts(pts, { closed: true }));
  }
  const roundRectPts = (x, y, w, h, r, n = 8) => {
    const P = [], arc = (cx, cy, a0) => { for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; P.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
    arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI); return P;
  };
  const circlePts = (cx, cy, R, n = 48) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  /* носитель (транспортный пузырёк) из бислоя; coat — 'copii' | 'copi' | 'clath' | null — оболочка снаружи (цитозольная сторона) */
  function carrier(cx, cy, R = 18, coat = null, inner = '', g = 'carrier') {
    let s = closedMem(circlePts(cx, cy, R), C.lumen) + inner;
    /* интеграция (агенты t2, t3, a34): BF.coatRing сам отступает от бислоя — радиус носителя R без добавки; группа справки ретромера — retromer */
    if (coat) s += G(coat === 'retro' ? 'retromer' : coat, BF.coatRing(cx, cy, R, C[coat] || coat, Math.max(10, Math.round(R * .7))));
    return G(g, s);
  }

  /* ---------- синтез: рибосома, мРНК, цепь (вкладка 1) */
  /* рибосома: большая субъединица сверху (выход туннеля — к мембране), малая снизу на мРНК; возвращает точку выхода туннеля */
  function ribosome(cx, cy, k = 1, o = {}) {
    const s = `<ellipse cx="${f(cx)}" cy="${f(cy - 13 * k)}" rx="${f(30 * k)}" ry="${f(19 * k)}" fill="${C.riboL}"/>` +
      `<ellipse cx="${f(cx)}" cy="${f(cy + 12 * k)}" rx="${f(23 * k)}" ry="${f(11 * k)}" fill="${C.riboS}"/>` +
      (o.slow ? `<circle cx="${f(cx + 26 * k)}" cy="${f(cy - 26 * k)}" r="${f(7 * k)}" fill="#fff" stroke="${C.warn}" stroke-width="1.6"/>` + line(cx + 26 * k, cy - 30 * k, cx + 26 * k, cy - 26 * k, C.warn, 1.6) + line(cx + 26 * k, cy - 26 * k, cx + 29 * k, cy - 24 * k, C.warn, 1.6) : '');
    return { s: G(o.g || 'ribo', s), x: cx, y: cy - 32 * k, mrnaY: cy + 22 * k };
  }
  /* мРНК: горизонтальная линия с засечками */
  function mrna(x0, x1, y, g = 'mrna') {
    let s = line(x0, y, x1, y, C.mrna, 3.2);
    for (let x = x0 + 6; x < x1; x += 10) s += line(x, y, x, y + 5, C.mrna, 1.6);
    return G(g, s);
  }
  /* растущая цепь по точкам pts (от рибосомы к N-концу); o.sig — доля длины у N-конца, закрашенная как сигнал (0 — нет);
     o.sigG — группа справки сигнала; o.wave — амплитуда волны (0 — прямая); o.col — цвет; o.dash — штрих (белок вне пути) */
  function chain(pts, o = {}) {
    const amp = o.wave == null ? 3.2 : o.wave, wl = 14, col = o.col || C.chain, w = o.w || 3.2;
    const seg = []; let L = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
    const at = l => { let i = 0; while (i < seg.length - 1 && l > seg[i]) { l -= seg[i]; i++; } const u = seg[i] ? Math.min(1, l / seg[i]) : 0, a = pts[i], b = pts[i + 1]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, (b[0] - a[0]) / (seg[i] || 1), (b[1] - a[1]) / (seg[i] || 1)]; };
    const path = (l0, l1) => { const q = []; for (let l = l0; l <= l1 + .01; l += 1.5) { const [x, y, tx, ty] = at(Math.min(l, L)); const off = Math.sin(l / wl * 2 * Math.PI) * amp; q.push(f(x - ty * off) + ',' + f(y + tx * off)); } return 'M' + q.join(' L'); };
    const P = (d, c) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
    const ls = L * (1 - (o.sig || 0));
    let s = G(o.g || 'chain', P(path(0, ls), col));
    if (o.sig) s += G(o.sigG || 'sig', P(path(ls, L), C.sig));
    return s;
  }
  /* SRP: частица с гидрофобным карманом (зелёная), k — масштаб */
  const srp = (cx, cy, k = 1, g = 'srp') => G(g, `<path d="M${f(cx - 26 * k)},${f(cy + 6 * k)} C${f(cx - 26 * k)},${f(cy - 15 * k)} ${f(cx - 6 * k)},${f(cy - 17 * k)} ${f(cx)},${f(cy - 5 * k)} C${f(cx + 6 * k)},${f(cy - 17 * k)} ${f(cx + 26 * k)},${f(cy - 15 * k)} ${f(cx + 26 * k)},${f(cy + 6 * k)} C${f(cx + 17 * k)},${f(cy + 15 * k)} ${f(cx - 17 * k)},${f(cy + 15 * k)} ${f(cx - 26 * k)},${f(cy + 6 * k)} Z" fill="${C.srp}" stroke="#1B5E3A" stroke-width="1"/>`);
  /* рецептор SRP: две цепи в мембране (y — середина бислоя), головка в цитозоле (снизу) */
  const srpR = (x, y, g = 'srpr') => G(g, `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 2)}" width="12" height="${f(MH + 4)}" rx="3" fill="${C.srpr}"/>` +
    `<path d="M${f(x - 16)},${f(y + MH / 2 + 4)} Q${f(x)},${f(y + MH / 2 + 22)} ${f(x + 16)},${f(y + MH / 2 + 4)}" fill="none" stroke="${C.srpr}" stroke-width="6" stroke-linecap="round"/>`);
  /* транслокон Sec61: две половины поперёк мембраны (y — середина бислоя); o.open — канал открыт; o.plug — пробка закрывает канал
     (со стороны просвета); o.gate — латеральные ворота приоткрыты (сигнал уходит в бислой справа); o.off — звено выключено */
  function sec61(x, y, o = {}) {
    const gap = o.open ? 12 : 4, w = 13, h = MH + 14, y0 = y - h / 2, col = o.off ? C.grey : C.sec61;
    let s = `<rect x="${f(x - gap / 2 - w)}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>` +
      `<rect x="${f(x + gap / 2 + (o.gate ? 4 : 0))}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>`;
    if (o.plug) s += G('plug', `<rect x="${f(x - gap / 2 - 2)}" y="${f(y0 + 1)}" width="${f(gap + 4)}" height="7" rx="3" fill="${C.plug}" stroke="${col}" stroke-width="1"/>`);
    return G('sec61', s) + (o.off ? cross(x, y0 - 12, 7) : '');
  }
  /* сигнальная пептидаза: белок мембраны с активным центром со стороны просвета (сверху); o.off — нет фермента (штрих) */
  function spase(x, y, o = {}) {
    if (o.off) return G('spase', `<rect x="${f(x - 7)}" y="${f(y - MH / 2 - 14)}" width="14" height="${f(MH + 14)}" rx="4" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>`) + cross(x, y - MH / 2 - 20, 6);
    return G('spase', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 4)}" width="12" height="${f(MH + 8)}" rx="3" fill="${C.spase}"/>` +
      `<path d="M${f(x - 9)},${f(y - MH / 2 - 16)} L${f(x)},${f(y - MH / 2 - 6)} L${f(x + 9)},${f(y - MH / 2 - 16)}" fill="none" stroke="${C.spase}" stroke-width="3.2" stroke-linecap="round"/>`);
  }

  /* ---------- гликаны и метка (условные знаки, без формул) */
  const sq = (x, y, u, c = C.glcnac) => `<rect x="${f(x - u / 2)}" y="${f(y - u / 2)}" width="${f(u)}" height="${f(u)}" fill="${c}"/>`;
  const ci = (x, y, u, c = C.man) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u / 2)}" fill="${c}"/>`;
  const tri = (x, y, u, c = C.glc) => `<path d="M${f(x)},${f(y - u * .55)} L${f(x + u * .55)},${f(y + u * .45)} L${f(x - u * .55)},${f(y + u * .45)} Z" fill="${c}"/>`;
  const pmark = (x, y, u) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u * .62)}" fill="${C.phos}"/>` + `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(u * .85)}" font-weight="800" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">P</text>`;
  /* N-гликан на аспарагине в точке (x, y), растёт в сторону dir (−1 — вверх). o.glc — число глюкоз (0–3); o.trim — маннозы укорочены
     (сигнал к удалению); o.p — метка M6P ('P' на маннозе) | 'glcnacP' — промежуточная (GlcNAc-P на маннозе); o.complex — сложный
     (аппарат Гольджи: концевые ветви другими знаками); u — размер знака */
  function glycan(x, y, dir = -1, o = {}, g = 'glycan') {
    const u = o.u || 7, st = u * 1.35, Y = i => y + dir * st * i;
    let s = line(x, y, x, Y(3), '#555', 1.4) + line(x, Y(3), x - st, Y(4), '#555', 1.4) + line(x, Y(3), x + st, Y(4), '#555', 1.4);
    s += sq(x, Y(1), u) + sq(x, Y(2), u) + ci(x, Y(3), u);
    if (o.complex) { s += sq(x - st, Y(4), u, '#6B8E23') + sq(x + st, Y(4), u, '#6B8E23') + ci(x - st, Y(5), u * .9, '#E8B4C8') + ci(x + st, Y(5), u * .9, '#E8B4C8'); return G(g, s); }
    s += ci(x - st, Y(4), u) + ci(x + st, Y(4), u);
    if (!o.trim) { s += line(x - st, Y(4), x - st, Y(5), '#555', 1.2) + ci(x - st, Y(5), u); }
    for (let i = 0; i < (o.glc || 0); i++) s += tri(x - st, Y(6 + i), u);
    if (o.p) {
      const px = x + st + u * .9, py = Y(4) + dir * u * .5;
      s += line(x + st, Y(4), px, py, '#555', 1.2);
      if (o.p === 'glcnacP') s += sq(px + u * 1.1, py + dir * u * .5, u * .9) + G('m6p', pmark(px, py, u)); else s += G('m6p', pmark(px, py, u));
    }
    return G(g, s);
  }

  /* ---------- шапероны, контроль качества, удаление */
  const bip = (x, y, k = 1, g = 'bip') => G(g, `<path d="M${f(x - 12 * k)},${f(y - 9 * k)} A13,13 0 1 0 ${f(x + 12 * k)},${f(y - 9 * k)}" fill="none" stroke="${C.chap}" stroke-width="${f(6 * k)}" stroke-linecap="round"/>`);
  const pdi = (x, y, g = 'pdi') => G(g, `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7" fill="${C.pdi}"/>`);   /* интеграция (агент t2): без текста 7,5 px — подпись PDI ставит сцена */
  /* калнексин: белок мембраны ЭПР (y — середина бислоя) с лектиновой головкой в просвете (сверху) */
  const calnexin = (x, y, g = 'cnx') => G(g, `<rect x="${f(x - 4)}" y="${f(y - MH / 2 - 2)}" width="8" height="${f(MH + 4)}" rx="3" fill="${C.chap}"/>` +
    line(x, y - MH / 2 - 2, x, y - MH / 2 - 16, C.chap, 3) + `<path d="M${f(x - 14)},${f(y - MH / 2 - 16)} A14,10 0 0 1 ${f(x + 14)},${f(y - MH / 2 - 16)} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
  /* убиквитин: цепочка из n малых кружков */
  const ub = (x, y, n = 4, dx = 7, g = 'ub') => G(g, Array.from({ length: n }, (_, i) => `<circle cx="${f(x + i * dx)}" cy="${f(y - (i % 2) * 3)}" r="3.4" fill="${C.ub}"/>`).join(''));
  /* протеасома: бочонок в цитозоле */
  const proteasome = (x, y, g = 'prot') => G(g, [0, 1, 2, 3].map(i => `<rect x="${f(x - 16)}" y="${f(y - 20 + i * 10)}" width="32" height="9" rx="4" fill="${i % 3 ? C.protL : C.prot}"/>`).join(''));
  /* канал удаления (ERAD) в мембране ЭПР */
  const eradCh = (x, y, g = 'erad_ch') => G(g, `<rect x="${f(x - 14)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/><rect x="${f(x + 4)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/>`);

  /* ---------- мембранные белки (в бислое) */
  /* однопроходный белок: трансмембранный сегмент в бислое (y — середина), N-домен (глобула) с одной стороны, C-хвост с другой.
     o.inv — обратная ориентация (N-домен в цитозоле, A4); o.col; o.dom — размер домена; o.lig — связан лиганд; o.bad — участок связывания
     не сформирован (штриховой контур); o.glyc — гликан на N-домене; возвращает и точку N-домена */
  function tmProt(x, y, o = {}) {
    const up = o.inv ? 1 : -1, col = o.col || C.ldlr, r = o.dom || 13, ny = y + up * (MH / 2 + 8 + r);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>`;
    s += line(x, y + up * (MH / 2 + 2), x, ny - up * r, col, 3);
    s += `<circle cx="${f(x)}" cy="${f(ny)}" r="${r}" fill="${o.bad ? '#fff' : col}" stroke="${col}" stroke-width="2"${o.bad ? ' stroke-dasharray="4 3"' : ''}/>`;
    const tailEnd = y - up * (MH / 2 + 18);
    s += `<path d="M${f(x)},${f(y - up * (MH / 2 + 2))} Q${f(x + 8)},${f((y - up * (MH / 2) + tailEnd) / 2)} ${f(x + 2)},${f(tailEnd)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;
    if (o.glyc) s += glycan(x + r - 2, ny + up * (r - 2), up, { u: 5 });
    if (o.lig) s += G('ligand', `<path d="M${f(x - 8)},${f(ny + up * (r + 2))} L${f(x)},${f(ny + up * (r + 14))} L${f(x + 8)},${f(ny + up * (r + 2))} Z" fill="${C.lig}"/>`);
    return { s: G(o.g || 'tm', s), nx: x, ny };
  }
  /* рецептор M6P: белок мембраны (y — середина) с карманом связывания со стороны просвета (сверху; dir=-1) */
  function m6pr(x, y, dir = -1, o = {}) {
    const col = o.off ? C.grey : C.m6pr, hy = y + dir * (MH / 2 + 12);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>` +
      `<path d="M${f(x - 10)},${f(hy + dir * 6)} L${f(x - 10)},${f(hy)} Q${f(x)},${f(hy - dir * 8)} ${f(x + 10)},${f(hy)} L${f(x + 10)},${f(hy + dir * 6)}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
