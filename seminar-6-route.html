<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-6.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Клеточный цикл, деление клетки и её гибель</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-cycle-phases"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 1 из 31</div><h2>Из каких фаз состоит клеточный цикл и что происходит в каждой?</h2><p class="lead"><a href="#ns-g-S6-T01">Клеточный цикл</a> — последовательность событий от образования клетки при делении до её собственного деления. Главные задачи цикла — один раз удвоить всю ДНК хромосом и распределить копии поровну между двумя дочерними клетками.</p><div class="note"><strong>Что показывает схема.</strong> Кольцо G1 → S → G2 → M с ответвлением в G0; количество ДНК по фазам: 2c → 2c…4c → 4c</div><ol class="mech"><li>Цикл делят на <a href="#ns-g-S6-T02">интерфазу</a> и <a href="#ns-g-S6-T06">фазу M</a>. Интерфаза состоит из трёх фаз. В <a href="#ns-g-S6-T03">фазе G1</a> клетка растёт, синтезирует РНК и белки и при наличии внешних сигналов роста — <a href="#ns-g-S6-T11">митогенов</a> — готовится к удвоению ДНК. В <a href="#ns-g-S6-T04">фазе S</a> ДНК каждой хромосомы удваивается, и хромосома состоит теперь из двух <a href="#ns-g-S6-T21">сестринских хроматид</a>; примерно в то же время начинает удваиваться <a href="#ns-g-S6-T20">центросома</a>. В <a href="#ns-g-S6-T05">фазе G2</a> клетка продолжает расти и готовит структуры деления. Фаза M включает митоз — разделение ядра — и цитокинез — разделение цитоплазмы. Клетка может выйти из цикла, обычно из G1, в <a href="#ns-g-S6-T07">состояние покоя G0</a>.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> вспомнить БИО-2·5 («Откуда растут микротрубочки: центросома, центриоли и другие центры организации»)</p><p>В типичной клетке млекопитающих в культуре цикл длится около 24 часов; S-фаза занимает 10–12 часов, фаза M — около часа. Самая изменчивая по длительности фаза — G1: её продолжительность сильно зависит от внешних сигналов. Количество ДНК в <a href="#ns-g-S6-T96">ядре</a> меняется по фазам: в G1 — 2c, в S — от 2c до 4c, в G2 и в начале митоза — 4c (c — количество ДНК гаплоидного набора; подробнее — БИО-6·16). Большинство клеток нашего тела находится в G0. Одни из них, например клетки печени, при повреждении ткани возвращаются в цикл, другие, например большинство нейронов, не делятся никогда: в них система управления циклом разобрана.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.1: по количеству ДНК в ядре определить фазу.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Цикл изображают кругом, но фазы неравны по длительности, а покой G0 — не пятая фаза цикла, а выход из него.</p><div class="static-quiz"><h3>В ядре клетки 4c ДНК, хромосомы не конденсированы, ядерная оболочка не разобрана. В какой фазе клетка?</h3><ol><li><b>А.</b> В фазе G2 <i>(верный вариант)</i><br><span class="expl">Да: ДНК уже удвоена, а признаков митоза ещё нет</span></li><li><b>Б.</b> В фазе G1 <i>(неверный вариант)</i><br><span class="expl">В G1 ДНК ещё не удвоена: 2c</span></li><li><b>В.</b> В метафазе митоза <i>(неверный вариант)</i><br><span class="expl">В метафазе хромосомы конденсированы, а ядерной оболочки нет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: длительности фаз показаны для типичной делящейся клетки млекопитающих в культуре.</p></details></article><article class="card print-unit" id="ns-cyclin-cdk"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 2 из 31</div><h2>Как комплексы циклин-CDK задают порядок фаз?</h2><p class="lead">Главные события цикла запускает фосфорилирование белков <a href="#ns-g-S6-T09">циклинзависимыми киназами (CDK)</a>. Сама киназа активна, только если с ней связан белок-активатор — <a href="#ns-g-S6-T08">циклин</a>.</p><div class="note"><strong>Что показывает схема.</strong> Четыре волны активности: D в G1, E на G1/S, A в S–G2, B на G2/M</div><ol class="mech"><li>Количество CDK в клетке почти не меняется на протяжении цикла, а количество циклинов то растёт, то падает. Поэтому меняется прежде всего активность комплексов. У человека в G1 работает комплекс циклин D–CDK4/6, он появляется в ответ на митогены; на границе G1/S — циклин E–CDK2; в S и G2 — циклин A–CDK2; вход в митоз запускает циклин B–CDK1. Каждый комплекс фосфорилирует свой набор белков-мишеней: циклин E–CDK2 проводит клетку через границу G1/S и запускает удвоение центросомы, циклин A–CDK2 запускает удвоение ДНК, циклин B–CDK1 — сборку веретена, разборку <a href="#ns-g-S6-T44">ядерной ламины</a> и конденсацию хромосом. Кроме циклина, активность комплекса определяют фосфорилирование самой CDK и белки — <a href="#ns-g-S6-T10">ингибиторы CDK</a>.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·1</p><p>Пример: на входе в митоз циклин B–CDK1 накапливается в G2 в неактивной форме, потому что CDK1 несёт тормозящую фосфатную группу. Когда фосфатаза её снимает, активный комплекс усиливает собственную активацию, и активность за короткое время резко возрастает — клетка входит в митоз сразу, а не постепенно.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.2: какой комплекс нужен для какого перехода.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Распределение комплексов по фазам учебное: комплексы перекрываются по времени, а циклин A работает и с CDK1 в начале митоза.</p><div class="static-quiz"><h3>Почему количество CDK в клетке почти постоянно, а её активность меняется по фазам?</h3><ol><li><b>А.</b> CDK синтезируется заново в каждой фазе <i>(неверный вариант)</i><br><span class="expl">Количество CDK почти постоянно; меняется количество циклинов</span></li><li><b>Б.</b> Активность зависит от связанного циклина <i>(верный вариант)</i><br><span class="expl">Да: без циклина киназа неактивна, а количество циклинов меняется по фазам</span></li><li><b>В.</b> CDK работает только в ядре <i>(неверный вариант)</i><br><span class="expl">Место киназы не объясняет изменения её активности по фазам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: кривые активности условны, высота пиков не измерена.</p></details></article><article class="card print-unit" id="ns-irreversible-transitions"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 3 из 31</div><h2>Почему клетка не возвращается в предыдущую фазу?</h2><p class="lead">Переходы цикла направлены в одну сторону. Это обеспечивают два механизма: регулируемое разрушение белков и <a href="#ns-g-S6-T18">положительная обратная связь</a>.</p><div class="note"><strong>Что показывает схема.</strong> Переключатель G1 и разрушение циклина делают переходы однонаправленными</div><ol class="mech"><li>Убиквитинлигазы цикла метят циклины и другие регуляторы <a href="#ns-g-S6-T92">цепью убиквитина</a>, и протеасома их разрушает. <a href="#ns-g-S6-T17">Убиквитинлигаза SCF</a> разрушает регуляторы G1 и границы G1/S, а <a href="#ns-g-S6-T16">комплекс стимуляции анафазы (APC/C)</a> в митозе метит секурин и циклин B. После разрушения циклина комплекс предыдущей фазы распадается, и его активность сама собой не восстанавливается: для этого нужен новый синтез циклина. Положительная обратная связь работает так: активный комплекс усиливает собственную активацию или синтез собственного циклина, поэтому активность возрастает скачком. В G1 такой переключатель — <a href="#ns-g-S6-T12">точка рестрикции</a>: после неё клетка входит в S-фазу и тогда, когда митоген уже убран.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·2; вспомнить БИО-5·2 («Как к белку присоединяется убиквитин: ферменты E1, E2 и E3») и БИО-5·4 («Как 26S-протеасома узнаёт, разворачивает и разрушает белок?»)</p><p>Пример: если митоген убрать из среды в начале G1, клетка не входит в S и переходит в покой G0. Если его убрать после точки рестрикции, клетка проходит S, G2 и M в обычные сроки: ключевой переход уже произошёл. Так цикл отличается от таймера: переход происходит не через фиксированное время, а когда выполнены условия и сработал переключатель.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.3: митоген убран до и после точки рестрикции.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Обратная связь показана одной петлёй; в клетке их несколько, они разбираются в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Митоген убрали из среды через несколько часов после того, как клетка прошла точку рестрикции. Что произойдёт?</h3><ol><li><b>А.</b> Клетка вернётся из S-фазы в G1 <i>(неверный вариант)</i><br><span class="expl">Возврата в G1 нет: регуляторы G1 уже разрушены</span></li><li><b>Б.</b> Клетка погибнет без митогена <i>(неверный вариант)</i><br><span class="expl">Митоген управляет делением, а не выживанием; здесь цикл просто продолжится</span></li><li><b>В.</b> Клетка завершит цикл и разделится <i>(верный вариант)</i><br><span class="expl">Да: после точки рестрикции вход в S-фазу от митогена уже не зависит</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: петли обратной связи и разрушение циклина показаны условными знаками.</p></details></article><article class="card print-unit" id="ns-checkpoints"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 4 из 31</div><h2>Что проверяют контрольные точки цикла?</h2><p class="lead"><a href="#ns-g-S6-T13">Контрольная точка</a> — механизм, который задерживает следующий переход цикла, пока не выполнено условие: ДНК не повреждена, удвоение завершено, хромосомы правильно прикреплены к веретену.</p><div class="note"><strong>Что показывает схема.</strong> Три перехода и условия, которые на них проверяются; исполнители — CDK и APC/C</div><ol class="mech"><li>Главных переходов, на которых действуют контрольные точки, три. Переход G1/S задерживается при повреждении ДНК и без сигналов роста: удвоение повреждённой ДНК закрепило бы ошибку. Переход G2/M задерживается при повреждении ДНК и при неполной репликации: делить незавершённые или разорванные хромосомы нельзя. Переход от метафазы к анафазе задерживает контрольная точка сборки веретена (БИО-6·12), пока хотя бы одна хромосома не прикреплена. Действуют контрольные точки через общие регуляторы: на переходах G1/S и G2/M они тормозят комплексы циклин-CDK, при переходе к анафазе — APC/C.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·2, БИО-6·3</p><p>Важно различать датчик и исполнителя: датчик узнаёт повреждение или неприкреплённый кинетохор, а исполнитель тормозит переход. Если механизм контрольной точки выключен, переход происходит вовремя, но дефект переходит в митоз: повреждённая ДНК — в дочерние клетки, а неудвоенный участок связывает сестринские хроматиды, и в анафазе хромосома разрывается. Клетки, которые не могут завершить митоз из-за повреждения ДНК, нарушений веретена или отказа контрольных точек, устраняет механизм, называемый <a href="#ns-g-S6-T79">митотической катастрофой</a>: такие клетки погибают или необратимо перестают делиться.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, конструктор: «выключить контрольную точку» при неполной репликации и при повреждении ДНК в G2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Иногда выделяют больше контрольных точек (например, отдельные точки для G1, S и G2); здесь они сгруппированы по трём переходам. Срабатывание зависит от силы сигнала и типа клетки.</p><div class="static-quiz"><h3>Удвоение ДНК не завершено, контрольные точки работают. Где задержится цикл и сколько ДНК будет в ядре?</h3><ol><li><b>А.</b> Перед митозом; от 2c до 4c <i>(верный вариант)</i><br><span class="expl">Да: вход в митоз запрещён, а удвоение прошло лишь частично</span></li><li><b>Б.</b> Перед S-фазой; ДНК ещё 2c <i>(неверный вариант)</i><br><span class="expl">Клетка уже в S: удвоение началось, но не закончилось</span></li><li><b>В.</b> В анафазе; 4c <i>(неверный вариант)</i><br><span class="expl">Клетка не войдёт в митоз, пока удвоение не завершится</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li><li><a href="https://doi.org/10.1038/s41418-017-0012-4">Galluzzi L., Vitale I., Aaronson S.A., et al. Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018. Cell Death Differ. 2018;25(3):486–541</a></li></ul><p>Схема качественная: три перехода и условия, которые на них проверяются.</p></details></article><article class="card print-unit" id="ns-delay-not-death"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 5 из 31</div><h2>Повреждение ДНК: задержка цикла — ещё не гибель</h2><p class="lead">При повреждении ДНК цикл останавливается до того, как повреждение перейдёт в новые копии ДНК или в дочерние клетки. Остановка даёт время для <a href="#ns-g-S6-T19">репарации ДНК</a>.</p><div class="note"><strong>Что показывает схема.</strong> Две ветви ответа: перед S — p53 → p21; перед митозом — торможение фосфатазы, активирующей CDK1; три исхода</div><ol class="mech"><li><a href="#ns-g-S6-T93">Повреждение ДНК</a> узнают белки-датчики. В ответ в клетке накапливается белок <a href="#ns-g-S6-T14">p53</a>: в норме он быстро разрушается, а при повреждении становится устойчивым. p53 — фактор транскрипции; он включает синтез <a href="#ns-g-S6-T15">белка p21</a>, ингибитора CDK. p21 тормозит комплексы циклин E–CDK2 и циклин A–CDK2 и задерживает клетку перед S-фазой. Перед митозом задержку вызывает в основном другая ветвь ответа: сигнальные киназы тормозят фосфатазу, которая снимает тормозящую фосфатную группу с CDK1, и циклин B–CDK1 не активируется (БИО-6·2). Дальше возможны разные исходы. Если повреждение исправлено, p53 снова разрушается, торможение снимается, и цикл продолжается. Если повреждение не исправлено, остановка может стать необратимой — <a href="#ns-g-S6-T80">сенесценция (клеточное старение)</a>, — или клетка погибает путём <a href="#ns-g-S6-T64">апоптоза</a> (БИО-6·26).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·4</p><p>Поэтому по одному наблюдению «клетка не делится» нельзя сказать, погибнет ли она: задержка, покой G0, необратимая остановка и гибель — разные состояния с разными признаками. В задержанной клетке мембрана не повреждена, каспазы не активны, а количество ДНК указывает переход, на котором стоит цикл: 2c — перед S, 4c — перед митозом.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 1, шаг 1.4 (повреждение в G2) и продвинутый уровень A1.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Обе ветви ответа даны в упрощённом виде, без названий киназ; другие пути ответа на повреждение и их динамика разбираются в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Через сутки после действия вещества, повреждающего ДНК, клетки культуры не делятся, их мембраны не повреждены, каспазы не активны, в ядрах 4c ДНК. Какой вывод допустим?</h3><ol><li><b>А.</b> Клетки погибают путём апоптоза <i>(неверный вариант)</i><br><span class="expl">При апоптозе активны каспазы; здесь их активности нет</span></li><li><b>Б.</b> Цикл задержан перед митозом <i>(верный вариант)</i><br><span class="expl">Да: ДНК удвоена, признаков гибели нет; циклин B–CDK1 не активирован</span></li><li><b>В.</b> Клетки вышли в покой G0 <i>(неверный вариант)</i><br><span class="expl">В G0 клетка выходит из G1 с 2c ДНК, а здесь ДНК удвоена</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: последовательность событий — учебное деление непрерывного процесса.</p></details></article><article class="card print-unit" id="ns-transition-permission"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 6 из 31</div><h2>Переход разрешают условия, а не время: модель машины состояний</h2><p class="lead">Сверх программы. Учебная модель: время разбито на условные интервалы; в каждом интервале модель проверяет, выполнены ли условия перехода в следующую фазу.</p><div class="note"><strong>Что показывает схема.</strong> Временная шкала фаз для пяти сценариев с отметкой ожидания</div><ol class="mech"><li>Правила модели. В G1 клетка растёт на 1 условную единицу (у.е.) за интервал, пока есть ростовой сигнал; при росте 6 у.е. пройдена точка рестрикции. Без сигнала до этого момента клетка переходит в покой G0. Переход в S разрешён после точки рестрикции, если нет контрольного сигнала повреждения. Удвоение ДНК занимает 6 интервалов. G2 длится не меньше 2 интервалов; переход в M разрешён, если удвоение завершено и нет контрольного сигнала. Митоз занимает 2 интервала. Без помех клетка входит в S на 7-м интервале и делится к концу 16-го. Если клетка растёт вдвое быстрее, G1 короче, и деление наступает к концу 13-го интервала: длина цикла зависит от готовности, а не от часов.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·3, БИО-6·4, БИО-6·5</p><p>Повреждение ДНК в G2 на интервалах 13–16 при работающей контрольной точке задерживает вход в митоз на 3 интервала; деление наступает к концу 19-го интервала. Если контрольная точка выключена, клетка делится вовремя, к концу 16-го интервала, но с неустранённым повреждением. Если повреждение не устраняется, клетка остаётся перед митозом до конца наблюдения; модель не показывает, погибнет ли она: это другой процесс. Ростовой сигнал, убранный на 4-м интервале, переводит клетку в G0, а убранный на 9-м интервале, уже после точки рестрикции, не меняет сроков деления. &lt;b&gt;Обратная задача.&lt;/b&gt; Деление наступило на 3 интервала позже обычного. Совместимы две причины — повреждение в G1 и повреждение в G2 при работающей контрольной точке (замедленное удвоение даёт опоздание на 4 интервала); различить их помогает, где стояла клетка: перед S с 2c или перед митозом с 4c.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Пороги и длительности — допущения модели, а не измеренные величины; в клетке переходы определяются активностью комплексов циклин-CDK, а контрольная точка действует и внутри S-фазы.</p><div class="static-quiz"><h3>В модели клетка растёт вдвое быстрее, остальные условия обычные. Что изменится?</h3><ol><li><b>А.</b> Ничего не изменится: цикл идёт по часам <i>(неверный вариант)</i><br><span class="expl">В модели переход разрешает выполненное условие, а не прошедшее время</span></li><li><b>Б.</b> Удлинится S-фаза <i>(неверный вариант)</i><br><span class="expl">Скорость роста не меняет длительности удвоения ДНК</span></li><li><b>В.</b> Укоротится G1, деление наступит раньше <i>(верный вариант)</i><br><span class="expl">Да: порог готовности достигается быстрее; S, G2 и M не меняются</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Учебная модель · условные интервалы и единицы; пороги и длительности — допущения, а не измеренные величины.</p></details></article><article class="card print-unit" id="ns-cdk-activity-order"><div class="eyebrow">Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки · шаг 7 из 31</div><h2>Нужны ли разные циклины для удвоения ДНК и для митоза?</h2><p class="lead">Сверх программы. В учебниках разным фазам соответствуют разные комплексы циклин-CDK. Значит ли это, что каждый комплекс умеет только «свою» работу?</p><div class="note"><strong>Что показывает схема.</strong> Порядок событий цикла задаётся в основном общей активностью CDK</div><ol class="mech"><li>Работа на делящихся дрожжах сравнила два комплекса — с циклином фазы S и с циклином митоза — в клетках, где своя CDK была выключена. Оказалось, что около двух третей из 280 изученных участков фосфорилирования в белках-мишенях оба комплекса фосфорилировали одинаково; лишь около 4 % участков комплекс фазы S почти не фосфорилировал. Комплекс фазы S запускал начало митоза, но не мог его завершить. Если же у полюса веретена убирали фосфатазу, снимающую фосфатные группы с мишеней CDK, комплекс фазы S проводил клетку через весь митоз и деление.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·2, БИО-6·3</p><p>Отсюда вывод работы: порядок событий цикла задаётся прежде всего ростом общей активности CDK — ранним событиям достаточно меньшей активности, поздним нужна большая, — и лишь отчасти различиями между циклинами.</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Таблица «циклин — фаза» верна как описание того, какой комплекс обычно работает в какой фазе, но разные комплексы отчасти взаимозаменяемы. &lt;b&gt;Как это узнали.&lt;/b&gt; В клетках дрожжей заменяли собственную CDK искусственными комплексами одного или другого циклина и измеряли, какие белки и насколько они фосфорилируют по мере роста их количества.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Работа выполнена на делящихся дрожжах; у человека комплексов больше, и степень их взаимозаменяемости может быть иной.</p><div class="static-quiz"><h3>Комплекс с циклином фазы S начал митоз, но не завершил его. При каком условии он проводил клетку через весь митоз?</h3><ol><li><b>А.</b> Если убрать фосфатазу у полюса веретена <i>(верный вариант)</i><br><span class="expl">Да: тогда его активности хватало для фосфорилирования всех нужных белков</span></li><li><b>Б.</b> Если добавить второй циклин фазы S <i>(неверный вариант)</i><br><span class="expl">В работе решающим было снятие противодействия фосфатазы</span></li><li><b>В.</b> Ни при каком: митоз требует только циклина B <i>(неверный вариант)</i><br><span class="expl">Работа показала обратное: при убранной фосфатазе митоз завершался</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-022-04798-8">Basu S., Greenwood J., Jones A.W., Nurse P. Core control principles of the eukaryotic cell cycle. Nature. 2022;607(7918):381–386</a></li></ul><p>Схема по данным работы, упрощённая: доли участков фосфорилирования округлены.</p></details></article><article class="card print-unit" id="ns-mitotic-chromosome"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 8 из 31</div><h2>Как устроена хромосома перед делением?</h2><p class="lead">После S-фазы каждая <a href="#ns-g-S6-T45">хромосома</a> состоит из двух <a href="#ns-g-S6-T21">сестринских хроматид</a> — двух одинаковых молекул ДНК с белками. В интерфазе они представлены деконденсированным <a href="#ns-g-S6-T85">хроматином</a> и не видны под световым микроскопом.</p><div class="note"><strong>Что показывает схема.</strong> Хромосома от интерфазы до метафазы: когезин, конденсин, кинетохоры</div><ol class="mech"><li>Сестринские хроматиды удерживает вместе белковый комплекс <a href="#ns-g-S6-T24">когезин</a>: его кольца охватывают обе молекулы ДНК сразу после их удвоения в S-фазе. В начале митоза другой комплекс — <a href="#ns-g-S6-T25">конденсин</a> — складывает каждую хроматиду в плотный стержень; при этом большая часть когезина с плеч хромосом удаляется, а в области <a href="#ns-g-S6-T22">центромеры</a> сохраняется. На центромере каждой хроматиды собирается <a href="#ns-g-S6-T23">кинетохор</a> — крупный белковый комплекс, к которому прикрепляются микротрубочки веретена. У хромосомы перед делением два кинетохора, обращённых в противоположные стороны.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·1; вспомнить БИО-3·23 («Как устроены ядерная оболочка и ядерная пора»)</p><p>Хромосомы конденсируются в <a href="#ns-g-S6-T31">профазе</a>; тогда же исчезают <a href="#ns-g-S6-T84">ядрышки</a>, а <a href="#ns-g-S6-T83">ядерная оболочка</a> разбирается в прометафазе после фосфорилирования ламины (БИО-3, `envelope-pore`). Именно когезин делает две хроматиды одной хромосомой: пока он не расщеплён, их считают за одну хромосому, а при подсчёте хромосом считают центромеры (БИО-6·16).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, схема: хромосома с двумя кинетохорами и когезином.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Число колец когезина и витков хроматина на схеме условно.</p><div class="static-quiz"><h3>Сколько кинетохоров у одной хромосомы в метафазе митоза?</h3><ol><li><b>А.</b> Один — на центромере хромосомы <i>(неверный вариант)</i><br><span class="expl">Центромера одна, но кинетохор собирается на каждой из двух хроматид</span></li><li><b>Б.</b> Два — по одному на каждой хроматиде <i>(верный вариант)</i><br><span class="expl">Да: два кинетохора обращены к противоположным полюсам</span></li><li><b>В.</b> Четыре — по два на хроматиду <i>(неверный вариант)</i><br><span class="expl">На каждой хроматиде собирается один кинетохор</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема по строению хромосомы, упрощённая: число колец когезина условно.</p></details></article><article class="card print-unit" id="ns-spindle"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 9 из 31</div><h2>Как устроено веретено деления?</h2><p class="lead"><a href="#ns-g-S6-T26">Веретено деления</a> — биполярная структура из микротрубочек и связанных с ними белков. Его полюса в животной клетке образуют две центросомы, удвоенные в интерфазе.</p><div class="note"><strong>Что показывает схема.</strong> Веретено из трёх групп микротрубочек между двумя центросомами</div><ol class="mech"><li>Минус-концы микротрубочек находятся у полюсов, плюс-концы обращены от полюсов; по положению плюс-концов различают три группы микротрубочек. <a href="#ns-g-S6-T27">Кинетохорные микротрубочки</a> прикрепляются плюс-концами к кинетохорам. <a href="#ns-g-S6-T28">Полюсные (интерполярные) микротрубочки</a> от двух полюсов перекрываются у экватора; <a href="#ns-g-S6-T30">моторные белки</a>, связывающие перекрытые участки, раздвигают полюса. <a href="#ns-g-S6-T29">Астральные микротрубочки</a> расходятся от полюсов к коре клетки и задают положение веретена. В митозе динамическая нестабильность микротрубочек резко возрастает: растущие и укорачивающиеся микротрубочки быстро «прощупывают» пространство и находят кинетохоры.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·8; вспомнить БИО-2·5, БИО-2·9 («Динамическая нестабильность: рост, катастрофа, укорочение, спасение») и БИО-2·16 («Моторный белок: как энергия АТФ превращается в шаг»)</p><p>Веретено может собраться и без центросом — вокруг хромосом, как в ооцитах человека (БИО-6·21), — но тогда его полюса менее упорядочены. Вещества, разрушающие микротрубочки, например колхицин, останавливают клетки в митозе на часы и сутки: без веретена хромосомы не прикрепляются, и переход к анафазе не разрешается.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, конструктор: «вещество, разрушающее микротрубочки».</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; На схеме по несколько микротрубочек каждой группы; в клетке их сотни.</p><div class="static-quiz"><h3>Какие микротрубочки веретена раздвигают его полюса?</h3><ol><li><b>А.</b> Кинетохорные, связанные с хромосомами <i>(неверный вариант)</i><br><span class="expl">Кинетохорные микротрубочки перемещают хромосомы, а не раздвигают полюса</span></li><li><b>Б.</b> Астральные, растущие внутрь ядра <i>(неверный вариант)</i><br><span class="expl">Астральные микротрубочки растут к коре клетки и задают положение веретена</span></li><li><b>В.</b> Полюсные, перекрытые у экватора <i>(верный вариант)</i><br><span class="expl">Да: моторные белки на перекрытых участках раздвигают полюса</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема по строению веретена, упрощённая: число микротрубочек условно.</p></details></article><article class="card print-unit" id="ns-mitosis-phases"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 10 из 31</div><h2>Что происходит в каждой фазе митоза?</h2><p class="lead"><a href="#ns-g-S6-T90">Митоз</a> — разделение ядра, при котором каждая дочерняя клетка получает по одной сестринской хроматиде каждой хромосомы. Его делят на пять фаз.</p><div class="note"><strong>Что показывает схема.</strong> Пять фаз митоза условной клетки 2n = 4</div><ol class="mech"><li>В <a href="#ns-g-S6-T31">профазе</a> хромосомы конденсируются, центросомы расходятся, начинает собираться веретено. В <a href="#ns-g-S6-T32">прометафазе</a> разбирается ядерная оболочка, и микротрубочки получают доступ к кинетохорам; хромосомы движутся к экватору. В <a href="#ns-g-S6-T33">метафазе</a> все хромосомы выстроены в экваториальной плоскости — метафазной пластинке. В <a href="#ns-g-S6-T34">анафазе</a> сестринские хроматиды разделяются и расходятся к полюсам: в анафазе A кинетохорные микротрубочки укорачиваются, и хроматиды подтягиваются к полюсам; в анафазе B полюса раздвигаются. В <a href="#ns-g-S6-T35">телофазе</a> хромосомы деконденсируются, вокруг каждого набора собирается ядерная оболочка, появляются ядрышки. Затем идёт <a href="#ns-g-S6-T36">цитокинез</a> (БИО-6·13).</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·8, БИО-6·9</p><p>Силу, перемещающую хроматиды в анафазе A, создаёт прежде всего укорочение кинетохорных микротрубочек: кинетохор удерживается на разбирающемся плюс-конце; моторные белки вносят дополнительный вклад. Самая длинная фаза митоза обычно прометафаза: она продолжается, пока не прикреплены все хромосомы. В клетках млекопитающих анафаза начинается примерно через 20 минут после того, как прикрепилась последняя хромосома.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шкала этапов.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Фазы — учебное деление непрерывного процесса; границы между ними условны.</p><div class="static-quiz"><h3>В какой фазе митоза ядерной оболочки уже нет, а хромосомы ещё не выстроены на экваторе?</h3><ol><li><b>А.</b> В прометафазе <i>(верный вариант)</i><br><span class="expl">Да: оболочка разобрана, хромосомы прикрепляются и движутся к экватору</span></li><li><b>Б.</b> В поздней профазе <i>(неверный вариант)</i><br><span class="expl">В профазе ядерная оболочка ещё есть</span></li><li><b>В.</b> В анафазе <i>(неверный вариант)</i><br><span class="expl">В анафазе хромосомы уже выстраивались и теперь расходятся к полюсам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная, пять панелей: А — профаза, Б — прометафаза, В — метафаза, Г — анафаза, Д — телофаза.</p></details></article><article class="card print-unit" id="ns-biorientation"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 11 из 31</div><h2>Как хромосома прикрепляется к обоим полюсам?</h2><p class="lead">Правильное прикрепление — <a href="#ns-g-S6-T38">биориентация</a>: кинетохоры двух сестринских хроматид связаны с микротрубочками противоположных полюсов.</p><div class="note"><strong>Что показывает схема.</strong> Три вида прикрепления хромосомы к веретену</div><ol class="mech"><li>Прикрепление идёт методом проб и ошибок. Кинетохор захватывает растущую микротрубочку случайно, и прикрепление сначала бывает неправильным. При <a href="#ns-g-S6-T39">синтелическом прикреплении</a> оба сестринских кинетохора связаны с одним полюсом; при <a href="#ns-g-S6-T40">меротелическом прикреплении</a> один кинетохор связан с микротрубочками обоих полюсов. Правильное прикрепление отличается натяжением: когезин удерживает хроматиды вместе, а микротрубочки двух полюсов тянут их в разные стороны. Ненатянутые прикрепления неустойчивы — киназа у центромеры ослабляет связь кинетохора с микротрубочками, и попытка повторяется; натянутые прикрепления стабилизируются.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·8, БИО-6·9</p><p>Синтелическое прикрепление обычно исправляется до анафазы: пока оно исправляется, у кинетохора временно нет микротрубочек, и анафаза задержана. Меротелическое прикрепление опаснее: кинетохор прикреплён и сигнала не даёт; в анафазе такая хроматида может отстать от остальных — её называют <a href="#ns-g-S6-T97">отстающей хроматидой</a>.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, шаг 2.3; продвинутый уровень A2 — меротелическое прикрепление.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; На схеме одна хромосома; число микротрубочек на кинетохоре условно.</p><div class="static-quiz"><h3>Почему меротелическое прикрепление не задерживает анафазу?</h3><ol><li><b>А.</b> Хромосома при этом не доходит до экватора <i>(неверный вариант)</i><br><span class="expl">Меротелически прикреплённая хромосома может стоять на экваторе</span></li><li><b>Б.</b> Кинетохор прикреплён к микротрубочкам <i>(верный вариант)</i><br><span class="expl">Да: сигнал дают кинетохоры без микротрубочек, а этот кинетохор прикреплён, хотя и к двум полюсам</span></li><li><b>В.</b> Сестринские хроматиды уже разделены <i>(неверный вариант)</i><br><span class="expl">До анафазы хроматиды удерживает когезин</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная, три панели: А — биориентация, Б — синтелическое прикрепление, В — меротелическое прикрепление.</p></details></article><article class="card print-unit" id="ns-sac-separase"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 12 из 31</div><h2>Контрольная точка сборки веретена: что разрешает анафазу?</h2><p class="lead">Сестринские хроматиды расходятся одновременно, когда разрезаны все кольца когезина у центромер. Момент разреза определяет <a href="#ns-g-S6-T41">контрольная точка сборки веретена</a>.</p><div class="note"><strong>Что показывает схема.</strong> Сигнал кинетохора → APC/C → секурин → сепараза → когезин; циклин B → выход</div><ol class="mech"><li>Кинетохор без микротрубочек катализирует образование белкового комплекса, который связывает активатор APC/C и не даёт APC/C работать. Достаточно одного такого кинетохора, чтобы задержать анафазу во всей клетке. Когда прикреплена последняя хромосома, торможение снимается, и APC/C метит убиквитином два белка. Первый — <a href="#ns-g-S6-T42">секурин</a>, ингибитор протеазы <a href="#ns-g-S6-T43">сепаразы</a>: после его разрушения протеасомой сепараза разрезает когезин, и хроматиды расходятся. Второй — циклин B: его разрушение снижает активность CDK1, и клетка выходит из митоза — собираются ядерные оболочки, начинается цитокинез.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·3, БИО-6·11</p><p>Значит, в норме прикрепление и разделение связаны через одно разрешение: пока есть хотя бы один неприкреплённый кинетохор, нет и разделения. Но это разные этапы: если когезин нельзя разрезать, хроматиды не разойдутся и при полностью правильном прикреплении; если контрольная точка выключена, разделение начнётся и при неприкреплённой хромосоме.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, конструктор: «выключить контрольную точку» при синтелическом прикреплении; продвинутый уровень A2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Механизм контрольной точки показан одним «сигналом»; состав комплекса не разбирается.</p><div class="static-quiz"><h3>Все хромосомы прикреплены правильно, но сепараза не работает. Что увидим?</h3><ol><li><b>А.</b> Хромосомы не дойдут до экватора <i>(неверный вариант)</i><br><span class="expl">Прикрепление и выстраивание от сепаразы не зависят</span></li><li><b>Б.</b> Хроматиды разойдутся, но цитокинеза не будет <i>(неверный вариант)</i><br><span class="expl">Без сепаразы хроматиды не расходятся</span></li><li><b>В.</b> Хромосомы на экваторе, хроматиды не расходятся <i>(верный вариант)</i><br><span class="expl">Да: разрешение получено, но когезин не разрезан</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: последовательность событий — учебное деление.</p></details></article><article class="card print-unit" id="ns-cytokinesis"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 13 из 31</div><h2>Как разделяется цитоплазма?</h2><p class="lead"><a href="#ns-g-S6-T36">Цитокинез</a> начинается в конце анафазы. В коре клетки между двумя наборами хромосом собирается <a href="#ns-g-S6-T37">сократительное кольцо</a> из актиновых филаментов и миозина II.</p><div class="note"><strong>Что показывает схема.</strong> Цитокинез: сборка, сужение кольца, разрезание мостика; без миозина II — двуядерная клетка</div><ol class="mech"><li>Положение кольца задаёт веретено: центральная часть веретена и астральные микротрубочки определяют полосу коры, где активируется малый ГТФ-связывающий белок RhoA; он запускает сборку актина и миозина II. Миозин II тянет актиновые филаменты кольца навстречу друг другу, кольцо сужается, и <a href="#ns-g-S6-T82">плазматическая мембрана</a> образует борозду деления. В конце остаётся узкий мостик, который разрезается, и две клетки разделяются. Мембранные органоиды распределяются между дочерними клетками: эндоплазматический ретикулум и митохондрии — как сеть или многочисленные части, аппарат Гольджи — в виде мелких фрагментов, которые затем собираются снова.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·10; вспомнить БИО-2·25 («Актомиозиновое сокращение — другая сила»)</p><p>Если цитокинез не происходит, после митоза образуется одна <a href="#ns-g-S6-T99">клетка с двумя ядрами</a>. В каждом ядре 2n2c, а во всей клетке — 4n4c: одно и то же событие даёт разные записи в зависимости от единицы подсчёта. Деление ядра без деления цитоплазмы бывает и в норме: так становятся двуядерными некоторые клетки печени и клетки сердечной мышцы у млекопитающих.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 2, конструктор: «заблокировать миозин II».</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Распределение органоидов показано схематично.</p><div class="static-quiz"><h3>Миозин II заблокирован после анафазы. Что образуется?</h3><ol><li><b>А.</b> Одна клетка с двумя ядрами <i>(верный вариант)</i><br><span class="expl">Да: ядра собрались, но кольцо не сужается</span></li><li><b>Б.</b> Две клетки без ядер <i>(неверный вариант)</i><br><span class="expl">Ядра собираются в телофазе независимо от кольца</span></li><li><b>В.</b> Две клетки, но с половинным набором ДНК <i>(неверный вариант)</i><br><span class="expl">Хроматиды разошлись нормально; не произошло только деление цитоплазмы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: стадии сужения кольца — учебное деление.</p></details></article><article class="card print-unit" id="ns-attach-vs-separate"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 14 из 31</div><h2>Прикрепление, разрешение разделения и контроль — три независимых условия</h2><p class="lead">Сверх программы. Учебная модель условной клетки с 2n = 4 (две пары хромосом; у человека 2n = 46). В модели три переключателя: прикрепление хромосом, возможность разрезать когезин и работа контрольной точки.</p><div class="note"><strong>Что показывает схема.</strong> Пять сочетаний трёх условий и их исходы</div><ol class="mech"><li>Правила модели. Сигнал «ждать» дают только кинетохоры без микротрубочек. Анафаза разрешена, если сигнала нет или контроль обойдён. Хроматиды расходятся, только если анафаза разрешена и когезин можно разрезать. Хроматиды неприкреплённой хромосомы при обходе контроля остаются на месте и обе попадают в одну дочернюю клетку; отстающая хроматида при меротелическом прикреплении может попасть в любую из дочерних клеток. Исходы: всё прикреплено — 4 и 4 хромосомы; одна хромосома не прикреплена, контроль работает — задержка перед анафазой без гибели; та же хромосома, контроль обойдён — 5 и 3; когезин нельзя разрезать — хроматиды не расходятся при любом прикреплении; меротелическое прикрепление — задержки нет, исход 4 и 4 или 5 и 3.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·11, БИО-6·12</p><p>&lt;b&gt;Обратная задача.&lt;/b&gt; Одна из дочерних клеток получила 5 хромосом. С этим совместимы три сочетания условий: неприкреплённая хромосома с обойдённым контролем и меротелическое прикрепление — как при работающем, так и при обойдённом контроле. Одной дочерней клетки недостаточно: нужно знать, работает ли контрольная точка (останавливается ли митоз, если разрушить микротрубочки) и что видно в анафазе — отстающая хроматида или целая хромосома у одного полюса.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Правила распределения — допущения модели: в клетке отстающая хроматида часто всё же доходит до своего полюса, а последствия ошибки зависят от хромосомы и клетки. Модель не показывает, как ошибка распределения меняет дальнейший цикл.</p><div class="static-quiz"><h3>В модели все хромосомы прикреплены правильно, когезин разрезать нельзя, контроль работает. Каков исход?</h3><ol><li><b>А.</b> Дочерние клетки с 4 и 4 хромосомами <i>(неверный вариант)</i><br><span class="expl">Для этого хроматиды должны разойтись, а когезин не разрезан</span></li><li><b>Б.</b> Хроматиды не расходятся <i>(верный вариант)</i><br><span class="expl">Да: разрешение на анафазу есть, но связь хроматид не разрезана</span></li><li><b>В.</b> Задержка из-за сигнала кинетохоров <i>(неверный вариант)</i><br><span class="expl">Все кинетохоры прикреплены: сигнала нет</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Учебная модель · условная клетка 2n = 4; правила распределения — допущения модели.</p></details></article><article class="card print-unit" id="ns-kfiber-count"><div class="eyebrow">Митоз: веретено, прикрепление хромосом и разделение хроматид · шаг 15 из 31</div><h2>Сколько микротрубочек держит кинетохор клетки человека?</h2><p class="lead">Сверх программы. Кинетохор связан не с одной микротрубочкой, а с пучком — кинетохорным волокном. Учебники называют для клеток животных от 10 до 40 микротрубочек на кинетохор. Сколько их на самом деле в клетке человека и все ли они доходят до полюса?</p><div class="note"><strong>Что показывает схема.</strong> Кинетохорное волокно из ~9 микротрубочек, половина из них доходит до полюса</div><ol class="mech"><li>Целые метафазные веретёна клеток человека линии HeLa реконструировали в трёх измерениях по 22–35 последовательным срезам толщиной около 0,3 мкм в электронном микроскопе и проследили каждую микротрубочку. В среднем кинетохорное волокно состояло примерно из девяти микротрубочек, и их число не зависело от положения хромосомы в веретене. Примерно половина микротрубочек волокна доходила до полюса, остальные заканчивались в теле веретена, часть из них — вплотную к другим микротрубочкам.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·9, БИО-6·11</p><p>Значит, связь кинетохора с полюсом в клетках человека не всегда прямая; это согласуется с представлением, что волокно связано с полюсом и через другие микротрубочки, но силы в работе не измеряли.</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Число микротрубочек на кинетохоре зависит от типа клеток и может быть меньше, чем указывают учебники; волокно — не жёсткий пучок от кинетохора до полюса. &lt;b&gt;Как это узнали.&lt;/b&gt; Клетки быстро замораживали в метафазе, делали серии срезов и по ним восстанавливали ход всех микротрубочек; так изучили три веретена, около 300 кинетохоров.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Изучены опухолевые клетки одной линии в метафазе; для других клеток и фаз числа могут быть иными.</p><div class="static-quiz"><h3>Сколько микротрубочек кинетохорного волокна в клетках HeLa доходит до полюса?</h3><ol><li><b>А.</b> Все без исключения <i>(неверный вариант)</i><br><span class="expl">Работа показала, что до полюса доходит лишь около половины</span></li><li><b>Б.</b> Ни одна <i>(неверный вариант)</i><br><span class="expl">Около половины микротрубочек волокна доходит до полюса</span></li><li><b>В.</b> Примерно половина <i>(верный вариант)</i><br><span class="expl">Да: остальные заканчиваются в теле веретена</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li><li><a href="https://doi.org/10.7554/eLife.75459">Kiewisz R., Fabig G., Conway W., Baum D., Needleman D., Müller-Reichert T. Three-dimensional structure of kinetochore-fibers in human mitotic spindles. eLife. 2022;11:e75459</a></li></ul><p>Схема по данным работы, упрощённая: показано одно кинетохорное волокно.</p></details></article><article class="card print-unit" id="ns-counting-n-c"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 16 из 31</div><h2>Как считать хромосомы и ДНК: n, c, момент и единица подсчёта</h2><p class="lead"><a href="#ns-g-S6-T46">Гаплоидный набор</a> обозначают n: у человека n = 23. <a href="#ns-g-S6-T47">Количество ДНК</a> гаплоидного набора нереплицированных хромосом обозначают c. <a href="#ns-g-S6-T88">Диплоидная клетка</a> человека в G1 — 2n2c: 46 хромосом, каждая из одной молекулы ДНК.</p><div class="note"><strong>Что показывает схема.</strong> Подсчёт хромосом по центромерам и ДНК по хроматидам на пяти моментах митоза</div><ol class="mech"><li>Правила подсчёта. Первое: число <a href="#ns-g-S6-T45">хромосом</a> равно числу центромер; две сестринские хроматиды, связанные когезином, — одна хромосома. Второе: количество ДНК равно числу молекул ДНК, то есть хроматид. Третье: у каждой записи нужно указать момент и единицу — клетку или ядро. Митоз диплоидной клетки: G1 — 2n2c; после S — 2n4c (число хромосом не изменилось, ДНК удвоена); профаза и метафаза — 2n4c; анафаза — 4n4c на всю клетку: центромеры разделились, и каждая хроматида стала хромосомой; после цитокинеза — 2n2c в каждой дочерней клетке.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·1, БИО-6·8, БИО-6·13</p><p>Пример ловушки: в телофазе до цитокинеза в клетке два ядра; на одно ядро — 2n2c, на всю клетку — 4n4c. Обе записи верны, если указана единица. У человека в метафазе митоза 46 хромосом, 92 хроматиды и 92 молекулы ДНК; в анафазе — 92 хромосомы на клетку. Подсчёты для мейоза — БИО-6·19 и БИО-6·20.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаги 3.1–3.2.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Запись n/c не учитывает ДНК митохондрий и неравенство размеров хромосом.</p><div class="static-quiz"><h3>Сколько хромосом в клетке человека в анафазе митоза, до цитокинеза?</h3><ol><li><b>А.</b> 92: хроматиды стали хромосомами <i>(верный вариант)</i><br><span class="expl">Да: центромеры разделились, запись на клетку — 4n4c</span></li><li><b>Б.</b> 46, как во всех фазах митоза <i>(неверный вариант)</i><br><span class="expl">После разделения центромер число хромосом в клетке удваивается до цитокинеза</span></li><li><b>В.</b> 23, как в гамете <i>(неверный вариант)</i><br><span class="expl">Митоз не уменьшает набор: в каждой дочерней клетке будет 46</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: условная клетка с 2n = 4; у человека 2n = 46.</p></details></article><article class="card print-unit" id="ns-homologs-synapsis"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 17 из 31</div><h2>Гомологичные хромосомы и синапсис в профазе мейоза I</h2><p class="lead"><a href="#ns-g-S6-T49">Мейоз</a> — два последовательных деления после одного удвоения ДНК; из диплоидной клетки образуются четыре гаплоидные. Первое деление начинается с длинной профазы, в которой сближаются <a href="#ns-g-S6-T48">гомологичные хромосомы</a> — материнская и отцовская копии одной хромосомы.</p><div class="note"><strong>Что показывает схема.</strong> Пять стадий профазы I одного бивалента</div><ol class="mech"><li><a href="#ns-g-S6-T52">Профазу I</a> делят на пять стадий. В лептотене удвоенные хромосомы начинают конденсироваться, и в ДНК возникают запрограммированные двуцепочечные разрывы — с них начинается рекомбинация. В зиготене гомологи сближаются и соединяются по всей длине — это <a href="#ns-g-S6-T53">синапсис (конъюгация)</a>; между ними собирается белковая «лестница» — <a href="#ns-g-S6-T54">синаптонемный комплекс</a>. В пахитене синапсис завершён, а участки ДНК обмениваются между гомологами. Пара соединённых гомологов — <a href="#ns-g-S6-T55">бивалент</a> — содержит четыре хроматиды. В диплотене синаптонемный комплекс разбирается, и гомологи остаются связанными только в местах обмена. В диакинезе хромосомы максимально конденсированы, исчезает ядрышко, разбирается ядерная оболочка.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·16</p><p>Подсчёт в пахитене: число хромосом — 2n, ДНК — 4c на клетку; у человека — 23 бивалента, 46 хромосом, 92 хроматиды. Синапсис не уменьшает число хромосом: гомологи сближены, но не слиты. Профаза I длится долго: у мыши — несколько суток, а у женщин — от плодного периода до овуляции, то есть годы и десятилетия (БИО-6·21).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.3.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Стадии профазы I — учебное деление непрерывного процесса.</p><div class="static-quiz"><h3>Сколько хромосом и хроматид в клетке человека в пахитене мейоза I?</h3><ol><li><b>А.</b> 23 хромосомы, 92 хроматиды <i>(неверный вариант)</i><br><span class="expl">Синапсис не уменьшает число хромосом: гомологи сближены, но их по-прежнему 46</span></li><li><b>Б.</b> 46 хромосом, 92 хроматиды <i>(верный вариант)</i><br><span class="expl">Да: 23 бивалента, запись на клетку — 2n4c</span></li><li><b>В.</b> 46 хромосом, 46 хроматид <i>(неверный вариант)</i><br><span class="expl">ДНК уже удвоена: в каждой хромосоме две хроматиды</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема по строению бивалента, упрощённая: синаптонемный комплекс показан лестницей.</p></details></article><article class="card print-unit" id="ns-crossing-over"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 18 из 31</div><h2>Кроссинговер и хиазмы: обмен и связь</h2><p class="lead"><a href="#ns-g-S6-T56">Кроссинговер</a> — обмен участками между несестринскими хроматидами гомологичных хромосом.</p><div class="note"><strong>Что показывает схема.</strong> Кроссинговер между несестринскими хроматидами и хиазма</div><ol class="mech"><li>Обмен начинается с запрограммированного двуцепочечного разрыва в ДНК одной хроматиды. Конец разорванной ДНК находит соответствующий участок несестринской хроматиды гомолога, и после ряда превращений участки хроматид обмениваются. Не каждый разрыв даёт обмен: у человека в каждой паре гомологов обычно происходит два-три обмена. Место обмена становится видно в диплотене как <a href="#ns-g-S6-T57">хиазма</a> — перекрест хроматид гомологов.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·17</p><p>У кроссинговера две функции. Первая — генетическая: хромосомы гамет несут новые сочетания материнских и отцовских аллелей, а сестринские хроматиды одной хромосомы перестают быть одинаковыми. Вторая — механическая: хиазма вместе с когезином на плечах сестринских хроматид удерживает гомологи вместе до анафазы I, и только связанная пара правильно ориентируется в веретене. Поэтому обычно на каждый бивалент приходится хотя бы один обмен.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.4; продвинутый уровень A3 — кроссинговер в паре A.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Промежуточные структуры рекомбинации не показаны.</p><div class="static-quiz"><h3>Между какими хроматидами происходит кроссинговер?</h3><ol><li><b>А.</b> Между сестринскими хроматидами одного гомолога <i>(неверный вариант)</i><br><span class="expl">Сестринские хроматиды одинаковы; обмен между ними не создаёт новых сочетаний</span></li><li><b>Б.</b> Между хромосомами разных пар <i>(неверный вариант)</i><br><span class="expl">Кроссинговер идёт между гомологами одной пары</span></li><li><b>В.</b> Между несестринскими хроматидами гомологов <i>(верный вариант)</i><br><span class="expl">Да: обмениваются участки материнской и отцовской хромосом</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: место обмена и длина участков условны.</p></details></article><article class="card print-unit" id="ns-meiosis-one"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 19 из 31</div><h2>Мейоз I: расходятся гомологи, а не хроматиды</h2><p class="lead"><a href="#ns-g-S6-T50">Мейоз I</a> — редукционное деление: каждая дочерняя клетка получает по одному гомологу из каждой пары.</p><div class="note"><strong>Что показывает схема.</strong> Метафаза I с двумя вариантами ориентации и анафаза I</div><ol class="mech"><li>В метафазе I на экваторе выстраиваются биваленты. Два сестринских кинетохора одного гомолога действуют вместе и прикрепляются к микротрубочкам одного полюса, а кинетохоры гомолога — к противоположному. В анафазе I сепараза разрезает когезин на плечах хромосом, связь в местах хиазм исчезает, и гомологи расходятся. Когезин у центромер в это время защищён белком <a href="#ns-g-S6-T58">шугошином</a>, поэтому сестринские хроматиды остаются вместе. Каждый бивалент ориентируется независимо от других: к одному полюсу может отойти материнский гомолог одной пары и отцовский — другой. Это <a href="#ns-g-S6-T59">независимое расхождение гомологов</a>: число вариантов набора хромосом в <a href="#ns-g-S6-T91">гамете</a> равно 2ⁿ, у человека 2²³ — больше 8 миллионов, без учёта кроссинговера.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·17, БИО-6·18, БИО-6·12</p><p>Подсчёт: в анафазе I на клетку — 2n4c (центромеры не разделились, хромосом по-прежнему 46); после мейоза I в каждой клетке — 1n2c: 23 хромосомы, каждая из двух хроматид. Число хромосом уменьшается вдвое уже в первом делении, а количество ДНК после каждого деления уменьшается вдвое.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаги 3.5–3.6.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Механизм совместной ориентации сестринских кинетохоров не разбирается.</p><div class="static-quiz"><h3>Почему в анафазе I сестринские хроматиды не расходятся?</h3><ol><li><b>А.</b> Когезин у центромер защищён <i>(верный вариант)</i><br><span class="expl">Да: шугошин сохраняет центромерный когезин до мейоза II</span></li><li><b>Б.</b> Кинетохоров у хроматид нет <i>(неверный вариант)</i><br><span class="expl">Кинетохоры есть, но сестринские прикреплены к одному полюсу</span></li><li><b>В.</b> Сепараза в мейозе не работает <i>(неверный вариант)</i><br><span class="expl">Сепараза работает и разрезает когезин на плечах</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная, две панели: А — метафаза I, два варианта ориентации бивалентов; Б — анафаза I.</p></details></article><article class="card print-unit" id="ns-meiosis-two"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 20 из 31</div><h2>Мейоз II: деление без новой S-фазы</h2><p class="lead">Между мейозом I и мейозом II ДНК не удваивается. <a href="#ns-g-S6-T51">Мейоз II</a> — эквационное деление: расходятся сестринские хроматиды, как в митозе, но в клетке с гаплоидным набором.</p><div class="note"><strong>Что показывает схема.</strong> Мейоз II и его сравнение с митозом</div><ol class="mech"><li>В метафазе II сестринские кинетохоры каждой хромосомы прикрепляются к противоположным полюсам. В анафазе II защита центромерного когезина снимается, сепараза разрезает его, и хроматиды расходятся. Подсчёт: после мейоза I — 1n2c; в анафазе II на клетку — 2n2c (центромеры разделились); после мейоза II — 1n1c в каждой из четырёх клеток. Отсутствие S-фазы между делениями — условие редукции: одно удвоение ДНК приходится на два деления.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·19</p><p>Сравнение с митозом: и в анафазе митоза, и в анафазе II расходятся сестринские хроматиды, но митоз начинается с 2n4c и даёт 2n2c, а мейоз II начинается с 1n2c и даёт 1n1c. Из-за кроссинговера сестринские хроматиды, расходящиеся в мейозе II, генетически не одинаковы.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.6; продвинутый уровень A3.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Между делениями может быть короткий промежуток — интеркинез; в некоторых клетках его нет.</p><div class="static-quiz"><h3>Чем анафаза II отличается от анафазы митоза той же диплоидной клетки по числу хромосом?</h3><ol><li><b>А.</b> Ничем: в обеих расходятся хроматиды <i>(неверный вариант)</i><br><span class="expl">Механизм сходный, но набор в мейозе II уже гаплоидный</span></li><li><b>Б.</b> В анафазе II вдвое меньше хромосом <i>(верный вариант)</i><br><span class="expl">Да: 2n2c против 4n4c — мейоз II начинается с гаплоидного набора</span></li><li><b>В.</b> В анафазе II вдвое больше хромосом <i>(неверный вариант)</i><br><span class="expl">Наоборот: после мейоза I хромосом вдвое меньше</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: условная клетка с n = 2.</p></details></article><article class="card print-unit" id="ns-sex-differences"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 21 из 31</div><h2>Чем мейоз у мужчин отличается от мейоза у женщин?</h2><p class="lead">Последовательность хромосомных событий мейоза у мужчин и у женщин одна и та же. Различаются сроки, деление цитоплазмы и число образующихся гамет.</p><div class="note"><strong>Что показывает схема.</strong> Сперматогенез — четыре гаметы; оогенез — одна яйцеклетка и полярные тельца</div><ol class="mech"><li><a href="#ns-g-S6-T60">Сперматогенез</a> начинается в период полового созревания и продолжается всю жизнь. Сперматогонии делятся митозом; часть их потомков становится <a href="#ns-g-S6-T87">сперматоцитами I порядка</a>, которые вступают в мейоз. Мейоз I даёт два сперматоцита II порядка (1n2c), мейоз II — четыре <a href="#ns-g-S6-T98">сперматиды</a> (1n1c); цитоплазма делится почти поровну, и все четыре клетки превращаются в сперматозоиды. <a href="#ns-g-S6-T61">Оогенез</a> начинается до рождения: <a href="#ns-g-S6-T86">ооциты I порядка</a> вступают в мейоз в плодном периоде и останавливаются в профазе I, в диплотене, на годы и десятилетия. Перед овуляцией ооцит завершает мейоз I: деление резко неравное, почти вся цитоплазма остаётся в ооците II порядка, а лишний набор хромосом уходит в маленькое <a href="#ns-g-S6-T62">полярное тельце</a>. Ооцит останавливается в метафазе II и завершает мейоз только после оплодотворения, отделяя второе полярное тельце.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·19, БИО-6·20</p><p>Итог: из сперматоцита I порядка — четыре гаметы, из ооцита I порядка — одна яйцеклетка и полярные тельца; неравное деление сохраняет в яйцеклетке запасы и органоиды для зародыша. Веретено ооцита человека собирается без центросом. Ошибки распределения хромосом в ооцитах человека часты и учащаются с возрастом; полученная от гаметы лишняя или недостающая хромосома — <a href="#ns-g-S6-T63">анеуплоидия</a> — частая причина гибели зародышей.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 3, шаг 3.7.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Гормональная регуляция оогенеза и то, что происходит дальше с полярными тельцами, не разбираются.</p><div class="static-quiz"><h3>На какой стадии находится ооцит человека при овуляции?</h3><ol><li><b>А.</b> В профазе I <i>(неверный вариант)</i><br><span class="expl">В профазе I ооцит находится до созревания фолликула; перед овуляцией мейоз I завершается</span></li><li><b>Б.</b> После мейоза II <i>(неверный вариант)</i><br><span class="expl">Мейоз II завершается только после оплодотворения</span></li><li><b>В.</b> В метафазе II <i>(верный вариант)</i><br><span class="expl">Да: мейоз I завершён, мейоз II завершится после оплодотворения</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная, две панели: А — сперматогенез, Б — оогенез; размеры клеток не в масштабе.</p></details></article><article class="card print-unit" id="ns-two-divisions"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 22 из 31</div><h2>Одна удвоенная ДНК — два разных деления: митоз и мейоз</h2><p class="lead">Сверх программы. Учебная модель условной клетки с 2n = 4: две пары гомологов, A и B; в каждой паре материнский (m) и отцовский (p) гомолог. После S-фазы клетка одна и та же — 2n4c, — а дальше идёт либо митоз, либо мейоз.</p><div class="note"><strong>Что показывает схема.</strong> Одна клетка 2n4c: митоз и мейоз с разными ориентациями</div><ol class="mech"><li>Правила модели. Митоз: сестринские хроматиды каждой хромосомы расходятся к разным полюсам, и обе дочерние клетки получают все четыре хромосомы: Am, Ap, Bm, Bp — 2n2c. Мейоз I: биваленты ориентируются независимо; переключатели задают, какой гомолог каждой пары обращён к полюсу 1. Мейоз II идёт без новой S-фазы. Подсчёт на клетку по стадиям: G1 — 2n2c; после S — 2n4c; метафаза I — 2n4c; анафаза I — 2n4c; после мейоза I — 1n2c; анафаза II — 2n2c; после мейоза II — 1n1c. Четыре сочетания ориентаций дают четыре варианта гамет (Am Bm, Am Bp, Ap Bm, Ap Bp) — 2ⁿ при n = 2.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·16, БИО-6·19, БИО-6·20</p><p>Переключатель «кроссинговер в паре A» делает вторую хроматиду каждого гомолога пары A смешанной, и из одной клетки мейоза I выходят две гаметы с разными вариантами хромосомы A. Инварианты модели: в каждой гамете по одной хромосоме каждой пары; сумма ДНК дочерних клеток равна ДНК исходной клетки; число хромосом в одной клетке меняется только в анафазе (разделение центромер) и при цитокинезе. &lt;b&gt;Обратная задача.&lt;/b&gt; В клетке 2 хромосомы, каждая из двух хроматид. Это клетка после мейоза I (1n2c) или в метафазе II; после митоза такой клетки быть не может.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Ориентация в мейозе II в модели фиксирована; кроссинговер показан только в паре A и в одном месте.</p><div class="static-quiz"><h3>Сколько разных по набору хромосом гамет дают все сочетания ориентаций бивалентов в модели без кроссинговера?</h3><ol><li><b>А.</b> Четыре: 2ⁿ при n = 2 <i>(верный вариант)</i><br><span class="expl">Да: каждая из двух пар ориентируется независимо</span></li><li><b>Б.</b> Две: материнский и отцовский набор <i>(неверный вариант)</i><br><span class="expl">Пары ориентируются независимо, поэтому возможны и смешанные наборы</span></li><li><b>В.</b> Восемь: по числу хроматид <i>(неверный вариант)</i><br><span class="expl">Число вариантов определяют пары гомологов, а не хроматиды</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Учебная модель · условная клетка 2n = 4; ориентация в мейозе II и место кроссинговера — допущения.</p></details></article><article class="card print-unit" id="ns-cohesion-age"><div class="eyebrow">Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК · шаг 23 из 31</div><h2>Почему в ооцитах с возрастом сестринские хроматиды расходятся раньше времени?</h2><p class="lead">Сверх программы. Когезин между сестринскими хроматидами ооцита закладывается ещё до рождения и, по данным на мышах, почти не обновляется до овуляции. В мейозе I его у центромер защищает шугошин. Что происходит с этой защитой у женщин старшего возраста?</p><div class="note"><strong>Что показывает схема.</strong> Мостик шугошина 2 между сестринскими центромерами и его возрастная потеря</div><ol class="mech"><li>В ооцитах человека, полученных при лечении бесплодия, белок шугошин 2 располагался не только вокруг центромер, но и «мостиком» между двумя сестринскими центромерами. У женщин 30 лет и моложе такой мостик был почти у всех пар сестринских хроматид в метафазе I и в метафазе II. С возрастом мостик пропадал всё чаще: у большинства женщин 36 лет и старше его не было на большинстве пар. Пары без мостика были раздвинуты сильнее, а в метафазе II у женщин старше 35 лет резко учащались одиночные хроматиды — разошедшиеся раньше времени. Если в ооцитах молодых женщин на протяжении мейоза I подавить киназу, необходимую для удержания шугошина 2 на месте, одиночных хроматид в метафазе II становилось больше, как у ооцитов старшего возраста.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·19, БИО-6·21</p><p>Одиночная хроматида в метафазе II уже не связана с сестрой и при завершении мейоза может попасть в любую клетку — в яйцеклетку или в полярное тельце. Так возникают яйцеклетки с лишней или недостающей хромосомой.</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Схема «шугошин защищает центромерный когезин в мейозе I» дополняется возрастным звеном: с возрастом вместе с когезином теряется и его защита; что из этого причина, а что следствие, пока не установлено — исчезновение мостика может быть и следствием потери самого когезина. &lt;b&gt;Как это узнали.&lt;/b&gt; Ооциты фиксировали в метафазе I и II, окрашивали шугошин и центромеры и подсчитывали хроматиды; затем проверяли, воспроизводит ли подавление киназы картину старших ооцитов.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Число ооцитов невелико, а связь с возрастом установлена сопоставлением; эксперимент с подавлением киназы в ооцитах молодых женщин воспроизводит часть картины, но подавленная киназа действует не только на шугошин 2. Анеуплоидия ооцитов имеет и другие причины.</p><div class="static-quiz"><h3>Что чаще встречается в метафазе II у ооцитов женщин старше 35 лет?</h3><ol><li><b>А.</b> Лишние биваленты <i>(неверный вариант)</i><br><span class="expl">Бивалентов в метафазе II нет: гомологи разошлись в мейозе I</span></li><li><b>Б.</b> Одиночные хроматиды <i>(верный вариант)</i><br><span class="expl">Да: защита центромерного когезина ослаблена</span></li><li><b>В.</b> Хромосомы из трёх хроматид <i>(неверный вариант)</i><br><span class="expl">Хромосома состоит из одной или двух хроматид; дело в преждевременном разделении сестёр</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2023.11.061">Mihalas B.P., Pieper G.H., Aboelenain M., et al., Marston A.L. Age-dependent loss of cohesion protection in human oocytes. Curr Biol. 2024;34(1):117–131.e5</a></li></ul><p>Схема по данным работы, упрощённая: показаны две пары сестринских хроматид.</p></details></article><article class="card print-unit" id="ns-division-death-balance"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 24 из 31</div><h2>Число клеток задаёт баланс деления и гибели</h2><p class="lead">Число клеток в ткани определяется соотношением делений и гибели. Клеточная гибель — нормальная часть жизни многоклеточного организма, а не только последствие повреждения.</p><div class="note"><strong>Что показывает схема.</strong> Число клеток — баланс деления и гибели; два типа гибели</div><ol class="mech"><li>Основной способ гибели клеток нашего тела — <a href="#ns-g-S6-T64">апоптоз</a>: клетка разбирается изнутри и быстро поглощается соседними клетками или <a href="#ns-g-S6-T94">макрофагами</a>, не выпуская содержимого. Апоптоз удаляет клетки при развитии (например, промежутки между пальцами), лишние лимфоциты, клетки с неисправленным повреждением ДНК. Другой тип — <a href="#ns-g-S6-T65">некротическая гибель (некроз)</a>: клетка набухает и разрывается, её содержимое выходит наружу и вызывает <a href="#ns-g-S6-T78">воспаление</a>. Некротическая гибель бывает случайной — при тяжёлом остром повреждении, — но существуют и <a href="#ns-g-S6-T66">регулируемые формы некротической гибели</a>, в которых клетка участвует в процессе собственными белками.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·5</p><p>Важно различать три вещи: причину гибели (облучение, недостаток кислорода, сигнал от другой клетки), механизм (каспазы, отказ ионного гомеостаза, регулируемое разрушение мембраны) и наблюдаемый результат (форма клетки, мембрана, воспаление). Одна и та же причина может вызывать разные механизмы, а разные механизмы — сходный результат. Недостаток апоптоза способствует росту опухолей, избыток — потере клеток в тканях.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Классификация упрощена до двух типов и регулируемых некротических форм; подробная классификация разбирается в курсе «Молекулярная биология».</p><div class="static-quiz"><h3>Почему в ткани, где ежедневно погибает много клеток путём апоптоза, мёртвых клеток почти не видно?</h3><ol><li><b>А.</b> Апоптоз происходит только в эмбрионе <i>(неверный вариант)</i><br><span class="expl">Апоптоз идёт и во взрослых тканях постоянно</span></li><li><b>Б.</b> Погибшие клетки сразу растворяются <i>(неверный вариант)</i><br><span class="expl">Клетка разбирается упорядоченно и поглощается целиком или по частям</span></li><li><b>В.</b> Их быстро поглощают фагоциты <i>(верный вариант)</i><br><span class="expl">Да: апоптотическую клетку поглощают раньше, чем она разрушится</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li><li><a href="https://doi.org/10.1038/s41418-017-0012-4">Galluzzi L., Vitale I., Aaronson S.A., et al. Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018. Cell Death Differ. 2018;25(3):486–541</a></li></ul><p>Схема качественная: два исхода гибели клетки в ткани.</p></details></article><article class="card print-unit" id="ns-necrosis"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 25 из 31</div><h2>Некротическая гибель: отказ ионного и энергетического гомеостаза</h2><p class="lead">Самый частый путь к некротической гибели — нехватка АТФ, например при остановке кровоснабжения: без кислорода митохондрии перестают синтезировать АТФ.</p><div class="note"><strong>Что показывает схема.</strong> Нехватка АТФ → остановка насоса → вход ионов и воды → набухание → разрыв</div><ol class="mech"><li><a href="#ns-g-S6-T77">Na⁺/K⁺-насос</a> плазматической мембраны тратит АТФ и постоянно выкачивает Na⁺, компенсируя его утечку в клетку. Без АТФ насос останавливается, Na⁺ и Cl⁻ накапливаются в клетке, за ними по осмотическому градиенту входит вода, и клетка набухает. Набухают и органоиды, в цитозоле растёт концентрация Ca²⁺; перегрузка цитозоля Ca²⁺ через повреждение митохондрий может запустить и регулируемую некротическую гибель. Наконец плазматическая мембрана разрывается, содержимое клетки выходит наружу; внутриклеточные молекулы во внеклеточной среде служат сигналами повреждения для иммунных клеток, и в ткани развивается воспаление.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·24; вспомнить БИО-1·17 («Как работает Na⁺/K⁺-АТФаза?»), БИО-1·21 («Стационарное состояние: остановка насоса, утечка и разные причины одного результата») и БИО-5·24 («Как дыхательная цепь создаёт протонный градиент?»)</p><p>Каспазы при такой гибели не активируются; ядро не распадается на упорядоченные фра
