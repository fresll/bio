","<b>Ограничения.<\/b> На схеме одна хромосома; число микротрубочек на кинетохоре условно."],"conditions":"Схема качественная, три панели: А — биориентация, Б — синтелическое прикрепление, В — меротелическое прикрепление.","sources":["src_01"],"base":"БИО-6·8, БИО-6·9","quiz":{"id":"S6-L11","question":"Почему меротелическое прикрепление не задерживает анафазу?","options":[{"id":"S6-L11-1","text":"Хромосома при этом не доходит до экватора","correct":false,"feedback":"Меротелически прикреплённая хромосома может стоять на экваторе"},{"id":"S6-L11-2","text":"Кинетохор прикреплён к микротрубочкам","correct":true,"feedback":"Да: сигнал дают кинетохоры без микротрубочек, а этот кинетохор прикреплён, хотя и к двум полюсам"},{"id":"S6-L11-3","text":"Сестринские хроматиды уже разделены","correct":false,"feedback":"До анафазы хроматиды удерживает когезин"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какое прикрепление правильное?","status":"Схема качественная · одна хромосома","modes_label":"Прикрепление","modes":["А биориентация","Б синтелическое","В меротелическое"],"args":[{"type":"bi"},{"type":"syn"},{"type":"mero"}],"notes":["Кинетохоры к разным полюсам; есть натяжение — связь устойчива","Оба кинетохора к одному полюсу; нет натяжения — связь ослабляется, попытка повторяется","Один кинетохор к обоим полюсам; кинетохор прикреплён, сигнала нет"],"static":["Три вида прикрепления хромосомы к веретену"],"scene":"s6_r_attach","L":{"s6_cohesin":"когезин","s6_mero_nosig":"кинетохор прикреплён к обоим полюсам, сигнала нет","s6_no_tension":"нет натяжения — связь ослабляется","s6_pole1":"полюс 1","s6_pole2":"полюс 2","s6_tension":"натяжение"}},"zoomNarrow":true}},{"id":"sac-separase","num":12,"section":1,"questions":[2],"title":"Контрольная точка сборки веретена: что разрешает анафазу?","keywords":["Контрольная точка сборки веретена","Секурин","Сепараза"],"lead":["Сестринские хроматиды расходятся одновременно, когда разрезаны все кольца когезина у центромер. Момент разреза определяет [[T41|контрольная точка сборки веретена]]."],"mechanism":["Кинетохор без микротрубочек катализирует образование белкового комплекса, который связывает активатор APC/C и не даёт APC/C работать. Достаточно одного такого кинетохора, чтобы задержать анафазу во всей клетке. Когда прикреплена последняя хромосома, торможение снимается, и APC/C метит убиквитином два белка. Первый — [[T42|секурин]], ингибитор протеазы [[T43|сепаразы]]: после его разрушения протеасомой сепараза разрезает когезин, и хроматиды расходятся. Второй — циклин B: его разрушение снижает активность CDK1, и клетка выходит из митоза — собираются ядерные оболочки, начинается цитокинез."],"paragraphs":["Значит, в норме прикрепление и разделение связаны через одно разрешение: пока есть хотя бы один неприкреплённый кинетохор, нет и разделения. Но это разные этапы: если когезин нельзя разрезать, хроматиды не разойдутся и при полностью правильном прикреплении; если контрольная точка выключена, разделение начнётся и при неприкреплённой хромосоме.","<b>На практикуме.<\/b> Вкладка 2, конструктор: «выключить контрольную точку» при синтелическом прикреплении; продвинутый уровень A2.","<b>Ограничения.<\/b> Механизм контрольной точки показан одним «сигналом»; состав комплекса не разбирается."],"conditions":"Схема качественная: последовательность событий — учебное деление.","sources":["src_01"],"base":"БИО-6·3, БИО-6·11","quiz":{"id":"S6-L12","question":"Все хромосомы прикреплены правильно, но сепараза не работает. Что увидим?","options":[{"id":"S6-L12-1","text":"Хромосомы не дойдут до экватора","correct":false,"feedback":"Прикрепление и выстраивание от сепаразы не зависят"},{"id":"S6-L12-2","text":"Хроматиды разойдутся, но цитокинеза не будет","correct":false,"feedback":"Без сепаразы хроматиды не расходятся"},{"id":"S6-L12-3","text":"Хромосомы на экваторе, хроматиды не расходятся","correct":true,"feedback":"Да: разрешение получено, но когезин не разрезан"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что разрешает анафазу?","status":"Схема качественная · последовательность — учебное деление","modes_label":"Этап","modes":["1 сигнал","2 APC/C","3 сепараза","4 выход"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Один неприкреплённый кинетохор тормозит APC/C во всей клетке","Все прикреплены — APC/C метит секурин и циклин B","Секурин разрушен — сепараза режет когезин, хроматиды расходятся","Циклин B разрушен — выход из митоза"],"static":["Сигнал кинетохора → APC/C → секурин → сепараза → когезин; циклин B → выход"],"scene":"s6_t2c","L":{"s6_all_att":"все кинетохоры прикреплены","s6_cut":"когезин разрезан","s6_exit":"циклин B разрушен — выход из митоза","s6_proteasome":"протеасома","s6_sac_sig":"сигнал","s6_securin":"секурин","s6_separase":"сепараза","s6_unatt":"неприкреплённый кинетохор"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E01","question":"Какой фермент разрезает когезин в начале анафазы?","options":[{"id":"S6-E01-1","text":"Сепараза","correct":true,"feedback":"Да; до анафазы её удерживает в неактивном состоянии секурин"},{"id":"S6-E01-2","text":"Секурин","correct":false,"feedback":"Секурин — ингибитор сепаразы; его разрушение и освобождает фермент"},{"id":"S6-E01-3","text":"Конденсин","correct":false,"feedback":"Конденсин складывает хроматиды; когезин он не разрезает"}]}},{"id":"cytokinesis","num":13,"section":1,"questions":[2],"title":"Как разделяется цитоплазма?","keywords":["Цитокинез","Сократительное кольцо","Плазматическая мембрана","Двуядерная клетка"],"lead":["[[T36|Цитокинез]] начинается в конце анафазы. В коре клетки между двумя наборами хромосом собирается [[T37|сократительное кольцо]] из актиновых филаментов и миозина II."],"mechanism":["Положение кольца задаёт веретено: центральная часть веретена и астральные микротрубочки определяют полосу коры, где активируется малый ГТФ-связывающий белок RhoA; он запускает сборку актина и миозина II. Миозин II тянет актиновые филаменты кольца навстречу друг другу, кольцо сужается, и [[T82|плазматическая мембрана]] образует борозду деления. В конце остаётся узкий мостик, который разрезается, и две клетки разделяются. Мембранные органоиды распределяются между дочерними клетками: эндоплазматический ретикулум и митохондрии — как сеть или многочисленные части, аппарат Гольджи — в виде мелких фрагментов, которые затем собираются снова."],"paragraphs":["Если цитокинез не происходит, после митоза образуется одна [[T99|клетка с двумя ядрами]]. В каждом ядре 2n2c, а во всей клетке — 4n4c: одно и то же событие даёт разные записи в зависимости от единицы подсчёта. Деление ядра без деления цитоплазмы бывает и в норме: так становятся двуядерными некоторые клетки печени и клетки сердечной мышцы у млекопитающих.","<b>На практикуме.<\/b> Вкладка 2, конструктор: «заблокировать миозин II».","<b>Ограничения.<\/b> Распределение органоидов показано схематично."],"conditions":"Схема качественная: стадии сужения кольца — учебное деление.","sources":["src_01"],"base":"БИО-6·10; вспомнить БИО-2·25 («Актомиозиновое сокращение — другая сила»)","quiz":{"id":"S6-L13","question":"Миозин II заблокирован после анафазы. Что образуется?","options":[{"id":"S6-L13-1","text":"Одна клетка с двумя ядрами","correct":true,"feedback":"Да: ядра собрались, но кольцо не сужается"},{"id":"S6-L13-2","text":"Две клетки без ядер","correct":false,"feedback":"Ядра собираются в телофазе независимо от кольца"},{"id":"S6-L13-3","text":"Две клетки, но с половинным набором ДНК","correct":false,"feedback":"Хроматиды разошлись нормально; не произошло только деление цитоплазмы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как разделяется цитоплазма?","status":"Схема качественная · стадии сужения — учебное деление","modes_label":"Этап","modes":["кольцо собирается","кольцо сужается","мостик разрезан","миозин II заблокирован"],"args":[{"stage":1},{"stage":2},{"stage":3},{"myosin":false}],"notes":["Положение кольца задаёт веретено","Миозин II стягивает кольцо","Две клетки","Ядра собрались, кольцо не сужается: одна клетка с двумя ядрами"],"static":["Цитокинез: сборка, сужение кольца, разрезание мостика; без миозина II — двуядерная клетка"],"scene":"s6_t2d","L":{"s6_binuc":"одна клетка с двумя ядрами","s6_cring":"сократительное кольцо: актин и миозин II","s6_cut_bridge":"мостик разрезан — две клетки","s6_furrow":"Миозин II стягивает кольцо — борозда углубляется","s6_myo_off":"Миозин II заблокирован: ядра собрались, кольцо не сужается","s6_nucleus":"ядро","s6_rhoa":"Положение кольца задаёт веретено; RhoA собирает кольцо"}}}},{"id":"attach-vs-separate","num":14,"section":1,"questions":[2],"title":"Прикрепление, разрешение разделения и контроль — три независимых условия","keywords":[],"lead":["Сверх программы. Учебная модель условной клетки с 2n = 4 (две пары хромосом; у человека 2n = 46). В модели три переключателя: прикрепление хромосом, возможность разрезать когезин и работа контрольной точки."],"mechanism":["Правила модели. Сигнал «ждать» дают только кинетохоры без микротрубочек. Анафаза разрешена, если сигнала нет или контроль обойдён. Хроматиды расходятся, только если анафаза разрешена и когезин можно разрезать. Хроматиды неприкреплённой хромосомы при обходе контроля остаются на месте и обе попадают в одну дочернюю клетку; отстающая хроматида при меротелическом прикреплении может попасть в любую из дочерних клеток. Исходы: всё прикреплено — 4 и 4 хромосомы; одна хромосома не прикреплена, контроль работает — задержка перед анафазой без гибели; та же хромосома, контроль обойдён — 5 и 3; когезин нельзя разрезать — хроматиды не расходятся при любом прикреплении; меротелическое прикрепление — задержки нет, исход 4 и 4 или 5 и 3."],"paragraphs":["<b>Обратная задача.<\/b> Одна из дочерних клеток получила 5 хромосом. С этим совместимы три сочетания условий: неприкреплённая хромосома с обойдённым контролем и меротелическое прикрепление — как при работающем, так и при обойдённом контроле. Одной дочерней клетки недостаточно: нужно знать, работает ли контрольная точка (останавливается ли митоз, если разрушить микротрубочки) и что видно в анафазе — отстающая хроматида или целая хромосома у одного полюса.","<b>Ограничения.<\/b> Правила распределения — допущения модели: в клетке отстающая хроматида часто всё же доходит до своего полюса, а последствия ошибки зависят от хромосомы и клетки. Модель не показывает, как ошибка распределения меняет дальнейший цикл."],"conditions":"Учебная модель · условная клетка 2n = 4; правила распределения — допущения модели.","sources":["src_01"],"base":"БИО-6·11, БИО-6·12","level":"adv","next_base":"counting-n-c","quiz":{"id":"S6-L14","question":"В модели все хромосомы прикреплены правильно, когезин разрезать нельзя, контроль работает. Каков исход?","options":[{"id":"S6-L14-1","text":"Дочерние клетки с 4 и 4 хромосомами","correct":false,"feedback":"Для этого хроматиды должны разойтись, а когезин не разрезан"},{"id":"S6-L14-2","text":"Хроматиды не расходятся","correct":true,"feedback":"Да: разрешение на анафазу есть, но связь хроматид не разрезана"},{"id":"S6-L14-3","text":"Задержка из-за сигнала кинетохоров","correct":false,"feedback":"Все кинетохоры прикреплены: сигнала нет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Три независимых условия деления","status":"Учебная модель · условная клетка 2n = 4; правила распределения — допущения","modes_label":"Сочетание","modes":["норма","не прикреплена + контроль","не прикреплена + обход","когезин не режется","меротелическое"],"args":[{"attach":"all","release":"allowed","control":"on"},{"attach":"unattached1","release":"allowed","control":"on"},{"attach":"unattached1","release":"allowed","control":"bypass"},{"attach":"all","release":"blocked","control":"on"},{"attach":"merotelic1","release":"allowed","control":"on"}],"notes":["4 и 4","Задержка перед анафазой (прометафаза)","5 и 3; хроматиды неприкреплённой хромосомы остались на месте","Хроматиды не расходятся","Без задержки; 4 и 4 или 5 и 3"],"static":["Пять сочетаний трёх условий и их исходы"],"scene":"s6_a2","L":{"s6_a2_aneu":"лишняя / недостающая хромосома","s6_a2_delay":"Задержка перед анафазой (прометафаза)","s6_a2_nosep":"Хроматиды не расходятся","s6_a2_perm":"анафаза разрешена","s6_a2_sep":"хроматиды разошлись","s6_a2_sig":"сигнал","s6_a2_unit":"хромосом в каждой дочерней клетке","s6_no":"нет","s6_or":"или","s6_yes":"да"}}}},{"id":"kfiber-count","num":15,"section":1,"questions":[2],"title":"Сколько микротрубочек держит кинетохор клетки человека?","keywords":[],"lead":["Сверх программы. Кинетохор связан не с одной микротрубочкой, а с пучком — кинетохорным волокном. Учебники называют для клеток животных от 10 до 40 микротрубочек на кинетохор. Сколько их на самом деле в клетке человека и все ли они доходят до полюса?"],"mechanism":["Целые метафазные веретёна клеток человека линии HeLa реконструировали в трёх измерениях по 22–35 последовательным срезам толщиной около 0,3 мкм в электронном микроскопе и проследили каждую микротрубочку. В среднем кинетохорное волокно состояло примерно из девяти микротрубочек, и их число не зависело от положения хромосомы в веретене. Примерно половина микротрубочек волокна доходила до полюса, остальные заканчивались в теле веретена, часть из них — вплотную к другим микротрубочкам."],"paragraphs":["Значит, связь кинетохора с полюсом в клетках человека не всегда прямая; это согласуется с представлением, что волокно связано с полюсом и через другие микротрубочки, но силы в работе не измеряли.","<b>Что уточняет эта работа?<\/b> Число микротрубочек на кинетохоре зависит от типа клеток и может быть меньше, чем указывают учебники; волокно — не жёсткий пучок от кинетохора до полюса. <b>Как это узнали.<\/b> Клетки быстро замораживали в метафазе, делали серии срезов и по ним восстанавливали ход всех микротрубочек; так изучили три веретена, около 300 кинетохоров.","<b>Ограничения.<\/b> Изучены опухолевые клетки одной линии в метафазе; для других клеток и фаз числа могут быть иными."],"conditions":"Схема по данным работы, упрощённая: показано одно кинетохорное волокно.","sources":["src_01","src_06"],"base":"БИО-6·9, БИО-6·11","level":"adv","next_base":"counting-n-c","quiz":{"id":"S6-L15","question":"Сколько микротрубочек кинетохорного волокна в клетках HeLa доходит до полюса?","options":[{"id":"S6-L15-1","text":"Все без исключения","correct":false,"feedback":"Работа показала, что до полюса доходит лишь около половины"},{"id":"S6-L15-2","text":"Ни одна","correct":false,"feedback":"Около половины микротрубочек волокна доходит до полюса"},{"id":"S6-L15-3","text":"Примерно половина","correct":true,"feedback":"Да: остальные заканчиваются в теле веретена"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько микротрубочек держит кинетохор?","status":"Схема по данным работы, упрощённая · одно волокно","modes_label":"Режим","modes":["волокно","до полюса","учебник и работа"],"args":[{"mode":1},{"mode":2},{"mode":3}],"notes":["В среднем около девяти микротрубочек в волокне (клетки HeLa, метафаза)","Около половины доходит до полюса, остальные заканчиваются в теле веретена","Учебник: 10–40 микротрубочек на кинетохор клеток животных; в клетках HeLa — около девяти"],"static":["Кинетохорное волокно из ~9 микротрубочек, половина из них доходит до полюса"],"scene":"s6_r_kfiber","L":{"s6_kf_axis":"число микротрубочек","s6_kf_book":"учебник: 10–40 у клеток животных","s6_kf_cmp":"Микротрубочек на кинетохор","s6_kf_hela":"клетки HeLa: около девяти","s6_kf_n1":"≈ 9 микротрубочек в волокне (клетки HeLa, метафаза)","s6_kf_n2":"Около половины доходит до полюса, остальные заканчиваются в теле веретена","s6_kf_other":"другие микротрубочки","s6_kfiber":"кинетохорное волокно","s6_pole":"полюс"}}}},{"id":"counting-n-c","num":16,"section":2,"questions":[3],"title":"Как считать хромосомы и ДНК: n, c, момент и единица подсчёта","keywords":["Гаплоидный набор (n)","Количество ДНК (c)","Диплоидная клетка","Хромосома"],"lead":["[[T46|Гаплоидный набор]] обозначают n: у человека n = 23. [[T47|Количество ДНК]] гаплоидного набора нереплицированных хромосом обозначают c. [[T88|Диплоидная клетка]] человека в G1 — 2n2c: 46 хромосом, каждая из одной молекулы ДНК."],"mechanism":["Правила подсчёта. Первое: число [[T45|хромосом]] равно числу центромер; две сестринские хроматиды, связанные когезином, — одна хромосома. Второе: количество ДНК равно числу молекул ДНК, то есть хроматид. Третье: у каждой записи нужно указать момент и единицу — клетку или ядро. Митоз диплоидной клетки: G1 — 2n2c; после S — 2n4c (число хромосом не изменилось, ДНК удвоена); профаза и метафаза — 2n4c; анафаза — 4n4c на всю клетку: центромеры разделились, и каждая хроматида стала хромосомой; после цитокинеза — 2n2c в каждой дочерней клетке."],"paragraphs":["Пример ловушки: в телофазе до цитокинеза в клетке два ядра; на одно ядро — 2n2c, на всю клетку — 4n4c. Обе записи верны, если указана единица. У человека в метафазе митоза 46 хромосом, 92 хроматиды и 92 молекулы ДНК; в анафазе — 92 хромосомы на клетку. Подсчёты для мейоза — БИО-6·19 и БИО-6·20.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.1–3.2.","<b>Ограничения.<\/b> Запись n/c не учитывает ДНК митохондрий и неравенство размеров хромосом."],"conditions":"Схема качественная: условная клетка с 2n = 4; у человека 2n = 46.","sources":["src_01"],"base":"БИО-6·1, БИО-6·8, БИО-6·13","quiz":{"id":"S6-L16","question":"Сколько хромосом в клетке человека в анафазе митоза, до цитокинеза?","options":[{"id":"S6-L16-1","text":"92: хроматиды стали хромосомами","correct":true,"feedback":"Да: центромеры разделились, запись на клетку — 4n4c"},{"id":"S6-L16-2","text":"46, как во всех фазах митоза","correct":false,"feedback":"После разделения центромер число хромосом в клетке удваивается до цитокинеза"},{"id":"S6-L16-3","text":"23, как в гамете","correct":false,"feedback":"Митоз не уменьшает набор: в каждой дочерней клетке будет 46"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как считать хромосомы и ДНК?","status":"Схема качественная · условная клетка 2n = 4; у человека 2n = 46","modes_label":"Момент","modes":["G1","после S","метафаза","анафаза: клетка","телофаза: клетка и ядро"],"args":[{"proc":"mitosis","moment":"G1"},{"proc":"mitosis","moment":"G2"},{"proc":"mitosis","moment":"metaphase"},{"proc":"mitosis","moment":"anaphase"},{"proc":"mitosis","moment":"telophase","both":true}],"notes":["2n2c на клетку: 4 хромосомы (человек — 46)","2n4c на клетку: 4 хромосомы, 8 хроматид","2n4c на клетку","4n4c на клетку: 8 хромосом (человек — 92)","Клетка 4n4c, каждое ядро 2n2c"],"static":["Подсчёт хромосом по центромерам и ДНК по хроматидам на пяти моментах митоза"],"scene":"s6_t3a","L":{"s6_nc_counts":"хромосом: {c} (у человека — {h})","s6_per_cell":"на клетку","s6_per_nuc":"на ядро"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E10","question":"Сколько хромосом в клетке человека после митоза без цитокинеза?","options":[{"id":"S6-E10-1","text":"92 — по 46 в каждом из двух ядер","correct":true,"feedback":"Да: на клетку 4n4c, на ядро 2n2c"},{"id":"S6-E10-2","text":"46 — как в обычной клетке тела","correct":false,"feedback":"Ядер два, и в каждом полный набор"},{"id":"S6-E10-3","text":"23 — набор уменьшился","correct":false,"feedback":"Митоз не уменьшает набор"}]}},{"id":"homologs-synapsis","num":17,"section":2,"questions":[3],"title":"Гомологичные хромосомы и синапсис в профазе мейоза I","keywords":["Мейоз","Гомологичные хромосомы","Профаза I","Синапсис (конъюгация)","Синаптонемный комплекс","Бивалент"],"lead":["[[T49|Мейоз]] — два последовательных деления после одного удвоения ДНК; из диплоидной клетки образуются четыре гаплоидные. Первое деление начинается с длинной профазы, в которой сближаются [[T48|гомологичные хромосомы]] — материнская и отцовская копии одной хромосомы."],"mechanism":["[[T52|Профазу I]] делят на пять стадий. В лептотене удвоенные хромосомы начинают конденсироваться, и в ДНК возникают запрограммированные двуцепочечные разрывы — с них начинается рекомбинация. В зиготене гомологи сближаются и соединяются по всей длине — это [[T53|синапсис (конъюгация)]]; между ними собирается белковая «лестница» — [[T54|синаптонемный комплекс]]. В пахитене синапсис завершён, а участки ДНК обмениваются между гомологами. Пара соединённых гомологов — [[T55|бивалент]] — содержит четыре хроматиды. В диплотене синаптонемный комплекс разбирается, и гомологи остаются связанными только в местах обмена. В диакинезе хромосомы максимально конденсированы, исчезает ядрышко, разбирается ядерная оболочка."],"paragraphs":["Подсчёт в пахитене: число хромосом — 2n, ДНК — 4c на клетку; у человека — 23 бивалента, 46 хромосом, 92 хроматиды. Синапсис не уменьшает число хромосом: гомологи сближены, но не слиты. Профаза I длится долго: у мыши — несколько суток, а у женщин — от плодного периода до овуляции, то есть годы и десятилетия (БИО-6·21).","<b>На практикуме.<\/b> Вкладка 3, шаг 3.3.","<b>Ограничения.<\/b> Стадии профазы I — учебное деление непрерывного процесса."],"conditions":"Схема по строению бивалента, упрощённая: синаптонемный комплекс показан лестницей.","sources":["src_01"],"base":"БИО-6·16","quiz":{"id":"S6-L17","question":"Сколько хромосом и хроматид в клетке человека в пахитене мейоза I?","options":[{"id":"S6-L17-1","text":"23 хромосомы, 92 хроматиды","correct":false,"feedback":"Синапсис не уменьшает число хромосом: гомологи сближены, но их по-прежнему 46"},{"id":"S6-L17-2","text":"46 хромосом, 92 хроматиды","correct":true,"feedback":"Да: 23 бивалента, запись на клетку — 2n4c"},{"id":"S6-L17-3","text":"46 хромосом, 46 хроматид","correct":false,"feedback":"ДНК уже удвоена: в каждой хромосоме две хроматиды"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как гомологи соединяются в профазе I?","status":"Схема по строению бивалента, упрощённая · стадии — учебное деление","modes_label":"Стадия","modes":["лептотена","зиготена","пахитена","диплотена","диакинез"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4},{"stage":5}],"notes":["Конденсация, начало рекомбинации","Синапсис: сборка синаптонемного комплекса","Синапсис завершён, идёт обмен; 2n4c на клетку","Комплекс разобран, гомологи связаны хиазмами","Максимальная конденсация, оболочка разбирается"],"static":["Пять стадий профазы I одного бивалента"],"scene":"s6_t3b","L":{"s6_biv_nc":"бивалент: 2 хромосомы, 4 хроматиды; 2n4c на клетку","s6_chiasma":"хиазма","s6_dsb":"разрывы ДНК начинают рекомбинацию","s6_hom_m":"материнский гомолог (m)","s6_hom_p":"отцовский гомолог (p)","s6_sc":"синаптонемный комплекс"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E02","question":"Что такое бивалент?","options":[{"id":"S6-E02-1","text":"Две хроматиды одной хромосомы","correct":false,"feedback":"Это хромосома после S-фазы, а не бивалент"},{"id":"S6-E02-2","text":"Пара соединённых гомологов","correct":true,"feedback":"Да: в нём четыре хроматиды и две центромеры"},{"id":"S6-E02-3","text":"Хромосома с двумя центромерами","correct":false,"feedback":"В биваленте две хромосомы, у каждой своя центромера"}]}},{"id":"crossing-over","num":18,"section":2,"questions":[3],"title":"Кроссинговер и хиазмы: обмен и связь","keywords":["Кроссинговер","Хиазма"],"lead":["[[T56|Кроссинговер]] — обмен участками между несестринскими хроматидами гомологичных хромосом."],"mechanism":["Обмен начинается с запрограммированного двуцепочечного разрыва в ДНК одной хроматиды. Конец разорванной ДНК находит соответствующий участок несестринской хроматиды гомолога, и после ряда превращений участки хроматид обмениваются. Не каждый разрыв даёт обмен: у человека в каждой паре гомологов обычно происходит два-три обмена. Место обмена становится видно в диплотене как [[T57|хиазма]] — перекрест хроматид гомологов."],"paragraphs":["У кроссинговера две функции. Первая — генетическая: хромосомы гамет несут новые сочетания материнских и отцовских аллелей, а сестринские хроматиды одной хромосомы перестают быть одинаковыми. Вторая — механическая: хиазма вместе с когезином на плечах сестринских хроматид удерживает гомологи вместе до анафазы I, и только связанная пара правильно ориентируется в веретене. Поэтому обычно на каждый бивалент приходится хотя бы один обмен.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.4; продвинутый уровень A3 — кроссинговер в паре A.","<b>Ограничения.<\/b> Промежуточные структуры рекомбинации не показаны."],"conditions":"Схема качественная: место обмена и длина участков условны.","sources":["src_01"],"base":"БИО-6·17","quiz":{"id":"S6-L18","question":"Между какими хроматидами происходит кроссинговер?","options":[{"id":"S6-L18-1","text":"Между сестринскими хроматидами одного гомолога","correct":false,"feedback":"Сестринские хроматиды одинаковы; обмен между ними не создаёт новых сочетаний"},{"id":"S6-L18-2","text":"Между хромосомами разных пар","correct":false,"feedback":"Кроссинговер идёт между гомологами одной пары"},{"id":"S6-L18-3","text":"Между несестринскими хроматидами гомологов","correct":true,"feedback":"Да: обмениваются участки материнской и отцовской хромосом"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что даёт кроссинговер?","status":"Схема качественная · место обмена условно","modes_label":"Этап","modes":["1 разрыв","2 обмен","3 хиазма","4 итог"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Двуцепочечный разрыв в одной хроматиде","Обмен участками с несестринской хроматидой","Хиазма удерживает гомологи до анафазы I","Сестринские хроматиды каждого гомолога теперь различаются"],"static":["Кроссинговер между несестринскими хроматидами и хиазма"],"scene":"s6_r_crossover","L":{"s6_break":"разрыв ДНК","s6_chiasma":"хиазма","s6_exch":"обмен участками с несестринской хроматидой","s6_hom_m":"материнский гомолог (m)","s6_hom_p":"отцовский гомолог (p)","s6_nonsis":"внутренние хроматиды — несестринские","s6_xo_result":"Сестринские хроматиды каждого гомолога теперь различаются"}}}},{"id":"meiosis-one","num":19,"section":2,"questions":[3],"title":"Мейоз I: расходятся гомологи, а не хроматиды","keywords":["Мейоз I","Шугошин","Независимое расхождение гомологов","Гамета"],"lead":["[[T50|Мейоз I]] — редукционное деление: каждая дочерняя клетка получает по одному гомологу из каждой пары."],"mechanism":["В метафазе I на экваторе выстраиваются биваленты. Два сестринских кинетохора одного гомолога действуют вместе и прикрепляются к микротрубочкам одного полюса, а кинетохоры гомолога — к противоположному. В анафазе I сепараза разрезает когезин на плечах хромосом, связь в местах хиазм исчезает, и гомологи расходятся. Когезин у центромер в это время защищён белком [[T58|шугошином]], поэтому сестринские хроматиды остаются вместе. Каждый бивалент ориентируется независимо от других: к одному полюсу может отойти материнский гомолог одной пары и отцовский — другой. Это [[T59|независимое расхождение гомологов]]: число вариантов набора хромосом в [[T91|гамете]] равно 2ⁿ, у человека 2²³ — больше 8 миллионов, без учёта кроссинговера."],"paragraphs":["Подсчёт: в анафазе I на клетку — 2n4c (центромеры не разделились, хромосом по-прежнему 46); после мейоза I в каждой клетке — 1n2c: 23 хромосомы, каждая из двух хроматид. Число хромосом уменьшается вдвое уже в первом делении, а количество ДНК после каждого деления уменьшается вдвое.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.5–3.6.","<b>Ограничения.<\/b> Механизм совместной ориентации сестринских кинетохоров не разбирается."],"conditions":"Схема качественная, две панели: А — метафаза I, два варианта ориентации бивалентов; Б — анафаза I.","sources":["src_01"],"base":"БИО-6·17, БИО-6·18, БИО-6·12","quiz":{"id":"S6-L19","question":"Почему в анафазе I сестринские хроматиды не расходятся?","options":[{"id":"S6-L19-1","text":"Когезин у центромер защищён","correct":true,"feedback":"Да: шугошин сохраняет центромерный когезин до мейоза II"},{"id":"S6-L19-2","text":"Кинетохоров у хроматид нет","correct":false,"feedback":"Кинетохоры есть, но сестринские прикреплены к одному полюсу"},{"id":"S6-L19-3","text":"Сепараза в мейозе не работает","correct":false,"feedback":"Сепараза работает и разрезает когезин на плечах"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему в мейозе I расходятся гомологи?","status":"Схема качественная · условный организм n = 2","modes_label":"Панель","modes":["А ориентация 1","А′ ориентация 2","Б анафаза I"],"args":[{"orient":[0,0]},{"orient":[0,1]},{"stage":"anaphaseI"}],"notes":["Материнские гомологи обеих пар к полюсу 1","Пары ориентированы независимо: смешанный набор у полюса","Когезин на плечах разрезан, у центромер защищён: расходятся гомологи; на клетку 2n4c, после цитокинеза 1n2c"],"static":["Метафаза I с двумя вариантами ориентации и анафаза I"],"scene":"s6_t3c","L":{"s6_ana1":"Когезин на плечах разрезан, у центромер защищён: расходятся гомологи","s6_ana1_nc":"на клетку 2n4c, после цитокинеза 1n2c","s6_pole1":"полюс 1","s6_pole1_set":"у полюса 1: {s}","s6_pole2":"полюс 2","s6_sgo_cen":"шугошин защищает когезин у центромер"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E06","question":"Что такое анеуплоидия?","options":[{"id":"S6-E06-1","text":"Удвоение всего набора хромосом","correct":false,"feedback":"Это полиплоидия: набор остаётся сбалансированным"},{"id":"S6-E06-2","text":"Потеря участка одной хромосомы","correct":false,"feedback":"Это изменение строения хромосомы, а не их числа"},{"id":"S6-E06-3","text":"Лишняя или недостающая хромосома","correct":true,"feedback":"Да: число хромосом отличается от кратного гаплоидному набору"}]}},{"id":"meiosis-two","num":20,"section":2,"questions":[3],"title":"Мейоз II: деление без новой S-фазы","keywords":["Мейоз II"],"lead":["Между мейозом I и мейозом II ДНК не удваивается. [[T51|Мейоз II]] — эквационное деление: расходятся сестринские хроматиды, как в митозе, но в клетке с гаплоидным набором."],"mechanism":["В метафазе II сестринские кинетохоры каждой хромосомы прикрепляются к противоположным полюсам. В анафазе II защита центромерного когезина снимается, сепараза разрезает его, и хроматиды расходятся. Подсчёт: после мейоза I — 1n2c; в анафазе II на клетку — 2n2c (центромеры разделились); после мейоза II — 1n1c в каждой из четырёх клеток. Отсутствие S-фазы между делениями — условие редукции: одно удвоение ДНК приходится на два деления."],"paragraphs":["Сравнение с митозом: и в анафазе митоза, и в анафазе II расходятся сестринские хроматиды, но митоз начинается с 2n4c и даёт 2n2c, а мейоз II начинается с 1n2c и даёт 1n1c. Из-за кроссинговера сестринские хроматиды, расходящиеся в мейозе II, генетически не одинаковы.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.6; продвинутый уровень A3.","<b>Ограничения.<\/b> Между делениями может быть короткий промежуток — интеркинез; в некоторых клетках его нет."],"conditions":"Схема качественная: условная клетка с n = 2.","sources":["src_01"],"base":"БИО-6·19","quiz":{"id":"S6-L20","question":"Чем анафаза II отличается от анафазы митоза той же диплоидной клетки по числу хромосом?","options":[{"id":"S6-L20-1","text":"Ничем: в обеих расходятся хроматиды","correct":false,"feedback":"Механизм сходный, но набор в мейозе II уже гаплоидный"},{"id":"S6-L20-2","text":"В анафазе II вдвое меньше хромосом","correct":true,"feedback":"Да: 2n2c против 4n4c — мейоз II начинается с гаплоидного набора"},{"id":"S6-L20-3","text":"В анафазе II вдвое больше хромосом","correct":false,"feedback":"Наоборот: после мейоза I хромосом вдвое меньше"}]},"widget":{"kind":"dna","title":"","s":{"title":"Мейоз II без S-фазы","status":"Схема качественная · условный организм n = 2","modes_label":"Момент","modes":["метафаза II","анафаза II","после мейоза II","сравнение с митозом"],"args":[{"stage":"metaII"},{"stage":"anaII"},{"stage":"afterII"},{"stage":"compare"}],"notes":["1n2c на клетку; S-фазы между делениями не было","2n2c на клетку","1n1c в каждой из четырёх клеток","На клетку: митоз 2n4c → 2n2c; мейоз II 1n2c → 1n1c"],"static":["Мейоз II и его сравнение с митозом"],"scene":"s6_t3d","L":{"s6_chromatids1":"по одной хроматиде в хромосоме","s6_cmp_m2":"мейоз II","s6_cmp_mit":"митоз","s6_four_cells":"четыре клетки","s6_no_s":"S-фазы между делениями не было","s6_per_cell":"на клетку","s6_per_cell_each":"в каждой клетке","s6_pole1":"полюс 1","s6_pole2":"полюс 2"}},"zoomNarrow":true}},{"id":"sex-differences","num":21,"section":2,"questions":[3],"title":"Чем мейоз у мужчин отличается от мейоза у женщин?","keywords":["Сперматогенез","Сперматоцит","Сперматида","Оогенез","Ооцит","Полярное тельце"],"lead":["Последовательность хромосомных событий мейоза у мужчин и у женщин одна и та же. Различаются сроки, деление цитоплазмы и число образующихся гамет."],"mechanism":["[[T60|Сперматогенез]] начинается в период полового созревания и продолжается всю жизнь. Сперматогонии делятся митозом; часть их потомков становится [[T87|сперматоцитами I порядка]], которые вступают в мейоз. Мейоз I даёт два сперматоцита II порядка (1n2c), мейоз II — четыре [[T98|сперматиды]] (1n1c); цитоплазма делится почти поровну, и все четыре клетки превращаются в сперматозоиды. [[T61|Оогенез]] начинается до рождения: [[T86|ооциты I порядка]] вступают в мейоз в плодном периоде и останавливаются в профазе I, в диплотене, на годы и десятилетия. Перед овуляцией ооцит завершает мейоз I: деление резко неравное, почти вся цитоплазма остаётся в ооците II порядка, а лишний набор хромосом уходит в маленькое [[T62|полярное тельце]]. Ооцит останавливается в метафазе II и завершает мейоз только после оплодотворения, отделяя второе полярное тельце."],"paragraphs":["Итог: из сперматоцита I порядка — четыре гаметы, из ооцита I порядка — одна яйцеклетка и полярные тельца; неравное деление сохраняет в яйцеклетке запасы и органоиды для зародыша. Веретено ооцита человека собирается без центросом. Ошибки распределения хромосом в ооцитах человека часты и учащаются с возрастом; полученная от гаметы лишняя или недостающая хромосома — [[T63|анеуплоидия]] — частая причина гибели зародышей.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.7.","<b>Ограничения.<\/b> Гормональная регуляция оогенеза и то, что происходит дальше с полярными тельцами, не разбираются."],"conditions":"Схема качественная, две панели: А — сперматогенез, Б — оогенез; размеры клеток не в масштабе.","sources":["src_01"],"base":"БИО-6·19, БИО-6·20","quiz":{"id":"S6-L21","question":"На какой стадии находится ооцит человека при овуляции?","options":[{"id":"S6-L21-1","text":"В профазе I","correct":false,"feedback":"В профазе I ооцит находится до созревания фолликула; перед овуляцией мейоз I завершается"},{"id":"S6-L21-2","text":"После мейоза II","correct":false,"feedback":"Мейоз II завершается только после оплодотворения"},{"id":"S6-L21-3","text":"В метафазе II","correct":true,"feedback":"Да: мейоз I завершён, мейоз II завершится после оплодотворения"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются сперматогенез и оогенез?","status":"Схема качественная · размеры клеток не в масштабе","modes_label":"Панель","modes":["А сперматогенез","Б оогенез"],"args":[{"sex":"m"},{"sex":"f"}],"notes":["Четыре сперматиды 1n1c; цитоплазма делится почти поровну","Остановка в профазе I (годы); мейоз I перед овуляцией; остановка в метафазе II; мейоз II после оплодотворения"],"static":["Сперматогенез — четыре гаметы; оогенез — одна яйцеклетка и полярные тельца"],"scene":"s6_t3e","L":{"s6_arrest_m2":"остановка в метафазе II","s6_arrest_p1":"остановка в профазе I (годы)","s6_egg":"оплодотворённая яйцеклетка","s6_fert":"после оплодотворения","s6_oo1":"ооцит I порядка","s6_oo2":"ооцит II порядка","s6_oo_n":"Оогенез — одна яйцеклетка и полярные тельца","s6_oo_t":"Б. Оогенез","s6_ovul":"перед овуляцией","s6_pb1":"первое полярное тельце","s6_pb2":"второе полярное тельце","s6_spc1":"сперматоцит I порядка","s6_spc2":"сперматоциты II порядка","s6_sperm_n":"Четыре сперматиды 1n1c; цитоплазма делится почти поровну","s6_sperm_t":"А. Сперматогенез","s6_spt":"сперматиды"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E05","question":"Что образуется из одного сперматоцита I порядка после мейоза?","options":[{"id":"S6-E05-1","text":"Две клетки 1n2c","correct":false,"feedback":"Это результат только мейоза I"},{"id":"S6-E05-2","text":"Четыре сперматиды 1n1c","correct":true,"feedback":"Да; цитоплазма делится почти поровну"},{"id":"S6-E05-3","text":"Одна клетка и три полярных тельца","correct":false,"feedback":"Так завершается оогенез, а не сперматогенез"}]}},{"id":"two-divisions","num":22,"section":2,"questions":[3],"title":"Одна удвоенная ДНК — два разных деления: митоз и мейоз","keywords":[],"lead":["Сверх программы. Учебная модель условной клетки с 2n = 4: две пары гомологов, A и B; в каждой паре материнский (m) и отцовский (p) гомолог. После S-фазы клетка одна и та же — 2n4c, — а дальше идёт либо митоз, либо мейоз."],"mechanism":["Правила модели. Митоз: сестринские хроматиды каждой хромосомы расходятся к разным полюсам, и обе дочерние клетки получают все четыре хромосомы: Am, Ap, Bm, Bp — 2n2c. Мейоз I: биваленты ориентируются независимо; переключатели задают, какой гомолог каждой пары обращён к полюсу 1. Мейоз II идёт без новой S-фазы. Подсчёт на клетку по стадиям: G1 — 2n2c; после S — 2n4c; метафаза I — 2n4c; анафаза I — 2n4c; после мейоза I — 1n2c; анафаза II — 2n2c; после мейоза II — 1n1c. Четыре сочетания ориентаций дают четыре варианта гамет (Am Bm, Am Bp, Ap Bm, Ap Bp) — 2ⁿ при n = 2."],"paragraphs":["Переключатель «кроссинговер в паре A» делает вторую хроматиду каждого гомолога пары A смешанной, и из одной клетки мейоза I выходят две гаметы с разными вариантами хромосомы A. Инварианты модели: в каждой гамете по одной хромосоме каждой пары; сумма ДНК дочерних клеток равна ДНК исходной клетки; число хромосом в одной клетке меняется только в анафазе (разделение центромер) и при цитокинезе. <b>Обратная задача.<\/b> В клетке 2 хромосомы, каждая из двух хроматид. Это клетка после мейоза I (1n2c) или в метафазе II; после митоза такой клетки быть не может.","<b>Ограничения.<\/b> Ориентация в мейозе II в модели фиксирована; кроссинговер показан только в паре A и в одном месте."],"conditions":"Учебная модель · условная клетка 2n = 4; ориентация в мейозе II и место кроссинговера — допущения.","sources":["src_01"],"base":"БИО-6·16, БИО-6·19, БИО-6·20","level":"adv","next_base":"division-death-balance","quiz":{"id":"S6-L22","question":"Сколько разных по набору хромосом гамет дают все сочетания ориентаций бивалентов в модели без кроссинговера?","options":[{"id":"S6-L22-1","text":"Четыре: 2ⁿ при n = 2","correct":true,"feedback":"Да: каждая из двух пар ориентируется независимо"},{"id":"S6-L22-2","text":"Две: материнский и отцовский набор","correct":false,"feedback":"Пары ориентируются независимо, поэтому возможны и смешанные наборы"},{"id":"S6-L22-3","text":"Восемь: по числу хроматид","correct":false,"feedback":"Число вариантов определяют пары гомологов, а не хроматиды"}]},"widget":{"kind":"dna","title":"","s":{"title":"Одна удвоенная ДНК — два деления","status":"Учебная модель · условная клетка 2n = 4","modes_label":"Сценарий","modes":["митоз","мейоз A:m B:m","мейоз A:m B:p","мейоз + кроссинговер"],"args":[{"div":"mitosis"},{"orient_A":0,"orient_B":0},{"orient_A":0,"orient_B":1},{"orient_A":0,"orient_B":1,"crossover_A":true}],"notes":["Две клетки Am Ap Bm Bp, 2n2c","Гаметы Am Bm ×2, Ap Bp ×2","Гаметы Am Bp ×2, Ap Bm ×2","Гаметы из одной клетки мейоза I различаются хромосомой A"],"static":["Одна клетка 2n4c: митоз и мейоз с разными ориентациями"],"scene":"s6_a3","L":{"s6_per_cell":"на клетку","s6_per_cell_each":"в каждой клетке"}}}},{"id":"cohesion-age","num":23,"section":2,"questions":[3],"title":"Почему в ооцитах с возрастом сестринские хроматиды расходятся раньше времени?","keywords":[],"lead":["Сверх программы. Когезин между сестринскими хроматидами ооцита закладывается ещё до рождения и, по данным на мышах, почти не обновляется до овуляции. В мейозе I его у центромер защищает шугошин. Что происходит с этой защитой у женщин старшего возраста?"],"mechanism":["В ооцитах человека, полученных при лечении бесплодия, белок шугошин 2 располагался не только вокруг центромер, но и «мостиком» между двумя сестринскими центромерами. У женщин 30 лет и моложе такой мостик был почти у всех пар сестринских хроматид в метафазе I и в метафазе II. С возрастом мостик пропадал всё чаще: у большинства женщин 36 лет и старше его не было на большинстве пар. Пары без мостика были раздвинуты сильнее, а в метафазе II у женщин старше 35 лет резко учащались одиночные хроматиды — разошедшиеся раньше времени. Если в ооцитах молодых женщин на протяжении мейоза I подавить киназу, необходимую для удержания шугошина 2 на месте, одиночных хроматид в метафазе II становилось больше, как у ооцитов старшего возраста."],"paragraphs":["Одиночная хроматида в метафазе II уже не связана с сестрой и при завершении мейоза может попасть в любую клетку — в яйцеклетку или в полярное тельце. Так возникают яйцеклетки с лишней или недостающей хромосомой.","<b>Что уточняет эта работа?<\/b> Схема «шугошин защищает центромерный когезин в мейозе I» дополняется возрастным звеном: с возрастом вместе с когезином теряется и его защита; что из этого причина, а что следствие, пока не установлено — исчезновение мостика может быть и следствием потери самого когезина. <b>Как это узнали.<\/b> Ооциты фиксировали в метафазе I и II, окрашивали шугошин и центромеры и подсчитывали хроматиды; затем проверяли, воспроизводит ли подавление киназы картину старших ооцитов.","<b>Ограничения.<\/b> Число ооцитов невелико, а связь с возрастом установлена сопоставлением; эксперимент с подавлением киназы в ооцитах молодых женщин воспроизводит часть картины, но подавленная киназа действует не только на шугошин 2. Анеуплоидия ооцитов имеет и другие причины."],"conditions":"Схема по данным работы, упрощённая: показаны две пары сестринских хроматид.","sources":["src_07"],"base":"БИО-6·19, БИО-6·21","level":"adv","next_base":"division-death-balance","quiz":{"id":"S6-L23","question":"Что чаще встречается в метафазе II у ооцитов женщин старше 35 лет?","options":[{"id":"S6-L23-1","text":"Лишние биваленты","correct":false,"feedback":"Бивалентов в метафазе II нет: гомологи разошлись в мейозе I"},{"id":"S6-L23-2","text":"Одиночные хроматиды","correct":true,"feedback":"Да: защита центромерного когезина ослаблена"},{"id":"S6-L23-3","text":"Хромосомы из трёх хроматид","correct":false,"feedback":"Хромосома состоит из одной или двух хроматид; дело в преждевременном разделении сестёр"}]},"widget":{"kind":"dna","title":"","s":{"title":"Защита когезина и возраст","status":"Схема по данным работы, упрощённая · две пары хроматид","modes_label":"Группа","modes":["30 лет и моложе","36 лет и старше","метафаза II"],"args":[{"mode":1},{"mode":2},{"mode":3}],"notes":["Мостик почти у всех пар сестринских хроматид","У большинства пар мостика нет; хроматиды раздвинуты сильнее","Одиночные хроматиды учащаются у женщин старше 35 лет"],"static":["Мостик шугошина 2 между сестринскими центромерами и его возрастная потеря"],"scene":"s6_r_sgo2","L":{"s6_pair_sis":"пара сестринских хроматид","s6_pole1":"полюс 1","s6_pole2":"полюс 2","s6_sgo_lab":"шугошин 2 вокруг сестринских центромер","s6_sgo_m2":"Метафаза II","s6_sgo_old":"36 лет и старше: у большинства пар мостика нет; хроматиды раздвинуты сильнее","s6_sgo_young":"30 лет и моложе: мостик почти у всех пар сестринских хроматид","s6_single":"одиночная хроматида"}}}},{"id":"division-death-balance","num":24,"section":3,"questions":[4],"title":"Число клеток задаёт баланс деления и гибели","keywords":["Апоптоз","Фагоцит","Некротическая гибель (некроз)","Воспаление","Регулируемая некротическая гибель"],"lead":["Число клеток в ткани определяется соотношением делений и гибели. Клеточная гибель — нормальная часть жизни многоклеточного организма, а не только последствие повреждения."],"mechanism":["Основной способ гибели клеток нашего тела — [[T64|апоптоз]]: клетка разбирается изнутри и быстро поглощается соседними клетками или [[T94|макрофагами]], не выпуская содержимого. Апоптоз удаляет клетки при развитии (например, промежутки между пальцами), лишние лимфоциты, клетки с неисправленным повреждением ДНК. Другой тип — [[T65|некротическая гибель (некроз)]]: клетка набухает и разрывается, её содержимое выходит наружу и вызывает [[T78|воспаление]]. Некротическая гибель бывает случайной — при тяжёлом остром повреждении, — но существуют и [[T66|регулируемые формы некротической гибели]], в которых клетка участвует в процессе собственными белками."],"paragraphs":["Важно различать три вещи: причину гибели (облучение, недостаток кислорода, сигнал от другой клетки), механизм (каспазы, отказ ионного гомеостаза, регулируемое разрушение мембраны) и наблюдаемый результат (форма клетки, мембрана, воспаление). Одна и та же причина может вызывать разные механизмы, а разные механизмы — сходный результат. Недостаток апоптоза способствует росту опухолей, избыток — потере клеток в тканях.","<b>На практикуме.<\/b> Вкладка 4.","<b>Ограничения.<\/b> Классификация упрощена до двух типов и регулируемых некротических форм; подробная классификация разбирается в курсе «Молекулярная биология»."],"conditions":"Схема качественная: два исхода гибели клетки в ткани.","sources":["src_01","src_02"],"base":"БИО-6·5","quiz":{"id":"S6-L24","question":"Почему в ткани, где ежедневно погибает много клеток путём апоптоза, мёртвых клеток почти не видно?","options":[{"id":"S6-L24-1","text":"Апоптоз происходит только в эмбрионе","correct":false,"feedback":"Апоптоз идёт и во взрослых тканях постоянно"},{"id":"S6-L24-2","text":"Погибшие клетки сразу растворяются","correct":false,"feedback":"Клетка разбирается упорядоченно и поглощается целиком или по частям"},{"id":"S6-L24-3","text":"Их быстро поглощают фагоциты","correct":true,"feedback":"Да: апоптотическую клетку поглощают раньше, чем она разрушится"}]},"widget":{"kind":"dna","title":"","s":{"title":"Баланс деления и гибели","status":"Схема качественная · два исхода гибели","modes_label":"Исход","modes":["деление","апоптоз","некротическая гибель"],"args":[{"mode":"div"},{"mode":"apo"},{"mode":"nec"}],"notes":["Число клеток растёт","Клетка поглощена без воспаления","Содержимое вышло — воспаление"],"static":["Число клеток — баланс деления и гибели; два типа гибели"],"scene":"s6_r_balance","L":{"s6_bal_apo":"Апоптоз: клетка поглощена макрофагом без воспаления","s6_bal_div":"Деление: число клеток растёт","s6_bal_nec":"Некротическая гибель: содержимое вышло — воспаление","s6_bal_rule":"Число клеток — баланс деления и гибели","s6_inflam":"воспаление","s6_tissue":"ткань"}}},"exam_quiz":{"id":"S6-E08","question":"Почему некротическая гибель вызывает воспаление, а апоптоз — нет?","options":[{"id":"S6-E08-1","text":"Каспазы привлекают иммунные клетки","correct":false,"feedback":"При некротической гибели каспазы обычно не активны"},{"id":"S6-E08-2","text":"Содержимое клетки выходит наружу","correct":true,"feedback":"Да: внутриклеточные молекулы во внеклеточной среде — сигнал повреждения"},{"id":"S6-E08-3","text":"Апоптоз идёт только в эмбрионе","correct":false,"feedback":"Апоптоз идёт и во взрослых тканях"}]}},{"id":"necrosis","num":25,"section":3,"questions":[4],"title":"Некротическая гибель: отказ ионного и энергетического гомеостаза","keywords":["Na⁺/K⁺-насос"],"lead":["Самый частый путь к некротической гибели — нехватка АТФ, например при остановке кровоснабжения: без кислорода митохондрии перестают синтезировать АТФ."],"mechanism":["[[T77|Na⁺/K⁺-насос]] плазматической мембраны тратит АТФ и постоянно выкачивает Na⁺, компенсируя его утечку в клетку. Без АТФ насос останавливается, Na⁺ и Cl⁻ накапливаются в клетке, за ними по осмотическому градиенту входит вода, и клетка набухает. Набухают и органоиды, в цитозоле растёт концентрация Ca²⁺; перегрузка цитозоля Ca²⁺ через повреждение митохондрий может запустить и регулируемую некротическую гибель. Наконец плазматическая мембрана разрывается, содержимое клетки выходит наружу; внутриклеточные молекулы во внеклеточной среде служат сигналами повреждения для иммунных клеток, и в ткани развивается воспаление."],"paragraphs":["Каспазы при такой гибели не активируются; ядро не распадается на упорядоченные фрагменты, ДНК разрушается беспорядочно. Ранний признак — набухание при ещё неповреждённой мембране, поздний — её разрыв; по сравнению с апоптозом в культуре мембрана рвётся раньше. Некротическую морфологию дают и регулируемые пути: в них мембрану разрушают особые белки клетки, а запаса АТФ в начале процесса может хватать.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.2–4.3.","<b>Ограничения.<\/b> Последовательность событий показана для острого энергетического отказа; при других причинах начало процесса иное."],"conditions":"Схема качественная: последовательность событий — учебное деление.","sources":["src_01","src_02","src_03"],"base":"БИО-6·24; вспомнить БИО-1·17 («Как работает Na⁺/K⁺-АТФаза?»), БИО-1·21 («Стационарное состояние: остановка насоса, утечка и разные причины одного результата») и БИО-5·24 («Как дыхательная цепь создаёт протонный градиент?»)","quiz":{"id":"S6-L25","question":"Почему клетка, оставшаяся без АТФ, набухает?","options":[{"id":"S6-L25-1","text":"Встаёт Na⁺/K⁺-насос, входят ионы и вода","correct":true,"feedback":"Да: Na⁺ и Cl⁻ копятся в клетке, вода идёт по осмотическому градиенту"},{"id":"S6-L25-2","text":"Каспазы разрушают мембрану","correct":false,"feedback":"При энергетическом отказе каспазы не активируются"},{"id":"S6-L25-3","text":"Вода выкачивается из клетки насосами","correct":false,"feedback":"Насосы перекачивают ионы, а не воду; здесь они остановлены"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как нехватка АТФ ведёт к разрыву мембраны?","status":"Схема качественная · путь энергетического отказа","modes_label":"Этап","modes":["1 насос стоит","2 ионы и вода","3 органоиды","4 разрыв"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Без АТФ насос не выкачивает Na⁺","Na⁺ и Cl⁻ копятся, входит вода; клетка набухает","Набухают органоиды, в цитозоле растёт Ca²⁺","Мембрана рвётся, содержимое выходит; в ткани — воспаление"],"static":["Нехватка АТФ → остановка насоса → вход ионов и воды → набухание → разрыв"],"scene":"s6_t4a","L":{"s6_inflam":"воспаление","s6_nec1":"Без АТФ Na⁺/K⁺-насос останавливается","s6_nec2":"Na⁺ и Cl⁻ входят по путям утечки и накапливаются, за ними входит вода — клетка набухает","s6_nec3":"Набухают органоиды, в цитозоле растёт концентрация Ca²⁺","s6_nec4":"Плазматическая мембрана разрывается, содержимое выходит; в ткани — воспаление","s6_outside":"внеклеточная среда","s6_pump":"Na⁺/K⁺-насос","s6_water":"вода входит вслед за ионами"}},"zoomNarrow":true}},{"id":"caspases","num":26,"section":3,"questions":[4],"title":"Апоптоз: каскад каспаз разбирает клетку","keywords":["Каспазы","Инициаторная каспаза","Исполнительная каспаза","Апоптотические тельца","Фосфатидилсерин","Вторичный некроз"],"lead":["Апоптоз выполняют [[T67|каспазы]] — протеазы, которые расщепляют белки после остатка аспарагиновой кислоты. Они синтезируются в неактивной форме и активируются каскадом."],"mechanism":["[[T68|Инициаторные каспазы]] активируются, когда их молекулы сближаются на особом белковом комплексе. Они расщепляют и тем активируют [[T69|исполнительные каспазы]], а те — сотни белков клетки. Расщепление ламинов разбирает ядерную ламину; расщепление ингибитора особой нуклеазы освобождает её, и ДНК режется на фрагменты; перестройка актина коры даёт пузыри мембраны; расщепление белков адгезии отделяет клетку от соседей. Клетка уменьшается, хроматин конденсируется, ядро распадается на фрагменты, клетка делится на [[T75|апоптотические тельца]], окружённые мембраной. На наружную сторону плазматической мембраны выходит [[T74|фосфатидилсерин]] — сигнал «съешь меня» для фагоцитов."],"paragraphs":["Пока клетку не поглотили, её мембрана остаётся неповреждённой: содержимое не выходит, и воспаления нет. Каспазный каскад самоусиливается: каждая активная каспаза активирует много молекул следующей. Апоптоз требует энергии: для сборки апоптосомы нужен АТФ (или дАТФ; БИО-6·27). Поэтому апоптоз идёт в клетках, где АТФ ещё есть, а при резкой нехватке АТФ гибель идёт по некротическому типу. Если апоптотическую клетку никто не поглотил — например, в культуре клеток без фагоцитов, — её мембрана позднее теряет целостность: это [[T76|вторичный некроз]].","<b>На практикуме.<\/b> Вкладка 4, шаг 4.1 и конструктор «нет фагоцитов».","<b>Ограничения.<\/b> Названы только основные мишени каспаз."],"conditions":"Схема качественная: последовательность морфологических изменений — учебное деление.","sources":["src_01","src_03","src_04"],"base":"БИО-6·24; вспомнить БИО-1·2 («Из чего состоит плазматическая мембрана и какие у неё функции?»)","quiz":{"id":"S6-L26","question":"Что служит для фагоцита сигналом поглотить апоптотическую клетку?","options":[{"id":"S6-L26-1","text":"Разрыв плазматической мембраны","correct":false,"feedback":"Апоптотическую клетку поглощают при неповреждённой мембране"},{"id":"S6-L26-2","text":"Фосфатидилсерин на наружной стороне мембраны","correct":true,"feedback":"Да: в живой клетке он находится на внутренней стороне бислоя"},{"id":"S6-L26-3","text":"Выход содержимого клетки в окружающую ткань","correct":false,"feedback":"Так проявляется некротическая гибель; при апоптозе содержимое не выходит"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как каспазы разбирают клетку?","status":"Схема качественная · названы основные мишени","modes_label":"Этап","modes":["1 инициатор","2 исполнители","3 мишени","4 тельца","5 без фагоцитов"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4},{"stage":5}],"notes":["Сближение молекул инициаторной каспазы","Каскад: исполнительные каспазы","Ламина разобрана, ДНК режется, пузыри мембраны","Тельца с фосфатидилсерином снаружи поглощает макрофаг","Без фагоцитов мембрана позднее теряет целостность — вторичный некроз"],"static":["Каскад каспаз и морфология апоптоза; вторичный некроз без фагоцитов"],"scene":"s6_t4b","L":{"s6_abody":"апоптотические тельца","s6_blebs":"пузыри мембраны","s6_casp_e":"исполнительные каспазы","s6_casp_i":"инициаторная каспаза","s6_casp_n1":"Сближение молекул инициаторной каспазы","s6_casp_n2":"Каскад: исполнительные каспазы","s6_casp_n3":"Ламина разобрана, ДНК режется, пузыри мембраны","s6_casp_n4":"Тельца с фосфатидилсерином снаружи поглощает макрофаг","s6_casp_n5":"Без фагоцитов мембрана позднее теряет целостность — вторичный некроз","s6_dna_frag":"фрагменты ДНК","s6_lamina_cut":"ламина разобрана, ДНК режется нуклеазой","s6_nucleus":"ядро","s6_phago":"макрофаг","s6_plasma_mem":"плазматическая мембрана","s6_ps_out":"фосфатидилсерин на наружном слое"}},"zoomNarrow":true}},{"id":"mito-pathway","num":27,"section":3,"questions":[4],"title":"Роль митохондрий: внутренний путь апоптоза","keywords":["Рецептор смерти","Митохондрия","Белки семейства BCL-2","Межмембранное пространство митохондрии","Цитохром c","Апоптосома"],"lead":["Апоптоз запускается двумя путями. Внешний начинается с [[T73|рецепторов смерти]] на плазматической мембране; внутренний — внутри клетки, при повреждении ДНК, нехватке сигналов выживания и других нарушениях, — и проходит через [[T95|митохондрию]]."],"mechanism":["Во внутреннем пути белки [[T72|семейства BCL-2]] регулируют проницаемость наружной мембраны митохондрии: одни образуют в ней проходы, другие этому препятствуют. Когда проходы образуются, белки [[T81|межмембранного пространства]] выходят в цитозоль. Главный из них — [[T70|цитохром c]]: в митохондрии он переносит электроны в дыхательной цепи, а в цитозоле связывается с белком-адаптером; адаптер, связавший также АТФ или дАТФ, меняет форму, и семь таких молекул собираются в колесо — [[T71|апоптосому]]. На апоптосоме активируется инициаторная каспаза-9, а она запускает исполнительные каспазы. Во внешнем пути связанный лигандом рецептор смерти собирает комплекс, на котором активируется инициаторная каспаза-8; она может активировать и митохондриальный путь, усиливая сигнал; в одних клетках (например, в лимфоцитах) внешнему пути митохондрия не нужна, в других (например, в клетках печени) без неё сигнал недостаточен."],"paragraphs":["Так митохондрия, снабжающая клетку АТФ, участвует и в апоптозе — через белок, который в норме работает в дыхательной цепи. Выход цитохрома c нарушает и перенос электронов, поэтому синтез АТФ в митохондриях позднее снижается. По наблюдаемым признакам апоптоза — сморщивание, активные каспазы, неповреждённая мембрана — нельзя сказать, каким путём он запущен.","<b>На практикуме.<\/b> Вкладка 4, конструктор: «выход цитохрома c» и «рецептор смерти».","<b>Ограничения.<\/b> Состав и взаимодействия белков семейства BCL-2 не разбираются: это тема курса «Молекулярная биология»."],"conditions":"Схема по строению компартментов митохондрии, упрощённая: наружная мембрана и межмембранное пространство показаны бислоем `BF`.","sources":["src_01"],"base":"БИО-6·26; вспомнить БИО-5·23 («Из каких компартментов состоит митохондрия?») и БИО-5·24","quiz":{"id":"S6-L27","question":"Где находится цитохром c в живой клетке и где он запускает апоптоз?","options":[{"id":"S6-L27-1","text":"В матриксе; запускает в ядре","correct":false,"feedback":"Цитохром c находится в межмембранном пространстве, а апоптосома собирается в цитозоле"},{"id":"S6-L27-2","text":"В цитозоле; апоптоз запускает внутри митохондрии","correct":false,"feedback":"Наоборот: в норме он внутри митохондрии, а действует после выхода в цитозоль"},{"id":"S6-L27-3","text":"В межмембранном пространстве; запускает в цитозоле","correct":true,"feedback":"Да: после выхода в цитозоль он входит в состав апоптосомы"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как митохондрия запускает апоптоз?","status":"Схема по строению компартментов митохондрии, упрощённая · белки BCL-2 одним знаком","modes_label":"Путь","modes":["внутренний","внешний","пути сходятся"],"args":[{"path":"intrinsic"},{"path":"extrinsic"},{"path":"both"}],"notes":["Проходы в наружной мембране — цитохром c выходит, собирается апоптосома","Рецептор с лигандом активирует каспазу-8","Оба пути активируют исполнительные каспазы; признаки одинаковы"],"static":["Внутренний и внешний пути апоптоза сходятся на исполнительных каспазах"],"scene":"s6_t4c","L":{"s6_apoptosome":"апоптосома","s6_bcl2":"проходы белков BCL-2","s6_casp8":"каспаза-8","s6_casp9":"каспаза-9","s6_casp_e":"исполнительные каспазы","s6_conv":"Оба пути активируют исполнительные каспазы; признаки одинаковы","s6_cytc_out":"цитохром c выходит в цитозоль","s6_dr":"рецептор смерти","s6_ims":"межмембранное пространство","s6_ligand":"лиганд","s6_matrix":"матрикс","s6_outside":"внеклеточная среда"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E07","question":"Что делает цитохром c в живой клетке?","options":[{"id":"S6-E07-1","text":"Переносит электроны в дыхательной цепи","correct":true,"feedback":"Да; из митохондрии в цитозоль он выходит при апоптозе"},{"id":"S6-E07-2","text":"Активирует каспазы в матриксе митохондрии","correct":false,"feedback":"Каспазы активируются в цитозоле, а цитохром c находится в межмембранном пространстве"},{"id":"S6-E07-3","text":"Удерживает когезин у центромер","correct":false,"feedback":"Это функция шугошина"}]}},{"id":"death-signs","num":28,"section":3,"questions":[4],"title":"Как отличить апоптоз от некротической гибели и чего нельзя сказать по одному признаку?","keywords":[],"lead":["Апоптоз и некротическую гибель различают по сочетанию признаков, наблюдаемых в определённый момент: объём клетки, целостность мембраны, активность каспаз, состояние ядра, запас АТФ, воспаление."],"mechanism":["Ранний апоптоз: клетка уменьшается, есть пузыри мембраны, хроматин конденсирован, ядро фрагментируется, каспазы активны, мембрана не повреждена, фосфатидилсерин снаружи, АТФ сохраняется, воспаления нет. Ранняя некротическая гибель при энергетическом отказе: клетка и органоиды набухают, АТФ резко снижен, каспазы не активны; затем мембрана разрывается, и в ткани возникает воспаление. Поэтому главные ранние признаки различия — объём клетки и активность каспаз; мембрана различает типы только во времени: при некротической гибели она рвётся раньше, при апоптозе — поздно и только если клетку не поглотили."],"paragraphs":["Ограничения признаков. Поздняя потеря мембраны встречается и при апоптозе, если клетку не поглотили (вторичный некроз). Набухание и разрыв мембраны дают и регулируемые формы некротической гибели, где каспазы не активны, а АТФ в начале сохраняется. Каспазы бывают активны и в клетках, которые затем выживают (БИО-6·30). Причина — облучение, ишемия, сигнал — тоже не определяет тип однозначно.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.4–4.5; продвинутый уровень A4.","<b>Ограничения.<\/b> Таблица признаков учебная; современная классификация опирается на сочетание молекулярных и морфологических признаков, а не на один из них."],"conditions":"Схема качественная, две панели: А — апоптоз, Б — некротическая гибель; ранняя и поздняя стадии.","sources":["src_01","src_02","src_04"],"base":"БИО-6·25, БИО-6·26, БИО-6·27","quiz":{"id":"S6-L28","question":"В поздней пробе у клеток культуры нарушена мембрана. Достаточно ли этого, чтобы назвать тип гибели?","options":[{"id":"S6-L28-1","text":"Нет: так бывает и после апоптоза","correct":true,"feedback":"Да: без фагоцитов апоптотические клетки позднее теряют мембрану"},{"id":"S6-L28-2","text":"Да: это некротическая гибель","correct":false,"feedback":"Поздняя потеря мембраны встречается при обоих типах"},{"id":"S6-L28-3","text":"Да: это апоптоз","correct":false,"feedback":"Один поздний признак не позволяет выбрать между типами"}]},"widget":{"kind":"dna","title":"","s":{"title":"Признаки апоптоза и некротической гибели","status":"Схема качественная · таблица признаков учебная","modes_label":"Панель","modes":["А апоптоз: ранняя","А′ апоптоз: поздняя","Б некротическая: ранняя","Б′ некротическая: поздняя"],"args":[{"type":"apo","time":"early"},{"type":"apo","time":"late","phagocytes":false},{"type":"nec","time":"early"},{"type":"nec","time":"late"}],"notes":["Уменьшение, пузыри, каспазы активны, мембрана не повреждена","Без фагоцитов мембрана нарушена — вторичный некроз","Набухание, мембрана не повреждена, АТФ резко снижен, каспазы не активны","Разрыв мембраны, содержимое вышло"],"static":["Ранние и поздние признаки двух типов гибели"],"scene":"s6_t4d","L":{"s6_apo_cell":"апоптоз","s6_inflam":"воспаление","s6_nec_cell":"некротическая гибель","s6_sg_ATP":"АТФ","s6_sg_PS":"фосфатидилсерин","s6_sg_caspases":"каспазы","s6_sg_inflammation":"воспаление","s6_sg_membrane":"мембрана","s6_sg_nucleus":"ядро","s6_sg_volume":"объём"}}}},{"id":"one-sign","num":29,"section":3,"questions":[4],"title":"Почему одного признака гибели недостаточно: модель временных рядов","keywords":[],"lead":["Сверх программы. Учебная модель: четыре сценария в культуре клеток, у каждого — четыре временных ряда на интервалах 0–10: доля клеток с неповреждённой мембраной, активность каспаз (у.е.), запас АТФ (% от исходного) и форма клеток."],"mechanism":["Сценарии модели. Апоптоз без фагоцитов: каспазы активны с интервала 2, мембрана не повреждена до интервала 5, затем теряется; АТФ снижается поздно. Некротическая гибель при энергетическом отказе: АТФ резко падает уже к интервалу 2, клетки набухают, мембрана теряется с интервала 3. Регулируемая некротическая гибель: каспазы не активны, АТФ до интервала 4 сохраняется, затем клетки набухают и мембрана теряется. Активность каспаз без гибели: каспазы умеренно активны на интервалах 2–4, мембрана не повреждена, АТФ сохраняется. Качественное чтение (пороги — допущения модели): мембрана «не повреждена» при доле ≥ 90 %, каспазы «активны» при ≥ 20 у.е., АТФ «сохраняется» при ≥ 70 %."],"paragraphs":["Поздняя проба (интервал 9) только по мембране не различает три сценария гибели: во всех трёх мембрана нарушена. Ранняя проба каспаз (интервал 2) отделяет апоптоз и выживание с активными каспазами от двух некротических сценариев, но не различает апоптоз и выживание. Ранний АТФ отделяет энергетический отказ. Набор «ранние каспазы + ранний АТФ + поздняя мембрана» различает все четыре сценария. <b>Обратная задача.<\/b> Дан только поздний результат «мембрана нарушена». Какого измерения не хватает? Ответ модели: ранних каспаз и раннего АТФ — одного из них недостаточно.","<b>Ограничения.<\/b> Ряды — условные, а не измеренные; в клетке сроки зависят от причины и типа клеток."],"conditions":"Учебная модель · условные интервалы и единицы; пороги чтения признаков — допущения модели.","sources":["src_02","src_04","src_08"],"base":"БИО-6·28","level":"adv","next_base":"integration","quiz":{"id":"S6-L29","question":"В ранней пробе каспазы активны. Какое ещё наблюдение нужно, чтобы отличить апоптоз от выживания с активными каспазами?","options":[{"id":"S6-L29-1","text":"Запас АТФ в ранней пробе","correct":false,"feedback":"В обоих сценариях АТФ в ранней пробе сохраняется"},{"id":"S6-L29-2","text":"Состояние мембраны в поздней пробе","correct":true,"feedback":"Да: при апоптозе без фагоцитов мембрана позднее теряется, у выживших — не повреждена"},{"id":"S6-L29-3","text":"Никакое: активные каспазы означают гибель","correct":false,"feedback":"В модели есть сценарий с активными каспазами без гибели"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему одного признака мало?","status":"Учебная модель · условные интервалы и единицы","modes_label":"Набор наблюдений","modes":["поздняя мембрана","+ ранние каспазы","+ ранний АТФ","полный набор"],"args":[{"obs":[["membrane",9]]},{"obs":[["membrane",9],["caspases",2]]},{"obs":[["membrane",9],["ATP",2]]},{"obs":[["caspases",2],["ATP",2],["membrane",9]]}],"notes":["Три сценария гибели неразличимы","Три группы: апоптоз, каспазы без гибели и два некротических сценария","Отделяется энергетический отказ","Все четыре сценария различимы"],"static":["Четыре временных ряда и группы сценариев, неразличимых выбранными наблюдениями"],"scene":"s6_a4","L":{"s6_a4_apoptosis_culture":"апоптоз без фагоцитов","s6_a4_atp":"АТФ, %","s6_a4_casp":"каспазы, у.е.","s6_a4_caspase_survival":"каспазы без гибели","s6_a4_groups":"неразличимы:","s6_a4_mem":"мембрана, % клеток","s6_a4_necrosis_energy":"энергетический отказ","s6_a4_probes":"ранняя проба (2), поздняя (9)","s6_a4_regulated_necrotic":"регулируемая некротическая","s6_a4_thr":"пунктир — пороги: мембрана 90 %, каспазы 20 у.е., АТФ 70 и 30 %","s6_a4s_apoptosis_culture":"апоптоз","s6_a4s_caspase_survival":"без гибели","s6_a4s_necrosis_energy":"энерг. отказ","s6_a4s_regulated_necrotic":"регулир. некрот."}},"zoomNarrow":true}},{"id":"caspase-survival","num":30,"section":3,"questions":[4],"title":"Всегда ли активные исполнительные каспазы означают гибель?","keywords":["Анастаз"],"lead":["Сверх программы. Активацию исполнительных каспаз долго считали точкой невозврата. Но выживание клеток после неё описано после облучения и лекарств — а там клетка получает и сигналы, помогающие выжить. Может ли клетка выжить, если исполнительную каспазу активировать напрямую?"],"mechanism":["В клетках человека линии HeLa включали синтез каспазы-3 в заданной дозе и следили за её активностью в каждой клетке. При большой дозе погибали все клетки, при очень малой — выживали все. При промежуточных дозах, которые убивали 15–30 % клеток, остальные 70–85 % выживали, хотя каспаза в них была активна. По скорости нарастания, пику или суммарной активности каспазы нельзя было точно предсказать, погибнет ли данная клетка; медленное нарастание той же суммарной активности чаще было совместимо с выживанием. Выживание после активации каспаз называют [[T89|анастазом]]."],"paragraphs":["Значит, активность каспаз — важный, но не окончательный признак: исход зависит и от состояния самой клетки.","<b>Что уточняет эта работа?<\/b> Каскад каспаз самоусиливается, но при умеренной активности он может затухнуть, и клетка восстанавливается; для вывода о гибели нужны признаки её завершения. <b>Как это узнали.<\/b> Использовали клетки с синтезом каспазы-3 по сигналу добавленного вещества и белок-датчик, светящийся при её активности; за клетками следили под микроскопом сутками.","<b>Ограничения.<\/b> Опухолевые клетки одной линии в культуре; выжившие после активации каспаз клетки могут нести повреждения ДНК."],"conditions":"Схема по данным работы, упрощённая: показаны три уровня активности каспазы.","sources":["src_08"],"base":"БИО-6·26, БИО-6·28","level":"adv","next_base":"integration","quiz":{"id":"S6-L30","question":"Что показала работа при промежуточной дозе каспазы-3?","options":[{"id":"S6-L30-1","text":"Погибли все клетки","correct":false,"feedback":"Так было только при большой дозе"},{"id":"S6-L30-2","text":"Исход точно предсказывался пиком активности","correct":false,"feedback":"Ни пик, ни сумма, ни скорость нарастания не предсказывали исход точно"},{"id":"S6-L30-3","text":"Большая часть клеток выжила","correct":true,"feedback":"Да: погибали 15–30 % клеток, остальные выживали"}]},"widget":{"kind":"dna","title":"","s":{"title":"Активные каспазы без гибели","status":"Схема по данным работы, упрощённая · клетки HeLa","modes_label":"Доза каспазы-3","modes":["большая","промежуточная","малая"],"args":[{"dose":"high"},{"dose":"mid"},{"dose":"low"}],"notes":["Погибают все клетки","Погибают 15–30 %, выживают 70–85 %; исход по активности точно не предсказать","Выживают все"],"static":["Три уровня активности каспазы-3 и доли выживших клеток"],"scene":"s6_r_anastasis","L":{"s6_an_act":"активность каспазы-3 в клетке (условно)","s6_an_high":"Большая доза: погибают все клетки","s6_an_low":"Малая доза: выживают все","s6_an_mid":"Промежуточная доза: погибают 15–30 %, выживают 70–85 %","s6_an_t":"Прямая активация каспазы-3 в клетках HeLa"}}}},{"id":"integration","num":31,"section":4,"questions":[1,2,3,4],"title":"Клетка не делится или делится неправильно: как найти этап?","keywords":["Клеточный цикл","Апоптоз","Некротическая гибель (некроз)","Плазматическая мембрана"],"lead":["Четыре разных состояния часто выглядят одинаково — «клеток не стало больше» или «клетки необычные»: задержка [[T01|клеточного цикла]], ошибка распределения хромосом, иное количество ДНК в клетке и гибель клетки."],"mechanism":["Чтобы их различить, нужны ответы на четыре вопроса. Первый — идёт ли цикл и где он стоит: количество ДНК в ядре (2c, от 2c до 4c, 4c) и признаки митоза. Второй — правильно ли распределены хромосомы: число хромосом в дочерних клетках, задержка перед анафазой, отстающие хроматиды. Третий — сколько ДНК и ядер в клетке: одно ядро 4c и два ядра по 2c дают одинаковое количество ДНК на клетку, но означают разное. Четвёртый — жива ли клетка, а если гибнет, то путём [[T64|апоптоза]] или [[T65|некротической гибели]]: мембрана, каспазы и АТФ в ранней и поздней пробах."],"paragraphs":["Ответ на один вопрос не заменяет остальных: задержанная клетка, клетка в покое и погибающая клетка одинаково «не делятся»; иногда честный ответ — «данных недостаточно, нужно ещё одно измерение». Связи с прежними темами: целостность [[T82|плазматической мембраны]] и работа Na⁺/K⁺-насоса (семинар 1) отличают энергетический отказ от апоптоза; микротрубочки веретена и актомиозиновое кольцо (семинар 2) выполняют деление; убиквитин и протеасома (семинар 5) делают переходы цикла необратимыми, а митохондрия (семинар 5) снабжает клетку АТФ и участвует в апоптозе. Дальше в курсе: как именно удваивается ДНК в S-фазе (семинар 7) и как клетка исправляет повреждения ДНК, ради которых цикл останавливается (семинар 8).","<b>На практикуме.<\/b> Итоговая задача под вкладкой 4.","<b>Ограничения.<\/b> Четыре вопроса — учебная схема рассуждения, а не полный перечень причин.",{"h":"Дальше в курсе «Биология»"},{"ul":["[[https://fresll.github.io/bio/seminar-1-route.html|Семинар 1]] — Na⁺/K⁺-насос, электрохимический градиент и стационарное состояние","[[https://fresll.github.io/bio/seminar-2-route.html|Семинар 2]] — микротрубочки, динамическая нестабильность, моторные белки и актомиозиновое сокращение","[[https://fresll.github.io/bio/seminar-3-route.html#envelope-pore|Семинар 3]] — ядерная оболочка и ядерная пора","[[https://fresll.github.io/bio/seminar-5-route.html|Семинар 5]] — убиквитин и протеасома; компартменты митохондрии и дыхательная цепь","[[https://fresll.github.io/bio/seminar-7-route.html|Семинар 7]] — как удваивается ДНК в S-фазе","[[https://fresll.github.io/bio/seminar-8-route.html|Семинар 8]] — повреждения ДНК и их исправление"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Вступление в цикл и необратимость переходов, покой — МБ, семинар 14","Контрольные точки повреждения ДНК, p53 и исход для клетки — МБ, семинар 15","Белки семейства BCL-2, разветвление апоптоза и некроптоза, разрыв мембраны при литической гибели, ферроптоз — МБ, семинар 16","Сенесценция — МБ, семинар 17"]}],"conditions":"Схема качественная: четыре вопроса и наблюдения, которые на них отвечают.","sources":["src_01"],"base":"БИО-6·5, БИО-6·14, БИО-6·16, БИО-6·28","quiz":{"id":"S6-L31","question":"Через сутки после действия вещества клеток в культуре столько же, сколько было; в ядрах 4c ДНК, хромосомы не конденсированы, каспазы не активны. Что это?","options":[{"id":"S6-L31-1","text":"Задержка перед митозом","correct":true,"feedback":"Да: ДНК удвоена, митоза нет, признаков гибели нет"},{"id":"S6-L31-2","text":"Апоптоз большинства клеток","correct":false,"feedback":"При апоптозе активны каспазы, а ДНК распадается на фрагменты"},{"id":"S6-L31-3","text":"Ошибка распределения хромосом","correct":false,"feedback":"Деления не было: распределять было нечего"}]},"widget":{"kind":"dna","title":"","s":{"title":"Задержка, ошибка, иная ДНК или гибель?","status":"Схема качественная · учебная схема рассуждения","modes_label":"Вопрос","modes":["цикл","распределение","ДНК и ядра","гибель"],"args":[{"q":1},{"q":2},{"q":3},{"q":4}],"notes":["2c / 2c…4c / 4c и признаки митоза","Число хромосом в дочерних клетках, задержка, отстающие хроматиды","Одно ядро 4c или два ядра по 2c","Мембрана, каспазы и АТФ в ранней и поздней пробах"],"static":["Четыре вопроса, различающие задержку, ошибку распределения, иное количество ДНК и гибель"],"scene":"s6_int","L":{"s6_int_mit":"и признаки митоза","s6_int_probes":"мембрана · каспазы · АТФ в ранней и поздней пробах","s6_int_q1":"1. Стоит ли цикл и где?","s6_int_q2":"2. Поровну ли распределены хромосомы?","s6_int_q3":"3. Сколько ДНК и ядер?","s6_int_q4":"4. Гибнет ли клетка и как?"}}}}],"sections":[{"title":"Клеточный цикл: фазы, комплексы циклин-CDK и контрольные точки","entry":"cycle-phases","sub":"Клеточный цикл: фазы, переходы и контрольные точки","label":"Тема 1","integr":false},{"title":"Митоз: веретено, прикрепление хромосом и разделение хроматид","entry":"mitotic-chromosome","sub":"Митоз: веретено, прикрепление хромосом и разделение хроматид","label":"Тема 2","integr":false},{"title":"Мейоз: гомологи, кроссинговер, число хромосом и количество ДНК","entry":"counting-n-c","sub":"Мейоз и митоз: число хромосом, количество ДНК, гомологи и хроматиды","label":"Тема 3","integr":false},{"title":"Гибель клетки: апоптоз и некротическая гибель","entry":"division-death-balance","sub":"Гибель клетки: апоптоз и некротическая гибель (некроз)","label":"Тема 4","integr":false},{"title":"Итог: задержка, ошибка распределения, иное количество ДНК или гибель","entry":"integration","sub":"Задержка, ошибка распределения, иное количество ДНК или гибель?","label":"Итог","integr":true}],"glossary":[{"id":"S6-T01","term":"Клеточный цикл","section":0,"def":"Последовательность событий от образования клетки при делении до её собственного деления; включает интерфазу (G1, S, G2) и фазу M."},{"id":"S6-T02","term":"Интерфаза","section":0,"def":"Часть клеточного цикла между двумя делениями: фазы G1, S и G2."},{"id":"S6-T03","term":"Фаза G1","section":0,"def":"Фаза цикла после деления и до начала удвоения ДНК; клетка растёт и при наличии митогенов готовится к S-фазе; ДНК в ядре — 2c."},{"id":"S6-T04","term":"Фаза S","section":0,"def":"Фаза цикла, в которой удваивается ДНК всех хромосом; количество ДНК в ядре растёт от 2c до 4c."},{"id":"S6-T05","term":"Фаза G2","section":0,"def":"Фаза цикла после удвоения ДНК и до митоза; клетка готовит структуры деления; ДНК в ядре — 4c."},{"id":"S6-T06","term":"Фаза M","section":0,"def":"Фаза деления: митоз (разделение ядра) и цитокинез (разделение цитоплазмы)."},{"id":"S6-T07","term":"Состояние покоя G0","section":0,"def":"Состояние клетки, вышедшей из цикла (обычно из G1); клетка живёт и работает, но не делится; из некоторых видов покоя клетка может вернуться в цикл."},{"id":"S6-T08","term":"Циклин","section":0,"def":"Белок-активатор циклинзависимой киназы; количество циклинов меняется по фазам цикла за счёт синтеза и регулируемого разрушения."},{"id":"S6-T09","term":"Циклинзависимая киназа (CDK)","section":0,"def":"Протеинкиназа, активная только в комплексе с циклином; фосфорилирует белки, запускающие события цикла."},{"id":"S6-T10","term":"Ингибитор CDK","section":0,"def":"Белок, который связывается с комплексом циклин-CDK и подавляет его активность."},{"id":"S6-T11","term":"Митоген","section":0,"def":"Внеклеточный сигнальный белок, стимулирующий вход клетки в клеточный цикл."},{"id":"S6-T12","term":"Точка рестрикции","section":0,"def":"Момент в конце G1, после которого вход в S-фазу больше не зависит от митогена."},{"id":"S6-T13","term":"Контрольная точка клеточного цикла","section":0,"def":"Механизм, задерживающий следующий переход цикла, пока не выполнено условие (ДНК не повреждена, удвоение завершено, хромосомы прикреплены)."},{"id":"S6-T14","term":"Белок p53","section":0,"def":"Фактор транскрипции, который накапливается при повреждении ДНК и включает гены остановки цикла, репарации и апоптоза."},{"id":"S6-T15","term":"Белок p21","section":0,"def":"Ингибитор CDK, синтез которого включает p53; задерживает переходы цикла."},{"id":"S6-T16","term":"Комплекс стимуляции анафазы (APC/C)","section":0,"def":"Убиквитинлигаза, которая в митозе метит секурин и циклин B для разрушения протеасомой."},{"id":"S6-T17","term":"Убиквитинлигаза SCF","section":0,"def":"Убиквитинлигаза, метящая регуляторы G1 и перехода G1/S для разрушения протеасомой."},{"id":"S6-T18","term":"Положительная обратная связь","section":0,"def":"Связь, при которой продукт процесса усиливает сам процесс; делает переходы цикла резкими."},{"id":"S6-T19","term":"Репарация ДНК","section":0,"def":"Исправление повреждений ДНК ферментами клетки."},{"id":"S6-T20","term":"Центросома","section":0,"def":"Главный центр организации микротрубочек животной клетки; удваивается один раз за цикл и образует полюса веретена."},{"id":"S6-T21","term":"Сестринские хроматиды","section":0,"def":"Две одинаковые молекулы ДНК с белками, образовавшиеся при удвоении одной хромосомы и связанные когезином."},{"id":"S6-T22","term":"Центромера","section":1,"def":"Участок хромосомы, на котором собирается кинетохор и дольше всего сохраняется когезин; по числу центромер считают хромосомы."},{"id":"S6-T23","term":"Кинетохор","section":1,"def":"Белковый комплекс на центромере каждой хроматиды, к которому прикрепляются микротрубочки веретена."},{"id":"S6-T24","term":"Когезин","section":1,"def":"Кольцевой белковый комплекс, удерживающий сестринские хроматиды вместе от S-фазы до анафазы."},{"id":"S6-T25","term":"Конденсин","section":1,"def":"Белковый комплекс, который в митозе складывает хроматиды в компактные стержни."},{"id":"S6-T26","term":"Веретено деления","section":1,"def":"Биполярная структура из микротрубочек и связанных с ними белков, распределяющая хромосомы при делении."},{"id":"S6-T27","term":"Кинетохорные микротрубочки","section":1,"def":"Микротрубочки веретена, прикреплённые плюс-концами к кинетохорам."},{"id":"S6-T28","term":"Полюсные (интерполярные) микротрубочки","section":1,"def":"Микротрубочки от двух полюсов, перекрывающиеся у экватора; моторные белки на перекрытиях раздвигают полюса."},{"id":"S6-T29","term":"Астральные микротрубочки","section":1,"def":"Микротрубочки, расходящиеся от полюсов к коре клетки; задают положение веретена."},{"id":"S6-T30","term":"Моторный белок","section":1,"def":"Белок, который за счёт гидролиза АТФ перемещается вдоль филамента цитоскелета или перемещает филаменты относительно друг друга."},{"id":"S6-T31","term":"Профаза","section":1,"def":"Первая фаза митоза: хромосомы конденсируются, центросомы расходятся, начинается сборка веретена."},{"id":"S6-T32","term":"Прометафаза","section"
