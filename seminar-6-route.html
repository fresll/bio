гменты, ДНК разрушается беспорядочно. Ранний признак — набухание при ещё неповреждённой мембране, поздний — её разрыв; по сравнению с апоптозом в культуре мембрана рвётся раньше. Некротическую морфологию дают и регулируемые пути: в них мембрану разрушают особые белки клетки, а запаса АТФ в начале процесса может хватать.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаги 4.2–4.3.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Последовательность событий показана для острого энергетического отказа; при других причинах начало процесса иное.</p><div class="static-quiz"><h3>Почему клетка, оставшаяся без АТФ, набухает?</h3><ol><li><b>А.</b> Встаёт Na⁺/K⁺-насос, входят ионы и вода <i>(верный вариант)</i><br><span class="expl">Да: Na⁺ и Cl⁻ копятся в клетке, вода идёт по осмотическому градиенту</span></li><li><b>Б.</b> Каспазы разрушают мембрану <i>(неверный вариант)</i><br><span class="expl">При энергетическом отказе каспазы не активируются</span></li><li><b>В.</b> Вода выкачивается из клетки насосами <i>(неверный вариант)</i><br><span class="expl">Насосы перекачивают ионы, а не воду; здесь они остановлены</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li><li><a href="https://doi.org/10.1038/s41418-017-0012-4">Galluzzi L., Vitale I., Aaronson S.A., et al. Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018. Cell Death Differ. 2018;25(3):486–541</a></li><li><a href="https://doi.org/10.3389/fcell.2020.614040">Okada Y., Numata T., Sabirov R.Z., et al. Cell death induction and protection by activation of ubiquitously expressed anion/cation channels. Part 1: roles of VSOR/VRAC in cell volume regulation, release of double-edged signals and apoptotic/necrotic cell death. Front Cell Dev Biol. 2021;8:614040</a></li></ul><p>Схема качественная: последовательность событий — учебное деление.</p></details></article><article class="card print-unit" id="ns-caspases"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 26 из 31</div><h2>Апоптоз: каскад каспаз разбирает клетку</h2><p class="lead">Апоптоз выполняют <a href="#ns-g-S6-T67">каспазы</a> — протеазы, которые расщепляют белки после остатка аспарагиновой кислоты. Они синтезируются в неактивной форме и активируются каскадом.</p><div class="note"><strong>Что показывает схема.</strong> Каскад каспаз и морфология апоптоза; вторичный некроз без фагоцитов</div><ol class="mech"><li><a href="#ns-g-S6-T68">Инициаторные каспазы</a> активируются, когда их молекулы сближаются на особом белковом комплексе. Они расщепляют и тем активируют <a href="#ns-g-S6-T69">исполнительные каспазы</a>, а те — сотни белков клетки. Расщепление ламинов разбирает ядерную ламину; расщепление ингибитора особой нуклеазы освобождает её, и ДНК режется на фрагменты; перестройка актина коры даёт пузыри мембраны; расщепление белков адгезии отделяет клетку от соседей. Клетка уменьшается, хроматин конденсируется, ядро распадается на фрагменты, клетка делится на <a href="#ns-g-S6-T75">апоптотические тельца</a>, окружённые мембраной. На наружную сторону плазматической мембраны выходит <a href="#ns-g-S6-T74">фосфатидилсерин</a> — сигнал «съешь меня» для фагоцитов.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·24; вспомнить БИО-1·2 («Из чего состоит плазматическая мембрана и какие у неё функции?»)</p><p>Пока клетку не поглотили, её мембрана остаётся неповреждённой: содержимое не выходит, и воспаления нет. Каспазный каскад самоусиливается: каждая активная каспаза активирует много молекул следующей. Апоптоз требует энергии: для сборки апоптосомы нужен АТФ (или дАТФ; БИО-6·27). Поэтому апоптоз идёт в клетках, где АТФ ещё есть, а при резкой нехватке АТФ гибель идёт по некротическому типу. Если апоптотическую клетку никто не поглотил — например, в культуре клеток без фагоцитов, — её мембрана позднее теряет целостность: это <a href="#ns-g-S6-T76">вторичный некроз</a>.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаг 4.1 и конструктор «нет фагоцитов».</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Названы только основные мишени каспаз.</p><div class="static-quiz"><h3>Что служит для фагоцита сигналом поглотить апоптотическую клетку?</h3><ol><li><b>А.</b> Разрыв плазматической мембраны <i>(неверный вариант)</i><br><span class="expl">Апоптотическую клетку поглощают при неповреждённой мембране</span></li><li><b>Б.</b> Фосфатидилсерин на наружной стороне мембраны <i>(верный вариант)</i><br><span class="expl">Да: в живой клетке он находится на внутренней стороне бислоя</span></li><li><b>В.</b> Выход содержимого клетки в окружающую ткань <i>(неверный вариант)</i><br><span class="expl">Так проявляется некротическая гибель; при апоптозе содержимое не выходит</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li><li><a href="https://doi.org/10.3389/fcell.2020.614040">Okada Y., Numata T., Sabirov R.Z., et al. Cell death induction and protection by activation of ubiquitously expressed anion/cation channels. Part 1: roles of VSOR/VRAC in cell volume regulation, release of double-edged signals and apoptotic/necrotic cell death. Front Cell Dev Biol. 2021;8:614040</a></li><li><a href="https://doi.org/10.1038/ncomms14128">Rogers C., Fernandes-Alnemri T., Mayes L., Alnemri D., Cingolani G., Alnemri E.S. Cleavage of DFNA5 by caspase-3 during apoptosis mediates progression to secondary necrotic/pyroptotic cell death. Nat Commun. 2017;8:14128</a></li></ul><p>Схема качественная: последовательность морфологических изменений — учебное деление.</p></details></article><article class="card print-unit" id="ns-mito-pathway"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 27 из 31</div><h2>Роль митохондрий: внутренний путь апоптоза</h2><p class="lead">Апоптоз запускается двумя путями. Внешний начинается с <a href="#ns-g-S6-T73">рецепторов смерти</a> на плазматической мембране; внутренний — внутри клетки, при повреждении ДНК, нехватке сигналов выживания и других нарушениях, — и проходит через <a href="#ns-g-S6-T95">митохондрию</a>.</p><div class="note"><strong>Что показывает схема.</strong> Внутренний и внешний пути апоптоза сходятся на исполнительных каспазах</div><ol class="mech"><li>Во внутреннем пути белки <a href="#ns-g-S6-T72">семейства BCL-2</a> регулируют проницаемость наружной мембраны митохондрии: одни образуют в ней проходы, другие этому препятствуют. Когда проходы образуются, белки <a href="#ns-g-S6-T81">межмембранного пространства</a> выходят в цитозоль. Главный из них — <a href="#ns-g-S6-T70">цитохром c</a>: в митохондрии он переносит электроны в дыхательной цепи, а в цитозоле связывается с белком-адаптером; адаптер, связавший также АТФ или дАТФ, меняет форму, и семь таких молекул собираются в колесо — <a href="#ns-g-S6-T71">апоптосому</a>. На апоптосоме активируется инициаторная каспаза-9, а она запускает исполнительные каспазы. Во внешнем пути связанный лигандом рецептор смерти собирает комплекс, на котором активируется инициаторная каспаза-8; она может активировать и митохондриальный путь, усиливая сигнал; в одних клетках (например, в лимфоцитах) внешнему пути митохондрия не нужна, в других (например, в клетках печени) без неё сигнал недостаточен.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·26; вспомнить БИО-5·23 («Из каких компартментов состоит митохондрия?») и БИО-5·24</p><p>Так митохондрия, снабжающая клетку АТФ, участвует и в апоптозе — через белок, который в норме работает в дыхательной цепи. Выход цитохрома c нарушает и перенос электронов, поэтому синтез АТФ в митохондриях позднее снижается. По наблюдаемым признакам апоптоза — сморщивание, активные каспазы, неповреждённая мембрана — нельзя сказать, каким путём он запущен.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, конструктор: «выход цитохрома c» и «рецептор смерти».</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Состав и взаимодействия белков семейства BCL-2 не разбираются: это тема курса «Молекулярная биология».</p><div class="static-quiz"><h3>Где находится цитохром c в живой клетке и где он запускает апоптоз?</h3><ol><li><b>А.</b> В матриксе; запускает в ядре <i>(неверный вариант)</i><br><span class="expl">Цитохром c находится в межмембранном пространстве, а апоптосома собирается в цитозоле</span></li><li><b>Б.</b> В цитозоле; апоптоз запускает внутри митохондрии <i>(неверный вариант)</i><br><span class="expl">Наоборот: в норме он внутри митохондрии, а действует после выхода в цитозоль</span></li><li><b>В.</b> В межмембранном пространстве; запускает в цитозоле <i>(верный вариант)</i><br><span class="expl">Да: после выхода в цитозоль он входит в состав апоптосомы</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема по строению компартментов митохондрии, упрощённая: наружная мембрана и межмембранное пространство показаны бислоем `BF`.</p></details></article><article class="card print-unit" id="ns-death-signs"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 28 из 31</div><h2>Как отличить апоптоз от некротической гибели и чего нельзя сказать по одному признаку?</h2><p class="lead">Апоптоз и некротическую гибель различают по сочетанию признаков, наблюдаемых в определённый момент: объём клетки, целостность мембраны, активность каспаз, состояние ядра, запас АТФ, воспаление.</p><div class="note"><strong>Что показывает схема.</strong> Ранние и поздние признаки двух типов гибели</div><ol class="mech"><li>Ранний апоптоз: клетка уменьшается, есть пузыри мембраны, хроматин конденсирован, ядро фрагментируется, каспазы активны, мембрана не повреждена, фосфатидилсерин снаружи, АТФ сохраняется, воспаления нет. Ранняя некротическая гибель при энергетическом отказе: клетка и органоиды набухают, АТФ резко снижен, каспазы не активны; затем мембрана разрывается, и в ткани возникает воспаление. Поэтому главные ранние признаки различия — объём клетки и активность каспаз; мембрана различает типы только во времени: при некротической гибели она рвётся раньше, при апоптозе — поздно и только если клетку не поглотили.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·25, БИО-6·26, БИО-6·27</p><p>Ограничения признаков. Поздняя потеря мембраны встречается и при апоптозе, если клетку не поглотили (вторичный некроз). Набухание и разрыв мембраны дают и регулируемые формы некротической гибели, где каспазы не активны, а АТФ в начале сохраняется. Каспазы бывают активны и в клетках, которые затем выживают (БИО-6·30). Причина — облучение, ишемия, сигнал — тоже не определяет тип однозначно.</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Вкладка 4, шаги 4.4–4.5; продвинутый уровень A4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Таблица признаков учебная; современная классификация опирается на сочетание молекулярных и морфологических признаков, а не на один из них.</p><div class="static-quiz"><h3>В поздней пробе у клеток культуры нарушена мембрана. Достаточно ли этого, чтобы назвать тип гибели?</h3><ol><li><b>А.</b> Нет: так бывает и после апоптоза <i>(верный вариант)</i><br><span class="expl">Да: без фагоцитов апоптотические клетки позднее теряют мембрану</span></li><li><b>Б.</b> Да: это некротическая гибель <i>(неверный вариант)</i><br><span class="expl">Поздняя потеря мембраны встречается при обоих типах</span></li><li><b>В.</b> Да: это апоптоз <i>(неверный вариант)</i><br><span class="expl">Один поздний признак не позволяет выбрать между типами</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li><li><a href="https://doi.org/10.1038/s41418-017-0012-4">Galluzzi L., Vitale I., Aaronson S.A., et al. Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018. Cell Death Differ. 2018;25(3):486–541</a></li><li><a href="https://doi.org/10.1038/ncomms14128">Rogers C., Fernandes-Alnemri T., Mayes L., Alnemri D., Cingolani G., Alnemri E.S. Cleavage of DFNA5 by caspase-3 during apoptosis mediates progression to secondary necrotic/pyroptotic cell death. Nat Commun. 2017;8:14128</a></li></ul><p>Схема качественная, две панели: А — апоптоз, Б — некротическая гибель; ранняя и поздняя стадии.</p></details></article><article class="card print-unit" id="ns-one-sign"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 29 из 31</div><h2>Почему одного признака гибели недостаточно: модель временных рядов</h2><p class="lead">Сверх программы. Учебная модель: четыре сценария в культуре клеток, у каждого — четыре временных ряда на интервалах 0–10: доля клеток с неповреждённой мембраной, активность каспаз (у.е.), запас АТФ (% от исходного) и форма клеток.</p><div class="note"><strong>Что показывает схема.</strong> Четыре временных ряда и группы сценариев, неразличимых выбранными наблюдениями</div><ol class="mech"><li>Сценарии модели. Апоптоз без фагоцитов: каспазы активны с интервала 2, мембрана не повреждена до интервала 5, затем теряется; АТФ снижается поздно. Некротическая гибель при энергетическом отказе: АТФ резко падает уже к интервалу 2, клетки набухают, мембрана теряется с интервала 3. Регулируемая некротическая гибель: каспазы не активны, АТФ до интервала 4 сохраняется, затем клетки набухают и мембрана теряется. Активность каспаз без гибели: каспазы умеренно активны на интервалах 2–4, мембрана не повреждена, АТФ сохраняется. Качественное чтение (пороги — допущения модели): мембрана «не повреждена» при доле ≥ 90 %, каспазы «активны» при ≥ 20 у.е., АТФ «сохраняется» при ≥ 70 %.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·28</p><p>Поздняя проба (интервал 9) только по мембране не различает три сценария гибели: во всех трёх мембрана нарушена. Ранняя проба каспаз (интервал 2) отделяет апоптоз и выживание с активными каспазами от двух некротических сценариев, но не различает апоптоз и выживание. Ранний АТФ отделяет энергетический отказ. Набор «ранние каспазы + ранний АТФ + поздняя мембрана» различает все четыре сценария. &lt;b&gt;Обратная задача.&lt;/b&gt; Дан только поздний результат «мембрана нарушена». Какого измерения не хватает? Ответ модели: ранних каспаз и раннего АТФ — одного из них недостаточно.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Ряды — условные, а не измеренные; в клетке сроки зависят от причины и типа клеток.</p><div class="static-quiz"><h3>В ранней пробе каспазы активны. Какое ещё наблюдение нужно, чтобы отличить апоптоз от выживания с активными каспазами?</h3><ol><li><b>А.</b> Запас АТФ в ранней пробе <i>(неверный вариант)</i><br><span class="expl">В обоих сценариях АТФ в ранней пробе сохраняется</span></li><li><b>Б.</b> Состояние мембраны в поздней пробе <i>(верный вариант)</i><br><span class="expl">Да: при апоптозе без фагоцитов мембрана позднее теряется, у выживших — не повреждена</span></li><li><b>В.</b> Никакое: активные каспазы означают гибель <i>(неверный вариант)</i><br><span class="expl">В модели есть сценарий с активными каспазами без гибели</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41418-017-0012-4">Galluzzi L., Vitale I., Aaronson S.A., et al. Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018. Cell Death Differ. 2018;25(3):486–541</a></li><li><a href="https://doi.org/10.1038/ncomms14128">Rogers C., Fernandes-Alnemri T., Mayes L., Alnemri D., Cingolani G., Alnemri E.S. Cleavage of DFNA5 by caspase-3 during apoptosis mediates progression to secondary necrotic/pyroptotic cell death. Nat Commun. 2017;8:14128</a></li><li><a href="https://doi.org/10.1073/pnas.2216531120">Nano M., Mondo J.A., Harwood J., Balasanyan V., Montell D.J. Cell survival following direct executioner-caspase activation. Proc Natl Acad Sci USA. 2023;120(4):e2216531120</a></li></ul><p>Учебная модель · условные интервалы и единицы; пороги чтения признаков — допущения модели.</p></details></article><article class="card print-unit" id="ns-caspase-survival"><div class="eyebrow">Гибель клетки: апоптоз и некротическая гибель · шаг 30 из 31</div><h2>Всегда ли активные исполнительные каспазы означают гибель?</h2><p class="lead">Сверх программы. Активацию исполнительных каспаз долго считали точкой невозврата. Но выживание клеток после неё описано после облучения и лекарств — а там клетка получает и сигналы, помогающие выжить. Может ли клетка выжить, если исполнительную каспазу активировать напрямую?</p><div class="note"><strong>Что показывает схема.</strong> Три уровня активности каспазы-3 и доли выживших клеток</div><ol class="mech"><li>В клетках человека линии HeLa включали синтез каспазы-3 в заданной дозе и следили за её активностью в каждой клетке. При большой дозе погибали все клетки, при очень малой — выживали все. При промежуточных дозах, которые убивали 15–30 % клеток, остальные 70–85 % выживали, хотя каспаза в них была активна. По скорости нарастания, пику или суммарной активности каспазы нельзя было точно предсказать, погибнет ли данная клетка; медленное нарастание той же суммарной активности чаще было совместимо с выживанием. Выживание после активации каспаз называют <a href="#ns-g-S6-T89">анастазом</a>.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·26, БИО-6·28</p><p>Значит, активность каспаз — важный, но не окончательный признак: исход зависит и от состояния самой клетки.</p><p>&lt;b&gt;Что уточняет эта работа?&lt;/b&gt; Каскад каспаз самоусиливается, но при умеренной активности он может затухнуть, и клетка восстанавливается; для вывода о гибели нужны признаки её завершения. &lt;b&gt;Как это узнали.&lt;/b&gt; Использовали клетки с синтезом каспазы-3 по сигналу добавленного вещества и белок-датчик, светящийся при её активности; за клетками следили под микроскопом сутками.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Опухолевые клетки одной линии в культуре; выжившие после активации каспаз клетки могут нести повреждения ДНК.</p><div class="static-quiz"><h3>Что показала работа при промежуточной дозе каспазы-3?</h3><ol><li><b>А.</b> Погибли все клетки <i>(неверный вариант)</i><br><span class="expl">Так было только при большой дозе</span></li><li><b>Б.</b> Исход точно предсказывался пиком активности <i>(неверный вариант)</i><br><span class="expl">Ни пик, ни сумма, ни скорость нарастания не предсказывали исход точно</span></li><li><b>В.</b> Большая часть клеток выжила <i>(верный вариант)</i><br><span class="expl">Да: погибали 15–30 % клеток, остальные выживали</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.2216531120">Nano M., Mondo J.A., Harwood J., Balasanyan V., Montell D.J. Cell survival following direct executioner-caspase activation. Proc Natl Acad Sci USA. 2023;120(4):e2216531120</a></li></ul><p>Схема по данным работы, упрощённая: показаны три уровня активности каспазы.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог: задержка, ошибка распределения, иное количество ДНК или гибель · шаг 31 из 31</div><h2>Клетка не делится или делится неправильно: как найти этап?</h2><p class="lead">Четыре разных состояния часто выглядят одинаково — «клеток не стало больше» или «клетки необычные»: задержка <a href="#ns-g-S6-T01">клеточного цикла</a>, ошибка распределения хромосом, иное количество ДНК в клетке и гибель клетки.</p><div class="note"><strong>Что показывает схема.</strong> Четыре вопроса, различающие задержку, ошибку распределения, иное количество ДНК и гибель</div><ol class="mech"><li>Чтобы их различить, нужны ответы на четыре вопроса. Первый — идёт ли цикл и где он стоит: количество ДНК в ядре (2c, от 2c до 4c, 4c) и признаки митоза. Второй — правильно ли распределены хромосомы: число хромосом в дочерних клетках, задержка перед анафазой, отстающие хроматиды. Третий — сколько ДНК и ядер в клетке: одно ядро 4c и два ядра по 2c дают одинаковое количество ДНК на клетку, но означают разное. Четвёртый — жива ли клетка, а если гибнет, то путём <a href="#ns-g-S6-T64">апоптоза</a> или <a href="#ns-g-S6-T65">некротической гибели</a>: мембрана, каспазы и АТФ в ранней и поздней пробах.</li></ol><p class="base-prep"><b>Базовая подготовка:</b> БИО-6·5, БИО-6·14, БИО-6·16, БИО-6·28</p><p>Ответ на один вопрос не заменяет остальных: задержанная клетка, клетка в покое и погибающая клетка одинаково «не делятся»; иногда честный ответ — «данных недостаточно, нужно ещё одно измерение». Связи с прежними темами: целостность <a href="#ns-g-S6-T82">плазматической мембраны</a> и работа Na⁺/K⁺-насоса (семинар 1) отличают энергетический отказ от апоптоза; микротрубочки веретена и актомиозиновое кольцо (семинар 2) выполняют деление; убиквитин и протеасома (семинар 5) делают переходы цикла необратимыми, а митохондрия (семинар 5) снабжает клетку АТФ и участвует в апоптозе. Дальше в курсе: как именно удваивается ДНК в S-фазе (семинар 7) и как клетка исправляет повреждения ДНК, ради которых цикл останавливается (семинар 8).</p><p>&lt;b&gt;На практикуме.&lt;/b&gt; Итоговая задача под вкладкой 4.</p><p>&lt;b&gt;Ограничения.&lt;/b&gt; Четыре вопроса — учебная схема рассуждения, а не полный перечень причин.</p><h3>Дальше в курсе «Биология»</h3><ul><li><a href="https://fresll.github.io/bio/seminar-1-route.html">Семинар 1</a> — Na⁺/K⁺-насос, электрохимический градиент и стационарное состояние</li><li><a href="https://fresll.github.io/bio/seminar-2-route.html">Семинар 2</a> — микротрубочки, динамическая нестабильность, моторные белки и актомиозиновое сокращение</li><li><a href="https://fresll.github.io/bio/seminar-3-route.html#envelope-pore">Семинар 3</a> — ядерная оболочка и ядерная пора</li><li><a href="https://fresll.github.io/bio/seminar-5-route.html">Семинар 5</a> — убиквитин и протеасома; компартменты митохондрии и дыхательная цепь</li><li><a href="https://fresll.github.io/bio/seminar-7-route.html">Семинар 7</a> — как удваивается ДНК в S-фазе</li><li><a href="https://fresll.github.io/bio/seminar-8-route.html">Семинар 8</a> — повреждения ДНК и их исправление</li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Вступление в цикл и необратимость переходов, покой — МБ, семинар 14</li><li>Контрольные точки повреждения ДНК, p53 и исход для клетки — МБ, семинар 15</li><li>Белки семейства BCL-2, разветвление апоптоза и некроптоза, разрыв мембраны при литической гибели, ферроптоз — МБ, семинар 16</li><li>Сенесценция — МБ, семинар 17</li></ul><div class="static-quiz"><h3>Через сутки после действия вещества клеток в культуре столько же, сколько было; в ядрах 4c ДНК, хромосомы не конденсированы, каспазы не активны. Что это?</h3><ol><li><b>А.</b> Задержка перед митозом <i>(верный вариант)</i><br><span class="expl">Да: ДНК удвоена, митоза нет, признаков гибели нет</span></li><li><b>Б.</b> Апоптоз большинства клеток <i>(неверный вариант)</i><br><span class="expl">При апоптозе активны каспазы, а ДНК распадается на фрагменты</span></li><li><b>В.</b> Ошибка распределения хромосом <i>(неверный вариант)</i><br><span class="expl">Деления не было: распределять было нечего</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-6.html#q1">Вопрос 1 →</a> <a href="seminar-6.html#q2">Вопрос 2 →</a> <a href="seminar-6.html#q3">Вопрос 3 →</a> <a href="seminar-6.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton, 2022. Гл. 17 «The Cell Cycle» (с. 1027–1088), гл. 18 «Cell Death» (с. 1089–1104)</li></ul><p>Схема качественная: четыре вопроса и наблюдения, которые на них отвечают.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S6-T01"><dt>Клеточный цикл</dt><dd>Последовательность событий от образования клетки при делении до её собственного деления; включает интерфазу (G1, S, G2) и фазу M.</dd></div><div id="ns-g-S6-T02"><dt>Интерфаза</dt><dd>Часть клеточного цикла между двумя делениями: фазы G1, S и G2.</dd></div><div id="ns-g-S6-T03"><dt>Фаза G1</dt><dd>Фаза цикла после деления и до начала удвоения ДНК; клетка растёт и при наличии митогенов готовится к S-фазе; ДНК в ядре — 2c.</dd></div><div id="ns-g-S6-T04"><dt>Фаза S</dt><dd>Фаза цикла, в которой удваивается ДНК всех хромосом; количество ДНК в ядре растёт от 2c до 4c.</dd></div><div id="ns-g-S6-T05"><dt>Фаза G2</dt><dd>Фаза цикла после удвоения ДНК и до митоза; клетка готовит структуры деления; ДНК в ядре — 4c.</dd></div><div id="ns-g-S6-T06"><dt>Фаза M</dt><dd>Фаза деления: митоз (разделение ядра) и цитокинез (разделение цитоплазмы).</dd></div><div id="ns-g-S6-T07"><dt>Состояние покоя G0</dt><dd>Состояние клетки, вышедшей из цикла (обычно из G1); клетка живёт и работает, но не делится; из некоторых видов покоя клетка может вернуться в цикл.</dd></div><div id="ns-g-S6-T08"><dt>Циклин</dt><dd>Белок-активатор циклинзависимой киназы; количество циклинов меняется по фазам цикла за счёт синтеза и регулируемого разрушения.</dd></div><div id="ns-g-S6-T09"><dt>Циклинзависимая киназа (CDK)</dt><dd>Протеинкиназа, активная только в комплексе с циклином; фосфорилирует белки, запускающие события цикла.</dd></div><div id="ns-g-S6-T10"><dt>Ингибитор CDK</dt><dd>Белок, который связывается с комплексом циклин-CDK и подавляет его активность.</dd></div><div id="ns-g-S6-T11"><dt>Митоген</dt><dd>Внеклеточный сигнальный белок, стимулирующий вход клетки в клеточный цикл.</dd></div><div id="ns-g-S6-T12"><dt>Точка рестрикции</dt><dd>Момент в конце G1, после которого вход в S-фазу больше не зависит от митогена.</dd></div><div id="ns-g-S6-T13"><dt>Контрольная точка клеточного цикла</dt><dd>Механизм, задерживающий следующий переход цикла, пока не выполнено условие (ДНК не повреждена, удвоение завершено, хромосомы прикреплены).</dd></div><div id="ns-g-S6-T14"><dt>Белок p53</dt><dd>Фактор транскрипции, который накапливается при повреждении ДНК и включает гены остановки цикла, репарации и апоптоза.</dd></div><div id="ns-g-S6-T15"><dt>Белок p21</dt><dd>Ингибитор CDK, синтез которого включает p53; задерживает переходы цикла.</dd></div><div id="ns-g-S6-T16"><dt>Комплекс стимуляции анафазы (APC/C)</dt><dd>Убиквитинлигаза, которая в митозе метит секурин и циклин B для разрушения протеасомой.</dd></div><div id="ns-g-S6-T17"><dt>Убиквитинлигаза SCF</dt><dd>Убиквитинлигаза, метящая регуляторы G1 и перехода G1/S для разрушения протеасомой.</dd></div><div id="ns-g-S6-T18"><dt>Положительная обратная связь</dt><dd>Связь, при которой продукт процесса усиливает сам процесс; делает переходы цикла резкими.</dd></div><div id="ns-g-S6-T19"><dt>Репарация ДНК</dt><dd>Исправление повреждений ДНК ферментами клетки.</dd></div><div id="ns-g-S6-T20"><dt>Центросома</dt><dd>Главный центр организации микротрубочек животной клетки; удваивается один раз за цикл и образует полюса веретена.</dd></div><div id="ns-g-S6-T21"><dt>Сестринские хроматиды</dt><dd>Две одинаковые молекулы ДНК с белками, образовавшиеся при удвоении одной хромосомы и связанные когезином.</dd></div><div id="ns-g-S6-T22"><dt>Центромера</dt><dd>Участок хромосомы, на котором собирается кинетохор и дольше всего сохраняется когезин; по числу центромер считают хромосомы.</dd></div><div id="ns-g-S6-T23"><dt>Кинетохор</dt><dd>Белковый комплекс на центромере каждой хроматиды, к которому прикрепляются микротрубочки веретена.</dd></div><div id="ns-g-S6-T24"><dt>Когезин</dt><dd>Кольцевой белковый комплекс, удерживающий сестринские хроматиды вместе от S-фазы до анафазы.</dd></div><div id="ns-g-S6-T25"><dt>Конденсин</dt><dd>Белковый комплекс, который в митозе складывает хроматиды в компактные стержни.</dd></div><div id="ns-g-S6-T26"><dt>Веретено деления</dt><dd>Биполярная структура из микротрубочек и связанных с ними белков, распределяющая хромосомы при делении.</dd></div><div id="ns-g-S6-T27"><dt>Кинетохорные микротрубочки</dt><dd>Микротрубочки веретена, прикреплённые плюс-концами к кинетохорам.</dd></div><div id="ns-g-S6-T28"><dt>Полюсные (интерполярные) микротрубочки</dt><dd>Микротрубочки от двух полюсов, перекрывающиеся у экватора; моторные белки на перекрытиях раздвигают полюса.</dd></div><div id="ns-g-S6-T29"><dt>Астральные микротрубочки</dt><dd>Микротрубочки, расходящиеся от полюсов к коре клетки; задают положение веретена.</dd></div><div id="ns-g-S6-T30"><dt>Моторный белок</dt><dd>Белок, который за счёт гидролиза АТФ перемещается вдоль филамента цитоскелета или перемещает филаменты относительно друг друга.</dd></div><div id="ns-g-S6-T31"><dt>Профаза</dt><dd>Первая фаза митоза: хромосомы конденсируются, центросомы расходятся, начинается сборка веретена.</dd></div><div id="ns-g-S6-T32"><dt>Прометафаза</dt><dd>Фаза митоза, в которой разбирается ядерная оболочка, а микротрубочки прикрепляются к кинетохорам.</dd></div><div id="ns-g-S6-T33"><dt>Метафаза</dt><dd>Фаза митоза, в которой все хромосомы выстроены в экваториальной плоскости — метафазной пластинке.</dd></div><div id="ns-g-S6-T34"><dt>Анафаза</dt><dd>Фаза митоза, в которой сестринские хроматиды разделяются и расходятся к полюсам (анафаза A) и полюса раздвигаются (анафаза B).</dd></div><div id="ns-g-S6-T35"><dt>Телофаза</dt><dd>Последняя фаза митоза: хромосомы деконденсируются, вокруг каждого набора собирается ядерная оболочка.</dd></div><div id="ns-g-S6-T36"><dt>Цитокинез</dt><dd>Разделение цитоплазмы после разделения ядра; в животной клетке — сужением сократительного кольца.</dd></div><div id="ns-g-S6-T37"><dt>Сократительное кольцо</dt><dd>Кольцо из актиновых филаментов и миозина II в коре делящейся клетки; его сужение образует борозду деления.</dd></div><div id="ns-g-S6-T38"><dt>Биориентация</dt><dd>Прикрепление сестринских кинетохоров к микротрубочкам противоположных полюсов.</dd></div><div id="ns-g-S6-T39"><dt>Синтелическое прикрепление</dt><dd>Неправильное прикрепление, при котором оба сестринских кинетохора связаны с одним полюсом.</dd></div><div id="ns-g-S6-T40"><dt>Меротелическое прикрепление</dt><dd>Неправильное прикрепление, при котором один кинетохор связан с микротрубочками обоих полюсов.</dd></div><div id="ns-g-S6-T41"><dt>Контрольная точка сборки веретена</dt><dd>Механизм, задерживающий анафазу, пока хотя бы один кинетохор не прикреплён к микротрубочкам.</dd></div><div id="ns-g-S6-T42"><dt>Секурин</dt><dd>Белок-ингибитор сепаразы; разрушается после мечения APC/C перед анафазой.</dd></div><div id="ns-g-S6-T43"><dt>Сепараза</dt><dd>Протеаза, разрезающая когезин в анафазе.</dd></div><div id="ns-g-S6-T44"><dt>Ядерная ламина</dt><dd>Сеть белков-ламинов под внутренней мембраной ядерной оболочки; в митозе разбирается после фосфорилирования.</dd></div><div id="ns-g-S6-T45"><dt>Хромосома</dt><dd>Молекула ДНК с белками; после S-фазы — две сестринские хроматиды, связанные когезином; число хромосом равно числу центромер.</dd></div><div id="ns-g-S6-T46"><dt>Гаплоидный набор (n)</dt><dd>Один набор хромосом, по одной из каждой пары; у человека n = 23.</dd></div><div id="ns-g-S6-T47"><dt>Количество ДНК (c)</dt><dd>Количество ДНК нереплицированного гаплоидного набора; запись n/c указывает число хромосом и количество ДНК в выбранной единице подсчёта.</dd></div><div id="ns-g-S6-T48"><dt>Гомологичные хромосомы</dt><dd>Материнская и отцовская копии одной хромосомы с одинаковым набором генов.</dd></div><div id="ns-g-S6-T49"><dt>Мейоз</dt><dd>Два последовательных деления после одного удвоения ДНК, в результате которых из диплоидной клетки образуются гаплоидные.</dd></div><div id="ns-g-S6-T50"><dt>Мейоз I</dt><dd>Первое (редукционное) деление мейоза: расходятся гомологичные хромосомы.</dd></div><div id="ns-g-S6-T51"><dt>Мейоз II</dt><dd>Второе (эквационное) деление мейоза, без предшествующего удвоения ДНК: расходятся сестринские хроматиды.</dd></div><div id="ns-g-S6-T52"><dt>Профаза I</dt><dd>Длительная первая фаза мейоза I со стадиями лептотены, зиготены, пахитены, диплотены и диакинеза; в ней проходят синапсис и кроссинговер.</dd></div><div id="ns-g-S6-T53"><dt>Синапсис (конъюгация)</dt><dd>Тесное соединение гомологичных хромосом по всей длине в профазе I.</dd></div><div id="ns-g-S6-T54"><dt>Синаптонемный комплекс</dt><dd>Белковая структура, удерживающая гомологи рядом в зиготене и пахитене.</dd></div><div id="ns-g-S6-T55"><dt>Бивалент</dt><dd>Пара соединённых гомологичных хромосом в мейозе I; содержит четыре хроматиды.</dd></div><div id="ns-g-S6-T56"><dt>Кроссинговер</dt><dd>Обмен участками между несестринскими хроматидами гомологичных хромосом в профазе I.</dd></div><div id="ns-g-S6-T57"><dt>Хиазма</dt><dd>Видимое место кроссинговера, в котором гомологи остаются связанными до анафазы I.</dd></div><div id="ns-g-S6-T58"><dt>Шугошин</dt><dd>Белок, защищающий когезин у центромер от сепаразы в мейозе I.</dd></div><div id="ns-g-S6-T59"><dt>Независимое расхождение гомологов</dt><dd>Независимая от других пар ориентация каждого бивалента в метафазе I; даёт 2ⁿ вариантов набора хромосом в гаметах.</dd></div><div id="ns-g-S6-T60"><dt>Сперматогенез</dt><dd>Образование сперматозоидов; мейоз одного сперматоцита I порядка даёт четыре сперматиды.</dd></div><div id="ns-g-S6-T61"><dt>Оогенез</dt><dd>Образование яйцеклеток; мейоз ооцита I порядка с неравными делениями даёт одну яйцеклетку и полярные тельца.</dd></div><div id="ns-g-S6-T62"><dt>Полярное тельце</dt><dd>Маленькая клетка, отделяющаяся от ооцита при неравном делении мейоза и уносящая лишний набор хромосом.</dd></div><div id="ns-g-S6-T63"><dt>Анеуплоидия</dt><dd>Изменение числа хромосом на одну или несколько, не кратное гаплоидному набору.</dd></div><div id="ns-g-S6-T64"><dt>Апоптоз</dt><dd>Регулируемая гибель клетки, выполняемая каспазами: клетка уменьшается и распадается на окружённые мембраной фрагменты, которые поглощаются фагоцитами, обычно без воспаления.</dd></div><div id="ns-g-S6-T65"><dt>Некротическая гибель (некроз)</dt><dd>Гибель клетки с набуханием и разрывом плазматической мембраны; содержимое выходит наружу и вызывает воспаление.</dd></div><div id="ns-g-S6-T66"><dt>Регулируемая некротическая гибель</dt><dd>Некротическая гибель, которую выполняют белки самой клетки, разрушающие плазматическую мембрану (например, некроптоз и пироптоз).</dd></div><div id="ns-g-S6-T67"><dt>Каспазы</dt><dd>Протеазы, расщепляющие белки после остатка аспарагиновой кислоты; выполняют апоптоз.</dd></div><div id="ns-g-S6-T68"><dt>Инициаторная каспаза</dt><dd>Каспаза, активирующаяся при сближении молекул на белковом комплексе и запускающая исполнительные каспазы.</dd></div><div id="ns-g-S6-T69"><dt>Исполнительная каспаза</dt><dd>Каспаза, расщепляющая множество белков клетки и вызывающая признаки апоптоза.</dd></div><div id="ns-g-S6-T70"><dt>Цитохром c</dt><dd>Белок межмембранного пространства митохондрии, переносящий электроны в дыхательной цепи; в цитозоле запускает сборку апоптосомы.</dd></div><div id="ns-g-S6-T71"><dt>Апоптосома</dt><dd>Кольцевой белковый комплекс цитозоля, собирающийся при участии цитохрома c и активирующий каспазу-9.</dd></div><div id="ns-g-S6-T72"><dt>Белки семейства BCL-2</dt><dd>Белки, регулирующие проницаемость наружной мембраны митохондрии во внутреннем пути апоптоза.</dd></div><div id="ns-g-S6-T73"><dt>Рецептор смерти</dt><dd>Рецептор плазматической мембраны, который после связывания лиганда активирует каспазу-8 и запускает внешний путь апоптоза.</dd></div><div id="ns-g-S6-T74"><dt>Фосфатидилсерин</dt><dd>Фосфолипид внутреннего слоя плазматической мембраны; при апоптозе выходит на наружную сторону и служит сигналом для фагоцитов.</dd></div><div id="ns-g-S6-T75"><dt>Апоптотические тельца</dt><dd>Окружённые мембраной фрагменты апоптотической клетки.</dd></div><div id="ns-g-S6-T76"><dt>Вторичный некроз</dt><dd>Потеря целостности мембраны апоптотической клеткой, которую не поглотили фагоциты.</dd></div><div id="ns-g-S6-T77"><dt>Na⁺/K⁺-насос</dt><dd>Мембранный белок, который с затратой АТФ выкачивает Na⁺ из клетки и закачивает K⁺; поддерживает ионный состав и объём клетки.</dd></div><div id="ns-g-S6-T78"><dt>Воспаление</dt><dd>Защитная реакция ткани на повреждение и инфекцию с привлечением иммунных клеток.</dd></div><div id="ns-g-S6-T79"><dt>Митотическая катастрофа</dt><dd>Механизм, который вызывает гибель или необратимую остановку деления клетки, не способной завершить митоз из-за повреждения ДНК, нарушений веретена или отказа контрольных точек.</dd></div><div id="ns-g-S6-T80"><dt>Сенесценция (клеточное старение)</dt><dd>Устойчивая остановка деления живой клетки, например после неустранённого повреждения ДНК.</dd></div><div id="ns-g-S6-T81"><dt>Межмембранное пространство митохондрии</dt><dd>Пространство между наружной и внутренней мембранами митохондрии.</dd></div><div id="ns-g-S6-T82"><dt>Плазматическая мембрана</dt><dd>Мембрана, окружающая клетку и отделяющая цитоплазму от внеклеточной среды.</dd></div><div id="ns-g-S6-T83"><dt>Ядерная оболочка</dt><dd>Две мембраны, окружающие ядро; пронизана ядерными порами; в митозе большинства животных клеток разбирается.</dd></div><div id="ns-g-S6-T84"><dt>Ядрышко</dt><dd>Область ядра, где образуются рибосомы; исчезает в начале митоза и появляется снова в телофазе.</dd></div><div id="ns-g-S6-T85"><dt>Хроматин</dt><dd>Комплекс ДНК с белками в ядре.</dd></div><div id="ns-g-S6-T86"><dt>Ооцит</dt><dd>Женская половая клетка, вступившая в мейоз; ооцит I порядка — до завершения мейоза I, ооцит II порядка — после него.</dd></div><div id="ns-g-S6-T87"><dt>Сперматоцит</dt><dd>Мужская половая клетка, вступившая в мейоз; сперматоцит I порядка — до мейоза I, II порядка — после него.</dd></div><div id="ns-g-S6-T88"><dt>Диплоидная клетка</dt><dd>Клетка с двумя гаплоидными наборами хромосом (2n); у человека 46 хромосом.</dd></div><div id="ns-g-S6-T89"><dt>Анастаз</dt><dd>Выживание клетки после активации исполнительных каспаз.</dd></div><div id="ns-g-S6-T90"><dt>Митоз</dt><dd>Разделение ядра, при котором каждая дочерняя клетка получает по одной сестринской хроматиде каждой хромосомы; набор хромосом сохраняется.</dd></div><div id="ns-g-S6-T91"><dt>Гамета</dt><dd>Половая клетка (сперматозоид или яйцеклетка) с гаплоидным набором хромосом.</dd></div><div id="ns-g-S6-T92"><dt>Убиквитин</dt><dd>Небольшой белок, который присоединяется к другим белкам как метка; цепь убиквитина направляет белок на разрушение в протеасоме.</dd></div><div id="ns-g-S6-T93"><dt>Повреждение ДНК</dt><dd>Изменение строения ДНК (например, разрыв цепи), которое узнают белки-датчики клетки.</dd></div><div id="ns-g-S6-T94"><dt>Фагоцит</dt><dd>Клетка, поглощающая частицы и другие клетки, например макрофаг.</dd></div><div id="ns-g-S6-T95"><dt>Митохондрия</dt><dd>Органоид с двумя мембранами, в котором синтезируется большая часть АТФ клетки.</dd></div><div id="ns-g-S6-T96"><dt>Ядро</dt><dd>Органоид, окружённый ядерной оболочкой и содержащий хромосомы.</dd></div><div id="ns-g-S6-T97"><dt>Отстающая хроматида</dt><dd>Хроматида, которая в анафазе отстаёт от остальных, например при меротелическом прикреплении.</dd></div><div id="ns-g-S6-T98"><dt>Сперматида</dt><dd>Гаплоидная клетка (1n1c), образовавшаяся после мейоза II и превращающаяся в сперматозоид.</dd></div><div id="ns-g-S6-T99"><dt>Двуядерная клетка</dt><dd>Клетка с двумя ядрами; образуется, если после разделения ядра не произошёл цитокинез.</dd></div></dl></section></noscript>

происходит в каждой?","keywords":["Клеточный цикл","Интерфаза","Фаза M","Фаза G1","Митоген","Фаза S"],"lead":["[[T01|Клеточный цикл]] — последовательность событий от образования клетки при делении до её собственного деления. Главные задачи цикла — один раз удвоить всю ДНК хромосом и распределить копии поровну между двумя дочерними клетками."],"mechanism":["Цикл делят на [[T02|интерфазу]] и [[T06|фазу M]]. Интерфаза состоит из трёх фаз. В [[T03|фазе G1]] клетка растёт, синтезирует РНК и белки и при наличии внешних сигналов роста — [[T11|митогенов]] — готовится к удвоению ДНК. В [[T04|фазе S]] ДНК каждой хромосомы удваивается, и хромосома состоит теперь из двух [[T21|сестринских хроматид]]; примерно в то же время начинает удваиваться [[T20|центросома]]. В [[T05|фазе G2]] клетка продолжает расти и готовит структуры деления. Фаза M включает митоз — разделение ядра — и цитокинез — разделение цитоплазмы. Клетка может выйти из цикла, обычно из G1, в [[T07|состояние покоя G0]]."],"paragraphs":["В типичной клетке млекопитающих в культуре цикл длится около 24 часов; S-фаза занимает 10–12 часов, фаза M — около часа. Самая изменчивая по длительности фаза — G1: её продолжительность сильно зависит от внешних сигналов. Количество ДНК в [[T96|ядре]] меняется по фазам: в G1 — 2c, в S — от 2c до 4c, в G2 и в начале митоза — 4c (c — количество ДНК гаплоидного набора; подробнее — БИО-6·16). Большинство клеток нашего тела находится в G0. Одни из них, например клетки печени, при повреждении ткани возвращаются в цикл, другие, например большинство нейронов, не делятся никогда: в них система управления циклом разобрана.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.1: по количеству ДНК в ядре определить фазу.","<b>Ограничения.<\/b> Цикл изображают кругом, но фазы неравны по длительности, а покой G0 — не пятая фаза цикла, а выход из него."],"conditions":"Схема качественная: длительности фаз показаны для типичной делящейся клетки млекопитающих в культуре.","sources":["src_01"],"base":"вспомнить БИО-2·5 («Откуда растут микротрубочки: центросома, центриоли и другие центры организации»)","quiz":{"id":"S6-L01","question":"В ядре клетки 4c ДНК, хромосомы не конденсированы, ядерная оболочка не разобрана. В какой фазе клетка?","options":[{"id":"S6-L01-1","text":"В фазе G2","correct":true,"feedback":"Да: ДНК уже удвоена, а признаков митоза ещё нет"},{"id":"S6-L01-2","text":"В фазе G1","correct":false,"feedback":"В G1 ДНК ещё не удвоена: 2c"},{"id":"S6-L01-3","text":"В метафазе митоза","correct":false,"feedback":"В метафазе хромосомы конденсированы, а ядерной оболочки нет"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что происходит в каждой фазе и сколько ДНК в ядре?","status":"Схема качественная · длительности фаз — для типичной клетки млекопитающих в культуре","modes_label":"Фаза","modes":["G1","S","G2","M","G0"],"args":[{"phase":"G1"},{"phase":"S"},{"phase":"G2"},{"phase":"M"},{"phase":"G0"}],"notes":["Рост клетки; ДНК 2c","Удвоение ДНК: от 2c до 4c; начинается удвоение центросомы","ДНК удвоена: 4c; подготовка к делению","Митоз и цитокинез; хромосомы конденсированы","Выход из цикла; клетка жива и работает, ДНК 2c"],"static":["Кольцо G1 → S → G2 → M с ответвлением в G0; количество ДНК по фазам: 2c → 2c…4c → 4c"],"scene":"s6_t1a","L":{"s6_R":"точка рестрикции","s6_centrosome":"центросома","s6_dna":"ДНК в ядре","s6_g0":"G0","s6_g1":"G1","s6_g2":"G2","s6_interphase":"интерфаза: G1, S, G2","s6_m":"M","s6_s":"S"}}},"exam_quiz":{"id":"S6-E09","question":"Чем покой G0 отличается от задержки на контрольной точке?","options":[{"id":"S6-E09-1","text":"G0 — это гибель клетки","correct":false,"feedback":"Клетки в G0 живы и работают, многие могут вернуться в цикл"},{"id":"S6-E09-2","text":"Ничем: оба состояния — остановка в фазе G2","correct":false,"feedback":"G0 возникает из G1; задержка бывает перед S и перед митозом"},{"id":"S6-E09-3","text":"G0 — выход из цикла, задержка — пауза перехода","correct":true,"feedback":"Да: задержка снимается после устранения дефекта"}]}},{"id":"cyclin-cdk","num":2,"section":0,"questions":[1],"title":"Как комплексы циклин-CDK задают порядок фаз?","keywords":["Циклинзависимая киназа (CDK)","Циклин","Ядерная ламина","Ингибитор CDK"],"lead":["Главные события цикла запускает фосфорилирование белков [[T09|циклинзависимыми киназами (CDK)]]. Сама киназа активна, только если с ней связан белок-активатор — [[T08|циклин]]."],"mechanism":["Количество CDK в клетке почти не меняется на протяжении цикла, а количество циклинов то растёт, то падает. Поэтому меняется прежде всего активность комплексов. У человека в G1 работает комплекс циклин D–CDK4/6, он появляется в ответ на митогены; на границе G1/S — циклин E–CDK2; в S и G2 — циклин A–CDK2; вход в митоз запускает циклин B–CDK1. Каждый комплекс фосфорилирует свой набор белков-мишеней: циклин E–CDK2 проводит клетку через границу G1/S и запускает удвоение центросомы, циклин A–CDK2 запускает удвоение ДНК, циклин B–CDK1 — сборку веретена, разборку [[T44|ядерной ламины]] и конденсацию хромосом. Кроме циклина, активность комплекса определяют фосфорилирование самой CDK и белки — [[T10|ингибиторы CDK]]."],"paragraphs":["Пример: на входе в митоз циклин B–CDK1 накапливается в G2 в неактивной форме, потому что CDK1 несёт тормозящую фосфатную группу. Когда фосфатаза её снимает, активный комплекс усиливает собственную активацию, и активность за короткое время резко возрастает — клетка входит в митоз сразу, а не постепенно.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.2: какой комплекс нужен для какого перехода.","<b>Ограничения.<\/b> Распределение комплексов по фазам учебное: комплексы перекрываются по времени, а циклин A работает и с CDK1 в начале митоза."],"conditions":"Схема качественная: кривые активности условны, высота пиков не измерена.","sources":["src_01"],"base":"БИО-6·1","quiz":{"id":"S6-L02","question":"Почему количество CDK в клетке почти постоянно, а её активность меняется по фазам?","options":[{"id":"S6-L02-1","text":"CDK синтезируется заново в каждой фазе","correct":false,"feedback":"Количество CDK почти постоянно; меняется количество циклинов"},{"id":"S6-L02-2","text":"Активность зависит от связанного циклина","correct":true,"feedback":"Да: без циклина киназа неактивна, а количество циклинов меняется по фазам"},{"id":"S6-L02-3","text":"CDK работает только в ядре","correct":false,"feedback":"Место киназы не объясняет изменения её активности по фазам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какой комплекс циклин-CDK активен в какой фазе?","status":"Схема качественная · кривые активности условны","modes_label":"Комплекс","modes":["D–CDK4/6","E–CDK2","A–CDK2","B–CDK1","все"],"args":[{"show":"D"},{"show":"E"},{"show":"A"},{"show":"B"},{"show":"all"}],"notes":["В G1, в ответ на митогены","Граница G1/S; запуск удвоения центросомы","S и G2; запуск удвоения ДНК","Вход в митоз: сборка веретена, разборка ламины, конденсация хромосом","Комплексы перекрываются по времени"],"static":["Четыре волны активности: D в G1, E на G1/S, A в S–G2, B на G2/M"],"scene":"s6_r_cyclins","L":{"s6_activity":"активность (условно)","s6_cA":"циклин A–CDK2","s6_cB":"циклин B–CDK1","s6_cD":"циклин D–CDK4/6","s6_cE":"циклин E–CDK2","s6_g1":"G1","s6_g2":"G2","s6_m":"M","s6_s":"S"}}},"exam_quiz":{"id":"S6-E03","question":"Какой комплекс циклин-CDK запускает вход в митоз?","options":[{"id":"S6-E03-1","text":"Циклин D–CDK4/6","correct":false,"feedback":"Этот комплекс работает в G1 в ответ на митогены"},{"id":"S6-E03-2","text":"Циклин E–CDK2","correct":false,"feedback":"Этот комплекс запускает переход G1/S"},{"id":"S6-E03-3","text":"Циклин B–CDK1","correct":true,"feedback":"Да; его резкая активация переводит клетку из G2 в митоз"}]}},{"id":"irreversible-transitions","num":3,"section":0,"questions":[1],"title":"Почему клетка не возвращается в предыдущую фазу?","keywords":["Положительная обратная связь","Убиквитин","Убиквитинлигаза SCF","Комплекс стимуляции анафазы (APC/C)","Точка рестрикции"],"lead":["Переходы цикла направлены в одну сторону. Это обеспечивают два механизма: регулируемое разрушение белков и [[T18|положительная обратная связь]]."],"mechanism":["Убиквитинлигазы цикла метят циклины и другие регуляторы [[T92|цепью убиквитина]], и протеасома их разрушает. [[T17|Убиквитинлигаза SCF]] разрушает регуляторы G1 и границы G1/S, а [[T16|комплекс стимуляции анафазы (APC/C)]] в митозе метит секурин и циклин B. После разрушения циклина комплекс предыдущей фазы распадается, и его активность сама собой не восстанавливается: для этого нужен новый синтез циклина. Положительная обратная связь работает так: активный комплекс усиливает собственную активацию или синтез собственного циклина, поэтому активность возрастает скачком. В G1 такой переключатель — [[T12|точка рестрикции]]: после неё клетка входит в S-фазу и тогда, когда митоген уже убран."],"paragraphs":["Пример: если митоген убрать из среды в начале G1, клетка не входит в S и переходит в покой G0. Если его убрать после точки рестрикции, клетка проходит S, G2 и M в обычные сроки: ключевой переход уже произошёл. Так цикл отличается от таймера: переход происходит не через фиксированное время, а когда выполнены условия и сработал переключатель.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.3: митоген убран до и после точки рестрикции.","<b>Ограничения.<\/b> Обратная связь показана одной петлёй; в клетке их несколько, они разбираются в курсе «Молекулярная биология»."],"conditions":"Схема качественная: петли обратной связи и разрушение циклина показаны условными знаками.","sources":["src_01"],"base":"БИО-6·2; вспомнить БИО-5·2 («Как к белку присоединяется убиквитин: ферменты E1, E2 и E3») и БИО-5·4 («Как 26S-протеасома узнаёт, разворачивает и разрушает белок?»)","quiz":{"id":"S6-L03","question":"Митоген убрали из среды через несколько часов после того, как клетка прошла точку рестрикции. Что произойдёт?","options":[{"id":"S6-L03-1","text":"Клетка вернётся из S-фазы в G1","correct":false,"feedback":"Возврата в G1 нет: регуляторы G1 уже разрушены"},{"id":"S6-L03-2","text":"Клетка погибнет без митогена","correct":false,"feedback":"Митоген управляет делением, а не выживанием; здесь цикл просто продолжится"},{"id":"S6-L03-3","text":"Клетка завершит цикл и разделится","correct":true,"feedback":"Да: после точки рестрикции вход в S-фазу от митогена уже не зависит"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему переход не идёт назад?","status":"Схема качественная · обратная связь показана одной петлёй","modes_label":"Условие","modes":["митоген до R","митоген после R","циклин разрушен"],"args":[{"mode":"beforeR"},{"mode":"afterR"},{"mode":"degrade"}],"notes":["Сигнал пропал до точки рестрикции — переход в G0","После точки рестрикции цикл идёт без митогена","Циклин помечен и разрушен — комплекс предыдущей фазы распался"],"static":["Переключатель G1 и разрушение циклина делают переходы однонаправленными"],"scene":"s6_r_switch","L":{"s6_R":"точка рестрикции","s6_feedback":"положительная обратная связь","s6_fragments":"фрагменты циклина","s6_g0":"G0","s6_mitogen":"митоген","s6_outside":"внеклеточная среда","s6_receptor":"рецептор","s6_s":"S","s6_scf":"цепь убиквитина (SCF)","s6_switch_after":"После точки рестрикции цикл идёт без митогена","s6_switch_degrade":"Циклин помечен и разрушен — комплекс предыдущей фазы распался","s6_switch_g0":"Сигнал пропал до точки рестрикции — переход в G0"}},"zoomNarrow":true}},{"id":"checkpoints","num":4,"section":0,"questions":[1],"title":"Что проверяют контрольные точки цикла?","keywords":["Контрольная точка клеточного цикла","Митотическая катастрофа"],"lead":["[[T13|Контрольная точка]] — механизм, который задерживает следующий переход цикла, пока не выполнено условие: ДНК не повреждена, удвоение завершено, хромосомы правильно прикреплены к веретену."],"mechanism":["Главных переходов, на которых действуют контрольные точки, три. Переход G1/S задерживается при повреждении ДНК и без сигналов роста: удвоение повреждённой ДНК закрепило бы ошибку. Переход G2/M задерживается при повреждении ДНК и при неполной репликации: делить незавершённые или разорванные хромосомы нельзя. Переход от метафазы к анафазе задерживает контрольная точка сборки веретена (БИО-6·12), пока хотя бы одна хромосома не прикреплена. Действуют контрольные точки через общие регуляторы: на переходах G1/S и G2/M они тормозят комплексы циклин-CDK, при переходе к анафазе — APC/C."],"paragraphs":["Важно различать датчик и исполнителя: датчик узнаёт повреждение или неприкреплённый кинетохор, а исполнитель тормозит переход. Если механизм контрольной точки выключен, переход происходит вовремя, но дефект переходит в митоз: повреждённая ДНК — в дочерние клетки, а неудвоенный участок связывает сестринские хроматиды, и в анафазе хромосома разрывается. Клетки, которые не могут завершить митоз из-за повреждения ДНК, нарушений веретена или отказа контрольных точек, устраняет механизм, называемый [[T79|митотической катастрофой]]: такие клетки погибают или необратимо перестают делиться.","<b>На практикуме.<\/b> Вкладка 1, конструктор: «выключить контрольную точку» при неполной репликации и при повреждении ДНК в G2.","<b>Ограничения.<\/b> Иногда выделяют больше контрольных точек (например, отдельные точки для G1, S и G2); здесь они сгруппированы по трём переходам. Срабатывание зависит от силы сигнала и типа клетки."],"conditions":"Схема качественная: три перехода и условия, которые на них проверяются.","sources":["src_01","src_02"],"base":"БИО-6·2, БИО-6·3","quiz":{"id":"S6-L04","question":"Удвоение ДНК не завершено, контрольные точки работают. Где задержится цикл и сколько ДНК будет в ядре?","options":[{"id":"S6-L04-1","text":"Перед митозом; от 2c до 4c","correct":true,"feedback":"Да: вход в митоз запрещён, а удвоение прошло лишь частично"},{"id":"S6-L04-2","text":"Перед S-фазой; ДНК ещё 2c","correct":false,"feedback":"Клетка уже в S: удвоение началось, но не закончилось"},{"id":"S6-L04-3","text":"В анафазе; 4c","correct":false,"feedback":"Клетка не войдёт в митоз, пока удвоение не завершится"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что проверяется на каждом переходе?","status":"Схема качественная · три главных перехода","modes_label":"Переход","modes":["G1/S","G2/M","метафаза → анафаза"],"args":[{"gate":"G1S"},{"gate":"G2M"},{"gate":"MA"}],"notes":["Проверяются сигнал роста и целостность ДНК","Проверяются завершение удвоения и целостность ДНК","Проверяется прикрепление всех кинетохоров"],"static":["Три перехода и условия, которые на них проверяются; исполнители — CDK и APC/C"],"scene":"s6_t1b","L":{"s6_cB":"циклин B–CDK1","s6_cE":"циклин E–CDK2","s6_c_dna_ok":"ДНК не повреждена","s6_c_growth":"сигнал роста","s6_c_kin":"все кинетохоры прикреплены","s6_c_repl":"удвоение завершено","s6_checks":"что проверяется","s6_exec":"исполнитель","s6_g1s":"G1/S","s6_g2m":"G2/M","s6_ma":"метафаза → анафаза"}}}},{"id":"delay-not-death","num":5,"section":0,"questions":[1],"title":"Повреждение ДНК: задержка цикла — ещё не гибель","keywords":["Репарация ДНК","Повреждение ДНК","Белок p53","Белок p21","Сенесценция (клеточное старение)","Апоптоз"],"lead":["При повреждении ДНК цикл останавливается до того, как повреждение перейдёт в новые копии ДНК или в дочерние клетки. Остановка даёт время для [[T19|репарации ДНК]]."],"mechanism":["[[T93|Повреждение ДНК]] узнают белки-датчики. В ответ в клетке накапливается белок [[T14|p53]]: в норме он быстро разрушается, а при повреждении становится устойчивым. p53 — фактор транскрипции; он включает синтез [[T15|белка p21]], ингибитора CDK. p21 тормозит комплексы циклин E–CDK2 и циклин A–CDK2 и задерживает клетку перед S-фазой. Перед митозом задержку вызывает в основном другая ветвь ответа: сигнальные киназы тормозят фосфатазу, которая снимает тормозящую фосфатную группу с CDK1, и циклин B–CDK1 не активируется (БИО-6·2). Дальше возможны разные исходы. Если повреждение исправлено, p53 снова разрушается, торможение снимается, и цикл продолжается. Если повреждение не исправлено, остановка может стать необратимой — [[T80|сенесценция (клеточное старение)]], — или клетка погибает путём [[T64|апоптоза]] (БИО-6·26)."],"paragraphs":["Поэтому по одному наблюдению «клетка не делится» нельзя сказать, погибнет ли она: задержка, покой G0, необратимая остановка и гибель — разные состояния с разными признаками. В задержанной клетке мембрана не повреждена, каспазы не активны, а количество ДНК указывает переход, на котором стоит цикл: 2c — перед S, 4c — перед митозом.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.4 (повреждение в G2) и продвинутый уровень A1.","<b>Ограничения.<\/b> Обе ветви ответа даны в упрощённом виде, без названий киназ; другие пути ответа на повреждение и их динамика разбираются в курсе «Молекулярная биология»."],"conditions":"Схема качественная: последовательность событий — учебное деление непрерывного процесса.","sources":["src_01"],"base":"БИО-6·4","quiz":{"id":"S6-L05","question":"Через сутки после действия вещества, повреждающего ДНК, клетки культуры не делятся, их мембраны не повреждены, каспазы не активны, в ядрах 4c ДНК. Какой вывод допустим?","options":[{"id":"S6-L05-1","text":"Клетки погибают путём апоптоза","correct":false,"feedback":"При апоптозе активны каспазы; здесь их активности нет"},{"id":"S6-L05-2","text":"Цикл задержан перед митозом","correct":true,"feedback":"Да: ДНК удвоена, признаков гибели нет; циклин B–CDK1 не активирован"},{"id":"S6-L05-3","text":"Клетки вышли в покой G0","correct":false,"feedback":"В G0 клетка выходит из G1 с 2c ДНК, а здесь ДНК удвоена"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как повреждение ДНК задерживает цикл?","status":"Схема качественная · последовательность — учебное деление","modes_label":"Этап","modes":["1 повреждение","2 перед S","3 перед митозом","4 исход"],"args":[{"stage":1},{"stage":2},{"stage":3},{"stage":4}],"notes":["Датчики узнают повреждение","p53 накапливается и включает синтез p21; p21 тормозит циклин E–CDK2 и A–CDK2 — клетка стоит перед S","Сигнальные киназы тормозят фосфатазу; циклин B–CDK1 не активируется — клетка стоит перед митозом","Исправлено — цикл продолжается; не исправлено — необратимая остановка или апоптоз"],"static":["Две ветви ответа: перед S — p53 → p21; перед митозом — торможение фосфатазы, активирующей CDK1; три исхода"],"scene":"s6_r_p53","L":{"s6_before_m":"стоит перед митозом","s6_before_s":"стоит перед S","s6_break":"разрыв ДНК","s6_kinases":"сигнальные киназы","s6_out_apo":"апоптоз","s6_out_arrest":"необратимая остановка","s6_out_repair":"репарация — цикл продолжается","s6_p21":"p21","s6_p53":"p53","s6_p53_n1":"Датчики узнают повреждение","s6_ppase":"фосфатаза CDK1","s6_sensor":"датчик"}},"zoomNarrow":true}},{"id":"transition-permission","num":6,"section":0,"questions":[1],"title":"Переход разрешают условия, а не время: модель машины состояний","keywords":[],"lead":["Сверх программы. Учебная модель: время разбито на условные интервалы; в каждом интервале модель проверяет, выполнены ли условия перехода в следующую фазу."],"mechanism":["Правила модели. В G1 клетка растёт на 1 условную единицу (у.е.) за интервал, пока есть ростовой сигнал; при росте 6 у.е. пройдена точка рестрикции. Без сигнала до этого момента клетка переходит в покой G0. Переход в S разрешён после точки рестрикции, если нет контрольного сигнала повреждения. Удвоение ДНК занимает 6 интервалов. G2 длится не меньше 2 интервалов; переход в M разрешён, если удвоение завершено и нет контрольного сигнала. Митоз занимает 2 интервала. Без помех клетка входит в S на 7-м интервале и делится к концу 16-го. Если клетка растёт вдвое быстрее, G1 короче, и деление наступает к концу 13-го интервала: длина цикла зависит от готовности, а не от часов."],"paragraphs":["Повреждение ДНК в G2 на интервалах 13–16 при работающей контрольной точке задерживает вход в митоз на 3 интервала; деление наступает к концу 19-го интервала. Если контрольная точка выключена, клетка делится вовремя, к концу 16-го интервала, но с неустранённым повреждением. Если повреждение не устраняется, клетка остаётся перед митозом до конца наблюдения; модель не показывает, погибнет ли она: это другой процесс. Ростовой сигнал, убранный на 4-м интервале, переводит клетку в G0, а убранный на 9-м интервале, уже после точки рестрикции, не меняет сроков деления. <b>Обратная задача.<\/b> Деление наступило на 3 интервала позже обычного. Совместимы две причины — повреждение в G1 и повреждение в G2 при работающей контрольной точке (замедленное удвоение даёт опоздание на 4 интервала); различить их помогает, где стояла клетка: перед S с 2c или перед митозом с 4c.","<b>Ограничения.<\/b> Пороги и длительности — допущения модели, а не измеренные величины; в клетке переходы определяются активностью комплексов циклин-CDK, а контрольная точка действует и внутри S-фазы."],"conditions":"Учебная модель · условные интервалы и единицы; пороги и длительности — допущения, а не измеренные величины.","sources":["src_01"],"base":"БИО-6·3, БИО-6·4, БИО-6·5","level":"adv","next_base":"mitotic-chromosome","quiz":{"id":"S6-L06","question":"В модели клетка растёт вдвое быстрее, остальные условия обычные. Что изменится?","options":[{"id":"S6-L06-1","text":"Ничего не изменится: цикл идёт по часам","correct":false,"feedback":"В модели переход разрешает выполненное условие, а не прошедшее время"},{"id":"S6-L06-2","text":"Удлинится S-фаза","correct":false,"feedback":"Скорость роста не меняет длительности удвоения ДНК"},{"id":"S6-L06-3","text":"Укоротится G1, деление наступит раньше","correct":true,"feedback":"Да: порог готовности достигается быстрее; S, G2 и M не меняются"}]},"widget":{"kind":"dna","title":"","s":{"title":"Переход по условию, а не по времени","status":"Учебная модель · условные интервалы и единицы","modes_label":"Сценарий","modes":["норма","быстрый рост","повреждение в G2","точка выключена","не устраняется"],"args":[{},{"growth":2},{"damage_at":12,"damage_len":4},{"damage_at":12,"damage_len":4,"checkpoint":false},{"damage_at":12,"damage_len":null}],"notes":["Вход в S на 7-м, деление к концу 16-го интервала","Вход в S на 4-м, деление к концу 13-го","3 интервала ожидания; деление к концу 19-го","Деление вовремя, к концу 16-го, с неустранённым повреждением","Остановка перед митозом до конца наблюдения"],"static":["Временная шкала фаз для пяти сценариев с отметкой ожидания"],"scene":"s6_a1","L":{"s6_R":"точка рестрикции","s6_a1_dmg":"повреждение ДНК","s6_a1_dna":"ДНК 2c…4c","s6_a1_int":"интервалы 1–30","s6_a1_size":"рост, у.е.","s6_g0":"G0","s6_g1":"G1","s6_g2":"G2","s6_m":"M","s6_s":"S"}}}},{"id":"cdk-activity-order","num":7,"section":0,"questions":[1],"title":"Нужны ли разные циклины для удвоения ДНК и для митоза?","keywords":[],"lead":["Сверх программы. В учебниках разным фазам соответствуют разные комплексы циклин-CDK. Значит ли это, что каждый комплекс умеет только «свою» работу?"],"mechanism":["Работа на делящихся дрожжах сравнила два комплекса — с циклином фазы S и с циклином митоза — в клетках, где своя CDK была выключена. Оказалось, что около двух третей из 280 изученных участков фосфорилирования в белках-мишенях оба комплекса фосфорилировали одинаково; лишь около 4 % участков комплекс фазы S почти не фосфорилировал. Комплекс фазы S запускал начало митоза, но не мог его завершить. Если же у полюса веретена убирали фосфатазу, снимающую фосфатные группы с мишеней CDK, комплекс фазы S проводил клетку через весь митоз и деление."],"paragraphs":["Отсюда вывод работы: порядок событий цикла задаётся прежде всего ростом общей активности CDK — ранним событиям достаточно меньшей активности, поздним нужна большая, — и лишь отчасти различиями между циклинами.","<b>Что уточняет эта работа?<\/b> Таблица «циклин — фаза» верна как описание того, какой комплекс обычно работает в какой фазе, но разные комплексы отчасти взаимозаменяемы. <b>Как это узнали.<\/b> В клетках дрожжей заменяли собственную CDK искусственными комплексами одного или другого циклина и измеряли, какие белки и насколько они фосфорилируют по мере роста их количества.","<b>Ограничения.<\/b> Работа выполнена на делящихся дрожжах; у человека комплексов больше, и степень их взаимозаменяемости может быть иной."],"conditions":"Схема по данным работы, упрощённая: доли участков фосфорилирования округлены.","sources":["src_05"],"base":"БИО-6·2, БИО-6·3","level":"adv","next_base":"mitotic-chromosome","quiz":{"id":"S6-L07","question":"Комплекс с циклином фазы S начал митоз, но не завершил его. При каком условии он проводил клетку через весь митоз?","options":[{"id":"S6-L07-1","text":"Если убрать фосфатазу у полюса веретена","correct":true,"feedback":"Да: тогда его активности хватало для фосфорилирования всех нужных белков"},{"id":"S6-L07-2","text":"Если добавить второй циклин фазы S","correct":false,"feedback":"В работе решающим было снятие противодействия фосфатазы"},{"id":"S6-L07-3","text":"Ни при каком: митоз требует только циклина B","correct":false,"feedback":"Работа показала обратное: при убранной фосфатазе митоз завершался"}]},"widget":{"kind":"dna","title":"","s":{"title":"Нужны ли разные циклины для S и M?","status":"Схема по данным работы, упрощённая · делящиеся дрожжи","modes_label":"Режим","modes":["доли участков","комплекс фазы S","без фосфатазы"],"args":[{"mode":"shares"},{"mode":"sonly"},{"mode":"nopp1"}],"notes":["Около двух третей из 280 участков оба комплекса фосфорилируют одинаково","Комплекс фазы S начинает митоз, но не завершает","Без фосфатазы у полюса комплекс фазы S проводит весь митоз"],"static":["Порядок событий цикла задаётся в основном общей активностью CDK"],"scene":"s6_r_cdkorder","L":{"s6_cdk_nopp":"Без фосфатазы у полюса комплекс фазы S проводит весь митоз","s6_cdk_sonly":"Комплекс фазы S начинает митоз, но не завершает","s6_cdk_total":"Порядок событий цикла задаётся в основном общей активностью CDK","s6_cplx_m":"комплекс митоза","s6_cplx_s":"комплекс фазы S","s6_ev_mend":"митоз завершён","s6_ev_mstart":"митоз начат","s6_ev_rep":"удвоение ДНК","s6_pp1":"фосфатаза у полюса","s6_same":"одинаково у двух комплексов ≈ 2/3","s6_sites":"280 участков фосфорилирования","s6_worse_s":"хуже у комплекса фазы S ≈ 4 %"}}}},{"id":"mitotic-chromosome","num":8,"section":1,"questions":[2],"title":"Как устроена хромосома перед делением?","keywords":["Хромосома","Сестринские хроматиды","Хроматин","Когезин","Конденсин","Центромера"],"lead":["После S-фазы каждая [[T45|хромосома]] состоит из двух [[T21|сестринских хроматид]] — двух одинаковых молекул ДНК с белками. В интерфазе они представлены деконденсированным [[T85|хроматином]] и не видны под световым микроскопом."],"mechanism":["Сестринские хроматиды удерживает вместе белковый комплекс [[T24|когезин]]: его кольца охватывают обе молекулы ДНК сразу после их удвоения в S-фазе. В начале митоза другой комплекс — [[T25|конденсин]] — складывает каждую хроматиду в плотный стержень; при этом большая часть когезина с плеч хромосом удаляется, а в области [[T22|центромеры]] сохраняется. На центромере каждой хроматиды собирается [[T23|кинетохор]] — крупный белковый комплекс, к которому прикрепляются микротрубочки веретена. У хромосомы перед делением два кинетохора, обращённых в противоположные стороны."],"paragraphs":["Хромосомы конденсируются в [[T31|профазе]]; тогда же исчезают [[T84|ядрышки]], а [[T83|ядерная оболочка]] разбирается в прометафазе после фосфорилирования ламины (БИО-3, `envelope-pore`). Именно когезин делает две хроматиды одной хромосомой: пока он не расщеплён, их считают за одну хромосому, а при подсчёте хромосом считают центромеры (БИО-6·16).","<b>На практикуме.<\/b> Вкладка 2, схема: хромосома с двумя кинетохорами и когезином.","<b>Ограничения.<\/b> Число колец когезина и витков хроматина на схеме условно."],"conditions":"Схема по строению хромосомы, упрощённая: число колец когезина условно.","sources":["src_01"],"base":"БИО-6·1; вспомнить БИО-3·23 («Как устроены ядерная оболочка и ядерная пора»)","quiz":{"id":"S6-L08","question":"Сколько кинетохоров у одной хромосомы в метафазе митоза?","options":[{"id":"S6-L08-1","text":"Один — на центромере хромосомы","correct":false,"feedback":"Центромера одна, но кинетохор собирается на каждой из двух хроматид"},{"id":"S6-L08-2","text":"Два — по одному на каждой хроматиде","correct":true,"feedback":"Да: два кинетохора обращены к противоположным полюсам"},{"id":"S6-L08-3","text":"Четыре — по два на хроматиду","correct":false,"feedback":"На каждой хроматиде собирается один кинетохор"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как устроена хромосома перед делением?","status":"Схема по строению хромосомы, упрощённая · число колец когезина условно","modes_label":"Состояние","modes":["интерфаза","после S","профаза","метафаза"],"args":[{"state":1},{"state":2},{"state":3},{"state":4}],"notes":["Хроматин деконденсирован; одна молекула ДНК на хромосому","Две нити хроматина — сестринские хроматиды, связанные кольцами когезина; хромосомы не конденсированы","Конденсин складывает хроматиды; когезин уходит с плеч","Два кинетохора на центромере, обращены в противоположные стороны"],"static":["Хромосома от интерфазы до метафазы: когезин, конденсин, кинетохоры"],"scene":"s6_r_chromosome","L":{"s6_centromere":"центромера","s6_chromatin":"хроматин","s6_coh_cen":"когезин остаётся у центромеры","s6_cohesin":"когезин","s6_condensin":"конденсин","s6_kinetochore":"кинетохор","s6_nucleus":"ядро","s6_one_dna":"Хроматин деконденсирован; одна молекула ДНК на хромосому","s6_sisters":"сестринские хроматиды","s6_sisters_coh":"Две нити хроматина — сестринские хроматиды, связанные кольцами когезина"}},"zoomNarrow":true}},{"id":"spindle","num":9,"section":1,"questions":[2],"title":"Как устроено веретено деления?","keywords":["Веретено деления","Кинетохорные микротрубочки","Полюсные (интерполярные) микротрубочки","Моторный белок","Астральные микротрубочки"],"lead":["[[T26|Веретено деления]] — биполярная структура из микротрубочек и связанных с ними белков. Его полюса в животной клетке образуют две центросомы, удвоенные в интерфазе."],"mechanism":["Минус-концы микротрубочек находятся у полюсов, плюс-концы обращены от полюсов; по положению плюс-концов различают три группы микротрубочек. [[T27|Кинетохорные микротрубочки]] прикрепляются плюс-концами к кинетохорам. [[T28|Полюсные (интерполярные) микротрубочки]] от двух полюсов перекрываются у экватора; [[T30|моторные белки]], связывающие перекрытые участки, раздвигают полюса. [[T29|Астральные микротрубочки]] расходятся от полюсов к коре клетки и задают положение веретена. В митозе динамическая нестабильность микротрубочек резко возрастает: растущие и укорачивающиеся микротрубочки быстро «прощупывают» пространство и находят кинетохоры."],"paragraphs":["Веретено может собраться и без центросом — вокруг хромосом, как в ооцитах человека (БИО-6·21), — но тогда его полюса менее упорядочены. Вещества, разрушающие микротрубочки, например колхицин, останавливают клетки в митозе на часы и сутки: без веретена хромосомы не прикрепляются, и переход к анафазе не разрешается.","<b>На практикуме.<\/b> Вкладка 2, конструктор: «вещество, разрушающее микротрубочки».","<b>Ограничения.<\/b> На схеме по несколько микротрубочек каждой группы; в клетке их сотни."],"conditions":"Схема по строению веретена, упрощённая: число микротрубочек условно.","sources":["src_01"],"base":"БИО-6·8; вспомнить БИО-2·5, БИО-2·9 («Динамическая нестабильность: рост, катастрофа, укорочение, спасение») и БИО-2·16 («Моторный белок: как энергия АТФ превращается в шаг»)","quiz":{"id":"S6-L09","question":"Какие микротрубочки веретена раздвигают его полюса?","options":[{"id":"S6-L09-1","text":"Кинетохорные, связанные с хромосомами","correct":false,"feedback":"Кинетохорные микротрубочки перемещают хромосомы, а не раздвигают полюса"},{"id":"S6-L09-2","text":"Астральные, растущие внутрь ядра","correct":false,"feedback":"Астральные микротрубочки растут к коре клетки и задают положение веретена"},{"id":"S6-L09-3","text":"Полюсные, перекрытые у экватора","correct":true,"feedback":"Да: моторные белки на перекрытых участках раздвигают полюса"}]},"widget":{"kind":"dna","title":"","s":{"title":"Из чего состоит веретено?","status":"Схема по строению веретена, упрощённая · число микротрубочек условно","modes_label":"Веретено","modes":["три группы","микротрубочки разрушены"],"args":[{"mt":true},{"mt":false}],"notes":["Кинетохорные — к хромосомам, полюсные — перекрываются у экватора, астральные — к коре","Без микротрубочек хромосомы не прикреплены; сигнал всех кинетохоров задерживает митоз"],"static":["Веретено из трёх групп микротрубочек между двумя центросомами"],"scene":"s6_t2a","L":{"s6_amt":"астральные","s6_centrosome":"центросома","s6_kmt":"кинетохорные","s6_motor":"моторный белок","s6_mt_off":"Без микротрубочек хромосомы не прикреплены; сигнал всех кинетохоров задерживает митоз","s6_plasma_mem":"плазматическая мембрана","s6_pmt":"полюсные","s6_sac_sig":"сигнал"}},"zoomNarrow":true}},{"id":"mitosis-phases","num":10,"section":1,"questions":[2],"title":"Что происходит в каждой фазе митоза?","keywords":["Митоз","Профаза","Прометафаза","Метафаза","Анафаза","Телофаза"],"lead":["[[T90|Митоз]] — разделение ядра, при котором каждая дочерняя клетка получает по одной сестринской хроматиде каждой хромосомы. Его делят на пять фаз."],"mechanism":["В [[T31|профазе]] хромосомы конденсируются, центросомы расходятся, начинает собираться веретено. В [[T32|прометафазе]] разбирается ядерная оболочка, и микротрубочки получают доступ к кинетохорам; хромосомы движутся к экватору. В [[T33|метафазе]] все хромосомы выстроены в экваториальной плоскости — метафазной пластинке. В [[T34|анафазе]] сестринские хроматиды разделяются и расходятся к полюсам: в анафазе A кинетохорные микротрубочки укорачиваются, и хроматиды подтягиваются к полюсам; в анафазе B полюса раздвигаются. В [[T35|телофазе]] хромосомы деконденсируются, вокруг каждого набора собирается ядерная оболочка, появляются ядрышки. Затем идёт [[T36|цитокинез]] (БИО-6·13)."],"paragraphs":["Силу, перемещающую хроматиды в анафазе A, создаёт прежде всего укорочение кинетохорных микротрубочек: кинетохор удерживается на разбирающемся плюс-конце; моторные белки вносят дополнительный вклад. Самая длинная фаза митоза обычно прометафаза: она продолжается, пока не прикреплены все хромосомы. В клетках млекопитающих анафаза начинается примерно через 20 минут после того, как прикрепилась последняя хромосома.","<b>На практикуме.<\/b> Вкладка 2, шкала этапов.","<b>Ограничения.<\/b> Фазы — учебное деление непрерывного процесса; границы между ними условны."],"conditions":"Схема качественная, пять панелей: А — профаза, Б — прометафаза, В — метафаза, Г — анафаза, Д — телофаза.","sources":["src_01"],"base":"БИО-6·8, БИО-6·9","quiz":{"id":"S6-L10","question":"В какой фазе митоза ядерной оболочки уже нет, а хромосомы ещё не выстроены на экваторе?","options":[{"id":"S6-L10-1","text":"В прометафазе","correct":true,"feedback":"Да: оболочка разобрана, хромосомы прикрепляются и движутся к экватору"},{"id":"S6-L10-2","text":"В поздней профазе","correct":false,"feedback":"В профазе ядерная оболочка ещё есть"},{"id":"S6-L10-3","text":"В анафазе","correct":false,"feedback":"В анафазе хромосомы уже выстраивались и теперь расходятся к полюсам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что происходит в каждой фазе митоза?","status":"Схема качественная · фазы — учебное деление","modes_label":"Фаза","modes":["А профаза","Б прометафаза","В метафаза","Г анафаза","Д телофаза"],"args":[{"phase":1},{"phase":2},{"phase":3},{"phase":4},{"phase":5}],"notes":["Конденсация, расхождение центросом","Оболочка разобрана, хромосомы прикрепляются","Все хромосомы на экваторе","Хроматиды к полюсам (A), полюса раздвигаются (B)","Ядерные оболочки и ядрышки собираются; хромосомы деконденсируются"],"static":["Пять фаз митоза условной клетки 2n = 4"],"scene":"s6_t2b","L":{"s6_anaA":"анафаза A: хроматиды к полюсам","s6_anaB":"анафаза B: полюса расходятся","s6_centrosome":"центросома","s6_env_frag":"оболочка разобрана","s6_envelope":"ядерная оболочка","s6_furrow0":"борозда деления","s6_kinetochore":"кинетохор","s6_kmt":"кинетохорные","s6_nucleolus":"ядрышко","s6_plate":"метафазная пластинка","s6_pmt":"полюсные"}},"zoomNarrow":true},"exam_quiz":{"id":"S6-E04","question":"Чем анафаза A отличается от анафазы B?","options":[{"id":"S6-E04-1","text":"A — хроматиды к полюсам, B — полюса врозь","correct":true,"feedback":"Да; обе части анафазы идут почти одновременно"},{"id":"S6-E04-2","text":"В A расходятся гомологи, в B хроматиды","correct":false,"feedback":"Так различаются анафаза I и анафаза II мейоза"},{"id":"S6-E04-3","text":"A бывает в митозе, B — в мейозе","correct":false,"feedback":"Обе части есть в анафазе митоза"}]}},{"id":"biorientation","num":11,"section":1,"questions":[2],"title":"Как хромосома прикрепляется к обоим полюсам?","keywords":["Биориентация","Синтелическое прикрепление","Меротелическое прикрепление","Отстающая хроматида"],"lead":["Правильное прикрепление — [[T38|биориентация]]: кинетохоры двух сестринских хроматид связаны с микротрубочками противоположных полюсов."],"mechanism":["Прикрепление идёт методом проб и ошибок. Кинетохор захватывает растущую микротрубочку случайно, и прикрепление сначала бывает неправильным. При [[T39|синтелическом прикреплении]] оба сестринских кинетохора связаны с одним полюсом; при [[T40|меротелическом прикреплении]] один кинетохор связан с микротрубочками обоих полюсов. Правильное прикрепление отличается натяжением: когезин удерживает хроматиды вместе, а микротрубочки двух полюсов тянут их в разные стороны. Ненатянутые прикрепления неустойчивы — киназа у центромеры ослабляет связь кинетохора с микротрубочками, и попытка повторяется; натянутые прикрепления стабилизируются."],"paragraphs":["Синтелическое прикрепление обычно исправляется до анафазы: пока оно исправляется, у кинетохора временно нет микротрубочек, и анафаза задержана. Меротелическое прикрепление опаснее: кинетохор прикреплён и сигнала не даёт; в анафазе такая хроматида может отстать от остальных — её называют [[T97|отстающей хроматидой]].","<b>На практикуме.<\/b> Вкладка 2, шаг 2.3; продвинутый уровень A2 — меротелическое прикрепление.
