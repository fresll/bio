лавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: восемь сценариев и итоговая задача","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите результат, откройте схему и сопоставьте её с разбором. Переключатели показывают предсказания учебной модели, а не результат эксперимента: правила модели заданы заранее, а их основания и границы — в шагах «Объяснений».","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Шаг относится ко всем вкладкам практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Эволюция человека и эволюционная медицина: от ископаемых и геномов к отбору в организме","num_fmt":"Тема {n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Раздел III","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →","base_prep":"Базовая подготовка","back_base":"← Вернуться к базовому шагу","viewed_label":"Просмотрено шагов","viewed":"просмотрен","stats":[["4 темы","свидетельства и мозаичная история; происхождение и смешение; адаптация; эволюция в медицине"],["37 шагов","26 базовых — к коллоквиуму, 10 — сверх программы"],["10 вопросов","самопроверка по базовому уровню"]],"all_sections":"Все разделы","short_route":"Если времени мало: десять шагов, по которым построена самопроверка →"},"lessons":[{"id":"three-explanations","num":1,"section":0,"questions":[1],"title":"Три вида объяснений: как работает, как возникло, что это значит для медицины","keywords":["Наблюдение","Модельный вывод","Историческое объяснение","Эволюция"],"lead":["Одно наблюдение можно объяснять тремя способами: каким механизмом оно создаётся сейчас, как сложилось в истории и что из этого следует для медицины. Эти объяснения не заменяют друг друга."],"mechanism":["Механизм отвечает на вопрос «как работает»: какие молекулы, клетки и ткани создают признак у живого организма. Историческое объяснение отвечает на вопрос «как возникло»: какие изменения, в каких линиях и при каких условиях привели к нынешнему состоянию. Медицинское следствие — что из механизма и истории вытекает для понимания болезни. Утверждения различаются и по статусу: [[T01|наблюдение]] — зарегистрированное свойство образца с указанием метода и погрешности; [[T02|модельный вывод]] — интерпретация наблюдений при допущениях о связи признака с функцией, процессом или родством; [[T03|историческое объяснение]] — реконструкция причин и последовательности прошлых событий, сопоставленная с альтернативами. На схемах страницы статус называют короче: «наблюдение», «расчёт по модели» (модельный вывод, полученный вычислением), «реконструкция» (историческое объяснение) и «гипотеза» (объяснение, ещё не сопоставленное с данными)."],"paragraphs":["Пример: давление кислорода на высокогорье ниже, чем на уровне моря. Механизм ответа на нехватку кислорода изучают на клетках и людях сейчас; что у части высокогорных популяций этот ответ изменён вариантом гена, полученным при смешении с древней линией, — историческое объяснение; что из происхождения варианта нельзя вывести риск конкретного человека, — граница медицинского вывода. Историческое объяснение не делает признак «правильным» или «оптимальным»: [[T04|эволюция]] — изменение наследственного состава популяций, а не движение к цели.","<b>На практикуме.<\/b> Все вкладки; итоговая задача — одно наблюдение, разобранное через частоту, след в последовательности, дерево и историю.","<b>Ограничения.<\/b> Историческое объяснение проверяют по данным, как и механизм, но прошлое не наблюдают: его реконструируют."],"conditions":"Схема качественная · пример условно упрощён.","sources":["src_01","src_06"],"base":"вспомнить [[seminar-12-route.html#function-origin|семинар 12: «Как система работает и как она возникла — разные вопросы»]] и [[seminar-12-route.html#four-statuses|семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»]]","quiz":{"id":"S16-L01","question":"Какое утверждение — историческое объяснение?","options":[{"id":"S16-L01-1","text":"Вариант гена распространился у предков популяции под действием отбора","correct":true,"feedback":"Это утверждение о прошлых событиях; его проверяют по геномам и датировкам"},{"id":"S16-L01-2","text":"Белок, кодируемый геном, участвует в ответе клетки на нехватку кислорода","correct":false,"feedback":"Это механизм: как работает система сейчас"},{"id":"S16-L01-3","text":"Ген прочитан у ста жителей высокогорья","correct":false,"feedback":"Это наблюдение: зарегистрировано свойство образцов"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются механизм, история и медицинский вывод?","status":"Схема качественная · пример условно упрощён","modes_label":"Чем различаются механизм, история и медицинский вывод?","modes":["механизм","история","медицинский вывод","статусы"],"args":[{"v":"mech"},{"v":"hist"},{"v":"med"},{"v":"status"}],"notes":["Как работает сейчас: белок в ответе клетки на нехватку кислорода","Как возникло: вариант получен при смешении, частота выросла","Медицинский вывод: риск конкретного человека из происхождения не следует","Три статуса: наблюдение, модельный вывод, историческое объяснение"],"static":["Три колонки «механизм — история — медицинский вывод» для одного наблюдения и строка статусов"],"scene":"s16_r_explain","L":{"r16_ex_h":"Одно наблюдение — три вида объяснений","r16_ex_mech":"механизм (как работает)","r16_ex_cell":"клетка","r16_ex_prot":"белок ответа на гипоксию","r16_ex_hist":"история (как возникло)","r16_ex_pop":"популяция","r16_ex_mix":"смешение","r16_ex_rise":"рост частоты","r16_ex_med":"медицинский вывод","r16_ex_person":"человек","r16_ex_norisk":"риск человека из происхождения не следует","r16_st_obs":"наблюдение","r16_st_obs_e":"зарегистрированное свойство образца с методом и погрешностью","r16_st_mod":"модельный вывод","r16_st_mod_e":"интерпретация наблюдений при допущениях","r16_st_hist":"историческое объяснение","r16_st_hist_e":"реконструкция прошлых событий, сопоставленная с альтернативами"}}},"exam_quiz":{"id":"S16-E01","question":"Что такое модельный вывод?","options":[{"id":"S16-E01-1","text":"Интерпретация наблюдений при допущениях","correct":true,"feedback":"Например, о связи признака с функцией или родством"},{"id":"S16-E01-2","text":"Зарегистрированное свойство образца","correct":false,"feedback":"Это наблюдение"},{"id":"S16-E01-3","text":"Окончательно доказанный факт","correct":false,"feedback":"Модельный вывод зависит от допущений"}]}},{"id":"data-lines","num":2,"section":0,"questions":[1],"title":"Линии данных и допустимые выводы","keywords":["Ископаемые остатки","Датирование","Археологические данные","Древняя ДНК","Древние белки","Радиометрическое датирование"],"lead":["Каждая линия данных отвечает только на свои вопросы: ископаемое — о строении, месте и возрасте, орудие — о технологии, древние молекулы — о родстве."],"mechanism":["[[T05|Ископаемые остатки]] показывают анатомию, географию и — через [[T06|датирование]] слоя — возраст. [[T07|Археологические данные]] — орудия, следы разделки, очаги — говорят о технологии и поведении, но не всегда об изготовителе. [[T08|Древняя ДНК]] и [[T09|древние белки]] уточняют родство и пол, но сохраняются лишь в части образцов: ДНК — главным образом в холодных областях и в образцах моложе нескольких сотен тысяч лет; белки зубной эмали сохраняются дольше, но содержат меньше различающихся позиций. Датирование определяет возраст слоя, в котором лежит находка, разными методами: [[T10|радиометрическое датирование]] вулканических туфов, [[T11|магнитостратиграфия]], уран-ториевый и уран-свинцовый методы для натёков в пещерах, термолюминесценция обожжённых кремней, радиоуглеродный метод для последних десятков тысяч лет. У каждой даты есть погрешность."],"paragraphs":["Вывод допустим, только если есть все нужные ему линии. «Несколько линий жили одновременно» требует и ископаемых, и датировок; «неандертальцы и денисовцы — сестринские линии» — геномов; «каменные орудия старше древнейших находок Homo» — орудий, датировок и ископаемых. Отсутствие находки — не доказательство отсутствия: ни одна линия данных не охватывает всех мест и эпох.","<b>На практикуме.<\/b> Вкладка 1, конструктор «Убрать линию данных».","<b>Ограничения.<\/b> Карта древних геномов отражает не только историю населения, но и условия сохранения ДНК и выбор образцов."],"conditions":"Расчёт по модели · правило «вывод допустим при всех нужных линиях» — учебное.","sources":["src_02","src_03","src_13","src_28"],"base":"БИО-16·1","quiz":{"id":"S16-L02","question":"Каменные орудия найдены в слое без костей гоминин. Что из этого следует?","options":[{"id":"S16-L02-1","text":"Их изготовил вид, живший в этом месте раньше всех","correct":false,"feedback":"Нужны останки в том же слое; одна близость во времени не указывает изготовителя"},{"id":"S16-L02-2","text":"Их возраст и технологию можно оценить, изготовителя — нет","correct":true,"feedback":"Изготовителя по самим орудиям не установить"},{"id":"S16-L02-3","text":"В этом месте гоминин не было","correct":false,"feedback":"Орудия сами — след присутствия гоминин; не найдены только их остатки"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие выводы допустимы при каждой линии данных?","status":"Расчёт по модели · правило учебное","modes_label":"Какие выводы допустимы при каждой линии данных?","modes":["все линии","без датирования","без ДНК и белков","без орудий"],"args":[{"panel":"B","on":["F","A","D","M"],"reveal":true},{"panel":"B","on":["F","A","M"],"reveal":true},{"panel":"B","on":["F","A","D"],"reveal":true},{"panel":"B","on":["F","D","M"],"reveal":true}],"notes":["Допустимы все 8 выводов","Недопустимы I1, I2, I3, I7","Недопустимы I5, I6, I8","Недопустимы I3, I4"],"static":["Четыре значка линий данных и список восьми выводов с отметками для четырёх режимов"],"scene":"s16_t1","L":{"tl_pB":"Б. Линии данных","tl_line_sh_F":"ископаемые","tl_line_sh_A":"орудия","tl_line_sh_D":"датирование","tl_line_sh_M":"ДНК и белки","tl_inf_head":"Выводы","tl_inf_need":"нужны линии","tl_inf_I1":"Несколько линий гоминин существовали одновременно","tl_adm":"допустим","tl_inf_I2":"Двуногость появилась задолго до увеличения мозга","tl_inf_I3":"Каменные орудия старше древнейших известных находок Homo","tl_inf_I4":"Орудия и останки гоминин найдены в одном слое: возможный изготовитель","tl_inf_I5":"Неандертальцы и денисовцы — сестринские линии","tl_inf_I6":"Нижняя челюсть из Тайваньского пролива принадлежала денисовцу","tl_inf_I7":"Ранние Homo sapiens жили в Африке около 300 тыс. лет назад","tl_inf_I8":"Предки неафриканцев смешивались с неандертальцами","tl_lines_sum":"Допустимых выводов: {n} из 8","tl_nadm":"недопустим"}}}},{"id":"bipedalism-mosaic","num":3,"section":0,"questions":[1],"title":"Двуногость: признаки появлялись не одновременно","keywords":["Двуногость","Мозаичная эволюция"],"lead":["Двуногость не появилась сразу целиком: у древних находок признаки прямохождения сочетаются с признаками лазания и с небольшим мозгом."],"mechanism":["[[T12|Двуногость]] — использование задних конечностей как основной опоры при передвижении по земле. [[T13|Мозаичная эволюция]] — неодновременное изменение разных признаков в одной или нескольких линиях. У Ardipithecus ramidus (4,51–4,3 млн лет назад) скелет указывает и на хорошее лазание, и на прямохождение по земле, мозг — размером с мозг шимпанзе. У Australopithecus afarensis (3,7–3,0 млн лет назад) таз, колено, стопа и позвоночник изменены для опоры на две ноги; следы в вулканическом пепле Летоли (3,6 млн лет) оставлены двуногими существами; мозговой отдел — 400–500 см³. Мозговой отдел объёмом около 850 см³ — у находки, отнесённой к Homo ergaster (африканскому H. erectus); интервал находок этого вида начинается около 1,7 млн лет назад. Значит, прямохождение сформировалось задолго до значительного увеличения мозга."],"paragraphs":["Более древние кандидаты известны по отдельным частям: Sahelanthropus tchadensis (7,2–6,8 млн лет) — главным образом по деформированному черепу с мозговой коробкой объёмом 320–380 см³; его положение на дереве спорно; Orrorin tugenensis (6,0–5,7 млн лет) — главным образом по бедренным костям, совместимым с двуногой нагрузкой. Если у находки нет нужной части скелета, признак по ней не оценивается: прочерк в таблице — «нет данных», а не «нет признака».","<b>На практикуме.<\/b> Вкладка 1, таблица «признак × находка».","<b>Ограничения.<\/b> По таблице признаков нельзя выстроить цепочку «предок → потомок»: сходный набор признаков мог возникнуть в разных линиях."],"conditions":"Схема по данным обзоров, упрощённая · даты — интервалы находок.","sources":["src_01","src_02"],"base":"БИО-16·2","quiz":{"id":"S16-L03","question":"Что показывают находки Ardipithecus ramidus?","options":[{"id":"S16-L03-1","text":"Двуногость возникла одновременно с крупным мозгом","correct":false,"feedback":"Мозг Ardipithecus был размером с мозг шимпанзе; крупный мозг появился позже"},{"id":"S16-L03-2","text":"Это прямой предок человека","correct":false,"feedback":"Предковое положение по одной находке не устанавливается"},{"id":"S16-L03-3","text":"Прямохождение сочеталось с хорошим лазанием","correct":true,"feedback":"Признаки разных способов передвижения в одном скелете"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие признаки есть у ранних находок?","status":"Схема по данным обзоров, упрощённая · даты — интервалы находок","modes_label":"Какие признаки есть у ранних находок?","modes":["таблица признаков","Ardipithecus","Au. afarensis","нет данных ≠ нет признака"],"args":[{"panel":"C"},{"panel":"C","hl":["ramidus"],"note":"ramidus"},{"panel":"C","hl":["afarensis"],"note":"afarensis"},{"panel":"C","hl":["sahel"],"note":"sahel"}],"notes":["Признаки появлялись неодновременно","Прямохождение и лазание в одном скелете","Таз, колено, стопа; следы Летоли; мозг 400–500 см³","Пустая клетка — у находки нет нужной части скелета"],"static":["Таблица три признака × четыре находки со значками состояний"],"scene":"s16_t1","L":{"mo_pC":"В. Мозаика признаков","tl_sh_sahel":"Sahelanthropus","mo_date_sahel":"7,2–6,8 млн лет","tl_sh_orrorin":"Orrorin","mo_date_orrorin":"6,0–5,7 млн лет","tl_sh_ramidus":"Ar. ramidus","mo_date_ramidus":"4,51–4,3 млн лет","tl_sh_afarensis":"Au. afarensis","mo_date_afarensis":"3,7–3,0 млн лет","mo_tr1":"Двуногость","mo_st_noteval":"не оценено","mo_st_compat":"совместимо","mo_st_yes":"есть","mo_tr2":"Признаки лазания","mo_st_nodata":"нет данных","mo_st_disp":"спорно","mo_tr3":"Небольшой мозговой отдел","mo_note_nd":"«Нет данных» — нужной части скелета у находки нет; «не оценено» — признак на странице не оценивается.","mo_note_tab":"Таблица не строит цепочку предков","mo_note_ramidus":"Скелет: хорошее лазание и прямохождение по земле; мозг размером как у шимпанзе","mo_note_afarensis":"Таз, колено, стопа, позвоночник; следы Летоли 3,6 млн лет; мозговой отдел 400–500 см³; плечевой пояс и кисть сохраняют признаки лазания; их значение спорно","mo_note_sahel":"Главным образом деформированный череп с мозговой коробкой 320–380 см³; положение на дереве спорно"}}},"exam_quiz":{"id":"S16-E03","question":"Что такое мозаичная эволюция?","options":[{"id":"S16-E03-1","text":"Смешение двух разных видов","correct":false,"feedback":"Это смешение или гибридизация"},{"id":"S16-E03-2","text":"Изменение всех признаков сразу","correct":false,"feedback":"Мозаичная эволюция — как раз неодновременное изменение"},{"id":"S16-E03-3","text":"Неодновременное изменение признаков","correct":true,"feedback":"Двуногость появилась раньше крупного мозга"}]}},{"id":"australopiths","num":4,"section":0,"questions":[1],"title":"Разнообразие австралопитеков: несколько линий одновременно","keywords":["Австралопитеки","Парантропы","Интервал находок"],"lead":["Около 2 млн лет назад в Африке одновременно существовали по меньшей мере четыре формы гоминин — история ветвилась, а не шла по ступеням."],"mechanism":["[[T14|Австралопитеки]] (Australopithecus) — двуногие гоминины с небольшим мозгом, известные в Африке примерно от 4,2 до 2 млн лет назад; название объединяет несколько форм и, вероятно, не обозначает одну естественную линию. Параллельно существовали [[T15|парантропы]] (Paranthropus) — с крупными коренными зубами и массивными челюстями; Kenyanthropus platyops (3,54–3,35 млн лет) — современник Au. afarensis. На шкале времени каждая форма — [[T16|интервал находок]]: отрезок «от самой ранней до самой поздней известной находки». Отрезки P. boisei (2,3–1,3), P. robustus (2,0–1,0), Homo habilis в широком смысле (2,35–1,65) и H. rudolfensis (2,0–1,95 млн лет) перекрываются."],"paragraphs":["Интервал находок — не время существования вида: первая и последняя находки почти никогда не совпадают с появлением и исчезновением линии. Поэтому концы отрезков на шкале штрихуются: даты с учётом погрешности шире консервативных (например, у Au. africanus — 3,0–2,4 млн лет и 4,02–1,9 млн лет с погрешностью: пещерные отложения датировать труднее, чем вулканические туфы). Связи между формами показаны только там, где они обоснованы; остальные — пунктиром «родство не установлено».","<b>На практикуме.<\/b> Вкладка 1, шкала времени.","<b>Ограничения.<\/b> Сколько видов объединяет каждое название, зависит от выбранной концепции вида."],"conditions":"Схема по данным обзора, упрощённая · отрезки — интервалы находок, а не время существования линий.","sources":["src_01","src_02"],"base":"БИО-16·3","quiz":{"id":"S16-L04","question":"Что означает отрезок вида на шкале времени?","options":[{"id":"S16-L04-1","text":"Интервал от ранней до поздней известной находки","correct":true,"feedback":"Линия могла появиться раньше и исчезнуть позже"},{"id":"S16-L04-2","text":"Время от возникновения до вымирания вида","correct":false,"feedback":"Этого по находкам не узнать: отрезок — интервал находок"},{"id":"S16-L04-3","text":"Время, когда вид был единственным гоминином","correct":false,"feedback":"Отрезки перекрываются: формы сосуществовали"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько форм гоминин существовало одновременно?","status":"Схема по данным обзора, упрощённая · интервалы находок","modes_label":"Сколько форм гоминин существовало одновременно?","modes":["шкала","отметка 3,5 млн лет","отметка 2,0 млн лет","погрешность"],"args":[{"panel":"A"},{"panel":"A","at":3.5,"reveal":true},{"panel":"A","at":2.0,"reveal":true},{"panel":"A","hl":["africanus"]}],"notes":["18 интервалов находок по группам","Au. afarensis и K. platyops","P. boisei, P. robustus, H. habilis в широком смысле, H. rudolfensis","Штриховка — даты с учётом погрешности (Au. africanus: 4,02–1,9 млн лет)"],"static":["Шкала времени с 18 отрезками и вертикальными линиями на 3,5 и 2,0 млн лет"],"scene":"s16_t1","L":{"tl_pA":"А. Шкала времени","tl_g_early":"ранние кандидаты","tl_sh_sahel":"Sahelanthropus","tl_sh_orrorin":"Orrorin","tl_sh_ramidus":"Ar. ramidus","tl_g_aus":"Australopithecus и Kenyanthropus","tl_sh_anamensis":"Au. anamensis","tl_sh_afarensis":"Au. afarensis","tl_sh_platyops":"K. platyops","tl_sh_africanus":"Au. africanus","tl_sh_sediba"  одной особи","correct":false,"feedback":"Интервал объединяет все находки вида"}]}},{"id":"early-homo","num":5,"section":0,"questions":[1],"title":"Ранний Homo и проблема определения рода","keywords":["Ранний Homo","Каменная индустрия"],"lead":["Граница между поздними австралопитеками и ранним Homo размыта: увеличение мозга, уменьшение зубов, изменения лица, кисти и пропорций шли мозаично, и единого признака рода нет."],"mechanism":["[[T17|Ранний Homo]] — неоднородная совокупность находок около 2,8–1,6 млн лет назад. Древнейшая находка, отнесённая к Homo, — нижняя челюсть из Леди-Герару (2,80–2,75 млн лет). H. habilis и H. rudolfensis часто считают разными видами, но различия могут отражать изменчивость по полу, месту и времени; часть находок предлагали относить к Australopithecus. Каменные орудия Ломекви (3,3 млн лет) старше древнейших известных находок Homo: [[T18|каменная индустрия]] — способ изготовления орудий, а не признак вида, и по орудиям нельзя установить изготовителя. С появлением Homo erectus в широком смысле (древнейшие находки — около 1,8 млн лет) гоминины впервые известны за пределами Африки."],"paragraphs":["Род — категория классификации; его границу проводят по набору признаков, и при мозаичной эволюции разные наборы дают разные границы. Поэтому «первый Homo» — не находка, а решение классификации, зависящее от того, какие признаки считать решающими.","<b>На практикуме.<\/b> Вкладка 1; «Найти причину» (случай I).","<b>Ограничения.<\/b> Поздняя граница H. erectus спорна: разные методы датирования поздних находок дают от 101 до 27 тыс. лет."],"conditions":"Схема по данным обзоров, упрощённая · отрезки — интервалы находок.","sources":["src_01","src_02","src_13"],"base":"БИО-16·4; вспомнить [[seminar-15-route.html#species-concepts|семинар 15: «Концепции вида и их границы»]]","quiz":{"id":"S16-L05","question":"Почему по орудиям Ломекви нельзя назвать их изготовителя?","options":[{"id":"S16-L05-1","text":"Орудия Ломекви слишком плохо датированы для вывода","correct":false,"feedback":"Слой датирован по туфам и магнитостратиграфии"},{"id":"S16-L05-2","text":"Индустрия описывает технологию, а не вид","correct":true,"feedback":"Изготовителя показывают только останки в том же слое"},{"id":"S16-L05-3","text":"В то время гоминин в Африке ещё не было","correct":false,"feedback":"Гоминины жили задолго до 3,3 млн лет назад"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему граница раннего Homo размыта?","status":"Схема по данным обзоров, упрощённая · интервалы находок","modes_label":"Почему граница раннего Homo размыта?","modes":["ранний Homo","орудия Ломекви","H. erectus","поздняя граница"],"args":[{"panel":"A","hl":["ledi","habilis","rudolfensis"]},{"panel":"A","hl":["ledi"],"hlMarker":"lomekwi","s6":true,"reveal":true},{"panel":"A","hl":["erectus"]},{"panel":"A","hl":["erectus"],"at":0.05,"reveal":true}],"notes":["Находки Homo 2,8–1,6 млн лет; границы видов спорны","Орудия старше древнейшей находки Homo","Древнейшие находки около 1,8 млн лет","101–27 тыс. лет — по разным методам; граница спорна"],"static":["Отрезки раннего Homo, засечка орудий 3,3 млн лет и отрезок H. erectus со штриховкой спорной поздней границы"],"scene":"s16_t1","L":{"tl_pA":"А. Шкала времени","tl_g_early":"ранние кандидаты","tl_sh_sahel":"Sahelanthropus","tl_sh_orrorin":"Orrorin","tl_sh_ramidus":"Ar. ramidus","tl_g_aus":"Australopithecus и Kenyanthropus","tl_sh_anamensis":"Au. anamensis","tl_sh_afarensis":"Au. afarensis","tl_sh_platyops":"K. platyops","tl_sh_africanus":"Au. africanus","tl_sh_sediba":"Au. sediba","tl_g_par":"Paranthropus","tl_sh_aethiopicus":"P. aethiopicus","tl_sh_boisei":"P. boisei","tl_sh_robustus":"P. robustus","tl_g_homo":"Homo","tl_sh_ledi":"Ледигераруская челюсть","tl_sh_habilis":"H. habilis (в широком смысле)","tl_sh_rudolfensis":"H. rudolfensis","tl_sh_erectus":"H. erectus","tl_sh_sapiens":"H. sapiens","tl_sh_deniso":"денисовцы","tl_sh_neand":"неандертальцы","tl_mk_short_lomekwi":"Орудия Ломекви, 3,3 млн лет","tl_mk_short_irhoud":"Джебель-Ирхуд, 315 ± 34 тыс. лет","tl_mk_short_omo1":"Омо I, не моложе 233 ± 22 тыс. лет","tl_n_sahel":"Sahelanthropus tchadensis","tl_n_orrorin":"Orrorin tugenensis","tl_n_ramidus":"Ardipithecus ramidus","tl_n_anamensis":"Australopithecus anamensis","tl_n_afarensis":"Australopithecus afarensis","tl_n_platyops":"Kenyanthropus platyops","tl_n_africanus":"Australopithecus africanus","tl_n_sediba":"Australopithecus sediba","tl_n_aethiopicus":"Paranthropus aethiopicus","tl_n_boisei":"Paranthropus boisei","tl_n_robustus":"Paranthropus robustus","tl_n_ledi":"Ледигераруская нижняя челюсть (отнесена к Homo)","tl_n_habilis":"Homo habilis (в широком смысле)","tl_n_rudolfensis":"Homo rudolfensis","tl_dispute":"методы расходятся","tl_n_erectus":"Homo erectus","tl_n_sapiens":"Homo sapiens","tl_n_deniso":"Денисовцы (находки Денисовой пещеры)","tl_n_neand":"Homo neanderthalensis","tl_ax_log":"млн лет назад (логарифмическая шкала)","s16_tl_cap":"Отрезок — интервал находок, а не время существования линии; штриховка — погрешность датирования","tl_now":"стрелка у H. sapiens — до настоящего","t1_s6_lab":"Орудия старше древнейшей известной находки Homo примерно на 0,5 млн лет; изготовитель неизвестен","tl_at_lab":"{t} млн лет назад"}},"zoomNarrow":true}},{"id":"established-open","num":6,"section":0,"questions":[1],"title":"Что установлено и что остаётся открытым","keywords":["Общий предок","Гоминины","Ископаемый вид","Денисовцы"],"lead":["Установлено: история гоминин ветвилась, двуногость появилась раньше крупного мозга, несколько линий сосуществовали. Открыто: положение многих находок, границы родов и видов, авторство многих орудий."],"mechanism":["Человек и шимпанзе — современные линии от [[T19|общего предка]]; [[T20|гоминины]] — линия, более близкая к человеку, чем к шимпанзе. Шимпанзе не предок человека: обе линии изменялись независимо. Новая находка может изменить видовое определение, показать, что несколько названий описывают одну изменчивую линию, или сдвинуть интервал вида. [[T24|Ископаемый вид]], генетическая линия и популяция — разные категории: [[T23|денисовцев]] выделили по ДНК, а не по анатомии."],"paragraphs":["Неопределённость отражает не слабость эволюционного объяснения, а неполноту летописи: сохранность костей и молекул зависит от условий, раскопки идут не везде. Сильный вывод опирается на согласие нескольких независимых линий данных.","<b>На практикуме.<\/b> Вкладка 1: пунктир «родство не установлено» на шкале; итоговая задача.","<b>Ограничения.<\/b> Число видов гоминин зависит от концепции вида и от того, как оценивают изменчивость внутри вида."],"conditions":"Схема качественная · статусы утверждений названы.","sources":["src_01","src_02","src_03"],"base":"БИО-16·2–16·5","quiz":{"id":"S16-L06","question":"Почему шимпанзе нельзя считать предком человека?","options":[{"id":"S16-L06-1","text":"Шимпанзе живут в других местах и средах","correct":false,"feedback":"Родство не определяется местом обитания"},{"id":"S16-L06-2","text":"У шимпанзе совсем другой набор генов","correct":false,"feedback":"Набор генов почти общий; дело в том, что линии разошлись от общего предка"},{"id":"S16-L06-3","text":"Обе линии — современные потомки общего предка","correct":true,"feedback":"Они разошлись и изменялись независимо"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что установлено и что открыто?","status":"Схема качественная · статусы утверждений названы","modes_label":"Что установлено и что открыто?","modes":["установлено","открыто","общий предок","три категории"],"args":[{"v":"known"},{"v":"open"},{"v":"ancestor"},{"v":"categories"}],"notes":["Ветвление, сосуществование, двуногость раньше крупного мозга","Положение находок, границы родов и видов, изготовители орудий","Человек и шимпанзе — современные линии от общего предка","Ископаемый вид, генетическая линия и популяция — разные категории"],"static":["Два списка «установлено / открыто», мини-дерево человек–шимпанзе и три категории"],"scene":"s16_r_open","L":{"r16_op_h":"Что установлено и что остаётся открытым","r16_op_known":"установлено","r16_op_k1":"ветвление: несколько линий одновременно","r16_op_k2":"сосуществование форм","r16_op_k3":"двуногость раньше крупного мозга","r16_op_open":"открыто","r16_op_o1":"положение многих находок на дереве","r16_op_o2":"границы родов и видов","r16_op_o3":"изготовители ранних орудий","r16_op_human":"человек","r16_op_chimp":"шимпанзе","r16_op_anc":"общий предок — не шимпанзе и не человек","r16_op_cap":"Длина ветви: время, млн лет (условно); общий предок — несколько млн лет назад","r16_op_sp":"вид","r16_op_sp_e":"ископаемый вид — по морфологии и правилам классификации","r16_op_line":"линия","r16_op_line_e":"генетическая линия — по молекулам","r16_op_pop":"популяция","r16_op_pop_e":"популяция — группа, обменивающаяся генами"}}}},{"id":"ilium-development","num":7,"section":0,"questions":[1],"title":"Двуногость: два изменения в развитии таза","keywords":["Гетеротопия","Гетерохрония"],"lead":["Короткая и широкая подвздошная кость человека формируется в развитии иначе, чем у других приматов, — двумя сдвигами в развитии."],"mechanism":["Изучили развитие таза у зародышей человека и других приматов, в том числе шимпанзе, и мыши. Первый сдвиг: хрящевая зона роста подвздошной кости человека расположена перпендикулярно положению у других приматов — изменилось место роста ([[T21|гетеротопия]]). Второй сдвиг: окостенение подвздошной кости начинается в другом месте и в другое время, чем у других приматов и чем в длинных костях человека ([[T22|гетерохрония]]). Эти изменения позволили тазу человека расти в ширину и сформировать подвздошную кость, необычную среди приматов."],"paragraphs":["Работа связывает анатомию двуногости с изменениями развития: признак взрослого скелета — результат того, где и когда растёт кость. Это согласуется с мозаичной эволюцией: форма таза могла меняться независимо от мозга и кисти.","<b>Как это узнали.<\/b> Сравнили срезы и изображения развивающегося таза у зародышей нескольких видов и активность генов в зоне роста.","<b>Граница вывода.<\/b> Последовательность сдвигов в истории гоминин выведена из сравнения современных видов; ископаемые зародыши не сохраняются. Что отбор действовал именно на эти изменения, — гипотеза.","<b>На практикуме.<\/b> Не моделируется; шаг дополняет таблицу мозаики признаков на вкладке 1."],"conditions":"Схема по данным работы, упрощённая · последовательность сдвигов — реконструкция.","sources":["src_18"],"base":"БИО-16·3","level":"adv","next_base":"molecular-past","quiz":{"id":"S16-L07","question":"Что показало сравнение развития таза?","options":[{"id":"S16-L07-1","text":"Изменились место и время роста кости","correct":true,"feedback":"Зона роста повёрнута, окостенение смещено"},{"id":"S16-L07-2","text":"Таз человека растёт так же, как у шимпанзе","correct":false,"feedback":"Найдены два различия развития"},{"id":"S16-L07-3","text":"Форма таза задана одним геном двуногости","correct":false,"feedback":"Найдены сдвиги развития, а не один ген"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как развитие таза человека отличается от других приматов?","status":"Схема по данным работы, упрощённая · контуры условны","modes_label":"Как развитие таза человека отличается от других приматов?","modes":["зона роста","окостенение","два сдвига"],"args":[{"v":"growth"},{"v":"ossif"},{"v":"both"}],"notes":["Зона роста повёрнута перпендикулярно положению у других приматов","Окостенение начинается в другом месте и в другое время","Два сдвига развития — короткая и широкая подвздошная кость"],"static":["Контуры развивающейся подвздошной кости человека и другого примата с зоной роста и центрами окостенения"],"scene":"s16_r_ilium","L":{"r16_il_h":"Развитие подвздошной кости (контуры условны)","r16_il_human":"человек","r16_il_other":"другие приматы","r16_il_zone":"хрящевая зона роста: повёрнута перпендикулярно (гетеротопия)","r16_il_cond":"Схема упрощена: форма и положение — условные; ископаемых зародышей нет.","r16_il_oss":"окостенение: в другом месте и в другое время (гетерохрония)","r16_il_two":"Два сдвига развития — короткая и широкая подвздошная кость"}}},"adv_kind":"Новые данные"},{"id":"denisovan-proteins","num":8,"section":0,"questions":[1],"title":"Белки называют линию, но не название вида","keywords":["Денисовцы","Ископаемый вид"],"lead":["Когда ДНК не сохранилась, принадлежность находки к линии иногда устанавливают по древним белкам — но спор о названии вида это не снимает."],"mechanism":["В пещере на юго-западе Китая просмотрели более 60 000 фрагментов костей; 76 проверили по пептидным «отпечаткам» коллагена, 17 — секвенированием белков. В коллагене нескольких фрагментов найден вариант аминокислоты, характерный для [[T23|денисовцев]], — по нему фрагменты отнесены к денисовской линии. Это местонахождение дало больше денисовских остатков, чем любое другое за пределами Денисовой пещеры. Для азиатских находок среднего плейстоцена при этом предложены два разных видовых названия, и находки, отнесённые к денисовцам по молекулам, оказались распределены между ними по-разному."],"paragraphs":["Пример показывает различие категорий: генетическая линия устанавливается по молекулам, а [[T24|ископаемый вид]] — по морфологии и правилам классификации; их соответствие нужно проверять для каждой находки.","<b>Как это узнали.<\/b> Белки извлекли из костей, определили последовательности пептидов масс-спектрометрией и сравнили с известными вариантами других гоминин.","<b>Граница вывода.<\/b> Белки содержат мало различающихся позиций: отнесение держится на одном–двух вариантах. Возраст и анатомия находок — отдельные вопросы; название вида — решение классификации, а не результат анализа белков.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 1."],"conditions":"Схема по данным работы, упрощённая · число фрагментов и вариант — из работы.","sources":["src_19"],"base":"БИО-16·2, БИО-16·6","level":"adv","next_base":"molecular-past","quiz":{"id":"S16-L08","question":"Что установили по белкам?","options":[{"id":"S16-L08-1","text":"Внешний облик и рост денисовцев","correct":false,"feedback":"Облик по нескольким вариантам белка не восстанавливается"},{"id":"S16-L08-2","text":"Принадлежность фрагментов к денисовцам","correct":true,"feedback":"По варианту аминокислоты, характерному для денисовцев"},{"id":"S16-L08-3","text":"Правильное название вида денисовцев","correct":false,"feedback":"Название вида — решение классификации; спор продолжается"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как белки относят находку к линии?","status":"Схема по данным работы, упрощённая · числа — из работы","modes_label":"Как белки относят находку к линии?","modes":["воронка","вариант коллагена","линия и название"],"args":[{"panel":"A"},{"panel":"B","show":true},{"panel":"C"}],"notes":["Более 60 000 фрагментов → 76 → 17","Вариант аминокислоты, характерный для денисовцев","Линия — по молекулам; название вида — по классификации"],"static":["Воронка отбора фрагментов, участок выравнивания коллагена и две колонки «линия — название»"],"scene":"s16_a1","L":{"a1_p1":"А. Воронка фрагментов","a1_f1":"более 60 000 фрагментов костей","a1_f2":"76 проверены по пептидным отпечаткам коллагена","a1_f3":"17 — секвенирование белков","a1_f4":"3 фрагмента кости гоминин","a1_f5":"2 зуба из раскопок","a1_fall":"у всех пяти — вариант коллагена, характерный для денисовцев","a1_fnote":"Каждый этап воронки — число фрагментов из работы. Отнесение к линии — по варианту аминокислоты, известному у денисовцев.","a1_p2":"Б. Выравнивание участка коллагена","a1_r1":"шимпанзе","a1_r2":"неандерталец","a1_r3":"современный человек","a1_r4":"денисовец","a1_r5":"фрагмент из пещеры","a1_one":"одна позиция — основание отнесения","a1_var":"Пурпурный — вариант, характерный для денисовцев","a1_aln_note":"Кружок — позиция аминокислоты; конкретная аминокислота не указана (схема упрощена).","a1_p3":"В. Линия и название вида","a1_c_line":"Линия (по молекулам)","a1_c_den":"денисовская линия","a1_c_name":"Название вида (по морфологии и правилам классификации)","a1_c_n1":"предложенное видовое название 1 — спорно","a1_c_n2":"предложенное видовое название 2 — спорно","a1_c_note":"Генетическая линия устанавливается по молекулам, а ископаемый вид — по морфологии и правилам классификации"}}},"adv_kind":"Новые данные"},{"id":"molecular-past","num":9,"section":1,"questions":[2],"title":"Какие молекулярные данные говорят о прошлом","keywords":["Рекомбинация","Митохондриальная ДНК","Нерекомбинирующая часть Y-хромосомы","Древняя ДНК"],"lead":["Геном современного человека — архив прошлого, но прошлое из него не считывают, а реконструируют через модель наследования и истории численности."],"mechanism":["По распределению вариантов и длинам общих участков реконструируют изменения численности, разделения и контакты популяций. Из-за [[T25|рекомбинации]] разные участки одной хромосомы имеют разную историю родства; поэтому история популяции складывается из историй многих участков. [[T26|Митохондриальная ДНК]] и [[T27|нерекомбинирующая часть Y-хромосомы]] — по одному участку, наследуемому по одной линии; их общий предок — не единственная женщина или мужчина своей эпохи, а лишь последний общий предок сохранившихся копий этого участка. [[T08|Древняя ДНК]] даёт прямой срез прошлого, но сохраняется неравномерно."],"paragraphs":["Геномные выводы имеют форму «данные → модель наследования и истории численности → оценка параметров → интервал неопределённости». Разные истории иногда дают сходный след в геномах; сильный вывод требует согласия современных геномов, древней ДНК, ископаемых и археологии. Годы получают из числа различий через скорость мутаций и длительность поколения — допущения, от которых зависит оценка.","<b>На практикуме.<\/b> Вкладка 2: дерево популяций с интервалами оценок узлов.","<b>Ограничения.<\/b> Древних геномов из тропической Африки мало: там ДНК сохраняется хуже."],"conditions":"Схема качественная · интервалы — оценки моделей.","sources":["src_03","src_17"],"base":"вспомнить [[seminar-15-route.html#gene-species-tree|семинар 15: «Дерево гена и дерево видов»]] и [[seminar-14-route.html#mtdna|семинар 14: «Митохондриальная ДНК как отдельный случай»]]","quiz":{"id":"S16-L09","question":"Почему по митохондриальной ДНК нельзя восстановить всю историю популяции?","options":[{"id":"S16-L09-1","text":"Митохондриальная ДНК не изменяется","correct":false,"feedback":"Изменяется; именно поэтому по ней строят генеалогии"},{"id":"S16-L09-2","text":"Митохондриальная ДНК есть только у женщин","correct":false,"feedback":"Есть у всех, но передаётся по материнской линии"},{"id":"S16-L09-3","text":"Это один участок с одной генеалогией","correct":true,"feedback":"История одного участка не равна истории популяции"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как из геномов получают историю?","status":"Схема качественная · интервалы — оценки моделей","modes_label":"Как из геномов получают историю?","modes":["данные","модель","оценка","интервал"],"args":[{"step":1},{"step":2},{"step":3},{"step":4}],"notes":["Наблюдение: варианты в геномах","Модель наследования и истории численности","Оценка параметров: времена, доли","Результат — интервал, а не точка"],"static":["Конвейер «данные → модель → оценка → интервал» с примерами источников данных"],"scene":"s16_r_pipeline","L":{"r16_pp_h":"Как из геномов получают историю","r16_pp_1":"данные","r16_pp_1_e":"геномы, древняя ДНК, мтДНК, Y-хромосома","r16_pp_2":"модель","r16_pp_2_e":"модель наследования и истории численности","r16_pp_3":"оценка","r16_pp_3_e":"скорость мутаций, длительность поколения → времена, доли","r16_pp_4":"интервал","r16_pp_4_e":"результат — интервал, а не точка","r16_pp_int":"интервал оценки"}}}},{"id":"african-origin","num":10,"section":1,"questions":[2],"title":"Происхождение Homo sapiens в Африке","keywords":["Эффект основателя"],"lead":["Ископаемые и геномы согласно указывают на Африку: древнейшие находки Homo sapiens — оттуда, и там же наибольшее генетическое разнообразие современных людей."],"mechanism":["Находки из Джебель-Ирхуда (Марокко) сочетают современное строение лица с более архаичной формой мозговой коробки; возраст слоя — 315 ± 34 тыс. лет по термолюминесценции обожжённых кремней. Минимальный возраст находки Омо I (Эфиопия) — 233 ± 22 тыс. лет: туф над ней привязали по химическому составу к извержению, датированному аргоновым методом. Наибольшее генетическое разнообразие людей — в Африке; неафриканские популяции несут в основном часть африканского разнообразия, изменённую [[T28|эффектом основателя]], дрейфом и последующим смешением."],"paragraphs":["Находки из разных частей Африки с разной мозаикой признаков указывают на длительное и географически распределённое формирование вида, а не на одну точку и один момент. Признаки современного строения появлялись неодновременно: лицо раньше, чем округлая мозговая коробка.","<b>На практикуме.<\/b> Вкладка 1 (шкала времени: засечки Джебель-Ирхуда и Омо I); вкладка 2.","<b>Ограничения.<\/b> Минимальный возраст говорит, что находка не моложе указанного, но не определяет её точный возраст."],"conditions":"Схема по данным работ, упрощённая · даты — с погрешностью и методом.","sources":["src_03","src_11","src_12","src_32"],"base":"БИО-16·2, БИО-16·9","quiz":{"id":"S16-L10","question":"Что означает «минимальный возраст 233 ± 22 тыс. лет» для Омо I?","options":[{"id":"S16-L10-1","text":"Находка не моложе этой оценки","correct":true,"feedback":"Датирован слой над находкой, сама она старше"},{"id":"S16-L10-2","text":"Находке ровно 233 тыс. лет","correct":false,"feedback":"Указана нижняя граница с погрешностью, а не точная дата"},{"id":"S16-L10-3","text":"Вид Homo sapiens возник 233 тыс. лет назад","correct":false,"feedback":"Возраст находки не равен времени возникновения вида"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что говорят ископаемые и геномы о происхождении в Африке?","status":"Схема по данным работ, упрощённая · даты с погрешностью и методом","modes_label":"Что говорят ископаемые и геномы о происхождении в Африке?","modes":["Джебель-Ирхуд","Омо I","разнообразие"],"args":[{"panel":"A","markers":["irhoud"],"hlMarker":"irhoud","hl":["sapiens"]},{"panel":"A","markers":["omo1"],"hlMarker":"omo1","hl":["sapiens"]},{"panel":"C","show":true}],"notes":["Возраст слоя 315 ± 34 тыс. лет","Минимальный возраст 233 ± 22 тыс. лет","Один участок: каждый следующий регион несёт часть аллелей предыдущего — след эффекта основателя"],"static":["Засечки двух находок на шкале и условная карта ветвления групп с подмножествами аллелей одного участка, без ступеней и вертикального порядка"],"scene":"s16_t1","scenes":["s16_t1","s16_t1","s16_t2"],"L":{"tl_pA":"А. Шкала времени","tl_g_early":"ранние кандидаты","tl_sh_sahel":"Sahelanthropus","tl_sh_orrorin":"Orrorin","tl_sh_ramidus":"Ar. ramidus","tl_g_aus":"Australopithecus и Kenyanthropus","tl_sh_anamensis":"Au. anamensis","tl_sh_afarensis":"Au. afarensis","tl_sh_platyops":"K. platyops","tl_sh_africanus":"Au. africanus","tl_sh_sediba":"Au. sediba","tl_g_par":"Paranthropus","tl_sh_aethiopicus":"P. aethiopicus","tl_sh_boisei":"P. boisei","tl_sh_robustus":"P. robustus","tl_g_homo":"Homo","tl_sh_ledi":"Ледигераруская челюсть","tl_sh_habilis":"H. habilis (в широком смысле)","tl_sh_rudolfensis":"H. rudolfensis","tl_sh_erectus":"H. erectus","tl_sh_sapiens":"H. sapiens","tl_sh_deniso":"денисовцы","tl_sh_neand":"неандертальцы","tl_mk_short_irhoud":"Джебель-Ирхуд, 315 ± 34 тыс. лет","tl_n_sahel":"Sahelanthropus tchadensis","tl_n_orrorin":"Orrorin tugenensis","tl_n_ramidus":"Ardipithecus ramidus","tl_n_anamensis":"Australopithecus anamensis","tl_n_afarensis":"Australopithecus afarensis","tl_n_platyops":"Kenyanthropus platyops","tl_n_africanus":"Australopithecus africanus","tl_n_sediba":"Australopithecus sediba","tl_n_aethiopicus":"Paranthropus aethiopicus","tl_n_boisei":"Paranthropus boisei","tl_n_robustus":"Paranthropus robustus","tl_n_ledi":"Ледигераруская нижняя челюсть (отнесена к Homo)","tl_n_habilis":"Homo habilis (в широком смысле)","tl_n_rudolfensis":"Homo rudolfensis","tl_dispute":"методы расходятся","tl_n_erectus":"Homo erectus","tl_n_sapiens":"Homo sapiens","tl_n_deniso":"Денисовцы (находки Денисовой пещеры)","tl_n_neand":"Homo neanderthalensis","tl_ax_log":"млн лет назад (логарифмическая шкала)","s16_tl_cap":"Отрезок — интервал находок, а не время существования линии; штриховка — погрешность датирования","tl_now":"стрелка у H. sapiens — до настоящего","tl_mk_short_omo1":"Омо I, не моложе 233 ± 22 тыс. лет","ad_pC":"В. Происхождение в Африке","tl_ax_lin_short":"млн лет назад","ad_c_both":"Обе засечки — находки в Африке; штриховка — погрешность датирования, стрелка у Омо I — минимальный возраст","ad_reg_afr":"Африка","ad_reg_n":"аллелей: {n}","ad_reg_r1":"регион 1","ad_reg_r2":"регион 2","ad_reg_r3":"регион 3","ad_c_cond":"Регионы — по удалённости от Африки, без порядка «выше / ниже»; аллели одного участка генома, числа условные","ad_c_lab":"Ископаемые и геномы указывают на Африку; разнообразие — одного участка, условная схема","ad_c_founder":"Меньшее разнообразие одного участка — след эффекта основателя, а не свойство людей"}}}},{"id":"structured-origin","num":11,"section":1,"questions":[2],"title":"Структурированные предковые популяции","keywords":["Структурированное происхождение","Коалесцентная дата"],"lead":["Африканское происхождение не означает происхождения от одной небольшой изолированной популяции: предковое население было разделено на части, которые обменивались генами."],"mechanism":["[[T29|Структурированное происхождение]] — модель, в которой несколько африканских популяций долго существовали частично обособленно, обменивались генами в разной степени и иногда сливались. Климатические и географические барьеры в Африке менялись во времени, поэтому популяции могли разделяться и снова встречаться. Такая структура способна создать глубоко расходящиеся генные линии без участия особого неизвестного вида. Модели различаются числом популяций, временем разделения и интенсивностью потока генов, но согласуются в главном: генетическое разнообразие Homo sapiens сложилось в ходе длительного процесса. [[T30|Коалесцентная дата]] — модельная оценка времени до общего предка копий участка генома; это не дата возникновения вида."],"paragraphs":["Составные части таких моделей — математические популяции; сопоставлять их с конкретными ископаемыми формами или современными группами можно только по дополнительным данным. Разные участки генома имеют разные коалесцентные даты, поэтому «возраст» одного участка не равен возрасту популяции.","<b>На практикуме.<\/b> Вкладка 2; продвинутый уровень — две модели происхождения рядом.","<b>Ограничения.<\/b> Выбор модели зависит от того, какие статистики генома используют и какие варианты модели сравнивают."],"conditions":"Схема качественная · популяции модели условны.","sources":["src_03","src_04","src_17"],"base":"БИО-16·10; вспомнить [[seminar-13-route.html#deep-structure|семинар 13: «Предки современного человека — две популяции, а не одна»]] (сверх программы)","quiz":{"id":"S16-L11","question":"Почему коалесцентная дата участка не равна дате возникновения вида?","options":[{"id":"S16-L11-1","text":"Коалесцентные даты всегда моложе вида","correct":false,"feedback":"Чаще бывают старше: копии сливаются в предковой популяции"},{"id":"S16-L11-2","text":"Копии участка могли разойтись задолго до вида","correct":true,"feedback":"Предковый полиморфизм переходит через разделения популяций"},{"id":"S16-L11-3","text":"Для коалесцентной даты не нужна модель","correct":false,"feedback":"Нужна: скорость мутаций, длительность поколения, история численности"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем структурированное происхождение отличается от одной популяции?","status":"Схема качественная · популяции модели условны","modes_label":"Чем структурированное происхождение отличается от одной популяции?","modes":["одна популяция","структура с обменом","коалесцентная дата"],"args":[{"v":"single"},{"v":"structured"},{"v":"tmrca"}],"notes":["Одна популяция без структуры","Несколько популяций с обменом и слиянием","Общий предок копий участка старше разделения популяций"],"static":["Три трубки-схемы: одна популяция, структура с дугами, генеалогия участка внутри трубок"],"scene":"s16_r_structure","L":{"r16_sr_h":"Одна популяция или структура с обменом","r16_sr_one":"одна популяция без структуры","r16_sr_copies":"копии участка сливаются к общему предку","r16_sr_cond":"Схема качественная: популяции и времена модели условны.","r16_sr_flow":"поток генов","r16_sr_merge":"несколько популяций с обменом и слиянием","r16_sr_tmrca":"общий предок копий участка старше разделения популяций"}}},"exam_quiz":{"id":"S16-E04","question":"Что такое коалесцентная дата?","options":[{"id":"S16-E04-1","text":"Время до предка копий участка","correct":true,"feedback":"Это не дата возникновения вида"},{"id":"S16-E04-2","text":"Возраст конкретной ископаемой находки","correct":false,"feedback":"Возраст находки определяют датированием слоя"},{"id":"S16-E04-3","text":"Дата смешения двух популяций","correct":false,"feedback":"Смешение датируют, например, по длине унаследованных участков"}]}},{"id":"dispersal","num":12,"section":1,"questions":[2],"title":"Расселение из Африки","keywords":["Расселение","Популяционная структура"],"lead":["Основная часть генетического наследия неафриканских популяций восходит к одному крупному расселению из Африки, завершившемуся не позднее примерно 45–40 тыс. лет назад (оценки моделей); более ранние выходы оставили малый вклад или не оставили его."],"mechanism":["По мере [[T31|расселения]] небольшие группы многократно отделялись от исходных популяций. Последовательные эффекты основателя и дрейф уменьшали часть разнообразия с удалением от Африки; меньшее разнообразие — след истории основания групп, а не свойство людей. На примере одного участка генома: если расположить регионы по удалённости пути от Африки к югу от Сахары, аллели каждого следующего региона оказываются частью аллелей предыдущего. Движение шло в разных направлениях: были обратные миграции в Африку, контакты соседних популяций, позднейшие переселения; поэтому возникла [[T32|популяционная структура]] — неоднородность частот вариантов и родства между группами, связанная с местом и историей."],"paragraphs":["Время основного выхода связано и со смешением с неандертальцами: если смешение произошло у общих предков всех неафриканцев, то они уже покинули Африку к этому времени. Генетическое происхождение человека — вероятностное описание родства участков его генома с выбранными референсными популяциями; оно не задаёт набора биологических свойств.","<b>На практикуме.<\/b> Вкладка 2.","<b>Ограничения.<\/b> Датировки расселения зависят от моделей, калибровки и от того, какие древние геномы доступны; одна генеалогическая карта не описывает всех переселений."],"conditions":"Схема качественная · направления и группы условны.","sources":["src_01","src_03","src_05"],"base":"БИО-16·10, БИО-16·11; вспомнить [[seminar-13-route.html#bottleneck-founder|семинар 13: «Узкое место и эффект основателя»]]","quiz":{"id":"S16-L12","question":"Почему разнообразие уменьшается с удалением от Африки?","options":[{"id":"S16-L12-1","text":"Отбор против редких вариантов вне Африки","correct":false,"feedback":"Основная причина — малые группы основателей и дрейф, а не отбор"},{"id":"S16-L12-2","text":"Мутации вне Африки возникают реже","correct":false,"feedback":"Дело не в скорости мутаций, а в выборке копий при основании групп"},{"id":"S16-L12-3","text":"Эффекты основателя при расселении","correct":true,"feedback":"Каждая новая группа несла часть разнообразия исходной"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему разнообразие уменьшается при расселении?","status":"Схема качественная · направления и группы условны","modes_label":"Почему разнообразие уменьшается при расселении?","modes":["последовательные основатели","обратные миграции","популяционная структура"],"args":[{"v":"serial"},{"v":"back"},{"v":"structure"}],"notes":["Каждая группа несёт часть аллелей","Движение в разных направлениях","Неоднородность частот, связанная с местом и историей"],"static":["Ветвление групп основателей на условной карте с уменьшающимся набором аллелей одного участка и стрелки обратных миграций, без ступеней"],"scene":"s16_r_founder","L":{"r16_fo_h":"Расселение: последовательные основатели","r16_fo_src":"исходная популяция","r16_fo_serial":"Каждая группа основателей несёт часть аллелей","r16_fo_cond":"Без ступеней и порядка «выше / ниже»: группы и направления условны; аллели одного участка.","r16_fo_back":"обратная миграция","r16_fo_back_t":"Движение в разных направлениях","r16_fo_structure":"Неоднородность частот, связанная с местом и историей"}}}},{"id":"archaic-lineages","num":13,"section":1,"questions":[2],"title":"Неандертальцы и денисовцы как генетические линии","keywords":["Неандертальцы","Генетическая линия","Призрачная линия"],"lead":["Неандертальцы и денисовцы — сестринские линии, родственные Homo sapiens; денисовцев сначала выделили по ДНК, а не по анатомии."],"mechanism":["Геномы неандертальцев и денисовцев имеют больше общих вариантов друг с другом, чем с современными людьми: они происходят от общей предковой популяции, отделившейся от предков современных людей около 630–520 тыс. лет назад, и разделились между собой около 440–390 тыс. лет назад (модельные оценки). [[T33|Неандертальцы]] известны по многочисленным ископаемым Европы, Западной и Центральной Азии и юга Сибири (консервативный интервал находок — 130–40 тыс. лет) и по нескольким геномам. Денисовцы известны по немногим находкам; лишь недавно денисовскую митохондриальную ДНК удалось связать с почти полным черепом: её выделили из зубного камня черепа из Харбина (возраст более 146 тыс. лет), когда из зуба и кости ДНК получить не удалось. Древнейшие денисовские остатки в Денисовой пещере имеют возраст около 200 тыс. лет, последние — около 55 тыс. лет (оптическое датирование отложений). [[T34|Генетическая линия]] — совокупность носителей, связанных общим происхождением по геному; она не обязательно совпадает с морфологически определённым видом."],"paragraphs":["Прямое свидетельство контакта двух древних линий — геном особи Денисова 11: мать была неандерталкой, отец — денисовцем. Значит, скрещивание происходило не только с Homo sapiens. Генетические следы указывают и на линии, известные только по статистическому следу в геномах, — [[T35|призрачные линии]]; их соотнесение с ископаемыми предположительно.","<b>На практикуме.<\/b> Вкладка 2: дерево с интервалами узлов и дугами обмена.","<b>Ограничения.<\/b> Даты разделения зависят от скорости мутаций и длительности поколения."],"conditions":"Схема по данным обзора, упрощённая · интервалы узлов — оценки моделей.","sources":["src_02","src_03","src_14","src_16","src_31","src_36"],"base":"БИО-16·9, БИО-16·6","quiz":{"id":"S16-L13","question":"Что значит, что денисовцы — генетическая линия?","options":[{"id":"S16-L13-1","text":"Их выделили по ДНК, а не по скелету","correct":true,"feedback":"Линия установлена по геному, а не по строению скелета"},{"id":"S16-L13-2","text":"Это группа современных людей Азии","correct":false,"feedback":"Денисовцы — древняя линия, сестринская неандертальцам"},{"id":"S16-L13-3","text":"Это поздние потомки европейских неандертальцев","correct":false,"feedback":"Это сестринские линии с общей предковой популяцией"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как связаны Homo sapiens, неандертальцы и денисовцы?","status":"Схема по данным обзора, упрощённая · интервалы узлов — оценки","modes_label":"Как связаны Homo sapiens, неандертальцы и денисовцы?","modes":["дерево","интервалы узлов","Денисова 11"],"args":[{"panel":"A","arcs":false,"nodeLab":false},{"panel":"A","arcs":false,"nodeLab":true},{"panel":"A","arcs":true,"arcLab":true,"nodeLab":true}],"notes":["Неандертальцы и денисовцы — сестринские линии","Интервалы оценок у узлов","Мать-неандерталка, отец-денисовец"],"static":["Дерево четырёх популяций с интервалами узлов и одной дугой «неандертальцы × денисовцы»"],"scene":"s16_t2","L":{"ad_pA":"А. Дерево популяций","ad_tip_afr":"Африка","ad_tip_nonafr":"неафриканцы","ad_tip_n":"неандертальцы","ad_tip_d":"денисовцы","ad_int_root":"630–520 тыс. лет назад","ad_int_nd":"440–390 тыс. лет назад","ad_cap":"Длина ветви: время, тыс. лет назад; интервалы у узлов — оценки моделей","ad_ax":"тыс. лет назад","ad_node_afr":"расселение из Африки — см. «Объяснения»","ad_arcs_note":"Положение дуг и узла «Африка — неафриканцы» по времени условно; ось — для узлов с интервалами","ad_arc_lab_n":"неандертальцы → предки неафриканцев","ad_arc_lab_d":"денисовцы → предки популяций Океании и Азии","ad_arc_lab_nd":"Денисова 11: мать-неандерталка, отец-денисовец","ad_arc_lab_s":"ранние Homo sapiens → неандертальцы"}}}},{"id":"admixture","num":14,"section":1,"questions":[2],"title":"Смешение и интрогрессия","keywords":["Смешение популяций","Интрогрессия","Сантиморган","Локальное происхождение участка"],"lead":["Смешение — событие в истории популяций; интрогрессия — его след: участки генома одной линии в генофонде другой."],"mechanism":["[[T36|Смешение популяций]] — образование потомства между ранее обособленными популяциями. [[T37|Интрогрессия]] — включение генетического материала одной линии в генофонд другой через смешение и последующие скрещивания. У гибрида первого поколения одна хромосома каждой пары целиком от одного источника; в следующих поколениях рекомбинация дробит участки, поэтому их средняя длина L (в сантиморганах) убывает со временем. Через 100 поколений L = 1 сМ, через 500 — 0,2 сМ, через 2000 — 0,05 сМ. Обратный расчёт по измеренной длине участков даёт время смешения."],"paragraphs":[{"details":"Формула и расчёт","text":"L = 100/t, где L — средняя длина участка в [[T76|сантиморганах]], t — число поколений после смешения (учебная модель: длины распределены экспоненциально, примесь мала, отбор не учитывается)."},"У современных неафриканцев около 2 % генома отнесено к неандертальскому происхождению; оценка зависит от референсного генома и метода. У коренных популяций Океании к востоку от линии Уоллеса заметна доля денисовского происхождения. Доля в одном геноме не равна неандертальскому вкладу во всё человечество: разные люди несут разные участки. Геном нельзя представить неизменной смесью процентов «видов»: рекомбинация дробила участки, их частоты менялись, часть утрачена. [[T38|Локальное происхождение участка]] — оценённое происхождение конкретного участка относительно выбранных референсных популяций.","<b>На практикуме.<\/b> Вкладка 2: длина унаследованных участков при трёх значениях времени.","<b>Ограничения.<\/b> Формула не учитывает отбор против архаичных участков и повторные смешения."],"conditions":"Расчёт по модели · t — условные значения; доли — оценки для названных выборок.","sources":["src_03","src_05","src_15","src_17"],"base":"БИО-16·13; вспомнить [[seminar-15-route.html#introgression|семинар 15: «Интрогрессия»]]","quiz":{"id":"S16-L14","question":"Почему длина унаследованных участков позволяет датировать смешение?","options":[{"id":"S16-L14-1","text":"Архаичные участки длиннее остальных","correct":false,"feedback":"Длина участков зависит от времени, а не от источника"},{"id":"S16-L14-2","text":"Рекомбинация дробит их каждое поколение","correct":true,"feedback":"Чем больше поколений прошло, тем короче участки"},{"id":"S16-L14-3","text":"Отбор укорачивает участки с течением времени","correct":false,"feedback":"Укорачивает рекомбинация; отбор меняет частоту участков"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему длина участков датирует смешение?","status":"Расчёт по модели · t условные","modes_label":"Почему длина участков датирует смешение?","modes":["гибрид","100 поколений","500 поколений","2000 поколений"],"args":[{"panel":"B","t":1,"show":true},{"panel":"B","t":100,"show":true},{"panel":"B","t":500,"show":true},{"panel":"B","t":2000,"show":true}],"notes":["Одна хромосома целиком архаичная","L = 1 сМ","L = 0,2 сМ","L = 0,05 сМ"],"static":["Пара хромосом и архаичные участки при четырёх значениях времени с показателем средней длины"],"scene":"s16_t2","L":{"ad_pB":"Б. Участки после смешения","ad_chr_top":"пара хромосом одного человека","ad_chr_scale":"хромосома — 100 сМ (условно)","ad_zoom":"Увеличено: 2 сМ хромосомы с одним участком средней длины","ad_whole":"целая хромосома от архаичной популяции","ad_zoom_end":"2 сМ","ad_lg_arch":"А — участок архаичного происхождения","ad_lg_sap":"С — участок Homo sapiens","ad_lg_rec":"точка рекомбинации","ad_formula":"Расчёт по модели L = 100 / t","ad_nseg":"Число участков на рисунке условно; t — число поколений после смешения","ad_L":"{L} сМ"}}},"exam_quiz":{"id":"S16-E05","question":"От чего зависит средняя длина участков, унаследованных при смешении?","options":[{"id":"S16-E05-1","text":"От доли примеси в геноме","correct":false,"feedback":"Доля и длина участков — разные величины"},{"id":"S16-E05-2","text":"От числа поколений после смешения","correct":true,"feedback":"Рекомбинация дробит их каждое поколение"},{"id":"S16-E05-3","text":"От размера популяции-донора","correct":false,"feedback":"В учебной модели длина зависит только от времени"}]}},{"id":"locus-vs-population","num":15,"section":1,"questions":[2],"title":"История участка и история популяции — не одно и то же","keywords":["Неполная сортировка линий","Гаплотип"],"lead":["Один участок генома, сближающий две популяции сильнее остальных, не меняет всей истории популяций: у участка своя генеалогия."],"mechanism":["Причин может быть три. [[T39|Неполная сортировка линий]]: копии участка разошлись ещё в предковой популяции, и общие у двух популяций варианты унаследованы от неё; общий участок короткий, а его копии разошлись раньше разделения популяций. Интрогрессия: участок пришёл при смешении; он длиннее, а копии разошлись позже разделения популяций. Отбор на этом участке: вариант стал частым, и вокруг него сохраняется протяжённый общий [[T40|гаплотип]] — набор вариантов, наследуемых вместе на одной хромосоме. Отбор может сочетаться с интрогрессией; поэтому длина участка сама по себе не отличает отбор от недавнего смешения."],"paragraphs":["Различают по длине общего участка, по времени расхождения его копий и по признакам отбора. Дерево популяций строят по многим участкам; отклонение одного — повод проверить причину, а не перестраивать дерево. Предполагают, что митохондриальная ДНК и Y-хромосома поздних неандертальцев были замещены копиями, родственными Homo sapiens, после раннего потока генов из Африки, — так история отдельного участка может разойтись с историей популяции.","<b>На практикуме.<\/b> Вкладка 2, «Найти причину» (случай II).","<b>Ограничения.<\/b> При малом числе участков доли разных генеалогий колеблются случайно."],"conditions":"Схема качественная · три причины условно разведены.","sources":["src_03","src_17"],"base":"БИО-16·14; вспомнить [[seminar-15-route.html#ils|семинар 15: «Неполная сортировка линий»]] и [[seminar-15-route.html#ils-vs-introgression|семинар 15: «Как различают неполную сортировку и интрогрессию»]]","quiz":{"id":"S16-L15","question":"Какой признак указывает на интрогрессию, а не на неполную сортировку?","options":[{"id":"S16-L15-1","text":"Короткий общий участок с древним расхождением копий","correct":false,"feedback":"Так выглядит неполная сортировка линий"},{"id":"S16-L15-2","text":"Общий участок найден у одной популяции","correct":false,"feedback":"Для вывода нужны обе популяции и архаичный геном"},{"id":"S16-L15-3","text":"Длинный общий участок с поздним расхождением копий","correct":true,"feedback":"Рекомбинация ещё не успела его раздробить"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются три причины сходства одного участка?","status":"Схема качественная · три причины","modes_label":"Чем различаются три причины сходства одного участка?","modes":["неполная сортировка","интрогрессия","отбор"],"args":[{"c":"ils"},{"c":"intro"},{"c":"sel"}],"notes":["Короткий участок, копии разошлись до разделения популяций","Длинный участок, копии разошлись после разделения","Высокая частота и протяжённый гаплотип"],"static":["Три панели генеалогии участка в трубках популяций и полосы длины участка"],"scene":"s16_r_locus","L":{"r16_lc_h":"Три причины сходства одного участка","r16_lc_p1":"популяция 1","r16_lc_p2":"популяция 2","r16_lc_split":"разделение","r16_lc_len":"длина общего участка","r16_lc_ils":"короткий участок; копии разошлись до разделения популяций","r16_lc_intro":"длинный участок; копии разошлись после разделения","r16_lc_sel":"высокая частота и протяжённый гаплотип"}}}},{"id":"weak-stem","num":16,"section":1,"questions":[2],"title":"Слабоструктурированный ствол: модель вместо одного предка","keywords":["Слабоструктурированный ствол"],"lead":["Две модели структурированного происхождения по-разному описывают предков Homo sapiens; данные пока не позволяют окончательно выбрать между ними."],"mechanism":["По геномам 290 человек из южной, восточной и западной Африки и Евразии сравнили несколько моделей. Модель одной неструктурированной популяции описала данные плохо. Лучше описали модели [[T41|слабоструктурированного ствола]]: две или более предковые популяции более миллиона лет оставались связаны умеренным потоком генов, а не были изолированы; в одной из лучших моделей они сливались в разных долях около 120 и около 100 тыс. лет назад. На эту раннюю структуру приходится лишь 1–4 % различий между современными популяциями. Самое раннее расхождение современных популяций — около 135–110 тыс. лет назад. Другая модель (шаг «Предки современного человека — две популяции, а не одна») описывает две популяции, разошедшиеся около 1,5 млн лет назад и слившиеся около 300 тыс. лет назад в соотношении около 80 : 20."],"paragraphs":["Обе модели отвергают одну неструктурированную предковую популяцию и объясняют следы в геномах, прежде приписанные смешению с неизвестной древней линией в Африке. Различаются они допущением о потоке генов между предковыми популяциями: постоянный обмен — или долгое разделение и слияние. Предсказание первой модели: ископаемые сосуществовавших предковых популяций должны быть сходны и генетически, и морфологически.","<b>Как это узнали.<\/b> Сравнили, насколько каждая модель воспроизводит сцепление и разнообразие вариантов в геномах разных популяций, и проверили лучшие модели по статистикам, не использованным при подборе.","<b>Граница вывода.<\/b> Авторы подчёркивают, что любая модель может быть неверно задана; более сложные модели, включая слабую структуру вместе с древней примесью, не исключены. Спор не закрыт.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 2."],"conditions":"Схема по данным работы, упрощённая · даты — оценки моделей.","sources":["src_04"],"base":"БИО-16·11; вспомнить [[seminar-13-route.html#deep-structure|семинар 13: «Предки современного человека — две популяции, а не одна»]]","level":"adv","next_base":"five-lines","quiz":{"id":"S16-L16","question":"Чем модель слабоструктурированного ствола отличается от модели слияния двух давно разделённых популяций?","options":[{"id":"S16-L16-1","text":"Предковые популяции постоянно обменивались генами","correct":true,"feedback":"В ней нет долгой изоляции перед слиянием"},{"id":"S16-L16-2","text":"В ней всего одна предковая популяция","correct":false,"feedback":"Предковых популяций две или больше"},{"id":"S16-L16-3","text":"Она требует древней примеси неизвестного вида","correct":false,"feedback":"Наоборот: она объясняет эти следы без такой примеси"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем различаются две модели происхождения?","status":"Схема по данным работ, упрощённая · спор не закрыт","modes_label":"Чем различаются две модели происхождения?","modes":["модель 1","модель 2","что объясняет каждая"],"args":[{"m":1},{"m":2},{"m":"table","show":true}],"notes":["Стволы связаны потоком генов; слияния около 120 и около 100 тыс. лет назад","Разделение 1,5 млн лет назад, слияние 300 тыс. лет назад, 80 : 20","Таблица наблюдений в одинаковом оформлении"],"static":["Две схемы трубок популяций рядом и таблица наблюдений"],"scene":"s16_a2","L":{"a2_pA":"Две модели происхождения","a2_m1":"Модель 1: слабоструктурированный ствол","a2_m1_flow":"поток генов между предковыми популяциями — более 1 млн лет","a2_m1_120":"слияния около 120 и около 100 тыс. лет назад","a2_m1_div":"штриховка — расхождение современных популяций около 135–110 тыс. лет назад","a2_ax":"Шкала слева: тыс. лет назад (логарифмическая), настоящее внизу","a2_cap":"Модели подобраны по разным статистикам генома. Данные пока не позволяют окончательно выбрать между ними.","a2_m2":"Модель 2: две давно разделённые популяции","a2_m2_15":"разделение около 1,5 млн лет назад","a2_m2_300":"слияние около 300 тыс. лет назад, 80 : 20","a2_pB":"Какие наблюдения объясняет каждая модель","a2_t_obs":"Наблюдение","a2_t_m1":"Модель 1","a2_t_m2":"Модель 2","a2_t1":"Одна неструктурированная популяция описывает геномы плохо","a2_t1_1":"да","a2_t1_2":"да","a2_t2":"Следы глубоко расходящихся линий у современных людей","a2_t2_1":"да, без древней примеси","a2_t2_2":"да, через слияние","a2_t3":"Ранняя структура объясняет 1–4 % различий современных популяций","a2_t3_1":"да (оценка модели)","a2_t3_2":"не оценивалось","a2_t4":"Меньшая предковая популяция дала участки, чаще удалённые от генов","a2_t4_1":"не оценивалось","a2_t4_2":"да","a2_t5":"Предсказание: сосуществовавшие предки сходны генетически и морфологически","a2_t5_1":"да","a2_t5_2":"—"}}},"adv_kind":"Новые данные"},{"id":"admixture-timing","num":17,"section":1,"questions":[2],"title":"Когда предки неафриканцев смешивались с неандертальцами","keywords":[],"lead":["Основная часть неандертальского происхождения у неафриканцев восходит к одному продолжительному периоду смешения, а не к многим разрозненным эпизодам."],"mechanism":["По геномам 59 древних людей, живших от 45 до 2,2 тыс. лет назад, и 275 современных людей изучили распределение неандертальских участков. Ковариация неандертальского происхождения вдоль генома и длины участков показали один продолжительный период смешения с общими предками всех неафриканцев около 50,5–43,5 тыс. лет назад: середина около 47 тыс. лет назад, длительность около 7 тыс. лет. Неандертальские участки у разных древних людей часто лежат в одних и тех же местах генома — это согласуется с общим событием, а не с независимыми смешениями."],"paragraphs":["Следствие: основной выход предков неафриканцев из Африки произошёл не позже 43,5 тыс. лет назад. Большая часть отбора — и в пользу неандертальских вариантов, и против них — пришлась примерно на первые 100 поколений после смешения: недостаток участков в функционально важных областях виден уже у самых ранних людей выборки.","<b>Как это узнали.<\/b> У людей, живших в разное время, сравнили длины неандертальских участков: чем раньше после смешения жил человек, тем длиннее участки.","<b>Граница вывода.<\/b> Модель продолжительного смешения сравнивали с моделью однократного события; более мелкие поздние эпизоды смешения у отдельных групп не исключены. Годы получены через длительность поколения — допущение.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 2 (засечки на шкале времени)."],"conditions":"Схема по данным работы, упрощённая · интервал — оценка модели.","sources":["src_05"],"base":"БИО-16·14","level":"adv","next_base":"five-lines","quiz":{"id":"S16-L17","question":"Почему у людей, живших раньше, неандертальские участки длиннее?","options":[{"id":"S16-L17-1","text":"Они получили больше неандертальских участков","correct":false,"feedback":"Длина и доля участков — разные величины"},{"id":"S16-L17-2","text":"После смешения прошло меньше поколений","correct":true,"feedback":"Рекомбинация успела раздробить их меньше"},{"id":"S16-L17-3","text":"У них была другая скорость рекомбинации","correct":false,"feedback":"Скорость рекомбинации считают одинаковой; различается время"}]},"widget":{"kind":"dna","title":"","s":{"title":"Когда смешивались предки неафриканцев с неандертальцами?","status":"Схема по данным работы, упрощённая · интервал — оценка","modes_label":"Когда смешивались предки неафриканцев с неандертальцами?","modes":["шкала","длины участков","выход из Африки"],"args":[{"v":"interval"},{"v":"tracts"},{"v":"ooa"}],"notes":["Один продолжительный период около 7 тыс. лет","У живших раньше участки длиннее","Выход — не позже 43,5 тыс. лет назад"],"static":["Шкала 60–40 тыс. лет с интервалом смешения и точками древних людей с длинами участков"],"scene":"s16_r_timing","L":{"r16_tm_h":"Время смешения с неандертальцами","ad_ax":"тыс. лет назад","r16_tm_int":"50,5–43,5 тыс. лет назад","r16_tm_mid":"середина около 47 тыс. лет; длительность около 7 тыс. лет","r16_tm_p1":"жил раньше (условно)","r16_tm_p2":"жил позже","r16_tm_p3":"современный человек","r16_tm_tr":"У живших раньше участки длиннее (длины на рисунке условны).","r16_tm_ooa":"выход из Африки — не позже 43,5 тыс. лет назад"}}},"adv_kind":"Новые данные"},{"id":"sex-bias","num":18,"section":1,"questions":[2],"title":"Смешение было неравным по полу","keywords":[],"lead":["На X-хромосомах современных людей неандертальских участков мало; проверка в обратном направлении указывает не на несовместимость, а на неравные по полу скрещивания."],"mechanism":["В геноме алтайского неандертальца нашли участки, полученные от ранних Homo sapiens. На его X-хромосомах доля таких участков в 1,62 раза выше, чем на аутосомах. Если бы неандертальские участки на X-хромосомах людей удалял отбор из-за несовместимости X-хромосом двух линий, недостаток ожидался бы в обоих направлениях. Избыток на X у неандертальца указывает, что в этих скрещиваниях преобладали пары «мужчина-неандерталец — женщина Homo sapiens». У женщины две X-хромосомы, у мужчины одна; если бы между группами переходили только женщины, отношение не превысило бы 4/3. Наблюдаемое 1,62 выше этого предела, поэтому авторы считают более простым объяснением предпочтение при выборе партнёра."],"paragraphs":["Пример показывает, как одно наблюдение (недостаток неандертальских участков на X у людей) допускает два объяснения и как обратное направление обмена позволяет их различить.","<b>Как это узнали.<\/b> Сравнили долю участков Homo sapiens на X-хромосомах и аутосомах у трёх неандертальцев высокого качества прочтения; у всех трёх отношение больше 1.","<b>Граница вывода.<\/b> Вывод модельный, по небольшому числу геномов; он описывает соотношение в популяциях, а не поведение конкретных людей.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 2 (дуга «ранние Homo sapiens → неандертальцы»)."],"conditions":"Схема по данным работы, упрощённая · 4/3 — предел расчёта, 1,62 — измерено.","sources":["src_20"],"base":"БИО-16·14, БИО-16·15","level":"adv","next_base":"five-lines","quiz":{"id":"S16-L18","question":"Почему избыток участков Homo sapiens на X у неандертальца говорит против несовместимости X-хромосом?","options":[{"id":"S16-L18-1","text":"У неандертальцев X-хромосомы не прочитаны","correct":false,"feedback":"Были; сравнивали X-хромосомы и аутосомы"},{"id":"S16-L18-2","text":"Несовместимость всегда даёт избыток на X","correct":false,"feedback":"Несовместимость удаляла бы участки, создавая недостаток"},{"id":"S16-L18-3","text":"Несовместимость дала бы недостаток с обеих сторон","correct":true,"feedback":"А у неандертальца наблюдается избыток"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как обратное направление обмена различает объяснения?","status":"Схема по данным работы, упрощённая · 4/3 — расчёт, 1,62 — измерено","modes_label":"Как обратное направление обмена различает объяснения?","modes":["ожидание при несовместимости","предел 4/3","наблюдение 1,62"],"args":[{"v":"incomp"},{"v":"limit"},{"v":"obs"}],"notes":["Несовместимость: недостаток в обе стороны","Только женщины переходят: не выше 4/3","У неандертальца 1,62 — выше предела"],"static":["Столбики отношения X к аутосомам: ожидание, предел и наблюдение"],"scene":"s16_r_xratio","L":{"r16_xr_h":"Доля участков Homo sapiens: X-хромосома к аутосомам","r16_xr_eq":"1","r16_xr_less":"меньше 1","r16_xr_inc":"ожидание при несовместимости","r16_xr_lim":"предел, если переходят только женщины","r16_xr_obs":"наблюдение у неандертальца","r16_xr_note":"4/3 — расчёт; 1,62 — измерено в одной работе по геному алтайского неандертальца; высота первого столбика условна."}}},"adv_kind":"Новые данные"},{"id":"five-lines","num":19,"section":2,"questions":[3],"title":"Пять линий доказательств адаптации","keywords":["Адаптация","Гаплотип","Ассоциация варианта с признаком","След отбора","Нейтрально-демографическая модель"],"lead":["Высокая частота варианта в определённой среде — ещё не доказательство [[T42|адаптации]]: её создают и дрейф, и эффект основателя, и смешение. Адаптивное объяснение собирают из пяти разных линий данных."],"mechanism":["Пять линий: (1) вариант или [[T40|гаплотип]] надёжно установлен; (2) [[T43|ассоциация]] — воспроизводимая статистическая связь варианта с признаком; (3) функциональные данные — как вариант меняет работу гена или белка; (4) [[T44|след отбора]] — отклонение частот и строения гаплотипов от явно заданной [[T45|нейтрально-демографической модели]], учитывающей историю численности, расселение и смешение; (5) правдоподобная связь с исторической средой. Каждая линия отвечает на свой вопрос: ассоциация — связан ли вариант с признаком; функция — каким путём; след отбора — повышал ли вариант приспособленность; среда — при каких условиях."],"paragraphs":["Без следа отбора адаптация не показана, даже если известны и связь с признаком, и функция. Без функции и связи с признаком неизвестно, через какой признак действовал отбор. Без исторической среды остаётся интерпретацией, почему отбор действовал. Отсутствие одной линии снижает обоснованность, но не опровергает гипотезу. Даже полный набор редко доказывает единственную причину: современный эффект мог отличаться от исторического, а вариант — влиять на несколько признаков. Если структура популяций не учтена, сходное отклонение ошибочно приписывают отбору.","<b>На практикуме.<\/b> Вкладка 3: конструктор «убрать карточку»; «Найти причину» (случай III).","<b>Ограничения.<\/b> Уровни обоснованности на практикуме — учебное правило, а не статистическая мера."],"conditions":"Расчёт по модели · правило уровней — учебное.","sources":["src_01","src_06","src_07"],"base":"вспомнить [[seminar-13-route.html#adaptation|семинар 13: «Адаптация и как её доказывают»]] и [[seminar-13-route.html#polymorphism|семинар 13: «Как сохраняется полиморфизм»]]","quiz":{"id":"S16-L19","question":"Вариант связан с признаком, функция известна, но следа отбора нет. Что можно сказать?","options":[{"id":"S16-L19-1","text":"Связь показана, адаптация — нет","correct":true,"feedback":"Без следа отбора повышение приспособленности не показано"},{"id":"S16-L19-2","text":"Адаптация доказана функцией варианта","correct":false,"feedback":"Функция объясняет механизм, но не историю отбора"},{"id":"S16-L19-3","text":"Гипотеза опровергнута","correct":false,"feedback":"Отсутствие одной линии снижает обоснованность, но не опровергает"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что даёт каждая из пяти линий доказательств?","status":"Расчёт по модели · правило учебное","modes_label":"Что даёт каждая из пяти линий доказательств?","modes":["все пять","без следа отбора","без функции","только частота"],"args":[{"panel":"A","preset":"epas1","on":["1","2","3","4","5"],"reveal":true},{"panel":"A","preset":"epas1","on":["1","2","3","5"],"reveal":true},{"panel":"A","preset":"epas1","on":["1","2","4","5"],"reveal":true},{"panel":"A","preset":"cond","on":["5"],"reveal":true}],"notes":["Все линии согласуются","Связь с признаком есть; отбор не показан","Отбор показан; механизм — не полностью","Гипотеза"],"static":["Пять карточек и шкала уровня из пяти делений со словами для четырёх сочетаний"],"scene":"s16_t3","L":{"ev_pA":"А. Пять карточек","t3_ps_epas1":"EPAS1","ev_pre_lab":"Предустановка: {p}","ev_epas1_c1":"Гаплотип EPAS1, сходный с денисовским","ev_name1":"Вариант установлен","ev_on":"есть","ev_epas1_c2":"У носителей производного аллеля ниже гемоглобин на высоте","ev_name2":"Связь с
