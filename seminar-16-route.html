 признаком","ev_epas1_c3":"EPAS1 участвует в ответе на гипоксию; действие самих вариантов гаплотипа уточняется","ev_name3":"Функциональные данные","ev_epas1_c4":"Самый сильный сигнал положительного отбора у тибетцев","ev_name4":"След отбора в геноме (с учётом демографии)","ev_epas1_c5":"Высокогорье: давление кислорода примерно на 40 % ниже, чем на уровне моря","ev_name5":"Историческая среда","ev_scale_t":"Уровень обоснованности","ev_lo":"ниже","ev_hi":"выше","ev_lv_now":"Уровень:","ev_lv_A":"все линии согласуются","ev_off":"карточка выключена","ev_lv_D":"связь с признаком есть, отбор не показан","ev_lv_C":"отбор показан, связь варианта с признаком установлена не полностью","t3_ps_cond":"условный вариант","ev_cond_c5":"Вариант часто встречается в одной среде","ev_lv_E":"гипотеза"}}},"exam_quiz":{"id":"S16-E06","question":"Что такое след отбора в геноме?","options":[{"id":"S16-E06-1","text":"Высокая частота варианта в популяции","correct":false,"feedback":"Высокую частоту дают и дрейф, и смешение"},{"id":"S16-E06-2","text":"Известная функция белка","correct":false,"feedback":"Функция — другая линия доказательств"},{"id":"S16-E06-3","text":"Отклонение от модели без отбора","correct":true,"feedback":"Учитывающей историю численности и смешения"}]}},{"id":"adaptive-introgression","num":20,"section":2,"questions":[3],"title":"Адаптивная интрогрессия: вариант гена EPAS1 у тибетцев","keywords":["Адаптивная интрогрессия"],"lead":["Большинство участков, полученных при смешении, не дало преимущества; некоторые оказались полезны в новой среде, и их частота выросла отбором — это адаптивная интрогрессия."],"mechanism":["[[T46|Адаптивная интрогрессия]] — повышение частоты интрогрессированного варианта под действием положительного отбора. Самый изученный пример — гаплотип в области гена EPAS1 у тибетцев. EPAS1 кодирует белок, участвующий в ответе клеток на нехватку кислорода. На высоте более 4000 м давление кислорода примерно на 40 % ниже, чем на уровне моря; у тибетцев на высоте гемоглобин повышается меньше, и носители производного аллеля EPAS1 имеют более низкий гемоглобин. Область EPAS1 даёт самый сильный сигнал положительного отбора у тибетцев. Её гаплотип необычен: при чтении области у 40 тибетцев и 40 ханьцев его нашли у тибетцев и у денисовца, а у ханьцев — очень редко; по длине и распространению гаплотипа неполная сортировка линий маловероятна."],"paragraphs":["Здесь согласуются все пять линий: архаичное происхождение участка, связь с уровнем гемоглобина на высоте, известная роль гена в ответе на гипоксию, след отбора и среда высокогорья. Ограничение остаётся: роль гена не равна установленному эффекту каждого изменения в гаплотипе — какие варианты действуют, уточняется. Другие предполагаемые случаи обоснованы слабее.","<b>На практикуме.<\/b> Вкладка 3, предустановка «EPAS1».","<b>Ограничения.<\/b> Это не единственный путь адаптации к высокогорью: у других популяций высокогорья — другие варианты.","<b>Дальше в курсе «Молекулярная биология».<\/b> Почему HIF-α накапливается при недостатке кислорода — [[https://edu.mazunin.science/seminar-10-route.html#hif|«Молекулярная биология», семинар 10]]; как программы HIF зависят от изоформы и ткани — [[https://edu.mazunin.science/seminar-10-route.html#hif-context|«Молекулярная биология», семинар 10]]."],"conditions":"Схема по данным работы, упрощённая · пять линий названы.","sources":["src_06"],"base":"БИО-16·14, БИО-16·19","quiz":{"id":"S16-L20","question":"Почему сходство гаплотипа тибетцев с денисовским объясняют интрогрессией, а не неполной сортировкой?","options":[{"id":"S16-L20-1","text":"Тибетцы живут близко к Денисовой пещере","correct":false,"feedback":"Место жизни не различает две причины; различают длина и распространение"},{"id":"S16-L20-2","text":"Гаплотип длинный и редок у других популяций","correct":true,"feedback":"Так выглядит недавно полученный участок"},{"id":"S16-L20-3","text":"Ген EPAS1 участвует в ответе клетки на гипоксию","correct":false,"feedback":"Функция говорит о механизме, а не о происхождении участка"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему EPAS1 — пример адаптивной интрогрессии?","status":"Схема по данным работы, упрощённая · пять линий названы","modes_label":"Почему EPAS1 — пример адаптивной интрогрессии?","modes":["EPAS1","происхождение гаплотипа","высокогорье"],"args":[{"panel":"A","preset":"epas1","on":["1","2","3","4","5"],"reveal":true,"hl":1},{"panel":"D"},{"panel":"A","preset":"epas1","on":["1","2","3","4","5"],"reveal":true,"hl":5}],"notes":["Все пять линий есть; действие самих вариантов уточняется","Гаплотип у денисовца и тибетцев, редок у ханьцев","Давление кислорода на 40 % ниже"],"static":["Пять карточек EPAS1 и мини-дерево гаплотипа"],"scene":"s16_t3","L":{"ev_pA":"А. Пять карточек","t3_ps_epas1":"EPAS1","ev_pre_lab":"Предустановка: {p}","ev_epas1_c1":"Гаплотип EPAS1, сходный с денисовским","ev_name1":"Вариант установлен","ev_on":"есть","ev_epas1_c2":"У носителей производного аллеля ниже гемоглобин на высоте","ev_name2":"Связь с признаком","ev_epas1_c3":"EPAS1 участвует в ответе на гипоксию; действие самих вариантов гаплотипа уточняется","ev_name3":"Функциональные данные","ev_epas1_c4":"Самый сильный сигнал положительного отбора у тибетцев","ev_name4":"След отбора в геноме (с учётом демографии)","ev_epas1_c5":"Высокогорье: давление кислорода примерно на 40 % ниже, чем на уровне моря","ev_name5":"Историческая среда","ev_scale_t":"Уровень обоснованности","ev_lo":"ниже","ev_hi":"выше","ev_lv_now":"Уровень:","ev_lv_A":"все линии согласуются","ev_pD":"Происхождение гаплотипа EPAS1","ev_d_tib":"гаплотип у тибетцев","ev_d_den":"денисовец","ev_d_han":"гаплотипы ханьцев","ev_d_cap":"Длина ветви: ничего не означает (качественная схема родства гаплотипов)","ev_d_note":"Гаплотип у тибетцев ближе к денисовскому, чем к гаплотипам ханьцев"}}}},{"id":"gene-culture","num":21,"section":2,"questions":[3],"title":"Генно-культурная коэволюция: молоко и крахмал","keywords":["Генно-культурная коэволюция","Персистенция лактазы","Вариация числа копий"],"lead":["Хозяйственная практика людей меняет среду, в которой действует отбор на их гены, — это генно-культурная коэволюция."],"mechanism":["[[T47|Генно-культурная коэволюция]] — изменение частот вариантов под действием отбора, среду которого создаёт культурная практика. У большинства людей синтез лактазы — фермента, расщепляющего молочный сахар, — снижается после окончания грудного вскармливания. [[T48|Персистенция лактазы]] — сохранение синтеза у взрослых; она связана с вариантами регуляторного участка перед геном LCT. В Европе распространён один вариант, а в Восточной Африке найдены три других: у 470 жителей Танзании, Кении и Судана они связаны с персистенцией, в эксперименте усиливают транскрипцию гена и возникли на разных гаплотипах — независимо от европейского и друг от друга. Вокруг одного из них сохранился протяжённый гаплотип — след быстрого отбора за последние несколько тысяч лет (оценка s = 0,04–0,097). Второй пример — [[T49|вариация числа копий]] гена амилазы слюны: в популяциях с традиционно крахмалистым рационом копий в среднем больше, и число копий связано с количеством фермента в слюне."],"paragraphs":["Схожий признак, возникший независимо в разных популяциях при одинаковой культурной практике, — конвергенция. Древняя ДНК показывает, что культурная практика могла опережать рост частоты варианта: в Европе молоко использовали за тысячелетия до быстрого роста частоты европейского варианта. Поэтому связь отбора с конкретной практикой — историческая интерпретация, которую проверяют датировками.","<b>На практикуме.<\/b> Вкладка 3, предустановка «амилаза».","<b>Ограничения.<\/b> Оценки времени и силы отбора — модельные, с широкими интервалами."],"conditions":"Схема по данным работ, упрощённая · s — оценка модели.","sources":["src_01","src_27","src_34","src_35"],"base":"БИО-16·19; вспомнить [[seminar-14-route.html#duplication|семинар 14: «Дупликация: как возникает копия гена»]]","quiz":{"id":"S16-L21","question":"Что показывают три африканских варианта персистенции лактазы?","options":[{"id":"S16-L21-1","text":"Все люди с персистенцией — потомки одной популяции","correct":false,"feedback":"Варианты разного происхождения: это конвергенция"},{"id":"S16-L21-2","text":"Персистенция не наследуется","correct":false,"feedback":"Связана с наследуемыми вариантами регуляторного участка"},{"id":"S16-L21-3","text":"Сходный признак возник независимо несколько раз","correct":true,"feedback":"Варианты возникли на разных гаплотипах"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как культура меняет среду отбора?","status":"Схема по данным работ, упрощённая · s и времена — оценки","modes_label":"Как культура меняет среду отбора?","modes":["три африканских варианта","европейский вариант","молоко раньше роста частоты"],"args":[{"v":"africa"},{"v":"europe"},{"v":"timing"}],"notes":["Три варианта на разных гаплотипах","Один вариант в Европе","Молоко использовали за тысячелетия до роста частоты"],"static":["Хромосомы с вариантами на разных гаплотипах и шкала «практика — рост частоты»"],"scene":"s16_r_lactase","L":{"ev_pC":"В. Генно-культурная коэволюция","ev_lct_gene":"регуляторный участок гена лактазы (условно)","ev_lct_eu":"Европа","ev_lct_var":"вариант {n}","ev_lct_af1":"Восточная Африка","ev_lct_af2":"Восточная Африка","ev_lct_af3":"Восточная Африка","ev_lct_note":"Цветной фон вокруг варианта — гаплотип: у вариантов Восточной Африки гаплотипы разные; схема условная.","ev_lct_lab":"Конвергенция: сходный признак, разные варианты; общая практика — использование молока","r16_la_h":"Практика и рост частоты","r16_la_past":"прошлое","r16_la_now":"сейчас","r16_la_milk":"использование молока","r16_la_rise":"рост частоты варианта","r16_la_note":"Молоко использовали за тысячелетия до роста частоты; времена — оценки, шкала условна."}}},"exam_quiz":{"id":"S16-E07","question":"Что такое генно-культурная коэволюция?","options":[{"id":"S16-E07-1","text":"Отбор в среде, созданной культурой","correct":true,"feedback":"Как персистенция лактазы при использовании молока"},{"id":"S16-E07-2","text":"Передача культуры через гены потомкам","correct":false,"feedback":"Культура не передаётся генами; она меняет среду отбора"},{"id":"S16-E07-3","text":"Смешение двух популяций","correct":false,"feedback":"Это смешение, а не коэволюция"}]}},{"id":"ongoing","num":22,"section":2,"questions":[3],"title":"Эволюция человека продолжается","keywords":["Полигенный признак"],"lead":["Мутации, дрейф, миграция и отбор действуют и сейчас; культура и медицина не отменяют отбор, а меняют его условия."],"mechanism":["Мутации продолжают создавать варианты в каждом поколении; миграции и смешение меняют их распределение; дрейф особенно заметен в малых популяциях; отбор действует через различия в выживании и числе потомков. Земледелие, скотоводство, плотность поселений и новые инфекции создавали новые среды отбора. Медицина снижает последствия многих вариантов, но меняет возраст выживания, число детей и взаимодействие с возбудителями. [[T50|Полигенный признак]] — признак, на который влияют многие варианты с малым эффектом; для таких признаков недавнюю адаптацию особенно трудно отделить от истории численности, смешения и структуры популяций."],"paragraphs":["Древняя ДНК позволяет видеть изменение частот во времени и находить участки с направленным отбором за последние тысячелетия; но направленный отбор объясняет лишь небольшую долю изменений частот, остальное — дрейф, переселения и смешение. Заявления о быстрой эволюции сложных признаков требуют особенно строгих данных: показатели полигенных признаков оценены у современных людей, и их связь с признаками, на которые отбор действовал в прошлом, не установлена.","<b>На практикуме.<\/b> Вкладка 3.","<b>Ограничения.<\/b> Ложный сигнал отбора возможен, если не учтены дрейф, структура популяций и смешение."],"conditions":"Схема качественная · факторы перечислены.","sources":["src_01","src_35"],"base":"вспомнить [[seminar-13-route.html#ancient-selection|семинар 13: «Сотни случаев направленного отбора — и лишь малая доля изменений частот»]] (сверх программы) и [[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]]","quiz":{"id":"S16-L22","question":"Почему медицина не останавливает эволюцию человека?","options":[{"id":"S16-L22-1","text":"Меняет условия отбора, но мутации и дрейф идут","correct":true,"feedback":"Меняются среда и сила отбора, а не наличие эволюционных процессов"},{"id":"S16-L22-2","text":"Медицина полностью отменяет отбор","correct":false,"feedback":"Различия в выживании и числе детей сохраняются"},{"id":"S16-L22-3","text":"Эволюция теперь идёт только в малых изолированных популяциях","correct":false,"feedback":"Дрейф там сильнее, но мутации и отбор действуют везде"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему эволюция человека продолжается?","status":"Схема качественная · факторы перечислены","modes_label":"Почему эволюция человека продолжается?","modes":["факторы","медицина и культура","полигенный признак"],"args":[{"v":"forces"},{"v":"culture"},{"v":"polygenic"}],"notes":["Четыре процесса действуют и сейчас","Культура меняет условия отбора","Малые сдвиги многих вариантов трудно отличить от истории численности"],"static":["Четыре процесса и стрелка «культура и медицина меняют среду отбора»"],"scene":"s16_r_ongoing","L":{"r16_on_h":"Эволюция человека продолжается","r16_on_mut":"мутации","r16_on_drift":"дрейф","r16_on_mig":"миграция","r16_on_sel":"отбор","r16_on_cult":"медицина и культура меняют среду отбора","r16_on_env":"Четыре процесса действуют и сейчас; меняются условия отбора.","r16_on_many":"много вариантов с малым эффектом (условно)","r16_on_hard":"Малые сдвиги многих вариантов трудно отличить от истории численности"}}}},{"id":"limits-origin","num":23,"section":2,"questions":[3],"title":"Чего нельзя вывести о человеке из его происхождения","keywords":[],"lead":["Происхождение участков генома — вероятностное описание родства с выбранными популяциями; из него нельзя вывести свойства, способности или риск конкретного человека."],"mechanism":["Популяционная структура реальна и важна для медицинской генетики: частоты вариантов, связанных с болезнями, различаются между популяциями из-за разной истории численности, расселения, смешения и среды. Но популяции связаны общим происхождением и многократным смешением: по 377 участкам генома у 1056 человек из 52 популяций различия между людьми внутри популяций составили 93–95 % генетической изменчивости, а различия между крупными географическими группами — лишь 3–5 %; категории, используемые в обществе и в административных данных, описывают генетическое родство лишь приблизительно. Частота варианта в популяции описывает популяцию, а не человека: риск конкретного человека определяется его собственным генотипом, средой и историей, а не происхождением его предков. Популяции не ранжируются по «развитости»: все современные линии одинаково долго эволюционировали от общего предка."],"paragraphs":["Доля неандертальского происхождения — оценка для названной выборки и метода, а не свойство, задающее признаки. Эволюционное объяснение признака не делает его оптимальным и не оправдывает социальных различий: эволюция — изменение частот вариантов, а не движение к цели.","<b>На практикуме.<\/b> Вкладки 2–3; итоговая задача.","<b>Ограничения.<\/b> Генетическое происхождение зависит от выборки референсов, масштаба и времени анализа."],"conditions":"Схема качественная · распределение изменчивости условно.","sources":["src_15","src_29","src_39"],"base":"БИО-16·12, БИО-16·14, БИО-16·22","quiz":{"id":"S16-L23","question":"Вариант встречается у 30 % популяции. Что это говорит о конкретном человеке из неё?","options":[{"id":"S16-L23-1","text":"Он точно носит этот вариант","correct":false,"feedback":"Частота 30 % не говорит, есть ли вариант у конкретного человека; это определяет анализ его генотипа"},{"id":"S16-L23-2","text":"Ничего определённого: нужен его генотип","correct":true,"feedback":"Частота описывает популяцию, а не человека"},{"id":"S16-L23-3","text":"Он генетически отличается от людей других популяций","correct":false,"feedback":"Большая часть изменчивости — между людьми внутри популяций"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что нельзя вывести из происхождения?","status":"Схема качественная · распределения условны","modes_label":"Что нельзя вывести из происхождения?","modes":["частота и человек","генотип","популяции связаны"],"args":[{"v":"freq"},{"v":"genotype"},{"v":"linked"}],"notes":["Частота описывает популяцию","Риск человека — по его генотипу и среде","Популяции связаны происхождением и смешением"],"static":["Поле популяции с частотой варианта и один человек с собственным генотипом"],"scene":"s16_r_limits","L":{"r16_li_h":"Популяция и человек","r16_li_pop":"частота варианта описывает популяцию","r16_li_person":"человек","r16_li_no":"риск из частоты в популяции не следует","r16_li_gt":"риск — по его генотипу и среде","r16_li_p1":"популяция 1","r16_li_p2":"популяция 2","r16_li_mix":"смешение","r16_li_link":"Популяции связаны происхождением и смешением"}}}},{"id":"amylase-ancient","num":24,"section":2,"questions":[3],"title":"Амилаза: дупликация намного старше земледелия","keywords":[],"lead":["Число копий гена амилазы слюны начало меняться задолго до земледелия; у земледельцев менялись частоты уже существовавших вариантов."],"mechanism":["Локус амилазы собран из нескольких почти одинаковых длинных повторов, поэтому его строение прочитали длинными прочтениями. Все копии генов амилазы человека относятся к трём типам: два вида генов амилазы поджелудочной железы и ген амилазы слюны. Распространённый гаплотип с тремя копиями гена амилазы слюны, по оценке, возник около 800 тыс. лет назад — раньше расхождения предков человека и неандертальцев; повышенное число копий найдено в геномах трёх неандертальцев и одного денисовца. Из этого гаплотипа повторные неравные рекомбинации породили множество вариантов. По 68 древним геномам частота гаплотипов с более чем тремя копиями у земледельцев Европы выросла за последние 4 тыс. лет."],"paragraphs":["Вывод: дупликации гена — давнее наследие; рост частоты многокопийных гаплотипов у земледельцев авторы допускают как ответ на крахмалистую пищу, но не исключают и нейтральное объяснение.","<b>Как это узнали.<\/b> Собрали гаплотипы локуса у многих людей, построили деревья копий генов и оценили время их возникновения; число копий у древних людей определили по их геномам.","<b>Граница вывода.<\/b> Оценки времени зависят от калибровки и метода. Другая работа (шаг «Амилаза: отбор за последние 12 тысяч лет») в геномах трёх неандертальцев и денисовца высокого качества (из них общий с этой работой — один неандерталец) находит одну копию и относит исходную дупликацию к времени более 279 тыс. лет назад. Обе работы согласны, что дупликация старше земледелия, но расходятся в том, была ли она уже у общих предков с неандертальцами и денисовцами.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 3: шкала времени локуса амилазы."],"conditions":"Схема по данным работы, упрощённая · даты — оценки с интервалами.","sources":["src_08"],"base":"БИО-16·21","level":"adv","next_base":"evo-medicine","quiz":{"id":"S16-L24","question":"Что происходило в локусе амилазы у земледельцев, по данным этой работы?","options":[{"id":"S16-L24-1","text":"Возникла первая дупликация","correct":false,"feedback":"По этой оценке, дупликация намного древнее"},{"id":"S16-L24-2","text":"Ничего: частоты не менялись","correct":false,"feedback":"Частота гаплотипов с большим числом копий выросла"},{"id":"S16-L24-3","text":"Росла частота старых гаплотипов","correct":true,"feedback":"Многокопийные гаплотипы стали чаще; причина — интерпретация"}]},"widget":{"kind":"dna","title":"","s":{"title":"Когда возникла дупликация гена амилазы?","status":"Схема по данным работ, упрощённая · интервалы","modes_label":"Когда возникла дупликация гена амилазы?","modes":["работа 1","4 тыс. лет у земледельцев","обе работы"],"args":[{"panel":"A","w":1,"show":true},{"panel":"A","w":1,"recent":true,"show":true},{"panel":"A","w":"both","show":true}],"notes":["Гаплотип с тремя копиями около 800 тыс. лет назад","Рост частоты гаплотипов с >3 копиями за 4 тыс. лет","Дупликация старше земледелия; работы расходятся, была ли она у общих предков с неандертальцами"],"static":["Логарифмическая шкала локуса амилазы с засечками двух работ"],"scene":"s16_a3","L":{"a3_pA":"А. Шкала времени локуса амилазы","a3_w1_800":"гаплотип с тремя копиями — около 800 тыс. лет назад (работа 1)","a3_w1_4":"рост частоты гаплотипов с более чем тремя копиями у земледельцев Европы — последние 4 тыс. лет (работа 1)","a3_farm":"начало земледелия — около 12 тыс. лет назад","a3_ax":"тыс. лет назад (логарифмическая шкала)","a3_w_1":"работа 1","a3_lab_w":"Показано: {w}. Засечки — опубликованные оценки; между ними значений нет.","a3_both":"Обе работы: дупликация старше земледелия; расходятся в том, была ли она уже у общих предков с неандертальцами и денисовцами","a3_w2_279":"исходная дупликация — более 279 тыс. лет назад; у трёх неандертальцев и денисовца — одна копия (работа 2)","a3_w2_12":"рост частоты многокопийных гаплотипов — последние 12 тыс. лет, Западная Евразия, s ≈ 0,02 (работа 2)","a3_w_both":"обе"}}},"adv_kind":"Новые данные"},{"id":"amylase-selection","num":25,"section":2,"questions":[3],"title":"Амилаза: отбор за последние 12 тысяч лет","keywords":[],"lead":["Гаплотипы с дополнительными копиями генов амилазы стали чаще в Западной Евразии быстрее, чем позволяет случайный дрейф."],"mechanism":["Построили структурные гаплотипы локуса амилазы у тысяч людей и нашли 28 различных вариантов строения. У земледельческих популяций копий генов амилазы в среднем больше, чем у рыболовов, охотников и скотоводов. По 533 древним геномам частота гаплотипов с дупликациями в Западной Евразии быстро росла последние 12 тыс. лет. Модель с постоянным отбором дала коэффициент отбора около 0,02 за поколение; моделирование без отбора не воспроизводило наблюдаемый рост. У трёх неандертальцев и денисовца в этой работе — предковое состояние с одной копией гена амилазы слюны; исходную дупликацию авторы относят к времени более 279 тыс. лет назад — до расселения из Африки."],"paragraphs":["Работа даёт сильную линию «след отбора» для локуса амилазы; связь отбора именно с крахмалистой пищей земледельцев остаётся исторической интерпретацией.","<b>Как это узнали.<\/b> Сравнили частоты гаплотипов у людей, живших в разные тысячелетия, с частотами, которые даёт модель без отбора.","<b>Граница вывода.<\/b> Обе работы об амилазе согласны, что частота многокопийных гаплотипов у земледельцев росла и что дупликация старше земледелия; было ли повышенное число копий уже у неандертальцев и денисовцев (по одной работе — да, около 800 тыс. лет назад; по другой — нет, исходная дупликация более 279 тыс. лет назад), они оценивают по-разному. Расхождение не разрешено.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 3: шкала времени локуса амилазы."],"conditions":"Схема по данным работы, упрощённая · s — оценка модели.","sources":["src_07"],"base":"БИО-16·21, БИО-16·24","level":"adv","next_base":"evo-medicine","quiz":{"id":"S16-L25","question":"Что даёт эта работа для доказательства адаптации?","options":[{"id":"S16-L25-1","text":"След отбора: рост частоты быстрее, чем при дрейфе","correct":true,"feedback":"Это линия «след отбора» из пяти"},{"id":"S16-L25-2","text":"Доказательство, что причиной было земледелие","correct":false,"feedback":"Связь с земледелием остаётся интерпретацией"},{"id":"S16-L25-3","text":"Окончательный возраст дупликации","correct":false,"feedback":"Оценки двух работ расходятся"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как показан отбор в локусе амилазы?","status":"Схема по данным работы, упрощённая · точки — опубликованные значения","modes_label":"Как показан отбор в локусе амилазы?","modes":["частоты во времени","модель без отбора","s ≈ 0,02"],"args":[{"v":"obs"},{"v":"neutral"},{"v":"fit"}],"notes":["Рост частоты в Западной Евразии","Без отбора рост не воспроизводится","Коэффициент отбора около 0,02 за поколение"],"static":["Точки частоты по тысячелетиям и коридор модели без отбора"],"scene":"s16_r_amysel","L":{"r16_am_h":"Отбор в локусе амилазы за 12 тыс. лет","r16_am_x":"тыс. лет назад","r16_am_y":"частота гаплотипов с дупликациями (схема)","r16_am_obs":"рост частоты (533 древних генома)","r16_am_note":"Схема: кривые качественные; опубликованные значения отдельных тысячелетий приведены в статье.","r16_am_neut":"без отбора","r16_am_fit":"модель с отбором: s ≈ 0,02 за поколение"}}},"adv_kind":"Новые данные"},{"id":"black-death","num":26,"section":2,"questions":[3],"title":"Отбор в эпоху «Чёрной смерти»","keywords":["Множественные сравнения","Балансирующий отбор"],"lead":["Был ли отбор на варианты генов иммунитета во время эпидемии чумы XIV века? Две группы исследователей по одним данным пришли к разным выводам; спор не закрыт."],"mechanism":["<b>Утверждение.<\/b> По древней ДНК людей из Лондона (до, во время и после эпидемии) и из Дании (до и после) у вариантов генов иммунитета большие изменения частот встречались чаще, чем в нейтральных участках; главный кандидат — вариант рядом с геном ERAP2. Его аллель в экспериментах на клетках влиял на ответ макрофагов на возбудителя чумы и на подавление роста бактерий. <b>Возражение.<\/b> Обогащение сохраняется и при случайной перестановке меток «до» и «после», то есть может быть техническим: иммунные и нейтральные участки выделяли разными реактивами и читали с разным покрытием. Частоты аллелей оценивали способом, смещающим их к 0,5; после исправления ни один из четырёх кандидатов не проходит исходных порогов; поправки на [[T51|множественные сравнения]] не было. Частота аллеля рядом с ERAP2 в Англии и Дании за последние две тысячи лет значимо не изменилась. <b>Ответ.<\/b> Ошибку оценки частот исправили; после выравнивания покрытия обогащение сохраняется; вариант рядом с ERAP2 остаётся первым кандидатом, хотя строгую поправку на множественные сравнения не проходит; независимые данные — рост частоты в другой выборке из Англии и связь аллеля с защитой от тяжёлой пневмонии сейчас. Авторы предлагают [[T52|балансирующий отбор]] с коротким импульсом направленного отбора."],"paragraphs":["Позиции различаются тем, с какой нулевой моделью сравнивать изменения частот (перестановка людей между временными точками или перестановка вариантов между «иммунными» и «нейтральными»), как учитывать множественные сравнения и какой вес придавать функциональным данным.","<b>Как это узнали.<\/b> Сравнили частоты вариантов в древней ДНК людей, живших до и после эпидемии, с ожидаемыми без отбора.","<b>Граница вывода.<\/b> Выборки малы; функциональный эффект варианта не доказывает отбора: нужна статистика изменения частоты быстрее случайного. Спор не закрыт.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 3, панель Б: переключатель «утверждение / возражение / ответ»."],"conditions":"Схема по данным работ, упрощённая · три позиции показаны одинаково.","sources":["src_21","src_22","src_23"],"base":"БИО-16·19, БИО-16·22","level":"adv","next_base":"evo-medicine","quiz":{"id":"S16-L26","question":"Почему функциональный эффект варианта не закрывает спора?","options":[{"id":"S16-L26-1","text":"Функциональных данных в работе вообще не было","correct":false,"feedback":"Были: эксперименты на клетках"},{"id":"S16-L26-2","text":"Он не показывает быстрого изменения частоты","correct":true,"feedback":"Функция и след отбора — разные линии доказательств"},{"id":"S16-L26-3","text":"Возражение отрицает связь гена с иммунитетом","correct":false,"feedback":"Спор — о статистике изменения частот, а не о функции гена"}]},"widget":{"kind":"dna","title":"","s":{"title":"По каким данным различаются позиции спора?","status":"Схема по данным работ, упрощённая · спор не закрыт","modes_label":"По каким данным различаются позиции спора?","modes":["утверждение","возражение","ответ"],"args":[{"panel":"B","p":"claim","show":true},{"panel":"B","p":"objection","show":true},{"panel":"B","p":"reply","show":true}],"notes":["Изменения частот иммунных вариантов больше нейтральных","Обогащение — технический артефакт; поправки нет","Ошибка исправлена; кандидат сохраняется; новые данные"],"static":["Три одинаковые карточки позиций с тремя строками и итоговой строкой «спор не закрыт»"],"scene":"s16_a3","L":{"a3_pB":"Б. Утверждение, возражение, ответ","a3_tab_claim":"утверждение","a3_tab_objection":"возражение","a3_tab_reply":"ответ","a3_row_what":"Что утверждается","a3_claim_what":"Во время эпидемии чумы XIV века шёл отбор на варианты генов иммунитета; главный кандидат — вариант рядом с геном ERAP2.","a3_row_data":"На каких данных","a3_claim_data":"Древняя ДНК людей из Лондона (до, во время и после эпидемии) и Дании (до и после): большие изменения частот у вариантов генов иммунитета встречались чаще, чем в нейтральных участках; эксперименты на клетках.","a3_row_weak":"Слабое место по мнению другой стороны","a3_claim_weak":"Обогащение может быть техническим; поправки на множественные сравнения не было.","a3_open":"Спор не закрыт: позиции различаются нулевой моделью, поправкой на множественные сравнения и весом функциональных данных","a3_objection_what":"Сигнал отбора не подтверждается: ни один из четырёх кандидатов не проходит исходных порогов.","a3_objection_data":"Обогащение сохраняется при случайной перестановке меток «до» и «после»; иммунные и нейтральные участки выделяли разными реактивами и читали с разным покрытием; частоты оценивали способом, смещающим их к 0,5.","a3_objection_weak":"Ошибку оценки частот можно исправить; после выравнивания покрытия обогащение сохраняется.","a3_reply_what":"Вариант рядом с ERAP2 остаётся первым кандидатом; предложен балансирующий отбор с коротким импульсом направленного отбора.","a3_reply_data":"Исправленная оценка частот и выравненное покрытие; рост частоты в другой выборке из Англии; связь аллеля с защитой от тяжёлой пневмонии сейчас.","a3_reply_weak":"Строгую поправку на множественные сравнения вариант не проходит."}}},"adv_kind":"Утверждение и возражение"},{"id":"evo-medicine","num":27,"section":3,"questions":[4],"title":"Что эволюционный подход даёт медицине","keywords":["Эволюционная медицина","Единица отбора"],"lead":["Эволюционный подход дополняет вопрос «как возникает болезнь» вопросом «почему организм уязвим» и особенно полезен там, где объект лечения сам изменяется: возбудитель, вирус, опухоль."],"mechanism":["[[T53|Эволюционная медицина]] применяет эволюционные понятия к происхождению уязвимостей, к изменению возбудителей и клеточных популяций и к последствиям медицинских вмешательств. Эволюционное объяснение не означает, что болезнь — адаптация. Уязвимость может возникать потому, что отбор действует на возбудитель или опухолевые клетки, а не на здоровье пациента; из-за компромисса между полезным и вредным эффектом признака; из-за несоответствия современной среды условиям, в которых сложилась физиология; из-за дрейфа и истории популяции; из-за позднего проявления эффекта, когда отбор слаб. Естественный отбор повышает долю вариантов с большим числом потомков в данной среде, а не здоровье или продолжительность жизни."],"paragraphs":["Одна и та же схема — изменчивость, различия в размножении, изменение состава — описывает отбор у бактерий в организме, у вирусных линий в популяции людей и у клеток опухоли в ткани. Различаются [[T54|единица отбора]] (клетка бактерии, вирусная линия, клон клеток), источник наследуемой изменчивости и время одного шага. Клинический пример приводится для демонстрации значения эволюционного механизма: эволюционная гипотеза не заменяет клинических испытаний.","<b>На практикуме.<\/b> Вкладка 4: три масштаба отбора на одной модели.","<b>Ограничения.<\/b> Формула «этот признак когда-то был полезен» без сравнительных, популяционных или функциональных данных — предположение, а не объяснение."],"conditions":"Схема качественная · три масштаба условно приведены к одной схеме.","sources":["src_01","src_29"],"base":"БИО-16·1; вспомнить [[seminar-12-route.html#selection|семинар 12: «Условия естественного отбора»]]","quiz":{"id":"S16-L27","question":"Что общего у отбора бактерий, вирусных линий и клонов опухоли?","options":[{"id":"S16-L27-1","text":"Во всех трёх случаях отбор действует на пациента","correct":false,"feedback":"Отбор действует на бактерии, вирусы и клетки, а не на здоровье пациента"},{"id":"S16-L27-2","text":"Все три вида изменений наследуются потомками пациента","correct":false,"feedback":"Изменения опухолевых клеток не передаются потомкам пациента"},{"id":"S16-L27-3","text":"Изменчивость, разное размножение, изменение состава","correct":true,"feedback":"Различаются единица отбора, источник изменчивости и масштаб времени"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что общего у трёх масштабов отбора?","status":"Расчёт по модели · параметры условные","modes_label":"Что общего у трёх масштабов отбора?","modes":["бактерии","вирусы","клоны опухоли"],"args":[{"panel":"A","scale":"bacteria","mode":0,"k":2},{"panel":"A","scale":"virus","mode":0,"k":2},{"panel":"A","scale":"tumour","mode":0,"k":2}],"notes":["Клетки бактерий; поколение бактерий","Линии вируса; цикл передачи","Клетки опухоли; условная единица времени"],"static":["Три поля популяции в исходном состоянии с подписями единицы и шага"],"scene":"s16_t4","L":{"po_pA":"А. Три масштаба отбора","po_bacteria_unit":"клетки бактерий в организме","po_unit_lab":"Единица: {u}","po_bacteria_m1":"препарат","po_mode_lab":"Условия: {m}","po_bacteria_var":"устойчивый вариант","po_bacteria_other":"чувствительный вариант","po_bacteria_step":"поколение бактерий","po_step_lab":"Шаг ({s}): {k}","po_p_lab":"Доля варианта: {p}","po_ax_x":"шаг: {s}","po_ax_y":"доля варианта","po_c1":"изменчивость","po_c2":"различия в размножении","po_c3":"изменение состава","po_r_lab":"r = {r}: во сколько раз за шаг вариант размножается успешнее остальных (условно); p = p0·r^t / (p0·r^t + 1 − p0)","po_virus_unit":"линии вируса в популяции людей","po_virus_m1":"иммунитет населения растёт","po_virus_var":"вариант, хуже распознаваемый иммунитетом","po_virus_other":"прежний вариант","po_virus_step":"цикл передачи","po_tumour_unit":"клетки опухоли","po_tumour_m1":"терапия","po_tumour_var":"устойчивый субклон","po_tumour_other":"чувствительный клон","po_tumour_step":"условная единица времени"}}}},{"id":"amr","num":28,"section":3,"questions":[4],"title":"Устойчивость к антимикробным препаратам","keywords":["Антимикробная устойчивость","Горизонтальный перенос генов","Плазмида","Толерантность","Персистенция бактерий","Штамм"],"lead":["Препарат не создаёт устойчивость и не направляет мутации: он меняет среду отбора, в которой доля уже существующих или вновь возникших устойчивых вариантов растёт."],"mechanism":["[[T55|Антимикробная устойчивость]] — наследуемая способность микроорганизма размножаться при концентрации препарата, подавляющей чувствительные клетки. Её источники — мутации и приобретение генов от других микроорганизмов: [[T56|горизонтальный перенос генов]], прежде всего с [[T57|плазмидами]] — кольцевыми молекулами ДНК, способными переходить из клетки в клетку. При действии препарата чувствительные клетки гибнут или размножаются медленнее, а устойчивые вносят всё больший вклад в следующие поколения. При исходной доле 0,001 и четырёхкратном преимуществе в размножении за поколение (условно) доля устойчивых через 5 поколений — около 0,5, через 10 — около 0,999. Без препарата устойчивость часто имеет цену, и её доля медленно снижается."],"paragraphs":[{"details":"Формула и расчёт","text":"p_t = p0·r^t / (p0·r^t + 1 − p0), где p_t — доля устойчивого варианта через t поколений, p0 — исходная доля, r — во сколько раз за поколение устойчивый вариант размножается успешнее чувствительного."},"Устойчивость отличают от [[T58|толерантности]] — замедленной гибели популяции без повышения подавляющей концентрации — и от [[T59|персистенции]] — выживания небольшой части клеток в ненаследуемом состоянии, часто с замедлением или остановкой роста: после возобновления роста их потомки сохраняют чувствительность. Устойчивость могла существовать до лечения как редкий вариант, возникнуть во время лечения или прийти с другим [[T74|штаммом]] — генетически однородной линией того же или другого вида. Отдельная клетка не «становится» устойчивой: меняется состав популяции.","<b>На практикуме.<\/b> Вкладка 4, масштаб «бактерии в организме»; «Найти причину» (случай IV).","<b>Ограничения.<\/b> Модель не учитывает пространственную неоднородность, передачу между людьми и концентрацию препарата в тканях; препарат в модели условный."],"conditions":"Расчёт по модели · параметры условные; препарат условный.","sources":["src_01","src_09","src_25"],"base":"БИО-16·27; вспомнить [[seminar-13-route.html#selection-modes|семинар 13: «Как отбор меняет частоты: три режима»]] и [[seminar-12-route.html#hgt|семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»]]","quiz":{"id":"S16-L28","question":"Почему после действия препарата устойчивых бактерий стало больше?","options":[{"id":"S16-L28-1","text":"Чувствительные гибли, устойчивые размножались","correct":true,"feedback":"Изменился состав популяции"},{"id":"S16-L28-2","text":"Каждая бактерия со временем сама стала устойчивой","correct":false,"feedback":"Устойчивость наследуется; меняется доля вариантов, а не свойства каждой клетки"},{"id":"S16-L28-3","text":"Препарат вызвал нужные мутации","correct":false,"feedback":"Препарат меняет среду отбора, а не создаёт нужные мутации"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как меняется доля устойчивых бактерий?","status":"Расчёт по модели · параметры условные","modes_label":"Как меняется доля устойчивых бактерий?","modes":["препарат: 0","препарат: 5","препарат: 10","без препарата: 10"],"args":[{"panel":"A","scale":"bacteria","mode":0,"k":0},{"panel":"A","scale":"bacteria","mode":0,"k":1},{"panel":"A","scale":"bacteria","mode":0,"k":2},{"panel":"A","scale":"bacteria","mode":1,"k":2}],"notes":["0,001","0,506","0,999","0,0003"],"static":["Поле 100 значков с долей устойчивых на шагах 0, 5, 10 и без препарата"],"scene":"s16_t4","L":{"po_pA":"А. Три масштаба отбора","po_bacteria_unit":"клетки бактерий в организме","po_unit_lab":"Единица: {u}","po_bacteria_m1":"препарат","po_mode_lab":"Условия: {m}","po_bacteria_var":"устойчивый вариант","po_bacteria_other":"чувствительный вариант","po_bacteria_step":"поколение бактерий","po_step_lab":"Шаг ({s}): {k}","po_p_lab":"Доля варианта: {p}","po_lt1":"меньше 1 из 100","po_ax_x":"шаг: {s}","po_ax_y":"доля варианта","po_c1":"изменчивость","po_c2":"различия в размножении","po_c3":"изменение состава","po_r_lab":"r = {r}: во сколько раз за шаг вариант размножается успешнее остальных (условно); p = p0·r^t / (p0·r^t + 1 − p0)","po_bacteria_m2":"без препарата"}}},"exam_quiz":{"id":"S16-E08","question":"Чем устойчивость отличается от персистенции бактерий?","options":[{"id":"S16-E08-1","text":"Ничем: это синонимы","correct":false,"feedback":"Это разные явления"},{"id":"S16-E08-2","text":"Устойчивость наследуется, персистенция нет","correct":true,"feedback":"Потомки персистеров сохраняют чувствительность"},{"id":"S16-E08-3","text":"Персистенция наследуется, а устойчивость нет","correct":false,"feedback":"Наоборот"}]}},{"id":"virus","num":29,"section":3,"questions":[4],"title":"Эволюция вирусов и иммунное ускользание","keywords":["Антигенный дрейф","Иммунное ускользание","Антигенный сдвиг","Реассортация","Узкое место при передаче"],"lead":["Вирусные популяции меняются быстро: их много, цикл короток, ошибки копирования часты. Иммунитет населения становится средой отбора для вирусных линий."],"mechanism":["[[T60|Антигенный дрейф]] — постепенное накопление изменений антигенов вирусной линии, снижающих её распознавание существующим иммунитетом; это вирусологический термин, не путать с генетическим дрейфом частот. [[T61|Иммунное ускользание]] — снижение распознавания варианта иммунной системой по сравнению с прежним; обычно частичное, потому что антитела узнают несколько участков белка, а клеточный иммунитет — дополнительные. [[T62|Антигенный сдвиг]] — резкое изменение антигенных свойств вируса. У вируса гриппа A его вызывает [[T63|реассортация]] — обмен целыми сегментами генома при заражении одной клетки двумя вирусами: вирусы пандемий XX и начала XXI века несли сегменты вирусов человека и животных. У SARS-CoV-2 так называют переход к сильно изменённой линии без реассортации. При росте иммунитета населения вариант, хуже распознаваемый иммунитетом, передаётся успешнее; при r = 1,3 за цикл передачи (условно) его доля растёт с 0,01 до около 0,12 за 10 циклов и до около 0,66 за 20."],"paragraphs":["Одни и те же замены в белке шипа вируса SARS-CoV-2 возникали независимо в разных линиях: периоды разнообразия многих родственных линий сменялись быстрым распространением одного варианта с преимуществом. При передаче новому человеку переходит лишь часть вариантов — [[T64|узкое место при передаче]] усиливает дрейф. Вариант, лучше размножающийся в организме, не обязательно лучше передаётся между людьми.","<b>На практикуме.<\/b> Вкладка 4, масштаб «линии вируса».","<b>Ограничения.<\/b> Модель не учитывает длительность инфекции, структуру контактов и различие размножения в организме и передачи между людьми."],"conditions":"Расчёт по модели · параметры условные.","sources":["src_26","src_38","src_40"],"base":"БИО-16·27; вспомнить [[seminar-13-route.html#drift|семинар 13: «Генетический дрейф: случайная выборка копий»]]","quiz":{"id":"S16-L29","question":"Чем антигенный дрейф отличается от генетического дрейфа?","options":[{"id":"S16-L29-1","text":"Это то же самое явление под другим названием","correct":false,"feedback":"Это разные понятия: одно об антигенах, другое о случайных изменениях частот"},{"id":"S16-L29-2","text":"Это изменение антигенов вирусной линии","correct":true,"feedback":"Генетический дрейф — случайное изменение частот аллелей"},{"id":"S16-L29-3","text":"Это обмен сегментами генома","correct":false,"feedback":"Обмен сегментами — реассортация, основа антигенного сдвига"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как иммунитет населения меняет состав вирусных линий?","status":"Расчёт по модели · параметры условные","modes_label":"Как иммунитет населения меняет состав вирусных линий?","modes":["иммунитет: 0","иммунитет: 10","иммунитет: 20","иммунитета нет: 20"],"args":[{"panel":"A","scale":"virus","mode":0,"k":0},{"panel":"A","scale":"virus","mode":0,"k":1},{"panel":"A","scale":"virus","mode":0,"k":2},{"panel":"A","scale":"virus","mode":1,"k":2}],"notes":["0,01","0,122","0,658","0,004"],"static":["Поле вирусных линий на шагах 0, 10, 20 и без иммунитета"],"scene":"s16_t4","L":{"po_pA":"А. Три масштаба отбора","po_virus_unit":"линии вируса в популяции людей","po_unit_lab":"Единица: {u}","po_virus_m1":"иммунитет населения растёт","po_mode_lab":"Условия: {m}","po_virus_var":"вариант, хуже распознаваемый иммунитетом","po_virus_other":"прежний вариант","po_virus_step":"цикл передачи","po_step_lab":"Шаг ({s}): {k}","po_p_lab":"Доля варианта: {p}","po_ax_x":"шаг: {s}","po_ax_y":"доля варианта","po_c1":"изменчивость","po_c2":"различия в размножении","po_c3":"изменение состава","po_r_lab":"r = {r}: во сколько раз за шаг вариант размножается успешнее остальных (условно); p = p0·r^t / (p0·r^t + 1 − p0)","po_virus_m2":"иммунитета нет","po_lt1":"меньше 1 из 100"}}}},{"id":"tumour","num":30,"section":3,"questions":[4],"title":"Опухоль как популяция клонов","keywords":["Клональная эволюция","Драйверное изменение","Субклон","Внутриопухолевая гетерогенность"],"lead":["Опухоль — изменяющаяся популяция клеток тела: изменения клеток создают изменчивость, а микроокружение и лечение определяют, какие клоны распространятся."],"mechanism":["[[T65|Клональная эволюция]] — изменение состава опухоли за счёт возникновения, конкуренции и распространения клонов клеток. Мутации, хромосомные перестройки и изменения состояния клеток создают изменчивость; [[T66|драйверные изменения]] способствуют росту или выживанию клона, пассажирские не дают заметного преимущества в данных условиях. Эволюция опухоли ветвящаяся: [[T67|субклоны]] отходят от предкового клона в разное время, поэтому в одной опухоли сосуществуют разные клеточные популяции — [[T68|внутриопухолевая гетерогенность]]. Устойчивый к лечению субклон может существовать до начала лечения; лечение уничтожает чувствительные клетки и меняет конкуренцию. При r = 1,1 : 0,7 ≈ 1,57 за единицу времени (условно) доля устойчивого субклона растёт с 0,01 до около 0,48 за 10 единиц и до около 0,99 за 20."],"paragraphs":["Изменения в клетках тела не передаются потомкам организма: это отбор внутри одного организма, а не между поколениями людей. Разделение изменений на драйверные и пассажирские относительно: эффект зависит от ткани, стадии и лечения.","<b>На практикуме.<\/b> Вкладка 4, масштаб «клоны опухоли».","<b>Ограничения.<\/b> Часть устойчивости опухолевых клеток — обратимые состояния, а не наследуемые изменения; под действием терапии клетки могут и временно повышать скорость мутаций; в модели этого нет.","<b>Дальше в курсе «Молекулярная биология».<\/b> Чем различаются онкогенные варианты RAS — [[https://edu.mazunin.science/seminar-3-route.html#oncogenic|«Молекулярная биология», семинар 3]]; чем среднее по популяции отличается от сигнала одной клетки — [[https://edu.mazunin.science/seminar-4-route.html#single-cell|«Молекулярная биология», семинар 4]]; как нарушения SDH, FH и IDH по-разному меняют метаболиты — [[https://edu.mazunin.science/seminar-8-route.html#oncometabolites|«Молекулярная биология», семинар 8]]."],"conditions":"Расчёт по модели · клоны, доли и время условные.","sources":["src_10"],"base":"БИО-16·27; вспомнить [[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]]","quiz":{"id":"S16-L30","question":"Почему после лечения состав опухоли может отличаться от исходного?","options":[{"id":"S16-L30-1","text":"Все клетки опухоли одинаковы","correct":false,"feedback":"Опухоль — популяция разных клонов"},{"id":"S16-L30-2","text":"Лечение превратило все клетки в устойчивые","correct":false,"feedback":"Меняется доля клонов; часть устойчивости — обратимые состояния клеток"},{"id":"S16-L30-3","text":"Лечение изменило конкуренцию клонов","correct":true,"feedback":"Устойчивый субклон мог существовать до лечения"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как терапия меняет состав опухоли?","status":"Расчёт по модели · клоны и время условные","modes_label":"Как терапия меняет состав опухоли?","modes":["терапия: 0","терапия: 10","терапия: 20","дерево клонов"],"args":[{"panel":"A","scale":"tumour","mode":0,"k":0},{"panel":"A","scale":"tumour","mode":0,"k":1},{"panel":"A","scale":"tumour","mode":0,"k":2},{"panel":"C"}],"notes":["0,01","0,481","0,988","Ветвящееся дерево клонов: устойчивый субклон — до терапии"],"static":["Поле клеток опухоли на трёх шагах и дерево клонов"],"scene":"s16_t4","L":{"po_pA":"А. Три масштаба отбора","po_tumour_unit":"клетки опухоли","po_unit_lab":"Единица: {u}","po_tumour_m1":"терапия","po_mode_lab":"Условия: {m}","po_tumour_var":"устойчивый субклон","po_tumour_other":"чувствительный клон","po_tumour_step":"условная единица времени","po_step_lab":"Шаг ({s}): {k}","po_p_lab":"Доля варианта: {p}","po_ax_x":"шаг: {s}","po_ax_y":"доля варианта","po_c1":"изменчивость","po_c2":"различия в размножении","po_c3":"изменение состава","po_r_lab":"r = {r}: во сколько раз за шаг вариант размножается успешнее остальных (условно); p = p0·r^t / (p0·r^t + 1 − p0)","po_pC":"Дерево клонов опухоли","po_cl_anc":"предковый клон","po_cl_sub1":"субклон","po_cl_sub2":"субклон","po_cl_sub3":"субклон","po_cl_res":"устойчивый субклон","po_cl_drv":"ветвь — драйверное изменение (условно)","po_cl_note":"Эволюция опухоли ветвящаяся: субклоны отходят от предкового клона в разное время"}}},"exam_quiz":{"id":"S16-E09","question":"Что такое субклон опухоли?","options":[{"id":"S16-E09-1","text":"Нормальная клетка окружающей ткани","correct":false,"feedback":"Субклон — часть опухоли"},{"id":"S16-E09-2","text":"Вирус внутри опухоли","correct":false,"feedback":"Субклон — популяция опухолевых клеток"},{"id":"S16-E09-3","text":"Клон, отошедший от предкового","correct":true,"feedback":"Эволюция опухоли ветвящаяся"}]}},{"id":"persistence","num":31,"section":3,"questions":[4],"title":"Почему патогенные варианты сохраняются","keywords":["Равновесие мутаций и отбора","Преимущество гетерозигот","Балансирующий отбор","Антагонистическая плейотропия"],"lead":["Варианты, повышающие риск болезни, сохраняются в популяциях по разным причинам; высокая частота такого варианта сама по себе не доказывает его пользы."],"mechanism":["[[T69|Равновесие мутаций и отбора]]: вредный аллель удаляется отбором и возникает заново. Для рецессивного аллеля равновесная частота тем выше, чем слабее отбор против гомозигот: при одной и той же скорости мутаций (условной) снижение приспособленности гомозигот на 0,9 даёт частоту аллеля около 0,011 (носителей около 2 %), а на 0,1 — около 0,032 (носителей около 6 %): отбор слабее в 9 раз — частота выше в 3 раза. Рецессивный аллель долго сохраняется у гетерозигот. В малых популяциях дрейф и эффект основателя повышают частоту редкого варианта независимо от его эффекта. [[T70|Преимущество гетерозигот]] — частный случай [[T52|балансирующего отбора]]: аллель HbS гена HBB вызывает серповидноклеточную болезнь у гомозигот, но снижает риск тяжёлой малярии у гетерозигот."],"paragraphs":[{"details":"Формула и расчёт","text":"Для рецессивного аллеля равновесная частота q = √(μ/s), где q — частота аллеля, μ — скорость мутаций в этот аллель за поколение, s — снижение приспособленности гомозигот. При μ = 10⁻⁴ (условно): s = 0,9 → q ≈ 0,011; s = 0,1 → q ≈ 0,032."},"При позднем проявлении болезни отбор слабее: часть потомков уже рождена. [[T71|Антагонистическая плейотропия]] — вариант полезен в одном возрасте или условиях и вреден в другом; раннюю пользу нужно показать, а не выводить из позднего вреда. Отбор действует и на варианты митохондриальной ДНК: по 116 663 передачам «мать — ребёнок» найдены признаки отбора против вредных вариантов до и после рождения, а ребёнок фактически наследует от матери всего около трёх единиц митохондриальной ДНК — поэтому доля варианта у детей одной матери различается.","<b>На практикуме.<\/b> Вкладка 4, модель «равновесие мутаций и отбора».","<b>Ограничения.<\/b> Формула предполагает очень большую популяцию, постоянные μ и s и отсутствие миграции."],"conditions":"Расчёт по модели · μ и s условные.","sources":["src_01","src_29","src_37"],"base":"вспомнить [[seminar-13-route.html#polymorphism|семинар 13: «Как сохраняется полиморфизм»]] и [[seminar-13-route.html#bottleneck-founder|семинар 13: «Узкое место и эффект основателя»]]","quiz":{"id":"S16-L31","question":"Отбор против рецессивного аллеля ослаб в 9 раз. Как изменится равновесная частота?","options":[{"id":"S16-L31-1","text":"Вырастет в 3 раза","correct":true,"feedback":"Частота пропорциональна корню из μ/s"},{"id":"S16-L31-2","text":"Вырастет в 9 раз","correct":false,"feedback":"Зависимость от s — через квадратный корень"},{"id":"S16-L31-3","text":"Не изменится","correct":false,"feedback":"Равновесная частота зависит от силы отбора"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему вредный аллель сохраняется?","status":"Расчёт по модели · μ и s условные","modes_label":"Почему вредный аллель сохраняется?","modes":["s = 0,9","s = 0,1","причины сохранения"],"args":[{"panel":"B","s":0.9,"reveal":true},{"panel":"B","s":0.1,"reveal":true},{"panel":"D"}],"notes":["q = 0,0105; доля носителей 0,021","q = 0,0316; доля носителей 0,061","Мутации, рецессивность, дрейф, преимущество гетерозигот, позднее проявление"],"static":["Два показателя равновесной частоты и список причин сохранения"],"scene":"s16_t4","L":{"ms_pB":"Б. Равновесие мутаций и отбора","ms_pool":"аллели в популяции","ms_pool2":"рецессивный вредный аллель","ms_mut":"мутации: μ = {mu} за поколение","ms_sel":"отбор против гомозигот: s = {s}","ms_q_lab":"Частота аллеля","ms_c_lab":"Доля носителей (гетерозиготы, 2q(1 − q))","ms_formula":"Равновесная частота рецессивного вредного аллеля q = √(μ / s), где μ — скорость мутаций, s — снижение приспособленности гомозигот","ms_cond":"Параметры условные; у гетерозигот аллель почти не снижает приспособленность.","ms_note":"Частота вредного аллеля зависит от силы отбора и скорости мутаций; высокая частота варианта не доказывает его пользы.","ms_pD":"Почему вредные аллели сохраняются","ms_c1":"мутации","ms_c1_e":"аллель возникает заново (μ)","ms_c2":"рецессивность","ms_c2_e":"у гетерозигот почти не снижает приспособленность","ms_c3":"дрейф и эффект основателя","ms_c3_e":"в малых популяциях частота может вырасти случайно","ms_c4":"преимущество гетерозигот, позднее проявление","ms_c4_e":"балансирующий отбор; эффект после размножения"}}}},{"id":"tradeoffs","num":32,"section":3,"questions":[4],"title":"Компромиссы и защитные реакции","keywords":["Эволюционный компромисс"],"lead":["Отбор не создаёт совершенных систем: усиление одной функции часто увеличивает издержки другой. Защитная реакция может стать частью болезни."],"mechanism":["[[T72|Эволюционный компромисс]] — сочетание полезного и вредного эффектов одного признака, при котором отбор поддерживает признак, несмотря на издержки. Иммунная защита уничтожает возбудителей, но может повреждать собственные ткани; свёртывание крови предотвращает кровопотерю, но повышает риск тромбоза; воспаление и лихорадка защищают, но при чрезмерной силе становятся частью болезни. Компромисс проявляется и у возбудителей: если размножение возбудителя повышает и передачу, и вред хозяину, вирулентность не обязательно снижается со временем — её изменение зависит от пути передачи, длительности инфекции и иммунитета."],"paragraphs":["Эволюционное объяснение реакции не означает, что она полезна в каждом случае и что её не следует подавлять.","<b>На практикуме.<\/b> Вкладка 4.","<b>Ограничения.<\/b> Компромисс — гипотеза, которую проверяют: нужно показать и пользу, и издержки признака."],"conditions":"Схема качественная · примеры условны.","sources":["src_01","src_29","src_38"],"base":"БИО-16·27, БИО-16·31","quiz":{"id":"S16-L32","question":"Что такое эволюционный компромисс?","options":[{"id":"S16-L32-1","text":"Несоответствие физиологии новой среде","correct":false,"feedback":"Это несоответствие — другое объяснение"},{"id":"S16-L32-2","text":"Признак с пользой и издержками сразу","correct":true,"feedback":"Отбор поддерживает его, несмотря на издержки"},{"id":"S16-L32-3","text":"Признак, полезный во всех условиях среды","correct":false,"feedback":"У компромисса есть издержки"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что такое компромисс признака?","status":"Схема качественная · примеры условны","modes_label":"Что такое компромисс признака?","modes":["иммунная защита","свёртывание","вирулентность"],"args":[{"c":"immune"},{"c":"clot"},{"c":"virulence"}],"notes":["Уничтожение возбудителя и повреждение тканей","Остановка кровопотери и риск тромбоза","Передача и вред хозяину — уровень зависит от пути передачи"],"static":["Три весы «польза — издержки»"],"scene":"s16_r_tradeoff","L":{"r16_to_h":"Компромисс: польза и издержки одного признака","r16_to_immune_b":"уничтожение возбудителя","r16_to_immune_c":"повреждение тканей","r16_to_ben":"польза","r16_to_cost":"издержки","r16_to_note":"Отбор поддерживает признак, несмотря на издержки; примеры условны.","r16_to_clot_b":"остановка кровопотери","r16_to_clot_c":"риск тромбоза","r16_to_virulence_b":"передача возбудителя","r16_to_virulence_c":"вред хозяину"}}}},{"id":"mismatch","num":33,"section":3,"questions":[4],"title":"Несоответствие среде","keywords":["Эволюционное несоответствие"],"lead":["Несоответствие — не то же, что компромисс: признак, сложившийся в прежних условиях, в новой среде повышает риск болезни."],"mechanism":["[[T73|Эволюционное несоответствие]] возникает, когда фенотип или программа развития, сложившиеся в прежних условиях, взаимодействуют с новой средой так, что повышается риск болезни. Промышленная революция и связанные с ней изменения питания, инфекций и численности населения изменили среду человека; варианты, связанные с большей приспособленностью в прошлом, через противоположные эффекты в разном возрасте могут повышать риск неинфекционных болезней. Изменения могут быть и ненаследственными: быстрые ответы организма на новую среду вероятнее, чем изменения частот аллелей, требующие многих поколений."],"paragraphs":["Объяснение через несоответствие требует указать конкретный механизм. Сложные болезни не объясняются одной гипотезой: на них влияют генетика, развитие, питание, сон, лекарства и социальная среда. Компромисс описывает признак с пользой и издержками в одной среде; несоответствие — признак, который был выгоден в прежней среде и стал фактором риска в новой.","<b>На практикуме.<\/b> Вкладка 4.","<b>Ограничения.<\/b> Время действия отбора на большинство таких признаков не установлено."],"conditions":"Схема качественная · среды условны.","sources":["src_29","src_30"],"base":"БИО-16·32","quiz":{"id":"S16-L33","question":"Чем несоответствие отличается от компромисса?","options":[{"id":"S16-L33-1","text":"Несоответствие бывает только у болезнетворных вариантов","correct":false,"feedback":"Это признак, выгодный в прежней среде; риск даёт смена среды"},{"id":"S16-L33-2","text":"Это одно и то же","correct":false,"feedback":"Компромисс — польза и издержки в одной среде"},{"id":"S16-L33-3","text":"Риск возникает из-за смены среды","correct":true,"feedback":"В прежней среде признак не повышал риска"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем несоответствие отличается от компромисса?","status":"Схема качественная · среды условны","modes_label":"Чем несоответствие отличается от компромисса?","modes":["прежняя среда","новая среда","сравнение с компромиссом"],"args":[{"v":"past"},{"v":"new"},{"v":"compare"}],"notes":["Признак без повышенного риска","Тот же признак — повышенный риск","Компромисс — в одной среде; несоответствие — при смене среды"],"static":["Один признак в двух средах и сравнительная строка с компромиссом"],"scene":"s16_r_mismatch","L":{"r16_mm_h":"Несоответствие среде","r16_mm_past":"прежняя среда","r16_mm_new":"новая среда","r16_mm_trait":"тот же признак","r16_mm_norisk":"без повышенного риска","r16_mm_risk":"повышенный риск болезни","r16_mm_cmp":"Компромисс — в одной среде; несоответствие — при смене среды"}}},"exam_quiz":{"id":"S16-E10","question":"Что такое эволюционное несоответствие?","options":[{"id":"S16-E10-1","text":"Повышение риска болезни при смене среды","correct":true,"feedback":"Признак сложился в прежних условиях"},{"id":"S16-E10-2","text":"Признак с пользой и издержками в одной среде","correct":false,"feedback":"Это компромисс"},{"id":"S16-E10-3","text":"Мутация, возникшая недавно","correct":false,"feedback":"Несоответствие — свойство взаимодействия признака со средой"}]}},{"id":"strain-replacement","num":34,"section":3,"questions":[4],"title":"Устойчивость после лечения: другой штамм, а не новая мутация","keywords":["Штамм","Микробиота"],"lead":["Когда инфекция возвращалась после лечения уже устойчивой, причиной почти всегда был другой штамм, уже устойчивый, а не новая мутация в исходном."],"mechanism":["Изучили медицинские записи о более чем 140 тыс. случаев инфекции мочевых путей и 7 тыс. раневых инфекций, леченных одним препаратом, к которому возбудитель был чувствителен. Рецидив в течение 4–28 дней возникал примерно в 9 % (мочевые пути) и 5 % (раны) случаев, и более 30 % и 19 % рецидивов соответственно приобрели устойчивость к назначенному препарату. Прочитали геномы 1 113 изолятов кишечной палочки от 510 человек до и после лечения. Среди рецидивов с приобретённой устойчивостью другой [[T74|штамм]] был в 93 % случаев, а среди рецидивов без изменения чувствительности — в 19 %. Случаев устойчивости, возникшей точечной мутацией в исходном штамме, не найдено; 44 % рецидивов с приобретённой устойчивостью вызваны другим видом бактерий."],"paragraphs":["Вывод авторов: устойчивость после лечения возникала главным образом отбором уже существующих устойчивых штаммов, а не новыми мутациями. Источник таких штаммов, вероятно, — собственная [[T75|микробиота]] человека; прошлые устойчивые инфекции повышали риск.","<b>Как это узнали.<\/b> Сравнили геномы возбудителей до и после лечения у одних и тех же людей: по числу различий определили, тот же это штамм или другой.","<b>Граница вывода.<\/b> Одна система здравоохранения, два типа инфекций, ранние рецидивы; что штаммы пришли именно из кишечника или с кожи, прямо не проверено.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 4."],"conditions":"Схема по данным работы, упрощённая · доли — из работы.","sources":["src_09"],"base":"БИО-16·28","level":"adv","next_base":"integration","quiz":{"id":"S16-L34","question":"Как было показано, что устойчивость принёс другой штамм?","options":[{"id":"S16-L34-1","text":"Сравнили геномы возбудителей до и после лечения","correct":true,"feedback":"Другой штамм отличается многими различиями генома"},{"id":"S16-L34-2","text":"Измерили концентрацию препарата в моче","correct":false,"feedback":"Концентрацию не измеряли; сравнивали геномы"},{"id":"S16-L34-3","text":"Нашли мутацию устойчивости в исходном штамме","correct":false,"feedback":"Таких случаев не найдено"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как появлялась устойчивость при рецидиве?","status":"Схема по данным работы, упрощённая · доли — из работы","modes_label":"Как появлялась устойчивость при рецидиве?","modes":["с приобретённой устойчивостью","без изменения чувствительности","другой вид"],"args":[{"panel":"A","g":"SR","show":true},{"panel":"A","g":"SS","show":true},{"panel":"A","g":"species","show":true}],"notes":["Другой штамм — 93 %","Другой штамм — 19 %","Другой вид — 44 %"],"static":["Пары значков штаммов и столбики долей"],"scene":"s16_a4","L":{"a4_pA":"А. Рецидивы: до лечения → рецидив","a4_g_SR":"Рецидивы с приобретённой устойчивостью","a4_before":"до лечения","a4_relapse":"рецидив","a4_other_st":"другой штамм","a4_no_new":"новых мутаций устойчивости в исходном штамме не найдено","a4_a_cond":"Доли — из работы; препарат условный, названия и схемы лечения не приводятся.","a4_g_SS":"Рецидивы без изменения чувствительности","a4_ss_note":"доля замены штамма среди рецидивов без изменения чувствительности","a4_g_species":"Рецидивы с приобретённой устойчивостью: другой вид бактерий (мочевые пути)","a4_other_sp":"другой вид бактерий","a4_sp_note":"Доля среди рецидивов с приобретённой устойчивостью; инфекции мочевых путей"}}},"adv_kind":"Новые данные"},{"id":"plasmid-history","num":35,"section":3,"questions":[4],"title":"Переносчики устойчивости существовали до эпохи антибиотиков","keywords":[],"lead":["Плазмиды, которые сейчас переносят гены устойчивости между бактериями, произошли от плазмид, бывших у возбудителей ещё до массового применения антибиотиков, — но без генов устойчивости."],"mechanism":["Прочитали плазмиды бактерий из исторической коллекции клинических образцов, собранной в первой половине XX века, до массового применения антибиотиков (765 плазмид, из них 218 собраны полностью), и сравнили их с более чем 40 тыс. плазмид из современных баз данных. Современные плазмиды-переносчики генов устойчивости произошли от меньшинства плазмид, уже бывших у возбудителей того времени. Их исходные остовы генов устойчивости не несли: гены устойчивости были приобретены позже. Три пути изменения плазмид: исчезновение исходных остовов, сохранение без существенных изменений и слияние нескольких исходных плазмид в крупные сложные плазмиды. Половина генов устойчивости приходится на семейства плазмид, составляющие лишь около пятой части всех изученных."],"paragraphs":["Пример показывает два уровня отбора: отбор бактерий, несущих гены устойчивости, и изменение самих плазмид как переносчиков.","<b>Как это узнали.<\/b> Построили сеть сходства исторических и современных плазмид и проследили, какие современные плазмиды содержат последовательности исторических.","<b>Граница вывода.<\/b> Историческая коллекция — небольшая выборка клинических образцов; плазмиды, не попавшие в коллекцию и базы данных, не видны.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 4 (как вторая причина появления устойчивости — перенос гена)."],"conditions":"Схема по данным работы, упрощённая · числа — из работы.","sources":["src_24"],"base":"БИО-16·28","level":"adv","next_base":"integration","quiz":{"id":"S16-L35","question":"Что было у исторических плазмид?","options":[{"id":"S16-L35-1","text":"Те же гены устойчивости, что сейчас","correct":false,"feedback":"Исходные остовы генов устойчивости не несли"},{"id":"S16-L35-2","text":"Остовы без генов устойчивости","correct":true,"feedback":"Гены устойчивости появились в них позже"},{"id":"S16-L35-3","text":"Ничего общего с современными плазмидами","correct":false,"feedback":"Современные переносчики произошли от части исторических"}]},"widget":{"kind":"dna","title":"","s":{"title":"Откуда происходят переносчики устойчивости?","status":"Схема по данным работы, упрощённая · числа — из работы","modes_label":"Откуда происходят переносчики устойчивости?","modes":["исторический остов","современная плазмида","меньшинство семейств"],"args":[{"panel":"B","v":"old","show":true},{"panel":"B","v":"modern","show":true},{"panel":"B","v":"share","show":true}],"notes":["Остов без генов устойчивости","Тот же остов с приобретёнными генами","Половина генов устойчивости — в семействах с пятой частью плазмид"],"static":["Исторический и современный остов плазмиды и доли семейств"],"scene":"s16_a4","L":{"a4_pB":"Б. Плазмиды: исторический остов → современная плазмида","a4_hist":"исторический остов","a4_hist_s":"первая половина XX века; без генов устойчивости","a4_lg_bb":"остов плазмиды","a4_lg_res":"гены устойчивости","a4_b_lab":"переносчики устойчивости — потомки меньшинства исторических плазмид","a4_b_half":"половина генов устойчивости — в семействах с ~22 % плазмид","a4_mod":"современная плазмида","a4_mod_s":"с приобретёнными генами устойчивости","a4_fam":"плазмид в этих семействах","a4_fam_g":"генов устойчивости в них"}}},"adv_kind":"Новые данные"},{"id":"integration","num":36,"section":4,"questions":[1,2,3,4],"title":"Итоговая задача: одно наблюдение через четыре семинара","keywords":["Гаплотип","След отбора","Интрогрессия"],"lead":["Одно наблюдение — высокая частота варианта в одной популяции — разбирают на четырёх уровнях: частота, след в последовательности, дерево участка и история с механизмом. На каждом уровне — свои данные."],"mechanism":["Условное наблюдение: вариант гена встречается у 80 % жителей высокогорья и у 1 % соседней равнинной популяции. (1) Частота: различие частот — наблюдение; его могут создать дрейф и эффект основателя, отбор, смешение с популяцией, где вариант част. (2) След в последовательности: протяжённый [[T40|гаплотип]] вокруг варианта при низком разнообразии рядом указывает на недавний быстрый рост частоты — [[T44|след отбора]], если его не объясняет история численности. (3) Дерево участка: если копии участка группируются с архаичным геномом, а участок длинный, вероятнее [[T37|интрогрессия]]; короткий участок с древним расхождением — неполная сортировка. (4) История и механизм: функция гена и связь варианта с признаком — механизм сейчас; смешение, рост частоты и среда — история; медицинский вывод для конкретного человека из этого не следует."],"paragraphs":["Общий порядок: назвать уровень наблюдения; перечислить совместимые объяснения; указать данные, дающие каждому положительный признак; если данных нет, сказать «по этим данным различить нельзя».","<b>На практикуме.<\/b> Итоговая задача под вкладкой 4.","<b>Ограничения.<\/b> Пример условный; числа не относятся к конкретному гену."],"conditions":"Схема качественная · наблюдение условное.","sources":["src_01","src_06","src_17"],"base":"БИО-16·15, БИО-16·19, БИО-16·31; вспомнить [[seminar-15-route.html#ils-vs-introgression|семинар 15: «Как различают неполную сортировку и интрогрессию»]]","quiz":{"id":"S16-L36","question":"Что из перечисленного — данные для уровня «дерево участка»?","options":[{"id":"S16-L36-1","text":"Частота варианта в двух популяциях","correct":false,"feedback":"Это уровень частоты, а не дерева"},{"id":"S16-L36-2","text":"Функция белка, который кодирует этот ген","correct":false,"feedback":"Это механизм, а не происхождение участка"},{"id":"S16-L36-3","text":"Близость копий участка к архаичному геному","correct":true,"feedback":"Так проверяют происхождение участка"}]},"widget":{"kind":"dna","title":"","s":{"title":"Одно наблюдение — четыре уровня","status":"Схема качественная · наблюдение условное","modes_label":"Одно наблюдение — четыре уровня","modes":["частота","след в последовательности","дерево участка","история и механизм"],"args":[{"lvl":1},{"lvl":2},{"lvl":3},{"lvl":4}],"notes":["Различие частот причины не называет","Протяжённый гаплотип — след отбора при проверке модели без отбора","Длинный участок у архаичного генома — интрогрессия","Механизм сейчас и история — разные утверждения"],"static":["Четыре панели одного наблюдения: частоты, гаплотип, дерево участка, карточки"],"scene":"s16_int","L":{"int_h1":"Уровень 1. Частота в популяциях","int_hi":"высокогорье: {p} %","ev_icon_var":"носитель варианта","ev_icon_other":"без варианта","int_lo":"соседняя равнина: {p} %","int_l1":"Различие частот причины не называет","int_h2":"Уровень 2. След в последовательности","int_car":"носители","int_non":"без варианта","int_l2":"Протяжённый гаплотип — след отбора при проверке модели без отбора","int_h3":"Уровень 3. Дерево участка","int_tip_hi":"копия, высокогорье","int_tip_arch":"архаичный геном","int_tip_lo":"копия, равнина","s16_tree_cap":"Длина ветви: время, тыс. лет назад","int_cond_lab":"(условно; одно из возможных деревьев участка)","int_l3":"Длинный участок у архаичного генома — интрогрессия","int_h4":"Уровень 4. История и механизм","int_mech":"механизм сейчас","ev_name2":"Связь с признаком","ev_name3":"Функциональные данные","int_hist":"история","ev_name1":"Вариант установлен","ev_name4":"След отбора в геноме (с учётом демографии)","ev_name5":"Историческая среда","int_five":"пять линий доказательств (вкладка 3)","int_l4":"Механизм сейчас и история — разные утверждения"}}}},{"id":"links","num":37,"section":4,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":[],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},{"ul":["[[seminar-12-route.html#function-origin|семинар 12: «Как система работает и как она возникла — разные вопросы»]] — механизм и история","[[seminar-12-route.html#four-statuses|семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»]] — статусы утверждений","[[seminar-13-route.html#bottleneck-founder|семинар 13: «Узкое место и эффект основателя»]] — расселение","[[seminar-13-route.html#polymorphism|семинар 13: «Как сохраняется полиморфизм»]] и [[seminar-13-route.html#adaptation|семинар 13: «Адаптация и как её доказывают»]] — доказательства адаптации и сохранение патогенных вариантов","[[seminar-14-route.html#interval|семинар 14: «Интервал вместо даты»]] — интервалы на шкале","[[seminar-14-route.html#duplication|семинар 14: «Дупликация: как возникает копия гена»]] — локус амилазы","[[seminar-14-route.html#mtdna|семинар 14: «Митохондриальная ДНК как отдельный случай»]] — генеалогия одного участка","[[seminar-15-route.html#ils|семинар 15: «Неполная сортировка линий»]], [[seminar-15-route.html#introgression|семинар 15: «Интрогрессия»]], [[seminar-15-route.html#tree-or-network|семинар 15: «Дерево или сеть»]] — история популяций человека","[[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]] — изменения клеток опухоли"]},{"h":"Что дальше в курсе"},{"ul":["Паразитология: система «паразит — хозяин»; серповидноклеточный вариант и малярия как пример взаимодействия популяций хозяина и паразита — продолжает БИО-16·31"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Как наследование и сегрегация меняют распределение вариантов мтДНК — [[https://edu.mazunin.science/seminar-9-route.html#segregation|«Молекулярная биология», семинар 9]] — продолжает БИО-16·31","Почему эффект гетероплазмии может проявляться нелинейно — [[https://edu.mazunin.science/seminar-9-route.html#heteroplasmy-threshold|«Молекулярная биология», семинар 9]] — продолжает БИО-16·31","Чем различаются энхансер и промотор — [[https://edu.mazunin.science/seminar-6-route.html#enhancer|«Молекулярная биология», семинар 6]] — продолжает БИО-16·21 (регуляторные варианты персистенции лактазы); соматические мутации и клональная эволюция, теломеры и старение — «раздел III/IV (в разработке)»","Почему HIF-α накапливается при недостатке кислорода — [[https://edu.mazunin.science/seminar-10-route.html#hif|«Молекулярная биология», семинар 10]], как программы HIF зависят от изоформы и ткани — [[https://edu.mazunin.science/seminar-10-route.html#hif-context|«Молекулярная биология», семинар 10]] — продолжает БИО-16·20","Чем различаются онкогенные варианты RAS — [[https://edu.mazunin.science/seminar-3-route.html#oncogenic|«Молекулярная биология», семинар 3]], чем среднее по популяции отличается от сигнала одной клетки — [[https://edu.mazunin.science/seminar-4-route.html#single-cell|«Молекулярная биология», семинар 4]], как нарушения SDH, FH и IDH по-разному меняют метаболиты — [[https://edu.mazunin.science/seminar-8-route.html#oncometabolites|«Молекулярная биология», семинар 8]] — продолжает БИО-16·30"]}],"conditions":"","sources":[],"service":true,"quiz":{"id":"S16-L37","question":"Где в курсе разбирается, почему доля вариантов митохондриальной ДНК может различаться у детей одной матери?","options":[{"id":"S16-L37-1","text":"В теме о дупликации генов","correct":false,"feedback":"Там — как возникает копия гена: [[seminar-14-route.html#duplication|семинар 14: «Дупликация: как возникает копия гена»]]; распределение вариантов мтДНК разбирается в «Молекулярной биологии»."},{"id":"S16-L37-2","text":"В курсе «Молекулярная биология»","correct":true,"feedback":"[[https://edu.mazunin.science/seminar-9-route.html#segregation|Как наследование и сегрегация меняют распределение вариантов мтДНК — «Молекулярная биология», семинар 9]]."},{"id":"S16-L37-3","text":"В теме о происхождении митохондрий","correct":false,"feedback":"Там — откуда произошли митохондрии: [[seminar-12-route.html#endosymbiosis|семинар 12: «Почему митохондрии происходят от бактерии: независимые линии данных»]]; распределение вариантов мтДНК — [[https://edu.mazunin.science/seminar-9-route.html#segregation|«Молекулярная биология», семинар 9]]."}]}}],"sections":[{"title":"Свидетельства и мозаичная история","entry":"three-explanations","sub":"Свидетельства и мозаичная история","label":"Тема 1","integr":false},{"title":"Происхождение и смешение","entry":"molecular-past","sub":"Происхождение и смешение","label":"Тема 2","integr":false},{"title":"Адаптация: как её доказывают","entry":"five-lines","sub":"Адаптация: как её доказывают","label":"Тема 3","integr":false},{"title":"Эволюция в медицине","entry":"evo-medicine","sub":"Эволюция в медицине","label":"Тема 4","integr":false},{"title":"Итог","entry":"integration","sub":"Одно наблюдение — четыре уровня","label":"Итог","integr":true}],"glossary":[{"id":"S16-T01","term":"Наблюдение","section":0,"def":"Утверждение, установленное непосредственно: измерено, увидено или получено в эксперименте. В этом семинаре: наблюдением называют зарегистрированное свойство образца или объекта, включая результат измерения с указанием метода и погрешности."},{"id":"S16-T02","term":"Модельный вывод","section":0,"def":"Интерпретация наблюдений при явных допущениях о связи признака с функцией, процессом или родством."},{"id":"S16-T03","term":"Историческое объяснение","section":0,"def":"Проверяемая реконструкция причин и последовательности прошлых событий, сопоставленная с альтернативными объяснениями."},{"id":"S16-T04","term":"Эволюция","section":0,"def":"Изменение наследственного состава популяций в ряду поколений."},{"id":"S16-T05","term":"Ископаемые остатки","section":0,"def":"Сохранившиеся в отложениях части организмов или их следы; дают сведения об анатомии, месте и, через датирование слоя, о возрасте."},{"id":"S16-T06","term":"Датирование","section":0,"def":"Определение возраста слоя, находки или события; для находок обычно датируют слой, в котором или между которыми они лежат; результат даётся с погрешностью."},{"id":"S16-T07","term":"Археологические данные","section":0,"def":"Орудия, следы обработки костей, очаги и другие следы деятельности; говорят о технологии и поведении, но не всегда о том, кто их оставил."},{"id":"S16-T08","term":"Древняя ДНК","section":0,"def":"ДНК, выделенная из исторического или ископаемого материала; её подлинность подтверждают по характерным повреждениям и контролю загрязнения."},{"id":"S16-T09","term":"Древние белки","section":0,"def":"Белки, сохранившиеся в ископаемых костях и зубах; по их аминокислотным последовательностям устанавливают родство и пол, но различающихся позиций в них меньше, чем в ДНК."},{"id":"S16-T10","term":"Радиометрическое датирование","section":0,"def":"Определение возраста по распаду радиоактивных изотопов; аргоновым методом датируют вулканические туфы."},{"id":"S16-T11","term":"Магнитостратиграфия","section":0,"def":"Датирование слоёв по записанным в породах сменам направления магнитного поля Земли, время которых известно."},{"id":"S16-T12","term":"Двуногость","section":0,"def":"Использование задних конечностей как основной опоры при передвижении по земле."},{"id":"S16-T13","term":"Мозаичная эволюция","section":0,"def":"Неодновременное изменение разных признаков и функциональных систем в одной или нескольких линиях."},{"id":"S16-T14","term":"Австралопитеки","section":0,"def":"Род Australopithecus: двуногие гоминины с небольшим мозгом, известные в Африке примерно от 4,2 до 2 млн лет назад; название объединяет несколько форм."},{"id":"S16-T15","term":"Парантропы","section":0,"def":"Род Paranthropus: гоминины с крупными коренными зубами и массивными челюстями, известные в Африке примерно от 2,7 до 1 млн лет назад."},{"id":"S16-T16","term":"Интервал находок","section":0,"def":"Отрезок времени от самой ранней до самой поздней известной находки таксона; не равен времени существования линии."},{"id":"S16-T17","term":"Ранний Homo","section":0,"def":"Неоднородная совокупность находок рода Homo примерно 2,8–1,6 млн лет назад; границы рода и видов спорны."},{"id":"S16-T18","term":"Каменная индустрия","section":0,"def":"Совокупность способов изготовления каменных орудий; описывает технологию, а не вид изготовителя."},{"id":"S16-T19","term":"Общий предок","section":0,"def":"Популяция, от которой произошли две или более линии; на дереве — их общий узел."},{"id":"S16-T20","term":"Гоминины","section":0,"def":"Линия, более близкая к человеку, чем к шимпанзе, после расхождения этих линий."},{"id":"S16-T21","term":"Гетеротопия","section":0,"def":"Изменение в ходе эволюции места, где в развитии формируется структура."},{"id":"S16-T22","term":"Гетерохрония","section":0,"def":"Изменение в ходе эволюции времени или скорости процессов развития."},{"id":"S16-T23","term":"Денисовцы","section":0,"def":"Древняя линия рода Homo, выделенная по ДНК из Денисовой пещеры; сестринская неандертальцам."},{"id":"S16-T24","term":"Ископаемый вид","section":0,"def":"Вид, выделенный по морфологии ископаемых и правилам классификации; не обязательно совпадает с генетической линией."},{"id":"S16-T25","term":"Рекомбинация","section":1,"def":"Образование новых сочетаний аллелей при мейозе: при кроссинговере и независимом расхождении хромосом."},{"id":"S16-T26","term":"Митохондриальная ДНК","section":1,"def":"Собственная ДНК митохондрий; у человека кодирует 13 белков и 24 РНК. В этом семинаре: кольцевой геном митохондрий; у человека п
