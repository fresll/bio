<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-16.html">← Вернуться к семинару</a> · <a href="section-3.html">Раздел III</a> · <a href="index.html">Все разделы</a></p><h1>Эволюция человека и эволюционная медицина: от ископаемых и геномов к отбору в организме</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-three-explanations"><div class="eyebrow">Свидетельства и мозаичная история · шаг 1 из 37</div><h2>Три вида объяснений: как работает, как возникло, что это значит для медицины</h2><p class="lead">Одно наблюдение можно объяснять тремя способами: каким механизмом оно создаётся сейчас, как сложилось в истории и что из этого следует для медицины. Эти объяснения не заменяют друг друга.</p><div class="note"><strong>Что показывает схема.</strong> Три колонки «механизм — история — медицинский вывод» для одного наблюдения и строка статусов</div><p>Механизм отвечает на вопрос «как работает»: какие молекулы, клетки и ткани создают признак у живого организма. Историческое объяснение отвечает на вопрос «как возникло»: какие изменения, в каких линиях и при каких условиях привели к нынешнему состоянию. Медицинское следствие — что из механизма и истории вытекает для понимания болезни. Утверждения различаются и по статусу: <a href="#ns-g-S16-T01">наблюдение</a> — зарегистрированное свойство образца с указанием метода и погрешности; <a href="#ns-g-S16-T02">модельный вывод</a> — интерпретация наблюдений при допущениях о связи признака с функцией, процессом или родством; <a href="#ns-g-S16-T03">историческое объяснение</a> — реконструкция причин и последовательности прошлых событий, сопоставленная с альтернативами. На схемах страницы статус называют короче: «наблюдение», «расчёт по модели» (модельный вывод, полученный вычислением), «реконструкция» (историческое объяснение) и «гипотеза» (объяснение, ещё не сопоставленное с данными).</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-12-route.html#function-origin">семинар 12: «Как система работает и как она возникла — разные вопросы»</a> и <a href="seminar-12-route.html#four-statuses">семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»</a></p><p>Пример: давление кислорода на высокогорье ниже, чем на уровне моря. Механизм ответа на нехватку кислорода изучают на клетках и людях сейчас; что у части высокогорных популяций этот ответ изменён вариантом гена, полученным при смешении с древней линией, — историческое объяснение; что из происхождения варианта нельзя вывести риск конкретного человека, — граница медицинского вывода. Историческое объяснение не делает признак «правильным» или «оптимальным»: <a href="#ns-g-S16-T04">эволюция</a> — изменение наследственного состава популяций, а не движение к цели.</p><p><b>На практикуме.</b> Все вкладки; итоговая задача — одно наблюдение, разобранное через частоту, след в последовательности, дерево и историю.</p><p><b>Ограничения.</b> Историческое объяснение проверяют по данным, как и механизм, но прошлое не наблюдают: его реконструируют.</p><div class="static-quiz"><h3>Какое утверждение — историческое объяснение?</h3><ol><li><b>А.</b> Вариант гена распространился у предков популяции под действием отбора <i>(верный вариант)</i><br><span class="expl">Это утверждение о прошлых событиях; его проверяют по геномам и датировкам</span></li><li><b>Б.</b> Белок, кодируемый геном, участвует в ответе клетки на нехватку кислорода <i>(неверный вариант)</i><br><span class="expl">Это механизм: как работает система сейчас</span></li><li><b>В.</b> Ген прочитан у ста жителей высокогорья <i>(неверный вариант)</i><br><span class="expl">Это наблюдение: зарегистрировано свойство образцов</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nature13408">Huerta-Sánchez E. et al. Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 2014; 512: 194–197</a></li></ul><p>Схема качественная · пример условно упрощён.</p></details></article><article class="card print-unit" id="ns-data-lines"><div class="eyebrow">Свидетельства и мозаичная история · шаг 2 из 37</div><h2>Линии данных и допустимые выводы</h2><p class="lead">Каждая линия данных отвечает только на свои вопросы: ископаемое — о строении, месте и возрасте, орудие — о технологии, древние молекулы — о родстве.</p><div class="note"><strong>Что показывает схема.</strong> Четыре значка линий данных и список восьми выводов с отметками для четырёх режимов</div><p><a href="#ns-g-S16-T05">Ископаемые остатки</a> показывают анатомию, географию и — через <a href="#ns-g-S16-T06">датирование</a> слоя — возраст. <a href="#ns-g-S16-T07">Археологические данные</a> — орудия, следы разделки, очаги — говорят о технологии и поведении, но не всегда об изготовителе. <a href="#ns-g-S16-T08">Древняя ДНК</a> и <a href="#ns-g-S16-T09">древние белки</a> уточняют родство и пол, но сохраняются лишь в части образцов: ДНК — главным образом в холодных областях и в образцах моложе нескольких сотен тысяч лет; белки зубной эмали сохраняются дольше, но содержат меньше различающихся позиций. Датирование определяет возраст слоя, в котором лежит находка, разными методами: <a href="#ns-g-S16-T10">радиометрическое датирование</a> вулканических туфов, <a href="#ns-g-S16-T11">магнитостратиграфия</a>, уран-ториевый и уран-свинцовый методы для натёков в пещерах, термолюминесценция обожжённых кремней, радиоуглеродный метод для последних десятков тысяч лет. У каждой даты есть погрешность.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-three-explanations">«Три вида объяснений: как работает, как возникло, что это значит для медицины»</a></p><p>Вывод допустим, только если есть все нужные ему линии. «Несколько линий жили одновременно» требует и ископаемых, и датировок; «неандертальцы и денисовцы — сестринские линии» — геномов; «каменные орудия старше древнейших находок Homo» — орудий, датировок и ископаемых. Отсутствие находки — не доказательство отсутствия: ни одна линия данных не охватывает всех мест и эпох.</p><p><b>На практикуме.</b> Вкладка 1, конструктор «Убрать линию данных».</p><p><b>Ограничения.</b> Карта древних геномов отражает не только историю населения, но и условия сохранения ДНК и выбор образцов.</p><div class="static-quiz"><h3>Каменные орудия найдены в слое без костей гоминин. Что из этого следует?</h3><ol><li><b>А.</b> Их изготовил вид, живший в этом месте раньше всех <i>(неверный вариант)</i><br><span class="expl">Нужны останки в том же слое; одна близость во времени не указывает изготовителя</span></li><li><b>Б.</b> Их возраст и технологию можно оценить, изготовителя — нет <i>(верный вариант)</i><br><span class="expl">Изготовителя по самим орудиям не установить</span></li><li><b>В.</b> В этом месте гоминин не было <i>(неверный вариант)</i><br><span class="expl">Орудия сами — след присутствия гоминин; не найдены только их остатки</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/ajpa.22902">Wood B., Boyle E.K. Hominin taxic diversity: fact or fantasy? Am J Phys Anthropol 2016; 159(S61): S37–S78</a></li><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1038/nature14464">Harmand S. et al. 3.3-million-year-old stone tools from Lomekwi 3, West Turkana, Kenya. Nature 2015; 521: 310–315</a></li><li><a href="https://doi.org/10.1126/science.ads3888">Tsutaya T. et al. A male Denisovan mandible from Pleistocene Taiwan. Science 2025; 388: 176–180</a></li></ul><p>Расчёт по модели · правило «вывод допустим при всех нужных линиях» — учебное.</p></details></article><article class="card print-unit" id="ns-bipedalism-mosaic"><div class="eyebrow">Свидетельства и мозаичная история · шаг 3 из 37</div><h2>Двуногость: признаки появлялись не одновременно</h2><p class="lead">Двуногость не появилась сразу целиком: у древних находок признаки прямохождения сочетаются с признаками лазания и с небольшим мозгом.</p><div class="note"><strong>Что показывает схема.</strong> Таблица три признака × четыре находки со значками состояний</div><p><a href="#ns-g-S16-T12">Двуногость</a> — использование задних конечностей как основной опоры при передвижении по земле. <a href="#ns-g-S16-T13">Мозаичная эволюция</a> — неодновременное изменение разных признаков в одной или нескольких линиях. У Ardipithecus ramidus (4,51–4,3 млн лет назад) скелет указывает и на хорошее лазание, и на прямохождение по земле, мозг — размером с мозг шимпанзе. У Australopithecus afarensis (3,7–3,0 млн лет назад) таз, колено, стопа и позвоночник изменены для опоры на две ноги; следы в вулканическом пепле Летоли (3,6 млн лет) оставлены двуногими существами; мозговой отдел — 400–500 см³. Мозговой отдел объёмом около 850 см³ — у находки, отнесённой к Homo ergaster (африканскому H. erectus); интервал находок этого вида начинается около 1,7 млн лет назад. Значит, прямохождение сформировалось задолго до значительного увеличения мозга.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-data-lines">«Линии данных и допустимые выводы»</a></p><p>Более древние кандидаты известны по отдельным частям: Sahelanthropus tchadensis (7,2–6,8 млн лет) — главным образом по деформированному черепу с мозговой коробкой объёмом 320–380 см³; его положение на дереве спорно; Orrorin tugenensis (6,0–5,7 млн лет) — главным образом по бедренным костям, совместимым с двуногой нагрузкой. Если у находки нет нужной части скелета, признак по ней не оценивается: прочерк в таблице — «нет данных», а не «нет признака».</p><p><b>На практикуме.</b> Вкладка 1, таблица «признак × находка».</p><p><b>Ограничения.</b> По таблице признаков нельзя выстроить цепочку «предок → потомок»: сходный набор признаков мог возникнуть в разных линиях.</p><div class="static-quiz"><h3>Что показывают находки Ardipithecus ramidus?</h3><ol><li><b>А.</b> Двуногость возникла одновременно с крупным мозгом <i>(неверный вариант)</i><br><span class="expl">Мозг Ardipithecus был размером с мозг шимпанзе; крупный мозг появился позже</span></li><li><b>Б.</b> Это прямой предок человека <i>(неверный вариант)</i><br><span class="expl">Предковое положение по одной находке не устанавливается</span></li><li><b>В.</b> Прямохождение сочеталось с хорошим лазанием <i>(верный вариант)</i><br><span class="expl">Признаки разных способов передвижения в одном скелете</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1002/ajpa.22902">Wood B., Boyle E.K. Hominin taxic diversity: fact or fantasy? Am J Phys Anthropol 2016; 159(S61): S37–S78</a></li></ul><p>Схема по данным обзоров, упрощённая · даты — интервалы находок.</p></details></article><article class="card print-unit" id="ns-australopiths"><div class="eyebrow">Свидетельства и мозаичная история · шаг 4 из 37</div><h2>Разнообразие австралопитеков: несколько линий одновременно</h2><p class="lead">Около 2 млн лет назад в Африке одновременно существовали по меньшей мере четыре формы гоминин — история ветвилась, а не шла по ступеням.</p><div class="note"><strong>Что показывает схема.</strong> Шкала времени с 18 отрезками и вертикальными линиями на 3,5 и 2,0 млн лет</div><p><a href="#ns-g-S16-T14">Австралопитеки</a> (Australopithecus) — двуногие гоминины с небольшим мозгом, известные в Африке примерно от 4,2 до 2 млн лет назад; название объединяет несколько форм и, вероятно, не обозначает одну естественную линию. Параллельно существовали <a href="#ns-g-S16-T15">парантропы</a> (Paranthropus) — с крупными коренными зубами и массивными челюстями; Kenyanthropus platyops (3,54–3,35 млн лет) — современник Au. afarensis. На шкале времени каждая форма — <a href="#ns-g-S16-T16">интервал находок</a>: отрезок «от самой ранней до самой поздней известной находки». Отрезки P. boisei (2,3–1,3), P. robustus (2,0–1,0), Homo habilis в широком смысле (2,35–1,65) и H. rudolfensis (2,0–1,95 млн лет) перекрываются.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-bipedalism-mosaic">«Двуногость: признаки появлялись не одновременно»</a></p><p>Интервал находок — не время существования вида: первая и последняя находки почти никогда не совпадают с появлением и исчезновением линии. Поэтому концы отрезков на шкале штрихуются: даты с учётом погрешности шире консервативных (например, у Au. africanus — 3,0–2,4 млн лет и 4,02–1,9 млн лет с погрешностью: пещерные отложения датировать труднее, чем вулканические туфы). Связи между формами показаны только там, где они обоснованы; остальные — пунктиром «родство не установлено».</p><p><b>На практикуме.</b> Вкладка 1, шкала времени.</p><p><b>Ограничения.</b> Сколько видов объединяет каждое название, зависит от выбранной концепции вида.</p><div class="static-quiz"><h3>Что означает отрезок вида на шкале времени?</h3><ol><li><b>А.</b> Интервал от ранней до поздней известной находки <i>(верный вариант)</i><br><span class="expl">Линия могла появиться раньше и исчезнуть позже</span></li><li><b>Б.</b> Время от возникновения до вымирания вида <i>(неверный вариант)</i><br><span class="expl">Этого по находкам не узнать: отрезок — интервал находок</span></li><li><b>В.</b> Время, когда вид был единственным гоминином <i>(неверный вариант)</i><br><span class="expl">Отрезки перекрываются: формы сосуществовали</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1002/ajpa.22902">Wood B., Boyle E.K. Hominin taxic diversity: fact or fantasy? Am J Phys Anthropol 2016; 159(S61): S37–S78</a></li></ul><p>Схема по данным обзора, упрощённая · отрезки — интервалы находок, а не время существования линий.</p></details></article><article class="card print-unit" id="ns-early-homo"><div class="eyebrow">Свидетельства и мозаичная история · шаг 5 из 37</div><h2>Ранний Homo и проблема определения рода</h2><p class="lead">Граница между поздними австралопитеками и ранним Homo размыта: увеличение мозга, уменьшение зубов, изменения лица, кисти и пропорций шли мозаично, и единого признака рода нет.</p><div class="note"><strong>Что показывает схема.</strong> Отрезки раннего Homo, засечка орудий 3,3 млн лет и отрезок H. erectus со штриховкой спорной поздней границы</div><p><a href="#ns-g-S16-T17">Ранний Homo</a> — неоднородная совокупность находок около 2,8–1,6 млн лет назад. Древнейшая находка, отнесённая к Homo, — нижняя челюсть из Леди-Герару (2,80–2,75 млн лет). H. habilis и H. rudolfensis часто считают разными видами, но различия могут отражать изменчивость по полу, месту и времени; часть находок предлагали относить к Australopithecus. Каменные орудия Ломекви (3,3 млн лет) старше древнейших известных находок Homo: <a href="#ns-g-S16-T18">каменная индустрия</a> — способ изготовления орудий, а не признак вида, и по орудиям нельзя установить изготовителя. С появлением Homo erectus в широком смысле (древнейшие находки — около 1,8 млн лет) гоминины впервые известны за пределами Африки.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-australopiths">«Разнообразие австралопитеков: несколько линий одновременно»</a>; вспомнить <a href="seminar-15-route.html#species-concepts">семинар 15: «Концепции вида и их границы»</a></p><p>Род — категория классификации; его границу проводят по набору признаков, и при мозаичной эволюции разные наборы дают разные границы. Поэтому «первый Homo» — не находка, а решение классификации, зависящее от того, какие признаки считать решающими.</p><p><b>На практикуме.</b> Вкладка 1; «Найти причину» (случай I).</p><p><b>Ограничения.</b> Поздняя граница H. erectus спорна: разные методы датирования поздних находок дают от 101 до 27 тыс. лет.</p><div class="static-quiz"><h3>Почему по орудиям Ломекви нельзя назвать их изготовителя?</h3><ol><li><b>А.</b> Орудия Ломекви слишком плохо датированы для вывода <i>(неверный вариант)</i><br><span class="expl">Слой датирован по туфам и магнитостратиграфии</span></li><li><b>Б.</b> Индустрия описывает технологию, а не вид <i>(верный вариант)</i><br><span class="expl">Изготовителя показывают только останки в том же слое</span></li><li><b>В.</b> В то время гоминин в Африке ещё не было <i>(неверный вариант)</i><br><span class="expl">Гоминины жили задолго до 3,3 млн лет назад</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1002/ajpa.22902">Wood B., Boyle E.K. Hominin taxic diversity: fact or fantasy? Am J Phys Anthropol 2016; 159(S61): S37–S78</a></li><li><a href="https://doi.org/10.1038/nature14464">Harmand S. et al. 3.3-million-year-old stone tools from Lomekwi 3, West Turkana, Kenya. Nature 2015; 521: 310–315</a></li></ul><p>Схема по данным обзоров, упрощённая · отрезки — интервалы находок.</p></details></article><article class="card print-unit" id="ns-established-open"><div class="eyebrow">Свидетельства и мозаичная история · шаг 6 из 37</div><h2>Что установлено и что остаётся открытым</h2><p class="lead">Установлено: история гоминин ветвилась, двуногость появилась раньше крупного мозга, несколько линий сосуществовали. Открыто: положение многих находок, границы родов и видов, авторство многих орудий.</p><div class="note"><strong>Что показывает схема.</strong> Два списка «установлено / открыто», мини-дерево человек–шимпанзе и три категории</div><p>Человек и шимпанзе — современные линии от <a href="#ns-g-S16-T19">общего предка</a>; <a href="#ns-g-S16-T20">гоминины</a> — линия, более близкая к человеку, чем к шимпанзе. Шимпанзе не предок человека: обе линии изменялись независимо. Новая находка может изменить видовое определение, показать, что несколько названий описывают одну изменчивую линию, или сдвинуть интервал вида. <a href="#ns-g-S16-T24">Ископаемый вид</a>, генетическая линия и популяция — разные категории: <a href="#ns-g-S16-T23">денисовцев</a> выделили по ДНК, а не по анатомии.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-data-lines">«Линии данных и допустимые выводы»</a>–16·5</p><p>Неопределённость отражает не слабость эволюционного объяснения, а неполноту летописи: сохранность костей и молекул зависит от условий, раскопки идут не везде. Сильный вывод опирается на согласие нескольких независимых линий данных.</p><p><b>На практикуме.</b> Вкладка 1: пунктир «родство не установлено» на шкале; итоговая задача.</p><p><b>Ограничения.</b> Число видов гоминин зависит от концепции вида и от того, как оценивают изменчивость внутри вида.</p><div class="static-quiz"><h3>Почему шимпанзе нельзя считать предком человека?</h3><ol><li><b>А.</b> Шимпанзе живут в других местах и средах <i>(неверный вариант)</i><br><span class="expl">Родство не определяется местом обитания</span></li><li><b>Б.</b> У шимпанзе совсем другой набор генов <i>(неверный вариант)</i><br><span class="expl">Набор генов почти общий; дело в том, что линии разошлись от общего предка</span></li><li><b>В.</b> Обе линии — современные потомки общего предка <i>(верный вариант)</i><br><span class="expl">Они разошлись и изменялись независимо</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1002/ajpa.22902">Wood B., Boyle E.K. Hominin taxic diversity: fact or fantasy? Am J Phys Anthropol 2016; 159(S61): S37–S78</a></li><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li></ul><p>Схема качественная · статусы утверждений названы.</p></details></article><article class="card print-unit" id="ns-ilium-development"><div class="eyebrow">Свидетельства и мозаичная история · шаг 7 из 37</div><h2>Двуногость: два изменения в развитии таза</h2><p class="lead">Короткая и широкая подвздошная кость человека формируется в развитии иначе, чем у других приматов, — двумя сдвигами в развитии.</p><div class="note"><strong>Что показывает схема.</strong> Контуры развивающейся подвздошной кости человека и другого примата с зоной роста и центрами окостенения</div><p>Изучили развитие таза у зародышей человека и других приматов, в том числе шимпанзе, и мыши. Первый сдвиг: хрящевая зона роста подвздошной кости человека расположена перпендикулярно положению у других приматов — изменилось место роста (<a href="#ns-g-S16-T21">гетеротопия</a>). Второй сдвиг: окостенение подвздошной кости начинается в другом месте и в другое время, чем у других приматов и чем в длинных костях человека (<a href="#ns-g-S16-T22">гетерохрония</a>). Эти изменения позволили тазу человека расти в ширину и сформировать подвздошную кость, необычную среди приматов.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-bipedalism-mosaic">«Двуногость: признаки появлялись не одновременно»</a></p><p>Работа связывает анатомию двуногости с изменениями развития: признак взрослого скелета — результат того, где и когда растёт кость. Это согласуется с мозаичной эволюцией: форма таза могла меняться независимо от мозга и кисти.</p><p><b>Как это узнали.</b> Сравнили срезы и изображения развивающегося таза у зародышей нескольких видов и активность генов в зоне роста.</p><p><b>Граница вывода.</b> Последовательность сдвигов в истории гоминин выведена из сравнения современных видов; ископаемые зародыши не сохраняются. Что отбор действовал именно на эти изменения, — гипотеза.</p><p><b>На практикуме.</b> Не моделируется; шаг дополняет таблицу мозаики признаков на вкладке 1.</p><div class="static-quiz"><h3>Что показало сравнение развития таза?</h3><ol><li><b>А.</b> Изменились место и время роста кости <i>(верный вариант)</i><br><span class="expl">Зона роста повёрнута, окостенение смещено</span></li><li><b>Б.</b> Таз человека растёт так же, как у шимпанзе <i>(неверный вариант)</i><br><span class="expl">Найдены два различия развития</span></li><li><b>В.</b> Форма таза задана одним геном двуногости <i>(неверный вариант)</i><br><span class="expl">Найдены сдвиги развития, а не один ген</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-025-09399-9">Senevirathne G. et al. The evolution of hominin bipedalism in two steps. Nature 2025; 645: 952–963</a></li></ul><p>Схема по данным работы, упрощённая · последовательность сдвигов — реконструкция.</p></details></article><article class="card print-unit" id="ns-denisovan-proteins"><div class="eyebrow">Свидетельства и мозаичная история · шаг 8 из 37</div><h2>Белки называют линию, но не название вида</h2><p class="lead">Когда ДНК не сохранилась, принадлежность находки к линии иногда устанавливают по древним белкам — но спор о названии вида это не снимает.</p><div class="note"><strong>Что показывает схема.</strong> Воронка отбора фрагментов, участок выравнивания коллагена и две колонки «линия — название»</div><p>В пещере на юго-западе Китая просмотрели более 60 000 фрагментов костей; 76 проверили по пептидным «отпечаткам» коллагена, 17 — секвенированием белков. В коллагене нескольких фрагментов найден вариант аминокислоты, характерный для <a href="#ns-g-S16-T23">денисовцев</a>, — по нему фрагменты отнесены к денисовской линии. Это местонахождение дало больше денисовских остатков, чем любое другое за пределами Денисовой пещеры. Для азиатских находок среднего плейстоцена при этом предложены два разных видовых названия, и находки, отнесённые к денисовцам по молекулам, оказались распределены между ними по-разному.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-data-lines">«Линии данных и допустимые выводы»</a>, шаг <a href="#ns-established-open">«Что установлено и что остаётся открытым»</a></p><p>Пример показывает различие категорий: генетическая линия устанавливается по молекулам, а <a href="#ns-g-S16-T24">ископаемый вид</a> — по морфологии и правилам классификации; их соответствие нужно проверять для каждой находки.</p><p><b>Как это узнали.</b> Белки извлекли из костей, определили последовательности пептидов масс-спектрометрией и сравнили с известными вариантами других гоминин.</p><p><b>Граница вывода.</b> Белки содержат мало различающихся позиций: отнесение держится на одном–двух вариантах. Возраст и анатомия находок — отдельные вопросы; название вида — решение классификации, а не результат анализа белков.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 1.</p><div class="static-quiz"><h3>Что установили по белкам?</h3><ol><li><b>А.</b> Внешний облик и рост денисовцев <i>(неверный вариант)</i><br><span class="expl">Облик по нескольким вариантам белка не восстанавливается</span></li><li><b>Б.</b> Принадлежность фрагментов к денисовцам <i>(верный вариант)</i><br><span class="expl">По варианту аминокислоты, характерному для денисовцев</span></li><li><b>В.</b> Правильное название вида денисовцев <i>(неверный вариант)</i><br><span class="expl">Название вида — решение классификации; спор продолжается</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-16.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-026-10976-9">Rao H. et al. Ancient proteins identify various Denisovan remains from Southwest China. Nature 2026</a></li></ul><p>Схема по данным работы, упрощённая · число фрагментов и вариант — из работы.</p></details></article><article class="card print-unit" id="ns-molecular-past"><div class="eyebrow">Происхождение и смешение · шаг 9 из 37</div><h2>Какие молекулярные данные говорят о прошлом</h2><p class="lead">Геном современного человека — архив прошлого, но прошлое из него не считывают, а реконструируют через модель наследования и истории численности.</p><div class="note"><strong>Что показывает схема.</strong> Конвейер «данные → модель → оценка → интервал» с примерами источников данных</div><p>По распределению вариантов и длинам общих участков реконструируют изменения численности, разделения и контакты популяций. Из-за <a href="#ns-g-S16-T25">рекомбинации</a> разные участки одной хромосомы имеют разную историю родства; поэтому история популяции складывается из историй многих участков. <a href="#ns-g-S16-T26">Митохондриальная ДНК</a> и <a href="#ns-g-S16-T27">нерекомбинирующая часть Y-хромосомы</a> — по одному участку, наследуемому по одной линии; их общий предок — не единственная женщина или мужчина своей эпохи, а лишь последний общий предок сохранившихся копий этого участка. <a href="#ns-g-S16-T08">Древняя ДНК</a> даёт прямой срез прошлого, но сохраняется неравномерно.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-15-route.html#gene-species-tree">семинар 15: «Дерево гена и дерево видов»</a> и <a href="seminar-14-route.html#mtdna">семинар 14: «Митохондриальная ДНК как отдельный случай»</a></p><p>Геномные выводы имеют форму «данные → модель наследования и истории численности → оценка параметров → интервал неопределённости». Разные истории иногда дают сходный след в геномах; сильный вывод требует согласия современных геномов, древней ДНК, ископаемых и археологии. Годы получают из числа различий через скорость мутаций и длительность поколения — допущения, от которых зависит оценка.</p><p><b>На практикуме.</b> Вкладка 2: дерево популяций с интервалами оценок узлов.</p><p><b>Ограничения.</b> Древних геномов из тропической Африки мало: там ДНК сохраняется хуже.</p><div class="static-quiz"><h3>Почему по митохондриальной ДНК нельзя восстановить всю историю популяции?</h3><ol><li><b>А.</b> Митохондриальная ДНК не изменяется <i>(неверный вариант)</i><br><span class="expl">Изменяется; именно поэтому по ней строят генеалогии</span></li><li><b>Б.</b> Митохондриальная ДНК есть только у женщин <i>(неверный вариант)</i><br><span class="expl">Есть у всех, но передаётся по материнской линии</span></li><li><b>В.</b> Это один участок с одной генеалогией <i>(верный вариант)</i><br><span class="expl">История одного участка не равна истории популяции</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Схема качественная · интервалы — оценки моделей.</p></details></article><article class="card print-unit" id="ns-african-origin"><div class="eyebrow">Происхождение и смешение · шаг 10 из 37</div><h2>Происхождение Homo sapiens в Африке</h2><p class="lead">Ископаемые и геномы согласно указывают на Африку: древнейшие находки Homo sapiens — оттуда, и там же наибольшее генетическое разнообразие современных людей.</p><div class="note"><strong>Что показывает схема.</strong> Засечки двух находок на шкале и условная карта ветвления групп с подмножествами аллелей одного участка, без ступеней и вертикального порядка</div><p>Находки из Джебель-Ирхуда (Марокко) сочетают современное строение лица с более архаичной формой мозговой коробки; возраст слоя — 315 ± 34 тыс. лет по термолюминесценции обожжённых кремней. Минимальный возраст находки Омо I (Эфиопия) — 233 ± 22 тыс. лет: туф над ней привязали по химическому составу к извержению, датированному аргоновым методом. Наибольшее генетическое разнообразие людей — в Африке; неафриканские популяции несут в основном часть африканского разнообразия, изменённую <a href="#ns-g-S16-T28">эффектом основателя</a>, дрейфом и последующим смешением.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-data-lines">«Линии данных и допустимые выводы»</a>, шаг <a href="#ns-molecular-past">«Какие молекулярные данные говорят о прошлом»</a></p><p>Находки из разных частей Африки с разной мозаикой признаков указывают на длительное и географически распределённое формирование вида, а не на одну точку и один момент. Признаки современного строения появлялись неодновременно: лицо раньше, чем округлая мозговая коробка.</p><p><b>На практикуме.</b> Вкладка 1 (шкала времени: засечки Джебель-Ирхуда и Омо I); вкладка 2.</p><p><b>Ограничения.</b> Минимальный возраст говорит, что находка не моложе указанного, но не определяет её точный возраст.</p><div class="static-quiz"><h3>Что означает «минимальный возраст 233 ± 22 тыс. лет» для Омо I?</h3><ol><li><b>А.</b> Находка не моложе этой оценки <i>(верный вариант)</i><br><span class="expl">Датирован слой над находкой, сама она старше</span></li><li><b>Б.</b> Находке ровно 233 тыс. лет <i>(неверный вариант)</i><br><span class="expl">Указана нижняя граница с погрешностью, а не точная дата</span></li><li><b>В.</b> Вид Homo sapiens возник 233 тыс. лет назад <i>(неверный вариант)</i><br><span class="expl">Возраст находки не равен времени возникновения вида</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1038/nature22335">Richter D. et al. The age of the hominin fossils from Jebel Irhoud, Morocco, and the origins of the Middle Stone Age. Nature 2017; 546: 293–296</a></li><li><a href="https://doi.org/10.1038/s41586-021-04275-8">Vidal C.M. et al. Age of the oldest known Homo sapiens from eastern Africa. Nature 2022; 601: 579–583</a></li><li><a href="https://doi.org/10.1038/nature22336">Hublin J.-J. et al. New fossils from Jebel Irhoud, Morocco and the pan-African origin of Homo sapiens. Nature 2017; 546: 289–292</a></li></ul><p>Схема по данным работ, упрощённая · даты — с погрешностью и методом.</p></details></article><article class="card print-unit" id="ns-structured-origin"><div class="eyebrow">Происхождение и смешение · шаг 11 из 37</div><h2>Структурированные предковые популяции</h2><p class="lead">Африканское происхождение не означает происхождения от одной небольшой изолированной популяции: предковое население было разделено на части, которые обменивались генами.</p><div class="note"><strong>Что показывает схема.</strong> Три трубки-схемы: одна популяция, структура с дугами, генеалогия участка внутри трубок</div><p><a href="#ns-g-S16-T29">Структурированное происхождение</a> — модель, в которой несколько африканских популяций долго существовали частично обособленно, обменивались генами в разной степени и иногда сливались. Климатические и географические барьеры в Африке менялись во времени, поэтому популяции могли разделяться и снова встречаться. Такая структура способна создать глубоко расходящиеся генные линии без участия особого неизвестного вида. Модели различаются числом популяций, временем разделения и интенсивностью потока генов, но согласуются в главном: генетическое разнообразие Homo sapiens сложилось в ходе длительного процесса. <a href="#ns-g-S16-T30">Коалесцентная дата</a> — модельная оценка времени до общего предка копий участка генома; это не дата возникновения вида.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-african-origin">«Происхождение Homo sapiens в Африке»</a>; вспомнить <a href="seminar-13-route.html#deep-structure">семинар 13: «Предки современного человека — две популяции, а не одна»</a> (сверх программы)</p><p>Составные части таких моделей — математические популяции; сопоставлять их с конкретными ископаемыми формами или современными группами можно только по дополнительным данным. Разные участки генома имеют разные коалесцентные даты, поэтому «возраст» одного участка не равен возрасту популяции.</p><p><b>На практикуме.</b> Вкладка 2; продвинутый уровень — две модели происхождения рядом.</p><p><b>Ограничения.</b> Выбор модели зависит от того, какие статистики генома используют и какие варианты модели сравнивают.</p><div class="static-quiz"><h3>Почему коалесцентная дата участка не равна дате возникновения вида?</h3><ol><li><b>А.</b> Коалесцентные даты всегда моложе вида <i>(неверный вариант)</i><br><span class="expl">Чаще бывают старше: копии сливаются в предковой популяции</span></li><li><b>Б.</b> Копии участка могли разойтись задолго до вида <i>(верный вариант)</i><br><span class="expl">Предковый полиморфизм переходит через разделения популяций</span></li><li><b>В.</b> Для коалесцентной даты не нужна модель <i>(неверный вариант)</i><br><span class="expl">Нужна: скорость мутаций, длительность поколения, история численности</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1038/s41586-023-06055-y">Ragsdale A.P. et al. A weakly structured stem for human origins in Africa. Nature 2023; 617: 755–763</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Схема качественная · популяции модели условны.</p></details></article><article class="card print-unit" id="ns-dispersal"><div class="eyebrow">Происхождение и смешение · шаг 12 из 37</div><h2>Расселение из Африки</h2><p class="lead">Основная часть генетического наследия неафриканских популяций восходит к одному крупному расселению из Африки, завершившемуся не позднее примерно 45–40 тыс. лет назад (оценки моделей); более ранние выходы оставили малый вклад или не оставили его.</p><div class="note"><strong>Что показывает схема.</strong> Ветвление групп основателей на условной карте с уменьшающимся набором аллелей одного участка и стрелки обратных миграций, без ступеней</div><p>По мере <a href="#ns-g-S16-T31">расселения</a> небольшие группы многократно отделялись от исходных популяций. Последовательные эффекты основателя и дрейф уменьшали часть разнообразия с удалением от Африки; меньшее разнообразие — след истории основания групп, а не свойство людей. На примере одного участка генома: если расположить регионы по удалённости пути от Африки к югу от Сахары, аллели каждого следующего региона оказываются частью аллелей предыдущего. Движение шло в разных направлениях: были обратные миграции в Африку, контакты соседних популяций, позднейшие переселения; поэтому возникла <a href="#ns-g-S16-T32">популяционная структура</a> — неоднородность частот вариантов и родства между группами, связанная с местом и историей.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-african-origin">«Происхождение Homo sapiens в Африке»</a>, шаг <a href="#ns-structured-origin">«Структурированные предковые популяции»</a>; вспомнить <a href="seminar-13-route.html#bottleneck-founder">семинар 13: «Узкое место и эффект основателя»</a></p><p>Время основного выхода связано и со смешением с неандертальцами: если смешение произошло у общих предков всех неафриканцев, то они уже покинули Африку к этому времени. Генетическое происхождение человека — вероятностное описание родства участков его генома с выбранными референсными популяциями; оно не задаёт набора биологических свойств.</p><p><b>На практикуме.</b> Вкладка 2.</p><p><b>Ограничения.</b> Датировки расселения зависят от моделей, калибровки и от того, какие древние геномы доступны; одна генеалогическая карта не описывает всех переселений.</p><div class="static-quiz"><h3>Почему разнообразие уменьшается с удалением от Африки?</h3><ol><li><b>А.</b> Отбор против редких вариантов вне Африки <i>(неверный вариант)</i><br><span class="expl">Основная причина — малые группы основателей и дрейф, а не отбор</span></li><li><b>Б.</b> Мутации вне Африки возникают реже <i>(неверный вариант)</i><br><span class="expl">Дело не в скорости мутаций, а в выборке копий при основании групп</span></li><li><b>В.</b> Эффекты основателя при расселении <i>(верный вариант)</i><br><span class="expl">Каждая новая группа несла часть разнообразия исходной</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1126/science.adq3010">Iasi L.N.M. et al. Neanderthal ancestry through time: insights from genomes of ancient and present-day humans. Science 2024; 386: eadq3010</a></li></ul><p>Схема качественная · направления и группы условны.</p></details></article><article class="card print-unit" id="ns-archaic-lineages"><div class="eyebrow">Происхождение и смешение · шаг 13 из 37</div><h2>Неандертальцы и денисовцы как генетические линии</h2><p class="lead">Неандертальцы и денисовцы — сестринские линии, родственные Homo sapiens; денисовцев сначала выделили по ДНК, а не по анатомии.</p><div class="note"><strong>Что показывает схема.</strong> Дерево четырёх популяций с интервалами узлов и одной дугой «неандертальцы × денисовцы»</div><p>Геномы неандертальцев и денисовцев имеют больше общих вариантов друг с другом, чем с современными людьми: они происходят от общей предковой популяции, отделившейся от предков современных людей около 630–520 тыс. лет назад, и разделились между собой около 440–390 тыс. лет назад (модельные оценки). <a href="#ns-g-S16-T33">Неандертальцы</a> известны по многочисленным ископаемым Европы, Западной и Центральной Азии и юга Сибири (консервативный интервал находок — 130–40 тыс. лет) и по нескольким геномам. Денисовцы известны по немногим находкам; лишь недавно денисовскую митохондриальную ДНК удалось связать с почти полным черепом: её выделили из зубного камня черепа из Харбина (возраст более 146 тыс. лет), когда из зуба и кости ДНК получить не удалось. Древнейшие денисовские остатки в Денисовой пещере имеют возраст около 200 тыс. лет, последние — около 55 тыс. лет (оптическое датирование отложений). <a href="#ns-g-S16-T34">Генетическая линия</a> — совокупность носителей, связанных общим происхождением по геному; она не обязательно совпадает с морфологически определённым видом.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-molecular-past">«Какие молекулярные данные говорят о прошлом»</a>, шаг <a href="#ns-established-open">«Что установлено и что остаётся открытым»</a></p><p>Прямое свидетельство контакта двух древних линий — геном особи Денисова 11: мать была неандерталкой, отец — денисовцем. Значит, скрещивание происходило не только с Homo sapiens. Генетические следы указывают и на линии, известные только по статистическому следу в геномах, — <a href="#ns-g-S16-T35">призрачные линии</a>; их соотнесение с ископаемыми предположительно.</p><p><b>На практикуме.</b> Вкладка 2: дерево с интервалами узлов и дугами обмена.</p><p><b>Ограничения.</b> Даты разделения зависят от скорости мутаций и длительности поколения.</p><div class="static-quiz"><h3>Что значит, что денисовцы — генетическая линия?</h3><ol><li><b>А.</b> Их выделили по ДНК, а не по скелету <i>(верный вариант)</i><br><span class="expl">Линия установлена по геному, а не по строению скелета</span></li><li><b>Б.</b> Это группа современных людей Азии <i>(неверный вариант)</i><br><span class="expl">Денисовцы — древняя линия, сестринская неандертальцам</span></li><li><b>В.</b> Это поздние потомки европейских неандертальцев <i>(неверный вариант)</i><br><span class="expl">Это сестринские линии с общей предковой популяцией</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/ajpa.22902">Wood B., Boyle E.K. Hominin taxic diversity: fact or fantasy? Am J Phys Anthropol 2016; 159(S61): S37–S78</a></li><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1038/s41467-025-60140-6">Jacobs Z. et al. Pleistocene chronology and history of hominins and fauna at Denisova Cave. Nat Commun 2025; 16: 4738</a></li><li><a href="https://doi.org/10.1038/s41586-018-0455-x">Slon V. et al. The genome of the offspring of a Neanderthal mother and a Denisovan father. Nature 2018; 561: 113–116</a></li><li><a href="https://doi.org/10.1126/science.aef8874">Zhang Y. et al. Recovering signatures of archaic hominin introgression using ancestral recombination graphs. Science 2026; 393: eaef8874</a></li><li><a href="https://doi.org/10.1016/j.cell.2025.05.040">Fu Q. et al. Denisovan mitochondrial DNA from dental calculus of the &gt;146,000-year-old Harbin cranium. Cell 2025; 188: 3919–3926</a></li></ul><p>Схема по данным обзора, упрощённая · интервалы узлов — оценки моделей.</p></details></article><article class="card print-unit" id="ns-admixture"><div class="eyebrow">Происхождение и смешение · шаг 14 из 37</div><h2>Смешение и интрогрессия</h2><p class="lead">Смешение — событие в истории популяций; интрогрессия — его след: участки генома одной линии в генофонде другой.</p><div class="note"><strong>Что показывает схема.</strong> Пара хромосом и архаичные участки при четырёх значениях времени с показателем средней длины</div><p><a href="#ns-g-S16-T36">Смешение популяций</a> — образование потомства между ранее обособленными популяциями. <a href="#ns-g-S16-T37">Интрогрессия</a> — включение генетического материала одной линии в генофонд другой через смешение и последующие скрещивания. У гибрида первого поколения одна хромосома каждой пары целиком от одного источника; в следующих поколениях рекомбинация дробит участки, поэтому их средняя длина L (в сантиморганах) убывает со временем. Через 100 поколений L = 1 сМ, через 500 — 0,2 сМ, через 2000 — 0,05 сМ. Обратный расчёт по измеренной длине участков даёт время смешения.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-archaic-lineages">«Неандертальцы и денисовцы как генетические линии»</a>; вспомнить <a href="seminar-15-route.html#introgression">семинар 15: «Интрогрессия»</a></p><details><summary>Формула и расчёт</summary><p>L = 100/t, где L — средняя длина участка в <a href="#ns-g-S16-T76">сантиморганах</a>, t — число поколений после смешения (учебная модель: длины распределены экспоненциально, примесь мала, отбор не учитывается).</p></details><p>У современных неафриканцев около 2 % генома отнесено к неандертальскому происхождению; оценка зависит от референсного генома и метода. У коренных популяций Океании к востоку от линии Уоллеса заметна доля денисовского происхождения. Доля в одном геноме не равна неандертальскому вкладу во всё человечество: разные люди несут разные участки. Геном нельзя представить неизменной смесью процентов «видов»: рекомбинация дробила участки, их частоты менялись, часть утрачена. <a href="#ns-g-S16-T38">Локальное происхождение участка</a> — оценённое происхождение конкретного участка относительно выбранных референсных популяций.</p><p><b>На практикуме.</b> Вкладка 2: длина унаследованных участков при трёх значениях времени.</p><p><b>Ограничения.</b> Формула не учитывает отбор против архаичных участков и повторные смешения.</p><div class="static-quiz"><h3>Почему длина унаследованных участков позволяет датировать смешение?</h3><ol><li><b>А.</b> Архаичные участки длиннее остальных <i>(неверный вариант)</i><br><span class="expl">Длина участков зависит от времени, а не от источника</span></li><li><b>Б.</b> Рекомбинация дробит их каждое поколение <i>(верный вариант)</i><br><span class="expl">Чем больше поколений прошло, тем короче участки</span></li><li><b>В.</b> Отбор укорачивает участки с течением времени <i>(неверный вариант)</i><br><span class="expl">Укорачивает рекомбинация; отбор меняет частоту участков</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1126/science.adq3010">Iasi L.N.M. et al. Neanderthal ancestry through time: insights from genomes of ancient and present-day humans. Science 2024; 386: eadq3010</a></li><li><a href="https://doi.org/10.1186/s13059-025-03502-z">Liang S.-A. et al. A refined analysis of Neanderthal-introgressed sequences in modern humans with a complete reference genome. Genome Biol 2025; 26: 32</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Расчёт по модели · t — условные значения; доли — оценки для названных выборок.</p></details></article><article class="card print-unit" id="ns-locus-vs-population"><div class="eyebrow">Происхождение и смешение · шаг 15 из 37</div><h2>История участка и история популяции — не одно и то же</h2><p class="lead">Один участок генома, сближающий две популяции сильнее остальных, не меняет всей истории популяций: у участка своя генеалогия.</p><div class="note"><strong>Что показывает схема.</strong> Три панели генеалогии участка в трубках популяций и полосы длины участка</div><p>Причин может быть три. <a href="#ns-g-S16-T39">Неполная сортировка линий</a>: копии участка разошлись ещё в предковой популяции, и общие у двух популяций варианты унаследованы от неё; общий участок короткий, а его копии разошлись раньше разделения популяций. Интрогрессия: участок пришёл при смешении; он длиннее, а копии разошлись позже разделения популяций. Отбор на этом участке: вариант стал частым, и вокруг него сохраняется протяжённый общий <a href="#ns-g-S16-T40">гаплотип</a> — набор вариантов, наследуемых вместе на одной хромосоме. Отбор может сочетаться с интрогрессией; поэтому длина участка сама по себе не отличает отбор от недавнего смешения.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-admixture">«Смешение и интрогрессия»</a>; вспомнить <a href="seminar-15-route.html#ils">семинар 15: «Неполная сортировка линий»</a> и <a href="seminar-15-route.html#ils-vs-introgression">семинар 15: «Как различают неполную сортировку и интрогрессию»</a></p><p>Различают по длине общего участка, по времени расхождения его копий и по признакам отбора. Дерево популяций строят по многим участкам; отклонение одного — повод проверить причину, а не перестраивать дерево. Предполагают, что митохондриальная ДНК и Y-хромосома поздних неандертальцев были замещены копиями, родственными Homo sapiens, после раннего потока генов из Африки, — так история отдельного участка может разойтись с историей популяции.</p><p><b>На практикуме.</b> Вкладка 2, «Найти причину» (случай II).</p><p><b>Ограничения.</b> При малом числе участков доли разных генеалогий колеблются случайно.</p><div class="static-quiz"><h3>Какой признак указывает на интрогрессию, а не на неполную сортировку?</h3><ol><li><b>А.</b> Короткий общий участок с древним расхождением копий <i>(неверный вариант)</i><br><span class="expl">Так выглядит неполная сортировка линий</span></li><li><b>Б.</b> Общий участок найден у одной популяции <i>(неверный вариант)</i><br><span class="expl">Для вывода нужны обе популяции и архаичный геном</span></li><li><b>В.</b> Длинный общий участок с поздним расхождением копий <i>(верный вариант)</i><br><span class="expl">Рекомбинация ещё не успела его раздробить</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-023-00643-4">Peyrégne S., Slon V., Kelso J. More than a decade of genetic research on the Denisovans. Nat Rev Genet 2024; 25: 83–103</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Схема качественная · три причины условно разведены.</p></details></article><article class="card print-unit" id="ns-weak-stem"><div class="eyebrow">Происхождение и смешение · шаг 16 из 37</div><h2>Слабоструктурированный ствол: модель вместо одного предка</h2><p class="lead">Две модели структурированного происхождения по-разному описывают предков Homo sapiens; данные пока не позволяют окончательно выбрать между ними.</p><div class="note"><strong>Что показывает схема.</strong> Две схемы трубок популяций рядом и таблица наблюдений</div><p>По геномам 290 человек из южной, восточной и западной Африки и Евразии сравнили несколько моделей. Модель одной неструктурированной популяции описала данные плохо. Лучше описали модели <a href="#ns-g-S16-T41">слабоструктурированного ствола</a>: две или более предковые популяции более миллиона лет оставались связаны умеренным потоком генов, а не были изолированы; в одной из лучших моделей они сливались в разных долях около 120 и около 100 тыс. лет назад. На эту раннюю структуру приходится лишь 1–4 % различий между современными популяциями. Самое раннее расхождение современных популяций — около 135–110 тыс. лет назад. Другая модель (шаг «Предки современного человека — две популяции, а не одна») описывает две популяции, разошедшиеся около 1,5 млн лет назад и слившиеся около 300 тыс. лет назад в соотношении около 80 : 20.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-structured-origin">«Структурированные предковые популяции»</a>; вспомнить <a href="seminar-13-route.html#deep-structure">семинар 13: «Предки современного человека — две популяции, а не одна»</a></p><p>Обе модели отвергают одну неструктурированную предковую популяцию и объясняют следы в геномах, прежде приписанные смешению с неизвестной древней линией в Африке. Различаются они допущением о потоке генов между предковыми популяциями: постоянный обмен — или долгое разделение и слияние. Предсказание первой модели: ископаемые сосуществовавших предковых популяций должны быть сходны и генетически, и морфологически.</p><p><b>Как это узнали.</b> Сравнили, насколько каждая модель воспроизводит сцепление и разнообразие вариантов в геномах разных популяций, и проверили лучшие модели по статистикам, не использованным при подборе.</p><p><b>Граница вывода.</b> Авторы подчёркивают, что любая модель может быть неверно задана; более сложные модели, включая слабую структуру вместе с древней примесью, не исключены. Спор не закрыт.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 2.</p><div class="static-quiz"><h3>Чем модель слабоструктурированного ствола отличается от модели слияния двух давно разделённых популяций?</h3><ol><li><b>А.</b> Предковые популяции постоянно обменивались генами <i>(верный вариант)</i><br><span class="expl">В ней нет долгой изоляции перед слиянием</span></li><li><b>Б.</b> В ней всего одна предковая популяция <i>(неверный вариант)</i><br><span class="expl">Предковых популяций две или больше</span></li><li><b>В.</b> Она требует древней примеси неизвестного вида <i>(неверный вариант)</i><br><span class="expl">Наоборот: она объясняет эти следы без такой примеси</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-023-06055-y">Ragsdale A.P. et al. A weakly structured stem for human origins in Africa. Nature 2023; 617: 755–763</a></li></ul><p>Схема по данным работы, упрощённая · даты — оценки моделей.</p></details></article><article class="card print-unit" id="ns-admixture-timing"><div class="eyebrow">Происхождение и смешение · шаг 17 из 37</div><h2>Когда предки неафриканцев смешивались с неандертальцами</h2><p class="lead">Основная часть неандертальского происхождения у неафриканцев восходит к одному продолжительному периоду смешения, а не к многим разрозненным эпизодам.</p><div class="note"><strong>Что показывает схема.</strong> Шкала 60–40 тыс. лет с интервалом смешения и точками древних людей с длинами участков</div><p>По геномам 59 древних людей, живших от 45 до 2,2 тыс. лет назад, и 275 современных людей изучили распределение неандертальских участков. Ковариация неандертальского происхождения вдоль генома и длины участков показали один продолжительный период смешения с общими предками всех неафриканцев около 50,5–43,5 тыс. лет назад: середина около 47 тыс. лет назад, длительность около 7 тыс. лет. Неандертальские участки у разных древних людей часто лежат в одних и тех же местах генома — это согласуется с общим событием, а не с независимыми смешениями.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-admixture">«Смешение и интрогрессия»</a></p><p>Следствие: основной выход предков неафриканцев из Африки произошёл не позже 43,5 тыс. лет назад. Большая часть отбора — и в пользу неандертальских вариантов, и против них — пришлась примерно на первые 100 поколений после смешения: недостаток участков в функционально важных областях виден уже у самых ранних людей выборки.</p><p><b>Как это узнали.</b> У людей, живших в разное время, сравнили длины неандертальских участков: чем раньше после смешения жил человек, тем длиннее участки.</p><p><b>Граница вывода.</b> Модель продолжительного смешения сравнивали с моделью однократного события; более мелкие поздние эпизоды смешения у отдельных групп не исключены. Годы получены через длительность поколения — допущение.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 2 (засечки на шкале времени).</p><div class="static-quiz"><h3>Почему у людей, живших раньше, неандертальские участки длиннее?</h3><ol><li><b>А.</b> Они получили больше неандертальских участков <i>(неверный вариант)</i><br><span class="expl">Длина и доля участков — разные величины</span></li><li><b>Б.</b> После смешения прошло меньше поколений <i>(верный вариант)</i><br><span class="expl">Рекомбинация успела раздробить их меньше</span></li><li><b>В.</b> У них была другая скорость рекомбинации <i>(неверный вариант)</i><br><span class="expl">Скорость рекомбинации считают одинаковой; различается время</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.adq3010">Iasi L.N.M. et al. Neanderthal ancestry through time: insights from genomes of ancient and present-day humans. Science 2024; 386: eadq3010</a></li></ul><p>Схема по данным работы, упрощённая · интервал — оценка модели.</p></details></article><article class="card print-unit" id="ns-sex-bias"><div class="eyebrow">Происхождение и смешение · шаг 18 из 37</div><h2>Смешение было неравным по полу</h2><p class="lead">На X-хромосомах современных людей неандертальских участков мало; проверка в обратном направлении указывает не на несовместимость, а на неравные по полу скрещивания.</p><div class="note"><strong>Что показывает схема.</strong> Столбики отношения X к аутосомам: ожидание, предел и наблюдение</div><p>В геноме алтайского неандертальца нашли участки, полученные от ранних Homo sapiens. На его X-хромосомах доля таких участков в 1,62 раза выше, чем на аутосомах. Если бы неандертальские участки на X-хромосомах людей удалял отбор из-за несовместимости X-хромосом двух линий, недостаток ожидался бы в обоих направлениях. Избыток на X у неандертальца указывает, что в этих скрещиваниях преобладали пары «мужчина-неандерталец — женщина Homo sapiens». У женщины две X-хромосомы, у мужчины одна; если бы между группами переходили только женщины, отношение не превысило бы 4/3. Наблюдаемое 1,62 выше этого предела, поэтому авторы считают более простым объяснением предпочтение при выборе партнёра.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-admixture">«Смешение и интрогрессия»</a>, шаг <a href="#ns-locus-vs-population">«История участка и история популяции — не одно и то же»</a></p><p>Пример показывает, как одно наблюдение (недостаток неандертальских участков на X у людей) допускает два объяснения и как обратное направление обмена позволяет их различить.</p><p><b>Как это узнали.</b> Сравнили долю участков Homo sapiens на X-хромосомах и аутосомах у трёх неандертальцев высокого качества прочтения; у всех трёх отношение больше 1.</p><p><b>Граница вывода.</b> Вывод модельный, по небольшому числу геномов; он описывает соотношение в популяциях, а не поведение конкретных людей.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 2 (дуга «ранние Homo sapiens → неандертальцы»).</p><div class="static-quiz"><h3>Почему избыток участков Homo sapiens на X у неандертальца говорит против несовместимости X-хромосом?</h3><ol><li><b>А.</b> У неандертальцев X-хромосомы не прочитаны <i>(неверный вариант)</i><br><span class="expl">Были; сравнивали X-хромосомы и аутосомы</span></li><li><b>Б.</b> Несовместимость всегда даёт избыток на X <i>(неверный вариант)</i><br><span class="expl">Несовместимость удаляла бы участки, создавая недостаток</span></li><li><b>В.</b> Несовместимость дала бы недостаток с обеих сторон <i>(верный вариант)</i><br><span class="expl">А у неандертальца наблюдается избыток</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-16.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aea6774">Platt A., Harris D.N., Tishkoff S.A. Interbreeding between Neanderthals and modern humans was strongly sex biased. Science 2026; 391: 922–925</a></li></ul><p>Схема по данным работы, упрощённая · 4/3 — предел расчёта, 1,62 — измерено.</p></details></article><article class="card print-unit" id="ns-five-lines"><div class="eyebrow">Адаптация: как её доказывают · шаг 19 из 37</div><h2>Пять линий доказательств адаптации</h2><p class="lead">Высокая частота варианта в определённой среде — ещё не доказательство <a href="#ns-g-S16-T42">адаптации</a>: её создают и дрейф, и эффект основателя, и смешение. Адаптивное объяснение собирают из пяти разных линий данных.</p><div class="note"><strong>Что показывает схема.</strong> Пять карточек и шкала уровня из пяти делений со словами для четырёх сочетаний</div><p>Пять линий: (1) вариант или <a href="#ns-g-S16-T40">гаплотип</a> надёжно установлен; (2) <a href="#ns-g-S16-T43">ассоциация</a> — воспроизводимая статистическая связь варианта с признаком; (3) функциональные данные — как вариант меняет работу гена или белка; (4) <a href="#ns-g-S16-T44">след отбора</a> — отклонение частот и строения гаплотипов от явно заданной <a href="#ns-g-S16-T45">нейтрально-демографической модели</a>, учитывающей историю численности, расселение и смешение; (5) правдоподобная связь с исторической средой. Каждая линия отвечает на свой вопрос: ассоциация — связан ли вариант с признаком; функция — каким путём; след отбора — повышал ли вариант приспособленность; среда — при каких условиях.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-13-route.html#adaptation">семинар 13: «Адаптация и как её доказывают»</a> и <a href="seminar-13-route.html#polymorphism">семинар 13: «Как сохраняется полиморфизм»</a></p><p>Без следа отбора адаптация не показана, даже если известны и связь с признаком, и функция. Без функции и связи с признаком неизвестно, через какой признак действовал отбор. Без исторической среды остаётся интерпретацией, почему отбор действовал. Отсутствие одной линии снижает обоснованность, но не опровергает гипотезу. Даже полный набор редко доказывает единственную причину: современный эффект мог отличаться от исторического, а вариант — влиять на несколько признаков. Если структура популяций не учтена, сходное отклонение ошибочно приписывают отбору.</p><p><b>На практикуме.</b> Вкладка 3: конструктор «убрать карточку»; «Найти причину» (случай III).</p><p><b>Ограничения.</b> Уровни обоснованности на практикуме — учебное правило, а не статистическая мера.</p><div class="static-quiz"><h3>Вариант связан с признаком, функция известна, но следа отбора нет. Что можно сказать?</h3><ol><li><b>А.</b> Связь показана, адаптация — нет <i>(верный вариант)</i><br><span class="expl">Без следа отбора повышение приспособленности не показано</span></li><li><b>Б.</b> Адаптация доказана функцией варианта <i>(неверный вариант)</i><br><span class="expl">Функция объясняет механизм, но не историю отбора</span></li><li><b>В.</b> Гипотеза опровергнута <i>(неверный вариант)</i><br><span class="expl">Отсутствие одной линии снижает обоснованность, но не опровергает</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nature13408">Huerta-Sánchez E. et al. Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 2014; 512: 194–197</a></li><li><a href="https://doi.org/10.1038/s41586-024-07911-1">Bolognini D. et al. Recurrent evolution and selection shape structural diversity at the amylase locus. Nature 2024; 634: 617–625</a></li></ul><p>Расчёт по модели · правило уровней — учебное.</p></details></article><article class="card print-unit" id="ns-adaptive-introgression"><div class="eyebrow">Адаптация: как её доказывают · шаг 20 из 37</div><h2>Адаптивная интрогрессия: вариант гена EPAS1 у тибетцев</h2><p class="lead">Большинство участков, полученных при смешении, не дало преимущества; некоторые оказались полезны в новой среде, и их частота выросла отбором — это адаптивная интрогрессия.</p><div class="note"><strong>Что показывает схема.</strong> Пять карточек EPAS1 и мини-дерево гаплотипа</div><p><a href="#ns-g-S16-T46">Адаптивная интрогрессия</a> — повышение частоты интрогрессированного варианта под действием положительного отбора. Самый изученный пример — гаплотип в области гена EPAS1 у тибетцев. EPAS1 кодирует белок, участвующий в ответе клеток на нехватку кислорода. На высоте более 4000 м давление кислорода примерно на 40 % ниже, чем на уровне моря; у тибетцев на высоте гемоглобин повышается меньше, и носители производного аллеля EPAS1 имеют более низкий гемоглобин. Область EPAS1 даёт самый сильный сигнал положительного отбора у тибетцев. Её гаплотип необычен: при чтении области у 40 тибетцев и 40 ханьцев его нашли у тибетцев и у денисовца, а у ханьцев — очень редко; по длине и распространению гаплотипа неполная сортировка линий маловероятна.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-admixture">«Смешение и интрогрессия»</a>, шаг <a href="#ns-five-lines">«Пять линий доказательств адаптации»</a></p><p>Здесь согласуются все пять линий: архаичное происхождение участка, связь с уровнем гемоглобина на высоте, известная роль гена в ответе на гипоксию, след отбора и среда высокогорья. Ограничение остаётся: роль гена не равна установленному эффекту каждого изменения в гаплотипе — какие варианты действуют, уточняется. Другие предполагаемые случаи обоснованы слабее.</p><p><b>На практикуме.</b> Вкладка 3, предустановка «EPAS1».</p><p><b>Ограничения.</b> Это не единственный путь адаптации к высокогорью: у других популяций высокогорья — другие варианты.</p><p><b>Дальше в курсе «Молекулярная биология».</b> Почему HIF-α накапливается при недостатке кислорода — <a href="https://edu.mazunin.science/seminar-10-route.html#hif">«Молекулярная биология», семинар 10</a>; как программы HIF зависят от изоформы и ткани — <a href="https://edu.mazunin.science/seminar-10-route.html#hif-context">«Молекулярная биология», семинар 10</a>.</p><div class="static-quiz"><h3>Почему сходство гаплотипа тибетцев с денисовским объясняют интрогрессией, а не неполной сортировкой?</h3><ol><li><b>А.</b> Тибетцы живут близко к Денисовой пещере <i>(неверный вариант)</i><br><span class="expl">Место жизни не различает две причины; различают длина и распространение</span></li><li><b>Б.</b> Гаплотип длинный и редок у других популяций <i>(верный вариант)</i><br><span class="expl">Так выглядит недавно полученный участок</span></li><li><b>В.</b> Ген EPAS1 участвует в ответе клетки на гипоксию <i>(неверный вариант)</i><br><span class="expl">Функция говорит о механизме, а не о происхождении участка</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature13408">Huerta-Sánchez E. et al. Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 2014; 512: 194–197</a></li></ul><p>Схема по данным работы, упрощённая · пять линий названы.</p></details></article><article class="card print-unit" id="ns-gene-culture"><div class="eyebrow">Адаптация: как её доказывают · шаг 21 из 37</div><h2>Генно-культурная коэволюция: молоко и крахмал</h2><p class="lead">Хозяйственная практика людей меняет среду, в которой действует отбор на их гены, — это генно-культурная коэволюция.</p><div class="note"><strong>Что показывает схема.</strong> Хромосомы с вариантами на разных гаплотипах и шкала «практика — рост частоты»</div><p><a href="#ns-g-S16-T47">Генно-культурная коэволюция</a> — изменение частот вариантов под действием отбора, среду которого создаёт культурная практика. У большинства людей синтез лактазы — фермента, расщепляющего молочный сахар, — снижается после окончания грудного вскармливания. <a href="#ns-g-S16-T48">Персистенция лактазы</a> — сохранение синтеза у взрослых; она связана с вариантами регуляторного участка перед геном LCT. В Европе распространён один вариант, а в Восточной Африке найдены три других: у 470 жителей Танзании, Кении и Судана они связаны с персистенцией, в эксперименте усиливают транскрипцию гена и возникли на разных гаплотипах — независимо от европейского и друг от друга. Вокруг одного из них сохранился протяжённый гаплотип — след быстрого отбора за последние несколько тысяч лет (оценка s = 0,04–0,097). Второй пример — <a href="#ns-g-S16-T49">вариация числа копий</a> гена амилазы слюны: в популяциях с традиционно крахмалистым рационом копий в среднем больше, и число копий связано с количеством фермента в слюне.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-five-lines">«Пять линий доказательств адаптации»</a>; вспомнить <a href="seminar-14-route.html#duplication">семинар 14: «Дупликация: как возникает копия гена»</a></p><p>Схожий признак, возникший независимо в разных популяциях при одинаковой культурной практике, — конвергенция. Древняя ДНК показывает, что культурная практика могла опережать рост частоты варианта: в Европе молоко использовали за тысячелетия до быстрого роста частоты европейского варианта. Поэтому связь отбора с конкретной практикой — историческая интерпретация, которую проверяют датировками.</p><p><b>На практикуме.</b> Вкладка 3, предустановка «амилаза».</p><p><b>Ограничения.</b> Оценки времени и силы отбора — модельные, с широкими интервалами.</p><div class="static-quiz"><h3>Что показывают три африканских варианта персистенции лактазы?</h3><ol><li><b>А.</b> Все люди с персистенцией — потомки одной популяции <i>(неверный вариант)</i><br><span class="expl">Варианты разного происхождения: это конвергенция</span></li><li><b>Б.</b> Персистенция не наследуется <i>(неверный вариант)</i><br><span class="expl">Связана с наследуемыми вариантами регуляторного участка</span></li><li><b>В.</b> Сходный признак возник независимо несколько раз <i>(верный вариант)</i><br><span class="expl">Варианты возникли на разных гаплотипах</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/ng2123">Perry G.H. et al. Diet and the evolution of human amylase gene copy number variation. Nat Genet 2007; 39: 1256–1260</a></li><li><a href="https://doi.org/10.1038/ng1946">Tishkoff S.A. et al. Convergent adaptation of human lactase persistence in Africa and Europe. Nat Genet 2007; 39: 31–40</a></li><li><a href="https://doi.org/10.1038/s41588-026-02562-6">MemarMoshrefi D., Johnson O.L., Huber C.D. Insights into human adaptation from ancient DNA. Nat Genet 2026; 58: 1005–1018</a></li></ul><p>Схема по данным работ, упрощённая · s — оценка модели.</p></details></article><article class="card print-unit" id="ns-ongoing"><div class="eyebrow">Адаптация: как её доказывают · шаг 22 из 37</div><h2>Эволюция человека продолжается</h2><p class="lead">Мутации, дрейф, миграция и отбор действуют и сейчас; культура и медицина не отменяют отбор, а меняют его условия.</p><div class="note"><strong>Что показывает схема.</strong> Четыре процесса и стрелка «культура и медицина меняют среду отбора»</div><p>Мутации продолжают создавать варианты в каждом поколении; миграции и смешение меняют их распределение; дрейф особенно заметен в малых популяциях; отбор действует через различия в выживании и числе потомков. Земледелие, скотоводство, плотность поселений и новые инфекции создавали новые среды отбора. Медицина снижает последствия многих вариантов, но меняет возраст выживания, число детей и взаимодействие с возбудителями. <a href="#ns-g-S16-T50">Полигенный признак</a> — признак, на который влияют многие варианты с малым эффектом; для таких признаков недавнюю адаптацию особенно трудно отделить от истории численности, смешения и структуры популяций.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-13-route.html#ancient-selection">семинар 13: «Сотни случаев направленного отбора — и лишь малая доля изменений частот»</a> (сверх программы) и <a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a></p><p>Древняя ДНК позволяет видеть изменение частот во времени и находить участки с направленным отбором за последние тысячелетия; но направленный отбор объясняет лишь небольшую долю изменений частот, остальное — дрейф, переселения и смешение. Заявления о быстрой эволюции сложных признаков требуют особенно строгих данных: показатели полигенных признаков оценены у современных людей, и их связь с признаками, на которые отбор действовал в прошлом, не установлена.</p><p><b>На практикуме.</b> Вкладка 3.</p><p><b>Ограничения.</b> Ложный сигнал отбора возможен, если не учтены дрейф, структура популяций и смешение.</p><div class="static-quiz"><h3>Почему медицина не останавливает эволюцию человека?</h3><ol><li><b>А.</b> Меняет условия отбора, но мутации и дрейф идут <i>(верный вариант)</i><br><span class="expl">Меняются среда и сила отбора, а не наличие эволюционных процессов</span></li><li><b>Б.</b> Медицина полностью отменяет отбор <i>(неверный вариант)</i><br><span class="expl">Различия в выживании и числе детей сохраняются</span></li><li><b>В.</b> Эволюция теперь идёт только в малых изолированных популяциях <i>(неверный вариант)</i><br><span class="expl">Дрейф там сильнее, но мутации и отбор действуют везде</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41588-026-02562-6">MemarMoshrefi D., Johnson O.L., Huber C.D. Insights into human adaptation from ancient DNA. Nat Genet 2026; 58: 1005–1018</a></li></ul><p>Схема качественная · факторы перечислены.</p></details></article><article class="card print-unit" id="ns-limits-origin"><div class="eyebrow">Адаптация: как её доказывают · шаг 23 из 37</div><h2>Чего нельзя вывести о человеке из его происхождения</h2><p class="lead">Происхождение участков генома — вероятностное описание родства с выбранными популяциями; из него нельзя вывести свойства, способности или риск конкретного человека.</p><div class="note"><strong>Что показывает схема.</strong> Поле популяции с частотой варианта и один человек с собственным генотипом</div><p>Популяционная структура реальна и важна для медицинской генетики: частоты вариантов, связанных с болезнями, различаются между популяциями из-за разной истории численности, расселения, смешения и среды. Но популяции связаны общим происхождением и многократным смешением: по 377 участкам генома у 1056 человек из 52 популяций различия между людьми внутри популяций составили 93–95 % генетической изменчивости, а различия между крупными географическими группами — лишь 3–5 %; категории, используемые в обществе и в административных данных, описывают генетическое родство лишь приблизительно. Частота варианта в популяции описывает популяцию, а не человека: риск конкретного человека определяется его собственным генотипом, средой и историей, а не происхождением его предков. Популяции не ранжируются по «развитости»: все современные линии одинаково долго эволюционировали от общего предка.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-dispersal">«Расселение из Африки»</a>, шаг <a href="#ns-admixture">«Смешение и интрогрессия»</a>, шаг <a href="#ns-ongoing">«Эволюция человека продолжается»</a></p><p>Доля неандертальского происхождения — оценка для названной выборки и метода, а не свойство, задающее признаки. Эволюционное объяснение признака не делает его оптимальным и не оправдывает социальных различий: эволюция — изменение частот вариантов, а не движение к цели.</p><p><b>На практикуме.</b> Вкладки 2–3; итоговая задача.</p><p><b>Ограничения.</b> Генетическое происхождение зависит от выборки референсов, масштаба и времени анализа.</p><div class="static-quiz"><h3>Вариант встречается у 30 % популяции. Что это говорит о конкретном человеке из неё?</h3><ol><li><b>А.</b> Он точно носит этот вариант <i>(неверный вариант)</i><br><span class="expl">Частота 30 % не говорит, есть ли вариант у конкретного человека; это определяет анализ его генотипа</span></li><li><b>Б.</b> Ничего определённого: нужен его генотип <i>(верный вариант)</i><br><span class="expl">Частота описывает популяцию, а не человека</span></li><li><b>В.</b> Он генетически отличается от людей других популяций <i>(неверный вариант)</i><br><span class="expl">Большая часть изменчив
