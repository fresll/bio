ости — между людьми внутри популяций</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1186/s13059-025-03502-z">Liang S.-A. et al. A refined analysis of Neanderthal-introgressed sequences in modern humans with a complete reference genome. Genome Biol 2025; 26: 32</a></li><li><a href="https://doi.org/10.1038/s41576-020-00305-9">Benton M.L. et al. The influence of evolutionary history on human health and disease. Nat Rev Genet 2021; 22: 269–283</a></li><li><a href="https://doi.org/10.1126/science.1078311">Rosenberg N.A. et al. Genetic structure of human populations. Science 2002; 298: 2381–2385</a></li></ul><p>Схема качественная · распределение изменчивости условно.</p></details></article><article class="card print-unit" id="ns-amylase-ancient"><div class="eyebrow">Адаптация: как её доказывают · шаг 24 из 37</div><h2>Амилаза: дупликация намного старше земледелия</h2><p class="lead">Число копий гена амилазы слюны начало меняться задолго до земледелия; у земледельцев менялись частоты уже существовавших вариантов.</p><div class="note"><strong>Что показывает схема.</strong> Логарифмическая шкала локуса амилазы с засечками двух работ</div><p>Локус амилазы собран из нескольких почти одинаковых длинных повторов, поэтому его строение прочитали длинными прочтениями. Все копии генов амилазы человека относятся к трём типам: два вида генов амилазы поджелудочной железы и ген амилазы слюны. Распространённый гаплотип с тремя копиями гена амилазы слюны, по оценке, возник около 800 тыс. лет назад — раньше расхождения предков человека и неандертальцев; повышенное число копий найдено в геномах трёх неандертальцев и одного денисовца. Из этого гаплотипа повторные неравные рекомбинации породили множество вариантов. По 68 древним геномам частота гаплотипов с более чем тремя копиями у земледельцев Европы выросла за последние 4 тыс. лет.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-gene-culture">«Генно-культурная коэволюция: молоко и крахмал»</a></p><p>Вывод: дупликации гена — давнее наследие; рост частоты многокопийных гаплотипов у земледельцев авторы допускают как ответ на крахмалистую пищу, но не исключают и нейтральное объяснение.</p><p><b>Как это узнали.</b> Собрали гаплотипы локуса у многих людей, построили деревья копий генов и оценили время их возникновения; число копий у древних людей определили по их геномам.</p><p><b>Граница вывода.</b> Оценки времени зависят от калибровки и метода. Другая работа (шаг «Амилаза: отбор за последние 12 тысяч лет») в геномах трёх неандертальцев и денисовца высокого качества (из них общий с этой работой — один неандерталец) находит одну копию и относит исходную дупликацию к времени более 279 тыс. лет назад. Обе работы согласны, что дупликация старше земледелия, но расходятся в том, была ли она уже у общих предков с неандертальцами и денисовцами.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 3: шкала времени локуса амилазы.</p><div class="static-quiz"><h3>Что происходило в локусе амилазы у земледельцев, по данным этой работы?</h3><ol><li><b>А.</b> Возникла первая дупликация <i>(неверный вариант)</i><br><span class="expl">По этой оценке, дупликация намного древнее</span></li><li><b>Б.</b> Ничего: частоты не менялись <i>(неверный вариант)</i><br><span class="expl">Частота гаплотипов с большим числом копий выросла</span></li><li><b>В.</b> Росла частота старых гаплотипов <i>(верный вариант)</i><br><span class="expl">Многокопийные гаплотипы стали чаще; причина — интерпретация</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.adn0609">Yilmaz F. et al. Reconstruction of the human amylase locus reveals ancient duplications seeding modern-day variation. Science 2024; 386: eadn0609</a></li></ul><p>Схема по данным работы, упрощённая · даты — оценки с интервалами.</p></details></article><article class="card print-unit" id="ns-amylase-selection"><div class="eyebrow">Адаптация: как её доказывают · шаг 25 из 37</div><h2>Амилаза: отбор за последние 12 тысяч лет</h2><p class="lead">Гаплотипы с дополнительными копиями генов амилазы стали чаще в Западной Евразии быстрее, чем позволяет случайный дрейф.</p><div class="note"><strong>Что показывает схема.</strong> Точки частоты по тысячелетиям и коридор модели без отбора</div><p>Построили структурные гаплотипы локуса амилазы у тысяч людей и нашли 28 различных вариантов строения. У земледельческих популяций копий генов амилазы в среднем больше, чем у рыболовов, охотников и скотоводов. По 533 древним геномам частота гаплотипов с дупликациями в Западной Евразии быстро росла последние 12 тыс. лет. Модель с постоянным отбором дала коэффициент отбора около 0,02 за поколение; моделирование без отбора не воспроизводило наблюдаемый рост. У трёх неандертальцев и денисовца в этой работе — предковое состояние с одной копией гена амилазы слюны; исходную дупликацию авторы относят к времени более 279 тыс. лет назад — до расселения из Африки.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-gene-culture">«Генно-культурная коэволюция: молоко и крахмал»</a>, шаг <a href="#ns-amylase-ancient">«Амилаза: дупликация намного старше земледелия»</a></p><p>Работа даёт сильную линию «след отбора» для локуса амилазы; связь отбора именно с крахмалистой пищей земледельцев остаётся исторической интерпретацией.</p><p><b>Как это узнали.</b> Сравнили частоты гаплотипов у людей, живших в разные тысячелетия, с частотами, которые даёт модель без отбора.</p><p><b>Граница вывода.</b> Обе работы об амилазе согласны, что частота многокопийных гаплотипов у земледельцев росла и что дупликация старше земледелия; было ли повышенное число копий уже у неандертальцев и денисовцев (по одной работе — да, около 800 тыс. лет назад; по другой — нет, исходная дупликация более 279 тыс. лет назад), они оценивают по-разному. Расхождение не разрешено.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 3: шкала времени локуса амилазы.</p><div class="static-quiz"><h3>Что даёт эта работа для доказательства адаптации?</h3><ol><li><b>А.</b> След отбора: рост частоты быстрее, чем при дрейфе <i>(верный вариант)</i><br><span class="expl">Это линия «след отбора» из пяти</span></li><li><b>Б.</b> Доказательство, что причиной было земледелие <i>(неверный вариант)</i><br><span class="expl">Связь с земледелием остаётся интерпретацией</span></li><li><b>В.</b> Окончательный возраст дупликации <i>(неверный вариант)</i><br><span class="expl">Оценки двух работ расходятся</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-024-07911-1">Bolognini D. et al. Recurrent evolution and selection shape structural diversity at the amylase locus. Nature 2024; 634: 617–625</a></li></ul><p>Схема по данным работы, упрощённая · s — оценка модели.</p></details></article><article class="card print-unit" id="ns-black-death"><div class="eyebrow">Адаптация: как её доказывают · шаг 26 из 37</div><h2>Отбор в эпоху «Чёрной смерти»</h2><p class="lead">Был ли отбор на варианты генов иммунитета во время эпидемии чумы XIV века? Две группы исследователей по одним данным пришли к разным выводам; спор не закрыт.</p><div class="note"><strong>Что показывает схема.</strong> Три одинаковые карточки позиций с тремя строками и итоговой строкой «спор не закрыт»</div><p><b>Утверждение.</b> По древней ДНК людей из Лондона (до, во время и после эпидемии) и из Дании (до и после) у вариантов генов иммунитета большие изменения частот встречались чаще, чем в нейтральных участках; главный кандидат — вариант рядом с геном ERAP2. Его аллель в экспериментах на клетках влиял на ответ макрофагов на возбудителя чумы и на подавление роста бактерий. <b>Возражение.</b> Обогащение сохраняется и при случайной перестановке меток «до» и «после», то есть может быть техническим: иммунные и нейтральные участки выделяли разными реактивами и читали с разным покрытием. Частоты аллелей оценивали способом, смещающим их к 0,5; после исправления ни один из четырёх кандидатов не проходит исходных порогов; поправки на <a href="#ns-g-S16-T51">множественные сравнения</a> не было. Частота аллеля рядом с ERAP2 в Англии и Дании за последние две тысячи лет значимо не изменилась. <b>Ответ.</b> Ошибку оценки частот исправили; после выравнивания покрытия обогащение сохраняется; вариант рядом с ERAP2 остаётся первым кандидатом, хотя строгую поправку на множественные сравнения не проходит; независимые данные — рост частоты в другой выборке из Англии и связь аллеля с защитой от тяжёлой пневмонии сейчас. Авторы предлагают <a href="#ns-g-S16-T52">балансирующий отбор</a> с коротким импульсом направленного отбора.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-five-lines">«Пять линий доказательств адаптации»</a>, шаг <a href="#ns-ongoing">«Эволюция человека продолжается»</a></p><p>Позиции различаются тем, с какой нулевой моделью сравнивать изменения частот (перестановка людей между временными точками или перестановка вариантов между «иммунными» и «нейтральными»), как учитывать множественные сравнения и какой вес придавать функциональным данным.</p><p><b>Как это узнали.</b> Сравнили частоты вариантов в древней ДНК людей, живших до и после эпидемии, с ожидаемыми без отбора.</p><p><b>Граница вывода.</b> Выборки малы; функциональный эффект варианта не доказывает отбора: нужна статистика изменения частоты быстрее случайного. Спор не закрыт.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 3, панель Б: переключатель «утверждение / возражение / ответ».</p><div class="static-quiz"><h3>Почему функциональный эффект варианта не закрывает спора?</h3><ol><li><b>А.</b> Функциональных данных в работе вообще не было <i>(неверный вариант)</i><br><span class="expl">Были: эксперименты на клетках</span></li><li><b>Б.</b> Он не показывает быстрого изменения частоты <i>(верный вариант)</i><br><span class="expl">Функция и след отбора — разные линии доказательств</span></li><li><b>В.</b> Возражение отрицает связь гена с иммунитетом <i>(неверный вариант)</i><br><span class="expl">Спор — о статистике изменения частот, а не о функции гена</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-16.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-022-05349-x">Klunk J. et al. Evolution of immune genes is associated with the Black Death. Nature 2022; 611: 312–319</a></li><li><a href="https://doi.org/10.1038/s41586-024-08496-5">Barton A.R. et al. Insufficient evidence for natural selection associated with the Black Death. Nature 2025</a></li><li><a href="https://doi.org/10.1038/s41586-024-08497-4">Klunk J. et al. Reply to: Insufficient evidence for natural selection associated with the Black Death. Nature 2025</a></li></ul><p>Схема по данным работ, упрощённая · три позиции показаны одинаково.</p></details></article><article class="card print-unit" id="ns-evo-medicine"><div class="eyebrow">Эволюция в медицине · шаг 27 из 37</div><h2>Что эволюционный подход даёт медицине</h2><p class="lead">Эволюционный подход дополняет вопрос «как возникает болезнь» вопросом «почему организм уязвим» и особенно полезен там, где объект лечения сам изменяется: возбудитель, вирус, опухоль.</p><div class="note"><strong>Что показывает схема.</strong> Три поля популяции в исходном состоянии с подписями единицы и шага</div><p><a href="#ns-g-S16-T53">Эволюционная медицина</a> применяет эволюционные понятия к происхождению уязвимостей, к изменению возбудителей и клеточных популяций и к последствиям медицинских вмешательств. Эволюционное объяснение не означает, что болезнь — адаптация. Уязвимость может возникать потому, что отбор действует на возбудитель или опухолевые клетки, а не на здоровье пациента; из-за компромисса между полезным и вредным эффектом признака; из-за несоответствия современной среды условиям, в которых сложилась физиология; из-за дрейфа и истории популяции; из-за позднего проявления эффекта, когда отбор слаб. Естественный отбор повышает долю вариантов с большим числом потомков в данной среде, а не здоровье или продолжительность жизни.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-three-explanations">«Три вида объяснений: как работает, как возникло, что это значит для медицины»</a>; вспомнить <a href="seminar-12-route.html#selection">семинар 12: «Условия естественного отбора»</a></p><p>Одна и та же схема — изменчивость, различия в размножении, изменение состава — описывает отбор у бактерий в организме, у вирусных линий в популяции людей и у клеток опухоли в ткани. Различаются <a href="#ns-g-S16-T54">единица отбора</a> (клетка бактерии, вирусная линия, клон клеток), источник наследуемой изменчивости и время одного шага. Клинический пример приводится для демонстрации значения эволюционного механизма: эволюционная гипотеза не заменяет клинических испытаний.</p><p><b>На практикуме.</b> Вкладка 4: три масштаба отбора на одной модели.</p><p><b>Ограничения.</b> Формула «этот признак когда-то был полезен» без сравнительных, популяционных или функциональных данных — предположение, а не объяснение.</p><div class="static-quiz"><h3>Что общего у отбора бактерий, вирусных линий и клонов опухоли?</h3><ol><li><b>А.</b> Во всех трёх случаях отбор действует на пациента <i>(неверный вариант)</i><br><span class="expl">Отбор действует на бактерии, вирусы и клетки, а не на здоровье пациента</span></li><li><b>Б.</b> Все три вида изменений наследуются потомками пациента <i>(неверный вариант)</i><br><span class="expl">Изменения опухолевых клеток не передаются потомкам пациента</span></li><li><b>В.</b> Изменчивость, разное размножение, изменение состава <i>(верный вариант)</i><br><span class="expl">Различаются единица отбора, источник изменчивости и масштаб времени</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-00305-9">Benton M.L. et al. The influence of evolutionary history on human health and disease. Nat Rev Genet 2021; 22: 269–283</a></li></ul><p>Схема качественная · три масштаба условно приведены к одной схеме.</p></details></article><article class="card print-unit" id="ns-amr"><div class="eyebrow">Эволюция в медицине · шаг 28 из 37</div><h2>Устойчивость к антимикробным препаратам</h2><p class="lead">Препарат не создаёт устойчивость и не направляет мутации: он меняет среду отбора, в которой доля уже существующих или вновь возникших устойчивых вариантов растёт.</p><div class="note"><strong>Что показывает схема.</strong> Поле 100 значков с долей устойчивых на шагах 0, 5, 10 и без препарата</div><p><a href="#ns-g-S16-T55">Антимикробная устойчивость</a> — наследуемая способность микроорганизма размножаться при концентрации препарата, подавляющей чувствительные клетки. Её источники — мутации и приобретение генов от других микроорганизмов: <a href="#ns-g-S16-T56">горизонтальный перенос генов</a>, прежде всего с <a href="#ns-g-S16-T57">плазмидами</a> — кольцевыми молекулами ДНК, способными переходить из клетки в клетку. При действии препарата чувствительные клетки гибнут или размножаются медленнее, а устойчивые вносят всё больший вклад в следующие поколения. При исходной доле 0,001 и четырёхкратном преимуществе в размножении за поколение (условно) доля устойчивых через 5 поколений — около 0,5, через 10 — около 0,999. Без препарата устойчивость часто имеет цену, и её доля медленно снижается.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-evo-medicine">«Что эволюционный подход даёт медицине»</a>; вспомнить <a href="seminar-13-route.html#selection-modes">семинар 13: «Как отбор меняет частоты: три режима»</a> и <a href="seminar-12-route.html#hgt">семинар 12: «Горизонтальный перенос, потери, дупликации: история гена и история линии»</a></p><details><summary>Формула и расчёт</summary><p>p_t = p0·r^t / (p0·r^t + 1 − p0), где p_t — доля устойчивого варианта через t поколений, p0 — исходная доля, r — во сколько раз за поколение устойчивый вариант размножается успешнее чувствительного.</p></details><p>Устойчивость отличают от <a href="#ns-g-S16-T58">толерантности</a> — замедленной гибели популяции без повышения подавляющей концентрации — и от <a href="#ns-g-S16-T59">персистенции</a> — выживания небольшой части клеток в ненаследуемом состоянии, часто с замедлением или остановкой роста: после возобновления роста их потомки сохраняют чувствительность. Устойчивость могла существовать до лечения как редкий вариант, возникнуть во время лечения или прийти с другим <a href="#ns-g-S16-T74">штаммом</a> — генетически однородной линией того же или другого вида. Отдельная клетка не «становится» устойчивой: меняется состав популяции.</p><p><b>На практикуме.</b> Вкладка 4, масштаб «бактерии в организме»; «Найти причину» (случай IV).</p><p><b>Ограничения.</b> Модель не учитывает пространственную неоднородность, передачу между людьми и концентрацию препарата в тканях; препарат в модели условный.</p><div class="static-quiz"><h3>Почему после действия препарата устойчивых бактерий стало больше?</h3><ol><li><b>А.</b> Чувствительные гибли, устойчивые размножались <i>(верный вариант)</i><br><span class="expl">Изменился состав популяции</span></li><li><b>Б.</b> Каждая бактерия со временем сама стала устойчивой <i>(неверный вариант)</i><br><span class="expl">Устойчивость наследуется; меняется доля вариантов, а не свойства каждой клетки</span></li><li><b>В.</b> Препарат вызвал нужные мутации <i>(неверный вариант)</i><br><span class="expl">Препарат меняет среду отбора, а не создаёт нужные мутации</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1126/science.abg9868">Stracy M. et al. Minimizing treatment-induced emergence of antibiotic resistance in bacterial infections. Science 2022; 375: 889–894</a></li><li><a href="https://doi.org/10.1038/s41579-019-0196-3">Balaban N.Q. et al. Definitions and guidelines for research on antibiotic persistence. Nat Rev Microbiol 2019; 17: 441–448</a></li></ul><p>Расчёт по модели · параметры условные; препарат условный.</p></details></article><article class="card print-unit" id="ns-virus"><div class="eyebrow">Эволюция в медицине · шаг 29 из 37</div><h2>Эволюция вирусов и иммунное ускользание</h2><p class="lead">Вирусные популяции меняются быстро: их много, цикл короток, ошибки копирования часты. Иммунитет населения становится средой отбора для вирусных линий.</p><div class="note"><strong>Что показывает схема.</strong> Поле вирусных линий на шагах 0, 10, 20 и без иммунитета</div><p><a href="#ns-g-S16-T60">Антигенный дрейф</a> — постепенное накопление изменений антигенов вирусной линии, снижающих её распознавание существующим иммунитетом; это вирусологический термин, не путать с генетическим дрейфом частот. <a href="#ns-g-S16-T61">Иммунное ускользание</a> — снижение распознавания варианта иммунной системой по сравнению с прежним; обычно частичное, потому что антитела узнают несколько участков белка, а клеточный иммунитет — дополнительные. <a href="#ns-g-S16-T62">Антигенный сдвиг</a> — резкое изменение антигенных свойств вируса. У вируса гриппа A его вызывает <a href="#ns-g-S16-T63">реассортация</a> — обмен целыми сегментами генома при заражении одной клетки двумя вирусами: вирусы пандемий XX и начала XXI века несли сегменты вирусов человека и животных. У SARS-CoV-2 так называют переход к сильно изменённой линии без реассортации. При росте иммунитета населения вариант, хуже распознаваемый иммунитетом, передаётся успешнее; при r = 1,3 за цикл передачи (условно) его доля растёт с 0,01 до около 0,12 за 10 циклов и до около 0,66 за 20.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-evo-medicine">«Что эволюционный подход даёт медицине»</a>; вспомнить <a href="seminar-13-route.html#drift">семинар 13: «Генетический дрейф: случайная выборка копий»</a></p><p>Одни и те же замены в белке шипа вируса SARS-CoV-2 возникали независимо в разных линиях: периоды разнообразия многих родственных линий сменялись быстрым распространением одного варианта с преимуществом. При передаче новому человеку переходит лишь часть вариантов — <a href="#ns-g-S16-T64">узкое место при передаче</a> усиливает дрейф. Вариант, лучше размножающийся в организме, не обязательно лучше передаётся между людьми.</p><p><b>На практикуме.</b> Вкладка 4, масштаб «линии вируса».</p><p><b>Ограничения.</b> Модель не учитывает длительность инфекции, структуру контактов и различие размножения в организме и передачи между людьми.</p><div class="static-quiz"><h3>Чем антигенный дрейф отличается от генетического дрейфа?</h3><ol><li><b>А.</b> Это то же самое явление под другим названием <i>(неверный вариант)</i><br><span class="expl">Это разные понятия: одно об антигенах, другое о случайных изменениях частот</span></li><li><b>Б.</b> Это изменение антигенов вирусной линии <i>(верный вариант)</i><br><span class="expl">Генетический дрейф — случайное изменение частот аллелей</span></li><li><b>В.</b> Это обмен сегментами генома <i>(неверный вариант)</i><br><span class="expl">Обмен сегментами — реассортация, основа антигенного сдвига</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41579-025-01255-x">Uraki R. et al. SARS-CoV-2 variants: biology, pathogenicity, immunity, and control. Nat Rev Microbiol 2026; 24: 8–28</a></li><li><a href="https://doi.org/10.1038/s41576-018-0055-5">Geoghegan J.L., Holmes E.C. The phylogenomics of evolving virus virulence. Nat Rev Genet 2018; 19: 756–769</a></li><li><a href="https://doi.org/10.1128/jvi.02209-24">Krammer F., Hermann E., Rasmussen A.L. Highly pathogenic avian influenza H5N1: history, current situation, and outlook. J Virol 2025; 99(4): e02209-24</a></li></ul><p>Расчёт по модели · параметры условные.</p></details></article><article class="card print-unit" id="ns-tumour"><div class="eyebrow">Эволюция в медицине · шаг 30 из 37</div><h2>Опухоль как популяция клонов</h2><p class="lead">Опухоль — изменяющаяся популяция клеток тела: изменения клеток создают изменчивость, а микроокружение и лечение определяют, какие клоны распространятся.</p><div class="note"><strong>Что показывает схема.</strong> Поле клеток опухоли на трёх шагах и дерево клонов</div><p><a href="#ns-g-S16-T65">Клональная эволюция</a> — изменение состава опухоли за счёт возникновения, конкуренции и распространения клонов клеток. Мутации, хромосомные перестройки и изменения состояния клеток создают изменчивость; <a href="#ns-g-S16-T66">драйверные изменения</a> способствуют росту или выживанию клона, пассажирские не дают заметного преимущества в данных условиях. Эволюция опухоли ветвящаяся: <a href="#ns-g-S16-T67">субклоны</a> отходят от предкового клона в разное время, поэтому в одной опухоли сосуществуют разные клеточные популяции — <a href="#ns-g-S16-T68">внутриопухолевая гетерогенность</a>. Устойчивый к лечению субклон может существовать до начала лечения; лечение уничтожает чувствительные клетки и меняет конкуренцию. При r = 1,1 : 0,7 ≈ 1,57 за единицу времени (условно) доля устойчивого субклона растёт с 0,01 до около 0,48 за 10 единиц и до около 0,99 за 20.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-evo-medicine">«Что эволюционный подход даёт медицине»</a>; вспомнить <a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a></p><p>Изменения в клетках тела не передаются потомкам организма: это отбор внутри одного организма, а не между поколениями людей. Разделение изменений на драйверные и пассажирские относительно: эффект зависит от ткани, стадии и лечения.</p><p><b>На практикуме.</b> Вкладка 4, масштаб «клоны опухоли».</p><p><b>Ограничения.</b> Часть устойчивости опухолевых клеток — обратимые состояния, а не наследуемые изменения; под действием терапии клетки могут и временно повышать скорость мутаций; в модели этого нет.</p><p><b>Дальше в курсе «Молекулярная биология».</b> Чем различаются онкогенные варианты RAS — <a href="https://edu.mazunin.science/seminar-3-route.html#oncogenic">«Молекулярная биология», семинар 3</a>; чем среднее по популяции отличается от сигнала одной клетки — <a href="https://edu.mazunin.science/seminar-4-route.html#single-cell">«Молекулярная биология», семинар 4</a>; как нарушения SDH, FH и IDH по-разному меняют метаболиты — <a href="https://edu.mazunin.science/seminar-8-route.html#oncometabolites">«Молекулярная биология», семинар 8</a>.</p><div class="static-quiz"><h3>Почему после лечения состав опухоли может отличаться от исходного?</h3><ol><li><b>А.</b> Все клетки опухоли одинаковы <i>(неверный вариант)</i><br><span class="expl">Опухоль — популяция разных клонов</span></li><li><b>Б.</b> Лечение превратило все клетки в устойчивые <i>(неверный вариант)</i><br><span class="expl">Меняется доля клонов; часть устойчивости — обратимые состояния клеток</span></li><li><b>В.</b> Лечение изменило конкуренцию клонов <i>(верный вариант)</i><br><span class="expl">Устойчивый субклон мог существовать до лечения</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.15252/embj.2021108389">Vendramin R., Litchfield K., Swanton C. Cancer evolution: Darwin and beyond. EMBO J 2021; 40: e108389</a></li></ul><p>Расчёт по модели · клоны, доли и время условные.</p></details></article><article class="card print-unit" id="ns-persistence"><div class="eyebrow">Эволюция в медицине · шаг 31 из 37</div><h2>Почему патогенные варианты сохраняются</h2><p class="lead">Варианты, повышающие риск болезни, сохраняются в популяциях по разным причинам; высокая частота такого варианта сама по себе не доказывает его пользы.</p><div class="note"><strong>Что показывает схема.</strong> Два показателя равновесной частоты и список причин сохранения</div><p><a href="#ns-g-S16-T69">Равновесие мутаций и отбора</a>: вредный аллель удаляется отбором и возникает заново. Для рецессивного аллеля равновесная частота тем выше, чем слабее отбор против гомозигот: при одной и той же скорости мутаций (условной) снижение приспособленности гомозигот на 0,9 даёт частоту аллеля около 0,011 (носителей около 2 %), а на 0,1 — около 0,032 (носителей около 6 %): отбор слабее в 9 раз — частота выше в 3 раза. Рецессивный аллель долго сохраняется у гетерозигот. В малых популяциях дрейф и эффект основателя повышают частоту редкого варианта независимо от его эффекта. <a href="#ns-g-S16-T70">Преимущество гетерозигот</a> — частный случай <a href="#ns-g-S16-T52">балансирующего отбора</a>: аллель HbS гена HBB вызывает серповидноклеточную болезнь у гомозигот, но снижает риск тяжёлой малярии у гетерозигот.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-13-route.html#polymorphism">семинар 13: «Как сохраняется полиморфизм»</a> и <a href="seminar-13-route.html#bottleneck-founder">семинар 13: «Узкое место и эффект основателя»</a></p><details><summary>Формула и расчёт</summary><p>Для рецессивного аллеля равновесная частота q = √(μ/s), где q — частота аллеля, μ — скорость мутаций в этот аллель за поколение, s — снижение приспособленности гомозигот. При μ = 10⁻⁴ (условно): s = 0,9 → q ≈ 0,011; s = 0,1 → q ≈ 0,032.</p></details><p>При позднем проявлении болезни отбор слабее: часть потомков уже рождена. <a href="#ns-g-S16-T71">Антагонистическая плейотропия</a> — вариант полезен в одном возрасте или условиях и вреден в другом; раннюю пользу нужно показать, а не выводить из позднего вреда. Отбор действует и на варианты митохондриальной ДНК: по 116 663 передачам «мать — ребёнок» найдены признаки отбора против вредных вариантов до и после рождения, а ребёнок фактически наследует от матери всего около трёх единиц митохондриальной ДНК — поэтому доля варианта у детей одной матери различается.</p><p><b>На практикуме.</b> Вкладка 4, модель «равновесие мутаций и отбора».</p><p><b>Ограничения.</b> Формула предполагает очень большую популяцию, постоянные μ и s и отсутствие миграции.</p><div class="static-quiz"><h3>Отбор против рецессивного аллеля ослаб в 9 раз. Как изменится равновесная частота?</h3><ol><li><b>А.</b> Вырастет в 3 раза <i>(верный вариант)</i><br><span class="expl">Частота пропорциональна корню из μ/s</span></li><li><b>Б.</b> Вырастет в 9 раз <i>(неверный вариант)</i><br><span class="expl">Зависимость от s — через квадратный корень</span></li><li><b>В.</b> Не изменится <i>(неверный вариант)</i><br><span class="expl">Равновесная частота зависит от силы отбора</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-00305-9">Benton M.L. et al. The influence of evolutionary history on human health and disease. Nat Rev Genet 2021; 22: 269–283</a></li><li><a href="https://doi.org/10.1016/j.cell.2024.05.022">Árnadóttir E.R. et al. The rate and nature of mitochondrial DNA mutations in human pedigrees. Cell 2024; 187: 3904–3918</a></li></ul><p>Расчёт по модели · μ и s условные.</p></details></article><article class="card print-unit" id="ns-tradeoffs"><div class="eyebrow">Эволюция в медицине · шаг 32 из 37</div><h2>Компромиссы и защитные реакции</h2><p class="lead">Отбор не создаёт совершенных систем: усиление одной функции часто увеличивает издержки другой. Защитная реакция может стать частью болезни.</p><div class="note"><strong>Что показывает схема.</strong> Три весы «польза — издержки»</div><p><a href="#ns-g-S16-T72">Эволюционный компромисс</a> — сочетание полезного и вредного эффектов одного признака, при котором отбор поддерживает признак, несмотря на издержки. Иммунная защита уничтожает возбудителей, но может повреждать собственные ткани; свёртывание крови предотвращает кровопотерю, но повышает риск тромбоза; воспаление и лихорадка защищают, но при чрезмерной силе становятся частью болезни. Компромисс проявляется и у возбудителей: если размножение возбудителя повышает и передачу, и вред хозяину, вирулентность не обязательно снижается со временем — её изменение зависит от пути передачи, длительности инфекции и иммунитета.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-evo-medicine">«Что эволюционный подход даёт медицине»</a>, шаг <a href="#ns-persistence">«Почему патогенные варианты сохраняются»</a></p><p>Эволюционное объяснение реакции не означает, что она полезна в каждом случае и что её не следует подавлять.</p><p><b>На практикуме.</b> Вкладка 4.</p><p><b>Ограничения.</b> Компромисс — гипотеза, которую проверяют: нужно показать и пользу, и издержки признака.</p><div class="static-quiz"><h3>Что такое эволюционный компромисс?</h3><ol><li><b>А.</b> Несоответствие физиологии новой среде <i>(неверный вариант)</i><br><span class="expl">Это несоответствие — другое объяснение</span></li><li><b>Б.</b> Признак с пользой и издержками сразу <i>(верный вариант)</i><br><span class="expl">Отбор поддерживает его, несмотря на издержки</span></li><li><b>В.</b> Признак, полезный во всех условиях среды <i>(неверный вариант)</i><br><span class="expl">У компромисса есть издержки</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41576-020-00305-9">Benton M.L. et al. The influence of evolutionary history on human health and disease. Nat Rev Genet 2021; 22: 269–283</a></li><li><a href="https://doi.org/10.1038/s41576-018-0055-5">Geoghegan J.L., Holmes E.C. The phylogenomics of evolving virus virulence. Nat Rev Genet 2018; 19: 756–769</a></li></ul><p>Схема качественная · примеры условны.</p></details></article><article class="card print-unit" id="ns-mismatch"><div class="eyebrow">Эволюция в медицине · шаг 33 из 37</div><h2>Несоответствие среде</h2><p class="lead">Несоответствие — не то же, что компромисс: признак, сложившийся в прежних условиях, в новой среде повышает риск болезни.</p><div class="note"><strong>Что показывает схема.</strong> Один признак в двух средах и сравнительная строка с компромиссом</div><p><a href="#ns-g-S16-T73">Эволюционное несоответствие</a> возникает, когда фенотип или программа развития, сложившиеся в прежних условиях, взаимодействуют с новой средой так, что повышается риск болезни. Промышленная революция и связанные с ней изменения питания, инфекций и численности населения изменили среду человека; варианты, связанные с большей приспособленностью в прошлом, через противоположные эффекты в разном возрасте могут повышать риск неинфекционных болезней. Изменения могут быть и ненаследственными: быстрые ответы организма на новую среду вероятнее, чем изменения частот аллелей, требующие многих поколений.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-tradeoffs">«Компромиссы и защитные реакции»</a></p><p>Объяснение через несоответствие требует указать конкретный механизм. Сложные болезни не объясняются одной гипотезой: на них влияют генетика, развитие, питание, сон, лекарства и социальная среда. Компромисс описывает признак с пользой и издержками в одной среде; несоответствие — признак, который был выгоден в прежней среде и стал фактором риска в новой.</p><p><b>На практикуме.</b> Вкладка 4.</p><p><b>Ограничения.</b> Время действия отбора на большинство таких признаков не установлено.</p><div class="static-quiz"><h3>Чем несоответствие отличается от компромисса?</h3><ol><li><b>А.</b> Несоответствие бывает только у болезнетворных вариантов <i>(неверный вариант)</i><br><span class="expl">Это признак, выгодный в прежней среде; риск даёт смена среды</span></li><li><b>Б.</b> Это одно и то же <i>(неверный вариант)</i><br><span class="expl">Компромисс — польза и издержки в одной среде</span></li><li><b>В.</b> Риск возникает из-за смены среды <i>(верный вариант)</i><br><span class="expl">В прежней среде признак не повышал риска</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-020-00305-9">Benton M.L. et al. The influence of evolutionary history on human health and disease. Nat Rev Genet 2021; 22: 269–283</a></li><li><a href="https://doi.org/10.1038/s41576-018-0012-3">Corbett S. et al. The transition to modernity and chronic disease: mismatch and natural selection. Nat Rev Genet 2018; 19: 419–430</a></li></ul><p>Схема качественная · среды условны.</p></details></article><article class="card print-unit" id="ns-strain-replacement"><div class="eyebrow">Эволюция в медицине · шаг 34 из 37</div><h2>Устойчивость после лечения: другой штамм, а не новая мутация</h2><p class="lead">Когда инфекция возвращалась после лечения уже устойчивой, причиной почти всегда был другой штамм, уже устойчивый, а не новая мутация в исходном.</p><div class="note"><strong>Что показывает схема.</strong> Пары значков штаммов и столбики долей</div><p>Изучили медицинские записи о более чем 140 тыс. случаев инфекции мочевых путей и 7 тыс. раневых инфекций, леченных одним препаратом, к которому возбудитель был чувствителен. Рецидив в течение 4–28 дней возникал примерно в 9 % (мочевые пути) и 5 % (раны) случаев, и более 30 % и 19 % рецидивов соответственно приобрели устойчивость к назначенному препарату. Прочитали геномы 1 113 изолятов кишечной палочки от 510 человек до и после лечения. Среди рецидивов с приобретённой устойчивостью другой <a href="#ns-g-S16-T74">штамм</a> был в 93 % случаев, а среди рецидивов без изменения чувствительности — в 19 %. Случаев устойчивости, возникшей точечной мутацией в исходном штамме, не найдено; 44 % рецидивов с приобретённой устойчивостью вызваны другим видом бактерий.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-amr">«Устойчивость к антимикробным препаратам»</a></p><p>Вывод авторов: устойчивость после лечения возникала главным образом отбором уже существующих устойчивых штаммов, а не новыми мутациями. Источник таких штаммов, вероятно, — собственная <a href="#ns-g-S16-T75">микробиота</a> человека; прошлые устойчивые инфекции повышали риск.</p><p><b>Как это узнали.</b> Сравнили геномы возбудителей до и после лечения у одних и тех же людей: по числу различий определили, тот же это штамм или другой.</p><p><b>Граница вывода.</b> Одна система здравоохранения, два типа инфекций, ранние рецидивы; что штаммы пришли именно из кишечника или с кожи, прямо не проверено.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 4.</p><div class="static-quiz"><h3>Как было показано, что устойчивость принёс другой штамм?</h3><ol><li><b>А.</b> Сравнили геномы возбудителей до и после лечения <i>(верный вариант)</i><br><span class="expl">Другой штамм отличается многими различиями генома</span></li><li><b>Б.</b> Измерили концентрацию препарата в моче <i>(неверный вариант)</i><br><span class="expl">Концентрацию не измеряли; сравнивали геномы</span></li><li><b>В.</b> Нашли мутацию устойчивости в исходном штамме <i>(неверный вариант)</i><br><span class="expl">Таких случаев не найдено</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.abg9868">Stracy M. et al. Minimizing treatment-induced emergence of antibiotic resistance in bacterial infections. Science 2022; 375: 889–894</a></li></ul><p>Схема по данным работы, упрощённая · доли — из работы.</p></details></article><article class="card print-unit" id="ns-plasmid-history"><div class="eyebrow">Эволюция в медицине · шаг 35 из 37</div><h2>Переносчики устойчивости существовали до эпохи антибиотиков</h2><p class="lead">Плазмиды, которые сейчас переносят гены устойчивости между бактериями, произошли от плазмид, бывших у возбудителей ещё до массового применения антибиотиков, — но без генов устойчивости.</p><div class="note"><strong>Что показывает схема.</strong> Исторический и современный остов плазмиды и доли семейств</div><p>Прочитали плазмиды бактерий из исторической коллекции клинических образцов, собранной в первой половине XX века, до массового применения антибиотиков (765 плазмид, из них 218 собраны полностью), и сравнили их с более чем 40 тыс. плазмид из современных баз данных. Современные плазмиды-переносчики генов устойчивости произошли от меньшинства плазмид, уже бывших у возбудителей того времени. Их исходные остовы генов устойчивости не несли: гены устойчивости были приобретены позже. Три пути изменения плазмид: исчезновение исходных остовов, сохранение без существенных изменений и слияние нескольких исходных плазмид в крупные сложные плазмиды. Половина генов устойчивости приходится на семейства плазмид, составляющие лишь около пятой части всех изученных.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-amr">«Устойчивость к антимикробным препаратам»</a></p><p>Пример показывает два уровня отбора: отбор бактерий, несущих гены устойчивости, и изменение самих плазмид как переносчиков.</p><p><b>Как это узнали.</b> Построили сеть сходства исторических и современных плазмид и проследили, какие современные плазмиды содержат последовательности исторических.</p><p><b>Граница вывода.</b> Историческая коллекция — небольшая выборка клинических образцов; плазмиды, не попавшие в коллекцию и базы данных, не видны.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 4 (как вторая причина появления устойчивости — перенос гена).</p><div class="static-quiz"><h3>Что было у исторических плазмид?</h3><ol><li><b>А.</b> Те же гены устойчивости, что сейчас <i>(неверный вариант)</i><br><span class="expl">Исходные остовы генов устойчивости не несли</span></li><li><b>Б.</b> Остовы без генов устойчивости <i>(верный вариант)</i><br><span class="expl">Гены устойчивости появились в них позже</span></li><li><b>В.</b> Ничего общего с современными плазмидами <i>(неверный вариант)</i><br><span class="expl">Современные переносчики произошли от части исторических</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-16.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.adr1522">Cazares A. et al. Pre- and postantibiotic epoch: the historical spread of antimicrobial resistance. Science 2025; 390: eadr1522</a></li></ul><p>Схема по данным работы, упрощённая · числа — из работы.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог · шаг 36 из 37</div><h2>Итоговая задача: одно наблюдение через четыре семинара</h2><p class="lead">Одно наблюдение — высокая частота варианта в одной популяции — разбирают на четырёх уровнях: частота, след в последовательности, дерево участка и история с механизмом. На каждом уровне — свои данные.</p><div class="note"><strong>Что показывает схема.</strong> Четыре панели одного наблюдения: частоты, гаплотип, дерево участка, карточки</div><p>Условное наблюдение: вариант гена встречается у 80 % жителей высокогорья и у 1 % соседней равнинной популяции. (1) Частота: различие частот — наблюдение; его могут создать дрейф и эффект основателя, отбор, смешение с популяцией, где вариант част. (2) След в последовательности: протяжённый <a href="#ns-g-S16-T40">гаплотип</a> вокруг варианта при низком разнообразии рядом указывает на недавний быстрый рост частоты — <a href="#ns-g-S16-T44">след отбора</a>, если его не объясняет история численности. (3) Дерево участка: если копии участка группируются с архаичным геномом, а участок длинный, вероятнее <a href="#ns-g-S16-T37">интрогрессия</a>; короткий участок с древним расхождением — неполная сортировка. (4) История и механизм: функция гена и связь варианта с признаком — механизм сейчас; смешение, рост частоты и среда — история; медицинский вывод для конкретного человека из этого не следует.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-locus-vs-population">«История участка и история популяции — не одно и то же»</a>, шаг <a href="#ns-five-lines">«Пять линий доказательств адаптации»</a>, шаг <a href="#ns-persistence">«Почему патогенные варианты сохраняются»</a>; вспомнить <a href="seminar-15-route.html#ils-vs-introgression">семинар 15: «Как различают неполную сортировку и интрогрессию»</a></p><p>Общий порядок: назвать уровень наблюдения; перечислить совместимые объяснения; указать данные, дающие каждому положительный признак; если данных нет, сказать «по этим данным различить нельзя».</p><p><b>На практикуме.</b> Итоговая задача под вкладкой 4.</p><p><b>Ограничения.</b> Пример условный; числа не относятся к конкретному гену.</p><div class="static-quiz"><h3>Что из перечисленного — данные для уровня «дерево участка»?</h3><ol><li><b>А.</b> Частота варианта в двух популяциях <i>(неверный вариант)</i><br><span class="expl">Это уровень частоты, а не дерева</span></li><li><b>Б.</b> Функция белка, который кодирует этот ген <i>(неверный вариант)</i><br><span class="expl">Это механизм, а не происхождение участка</span></li><li><b>В.</b> Близость копий участка к архаичному геному <i>(верный вариант)</i><br><span class="expl">Так проверяют происхождение участка</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-16.html#q1">Вопрос 1 →</a> <a href="seminar-16.html#q2">Вопрос 2 →</a> <a href="seminar-16.html#q3">Вопрос 3 →</a> <a href="seminar-16.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis. 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/nature13408">Huerta-Sánchez E. et al. Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 2014; 512: 194–197</a></li><li><a href="https://doi.org/10.1101/gr.278993.124">Peede D. et al. Recent advances in methods to characterize archaic introgression in modern humans. Genome Res 2026; 36: 239–256</a></li></ul><p>Схема качественная · наблюдение условное.</p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог · шаг 37 из 37</div><h2>Связи и что дальше</h2><p class="lead"></p><ol class="mech"></ol><h3>Что понадобилось из прежних семинаров</h3><ul><li><a href="seminar-12-route.html#function-origin">семинар 12: «Как система работает и как она возникла — разные вопросы»</a> — механизм и история</li><li><a href="seminar-12-route.html#four-statuses">семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»</a> — статусы утверждений</li><li><a href="seminar-13-route.html#bottleneck-founder">семинар 13: «Узкое место и эффект основателя»</a> — расселение</li><li><a href="seminar-13-route.html#polymorphism">семинар 13: «Как сохраняется полиморфизм»</a> и <a href="seminar-13-route.html#adaptation">семинар 13: «Адаптация и как её доказывают»</a> — доказательства адаптации и сохранение патогенных вариантов</li><li><a href="seminar-14-route.html#interval">семинар 14: «Интервал вместо даты»</a> — интервалы на шкале</li><li><a href="seminar-14-route.html#duplication">семинар 14: «Дупликация: как возникает копия гена»</a> — локус амилазы</li><li><a href="seminar-14-route.html#mtdna">семинар 14: «Митохондриальная ДНК как отдельный случай»</a> — генеалогия одного участка</li><li><a href="seminar-15-route.html#ils">семинар 15: «Неполная сортировка линий»</a>, <a href="seminar-15-route.html#introgression">семинар 15: «Интрогрессия»</a>, <a href="seminar-15-route.html#tree-or-network">семинар 15: «Дерево или сеть»</a> — история популяций человека</li><li><a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a> — изменения клеток опухоли</li></ul><h3>Что дальше в курсе</h3><ul><li>Паразитология: система «паразит — хозяин»; серповидноклеточный вариант и малярия как пример взаимодействия популяций хозяина и паразита — продолжает шаг <a href="#ns-persistence">«Почему патогенные варианты сохраняются»</a></li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Как наследование и сегрегация меняют распределение вариантов мтДНК — <a href="https://edu.mazunin.science/seminar-9-route.html#segregation">«Молекулярная биология», семинар 9</a> — продолжает шаг <a href="#ns-persistence">«Почему патогенные варианты сохраняются»</a></li><li>Почему эффект гетероплазмии может проявляться нелинейно — <a href="https://edu.mazunin.science/seminar-9-route.html#heteroplasmy-threshold">«Молекулярная биология», семинар 9</a> — продолжает шаг <a href="#ns-persistence">«Почему патогенные варианты сохраняются»</a></li><li>Чем различаются энхансер и промотор — <a href="https://edu.mazunin.science/seminar-6-route.html#enhancer">«Молекулярная биология», семинар 6</a> — продолжает шаг <a href="#ns-gene-culture">«Генно-культурная коэволюция: молоко и крахмал»</a> (регуляторные варианты персистенции лактазы); соматические мутации и клональная эволюция, теломеры и старение — «раздел III/IV (в разработке)»</li><li>Почему HIF-α накапливается при недостатке кислорода — <a href="https://edu.mazunin.science/seminar-10-route.html#hif">«Молекулярная биология», семинар 10</a>, как программы HIF зависят от изоформы и ткани — <a href="https://edu.mazunin.science/seminar-10-route.html#hif-context">«Молекулярная биология», семинар 10</a> — продолжает шаг <a href="#ns-adaptive-introgression">«Адаптивная интрогрессия: вариант гена EPAS1 у тибетцев»</a></li><li>Чем различаются онкогенные варианты RAS — <a href="https://edu.mazunin.science/seminar-3-route.html#oncogenic">«Молекулярная биология», семинар 3</a>, чем среднее по популяции отличается от сигнала одной клетки — <a href="https://edu.mazunin.science/seminar-4-route.html#single-cell">«Молекулярная биология», семинар 4</a>, как нарушения SDH, FH и IDH по-разному меняют метаболиты — <a href="https://edu.mazunin.science/seminar-8-route.html#oncometabolites">«Молекулярная биология», семинар 8</a> — продолжает шаг <a href="#ns-tumour">«Опухоль как популяция клонов»</a></li></ul><div class="static-quiz"><h3>Где в курсе разбирается, почему доля вариантов митохондриальной ДНК может различаться у детей одной матери?</h3><ol><li><b>А.</b> В теме о дупликации генов <i>(неверный вариант)</i><br><span class="expl">Там — как возникает копия гена: <a href="seminar-14-route.html#duplication">семинар 14: «Дупликация: как возникает копия гена»</a>; распределение вариантов мтДНК разбирается в «Молекулярной биологии».</span></li><li><b>Б.</b> В курсе «Молекулярная биология» <i>(верный вариант)</i><br><span class="expl"><a href="https://edu.mazunin.science/seminar-9-route.html#segregation">Как наследование и сегрегация меняют распределение вариантов мтДНК — «Молекулярная биология», семинар 9</a>.</span></li><li><b>В.</b> В теме о происхождении митохондрий <i>(неверный вариант)</i><br><span class="expl">Там — откуда произошли митохондрии: <a href="seminar-12-route.html#endosymbiosis">семинар 12: «Почему митохондрии происходят от бактерии: независимые линии данных»</a>; распределение вариантов мтДНК — <a href="https://edu.mazunin.science/seminar-9-route.html#segregation">«Молекулярная биология», семинар 9</a>.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-16.html#q1">Вопрос 1 →</a> <a href="seminar-16.html#q2">Вопрос 2 →</a> <a href="seminar-16.html#q3">Вопрос 3 →</a> <a href="seminar-16.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S16-T01"><dt>Наблюдение</dt><dd>Утверждение, установленное непосредственно: измерено, увидено или получено в эксперименте. В этом семинаре: наблюдением называют зарегистрированное свойство образца или объекта, включая результат измерения с указанием метода и погрешности.</dd></div><div id="ns-g-S16-T02"><dt>Модельный вывод</dt><dd>Интерпретация наблюдений при явных допущениях о связи признака с функцией, процессом или родством.</dd></div><div id="ns-g-S16-T03"><dt>Историческое объяснение</dt><dd>Проверяемая реконструкция причин и последовательности прошлых событий, сопоставленная с альтернативными объяснениями.</dd></div><div id="ns-g-S16-T04"><dt>Эволюция</dt><dd>Изменение наследственного состава популяций в ряду поколений.</dd></div><div id="ns-g-S16-T05"><dt>Ископаемые остатки</dt><dd>Сохранившиеся в отложениях части организмов или их следы; дают сведения об анатомии, месте и, через датирование слоя, о возрасте.</dd></div><div id="ns-g-S16-T06"><dt>Датирование</dt><dd>Определение возраста слоя, находки или события; для находок обычно датируют слой, в котором или между которыми они лежат; результат даётся с погрешностью.</dd></div><div id="ns-g-S16-T07"><dt>Археологические данные</dt><dd>Орудия, следы обработки костей, очаги и другие следы деятельности; говорят о технологии и поведении, но не всегда о том, кто их оставил.</dd></div><div id="ns-g-S16-T08"><dt>Древняя ДНК</dt><dd>ДНК, выделенная из исторического или ископаемого материала; её подлинность подтверждают по характерным повреждениям и контролю загрязнения.</dd></div><div id="ns-g-S16-T09"><dt>Древние белки</dt><dd>Белки, сохранившиеся в ископаемых костях и зубах; по их аминокислотным последовательностям устанавливают родство и пол, но различающихся позиций в них меньше, чем в ДНК.</dd></div><div id="ns-g-S16-T10"><dt>Радиометрическое датирование</dt><dd>Определение возраста по распаду радиоактивных изотопов; аргоновым методом датируют вулканические туфы.</dd></div><div id="ns-g-S16-T11"><dt>Магнитостратиграфия</dt><dd>Датирование слоёв по записанным в породах сменам направления магнитного поля Земли, время которых известно.</dd></div><div id="ns-g-S16-T12"><dt>Двуногость</dt><dd>Использование задних конечностей как основной опоры при передвижении по земле.</dd></div><div id="ns-g-S16-T13"><dt>Мозаичная эволюция</dt><dd>Неодновременное изменение разных признаков и функциональных систем в одной или нескольких линиях.</dd></div><div id="ns-g-S16-T14"><dt>Австралопитеки</dt><dd>Род Australopithecus: двуногие гоминины с небольшим мозгом, известные в Африке примерно от 4,2 до 2 млн лет назад; название объединяет несколько форм.</dd></div><div id="ns-g-S16-T15"><dt>Парантропы</dt><dd>Род Paranthropus: гоминины с крупными коренными зубами и массивными челюстями, известные в Африке примерно от 2,7 до 1 млн лет назад.</dd></div><div id="ns-g-S16-T16"><dt>Интервал находок</dt><dd>Отрезок времени от самой ранней до самой поздней известной находки таксона; не равен времени существования линии.</dd></div><div id="ns-g-S16-T17"><dt>Ранний Homo</dt><dd>Неоднородная совокупность находок рода Homo примерно 2,8–1,6 млн лет назад; границы рода и видов спорны.</dd></div><div id="ns-g-S16-T18"><dt>Каменная индустрия</dt><dd>Совокупность способов изготовления каменных орудий; описывает технологию, а не вид изготовителя.</dd></div><div id="ns-g-S16-T19"><dt>Общий предок</dt><dd>Популяция, от которой произошли две или более линии; на дереве — их общий узел.</dd></div><div id="ns-g-S16-T20"><dt>Гоминины</dt><dd>Линия, более близкая к человеку, чем к шимпанзе, после расхождения этих линий.</dd></div><div id="ns-g-S16-T21"><dt>Гетеротопия</dt><dd>Изменение в ходе эволюции места, где в развитии формируется структура.</dd></div><div id="ns-g-S16-T22"><dt>Гетерохрония</dt><dd>Изменение в ходе эволюции времени или скорости процессов развития.</dd></div><div id="ns-g-S16-T23"><dt>Денисовцы</dt><dd>Древняя линия рода Homo, выделенная по ДНК из Денисовой пещеры; сестринская неандертальцам.</dd></div><div id="ns-g-S16-T24"><dt>Ископаемый вид</dt><dd>Вид, выделенный по морфологии ископаемых и правилам классификации; не обязательно совпадает с генетической линией.</dd></div><div id="ns-g-S16-T25"><dt>Рекомбинация</dt><dd>Образование новых сочетаний аллелей при мейозе: при кроссинговере и независимом расхождении хромосом.</dd></div><div id="ns-g-S16-T26"><dt>Митохондриальная ДНК</dt><dd>Собственная ДНК митохондрий; у человека кодирует 13 белков и 24 РНК. В этом семинаре: кольцевой геном митохондрий; у человека передаётся по материнской линии и не рекомбинирует, поэтому представляет одну генеалогию.</dd></div><div id="ns-g-S16-T27"><dt>Нерекомбинирующая часть Y-хромосомы</dt><dd>Большая часть Y-хромосомы, передаваемая от отца к сыну без рекомбинации; представляет одну генеалогию отцовской линии.</dd></div><div id="ns-g-S16-T28"><dt>Эффект основателя</dt><dd>Отличие частот аллелей в новой популяции, основанной немногими особями, от частот исходной популяции.</dd></div><div id="ns-g-S16-T29"><dt>Структурированное происхождение</dt><dd>Модель, в которой предки вида составляли несколько частично обособленных популяций, обменивавшихся генами или сливавшихся.</dd></div><div id="ns-g-S16-T30"><dt>Коалесцентная дата</dt><dd>Модельная оценка времени до общего предка копий участка генома; не равна дате возникновения вида.</dd></div><div id="ns-g-S16-T31"><dt>Расселение</dt><dd>Распространение популяции на новые территории, сопровождающееся отделением групп от исходных популяций.</dd></div><div id="ns-g-S16-T32"><dt>Популяционная структура</dt><dd>Неоднородность частот аллелей и генотипов между группами особей внутри популяции. В этом семинаре: структура описывает неоднородность частот вариантов и родства между группами людей, связанную с местом, средой или историей.</dd></div><div id="ns-g-S16-T33"><dt>Неандертальцы</dt><dd>Древняя линия рода Homo Европы, Западной и Центральной Азии и юга Сибири, сестринская денисовцам; известна по многочисленным ископаемым и геномам.</dd></div><div id="ns-g-S16-T34"><dt>Генетическая линия</dt><dd>Совокупность носителей, выделенная по общему происхождению их геномов; может не совпадать с ископаемым видом.</dd></div><div id="ns-g-S16-T35"><dt>Призрачная линия</dt><dd>Линия, известная только по статистическому следу в геномах других популяций, без ископаемых и прочитанной ДНК.</dd></div><div id="ns-g-S16-T36"><dt>Смешение популяций</dt><dd>Образование потомства между ранее обособленными популяциями с объединением их генетических вкладов.</dd></div><div id="ns-g-S16-T37"><dt>Интрогрессия</dt><dd>Включение наследственного материала одной линии в генофонд другой через гибридизацию и последующие возвратные скрещивания. В этом семинаре: у человека — через смешение популяций и последующие скрещивания.</dd></div><div id="ns-g-S16-T38"><dt>Локальное происхождение участка</dt><dd>Оценённое происхождение конкретного участка генома относительно выбранных референсных популяций.</dd></div><div id="ns-g-S16-T39"><dt>Неполная сортировка линий</dt><dd>Сохранение нескольких предковых генных линий через последовательные разделения популяций, из-за которого дерево участка генома может не совпадать с деревом видов. В этом семинаре: дерево участка сравнивают с деревом популяций человека.</dd></div><div id="ns-g-S16-T40"><dt>Гаплотип</dt><dd>Сочетание аллелей нескольких локусов на одной хромосоме; наследуется вместе, пока его не изменит рекомбинация.</dd></div><div id="ns-g-S16-T41"><dt>Слабоструктурированный ствол</dt><dd>Модель происхождения Homo sapiens, в которой несколько слабо различающихся предковых популяций долго связаны потоком генов.</dd></div><div id="ns-g-S16-T42"><dt>Адаптация</dt><dd>Наследуемый признак, сформированный естественным отбором и повышающий приспособленность в определённых условиях; также процесс формирования таких признаков.</dd></div><div id="ns-g-S16-T43"><dt>Ассоциация варианта с признаком</dt><dd>Воспроизводимая статистическая связь варианта с признаком в выборке людей; сама по себе не устанавливает механизм.</dd></div><div id="ns-g-S16-T44"><dt>След отбора</dt><dd>Отклонение частот вариантов и строения гаплотипов от явно заданной нейтрально-демографической модели, совместимое с действием отбора.</dd></div><div id="ns-g-S16-T45"><dt>Нейтрально-демографическая модель</dt><dd>Модель изменения частот без отбора, учитывающая историю численности, расселение и смешение популяций.</dd></div><div id="ns-g-S16-T46"><dt>Адаптивная интрогрессия</dt><dd>Интрогрессия варианта, частота которого у линии-получателя выросла под действием положительного отбора.</dd></div><div id="ns-g-S16-T47"><dt>Генно-культурная коэволюция</dt><dd>Изменение частот вариантов под действием отбора, среду которого создаёт культурная практика людей.</dd></div><div id="ns-g-S16-T48"><dt>Персистенция лактазы</dt><dd>Сохранение синтеза лактазы у взрослых, связанное с вариантами регуляторного участка перед геном LCT.</dd></div><div id="ns-g-S16-T49"><dt>Вариация числа копий</dt><dd>Различие людей по числу копий участка генома или гена.</dd></div><div id="ns-g-S16-T50"><dt>Полигенный признак</dt><dd>Признак, на который влияют многие варианты с малым эффектом каждого.</dd></div><div id="ns-g-S16-T51"><dt>Множественные сравнения</dt><dd>Проверка многих гипотез сразу, при которой часть значимых результатов возникает случайно; требует поправки порога значимости.</dd></div><div id="ns-g-S16-T52"><dt>Балансирующий отбор</dt><dd>Отбор, поддерживающий в популяции несколько аллелей локуса.</dd></div><div id="ns-g-S16-T53"><dt>Эволюционная медицина</dt><dd>Применение эволюционных понятий к происхождению уязвимостей организма, к изменению возбудителей и клеточных популяций и к последствиям медицинских вмешательств.</dd></div><div id="ns-g-S16-T54"><dt>Единица отбора</dt><dd>То, что размножается с разным успехом и наследует свойства: особь, клетка бактерии, вирусная линия, клон клеток.</dd></div><div id="ns-g-S16-T55"><dt>Антимикробная устойчивость</dt><dd>Наследуемая способность микроорганизма размножаться при концентрации препарата, подавляющей чувствительные клетки.</dd></div><div id="ns-g-S16-T56"><dt>Горизонтальный перенос генов</dt><dd>Передача наследственного материала вне связи «родитель — потомок», в том числе между далёкими линиями.</dd></div><div id="ns-g-S16-T57"><dt>Плазмида</dt><dd>Небольшая, обычно кольцевая молекула ДНК бактерий, реплицирующаяся отдельно от хромосомы и способная переходить между клетками.</dd></div><div id="ns-g-S16-T58"><dt>Толерантность</dt><dd>Способность популяции бактерий дольше переживать действие препарата без повышения подавляющей концентрации.</dd></div><div id="ns-g-S16-T59"><dt>Персистенция бактерий</dt><dd>Выживание небольшой части клеток в ненаследуемом состоянии при действии препарата; их потомки сохраняют чувствительность.</dd></div><div id="ns-g-S16-T60"><dt>Антигенный дрейф</dt><dd>Постепенное накопление изменений антигенов вирусной линии, снижающих её распознавание существующим иммунитетом; не путать с генетическим дрейфом.</dd></div><div id="ns-g-S16-T61"><dt>Иммунное ускользание</dt><dd>Снижение распознавания варианта возбудителя иммунной системой по сравнению с прежним вариантом; обычно частичное.</dd></div><div id="ns-g-S16-T62"><dt>Антигенный сдвиг</dt><dd>Резкое изменение антигенных свойств вируса; у вируса гриппа A — при реассортации сегментов вирусов человека и животных.</dd></div><div id="ns-g-S16-T63"><dt>Реассортация</dt><dd>Образование нового набора сегментов генома при заражении одной клетки разными вариантами вируса с сегментированным геномом.</dd></div><div id="ns-g-S16-T64"><dt>Узкое место при передаче</dt><dd>Ограничение числа вирусных частиц или вариантов, основавших инфекцию у нового хозяина.</dd></div><div id="ns-g-S16-T65"><dt>Клональная эволюция</dt><dd>Изменение состава популяции клеток тела за счёт возникновения, конкуренции и распространения клонов.</dd></div><div id="ns-g-S16-T66"><dt>Драйверное изменение</dt><dd>Изменение клетки, способствующее росту или выживанию её клона в данных условиях.</dd></div><div id="ns-g-S16-T67"><dt>Субклон</dt><dd>Клон клеток, отошедший от предкового клона и отличающийся от него новыми изменениями.</dd></div><div id="ns-g-S16-T68"><dt>Внутриопухолевая гетерогенность</dt><dd>Сосуществование в одной опухоли генетически или фенотипически различных клеточных популяций.</dd></div><div id="ns-g-S16-T69"><dt>Равновесие мутаций и отбора</dt><dd>Состояние, при котором вредный аллель удаляется отбором с той же скоростью, с какой возникает мутациями.</dd></div><div id="ns-g-S16-T70"><dt>Преимущество гетерозигот</dt><dd>Более высокая приспособленность гетерозигот, чем обеих гомозигот (сверхдоминирование).</dd></div><div id="ns-g-S16-T71"><dt>Антагонистическая плейотропия</dt><dd>Полезный эффект варианта в одном возрасте или условиях и вредный — в других.</dd></div><div id="ns-g-S16-T72"><dt>Эволюционный компромисс</dt><dd>Сочетание полезного и вредного эффектов одного признака, при котором отбор поддерживает признак, несмотря на издержки.</dd></div><div id="ns-g-S16-T73"><dt>Эволюционное несоответствие</dt><dd>Повышение риска болезни, когда признак, сложившийся в прежних условиях, взаимодействует с новой средой.</dd></div><div id="ns-g-S16-T74"><dt>Штамм</dt><dd>Генетически однородная линия микроорганизма внутри вида.</dd></div><div id="ns-g-S16-T75"><dt>Микробиота</dt><dd>Совокупность микроорганизмов, населяющих организм человека.</dd></div><div id="ns-g-S16-T76"><dt>Сантиморган</dt><dd>Единица генетического расстояния: 1 сМ соответствует 1 % рекомбинантных гамет за один мейоз.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 16 · Эволюция человека и эволюционная медицина: от ископаемых и геномов к отбору в организме · Объяснения","home_eyebrow":"Семинар 16 · самостоятельная подготовка · Объяснения","home_h1":"Эволюция человека и эволюционная медицина: от ископаемых и геномов к отбору в организме\nЛинии данных и мозаика признаков, происхождение и смешение, доказательства адаптации, отбор у бактерий, вирусов и клеток опухоли","home_lead":"Эта страница объясняет механизмы, которые моделирует практикум; её можно читать и без практикума. Шаги «сверх программы» не нужны для коллоквиума: они показывают, что известно сверх базового курса. Вопрос после шага — не проверка, а способ убедиться, что объяснение понято. Термины, выделенные ссылкой, открывают статью словаря. Схемы учебные: интервалы, деревья, численности и параметры моделей условные, кроме подписанных; результат модели — предсказание, а не доказательство. У каждого утверждения назван его статус: наблюдение, расчёт по модели, реконструкция или гипотеза. Клинические примеры показывают действие эволюционного механизма и не служат рекомендацией","start":"Начать с первой темы →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; самопроверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"Восемь сценариев (по одному на каждую вкладку на базо
