  /* рибосома: большая субъединица сверху (выход туннеля — к мембране), малая снизу на мРНК; возвращает точку выхода туннеля */
  function ribosome(cx, cy, k = 1, o = {}) {
    const s = `<ellipse cx="${f(cx)}" cy="${f(cy - 13 * k)}" rx="${f(30 * k)}" ry="${f(19 * k)}" fill="${C.riboL}"/>` +
      `<ellipse cx="${f(cx)}" cy="${f(cy + 12 * k)}" rx="${f(23 * k)}" ry="${f(11 * k)}" fill="${C.riboS}"/>` +
      (o.slow ? `<circle cx="${f(cx + 26 * k)}" cy="${f(cy - 26 * k)}" r="${f(7 * k)}" fill="#fff" stroke="${C.warn}" stroke-width="1.6"/>` + line(cx + 26 * k, cy - 30 * k, cx + 26 * k, cy - 26 * k, C.warn, 1.6) + line(cx + 26 * k, cy - 26 * k, cx + 29 * k, cy - 24 * k, C.warn, 1.6) : '');
    return { s: G(o.g || 'ribo', s), x: cx, y: cy - 32 * k, mrnaY: cy + 22 * k };
  }
  /* мРНК: горизонтальная линия с засечками */
  function mrna(x0, x1, y, g = 'mrna') {
    let s = line(x0, y, x1, y, C.mrna, 3.2);
    for (let x = x0 + 6; x < x1; x += 10) s += line(x, y, x, y + 5, C.mrna, 1.6);
    return G(g, s);
  }
  /* растущая цепь по точкам pts (от рибосомы к N-концу); o.sig — доля длины у N-конца, закрашенная как сигнал (0 — нет);
     o.sigG — группа справки сигнала; o.wave — амплитуда волны (0 — прямая); o.col — цвет; o.dash — штрих (белок вне пути) */
  function chain(pts, o = {}) {
    const amp = o.wave == null ? 3.2 : o.wave, wl = 14, col = o.col || C.chain, w = o.w || 3.2;
    const seg = []; let L = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
    const at = l => { let i = 0; while (i < seg.length - 1 && l > seg[i]) { l -= seg[i]; i++; } const u = seg[i] ? Math.min(1, l / seg[i]) : 0, a = pts[i], b = pts[i + 1]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, (b[0] - a[0]) / (seg[i] || 1), (b[1] - a[1]) / (seg[i] || 1)]; };
    const path = (l0, l1) => { const q = []; for (let l = l0; l <= l1 + .01; l += 1.5) { const [x, y, tx, ty] = at(Math.min(l, L)); const off = Math.sin(l / wl * 2 * Math.PI) * amp; q.push(f(x - ty * off) + ',' + f(y + tx * off)); } return 'M' + q.join(' L'); };
    const P = (d, c) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
    const ls = L * (1 - (o.sig || 0));
    let s = G(o.g || 'chain', P(path(0, ls), col));
    if (o.sig) s += G(o.sigG || 'sig', P(path(ls, L), C.sig));
    return s;
  }
  /* SRP: частица с гидрофобным карманом (зелёная), k — масштаб */
  const srp = (cx, cy, k = 1, g = 'srp') => G(g, `<path d="M${f(cx - 26 * k)},${f(cy + 6 * k)} C${f(cx - 26 * k)},${f(cy - 15 * k)} ${f(cx - 6 * k)},${f(cy - 17 * k)} ${f(cx)},${f(cy - 5 * k)} C${f(cx + 6 * k)},${f(cy - 17 * k)} ${f(cx + 26 * k)},${f(cy - 15 * k)} ${f(cx + 26 * k)},${f(cy + 6 * k)} C${f(cx + 17 * k)},${f(cy + 15 * k)} ${f(cx - 17 * k)},${f(cy + 15 * k)} ${f(cx - 26 * k)},${f(cy + 6 * k)} Z" fill="${C.srp}" stroke="#1B5E3A" stroke-width="1"/>`);
  /* рецептор SRP: две цепи в мембране (y — середина бислоя), головка в цитозоле (снизу) */
  const srpR = (x, y, g = 'srpr') => G(g, `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 2)}" width="12" height="${f(MH + 4)}" rx="3" fill="${C.srpr}"/>` +
    `<path d="M${f(x - 16)},${f(y + MH / 2 + 4)} Q${f(x)},${f(y + MH / 2 + 22)} ${f(x + 16)},${f(y + MH / 2 + 4)}" fill="none" stroke="${C.srpr}" stroke-width="6" stroke-linecap="round"/>`);
  /* транслокон Sec61: две половины поперёк мембраны (y — середина бислоя); o.open — канал открыт; o.plug — пробка закрывает канал
     (со стороны просвета); o.gate — латеральные ворота приоткрыты (сигнал уходит в бислой справа); o.off — звено выключено */
  function sec61(x, y, o = {}) {
    const gap = o.open ? 12 : 4, w = 13, h = MH + 14, y0 = y - h / 2, col = o.off ? C.grey : C.sec61;
    let s = `<rect x="${f(x - gap / 2 - w)}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>` +
      `<rect x="${f(x + gap / 2 + (o.gate ? 4 : 0))}" y="${f(y0)}" width="${w}" height="${f(h)}" rx="5" fill="${col}"/>`;
    if (o.plug) s += G('plug', `<rect x="${f(x - gap / 2 - 2)}" y="${f(y0 + 1)}" width="${f(gap + 4)}" height="7" rx="3" fill="${C.plug}" stroke="${col}" stroke-width="1"/>`);
    return G('sec61', s) + (o.off ? cross(x, y0 - 12, 7) : '');
  }
  /* сигнальная пептидаза: белок мембраны с активным центром со стороны просвета (сверху); o.off — нет фермента (штрих) */
  function spase(x, y, o = {}) {
    if (o.off) return G('spase', `<rect x="${f(x - 7)}" y="${f(y - MH / 2 - 14)}" width="14" height="${f(MH + 14)}" rx="4" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>`) + cross(x, y - MH / 2 - 20, 6);
    return G('spase', `<rect x="${f(x - 6)}" y="${f(y - MH / 2 - 4)}" width="12" height="${f(MH + 8)}" rx="3" fill="${C.spase}"/>` +
      `<path d="M${f(x - 9)},${f(y - MH / 2 - 16)} L${f(x)},${f(y - MH / 2 - 6)} L${f(x + 9)},${f(y - MH / 2 - 16)}" fill="none" stroke="${C.spase}" stroke-width="3.2" stroke-linecap="round"/>`);
  }

  /* ---------- гликаны и метка (условные знаки, без формул) */
  const sq = (x, y, u, c = C.glcnac) => `<rect x="${f(x - u / 2)}" y="${f(y - u / 2)}" width="${f(u)}" height="${f(u)}" fill="${c}"/>`;
  const ci = (x, y, u, c = C.man) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u / 2)}" fill="${c}"/>`;
  const tri = (x, y, u, c = C.glc) => `<path d="M${f(x)},${f(y - u * .55)} L${f(x + u * .55)},${f(y + u * .45)} L${f(x - u * .55)},${f(y + u * .45)} Z" fill="${c}"/>`;
  const pmark = (x, y, u) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(u * .62)}" fill="${C.phos}"/>` + `<text x="${f(x)}" y="${f(y + .5)}" font-size="${f(u * .85)}" font-weight="800" fill="#fff" style="text-anchor:middle;dominant-baseline:central;fill:#fff">P</text>`;
  /* N-гликан на аспарагине в точке (x, y), растёт в сторону dir (−1 — вверх). o.glc — число глюкоз (0–3); o.trim — маннозы укорочены
     (сигнал к удалению); o.p — метка M6P ('P' на маннозе) | 'glcnacP' — промежуточная (GlcNAc-P на маннозе); o.complex — сложный
     (аппарат Гольджи: концевые ветви другими знаками); u — размер знака */
  function glycan(x, y, dir = -1, o = {}, g = 'glycan') {
    const u = o.u || 7, st = u * 1.35, Y = i => y + dir * st * i;
    let s = line(x, y, x, Y(3), '#555', 1.4) + line(x, Y(3), x - st, Y(4), '#555', 1.4) + line(x, Y(3), x + st, Y(4), '#555', 1.4);
    s += sq(x, Y(1), u) + sq(x, Y(2), u) + ci(x, Y(3), u);
    if (o.complex) { s += sq(x - st, Y(4), u, '#6B8E23') + sq(x + st, Y(4), u, '#6B8E23') + ci(x - st, Y(5), u * .9, '#E8B4C8') + ci(x + st, Y(5), u * .9, '#E8B4C8'); return G(g, s); }
    s += ci(x - st, Y(4), u) + ci(x + st, Y(4), u);
    if (!o.trim) { s += line(x - st, Y(4), x - st, Y(5), '#555', 1.2) + ci(x - st, Y(5), u); }
    for (let i = 0; i < (o.glc || 0); i++) s += tri(x - st, Y(6 + i), u);
    if (o.p) {
      const px = x + st + u * .9, py = Y(4) + dir * u * .5;
      s += line(x + st, Y(4), px, py, '#555', 1.2);
      if (o.p === 'glcnacP') s += sq(px + u * 1.1, py + dir * u * .5, u * .9) + G('m6p', pmark(px, py, u)); else s += G('m6p', pmark(px, py, u));
    }
    return G(g, s);
  }

  /* ---------- шапероны, контроль качества, удаление */
  const bip = (x, y, k = 1, g = 'bip') => G(g, `<path d="M${f(x - 12 * k)},${f(y - 9 * k)} A13,13 0 1 0 ${f(x + 12 * k)},${f(y - 9 * k)}" fill="none" stroke="${C.chap}" stroke-width="${f(6 * k)}" stroke-linecap="round"/>`);
  const pdi = (x, y, g = 'pdi') => G(g, `<ellipse cx="${f(x)}" cy="${f(y)}" rx="11" ry="7" fill="${C.pdi}"/>`);   /* интеграция (агент t2): без текста 7,5 px — подпись PDI ставит сцена */
  /* калнексин: белок мембраны ЭПР (y — середина бислоя) с лектиновой головкой в просвете (сверху) */
  const calnexin = (x, y, g = 'cnx') => G(g, `<rect x="${f(x - 4)}" y="${f(y - MH / 2 - 2)}" width="8" height="${f(MH + 4)}" rx="3" fill="${C.chap}"/>` +
    line(x, y - MH / 2 - 2, x, y - MH / 2 - 16, C.chap, 3) + `<path d="M${f(x - 14)},${f(y - MH / 2 - 16)} A14,10 0 0 1 ${f(x + 14)},${f(y - MH / 2 - 16)} Z" fill="${C.chapL}" stroke="${C.chap}" stroke-width="2"/>`);
  /* убиквитин: цепочка из n малых кружков */
  const ub = (x, y, n = 4, dx = 7, g = 'ub') => G(g, Array.from({ length: n }, (_, i) => `<circle cx="${f(x + i * dx)}" cy="${f(y - (i % 2) * 3)}" r="3.4" fill="${C.ub}"/>`).join(''));
  /* протеасома: бочонок в цитозоле */
  const proteasome = (x, y, g = 'prot') => G(g, [0, 1, 2, 3].map(i => `<rect x="${f(x - 16)}" y="${f(y - 20 + i * 10)}" width="32" height="9" rx="4" fill="${i % 3 ? C.protL : C.prot}"/>`).join(''));
  /* канал удаления (ERAD) в мембране ЭПР */
  const eradCh = (x, y, g = 'erad_ch') => G(g, `<rect x="${f(x - 14)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/><rect x="${f(x + 4)}" y="${f(y - MH / 2 - 5)}" width="10" height="${f(MH + 10)}" rx="4" fill="#6C7A89"/>`);

  /* ---------- мембранные белки (в бислое) */
  /* однопроходный белок: трансмембранный сегмент в бислое (y — середина), N-домен (глобула) с одной стороны, C-хвост с другой.
     o.inv — обратная ориентация (N-домен в цитозоле, A4); o.col; o.dom — размер домена; o.lig — связан лиганд; o.bad — участок связывания
     не сформирован (штриховой контур); o.glyc — гликан на N-домене; возвращает и точку N-домена */
  function tmProt(x, y, o = {}) {
    const up = o.inv ? 1 : -1, col = o.col || C.ldlr, r = o.dom || 13, ny = y + up * (MH / 2 + 8 + r);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>`;
    s += line(x, y + up * (MH / 2 + 2), x, ny - up * r, col, 3);
    s += `<circle cx="${f(x)}" cy="${f(ny)}" r="${r}" fill="${o.bad ? '#fff' : col}" stroke="${col}" stroke-width="2"${o.bad ? ' stroke-dasharray="4 3"' : ''}/>`;
    const tailEnd = y - up * (MH / 2 + 18);
    s += `<path d="M${f(x)},${f(y - up * (MH / 2 + 2))} Q${f(x + 8)},${f((y - up * (MH / 2) + tailEnd) / 2)} ${f(x + 2)},${f(tailEnd)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;
    if (o.glyc) s += glycan(x + r - 2, ny + up * (r - 2), up, { u: 5 });
    if (o.lig) s += G('ligand', `<path d="M${f(x - 8)},${f(ny + up * (r + 2))} L${f(x)},${f(ny + up * (r + 14))} L${f(x + 8)},${f(ny + up * (r + 2))} Z" fill="${C.lig}"/>`);
    return { s: G(o.g || 'tm', s), nx: x, ny };
  }
  /* рецептор M6P: белок мембраны (y — середина) с карманом связывания со стороны просвета (сверху; dir=-1) */
  function m6pr(x, y, dir = -1, o = {}) {
    const col = o.off ? C.grey : C.m6pr, hy = y + dir * (MH / 2 + 12);
    let s = `<rect x="${f(x - 3.5)}" y="${f(y - MH / 2 - 3)}" width="7" height="${f(MH + 6)}" rx="3" fill="${col}"/>` +
      `<path d="M${f(x - 10)},${f(hy + dir * 6)} L${f(x - 10)},${f(hy)} Q${f(x)},${f(hy - dir * 8)} ${f(x + 10)},${f(hy)} L${f(x + 10)},${f(hy + dir * 6)}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
    return G('m6pr', s) + (o.off ? cross(x, hy + dir * 12, 6) : '');
  }
  /* гидролаза (растворимый груз): глобула; o.tag — метка M6P (знак «P»); o.free — без рецептора */
  const hydrolase = (x, y, o = {}) => G(o.g || 'hydro', `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 7}" fill="${C.hydro}" stroke="#6E3554" stroke-width="1"/>` + (o.tag ? pmark(x + (o.r || 7) + 3, y - (o.r || 7) + 1, 6) : ''));
  /* растворимый секретируемый белок (глобула; цвет по грузу) */
  const solProt = (x, y, col = C.sec, r = 6, g = 'cargo') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}" stroke="#2B5D88" stroke-width=".8"/>`);

  /* ---------- аппарат Гольджи: стопка цистерн (просвет — внутри; цис — снизу слева, транс — справа сверху задаёт сцена) */
  function cisterna(cx, cy, w, h = 16, fill = C.lumen /* С-13 */, g = 'cist') { return closedMem(roundRectPts(cx - w / 2, cy - h / 2, w, h, h / 2 - .5), fill, g); }

  /* шкала столбцов (модели A2, A3): ось, деления и подписи; возвращает функцию высоты */
  function axes(x, y, w, h, vmax, ticks, lab) {
    let s = line(x, y, x, y - h, C.muted, 1.4) + line(x, y, x + w, y, C.muted, 1.4);
    ticks.forEach(v => { const yy = y - h * v / vmax; s += line(x - 4, yy, x, yy, C.muted, 1.2) + T(x - 7, yy, String(v), { a: 'r', size: 10.5, col: C.muted }); });
    if (lab) s += T(x - 4, y - h - 14, lab, { a: 'l', size: 11, col: C.muted, w: 600 });
    return { s, H: v => h * v / vmax };
  }
  const num = (x, d = 1) => { const v = +x; return (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v).toFixed(0) : v.toFixed(d)).replace('.', ',').replace('-', '−'); };

  return { C, f, G, esc, T, TN, wrap, title, panel, line, arrow, carrow, larrow, cross, waitBox, tag, readout, sides, memH, MH, closedMem, roundRectPts, circlePts, carrier,
    ribosome, mrna, chain, srp, srpR, sec61, spase, sq, ci, tri, pmark, glycan, bip, pdi, calnexin, ub, proteasome, eradCh, tmProt, m6pr, hydrolase, solProt, cisterna, axes, num,
    setPick: v => { PICK = !!v; }, get pick() { return PICK; } };
})();

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   stageView — возврат схемы на экран при запуске (телефон).
   Семинар 8 (из семинара 7 v1.5): формы мембраны MF не нужны; справка по деталям — группы data-g (GN.G), она включена
   всегда в практикуме, а на странице «Объяснений» не используется.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */
const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));
    btn.textContent = t(st.on ? 'tl_pause' : done ? 'tl_again' : calm.matches && o.steps ? 'tl_fwd' : 'tl_play');   /* рецензия v1.4, п. 18 */
    chips.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('done', T >= k + 1 - 1e-6); b.classList.toggle('cur', k === Math.min(i, stop - 1) && !(done && blocked));
      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */
    const Td = T > 1e-9 && T < stop - 1e-9 && Math.abs(T - Math.round(T)) < 1e-9 ? T - 1e-6 : T;

  function comb(n, k) { let c = 1; for (let i = 1; i <= k; i++) c = c * (n - k + i) / i; return Math.round(c); }

    return { copies: n, P_absent: r4(probs[0]), P_one_copy: r4(probs[1]), freq_if_one_copy: r4(1 / n), ratio_if_one_copy: r4((1 / n) / ps), P_at_least_one: r4(1 - probs[0]) };
  }

  /* ---------- вкладка 4: отбор, поток генов, драйв (07, 3.6) */
  const SEL_MODES = { directional: [1, 0.95, 0.9], overdominance: [0.8, 1, 0.6], underdominance: [1, 0.8, 1] };
  function selStep(p, w) { const q = 1 - p, wb = p * p * w[0] + 2 * p * q * w[1] + q * q * w[2]; return (p * p * w[0] + p * q * w[1]) / wb; }

  function driveTraj(k, p0 = 0.05, G = 60, w = DRIVE_W) { const out = [p0]; let p = p0; for (let g = 0; g < G; g++) { p = driveStep(p, k, w); out.push(p); } return out; }

  /* ---------- «Найти причину», вкладка 3 (07, 3.5) */
  const CASE3 = { N: 50, p0: 0.3, G: 60, w_against_A: [0.8, 0.9, 1] };

    ref.carriers_1_4900 = carriers(1 / 4900);
    ref.c1 = c1All().map(o => { const x = Object.assign({}, o); delete x._p_gametes; delete x._zyg; delete x._surv; delete x._adults; delete x._hw; return x; });
    ref.inbred_p07 = {}; for (const F of [0, 0.1, 0.25, 0.5, 1]) ref.inbred_p07[F === 0 ? '0.0' : F === 1 ? '1.0' : String(F)] = inbred(0.7, F);
    ref.struct = {}; for (const [a, b] of STRUCT_DELTAS) for (const F of STRUCT_F) ref.struct[`${a}-${b}|F=${F === 0 ? '0.0' : F}`] = struct(a, b, 0.5, F);

    ref.het_expected = {}; for (const N of DRIFT_NS) ref.het_expected[String(N)] = [0, 10, 50, 100].map(t => r4(hetExpected(0.5, N, t)));
    ref.ne_sex = {}; for (const [m, f] of [[20, 480], [250, 250], [5, 495], [1, 499]]) ref.ne_sex[`${m}/${f}`] = r4(neSex(m, f));

    ref.founder = { 'p=0.01,n=5': founder(0.01, 5), 'p=0.01,n=50': founder(0.01, 50) };

      for (const p0 of [0.1, 0.45, 0.55, 0.9]) tr[String(p0)] = selTraj(w, p0, 60).map(r4);

    for (const m of MIG_MS) { const k = m === 0 ? '0.0' : String(m); ref.mig_sel[k] = r4(migSelEquilibrium(m)); ref.mig_sel_traj[k] = selTraj(MIG_W, 0.5, 60, m, MIG_PM).map(r4); }

    ref.drive = {}; for (const k of DRIVE_K) { const tr = driveTraj(k); ref.drive[String(k)] = { traj: tr.map(r4), p_end: r4(tr[tr.length - 1]), wbar_end: r4(driveMeanFitness(tr[tr.length - 1])) }; }

    wf, fate, DRIFT_NS, DRIFT_P0, DRIFT_G, DRIFT_REPS, driftSeed, driftRun, driftRuns, BOTTLE, bottleSizes, bottleneckRuns, fixationCheck, fixsim, bottleneckHet,
    hetExpected, ne: { sex: neSex, harmonic }, neSex, harmonic, founder,

})();

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (ограничение 07, разд. 4; R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   s0y_oc_ui.js — помощники сцен семинара 1 (образец — семинар 12): вкладка из нескольких панелей (А, Б, В) с одной

/* шкала этапов вкладки (этап 1): план берётся у текущей панели (OC.*.plan); у панели без анимации шкала скрыта.

   конечный кадр — статичная схема; после смены условия — кадр «до начала» и пауза для прогноза; после ответа в сценарии — запуск. */

function ocTab(K, cfg){

     advHalt(K)           — остановить идущую анимацию сцены K (смена шага; иначе мелькает кадр результата);
     advStep(K, key, pre, apply) — шаг сценария сцены K с метаданными документа (ocStep) и остановкой анимации перед pre;

function advBase(K, P){

  tk.insertAdjacentHTML('beforebegin', `<div class="panel aprob anew" id="new${K}"><b class="k">${t('a_base_t')}</b>${paras}</div>`);

    hsc70: 'T21', e1: 'T03', e2: 'T04', e3: 'T05', receptor: 'T24', atg8: 'T25', mito_cargo: 'T26', hydrolase: 'T13', precursor_h: 'T13', lamp_limp: 'T39', glycan_l: 'T39',

    ub: '#8E44AD', p20: '#7C8DA6', p19: '#34495E', hyd: '#2E8B57', hplus: '#C0392B', el: '#D4A017', h2o2: '#E67E22', atp: '#2F6DB5',

  function LB(x, y, s, o = {}) {
    o = MIN(Object.assign({ size: 11.5, bg: true }, o));
    const lines = o.n ? F.wrap(String(s), o.n).split('\n') : [String(s)];
    const cw = ch => /[A-Z0-9]/.test(ch) ? .7 : /[a-z]/.test(ch) ? .56 : /[A-ZА-ЯЁ]/.test(ch) ? .7 : .6, bold = (o.w || 500) >= 700 ? 1.08 : 1;
    const sz = o.size, lh = sz * 1.22, wd = Math.max(...lines.map(l => [...l].reduce((a, ch) => a + cw(ch), 0))) * sz * bold + 8, a = o.a === 'l' ? 'l' : o.a === 'r' ? 'r' : 'c';
    const y0 = o.vc ? y - (lines.length - 1) * lh / 2 : y, x0 = a === 'l' ? x - 4 : a === 'r' ? x - wd + 4 : x - wd / 2;

  const box = (x, y, w, h, fill, st = C.line, rx = 8, extra = '') => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${rx}" fill="${fill}" stroke="${st}" stroke-width="1.2" ${extra}/>`;
  const ell = (cx, cy, rx, ry, fill, st = 'none', w = 1.2, extra = '') => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
  const circ = (cx, cy, r, fill, st = 'none', w = 1, extra = '') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}" stroke="${st}" stroke-width="${w}" ${extra}/>`;
  const sideFill = (x, y, w, h, kind) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${C[kind]}"/>`;
  const area = (x, y, s, kind, o = {}) => T(x, y, s, Object.assign({ a: 'l', size: 12, w: 700, it: true, col: { lumen: '#3E6A9A', cyto: '#8A7344', matrix: '#2E6B3A', ims: '#6A4C93', out: '#3E6A9A' }[kind] }, o));

  const ovalM = (cx, cy, rx, ry, fill, g) => G(g, ell(cx, cy, rx, ry, fill) + BF.bilayerPts(BF.ellipsePts(cx, cy, rx, ry, 80), { closed: true }));

    const o = arc(r + 12), i = arc(r), band = 'M' + o.map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' L' + i.reverse().map(p => f(p[0]) + ',' + f(p[1])).join(' L') + ' Z';

  }
  /* ---------- белки и метки */
  const ubChain = (x, y, n = 4, g = 'ub_chain') => G(g, line(x, y, x + (n - 1) * 8, y - 6, C.ub, 1.6) + Array.from({ length: n }, (_, i) => circ(x + i * 8, y - i * 2, 3.6, C.ub)).join(''));
  const ubMono = (x, y, g = 'ub_mono') => G(g, circ(x, y, 3.6, C.ub));
  const enzyme = (x, y, col = '#5D6D7E', r = 9, g = 'cargo1') => G(g, `<path d="M${f(x - r)},${f(y)} C${f(x - r)},${f(y - r * 1.2)} ${f(x + r)},${f(y - r * 1.2)} ${f(x + r)},${f(y)} C${f(x + r)},${f(y + r)} ${f(x - r * .3)},${f(y + r * 1.1)} ${f(x - r)},${f(y)} Z" fill="${col}" stroke="#2C3E50" stroke-width="1"/>`);

/* =====================================================================
   s6g_13route.js — сцены семинара 13 только для «Объяснений» (10: сцены GN.s13_r_*; паспорта шагов ·1, ·2, ·4, ·6, ·9, ·12, ·14, ·15, ·17,
   ·18, ·20, ·22, ·23, ·24, ·26, ·28, ·29, ·32). Детали — компонент «Популяция» (POPF: значки особей, копии, столбики, график) и цвета
   визуального словаря раздела. Числа — из моделей OC.* (эталон models_check.py); условные значения подписаны «условно» в строке статуса шага.
   Контракт: GN.<сцена>.view(args, t) → SVG 600 × 420; t — подписи шага (S.L). Мембран и химических формул нет. Русского текста здесь нет.
   ===================================================================== */
(function(){
  const Q = POPF, f = Q.f, C = Q.C, num = Q.num;
  const MUTED = '#8A97A8', HI = '#15202B', BOX = '#F3F5F8';
  const T = Q.T, LB = Q.LB;
  const nz = x => String(+(+x).toFixed(3)).replace('.', ',');
  const box = (x, y, w, h, on, extra = '') => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${on ? '#fff' : BOX}" stroke="${on ? HI : '#C9D3DF'}" stroke-width="${on ? 2 : 1.2}" ${extra}/>`;
  const rowIcons = (x, y, genos, r = 8, gap = 22) => genos.map((g, i) => Q.ind(x + i * gap, y, r, g)).join('');
  const countsHW = (p, n) => { const q = 1 - p, c = [Math.round(p * p * n), 0, 0]; c[2] = Math.round(q * q * n); c[1] = n - c[0] - c[2]; return c; };
  const reg = (name, fn) => { GN[name] = { view: (a, t) => Q.defs() + fn(a || {}, t) }; };

  /* ·1 популяция и особь: генотип особи постоянен, частоты меняются от поколения к поколению; выборка */
  reg('s13_r_generations', (a, t) => {
    let s = '';
    if (a.view === 'ind') {
      s += T(300, 40, t('r_gen_ind'), { size: 14, w: 800 }) + Q.arrow(110, 250, 500, 250, MUTED, 2);
      [['r_gen_child', 150, 22], ['r_gen_adult', 300, 30], ['r_gen_old', 450, 28]].forEach(([k, x, r]) => { s += Q.G('ind_Aa', Q.ind(x, 170, r, 'Aa')) + T(x, 280, t(k), { size: 13, w: 600 }); });
      return s;
    }
    if (a.view === 'gen') {
      [[.3, 'r_gen_g1'], [.5, 'r_gen_g2'], [.7, 'r_gen_g3']].forEach(([p, k], i) => { const c = countsHW(p, 20), g = Q.order(c, 1350 + i), y = 90 + i * 110, pp = (2 * c[0] + c[1]) / 40;
        s += T(20, y, t(k), { a: 'l', size: 13, w: 700 }) + Q.G('field', rowIcons(150, y, g, 8, 17)) + T(590, y, t('r_gen_p') + ' ' + num(pp, 2), { a: 'r', size: 12.5, w: 700 });
        if (i < 2) s += Q.arrow(330, y + 26, 330, y + 76, MUTED, 1.8); });
      return s;
    }
    const g = Q.order([18, 34, 28], 1361);
    s += Q.field({ x: 60, y: 60, cols: 16, gap: 30, r: 10, genos: g, title: { AA: 'AA', Aa: 'Aa', aa: 'aa' } });
    s += Q.G('field', `<rect x="${f(60 + 30 * 5 - 4)}" y="${f(60 + 30 * 1 - 4)}" width="${f(30 * 5 + 8)}" height="${f(30 * 3 + 8)}" rx="8" fill="none" stroke="${HI}" stroke-width="2.4" stroke-dasharray="7 4"/>`);
    return s + LB(60 + 30 * 7.5, 60 + 30 * 4 + 22, t('r_gen_sample'), { size: 12.5, w: 700 });
  });

  /* ·2 локус, аллель, генотип, гаплотип, гамета */
  const chromo = (x, y, w, col, marks) => `<rect x="${f(x)}" y="${f(y - 9)}" width="${f(w)}" height="18" rx="9" fill="${col}" stroke="#1B2631" stroke-width=".9"/>` + marks.map(([dx, s]) => `<rect x="${f(x + dx - 9)}" y="${f(y - 9)}" width="18" height="18" fill="#fff" opacity=".85"/>` + T(x + dx, y, s, { size: 12.5, w: 800 })).join('');
  const LC = '#AFC9DD', LO = '#F2CFA3';
  reg('s13_r_locus', (a, t) => {
    let s = '';
    if (a.obj === 'locus') {
      s += Q.G('locus', chromo(120, 140, 340, LC, [[190, 'A']]) + chromo(120, 200, 340, LO, [[190, 'a']]));
      s += `<rect x="296" y="116" width="28" height="108" fill="none" stroke="${HI}" stroke-width="2" stroke-dasharray="5 3"/>` + T(310, 100, t('r_loc_locus'), { size: 13, w: 800 });
      s += T(470, 140, t('r_loc_A'), { a: 'l', size: 12.5 }) + T(470, 200, t('r_loc_a'), { a: 'l', size: 12.5 }) + T(290, 260, t('r_loc_pair'), { size: 12.5, col: C.muted });
      return s;
    }
    if (a.obj === 'geno') {
      [['AA', LC, LC, 'A', 'A', 'r_loc_AA'], ['Aa', LC, LO, 'A', 'a', 'r_loc_Aa'], ['aa', LO, LO, 'a', 'a', 'r_loc_aa']].forEach(([g, c1, c2, l1, l2, k], i) => { const x = 50 + i * 180;
        s += Q.G('ind_' + g, chromo(x, 150, 130, c1, [[65, l1]]) + chromo(x, 190, 130, c2, [[65, l2]])) + Q.ind(x + 65, 250, 14, g) + T(x + 65, 290, t(k), { size: 12, w: 700 }); });
      return s;
    }
    if (a.obj === 'haplo') {
      s += Q.G('haplotype', chromo(120, 150, 360, LC, [[110, 'A'], [250, 'B']]) + chromo(120, 220, 360, LO, [[110, 'a'], [250, 'b']]));
      return s + T(300, 116, t('r_loc_hAB'), { size: 12.5, w: 700 }) + T(300, 256, t('r_loc_hab'), { size: 12.5, w: 700 });
    }
    s += Q.G('locus', chromo(120, 160, 160, LC, [[80, 'A']]) + chromo(120, 210, 160, LO, [[80, 'a']])) + Q.arrow(300, 185, 370, 185, MUTED, 2);
    s += Q.G('st_gametes', `<circle cx="460" cy="185" r="62" fill="#fff" stroke="${HI}" stroke-width="1.6"/>` + chromo(410, 185, 100, LC, [[50, 'A']]));
    return s + T(460, 270, t('r_loc_gam'), { size: 13, w: 700 }) + T(200, 250, t('r_loc_pair'), { size: 12, col: C.muted });
  });

  /* ·4 ожидаемые доли генотипов при частоте p: p², 2pq, q² */
  reg('s13_r_hwcurve', (a, t) => {
    const p = a.p == null ? .7 : a.p, X = v => 80 + v * 440, Y = v => 340 - v * 270;
    let s = Q.line(80, 340, 520, 340, C.axis, 1.2) + Q.line(80, 70, 80, 340, C.axis, 1.2);
    for (const v of [0, .5, 1]) s += T(X(v), 356, num(v, v === .5 ? 1 : 0), { size: 11 }) + T(72, Y(v), num(v, v === .5 ? 1 : 0), { a: 'r', size: 11 });
    s += T(520, 378, t('r_hw_x'), { a: 'r', size: 11.5, col: C.muted }) + T(80, 56, t('r_hw_y'), { a: 'l', size: 11.5, col: C.muted });
    const curve = (fn, col, dash) => `<polyline points="${Array.from({ length: 51 }, (_, i) => { const x = i / 50; return f(X(x)) + ',' + f(Y(fn(x))); }).join(' ')}" fill="none" stroke="${col}" stroke-width="2.4"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
    s += Q.G('bar_exp', curve(x => x * x, C.A) + curve(x => 2 * x * (1 - x), HI, '6 3') + curve(x => (1 - x) * (1 - x), C.a));
    s += T(X(.93), Y(.86) - 12, t('r_hw_p2'), { size: 12, w: 700, col: '#1F5F8B' }) + T(X(.07), Y(.86) - 12, t('r_hw_q2'), { size: 12, w: 700, col: '#B86A10' }) + T(X(.4), Y(.48) - 14, t('r_hw_2pq'), { size: 12, w: 700 });
    s += `<line x1="${f(X(p))}" y1="70" x2="${f(X(p))}" y2="340" stroke="${MUTED}" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    [[p * p, C.A], [2 * p * (1 - p), HI], [(1 - p) * (1 - p), C.a]].forEach(([v, col]) => { s += `<circle cx="${f(X(p))}" cy="${f(Y(v))}" r="5" fill="${col}"/>`; });
    s += T(540, 110, 'AA ' + nz(p * p), { a: 'l', size: 12.5, w: 700, col: '#1F5F8B' }) + T(540, 134, 'Aa ' + nz(2 * p * (1 - p)), { a: 'l', size: 12.5, w: 700 }) + T(540, 158, 'aa ' + nz((1 - p) * (1 - p)), { a: 'l', size: 12.5, w: 700, col: '#B86A10' });
    if (p === .5) s += LB(X(.5), Y(.5) + 22, t('r_hw_max'), { size: 11.5, col: C.muted });
    return s;
  });

  /* ·6 от доли больных к доле носителей (OC.carriers) и допущения расчёта */
  reg('s13_r_carriers', (a, t) => {
    const st = a.step || 1, c = OC.carriers(1 / 4900);
    let s = box(30, 60, 170, 130, st === 1) + T(115, 96, t('r_car_ill'), { size: 14, w: 800, col: '#B86A10' }) + Q.G('ind_aa', Q.ind(115, 140, 14, 'aa')) + T(115, 172, t('r_car_q'), { size: 12.5, w: 700 });
    s += Q.arrow(206, 125, 244, 125, st >= 2 ? HI : '#C9D3DF', 2);
    s += box(250, 60, 170, 130, st === 2, st < 2 ? 'opacity=".45"' : '') + T(335, 96, t('r_car_carr'), { size: 14, w: 800 }) + Q.G('ind_Aa', Q.ind(335, 140, 14, 'Aa')) + T(335, 172, t('r_car_2pq', { v: num(c.carriers, 3) }), { size: 12.5, w: 700 });
    s += T(500, 125, t('r_car_35'), { size: 13, w: 800, n: 12 });
    s += box(30, 220, 540, 150, st === 3, st < 3 ? 'opacity=".45"' : '') + T(50, 246, t('r_car_ass'), { a: 'l', size: 13, w: 700, col: C.muted });
    ['r_car_a1', 'r_car_a2', 'r_car_a3', 'r_car_a4'].forEach((k, i) => { s += T(60, 278 + i * 24, '• ' + t(k), { a: 'l', size: 12.5 }); });
    return s;
  });

  /* ·9 случайное скрещивание, инбридинг, ассортативное скрещивание */
  reg('s13_r_mating', (a, t) => {
    const m = a.m || 'random';
    let s = '';
    if (m === 'random') {
      const L = Q.order([2, 3, 1], 1371), R = Q.order([1, 3, 2], 1372), pair = [3, 0, 5, 1, 4, 2];
      L.forEach((g, i) => { s += Q.ind(150, 80 + i * 50, 14, g); }); R.forEach((g, i) => { s += Q.ind(450, 80 + i * 50, 14, g); });
      pair.forEach((j, i) => { s += Q.line(166, 80 + i * 50, 434, 80 + j * 50, MUTED, 1.4); });
      return s + T(300, 390, t('r_mat_rand'), { size: 12.5, w: 700 });
    }
    if (m === 'inbred') {
      s += Q.G('inbreeding', `<rect x="285" y="40" width="30" height="30" fill="#fff" stroke="${HI}" stroke-width="1.6"/>`) + T(300, 26, t('r_mat_anc'), { size: 12.5, w: 700 });
      s += Q.line(300, 70, 200, 130, HI, 1.6) + Q.line(300, 70, 400, 130, HI, 1.6) + `<circle cx="200" cy="145" r="15" fill="#fff" stroke="${HI}" stroke-width="1.6"/><circle cx="400" cy="145" r="15" fill="#fff" stroke="${HI}" stroke-width="1.6"/>`;
      s += Q.line(200, 160, 220, 220, HI, 1.6) + Q.line(400, 160, 380, 220, HI, 1.6) + `<rect x="205" y="220" width="30" height="30" fill="#fff" stroke="${HI}" stroke-width="1.6"/><circle cx="380" cy="235" r="15" fill="#fff" stroke="${HI}" stroke-width="1.6"/>`;
      s += Q.line(235, 235, 365, 235, HI, 1.6) + Q.line(236, 241, 364, 241, HI, 1.6) + Q.line(300, 241, 300, 290, HI, 1.6) + Q.G('ind_aa', Q.ind(300, 310, 16, 'aa'));
      return s + T(480, 110, t('r_mat_ped'), { a: 'l', size: 12, col: C.muted }) + T(300, 370, t('r_mat_all'), { size: 12.5, w: 700 });
    }
    const H = [40, 44, 70, 74, 104, 108];
    H.forEach((h, i) => { const x = 110 + i * 70; s += `<rect x="${x}" y="${f(300 - h * 2)}" width="30" height="${f(h * 2)}" rx="4" fill="${i % 2 ? '#B7C0CB' : '#8A97A8'}"/>`; });
    [0, 2, 4].forEach(i => { s += Q.line(125 + i * 70, 318, 195 + i * 70, 318, HI, 2) + Q.line(125 + i * 70, 310, 125 + i * 70, 318, HI, 2) + Q.line(195 + i * 70, 310, 195 + i * 70, 318, HI, 2); });
    return s + T(300, 346, t('r_mat_sim'), { size: 12.5, w: 700 }) + T(300, 372, t('r_mat_trait'), { size: 12, col: C.muted });
  });

  /* ·12 четыре причины дефицита гетерозигот: какие данные что покажут (те же результаты, что в «Найти причину», случай II) */
  reg('s13_r_causes', (a, t) => {
    const cause = a.cause || 'inbred', col = { inbred: 1, struct: 2, sel: 3, error: 4 }[cause];
    let s = T(300, 26, t('r_cau_def'), { size: 13, w: 800 }) + T(300, 48, t('c2_c' + col), { size: 13.5, w: 800, col: HI });
    /* результаты — те же классы, что в «Найти причину», случай II (s9z_case.js; Решения_сборки, С-22): неразличимые результаты — одной формулировкой */
    /* «г) другие локусы» — дословно ячейки 02 (рецензия И-06): схема показывает одну причину, сравнения классов здесь нет */
    const V = { 1: { 1: 'c2_v_m1_same', 3: 'c2_v_m1_same', 4: 'c2_v_m1_same' }, 2: { 2: 'c2_v_m2_no', 3: 'c2_v_m2_no', 4: 'c2_v_m2_no' },
                3: { 1: 'c2_v_m3_born', 2: 'c2_v_m3_born', 4: 'c2_v_m3_born' }, 5: { 1: 'c2_v_m5_conf', 2: 'c2_v_m5_conf', 3: 'c2_v_m5_conf' } };
    [1, 2, 3, 5, 4].forEach((m, i) => { const y = 84 + i * 62;
      s += box(20, y, 560, 52, false) + T(36, y + 16, t('c2_m' + m), { a: 'l', size: 12, w: 700, col: C.muted, n: 70 }) + T(36, y + 38, t((V[m] && V[m][col]) || ('c2_r' + m + '_' + col)), { a: 'l', size: 12.5, w: 800, n: 70 }); });
    return s;
  });

  /* ·14 одинаковый дефицит от структуры и от инбридинга (OC.struct, OC.inbred) */
  reg('s13_r_twocauses', (a, t) => {
    const c = a.c || 1;
    const R = c === 1 ? OC.struct(.9, .3) : c === 3 ? OC.struct(.9, .3, .5, .25) : c === 4 ? OC.struct(.9, .3, .8) : null;
    const H = R ? R.H_obs : 2 * .6 * .4 * (1 - .375), E = R ? R.H_exp : .48;
    const base = 330, sc = 400;
    let s = T(300, 26, t('r_two_t' + c), { size: 13.5, w: 800 });
    s += Q.G('bar_obs', `<rect x="200" y="${f(base - H * sc)}" width="70" height="${f(H * sc)}" fill="url(#popHatch)" stroke="#1B2631" stroke-width=".8"/>`) + T(235, base - H * sc - 12, nz(H), { size: 12.5, w: 800 });
    s += Q.G('bar_exp', `<rect x="330" y="${f(base - E * sc)}" width="70" height="${f(E * sc)}" fill="none" stroke="${HI}" stroke-width="1.8" stroke-dasharray="5 3"/>`) + T(365, base - E * sc - 12, nz(E), { size: 12.5, w: 800 });
    s += Q.line(160, base, 440, base, C.axis, 1.2) + T(235, base + 16, t('r_two_h'), { size: 12 }) + T(365, base + 16, t('r_two_exp'), { size: 12 });
    s += Q.G('deficit', `<path d="M300,${f(base - E * sc)} H292 V${f(base - H * sc)} H300" fill="none" stroke="${C.def}" stroke-width="2.4"/>`);
    s += T(300, 380, t('r_two_in' + c), { size: 12.5, n: 80 });
    return s;
  });

  /* ·15 одно поколение дрейфа: 20 копий, случайная выборка, новая частота; закрепление */
  reg('s13_r_sampling', (a, t) => {
    const st = a.st || 1;
    const row = (y, nA, n, show) => { let s = ''; for (let i = 0; i < n; i++) s += show ? Q.copy(110 + i * 20, y, 7, i < nA ? 'A' : 'a') : `<circle cx="${110 + i * 20}" cy="${y}" r="7" fill="#E3E8EE" stroke="#C9D3DF"/>`; return s; };
    let s = T(20, 70, t('r_smp_g0'), { a: 'l', size: 12, w: 700 }) + Q.G('copy_A', row(100, 10, 20, true)) + T(110, 126, t('r_smp_10A') + ' · ' + t('r_smp_10a'), { a: 'l', size: 12 });
    s += Q.arrow(300, 140, 300, 190, st >= 2 ? HI : '#C9D3DF', 2) + T(316, 166, t('r_smp_draw'), { a: 'l', size: 12, w: 700 });
    s += T(20, 214, t('r_smp_g1'), { a: 'l', size: 12, w: 700 }) + Q.G('copy_A', row(244, 13, 20, st >= 3)) + (st >= 3 ? T(110, 270, t('r_smp_13A') + ' · ' + t('r_smp_7a') + ' · ' + t('r_smp_p065'), { a: 'l', size: 12, w: 700 }) : '');
    if (st >= 4) s += T(20, 318, t('r_smp_fix'), { a: 'l', size: 12, w: 700 }) + Q.G('fixed', row(348, 20, 20, true)) + T(110, 374, t('r_smp_fixed'), { a: 'l', size: 12, w: 800 });
    return s;
  });

  /* ·17 эффективная численность по соотношению полов (OC.neSex) */
  reg('s13_r_ne', (a, t) => {
    const m = a.m || 250, fm = a.f || 250, ne = OC.neSex(m, fm), W = v => 330 * v / 500;
    let s = T(20, 30, t('r_ne_n'), { a: 'l', size: 13, w: 700, col: C.muted });
    s += Q.G('popsize', `<rect x="240" y="60" width="${f(Math.max(W(m), 1.5))}" height="34" fill="#7F8C9A"/><rect x="240" y="110" width="${f(W(fm))}" height="34" fill="#B7C0CB"/>`);
    s += T(230, 77, t('r_ne_m') + ': ' + m, { a: 'r', size: 12.5, w: 700 }) + T(230, 127, t('r_ne_f') + ': ' + fm, { a: 'r', size: 12.5, w: 700 });
    s += T(40, 190, 'Ne = 4 × Nm × Nf / (Nm + Nf)', { a: 'l', size: 13 });
    s += Q.G('ne', `<rect x="240" y="230" width="${f(W(ne))}" height="40" fill="${C.sel}"/><rect x="240" y="230" width="${W(500)}" height="40" fill="none" stroke="${HI}" stroke-dasharray="5 3"/>`);
    return s + T(230, 250, t('r_ne_ne'), { a: 'r', size: 12.5, w: 700 }) + T(240, 296, 'Ne = ' + String(+ne.toFixed(1)).replace('.', ','), { a: 'l', size: 15, w: 800, col: C.sel });
  });

  /* ·18 три причины, по которым Ne меньше фактической численности */
  reg('s13_r_necauses', (a, t) => {
    const c = a.c || 'sex';
    let s = T(300, 26, t('r_nec_' + c), { size: 13.5, w: 800 });
    if (c === 'sex') { const ne = OC.neSex(20, 480);
      s += `<rect x="240" y="80" width="13.2" height="34" fill="#7F8C9A"/><rect x="240" y="130" width="316.8" height="34" fill="#B7C0CB"/>` + T(230, 97, '20 ♂', { a: 'r', size: 12.5, w: 700 }) + T(230, 147, '480 ♀', { a: 'r', size: 12.5, w: 700 });
      return s + Q.G('ne', `<rect x="240" y="210" width="${f(330 * ne / 500)}" height="34" fill="${C.sel}"/>`) + T(230, 227, t('r_nec_ne'), { a: 'r', size: 12.5, w: 700 }) + T(240 + 330 * ne / 500 + 10, 227, '76,8', { a: 'l', size: 14, w: 800, col: C.sel }); }
    if (c === 'family') { const K = [14, 9, 2, 1, 1, 1, 0, 1, 0, 1];   /* условно: потомков у 10 родителей */
      K.forEach((k, i) => { const x = 90 + i * 44; s += `<rect x="${x}" y="${f(330 - k * 16)}" width="30" height="${f(k * 16)}" fill="${i < 2 ? HI : '#B7C0CB'}"/>` + T(x + 15, 344, String(i + 1), { size: 11 }); });
      return s + T(300, 372, t('r_nec_par'), { size: 12, col: C.muted }) + T(90, 80, t('r_nec_kids'), { a: 'l', size: 12, w: 700 }); }
    const sz = [1000, 1000, 10, 1000, 1000], hm = OC.harmonic(sz), am = sz.reduce((x, y) => x + y) / sz.length, base = 330, Hh = v => 220 * v / 1000;
    sz.forEach((n, i) => { const x = 110 + i * 84; s += Q.G('popsize', `<rect x="${x}" y="${f(base - Hh(n))}" width="50" height="${f(Math.max(Hh(n), 1.5))}" fill="#B7C0CB" stroke="#7F8C9A"/>`) + T(x + 25, base + 14, 'N = ' + n, { size: 11.5 }); });
    s += `<line x1="90" y1="${f(base - Hh(am))}" x2="530" y2="${f(base - Hh(am))}" stroke="${MUTED}" stroke-width="1.6" stroke-dasharray="3 3"/>` + LB(560, base - Hh(am) - 2, t('r_nec_am') + ' ' + Math.round(am), { a: 'r', size: 11.5 });
    s += Q.G('ne', `<line x1="90" y1="${f(base - Hh(hm))}" x2="530" y2="${f(base - Hh(hm))}" stroke="${C.sel}" stroke-width="2.2" stroke-dasharray="6 4"/>`) + LB(560, base - Hh(hm) - 14, t('r_nec_ne') + ' ≈ ' + String(+hm.toFixed(1)).replace('.', ','), { a: 'r', size: 11.5, w: 700, col: C.sel });

const casePositive = (spec, m, truth) => spec.pos ? (spec.pos[m] || []).includes(truth) && spec.causes.every(c => c === truth || spec.meth[m][c] !== spec.meth[m][truth])

function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;
