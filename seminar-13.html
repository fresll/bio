опии аутосомного локуса", "t1_s1_q": "Какова частота аллеля A?", "t1_s1_o1": "0,70", "t1_s1_x1": "Да: копий A — 2 × 98 + 84 = 280 из 400", "t1_s1_o2": "0,49", "t1_s1_x2": "0,49 — доля особей AA, а не доля копий A", "t1_s1_o3": "0,91", "t1_s1_x3": "0,91 — доля особей, у которых есть хотя бы одна копия A", "t1_s1_h1": "Что считают — особей или копии?", "t1_s1_h2": "Сколько копий A у особи AA и у особи Aa?", "t1_s1_h3": "Сложите копии A и разделите на 400", "t1_s1_e": "Частота аллеля — доля копий, а не доля особей. Её нельзя путать ни с долей гомозигот, ни с долей носителей", "t1_s2_title": "Ожидание и наблюдение", "t1_s2_cond": "Вторая выборка из 200 особей: 108 AA, 64 Aa, 28 aa. Частоту аллеля A вы уже умеете считать", "t1_s2_q": "Какую долю гетерозигот ожидает нулевая модель и какая наблюдается?", "t1_s2_o1": "Ожидается 0,42, наблюдается 0,32", "t1_s2_x1": "Да: p = 0,7, 2pq = 0,42; в выборке 64 из 200", "t1_s2_o2": "Ожидается 0,50 — половина особей", "t1_s2_x2": "Половина гетерозигот ожидается только при p = 0,5", "t1_s2_o3": "Ожидается 0,32 — как наблюдается", "t1_s2_x3": "Ожидание считают по частоте аллеля, а не по самим генотипам", "t1_s2_h1": "Сначала найдите p", "t1_s2_h2": "Какой формулой модель задаёт долю Aa?", "t1_s2_h3": "2 × 0,7 × 0,3", "t1_s2_e": "Частота аллеля в двух выборках одинакова (0,7), а доли генотипов разные. Отклонение от нулевой модели говорит, что нарушено хотя бы одно допущение, но не говорит какое (вкладка 2)", "t1_s3_title": "Снимаем «случайное скрещивание»", "t1_s3_cond": "Взрослые при p = 0,7 — в равновесии. Особи скрещиваются чаще с родственниками (мера инбридинга F = 0,25). Остальные допущения выполнены. Смотрим взрослых следующего поколения", "t1_s3_q": "Что изменится за одно поколение?", "t1_s3_o1": "Только пропорции генотипов", "t1_s3_x1": "Да: гомозигот станет больше, а копий A и a — столько же", "t1_s3_o2": "Только частоты аллелей", "t1_s3_x2": "Выбор партнёра не создаёт и не уничтожает копий аллелей", "t1_s3_o3": "И частоты аллелей, и пропорции", "t1_s3_x3": "Частота A остаётся 0,7: изменилось только сочетание копий в особях", "t1_s3_h1": "Меняет ли выбор партнёра число копий A в гаметах?", "t1_s3_h2": "Что происходит с вероятностью встречи двух одинаковых копий?", "t1_s3_h3": "Инбридинг перераспределяет аллели между генотипами", "t1_s3_e": "Неслучайное скрещивание меняет генотипическую структуру, но не частоты аллелей. Это единственное из пяти допущений, нарушение которого само не меняет частот", "t1_s4_title": "Снимаем «нет миграции»", "t1_s4_cond": "Пятая часть родителей нового поколения — мигранты, у которых частота A равна 0,2. Скрещивание случайное, остальные допущения выполнены", "t1_s4_q": "Какой будет частота A у потомков?", "t1_s4_o1": "0,6; генотипы — в равновесии при 0,6", "t1_s4_x1": "Да: 0,8 × 0,7 + 0,2 × 0,2 = 0,6, а случайное скрещивание даёт 0,36 / 0,48 / 0,16", "t1_s4_o2": "0,7: мигранты растворятся в популяции", "t1_s4_x2": "Каждый мигрант приносит свои копии, и их доля в генофонде равна доле мигрантов", "t1_s4_o3": "0,2 — как у мигрантов", "t1_s4_x3": "Мигрантов только пятая часть; частота — среднее, взвешенное по долям", "t1_s4_h1": "Какая доля копий пришла с мигрантами?", "t1_s4_h2": "Частота в смеси — средняя, взвешенная по долям", "t1_s4_h3": "0,8 × 0,7 + 0,2 × 0,2", "t1_s4_e": "Поток генов сдвигает частоту к частоте у мигрантов на величину, пропорциональную доле мигрантов и разности частот. Генотипы потомков в равновесии, потому что скрещивание случайное", "t1_s5_title": "Снимаем «нет мутаций»", "t1_s5_cond": "За поколение каждая копия A с вероятностью 1 на 100 000 превращается в a (условная скорость мутаций). Остальные допущения выполнены", "t1_s5_q": "Как изменится частота A за одно поколение?", "t1_s5_o1": "Уменьшится на миллионные доли", "t1_s5_x1": "Да: 0,7 → 0,699993; за поколение мутации сдвигают частоту очень мало", "t1_s5_o2": "Не изменится: мутации не меняют частот", "t1_s5_x2": "Каждая мутация A → a уменьшает число копий A", "t1_s5_o3": "Заметно уменьшится уже в этом поколении", "t1_s5_x3": "При такой скорости мутаций изменение за поколение — 7 миллионных", "t1_s5_h1": "Какая доля копий A мутирует за поколение?", "t1_s5_h2": "p × 10⁻⁵", "t1_s5_h3": "0,7 × 0,00001 = 0,000007", "t1_s5_e": "Мутации создают новые варианты, но сами по себе меняют частоты медленно. Заметный сдвиг частоты за немногие поколения создают другие процессы", "t1_s6_title": "Снимаем «нет отбора»", "t1_s6_cond": "Доля доживающих до размножения у особей aa составляет 0,6 от доли у AA и Aa (условные относительные приспособленности 1; 1; 0,6). Скрещивание случайное, остальные допущения выполнены. Смотрим взрослых следующего поколения", "t1_s6_q": "Что изменится у взрослых?", "t1_s6_o1": "И частота A, и доли генотипов", "t1_s6_x1": "Да: частота A 0,726, а aa меньше, чем ожидается при этой частоте", "t1_s6_o2": "Только доля aa; частота A та же", "t1_s6_x2": "Гибнущие особи aa уносят копии a, поэтому частота A растёт", "t1_s6_o3": "Только частота A; доли — как в модели", "t1_s6_x3": "Отбор идёт после образования зигот: у взрослых aa меньше, чем ждёт модель", "t1_s6_h1": "Чьи копии реже попадают во взрослых?", "t1_s6_h2": "Сравните долю aa у взрослых с q² для новой частоты", "t1_s6_h3": "Отбор меняет и частоты, и доли", "t1_s6_e": "Отбор по выживанию меняет частоты аллелей направленно; в этой модели у взрослых доли генотипов ещё и отклоняются от ожидания по новой частоте (при некоторых соотношениях приспособленностей такого отклонения нет). Модель предсказывает это для одного поколения; в эксперименте такое отклонение поддерживает гипотезу отбора, но не доказывает её без данных о выживании", "t1_s7_title": "Как применяют нулевую модель: оценка частоты носителей", "t1_s7_cond": "Аутосомно-рецессивное заболевание встречается у 1 из 4900 новорождённых в условной популяции. Скрещивание случайное, структуры нет, все патогенные варианты считаем одним аллелем a, заболевание проявляется у каждого aa", "t1_s7_q": "Какая доля людей — гетерозиготные носители?", "t1_s7_o1": "Около 1 из 35", "t1_s7_x1": "Да: q = 1/70; 2pq ≈ 0,028 — примерно 1 из 35", "t1_s7_o2": "1 из 70", "t1_s7_x2": "1/70 — это частота аллеля a, а не доля носителей", "t1_s7_o3": "1 из 4900 — как больных", "t1_s7_x3": "Носителей намного больше: почти все копии a — в гетерозиготах", "t1_s7_h1": "Какой генотип у больных и какой формулой задана его доля?", "t1_s7_h2": "q² = 1/4900", "t1_s7_h3": "Найдите q и посчитайте 2pq", "t1_s7_e": "Клинический пример приводится для демонстрации значения эволюционного механизма. Расчёт верен только при названных допущениях. При популяционной структуре, нескольких разных патогенных вариантах, неполном проявлении или эффекте основателя реальная доля носителей отличается от этой оценки", "t2_title": "Структура популяции", "t2_rules": "Две группы одинаковой численности; внутри каждой скрещивание случайное (или с инбридингом F), между группами — нет. Доля гетерозигот в объединённой выборке равна средней доле гетерозигот в группах. Её сравнивают с ожиданием 2p̄q̄ по общей частоте p̄. Разность равна удвоенной дисперсии частот между группами. Инбридинг умножает долю гетерозигот на (1 − F) и не меняет частоты аллелей. Значения F условные", "t2_lim": "Модель не показывает обмена особями между группами, разной численности групп (это случай продвинутого шага), отбора и дрейфа. Она описывает один локус; в реальной выборке по многим локусам картина структуры и инбридинга различается", "t2_how": "Дефицит гетерозигот при объединении групп с разными частотами следует из той же модели Харди–Вайнберга, применённой к каждой группе отдельно и к объединённой выборке. Меру различия частот между группами вводят через долю гетерозигот внутри групп и в объединённой выборке", "t2_s1_title": "Две группы в одну выборку", "t2_s1_cond": "Две равные группы по 100 особей. В первой частота A — 0,9, во второй — 0,3; в каждой группе скрещивание случайное и доли генотипов в равновесии. Генетики, не зная о группах, обследовали всех 200 особей как одну выборку", "t2_s1_q": "Какой окажется доля гетерозигот в объединённой выборке по сравнению с ожиданием по общей частоте?", "t2_s1_o1": "0,30 против 0,48 — дефицит", "t2_s1_x1": "Да: в группах гетерозигот 0,18 и 0,42, в среднем 0,30, а при общей частоте 0,6 модель ждёт 0,48", "t2_s1_o2": "0,48 — как по общей частоте", "t2_s1_x2": "Внутри групп гетерозигот меньше, чем при частоте 0,6: группы различаются", "t2_s1_o3": "Больше 0,48 — избыток", "t2_s1_x3": "Смешение групп при подсчёте не создаёт новых гетерозигот", "t2_s1_h1": "Посчитайте долю Aa в каждой группе отдельно", "t2_s1_h2": "Чему равна общая частота A?", "t2_s1_h3": "Сравните среднее 2pq групп с 2 × 0,6 × 0,4", "t2_s1_e": "Каждая группа в равновесии, но объединённая выборка — нет. Дефицит гетерозигот при объединении групп с разными частотами называют эффектом Валунда", "t2_s2_title": "Группы с одинаковой частотой", "t2_s2_cond": "Те же две группы, но теперь в обеих частота A равна 0,6", "t2_s2_q": "Будет ли дефицит гетерозигот в объединённой выборке?", "t2_s2_o1": "Нет: 0,48 и 0,48", "t2_s2_x1": "Да: группы не различаются по частоте, и объединение ничего не меняет", "t2_s2_o2": "Да, тот же 0,18", "t2_s2_x2": "Дефицит возникает из различия частот между группами, а его здесь нет", "t2_s2_o3": "Будет избыток гетерозигот", "t2_s2_x3": "Избыток при объединении не возникает ни при каком различии", "t2_s2_h1": "Что породило дефицит в шаге 2.1?", "t2_s2_h2": "Чем различаются группы теперь?", "t2_s2_h3": "Дефицит равен удвоенной дисперсии частот", "t2_s2_e": "Дефицит при объединении тем больше, чем сильнее различаются частоты групп. Сама по себе разделённость популяции без различия частот дефицита не даёт", "t2_s3_title": "Инбридинг и частота аллеля", "t2_s3_cond": "Одна популяция, частота A — 0,7. Особи скрещиваются с родственниками чаще, чем при случайном выборе партнёра (F = 0,25)", "t2_s3_q": "Что произойдёт с частотой аллеля a?", "t2_s3_o1": "Не изменится; гомозигот станет больше", "t2_s3_x1": "Да: инбридинг перераспределяет копии между генотипами", "t2_s3_o2": "Вырастет, потому что aa станет больше", "t2_s3_x2": "aa больше, но и гетерозигот меньше: копий a столько же", "t2_s3_o3": "Упадёт: аллель a будет вытесняться", "t2_s3_x3": "В модели нет отбора; инбридинг сам по себе частот не меняет", "t2_s3_h1": "Сколько копий a у особи aa и у особи Aa?", "t2_s3_h2": "Посчитайте q по долям генотипов", "t2_s3_h3": "0,1425 + 0,315 / 2 = 0,3", "t2_s3_e": "Инбридинг повышает долю гомозигот по всем локусам, не меняя частот аллелей. Доля рецессивных гомозигот выросла в 1,6 раза (0,09 → 0,1425): поэтому при родственных браках чаще проявляются редкие рецессивные варианты", "t2_s4_title": "Разделить снова", "t2_s4_cond": "В объединённой выборке из шага 2.1 дефицит гетерозигот 0,18. Генетики узнали, из какой группы каждая особь, и считают каждую группу отдельно", "t2_s4_q": "Что покажет проверка каждой группы по нулевой модели?", "t2_s4_o1": "Обе группы в равновесии", "t2_s4_x1": "Да: дефицит был свойством объединённой выборки, а не групп", "t2_s4_o2": "В обеих тот же дефицит 0,18", "t2_s4_x2": "В группах доля гетерозигот равна 2pq своей частоты", "t2_s4_o3": "В группах окажется избыток", "t2_s4_x3": "Внутри групп скрещивание случайное: ни избытка, ни дефицита", "t2_s4_h1": "Как скрещиваются особи внутри групп?", "t2_s4_h2": "Какую частоту брать для ожидания в группе?", "t2_s4_h3": "0,9 → 0,18; 0,3 → 0,42", "t2_s4_e": "Один и тот же дефицит гетерозигот возникает и от инбридинга, и от скрытой структуры. Отличить их помогают сведения о происхождении образцов и о родстве (режим «Найти причину»)", "t3_title": "Случайность и численность", "t3_rules": "Модель Райта–Фишера: в каждом поколении N особей; их 2N копий гена набираются случайно из копий предыдущего поколения, вероятность взять копию A равна её частоте. Отбора, мутаций и миграции нет, поколения не перекрываются. Повторы — независимые популяции с одинаковыми условиями; одна и та же кнопка всегда даёт одну и ту же картину", "t3_lim": "Модель не показывает отбора и мутаций, поэтому потерянный аллель не возвращается. Реальная популяция почти никогда не бывает идеальной: её эффективная численность меньше числа особей", "t3_how": "Теорию случайного изменения частот в конечной популяции построили основатели популяционной генетики. В лаборатории её проверили на 107 одинаковых популяциях дрозофил по 16 особей: частоты расходились, аллели закреплялись и терялись, гетерозиготность снижалась, причём быстрее, чем предсказывала численность 16, — как при эффективной численности около 9", "t3_s1_title": "Повторы при разной численности", "t3_s1_cond": "Начальная частота A — 0,5. Отбора, мутаций и миграции нет. Наблюдаем 10 независимых популяций по 10 особей и 10 популяций по 1000 особей в течение 100 поколений", "t3_s1_q": "Что будет с частотой A через 100 поколений?", "t3_s1_o1": "При N = 10 аллель почти везде потерян или закреплён", "t3_s1_x1": "Да: при малой численности случайные сдвиги за поколение велики, и частота быстро доходит до 0 или 1", "t3_s1_o2": "При N = 1000 разброс больше: больше особей", "t3_s1_x2": "Наоборот: чем больше копий в выборке, тем меньше случайное отклонение за поколение", "t3_s1_o3": "Везде около 0,5: у дрейфа нет направления", "t3_s1_x3": "Направления нет, но в каждой популяции частота блуждает и уходит от 0,5", "t3_s1_h1": "От чего зависит случайное отклонение частоты в выборке?", "t3_s1_h2": "Сравните выборку из 20 и из 2000 копий", "t3_s1_h3": "Посмотрите, где частота останавливается навсегда", "t3_s1_e": "Генетический дрейф — случайное изменение частот из-за конечного числа копий, переданных потомкам. Он действует в популяции любой конечной численности, но в малой меняет частоты быстрее", "t3_s2_title": "Почему A закрепился в семи повторах?", "t3_s2_cond": "В десяти популяциях по 10 особей аллель A закрепился в семи и потерян в трёх. Преимущества у A в модели нет", "t3_s2_q": "Почему A закрепился в большинстве повторов?", "t3_s2_o1": "Случайно: в других повторах было бы иначе", "t3_s2_x1": "Да: при начальной частоте 0,5 закрепление и потеря равновероятны; 7 из 10 — колебание малой выборки", "t3_s2_o2": "A полезнее, и отбор его поддержал", "t3_s2_x2": "В модели все генотипы оставляют потомков с равной вероятностью", "t3_s2_o3": "Мутации превращали a в A", "t3_s2_x3": "В модели мутаций нет: копии только копируются", "t3_s2_h1": "Есть ли в модели различия в выживании?", "t3_s2_h2": "Чему равна вероятность закрепления нейтрального аллеля?", "t3_s2_h3": "Она равна его начальной частоте", "t3_s2_e": "Дрейф не направлен к повышению приспособленности. «Случайно» не значит «без причины»: причина — конечное число копий, а исход каждого повтора непредсказуем", "t3_s3_title": "Эффективная численность", "t3_s3_cond": "В популяции 500 взрослых животных. Размножаются только 20 самцов и 480 самок", "t3_s3_q": "Какова эффективная численность по соотношению полов?", "t3_s3_o1": "Около 77", "t3_s3_x1": "Да: 4 × 20 × 480 / (20 + 480) = 76,8", "t3_s3_o2": "500 — все взрослые", "t3_s3_x2": "Половина генов потомства приходит от 20 самцов: генофонд проходит через узкое звено", "t3_s3_o3": "20 — по числу самцов", "t3_s3_x3": "Самки тоже передают гены; Ne больше 20, но намного меньше 500", "t3_s3_h1": "Ne = 4 × Nm × Nf / (Nm + Nf), где Nm — число размножающихся самцов, Nf — самок", "t3_s3_h2": "4 × 20 × 480 = 38 400", "t3_s3_h3": "38 400 / 500", "t3_s3_e": "Эффективная численность — численность идеальной популяции, в которой дрейф шёл бы с той же скоростью. Неравное число размножающихся самцов и самок, разброс числа потомков и колебания численности делают её меньше фактической", "t3_s4_title": "Узкое место", "t3_s4_cond": "Популяция из 1000 особей, частота A — 0,5. В поколениях 21–23 численность падает до 10, затем снова 1000", "t3_s4_q": "Восстановится ли разнообразие после того, как численность снова станет 1000?", "t3_s4_o1": "Нет: утраченное не вернётся само", "t3_s4_x1": "Да: снизившаяся гетерозиготность и сдвиг частот сохранятся; потерянный аллель без мутаций и миграции не появится", "t3_s4_o2": "Да: вернётся численность — вернётся разнообразие", "t3_s4_x2": "Численность восстанавливают потомки немногих выживших, и они несут только их копии", "t3_s4_o3": "Да, через три поколения", "t3_s4_x3": "Три поколения — длительность сокращения, а не срок восстановления", "t3_s4_h1": "Сколько копий проходит через узкое место?", "t3_s4_h2": "Откуда могли бы взяться новые варианты?", "t3_s4_h3": "В модели нет мутаций и миграции", "t3_s4_e": "Узкое место — резкое сокращение численности; выжившие несут лишь часть прежнего разнообразия. Долговременная эффективная численность сильнее зависит от поколений с малой численностью, чем от периодов роста", "t3_s5_title": "Эффект основателя", "t3_s5_cond": "В большой популяции частота варианта — 0,01. Пятеро переселенцев (10 копий гена) основали изолированную группу; среди основателей оказалась одна копия варианта", "t3_s5_q": "Какой будет частота варианта в новой группе сразу после её основания?", "t3_s5_o1": "0,1 — в десять раз выше", "t3_s5_x1": "Да: 1 копия из 10. Причина — случайный состав основателей, а не преимущество варианта", "t3_s5_o2": "0,01 — как в исходной популяции", "t3_s5_x2": "Частоту определяют копии основателей, а их всего 10", "t3_s5_o3": "0,2 — один основатель из пяти", "t3_s5_x3": "Считают копии: у носителя одна копия варианта из двух", "t3_s5_h1": "Сколько копий гена у пяти диплоидных особей?", "t3_s5_h2": "Сколько из них — копии варианта?", "t3_s5_h3": "1 / 10", "t3_s5_e": "Эффект основателя — изменение частот при основании группы немногими особями. Высокая частота варианта в изолированной группе может быть следствием случая и последующего роста численности, а не его пользы", "t3_s6_title": "Есть ли дрейф в большой популяции?", "t3_s6_cond": "Популяция из 1000 особей, частота A — 0,5, без катастроф и сокращений численности", "t3_s6_q": "Действует ли в ней генетический дрейф?", "t3_s6_o1": "Да, но частота меняется медленнее", "t3_s6_x1": "Да: копий конечное число, и случайные отклонения есть; за поколение они малы", "t3_s6_o2": "Нет: дрейф бывает только в малых популяциях", "t3_s6_x2": "Дрейф идёт в любой конечной популяции; в большой он слабее", "t3_s6_o3": "Только после резкого сокращения", "t3_s6_x3": "Сокращение численности усиливает дрейф, но не включает его", "t3_s6_h1": "Сколько копий передаётся в каждом поколении?", "t3_s6_h2": "Может ли выборка из 2000 копий точно повторить частоту?", "t3_s6_h3": "Посмотрите на 10 линий при N = 1000", "t3_s6_e": "Дрейф действует всегда, но его сила зависит от эффективной численности. Чем она меньше, тем быстрее теряются варианты и снижается гетерозиготность", "t4_title": "Отбор, поток генов, полиморфизм", "t4_rules": "Приспособленность — относительный вклад генотипа в следующее поколение; в модели — доля доживающих до размножения. Частота A после отбора: p′ = (p² × wAA + pq × wAa) / w̄, где w — приспособленности генотипов, w̄ — средняя приспособленность. Мигранты приходят после отбора: p″ = (1 − m) × p′ + m × pм. В режиме «конфликт» гетерозигота передаёт элемент D доле k своих гамет вместо половины. Численность бесконечна (дрейфа нет); числа условные", "t4_lim": "Модель не показывает дрейфа, многих локусов, зависимости приспособленности от среды, пола и частоты, а также откуда взялся вариант: мутация в ней не идёт", "t4_how": "Формулы изменения частот при отборе выведены основателями популяционной генетики. Их проверяли на лабораторных популяциях, где известны приспособленности генотипов, и на природных популяциях, где измерены отбор и миграция", "t4_s1_title": "Небольшое преимущество", "t4_s1_cond": "Особи AA доживают до размножения чаще всех; у Aa доля доживающих составляет 0,95, у aa — 0,9 от доли у AA (условные числа). Начальная частота A — 0,1. Численность очень большая", "t4_s1_q": "Что будет с частотой A за 60 поколений?", "t4_s1_o1": "Постепенно вырастет, примерно до 0,73", "t4_s1_x1": "Да: 0,16 через 10 поколений, 0,36 через 30, 0,73 через 60", "t4_s1_o2": "Сразу станет 1: лучший аллель вытесняет", "t4_s1_x2": "Преимущество 5–10 % за поколение меняет частоту постепенно", "t4_s1_o3": "Не изменится: 10 % — слишком мало", "t4_s1_x3": "При большой численности даже небольшое преимущество сдвигает частоту", "t4_s1_h1": "Каких копий больше среди доживших?", "t4_s1_h2": "Как часто это повторяется?", "t4_s1_h3": "Сдвиг накапливается от поколения к поколению", "t4_s1_e": "Естественный отбор — неслучайное различие в передаче вариантов из-за различий в выживании и размножении носителей. Скорость изменения частоты зависит от разницы приспособленностей и от самой частоты", "t4_s2_title": "Преимущество гетерозигот", "t4_s2_cond": "Приспособленности AA, Aa, aa — 0,8; 1; 0,6. Две популяции начинают с частоты A 0,1 и 0,9", "t4_s2_q": "Что произойдёт с частотой A в двух популяциях?", "t4_s2_o1": "Обе придут к 2/3; оба аллеля сохранятся", "t4_s2_x1": "Да: равновесие p = t / (s + t) = 0,4 / 0,6, где s = 0,2 и t = 0,4 — снижение приспособленности AA и aa относительно Aa; оно устойчиво", "t4_s2_o2": "A закрепится: гетерозиготы несут A", "t4_s2_x2": "Гетерозиготы несут и a; гомозиготы AA уступают им", "t4_s2_o3": "Из 0,9 — к закреплению, из 0,1 — к потере", "t4_s2_x3": "Отклонение в любую сторону возвращается к равновесию", "t4_s2_h1": "Какой генотип самый приспособленный?", "t4_s2_h2": "Может ли популяция состоять из одних гетерозигот?", "t4_s2_h3": "s = 0,2 (недостаток AA), t = 0,4 (недостаток aa)", "t4_s2_e": "При преимуществе гетерозигот отбор поддерживает оба аллеля: это один из путей сохранения полиморфизма", "t4_s3_title": "Отбор против гетерозигот", "t4_s3_cond": "Приспособленности AA, Aa, aa — 1; 0,8; 1. Две популяции начинают с частоты A 0,45 и 0,55", "t4_s3_q": "Что будет с частотой A?", "t4_s3_o1": "Разойдутся в разные стороны", "t4_s3_x1": "Да: равновесие 0,5 неустойчиво, и малое отклонение растёт", "t4_s3_o2": "Обе придут к 0,5", "t4_s3_x2": "0,5 — равновесие, но неустойчивое: от него частоты уходят", "t4_s3_o3": "Обе дойдут до закрепления A", "t4_s3_x3": "Из 0,45 гомозиготы aa в выигрыше: A теряется", "t4_s3_h1": "Какой аллель чаще в гомозиготах при p = 0,45?", "t4_s3_h2": "Кто выигрывает, если гетерозиготы хуже?", "t4_s3_h3": "Сравните с шагом 4.2", "t4_s3_e": "Равновесие бывает устойчивым и неустойчивым. Исход при отборе против гетерозигот зависит от начальной частоты", "t4_s4_title": "Отбор против потока генов", "t4_s4_cond": "На острове местный отбор благоприятствует A (приспособленности 1; 0,9; 0,8). Каждое поколение после отбора на остров приходят мигранты с материка, где A редок (частота 0,1); мигранты составляют 5 % взрослых", "t4_s4_q": "Какой станет частота A на острове?", "t4_s4_o1": "Промежуточная, около 0,6", "t4_s4_x1": "Да: отбор поднимает A, мигранты возвращают a; равновесие — около 0,60", "t4_s4_o2": "A закрепится: отбор сильнее", "t4_s4_x2": "Каждое поколение мигранты снова приносят копии a", "t4_s4_o3": "Станет 0,1 — как у мигрантов", "t4_s4_x3": "Мигрантов только 5 %, а отбор каждый раз сдвигает частоту к A", "t4_s4_h1": "Куда сдвигает частоту отбор, а куда — мигранты?", "t4_s4_h2": "Когда сдвиги уравновешиваются?", "t4_s4_h3": "Сравните положения m = 0; 0,01; 0,05; 0,1", "t4_s4_e": "Поток генов уменьшает различия между популяциями, а местный отбор их поддерживает. Частота в популяции — результат совместного действия процессов", "t4_s5_title": "Элемент, передающийся чаще половины", "t4_s5_cond": "Элемент D у гетерозигот Dd попадает в 80 % гамет вместо 50 %. Особи DD оставляют вдвое меньше потомков, чем Dd и dd. Начальная частота D — 0,05", "t4_s5_q": "Что произойдёт с элементом D?", "t4_s5_o1": "Распространится, хотя вредит", "t4_s5_x1": "Да: в модели D закрепляется, а средняя приспособленность падает до 0,5", "t4_s5_o2": "Исчезнет: он вредит организму", "t4_s5_x2": "Преимущество передачи перевешивает вред, пока D редок и почти весь — в гетерозиготах", "t4_s5_o3": "Не изменится: передача — не отбор", "t4_s5_x3": "Неравная передача меняет частоты так же, как неравное выживание", "t4_s5_h1": "Где находится почти весь редкий элемент?", "t4_s5_h2": "Сколько гамет с D даёт гетерозигота?", "t4_s5_h3": "Сравните положения k = 0,5; 0,6; 0,8", "t4_s5_e": "Если элемент повышает собственную передачу за счёт успеха организма, возникает внутригеномный конфликт. Модель условная: у мышей и дрозофил такие элементы известны, у человека надёжных примеров нет", "t4_s6_title": "Что создаёт рекомбинация", "t4_s6_cond": "У особи две хромосомы с сочетаниями аллелей двух соседних генов: A B и a b. Между генами происходит кроссинговер", "t4_s6_q": "Что появится в гаметах этой особи?", "t4_s6_o1": "Новые сочетания A b и a B", "t4_s6_x1": "Да: рекомбинация соединяет уже существующие аллели по-новому", "t4_s6_o2": "Новый аллель, которого не было", "t4_s6_x2": "Новые аллели создают мутации; рекомбинация переставляет имеющиеся", "t4_s6_o3": "Ничего нового: гаметы как хромосомы", "t4_s6_x3": "Без кроссинговера — да, с ним появляются новые сочетания", "t4_s6_h1": "Вспомните кроссинговер в мейозе", "t4_s6_h2": "Какие аллели есть у особи?", "t4_s6_h3": "Что меняется при обмене участками?", "t4_s6_e": "Мутации создают новые варианты, рекомбинация — новые сочетания, поток генов переносит варианты между популяциями. Частоту вариантов дальше меняют отбор, дрейф и миграция", "c2_obs": "Выборка из 200 особей: 108 AA, 64 Aa, 28 aa. Частота A — 0,7; гетерозигот 0,32 при ожидании 0,42", "c2_c1": "Близкородственное скрещивание", "c2_c2": "Скрытая структура (выборка из двух групп)", "c2_c3": "Отбор против гетерозигот", "c2_c4": "Ошибка определения генотипов", "c2_m1": "Происхождение образцов (из каких поселений)", "c2_r1_1": "одно поселение, частоты по месту не различаются", "c2_r1_2": "два поселения с частотами 0,92 и 0,48", "c2_r1_3": "частоты по месту не различаются", "c2_r1_4": "частоты по месту не различаются", "c2_m2": "Родство родителей", "c2_r2_1": "чаще родственники", "c2_r2_2": "не чаще, чем при случайном выборе", "c2_r2_3": "не чаще", "c2_r2_4": "не чаще", "c2_m3": "Доли генотипов у новорождённых и у взрослых", "c2_r3_1": "дефицит уже у новорождённых", "c2_r3_2": "дефицит уже у новорождённых", "c2_r3_3": "у новорождённых — равновесие, дефицит у взрослых", "c2_r3_4": "дефицит у всех", "c2_m4": "Другие локусы", "c2_r4_1": "дефицит по всем локусам", "c2_r4_2": "дефицит по локусам, частоты которых различаются между группами", "c2_r4_3": "дефицит только в этом локусе", "c2_r4_4": "дефицит в локусах, трудных для определения", "c2_m5": "Повторное определение генотипов в другой лаборатории", "c2_r5_1": "дефицит подтверждается", "c2_r5_2": "подтверждается", "c2_r5_3": "подтверждается", "c2_r5_4": "исчезает", "c2_after": "Дефицит гетерозигот — наблюдение. Его причину называют только по дополнительным данным: о происхождении образцов, родстве, возрасте особей и качестве генотипирования", "c3_obs": "В популяции из 50 особей частота аллеля A за 60 поколений упала с 0,3 до 0 — аллель исчез", "c3_c1": "Генетический дрейф", "c3_c2": "Отбор против A", "c3_m1": "Ещё одна траектория той же популяции — недоступно", "c3_m2": "10 независимых популяций той же численности с той же начальной частотой", "c3_m3": "Выживание особей с разными генотипами", "c3_r1_1": "A потерян (в 6 повторах из 10)", "c3_r1_2": "A потерян", "c3_r2_1": "потерян в 6, в остальных 0,03; 0,20; 0,21; 0,56 — в одном частота выросла", "c3_r2_2": "потерян во всех 10 (поколения 8–38)", "c3_r3_1": "одинаковое", "c3_r3_2": "AA выживают реже", "c3_after": "Одна траектория не различает дрейф и отбор: исчезновение аллеля — частый исход дрейфа в малой популяции. Различает воспроизводимость направления в независимых популяциях или прямые данные о выживании и размножении", "c4_obs": "В изолированной группе частота варианта — 0,1, а в соседних популяциях — около 0,01", "c4_c1": "Отбор в пользу варианта", "c4_c2": "Дрейф после основания группы немногими людьми", "c4_c3": "Поток генов из популяции, где вариант част", "c4_m1": "История группы: число основателей, сокращения численности", "c4_r1_1": "любая", "c4_r1_2": "немного основателей или узкое место", "c4_r1_3": "любая", "c4_m2": "Частоты других, нейтральных вариантов по всему геному", "c4_r2_1": "как у соседей", "c4_r2_2": "многие варианты отличаются от соседей в разные стороны", "c4_r2_3": "сдвинуты к частотам популяции-источника", "c4_m3": "Есть ли популяция, где вариант част, и обмен с ней", "c4_r3_1": "не обязательно", "c4_r3_2": "не обязательно", "c4_r3_3": "есть", "c4_m4": "Связь варианта с выживанием или размножением в этой группе", "c4_r4_1": "есть", "c4_r4_2": "нет", "c4_r4_3": "нет", "c4_after": "Высокая частота варианта сама по себе не доказывает отбор. Дрейф и эффект основателя меняют частоты по всему геному, поток генов сдвигает их к частотам источника, а отбор действует на определённый участок", "a_clin": "Клинический пример приводится для демонстрации значения эволюционного механизма", "a1_title": "Длинные участки гомозиготности: малая группа первых людей современного типа в Европе", "a1_cond": "Геномы людей, живших около 45 тыс. лет назад: человек из пещеры Злати кунь (Чехия) и люди из пещеры Ранис (Германия) — одни из самых ранних известных людей современного типа в Европе; их линия — самое раннее известное ответвление от линии, вышедшей из Африки. Для сравнения — неандерталец из Виндии того же времени и человек из Усть-Ишима (Сибирь). Участок гомозиготности — длинный отрезок хромосомы, одинаковый у копий от отца и от матери; длина участка измеряется в сантиморганах (сМ) — единицах частоты рекомбинации", "a1_status": "Модель по данным одной работы; значения на переключателях измерены; численность — оценка модели", "a1_s1_cond": "У человека из Злати кунь около половины общей длины участков гомозиготности приходится на участки длиннее 12 сМ", "a1_s1_q": "Почему у человека из Злати кунь 7,2 % генома — в длинных участках гомозиготности?", "a1_s1_o1": "Его предки жили малой группой", "a1_s1_x1": "Да: в малой группе родители чаще имеют общих недавних предков, и одинаковые длинные участки встречаются чаще", "a1_s1_o2": "Его родители — близкие родственники", "a1_s1_x2": "Брак близких родственников дал бы ещё более длинные участки; авторы объясняют картину малой численностью группы", "a1_s1_o3": "Так действует отбор", "a1_s1_x3": "Отбор действует на отдельные участки, а здесь одинаковые отрезки рассеяны по всему геному", "a1_s1_e": "Длинный участок гомозиготности — две копии одного предкового отрезка. Чем меньше группа, тем больше таких участков", "a1_s2_q": "Гетерозиготность у этих людей такая же, как у других неафриканцев, — около 7–8 на 10 000 позиций, вчетверо выше, чем у неандертальцев. Как это совместить с обилием длинных участков гомозиготности?", "a1_s2_o1": "Сокращение численности было недавним и недолгим", "a1_s2_x1": "Да: длинные участки возникают за немногие поколения, а общая гетерозиготность снижается медленно", "a1_s2_o2": "Длинные участки и гетерозиготность не связаны", "a1_s2_x2": "Связаны: в участке гомозиготности гетерозиготных позиций нет; вопрос в масштабе времени", "a1_s2_o3": "Группа на самом деле была большой", "a1_s2_x3": "Оценка численности — около 300 особей за последние ~50 поколений", "a1_s2_e": "Длинные участки гомозиготности отражают недавнюю историю (десятки поколений), а гетерозиготность — долгую. Поэтому они могут расходиться", "a1_s3_q": "Человек из Злати кунь — родственник двух людей из Раниса в 5-й или 6-й степени, хотя пещеры находятся примерно в 230 км друг от друга. Что из этого следует?", "a1_s3_o1": "Люди двух мест принадлежали одной группе", "a1_s3_x1": "Да: такие длинные общие отрезки бывают только у людей с общими предками за немногие поколения", "a1_s3_o2": "Родство доказывает, что это одна семья", "a1_s3_x2": "Пятая–шестая степень — дальнее родство; это одна группа, а не одна семья", "a1_s3_o3": "Родство говорит об отборе", "a1_s3_x3": "Общие отрезки ДНК говорят о происхождении, а не о приспособленности", "a1_new": "Около 45 тыс. лет назад в Европе жила малая изолированная группа людей современного типа: её эффективная численность — порядка нескольких сотен особей. Люди из пещер в Германии и Чехии были дальними родственниками. Потомков среди изученных более поздних людей у этой группы не найдено", "a1_how": "Сравнили, какие отрезки ДНК совпадают у разных людей и у двух копий в одном геноме, и измерили их длину: чем длиннее совпадающий отрезок, тем ближе общий предок. Работа не доказывает, почему группа не оставила потомков", "a1_lim": "Численность — эффективная, а не число живших людей; оценка зависит от карты рекомбинации; длительность поколения 29 лет авторы принимают при датировании смешения с неандертальцами. Модель не показывает, вредили ли длинные участки гомозиготности этим людям", "a2_title": "Два источника предков: структура глубже, чем одна популяция", "a2_cond": "Геномы современных людей из 26 популяций мира. Модель сравнивает две истории: предки всё время были одной популяцией, численность которой менялась, или предки были двумя популяциями, которые разошлись и позже слились. Длительность поколения принята равной 29 годам", "a2_status": "Модель по данным одной работы; все времена и доли — точечные оценки модели", "a2_s1_q": "Почему вклад популяции 2 — около 21 % — не замечали прежние способы сравнения популяций?", "a2_s1_o1": "Он общий для всех современных людей", "a2_s1_x1": "Да: вклад, одинаковый у всех, не виден при сравнении одних популяций с другими", "a2_s1_o2": "Он есть только у неафриканцев", "a2_s1_x2": "В модели слияние предшествует расселению и общее для всех 26 популяций", "a2_s1_o3": "Его нет: это ошибка модели", "a2_s1_x3": "Модель с двумя популяциями описывает данные заметно лучше единой, но это оценка модели", "a2_s2_q": "79 : 21 и 300 тыс. лет — это...", "a2_s2_o1": "Оценки одной модели без интервалов", "a2_s2_x1": "Да: авторы подбирали времена перебором и допускают, что история была сложнее", "a2_s2_o2": "Измерения по ископаемым", "a2_s2_x2": "Числа получены из современных геномов; ископаемым формам популяции 1 и 2 не сопоставлены", "a2_s2_o3": "Доли неандертальцев и денисовцев", "a2_s2_x3": "Это две предковые популяции нашего вида; неандертальский вклад у современных неафриканцев — около 2–3 % — возник позднее", "a2_s3_q": "Если бы в древней выборке смешались люди из популяций 1 и 2 до их слияния, что показала бы доля гетерозигот?", "a2_s3_o1": "Дефицит относительно общей частоты", "a2_s3_x1": "Да: это эффект Валунда — объединение групп с разными частотами", "a2_s3_o2": "Избыток гетерозигот", "a2_s3_x2": "Объединение при подсчёте не создаёт гетерозигот", "a2_s3_o3": "Ничего: гетерозиготы не зависят от структуры", "a2_s3_x3": "Зависят: при разных частотах групп их в объединённой выборке меньше", "a2_new": "По геномам современных людей модель, в которой две предковые популяции разошлись около 1,5 млн лет назад и слились около 300 тыс. лет назад (79 : 21), описывает данные лучше модели одной популяции. Это вывод модели; авторы допускают несколько эпизодов расхождения и смешения", "a2_how": "По одному геному каждого человека посмотрели, как меняется время до общего предка двух копий ДНК вдоль хромосомы. У разделённой и вновь слившейся популяции соседние участки сменяют друг друга иначе, чем у единой. Работа не указывает, каким ископаемым формам соответствуют популяции 1 и 2", "a2_lim": "Модель допускает ровно две популяции без обмена генами между ними; численность популяции 2 постоянна по допущению; отбор и различия в скорости мутаций не учтены", "a3_title": "Утверждение и возражение: сокращение численности предков около 900 тыс. лет назад", "a3_cond": "Две группы исследователей анализируют одни и те же геномы современных людей. Обе оценивают, как менялась численность предков, по тому, сколько в геномах редких и частых вариантов. Древней ДНК того времени нет", "a3_claim_what": "глубокий провал численности в интервале 930–813 тыс. лет назад", "a3_claim": "Резкое сокращение у предков африканских популяций около 930–813 тыс. лет назад: эффективная численность около 1280 (в разных популяциях — от 0,77 до 2,03 тыс.), около 117 тыс. лет. У неафриканцев — только «скрытый след» по видоизменённому методу", "a3_objection_what": "кривая без глубокого провала", "a3_objection": "Неафриканцы отделились от африканских групп менее 100 тыс. лет назад, и событие 900 тыс. лет назад было бы общим. Разные истории дают почти одинаковое распределение частот; на данных без сокращения метод находит ложное сокращение; модель без него описывает данные лучше", "a3_status": "Качественная схема двух опубликованных позиций; кривые условны", "a3_s1_q": "По каким данным различаются позиции?", "a3_s1_o1": "По расчёту ожидаемых частот вариантов", "a3_s1_x1": "Да: каждая сторона сравнивает модели своим расчётом, и стороны не согласны, чей точнее", "a3_s1_o2": "По древней ДНК людей той эпохи", "a3_s1_x2": "ДНК людей возрастом около 900 тыс. лет нет; обе стороны используют геномы современных людей", "a3_s1_o3": "По ископаемым находкам той эпохи", "a3_s1_x3": "Сторона утверждения приводит ископаемые и климат как согласующиеся данные, но численность по ним прямо не оценивают", "a3_s2_q": "Что можно сказать сейчас?", "a3_s2_o1": "Спор не закрыт", "a3_s2_x1": "Да: стороны не согласны даже в том, как сравнивать модели; решающих данных пока нет", "a3_s2_o2": "Сокращение уже доказано", "a3_s2_x2": "Возражения не сняты: другие методы на тех же данных его не находят", "a3_s2_o3": "Сокращения точно не было никогда", "a3_s2_x3": "Показано, что данных для него недостаточно, — это не доказательство отсутствия", "a3_s3_q": "Почему кривую «численности», найденную по одной популяции, нельзя читать как перепись?", "a3_s3_o1": "Это эффективная численность в модели", "a3_s3_x1": "Да: она зависит от допущений модели, в том числе от того, была ли популяция единой", "a3_s3_o2": "Это число найденных скелетов", "a3_s3_x2": "Кривая рассчитана по геномам, а не по находкам", "a3_s3_o3": "Это число живших тогда людей", "a3_s3_x3": "Эффективная численность обычно меньше фактической и не равна ей", "a3_new": "Опубликованы две позиции. Первая: численность предков африканских популяций около 930–813 тыс. лет назад резко сократилась — эффективная численность около 1280, примерно 1,3 % прежней, около 117 тыс. лет. Вторая: этот сигнал, скорее всего, создан особенностями метода; событие такой давности было бы общим для всех людей, а модель без сокращения описывает данные лучше. Авторы первой позиции ответили, что их расчёт точнее. Спор не закрыт", "a3_how": "Обе стороны рассчитывали, какое распределение редких и частых вариантов дали бы разные истории численности, и сравнивали с наблюдаемым. Обе стороны проверяли методы на компьютерных популяциях с известной историей", "a3_lim": "Схема не воспроизводит методов и не показывает, какая позиция верна. Слово «сокращение численности» относится здесь к событию около 900 тыс. лет назад; по мнению авторов возражения, это не то же событие, что сокращение численности предковой популяции 1 на вкладке 2", "a4_title": "Траектория частоты аллеля по древней ДНК", "a4_cond": "Геномы 15 836 людей, живших в Западной Евразии за последние 18 тыс. лет. Для каждого варианта сравнили, как его частота менялась во времени, с тем, что дали бы переселения и смешение групп. Частоты — по всей выборке Западной Евразии. Коэффициент отбора s — относительное преимущество за поколение, оценённый моделью при допущении, что отбор постоянен", "a4_status": "Модель по данным одной работы; кружки — опубликованные округлённые значения; линия между ними — условное соединение; s — оценка модели", "a4_s1_q": "Частота варианта TYK2 сначала выросла примерно до 9 %, а за последние 3000 лет снизилась примерно до 3 %. Что это значит?", "a4_s1_o1": "Направление отбора менялось со временем", "a4_s1_x1": "Да: по модели отбор сначала повышал частоту, затем понижал", "a4_s1_o2": "Это дрейф: частота блуждала", "a4_s1_x2": "Дрейф по всей Западной Евразии не даёт согласованного подъёма и спада; модель оценивает отбор с вероятностью > 99 %", "a4_s1_o3": "Вариант изменился новой мутацией", "a4_s1_x3": "Частота относится к одному и тому же варианту; меняется доля его копий", "a4_s2_q": "Найдено 479 участков направленного отбора. Значит ли это, что изменения частот у человека в основном вызваны отбором?", "a4_s2_o1": "Нет: отбор объясняет около 2 % изменений", "a4_s2_x1": "Да: остальное — дрейф, переселения, смешение и колебания отбора", "a4_s2_o2": "Нет: отбор не найден вовсе", "a4_s2_x2": "Найдено 479 участков; но их вклад в изменения частот мал", "a4_s2_o3": "Да: все изменения частот — отбор", "a4_s2_x3": "На направленный отбор по оценке приходится лишь около 2 %", "a4_s3_q": "У вариантов есть связь с болезнями у современных людей. Доказывает ли она, что отбор в прошлом шёл именно из-за этих болезней?", "a4_s3_o1": "Нет: признак-мишень неизвестен", "a4_s3_x1": "Да: связь измерена у современных людей и не называет фактор отбора в прошлом", "a4_s3_o2": "Да: связь с болезнью и есть причина отбора", "a4_s3_x2": "Ассоциация у современных людей — корреляция; причина отбора остаётся гипотезой", "a4_s3_o3": "Нет: связи с болезнями нет", "a4_s3_x3": "Связь есть, но она измерена у современных людей и не называет причину отбора", "a4_new": "По древней ДНК Западной Евразии за последние 10 тыс. лет найдены сотни участков направленного отбора; у ряда вариантов направление отбора менялось. При этом отбор объясняет лишь малую долю изменений частот: остальное — дрейф, переселения и смешение", "a4_how": "Сравнили ДНК тысяч людей, живших в разные тысячелетия, и проверили, меняется ли частота варианта в одном направлении сильнее, чем дают родство, переселения и смешение групп. Работа не доказывает, на какой признак действовал отбор", "a4_lim": "На схеме — только округлённые значения из текста работы; промежуточные значения работы не воспроизводятся, линия между кружками условна. Частоты — без поправки на структуру популяции, а s оценён с поправкой; пересчитывать s по двум точкам нельзя. Результат относится к Западной Евразии", "a3_open": "Спор не закрыт", "a3_row1": "Как рассчитывают ожидаемое распределение частот вариантов", "a3_row2": "Есть ли сигнал у неафриканцев", "a3_row3": "Как учитывают ошибки определения предкового варианта", "fin_title": "Почему изменилась частота?", "fin_cond": "Четыре наблюдения из разных популяций. Для каждого выберите объяснение, которое совместимо с данными, и данные, которые нужны, чтобы его проверить. Если данных недостаточно, выберите «нельзя различить»", "fin_s1_obs": "Частота A та же (0,7), доля гетерозигот упала с 0,42 до 0,32", "fin_s2_obs": "В 10 одинаковых популяциях по 50 особей A исчез в 6, в остальных частоты разные, в одной выросла", "fin_s3_obs": "На острове частота A стабильна (0,6), хотя местный отбор благоприятствует A", "fin_s4_obs": "Частота A одинаково выросла в 10 из 10 независимых популяций", "fin_s1_x": "Дефицит гетерозигот при прежней частоте — изменение генотипической структуры. Его дают и инбридинг, и скрытая структура, и отбор против гетерозигот; одна выборка их не различает", "fin_s2_x": "Разные исходы одинаковых популяций — признак случайного процесса. Сильный отбор против A дал бы потерю во всех повторах; слабый отбор вместе с дрейфом по этим данным не исключить — нужны данные о выживании генотипов", "fin_s3_x": "Стабильная промежуточная частота при местном отборе возникает, если мигранты каждое поколение приносят другой аллель", "fin_s4_x": "Одинаковое направление в независимых популяциях не объясняется дрейфом. Его даёт отбор или общий постоянный источник мигрантов; второе проверяют по частотам у мигрантов", "src_01": "Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014.", "src_02": "Wang J., Santiago E., Caballero A. Prediction and estimation of effective population size. Heredity 2016; 117: 193–206. doi:10.1038/hdy.2016.43", "src_03": "Sümer A.P. et al. Earliest modern human genomes constrain timing of Neanderthal admixture. Nature 2025; 638: 711–717. doi:10.1038/s41586-024-08420-x", "src_04": "Cousins T., Scally A., Durbin R. A structured coalescent model reveals deep ancestral structure shared by al const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* семинар 11: ключи текстов шага — ключи документов v1.1 (s11_t1_s1_q, _o1…_o4, _e, _w2…_w4, _h1…_h3, _obs, _cond) */

   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */

const POE_CHAIN = {};

  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };

/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */

    }
    /* завершающие действия раздела (аудит 06.11.2026, одобрено автором): карта коллоквиума и возврат в раздел */
    /* семинар 12 — последний семинар первого семестра: вместо следующего семинара — «Второй семестр · готовится» (07, разд. 1) */

/* пакет 5 финального аудита (20.11.2026): одно поведение схемы на телефоне (≤ 700 px или низкий экран) во всех практикумах.
   Схема открывается целиком; подписи, которые без увеличения мельче 7 px, скрыты, пока схема не увеличена;
   «Увеличить схему» растягивает её так, чтобы самая мелкая подпись была не меньше 11 px (не уже 760 px, не шире 1800 px). */
(function () {
  const MQ = window.matchMedia ? window.matchMedia('(max-width:700px), (max-height:500px)') : null;
  let queued = false;
  function fitStage(st) {
    const sv = st.querySelector('svg'), zw = st.querySelector('.zwrap'); if (!sv || !zw) return;
    const ts = sv.querySelectorAll('text');
    if (!(MQ && MQ.matches)) { ts.forEach(t => t.classList.remove('p5-small')); st.style.removeProperty('--p5w'); return; }
    const cur = sv.getBoundingClientRect().width, flatW = zw.clientWidth; if (!cur || !flatW) return;
    const k = Math.min(1, flatW / cur); let min = Infinity;
    ts.forEach(t => {
      const m = t.getScreenCTM(); if (!m || (t.textContent || '').trim().length < 3) { t.classList.remove('p5-small'); return; }   /* подпись — от 3 знаков; одиночные символы значков (P, +, −, 2+) — часть рисунка */
      const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b) * k;
      if (px > 0 && px < min) min = px;
      t.classList.toggle('p5-small', px < 7);
    });
    if (min < Infinity) st.style.setProperty('--p5w', Math.ceil(Math.min(1800, Math.max(760, flatW * 11.2 / min))) + 'px');
  }
  function fitAll() { queued = false; document.querySelectorAll('#scenes .stage').forEach(st => { if (st.offsetParent) fitStage(st); }); }
  const later = () => { if (queued) return; queued = true; requestAnimationFrame(fitAll); };
  function arm() {
    const sc = document.getElementById('scenes') || document.body;
    new MutationObserver(later).observe(sc, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
    document.addEventListener('click', later, true);
    window.addEventListener('resize', later);
    later();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm); else arm();
})();

/* =====================================================================
   bio_figs.js — общие детали «конструктора элементов» курса «Биология».
   Единый графический язык: любая мембрана — липидный бислой (синие головки,
   оранжевые волнистые хвосты) одной толщины. Масштаб — под схему 600×420.
   Функции возвращают строку SVG (как BX/E в core.js), русского текста нет.
   ===================================================================== */
const BF = (function () {
  const C = { head: '#3B6FB0', tail: '#E8912A', cargo: '#F2C230', clath: '#7C4DBE', copii: '#2E9B57',
    copi: '#B8860B', adapt: '#2E9B57', rec: '#E8912A', red: '#C0392B', lumen: '#EAF1F9', endo: '#F6C9A8',
    lyso: '#FCE9E4', grey: '#7A8899', dyn: '#1F3B73', actin: '#5B7A99', snareV: '#C0392B', snareT: '#1F3B73' };
  const MEM = { pitch: 8.5, r: 3.4, h: 17 };
  const f = x => (+x).toFixed(1);
  /* разметка для справки: практикум включает (BF.setPick), «Объяснения» — нет, поэтому их схемы не меняются */
  let PICK = false;
  const G = (g, s) => PICK && s ? `<g class="clickable" data-g="${g}">${s}</g>` : s;

  function tail(x, y, dx, dy, tx, ty, len) {
    const amp = 2.1, seg = 8, pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, off = Math.sin(t * Math.PI * 2) * amp;
      pts.push(f(x + dx * len * t + tx * off) + ',' + f(y + dy * len * t + ty * off));
    }
    return `<path d="M${pts.join(' L')}" fill="none" stroke="${C.tail}" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  /* выборка точек средней линии произвольного пути (полилиния) */
  function sample(points, closed) {
    const P = closed ? points.concat([points[0]]) : points, out = [];
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.5));
      for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    }
    if (!closed) out.push(P[P.length - 1]);
    return out;
  }

  /* бислой вдоль полилинии; каждый монослой — своим шагом головок */
  function bilayerPts(points, o = {}) {
    const m = Object.assign({}, MEM, { closed: false }, o), half = m.h / 2, len = half - m.r + 2.5;
    const dense = sample(points, m.closed);
    let s = '';
    [1, -1].forEach(side => {
      const sh = [];
      for (let i = 0; i < dense.length; i++) {
        const a = dense[Math.max(0, i - 1)], b = dense[Math.min(dense.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
        const nx = -ty * side, ny = tx * side;
        sh.push({ x: dense[i][0] + nx * half, y: dense[i][1] + ny * half, nx, ny, tx, ty });
      }
      let tot = 0; for (let i = 1; i < sh.length; i++) tot += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y);
      const n = Math.max(3, Math.round(tot / m.pitch)), step = tot / n, cnt = m.closed ? n : n + 1;
      let acc = 0, i = 1;
      for (let k = 0; k < cnt; k++) {
        const target = k * step;
        while (i < sh.length && acc + Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y) < target) {
          acc += Math.hypot(sh[i].x - sh[i - 1].x, sh[i].y - sh[i - 1].y); i++;
        }
        const p = sh[Math.min(i, sh.length - 1)];
        s += tail(p.x, p.y, -p.nx, -p.ny, p.tx, p.ty, len) + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${m.r}" fill="${C.head}"/>`;
      }
    });
    return s;
  }
  const line = (x0, x1, y) => bilayerPts([[x0, y], [x1, y]]);
  const circlePts = (cx, cy, R, n = 72) => Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n), cy + R * Math.sin(2 * Math.PI * i / n)]);
  const ellipsePts = (cx, cy, rx, ry, n = 96) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

  /* замкнутый компартмент: просвет + бислой */
  function compartment(cx, cy, rx, ry, fill) {
    const P = ellipsePts(cx, cy, rx, ry);
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill || C.lumen}"/>` + bilayerPts(P, { closed: true });
  }

  /* оболочка: точки снаружи бислоя (coat = цвет; null — без оболочки) */
  function coatRing(cx, cy, R, color, n = 14) {
    const out = R + MEM.h / 2 + MEM.r + 4;
    return Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2;
      return `<circle cx="${f(cx + Math.cos(a) * out)}" cy="${f(cy + Math.sin(a) * out)}" r="3.6" fill="${color}"/>`; }).join('');
  }

  /* везикула: мембрана, свёрнутая в окружность; груз внутри */
  function vesicle(cx, cy, R = 20, coat = null, ncargo = 2) {
    const lum = R - MEM.h / 2 - MEM.r, pos = [[-0.4, -0.1], [0.35, 0.3], [0.1, -0.5]];
    return (coat ? coatRing(cx, cy, R, coat) : '') + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>` +
      bilayerPts(circlePts(cx, cy, R), { closed: true }) +
      pos.slice(0, ncargo).map(([a, b]) => `<circle cx="${f(cx + a * lum)}" cy="${f(cy + b * lum)}" r="${f(Math.max(2.5, lum * .32))}" fill="${C.cargo}"/>`).join('');
  }

  /* рецептор: трансмембранный стержень с «чашей» для груза (side: -1 — чаша сверху) */
  function receptor(x, y, side = -1, withCargo = true) {
    const top = y + side * 16;
    return `<line x1="${x}" y1="${y - side * 10}" x2="${x}" y2="${top}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 7},${top} Q${x},${top + side * 9} ${x + 7},${top}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      (withCargo ? `<circle cx="${x}" cy="${top + side * 1}" r="4.6" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>` : '');
  }

  /* кольцо динамина на шейке */
  const dynamin = (x, y, w = 20) => `<rect x="${x - w / 2}" y="${y - 4}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>` +
    `<rect x="${x - w / 2}" y="${y + 6}" width="${w}" height="8" rx="4" fill="${C.dyn}"/>`;

  /* актиновые нити под участком мембраны */
  function actin(x0, x1, y, n = 5) {
    let s = '';
    for (let i = 0; i < n; i++) { const xa = x0 + (x1 - x0) * i / n;
      s += `<path d="M${f(xa)},${y + 6 + (i % 2) * 8} l${f((x1 - x0) / n * 1.4)},${-14 + (i % 3) * 6}" stroke="${C.actin}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 2"/>`; }
    return s;
  }

  /* SNARE: две спирали — на носителе (v) и на мишени (t); zipped — комплекс собран */
  function snare(x, y1, y2, zipped) {
    if (!zipped) return `<path d="M${x - 4},${y1} q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 4},${y2} q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
    const ym = (y1 + y2) / 2;
    return `<path d="M${x - 2},${y1} Q${x - 7},${ym} ${x - 2},${y2}" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>` +
      `<path d="M${x + 2},${y2} Q${x + 7},${ym} ${x + 2},${y1}" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`;
  }


  /* профиль плазматической мембраны (y0 — средняя линия) с впячиваниями:
     {t:'omega', c, neck, len, R} — суженная шейка и пузырёк; {t:'u', c, w, d} — открытая ямка; {t:'tube', c, w, d} — длинная трубка */
  function profile(y0, feats, x0 = 6, x1 = 594){
    const P = [], fs = feats.slice().sort((a, b) => a.c - b.c);
    let x = x0;
    const flatTo = xe => { for (; x <= xe; x += 3) P.push([x, y0]); x = xe; };
    for (const f of fs) {
      if (f.t === 'u') { flatTo(f.c - f.w); for (let a = Math.PI; a >= 0; a -= Math.PI / 40) P.push([f.c + f.w * Math.cos(a), y0 + f.d * Math.sin(a)]); x = f.c + f.w + 3; }
      else if (f.t === 'tube') { flatTo(f.c - f.w); for (let yy = y0; yy <= y0 + f.d; yy += 3) P.push([f.c - f.w, yy]);
        for (let a = Math.PI; a >= 0; a -= Math.PI / 12) P.push([f.c + f.w * Math.cos(a), y0 + f.d + f.w * Math.sin(a)]);
        for (let yy = y0 + f.d; yy >= y0; yy -= 3) P.push([f.c + f.w, yy]); x = f.c + f.w + 3; }
      else if (f.t === 'omega') { flatTo(f.c - f.neck); for (let yy = y0; yy <= y0 + f.len; yy += 3) P.push([f.c - f.neck, yy]);
        const cy = y0 + f.len + Math.sqrt(Math.max(0, f.R * f.R - f.neck * f.neck)), a0 = Math.atan2(y0 + f.len - cy, -f.neck), a1 = Math.atan2(y0 + f.len - cy, f.neck);
        for (let a = a0; a >= a1 - 2 * Math.PI; a -= Math.PI / 40) P.push([f.c + f.R * Math.cos(a), cy + f.R * Math.sin(a)]);
        for (let yy = y0 + f.len; yy >= y0; yy -= 3) P.push([f.c + f.neck, yy]); x = f.c + f.neck + 3; }
      else if (f.t === 'pore') {   /* пора слияния: край поры и везикула — один непрерывный изогнутый бислой (тороидальная пора; рецензия v1.0, R31).
           Дуга края (радиус rr) касается окружности везикулы (радиус R) снаружи, поэтому линия гладкая; neck — полуширина канала по средней линии. */
        const rr = f.rr || 18, R = f.R, w = f.neck, xl = f.c - w - rr, xr = f.c + w + rr, yn = y0 + rr;
        const cyb = yn + Math.sqrt(Math.max(0, (rr + R) ** 2 - (w + rr) ** 2)), phi = Math.atan2(cyb - yn, f.c - xl);
        flatTo(xl);
        for (let a = -Math.PI / 2; a <= phi; a += Math.PI / 24) P.push([xl + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        const b0 = Math.atan2(yn - cyb, xl - f.c) + 2 * Math.PI, b1 = Math.atan2(yn - cyb, xr - f.c);
        for (let a = b0; a >= b1; a -= Math.PI / 48) P.push([f.c + R * Math.cos(a), cyb + R * Math.sin(a)]);
        for (let a = Math.PI - phi; a <= 1.5 * Math.PI + 0.001; a += Math.PI / 24) P.push([xr + rr * Math.cos(a), yn + rr * Math.sin(a)]);
        x = xr + 3; }
    }
    flatTo(x1); return P;
  }

  /* ---------- цикл транспортного носителя (вопрос 2): общая геометрия для практикума и «Объяснений» ----------
     Кадр 600×380. route: 'erg' — ЭПР → аппарат Гольджи (COP-II), 'gerr' — аппарат Гольджи → ЭПР (COP-I), 'intra' — между цистернами аппарата Гольджи, обратно (COP-I),
     'tgn' — транс-сеть Гольджи → поздняя эндосома (клатрин), 'pme' — плазматическая мембрана → ранняя эндосома (клатрин).
     rm: 'none' | 'coat' (нет белков оболочки) | 'uncoat' (оболочка не снимается) | 'snare' (нет SNARE на носителе).
     Возвращает { s: SVG, a: точки для подписей }. Русского текста нет. */
  const ribo = (cx, cy, rx, ry, skip) => { let q = ''; for (let a = 0; a < 360; a += 13) { if (skip(a)) continue; const t = a * Math.PI / 180, nx = Math.cos(t) / rx, ny = Math.sin(t) / ry, n = Math.hypot(nx, ny);
    q += `<circle cx="${f(cx + rx * Math.cos(t) + nx / n * 15)}" cy="${f(cy + ry * Math.sin(t) + ny / n * 15)}" r="3.3" fill="#222"/>`; } return q; };
  const dots = (pts, r = 4.2, c = C.cargo) => pts.map(([x, y]) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#8a6d00" stroke-width=".7"/>`).join('');
  /* пара SNARE в точке контакта (x, y) вдоль направления ang (рад): zipped — собранный комплекс; half — только SNARE мишени */
  function snarePair(x, y, ang, zipped, half) {
    const deg = ang * 180 / Math.PI - 90;
    const body = half ? `<path d="M2,8 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>` :
      zipped ? `<path d="M-2,-12 Q-7,0 -2,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/><path d="M2,12 Q7,0 2,-12" fill="none" stroke="${C.snareT}" stroke-width="2.6"/>`
             : `<path d="M-4,-14 q-5,6 0,12 q5,6 0,12" fill="none" stroke="${C.snareV}" stroke-width="2.6"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(deg)})">${body}</g>`;
  }
  const VR = 21, VO = VR + MEM.h / 2;               /* радиус носителя и его наружный край */
  function carrier(route, rm) {
    let s = '', a = {};
    const coatC = route === 'erg' ? C.copii : (route === 'gerr' || route === 'intra') ? C.copi : C.clath;
    const noCoat = rm === 'coat', stuckCoat = rm === 'uncoat', noSnare = rm === 'snare';
    if (route !== 'pme') {
      /* участки сети слева и справа: рисунок, край мембраны, обращённый к носителям (x по y), груз, точка подписи */
      const ex = (cx, rx, cy, ry, sgn) => y => cx + sgn * rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2));
      const cist = xs => xs.map(cx => compartment(cx, 222, 20, 112, '#EFE8F6')).join('');
      const SIDE = {
        er: { draw: () => compartment(105, 222, 58, 128, C.lumen) + ribo(105, 222, 58, 128, d => d < 40 || d > 320), edge: ex(105, 58, 222, 128, 1),
              own: [[92, 130], [118, 180], [96, 236], [120, 286], [94, 326]], recv: [[118, 206], [100, 256]], lab: [105, 48] },
        gR: { draw: () => cist([440, 498, 556]), edge: ex(440, 20, 222, 112, -1),
              own: [[440, 166], [440, 221], [440, 278]], recv: [[440, 160], [440, 215], [440, 272]], lab: [498, 84] },
        gL: { draw: () => cist([80, 138]), edge: ex(138, 20, 222, 112, 1),
              own: [[138, 166], [138, 221], [138, 278]], recv: [[138, 190], [138, 252]], lab: [109, 84] },
        gT: { draw: () => cist([52, 100, 148]), edge: ex(148, 20, 222, 112, 1),
              own: [[148, 160], [148, 215], [148, 272]], recv: [], lab: [100, 84] },
        le: { draw: () => compartment(484, 222, 80, 118, C.endo), edge: ex(484, 80, 222, 118, -1),
              own: [], recv: [[470, 178], [500, 232], [468, 282]], lab: [484, 84] },
      };
      const CFG = { erg: ['er', 'gR', true], gerr: ['er', 'gR', false], intra: ['gL', 'gR', false], tgn: ['gT', 'le', true] }[route];
      const Lf = SIDE[CFG[0]], Rt = SIDE[CFG[1]], toR = CFG[2], D = toR ? Lf : Rt, T = toR ? Rt : Lf;
      s += Lf.draw() + Rt.draw();
      const delivered = rm === 'none', mem = route === 'intra' || route === 'tgn';   /* А2-06: мембранный груз — в бислое, домен в просвете */
      const wall = (side, pts) => pts.map(([, y]) => { const xe = side.edge(y), sg = side === Lf ? 1 : -1; return vsvg(xe, y, sg, 0); }).join('');
      s += mem ? wall(D, D.own) : dots(D.own);
      if (delivered) s += mem ? wall(T, T.recv.length ? T.recv : [[0, 190], [0, 252]]) : dots(T.recv);
      const ves = (x, y, R, coat) => mem ? vesicle(x, y, R, coat, 0) + vsvgVes(x, y, R, [205, 335]) : vesicle(x, y, R, coat, 2);
      const dir = toR ? 1 : -1, x0 = toR ? 216 : 367, yv = 200, xm = toR ? 300 : 282;
      const xT = y => toR ? T.edge(y) - MEM.h / 2 - VO : T.edge(y) + MEM.h / 2 + VO;
      /* направление переноса — серая стрелка над путём носителей */
      const ax0 = toR ? 200 : 400, ax1 = toR ? 400 : 200;
      s += `<path d="M${ax0},96 L${ax1},96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M${ax1},96 l${-dir * 10},-6 l0,12 z" fill="${C.grey}"/>`;
      a = { donor: D.lab, target: T.lab, dir: [300, 80], warn: [300, 122], carriers: [300, 352], route };
      if (noCoat) { /* носитель не образуется */ }
      else if (stuckCoat) {
        s += ves(x0, yv + 6, VR, coatC) + ves(xm, 184, VR, coatC) + ves(toR ? 330 : 270, 276, VR, coatC);
      } else {
        s += ves(x0, yv, VR, coatC) + ves(xm, 170, VR, null);
        if (noSnare) {
          /* носители без SNARE удерживаются у мишени (первичное узнавание), но не сливаются */
          [[214, 2], [280, 8]].forEach(([vy, gap]) => {
            const vx = xT(vy) - dir * gap;
            s += ves(vx, vy, VR, null);
            const tx = toR ? vx + VO + 1 : vx - VO - 1;
            s += snarePair(tx + dir * (gap + 4), vy, 0, false, true);
            s += `<line x1="${f(tx)}" y1="${f(vy - 10)}" x2="${f(tx + dir * (gap + 12))}" y2="${f(vy - 22)}" stroke="${C.grey}" stroke-width="1.6"/>`;
          });
        } else {
          const vx = xT(214);
          s += vesicle(vx, 214, VR, null, 0);
          s += snarePair(toR ? vx + VO : vx - VO, 214, 0, true);
        }
      }
    } else {
      const Y = 96, P = { c: 130, w: 36, d: 64 }, EN = { cx: 445, cy: 278, rx: 108, ry: 70 };
      const pit = !noCoat, PP = pit ? profile(Y, [{ t: 'u', c: P.c, w: P.w, d: P.d }]) : profile(Y, []);
      /* внеклеточная среда — над мембраной и в просвете ямки */
      s += `<path d="M0,0 L600,0 L600,${Y} ${PP.slice().reverse().map(([x, y]) => 'L' + f(x) + ',' + f(y)).join(' ')} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>`;
      s += compartment(EN.cx, EN.cy, EN.rx, EN.ry, C.endo);
      s += bilayerPts(PP);
      if (pit) {
        s += recOnPit(P.c, Y, P.w, P.d, [Math.PI * 0.72, Math.PI / 2, Math.PI * 0.28]) + clathOnPit(P.c, Y, P.w, P.d);
      } else {
        [80, 190, 300, 410, 520].forEach(x => { s += receptor(x, Y - 6, -1, true) + `<line x1="${x}" y1="${Y + 6}" x2="${x}" y2="${Y + 15}" stroke="${C.adapt}" stroke-width="5" stroke-linecap="round"/>`; });
      }
      const delivered = rm === 'none';
      if (delivered) s += dots([[430, 262], [462, 292], [480, 254]]);
      /* точка на эллипсе эндосомы и наружная нормаль */
      const onE = deg => { const t = deg * Math.PI / 180, x = EN.cx + EN.rx * Math.cos(t), y = EN.cy + EN.ry * Math.sin(t), nx = Math.cos(t) / EN.rx, ny = Math.sin(t) / EN.ry, n = Math.hypot(nx, ny); return { x, y, nx: nx / n, ny: ny / n }; };
      s += `<path d="M178,134 Q236,138 262,172" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M262,172 l-11,-4 l8,-8 z" fill="${C.grey}"/>`;
      a = { donor: [290, 62], target: [EN.cx + 30, EN.cy + EN.ry + 26], dir: [330, 122], warn: [452, 172], carriers: [14, 360], route: 'pme', carriersLeft: true };
      if (noCoat) { /* ямка не образуется */ }
      else if (stuckCoat) s += vesicleRec(212, 226, VR, coatC) + vesicleRec(262, 316, VR, coatC) + vesicleRec(316, 196, VR, coatC);
      else {
        s += vesicleRec(212, 226, VR, coatC) + (noSnare ? '' : vesicleRec(236, 310, VR, null));
        if (noSnare) {
          [168, 212].forEach(deg => { const e = onE(deg), d = VO + MEM.h / 2 + 4, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
            s += vesicleRec(vx, vy, VR, null) + snarePair(e.x + e.nx * 10, e.y + e.ny * 10, Math.atan2(e.ny, e.nx), false, true) +
              `<line x1="${f(e.x + e.nx * 14)}" y1="${f(e.y + e.ny * 14 - 10)}" x2="${f(vx - e.nx * (VO - 2))}" y2="${f(vy - e.ny * (VO - 2) - 10)}" stroke="${C.grey}" stroke-width="1.6"/>`; });
        } else {
          const e = onE(186), d = VO + MEM.h / 2, vx = e.x + e.nx * d, vy = e.y + e.ny * d;
          s += vesicleRec(vx, vy, VR, null, [90, 210, 330], false) + snarePair(e.x + e.nx * MEM.h / 2, e.y + e.ny * MEM.h / 2, Math.atan2(e.ny, e.nx), true);
        }
      }
    }
    return { s, a };
  }

  /* бесклеточная система Block et al., 1988: донорная и акцепторная стопки Гольджи; free — SNARE освобождаются (NSF работает) */
  const nsfRing = (x, y, on) => { let q = ''; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; q += `<circle cx="${f(x + 9 * Math.cos(a))}" cy="${f(y + 9 * Math.sin(a))}" r="5.2" fill="${on ? '#2E9B57' : '#B8C2CC'}"/>`; }
    return q + (on ? '' : `<path d="M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18" stroke="${C.red}" stroke-width="2.6"/>`); };
  /* VSV-G — трансмембранный гликопротеин (А1-07; Nikolic et al., 2018): точка (x, y) на средней линии бислоя, (nx, ny) — нормаль в цитоплазму;
     короткий хвост — в цитоплазме, крупный гликозилируемый домен — в просвете */
  const vsvg = (x, y, nx, ny) => `<line x1="${f(x + nx * 7)}" y1="${f(y + ny * 7)}" x2="${f(x - nx * 8)}" y2="${f(y - ny * 8)}" stroke="#8a6d00" stroke-width="3" stroke-linecap="round"/>` +
    `<circle cx="${f(x - nx * 12)}" cy="${f(y - ny * 12)}" r="4.4" fill="${C.cargo}" stroke="#8a6d00" stroke-width=".8"/>`;
  const vsvgEll = (cx, cy, rx, ry, y, side) => { const s = (y - cy) / ry, c = side * Math.sqrt(1 - s * s), x = cx + rx * c; let nx = c / rx, ny = s / ry; const n = Math.hypot(nx, ny); return vsvg(x, y, nx / n, ny / n); };
  const vsvgVes = (cx, cy, R, degs) => degs.map(d => { const t = d * Math.PI / 180; return vsvg(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.cos(t), Math.sin(t)); }).join('');
  function golgiPair(free) {
    let q = G('golgi', ['110', '170', '430', '490'].map(x => compartment(+x, 220, 22, 130, '#EFE8F6')).join(''));
    q += G('memcargo', [150, 205, 262].map(y => vsvgEll(170, 220, 22, 130, y, 1)).join(''));
    const xa = 430 - 22 - MEM.h / 2;
    if (free) {
      q += G('vesicle', vesicle(290, 150, 21, null, 0) + vsvgVes(290, 150, 21, [200, 300])) + G('snare', snarePair(290 + 21 + MEM.h / 2 + 6, 150, 0, false));
      q += G('vesicle', vesicle(xa - 21 - MEM.h / 2, 232, 21, null, 0) + vsvgVes(xa - 21 - MEM.h / 2, 232, 21, [140, 220])) + G('snare', snarePair(xa, 232, 0, true));
      q += G('memcargo', [168, 280].map(y => vsvgEll(430, 220, 22, 130, y, -1)).join('')) + G('snare', snarePair(xa - 2, 318, Math.PI / 2, true)) + G('nsf', nsfRing(xa - 28, 318, true));
    } else {
      q += G('vesicle', vesicle(290, 160, 21, null, 0) + vsvgVes(290, 160, 21, [200, 300]) + vesicle(310, 272, 21, null, 0) + vsvgVes(310, 272, 21, [160, 60]));
      q += G('snare', [150, 196, 242, 288, 330].map(y => snarePair(xa - 2, y, Math.PI / 2, true)).join('')) + G('nsf', nsfRing(xa - 46, 336, false));
    }
    q += `<path d="M220,96 L360,96" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M360,96 l-10,-6 l0,12 z" fill="${C.grey}"/>`;
    return q;
  }

  /* ---------- судьба рецептора и лиганда после эндоцитоза (вопрос 3), кадр 600×380 ----------
     dis — лиганд отделяется от рецептора в ранней эндосоме; back — рецептор возвращается на поверхность (иначе — в лизосому).
     Возвращает { s, a }; русского текста нет. */
  function sortScene(dis, back) {
    const Y = 64, EE = { cx: 190, cy: 210, rx: 92, ry: 58 }, LE = { cx: 424, cy: 248, rx: 76, ry: 58 }, LY = { cx: 542, cy: 338, rx: 44, ry: 32 };
    const ligC = '#C0392B';
    const lig = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="${ligC}" stroke="#7a1f16" stroke-width=".8"/>`;
    const recIn = (x, y, side, withL) => `<line x1="${x}" y1="${f(y - side * 10)}" x2="${x}" y2="${f(y + side * 14)}" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x - 6},${f(y + side * 14)} Q${x},${f(y + side * 22)} ${x + 6},${f(y + side * 14)}" fill="none" stroke="${C.rec}" stroke-width="4" stroke-linecap="round"/>` + (withL ? lig(x, y + side * 17) : '');
    let q = `<path d="M0,0 L600,0 L600,${Y} L0,${Y} Z" fill="var(--surface, #f4f7fb)"/>` + line(4, 596, Y);
    /* поверхность: рецепторы, вернувшиеся из эндосомы (back) или их убыль (иначе) */
    const surfX = back ? [380, 440, 500, 560] : [470];
    surfX.forEach((x, i) => { const withL = back && !dis && i === 0; q += recIn(x, Y - 6, -1, withL); });   /* А2-07: комплекс вернулся связанным */
    q += compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo) + compartment(LE.cx, LE.cy, LE.rx, LE.ry, '#EFC3A0') + compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso);
    /* ранняя эндосома: рецепторы в мембране сверху, лиганды в просвете или на рецепторах */
    [150, 190, 230].forEach(x => { const yt = EE.cy - EE.ry * Math.sqrt(1 - ((x - EE.cx) / EE.rx) ** 2); q += recIn(x, yt + 4, 1, !dis); });
    if (dis) q += lig(165, 238) + lig(205, 228) + lig(232, 246);
    /* носитель возврата к поверхности */
    if (back) q += vesicle(300, 120, 20, null, 0) + recIn(300, 104, 1, !dis) + `<path d="M266,150 Q300,96 360,80" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M360,80 l-12,-1 l6,10 z" fill="${C.grey}"/>`;
    /* поздняя эндосома (мультивезикулярное тельце) и лизосома */
    q += `<path d="M282,232 L340,242" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M344,243 l-11,-6 l-1,11 z" fill="${C.grey}"/>`;
    q += `<path d="M486,292 L500,306" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M503,309 l-4,-12 l-8,8 z" fill="${C.grey}"/>`;
    /* внутрипросветная везикула (А1-05): рецептор — в её мембране, цитоплазматический хвост внутри везикулы,
       связанный лиганд — снаружи, в просвете поздней эндосомы (стороны бислоя при впячивании сохраняются) */
    const ilv = (x, y, withRec) => vesicle(x, y, 16, null, 0) + (withRec ? recIn(x, y + 16, 1, true) : '');
    const recToLyso = !back;
    q += ilv(394, 244, recToLyso && !dis) + ilv(454, 250, recToLyso && !dis);
    if (dis) q += lig(400, 283) + lig(432, 288);
    if (recToLyso && dis) q += recIn(410, LE.cy - LE.ry + 6, 1, false);
    /* лизосома: осколки лиганда — только если лиганд направлен на расщепление (А1-24) */
    if (dis || !back) q += [[526, 332], [540, 346], [558, 330], [552, 350], [532, 344]].map(([x, y]) => `<rect x="${x}" y="${y}" width="5" height="3" rx="1" fill="${ligC}" opacity=".7"/>`).join('');
    if (recToLyso) q += [[524, 322], [564, 340]].map(([x, y]) => `<rect x="${x}" y="${y}" width="7" height="3" rx="1" fill="${C.rec}" opacity=".8"/>`).join('');
    return { s: q, a: { surface: [470, 22], ee: [EE.cx, EE.cy + EE.ry + 28], back: [334, 136], le: [LE.cx, LE.cy - LE.ry - 24], ly: [LY.cx - 4, LY.cy + LY.ry + 20], warn: [128, 104] } };
  }

  /* трансферрин и pH (Dautry-Varsat et al., 1983): поверхность клетки, кадр 600×(Y+…); lig: holo | apo | asor */
  const tfMol = (x, y, iron) => `<circle cx="${x}" cy="${y}" r="11" fill="#E9A6A0" stroke="#9c4b44" stroke-width="1.2"/>` + (iron ? `<circle cx="${x - 4}" cy="${y - 2}" r="2.8" fill="#6b1d0f"/><circle cx="${x + 4}" cy="${y + 2}" r="2.8" fill="#6b1d0f"/>` : '');
  const asorMol = (x, y) => `<path d="M${x - 10},${y + 6} L${x},${y - 10} L${x + 10},${y + 6} Z" fill="#8E7CC3" stroke="#5b4a8f" stroke-width="1.2"/>`;
  function tfScene(lig, acid, Y = 200) {
    const bound = lig === 'holo' ? true : lig === 'apo' ? acid : !acid, iron = lig === 'holo' && !acid;
    let q = `<rect x="0" y="0" width="600" height="${Y}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, Y);
    [180, 300, 420].forEach((x, i) => {
      q += G('tfr', receptor(x, Y - 6, -1, false));
      const mol = (xx, yy) => lig === 'asor' ? G('asor', asorMol(xx, yy)) : G('transferrin', tfMol(xx, yy, iron));
      if (bound) q += mol(x, Y - 34);
      else q += mol(x + 26, Y - 98 + i * 12) + `<path d="M${x + 6},${Y - 44} L${x + 18},${Y - 78 + i * 12}" stroke="${C.grey}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    });
    if (lig === 'holo' && acid) q += G('iron', [[100, 96], [200, 116], [420, 100], [500, 124], [550, 86]].map(([x, y]) => `<circle cx="${x}" cy="${y - 200 + Y}" r="2.8" fill="#6b1d0f"/>`).join(''));
    return { s: q, bound, iron };
  }
  /* SNX27–ретромер и GLUT1 (Steinberg et al., 2013): kd — none | snx27 | vps35; dpdz — у GLUT1 нет концевого PDZ-лиганда */
  /* up — цитоплазма над мембраной (верхний участок ограничивающей мембраны эндосомы): PDZ-лиганд на C-конце выступает вверх (А1-06) */
  const glut1 = (x, y, pdz, up = false) => G('glut1', glut1Raw(x, y, pdz, up));
  const glut1Raw = (x, y, pdz, up = false) => `<rect x="${x - 7}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/><rect x="${x + 1}" y="${y - 14}" width="6" height="28" rx="3" fill="#1F8A8A"/>` +
    (pdz ? `<path d="M${x + 4},${y + (up ? -14 : 14)} l6,${up ? -8 : 8}" stroke="#0b5c5c" stroke-width="3" stroke-linecap="round"/>` : '');
  function glutScene(kd, dpdz) {
    const P = 90, EE = { cx: 220, cy: 270, rx: 96, ry: 60 }, LY = { cx: 470, cy: 300, rx: 70, ry: 50 }, pdz = !dpdz, lost = kd !== 'none' || dpdz;
    let q = `<rect x="0" y="0" width="600" height="${P}" fill="var(--surface, #f4f7fb)"/>` + line(6, 594, P);
    q += G('endosome', compartment(EE.cx, EE.cy, EE.rx, EE.ry, C.endo)) + G('lysosome', compartment(LY.cx, LY.cy, LY.rx, LY.ry, C.lyso));
    q += (lost ? [300] : [100, 200, 300, 400, 500]).map(x => glut1(x, P, pdz)).join('') + glut1(200, EE.cy - EE.ry, pdz, true) + (lost ? vesicle(446, LY.cy + 2, 17, null, 0) + vesicle(496, LY.cy + 4, 17, null, 0) + glut1(446, LY.cy - 15, pdz) + glut1(496, LY.cy - 13, pdz) : '')   /* GLUT1 — в мембране внутрипросветных везикул (рецензия v1.0, R30) */;
    if (kd === 'none') { let rt = ''; for (let a = -0.9; a <= -0.2; a += 0.1) rt += `<circle cx="${f(EE.cx + (EE.rx + 16) * Math.cos(a))}" cy="${f(EE.cy + (EE.ry + 16) * Math.sin(a))}" r="4" fill="#3D6B35"/>`; q += G('retromer', rt); }
    q += lost ? `<path d="M318,288 L392,298" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4"/><path d="M398,299 l-11,-6 l-1,11 z" fill="${C.grey}"/>`
              : `<path d="M300,212 Q330,150 340,110" stroke="${C.grey}" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M341,104 l-7,10 l11,2 z" fill="${C.grey}"/>`;
    return { s: q, lost, a: { ee: [EE.cx, EE.cy + EE.ry + 26], ly: [LY.cx, LY.cy + LY.ry + 26], retro: [340, 222], kd: [390, 196], pdz: [300, 130] } };
  }

  /* ---------- ядерная оболочка и пора (вопрос 4), кадр 600×400 ----------
     cargo: small | big | nls | nes; rm: none | imp | exp | ran. Цитоплазма сверху, ядро снизу.
     Модель: мелкая молекула проходит диффузией; крупный белок без сигнала остаётся в цитоплазме;
     NLS + импортин → ядро; NES + экспортин → цитоплазма; без градиента Ran груз не освобождается (импорт) / комплекс не образуется (экспорт). */
  function stadium(x0, x1, yc, h) {
    const r = h / 2, P = [];
    for (let x = x0 + r; x <= x1 - r; x += 4) P.push([x, yc - r]);
    for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 16) P.push([x1 - r + r * Math.cos(a), yc + r * Math.sin(a)]);
    for (let x = x1 - r; x >= x0 + r; x -= 4) P.push([x, yc + r]);
    for (let a = Math.PI / 2; a <= 3 * Math.PI / 2; a += Math.PI / 16) P.push([x0 + r + r * Math.cos(a), yc + r * Math.sin(a)]);
    return P;
  }
  /* o.noImp — не рисовать импортин (данные 1984 г.: узнающий белок ещё не был известен; рецензия v1.0, R34);
     o.ran — показать Ran-ГТФ (закрашенные кружки) и Ran-ГДФ (полые) по сторонам оболочки (R35) */
  /* частицы схемы ядерной поры: общие для статичной схемы и потока частиц */
  const nucBigRaw = (x, y, tag) => `<circle cx="${x}" cy="${y}" r="13" fill="#9FB8D6" stroke="#4f6f94" stroke-width="1.2"/>` + (tag === 'nls' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="${C.red}"/>` : tag === 'mut' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#B8C2CC"/>` : tag === 'nes' ? `<rect x="${x + 9}" y="${y - 4}" width="10" height="8" rx="2" fill="#7C4DBE"/>` : '');
  const nucBig = (x, y, tag) => G({ nls: 'nlsprot', nes: 'nesprot', mut: 'mutprot' }[tag] || 'bigprot', nucBigRaw(x, y, tag));
  const nucImp = (x, y) => G('importin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#2E9B57" stroke-width="6" stroke-linecap="round"/>`);
  const nucExp = (x, y) => G('exportin', `<path d="M${x - 16},${y - 12} A20,20 0 0 0 ${x - 16},${y + 12}" fill="none" stroke="#E8912A" stroke-width="6" stroke-linecap="round"/>`);
  const nucSm = pts => G('smallmol', pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#3B6FB0"/>`).join(''));
  function nucScene(cargo, rm, o = {}) {
    const Yc = 200, H = 52, segs = [[-40, 176], [236, 364], [424, 640]], pores = [206, 394];
    let q = G('nucleus', `<rect x="0" y="${Yc}" width="600" height="${400 - Yc}" fill="#F3EEF8"/>`);
    segs.forEach(([a, b]) => { const P = stadium(a, b, Yc, H); q += G('envelope', `<path d="M${P.map(([x, y]) => f(x) + ',' + f(y)).join(' L')} Z" fill="${C.lumen}"/>` + bilayerPts(P, { closed: true })); });
    /* комплекс ядерной поры: стенки и FG-нити */
    pores.forEach(x => { let w = `<rect x="${x - 34}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/><rect x="${x + 24}" y="${Yc - 30}" width="10" height="60" rx="4" fill="#8C9AA8"/>`;
      for (let i = 0; i < 4; i++) w += `<path d="M${x - 24},${Yc - 20 + i * 13} q12,-5 24,0 t24,0" fill="none" stroke="#B8C2CC" stroke-width="1.4" stroke-dasharray="3 2"/>`; q += G('npc', w); });
