итывается один и тот же.", "s1a_cap_inv_z": "По последовательности аминокислот нельзя однозначно восстановить последовательность мРНК и тем более ДНК: этому мешает вырожденность кода.", "s1a_cap_same": "Выбран тот же нуклеотид, что стоит в кодоне: изменения нет. Выберите другой нуклеотид.", "s1a_cap_same_z": "Сравнивайте варианты с одинаковым числом изменённых нуклеотидов.", "s1a_cap_syn": "Замена в кодоне {k} синонимична: новый кодон кодирует ту же аминокислоту, полипептид не изменился.", "s1a_cap_syn_z": "Последовательность аминокислот та же, но синонимичная замена не обязательно нейтральна: состав кодонов может влиять на стабильность мРНК и количество белка («Новые данные»).", "s1a_cap_mis": "Миссенс-замена в кодоне {k}: одна аминокислота другая, длина ({n}) прежняя.", "s1a_cap_mis_z": "Изменена одна аминокислота; насколько это меняет работу белка, зависит от её места и свойств — по числу изменённых аминокислот функцию не предсказать.", "s1a_cap_non": "Нонсенс-замена в кодоне {k}: полипептид из {n} аминокислот вместо {m}. Ближе к концу кодирующей области такая замена укорачивает полипептид меньше, чем у её начала.", "s1a_cap_non_z": "Одна замена нуклеотида может оборвать полипептид. Что произойдёт с укороченным продуктом, зависит от того, какие части белка успели синтезироваться (вопрос 4).", "s1a_cap_stoploss": "Стоп-кодон утрачен: рибосома продолжила считывание в 3′-нетранслируемую область, полипептид длиннее ({n} вместо {m}).", "s1a_cap_stoploss_z": "Изменения затрагивают не только аминокислоты внутри белка, но и его границы.", "s1a_cap_fs": "Сдвиг рамки в кодоне {k}: полипептид из {n} аминокислот вместо {m}; все остатки после места изменения новые. У начала кодирующей области рамка обрывается быстро, у её конца новая рамка может продолжиться за обычный стоп-кодон в 3′-нетранслируемую область.", "s1a_cap_fs_z": "Один нуклеотид — а последствия разные: длина продукта и число новых остатков зависят от того, где изменение и где в новой рамке встретится стоп-кодон.", "s1a_cap_fs0": "Сдвиг рамки в кодоне {k} сразу образовал стоп-кодон: полипептид из {n} аминокислот вместо {m}, новых остатков нет — синтез обрывается на месте изменения.", "s1a_cap_fs0_z": "Сдвиг рамки не всегда добавляет новые аминокислоты: если первый же кодон новой рамки — стоп-кодон, продукт просто укорочен.", "s1a_cap_inframe_ins": "Вставка трёх нуклеотидов без сдвига рамки: полипептид из {n} аминокислот вместо {m}. Если вставка пришлась внутрь кодона, изменилась и соседняя аминокислота.", "s1a_cap_inframe_ins_z": "Изменение длины, кратное трём, рамку не сдвигает; но положение относительно границы кодона определяет, одна или две аминокислоты затронуты.", "s1a_cap_inframe_del": "Делеция трёх нуклеотидов без сдвига рамки: полипептид из {n} аминокислот вместо {m}. Если делеция начинается внутри кодона, затрагиваются два соседних кодона и вместо двух аминокислот остаётся одна — иногда новая.", "s1a_cap_inframe_del_z": "Одинаковое число удалённых нуклеотидов (три) даёт разный результат в зависимости от положения относительно рамки.", "s1a_cap_inframe_stop": "Изменение длины кратно трём, но на месте изменения возник стоп-кодон: полипептид из {n} аминокислот вместо {m}.", "s1a_cap_inframe_stop_z": "Сохранение рамки не гарантирует сохранения длины полипептида: важно, какие кодоны образовались.", "s1a_take": "Последствия изменения нуклеотидов определяет не их число, а положение относительно рамки считывания и то, какие кодоны получились. Замена третьего нуклеотида часто, но не всегда синонимична (у лизина AAA → AAC — уже аспарагин; у триптофана UGG → UGA — стоп-кодон), а у некоторых аминокислот синонимы различаются и первым нуклеотидом. Сдвиг рамки у начала кодирующей области обрывает полипептид быстро, у конца может удлинить его за счёт 3′-нетранслируемой области; три нуклеотида внутри кодона меняют две соседние аминокислоты. Функциональную активность белка нельзя предсказать по числу изменённых аминокислот; синонимичная замена не обязательно биологически нейтральна.", "s1a_lim": "Модель рассчитывает только последовательность полипептида. Она не показывает, как изменение возникло (мутация ДНК, ошибка транскрипции, редактирование РНК), не учитывает влияние изменений на сплайсинг, стабильность мРНК, скорость трансляции, сворачивание и активность белка, а также распад мРНК с преждевременным стоп-кодоном (вопрос 4 и курс «Молекулярная биология»). Код митохондрий отличается от стандартного (например, UGA в митохондриях человека кодирует триптофан), и модель его не использует.", "s1a_new": "Синонимичные замены могут менять количество белка. В клетках человека сравнили 12 вариантов последовательности, кодирующей один и тот же флуоресцентный белок: варианты различались только кодонами-синонимами. Яркость клеток, по которой судили о количестве белка, различалась почти в 50 раз и в целом соответствовала стабильности мРНК, предсказанной по составу кодонов. Один вариант вообще не дал заметного белка — это авторы объясняют уже не составом кодонов, а другими свойствами последовательности. Важнее оказалось, какие кодоны заменены, а не сколько: вариант, отличавшийся от исходной последовательности в 78 кодонах, давал почти столько же белка.", "s1a_how": "в клетки человека (линия 293T) вводили варианты гена с разными наборами кодонов-синонимов и измеряли свечение белка; то же проверили на эмбрионах рыбы данио. В вариантах менялось много кодонов сразу, поэтому о последствиях одной синонимичной замены в конкретном гене эти данные прямо не говорят.", "p1a_1_q": "Условия: мРНК — на схеме. В кодоне 7 (GCU, аланин) заменяется третий нуклеотид. Изменится ли полипептид, если U заменить на A?", "p1a_1_o1": "Нет: GCA тоже кодирует аланин", "p1a_1_o2": "Да: любая замена нуклеотида меняет аминокислоту", "p1a_1_o3": "Да: синтез оборвётся на этом кодоне", "p1a_1_e": "Аланин кодируют GCU, GCC, GCA и GCG: в третьей позиции годится любой нуклеотид. Для таких аминокислот любая замена третьего нуклеотида синонимична.", "p1a_1_w2": "Код вырожден: GCA тоже кодирует аланин.", "p1a_1_w3": "GCA — смысловой кодон, а не стоп-кодон.", "p1a_1_h1": "Найдите в таблице кода все кодоны аланина.", "p1a_2_q": "Третий нуклеотид меняется в кодоне 3 (AAA, лизин): A → C. Синонимична ли эта замена, как замена третьего нуклеотида в кодоне аланина GCU?", "p1a_2_o1": "Нет: AAC кодирует уже аспарагин", "p1a_2_o2": "Да: третья позиция кодона всегда синонимична", "p1a_2_o3": "Нет: AAC — один из стоп-кодонов", "p1a_2_e": "У лизина только два кодона (AAA и AAG); AAU и AAC кодируют аспарагин. Третья позиция синонимична не у всех аминокислот: у одних годится любой нуклеотид, у других — только пурин или только пиримидин.", "p1a_2_w2": "Синонимы чаще всего различаются третьим нуклеотидом, но это не правило для всех кодонов.", "p1a_2_w3": "Стоп-кодоны — UAA, UAG и UGA; AAC — кодон аспарагина.", "p1a_2_h1": "Сколько кодонов у лизина и чем они отличаются от кодонов аспарагина?", "p1a_3_q": "Вставка одного нуклеотида C после первого нуклеотида кодона 3 обрывает полипептид на пятой аминокислоте. Что даст такая же вставка в кодоне 11?", "p1a_3_o1": "Изменятся только последние аминокислоты, и полипептид может стать даже длиннее нормы", "p1a_3_o2": "Тоже пять аминокислот: вставка одного нуклеотида всегда даёт одинаковый результат", "p1a_3_o3": "Изменений не будет: у конца кодирующей области рамка не важна", "p1a_3_e": "Сдвиг рамки меняет только кодоны ниже места изменения. У конца кодирующей области их мало, и новая рамка может пройти за прежний стоп-кодон в 3′-нетранслируемую область — полипептид из 14 аминокислот вместо 12.", "p1a_3_w2": "Длина продукта зависит от того, где в новой рамке встретится стоп-кодон, а это зависит от места вставки.", "p1a_3_w3": "Рамка важна по всей кодирующей области: последние кодоны тоже читаются иначе.", "p1a_3_h1": "Сколько кодонов остаётся ниже места вставки в каждом случае?", "p1a_3_h2": "Есть ли стоп-кодон в новой рамке до прежнего стоп-кодона?", "p1a_4_q": "Удаление трёх нуклеотидов кодона 7 целиком (GCU) убирает аланин. А что даст удаление трёх нуклеотидов, начиная со второго нуклеотида кодона 7?", "p1a_4_o1": "Вместо аланина и изолейцина будет один валин", "p1a_4_o2": "Рамка сдвинется, все аминокислоты дальше новые", "p1a_4_o3": "Не будет одного аланина, как при удалении GCU", "p1a_4_e": "От GCU AUA остаётся G…UA = GUA (валин). Число удалённых нуклеотидов кратно трём, поэтому рамка ниже сохранена, но две аминокислоты заменены одной новой.", "p1a_4_w2": "Удалены три нуклеотида — рамка не сдвигается.", "p1a_4_w3": "Делеция, начинающаяся внутри кодона, затрагивает два кодона, и образуется новый кодон.", "p1a_4_h1": "Выпишите кодоны 7 и 8 (GCU AUA) и удалите C, U и A.", "p1a_5_q": "Обратная задача: на схеме — две мРНК, отличающиеся в семи нуклеотидах; полипептид по ним одинаков. Следует ли отсюда, что они транскрибированы с одинаковой последовательности ДНК?", "p1a_5_o1": "Нет: одинаковый белок кодируют и разные мРНК", "p1a_5_o2": "Да: одинаковый белок кодирует одинаковая ДНК", "p1a_5_o3": "Да: различия мРНК возникли уже при трансляции", "p1a_5_e": "Одинаковый полипептид при разных мРНК объясняется вырожденностью кода. мРНК комплементарна матричной цепи ДНК, поэтому разные мРНК указывают на разные последовательности ДНК (например, на разные аллели или гены). Исключения возможны — редактирование РНК меняет её после транскрипции, — но это отдельный процесс, и о нём по белку не судят. По белку нельзя восстановить ни мРНК, ни ДНК: у лейцина, серина и аргинина синонимы различаются даже первым нуклеотидом.", "p1a_5_w2": "Одинаковый белок могут кодировать разные мРНК: кодонов больше, чем аминокислот.", "p1a_5_w3": "Трансляция не меняет мРНК: она её считывает.", "p1a_5_h1": "Сравните кодоны 2: UCC и AGC. Какую аминокислоту кодирует каждый?", "p1a_5_h2": "Как связаны последовательность мРНК и матричной цепи ДНК (семинар 9)?", "p1a_6_q": "Замена второго нуклеотида кодона 11 (UGG → UAG) изменила одну позицию, как и миссенс-замена. Можно ли по числу изменённых нуклеотидов или аминокислот предсказать активность белка?", "p1a_6_o1": "Нет: последствия зависят от того, что и где изменилось", "p1a_6_o2": "Да: чем больше изменено, тем ниже активность", "p1a_6_o3": "Да: одна замена никогда не меняет активности", "p1a_6_e": "Одна замена может ничего не изменить, заменить аминокислоту или оборвать полипептид. UGG → UAG создаёт стоп-кодон, и полипептид короче на две аминокислоты. Активность белка определяют его структура и важность изменённых участков; модель её не рассчитывает.", "p1a_6_w2": "Даже одна замена в активном центре может выключить фермент, а несколько замен на поверхности — почти не сказаться.", "p1a_6_w3": "Одна замена может создать стоп-кодон или заменить ключевую аминокислоту.", "s2a_prob": "Одна и та же мРНК (11 смысловых кодонов, изолейцин — в позициях 3, 6 и 10) транслируется в 10 условных молекул белка. Как различаются замены аминокислот, если изменён кодон в мРНК, если синтетаза изолейцина присоединяет к тРНК изолейцина валин или если рибосома чаще ошибается при декодировании? Можно ли по набору продуктов определить причину?", "s2a_edit": "Изолейцил-тРНК-синтетаза", "s2a_edit_on": "с коррекцией", "s2a_edit_off": "без коррекции", "s2a_dec": "Точность декодирования", "s2a_dec_norm": "обычная", "s2a_dec_low": "снижена", "s2a_mrna": "Кодон 6 мРНК", "s2a_mrna_norm": "AUC", "s2a_mrna_gene": "GUC", "s2a_note": "Цитоплазма клетки человека; 10 молекул продукта одной мРНК. Без коррекции синтетаза в модели присоединяет к тРНК изолейцина валин в 20 % случаев — у тРНК прежний антикодон. При сниженной точности декодирования в 10 молекулах появляются четыре разрозненные ошибки. Обе частоты условные и многократно увеличены: в клетке на десять молекул из 11 аминокислот приходилось бы гораздо меньше ошибок. Изменение кодона 6 (AUC → GUC) в модели есть во всех молекулах мРНК; как оно возникло, модель не рассматривает.", "a2_pA": "А. мРНК (5′→3′)", "a2_lbl_mrna_hidden": "последовательность мРНК и гена не исследована", "a2_lbl_ile": "Ile", "a2_pB": "Б. 10 молекул продукта (красным — замены)", "a2_lbl_mol": "{n}", "a2_lbl_count": "В. Итог. Замен: {n} · на местах изолейцина: {i} · в других местах: {o}", "a2_lbl_inv": "В. Итог. В позиции 6 валин вместо изолейцина в {n} из 10 молекул; другие позиции не исследованы", "s2a_r_val": "тРНК изолейцина с валином", "s2a_r_val_s": "доля, условно", "s2a_v_pct": "{n} %", "s2a_r_n": "Замен аминокислот", "s2a_r_n_s": "во всех 10 молекулах", "s2a_v_n": "{n}", "s2a_r_ile": "На местах изолейцина (3, 6, 10)", "s2a_r_other": "В других позициях", "s2a_r_pos": "Позиции с заменами", "s2a_v_pos": "{s}", "s2a_r_inv": "Наблюдение", "s2a_v_inv": "валин в позиции 6 в части молекул", "s2a_cap_mask": "Обратная задача: в части молекул белка в позиции 6 валин вместо изолейцина. Другие позиции, мРНК и ген не исследованы.", "s2a_cap_mask_z": "Какие механизмы дают такое наблюдение и что нужно узнать, чтобы их различить?", "s2a_cap_inv": "Одно из совместимых объяснений: синтетаза без коррекции. Тогда валин стоит не только в позиции 6, но и в позициях 3 и 10 — на местах изолейцина и в других белках клетки.", "s2a_cap_inv_z": "Одно наблюдение совместимо с несколькими механизмами; различает их распределение замен по позициям и белкам, последовательность мРНК и гена.", "s2a_cap_on_norm_norm": "Синтетаза с коррекцией, обычная точность декодирования, исходная мРНК: в 10 молекулах замен нет.", "s2a_cap_on_norm_norm_z": "Это не значит, что ошибок нет совсем: в клетке они случаются, но слишком редко, чтобы встретиться в десяти коротких молекулах.", "s2a_cap_off_norm_norm": "Без коррекции часть тРНК изолейцина несёт валин. Антикодон у неё прежний, рибосома проверяет только спаривание — и валин встаёт на места изолейцина: в шести из 30 таких мест, в разных молекулах.", "s2a_cap_off_norm_norm_z": "Ошибка аминоацилирования однотипна (валин вместо изолейцина), но затрагивает часть молекул и может проявляться в разных белках, содержащих изолейцин.", "s2a_cap_on_norm_gene": "Кодон 6 в мРНК заменён (AUC → GUC): валин в позиции 6 во всех 10 молекулах, остальные позиции не изменены.", "s2a_cap_on_norm_gene_z": "Изменение последовательности нуклеиновой кислоты даёт одну и ту же замену в одной позиции у всех молекул, транслированных с этой мРНК.", "s2a_cap_on_low_norm": "Сниженная точность декодирования: четыре разрозненные замены — в разных молекулах, разных позициях и с разными аминокислотами.", "s2a_cap_on_low_norm_z": "Ошибка декодирования случайна: тРНК с почти подходящим антикодоном приносит свою аминокислоту в случайное место.", "s2a_cap_off_low_norm": "Два источника сразу: валин на местах изолейцина (ошибка аминоацилирования) и разрозненные замены в других позициях (ошибки декодирования).", "s2a_cap_off_low_norm_z": "Источники ошибок складываются; различить их помогает характер замен — какие аминокислоты и в каких позициях.", "s2a_cap_off_norm_gene": "Изменённая мРНК и синтетаза без коррекции: валин в позиции 6 во всех молекулах и вдобавок в части позиций 3 и 10.", "s2a_cap_off_norm_gene_z": "Одинаковая замена (изолейцин → валин) может возникать разными путями; различает их распределение по позициям.", "s2a_cap_on_low_gene": "Изменённая мРНК и сниженная точность декодирования: валин в позиции 6 во всех молекулах и разрозненные замены в других местах.", "s2a_cap_on_low_gene_z": "Постоянная замена в одной позиции у всех молекул указывает на изменение последовательности; случайные — на декодирование.", "s2a_cap_off_low_gene": "Все три источника сразу: замена во всех молекулах в позиции 6, валин в части мест изолейцина и разрозненные ошибки.", "s2a_cap_off_low_gene_z": "Чем больше источников, тем важнее смотреть на распределение замен, а не на одну позицию.", "s2a_take": "Правильное спаривание кодона и антикодона не гарантирует правильной аминокислоты: если тРНК изолейцина ошибочно заряжена валином, рибосома встраивает валин, потому что проверяет пару кодон — антикодон, а не аминокислоту. Корректирующая активность синтетаз удаляет большую часть ошибочно присоединённых аминокислот, поэтому не всякая ошибка активации доходит до белка. Разные источники дают разную картину: изменение последовательности мРНК — одну замену в одной позиции у всех молекул; ошибка аминоацилирования — замену одного типа на местах одной аминокислоты в части молекул многих белков; ошибка декодирования — разрозненные замены. Одинаковая замена в одной позиции сама по себе не доказывает ни одного из механизмов.", "s2a_lim": "Частоты ошибок в модели условные и увеличены во много раз; в клетке синтетазы ошибаются примерно один раз на 40 000 присоединений, а трансляция в целом — около одного раза на 10 000 аминокислот. Модель не показывает, как ошибочно заряженная тРНК связывается с фактором элонгации и насколько эффективно используется рибосомой, не учитывает транскрипционные ошибки, сплайсинг и разные копии гена (аллели), а также то, как замены влияют на сворачивание и удаление белков.", "s2a_new": "Корректирующая активность синтетазы нужна и в митохондриях. В клетках мыши в корректирующем центре митохондриальной треонил-тРНК-синтетазы заменили две аминокислоты. Около 3,4 % митохондриальной тРНК треонина оказалось ошибочно заряжено серином (в клетках с нормальным ферментом такой тРНК не нашли), и рибосомы митохондрий встраивали серин на места треонина: в 10 исследованных белках, синтезируемых в митохондриях, на 81 кодон треонина нашли 16 таких замен — в 7 белках (авторы осторожно оценивают долю замен примерно в 20 %: исследованных участков белков немного). Работа митохондрий нарушалась, клетки делились медленнее, а у мышей с таким дефектом в сердце развивалась кардиомиопатия.", "s2a_how": "в клетках мыши изменили ген синтетазы и определили, какая аминокислота присоединена к тРНК треонина и какие аминокислоты стоят на местах треонина в митохондриальных белках; сравнивали с клетками с нормальным ферментом; у мышей дефект создали только в сердце. Это показывает, что ошибочно заряженная тРНК используется рибосомой, когда коррекция нарушена, но не говорит, сколько таких ошибок бывает в норме: в нормальных клетках ошибочно заряженной тРНК не обнаружили.", "p2a_1_q": "Условия: мРНК — на схеме, 10 молекул продукта. Синтетаза изолейцина утратила корректирующую активность; остальное в норме. Где появятся замены?", "p2a_1_o1": "Валин на местах изолейцина в части молекул", "p2a_1_o2": "Валин только в позиции 6 во всех молекулах", "p2a_1_o3": "Разные аминокислоты в случайных позициях", "p2a_1_e": "Часть тРНК изолейцина несёт валин. Её антикодон спаривается с кодонами изолейцина, и валин встаёт туда, где должен быть изолейцин, — в тех молекулах, где на этот кодон пришла ошибочно заряженная тРНК.", "p2a_1_w2": "Одна позиция во всех молекулах — признак изменения самой мРНК; здесь мРНК исходная.", "p2a_1_w3": "Разрозненные разные замены дают ошибки декодирования; ошибка синтетазы даёт замену одного типа.", "p2a_1_h1": "С какими кодонами спаривается тРНК изолейцина — и что она теперь иногда несёт?", "p2a_2_q": "Синтетаза с коррекцией, но в мРНК кодон 6 заменён: AUC → GUC. Что увидим?", "p2a_2_o1": "Валин в позиции 6 у всех, другие места без изменений", "p2a_2_o2": "Валин на всех местах изолейцина в части молекул", "p2a_2_o3": "Замен не будет: рибосома исправит изменённый кодон", "p2a_2_e": "Каждая рибосома читает кодон GUC и получает валин от тРНК валина. Изменение последовательности дает одну и ту же замену в одной позиции у всех молекул.", "p2a_2_w2": "Изменён только кодон 6; кодоны 3 и 10 прежние.", "p2a_2_w3": "Рибосома не исправляет мРНК: она считывает то, что есть.", "p2a_3_q": "мРНК и синтетаза в норме, но снижена точность декодирования. Как будут распределены замены?", "p2a_3_o1": "Разные замены в разных позициях и молекулах", "p2a_3_o2": "Валин на всех местах изолейцина в части молекул", "p2a_3_o3": "Одна и та же замена во всех десяти молекулах", "p2a_3_e": "При ошибке декодирования в A-сайте удерживается тРНК с почти подходящим антикодоном, и в случайное место встаёт её аминокислота.", "p2a_3_w2": "Валин на местах изолейцина — признак ошибки аминоацилирования.", "p2a_3_w3": "Одна замена у всех молекул — признак изменения мРНК.", "p2a_4_q": "Синтетаза изолейцина без коррекции, мРНК и рибосома в норме. Почему валин появляется только на местах изолейцина (позиции 3, 6, 10), а не в других позициях?", "p2a_4_o1": "Валин несёт тРНК изолейцина, она идёт к кодонам изолейцина", "p2a_4_o2": "Рибосома ставит валин туда, где он похож на изолейцин", "p2a_4_o3": "Кодоны изолейцина в мРНК заменились кодонами валина", "p2a_4_e": "Синтетаза без коррекции присоединяет валин к тРНК изолейцина. Антикодон у этой тРНК прежний: она спаривается с кодонами изолейцина, и рибосома, которая проверяет пару кодон — антикодон, а не аминокислоту, встраивает валин на эти места.", "p2a_4_w2": "Рибосома не сравнивает аминокислоту с её местом в белке: она проверяет только пару кодон — антикодон.", "p2a_4_w3": "мРНК не изменялась: замена возникла при аминоацилировании тРНК.", "p2a_5_q": "Обратная задача: в части молекул белка в позиции 6 стоит валин вместо изолейцина; другие позиции, мРНК и ген не исследованы. Какой вывод допустим?", "p2a_5_o1": "Совместимы несколько механизмов; нужны другие данные", "p2a_5_o2": "Это доказывает ошибку аминоацилирования тРНК", "p2a_5_o3": "Это доказывает изменение последовательности гена", "p2a_5_e": "Замена в части молекул совместима и с ошибкой синтетазы, и с изменением одной из двух копий гена (тогда часть мРНК несёт GUC), и — реже — со случайными ошибками. Ошибку синтетазы подтвердит валин на других местах изолейцина и в других белках; изменение гена — последовательность ДНК и мРНК.", "p2a_5_w2": "Одно наблюдение не исключает других объяснений; ошибку синтетазы выдал бы валин и в позициях 3 и 10.", "p2a_5_w3": "Изменение гена устанавливают, сравнивая последовательность ДНК, а не по продукту.", "p2a_5_h1": "Какие источники в модели дают валин вместо изолейцина?", "p2a_5_h2": "Какое наблюдение каждый из них предсказывает в позициях 3 и 10?", "p2a_6_q": "Почему ошибка аминоацилирования может быть опаснее редкой ошибки декодирования?", "p2a_6_o1": "Дефект синтетазы может давать однотипные замены в разных белках", "p2a_6_o2": "Ошибка аминоацилирования меняет последовательность мРНК", "p2a_6_o3": "Её нельзя предотвратить никаким механизмом клетки", "p2a_6_e": "Если синтетаза утратила корректирующую активность и при трансляции используется неправильно аминоацилированная тРНК, возникают однотипные замены в разных белках, содержащих эту аминокислоту, — в части молекул; рибосома их не отбраковывает, потому что проверяет пару кодон — антикодон. Ошибки декодирования редкие и разрозненные. Доля 20 % в модели — учебное допущение.", "p2a_6_w2": "мРНК не меняется: ошибка — в аминокислоте, которую несёт тРНК.", "p2a_6_w3": "Корректирующая активность синтетаз как раз предотвращает большую часть таких ошибок.", "s3a_prob": "По одной мРНК (кодирующая область — 120 кодонов) одновременно движутся несколько рибосом — это полисома. Как частота инициации, время на обычном кодоне и нехватка аминоацил-тРНК для одного кодона влияют на число рибосом на мРНК и на число завершённых полипептидов? Всегда ли больше рибосом — значит больше белка?", "s3a_ki": "Инициация возможна раз в", "s3a_ki_8": "8 ед.", "s3a_ki_16": "16 ед.", "s3a_ki_32": "32 ед.", "s3a_slow": "Время на кодоне 80 (мало аминоацил-тРНК)", "s3a_slow_1": "1 ед.", "s3a_slow_10": "10 ед.", "s3a_slow_22": "22 ед.", "s3a_step": "Время на обычном кодоне", "s3a_step_1": "1 ед.", "s3a_step_2": "2 ед.", "s3a_note": "Цитоплазма клетки человека, одна молекула мРНК. Учебная модель с условными единицами времени (ед.). Рибосома занимает 10 кодонов и не обгоняет соседнюю; если начало мРНК занято, инициация откладывается до его освобождения, а следующая возможность инициации за это время пропускается. Время на кодоне 80 удлиняется, когда для него мало нужной аминоацил-тРНК. Наблюдение — за 600 ед. от появления мРНК; числа получаются расчётом модели и не являются измеренными значениями.", "a3_pA": "А. Полисома в момент наблюдения: рибосомы на мРНК", "a3_lbl_start": "старт", "a3_lbl_stop": "стоп", "a3_lbl_slow": "кодон 80", "a3_lbl_hidden": "расположение рибосом не исследовано", "a3_lbl_scale": "каждый серый прямоугольник — рибосома (10 кодонов); 5′ слева, 3′ справа", "a3_pB": "Б. Итоги за время наблюдения", "a3_b_init": "инициаций", "a3_b_on": "на мРНК", "a3_b_done": "завершено", "a3_b_missed": "пропущено\nинициаций", "a3_lbl_cellA": "Клетка 1", "a3_lbl_cellB": "Клетка 2", "a3_lbl_pair": "завершено {d} · рибосом на мРНК: {n} (до кодона 80 — {u}) · пропущено инициаций: {m}", "a3_lbl_pair_m": "завершено полипептидов: {d}", "s3a_v_done_only": "завершено {d}", "s3a_v_pair": "завершено {d}, на мРНК {n} (до кодона 80 — {u}), пропущено {m}", "s3a_cap_mask": "Обратная задача: в двух клетках за одно и то же время завершено одинаково мало полипептидов (по 15). Известно, что в одной клетке редка инициация, в другой мало аминоацил-тРНК для одного кодона. Расположение рибосом не исследовано.", "s3a_cap_mask_z": "Какие наблюдения различат эти причины?", "s3a_cap_inv": "Клетка 1 (редкая инициация): на мРНК мало рибосом, они распределены редко, все возможные инициации состоялись. Клетка 2 (мало аминоацил-тРНК для кодона 80): перед этим кодоном скопились рибосомы, за ним их мало, многие инициации не состоялись, потому что начало мРНК занято.", "s3a_cap_inv_z": "Одинаковое число завершённых полипептидов не говорит о причине; её выдают число рибосом на мРНК и их распределение.", "s3a_r_init": "Инициаций", "s3a_r_init_s": "рибосом начали синтез", "s3a_v_n": "{n}", "s3a_r_on": "Рибосом на мРНК", "s3a_r_on_s": "в момент наблюдения", "s3a_v_on": "{n}: до кодона 80 — {u}, после — {d}", "s3a_r_done": "Завершено полипептидов", "s3a_r_done_s": "полноразмерный продукт", "s3a_r_missed": "Пропущено инициаций", "s3a_r_missed_s": "начало мРНК было занято", "s3a_r_bal": "Баланс", "s3a_v_bal": "{i} = {d} + {n}", "s3a_cap_init": "Поток рибосом задаёт частота инициации: все возможные инициации состоялись, рибосомы идут по мРНК без задержек и распределены по ней редко.", "s3a_cap_init_z": "Если ограничивает инициация, рибосом на мРНК мало и они не скапливаются. Ускорение элонгации сокращает время прохода рибосомы, но сколько полипептидов завершается за единицу времени в установившемся режиме, определяет частота инициации.", "s3a_cap_slow": "Ограничивает кодон 80: на нём рибосомы задерживаются, пока не поступит нужная аминоацил-тРНК. Перед ним очередь, за ним рибосом мало, начало мРНК часто занято, и часть возможных инициаций пропускается. Завершённых полипептидов меньше, чем позволила бы частота инициации.", "s3a_cap_slow_z": "Больше рибосом на мРНК не означает больше белка: рибосомы могут накапливаться перед медленным участком.", "s3a_cap_start": "Инициация возможна чаще, чем рибосома успевает освободить начало мРНК: часть инициаций не состоялась, рибосомы идут по мРНК плотно, одна за другой.", "s3a_cap_start_z": "При частой инициации поток рибосом упирается в скорость элонгации: увеличение частоты инициации дальше белка не прибавляет.", "s3a_take": "Число завершённых полипептидов определяется самым медленным этапом — инициацией или прохождением какого-то участка мРНК. Число инициировавших рибосом равно сумме завершивших синтез и ещё находящихся на мРНК. Если ограничивает инициация, рибосом на мРНК мало и они распределены редко; если ограничивает элонгация на участке, где мало аминоацил-тРНК, рибосомы скапливаются перед ним — их на мРНК больше, а готового белка меньше. Поэтому по числу рибосом на мРНК нельзя напрямую судить о количестве синтезированного белка; соотношение не является универсальным количественным законом.", "s3a_lim": "Модель детерминированная и условная: все рибосомы движутся одинаково, время в условных единицах, мРНК не разрушается и не регулируется. Она не учитывает реального разнообразия инициации (разные наборы факторов, повторную инициацию), различий в скорости прочтения разных кодонов, столкновений рибосом и систем контроля качества трансляции, которые снимают остановившиеся рибосомы (курс «Молекулярная биология»). Пропуск инициации — упрощение: в клетке инициация может быть лишь отложена. Рибосома занимает в модели 10 кодонов — условная длина; на реальных мРНК соседние рибосомы обычно отстоят друг от друга дальше. Числа за 600 ед. включают время прохода первой рибосомы по мРНК, поэтому замедление элонгации немного уменьшает число завершённых полипептидов и при редкой инициации.", "s3a_new": "Инициация — наиболее регулируемый и самый разнообразный этап трансляции: элонгацию и терминацию разные мРНК проходят с общим набором факторов, а для инициации могут использовать разные наборы. По строению комплекса малой субчастицы с факторами инициации на мРНК человека связанный с кэпом комплекс eIF4F располагается со стороны 5′-конца. Чтобы старт-кодон оказался в P-сайте, он должен отстоять от 5′-конца не менее чем примерно на 40 нуклеотидов. Обычная 5′-НТО длиннее (медиана у человека — 218 нуклеотидов, у пекарских дрожжей — 53), а мРНК с очень короткой 5′-НТО — около 4 % белок-кодирующих генов несут особые элементы для такой инициации — по-видимому, начинают трансляцию иным путём.", "s3a_how": "обзор обобщает структурные работы, в которых определили пространственное строение комплекса малой субчастицы рибосомы человека с факторами инициации и мРНК, и биохимические данные о минимальном расстоянии от кэпа до старт-кодона. В других работах трансляция начиналась и с AUG, стоящего всего в двух нуклеотидах от кэпа, поэтому вопрос о минимальном расстоянии не решён окончательно.", "p3a_1_q": "Условия: инициация возможна раз в 16 ед., все кодоны проходятся за 1 ед. Инициация стала вдвое реже (раз в 32 ед.). Что изменится через 600 ед.?", "p3a_1_o1": "Меньше рибосом на мРНК и меньше завершённых полипептидов", "p3a_1_o2": "Рибосом на мРНК меньше, а завершённых полипептидов столько же", "p3a_1_o3": "Рибосомы скопятся перед кодоном 80", "p3a_1_e": "Когда ограничивает инициация, поток рибосом определяется её частотой: реже инициация — меньше рибосом на мРНК (3 вместо 7) и меньше завершённых полипептидов (15 вместо 30).", "p3a_1_w2": "Каждый завершённый полипептид — это рибосома, которая когда-то начала синтез; реже начинают — реже и заканчивают.", "p3a_1_w3": "Кодон 80 здесь проходится так же быстро, как остальные; очереди нет.", "p3a_2_q": "Инициация возможна раз в 16 ед., обычный кодон проходится за 1 ед. Для кодона 80 стало мало аминоацил-тРНК: рибосома задерживается на нём 22 ед. Что будет с числом рибосом на мРНК и числом завершённых полипептидов?", "p3a_2_o1": "Рибосомы скопятся перед кодоном 80, полипептидов меньше", "p3a_2_o2": "Рибосом станет меньше, а полипептидов — больше", "p3a_2_o3": "Ничего не изменится: частота инициации та же", "p3a_2_e": "Через кодон 80 проходит не больше одной рибосомы за 22 ед. Перед ним выстраивается очередь (на мРНК 9 рибосом вместо 7, из них 8 — до кодона 80), начало мРНК оказывается занятым, и часть возможных инициаций пропускается. Завершено 15 полипептидов вместо 30.", "p3a_2_w2": "Рибосомы не исчезают, а задерживаются на мРНК; полипептиды завершаются реже.", "p3a_2_w3": "Та же частота инициации не помогает, если рибосомы не могут быстро пройти медленный участок.", "p3a_2_h1": "Сколько рибосом в единицу времени может пройти кодон 80?", "p3a_3_q": "При задержке на кодоне 80 (инициация раз в 16 ед.) на мРНК 9 рибосом и завершено 15 полипептидов, без задержки — 7 рибосом и 30 полипептидов. Значит ли большее число рибосом на мРНК большее количество белка?", "p3a_3_o1": "Нет: важно, сколько рибосом завершают синтез", "p3a_3_o2": "Да: каждая рибосома на мРНК — будущий полипептид", "p3a_3_o3": "Да: число рибосом пропорционально скорости синтеза", "p3a_3_e": "Число рибосом на мРНК зависит и от того, как часто они садятся, и от того, как долго они на ней находятся. При задержке на кодоне 80 рибосомы дольше остаются на мРНК, а синтез завершают реже: 9 рибосом и 15 полипептидов против 7 и 30.", "p3a_3_w2": "Рибосомы, стоящие в очереди, белок не прибавляют, пока не пройдут медленный участок.", "p3a_3_w3": "Пропорциональность верна только при одинаковой скорости движения рибосом; это не универсальный закон.", "p3a_4_q": "Инициация раз в 16 ед.; время на каждом обычном кодоне выросло с 1 до 2 ед. Что изменится?", "p3a_4_o1": "Рибосом на мРНК станет больше, завершённых полипептидов — меньше, часть возможных инициаций будет пропущена", "p3a_4_o2": "Изменится только скорость синтеза одного полипептида, число завершённых не изменится", "p3a_4_o3": "Все рибосомы скопятся перед кодоном 80", "p3a_4_e": "Замедление всех кодонов удлиняет путь каждой рибосомы (рибосом на мРНК больше: 12 вместо 7) и замедляет освобождение начала мРНК: часть возможных инициаций пропускается, завершено 18 полипептидов вместо 30.", "p3a_4_w2": "Медленнее освобождается и начало мРНК, поэтому меняется и число инициаций.", "p3a_4_w3": "Кодон 80 замедлен так же, как остальные; особой очереди перед ним нет.", "p3a_5_q": "Обратная задача: в двух клетках за одно время завершено по 15 полипептидов. В одной редка инициация, в другой мало аминоацил-тРНК для кодона 80. Что различит эти причины?", "p3a_5_o1": "Число рибосом на мРНК и их распределение", "p3a_5_o2": "Число завершённых полипептидов за то же время", "p3a_5_o3": "Длина и последовательность полипептида", "p3a_5_e": "При редкой инициации рибосом на мРНК мало (3) и они распределены редко; при нехватке аминоацил-тРНК их больше (9), они скапливаются перед кодоном 80, и многие инициации не состоялись. Проверкой служило бы и добавление нужной аминоацил-тРНК: оно ускорит синтез только во второй клетке.", "p3a_5_w2": "По условию это число одинаково — оно и не различает причины.", "p3a_5_w3": "В обеих клетках синтезируется один и тот же полноразмерный полипептид.", "p3a_5_h1": "Где будут стоять рибосомы, если медленно проходится один участок?", "s4a_prob": "За условный период клетка синтезирует 100 или 50 полипептидов одного белка. Часть синтезов завершается преждевременно, часть полноразмерных цепей сворачивается неправильно; система контроля качества удаляет часть аномальных форм, а правильно свёрнутый белок обновляется. Как связаны число синтезированных полипептидов, количество сохранившегося белка и количество функционально активного белка?", "s4a_S": "Синтезировано за период", "s4a_S_100": "100", "s4a_S_50": "50", "s4a_pt": "Преждевременная терминация", "s4a_pt_0": "0 %", "s4a_pt_20": "20 %", "s4a_pt_50": "50 %", "s4a_ef": "Правильно сворачивается полноразмерных", "s4a_ef_90": "90 %", "s4a_ef_60": "60 %", "s4a_ef_30": "30 %", "s4a_q": "Контроль качества удаляет аномальных", "s4a_q_80": "80 %", "s4a_q_50": "50 %", "s4a_q_10": "10 %", "s4a_r": "Удаляется правильно свёрнутого", "s4a_r_20": "20 %", "s4a_r_40": "40 %", "s4a_r_60": "60 %", "s4a_note": "Цитозоль клетки человека, один белок. Все доли — учебные допущения за условный период. Аномальные формы — укороченные и неправильно свёрнутые полипептиды; в модели они неактивны (в вопросе 4 показано, что укороченный продукт может сохранять часть функций). Числа молекул округляются до целых; удалённое считается так, чтобы сумма всех форм равнялась числу синтезированных.", "a4_pA": "А. Путь {s} условных молекул: от синтеза к сохранившемуся белку", "a4_r1": "синтез", "a4_r2": "длина", "a4_r3": "сворач.", "a4_r4": "итог", "a4_lbl_hidden": "путь молекул не исследован", "a4_lg_S": "синтезированные", "a4_lg_F": "полноразмерные", "a4_lg_T": "укороченные", "a4_lg_N": "правильно свёрнутые", "a4_lg_M": "неправильно свёрнутые", "a4_lg_D": "удалённые", "a4_bl_S": "синтезировано", "a4_bl_F": "полноразмерных", "a4_bl_R": "сохранилось\nбелка", "a4_bl_A": "функционально\nактивно", "a4_bl_M": "неправильно\nсвёрнуто", "a4_pB": "Б. Четыре разных показателя", "a4_b_S": "Синтезировано", "a4_b_F": "Полноразмерных", "a4_b_R": "Сохранилось белка", "a4_b_A": "Функционально активно", "a4_b_M": "Неправильно свёрнуто", "a4_pP": "Две клетки с одинаковой активностью белка", "a4_lbl_cellA": "Клетка 1", "a4_lbl_cellB": "Клетка 2", "a4_lbl_pair_m": "синтез, сворачивание и удаление в клетках не исследованы", "s4a_v_n": "{n}", "s4a_r_F_s": "укороченных — {n}", "s4a_r_fold": "Правильно свёрнуто", "s4a_r_fold_s": "неправильно свёрнуто — {n}", "s4a_r_D": "Удалено", "s4a_r_D_s": "аномальных — {a}, правильно свёрнутых — {b}", "s4a_r_R_s": "все формы, оставшиеся в клетке", "s4a_r_A_s": "правильно свёрнутые и не удалённые", "s4a_r_bal": "Баланс", "s4a_v_bal": "{s} = {d} + {r}", "s4a_v_pair_m": "активно {a}, белка {r}", "s4a_v_pair": "синтезировано {s}, белка {r}, активно {a}, неправильно свёрнуто {m}", "s4a_cap_mask": "Обратная задача: в двух клетках одинаково низкая активность белка (18 условных единиц), но количество белка разное: 19 и 81. Синтез, сворачивание и удаление не исследованы.", "s4a_cap_mask_z": "Какие механизмы могут объяснить такое сочетание?", "s4a_cap_inv": "Одно из совместимых объяснений. Клетка 1 синтезирует вдвое меньше, белок сворачивается хорошо, аномальные формы удаляются, правильно свёрнутый обновляется быстро. Клетка 2 синтезирует много, но 70 % цепей сворачиваются неправильно и почти не удаляются: белка много, активного мало.", "s4a_cap_inv_z": "Низкая активность не означает малого синтеза: тот же результат дают неправильное сворачивание при слабом контроле качества.", "s4a_cap_high": "Большая часть синтезированных полипептидов становится активным белком: потери на преждевременной терминации, сворачивании и обновлении невелики.", "s4a_cap_high_z": "Даже при хороших условиях активного белка меньше, чем синтезированного: белок постоянно обновляется.", "s4a_cap_ptc": "Главная потеря — преждевременная терминация: полноразмерных цепей меньше, и активного белка меньше пропорционально.", "s4a_cap_ptc_z": "Число синтезированных полипептидов не равно числу полноразмерных: часть синтезов обрывается.", "s4a_cap_misacc": "Главная потеря — неправильное сворачивание, а контроль качества слабый: неправильно свёрнутые цепи остаются в клетке. Белка много, активного — мало.", "s4a_cap_misacc_z": "Количество белка и его активность — разные показатели: неактивная форма может составлять большую часть белка.", "s4a_cap_misdeg": "Главная потеря — неправильное сворачивание; контроль качества удаляет большую часть неправильно свёрнутых цепей. Активного белка мало, и белка в целом тоже меньше.", "s4a_cap_misdeg_z": "Эффективное удаление снижает количество аномальных форм, но не прибавляет активного белка.", "s4a_cap_turnover": "Главная потеря — обновление правильно свёрнутого белка: он удаляется быстрее, чем накапливается.", "s4a_cap_turnover_z": "Количество активного белка зависит не только от синтеза и сворачивания, но и от скорости удаления (семинар 11).", "s4a_cap_ptc2": "Главная потеря — преждевременная терминация.", "s4a_cap_ptc2_z": "—", "s4a_cap_synth": "Главное ограничение — синтезировано мало полипептидов; другие потери складываются с ним.", "s4a_cap_synth_z": "Малый синтез — лишь одна из причин малой активности; сравните с неправильным сворачиванием при том же итоге.", "s4a_take": "Число синтезированных полипептидов, число полноразмерных, количество сохранившегося белка и количество функционально активного белка — разные показатели. Их разделяют преждевременная терминация, неправильное сворачивание, удаление аномальных форм системой контроля качества и обновление правильно свёрнутого белка. Сумма всех форм равна числу синтезированных полипептидов. Одинаково низкую активность могут дать и малый синтез, и неправильное сворачивание при слабом контроле качества, поэтому вывод «мало активности — значит мало синтеза» неверен без измерения количества белка и его форм.", "s4a_lim": "Модель учитывает один белок за один условный период и не описывает динамику во времени. Доли условные; укороченные и неправильно свёрнутые формы в ней неактивны, хотя укороченный продукт может сохранять часть функций, а неправильно свёрнутые формы — образовывать агрегаты и нарушать работу клетки. Модель не показывает распада мРНК с преждевременным стоп-кодоном, сборки белка в комплексы, посттрансляционных модификаций и регуляции активности, а также того, как именно система контроля качества узнаёт разные формы (курс «Молекулярная биология»).", "s4a_new": "Полноразмерная и правильно свёрнутая цепь ещё не обязательно работает: многие белки действуют только в комплексе с партнёрами. Две субъединицы каталитического ядра фермента, метилирующего РНК, начинают соединяться, пока обе ещё синтезируются на рибосомах. В клетках человека при снижении количества одной субъединицы количество белка другой резко падало, хотя её мРНК не менялась, а подавление протеасомы и лизосом белок не возвращало. В сборке участвует субъединица цитозольного шаперонина.", "s4a_how": "в клетках человека снижали количество одной субъединицы и измеряли белок и мРНК другой (контроль — клетки с нормальным количеством субъединицы), а также выделяли рибосомы, ещё синтезирующие одну субъединицу, и проверяли, связана ли с ними мРНК другой. Это показывает, что сборка начинается во время трансляции, но какая доля комплексов собирается таким путём, в работе не определено: с белком-партнёром в цитоплазме было совмещено лишь около 5 % молекул мРНК.", "p4a_1_q": "Условия: 100 полипептидов за период, преждевременная терминация 0 %, сворачивание 90 %, контроль качества 80 %, обновление 20 %. Преждевременно завершается половина синтезов. Что изменится?", "p4a_1_o1": "Синтезировано 100, активного примерно вдвое меньше", "p4a_1_o2": "Синтезировано станет вдвое меньше — 50", "p4a_1_o3": "Активность не изменится: укороченные удалятся", "p4a_1_e": "Синтезы начинаются так же часто, но половина обрывается. Полноразмерных цепей 50, правильно свёрнутых 45, после обновления активно 36 вместо 72.", "p4a_1_w2": "Преждевременная терминация не уменьшает числа начатых синтезов; меняется длина продуктов.", "p4a_1_w3": "Удаление укороченных форм не превращает их в активный белок.", "p4a_2_q": "100 полипептидов за период, преждевременная терминация 0 %, контроль качества 80 %, обновление 20 % — но правильно сворачивается только 30 % полноразмерных цепей (вместо 90 %). Что изменится?", "p4a_2_o1": "Активного белка станет втрое меньше", "p4a_2_o2": "Станет меньше полноразмерных цепей", "p4a_2_o3": "Ничего: неправильно свёрнутые цепи тоже активны", "p4a_2_e": "Сворачивание не меняет длины цепи: полноразмерных по-прежнему 100, но правильно свёрнутых 30, активного 24 вместо 72. Неправильно свёрнутые в основном удаляет контроль качества.", "p4a_2_w2": "Полноразмерность определяет терминация, а не сворачивание.", "p4a_2_w3": "В модели неправильно свёрнутые формы неактивны.", "p4a_3_q": "100 полипептидов за период, сворачивание 30 %, обновление 20 %, а контроль качества удаляет только 10 % аномальных форм (вместо 80 %). Что станет с количеством белка и активностью?", "p4a_3_o1": "Белка станет больше, активного — столько же", "p4a_3_o2": "Активного белка станет больше, чем раньше", "p4a_3_o3": "Белка станет меньше, активного — столько же", "p4a_3_e": "Неправильно свёрнутые цепи перестают удаляться и накапливаются: белка 87 вместо 38, а активного — те же 24. Количество белка выросло, активность — нет.", "p4a_3_w2": "Контроль качества не сворачивает цепи заново в модели; он лишь удаляет аномальные формы.", "p4a_3_w3": "Меньше удалять — значит больше оставлять в клетке.", "p4a_4_q": "Обратная задача: в двух клетках одинаково низкая активность белка (18), но белка в клетке 1 — 19, а в клетке 2 — 81. Какое объяснение совместимо с наблюдениями?", "p4a_4_o1": "Разные причины: мало синтеза или неправильное сворачивание", "p4a_4_o2": "В обеих клетках одинаково снижен синтез белка", "p4a_4_o3": "В клетке 2 белок активнее, но его там меньше", "p4a_4_e": "Одинаковая активность при разном количестве белка означает, что в клетке 2 большая часть белка неактивна. Это совместимо, например, с неправильным сворачиванием при слабом контроле качества; в клетке 1 активности мало, потому что мало белка. Различить причины помогут измерения синтеза, доли неправильно свёрнутых форм и скорости удаления.", "p4a_4_w2": "При одинаково сниженном синтезе и одинаковых остальных условиях количество белка было бы одинаковым.", "p4a_4_w3": "Активность одинакова, а белка в клетке 2 больше — значит, на одну молекулу активности в ней меньше.", "p4a_4_h1": "Сравните долю активного белка в общем количестве белка в каждой клетке.", "p4a_4_h2": "Какие формы белка в модели есть, но неактивны?", "p4a_5_q": "Верно ли: «у клетки мало активности этого белка — значит, белок мало синтезируется»?", "p4a_5_o1": "Нет: малую активность дают и другие этапы", "p4a_5_o2": "Да: активность всегда пропорциональна синтезу", "p4a_5_o3": "Да, если белок вообще удаётся обнаружить", "p4a_5_e": "Малую активность дают и преждевременная терминация, и неправильное сворачивание, и быстрое удаление. Синтез — лишь первый из нескольких последовательных этапов. Чтобы найти причину, нужно измерить количество полипептида, его длину и долю правильно свёрнутых форм.", "p4a_5_w2": "Пропорциональность нарушают все этапы после синтеза.", "p4a_5_w3": "Обнаруженный белок может быть неактивным: например, неправильно свёрнутым.", "gn_translation": "Трансляция", "g_translation": "Синтез полипептида на рибосоме по матрице мРНК в соответствии с генетическим кодом. У эукариот белок-кодирующие мРНК транслируются в цитоплазме (а также на рибосомах, связанных с мембраной эндоплазматического ретикулума); мРНК считывается от 5′- к 3′-концу, полипептид растёт от N- к C-концу.", "gn_code": "Генетический код", "g_code": "Соответствие между кодонами мРНК и аминокислотами (или сигналом терминации). Код триплетный, однозначный, вырожденный и почти универсальный: в митохондриях и у некоторых организмов значение отдельных кодонов иное.", "gn_codon": "Кодон", "g_codon": "Последовательность из трёх нуклеотидов мРНК, соответствующая одной аминокислоте или сигналу терминации. Из 64 кодонов 61 смысловой и 3 стоп-кодона.", "gn_startc": "Старт-кодон", "g_startc": "Кодон AUG, с которого начинается трансляция; он кодирует метионин и задаёт рамку считывания. Его узнаёт антикодон инициаторной тРНК.", "gn_stopc": "Стоп-кодон", "g_stopc": "Кодон UAA, UAG или UGA, не соответствующий ни одной аминокислоте: ему не комплементарна ни одна тРНК; его в A-сайте узнаёт белковый фактор терминации, и синтез полипептида заканчивается.", "gn_frame": "Рамка считывания", "g_frame": "Разбиение нуклеотидной последовательности на последовательные неперекрывающиеся кодоны. Для трансляции рамку задаёт старт-кодон; она продолжается до стоп-кодона.", "gn_degeneracy": "Вырожденность генетического кода", "g_degeneracy": "Свойство кода: большинство аминокислот кодируется несколькими кодонами (от двух до шести); только метионин и триптофан — одним. Кодоны-синонимы чаще всего различаются третьим нуклеотидом.", "gn_synonymous": "Синонимичная замена", "g_synonymous": "Замена нуклеотида, при которой новый кодон кодирует ту же аминокислоту. Последовательность белка не меняется, но замена может влиять на сплайсинг, стабильность мРНК и эффективность трансляции.", "gn_missense": "Миссенс-замена", "g_missense": "Замена нуклеотида, при которой кодон начинает кодировать другую аминокислоту.", "gn_nonsense": "Нонсенс-замена", "g_nonsense": "Замена нуклеотида, превращающая смысловой кодон в стоп-кодон; синтез полипептида обрывается раньше обычного (преждевременный стоп-кодон).", "gn_frameshift": "Сдвиг рамки считывания", "g_frameshift": "Изменение рамки после вставки или делеции числа нуклеотидов, не кратного трём, в кодирующей области: все кодоны ниже места изменения читаются иначе, и вскоре обычно встречается стоп-кодон.", "gn_deletion": "Делеция", "g_deletion": "Утрата одного или нескольких нуклеотидов последовательности. Делеция числа нуклеотидов, кратного трём, в кодирующей области рамку не сдвигает.", "gn_mrna": "мРНК (матрица трансляции)", "g_mrna": "Зрелая матричная РНК: кэп, 5′-нетранслируемая область, кодирующая область от старт-кодона до стоп-кодона, 3′-нетранслируемая область и поли(А)-хвост. Последовательность кодирующей области определяет последовательность аминокислот белка.", "gn_polypeptide": "Полипептид", "g_polypeptide": "Цепь аминокислот, соединённых пептидными связями; на рибосоме растёт от N-конца (свободная аминогруппа) к C-концу (карбоксильная группа).", "gn_peptidebond": "Пептидная связь", "g_peptidebond": "Амидная связь между карбоксильной группой одной аминокислоты и аминогруппой следующей. На рибосоме образуется переносом растущей цепи с тРНК в P-сайте на аминокислоту тРНК в A-сайте.", "gn_trna": "Транспортная РНК (тРНК)", "g_trna": "Короткая РНК длиной около 80 нуклеотидов (чаще всего 76) — адаптер между кодоном и аминокислотой. Вторичная структура — «клеверный лист», пространственная — L-образная; на одном конце — антикодон, на другом — 3′-конец CCA, к которому присоединяется аминокислота.", "gn_anticodon": "Антикодон", "g_anticodon": "Три нуклеотида тРНК, спаривающиеся с кодоном мРНК антипараллельно: первый нуклеотид кодона (5′) спаривается с третьим нуклеотидом антикодона. В третьей позиции кодона допускаются неканонические пары (качание).", "gn_wobble": "Качание (неоднозначное спаривание)", "g_wobble": "Допущение неканонических пар (например, G·U) между третьим нуклеотидом кодона и первым нуклеотидом антикодона. Позволяет одной тРНК узнавать несколько кодонов-синонимов.", "gn_aa": "Аминокислота на тРНК", "g_aa": "Аминокислота, присоединённая сложноэфирной связью к 3′-концевому аденозину тРНК. Рибосома не проверяет, какую аминокислоту несёт тРНК: проверяется только спаривание антикодона с кодоном.", "gn_ile": "Изолейцин", "g_ile": "Аминокислота с неполярной боковой цепью. Отличается от валина одной метильной группой, поэтому изолейцил-тРНК-синтетаза иногда ошибочно активирует валин; корректирующая активность фермента удаляет такую ошибку.", "gn_atp": "АТФ в аминоацилировании", "g_atp": "Источник энергии для присоединения аминокислоты к тРНК: аминокислота сначала соединяется с АМФ (образуется аминоациладенилат, освобождается пирофосфат), затем переносится на тРНК.", "gn_ars": "Аминоацил-тРНК-синтетаза", "g_ars": "Фермент, который присоединяет определённую аминокислоту ко всем тРНК, соответствующим кодонам этой аминокислоты, узнавая и аминокислоту, и тРНК. В цитозоле клеток человека для каждой из 20 аминокислот — своя синтетаза. Многие синтетазы обладают корректирующей активностью.", "gn_aminoacylation": "Аминоацилирование тРНК", "g_aminoacylation": "Присоединение аминокислоты к 3′-концу тРНК аминоацил-тРНК-синтетазой; идёт в два этапа: активация аминокислоты АТФ (аминоациладенилат) и перенос аминокислоты на тРНК.", "gn_aatrna": "Аминоацил-тРНК", "g_aatrna": "тРНК, к 3′-концу которой присоединена аминокислота. Энергия её сложноэфирной связи используется при образовании пептидной связи.", "gn_editing": "Корректирующая активность синтетазы", "g_editing": "Способность аминоацил-тРНК-синтетазы гидролизовать ошибочно активированную аминокислоту или ошибочно присоединённую к тРНК аминокислоту; резко снижает частоту ошибок аминоацилирования.", "gn_ribosome": "Рибосома", "g_ribosome": "Комплекс рРНК и белков, синтезирующий полипептид по мРНК. Рибосома эукариот (80S) состоит из малой (40S) и большой (60S) субчастиц; в ней три участка связывания тРНК — A, P и E.", "gn_small": "Малая субчастица рибосомы (40S)", "g_small": "Субчастица, связывающая мРНК; в ней находится декодирующий центр, где проверяется спаривание антикодона с кодоном.", "gn_large": "Большая субчастица рибосомы (60S)", "g_large": "Субчастица, в которой находится пептидилтрансферазный центр, образованный рРНК, и туннель, через который выходит растущая цепь.", "gn_siteA": "A-сайт (аминоацильный)", "g_siteA": "В отечественных учебниках — А-сайт, аминоацильный центр. Участок рибосомы, в который входит аминоацил-тРНК, спаренная с кодоном; с ним связывается и фактор терминации, когда в нём стоп-кодон.", "gn_siteP": "P-сайт (пептидильный)", "g_siteP": "В отечественных учебниках — П-сайт, пептидильный центр. Участок рибосомы, где находится тРНК, связанная с растущей цепью (пептидил-тРНК); в начале синтеза — инициаторная тРНК.", "gn_siteE": "E-сайт (выходной)", "g_siteE": "В отечественных учебниках — Е-сайт. Участок рибосомы, куда после транслокации переходит тРНК без аминокислоты перед тем, как покинуть рибосому.", "gn_ptc": "Пептидилтрансферазный центр", "g_ptc": "Каталитический центр большой субчастицы рибосомы, где образуется пептидная связь; образован рРНК (рибосома — рибозим).", "gn_trnai": "Инициаторная тРНК", "g_trnai": "Особая тРНК, несущая метионин, с которой начинается трансляция; её узнают факторы инициации, и в начале синтеза она находится в P-сайте напротив старт-кодона. В A-сайт не поступает.", "gn_initiation": "Инициация трансляции", "g_initiation": "Начальный этап: малая субчастица с инициаторной тРНК и факторами инициации связывается у кэпа, движется по 5′-нетранслируемой области (сканирование) до старт-кодона; затем присоединяется большая субчастица и образуется рибосома 80S.", "gn_kozak": "Окружение старт-кодона", "g_kozak": "Нуклеотиды вокруг AUG, от которых зависит, узнает ли его сканирующая малая субчастица; у позвоночных наиболее важны пурин в положении −3 и G в положении +4.", "gn_eif": "Факторы инициации трансляции", "g_eif": "Белки, обеспечивающие сборку рибосомы на старт-кодоне: связывание с кэпом (комплекс eIF4F), доставку инициаторной тРНК (eIF2 с ГТФ), сканирование и присоединение большой субчастицы.", "gn_elongation": "Элонгация трансляции", "g_elongation": "Повторяющийся цикл удлинения полипептида на одну аминокислоту: вход аминоацил-тРНК в A-сайт, образование пептидной связи, транслокация.", "gn_eef1a": "Фактор элонгации eEF1A", "g_eef1a": "Белок, который в комплексе с ГТФ доставляет аминоацил-тРНК в A-сайт; гидролиз ГТФ после правильного спаривания позволяет тРНК занять положение для образования пептидной связи.", "gn_eef2": "Фактор элонгации eEF2", "g_eef2": "Белок, который за счёт гидролиза ГТФ обеспечивает транслокацию — сдвиг рибосомы на один кодон.", "gn_translocation": "Транслокация", "g_translocation": "Перемещение рибосомы по мРНК на один кодон (три нуклеотида) к 3′-концу; тРНК переходят из A- в P-сайт и из P- в E-сайт, и A-сайт освобождается для следующего кодона.", "gn_termination": "Терминация трансляции", "g_termination": "Завершение синтеза: стоп-кодон в A-сайте узнаёт фактор терминации, связь полипептида с тРНК гидролизуется, полипептид освобождается, субчастицы рибосомы расходятся.", "gn_erf1": "Фактор терминации eRF1", "g_erf1": "Белок, похожий по форме на тРНК, который узнаёт все три стоп-кодона в A-сайте и вызывает гидролиз связи полипептида с тРНК; действует вместе с eRF3.", "gn_polysome": "Полисома (полирибосома)", "g_polysome": "мРНК, которую одновременно транслируют несколько рибосом, движущихся одна за другой.", "gn_slowc": "Медленно проходимый кодон", "g_slowc": "В учебной модели — кодон, на котором рибосома задерживается, потому что нужной аминоацил-тРНК мало; перед ним могут скапливаться рибосомы.", "gn_fulllength": "Полноразмерный полипептид", "g_fulllength": "Полипептид, синтез которого закончился на обычном стоп-кодоне.", "gn_truncated": "Укороченный продукт", "g_truncated": "Полипептид, синтез которого закончился раньше обычного — например, на преждевременном стоп-кодоне; может разрушаться или сохраняться и сохранять часть функций.", "gn_folding": "Сворачивание белка", "g_folding": "Образование пространственной структуры полипептида; определяется последовательностью аминокислот, начинается ещё во время трансляции и у многих белков идёт при участии шаперонов.", "gn_domain": "Домен белка", "g_domain": "Участок полипептида, сворачивающийся в устойчивую структуру относительно независимо от остальной цепи; часто выполняет отдельную функцию.", "gn_unfolded": "Несвёрнутая цепь", "g_unfolded": "Полипептид или его участок без устойчивой пространственной структуры; гидрофобные аминокислоты такой цепи остаются на поверхности.", "gn_hydrophobic": "Гидрофобный участок на поверхности", "g_hydrophobic": "Участок из неполярных аминокислот, который в свёрнутом белке обычно спрятан внутри. Открытые гидрофобные участки — признак несвёрнутой или неправильно свёрнутой цепи; их связывают шапероны.", "gn_native": "Правильно свёрнутый белок", "g_native": "Белок в той пространственной структуре, в которой он выполняет свою функцию.", "gn_misfolded": "Неправильно свёрнутый белок", "g_misfolded": "Полипептид, принявший неверную пространственную структуру; обычно неактивен, может образовывать агрегаты и удаляется системами контроля качества.", "gn_hsp70": "Шаперон Hsp70", "g_hsp70": "Белок теплового шока массой около 70 кДа; связывает короткие гидрофобные участки несвёрнутых цепей — в том числе выходящих из рибосомы — и с затратой АТФ помогает им свернуться, предотвращая слипание.", "gn_chaperone": "Молекулярные шапероны", "g_chaperone": "Белки, которые помогают другим белкам правильно свернуться и предотвращают их агрегацию, но не входят в состав готового белка и не задают его структуру. Шаперонины (в цитозоле — TRiC/CCT, в митохондриях — Hsp60) образуют полость, в которой сворачиваются отдельные белки.", "gn_ptm": "Посттрансляционные модификации", "g_ptm": "Изменения белка после синтеза (или во время него): отщепление N-концевого метионина, присоединение фосфатных групп, олигосахаридов, липидов, протеолитическое расщепление и другие.", "gn_qc": "Контроль качества белков", "g_qc": "Совокупность процессов, которые узнают неправильно свёрнутые или неполные белки и либо помогают им свернуться (шапероны), либо направляют их на разрушение.", "gn_ubiquitin": "Убиквитин и полиубиквитиновая цепь", "g_ubiquitin": "Небольшой белок, который ферменты E1, E2 и E3 ковалентно присоединяют к белку-мишени. Цепь из нескольких молекул убиквитина — сигнал для разрушения белка протеасомой.", "gn_e3": "Убиквитинлигаза (E3)", "g_e3": "Фермент, который узнаёт белок-мишень и вместе с E2 переносит на него убиквитин; от E3 зависит, какой белок будет помечен.", "gn_proteasome": "Протеасома", "g_proteasome": "Крупный белковый комплекс (26S), который разворачивает белки, помеченные полиубиквитиновой цепью, и расщепляет их на короткие пептиды внутри полого цилиндра.", "gn_aggregate": "Агрегат белков", "g_aggregate": "Скопление слипшихся несвёрнутых или неправильно свёрнутых белков; может нарушать работу клетки.", "gn_degraded": "Удалённые формы", "g_degraded": "В учебной модели — белковые молекулы, разрушенные за период: аномальные формы, удалённые системой контроля качества, и правильно свёрнутые, удалённые при обычном обновлении.", "gn_proteostasis": "Протеостаз", "g_proteostasis": "Поддержание набора и количества правильно свёрнутых белков клетки за счёт согласованной работы синтеза, сворачивания, транспорта и разрушения белков. Подробно — в курсе «Молекулярная биология», семинар 11.", "gn_mutation": "Мутация", "g_mutation": "Наследуемое изменение последовательности ДНК. Отличается от ошибки трансляции: ошибка трансляции затрагивает отдельные молекулы белка и не меняет ни ДНК, ни мРНК.", "gn_rnaediting": "Редактирование РНК", "g_rnaediting": "Изменение последовательности РНК после транскрипции (например, замена A на I или C на U); может менять значение кодона без изменения ДНК.", "gn_mistranslation": "Ошибка трансляции", "g_mistranslation": "Включение в полипептид аминокислоты, не соответствующей кодону: из-за ошибки аминоацилирования тРНК или ошибки декодирования на рибосоме.", "src_01": "Alberts B., Heald R., Johnson A., Morgan D., Raff M., Roberts K., Walter P. Molecular Biology of the Cell. 7th ed. New York: W. W. Norton & Company, 2022. Chapter 6 «How Cells Read the Genome: From DNA to Protein»", "src_02": "Diez M., Medina-Muñoz S. G., Castellano L. A., da Silva Pescador G., Wu Q., Bazzini A. A. iCodon customizes gene expression based on the codon composition. Sci Rep. 2022;12:12126. doi:10.1038/s41598-022-15526-7", "src_03": "Zheng W.-Q., Zhang J.-H., Li Z.-H., Liu X., Zhang Y., Huang S., Li J., Zhou B., Eriani G., Wang E.-D., Zhou X.-L. Mammalian mitochondrial translation infidelity leads to oxidative stress–induced cell cycle arrest and cardiomyopathy. Proc Natl Acad Sci USA. 2023;120:e2309714120. doi:10.1073/pnas.2309714120", "src_04": "Brito Querido J., Díaz-López I., Ramakrishnan V. The molecular basis of translation initiation and its regulation in eukaryotes. Nat Rev Mol Cell Biol. 2024;25:168–186. doi:10.1038/s41580-023-00624-9", "src_05": "Wu X., Zhang H., Huang L., Zhang S., He J., Wang S., Zhu W., Li Y., Zhou J., Liu X.-M. Cotranslational assembly directs the biogenesis of the m6A methyltransferase complex. Proc Natl Acad Sci USA. 2026;123:e2517258123. doi:10.1073/pnas.2517258123", "src_06": "Janzen D. M., Geballe A. P. The effect of eukaryotic release factor depletion on translation termination in human cell lines. Nucleic Acids Res. 2004;32:4491–4502. doi:10.1093/nar/gkh791", "tl_slider": "Ход процесса: положение на шкале этапов", "tl_chips": "Этапы процесса", "tl_step": "Этап {i} из {n}", "tl_play": "▶ Запустить", "tl_pause": "❚❚ Пауза", "tl_again": "↺ Ещё раз", "tl_back": "◀ Шаг", "tl_fwd": "Шаг ▶", "tl_reset": "Сначала", "tl_note": "Порядок этапов — учебная модель. Длительность этапов условная, не измерена.", "predict_note": "Условие изменено. Предскажите, что произойдёт, и нажмите «▶ Запустить» или выберите этап на шкале — подпись появится после запуска.", "predict_reads": "Показания появятся после запуска.", "k_on": "на месте", "k_empty": "пусто", "k_fixed": "на месте", "k_first": "Вынуто несколько деталей: показан исход первой недостающей детали по ходу этапов.", "s1t_note": "Порядок этапов — учебная модель: считывание кодона и присоединение аминокислоты повторяются в каждом цикле элонгации, на шкале они показаны для первой и второй половины рамки. Длительность этапов условная.", "s1_tl_1": "Малая субчастица рибосомы находит старт-кодон AUG; он задаёт рамку считывания.", "s1_tl_2": "Рибосома считывает мРНК от 5′- к 3′-концу по одному кодону, без пропусков и перекрываний.", "s1_tl_3": "Каждому смысловому кодону соответствует одна аминокислота; она присоединяется к C-концу растущей цепи.", "s1_tl_4": "Стоп-кодон в A-сайте узнаёт фактор терминации, и полипептид освобождается.", "s2k_title": "Детали аминоацилирования: нажмите на гнездо, чтобы вынуть деталь", "s2k_hint": "тРНК изолейцина и тРНК валина в этой модели всегда на месте: что происходит без них, модель не рассматривает. Вынутая деталь возвращается нажатием в лотке.", "s2k_syn": "Изолейцил-тРНК-синтетаза", "s2k_atp": "АТФ", "s2k_ile": "тРНК изолейцина", "s2k_val": "тРНК валина", "s2t_note": "Порядок этапов — учебная модель; длительность условная. Синтетаза валина и доставка аминоацил-тРНК к рибосоме на схеме не показаны.", "s2_tl_1": "Синтетаза связывает аминокислоту и АТФ и образует аминоациладенилат.", "s2_tl_1v": "Без синтетазы изолейцина тРНК изолейцина не заряжается; тРНК валина заряжает своя синтетаза.", "s2_tl_2": "Аминокислота переносится на 3′-конец тРНК (CCA); получается аминоацил-тРНК.", "s2_tl_2v": "тРНК изолейцина остаётся незаряженной; тРНК валина заряжает своя синтетаза (на схеме не показана).", "s2_tl_3": "Аминоацил-тРНК входит в A-сайт; антикодон спаривается с кодоном антипараллельно, в третьей позиции допускается пара G·U.", "s2_tl_3v": "Против G первой позиции кодона GUC у тРНК изолейцина стоит U: в первой позиции пара G·U не допускается, тРНК изолейцина не удерживается, и кодон декодирует тРНК валина.", "s2_tl_4": "Аминокислота включается в полипептид; рибосома проверяет пару кодон — антикодон, но не аминокислоту.", "s2_tl_stop_syn": "Остановка на этапе 1: без изолейцил-тРНК-синтетазы изолейцин не присоединяется к тРНК — тРНК изолейцина остаётся незаряженной.", "s2_tl_stop_atp": "Остановка на этапе 1: без АТФ аминокислота не активируется — ни одна тРНК не заряжается.", "s3k_title": "Факторы трансляции: нажмите на гнездо, чтобы вынуть фактор", "s3k_hint": "eEF1A в этой модели всегда на месте: что происходит без него, модель не рассматривает. Вынутый фактор возвращается нажатием в лотке.", "s3k_eef1a": "eEF1A — доставка аминоацил-тРНК", "s3k_eef2": "eEF2 — транслокация", "s3k_erf1": "eRF1 — терминация", "s3t_note": "Порядок этапов — учебная модель. Нажмите на номер этапа: схема, подпись и показания покажут этот момент. Между этапами 4 и 5 два одинаковых цикла элонгации (кодоны UGG и GAA) показаны коротко; момент выхода тРНК из E-сайта упрощён; длительность условная.", "s3_tl_1": "Инициация", "s3_tl_2": "Вход аминоацил-тРНК в A-сайт", "s3_tl_3": "Пептидная связь", "s3_tl_4": "Транслокация", "s3_tl_5": "Ещё два цикла; стоп-кодон в A-сайте", "s3_tl_6": "Терминация", "s3_tl_stop_eef2": "Остановка на этапе 4: в модели без eEF2 за время наблюдения транслокации нет — цепь Met–His остаётся на тРНК в A-сайте (в пробирке без факторов элонгации синтез идёт, но очень медленно и неточно).", "s3_tl_stop_erf1": "Остановка на этапе 6: в модели без eRF1 за время наблюдения стоп-кодон UGA не узнаётся — полипептид остаётся на тРНК в P-сайте (в клетке возможно и прочитывание стоп-кодона).", "s4k_title": "Белки контроля качества: нажмите на гнездо, чтобы вынуть белок", "s4k_hint": "Шаперон Hsp70 в этой модели всегда на месте: что происходит с цепями без шаперонов, модель не рассматривает. Вынутый белок возвращается нажатием в лотке.", "s4k_hsp70": "Шаперон Hsp70", "s4k_e3": "Убиквитинлигаза (E3)", "s4k_prot": "Протеасома", "s4t_note": "Порядок этапов — учебная модель; длительность условная. Номера кодонов и длины условные.", "s4_tl_1": "Растущая цепь выходит из рибосомы через туннель большой субчастицы.", "s4_tl_2": "Домен 1 начинает сворачиваться, выходя из туннеля большой субчастицы, — ещё во время синтеза домена 2.", "s4_tl_2b": "Синтезирована цепь домена 1 и соединительного участка; домен 2 не синтезируется.", "s4_tl_2n": "Синтезирована только часть домена 1: такой фрагмент свернуться не может.", "s4_tl_3": "Стоп-кодон в A-сайте — фактор терминации освобождает полипептид; вышедшие из туннеля домены сворачиваются.", "s4_tl_4": "Несвёрнутую цепь с открытыми гидрофобными участками связывают шапероны Hsp70.", "s4_tl_5": "Если свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и протеасома её разрушает.", "s4_tl_5n": "Без убиквитинлигазы или протеасомы цепь не разрушается: несвёрнутые цепи накапливаются и могут образовывать агрегаты.", "s4_tl_5p": "Убиквитинлигаза присоединяет цепь убиквитина, но протеасома подавлена: помеченные цепи не разрушаются и накапливаются.", "s4_tl_5e": "Без убиквитинлигазы цепь не получает метку убиквитина и не разрушается: несвёрнутые цепи накапливаются.", "s2_lbl_same_codon": "тот же кодон", "p4b_5_note": "Для сопоставления показан второй исход: стоп-кодон в кодоне 120 (внутри домена 1).", "p4a_5_note": "Для сопоставления показаны две клетки из обратной задачи (шаг 4): активности поровну, причины разные.", "s1at_note": "Рибосомы на двух строках — исходная и изменённая мРНК; этапы — как в базовой сцене. Порядок этапов — учебная модель, длительность условная.", "s2at_note": "Порядок этапов — учебная модель: в клетке все три процесса идут одновременно. Длительность условная.", "s2a_tl_1": "Аминоацилирование: синтетаза заряжает тРНК изолейцина; без корректирующей активности часть этих тРНК несёт валин.", "s2a_tl_2": "Декодирование: рибосома отбирает аминоацил-тРНК по спариванию антикодона с кодоном и не проверяет аминокислоту.", "s2a_tl_3": "Синтезированы 10 молекул продукта: замены видны по позициям.", "a2_lbl_pool": "тРНК изолейцина после аминоацилирования (условно 10 молекул; доля с валином — допущение модели)", "s3at_note": "Шкала — время наблюдения, по 100 ед. на этап. Счётчики — нарастающим итогом; все числа — предсказания учебной модели.", "s3a_tl_1": "0–100 ед.: рибосомы присоединяются у старт-кодона и движутся к 3′-концу; завершённых полипептидов ещё нет.", "s3a_tl_2": "100–200 ед.: рибосомы заполняют мРНК; где рибосома задерживается, за ней выстраивается очередь.", "s3a_tl_3": "200–300 ед.: завершённые полипептиды накапливаются.", "s3a_tl_4": "300–400 ед.: число рибосом на мРНК почти постоянно — сколько присоединяется, столько завершает синтез.", "s3a_tl_5": "400–500 ед.: в каждый момент число инициаций = завершено + на мРНК.", "s3a_tl_6": "500–600 ед.: итог наблюдения (T = 600 ед.) — те же числа, что в показаниях.", "s4at_note": "Строки схемы появляются по этапам пути от синтеза к активному белку. Порядок — учебная модель; все доли — учебные допущения.", "s4a_tl_1": "Синтез: все полипептиды, синтезированные за период (строка 1).", "s4a_tl_2": "Терминация: часть синтеза закончилась на преждевременном стоп-кодоне (строка 2).", "s4a_tl_2z": "Терминация: все цепи закончились на обычном стоп-кодоне (строка 2).", "s4a_tl_3": "Сворачивание: полноразмерные цепи свернулись правильно или неправильно (строка 3).", "s4a_tl_4": "Контроль качества и обновление: часть аномальных форм удалена, часть правильно свёрнутого белка разрушена при обновлении (строка 4).", "s4a_tl_5": "Итог: синтезировано = удалено + сохранилось; активен только правильно свёрнутый белок.", "s3_ev_cycW": "Ещё один цикл элонгации: Trp-тРНК входит в A-сайт\n(кодон UGG), пептидная связь, транслокация.", "s3_ev_cycE": "Ещё один цикл элонгации: Glu-тРНК входит в A-сайт\n(кодон GAA), пептидная связь, транслокация.", "s4_pBg": "Б. Растущая цепь у рибосомы", "s4_lbl_e3": "E3", "case_btn": "Найти причину", "case_k": "Найти причину", "case_veil": "Состояние образца скрыто", "case_veil_s": "выберите измерения в панели", "case_meas": "Измерения: образец сравнивается с контролем", "case_why": "Объяснение", "case_meth": "Что измеряется", "case_ctrl": "контроль", "case_sample": "образец", "case_need": "Сначала выберите хотя бы одно измерение: без данных выбрать объяснение не на чем.", "case_conflict": "Это объяснение противоречит измерению «{m}»: при такой причине ожидалось «{want}», а получено «{got}».", "case_more": "Это объяснение согласуется с данными, но не единственное: подходят ещё {n} объяснения. Какое измерение их разделит?", "case_more1": "Это объяснение согласуется с данными, но не единственное: подходит ещё одно объяснение. Какое измерение их разделит?", "case_ok": "Из предложенных объяснений данные оставляют одно", "case_used": "Измерений выполнено: {n}. Наименьшее достаточное число: {k}.", "case_enough": "Чтобы из предложенных объяснений осталось одно, достаточно, например, измерений: {m}.", "case_flat": "Измерение «{m}» здесь причины не различает: при всех результат одинаков.", "case_new": "Начать заново", "case_note": "Значения — предсказания учебной модели, а не результаты конкретного эксперимента. Список причин здесь задан заранее, в реальной работе его нет.", "c1_title": "Белка мало, а мРНК столько же, сколько в норме", "c1_obs": "Условия: модель 3а, наблюдение 600 ед. В контроле инициация возможна раз в 16 ед., рибосома проводит на каждом кодоне 1 ед.; за наблюдение завершено 30 полипептидов. В образце мРНК столько же, а завершённых полипептидов меньше. Состояние мРНК и рибосом скрыто: выберите измерения.", "c1_c_init": "Инициация редкая (возможна раз в 32 ед.)", "c1_c_slow": "Мало аминоацил-тРНК для кодона 80 (рибосома стоит на нём 22 ед.)", "c1_c_step": "Элонгация медленная на всех кодонах (2 ед. на кодон)", "c1_m_on": "Рибосом на мРНК", "c1_m_up": "Рибосом до кодона 80", "c1_m_missed": "Пропущенных возможностей инициации", "c1_m_done": "Завершённых полипептидов", "c1_v_on_v7": "7", "c1_v_on_v3": "3", "c1_v_on_v9": "9", "c1_v_on_v12": "12", "c1_v_up_v5": "5", "c1_v_up_v2": "2", "c1_v_up_v8": "8", "c1_v_missed_v0": "0", "c1_v_missed_v12": "12", "c1_v_missed_v7": "7", "c1_v_done_v30": "30", "c1_v_done_v15": "15", "c1_v_done_v18": "18", "c1_k_on": "Что измеряется: сколько рибосом одновременно находится на одной мРНК в момент наблюдения (полисома). Значение — предсказание модели 3а.", "c1_k_up": "Что измеряется: сколько из этих рибосом стоит между старт-кодоном и кодоном 80. Значение — предсказание модели 3а. Чего не говорит: сколько рибосом всего.", "c1_k_missed": "Что измеряется: сколько раз инициация была возможна, но начало мРНК было занято предыдущей рибосомой. Это величина модели; в клетке её прямо не измеряют.", "c1_k_done": "Что измеряется: сколько полипептидов завершено за наблюдение. Значение — предсказание модели 3а; при двух причинах из трёх оно одинаково.", "c1_w_init": "При этой причине на мРНК 3 рибосомы против 7, пропусков инициации нет: рибосомы присоединяются редко и идут по мРНК свободно — поток ограничивает инициация.", "c1_w_slow": "При этой причине рибосом на мРНК больше, чем в контроле (9 против 7), 8 из них — до кодона 80, и 12 возможностей инициации пропущено: рибосомы стоят в очереди перед медленно проходимым кодоном.", "c1_w_step": "При этой причине на мРНК 12 рибосом, они распределены по всей длине (8 до кодона 80, 4 после), 7 возможностей инициации пропущено: медленно идут все рибосомы, и начало мРНК освобождается реже.", "c1_after": "Одно число завершённых полипептидов не указывает на причину: 15 — и при редкой инициации, и при задержке на кодоне 80. Различают их число рибосом на мРНК и их распределение. На схеме — модель с найденной причиной.", "c1_src": "Правила модели — по учебнику (полисомы) и обзору об инициации трансляции (см. «Источники» внизу страницы). Значения выведены из модели 3а; модель учебная.", "c1_link_h": "seminar-10-route.html#ribosome-flow", "c1_link_t": "Подробнее: шаг «Больше рибосом на мРНК — не всегда больше белка» в «Объяснениях»", "c2_title": "Функционально активного белка мало", "c2_obs": "Условия: модель 4а, один период. В контроле синтезировано 100 молекул, преждевременной терминации нет, правильно сворачивается 90 % полноразмерных цепей, контроль качества удаляет 80 % аномальных форм, за период обновляется 20 % правильно свёрнутого белка; активно 72 молекулы. В образце активного белка заметно меньше. Схема скрыта: выберите измерения.", "c2_c_S": "Синтезируется меньше полипептидов (50 вместо 100)", "c2_c_pt": "Половина синтеза заканчивается на преждевременном стоп-кодоне", "c2_c_ef": "Правильно сворачивается только 30 % полноразмерных цепей", "c2_c_r": "Белок быстро обновляется: за период разрушается 60 % правильно свёрнутого", "c2_m_S": "Синтезировано за период", "c2_m_F": "Полноразмерных полипептидов", "c2_m_R": "Сохранилось белка (все формы)", "c2_m_M": "Сохранилось неправильно свёрнутого белка", "c2_m_turn": "Разрушено правильно свёрнутого белка за период", "c2_v_S_v100": "100", "c2_v_S_v50": "50", "c2_v_F_v100": "100", "c2_v_F_v50": "50", "c2_v_R_v74": "74", "c2_v_R_v37": "37", "c2_v_R_v47": "47", "c2_v_R_v38": "38", "c2_v_M_v2": "2", "c2_v_M_v1": "1", "c2_v_M_v14": "14", "c2_v_turn_v18": "18", "c2_v_turn_v9": "9", "c2_v_turn_v6": "6", "c2_v_turn_v54": "54", "c2_k_S": "Что измеряется: сколько полипептидов синтезировано за период — и полноразмерных, и укороченных. Значение — предсказание модели 4а.", "c2_k_F": "Что измеряется: сколько из них полноразмерных (синтез закончился на обычном стоп-кодоне). Значение — предсказание модели 4а.", "c2_k_R": "Что измеряется: сколько молекул белка всех форм осталось к концу периода. Значение — предсказание модели 4а.", "c2_k_M": "Что измеряется: сколько неправильно свёрнутых молекул осталось к концу периода (их не удалил контроль качества). Значение — предсказание модели 4а.", "c2_k_turn": "Что измеряется: сколько молекул правильно свёрнутого белка разрушено за период при обновлении (например, по исчезновению меченого белка). Значение — предсказание модели 4а.", "c2_w_S": "При этой причине синтезировано 50 молекул против 100, а доли укороченных, неправильно свёрнутых и обновлённых — как в контроле: активного белка меньше вдвое, потому что меньше синтез.", "c2_w_pt": "При этой причине синтезировано столько же, сколько в контроле (100), но полноразмерных только 50, а белка сохранилось 47 против 74: половина цепей укорочена, и большую их часть удаляет контроль качества.", "c2_w_ef": "При этой причине синтез и длина как в контроле, но неправильно свёрнутого белка сохранилось 14 против 2: большая часть полноразмерных цепей свернулась неправильно, и контроль качества удалил не все из них.", "c2_w_r": "При этой причине синтез, длина и сворачивание как в контроле, но за период разрушено 54 молекулы правильно свёрнутого белка против 18: активный белок образуется, но быстро обновляется.", "c2_after": "Мало активного белка — не значит мало синтеза: одна и та же потеря активности возникает на разных этапах пути, и каждая причина оставляет свой след. На схеме — модель с найденной причиной.", "c2_src": "Правила модели — по учебнику (сворачивание, контроль качества, протеасома; см. «Источники» внизу страницы). Значения выведены из модели 4а; модель учебная.", "c2_link_h": "seminar-10-route.html#synthesized-vs-active", "c2_link_t": "Подробнее: шаг «Синтезированный, полноразмерный и функционально активный белок — разные показатели» в «Объяснениях»"};
function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  <marker id="a_${s}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
  <marker id="b_${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="10" orient="auto"><path d="M3.5 0 L6.5 0 L6.5 10 L3.5 10 z" class="mk"/></marker>
</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }
function setEdge(id, v){ const e = $(id); if (e) e.style.opacity = (typeof v === 'boolean' ? (v ? 1 : .16) : (.16 + .84 * clamp(v))).toFixed(2); }
function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }
function setOp(id, v){ const e = $(id); if (e) e.setAttribute('opacity', (+v).toFixed(2)); }
function setTxt(id, s){ const e = $(id); if (e) e.textContent = s; }
function move(id, dx, dy){ const e = $(id); if (e) e.style.transform = `translate(${dx}px,${dy}px)`; }
function PB(id, x, y){ return `<g class="pb fade" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="8.5"/><text x="${x}" y="${y + .5}">P</text></g>`; }
function XX(id, x1, y1, x2, y2){ return `<g class="cross fade" id="${id}" opacity="0"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x2}" y1="${y1}" x2="${x1}" y2="${y2}"/></g>`; }

}
function setBoxState(id, st){ setCls(id + '_r', st); }

  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
