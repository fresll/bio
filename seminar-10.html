        st.on = false;
        if (st.until != null) { const u = st.until; api.seek(u); }
        else if (fromStart) { api.seek(st.stop); if (o.onEnd) o.onEnd(); } else api.seek(Math.floor(st.T + 1e-6) + 1);
        return;
      }
      if (st.until != null && st.T >= st.until - 1e-6) { const u = st.until; st.on = false; api.seek(u); return; }
      st.on = true; paint();
    },
    pause() { st.on = false; st.until = null; paint(); },
    /* остановка при уходе со сцены или скрытии вкладки: кадр сохраняется */
    halt() { if (st.on || st.until != null) { st.on = false; st.until = null; paint(); } },
    tick(dt) {
      if (!st.on) return;
      st.T += Math.min(dt, .1) / st.speed;
      const end = st.T >= st.stop, cut = !end && st.until != null && st.T >= st.until;
      if (end) { st.T = st.stop; st.on = false; st.until = null; } else if (cut) { st.T = st.until; st.on = false; st.until = null; }
      paint(); if (end && o.onEnd) o.onEnd();
    },
  };
  TLS[K] = api;
  btn.onclick = () => st.on ? api.pause() : api.play(false);
  if (o.steps) {   /* шаг вперёд и назад — по границам этапов, как стрелки на ползунке; «Сначала» — кадр до начала процесса */
    /* этап k занимает (k−1, k]: шаг ведёт к следующему видимому этапу, без «пустого» нажатия от T = 0 (рецензия v1.4, п. 17) */
    const idx = T => Math.max(0, Math.ceil(T - 1e-6) - 1);
    $(P + 'f').onclick = () => { st.on = false; let u = Math.floor(st.T + 1e-6) + 1; if (idx(u) === idx(st.T)) u++; api.seek(u); };
    $(P + 'k').onclick = () => { st.on = false; let u = Math.ceil(st.T - 1e-6) - 1; if (u > 0 && idx(u) === idx(st.T)) u--; api.seek(Math.max(0, u)); };
    $(P + 'z').onclick = () => { st.on = false; api.seek(0); };
  }
  rng.addEventListener('input', () => { st.on = false; api.seek(+rng.value / 1000 * st.n); });
  /* клавиатура: стрелки переходят по этапам */
  rng.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
    e.preventDefault(); st.on = false; api.seek(d > 0 ? Math.floor(st.T + 1e-6) + 1 : Math.ceil(st.T - 1e-6) - 1);
  });
  return api;
}

/* телефон и планшет: кнопки ниже схемы, поэтому при запуске схема возвращается на экран, а увеличенная рамка — к месту событий;
   в сценарии разбор ответа ниже схемы, поэтому после показа страница возвращается к нему */
/* Отложенные прокрутки (ТА-06): один таймер на сцену; новый запрос заменяет прежний, уход со сцены отменяет, а перед прокруткой
   проверяется, что сцена всё ещё открыта и (для «back») разбор по-прежнему на экране. */
const VIEWT = {};
function stageView(K) {
  const narrow = () => window.matchMedia && matchMedia('(max-width:1000px)').matches;
  const smooth = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const later = (ms, fn) => { clearTimeout(VIEWT[K]); VIEWT[K] = setTimeout(() => { VIEWT[K] = 0; if (cur === K) fn(); }, ms); };
  return {
    reveal(x) {
      if (!narrow()) return;
      const st = $('sc' + K).querySelector('.stage'), zw = st.querySelector('.zwrap');
      later(60, () => {
        if (st.classList.contains('zoomed')) zw.scrollLeft = Math.max(0, x / 600 * zw.scrollWidth - zw.clientWidth / 2);
        const top = st.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .35) st.scrollIntoView({ block: 'start', behavior: smooth() });
      });
    },
    back() {
      if (!narrow()) return;
      const pick = () => CASE.on ? $('case' + K).querySelector('.cdone') : POE.on ? $('poe' + K) : null;
      if (pick()) later(900, () => { const el = pick(); if (el && !el.hidden) el.scrollIntoView({ block: 'start', behavior: smooth() }); });
    },
  };
}
stageView.cancel = K => { clearTimeout(VIEWT[K]); VIEWT[K] = 0; };

/* аудит Codex A19 (v1.4): после смены условия схема стоит на кадре «до начала процесса», подпись и показания скрыты —
   сначала прогноз, потом явный запуск («▶ Запустить», шаг или кнопка этапа). Как только шкала ушла с нуля, итог виден. */
function predictHold(K){ const sc = $('sc' + K); if (!sc) return; sc.classList.add('predict');
  /* рецензия v1.4, п. 8: кнопки этапов без исхода в доступном имени, пока прогноз не сделан */
  sc.querySelectorAll('.tlc').forEach(b => { if (!b.dataset.al) b.dataset.al = b.getAttribute('aria-label') || ''; b.setAttribute('aria-label', (b.dataset.al.split(':')[0] || '').trim());
    if (b.disabled) { b.dataset.no = '1'; b.disabled = false; } });   /* семинар 8, v1.2 (рецензия И-15): до запуска кружки одинаковы — недоступные не выдают место остановки */
  const c = $('capbox' + K), r = $('reads' + K); if (c) c.dataset.predict = t('predict_note'); if (r) r.dataset.predict = t('predict_reads'); }
function predictDone(K, T){ if (T > 1e-6) { const sc = $('sc' + K); if (sc && sc.classList.contains('predict')) { sc.classList.remove('predict');
  sc.querySelectorAll('.tlc').forEach(b => { if (b.dataset.al != null) { b.setAttribute('aria-label', b.dataset.al); delete b.dataset.al; } if (b.dataset.no) { b.disabled = true; delete b.dataset.no; } }); } } }

/* высота схемы считается до загрузки веб-шрифта; шрифт переносит строку вопроса и сдвигает схему вниз: пересчёт после загрузки */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typeof fitStage === 'function') fitStage(); });

/* =====================================================================
   s0b_kit.js — конструктор деталей (семинар 7; по образцу конструктора носителя семинара 3, вкладка 2).
   Гнёзда деталей: нажатие на заполненное гнездо вынимает деталь, нажатие на деталь в лотке возвращает её в своё гнездо.
   Гнездо с lock: true — деталь стоит всегда и не вынимается (граница с занятием, R49).
   Модель сцены не меняется: состояние деталей только выбирает один из исходов, проверенных в паспорте вкладки;
   цикл останавливается на первой недостающей детали.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
function kitMake(K, o) {
  /* o.slots: [{ id, k (ключ названия), lock }]; o.parts: { id: true/false }; o.title, o.hint — ключи; o.changed() */
  const P = o.parts;
  const html = () => {
    const slot = s => { const on = P[s.id] !== false, name = t(s.k);
      return `<button type="button" class="slot${on ? ' full' : ''}${s.lock ? ' lock' : ''}" data-slot="${s.id}"${s.lock ? ' aria-disabled="true"' : ''} aria-label="${name}: ${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}">` +
        `<small>${name}</small><b>${t(on ? (s.lock ? 'k_fixed' : 'k_on') : 'k_empty')}</b></button>`; };
    const tray = o.slots.filter(s => P[s.id] === false);
    return `<div class="kit"><span class="kt">${t(o.title)}</span><div class="slots">${o.slots.map(slot).join('')}</div>` +
      (tray.length ? `<div class="tray">${tray.map(s => `<button type="button" class="chip" data-k="${s.id}">${t(s.k)}</button>`).join('')}</div>` : '') +
      (tray.length > 1 ? `<p class="kh"><b>${t('k_first')}</b></p>` : '') + `<p class="kh">${t(o.hint)}</p></div>`;   /* рецензия интерактива, И-17 */
  };
  function wireKit() {
    const box = $('kit' + K); if (!box) return;
    const back = sel => { const e = box.querySelector(sel) || box.querySelector('.slot'); if (e) try { e.focus({ preventScroll: true }); } catch (x) {} };
    box.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const s = o.slots.find(x => x.id === b.dataset.slot); if (!s || s.lock || b.disabled) return;
      if (P[s.id] === false) return;
      P[s.id] = false; o.changed(); back(`[data-k="${s.id}"]`);
    });
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (c.disabled) return; P[c.dataset.k] = true; o.changed(); back(`[data-slot="${c.dataset.k}"]`); });
  }
  return {
    render() { const box = $('kit' + K); if (!box) return; box.innerHTML = html(); wireKit(); },
    full() { o.slots.forEach(s => { P[s.id] = true; }); },
    set(off) { o.slots.forEach(s => { P[s.id] = s.lock ? true : !(off || []).includes(s.id); }); },
    missing() { return o.slots.filter(s => P[s.id] === false).map(s => s.id); },
  };
}

/* =====================================================================
   s0z_ui.js — общие помощники сцен семинара 10 (статичная версия v1.x, Desktop): плашки показаний, строка ключевых чисел
   для телефона, раскрываемые блоки продвинутого уровня, недоступные положения переключателей.
   Интерактив (шкала этапов, анимация, «Найти причину», справка щелчком по детали) добавляет Claude Code после передачи;
   функции рисования GN.*.draw — чистые: их конечный кадр должен совпадать с этой статичной схемой.
   ===================================================================== */
const pl = (k, v, cls = 'np') => `<span class="pill ${cls}">${t(k, v)}</span>`;
const maskOf = K => (typeof poeMasked === 'function' && poeMasked(K)) || null;   /* шаг сценария с hide/mask до ответа */
/* строка ключевых чисел под схемой (видна только на узком экране): items — [[подпись, значение], …] */
function mstripSet(K, head, items){
  let e = $('ms' + K);
  if (!e){ const zw = $('sc' + K).querySelector('.zwrap'); zw.insertAdjacentHTML('afterend', `<p class="mstrip" id="ms${K}" aria-hidden="true"></p>`); e = $('ms' + K); }
  e.innerHTML = `<span class="mh">${head}</span>` + items.map(([l, v]) => `<span>${l}: <b>${v}</b></span>`)   /* v1.1 (Р-27): «подпись: число» — без согласования числительных */.join('');
}
/* недоступное положение переключателя: класс na (s9_wip.js оставляет такие кнопки выключенными) */
function segNA(id, off){ $(id).querySelectorAll('button').forEach(b => { b.classList.toggle('na', !!off); b.disabled = !!off; b.setAttribute('aria-disabled', String(!!off)); }); }
/* продвинутый уровень: исследование над переключателями, внизу — «Чего модель не показывает» и «Новые данные и как это установили» */
function advFrame(K){
  const ctrl = $('ctrl' + K);
  ctrl.insertAdjacentHTML('beforebegin', `<div class="panel aprob"><b class="k">${t('a_prob_t')}</b><p>${t('s' + K + '_prob')}</p></div>`);
  const side = $('sc' + K).querySelector('.side');
  side.insertAdjacentHTML('beforeend',
    `<details class="panel advx"><summary>${t('a_lim_t')}</summary><p>${t('s' + K + '_lim')}</p></details>` +
    `<details class="panel advx"><summary>${t('a_new_t')}</summary><p>${t('s' + K + '_new')}</p><p class="small"><b>${t('a_how_t')}</b> ${t('s' + K + '_how')}</p></details>`);
}
const advReads = (K, html) => { $('reads' + K).innerHTML = `<p class="small rdnote">${t('rd_model')}</p>` + html; };

/* v1.1 (рецензия Р-15): таблица стандартного генетического кода — раскрываемый блок под переключателями вкладок 1б, 1а и 2б.
   Строится из GN.code.CODE (та же таблица, по которой модель считает полипептиды): строка — первый нуклеотид, столбец — второй,
   внутри ячейки — третий. Стоп-кодоны выделены, AUG (старт) — тоже. */
function codeTable(K){
  const N = 'UCAG', C = GN.code.CODE, A3 = GN.code.A3;
  let h = `<table class="codetab"><thead><tr><th>${t('code_1')}</th>` + [...N].map(b => `<th>${b}</th>`).join('') + '</tr></thead><tbody>';
  for (const a of N){
    h += `<tr><th>${a}</th>`;
    for (const b of N) h += '<td>' + [...N].map(c => { const k = a + b + c, x = C[k];
      return `<span class="${x === '*' ? 'cstop' : k === 'AUG' ? 'cstart' : ''}">${k} ${x === '*' ? t('code_stop') : A3[x]}</span>`; }).join('<br>') + '</td>';
    h += '</tr>';
  }
  h += '</tbody></table>';
  $('ctrl' + K).insertAdjacentHTML('afterend', `<details class="panel codebox"><summary>${t('code_t')}</summary><p class="small">${t('code_note')}</p><div class="codewrap">${h}</div></details>`);
  if (!document.getElementById('codetab-css')) document.head.insertAdjacentHTML('beforeend', `<style id="codetab-css">
.codebox .codewrap{overflow-x:auto}.codetab{border-collapse:collapse;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;margin:6px 0}.codetab td span{white-space:nowrap}@media (max-width:420px){.codetab{font-size:10.5px}.codetab th,.codetab td{padding:3px 3px}}
.codetab th,.codetab td{border:1px solid var(--line,#D3DAE3);padding:4px 6px;vertical-align:top;text-align:left}.codetab thead th,.codetab tbody th{background:#F3F6FA;text-align:center}
.codetab .cstop{color:#C0392B;font-weight:700}.codetab .cstart{color:#2E9B57;font-weight:700}</style>`);
}
/* v1.2 (рецензия интерактива И-12): на телефоне увеличенная схема во время анимации держит событие (x в единицах схемы 0…600) в окне;
   пока шкала стоит, окно не трогается — студент прокручивает его сам */
function follow(K, x){
  const st = $('sc' + K) && $('sc' + K).querySelector('.stage'); if (!st || !st.classList.contains('zoomed')) return;
  const tl = typeof TLS !== 'undefined' && TLS[K]; if (!tl || !tl.playing) return;
  const zw = st.querySelector('.zwrap'); if (!zw || zw.scrollWidth <= zw.clientWidth + 2) return;
  const want = Math.max(0, Math.min(zw.scrollWidth - zw.clientWidth, x / 600 * zw.scrollWidth - zw.clientWidth / 2));
  if (Math.abs(zw.scrollLeft - want) > 4) zw.scrollLeft = want;
}
/* v1.2.1 (аудит S10-07): если после «Показать на схеме» схема переходит к другому состоянию (шаг с полем note), над схемой —
   подпись перехода; без неё студент не понял бы, почему рисунок не тот, о котором спрашивали. Подпись снимается при любом
   новом шаге, повторе и выходе из сценария. */
(function(){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments);
  document.querySelectorAll('.psw').forEach(e => { e.hidden = true; });
  if (POE.on && POE.shown) { const st = SCENES[cur].poe[poeIdx(POE.i)];
    if (st && st.note) { let e = $('psw' + cur);
      if (!e) { $('sc' + cur).querySelector('.stage').insertAdjacentHTML('afterbegin', `<p class="psw" id="psw${cur}" role="status"></p>`); e = $('psw' + cur); }
      e.textContent = t(st.note); e.hidden = false; } }
  return r; }; })();

/* =====================================================================
   Вкладка 1. Генетический код и рамка считывания.
   1b — базовый: изменение в кодоне 3 условной мРНК (нет / GAA→GAG / GAA→GUA / GAA→UAA / вставка C / утрата A / утрата GAA).
   Модель — GN.s1b; полипептиды вычисляются по стандартному коду. 1a — продвинутый: s5_adv.js.
   v1.1.1 (Code): шкала этапов (timeStrip, s0_motion.js) — AUG и рамка → считывание кодонов → аминокислота к C-концу → стоп-кодон и освобождение.
   Граница с аудиторным занятием (R49): нет наборов «три замены в одном кодоне» и «вставка G после четвёртого кодона»;
   здесь одна мРНК и семь изменений одного кодона.
   ===================================================================== */
(function(){
  const K = '1b', M = GN.s1b;
  layout(K); window.MODEL1B = M.model;
  codeTable(K);
  $('ctrl' + K).innerHTML = segHTML('s1b_ch', 's1_ch', M.ORDER.map(k => [k, 's1_ch_' + k]), 'none') + `<p class="small">${t('s1_ctrl_note')}</p>`;
  $('take' + K).textContent = t('s1b_take');
  const cur = () => M.model(segVal('s1b_ch'));
  window.STATIC1B = () => defs(K) + M.draw(cur(), t);
  /* v1.1.1 (Code): шкала этапов и анимация — кадры рисует GN.s1b.frame (s0_go_s1.js), конечный кадр = статичная схема */
  const view = stageView(K);
  const tl = timeStrip(K, { note: 's1t_note', render(T){ const e = $('svg' + K); if (e) e.innerHTML = defs(K) + M.frame(cur(), T, t);
    { const n = cur().alt.aa.length; follow(K, 138 + Math.max(0, Math.min(n, (T - 1) / 2 * n)) * 40); }   /* v1.2, И-12: рибосома в окне увеличенной схемы */
    predictDone(K, T); }, onEnd: view.back });
  window.TL1B = tl;
  let lastKey = null, armed = false, hold = false;
  function update(){
    const o = cur(), A3 = GN.code.A3;
    if (o.state !== lastKey){ lastKey = o.state; tl.config(M.stageKeys(o), 4, null, { speed: 1.5 }); if (!armed) tl.seek(tl.end); }
    if (armed){ armed = false; hold = false; tl.play(true); view.reveal(300); }
    else if (hold){ hold = false; tl.seek(0); predictHold(K); }
    else if (!tl.playing) tl.redraw();
    const fr = o.cl.kind === 'fs' ? 's1_v_frame_shift' : 's1_v_frame_kept';
    $('reads' + K).innerHTML =
      readRow(t('s1_r_codon'), '', pl('s1_v_codon', { a: o.c3, b: o.op.type === 'sub' ? o.c3n : t('s1_v_codon_' + o.state) }, o.state === 'none' ? 'np' : 'p')) +
      readRow(t('s1_r_len'), t('s1_r_len_s'), pl('s1_v_len', { n: o.norm.aa.length, m: o.alt.aa.length }, o.alt.aa.length !== o.norm.aa.length ? 'p' : 'np')) +
      readRow(t('s1_r_changed'), t('s1_r_changed_s'), pl('s1_v_changed', { n: o.cl.chC }, o.cl.chC ? 'p' : 'np')) +
      readRow(t('s1_r_frame'), '', pl(fr, null, o.cl.kind === 'fs' ? 'p' : 'np')) +
      readRow(t('s1_r_kind'), '', pl('s1_v_kind_' + o.state, null, o.state === 'none' ? 'np' : 'p'));
    mstripSet(K, t('ms_head'), [[t('ms_len'), o.alt.aa.length], [t('ms_changed'), o.cl.chC], [t('ms_frame'), t(o.cl.kind === 'fs' ? 'ms_shift' : 'ms_kept')]]);
    setCap(K, 's1_cap_' + o.state);
  }
  wire(['s1b_ch'], () => { hold = true; update(); });
  const set = c => segSet('s1b_ch', c);
  const run = c => { set(c); armed = true; };
  SCENES[K] = { update, tick: tl.tick, poe: [
    { n: 3, hide: true, ok: 0, pre(){ set('none'); }, apply(){ run('syn'); } },
    { n: 3, hide: true, ok: 0, pre(){ set('none'); }, apply(){ run('non'); } },
    { n: 3, hide: true, ok: 0, pre(){ set('none'); }, apply(){ run('ins1'); } },
    { n: 3, hide: true, ok: 0, pre(){ set('none'); }, apply(){ run('del3'); } },
    { n: 3, ok: 0, pre(){ set('mis'); }, apply(){ run('mis'); } },
    { n: 3, last: true, ok: 0, pre(){ set('none'); }, apply(){ run('none'); } },
  ] };
})();

/* =====================================================================
   Вкладка 2. тРНК и аминоацилирование.
   2b — базовый: конструктор (изолейцил-тРНК-синтетаза, АТФ; тРНК изолейцина и валина закреплены) × кодон в A-сайте (AUC / AUU / GUC).
   Модель — GN.s2b; шкала этапов (v1.1.2, Code) — кадры GN.s2b.frame (s0_go_s2.js), конечный кадр = статичная схема.
   Граница с аудиторным занятием (R49): нет пары «цистеин — аланин» и сюжета двух клеток с ошибкой синтетазы и рибосомы;
   здесь тРНК изолейцина, условия зарядки и спаривание в трёх кодонах.
   ===================================================================== */
(function(){
  const K = '2b', M = GN.s2b;
  layout(K); window.MODEL2B = M.model;
  /* v1.1.2 (Code): переключатели «синтетаза» и «АТФ» v1.1 заменены конструктором (паспорт интерактива, вкладка 2); исходы — те же
     (модель GN.s2b не менялась). тРНК изолейцина и тРНК валина закреплены: исход без них модель не рассматривает. */
  const parts = { syn: true, atp: true, ile: true, val: true };
  window.PARTS2B = parts;

(function(){

     (eEF1A закреплён: исход без него модель не рассматривает; без eEF2 — остановка на этапе 4, без eRF1 — на этапе 6).

  const parts = { eef1a: true, eef2: true, erf1: true };

  const stage = T => Math.max(1, Math.min(6, Math.ceil(T - 1e-9)));
  const site = (v, o) => !v ? t('s3_v_empty') : t(v.chain.length > 1 ? 's3_v_trna_chain' : v.chain.length ? 's3_v_trna_aa' : 's3_v_trna_free', { a: GN.code.A3[v.aa], n: v.chain.length, i: v.ini ? t('s3_v_ini') : '' });

  const shownStage = T => { const k = stage(T); return k === 5 && T - 4 < .9 && T < tl.end - 1e-6 ? 4 : k; };
  const tl = timeStrip(K, { note: 's3t_note', render(T){ const e = $('svg' + K); if (e) e.innerHTML = defs(K) + M.frame(parts, T, t); reads(shownStage(T)); follow(K, 300); predictDone(K, T); }, onEnd: view.back });
  window.TL3B = tl;

    if (armed){ const [a, b] = armed; armed = null; hold = false; want = null; tl.seek(Math.max(0, Math.min(a, b - 1, tl.end))); tl.play(false, b); view.reveal(300); }

/* =====================================================================

   1a — одинаковое число нуклеотидных изменений — разные последствия (GN.a1); 2a — правильное спаривание кодона и антикодона
   не гарантирует правильной аминокислоты (GN.a2); 3a — ограничивающие факторы трансляции: поток рибосом по мРНК (GN.a3);
   4a — синтезированный, полноразмерный и функционально активный белок (GN.a4).
   В каждой сцене: исследование, переключатели, показания, «предскажите → проверьте → объясните» с обратной задачей
   (флаг mask: схема обратной задачи до ответа), лестница подсказок p{K}_{i}_h1…h3, блоки «Чего модель не показывает»
   и «Новые данные и как это установили». Все числа — учебные допущения. Статичная версия: анимацию добавляет Claude Code.
   ===================================================================== */
const ADV = {};
/* v1.1.1 (Code; механизм — семинар 9, advStrip): шкала этапов продвинутой сцены с пошаговым ходом («◀ Шаг», «Шаг ▶», «Сначала»).
   show(keys, f, opt, masked): f(T) рисует кадр, f(null) — конечный кадр (статичная схема); masked — только конечный кадр (обратная задача). */
function advStrip(K, note){
  const view = stageView(K);
  let frame = () => '', mode = 'end', sig = null, opt = {};
  const tl = timeStrip(K, { note, steps: true, render(T){ const s = $('svg' + K); if (s) s.innerHTML = defs(K) + frame(T); predictDone(K, T); if (opt.onT) opt.onT(T); }, onEnd: view.back });
  window['TL' + K.toUpperCase()] = tl;
  const z = $('tl' + K + 'z'); if (z) z.addEventListener('click', () => predictHold(K));
  return {
    tl,
    hold(){ mode = 'hold'; }, go(){ mode = 'play'; }, K,
    show(keys, f, o = {}, masked = false){
      opt = o;
      frame = masked ? () => f(null) : T => f(T >= tl.end - 1e-6 ? null : T);
      const s2 = JSON.stringify([keys, o.key || '', o.stop, o.stopKey, !!masked]);
      const changed = s2 !== sig;
      if (changed){ sig = s2; tl.config(keys, o.stop != null ? o.stop : keys.length, o.stopKey || null, Object.assign({ speed: 1.3 }, o)); }
      if (masked) tl.seek(tl.end);
      else if (mode === 'end') { if (changed) tl.seek(tl.end); else if (!tl.playing) tl.redraw(); }
      else if (mode === 'hold') { tl.seek(0); predictHold(K); }
      else { tl.play(true); view.reveal(300); }
      mode = 'end';
    },
  };
}

(function(){
  const K = '3a', M = GN.a3;
  layout(K); window.MODEL3A = M.model;
  $('ctrl' + K).innerHTML =
    segHTML('s3a_ki', 's3a_ki', [['8', 's3a_ki_8'], ['16', 's3a_ki_16'], ['32', 's3a_ki_32']], '16') +
    segHTML('s3a_slow', 's3a_slow', [['1', 's3a_slow_1'], ['10', 's3a_slow_10'], ['22', 's3a_slow_22']], '1') +
    segHTML('s3a_step', 's3a_step', [['1', 's3a_step_1'], ['2', 's3a_step_2']], '1') +
    `<p class="small">${t('s3a_note')}</p>`;
  advFrame(K);
  $('take' + K).textContent = t('s3a_take');
  let inv = false;
  const S = advStrip(K, 's3at_note');
  const args = () => ['s3a_ki', 's3a_slow', 's3a_step'].map(segVal);
  const mode = () => (maskOf(K) && maskOf(K).mask) ? 'mask' : inv ? 'open' : null;
  window.STATIC3A = () => defs(K) + (mode() ? M.pair(t, mode() === 'mask') : M.draw(M.model(...args()), t));
  function update(){
    if (!(typeof POE !== 'undefined' && POE.on)) inv = false;
    const md = mode();
    if (md) {
      S.show(M.stageKeys(), () => M.pair(t, md === 'mask'), { key: 'pair' + md }, true);   /* обратная задача — один кадр */
      const a = M.sim(...M.PAIR.A), b = M.sim(...M.PAIR.B);
      advReads(K, readRow(t('a3_lbl_cellA'), '', pl(md === 'mask' ? 's3a_v_done_only' : 's3a_v_pair', { d: a.done, n: a.on, u: a.up, m: a.missed })) +
        readRow(t('a3_lbl_cellB'), '', pl(md === 'mask' ? 's3a_v_done_only' : 's3a_v_pair', { d: b.done, n: b.on, u: b.up, m: b.missed }, md === 'mask' ? 'np' : 'p')));
      mstripSet(K, t('ms_head'), [[t('ms_doneA'), a.done], [t('ms_doneB'), b.done]]);
      setCap(K, md === 'mask' ? 's3a_cap_mask' : 's3a_cap_inv'); return;
    }
    const o = M.model(...args());
    /* v1.2 (рецензия интерактива И-13): строка чисел на телефоне — числа текущего кадра (те же, что на схеме); в конечном кадре — итог */
    const ms = T => { const q = T == null || T >= 6 - 1e-6 ? o : M.at(o.ki, o.slow, o.step, T); mstripSet(K, t('ms_head'), [[t('ms_init'), q.init], [t('ms_on'), q.on], [t('ms_done'), q.done]]); };
    S.show(M.stageKeys(), T => { ms(T); return T == null ? M.draw(o, t) : M.frame(o, T, t); }, { key: o.key });
    advReads(K,
      readRow(t('s3a_r_init'), t('s3a_r_init_s'), pl('s3a_v_n', { n: o.init })) +
      readRow(t('s3a_r_on'), t('s3a_r_on_s'), pl('s3a_v_on', { n: o.on, u: o.up, d: o.down }, o.up >= 6 ? 'p' : 'np')) +
      readRow(t('s3a_r_done'), t('s3a_r_done_s'), pl('s3a_v_n', { n: o.done }, 'p')) +
      readRow(t('s3a_r_missed'), t('s3a_r_missed_s'), pl('s3a_v_n', { n: o.missed }, o.missed ? 'p' : 'np')) +
      readRow(t('s3a_r_bal'), '', pl('s3a_v_bal', { i: o.init, d: o.done, n: o.on })));
    ms(S.tl.T >= S.tl.end - 1e-6 ? null : S.tl.T);
    /* что ограничивает поток в этом состоянии модели: очередь перед медленным кодоном (на нём рибосома стоит не меньше, чем
       проходит свои F кодонов, и до него рибосом заметно больше, чем после) — кодон 80; иначе все возможные инициации состоялись —
       частота инициации; иначе — освобождение начала мРНК */
    const queue = +o.slow >= M.F * +o.step && o.up - o.down >= 3;   /* v1.1 (Р-07): очередь перед кодоном 80 важнее отсутствия пропусков */
    const lim = queue ? 'slow' : o.missed === 0 ? 'init' : 'start';
    setCap(K, 's3a_cap_' + lim);
  }
  wire(['s3a_ki', 's3a_slow', 's3a_step'], () => { inv = false; S.hold(); update(); });
  const set = (a, b, c) => { inv = false; segSet('s3a_ki', String(a)); segSet('s3a_slow', String(b)); segSet('s3a_step', String(c)); };
  const run = (...a) => { set(...a); S.go(); };
  /* «Найти причину» (случай 1): после решения на схеме — модель найденной причины; «Выйти» возвращает прежние условия */
  let saved = null;

    if (c) { if (!saved) saved = args(); run(...{ init: [32, 1, 1], slow: [16, 22, 1], step: [16, 1, 2] }[c]); }

    update(); };

    { n: 3, hide: true, ok: 0, pre(){ set(16, 1, 1); }, apply(){ run(32, 1, 1); } },
    { n: 3, hide: true, ok: 0, pre(){ set(16, 1, 1); }, apply(){ run(16, 22, 1); } },   /* v1.1 (Р-03): исходное состояние — инициация раз в 16 ед.: 7 → 9 рибосом, 30 → 15 полипептидов */
    { n: 3, hide: true, chain: true, ok: 0, pre(){ set(16, 22, 1); }, apply(){ set(16, 22, 1); } },   /* chain: продолжение шага 2 (Р-04); hide — показание «завершено» выдало бы ответ */
    { n: 3, hide: true, ok: 0, pre(){ set(16, 1, 1); }, apply(){ run(16, 1, 2); } },
    { n: 3, mask: true, last: true, ok: 0, pre(){ set(16, 1, 1); }, apply(){ inv = true; } },
  ] };
  ADV[K] = { set };
})();

/* ---------- лестница подсказок в сценариях: ключи p{K}_{i}_h1…h3 (оба уровня) ---------- */
(function(){
  const _pr = poeRender; let HINT = { key: '', n: 0 };
  poeRender = function(){
    const r = _pr.apply(this, arguments);
    if (!POE.on) return r;
    const box = $('poe' + cur), si = poeIdx(POE.i), P = `p${cur}_${si + 1}`;
    if (!box || !((P + '_h1') in TEXTS) || POE.shown) return r;
    if (HINT.key !== P) HINT = { key: P, n: 0 };
    const hs = []; for (let i = 1; i <= 3; i++) if ((P + '_h' + i) in TEXTS) hs.push(t(P + '_h' + i));
    const shown = hs.slice(0, HINT.n).map((h, i) => `<p class="small hint"><b>${t('hint_n', { i: i + 1 })}</b> ${h}</p>`).join('');
    box.querySelector('.opts').insertAdjacentHTML('afterend', shown + (HINT.n < hs.length ? `<button class="btn ghost" id="poeHint">${t('hint_btn', { i: HINT.n + 1, n: hs.length })}</button>` : ''));
    const b = $('poeHint'); if (b) b.onclick = () => { HINT.n++; POE_FOCUS = { id: 'poeHint' }; poeRender(); };
    return r;
  };
})();

/* сценарий: до «Показать на схеме» переключатели недоступны — ответ нельзя подсмотреть (рецензия v0.1, R37) */
function poeLock(K){ const c = $('ctrl' + K); if (!c) return; const lock = POE.on && !POE.shown;
  c.querySelectorAll('button, input').forEach(e => { const na = e.classList.contains('na'); e.disabled = lock || na; e.setAttribute('aria-disabled', String(lock || na)); });   /* v1.1.1: недоступное положение (segOff, класс na) остаётся выключенным и вне сценария (как в семинаре 7 v1.4) */
  c.style.opacity = lock ? .55 : ''; }
Object.keys(SCENES).forEach(K => { const u = SCENES[K].update; SCENES[K].update = function(){ u(); poeLock(K); }; });
/* выход из сценария до «Показать на схеме» снимает блокировку переключателей (аудит А1, А1-20):
   после каждой перерисовки панели сценария состояние блокировки пересчитывается и для текущей сцены */

/* v1.3: кнопок «Метод» нет — на продвинутом уровне методы не разбираются */

/* рецензия v1.0, Р-01: в шаге «предскажите» ответ не должен быть виден до выбора варианта.

function poeMasked(K){ if (!(POE.on && cur === K && !POE.shown)) return null; const st = SCENES[K].poe[poeIdx(POE.i, K)]; return st || null; }
function poeHide(K){ const sec = $('sc' + K); if (!sec) return; const st = poeMasked(K), hide = !!(st && st.hide), mask = !!(st && st.mask);
  sec.classList.toggle('poehide', hide); sec.classList.toggle('poemask', mask);
  const zw = sec.querySelector('.zwrap'); if (zw) { zw.dataset.hide = t('poe_hidden');
    /* рецензия интерактива, И-05: закрытая схема недоступна и диктору, и клавиатуре */

  const tl = $('tl' + K); if (tl && !(typeof MODEL !== 'undefined' && MODEL[K])) { const shut = hide || mask; if (shut && typeof TLS !== 'undefined' && TLS[K]) { TLS[K].halt(); TLS[K].seek(TLS[K].end); }   /* v1.2 (рецензия И-06): наблюдение — конечный кадр, а не остановленный промежуточный */
    tl.querySelectorAll('button, input').forEach(e => { e.disabled = shut || e.classList.contains('no'); }); }
  const r = $('reads' + K); if (r && hide) r.hidden = true; else if (r && !(typeof MODEL !== 'undefined' && MODEL[K])) r.hidden = false; }
Object.keys(SCENES).forEach(K => { const u = SCENES[K].update; SCENES[K].update = function(){ u(); poeHide(K); }; });
(function(){ const _pr = poeRender; poeRender = function(){ const r = _pr.apply(this, arguments); Object.keys(SCENES).forEach(poeHide); return r; }; })();
/* рецензия v1.0, Р-35б: плавающая кнопка «↓ К выводу» ложилась на панель переключателей. Кнопка стоит в начале правой колонки
   и уходит вверх вместе с ней: на переключатели и показания она не ложится (v1.2) */
(function(){ const _ri = revInit; revInit = function(){ const r = _ri.apply(this, arguments);
  document.querySelectorAll('#scenes .side').forEach(sd => { const b = sd.querySelector('.totake'); if (b){ b.classList.add('inline'); sd.insertBefore(b, sd.firstChild); } });
  return r; }; })();

/* =====================================================================
   s9z_case.js — режим «Найти причину» (движок семинаров 7–9 без изменений логики; случаи семинара 10 — паспорт интерактива,
   продвинутый уровень; v1.1.3+, Code). Имя файла задаёт порядок сборки (после s9_wip.js), а не номер семинара.
   Образец со скрытой причиной; студент выбирает измерения. Задача решена, только если данные оставляют одно объяснение:
   верная догадка без данных не засчитывается. causes — варианты объяснения; образец получает одну из них случайно,
   «Начать заново» выбирает другую. Ситуации не из колоды занятия (R49). Логика (caseFits, caseMinimal) — чистые функции;
   значения таблиц пересчитаны моделями 3а и 4а и проверяются тестом tests10/case10.mjs; все подписи — через t().
   ===================================================================== */
const CASE_SPEC = {
  /* случай 1, вкладка 3, продвинутый уровень: белка мало, мРНК как в норме (модель 3а, T = 600 ед.). Контроль — (16, 1, 1);
     init — инициация раз в 32 ед.; slow — 22 ед. на кодоне 80; step — 2 ед. на каждом кодоне */
  '3a': { id: 'c1', causes: ['init', 'slow', 'step'], meth: {
    on: { ctrl: 'v7', init: 'v3', slow: 'v9', step: 'v12' },
    up: { ctrl: 'v5', init: 'v2', slow: 'v8', step: 'v8' },
    missed: { ctrl: 'v0', init: 'v0', slow: 'v12', step: 'v7' },
    done: { ctrl: 'v30', init: 'v15', slow: 'v15', step: 'v18' },
  } },
  /* случай 2, вкладка 4, продвинутый уровень: активного белка мало (модель 4а). Контроль — (100, 0, 0,9, 0,8, 0,2);
     S — синтез 50; pt — 50 % преждевременной терминации; ef — сворачивание 30 %; r — обновление 60 % */
  '4a': { id: 'c2', causes: ['S', 'pt', 'ef', 'r'], meth: {
    S: { ctrl: 'v100', S: 'v50', pt: 'v100', ef: 'v100', r: 'v100' },
    F: { ctrl: 'v100', S: 'v50', pt: 'v50', ef: 'v100', r: 'v100' },
    R: { ctrl: 'v74', S: 'v37', pt: 'v47', ef: 'v38', r: 'v38' },
    M: { ctrl: 'v2', S: 'v1', pt: 'v1', ef: 'v14', r: 'v2' },
    turn: { ctrl: 'v18', S: 'v9', pt: 'v9', ef: 'v6', r: 'v54' },   /* v1.2 (И-26): разрушено правильно свёрнутого (Fd), а не доля r — не сама гипотеза */
  } },
};
/* объяснения, которые согласуются с проделанными измерениями */
function caseFits(spec, done, truth){ return spec.causes.filter(c => done.every(m => spec.meth[m][c] === spec.meth[m][truth])); }
/* наименьший набор измерений, оставляющий одно объяснение */
/* предпочтение — наборам, где каждое измерение отличается от контроля: вывод не «методом исключения» (рецензия интерактива, И-06) */
function caseMinimal(spec, truth){
  const ids = Object.keys(spec.meth); let best = null, any = ids;
  for (let mask = 1; mask < (1 << ids.length); mask++){
    const set = ids.filter((_, i) => mask >> i & 1);
    if (caseFits(spec, set, truth).length !== 1) continue;
    if (set.length < any.length) any = set;
    if (set.every(m => spec.meth[m][truth] !== spec.meth[m].ctrl) && (!best || set.length < best.length)) best = set;
  }
  return best || any;
}
window.CASE_LOGIC = { CASE_SPEC, caseFits, caseMinimal };

const CASE = { on: false, K: null, seed: 0, truth: null, done: [], guess: null, solved: false, open: null, mo: [], co: [] };
(function(){
  const url = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('poeBtn').insertAdjacentHTML('afterend', `<button class="btn ghost" id="caseBtn" hidden>${t('case_btn')}</button>`);
  Object.keys(CASE_SPEC).forEach(K => {
    const sec = $('sc' + K);
    sec.querySelector('.side').insertAdjacentHTML('afterbegin', `<div class="panel case" id="case${K}" hidden></div>`);
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', `<div class="veil" aria-hidden="true"><b>${t('case_veil')}</b><span>${t('case_veil_s')}</span></div>`);
  });
  const val = (S, m, v) => t(`${S.id}_v_${m}_${v}`);
  /* решение проверяется и после выбора объяснения, и после каждого измерения */
  function settle(K, S){
    if (!CASE.solved && CASE.done.length && CASE.guess === CASE.truth && caseFits(S, CASE.done, CASE.truth).length === 1){

    }
  }
  const ctl = (S, m) => { const k = `${S.id}_v_${m}_${S.meth[m].ctrl}`; return t(TEXTS[k + '_c'] ? k + '_c' : k); };   /* в строке контроля «как в контроле» не годится */
  function start(K, seed){
    const S = CASE_SPEC[K];
    /* порядок измерений и объяснений перемешивается, как в сценариях; ?fixed — постоянный порядок */
    const mix = a => { a = a.slice(); if (!url.has('fixed')) for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const TR = S.truths || S.causes;
    Object.assign(CASE, { on: true, K, seed, truth: TR[seed % TR.length], done: [], guess: null, solved: false, open: null, mo: mix(Object.keys(S.meth)), co: mix(S.causes) });
    POE.on = false; poeRender();
    const sec = $('sc' + K); sec.classList.add('casemode'); sec.classList.remove('casedone');
    SCENES[K].caseShow(null); render(); sync();
    if (window.matchMedia && matchMedia('(max-width:1000px)').matches) $('case' + K).scrollIntoView({ block: 'start' });
  }
  function exit(){
    if (!CASE.on) return;
    const K = CASE.K, sec = $('sc' + K); CASE.on = false;
    sec.classList.remove('casemode', 'casedone'); $('case' + K).hidden = true; $('case' + K).innerHTML = '';
    SCENES[K].caseShow(null); SCENES[K].update(); sync();
  }
  function verdict(S){
    const g = CASE.guess; if (!g) return '';
    if (CASE.solved) return '';
    const fits = caseFits(S, CASE.done, CASE.truth);
    if (!CASE.done.length) return `<p class="cv warn">${t('case_need')}</p>`;
    if (!fits.includes(g)){
      const m = CASE.done.find(x => S.meth[x][g] !== S.meth[x][CASE.truth]);
      return `<p class="cv bad">${t('case_conflict', { m: t(`${S.id}_m_${m}`), want: val(S, m, S.meth[m][g]), got: val(S, m, S.meth[m][CASE.truth]) })}</p>`;
    }
    return `<p class="cv warn">${t(fits.length === 2 ? 'case_more1' : 'case_more', { n: fits.length - 1 })}</p>`;
  }
  function render(){
    const K = CASE.K, S = CASE_SPEC[K], box = $('case' + K); box.hidden = false;
    let h = `<div class="k">${t('case_k')}</div><h3 class="ct">${t(S.id + '_title')}</h3>${TEXTS[S.id + '_tag'] ? `<p class="ctag">${t(S.id + '_tag')}</p>` : ''}<p class="co">${t(S.id + '_obs')}</p><p class="cnote">${t('case_note')}</p>`;
    h += `<div class="ch">${t('case_meas')}</div><div class="cm">`;
    CASE.mo.forEach(m => {
      const on = CASE.done.includes(m), open = CASE.open === m;
      h += `<div class="crow${on ? ' on' : ''}"><button type="button" class="cmb" data-m="${m}"${on ? ' aria-pressed="true"' : ''}${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_m_${m}`)}</button>` +
        `<button type="button" class="cq" data-q="${m}" aria-expanded="${open}" aria-label="${t('case_meth')}: ${esc(t(`${S.id}_m_${m}`))}">${t('case_meth')}</button>` +
        (on ? `<div class="cres"><span>${t('case_ctrl')}: ${ctl(S, m)}</span><b>${t('case_sample')}: ${val(S, m, S.meth[m][CASE.truth])}</b></div>` : '') +
        (open ? `<p class="cmeth">${t(`${S.id}_k_${m}`)}</p>` : '') + `</div>`;
    });
    h += `</div><div class="ch">${t('case_why')}</div><div class="cc">`;
    CASE.co.forEach(c => {
      const right = CASE.solved && c === CASE.truth;
      h += `<button type="button" class="ccb${CASE.guess === c ? ' picked' : ''}${right ? ' right' : ''}" data-c="${c}"${CASE.solved ? ' disabled' : ''}>${t(`${S.id}_c_${c}`)}</button>`;
    });
    h += `</div><div role="status">${verdict(S)}</div>`;
    if (CASE.solved){
      const min = caseMinimal(S, CASE.truth);
      const flat = Object.keys(S.meth).filter(m => new Set(S.causes.map(c => S.meth[m][c])).size === 1);
      h += `<div class="cdone" role="status"><b>${t('case_ok')}</b><p>${t(`${S.id}_w_${CASE.truth}`)}</p>` +
        (TEXTS[S.id + '_after'] ? `<p class="cmin">${t(S.id + '_after')}</p>` : '') +
        `<p class="cmin">${t('case_used', { n: CASE.done.length, k: min.length })} ${t('case_enough', { m: min.map(x => '«' + t(`${S.id}_m_${x}`) + '»').join(', ') })}</p>` +
        flat.map(m => `<p class="cmin">${t('case_flat', { m: t(`${S.id}_m_${m}`) })}</p>`).join('') +
        `<p class="cmin"><a href="${t(S.id + '_link_h')}">${t(S.id + '_link_t')}</a></p></div>`;

    h += `<p class="cnote">${t(S.id + '_src')}</p><div class="btns"><button type="button" class="btn ghost" id="caseNew">${t('case_new')}</button><button type="button" class="btn ghost" id="caseX">${t('poe_exit')}</button></div>`;

    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = b.dataset.m; if (!CASE.done.includes(m)) CASE.done.push(m); settle(K, S); render(); keep(`[data-m="${m}"]`); });
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = b.dataset.q; CASE.open = CASE.open === q ? null : q; render(); keep(`[data-q="${q}"]`); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; CASE.guess = c; settle(K, S);
      render(); keep(`[data-c="${c}"]`);
      /* компьютер: вывод — в видимую часть панели; телефон: сначала схема, вывод после показа (stageView.back) */
      const d = box.querySelector('.cdone'); if (d && !(window.matchMedia && matchMedia('(max-width:1000px)').matches)) d.scrollIntoView({ block: 'nearest' });
    });
    $('caseNew').onclick = () => { let seed = CASE.seed + 1;   /* новый образец — с другой причиной */
      const TR = S.truths || S.causes;
      if (!url.has('fixed') && TR.length > 1) do { seed = Math.floor(Math.random() * 9973); } while (TR[seed % TR.length] === CASE.truth);   /* семинар 8: при одной верной причине — тот же случай заново */
      start(K, seed); };
    $('caseX').onclick = exit;
  }
  function sync(){ const b = $('caseBtn'); b.hidden = !CASE_SPEC[cur] || !SCENES[cur].caseShow; b.setAttribute('aria-pressed', String(CASE.on)); }
  $('caseBtn').onclick = () => { if (CASE.on) { exit(); return; } start(cur, url.has('cs') ? +url.get('cs') : url.has('fixed') ? 0 : Math.floor(Math.random() * 9973)); };
  $('poeBtn').addEventListener('click', exit);
  const _show = show;
  show = function(){ if (CASE.on && cur !== CASE.K) exit(); const r = _show.apply(this, arguments); if (CASE.on && cur !== CASE.K) exit(); sync(); return r; };
  window.CASE_UI = { start, exit, get state(){ return CASE; } };
})();

   на сайте ссылка относительная, в сохранённом файле — на адрес сайта (аудит 06.11.2026, LINK-001) */
