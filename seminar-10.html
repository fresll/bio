<title>Семинар 10 · Трансляция: от кодона мРНК к функционально активному белку — Кафедра биологии и генетики, Медицинский университет Петровского</title>

<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.navlinks{position:absolute;right:0;top:3px;display:flex;flex-direction:column;align-items:flex-end}
.homelink{font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:176px}}
@media(max-width:600px){.navlinks{position:static;align-items:flex-start;margin:0 0 6px}.homelink{display:block;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.navlinks,.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.qcol{color:var(--muted);font-size:13.5px;margin:2px 0 0;max-width:90ch;flex-basis:100%;order:9}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
/* узкий экран: длинное значение показания переносится под подпись (как в v1.4) */
@media (max-width:700px){.read{grid-template-columns:minmax(0,1fr)}.read .pill{white-space:normal;justify-self:start}}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);dominant-baseline:central}
.lbl:not([fill]),.lbl-l:not([fill]){fill:var(--ink)}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
.semnav .sn-map{grid-column:1/-1;border:2px solid var(--u-ui,#006CA3)}
.semnav .sn-sec{text-align:right}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon,.semnav .sn-sec{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}
.mbnext{margin:18px 0;padding:16px 20px}.mbnext h3{margin:0 0 8px;font-size:17px}.mbnext ul{margin:0;padding-left:20px}.mbnext li{margin:6px 0;line-height:1.5}

/* шкала этапов под схемой (прототип: время в схемах) */
.stage:has(.tl):not(.zoomed) svg{max-height:calc(var(--avail,calc(100vh - 160px)) - 148px)}
.tl{padding:8px 12px 8px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tlrow{display:flex;gap:10px;align-items:center}
.tlplay{white-space:nowrap;min-width:116px;padding-top:7px;padding-bottom:7px}
.tlr{flex:1;min-width:60px;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tlr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0090D0 var(--fill,0%),var(--line) var(--fill,0%),var(--line) var(--stop,100%),#F3C9C7 var(--stop,100%))}
.tlr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.tlchips{display:flex;gap:4px;flex:none}
.tlc{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;padding:0}
.tlc.done{background:#DDF0F9;border-color:#0090D0;color:#0B3B57}
.tlc.cur{background:#006CA3;border-color:#006CA3;color:#fff}
.tlc.no{background:#FBEAE9;border-color:#E9A9A6;color:#B5403C;cursor:not-allowed;text-decoration:line-through}
.tltext{margin:0;font-size:14.5px;line-height:1.3;min-height:2.6em;color:var(--ink)}
.tltext.stopped{color:var(--bad);font-weight:600}
.tlnote{margin:0;font-size:12px;color:var(--muted)}
.tlx{display:none;margin:0;font-weight:600;font-size:15px}
@media (max-width:700px){.tlx{display:block}.tlrow{flex-wrap:wrap}.tlplay{min-width:0}.tlchips{flex-basis:100%;gap:6px}.tlc{width:34px;height:34px}.tltext{font-size:15px;min-height:3.9em}}

.casemode:not(.casedone) .stage .zwrap,.casemode:not(.casedone) .stage .tl,.casemode:not(.casedone) .stage .zoombtn,.casemode:not(.casedone) .stage .zhint{display:none}
.casemode:not(.casedone) .veil{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:min(460px,60vh);text-align:center;color:var(--muted);padding:24px}
.veil b{font:600 22px var(--f-display);color:var(--ink)}
.case .k{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct{margin:2px 0 6px;font-size:19px}
.ctag{margin:0 0 6px;font-size:13px;line-height:1.35;color:var(--muted);font-weight:600}
.co{margin:0 0 10px;font-size:15px;line-height:1.4}
.ch{margin:12px 0 6px;font-weight:700;font-size:14px}

.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.cmb,.ccb{font:inherit;font-size:14.5px;text-align:left;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.crow.on .cmb{border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.cq{font:600 12.5px var(--f-body);padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cres{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;padding:2px 11px 4px;font-size:14px}
.cres span{color:var(--muted)}
.cmeth{grid-column:1/-1;margin:0;padding:8px 11px;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:10px}
.ccb.picked{border-color:#006CA3}
.ccb.right{border-color:var(--good);background:#DFF3E7;color:#0F4A2C}
.cv{margin:8px 0 0;font-size:14.5px;line-height:1.35;padding:8px 11px;border-radius:10px;background:var(--surface-2)}
.cv.bad{border-left:4px solid var(--bad)}
.cv.warn{border-left:4px solid var(--on)}
.cdone{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface-2);font-size:15px;line-height:1.4}
.cdone p{margin:6px 0 0}
.cmin{font-size:14px;color:var(--muted)}
.case a{color:#006CA3}
.cnote{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.case .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:1000px){.casemode:not(.casedone) .stage{display:none}}

/* конструктор носителя (прототип) */
.kit{display:grid;gap:7px;margin-top:8px}
.kt{font-size:13px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{font:inherit;text-align:left;padding:6px 9px;min-height:54px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;align-content:start;gap:1px}
.slot small{font-size:11.5px;font-weight:600;line-height:1.2}
.slot b{font-size:13.5px;font-weight:600;line-height:1.2}
.slot.full{border-style:solid;border-color:#0090D0;background:#DDF0F9;color:#0B3B57}
.slot.over{border-color:#006CA3;box-shadow:0 0 0 2px #0090D055}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid #006CA3;background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);background:#fff;color:#0B3B57}
.kh{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}
.kh.bad{color:var(--bad);font-weight:600}

/* фон ядра на вкладке 4: в светлой теме как на схемах 1.3, в тёмной — по теме */
:root{--nucbg:#F3EEF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nucbg:#1B2130}}
:root[data-theme="dark"]{--nucbg:#1B2130}

/* справка по любой детали: подсветка при наведении */
.clickable .clickable:hover{filter:brightness(1.08) drop-shadow(0 0 2px rgba(0,108,163,.55))}
/* ===== v1.6: продвинутый уровень — режим «Модель по данным» и бегунок величины (s0_range.js) ===== */
.mbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:0 0 8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mbar .grp{display:grid;gap:4px}
.mbar .grp > span{font-size:12.5px;color:var(--muted);font-weight:600}
.mbar .mnote{flex:1 1 260px;font-size:13px}
.rx{display:grid;gap:2px}
.rx .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx label{font-weight:600;font-size:15px}
.rx output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.rxtrack{position:relative;height:30px}
.rxtrack input{position:relative;z-index:1;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.rxtrack input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.rxtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #006CA3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rxtrack input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #006CA3}
.rxtrack input:disabled{cursor:not-allowed}
.rxtrack input:disabled::-webkit-slider-thumb{border-color:var(--off)}
.rxh{position:absolute;top:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.55}
.rxticks{position:relative;height:30px;margin-top:-2px}
.rxt{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px;text-align:center}
.rxt i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
.rxt.on{color:var(--ink);font-weight:700}
.rxt:first-child{transform:translateX(-11px)} .rxt:last-child{transform:translateX(calc(-100% + 11px))}
.rxt:first-child i{left:11px} .rxt:last-child i{left:auto;right:7px}
.rxleg{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.rxleg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rxsw{display:inline-block;width:22px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 1.5px,transparent 1.5px 5px);opacity:.7}
.mcond{border-left:4px solid var(--tfeb)}
.mcond p{margin:0;font-size:14.5px}
.mcond b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tfeb);margin-bottom:2px}
.mlim{padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mlim summary{cursor:pointer;font-weight:600}
.mlim ol{margin:6px 0 2px;padding-left:20px;display:grid;gap:3px}
.mclin{margin:4px 0 0;font-size:13px;color:var(--muted)}
.read .vv{font-family:var(--f-body);font-size:14px;font-weight:600;text-align:right;max-width:58%}
@media (max-width:700px){.read .vv{text-align:left;max-width:none}}
.mstat{margin:0;padding:7px 132px 5px 12px;font-size:13px;line-height:1.35;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:700px){.mstat{padding-right:12px}}
.stage:has(.mstat) svg{max-height:none!important}
.mbar[hidden]{display:none}
.rxticks.two{height:44px}.rxt.r1{padding-top:22px}.rxt.r1 i{height:20px;width:2px;margin-left:-1px;border-radius:1px}
.side:has(.mcond){padding-bottom:46px}
.lgm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* рецензия v1.0, Р-01: схема закрыта до ответа в шаге «предскажите» */
.poehide .zwrap{position:relative}
.poehide .zwrap svg{filter:blur(12px);opacity:.12}
.poehide .zwrap::after{content:attr(data-hide);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.poemask [id^="ctrl"]{visibility:hidden}
/* семинар 7, v1.2: конструктор — деталь, которая не вынимается (граница с занятием, R49); в сценарии с hide/mask шкала этапов скрыта */
.slot.lock{cursor:default;border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.slots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.poehide .stage .tl,.poemask .stage .tl{visibility:hidden}
.side .totake.inline{position:static;box-shadow:none;margin:0;justify-self:end}
.tlc.halt{background:#FBEAE9;border-color:#C0392B;color:#B5403C}
/* v1.3: продвинутый уровень — недоступные положения переключателя, подсказки, итоговая карта */
.seg button.na,.seg button:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.poe .hint{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface)}
.poe #poeHint{margin-top:8px}
.amap{margin:18px 0;padding:16px 20px}.amap h3{margin:0 0 6px;font-size:17px}
.amapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.amapgrid svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.amapq{margin-top:12px}.amapq .opts{display:grid;gap:6px}.amapq .opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.amapq .opt.right{border-color:#2E9B57;background:#EEF8F1}.amapq .opt.wrongpick{border-color:#C0392B;background:#FBECEA}.amapq .opt .L{font-weight:700}
@media (max-width:700px){.amapgrid{grid-template-columns:minmax(0,1fr)}}

/* ---- семинар 8, интерактив (Claude Code, 12.11.2026): из семинара 7 v1.5 ---- */
/* v1.4: пошаговый ход продвинутых сцен — кнопки «◀ Шаг», «Шаг ▶», «Сначала»; ряд переносится, кружки этапов — на всю ширину */
.tlrow:has(.tlstep){flex-wrap:wrap}
.tlstep{white-space:nowrap;padding:6px 10px;font-size:14px}
.tlrow:has(.tlstep) .tlr{min-width:80px}
.tlrow:has(.tlstep) .tlchips{flex-wrap:wrap}
.tlrow:has(.tlstep) .tlplay{min-width:0}
@media (max-width:1000px){.tlrow:has(.tlstep) .tlchips{flex-basis:100%}}   /* рецензия v1.4, п. 9: на компьютере ряд шкалы в одну строку — схема крупнее */
.rdnote{margin:0 0 6px;color:var(--muted)}
details.optnote{margin:8px 0}
/* аудит Codex A19 (v1.4): пауза для прогноза — подпись и показания скрыты до запуска шкалы */
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{visibility:hidden}
.scene.predict .panel.cap::before,.scene.predict .panel.reads::before{content:attr(data-predict);display:block;font-weight:600;color:var(--ink)}
.scene.predict .panel.cap,.scene.predict .panel.reads{position:relative}
.scene.predict .panel.cap > *,.scene.predict .panel.reads > *{position:absolute;top:0;left:0;width:0;height:0;overflow:hidden}
/* рецензия v1.4, п. 7: до запуска шкала не показывает, где остановится процесс */
.scene.predict .tlc.no,.scene.predict .tlc.halt{background:var(--surface);border-color:var(--line);color:var(--ink);text-decoration:none}
.scene.predict .tlr{--stop:100% !important}
.scene.predict .tlc.no{cursor:pointer}   /* v1.2 (рецензия И-15) */

/* v1.2.1 (аудит S9-06, рецензия И-03): телефон — ключевые числа 2а/3а текущего кадра строкой под схемой, без прокрутки увеличенной схемы.
   Скрыта до ответа в сценарии (poehide), в «Найти причину» до решения и до запуска шкалы (predict); на широком экране не нужна. */
.mstrip{display:none}

  .mstrip b{font-variant-numeric:tabular-nums} .mstrip .mh{width:100%;font-size:12.5px;color:var(--muted,#5B6B7F)} }
.poehide .mstrip,.predict .mstrip,.casemode:not(.casedone) .mstrip{visibility:hidden}
/* v1.2.1 (аудит S10-07): подпись перехода над схемой после ответа */
.psw{margin:0 0 8px;padding:7px 12px;background:#FFF5E8;border-left:3px solid #E8912A;border-radius:0 8px 8px 0;font-size:14px;line-height:1.4;color:var(--ink,#15202B)}
.psw[hidden]{display:none}

lg_enz": "овалы с подписью — белки: аминоацил-тРНК-синтетаза (бирюзовый), факторы трансляции, шапероны; полупрозрачный с пунктиром — белка нет", "lg_fold": "свёрнутый домен белка — округлая фигура; несвёрнутая цепь — волнистая линия; оранжевые точки — гидрофобные участки на поверхности", "lg_ups": "красные кружки — цепь убиквитина; серый прямоугольник — протеасома", "lg_red": "красный крест ✕ — этап, на котором процесс остановился", "lg_click": "детали схемы открывают справку (появится в интерактивной версии): нажмите на кодон, тРНК, рибосому или белок", "lg_model": "Переключатели показывают предсказания учебной модели, а не доказательство: правила модели заданы заранее, их основания и границы — в «Объяснениях». Последовательности условные; полипептиды рассчитаны по стандартному генетическому коду; числа на схемах — условные.", "teacher_t": "Для преподавателя: как использовать страницу, упрощения модели и источники", "src_t_st": "Источники", "teacher_1": "Страница — интерактивный семинар для подготовки и повторения к коллоквиуму. Базовый уровень требуется на коллоквиуме и зачёте; продвинутый уровень — четыре добровольных системных исследования. В каждом сценарии сначала выбирают ответ, затем видят результат модели и разбор каждого неверного варианта.", "teacher_2": "Базовые модели качественные: одна условная мРНК, одна тРНК, одна рибосома, один белок. Полипептиды рассчитаны по стандартному ядерному генетическому коду; код митохондрий не используется. На продвинутом уровне все доли, времена и скорости — учебные допущения, а не измеренные значения; частоты ошибок увеличены, чтобы их было видно на десяти молекулах.", "teacher_3": "Уровни и источники. Базовый уровень сверен с учебником и обзорами, указанными в «Источниках»; продвинутый — с работами в полном тексте, тоже указанными в «Источниках».", "rd_model": "Показания учебной модели; числа условные.", "ms_head": "Ключевые показания", "ms_len": "аминокислот", "ms_changed": "новых остатков", "ms_frame": "рамка", "ms_shift": "сдвинута", "ms_kept": "сохранена", "ms_inv": "обратная задача", "ms_charged": "тРНК заряжена", "ms_pair": "спаривание", "ms_inc": "включено", "ms_P": "P-сайт", "ms_A": "A-сайт", "ms_chain": "аминокислот в цепи", "ms_fate": "продукт", "ms_act": "активность", "ms_subs": "замен всего", "ms_ile": "на местах изолейцина", "ms_other": "в других местах", "ms_init": "инициаций", "ms_on": "рибосом на мРНК", "ms_done": "полипептидов завершено", "ms_doneA": "завершено в клетке 1", "ms_doneB": "завершено в клетке 2", "ms_S": "синтезировано", "ms_F": "полноразмерных", "ms_R": "сохранилось", "ms_A2": "активно", "ms_actA": "активно в клетке 1", "ms_actB": "активно в клетке 2", "ms_RA": "белка в клетке 1", "ms_RB": "белка в клетке 2", "a_prob_t": "Исследование", "a_lim_t": "Чего модель не показывает", "a_new_t": "Новые данные и как это установили", "a_how_t": "Как это установили:", "hint_btn": "Подсказка {i} из {n}", "hint_n": "Подсказка {i}.", "amode_t": "Режим", "amode_e": "Исследование", "amode_m": "Модель", "amk_t": "Сцена", "amk_1": "Модель 1", "amk_2": "Модель 2", "amk_3": "Модель 3", "amode_note": "Переключатели показывают предсказания учебной модели, а не доказательство.", "m_hidden": "Показания откроются после ответа", "poe_hidden": "Схема откроется после ответа: сначала выберите вариант и нажмите «Показать на схеме».", "s1_ch": "Изменение в кодоне 3 (GAA)", "s1_ch_none": "нет", "s1_ch_syn": "GAA→GAG", "s1_ch_mis": "GAA→GUA", "s1_ch_non": "GAA→UAA", "s1_ch_ins1": "вставка C", "s1_ch_del1": "делеция A", "s1_ch_del3": "делеция GAA", "s1_ctrl_note": "Цитоплазма клетки человека; полипептид — после одного полного прохода рибосомы. Условная мРНК записана от 5′ к 3′, начиная со старт-кодона. Меняется только кодон 3: замена одного нуклеотида, вставка C после его первого нуклеотида, делеция его второго нуклеотида или всех трёх. Модель показывает изменённую последовательность мРНК, но не то, как изменение возникло: мутация ДНК, ошибка транскрипции и редактирование РНК — разные процессы. Полипептиды рассчитаны по стандартному генетическому коду.", "s1_pA": "А. мРНК (5′→3′): кодоны в рамке считывания", "s1_pB": "Б. Полипептид (N→C)", "s1_pC": "В. Что изменилось", "s1_lbl_norm": "норма", "s1_lbl_alt": "изменение", "s1_lbl_hidden": "откроется после ответа", "s1_lbl_start": "старт", "s1_lbl_dir": "рибосома читает мРНК 5′→3′; полипептид растёт от N- к C-концу", "s1_sum_none": "Изменений нет: {n} аминокислот от метионина до стоп-кодона UAA", "s1_sum_syn": "GAA → GAG: глутаминовая кислота → глутаминовая кислота\nпоследовательность полипептида та же", "s1_sum_mis": "GAA → GUA: глутаминовая кислота → валин\nодна аминокислота заменена, длина прежняя ({m})", "s1_sum_non": "GAA → UAA: смысловой кодон стал стоп-кодоном\nполипептид длиной {m} вместо {n} аминокислот", "s1_sum_ins1": "Вставка C: рамка сдвинута, новые кодоны ниже места вставки\nи стоп-кодон UGA; длина {m} вместо {n} аминокислот", "s1_sum_del1": "Делеция A: рамка сдвинута, новые кодоны ниже места делеции\nи стоп-кодон UAG; длина {m} вместо {n} аминокислот", "s1_sum_del3": "Делеция GAA: рамка сохранена, нет одной глутаминовой кислоты\nдлина {m} вместо {n} аминокислот, остальная последовательность прежняя", "s1_r_codon": "Кодон 3", "s1_v_codon": "{a} → {b}", "s1_v_codon_none": "без изменений", "s1_v_codon_ins1": "GCAA… (вставка C)", "s1_v_codon_del1": "GA… (делеция A)", "s1_v_codon_del3": "удалён целиком", "s1_r_len": "Длина полипептида", "s1_r_len_s": "аминокислот: норма → изменение", "s1_v_len": "{n} → {m}", "s1_r_changed": "Новые или заменённые остатки", "s1_r_changed_s": "в изменённом полипептиде", "s1_v_changed": "{n}", "s1_r_frame": "Рамка ниже изменения", "s1_v_frame_kept": "сохранена", "s1_v_frame_shift": "сдвинута", "s1_r_kind": "Тип изменения", "s1_v_kind_none": "нет", "s1_v_kind_syn": "синонимичная замена", "s1_v_kind_mis": "миссенс-замена", "s1_v_kind_non": "нонсенс-замена", "s1_v_kind_ins1": "вставка со сдвигом рамки", "s1_v_kind_del1": "делеция со сдвигом рамки", "s1_v_kind_del3": "делеция без сдвига рамки", "s1_cap_none": "Исходная мРНК: старт-кодон AUG задаёт рамку считывания, и девять смысловых кодонов читаются подряд по три до стоп-кодона UAA. Полипептид — девять аминокислот от N-конца (метионин) к C-концу.", "s1_cap_none_z": "Рамка считывания — разбиение кодирующей области мРНК на кодоны, начиная со старт-кодона: кодоны не перекрываются и читаются без пропусков.", "s1_cap_syn": "GAA → GAG: оба кодона кодируют глутаминовую кислоту, последовательность полипептида не изменилась — синонимичная замена.", "s1_cap_syn_z": "Код вырожден: большинство аминокислот кодируется несколькими кодонами, которые чаще всего различаются третьим нуклеотидом. Синонимичная замена не меняет аминокислоту, но может влиять на количество мРНК и белка (продвинутый уровень).", "s1_cap_mis": "GAA → GUA: в позиции 3 валин вместо глутаминовой кислоты, остальные аминокислоты и длина прежние — миссенс-замена.", "s1_cap_mis_z": "Замена первого или второго нуклеотида кодона обычно меняет аминокислоту. Как это скажется на белке, зависит от свойств аминокислоты и её места в белке; по одной схеме этого не определить.", "s1_cap_non": "GAA → UAA: кодон глутаминовой кислоты стал стоп-кодоном. Синтез заканчивается после второй аминокислоты — нонсенс-замена: полипептид из двух аминокислот вместо девяти.", "s1_cap_non_z": "Преждевременный стоп-кодон обрывает синтез полипептида. Что происходит с укороченным продуктом, рассмотрено в вопросе 4.", "s1_cap_ins1": "Вставка C после первого нуклеотида кодона 3: ниже этого места кодоны разбиты по-другому (GCA, AUG, GUU, AGG), и пятый кодон, считая от места вставки (седьмой от старт-кодона), — стоп-кодон UGA. Аминокислоты 3–6 новые, полипептид короче нормы.", "s1_cap_ins1_z": "Вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку считывания: меняются все кодоны ниже места изменения, и вскоре обычно встречается стоп-кодон.", "s1_cap_del1": "Делеция второго нуклеотида кодона 3: рамка сдвинута, и ниже кодоны читаются как GAU, GGU, затем стоп-кодон UAG. Полипептид Met–Ala–Asp–Gly.", "s1_cap_del1_z": "Делеция одного нуклеотида сдвигает рамку так же, как вставка: меняется разбиение на кодоны всей последовательности ниже места изменения.", "s1_cap_del3": "Делеция всего кодона 3 (GAA): рамка сохранена, в полипептиде нет глутаминовой кислоты, остальная последовательность прежняя — восемь аминокислот вместо девяти.", "s1_cap_del3_z": "Изменение длины на число нуклеотидов, кратное трём, рамку не сдвигает: добавляются или исчезают аминокислоты, а последовательность за местом изменения сохраняется.", "s1b_take": "Генетический код триплетный: кодон из трёх нуклеотидов мРНК соответствует одной аминокислоте или сигналу терминации. Рамку считывания задаёт старт-кодон AUG; кодоны читаются подряд, без пропусков и перекрываний, в направлении 5′→3′, а полипептид растёт от N- к C-концу. Из-за вырожденности кода часть замен синонимична; другие замены дают другую аминокислоту (миссенс-замена) или стоп-кодон (нонсенс-замена). Вставка или делеция числа нуклеотидов, не кратного трём, сдвигает рамку; кратного трём — меняет число аминокислот без сдвига рамки.", "code_t": "Таблица генетического кода", "code_note": "Стандартный код (кодоны мРНК, 5′→3′): строка — первый нуклеотид кодона, столбец — второй, в ячейке — третий. Красным — стоп-кодоны, зелёным — старт-кодон AUG (метионин).", "code_1": "1-й / 2-й", "code_stop": "стоп", "p1b_1_q": "Условия: условная мРНК (5′→3′) в цитоплазме клетки человека; полипептид — после одного полного прохода рибосомы. В кодоне 3 (GAA, глутаминовая кислота) третий нуклеотид заменён на G: GAA → GAG. Что произойдёт с полипептидом?", "p1b_1_o1": "Не изменится: GAG тоже кодирует глутаминовую кислоту", "p1b_1_o2": "В позиции 3 окажется другая аминокислота: изменился нуклеотид кодона", "p1b_1_o3": "Синтез оборвётся на кодоне 3: он стал стоп-кодоном", "p1b_1_e": "GAA и GAG — кодоны-синонимы глутаминовой кислоты. Синонимичная замена не меняет последовательность аминокислот.", "p1b_1_w2": "Кодоны GAA и GAG различаются только третьим нуклеотидом, и оба кодируют глутаминовую кислоту.", "p1b_1_w3": "GAG — не стоп-кодон: стоп-кодоны — UAA, UAG и UGA.", "p1b_2_q": "В кодоне 3 той же мРНК (GAA, глутаминовая кислота) первый нуклеотид заменён на U: GAA → UAA. Что произойдёт?", "p1b_2_o1": "Синтез закончится после второй аминокислоты", "p1b_2_o2": "В позиции 3 окажется другая аминокислота — тирозин", "p1b_2_o3": "Рамка сдвинется, все следующие аминокислоты изменятся", "p1b_2_e": "UAA — один из трёх стоп-кодонов. Когда он оказывается в A-сайте, полипептид освобождается: получается Met–Ala.", "p1b_2_w2": "Тирозин кодируют UAU и UAC; UAA — стоп-кодон.", "p1b_2_w3": "Замена одного нуклеотида не меняет длины мРНК и рамку не сдвигает.", "p1b_3_q": "В той же мРНК после первого нуклеотида кодона 3 (GAA) вставлен один нуклеотид C. Что произойдёт с аминокислотами ниже этого места?", "p1b_3_o1": "Все изменятся, и вскоре встретится стоп-кодон", "p1b_3_o2": "Изменится только аминокислота в позиции 3", "p1b_3_o3": "Добавится одна аминокислота, остальные прежние", "p1b_3_e": "Лишний нуклеотид сдвигает рамку — границы всех следующих кодонов: GCA, AUG, GUU, AGG, затем стоп-кодон UGA. Полипептид Met–Ala–Ala–Met–Val–Arg короче нормы, его C-конец другой.", "p1b_3_w2": "Сдвигаются границы не одного, а всех кодонов после вставки.", "p1b_3_w3": "Одна аминокислота добавилась бы при вставке трёх нуклеотидов между кодонами; одна вставка сдвигает рамку.", "p1b_4_q": "Из той же мРНК удалены все три нуклеотида кодона 3 (GAA). Что станет с полипептидом?", "p1b_4_o1": "Не будет одной аминокислоты, остальные прежние", "p1b_4_o2": "Рамка сдвинется, все следующие аминокислоты изменятся", "p1b_4_o3": "Полипептид не будет синтезирован совсем", "p1b_4_e": "Делеция трёх нуклеотидов, совпадающая с кодоном, удаляет одну аминокислоту — глутаминовую кислоту; рамка ниже сохраняется, и синтез идёт до прежнего стоп-кодона.", "p1b_4_w2": "Число удалённых нуклеотидов кратно трём, поэтому разбиение следующих кодонов не меняется.", "p1b_4_w3": "Старт-кодон и рамка сохранены, поэтому полипептид синтезируется — без одной аминокислоты.", "p1b_5_q": "На схеме — замена GAA → GUA. Почему эта замена меняет аминокислоту, а GAA → GAG не меняла?", "p1b_5_o1": "Синонимы обычно различаются третьим нуклеотидом, а здесь заменён второй", "p1b_5_o2": "Второй нуклеотид кодона рибосома читает внимательнее, чем третий", "p1b_5_o3": "Любая замена на U меняет аминокислоту кодона", "p1b_5_e": "Аминокислоту определяет кодон по таблице кода. Кодоны глутаминовой кислоты — GAA и GAG; GUA кодирует валин. Кодоны-синонимы обычно различаются третьим нуклеотидом, а кодон с другим первым или вторым нуклеотидом чаще всего кодирует другую аминокислоту. Поэтому последствия замены зависят от её позиции в кодоне — но не всегда: у некоторых аминокислот синонимы различаются и первым нуклеотидом (продвинутый уровень).", "p1b_5_w2": "Строже проверяется спаривание первых двух позиций кодона с антикодоном (вопрос 2), но какую аминокислоту кодирует кодон, определяет таблица кода.", "p1b_5_w3": "Замена GAA → GAU (тоже на U, но в третьей позиции) дала бы аспарагиновую кислоту, а GAA → UAA — стоп-кодон: результат определяет таблица кода, а не новый нуклеотид.", "p1b_6_q": "В каком направлении рибосома считывает мРНК и какой конец полипептида синтезируется первым?", "p1b_6_o1": "От 5′- к 3′-концу; первым — N-конец", "p1b_6_o2": "От 3′- к 5′-концу; первым — C-конец", "p1b_6_o3": "От 5′- к 3′-концу; первым — C-конец", "p1b_6_e": "Старт-кодон расположен ближе к 5′-концу мРНК, и кодоны считываются к 3′-концу. Каждая следующая аминокислота присоединяется к C-концу растущей цепи, поэтому метионин старт-кодона оказывается на N-конце.", "p1b_6_w2": "Рибосома движется по мРНК к её 3′-концу; первой включается аминокислота старт-кодона.", "p1b_6_w3": "Первая аминокислота (метионин) остаётся на N-конце: новые аминокислоты присоединяются к C-концу цепи.", "s2_syn": "Изолейцил-тРНК-синтетаза", "s2_atp": "АТФ", "s2_on": "есть", "s2_off": "нет", "s2_cod": "Кодон мРНК в A-сайте", "s2_cod_AUC": "AUC", "s2_cod_AUU": "AUU", "s2_cod_GUC": "GUC", "s2_ctrl_note": "Цитоплазма клетки человека. Одна условная тРНК изолейцина с антикодоном 5′-GAU-3′ (на схеме записан 3′→5′ над кодоном). Изолейцил-тРНК-синтетазу и АТФ можно убрать; синтетаза валина и тРНК валина в модели есть всегда. Какой аминокислоте соответствует кодон — по таблице генетического кода. Модель показывает правила, а не скорость реакций.", "s2_pA": "А. Аминоацилирование: синтетаза соединяет изолейцин с тРНК", "s2_pB": "Б. Декодирование: антикодон и кодон в A-сайте рибосомы", "s2_pC": "В. Аминокислота, включённая в полипептид на этом кодоне", "s2_lbl_syn": "изолейцил-тРНК-синтетаза", "s2_lbl_atp": "АТФ", "s2_lbl_step_ok": "1) Ile + АТФ → Ile-АМФ + PPᵢ\n2) Ile-АМФ + тРНК → Ile-тРНК + АМФ", "s2_lbl_step_nosyn": "синтетазы нет:\nизолейцин к тРНК не присоединяется", "s2_lbl_step_noatp": "нет АТФ:\nизолейцин не активируется", "s2_lbl_trna_ile": "тРНК изолейцина", "s2_lbl_uncharged": "3′-конец свободен", "s2_lbl_acc_far": "антикодон и 3′-конец —\nна противоположных\nконцах тРНК", "s2_lbl_codon": "кодон {c}", "s2_lbl_ac_ile": "антикодон тРНК Ile", "s2_lbl_ac_val": "антикодон тРНК Val", "s2_lbl_wobble": "в третьей позиции кодона —\nпара G·U (качание)", "s2_lbl_wc": "три канонические пары", "s2_lbl_inc_none": "аминокислота не доставлена: на этом кодоне синтез не продолжается", "s2_lbl_inc_Ile": "изолейцин: его принесла тРНК изолейцина", "s2_lbl_inc_Val": "валин: кодон GUC декодирует тРНК валина", "s2_r_act": "Изолейцин активирован", "s2_r_act_s": "образован изолейциладенилат", "s2_r_charged": "тРНК изолейцина", "s2_v_charged": "несёт изолейцин", "s2_v_free": "без аминокислоты", "s2_r_pair": "Спаривание с тРНК изолейцина", "s2_r_pair_s": "кодон {c}", "s2_v_pair_wc": "три канонические пары", "s2_v_pair_wb": "допускается: G·U в третьей позиции", "s2_v_pair_val": "не допускается в первой позиции", "s2_r_inc": "Включено в полипептид", "s2_v_inc_Ile": "изолейцин", "s2_v_inc_Val": "валин", "s2_v_inc_none": "ничего", "s2_cap_ok_wc": "Синтетаза в два этапа соединила изолейцин с 3′-концом тРНК изолейцина. Антикодон этой тРНК образует с кодоном AUC три канонические пары, и в полипептид включается изолейцин.", "s2_cap_ok_wc_z": "Соответствие кодона и аминокислоты устанавливается в два этапа: синтетаза соединяет аминокислоту со «своей» тРНК, рибосома проверяет спаривание антикодона с кодоном.", "s2_cap_ok_wb": "Кодон AUU тоже кодирует изолейцин. В третьей позиции кодона U спаривается с G первой позиции антикодона — неканоническая пара G·U допускается, и та же тРНК приносит изолейцин.", "s2_cap_ok_wb_z": "Качание: строгое спаривание требуется в первых двух позициях кодона, а в третьей допускаются неканонические пары. Поэтому одна тРНК может узнавать несколько кодонов-синонимов, и видов тРНК меньше, чем смысловых кодонов.", "s2_cap_ok_val": "Кодон GUC: в первой позиции против G стоит U антикодона тРНК изолейцина — в этой позиции неканоническая пара не допускается, и тРНК изолейцина не удерживается. Кодон декодирует тРНК валина, и включается валин.", "s2_cap_ok_val_z": "Отбор тРНК на рибосоме идёт по спариванию антикодона с кодоном, строже всего — в первых двух позициях. Кодон валина не зависит от синтетазы изолейцина.", "s2_cap_nosyn_ile": "Без изолейцил-тРНК-синтетазы тРНК изолейцина остаётся без аминокислоты: её антикодон по-прежнему соответствует кодону, но доставлять ей нечего, и на кодоне изолейцина синтез не продолжается.", "s2_cap_nosyn_ile_z": "Для каждой аминокислоты в цитозоле клеток человека есть своя синтетаза; она соединяет аминокислоту со всеми тРНК этой аминокислоты. Без неё кодоны этой аминокислоты не декодируются.", "s2_cap_noatp_ile": "Без АТФ изолейцин не активируется (не образуется изолейциладенилат) и не присоединяется к тРНК. Аминоацил-тРНК нет — синтез на кодоне изолейцина не продолжается.", "s2_cap_noatp_ile_z": "Аминоацилирование требует энергии АТФ: она запасается в сложноэфирной связи аминокислоты с тРНК и затем используется при образовании пептидной связи.", "s2_cap_noatp_val": "Без АТФ не заряжается ни одна тРНК, в том числе тРНК валина: на кодоне GUC синтез тоже не продолжается.", "s2_cap_noatp_val_z": "АТФ нужен всем аминоацил-тРНК-синтетазам, а сама синтетаза специфична к одной аминокислоте.", "s2b_take": "тРНК — адаптер: на одном конце L-образной молекулы находится антикодон, на другом — 3′-конец CCA, к которому присоединяется аминокислота. Аминоацил-тРНК-синтетаза в два этапа (через аминоациладенилат, с затратой АТФ) соединяет аминокислоту со «своими» тРНК, узнавая и аминокислоту, и тРНК; корректирующая активность синтетазы удаляет ошибочно присоединённые аминокислоты. На рибосоме проверяется только спаривание антикодона с кодоном (антипараллельное, строгое в первых двух позициях кодона), а не сама аминокислота. Поэтому соответствие кодона и аминокислоты закрепляется при аминоацилировании тРНК.", "p2b_1_q": "Условия: всё есть, кодон AUC. Из клетки убрана изолейцил-тРНК-синтетаза (АТФ и синтетаза валина есть). Что произойдёт на кодоне AUC?", "p2b_1_o1": "тРНК изолейцина останется без аминокислоты", "p2b_1_o2": "Изолейцин присоединит синтетаза валина", "p2b_1_o3": "тРНК изолейцина перестанет спариваться с AUC", "p2b_1_e": "Присоединить изолейцин к тРНК может только изолейцил-тРНК-синтетаза. Антикодон тРНК не изменился, но доставлять ей нечего.", "p2b_1_w2": "Каждая синтетаза специфична к своей аминокислоте и своим тРНК.", "p2b_1_w3": "Спаривание задаёт антикодон, а не присоединённая аминокислота; антикодон прежний.", "p2b_2_q": "Синтетаза изолейцина и АТФ есть; в A-сайте кодон AUU (не AUC). Какая аминокислота будет включена?", "p2b_2_o1": "Изолейцин: в третьей позиции допускается пара G·U", "p2b_2_o2": "Никакая: антикодон тРНК изолейцина с AUU не спаривается", "p2b_2_o3": "Другая аминокислота: кодон ведь изменился", "p2b_2_e": "AUU и AUC — синонимы изолейцина. G первой позиции антикодона может спариваться и с C, и с U третьей позиции кодона (качание).", "p2b_2_w2": "В третьей позиции кодона неканоническая пара G·U допускается.", "p2b_2_w3": "Изменилась третья позиция, а кодоны AUU и AUC кодируют одну аминокислоту.", "p2b_3_q": "Синтетаза изолейцина и АТФ есть; в A-сайте кодон GUC. Что произойдёт?", "p2b_3_o1": "тРНК изолейцина не удержится, включится валин", "p2b_3_o2": "Включится изолейцин: спариваются две позиции из трёх", "p2b_3_o3": "Синтез остановится: для кодона GUC нет тРНК", "p2b_3_e": "В первой позиции кодона G стоит против U антикодона; в этой позиции декодирующий центр рибосомы допускает только канонические пары. GUC кодирует валин, и его декодирует тРНК валина.", "p2b_3_w2": "Строго проверяются первые две позиции кодона; несовпадение в первой отбраковывает тРНК.", "p2b_3_w3": "GUC — смысловой кодон валина; для него в клетке есть тРНК.", "p2b_4_q": "Изолейцил-тРНК-синтетазы нет, в A-сайте кодон GUC. Что будет включено?", "p2b_4_o1": "Валин: его тРНК заряжает своя синтетаза", "p2b_4_o2": "Ничего: без синтетазы синтез остановится", "p2b_4_o3": "Изолейцин: тРНК валина его тоже несёт", "p2b_4_e": "Отсутствие одной синтетазы нарушает декодирование только кодонов её аминокислоты. Валил-тРНК-синтетаза работает.", "p2b_4_w2": "В цитозоле клеток человека для каждой аминокислоты есть своя синтетаза; убрана только синтетаза изолейцина.", "p2b_4_w3": "Кодон GUC кодирует валин; тРНК валина несёт валин, а не изолейцин.", "p2b_5_q": "Что обеспечивает, что на кодоне AUC в полипептид встаёт именно изолейцин?", "p2b_5_o1": "Синтетаза зарядила изолейцином тРНК для AUC", "p2b_5_o2": "Рибосома узнаёт изолейцин по форме и сверяет с кодоном", "p2b_5_o3": "Изолейцин сам спаривается с нуклеотидами кодона", "p2b_5_e": "Соответствие закрепляется двумя этапами: аминоацилированием (синтетаза связывает аминокислоту с нужной тРНК) и декодированием (рибосома проверяет пару кодон — антикодон). Аминокислоту рибосома не проверяет.", "p2b_5_w2": "Аминокислота находится на другом конце тРНК, далеко от кодона; рибосома сверяет только антикодон с кодоном.", "p2b_5_w3": "Между аминокислотой и нуклеотидами нет прямого химического соответствия: посредник — тРНК.", "s3_st": "Этап", "s3_st_1": "1 инициация", "s3_st_2": "2 вход в A", "s3_st_3": "3 пептидная связь", "s3_st_4": "4 транслокация", "s3_st_5": "5 стоп в A", "s3_st_6": "6 терминация", "s3_comp": "Детали", "s3_comp_all": "все есть", "s3_comp_noeef2": "нет eEF2", "s3_comp_noerf1": "нет eRF1", "s3_ctrl_note": "Цитоплазма клетки человека. мРНК: 5′…AUG CAC UGG GAA UGA…3′ (метионин, гистидин, триптофан, глутаминовая кислота, стоп-кодон). Этапы — моменты одного прохода рибосомы в учебной последовательности: 1 — рибосома собрана на старт-кодоне; 2–4 — первый цикл элонгации; 5 — ещё два таких цикла пройдены; 6 — терминация. eEF2 — фактор транслокации, eRF1 — фактор терминации; их можно убрать.", "s3_pA": "А. Рибосома 80S на мРНК: участки E, P и A", "s3_pB": "Б. Что происходит на этом этапе", "s3_lbl_large": "большая субчастица (60S)", "s3_lbl_small": "малая субчастица (40S)", "s3_lbl_released": "полипептид освобождён", "s3_lbl_noeef2": "нет eEF2: в модели транслокации нет", "s3_lbl_noerf1": "нет eRF1: в модели стоп-кодон не узнан", "s3_lbl_shift": "сдвиг на один кодон к 3′-концу", "s3_ev_s1": "Инициация: малая субчастица с инициаторной Met-тРНК нашла\nстарт-кодон AUG, присоединилась большая субчастица.\nИнициаторная тРНК — в P-сайте, A-сайт свободен.", "s3_ev_s2": "Вход аминоацил-тРНК: в свободный A-сайт вошла His-тРНК,\nеё антикодон спарился с кодоном CAC.\nМетионин — на тРНК в P-сайте.", "s3_ev_s3": "Пептидная связь: метионин перенесён с тРНК в P-сайте\nна аминогруппу гистидина тРНК в A-сайте. Цепь Met–His —\nна тРНК в A-сайте; тРНК в P-сайте без аминокислоты.", "s3_ev_s4": "Транслокация: рибосома сдвинулась на три нуклеотида к 3′-концу.\nтРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте\n(затем покинет рибосому); A-сайт свободен для кодона UGG.", "s3_ev_s5": "Ещё два цикла элонгации добавили триптофан\nи глутаминовую кислоту. В A-сайте стоп-кодон UGA:\nтРНК, спаривающейся с ним, нет.", "s3_ev_s6": "Терминация: eRF1 занял A-сайт; связь цепи с тРНК\nгидролизована, полипептид Met–His–Trp–Glu освобождён.\nЗатем субчастицы рибосомы разойдутся.", "s3_ev_transloc": "В модели без eEF2 рибосома за время наблюдения не сдвигается:\nцепь Met–His остаётся на тРНК в A-сайте, кодон UGG\nне попадает в A-сайт, и цикл элонгации не повторяется.", "s3_ev_term": "В модели без eRF1 стоп-кодон за время наблюдения\nне узнаётся: цепь Met–His–Trp–Glu остаётся связанной\nс тРНК в P-сайте, полипептид не освобождается.", "s3_r_E": "E-сайт", "s3_r_P": "P-сайт", "s3_r_A": "A-сайт", "s3_v_raw": "{s}", "s3_v_empty": "свободен", "s3_v_trna_aa": "{i} {a}-тРНК", "s3_v_trna_chain": "тРНК {a} с цепью из {n} аминокислот", "s3_v_trna_free": "{i} тРНК {a} без аминокислоты", "s3_v_ini": "инициаторная", "s3_v_erf1": "фактор терминации eRF1", "s3_r_chain": "Полипептид", "s3_r_chain_s": "где находится цепь", "s3_v_chain_P": "{n} — на тРНК в P-сайте", "s3_v_chain_A": "{n} — на тРНК в A-сайте", "s3_v_chain_free": "{n} — освобождён", "s3_r_codon": "Кодон в P-сайте", "s3_r_codon_s": "номер кодона от старт-кодона", "s3_v_codon": "{k}: {c}", "s3_cap_s1": "Рибосома собрана на старт-кодоне: инициаторная тРНК с метионином спарена с AUG в P-сайте, A-сайт свободен и находится над следующим кодоном.", "s3_cap_s1_z": "Инициаторная тРНК — единственная, которая входит в рибосому через P-сайт; все остальные аминоацил-тРНК, в том числе с метионином для внутренних кодонов AUG, входят в A-сайт.", "s3_cap_s2": "Аминоацил-тРНК вошла в A-сайт: её доставляет фактор элонгации eEF1A вместе с ГТФ; удерживается только та тРНК, антикодон которой спарен с кодоном.", "s3_cap_s2_z": "На этом этапе рибосома проверяет спаривание антикодона с кодоном — дважды, до и после гидролиза ГТФ; неправильно спаренная тРНК, как правило, уходит до образования пептидной связи.", "s3_cap_s3": "Пептидная связь: растущая цепь перенесена с тРНК в P-сайте на аминокислоту тРНК в A-сайте. Цепь удлинилась на один остаток у C-конца.", "s3_cap_s3_z": "Реакцию катализирует пептидилтрансферазный центр большой субчастицы, образованный рРНК (рибосома — рибозим). Поэтому полипептид растёт от N- к C-концу.", "s3_cap_s4": "Транслокация: рибосома продвинулась на один кодон к 3′-концу мРНК; тРНК из A-сайта перешла в P-сайт, из P-сайта — в E-сайт.", "s3_cap_s4_z": "Сдвиг ровно на три нуклеотида сохраняет рамку считывания. Транслокацию обеспечивает фактор элонгации eEF2 за счёт гидролиза ГТФ.", "s3_cap_s5": "После ещё двух циклов цепь из четырёх аминокислот — на тРНК в P-сайте, а в A-сайте стоп-кодон UGA. Ни одна тРНК не спаривается со стоп-кодоном.", "s3_cap_s5_z": "Цикл элонгации одинаков для каждого кодона: вход аминоацил-тРНК, пептидная связь, транслокация.", "s3_cap_s6": "Стоп-кодон в A-сайте узнаёт белковый фактор терминации eRF1. Связь цепи с тРНК гидролизуется (акцептором становится вода), и полипептид освобождается.", "s3_cap_s6_z": "eRF1 узнаёт все три стоп-кодона; по форме он напоминает тРНК. После терминации субчастицы рибосомы расходятся и используются снова.", "s3_cap_transloc": "В модели без фактора транслокации eEF2 за время наблюдения цикл не продолжается после образования пептидной связи: цепь — на тРНК в A-сайте, следующий кодон в A-сайт не попадает.", "s3_cap_transloc_z": "Пока A-сайт занят, следующая аминоацил-тРНК войти не может: каждый шаг цикла зависит от завершения предыдущего. Остановка — допущение модели: в пробирке без факторов элонгации синтез возможен, но очень медленный, неэффективный и неточный.", "s3_cap_term": "В модели без фактора терминации eRF1 стоп-кодон за время наблюдения остаётся в A-сайте, а полный полипептид — связанным с тРНК в P-сайте: он не освобождается, и рибосома не высвобождается.", "s3_cap_term_z": "Нормальную терминацию запускает белковый фактор, а не тРНК. В клетках человека при нехватке eRF1 усиливается прочитывание стоп-кодона (англ. readthrough): тРНК с почти комплементарным антикодоном встраивает аминокислоту, и цепь удлиняется. Модель показывает только задержку освобождения полипептида.", "s3b_take": "Рибосома 80S состоит из малой (40S) и большой (60S) субчастиц; в ней три участка связывания тРНК — E, P и A (слева направо при записи мРНК 5′→3′; в отечественных учебниках — Е-, П- и А-сайты). Инициаторная Met-тРНК в начале синтеза находится в P-сайте напротив старт-кодона AUG. В каждом цикле элонгации аминоацил-тРНК входит в A-сайт, растущая цепь переносится с тРНК в P-сайте на аминокислоту тРНК в A-сайте (пептидная связь образуется в пептидилтрансферазном центре рРНК большой субчастицы), затем рибосома сдвигается на один кодон к 3′-концу, и тРНК переходят из A в P и из P в E. Стоп-кодон узнаёт белковый фактор терминации, а не тРНК; после гидролиза связи с тРНК полипептид освобождается.", "p3b_1_q": "Условия: мРНК 5′…AUG CAC UGG GAA UGA…3′. Рибосома только что собрана на старт-кодоне. Где находится инициаторная тРНК с метионином?", "p3b_1_o1": "В P-сайте напротив AUG; A-сайт свободен", "p3b_1_o2": "В A-сайте напротив AUG, как и все аминоацил-тРНК", "p3b_1_o3": "В E-сайте", "p3b_1_e": "Инициаторная тРНК связывается с малой субчастицей ещё до её посадки на мРНК и оказывается в P-сайте, напротив старт-кодона. A-сайт остаётся свободным для первой элонгаторной аминоацил-тРНК.", "p3b_1_w2": "Через A-сайт входят все аминоацил-тРНК, кроме инициаторной; её узнаёт фактор инициации eIF2, а не фактор элонгации.", "p3b_1_w3": "Из E-сайта тРНК без аминокислоты покидают рибосому; в начале синтеза он пуст.", "p3b_2_q": "His-тРНК вошла в A-сайт; образуется пептидная связь. Где окажется цепь Met–His?", "p3b_2_o1": "На тРНК в A-сайте; тРНК в P-сайте останется без аминокислоты", "p3b_2_o2": "На тРНК в P-сайте: гистидин перейдёт к метионину", "p3b_2_o3": "Цепь сразу выйдет из рибосомы", "p3b_2_e": "Аминогруппа аминокислоты в A-сайте атакует связь растущей цепи с тРНК в P-сайте: цепь переносится на тРНК в A-сайте и удлиняется на один остаток у C-конца.", "p3b_2_w2": "Переносится растущая цепь — с тРНК в P-сайте на аминокислоту в A-сайте, а не наоборот.", "p3b_2_w3": "Пока нет терминации, цепь всегда связана с тРНК.", "p3b_3_q": "После образования пептидной связи происходит транслокация. Где окажутся тРНК?", "p3b_3_o1": "тРНК с цепью — в P-сайте, тРНК без аминокислоты — в E-сайте, A-сайт свободен", "p3b_3_o2": "тРНК с цепью останется в A-сайте, рибосома сдвинется к 5′-концу", "p3b_3_o3": "Обе тРНК покинут рибосому", "p3b_3_e": "Рибосома сдвигается на один кодон к 3′-концу мРНК; относительно рибосомы тРНК переходят A → P и P → E, и над A-сайтом оказывается следующий кодон.", "p3b_3_w2": "Рибосома движется к 3′-концу мРНК, и тРНК с цепью переходит в P-сайт.", "p3b_3_w3": "Рибосому покидает только тРНК без аминокислоты из E-сайта; тРНК с цепью остаётся.", "p3b_4_q": "В клетке нет фактора транслокации eEF2. Пептидная связь между метионином и гистидином образовалась. Что покажет учебная модель за время наблюдения?", "p3b_4_o1": "Цепь Met–His останется на тРНК в A-сайте", "p3b_4_o2": "Следующая аминоацил-тРНК войдёт в E-сайт", "p3b_4_o3": "Рибосома распадётся, и цепь Met–His освободится", "p3b_4_e": "В модели без eEF2 транслокация за время наблюдения не происходит: A-сайт остаётся занятым тРНК с цепью, и новая аминоацил-тРНК войти не может. Без факторов элонгации синтез в пробирке возможен, но идёт очень медленно и неточно — модель этого не показывает.", "p3b_4_w2": "Аминоацил-тРНК входят только в A-сайт; E-сайт — участок выхода.", "p3b_4_w3": "Освобождение цепи — терминация: для неё нужен стоп-кодон в A-сайте и фактор терминации.", "p3b_5_q": "В A-сайте стоп-кодон UGA, но в клетке нет фактора терминации eRF1. Что покажет учебная модель за время наблюдения?", "p3b_5_o1": "Полипептид останется на тРНК в P-сайте", "p3b_5_o2": "Стоп-кодон узнает обычная тРНК, и полипептид освободится", "p3b_5_o3": "Полипептид освободится: его отщепит фактор eEF2", "p3b_5_e": "В модели без eRF1 связь цепи с тРНК за время наблюдения не гидролизуется — полипептид остаётся в P-сайте. В клетке при нехватке eRF1 возрастает и прочитывание стоп-кодона: цепь удлиняется; этот исход модель не показывает.", "p3b_5_w2": "В норме стоп-кодоны не узнаёт ни одна тРНК; редкое прочитывание стоп-кодона идёт за счёт тРНК с почти комплементарным антикодоном, и цепь при этом удлиняется, а не освобождается.", "p3b_5_w3": "eEF2 обеспечивает транслокацию, а не гидролиз связи цепи с тРНК; освобождение полипептида запускает фактор терминации.", "p3b_6_q": "Почему полипептид растёт от N- к C-концу?", "p3b_6_o1": "Новая аминокислота присоединяется к C-концу цепи", "p3b_6_o2": "Рибосома читает мРНК от 3′- к 5′-концу", "p3b_6_o3": "Аминокислоты присоединяются к обоим концам цепи", "p3b_6_e": "При образовании пептидной связи карбоксильный конец растущей цепи соединяется с аминогруппой аминокислоты в A-сайте. Первая аминокислота (метионин) остаётся на N-конце.", "p3b_6_w2": "мРНК читается от 5′ к 3′; направление роста цепи следует из химии пептидной связи.", "p3b_6_w3": "Удлиняется только C-конец цепи, связанный с тРНК.", "s4_stopc": "Стоп-кодон", "s4_stop_norm": "обычный (421)", "s4_stop_d1": "кодон 120", "s4_stop_link": "кодон 195", "s4_ups": "Убиквитин-протеасомная система", "s4_ups_on": "работает", "s4_ups_off": "подавлена (E3 действует)", "s4_ctrl_note": "Цитозоль клетки человека. Условный белок из 420 аминокислот: домен 1 (остатки 1–180) связывает партнёра, домен 2 (201–420) катализирует реакцию; между ними — соединительный участок. Преждевременный стоп-кодон стоит в кодоне 120 (внутри домена 1) или 195 (после домена 1). Панель В — состояние продукта через несколько часов после синтеза (время условное). В модели рассматривается только белок; что происходит с мРНК, модель не показывает.", "s4_pA": "А. Кодирующая область мРНК: домены белка и стоп-кодон", "s4_pB": "Б. Продукт сразу после терминации", "s4_pC": "В. Продукт в клетке через несколько часов", "s4_lbl_d1": "домен 1", "s4_lbl_d2": "домен 2", "s4_lbl_stop": "стоп-кодон {k}", "s4_lbl_normstop": "обычный стоп-кодон — после кодона 420", "s4_lbl_cotrans": "домен 1 сворачивается ещё во время синтеза домена 2", "s4_lbl_d1s": "1", "s4_lbl_d2s": "2", "s4_lbl_len": "{n} аминокислот", "s4_lbl_prod_norm": "оба домена свёрнуты", "s4_lbl_prod_d1": "ни один домен не свёрнут;\nгидрофобные участки снаружи", "s4_lbl_prod_link": "домен 1 свёрнут;\nдомена 2 нет", "s4_lbl_ub": "полиубиквитин", "s4_lbl_prot": "протеасома", "s4_lbl_pept": "короткие пептиды", "s4_lbl_noups": "протеасома подавлена (E3 действует)", "s4_lbl_accum": "помеченные убиквитином цепи накапливаются и могут образовывать агрегаты", "s4_lbl_act_full": "связывание партнёра — есть\nкатализ — есть", "s4_lbl_act_partial": "связывание партнёра — есть\nкатализ — нет", "s4_r_len": "Длина продукта", "s4_r_len_s": "аминокислот", "s4_v_len": "{n}", "s4_r_dom": "Свёрнутые домены", "s4_v_dom_0": "нет", "s4_v_dom_1": "домен 1", "s4_v_dom_2": "оба", "s4_r_exp": "Гидрофобные участки снаружи", "s4_r_exp_s": "признак, по которому узнаётся несвёрнутая цепь", "s4_r_fate": "Что происходит с продуктом", "s4_v_fate_stays": "сохраняется", "s4_v_fate_degraded": "разрушается в протеасоме", "s4_v_fate_accum": "накапливается", "s4_r_act": "Функции белка", "s4_v_act_full": "обе", "s4_v_act_partial": "только связывание", "s4_v_act_none": "нет", "s4_cap_norm": "Обычный стоп-кодон: синтезированы 420 аминокислот. Домен 1 свернулся, пока синтезировался домен 2; после терминации свернулся домен 2. Белок выполняет обе функции.", "s4_cap_norm_z": "Сворачивание начинается во время трансляции: часть цепи, вышедшая из рибосомы, может свернуться раньше, чем синтезирован C-конец. Шапероны, связанные с рибосомой, помогают этому.", "s4_cap_link": "Стоп-кодон в кодоне 195: полипептид из 194 аминокислот освобождается так же, как при обычной терминации. Домен 1 уже свернулся, домена 2 нет: продукт укорочен, но устойчив и сохраняет связывание партнёра без катализа.", "s4_cap_link_z": "Укороченный продукт не обязательно разрушается и не обязательно утрачивает все функции: это зависит от того, какие части белка успели синтезироваться и свернуться.", "s4_cap_d1_on": "Стоп-кодон в кодоне 120: освобождена цепь из 119 аминокислот — часть домена 1. Она не может свернуться, гидрофобные участки остаются снаружи. Их связывают шапероны; когда свернуть цепь не удаётся, убиквитинлигаза присоединяет к ней цепь убиквитина, и продукт разрушает протеасома.", "s4_cap_d1_on_z": "Системы контроля качества узнают белок не по длине, а по признакам неправильного сворачивания — например, по открытым гидрофобным участкам.", "s4_cap_d1_off": "Тот же укороченный продукт при подавленной протеасоме: убиквитинлигаза присоединяет к несвёрнутым цепям полиубиквитин, но протеасома их не разрушает — помеченные цепи накапливаются и могут слипаться в агрегаты.", "s4_cap_d1_off_z": "Количество белка в клетке определяется и синтезом, и удалением: при нарушенном удалении накапливается и тот продукт, который функции не выполняет.", "s4_cap_d1_noe3": "Тот же укороченный продукт без убиквитинлигазы E3: цепь не получает метку убиквитина, протеасома её не узнаёт — несвёрнутые цепи без метки накапливаются и могут слипаться в агрегаты.", "s4_cap_d1_noe3_z": "Протеасома разрушает белки, помеченные полиубиквитином; метку присоединяет убиквитинлигаза. Без неё нарушен первый шаг пути, без протеасомы — последний; итог в модели один — накопление, но цепи различаются меткой.", "s4_lbl_noe3": "нет убиквитинлигазы E3", "s4_lbl_accum_e3": "цепи без метки убиквитина накапливаются и могут образовывать агрегаты", "s4b_take": "Синтез заканчивается, когда стоп-кодон оказывается в A-сайте: фактор терминации освобождает полипептид, и при преждевременном стоп-кодоне так же освобождается укороченный продукт. Сворачивание начинается ещё во время трансляции и идёт при участии шаперонов; после синтеза белок может получить посттрансляционные модификации. Цепь, которая не свернулась и держит гидрофобные участки снаружи, связывают шапероны, а если сворачивание не удаётся — убиквитинлигаза метит её цепью убиквитина, и протеасома её разрушает. Укороченный продукт не обязательно разрушается и не обязательно неактивен: важно, какие домены успели синтезироваться и свернуться. Количество белка и его функциональная активность — разные показатели.", "p4b_1_q": "Условия: двухдоменный белок (см. под переключателями), убиквитин-протеасомная система работает. Стоп-кодон появился в кодоне 195 — после домена 1, в соединительном участке. Какие функции сохранит продукт?", "p4b_1_o1": "Свяжет партнёра, но не будет катализировать реакцию", "p4b_1_o2": "Никаких: укороченный белок сразу разрушается", "p4b_1_o3": "Все: рибосома пропустит преждевременный стоп-кодон", "p4b_1_e": "Домен 1 синтезирован целиком и свернулся ещё до стоп-кодона; он сохраняет функцию связывания партнёра. Свёрнутый домен не выставляет гидрофобных участков, и в модели контроль качества его не узнаёт. Домена 2 нет — нет и катализа.", "p4b_1_w2": "Контроль качества узнаёт признаки неправильного сворачивания, а не длину; здесь домен 1 свёрнут правильно.", "p4b_1_w3": "Стоп-кодон в A-сайте узнаёт фактор терминации — так же, как обычный; полипептид освобождается.", "p4b_2_q": "Стоп-кодон появился в кодоне 120 — внутри домена 1. Что произойдёт с продуктом?", "p4b_2_o1": "Цепь свяжут шапероны, затем её разрушит протеасома", "p4b_2_o2": "Продукт сохранится и будет связывать партнёра", "p4b_2_o3": "Рибосома не освободит цепь: домен не достроен", "p4b_2_e": "Цепь из 119 аминокислот — неполный домен 1: свернуться она не может, гидрофобные участки остаются открытыми. По этому признаку её узнают шапероны и затем убиквитинлигаза.", "p4b_2_w2": "Для связывания нужен целый свёрнутый домен 1, а синтезирована только его часть.", "p4b_2_w3": "Преждевременный стоп-кодон узнаётся фактором терминации, и цепь освобождается.", "p4b_3_q": "Стоп-кодон в кодоне 120 (внутри домена 1); протеасома подавлена, убиквитинлигаза действует. Что будет с продуктом?", "p4b_3_o1": "Помеченные цепи накопятся, возможны агрегаты", "p4b_3_o2": "Цепь со временем свернётся правильно", "p4b_3_o3": "Цепь станет ещё короче, чем была", "p4b_3_e": "Подавление протеасомы не исправляет дефект продукта: цепь по-прежнему не свёрнута и помечена убиквитином, но не разрушается и накапливается.", "p4b_3_w2": "Неполный домен свернуться не может; протеасома на сворачивание не влияет.", "p4b_3_w3": "Длину задаёт положение стоп-кодона; оно не изменилось.", "p4b_4_q": "При обычном стоп-кодоне: когда сворачивается домен 1?", "p4b_4_o1": "Во время синтеза, пока синтезируется домен 2", "p4b_4_o2": "Только после освобождения всего полипептида", "p4b_4_o3": "Только после того, как свернётся домен 2", "p4b_4_e": "N-концевой домен выходит из рибосомы первым и может свернуться котрансляционно; шапероны, связанные с рибосомой, связывают выходящую цепь и мешают ей слипаться с соседними цепями.", "p4b_4_w2": "Сворачивание не всегда начинается после завершения трансляции: у многих белков N-концевые домены сворачиваются, пока синтезируется C-концевая часть.", "p4b_4_w3": "Домен 1 расположен у N-конца и выходит из рибосомы первым; для его сворачивания домен 2 не нужен.", "p4b_5_q": "В двух клетках продукт укорочен: в одной он сохраняется, в другой разрушается. Что их различает в модели?", "p4b_5_o1": "Положение стоп-кодона относительно доменов", "p4b_5_o2": "Только длина: короткие продукты разрушаются", "p4b_5_o3": "Тип стоп-кодона: UGA сохраняет белок, UAA — нет", "p4b_5_e": "Контроль качества узнаёт признак неправильного сворачивания. Продукт, оборванный после домена 1, свёрнут и устойчив; оборванный внутри домена 1 — нет.", "p4b_5_w2": "Важна не длина сама по себе, а то, свернулась ли цепь; короткий свёрнутый белок может быть устойчивым.", "p4b_5_w3": "Все три стоп-кодона узнаёт один фактор терминации; от типа стоп-кодона в модели ничего не зависит.", "s1a_prob": "Условная мРНК из 12 смысловых кодонов и стоп-кодона. Меняется один нуклеотид (замена, вставка или делеция) или три нуклеотида подряд — у начала кодирующей области (кодон 3), в середине (кодон 7) или у её конца (кодон 11). Как одно и то же число изменённых нуклеотидов сказывается на полипептиде в зависимости от положения изменения относительно рамки считывания?", "s1a_type": "Изменение", "s1a_t_sub": "замена", "s1a_t_ins1": "+1 нт", "s1a_t_del1": "−1 нт", "s1a_t_ins3": "+3 нт", "s1a_t_del3": "−3 нт", "s1a_site": "Кодон", "s1a_s3": "3 (AAA)", "s1a_s7": "7 (GCU)", "s1a_s11": "11 (UGG)", "s1a_pos": "Нуклеотид кодона", "s1a_p1": "1-й", "s1a_p2": "2-й", "s1a_p3": "3-й", "s1a_nt": "Новый или вставленный нуклеотид", "s1a_nA": "A", "s1a_nC": "C", "s1a_nG": "G", "s1a_nU": "U", "s1a_note": "Цитоплазма клетки человека; полипептид — после одного прохода рибосомы. Замена — выбранный нуклеотид кодона заменяется новым. Вставка — после выбранного нуклеотида вставляется один новый нуклеотид или три одинаковых. Делеция — удаляется выбранный нуклеотид или три нуклеотида подряд, начиная с него (новый нуклеотид тогда не нужен). Полипептиды рассчитаны по стандартному генетическому коду; последовательность условная и подобрана так, чтобы в любом варианте встретился стоп-кодон.", "a1_pA": "А. мРНК (5′→3′): норма и изменённая; рамки — прочитанные кодоны", "a1_pB": "Б. Полипептиды (N→C) и итог", "a1_lbl_n": "норма", "a1_lbl_a": "изменение", "a1_lbl_site": "кодон {k}", "a1_lbl_window": "показаны кодоны начиная с {k}-го; кодоны до него не изменены", "a1_sum_same": "Нуклеотид заменён на такой же — изменения нет", "a1_sum_syn": "Синонимичная замена в кодоне {k}: полипептид тот же", "a1_sum_mis": "Миссенс-замена в кодоне {k}: одна аминокислота другая, длина та же ({m})", "a1_sum_non": "Нонсенс-замена в кодоне {k}: длина {m} вместо {n} аминокислот", "a1_sum_stoploss": "Стоп-кодон утрачен: считывание продолжилось, длина {m} вместо {n} аминокислот", "a1_sum_fs": "Сдвиг рамки в кодоне {k}: длина {m} вместо {n} аминокислот,\nновых или заменённых остатков — {d}", "a1_sum_fs0": "Сдвиг рамки в кодоне {k} сразу образовал стоп-кодон:\nдлина {m} вместо {n} аминокислот, новых остатков нет", "a1_sum_inframe_ins": "Вставка без сдвига рамки: длина {m} вместо {n} аминокислот;\nновых или заменённых остатков — {d}, дальше последовательность прежняя", "a1_sum_inframe_del": "Делеция без сдвига рамки: длина {m} вместо {n} аминокислот;\nновых или заменённых остатков — {d}, дальше последовательность прежняя", "a1_sum_inframe_stop": "Изменение длины кратно трём, но возник стоп-кодон:\nдлина {m} вместо {n} аминокислот", "a1_pAi": "А. Две мРНК (5′→3′): красным — нуклеотиды мРНК 2, отличные от мРНК 1", "a1_pBi": "Б. Полипептид, рассчитанный по обеим мРНК", "a1_lbl_m1": "мРНК 1", "a1_lbl_m2": "мРНК 2", "a1_lbl_ndiff": "различающихся нуклеотидов: {n}", "a1_lbl_samepep": "последовательность аминокислот одна и та же", "s1a_r_change": "Изменение", "s1a_v_change_sub": "кодон {k} ({c}): {p}-й нуклеотид → {n}", "s1a_v_change_ins1": "кодон {k}: +{n} после {p}-го нуклеотида", "s1a_v_change_ins3": "кодон {k}: +{n}{n}{n} после {p}-го нуклеотида", "s1a_v_change_del1": "кодон {k}: делеция {p}-го нуклеотида", "s1a_v_change_del3": "кодон {k}: делеция трёх нуклеотидов с {p}-го", "s1a_r_len": "Длина полипептида (норма → изменение)", "s1a_r_new": "Новые или заменённые остатки", "s1a_r_new_s": "в изменённом полипептиде", "s1a_r_frame": "Рамка ниже изменения", "s1a_r_kind": "Последствие для полипептида", "s1a_v_kind_same": "изменения нет", "s1a_v_kind_syn": "синонимичная замена", "s1a_v_kind_mis": "миссенс-замена", "s1a_v_kind_non": "нонсенс-замена", "s1a_v_kind_stoploss": "утрата стоп-кодона", "s1a_v_kind_fs": "сдвиг рамки", "s1a_v_kind_fs0": "сдвиг рамки — сразу стоп-кодон", "s1a_v_kind_inframe_ins": "вставка без сдвига рамки", "s1a_v_kind_inframe_del": "делеция без сдвига рамки", "s1a_v_kind_inframe_stop": "без сдвига рамки, но со стоп-кодоном", "s1a_r_inv1": "мРНК 1 и мРНК 2", "s1a_v_inv1": "различаются в 7 нуклеотидах", "s1a_r_inv2": "Полипептид", "s1a_v_inv2": "одинаков", "s1a_cap_inv": "Обратная задача: мРНК 1 и мРНК 2 различаются в семи нуклеотидах в четырёх кодонах, а полипептид по ним рассч
