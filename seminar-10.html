  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py собирает оба варианта) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */

  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 'v21';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */

  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);

/* Куда вернуть фокус после перестроения панели сценария (ТА-05): {opt: j} — вариант ответа, {sel: css} — элемент панели, {id} — элемент страницы */

/* ---------- навигация ---------- */

/* перейти к сцене по ключу (1b, 1a, 1m, 1m2…): для тестов и снимков */
function goScene(K){ qn = +K[0]; if (/^\dm/.test(K)) { lvl = 'a'; amode = 'm'; amk = +(K.slice(2) || 1); } else { lvl = K[1]; amode = 'e'; } show(); }
/* Уход со сцены (ТА-01, ТА-06): воспроизведение останавливается, отложенные прокрутки и особые остановки отменяются;
   кадр сохраняется, возобновлять воспроизведение без действия студента нельзя. */

/* возврат со страницы объяснений по ссылке seminar-N.html#q1…#q4 открывает нужный вопрос */

/* ===== навигация (каркас 26.10.2026, из ревизии сайта 3.9): адрес вопроса и уровня, история, возврат, телефон,
   «↓ К выводу», клавиатура, переход между семинарами. Тексты — ключи to_take, zoom_hint, zoom_out, sn_* ===== */
/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;
   переход по истории браузера восстанавливает вопрос и уровень */
function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  const mm = /(^|[?&])model=([1-3])(&|$)/.exec(location.search);
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b', m: mm ? 'm' : 'e', k: mm ? +mm[2] : 1 };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^(level|model)(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    if (lvl === 'a' && amode === 'm') ps.push('model=' + amk);
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); if (q !== qn) amk = 1; qn = q; lvl = l; show(); syncUrl(push); }
window.addEventListener('popstate', fromHash);
/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */
const revShow0 = show;
show = function(){ revShow0(); revAfterShow(); };
function revAfterShow(){
  const a = $('routeQ');

    const h = a.getAttribute('href'), i = h.indexOf('#'), hash = i < 0 ? '' : h.slice(i);

    if (lvl === 'a') b += (b.indexOf('?') < 0 ? '?' : '&') + 'level=adv';

}
/* уровень сложности передаётся в ссылки на соседние семинары и в общий вход «Объяснения» (аудит 06.11.2026, NAV-LEVEL) */
function revWithLevel(h){

/* справки молекул с клавиатуры: фокус, роль кнопки, доступное имя, Enter/Space (в семинарах, где этого не было);
   невидимые на схеме элементы (неприменённый препарат и т. п.) исключаются из порядка Tab */
function revVisible(e, stop){ for (let x = e; x && x !== stop; x = x.parentElement){ const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return false; } return true; }
function revA11y(){
  const sc = document.querySelector('#scenes .scene:not([hidden])'); if (!sc) return;
  const seen = new Set();   /* с клавиатуры — одна кнопка на каждую структуру, мышью и пальцем — любая деталь */
  sc.querySelectorAll('[data-g]').forEach(e => {
    if (!e.dataset.g) return;
    if (!e.hasAttribute('aria-label')){ const n = TEXTS['gn_' + e.dataset.g] || (e.textContent || '').trim(); if (n) e.setAttribute('aria-label', n); }
    if (e.hasAttribute('tabindex') && !e.dataset.rev) return;   /* фокус задан разметкой страницы — не трогаем */
    if (!e.dataset.rev){ e.dataset.rev = '1'; if (!e.hasAttribute('role')) e.setAttribute('role', 'button'); }
    const vis = revVisible(e, sc) && !seen.has(e.dataset.g), ti = vis ? '0' : '-1'; if (vis) seen.add(e.dataset.g);

/* «↓ К выводу»: на компьютере правая колонка прокручивается отдельно; кнопка видна, пока вывод ниже видимой части */
let revTakeT = 0;
function revTakeSoon(){ if (revTakeT) return; revTakeT = requestAnimationFrame(() => { revTakeT = 0; revTake(); }); }
function revTake(){

  /* подсказка над увеличенной схемой; на телефоне схема по умолчанию увеличена — подписи читаются без ручного увеличения */

/* =====================================================================
   s0_gn.js — общие детали схем семинара 9 «Транскрипция и процессинг пре-мРНК». Общие для практикума и «Объяснений».
   Условности: тёмно-синяя цепь ДНК — матричная цепь выбранной транскрипционной единицы; серо-синяя — кодирующая цепь;
   оранжевая — РНК; фиолетовый овал — РНК-полимераза II; на генах и мРНК: тёмная заливка — кодирующий участок,
   светлая — нетранслируемая область (НТО), тонкая линия — интрон; красный кружок m⁷G — кэп; «AAAA» — поли(А)-хвост.
   Ядерная оболочка — две мембраны (каждая — липидный бислой) с ядерной порой. Это схемы, не химические формулы.
   Функции возвращают строку SVG; русского текста здесь нет (подписи — через t()). Группы data-g — справка (gn_<g>, g_<g>).
   GN.seq — преобразования последовательностей (чистые функции, проверяются тестом tests9/models.mjs).
   ===================================================================== */
const GN = (function () {
  const C = { tpl: '#1F3B73', cod: '#8AA0BF', rna: '#E8912A', rnaL: '#F6D7AE', rung: '#9AA8BA', ink: '#15202B', muted: '#5A6676',
    bad: '#C0392B', warn: '#C77700', ok: '#2E9B57', pol: '#7C4DBE', tfd: '#2C7FB8', tfb: '#4E9AC7', tfh: '#1F8A8A', tfo: '#6C8FB0',
    med: '#8A5A12', act: '#B85C00', cap: '#B03A2E', cpa: '#3D5A99', spl: '#2E9B57', exp: '#1F8A8A', xrn: '#6A3FA0',
    cds: '#4F86C6', utr: '#BBD0EA', mem: '#9C8F6E', memH: '#C9B98F', panel: '#F4F7FA', line: '#D3DAE3', nuc: '#FBF8F1', cyt: '#F3F7FB' };
  const f = x => (+x).toFixed(1);
  const G = (g, s) => s ? `<g class="clickable" data-g="${g}">${s}</g>` : '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function line(x1, y1, x2, y2, col, w = 6, extra = '') {
    return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  }
  /* подпись: anchor m — по центру, l — слева, r — справа; o.w — жирность, o.size, o.col; o.bg — белая подложка.
     Цвет повторён в style: правило оболочки «Объяснений» .widget svg text{fill:var(--ink)} перекрывало атрибут fill,
     и цветные подписи (красные замены, зелёный старт-кодон) в «Объяснениях» становились чёрными (семинар 10, v1.0). */
  function text(x, y, s, o = {}) {
    const a = o.a === 'l' ? 'start' : o.a === 'r' ? 'end' : 'middle';
    const tt = `<text class="lbl" x="${f(x)}" y="${f(y)}" font-size="${o.size || 14}" font-weight="${o.w || 500}" fill="${o.col || C.ink}" style="text-anchor:${a};fill:${o.col || C.ink}"${o.it ? ' font-style="italic"' : ''}${o.mono ? ' font-family="ui-monospace,Menlo,Consolas,monospace"' : ''}>${esc(s)}</text>`;
    if (!o.bg) return tt;
    const wd = String(s).length * (o.size || 14) * .55 + 10, x0 = a === 'start' ? x - 4 : a === 'end' ? x - wd + 4 : x - wd / 2;
    return `<rect x="${f(x0)}" y="${f(y - (o.size || 14) * .75)}" width="${f(wd)}" height="${f((o.size || 14) * 1.5)}" rx="4" fill="#fff" opacity=".92"/>` + tt;
  }
  function textN(x, y, s, o = {}) { return String(s).split('\n').map((ln, i) => text(x, y + i * (o.size || 14) * 1.25, ln, o)).join(''); }
  function panel(x, y, w, h, title, fill) {
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="10" fill="${fill || C.panel}" stroke="${C.line}"/>` + (title ? text(x + 12, y + 16, title, { a: 'l', size: 14.5, w: 700, col: C.muted }) : '');
  }
  function arrow(x1, y1, x2, y2, col = C.muted, w = 2.2, dash = '') {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
    const p1 = [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], p2 = [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)];
    return line(x1, y1, x2 - Math.cos(a) * 3, y2 - Math.sin(a) * 3, col, w, dash ? `stroke-dasharray="${dash}"` : '') +
      `<path d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z" fill="${col}"/>`;
  }
  /* белок: скруглённый прямоугольник с короткой подписью; o.op — непрозрачность (полупрозрачный — этап не начат или деталь вынута) */
  function blob(x, y, w, h, col, g, label, o = {}) {
    return G(g, `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(Math.min(h, w) / 2)}" fill="${col}" opacity="${o.op != null ? o.op : .93}" stroke="#fff" stroke-width="1.5"${o.dash ? ' stroke-dasharray="4 3"' : ''}/>` +
      (label ? (() => { const op = o.dash ? 1 : Math.min(1, (o.op != null ? o.op : .93) / .93), tx = text(x, y + 1, label, { size: o.size || 12, w: 700, col: '#fff' });
        return op < .9 ? `<g opacity="${f(op)}">${tx}</g>` : tx; })() : ''));   /* v1.2 (рецензия интерактива И-13): без «призраков» подписей у ещё не появившихся факторов */
  }
  /* красный крест: этап, на котором процесс остановился */
  function cross(x, y, r = 9) { return `<g stroke="${C.bad}" stroke-width="3" stroke-linecap="round"><line x1="${f(x - r)}" y1="${f(y - r)}" x2="${f(x + r)}" y2="${f(y + r)}"/><line x1="${f(x + r)}" y1="${f(y - r)}" x2="${f(x - r)}" y2="${f(y + r)}"/></g>`; }

    const pathOf = yy => { let p = `M${f(X(0) - dx * .45)},${f(yy(0))}`; for (let i = 0; i < n; i++) p += ` L${f(X(i))},${f(yy(i))}`; return p + ` L${f(X(n - 1) + dx * .45)},${f(yy(n - 1))}`; };
    s += G(gT, `<path d="${pathOf(yT)}" fill="none" stroke="${colT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    s += G(gB, `<path d="${pathOf(yB)}" fill="none" stroke="${colB}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    for (let i = 0; i < n; i++) {

    if (d.lbl !== false) {

      s += text(X(0) - dx * .45 - 6, yT(0), '5′', Object.assign({ a: 'r' }, ls)) + text(X(n - 1) + dx * .45 + 6, yT(n - 1), '3′', Object.assign({ a: 'l' }, ls));

  /* РНК под или над участком ДНК: буквы rna (5′→3′) по позициям ДНК; dir '+' — 5′-конец слева; k — сколько нуклеотидов уже синтезировано */

  function pol2(x, y, t, o = {}) { return blob(x, y, o.w || 62, o.h || 34, C.pol, 'pol2', o.label === false ? '' : (o.label || 'Pol II'), Object.assign({ size: 12 }, o)); }

      G('tss', `<path d="M${f(xs)},${f(y - 9)} L${f(xs)},${f(y - 26)} L${f(xs + (dir === '+' ? 30 : -30))},${f(y - 26)}" fill="none" stroke="${C.ink}" stroke-width="2.4"/>` +
        `<path d="M${f(xs + (dir === '+' ? 38 : -38))},${f(y - 26)} l${dir === '+' ? -9 : 9},-5 l0,10 z" fill="${C.ink}"/>`);

        `<circle cx="${f(x)}" cy="${f(y - 7)}" r="${r}" fill="${C.memH}" stroke="${C.mem}" stroke-width=".7"/><circle cx="${f(x)}" cy="${f(y + 7)}" r="${r}" fill="${C.memH}" stroke="${C.mem}" stroke-width=".7"/>`;

    s += G('npc', `<path d="M${f(xp1)},${f(y - 18)} Q${f(xp1 + 9)},${f(y)} ${f(xp1)},${f(y + 18)}" fill="none" stroke="${C.mem}" stroke-width="3"/>` +
      `<path d="M${f(xp2)},${f(y - 18)} Q${f(xp2 - 9)},${f(y)} ${f(xp2)},${f(y + 18)}" fill="none" stroke="${C.mem}" stroke-width="3"/>` +
      `<rect x="${f(xp1 + 2)}" y="${f(y - 22)}" width="9" height="44" rx="4" fill="#7E8CA3"/><rect x="${f(xp2 - 11)}" y="${f(y - 22)}" width="9" height="44" rx="4" fill="#7E8CA3"/>` +
      [0, 1, 2].map(i => `<path d="M${f(xp1 + 11)},${f(y - 14 + i * 14)} q${f((xp2 - xp1 - 22) / 4)},4 ${f((xp2 - xp1 - 22) / 2)},0 t${f((xp2 - xp1 - 22) / 2)},0" fill="none" stroke="#A9B4C6" stroke-width="1.2"/>`).join(''));

      else s += G(p.g || (p.kind === 'cds' ? 'cds' : 'utr'), `<rect x="${f(xx)}" y="${f(y - 9)}" width="${f(p.w)}" height="18" rx="3" fill="${p.kind === 'cds' ? C.rna : C.rnaL}" stroke="${C.rna}" stroke-width="1.4"${p.dash ? ' stroke-dasharray="3 2"' : ''}/>` +
        (p.lab ? text(xx + p.w / 2, y + .5, p.lab, { size: 11, w: 700, col: p.kind === 'cds' ? '#fff' : '#8A4B00' }) : ''));

        (p.lab ? text(xx + p.w / 2, y + .5, p.lab, { size: 11.5, w: 700, col: p.kind === 'cds' ? '#fff' : C.tpl }) : ''));

      xx += p.w;

  }

      text(x + w / 2, y0 - h - 10, val, { size: 13, w: 700 }) + textN(x + w / 2, y0 + 14, lab, { size: 11.5, col: C.muted });

})();

/* =====================================================================
   s0_gn_code.js — генетический код и правила считывания для семинара 10 «Трансляция» (практикум и «Объяснения»).
   Стандартный ядерный генетический код (MBoC7, рис. 6–52, с. 358–359): 64 кодона, 61 смысловой, стоп-кодоны UAA, UAG, UGA;
   AUG — метионин и старт-кодон. Исключения (код митохондрий) в моделях не используются.
   Все функции чистые (без документа): их проверяет тест tests10/models.mjs.
   Последовательности записаны 5′→3′; рамка считывания задаётся старт-кодоном и не перекрывается.
   ===================================================================== */
GN.code = (function () {
  const B = 'UCAG', A1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
  const CODE = {};
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) CODE[B[i] + B[j] + B[k]] = A1[16 * i + 4 * j + k];

    T: 'Thr', N: 'Asn', K: 'Lys', V: 'Val', A: 'Ala', D: 'Asp', E: 'Glu', G: 'Gly', '*': 'стоп' };
  /* трансляция с позиции start (индекс нуклеотида старт-кодона): кодоны подряд до стоп-кодона включительно или до конца матрицы */
  function translate(s, start = 0) {
    const cod = []; let stop = false;
    for (let i = start; i + 3 <= s.length; i += 3) {
      const c = s.slice(i, i + 3), a = CODE[c];
      cod.push({ c, a, i });
      if (a === '*') { stop = true; break; }

    const aa = cod.filter(x => x.a !== '*').map(x => x.a);
    return { cod, aa, stop, end: cod.length ? cod[cod.length - 1].i + 3 : start };
  }
  /* изменение последовательности: op = { type: 'sub' | 'ins' | 'del', at — индекс нуклеотида, nt — новый (вставляемый) нуклеотид, n — 1 или 3 } */
  function apply(s, op) {
    if (!op || op.type === 'none') return { seq: s, mark: [] };
    if (op.type === 'sub') return { seq: s.slice(0, op.at) + op.nt + s.slice(op.at + 1), mark: [{ k: 'sub', i: op.at, from: s[op.at], to: op.nt }] };
    if (op.type === 'ins') { const ins = op.nt.repeat(op.n); return { seq: s.slice(0, op.at) + ins + s.slice(op.at), mark: [{ k: 'ins', i: op.at, n: op.n, nt: ins }] }; }
    if (op.type === 'del') return { seq: s.slice(0, op.at) + s.slice(op.at + op.n), mark: [{ k: 'del', i: op.at, n: op.n, nt: s.slice(op.at, op.at + op.n) }] };
    throw new Error('op');
  }
  /* сравнение двух полипептидов: совпадающие начало (p) и конец (q); при сдвиге рамки и новом стоп-кодоне конец не выравнивается */
  function compare(pn, pc, alignTail) {
    let p = 0; while (p < pn.length && p < pc.length && pn[p] === pc[p]) p++;
    let q = 0;
    if (alignTail) while (q < pn.length - p && q < pc.length - p && pn[pn.length - 1 - q] === pc[pc.length - 1 - q]) q++;
    const chN = pn.length - p - q, chC = pc.length - p - q;   /* утраченные или заменённые остатки нормы; новые или заменённые остатки продукта */
    return { p, q, chN, chC, same: chN === 0 && chC === 0 };

    return Object.assign({ kind, shift, d, lenN: pn.length, lenC: pc.length, stopC: ch.stop }, cmp);
  }

  const DEG = {}; for (const c in CODE) DEG[CODE[c]] = (DEG[CODE[c]] || 0) + 1;
  return { CODE, A3, translate, apply, compare, classify, DEG, BASES: B };
})();

/* =====================================================================
   s0_gn_nbh.js — v1.1.1 (Code, паспорт интерактива: «заголовок „пре-“ / „мРНК“ — неразрывный дефис»).
   Браузер переносит строку после дефиса, и «пре-» оставалось в конце строки, а «мРНК» уходило на следующую
   (h1 практикума на 768 px, заголовки и абзацы «Объяснений» на телефоне — тест tests9/hyphen.mjs).
   Тексты не меняются: при выводе слово «пре-…» оборачивается в <span class="nbh"> с white-space: nowrap,
   поэтому textContent, таблица текстов, реестр откатов и поиск по странице прежние. Схемы SVG не затрагиваются.
   Файл подключается и к практикуму (src/s*.js), и к «Объяснениям» (s0_gn*.js → widgets.js).
   ===================================================================== */
(function () {
  if (typeof document === 'undefined' || !document.body || typeof MutationObserver === 'undefined') return;   /* модели в node (tests9) — без документа */
  const SPLIT = /(пре-[А-Яа-яЁё]+)/;
  const skip = el => !el || (el.closest && el.closest('.nbh, script, style, textarea, svg'));
  function fix(root) {
    if (!root || root.nodeType !== 1 || skip(root)) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.indexOf('пре-') < 0 || skip(n.parentNode) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const list = []; let n; while ((n = tw.nextNode())) list.push(n);
    for (const nd of list) {
      const parts = nd.nodeValue.split(SPLIT); if (parts.length < 2) continue;
      const fr = document.createDocumentFragment();
      parts.forEach((p, i) => { if (!p) return;
        if (i % 2) { const s = document.createElement('span'); s.className = 'nbh'; s.style.whiteSpace = 'nowrap'; s.textContent = p; fr.appendChild(s); }
        else fr.appendChild(document.createTextNode(p)); });
      nd.parentNode.replaceChild(fr, nd);
    }
  }
  fix(document.body);
  new MutationObserver(ms => { for (const m of ms) for (const a of m.addedNodes) {
    if (a.nodeType === 3) { if (a.nodeValue.indexOf('пре-') >= 0) fix(a.parentNode); } else if (a.nodeType === 1 && !(a.closest && a.closest('svg'))) fix(a); } })
    .observe(document.body, { childList: true, subtree: true });
})();

/* =====================================================================
   s0_gn_s1.js — вкладка 1 «Генетический код и рамка считывания»: базовая сцена 1b и исследование 1a, общие рисунки
   строки мРНК (GN.ntRow) и полипептида (GN.pepRow).
   1b: условная мРНК из девяти смысловых кодонов и стоп-кодона; изменения в кодоне 3 (GAA, глутаминовая кислота): замена третьего или первого
   нуклеотида, вставка одного нуклеотида, утрата одного или трёх нуклеотидов. Модель условная: показано изменение
   последовательности мРНК; откуда оно взялось (мутация ДНК, ошибка транскрипции, редактирование РНК), модель не рассматривает.
   1a: условная мРНК из 12 смысловых кодонов; место (кодон 3, 7 или 11), тип изменения, нуклеотид кодона, новый нуклеотид.
   Полипептиды вычисляются кодом по стандартному коду (GN.code); числа на схемах не задаются вручную.
   ===================================================================== */
GN.ntRow = function (x, y, s, o, t) {
  /* s — мРНК 5′→3′ начиная со старт-кодона; o.tr — результат GN.code.translate(s); o.mark — изменения; o.cell — ширина буквы;
     o.gap — промежуток между кодонами рамки; o.max — сколько нуклеотидов показывать; o.g — группа справки */
  const { C, f, text, G } = GN;
  const cw = o.cell || 13, gp = o.gap == null ? 4 : o.gap, n = Math.min(s.length, o.max || s.length), end = o.tr.end, sz = o.size || 13;
  const ex = o.sp ? o.sp.end : end;   /* v1.1.1: o.sp — разбиение для расстановки букв (кадры анимации: буквы стоят на местах конечного кадра) */
  const X = i => x + i * cw + Math.floor(Math.min(i, ex) / 3) * gp + (i >= ex ? gp : 0);
  let r = '';
  /* рамки кодонов, прочитанных рибосомой (от старт-кодона до стоп-кодона) */
  o.tr.cod.forEach((c, k) => {
    const x0 = X(c.i) - 1.5, w = 3 * cw + 1;
    const st = k === 0 && o.start !== false, col = c.a === '*' ? C.bad : st ? C.ok : C.rna;
    r += G(c.a === '*' ? 'stopc' : st ? 'startc' : 'codon', `<rect x="${f(x0)}" y="${f(y - sz * .85)}" width="${f(w)}" height="${f(sz * 1.7)}" rx="3" fill="${c.a === '*' ? '#FBE3E0' : st ? '#E2F3E8' : (k % 2 ? '#FCEBD5' : '#FFF5E8')}" stroke="${col}" stroke-width="1.1"/>`);
  });
  const mk = {}; (o.mark || []).forEach(m => { if (m.k === 'sub') mk[m.i] = 'sub'; if (m.k === 'ins') for (let j = 0; j < m.n; j++) mk[m.i + j] = 'ins'; });
  for (let i = 0; i < n; i++) {
    const read = i < end, col = mk[i] ? C.bad : read ? '#5A3200' : '#9AA3AE';
    /* v1.1.1 (Code, паспорт интерактива): вставленный нуклеотид — своя деталь справки «Сдвиг рамки считывания» (раньше щелчок попадал в «кодон») */
    const lt = text(X(i) + cw / 2, y, s[i], { size: sz, w: mk[i] || read ? 700 : 500, col, mono: true });
    if (mk[i] === 'ins') r += G('frameshift', `<rect x="${f(X(i))}" y="${f(y - sz * .85)}" width="${f(cw)}" height="${f(sz * 1.95)}" fill="#fff" fill-opacity="0"/>` + lt + GN.line(X(i) + 1, y + sz * .95, X(i) + cw - 1, y + sz * .95, C.bad, 1.6));
    else r += lt;
  }
  if (n < s.length) r += text(X(n) + 2, y, '…', { a: 'l', size: sz, col: '#9AA3AE' });
  (o.mark || []).filter(m => m.k === 'del').forEach(m => {
    const xd = X(m.i) - (m.i % 3 === 0 && m.i > 0 ? gp / 2 : 0) - .5;
    r += G('deletion', `<path d="M${f(xd - 5)},${f(y - sz * 1.55)} l5,7 l5,-7 z" fill="${C.bad}"/>` + text(xd, y - sz * 2.05, '−' + m.nt, { size: sz - 1.5, w: 700, col: C.bad, mono: true }));
  });
  r += text(x - 6, y, o.start === false ? '…' : '5′', { a: 'r', size: sz - 1, w: 700, col: C.muted }) + text(X(n) + (n < s.length ? 16 : 4), y, '3′', { a: 'l', size: sz - 1, w: 700, col: C.muted });
  return { svg: G(o.g || 'mrna', r), X, w: X(n) - x };
};
GN.pepRow = function (x, y, aa, o, t) {
  /* полипептид от N- к C-концу: кружки с трёхбуквенными обозначениями; o.cls[i] — 'same' | 'new' | 'lost'; o.bw — ширина бусины */
  const { C, f, text, G } = GN, A3 = GN.code.A3, bw = o.bw || 40, h = o.h || 20;
  let r = text(x - 8, y, 'N', { a: 'r', size: 13, w: 700 });
  aa.forEach((a, i) => {
    const cls = (o.cls || [])[i] || 'same', xx = x + i * (bw + 3);
    const fill = cls === 'new' ? '#F6C9C3' : cls === 'lost' ? '#fff' : '#D6E3F3', st = cls === 'new' ? C.bad : cls === 'lost' ? '#B9C2CE' : '#6A8FC4';
    r += `<rect x="${f(xx)}" y="${f(y - h / 2)}" width="${bw}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${st}" stroke-width="1.3"${cls === 'lost' ? ' stroke-dasharray="3 2"' : ''}/>` +
      text(xx + bw / 2, y + .5, A3[a], { size: o.size || 11.5, w: 700, col: cls === 'lost' ? '#9AA3AE' : cls === 'new' ? '#8E2A1F' : '#1F3B73' });
  });
  if (o.cend !== false) r += text(x + aa.length * (bw + 3) + 4, y, 'C', { a: 'l', size: 13, w: 700 });
  return G(o.g || 'polypeptide', r);
};

GN.s1b = (function () {
  const { C, f, text, textN, panel, G } = GN, K = GN.code;
  const UTR5 = 'GCCACC', CDS = 'AUGGCUGAAUGGUUAGGUGACGUGAUUUAA', UTR3 = 'GCAUGAUCUAGCUAA';
  const SEQ = UTR5 + CDS + UTR3, ST = UTR5.length, C3 = ST + 6;   /* C3 — первый нуклеотид кодона 3 (GAA; v1.1: кодон AAA заменён — он есть в аудиторной колоде, рецензия Р-13) */
  /* изменения в кодоне 3 (первый нуклеотид кодона 3 — индекс C3) */
  const OPS = {
    none: { type: 'none' },
    syn: { type: 'sub', at: C3 + 2, nt: 'G' },      /* GAA → GAG */
    mis: { type: 'sub', at: C3 + 1, nt: 'U' },      /* GAA → GUA */
    non: { type: 'sub', at: C3, nt: 'U' },          /* GAA → UAA */
    ins1: { type: 'ins', at: C3 + 1, nt: 'C', n: 1 },   /* G|C|AA */
    del1: { type: 'del', at: C3 + 1, n: 1 },         /* −A (второй нуклеотид кодона 3) */
    del3: { type: 'del', at: C3, n: 3 },             /* −GAA: весь кодон 3 */
  };
  const ORDER = ['none', 'syn', 'mis', 'non', 'ins1', 'del1', 'del3'];
  function model(ch) {
    const op = OPS[ch];
    const norm = Object.assign(K.translate(SEQ, ST), { seq: SEQ });
    const a = K.apply(SEQ, op), alt = Object.assign(K.translate(a.seq, ST), { seq: a.seq });
    const cl = K.classify(norm, alt, op);
    const c3 = SEQ.slice(C3, C3 + 3), c3n = op.type === 'sub' ? a.seq.slice(C3, C3 + 3) : null;
    return { state: ch, op, norm, alt, mark: a.mark.map(m => Object.assign({}, m, { i: m.i - ST })), cl, c3, c3n, seq: a.seq };
  }
  /* классы бусин полипептида: норма — утраченные и заменённые остатки; продукт — новые остатки */
  function cls(o) {
    const c = o.cl, n = o.norm.aa.length, m = o.alt.aa.length;
    const cn = Array.from({ length: n }, (_, i) => i >= c.p && i < n - c.q ? 'lost' : 'same');
    const cc = Array.from({ length: m }, (_, i) => i >= c.p && i < m - c.q ? 'new' : 'same');
    return { cn, cc };
  }
  function draw(o, t, hide) {
    let s = panel(16, 14, 568, 150, t('s1_pA'));
    const rn = GN.ntRow(118, 66, CDS + UTR3, { tr: K.translate(CDS + UTR3, 0), max: 32, cell: 12, g: 'mrna' }, t);
    s += text(28, 66, t('s1_lbl_norm'), { a: 'l', size: 11.5, w: 700, col: C.muted }) + rn.svg;
    const altS = o.seq.slice(ST), altT = K.translate(altS, 0);
    const ra = GN.ntRow(118, 130, altS, { tr: altT, mark: hide ? [] : o.mark, max: 32, cell: 12, g: 'mrna' }, t);
    s += text(28, 130, t('s1_lbl_alt'), { a: 'l', size: 11.5, w: 700, col: C.muted }) + (hide ? '' : ra.svg);
    if (hide) s += text(340, 130, t('s1_lbl_hidden'), { size: 12.5, it: true, col: C.muted });
    s += panel(16, 174, 568, 150, t('s1_pB'));
    const k = cls(o);
    s += text(28, 222, t('s1_lbl_norm'), { a: 'l', size: 12, w: 700, col: C.muted }) + GN.pepRow(118, 222, o.norm.aa, { cls: k.cn, g: 'polypeptide' });
    s += text(28, 282, t('s1_lbl_alt'), { a: 'l', size: 12, w: 700, col: C.muted });
    if (hide) s += text(330, 282, t('s1_lbl_hidden'), { size: 12.5, it: true, col: C.muted });
    else if (o.alt.aa.length) s += GN.pepRow(118, 282, o.alt.aa, { cls: k.cc, g: 'polypeptide' });
    s += text(300, 310, t('s1_lbl_dir'), { size: 11, col: C.muted });
    s += panel(16, 334, 568, 72, t('s1_pC'));
    s += hide ? text(300, 380, t('s1_lbl_hidden'), { size: 12.5, it: true, col: C.muted })
      : textN(300, 366, t('s1_sum_' + o.state, { n: o.norm.aa.length, m: o.alt.aa.length, c: o.c3, cn: o.c3n || '' }), { size: 12.5, col: C.ink });
    return s;
  }
  const view = (a, t) => draw(model(a[0]), t, a[1] === 'hide');
  return { model, draw, view, OPS, ORDER, SEQ, ST, CDS, UTR3, C3 };
})();

GN.a1 = (function () {
  const { C, f, text, textN, panel, G } = GN, K = GN.code;
  /* условная мРНК: 12 смысловых кодонов, стоп UAA, 3′-НТО; подобрана так, чтобы сдвиг рамки у начала давал ранний стоп-кодон,
     а у конца — продолжение считывания в 3′-НТО (проверено тестом models.mjs) */
  const CDS = 'AUGUCCAAAUUAGAUAGGGCUAUAGUUAACUGGACAUAA', UTR3 = 'CAUAGCGCUAAGCUGAUAG', SEQ = CDS + UTR3;
  const SITES = { s3: 3, s7: 7, s11: 11 };   /* номер кодона */
  /* второй вариант мРНК для обратной задачи: синонимичные кодоны в позициях 2, 4, 6, 12 (тот же полипептид) */
  const ALT2 = 'AUGAGCAAACUGGAUCGUGCUAUAGUUAACUGGACCUAA';
  function op(type, site, pos, nt) {
    const at = (SITES[site] - 1) * 3 + (pos - 1);
    if (type === 'sub') return { type: 'sub', at, nt };
    if (type === 'ins1') return { type: 'ins', at: at + 1, nt, n: 1 };   /* вставка после выбранного нуклеотида кодона */
    if (type === 'ins3') return { type: 'ins', at: at + 1, nt, n: 3 };
    if (type === 'del1') return { type: 'del', at, n: 1 };               /* утрата выбранного нуклеотида */
    if (type === 'del3') return { type: 'del', at, n: 3 };               /* утрата трёх нуклеотидов, начиная с выбранного */
    return { type: 'none' };
  }
  function model(type, site, pos, nt) {
    const o = op(type, site, +pos, nt);
    const norm = Object.assign(K.translate(SEQ, 0), { seq: SEQ });
    const a = K.apply(SEQ, o), alt = Object.assign(K.translate(a.seq, 0), { seq: a.seq });
    const cl = K.classify(norm, alt, o);
    const k = SITES[site], c0 = SEQ.slice((k - 1) * 3, k * 3);
    const same = type === 'sub' && SEQ[o.at] === nt;
    const nAA = cl.chC;   /* число новых или заменённых остатков продукта */
    return { type, site, pos: +pos, nt, op: o, norm, alt, cl, mark: a.mark, seq: a.seq, k, c0, same, nAA,
      key: [type, site, pos, nt].join('_') };
  }
  function draw(o, t, mode) {
    /* mode: 'inv' — обратная задача (две мРНК и один полипептид); 'hide' — продукт скрыт до ответа */
    if (mode === 'inv') return drawInv(t);
    let s = panel(16, 14, 568, 160, t('a1_pA'));
    /* окно: от кодона k−3 (у начала — от старт-кодона) до последнего прочитанного кодона и ещё трёх нуклеотидов */
    const w0 = o.k <= 4 ? 0 : (o.k - 4) * 3, mx = Math.max(o.norm.end, o.alt.end) + 3;
    const sub = (q, tr) => ({ s: q.slice(w0, Math.min(q.length, mx)), tr: K.translate(q.slice(w0), 0) });
    const a0 = sub(SEQ), a1 = sub(o.seq);
    const opt = { cell: 10.4, gap: 2.4, size: 11.5, start: w0 === 0 };
    const rn = GN.ntRow(62, 76, a0.s, Object.assign({ tr: a0.tr }, opt), t);
    s += text(30, 54, t('a1_lbl_n'), { a: 'l', size: 11, w: 700, col: C.muted }) + rn.svg;
    const ra = GN.ntRow(62, 142, a1.s, Object.assign({ tr: a1.tr, mark: o.mark.map(m => Object.assign({}, m, { i: m.i - w0 })) }, opt), t);
    s += text(30, 106, t('a1_lbl_a'), { a: 'l', size: 11, w: 700, col: C.muted }) + ra.svg;
    /* место изменения: номер кодона под строкой нормы */
    const xk = rn.X((o.k - 1) * 3 - w0) + 15;
    s += G('codon', text(xk, 98, t('a1_lbl_site', { k: o.k }), { size: 10.5, w: 700, col: C.bad }));
    if (w0) s += text(300, 164, t('a1_lbl_window', { k: o.k - 3 }), { size: 10.5, col: C.muted });
    s += panel(16, 184, 568, 222, t('a1_pB'));
    const n = o.norm.aa.length, m = o.alt.aa.length, c = o.cl;
    const cn = Array.from({ length: n }, (_, i) => i >= c.p && i < n - c.q ? 'lost' : 'same');
    const cc = Array.from({ length: m }, (_, i) => i >= c.p && i < m - c.q ? 'new' : 'same');
    s += text(30, 220, t('a1_lbl_n'), { a: 'l', size: 11, w: 700, col: C.muted }) + GN.pepRow(52, 242, o.norm.aa, { cls: cn, bw: 27, h: 18, size: 9.5, g: 'polypeptide' });
    s += text(30, 276, t('a1_lbl_a'), { a: 'l', size: 11, w: 700, col: C.muted });
    if (mode === 'hide') s += text(330, 298, t('s1_lbl_hidden'), { size: 12, it: true, col: C.muted });
    else s += GN.pepRow(52, 298, o.alt.aa, { cls: cc, bw: 27, h: 18, size: 9.5, g: 'polypeptide' });
    if (mode !== 'hide') s += textN(300, 344, t('a1_sum_' + (o.same ? 'same' : o.cl.kind === 'fs' && !o.cl.chC ? 'fs0' : o.cl.kind), { n, m, c: o.c0, k: o.k, d: o.nAA }), { size: 12, col: C.ink });
    else s += text(300, 350, t('s1_lbl_hidden'), { size: 12, it: true, col: C.muted });
    return s;
  }
  function drawInv(t) {
    let s = panel(16, 14, 568, 200, t('a1_pAi'));
    const t1 = K.translate(SEQ, 0), t2 = K.translate(ALT2, 0);
    const r1 = GN.ntRow(78, 74, CDS, { tr: t1, max: 39, cell: 11.5, gap: 3, size: 12 }, t);
    const diff = []; for (let i = 0; i < CDS.length; i++) if (CDS[i] !== ALT2[i]) diff.push({ k: 'sub', i });
    const r2 = GN.ntRow(78, 150, ALT2, { tr: t2, mark: diff, max: 39, cell: 11.5, gap: 3, size: 12 }, t);
    s += text(28, 54, t('a1_lbl_m1'), { a: 'l', size: 11, w: 700, col: C.muted }) + r1.svg + text(28, 130, t('a1_lbl_m2'), { a: 'l', size: 11, w: 700, col: C.muted }) + r2.svg;
    s += text(300, 192, t('a1_lbl_ndiff', { n: diff.length }), { size: 11.5, col: C.bad, w: 700 });
    s += panel(16, 224, 568, 120, t('a1_pBi'));
    s += GN.pepRow(104, 280, t1.aa, { bw: 30, h: 18, size: 10 });
    s += text(300, 318, t('a1_lbl_samepep'), { size: 11.5, col: C.muted });
    return s;
  }
  const view = (a, t) => a[0] === 'inv' ? drawInv(t) : draw(model(a[0], a[1], a[2], a[3]), t, a[4]);
  return { model, draw, view, op, SEQ, CDS, UTR3, ALT2, SITES };
})();

/* =====================================================================
   s0_gn_s2.js — вкладка 2 «тРНК и аминоацилирование»: базовая сцена 2b и исследование 2a.
   2b (MBoC7, с. 359–364, рис. 6–55, 6–58; правило качания — с. 360): условная тРНК изолейцина с антикодоном 5′-GAU-3′;
   изолейцил-тРНК-синтетаза (есть / нет), АТФ (есть / нет), кодон в A-сайте (AUC / AUU / GUC). Синтетаза в два этапа
   соединяет изолейцин с 3′-концом тРНК (через изолейциладенилат); рибосома проверяет только спаривание кодона с антикодоном:
   строго — в первых двух позициях кодона, в третьей допускается пара G·U. Кодон GUC (валин) декодирует тРНК валина.
   2a (условная модель): мРНК из 11 смысловых кодонов, изолейцин — в позициях 3, 6 и 10; 10 условных молекул продукта.
   Три источника замены: изменение кодона 6 в мРНК (AUC → GUC), синтетаза без корректирующей активности (валин
   на тРНК изолейцина, учебная доля 20 % мест изолейцина), сниженная точность декодирования (четыре разрозненные ошибки).
   Расположение замен в молекулах задано заранее (учебная выборка), числа проверяет тест models.mjs.
   ===================================================================== */
GN.trna = function (x, y, o) {
  /* тРНК в L-форме: горизонтальное плечо — акцепторный стебель с 3′-концом CCA (слева), вертикальное — антикодоновое плечо;
     антикодон (o.ac, записан 3′→5′ слева направо) — внизу; o.aa — аминокислота на 3′-конце (или null); o.col — цвет */
  const { C, f, text, G } = GN, col = o.col || '#2C7FB8', s = o.s || 1;
  const xa = x - 70 * s, yb = y + 92 * s;
  let r = `<path d="M${f(xa)},${f(y)} L${f(x)},${f(y)} L${f(x)},${f(yb - 14 * s)}" fill="none" stroke="${col}" stroke-width="${f(13 * s)}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  /* v1.2.1 (аудит S10-03, И-22): с аминокислотой на 3′-конце метка «3′» — слева от неё (кружок аминокислоты её не закрывает) */
  r += (o.aa ? text(xa - 38 * s, y + 4 * s, '3′', { a: 'r', size: 11 * s, w: 700, col: C.muted }) : text(xa - 8 * s, y - 15 * s, '3′', { size: 11 * s, w: 700, col: C.muted })) + text(xa + 18 * s, y - 15 * s, 'CCA', { size: 10.5 * s, w: 700, col: col, mono: true });
  /* антикодоновая петля и антикодон */
  const ac = o.ac || 'UAG', cw = 13 * s;
  r += `<rect x="${f(x - 1.5 * cw - 3)}" y="${f(yb - 10 * s)}" width="${f(3 * cw + 6)}" height="${f(20 * s)}" rx="6" fill="#fff" stroke="${col}" stroke-width="1.6"/>`;
  for (let i = 0; i < 3; i++) r += text(x - cw + i * cw, yb, ac[i], { size: 12.5 * s, w: 700, col: '#1F3B73', mono: true });
  if (o.ends !== false) r += text(x - 1.5 * cw - 9, yb, '3′', { a: 'r', size: 10 * s, col: C.muted }) + text(x + 1.5 * cw + 9, yb, '5′', { a: 'l', size: 10 * s, col: C.muted });
  if (o.aa) r += G('aa', `<circle cx="${f(xa - 20 * s)}" cy="${f(y)}" r="${f(15 * s)}" fill="${o.aaCol || '#6A8FC4'}" stroke="#fff" stroke-width="1.5"/>` + text(xa - 20 * s, y + .5, o.aa, { size: 10.5 * s, w: 700, col: '#fff' }));
  if (o.lab) r += text(x + 14 * s, y + 40 * s, o.lab, { a: 'l', size: 11.5 * s, w: 700, col: col });
  return G(o.g || 'trna', r);
};
GN.pairs = function (x, y, codon, anti35, o) {
  /* кодон 5′→3′ (нижний ряд) и антикодон, записанный 3′→5′ над ним; o.kinds[i] — 'wc' | 'wb' | 'mm' для позиции кодона i */
  const { C, f, text, G, line, cross } = GN, cw = o.cw || 22;
  let r = '';
  for (let i = 0; i < 3; i++) {
    const xx = x + i * cw, k = o.kinds[i];
    r += text(xx, y, codon[i], { size: 14, w: 700, col: '#8A4B00', mono: true }) + text(xx, y - 38, anti35[i], { size: 14, w: 700, col: '#1F3B73', mono: true });
    if (k === 'wc') r += line(xx, y - 12, xx, y - 26, '#5A6676', 2.2);
    else if (k === 'wb') r += line(xx, y - 12, xx, y - 26, C.warn, 2.2, 'stroke-dasharray="3 3"');
    else r += cross(xx, y - 19, 5);
  }
  r += text(x - 16, y, '5′', { a: 'r', size: 10.5, col: C.muted }) + text(x + 2 * cw + 16, y, '3′', { a: 'l', size: 10.5, col: C.muted });
  r += text(x - 16, y - 38, '3′', { a: 'r', size: 10.5, col: C.muted }) + text(x + 2 * cw + 16, y - 38, '5′', { a: 'l', size: 10.5, col: C.muted });
  return G(o.g || 'anticodon', r);
};

GN.s2b = (function () {
  const { C, f, text, textN, panel, G, blob, arrow, cross } = GN;
  const AC_ILE = 'UAG', AC_VAL = 'CAG';   /* антикодоны 5′-GAU-3′ (изолейцин) и 5′-GAC-3′ (валин), записанные 3′→5′ */
  /* спаривание кодона с антикодоном 3′→5′: позиции 1–2 кодона — только канонические пары; позиция 3 — допускается G·U */
  const WC = { A: 'U', U: 'A', G: 'C', C: 'G' };
  function pairKinds(codon, ac35) {
    return [0, 1, 2].map(i => WC[codon[i]] === ac35[i] ? 'wc' : (i === 2 && ((codon[i] === 'U' && ac35[i] === 'G') || (codon[i] === 'C' && ac35[i] === 'G')) ? 'wb' : 'mm'));
  }
  function model(syn, atp, codon) {
    const act = syn === 'on' && atp === 'on';               /* изолейциладенилат и затем Ile-тРНК^Ile */
    const kIle = pairKinds(codon, AC_ILE), okIle = kIle.every(k => k !== 'mm');
    const kVal = pairKinds(codon, AC_VAL), okVal = kVal.every(k => k !== 'mm');
    let inc = 'none', dec = null;
    if (okIle) { dec = 'ile'; if (act) inc = 'Ile'; }
    else if (okVal) { dec = 'val'; if (atp === 'on') inc = 'Val'; }   /* тРНК валина заряжает своя синтетаза (её модель не меняет) */
    const pairk = okIle ? (kIle[2] === 'wb' ? 'wb' : 'wc') : 'val';
    const state = (inc === 'none' ? (atp === 'off' ? 'noatp' : 'nosyn') : 'ok') + '_' + (pairk === 'val' ? 'val' : inc === 'none' ? 'ile' : pairk);
    return { syn, atp, codon, act, charged: act, kIle, kVal, okIle, okVal, dec, inc, pairk, state };
  }
  function draw(o, t, hide) {
    let s = panel(16, 14, 568, 196, t('s2_pA'));
    /* синтетаза с активным центром; аминокислота и АТФ */
    const synOp = o.syn === 'on' ? .93 : .25;
    s += blob(140, 112, 190, 86, '#1F8A8A', 'ars', '', { op: synOp, dash: o.syn !== 'on' });
    s += text(140, 50, t('s2_lbl_syn'), { size: 11.5, w: 700, col: o.syn === 'on' ? '#16706F' : C.muted });
    /* v1.2.1 (аудит S10-03, И-06/И-22): без синтетазы изолейцин и АТФ — вне пунктирного контура отсутствующего фермента */
    const [ix, iy, ax, ay] = o.syn === 'on' ? [104, 118, 140, 106] : [268, 150, 246, 170];
    s += G('ile', `<circle cx="${ix}" cy="${iy}" r="15" fill="#6A8FC4" stroke="#fff" stroke-width="1.5"/>` + text(ix, iy + .5, 'Ile', { size: 10.5, w: 700, col: '#fff' }));
    s += G('atp', `<rect x="${ax}" y="${ay}" width="44" height="22" rx="11" fill="${o.atp === 'on' ? '#E8912A' : '#fff'}" stroke="#E8912A" stroke-width="1.4"${o.atp === 'on' ? '' : ' stroke-dasharray="3 2"'}/>` + text(ax + 22, ay + 11.5, t('s2_lbl_atp'), { size: 10.5, w: 700, col: o.atp === 'on' ? '#fff' : '#B86A12' }));
    s += textN(140, 176, t(o.act ? 's2_lbl_step_ok' : o.syn !== 'on' ? 's2_lbl_step_nosyn' : 's2_lbl_step_noatp'), { size: 11, col: o.act ? C.ink : C.bad });
    if (!o.act) s += cross(140, 145, 8);
    s += arrow(248, 112, 300, 112, o.act ? '#1F8A8A' : '#B9C2CE', 2.4);
    s += GN.trna(420, 64, { ac: AC_ILE, aa: hide ? null : (o.charged ? 'Ile' : null), g: 'trna' });
    s += text(440, 84, t('s2_lbl_trna_ile'), { a: 'l', size: 11.5, w: 700, col: '#2C7FB8' });
    if (!hide && !o.charged) s += text(330, 98, t('s2_lbl_uncharged'), { size: 11, col: C.bad, it: true });
    s += textN(440, 112, t('s2_lbl_acc_far'), { a: 'l', size: 10.5, col: C.muted });
    /* панель Б: декодирование */
    s += panel(16, 220, 568, 116, t('s2_pB'));
    s += G('codon', text(48, 312, t('s2_lbl_codon', { c: o.codon }), { a: 'l', size: 11.5, w: 700, col: '#8A4B00' }));
    s += GN.pairs(250, 312, o.codon, AC_ILE, { kinds: o.kIle });
    s += text(250 + 22, 252, t('s2_lbl_ac_ile'), { size: 11, w: 700, col: '#1F3B73' });
    if (o.dec === 'val') {
      s += GN.pairs(450, 312, o.codon, AC_VAL, { kinds: o.kVal, g: 'anticodon' });
      s += text(450 + 22, 252, t('s2_lbl_ac_val'), { size: 11, w: 700, col: '#1F3B73' });
      s += G('codon', text(450 + 22, 328, t('s2_lbl_same_codon'), { size: 10, it: true, col: '#8A4B00' }));   /* v1.2.1 (S10-03): второй ряд — тот же кодон GUC, а не следующий */
    } else s += textN(470, 280, t(o.pairk === 'wb' ? 's2_lbl_wobble' : 's2_lbl_wc'), { size: 11, col: o.pairk === 'wb' ? '#9A5B00' : C.muted });
    /* панель В: что включено */
    s += panel(16, 346, 568, 60, t('s2_pC'));
    if (hide) s += text(300, 384, t('s1_lbl_hidden'), { size: 12, it: true, col: C.muted });
    else if (o.inc === 'none') s += cross(70, 382, 8) + text(92, 382, t('s2_lbl_inc_none'), { a: 'l', size: 12, col: C.bad, w: 700 });
    else s += G('aa', `<circle cx="70" cy="382" r="14" fill="#6A8FC4"/>` + text(70, 382.5, o.inc, { size: 10.5, w: 700, col: '#fff' })) + text(92, 382, t('s2_lbl_inc_' + o.inc), { a: 'l', size: 12, w: 700 });
    return s;
  }
  const view = (a, t) => draw(model(a[0], a[1], a[2]), t, a[3] === 'hide');
  return { model, draw, view, pairKinds, AC_ILE, AC_VAL };
})();

GN.a2 = (function () {
  const { C, f, text, textN, panel, G } = GN, K = GN.code;
  const CDS = 'AUGGCCAUCGAAAAGAUCUUCGGCCAUAUUGACUAA';   /* Met Ala Ile Glu Lys Ile Phe Gly His Ile Asp стоп */
  const ILE = [3, 6, 10], NMOL = 10;
  /* учебная выборка: где в 10 молекулах оказался валин из Val-тРНК^Ile (20 % из 30 мест изолейцина) */
  const MIS = [[0, 3], [1, 10], [3, 6], [4, 3], [6, 10], [8, 6]];
  /* разрозненные ошибки декодирования: молекула, позиция, включённая аминокислота (близкородственная тРНК) */
  const DEC = [[2, 5, 'N'], [5, 7, 'L'], [7, 9, 'Q'], [9, 4, 'D']];   /* v1.1 (Р-22): все четыре — несовпадение в третьей позиции кодона (K→N на AAG, а не K→R)*/
  function model(edit, dec, mrna) {
    const base = K.translate(CDS, 0).aa;
    const seq = mrna === 'gene' ? CDS.slice(0, 15) + 'GUC' + CDS.slice(18) : CDS;   /* кодон 6: AUC → GUC */
    const tpl = K.translate(seq, 0).aa;
    const mol = Array.from({ length: NMOL }, () => tpl.slice());
    if (edit === 'off') MIS.forEach(([r, p]) => { if (tpl[p - 1] === 'I') mol[r][p - 1] = 'V'; });
    if (dec === 'low') DEC.forEach(([r, p, a]) => { mol[r][p - 1] = a; });
    const cells = []; let atIle = 0, other = 0;
    mol.forEach((m, r) => m.forEach((a, i) => { if (a !== base[i]) { cells.push([r, i + 1, a]); if (ILE.includes(i + 1)) atIle++; else other++; } }));
    const pos = [...new Set(cells.map(c => c[1]))].sort((a, b) => a - b);
    const allSame = pos.length === 1 && cells.length === NMOL;
    const kinds = [...new Set(cells.map(c => base[c[1] - 1] + '>' + c[2]))];
    const valTrna = edit === 'off' ? 20 : 0;   /* условная доля тРНК^Ile, несущих валин, % */
    return { edit, dec, mrna, base, mol, cells, n: cells.length, atIle, other, pos, kinds, allSame, valTrna, seq, key: [edit, dec, mrna].join('_') };
  }
  function draw(o, t, mode) {
    /* mode: 'inv' — обратная задача: исследована только позиция 6 (остальные позиции и мРНК скрыты) */
    let s = panel(16, 14, 568, 92, t('a2_pA'));
    const tr = K.translate(o.seq, 0);
    const row = GN.ntRow(60, 64, o.seq, { tr, cell: 11.8, gap: 3, size: 12, mark: o.mrna === 'gene' ? [{ k: 'sub', i: 15 }] : [] });
    s += mode === 'inv' ? text(300, 66, t('a2_lbl_mrna_hidden'), { size: 12, it: true, col: C.muted }) : row.svg;
    if (mode !== 'inv') ILE.forEach(p => { s += text(row.X((p - 1) * 3) + 1.5 * 11.8, 92, t('a2_lbl_ile'), { size: 10, col: '#1F3B73', w: 700 }); });
    s += panel(16, 114, 568, 248, t('a2_pB'));
    const A3 = K.A3, bw = 40, x0 = 92, y0 = 150;
    for (let i = 0; i < o.base.length; i++) s += text(x0 + i * (bw + 3) + bw / 2, y0 - 2, String(i + 1), { size: 10, col: ILE.includes(i + 1) ? '#1F3B73' : C.muted, w: ILE.includes(i + 1) ? 700 : 500 });
    let mols = '';
    o.mol.forEach((m, r) => {
      const y = y0 + 18 + r * 19.5;
      mols += text(40, y, t('a2_lbl_mol', { n: r + 1 }), { a: 'l', size: 10, col: C.muted });
      m.forEach((a, i) => {
        const ch = a !== o.base[i], xx = x0 + i * (bw + 3);
        if (mode === 'inv' && i !== 5) { mols += `<rect x="${f(xx)}" y="${f(y - 8)}" width="${bw}" height="16" rx="8" fill="#F4F6F9" stroke="#D3DAE3" stroke-width=".8"/>` + text(xx + bw / 2, y + .5, '?', { size: 9.5, col: '#9AA3AE' }); return; }
        mols += `<rect x="${f(xx)}" y="${f(y - 8)}" width="${bw}" height="16" rx="8" fill="${ch ? '#F6C9C3' : '#E7EEF7'}" stroke="${ch ? C.bad : '#B8C8DD'}" stroke-width="${ch ? 1.4 : .8}"/>` +
          text(xx + bw / 2, y + .5, A3[a], { size: 9.5, w: ch ? 700 : 500, col: ch ? '#8E2A1F' : '#3C5070' });
      });
    });
    s += G('polypeptide', mols);
    s += panel(16, 370, 568, 38, '');
    s += mode === 'inv' ? text(300, 389, t('a2_lbl_inv', { n: o.mol.filter(m => m[5] !== o.base[5]).length }), { size: 11.5, w: 700, col: C.bad })
      : text(300, 389, t('a2_lbl_count', { n: o.n, i: o.atIle, o: o.other }), { size: 11.5, w: 700, col: o.n ? C.bad : C.ink });
    return s;
  }
  const view = (a, t) => draw(model(a[0], a[1], a[2]), t, a[3]);
  return { model, draw, view, CDS, ILE, MIS, DEC, NMOL };
})();

/* =====================================================================
   s0_gn_s3.js — вкладка 3 «Рибосомный цикл трансляции»: базовая сцена 3b и исследование 3a.
   3b (MBoC7, с. 365–375, рис. 6–68, 6–69, 6–73, 6–76): мРНК 5′…AUG CAC UGG GAA UGA…3′; рибосома 80S с участками E, P, A
   (слева направо при записи мРНК 5′→3′). Этапы (учебная последовательность моментов, не временная шкала):
   1 — инициация: инициаторная Met-тРНК в P-сайте напротив AUG, A-сайт свободен;
   2 — вход аминоацил-тРНК (His-тРНК) в A-сайт; 3 — пептидная связь: цепь переходит с тРНК в P-сайте на аминокислоту
   тРНК в A-сайте; 4 — транслокация на один кодон (три нуклеотида) к 3′-концу: тРНК из A — в P, из P — в E;
   5 — ещё два цикла: в A-сайте стоп-кодон UGA; 6 — терминация: фактор терминации eRF1 в A-сайте, полипептид освобождён.
   Детали: все компоненты / нет фактора транслокации eEF2 / нет фактора терминации eRF1.
   3a — условный поток рибосом по одной мРНК (детерминированная модель с дискретным временем, сим. sim()).
   ===================================================================== */
GN.s3b = (function () {
  const { C, f, text, textN, panel, G, line, arrow, cross } = GN, A3 = GN.code.A3;
  const COD = ['AUG', 'CAC', 'UGG', 'GAA', 'UGA'], AA = ['M', 'H', 'W', 'E'];
  const AC = { M: 'UAC', H: 'GUG', W: 'ACC', E: 'CUU' };   /* антикодоны, записанные 3′→5′ над кодоном */
  const tr = (aa, chain, ini) => ({ aa, chain: chain || [], ini: !!ini });   /* тРНК: для какой аминокислоты, что несёт */
  /* состояние на этапе st (1–6) при наборе деталей comp: 'all' | 'noeef2' | 'noerf1' */
  function model(st, comp) {
    st = +st;
    let s = st, block = null;
    if (comp === 'noeef2' && st >= 4) { s = 3; block = 'transloc'; }
    if (comp === 'noerf1' && st === 6) { s = 5; block = 'term'; }
    let pP = 0, E = null, P = null, A = null, free = null, erf = false;
    if (s === 1) { P = tr('M', ['M'], 1); }
    if (s === 2) { P = tr('M', ['M'], 1); A = tr('H', ['H']); }
    if (s === 3) { P = tr('M', [], 1); A = tr('H', ['M', 'H']); }
    if (s === 4) { pP = 1; E = tr('M', [], 1); P = tr('H', ['M', 'H']); }
    if (s === 5) { pP = 3; E = tr('W', []); P = tr('E', ['M', 'H', 'W', 'E']); }
    if (s === 6) { pP = 3; P = tr('E', []); erf = true; free = ['M', 'H', 'W', 'E']; }
    const chainOn = free ? 'free' : (A && A.chain.length > 1) || (A && P && !P.chain.length && A.chain.length) ? 'A' : 'P';
    const chain = free || (chainOn === 'A' ? A.chain : P ? P.chain : []);
    return { st, comp, s, block, pP, E, P, A, erf, free, chain, chainOn, state: block ? block : 's' + s, key: st + '_' + comp };
  }
  /* рисунок тРНК в рибосоме: столбик с антикодоном внизу (над кодоном) и 3′-концом вверху */
  function trnaV(x, yb, o, ac) {
    const col = o.ini ? '#1F6E5A' : '#2C7FB8';
    let r = `<rect x="${f(x - 13)}" y="${f(yb - 98)}" width="26" height="80" rx="9" fill="${col}" opacity=".8"/>` +
      `<rect x="${f(x - 22)}" y="${f(yb - 22)}" width="44" height="18" rx="6" fill="#fff" stroke="${col}" stroke-width="1.4"/>` +
      text(x, yb - 12.5, ac, { size: 12, w: 700, col: '#1F3B73', mono: true }) +
      /* v1.2.1 (аудит S10-06, И-19): ориентация антикодона — 3′ слева, 5′ справа, над кодоном 5′→3′ (антипараллельно) */
      G('anticodon', text(x - 19, yb - 27, '3′', { size: 9, w: 700, col: C.muted }) + text(x + 19, yb - 27, '5′', { size: 9, w: 700, col: C.muted }));
    return G(o.ini ? 'trnai' : 'trna', r);
  }
  function bead(x, y, a, cls) {
    return `<circle cx="${f(x)}" cy="${f(y)}" r="13" fill="${cls === 'new' ? '#E8912A' : '#6A8FC4'}" stroke="#fff" stroke-width="1.5"/>` + text(x, y + .5, A3[a], { size: 9.5, w: 700, col: '#fff' });
  }
  /* цепь на тРНК: от 3′-конца тРНК вверх через туннель большой субчастицы; N-конец — дальше всего от тРНК */
  function chainUp(x, ytop, chain) {
    let r = '';
    chain.slice().reverse().forEach((a, i) => { r += bead(x + i * 9, ytop - 12 - i * 25, a, i === 0 && chain.length > 1 ? 'new' : 'old'); });
    if (chain.length) r += text(x + (chain.length - 1) * 9 + 18, ytop - 12 - (chain.length - 1) * 25, 'N', { a: 'l', size: 12, w: 700 });
    return G('polypeptide', r);
  }
  function draw(o, t) {
    let s = panel(16, 14, 568, 300, t('s3_pA'));
    const cw = 66, x0 = 300 - (o.pP + .5) * cw, ym = 262;   /* P-сайт — по центру схемы */
    const X = i => x0 + i * cw;
    /* субчастицы рибосомы */
    s += G('large', `<path d="M${f(X(o.pP - 1) - 22)},${f(ym - 40)} Q${f(X(o.pP - 1) - 30)},${f(ym - 168)} ${f(300)},${f(ym - 172)} Q${f(X(o.pP + 2) + 30)},${f(ym - 168)} ${f(X(o.pP + 2) + 22)},${f(ym - 40)} Z" fill="#DCE5F0" stroke="#9FB2CB" stroke-width="1.5"/>`);
    s += G('small', `<path d="M${f(X(o.pP - 1) - 26)},${f(ym + 8)} Q${f(300)},${f(ym + 56)} ${f(X(o.pP + 2) + 26)},${f(ym + 8)} Z" fill="#C9D6E8" stroke="#9FB2CB" stroke-width="1.5"/>`);
    s += text(X(o.pP + 2) + 30, ym - 150, t('s3_lbl_large'), { a: 'l', size: 10.5, col: C.muted }) + text(X(o.pP + 2) + 30, ym + 30, t('s3_lbl_small'), { a: 'l', size: 10.5, col: C.muted });
    /* участки E, P, A — над кодонами pP−1, pP, pP+1; буквы — под кодонами, чтобы не перекрываться растущей цепью */
    ['E', 'P', 'A'].forEach((k, j) => { const x = X(o.pP - 1 + j) + cw / 2;
      s += G('site' + k, `<rect x="${f(x - 30)}" y="${f(ym - 128)}" width="60" height="112" rx="8" fill="#fff" fill-opacity=".35" stroke="#9FB2CB" stroke-dasharray="4 3"/>` + text(x, ym + 27, k, { size: 13, w: 800, col: '#1F3B73' })); });
    /* мРНК: кодоны */
    s += G('mrna', line(20, ym, 580, ym, C.rna, 2.2));
    COD.forEach((c, i) => { const x = X(i);
      if (x < 22 || x + cw > 580) return;
      s += G(i === 0 ? 'startc' : c === 'UGA' ? 'stopc' : 'codon', `<rect x="${f(x + 4)}" y="${f(ym - 10)}" width="${cw - 8}" height="20" rx="4" fill="${i === 0 ? '#E2F3E8' : c === 'UGA' ? '#FBE3E0' : '#FFF5E8'}" stroke="${i === 0 ? C.ok : c === 'UGA' ? C.bad : C.rna}"/>` +
        text(x + cw / 2, ym + .5, c, { size: 12.5, w: 700, col: '#8A4B00', mono: true })); });
    s += text(24, ym + 24, '5′', { a: 'l', size: 11, w: 700, col: C.muted }) + text(576, ym + 24, '3′', { a: 'r', size: 11, w: 700, col: C.muted });
    /* тРНК и фактор терминации */
    const site = (k, j) => X(o.pP - 1 + j) + cw / 2;
    const pos = { E: site('E', 0), P: site('P', 1), A: site('A', 2) };
    ['E', 'P', 'A'].forEach(k => { const v = o[k]; if (!v) return; s += trnaV(pos[k], ym - 6, v, AC[v.aa]); });
    if (o.erf) s += G('erf1', `<rect x="${f(pos.A - 14)}" y="${f(ym - 104)}" width="28" height="98" rx="10" fill="#B85C00" opacity=".9"/>` + text(pos.A, ym - 56, 'eRF1', { size: 9.5, w: 800, col: '#fff' }));
    if (o.E && o.s >= 4) s += arrow(pos.E - 18, ym - 112, pos.E - 52, ym - 132, C.muted, 1.8, '3 3');
    /* полипептид */
    if (o.chainOn === 'P' && o.P) s += chainUp(pos.P, ym - 104, o.P.chain);
    if (o.chainOn === 'A' && o.A) s += chainUp(pos.A, ym - 104, o.A.chain);
    /* v1.1 (Р-05): аминокислота на 3′-конце аминоацил-тРНК в A-сайте, пока цепь ещё на тРНК в P-сайте */
    if (o.chainOn === 'P' && o.A && o.A.chain.length === 1) s += G('aa', bead(pos.A, ym - 116, o.A.chain[0], 'old'));
    if (o.free) { let r = ''; o.free.forEach((a, i) => { r += bead(420 + i * 30, 46, a, 'old'); });

GN.a3 = (function () {
  const { C, f, text, textN, panel, G, line } = GN;
  /* Условный поток рибосом (учебная модель, единицы времени условные):
     кодирующая область L = 120 кодонов; рибосома занимает F = 10 кодонов и не обгоняет соседнюю;
     время на кодоне — step (обычный кодон) или slow (кодон 80, для которого мало аминоацил-тРНК);
     инициация возможна раз в ki единиц; если начало мРНК занято, инициация ждёт (одна отложенная),
     следующая возможность в это время пропускается («пропущена»). Наблюдение — момент T = 600. */
  const L = 120, F = 10, S = 80, T = 600;
  function sim(ki, slow, step, Tend = T) {
    ki = +ki; slow = +slow; step = +step;
    const dwell = p => p === S ? slow : step;
    let rib = [], init = 0, done = 0, missed = 0, pending = false, firstDone = null;
    for (let t = 1; t <= Tend; t++) {
      /* рибосомы от 3′-конца к 5′-концу */
      const next = [];
      for (let i = 0; i < rib.length; i++) {
        const r = rib[i]; r.rem -= 1;
        if (r.rem <= 0) {
          if (r.p === L) { done++; if (firstDone == null) firstDone = t; continue; }   /* стоп-кодон: полипептид освобождён */
          const ahead = next.length ? next[next.length - 1] : null;
          if (ahead && ahead.p - (r.p + 1) < F) r.rem = 0;               /* впереди рибосома: ждёт */
          else { r.p += 1; r.rem = dwell(r.p); }
        }
        next.push(r);
      }
      rib = next;
      if (t % ki === 0) { if (pending) missed++; pending = true; }
      const last = rib.length ? rib[rib.length - 1] : null;
      if (pending && (!last || last.p - 1 >= F)) { rib.push({ p: 1, rem: dwell(1) }); init++; pending = false; }
    }
    const up = rib.filter(r => r.p <= S).length, down = rib.length - up;
    const waiting = rib.filter(r => r.rem <= 0 || r.p === S).length;

    s += G('stopc', line(Xc(L), y - 12, Xc(L), y + 12, C.bad, 2.4)) + text(Xc(L), y + 26, t('a3_lbl_stop'), { size: 10.5, col: C.bad, w: 700 });
    s += G('slowc', `<rect x="${f(Xc(S) - 5)}" y="${f(y - 9)}" width="10" height="18" rx="2" fill="${+o.slow > 1 ? '#C77700' : '#F6D7AE'}"/>`) + text(Xc(S), y + 26, t('a3_lbl_slow'), { size: 10.5, col: '#9A5B00', w: 700 });

      s += G('ribosome', `<rect x="${f(x)}" y="${f(y - 26)}" width="${f((x1 - x0) / L * F - 4)}" height="40" rx="14" fill="#9FB2CB" opacity=".85" stroke="#fff"/>`); });
    /* v1.2 (рецензия интерактива И-24): место задержки (кодон 80) отмечено над строкой — рибосомы очереди его не закрывают */
    s += G('slowc', `<path d="M${f(Xc(S) - 6)},${f(y - 38)} l6,8 l6,-8 z" fill="${+o.slow > 1 ? '#C77700' : '#E8B77A'}"/>`);
    s += text(300, 162, t('a3_lbl_scale'), { size: 10.5, col: C.muted });
    s += panel(16, 194, 568, 214, t('a3_pB'));
    const vals = [['a3_b_init', o.init, '#6A8FC4'], ['a3_b_on', o.on, '#9FB2CB'], ['a3_b_done', o.done, '#2E9B57'], ['a3_b_missed', o.missed, '#C77700']];

GN.a4 = (function () {
  const { C, f, text, textN, panel, G, line } = GN;
  /* Баланс за условный период (все доли — учебные допущения):
     S — синтезировано полипептидов; T = round(S·pt) — преждевременно завершённых (укороченных); F = S − T — полноразмерных;
     Fo = round(F·ef) — правильно свёрнутых; M = F − Fo — неправильно свёрнутых;
     удалено системой контроля качества: Td = round(T·q), Md = round(M·q); удалено правильно свёрнутых (обычный оборот): Fd = round(Fo·r);

    const D = Td + Md + Fd, R = S - D, A = Fo - Fd;

})();

/* =====================================================================
   s0_go_s1.js — кадры анимации вкладки 1 (Claude Code, v1.1.1). Только практикум: в «Объяснения» (widgets.js = s0_gn*.js) не входит.
   Правило: кадр рисует ту же модель, что статичная схема (GN.s1b.draw, GN.a1.draw); конечный кадр (T = 4) — сама статичная схема.

   освобождается, субчастицы расходятся. Изменённая мРНК читается до своего стоп-кодона (в исходах non, ins1, del1 — до нового):
   серые нуклеотиды за ним рибосома не проходит.

GN.ribo = function (x, y, w, o = {}) {
  /* рибосома на строке мРНК: малая субчастица под строкой, большая — над ней; o.big — непрозрачность большой (0 — ещё не присоединилась) */
  const { f, G } = GN, op = o.op == null ? 1 : o.op, big = o.big == null ? 1 : o.big, h = o.h || 17;
  let s = `<rect x="${f(x - 6)}" y="${f(y + 1)}" width="${f(w + 12)}" height="${f(h)}" rx="${f(h / 2)}" fill="#9FB2CB" fill-opacity=".45" stroke="#6F86A6" stroke-width="1.2" opacity="${f(op)}"/>`;
  if (big > 0) s += `<rect x="${f(x - 8)}" y="${f(y - h - 2)}" width="${f(w + 16)}" height="${f(h + 1)}" rx="${f(h / 2)}" fill="#C9D6E8" fill-opacity=".45" stroke="#6F86A6" stroke-width="1.2" opacity="${f(op * big)}"/>`;
  return G('ribosome', s);
};
/* левый край кодона с дробным номером p (рибосома между кодонами): X — расстановка букв строки */
GN.xAt = function (X, p) { const c = Math.max(0, Math.floor(p + 1e-9)), u = p - c; return X(3 * c) + u * (X(3 * c + 3) - X(3 * c)); };

(function () {
  const M = GN.s1b, K = GN.code, { C, f, text, panel, ease } = GN;
  const keys = () => ['s1_tl_1', 's1_tl_2', 's1_tl_3', 's1_tl_4'];
  /* классы бусин полипептида — как в статичной схеме */
  function cls(o) {
    const c = o.cl, n = o.norm.aa.length, m = o.alt.aa.length;

  }
  /* положение рибосомы (в кодонах изменённой мРНК от старт-кодона) и число прочитанных кодонов в момент T */
  function at(o, T) {

    if (T < 1) return { p: 0, read: T > .85 ? 1 : 0, small: ease(T / .7), big: ease((T - .75) / .25), op: ease(T / .3) };
    if (T < 3) { const q = (T - 1) / 2 * nS, c = Math.floor(q), p = Math.min(nS, c + ease((q - c - .55) / .45)); return { p, read: Math.min(nS, c + 1), small: 1, big: 1, op: 1 }; }   /* v1.2 (И-16): рибосома стоит на кодоне и сдвигается на три нуклеотида */
    const u = T - 3;

  }

    if (T >= 4 - 1e-4) return M.draw(o, t);

    let s = panel(16, 14, 568, 150, t('s1_pA'));
    const rn = GN.ntRow(118, 66, CDS + UTR3, { tr: K.translate(CDS + UTR3, 0), max: 32, cell: 12, g: 'mrna' }, t);
    s += text(28, 66, t('s1_lbl_norm'), { a: 'l', size: 11.5, w: 700, col: C.muted }) + rn.svg;
    const altS = o.seq.slice(ST), altT = K.translate(altS, 0), a = at(o, T), part = GN.trPart(altT, a.read);
    /* рибосома под буквами: сначала её рисунок, затем строка мРНК */

    const xr = T < 1 ? ra0.X(0) - 24 * (1 - a.small) : GN.xAt(ra0.X, a.p);   /* малая субчастица появляется у 5′-конца (подпись строки не закрывает) */
    s += text(28, 130, t('s1_lbl_alt'), { a: 'l', size: 11.5, w: 700, col: C.muted });
    if (a.op > .02) s += GN.ribo(xr - 1.5, 130, 3 * 12 + 1, { op: a.op, big: a.big });
    s += GN.ntRow(118, 130, altS, { tr: part, sp, mark: o.mark, max: 32, cell: 12, g: 'mrna' }, t).svg;
    s += panel(16, 174, 568, 150, t('s1_pB'));
    const k = cls(o), nb = Math.min(o.alt.aa.length, T < 1 ? 0 : a.read);

    s += text(28, 282, t('s1_lbl_alt'), { a: 'l', size: 12, w: 700, col: C.muted });
    if (nb) s += GN.pepRow(118, 282, o.alt.aa.slice(0, nb), { cls: k.cc.slice(0, nb), g: 'polypeptide' });   /* v1.2 (И-17): C-конец отмечен с первой бусины */
    s += text(300, 310, t('s1_lbl_dir'), { size: 11, col: C.muted });
    s += panel(16, 334, 568, 72, t('s1_pC'));
    return s;
  };
})();

/* ---------- 1a: те же этапы на двух строках (исходная и изменённая мРНК) ---------- */
(function () {
  const M = GN.a1, K = GN.code, { C, f, text, panel, ease } = GN;
  M.stageKeys = () => ['s1_tl_1', 's1_tl_2', 's1_tl_3', 's1_tl_4'];
  const spOf = (tr, read) => read >= tr.cod.length ? tr : { end: 1e6 };
  function at(n, T, nmax) {   /* n — смысловые кодоны строки; nmax — у более длинной строки: скорость рибосом одинакова (v1.2, И-18) */
    if (T < 1) return { p: 0, read: T > .85 ? 1 : 0, small: ease(T / .7), big: ease((T - .75) / .25), op: ease(T / .3) };
    if (T < 3) { const q = Math.min(n, (T - 1) / 2 * nmax), c = Math.floor(q), p = Math.min(n, c + ease((q - c - .55) / .45)); return { p, read: Math.min(n, c + 1), small: 1, big: 1, op: 1 }; }
    const u = T - 3; return { p: n, read: n + 1, small: 1, big: 1, op: 1 - ease((u - .55) / .4), rel: u > .3 };
  }
  M.frame = function (o, T, t) {
    if (T >= 4 - 1e-4) return M.draw(o, t);
    let s = panel(16, 14, 568, 160, t('a1_pA'));
    const SEQ = M.SEQ, w0 = o.k <= 4 ? 0 : (o.k - 4) * 3, mx = Math.max(o.norm.end, o.alt.end) + 3, c0 = w0 / 3;
    const opt = { cell: 10.4, gap: 2.4, size: 11.5, start: w0 === 0 };
    const nmax = Math.max(o.norm.aa.length, o.alt.aa.length);
    const row = (q, tr, y, mark, n) => {
      const a = at(n, T, nmax), sub = q.slice(w0, Math.min(q.length, mx)), trw = K.translate(q.slice(w0), 0);
      const kk = Math.max(0, a.read - c0), part = GN.trPart(trw, kk), sp = spOf(trw, kk);
      const r0 = GN.ntRow(62, y, sub, Object.assign({ tr: trw, sp, mark }, opt), t);
      let r = '';
      const pc = a.p - c0;   /* положение рибосомы в окне (в кодонах) */
      if (a.op > .02 && (T >= 1 ? pc >= -.01 : w0 === 0)) {
        const xr = T < 1 ? r0.X(0) - 24 * (1 - a.small) : GN.xAt(r0.X, pc);
        r += GN.ribo(xr - 1.5, y, 3 * 10.4 + 1, { op: a.op, big: a.big, h: 15 });
      }
      r += GN.ntRow(62, y, sub, Object.assign({ tr: part, sp, mark }, opt), t).svg;
      return { s: r, X: r0.X, a };
    };
    const rn = row(SEQ, o.norm, 76, [], o.norm.aa.length);
    s += text(30, 54, t('a1_lbl_n'), { a: 'l', size: 11, w: 700, col: C.muted }) + rn.s;
    const ra = row(o.seq, o.alt, 142, o.mark.map(m => Object.assign({}, m, { i: m.i - w0 })), o.alt.aa.length);
    s += text(30, 106, t('a1_lbl_a'), { a: 'l', size: 11, w: 700, col: C.muted }) + ra.s;
    const xk = rn.X((o.k - 1) * 3 - w0) + 15;
    s += GN.G('codon', text(xk, 98, t('a1_lbl_site', { k: o.k }), { size: 10.5, w: 700, col: C.bad }));
    if (w0) s += text(300, 164, t('a1_lbl_window', { k: o.k - 3 }), { size: 10.5, col: C.muted });
    s += panel(16, 184, 568, 222, t('a1_pB'));
    const n = o.norm.aa.length, m = o.alt.aa.length, c = o.cl;
    const cn = Array.from({ length: n }, (_, i) => i >= c.p && i < n - c.q ? 'lost' : 'same');
    const cc = Array.from({ length: m }, (_, i) => i >= c.p && i < m - c.q ? 'new' : 'same');
    const bn = T < 1 ? 0 : Math.min(n, rn.a.read), bm = T < 1 ? 0 : Math.min(m, ra.a.read);

    if (bn) s += GN.pepRow(52, 242, o.norm.aa.slice(0, bn), { cls: cn.slice(0, bn).map((c, i) => i < bm ? c : 'same'), bw: 27, h: 18, size: 9.5, g: 'polypeptide' });
    s += text(30, 276, t('a1_lbl_a'), { a: 'l', size: 11, w: 700, col: C.muted });
    if (bm) s += GN.pepRow(52, 298, o.alt.aa.slice(0, bm), { cls: cc.slice(0, bm), bw: 27, h: 18, size: 9.5, g: 'polypeptide' });
    return s;
  };
})();

/* =====================================================================
   s0_go_s2.js — кадры анимации вкладки 2 (Claude Code, v1.1.2). Только практикум (в «Объяснения» не входит).

   3 — антикодон тРНК спаривается с кодоном A-сайта антипараллельно (в третьей позиции допускается G·U); при GUC тРНК изолейцина
   не удерживается, кодон декодирует тРНК валина; 4 — аминокислота включается в полипептид. Без синтетазы (кодоны изолейцина)
   и без АТФ — остановка на этапе 1. Конечный кадр — статичная схема GN.s2b.draw.
   2a: 1 — аминоацилирование (10 тРНК изолейцина; без коррекции 20 % несут валин — доля модели); 2 — рибосома проходит мРНК;

(function () {
  const M = GN.s2b, { C, f, text, textN, panel, G, blob, arrow, cross, line, ease } = GN;
  M.plan = function (o) {

    if (o.atp !== 'on') return { keys: ['s2_tl_1', 's2_tl_2', 's2_tl_3', 's2_tl_4'], end: 1, stopKey: 's2_tl_stop_atp' };
    if (o.syn !== 'on' && !gu) return { keys: ['s2_tl_1', 's2_tl_2', 's2_tl_3', 's2_tl_4'], end: 1, stopKey: 's2_tl_stop_syn' };
    return { keys: [o.syn !== 'on' ? 's2_tl_1v' : 's2_tl_1', o.syn !== 'on' ? 's2_tl_2v' : 's2_tl_2', gu ? 's2_tl_3v' : 's2_tl_3', 's2_tl_4'], end: 4, stopKey: null };   /* v1.2, И-05 */
  };

      if (op > 0) r += `<g opacity="${f(op)}">` + text(xx, y - 38 - dy, anti[i], { size: 14, w: 700, col: '#1F3B73', mono: true }) + '</g>';
      if (lines) { if (k === 'wc') r += line(xx, y - 12, xx, y - 26, '#5A6676', 2.2); else if (k === 'wb') r += line(xx, y - 12, xx, y - 26, C.warn, 2.2, 'stroke-dasharray="3 3"'); else r += cross(xx, y - 19, 5); }
    }
    r += text(x - 16, y, '5′', { a: 'r', size: 10.5, col: C.muted }) + text(x + 2 * cw + 16, y, '3′', { a: 'l', size: 10.5, col: C.muted });
    if (op > 0) r += `<g opacity="${f(op)}">` + text(x - 16, y - 38 - dy, '3′', { a: 'r', size: 10.5, col: C.muted }) + text(x + 2 * cw + 16, y - 38 - dy, '5′', { a: 'l', size: 10.5, col: C.muted }) + '</g>';

  }
  const ileC = (x, y, g = 'ile') => G(g, `<circle cx="${f(x)}" cy="${f(y)}" r="15" fill="#6A8FC4" stroke="#fff" stroke-width="1.5"/>` + text(x, y + .5, 'Ile', { size: 10.5, w: 700, col: '#fff' }));
  const lerp = (a, b, u) => a + (b - a) * u;
  M.frame = function (o, T, t) {

    let s = panel(16, 14, 568, 196, t('s2_pA'));
    const synOp = o.syn === 'on' ? .93 : .25;

    s += text(140, 50, t('s2_lbl_syn'), { size: 11.5, w: 700, col: o.syn === 'on' ? '#16706F' : C.muted });
    /* этап 1: изолейцин и АТФ входят в активный центр */

/* =====================================================================

/* ---------- 3a: положение рибосом во времени ---------- */
(function () {

/* =====================================================================

(function () {
  const M = GN.s4b, { C, f, text, textN, panel, G, line, arrow, cross, blob, ease } = GN, { domain, coil } = M._;

    if (o.ups === 'on') return { keys: ['s4_tl_1', 's4_tl_2n', 's4_tl_3', 's4_tl_4', 's4_tl_5'], end: 5, stopKey: null, halt: false };
    const k5 = o.ups === 'noe3' ? 's4_tl_5e' : 's4_tl_5p';   /* v1.2.1, S10-04 */

    s += G('startc', line(X(1), y - 15, X(1), y + 15, C.ok, 2.4)) + text(X(1), y + 28, 'AUG', { size: 10.5, w: 700, col: C.ok });
    s += G('stopc', line(X(PTC[o.stop]), y - 16, X(PTC[o.stop]), y + 16, C.bad, 3)) + text(X(PTC[o.stop]) + (PTC[o.stop] > 400 ? 6 : 0), y + 28, t('s4_lbl_stop', { k: PTC[o.stop] }), { a: PTC[o.stop] > 400 ? 'r' : 'm', size: 10.5, w: 700, col: C.bad });
    if (o.stop !== 'norm') s += text(X(LEN), y - 22, t('s4_lbl_normstop'), { a: 'r', size: 10, col: C.muted });
    if (o.d2 && cot) s += text(300, 118, t('s4_lbl_cotrans'), { size: 10.5, col: C.muted });   /* v1.2, И-01 */

  /* панель Б во время синтеза: c — сколько аминокислот вышло; fd1 — домен 1 свернулся (0…1); fd2 — домен 2; rib — рибосома на конце цепи */

      [140, 196, 252].forEach(x => { if (xe >= x + 4) s += G('hydrophobic', `<circle cx="${x}" cy="${yb - 8}" r="6" fill="#E8912A" stroke="#fff"/>`); });
      if (rib > .02) s += `<g opacity="${f(rib)}">` + G('ribosome', `<rect x="${f(xe + 4)}" y="${f(cy - 18)}" width="36" height="34" rx="12" fill="#9FB2CB" opacity=".85" stroke="#fff"/>`) + '</g>';
      return s + (lab ? textN(470, yb - 10, t('s4_lbl_len', { n: o.len }) + '\n' + t('s4_lbl_prod_' + o.stop), { size: 11.5, col: C.ink }) : '');

    /* за доменом 1: соединительный участок и домен 2 по мере выхода (в конечном кадре — как статичная схема) */
    let xr = xd;   /* конец вышедшей цепи — у рибосомы */

      const xl = 204 + Math.min(1, (c - D1) / (LK - D1)) * 58;
      if (o.stop === 'link') s += coil(204, cy, Math.max(6, Math.min(34, xl - 204)), '#BBD0EA', 2, 'unfolded');

      if (c > LK) { const w = (c - LK) / (M.LEN - LK), x2 = 262 + w * 76;
        if (fd2 < 1) s += `<g opacity="${f(1 - fd2)}">` + coil(262, cy, Math.max(8, x2 - 262), '#2E4E86', Math.max(1, Math.round(5 * w)), 'unfolded') + '</g>';
        if (fd2 > 0) s += `<g opacity="${f(fd2)}">` + domain(300, cy, 40, '#2E4E86', 'domain') + text(300, cy, t('s4_lbl_d2s'), { size: 10.5, w: 700, col: '#fff' }) + '</g>';
        xr = x2; }
    }
    if (rib > .02) s += `<g opacity="${f(rib)}">` + G('ribosome', `<rect x="${f(xr + 4)}" y="${f(cy - 18)}" width="36" height="34" rx="12" fill="#9FB2CB" opacity=".85" stroke="#fff"/>`) + '</g>';
    return s + (lab ? textN(470, yb - 10, t('s4_lbl_len', { n: o.len }) + '\n' + t('s4_lbl_prod_' + o.stop), { size: 11.5, col: C.ink }) : '');
  }

    /* где рибосома: этап 1 — до кодона 100, этап 2 — до стоп-кодона, этап 3 — на стоп-кодоне, затем расходится */
    const c = k === 1 ? 1 + ease(u) * 99 : k === 2 ? 100 + ease(u) * (cEnd - 100) : cEnd;
    const rOp = k < 3 ? 1 : k === 3 ? 1 - ease(cl((u - .45) / .4)) : 0;

    const fd1 = o.stop === 'norm' ? (c >= M.D1 + 30 ? ease(cl((c - M.D1 - 30) / 15)) : 0) : o.stop === 'link' && k >= 3 ? ease(cl((u - .45) / .45)) : 0;
    const fd2 = o.d2 && k >= 3 ? ease(cl((u - .45) / .45)) : 0;

      const w = k > 4 ? 1 : ease(cl(u / .7));

    }

      }
    }

  };

/* ---------- 4a: строки баланса по этапам пути от синтеза к активному белку ---------- */
(function () {
  const M = GN.a4;
  M.stageKeys = o => [1, 2, 3, 4, 5].map(i => 's4a_tl_' + i + (i === 2 && o && !(+o.pt > 0) ? 'z' : ''));   /* v1.2, И-14 */

  M.frame = function (o, T, t) {

    const k = Math.min(5, Math.floor(T) + 1), u = T - (k - 1);
    return M.draw(o, t, null, i => i < k ? 1 : i === k ? Math.min(1, u / .6) : 0);

/* =====================================================================
   s0_motion.js — время в схемах курса «Биология» (движок из образца семинара 3, v1.9).
   timeStrip — шкала этапов под схемой: запуск, ползунок, этапы, остановка на блоке.
   stageView — возврат схемы на экран при запуске (телефон).
   Семинар 8 (из семинара 7 v1.5): формы мембраны MF не нужны; справка по деталям — группы data-g (GN.G), она включена
   всегда в практикуме, а на странице «Объяснений» не используется.
   Правило: модель сцены остаётся чистой функцией; время только показывает её результат.
   Русского текста здесь нет: все подписи — через t().
   ===================================================================== */
/* Шкала этапов под схемой сцены K. o.render(T) рисует кадр; T — от 0 до числа этапов, этап i занимает отрезок [i, i+1]. */
const TLS = {};   /* шкалы этапов по ключам сцен: нужны для остановки при смене сцены (ТА-01) */
function timeStrip(K, o) {
  const P = 'tl' + K, st = { T: 0, n: 1, stop: 1, keys: [], stopKey: null, on: false, text: '', until: null };
  const calm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  $('sc' + K).querySelector('.stage').insertAdjacentHTML('beforeend',
    `<div class="tl" id="${P}"><div class="tlrow"><button type="button" class="btn tlplay" id="${P}b"></button>` +
    /* v1.4 (продвинутые сцены): «◀ Шаг», «Шаг ▶», «Сначала» — пошаговый ход (ТЗ 3.1, 4.2, 9.1; рецензия v1.3, Н-15) */
    (o.steps ? `<button type="button" class="btn ghost tlstep" id="${P}k">${t('tl_back')}</button><button type="button" class="btn ghost tlstep" id="${P}f">${t('tl_fwd')}</button><button type="button" class="btn ghost tlstep" id="${P}z">${t('tl_reset')}</button>` : '') +
    `<input type="range" class="tlr" id="${P}r" min="0" max="1000" value="1000" aria-label="${t('tl_slider')}">` +
    `<div class="tlchips" id="${P}c" role="group" aria-label="${t('tl_chips')}"></div></div>` +
    `${o.meter ? `<p class="tlx" id="${P}x"></p>` : ''}<p class="tltext" id="${P}t" aria-live="polite"></p><p class="tlnote">${t(o.note || 'tl_note')}</p></div>`);
  const btn = $(P + 'b'), rng = $(P + 'r'), chips = $(P + 'c'), txt = $(P + 't');

  function paint() {
    const { T, n, stop } = st, done = T >= stop - 1e-6, i = Math.max(0, Math.min(n - 1, Math.ceil(T - 1e-6) - 1)), blocked = stop < n || st.halt;   /* halt: все этапы пройдены, но процесс кончается остановкой (семинар 7) */
    rng.value = Math.round(T / n * 1000);
    rng.style.setProperty('--fill', (T / n * 100).toFixed(1) + '%');
    rng.style.setProperty('--stop', (stop / n * 100).toFixed(1) + '%');
    const lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });   /* v1.4: подпись этапа может считать от нуля (шаги модели 2a) */
    rng.setAttribute('aria-valuetext', lab(Math.min(i + 1, stop)));

      b.setAttribute('aria-current', String(k === i));
      b.classList.toggle('halt', !!st.halt && done && k === n - 1); });   /* остановка после всех этапов отмечена на кружке (семинар 7, И-03) */
    const s = done && blocked ? t(st.stopKey) : `${lab(Math.min(i + 1, stop))}. ${t(st.keys[Math.min(i, stop - 1)])}`;
    if (s !== st.text) { st.text = s; txt.textContent = s; txt.classList.toggle('stopped', done && blocked); }
    /* v1.2 (Code, рецензия интерактива И-01): этап i занимает (i−1, i]; кнопки этапов и «Шаг ▶» ставят шкалу ровно на T = i,
       а ветви кадров записаны как «T < i» — без поправки при T = i рисовалось начало следующего этапа. Конечный кадр (T = stop) не трогается. */
    const Td = T > 1e-9 && T < stop - 1e-9 && Math.abs(T - Math.round(T)) < 1e-9 ? T - 1e-6 : T;
    o.render(Td);
  }
  const api = {
    get T() { return st.T; }, get playing() { return st.on; }, get end() { return st.stop; },
    config(keys, stop, stopKey, opt = {}) {
      st.speed = opt.speed || 1.5; st.halt = !!opt.halt; st.keys = keys; st.n = keys.length; st.stop = stop; st.stopKey = stopKey; st.on = false; st.text = '';
      st.stepKey = opt.stepKey || 'tl_step'; st.off = opt.off || 0;
      const n = keys.length, lab = j => t(st.stepKey, { i: j, n, k: j - st.off, m: n - st.off });
      chips.innerHTML = keys.map((k, i) => `<button type="button" class="tlc${i >= stop ? ' no' : ''}"${i >= stop ? ' disabled' : ''} aria-label="${lab(i + 1)}: ${t(k)}">${i + 1 - st.off}</button>`).join('');
      chips.querySelectorAll('button').forEach((b, i) => b.onclick = () => { st.on = false; api.seek(i + 1); });
    },
    seek(T) { st.until = null; st.T = Math.max(0, Math.min(st.stop, T)); paint(); },
    redraw: paint,
    /* play(true) — с начала до конца; play(false) — с текущего места до конца; play(false, U) — с текущего места до этапа U
       (особая остановка сценария). При снижении движения U и конец достигаются сразу, без промежуточных кадров (ТА-10). */
    play(fromStart, until) {
