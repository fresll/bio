4":"Ошибка определения генотипов","c2_r5_4":"исчезает","c2_r4_4":"дефицит в локусах, трудных для определения"}},"zoomNarrow":true}},{"id":"deep-structure","num":13,"section":1,"questions":[2],"title":"Предки современного человека — две популяции, а не одна","keywords":["Слияние популяций","Предковая популяция"],"lead":["Структура бывает не только у современной популяции: глубокая структура предков тоже оставляет след в геномах."],"mechanism":["По геномам современных людей из 26 популяций мира сравнили две истории предков: одна популяция с меняющейся численностью или две популяции, которые разошлись и позже слились ([[T28|слияние популяций]]). Лучше описывает данные вторая модель: две [[T29|предковые популяции]] разошлись около 1,5 млн лет назад и слились около 300 тыс. лет назад; 79 % предков современных людей — из предковой популяции 1 и 21 % — из предковой популяции 2. Вклад второй популяции общий для всех современных людей, поэтому сравнение одних популяций с другими его не выявляло."],"paragraphs":["Работа исходит из того, что одна и та же кривая «численности во времени», рассчитанная в допущении единой популяции, может быть получена и разделённой популяцией; новое — способ различить эти истории по тому, как сменяют друг друга соседние участки генома. Поэтому одно число «эффективной численности человека» — усреднённая величина модели единой популяции.","<b>Как это узнали.<\/b> По одному геному человека посмотрели, как меняется время до общего предка двух копий ДНК вдоль хромосомы: у разделённой и вновь слившейся популяции соседние участки сменяют друг друга иначе.","<b>Граница вывода.<\/b> Времена и доли — точечные оценки одной модели без доверительных интервалов (длительность поколения 29 лет — допущение); авторы допускают несколько эпизодов расхождения и смешения; каким ископаемым формам соответствуют две популяции, работа не устанавливает.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 2."],"conditions":"Схема по данным работы, упрощённая · времена и доли — оценки модели.","sources":["src_04"],"base":"БИО-13·11, БИО-13·12","level":"adv","next_base":"drift","quiz":{"id":"S13-L13","question":"Что означает соотношение 79 : 21?","options":[{"id":"S13-L13-1","text":"Доли двух предковых популяций по модели","correct":true,"feedback":"Это оценка модели для всех современных людей"},{"id":"S13-L13-2","text":"Доли неандертальцев и денисовцев","correct":false,"feedback":"Обе популяции — предковые для нашего вида; неандертальский вклад меньше и позднее"},{"id":"S13-L13-3","text":"Доли Африки и Евразии сейчас","correct":false,"feedback":"Слияние предшествует расселению и общее для всех 26 популяций"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как выглядит история двух предковых популяций?","status":"Схема по данным работы, упрощённая · времена и доли — оценки модели","modes_label":"Момент","modes":["одна популяция","расхождение","слияние","общая популяция"],"args":[{"m":1},{"m":2},{"m":3},{"m":4}],"notes":["Одна предковая популяция","Расхождение на популяции 1 и 2; в популяции 1 — сокращение численности","Слияние: 79 % от популяции 1, 21 % от популяции 2","Общая предковая популяция всех современных людей"],"static":["Шкала времени двух предковых популяций с расхождением и слиянием"],"scene":"s13_a2","L":{"a2_pA":"Шкала времени: предковые популяции","a2_axis":"тыс. лет назад","a2_one":"одна предковая популяция","a2_pB":"Одна кривая — две истории","a2_B_axis":"численность во времени","a2_B_a":"а) одна популяция с меняющейся численностью","a2_B_b":"б) две популяции: расхождение и слияние","a2_p1":"1","a2_p2":"2","a2_split":"~1,5 млн лет назад: расхождение; у популяции 1 — резкое сокращение","a2_ne2":"средняя эффективная численность популяции 2 — около 39 200","a2_merge":"~300 тыс. лет назад: слияние","a2_ratio":"79 % предков — от популяции 1, 21 % — от популяции 2","a2_now":"общая предковая популяция всех современных людей"}}},"adv_kind":"Новые данные"},{"id":"inbreeding-vs-structure","num":14,"section":1,"questions":[2],"title":"Инбридинг и структура: одно наблюдение — две причины","keywords":[],"lead":["По одному локусу инбридинг и скрытая структура неразличимы; различие появляется, если смотреть на выборку иначе."],"mechanism":["В модели объединённая выборка двух групп с частотами 0,9 и 0,3 даёт долю гетерозигот 0,30 при ожидании 0,48. Тот же дефицит в одной популяции с частотой 0,6 дал бы инбридинг с F = 0,375: 0,48 × (1 − 0,375) = 0,30. По одной таблице генотипов эти случаи неразличимы. Различают их три вещи: разделение выборки (дефицит структуры исчезает внутри групп, дефицит инбридинга остаётся); другие локусы (инбридинг снижает гетерозиготность во всех локусах одинаково — умножает её на (1 − F), а структура — по-разному, в зависимости от того, насколько различаются частоты групп в каждом локусе); родство родителей."],"paragraphs":["Процессы складываются: при инбридинге F = 0,25 внутри тех же групп доля гетерозигот — 0,30 × 0,75 = 0,225. Неравные группы (80 % и 20 % выборки) с теми же частотами дают общую частоту 0,78 и дефицит 0,115 — тоже равный удвоенной дисперсии частот.","<b>Граница вывода.<\/b> Вывод учебной модели одного локуса; оценка F по реальным данным требует многих локусов.","<b>На практикуме.<\/b> Вкладка 2, переключатели «Различие частот» и «Инбридинг внутри групп»."],"conditions":"Учебная модель · частоты групп и F условные.","sources":["src_01"],"base":"БИО-13·10, БИО-13·11","level":"adv","next_base":"drift","quiz":{"id":"S13-L14","question":"Как по многим локусам отличить инбридинг от скрытой структуры?","options":[{"id":"S13-L14-1","text":"По одному локусу это видно сразу же","correct":false,"feedback":"По одному локусу дефицит от двух причин может совпасть"},{"id":"S13-L14-2","text":"Гетерозиготность падает одинаково везде","correct":true,"feedback":"При инбридинге она в каждом локусе умножается на (1 − F); структура действует по-разному"},{"id":"S13-L14-3","text":"Никак: причины неразличимы","correct":false,"feedback":"Различимы — по многим локусам, разделению выборки и родству"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как различить инбридинг и структуру?","status":"Учебная модель · частоты и F условные","modes_label":"Случай","modes":["структура 0,9/0,3","инбридинг F = 0,375","оба процесса","неравные группы"],"args":[{"c":1},{"c":2},{"c":3},{"c":4}],"notes":["0,30 при ожидании 0,48; внутри групп — равновесие","0,30 при ожидании 0,48; внутри — тот же дефицит","0,225 при F = 0,25 внутри групп","80 % и 20 %: общая частота 0,78; дефицит 0,115"],"static":["Одинаковый дефицит от структуры и от инбридинга и способы их различить"],"scene":"s13_r_twocauses","L":{"r_two_t1":"Скрытая структура: группы 0,9 и 0,3","r_two_h":"доля гетерозигот","r_two_exp":"ожидание","r_two_in1":"внутри групп — равновесие: разделение выборки снимает дефицит","r_two_t2":"Инбридинг: F = 0,375 при p = 0,6","r_two_in2":"внутри — тот же дефицит; при инбридинге он виден во всех локусах","r_two_t3":"Оба процесса: группы 0,9 и 0,3, F = 0,25 внутри групп","r_two_in3":"дефицит складывается из структуры и инбридинга","r_two_t4":"Неравные группы: 80 % и 20 %","r_two_in4":"общая частота 0,78; дефицит 0,115 = 2 × дисперсия"}}},"adv_kind":"Исследование модели"},{"id":"drift","num":15,"section":2,"questions":[3],"title":"Генетический дрейф: случайная выборка копий","keywords":["Генетический дрейф","Модель Райта–Фишера","Потеря аллеля","Закрепление аллеля"],"lead":["В каждом поколении потомкам передаётся конечное число копий генов. Поэтому частоты аллелей меняются случайно — это [[T14|генетический дрейф]]."],"mechanism":["Простейшее описание — [[T30|модель Райта–Фишера]]. Как при подбрасывании монеты 20 раз выпадает не обязательно 10 «орлов», так и 20 копий при p = 0,5 не обязательно содержат 10 копий A. Частота блуждает; дойдя до 0, аллель теряется ([[T31|потеря аллеля]]), до 1 — закрепляется ([[T32|закрепление аллеля]]), и без мутаций и миграции эти состояния окончательны."],"paragraphs":[{"details":"Формула и расчёт","text":"Модель Райта–Фишера: в каждом поколении N особей; их 2N копий набираются случайно из копий родителей, и вероятность взять копию A равна её частоте."},"Дрейф не имеет направления и не связан с приспособленностью: в модели все генотипы оставляют потомков с равной вероятностью. «Случайный» здесь не значит «беспричинный»: причина — конечное число копий, а непредсказуем исход в каждой отдельной популяции. Дрейф — не мутация: он не создаёт вариантов, а меняет доли уже существующих.","<b>На практикуме.<\/b> Вкладка 3: десять повторов — десять независимых популяций в одинаковых условиях.","<b>Ограничения.<\/b> Модель не учитывает перекрывания поколений, отбора и мутаций."],"conditions":"Учебная модель · случайные траектории воспроизводимы (закреплённые начальные значения генератора).","sources":["src_01"],"base":"БИО-13·1, БИО-13·5","quiz":{"id":"S13-L15","question":"Чем генетический дрейф отличается от мутации?","options":[{"id":"S13-L15-1","text":"Дрейф создаёт новые аллели","correct":false,"feedback":"Новые аллели создают мутации"},{"id":"S13-L15-2","text":"Ничем: оба случайны","correct":false,"feedback":"Оба случайны, но мутация меняет последовательность, а дрейф — частоты"},{"id":"S13-L15-3","text":"Дрейф не создаёт аллелей","correct":true,"feedback":"Новых вариантов он не создаёт"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как случайная выборка копий меняет частоту?","status":"Учебная модель Райта–Фишера · одна условная выборка","modes_label":"Этап","modes":["поколение 0","выборка 20 копий","поколение 1","закрепление"],"args":[{"st":1},{"st":2},{"st":3},{"st":4}],"notes":["p = 0,5","20 копий набираются случайно","p = 0,65 — случайное отклонение","Дойдя до 1, частота не меняется"],"static":["Поколение из 20 копий, случайная выборка, новая частота"],"scene":"s13_r_sampling","L":{"r_smp_g0":"поколение 0","r_smp_10A":"10 копий A","r_smp_10a":"10 копий a","r_smp_draw":"случайная выборка 20 копий","r_smp_g1":"поколение 1","r_smp_13A":"13 копий A","r_smp_7a":"7 копий a","r_smp_p065":"частота 0,65","r_smp_fix":"позже","r_smp_fixed":"закреплён: все 20 копий — A"}}}},{"id":"drift-size","num":16,"section":2,"questions":[3],"title":"Сила дрейфа зависит от численности","keywords":[],"lead":["Чем меньше копий передаётся в каждом поколении, тем сильнее случайные колебания частот."],"mechanism":["В модели (p0 = 0,5; 100 поколений; 10 повторов) при N = 10 аллель A во всех повторах потерян или закреплён (3 и 7), при N = 100 закреплён в одном повторе, в остальных частоты разошлись от 0,19 до 0,95, при N = 1000 все частоты сохранились между 0,26 и 0,61. Средняя по многим популяциям доля гетерозигот в каждом поколении умножается на (1 − 1/2N): через 100 поколений при начальной 0,5 — 0,003 (N = 10), 0,30 (N = 100), 0,48 (N = 1000)."],"paragraphs":["Дрейф действует в любой конечной популяции; в большой он слабее, но за много поколений тоже меняет частоты. Внутри каждой популяции дрейф уменьшает разнообразие, а между популяциями — увеличивает различия: частоты расходятся. Это проверили на 107 одинаковых популяциях дрозофил по 16 особей с начальной частотой 0,5: за 19 поколений частоты разошлись вплоть до закрепления и потери, а гетерозиготность снижалась даже быстрее, чем предсказывала численность 16.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.1, 3.6.","<b>Ограничения.<\/b> Повторы показаны при одной начальной частоте 0,5."],"conditions":"Учебная модель Райта–Фишера · итоги повторов — из эталона модели.","sources":["src_01"],"base":"БИО-13·15","quiz":{"id":"S13-L16","question":"Что происходит в одной малой популяции и в совокупности многих малых популяций?","options":[{"id":"S13-L16-1","text":"Разнообразие внутри падает, различия растут","correct":true,"feedback":"В каждой аллели теряются или закрепляются, причём в разных популяциях разные"},{"id":"S13-L16-2","text":"В каждой разнообразие растёт","correct":false,"feedback":"Дрейф теряет аллели, а не создаёт"},{"id":"S13-L16-3","text":"Все популяции становятся одинаковыми","correct":false,"feedback":"Дрейф идёт независимо в каждой популяции, и частоты расходятся"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как численность влияет на дрейф?","status":"Учебная модель Райта–Фишера · повторы из эталона","modes_label":"Численность N","modes":["N = 10","N = 100","N = 1000"],"args":[{"part":"D","mode":"one","Nk":10,"rep":1,"all":true,"gen":100},{"part":"D","mode":"one","Nk":100,"rep":1,"all":true,"gen":100},{"part":"D","mode":"one","Nk":1000,"rep":1,"all":true,"gen":100}],"notes":["3 потерян, 7 закреплён; H через 100 поколений 0,003","1 закреплён, 9 сохраняются (0,19–0,95); H 0,30","10 сохраняются (0,26–0,61); H 0,48"],"static":["Десять траекторий частоты при трёх численностях"],"scene":"s13_t3","L":{"t3_h_all":"N = {N} · 10 повторов, синий — повтор {r} · поколение {g}","t3_c_par":"родители, поколение {g}","t3_c_off":"потомки, поколение {g}","t3_c_all":"все {n} копий","t3_c_p":"новая частота A: {p}","t3_lost":"p = 0: потерян","t3_fixed":"p = 1: закреплён","t3_g_y":"Частота A","t3_g_x":"поколение","t3_c_shown":"показано 40 копий из {n}, в той же доле"}}}},{"id":"census-effective","num":17,"section":2,"questions":[3],"title":"Фактическая и эффективная численность","keywords":["Фактическая численность","Эффективная численность (Ne)"],"lead":["Число особей в популяции — [[T33|фактическая численность]]. Для дрейфа важна другая величина — [[T34|эффективная численность]] Ne."],"mechanism":["Эффективная численность — численность идеальной популяции Райта–Фишера, в которой дрейф шёл бы с той же скоростью (например, с той же скоростью потери гетерозиготности), что и в реальной популяции. Почти всегда Ne меньше фактической численности. Пример: если из 500 взрослых размножаются лишь 20 самцов и 480 самок, Ne = 76,8. Половина генов потомства прошла через 20 самцов."],"paragraphs":[{"details":"Формула и расчёт","text":"Ne = 4 × Nm × Nf / (Nm + Nf) = 4 × 20 × 480 / 500 = 76,8, где Nm и Nf — числа размножающихся самцов и самок."},"Ne нельзя приравнивать ни к числу обследованных, ни к числу половозрелых особей. Ne зависит от модели и от того, по какому эффекту её оценивают — по скорости дрейфа, накоплению инбридинга или генетическому разнообразию. В эксперименте с дрозофилами (16 особей в каждой популяции) потеря гетерозиготности соответствовала Ne около 9; вероятные причины — гибель части мух до размножения и то, что часть самцов не спаривалась.","<b>На практикуме.<\/b> Вкладка 3, панель «Численность», шаг 3.3.","<b>Ограничения.<\/b> Формула для соотношения полов предполагает случайное число потомков у каждой особи."],"conditions":"Расчёт по формуле; численности условные.","sources":["src_01","src_02"],"base":"БИО-13·16","quiz":{"id":"S13-L17","question":"Размножаются 250 самцов и 250 самок. Какова Ne по соотношению полов?","options":[{"id":"S13-L17-1","text":"250","correct":false,"feedback":"Самцы и самки вместе передают гены; 4 × 250 × 250 / 500 = 500"},{"id":"S13-L17-2","text":"500","correct":true,"feedback":"При равном числе самцов и самок Ne равна числу размножающихся"},{"id":"S13-L17-3","text":"1000","correct":false,"feedback":"Ne не больше числа размножающихся особей в этой формуле"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем Ne отличается от числа особей?","status":"Расчёт по формуле · численности условные","modes_label":"Размножаются","modes":["250 и 250","20 и 480","5 и 495","1 и 499"],"args":[{"m":250,"f":250},{"m":20,"f":480},{"m":5,"f":495},{"m":1,"f":499}],"notes":["Ne = 500","Ne = 76,8","Ne = 19,8","Ne ≈ 4"],"static":["Эффективная численность при разном соотношении размножающихся самцов и самок"],"scene":"s13_r_ne","L":{"r_ne_n":"Фактическая численность 500","r_ne_m":"размножающиеся самцы","r_ne_f":"размножающиеся самки","r_ne_ne":"эффективная численность"}}}},{"id":"ne-causes","num":18,"section":2,"questions":[3],"title":"Почему эффективная численность меньше фактической","keywords":[],"lead":["Эффективная численность уменьшается всякий раз, когда вклад особей в следующее поколение неравен."],"mechanism":["Причины: 1) неравное число размножающихся самцов и самок (20 и 480 → Ne 76,8; 5 и 495 → 19,8; 1 и 499 → около 4); 2) большой разброс числа потомков: если немногие особи оставляют большую часть потомства, генофонд следующего поколения уже, чем позволяет число взрослых; 3) колебания численности по поколениям; 4) неравный вклад локальных групп; 5) перекрывание поколений и особенности размножения. При постоянной численности и случайном (пуассоновском) числе потомков Ne близка к N; чем больше разброс, тем Ne меньше."],"paragraphs":["Колебания численности. При меняющейся численности Ne за ряд поколений приблизительно равна гармоническому среднему их численностей. Гармоническое среднее сильнее всего зависит от наименьших значений, поэтому долговременная Ne определяется прежде всего поколениями с малой численностью, а не периодами роста: после сокращения разнообразие долго остаётся сниженным. Пример расчёта: для ряда 1000, 1000, 10, 1000, 1000 Ne ≈ 48, хотя среднее арифметическое — 802.",{"details":"Формула и расчёт","text":"Гармоническое среднее: 1/Ne равно среднему значению 1/N по поколениям."},"<b>На практикуме.<\/b> Вкладка 3, панель «Численность».","<b>Ограничения.<\/b> Формулы приближённые и относятся к идеализированным условиям."],"conditions":"Расчёт по формулам; численности условные.","sources":["src_01","src_02","src_11"],"base":"БИО-13·17","quiz":{"id":"S13-L18","question":"Почему одно поколение с численностью 10 сильно снижает долговременную Ne популяции, которая в остальное время насчитывает 1000 особей?","options":[{"id":"S13-L18-1","text":"Численность учитывают в среднем, поэтому почти не снижает","correct":false,"feedback":"Ne определяется не средней численностью, а поколениями с малой"},{"id":"S13-L18-2","text":"Потому что выжившие — самые приспособленные","correct":false,"feedback":"Дело не в приспособленности, а в числе переданных копий"},{"id":"S13-L18-3","text":"Все потомки происходят от немногих выживших","correct":true,"feedback":"Генофонд прошёл через 20 копий, и разнообразие долго остаётся сниженным"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему Ne меньше фактической?","status":"Расчёт по формулам · численности условные","modes_label":"Причина","modes":["соотношение полов","разброс потомства","колебания численности"],"args":[{"c":"sex"},{"c":"family"},{"c":"fluct"}],"notes":["20 и 480 → 76,8","Немногие родители — большая часть потомства","1000, 1000, 10, 1000, 1000 → около 48 (расчёт по формуле гармонического среднего)"],"static":["Три причины, по которым Ne меньше фактической численности"],"scene":"s13_r_necauses","L":{"r_nec_sex":"Соотношение полов","r_nec_ne":"эффективная численность","r_nec_family":"Разброс числа потомков","r_nec_par":"родители (условно); тёмные — двое, оставившие большую часть потомства","r_nec_kids":"потомки одной особи","r_nec_fluct":"Колебания численности","r_nec_am":"среднее арифметическое","r_nec_gen":"поколения"}}}},{"id":"bottleneck-founder","num":19,"section":2,"questions":[3],"title":"Узкое место и эффект основателя","keywords":["Узкое место","Эффект основателя"],"lead":["Два демографических сценария особенно усиливают дрейф: резкое сокращение численности и основание новой группы немногими особями."],"mechanism":["[[T35|Узкое место]] — резкое временное сокращение численности. Выжившие несут лишь часть прежнего разнообразия, и её состав может отличаться от исходного; утраченные аллели без мутаций и миграции не возвращаются, даже когда численность восстановится. [[T36|Эффект основателя]] — изменение частот при основании группы немногими переселенцами: частоты определяются составом основателей. Пример расчёта: из популяции, где частота варианта 0,01, пятеро основателей несут 10 копий гена. С вероятностью около 0,90 копии варианта среди них нет, с вероятностью около 0,09 — ровно одна, и тогда частота варианта в новой группе 0,1 — в десять раз выше исходной без какого-либо его преимущества."],"paragraphs":["В модели (N = 1000, в поколениях 21–23 — 10 особей) частоты в 10 повторах после узкого места разошлись от 0,09 до 0,95 и затем почти не менялись. Высокая частота редкого патогенного варианта в изолированной группе может объясняться эффектом основателя, дрейфом и последующим ростом численности, а не преимуществом варианта; так объясняют, например, высокую частоту наследственной полной цветовой слепоты у жителей атолла Пингелап — потомков 20 человек, переживших тайфун и последовавший голод; один из них был гетерозиготным носителем.","<b>На практикуме.<\/b> Вкладка 3, шаги 3.4, 3.5.","<b>Ограничения.<\/b> Клинический пример приводится для демонстрации значения эволюционного механизма."],"conditions":"Учебная модель · вероятности — расчёт по биномиальному распределению; численности условные.","sources":["src_01"],"base":"БИО-13·16, БИО-13·18","quiz":{"id":"S13-L19","question":"После узкого места численность восстановилась. Вернётся ли утраченный аллель?","options":[{"id":"S13-L19-1","text":"Только с мутацией или мигрантом","correct":true,"feedback":"Восстановившаяся популяция — потомки немногих выживших"},{"id":"S13-L19-2","text":"Да, вместе с численностью","correct":false,"feedback":"Численность восстанавливают копии выживших, а утраченный аллель среди них отсутствует"},{"id":"S13-L19-3","text":"Да, если он был полезен","correct":false,"feedback":"Отбор действует только на существующие варианты"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что делают узкое место и эффект основателя?","status":"Учебная модель · вероятности — расчёт","modes_label":"Сценарий","modes":["без узкого места","узкое место","основатели"],"args":[{"part":"D","mode":"one","Nk":1000,"rep":1,"all":true,"gen":100},{"part":"D","mode":"one","Nk":"b","rep":1,"all":true,"gen":100},{"part":"F","nf":5}],"notes":["Частоты меняются медленно","После поколений 21–23 частоты от 0,09 до 0,95; ожидаемая гетерозиготность 0,408 против 0,476 без узкого места","Одна копия из 10 — частота 0,1 (вероятность 0,09); ни одной — 0,90"],"static":["Узкое место и эффект основателя на траекториях и копиях"],"scene":"s13_t3","L":{"t3_h_all":"N = {N} · 10 повторов, синий — повтор {r} · поколение {g}","t3_c_par":"родители, поколение {g}","t3_c_off":"потомки, поколение {g}","t3_c_shown":"показано 40 копий из {n}, в той же доле","t3_c_p":"новая частота A: {p}","t3_lost":"p = 0: потерян","t3_fixed":"p = 1: закреплён","t3_g_y":"Частота A","t3_g_x":"поколение","t3_N_b_short":"1000 (узкое место)","t3_g_bottle":"N = 10 в поколениях 21–23","t3_f_src":"Исходная популяция: частота варианта 0,01","t3_f_src_p":"100 копий: одна — копия варианта","t3_f_n":"{n} основателей","t1_ind_AA":"особь AA","t1_ind_Aa":"особь Aa","t1_ind_aa":"особь aa","t3_f_grp":"{n} основателей: {c} копий, одна — копия варианта","t3_f_freq":"Частота варианта в группе: {p}","t3_f_calc":"Расчёт по модели:","t3_f_p0":"среди {c} копий основателей нет ни одной копии варианта — вероятность {v}","t3_f_p1":"ровно одна копия варианта — вероятность {v}"}}},"exam_quiz":{"id":"S13-E03","question":"Что такое эффект основателя?","options":[{"id":"S13-E03-1","text":"Преимущество первых поселенцев в выживании","correct":false,"feedback":"Это не отбор, а случайный состав основателей"},{"id":"S13-E03-2","text":"Резкая гибель большинства особей","correct":false,"feedback":"Это узкое место"},{"id":"S13-E03-3","text":"Частоты, заданные составом основателей","correct":true,"feedback":"В новой группе они могут сильно отличаться от исходных"}]}},{"id":"fixation","num":20,"section":2,"questions":[3],"title":"Что происходит с новым нейтральным вариантом и почему важна величина Ne·s","keywords":["Нейтральный вариант"],"lead":["[[T37|Нейтральный вариант]] не влияет на приспособленность. Закрепится он или будет потерян, определяется только дрейфом."],"mechanism":["Вероятность того, что нейтральный аллель в итоге закрепится, равна его текущей частоте: при 0,2 — 0,2. Закрепление аллеля в популяции — не то же, что закрепление изменения ДНК при репликации. Новая мутация в популяции из N диплоидных особей — одна копия из 2N; она закрепляется с вероятностью 1/2N и в подавляющем большинстве случаев теряется. Если вариант влияет на приспособленность (относительная разница приспособленности s), его поведение определяется произведением эффективной численности на эту разницу — Ne·s (в формулах следующего семинара — 2Ne·s): при малом Ne·s исход зависит в основном от случая, и даже полезный вариант может быть потерян, а слабовредный — закрепиться; при большом Ne·s определяющим становится отбор."],"paragraphs":["В модели проверено: из 2000 популяций по 10 особей с начальной частотой 0,2 аллель закрепился в доле 0,195 (расчёт по модели; ожидание 0,2). Важнее не жёсткая граница между «нейтральными» и «отбираемыми» вариантами, а соотношение отбора и дрейфа при данной численности.","<b>На практикуме.<\/b> Вкладка 3, шаг 3.2.","<b>Ограничения.<\/b> Утверждение о вероятности закрепления относится к нейтральному аллелю без мутаций и миграции."],"conditions":"Расчёт по модели Райта–Фишера.","sources":["src_01"],"base":"БИО-13·15, БИО-13·17","quiz":{"id":"S13-L20","question":"Новая нейтральная мутация в популяции из 50 особей. Какова вероятность её закрепления?","options":[{"id":"S13-L20-1","text":"1/2 — закрепится или нет","correct":false,"feedback":"Два исхода не равновероятны: вероятность равна частоте"},{"id":"S13-L20-2","text":"1/100","correct":true,"feedback":"Одна копия из 100"},{"id":"S13-L20-3","text":"1/50","correct":false,"feedback":"Копий локуса 100, а не 50"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какова вероятность закрепления нового варианта?","status":"Расчёт по модели Райта–Фишера","modes_label":"Случай","modes":["p = 0,5","p = 0,2","новая мутация","Ne·s"],"args":[{"c":1},{"c":2},{"c":3},{"c":4}],"notes":["0,5","0,2","1/2N — почти всегда теряется","При малом Ne·s решающий вклад случая, при большом — отбора"],"static":["Вероятность закрепления равна частоте; Ne·s определяет роль отбора"],"scene":"s13_r_fixprob","L":{"r_fix_t1":"Нейтральный аллель, p = 0,5","r_fix_p":"вероятность закрепления","r_fix_eq":"вероятность закрепления равна начальной частоте","r_fix_t2":"Нейтральный аллель, p = 0,2","r_fix_t3":"Новая мутация: одна копия из 2N","r_fix_one":"одна копия из 2N почти всегда теряется","r_fix_t4":"Отбор и случай: Ne · s","r_fix_small":"малое Ne · s — главный вклад случая","r_fix_big":"большое Ne · s — главный вклад отбора"}}}},{"id":"deep-bottleneck","num":21,"section":2,"questions":[3],"title":"Сокращение численности предков около 900 тыс. лет назад","keywords":["Распределение частот вариантов"],"lead":["Историю численности предков восстанавливают по геномам современных людей; одна из таких реконструкций вызвала спор, который не закрыт."],"mechanism":["Утверждение: по распределению редких и частых вариантов в геномах 3154 современных людей у предков всех десяти изученных африканских популяций около 930–813 тыс. лет назад резко сократилась численность: эффективная численность около 1280 (в разных популяциях — от 0,77 до 2,03 тыс.) — примерно 1,3 % прежней, в течение около 117 тыс. лет. У неафриканских популяций прямо этот сигнал не найден; авторы обнаружили лишь его «скрытый след» видоизменённым методом и объясняют различие последующим выходом из Африки. Возражение: неафриканцы отделились от ближайших африканских групп менее 100 тыс. лет назад, поэтому событие 900 тыс. лет назад должно было оставить одинаковый след у всех; разные истории численности дают очень похожее ожидаемое [[T38|распределение частот вариантов]], а на компьютерных данных без резкого сокращения тот же метод находит ложное сокращение; другие методы его не воспроизводят. Авторы утверждения ответили, что их расчёт ожидаемого распределения точнее и что пример ложного сокращения построен неверно."],"paragraphs":["Стороны расходятся в трёх пунктах: как рассчитывать ожидаемое распределение частот вариантов; есть ли сигнал у неафриканцев; как учитывать ошибки определения предкового варианта. Каждая сторона сравнивает модели своим расчётом. Число 1280 — эффективная численность в модели, а не перепись людей (БИО-13·17).","<b>Как это узнали.<\/b> Обе стороны рассчитывали, какое распределение редких и частых вариантов дала бы каждая история численности, и проверяли методы на компьютерных популяциях с известной историей.","<b>Граница вывода.<\/b> Спор не закрыт: «недостаточно данных для сокращения» не равно «сокращения не было». По мнению авторов возражения, это событие не то же, что сокращение численности одной из предковых популяций в БИО-13·13; с выходом из Африки оно не связано по времени.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 3: две позиции оформлены одинаково."],"conditions":"Качественная схема двух опубликованных позиций; кривые условны.","sources":["src_05","src_06","src_07","src_08"],"base":"БИО-13·17, БИО-13·19","level":"adv","next_base":"sources","quiz":{"id":"S13-L21","question":"Что надо знать, чтобы выбрать между позициями?","options":[{"id":"S13-L21-1","text":"Сколько людей похоронено в ту эпоху","correct":false,"feedback":"Численность по находкам прямо не оценивают; сторона утверждения приводит ископаемые и климат как согласующиеся данные"},{"id":"S13-L21-2","text":"Какой вариант гена был тогда частым","correct":false,"feedback":"Частоты прошлого здесь восстанавливают по современным геномам — это и есть предмет спора"},{"id":"S13-L21-3","text":"Чей расчёт ожидаемых частот точнее","correct":true,"feedback":"Каждая сторона сравнивает модели своим расчётом, и стороны не согласны, чей точнее"}]},"widget":{"kind":"dna","title":"","s":{"title":"Где расходятся две позиции о сокращении численности?","status":"Качественная схема двух опубликованных позиций; кривые условны","modes_label":"Позиция","modes":["утверждение","возражение","где расходятся"],"args":[{"pos":"claim"},{"pos":"objection"},{"pos":"diff"}],"notes":["Резкое сокращение численности около 930–813 тыс. лет назад","Модель без резкого сокращения описывает данные лучше","Три пункта расхождения; спор не закрыт"],"static":["Две кривые истории численности в одинаковом оформлении и три пункта расхождения"],"scene":"s13_a3","L":{"a3_pA":"Численность предков во времени (качественная схема)","a3_axis":"тыс. лет назад","a3_yaxis":"условная численность","a3_lab_claim":"утверждение","a3_lab_obj":"возражение","a3_pos_claim":"Утверждение","a3_pB":"Где расходятся позиции","a3_row1":"Как рассчитывают ожидаемое распределение частот вариантов","a3_row2":"Есть ли сигнал у неафриканцев","a3_row3":"Как учитывают ошибки определения предкового варианта","a3_pos_objection":"Возражение","a3_open":"Спор не закрыт"}}},"adv_kind":"Утверждение и возражение"},{"id":"fixation-model","num":22,"section":2,"questions":[3],"title":"Вероятность закрепления равна частоте","keywords":[],"lead":["Утверждение о вероятности закрепления можно проверить на модели, повторив дрейф много раз."],"mechanism":["Модель Райта–Фишера: популяция из 10 особей, начальная частота аллеля 0,2, отбора, мутаций и миграции нет; каждую популяцию ведут, пока аллель не закрепится или не потеряется. Из двух тысяч таких популяций аллель закрепился в 390 (доля 0,195), в остальных потерян. Почему так: каждая из 20 копий с равной вероятностью может стать предком всех копий будущего; 4 копии из 20 — это вероятность 0,2."],"paragraphs":["Отсюда два следствия. Нейтральный редкий вариант почти всегда теряется; частый — чаще закрепляется. Скорость закрепления новых нейтральных вариантов в популяции равна скорости мутаций: в большой популяции их возникает больше, но каждый закрепляется реже.","<b>Граница вывода.<\/b> Расчёт по модели с конечным числом повторов: доля 0,195 отличается от 0,2 случайно.","<b>На практикуме.<\/b> Вкладка 3: десять повторов при N = 10 — малая часть этого расчёта."],"conditions":"Учебная модель · две тысячи повторов; итог — из эталона модели.","sources":["src_01"],"base":"БИО-13·20","level":"adv","next_base":"sources","quiz":{"id":"S13-L22","question":"В двух тысячах популяций доля закреплений 0,195, а ожидание 0,2. Почему не точно 0,2?","options":[{"id":"S13-L22-1","text":"Повторов конечное число","correct":true,"feedback":"Доля в конечном числе повторов колеблется около 0,2"},{"id":"S13-L22-2","text":"Аллель слабо вреден","correct":false,"feedback":"В модели отбора нет"},{"id":"S13-L22-3","text":"Формула неверна для N = 10","correct":false,"feedback":"Равенство вероятности закрепления частоте не зависит от N"}]},"widget":{"kind":"dna","title":"","s":{"title":"Совпадает ли доля закреплений с частотой?","status":"Учебная модель · итог 2000 повторов — из эталона","modes_label":"Число повторов","modes":["10","100","2000"],"args":[{"reps":10},{"reps":100},{"reps":2000}],"notes":["0,1 — доля сильно колеблется","0,15 — ближе к 0,2","0,195"],"static":["Доля закреплений приближается к 0,2 с ростом числа повторов"],"scene":"s13_r_fixsim","L":{"r_fs_reps":"{n} повторов: N = 10, начальная частота 0,2","r_fs_exp":"ожидание 0,2","r_fs_share":"доля закреплений"}}},"adv_kind":"Исследование модели"},{"id":"sources","num":23,"section":3,"questions":[4],"title":"Мутации, рекомбинация и поток генов: источники и переносчики изменчивости","keywords":["Мутация","Рекомбинация","Поток генов","Наличная изменчивость","Мобильный элемент"],"lead":["Новые варианты и их новые сочетания появляются тремя разными путями, а частоту появившихся вариантов дальше меняют отбор, дрейф и миграция."],"mechanism":["[[T39|Мутация]] создаёт новый аллель: изменение последовательности ДНК закрепляется при репликации и, если оно произошло в клетках зародышевой линии, передаётся потомкам. [[T40|Рекомбинация]] при мейозе соединяет уже существующие аллели в новые сочетания: из гаплотипов A B и a b получаются A b и a B; новых аллелей она не создаёт. [[T41|Поток генов]] — перенос вариантов между популяциями с мигрантами или гаметами; он может принести вариант, которого в популяции не было, и сдвигает частоты к частотам источника: p′ = (1 − m) × p + m × pм, где m — доля мигрантов, pм — частота у них."],"paragraphs":["Мутации случайны относительно своего будущего влияния на приспособленность: они не возникают потому, что окажутся полезны. При этом разные типы мутаций возникают с разной частотой. При изменении условий отбор может действовать на уже имеющийся полиморфизм ([[T42|наличная изменчивость]]) — это быстрее, чем ждать новой мутации. Встраивание [[T62|мобильных элементов]] в новые места генома — ещё один источник изменений последовательности (подробнее — [[seminar-14-route.html#transposons|семинар 14: «Мобильные элементы»]]).","<b>На практикуме.<\/b> Вкладка 1, шаги 1.4, 1.5; вкладка 4, шаг 4.6.","<b>Ограничения.<\/b> Классификацию мутаций и их частоты разбирает [[seminar-14-route.html#change-types|семинар 14: «Типы изменений: замена, вставка и делеция, структурные изменения»]]."],"conditions":"Схема качественная: хромосомы, гаплотипы и мигранты условны.","sources":["src_01"],"base":"вспомнить [[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]], [[seminar-8-route.html#fixation|семинар 8: «Как изменение закрепляется при репликации»]], [[seminar-6-route.html#crossing-over|семинар 6: «Кроссинговер и хиазмы: обмен и связь»]]","quiz":{"id":"S13-L23","question":"Какой процесс создаёт новые сочетания аллелей, но не новые аллели?","options":[{"id":"S13-L23-1","text":"Мутация","correct":false,"feedback":"Мутация создаёт новый аллель"},{"id":"S13-L23-2","text":"Рекомбинация","correct":true,"feedback":"Она переставляет имеющиеся аллели между хромосомами"},{"id":"S13-L23-3","text":"Поток генов между популяциями","correct":false,"feedback":"Поток генов переносит варианты между популяциями"}]},"widget":{"kind":"dna","title":"","s":{"title":"Мутация, рекомбинация, поток генов: что создаёт каждая?","status":"Схема качественная","modes_label":"Процесс","modes":["мутация","рекомбинация","поток генов"],"args":[{"proc":"mut"},{"proc":"rec"},{"proc":"flow"}],"notes":["Создаёт новый аллель","Создаёт новые сочетания имеющихся аллелей","Переносит варианты между популяциями"],"static":["Три источника и переносчика изменчивости"],"scene":"s13_r_sources","L":{"r_src_mut":"Мутация","r_src_new":"новый аллель","r_src_rec":"Рекомбинация","r_src_hap":"гаплотипы A B и a b","r_src_reclab":"A b и a B — новые сочетания","r_src_flow":"Поток генов","r_src_main":"материк","r_src_isl":"остров","r_src_mig":"мигранты","r_src_pm":"частота у мигрантов — своя"}},"zoomNarrow":true},"exam_quiz":{"id":"S13-E09","question":"Почему мутации называют случайными?","options":[{"id":"S13-E09-1","text":"Все мутации возникают с одинаковой скоростью","correct":false,"feedback":"Скорости разных мутаций различаются"},{"id":"S13-E09-2","text":"Мутации не имеют причин","correct":false,"feedback":"Причины есть: ошибки репликации и повреждения ДНК"},{"id":"S13-E09-3","text":"Их появление не зависит от будущей пользы","correct":true,"feedback":"При этом разные типы мутаций возникают с разной частотой"}]}},{"id":"selection-fitness","num":24,"section":3,"questions":[4],"title":"Естественный отбор и приспособленность","keywords":["Естественный отбор","Приспособленность","Относительная приспособленность (w)","Коэффициент отбора (s)"],"lead":["[[T43|Естественный отбор]] — неслучайное различие в передаче наследуемых вариантов следующему поколению из-за различий в выживании и размножении их носителей."],"mechanism":["[[T44|Приспособленность]] в популяционной генетике — вклад генотипа в следующее поколение: вероятность дожить до размножения, число потомков и их способность самим оставить потомство. В моделях используют [[T45|относительную приспособленность]] w: самому успешному генотипу приписывают 1, остальным — доли от него; [[T46|коэффициент отбора]] s = 1 − w показывает относительное снижение вклада. Отбор, в отличие от дрейфа, не случаен: в одинаковых условиях он сдвигает частоты в одну сторону во всех популяциях."],"paragraphs":["Приспособленность не сводится к продолжительности жизни или физической силе: учитывается вклад в потомство. Один и тот же вариант может быть полезен в одних условиях и вреден в других, а его эффект может зависеть от пола, возраста и вариантов в других локусах. По изменению распределения количественного признака отбор описывают как направленный (смещает среднее), стабилизирующий (уменьшает долю крайних значений) и дизруптивный (повышает успех крайних).","<b>На практикуме.<\/b> Вкладка 4, панель «Приспособленность».","<b>Ограничения.<\/b> Однолокусные модели показывают принцип; реальные признаки зависят от многих локусов и среды."],"conditions":"Схема качественная: приспособленности условные.","sources":["src_01"],"base":"БИО-13·23; вспомнить [[seminar-12-route.html#selection|семинар 12: «Условия естественного отбора»]]","quiz":{"id":"S13-L24","question":"Особь прожила долго, но не оставила потомков. Какова её приспособленность в популяционной генетике?","options":[{"id":"S13-L24-1","text":"Высокая — она долго жила","correct":false,"feedback":"Продолжительность жизни без потомства не даёт вклада в генофонд"},{"id":"S13-L24-2","text":"Средняя","correct":false,"feedback":"Без потомков вклад равен нулю"},{"id":"S13-L24-3","text":"Нулевая","correct":true,"feedback":"Приспособленность — вклад в следующее поколение"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что такое приспособленность?","status":"Схема качественная · условные доли","modes_label":"Компонент","modes":["выживание","размножение","вклад","формы отбора"],"args":[{"c":1},{"c":2},{"c":3},{"c":4}],"notes":["Доля доживающих","Число потомков","Приспособленность — произведение","Сдвиг среднего; сужение; расхождение крайних"],"static":["Компоненты приспособленности и три формы отбора признака"],"scene":"s13_r_fitness","L":{"r_fit_t1":"Выживание","r_fit_n1":"w — доля доживающих относительно лучшего генотипа (условно)","r_fit_t2":"Размножение","r_fit_n2":"число потомков у доживших (условно одинаковое)","r_fit_t3":"Вклад в следующее поколение","r_fit_n3":"вклад = выживание × размножение","r_fit_t4":"Формы отбора признака","r_fit_dir":"направленный","r_fit_stab":"стабилизирующий","r_fit_dis":"дизруптивный","r_fit_n4":"пунктир — распределение признака до отбора; линия — после"}},"zoomNarrow":true},"exam_quiz":{"id":"S13-E10","question":"Что такое стабилизирующий отбор?","options":[{"id":"S13-E10-1","text":"Невыгодность крайних значений","correct":true,"feedback":"Среднее сохраняется, разброс уменьшается"},{"id":"S13-E10-2","text":"Сдвиг среднего значения признака","correct":false,"feedback":"Это направленный отбор"},{"id":"S13-E10-3","text":"Преимущество крайних значений","correct":false,"feedback":"Это дизруптивный отбор"}]}},{"id":"selection-modes","num":25,"section":3,"questions":[4],"title":"Как отбор меняет частоты: три режима","keywords":["Средняя приспособленность","Направленный отбор","Преимущество гетерозигот","Равновесие"],"lead":["Направление и скорость изменения частот при отборе зависят от того, какой генотип приспособлен лучше."],"mechanism":["Приспособленности генотипов AA, Aa, aa задают, как меняется частота A. Режимы: 1) [[T48|направленный отбор]] в пользу аллеля (1; 0,95; 0,9): из 0,1 частота A растёт до 0,16 через 10 поколений, 0,36 через 30 и 0,73 через 60; 2) [[T49|преимущество гетерозигот]] (0,8; 1; 0,6): частота приближается к [[T50|равновесию]] около 0,67 — устойчивому, отклонения возвращаются; 3) отбор против гетерозигот (1; 0,8; 1): равновесие 0,5 неустойчиво — из 0,45 аллель A теряется, из 0,55 закрепляется."],"paragraphs":[{"details":"Формула и расчёт","text":"Модель отбора по выживанию: после отбора частота A — p′ = (p² × wAA + pq × wAa) / w̄, где wAA, wAa, waa — приспособленности генотипов, а [[T47|средняя приспособленность]] w̄ = p² × wAA + 2pq × wAa + q² × waa. Равновесие при преимуществе гетерозигот: t / (s + t) = 0,4 / 0,6 ≈ 0,67, где s = 1 − wAA и t = 1 − waa."},"Скорость отбора зависит от частоты и доминантности: редкий рецессивный аллель почти весь находится в гетерозиготах, где отбор на него почти не действует, поэтому вредный рецессивный аллель удаляется медленно, а полезный рецессивный аллель поначалу медленно распространяется.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.1–4.3.","<b>Ограничения.<\/b> Численность в модели бесконечна; приспособленности условные."],"conditions":"Учебная модель · условные приспособленности; траектории — из эталона.","sources":["src_01"],"base":"БИО-13·24, БИО-13·4","quiz":{"id":"S13-L25","question":"Приспособленности 0,9; 1; 0,9. К какому равновесию придёт частота A?","options":[{"id":"S13-L25-1","text":"0,5","correct":true,"feedback":"S = t = 0,1, равновесие t / (s + t) = 0,5"},{"id":"S13-L25-2","text":"1 — гетерозиготы несут A","correct":false,"feedback":"Гетерозиготы несут и a; гомозиготы обоих типов уступают им одинаково"},{"id":"S13-L25-3","text":"Равновесия нет","correct":false,"feedback":"При преимуществе гетерозигот есть устойчивое равновесие"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как меняется частота при трёх режимах отбора?","status":"Учебная модель · условные приспособленности","modes_label":"Режим","modes":["преимущество A","преимущество гетерозигот","против гетерозигот"],"args":[{"mode":"directional","starts":[0.1]},{"mode":"overdominance","starts":[0.1,0.9]},{"mode":"underdominance","starts":[0.45,0.55]}],"notes":["Из 0,1: 0,16 → 0,36 → 0,73","Все к 0,667","Из 0,45 — к 0, из 0,55 — к 1"],"static":["Траектории частоты при трёх режимах отбора"],"scene":"s13_t4","L":{"t4_fit":"Приспособленность (условные числа)","t4_k_zyg":"Зиготы","t4_k_sel":"Отбор","t4_k_mig":"Мигранты","t4_k_p":"p = {p}","t4_k_next":"Потомки","t3_g_y":"Частота A","t3_g_x":"поколение","t4_eq_stable":"устойчивое: {p}","t4_eq_unstable":"неустойчивое: {p}"}}}},{"id":"sexual-selection","num":26,"section":3,"questions":[4],"title":"Половой отбор","keywords":["Половой отбор"],"lead":["[[T51|Половой отбор]] — отбор по различиям в успехе спаривания и оплодотворения."],"mechanism":["Он идёт двумя путями. При внутриполовом отборе особи одного пола (чаще самцы) соревнуются друг с другом за доступ к партнёрам, и победители спариваются чаще. При межполовом отборе успех спаривания особей одного пола зависит от предпочтений особей другого пола. Признак, повышающий успех спаривания, может распространяться, даже если снижает выживание: приспособленность — это вклад в потомство, а не продолжительность жизни."],"paragraphs":["Половой отбор обычно сильнее у пола, который меньше вкладывает в потомство: его репродуктивный успех сильнее ограничен числом партнёров, чем ресурсами. Это объясняет, почему у многих видов яркие украшения и оружие развиты у самцов. Половой отбор уменьшает эффективную численность, если немногие особи получают большую часть спариваний (БИО-13·18).","<b>На практикуме.<\/b> Вкладка 3, панель «Численность»: неравное число размножающихся самцов и самок как следствие полового отбора.","<b>Ограничения.<\/b> Примеры на странице — общие закономерности, без переноса на поведение человека."],"conditions":"Схема качественная: значки особей условны.","sources":["src_01"],"base":"БИО-13·24","quiz":{"id":"S13-L26","question":"Яркий хвост делает самца заметнее для хищников, но самки предпочитают таких самцов. Может ли признак распространиться?","options":[{"id":"S13-L26-1","text":"Нет: признак снижает выживание самца","correct":false,"feedback":"Выживание — лишь часть приспособленности"},{"id":"S13-L26-2","text":"Да, если выигрыш больше потерь","correct":true,"feedback":"Приспособленность — суммарный вклад в потомство"},{"id":"S13-L26-3","text":"Только дрейфом","correct":false,"feedback":"Здесь есть неслучайное различие в успехе спаривания — это отбор"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как действует половой отбор?","status":"Схема качественная · значки условны","modes_label":"Путь","modes":["внутриполовой","межполовой","цена признака"],"args":[{"w":1},{"w":2},{"w":3}],"notes":["Соперничество особей одного пола","Успех зависит от предпочтений другого пола","Меньше выживание, больше спариваний"],"static":["Два пути полового отбора и цена признака"],"scene":"s13_r_sexsel","L":{"r_sex_t1":"Внутриполовой отбор","r_sex_riv":"соперники одного пола","r_sex_win":"победитель","r_sex_t2":"Межполовой отбор","r_sex_choice":"выбор партнёра","r_sex_trait":"признак","r_sex_t3":"Цена признака","r_sex_surv":"выживание","r_sex_with":"с признаком","r_sex_without":"без признака","r_sex_mate":"успех спаривания","r_sex_cond":"доли условны"}}},"exam_quiz":{"id":"S13-E04","question":"Что такое внутриполовой отбор?","options":[{"id":"S13-E04-1","text":"Соперничество особей одного пола","correct":true,"feedback":"Например, поединки самцов"},{"id":"S13-E04-2","text":"Выбор партнёра другим полом","correct":false,"feedback":"Это межполовой отбор"},{"id":"S13-E04-3","text":"Отбор внутри одного организма","correct":false,"feedback":"Это внутригеномный конфликт"}]}},{"id":"combined","num":27,"section":3,"questions":[4],"title":"Совместное действие: отбор против потока генов и против дрейфа","keywords":[],"lead":["В реальной популяции процессы действуют одновременно, и частота — результат их соотношения."],"mechanism":["Отбор и поток генов. Если местный отбор поддерживает аллель, а мигранты каждое поколение приносят другой, устанавливается промежуточное равновесие. Чем сильнее поток генов относительно отбора, тем ближе частота к частоте источника. Отбор и дрейф. Их соотношение определяет Ne·s (в формулах следующего семинара — 2Ne·s; БИО-13·20): в малой популяции слабый отбор почти не влияет на исход по сравнению с дрейфом."],"paragraphs":[{"details":"Формула и расчёт","text":"В модели острова (местный отбор 1; 0,9; 0,8; у мигрантов частота A 0,1) равновесная частота A на острове: без мигрантов — 1, при 1 % мигрантов — 0,91, при 5 % — 0,60, при 10 % — 0,33."},"Классический природный пример: на островах озера Эри отбор (хищники) благоприятствует водяным змеям без полос, но с материка, где преобладают полосатые, каждое поколение приходят мигранты — около 1 % популяции островов; поэтому полосатые змеи на островах сохраняются (оценки по полевым данным).","<b>На практикуме.<\/b> Вкладка 4, шаг 4.4; вкладка 3, «Найти причину».","<b>Ограничения.<\/b> Модель — один остров и неизменный источник; приспособленности условные."],"conditions":"Учебная модель · равновесия — из эталона; приспособленности условные.","sources":["src_01"],"base":"БИО-13·20, БИО-13·23, БИО-13·25","quiz":{"id":"S13-L27","question":"Доля мигрантов выросла с 1 % до 10 %. Что произойдёт с равновесной частотой местно выгодного аллеля?","options":[{"id":"S13-L27-1","text":"Не изменится: местный отбор сильнее","correct":false,"feedback":"Мигранты каждое поколение приносят другой аллель"},{"id":"S13-L27-2","text":"Аллель закрепится быстрее","correct":false,"feedback":"Мигранты замедляют распространение местно выгодного аллеля"},{"id":"S13-L27-3","text":"Снизится к частоте источника","correct":true,"feedback":"0,91 → 0,33 в модели"}]},"widget":{"kind":"dna","title":"","s":{"title":"Отбор против потока генов: где равновесие?","status":"Учебная модель · условные приспособленности","modes_label":"Доля мигрантов","modes":["m = 0","m = 0,01","m = 0,05","m = 0,1"],"args":[{"mode":"mig","m":0},{"mode":"mig","m":0.01},{"mode":"mig","m":0.05},{"mode":"mig","m":0.1}],"notes":["1","0,912","0,597","0,330"],"static":["Равновесная частота на острове при разной доле мигрантов"],"scene":"s13_t4","L":{"t4_fit":"Приспособленность (условные числа)","t4_k_zyg":"Зиготы","t4_k_sel":"Отбор","t4_k_mig":"Мигранты","t4_k_p":"p = {p}","t4_k_next":"Потомки","t4_k_main":"мигранты с материка: доля {m}, частота A 0,1","t4_isl":"остров","t4_main":"материк","t4_migr":"мигранты","t3_g_y":"Частота A","t3_g_x":"поколение","t4_eq_stable":"устойчивое: {p}"}}}},{"id":"polymorphism","num":28,"section":3,"questions":[4],"title":"Как сохраняется полиморфизм","keywords":["Полиморфизм","Балансирующий отбор","Отрицательный частотно-зависимый отбор","Баланс мутаций и отбора"],"lead":["[[T52|Полиморфизм]] — существование в популяции двух и более аллелей локуса с заметной частотой. Он сохраняется несколькими путями, и не все они связаны с пользой вариантов."],"mechanism":["[[T53|Балансирующий отбор]] поддерживает несколько аллелей: при преимуществе гетерозигот (БИО-13·25); при [[T54|отрицательном частотно-зависимом отборе]], когда преимущество получает редкий вариант и оно уменьшается по мере его распространения; при отборе, различающемся в разных частях ареала. Кроме того, частоты задаёт баланс процессов: поток генов против местного отбора (БИО-13·27); [[T55|баланс мутаций и отбора]], при котором вредный аллель постоянно возникает заново и удаляется; баланс мутаций и дрейфа: новые нейтральные варианты возникают, пока прежние теряются."],"paragraphs":["Поэтому отбор может действовать без закрепления какого-либо варианта: устойчивым полиморфизмом, сдвигом частот многих вариантов или различиями между популяциями. Наличие полиморфизма само по себе не говорит, какой из путей действует: высокая частота варианта не доказывает его пользу.","<b>На практикуме.<\/b> Вкладка 4, шаги 4.2, 4.4; «Найти причину» (случай IV).","<b>Ограничения.<\/b> Пути перечислены как модели; в каждом конкретном локусе их различают по данным."],"conditions":"Схема качественная: сравнение путей сохранения полиморфизма.","sources":["src_01"],"base":"БИО-13·25, БИО-13·27","quiz":{"id":"S13-L28","question":"Какой путь поддерживает вредный аллель без какой-либо его пользы?","options":[{"id":"S13-L28-1","text":"Баланс мутаций и отбора","correct":true,"feedback":"Аллель возникает мутациями с той же скоростью, с какой удаляется отбором; частота при этом низкая"},{"id":"S13-L28-2","text":"Преимущество гетерозигот","correct":false,"feedback":"Здесь гетерозиготы выигрывают — польза есть"},{"id":"S13-L28-3","text":"Частотно-зависимый отбор","correct":false,"feedback":"Здесь выигрывает редкий вариант — тоже польза"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какими путями сохраняется полиморфизм?","status":"Схема качественная · сравнение моделей","modes_label":"Путь","modes":["гетерозиготы","частотная зависимость","поток и отбор","мутации и отбор"],"args":[{"w":1},{"w":2},{"w":3},{"w":4}],"notes":["Устойчивое равновесие 2/3 в модели вкладки 4","Выигрывает редкий","Промежуточная частота","Вредный аллель возникает и удаляется"],"static":["Четыре пути сохранения полиморфизма"],"scene":"s13_r_poly","L":{"r_poly_1":"Преимущество гетерозигот","r_poly_2":"Частотная зависимость","r_poly_3":"Поток генов и отбор","r_poly_4":"Мутации и отбор","r_poly_rare":"редкий вариант","r_poly_common":"частый вариант","r_poly_mut":"новые мутации","r_poly_del":"удаление отбором","r_poly_eq":"равновесие при низкой частоте"}}},"exam_quiz":{"id":"S13-E06","question":"Что такое отрицательный частотно-зависимый отбор?","options":[{"id":"S13-E06-1","text":"Преимущество частого варианта","correct":false,"feedback":"Это положительная зависимость; полиморфизм она не поддерживает"},{"id":"S13-E06-2","text":"Отбор без зависимости от частоты","correct":false,"feedback":"Здесь приспособленность зависит от частоты"},{"id":"S13-E06-3","text":"Преимущество редкого варианта","correct":true,"feedback":"Оно уменьшается по мере распространения"}]}},{"id":"adaptation","num":29,"section":3,"questions":[4],"title":"Адаптация и как её доказывают","keywords":["Адаптация","Адаптационизм"],"lead":["[[T56|Адаптация]] — наследуемый признак, сформированный естественным отбором и повышающий приспособленность в определённых условиях; тем же словом называют процесс формирования таких признаков."],"mechanism":["Чтобы признать признак адаптацией, мало найти его полезную функцию. Нужно показать наследуемую изменчивость признака, связь вариантов с приспособленностью и исторический процесс отбора. Гипотезу о приспособительном значении признака проверяют: выводят из неё предсказания и сравнивают с данными. Нынешняя польза могла появиться позже самого признака; признак мог возникнуть как побочное следствие другой адаптации, ограничений развития или как нейтральное наследие предков."],"paragraphs":["Стремление объяснять каждый признак как прямое решение какой-то задачи называют [[T57|адаптационизмом]]; его критикуют за то, что правдоподобная гипотеза принимается без проверки. Организмы несут следы своей истории и компромиссы: отбор изменяет доступные варианты, а не конструирует организм заново, и ведёт к приспособленности, а не к совершенству.","<b>На практикуме.<\/b> Вкладка 4, «Найти причину» (случай IV): высокая частота варианта не доказывает отбор.","<b>Ограничения.<\/b> Методы проверки адаптаций — тема старших курсов."],"conditions":"Схема качественная: три линии доказательства адаптации.","sources":["src_01"],"base":"БИО-13·24, БИО-13·28","quiz":{"id":"S13-L29","question":"Найдена полезная функция признака. Доказывает ли это, что признак — адаптация?","options":[{"id":"S13-L29-1","text":"Да: полезный признак всегда адаптация","correct":false,"feedback":"Признак мог возникнуть без отбора на эту функцию"},{"id":"S13-L29-2","text":"Нет: нужна история отбора","correct":true,"feedback":"Польза могла появиться позже, а признак — возникнуть иначе"},{"id":"S13-L29-3","text":"Да, если признак частый","correct":false,"feedback":"Высокая частота бывает и при дрейфе"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что нужно, чтобы признать признак адаптацией?","status":"Схема качественная","modes_label":"Линия доказательства","modes":["функция","наследуемость","связь с приспособленностью","история отбора"],"args":[{"e":1},{"e":2},{"e":3},{"e":4}],"notes":["Нужна, но недостаточна","Признак должен наследоваться","Варианты различаются вкладом в потомство","Нужна история отбора"],"static":["Три линии доказательства адаптации и альтернативные объяснения"],"scene":"s13_r_adapt","L":{"r_ad_trait":"Признак","r_ad_1":"польза сейчас (функция)","r_ad_2":"наследуемая изменчивость","r_ad_3":"связь с приспособленностью","r_ad_4":"отбор в прошлом","r_ad_alt":"Альтернативы:","r_ad_by":"побочный продукт","r_ad_anc":"наследие предков"}}}},{"id":"conflict","num":30,"section":3,"questions":[4],"title":"Внутригеномные конфликты","keywords":["Внутригеномный конфликт","Эгоистичный генетический элемент","Мейотический драйв","Искажение передачи аллелей"],"lead":["Отбор действует на разных уровнях: элемент генома может повышать собственную передачу потомкам даже за счёт успеха организма. Так возникает [[T58|внутригеномный конфликт]]."],"mechanism":["[[T59|Эгоистичные генетические элементы]] изменяют ход мейоза так, что сами передаются потомкам чаще других вариантов, независимо от влияния на приспособленность организма. [[T60|Мейотический драйв]] — нарушение менделевской передачи, при котором элемент попадает более чем в половину функциональных гамет гетерозиготы. В учебной модели (организм DD оставляет половину потомства, Dd и dd — полное) элемент с передачей 0,8 вместо 0,5 закрепляется, хотя средняя приспособленность популяции падает до 0,5; при передаче 0,6 устанавливается равновесие около 0,40; при 0,5 частота элемента медленно снижается."],"paragraphs":["Классический пример — участок хромосомы 17 мыши (t-гаплотип): гетерозиготные самцы передают его до 99 % потомков; известен и комплекс генов искажения расщепления у дрозофилы. У человека систематический обзор опубликованных сообщений об [[T61|искажении передачи аллелей]] не нашёл ни одного случая, сравнимого по надёжности с примерами у модельных организмов (подробнее — шаг «Есть ли у человека нарушения менделевской передачи?»). Конфликт не означает «намерения» гена: результат возникает из различий в передаче элементов, клеток и организмов.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.5.","<b>Ограничения.<\/b> Модель драйва условная: один локус, бесконечная численность, условные числа."],"conditions":"Учебная модель · передача и приспособленности условные; траектории — из эталона.","sources":["src_01","src_10"],"base":"БИО-13·25, БИО-13·29","quiz":{"id":"S13-L30","question":"Почему элемент, снижающий успех организма, может распространиться?","options":[{"id":"S13-L30-1","text":"Организм выигрывает от элемента","correct":false,"feedback":"В модели элемент организму вредит"},{"id":"S13-L30-2","text":"Это невозможно: отбор его удалит","correct":false,"feedback":"Отбор на уровне передачи и на уровне организма направлен по-разному"},{"id":"S13-L30-3","text":"Он передаётся потомкам чаще половины","correct":true,"feedback":"Преимущество передачи может перевесить вред"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как распространяется элемент с драйвом?","status":"Учебная модель · условные числа","modes_label":"Передача k","modes":["k = 0,5","k = 0,6","k = 0,8"],"args":[{"mode":"drive","k":0.5},{"mode":"drive","k":0.6},{"mode":"drive","k":0.8}],"notes":["Частота D медленно снижается (0,02 через 60 поколений)","Равновесие около 0,40; средняя приспособленность 0,92","D закрепляется; средняя приспособленность 0,5"],"static":["Траектории элемента с разной передачей и средняя приспособленность"],"scene":"s13_t4","L":{"t4_fit":"Приспособленность (условные числа)","t4_k_zyg":"Зиготы","t4_k_sel":"Отбор","t4_k_gam":"Гаметы","t4_k_pD":"D: {p}","t4_k_next":"Потомки","t4_k_k":"Dd передаёт D доле {k} гамет","t4_gD":"гаметы с D: {k}","t4_gd":"гаметы с d: {k}","t4_g_yD":"Частота D","t3_g_x":"поколение","t4_g_wbar":"средняя приспособленность через 60 поколений: {w}"}}},"exam_quiz":{"id":"S13-E05","question":"Что такое мейотический драйв?","options":[{"id":"S13-E05-1","text":"Ускорение мейоза в половых клетках","correct":false,"feedback":"Речь о доле гамет, а не о скорости деления"},{"id":"S13-E05-2","text":"Передача элемента в большинство гамет","correct":true,"feedback":"Нарушение менделевской передачи"},{"id":"S13-E05-3","text":"Обмен участками хромосом","correct":false,"feedback":"Это кроссинговер"}]}},{"id":"ancient-selection","num":31,"section":3,"questions":[4],"title":"Сотни случаев направленного отбора — и лишь малая доля изменений частот","keywords":["Древняя ДНК"],"lead":["[[T63|Древняя ДНК]] позволяет увидеть, как частота аллеля менялась во времени, а не только сравнивать современных людей."],"mechanism":["По геномам 15 836 людей, живших в Западной Евразии за последние 18 тыс. лет, найдено 479 независимых участков генома с направленным отбором за последние ~10 тыс. лет (410 без области генов HLA) — примерно в 20 раз больше, чем находили прежние работы. Медианная величина отбора для участков вне области HLA — 0,86 % за поколение. Пример: частота варианта гена HLA-DQB1 выросла примерно с 0 до 20 % за последние 4000 лет (оценка s = 4,4 %). У варианта гена TYK2 частота выросла примерно с 0 до 9 % между 9000 и 3000 лет назад, а затем снизилась примерно до 3 %: направление отбора менялось."],"paragraphs":["При этом направленный отбор объясняет лишь около 2 % изменений частот аллелей (2,16 ± 0,11 %); остальное — дрейф, переселения, смешение групп и колебания отбора. У современных людей вариант HLA-DQB1 связан с целиакией (у носителей двух копий восприимчивость выше в 19 раз), вариант TYK2 — с клинически значимым туберкулёзом; это ассоциации, измеренные сейчас, и они не называют фактор отбора в прошлом. Клинический пример приводится для демонстрации значения эволюционного механизма.","<b>Как это узнали.<\/b> Сравнили ДНК людей, живших в разные тысячелетия, и проверили, меняется ли частота варианта в одном направлении сильнее, чем дают родство, переселения и смешение групп.","<b>Граница вывода.<\/b> Признак-мишень и причина отбора неизвестны; модель предполагает постоянный отбор; результат относится к Западной Евразии.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 4."],"conditions":"Схема по данным работы, упрощённая · точки — опубликованные округлённые значения; линия между ними условна.","sources":["src_09"],"base":"БИО-13·24, БИО-13·25","level":"adv","next_base":"integration","quiz":{"id":"S13-L31","question":"Направленный отбор найден в 479 участках. Какая доля изменений частот им объясняется?","options":[{"id":"S13-L31-1","text":"Около 2 %","correct":true,"feedback":"Большая часть изменений — дрейф, переселения и смешение"},{"id":"S13-L31-2","text":"Почти все изменения","correct":false,"feedback":"Сотни участков — малая часть генома и изменений частот"},{"id":"S13-L31-3","text":"Около половины","correct":false,"feedback":"По оценке авторов — около 2 %"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как менялась частота аллеля по древней ДНК?","status":"Схема по данным работы, упрощённая · точки опубликованы округлёнными; линия условна","modes_label":"Аллель","modes":["HLA-DQB1","TYK2","все участки"],"args":[{"al":"hla"},{"al":"tyk"},{"al":"all"}],"notes":["~4000 лет назад около 0 %, сейчас около 20 %; s = 4,4 %","Около 0 → 9 → 3 %; s = +2,3 % и −1,9 %","479 участков; медиана |s| 0,86 %; отбор объясняет около 2 % изменений"],"static":["Траектории частоты двух аллелей и сводка по всем участкам"],"scene":"s13_a4","L":{"a4_pA":"Частота аллеля во времени (Западная Евразия)","a4_xaxis":"тыс. лет назад","a4_yaxis":"частота","a4_about":"около {p} %","a4_legend":"кружок — опубликованное округлённое значение; пунктир — условное соединение; штриховка — не измерено","a4_pB":"Все участки","a4_all_1":"479 независимых участков с направленным отбором (410 без области генов HLA)","a4_all_2":"медиана |s| для участков вне области HLA — 0,86 % за поколение","a4_all_3":"доля изменений частот, объяснимая направленным отбором, — около 2 % (2,16 ± 0,11 %)","a4_all_note":"Остальное — дрейф, переселения, смешение и колебания отбора."}}},"adv_kind":"Новые данные"},{"id":"trd-human","num":32,"section":3,"questions":[4],"title":"Есть ли у человека нарушения менделевской передачи?","keywords":[],"lead":["У мышей и дрозофил элементы, нарушающие передачу, хорошо изучены. Систематический обзор проверил, что известно о человеке."],"mechanism":["Авторы отобрали 96 работ (из 2234 найденных), в которых сообщалось об искажении передачи аллелей у человека — отклонении от передачи 1 : 1 у гетерозиготного родителя. В них 42 заявленных случая. Согласующиеся повторные данные нашлись только для 4 генов. Случаев, сравнимых по надёжности с драйверами мышей и дрозофил, не найдено."],"paragraphs":["Главные причины ненадёжности: семьи набирали через больных родственников, выборки малы, возможны ошибки определения генотипов, результаты не воспроизводятся, механизм почти не проверяли. Искажение передачи может возникать не только в мейозе, но и при конкуренции гамет или гибели части эмбрионов.","<b>Как это узнали.<\/b> Авторы систематически собрали и оценили опубликованные сообщения, а не получали новых данных.","<b>Граница вывода.<\/b> Отсутствие надёжных примеров не доказывает, что искажений передачи у человека нет.","<b>На практикуме.<\/b> Вкладка 4, шаг 4.5 — учебная модель того, к чему привёл бы сильный драйв."],"conditions":"Схема по данным обзора, упрощённая · числа — подсчёт работ и случаев.","sources":["src_10"],"base":"БИО-13·30","level":"adv","next_base":"integration","quiz":{"id":"S13-L32","question":"Что следует из обзора?","options":[{"id":"S13-L32-1","text":"У человека драйва не бывает","correct":false,"feedback":"Отсутствие доказательств — не доказательство отсутствия"},{"id":"S13-L32-2","text":"Надёжных примеров у человека пока нет","correct":true,"feedback":"Даже согласующиеся данные по 4 генам получены с систематическими ошибками; примеров, сравнимых с мышами и дрозофилой, нет"},{"id":"S13-L32-3","text":"Драйв у человека уже доказан для 42 генов","correct":false,"feedback":"42 — заявленные случаи; повторно согласуются данные лишь по 4 генам"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что показал обзор случаев искажения передачи у человека?","status":"Схема по данным обзора, упрощённая · подсчёт работ","modes_label":"Этап обзора","modes":["работы","заявленные случаи","повторно согласуются"],"args":[{"s":1},{"s":2},{"s":3}],"notes":["Из 2234 найденных отобрано 96 работ","В них 42 заявленных случая","Согласующиеся повторные данные — 4 гена"],"static":["Воронка отбора работ и случаев искажения передачи у человека"],"scene":"s13_r_trd","L":{"r_trd_1":"найдено 2234 работы","r_trd_2":"включено 96","r_trd_3":"заявлено 42 случая","r_trd_4":"повторно согласуются 4 гена","r_trd_5":"надёжных случаев, как у мышей и дрозофил, — нет"}}},"adv_kind":"Новые данные"},{"id":"integration","num":33,"section":4,"questions":[1,2,3,4],"title":"Итоговая задача: почему изменилась частота?","keywords":[],"lead":["Одно наблюдение совместимо с разными процессами. Задача — назвать допустимые объяснения и данные, которые их различают."],"mechanism":["Порядок рассуждения: 1) что изменилось — частоты аллелей, доли генотипов или то и другое; 2) какие процессы дают такое изменение (неслучайное скрещивание и структура меняют доли; дрейф, отбор, поток генов и мутации — частоты); 3) направленное это изменение или случайное — по повторам в независимых популяциях; 4) какие данные различат оставшиеся объяснения — происхождение образцов, родство, численность, частоты у мигрантов, выживание генотипов. Если данных нет, правильный ответ — «нельзя различить»."],"paragraphs":["Четыре ситуации итоговой задачи практикума: дефицит гетерозигот при прежней частоте (инбридинг, структура или отбор против гетерозигот — без данных нельзя различить); разные исходы одинаковых малых популяций: дрейф совместим с наблюдением, слабый отбор по этим данным не исключён — без данных о выживании генотипов различить нельзя; стабильная промежуточная частота при местном отборе (поток генов); одинаковый сдвиг во всех независимых популяциях (отбор или общий источник мигрантов).","<b>На практикуме.<\/b> Итоговая задача под вкладкой 4.","<b>Ограничения.<\/b> Учебные ситуации упрощены: в природе процессы действуют одновременно."],"conditions":"Схема рассуждения учебная.","sources":["src_01"],"base":"БИО-13·12, БИО-13·16, БИО-13·27, БИО-13·28","quiz":{"id":"S13-L33","question":"Частота аллеля одинаково выросла в 10 из 10 независимых популяций. Какой процесс исключается?","options":[{"id":"S13-L33-1","text":"Отбор","correct":false,"feedback":"Одинаковый сдвиг как раз совместим с отбором"},{"id":"S13-L33-2","text":"Поток генов из общего источника","correct":false,"feedback":"Общий источник мигрантов мог бы дать такой сдвиг — его проверяют отдельно"},{"id":"S13-L33-3","text":"Только дрейф","correct":true,"feedback":"Дрейф дал бы разные направления в разных популяциях"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему изменилась частота?","status":"Учебная схема рассуждения","modes_label":"Ситуация","modes":["I дефицит гетерозигот","II разные исходы","III стабильная частота","IV одинаковый сдвиг"],"args":[{"case":1},{"case":2},{"case":3},{"case":4}],"notes":["Без данных — нельзя различить","Дрейф совместим с наблюдением; слабый отбор по этим данным не исключён — без данных о выживании генотипов различить нельзя","Поток генов против отбора","Отбор или общий источник мигрантов"],"static":["Четыре наблюдения и путь рассуждения к объяснению"],"scene":"s13_int","L":{"fin_f1":"Ситуация I: доли генотипов — наблюдение и ожидание при частоте 0,7","t1_b_exp":"ожид.","t1_b_def":"дефицит","fin_f2":"Ситуация II: частота A в 10 популяциях по 50 особей, 60 поколений","t3_g_x":"поколение","fin_f3":"Ситуация III: частота A на острове по поколениям","fin_f4":"Ситуация IV: частота A — одна и та же линия в 10 популяциях"}}}},{"id":"links","num":34,"section":4,"questions":[1,2,3,4],"title":"Связи и что дальше","keywords":[],"lead":[],"mechanism":[],"paragraphs":[{"h":"Что понадобилось из прежних семинаров"},{"ul":["[[seminar-6-route.html#meiosis-one|семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»]] — почему гамета несёт одну копию локуса","[[seminar-6-route.html#crossing-over|семинар 6: «Кроссинговер и хиазмы: обмен и связь»]] — откуда новые сочетания аллелей","[[seminar-8-route.html#fixation|семинар 8: «Как изменение закрепляется при репликации»]] — откуда новый аллель","[[seminar-12-route.html#selection|семинар 12: «Условия естественного отбора»]] — что нужно для отбора"]},{"h":"Где это понадобится дальше в разделе"},{"ul":["БИО-13·15, БИО-13·17 → [[seminar-15-route.html#ils|семинар 15: «Неполная сортировка линий»]] — две копии гена сливаются в среднем за 2Ne поколений, поэтому несовпадение дерева гена с деревом видов встречается часто, когда предковые популяции велики","БИО-13·11 → [[seminar-16-route.html#structured-origin|семинар 16: «Структурированные предковые популяции»]] — предковое население человека тоже было разделено на частично обособленные популяции, которые обменивались генами","БИО-13·19 → [[seminar-16-route.html#dispersal|семинар 16: «Расселение из Африки»]] — последовательные эффекты основателя и дрейф уменьшали часть разнообразия с удалением от Африки","БИО-13·25 → [[seminar-16-route.html#amr|семинар 16: «Устойчивость к антимикробным препаратам»]] — препарат меняет среду отбора, и доля устойчивых вариантов растёт","БИО-13·28 → [[seminar-16-route.html#persistence|семинар 16: «Почему патогенные варианты сохраняются»]] — варианты, повышающие риск болезни, сохраняются по разным причинам, в том числе как равновесие мутаций и отбора","БИО-13·20 → [[seminar-14-route.html#neutral-theory|семинар 14: «Нейтральная теория: скорость замещений равна скорости мутаций»]] — закрепление нейтральных вариантов дрейфом лежит в основе нейтральной теории молекулярной эволюции"]},{"h":"Что дальше в курсе"},{"ul":["[[seminar-14-route.html|семинар 14: «Молекулярная эволюция генов и геномов»]] — как мутация становится различием между видами, что такое нейтральная эволюция и молекулярные часы; продолжает шаг БИО-13·20","Шаги-продолжения: [[seminar-14-route.html#four-concepts|семинар 14: «Мутационное событие, вариант, полиморфизм, замещение»]], [[seminar-14-route.html#nearly-neutral|семинар 14: «Почти нейтральная теория: значение численности»]], [[seminar-14-route.html#accumulation|семинар 14: «Различия накапливаются со временем»]]"]},{"h":"Дальше в курсе «Молекулярная биология»"},{"ul":["Почему эффект гетероплазмии может проявляться нелинейно — [[https://edu.mazunin.science/seminar-9-route.html#heteroplasmy-threshold|«Молекулярная биология», семинар 9]]","Почему одинаковая гетероплазмия не означает одинакового числа копий дикого типа — [[https://edu.mazunin.science/seminar-9-route.html#copy-number|«Молекулярная биология», семинар 9]]: популяция копий митохондриальной ДНК в клетке тоже подвержена случайным изменениям долей","Соматические мутации и клональная эволюция — «Молекулярная биология», раздел III/IV (в разработке)"]}],"conditions":"","sources":[],"service":true,"quiz":{"id":"S13-L34","question":"Где в курсе разбирается, откуда берётся новый аллель?","options":[{"id":"S13-L34-1","text":"В теме о мейозе","correct":false,"feedback":"В мейозе возникают новые сочетания аллелей, а не новые аллели: [[seminar-6-route.html#crossing-over|семинар 6: «Кроссинговер и хиазмы: обмен и связь»]]."},{"id":"S13-L34-2","text":"В теме об ошибках, повреждениях ДНК и мутациях","correct":true,"feedback":"Новый аллель появляется как мутация: [[seminar-8-route.html#error-damage-mutation|семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»]]."},{"id":"S13-L34-3","text":"В теме об условиях естественного отбора","correct":false,"feedback":"Отбор меняет частоты уже имеющихся вариантов: [[seminar-12-route.html#selection|семинар 12: «Условия естественного отбора»]]."}]}}],"sections":[{"title":"Частоты и нулевая модель","entry":"population","sub":"Частоты и нулевая модель","label":"Тема 1","integr":false},{"title":"Структура популяции","entry":"nonrandom-mating","sub":"Структура популяции","label":"Тема 2","integr":false},{"title":"Случайность и численность","entry":"drift","sub":"Случайность и численность","label":"Тема 3","integr":false},{"title":"Отбор, поток генов, полиморфизм","entry":"sources","sub":"Отбор, поток генов, полиморфизм","label":"Тема 4","integr":false},{"title":"Итог","entry":"integration","sub":"Почему изменилась частота?","label":"Итог","integr":true}],"glossary":[{"id":"S13-T01","term":"Популяция","section":0,"def":"Совокупность особей одного вида, которые потенциально скрещиваются между собой и гены следующего поколения которых происходят из общего набора гамет; у бактерий, вирусов и клонов клеток — группа, выделенная по происхождению, среде и путям передачи."},{"id":"S13-T02","term":"Выборка","section":0,"def":"Обследованная часть популяции, по которой оценивают её генетический состав."},{"id":"S13-T03","term":"Локус","section":0,"def":"Определённое положение в геноме."},{"id":"S13-T04","term":"Аллель","section":0,"def":"Один из вариантов последовательности ДНК в данном локусе."},{"id":"S13-T05","term":"Генотип","section":0,"def":"Сочетание аллелей рассматриваемого локуса (или нескольких локусов) у особи."},{"id":"S13-T06","term":"Гомозигота","section":0,"def":"Особь с двумя одинаковыми аллелями локуса."},{"id":"S13-T07","term":"Гетерозигота","section":0,"def":"Особь с двумя разными аллелями локуса."},{"id":"S13-T08","term":"Гаплотип","section":0,"def":"Сочетание аллелей нескольких локусов на одной хромосоме; наследуется вместе, пока его не изменит рекомбинация."},{"id":"S13-T09","term":"Частота аллеля","section":0,"def":"Доля копий данного аллеля среди всех копий локуса в популяции или выборке."},{"id":"S13-T10","term":"Частота генотипа","section":0,"def":"Доля особей с данным генотипом в популяции или выборке."},{"id":"S13-T11","term":"Модель Харди–Вайнберга","section":0,"def":"Модель, по которой при случайном скрещивании и отсутствии отбора, мутаций, миграции и дрейфа частоты аллелей не меняются, а доли генотипов равны p², 2pq и q²."},{"id":"S13-T12","term":"Нулевая модель","section":0,"def":"Модель, описывающая состояние без исследуемых процессов; отклонение от неё указывает, что какой-то процесс действует, но не называет его."},{"id":"S13-T13","term":"Случайное скрещивание","section":0,"def":"Скрещивание, при котором выбор партнёра не зависит от его генотипа по рассматриваемому локусу."},{"id":"S13-T14","term":"Генетический дрейф","section":0,"def":"Случайные изменения частот аллелей из-за конечного числа копий генов, переданных следующему поколению."},{"id":"S13-T15","term":"Носитель","section":0,"def":"Гетерозиготная особь с одной копией рецессивного аллеля, у которой соответствующий признак не проявляется."},{"id":"S13-T16","term":"Пенетрантность","section":0,"def":"Доля особей с данным генотипом, у которых проявляется соответствующий признак."},{"id":"S13-T17","term":"Участок гомозиготности","section":0,"def":"Протяжённый отрезок хромосомы, на котором две копии генома особи одинаковы, потому что унаследованы от одного недавнего предка."},{"id":"S13-T18","term":"Сантиморган","section":0,"def":"Единица генетического расстояния: 1 сМ соответствует 1 % рекомбинантных гамет за один мейоз."},{"id":"S13-T19","term":"Гетерозиготность","section":0,"def":"Доля гетерозиготных особей по данному локусу в популяции; для генома одной особи — доля гетерозиготных позиций."},{"id":"S13-T20","term":"Неслучайное скрещивание","section":1,"def":"Скрещивание, при котором выбор партнёра зависит от родства или фенотипа."},{"id":"S13-T21","term":"Инбридинг","section":1,"def":"Скрещивание особей, более родственных, чем при случайном выборе партнёра."},{"id":"S13-T22","term":"Ассортативное скрещивание","section":1,"def":"Неслучайный выбор партнёра по фенотипу: со сходным (положительное) или отличающимся (отрицательное) признаком."},{"id":"S13-T23","term":"Коэффициент инбридинга (F)","section":1,"def":"Вероятность того, что две копии локуса у особи происходят от одной копии общего предка."},{"id":"S13-T24","term":"Популяционная структура","section":1,"def":"Неоднородность частот аллелей и генотипов между группами особей внутри популяции."},{"id":"S13-T25","term":"Дефицит гетерозигот","section":1,"def":"Разность между ожидаемой по модели Харди–Вайнберга и наблюдаемой долей гетерозигот."},{"id":"S13-T26","term":"Эффект Валунда","section":1,"def":"Дефицит гетерозигот относительно ожидания по общей частоте аллеля при объединении групп с разными частотами, даже если каждая группа в равновесии."},{"id":"S13-T27","term":"F_ST","section":1,"def":"Мера различия частот аллелей между группами: доля, на которую средняя гетерозиготность внутри групп меньше ожидаемой при общей частоте."},{"id":"S13-T28","term":"Слияние популяций","section":1,"def":"Объединение ранее разделённых популяций, после которого потомки несут предковые отрезки ДНК обеих."},{"id":"S13-T29","term":"Предковая популяция","section":1,"def":"Популяция, от которой унаследована часть ДНК современных людей."},{"id":"S13-T30","term":"Модель Райта–Фишера","section":2,"def":"Модель идеальной популяции постоянной численности, в которой копии генов каждого поколения случайно набираются из копий предыдущего."},{"id":"S13-T31","term":"Потеря аллеля","section":2,"def":"Снижение частоты аллеля до нуля."},{"id":"S13-T32","term":"Закрепление аллеля","section":2,"def":"Рост частоты аллеля в популяции до единицы, когда других аллелей локуса не остаётся; не путать с закреплением изменения ДНК при репликации."},{"id":"S13-T33","term":"Фактическая численность","section":2,"def":"Число особей в популяции по данным учёта."},{"id":"S13-T34","term":"Эффективная численность (Ne)","section":2,"def":"Численность идеальной популяции, в которой дрейф шёл бы с той же скоростью, что в реальной."},{"id":"S13-T35","term":"Узкое место","section":2,"def":"Резкое временное сокращение численности популяции, после которого сохраняется лишь часть прежнего генетического разнообразия."},{"id":"S13-T36","term":"Эффект основателя","section":2,"def":"Отличие частот аллелей в новой популяции, основанной немногими особями, от частот исходной популяции."},{"id":"S13-T37","term":"Нейтральный вариант","section":2,"def":"Вариант, не влияющий на приспособленность носителя."},{"id":"S13-T38","term":"Распределение частот вариантов","section":2,"def":"Сколько вариантов в выборке геномов встречается с каждой частотой: редкими, промежуточными, частыми."},{"id":"S13-T39","term":"Мутация","section":3,"def":"Наследуемое изменение последовательности ДНК."},{"id":"S13-T40","term":"Рекомбинация","section":3,"def":"Образование новых сочетаний аллелей при мейозе: при кроссинговере
