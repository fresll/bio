-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · равновесия — из эталона; приспособленности условные.</p></details></article><article class="card print-unit" id="ns-polymorphism"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 28 из 34</div><h2>Как сохраняется полиморфизм</h2><p class="lead"><a href="#ns-g-S13-T52">Полиморфизм</a> — существование в популяции двух и более аллелей локуса с заметной частотой. Он сохраняется несколькими путями, и не все они связаны с пользой вариантов.</p><div class="note"><strong>Что показывает схема.</strong> Четыре пути сохранения полиморфизма</div><p><a href="#ns-g-S13-T53">Балансирующий отбор</a> поддерживает несколько аллелей: при преимуществе гетерозигот (шаг <a href="#ns-selection-modes">«Как отбор меняет частоты: три режима»</a>); при <a href="#ns-g-S13-T54">отрицательном частотно-зависимом отборе</a>, когда преимущество получает редкий вариант и оно уменьшается по мере его распространения; при отборе, различающемся в разных частях ареала. Кроме того, частоты задаёт баланс процессов: поток генов против местного отбора (шаг <a href="#ns-combined">«Совместное действие: отбор против потока генов и против дрейфа»</a>); <a href="#ns-g-S13-T55">баланс мутаций и отбора</a>, при котором вредный аллель постоянно возникает заново и удаляется; баланс мутаций и дрейфа: новые нейтральные варианты возникают, пока прежние теряются.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-selection-modes">«Как отбор меняет частоты: три режима»</a>, шаг <a href="#ns-combined">«Совместное действие: отбор против потока генов и против дрейфа»</a></p><p>Поэтому отбор может действовать без закрепления какого-либо варианта: устойчивым полиморфизмом, сдвигом частот многих вариантов или различиями между популяциями. Наличие полиморфизма само по себе не говорит, какой из путей действует: высокая частота варианта не доказывает его пользу.</p><p><b>На практикуме.</b> Вкладка 4, шаги 4.2, 4.4; «Найти причину» (случай IV).</p><p><b>Ограничения.</b> Пути перечислены как модели; в каждом конкретном локусе их различают по данным.</p><div class="static-quiz"><h3>Какой путь поддерживает вредный аллель без какой-либо его пользы?</h3><ol><li><b>А.</b> Баланс мутаций и отбора <i>(верный вариант)</i><br><span class="expl">Аллель возникает мутациями с той же скоростью, с какой удаляется отбором; частота при этом низкая</span></li><li><b>Б.</b> Преимущество гетерозигот <i>(неверный вариант)</i><br><span class="expl">Здесь гетерозиготы выигрывают — польза есть</span></li><li><b>В.</b> Частотно-зависимый отбор <i>(неверный вариант)</i><br><span class="expl">Здесь выигрывает редкий вариант — тоже польза</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: сравнение путей сохранения полиморфизма.</p></details></article><article class="card print-unit" id="ns-adaptation"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 29 из 34</div><h2>Адаптация и как её доказывают</h2><p class="lead"><a href="#ns-g-S13-T56">Адаптация</a> — наследуемый признак, сформированный естественным отбором и повышающий приспособленность в определённых условиях; тем же словом называют процесс формирования таких признаков.</p><div class="note"><strong>Что показывает схема.</strong> Три линии доказательства адаптации и альтернативные объяснения</div><p>Чтобы признать признак адаптацией, мало найти его полезную функцию. Нужно показать наследуемую изменчивость признака, связь вариантов с приспособленностью и исторический процесс отбора. Гипотезу о приспособительном значении признака проверяют: выводят из неё предсказания и сравнивают с данными. Нынешняя польза могла появиться позже самого признака; признак мог возникнуть как побочное следствие другой адаптации, ограничений развития или как нейтральное наследие предков.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-selection-fitness">«Естественный отбор и приспособленность»</a>, шаг <a href="#ns-polymorphism">«Как сохраняется полиморфизм»</a></p><p>Стремление объяснять каждый признак как прямое решение какой-то задачи называют <a href="#ns-g-S13-T57">адаптационизмом</a>; его критикуют за то, что правдоподобная гипотеза принимается без проверки. Организмы несут следы своей истории и компромиссы: отбор изменяет доступные варианты, а не конструирует организм заново, и ведёт к приспособленности, а не к совершенству.</p><p><b>На практикуме.</b> Вкладка 4, «Найти причину» (случай IV): высокая частота варианта не доказывает отбор.</p><p><b>Ограничения.</b> Методы проверки адаптаций — тема старших курсов.</p><div class="static-quiz"><h3>Найдена полезная функция признака. Доказывает ли это, что признак — адаптация?</h3><ol><li><b>А.</b> Да: полезный признак всегда адаптация <i>(неверный вариант)</i><br><span class="expl">Признак мог возникнуть без отбора на эту функцию</span></li><li><b>Б.</b> Нет: нужна история отбора <i>(верный вариант)</i><br><span class="expl">Польза могла появиться позже, а признак — возникнуть иначе</span></li><li><b>В.</b> Да, если признак частый <i>(неверный вариант)</i><br><span class="expl">Высокая частота бывает и при дрейфе</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: три линии доказательства адаптации.</p></details></article><article class="card print-unit" id="ns-conflict"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 30 из 34</div><h2>Внутригеномные конфликты</h2><p class="lead">Отбор действует на разных уровнях: элемент генома может повышать собственную передачу потомкам даже за счёт успеха организма. Так возникает <a href="#ns-g-S13-T58">внутригеномный конфликт</a>.</p><div class="note"><strong>Что показывает схема.</strong> Траектории элемента с разной передачей и средняя приспособленность</div><p><a href="#ns-g-S13-T59">Эгоистичные генетические элементы</a> изменяют ход мейоза так, что сами передаются потомкам чаще других вариантов, независимо от влияния на приспособленность организма. <a href="#ns-g-S13-T60">Мейотический драйв</a> — нарушение менделевской передачи, при котором элемент попадает более чем в половину функциональных гамет гетерозиготы. В учебной модели (организм DD оставляет половину потомства, Dd и dd — полное) элемент с передачей 0,8 вместо 0,5 закрепляется, хотя средняя приспособленность популяции падает до 0,5; при передаче 0,6 устанавливается равновесие около 0,40; при 0,5 частота элемента медленно снижается.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-selection-modes">«Как отбор меняет частоты: три режима»</a>, шаг <a href="#ns-adaptation">«Адаптация и как её доказывают»</a></p><p>Классический пример — участок хромосомы 17 мыши (t-гаплотип): гетерозиготные самцы передают его до 99 % потомков; известен и комплекс генов искажения расщепления у дрозофилы. У человека систематический обзор опубликованных сообщений об <a href="#ns-g-S13-T61">искажении передачи аллелей</a> не нашёл ни одного случая, сравнимого по надёжности с примерами у модельных организмов (подробнее — шаг «Есть ли у человека нарушения менделевской передачи?»). Конфликт не означает «намерения» гена: результат возникает из различий в передаче элементов, клеток и организмов.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.5.</p><p><b>Ограничения.</b> Модель драйва условная: один локус, бесконечная численность, условные числа.</p><div class="static-quiz"><h3>Почему элемент, снижающий успех организма, может распространиться?</h3><ol><li><b>А.</b> Организм выигрывает от элемента <i>(неверный вариант)</i><br><span class="expl">В модели элемент организму вредит</span></li><li><b>Б.</b> Это невозможно: отбор его удалит <i>(неверный вариант)</i><br><span class="expl">Отбор на уровне передачи и на уровне организма направлен по-разному</span></li><li><b>В.</b> Он передаётся потомкам чаще половины <i>(верный вариант)</i><br><span class="expl">Преимущество передачи может перевесить вред</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1093/genetics/iyaf271">Dai Z., Costain G. A systematic review and critical analysis of the evidence for transmission ratio distortion in humans. Genetics 2026; 233: iyaf271</a></li></ul><p>Учебная модель · передача и приспособленности условные; траектории — из эталона.</p></details></article><article class="card print-unit" id="ns-ancient-selection"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 31 из 34</div><h2>Сотни случаев направленного отбора — и лишь малая доля изменений частот</h2><p class="lead"><a href="#ns-g-S13-T63">Древняя ДНК</a> позволяет увидеть, как частота аллеля менялась во времени, а не только сравнивать современных людей.</p><div class="note"><strong>Что показывает схема.</strong> Траектории частоты двух аллелей и сводка по всем участкам</div><p>По геномам 15 836 людей, живших в Западной Евразии за последние 18 тыс. лет, найдено 479 независимых участков генома с направленным отбором за последние ~10 тыс. лет (410 без области генов HLA) — примерно в 20 раз больше, чем находили прежние работы. Медианная величина отбора для участков вне области HLA — 0,86 % за поколение. Пример: частота варианта гена HLA-DQB1 выросла примерно с 0 до 20 % за последние 4000 лет (оценка s = 4,4 %). У варианта гена TYK2 частота выросла примерно с 0 до 9 % между 9000 и 3000 лет назад, а затем снизилась примерно до 3 %: направление отбора менялось.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-selection-fitness">«Естественный отбор и приспособленность»</a>, шаг <a href="#ns-selection-modes">«Как отбор меняет частоты: три режима»</a></p><p>При этом направленный отбор объясняет лишь около 2 % изменений частот аллелей (2,16 ± 0,11 %); остальное — дрейф, переселения, смешение групп и колебания отбора. У современных людей вариант HLA-DQB1 связан с целиакией (у носителей двух копий восприимчивость выше в 19 раз), вариант TYK2 — с клинически значимым туберкулёзом; это ассоциации, измеренные сейчас, и они не называют фактор отбора в прошлом. Клинический пример приводится для демонстрации значения эволюционного механизма.</p><p><b>Как это узнали.</b> Сравнили ДНК людей, живших в разные тысячелетия, и проверили, меняется ли частота варианта в одном направлении сильнее, чем дают родство, переселения и смешение групп.</p><p><b>Граница вывода.</b> Признак-мишень и причина отбора неизвестны; модель предполагает постоянный отбор; результат относится к Западной Евразии.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 4.</p><div class="static-quiz"><h3>Направленный отбор найден в 479 участках. Какая доля изменений частот им объясняется?</h3><ol><li><b>А.</b> Около 2 % <i>(верный вариант)</i><br><span class="expl">Большая часть изменений — дрейф, переселения и смешение</span></li><li><b>Б.</b> Почти все изменения <i>(неверный вариант)</i><br><span class="expl">Сотни участков — малая часть генома и изменений частот</span></li><li><b>В.</b> Около половины <i>(неверный вариант)</i><br><span class="expl">По оценке авторов — около 2 %</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-026-10358-1">Akbari A. et al. Ancient DNA reveals pervasive directional selection across West Eurasia. Nature 2026</a></li></ul><p>Схема по данным работы, упрощённая · точки — опубликованные округлённые значения; линия между ними условна.</p></details></article><article class="card print-unit" id="ns-trd-human"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 32 из 34</div><h2>Есть ли у человека нарушения менделевской передачи?</h2><p class="lead">У мышей и дрозофил элементы, нарушающие передачу, хорошо изучены. Систематический обзор проверил, что известно о человеке.</p><div class="note"><strong>Что показывает схема.</strong> Воронка отбора работ и случаев искажения передачи у человека</div><p>Авторы отобрали 96 работ (из 2234 найденных), в которых сообщалось об искажении передачи аллелей у человека — отклонении от передачи 1 : 1 у гетерозиготного родителя. В них 42 заявленных случая. Согласующиеся повторные данные нашлись только для 4 генов. Случаев, сравнимых по надёжности с драйверами мышей и дрозофил, не найдено.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-conflict">«Внутригеномные конфликты»</a></p><p>Главные причины ненадёжности: семьи набирали через больных родственников, выборки малы, возможны ошибки определения генотипов, результаты не воспроизводятся, механизм почти не проверяли. Искажение передачи может возникать не только в мейозе, но и при конкуренции гамет или гибели части эмбрионов.</p><p><b>Как это узнали.</b> Авторы систематически собрали и оценили опубликованные сообщения, а не получали новых данных.</p><p><b>Граница вывода.</b> Отсутствие надёжных примеров не доказывает, что искажений передачи у человека нет.</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.5 — учебная модель того, к чему привёл бы сильный драйв.</p><div class="static-quiz"><h3>Что следует из обзора?</h3><ol><li><b>А.</b> У человека драйва не бывает <i>(неверный вариант)</i><br><span class="expl">Отсутствие доказательств — не доказательство отсутствия</span></li><li><b>Б.</b> Надёжных примеров у человека пока нет <i>(верный вариант)</i><br><span class="expl">Даже согласующиеся данные по 4 генам получены с систематическими ошибками; примеров, сравнимых с мышами и дрозофилой, нет</span></li><li><b>В.</b> Драйв у человека уже доказан для 42 генов <i>(неверный вариант)</i><br><span class="expl">42 — заявленные случаи; повторно согласуются данные лишь по 4 генам</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1093/genetics/iyaf271">Dai Z., Costain G. A systematic review and critical analysis of the evidence for transmission ratio distortion in humans. Genetics 2026; 233: iyaf271</a></li></ul><p>Схема по данным обзора, упрощённая · числа — подсчёт работ и случаев.</p></details></article><article class="card print-unit" id="ns-integration"><div class="eyebrow">Итог · шаг 33 из 34</div><h2>Итоговая задача: почему изменилась частота?</h2><p class="lead">Одно наблюдение совместимо с разными процессами. Задача — назвать допустимые объяснения и данные, которые их различают.</p><div class="note"><strong>Что показывает схема.</strong> Четыре наблюдения и путь рассуждения к объяснению</div><p>Порядок рассуждения: 1) что изменилось — частоты аллелей, доли генотипов или то и другое; 2) какие процессы дают такое изменение (неслучайное скрещивание и структура меняют доли; дрейф, отбор, поток генов и мутации — частоты); 3) направленное это изменение или случайное — по повторам в независимых популяциях; 4) какие данные различат оставшиеся объяснения — происхождение образцов, родство, численность, частоты у мигрантов, выживание генотипов. Если данных нет, правильный ответ — «нельзя различить».</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-deficit-causes">«Почему дефицит гетерозигот не называет причину»</a>, шаг <a href="#ns-drift-size">«Сила дрейфа зависит от численности»</a>, шаг <a href="#ns-combined">«Совместное действие: отбор против потока генов и против дрейфа»</a>, шаг <a href="#ns-polymorphism">«Как сохраняется полиморфизм»</a></p><p>Четыре ситуации итоговой задачи практикума: дефицит гетерозигот при прежней частоте (инбридинг, структура или отбор против гетерозигот — без данных нельзя различить); разные исходы одинаковых малых популяций: дрейф совместим с наблюдением, слабый отбор по этим данным не исключён — без данных о выживании генотипов различить нельзя; стабильная промежуточная частота при местном отборе (поток генов); одинаковый сдвиг во всех независимых популяциях (отбор или общий источник мигрантов).</p><p><b>На практикуме.</b> Итоговая задача под вкладкой 4.</p><p><b>Ограничения.</b> Учебные ситуации упрощены: в природе процессы действуют одновременно.</p><div class="static-quiz"><h3>Частота аллеля одинаково выросла в 10 из 10 независимых популяций. Какой процесс исключается?</h3><ol><li><b>А.</b> Отбор <i>(неверный вариант)</i><br><span class="expl">Одинаковый сдвиг как раз совместим с отбором</span></li><li><b>Б.</b> Поток генов из общего источника <i>(неверный вариант)</i><br><span class="expl">Общий источник мигрантов мог бы дать такой сдвиг — его проверяют отдельно</span></li><li><b>В.</b> Только дрейф <i>(верный вариант)</i><br><span class="expl">Дрейф дал бы разные направления в разных популяциях</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-13.html#q1">Вопрос 1 →</a> <a href="seminar-13.html#q2">Вопрос 2 →</a> <a href="seminar-13.html#q3">Вопрос 3 →</a> <a href="seminar-13.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема рассуждения учебная.</p></details></article><article class="card print-unit" id="ns-links"><div class="eyebrow">Итог · шаг 34 из 34</div><h2>Связи и что дальше</h2><p class="lead"></p><ol class="mech"></ol><h3>Что понадобилось из прежних семинаров</h3><ul><li><a href="seminar-6-route.html#meiosis-one">семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»</a> — почему гамета несёт одну копию локуса</li><li><a href="seminar-6-route.html#crossing-over">семинар 6: «Кроссинговер и хиазмы: обмен и связь»</a> — откуда новые сочетания аллелей</li><li><a href="seminar-8-route.html#fixation">семинар 8: «Как изменение закрепляется при репликации»</a> — откуда новый аллель</li><li><a href="seminar-12-route.html#selection">семинар 12: «Условия естественного отбора»</a> — что нужно для отбора</li></ul><h3>Где это понадобится дальше в разделе</h3><ul><li>шаг <a href="#ns-drift">«Генетический дрейф: случайная выборка копий»</a>, шаг <a href="#ns-census-effective">«Фактическая и эффективная численность»</a> → <a href="seminar-15-route.html#ils">семинар 15: «Неполная сортировка линий»</a> — две копии гена сливаются в среднем за 2Ne поколений, поэтому несовпадение дерева гена с деревом видов встречается часто, когда предковые популяции велики</li><li>шаг <a href="#ns-wahlund">«Объединение групп: эффект Валунда»</a> → <a href="seminar-16-route.html#structured-origin">семинар 16: «Структурированные предковые популяции»</a> — предковое население человека тоже было разделено на частично обособленные популяции, которые обменивались генами</li><li>шаг <a href="#ns-bottleneck-founder">«Узкое место и эффект основателя»</a> → <a href="seminar-16-route.html#dispersal">семинар 16: «Расселение из Африки»</a> — последовательные эффекты основателя и дрейф уменьшали часть разнообразия с удалением от Африки</li><li>шаг <a href="#ns-selection-modes">«Как отбор меняет частоты: три режима»</a> → <a href="seminar-16-route.html#amr">семинар 16: «Устойчивость к антимикробным препаратам»</a> — препарат меняет среду отбора, и доля устойчивых вариантов растёт</li><li>шаг <a href="#ns-polymorphism">«Как сохраняется полиморфизм»</a> → <a href="seminar-16-route.html#persistence">семинар 16: «Почему патогенные варианты сохраняются»</a> — варианты, повышающие риск болезни, сохраняются по разным причинам, в том числе как равновесие мутаций и отбора</li><li>шаг <a href="#ns-fixation">«Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a> → <a href="seminar-14-route.html#neutral-theory">семинар 14: «Нейтральная теория: скорость замещений равна скорости мутаций»</a> — закрепление нейтральных вариантов дрейфом лежит в основе нейтральной теории молекулярной эволюции</li></ul><h3>Что дальше в курсе</h3><ul><li><a href="seminar-14-route.html">семинар 14: «Молекулярная эволюция генов и геномов»</a> — как мутация становится различием между видами, что такое нейтральная эволюция и молекулярные часы; продолжает шаг <a href="#ns-fixation">«Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a></li><li>Шаги-продолжения: <a href="seminar-14-route.html#four-concepts">семинар 14: «Мутационное событие, вариант, полиморфизм, замещение»</a>, <a href="seminar-14-route.html#nearly-neutral">семинар 14: «Почти нейтральная теория: значение численности»</a>, <a href="seminar-14-route.html#accumulation">семинар 14: «Различия накапливаются со временем»</a></li></ul><h3>Дальше в курсе «Молекулярная биология»</h3><ul><li>Почему эффект гетероплазмии может проявляться нелинейно — <a href="https://edu.mazunin.science/seminar-9-route.html#heteroplasmy-threshold">«Молекулярная биология», семинар 9</a></li><li>Почему одинаковая гетероплазмия не означает одинакового числа копий дикого типа — <a href="https://edu.mazunin.science/seminar-9-route.html#copy-number">«Молекулярная биология», семинар 9</a>: популяция копий митохондриальной ДНК в клетке тоже подвержена случайным изменениям долей</li><li>Соматические мутации и клональная эволюция — «Молекулярная биология», раздел III/IV (в разработке)</li></ul><div class="static-quiz"><h3>Где в курсе разбирается, откуда берётся новый аллель?</h3><ol><li><b>А.</b> В теме о мейозе <i>(неверный вариант)</i><br><span class="expl">В мейозе возникают новые сочетания аллелей, а не новые аллели: <a href="seminar-6-route.html#crossing-over">семинар 6: «Кроссинговер и хиазмы: обмен и связь»</a>.</span></li><li><b>Б.</b> В теме об ошибках, повреждениях ДНК и мутациях <i>(верный вариант)</i><br><span class="expl">Новый аллель появляется как мутация: <a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a>.</span></li><li><b>В.</b> В теме об условиях естественного отбора <i>(неверный вариант)</i><br><span class="expl">Отбор меняет частоты уже имеющихся вариантов: <a href="seminar-12-route.html#selection">семинар 12: «Условия естественного отбора»</a>.</span></li></ol></div><p class="practice-row">Шаг относится ко всем вкладкам практикума. <a href="seminar-13.html#q1">Вопрос 1 →</a> <a href="seminar-13.html#q2">Вопрос 2 →</a> <a href="seminar-13.html#q3">Вопрос 3 →</a> <a href="seminar-13.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"></ul><p></p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S13-T01"><dt>Популяция</dt><dd>Совокупность особей одного вида, которые потенциально скрещиваются между собой и гены следующего поколения которых происходят из общего набора гамет; у бактерий, вирусов и клонов клеток — группа, выделенная по происхождению, среде и путям передачи.</dd></div><div id="ns-g-S13-T02"><dt>Выборка</dt><dd>Обследованная часть популяции, по которой оценивают её генетический состав.</dd></div><div id="ns-g-S13-T03"><dt>Локус</dt><dd>Определённое положение в геноме.</dd></div><div id="ns-g-S13-T04"><dt>Аллель</dt><dd>Один из вариантов последовательности ДНК в данном локусе.</dd></div><div id="ns-g-S13-T05"><dt>Генотип</dt><dd>Сочетание аллелей рассматриваемого локуса (или нескольких локусов) у особи.</dd></div><div id="ns-g-S13-T06"><dt>Гомозигота</dt><dd>Особь с двумя одинаковыми аллелями локуса.</dd></div><div id="ns-g-S13-T07"><dt>Гетерозигота</dt><dd>Особь с двумя разными аллелями локуса.</dd></div><div id="ns-g-S13-T08"><dt>Гаплотип</dt><dd>Сочетание аллелей нескольких локусов на одной хромосоме; наследуется вместе, пока его не изменит рекомбинация.</dd></div><div id="ns-g-S13-T09"><dt>Частота аллеля</dt><dd>Доля копий данного аллеля среди всех копий локуса в популяции или выборке.</dd></div><div id="ns-g-S13-T10"><dt>Частота генотипа</dt><dd>Доля особей с данным генотипом в популяции или выборке.</dd></div><div id="ns-g-S13-T11"><dt>Модель Харди–Вайнберга</dt><dd>Модель, по которой при случайном скрещивании и отсутствии отбора, мутаций, миграции и дрейфа частоты аллелей не меняются, а доли генотипов равны p², 2pq и q².</dd></div><div id="ns-g-S13-T12"><dt>Нулевая модель</dt><dd>Модель, описывающая состояние без исследуемых процессов; отклонение от неё указывает, что какой-то процесс действует, но не называет его.</dd></div><div id="ns-g-S13-T13"><dt>Случайное скрещивание</dt><dd>Скрещивание, при котором выбор партнёра не зависит от его генотипа по рассматриваемому локусу.</dd></div><div id="ns-g-S13-T14"><dt>Генетический дрейф</dt><dd>Случайные изменения частот аллелей из-за конечного числа копий генов, переданных следующему поколению.</dd></div><div id="ns-g-S13-T15"><dt>Носитель</dt><dd>Гетерозиготная особь с одной копией рецессивного аллеля, у которой соответствующий признак не проявляется.</dd></div><div id="ns-g-S13-T16"><dt>Пенетрантность</dt><dd>Доля особей с данным генотипом, у которых проявляется соответствующий признак.</dd></div><div id="ns-g-S13-T17"><dt>Участок гомозиготности</dt><dd>Протяжённый отрезок хромосомы, на котором две копии генома особи одинаковы, потому что унаследованы от одного недавнего предка.</dd></div><div id="ns-g-S13-T18"><dt>Сантиморган</dt><dd>Единица генетического расстояния: 1 сМ соответствует 1 % рекомбинантных гамет за один мейоз.</dd></div><div id="ns-g-S13-T19"><dt>Гетерозиготность</dt><dd>Доля гетерозиготных особей по данному локусу в популяции; для генома одной особи — доля гетерозиготных позиций.</dd></div><div id="ns-g-S13-T20"><dt>Неслучайное скрещивание</dt><dd>Скрещивание, при котором выбор партнёра зависит от родства или фенотипа.</dd></div><div id="ns-g-S13-T21"><dt>Инбридинг</dt><dd>Скрещивание особей, более родственных, чем при случайном выборе партнёра.</dd></div><div id="ns-g-S13-T22"><dt>Ассортативное скрещивание</dt><dd>Неслучайный выбор партнёра по фенотипу: со сходным (положительное) или отличающимся (отрицательное) признаком.</dd></div><div id="ns-g-S13-T23"><dt>Коэффициент инбридинга (F)</dt><dd>Вероятность того, что две копии локуса у особи происходят от одной копии общего предка.</dd></div><div id="ns-g-S13-T24"><dt>Популяционная структура</dt><dd>Неоднородность частот аллелей и генотипов между группами особей внутри популяции.</dd></div><div id="ns-g-S13-T25"><dt>Дефицит гетерозигот</dt><dd>Разность между ожидаемой по модели Харди–Вайнберга и наблюдаемой долей гетерозигот.</dd></div><div id="ns-g-S13-T26"><dt>Эффект Валунда</dt><dd>Дефицит гетерозигот относительно ожидания по общей частоте аллеля при объединении групп с разными частотами, даже если каждая группа в равновесии.</dd></div><div id="ns-g-S13-T27"><dt>F_ST</dt><dd>Мера различия частот аллелей между группами: доля, на которую средняя гетерозиготность внутри групп меньше ожидаемой при общей частоте.</dd></div><div id="ns-g-S13-T28"><dt>Слияние популяций</dt><dd>Объединение ранее разделённых популяций, после которого потомки несут предковые отрезки ДНК обеих.</dd></div><div id="ns-g-S13-T29"><dt>Предковая популяция</dt><dd>Популяция, от которой унаследована часть ДНК современных людей.</dd></div><div id="ns-g-S13-T30"><dt>Модель Райта–Фишера</dt><dd>Модель идеальной популяции постоянной численности, в которой копии генов каждого поколения случайно набираются из копий предыдущего.</dd></div><div id="ns-g-S13-T31"><dt>Потеря аллеля</dt><dd>Снижение частоты аллеля до нуля.</dd></div><div id="ns-g-S13-T32"><dt>Закрепление аллеля</dt><dd>Рост частоты аллеля в популяции до единицы, когда других аллелей локуса не остаётся; не путать с закреплением изменения ДНК при репликации.</dd></div><div id="ns-g-S13-T33"><dt>Фактическая численность</dt><dd>Число особей в популяции по данным учёта.</dd></div><div id="ns-g-S13-T34"><dt>Эффективная численность (Ne)</dt><dd>Численность идеальной популяции, в которой дрейф шёл бы с той же скоростью, что в реальной.</dd></div><div id="ns-g-S13-T35"><dt>Узкое место</dt><dd>Резкое временное сокращение численности популяции, после которого сохраняется лишь часть прежнего генетического разнообразия.</dd></div><div id="ns-g-S13-T36"><dt>Эффект основателя</dt><dd>Отличие частот аллелей в новой популяции, основанной немногими особями, от частот исходной популяции.</dd></div><div id="ns-g-S13-T37"><dt>Нейтральный вариант</dt><dd>Вариант, не влияющий на приспособленность носителя.</dd></div><div id="ns-g-S13-T38"><dt>Распределение частот вариантов</dt><dd>Сколько вариантов в выборке геномов встречается с каждой частотой: редкими, промежуточными, частыми.</dd></div><div id="ns-g-S13-T39"><dt>Мутация</dt><dd>Наследуемое изменение последовательности ДНК.</dd></div><div id="ns-g-S13-T40"><dt>Рекомбинация</dt><dd>Образование новых сочетаний аллелей при мейозе: при кроссинговере и независимом расхождении хромосом.</dd></div><div id="ns-g-S13-T41"><dt>Поток генов</dt><dd>Перенос генетических вариантов между популяциями с мигрирующими особями или гаметами.</dd></div><div id="ns-g-S13-T42"><dt>Наличная изменчивость</dt><dd>Генетический полиморфизм, уже существующий в популяции к моменту изменения условий.</dd></div><div id="ns-g-S13-T43"><dt>Естественный отбор</dt><dd>Изменение наследственного состава популяции, при котором варианты, оставляющие в данной среде больше потомков, увеличивают свою долю; требует изменчивости, наследственности и дифференциального воспроизводства. В этом семинаре: отбор описывают как неслучайное различие в передаче наследуемых вариантов следующему поколению из-за различий в выживании и размножении их носителей.</dd></div><div id="ns-g-S13-T44"><dt>Приспособленность</dt><dd>Вклад генотипа или фенотипа в следующее поколение в данных условиях.</dd></div><div id="ns-g-S13-T45"><dt>Относительная приспособленность (w)</dt><dd>Приспособленность генотипа, выраженная в долях приспособленности самого успешного генотипа.</dd></div><div id="ns-g-S13-T46"><dt>Коэффициент отбора (s)</dt><dd>Относительная разница приспособленности сравниваемых генотипов. В моделях отбора против генотипа s = 1 − w, и s &gt; 0 означает сниженную приспособленность; при описании изменения частоты варианта s &gt; 0 означает рост его частоты под действием отбора, s &lt; 0 — снижение. Какое соглашение принято, сказано в шаге.</dd></div><div id="ns-g-S13-T47"><dt>Средняя приспособленность</dt><dd>Средняя относительная приспособленность особей популяции, взвешенная по долям генотипов.</dd></div><div id="ns-g-S13-T48"><dt>Направленный отбор</dt><dd>Отбор, сдвигающий частоту аллеля или среднее значение признака в одну сторону.</dd></div><div id="ns-g-S13-T49"><dt>Преимущество гетерозигот</dt><dd>Более высокая приспособленность гетерозигот, чем обеих гомозигот (сверхдоминирование).</dd></div><div id="ns-g-S13-T50"><dt>Равновесие</dt><dd>Частота аллеля, при которой она не меняется от поколения к поколению; устойчивое, если отклонения возвращаются, неустойчивое, если нарастают.</dd></div><div id="ns-g-S13-T51"><dt>Половой отбор</dt><dd>Отбор по различиям в успехе спаривания и оплодотворения: через соревнование особей одного пола и через выбор партнёра.</dd></div><div id="ns-g-S13-T52"><dt>Полиморфизм</dt><dd>Существование в популяции двух и более аллелей локуса с заметной частотой.</dd></div><div id="ns-g-S13-T53"><dt>Балансирующий отбор</dt><dd>Отбор, поддерживающий в популяции несколько аллелей локуса.</dd></div><div id="ns-g-S13-T54"><dt>Отрицательный частотно-зависимый отбор</dt><dd>Отбор, при котором преимущество имеет редкий вариант и оно уменьшается по мере его распространения.</dd></div><div id="ns-g-S13-T55"><dt>Баланс мутаций и отбора</dt><dd>Равновесие, при котором вредный аллель возникает мутациями с той же скоростью, с какой удаляется отбором.</dd></div><div id="ns-g-S13-T56"><dt>Адаптация</dt><dd>Наследуемый признак, сформированный естественным отбором и повышающий приспособленность в определённых условиях; также процесс формирования таких признаков.</dd></div><div id="ns-g-S13-T57"><dt>Адаптационизм</dt><dd>Объяснение каждого признака как прямого результата отбора на его нынешнюю функцию без проверки других объяснений.</dd></div><div id="ns-g-S13-T58"><dt>Внутригеномный конфликт</dt><dd>Противоречие между передачей отдельного генетического элемента и успехом организма, несущего его.</dd></div><div id="ns-g-S13-T59"><dt>Эгоистичный генетический элемент</dt><dd>Вариант генома, который передаётся потомкам чаще других независимо от влияния на приспособленность организма.</dd></div><div id="ns-g-S13-T60"><dt>Мейотический драйв</dt><dd>Нарушение менделевской передачи, при котором элемент попадает более чем в половину функциональных гамет гетерозиготы.</dd></div><div id="ns-g-S13-T61"><dt>Искажение передачи аллелей</dt><dd>Отклонение доли потомков, получивших аллель от гетерозиготного родителя, от менделевского соотношения 1 : 1.</dd></div><div id="ns-g-S13-T62"><dt>Мобильный элемент</dt><dd>Последовательность ДНК, способная перемещаться или копироваться в другие места генома.</dd></div><div id="ns-g-S13-T63"><dt>Древняя ДНК</dt><dd>ДНК, выделенная из исторического или ископаемого материала; её подлинность подтверждают по характерным повреждениям и контролю загрязнения.</dd></div><div id="ns-g-S13-T64"><dt>Гамета</dt><dd>Половая клетка с одинарным набором хромосом; несёт одну копию каждого аутосомного локуса.</dd></div><div id="ns-g-S13-T65"><dt>Зигота</dt><dd>Клетка, образованная слиянием двух гамет при оплодотворении.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 13 · Популяционная генетика и механизмы эволюции · Объяснения","home_eyebrow":"Семинар 13 · самостоятельная подготовка · Объяснения","home_h1":"Популяционная генетика и механизмы эволюции\nНулевая модель Харди–Вайнберга, структура популяции, дрейф и эффективная численность, отбор и поток генов","home_lead":"Эта страница объясняет механизмы, которые моделирует практикум; её можно читать и без практикума. Шаги «сверх программы» не нужны для коллоквиума: они показывают, что известно сверх базового курса. Вопрос после шага — не проверка, а способ убедиться, что объяснение понято. Термины, выделенные ссылкой, открывают статью словаря. Схемы учебные: числа особей и параметры моделей условные, кроме подписанных; результат модели — предсказание, а не доказательство. У каждого утверждения назван его статус: наблюдение, расчёт по модели, реконструкция или гипотеза","start":"Начать с первой темы →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в эту страницу. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; самопроверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат","practice_p":"Восемь сценариев (по одному на каждую вкладку на базовом и продвинутом уровне) и итоговая задача: предсказание, наблюдение на схеме и разбор каждого ответа. Пройдите их после объяснений темы.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":" и на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: восемь сценариев и итоговая задача","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите результат, откройте схему и сопоставьте её с разбором. Переключатели показывают предсказания учебной модели, а не результат эксперимента: правила модели заданы заранее, а их основания и границы — в шагах «Объяснений».","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Шаг относится ко всем вкладкам практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Популяционная генетика и механизмы эволюции","num_fmt":"Тема {n}","back_to_seminar":"← К практикуму","all_seminars":"← Раздел III","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Показать схему целиком","zoom_area":"Увеличенная схема: прокрутите её по горизонтали","adv_badge":"сверх программы","base_progress":"Базовая подготовка","next_base":"К следующему базовому шагу →","base_prep":"Базовая подготовка","back_base":"← Вернуться к базовому шагу","viewed_label":"Просмотрено шагов","viewed":"просмотрен","stats":[["4 темы","частоты и нулевая модель; структура популяции; случайность и численность; отбор, поток генов, полиморфизм"],["34 шага","25 базовых — к коллоквиуму, 8 — сверх программы"],["10 вопросов","самопроверка по базовому уровню"]],"all_sections":"Все разделы","short_route":"Если времени мало: десять шагов, по которым построена самопроверка →"},"lessons":[{"id":"population","num":1,"section":0,"questions":[1],"title":"Что изучает популяционная генетика: особь не эволюционирует, меняется популяция","keywords":["Популяция","Выборка"],"lead":["Генотип особи в течение жизни не меняется. Эволюцию на уровне [[T01|популяции]] описывают как изменение частот наследуемых вариантов от поколения к поколению."],"mechanism":["Для вида с половым размножением популяция — совокупность особей, которые потенциально скрещиваются между собой, так что гены следующего поколения происходят из общего набора их гамет. Реальные популяции часто состоят из локальных групп, между которыми обмен особями ограничен. У бактерий, вирусов и клонов клеток популяцию выделяют по происхождению, среде и путям передачи. Поэтому границы популяции зависят и от биологии объекта, и от поставленного вопроса. О составе популяции судят по [[T02|выборке]] — обследованной части особей."],"paragraphs":["Оценка по выборке зависит от числа обследованных, способа их набора и точности определения генотипов. Две выборки из одной популяции дают немного разные частоты — это ошибка выборки, тот же случайный эффект, который в ряду поколений создаёт генетический дрейф (БИО-13·15).","Статусы утверждений — прежние: наблюдение и реконструкция; «показанной возможности» здесь соответствует расчёт по модели, а вывод, который пока не сопоставлен с данными, назван гипотезой ([[seminar-12-route.html#four-statuses|семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»]]).","<b>На практикуме.<\/b> Вкладка 1: поле из 200 условных особей — выборка, по которой считают частоты.","<b>Ограничения.<\/b> В природе граница популяции часто проводится косвенно — по расселению, родству и распределению вариантов."],"conditions":"Схема качественная: числа особей условные.","sources":["src_01"],"base":"вспомнить [[seminar-12-route.html#selection|семинар 12: «Условия естественного отбора»]]","quiz":{"id":"S13-L01","question":"Что меняется в ряду поколений при эволюции популяции?","options":[{"id":"S13-L01-1","text":"Частоты наследуемых вариантов","correct":true,"feedback":"Генотип каждой особи постоянен, а доли вариантов в популяции меняются"},{"id":"S13-L01-2","text":"Генотип каждой особи","correct":false,"feedback":"Генотип особи задан при оплодотворении и в течение жизни не меняется"},{"id":"S13-L01-3","text":"Только общая численность популяции","correct":false,"feedback":"Численность может не меняться, а частоты вариантов — меняться"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что меняется — генотип особи или частоты в популяции?","status":"Схема качественная · числа особей условные","modes_label":"Масштаб","modes":["особь","поколения","выборка"],"args":[{"view":"ind"},{"view":"gen"},{"view":"sample"}],"notes":["Генотип особи от рождения до смерти один и тот же","От поколения к поколению меняется доля значков A","Обследованная часть популяции — выборка; по ней оценивают частоты"],"static":["Генотип особи постоянен; частота A в популяции меняется от поколения к поколению; оценка частоты — по выборке"],"scene":"s13_r_generations","L":{"r_gen_ind":"особь Aa","r_gen_child":"детство","r_gen_adult":"зрелость","r_gen_old":"старость","r_gen_g1":"поколение 1","r_gen_p":"частота A","r_gen_g2":"поколение 2","r_gen_g3":"поколение 3","r_gen_sample":"выборка"}}}},{"id":"locus-allele","num":2,"section":0,"questions":[1],"title":"Локус, аллель, генотип, гаплотип: что именно считают","keywords":["Локус","Аллель","Генотип","Гомозигота","Гетерозигота","Гаплотип"],"lead":["Чтобы считать частоты, надо договориться, что считают: положение в геноме, его вариант, сочетание вариантов у особи или на одной хромосоме."],"mechanism":["[[T03|Локус]] — рассматриваемое положение в геноме. [[T04|Аллель]] — один из вариантов последовательности в этом локусе. [[T05|Генотип]] — сочетание аллелей локуса у особи: у диплоидной особи две копии аутосомного локуса, одна от отца и одна от матери. Особь с двумя одинаковыми аллелями — [[T06|гомозигота]] (AA или aa), с разными — [[T07|гетерозигота]] (Aa). [[T08|Гаплотип]] — сочетание аллелей нескольких локусов на одной хромосоме; оно наследуется вместе, пока его не изменит рекомбинация."],"paragraphs":["В мейозе гомологичные хромосомы расходятся в разные клетки, поэтому [[T64|гамета]] несёт одну копию каждого аутосомного локуса, а диплоидная особь передаёт потомку одну из двух своих копий. Отсюда счёт: в популяции из N диплоидных особей 2N копий аутосомного локуса.","<b>На практикуме.<\/b> Вкладка 1: цвет значка — генотип; синяя половина — копия A, оранжевая — копия a.","<b>Ограничения.<\/b> Здесь рассматриваются аутосомные локусы с двумя аллелями; у локусов X-хромосомы и митохондриальной ДНК счёт копий другой."],"conditions":"Схема качественная: хромосомы и значки условны.","sources":["src_01"],"base":"БИО-13·1; вспомнить [[seminar-6-route.html#meiosis-one|семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»]]","quiz":{"id":"S13-L02","question":"Сколько копий аутосомного локуса в популяции из 50 диплоидных особей?","options":[{"id":"S13-L02-1","text":"50","correct":false,"feedback":"У диплоидной особи две копии каждого аутосомного локуса"},{"id":"S13-L02-2","text":"100","correct":true,"feedback":"По две копии у каждой особи"},{"id":"S13-L02-3","text":"200","correct":false,"feedback":"200 копий было бы у 100 особей или у тетраплоидов"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что такое локус, аллель, генотип, гаплотип?","status":"Схема качественная · хромосомы условны","modes_label":"Объект","modes":["локус и аллели","генотипы","гаплотипы","гаметы"],"args":[{"obj":"locus"},{"obj":"geno"},{"obj":"haplo"},{"obj":"gamete"}],"notes":["Локус — место; аллели — варианты в этом месте","Две копии локуса у диплоидной особи","Сочетание аллелей двух локусов на одной хромосоме","Гамета несёт одну копию локуса"],"static":["Локус, аллели A и a, три генотипа, два гаплотипа, гамета с одной копией"],"scene":"s13_r_locus","L":{"r_loc_locus":"локус","r_loc_A":"аллель A","r_loc_a":"аллель a","r_loc_pair":"пара гомологичных хромосом","r_loc_AA":"гомозигота AA","r_loc_Aa":"гетерозигота Aa","r_loc_aa":"гомозигота aa","r_loc_hAB":"гаплотип A B","r_loc_hab":"гаплотип a b","r_loc_gam":"гамета"}},"zoomNarrow":true},"exam_quiz":{"id":"S13-E07","question":"Что такое гаплотип?","options":[{"id":"S13-E07-1","text":"Аллели нескольких локусов одной хромосомы","correct":true,"feedback":"Наследуется вместе, пока его не изменит рекомбинация"},{"id":"S13-E07-2","text":"Генотип гаплоидной клетки по одному локусу","correct":false,"feedback":"Гаплотип описывает несколько локусов"},{"id":"S13-E07-3","text":"Половина генома особи","correct":false,"feedback":"Гаплотип относится к участку хромосомы"}]}},{"id":"counting","num":3,"section":0,"questions":[1],"title":"Как считать частоты аллелей и генотипов","keywords":["Частота аллеля","Частота генотипа"],"lead":["[[T09|Частота аллеля]] — доля его копий среди всех копий локуса. [[T10|Частота генотипа]] — доля особей с этим генотипом."],"mechanism":["Пусть в выборке N_AA особей AA, N_Aa особей Aa и N_aa особей aa; N — их сумма, копий локуса — 2N. Особь AA несёт две копии A, Aa — одну. Поэтому частота аллеля A: p = (2 × N_AA + N_Aa) / 2N; частота аллеля a: q = (2 × N_aa + N_Aa) / 2N; p + q = 1. Пример: 98 AA, 84 Aa, 18 aa из 200 особей. Копий A — 2 × 98 + 84 = 280 из 400, p = 0,70; q = 0,30. Частоты генотипов: 0,49; 0,42; 0,09."],"paragraphs":["Частоту аллеля нельзя путать ни с долей гомозигот (здесь 0,49), ни с долей особей, несущих хотя бы одну копию A (0,91). По частотам генотипов частоты аллелей находят всегда; обратный путь — от частот аллелей к генотипам — требует модели (БИО-13·4). Две выборки могут иметь одинаковые частоты аллелей и разные частоты генотипов: 98/84/18 и 108/64/28 — обе с p = 0,70, но гетерозигот 0,42 и 0,32.","<b>На практикуме.<\/b> Вкладка 1, шаги 1.1 и 1.2.","<b>Ограничения.<\/b> Это частоты в выборке: оценка частоты в популяции тем точнее, чем больше обследовано."],"conditions":"Расчёт по формуле; числа особей условные.","sources":["src_01"],"base":"БИО-13·2","quiz":{"id":"S13-L03","question":"В выборке 40 особей: 10 AA, 20 Aa, 10 aa. Какова частота A?","options":[{"id":"S13-L03-1","text":"0,25","correct":false,"feedback":"0,25 — доля особей AA, а не доля копий A"},{"id":"S13-L03-2","text":"0,75","correct":false,"feedback":"0,75 — доля особей с хотя бы одной копией A"},{"id":"S13-L03-3","text":"0,5","correct":true,"feedback":"(2 × 10 + 20) / 80 = 0,5"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как считать копии и частоты?","status":"Расчёт по формуле · числа особей условные","modes_label":"Выборка","modes":["98/84/18","108/64/28","особи и копии"],"args":[{"part":"S","si":0},{"part":"S","si":1},{"part":"S","si":0,"hideExp":true,"obsOnly":true}],"notes":["p = 280/400 = 0,70; доли 0,49 / 0,42 / 0,09","p = 280/400 = 0,70; доли 0,54 / 0,32 / 0,14","Доля AA 0,49 ≠ частота A 0,70; доля особей с A 0,91"],"static":["Две выборки с одинаковой частотой A 0,7 и разными долями генотипов"],"scene":"s13_t1","L":{"t1_ind_AA":"особь AA","t1_ind_Aa":"особь Aa","t1_ind_aa":"особь aa","t1_f_title":"Выборка: {n} условных особей","t1_f_inds":"Особи","t1_f_copies":"Копии локуса: {n}","t1_f_p":"Частота A: {p}","t1_b_title":"Доли генотипов: заливка — наблюдение, пунктир — ожидание нулевой модели","t1_b_exp":"ожид.","t1_b_def":"дефицит","t1_b_title_obs":"Доли генотипов: заливка — наблюдение"}}},"exam_quiz":{"id":"S13-E01","question":"Чему равна сумма частот двух аллелей локуса?","options":[{"id":"S13-E01-1","text":"Единице","correct":true,"feedback":"P + q = 1"},{"id":"S13-E01-2","text":"Двум — по числу копий","correct":false,"feedback":"Две копии у особи, но частоты — доли от всех копий"},{"id":"S13-E01-3","text":"Доле гетерозигот","correct":false,"feedback":"Доля гетерозигот — 2pq"}]}},{"id":"hw-null","num":4,"section":0,"questions":[1],"title":"Модель Харди–Вайнберга: ожидаемые доли генотипов","keywords":["Модель Харди–Вайнберга","Нулевая модель","Случайное скрещивание","Зигота"],"lead":["[[T11|Модель Харди–Вайнберга]] связывает частоты аллелей с ожидаемыми долями генотипов. Её применяют как [[T12|нулевую модель]] — состояние, с которым сравнивают реальную популяцию."],"mechanism":["Если гаметы объединяются случайно ([[T13|случайное скрещивание]]), вероятность того, что [[T65|зигота]] окажется AA, — p × p, aa — q × q, а Aa — 2pq (яйцеклетка A со сперматозоидом a или наоборот). Ожидаемые доли: p² (AA), 2pq (Aa), q² (aa); p² + 2pq + q² = 1. Модель даёт два вывода: при выполнении её допущений частоты аллелей не меняются из поколения в поколение, а доли генотипов равны p², 2pq и q². Популяцию, где это выполняется для данного локуса, называют находящейся в равновесии Харди–Вайнберга."],"paragraphs":["Для p = 0,7 ожидаются 0,49 / 0,42 / 0,09: выборка 98/84/18 им точно соответствует, а выборка 108/64/28 — нет (гетерозигот 0,32 вместо 0,42). Доля гетерозигот 2pq наибольшая (0,5) при p = 0,5. Равновесие Харди–Вайнберга относится к одному локусу и определённому набору условий: популяция может соответствовать модели по одному локусу и одновременно изменяться по другим.","<b>На практикуме.<\/b> Вкладка 1: контуры столбиков — ожидание модели, залитые столбики — наблюдение.","<b>Ограничения.<\/b> Модель описывает один аутосомный локус и неперекрывающиеся поколения."],"conditions":"Расчёт по модели; столбики — доли, а не измеренные данные.","sources":["src_01"],"base":"БИО-13·3","quiz":{"id":"S13-L04","question":"Частота A — 0,8. Какую долю гетерозигот ожидает модель?","options":[{"id":"S13-L04-1","text":"0,32","correct":true,"feedback":"2 × 0,8 × 0,2"},{"id":"S13-L04-2","text":"0,16","correct":false,"feedback":"0,16 — это pq; гетерозигота возникает двумя путями, поэтому 2pq"},{"id":"S13-L04-3","text":"0,64","correct":false,"feedback":"0,64 — ожидаемая доля AA (p²)"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие доли генотипов ожидаются при частоте p?","status":"Расчёт по модели Харди–Вайнберга","modes_label":"Частота A","modes":["p = 0,3","p = 0,5","p = 0,7","p = 0,8"],"args":[{"p":0.3},{"p":0.5},{"p":0.7},{"p":0.8}],"notes":["0,09 / 0,42 / 0,49","0,25 / 0,50 / 0,25 — гетерозигот больше всего","0,49 / 0,42 / 0,09","0,64 / 0,32 / 0,04"],"static":["Три кривые p², 2pq, q² от частоты A; вертикаль — выбранная p"],"scene":"s13_r_hwcurve","L":{"r_hw_x":"частота A (p)","r_hw_y":"доля генотипа","r_hw_p2":"p² (AA)","r_hw_q2":"q² (aa)","r_hw_2pq":"2pq (Aa)","r_hw_max":"максимум 2pq"}}},"exam_quiz":{"id":"S13-E02","question":"Какая доля aa ожидается при q = 0,1?","options":[{"id":"S13-E02-1","text":"0,1","correct":false,"feedback":"0,1 — частота аллеля a"},{"id":"S13-E02-2","text":"0,01","correct":true,"feedback":"Q² = 0,01"},{"id":"S13-E02-3","text":"0,18","correct":false,"feedback":"0,18 — ожидаемая доля гетерозигот"}]}},{"id":"hw-assumptions","num":5,"section":0,"questions":[1],"title":"Пять допущений нулевой модели и что даёт нарушение каждого","keywords":["Генетический дрейф"],"lead":["Модель перечисляет условия, при которых популяция не эволюционирует. Тем самым она перечисляет и процессы, которые могут менять частоты."],"mechanism":["Допущения: 1) нет отбора — все генотипы выживают и размножаются одинаково; 2) нет мутаций; 3) нет миграции; 4) численность бесконечно велика — случайные отклонения не меняют частот; 5) скрещивание случайное. Нарушение первых четырёх меняет частоты аллелей: отбор, мутации и миграция — направленно, конечная численность — случайно ([[T14|генетический дрейф]]). Нарушение пятого допущения частот аллелей не меняет, но меняет доли генотипов. Отбор, действующий между образованием зиготы и размножением, меняет частоты аллелей; в показанной модели (1; 1; 0,6) у взрослых доли генотипов ещё и отклоняются от ожидания для новой частоты. При некоторых соотношениях приспособленностей такого отклонения нет, поэтому равновесие у взрослых не исключает отбора."],"paragraphs":["Пример по модели (исходно p = 0,7): инбридинг F = 0,25 — частота 0,7, гетерозигот 0,315 вместо 0,42; мигранты (пятая часть, частота у них 0,2) — частота 0,6; мутации A → a с частотой 10⁻⁵ — частота 0,699993; отбор против aa (приспособленность 0,6) — частота 0,726 и доля aa у взрослых 0,056 при ожидании 0,075. Мутации сами по себе меняют частоты медленно: они создают варианты, а заметный сдвиг частот за немногие поколения дают другие процессы.","<b>На практикуме.<\/b> Вкладка 1, шаги 1.3–1.6 — конструктор допущений.","<b>Ограничения.<\/b> Параметры условные; модель показывает одно поколение."],"conditions":"Учебная модель · условные параметры; результат переключателя — предсказание модели.","sources":["src_01"],"base":"БИО-13·4","quiz":{"id":"S13-L05","question":"Нарушение какого допущения само по себе не меняет частоты аллелей?","options":[{"id":"S13-L05-1","text":"Отсутствия миграции между популяциями","correct":false,"feedback":"Мигранты приносят свои копии и сдвигают частоту"},{"id":"S13-L05-2","text":"Случайного скрещивания","correct":true,"feedback":"Выбор партнёра перераспределяет копии между генотипами, не меняя их числа"},{"id":"S13-L05-3","text":"Большой численности","correct":false,"feedback":"В конечной популяции частоты меняются случайно — это дрейф"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что меняет нарушение каждого допущения?","status":"Учебная модель · условные параметры; результат — предсказание модели","modes_label":"Снято допущение","modes":["модель собрана","случайное скрещивание","большая численность","нет отбора","нет миграции","нет мутаций"],"args":[{"part":"K","removed":[]},{"part":"K","removed":["random_mating"]},{"part":"K","removed":["large_N"]},{"part":"K","removed":["no_selection"]},{"part":"K","removed":["no_migration"]},{"part":"K","removed":["no_mutation"]}],"notes":["Ничего не меняется: 0,7; 0,49 / 0,42 / 0,09","Частота 0,7; доли 0,5425 / 0,315 / 0,1425","Частота 0,85 в показанном повторе (7 AA, 3 Aa)","Частота 0,726; aa у взрослых 0,056 при ожидании 0,075","Частота 0,6; доли 0,36 / 0,48 / 0,16","Частота 0,699993 — незаметно за поколение"],"static":["Этапы поколения и что меняет снятие каждого допущения"],"scene":"s13_t1","L":{"t1_ind_AA":"особь AA","t1_ind_Aa":"особь Aa","t1_ind_aa":"особь aa","t1_k_par":"Родители","t1_k_p":"p = {p}","t1_k_gam":"Гаметы","t1_k_zyg":"Зиготы","t1_k_adu":"Взрослые","t1_k_bars":"Взрослые следующего поколения: доли и ожидание при новой частоте","t1_b_exp":"ожид.","t1_par_rm":"инбридинг: F = 0,25","t1_k_n10":"выборка 10 особей","t1_par_n":"численность: N = 10","t1_par_sel":"приспособленность aa: 0,6","t1_par_mig":"мигранты: доля 0,2, частота A 0,2","t1_par_mut":"мутации A → a: 10⁻⁵"}},"zoomNarrow":true}},{"id":"hw-use","num":6,"section":0,"questions":[1],"title":"Как применяют нулевую модель: частота носителей и отклонения от равновесия","keywords":["Носитель","Пенетрантность"],"lead":["Нулевая модель позволяет оценить то, что трудно измерить прямо, и обнаружить отклонение, требующее объяснения."],"mechanism":["Пример расчёта. Аутосомно-рецессивное заболевание встречается у 1 из 4900 новорождённых. В простейшей модели доля больных q² = 1/4900, отсюда q = 1/70 ≈ 0,014, p ≈ 0,986 и доля гетерозиготных [[T15|носителей]] 2pq ≈ 0,028 — примерно 1 из 35. Почти все копии редкого рецессивного аллеля находятся у носителей, а не у больных. Расчёт верен только при допущениях: случайное скрещивание, отсутствие популяционной структуры, все патогенные варианты гена учтены как один аллель, заболевание проявляется у каждой особи aa ([[T16|пенетрантность]] полная) и диагноз точен."],"paragraphs":["Второе применение — проверка выборки. Если наблюдаемые доли генотипов значимо отличаются от p², 2pq и q², нарушено хотя бы одно допущение, но какое — модель не говорит. Дефицит гетерозигот дают инбридинг, скрытая структура, отбор против гетерозигот и ошибки определения генотипов (БИО-13·12). Поэтому проверка равновесия — начало анализа, а не вывод.","<b>На практикуме.<\/b> Вкладка 1, шаг 1.7.","<b>Ограничения.<\/b> Клинический пример приводится для демонстрации значения эволюционного механизма. При нескольких разных патогенных вариантах, неполной пенетрантности, структуре популяции или эффекте основателя реальная доля носителей отличается от расчёта."],"conditions":"Расчёт по модели при перечисленных допущениях; доля больных условная.","sources":["src_01"],"base":"БИО-13·4, БИО-13·5","quiz":{"id":"S13-L06","question":"Почему отклонение выборки от равновесия не доказывает действия отбора?","options":[{"id":"S13-L06-1","text":"Отбор не меняет долей генотипов","correct":false,"feedback":"Меняет: отбор по выживанию сдвигает доли у взрослых"},{"id":"S13-L06-2","text":"Модель не применима к людям","correct":false,"feedback":"Применима как нулевая модель; вопрос в том, что означает отклонение"},{"id":"S13-L06-3","text":"Такое отклонение дают и другие причины","correct":true,"feedback":"Инбридинг, структура, ошибки генотипирования"}]},"widget":{"kind":"dna","title":"","s":{"title":"Сколько носителей при доле больных 1 из 4900?","status":"Расчёт по модели · доля больных условная","modes_label":"Расчёт","modes":["больные","носители","допущения"],"args":[{"step":1},{"step":2},{"step":3}],"notes":["q² = 1/4900, q = 1/70","2pq ≈ 0,028 — около 1 из 35; почти все копии a у носителей","Расчёт верен только при этих допущениях"],"static":["От доли больных к доле носителей и допущения расчёта"],"scene":"s13_r_carriers","L":{"r_car_ill":"aa: 1 из 4900","r_car_q":"q = 1/70","r_car_carr":"носители Aa","r_car_2pq":"2pq ≈ {v}","r_car_35":"около 1 из 35","r_car_ass":"Расчёт верен только при допущениях:","r_car_a1":"случайное скрещивание","r_car_a2":"нет структуры","r_car_a3":"один аллель a","r_car_a4":"полная пенетрантность"}}}},{"id":"ranis-roh","num":7,"section":0,"questions":[1],"title":"Малая группа одних из самых ранних людей современного типа в Европе","keywords":["Участок гомозиготности","Сантиморган","Гетерозиготность"],"lead":["Генотип одного человека хранит след численности его предков: в малой группе у родителей чаще общие недавние предки."],"mechanism":["Если отцовская и материнская копии длинного отрезка хромосомы унаследованы от одного недавнего предка, этот отрезок гомозиготен на всём протяжении — это [[T17|участок гомозиготности]]. Его длину измеряют в [[T18|сантиморганах]] (сМ) — единицах генетического расстояния. Чем меньше группа, тем больше таких участков. В геномах людей, живших около 45 тыс. лет назад в пещерах Ранис (Германия) и Злати кунь (Чехия), доля генома в участках гомозиготности длиннее 4 сМ — 5,2 % и 7,2 %; у человека из Усть-Ишима (Сибирь) того же времени — 3,7 %. Около половины этой длины приходится на участки длиннее 12 сМ. Авторы объясняют это малой численностью группы, а не браком близких родственников: эффективная численность оценена примерно в 300 особей (95 %-й доверительный интервал 242–374) за последние ~50 поколений."],"paragraphs":["Человек из Злати кунь оказался дальним родственником (5-й или 6-й степени) двух людей из Раниса, хотя пещеры находятся примерно в 230 км друг от друга: это одна малая изолированная группа. При этом [[T19|гетерозиготность]] этих людей — около 7–8 гетерозиготных позиций на 10 000, как у других неафриканцев и вчетверо выше, чем у неандертальцев. Значит, сокращение численности было недавним и недолгим.","<b>Как это узнали.<\/b> Сравнили длину совпадающих отрезков ДНК у разных людей и у двух копий в одном геноме: чем длиннее совпадающий отрезок, тем ближе общий предок.","<b>Граница вывода.<\/b> Численность — эффективная, а не число живших людей; оценка зависит от карты рекомбинации; длительность поколения (29 лет) — допущение авторов при датировании смешения с неандертальцами, а не при оценке численности. Работа не показывает, почему у группы не найдено потомков.","<b>На практикуме.<\/b> Продвинутый уровень, вкладка 1."],"conditions":"Схема по данным работы, упрощённая · доли генома измерены; численность — оценка модели.","sources":["src_03"],"base":"БИО-13·2, БИО-13·4","level":"adv","next_base":"nonrandom-mating","quiz":{"id":"S13-L07","question":"Длинные участки гомозиготности у древнего человека говорят прежде всего о...","options":[{"id":"S13-L07-1","text":"Малой численности его группы","correct":true,"feedback":"В малой группе одни и те же предковые отрезки чаще встречаются у обоих родителей"},{"id":"S13-L07-2","text":"Отборе в пользу гомозигот","correct":false,"feedback":"Отбор действует на отдельные участки, а здесь участки рассеяны по геному"},{"id":"S13-L07-3","text":"Высокой скорости мутаций","correct":false,"feedback":"Мутации создают различия, а не одинаковые длинные отрезки"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что говорят длинные участки гомозиготности?","status":"Схема по данным работы, упрощённая · доли измерены; численность — оценка модели","modes_label":"Геном","modes":["Усть-Ишим","Ранис","Виндия","Злати кунь"],"args":[{"g":0},{"g":1},{"g":2},{"g":3}],"notes":["3,7 %","5,2 %; около половины — в участках ≥ 12 сМ","7,0 % (неандерталец)","7,2 %; около половины — в участках ≥ 12 сМ; Ne около 300 (242–374)"],"static":["Доля генома в длинных участках гомозиготности у четырёх людей того времени"],"scene":"s13_a1","L":{"a1_pA":"Доля генома в длинных участках гомозиготности (> 4 сМ)","a1_g_ui":"Усть-Ишим","a1_g_ranis":"Ранис (Ranis13)","a1_g_vindija":"Неандерталец из Виндии","a1_g_zlaty":"Злати кунь","a1_axis":"доля генома","a1_pB":"Гетерозиготность: гетерозиготных позиций на 10 000","a1_h_nea":"около 2","a1_h_nea_l":"неандертальцы","a1_h_mh":"около 7–8","a1_h_mh_l":"Ранис и Злати кунь","a1_h_note":"Измерено по геномам высокого покрытия"}}},"adv_kind":"Новые данные"},{"id":"two-assumptions","num":8,"section":0,"questions":[1],"title":"Что меняется, если снять два допущения сразу","keywords":[],"lead":["В реальной популяции нарушено сразу несколько допущений; эффекты процессов складываются."],"mechanism":["Правило модели: частоты аллелей меняются, если нарушено хотя бы одно из допущений «нет отбора», «нет миграции», «нет мутаций» (направленно) или «большая численность» (случайно); доли генотипов отклоняются от ожидания для новой частоты, если нарушено случайное скрещивание или есть отбор (в модели с приспособленностями 1; 1; 0,6); в выборке из 10 особей они ещё и случайно отклоняются — это ошибка выборки. Из пяти допущений получается 32 сочетания. Например, инбридинг вместе с миграцией (исходно p = 0,7; F = 0,25; пятая часть мигрантов с частотой 0,2): частота становится 0,6 из-за мигрантов, а гетерозигот 0,36 вместо 0,48 из-за инбридинга — меняется то и другое, но по разным причинам."],"paragraphs":["Инбридинг вместе с отбором против aa меняет и частоту (отбор), и доли (оба процесса). Мутации вместе с малой численностью: за одно поколение мутационный сдвиг (миллионные доли) несравнимо меньше случайного сдвига при 10 особях. Модель показывает, что одно наблюдение — например, «изменилось и то и другое» — совместимо с разными сочетаниями процессов.","<b>Граница вывода.<\/b> Это вывод учебной модели с условными параметрами; в природе величины процессов надо измерять.","<b>На практикуме.<\/b> Вкладка 1, конструктор: можно снять любые допущения."],"conditions":"Учебная модель · условные параметры; 32 сочетания — в эталоне модели.","sources":["src_01"],"base":"БИО-13·5","level":"adv","next_base":"nonrandom-mating","quiz":{"id":"S13-L08","question":"Сняты допущения «случайное скрещивание» и «нет миграции». Что изменится?","options":[{"id":"S13-L08-1","text":"Только доли генотипов","correct":false,"feedback":"Мигранты меняют частоту аллелей"},{"id":"S13-L08-2","text":"И частоты, и доли генотипов","correct":true,"feedback":"Частоту сдвигают мигранты, доли — инбридинг"},{"id":"S13-L08-3","text":"Только частоты аллелей","correct":false,"feedback":"Инбридинг уменьшает долю гетерозигот относительно ожидания"}]},"widget":{"kind":"dna","title":"","s":{"title":"Что меняется при двух снятых допущениях?","status":"Учебная модель · условные параметры","modes_label":"Два допущения","modes":["инбридинг + миграция","инбридинг + отбор","мутации + малая численность"],"args":[{"part":"K","removed":["random_mating","no_migration"]},{"part":"K","removed":["random_mating","no_selection"]},{"part":"K","removed":["no_mutation","large_N"]}],"notes":["Частота 0,6; гетерозигот 0,36 при ожидании 0,48","Частота 0,742 (отбор); гетерозигот 0,334 при ожидании 0,383","Частота 0,85 в показанном повторе: случайный сдвиг намного больше мутационного"],"static":["Три сочетания двух снятых допущений и их исходы"],"scene":"s13_t1","L":{"t1_ind_AA":"особь AA","t1_ind_Aa":"особь Aa","t1_ind_aa":"особь aa","t1_k_par":"Родители","t1_k_p":"p = {p}","t1_k_gam":"Гаметы","t1_k_zyg":"Зиготы","t1_k_adu":"Взрослые","t1_par_mig":"мигранты: доля 0,2, частота A 0,2","t1_par_rm":"инбридинг: F = 0,25","t1_k_bars":"Взрослые следующего поколения: доли и ожидание при новой частоте","t1_b_exp":"ожид.","t1_par_sel":"приспособленность aa: 0,6","t1_k_n10":"выборка 10 особей","t1_par_mut":"мутации A → a: 10⁻⁵","t1_par_n":"численность: N = 10"}},"zoomNarrow":true},"adv_kind":"Исследование модели"},{"id":"nonrandom-mating","num":9,"section":1,"questions":[2],"title":"Неслучайное скрещивание: инбридинг и ассортативное скрещивание","keywords":["Неслучайное скрещивание","Инбридинг","Ассортативное скрещивание"],"lead":["Случайное скрещивание в модели означает, что выбор партнёра не зависит от генотипа по рассматриваемому локусу. [[T20|Неслучайное скрещивание]] нарушает это условие."],"mechanism":["[[T21|Инбридинг]] — скрещивание особей, более родственных, чем при случайном выборе партнёра. Он повышает вероятность того, что две копии локуса у потомка происходят от общего предка, и затрагивает все локусы генома. При [[T22|ассортативном скрещивании]] особи чаще спариваются с партнёрами сходного (положительное) или отличающегося (отрицательное) фенотипа; это меняет доли генотипов только в локусах, связанных с признаком, по которому идёт выбор."],"paragraphs":["Оба вида неслучайного скрещивания перераспределяют копии аллелей между генотипами, но сами по себе не меняют частот аллелей. Их влияние на эволюцию косвенное: например, инбридинг чаще переводит редкие рецессивные аллели в гомозиготное состояние, где они проявляются и становятся доступны отбору.","<b>На практикуме.<\/b> Вкладка 2, панель «Инбридинг».","<b>Ограничения.<\/b> На странице подробно рассматривается инбридинг; ассортативное скрещивание — только как понятие."],"conditions":"Схема качественная: родословная и значки условны.","sources":["src_01"],"base":"БИО-13·5","quiz":{"id":"S13-L09","question":"Чем инбридинг отличается от ассортативного скрещивания по признаку роста?","options":[{"id":"S13-L09-1","text":"Ассортативное скрещивание меняет частоты аллелей","correct":false,"feedback":"Ни то, ни другое само по себе частот не меняет"},{"id":"S13-L09-2","text":"Ничем: это одно и то же","correct":false,"feedback":"Инбридинг — выбор по родству, ассортативное — по фенотипу"},{"id":"S13-L09-3","text":"Инбридинг затрагивает все локусы","correct":true,"feedback":"Родство повышает гомозиготность по всему геному, а выбор по росту — в локусах роста"}]},"widget":{"kind":"dna","title":"","s":{"title":"Чем инбридинг отличается от ассортативного скрещивания?","status":"Схема качественная · родословная условна","modes_label":"Скрещивание","modes":["случайное","инбридинг","ассортативное"],"args":[{"m":"random"},{"m":"inbred"},{"m":"assort"}],"notes":["Партнёр не зависит от генотипа","Родственники; гомозиготность растёт во всех локусах","Сходный фенотип; меняются доли в локусах признака"],"static":["Три вида скрещивания и какие локусы они затрагивают"],"scene":"s13_r_mating","L":{"r_mat_rand":"партнёр не зависит от генотипа","r_mat_anc":"общий предок","r_mat_ped":"родословная","r_mat_all":"все локусы","r_mat_sim":"партнёры сходного фенотипа","r_mat_trait":"локусы признака"}}}},{"id":"inbreeding","num":10,"section":1,"questions":[2],"title":"Инбридинг повышает гомозиготность, не меняя частот аллелей","keywords":["Коэффициент инбридинга (F)"],"lead":["Степень инбридинга задают [[T23|коэффициентом инбридинга]] F — вероятностью того, что две копии локуса у особи происходят от одной копии общего предка."],"mechanism":["Доля гетерозигот умножается на (1 − F), а освободившаяся доля делится между гомозиготами пропорционально частотам аллелей. Частота аллеля A при этом остаётся p. Пример: p = 0,7, F = 0,25 → AA 0,5425; Aa 0,315; aa 0,1425 (вместо 0,49; 0,42; 0,09); частота A — по-прежнему 0,7."],"paragraphs":["Доля рецессивных гомозигот при F = 0,25 выросла в 1,6 раза. Поэтому инбридинг повышает долю особей с редкими рецессивными признаками и может снижать среднюю приспособленность потомства — инбредная депрессия.",{"details":"Формула и расчёт","text":"При инбридинге доли генотипов: AA — p²(1 − F) + pF; Aa — 2pq(1 − F); aa — q²(1 − F) + qF. Для редкого аллеля рост относительно больше: при q = 0,01 и F = 0,0625 доля aa — 0,0001 × 0,9375 + 0,01 × 0,0625 ≈ 0,00072, то есть в 7 раз выше, чем при случайном скрещивании (расчёт по формуле)."},"<b>На практикуме.<\/b> Вкладка 2, шаг 2.3.","<b>Ограничения.<\/b> Значения F на практикуме условные."],"conditions":"Расчёт по модели инбридинга; F условный.","sources":["src_01"],"base":"БИО-13·9","quiz":{"id":"S13-L10","question":"При F = 1 (полный инбридинг) какая доля гетерозигот?","options":[{"id":"S13-L10-1","text":"0","correct":true,"feedback":"2pq × (1 − 1) = 0; все особи гомозиготны"},{"id":"S13-L10-2","text":"2pq, как обычно","correct":false,"feedback":"Каждая единица F уменьшает долю гетерозигот"},{"id":"S13-L10-3","text":"0,5 при любой частоте","correct":false,"feedback":"Доля гетерозигот зависит от F и частоты; при F = 1 она равна нулю"}]},"widget":{"kind":"dna","title":"","s":{"title":"Как F меняет доли генотипов?","status":"Расчёт по модели инбридинга · F условный","modes_label":"Инбридинг F","modes":["F = 0","F = 0,1","F = 0,25","F = 0,5"],"args":[{"part":"I","fi":0},{"part":"I","fi":1},{"part":"I","fi":2},{"part":"I","fi":3}],"notes":["0,49 / 0,42 / 0,09","0,511 / 0,378 / 0,111","0,5425 / 0,315 / 0,1425","0,595 / 0,21 / 0,195; частота A всё время 0,7"],"static":["Доли генотипов при растущем F; частота аллеля не меняется"],"scene":"s13_t2","L":{"t1_ind_AA":"особь AA","t1_ind_Aa":"особь Aa","t1_ind_aa":"особь aa","t2_i_title":"Одна популяция: p = 0,7; инбридинг F = {F}","t1_f_inds":"Особи","t2_i_F":"F = {F}","t2_i_note":"поле — условная выборка; доли — по модели","t2_ib_title":"Доли при инбридинге и ожидание при случайном скрещивании","t1_b_exp":"ожид.","t1_b_def":"дефицит"}}},"exam_quiz":{"id":"S13-E08","question":"Как инбредная депрессия связана с рецессивными аллелями?","options":[{"id":"S13-E08-1","text":"Инбридинг создаёт новые вредные мутации","correct":false,"feedback":"Инбридинг не меняет скорости мутаций"},{"id":"S13-E08-2","text":"Инбридинг чаще делает их гомозиготными","correct":true,"feedback":"Вредный рецессивный признак проявляется у гомозигот"},{"id":"S13-E08-3","text":"Инбридинг повышает частоту рецессивных аллелей","correct":false,"feedback":"Частоты не меняются; меняются доли генотипов"}]}},{"id":"wahlund","num":11,"section":1,"questions":[2],"title":"Объединение групп: эффект Валунда","keywords":["Популяционная структура","Дефицит гетерозигот","Эффект Валунда","F_ST"],"lead":["Дефицит гетерозигот возникает и без инбридинга — если в одну выборку объединены группы с разными частотами аллелей."],"mechanism":["[[T24|Популяционная структура]] — неоднородность частот аллелей между группами особей внутри популяции. Пусть две равные группы в равновесии: в первой p = 0,9, во второй p = 0,3. Гетерозигот в них 0,18 и 0,42, в объединённой выборке в среднем 0,30. Общая частота p̄ = 0,6, и модель ждёт 2 × 0,6 × 0,4 = 0,48. Разность 0,18 — [[T25|дефицит гетерозигот]] — равна удвоенной дисперсии частот между группами (2 × 0,09). Это [[T26|эффект Валунда]]: дефицит гетерозигот относительно ожидания по общей частоте при объединении групп с разными частотами, даже если каждая группа в равновесии."],"paragraphs":["Чем сильнее различаются частоты групп, тем больше дефицит: 0,7 и 0,5 → 0,02; 0,8 и 0,4 → 0,08; 0,9 и 0,3 → 0,18; при одинаковых частотах дефицита нет. Структура важна для медицинской генетики: если смешать в одном исследовании группы с разными частотами вариантов и разной частотой признака, вариант может оказаться статистически связан с признаком из-за происхождения участников, а не из-за своего действия.",{"details":"Формула и расчёт","text":"Меру различия частот между группами выражают через гетерозиготность: [[T27|F_ST]] = (H_T − H_S) / H_T, где H_T — ожидаемая доля гетерозигот при общей частоте, H_S — средняя доля внутри групп; в примере F_ST = (0,48 − 0,30)/0,48 = 0,375."},"<b>На практикуме.<\/b> Вкладка 2, шаги 2.1, 2.2, 2.4.","<b>Ограничения.<\/b> Группы в модели равные и не обмениваются особями."],"conditions":"Расчёт по модели; частоты групп условные.","sources":["src_01"],"base":"БИО-13·4, БИО-13·10","quiz":{"id":"S13-L11","question":"Две равные группы в равновесии: p = 0,6 и p = 0,6. Каков дефицит гетерозигот при объединении?","options":[{"id":"S13-L11-1","text":"0,18","correct":false,"feedback":"0,18 — при частотах 0,9 и 0,3"},{"id":"S13-L11-2","text":"Нуль","correct":true,"feedback":"Дефицит возникает только из различия частот"},{"id":"S13-L11-3","text":"0,48","correct":false,"feedback":"0,48 — сама ожидаемая доля гетерозигот"}]},"widget":{"kind":"dna","title":"","s":{"title":"Почему объединение групп даёт дефицит гетерозигот?","status":"Расчёт по модели · частоты групп условные","modes_label":"Частоты групп","modes":["0,6 и 0,6","0,7 и 0,5","0,8 и 0,4","0,9 и 0,3"],"args":[{"part":"G","d":0,"f":0,"merged":true},{"part":"G","d":1,"f":0,"merged":true},{"part":"G","d":2,"f":0,"merged":true},{"part":"G","d":3,"f":0,"merged":true}],"notes":["0,48 и 0,48; дефицит 0","0,46 и 0,48; дефицит 0,02","0,40 и 0,48; дефицит 0,08","0,30 и 0,48; дефицит 0,18 = 2 × 0,09"],"static":["Дефицит гетерозигот растёт с различием частот групп"],"scene":"s13_t2","L":{"t1_ind_AA":"особь AA","t1_ind_Aa":"особь Aa","t1_ind_aa":"особь aa","t2_g_merged":"Объединённая выборка: 200 особей, общая частота A = {pb}","t2_r_p1":"p₁ = {p}","t2_r_p2":"p₂ = {p}","t2_r_pb":"p̄ = {p}","t2_r_F":"F = {F}","t2_b_merged":"Объединённая выборка: доли и ожидание при общей частоте","t1_b_exp":"ожид.","t1_b_def":"дефицит"}}}},{"id":"deficit-causes","num":12,"section":1,"questions":[2],"title":"Почему дефицит гетерозигот не называет причину","keywords":[],"lead":["Один и тот же наблюдаемый результат — дефицит гетерозигот — дают разные процессы. Чтобы назвать причину, нужны дополнительные данные."],"mechanism":["Инбридинг даёт дефицит по всем локусам и связан с родством родителей. Скрытая структура даёт дефицит по локусам, частоты которых различаются между группами, и исчезает, если считать группы отдельно. Отбор против гетерозигот даёт дефицит в одном локусе и у взрослых, но не у новорождённых. Ошибки определения генотипов (например, когда второй аллель гетерозиготы не выявлен) дают дефицит, который исчезает при повторном генотипировании. Поэтому различают причины по происхождению образцов, родству, возрасту особей, числу затронутых локусов и качеству генотипирования."],"paragraphs":["Это общий принцип раздела: наблюдение (отклонение от нулевой модели) отделяют от его объяснения. Отклонение от модели само по себе не доказывает ни инбридинг, ни отбор. Пример из исследований древней ДНК: из 38 участков генома, где прежние работы видели отбор, 20 не подтвердились при более тщательном учёте происхождения людей — в большинстве случаев, по оценке авторов, сигнал создавало смешение групп с разными частотами.","<b>На практикуме.<\/b> Вкладка 2, «Найти причину».","<b>Ограничения.<\/b> Таблица причин учебная: в реальной выборке процессы действуют одновременно."],"conditions":"Схема качественная: сравнение ожидаемых данных при четырёх причинах.","sources":["src_01","src_09"],"base":"БИО-13·10, БИО-13·11","quiz":{"id":"S13-L12","question":"Дефицит гетерозигот исчез, когда выборку разделили по поселениям. Какая причина вероятнее?","options":[{"id":"S13-L12-1","text":"Инбридинг","correct":false,"feedback":"Дефицит от инбридинга остался бы и внутри поселений"},{"id":"S13-L12-2","text":"Отбор против гетерозигот","correct":false,"feedback":"Отбор действовал бы внутри каждого поселения"},{"id":"S13-L12-3","text":"Скрытая структура","correct":true,"feedback":"Внутри поселений равновесие, дефицит был свойством объединённой выборки"}]},"widget":{"kind":"dna","title":"","s":{"title":"Какие данные различают причины дефицита?","status":"Схема качественная · сравнение ожидаемых данных","modes_label":"Причина","modes":["инбридинг","скрытая структура","отбор против Aa","ошибка генотипирования"],"args":[{"cause":"inbred"},{"cause":"struct"},{"cause":"sel"},{"cause":"error"}],"notes":["Дефицит во всех локусах; родители — родственники","Дефицит исчезает внутри групп","Новорождённые в равновесии, дефицит у взрослых, один локус","Дефицит исчезает при повторном определении"],"static":["Четыре причины дефицита гетерозигот и данные, которые их различают"],"scene":"s13_r_causes","L":{"r_cau_def":"Дефицит Aa: что покажут данные при причине","c2_c1":"Близкородственное скрещивание","c2_m1":"Происхождение образцов (из каких поселений)","c2_v_m1_same":"частоты по месту не различаются","c2_m2":"Родство родителей","c2_r2_1":"чаще родственники","c2_m3":"Доли генотипов у новорождённых и у взрослых","c2_v_m3_born":"дефицит уже у новорождённых","c2_m5":"Повторное определение генотипов в другой лаборатории","c2_v_m5_conf":"дефицит подтверждается","c2_m4":"Другие локусы","c2_r4_1":"дефицит по всем локусам","c2_c2":"Скрытая структура (выборка из двух групп)","c2_r1_2":"два поселения с частотами 0,92 и 0,48","c2_v_m2_no":"не чаще, чем при случайном выборе","c2_r4_2":"дефицит по локусам, частоты которых различаются между группами","c2_c3":"Отбор против гетерозигот","c2_r3_3":"у новорождённых — равновесие, дефицит у взрослых","c2_r4_3":"дефицит только в этом локусе","c2_c
