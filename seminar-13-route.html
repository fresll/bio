<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-13.html">← К практикуму</a> · <a href="section-3.html">Раздел III</a> · <a href="index.html">Все разделы</a></p><h1>Популяционная генетика и механизмы эволюции</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-population"><div class="eyebrow">Частоты и нулевая модель · шаг 1 из 34</div><h2>Что изучает популяционная генетика: особь не эволюционирует, меняется популяция</h2><p class="lead">Генотип особи в течение жизни не меняется. Эволюцию на уровне <a href="#ns-g-S13-T01">популяции</a> описывают как изменение частот наследуемых вариантов от поколения к поколению.</p><div class="note"><strong>Что показывает схема.</strong> Генотип особи постоянен; частота A в популяции меняется от поколения к поколению; оценка частоты — по выборке</div><p>Для вида с половым размножением популяция — совокупность особей, которые потенциально скрещиваются между собой, так что гены следующего поколения происходят из общего набора их гамет. Реальные популяции часто состоят из локальных групп, между которыми обмен особями ограничен. У бактерий, вирусов и клонов клеток популяцию выделяют по происхождению, среде и путям передачи. Поэтому границы популяции зависят и от биологии объекта, и от поставленного вопроса. О составе популяции судят по <a href="#ns-g-S13-T02">выборке</a> — обследованной части особей.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-12-route.html#selection">семинар 12: «Условия естественного отбора»</a></p><p>Оценка по выборке зависит от числа обследованных, способа их набора и точности определения генотипов. Две выборки из одной популяции дают немного разные частоты — это ошибка выборки, тот же случайный эффект, который в ряду поколений создаёт генетический дрейф (шаг <a href="#ns-drift">«Генетический дрейф: случайная выборка копий»</a>).</p><p>Статусы утверждений — прежние: наблюдение и реконструкция; «показанной возможности» здесь соответствует расчёт по модели, а вывод, который пока не сопоставлен с данными, назван гипотезой (<a href="seminar-12-route.html#four-statuses">семинар 12: «Наблюдение, возможность, реконструкция и выводы, которые не следуют из данных»</a>).</p><p><b>На практикуме.</b> Вкладка 1: поле из 200 условных особей — выборка, по которой считают частоты.</p><p><b>Ограничения.</b> В природе граница популяции часто проводится косвенно — по расселению, родству и распределению вариантов.</p><div class="static-quiz"><h3>Что меняется в ряду поколений при эволюции популяции?</h3><ol><li><b>А.</b> Частоты наследуемых вариантов <i>(верный вариант)</i><br><span class="expl">Генотип каждой особи постоянен, а доли вариантов в популяции меняются</span></li><li><b>Б.</b> Генотип каждой особи <i>(неверный вариант)</i><br><span class="expl">Генотип особи задан при оплодотворении и в течение жизни не меняется</span></li><li><b>В.</b> Только общая численность популяции <i>(неверный вариант)</i><br><span class="expl">Численность может не меняться, а частоты вариантов — меняться</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: числа особей условные.</p></details></article><article class="card print-unit" id="ns-locus-allele"><div class="eyebrow">Частоты и нулевая модель · шаг 2 из 34</div><h2>Локус, аллель, генотип, гаплотип: что именно считают</h2><p class="lead">Чтобы считать частоты, надо договориться, что считают: положение в геноме, его вариант, сочетание вариантов у особи или на одной хромосоме.</p><div class="note"><strong>Что показывает схема.</strong> Локус, аллели A и a, три генотипа, два гаплотипа, гамета с одной копией</div><p><a href="#ns-g-S13-T03">Локус</a> — рассматриваемое положение в геноме. <a href="#ns-g-S13-T04">Аллель</a> — один из вариантов последовательности в этом локусе. <a href="#ns-g-S13-T05">Генотип</a> — сочетание аллелей локуса у особи: у диплоидной особи две копии аутосомного локуса, одна от отца и одна от матери. Особь с двумя одинаковыми аллелями — <a href="#ns-g-S13-T06">гомозигота</a> (AA или aa), с разными — <a href="#ns-g-S13-T07">гетерозигота</a> (Aa). <a href="#ns-g-S13-T08">Гаплотип</a> — сочетание аллелей нескольких локусов на одной хромосоме; оно наследуется вместе, пока его не изменит рекомбинация.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-population">«Что изучает популяционная генетика: особь не эволюционирует, меняется популяция»</a>; вспомнить <a href="seminar-6-route.html#meiosis-one">семинар 6: «Мейоз I: расходятся гомологи, а не хроматиды»</a></p><p>В мейозе гомологичные хромосомы расходятся в разные клетки, поэтому <a href="#ns-g-S13-T64">гамета</a> несёт одну копию каждого аутосомного локуса, а диплоидная особь передаёт потомку одну из двух своих копий. Отсюда счёт: в популяции из N диплоидных особей 2N копий аутосомного локуса.</p><p><b>На практикуме.</b> Вкладка 1: цвет значка — генотип; синяя половина — копия A, оранжевая — копия a.</p><p><b>Ограничения.</b> Здесь рассматриваются аутосомные локусы с двумя аллелями; у локусов X-хромосомы и митохондриальной ДНК счёт копий другой.</p><div class="static-quiz"><h3>Сколько копий аутосомного локуса в популяции из 50 диплоидных особей?</h3><ol><li><b>А.</b> 50 <i>(неверный вариант)</i><br><span class="expl">У диплоидной особи две копии каждого аутосомного локуса</span></li><li><b>Б.</b> 100 <i>(верный вариант)</i><br><span class="expl">По две копии у каждой особи</span></li><li><b>В.</b> 200 <i>(неверный вариант)</i><br><span class="expl">200 копий было бы у 100 особей или у тетраплоидов</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: хромосомы и значки условны.</p></details></article><article class="card print-unit" id="ns-counting"><div class="eyebrow">Частоты и нулевая модель · шаг 3 из 34</div><h2>Как считать частоты аллелей и генотипов</h2><p class="lead"><a href="#ns-g-S13-T09">Частота аллеля</a> — доля его копий среди всех копий локуса. <a href="#ns-g-S13-T10">Частота генотипа</a> — доля особей с этим генотипом.</p><div class="note"><strong>Что показывает схема.</strong> Две выборки с одинаковой частотой A 0,7 и разными долями генотипов</div><p>Пусть в выборке N_AA особей AA, N_Aa особей Aa и N_aa особей aa; N — их сумма, копий локуса — 2N. Особь AA несёт две копии A, Aa — одну. Поэтому частота аллеля A: p = (2 × N_AA + N_Aa) / 2N; частота аллеля a: q = (2 × N_aa + N_Aa) / 2N; p + q = 1. Пример: 98 AA, 84 Aa, 18 aa из 200 особей. Копий A — 2 × 98 + 84 = 280 из 400, p = 0,70; q = 0,30. Частоты генотипов: 0,49; 0,42; 0,09.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-locus-allele">«Локус, аллель, генотип, гаплотип: что именно считают»</a></p><p>Частоту аллеля нельзя путать ни с долей гомозигот (здесь 0,49), ни с долей особей, несущих хотя бы одну копию A (0,91). По частотам генотипов частоты аллелей находят всегда; обратный путь — от частот аллелей к генотипам — требует модели (шаг <a href="#ns-hw-null">«Модель Харди–Вайнберга: ожидаемые доли генотипов»</a>). Две выборки могут иметь одинаковые частоты аллелей и разные частоты генотипов: 98/84/18 и 108/64/28 — обе с p = 0,70, но гетерозигот 0,42 и 0,32.</p><p><b>На практикуме.</b> Вкладка 1, шаги 1.1 и 1.2.</p><p><b>Ограничения.</b> Это частоты в выборке: оценка частоты в популяции тем точнее, чем больше обследовано.</p><div class="static-quiz"><h3>В выборке 40 особей: 10 AA, 20 Aa, 10 aa. Какова частота A?</h3><ol><li><b>А.</b> 0,25 <i>(неверный вариант)</i><br><span class="expl">0,25 — доля особей AA, а не доля копий A</span></li><li><b>Б.</b> 0,75 <i>(неверный вариант)</i><br><span class="expl">0,75 — доля особей с хотя бы одной копией A</span></li><li><b>В.</b> 0,5 <i>(верный вариант)</i><br><span class="expl">(2 × 10 + 20) / 80 = 0,5</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по формуле; числа особей условные.</p></details></article><article class="card print-unit" id="ns-hw-null"><div class="eyebrow">Частоты и нулевая модель · шаг 4 из 34</div><h2>Модель Харди–Вайнберга: ожидаемые доли генотипов</h2><p class="lead"><a href="#ns-g-S13-T11">Модель Харди–Вайнберга</a> связывает частоты аллелей с ожидаемыми долями генотипов. Её применяют как <a href="#ns-g-S13-T12">нулевую модель</a> — состояние, с которым сравнивают реальную популяцию.</p><div class="note"><strong>Что показывает схема.</strong> Три кривые p², 2pq, q² от частоты A; вертикаль — выбранная p</div><p>Если гаметы объединяются случайно (<a href="#ns-g-S13-T13">случайное скрещивание</a>), вероятность того, что <a href="#ns-g-S13-T65">зигота</a> окажется AA, — p × p, aa — q × q, а Aa — 2pq (яйцеклетка A со сперматозоидом a или наоборот). Ожидаемые доли: p² (AA), 2pq (Aa), q² (aa); p² + 2pq + q² = 1. Модель даёт два вывода: при выполнении её допущений частоты аллелей не меняются из поколения в поколение, а доли генотипов равны p², 2pq и q². Популяцию, где это выполняется для данного локуса, называют находящейся в равновесии Харди–Вайнберга.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-counting">«Как считать частоты аллелей и генотипов»</a></p><p>Для p = 0,7 ожидаются 0,49 / 0,42 / 0,09: выборка 98/84/18 им точно соответствует, а выборка 108/64/28 — нет (гетерозигот 0,32 вместо 0,42). Доля гетерозигот 2pq наибольшая (0,5) при p = 0,5. Равновесие Харди–Вайнберга относится к одному локусу и определённому набору условий: популяция может соответствовать модели по одному локусу и одновременно изменяться по другим.</p><p><b>На практикуме.</b> Вкладка 1: контуры столбиков — ожидание модели, залитые столбики — наблюдение.</p><p><b>Ограничения.</b> Модель описывает один аутосомный локус и неперекрывающиеся поколения.</p><div class="static-quiz"><h3>Частота A — 0,8. Какую долю гетерозигот ожидает модель?</h3><ol><li><b>А.</b> 0,32 <i>(верный вариант)</i><br><span class="expl">2 × 0,8 × 0,2</span></li><li><b>Б.</b> 0,16 <i>(неверный вариант)</i><br><span class="expl">0,16 — это pq; гетерозигота возникает двумя путями, поэтому 2pq</span></li><li><b>В.</b> 0,64 <i>(неверный вариант)</i><br><span class="expl">0,64 — ожидаемая доля AA (p²)</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели; столбики — доли, а не измеренные данные.</p></details></article><article class="card print-unit" id="ns-hw-assumptions"><div class="eyebrow">Частоты и нулевая модель · шаг 5 из 34</div><h2>Пять допущений нулевой модели и что даёт нарушение каждого</h2><p class="lead">Модель перечисляет условия, при которых популяция не эволюционирует. Тем самым она перечисляет и процессы, которые могут менять частоты.</p><div class="note"><strong>Что показывает схема.</strong> Этапы поколения и что меняет снятие каждого допущения</div><p>Допущения: 1) нет отбора — все генотипы выживают и размножаются одинаково; 2) нет мутаций; 3) нет миграции; 4) численность бесконечно велика — случайные отклонения не меняют частот; 5) скрещивание случайное. Нарушение первых четырёх меняет частоты аллелей: отбор, мутации и миграция — направленно, конечная численность — случайно (<a href="#ns-g-S13-T14">генетический дрейф</a>). Нарушение пятого допущения частот аллелей не меняет, но меняет доли генотипов. Отбор, действующий между образованием зиготы и размножением, меняет частоты аллелей; в показанной модели (1; 1; 0,6) у взрослых доли генотипов ещё и отклоняются от ожидания для новой частоты. При некоторых соотношениях приспособленностей такого отклонения нет, поэтому равновесие у взрослых не исключает отбора.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-hw-null">«Модель Харди–Вайнберга: ожидаемые доли генотипов»</a></p><p>Пример по модели (исходно p = 0,7): инбридинг F = 0,25 — частота 0,7, гетерозигот 0,315 вместо 0,42; мигранты (пятая часть, частота у них 0,2) — частота 0,6; мутации A → a с частотой 10⁻⁵ — частота 0,699993; отбор против aa (приспособленность 0,6) — частота 0,726 и доля aa у взрослых 0,056 при ожидании 0,075. Мутации сами по себе меняют частоты медленно: они создают варианты, а заметный сдвиг частот за немногие поколения дают другие процессы.</p><p><b>На практикуме.</b> Вкладка 1, шаги 1.3–1.6 — конструктор допущений.</p><p><b>Ограничения.</b> Параметры условные; модель показывает одно поколение.</p><div class="static-quiz"><h3>Нарушение какого допущения само по себе не меняет частоты аллелей?</h3><ol><li><b>А.</b> Отсутствия миграции между популяциями <i>(неверный вариант)</i><br><span class="expl">Мигранты приносят свои копии и сдвигают частоту</span></li><li><b>Б.</b> Случайного скрещивания <i>(верный вариант)</i><br><span class="expl">Выбор партнёра перераспределяет копии между генотипами, не меняя их числа</span></li><li><b>В.</b> Большой численности <i>(неверный вариант)</i><br><span class="expl">В конечной популяции частоты меняются случайно — это дрейф</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · условные параметры; результат переключателя — предсказание модели.</p></details></article><article class="card print-unit" id="ns-hw-use"><div class="eyebrow">Частоты и нулевая модель · шаг 6 из 34</div><h2>Как применяют нулевую модель: частота носителей и отклонения от равновесия</h2><p class="lead">Нулевая модель позволяет оценить то, что трудно измерить прямо, и обнаружить отклонение, требующее объяснения.</p><div class="note"><strong>Что показывает схема.</strong> От доли больных к доле носителей и допущения расчёта</div><p>Пример расчёта. Аутосомно-рецессивное заболевание встречается у 1 из 4900 новорождённых. В простейшей модели доля больных q² = 1/4900, отсюда q = 1/70 ≈ 0,014, p ≈ 0,986 и доля гетерозиготных <a href="#ns-g-S13-T15">носителей</a> 2pq ≈ 0,028 — примерно 1 из 35. Почти все копии редкого рецессивного аллеля находятся у носителей, а не у больных. Расчёт верен только при допущениях: случайное скрещивание, отсутствие популяционной структуры, все патогенные варианты гена учтены как один аллель, заболевание проявляется у каждой особи aa (<a href="#ns-g-S13-T16">пенетрантность</a> полная) и диагноз точен.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-hw-null">«Модель Харди–Вайнберга: ожидаемые доли генотипов»</a>, шаг <a href="#ns-hw-assumptions">«Пять допущений нулевой модели и что даёт нарушение каждого»</a></p><p>Второе применение — проверка выборки. Если наблюдаемые доли генотипов значимо отличаются от p², 2pq и q², нарушено хотя бы одно допущение, но какое — модель не говорит. Дефицит гетерозигот дают инбридинг, скрытая структура, отбор против гетерозигот и ошибки определения генотипов (шаг <a href="#ns-deficit-causes">«Почему дефицит гетерозигот не называет причину»</a>). Поэтому проверка равновесия — начало анализа, а не вывод.</p><p><b>На практикуме.</b> Вкладка 1, шаг 1.7.</p><p><b>Ограничения.</b> Клинический пример приводится для демонстрации значения эволюционного механизма. При нескольких разных патогенных вариантах, неполной пенетрантности, структуре популяции или эффекте основателя реальная доля носителей отличается от расчёта.</p><div class="static-quiz"><h3>Почему отклонение выборки от равновесия не доказывает действия отбора?</h3><ol><li><b>А.</b> Отбор не меняет долей генотипов <i>(неверный вариант)</i><br><span class="expl">Меняет: отбор по выживанию сдвигает доли у взрослых</span></li><li><b>Б.</b> Модель не применима к людям <i>(неверный вариант)</i><br><span class="expl">Применима как нулевая модель; вопрос в том, что означает отклонение</span></li><li><b>В.</b> Такое отклонение дают и другие причины <i>(верный вариант)</i><br><span class="expl">Инбридинг, структура, ошибки генотипирования</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели при перечисленных допущениях; доля больных условная.</p></details></article><article class="card print-unit" id="ns-ranis-roh"><div class="eyebrow">Частоты и нулевая модель · шаг 7 из 34</div><h2>Малая группа одних из самых ранних людей современного типа в Европе</h2><p class="lead">Генотип одного человека хранит след численности его предков: в малой группе у родителей чаще общие недавние предки.</p><div class="note"><strong>Что показывает схема.</strong> Доля генома в длинных участках гомозиготности у четырёх людей того времени</div><p>Если отцовская и материнская копии длинного отрезка хромосомы унаследованы от одного недавнего предка, этот отрезок гомозиготен на всём протяжении — это <a href="#ns-g-S13-T17">участок гомозиготности</a>. Его длину измеряют в <a href="#ns-g-S13-T18">сантиморганах</a> (сМ) — единицах генетического расстояния. Чем меньше группа, тем больше таких участков. В геномах людей, живших около 45 тыс. лет назад в пещерах Ранис (Германия) и Злати кунь (Чехия), доля генома в участках гомозиготности длиннее 4 сМ — 5,2 % и 7,2 %; у человека из Усть-Ишима (Сибирь) того же времени — 3,7 %. Около половины этой длины приходится на участки длиннее 12 сМ. Авторы объясняют это малой численностью группы, а не браком близких родственников: эффективная численность оценена примерно в 300 особей (95 %-й доверительный интервал 242–374) за последние ~50 поколений.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-locus-allele">«Локус, аллель, генотип, гаплотип: что именно считают»</a>, шаг <a href="#ns-hw-null">«Модель Харди–Вайнберга: ожидаемые доли генотипов»</a></p><p>Человек из Злати кунь оказался дальним родственником (5-й или 6-й степени) двух людей из Раниса, хотя пещеры находятся примерно в 230 км друг от друга: это одна малая изолированная группа. При этом <a href="#ns-g-S13-T19">гетерозиготность</a> этих людей — около 7–8 гетерозиготных позиций на 10 000, как у других неафриканцев и вчетверо выше, чем у неандертальцев. Значит, сокращение численности было недавним и недолгим.</p><p><b>Как это узнали.</b> Сравнили длину совпадающих отрезков ДНК у разных людей и у двух копий в одном геноме: чем длиннее совпадающий отрезок, тем ближе общий предок.</p><p><b>Граница вывода.</b> Численность — эффективная, а не число живших людей; оценка зависит от карты рекомбинации; длительность поколения (29 лет) — допущение авторов при датировании смешения с неандертальцами, а не при оценке численности. Работа не показывает, почему у группы не найдено потомков.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 1.</p><div class="static-quiz"><h3>Длинные участки гомозиготности у древнего человека говорят прежде всего о...</h3><ol><li><b>А.</b> Малой численности его группы <i>(верный вариант)</i><br><span class="expl">В малой группе одни и те же предковые отрезки чаще встречаются у обоих родителей</span></li><li><b>Б.</b> Отборе в пользу гомозигот <i>(неверный вариант)</i><br><span class="expl">Отбор действует на отдельные участки, а здесь участки рассеяны по геному</span></li><li><b>В.</b> Высокой скорости мутаций <i>(неверный вариант)</i><br><span class="expl">Мутации создают различия, а не одинаковые длинные отрезки</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41586-024-08420-x">Sümer A.P. et al. Earliest modern human genomes constrain timing of Neanderthal admixture. Nature 2025; 638: 711–717</a></li></ul><p>Схема по данным работы, упрощённая · доли генома измерены; численность — оценка модели.</p></details></article><article class="card print-unit" id="ns-two-assumptions"><div class="eyebrow">Частоты и нулевая модель · шаг 8 из 34</div><h2>Что меняется, если снять два допущения сразу</h2><p class="lead">В реальной популяции нарушено сразу несколько допущений; эффекты процессов складываются.</p><div class="note"><strong>Что показывает схема.</strong> Три сочетания двух снятых допущений и их исходы</div><p>Правило модели: частоты аллелей меняются, если нарушено хотя бы одно из допущений «нет отбора», «нет миграции», «нет мутаций» (направленно) или «большая численность» (случайно); доли генотипов отклоняются от ожидания для новой частоты, если нарушено случайное скрещивание или есть отбор (в модели с приспособленностями 1; 1; 0,6); в выборке из 10 особей они ещё и случайно отклоняются — это ошибка выборки. Из пяти допущений получается 32 сочетания. Например, инбридинг вместе с миграцией (исходно p = 0,7; F = 0,25; пятая часть мигрантов с частотой 0,2): частота становится 0,6 из-за мигрантов, а гетерозигот 0,36 вместо 0,48 из-за инбридинга — меняется то и другое, но по разным причинам.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-hw-assumptions">«Пять допущений нулевой модели и что даёт нарушение каждого»</a></p><p>Инбридинг вместе с отбором против aa меняет и частоту (отбор), и доли (оба процесса). Мутации вместе с малой численностью: за одно поколение мутационный сдвиг (миллионные доли) несравнимо меньше случайного сдвига при 10 особях. Модель показывает, что одно наблюдение — например, «изменилось и то и другое» — совместимо с разными сочетаниями процессов.</p><p><b>Граница вывода.</b> Это вывод учебной модели с условными параметрами; в природе величины процессов надо измерять.</p><p><b>На практикуме.</b> Вкладка 1, конструктор: можно снять любые допущения.</p><div class="static-quiz"><h3>Сняты допущения «случайное скрещивание» и «нет миграции». Что изменится?</h3><ol><li><b>А.</b> Только доли генотипов <i>(неверный вариант)</i><br><span class="expl">Мигранты меняют частоту аллелей</span></li><li><b>Б.</b> И частоты, и доли генотипов <i>(верный вариант)</i><br><span class="expl">Частоту сдвигают мигранты, доли — инбридинг</span></li><li><b>В.</b> Только частоты аллелей <i>(неверный вариант)</i><br><span class="expl">Инбридинг уменьшает долю гетерозигот относительно ожидания</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-13.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · условные параметры; 32 сочетания — в эталоне модели.</p></details></article><article class="card print-unit" id="ns-nonrandom-mating"><div class="eyebrow">Структура популяции · шаг 9 из 34</div><h2>Неслучайное скрещивание: инбридинг и ассортативное скрещивание</h2><p class="lead">Случайное скрещивание в модели означает, что выбор партнёра не зависит от генотипа по рассматриваемому локусу. <a href="#ns-g-S13-T20">Неслучайное скрещивание</a> нарушает это условие.</p><div class="note"><strong>Что показывает схема.</strong> Три вида скрещивания и какие локусы они затрагивают</div><p><a href="#ns-g-S13-T21">Инбридинг</a> — скрещивание особей, более родственных, чем при случайном выборе партнёра. Он повышает вероятность того, что две копии локуса у потомка происходят от общего предка, и затрагивает все локусы генома. При <a href="#ns-g-S13-T22">ассортативном скрещивании</a> особи чаще спариваются с партнёрами сходного (положительное) или отличающегося (отрицательное) фенотипа; это меняет доли генотипов только в локусах, связанных с признаком, по которому идёт выбор.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-hw-assumptions">«Пять допущений нулевой модели и что даёт нарушение каждого»</a></p><p>Оба вида неслучайного скрещивания перераспределяют копии аллелей между генотипами, но сами по себе не меняют частот аллелей. Их влияние на эволюцию косвенное: например, инбридинг чаще переводит редкие рецессивные аллели в гомозиготное состояние, где они проявляются и становятся доступны отбору.</p><p><b>На практикуме.</b> Вкладка 2, панель «Инбридинг».</p><p><b>Ограничения.</b> На странице подробно рассматривается инбридинг; ассортативное скрещивание — только как понятие.</p><div class="static-quiz"><h3>Чем инбридинг отличается от ассортативного скрещивания по признаку роста?</h3><ol><li><b>А.</b> Ассортативное скрещивание меняет частоты аллелей <i>(неверный вариант)</i><br><span class="expl">Ни то, ни другое само по себе частот не меняет</span></li><li><b>Б.</b> Ничем: это одно и то же <i>(неверный вариант)</i><br><span class="expl">Инбридинг — выбор по родству, ассортативное — по фенотипу</span></li><li><b>В.</b> Инбридинг затрагивает все локусы <i>(верный вариант)</i><br><span class="expl">Родство повышает гомозиготность по всему геному, а выбор по росту — в локусах роста</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-13.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: родословная и значки условны.</p></details></article><article class="card print-unit" id="ns-inbreeding"><div class="eyebrow">Структура популяции · шаг 10 из 34</div><h2>Инбридинг повышает гомозиготность, не меняя частот аллелей</h2><p class="lead">Степень инбридинга задают <a href="#ns-g-S13-T23">коэффициентом инбридинга</a> F — вероятностью того, что две копии локуса у особи происходят от одной копии общего предка.</p><div class="note"><strong>Что показывает схема.</strong> Доли генотипов при растущем F; частота аллеля не меняется</div><p>Доля гетерозигот умножается на (1 − F), а освободившаяся доля делится между гомозиготами пропорционально частотам аллелей. Частота аллеля A при этом остаётся p. Пример: p = 0,7, F = 0,25 → AA 0,5425; Aa 0,315; aa 0,1425 (вместо 0,49; 0,42; 0,09); частота A — по-прежнему 0,7.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-nonrandom-mating">«Неслучайное скрещивание: инбридинг и ассортативное скрещивание»</a></p><p>Доля рецессивных гомозигот при F = 0,25 выросла в 1,6 раза. Поэтому инбридинг повышает долю особей с редкими рецессивными признаками и может снижать среднюю приспособленность потомства — инбредная депрессия.</p><details><summary>Формула и расчёт</summary><p>При инбридинге доли генотипов: AA — p²(1 − F) + pF; Aa — 2pq(1 − F); aa — q²(1 − F) + qF. Для редкого аллеля рост относительно больше: при q = 0,01 и F = 0,0625 доля aa — 0,0001 × 0,9375 + 0,01 × 0,0625 ≈ 0,00072, то есть в 7 раз выше, чем при случайном скрещивании (расчёт по формуле).</p></details><p><b>На практикуме.</b> Вкладка 2, шаг 2.3.</p><p><b>Ограничения.</b> Значения F на практикуме условные.</p><div class="static-quiz"><h3>При F = 1 (полный инбридинг) какая доля гетерозигот?</h3><ol><li><b>А.</b> 0 <i>(верный вариант)</i><br><span class="expl">2pq × (1 − 1) = 0; все особи гомозиготны</span></li><li><b>Б.</b> 2pq, как обычно <i>(неверный вариант)</i><br><span class="expl">Каждая единица F уменьшает долю гетерозигот</span></li><li><b>В.</b> 0,5 при любой частоте <i>(неверный вариант)</i><br><span class="expl">Доля гетерозигот зависит от F и частоты; при F = 1 она равна нулю</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-13.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели инбридинга; F условный.</p></details></article><article class="card print-unit" id="ns-wahlund"><div class="eyebrow">Структура популяции · шаг 11 из 34</div><h2>Объединение групп: эффект Валунда</h2><p class="lead">Дефицит гетерозигот возникает и без инбридинга — если в одну выборку объединены группы с разными частотами аллелей.</p><div class="note"><strong>Что показывает схема.</strong> Дефицит гетерозигот растёт с различием частот групп</div><p><a href="#ns-g-S13-T24">Популяционная структура</a> — неоднородность частот аллелей между группами особей внутри популяции. Пусть две равные группы в равновесии: в первой p = 0,9, во второй p = 0,3. Гетерозигот в них 0,18 и 0,42, в объединённой выборке в среднем 0,30. Общая частота p̄ = 0,6, и модель ждёт 2 × 0,6 × 0,4 = 0,48. Разность 0,18 — <a href="#ns-g-S13-T25">дефицит гетерозигот</a> — равна удвоенной дисперсии частот между группами (2 × 0,09). Это <a href="#ns-g-S13-T26">эффект Валунда</a>: дефицит гетерозигот относительно ожидания по общей частоте при объединении групп с разными частотами, даже если каждая группа в равновесии.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-hw-null">«Модель Харди–Вайнберга: ожидаемые доли генотипов»</a>, шаг <a href="#ns-inbreeding">«Инбридинг повышает гомозиготность, не меняя частот аллелей»</a></p><p>Чем сильнее различаются частоты групп, тем больше дефицит: 0,7 и 0,5 → 0,02; 0,8 и 0,4 → 0,08; 0,9 и 0,3 → 0,18; при одинаковых частотах дефицита нет. Структура важна для медицинской генетики: если смешать в одном исследовании группы с разными частотами вариантов и разной частотой признака, вариант может оказаться статистически связан с признаком из-за происхождения участников, а не из-за своего действия.</p><details><summary>Формула и расчёт</summary><p>Меру различия частот между группами выражают через гетерозиготность: <a href="#ns-g-S13-T27">F_ST</a> = (H_T − H_S) / H_T, где H_T — ожидаемая доля гетерозигот при общей частоте, H_S — средняя доля внутри групп; в примере F_ST = (0,48 − 0,30)/0,48 = 0,375.</p></details><p><b>На практикуме.</b> Вкладка 2, шаги 2.1, 2.2, 2.4.</p><p><b>Ограничения.</b> Группы в модели равные и не обмениваются особями.</p><div class="static-quiz"><h3>Две равные группы в равновесии: p = 0,6 и p = 0,6. Каков дефицит гетерозигот при объединении?</h3><ol><li><b>А.</b> 0,18 <i>(неверный вариант)</i><br><span class="expl">0,18 — при частотах 0,9 и 0,3</span></li><li><b>Б.</b> Нуль <i>(верный вариант)</i><br><span class="expl">Дефицит возникает только из различия частот</span></li><li><b>В.</b> 0,48 <i>(неверный вариант)</i><br><span class="expl">0,48 — сама ожидаемая доля гетерозигот</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-13.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели; частоты групп условные.</p></details></article><article class="card print-unit" id="ns-deficit-causes"><div class="eyebrow">Структура популяции · шаг 12 из 34</div><h2>Почему дефицит гетерозигот не называет причину</h2><p class="lead">Один и тот же наблюдаемый результат — дефицит гетерозигот — дают разные процессы. Чтобы назвать причину, нужны дополнительные данные.</p><div class="note"><strong>Что показывает схема.</strong> Четыре причины дефицита гетерозигот и данные, которые их различают</div><p>Инбридинг даёт дефицит по всем локусам и связан с родством родителей. Скрытая структура даёт дефицит по локусам, частоты которых различаются между группами, и исчезает, если считать группы отдельно. Отбор против гетерозигот даёт дефицит в одном локусе и у взрослых, но не у новорождённых. Ошибки определения генотипов (например, когда второй аллель гетерозиготы не выявлен) дают дефицит, который исчезает при повторном генотипировании. Поэтому различают причины по происхождению образцов, родству, возрасту особей, числу затронутых локусов и качеству генотипирования.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-inbreeding">«Инбридинг повышает гомозиготность, не меняя частот аллелей»</a>, шаг <a href="#ns-wahlund">«Объединение групп: эффект Валунда»</a></p><p>Это общий принцип раздела: наблюдение (отклонение от нулевой модели) отделяют от его объяснения. Отклонение от модели само по себе не доказывает ни инбридинг, ни отбор. Пример из исследований древней ДНК: из 38 участков генома, где прежние работы видели отбор, 20 не подтвердились при более тщательном учёте происхождения людей — в большинстве случаев, по оценке авторов, сигнал создавало смешение групп с разными частотами.</p><p><b>На практикуме.</b> Вкладка 2, «Найти причину».</p><p><b>Ограничения.</b> Таблица причин учебная: в реальной выборке процессы действуют одновременно.</p><div class="static-quiz"><h3>Дефицит гетерозигот исчез, когда выборку разделили по поселениям. Какая причина вероятнее?</h3><ol><li><b>А.</b> Инбридинг <i>(неверный вариант)</i><br><span class="expl">Дефицит от инбридинга остался бы и внутри поселений</span></li><li><b>Б.</b> Отбор против гетерозигот <i>(неверный вариант)</i><br><span class="expl">Отбор действовал бы внутри каждого поселения</span></li><li><b>В.</b> Скрытая структура <i>(верный вариант)</i><br><span class="expl">Внутри поселений равновесие, дефицит был свойством объединённой выборки</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-13.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/s41586-026-10358-1">Akbari A. et al. Ancient DNA reveals pervasive directional selection across West Eurasia. Nature 2026</a></li></ul><p>Схема качественная: сравнение ожидаемых данных при четырёх причинах.</p></details></article><article class="card print-unit" id="ns-deep-structure"><div class="eyebrow">Структура популяции · шаг 13 из 34</div><h2>Предки современного человека — две популяции, а не одна</h2><p class="lead">Структура бывает не только у современной популяции: глубокая структура предков тоже оставляет след в геномах.</p><div class="note"><strong>Что показывает схема.</strong> Шкала времени двух предковых популяций с расхождением и слиянием</div><p>По геномам современных людей из 26 популяций мира сравнили две истории предков: одна популяция с меняющейся численностью или две популяции, которые разошлись и позже слились (<a href="#ns-g-S13-T28">слияние популяций</a>). Лучше описывает данные вторая модель: две <a href="#ns-g-S13-T29">предковые популяции</a> разошлись около 1,5 млн лет назад и слились около 300 тыс. лет назад; 79 % предков современных людей — из предковой популяции 1 и 21 % — из предковой популяции 2. Вклад второй популяции общий для всех современных людей, поэтому сравнение одних популяций с другими его не выявляло.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-wahlund">«Объединение групп: эффект Валунда»</a>, шаг <a href="#ns-deficit-causes">«Почему дефицит гетерозигот не называет причину»</a></p><p>Работа исходит из того, что одна и та же кривая «численности во времени», рассчитанная в допущении единой популяции, может быть получена и разделённой популяцией; новое — способ различить эти истории по тому, как сменяют друг друга соседние участки генома. Поэтому одно число «эффективной численности человека» — усреднённая величина модели единой популяции.</p><p><b>Как это узнали.</b> По одному геному человека посмотрели, как меняется время до общего предка двух копий ДНК вдоль хромосомы: у разделённой и вновь слившейся популяции соседние участки сменяют друг друга иначе.</p><p><b>Граница вывода.</b> Времена и доли — точечные оценки одной модели без доверительных интервалов (длительность поколения 29 лет — допущение); авторы допускают несколько эпизодов расхождения и смешения; каким ископаемым формам соответствуют две популяции, работа не устанавливает.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 2.</p><div class="static-quiz"><h3>Что означает соотношение 79 : 21?</h3><ol><li><b>А.</b> Доли двух предковых популяций по модели <i>(верный вариант)</i><br><span class="expl">Это оценка модели для всех современных людей</span></li><li><b>Б.</b> Доли неандертальцев и денисовцев <i>(неверный вариант)</i><br><span class="expl">Обе популяции — предковые для нашего вида; неандертальский вклад меньше и позднее</span></li><li><b>В.</b> Доли Африки и Евразии сейчас <i>(неверный вариант)</i><br><span class="expl">Слияние предшествует расселению и общее для всех 26 популяций</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-13.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41588-025-02117-1">Cousins T., Scally A., Durbin R. A structured coalescent model reveals deep ancestral structure shared by all modern humans. Nat Genet 2025; 57: 856–864</a></li></ul><p>Схема по данным работы, упрощённая · времена и доли — оценки модели.</p></details></article><article class="card print-unit" id="ns-inbreeding-vs-structure"><div class="eyebrow">Структура популяции · шаг 14 из 34</div><h2>Инбридинг и структура: одно наблюдение — две причины</h2><p class="lead">По одному локусу инбридинг и скрытая структура неразличимы; различие появляется, если смотреть на выборку иначе.</p><div class="note"><strong>Что показывает схема.</strong> Одинаковый дефицит от структуры и от инбридинга и способы их различить</div><p>В модели объединённая выборка двух групп с частотами 0,9 и 0,3 даёт долю гетерозигот 0,30 при ожидании 0,48. Тот же дефицит в одной популяции с частотой 0,6 дал бы инбридинг с F = 0,375: 0,48 × (1 − 0,375) = 0,30. По одной таблице генотипов эти случаи неразличимы. Различают их три вещи: разделение выборки (дефицит структуры исчезает внутри групп, дефицит инбридинга остаётся); другие локусы (инбридинг снижает гетерозиготность во всех локусах одинаково — умножает её на (1 − F), а структура — по-разному, в зависимости от того, насколько различаются частоты групп в каждом локусе); родство родителей.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-inbreeding">«Инбридинг повышает гомозиготность, не меняя частот аллелей»</a>, шаг <a href="#ns-wahlund">«Объединение групп: эффект Валунда»</a></p><p>Процессы складываются: при инбридинге F = 0,25 внутри тех же групп доля гетерозигот — 0,30 × 0,75 = 0,225. Неравные группы (80 % и 20 % выборки) с теми же частотами дают общую частоту 0,78 и дефицит 0,115 — тоже равный удвоенной дисперсии частот.</p><p><b>Граница вывода.</b> Вывод учебной модели одного локуса; оценка F по реальным данным требует многих локусов.</p><p><b>На практикуме.</b> Вкладка 2, переключатели «Различие частот» и «Инбридинг внутри групп».</p><div class="static-quiz"><h3>Как по многим локусам отличить инбридинг от скрытой структуры?</h3><ol><li><b>А.</b> По одному локусу это видно сразу же <i>(неверный вариант)</i><br><span class="expl">По одному локусу дефицит от двух причин может совпасть</span></li><li><b>Б.</b> Гетерозиготность падает одинаково везде <i>(верный вариант)</i><br><span class="expl">При инбридинге она в каждом локусе умножается на (1 − F); структура действует по-разному</span></li><li><b>В.</b> Никак: причины неразличимы <i>(неверный вариант)</i><br><span class="expl">Различимы — по многим локусам, разделению выборки и родству</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-13.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · частоты групп и F условные.</p></details></article><article class="card print-unit" id="ns-drift"><div class="eyebrow">Случайность и численность · шаг 15 из 34</div><h2>Генетический дрейф: случайная выборка копий</h2><p class="lead">В каждом поколении потомкам передаётся конечное число копий генов. Поэтому частоты аллелей меняются случайно — это <a href="#ns-g-S13-T14">генетический дрейф</a>.</p><div class="note"><strong>Что показывает схема.</strong> Поколение из 20 копий, случайная выборка, новая частота</div><p>Простейшее описание — <a href="#ns-g-S13-T30">модель Райта–Фишера</a>. Как при подбрасывании монеты 20 раз выпадает не обязательно 10 «орлов», так и 20 копий при p = 0,5 не обязательно содержат 10 копий A. Частота блуждает; дойдя до 0, аллель теряется (<a href="#ns-g-S13-T31">потеря аллеля</a>), до 1 — закрепляется (<a href="#ns-g-S13-T32">закрепление аллеля</a>), и без мутаций и миграции эти состояния окончательны.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-population">«Что изучает популяционная генетика: особь не эволюционирует, меняется популяция»</a>, шаг <a href="#ns-hw-assumptions">«Пять допущений нулевой модели и что даёт нарушение каждого»</a></p><details><summary>Формула и расчёт</summary><p>Модель Райта–Фишера: в каждом поколении N особей; их 2N копий набираются случайно из копий родителей, и вероятность взять копию A равна её частоте.</p></details><p>Дрейф не имеет направления и не связан с приспособленностью: в модели все генотипы оставляют потомков с равной вероятностью. «Случайный» здесь не значит «беспричинный»: причина — конечное число копий, а непредсказуем исход в каждой отдельной популяции. Дрейф — не мутация: он не создаёт вариантов, а меняет доли уже существующих.</p><p><b>На практикуме.</b> Вкладка 3: десять повторов — десять независимых популяций в одинаковых условиях.</p><p><b>Ограничения.</b> Модель не учитывает перекрывания поколений, отбора и мутаций.</p><div class="static-quiz"><h3>Чем генетический дрейф отличается от мутации?</h3><ol><li><b>А.</b> Дрейф создаёт новые аллели <i>(неверный вариант)</i><br><span class="expl">Новые аллели создают мутации</span></li><li><b>Б.</b> Ничем: оба случайны <i>(неверный вариант)</i><br><span class="expl">Оба случайны, но мутация меняет последовательность, а дрейф — частоты</span></li><li><b>В.</b> Дрейф не создаёт аллелей <i>(верный вариант)</i><br><span class="expl">Новых вариантов он не создаёт</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · случайные траектории воспроизводимы (закреплённые начальные значения генератора).</p></details></article><article class="card print-unit" id="ns-drift-size"><div class="eyebrow">Случайность и численность · шаг 16 из 34</div><h2>Сила дрейфа зависит от численности</h2><p class="lead">Чем меньше копий передаётся в каждом поколении, тем сильнее случайные колебания частот.</p><div class="note"><strong>Что показывает схема.</strong> Десять траекторий частоты при трёх численностях</div><p>В модели (p0 = 0,5; 100 поколений; 10 повторов) при N = 10 аллель A во всех повторах потерян или закреплён (3 и 7), при N = 100 закреплён в одном повторе, в остальных частоты разошлись от 0,19 до 0,95, при N = 1000 все частоты сохранились между 0,26 и 0,61. Средняя по многим популяциям доля гетерозигот в каждом поколении умножается на (1 − 1/2N): через 100 поколений при начальной 0,5 — 0,003 (N = 10), 0,30 (N = 100), 0,48 (N = 1000).</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-drift">«Генетический дрейф: случайная выборка копий»</a></p><p>Дрейф действует в любой конечной популяции; в большой он слабее, но за много поколений тоже меняет частоты. Внутри каждой популяции дрейф уменьшает разнообразие, а между популяциями — увеличивает различия: частоты расходятся. Это проверили на 107 одинаковых популяциях дрозофил по 16 особей с начальной частотой 0,5: за 19 поколений частоты разошлись вплоть до закрепления и потери, а гетерозиготность снижалась даже быстрее, чем предсказывала численность 16.</p><p><b>На практикуме.</b> Вкладка 3, шаги 3.1, 3.6.</p><p><b>Ограничения.</b> Повторы показаны при одной начальной частоте 0,5.</p><div class="static-quiz"><h3>Что происходит в одной малой популяции и в совокупности многих малых популяций?</h3><ol><li><b>А.</b> Разнообразие внутри падает, различия растут <i>(верный вариант)</i><br><span class="expl">В каждой аллели теряются или закрепляются, причём в разных популяциях разные</span></li><li><b>Б.</b> В каждой разнообразие растёт <i>(неверный вариант)</i><br><span class="expl">Дрейф теряет аллели, а не создаёт</span></li><li><b>В.</b> Все популяции становятся одинаковыми <i>(неверный вариант)</i><br><span class="expl">Дрейф идёт независимо в каждой популяции, и частоты расходятся</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель Райта–Фишера · итоги повторов — из эталона модели.</p></details></article><article class="card print-unit" id="ns-census-effective"><div class="eyebrow">Случайность и численность · шаг 17 из 34</div><h2>Фактическая и эффективная численность</h2><p class="lead">Число особей в популяции — <a href="#ns-g-S13-T33">фактическая численность</a>. Для дрейфа важна другая величина — <a href="#ns-g-S13-T34">эффективная численность</a> Ne.</p><div class="note"><strong>Что показывает схема.</strong> Эффективная численность при разном соотношении размножающихся самцов и самок</div><p>Эффективная численность — численность идеальной популяции Райта–Фишера, в которой дрейф шёл бы с той же скоростью (например, с той же скоростью потери гетерозиготности), что и в реальной популяции. Почти всегда Ne меньше фактической численности. Пример: если из 500 взрослых размножаются лишь 20 самцов и 480 самок, Ne = 76,8. Половина генов потомства прошла через 20 самцов.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-drift-size">«Сила дрейфа зависит от численности»</a></p><details><summary>Формула и расчёт</summary><p>Ne = 4 × Nm × Nf / (Nm + Nf) = 4 × 20 × 480 / 500 = 76,8, где Nm и Nf — числа размножающихся самцов и самок.</p></details><p>Ne нельзя приравнивать ни к числу обследованных, ни к числу половозрелых особей. Ne зависит от модели и от того, по какому эффекту её оценивают — по скорости дрейфа, накоплению инбридинга или генетическому разнообразию. В эксперименте с дрозофилами (16 особей в каждой популяции) потеря гетерозиготности соответствовала Ne около 9; вероятные причины — гибель части мух до размножения и то, что часть самцов не спаривалась.</p><p><b>На практикуме.</b> Вкладка 3, панель «Численность», шаг 3.3.</p><p><b>Ограничения.</b> Формула для соотношения полов предполагает случайное число потомков у каждой особи.</p><div class="static-quiz"><h3>Размножаются 250 самцов и 250 самок. Какова Ne по соотношению полов?</h3><ol><li><b>А.</b> 250 <i>(неверный вариант)</i><br><span class="expl">Самцы и самки вместе передают гены; 4 × 250 × 250 / 500 = 500</span></li><li><b>Б.</b> 500 <i>(верный вариант)</i><br><span class="expl">При равном числе самцов и самок Ne равна числу размножающихся</span></li><li><b>В.</b> 1000 <i>(неверный вариант)</i><br><span class="expl">Ne не больше числа размножающихся особей в этой формуле</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/hdy.2016.43">Wang J., Santiago E., Caballero A. Prediction and estimation of effective population size. Heredity 2016; 117: 193–206</a></li></ul><p>Расчёт по формуле; численности условные.</p></details></article><article class="card print-unit" id="ns-ne-causes"><div class="eyebrow">Случайность и численность · шаг 18 из 34</div><h2>Почему эффективная численность меньше фактической</h2><p class="lead">Эффективная численность уменьшается всякий раз, когда вклад особей в следующее поколение неравен.</p><div class="note"><strong>Что показывает схема.</strong> Три причины, по которым Ne меньше фактической численности</div><p>Причины: 1) неравное число размножающихся самцов и самок (20 и 480 → Ne 76,8; 5 и 495 → 19,8; 1 и 499 → около 4); 2) большой разброс числа потомков: если немногие особи оставляют большую часть потомства, генофонд следующего поколения уже, чем позволяет число взрослых; 3) колебания численности по поколениям; 4) неравный вклад локальных групп; 5) перекрывание поколений и особенности размножения. При постоянной численности и случайном (пуассоновском) числе потомков Ne близка к N; чем больше разброс, тем Ne меньше.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-census-effective">«Фактическая и эффективная численность»</a></p><p>Колебания численности. При меняющейся численности Ne за ряд поколений приблизительно равна гармоническому среднему их численностей. Гармоническое среднее сильнее всего зависит от наименьших значений, поэтому долговременная Ne определяется прежде всего поколениями с малой численностью, а не периодами роста: после сокращения разнообразие долго остаётся сниженным. Пример расчёта: для ряда 1000, 1000, 10, 1000, 1000 Ne ≈ 48, хотя среднее арифметическое — 802.</p><details><summary>Формула и расчёт</summary><p>Гармоническое среднее: 1/Ne равно среднему значению 1/N по поколениям.</p></details><p><b>На практикуме.</b> Вкладка 3, панель «Численность».</p><p><b>Ограничения.</b> Формулы приближённые и относятся к идеализированным условиям.</p><div class="static-quiz"><h3>Почему одно поколение с численностью 10 сильно снижает долговременную Ne популяции, которая в остальное время насчитывает 1000 особей?</h3><ol><li><b>А.</b> Численность учитывают в среднем, поэтому почти не снижает <i>(неверный вариант)</i><br><span class="expl">Ne определяется не средней численностью, а поколениями с малой</span></li><li><b>Б.</b> Потому что выжившие — самые приспособленные <i>(неверный вариант)</i><br><span class="expl">Дело не в приспособленности, а в числе переданных копий</span></li><li><b>В.</b> Все потомки происходят от немногих выживших <i>(верный вариант)</i><br><span class="expl">Генофонд прошёл через 20 копий, и разнообразие долго остаётся сниженным</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li><li><a href="https://doi.org/10.1038/hdy.2016.43">Wang J., Santiago E., Caballero A. Prediction and estimation of effective population size. Heredity 2016; 117: 193–206</a></li><li><a href="https://doi.org/10.1038/nrg2526">Charlesworth B. Effective population size and patterns of molecular evolution and variation. Nat Rev Genet 2009; 10: 195–205</a></li></ul><p>Расчёт по формулам; численности условные.</p></details></article><article class="card print-unit" id="ns-bottleneck-founder"><div class="eyebrow">Случайность и численность · шаг 19 из 34</div><h2>Узкое место и эффект основателя</h2><p class="lead">Два демографических сценария особенно усиливают дрейф: резкое сокращение численности и основание новой группы немногими особями.</p><div class="note"><strong>Что показывает схема.</strong> Узкое место и эффект основателя на траекториях и копиях</div><p><a href="#ns-g-S13-T35">Узкое место</a> — резкое временное сокращение численности. Выжившие несут лишь часть прежнего разнообразия, и её состав может отличаться от исходного; утраченные аллели без мутаций и миграции не возвращаются, даже когда численность восстановится. <a href="#ns-g-S13-T36">Эффект основателя</a> — изменение частот при основании группы немногими переселенцами: частоты определяются составом основателей. Пример расчёта: из популяции, где частота варианта 0,01, пятеро основателей несут 10 копий гена. С вероятностью около 0,90 копии варианта среди них нет, с вероятностью около 0,09 — ровно одна, и тогда частота варианта в новой группе 0,1 — в десять раз выше исходной без какого-либо его преимущества.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-drift-size">«Сила дрейфа зависит от численности»</a>, шаг <a href="#ns-ne-causes">«Почему эффективная численность меньше фактической»</a></p><p>В модели (N = 1000, в поколениях 21–23 — 10 особей) частоты в 10 повторах после узкого места разошлись от 0,09 до 0,95 и затем почти не менялись. Высокая частота редкого патогенного варианта в изолированной группе может объясняться эффектом основателя, дрейфом и последующим ростом численности, а не преимуществом варианта; так объясняют, например, высокую частоту наследственной полной цветовой слепоты у жителей атолла Пингелап — потомков 20 человек, переживших тайфун и последовавший голод; один из них был гетерозиготным носителем.</p><p><b>На практикуме.</b> Вкладка 3, шаги 3.4, 3.5.</p><p><b>Ограничения.</b> Клинический пример приводится для демонстрации значения эволюционного механизма.</p><div class="static-quiz"><h3>После узкого места численность восстановилась. Вернётся ли утраченный аллель?</h3><ol><li><b>А.</b> Только с мутацией или мигрантом <i>(верный вариант)</i><br><span class="expl">Восстановившаяся популяция — потомки немногих выживших</span></li><li><b>Б.</b> Да, вместе с численностью <i>(неверный вариант)</i><br><span class="expl">Численность восстанавливают копии выживших, а утраченный аллель среди них отсутствует</span></li><li><b>В.</b> Да, если он был полезен <i>(неверный вариант)</i><br><span class="expl">Отбор действует только на существующие варианты</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · вероятности — расчёт по биномиальному распределению; численности условные.</p></details></article><article class="card print-unit" id="ns-fixation"><div class="eyebrow">Случайность и численность · шаг 20 из 34</div><h2>Что происходит с новым нейтральным вариантом и почему важна величина Ne·s</h2><p class="lead"><a href="#ns-g-S13-T37">Нейтральный вариант</a> не влияет на приспособленность. Закрепится он или будет потерян, определяется только дрейфом.</p><div class="note"><strong>Что показывает схема.</strong> Вероятность закрепления равна частоте; Ne·s определяет роль отбора</div><p>Вероятность того, что нейтральный аллель в итоге закрепится, равна его текущей частоте: при 0,2 — 0,2. Закрепление аллеля в популяции — не то же, что закрепление изменения ДНК при репликации. Новая мутация в популяции из N диплоидных особей — одна копия из 2N; она закрепляется с вероятностью 1/2N и в подавляющем большинстве случаев теряется. Если вариант влияет на приспособленность (относительная разница приспособленности s), его поведение определяется произведением эффективной численности на эту разницу — Ne·s (в формулах следующего семинара — 2Ne·s): при малом Ne·s исход зависит в основном от случая, и даже полезный вариант может быть потерян, а слабовредный — закрепиться; при большом Ne·s определяющим становится отбор.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-drift">«Генетический дрейф: случайная выборка копий»</a>, шаг <a href="#ns-census-effective">«Фактическая и эффективная численность»</a></p><p>В модели проверено: из 2000 популяций по 10 особей с начальной частотой 0,2 аллель закрепился в доле 0,195 (расчёт по модели; ожидание 0,2). Важнее не жёсткая граница между «нейтральными» и «отбираемыми» вариантами, а соотношение отбора и дрейфа при данной численности.</p><p><b>На практикуме.</b> Вкладка 3, шаг 3.2.</p><p><b>Ограничения.</b> Утверждение о вероятности закрепления относится к нейтральному аллелю без мутаций и миграции.</p><div class="static-quiz"><h3>Новая нейтральная мутация в популяции из 50 особей. Какова вероятность её закрепления?</h3><ol><li><b>А.</b> 1/2 — закрепится или нет <i>(неверный вариант)</i><br><span class="expl">Два исхода не равновероятны: вероятность равна частоте</span></li><li><b>Б.</b> 1/100 <i>(верный вариант)</i><br><span class="expl">Одна копия из 100</span></li><li><b>В.</b> 1/50 <i>(неверный вариант)</i><br><span class="expl">Копий локуса 100, а не 50</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Расчёт по модели Райта–Фишера.</p></details></article><article class="card print-unit" id="ns-deep-bottleneck"><div class="eyebrow">Случайность и численность · шаг 21 из 34</div><h2>Сокращение численности предков около 900 тыс. лет назад</h2><p class="lead">Историю численности предков восстанавливают по геномам современных людей; одна из таких реконструкций вызвала спор, который не закрыт.</p><div class="note"><strong>Что показывает схема.</strong> Две кривые истории численности в одинаковом оформлении и три пункта расхождения</div><p>Утверждение: по распределению редких и частых вариантов в геномах 3154 современных людей у предков всех десяти изученных африканских популяций около 930–813 тыс. лет назад резко сократилась численность: эффективная численность около 1280 (в разных популяциях — от 0,77 до 2,03 тыс.) — примерно 1,3 % прежней, в течение около 117 тыс. лет. У неафриканских популяций прямо этот сигнал не найден; авторы обнаружили лишь его «скрытый след» видоизменённым методом и объясняют различие последующим выходом из Африки. Возражение: неафриканцы отделились от ближайших африканских групп менее 100 тыс. лет назад, поэтому событие 900 тыс. лет назад должно было оставить одинаковый след у всех; разные истории численности дают очень похожее ожидаемое <a href="#ns-g-S13-T38">распределение частот вариантов</a>, а на компьютерных данных без резкого сокращения тот же метод находит ложное сокращение; другие методы его не воспроизводят. Авторы утверждения ответили, что их расчёт ожидаемого распределения точнее и что пример ложного сокращения построен неверно.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-census-effective">«Фактическая и эффективная численность»</a>, шаг <a href="#ns-bottleneck-founder">«Узкое место и эффект основателя»</a></p><p>Стороны расходятся в трёх пунктах: как рассчитывать ожидаемое распределение частот вариантов; есть ли сигнал у неафриканцев; как учитывать ошибки определения предкового варианта. Каждая сторона сравнивает модели своим расчётом. Число 1280 — эффективная численность в модели, а не перепись людей (шаг <a href="#ns-census-effective">«Фактическая и эффективная численность»</a>).</p><p><b>Как это узнали.</b> Обе стороны рассчитывали, какое распределение редких и частых вариантов дала бы каждая история численности, и проверяли методы на компьютерных популяциях с известной историей.</p><p><b>Граница вывода.</b> Спор не закрыт: «недостаточно данных для сокращения» не равно «сокращения не было». По мнению авторов возражения, это событие не то же, что сокращение численности одной из предковых популяций в шаг <a href="#ns-deep-structure">«Предки современного человека — две популяции, а не одна»</a>; с выходом из Африки оно не связано по времени.</p><p><b>На практикуме.</b> Продвинутый уровень, вкладка 3: две позиции оформлены одинаково.</p><div class="static-quiz"><h3>Что надо знать, чтобы выбрать между позициями?</h3><ol><li><b>А.</b> Сколько людей похоронено в ту эпоху <i>(неверный вариант)</i><br><span class="expl">Численность по находкам прямо не оценивают; сторона утверждения приводит ископаемые и климат как согласующиеся данные</span></li><li><b>Б.</b> Какой вариант гена был тогда частым <i>(неверный вариант)</i><br><span class="expl">Частоты прошлого здесь восстанавливают по современным геномам — это и есть предмет спора</span></li><li><b>В.</b> Чей расчёт ожидаемых частот точнее <i>(верный вариант)</i><br><span class="expl">Каждая сторона сравнивает модели своим расчётом, и стороны не согласны, чей точнее</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.abq7487">Hu W. et al. Genomic inference of a severe human bottleneck during the Early to Middle Pleistocene transition. Science 2023; 381: 979–984</a></li><li><a href="https://doi.org/10.1093/molbev/msaf041">Cousins T., Durvasula A. Mol Biol Evol 2025; 42: msaf041</a></li><li><a href="https://doi.org/10.1093/genetics/iyae192">Deng Y., Nielsen R., Song Y.S. Genetics 2025; 229: iyae192</a></li><li><a href="https://doi.org/10.1093/molbev/msag157">Zhou S., Zhou Y., Di Vincenzo F., Manzi G., Hu W., Hao Z., Shao Z., Pan Y.-H., Li H. Mol Biol Evol 2026; 43: msag157</a></li></ul><p>Качественная схема двух опубликованных позиций; кривые условны.</p></details></article><article class="card print-unit" id="ns-fixation-model"><div class="eyebrow">Случайность и численность · шаг 22 из 34</div><h2>Вероятность закрепления равна частоте</h2><p class="lead">Утверждение о вероятности закрепления можно проверить на модели, повторив дрейф много раз.</p><div class="note"><strong>Что показывает схема.</strong> Доля закреплений приближается к 0,2 с ростом числа повторов</div><p>Модель Райта–Фишера: популяция из 10 особей, начальная частота аллеля 0,2, отбора, мутаций и миграции нет; каждую популяцию ведут, пока аллель не закрепится или не потеряется. Из двух тысяч таких популяций аллель закрепился в 390 (доля 0,195), в остальных потерян. Почему так: каждая из 20 копий с равной вероятностью может стать предком всех копий будущего; 4 копии из 20 — это вероятность 0,2.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-fixation">«Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a></p><p>Отсюда два следствия. Нейтральный редкий вариант почти всегда теряется; частый — чаще закрепляется. Скорость закрепления новых нейтральных вариантов в популяции равна скорости мутаций: в большой популяции их возникает больше, но каждый закрепляется реже.</p><p><b>Граница вывода.</b> Расчёт по модели с конечным числом повторов: доля 0,195 отличается от 0,2 случайно.</p><p><b>На практикуме.</b> Вкладка 3: десять повторов при N = 10 — малая часть этого расчёта.</p><div class="static-quiz"><h3>В двух тысячах популяций доля закреплений 0,195, а ожидание 0,2. Почему не точно 0,2?</h3><ol><li><b>А.</b> Повторов конечное число <i>(верный вариант)</i><br><span class="expl">Доля в конечном числе повторов колеблется около 0,2</span></li><li><b>Б.</b> Аллель слабо вреден <i>(неверный вариант)</i><br><span class="expl">В модели отбора нет</span></li><li><b>В.</b> Формула неверна для N = 10 <i>(неверный вариант)</i><br><span class="expl">Равенство вероятности закрепления частоте не зависит от N</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-13.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · две тысячи повторов; итог — из эталона модели.</p></details></article><article class="card print-unit" id="ns-sources"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 23 из 34</div><h2>Мутации, рекомбинация и поток генов: источники и переносчики изменчивости</h2><p class="lead">Новые варианты и их новые сочетания появляются тремя разными путями, а частоту появившихся вариантов дальше меняют отбор, дрейф и миграция.</p><div class="note"><strong>Что показывает схема.</strong> Три источника и переносчика изменчивости</div><p><a href="#ns-g-S13-T39">Мутация</a> создаёт новый аллель: изменение последовательности ДНК закрепляется при репликации и, если оно произошло в клетках зародышевой линии, передаётся потомкам. <a href="#ns-g-S13-T40">Рекомбинация</a> при мейозе соединяет уже существующие аллели в новые сочетания: из гаплотипов A B и a b получаются A b и a B; новых аллелей она не создаёт. <a href="#ns-g-S13-T41">Поток генов</a> — перенос вариантов между популяциями с мигрантами или гаметами; он может принести вариант, которого в популяции не было, и сдвигает частоты к частотам источника: p′ = (1 − m) × p + m × pм, где m — доля мигрантов, pм — частота у них.</p><p class="base-prep"><b>Базовая подготовка:</b> вспомнить <a href="seminar-8-route.html#error-damage-mutation">семинар 8: «Ошибка спаривания, повреждение и мутация — три разных события»</a>, <a href="seminar-8-route.html#fixation">семинар 8: «Как изменение закрепляется при репликации»</a>, <a href="seminar-6-route.html#crossing-over">семинар 6: «Кроссинговер и хиазмы: обмен и связь»</a></p><p>Мутации случайны относительно своего будущего влияния на приспособленность: они не возникают потому, что окажутся полезны. При этом разные типы мутаций возникают с разной частотой. При изменении условий отбор может действовать на уже имеющийся полиморфизм (<a href="#ns-g-S13-T42">наличная изменчивость</a>) — это быстрее, чем ждать новой мутации. Встраивание <a href="#ns-g-S13-T62">мобильных элементов</a> в новые места генома — ещё один источник изменений последовательности (подробнее — <a href="seminar-14-route.html#transposons">семинар 14: «Мобильные элементы»</a>).</p><p><b>На практикуме.</b> Вкладка 1, шаги 1.4, 1.5; вкладка 4, шаг 4.6.</p><p><b>Ограничения.</b> Классификацию мутаций и их частоты разбирает <a href="seminar-14-route.html#change-types">семинар 14: «Типы изменений: замена, вставка и делеция, структурные изменения»</a>.</p><div class="static-quiz"><h3>Какой процесс создаёт новые сочетания аллелей, но не новые аллели?</h3><ol><li><b>А.</b> Мутация <i>(неверный вариант)</i><br><span class="expl">Мутация создаёт новый аллель</span></li><li><b>Б.</b> Рекомбинация <i>(верный вариант)</i><br><span class="expl">Она переставляет имеющиеся аллели между хромосомами</span></li><li><b>В.</b> Поток генов между популяциями <i>(неверный вариант)</i><br><span class="expl">Поток генов переносит варианты между популяциями</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: хромосомы, гаплотипы и мигранты условны.</p></details></article><article class="card print-unit" id="ns-selection-fitness"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 24 из 34</div><h2>Естественный отбор и приспособленность</h2><p class="lead"><a href="#ns-g-S13-T43">Естественный отбор</a> — неслучайное различие в передаче наследуемых вариантов следующему поколению из-за различий в выживании и размножении их носителей.</p><div class="note"><strong>Что показывает схема.</strong> Компоненты приспособленности и три формы отбора признака</div><p><a href="#ns-g-S13-T44">Приспособленность</a> в популяционной генетике — вклад генотипа в следующее поколение: вероятность дожить до размножения, число потомков и их способность самим оставить потомство. В моделях используют <a href="#ns-g-S13-T45">относительную приспособленность</a> w: самому успешному генотипу приписывают 1, остальным — доли от него; <a href="#ns-g-S13-T46">коэффициент отбора</a> s = 1 − w показывает относительное снижение вклада. Отбор, в отличие от дрейфа, не случаен: в одинаковых условиях он сдвигает частоты в одну сторону во всех популяциях.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-sources">«Мутации, рекомбинация и поток генов: источники и переносчики изменчивости»</a>; вспомнить <a href="seminar-12-route.html#selection">семинар 12: «Условия естественного отбора»</a></p><p>Приспособленность не сводится к продолжительности жизни или физической силе: учитывается вклад в потомство. Один и тот же вариант может быть полезен в одних условиях и вреден в других, а его эффект может зависеть от пола, возраста и вариантов в других локусах. По изменению распределения количественного признака отбор описывают как направленный (смещает среднее), стабилизирующий (уменьшает долю крайних значений) и дизруптивный (повышает успех крайних).</p><p><b>На практикуме.</b> Вкладка 4, панель «Приспособленность».</p><p><b>Ограничения.</b> Однолокусные модели показывают принцип; реальные признаки зависят от многих локусов и среды.</p><div class="static-quiz"><h3>Особь прожила долго, но не оставила потомков. Какова её приспособленность в популяционной генетике?</h3><ol><li><b>А.</b> Высокая — она долго жила <i>(неверный вариант)</i><br><span class="expl">Продолжительность жизни без потомства не даёт вклада в генофонд</span></li><li><b>Б.</b> Средняя <i>(неверный вариант)</i><br><span class="expl">Без потомков вклад равен нулю</span></li><li><b>В.</b> Нулевая <i>(верный вариант)</i><br><span class="expl">Приспособленность — вклад в следующее поколение</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: приспособленности условные.</p></details></article><article class="card print-unit" id="ns-selection-modes"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 25 из 34</div><h2>Как отбор меняет частоты: три режима</h2><p class="lead">Направление и скорость изменения частот при отборе зависят от того, какой генотип приспособлен лучше.</p><div class="note"><strong>Что показывает схема.</strong> Траектории частоты при трёх режимах отбора</div><p>Приспособленности генотипов AA, Aa, aa задают, как меняется частота A. Режимы: 1) <a href="#ns-g-S13-T48">направленный отбор</a> в пользу аллеля (1; 0,95; 0,9): из 0,1 частота A растёт до 0,16 через 10 поколений, 0,36 через 30 и 0,73 через 60; 2) <a href="#ns-g-S13-T49">преимущество гетерозигот</a> (0,8; 1; 0,6): частота приближается к <a href="#ns-g-S13-T50">равновесию</a> около 0,67 — устойчивому, отклонения возвращаются; 3) отбор против гетерозигот (1; 0,8; 1): равновесие 0,5 неустойчиво — из 0,45 аллель A теряется, из 0,55 закрепляется.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-selection-fitness">«Естественный отбор и приспособленность»</a>, шаг <a href="#ns-hw-null">«Модель Харди–Вайнберга: ожидаемые доли генотипов»</a></p><details><summary>Формула и расчёт</summary><p>Модель отбора по выживанию: после отбора частота A — p′ = (p² × wAA + pq × wAa) / w̄, где wAA, wAa, waa — приспособленности генотипов, а <a href="#ns-g-S13-T47">средняя приспособленность</a> w̄ = p² × wAA + 2pq × wAa + q² × waa. Равновесие при преимуществе гетерозигот: t / (s + t) = 0,4 / 0,6 ≈ 0,67, где s = 1 − wAA и t = 1 − waa.</p></details><p>Скорость отбора зависит от частоты и доминантности: редкий рецессивный аллель почти весь находится в гетерозиготах, где отбор на него почти не действует, поэтому вредный рецессивный аллель удаляется медленно, а полезный рецессивный аллель поначалу медленно распространяется.</p><p><b>На практикуме.</b> Вкладка 4, шаги 4.1–4.3.</p><p><b>Ограничения.</b> Численность в модели бесконечна; приспособленности условные.</p><div class="static-quiz"><h3>Приспособленности 0,9; 1; 0,9. К какому равновесию придёт частота A?</h3><ol><li><b>А.</b> 0,5 <i>(верный вариант)</i><br><span class="expl">S = t = 0,1, равновесие t / (s + t) = 0,5</span></li><li><b>Б.</b> 1 — гетерозиготы несут A <i>(неверный вариант)</i><br><span class="expl">Гетерозиготы несут и a; гомозиготы обоих типов уступают им одинаково</span></li><li><b>В.</b> Равновесия нет <i>(неверный вариант)</i><br><span class="expl">При преимуществе гетерозигот есть устойчивое равновесие</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Учебная модель · условные приспособленности; траектории — из эталона.</p></details></article><article class="card print-unit" id="ns-sexual-selection"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 26 из 34</div><h2>Половой отбор</h2><p class="lead"><a href="#ns-g-S13-T51">Половой отбор</a> — отбор по различиям в успехе спаривания и оплодотворения.</p><div class="note"><strong>Что показывает схема.</strong> Два пути полового отбора и цена признака</div><p>Он идёт двумя путями. При внутриполовом отборе особи одного пола (чаще самцы) соревнуются друг с другом за доступ к партнёрам, и победители спариваются чаще. При межполовом отборе успех спаривания особей одного пола зависит от предпочтений особей другого пола. Признак, повышающий успех спаривания, может распространяться, даже если снижает выживание: приспособленность — это вклад в потомство, а не продолжительность жизни.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-selection-fitness">«Естественный отбор и приспособленность»</a></p><p>Половой отбор обычно сильнее у пола, который меньше вкладывает в потомство: его репродуктивный успех сильнее ограничен числом партнёров, чем ресурсами. Это объясняет, почему у многих видов яркие украшения и оружие развиты у самцов. Половой отбор уменьшает эффективную численность, если немногие особи получают большую часть спариваний (шаг <a href="#ns-ne-causes">«Почему эффективная численность меньше фактической»</a>).</p><p><b>На практикуме.</b> Вкладка 3, панель «Численность»: неравное число размножающихся самцов и самок как следствие полового отбора.</p><p><b>Ограничения.</b> Примеры на странице — общие закономерности, без переноса на поведение человека.</p><div class="static-quiz"><h3>Яркий хвост делает самца заметнее для хищников, но самки предпочитают таких самцов. Может ли признак распространиться?</h3><ol><li><b>А.</b> Нет: признак снижает выживание самца <i>(неверный вариант)</i><br><span class="expl">Выживание — лишь часть приспособленности</span></li><li><b>Б.</b> Да, если выигрыш больше потерь <i>(верный вариант)</i><br><span class="expl">Приспособленность — суммарный вклад в потомство</span></li><li><b>В.</b> Только дрейфом <i>(неверный вариант)</i><br><span class="expl">Здесь есть неслучайное различие в успехе спаривания — это отбор</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-13.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li>Herron J.C., Freeman S. Evolutionary Analysis, 5th ed. Pearson, 2014</li></ul><p>Схема качественная: значки особей условны.</p></details></article><article class="card print-unit" id="ns-combined"><div class="eyebrow">Отбор, поток генов, полиморфизм · шаг 27 из 34</div><h2>Совместное действие: отбор против потока генов и против дрейфа</h2><p class="lead">В реальной популяции процессы действуют одновременно, и частота — результат их соотношения.</p><div class="note"><strong>Что показывает схема.</strong> Равновесная частота на острове при разной доле мигрантов</div><p>Отбор и поток генов. Если местный отбор поддерживает аллель, а мигранты каждое поколение приносят другой, устанавливается промежуточное равновесие. Чем сильнее поток генов относительно отбора, тем ближе частота к частоте источника. Отбор и дрейф. Их соотношение определяет Ne·s (в формулах следующего семинара — 2Ne·s; шаг <a href="#ns-fixation">«Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a>): в малой популяции слабый отбор почти не влияет на исход по сравнению с дрейфом.</p><p class="base-prep"><b>Базовая подготовка:</b> шаг <a href="#ns-fixation">«Что происходит с новым нейтральным вариантом и почему важна величина Ne·s»</a>, шаг <a href="#ns-sources">«Мутации, рекомбинация и поток генов: источники и переносчики изменчивости»</a>, шаг <a href="#ns-selection-modes">«Как отбор меняет частоты: три режима»</a></p><details><summary>Формула и расчёт</summary><p>В модели острова (местный отбор 1; 0,9; 0,8; у мигрантов частота A 0,1) равновесная частота A на острове: без мигрантов — 1, при 1 % мигрантов — 0,91, при 5 % — 0,60, при 10 % — 0,33.</p></details><p>Классический природный пример: на островах озера Эри отбор (хищники) благоприятствует водяным змеям без полос, но с материка, где преобладают полосатые, каждое поколение приходят мигранты — около 1 % популяции островов; поэтому полосатые змеи на островах сохраняются (оценки по полевым данным).</p><p><b>На практикуме.</b> Вкладка 4, шаг 4.4; вкладка 3, «Найти причину».</p><p><b>Ограничения.</b> Модель — один остров и неизменный источник; приспособленности условные.</p><div class="static-quiz"><h3>Доля мигрантов выросла с 1 % до 10 %. Что произойдёт с равновесной частотой местно выгодного аллеля?</h3><ol><li><b>А.</b> Не изменится: местный отбор сильнее <i>(неверный вариант)</i><br><span class="expl">Мигранты каждое поколение приносят другой аллель</span></li><li><b>Б.</b> Аллель закрепится быстрее <i>(неверный вариант)</i><br><span class="expl">Мигранты замедляют распространение местно выгодного аллеля</span></li><li><b>В.</b> Снизится к частоте источника <i>(верный вариант)</i><br><span class="expl">0,91 → 0,33 в модели</span></li></ol></div><p class="practice
